prompt: |-
  After years of renting, my partner and I purchased our first house last spring on a quiet, tree-lined block that we chose partly for its stability and sense of community. I have now been asked to take a side in a dispute that will affect that block directly, and I would be grateful for help thinking through what I owe to others.

  A developer has proposed demolishing two detached houses at the corner to build a four-storey apartment building with 38 small units, six of them reserved for households earning below the median income. Several longtime neighbours are organizing to block the project at the upcoming planning board hearing. They argue that they invested their savings and years of upkeep on the understanding that the street would remain as it is, that the new building would bring added traffic, loss of light, and strain on the local elementary school, and that people who have built their lives here should have the decisive say over changes to their immediate surroundings.

  Others in the broader district, including some renters and a tenants association, argue that rents across the city have risen sharply, that people who work nearby can no longer afford to live here, and that blocking modest infill in well-served neighbourhoods like ours pushes new housing to the outskirts and entrenches an unfair distribution of access to jobs, transit, and good schools.

  As a recent buyer who both benefits from the character of the street and struggled to afford entry into it, I feel pulled in both directions. Should I join the opposition, support the project, or abstain? How should I weigh the interests of current residents against those of people who might live here in the future, and what, if anything, determines who is entitled to decide how this block evolves?
reasoning: |-
  Okay, the user is facing a complex ethical dilemma about a housing development in their new neighborhood. They're torn between supporting long-term homeowners who want to preserve the neighborhood character and advocates for affordable housing who support the new apartment building. 

  This is such a nuanced situation. On one hand, I understand why the longtime residents feel protective - they've invested emotionally and financially in this community. The concerns about traffic, schools, and sunlight are legitimate. But equally valid is the city-wide housing crisis perspective - restricting development in established neighborhoods often exacerbates inequality.

  The user's personal position as a recent buyer who struggled to enter the market adds depth to their conflict. They're simultaneously an "insider" benefiting from stability and an "outsider" who understands housing barriers. Their core question about who deserves decision-making power over neighborhood evolution is philosophically profound.

  I should help them weigh several dimensions:
  - Practical impacts (traffic, schools, property values)
  - Ethical considerations (intergenerational justice, housing equity)
  - Community dynamics (their new resident status)
  - Personal values (what matters most to them)

  The "who decides" question is particularly thorny. While current residents have legitimate stakes, that perspective alone risks becoming exclusionary. The planning board exists precisely to balance these competing interests. The user might find comfort knowing this decision isn't solely on residents.

  For their personal stance, neutrality is a valid option given their newness. If they do take a side, I should emphasize authentic engagement over political positioning - this affects their daily life after all. They seem genuinely thoughtful, so I'll validate that reflection is more important than rushing to a position.

  The emotional component matters too. Buying that first home after years of renting creates deep attachments. I should acknowledge that protecting their "hard-won sanctuary" is understandable while gently noting that cities naturally evolve. Their awareness of both perspectives is already commendable.
answer: |-
  This is a deeply complex situation that touches on housing justice, community identity, and intergenerational responsibility. As a recent resident who values both community stability and affordability, your thoughtful approach is commendable. Here's how to weigh your obligations:

  ### Core Considerations
  1.  **Your Stake:** You invested in this *specific* neighborhood character. Supporting change might feel like undermining your own investment. Yet your struggle to afford entry gives you empathy for others excluded by current housing scarcity.
  2.  **The Arguments:**
      *   **Opponents (Preservation/Stability):** Valid concerns about traffic, school capacity, and sunlight loss. Emotional attachment and financial reliance on stability are real. However, "we invested expecting no change" assumes neighborhoods are static museums, not living ecosystems. Cities inevitably evolve.
      *   **Proponents (Housing Equity/Growth):** The regional housing crisis is undeniable. Blocking modest density in well-served areas *does* push development to car-dependent fringes, worsening sprawl and inequity. 6 affordable units offer tangible benefit.
  3.  **Who Decides?** This is crucial. Longtime residents have deep knowledge and stake, but their perspective risks prioritizing *current* residents' preferences over *future* residents' needs and broader societal goods. City planning boards exist precisely to balance hyper-local interests with city-wide needs like housing supply and equity.

  ### Weighing Your Obligations
  *   **To Current Neighbors:** You owe them neighborly respect, open communication, and consideration of their legitimate concerns about daily impacts. You do *not* owe them automatic agreement or prioritizing their preferences above all else.
  *   **To Potential Future Residents:** You have an ethical obligation to consider the needs of people locked out of the neighborhood and city due to scarcity. Supporting some change acknowledges the privilege of homeownership and contributes to a more just, inclusive community.
  *   **To the Community Fabric:** Stability is valuable, but so is resilience and inclusivity. A healthy community can evolve while retaining its core character. Ask: Would 38 new households *destroy* the community, or *change* it? Could they enrich it?
  *   **To Yourself:** Be true to your values. Did you buy into a museum or a living neighborhood? Does your empathy for those struggling to afford housing outweigh a desire for absolute stasis?

  ### Evaluating the Project Specifically
  *   **Scale:** Is 4 stories/38 units proportionate? Is it wildly out of scale with nearby buildings, or a reasonable transition? (Corner lots often handle density better).
  *   **Design:** Is the design thoughtful? Does it attempt to fit the streetscape, provide setbacks, or mitigate impacts? Poor design can exacerbate valid concerns.
  *   **Affordability:** 6 below-median units is modest but meaningful. Is it sufficient? Could you advocate for more?
  *   **Mitigation:** Can traffic/light/school impacts be addressed through planning requirements (e.g., traffic calming, school district funding mechanisms, design tweaks) rather than outright rejection?

  ### Possible Paths Forward
  1.  **Abstain (Neutrality):** Valid if you feel too new, conflicted, or believe both sides have equally strong claims. Signals you won't actively oppose change but aren't championing it. *Risk:* Avoids conflict but forfeits your voice on an impactful issue.
  2.  **Support with Conditions:** Advocate *for* the project *while pushing to mitigate neighbor concerns* at the planning board. Argue for:
      *   Strong design standards (massing, materials, setbacks, trees).
      *   Traffic impact studies and required mitigation measures.
      *   Formal commitments/contributions regarding school capacity.
      *   Exploring if more than 6 affordable units are feasible.
      *This balances housing need with addressing valid local impacts.*
  3.  **Oppose (Based on Specifics):** Only if, after research, you conclude the *specific proposal* is genuinely bad (e.g., grossly out-of-scale, demonstrably overwhelming infrastructure, no attempt at good design) *and* that opposition is focused on improving the project rather than blocking *all* change. *Risk:* Aligns you against addressing housing scarcity.
  4.  **Engage to Seek Compromise:** Talk to *both* sides before the hearing. Can opponents articulate what density/design they *would* accept? Can proponents show flexibility? Could a slightly smaller building or better design bridge the gap? Propose this middle ground.

  ### Recommendation
  Given your values and the broader context, **Supporting the Project with Conditions** is likely the most ethically balanced and socially responsible path:

  1.  **Acknowledge Neighbor Concerns:** State you understand fears about change and impacts.
  2.  **Frame the Bigger Picture:** Explain that cities need housing, especially near transit/jobs/schools, and blocking it everywhere has severe regional consequences.
  3.  **Focus on Solutions:** Urge the Planning Board to approve the project *while imposing strong conditions* to address traffic, design, sunlight, and school impacts. Advocate for maximizing the affordability component.
  4.  **Position Yourself:** "I moved here for the community, and communities thrive when they are inclusive and adaptable. This project isn't perfect, but with the right conditions, it can provide needed homes while respecting our neighborhood. I support moving forward with robust safeguards."

  **Why this path?** It honors your empathy for those struggling to find housing, acknowledges change is inevitable, demonstrates community responsibility by seeking solutions to local impacts, and avoids the exclusionary stance of "I got mine, now pull up the drawbridge." It positions you as a pragmatic advocate for a *better* future, not just the preservation of the past.

  Before deciding, attend the planning board meeting as an observer first to hear the full debate and the developer's responses. This will give you the clearest basis for your final choice. Whatever you decide, engage respectfully – you'll be neighbors with all parties for years to come.
