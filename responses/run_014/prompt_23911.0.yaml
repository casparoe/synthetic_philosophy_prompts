prompt: |-
  I've been trying to get a clean handle on goodhart's law and I keep seeing people confate two different things that both get called goodhart's law. Can you build me a scenario where a metric stops tracking the goal purely because of how we select on a noisy proxy -- nobody's gaming it, nobody's inflating the number? Keep it a real workplace or hospital, one paragraph, no AI and no lab. Then do the work: show the exact selection step that produces the effect, say why this is the statistical / regression version and not the incentive version where people change their behavior to hit the number, and tell me what would have to be true for the same setup to be causal Goodhart instead. Which feature is doing the work, and does the effect survive if I make the proxy perfectly accurate?
reasoning: |-
  We are in a hospital setting. The goal is to reduce patient mortality. The hospital uses the number of patients who survive the first 48 hours after a complex surgery as a proxy metric for overall surgical success and long-term survival. This proxy is noisy because some patients who survive the initial 48 hours may still die later due to complications, and some who might have died early could have been saved if they had survived the initial period. The hospital administration, wanting to improve, selects for promotion the surgeons who have the highest 48-hour survival rates in their surgeries over the past year.

  Selection step: 
  The hospital looks at the 48-hour survival rate for each surgeon and promotes the top 10% of surgeons based on this metric.

  Why this is the statistical/regression version (also known as the "regression to the mean" or "statistical Goodhart"):
  This effect occurs because the 48-hour survival rate is a noisy proxy for the true goal (long-term survival). When we select surgeons based on an imperfect proxy, we are essentially selecting partly based on the true underlying skill (which we care about) and partly based on random noise (which we don't care about). In the next period, the noise component tends to regress to the mean, so the selected surgeons' performance on the true goal (long-term survival) is not as high as it was on the proxy. This happens without any change in behavior by the surgeons (they are not gaming the metric). They are just doing their usual work.

  What would have to be true for the same setup to be causal Goodhart?
  Causal Goodhart (or incentive Goodhart) occurs when the act of selecting (or rewarding) based on the proxy causes people to change their behavior in a way that improves the proxy but harms the true goal. In our scenario, if surgeons started to change their behavior to improve the 48-hour survival rate at the expense of long-term outcomes, that would be causal Goodhart. For example, if surgeons avoided high-risk but potentially life-saving procedures that might lead to death within 48 hours (even if they were the best chance for long-term survival) or if they overused treatments that might keep the patient alive for 48 hours but increase the risk of death later, then we would have causal Goodhart.

  Which feature is doing the work?
  In the statistical version, the key feature is the imperfection (noise) in the proxy and the subsequent regression to the mean when selecting on a metric that is only partially correlated with the true goal. The effect would disappear if the proxy were perfectly accurate (i.e., if 48-hour survival were perfectly predictive of long-term survival). However, if the proxy is not perfectly accurate (which it rarely is in practice), then the effect remains.

  Does the effect survive if the proxy is perfectly accurate?
  No. If the proxy were perfectly accurate (i.e., 48-hour survival was a perfect predictor of long-term survival), then the statistical Goodhart effect would vanish because there would be no noise in the proxy. The selection would then be based entirely on the true underlying skill, and the selected surgeons would indeed have the best long-term outcomes.

  However, note that in reality, a proxy is almost never perfect. Moreover, if the proxy were perfect, then by definition it would be the same as the goal. But in our scenario, we are assuming that the 48-hour survival is not a perfect predictor of long-term survival (which is realistic).
answer: |-
  ### Scenario: Hospital Patient Readmission Rates  
  A hospital aims to improve patient health outcomes (the true goal) and uses the "30-day readmission rate" as a performance metric for its departments. This rate measures how often patients return within 30 days of discharge—a **noisy proxy** for long-term health, as readmissions can stem from unavoidable complications (e.g., infections, chronic disease flare-ups) unrelated to departmental quality. The hospital identifies departments with the *lowest* readmission rates over six months and rewards them with extra funding. Crucially, **no one is gaming the metric**: departments aren’t cherry-picking healthier patients or manipulating records. They’re all operating normally, but random noise (e.g., seasonal illness surges, unavoidable patient relapses) causes the readmission rate to fluctuate independently of actual care quality.  

  ### Selection Step Producing the Effect  
  The hospital **ranks departments by their observed readmission rates** and rewards the top 20% (lowest rates). Due to noise in the proxy:  
  - Some departments with *average* true quality appear "excellent" because they randomly had fewer complicated cases or luckier outcomes.  
  - Conversely, truly high-quality departments may appear "worse" due to bad luck (e.g., an unexpected cluster of frail patients).  

  **Result**: The rewarded departments’ readmission rates *increase* over the next six months, while outcomes for their patients (e.g., 1-year survival) show no meaningful improvement. The metric degraded because selection amplified noise—departments with temporarily deflated rates regressed toward their true average performance.  

  ### Why This Is Statistical Goodhart (Not Incentive-Driven)  
  - **No behavior change**: Departments didn’t alter practices to "hit" the metric (e.g., no early discharges to avoid readmissions). The effect arises purely from **noise in the proxy** and **selection-induced regression to the mean**.  
  - **Statistical mechanism**: When you select based on an imperfect proxy (readmission rate = true quality + random noise), you disproportionately select units with positive noise. Noise isn’t replicable, so performance on the *true goal* (long-term health) doesn’t improve.  

  ### Causal Goodhart Version: What Would Change?  
  For this to become **causal Goodhart**, the setup would need:  
  1. **Incentive-driven manipulation**: Departments altering behavior to optimize the *proxy* at the *expense* of the goal.  
     - *Example*: Departments avoid high-risk patients (who need care most) to keep readmissions low, or discharge patients prematurely to dodge the 30-day window.  
  2. **Key feature**: Active effort to "game" the metric once it’s tied to rewards. The proxy is no longer just noisy—it’s **decoupled from the goal by strategic behavior**.  

  ### Which Feature Drives the Statistical Effect?  
  The **imperfect correlation** between proxy and goal. Here:  
  - Readmission rates correlate weakly with long-term health (due to noise from random events).  
  - Selection on extreme values of a noisy proxy guarantees regression to the mean.  

  ### Does the Effect Survive if the Proxy Is Perfectly Accurate?  
  **No.** If the proxy (readmission rate) **perfectly predicted** long-term health (e.g., via a 100% causal link), statistical Goodhart vanishes:  
  - Noise = 0. Observed differences reflect true quality.  
  - Rewarding low readmissions would *correctly* identify and incentivize high-quality care.  

  **Real-world takeaway**: Statistical Goodhart arises when proxies are *inherently weak* (noisy) and you select on extremes. Causal Goodhart requires *behavioral distortion*. In practice, most proxies sit between these poles—imperfect *and* gameable—making both laws relevant.
