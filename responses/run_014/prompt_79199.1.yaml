  The emotional subtext is important here: when they ask if their sense that "something is at stake" in the reality of the past is confused, they're really asking whether their grief connects to something metaphysically significant. The mother's absence feels like more than just a psychological state - it carries ontological weight. This makes the abstract debate deeply personal.

