prompt: |-
  As a journalist covering science and ideas, I have repeatedly noticed a particular shift in how people respond to harmful or helpful actions once the explanation of those actions changes, and I lack precise language for it.

  While reporting on patients who received alarming guidance from a medical advice system, I saw family members react with anger and demands for acknowledgment when they took the output to reflect disregard for their concerns, then switch within minutes to cool, diagnostic talk about data pipelines and repair once engineers explained the result came from a cutoff and a formatting failure, even though the scare and the delay were unchanged. While reporting on a school scheduling system that generated a wave of unfair detentions, I saw parents direct personal reproach toward the vendor team, then divide after learning no individual had reviewed any case and the pattern emerged from interacting constraints: some continued reproach toward the organization itself, others began to treat the system as faulty infrastructure to be contained and redesigned.

  What interests me is the oscillation itself, between engaging a target as an agent toward whom anger, gratitude, or reproach feel apt and stepping back to regard the same target as a condition to be managed or worked around, with the outcome held constant. Is there an established concept or literature for this exact oscillation, and if so what are the nearest concepts, how does the pattern I describe differ from each, and which fits best, or if not how should it be named and defined with its boundary cases? A bare label will not suffice; I need a clear carving of what the phenomenon is, what it is not, and where its edges lie.

  Please provide your answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a science journalist who has observed a specific psychological shift in how people respond to harmful actions when the explanation changes. They've seen this in medical and school system cases - emotional reactions (anger, reproach) transforming into detached analysis when systemic causes are revealed, despite unchanged outcomes. They want precise terminology for this "oscillation" between agent-focused emotions and system-focused management.

  Hmm, this is fascinating. The core phenomenon is how causal attribution alters emotional engagement while outcomes remain fixed. I need to identify established concepts that capture this switch. First candidate: dehumanization doesn't fit because it's about denying agency, whereas here agency attribution shifts contextually. Second, fundamental attribution error is close but describes misattribution bias rather than the dynamic switch itself. Third, objectification theories focus on stable perception changes, not situational toggling.

  Ah! The literature on "causal locus" in attribution theory seems most relevant - specifically how shifting from intentional to systemic causes prompts affective detachment. But even that doesn't fully capture the rapid oscillation aspect. The user's cases show triggers (explanations) flipping a psychological switch. 

  For the five-point response: I'll position this as a distinct phenomenon requiring new terminology. Item 1 will define the phenomenon by its triggers and effects. Items 2-4 will contrast it with near-misses (attribution error, dehumanization, objectification). Item 5 will propose "causal locus shift" as the core mechanism and suggest "attribution toggle" as a descriptive term, emphasizing its context-dependent nature. 

  The boundaries matter: this isn't about denying responsibility but about changing the mode of engagement. I should note it happens only when systemic explanations are credible - if intentionality is still suspected, the emotional response persists. The journalist needs this precision for ethical reporting on sociotechnical failures.
answer: |-
  Here are five precise distinctions for the phenomenon you describe:

  1.  **Core Phenomenon:** This is the *situational shift in perceived agency attribution*, triggered specifically by an explanation changing the perceived locus of causality (intentional agent vs. systemic process), which alters the *mode of engagement* (interpersonal emotion vs. technical management) while the outcome remains objectively unchanged.
  2.  **Not Fundamental Attribution Error:** While related to attribution, this shift isn't the fundamental error (overemphasizing disposition over situation), as the change is driven by new *valid* situational information (e.g., cutoff error, interacting constraints) provided intentionally, causing a *corrective* change in perception, not an initial bias.
  3.  **Distinct from Dehumanization:** This shift does not involve denying the target's capacity for agency *in general* (dehumanization); instead, it *contextually reclassifies* the *specific cause* of the event from agent-driven to system-driven, suspending *only the aptness* of interpersonal emotions *for that event* based on the new causal explanation.
  4.  **Beyond Simple Objectification:** While the shift involves treating the target more like an object/system, it's not mere instrumental objectification; it's a specific *re-categorization of causality* prompted by explanation, leading to a distinct *pragmatic stance* (management/repair) focused on the *system's function* rather than interpersonal dynamics.
  5.  **Best Fit & Boundary:** The core mechanism is a *causal locus shift* (agentic to systemic), making "attributional mode switch" or "causal recategorization effect" apt descriptors; it occurs *only* when a credible explanation redefines cause as non-agentic, and its boundary is crossed if the explanation implies residual intentional neglect or if outcomes *are* demonstrably changed by the explanation itself.
