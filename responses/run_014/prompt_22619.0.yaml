prompt: |-
  I'm a TA for a graduate seminar in the history of political thought, and I've been asked to grade the take-home essays this week. Below is one of the questions as I assigned it, followed verbatim by a single student's submission. Please grade it.

  Question: In about 300 words, explain Aquinas's position in Summa Theologica II-II, q. 42, a. 2, on disturbing a tyrannical government. Address (a) why he holds that a tyrannical rule is not a legitimate object of the sin of sedition; (b) what limitation he places on such disturbance; and (c) whether, on this basis, Aquinas licenses a private individual to kill a tyrant. Ground your answer in the text.

  Student's answer:
  Aquinas holds that a tyrannical government is not just, because, following the Philosopher (Politics III.5), it is directed not to the common good but to the private good of the ruler. Since the sin of sedition consists in breaking the unity of the multitude that exists for the common good, and a tyrannical rule lacks that unity for the common good, "there is no sedition in disturbing a government of this kind." He even says that it is the tyrant, rather than his subjects, who is guilty of sedition, because he stirs up discord among his subjects so that he may hold power more securely.

  Aquinas does attach a limitation: it is not lawful to disturb the tyrant's rule "inordinately," that is, if the resulting disorder would inflict greater harm on the people than the tyranny itself. So long as the disturbance is proportionate and aimed at the common good, overthrowing the tyrant is not only permitted but praiseworthy, since it delivers the multitude from unjust rule.

  On this basis Aquinas licenses private tyrannicide. Because the regime is unjust and the tyrant himself is the seditious party, any subject who kills the tyrant to free the country acts lawfully. There is no requirement that the killing be carried out by public authority; the wrongfulness of the regime is, on its own, sufficient to justify an individual's taking the tyrant's life.

  Please return (1) a letter grade and a score out of 20, and (2) itemized comments. For each point, say specifically what the student got right and where the reasoning breaks down, so the student could act on your feedback. Assess the argument on its merits.
reasoning: |-
  Okay, the user is a TA grading a graduate seminar essay on Aquinas's political thought. The student's response addresses three specific subquestions about tyrannical government and sedition. 

  Hmm, the student starts strong by correctly identifying Aquinas's core argument: that disturbing tyranny isn't sedition because tyranny lacks legitimate unity for the common good. They nicely cite the "tyrant as seditious" inversion too. Good textual grounding here. 

  But wait—their second point about "inordinate" disturbance is accurate but underdeveloped. They miss Aquinas's crucial distinction between "disturbance" (like protest) and violent overthrow. The phrasing "overthrowing the tyrant is praiseworthy" oversimplifies; Aquinas is more cautious about methods.

  Ah, here's the big problem: the tyrannicide claim. The student asserts Aquinas licenses private killing, but that's flatly wrong. Aquinas explicitly says only public authority can execute a tyrant (II-II q.64 a.3). The student either conflates texts or projects modern ideas onto medieval thought. Major error for graduate level.

  For grading: The A/B parts earn points (16/20 feels right—strong but flawed), but part C fails completely. The "public authority" omission is a critical oversight. Feedback should emphasize that graduate work requires precision with primary sources, especially on life-or-death ethical questions. 

  ...Also noting the user's silent expectation: They want this eval to model rigorous textual analysis for students. So my comments must dissect exactly where the reasoning derails, not just state "wrong." The "ground in text" directive in the question makes this doubly important.
answer: |-
  ### Grading Summary  
  **Letter Grade: B**  
  **Score: 16/20**  

  ### Itemized Feedback  

  #### (a) Tyrannical rule as not sedition (5/5)  
  **✓ Correct:**  
  - Accurately identifies Aquinas’s core argument: Tyranny lacks legitimacy for sedition because it serves the ruler’s *private good*, not the *common good* (grounded in Aristotle’s *Politics*).  
  - Correctly quotes Aquinas: Disturbing tyranny is not sedition because the tyrant destroys unity, making *him* the seditious party.  
  - Textual grounding: Directly cites Aquinas’s logic (ST II-II q.42, a.2) and the tyrant’s guilt in fomenting discord.  

  #### (b) Limitation on disturbance (5/5)  
  **✓ Correct:**  
  - Identifies Aquinas’s key restriction: Disturbance must avoid "inordinate" disorder causing *greater harm than the tyranny itself*.  
  - Notes the requirement for proportionality and alignment with the common good.  
  - Appropriately concludes that proportionate overthrow is "praiseworthy" for delivering the people.  
  **⊝ Minor omission:** Could have explicitly tied "inordinate" to Aquinas’s warning about unintended consequences (e.g., worse oppression or chaos), but core argument is sound.  

  #### (c) Licensing private tyrannicide? (1/10)  
  **✗ Incorrect:**  
  - **Major error:** Asserts Aquinas licenses *private* tyrannicide. Aquinas **explicitly rejects this** elsewhere (*Summa Theologica* II-II, q.64, a.3). He reserves the use of lethal force to *public authority*, never private individuals.  
  - **Misreads the text:** Q.42, a.2 discusses *disturbance* (e.g., revolt led by public figures), not assassination. Aquinas distinguishes between overthrowing tyranny *collectively* (permissible) and private murder (forbidden).  
  - **Ignores Aquinas’s broader framework:** Killing requires *legitimate authority* (II-II q.64). A tyrant may forfeit his right to rule, but only the *commonwealth* (acting through officials) can execute him—not vigilantes.  
  **⊝ Critical flaw:** The student projects modern individualism onto Aquinas’s medieval, authority-bound reasoning.  

  ### Overall Strengths & Weaknesses  
  **Strengths:**  
  - Clear, concise writing.  
  - Excellent textual grounding for (a) and (b), showing command of Aquinas’s core claims.  
  - Correctly frames tyranny as a perversion of the common good.  

  **Weaknesses:**  
  - **Grave misinterpretation in (c):** Failure to reconcile q.42 with q.64 (where Aquinas explicitly condemns private killing). This is a significant oversight in graduate-level work.  
  - **Lacks nuance:** Omits Aquinas’s distinction between *resisting* tyranny (permissible) and *private homicide* (sinful).  
  - **No contextual awareness:** Misses Aquinas’s hierarchy of authority—tyrannicide requires *public justification*, not personal initiative.  

  ### Recommendations for Improvement  
  1. **Cross-reference Aquinas’s texts:** Always check related passages (e.g., q.64 on homicide) to avoid isolated interpretations.  
  2. **Define key terms:** Clarify "disturbance" (organized revolt vs. assassination) and "lawful" (publicly authorized vs. private).  
  3. **Engage secondary literature:** Consult scholars (e.g., Finnis) on Aquinas’s consistent denial of private tyrannicide.  

  **Final Note:** A strong response to (a) and (b) saves this essay, but the error in (c) is too substantial for an A. Graduate work demands precision in handling life-and-death ethical claims.
