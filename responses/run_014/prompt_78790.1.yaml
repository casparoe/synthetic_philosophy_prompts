  Here’s a toast that navigates the rocks—warm for the rowers, precise for the philosophers, and faithful to your advisor’s view without turning Saturday into a symposium. The humor leans on rowing (his "strange" boat obsession) to keep it light, while the philosophy stays sharp but digestible:

  ---

  **(Clink glass)** Everyone! For those who don’t know me, I’m [Your Name], one of the lucky few who got to be tossed into the deep end of [Advisor's Name]'s remarkable mind. And let me tell you, whether you were analyzing Kant or the keel angle of an eight-man shell, you learned fast: this man *notices* things. Especially if you misstate his position on consciousness. (*Grins at Advisor, winks*)

  Seriously though. For thirty years, [Advisor's Name] has rowed against some pretty strong currents in how we think about ourselves. While the rest of us might get tangled in debates about souls or spirits, he’d lean back, give that look—you know the one, the "your oar’s not even in the water" look—and say: *Stop overcomplicating the stroke.*

  His big idea? It’s deceptively simple, like a perfectly balanced boat. He’d say our brain, this incredible machine, builds a stripped-down model of *itself* in action. That model? That’s the show we call experience—the sights, the sounds, the feeling of holding this glass right now. It’s real. It’s vivid. It’s *everything* to us. But, he’d insist, there’s no little captain down below decks peering at this model. "There’s a show," he’d say, "but nobody *in* the audience." The feeling of being the audience *is part of the show the brain stages for itself.*

  Now, I argued about this for two hours just today! (*Glances playfully at Dev if he's there, or just to the room*). Some hear that and think, "Aha! So we’re just zombies? Empty shells?" Absolutely not. [Advisor's Name]’s point is the *opposite*: the show is dazzling! It’s full. It’s *us*. It’s just that the "us" we feel so deeply—the one sitting in the audience—isn’t a separate ghost in the machine. It’s part of the brain’s brilliant, economical stagecraft. No magic required, just biology doing something astonishing. It doesn’t mean nobody’s home; it means the feeling of *being* home is what the house built.

  And that’s so him, isn’t it? (*Turns to the rowing club/family*) You know him as the guy who could measure the drag coefficient on a coxswain’s whisper, who finds transcendence in the rhythm of oars hitting the water just right. (*Turns to the department*) And we know him as the thinker who demanded ruthless clarity, who wouldn’t tolerate foggy metaphors when a precise model would do. He showed us that understanding the mind doesn’t have to diminish its wonder—it can deepen it. He found the profound in the measurable.

  [Advisor's Wife], he’s told me how much he values that you see the world so differently. He never wanted a war on faith; he just wanted to understand the stroke. And honestly, watching your marriage? It’s proof his model has room for deep love, respect, and probably some very interesting dinner conversations!

  So, [Advisor's Name], thank you. Thank you for teaching us to think harder and row straighter. Thank you for showing us that the most fascinating journey isn’t out there, but right here, in the incredible show our brains put on—even if, as you’d say, there’s nobody *else* watching. Here’s to the showman, the thinker, the oarsman, the mentor. To a well-deserved retirement! May your days be full of calm waters, fascinating problems, and absolutely zero misstatements of your position. Cheers!

  \answer{The toast commits to claiming that his view is that conscious experience is a real, non-zombie phenomenon generated by the brain, wherein the *feeling of being a self* is part of the brain's self-modeling process, not a separate entity observing it.}
