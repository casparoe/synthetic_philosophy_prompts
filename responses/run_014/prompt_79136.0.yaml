answer: |-
  ### Exam Question (145 words)
  "Sen's minimal liberalism (ML) assigns to each individual decisive power over at least one 'personal' pair of social alternatives. The liberal paradox shows ML's conflict with the weak Pareto principle (WP) using preferences like the Prude's over the Lewd's reading. Critically evaluate two proposed resolutions: (1) Modelling preferences as *conditional* on others' actions (e.g., the Prude cares about *who* reads the book, not just *that* the Lewd reads). (2) Treating rights as *outcome constraints* (e.g., forbidding assignments where the Lewd doesn't get his preferred book), not sourced from individual preferences. For each resolution, explain precisely what it assumes about the nature of ML (e.g., does ML constrain decisiveness assignments or define 'personal spheres' substantively?), whether it genuinely resolves the conflict with WP, and what conceptual costs it imposes on a liberal framework."

  ---

  ### Model Answer (780 words)

  Sen's liberal paradox demonstrates a conflict between minimal liberalism (ML) and the weak Pareto principle (WP) under unrestricted preference domains. ML requires that for each individual, there exists at least one pair of socially distinct alternatives (x, y) over which they are decisive: if they prefer x to y, society must not choose y over x, and vice versa. These pairs are deemed "personal" to the individual. WP requires that if every individual strictly prefers alternative x to alternative y, then society must not choose y over x. The paradox arises when individuals have "meddlesome" preferences over others' personal spheres, exemplified by the Prude (P) and Lewd (L) over who reads *Lady Chatterley's Lover* (book A): alternatives are P reads A (pA), L reads A (lA), or neither reads (N). Suppose P prefers N > pA > lA (wants to avoid the book, but would rather suffer it than have L corrupted), L prefers lA > pA > N (wants to read it, but would rather P suffer than no one read it), and ML assigns {pA, N} to P (decisive) and {lA, N} to L (decisive). P's strict preference for N over lA implies society cannot choose lA over N (P decisive). L's strict preference for lA over pA implies society cannot choose pA over lA (L decisive). But both strictly prefer pA to N (P: pA > N; L: pA > N), so WP requires society not choose N over pA. This creates a cycle: lA cannot be chosen over N, pA cannot be chosen over lA, and N cannot be chosen over pA – no social choice is possible without violating ML or WP.

  Resolution (1) proposes using *conditional preferences*. Instead of P having an unconditional preference N > lA, we model P’s preference as conditional on the assignment: P strictly prefers the *combination* (P reads, L doesn’t) over (L reads, P doesn’t) [i.e., (pA, ¬lA) > (¬pA, lA) or simply pA > lA], and prefers both over (¬pA, ¬lA) i.e., N. Similarly, L strictly prefers (¬pA, lA) > (pA, ¬lA) [lA > pA], and prefers both over N. ML now assigns decisiveness over pairs involving different assignments *to the individual themselves*. Assume ML assigns P decisive over {pA, N} (P controls whether *they* read A) and L decisive over {lA, N} (L controls whether *they* read A). P prefers pA > N, so society cannot choose N over pA (P decisive). L prefers lA > N, so society cannot choose N over lA (L decisive). Crucially, there is no pair over which P is decisive that directly compares lA and pA. The conflict with WP vanishes: the only unanimous preference is pA > N (via P's choice) and lA > N (via L's choice), but pA and lA are never directly compared by WP or ML decisiveness. Society could consistently choose lA (if L exercises their right) or pA (if P exercises theirs), both respecting ML and WP on the pairs where they apply.

  However, this resolution comes at a cost. It fundamentally *redefines ML* as a purely procedural constraint on decisiveness assignments over an individual's *own actions* (e.g., "Does P read A?") without requiring a substantive commitment to what constitutes a "personal sphere." The original ML aimed to protect spheres of personal liberty (like what one reads), which inherently involve *relations* between individuals and objects/actions. By restricting decisiveness to pairs differing only in the individual's own action (holding others fixed), resolution (1) dodges the interpersonal conflict but abandons Sen's core aim: protecting choices that *are* inherently about interactions with the world (like reading a specific book), which might still be deemed "others' business" substantively. The liberal must accept that ML no longer guarantees protection for choices substantively impacting others' interests, only formal control over one's own actions. The Prude might still object substantively to L reading A, but ML, under this view, offers no recourse; it only ensures L controls their own reading choice.

  Resolution (2) treats rights as *constraints on feasible outcomes* rather than deriving social choice from preferences via decisiveness. We define rights as rules prohibiting certain outcomes, irrespective of preferences. For example, a right guarantees L can read A if they wish. So, the alternative where L wants to read A but is prevented (N or pA when L prefers lA) is *infeasible*. Similarly, a right might guarantee P doesn't have to read A if they object. Applying this to the Prude/Lewd case: Given L prefers lA > pA > N, the right makes outcomes where L is denied A (N or pA) infeasible if lA is possible. Thus, only lA is feasible. WP becomes irrelevant as no Pareto comparisons involving lA vs. forbidden alternatives (N, pA) are required. The conflict dissolves because ML (as constraint) directly eliminates alternatives conflicting with the right-holder's will, bypassing aggregation.

  This genuinely resolves the formal conflict. ML is reconceived *substantively*: it defines specific protected spheres (e.g., "L chooses what L reads") and imposes direct outcome constraints based on individual *choices/wills* within that sphere, not their *preferences* over all alternatives. The cost to the liberal is significant: **It abandons welfarism entirely.** Social choice is no longer a function *only* of individual preference orderings. It incorporates exogenous, deontic constraints based on a prior theory of rights defining specific protected actions. This sacrifices the ambition of constructing a coherent social choice rule based solely on preference information. The liberal must accept that rights cannot be derived from or justified solely within a preference-aggregation framework; they require an independent moral foundation. Furthermore, it offers no mechanism for resolving conflicts *between* rights constraints themselves or between rights and other goals unless built into the constraint definition.

  **Conclusion:** Resolution (1) (Conditional Preferences) avoids the paradox by redefining ML procedurally, sacrificing its substantive protection of personal spheres involving externalities. It resolves the aggregation conflict technically but relocates the difficulty to defining the scope of "own action" pairs and may fail to protect liberties liberals care about. Resolution (2) (Rights as Constraints) genuinely resolves the paradox by rejecting welfarism, modelling rights as prior constraints on outcomes. This succeeds formally but costs the liberal the project of grounding rights solely in preference aggregation, requiring an independent justification for the specific rights constraints imposed.

  ---

  ### Marking Scheme (Out of 20)

  *   **Accurate Summary of Paradox (2 marks):** Correctly states ML (decisiveness over ≥1 personal pair per person) and WP. Correctly describes the Prude/Lewd preference cycle causing impossibility. *(Common Error: Vague description of ML as "rights" without decisiveness; Misstating preferences/cycle).*
  *   **Resolution 1 - Conditional Preferences (5 marks):**
      *   (1a) *Mechanism:* Explains shift to preferences conditional on others' actions & decisiveness only over pairs differing solely in the individual's own action (e.g., {P reads A, P doesn't} holding L's action fixed). (1 mark)
      *   (1b) *Avoids Paradox:* Shows decisiveness assignments ({pA,N} for P, {lA,N} for L) and preferences (P: pA>N; L: lA>N) lead to feasible choices (pA or lA) without cycle. (1 mark)
      *   (1c) *Redefines ML:* Argues this makes ML *procedural* (constrains decisiveness assignments over own-actions), *not* substantive (defining protected spheres involving relations/impacts). (1 mark) *(Common Error: Claims ML now defines spheres substantively as "own actions").*
      *   (1d) *Cost:* Identifies cost: ML no longer protects substantively "personal" choices that affect others; only protects formal control over own action. Dodges substantive interpersonal conflict. (1 mark)
      *   (1e) *Genuine Resolution?* Correctly states it avoids the *formal* aggregation conflict but fails to resolve the *substantive* liberal concern about protecting choices deemed personal. (1 mark) *(Common Error: Treats this fix as free/complete resolution).*
  *   **Resolution 2 - Rights as Constraints (5 marks):**
      *   (2a) *Mechanism:* Explains rights as prior constraints removing rights-violating outcomes (e.g., if L wants to read A, alternatives where L doesn't read A are infeasible). (1 mark)
      *   (2b) *Avoids Paradox:* Shows how constraint (only lA feasible if L prefers it) makes WP comparisons involving infeasible alternatives irrelevant. (1 mark)
      *   (2c) *Redefines ML:* Argues this makes ML *substantive* (defines protected spheres/actions) and *non-welfarist* (based on will/choice, not preference orderings; outcome constraints are exogenous). (1 mark) *(Common Error: Confuses constraint with decisiveness).*
      *   (2d) *Cost:* Identifies cost: Abandons welfarism (social choice ≠ f(preferences only)); requires independent justification for specific rights; doesn't handle rights conflicts within the aggregation model. (1 mark)
      *   (2e) *Genuine Resolution?* Correctly states it genuinely resolves the formal conflict by removing the problematic alternatives *before* aggregation. (1 mark)
  *   **Comparative Evaluation & Conclusion (4 marks):**
      *   (3a) Clearly states Resolution 2 is the genuine formal resolution (abandons welfarism). (1 mark)
      *   (3b) Clearly states Resolution 1 relocates the difficulty (to defining "own action" and substantive protection). (1 mark)
      *   (3c) Insightful comparison of costs: Resolution 1 costs substantive protection; Resolution 2 costs welfarism/independent justification. (1 mark)
      *   (3d) Clear final judgment on which resolution, if any, a liberal might prefer and why (e.g., substantive liberal needs Resolution 2 despite cost; proceduralist might accept Resolution 1). (1 mark)
  *   **Clarity, Structure & Precision (4 marks):** Logical flow, precise definitions (ML, WP, decisiveness, constraints), no significant errors, conciseness.

  *(Common Overall Error: Misreading ML as incompatible with democracy/Pareto *as such*, rather than with WP *under unrestricted domain*; Failing to distinguish the *procedural* (decisiveness assignment) vs. *substantive* (defining personal spheres) interpretations of ML central to evaluating the resolutions).*
