answer: |-
  You've astutely identified key non-empirical arguments used in fundamental physics, particularly for string theory. The established philosophical term capturing the *core idea* behind all three moves is **Non-Empirical Confirmation** (NEC), primarily developed by philosopher Richard Dawid.

  Here's the breakdown:

  1.  **Non-Empirical Confirmation (NEC):** This refers to forms of theory assessment that *support* a theory's validity or likelihood of being correct, but which do *not* involve direct empirical testing against observational or experimental data of the phenomena the theory aims to describe. It's based on the theory's relationship to the broader scientific landscape, its internal structure, and historical patterns.

  2.  **How NEC Applies to Your Three Moves:**
      *   **Move 1 (No Alternatives Argument):** This is the **paradigm example** of NEC, specifically called the **"No Alternatives Argument" (NAA)**. Dawid argues that the *persistent, systematic, and highly resourceful failure* of the scientific community to find *any* viable alternative theory over a long period, despite strong motivation, provides positive support for the existing theory (like string theory). It's *not* simple ignorance; it's based on the *observed limitations* of scientific research under specific historical constraints. The strength relies on the scope and intensity of the search.
      *   **Move 2 (Unexpected Explanatory Coherence):** This falls under NEC as evidence of **explanatory power** or **unexpected coherence**. When a theory developed for one purpose (e.g., unifying particle forces) *automatically* generates crucial features of another fundamental domain (e.g., gravity, specific symmetries) *without being specifically engineered to do so*, it's seen as a powerful sign of deep truth. The theory seems to "know" more than its creators put in. This internal consistency and surprise bonus are treated as non-empirical evidence.
      *   **Move 3 (Meta-Induction from Past Successes):** This is also a core part of NEC, termed the **"Meta-Inductive Argument" (MIA)**. It observes that theories exhibiting certain characteristics in the past (like high levels of mathematical coherence, unexpected unifications, or being the *only* game in town for an extended period *before* direct testing) often turned out to be correct (e.g., General Relativity predicting light bending, Dirac's equation predicting antimatter). The argument is that current theories displaying similar characteristics (like string theory) therefore have a higher likelihood of being correct.

  3.  **How NEC Differs:**
      *   **From "Absence of Evidence":** NEC doesn't *just* say "we haven't found evidence against it." Arguments like the NAA specifically invoke the *outcome of a dedicated, resource-intensive search process*. The MIA invokes *positive historical patterns*. The Unexpected Coherence invokes *positive internal features*. They argue the *nature* of the absence (in the case of NAA) or the *presence* of specific features (coherence, historical analogy) provides positive support.
      *   **From "Finding it Pretty" (Aesthetics):** While mathematical beauty or elegance often accompanies theories exhibiting NEC, NEC arguments are stronger. Aesthetics is subjective. NEC arguments like the NAA or MIA appeal to *intersubjective, historical, and structural* features of the theory within the scientific process. The unexpected coherence of gravity emerging is not *just* pretty; it's seen as a profound structural necessity within the framework. The historical analogy isn't just sentiment; it's a meta-argument about successful scientific reasoning patterns.

  4.  **Controversy:** NEC is highly debated. Critics (like Alan Musgrave or Carlo Rovelli) argue:
      *   It risks conflating sociological factors (like research funding or community focus creating a "monoculture" blocking alternatives) with genuine scientific support.
      *   It undermines the core empirical principle of science (falsifiability/verifiability).
      *   The historical analogy (MIA) might not hold – past theories were often testable *in principle* much sooner than string theory appears to be.
      *   It might be "pseudo-confirmation," confusing hope or necessity for evidence.
      *   **Proponents (like Dawid):** Argue that in domains where direct empirical testing is fundamentally constrained (e.g., Planck scale physics), NEC is a rational and necessary form of theory assessment based on the *only* available evidence about the theory's viability – its relationship to the limits of scientific possibility and its internal/external coherence.

  **Conclusion:** The established name for the phenomenon you describe is **Non-Empirical Confirmation (NEC)**. It explicitly encompasses **all three** of the "moves" you identified:
  1.  The "No Alternatives Argument" (NAA)
  2.  Evidence of "Unexpected Explanatory Coherence"
  3.  The "Meta-Inductive Argument" (MIA) from historical analogy.

  It differs from simple absence of evidence by invoking the *results of a process* (the search for alternatives) or the *presence of specific structural/historical features*. It differs from mere aesthetic appeal by relying on arguments about the theory's fit within the scientific landscape and historical patterns of success.

  \answer{Non-Empirical Confirmation (covers all three moves: No Alternatives Argument, Unexpected Explanatory Coherence, Meta-Inductive Argument)}
