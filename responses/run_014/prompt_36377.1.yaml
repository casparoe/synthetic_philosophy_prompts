prompt: |-
  Quick context: I've got a medical thing going on where two specialists have now told me opposite things about whether I need surgery, and while chewing it over with my friend (huge philosophy podcast guy, loves explaining stuff to me) he gave me this whole spiel about epistemic akrasia. I want to know how much of it to trust before I actually make a decision based on it.

  His summary, as best I can reconstruct it: higher-order evidence is evidence about what your own evidence supports, and epistemic akrasia is when you believe something anyway while knowing you shouldn't believe it -- the epistemic version of weakness of will, like seeing the cake and eating the cake. And he said it's basically settled that a perfectly rational person never believes her own evidence is misleading, that's the fixed point of rationality, so the only people who ever end up believing against their evidence are people who already screwed up somewhere earlier -- only the guilty act akratically, as he put it. Then he said the real debate is over what you do once you're in that spot, and apparently some philosophers do say you can rationally keep the belief, but he thinks that's basically a fancy way of saying wishful thinking is fine. Which brought us to my situation: he said two disagreeing experts is the classic peer disagreement case, so the rational move is to split the difference, I should end up roughly 50/50 between surgery and no surgery, and if I stick with believing the first doctor I'm being akratic, which is irrational by definition.

  For what it's worth, I do still believe the first doctor, not because I want to, it just seems obvious when I think about it, even though I'd admit the total evidence leans the other way, so I'm exactly the person his speech was aimed at lol.

  Is his summary fair? Go piece by piece: what would the people who actually work on this accept, where is he flattening something that's more complicated, and is anything just wrong? Also -- and this is the part that actually matters to me -- does his 50/50 conclusion about my doctors follow from the parts of his summary that are right, or does that rest on the parts that aren't?
