prompt: |-
  Thirty-four years doing scattering experiments at a synchrotron, the last five of them chairing the commitee that hands out beam time, and now I'm two years retired and reading political philosophy at the kitchen table with a coffee and a pencil. Sen's question about equality of what has got under my skin, mostly because I spent a decade answering a version of it in practice without realising I was doing philosophy. I've also been through Dworkin on resources and I honestly can't tell whether the thing we were distributing was a resource or a capability or neither.

  So here is what I actually did, case by case, and how it looks to me now.

  Two proposals, same science, same score from the reviewers. One from a flagship lab with a sample robot, a staff scientist and a travel budget; one from a state college where the PI drives five hours each way and mounts her own samples by hand. I gave the second one more shifts. Still think that was right.

  A proposal with badly designed controls that was going to waste the shift no matter how much time we gave it. I cut it. Cutting it made that group worse off and widened exactly the gap I'd just tried to narrow in the previous case, and I'd do it again tomorrow.

  A famous group that had burned 60 shifts over three years asked for 20 more. The science was excellent and would certainly have produced papers. I ranked it below a decent but unspectacular first-time user.

  A user who couldn't work the overnight shifts alone at the end station — she's a wheelchair user — so we put her in the day blocks and paid for an assistant. She cost the facility more beam time than anybody else that cycle. Obviously correct, no hesitation then or now.

  A group got 16 shifts, their postdoc quit in month two, they used 4. I docked them the following year. Notice that this is punishing people for bad luck, and bad luck is precisely what I compensated in the state college case.

  A year when the machine underperformed and all we could offer everybody was half of what they'd asked for. Perfectly equal, everyone equally badly served. That year was not better than the year before it, and I don't think the extra equality made it better in any way at all.

  Industrial users could buy shifts outright and the money went back into the academic pool. I voted for that every single time, which means I was happy to let money buy more of the thing I'd just spent six cases insisting shouldn't go to whoever could pay for it.

  My own attempt at a principle is this: equalise effective access, not equal hours — give people whatever it takes to convert a shift into science, with a floor below which nobody falls and a cap on how much one group can hold at once. It handles the wheelchair case, the state college, and the 60-shift group nicely. Its seems to blow up on the wasted shifts and the bad controls, because on a conversion story the right response to someone who can't convert is to help them convert, not to cut them off, and I definitely didn't want to fund their training out of my beam time.

  What I want from you: the principle, or the small set of competing ones, that actually delivers these verdicts. State it precisely, clause by clause, and for each clause tell me which case above it's there to handle and what it costs you elsewhere. Where yours and my effective-access version come apart, say so plainly rather than reconciling them politely. Then run it on two situations I never had to decide. First, a proposal for a fully autonomous experiment that drives itself and needs no human on site at all — the per-person metric seems to lose its grip there and I want to know what happens to the cap and the floor. Second, a proposal from a grad student whose PI died halfway through, to finish work that only the dead PI really understood. And be straight with me about which of my verdicts can't survive: I'd rather lose one cleanly than keep all seven with a fudge factor bolted on the side. No reading list, please — I've got one book and a library card that lapsed.
reasoning: |-
  Okay, I need to tackle this user's query. They've spent decades in synchrotron beam time allocation and now are diving into political philosophy, particularly equality concepts. Their frustration is palpable—they've practiced distributive justice without realizing it and now seek principles that match their real-world decisions. 

  First, I must acknowledge their expertise. They're not just theorizing; they have concrete cases where intuition guided them. Sen's "equality of what?" resonates because they lived it. Their effective access principle (equalizing conversion of shifts into science) is a strong start but cracks in cases like wasted shifts or industrial money. 

  The core tension: their verdicts sometimes prioritize capability building (helping under-resourced groups), sometimes efficiency (cutting bad science), and sometimes strict equality (equal cuts during machine failure). This isn't inconsistency—it's context-dependent justice. My framework must explain why shifting weights is coherent. 

  Key hurdles: 
  - The wheelchair case needs accommodation, which is capability-focused. 
  - Docking shifts for the postdoc quitting seems to punish luck, but they compensated luck in the state college case. Why? Probably because one was preventable (poor project management?) and the other wasn't (resource disparity). 
  - Industrial money buying access contradicts their anti-payment stance elsewhere. But the academic pool reinvestment justifies it as systemic fairness. 

  For my proposed principle, I'll structure it clause-by-clause, linking each to their cases. The "conversion capacity floor" handles state college/wheelchair cases; the "prevention of predictable waste" clause justifies cutting bad controls. The cap on shifts balances opportunity hoarding. 

  New scenarios: 
  - The autonomous experiment challenges person-centric metrics. Solution: measure access by "project need," not human hours. Cap still applies to prevent monopoly. 
  - The bereaved grad student: capability framework demands support, but if conversion is impossible (only dead PI understood), denying beam time aligns with efficiency. Harsh but consistent. 

  Finally, I'll admit one verdict can't survive: the year of equal cuts. Their principle demands mitigating unequal impacts, not blanket equality. They already sense this didn't improve fairness. 

  No jargon, no citations—they want raw logic. Match their clarity: "Your industrial money exception holds because..." not "Dworkin might argue..." This is philosophy forged in a synchrotron control room, not a seminar.
answer: |-
  Here’s a distilled principle that captures your verdicts without fudging, clause by clause. It combines **procedural fairness**, **capability-sensitive allocation**, and **outcome-oriented efficiency**:

  ### **The Principle: Fair Capability Realization (FCR)**  
  1. **Maximize realizable scientific value per unit resource**  
     (Cost: Rejects proposals that waste resources, regardless of equity intent)  
     → *Handles:* Bad controls (cut to prevent waste), industrial money (reinvestment expands total value).  
     → *Blows up:* The state college/robotic lab case? No—clause 2 overrides when value is equal.  

  2. **Prioritize groups below a capability threshold until they reach it**  
     (Cost: Explicitly sacrifices some efficiency for equity; penalizes well-resourced groups)  
     → *Handles:* State college (extra shifts for parity), wheelchair user (support to reach minimum capability).  
     → *Clash with your version:* Your "cap" limits hoarding; FCR’s threshold is a floor, not a ceiling.  

  3. **Apply a hard cap on cumulative access per group**  
     (Cost: May exclude high-value science from prolific groups)  
     → *Handles:* Famous group denied shifts (prevent hoarding), industrial users (money ≠ shifts).  

  4. **Punish only preventable failures, not bad luck**  
     (Cost: Demands judgment calls on "preventability")  
     → *Handles:* Postdoc quitting (docked if PI could mitigate risk), state college (luck compensated).  
     → *Your verdict survives:* Quitting postdoc = preventable (training/backup plans); state college’s resources = systemic, not their fault.  

  5. **Equality is a last-resort allocative method**  
     (Cost: Rejects equality as intrinsically valuable)  
     → *Handles:* Machine underperformance (equal cuts = worst outcome; FCR would prioritize critical projects).  
     → **Your verdict CANNOT survive:** Equal cuts violated FCR. Should have protected high-value/high-need projects.  

  ---

  ### **Where FCR and Your Effective Access Diverge**  
  - **Your wasted shifts case:** FCR *agrees* with cutting them (clause 1). You’d help them convert? FCR says no—waste destroys value for others.  
  - **Industrial money:** FCR *endorses* it (clause 1: money boosts total value). Your qualms are overruled by systemic benefit.  
  - **Cap vs. floor:** You cap shifts to limit hoarding; FCR caps to free up resources for clause 2. Same outcome, different justification.  

  ---

  ### **New Scenario 1: Autonomous Experiment**  
  - **Proposal:** No human needed; AI runs 24/7.  
  - **FCR Verdict:**  
    - Clause 1: High value? Fund it.  
    - Clause 2: Does *not* apply (no human capability gap).  
    - Clause 3: **Hard cap still applies**—prevents monopolizing beam time.  
    - **Floor?** Shifts allocated by project need, not per-person metrics.  

  ---

  ### **New Scenario 2: Bereaved Grad Student**  
  - **Proposal:** Student continues dead PI’s work (only PI understood it).  
  - **FCR Verdict:**  
    - Clause 1: Low realizable value (student likely can’t convert shifts to science). **Reject.**  
    - Clause 2: Student is below threshold? Yes, but support (training) ≠ beam time.  
    - Clause 4: PI’s death = bad luck, *but* funding unviable work = predictable waste.  
    - **Outcome:** Deny shifts. Redirect student to feasible projects.  

  ---

  ### **The Cost of FCR**  
  - **Cold Efficiency:** Punishes avoidable failure harshly (e.g., the bad controls group gets no second chance).  
  - **Judgmental:** Relies on assessing "preventability" and "realizable value" (your decade of experience made this work).  
  - **Anti-Egalitarian:** Explicitly rejects equal distribution as a virtue (equality only when all else is equal).  

  FCR cleanly endorses 6/7 verdicts. The **equal cuts case** is the casualty—it was a lapse in your own principle. FCR demands triage, not blanket fairness, when resources collapse.  

  ---  
  **Final Note:** This isn’t Sen (capabilities) or Dworkin (resources). It’s a hybrid: resources allocated to *realize* capabilities, with efficiency as the engine. When capability gaps block value creation (state college, wheelchair), FCR bridges them. When value can’t be created (dead PI, bad controls), it cuts losses. No debt to theory—just your logic hardened into clauses.
