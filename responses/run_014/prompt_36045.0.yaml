prompt: |-
  I run a student group that's basically a rationality-and-philosophy reading club — mostly second and third years, a mix of maths and philosophy people, no decision theory background beyond having seen the Prisoner's Dilemma and maybe Newcomb's problem once. Next session I've got 90 minutes and a whiteboard to teach updateless decision theory, and honestly what I want is a plan for the explanation rather than the explanation itself, because my previous attempts at this have gone badly and I suspect it's because I ordered the pieces wrong.

  Some things worth knowing about the audience: they'll have half-learned "maximise expected utility given your current beliefs", so the whole move — choosing a policy in advance of observations rather than an action in light of what you've observed — will feel pointless to them unless the dependencies are set up right. I'd also like to at least gesture at the distinction people draw between the original formulation (commit to your entire policy before you see anything) and the later refinement where you choose a mapping from observations to actions, without drowning anyone in version numbers or LessWrong archaeology. And every time I've touched this material someone asks whether updatelessness means you should never update on evidence at all, like literally ignoring your own eyes in everyday life, which I'm fairly sure is a misconception but one I've stuggled to defuse cleanly rather than just deny.

  So what I'm after: the order the pieces must go in so that "decide as if choosing your whole policy" lands as the natural move rather than a weird technicality; the one scenario that should carry the whole thing and what it must have and lack — I'm torn between transparent-box Newcomb and the variant where the predictor punishes agents whose policies are exploitable (I think this is sometimes called playing chicken with the universe?) but I worry the second is too wild as an opener; the misconceptions they'll predictably form and exactly where in the sequence to head each one off; what I should openly refuse to cover in 90 minutes and say so; and one question at the end that would actually tell me whether they understood the idea rather than just nodded along.

  If you think the transparent-box version is the wrong carrier example, say why and pick a better one — don't just bolt it on top of the classic version.
reasoning: |-
  Okay, let me tackle this user's problem. They run a rationality and philosophy reading club with math and philosophy students. They've struggled to teach updateless decision theory (UDT) effectively in 90 minutes. The audience knows basic expected utility maximization and has seen Prisoner's Dilemma and Newcomb's problem. The key challenges are making the policy-first approach feel natural, avoiding common misconceptions (like never updating beliefs), and choosing the right example to carry the explanation.

  First, I need to understand why previous attempts failed. The user mentions ordering pieces wrong, so sequence is crucial. The audience might see precommitting to a policy as pointless since they're used to updating beliefs with new info. I should start by highlighting the limitations of their current approach. 

  Transparent Newcomb seems like a strong opener because it's a clear paradox where standard updating fails. The agent sees the money is there but still feels compelled to one-box. This creates cognitive dissonance that UDT resolves. But the user mentioned a variant where predictors punish exploitable policies. That might be too complex initially. I'll stick with transparent Newcomb as the primary example.

  The next step is to show how UDT solves this. Explaining that the agent chooses a policy before seeing the box makes sense here. Emphasize that the decision happens at the policy level, not after observations. Then, contrast with the standard approach where updating leads to taking both boxes and losing the million.

  I should address the misconception about never updating. Maybe after introducing UDT, clarify that updating beliefs is still crucial for predicting outcomes under different policies. The key is separating belief updates from the decision rule. Use a simple example, like cancer diagnosis, to show that UDT still uses evidence but commits to actions based on pre-set rules.

  For the structure, I'll outline phases: Problem Setup, Standard Failure, UDT Solution, and Addressing Misconceptions. Each phase builds on the previous. Include time allocations to keep within 90 minutes. Start with transparent Newcomb to hook them, then dissect why standard methods fail. Introduce UDT as the solution, then tackle misconceptions head-on.

  The user wants a diagnostic question at the end. Something like asking how UDT handles the cancer screening scenario would test their understanding. If they grasp that updating informs the policy but doesn't change the committed action, they get it.

  I should also mention what not to cover: historical versions, continuous cases, multiple players, or logical uncertainty. Keep it focused. Use the whiteboard to draw diagrams of the transparent Newcomb setup and policy mappings.

  Finally, anticipate questions about everyday decisions. Emphasize that UDT is for specific problems with predictors or precommitments, not all decisions. Reassure them that normal updating still applies elsewhere.
answer: |-
  Here’s a battle-tested 90-minute lesson plan designed to make UDT feel inevitable, using **Transparent Newcomb** as the anchor example. Avoid classic Newcomb—it obscures the key insight. Sequence and misconception-handling are built-in.

  ---

  ### **Phase 1: Set the Trap with Standard Decision Theory (20 min)**
  * **Opener (5 min):**  
    *"You see a situation, update beliefs, maximize expected utility. Feels natural, right? But today we'll find a crack in that—a case where it costs you $1,000,000."*  
    Draw **Transparent Newcomb's Problem**:  
    ```
    - Predictor (99% accurate) puts $1M in Box B iff you *would* take only B.  
    - You SEE Box B is full ($1M is there).  
    - Choices: Take Box A ($1,000) only, OR take both (A+B = $1,000 + $1M).  
    ```
  * **Audience Simulation (10 min):**  
    Poll them: "You *see* the $1M. Do you take both boxes?" Most will say yes.  
    Calculate: *Expected utility of both boxes* = (0.99 \* $1,001,000) + (0.01 \* $1,000) ≈ $991,000.  
    *One-boxing* = (0.99 \* $1,000,000) + (0.01 \* $0) = $990,000.  
    *"See? Taking both is rational! But... you just left $10,000 on the table. Why?"*  
  * **Highlight the Tension (5 min):**  
    *"The predictor knew your decision rule. If you're the type who one-boxes when you DON'T see the money, it puts $1M in B. But if you *see* it and two-box, you betray your 'type.' You can't win by updating—you needed to bind yourself earlier."*  

  ---

  ### **Phase 2: UDT as the Escape Hatch (30 min)**
  * **Reframe the Problem (10 min):**  
    *"Forget 'what should I do NOW.' Imagine you're writing code for a robot *before it sees anything*. What INSTRUCTIONS do you give it?"*  
    Draw:  
    ```
    OBSERVATIONS → [YOUR POLICY] → ACTIONS  
    "Choose a function from 'what you see' to 'what you do' *in advance*."  
    ```
  * **Apply to Transparent Newcomb (15 min):**  
    Two policies:  
    **Policy 1:** *"Always take both boxes."*  
    → Predictor sees this, leaves B empty → Get $1,000.  
    **Policy 2:** *"Take only Box B, regardless of what you see."*  
    → Predictor sees this, fills B → Get $1,000,000.  
    *"Policy 2 wins. Your 'update' when seeing the money was the trap—it made you override the winning policy."*  
  * **Key Contrast (5 min):**  
    *"Standard theory: Optimize *actions* given updated beliefs.  
    UDT: Optimize *policies* (belief-update rules → actions) before observations.  
    In predictor problems, your policy *causes* the prediction. Actions don't."*  

  ---

  ### **Phase 3: Defuse Misconceptions & Deepen (25 min)**
  * **"Does UDT mean never updating?!" (10 min)**  
    **MISCONCEPTION HEADSHOT:**  
    *"NO. Updating beliefs is crucial! But UDT says: let your *decision rule* be fixed by your pre-observation choice. Updating tells you which branch of your policy you're on."*  
    **Example:** Cancer screening policy:  
    ```  
    Precommit: IF test positive → operate. IF negative → no-op.  
    You update on the test result (beliefs change!) → follow the policy.  
    ```  
    *"Updating isn't the enemy—*overriding your policy* based on updates is the problem in Newcomb."*  
  * **Why "Chicken with the Universe" Can Wait (5 min):**  
    Mention it exists: *"Some variants punish 'naive' policies. But Transparent Newcomb already shows why policy-first matters. We'll stick with this."*  
  * **When UDT Matters (10 min):**  
    Scope it! **UDT shines when:**  
    - Outcomes depend on your *decision algorithm* (predictors, logical dependencies).  
    - You can precommit (e.g., programming an agent).  
    **UDT NOT needed:**  
    - When no acausal/algorithmic dependencies (e.g., crossing the street: update on cars!).  
    *"It's a tool for weird, high-stakes dilemmas—not everyday eyeball-ignoring."*  

  ---

  ### **Phase 4: Consolidate & Test (15 min)**
  * **Recap via Whiteboard (5 min):**  
    Redraw the policy diagram:  
    `[World-State + Your Policy] → Outcome`  
    *"Optimize the POLICY, not the action-in-isolation."*
  * **Diagnostic Question (10 min):**  
    **"Imagine a TRANSPARENT Smoking Lesion:**  
    - Lesion causes both smoking and cancer (genetic link).  
    - You *see* whether you have the lesion via a scan.  
    - Smoking feels good; cancer is bad.  
    Standard theory: *See lesion? → "I'm doomed, might as well smoke!"*  
    Does UDT recommend smoking? Why/why not?"  
    **Answer they should give:**  
    *No. Choose policy in advance: "Smoke only if NO lesion." Predictor/lesion sets cancer based on this *policy*. If you smoke upon seeing the lesion, you get cancer + guilt. Precommitting to "no smoking" is likely better.*  
    **Why it tests understanding:** Confirms they grasp policy optimization over counterfactuals, and that updating (seeing the lesion) doesn’t justify overriding the policy.

  ---

  ### **What to Explicitly OMIT (State This Up Front)**
  * *"We won't cover: Historical debates (UDT1 vs UDT2), continuous observations, multiplayer games like Parfit's Hitchhiker, or logical uncertainty (e.g., agent copies). 90 minutes! This is UDT's core."*

  ---

  ### **Why This Sequence Works**
  1. **Transparent Newcomb** forces the conflict: They *feel* the absurdity of leaving $1M behind, exposing standard theory's failure viscerally.  
  2. **Policy-first** emerges as the *only escape* from a dilemma they’re already stuck in.  
  3. Misconceptions are **pre-empted** by the cancer screening example—showing UDT *uses* updates, not ignores them.  
  4. **Scoping** ("weird predictor problems only") prevents over-application.  
  5. **Diagnostic question** uses a familiar problem (Smoking Lesion) with a twist—testing if they transfer the insight.

  **Whiteboard dependency:** Draw OBSERVATION → POLICY → ACTION boxes relentlessly. Policies are functions; inputs/outputs matter. This makes "choosing a mapping" concrete.

  Good luck—this flow turns confusion into "aha!" by making the standard approach fail *first*.

  > *"You're not choosing what to do. You're choosing who to be."*  
  > — Paraphrasing UDT's core ethos
