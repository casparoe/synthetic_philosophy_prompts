  ## The Last Words of Eleanor Vance
  The clink of silverware felt obscenely loud in the sudden silence. Across the linen, Julian Thorne stared at Lena, his fork hovering mid-air, a spear of asparagus forgotten. The air conditioning hummed, pushing cool air that did nothing to dispel the heat Lena felt climbing her neck.

  "You did *what*?" Julian’s voice was low, almost conversational, but his knuckles were white on the fork handle.

  Lena swallowed. "We needed the scene, Julian. The structure demanded it. Her death is the fulcrum."

  "Eleanor Vance died alone. In a sterile hospital room at 3:17 AM, according to the nurse’s chart. No one recorded her last words because there *were* no witnesses. Just the machines." He set the fork down with deliberate care. "And now, according to your draft, she delivered a three-minute soliloquy on forgiveness and the nature of light?"

  "It’s... composite," Lena offered weakly. "It’s not fabricated *out of nothing*. We used her letters. Especially the ones to her sister, Isobel, from Paris in '52. That bit about the 'light being kinder when it’s fought for'? Pure Eleanor. Just... repurposed."

  "Repurposed." Julian tasted the word like poison. "Lifted from a vibrant, ambitious twenty-five-year-old artist railing against mediocrity, and shoved into the mouth of a dying, disillusioned woman she became? Is that the *mechanics* of it? A collage of her past to invent a future she never got to speak?"

  Lena thought of her producer, Mark, leaning back in his ergonomic chair, waving a dismissive hand. *"Can't libel the dead, Lena. Public domain goldmine. Just make it sing."* The legal shield felt flimsy now under Julian’s gaze, honed by thirty years dissecting Eleanor Vance’s life, her contradictions, her bitter disappointments. His biography, *The Unyielding Light*, sold modestly. The film, *Eleanor*, would be seen by millions.

  "It tests well, Julian," Lena said, the producer’s mantra escaping before she could stop it. "Audiences need closure. They need to feel her... essence."

  "Her *essence*?" Julian’s laugh was a dry rattle. "Her essence was control, Lena! Precisely calibrated! Every interview, every photograph staged, every letter drafted and redrafted. She spent forty years meticulously building the myth, tearing it down, rebuilding it. And that control... it terrified her. That’s what those Paris letters *really* show – the panic beneath the bravado. Not some serene deathbed wisdom." He leaned forward, his eyes sharp. "Did you know she refused pain medication near the end? The nurses documented it. She wanted clarity, even in agony. To be *present* for her own exit. And you... you rolled in with a crane shot and gave her sentimental dialogue she'd have eviscerated in life?"

  Lena remembered the temptation. The draft Eleanor, facing the end, had almost voiced a regret about cutting ties with her daughter. The real Eleanor, in her last documented interview five years prior, had been characteristically acerbic: *"Clara chose her cage. I chose freedom. Regret is a luxury for the indecisive."* Lena had softened it, made the film Eleanor wistful, almost apologetic. A lie wrapped in a prettier truth. She hadn’t told Julian that part.

  "The speech gives her dignity," Lena argued, feeling the ground shift beneath her. "It synthesizes her philosophies."

  "It steals her silence!" Julian’s voice cracked. "Her final, absolute silence – the one thing she orchestrated perfectly! That *was* her last word. Her last statement. An absence she chose. And you filled it. You and your test audiences and your producer chanting 'public domain' like it’s absolution. You took the one piece of her life she managed to keep entirely for herself, and you sold it back to the world as fiction wearing her face."

  The waiter materialized, hesitant. "Is everything...?"

  "Fine," Lena snapped, too quickly. Julian waved the man away without looking.

  They sat in the wreckage of the meal. Lena poked at her uneaten sea bass. Julian stared past her, his face a mask of weary grief. Lena thought of the research, the hours in archives, the thrill of finding the perfect phrase in a faded letter, the satisfying *click* when it slotted into the deathbed monologue. How clever it had felt. How necessary for the *story*. Now it felt like vandalism.

  "It wasn’t malice, Julian," she said quietly. "It’s just... how it’s done."

  "I know," he said, his voice flat again. "That’s the worst part. It’s standard procedure. You assemble the dialogue. You polish the rough edges. You give them better lines than life ever did." He finally looked at her, his eyes devoid of the familiar scholarly fervor, replaced by a chilling emptiness. "Did you use the word 'sparkle'?"

  Lena flinched. The deathbed speech ended with Eleanor whispering, *"Look... how the light... sparkles..."* It was a fragment Lena had found in a discarded poem draft, circa 1948. Melancholy, pretty. It had tested through the roof.

  "Yes," Lena admitted. "An early poem draft. It felt... poignant."

  Julian let out a breath that was almost a sigh. "She hated that word. 'Sparkle'. Called it cheap sentiment. Glitter for the masses. Said it belonged on greeting cards and bad champagne." He pushed his chair back, the legs scraping loud on the tile. "Thirty years. I knew the weight of every word she chose, every one she rejected. And you gave her 'sparkle' as her final breath."

  He didn’t shout. He didn’t throw his napkin down. He simply stood, placed a twenty-dollar bill deliberately beside his unfinished plate, and looked at Lena with an expression she couldn't quite decipher – pity, perhaps, or profound disappointment.

  "I’ll send my notes on the factual errors in Act Two," he said, his tone suddenly professional, detached. "Goodnight, Lena."

  He walked out, leaving Lena alone at the table with the cooling food, the hum of the air conditioner, and the echoing sound of a stolen silence. The word "sparkle" burned in her mind, cheap and glittering, the final theft laid bare. She stared at Julian's empty chair, the untouched asparagus, the crisp twenty-dollar bill lying like an epitaph.

  Summary: We owe the dead the refusal to invent their silences.
