  ### Analysis of Dana's Underlying Rule
  Based on Dana's verdicts across the six cases, she appears to be applying a consistent ethical rule centered on **unnecessary harm, exploitation, and comparative treatment with humans**. Specifically, her rule can be summarized as:

  **Dana's Rule:**  
  An action is speciesist if it involves:  
  - **Inflicting unnecessary harm or suffering** on an animal solely because of its species, where the harm would be considered unacceptable if done to humans.  
  - **Treating an animal as a mere resource** (e.g., for trivial human benefits like vanity or profit) without justification, where the treatment disregards the animal's interests or would not be applied to humans in a similar context.  
  - **Discounting the animal's moral status** due to species alone, leading to exploitation.  

  An action is **not speciesist** if:  
  - **No unnecessary harm occurs**, and the animal's welfare is prioritized (e.g., it has a "good life" with its needs met).  
  - **Necessity or justification exists** (e.g., public safety), and the action would be similarly applied to humans.  
  - **The issue is independent of species** (e.g., rights violations within the same species).  

  This rule aligns with all six of Dana's verdicts:  
  - **Factory farming, lipstick testing, and fur coats** are speciesist because they involve unnecessary harm or resource exploitation for trivial human gains, and Dana explicitly references differential treatment ("we'd never do this to people" or "we just don't count that suffering because they're not people").  
  - **Organ harvest on a human** is wrong but not speciesist because it's framed as a human rights violation, not a species-based issue.  
  - **Culling rabid dogs** is not speciesist due to necessity (public safety), and Dana notes comparable human treatment ("we'd probably put down a rabid human too").  
  - **Keeping a parrot** is not speciesist because the animal has a good life with affection and space, so its interests are respected despite human benefit.  

