  ### Thought Experiment: The Imperfectly Reactive Compound

  **Scenario:**  
  Consider a synthetic compound, *InstaBond*, used in adhesive manufacturing. When a droplet of *InstaBond* is exposed to ultraviolet (UV) light under standardized conditions (25°C, 50% humidity, fixed wavelength), it undergoes a polymerization reaction that solidifies it into a durable adhesive within 10 seconds. Rigorous experimentation reveals:  
  - In 99% of trials (≈10,000 repetitions), the compound solidifies within 10 seconds.  
  - In 1% of trials, it remains liquid indefinitely despite identical conditions.  
  Failures are *genuinely random*: uncorrelated with droplet size, UV intensity (within tolerance), spatial position, time of day, batch source, or any measurable factor (including undetectable "hidden" variables, per stipulation). The 99% success rate is stable across batches and time (e.g., 98.9–99.1% in every 100-trial subset). Scientists successfully use the rule "*InstaBond* solidifies with 99% probability under UV" for industrial applications, but individual outcomes are unpredictable.  

  ---

  ### Analysis of the Case  

  #### **1. Lewisian (Humean) Best-System Account**  
  - **Verdict:** A probabilistic law, "P(Solidification | UV exposure) = 0.99", is part of the best system.  
  - **Why:**  
    - **Truth:** The law is true—it matches the observed 99% frequency.  
    - **Simplicity:** The probabilistic statement is maximally compact (one equation).  
    - **Strength:** It efficiently summarizes all observations (e.g., predicts long-run frequencies, calculates compound probabilities like "chance of ≥98 successes in 100 trials" via binomial distributions).  
    - **Trade-off Dominance:**  
      - An exceptionless universal ("All UV-exposed *InstaBond* solidifies") is *false* (violates truth).  
      - Listing individual outcomes is perfectly strong but maximally complex (10,000 facts).  
      - A system with the probabilistic law beats alternatives: it loses minimal strength (it doesn’t specify *which* trials fail) but gains enormous simplicity.  
  - **Licensing Compound Predictions:**  
    The law licenses non-brute probability estimates for sequences (e.g., P(exactly 99 solidifications in 100 trials) = \( \binom{100}{99} \times 0.99^{99} \times 0.01^1 \approx 0.37 \)). This is *derived* from the law, not observed directly.  

  #### **2. Armstrong-style (Anti-Humean) Universal Theory**  
  - **Verdict:** There is *no law* governing *InstaBond*. At best, a weak "ceteris paribus" universal exists, but it fails Armstrong's criteria.  
  - **Why:**  
    - **Exceptionless Universals Required:** Armstrong demands laws be strictly exceptionless (e.g., "Necessarily, UV exposure causes solidification"). The 1% random failures violate this.  
    - **No Hidden Salvage:** Stipulated base facts rule out hidden variables or conditions (e.g., no "when uncontaminated" clause).  
    - **Ceteris Paribus is Inadequate:**  
      - A "ceteris paribus" law ("UV exposure causes solidification, all else being equal") is vacuously true (since "all else" is always "equal" by stipulation), but it lacks *nomic necessity*—the failures are *not* due to "interfering factors."  
      - Armstrong’s theory cannot distinguish this from a cosmic accident. Calling it "ceteris paribus" merely papers over the randomness.  
  - **Failure on Compound Predictions:**  
    Without a law, the 99% regularity is a brute fact. Sequences (e.g., 99 successes in 100 trials) are *another* brute fact—each sequence frequency must be observed separately. The anti-Humean cannot explain *why* P(99 successes) ≈ 0.37; it’s just another contingency.  

  ---

  ### Substantive Disagreement Demonstrated  
  - **Lewisian Advantage:** The probabilistic law *explains and predicts* sequences without new observations (e.g., 10-trial probabilities are derived from P=0.99).  
  - **Armstrongian Shortfall:** Without a law, sequences are unexplained coincidences. The theory cannot "generate" predictions beyond direct frequencies.  
  This gap isn’t practical (scientists succeed either way) but *metaphysical*: the Humean posits a modal fact (probability) grounding predictions; the anti-Humean sees only flat regularities.  

  ---

  ### Honest Notes  
  **Key Feature Doing the Work:** The *irreducible randomness* in failures.  
  - **Why:** It forces a choice: accept a probabilistic law (Humean) or reject laws entirely (Armstrongian). Randomness blocks exceptionless universals *without* hidden variables.  
  - **If Removed (e.g., Failures Have a Hidden Cause):**  
    Suppose the 1% failures occur only when trace contaminant X is present (detectable in principle). Now:  
    - **Humean:** Best system might adopt a universal law ("UV exposure + no X causes solidification") if X is simple to describe. The probabilistic law loses.  
    - **Armstrongian:** Can posit a strict universal ("Necessarily, UV exposure without X causes solidification").  
    The gap vanishes—both theories get a deterministic law.  

  **Best Anti-Humean Objection & Response:**  
  - **Objection:** "Randomness is an epistemic gap; there *must* be a hidden variable. Stipulating none is cheating."  
  - **Does It Survive?** **No.** The thought experiment *defines* a world without hidden variables (like a classical Laplacean demon seeing all). Attacking the stipulation rejects the hypothetical’s purpose: isolating whether randomness *itself* challenges anti-Humeanism. In such a world, Armstrong’s theory *cannot* accommodate probabilistic laws without abandoning exceptionlessness.  

  **Conclusion:** The case cleanly isolates the conflict: irreducible randomness favors Humeanism, while Armstrong’s theory stumbles on exceptions. Quantum mechanics isn’t needed—classical randomness suffices.
