  ### Scenario
  Sarah, a 40-year-old environmental lawyer, must decide immediately whether to accept a high-impact job leading a national climate policy initiative or to relocate to care for her terminally ill sister, who has only months to live. The job requires full-time presence in the capital and offers a unique, time-limited opportunity to shape legislation preventing catastrophic ecological damage. Relocating to her sister’s rural hometown would provide essential emotional and physical support, ensuring her sister doesn’t die alone. Sarah holds two core desires: (1) to maximize her positive impact on future generations by fighting climate change (rooted in a lifelong commitment to justice and environmental protection, and surviving full information—e.g., she knows the policy’s exact potential to save millions of lives and ecosystems), and (2) to fulfill her deep familial duty to care for her sister in her final days (rooted in unconditional love and moral obligation, surviving full information—e.g., she knows her sister’s prognosis, the absence of other caregivers, and the irreplaceable value of their bond). Both desires conflict directly: no option satisfies both, as the jobs are mutually exclusive and deferral is impossible.

  ### Demonstration of the Design
  **Extrapolation alone (without coherence)**: After years of reflection with a patient adviser disclosing all relevant facts (e.g., climate impacts, sister’s needs, emotional consequences), Sarah’s extrapolated self retains both desires. She fully grasps the stakes, has no false beliefs, and is "more the person she wishes to be"—calm, informed, and values-aligned. Yet extrapolation only clarifies the conflict; it doesn’t resolve it. Her recommendation is paralyzed indecision: she endorses both desires equally but cannot act on both.  
  **Coherence procedure (minimal revision)**: We apply a *value-hierarchy revision rule*: when desires conflict, drop the one less coherent with the agent’s highest-priority values, minimizing changes to the desire set. Sarah’s value hierarchy (established via reflection) prioritizes "immediate moral duties to loved ones" over "abstract, large-scale altruism" (e.g., she values family care as foundational, while climate work is a broader extension of justice). This rule revises the conflict by dropping the climate-impact desire, as it is less integrated with her core relational values. The recommendation is to care for her sister.  
  **Why they come apart**: Extrapolation amplifies both desires but leaves them irreconcilable, as neither stems from ignorance or error. Coherence independently forces a choice by restructuring desires based on value coherence, which extrapolation doesn’t address.  
  **Feature doing the work**: The **asymmetry in value hierarchy** (family > systemic impact). If removed (e.g., if both values were equally prioritized), minimal revision would fail, forcing arbitrary choice or no resolution.  
  **Friend’s strongest attack and rebuttal**: Attack: "Full extrapolation would eliminate the conflict by revealing a hidden preference, as true consistency requires no revision." This fails because both desires are **constitutively irreconcilable**—they reflect plural, non-subordinate values (family vs. humanity) that survive idealization. Sarah’s "wished-for" self still faces tragic choices; coherence adds the structural rule to resolve them.  

  ### Verdict
  The case succeeds: the coherence step does independent work by restructuring desires, while extrapolation only refines them. The constraints are satisfied, with no blocking issue.
