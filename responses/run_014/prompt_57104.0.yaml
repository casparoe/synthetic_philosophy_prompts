prompt: |-
  Twenty-five people are signed up for a two-hour Saturday workshop I am running on the franchise: roughly half are sixteen- and seventeen-year-olds studying government and politics at school, and half are members of a local residents' association, several of whom are long-term residents without citizenship and therefore without a vote in national elections. I have a whiteboard and no handouts. I am not assigning anything, so please do not suggest readings.

  What I want from you is a plan for how to teach one idea, not the content of the session. The idea is that whether voting should be compulsory, whether the voting age should fall to sixteen, and whether resident non-citizens should be enfranchised are not three independent policy debates but three probes into a single underlying question about what entitles a person to a place in the electorate — and that the candidate grounds for inclusion (being subject to the coercive law, being affected by the decisions, being a participant in the ongoing collective undertaking) diverge from one another, and diverge again from whatever grounds could support compelling people to turn out.

  Please set out the following:

  - The order in which the pieces must be introduced, and why each must precede the next. In particular, what has to be established before the compulsion question can be posed at all without collapsing into the inclusion question, and whether the competing grounds should be built up one at a time or laid out simultaneously as rivals.

  - The single running case that should carry the workshop, together with what it must contain and what it must exclude. I have in mind one household: a long-term resident non-citizen parent, a sixteen-year-old who will be enfranchised in two years, and an adult citizen who has never voted and would not if left to himself. The three are identical in their exposure to the same laws and taxes and differ only in the formally relevant respects. Tell me whether this is the right vehicle, or whether it fails because several people in the room are themselves resident non-citizens and would end up functioning as the exhibit. If it fails, propose a replacement with the same structural properties.

  - The misconceptions the room will bring, in the order they are likely to surface, and the point in the sequence at which each should be pre-empted rather than rebutted afterwards. I anticipate at least these: that voting is a duty in the way jury service is; that any age threshold must be arbitrary because any line could be shifted; that excluding children on competence grounds is inconsistent with including adults who have cognitive impairments; that since one's own vote cannot be decisive, compulsion cannot be decisive either; and, from the younger half, that the issue is already settled in their favour. Please also tell me where to place the fact that what the standard compulsory-voting model actually compels is enrolment and attendance rather than the casting of a valid vote, without letting the session dissolve into procedural detail.

  - One question I can put at the end, on a case we will not have discussed, that would distinguish those who can apply the grounds from those who can only restate them.

  - What I should deliberately leave out at this level, and announce that I am leaving out.
reasoning: |-
  Hmm, the user is running a workshop on franchise principles for a mixed group of teenagers and adults, including non-citizen residents. They need a pedagogical plan—not content—for teaching how voting criteria interconnect. The core idea is that compulsory voting, voting age, and non-citizen inclusion aren't separate debates but probes into a single question: "What entitles someone to a place in the electorate?" They want structural guidance: sequencing logic, a case study design, misconception handling, and a capstone question.  

  First, sequencing is critical. The user rightly worries about conflating inclusion and compulsion. We must establish the "what grants entry" question *before* the "should we force voting" question. If compulsion comes first, the group will collapse it into inclusion debates (e.g., "If they’re in, they must vote"). So:  
  - Start with the household case to isolate three statuses: non-citizen (subject to law), 16yo (affected but minor), adult citizen (full rights). Ask: "Who *should* vote?" This surfaces criteria like subjection, affectedness, participation.  
  - *Then* introduce compulsion as a separate layer: "If we include them, must they vote?" This separates entitlement from obligation.  

  The household case is ideal but risky if non-citizen attendees feel objectified. Mitigate by:  
  - Making it hypothetical ("Imagine a household...")  
  - Avoiding real-world labels (use "Person A/B/C")  
  - Explicitly stating later: "This isn’t about any real person here."  

  Key misconceptions will erupt early. Pre-empt them by design:  
  - "Voting=jury duty": Address when defining grounds. Clarify jury duty is a *burden* for justice, voting is a *right* for legitimacy—different purposes.  
  - "Age thresholds are arbitrary": Surface when discussing the 16yo. Argue thresholds reflect balancing competence and inclusion; arbitrariness ≠ unreasonableness.  
  - "Excluding kids vs. including impaired adults": Tackle during criteria comparison. Note competence isn't binary—societal roles (e.g., parental authority) differ from voting’s collective agency.  
  - "My vote doesn’t matter": Debunk during compulsion. Use math (probability) + symbolism: voting isn’t instrumental but expressive of membership.  
  - Teens’ "issue is settled": Gently note this workshop is about principles, not current law.  

  The capstone question needs new material to test application. Use: "Should imprisoned citizens vote?" It pits subjection (they’re under law) against participation (breach of social contract).  

  Finally, declare omissions upfront: no procedural debates (e.g., compulsory attendance vs. valid votes), no historical comparisons, no partisan examples. Keeps focus on philosophical scaffolding.  

  This plan threads the needle: complex ideas made tangible via case study, misconceptions disarmed preemptively, and a clear arc from "who is in" to "what we ask of them."
answer: |-
  Here’s a pedagogical plan focused on structuring the *how* of teaching the core idea, sequenced to build conceptual clarity and pre-empt key misconceptions. The goal is to scaffold the logic of "entitlement vs. compulsion" without prescribing content.

  ### **Order of Introduction & Why**
  1. **Start with the Inclusion Question (Who *Should* Belong?)**  
     *Why first?* Establishes the primary puzzle: What grounds *justify entry* into the electorate? Without this foundation, compulsion is conflated with inclusion ("If they vote, they must be included" or vice versa). Use the household case (see below) to make abstract criteria concrete.  
     *Process:* Pose: *"Should all three household members vote? Why/why not?"* Elicit initial criteria (e.g., "affected by laws," "adult," "citizen").  

  2. **Map Competing Grounds for Inclusion (Simultaneously as Rivals)**  
     *Why simultaneously?* Laying out subjection, affectedness, and participation *side-by-side* forces contrast. Building them sequentially risks framing them as additive rather than conflicting.  
     *Process:* Group responses into three categories:  
     - **Subject to coercion** (bound by laws/taxes) → *Applies to all in household*.  
     - **Affected by decisions** (impacted by outcomes) → *Applies to all, but teens/non-citizens may argue uniquely*.  
     - **Participant in collective undertaking** (shared stake in political community) → *Often tied to citizenship/age*.  

  3. **Introduce Compulsion Only After Inclusion is Unsettled**  
     *Why last?* Compulsion presumes inclusion. Introducing it too early collapses into: "If they’re included, they must vote." Delay until the group sees inclusion criteria are contested.  
     *Process:* Once inclusion grounds are mapped, ask: *"Suppose we agree Person X *should* vote. Does it follow they *must* vote? Why/why not?"*  

  ---

  ### **The Running Case: Revised Household**  
  **Problem with Original:** Using real parallels (non-citizen residents) risks alienating attendees who share that status. They become specimens, not participants.  
  **Solution: Fictionalize & Generalize**  
  - Create **"Household 42"** with fictional names:  
    - *Ana (45)*: Citizen, never voted.  
    - *Ben (16)*: Will vote at 18, politically engaged.  
    - *Chloe (38)*: Non-citizen resident for 15 years, pays taxes.  
  - **Key Structural Properties Retained:**  
    - All subject to same laws/taxes.  
    - Formally differ only in citizenship/age.  
    - Includes a "reluctant voter" to sever inclusion from enthusiasm.  
  - **Why This Works:**  
    - Depersonalizes sensitive identities.  
    - Maintains focus on *criteria*, not lived experience.  
    - "Reluctant voter" (Ana) pre-empts "voting=voluntary duty" misconception.  

  ---

  ### **Misconceptions: Order & Pre-emption Strategy**  
  1. **"Voting is a duty like jury service"**  
     *When:* Likely when discussing Ana (reluctant voter).  
     *Pre-empt:* When introducing compulsion, contrast jury duty (burden-sharing for impartial justice) with voting (right/exercise of collective agency). Ask: *"Is voting a *burden* we share, or a *right* we exercise?"*  

  2. **"Any age threshold is arbitrary"**  
     *When:* When debating Ben (16yo).  
     *Pre-empt:* When mapping grounds, note: *"Thresholds aren’t about pinpointing maturity. They reflect where society balances *competence* (e.g., decision-making capacity) against *inclusion* (e.g., affectedness). Arbitrary ≠ indefensible."*  

  3. **"Excluding kids but including impaired adults is inconsistent"**  
     *When:* When competence is raised for Ben.  
     *Pre-empt:* When comparing grounds, state: *"Competence isn’t the only criterion. We might exclude minors based on *social role* (dependence) or *collective reciprocity*, not cognitive ability."*  

  4. **"One vote doesn’t matter → Compulsion is pointless"**  
     *When:* During compulsion discussion.  
     *Pre-empt:* When posing the compulsion question, add: *"Forget impact—what if voting signals *membership*? Does that change why we might compel it?"*  

  5. **Teens: "Issue is settled for us"**  
     *When:* Early, when introducing Ben.  
     *Pre-empt:* Open workshop with: *"We’re not debating *current* rules, but the *reasons* behind them. What principles might explain lowering the age?"*  

  **Placement of "Compulsion = Attendance, Not Valid Vote"**  
  - Introduce during compulsion discussion, *after* separating inclusion/compulsion.  
  - State: *"Note: Compulsory models usually enforce *showing up*, not voting. We’re asking why we’d compel attendance—not what happens in the booth."*  
  - **Why here?** Prevents procedural tangents but clarifies compulsion’s symbolic weight.  

  ---

  ### **Capstone Application Question**  
  **Pose:** *"Should citizens living abroad indefinitely retain voting rights? Apply our three grounds."*  
  - **Why this works:**  
    - Tests grasp of divergence: They’re participants (citizens) but minimally subject/affected by domestic laws.  
    - Not discussed earlier → Forces independent application.  
    - Reveals if they default to citizenship alone versus weighing criteria.  

  ---

  ### **What to Deliberately Omit & Announce**  
  1. **Omit:** Procedural debates (e.g., *how* compulsion is enforced).  
  2. **Omit:** Historical/global examples (distracts from conceptual mapping).  
  3. **Omit:** Contentious real-world referenda (e.g., Brexit’s impact on residents).  
  4. **Announce upfront:** *"Today we focus on the *structure* of the debate—how criteria interact. We won’t resolve policy, debate current laws, or discuss ballot mechanics."*  

  ### **Summary Flow**  
  1. **Hook:** Household 42 → "Who should vote?" → Map inclusion criteria (simultaneously).  
  2. **Separate:** "Does inclusion require compulsion?" → Contrast grounds for each.  
  3. **Pre-empt/Mitigate:** Misconceptions via targeted framing at key points.  
  4. **Apply:** Capstone question to test transfer of logic.  
  5. **Constrain:** Declare boundaries to maintain focus.  

  This structure forces the group to confront the disconnect between inclusion and compulsion grounds, using a neutralized case study to depersonalize stakes while retaining analytical rigor.
