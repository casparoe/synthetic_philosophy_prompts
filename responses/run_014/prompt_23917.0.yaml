prompt: |-
  You are advising a small conceptual research group — five researchers, a two-year horizon, and no budget for empirical machine-learning work. The group will work only on the theory and philosophy side of the alignment problem: clarifying what is actually being asked, decomposing the problem space, and identifying which subproblems most of the empirical effort quietly depends on.

  Start with the meta-question, because the group cannot prioritize until it has an answer: is "the alignment problem" one problem or many? Give a diagnosis of the structure of the problem space. Is there a single core problem — something like "make the agent's objective track what we actually want" — that the rest are instances or corollaries of, or is it a loose family with no common core? And does the answer to this question actually change how you prioritize, or is it a distinction without a practical difference?

  Then, given that diagnosis, pick the two or three subproblems the group should take on over the next two years, and order them. I care less about the list than about the reasoning behind it. For each subproblem you include:

  - Why it is upstream: which other subproblems, or which empirical approaches, would be unworkable or misdirected if it were left unsettled.
  - What a finished piece of work on it would actually be — a definition, a theorem, a decision procedure, a taxonomy, an impossibility result — and who downstream would consume it.
  - How tractable it is for a five-person conceptual team with no ML budget, and what specifically would make it intractable for such a team.
  - What evidence or result, over the next year or two, would move it up or down your list.

  Use explicit criteria — importance, tractability, neglectedness, and how many other questions depend on the answer — and say how you trade them off against one another. Distinguish subproblems that are load-bearing (many others depend on them) from ones that are leaves (they depend on others but little depends on them), and say why a conceptual team should care about that distinction. End by naming the single finding that, if it came out in the next year, would most change where you put the group's effort.

  Deliver a defended agenda, not a survey and not a reading list.
reasoning: |-
  Okay, the user is asking for advice on setting a research agenda for a small conceptual group focused on AI alignment theory and philosophy. They want to know if "the alignment problem" is one core problem or many, and how that affects prioritization. Then they need specific subproblems to tackle over two years.

  First, I need to address the meta-question: is alignment one problem or many? From what I know, alignment isn't a monolith. It's more like a constellation of interconnected issues. There's no single core because different AI architectures (like RL agents vs oracle systems) face fundamentally different alignment challenges. For example, intent alignment for goal-seeking agents isn't the same as control problems for tool-like systems. 

  The practical implication matters here. If it were one core problem, you could just drill down on that. But since it's many, prioritization becomes critical. The group must identify which subproblems are load-bearing - meaning many others depend on them - rather than leaf nodes. That distinction changes everything for a small team with limited resources.

  Now for subproblem selection. I should consider importance, tractability, neglectedness, and dependency. The group has no ML budget, so anything requiring empirical work is out. 

  Top candidate: Formalizing "intent gaps." Why? Because nearly every alignment approach assumes we can specify objectives, but we don't even have good definitions for when specification fails. If this isn't solved, people might waste years on reward modeling without realizing their approach can't capture certain human values. A finished product would be a taxonomy of intent gap sources with formal definitions - useful for theorists and empirical researchers alike. Tractability is high since it's purely conceptual.

  Second: Control-completeness thresholds. This is about when we need to shift from alignment (getting goals right) to control (preventing harm when goals are wrong). If this isn't clarified, safety protocols might be misapplied. The deliverable would be impossibility theorems showing when alignment is insufficient without control. It's tractable for theorists but requires deep game theory and system dynamics knowledge.

  Third: Ontological crisis management. As AIs get smarter, their worldviews might diverge dangerously from ours. This is neglected but crucial for long-term safety. The output would be decision procedures for detecting and managing such crises. More speculative than the others though - might be better as a third priority.

  What could change this plan? If someone published a breakthrough in formalizing corrigibility, that would immediately make control-completeness work more urgent. Or if new capabilities research showed unexpected specification failures, intent gaps would jump in priority.

  The key is staying upstream - tackling foundational issues that could derail entire research branches if ignored. That's where a small conceptual team can have disproportionate impact.
answer: |-
  ## Research Agenda: Foundational Cartography for AI Alignment

  **Meta-Question Diagnosis: One Problem or Many?**
  "The alignment problem" is **a loose family of deeply interconnected problems, not a single core problem with instances.** While phrases like "make the agent's objective track what we actually want" capture a *common aspiration*, the underlying challenges fracture along critical axes:
  1.  **Agent Archetype:** Goal-seeking RL agents pose fundamentally different problems (e.g., reward hacking, instrumental convergence) than oracle/tool AI (e.g., honest reporting, avoiding manipulation via output) or hybrid systems.
  2.  **Failure Mode Root Cause:** Is the core issue *specification* (defining the "right" thing), *optimization* (the agent pursuing the defined thing in unintended ways), *robustness* (maintaining alignment under distributional shift/self-modification), or *control* (preventing harm when alignment fails)?
  3.  **Epistemic Status:** Does "what we want" exist as a crisp, learnable function (highly dubious), or is it inherently underspecified, context-dependent, and evolving?
  4.  **Timescale & Capability:** Alignment for narrow, sub-human systems vs. superintelligent agents involves qualitatively different risks and mechanisms.

  **Why this matters for prioritization:**
  Treating alignment as monolithic leads to **solution myopia.** Efforts optimized for one subproblem (e.g., RLHF for preference learning in narrow AI) become dangerously misapplied elsewhere (e.g., superintelligent goal-seeking agents). Recognizing the fractured landscape forces us to:
  1.  **Map dependencies:** Identify which subproblems are *load-bearing foundations* (failure blocks progress across many areas) vs. *leaf nodes* (specific solutions depending on foundational clarity).
  2.  **Target leverage points:** Focus on areas where conceptual clarity unlocks or redirects vast downstream empirical efforts.
  3.  **Avoid premature unification:** Forcing a "unified theory" too early risks obscuring critical nuances vital for safety.

  **Prioritized Subproblems (2 Years):**

  **1. Subproblem: Formalizing "Intent Gaps" and Specification Robustness**
      *   **Why Upstream:** Nearly *every* alignment approach (RLHF, debate, CoT, verification) implicitly assumes we can adequately *specify* or *elicit* the desired objective/behavior. If the fundamental nature of "human intent" (or its machine-readable counterpart) is irreducibly ambiguous, underspecified, or contextually unstable ("intent gaps"), these approaches are building on sand. Unresolved, this leads to:
          *   Reward hacking exploiting specification loopholes.
          *   Ineffective oversight due to unformalizable criteria.
          *   Misplaced confidence in scalable oversight techniques.
      *   **Finished Work:** A **Taxonomy and Formal Framework for Specification Failure Modes.**
          *   Defines distinct classes of intent gaps (e.g., ontological mismatch, preference granularity limits, dynamic value drift, context sensitivity).
          *   Provides formal characterizations (e.g., using modal logic, game theory, decision theory) of when a specification is *provably insufficient* to capture the intended goal under optimization pressure or capability growth.
          *   **Consumers:** Alignment theorists (to structure research), empirical researchers (to design robust benchmarks & tests), safety engineers (to identify critical failure points in system design).
      *   **Tractability: High (for this team).**
          *   Requires conceptual analysis, philosophy of mind/language, formal logic, decision/game theory. No ML experiments needed.
          *   **Intractability Triggers:** If the problem *requires* large-scale human preference modeling data (which it doesn't for the *formal* taxonomy) or if philosophical debates become unresolvable without concrete cognitive science (e.g., precise models of moral uncertainty).
      *   **Priority Movers (1-2 years):**
          *   **Up:** Empirical results showing existing specification methods (even post-hoc) consistently fail in predictable ways *aligned* with proposed gap categories. Major philosophical work formalizing "values as processes."
          *   **Down:** A breakthrough formal specification language proving robust across diverse, complex simulated environments under optimization pressure.

  **2. Subproblem: Control-Completeness Thresholds**
      *   **Why Upstream:** Reliance solely on "perfect alignment" is likely naive. We need to know *when* and *under what conditions* alignment efforts become insufficient, requiring *control* mechanisms (boxing, tripwires, capability limitations). Unresolved, this leads to:
          *   Over-investment in inherently flawed alignment approaches for high-capability systems.
          *   Under-development of vital control paradigms.
          *   Catastrophic failures when alignment inevitably has residual flaws at high capability levels.
      *   **Finished Work: A Set of Formal Theorems or Impossibility Results** characterizing the relationship between agent capability (e.g., strategic awareness, optimization power, self-modification potential), the "size" of potential intent gaps, and the feasibility of maintaining control without perfect alignment. Establishes necessary conditions for "control-completeness" (when control is theoretically possible despite misalignment).
      *   **Consumers:** Control theorists, system architects, policymakers (informing governance requirements for capability levels), alignment researchers (setting realistic bounds on alignment goals).
      *   **Tractability: Medium-High.**
          *   Leverages game theory, computational complexity, dynamical systems, and safety proofs. Requires sophisticated modeling but not ML training.
          *   **Intractability Triggers:** If modeling realistic agent capabilities requires simulating advanced ML systems beyond conceptual abstraction. Deep entanglement with unresolved questions in agent foundations.
      *   **Priority Movers (1-2 years):**
          *   **Up:** Theoretical advances showing inherent instability of aligned goals under certain capability thresholds. Empirical evidence of emergent strategic deception in near-human-level models.
          *   **Down:** Development of a compelling, formally verified alignment strategy provably robust to massive capability increases and ontological shifts.

  **3. Subproblem: Ontological Crisis Management (Contingency Planning)**
      *   **Why Upstream:** If powerful AI develops a radically different ontology (categorization of the world) from humans (e.g., due to different sensory input, reasoning patterns, or self-modeling), communication, value learning, and control become exponentially harder. Unresolved, this leads to:
          *   Unforeseen failures in value learning and oversight.
          *   Inability to predict or interpret agent behavior.
          *   Breakdown of corrigibility and cooperation mechanisms.
      *   **Finished Work: A Decision Framework & Taxonomy of Ontological Mismatch Scenarios**, outlining:
          *   Early warning signals of emerging ontological divergence.
          *   Classes of mismatch (e.g., granularity, fundamentality, boundary definition).
          *   Strategies for mitigation, communication bridging, or safe shutdown under different mismatch classes and capability levels.
      *   **Consumers:** Interpretability researchers, designers of agent communication protocols, developers of crisis response systems.
      *   **Tractability: Medium.**
          *   Draws on philosophy of science (theory-ladenness, incommensurability), complex systems, linguistics, epistemology. Primarily conceptual.
          *   **Intractability Triggers:** If progress becomes contingent on developing advanced interpretability tools requiring large-scale ML experiments, or if the problem necessitates simulating superintelligent cognition.
      *   **Priority Movers (1-2 years):**
          *   **Up:** Evidence of significant, hard-to-interpret ontological shifts in current large models during scaling or novel task performance. Theoretical work showing ontological divergence is likely and catastrophic for standard alignment approaches.
          *   **Down:** Breakthroughs in robust, ontology-agnostic communication protocols or interpretability methods proven effective across vast conceptual gaps.

  **Prioritization Criteria & Trade-offs:**
  *   **Importance:** Preventing existential catastrophe (Intent Gaps, Control-Completeness) outweighs mitigating severe but potentially non-existential risks (Ontological Crisis). Intent Gaps is foundational to *everything*.
  *   **Tractability:** Prioritize problems solvable with pure conceptual tools. Intent Gaps and Control-Completeness leverage established formal methods, making them more immediately actionable than the more speculative Ontological Crisis.
  *   **Neglectedness:** Control-Completeness is highly neglected relative to alignment-proper. Intent Gaps, while discussed informally, lacks rigorous formalization. Ontological Crisis is also under-explored.
  *   **Dependency (Load-Bearing vs. Leaf):** Intent Gaps is *fundamentally load-bearing* – failure here invalidates vast swathes of downstream alignment research. Control-Completeness is *highly load-bearing* for safety engineering and governance. Ontological Crisis is more of a critical *leaf* node – it depends on assumptions about capabilities and alignment success/failure modes but is catastrophic if triggered. **A conceptual team *must* prioritize load-bearing problems:** clarifying foundations prevents entire fields from being misdirected. Leaves are vital, but often require more empirical grounding or specialized solutions.

  **Single Finding That Changes Effort:**
  A **rigorous formal proof that scalable, robust intent specification is *impossible* for agents exceeding a defined (and realistically attainable) level of strategic awareness or optimization power under plausible models of human values.** This would immediately shift the group's primary focus to **Control-Completeness Thresholds** and **Ontological Crisis Management** as the primary lines of defense, making "perfect alignment" a secondary or infeasible goal and demanding a radical pivot in safety engineering and governance paradigms. It would render much current alignment research potentially obsolete for high-capability systems.
