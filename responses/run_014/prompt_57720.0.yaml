answer: |-
  Here's the joke, hitting all your constraints:

  After four years of meticulous drafting, the DSM work group unveiled "anticipatory dysregulation": pervasive rehearsal of future conversations coupled with accurately self-applying diagnostic criteria. Field trials, run DSM-III style, showed unnerving reliability and prevalence that *doubled* on re-test. Flummoxed, the committee refined it by adding: "Not better accounted for by familiarity with the criteria."

  They called it a precision win. The philosophers just sighed. Tightening the definition required *more* familiarity to legitimately qualify – the criteria now perfectly predicted their own confirmation. It wasn’t just labeling changing the labeled; the category had become exquisitely self-sealing.

  Quarks, bless their indifferent hearts, wouldn’t bother reading the particle physics journals. If they did, they certainly wouldn’t start *acting* like the latest model predicted... just to fit in.

