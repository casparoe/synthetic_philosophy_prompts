  I should consider if Rousseau's context matters. Geneva was small, with tight-knit communities. Theater could replace community interactions. Modern media is consumed privately, so maybe the effect is different. But Rousseau's deeper point about substituting empathy for action might still hold. 

  Then, the objection from Émile. Rousseau allows certain readings because they model self-reliance (Robinson Crusoe) or civic virtue (Plutarch). The key is the active mental participation. So, for modern media, the question is whether engagement is active or passive. Video games might be interactive, but are they morally instructive? 

  Weighing the arguments: Rousseau's core idea might generalize to passive consumption, but not all modern media is passive. Reading novels vs. watching TV. Also, his later work suggests context matters. Geneva had no theaters, but his principles could apply elsewhere. 

