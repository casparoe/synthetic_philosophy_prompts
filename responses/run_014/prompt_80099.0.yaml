  ## Joint Statement on Transport Voucher Reform: Welfare Egalitarianism vs. Resource Egalitarianism  
  *Adversarial Collaboration between [Colleague A, Welfare Egalitarian] and [Colleague B, Resource Egalitarian]*  

  ### Section 1: Foundational Agreements  
  We concur on the following principles, irrespective of our theoretical differences:  

  1. **Core Aims of Equality**:  
     - **Welfare Egalitarianism (WE)** seeks to equalize *actual well-being* across individuals, ensuring comparable levels of flourishing, preference satisfaction, and life quality, accounting for differential barriers to achieving these ends.  
     - **Resource Egalitarianism (RE)** seeks to equalize *socially valued resources* (e.g., income, opportunities, liberties), adjusted for unchosen disadvantages that impair individuals’ ability to convert resources into well-being.  

  2. **Inadequacy of Self-Reported Life Satisfaction**:  
     Both reject self-reported life satisfaction as a sufficient metric for policy. It risks:  
     - **Adaptation artifacts**: Deprived individuals may underreport dissatisfaction due to resignation.  
     - **Cognitive biases**: Surveys capture momentary states, not objective flourishing.  
     - **Paternalism risks**: Overreliance on subjective reports may ignore unmet needs masked by resilience.  

  3. **Critical Role of Conversion Factors**:  
     Disability, transport costs, and caregiving availability are *non-negotiable conversion factors* that determine how resources translate into well-being. Both agree these must inform policy design:  
     - **WE** uses them to calculate compensation needed for well-being equality.  
     - **RE** uses them to calibrate resource entitlements for fair opportunity.  
     Ignoring these factors would entrench injustice under either framework.  

  ---

  ### Section 2: Diverging Positions and Core Disputes  
  #### Position Statements  
  - **Welfare Egalitarianism (WE)**: Justice demands equalizing *outcomes in well-being*. The transport voucher reform must prioritize guaranteeing comparable quality of life for disabled residents. If cash payments fail to achieve this due to heterogeneous needs, they are unjust—even if they maximize aggregate welfare or autonomy.  
  - **Resource Egalitarianism (RE)**: Justice demands equalizing *access to opportunity-sets*. The reform must prioritize providing disabled residents with a fair share of resources, adjusted for disability-related conversion barriers. Cash payments respect autonomy in resource use, provided the baseline allocation is appropriately calibrated.  

  #### Key Disputes and Diagnostic Tests  
  Three unresolved questions define our disagreement. For each, we propose a hypothetical test both accept as relevant:  

  1. **Should Adaptive Preferences Be Treated as Authoritative?**  
     - **Dispute**: Whether individuals’ adjusted expectations (e.g., lowered mobility goals due to chronic under-support) should define their well-being baseline.  
     - **Test**: *Policy Variant*: Offer a choice between cash and vouchers, paired with independent well-being audits (e.g., access to healthcare/work).  
       - **WE Prediction**: Audits will reveal unmet needs among cash recipients who "adapt" (e.g., skipping essential trips). Proves cash penalizes those with non-negotiable needs.  
       - **RE Prediction**: Audits will show cash users achieve comparable outcomes via diverse strategies (e.g., pooling funds for cheaper rides). Proves adaptation is legitimate agency.  

  2. **Should Resources Be Measured Pre- or Post-Conversion?**  
     - **Dispute**: Whether justice evaluates resources *before* accounting for individual conversion rates (e.g., "$X cash for all with disability Y") or *after* ("enough cash so disability Y imposes no well-being loss").  
     - **Test**: *Policy Variant*: Compare a uniform cash payment versus one scaled to disability severity (e.g., quadriplegia vs. partial mobility).  
       - **WE Prediction**: Uniform cash leaves those with severe disabilities worse off. Scaling is necessary for well-being equality.  
       - **RE Prediction**: Scaling risks misjudging personal conversion factors (e.g., resilience/vulnerability). Uniform cash + disability-adjusted base is sufficient for fair opportunity.  

  3. **Ex Ante Opportunity vs. Ex Post Welfare: Which Is Primary?**  
     - **Dispute**: Whether justice requires equalizing *expected opportunities* (ex ante) or *realized well-being* (ex post).  
     - **Test**: *Argument*: "Cash payments are just if recipients *could* secure adequate transport, even if some fail due to personal choices."  
       - **WE Prediction**: Some will fail due to non-culpable factors (e.g., cognitive impairment, lack of family support). Ex post suffering is unjust.  
       - **RE Prediction**: Individual responsibility matters. Ex ante fairness is achieved if cash is sufficient for typical needs; misuse does not imply injustice.  

  ---

  ### Residual Disagreement: Summary Table  
  | **Issue**                          | **Welfare Egalitarianism (WE)**                          | **Resource Egalitarianism (RE)**                         |  
  |-----------------------------------|---------------------------------------------------------|---------------------------------------------------------|  
  | **Equality's Target**             | Post-conversion well-being outcomes                     | Pre-conversion resource opportunity sets                |  
  | **Adaptive Preferences**          | Suspect; may mask oppression. Compensate for deprivation. | Respect as autonomy; state should not override choices. |  
  | **Resource Metric**               | Measure *after* individual conversion (needs-adjusted). | Measure *before* conversion (disability-adjusted).      |  
  | **Temporal Focus**                | **Ex post welfare**: Guarantee realized well-being.     | **Ex ante opportunity**: Guarantee fair initial shares. |  
  | **Cash Payment Assessment**       | Unjust if well-being gaps persist, regardless of choice. | Just if resources are fairly allocated, regardless of outcomes. |  

  ---  
  **Conclusion**: Our collaboration confirms that the voucher reform hinges on *irreducible normative disagreements* about autonomy, responsibility, and the currency of justice. WE prioritizes eliminating well-being disparities, while RE prioritizes equipping individuals to navigate their own circumstances. Both agree, however, that any policy must transparently track conversion factors (e.g., via usage data and well-being audits) to mitigate harms under either standard. We urge policymakers to explicitly address these trade-offs rather than masking them under efficiency claims.
