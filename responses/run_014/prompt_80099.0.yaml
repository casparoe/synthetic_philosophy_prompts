  We are producing a jointly published document after an adversarial collaboration between a welfare egalitarian (WE) and a resource egalitarian (RE). The document has two main sections: one with agreed propositions and one with the two positions and the key questions on which they disagree.

  Section 1: Agreed Propositions

  Both colleagues agree on the following:

  1. **Aim of Equality of Welfare**: The welfare egalitarian holds that justice requires equalizing the actual well-being (or welfare) of individuals, such that each person achieves a comparable level of life satisfaction, flourishing, or preference satisfaction, adjusted for the inherent challenges they face.

  2. **Aim of Equality of Resources**: The resource egalitarian holds that justice requires equalizing the holdings of socially valued resources (such as income, wealth, and opportunities) that individuals command, with adjustments made for relevant disadvantages (e.g., disabilities) that affect how resources convert into well-being.

  3. **Incompleteness of Self-Reported Life Satisfaction**: Both agree that self-reported life satisfaction is an incomplete metric for well-being. It can be distorted by adaptive preferences (where individuals lower their expectations due to persistent deprivation), cultural norms, or cognitive biases. Therefore, it cannot be the sole basis for policy.

  4. **Importance of Conversion Factors**: Both agree that conversion factors (such as disability, local transport costs, and caregiving availability) are crucial in determining how resources translate into well-being. For instance, a person with a severe disability may require more resources to achieve the same level of well-being as an able-bodied person. These factors must be taken into account in any egalitarian theory, even if they do not settle the dispute between the two views.

  Section 2: Positions and Key Questions

  We now state the two positions in mutually acceptable language and identify the minimal set of questions on which their conclusions depend.

  **Welfare Egalitarianism (WE)**: This position holds that justice requires society to arrange its institutions so that individuals end up with equal levels of well-being, after accounting for the differential costs of achieving well-being due to factors beyond their control. The focus is on the outcome (well-being) and compensating for disadvantages that impede achieving well-being.

  **Resource Egalitarianism (RE)**: This position holds that justice requires society to distribute a fair share of resources to each individual, with the share being adjusted for factors that affect the conversion of resources into well-being (such as disabilities). The focus is on the opportunity set (resources) and ensuring that individuals have equivalent means to pursue their own conception of the good, without guaranteeing equal outcomes.

  The disagreement centers on the following questions:

  1. **Question 1: Should adaptive preferences be taken at face value?**
     - *WE*: Argues that adaptive preferences (e.g., a disabled person who reports high satisfaction because they have lowered their expectations) should not be taken at face value because they mask underlying deprivation. Justice requires compensating for the deprivation even if the person does not report dissatisfaction.
     - *RE*: Argues that adaptive preferences should be respected as part of an individual's autonomous adaptation to their circumstances. The state should not paternalistically override an individual's reported preferences. Instead, it should provide the resources that allow individuals to pursue their own goals.

     *Hypothetical Policy Variant*: Consider a policy that provides both cash and an option for in-kind transport, but also includes a well-being assessment that uses objective indicators (e.g., ability to access essential services) alongside self-reports.
     - *WE Prediction*: This would show that some individuals who report high satisfaction still have objectively restricted access, revealing that self-reports alone are insufficient and that cash payments without adjustment for adaptive preferences lead to under-compensation.
     - *RE Prediction*: This would show that the objective indicators may not capture what individuals truly value, and that the cash option allows individuals to use resources as they see fit, even if they choose to spend less on transport and more on other goods. The objective indicators might overstate deprivation.

  2. **Question 2: Should resources be measured before or after individual differences in conversion?**
     - *WE*: Resources should be measured after conversion, meaning that the focus is on the level of well-being achieved. The state must compensate for differences in conversion (e.g., by giving more resources to those with disabilities) so that well-being is equalized.
     - *RE*: Resources should be measured before conversion, meaning that the state provides a bundle of resources adjusted for known conversion factors (like disability) but does not adjust for all individual variations in how resources are used. The goal is to equalize the opportunity set, not the outcome.

     *Hypothetical Policy Variant*: Consider two schemes: (A) a flat cash payment to all disabled residents, and (B) a cash payment that is scaled based on the severity of disability (as assessed by a panel).
     - *WE Prediction*: Scheme B would be more just because it accounts for differential conversion factors and thus brings individuals closer to equal well-being. Scheme A would leave those with more severe disabilities worse off in terms of well-being.
     - *RE Prediction*: Scheme B might be acceptable if the scaling is based on objective measures of the resource cost of the disability, but caution that over-adjustment could lead to inequities (e.g., if two people with the same disability have different abilities to convert resources). However, RE would generally prefer a scheme that provides a resource bundle adjusted for disability (like B) over a flat cash payment (A) because it accounts for the conversion factor.

  3. **Question 3: Is the relevant comparison ex ante expected welfare or ex post realized welfare?**
     - *WE*: The relevant comparison is ex post realized welfare. Justice requires that, after the fact, individuals have achieved similar levels of well-being. This might require ongoing adjustments and monitoring.
     - *RE*: The relevant comparison is ex ante expected welfare. Justice requires that individuals start with a fair share of resources, and then they are responsible for the choices they make with those resources. This avoids the state continuously intervening to correct outcomes.

     *Hypothetical Argument*: Consider the argument that the cash payment scheme may lead to some disabled residents making poor choices (e.g., spending the cash on non-transport needs and then being unable to travel) and thus having low ex post welfare.
     - *WE Prediction*: This outcome (low ex post welfare) is unjust and requires either replacing the cash scheme with in-kind or providing additional safeguards to ensure well-being is achieved.
     - *RE Prediction*: As long as the initial resource allocation was fair (adjusted for disability), the state has done its part. Individuals are responsible for their choices, and it would be paternalistic to restrict their freedom to spend the cash.

  Compact Table of Residual Disagreement:

  | Question | Welfare Egalitarian (WE) | Resource Egalitarian (RE) |
  |----------|--------------------------|---------------------------|
  | **1. Adaptive Preferences** | Should not be taken at face value; compensation for underlying deprivation is required. | Should be respected; state should not override individual preferences. |
  | **2. Measurement of Resources** | Resources should be measured after conversion (focus on well-being outcomes). | Resources should be measured before conversion (focus on opportunity sets). |
  | **3. Relevant Comparison** | Ex post realized welfare (outcome equality). | Ex ante expected welfare (initial opportunity equality). |

  This table summarizes the core disagreements that remain. Both positions agree on the importance of conversion factors and the inadequacy of self-reported satisfaction as a sole metric, but they diverge on these three key issues.

  By structuring the debate in this way, the document clarifies that the choice between the cash payment and the in-kind voucher depends on which of these foundational questions one prioritizes. The welfare egalitarian would lean toward the in-kind voucher (or a cash payment adjusted for individual circumstances) to ensure well-being is protected, while the resource egalitarian would support the cash payment as it respects individual autonomy and provides flexibility, provided the cash amount is appropriately adjusted for the disability.
