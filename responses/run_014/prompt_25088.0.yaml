  Based on your description of Diane's verdicts across the five cases, I can identify two underlying principles that consistently explain her judgments. These principles are derived from common concepts in behavioral economics, social psychology, and decision theory. They fit all five cases perfectly but point to opposite conclusions for your book reviewer scenario. I'll outline the principles, explain how they apply to each case, clarify which one Diane is using for the book case, and then suggest a sixth case to "force her to commit" by exposing a conflict between the principles.

  ### The Two Principles
  1. **The "Wisdom of Crowds" Principle (Principle W)**: It is smart to follow the crowd when the crowd's behavior aggregates independent, decentralized information, especially in situations where individuals have private knowledge or experience, and where the cost of individual investigation is high or the decision is time-sensitive. This principle relies on the idea that collective actions or choices can reveal accurate signals about quality, risk, or value when the crowd is diverse and acting on its own behalf without coordination.
     
  2. **The "Herd Behavior" Principle (Principle H)**: It is not smart to follow the crowd when the crowd's behavior is likely driven by social influence, imitation, or irrational exuberance, rather than independent judgment. This is especially true when investigation is feasible, the crowd is small or unrepresentative, or the decision involves complex factors where groupthink can lead to errors (e.g., bubbles, fads, or unverified opinions).

  These principles conflict in the book case because Principle W would support buying the book based on multiple five-star ratings (as it suggests aggregated opinions from independent reviewers), while Principle H would reject it (as the reviewers may be influenced by bias, hype, or each other, and verification is easy).

  ### How the Principles Apply to Diane's Five Cases
  - **Tourist picks crowded restaurant (smart)**:  
    - **Principle W**: The crowd's choice aggregates individual experiences (e.g., diners voting with their feet based on food quality), and investigating alternatives is costly/time-consuming (e.g., missing a meal or trying a bad restaurant).  
    - **Principle H**: Not strongly applicable here, as the crowd is large and diverse, reducing the risk of pure imitation. Diane's verdict aligns with Principle W.
    
  - **Bank run participant (smart)**:  
    - **Principle W**: Withdrawing without investigation is rational because the crowd's actions signal potential bank insolvency (based on depositors' private concerns), and delay could lead to total loss—individual fact-checking is impractical in a panic.  
    - **Principle H**: Herding is present, but the high stakes and urgency make it smart to follow; Principle H might warn of panic but doesn't override the wisdom in this context. Diane's verdict fits Principle W.

  - **Party stock tip (not smart)**:  
    - **Principle W**: Doesn't apply because it's one loud person, not a crowd—no aggregation of independent information.  
    - **Principle H**: Clearly dumb, as the tip is based on a single, potentially biased source and investigation (e.g., research) is easy. Diane's verdict aligns with Principle H.

  - **Evacuating family (smart)**:  
    - **Principle W**: Neighbors leaving signals aggregated private observations of danger (e.g., smoke, sounds), and checking the news could waste critical time—following the crowd is efficient and low-risk if wrong.  
    - **Principle H**: Herding could occur, but the urgency and cost of being wrong (death) make it smart; Principle H doesn't dominate. Diane's verdict fits Principle W.

  - **2006 home buyer (not smart)**:  
    - **Principle W**: Doesn't apply because the "everyone saying prices go up" sentiment reflects herd behavior, not independent judgment—people are parroting hype, not sharing private data.  
    - **Principle H**: Clearly dumb, as it's a bubble driven by social contagion; investigation (e.g., assessing market fundamentals) was feasible and would have revealed risks. Diane's verdict aligns with Principle H.

  In all cases, Diane's verdicts are consistent with both principles because Principle W emphasizes contexts where crowds provide genuine informational value, while Principle H focuses on contexts where crowds amplify noise or error. The key differences are:
  - **Crowd size and independence**: Principle W requires a large, diverse crowd acting on private info (cases 1,2,4), while Principle H highlights small groups (case 3) or irrational conformity (case 5).
  - **Feasibility of investigation**: Principle W applies when checking facts is hard or risky (cases 1,2,4), while Principle H applies when it's easy (cases 3,5).
  - **Type of signal**: Principle W favors observable actions (e.g., eating, withdrawing, evacuating) over opinions (e.g., stock tips, market sentiment).

  ### Diane's Take on the Book Case
  For your protagonist buying the book based solely on five-star ratings from unknown reviewers:
  - **Diane's verdict**: She says it's "dumb," like the party stock tip (case 3). This aligns with **Principle H (Herd Behavior)**. 
    - Why? Diane sees the five reviewers as a small, potentially unrepresentative group. Their ratings could be influenced by factors other than genuine quality (e.g., hype, paid promotions, or mutual copying), and since the reviewers/outlets are unknown, there's no basis to trust their independence. Moreover, investigation is feasible—your protagonist could read the reviews, check samples, or seek trusted sources—so blindly following the ratings is risky herd behavior.
  - **Your view (it's like the restaurant)**: You're applying **Principle W (Wisdom of Crowds)**, arguing that five positive ratings aggregate independent opinions to signal quality, similar to a crowd choosing a restaurant. But Diane rejects this because: 
    - Five reviewers is a small sample size (vs. a "crowded" restaurant), increasing the risk of bias. 
    - Ratings are opinions, not direct actions (e.g., people buying or reading the book), so they lack the tangible signal of the restaurant crowd. 
    - Reviewers may not be disinterested actors; they could have incentives to inflate ratings, unlike diners who vote with their wallets.

  Thus, Diane is running **Principle H** here, emphasizing the potential for herd-like influence and the ease of verification.

  ### A Sixth Case to Force Diane to Commit
  To force Diane to choose between Principle W and Principle H, propose a scenario where the two principles conflict: a case involving a large, observable crowd action that seems wise but could be driven by herd behavior, with low stakes and no urgency. This exposes whether she prioritizes the wisdom of crowds or the risk of irrational imitation when investigation is easy.

  **Sixth Case**:  
  *Character sees a viral TikTok trend where thousands of people are buying a specific "miracle" kitchen gadget (e.g., a banana slicer) because it appears in countless videos. The character buys it immediately, solely because of the massive online buzz and visible sales surge, without reading reviews or checking if they need it. The gadget turns out to be cheap and useless.*

  - **Why this forces commitment**:  
    - **Principle W would call this smart**: The large crowd's actions (buying the gadget) aggregate independent preferences and signal popularity/quality, similar to the restaurant. Investigation (e.g., reading reviews) is feasible but could be seen as costly in terms of missing out on the trend.  
    - **Principle H would call this not smart**: The behavior is likely driven by social media herd behavior (e.g., FOMO, influencers), not independent judgment. Investigation is easy (e.g., a quick search), and the low stakes (it's a cheap gadget) mean there's little cost to pausing.  
    - **Conflict**: If Diane says "smart," she's committing to Principle W, trusting large crowds even in low-stakes, herd-prone contexts. If she says "not smart," she's committing to Principle H, emphasizing herd risk over crowd wisdom.  
    - **Based on her pattern**: Diane would likely say "not smart," as this resembles the housing bubble (case 5)—a fad driven by hype, not fundamentals—and she prioritizes Principle H when investigation is feasible. But if she waffles, it reveals that her principles depend on additional factors like stakes or crowd size.

  This case "forces her to commit" because it mirrors the book scenario (opinions/buzz) but with a large-scale action (sales), making it harder to default to her usual distinctions. It tests whether she consistently applies Principle H to all opinion-driven contexts or if crowd size can override it.
