  Here's the custom-built scenario designed to your specifications. I'll first present the case, then analyze it against the requested theories, identify the crucial element, and assess the constraints.

  ### The Scenario: The Exhausted Diagnostician
  Dr. Lena Chen, a hospital psychiatrist, has just completed a 36-hour shift during a crisis. She’s reviewing final tests for a patient with ambiguous symptoms. The results (a definitive biomarker panel and imaging) conclusively show Disorder X, which Lena knows is treatable if caught early. Ordinarily, this evidence would instantly convince her, but she’s cognitively depleted and emotionally numb from back-to-back trauma cases. Her trusted colleague, monitoring her for signs of decision fatigue as part of a clinical safety protocol, interrupts: "Lena, your verbal responses and hesitation patterns show you’re not actually forming new diagnostic beliefs right now—it’s the exhaustion. Trust the tests; the patient has X." Lena, aware of her colleague’s expertise and the study validating these behavioral markers, nods. Turning to her team, she says: **"The patient has Disorder X, but I don't believe they have it."** When questioned, she explains calmly: "The evidence is unequivocal—X is true. But I’m too drained for that evidence to trigger conviction in me right now. My colleague’s assessment confirms I’m in a state where cognitive uptake is impaired, so I’m reporting the fact and my current doxastic state separately to avoid misrepresenting my readiness to act."

  ### Analysis Against Standard Explanations
  1. **Assertion-Style Views (e.g., "Assertion Expresses Belief" or "Knowledge Norm")**:  
     - *Verdict*: **Improper-but-excusable**.  
     - *Reasoning*: Asserting "p" conventionally expresses that you believe p (or know p). By adding "but I don’t believe p," Lena directly contradicts this expression. The knowledge norm might excuse her because she *knows* p is true (via conclusive evidence), but the assertion remains pragmatically defective as it signals conflicting commitments. If she lacked the colleague’s warning, this would be outright absurd—but here, her exhaustion and the external validation provide a "warranted override" context.  
     - *Effect of Deleting Key Feature*: Without the colleague’s real-time feedback, Lena couldn’t reliably attribute her disbelief. The utterance becomes reckless self-contradiction ("I know p but don’t believe it?"), collapsing into standard absurdity.

  2. **Shoemaker’s Linking Principle (Belief → Self-Knowledge)**:  
     - *Verdict*: **Absurd**.  
     - *Reasoning*: Shoemaker holds that rational belief in p entails belief *that* you believe p ("transparency"). Lena’s sincere denial of belief ("I don’t believe p") while affirming p violates this. Her case suggests transparency *failed* due to exhaustion—but for Shoemaker, this failure *is* irrationality. Her colleague’s input doesn’t restore rationality; it highlights a breakdown in the self-relation essential to belief.  
     - *Effect of Deleting Key Feature*: Remove the colleague’s intervention, and Lena loses her justification for the disbelief-ascription. But even *with* it, Shoemaker would argue she’s describing a pathological state (non-transparent belief), not a rational one. The case challenges his view by presenting non-transparency as externally verifiable and blameless.

  3. **Rosenthal’s View (No Belief-Level Problem)**:  
     - *Verdict*: **Perfectly fine**.  
     - *Reasoning*: Rosenthal sees no paradox in *believing* the Moorean conjunction (p & ~Bp). The oddity is purely assertoric: asserting "p" implicates you believe it, creating pragmatic tension. Here, Lena’s utterance is transparent about her state—she *isn’t* implicating belief in p because she explicitly denies it. Her justification (exhaustion + validation) makes the denial credible and informative. This is a "self-reporting exception" to the implicature.  
     - *Effect of Deleting Key Feature*: Without the colleague’s evidence, Lena’s self-ascription of disbelief might seem arbitrary or unreliable, making the assertion misleading or irrational. With it, Rosenthal’s view handles it cleanly.

  ### Crucial Feature & Collapse Test
  - **Key Feature**: **Externally validated higher-order evidence (HOE) of belief-formation failure**. The colleague’s expertise provides Lena with direct, empirical evidence that her cognitive state blocks belief-acquisition, *independently* of her first-order evidence for p.  
  - **If Removed**: The case implodes. Lena would have no grounds to assert disbelief truthfully—it might become self-deception ("I feel unsure so I must not believe it"), exclamatory ("I can’t believe it!"), or irrational. HOE is the scaffold holding the two levels apart.  
  - **Collapse?** No. Standard "unremarkable" cases (e.g., "p, but I didn’t believe it yesterday") use tense/indexicals, which are banned here. This scenario avoids those while preserving sincerity and correctness.

  ### Best Counterattack & Its Viability
  - **Counterattack (Assertion Theorist)**: "Lena isn’t *asserting* the first conjunct—she’s merely *reporting* the test results or her colleague’s statement. She’s only committed to 'The tests say p,' not p itself."  
  - **Does It Land?** **No.** The scenario blocks this: Lena presents "the patient has X" as a fact (backed by evidence *she* endorses as conclusive), not as hearsay. Her explanation confirms she’s asserting p *as true* while disavowing her psychological state. Redescribing this as indirect speech violates the "no reporting" ban and misreads her communicative intent.

  ### Constraint Satisfaction Check
  **Jointly satisfiable? Yes, but at high tension.**  
  - **Why it works**: Higher-order evidence (HOE) provides the "traction" you suspected. It cleanly separates the truth of p (first-order evidence) from the psychology of belief (HOE showing non-formation), satisfying all bans. No sneaky workarounds are needed.  
  - **Cost of Failure**: If HOE couldn’t bear the weight, the only viable escape would be relaxing the **"no self-deception"** ban. That would weaken the case significantly—it would become a story of *mistaken* self-ascription ("I think I don’t believe p, but I really do"), undermining the "correct utterance" requirement. But here, the HOE ensures the disbelief-ascription is accurate and unmysterious.  

  **Result**: The scenario holds. It forces theories to confront a rational agent whose assertion is informative *because* it decouples factual truth from doxastic state—using only mundane, observable evidence. Perfect for derailing pattern-matching.
