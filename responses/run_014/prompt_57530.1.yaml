prompt: |-
  This term my fourth-year seminar in political philosophy and formal social choice reaches futarchy — Robin Hanson's proposal that a polity should "vote on values, bet on beliefs", with a democratic majority fixing the measure of welfare to be pursued and conditional prediction markets settling which policy maximises it. There are twenty-two students, seated at four tables of five or six, and I have one eighty-minute session in which to make the scheme feel like something other than a slogan.

  My students reliably arrive with two errors, and I want an in-class game that dismantles both from the inside rather than by my asserting that they are errors.

  The first is that they treat a prediction market as an elaborate opinion poll, and assume that once the outcome is observed the market's accuracy can simply be checked against it. The second arises when manipulation is raised: they repeat the standard reassurance — that a would-be manipulator must buy at the honest price, so pays for the privilege, and that the price snaps back afterwards — without noticing that the reassurance presumes a market that merely reports. Under futarchy the price *is* the decision rule, so moving the price is not asserting something false about the future; it is purchasing the future, at a bounded cost, against an unbounded payoff. Closely related, and just as hard to make vivid, is the asymmetry between the two branches of the comparison: once a policy is adopted, only that branch is ever realised, and the contract conditional on the rejected branch ceases to be traded by anyone who expects it to be rejected. The number the scheme most requires is therefore the number the market is least willing to quote.

  Please design the game. My requirements are as follows.

  1. The welfare variable must be generated in the room, in real time, by the participants' own behaviour under whichever policy is adopted. It may not be a figure I announce, and it may not be a lottery I draw. Specify two candidate policies, the scalar measure defined over the room's activity, and the productive task that yields it, with enough genuine contingency that the outcome is not obvious from the start.

  2. No real money. Use a fixed chip endowment and an explicit payoff function for the policy-conditional contracts, presented as a small printed table that can be evaluated by hand in under a minute. Justify the functional form: it should make honest forecasting strictly profitable in expectation, and — this matters most — the manipulator's arithmetic should be visible on the payoff table rather than engineered into the rules. If the design is honest, the profitable manipulation should fall out of the payoffs as an unwelcome consequence.

  3. Include an opening vote on values, taken before anyone knows anything about the policies' prospects, in which the seminar chooses between two candidate welfare measures; the contracts must pay on whichever measure is chosen. Tell me what this costs in minutes, whether the vote is itself strategic, and what to do if it is.

  4. Some participants must hold a private stake in which policy is adopted that is independent of the welfare measure — they do better under one policy whatever the outcome turns out to be. State how many such players, how you assign them, and how large the stake must be relative to ordinary forecasting profits for the effect to bite without being spotted immediately.

  5. Give an exact timeline in minutes, a full materials list, and rules precise enough that a teaching assistant who has seen none of this could run the session unaided.

  6. Provide a debrief that maps particular moments of play onto the two errors above, in the order those moments will have occurred, and that reaches the point at which someone notices that their own trades had stopped being forecasts. Give me the questions to ask rather than a speech to deliver.

  7. Be frank about what will predictably go wrong the first time this is run. I expect at least: too little variance in the outcome variable; the conditional market on the losing branch dying completely without anyone understanding why; chip arithmetic bogging the room down; and the privately interested players either blowing their cover or being too timid to exploit it. Offer a pre-emptive fix for each.

  8. State honestly which features of futarchy the game cannot reproduce and which I must therefore supply verbally. I suspect the contested character of the welfare measure and the continuous liquidity of real markets are candidates; tell me which you regard as genuinely irreproducible and which as merely difficult.

  9. Include a twenty-five-minute fallback version for the event that the session overruns.

  I am not after a bibliography, a reading list, or citations of any kind — the design is the deliverable. Please write the whole response in British English.
reasoning: |-
  We are designing an in-class game to illustrate futarchy, specifically targeting two common student errors:
   1. Treating prediction markets as mere opinion polls whose accuracy can be checked after the fact.
   2. Failing to see that in futarchy, moving the price is purchasing the future (with bounded cost and potentially unbounded payoff) because the price is the decision rule.

   The game must:
   - Have a welfare variable generated by participants' behavior under the adopted policy, in real time.
   - Use a fixed chip endowment and an explicit payoff table for the conditional contracts.
   - Include an initial vote on values (welfare measures) taken before any policy information is known.
   - Include some participants with a private stake in which policy is adopted (independent of welfare).
   - Provide a detailed timeline, materials, rules, and debrief questions.
   - Anticipate problems and provide fixes.
   - Note what aspects of futarchy cannot be reproduced.

   We'll design a game around a simple production task where participants generate a welfare measure by their actions.

   **Game Concept:**
   - **Production Task:** Participants are seated in groups (tables). Each table is a "team". The welfare measure will be the total number of paper planes built by the entire class in a fixed time (say 5 minutes). 
     - Why planes? They are quick to build, require coordination, and the outcome is uncertain (depends on skill, coordination, etc.).
   - **Two Policies:** 
     - Policy A: Each team must build planes individually (no sharing of materials or help). 
     - Policy B: Teams can cooperate across tables (share materials, help each other, etc.).
   - **Welfare Measure:** The total number of *airworthy* planes built in the time. Airworthy means they must fly at least 2 meters when thrown by the instructor (or a TA) in a standard way.

   **Initial Vote on Values:**
   - Before any trading or knowledge of the policies' potential, the class votes between two welfare measures:
     - Measure 1: Total number of planes built (regardless of quality).
     - Measure 2: Total number of planes built, but with a twist: only planes that are built using exactly one sheet of paper (no more, no less) count. This introduces a quality constraint.
   - The vote is taken immediately at the start. The measure chosen will be the one used to evaluate the outcome.

   **Prediction Markets:**
   - We set up two conditional prediction markets:
     - Market for Policy A: Pays based on the welfare measure if Policy A is adopted.
     - Market for Policy B: Pays based on the welfare measure if Policy B is adopted.
   - The market instrument: Each contract for a policy pays a number of chips that is a function of the welfare measure. We design a payoff table that maps the welfare outcome (number of planes) to a payoff in chips.

   **Payoff Function:**
   - We want honest forecasting to be profitable in expectation, but also to allow for manipulation to be visible.
   - Let the welfare measure (number of planes) be W.
   - We'll use a linear payoff function: Payoff = a * W + b, but we need to cap it to avoid unbounded payoffs? However, in our case, W is bounded (by time and materials) so we can set a linear function without a cap.

   But note: We want the payoff to be such that the market price (in chips) should reflect the expected W. However, we also want to make sure that the payoff function is such that if someone tries to manipulate the market by buying a contract to push the price up, they can do so and then benefit if that policy is adopted (even if the actual W is low) because they have a stake in the policy.

   How can we achieve that? We need to separate the contract payoff from the actual welfare? Actually, no: the contract is conditional on the policy and pays based on the actual welfare under that policy. But the twist in futarchy is that the market price for the policy that wins becomes the decision, so if you manipulate the price of a policy, you cause that policy to be adopted and then you get paid based on the actual welfare under that policy. However, if you have a private stake in the policy (independent of welfare) then you might be willing to lose money on the contract to get the policy adopted.

   So we design:
   - Each contract for a given policy pays: 10 chips per plane (if that policy is adopted and the welfare is W) plus a base of 0. So the payoff is 10 * W.
   - But note: if the policy is not adopted, the contract pays 0.

   However, this is not sufficient to show the manipulation. We need to have the manipulator able to profit from the policy being adopted even if the contract itself loses money. Therefore, we introduce:

   **Private Stake:**
   - Some participants are given an additional payoff if a particular policy is adopted. For example:
     - "Policy A Stakeholders": They get 100 extra chips if Policy A is adopted, regardless of the welfare.
     - Similarly for Policy B.

   How do we assign? We'll have 4 such participants (about 20% of the class). Assign secretly by handing out role cards.

   **Market Mechanics:**
   - We use a continuous double auction (with an open order book) but in a simplified form. We can use a whiteboard to track bids and asks? Or use a simple spreadsheet if we have a projector? But we need to run by hand. Alternatively, we can have a market maker (the TA) who sets the price? But that might not show the manipulation.

   Alternatively, we can have two separate markets (one for Policy A and one for Policy B) and allow trading in both. The price in each market is the last traded price. The policy with the higher price at the end of trading wins.

   **Trading Rules:**
   - Each participant starts with 100 chips.
   - Trading period: 15 minutes.
   - Participants can buy and sell contracts in both markets. Each contract is for one unit.
   - The market is run by a TA (or instructor) who records orders on a whiteboard. We'll have two whiteboards (or two sections) for the two markets.
   - Orders: Participants call out "Buy Policy A at [price]" or "Sell Policy A at [price]". The TA writes the order and matches if there is a crossing order.

   **Payoff for Contracts:**
   - After the policy is chosen and the production task is done, the contracts for the winning policy pay: 10 * W (where W is the welfare measure) in chips.
   - Contracts for the losing policy pay 0.

   **Private Stake Payoff:** After the policy is adopted, the stakeholders get their private payoff.

   **Timeline:**

   Total: 80 minutes.

   1. (5 min) Introduction: Explain the game structure. Emphasize that the class will vote on a welfare measure, then trade in two markets (one for each policy), then the policy with the higher market price (at the end of trading) will be adopted, and then they will do the production task. The welfare will be measured and contracts paid.

   2. (5 min) Vote on Values: Present the two welfare measures (Measure 1: total planes; Measure 2: total planes built with exactly one sheet). Vote by show of hands. Record the result.

   3. (5 min) Explain the two policies:
      - Policy A: Individual team work (no sharing between tables).
      - Policy B: Cooperation allowed between tables.

   4. (15 min) Trading Period: Run the two markets. The TA records orders and matches trades. The current price for each market (last trade) should be visible.

   5. (2 min) Policy Decision: At the end of trading, compare the last traded price (or if no trade, the midpoint of the best bid and ask) of the two markets. The policy with the higher price is adopted. If equal, flip a coin.

   6. (10 min) Preparation for Production: Distribute materials (paper) and explain the rules again under the chosen policy. Each table gets a stack of paper (say 50 sheets per table). For Measure 2, they must use exactly one sheet per plane (so no tearing or using multiple sheets). For Measure 1, they can use any amount.

   7. (5 min) Production: Build planes. The instructor and TA(s) monitor and collect planes at the end.

   8. (5 min) Testing: Test each plane by throwing (must fly 2 meters). Count the airworthy planes for the chosen measure.

   9. (10 min) Contract Settlement: 
        - For the winning policy contracts: Pay 10 * W chips to each holder of a contract.
        - For the losing policy: 0.
        - Also, pay the private stakeholders (if any) for the adopted policy.

   10. (18 min) Debrief: Use the questions to guide discussion.

   **Materials:**
   - Plenty of paper (at least 50 sheets per table, and 4 tables).
   - Stopwatch.
   - Whiteboard or large paper for each market (two) to record orders and trades.
   - Markers.
   - Role cards for private stakeholders (4 cards: 2 for Policy A, 2 for Policy B). They should say: "You are a Policy A stakeholder. You will receive an extra 100 chips if Policy A is adopted, regardless of the welfare." (Similarly for B.)
   - Payoff table printed for each participant (or projected):

          If Policy X is adopted and the welfare is W, then each contract for Policy X pays: 10 * W chips.
          Contracts for the other policy pay 0.

   - Initial chip allocation: 100 chips per participant (use poker chips or just record on paper).

   **Assigning Private Stakeholders:**
   - We have 22 students. Assign 4 stakeholders (2 for A, 2 for B). Do this secretly by handing out role cards to 4 randomly selected students at the beginning (before the vote). The others get no role card.

   **Anticipated Problems and Fixes:**

   1. **Too little variance in the outcome variable (W):** 
      - Fix: Make the production task challenging. Use a short time (5 minutes) and require airworthiness. Also, if we use Measure 2 (exactly one sheet) that might be harder and lead to more variance. Alternatively, if the class is too efficient, we can reduce the time to 4 minutes.

   2. **The conditional market on the losing branch dies:**
      - This is expected. We can explain in debrief that if a policy is seen as unlikely to win, then its contracts become worthless and no one trades them. But we need to make sure students notice this. We can point out during the game that one market stopped trading.

   3. **Chip arithmetic bogging down:**
      - Fix: Use a simple payoff function (linear). Also, have TAs help with calculations. Pre-calculate the payoff for a range of W (e.g., if W is between 0 and 50, then the payoff is 10*W). 

   4. **Privately interested players too timid or blowing cover:**
      - Fix: Make the private stake large enough (100 chips) relative to the expected contract profit. Expected profit from forecasting: if they think W will be 20, then a contract is worth 200 chips. But they start with 100 chips, so they can't buy many contracts. Therefore, we might need to adjust the stake or the payoff function.

      Alternatively, we can make the payoff per contract lower. Let the payoff be 2 * W. Then expected contract value is 40 chips (if W=20). Then a private stake of 100 chips is significant. Also, they might trade multiple contracts? They start with 100 chips, so they can buy several contracts. But note: if they buy a contract at a high price, they might lose on the contract but gain the stake.

      Revised payoff: 2 * W per contract.

      Also, to encourage trading, we can have the market run in whole numbers (prices in chips per contract).

      Also, we can instruct the stakeholders to try to influence the market without revealing themselves.

   5. **Time overrun:**
      - We have a 25-minute fallback version.

   **Fallback Version (25 minutes):**
     - Skip the production task? We cannot because we need to generate W. Instead:
     - Pre-determine W for each policy? But that violates requirement 1. Alternatively, we can have a very short production (2 minutes) and use a simpler measure (e.g., number of planes without testing). 
     - Steps:
          1. (2 min) Introduction.
          2. (2 min) Vote on values (choose between two measures, but we predefine: Measure 1: total planes; Measure 2: planes built with one sheet).
          3. (2 min) Explain policies.
          4. (8 min) Trading: Use a market maker (TA) who sets the price and trades at that price. The market maker adjusts the price by hand based on net demand? Or use a very simple market.
          5. (1 min) Policy decision.
          6. (3 min) Production: 2 minutes to build planes. Use Measure 1 (to save testing time) if that was chosen, or Measure 2 if chosen. Count immediately without testing? Or do a quick test by having the builder throw (if time).
          7. (2 min) Settlement: Pay contracts and private stakes.
          8. (5 min) Quick debrief.

   **Debrief Questions (for the full version):**

   We want to map moments to the two errors.

   1. **Error 1: Market as opinion poll.**
      - After the outcome, ask: 
          - "How many of you thought that the market for the winning policy was accurately predicting the number of planes we built? Why?"
          - "But note: we never observed what would have happened under the other policy. How can we check the accuracy of that market?"
          - "What information did the market for the losing policy provide? Why did trading in that market stop?"

   2. **Error 2: Manipulation and the decision rule.**
      - Ask:
          - "Did anyone try to push the price of one policy up or down? Why?"
          - "If you held a private stake, did you trade differently? How?"
          - Point out: "In this market, if you buy a contract for a policy, you are not just saying that you think that policy will produce a high W. You are also making it more likely that the policy will be adopted. And if you have a private stake in the policy, you might be willing to overpay for the contract because you get the stake if the policy is adopted."
          - "Look at the payoff table: if you buy a contract for Policy A at price P, and then Policy A is adopted, you get 2 * W. But if you also have a private stake, you get an extra 100 chips. So even if 2 * W is less than P (so you lose on the contract), you might still make a net gain if (2 * W - P) + 100 > 0. So you might be willing to buy at a price higher than what you think 2 * W will be."
          - "Did anyone notice that their trades stopped being forecasts and became attempts to influence the policy decision?"

   **What the Game Cannot Reproduce:**

   1. **Contested character of the welfare measure:** We have a vote, but the measure is predefined. In real futarchy, defining welfare is a deep political question. We only simulate a simple vote.

   2. **Continuous liquidity of real markets:** Our market is thin and may have liquidity problems. Real markets have many participants and continuous trading.

   3. **Unbounded payoffs in real markets?** In our game, the payoff is bounded (by the maximum planes possible). In real futarchy, the market might have unbounded stakes? But actually, real markets also have finite participants.

   4. **The complexity of real policies:** Our policies are very simple. Real policies are complex and their effects uncertain.

   We must explain these limitations verbally.

   **Revised Payoff Table:**
     Payoff per contract for the winning policy: 2 * W chips.
     Payoff for the losing policy: 0.

   **Private Stake:** 100 chips.

   **Expected Manipulation:** 
     A Policy A stakeholder might buy Policy A contracts at a price higher than what they think 2 * W will be. For example, if they think W under A will be 20 (so contract worth 40), but they are willing to pay 50 chips because they get 100 chips if A is adopted. Then even if they lose 10 on the contract, they net 90 (100 - 10). They might buy multiple contracts? But note: if they buy one contract at 50, they lose 10 on the contract but gain 100, so net 90. But if they buy more, say 2 contracts at 50, then they lose 20 on the contracts (2*(50-40)) but still get 100, so net 80. Still positive. However, the more they buy, the more they lose on the contracts. So they will buy until the marginal cost equals the marginal benefit? But the private stake is fixed. So they might buy just one contract to avoid drawing attention? We want the arithmetic to be visible: the payoff table shows that the contract pays 2*W, which is less than what they paid, but they get the private stake.

   However, note: the act of buying pushes the price up, which might cause Policy A to be adopted. So they don't need to push the price above the expected value by the whole stake, because the stake is a fixed amount. They only need to push the price above the expected value by less than 100 (divided by the number of contracts they buy) to break even. But this is complex. We want it to be visible in the payoff table.

   We can make the payoff table show that the contract itself might be a loss, but the private stake more than compensates.

   **Revised Timeline (80 minutes):**

    0-5 min: Introduction. Distribute role cards (4 stakeholders) and chips (100 each). Explain the two phases: market trading and production.

    5-10 min: Vote on values (Measure 1 vs Measure 2). Explain that the welfare measure chosen will be used to evaluate the outcome.

