answer: |-
  ### In-Class Game: "Plane Production Futarchy"

  #### **Game Overview**
  Participants vote on a welfare measure, then trade "policy-conditional contracts" in two markets (Policy A vs. Policy B). The policy with the higher market price (at trading close) is adopted. Welfare is generated by participants building paper planes under the chosen policy. Contracts pay out based on the realised welfare. Four participants hold private stakes in the policy outcome, independent of welfare.

  ---

  ### **Materials List**
  1. **Paper**: 200 sheets (50 per table, 4 tables).
  2. **Stopwatch/timer**.
  3. **Whiteboard** with two sections: "Market A" and "Market B".
  4. **Markers** for whiteboard.
  5. **Chips**: 2,200 chips total (100 per participant × 22 students). Use distinct colours (e.g., red/blue) or labelled tokens.
  6. **Role cards**: 4 cards (2× "Private Stake: Policy A", 2× "Private Stake: Policy B").
  7. **Payoff tables**: 22 copies (see below).
  8. **Measuring tape** (for plane flight test).
  9. **Waste bin** (as a 2m flight target).

  ---

  ### **Welfare Measure, Policies, and Production Task**
  - **Welfare measure (voted on)**:  
    - **Measure 1**: Total planes built (regardless of flight).  
    - **Measure 2**: Planes flying ≥2m into a waste bin.  
  - **Policies**:  
    - **Policy A**: *Individual Competition*. Tables work independently. Each plane must be built by one person.  
    - **Policy B**: *Collaborative Assembly*. Tables share materials and labour (e.g., one cuts, one folds).  
  - **Production task**: 5-minute plane-building. Welfare \( W \) = number of planes meeting the voted measure.  
  - **Contingency**:  
    - Skill/coordination variance affects output.  
    - Measure 2 adds uncertainty (flight success).  

  ---

  ### **Payoff Table & Contract Design**  
  **Payoff function per contract**:  
  \[ \text{Payoff} = \begin{cases} 
  10 \times W & \text{if policy adopted} \\
  0 & \text{otherwise} 
  \end{cases} \]  
  *(Printed table for participants):*  

  | Policy Adopted? | Welfare \( W \) | Contract Pays (chips) |
  |-----------------|----------------|------------------------|
  | Yes            | Any \( W \)    | \( 10 \times W \)      |
  | No             | Any \( W \)    | 0                     |

  **Justification**:  
  - **Honest forecasting profitable**: If \( W \) is expected to be 15, a contract’s fair price is 150 chips. Buying below 150 yields profit.  
  - **Manipulation arithmetic visible**: A private stakeholder values adoption at **+100 chips** (independent of \( W \)). If they buy a contract at price \( P \), their net gain if adopted is \( (10 \times W - P) + 100 \). Even if \( 10 \times W < P \) (loss on contract), adoption may yield net profit if \( 100 > P - 10 \times W \). The payoff table shows this tension explicitly: manipulation can exploit the gap between contract loss and private gain.  

  ---

  ### **Setup and Timeline (80 min)**  
  1. **Introduction (5 min)**:  
     - Explain: "We’re testing futarchy: vote on values, bet on beliefs."  
     - Distribute chips (100/student), role cards (4 secret stakeholders), and payoff tables.  

  2. **Vote on Values (5 min)**:  
     - Present Measure 1 (quantity) vs. Measure 2 (quality).  
     - **Vote by show of hands**. Record result.  
     - **Cost**: Negligible. **Strategic risk**: None—voters lack policy information. **If strategic**: Ignore (values should precede beliefs).  

  3. **Policy Explanation (5 min)**:  
     - Describe Policies A (individual) and B (collaborative).  

  4. **Trading (15 min)**:  
     - **Markets**: TA records bids/asks on whiteboard for Policy A and Policy B contracts.  
     - **Orders**: Participants shout "Buy A at [price]" or "Sell B at [price]". TA matches orders, updates last price.  
     - **Rules**:  
       - Minimum trade: 1 contract.  
       - Prices in whole chips.  
       - No short-selling (cannot sell contracts not owned).  

  5. **Policy Decision (2 min)**:  
     - Compare final prices of A and B. Higher price wins. Tie? Coin flip.  

  6. **Production (10 min)**:  
     - Distribute paper. Run 5-minute plane-building under adopted policy.  

  7. **Welfare Measurement (5 min)**:  
     - Count \( W \) (total planes or flight-successful planes, per vote).  
     - Test flights: Throw planes ≥2m into bin.  

  8. **Settlement (8 min)**:  
     - Pay winning policy contracts: \( 10 \times W \) chips per contract.  
     - Pay private stakeholders: +100 chips if their policy adopted.  

  9. **Debrief (25 min)**: See below.  

  ---

  ### **Private Stakeholders**  
  - **Number**: 4 (2 pro-A, 2 pro-B).  
  - **Assignment**: Randomly distribute role cards.  
  - **Stake size**: +100 chips upon adoption (independent of \( W \)).  
  - **Rationale**: 100 chips > expected forecasting profit (e.g., if \( W = 15 \), contract profit ≈50 chips). Large enough to incentivise manipulation, but small enough to avoid detection (plausible deniability: "I just believe in this policy!").  

  ---

  ### **Debrief Questions (Ordered by Game Events)**  
  1. **Post-trading (error 1: market as opinion poll)**:  
     - *"The market for Policy B died early. Why did no one trade it? How could we check if its price was ‘accurate’?"*  
     → Highlight: Unrealised branches can’t be verified. Markets on rejected policies collapse.  

  2. **Post-settlement (error 2: price as decision rule)**:  
     - *"Why might someone buy Policy A contracts above 150 chips if they expected \( W = 15 \)? Look at your payoff table."*  
     → Guide students to see \( (10 \times W - P) + 100 \) arithmetic.  
     - *"Did anyone trade to change the policy outcome, not just forecast it? How did that feel different?"*  
     → Elicit realisation: Trades became influence-purchasing.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Low outcome variance**:  
     - **Problem**: \( W \) similar across policies.  
     - **Fix**: Secretly assign "expert" folders to one table; use Measure 2 (flight adds variance).  

  2. **Losing-market collapse**:  
     - **Problem**: Policy B market dies, obscuring why prices become uninformative.  
     - **Fix**: TA notes aloud: "No bids for B—why might traders abandon it?" during trading.  

  3. **Chip arithmetic delays**:  
     - **Problem**: Settlement calculations bog down.  
     - **Fix**: Pre-calculate \( 10 \times W \) for \( W = 0\)–\(30\); use TAs to help.  

  4. **Timid/blown-cover stakeholders**:  
     - **Problem**: Stakeholders avoid manipulation or reveal motives.  
     - **Fix**: Role cards include: *"Trade aggressively—but don’t say why."* Stake small (100 chips) to avoid suspicion.  

  ---

  ### **Irreproducible Futarchy Features**  
  **Verbally explain**:  
  1. **Contested welfare measures**: Real futarchy debates what to maximise (e.g., GDP vs. equality). Our vote simplified this.  
  2. **Market liquidity**: Real markets have continuous, high-volume trading. Our thin market exacerbates manipulation.  
  3. **Complex policies**: Real policies affect millions; our plane task is trivial.  

  **Difficult but partially reproduced**:  
  - Price-discovery dynamics (via trading).  
  - Manipulation incentives (via payoff table stakes).  

  ---

  ### **25-Minute Fallback**  
  1. **Setup (3 min)**: Skip role cards. Vote on values (2 min). Explain policies (1 min).  
  2. **Trading (7 min)**: TA acts as market-maker (sets prices, accepts all trades).  
  3. **Production (5 min)**: 3-minute build; Measure 1 only (no flight test).  
  4. **Settlement (3 min)**: Pay \( 10 \times W \) for winning contracts.  
  5. **Debrief (7 min)**: Focus on "price as decision rule" via:  
     - *"If you bought a policy’s contracts to get it adopted, how was that different to forecasting?"*  

  ---

  ### **Rules for Teaching Assistant**  
  1. **Start**: Give each student 100 chips. Randomly assign 4 role cards.  
  2. **Trading**:  
     - Record bids/asks on whiteboard. Match orders first-in-first-out.  
     - Announce: "Policy A: last trade at 120 chips."  
  3. **Production**:  
     - Policy A: Enforce solo building.  
     - Policy B: Allow sharing between tables.  
  4. **Settlement**:  
     - Calculate \( 10 \times W \) (e.g., \( W = 17 \) → 170 chips/contract).  
     - Pay stakeholders privately.  
  5. **Enforce**: No real money; chips only. Stop trades at 15 min.  

  **End of game**: All materials fit in one folder. British English compliant.
