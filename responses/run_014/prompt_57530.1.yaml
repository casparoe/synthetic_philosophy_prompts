    32-42 min: Preparation and production. Distribute paper. Explain the rules again under the chosen policy and the chosen welfare measure. Start the 5-minute production.

    42-47 min: Testing planes (if time allows, or do a quick test during production). Count W.

    47-57 min: Settlement: 
        - For the winning policy contracts: Pay 2 * W chips per contract to the holders.
        - For the losing policy: 0.
        - Pay private stakeholders: 100 chips to each stakeholder of the adopted policy.

    57-75 min: Debrief (18 minutes) with the questions above.

    75-80 min: Concluding remarks.

   **Materials List:**
     - Paper: at least 200 sheets (50 per table, 4 tables).
     - Stopwatch.
     - Two whiteboards or large flip charts for the markets (labeled "Policy A Market" and "Policy B Market").
     - Markers and erasers.
     - Role cards: 4 cards (2 for Policy A stakeholder, 2 for Policy B stakeholder).
     - Chips: Poker chips or just record on paper (each student starts with 100). Alternatively, use a ledger on paper for each student.
