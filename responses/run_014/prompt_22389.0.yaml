answer: |-
  You've hit on a profound tension at the core of Inverse Reinforcement Learning (IRL) and reward learning. Your intuition is correct: **standard IRL *does* only recover an ordinal preference ordering over trajectories/states, not a cardinal utility function.** The confusion arises because IRL papers often *use* the scalar representation cardinally while the theory only justifies ordinal comparisons. Here's a breakdown:

  ### 1. **The Fundamental Identification Problem (Ordinality)**
     - **Utility Invariance:** As you noted, revealed preference theory (and rational choice theory) states that utility functions are only unique up to monotonic transformations. If a policy `π` is optimal under reward `R(s)`, it's also optimal under `f(R(s))` where `f` is any strictly increasing function (e.g., `2*R(s)`, `R(s)^3`, `exp(R(s))`).
     - **IRL's Output:** IRL finds *one representative* from this equivalence class of reward functions that rationalizes the demonstrations. The absolute magnitudes, differences (`R(s1) - R(s2)`), or ratios (`R(s1)/R(s2)`) of this scalar have no inherent meaning.

  ### 2. **Why Scalar Rewards Are Used Anyway (Practical & Computational Reasons)**
     - **RL Compatibility:** Reinforcement Learning algorithms require a scalar reward signal for optimization (e.g., Q-learning, policy gradients). IRL outputs a format directly usable by RL.
     - **Parametric Constraints:** Most IRL methods assume a *specific parametric form* for the reward function (e.g., linear in features `R(s) = θ·φ(s)`). While the *true* utility might only be ordinal, the parametric assumption *imposes a cardinal structure*:
       - The scale is often fixed by optimization constraints (e.g., `||θ||₂ = 1` or entropy regularization).
       - Differences become meaningful *within the chosen representation*. If `R(s1; θ) = 2` and `R(s2; θ) = 1`, it means `θ·φ(s1) > θ·φ(s2)`, but *not* that `s1` is "twice as good" in a fundamental sense.
     - **Numerical Stability:** Scalars enable gradient-based optimization. Representing only an ordinal ordering (e.g., via pairwise comparisons) is computationally harder for high-dimensional state spaces.

  ### 3. **When Cardinal Comparisons *Are* Made (and Why It's Problematic)**
     Papers often claim "state A is preferred to state B because `R(A) > R(B)`". This *is* valid **only if**:
     - **The Comparison is Ordinal:** The statement is equivalent to "A is preferred over B". This is the *only* justified interpretation.
     - **But Often Implies Cardinality:** When authors say "the person *strongly prefers* A because `R(A) ≫ R(B)`", or use reward differences to trade off between objectives, they are *mistakenly imbuing the scalar with cardinal meaning*. This is a common oversight.

  ### 4. **The Crucial Role of Additional Assumptions**
     IRL *can* recover cardinal utility if stronger assumptions are made:
     - **Optimality Model:** Assumptions about the demonstrator's *degree* of optimality (e.g., Boltzmann rationality `P(a|s) ∝ exp(βQ(s,a))`) introduce a scale parameter `β`. Here, `β` controls how sharply rewards map to probabilities, making differences meaningful.
     - **Reward Regularization:** Priors on reward values (e.g., Gaussian prior `θ ~ N(0, I)`) penalize large magnitudes, effectively choosing a scale.
     - **Comparison Data:** If the data includes *strength of preference* (e.g., "A is *much better* than B", or pairwise comparisons with confidence), cardinality can be recovered.

  ### 5. **Why Not Just Learn an Ordering?**
     While theoretically pure, learning a full ordering over states is often impractical:
     - **Computational Cost:** Representing/comparing all state pairs is `O(|S|²)`.
     - **Generalization:** A scalar function `R(s)` generalizes to unseen states via `φ(s)`; an explicit ordering does not.
     - **Integration with RL:** Scalars plug directly into existing algorithms.

  ### Key Takeaways
  - **The Scalar is a Computational Proxy:** IRL's scalar reward is primarily a tool for enabling RL. Its numerical values are artifacts of the parametric form and optimization process.
  - **Valid Use:** Ordinal comparisons (`R(s1) > R(s2) ⇒ s1 ≻ s2`) are justified.
  - **Invalid Use:** Cardinal interpretations (`R(s1) - R(s2) = k` implies "strength of preference k") require additional assumptions (e.g., Boltzmann rationality) or data (e.g., confidence scores).
  - **Alignment Perspective:** For value learning, treating IRL's output as cardinal utility is risky. If your goal is true preference inference (e.g., for cooperative AI), methods that explicitly model strength of preference (e.g., **active learning with pairwise comparisons**) are safer.

  ### Why Papers Get Away With It
  In many IRL applications (e.g., robot imitation), only the *ordinal* content matters—the learned policy will be similar regardless of monotonic transformations. But in alignment, where we care about *interpreting* preferences or *generalizing* to new trade-offs, the cardinal ambiguity is critical. Your skepticism is well-founded: IRL papers often blur the line between "reward as a representation of preference" and "reward as a numerical utility," sometimes without acknowledging the limitations.

  **In short:** IRL recovers *ordinal* preferences but outputs a *cardinal* scalar for computational reasons. Treating it as cardinal without justification *is* a mistake—but one often hidden by parametric assumptions or application context. For alignment, you should demand clarity on this distinction.
