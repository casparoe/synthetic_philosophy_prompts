prompt: |-
  Before we argue anymore about whether string theory or evolutionary psychology or forensic bite-mark analysis "is science," I want the specification that argument presupposes. Write the desiderata: what an adequate criterion of demarcation has to deliver, given that the criterion will actually be used — not to settle a seminar question but to decide, say, what a public school may teach as science and what weight a regulatory agency should give a body of research. With each requirement, give the case or consideration that motivates it, and be explicit about which requirements are non-negotiable for the purpose at hand and which are merely the prejudices of one camp dressed up as demands of reason.

  A few things I want you to address along the way, because I suspect the interesting work is there. First, any adequate criterion must handle the asymmetry between judging a theory and judging a practice: a community can persistently do unscientific work within a formally scientific theory, and good science gets done under theories that, taken as literally stated, nobody would call falsifiable. Decide whether the criterion is about theories, about research programs, or about the behavior of scientists, and make the desiderata match that choice. Second, there is an obvious tension between demanding falsifiability and demanding that a criterion not condemn historical science: Newtonian mechanics accumulated anomalies for decades without its practitioners becoming unscientific, so a criterion that retroactively expels successful science from the category it is defining has something wrong with it. Say whether you think that tension is a genuine joint-unsatisfiability result or can be dissolved, and if so how. Third, I want you to confront the statistical corner: modern empirical science rarely faces a single observation that refutes anything, since auxiliary hypotheses and error models absorb anomalies as a matter of routine. If a criterion requiring crisp falsifiability excludes most of modern science, either the criterion or the purpose needs revision — say which. Fourth, consider whether the criterion needs to be usable by non-experts (judges, school boards) or whether it can be a philosopher's criterion that only functions when applied by an expert community; this should show up as a desideratum either way.

  You should also tell me which single requirement on your list does the most work excluding candidate criteria — I suspect it is something about ad hoc immunization rather than falsifiability itself, but argue your own view — and then, briefly, score falsificationism, Lakatos's picture of research programs with a hard core and protective belt, and a Kuhnian appeal to puzzle-solving normal science against the list. Keep the scoring short; the criteria and the motivating cases are what I want.

  Please write in continuous prose only, as in a letter or a long email: no headings, no bullet points, no numbered lists, no bold or italic text, and no tables. Use full paragraphs, and make the structure of your argument carry the organization that formatting would otherwise do.
reasoning: |-
  Hmm, the user is asking for a detailed specification of desiderata for a criterion of demarcation between science and non-science. This needs to address several key tensions: how to handle the asymmetry between theories and practices, the conflict between falsifiability and historical science, the statistical nature of modern empirical work, and usability by non-experts versus experts.

  I need to consider that the criterion will be used for practical decisions like public school curricula or regulatory agency weighting. The user specifically wants me to avoid abstract philosophical debates and focus on real-world application.

  The asymmetry issue is important. Good science can be done under unfalsifiable theories if practitioners maintain methodological rigor, while formally falsifiable frameworks can become unscientific through poor practices. This suggests the criterion must focus on practices rather than theories alone. The Newtonian mechanics example shows successful science persisted despite anomalies, meaning any criterion requiring immediate falsification would fail historically.

  For modern statistical science, auxiliary hypotheses and error models routinely absorb anomalies. A strict falsifiability criterion would exclude most contemporary research. The key seems to be whether anomalies prompt fruitful investigation rather than ad hoc dismissal.

  Usability is another major consideration. Non-experts like judges or school boards need to apply this criterion, so it must avoid requiring deep technical knowledge. Yet it can't be so simplistic that it becomes meaningless.

  The most important requirement might be prohibiting ad hoc immunization - the practice of making adjustments solely to protect a theory without generating new insights. This distinguishes legitimate auxiliary hypothesis development from defensive maneuvers.

  When evaluating existing frameworks, Popper's falsificationism fails on multiple counts: it doesn't handle historical science well and excludes statistical research. Lakatos's research programs model better captures scientific practice but may be too complex for non-experts. Kuhn's normal science concept is useful but risks justifying dogmatism if misinterpreted.

  The core desiderata should include: practical applicability by non-experts, focus on community practices, accommodation of statistical methods, prohibition of ad hoc immunization, and consistent treatment of historical cases. Among these, the ad hoc immunization prohibition does the heaviest lifting by distinguishing progressive from degenerative science.
answer: |-
  Your request cuts straight to the practical heart of a notoriously thorny philosophical problem. Defining "science" isn't an abstract exercise; it has real consequences for education, policy, and law. So, let's build the desiderata for an adequate criterion of demarcation from the ground up, focusing on the context of its *use* – decisions by school boards, courts, or regulators.

  First, we must confront the fundamental asymmetry you identified. Judging a static *theory* (like Newtonian mechanics or string theory) is insufficient and often misleading. A community can rigidly adhere to a formally falsifiable theory, dismissing anomalies through *ad hoc* excuses or ignoring counter-evidence, rendering their *practice* unscientific. Conversely, researchers can work rigorously under a theory whose core postulates (like unobservable strings or the multiverse) seem, *prima facie*, unfalsifiable, provided their *practice* generates testable consequences and responds genuinely to empirical constraints. Therefore, the criterion **must primarily evaluate the *practice* of a research community – its methodologies, responsiveness to evidence, and how it handles challenges – rather than solely the abstract structure of its theories or research programs.** This is non-negotiable. A theory-centric criterion would misclassify both degenerate practices within good frameworks and progressive practices within ambitious but speculative ones.

  This focus on practice immediately impacts the tension between falsifiability and historical science, like Newtonian mechanics. Newtonian theory accumulated anomalies (Mercury's orbit being the famous one) for centuries. Yet, its practitioners didn't abandon core tenets immediately; they explored auxiliary hypotheses (e.g., Vulcan) *while simultaneously* generating vast, empirically successful predictions and guiding new research. Crucially, the anomalies weren't ignored or explained away *arbitrarily*; they motivated serious investigation, even if ultimately unsuccessful in saving the core. The tension *can* be dissolved by shifting the demand: **The criterion must require that the community's practice systematically generates empirically testable consequences *and* treats empirical challenges as serious prompts for investigation and potential modification, prohibiting *ad hoc* immunization solely to protect a core belief without generating new, testable insights.** This allows for the persistence of theories facing anomalies, provided the response is scientifically productive investigation, not dogmatic defense. Demanding instant, decisive falsification is unrealistic and excludes successful historical science – that demand must be abandoned as non-negotiable for a useful criterion.

  This leads directly to the "statistical corner." Modern science, especially in fields like epidemiology, psychology, or climate science, rarely deals with singular, decisive falsifications. Results are probabilistic, laden with auxiliary assumptions (statistical models, measurement techniques), and anomalies are often initially absorbed by questioning these auxiliaries or error models. **The criterion must accommodate practices grounded in statistical inference and model testing, where evidence accumulates probabilistically and challenges often target auxiliary assumptions before core tenets.** It cannot require "crisp falsifiability" in the Popperian sense of a single, decisive observation refuting a universal law. A criterion demanding that would exclude most contemporary empirical science and is therefore unfit for the purpose. The revision must be to the criterion, not the purpose of including robust statistical science.

  Usability is paramount. The criterion will be applied by judges, school boards, and regulatory bodies, not philosopher-scientists. **The criterion must be practically applicable by reasonably informed non-experts.** It cannot rely on deep technical knowledge of the specific field under scrutiny or require nuanced philosophical judgments only accessible to specialists. It needs clear, operationalizable markers that non-experts can identify through evidence of the community's behavior (publications, responses to criticism, methodological standards). This doesn't mean it must be simplistic, but it must avoid requiring expertise in the very domain it's judging. This is non-negotiable; a criterion only usable by philosophers is useless for the stipulated purpose.

  Synthesizing, the core desiderata are:
  1.  **Focus on Community Practice:** Evaluates the methodologies, epistemic norms, and responsiveness to evidence of the research community (non-negotiable).
  2.  **Generative Testability:** Requires the practice to systematically generate empirically testable consequences (non-negotiable).
  3.  **Responsiveness to Challenge:** Demands that empirical anomalies and contradictions are treated as serious prompts for investigation and potential modification of theories or methods, prohibiting *ad hoc* immunizations that offer no new testable content (non-negotiable).
  4.  **Accommodates Statistical & Model-Based Science:** Functions with probabilistic evidence, model testing, and the scrutiny of auxiliary assumptions without demanding singular, decisive falsifications (non-negotiable).
  5.  **Non-Expert Usability:** Can be applied by judges, school boards, etc., using evidence of community behavior, without requiring deep domain expertise (non-negotiable).
  6.  **Historical Fidelity:** Does not retroactively exclude historical episodes universally recognized as scientific (like Newtonian mechanics during its anomaly phase) due to their adherence to sound (for their time) practice, even if their theories were ultimately modified or replaced (strongly desirable, motivated by the need for consistency and avoiding revisionist history).

  Among these, the **prohibition of *ad hoc* immunization without generative testability (point 3)** does the heaviest lifting in excluding candidate criteria and problematic practices. It's the key that resolves the falsifiability/history tension and distinguishes legitimate auxiliary hypothesis development (e.g., proposing Vulcan *and* calculating its observable effects) from unscientific evasion (e.g., dismissing Mercury's precession as "experimental error" without a credible error model or new test). Falsifiability *alone* is too brittle; it's the *misuse* of flexibility to avoid genuine empirical engagement that marks degeneration.

  Scoring existing frameworks briefly:
  *   **Popperian Falsificationism:** Fails on historical fidelity (expels Newtonian mechanics during anomalies), fails on accommodating statistical science (demands crisp falsification), struggles with non-expert usability (judging "falsifiability" of complex theories is hard), and is theory-centric, not practice-focused. Its strength is generative testability.
  *   **Lakatosian Research Programmes:** Better on historical fidelity (progressive vs. degenerative programmes accommodates Newton), better on practice (focuses on community behaviour around the "hard core" and "protective belt"), and inherently incorporates the prohibition on degenerative *ad hoc* moves. However, judging "progressive vs. degenerative" objectively is extremely difficult for non-experts and can be highly subjective, failing usability. It also struggles somewhat with purely statistical fields lacking a clear "hard core."
  *   **Kuhnian Normal Science:** Strong on practice and responsiveness *within* a paradigm (normal science as puzzle-solving). However, it notoriously struggles with demarcation *between* paradigms and during crises. Its focus on puzzle-solving within a framework risks justifying dogmatism if responsiveness to challenge isn't explicitly required. It offers little direct help for non-experts trying to judge a field's scientific status.

  The desiderata point towards a criterion grounded in the self-correcting, evidence-responsive *behavior* of a community, demanding they play the empirical game seriously by generating testable content and genuinely engaging with the results, while being flexible enough to handle the messy reality of scientific work across time and disciplines, and simple enough for the institutions that need to use it. The devil, as always, will be in the operational details of judging "genuine engagement" versus "immunization," but the requirements above set the necessary boundaries.
