  Also, the user might be interested in how philosophical views impact methodology. Lewis's concrete worlds don't change model theory, but his analysis of modality could enrich how they think about necessity in system properties. For instance, distinguishing "must" vs "could" in specifications might align with Lewis's modal logic insights.

  I should highlight that the primary connection is conceptual rather than practical. Lewis's work can inspire careful definitions and remind them that their models are tools, not literal worlds. This might prevent over-interpretation of model results, especially in safety-critical systems where stakeholders might confuse model possibilities with real-world probabilities.

