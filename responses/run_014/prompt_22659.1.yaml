prompt: |-
  I work as a software engineer, and I use the phrase "possible worlds" in my work in a specific, technical sense. In formal verification, for example, I model a system as a set of states, and I reason about what could happen by considering the set of all states the system could be in — the "possible worlds" of the system, so to speak. I recently came across David Lewis's modal realism, which is a philosophical view about possible worlds as well, and I was discussing it with a colleague of mine who studies philosophy. They suggested that the two usages might be related in interesting ways, but I'm not sure exactly how, and I'd like a clearer picture.

  In particular, I'm not sure whether Lewis's view has any bearing on the formal or model-theoretic notion of possible worlds that I use in my work, or whether the two are entirely unrelated. Could you walk me through the most important implications of Lewis's modal realism for how I should think about my own usage of the term? I'm especially interested in whether there are any conceptual or methodological lessons I can draw from Lewis's view for my work, or whether the overlap is just a coincidence of terminology.
