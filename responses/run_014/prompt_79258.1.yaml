  1. **Your Three Minutes:** Start with concessions (traffic, fees, displacement) to show humility, then pivot to your moral argument. End with: "This isn’t about projects—it’s about people. Let’s choose inclusion."
  2. **Body Language:** When homeowners heckle, nod like you hear them (even if you disagree). It disarms rage.
  3. **The Lawyer’s Question:** If he asks about "claims," redirect quickly: "It’s about fairness, not legalities. Our rules shouldn’t lock people out."
  4. **After the Hearing:** Thank the civil engineer and landscape architect privately. They’re persuadable long-term.
  5. **Weakness to Fix:** The in-lieu fee *is* a hole. Before the next hearing, get a housing nonprofit to propose specific fee adjustments.

  You’re ready. Your strength is passion—not policy minutiae. Use it.
