prompt: |-
  My friend and I argued until nearly three in the morning about when it is acceptable to do something unilaterally that others in one's group would rather one didn't, and I went to bed with a page of cases and my verdicts on each that I would like someone to organize. Her position, roughly, was the unilateralist's curse: when several people each have the power to trigger an action, and each acts on their own estimate of whether it is good, the action fires whenever even one person overestimates its value, while restraint requires everyone to underestimate it — so errors skew toward action, and unilateral action is presumptively wrong. She thinks something like a principle of conformity follows. I kept producing cases my gut says she cannot handle. Here they are, with my verdicts.

  1. A junior researcher discovers a serious flaw in a statistical method her whole field uses. Her advisor wants to sit on it until they can wrap a larger paper around it. She posts the critique to a preprint server that night. I think she did the right thing.
  2. A laboratory scientist works out a cheap modification that makes a common pathogen substantially more transmissible. Her colleagues are split on how dangerous the details are. She publishes anyway. Not acceptable — she owed the internal review a hearing at minimum.
  3. An engineer at a software company discovers the product silently logs users' locations and learns the internal reporting channel already buried one complaint about it. She leaks to a journalist. Right thing to do, maybe obligatory.
  4. One of five co-authors of a jointly drafted climate summary, unhappy that the final wording is weaker than the evidence supports, gives the draft and his objections to a newspaper before the others have signed off. Not acceptable, even though I share his view of the evidence.
  5. A billionaire funds a speculative ocean-geoengineering field trial on her own judgment; other funders she consulted think it is a waste or worse. Fine.
  6. A security researcher, after a vendor has ignored a critical vulnerability report for ninety days, publishes the details unilaterally, on the standard full-disclosure reasoning that publication pressures vendors and helps defenders organize. I go back and forth on this one and cannot land.

  Cases 1 and 4 look nearly identical to me — one person publishing true information ahead of people who wanted to wait — yet I judge them oppositely, and I cannot tell whether the difference is that an advisor is not a peer set deciding jointly, or something about the content. Cases 2 and 5 also look alike — unilateral action on contested judgment with no procedure in place — and I split them too, I think because in 5 only her money is at risk, though I doubt that survives my friend's logic, since the trial imposes risks on everyone. And case 3 is my hardest one for the curse itself: the company had a legitimate-looking procedure and she bypassed it, and still I think she had to.

  So: is there one principle that captures these verdicts, or a small set of candidates? State it precisely, say which case motivates each clause, tell me what it predicts for case 6 and for one case I have not listed — say, a single member of an AI safety team unilaterally escalating a concern to regulators over her team's objection — and be honest about which of my verdicts it cannot save. Lead with the principle itself, keep the whole answer under 600 words, and do not merely restate the curse at me; I need to know what breaks it.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a late-night debate with a friend about the ethics of unilateral action versus group consensus, framed around the unilateralist's curse. The user presented six cases with their own verdicts and wants a principle that explains their judgments consistently. 

  First, I need to understand why they're struggling. The user feels their verdicts contradict each other in similar-looking cases (like 1 vs 4, or 2 vs 5), and they're especially torn on case 6. They also hint at discomfort with the curse's rigidity by calling case 3 a counterexample. Underneath this, they might really be wrestling with when individual conscience trumps institutional processes - a tension between ethics and pragmatism.

  Hmm... their cases cluster around three tensions: truth/risk (1,3,4), procedure/emergency (2,6), and personal stakes (5). The key seems to be whether the action corrects a harm that the group process is ignoring or worsening. That explains why leaking corporate misconduct (3) feels urgent despite procedures, while overriding co-authors (4) doesn't - one hides harm, the other merely delays truth. 

  For the principle, I'm considering three filters: harm (is the group perpetuating danger?), process (did they genuinely engage?), and scope (who bears consequences?). Case 1 passes because suppressing flaws harms science; case 2 fails because the lab's review wasn't bypassed maliciously. Case 5 is tricky - the billionaire risks others' safety, but since no procedure existed, it gets leniency? Wait, the user said "fine" though. Maybe the "no alternative" clause covers that.

  Testing against case 6: the 90-day delay suggests failed process, so publishing might be justified if the vulnerability is actively exploited. But the user's unsure - rightly so, because "harm" depends on exploit likelihood. For their unlisted AI case: if the team ignores extinction-level risks, escalation is defensible; if it's just honest disagreement over precautions, not so much.

  Ah, and case 4... the principle won't save the user's "not acceptable" verdict if the weaker wording itself causes harm (e.g., delaying climate action). But the user seems to view it as non-urgent, so the principle holds. Phew.

  ...Wait, did I just validate their intuition that content matters? Their friend's conformity principle might overlook that some "errors" (like not leaking logs) aren't symmetrical - suppressing truth creates different externalities than rushing action. The curse assumes all unilateralism is equally suspect, but reality has moral asymmetries.
answer: |-
  Here's a principle capturing your verdicts, derived from your cases:

  **The Justified Unilateralism Principle:**
  Unilateral action is permissible when:
  1.  **Harm Prevention/Urgency:** There is credible, significant risk of serious harm (broadly construed, including epistemic harm like suppressed truth) that the group process is failing to mitigate or is actively worsening, *and* delay likely increases the risk or injustice; *and*
  2.  **Process Failure:** Legitimate procedures for addressing the concern have been exhausted, are demonstrably ineffective or captured, or do not genuinely exist; *and*
  3.  **Scope Limitation:** The actor primarily bears the personal/professional risk of action (or inaction imposes severe moral cost on them), *or* the action's primary risks are unavoidable externalities inherent to the underlying issue (not uniquely created by unilateralism), *and* the actor acts with proportional diligence.

  **Motivation & Application:**

  1.  **Harm Prevention/Urgency (Cases 1, 3, 4, 6):** Drives your verdicts. Case 1: Suppressing a critical *truth* harms scientific progress (epistemic harm); advisor's delay serves self-interest, not safety. Case 3: Active concealment of privacy violation creates ongoing harm; reporting failed. Case 4: Weakening wording may be bad, but lacks the *urgent, specific harm* of suppression or active wrongdoing; it's a disagreement within a legitimate (if flawed) process. Case 6: *Crucially depends on the vulnerability's severity/exploitability.* If critical and actively exploited, harm is high and vendor delay constitutes process failure (urgency). If low-risk, harm/urgency are insufficient.
  2.  **Process Failure (Cases 2, 3, 4, 6):** Explains the 2/3 split. Case 2: Split colleagues indicate an *ongoing* internal review; she bypassed it entirely. Process wasn't exhausted or failed. Case 3: Reporting channel was "buried," proving ineffective/captured – process failed. Case 4: Co-authorship process was ongoing; he bypassed it before conclusion. Case 6: Standard 90-day disclosure *is* a process; its failure *could* justify action if harm/urgency are high.
  3.  **Scope Limitation (Cases 3, 5):** Clarifies why 5 is "fine" but 2 is not. Case 5: The billionaire primarily risks *her own money*; the environmental risk is inherent to geoengineering itself, not uniquely created by her unilateralism (others *could* fund it too). She consulted (showing some diligence). Case 3: The engineer risks her job, but the *privacy harm* is the core issue (inherent risk of the product), not a new risk she created. Case 2: The scientist creates a *new, specific* biosecurity risk by publishing without review.

  **Predictions & Challenges:**

  *   **Case 6:** Depends on harm/urgency. If the vulnerability is critical and actively exploited (high harm, urgency), vendor inaction = process failure. Justified. If it's minor or theoretical, or the vendor is actively working on a fix, harm/urgency are low. Unjustified. Your back-and-forth reflects this ambiguity.
  *   **Unlisted Case (AI Safety Escalation):** Justified *only* if: (a) The concern involves credible, near-term catastrophic risk (Harm/Urgency); (b) Internal channels were genuinely exhausted/ignored/captured (Process Failure); (c) The risk is inherent to the system, not just a disagreement on precautions (Scope - inherent risk). If it's a precautionary dispute within a functioning team, likely not justified.
  *   **Verdict it Cannot Save:** **Case 4.** Your "not acceptable" verdict relies heavily on the *lack* of urgent, specific harm being *caused* by the delay/weaker wording *within the process*, and the process being ongoing. The principle struggles to *forbid* it if one argues the weaker wording itself *is* significant harm (e.g., delaying climate action). Your intuition that the advisor in Case 1 isn't a true "peer set" is captured by the process being illegitimate (self-interested suppression).

  **Breaking the Curse:** This principle breaks the unilateralist's curse by introducing key asymmetries:
  1.  **Harm Asymmetry:** The cost of *inaction* (suppressed truth, ongoing harm) often vastly outweighs the cost of erroneous *action* (premature publication, procedural breach) in specific high-stakes scenarios.
  2.  **Process Asymmetry:** When processes are broken or captured, unilateral action isn't an *error* skewing outcomes; it's a *correction*.
  3.  **Risk Asymmetry:** Actions where the actor bears primary risk (Case 5) or addresses inherent risks (Case 3) are morally distinct from actions creating new, concentrated risks bypassing sound processes (Case 2).

  Your verdicts prioritize preventing concrete harm, correcting failed systems, and respecting inherent risks over rigid conformity or proceduralism when those would perpetuate injustice or danger.
