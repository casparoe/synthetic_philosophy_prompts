          \( [K_V(\mu) \log 2 + c_V] - [K_U(\mu) \log 2 + c_U] = (K_V(\mu) - K_U(\mu)) \log 2 + (c_V - c_U) \)
      and we know \( |K_V(\mu) - K_U(\mu)| \leq c_{UV} \), so the difference is bounded by \( c_{UV} \log 2 + |c_V - c_U| \). This is a constant.

      Therefore, the cumulative loss for the two UTMs can differ by at most a constant (over any finite sequence). This constant is fixed and does not grow with the length of the sequence. Hence, for sufficiently long sequences, the average loss (which is the cumulative loss divided by the length) becomes arbitrarily close to the entropy rate of the true source for both predictors. The transient effect (the constant offset) becomes negligible as the length increases.

      However, if we are comparing the predictions at a very early stage (when n is small) then the constant may be significant. For example, if the cumulative loss for UTM U is 10 and for UTM V is 20, then the predictions of U may be better for the first few bits. But note that the constant is fixed and does not grow, so after a large number of steps, say 10000, the difference in the cumulative loss (10 vs 20) is negligible when averaged.

      To answer the question:

      - There is no fixed number of observations that washes out the constant factor because the constant is additive and does not depend on the data length. Instead, the effect of the constant becomes negligible as the data length increases, because the cumulative loss bound grows with the complexity of the environment (which is fixed) plus the constant, so the average loss goes to zero. The constant factor in the prior becomes negligible in the average loss per symbol.

