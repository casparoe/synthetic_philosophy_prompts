          \(K_U(x) \leq K_V(x) + c_{UV}\)
      Similarly, \(K_V(x) \leq K_U(x) + c_{VU}\). Therefore, the prior for \(x\) under \(U\) and \(V\) are:
          \(P_U(x) \propto 2^{-K_U(x)}\)
          \(P_V(x) \propto 2^{-K_V(x)}\)
