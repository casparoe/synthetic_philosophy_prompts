      Therefore, as the true probability of the next bit becomes very certain (close to 0 or 1) the log-odds goes to \(\pm \infty\), and the constant becomes negligible. However, if the true probability is fixed and bounded away from 0 and 1, then the log-odds might be bounded and the constant factor may remain noticeable.

      But note: the convergence of Solomonoff induction is about the cumulative prediction error. The important result is that the total squared error or the total log-loss (which is the negative log probability assigned to the true outcome) is bounded. Specifically, the celebrated result is that the total expected log-loss of the Solomonoff predictor is bounded by the Kolmogorov complexity of the true environment plus a constant. This constant, however, depends on the UTM.

      Let \( \mu \) be the true environment, and let \( \xi_U \) be the universal prior using UTM \( U \). Then the expected cumulative log-loss of \( \xi_U \) over \( n \) bits is bounded by:
          \( E_{\mu} \left[ \sum_{t=1}^n -\log \xi_U(b_t | b_1 \dots b_{t-1}) \right] \leq K_U(\mu) \log 2 + O(1) \)
      (see Hutter's book, for example). Similarly, for UTM \( V \), we have:
          \( E_{\mu} \left[ \sum_{t=1}^n -\log \xi_V(b_t | b_1 \dots b_{t-1}) \right] \leq K_V(\mu) \log 2 + O(1) \)

