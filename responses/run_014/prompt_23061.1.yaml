          \( \leq K_U(\mu) \log 2 + c_{UV} \log 2 + O(1) \)

      So the difference in the cumulative log-loss between the two predictors is bounded by a constant that depends on the UTMs. This constant is additive and does not grow with \( n \). Therefore, the average log-loss per symbol goes to zero for both predictors, and the constant becomes negligible in the average.

