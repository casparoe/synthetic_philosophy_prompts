      The posterior after observing a binary string \(d\) (the data) is proportional to the prior times the likelihood. In Solomonoff induction, the likelihood of the data \(d\) given a hypothesis (a program) \(p\) is 1 if the program \(p\) outputs \(d\) (and then halts, or at least the prefix we are observing) and 0 otherwise. But note that the hypothesis is a program that produces a sequence, and we are interested in the probability that the sequence starts with \(d\).

      The posterior probability for a continuation \(y\) given data \(d\) is:
          \(P(y|d) = \frac{ \sum_{p: p \text{ outputs } d \text{ then } y} 2^{-\ell(p)} }{ \sum_{p: p \text{ outputs } d} 2^{-\ell(p)} }\)
      where the sums are over programs that output the specified strings and then halt (or for prefix machines, we consider the minimal programs that output the string as a prefix).

      Alternatively, we can write the posterior as:
          \(P(y|d) = \frac{ M(dy) }{ M(d) }\)
      where \(M\) is the universal prior (the Solomonoff prior) over finite strings, defined as:
          \(M(x) = \sum_{p: U(p)=x*} 2^{-\ell(p)}\)
      (where \(x*\) means that the program outputs a string that has \(x\) as a prefix).

