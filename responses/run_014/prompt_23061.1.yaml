          \( n > \frac{ K_U(\mu) \log 2 + C }{ \epsilon } \)

      The constant \( C \) depends on the UTM. Therefore, if we choose a UTM that has a large constant \( c_{UV} \) relative to the true environment, then we might need more observations to achieve the same average loss.

      But note: the constant \( c_{UV} \) is the same for all environments. It is a property of the two UTMs. Therefore, if we fix the true environment \( \mu \), then the additive constant in the bound for UTM \( U \) is \( K_U(\mu) \log 2 + O(1) \), and for UTM \( V \) it is \( K_V(\mu) \log 2 + O(1) \). Since \( K_V(\mu) \leq K_U(\mu) + c_{VU} \), the bound for \( V \) is at most \( (K_U(\mu) + c_{VU}) \log 2 + O(1) \). Therefore, the bound for \( V \) is at most \( c_{VU} \log 2 \) worse than that for \( U \).

      However, note that the O(1) term also depends on the UTM. The exact bound is:
          \( -\log \xi_U(b_{1:n}) \leq - \log P_{\mu}(b_{1:n}) + K_U(\mu) \log 2 + O(1) \)
      and the same for \( V \). The O(1) term is also bounded by a constant that depends on the UTM. Therefore, the entire additive constant in the bound is \( K_U(\mu) \log 2 + c_U \) for UTM \( U \) and \( K_V(\mu) \log 2 + c_V \) for UTM \( V \), where \( c_U \) and \( c_V \) are constants depending on the UTM.

