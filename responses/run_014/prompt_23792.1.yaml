answer: |-
  Here's your targeted Q&A prep sheet, ranked by impact/likelihood for this specific audience. I've flagged the thin spots honestly – knowing them is half the battle.

  **Ranked Objections & Replies:**

  1.  **The Reliabilist Hammer: "If the source *is* reliable, why *shouldn't* bootstrapping generate justification? It's just the system checking itself, confirming its own reliability. Denying this seems like imposing an artificial internalist constraint on a fundamentally externalist process." (From Process Reliabilists)**
      *   **Your Move:** Hold the line.
      *   **Reply (90 sec):** "You're right that if the perceptual system *is* reliable, the bootstrapping argument yields a true conclusion. The issue isn't truth-conduciveness in the externalist sense, but *internal justificatory status*. Dogmatism says perception provides immediate, prima facie justification for perceptual beliefs *absent defeaters*. Bootstrapping tries to use that very justification evidentially *for the reliability premise itself*. Wright's point is that this move is question-begging in a justificatory sense, even if reliable, because the justification for the premises *presupposes* (is only available if) the reliability claim is already taken for granted. It's not an externalist constraint; it's about the structure of *justification transmission*. Reliability is a condition *for* perceptual justification to exist in the first place; it can't be its *evidential product* using that same justification."
      *   **Thin Spot:** Explaining *why* the presupposition prevents transmission without relying on intuition they reject. They'll likely retort: "If it works reliably, it *does* confirm itself externally, and that's all that matters for justification." Your reply hinges on them accepting a distinction between operative reliability and reflective, evidentially supported belief *about* that reliability.

  2.  **The Bayesian Bomb: "On a standard Bayesian model, repeated successful predictions *do* incrementally confirm the reliability of a source, even with some circularity concerns (like dependence). Doesn't your transmission failure claim simply ignore that conditional probabilities *can* shift, however slightly, in bootstrapping cases? Why isn't that new warrant?" (From Formal Epistemologist)**
      *   **Your Move:** Concede a narrowed version / Challenge the model.
      *   **Reply (90 sec):** "That's a crucial point. Bayesian models *can* show credence increases. However, this often relies on substantive assumptions, like a non-zero prior on reliability or treating seeming-states as conditionally independent *given reliability*. My claim targets *evidential warrant generated purely by the bootstrapping inference itself*. Wright's transmission failure suggests the inference *itself* is inert for justification *if you lacked antecedent entitlement*. The Bayesian update might reflect background assumptions or a *different* kind of warrant (like entitlement) doing the work, not the bootstrapping inference *generating* new evidential support ex nihilo. The formal model might track *confidence*, but not necessarily the *source* or *structure* of the justification."
      *   **Thin Spot:** If they insist their model *is* capturing the core justificatory structure and shows warrant increases, you need to argue *why* the Bayesian shift isn't purely evidential warrant from the inference. Distinguishing "tracking confidence via background assumptions" from "generating new evidential warrant via the inference" is subtle and risks sounding ad hoc.

  3.  **Internalist Worry: Skepticism's Shadow: "If bootstrapping fails to provide justification for cornerstone propositions like sensory reliability, and we can't get it non-circularly elsewhere, doesn't this leave perceptual justification fundamentally insecure? Doesn't dogmatism *need* something like bootstrapping to avoid skepticism, and your view undermines that?" (From Internalist-Leaning Generalists)**
      *   **Your Move:** Hold the line.
      *   **Reply (90 sec):** "Not at all. The core insight of dogmatism is that we *don't* need antecedent justification for cornerstones to have perceptual justification. Pryor argues we have immediate justification for perceptual beliefs *without* needing to first establish reliability. My view preserves that. Entitlement provides the needed non-evidential warrant for the cornerstone. The mistake is thinking we *also* need, or can get, *evidential* warrant for it via bootstrapping. Skepticism is only threatened if we demand *evidential* warrant for the cornerstone *before* allowing perceptual justification – which dogmatism (rightly) rejects. Entitlement blocks that demand. Losing bootstrapping isn't losing security; it's recognizing we were never entitled to demand the impossible kind of warrant."
      *   **Thin Spot:** Justifying Entitlement itself. If pressed, you'll need a crisp, non-handwavy explanation of *why* we're entitled and what grounds it (e.g., indispensability for rational inquiry), which wasn't the focus of your talk.

  4.  **Internalist Worry: Closure Clash: "This sounds suspiciously like denying closure. If I'm justified in believing each premise of a valid argument (the individual perceptual beliefs and the conditional 'If it looks red, it is red' in the track-record), and I competently deduce the conclusion ('Vision is reliable'), how can I *not* be justified in believing the conclusion? Isn't transmission failure just closure failure by another name?" (From Internalist-Leaning Generalists)**
      *   **Your Move:** Concede a narrowed version / Distinguish sharply.
      *   **Reply (90 sec):** "It's a vital distinction. Closure principles typically say: if you're justified in believing P, and you know P entails Q, then you can *become* justified in believing Q (perhaps by performing the inference). Transmission failure is more specific: it says that *in certain cases*, the warrant for P *cannot* be transmitted to Q *via that particular inference*, *even if* the inference is valid and you're warranted in P. Crucially, you might be justified in Q *some other way* (like entitlement)! The bootstrapping inference fails to *transmit* warrant specifically because the warrant for the premises *depends on* the presupposition of Q. So, closure might hold globally (you can be justified in the conclusion), but *this specific argument* doesn't generate its justification."
      *   **Thin Spot:** Making the "depends on" relation crystal clear and showing it genuinely blocks *this* inference without threatening closure generally. Some might still see it as a sneaky closure denial.

  5.  **Reliabilist Counter: Reflective Access: "Even granting your distinction, doesn't a rational agent need *some* reflective way to access or confirm the reliability of their faculties? If bootstrapping is ruled out, and entitlement is non-reflective 'background' warrant, how does the subject ever *know* or become reflectively justified in believing their perception is reliable?" (From Process Reliabilists / Internalist Leanings)**
      *   **Your Move:** Concede partially / Reframe the need.
      *   **Reply (90 sec):** "This is a great question about reflective equilibrium. My view *does* deny that bootstrapping provides that reflective access. But reflective access might come from other sources: coherence with other beliefs, scientific investigation (using other faculties!), or even understanding entitlement itself reflectively. Crucially, dogmatism argues we don't need reflective access *to have* perceptual justification; it operates pre-reflectively. Entitlement provides the pre-reflective warrant for the cornerstone enabling that justification. *Confirming* it reflectively is a different project, potentially using different methods (not bootstrapping), and might not yield the same *kind* of foundational warrant entitlement provides. The inability to bootstrap doesn't mean we're blind to our reliability; it means we can't prove it using *only* the source whose reliability is in question."
      *   **Thin Spot:** Acknowledging that reflective access might be harder or different, which could feel unsatisfying. You need to firmly maintain that lack of reflective access via bootstrapping doesn't undermine the *operative* justification.

  6.  **Bayesian/Generalist: Formalizing Entitlement: "You keep mentioning 'entitlement' as this non-evidential warrant. How would you model this 'entitlement' formally, especially within a Bayesian framework where priors and updating rules are explicit? Isn't it just smuggled into the prior probability for reliability?" (From Formal Epistemologist / Generalists)**
      *   **Your Move:** Concede a connection / Highlight the difference.
      *   **Reply (90 sec):** "That's a fair challenge. One way to *represent* entitlement within a Bayesian model *might* be as a constraint on the prior – e.g., forbidding a prior of zero on cornerstone propositions, or assigning them a certain minimal credence grounded in their role. However, the *justificatory story* is different. The Bayesian prior is often seen as a subjective starting point. Entitlement, in Wright's sense, is meant to be an *objective warrant* – a permission or rational right to trust, grounded in the indispensable role of the cornerstone for coherent thought or inquiry. It's not just a psychological starting point; it's a normative status. So while a non-zero prior might *track* entitlement in the model, the *reason* for that prior assignment should be understood as reflecting the entitlement, not vice-versa."
      *   **Thin Spot:** This walks a tightrope. Emphasizing it's a *normative status* might feel like hand-waving to the formalist. Conceding it maps onto the prior risks reducing it to mere subjective probability.

  7.  **Generalist: Scope of Cornerstones: "You classify 'my vision is reliable' as a cornerstone requiring entitlement. But isn't that extremely specific? What distinguishes cornerstones from other ordinary empirical propositions? Why isn't *everything* a cornerstone, or why can't more things be bootstrapped?" (From Generalists)**
      *   **Your Move:** Hold the line (with clarification).
      *   **Reply (90 sec):** "Wright identifies cornerstones by their *epistemic role*: they are presuppositions that must be in place for a *whole domain* of inquiry (like perception) to deliver justification at all. 'My vision is reliable' isn't just another belief; doubting it undermines the justificatory power of *any* particular perceptual seeming. Contrast this with a belief like 'That bird is a robin' – doubting *that* doesn't cripple my entire perceptual justification system. Bootstrapping fails specifically when trying to evidentially support these deep, enabling presuppositions *using the justification they themselves enable*. Not every proposition plays this role; cornerstones are special hinges for specific domains of warrant."
      *   **Thin Spot:** Providing a rigorous, non-circular criterion for identifying cornerstones beyond "things that cause transmission failure when bootstrapped" or "things perception presupposes." Can you crisply define the "domain of inquiry"?

  **The Question You Hope Nobody Asks:**

  **"You argue that the subject is 'entitled' to trust perception without evidence, making bootstrapping unnecessary. But Wright developed entitlement primarily to block *skeptical* arguments (like Moore's) by providing a non-evidential warrant for cornerstones *against* skepticism. Your use redeploys it to block *dogmatism's* apparent ability to bootstrap. Doesn't this turn Wright's anti-skeptical weapon *against* the very theory (dogmatism) that's often seen as the best *anti-skeptical* position? Are you arguing dogmatism *needs* Wright's apparatus to avoid licensing bootstrapping, even though dogmatism itself was supposed to be a simpler answer to skepticism than Wright's? Isn't there a deep tension here?"**

  *   **Why it's dangerous:** It directly challenges the coherence of merging Wright and Pryor. It exposes a potential tension: Pryor wants simple, immediate justification to fight skepticism; Wright adds complex machinery (entitlement) also to fight skepticism, but you're using that machinery to *restrict* what Pryor's theory can do (bootstrapping). It forces you to defend the compatibility of these views at a foundational level and explain why dogmatism *needs* Wrightian constraints, potentially making dogmatism seem less simple or attractive.

  **Good luck. Remember: Confidence in your core thesis is key. Concede where you must gracefully, but hold the line on transmission failure in bootstrapping and the need for entitlement over evidential bootstrapping for cornerstones. Your thin spots are known; prepare concise ways to navigate them without getting bogged down.**
