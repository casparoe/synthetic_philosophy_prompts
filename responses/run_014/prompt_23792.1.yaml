  First, I need to understand the core of their argument. They claim that in bootstrapping cases (like White's colored cards or Vogel's Roxanne), the inference is valid and each step is justified dogmatically, but warrant doesn't transmit across the whole argument. So, no new warrant is generated for claims like "my vision is reliable." They argue this isn't a problem because we're not entitled to demand evidential warrant for such cornerstone claims. 

