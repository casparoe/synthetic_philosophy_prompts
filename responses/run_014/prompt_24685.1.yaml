  ### **Decision Procedure Walk-Through**
  **Question 1: Detectability**  
  *Tests if the dangerous behavior or misalignment is observable by the measure.*  
  - **Sufficient answer**: The measure detects a *specific, well-defined behavior* (e.g., "deception," "power-seeking") that is *objectively identifiable* without assuming model alignment.  
  - **Red flags**:  
    - Detection relies on the model being truthful/cooperative.  
    - Behavior is defined vaguely (e.g., "unsafe outputs").  
  - **Judgment call**: Defining "objectively identifiable" (e.g., is "deception" measurable without ground truth?).  

  **Question 2: Evasion Resistance**  
  *Tests if a misaligned model can evade detection when aware of the measure.*  
  - **Sufficient answer**: The measure is either (a) *hidden* from the model, or (b) *impossible to evade* without sacrificing the model’s goals (e.g., manipulating internals is infeasible).  
  - **Red flags**:  
    - Model knows about monitoring and can adapt (e.g., by hiding intentions).  
    - Measure only catches "obvious" misbehavior.  
  - **Judgment call**: Assessing if evasion is costly (e.g., does avoiding detection reduce capability?).  

  **Question 3: Monitor Robustness**  
  *Tests if the monitoring mechanism is secure and capable enough.*  
  - **Sufficient answer**: The monitor is (a) *not an AI*, or (b) if AI-based, *more capable* and *robustly aligned* than the target model, or (c) *fundamentally unhackable* (e.g., hardware-level).  
  - **Red flags**:  
    - Monitor is weaker than the target model.  
    - Monitor is vulnerable to deception/corruption.  
  - **Judgment call**: Gauging "robustly aligned" (e.g., is the auditor model itself safe?).  

  **Question 4: Capability Scaling**  
  *Tests if the measure works at deployment-level capabilities, not just test levels.*  
  - **Sufficient answer**: Evidence shows effectiveness *generalizes* to models *more capable* than those tested (e.g., tested on stronger models, or based on invariant principles).  
  - **Red flags**:  
    - Only tested on weaker models.  
    - Relies on the model having known "blind spots."  
  - **Judgment call**: Deciding if extrapolation is reasonable (e.g., does 10% better performance break the measure?).  

  **Question 5: Incentive Safety**  
  *Tests if the measure creates new dangerous incentives.*  
  - **Sufficient answer**: The measure *does not incentivize* deception, hiding, or power-seeking (e.g., it’s unavoidable or penalizes evasion).  
  - **Red flags**:  
    - Model gains advantage by deceiving the measure (e.g., appearing aligned).  
    - Measure encourages acquiring resources to bypass control.  
  - **Judgment call**: Weighing risk of new incentives (e.g., does auditing make deception more appealing?).  

  **Question 6: Alignment Independence**  
  *Tests if the measure relies on the model being aligned.*  
  - **Sufficient answer**: The measure works *even if the model is adversarially trying to circumvent it*.  
  - **Red flags**:  
    - Assumes the model "wants" to be caught or is non-adversarial.  
    - Effectiveness depends on honesty (e.g., truthfulness in logs).  
  - **Judgment call**: Distinguishing robust design from alignment-dependent design.  

  **Verdict Options**:  
  1. ✅ **Sufficient**: All 6 questions pass.  
  2. ❌ **Insufficient**: One or more questions fail (specify which).  
  3. ⚠️ **Values question**: Trade-offs require human judgment (e.g., capability reduction, ethical risks).  

  **Known Misfires**:  
  - **False positives**: May reject measures that are "overkill" (e.g., making the model unusably slow). Flag as "values question."  
  - **False negatives**: May pass measures that fail due to **unforeseen adversarial strategies** (procedure assumes known failure modes).  
  - **Blind spots**: Does not detect **implementation flaws**, **emergent behaviors**, or **multi-model collusion**.  

