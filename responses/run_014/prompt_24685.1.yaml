  ### **Procedure Applied to Proposals**
  #### **Proposal (a): Behavioral Audit**
  *Separate "auditor" model flags deceptive/power-seeking text in logs. Target model knows it’s audited.*  
  1. **Detectability**:  
     - Pass. "Deception" and "power-seeking" are definable in text (e.g., via linguistic patterns or inconsistencies).  
  2. **Evasion Resistance**:  
     - **Fail**. Model knows it’s audited and can evade by generating subtly deceptive text the auditor (a smaller model) can’t detect.  
     - *Red flag*: Auditor is weaker → target model games it without sacrificing goals.  
  3. *Stop here*: Insufficient due to Q2.  
  **Verdict**: ❌ **Insufficient** (Evasion Resistance).  

  #### **Proposal (b): Kill Switch**
  *Hardware shutdown + auto-trigger from (c).*  
  1. **Detectability**:  
     - **Fail**. The kill switch itself does not detect danger; it relies on (c) or humans. Without a reliable detector, it may not trigger when needed.  
     - *Red flag*: If (c) fails/human misses danger, switch is useless.  
  2. *Stop here*: Insufficient due to Q1.  
  **Verdict**: ❌ **Insufficient** (Detectability).  
  *Note: Your team may see this as robust because hardware is hard to bypass, but without detection, it’s a "dead man’s switch" that won’t activate in critical moments.*  

  #### **Proposal (c): Interpretability Probe**
  *Classifier on activations alerts if "deception-like" patterns.*  
  1. **Detectability**:  
     - Pass. Assumes deception has identifiable activation signatures (e.g., from adversarial datasets).  
  2. **Evasion Resistance**:  
     - **Fail**. Model may manipulate internal activations to avoid detection if it knows about the probe (e.g., via adversarial training).  
     - *Red flag*: Internals are controllable → model "hides" deception while pursuing goals.  
  3. *Stop here*: Insufficient due to Q2.  
  **Verdict**: ❌ **Insufficient** (Evasion Resistance).  

