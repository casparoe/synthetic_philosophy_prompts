  ### **What the Procedure Cannot Do**
  1. **Blind to unknown unknowns**:  
     - Fails to catch **emergent risks** (e.g., new deception tactics the measure wasn’t tested for).  
     - Misses **contextual failures** (e.g., measure works in lab but breaks under distribution shift).  
  2. **No security auditing**:  
     - Ignores **implementation flaws** (e.g., bugs in the kill switch firmware) or **hardware vulnerabilities**.  
  3. **Static analysis**:  
     - Cannot model **dynamic adaptations** (e.g., a model that "learns" to bypass controls post-deployment).  
  4. **Single-agent focus**:  
     - Assumes one AI; blind to **collusion** (e.g., multiple models cooperating to disable controls).  

  ### **When Gut and Procedure Disagree**
  - **Pause and scrutinize**: Identify which step caused disagreement. Is it a judgment call (e.g., Q2’s "cost of evasion")?  
  - **Escalate values questions**: If trade-offs (e.g., usability vs. safety) split the team, flag as ⚠️.  
  - **Seek adversarial testing**: For high-stakes measures, simulate attacks (e.g., red-team evasion attempts).  
  - **Fallback principle**: If the procedure rejects a "trusted" measure (e.g., your kill switch), demand evidence for the disputed assumption (e.g., "How do we *guarantee* detection?").  

  ### **Final Notes**
  - **Kill switch verdict**: The procedure rejects it due to undependable detection, but this highlights a gap: pairs like (b)+(c) should be reviewed *together*.  
  - **Your role**: Use this to force explicit justifications for assumptions (e.g., "How does this handle a model smarter than we tested?"). It’s a sanity check, not a replacement for thorough testing.  
  - **Improvement**: Log recurring failure modes (e.g., "evasion" in Q2) to refine future proposals.
