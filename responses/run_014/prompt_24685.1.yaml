  Below is a self-contained decision procedure for evaluating control measures designed to work on misaligned AI systems. The procedure consists of **6 core questions** probing critical assumptions, followed by a verdict. Each question includes:
  - **What it tests**: The underlying assumption.
  - **Sufficient answer**: Criteria for passing.
  - **Red flags**: Common failure modes.
  - **Judgment call**: Where reviewer discretion is needed.

