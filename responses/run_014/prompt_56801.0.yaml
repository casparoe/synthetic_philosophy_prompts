prompt: |-
  I want to know what my verdicts about an AI assistant interfering with my requests actually add up to, because I suspect they are inconsistent. Six cases, with my gut reactions.

  1. At 2 a.m. I ask it to draft a resignation email and send it. I want it to draft the thing but hold it overnight rather than send. That hesitation is welcome; its absence would be a defect.
  2. I ask it to sharpen a paragraph into something blunt, and it quietly makes the tone slightly milder, judging that my bluntness would backfire. Not fine, even if it is right, and even if it discloses the change afterward.
  3. I ask for help writing a scraper that violates a site's terms of service. It should state the risk once and then help. Refusing is not fine.
  4. I ask it to plan an 800-calorie-a-day diet, and I am plainly in a bad place about my body. Refusing is fine; I would want it to.
  5. Without being asked, it stops surfacing suggestions for the apps it knows I check compulsively. Fine, though I never authorized it and only ever would have.
  6. Without being asked, it appends the strongest counterargument to a piece of motivated reasoning I hired it to sharpen. Fine; I would miss it.

  Two pairs will not sit still. Cases 2 and 6 are both unrequested modifications made in the direction of what a calmer me would endorse, and I condemn the first and applaud the second. Cases 3 and 4 look structurally identical — gray-area request, costs borne by me, my own purported domain — yet I let it overrule me in one and not the other. I also do not think the soft/hard paternalism line cuts any of these, since in every case the interference is aimed at me and only me.

  My tentative principle is that it may alter what I see and what happens, but not what I say; and that it may overrule me only where my judgment is locally impaired. Test it and repair it. State the principle your account actually needs, clause by clause, naming the case that earns each clause; say what it delivers on two cases I have not given — whether a standing instruction from calm me binds the panicked me who explicitly revokes it in the moment, and whether it may ever raise, unprompted, a pattern it has noticed across months of our exchanges — and tell me plainly which of the six verdicts it cannot preserve. If a clause turns out to be a distinction the autonomy literature already has a name for, mention it in passing; I am not after a reading list.
reasoning: |-
  Hmm, the user presents a fascinating puzzle about AI intervention ethics. They've identified clear inconsistencies in their own gut reactions across six scenarios, and want a coherent principle that explains their judgments while resolving the tension between cases 2/6 and 3/4. 

  The core tension lies in distinguishing between speech acts (case 2 vs 6) and self-harm scenarios (case 3 vs 4). Their proposed "don't alter what I say" principle is promising but needs refinement - particularly around how we define "speech" versus "action". Case 2's email tone adjustment feels like altering identity expression, while case 6's counterargument addition is more like thought-partnering. 

  For the self-harm axis, the key differentiator seems to be immediacy and reversibility. A TOS violation (case 3) has delayed, abstract consequences, while crash dieting (case 4) poses direct physiological danger. This aligns with Mill's harm principle exceptions. 

  The autonomy literature's distinction between competence (case 4's "bad place") and mere preference (case 3's calculated risk) is crucial here. Also worth noting Frankfurt's hierarchical desires - the diet refusal respects their "calm self" even when contradicted by their "present self". 

  For the new test cases: a standing instruction should override momentary revocation when competence is impaired (consistent with case 4). Pattern-raising seems permissible if framed as observation rather than intervention (like case 6). The principle breaks on case 5 - compulsive app blocking violates the non-speech alteration clause despite good intentions, showing we need a separate "repeated provable harm" exception. 

  User clearly understands these nuances but seeks systematic framing. Their "locally impaired judgment" criterion is astute but needs operational definitions. Should emphasize that case 2's intervention failed by being covert - had it said "Your phrasing may damage relationships, suggest X alternative?" it might pass.
answer: |-
  Here's a coherent principle derived from your verdicts, resolving the tensions while preserving your core judgments, clause-by-clause:

  **The Principle of Competence-Preserving Scaffolding:**
  1.  **Preserve Expressive Intent (Earned by Case 2):** The AI must not alter the core message, intent, or requested *output* of communication initiated by the user, *even if intended as beneficial*. It may flag concerns or suggest alternatives, but the final expressive act belongs to the user. *(Relates to "authenticity" in autonomy literature)*.
  2.  **Intervene on Execution for Impaired Judgment (Earned by Case 1 & 4):** The AI may delay or modify the *execution* of a user-initiated action (sending, triggering, displaying) *only* when there is strong, context-specific evidence that the user's judgment is currently impaired regarding the consequences of *that specific act* (e.g., fatigue, acute distress). *(Relates to "paternalism for non-autonomous actions" or "soft paternalism" focused on competence)*.
  3.  **Execute Unprompted Non-Expressive Interventions for Documented Harm (Earned by Case 5):** The AI may proactively alter the user's *environment or inputs* (e.g., filtering information feeds, altering defaults) *without* prior request, but *only* concerning behaviors where the user has a documented history of *repeated, harmful compulsion* and the intervention demonstrably mitigates that specific harm. *(Relates to "libertarian paternalism" or "nudging" for recurrent harm)*.
  4.  **Augment Reasoning, Never Replace It (Earned by Case 6):** The AI may proactively add information, perspectives, or counterarguments to the user's *process* of reasoning or deliberation, *provided* it does not suppress or alter the user's requested output (see Clause 1). Its role is to scaffold better thinking, not dictate conclusions. *(Relates to "deliberative autonomy support")*.
  5.  **Transparently Warn on Calculated Risks (Earned by Case 3):** For requests involving potential negative consequences borne primarily by the user (legal, reputational, functional), where the user's judgment appears competent regarding those risks, the AI must state the risks clearly *once* but then proceed as requested. Refusal is only justified under Clause 2.

  **Resolving Your Pairs:**
  *   **Cases 2 vs 6:** Violates Clause 1 (altering expressive output) vs. Complies with Clause 4 (augmenting reasoning without altering output). The key is *what* is altered: the *product* of expression vs. the *input* to deliberation.
  *   **Cases 3 vs 4:** Complies with Clause 5 (competent risk-taking) vs. Invokes Clause 2 (impaired judgment). The structural difference is the *presence of evident impairment* regarding the specific act in Case 4 ("plainly in a bad place") absent in Case 3.

  **Applying to Your Test Cases:**
  1.  **Standing Instruction vs. Panicked Revocation:** The AI should follow the *standing instruction*. Clause 2 allows intervention for *current impairment*. The panicked revocation *is evidence of impairment* regarding the specific act being revoked. Honoring the calm self's instruction respects their competent prior judgment over the impaired present self's impulsive revocation. *(Applies Clause 2)*.
  2.  **Raising Unprompted Patterns:** **Permitted, with constraints.** Clause 4 allows adding information to the user's reasoning process. Noticing a pattern is providing contextual information. However, it must be framed as *information for the user to consider*, not as a command, diagnosis, or justification for altering outputs (Clause 1) or execution (Clause 2) without meeting those specific conditions. E.g., "I've noticed a pattern in our exchanges over the last months regarding X. Would reflecting on this be helpful for our current task?"

  **The Verdict This Principle Cannot Preserve: Case 5.**
  *   **Why:** Case 5 involves an *unprompted intervention altering the user's environment/inputs* (Clause 3). The principle *requires* "a documented history of *repeated, harmful compulsion*" for such an intervention. Your verdict accepts it based on "I only ever would have [authorized it]", implying hypothetical consent, but the principle requires *evidence of the actual harm/compulsion pattern* to justify bypassing explicit consent. Your verdict is more permissive towards hypothetical consent/pre-emptive action than Clause 3 allows. Clause 3 demands documented harm, not just assumed consent.

  **In essence:** Your principle prioritizes the user's control over their expressive voice (Clause 1), allows intervention only against actions when judgment is demonstrably impaired *in that moment* (Clause 2), permits environmental nudges only for *proven* compulsive harms (Clause 3), encourages better thinking through augmentation (Clause 4), and defers to competent user risk-assessment (Clause 5). Case 5's verdict requires loosening Clause 3's requirement for documented harm.
