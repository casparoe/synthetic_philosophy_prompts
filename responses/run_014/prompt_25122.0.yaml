  **Decision Tree for the Special Composition Question**

  **Question 1:**  
  Consider the Eiffel Tower and your left shoe together. Is there a single object composed of just these two things?  
  - **Yes** → **Mereological Universalism** (any collection composes an object).  
  - **No** → Proceed to Question 2.  

  **Question 2:**  
  Does a living cat compose a single object? (That is, is there a cat, beyond just its particles?)  
  - **No** → Proceed to Question 3.  
  - **Yes** → Proceed to Question 3.  

  **Question 3:**  
  Does a wooden chair (made of several pieces of wood) compose a single object?  
  - **If you answered "No" to Question 2 (cat)**:  
    - **No** → **Mereological Nihilism** (only simple particles exist; no composites).  
    - **Yes** → **Unoccupied position** (artifacts exist, but living things do not). *Diagnosis: No one defends this—living organisms seem more fundamental than artifacts.*  
  - **If you answered "Yes" to Question 2 (cat)**:  
    - **Yes** → Proceed to Question 4.  
    - **No** → Proceed to Question 4.  

  **Question 4:**  
  Does a heap of sand (e.g., a typical pile of grains) compose a single object?  
  - **If you answered "Yes" to Question 3 (chair)**:  
    - **Yes** → **Moderate Restrictivism** (chairs, cats, and heaps exist; arbitrary fusions like "Eiffel Tower + shoe" do not).  
    - **No** → **Unoccupied position** (artifacts and living things exist, but heaps do not). *Diagnosis: No one defends this—heaps are commonsense objects, and rejecting them while accepting chairs is unmotivated.*  
  - **If you answered "No" to Question 3 (chair)**:  
    - **No** → **Van Inwagen’s Organicism** (composition occurs only when parts constitute a life; e.g., cats exist, but chairs/heaps do not).  
    - **Yes** → **Unoccupied position** (living things and heaps exist, but artifacts do not). *Diagnosis: No one defends this—rejecting artifacts while accepting heaps is arbitrary (both are non-living).*  

  ---

  **Notes on Indistinguishable Positions**:  
  - **All positions are separable** with the given cases.  
  - **The tree does not distinguish variants of moderate restrictivism** (e.g., a view accepting chairs/cats/heaps but rejecting corpses). Adding a "corpse" case (e.g., *"Does a cat’s dead body compose a single object?"*) could split this, but current leaves cover core positions.  
  - **Unoccupied leaves** reflect unstable/unmotivated thresholds for composition.
