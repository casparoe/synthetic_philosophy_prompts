prompt: |-
  I cover science and ideas for a magazine and I'm trying to write a long piece on evolutionary psychology — not the "is it even real" vibes piece, but one that actually engages with the methodological case against it, the just-so-story charge. I've been digging and I'm a bit lost on which of the specific critiques actually do work. Can you rank them and defend the ranking? I'm thinking the unfalsifiability argument, the modularity-of-mind thing, the adaptation-versus-exaptation problem, and the "plenty of competing hypotheses and not enough tests to tell them apart" problem — but maybe I'm missing the one that's actually carrying the weight. For each, tell me what makes it strong or weak, and which one would genuinly change my mind about the field if I took it seriously. I've got about three thousand words and I want to spend them on the argument that's really doing the work, not the ones that are overrated or don't actually follow.
reasoning: |-
  Okay, the user is a science journalist writing a long piece on evolutionary psychology (EP). They specifically want to avoid the superficial "is it real?" debate and instead focus on the methodological critiques, particularly the just-so-story charge. They've identified four key issues but are unsure which carries the most weight. 

  Hmm, they seem frustrated by the polarized discourse around EP—probably tired of seeing the same reductive takes. Their real need is to identify the critique that actually threatens EP's scientific validity, not just the popular talking points. The phrase "genuinely change my mind about the field" suggests they want rigor, not rhetoric. 

  Let me unpack their four points: 
  Unfalsifiability is the classic Popperian critique, but modern EP does attempt testable predictions. 
  Modularity debates are thorny but not fatal—neuroscience shows both specialized and general networks. 
  Exaptation is important but doesn't invalidate adaptationist approaches per se. 
  The competing hypotheses problem... ah, this feels different. It's not about theory being impossible, but about practice being untethered. 

  *Lightbulb moment*: The core issue isn't any single flaw—it's that EP struggles with hypothesis competition. Unlike genetics (with phylogeny as a map) or paleobiology (with stratigraphic layers), EP's "time machine" problem means multiple stories fit the same data. When I think about Leda Cosmides' work vs. alternative explanations for cheater detection, or David Buss' mating studies vs. cultural transmission models... yeah, the field often lacks decisive tests. 

  The strongest critique is the methodological one: EP can generate plausible stories faster than it can test/eliminate them. That's why critics like David Buller or Elisabeth Lloyd focus on confirmation bias—researchers stop looking when they find *an* evolutionary story, not *the best* one. This isn't unfixable (better cross-cultural databases, tighter linking to archaeology), but it's the hurdle that actually separates EP from mature evolutionary sciences. 

  For their 3k words, I'd suggest: 
  - Start by dismissing weak critiques (modularity isn't binary; EP isn't inherently unfalsifiable). 
  - Then unpack how hypothesis competition plays out in landmark studies (e.g., jealousy research). 
  - Argue that resolving this requires EP to borrow methods from cultural evolution or experimental anthropology. 
  - End provocatively: The problem isn't that EP tells stories—it's that it hasn't yet built a library where only one story fits the facts.
answer: |-
  Below is a prioritized critique ranking for your evolutionary psychology piece, with a focus on **methodological rigor** over ideological debates. I’ve ranked these based on their capacity to undermine EP’s scientific legitimacy, supported by philosopher-scientist consensus and empirical challenges. The top critique forces a reckoning with EP’s core scientific identity—the others are significant but addressable within the field’s framework.

  ### **Ranking & Analysis**  
  1.  **The Hypothesis Competition Problem ("Too Many Stories, Too Few Tests")**  
      **Strength**: Devastating. EP’s foundational challenge is **proliferation of unfalsified alternatives**. For any trait (e.g., male aggression, jealousy, mate preferences), EP offers adaptationist hypotheses, while critics propose alternatives: cultural transmission, exaptations, developmental constraints, or non-adaptive byproducts. EP often lacks tools to *eliminate* competing explanations.  
      - *Example*: "Men prefer youthful partners" → EP argues for fertility cues. Critics counter: youth = status symbol in industrial societies (cultural), or a byproduct of general attraction to health (non-adaptive).  
      - **Why it works**: EP’s reliance on reverse engineering (inferring past function from present traits) becomes unscientific without strong evidence to *rule out* rivals. Philosopher **Elisabeth Lloyd** and biologist **Jerry Coyne** emphasize this as EP’s "fatal flaw."  
      - **Mind-changer potential**: High. If you accept that EP rarely *tests against* non-adaptationist hypotheses (e.g., using cross-cultural archaeology, genetic paleo-environments, or agent-based models), the field appears more storytelling than hypothesis-testing.  

  2.  **The Unfalsifiability Charge ("Just-So Stories")**  
      **Strength**: Context-dependent. Early EP deserved this; modern EP *aims* for testability. However, **escape hatches** persist: failed predictions are often explained away via "mismatch theory" (modern ≠ ancestral environment) or shifting adaptive functions.  
      - *Example*: If a predicted sex difference isn’t found, it’s attributed to "recent cultural suppression," not a flawed hypothesis.  
      - **Why it’s weaker now**: EP *can* be falsified (e.g., predictions about jealousy mechanisms tested via fMRI; cross-cultural universality studies). But when hypotheses are insulated by auxiliary assumptions, Popperian falsifiability collapses.  
      - **Priority**: #2 because methodological reforms (pre-registration, strong null hypotheses) can address it.  

  3.  **The Adaptation-vs-Exaptation/Byproduct Problem**  
      **Strength**: Important but manageable. Gould & Lewontin’s "spandrels" critique highlights that not every trait is an adaptation. EP often assumes adaptation without evidence of **special design** (complexity, efficiency for a specific function).  
      - *Example*: Religion could be an adaptation (group cohesion) or a byproduct of pattern-seeking cognition.  
      - **Why it’s not fatal**: EP can (and sometimes does) apply rigorous criteria for adaptation (e.g., statistical universality, functional specificity). The real issue is *premature adaptationism*, not adaptationism itself.  

  4.  **Modularity of Mind**  
      **Strength**: Overrated critique. Critics (e.g., **David Buller**) argue brains are domain-general, not collections of Swiss Army knives. But modularity isn’t binary—modern EP accepts "soft modularity" (e.g., learning biases shaped by selection).  
      - *Example*: Fear of snakes may be a learnable bias, not a hardwired module.  
      - **Why it’s weakest**: Neuroscience shows specialized neural networks (e.g., face recognition), and EP doesn’t require "modules" in Fodor’s rigid sense. This is largely a semantic debate.  

  ---

  ### **The Winning Critique: Hypothesis Competition**  
  **Why it deserves 80% of your word count**:  
  - **It exposes EP’s empirical gap**. EP excels at generating hypotheses but struggles to test them against alternatives. Unlike evolutionary biology (which uses phylogenetics/fossils to constrain hypotheses), EP’s "past environment" is inferred, not observed.  
  - **Case study: Jealousy**. EP claims sex differences in jealousy (men: sexual infidelity; women: emotional) reflect adaptive paternity uncertainty vs. resource loss. But meta-analyses show modest effects, and cultural variation undermines universality. Competing hypotheses (social roles, self-esteem threats) explain data equally well—with fewer assumptions.  
  - **The solution isn’t impossible, but it’s underused**: EP needs:  
    - **Strong inference tests**: Designing experiments that pit adaptationist vs. non-adaptationist models.  
    - **Integration with archaeology/history**: Using material evidence (e.g., kinship structures in ancient DNA) to constrain hypotheses.  
    - **Cross-cultural databases**: Universality claims require sampling beyond WEIRD societies.  

  **If this critique lands**, it forces EP to evolve or stagnate: Without methods to eliminate rival hypotheses, EP risks becoming a "storytelling engine" rather than a predictive science. As biologist **H. Allen Orr** noted: "The problem isn’t that EP tells stories—it’s that it tells *only* its own stories."  

  ### **Recommendations for Your Piece**  
  - **Lead with the hypothesis competition problem**. Frame it as EP’s "scientific integrity challenge."  
  - **Use concrete examples** (e.g., jealousy, incest avoidance) to show how competing explanations persist.  
  - **Interview critics** (e.g., **David Buller**, **Elizabeth Lloyd**) **and reformists** (e.g., **Debra Lieberman**, **Pascal Boyer** who advocate for tighter methods).  
  - **Avoid** rehashing "nature vs. nurture" or ideological battles. Focus on **methodology**: What would a robust EP study look like?  

  This approach sidesteps tired debates and targets the critique that reshapes how we judge EP’s scientific worth. If EP can’t solve the hypothesis competition problem, its status as a rigorous science remains in doubt—regardless of its insights.
