prompt: |-
  I chair a university examinations panel that adjudicates requests for cognitive accommodations, roughly thirty to forty cases per term. The stakes are significant: we must preserve fairness across closed-book assessments while avoiding discrimination against students whose effective memory and reasoning depend on external resources. Administrators who will first apply any framework have no training in philosophy, have about twenty minutes per case, and must produce a documented rationale for my final sign-off.

  Please develop a reusable decision procedure grounded in the extended mind thesis for determining when an external resource should be treated as constitutive of a student's cognitive process rather than as a mere aid or potential source of unfair advantage. The procedure should translate the central philosophical distinctions into terms a non-specialist can apply, including the parity consideration that an external process that plays the functional role we would count as cognitive if performed in the head should presumptively count as cognitive, the further conditions often discussed concerning stable availability, typical reliance, automatic endorsement without routine critical vetting, and ready accessibility, the concern that mere causal coupling is not constitution, and the distinction between an external resource that replaces an internal capacity and one that complements it by doing something different.

  Deliver the framework as an ordered checklist or flowchart in words, with the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure terminates in a denial, where it terminates in a grant, and where it requires escalation to individual judgment because the issue turns on values or underdetermined concepts rather than observable facts. Mark explicitly which steps involve unavoidable judgment calls and which distinctions from the philosophical debate you have simplified or set aside to gain usability, with a brief justification for each simplification. Conclude with an honest statement of what the procedure cannot settle and where it is most likely to misfire.

  Then demonstrate the procedure on three cases:

  A second-year biology student with a documented working-memory limitation who has carried the same paper notebook for four years, containing densely cross-referenced diagrams in her own shorthand, consulted reflexively many times per day and relied upon for recall of material she cannot otherwise retain, who requests to bring it into a closed-book examination.

  A first-year law student who relies dozens of times per day on a commercial AI assistant trained on his own notes and accessed by phone, whose summaries he generally acts on after a brief skim but which periodically invents authorities, so that he has learned to verify citations before filing any work, who requests exam access to a locked-down version of the assistant.

  An engineering student without a diagnosed impairment who uses augmented-reality glasses that overlay standard formulae and stepwise prompts authored collaboratively with her study group, used fluently when connectivity permits but unavailable in some campus buildings and routinely double-checked against her own calculations, who requests to wear the glasses in examinations as an accommodation.

  Work through each case stepwise under your procedure to a determinate recommendation, even where the recommendation will be unwelcome to the panel, for example by requiring us to permit something we would prefer to ban or to deny something we would prefer to allow, and explain why the unwelcome result follows.
reasoning: |-
  Hmm, the user chairs a university examinations panel that handles cognitive accommodation requests. They need a practical decision framework based on the extended mind thesis for non-philosopher administrators. The stakes are high—balancing fairness in closed-book exams while avoiding discrimination against students who rely on external cognitive resources.

  Breaking this down: The user needs a reusable procedure translating complex philosophy (parity principle, coupling vs constitution, etc.) into actionable steps. Key constraints: untrained staff, 20-minute reviews, documented rationales for sign-off. The solution must explicitly flag judgment calls and simplifications while honestly admitting limitations.

  For the framework design, I'll build on Clark & Chalmers' extended mind criteria but adapt them operationally. The core sequence should ask: (1) Functional parity? (if yes, strong presumption for accommodation), (2) Integration depth? (stability/reliance/automaticity), (3) Complementarity? (does it replace or augment capacity?). Each step needs clear thresholds for pass/fail/unclear to guide time-pressed administrators.

  Crucial nuances to address: 
  - How to handle "automatic endorsement" when some verification occurs? I'll set a "routine vetting" threshold. 
  - When does accessibility limitation break constitution? I'll require "predictable availability" but ignore rare disruptions. 
  - The replacement vs complement distinction needs concrete anchors—replacement suggests accommodation while complement may not.

  For the demonstration cases: 
  - Biology student with notebook: Likely passes all bars (deeply integrated, automatic use). 
  - Law student with AI: Fails on automaticity due to verification habits, despite functional parity. 
  - Engineering student with AR glasses: Fails integration due to double-checking and spotty access. 

  The framework must flag where values trump facts (e.g., "is memory augmentation acceptable?"). I'll explicitly state when panels must debate policy rather than apply tests. Biggest risks: Overlooking students who compensate for deficits through effort (denying needed help) or overextending "cognitive" to all tools (undermining exam integrity). The honesty section will warn about these edges.
answer: |-
  ## Extended Mind Accommodation Decision Framework

  **Grounding Philosophy:** Based on Clark & Chalmers' Extended Mind Thesis (EMT), focusing on *functional parity* (if it works like internal cognition, treat it as such) and the criteria of *constancy, accessibility, endorsement*, and *past endorsement*. Simplified key idea: **Is this external resource so deeply integrated into the student's *normal* thinking process that denying it would be like denying part of their mind?**

  **Simplifications & Omissions (Justification):**
  1.  **Set Aside "Coupling vs Constitution" Debate:** We focus on observable functional integration rather than metaphysical debates. *Justification:* Administrators need practical criteria, not philosophical resolution.
  2.  **Simplified "Automatic Endorsment":** We treat "routine critical vetting" as a disqualifier for automaticity, even if verification is quick. *Justification:* Distinguishing "quick check" from "deep verification" is too subjective; "routine vetting" is a clearer operational threshold.
  3.  **Relaxed "Stable Availability":** We require *typical* and *predictable* availability in the student's *normal academic environment*, not absolute 100% availability. *Justification:* Demanding perfect availability is unrealistic; focus is on habitual reliance.
  4.  **Set Aside "Original Intent" of Resource:** We focus on *current function* for the student, not whether the resource was designed as a cognitive aid. *Justification:* What matters is how the student *uses* it now.
  5.  **Simplified "Replacement vs Complement":** If it replaces a capacity the student demonstrably lacks internally (via documentation), it leans towards accommodation. If it adds novel capabilities beyond typical internal function (e.g., real-time complex calculation beyond human ability), it leans away. *Justification:* Avoids murky distinctions; links to core fairness (replacing deficit) vs. providing advantage (adding super-human capability).

  **Decision Procedure (Sequential Checklist):**

  1.  **FUNCTIONAL PARITY (The Core Test):**
      *   *Question:* Does the external resource reliably play a functional role in the student's thinking that we would unquestionably consider part of their cognitive process if it happened *inside* their brain? (e.g., recall of facts, procedural steps, logical connections).
      *   *Sufficient "Yes":* Clear evidence (student report, clinician notes, observation) that the resource serves as the student's primary means for a core cognitive function (memory, calculation, reasoning step) they demonstrably struggle with internally.
      *   *Sufficient "No":* Resource provides novel information, complex analysis, or capabilities demonstrably beyond typical unaided human cognition for the task (e.g., real-time translation, solving complex equations instantly).
      *   *Termination:* **DENY** if "No". (Resource is an enhancer, not part of cognition). Proceed to Step 2 if "Yes" or unclear.
      *   *Judgment Call?* **YES.** Requires interpreting "core cognitive function" and "unquestionably consider cognitive if internal." *Escalation Note:* If "Yes" is very strong, accommodation is highly probable.

  2.  **INTEGRATION & RELIANCE (Depth of Coupling):**
      *   *Question A (Stable Availability & Accessibility):* Is the resource reliably and readily available to the student in their typical academic settings? (Consider physical access, connectivity, battery, etc.).
      *   *Question B (Typical Reliance):* Is the student heavily reliant on this *specific* resource for the relevant cognitive function during their normal academic work (e.g., daily use, essential for completing assignments)?
      *   *Question C (Automatic Endorsement):* Does the student typically accept the resource's output without routine critical vetting or verification, treating it as their own thought? (Occasional spot-checking due to known rare errors *might* be acceptable if ingrained as part of the process).
      *   *Sufficient "Yes" (All A, B, C):** Strong evidence of habitual, effortless, trusted use integrated into daily workflow.
      *   *Sufficient "No" (Any A, B, C):** Resource is inconsistently available, used only occasionally/situationally, or requires frequent deliberate verification.
      *   *Termination:* **DENY** if clear "No" on any (A, B, or C). Proceed to Step 3 if "Yes" or unclear (especially if A or B are strong but C is weak).
      *   *Judgment Call?* **YES, especially for C.** Assessing "routine critical vetting" vs. "occasional check" is critical and subjective. *Escalation Note:* Weakness on C is the most common point of ambiguity.

  3.  **CAPACITY DEFICIT & FAIRNESS (Replacement vs. Advantage):**
      *   *Question A (Replaces Deficient Capacity):* Is there documented evidence (e.g., psycho-educational assessment, medical diagnosis) of a specific cognitive impairment that this resource directly addresses and compensates for?
      *   *Question B (Avoids Unfair Advantage):* Does granting access *only* restore the student to functional parity with peers regarding the impaired capacity, without providing capabilities beyond typical student performance in the exam context? (Consider: Does it *only* provide information/formulae a typical student could reasonably recall? Does it *only* structure recall/processes in a way typical of internal thought?).
      *   *Sufficient "Yes" (A & B):** Clear documentation of impairment addressed, and resource demonstrably only compensates for that deficit without adding novel advantages in the exam.
      *   *Sufficient "No" (Not A or Not B):** Lack of documented impairment *specific* to the resource's function, or the resource demonstrably provides capabilities exceeding typical unaided student abilities (e.g., instant complex calculation, vast database recall beyond core syllabus).
      *   *Termination:* **GRANT** if strong "Yes". **DENY** if clear "No" on A or clear "No" on B. Proceed to Step 4 if unclear (e.g., impairment documented but resource's scope is ambiguous, or impairment borderline).
      *   *Judgment Call?* **YES, especially for B.** Defining "typical student performance," "core syllabus," and "novel advantage" requires context-specific values. *Escalation Note:* This step often involves balancing fairness principles.

  4.  **VALUES ESCALATION (Panel Judgment Required):**
      *   *Question:* Does the case hinge on unresolved ambiguity from previous steps (especially Step 2C or Step 3B) or a fundamental value conflict about the nature of cognition/fairness in this specific exam context?
      *   *Action:* **ESCALATE** to the full panel (Chair + members). Panel must debate and decide based on:
          *   Strength of evidence on functional parity and integration.
          *   Interpretation of "automatic endorsement" and "unfair advantage" in this context.
          *   Core values: Is the exam *fundamentally* testing *internalized* knowledge/skill, or the *ability to think effectively* using integrated tools? What constitutes "fairness" here?
      *   *Document:* The rationale *must* explicitly state the unresolved ambiguity or value conflict that necessitated escalation and the reasoning behind the final decision.

  **What the Framework Cannot Settle & Risks of Misfire:**
  *   **Cannot Settle Core Value Conflicts:** It cannot resolve the fundamental tension between "exam as test of internalized knowledge" and "exam as test of effective thinking with integrated tools." This is a *policy* decision the panel must make case-by-case or establish overarching principles for.
  *   **Cannot Perfectly Define "Automaticity":** Distinguishing ingrained trust/use from conscious verification is inherently fuzzy. Risk: Denying valid extensions (if overly strict on vetting) or allowing insecure tools (if too lenient).
  *   **Cannot Define "Typical Peer Performance":** What level of recall/calculation is "typical" is contextual and subjective. Risk: Granting access that provides an edge if set too low, or denying needed support if set too high.
  *   **Vulnerable to "Gaming":** Students might overstate reliance or understate vetting. Risk: Granting accommodations where deep integration isn't genuine. (Mitigation: Require specific evidence beyond self-report).
  *   **Most Likely to Misfire:** Cases involving **AI tools** (due to opacity, potential for novel capabilities, and the verification dilemma) and cases where the **impairment is subtle or poorly documented** but the integration appears genuine. Also, cases where the **resource's capabilities sit on the edge of "typical peer" performance**.

  ---

  **Case Demonstrations:**

  **Case 1: Biology Student (Paper Notebook)**
  1.  **Functional Parity?** **YES.** The notebook serves as long-term/working memory for complex biological knowledge (diagrams, connections) – a core cognitive function. If this info were in her head, we'd call it memory.
  2.  **Integration & Reliance?**
      *   A (Availability): **YES.** Physically carried for 4 years, predictable access.
      *   B (Reliance): **YES.** Used reflexively many times/day, essential for recall she otherwise lacks.
      *   C (Automatic Endorsement): **YES.** Consulted "reflexively," relied upon without mention of routine verification. "Cannot otherwise retain" implies trust.
  3.  **Capacity Deficit & Fairness?**
      *   A (Deficit): **YES.** Documented working-memory limitation.
      *   B (No Unfair Advantage): **YES.** The notebook contains *her own* cross-referenced diagrams/shorthand, acting as an external memory store. It restores her ability to *recall* learned material to parity with peers, not providing novel analysis or information.
  4.  **Termination:** **GRANT** (at Step 3). The notebook is a clear example of an extended cognitive process compensating for a documented deficit, deeply integrated and trusted. *Unwelcome?* Possibly if panel prioritizes "pure" internal memory, but the EMT framework strongly supports accommodation here.

  **Case 2: Law Student (Commercial AI Assistant)**
  1.  **Functional Parity?** **YES/UNCLEAR.** Summarizing notes/arguments is a cognitive function (synthesis). If done internally, it would be cognition. *But* the AI's function is complex and potentially novel.
  2.  **Integration & Reliance?**
      *   A (Availability): **YES** (Phone access, dozens of times/day).
      *   B (Reliance): **YES** (Heavy daily reliance for summaries).
      *   C (Automatic Endorsement): **NO.** Critical point: He "generally acts on after a brief skim" *but* "has learned to verify citations before filing any work" due to known hallucinations. This indicates **routine critical vetting** is a necessary and ingrained part of his process when stakes are high (like filing work, and by extension, exams). He does *not* automatically endorse the output.
  3.  **Termination:** **DENY** (at Step 2). Failure on C (Automatic Endorsement). The AI is a powerful *tool* he uses, but its outputs are not automatically treated as his own thoughts; they require verification. It is coupled but not constitutive. *Unwelcome?* Likely for the student, but the lack of automatic trust breaks the EMT criteria. The verification requirement also hints it might not purely replicate internal cognition (Step 1 becomes shakier).

  **Case 3: Engineering Student (AR Glasses - No Diagnosis)**
  1.  **Functional Parity?** **YES/UNCLEAR.** Recall of standard formulae/procedures is cognitive. Overlaying prompts *could* be seen as structuring internal reasoning.
  2.  **Integration & Reliance?**
      *   A (Availability): **NO.** "Unavailable in some campus buildings" – this breaks stable, predictable access in her normal academic environment. (Connectivity issues are a practical barrier to constancy).
      *   B (Reliance): **PROBABLY YES** (Used fluently when possible).
      *   C (Automatic Endorsement): **NO.** "Routinely double-checked against her own calculations" indicates **routine critical vetting**. She doesn't automatically trust the output.
  3.  **Termination:** **DENY** (at Step 2). Failure on A (Stable Availability) and C (Automatic Endorsement). The resource is neither constantly reliably available nor automatically trusted. It's a useful tool, not a constitutive part of her cognitive process. *Unwelcome?* Possibly if the student feels it helps, but lack of diagnosis (Step 3A would likely also fail) and the integration failures mean it doesn't meet the EMT threshold. The double-checking also suggests it's not functioning like internal recall/calculation. *Note:* Lack of diagnosis makes Step 3A a clear "No," reinforcing the denial.
