      - *Motivation:* The literature sometimes blurs these. For example, in St. Petersburg, the expected value is infinite, but no one pays a fortune to play. The solution might assign a finite value to the prospect (for ranking) but then the price to enter might be determined by the agent's wealth and utility function. This distinction is crucial for the specification because the system is about ranking, not necessarily about pricing.
