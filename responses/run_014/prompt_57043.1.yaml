     - *Motivation:* The system must produce a decision when the agent cannot decline. Therefore, for any two prospects that are not disqualified, we must have a strict or weak ordering. This rules out theories that leave some comparisons undefined without disqualifying one or both.
     - *Non-negotiable?* Yes, because without a determinate ranking, the system fails to guide action in the required cases.

  2. **Dominance (Non-Negotiable):** If prospect A pays at least as much as prospect B in every possible state of the world and strictly more in at least one state with positive probability, then A must be ranked at least as high as B, and strictly higher if the strict improvement occurs in an outcome that is not assigned probability zero by the theory.
     - *Motivation:* This is a fundamental principle of rationality. Without it, an agent could choose a prospect that is strictly worse in every possible outcome. Prospect 4 dominates prospect 3, so any theory that ranks 4 below 3 or fails to rank them violates this.
     - *Non-negotiable?* Yes, widely accepted as a minimal requirement.

  3. **Finiteness (Negotiable, but necessary for bounded agents):** The theory must produce a finite value for every prospect it does not disqualify. The valuation must be a real number (or extended real but finite) for the purpose of ranking.
     - *Motivation:* A bounded agent cannot use an infinite value for ranking because it would lead to indifference between all prospects with infinite value or to intransitivities. Moreover, in real-world decisions, we require finite numbers to compare. This rules out theories that assign infinity to the classic St. Petersburg (prospect 1) unless they disqualify it.
     - *Non-negotiable?* This is a commitment of bounded utility and truncation approaches. However, some theories (like growth-rate maximization) might assign a finite value without disqualification. We require at least that the value be finite for ranking.

