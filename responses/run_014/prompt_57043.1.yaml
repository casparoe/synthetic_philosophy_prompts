  We are drafting a set of desiderata for a theory of choice under unbounded payoffs that must rank the given prospects. The aim is to have requirements that any candidate decision rule must satisfy to solve the St. Petersburg problem in a way that a bounded agent can use when forced to decide.

  The prospects:
  1. Classic St. Petersburg: payoff = $2^{n-1}$ for first heads on toss n. Expectation diverges (each term = 1/2).
  2. Payoff = $2^{n-1}/n$. Expectation diverges (scaled harmonic series).
  3. Pasadena game: payoff = (-1)^{n-1} * 2^n / n dollars. The expectation is conditionally convergent (alternating harmonic series) and can be rearranged to any real number.
  4. Modified Pasadena: same as 3, but if heads on first toss, pays $3 (instead of $2). This prospect is at least as good as prospect 3 in every outcome and strictly better in one.
  5. A Pascal's mugging type: a single outcome with a payoff so large and probability so small that the agent cannot compute the product, but the proposer can always name a pair (payoff and probability) that exceeds any bound.

  We must address:

  a) Distinctions that must be kept: e.g., value of a prospect vs. price to enter it.
  b) Whether the output "no determinate value" is admissible. If so, we must know if that gap is acceptable.

  Also, should the theory explain what real agents pay? Or is that beside the point?

  Finally, identify any conflicts in the desiderata and which desideratum is the most eliminative.

