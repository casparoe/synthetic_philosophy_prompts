          - Use a random number generator for each pair on the spot: the facilitator uses a phone app to generate a random bit for each pair, records it, and then proceeds.

          - Time estimate: 
               - Setup: 5 minutes.
               - Round 1: 
                   - Flip and record for 7 pairs: 5 minutes? (if using an app, it's fast)
                   - Ask Tails students: 7 students * 1 minute = 7 minutes.
                   - Reveal and enforce: 7 minutes? (if tails and they said yes, they do jumping jacks, which takes 30 seconds per student, but we can do them simultaneously? but candy distribution takes time)

               Total for Round 1: 5+5+7+7=24 minutes.

               Round 2: 
                   - Public precommitment: 5 minutes (each pair announces).
                   - Flip and record: 5 minutes.
                   - Ask Tails students privately: 7 minutes.
                   - Reveal and enforce: 7 minutes.

               Total for Round 2: 24 minutes.

               Debrief: 40 minutes? But we have 90 minutes total: 24+24=48, plus debrief 40 -> 88 minutes. That's tight.

          - Alternatively, we can run the rounds with only a few pairs as volunteers? But that might not engage everyone.

          - Or, we can do one round per class? But we want both rounds.

          - We might skip the enforcement of the cost until the end? But that breaks the flow.

     Given time constraints, we might do:

          - Round 1: 
               - Flip for all pairs at once (but different coins): use an app to generate 7 random bits quickly.
               - Then ask all Tails students at once (they write their answer on a piece of paper and hand it in).
               - Then reveal the outcome for each pair (by the facilitator going to each pair and telling them) and enforce.

          - Round 2: 
               - Public precommitment: each Tails student announces to the class.
               - Flip 7 coins (again, with app) and record.
               - Tails students write their private decision on paper and hand in.
               - Reveal outcomes and enforce.

     This might be faster.

     Let's design accordingly.

     Final structure:

       Materials:
          - Coin flip simulator (phone app or computer) or prepared sealed envelopes for each pair (but that's a lot of prep).
          - Candy for rewards.
          - Paper for recording.

       Steps:

          Introduction (without theory): "Today we're going to play a game in pairs. Each pair has a 'Heads' and a 'Tails' player. I will flip a coin for your pair. The Tails player will be asked a question. Depending on the coin flip and the answer, there might be a reward for the Heads player or a task for the Tails player."

          Round 1:

            1. Assign pairs and roles (2 minutes).
            2. Flip a coin for each pair using the app (record the outcome for each pair) (3 minutes).
            3. Call up all Tails students to the front. Privately ask each one: "If the coin for your pair is tails, will you do 10 jumping jacks? If the coin is tails and you say yes, you must do them. If you say no, you don't. If the coin is heads, you don't have to do anything, but the Heads player in your pair gets a candy if you said yes." (They answer privately to you, record.) (5 minutes)
            4. Send them back. Then, for each pair, reveal the outcome:
                  - If heads: 
                      - Tell the pair: "Heads! Tails player, you don't have to do anything. Heads player, you get candy if your Tails player said yes." [If they said yes, give candy; else, not.]
                  - If tails:
                      - Tell the pair: "Tails! Tails player, if you said yes, please do 10 jumping jacks now. Heads player, you get nothing." (If they said no, then Tails player does nothing.) (5-7 minutes)

          Round 2:

            1. Same pairs and roles.
            2. Ask each Tails student to publicly announce to the class: "If the coin is tails, I will [do/not do] the jumping jacks." Record on board. (3 minutes)
            3. Flip coins again for each pair (record) (3 minutes).
            4. Call up Tails students again and ask the same private question as in Round 1. (5 minutes)
            5. Reveal outcomes and enforce as in Round 1. (5-7 minutes)

          Then debrief (30 minutes).

     We must be efficient.

     Debrief outline:

       1. What happened? 
          - In Round 1, how many Tails players said yes? (Count the records.) How many in Round 2 private decision?
          - How many changed from their public precommitment in Round 2?

       2. Map to counterfactual mugging: 
          - Explain the thought experiment.
          - In the thought experiment, if the coin is tails, the agent pays $100 and gets nothing. If the coin is heads, the agent gets $10,000 only if they would have paid in the counterfactual tails world.
          - In our game, the cost was jumping jacks and the reward was candy.

       3. Objection: 
          - "In the real case, the other branch doesn't exist. So why should the agent in the tails branch pay? In our game, the Heads player is a real person, so maybe the Tails player paid out of altruism or because of side deals. In the standard case, there is no one to be altruistic towards because it's the same person? But wait, the agent in the tails branch is the same as in the heads branch, so they should care about their heads counterpart."

       4. Discuss: 
          - Why did some Tails players pay? 
          - Why did some not?
          - Did any of you make side deals? (If yes, discuss: if the agent in the heads branch could transfer utility to the tails branch, would that change the decision? In the single agent case, it's the same utility function, so it's like transferring to oneself.)

       5. Follow-on: 
          - Is refusing to pay a mistake? 
          - Or is it rational? 
          - What would causal decision theory say? (It would say: in the tails branch, paying doesn't cause any benefit for the agent in the tails branch, so don't pay. But then in the heads branch, they don't get the reward.) 
          - What about evidential decision theory? (It might say: paying is evidence that the coin is tails? but in our setup, the coin flip is independent, so paying doesn't provide evidence about the coin. But in the standard counterfactual mugging, the mugger is a predictor, so if the agent is the type that pays, then the mugger would have predicted that and given the reward in the heads world. But in our game, we don't have a predictor.) 
          - Actually, our game is not about prediction but about the logical dependence: the reward in the heads world is conditional on the action in the tails world. This is more like a transparent box in Newcomb's problem.

          We might avoid diving too deep into decision theories if they haven't covered them yet.

       6. Moralizing: 
          - If a student in the Tails role refused to pay, can the Heads student blame them? 
          - Is there a moral obligation to pay? 
          - Or is it just a rational decision?

       7. Precommitment: 
          - Did precommitment help? In Round 2, did more Tails players pay? 
          - Why might precommitment change behavior? (Because it makes the Tails player feel committed, or because the pair can coordinate for the greater good of the pair.)

     This should fill 90 minutes.

     Note: The cost and reward should be such that the expected utility of saying "yes" is positive for the pair if they are a team? 
          - Probability tails: 0.5 -> cost to Tails player: let's say the cost is -C.
          - Probability heads: 0.5 -> reward to Heads player: +R.
          - But the pair's expected utility: 0.5 * (if tails: -C) + 0.5 * (if heads: +R) = 0.5*(-C) + 0.5*R.
          - They should say yes if R > C.

     In our case, R is a candy bar and C is 10 jumping jacks. We assume the candy bar is worth more than half the cost of the jumping jacks? But the cost is borne by one and the reward by the other. Without side payments, it might not be worth it for the Tails player.

     We might set R to be high enough. Maybe give two candy bars so the Tails player can get one if they want to share? But we don't control that.

     Alternatively, we can frame it as a team effort: the pair is a single agent, so they should maximize the joint outcome.

     We'll go with the values we have and see.

     Let's run it!
answer: |-
  Below is a comprehensive design for an in-class counterfactual mugging game tailored to your requirements. The game uses non-monetary stakes, pairs students to represent "branch-selves," includes a precommitment round, and addresses the philosophical nuances you specified. Total runtime fits within 90 minutes.

  ---

  ### **Game Design: Counterfactual Mugging with Paired Branches**
  **Objective:** Make students intuitively grasp the tension between causal and counterfactual reasoning without prior theory exposure.  
  **Stakes:**  
  - **Reward:** Chocolate bar (or alternative treat) for the "winning" branch.  
  - **Cost:** Mildly effortful task (e.g., 10 push-ups, writing a whimsical haiku on the board, or standing on one foot for 60 seconds).  

  ---

  ### **Setup (5 minutes)**
  1. **Pair Formation:**  
     - Divide 14 students into 7 pairs.  
     - Randomly assign roles: **Player H** (heads branch) and **Player T** (tails branch).  
     - Emphasize: *"You collectively represent one agent. Player H is the ‘you’ if a coin lands heads; Player T is the ‘you’ if it lands tails."*  

  2. **Coin Randomization:**  
     - Use a public random number generator (e.g., random.org) to pre-generate 14 coin flips (7 for Round 1, 7 for Round 2) before class. Seal results in envelopes labeled by pair number.  
     - **Why this works:** Students see randomization is verifiable and cannot suspect facilitator bias.  

  ---

  ### **Round 1: Baseline (25 minutes)**  
  *(Students experience the dilemma without precommitment.)*  
  1. **Facilitator Instructions:**  
     - *"I’ve pre-flipped a coin for your pair. I’ll reveal it after Player T makes a choice."*  
     - **To Player T:** *"If the coin is tails, you must decide whether to ‘pay’ (do the task). If you pay, Player H gets a reward if the coin is heads. If you refuse, Player H gets nothing. If the coin is heads, nothing happens to you regardless."*  
     - **To Player H:** *"You get a reward only if (a) the coin is heads, and (b) Player T agreed to pay."*  

  2. **Decision:**  
     - Player T answers **"Pay"** or **"Refuse"** *privately* (write on paper).  
     - Facilitator reveals the coin result (open envelope).  
     - **Enforce outcomes:**  
       - **Heads:** Player H gets a reward if Player T chose "Pay."  
       - **Tails:** Player T does the task if they chose "Pay"; no reward for anyone.  

  ---

  ### **Round 2: Precommitment (25 minutes)**  
  *(Adds public commitment to test coherence.)*  
  1. **Precommitment Phase:**  
     - Pairs discuss strategy for 3 minutes.  
     - Each Player T **publicly announces** their choice (e.g., *"I will pay if tails!"*) to the class.  

  2. **Gameplay:**  
     - Repeat Round 1 with a new coin flip (new envelope).  
     - Player T submits a *private* decision (which may differ from their public pledge).  
     - Reveal coin and enforce outcomes.  

  ---

  ### **Debrief (35 minutes)**  
  **Goals:** Connect gameplay to decision theory, dissect intuitions, and confront objections.  

  #### **Step 1: Map to Standard Counterfactual Mugging (10 minutes)**  
  - Reveal the game mirrors **counterfactual mugging**:  
    > *"An agent faces a coin flip. If tails, a mugger asks for $1,000. If the agent pays, the mugger rewards them with $10,000 in the* ***counterfactual*** *heads world. But if the coin is tails, paying costs $1,000 with no direct gain."*  
  - Highlight parallels:  
    - **Player T** = the agent in the tails branch.  
    - **Player H** = the agent in the heads branch (who benefits only if Player T pays).  
    - The "mugger" is the facilitator enforcing the rules.  

  #### **Step 2: Confront the Pairing Objection (15 minutes)**  
  - **Objection:** *"Pairing branches destroys the thought experiment! In reality, the ‘other you’ doesn’t exist to confront you."*  
  - **Discussion Questions:**  
    1. *"Did Player T feel responsible for Player H? Why or why not?"*  
       - Expected: Altruism, social pressure, or side deals (see "predictable failures").  
    2. *"In the real counterfactual mugging, the ‘heads you’ never exists. Does Player H’s physical presence here distort intuitions?"*  
       - Key insight: Paired version elicits **altruism/reciprocity** (helping a peer) or **self-interest** (via side deals). The unpaired case relies on **self-consistency across branches** (e.g., "I should care about my counterfactual self").  
    3. *"Should intuitions transfer? Is the paired version a fair analogy?"*  
       - Argue: Pairing makes counterfactuals tangible but may overemphasize social dynamics. The core dilemma remains: **Do you invest in a branch that benefits you only if you’re not in it?**  

  #### **Step 3: Moral Standing & Rationality (10 minutes)**  
  - **Poll students:** *"Is refusing to pay…*  
    - *(A) A mistake?*  
    - *(B) A legitimate self-locating choice?*  
    - *(C) Rational without precommitment?"*  
  - **Discussion:**  
    - **Precommitment’s role:** Players who switched to "Pay" in Round 2 likely recognized **commitment as Pareto-optimal** (benefits the pair if heads occurs).  
    - **Moralizing refusal:**  
      - *"Can Player H blame Player T for refusing?"* → Only if they see branches as a unified agent.  
      - *"Is refusing ‘rational’?"* → In causal decision theory, **yes** (Player T gains nothing in tails). In evidential/UDT, **no** (fails to maximize expected value across branches).  
    - **Core tension:** Refusal is locally rational (for Player T) but globally suboptimal (for the "agent" across branches).  

  ---

  ### **Predictable Failures & Mitigation**  
  1. **Side payments between branches (e.g., Player H bribes Player T):**  
     - **Why it’s interesting:** Replicates "same-agent" dynamics (the heads and tails selves "share utility").  
     - **Handling:** Allow it! Debrief: *"Did side deals make paying feel rational? In the real case, your ‘branches’ are the same person – so it’s like a forced side payment to yourself!"*  

  2. **Player T dismisses the cost:**  
     - **Mitigation:** Choose a cost that’s mildly inconvenient (e.g., push-ups) but not trivial.  

  3. **Distrust in randomization:**  
     - **Mitigation:** Use a verifiable public RNG and show envelopes are sealed.  

  4. **Role confusion:**  
     - **Mitigation:** Start with a dry run using a sample pair.  

  5. **Time overruns:**  
     - **Mitigation:** Use a timer for discussions; pre-generate flips.  

  ---

  ### **Why This Works**  
  - **No lecture first:** Students *feel* the dilemma via stakes and peer dynamics.  
  - **Structural novelty:** Pairing makes abstract counterfactuals visceral.  
  - **Debrief depth:** Objections are baked into the design, forcing reflection on whether social intuitions map to solitary agents.  
  - **Precommitment round:** Reveals how commitment resolves temporal inconsistency (à la Kavka’s toxin puzzle).  

  This setup ensures students confront the "two-branch tension" experientially before dissecting it theoretically, priming deeper engagement with decision theory’s hardest cases.
