prompt: |-
  Hey, I need your help thinking something through. You're a professional philosopher who specializes in population ethics and value theory, so please really lean into that. Think carefully before you answer, and feel free to brainstorm out loud a bit first before locking anything in.

  Background: I'm a software engineer, no philosophy training beyond half-reading a Wikipedia page. But I ran into the "repugnant conclusion" thing (the Parfit one, where you end up having to say a gigantic population of people whose lives are barely worth living is better than a smaller happy one) and it broke my brain a little. I went looking for "the right theory" and found out there are like a dozen of them (total utilitarianism, average views, critical-level views, person-affecting views, lexical views...) and every single one seems to make somebody furious. So before I waste my life reading papers defending each one, I want to work backwards: what should a theory of "which population is better" actually have to deliver before it's even worth considering? Basically I want a spec. Like, if I were writing acceptance tests for a theory, what are the tests?

  So write me the desiderata list. For each requirement: state it, then give the case or consideration that motivates it (a lot of these will be little thought experiments with two populations A and B -- that's fine, but keep them concrete, like "10 billion at 8/10 quality of life vs 10^15 at 0.001/10"). And importantly, tell me which requirements are genuinely non-negotiable and which are just the pet obsession of one camp. I genuinely don't know, so don't hedge -- if you think, say, the intuition behind the repugnant conclusion itself is just a bug in human psychology that a good theory should override, say that.

  A few things I specifically want in the list, because I keep going back and forth on whether they belong:

  1. Transitivity -- if A is better than B and B is better than C, A has to be better than C. As an engineer this feels like table stakes to me, but is it? I've heard some people bite weird bullets here.
  2. Something like "adding people with lives worth living, without making anyone worse off, shouldn't make things worse" -- a coworker of mine says any theory that denies this is insane, but I've also read that accepting it plus a couple of other innocuous-looking things *forces* the repugnant conclusion. Is that actually a proven thing or just internet lore? If the desiderata are jointly unsatisfiable, I want to know which ones to drop, that's honestly the part I care about most.
  3. Whether "better" has to mean better *for* anyone. Like, if no individual person exists in both population A and population B, in what sense is one "better"? Is a theory that just refuses to compare them copping out or being honest?

  Also flag any pair of desiderata you suspect can't be satisfied together. Then, briefly -- like a paragraph max, don't turn this into a literature review -- say how total utilitarianism and average utilitarianism do against your list, so I can see the list actually being used to reject something.

  One more constraint: no reading lists, no citations, no "see Parfit 1984". I want the ideas, not the bibliography. And don't assume I know jargon -- if you use a term like "person-affecting" or "lexical threshold", explain it in plain words on first use. Take your time and get the requirements right; the scoring bit is an afterthought.
