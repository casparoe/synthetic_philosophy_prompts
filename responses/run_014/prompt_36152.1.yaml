  First, I need to understand their pain points. They're frustrated by contradictory theories and wants to know which intuitive principles are truly non-negotiable versus debatable. Specifically, they're torn about transitivity, the "adding good lives" principle, and whether "better" requires identifiable beneficiaries. Their engineering mindset shines through - they're treating this like system design with tradeoffs and hard constraints.

  Hmm... the challenge is balancing philosophical rigor with their no-jargon request. I should start by identifying the bedrock principles every theory agrees on (like avoiding sadism) before moving to contested areas. The transitivity question is tricky - while it seems obvious, some philosophers (like Temkin) challenge it. But for a "spec," it's probably safer to list it as standard with a footnote about dissent.

  The "adding good lives" principle is where things get spicy. They've heard it leads to the repugnant conclusion - which is true under certain formalizations (Ng's theorem). I should clarify that while the basic Pareto-style version is near-universal, stronger formulations (like unrestricted addition) do cause problems. This deserves a clear "jointly unsatisfiable" warning.

  For the "better for whom?" dilemma... that's the deepest cut. Person-affecting views have intuitive pull but face the "non-identity problem." I'll need to present both sides neutrally while noting that most theories accept impersonal value - but flag it as philosophically contentious.

  *scribbles mental outline* 
  Non-negotiables first: non-sadism, Pareto, transitivity (with caveat). Then the shakier desiderata: avoidance of repugnance, critical levels, person-affecting constraints. Must highlight conflicts - especially between "adding good lives" and "avoiding repugnance" since that's the core tension. 

  For the utilitarian examples, I'll show how total util embraces repugnance to satisfy additivity, while average util avoids repugnance but violates Pareto and critical levels. That'll demonstrate the spec in action. 

  Key is to avoid academic tangents. No citations, explain terms like "lexical threshold" concretely (e.g., "pain must be below X before counting pleasure"). And absolutely no hedging - if I think avoidance of repugnance is negotiable (which I do), say so bluntly. 

  *checks unspoken needs* 
  They're clearly overwhelmed by the multiplicity of theories. Underneath the "spec" request is a desire for decision boundaries: "What can I safely ignore?" So the conflict analysis is crucial. Also, their engineering brain wants a "modular" understanding - hence splitting desiderata into must-have/should-have. 

  Final note: that "no one benefits" point needs special care. It's not just academic - it challenges the very possibility of their project. I'll position it as a fundamental fork in the road rather than a solvable problem. Some theories bite the bullet here; others don't. Both are valid design choices. 

  Okay, structure locked in: bedrock principles → common-but-negotiable goals → known conflicts → quick theory scoring. Time to write.
answer: |-
  Here's your population ethics "spec" – the core desiderata any theory must handle, sorted by priority and conflict potential. I've flagged non-negotiables and tensions based on philosophical consensus and your concerns.

  ---

  ### **The Core Spec: Desiderata for Population Ethics**

  1.  **Non-Sadism (Non-Negotiable)**
      *   **Requirement:** Adding a person with a *positive quality of life* shouldn't make the outcome *worse* than adding a person with a *negative quality of life* (all else equal).
      *   **Motivation:** `Population A`: 100 people at +5 (good lives). `Population B`: 100 people at +5 *plus* one person at -10 (severe suffering). `Population C`: 100 people at +5 *plus* one person at +1 (barely positive). *Rejecting this means B > C, which is absurd. B is clearly worse than C.*
      *   **Status:** Universally accepted. Denial is indefensible.

  2.  **Weak Pareto (Non-Negotiable)**
      *   **Requirement:** If at least one person is better off in A than in B, and *no one is worse off*, then A is better than B. (Applies only when the *same people* exist in both populations).
      *   **Motivation:** `Population A`: 10 billion people at 8/10. `Population B`: The *same* 10 billion people at 9/10. *B is obviously better than A.*
      *   **Status:** Bedrock principle. Rejection implies making someone better off without harming others could be bad – nonsensical.

  3.  **Transitivity (Standard, But Contested Edges)**
      *   **Requirement:** If A > B and B > C, then A > C.
      *   **Motivation:** `Population A`: Small, extremely happy (10 people at 10/10). `Population B`: Large, very happy (1 billion at 9/10). `Population C`: Vast, barely positive (10^20 at 0.001/10). If A > B and B > C, consistency demands A > C. *Engineering logic is sound here; non-transitivity makes ranking incoherent.*
      *   **Status:** Widely considered essential for rational choice. Some theories (e.g., Temkin's) explore *why* intuitions might *feel* intransitive in extreme cases, but denying transitivity outright is a major cost.

  4.  **Avoidance of the Extreme Repugnant Conclusion (Common but Negotiable)**
      *   **Requirement:** A world with a vast population of lives *barely worth living* should not be considered *better* than a world with a much smaller population of *very* happy lives.
      *   **Motivation:** `Population A`: 10 billion people flourishing at 9/10. `Population Z`: 10^15 people at 0.001/10 (lives barely positive, devoid of significant joy or meaning). *Intuition screams A is better than Z, despite Z having a larger total sum of wellbeing.*
      *   **Status:** The core intuition driving the search beyond Total Utilitarianism. *But*, some argue this intuition is flawed (e.g., we underestimate large numbers). Rejecting this is the cost Total Utilitarianism pays.

  5.  **Asymmetry (Person-Affecting Intuition - Common but Negotiable)**
      *   **Requirement:** There's a crucial difference between *creating* new people and *harming* existing people. We have strong reasons *not to create* people with lives *not worth living* (negative wellbeing), but we don't necessarily have strong reasons *to create* people with lives *worth living* (positive wellbeing).
      *   **Motivation:** `Choice 1`: Create a person guaranteed to suffer terribly (-10). *We shouldn't do this.* `Choice 2`: *Not* create a person who *would* have had a happy life (+10). *Failing to create them isn't clearly wrong in the same way; there's no existing person harmed.*
      *   **Status:** Captures a deep intuition about obligations to potential vs. actual people. Pure Total Utilitarianism often violates this (creating masses of barely-positive lives becomes obligatory). Denied by theories prioritizing total sum.

  6.  **Critical Level (Potentially Negotiable)**
      *   **Requirement:** Adding a person only improves the world if their wellbeing exceeds some *threshold* above "barely worth living" (say, 4/10 instead of 0.001/10).
      *   **Motivation:** Avoids the Repugnant Conclusion by setting a bar. `Population A`: 1 billion at 8/10. `Population B`: 2 billion at 3/10 (above "barely positive" but below critical level). *A Critical Level theory might say A is better than B, even though B has more people and a positive total sum.*
      *   **Status:** A popular *solution* to the Repugnant Conclusion. It relaxes strict "adding good lives is always good".

  7.  **Non-Elitism / Mere Addition (Contested)**
      *   **Requirement:** Adding people with lives worth living (above zero), *without harming existing people*, should not make the world *worse*. (This is the stronger version your coworker likes).
      *   **Motivation:** `Population A`: 10 billion at 8/10. `Population A+`: Same 10 billion at 8/10 *plus* 1 billion new people at 0.001/10. *Intuition: A+ isn't worse than A; it's just different. We added positive lives.*
      *   **Status:** This is the *engine* that drives the Repugnant Conclusion. **Crucially, accepting Mere Addition PLUS Transitivity PLUS Non-Anti-Egalitarianism (another common intuition) *logically forces* the Repugnant Conclusion under standard assumptions.** Denying Mere Addition is how Critical Level and Average Views avoid it. Your coworker's "insane" claim is *very* debatable; many serious theories reject Mere Addition.

  8.  **"Better For Whom?" (The Deep Problem - Potentially Unresolvable)**
      *   **Requirement:** Should "A is better than B" imply A is better *for* some specific person(s), especially when the populations are different?
      *   **Motivation:** Compare `Population A` (Small, Happy) and `Population Z` (Vast, Barely Positive). *No one in A exists in Z, and vice-versa. Who benefits from A being chosen over Z?* Theories that refuse to compare different populations ("Incommensurability") avoid this but seem like a cop-out. Theories that compare impersonally ("The world is better") accept that "better" might not mean "better *for* anyone specific."
      *   **Status:** The fundamental challenge of population ethics. Most theories (except strict "Person-Affecting" views) accept impersonal value judgments. Denying comparability is radical but avoids many paradoxes.

  ---

  ### **Key Conflicts in the Spec**

  1.  **Mere Addition (#7) + Avoid Repugnance (#4) + Transitivity (#3) = IMPOSSIBLE (Ng's Theorem).** You *must* drop one. Total Utilitarianism drops Avoid Repugnance. Critical-Level and Average drop Mere Addition. Some drop Transitivity (rare).
  2.  **Strong Mere Addition (#7) + Asymmetry (#5) = Tension.** Mere Addition implies strong reason to add positive lives. Asymmetry says we lack strong reason to add them. Critical-Level (#6) tries to bridge this.
  3.  **Total Wellbeing Focus + Avoid Repugnance (#4) = Conflict.** This is the core of the Repugnant Conclusion itself.

  ---

  ### **Quick Scoring of Major Theories**

  *   **Total Utilitarianism (TU): Maximize total wellbeing sum.**
      *   **Passes:** 1 (Non-Sadism), 2 (Weak Pareto), 3 (Transitivity), 7 (Mere Addition - strongly!).
      *   **Fails:** 4 (Embraces Repugnant Conclusion: Z > A), 5 (Violates Asymmetry: Obligation to create positive lives), 6 (No critical level).
      *   **Cost:** Repugnant Conclusion is a feature, not a bug. "Better" is impersonal (#8).

  *   **Average Utilitarianism (AU): Maximize average wellbeing per person.**
      *   **Passes:** 1 (Non-Sadism), 2 (Weak Pareto), 4 (Avoids Repugnance: A > Z easily).
      *   **Fails:** 3 (Can violate Transitivity in some cases), 5 & 7 (Violates Mere Addition & Asymmetry intuition: Adding happy people to an unhappy world lowers the average, making it "worse". Adding barely-positive people to a happy world lowers average, also "worse"). Often implies "Hell Conclusion" (small miserable population better than large mediocre one).
      *   **Cost:** Highly counterintuitive results regarding adding people and small populations. "Better" is impersonal (#8).

  ---

  **The Takeaway:** There's no free lunch. Your "spec" reveals inherent tensions. **Non-Sadism and Weak Pareto are non-negotiable. Transitivity is near-universal.** The core battle is between **Avoiding the Repugnant Conclusion** and **Mere Addition** (and its implications for asymmetry/person-affecting). **The "better for whom?" question is foundational.** Choose your poison based on which bullet you're most willing to bite. Totalism bites the repugnant one; Averagism bites the mere addition one; Critical-Level tries to find a middle ground.
