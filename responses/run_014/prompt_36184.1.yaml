prompt: |-
  Over the past few months I've been keeping a running list of situations where one person's small contribution to some large shared harm strikes me as wrong, and situations with what looks like the exact same structure that strike me as fine, and I've come to suspect my own judgments don't add up. I want to know whether there is a principle behind them or whether my gut is just favoring people I imagine as friends and disliking people I imagine as strangers. Here are my cases with my honest reactions to each.

  1. A man eats meat at every meal and, when challenged, says his individual purchases can't affect the number of animals raised, because farms adjust production in batches and one customer more or less changes nothing. I'm confident he's doing something wrong, and I'm confident the excuse is bogus — even though I suspect it's arithmetically true.
  2. A woman flies overseas for her best friend's wedding, emitting more carbon in one trip than the meat-eater produces in a year of meals. I think she did nothing wrong, or almost nothing. But I notice I can't say why the "my one flight changes nothing" excuse works for her when the parallel excuse failed in case 1.
  3. An election is decided by thousands of votes, so any one ballot has essentially no chance of being decisive. I still think a citizen who stays home out of plain indifference (not protest, not illness, not a scheduling accident) has done something wrong — a small wrong, but a wrong, not merely a missed opportunity.
  4. A park is already carpeted with litter, and one more dropped cup would make no visible difference to it. My gut says the person who drops the cup is doing something wrong, full stop, and the "it's already trashed" excuse gets no traction with me whatsoever.
  5. The same park has a corner of lawn worn completely bald by everyone cutting across it, and one more footstep makes no difference to the bare patch. My gut says walking across is fine — it barely registers as wrong at all. Yet structurally I can't see how it differs from the cup.
  6. A thousand people each throw one stone and a shop window shatters; no single stone was necessary, and any hundred of them would have sufficed. I think every thrower bears part of the responsibility for the window. I'd hold to that even if we learned the window had been cracked already.
  7. Someone buys the cheapest jeans from a company that runs dreadful factories. I think this is regrettable but not wrong, or at most negligibly wrong — though I'd be hard pressed to explain what separates it from the meat case, which I called wrong without hesitation.
  8. A town's reservoir is low, and one household's lawn watering makes no measurable difference to the level. Here I genuinely flip back and forth: some days the watering seems clearly wrong, other days it seems no worse than the jeans.

  I've tried to build a principle myself, and I have two candidates, both of which keep failing on me. The first: it's wrong when your bit is part of something a group is doing together and you'd be coasting on other people's restraint. That one fits the voter, the cup, and the stone, and it explains why the wedding flyer is off the hook (nobody was relying on her restraint). But then it also condemns the lawn-crosser, whom I want to let off, and I can't see what it says about the meat or the jeans. The second: it's wrong when the practice would be collectively disastrous if everyone did it. That gets the meat-eater, and maybe the lawn-watering. But then it swallows the wedding flight too, since universal tourism would be as bad as universal meat, and I refuse to treat that woman as a wrongdoer.

  So my questions are these. Is there a principle, or a small set of principles, that captures all or nearly all of these verdicts, with each clause motivated by a specific case above? Please test any principle you propose not only against my eight cases but against ones I haven't listed — for instance, a stadium wave that only works if enough people stand, a workplace where everyone takes a pen from the supply cupboard, and a country where so many people under-report small amounts of tax that the treasury has stopped auditing them. And if my verdicts can't all be saved, tell me plainly which ones have to go: I'd rather overturn two of my own reactions than keep them all at the price of a principle with so many epicycles that it can't tell me anything about the ninth case. I'd especially like to hear where you land on cases 4 and 5, and on my wavering case 8, since those seem to be where my intuitions are pulling in opposite directions.
reasoning: |-
  Hmm, the user is presenting a fascinating ethical puzzle about collective action problems and individual responsibility. They've identified eight cases where their moral intuition seems inconsistent - sometimes condemning minor contributions to collective harms, other times excusing them. The core struggle is between arithmetic reality (one person's action makes no difference) and moral intuition (it still feels wrong).

  Looking at their cases, I notice some patterns emerging. Cases where harm feels "direct" (stoning the window, littering) trigger strong condemnation, while "mediated" harms (buying jeans from unethical factories) feel less wrong. There's also a distinction between harms that feel cumulative (meat consumption) versus substitutive (the wedding flight replacing another passenger). 

  The park examples are particularly illuminating - littering feels wrong but cutting across grass doesn't, even though both involve minor contributions to visible damage. This suggests the perception of "ruining" versus "using" matters. The water shortage case shows how context affects judgment - during drought, individual actions feel more significant.

  For the meat vs flight comparison, the key difference might be substitutability: planes fly with empty seats anyway, but meat production directly responds to demand. The voter case introduces threshold dynamics - while one vote rarely matters, the collective action is binary (win/lose) making participation feel obligatory.

  The challenge is finding principles that explain all these nuances without becoming ad hoc. The "no harm" defense fails for cases like littering where harm exists but isn't attributable. "Universalization" works for meat but not flights. "Benefiting from restraint" explains voting but not jeans purchases.

  Perhaps we need a multi-factor approach considering: 1) the harm's severity and certainty, 2) whether the action directly causes harm or merely enables it, 3) the existence of collective solutions, 4) the cost of abstention to the individual, and 5) whether the harm involves "taking" versus "using."

  The wedding flight gets excused because it's a rare, meaningful event with high personal cost to avoid, while meat consumption is habitual with easy alternatives. Littering is condemned because it's gratuitous damage with zero cost to refrain, unlike walking on grass which serves a purpose (shortcut).

  For the wavering lawn-watering case, the judgment likely depends on how dire the water shortage is perceived. In moderate shortages, individual actions feel insignificant; in crisis, every drop counts psychologically.

  Ultimately, some intuitions might need revising - perhaps the jeans purchase should be seen as more problematic, or the lawn-crossing as slightly more culpable. But the patterns in their reactions reveal deeper moral truths about how humans perceive causation and responsibility in complex systems.
answer: |-
  Your struggle reveals a deep tension in collective action ethics, but your intuitions aren't arbitrary—they reflect nuanced principles that can be systematized. After analyzing your cases against established ethical frameworks and testing new principles, I propose a **Three-Pronged Framework** that explains nearly all your judgments without epicycles. The core insight: *Not all collective harms are morally equivalent; context transforms the meaning of individual acts.*

  ### The Framework (with Motivations from Your Cases)
  1. **The Directness & Avoidability Test:**  
     Is the harm *directly caused* by the physical act itself, and could it be easily avoided without significant cost?  
     - *Motivated by:* Littering (Case 4), Stone-throwing (Case 6). Dropping a cup *directly* creates waste; throwing a stone *directly* contributes to destruction. Avoiding these acts costs nothing.  
     - *Explains:* Why lawn-crossing (Case 5) feels less wrong: the harm (grass wear) is indirect and cumulative. Your footstep doesn’t *create* baldness; it *uses* an existing path. Avoidance might require a detour (small cost).

  2. **The Scalability & Threshold Test:**  
     Does the practice cause harm *regardless of scale* (e.g., pollution), or does harm only manifest *beyond a critical threshold* (e.g., election outcomes)? Does your act reliably contribute to crossing that threshold?  
     - *Motivated by:* Meat-eating (Case 1), Voting (Case 3), Reservoir (Case 8). Meat demand scales linearly with purchases (no threshold; each unit causes harm). Voting has a decisive threshold; while *your* vote likely doesn’t cross it, participation sustains the system *and* you benefit if others vote.  
     - *Explains:* Your flip-flop on lawn-watering (Case 8). In moderate droughts, water use feels below a harm threshold ("no measurable difference"). In severe shortages, the threshold feels breached, making individual acts salient. The wedding flight (Case 2) has high emissions, but air travel operates on fixed schedules; her seat likely doesn't change the flight’s operation (below threshold). Universal tourism *would* be catastrophic, but *her act* doesn’t scale the industry.

  3. **The Complicity & Alternatives Test:**  
     Are you *enabling* unjust systems by creating demand for harmful products/services *when feasible alternatives exist*? Does your restraint "free-ride" on others’ sacrifices?  
     - *Motivated by:* Cheap jeans (Case 7), Meat-eating (Case 1). Buying unethical jeans directly funds exploitation, and ethical alternatives exist (even if inconvenient). Meat-eating supports factory farming; plant-based options are accessible.  
     - *Explains:* Why the wedding flight (Case 2) is excused: No feasible alternative (swimming?), and skipping her best friend’s wedding is a high personal cost. Her act isn’t free-riding on climate restraint—air travel isn’t a collective action system like voting or conservation.

  ---

  ### Verdicts on Your Cases
  | Case | Your Judgment | Framework’s Verdict | Principle Applied |
  |------|---------------|----------------------|-------------------|
  | 1. Meat-eating | Wrong | **Wrong** | Scalability (linear harm) + Complicity (alternatives exist) |
  | 2. Wedding flight | Not wrong | **Not wrong** | Threshold (seat likely unfilled) + Alternatives (high cost to avoid) |
  | 3. Not voting | Wrong | **Wrong** | Threshold (system relies on participation; free-riding on voters) |
  | 4. Littering | Wrong | **Wrong** | Directness (creates waste) + Avoidability (zero cost to not litter) |
  | 5. Lawn-crossing | Not wrong | **Mostly not wrong** | Directness (uses path, doesn’t create damage) – *But if grass is recovering, avoidable* |
  | 6. Stone-throwing | Wrong | **Wrong** | Directness (contributes to destruction) + Avoidability (no cost to refrain) |
  | 7. Unethical jeans | Not wrong | **Weakly wrong** | Complicity (funds harm) – *But judgment depends on alternative accessibility* |
  | 8. Lawn-watering | Flips | **Context-dependent** | Threshold (wrong if reservoir below critical level; neutral if not) |

  ### Resolving Your Tensions
  - **Cases 4 vs. 5 (Park):** Littering *adds* new harm; lawn-crossing *uses* existing infrastructure. Directness + Avoidability explains the difference. If the path were roped off for regrowth, crossing becomes wrong (avoidable harm).  
  - **Case 8 (Water):** Your flip is rational! The wrongness hinges on whether the reservoir is below a viability threshold. If it’s at 40% capacity? Likely not wrong. At 5%? Clearly wrong.  
  - **Case 7 (Jeans):** Your "not wrong" verdict is the weakest. If ethical jeans are accessible, it’s complicit (like meat). If they’re unaffordable or unavailable, it shifts toward "not wrong."  

  ### Testing New Cases
  - **Stadium Wave:** Not standing is **not wrong** if the wave happens without you (threshold passed). But if it fails *and* you could see empty seats near you, it’s weakly wrong (free-riding on others’ effort).  
  - **Office Pens:** Taking a pen is **not wrong** if the supply is unlimited. If pens are scarce, it’s wrong (depletes shared resource; avoidable).  
  - **Under-reporting Tax:** **Wrong** if audits stopped *because* of widespread cheating (free-riding on honesty). If audits stopped for other reasons (e.g., budget cuts), it’s less clear but still complicit in systemic harm.  

  ### Which Intuitions Should Go?
  Your framework is salvageable except for **Case 7 (Jeans)** and **Case 5 (Lawn-crossing)** under specific conditions:  
  - **Revise Jeans (Case 7):** Buying unethical products *is* meaningfully wrong if alternatives exist. Your hesitation might stem from perceiving fashion as a "need" (like food), but unlike meat, jeans don’t require animal suffering—ethical options exist.  
  - **Refine Lawn-Crossing (Case 5):** While usually harmless, it *becomes* wrong if the path is recovering or your action encourages others onto fragile ground.  

  ### Why This Works
  This framework avoids "universalization" pitfalls (explaining why flights ≠ meat) and "restraint coasting" oversimplifications (explaining water use vs. littering). It accepts that ethics must account for:  
  - **Causal structure** (direct vs. threshold harms),  
  - **Feasibility** (cost of alternatives),  
  - **System dynamics** (is your act marginal or decisive?).  

  Your gut isn’t arbitrary—it’s weighing these factors subconsciously. The wedding flyer isn’t "like" the meat-eater because air travel’s fixed schedules decouple individual demand from immediate harm, while meat purchases directly scale slaughter. The litterer isn’t "like" the lawn-crosser because one introduces new damage; the other doesn’t. By making these distinctions explicit, your intuitions cohere into a defensible ethical system.
