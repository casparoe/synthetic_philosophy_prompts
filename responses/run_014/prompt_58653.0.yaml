answer: |-
  The moral "dirt" in politics arises not from the justified act itself, but from bypassing the democratic process and acting without the public's implicit or explicit mandate, even when the act is necessary.

  **Version A (Likely "Dirty"):** Facing a severe drought, Mayor Chen secretly diverted a small but critical percentage of residential water to maintain pressure for the hospital and fire department, knowing public panic over rationing might cause hoarding and make things worse. She publicly attributed the pressure drop to aging pipes. The diversion worked, preventing a hospital crisis and major fire hazard. Her motive was solely to protect essential services. Months later, when the truth leaked, residents felt betrayed by the deception, demanding her resignation despite the positive outcome.

  **Version B (Likely "Clean"):** Facing a severe drought, Mayor Chen held emergency public forums, laying out data showing imminent risk to hospital water pressure and firefighting capacity. She proposed a small, temporary diversion from residential supply as the only viable short-term fix, explaining the risk of panic hoarding if announced mid-crisis. After heated debate, a majority of attendees endorsed the plan. She implemented it as discussed, publicly citing "emergency infrastructure measures." The diversion worked, preventing a hospital crisis and major fire hazard. Her motive was solely to protect essential services. When details emerged later, the public largely accepted it as a tough but necessary action they had approved.

  **The Split:** In both cases, the act (secret diversion), outcome (essential services protected), and motive (protecting public safety) are identical. The "dirt" stains Mayor Chen only in Version A. The key difference is **prior democratic authorization and transparency**. Version B secured public buy-in *before* acting, making the tough choice a shared responsibility. Version A involved deception and unilateral action, violating the social contract of representative democracy. The mayor took the burden of the decision entirely upon herself, acting *for* the people but not *with* their consent. This lack of mandate is the source of the perceived stain.

  **The Critical Detail & What Breaks:** The crucial detail is **whether the public was informed and gave consent *before* the action**. If you remove the public forums and consent in Version B, it becomes identical to Version A and the mayor gets stained. If you add prior consent/debate to Version A, the "dirt" largely disappears. Dropping this detail collapses the distinction.

  **The "Dirty Hands is Nonsense" Pushback:** A skeptic would argue: "The act was objectively necessary and justified in both cases. Mayor Chen did her job. Any 'stain' in Version A is irrational public outrage or media hype, not a genuine moral failing. The obligation is to achieve the best outcome, not follow bureaucratic process during an emergency. If saving the hospital required deception, so be it – that's leadership, not dirt. The 'dirt' concept confuses political fallout with morality." They deny that bypassing democracy for a necessary good creates a distinct moral burden beyond the act's justification.
