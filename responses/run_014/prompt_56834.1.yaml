  ### Decision Tree for Biological Information in Genetics

  **Instructions for Use:**  
  Answer each question based on concrete biological cases discussed in the seminar, not by invoking predefined positions. Choose one branch per node. The tree uses binary branching to avoid overcomplication. Labels for leaves include a view name (or "unnamed"), a core claim, the fixed-point case it handles worst, and one awkward commitment.

  1. **Do variant genetic codes (e.g., in ciliates and mitochondria) demonstrate that codon-amino acid mappings are arbitrary—i.e., not fixed by chemical necessity and alterable without loss of function?**  
     - *Branch Claim:* Mappings are arbitrary and conventional.  
     - **Yes** → Proceed to 2.  
     - *Branch Claim:* Mappings are not arbitrary; they reflect chemical or physical constraints.  
     - **No** → Proceed to 6.  

  2. **Does cell-free translation (synthetic mRNA yielding expected polypeptide with purified components) show the genetic code operates independently of cellular or organismal context?**  
     - *Branch Claim:* The code is context-independent; no higher-level organization is needed.  
     - **Yes** → Proceed to 3.  
     - *Branch Claim:* The code requires cellular/organismal context to function meaningfully.  
     - **No** → Proceed to 4.  

  3. **Do synonymous substitutions that alter translational efficiency, co-translational folding, or splicing imply the genome carries semantic content beyond the amino acid sequence (e.g., about phenotypic outcomes)?**  
     - *Branch Claim:* Genome content extends to downstream effects on the phenotype.  
     - **Yes** → **Leaf G: Extended Literalism**  
       - Core claim: The genome literally encodes information about both the polypeptide and broader phenotypic traits of the organism.  
       - Handles worst: Maternal cytoplasmic determinants (genome alone cannot fix body plan).  
       - Awkward commitment: Must reconcile that context (e.g., recoding, editing) can override DNA-specified outcomes.  
     - *Branch Claim:* Genome content is semantically exhausted at translation; no downstream implications.  
     - **No** → **Leaf A: Literal Code (Restricted)**  
       - Core claim: The genetic code is literal due to arbitrary codon assignments read by molecular machinery, but semantic content stops at the polypeptide.  
       - Handles worst: Maternal cytoplasmic determinants (genome insufficient for body plan).  
       - Awkward commitment: Cannot accommodate synonymous substitutions as informational if they affect phenotype non-metaphorically.  

  4. **Is the semantic content of the genome (if any) grounded in the selection history of the organism, rather than solely in molecular features?**  
     - *Branch Claim:* Content depends on evolutionary history.  
     - **Yes** → **Leaf B: Teleosemantic**  
       - Core claim: Genuine semantic content arises from the selection history of coding systems, not arbitrariness.  
       - Handles worst: Cell-free translation (no selection history present).  
       - Awkward commitment: Variant codes are arbitrary, but content is historical—creating tension.  
     - *Branch Claim:* Content does not require selection history.  
     - **No** → **Leaf C: Systemic Information (Whole System)**  
       - Core claim: Information is real but borne by the entire developing system, with DNA contributing no more than other factors.  
       - Handles worst: Cell-free translation (DNA + machinery produces polypeptides without a "system").  
       - Awkward commitment: Must explain why DNA is routinely singled out in informational talk.  

  6. **Does horizontal gene transfer (functional gene in new host) imply the genome is a privileged causal factor for the phenotype compared to other inherited resources?**  
     - *Branch Claim:* Genome is privileged; it independently specifies outcomes.  
     - **Yes** → Proceed to 7.  
     - *Branch Claim:* Genome is not privileged; it is one resource among many.  
     - **No** → **Leaf F: Parity**  
       - Core claim: The genome is one inherited resource, with no unique causal or informational role.  
       - Handles worst: Horizontal gene transfer (DNA functions across contexts).  
       - Awkward commitment: Cell-free translation shows DNA suffices for polypeptides, undermining parity.  

  7. **Does cell-free translation reduce the genome's role to purely chemical causation (e.g., template-based), with no residual "information" beyond physics?**  
     - *Branch Claim:* Informational talk is eliminable; only chemistry matters.  
     - **Yes** → **Leaf D: Deflationary**  
       - Core claim: Informational language is metaphorical; DNA is a chemical template/cause, nothing more.  
       - Handles worst: Cell-free translation (appears to exemplify a code).  
       - Awkward commitment: Must dismiss variant codes as mere chemical variability, not arbitrariness.  
     - *Branch Claim:* Genome has a non-chemical, difference-making role.  
     - **No** → **Leaf E: Causal Difference-Maker**  
       - Core claim: Genes are not content-carriers but the primary difference-making causes for phenotypes in investigated contexts.  
       - Handles worst: Synonymous substitutions (non-coding changes alter phenotypes).  
       - Awkward commitment: Denies semantic content even when DNA sequences are "decoded" systematically.  

  ---

  ### Tree Analysis

  **Indistinguishable Pairs and Separation Questions:**  
  - **Leaf A (Literal Code Restricted) and Leaf G (Extended Literalism)** are separable at Node 3. No indistinguishable pairs in this tree; all leaves are distinct given the answers.  
  - **Unseparated by Tree but Distinguishable:** If two views answered identically (e.g., both **No** at Node 1 and **Yes** at Node 6), they would be indistinguishable. However, no such views exist in the seminar material. To separate hypothetical cases, ask: *Does programmed frameshifting or overlapping reading frames imply that "meaning" is context-dependent rather than DNA-specified?* (Yes for Systemic Information; No for Literal/Teleosemantic views).  

  **Empty Cells (Permitted but Unoccupied):**  
  - **Node 6 → No → Node 8?** (Not shown; after **No** at Node 6): If someone denies DNA privilege (Node 6 **No**) but also rejects parity (e.g., via Node 8: *Do maternal determinants make the genome irrelevant?* → **No**).  
    - **Empty?** Yes.  
    - **Reason:** Unattractive—it claims the genome is non-privileged yet not on par, contradicting evidence like horizontal transfer.  
  - **Node 3 → Yes** (Leaf G) and **Node 4 → No** (Leaf C) are occupied. Candidate views were checked:  
    - **Literal Code with No Downstream Content (Leaf A)** exists (handles cell-free robustly).  
    - **Systemic Information (Leaf C)** exists.  

  **Convenor's View:**  
  - Located at **Leaf A (Literal Code Restricted)**, as it asserts literal coding strictly for nucleic acid → polypeptide, with no organism-level content.  
  - **Cell-Free Translation:** This view survives the case comfortably, as cell-free translation exemplifies the literal coding relation without requiring an organism.  

  **Order Bias:**  
  - Starting with arbitrariness (Node 1) biases toward **Leaf A (Literal Code Restricted)**, making it reachable earlier than deserved given its struggles with maternal determinants.  
  - **Alternative Ordering:** Begin with DNA privilege (Node 6 first). Effects:  
    - **Leaf F (Parity)** and **Leaf E (Causal Difference-Maker)** become reachable earlier.  
    - **Leaf A (Literal Code Restricted)** shifts "later" (after Nodes 6 and 1), better reflecting its weaknesses.  
    - **Leaves Changing Position:** Leaf A moves from early to mid-tree; Leaf F and Leaf E move from late to early.  

