  ### Reading Group Protocol  
  Run the tree collaboratively: Each participant answers nodes aloud, citing biological cases to justify choices, without naming positions. The facilitator records answers and guides the group to a leaf. At Node 3 (synonymous substitutions) and Node 4 (selection history), explicitly warn that branches reflect contested interpretive choices (e.g., "information beyond translation" vs. "exhausted by translation") not settled facts. Conclude by mapping leaves to views, using disagreements to spark revision discussion.
