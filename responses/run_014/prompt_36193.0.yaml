prompt: |-
  So heres the situation: I'm a philosophy of science PhD student about a year into an "embedded" placement with an interpretability team at an ML lab (long story, basically my advisor got a grant for philosophy-in-the-wild placements and I drew the short straw, or maybe the long one). My actual job, roughly, is to help the team decide when they're licensed to say "the network represents X" — truth, sentiment, the board state, whatever — versus having to write the weaker "we found a feature that tracks X in the settings we tested." Right now there's no shared standard. Some folks on the team are basically realists (if a probe can read it out, it's represented), others are deflationists (it's all convenient bookkeeping and "representation" talk is a metaphor we should just drop), and paper drafts and external comms flip between the two dependng on who wrote them. That inconsistency is what I'm trying to fix.

  You're a philosopher of science who also knows the ML literature. Take the realism/instrumentalism debate seriously but make it usable — I want the conceptual mapping somewhat explicit (what plays the role of novel prediction, what corresponds to robustness across retraining runs, maybe the structural realist thought that what survives is the structure, not the object, since "the model has a truth *direction*" might be exactly the kind of claim where the subspace is real and the human concept isn't). But the deliverable has to be a procedure, not an essay. Think carefully and do a bit of brainstorming before writing, please.

  Constraints: a mixed panel of two engineers and me runs it in under an hour per claim, and none of us have patience for seminar-level nuance, so it needs to be an ordered checklist — the questions to ask about a claim, what counts as a sufficient answer at each step, where the procedure terminates in "downgrade the claim," and where it punts to a human because the remaining question is about values rather than facts (e.g. how much overclaiming risk the lab should accept in public messaging — that's not something a checklist can settle, and I want it to visibly say so).

  Then run it on three claims, since worked examples are how the team will actually learn it: (1) a linear probe for sentiment where the probe classifies beautifully but ablating the direction barely changes anything downstream; (2) the claim that a model trained on chess- or Othello-type play represents the board state, based on probes plus interventions that change its predicted moves the way the interpretation says they should; (3) the safety pitch that the model "represents deception" — I suspect the procedure will downgrade that one and the comms team will hate it, which is exactly why I want it included, so be honest about the result. Also tell me plainly what the procedure *can't* do: I'm guessing it can't settle anything when the evidence is genuinely underdetermined, and I worry that once the checklist circulates internally people will Goodhart it (tweaking experiments to pass the rubric rather than to find out what's going on). One page of actual checklist, the rest can be explanation. Thx!
reasoning: |-
  We are designing a checklist to determine when a team is licensed to claim "the network represents X" versus the weaker "we found a feature that tracks X in the settings we tested." The checklist must be practical, taking under an hour per claim, and must be in the form of an ordered list of questions. It should account for philosophical considerations (realism vs. instrumentalism) but be actionable.

  Key philosophical considerations to operationalize:
  - Novel prediction: In science, a theory is more credible if it predicts new phenomena. In interpretability, this might correspond to the ability to predict the model's behavior in novel situations (not used in training the probe or in the original training data).
  - Robustness: How stable is the representation across retraining runs, architectural variations, or different datasets? Structural realism might suggest that what survives (e.g., the existence of a direction, or a subspace) is real, even if the exact instantiation varies.
  - Interventionist criteria: If we intervene on the representation (e.g., by activating or ablating it) and observe the expected downstream changes, that supports the representation claim.
  - Deflationary concerns: We must avoid overclaiming. The checklist should downgrade the claim if the evidence only shows correlation in tested settings without counterfactual robustness or predictive power.

  We'll design a step-by-step procedure that asks questions and at each step either:
  - Proceeds to the next question.
  - Downgrades the claim (i.e., says we must use the weaker formulation).
  - Punts to a human (for value-laden decisions, such as risk tolerance).

  The checklist should have clear pass/fail criteria at each step.

  Proposed Checklist Steps:

  1. **Feature Existence and Basic Tracking**: 
     - Question: Have we identified a feature (e.g., a direction, a neuron, a set of neurons) that reliably tracks X in the tested settings? 
     - Criteria: The feature must have a high enough performance (e.g., accuracy, AUROC) in predicting X on a held-out test set that was not used for training the probe or any model tuning. 
     - If fail: Downgrade to "we found a feature that tracks X in the settings we tested" and stop. There's no basis for a representation claim without even basic tracking.
     - If pass: Proceed.

  2. **Robustness to Model Variation** (structural realism consideration):
     - Question: Is the feature robust across different retrainings of the model (with different seeds) or across similar model architectures? 
     - Criteria: We must have tested in at least 2-3 retrained models (or architectures) and found the feature in each, with performance above a threshold (e.g., within 10% of the original performance). 
     - If fail: Downgrade to "we found a feature that tracks X in the settings we tested for this specific model" and stop. The feature is not stable enough to be considered a representation.
     - If pass: Proceed.

  3. **Counterfactual Validity via Intervention** (novel prediction and interventionist criterion):
     - Question: Does intervening on the feature (e.g., ablating it, activating it) produce the expected changes in the model's behavior in a way that aligns with the representation of X? 
     - Criteria: We must have conducted interventions and observed that the model's behavior changes as predicted by the representation hypothesis (e.g., if we change the sentiment direction, the sentiment of the output changes; if we change the board state, the moves change accordingly). The interventions must be in settings that are novel (not used in training) and the effect must be statistically significant.
     - If fail: Downgrade to "we found a feature that tracks X, but interventions do not support a causal role for X in the model's behavior" and stop. Without causal evidence, it's just tracking.
     - If pass: Proceed.

  4. **Generalization to Novel Contexts** (novel prediction):
     - Question: Does the feature predict or control the model's behavior in contexts that are significantly different from the training data (or the data used to train the probe)? 
     - Criteria: We must test the feature on data that is out-of-distribution (OOD) in a meaningful way (e.g., new domains, adversarial examples, or settings designed to break the probe) and the feature must still track X and/or the interventions must still work. The OOD performance should not drop more than a pre-specified threshold (e.g., 20% absolute drop in performance) and the interventions must still show the expected effects.
     - If fail: Downgrade to "we found a feature that tracks X in the tested settings and interventions work in those settings, but it does not generalize beyond them" and stop. The representation might be context-bound.
     - If pass: Proceed.

  5. **Causal Adequacy** (ensuring the representation is doing the work):
     - Question: Is the feature causally involved in the model's output? Specifically, if we ablate the feature, does the model's performance on tasks that rely on X degrade? And conversely, if we artificially activate the feature, does the model's behavior change appropriately even in the absence of the usual inputs? 
     - Criteria: Ablation must cause degradation on tasks that require X (but not necessarily on unrelated tasks). Activation must produce the expected behavior without the usual inputs (e.g., by directly setting the feature value). 
     - If fail: Downgrade to "we found a feature that tracks X and interventions can affect behavior, but the feature is not causally necessary for the model's performance on X-related tasks" and stop. The representation might be epiphenomenal.
     - If pass: Proceed to step 6.

  6. **Risk Assessment and Value Judgment** (punt to human):
     - Question: Given the evidence, what level of claim is justified? This step is not a test but a deliberation point. The checklist has passed all the evidential steps, so the claim "the network represents X" is supported. However, the team must consider:
        - The stakes of overclaiming (e.g., in safety-critical contexts, we might require more evidence).
        - The potential for misuse of the claim.
     - Action: The panel must discuss and decide. The checklist cannot settle this because it involves values. The panel might decide to use the strong claim, or in high-stakes situations, they might still use a weaker one.

  At the end of the checklist, if all steps 1-5 are passed, then the claim "the network represents X" is supported by the evidence. However, step 6 acknowledges that the final decision might be tempered by non-evidential factors.

  Now, we run the checklist on the three examples:

  **Example 1: Sentiment Probe (linear probe works, but ablation doesn't change downstream behavior)**

  1. **Feature Existence**: Pass. The probe classifies sentiment well.
  2. **Robustness to Model Variation**: (Assume we have not tested this, so we might fail at step 2. But for the sake of example, let's assume it passes.) 
  3. **Counterfactual Validity**: Here we ablate the direction and see no downstream change. This fails because the intervention did not produce the expected change (the model's sentiment-related behavior didn't degrade). 
     - Result: Downgrade to "we found a feature that tracks X, but interventions do not support a causal role" and stop.

  **Example 2: Board State Representation (probes plus interventions that change moves appropriately)**

  1. **Feature Existence**: Pass. Probes for board state work.
  2. **Robustness to Model Variation**: (Assume tested on multiple retrainings and it holds.) Pass.
  3. **Counterfactual Validity**: Pass. Interventions change the predicted moves as expected.
  4. **Generalization to Novel Contexts**: (We must test on board states not seen during training or probe training.) Assume they tested on novel game positions and the interventions still worked. Pass.
  5. **Causal Adequacy**: Ablation of the board state feature degrades the model's move prediction? And activation without the input produces the expected move? (Assume both are true.) Pass.
  6. **Risk Assessment**: The panel discusses. Since board state is not safety-critical in this context, they might go with the strong claim.

  **Example 3: "Represents Deception"**

  1. **Feature Existence**: We assume they found a feature that tracks when the model is being deceptive (e.g., in tested scenarios). Pass? (We'll assume they have some probe that works in tested settings.)
  2. **Robustness to Model Variation**: (Unclear, but we'll assume it passes for the sake of argument.)
  3. **Counterfactual Validity**: They intervene to activate the "deception" feature. Does the model then produce deceptive outputs? And when they ablate it, does the model stop being deceptive? This is tricky because deception is complex and context-dependent. Moreover, it might be hard to get reliable labels for deception. We might not have clear evidence. Let's say they have some interventions but only in limited settings. The evidence is weak. Fail.
     - If they pass step 3, then:
  4. **Generalization to Novel Contexts**: They test in OOD settings? Deception in a new domain? Probably hard and not done. Fail.
  5. **Causal Adequacy**: They might not have done the ablation/activation tests in a way that clearly shows causation. Likely fail.

  Even if we are generous and assume they pass steps 1-3, step 4 (generalization) is likely to fail because deception is a high-level, context-dependent concept that might not generalize. The checklist will likely downgrade the claim at step 4 or 3.

  What the procedure can't do:
  - It cannot resolve underdetermination: when the evidence is equally consistent with multiple interpretations, the checklist might pass a step but that doesn't mean the representation is the only explanation.
  - It is vulnerable to Goodharting: if the team designs experiments to pass the checklist without genuinely probing the representation, the results might be gamed. To mitigate, we rely on the panel's judgment and the requirement for novelty (e.g., in step 4, the OOD tests must be truly novel and not cherry-picked).
  - It cannot settle value-laden questions: step 6 explicitly punts to the panel.

  Now, we write the checklist in a concise, one-page format.

  ---

  **Checklist for Claim: "The network represents X"**

  **Purpose**: To determine if the evidence supports the strong claim "the network represents X" or requires a weaker claim.

  **Procedure**: Answer the following questions in order. Stop and downgrade the claim if any step fails. If all steps 1-5 pass, proceed to step 6 for a risk assessment.

  1. **Feature Existence and Basic Tracking**  
     Question: Have we identified a feature (e.g., direction, neuron) that reliably tracks X in a held-out test set?  
     Criteria: Performance metric (e.g., accuracy, AUROC) must be above [threshold, e.g., 0.9 AUROC] on a held-out test set not used for probe training or model tuning.  
     - Pass: Proceed to 2.  
     - Fail: Downgrade to "we found a feature that tracks X in the settings we tested" and stop.

  2. **Robustness to Model Variation**  
     Question: Is the feature robust across retrainings or similar architectures?  
     Criteria: Tested on at least 2 retrained models or architectures; performance remains within [threshold, e.g., 10%] of original.  
     - Pass: Proceed to 3.  
     - Fail: Downgrade to "we found a feature that tracks X in the settings we tested for this specific model" and stop.

  3. **Counterfactual Validity via Intervention**  
     Question: Do interventions on the feature (ablation/activation) produce expected changes in model behavior?  
     Criteria: Interventions must:  
        - Be in novel settings (not used in training).  
        - Show statistically significant effects aligned with X.  
     - Pass: Proceed to 4.  
     - Fail: Downgrade to "we found a feature that tracks X, but interventions do not support a causal role" and stop.

  4. **Generalization to Novel Contexts**  
     Question: Does the feature work in significantly different contexts?  
     Criteria: Tested on OOD data (e.g., new domains, adversarial examples); performance drop <= [threshold, e.g., 20%] and interventions still work.  
     - Pass: Proceed to 5.  
     - Fail: Downgrade to "we found a feature that tracks X in tested settings and interventions work there, but not beyond" and stop.

  5. **Causal Adequacy**  
     Question: Is the feature causally necessary for the model's performance on X-related tasks?  
     Criteria:  
        - Ablation: Degrades performance on tasks requiring X.  
        - Activation: Produces X-appropriate behavior without usual inputs.  
     - Pass: Proceed to 6.  
     - Fail: Downgrade to "we found a feature that tracks X and interventions affect behavior, but it is not causally necessary" and stop.

  6. **Risk Assessment and Value Judgment**  
     Question: Given the evidence, is the risk of overclaiming acceptable for the context?  
     Note: This step involves non-evidential considerations (stakes, potential misuse). The panel must decide.  
     - Outcome:  
        - If acceptable: Use "the network represents X".  
        - If unacceptable: Use a weaker claim despite passing 1-5.  
     - The checklist does not determine this step; it requires panel discussion.

  ---

  **Worked Examples**:

  1. **Sentiment Probe**  
     - Step 1: Pass (good probe performance).  
     - Step 2: Assume pass.  
     - Step 3: Fail (ablation doesn't change downstream). Downgrade and stop.

  2. **Board State Representation**  
     - Step 1: Pass.  
     - Step 2: Pass (robust across retrainings).  
     - Step 3: Pass (interventions change moves as expected).  
     - Step 4: Pass (tested on novel board positions).  
     - Step 5: Pass (ablation degrades move prediction, activation sets the board).  
     - Step 6: Panel decides to use strong claim (low stakes).

  3. **"Represents Deception"**  
     - Step 1: Pass (assume tracking in tested scenarios).  
     - Step 2: Assume pass.  
     - Step 3: Likely fail (interventions are weak or not clear). If passed, then:  
     - Step 4: Likely fail (OOD tests not done or failed).  
     - Step 5: Likely fail (causal adequacy not shown).  
     - Overall: Downgraded at step 3, 4, or 5.

  **Limitations of the Procedure**:
  - Cannot resolve underdetermination (multiple interpretations of the same evidence).
  - Vulnerable to Goodharting (gaming the tests to pass the checklist without genuine understanding).
  - Does not cover all philosophical nuances (e.g., the exact nature of representation).
  - Step 6 requires human judgment about risks and values.

  By following this checklist, the team can have a consistent and evidence-based approach to representation claims.
answer: |-
  ### Representation Claim Assessment Protocol (v1.0)  
  **Purpose**: Systematically evaluate claims of the form "the network represents X" to reduce inconsistency.  
  **Output**: One of:  
  - ✅ **Strong claim licensed** ("represents X")  
  - ⚠️ **Downgraded claim** (specify weaker phrasing)  
  - ❓ **Punt to panel** (for non-empirical judgment)  

  **Procedure**: *Answer sequentially. Stop at first failure or punt.*  
  1. **Basic Tracking**  
     - *Question*: Does a clearly defined feature (e.g., direction, neuron set) track X with high performance in *held-out* test settings?  
     - *Pass*: Metric (e.g., AUROC, accuracy) ≥ threshold (e.g., ≥0.90) on data *not used for probe training/model tuning*.  
     - *Fail*: ⚠️ Downgrade to *"We found a feature tracking X in tested settings."*  

  2. **Robustness**  
     - *Question*: Does the feature persist under model variation?  
     - *Pass*: Feature performance remains stable (e.g., <15% drop) across ≥2 retrainings *or* architectures.  
     - *Fail*: ⚠️ Downgrade to *"We found a model-specific feature tracking X."*  

  3. **Intervention Validity**  
     - *Question*: Do interventions (ablation/activation) alter model behavior *as predicted by X* in *novel* tasks?  
     - *Pass*: Statistically significant effect (e.g., p<0.01) on X-dependent outputs (e.g., sentiment affects ratings; board state affects moves).  
     - *Fail*: ⚠️ Downgrade to *"We found a feature tracking X, but without causal behavioral impact."*  

  4. **Generalization**  
     - *Question*: Does the feature predict/control behavior in *out-of-distribution* (OOD) contexts?  
     - *Pass*: Performance drop ≤20% in adversarial/domain-shifted settings *and* interventions remain effective.  
     - *Fail*: ⚠️ Downgrade to *"We found a feature tracking X in tested + OOD settings, but context-bound."*  

  5. **Causal Necessity**  
     - *Question*: Is the feature *necessary* for task performance?  
     - *Pass*: Ablation degrades X-related tasks (e.g., accuracy drop ≥25%) *without* harming unrelated tasks.  
     - *Fail*: ⚠️ Downgrade to *"We found a feature correlated with X, but not causally necessary."*  

  6. **Risk-Value Judgment** (❓ Punt to panel)  
     - *Question*: Given the evidence, is "represents X" justified *despite remaining uncertainty*?  
     - *Criteria*: Non-empirical. Panel must weigh:  
       - Stakes of overclaiming (e.g., safety implications)  
       - Potential misuse of strong language  
       - Team’s risk tolerance  
     - *Outcome*: Panel chooses ✅ or ⚠️ (e.g., "tracks X" if high-stakes).  

  ---

  ### Worked Examples  
  **Claim 1: "Represents sentiment" (linear probe good, ablation ineffective)**  
  - Step 1: Pass (high probe accuracy).  
  - Step 2: Pass (robust across retrainings).  
  - Step 3: **Fail** (ablation doesn’t alter sentiment output).  
    → ⚠️ Downgrade: *"We found a feature tracking sentiment in tested settings, but without causal behavioral impact."*  

  **Claim 2: "Represents board state" (probes + move interventions)**  
  - Step 1: Pass (probe accuracy high).  
  - Step 2: Pass (robust across seeds/architectures).  
  - Step 3: Pass (interventions change moves predictably).  
  - Step 4: Pass (generalizes to unseen board states).  
  - Step 5: Pass (ablation degrades move quality).  
  - Step 6: ❓ Punt to panel. Low stakes → ✅ **"Represents board state."**  

  **Claim 3: "Represents deception" (safety pitch)**  
  - Step 1: Pass (probe detects deception in test cases).  
  - Step 2: **Fail** (feature inconsistent across retrainings).  
    → ⚠️ Downgrade: *"We found a model-specific feature tracking deception in tested settings."*  
    *(Note: Even if Step 2 passed, Step 4/5 would likely fail due to concept fragility and lack of causal necessity evidence.)*  

  ---

  ### What This Protocol *Can’t* Do  
  1. **Resolve underdetermination**: If evidence equally supports multiple interpretations (e.g., "represents deception" vs. "represents careful phrasing"), the checklist cannot arbitrate.  
  2. **Prevent Goodharting**: Teams may optimize experiments to "pass" steps without deeper understanding (e.g., cherry-picking OOD tests). Mitigation: Require adversarial input in Step 4.  
  3. **Define "X" philosophically**: It assumes X is operationally defined (e.g., "sentiment" as human-labeled valence). Disputes about X’s nature (e.g., "Is *truth* a human concept?") are punted to Step 6.  
  4. **Cover all representation types**: Best for discrete, probe-friendly features (e.g., board states). Poor for distributed, dynamic, or emergent representations.  

  **Rationale**: Balances structural realism (prioritizing robust, intervention-supported features) with deflationism (demoting claims without causal-generalizable evidence). Steps 3–5 operationalize "novel prediction" via interventions and OOD tests.  

  ---  
  *Deliverable: 1-page checklist + examples. Panel runs it in 45-60 mins/claim.*
