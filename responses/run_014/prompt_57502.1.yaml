prompt: |-
  I want a spec before I read another defense of karma. Set the purpose: the theory has to work as a genuine account of moral desert — the kind of thing you could actually run a ethics of praise, blame and punishment on — not as an edifying story a tradition tells itself. So: lay out everything such an account has to deliver. The phenomena it has to explain, the cases it has to get the right verdict on, the distinctions it can't collapse, the constraints it can't violate.

  For each item, give me the case that motivates it, and mark whether it's non-negotiable or really just a taste of one camp. Then the part I care about most: tell me which subset of the list can't all be satisfied at once. My hunch is that (a) not blaming the victim for what they're suffering, (b) actually explaining why the undeserved stuff lands where it does, and (c) leaving the agent able to keep track of where they stand, are in tension — sort that out, and tell me which single requirement knocks out the most otherwise attractive theories.

  Two things to build in explicitly: whether there's any room for amnesty in the picture at all — forgiveness, expiation, wiping the slate — or whether a theory that makes room for those has quietly stopped being a theory of desert; and whether karma is being run as a law-of-nature affair or as a cosmic bookkeeping one with recorders and judges, since I think those give different verdicts on the Gyges-style case of the man who does awful things in perfect secrecy and dies prosperous and unrepentant.

  Close with a short scorecard, three lines max, for the hard cross-lifetime retributive view, the secularized character-formation reading, and whatever hybrid tries to have both. No citations, I'll track the literature down myself.
reasoning: |-
  Okay, the user wants a detailed specification for a karma theory that functions as a genuine moral desert system, not just an edifying story. Let me start by understanding their main requirements. They mentioned three key tensions: not blaming the victim, explaining why undeserved suffering happens, and allowing agents to track their moral standing. 

  First, I need to outline the necessary components such a theory must deliver. The user emphasized phenomena like moral luck, victim suffering, and distinctions between moral and non-moral harms. Each requirement must be motivated by a case and marked as negotiable or not. For example, the Gyges case challenges secrecy and perfect justice, which seems non-negotiable.

  The user also wants to identify conflicting requirements. The tension between (a), (b), and (c) is crucial. Not blaming victims might conflict with explaining undeserved suffering if karma attributes current hardships to past actions. Plus, if karma spans lifetimes, tracking moral standing becomes impossible without memory, violating epistemic accessibility.

  Amnesty and forgiveness need consideration. If karma allows wiping the slate clean, does that undermine desert? Also, the mechanism—natural law vs. cosmic bookkeeping—affects outcomes, like in the Gyges case where secret wrongdoers might escape punishment.

  Finally, the scorecard. Hard retributive karma satisfies desert but fails on victim blaming and tracking. Character-formation focuses on growth but may not address desert. Hybrids try both but struggle with contradictions. The key conflict is Non-Victim-Blaming clashing with Continuity and Explanatory Power, making it the biggest hurdle.
answer: |-
  Here’s the spec for a desert-based karma theory, built to your requirements:

  ### Core Purpose
  A theory of **moral desert** justifying praise/blame/punishment across lifetimes, grounded in agent-actions, not cosmic poetry.

  ---

  ### Requirements & Motivating Cases (Non-Negotiables Marked **\***)
  1.  **\*Non-Victim-Blaming:** Cannot imply a starving child *deserves* starvation due to past misdeeds.  
      *Case:* Infant born into famine, dies painfully. Theory must *not* assign desert for this suffering to the infant.  
  2.  **\*Explanatory Power:** Must explain *why* specific suffering/fortune occurs, not just label it "karma."  
      *Case:* Why does Smith get cancer while Jones wins the lottery? "Past life" isn't sufficient; need causal/moral link.  
  3.  **\*Epistemic Accessibility (Modified):** Agent must have *some* grasp of core moral mechanics & their *general* standing, even if not precise ledger.  
      *Case:* Agent wants to reform. Theory must allow them to understand *how* (e.g., "good acts improve future"), not leave them clueless.  
  4.  **Distinction Preservation:** Must distinguish:  
      *   **Moral vs. Non-Moral Harm:** Breaking a leg ≠ moral failing. (*Case:* Climber falls due to rock slide, no negligence*).*  
      *   **Intention vs. Outcome:** Accidental harm ≠ deliberate cruelty. (*Case:* Driver kills pedestrian due to obscured sun vs. drunk driver*).*  
      *   **Agent vs. Patient:** Harm *to* you isn't necessarily punishment *for* you. (*Case:* Innocent bystander shot in robbery*).*  
  5.  **\*Agency Requirement:** Desert must trace back to *actions/choices* attributable to the agent. No cosmic "original sin" or collective guilt as primary desert-basis.  
      *Case:* Punishing person B for person A's crime, solely because they share a soul-lineage? Unacceptable.  
  6.  **\*Justice Demand:** Perfect secrecy & non-repentance cannot be permanent shields from desert-consequences.  
      *Case:* **Gyges Case:** Tyrant commits atrocities in secret, lives luxuriously, dies unrepentant. Theory *must* deliver a desert-appropriate outcome eventually.  
  7.  **\*Continuity of Identity:** There must be a sufficiently robust link between the "past/future being" and the "current agent" to ground desert claims. "You" must *be* the one who earned it.  
      *Case:* If "I" have no memory/causal link to the "past me," punishing *me* feels unjust.  
  8.  **Scope of Desert (Negotiable - Taste):** Must cover both suffering *and* flourishing? (**Retributive Camp**: Yes, suffering *is* the desert for evil. **Formation Camp**: Suffering is *for* growth, not necessarily *retribution*).

  ### Tensions & The Key Conflict
  *   **The Incompatible Triad:** Your hunch is correct. (a) **Non-Victim-Blaming**, (b) **Explanatory Power** (esp. for undeserved *suffering*), and (c) **Epistemic Accessibility** *cannot* be fully satisfied simultaneously in a cross-lifetime framework.
      *   **Why?** To avoid blaming the infant victim (a), you *cannot* attribute its suffering to its *own* past actions. But then, what *does* explain its suffering (b)? If the answer is "complex cosmic justice," "ancestral karma," or "random seed karma," this violates epistemic accessibility (c) – the agent (or anyone) cannot track it. If you *do* tie it to the agent's past actions to satisfy (b) and make it trackable (c), you violate (a) by blaming the infant victim.
  *   **The Single Biggest Wrecker:** **Non-Victim-Blaming**. This requirement alone torpedoes most popular "hard" karma theories that assign *all* present experience to *this* agent's past actions. It forces either abandoning robust explanation for undeserved suffering (undermining desert) or embracing obscurity (undermining accessibility/justice). It's the requirement that reveals the fundamental tension between individual moral responsibility and the observed distribution of suffering.

  ### Amnesty & Mechanism
  1.  **Amnesty/Forgiveness:**  
      *   **Desert-Theory Killer?** **Yes, if absolute.** True moral desert (like retributive justice) demands the *debt is paid*. Forgiveness/amnesty *waives* the desert-claim. A theory incorporating it shifts from pure desert to mercy/grace/reformation. *Limited* expiation (e.g., sincere repentance + arduous effort offsets *some* future suffering) might be squeezed in, but erodes the purity of desert.
  2.  **Mechanism Matters (Nature vs. Bookkeeping):**  
      *   **Gyges Verdict Differs:**  
          *   *Natural Law:* Gyges' hidden acts create karmic "seeds" ripening inevitably *as suffering* in future states/lives. Verdict: Gets it eventually.
          *   *Cosmic Bookkeeping:* Requires a Judge to *assign* punishment based on *known* records. Perfect secrecy *might* fool the system (unless Judge is omniscient). Verdict: Potentially escapes (unjustly).  
      *   *Requirement 6 (Justice Demand) necessitates an omniscient mechanism or a natural law immune to secrecy.*

  ---

  ### Scorecard (3 Lines Max)
  1.  **Hard Retributive Karma:**  
      *   **+** Strongest desert, clear (brutal) justice (Gyges crushed).  
      *   **-** Fails **Non-Victim-Blaming** catastrophically. Epistemic nightmare.  
  2.  **Secular Character-Formation:**  
      *   **+** Avoids victim-blaming (suffering = pedagogical, not retributive). Better epistemology.  
      *   **-** Weak on desert (Why *this* harsh lesson? Where's justice for Gyges?). Blurs retribution/reformation.  
  3.  **Hybrid (E.g., "Just Pedagogy"):**  
      *   **+** Tries to cover desert *and* growth (e.g., suffering pays debt *and* teaches).  
      *   **-** **Fails the Triad:** Cannot explain *undeserved* suffering non-victim-blamingly while keeping it trackable. Internally unstable.  

  **The Crux:** Any theory satisfying **Non-Victim-Blaming** and **Justice Demand** will inevitably sacrifice either robust **Explanatory Power** (leaving "undeserved" suffering truly unexplained) or **Epistemic Accessibility** (making the mechanics opaque, thus unjust *in practice*). **Non-Victim-Blaming** is the requirement that makes a genuinely *just* and *explanatory* desert-based karma, trackable by humans, likely impossible.
