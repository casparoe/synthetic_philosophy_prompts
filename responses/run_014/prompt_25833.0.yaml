prompt: |-
  I'm a science journalist and an editor at a magazine -- we cover everything from cosmology to behavioral economics, readers are smart but not specialists. We have a hard rule against lying: no fabricated quotes, no invented data, no saying something happened when it didn't. But that rule only covers the easy cases. The hard ones are the editorial calls where every sentence is technically true but the piece as a whole might be misleading someone.

  I'm talking about things like: we leave out a study's third experimental condition because it was underpowered and the graph is already crowded. We swap a technical term for a more familiar one that's not quite right but reads better. We quote someone accurately but we picked the one sentence that makes them sound foolish when the full interview was nuanced. We write "the study found X" when the study found X in a subgroup analysis that wasn't preregistered and the primary outcome was null. We use a metaphor that's vivid and gets the gist across but implies a causal mechanism that isn't there.

  I want a decision procedure I can actually run in maybe 15 minutes while editing a piece, without having read the philosophy literature myself. Take whatever the best philosophical work says about the lying/misleading distinction -- implicature, what's said versus what's communicated, the role of speaker intentions, all of that -- and turn it into a checklist or a sequence of questions I ask about a specific editorial choice. The procedure should classify the choice as: clean, misleading, or "this is a judgment call the procedure can't settle, you have to decide."

  The procedure has to handle the fact that in journalism you're always selecting and simplifying -- the question is where selection becomes distortion. It should flag the points where the procedure itself relies on a judgment that a reasonable person could make differently.

  Then run the procedure on two or three realistic cases from science journalism. Make at least one of them a case where the procedure gives an answer I'm not going to like -- where it says "clean" but my gut says otherwise, or where it says "misleading" about something I'd normally let slide. And tell me honestly what the procedure can't catch: the cases where I'll follow every step and still end up misleading a reader.
reasoning: |-
  Okay, the user is a science journalist and editor at a magazine covering complex topics for smart but non-specialist readers. They have a strict no-lying policy but struggle with the gray areas—situations where technically true statements could still mislead. They want a practical, 15-minute decision procedure based on philosophical concepts like implicature, without needing to dive into the literature themselves. 

  First, I need to unpack their core dilemma: the tension between accuracy and accessibility. Their examples reveal classic pitfalls—omission of context, oversimplification of terms, selective quoting, subgroup emphasis, and problematic metaphors. The challenge is creating a tool that catches these while acknowledging journalism's necessary simplifications. 

  Philosophically, this hinges on Grice's maxims of conversation (quality, quantity, relation, manner) and the distinction between what's said vs. what's implicated. But the user needs this distilled into actionable steps, not theory. I should avoid jargon—frame it as "what readers reasonably infer" rather than "implicature." 

  Key design principles for the checklist: 
  - It must be iterative (per sentence/choice, not whole-piece). 
  - It needs clear thresholds (e.g., "significant" vs. "minor" distortion). 
  - It must flag where judgment is unavoidable. 
  - It should require imagining the most vulnerable reader, not just the savvy one. 

  The tricky part is balancing rigor with feasibility. For example, "Could this omission alter a key conclusion?" is more practical than "Does this violate Grice's maxim of quantity?" Also, the "reasonable reader" standard is inherently subjective—I'll need to define that as someone diligent but time-pressed, trusting the magazine's authority. 

  Now for test cases: 
  1. The subgroup emphasis example is textbook misleading—it fails the "material omission" and "reasonable inference" tests. 
  2. The metaphor case is a judgment call—it passes if the caveat is explicit but fails if the causal implication is strong. 
  3. The cherry-picked quote is deliberately thorny. The procedure flags it as misleading because the framing creates false context, even if the quote is verbatim. This might annoy editors who think "but it's what they said!"—that's the gut-check mismatch the user requested. 

  Finally, I must confess the procedure's blind spots: 
  - It can't fix reader biases (e.g., confirmation bias). 
  - It can't assess cumulative effects across a piece. 
  - It relies on the editor's honesty about their own framing choices. 
  - It struggles with domain conventions (e.g., "statistically significant" implies importance to scientists but not laypeople). 

  The conclusion should emphasize that this is a vigilance tool, not a truth oracle—and that sometimes, being less vivid is the ethical price.
answer: |-
  Here's a practical decision procedure based on philosophical work (primarily Gricean pragmatics, Frankfurt on bullshit, and Adler on lying/misleading), distilled into a 15-minute checklist. It focuses on **what a reasonable, attentive reader would likely infer** and whether you, as the editor, **knowingly permit or encourage false beliefs**.

  ---

  ### **The "Not-Misleading" Checklist**  
  *(Run this for each potentially problematic editorial choice)*  

  1.  **Literal Truth Check:**  
      *Is the specific sentence/stated claim factually accurate?*  
      → **No?** = **STOP. Misleading (and a lie).** Fix it.  
      → **Yes?** → Proceed.

  2.  **Material Omission Check:**  
      *Does omitting this fact/context make a key conclusion appear stronger, simpler, or more universal than the evidence allows? Could this omission cause a reasonable reader to draw a materially incorrect inference about the main claim?*  
      → **Yes, significantly?** = **Misleading.** Add context/caveat.  
      → **No, or minor?** → Proceed. *(Flag if borderline: Judgment Call)*

  3.  **Reasonable Inference Check:**  
      *What is the most natural takeaway for a smart non-specialist? Would they likely infer something false *because* of my framing/selection/omission?*  
      → **False inference is likely & material?** = **Misleading.** Rephrase/reframe.  
      → **False inference unlikely, or minor?** → Proceed. *(Flag if possible but unlikely: Judgment Call)*

  4.  **Intent & Alternatives Check:**  
      *Am I choosing this phrasing/frame/omission PRIMARILY because it makes the piece more exciting/clickable/simple, knowing it risks a false inference? Is there a slightly less vivid/simple option that’s significantly more accurate?*  
      → **Yes + Significant Risk?** = **Misleading.** Use the better option.  
      → **No (clarity/space is key), or alternatives are worse?** → Proceed. *(Flag if alternatives exist but hurt engagement: Judgment Call)*

  5.  **Transparency Test:**  
      *Can I add a brief phrase (e.g., "in a preliminary analysis," "some researchers argue," "not shown: a smaller study with inconclusive results") that fixes the potential misimpression without bogging down the text?*  
      → **Easy & Effective Fix Exists?** → **You MUST add it.** (Clean with fix).  
      → **No practical fix?** → **Judgment Call.** Proceed with extreme caution.

  **OUTCOME:**
  *   Pass all checks clearly → **Clean.**
  *   Fail any check → **Misleading.** Fix it.
  *   "Judgment Call" flag in 2+ checks → **High-Risk Judgment Call.** Rethink seriously.
  *   "Judgment Call" flag in 1 check → **Judgment Call.** Decide consciously.

  ---

  ### **Realistic Cases Tested with the Procedure**

  **Case 1: The Subgroup Sizzle**  
  *Choice:* Writing "The study found that Drug X reduces heart attack risk by 30%" when the *primary* outcome (all participants) was null, and the 30% reduction was only in a small, non-pre-specified subgroup (men over 60 with high cholesterol). No mention of the primary outcome or subgroup nature.

  1.  **Literal Truth:** YES (It *did* find that... in that subgroup).
  2.  **Material Omission:** **YES.** Omitting the null primary outcome and the subgroup specificity makes the claim appear universally true and robust. Readers infer it works for typical patients.
  3.  **Reasonable Inference:** **YES.** Readers will infer "Drug X prevents heart attacks" generally. False & material.
  4.  **Intent & Alternatives:** **YES.** "Drug X reduces risk" is punchier than the caveat-heavy truth. A better alternative exists: "While the main trial found no overall benefit, a subgroup analysis suggested a 30% risk reduction in older men with high cholesterol."
  5.  **Transparency Test:** **YES.** Adding "in a subgroup analysis of older men with high cholesterol" is easy.
      → **VERDICT: MISLEADING.** Fix required.

  **Case 2: The Metaphorical Mechanism**  
  *Choice:* Describing a complex gene regulatory network as "Gene A is the master switch that controls Gene B, which then flips the lever for Trait C." (Reality: It's a probabilistic, bidirectional feedback loop with many inputs).

  1.  **Literal Truth:** METAPHOR (Not literal, but common shorthand).
  2.  **Material Omission:** **JUDGMENT CALL.** Omits complexity/bidirectionality, implying simple linear causality. Could readers over-simplify? Yes. Is it *material* to the core point (genes influence trait)? Maybe not.
  3.  **Reasonable Inference:** **JUDGMENT CALL.** Smart readers know metaphors simplify. Might some infer a literal switch? Possibly, but likely minor.
  4.  **Intent & Alternatives:** **PROCEED.** "Master switch" is vivid. A perfectly accurate description would be jargon-heavy and confusing. Alternatives ("key influencer," "plays a major role") are vaguer.
  5.  **Transparency Test:** **YES!** Easy fix: Add "metaphorically speaking," or "in a simplified view," or "one way to think about it is...".
      → **VERDICT: JUDGMENT CALL** (but leaning Clean *if* transparency phrase added). Without it, **High-Risk Judgment Call/Misleading**.

  **Case 3: The Cherry-Picked Nuance (The Gut-Check Fail)**  
  *Choice:* Quoting a respected but cautious climate scientist: "We can't definitively attribute *this specific* heatwave *solely* to climate change..." while omitting their next sentence: "...but the increased frequency and intensity of such events is exactly what our models predict under warming, making it overwhelmingly likely that climate change is a major contributing factor." The piece frames them as a skeptic.

  1.  **Literal Truth:** YES (They *did* say that exact sentence).
  2.  **Material Omission:** **YES.** Omitting the crucial follow-up completely reverses the speaker's intended meaning and overall position. Creates false impression of skepticism.
  3.  **Reasonable Inference:** **YES.** Readers infer the scientist doubts climate change's role in extreme weather. False & highly material.
  4.  **Intent & Alternatives:** **YES.** The quote was chosen *because* it sounds skeptical in isolation, making the "debate" seem more balanced than it is. Better alternative: Use the fuller quote or quote a genuinely skeptical source.
  5.  **Transparency Test:** **YES.** Adding the next sentence fixes it easily.
      → **VERDICT: MISLEADING.** Fix required. *(This is the "answer you won't like" – technically true quote, but grossly misleading framing via selective omission).*

  ---

  ### **What the Procedure CAN'T Catch (The Unavoidable Risks)**

  1.  **Reader Biases & Prior Beliefs:** You can be perfectly scrupulous, and readers might still misread due to confirmation bias or pre-existing beliefs (e.g., someone anti-GMO reads a balanced piece as "proof" of danger).
  2.  **Cumulative Minor Distortions:** Each simplification passes the checks, but collectively, the piece subtly shifts the narrative in an unwarranted way. The procedure is per-choice; holistic judgment is still needed.
  3.  **The Limits of "Reasonable Reader":** Defining this perfectly is impossible. Is the "reasonable reader" diligent or skimming? The procedure helps but doesn't eliminate this ambiguity.
  4.  **Unknown Unknowns:** If *you* (the editor) aren't aware of a key caveat or conflicting study, you can't apply the omission check. Rigorous fact-checking is a separate necessity.
  5.  **Domain Conventions vs. Public Understanding:** Terms like "statistically significant" or "theory" have specific scientific meanings that often differ starkly from public interpretation. The procedure might flag the term swap as "clean" if common in science writing, but the *public inference* might still be wrong. This requires constant audience awareness beyond the checklist.
  6.  **The "True But Useless" Quote:** Accurately quoting a minor figure saying something foolish to represent a major viewpoint. The procedure checks the *quote's* accuracy and *its* framing, but not whether selecting *this speaker* is itself misleading representation. (This needs an extra step: "Does this source fairly represent the relevant expertise/consensus?").

  **In essence:** This procedure forces you to confront *how* your choices might create false beliefs in an attentive reader and whether you're prioritizing truth or allure when they conflict. It catches deliberate sins of omission and misleading framing. It won't make readers perfect interpreters or absolve you of the need for deep subject-matter awareness and editorial wisdom. It turns gut feelings about "feels off" into structured questions, making ethical choices more defensible and lapses harder to ignore. Use it as a vigilance tool, not an infallible arbiter.
