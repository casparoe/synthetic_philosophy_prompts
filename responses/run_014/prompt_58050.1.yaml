prompt: |-
  Having retired two years ago after some three decades in experimental plant physiology, I have recently taken to attending a local philosophy of science reading group, where I find our discussions of statistical method both familiar from a lifetime at the bench and newly perplexing when viewed conceptually. Last week a fellow participant whom I regard as a thoughtful and generally reliable popularizer offered a gloss on the frequentist versus Bayesian dispute and its connection to the replication crisis that struck me as plausible but perhaps too neat, and I would like help in assessing it before our next meeting.

  As I understood him, his account ran roughly as follows. Frequentist procedures such as p-values and confidence intervals concern the long-run behavior of a testing procedure under repeated sampling rather than the plausibility of a particular hypothesis in light of the data at hand, and the institutional habit of treating falling below 0.05 as publishable discovery encouraged selective reporting, flexible analysis, and underpowered designs, all of which helped produce a literature that does not replicate. The Bayesian alternative, by contrast, represents uncertainty as degrees of belief revised in light of evidence, permits the quantification of support for a null hypothesis as well as against it by means of comparative measures of predictive success, and replaces a sharp accept-or-reject threshold with graded updating informed by prior knowledge. From this he drew a stronger methodological moral, illustrated by a case close to my former work: if one monitors seedling growth across several fertilizer mixtures, checks the data each morning, stops when the evidence looks favorable, and reports only the winning mixture with a Bayes factor computed under a conventional default prior, the evidential import of the reported figure is unaffected in principle by the interim looks, the unreported comparisons, or the absence of a preregistered plan, since inference conditions only on the data actually obtained and the default prior introduces no substantive assumption of its own.

  I am inclined to accept the first part of this picture but uncertain about the stronger moral at the end. Which elements of the gloss would philosophers of statistics and working statisticians on both sides accept as accurate, which are helpful simplifications that need qualification, and which rest on a conflation or overstatement of a more modest thesis, particularly regarding stopping rules, multiplicity, preregistration, and the status of default priors. I would also be grateful for an account of what a careful defender of the Bayesian approach would endorse and what such a defender would object to, and whether anything like the conclusion about the seedling example survives once the summary is corrected.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a retired plant physiologist now in a philosophy of science reading group. They heard a popularizer's take on frequentist vs. Bayesian stats and the replication crisis. The first part about frequentist methods leading to p-hacking and underpowered studies seems plausible to them, but they're skeptical about the stronger claim that Bayesian methods are immune to issues like stopping rules or multiple comparisons.

  Hmm, the user's background in experimental plant physiology means they have practical experience with stats but might not be deep into philosophical nuances. They mention decades at the bench, so they've likely seen how stats are misused in practice. Their main concern is assessing the accuracy of the popularizer's claims before the next meeting. They want to know which parts are accepted, which need qualification, and if the seedling example holds up.

  The popularizer's argument has two parts: the criticism of frequentism's role in the replication crisis and the claim that Bayesian methods avoid these problems. The user accepts the first part but doubts the second, especially regarding stopping rules, multiplicity, preregistration, and default priors. 

  I need to break down each element. First, the frequentist critique: p-values misinterpreted, leading to selective reporting. That's well-supported in literature. The replication crisis links are valid, though multifaceted. The Bayesian alternative's strengths—handling uncertainty as belief, supporting null hypotheses, graded thresholds—are also accurate. But the stronger claims about the seedling example are where issues arise.

  Stopping rules matter in Bayesian methods too, despite the claim. Optional stopping affects Bayes factors, especially with default priors. Multiplicity is still a problem; testing multiple fertilizers without correction inflates false positives. Preregistration isn't just for frequentists; it prevents bias in Bayes too. Default priors aren't assumption-free—they can be informative and affect results.

  The user needs a balanced view: what Bayesians would endorse vs. object to in the popularizer's claims. They'd agree on the benefits of Bayesian updating and BF advantages but reject that optional stopping or multiplicity aren't issues. The seedling example's conclusion doesn't survive scrutiny. 

  Also, the user might be looking for how to discuss this in their group. They need talking points that are nuanced, acknowledging Bayesian strengths without overstating. Highlighting that no method is a panacea, and good practices like preregistration apply universally. Emphasizing that default priors require justification and sensitivity analysis. 

  Underlying needs: The user wants to confidently critique the popularizer's argument with evidence. They might also seek a deeper understanding of Bayesian limitations despite their sympathy. Ensuring they don't dismiss Bayesian methods entirely but recognize where careful application is vital. 

  In summary, the answer should validate their skepticism about the stronger claims, provide clarifications on misconceptions, and offer a corrected view of the seedling example. Balancing philosophical insights with practical statistics, respecting their experience while addressing the nuances they might not have considered.
answer: |-
  Your skepticism about the "stronger moral" is well-founded. While your colleague's characterization of frequentist limitations is largely accurate (if simplified), the claims about Bayesian immunity to stopping rules, multiplicity, and preregistration are significant overstatements. Here's a breakdown:

  **Accurate Elements & Helpful Simplifications:**

  1.  **Frequentist Critiques & Replication Crisis Link:**
      *   **Accepted:** P-values are often misinterpreted as the probability the null is true (they aren't). They measure data extremity *assuming* the null.
      *   **Accepted:** Focusing solely on p<0.05 incentivizes p-hacking (selective reporting, flexible analyses like adding covariates or changing outcomes), data dredging, and underpowered studies (high false negative rates mean only large effects or flukes get published).
      *   **Accepted:** These practices are major contributors to non-replicability. The institutional pressure to achieve "statistical significance" is a core problem.
      *   **Simplification:** The replication crisis has multifaceted causes beyond *just* statistics (e.g., publication bias, incentive structures, fraud). Frequentism *enabled* these problems but didn't solely cause them.

  2.  **Core Bayesian Advantages:**
      *   **Accepted:** Bayesianism quantifies uncertainty about *hypotheses* (P(H|D)) via posterior probabilities and Bayes Factors (BF), contrasting with frequentist measures of data extremity under H0 (p-value) or long-run coverage (CI).
      *   **Accepted:** Bayesian methods naturally allow quantifying evidence *for* the null (BF < 1) and provide a graded measure of evidence (BF strength), avoiding a rigid "significant/not significant" dichotomy.
      *   **Accepted:** Bayesian updating formally incorporates prior knowledge (when available and justified), leading to more cumulative science.

  **Problematic Overstatements & Conflations:**

  1.  **Stopping Rules ("Interim Looks"):**
      *   **Claim:** Bayesian evidence (BF) is unaffected by when you stop collecting data ("optional stopping").
      *   **Reality: Overstatement.**
          *   **Theoretical Point:** It's true that for a *fixed* prior and model, the BF calculated from the *final dataset* is the same regardless of the stopping rule *in terms of coherence*. The posterior is conditioned *only* on the observed data and prior.
          *   **Practical & Interpretive Problem:** Optional stopping *dramatically* inflates the *Type I error rate* (false positives) if you naively interpret the BF using standard thresholds (e.g., BF>3 for "evidence") *without adjusting for the stopping rule*. Sequential testing inherently increases the chance of seeing a "spurious" effect large enough to trigger stopping. While the BF calculation itself is correct for the observed data *given the model and prior*, the *calibration* of what constitutes "strong evidence" (BF thresholds) *does* depend on the stopping rule in practice. Claiming BF evidence is "unaffected" ignores the impact on error control and evidentiary interpretation.
          *   **Bayesian Objection:** Careful Bayesians acknowledge that optional stopping can distort evidence if not handled carefully. Techniques like prior adjustments, specific sequential designs, or interpreting BF *ranges* rather than fixed thresholds are needed. Preregistration of stopping rules is still valuable for Bayesians to prevent selective stopping based on desired results.

  2.  **Multiplicity ("Unreported Comparisons"):**
      *   **Claim:** Reporting only the "winning" mixture with its BF is fine; unreported comparisons don't affect the reported BF's validity.
      *   **Reality: Conflation/Overstatement.**
          *   **Theoretical Point:** The BF for *that specific comparison* (winning mixture vs. control/standard) using its data *is* valid *for that comparison alone*. It doesn't mathematically depend on other comparisons being run.
      *   **Practical & Interpretive Problem:** This ignores the **Selection Effect** (aka "Fishing Expedition", "Multiple Testing"). If you test many mixtures (or many outcomes, subgroups, etc.), you dramatically increase the chance that *at least one* will show a spuriously large BF *by chance alone*. Reporting *only* that one winner, without acknowledging the multiple tests performed, is deeply misleading. The BF for the winner is likely inflated compared to what you'd get if you had tested *only* that one mixture from the start. The "default prior" doesn't magically fix this.
      *   **Bayesian Objection:** Careful Bayesians recognize selection effects as a major concern. Solutions include:
          *   **Pre-specification:** Preregistering the primary comparisons.
          *   **Hierarchical Modeling:** Modeling the mixtures as coming from a population (e.g., partial pooling in a multilevel model), which naturally shrinks extreme estimates and accounts for multiplicity.
          *   **Model Averaging:** Considering all comparisons explicitly in a larger model.
          *   **Reporting All:** Disclosing *all* tests performed, even if not "significant".
          *   **Adjusting Interpretation:** Understanding that evidence thresholds need to be stricter when multiple comparisons are made (though adjustment is less formalized than frequentist FWER/FDR).

  3.  **Preregistration:**
      *   **Claim:** Preregistration is unnecessary for Bayesian inference since it only conditions on the data obtained.
      *   **Reality: Overstatement.**
          *   **Theoretical Point:** Bayesian updating *is* formally conditioned only on the observed data and prior.
      *   **Practical Problem:** Preregistration combats **Researcher Degrees of Freedom** (p-hacking, HARKing - Hypothesizing After Results are Known). This problem is *method-agnostic*. A Bayesian can easily:
          *   Try multiple priors and report only the one giving the "best" BF.
          *   Try multiple model specifications (covariates, transformations, likelihoods).
          *   Explore different subsets of data or outcomes.
          *   Stop collecting data when the BF looks favorable.
      *   **Bayesian Endorsement:** Many leading Bayesians strongly advocate for preregistration and registered reports as essential tools for *reducing bias and enhancing credibility*, regardless of the statistical paradigm. It prevents the *selective reporting and analysis* that corrupts evidence, Bayesian or frequentist. Conditioning only on observed data doesn't prevent analysts from trying many things and reporting only what worked.

  4.  **Default Priors ("No Substantive Assumption"):**
      *   **Claim:** Default priors (e.g., Jeffreys, Cauchy on standardized effects) introduce no substantive assumption.
      *   **Reality: Overstatement/Conflation.**
          *   **Theoretical Point:** Default priors are often chosen for desirable mathematical properties (e.g., invariance, consistency) or to be "objective"/"reference" priors representing minimal information.
      *   **Practical Problem:** **All priors are assumptions.** "Default" priors can be surprisingly influential, especially with small to moderate sample sizes or complex models.
          *   **Implicit Information:** A "diffuse" prior on a variance might imply unrealistic beliefs about very large variances. A Cauchy prior on an effect size implies a belief in reasonably frequent large effects.
          *   **Impact on BF:** The BF is highly sensitive to the prior scale, particularly for the alternative hypothesis. Different "default" priors (e.g., Cauchy scale 0.707 vs 1.0) can yield substantively different BFs for the same data. Calling them "non-informative" is often a misnomer; they encode *specific* forms of "information".
      *   **Bayesian Objection:** Careful Bayesians emphasize:
          *   **Justification:** Priors should be justified based on context, domain knowledge, or clearly stated as reference analyses.
          *   **Sensitivity Analysis:** Results (especially BFs) *must* be reported across a range of plausible priors to assess robustness. Relying solely on a single default prior is risky.
          *   **Default Priors as Tools:** Default priors are useful tools for initial exploration or when strong prior knowledge is lacking, but they are not assumption-free magic bullets. Their influence needs to be understood and checked.

  **What a Careful Bayesian Defender Would Say:**

  *   **Endorse:**
      *   The core philosophical framework: Quantifying belief in hypotheses, formal updating with evidence.
      *   The ability to quantify evidence for the null and provide graded evidence (BF).
      *   The formal incorporation of prior knowledge (when available/justified).
      *   That frequentist p-values are often misinterpreted and misused, contributing to the replication crisis.
      *   That *for a single, pre-specified analysis*, the BF depends only on that data and prior.
  *   **Object To (in the popularizer's claims):**
      *   The idea that optional stopping has no practical consequences for interpreting BF evidence thresholds.
      *   The claim that multiplicity (selection effects) doesn't distort the interpretation of a selected "winning" result.
      *   The dismissal of preregistration as unnecessary for Bayesian methods.
      *   The characterization of default priors as introducing "no substantive assumption" and being universally safe.
      *   The implication that Bayesian methods are immune to bias or poor research practices like selective reporting or p-hacking. Bad science can be done with any statistical tool.
  *   **Emphasize:**
      *   **Robustness:** The critical need for sensitivity analyses, especially regarding priors.
      *   **Transparency:** Reporting all analyses conducted, all models/priors tried, all outcomes measured.
      *   **Design & Context:** The importance of good experimental design, domain knowledge for priors, and acknowledging limitations.
      *   **Preregistration:** Its value for reducing bias, regardless of statistical paradigm.
      *   **BF Nuance:** BF is a continuous measure of relative predictive adequacy *under specific models/priors*, not a direct probability of truth. Its calibration depends on context (including design).

  **Does the Seedling Example Conclusion Survive?**

  **No, not as stated.** While the *calculation* of the BF for the winning fertilizer mixture is technically correct *given only that data and the default prior*, the *interpretation* of that BF as strong evidence for *that specific mixture being truly superior* is **highly suspect and likely misleading** because:

  1.  **Optional Stopping:** The BF threshold for "strong evidence" (e.g., BF>10) is not calibrated the same way when you stop only because you saw a large effect. The risk of a false positive is inflated.
  2.  **Multiplicity (Selection Effect):** Testing multiple mixtures and reporting *only the winner* ignores the increased chance that *any* mixture would show a large BF by chance. The BF for the winner is likely overestimated compared to testing it alone. The "default prior" doesn't solve this.
  3.  **Default Prior Influence:** The BF may be highly sensitive to the specific choice of "default" prior scale. Was this checked? Is the prior actually reasonable for the context?
  4.  **Lack of Preregistration:** Without preregistration, there's no guarantee this was the *only* analysis done. Did they try different models? Different outcomes? Different prior scales? Selective reporting of only the "best" BF is a major risk.

  **Conclusion:**

  Your colleague provides a reasonable (if standard) critique of frequentist practice and a good overview of core Bayesian advantages. However, the claim that Bayesian methods, particularly with default priors, render stopping rules, multiplicity, and preregistration irrelevant **is a dangerous overstatement that most philosophers of statistics and careful Bayesian statisticians would strongly qualify or reject.** Bayesian methods offer powerful tools and a coherent framework, but they are not a panacea against bias, poor design, or questionable research practices. Transparency, careful design, consideration of context (including priors), sensitivity analysis, and often preregistration remain crucial for credible inference, regardless of the statistical paradigm. The seedling example, as described, exemplifies practices that would undermine the credibility of *any* statistical analysis, Bayesian or frequentist.
