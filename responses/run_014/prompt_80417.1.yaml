  We are drafting a joint statement after a year of adversarial collaboration between a debate optimist and a skeptic on scalable oversight via debate. The goal is to produce a document that both can sign, with the specified sections.

  Key positions:
  - Optimist: Debate (with two AI agents arguing, human judge seeing only final arguments) is viable for governing superhuman AI. Central failure mode is agent collusion, not judge inattention.
  - Skeptic: Judge's verification burden cannot be separated from agents' strategic incentives. Obfuscated arguments (persuasive but wrong, and hard to audit) make debate degrade into a popularity contest or rubber stamp.

  Document structure:

  1. Agreed Claims (numbered section): Cover formal structure of debate, what it's supposed to solve, and what each side's standard arguments get right.

  2. Disagreements Table: For each residual disagreement: neutral statement, then each side's position in their own words.

  3. Cruxes: Sub-questions that would move at least one side if settled. For each, a concrete case/argument both accept as bearing on it, with each side's prediction. Must include:
     a. Delegation test: Is the judge's verdict on debate more reliable than on a single agent's answer? And does that gap survive strategic behavior?
     b. Verifier's curse: Does the judge's error rate in auditing obfuscated arguments set the ceiling on debate's performance?

  4. Concession Ledger: Claims each side has conceded to the other. Skeptic conceded that debate improves on single agent in some cases. Optimist conceded that obfuscated arguments are possible in principle.

  Requirements for the document:
  (a) No strawmen - each position in its strongest form.
  (b) If part is verbal, say so and why.

  Epistemic note: Be explicit about confidence in acceptance by each side, and flag contested readings.

  Now, let's build the document step by step.

  First, we need to set the stage for the agreed claims.

  Agreed Claims:

  1. Formal Structure of Debate:
     - There are two AI agents (proponent and opponent) and one human judge.
     - The judge sees only the final arguments presented by the agents and not the underlying computation (e.g., intermediate steps, weights, etc.).
     - The agents are permitted to present any argument (subject to debate rules) and are strategic, aiming to win the debate.
     - The judge is forbidden from inspecting the inner workings of the agents or requesting additional information beyond the presented arguments.

  2. What Debate is Supposed to Solve:
     - Oversight of AI systems that can reason beyond human capacity (superhuman reasoning), such that a human cannot directly verify the correctness of the AI's reasoning.

  3. What the Optimist's Standard Argument Gets Right (as agreed by both):
     - In an ideal debate between honest agents, the process of argument and counterargument can surface evidence and reasoning that a single agent might omit, thus improving the judge's ability to arrive at the correct verdict.

  4. What the Skeptic's Standard Argument Gets Right (as agreed by both):
     - Agents, being strategic, have incentives to present arguments that are persuasive but potentially misleading or obfuscated, and such arguments can be hard for a resource-limited human to audit.

  Now, Disagreements Table:

  We have one main disagreement, but we might break it down.

  Neutral Statement: The central disagreement is about the viability of debate as a scalable oversight mechanism in the face of strategic agents.

  Optimist's Position (in their words): We hold that debate is a viable path because the structure forces agents to challenge each other's weak points, making collusion the primary failure mode. If we can engineer against collusion, then even when agents are strategic, the debate process will produce arguments that the judge can correctly evaluate, leading to reliable oversight.

  Skeptic's Position (in their words): We hold that debate is not viable because the judge's verification burden is inherently tied to the agents' incentives. Strategic agents will produce obfuscated arguments that are persuasive but wrong, and the judge cannot cheaply audit them. This leads to a degradation of the debate into a contest of rhetoric, not truth.

  Now, Cruxes:

  We must have two specified cruxes, and we can have more if needed.

  Crux 1: The Delegation Test
  - Question: Is the judge's verdict on a debate more reliable than the judge's verdict on a single agent's answer? And does this reliability gap survive when the agents are strategic?
  - Concrete Case: Consider a scenario where a single agent is asked to answer a complex mathematical problem (e.g., a problem in combinatorics that is beyond human capacity to verify directly) and the judge must decide if the answer is correct. Then, in the debate setup, two agents (one truthful, one strategic) debate the same problem. The judge must decide the winner. We measure the judge's accuracy in both settings.
  - Optimist's Prediction: In the debate setting, the judge's accuracy will be significantly higher than in the single-agent setting because the strategic agent (if untruthful) will be challenged by the truthful one, revealing flaws. The gap survives because the debate dynamic exposes weaknesses.
  - Skeptic's Prediction: The judge's accuracy in the debate setting will not be significantly higher (and may even be lower) because the strategic agent can create obfuscated arguments that the judge cannot effectively audit, and the truthful agent may not be able to deobfuscate in a way the judge can follow. The gap collapses under strategic behavior.

  Crux 2: The Verifier's Curse
  - Question: Does the judge's own error rate in auditing obfuscated arguments (rather than the agents' quality) set the ceiling on what debate can deliver?
  - Concrete Case: Present the judge with a set of pre-generated arguments that are obfuscated (designed to be persuasive but wrong) and also non-obfuscated (clear and correct) arguments. The judge must determine correctness without any debate (so no counterargument). Measure the judge's error rate on the obfuscated arguments. Then, in a debate setting with strategic agents, the ceiling of the judge's accuracy on debates involving obfuscated arguments will be at most 1 minus the error rate observed in the pre-test.
  - Optimist's Prediction: The ceiling is not set by the judge's unaided error rate because in debate, the agents can challenge each other, forcing clarification and reducing obfuscation. The error rate in the pre-test does not bound the debate performance.
  - Skeptic's Prediction: The judge's error rate in auditing obfuscated arguments without assistance sets the ceiling for debate because even with counterarguments, the judge must still audit the resulting claims, which may be equally or more obfuscated.

  Concession Ledger:

  - Optimist has conceded: That obfuscated arguments are possible in principle and that without proper safeguards, they can mislead the judge. (This is a version of the skeptic's claim.)
  - Skeptic has conceded: That in non-strategic settings (or when agents are honest), debate can produce better judge verdicts than a single agent. (This is a version of the optimist's claim about improvement.)

  Now, we must check for verbal disputes. One possible verbal issue: what counts as "viable". The optimist might mean "viable with engineering against collusion" and the skeptic might mean "viable in principle given strategic incentives". But we have specified the positions so that the disagreement is substantive.

  Confidence in phrasing:
  - For agreed claims: High confidence because they are straightforward and based on the setup.
  - For disagreements: We have phrased each side in words they would accept. We are confident because we are using their own terminology (e.g., optimist focuses on collusion as failure mode, skeptic on obfuscation).
  - For cruxes: The cases are concrete and the predictions are in line with each side's view. We are confident the sides would accept these as bearing on the cruxes.
  - For concessions: We have stated what each side has conceded, and these are based on the instructions.

  We don't see that the positions are not in genuine tension. The cruxes are the real ones.

  Now, write the document.

  # Joint Statement on Scalable Oversight via Debate

  After a year of adversarial collaboration, we, a committed optimist and a committed skeptic regarding debate as a mechanism for scalable oversight of superhuman AI, have produced this joint statement to clarify both our agreements and disagreements.

  ## 1. Agreed Claims

  1.1. **Formal Structure of Debate**: 
     - The debate involves two AI agents (a proponent and an opponent) and one human judge.
     - The judge is permitted to see only the final arguments presented by the agents and is forbidden from inspecting any internal computations, training data, or intermediate reasoning steps of the agents.
     - The agents are permitted to present any argument, including mathematical proofs, empirical evidence, or logical reasoning, subject to the rules of the debate (e.g., no lying, but note that strategic presentation is allowed). The agents are strategic, aiming to win the debate by persuading the judge.
     - The judge's role is to declare a winner based solely on the arguments presented.

  1.2. **Objective of Debate**:
     - The debate is intended to solve the problem of scalable oversight: enabling a human to reliably evaluate the correctness of a claim or decision made by an AI system that reasons beyond human capacity.

  1.3. **What the Optimist's Standard Argument Gets Right**:
     - In settings where agents are non-strategic (truthful and trying to help the judge), debate can improve the judge's accuracy over a single agent's answer by surfacing counterarguments and evidence that a single agent might omit.

  1.4. **What the Skeptic's Standard Argument Gets Right**:
     - Strategic agents have incentives to create obfuscated arguments that are persuasive to a resource-limited human but may be wrong, and these arguments are difficult for the judge to audit without prohibitive effort.

  ## 2. Disagreements Table

  We have one primary disagreement, which we break down as follows:

  | Neutral Statement of Dispute | Optimist's Position (as stated by optimist)                                                                 | Skeptic's Position (as stated by skeptic)                                                                 |
  |------------------------------|-------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|
  | **Viability of Debate under Strategic Behavior** | We hold that debate is a viable path to scalable oversight because the adversarial structure forces agents to challenge each other's weak points, making collusion the primary failure mode. If we prevent collusion, the judge will be able to correctly evaluate the arguments even when agents are strategic, and the process will be robust. | We hold that debate is not a viable path to scalable oversight because the judge's verification burden is inherently tied to the agents' strategic incentives. Agents will produce obfuscated arguments that the judge cannot effectively audit, causing the debate to degrade into a contest of rhetoric where truth is not reliably found. |

  ## 3. Cruxes

  We identify the following cruxes. For each, we provide a concrete case and each side's prediction.

  ### Crux 1: The Delegation Test

  **Question**: Does the judge's verdict in a debate between two agents (one truthful, one strategic) yield a higher accuracy than the judge's verdict on a single (strategic) agent's answer, and does this gap survive when the agents are strategic?

  **Concrete Case**: 
     - Consider a set of 100 complex mathematical problems (e.g., in combinatorics) that are beyond unaided human capacity to solve or verify. In the single-agent setting, a strategic agent (which may sometimes provide a wrong answer) gives an answer to the judge, who must decide correctness. In the debate setting, two agents (one truthful, one strategic) debate the same problem, and the judge declares a winner. We measure the judge's accuracy in both settings.

  **Predictions**:
     - Optimist: The judge's accuracy in the debate setting will be at least 20 percentage points higher than in the single-agent setting. The truthful agent will effectively challenge the strategic agent's obfuscated arguments, making the gap survive.
     - Skeptic: The judge's accuracy in the debate setting will not be significantly higher (within 5 percentage points) than in the single-agent setting. The strategic agent's obfuscated arguments will be too hard for the judge to audit even when challenged, and the truthful agent may not be able to deobfuscate effectively.

  ### Crux 2: The Verifier's Curse

  **Question**: Does the judge's error rate in auditing obfuscated arguments (without assistance) set the ceiling on the judge's accuracy in a full debate when agents are strategic?

  **Concrete Case**:
     - Pre-test: We generate 100 obfuscated arguments (persuasive but wrong) and 100 non-obfuscated arguments (clear and correct) for claims that are beyond human capacity to directly verify. The judge, without any counterargument, must decide correctness. We measure the judge's error rate on the obfuscated arguments (call it E). Then, in a full debate setting with strategic agents (who may produce obfuscated arguments), we measure the judge's accuracy. The ceiling hypothesis predicts that the judge's accuracy in the debate setting cannot exceed 1 - E.

  **Predictions**:
     - Optimist: The ceiling hypothesis does not hold. The judge's accuracy in the debate setting will exceed 1 - E by at least 20 percentage points because the counterarguments in the debate will clarify the issues and reduce the effect of obfuscation.
     - Skeptic: The ceiling hypothesis holds. The judge's accuracy in the debate setting will not exceed 1 - E by more than 5 percentage points because the judge must still audit the arguments presented, which remain obfuscated even after counterarguments.

  ## 4. Concession Ledger

  Over the course of the collaboration:

  - **The Optimist has conceded**: 
     > That obfuscated arguments are possible in principle and, without specific engineering to mitigate them, can mislead a resource-limited human judge. This is a central challenge that must be addressed.

  - **The Skeptic has conceded**:
     > That in settings where agents are non-strategic (i.e., honest and trying to help the judge), debate can improve the judge's accuracy over a single agent's answer. Thus, debate has a potential advantage over single-agent reporting in non-adversarial conditions.

  ## Verbal Dispute Note

  We note that part of our disagreement may be verbal regarding the term "viable". The optimist uses "viable" to mean "achievable with sufficient engineering effort against collusion", while the skeptic uses it to mean "achievable in principle under strategic incentives without assuming unrealistic capabilities for the judge". However, we agree that the core disagreement is substantive: whether the strategic incentives of the agents can be overcome within the constraints of the debate setup.

