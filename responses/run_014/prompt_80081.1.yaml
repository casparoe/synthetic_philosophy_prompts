  Okay, the user is grappling with a philosophical argument presented in their population ethics seminar. The argument attempts to justify the sadistic repugnant conclusion using totalism and vagueness of "worth living," and they feel stuck because it leads to an unacceptable outcome. 

  First, I need to unpack the structure. The argument hinges on a sorites-like progression applied to population ethics: if adding a positive-welfare person always improves the world, and there's no sharp boundary for "worth living," then even negative-welfare additions might not reduce value. The user specifically rejects biting the bullet on sharp cutoffs or abandoning totalism outright, so I must explore subtler failures.

  The key pressure points seem to be:
  - Premise (2)'s vagueness claim feels intuitively correct—no one thinks there's an exact welfare quantum where life flips from worth-living to not. 
  - But premise (4) is where the trouble likely starts. It conflates the vagueness of a life's quality assessment with the value contribution of adding that life. Totalism assigns fixed value to welfare levels regardless of categorization; vagueness in labeling doesn't imply vagueness in the underlying axiology. 
  - Step (5) commits a modal scope error: saying "there's no fact about whether adding this person helps" isn't equivalent to "adding them definitely doesn't hurt." The argument stealthily replaces epistemic uncertainty with permissive valuation.

  When considering fixes: 
  - Rejecting (1) (totalism) avoids the conclusion but at high cost—it forces abandoning intuitive Pareto improvements and demands a full alternative axiology. 
  - Quantizing welfare (rejecting (2)) feels artificial but might be the least bad option if preserving totalism is non-negotiable. 
  - Blocking (4)'s inference preserves vagueness while containing damage—it accepts borderline cases but denies they license value increases in negative territory. This aligns with supervaluationist approaches in vagueness logic.

  The user's anxiety about "real work" the argument does is valid: it exposes how totalism + continuous welfare scales + vagueness creates moral arbitrariness. But the leap to sadism relies on equivocation. I should emphasize that rejecting the inference doesn't require denying vagueness altogether—just limiting its normative implications. 

  Their resistance to sharp cutoffs is understandable, but in ethics some precision might be unavoidable. If pressed, I'd recommend the inference-blocking fix first; it's more philosophically conservative than axiology overhaul or artificial quantization. The cost is accepting moral indeterminacy at the margins, which is less jarring than sadistic conclusions.
answer: |-
  I'll put on my population ethics hat and dissect this carefully. The argument is a clever sorites-style trap leveraging vagueness to push totalism into sadism. Here's the breakdown of where it breaks, why it's seductive, and what each fix costs:

  ### The Critical Failure Point
  **Step (4) is the load-bearing fallacy.** It conflates *epistemic vagueness* (uncertainty about classification) with *axiological vagueness* (indeterminacy in value contribution). Let's expose the equivocation:

  - Premise (2) establishes that the **concept "worth living" has borderline cases** (e.g., welfare level *w* where we can't say definitively if life is worth living).  
  - Premise (1) says adding a life *clearly above 0* increases value.  
  - Step (4) illicitly infers: "If we can't say *whether* a life at borderline welfare *w* is worth living, then we can't say *whether adding it increases value*."  

  **Why this is invalid:**  
  Totalism doesn't care about the *label* "worth living." It cares about the **numerical welfare value**. If welfare is a real number, adding a life at *w = -0.0001* **decreases total value** by 0.0001, *even if we're uncertain whether to call it "worth living."* Vagueness in categorization ≠ vagueness in the underlying metric. The argument mistakenly treats the *evaluative threshold* (0) as fuzzy, when under totalism, the *value function* (sum) is precise.

  ### Why It Looks Persuasive
  1. **Sorites Suggestion:** It mimics the heap paradox: "If removing one grain doesn't make it *not-a-heap*, eventually one grain is a heap." Here: "If lowering welfare slightly doesn't make addition *not-value-increasing*, eventually negative welfare additions are value-increasing."  
  2. **Label-Value Slippage:** We instinctively tie "worth living" to "should be added" under totalism. The vagueness of the former *feels* like it should infect the latter.  
  3. **Modal Ambiguity:** "There's no sharp cutoff in which additions raise value" (step 4) can mean:  
     - *Epistemic*: "We can't know where the cutoff is." (True, but harmless)  
     - *Axiological*: "There is no fact about whether value increases." (False under standard totalism)  
     The argument needs the latter to reach (5), but only gets the former from (2)-(3).

  ### Diagnosis: Step (5) is Unsupported
  From (4), we only get: *For borderline welfare levels, we can't definitively say whether adding the person increases value or not.*  
  But (5) asserts: *Additions at slightly negative welfare raise value (or don't lower it).* This is a **non sequitur**. Uncertainty ≠ permission. At worst, vagueness implies *indeterminacy* in evaluation for borderline cases—not that negative additions are permissible or beneficial.

  ### Standard Fixes & Their Costs
  Here's how to block the argument, with tradeoffs:

  1. **Reject Premise (2): Insist on a Sharp Cutoff**  
     - **Fix:** Claim there's a precise welfare level (e.g., *w* = 0) where life flips from not-worth-living to worth-living.  
     - **Cost:** Feels metaphysically arbitrary ("Why 0? Why not -0.001?"). Also clashes with phenomenological intuition that "barely worth living" is a spectrum. You pay with counterintuitive precision.  
     - **Upshot:** Easily blocks the argument. Totalism works cleanly.

  2. **Block the Inference to (4): Separate Vagueness from Value**  
     - **Fix:** Agree "worth living" is vague, but deny this affects value calculations. *w* contributes its exact value to the sum regardless of categorization.  
     - **Cost:** Accepts that for borderline lives, we have moral uncertainty ("Is adding this life good? I don't know"), but not axiological indeterminacy. This might feel unsatisfying if you crave moral clarity.  
     - **Upshot:** Preserves totalism and avoids sadism. Borderline cases are epistemically tricky but don't license adding suffering.

  3. **Reject Premise (1): Abandon Totalism**  
     - **Fix:** Deny that adding a positive-welfare person *always* increases value (e.g., adopt average utilitarianism, critical-level theories, or person-affecting views).  
     - **Cost:** Must defend an alternative axiology. Loses totalism's intuitive appeal (e.g., "More happy people = better, all else equal"). Some alternatives have their own repugnant conclusions or paradoxes.  
     - **Upshot:** Avoids sadistic RC entirely. May better match intuitions about quality vs. quantity.

  4. **Reject Iteration in (6): Impose a Value Floor**  
     - **Fix:** Argue that while *some* borderline-negative additions might be indeterminate, *clearly negative* additions (e.g., *w* < -ε) unambiguously reduce value. The sorites chain breaks before reaching "net suffering."  
     - **Cost:** Still needs a (possibly vague) boundary for "clearly negative." Risks being ad hoc unless grounded in theory (e.g., a "disvalue threshold").  
     - **Upshot:** Keeps vagueness and totalism while containing damage. No large-scale sadism.

  ### Which Fix Would I Recommend?
  **Block the inference to (4).** This is the most economical fix:  
  - It accepts the plausible vagueness of "worth living" (premise 2).  
  - It doesn't require abandoning totalism (premise 1).  
  - It exposes the argument's core equivocation.  
  - Cost: You must tolerate moral uncertainty for borderline lives—but that's a feature, not a bug. We *should* feel uncertain about whether a life at *w = -0.0001* should be created. That doesn't imply creating it is acceptable, let alone obligatory.

  ### Is the Argument Doing "Real Work"?
  Yes—but not for sadism. It shows that **totalism + vague welfare thresholds + unrestricted aggregation creates moral quagmires at the margins.** The fix above resolves this by limiting vagueness to epistemology. If you insist that axiology must be *categorically decisive* for all possible lives, you'll be forced into a sharp cutoff or sadism. But demanding categorical decisiveness is the mistake—not totalism or vagueness alone.

  **Final note on cost:** Biting the bullet on a sharp cutoff (fix 1) isn't as bad as it seems. We use arbitrary thresholds elsewhere in ethics (e.g., age of consent). If welfare is measurable, "0 = neutral" might be no more arbitrary than "18 = adult." But if welfare *isn't* precisely measurable, vagueness is unavoidable—and we should embrace fix 2.

  Let me know which path feels least painful, and we can pressure-test it.
