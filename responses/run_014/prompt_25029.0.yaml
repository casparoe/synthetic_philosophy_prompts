  ## Ethics Advisory Board Decision Memo: Polygenic Embryo Screening Pilot Proposal

  **To:** Fertility Clinic Medical Director & Board Members  
  **From:** Dr. [Your Name], Philosophy Professor & Ethics Board Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Pilot Program for Polygenic Embryo Screening (PES) for Non-Disease Traits  

  **Recommendation:** **Reject** the proposal to pilot polygenic embryo screening (PES) for predicted educational attainment and adult height at this time, in its current form.

  ### I. Core Ethical Analysis & Recommendation Justification
  Our recommendation stems from a confluence of ethical concerns, where the arguments against proceeding outweigh the claimed benefits of enhanced reproductive autonomy, particularly given the specific traits proposed and the unresolved technical limitations.

  1.  **Reproductive Autonomy vs. Normalizing Problematic Parental Dispositions:**
      *   **The Strongest Pro Argument:** The medical director correctly identifies a core principle: reproductive autonomy. Parents make countless decisions impacting a child's future (schools, nutrition, activities). Denying them potentially relevant information at the embryo stage *could* appear inconsistent and paternalistic. Selecting *against* devastating monogenic disorders establishes a precedent for using genetic information to prevent suffering.
      *   **Why Autonomy Does Not Carry the Day Here:**
          *   **Nature of the Traits:** Educational attainment and height are fundamentally different from monogenic disorders like Tay-Sachs. They are complex, non-pathological traits deeply embedded in social context and personal identity. Selecting *for* these traits shifts the paradigm from preventing suffering to optimizing perceived advantage or conforming to societal ideals. This crosses a significant normative threshold.
          *   **Expressing Conditional Acceptance:** The act of selecting an embryo based on predicted performance in socially-valued domains (like education) or physical characteristics (like height) *inherently* expresses a conditional attitude towards the future child. It signals that the child's worth is partially contingent on meeting predicted specifications. This stands in stark tension with the foundational ethical norm of *unconditional parental acceptance*, crucial for a child's psychological well-being and intrinsic value recognition. While parents make post-birth choices, embryo selection based on non-disease polygenic scores represents a unique, foundational act of *pre-selection* that risks normalizing a consumerist, optimization-focused approach to parenthood incompatible with this core norm. The clinic's endorsement via offering this service actively participates in this normalization.

  2.  **The Non-Identity Problem: A Slick but Insufficient Dodge:**
      *   **The Argument:** Selecting embryo A over B based on a higher PES results in the existence of Child A, who otherwise wouldn't exist. Since Child A isn't worse off than non-existence (a dubious comparison), and Child B never exists to be harmed, no one is harmed.
      *   **Why It Fails to Resolve Concerns:**
          *   **Harm Beyond Individuals:** The non-identity problem focuses narrowly on harm to the specific child brought into existence. It does not address the *broader societal harms*: the normalization of trait selection, the potential exacerbation of inequality, the commodification of children, or the erosion of the principle of unconditional acceptance discussed above.
          *   **Parental Motivation and Expectations:** Even if Child A isn't "harmed" compared to non-existence, the *motivation* for their selection (e.g., predicted higher education score) creates specific parental expectations. Failure to meet those predictions (which is statistically likely given the scores' probabilistic nature and environmental influence) could lead to significant disappointment, family dynamics issues, or pressure on the child – harms occurring *within* the existing child's life.
          *   **Collective Action Problem:** Widespread adoption of such selection could alter societal norms and expectations around children and disability/non-conformity in problematic ways, a harm the non-identity framework ignores.

  3.  **Justice in Healthcare: A Concrete and Unresolved Flaw:**
      *   **The Problem:** The polygenic scores for EA and height have demonstrably lower predictive accuracy and utility for individuals of non-European ancestry. Offering this service as a clinical tool, especially one framed as giving an embryo "the best shot at a good life," would:
          *   Provide systematically less reliable information to non-European patients.
          *   Potentially exacerbate existing health disparities by offering a perceived advantage predominantly to one population group.
          *   Risk misleading all patients, but disproportionately mislead patients from underrepresented groups, about the actual significance and certainty of the scores.
      *   **Why This is Decisive:** Even if the profound philosophical concerns above were deemed surmountable (which we do not concede), the justice issue alone warrants rejection. Providing a service with known, significant, and group-based differential performance violates fundamental principles of equity and fairness in healthcare delivery. The proposal lacks any concrete plan to mitigate this bias or adequately inform patients of its limitations in a clinically actionable way. The director's failure to address this adequately demonstrates the proposal's ethical immaturity.

  ### II. Addressing the "Losing Side" (Pro-Autonomy) Directly
  We acknowledge the sincerity and weight of the reproductive autonomy argument. Trusting parents is paramount. However, autonomy is not absolute. Society justifiably restricts parental choices that cause direct harm (e.g., neglect) or violate fundamental rights. This proposal involves the clinic facilitating a novel form of selection that:

  1.  Targets non-disease traits, moving beyond the established medical paradigm of preventing suffering.
  2.  Risks normalizing a disposition towards children that is conditional on predicted advantageous traits.
  3.  Utilizes a technology with demonstrable, unjust differential performance across populations.

  The potential harm here is not primarily direct physical harm to a specific child (though psychological risks exist), but rather the *normalization of a problematic practice* and the *exacerbation of systemic injustice*. Protecting against these harms constitutes a legitimate constraint on autonomy in this specific clinical context. Refusing to offer this particular service is not paternalistic denial of information relevant to health; it is a reasoned ethical judgment that offering trait-selection for EA and height crosses a line concerning the clinic's role in shaping parental expectations and upholding equity.

  ### III. The Bottom Line & Implementation
  *   **Recommendation:** **Reject** the pilot program for PES for educational attainment and adult height as currently proposed.
  *   **Implementation:** The clinic will **not** implement polygenic embryo screening for non-disease traits at this time.
  *   **Path Forward:** The Ethics Board strongly recommends the clinic:
      1.  **Focus on Validity & Equity:** Invest in/direct research efforts towards rigorously validating polygenic scores *across diverse populations* for *medically-relevant* endpoints (e.g., complex disease risk with high morbidity) before reconsidering any clinical application. Prioritize closing the ancestry-based performance gap.
      2.  **Develop Robust Ethical Frameworks:** Initiate a formal process, involving ethicists, clinicians, geneticists, and community representatives, to develop clear, specific criteria for evaluating *which* polygenic traits (if any) might be appropriate for clinical screening, grounded in preventing significant suffering and ensuring justice. This must explicitly address the concerns about conditional acceptance and normalization.
      3.  **Enhance Genetic Counseling:** Strengthen protocols for comprehensive genetic counseling regarding the probabilistic nature, limitations, and social/ethical implications of all forms of genetic information provided to IVF patients, including existing PGT-A.

  **Signed,**  
  Dr. [Your Name]  
  Chair, Ethics Advisory Board
