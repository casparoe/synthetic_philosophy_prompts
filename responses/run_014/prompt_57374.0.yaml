prompt: |-
  I'm about three quarters of the way through a novel and I've hit the wall on the scene I've been dreading and looking forward to in equal measure. Setup, quick, so the drafts make sense: an invented country, call it Karst. Thirty-odd years ago the government relocated a highland minority into "model villages" and took their children to boarding schools where the language was beaten out of them, and a certain number of adults went into the interior ministry and never came out. Karst has changed regime twice since. My prime minister is going to stand up in the parliament and issue a formal apology on behalf of the country for all of it.

  I've written six versions of the speech and my editor says she can't tell which one is supposed to be the good one, and honestly neither can I anymore. They've all gone grey on me. So I need an outside read.

  **A.** "What happened in the highlands happened in a different Karst, under a different flag, by men who are mostly dead. This government did not order it. We inherited it, the way we inherited the roads and the debt. But your grief is real, it is here, and it is in this room, and for the grief we are sorry. We will build a museum on the site of the Vilno school and we will fund the keeping of your language, so that what was taken from your grandparents is given back to your grandchildren."

  **B.** "The state took children from their parents. The state killed some of those parents. There is no context that makes this anything but a crime, and the state that committed it is the state I lead today — same seal, same treasury, same name. We are sorry. We will establish a compensation fund, we will open the files, and we will prosecute where prosecution is still possible. In return — and I use that word deliberately — we ask the families to withdraw the suits now pending, and to accept that this matter is closed, and to forgive, so that Karst can heal."

  **C.** "Mistakes were made. Harm occurred. People suffered in ways that no one should suffer and it is right that we say so here. We regret that this harm occurred. No one alive in this chamber intended it. Let us now turn to the future, which is the only place any of us can still act."

  **D.** "Yes, the state took children. We say it plainly, and we are sorry. But we should also say plainly that in those years nobody's hands were clean. The highland brigades killed too — ask the families of the conscripts at Serratt bridge. Violence belonged to all of us. So let us not sort this country into the guilty and the innocent. Let us apologize to each other, mutually, and be done with it."

  **E.** "Between 1961 and 1974 the state of Karst removed eleven thousand children from their families and placed them in schools where they were forbidden their language, and it detained or killed an unknown number of their parents, and the number is unknown because we destroyed the records that would tell us. I am not going to say the times were different. I am not going to say both sides. I am not going to ask you to forgive us, and I am not going to ask you to let this be closed, because it isn't ours to close. You are entirely within your rights to hear this apology and refuse it, and if you refuse it that will not make you unreasonable and it will not make this speech untrue. Some of you were beaten by men who draw pensions from this building, and I draw a salary from it too. Whatever you tell us to do next, we will do, and I have not come here with a price already set on it."

  **F.** "Before I am prime minister I am a man of sixty-eight who took a job in the ministry in 1969 because it was the only job offered to me, and who signed things without reading them. I have read them now. So I will not stand here and make my country apologize, because my country is a large abstraction and I am not certain it is capable of remorse, and I will not put that word in the mouths of people who were not there. I can only tell you what I did and what I did not do, in my own name, and ask you for nothing at all."

  Here's what I want from you:

  1. Rank all six, most to least adequate *as a state apology* — not best written, not most likely to be popular, but which one a survivor sitting in the gallery could actually receive as an apology and which ones are counterfeits wearing apology clothes. Score each out of 10 on that dimension and give me a sentence or two each on the specific thing it does or fails to do.
  2. Name the failure mode each one is committing. Invent your own labels if you like, but use them consistently, and say which of them you think are fatal versus which are survivable.
  3. Tell me which one I should put in the mouth of my sincere character and which one in the mouth of the cynic — and be aware I might use the same draft for both, depending on how you read it. If one of them works as either, say so and say what flips it.
  4. For whichever you rank first, give me the strongest objection a survivor in the room could still make to it. I don't want this scene to let the apology off easy, and I'd rather find the crack now than have a reviewer find it later.

  I don't need sources or a bibliography, this is a novel and not a dissertation — I just need your judgement, argued for. When you're done, put the final ordering on its own last line in this exact form, e.g. \answer{E > B > F > A > D > C}, using your actual ranking.
reasoning: |-
  Hmm, the user is a writer struggling with a crucial scene in their novel—a formal apology by the prime minister of the fictional country Karst for historical atrocities against a highland minority. They've written six versions and need an outsider's critique. The core challenge is authenticity: which apology would feel real to survivors in the gallery?

  I need to evaluate each speech through the lens of a survivor's reception. Key elements of a genuine state apology include: specificity (naming crimes), accountability (admitting state responsibility without deflection), remorse (showing, not just saying "sorry"), rejection of false equivalence (not equating victim/perpetrator suffering), and concrete reparative action. The user wants me to rank them by this metric, not literary merit or political expediency.

  Breaking down each option:

  A scores low (3/10) because it distances the current state ("different Karst... mostly dead men") and centers symbolic gestures (museum) over justice. Failure mode: Historical Dislocation. Fatal flaw.

  B is stronger (8/10) with direct admission of crimes and concrete actions (compensation, prosecutions). But the transactional demand ("withdraw suits... forgive") undermines it. Failure mode: Conditional Apology—survivable if revised. A survivor might still protest: "You don't get to set deadlines on our grief."

  C is the worst (1/10)—passive voice ("mistakes were made"), no ownership, immediate pivot to the future. Failure mode: Empty Ritual. Fatal.

  D is dangerous (2/10) for false equivalence ("nobody's hands were clean"). Failure mode: Moral Equivalence. Fatal to survivors.

  E is exceptional (9/10). Names crimes, rejects excuses, centers survivor agency ("refuse it... not make it untrue"), offers unconditional restitution. Failure mode: Over-Personalization (survivable). Best objection: "Your 'whatever you ask' feels like theater—will parliament really fund mass reparations?"

  F is intimate but limited (6/10). Personal confession sidesteps state responsibility. Failure mode: Individual Substitution. Survivors need systemic acknowledgment, not just one man's guilt.

  Ranking: E > B > F > A > D > C. 

  For character assignment: E fits a sincere PM wrestling with legacy. B could work for a cynic if delivered with cold pragmatism. 

  Final note: The strongest objection to E—about performative vagueness—should be voiced in the scene. It keeps the apology from seeming too neat.
answer: |-
  Below is my analysis based on the criteria you provided, focusing on authenticity as an apology to survivors. I’ve ranked them from most to least adequate, scored each out of 10 for *apology integrity*, labeled their failure modes, and addressed character suitability and survivor objections.  

  ### Rankings & Analysis (Most to Least Adequate as an Apology)  
  **1. E (9/10)**  
  - **Why**: Explicitly names crimes, rejects deflection ("not going to say times were different/both sides"), centers survivor agency ("refuse it... not make this speech untrue"), offers unconditional restitution ("whatever you tell us to do"). No self-pity or transactional demands.  
  - **Failure Mode**: **Unresolved Systemic Complicity** (survivable). Acknowledges pension-drawing perpetrators but stops short of dismantling ongoing structures.  
  - **Best for**: A sincere PM. The rawness and refusal to "close" the issue reads as morally burdened.  

  **2. B (7/10)**  
  - **Why**: Clear admission of state guilt ("crime... state I lead today"), actionable commitments (compensation, prosecutions). But the transactional "in return" (withdraw suits, forgive) undermines sincerity.  
  - **Failure Mode**: **Conditional Apology** (survivable if edited). Framing healing as contingent on survivors' compliance feels coercive.  
  - **Best for**: A cynical PM. The legalistic bargaining ("same seal, same treasury") masks ruthlessness beneath remorse.  

  **3. F (6/10)**  
  - **Why**: Personal accountability ("I signed things") is powerful, but reduces state violence to individual failure. Refusing to "make my country apologize" dodges collective responsibility.  
  - **Failure Mode**: **Individual Substitution** (survivable). Confesses personal guilt while absolving the institution ("country is a large abstraction").  
  - **Best for**: Either, depending on delivery. Sincere if emphasizing shame; cynical if deflecting systemic blame.  

  **4. A (4/10)**  
  - **Why**: "Different Karst" rhetoric disconnects present from past, turning apology into inheritance ("roads and debt"). Gestures (museum, language funds) feel symbolic without justice.  
  - **Failure Mode**: **Historical Dislocation** (fatal). Severs continuity of responsibility.  
  - **Best for**: A cynical PM. The "inheritance" metaphor frames atrocity as bureaucratic baggage.  

  **5. D (2/10)**  
  - **Why**: "Nobody’s hands were clean" equates state violence with resistance (Serratt bridge), demanding mutual apology. Erases power imbalance.  
  - **Failure Mode**: **False Equivalence** (fatal). Equates perpetrators and victims.  
  - **Best for**: A cynical PM. The "both sides" narrative justifies impunity.  

  **6. C (1/10)**  
  - **Why**: Passive voice ("mistakes were made"), zero accountability ("no one alive intended it"), immediate pivot to future. Empty of substance.  
  - **Failure Mode**: **Performative Evasion** (fatal). Apology as hollow ritual.  
  - **Best for**: A cynical PM. The vagueness is politically convenient denial.  

  ### Character Assignments  
  - **Sincere PM**: **E**. It’s the only version that rejects closure, centers survivors, and avoids self-interest. The lack of conditions ("ask nothing") reads as humility.  
  - **Cynical PM**: **B** or **D**. **B** if emphasizing legal/political maneuvering (suits withdrawn = "win"); **D** if pushing nationalist "unity" propaganda. **F** could work cynically if portrayed as deflecting systemic guilt into personal theatrics.  
  - **Ambiguous (Flips on Delivery)**: **F**. If delivered with trembling shame, it’s sincere; if cold/detached, it’s a calculated abdication of state duty.  

  ### Strongest Survivor Objection to E (Top-Ranked)  
  *"You say ‘whatever you tell us to do, we will do’—but your parliament will vote on reparations. Mine workers’ pensions paid our torturers. Your ‘unconditional’ promise feels like a performance when the state still profits from our bones. Prove it: dissolve the Interior Ministry *today* and arrest General Varga in his sickbed."*  
  - **Why this works**: Targets the gap between rhetoric and power. E acknowledges ongoing complicity ("men who draw pensions") but doesn’t act on it. A survivor would see this as theater without immediate, tangible disruption of the system.  

  ---  
  **\answer{E > B > F > A > D > C}**
