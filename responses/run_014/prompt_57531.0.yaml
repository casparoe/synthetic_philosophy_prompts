  For affected students, we'll add opt-out roles (international observers/journalists) and make all trauma events fictional (e.g. "Green River Massacre" not real locations). The 8-person version collapses some roles but keeps the core bargain intact.

  Debrief questions should connect game moments to real cases: "When the ICC card flipped, how did Colonel Mbeki's testimony change? Compare to Rwandan gacaca courts reducing sentences for confession." That concrete link is what'll make theory stick.
answer: |-
  Here’s a turnkey simulation for your seminar, designed to force experiential learning about transitional justice trade-offs. It uses fictional groups/events to avoid real-world trauma while preserving structural realism.

  **Fictional Setting:**  
  *Country:* Veridia  
  *Conflict:* 20-year dictatorship (The "National Restoration Council" / NRC) vs. democratic rebels ("Liberty Front" / LF) and oppressed minority ("Sunrise Collective" / SC).  
  *Transition:* NRC ceded power after negotiated settlement. New coalition government (LF + moderates) now oversees the Truth & Reconciliation Commission (TRC).  

  ---

  ### **ROLES (18 Students)**  
  *(Print each role sheet separately; mark confidential sections "DO NOT SHARE")*  

  1. **New Government Negotiators (x4)**  
     *Goal:* Stabilize country; secure evidence archive; prevent coup.  
     *Secret:* Only have resources to prosecute **3 high-level offenders**. Blanket amnesty risks UN sanctions.  
     *Control:* Draft amnesty rules; allocate prosecution slots.  
     *Card:* "NRC threatens to burn archives unless blanket amnesty is granted."  

  2. **NRC Security Commanders (x4)**  
     *Goal:* Avoid prison; retain wealth/status; protect subordinates.  
     *Secret:* Hold physical archive of evidence (location known only to them). One holds key to vault ("Vault Captain").  
     *Card:* "If pressured, burn the archive (eliminates 80% of evidence)."  

  3. **Mid-Level Perpetrators (x4 - 2 NRC, 2 LF)**  
     *Goal:* Gain amnesty; avoid being scapegoated.  
     *Secret:* Know specific atrocities (each has 1 true event card); can implicate superiors. LF perpetrators fear victim backlash.  

  4. **Victim Delegation (SC + Families) (x4)**  
     *Goal:* Get truth; memorialize victims; punish worst offenders.  
     *Secret:* Hold eyewitness testimonies (fragmented; less evidence on elites).  
     *Card:* "Threaten street protests if high-level amnesties granted."  

  5. **TRC Panelists (x2)**  
     *Goal:* Extract confessions; build public record.  
     *Control:* Conduct amnesty hearings (5-min private interviews with applicants).  

  ---

  ### **MATERIALS**  
  - **Role Sheets** (as above; include confidential goals)  
  - **Event Cards** (5 key atrocities; ground truth known only to you):  
    > *E.g., "Green River Massacre: 200 civilians killed by NRC Battalion 3 under Col. Mbeki."*  
  - **Evidence Tokens** (Paper clips = physical evidence; Sticky notes = testimonies)  
  - **Amnesty Application Forms** (Template: *"Describe your crime fully. Names = amnesty consideration."*)  
  - **ICC Jurisdiction Card** (Sealed envelope for mid-game)  
  - **Prosecution Tokens** (3 red chips = state's prosecution capacity)  

  ---

  ### **TIMELINE (120 Mins)**  
  **0:00-0:15**  
  - Assign roles; distribute private briefings.  
  - Clarify: TRC hearings begin in 30 mins; deal must be struck in 90 mins.  

  **0:15-0:45**  
  - *Blind Negotiation Phase:*  
    - Groups caucus separately (Gov’t, NRC, Victims, Perpetrators).  
    - TRC Panelists draft hearing rules (public/private? name names?).  
    - *Pressure:* NRC Commanders hint at archive destruction if blanket amnesty denied.  

  **0:45-1:15**  
  - *TRC Hearings:*  
    - Perpetrators apply for amnesty via private TRC interviews (5 mins each).  
    - TRC Panelists award conditional amnesty (or not) based on "full disclosure."  
    - *Catch:* TRC hears only what applicants *choose* to admit.  

  **1:15-1:25**  
  - **‼️ MID-GAME TWIST ‼️**  
    - Hand **ICC Envelope** to Government:  
      > *"BREAKING: ICC claims jurisdiction over crimes against humanity in Veridia. Commanders now ineligible for domestic amnesty."*  
    - *Observe:* Lower-level perpetrators rush to confess (seeking sentence reductions).  

  **1:25-1:50**  
  - *Deal-Making Frenzy:*  
    - NRC threatens archive destruction. Victims threaten protests.  
    - Gov’t offers plea deals to mid-level perpetrators (confess = lighter sentence).  
    - TRC compiles "public record" from amnesty applications.  

  **1:50-2:00**  
  - *Final Bargain:*  
    - Gov’t submits final amnesty/prosecution list.  
    - Reveal **Ground Truth** (your pre-written event cards).  
    - Compare to TRC’s "official record."  

  ---

  ### **STAKES & PAYOFFS (No Money Needed)**  
  - **Prosecution Tokens** = Only 3 can be spent (symbolizes state capacity).  
  - **Archive Survival** = If burned, no physical evidence for memorials/history.  
  - **"Legitimacy Points"** = Groups gain/lose based on:  
    - Victims: Truth recorded? Leaders prosecuted?  
    - NRC: Archives burned? Commanders protected?  
    - Gov’t: Transition stable? Sanctions avoided?  

  ---

  ### **PREDICTABLE FAILURES & FIXES**  
  1. **NRC Burns Archive Too Early:**  
     *Fix:* Remind NRC their goal is *leverage*—burning ends negotiation.  

  2. **Victims Silenced:**  
     *Fix:* Secretly prompt Victim roles: *"Your protest threat gains power if media leaks your testimonies."*  

  3. **Unrealistic Deal (e.g., All Amnestied):**  
     *Fix:* Enforce prosecution token scarcity; announce UN sanctions if no accountability.  

  4. **ICC Twist Ignored:**  
     *Fix:* Have TRC Panelists announce: *"New ICC rules require us to deny amnesty for Crimes Against Humanity."*  

  ---

  ### **WHAT THE SIMULATION CAN'T REPRODUCE**  
  - **Emotional Trauma:** Real victims’ testimony isn’t "fragmented evidence."  
    *Mitigation:* Stress fictional setting; avoid graphic event details.  
  - **Long-Term Social Impact:** The simulation can’t show how skewed records fuel future conflict.  
    *Mitigation:* Debrief with real case comparisons (e.g., South Africa vs. Rwanda).  

  ---

  ### **IF AFFECTED STUDENT PARTICIPATES**  
  - Offer observer/journalist role (track deals for "Veridia Times").  
  - Pre-seminar private opt-out: *"Next week’s simulation involves fictional state violence. See me if you need alternatives."*  
  - Never assign victim/perpetrator roles to affected students.  

  ---

  ### **STRIPPED-DOWN VERSION (50 Mins, 8 Students)**  
  **Roles:**  
  - Gov’t (x2)  
  - NRC Commander (x1 + Vault Captain card)  
  - Victims (x2)  
  - Mid-Level Perpetrator (x2)  
  - TRC Chair (x1)  

  **Simplified Flow:**  
  1. **10 mins:** Caucus (Gov’t/NRC/Victims).  
  2. **20 mins:** TRC hearings (2 perpetrators; 5 mins each).  
  3. **5 mins:** **ICC Card** dropped.  
  4. **10 mins:** Final deal.  
  5. **5 mins:** Ground truth reveal.  

  **Adjustments:**  
  - Reduce atrocities to 3 key events.  
  - Gov’t has only **1 prosecution token**.  
  - TRC Chair controls amnesty rules unilaterally.  

  ---

  ### **DEBRIEF GUIDE**  
  1. **Power vs. Justice:**  
     - *"Who set the amnesty price? Was it moral desert or leverage (archives/threats)?"*  
  2. **ICC Pivot:**  
     - *"How did confessions change after the ICC card? Why might Rwanda’s gacaca courts offer sentence reductions?"*  
  3. **The Record Gap:**  
     - *"Compare the TRC record to ground truth. What’s missing? Who benefited from the skew?"*  
  4. **Real-World Links:**  
     - *"Where did Veridia mirror South Africa? Where did it avoid a Guatemala-style 'hidden archive' problem?"*  

  This forces confrontation with the core trade-off: **truth costs amnesty, amnesty obscures truth, and power sets the price.** No one gets a free lunch.  

  Let me know if you need refined role sheets or event card templates.
