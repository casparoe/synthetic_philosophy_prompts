prompt: |-
  I've been going back and forth on whether pragmatic encroachment and epistemic contextualism are actually distinct views or just two ways of saying the same thing. Here's my worry: on encroachment the subject's knowledge itself is stake-sensitive, so "S knows that p" comes out true in a low-stakes case and false in a high-stakes one even though S has exactly the same evidence. But that just sounds like the truth of the attribution is shifting with the context, which is literally what contextualism says. So am I right that encroachment collapses into a kind of contextualism, or is there a real difference in where the variation is located that I'm missing?
reasoning: |-
  Okay, the user is grappling with the distinction between pragmatic encroachment and epistemic contextualism. They're wondering if these two views are actually the same thing because both seem to make knowledge attributions sensitive to practical stakes. Let me unpack this carefully.

  First, I need to recall the core of each position. Pragmatic encroachment argues that knowledge itself is affected by non-epistemic factors like stakes. So, even with identical evidence, a person might know something in low stakes but not in high stakes. On the other hand, contextualism says that the meaning of "knows" shifts based on the attributor's context. The truth conditions change, not the knowledge state itself. 

  The user's confusion is understandable because both theories explain why we might say "S knows" in one situation and "S doesn't know" in another with the same evidence. But where does the variation happen? For encroachment, it's in the subject's epistemic state. For contextualism, it's in the language used to attribute knowledge. 

  I should highlight key differences. Contextualism is semantic; it's about how language works. Encroachment is metaphysical; it's about what knowledge is. Also, contextualism involves the attributor's context affecting the standards, whereas encroachment focuses on the subject's practical situation. 

  The user might be missing that contextualism keeps the threshold fixed in the subject's context but allows the attributor's context to change what counts as "knows." Encroachment changes the threshold for the subject based on their stakes. 

  Examples would help. Bank Case A vs. B: Hannah in low stakes vs. high stakes. For encroachment, her knowledge itself changes. For contextualism, the word "knows" means different things when we say she knows in A but not in B. 

  Also, consider who affects the context. In contextualism, different attributors could have different truth values for the same subject at the same time. That's not possible in encroachment. 

  The user's deeper need might be understanding how to differentiate these theories in arguments or apply them correctly. They might be preparing for a paper or exam. Clarifying the locus of variation is crucial. I should emphasize the subject vs. attributor distinction and the nature of the variation—semantic versus metaphysical. 

  I should also mention that some philosophers think contextualism can explain intuitions without encroachment, while others argue they can complement. But the collapse isn't inevitable; they address different issues. Making sure the user sees that the mechanisms and philosophical commitments differ even if they handle similar cases.
answer: |-
  You've hit on a genuinely tricky point where the boundaries between pragmatic encroachment (PE) and epistemic contextualism (EC) blur. While they often yield similar verdicts in cases like *Bank Cases A & B*, they **are distinct theories with fundamentally different mechanisms and philosophical commitments**. The key difference lies in **where the variation is located** and **what kind of variation it is**.

  Here's a breakdown of the crucial distinctions, addressing your worry:

  1.  **Locus of Variation:**
      *   **Pragmatic Encroachment (PE):** Variation occurs **in the epistemic state of the subject (S)**. Whether S *knows* p *at time t* depends *constitutively* on S's practical situation (stakes, interests, etc.) *at t*. The *truth conditions* of the proposition "S knows that p" change for S depending on their practical context.
      *   **Epistemic Contextualism (EC):** Variation occurs **in the semantic meaning/content of the word 'knows' and the sentence 'S knows that p'**. The *same epistemic state* of S can be correctly described as "knowing p" in one conversational context (with lower standards) and *not* correctly described as "knowing p" in another context (with higher standards). The subject's epistemic state itself *doesn't change* with the practical context; only the language used to describe it does.

  2.  **Nature of the Variation:**
      *   **PE:** The variation is **metaphysical/epistemic**. What it *is* for S to *possess knowledge* changes. Stakes literally alter the epistemic relation required between S and p. The threshold of justification/reliability/safety required for *knowledge itself* rises with higher stakes.
      *   **EC:** The variation is **semantic/pragmatic**. The *meaning* of the word "knows" (specifically, the epistemic standard it expresses) shifts depending on the context of the speaker making the attribution. The threshold for what counts as satisfying "knows" in an utterance changes, but what constitutes knowledge *as a state* remains constant (it's meeting whatever the relevant invariant standard is for that context).

  3.  **What Stays Constant?**
      *   **PE:** The *word* "knows" has a stable meaning (roughly: true justified belief meeting a *stakes-relative* threshold). What changes is the *threshold itself* relative to S's situation.
      *   **EC:** The *epistemic state* required for knowledge is stable (roughly: true justified belief meeting a *contextually invariant* threshold). What changes is the *semantic value* of "knows" (i.e., *which* invariant threshold it refers to in a given context).

  **Why Your Worry is Understandable (But Doesn't Lead to Collapse):**

  You're absolutely right that both views make the *truth value* of an utterance of "S knows that p" sensitive to practical factors. The crucial difference is *whose* practical factors and *what kind* of sensitivity:

  *   **PE:** The truth value of "S knows that p" (uttered in *any* context) depends on **S's practical situation**. The subject's stakes directly determine whether the knowledge relation obtains.
  *   **EC:** The truth value of an utterance "S knows that p" depends on **the attributor's conversational context**. The attributor's context determines the meaning/semantic standard of "knows" being used *in that utterance*.

  **The "Bank Case" Test - Illustrating the Difference:**

  Imagine Hannah in a *high*-stakes situation regarding the bank being open on Saturday (she'll lose her house if it's closed and she doesn't deposit). She has the same evidence as in the low-stakes case.

  *   **PE Verdict:** Hannah, *in her high-stakes situation*, **does not know** the bank is open. Her high stakes raise the epistemic threshold required for knowledge *for her*. An utterance "Hannah knows the bank is open" is **false**, regardless of who says it or when.
  *   **EC Verdict:** Hannah possesses the *same epistemic state* she had in the low-stakes case. Whether an utterance "Hannah knows the bank is open" is true or false depends on the context of the *speaker* making the attribution.
      *   If the speaker is in a *low*-standards context (e.g., discussing casual plans), the utterance **is true**.
      *   If the speaker is in a *high*-standards context (e.g., discussing the risk of losing her house), the utterance **is false**.

  **The "Simultaneous Attributors" Thought Experiment:**

  This highlights the core difference:

  Imagine two people discussing Hannah *at the same time*, while she is in her *high*-stakes situation:
  *   Attributor A: In a low-standards context (e.g., "Can Hannah meet us for coffee Saturday morning?").
  *   Attributor B: In a high-standards context (e.g., "Is Hannah taking a huge financial risk by not depositing tonight?").

  *   **PE:** Both attributors *should* say Hannah does *not* know the bank is open. Her high stakes mean she doesn't possess knowledge. PE predicts **no variation** between A and B's correct attributions. Both utterances "Hannah knows" are **false**.
  *   **EC:** Attributor A can correctly say "Hannah knows the bank is open" (low standards in play). Attributor B can correctly say "Hannah does *not* know the bank is open" (high standards in play). EC predicts **variation** based on the attributor's context. Both utterances can be **true relative to their own context**.

  **Conclusion:**

  You are *not* missing that they yield similar results in many cases – they absolutely do. However, **pragmatic encroachment and epistemic contextualism are distinct views.** The collapse you worry about doesn't happen because:

  1.  **PE locates variation in the subject's epistemic state** (knowledge itself is stakes-sensitive), while **EC locates variation in the semantic content of 'knows'** (the word's meaning is context-sensitive).
  2.  This difference manifests clearly in scenarios like the "Simultaneous Attributors" test: PE predicts uniform attributions based on the *subject's* stakes, while EC predicts divergent attributions based on the *attributor's* context.
  3.  PE offers a metaphysical claim about the *nature* of knowledge (it's partly practical), while EC offers a semantic claim about the *language* of knowledge attribution.

  The debate is complex, and some hybrid views exist, but the core distinction in *where* and *what kind* of variation occurs prevents a straightforward collapse of PE into EC or vice versa. Your intuition that they sound similar is common, but the locus of variation difference is fundamental.
