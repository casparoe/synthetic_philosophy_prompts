answer: |-
  Below is a ten-question diagnostic quiz designed to sort students into the seven major positions on the paradox of voting. Questions avoid jargon and focus on concrete scenarios that reveal underlying intuitions. Each question has 2–3 answer options weighted to reflect key fault lines.

  ---

  ### **The Voting Paradox Quiz**
  *Instructions: For each scenario, choose the option that best reflects your intuition. There are no right or wrong answers—this assesses how you naturally reason.*

  1.  **The Tiny Chance:**  
      Imagine a national election where your preferred candidate has a 50% chance of winning. The chance your single vote decides the outcome is less than 1 in 10 million. Voting costs you 30 minutes of time and mild hassle.  
      **A)** The tiny chance isn’t worth the cost. It’s practically impossible my vote matters.  
      **B)** Even a tiny chance matters when the outcome is so important.  
      **C)** Whether it decides anything isn’t really the point of voting.  

  2.  **The Symbolic Button:**  
      Suppose you could press a button that publicly signals your support for Candidate A, but pressing it has *zero* effect on the election outcome. Pressing the button costs 30 minutes.  
      **A)** Pressing it is pointless; it changes nothing.  
      **B)** I’d still press it to show where I stand.  

  3.  **The Empty Booth:**  
      You arrive at your polling place and discover, to your surprise, that you are the *only* person voting today in this entire election. Your vote will definitely decide the winner.  
      **A)** This feels fundamentally different and much more urgent. My vote finally *does* something real.  
      **B)** It feels similar to a normal election – I’m still just doing my part.  

  4.  **The Free Ticket:**  
      You plan to vote but get stuck in bad traffic. You realize you’ll miss your favorite concert if you go vote. A friend offers you a free concert ticket for tomorrow if you skip voting today.  
      **A)** I’d take the ticket. Voting likely won’t change anything, but the concert is a sure benefit.  
      **B)** I’d still vote. Skipping feels wrong, regardless of the concert.  

  5.  **The One-Vote Loss:**  
      After an election, you learn your preferred candidate lost by exactly *one* vote. You chose not to vote because it was inconvenient.  
      **A)** I’d feel intense regret and kick myself. I caused the loss.  
      **B)** I’d feel bad my side lost, but not specifically guilty. My one vote vanishingly rarely makes that difference.  

  6.  **The Universal Excuse:**  
      What if everyone who found voting even mildly inconvenient decided not to vote?  
      **A)** That would be disastrous! Elections would fail. So *I* shouldn’t use that excuse.  
      **B)** That’s unrealistic. My individual choice doesn’t cause everyone else to quit. My calculation is just about my action.  

  7.  **The Group Pledge:**  
      You join a volunteer group supporting Candidate A. The group collectively pledges to get 100 members to the polls. 99 members show up. You’re running late and voting would make you miss an important appointment.  
      **A)** I’d skip. The group will almost certainly still get 99 votes without me. My vote still probably doesn’t matter.  
      **B)** I’d vote. I made a commitment to the group. We promised 100.  

  8.  **The Massive Stakes:**  
      Imagine an election where the winning policy will save 100 million lives or doom them. The chance your vote decides this is 1 in 100 million. Voting costs 30 minutes.  
      **A)** The potential impact (saving 100 million lives scaled by the tiny chance) is still worth more than 30 minutes. I must vote.  
      **B)** A 1 in 100 million chance is effectively zero, even with huge stakes. It’s still irrational based on my personal impact.  
      **C)** The sheer size of the stakes creates a moral duty to vote, separate from the probability.  

  9.  **The Meaningless Primary:**  
      You live in a state where the primary election result for your preferred party is a total foregone conclusion – your candidate will win 90% of the vote no matter what. Voting is still somewhat inconvenient.  
      **A)** No point in voting. My vote definitely changes nothing here.  
      **B)** I’d still vote. It’s about participating and supporting my candidate, not just changing the outcome.  

  10. **The Perfect Poll:**  
      A perfectly accurate poll the day before the election shows Candidate A winning by 10,000 votes in your district. Voting is inconvenient.  
      **A)** I’d skip. My vote can’t possibly matter given this huge lead.  
      **B)** I’d still vote. Polls aren’t perfect, and a lead isn’t a guarantee.  
      **C)** I’d still vote. It’s my duty, regardless of polls.

  ---

  ### **Scoring Key & Position Mapping**

  **Instructions:** Tally how many times you chose each letter (A, B, C) across all 10 questions. Use the patterns below to see which positions your answers align with. Most students will lean towards 1-2 primary positions. Overlap is common and noted.

  1.  **Mostly A (Cost/Benefit Focus):** Favors answers prioritizing low personal cost/benefit ratio.  
      *Leans Towards:* **Rational-Irrationality/Ignorance** (Voting is generally irrational instrumentally; people do it due to misjudgment or non-rational motives).  
      *Strong Signals:* A1, A2, A4, A5, A8, A9, A10.

  2.  **Mostly B (Non-Instrumental / Duty / Group Focus):** Favors answers based on expression, duty, group commitment, or rejecting pure probability focus.  
      *Leans Towards:* Multiple positions. Look for clusters:  
      *   **Expressive Voting:** Strong B2, B9; Often B3, B5, B8C. (Voting as symbolic expression).
      *   **Duty-Based Voting:** Strong B4, B10C; Often B3B, B6A, B8C. (Voting as a moral/civic obligation).
      *   **Group-Agency Voting:** Strong B7; Often B3B, B6A. (Voting as fulfilling a group commitment).
      *   **Minimax Regret:** Strong B5A; Often B1B, B10B. (Voting to avoid worst-case regret).
      *   **Ethical-Altruistic:** Strong B8A; Often B1B, B6A. (Voting because scaled stakes outweigh tiny probability).

  3.  **Mostly C (Universalization / Magnitude Focus):** Favors answers invoking universal rules or sheer moral weight of stakes.  
      *Leans Towards:*  
      *   **Rule-Consequentialist Voting:** Strong C6A; Often C3B, C8C. (Voting because universal non-voting is bad).  
      *   **Ethical-Altruistic Voting:** Strong C8A. (Voting because scaled stakes justify cost).
      *   **Duty-Based Voting:** Strong C8C, C10C. (Voting as duty, especially under high stakes).

  **Mapping Answer Patterns to Positions:**

  *   **Expressive Voting:** High B2, B9. Likely also B3B, B5B, B8C. Low A1, A4, A9.
  *   **Ethical-Altruistic Voting:** High B8A (or C8A). Likely also B1B, B6A. Low A1, A8B. *May overlap with Rule-Consequentialist (B6A/C6A) or Duty (B8C/C8C) on some answers.*
  *   **Duty-Based Voting:** High B4, B10C (or C10C). Likely also B3B, B5B, B6A, B8C/C8C. Low A4, A10A. *Hard to distinguish cleanly from Group-Agency (B7) or Rule-Consequentialist (B6A/C6A) in some cases.*
  *   **Rule-Consequentialist Voting:** High B6A / C6A. Likely also C3B, C8C. Low A6B. *Shares "universal" reasoning (B6A/C6A) with Ethical-Altruistic and sometimes Duty.*
  *   **Minimax Regret:** High B5A. Likely also B1B, B10B. Low A5B. *May overlap with Ethical-Altruistic (B1B) on probability assessment.*
  *   **Rational-Irrationality/Ignorance:** High A1, A2, A4, A5B, A8B, A9, A10A. Low B2, B4, B9. *Cleanest separation: rejects non-instrumental reasons.*
  *   **Group-Agency Voting:** High B7. Likely also B3B, B6A. Low A7. *Strong B7 is key; overlaps significantly with Duty-Based (commitment) and Rule-Consequentialist (universal group obligation).*

  **Ambiguities & Overlaps:**

  1.  **Duty-Based vs. Group-Agency vs. Rule-Consequentialist:** Answers B3B, B6A, B7, and C6A are shared. Distinguishing relies heavily on *why* B4/B10C (Duty), B7 (Group), or B6A/C6A (Rule) was chosen. The quiz struggles here; explicit discussion needed.
  2.  **Ethical-Altruistic vs. Rule-Consequentialist:** Both may choose B6A/C6A (universal reasoning) and B8A (scaled stakes). Rule-Consequentialism is defined by *universalization* as the primary motive, Ethical-Altruism by *aggregate benefit calculation*. The "why" matters more than the answer.
  3.  **Expressive vs. Duty-Based:** Both reject cost-benefit (A4) and may vote in foregone primaries (B9). Duty focuses on obligation (B4, B10C), Expression focuses on symbolic value (B2).
  4.  **Minimax Regret vs. Ethical-Altruistic:** Both acknowledge the tiny chance matters (B1B), but Minimax is driven by avoiding personal regret (B5A), Ethical-Altruism by aggregate benefit (B8A).

  **Logically Possible but Undefended Patterns:**

  *   **High A5A (Regret) + High A1 (Tiny Chance Irrelevant):** Acknowledges decisive-vote regret but denies the tiny chance matters. This is incoherent for Minimax Regret, which *requires* acknowledging the (small) possibility of being decisive to motivate regret-avoidance. It suggests emotional inconsistency.
  *   **High B2 (Expression) + High A1 (Tiny Chance Irrelevant) + High A4 (Skip for Concert):** Values expression but readily trades it for a small personal benefit. This is unattractive; if expression has significant value, why is it so easily overridden? Suggests expression isn't the core reason.
  *   **High B6A/C6A (Universal Matters) + High A6B (My Action Doesn't Cause Universal Defection):** Endorses universalization reasoning but denies its applicability to the individual. Logically inconsistent. Underexplored but generally seen as incoherent.
  *   **High B8A (Scaled Stakes) + High A8B (Tiny Chance = Zero):** Believes scaled stakes justify voting but also believes the decisive probability is *literally* zero (making scaled impact zero). Incoherent. (Ethical-Altruism requires non-zero probability).

  This quiz provides a springboard for discussion. Students discovering their implicit commitments before learning formal positions fosters deeper engagement with the paradox and its philosophical resolutions. Encourage them to note where their answers felt conflicting or ambiguous – these are often the most fruitful points for debate.
