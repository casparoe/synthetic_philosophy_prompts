  We are given a task to draft a decision memo for the University Faculty Senate's Ad Hoc Committee on Electoral Reform. The memo must address the charter's desiderata and the proposal to adopt ranked-choice instant runoff (IRV). We are to explain why the three desiderata cannot be jointly satisfied (due to Arrow's Impossibility Theorem), provide a concrete example, discuss what IRV does and does not achieve, and give an honest treatment of the alternative.

   The charter's desiderata for a deterministic single-winner system are:
   1. Accept any possible configuration of sincerely ranked ballots (universal domain).
   2. Each candidate must be a possible winner under some ballot configuration (non-imposition).
   3. No voter can obtain a more preferred outcome by submitting an insincere ranking (strategy-proofness).
   4. No dictator.

   However, Arrow's Impossibility Theorem shows that no voting system can satisfy universal domain, Pareto efficiency, independence of irrelevant alternatives (IIA), and non-dictatorship simultaneously when there are at least three candidates. Note that our desideratum 3 (strategy-proofness) is even stronger than IIA in some respects, and in fact, the Gibbard-Satterthwaite theorem states that no voting system with at least three options can be both strategy-proof and non-dictatorial and satisfy universal domain and non-imposition.

   Therefore, we must conclude that no voting system can satisfy all the charter's requirements when there are three or more candidates.

   The proposal is to adopt IRV (ranked-choice voting) on the grounds that it would eliminate incentives for insincere voting. However, we know that IRV is not strategy-proof. There are situations in IRV where a voter can achieve a better outcome by insincerely ranking a candidate lower or higher.

   We are to recommend a concrete course of action. Since the charter's requirements cannot be met, we must either relax the requirements or choose a system that best meets the spirit of the requirements. We note that the current system (plurality with tie-break by seniority) is known to be vulnerable to strategic voting (as seen in the last election). IRV, while not perfect, may reduce the incentives for strategic voting in some contexts.

   However, we must also consider the practical implications and the specific example from the last election.

   The memo should include:
   - An explanation of the impossibility result in accessible terms.
   - A concrete hypothetical ballot profile (modeled on the three-faction electorate) that illustrates a problem (either with the current system or with IRV).
   - What IRV does and does not achieve regarding strategic incentives.
   - The strongest argument in favor of the course of action we reject (if we reject IRV, then we must present the best case for IRV; if we accept IRV, then we must present the best case against it and for the current system or another).

   Given that the committee is considering IRV and the last election showed a problem with the current system, it is likely that we will recommend IRV, but we must be honest about its limitations.

   Alternatively, we might consider other systems (like Condorcet methods), but the proposal is for IRV. Since the memo is about the pending proposal (IRV), we focus on that.

   Structure of the memo:

   1. Introduction: Recap the problem and the proposal.
   2. Explain the impossibility: The charter's requirements cannot all be met (due to fundamental mathematical results). Use plain language.
   3. Illustrate with a concrete example: Show a scenario under the current system that led to strategic voting and then show a scenario under IRV that might still be vulnerable to strategic voting (or show how IRV would have changed the last election).
   4. What IRV does: It eliminates the "spoiler effect" to some extent and ensures that the winner has broad support. However, it does not eliminate all strategic incentives.
   5. Strongest argument for the rejected course: If we recommend IRV, then the strongest argument against IRV (and for the current system or another) is that IRV can sometimes produce winners that are less representative in a particular way (e.g., failing the Condorcet criterion) and that it can be complex. Also, the current system is simple and understood. But the strongest argument in favor of IRV is that it may reduce strategic voting compared to plurality, and it ensures the winner has majority support at some stage.
   6. Practical next steps.

   However, note that the committee's charter directs to prefer a system satisfying the three desiderata if possible. Since it's impossible, we must choose a system that best approximates the goals.

   After careful consideration, I will recommend adopting IRV because it is an improvement over the current system in reducing strategic incentives, even if it doesn't eliminate them entirely.

   But note: The example from the last election (with 38%, 33%, 29%) under IRV might have led to a different outcome. Let's simulate:

     First round: Candidate A: 38%, B: 33%, C: 29%. Candidate C is eliminated.
     Then, the votes for C are redistributed. If we assume that the supporters of C ranked B as their second choice (as was reported that some did insincerely in the plurality system), then B would get 29% more, making B: 33%+29% = 62%, and A: 38%. So B wins.

   But what if the supporters of C had sincerely ranked C first and then A? Then A would get the 29% and win. However, in the actual election, it was reported that supporters of C voted insincerely for B to block A. In IRV, they can sincerely rank C first and B second without fear of wasting their vote. So IRV would have allowed them to vote sincerely and still achieve their goal of blocking A.

   Therefore, IRV would have likely produced the same outcome (B wins) but without the need for insincere voting. This is an improvement.

   But note: There are situations in IRV where a voter might need to insincerely rank a candidate to avoid a worse outcome. For example, if a candidate is strong and might be eliminated early, a voter might insincerely rank that candidate lower to help a more preferred candidate. However, such strategies are complex and risky, and they are less common than the simple "vote for the lesser evil" in plurality.

   Given the above, I recommend adopting IRV.

