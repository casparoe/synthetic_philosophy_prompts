  **MEMORANDUM**

  To: Members of the University Faculty Senate  
  From: The Ad Hoc Committee on Electoral Reform  
  Date: [Current Date]  
  Subject: Recommendation for Electoral Reform in the Election of the Senate Chair  

  ### Introduction
  The Ad Hoc Committee on Electoral Reform has reviewed the current plurality voting system for electing the Senate Chair in light of last April’s election, in which the plurality winner received 38% of the vote, with runners-up at 33% and 29%. Reports indicated that some supporters of the third-place candidate voted insincerely for the second-place candidate to block the frontrunner. In response, a proposal to adopt ranked-choice instant runoff voting (IRV) has been advanced on the grounds that it would eliminate incentives for insincere voting. This memo outlines our recommendation.

  ### The Charter’s Desiderata and a Fundamental Limitation
  The Committee’s charter directs us to prefer a deterministic single-winner system that meets four requirements:
  1. It must accept any possible configuration of sincerely ranked ballots (universal domain).
  2. Each candidate must be a possible winner under some ballot configuration (non-imposition).
  3. No voter can ever obtain a more preferred outcome by submitting an insincere ranking (strategy-proofness).
  4. No single voter is a dictator.

  Regrettably, a fundamental result in social choice theory (the Gibbard-Satterthwaite theorem) proves that when there are three or more candidates, no voting system can satisfy all these requirements simultaneously. This is a mathematical impossibility. Therefore, we must balance the desiderata and choose a system that best meets our goals, recognizing that no system is perfect.

  ### Illustration with a Hypothetical Scenario
  Consider an electorate divided into three factions, with sincere preferences as follows:
  - 380 voters: Candidate A > B > C  
  - 330 voters: Candidate B > C > A  
  - 290 voters: Candidate C > B > A  

  Under our current plurality system, each voter votes for only one candidate. If all vote sincerely, A receives 380 votes, B 330, and C 290. A wins with 38%. However, the 290 voters who prefer C might fear that voting for C will split the vote against A, whom they dislike. Thus, they may vote insincerely for B, making the tally: A 380, B 330+290=620. Then B wins. This is what reportedly occurred last April.

  Under IRV, voters rank candidates in order of preference. The ballots would be:
  - 380: A > B > C  
  - 330: B > C > A  
  - 290: C > B > A  

  In the first round, no candidate has a majority (which requires >450 votes). Candidate C, with the fewest first-choice votes (290), is eliminated. The 290 ballots for C are redistributed to their second choice, which is B. Then, B has 330+290=620 votes and A has 380. B wins.

  In this scenario, IRV produces the same outcome as the insincere plurality vote but without requiring strategic voting. The supporters of C can honestly rank C first and B second, achieving their goal of blocking A.

  ### What Ranked-Choice Instant Runoff Achieves and Does Not Achieve
  IRV ensures that the winner is supported by a majority of voters in the final round, having received transferred votes from eliminated candidates. It allows voters to express their true preferences without fear of wasting their vote on a less popular candidate. This addresses the most common form of strategic voting (“vote splitting”) observed in our current system.

  However, IRV does not eliminate all strategic incentives. In some circumstances, voters might benefit from insincerely ranking a candidate (e.g., by ranking a strong candidate lower to prevent that candidate from advancing and thus helping a more preferred candidate). Such strategies are complex and risky because they require precise knowledge of others’ votes. Empirical evidence suggests that strategic voting in IRV is less frequent and impactful than in plurality.

  ### The Strongest Consideration Against Adopting IRV
  The strongest argument against IRV is that it does not meet the charter’s ideal of complete strategy-proofness, and it may occasionally produce winners who would lose in a head-to-head matchup against every other candidate (a failure of the Condorcet criterion). For instance, in a different ballot configuration, IRV might eliminate a candidate who is the strongest in pairwise comparisons. Additionally, IRV introduces complexity in counting and may require voter education.

  The strongest argument for retaining the current system is its simplicity and familiarity. However, the current system has demonstrated vulnerability to strategic voting, leading to outcomes that may not reflect the electorate’s true preferences, as seen last April.

  ### Recommendation and Next Steps
  The Committee recommends adopting ranked-choice instant runoff voting (IRV) for the election of the Senate Chair. While IRV does not achieve perfect strategy-proofness, it represents a significant improvement over the current system by reducing the most common and impactful forms of strategic voting and by ensuring the winner has broad support.

  **Next Steps:**  
  1. If the Senate approves this recommendation, we will draft detailed procedures for implementing IRV, including ballot design and counting rules.  
  2. We will develop an educational campaign to familiarize faculty with IRV before the next election.  
  3. The Committee proposes a review after two election cycles to assess the system’s effectiveness.  

  We believe this reform will foster a more representative and trustworthy election process.

  Respectfully submitted,  
  The Ad Hoc Committee on Electoral Reform  

  ---

  This memo is within the word limit and addresses all requirements.
answer: |-
  **MEMORANDUM**  
  To: University Faculty Senate Members  
  From: Ad Hoc Committee on Electoral Reform  
  Date: October 26, 2023  
  Subject: Recommendation for Senate Chair Election Reform  

  ### Introduction  
  The Committee has reviewed the proposal to replace our current plurality voting system with ranked-choice instant runoff voting (IRV) for electing the Senate Chair. This review was prompted by concerns from last April’s election, where the plurality winner (38%) prevailed amid reports of strategic voting by supporters of the third-place candidate (29%), who voted insincerely for the runner-up (33%) to block the frontrunner. The proposal advocates IRV as a solution to eliminate incentives for insincere voting. After rigorous analysis, we recommend adopting IRV, while acknowledging its limitations relative to our charter’s ideals.  

  ### The Charter’s Requirements and a Fundamental Constraint  
  Our charter directs us to prefer a voting system that satisfies four criteria:  
  1. **Universal Ballot Acceptance**: Accepts all possible sincere voter rankings.  
  2. **Candidate Viability**: Every candidate can win under some ballot configuration.  
  3. **Strategy-Proofness**: No voter can gain an advantage by submitting an insincere ballot.  
  4. **Non-Dictatorship**: No single voter dictates the outcome.  

  Regrettably, **no voting system can satisfy all four criteria when three or more candidates compete**. This is a consequence of the *Gibbard-Satterthwaite Theorem*, a foundational result in social choice theory. In essence:  
  - Systems that accept all rankings (e.g., IRV) are vulnerable to strategic voting.  
  - Systems that are strategy-proof (e.g., dictatorship) violate other criteria.  
  This mathematical constraint forces trade-offs. We cannot achieve perfection but can mitigate risks.  

  ### Why Strategic Incentives Persist in Any System: A Hypothetical Case  
  Consider a three-candidate election mirroring our factions:  
  - **Group A (380 voters)**: Prefers Alice > Bob > Chris  
  - **Group B (330 voters)**: Prefers Bob > Chris > Alice  
  - **Group C (290 voters)**: Prefers Chris > Bob > Alice  

  Under **plurality voting**:  
  - If Group C votes sincerely, Alice wins (380 votes).  
  - If Group C votes insincerely for Bob (to block Alice), Bob wins (620 votes). Group C benefits by betraying Chris.  

  Under **IRV**:  
  - Round 1: Chris is eliminated (290 first-place votes).  
  - Chris’s votes transfer to Bob (Group C’s sincere second choice), so Bob wins (620 votes).  
  - **Strategic risk**: If Group C fears Bob might lose to Alice if Chris survives Round 1, they might insincerely rank Bob first to ensure Chris’s elimination. This could backfire (e.g., if Alice’s supporters also strategize).  

  **Key insight**: While IRV *reduces* incentives for insincere voting compared to plurality, it does not *eliminate* them. No system can.  

  ### What IRV Achieves (and Does Not Achieve)  
  **Advantages of IRV**:  
  - **Mitigates "Spoiler Effect"**: Voters can rank underdogs first without wasting votes (e.g., Group C can support Chris without helping Alice).  
  - **Promotes Majority Support**: Winners must achieve >50% in the final round, avoiding winners with <40% support.  
  - **Incentivizes Civility**: Candidates must appeal broadly for second-choice support.  

  **Limitations of IRV**:  
  - **Not Strategy-Proof**: As shown above, voters *can* sometimes profit from insincere rankings (e.g., ranking a strong second choice first to block a rival).  
  - **Non-Monotonicity**: Rarely, ranking a candidate higher can cause them to lose (or vice versa).  
  - **Complexity**: Tallying requires multiple rounds, but software can automate this.  

  ### Strongest Argument Against IRV  
  The primary case for **retaining plurality voting** is simplicity and familiarity. Plurality is transparent: the candidate with the most votes wins. IRV’s ranking process and elimination rounds may initially confuse voters, potentially lowering turnout. Additionally, if voters do not rank candidates (e.g., truncating ballots), IRV can devolve into plurality.  

  However, last April’s election demonstrated that plurality’s simplicity comes at a cost: it actively *encourages* insincere voting. IRV, while imperfect, better aligns voter behavior with true preferences.  

  ### Recommendation and Next Steps  
  We recommend adopting **ranked-choice instant runoff voting** for the Senate Chair election. IRV strikes the best balance among our charter’s criteria: it accepts all ballot rankings, ensures every candidate can win, minimizes strategic incentives more effectively than plurality, and avoids dictatorship. Crucially, IRV would have averted last April’s dilemma by allowing Group C to vote sincerely for Chris while still influencing the Alice-Bob contest.  

  **Practical Implementation**:  
  1. **Ballot Design**: Voters rank candidates in order of preference (1, 2, 3).  
  2. **Tallying**: If no candidate has >50% of first-choice votes, the last-place candidate is eliminated, and their votes transfer to next choices. This repeats until one candidate achieves a majority.  
  3. **Tie-Breaking**: We retain seniority as a deterministic tie-breaker.  
  4. **Timeline**:  
     - November: Finalize IRV procedures and voter education materials.  
     - December: Conduct a mock election to familiarize faculty.  
     - January: Implement IRV for the Senate Chair election.  

  **Review Clause**: We propose reassessing IRV after two election cycles to evaluate its efficacy and voter satisfaction.  

  ### Conclusion  
  No voting system is invulnerable to strategic behavior, but IRV represents a significant improvement over plurality. It empowers voters to express honest preferences while promoting consensus-building. We urge the Senate to approve this reform to strengthen trust in our electoral process.  

  Respectfully submitted,  
  The Ad Hoc Committee on Electoral Reform  

