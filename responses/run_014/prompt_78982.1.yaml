answer: |-
  The humid air of Port Thalassa clung to Comrade Aris’s collar as he smoothed the final sheet of the Seventh Annual Requirement Returns Summary. Outside the Planning Bureau’s high windows, the bustling docks seemed muted, operating under the silent, intricate choreography of norms and directives. No money changed hands on Thalassa; allocation flowed through paper rivers – the Requirement Returns – and the Bureau’s pronouncements. Every enterprise stated what it needed, what it *could* forgo, and the consequences.

  This year, the paper river ran thick with tension over tarpaulin.

  Aris’s gaze drifted to the relevant columns. The Fishing Collective, Net-Mending Division, claimed they could forgo only 200 bolts of their 1,000-bolt allocation without causing a 15% reduction in net repairs, translating to an estimated 8% decline in the seasonal catch. The State Warehousing Directorate, Roofing & Maintenance, stated that forgoing 50 bolts of their 800-bolt allocation would lead to compromised storage for 12,000 tonnes of grain, risking spoilage.

  The problem was stark: projected tarpaulin production, based on the Composite Materials Plant’s own return (which optimistically stated they *could* increase output by 10% if only allotted more natural rubber… another contested input), barely covered the *minimum* requirements stated by users. And everyone always stated their minimum requirements as perilously close to their actual allocations, their "forgo" figures minimal, the projected losses catastrophic.

  Aris sighed, tracing the figures with a pencil. He knew the dance. Comrade Kael, head of Warehouse Roofing, had been ambitious. Last year, Kael had reported impressively low wastage figures and high efficiency gains, securing commendation and, crucially, a *smaller* allocation of tarpaulin for his district. "Doing more with less," the commendation read. This year, predictably, Kael’s return screamed scarcity. Forgoing 50 bolts meant ruin? Aris remembered the warehouse inspection reports – minor leaks noted, but no structural collapses. Kael was playing the game: understate current efficiency to ensure a larger future buffer, protecting his operation and his career.

  Similarly, Old Man Finn of the Net-Menders, nearing retirement and less driven by ambition but perhaps by caution, consistently reported needing nearly every bolt he got, his "forgo" figures negligible, the projected losses dire.

  The Bureau, adhering to precedent, primarily set next year’s norms based on *this* year’s reported capabilities and stated needs. Like a ship drifting on currents it couldn’t perceive, the aggregate picture – the sum of all these cautiously pessimistic, career-preserving reports – steadily diverged from the island’s actual productive capacity. A constant, invisible deficit was being written into the very fabric of the plan.

  Hence, the Tarpaulin Conundrum of Year Seven. The Bureau’s initial draft allocation, based purely on returns, left both Warehousing and Net-Mending dangerously short. Arguments erupted in committee: Kael brandished reports of unusually heavy monsoon predictions (conveniently sourced *after* his return was filed), Finn displayed salt-rotted nets needing unprecedented replacement. Both demands were plausible, both impossible to fully meet with the projected supply.

  This was where Aris’s shadow list came in.

  Frustrated by the fog of conflicting, self-interested claims, Aris had spent the last year compiling data. He tracked reported shortages and gluts across all sectors, cross-referenced with actual output fluctuations where possible. He didn’t have prices, but he had *signals*. He calculated, based on the *intensity* of shortages reported (the gap between requested and received, the stated severity of loss), a set of "notional exchange values" – his shadow prices. He published them quietly: *For internal planning guidance only. Treat these figures as operational constraints.*

  For tarpaulin, the number was **9.7**. It meant nothing in Thalassan currency – there was none – but Aris instructed enterprises: *Act as if acquiring one additional unit of tarpaulin would cost your operation 9.7 units of equivalent value elsewhere, and vice-versa.*

  He presented his analysis to the Allocation Committee, pointing to the tarpaulin row. "Look at the shortage intensity last year. Net-Mending reported acute shortages correlating with increased net failure rates. Warehousing reported shortages, but their actual recorded spoilage increase was marginal. The *signal* from the Net-Menders was stronger, more consistent with tangible loss. Hence, the notional value is higher for diversion *away* from net repair." His finger tapped the **9.7**. "We should instruct both sectors: optimize your requests *as if* tarpaulin has this cost."

  The Committee, weary of the deadlock, agreed. The directive went out: Warehousing and Net-Mending must refile their requirement returns, incorporating the notional price of **9.7** for tarpaulin. They were to calculate their input needs based on minimizing total "cost" against their output goals.

  Comrade Kael in Warehouse District 4 received the directive with a furrowed brow. **9.7**. What did that *mean*? His world was physical: bolts of tarpaulin, tonnes of grain, cubic metres of storage. He knew patching a leaky seam used less tarpaulin than replacing a whole panel. He knew *which* warehouses were most vulnerable to weather, which stored the most perishable grain. He knew the subtle differences in weave and coating between batches that affected durability. But **9.7**? It was just a number from the Bureau. Abstract.

  He tried. He estimated the "value" of grain saved by perfect storage versus the "cost" of tarpaulin at **9.7**. It was guesswork. He ended up requesting slightly less tarpaulin than before, figuring the high notional cost meant he should economize, but he padded the "loss" projections slightly more, hedging his bets. He prioritized covering the high-value grain warehouses, leaving the root vegetable sheds a little more exposed – a practical decision, but one disconnected from the **9.7**.

  Old Man Finn received the same directive. **9.7**. He stared at the number, then at the pile of torn nets in his mending shed. He knew which nets were for the deep-water trawlers (critical for the bulk catch) and which were for the coastal skiffs. He knew how many extra hours a weakened net cost his crew, how a poorly mended net could fail spectacularly at sea. He knew the salt air degraded the tarpaulin used for repairs faster near the docks. He knew a skilled mender could make a bolt stretch further than an apprentice. How did **9.7** capture that? It didn’t tell him *where* the scarcity was biting hardest in the real, complex web of nets and fish and weather. He simply adjusted his "forgo" figure downwards slightly, fearing the high cost meant he might get even less if he asked for too much, and inflated the projected catch loss marginally. He focused his best menders on the trawler nets, letting the skiff nets wait longer – sensible, but based on local knowledge, not the Bureau’s number.

  The Bureau received the amended returns. Kael’s request was lower, Finn’s slightly lower too. The aggregate tarpaulin "demand" at **9.7** appeared to fit the projected supply better. The Allocation Committee, relieved, signed off. Tarpaulin was distributed: Warehousing got less than they initially screamed for, Net-Mending slightly less too. Kael grumbled but made do, patching the root vegetable sheds with older, less suitable sheeting. Finn prioritized the trawlers.

  Then the monsoon arrived. Not unusually heavy, but persistent. The older sheeting on Warehouse 7B, holding the island’s reserve seed potatoes, proved inadequate. Steady drips became a trickle, then a steady leak onto the sacks below. Kael hadn’t *lied*; the warehouse *was* covered. But the covering was suboptimal, a consequence of his economizing under the shadow price and his inherent caution in reporting. The seed potatoes began to rot in damp corners.

  Out at sea, the prolonged damp meant salt-rot spread faster on the *less* critical skiff nets Finn had deprioritized. Repairs lagged. Several small boats were idled, impacting the catch of nearshore fish, a staple protein for the port’s eastern districts. Shortages appeared in the communal kitchens there. Finn hadn’t *lied*; he’d protected the trawlers. But the cascading effect of the smaller boats being idle was real, a consequence of his localized triage, only loosely informed by the abstract **9.7**.

  Aris sat late in his office, rain drumming against the window. Reports of the seed spoilage and the fish shortages lay before him, alongside the triumphant Allocation Committee minutes praising the resolution of the Tarpaulin Conundrum via the notional pricing mechanism. He pulled out his shadow list. Tarpaulin was still listed at **9.7**. Based on *this* year’s reported shortages – the warehouse leak, the idled skiffs – he’d likely need to adjust it upwards. But to what? **10.2**? **10.5**? What did that number *mean* now? Did it capture the specific vulnerability of seed potatoes versus grain? Did it reflect the network effect of idling small boats versus reducing the large trawler fleet’s efficiency by 5%? Did it account for Kael’s lingering instinct to hoard perceived safety, or Finn’s ingrained caution?

  The number felt hollow. It was a shadow, yes, but a shadow cast by a flickering candle in a vast, complex cavern. It hinted at the shape of scarcity, but not its intricate texture, not the specific pressure points known only to Kael in his damp warehouses, to Finn in his net-strewn shed, to the fishers on the idle skiffs, to the cooks facing empty larders in the eastern district. It aggregated signals, but it couldn’t convey the tacit, dispersed knowledge of consequences embedded in every corner of Thalassa’s rain-lashed reality. Could any list the Bureau printed ever carry *that*?

  Aris carefully wrote the new, tentative figure for tarpaulin on a scrap of paper: **10.3**. He stared at it. Down in the harbor, a lone skiff rocked in its berth, its nets hanging limp and dark with moisture, waiting. In Warehouse 7B, water dripped steadily onto a sack of seed potatoes, the damp patch spreading unseen in the gloom. Aris placed the scrap of paper beside the reports, a numerical ghost of a market that didn't exist, trying to speak a language the island had deliberately unlearned. Outside, the rain fell, indifferent to numbers and plans, washing over the silent machinery of the planned republic.
