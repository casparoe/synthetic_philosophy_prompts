  For decision procedures, they need a framework that avoids arbitrary outcomes. Total utilitarianism (summing benefits) would always favor larger numbers, but that might ignore suffering thresholds. Prioritarians might weight severe pain more. Maybe they need a multiprinciple approach. 

  Consistency across cycles is crucial. If they choose different programs each year without a clear rationale, it could seem unfair or inconsistent. They need transparent criteria, like severity thresholds or weighted scoring, applied consistently.

  Explaining to donors and clinicians is key. Donors might expect helping the most people, but clinicians see severe cases. Need to justify why severe pain takes priority without dismissing smaller benefits. Frame it as preventing unbearable suffering versus improving manageable discomfort.

