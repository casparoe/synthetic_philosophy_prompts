  Finally for section 4, I'll confront the consistency question. The dual language isn't logically contradictory but creates rhetorical friction that could mislead policymakers. If we switched to strict realism, evaluations would become literal mind-probing; if to strict instrumentalism, we might drop intentional language entirely - but both alternatives have problems.

