prompt: |-
  I coordinate the history curriculum for a network of secondary schools and chair a panel that meets each term to revise how morally contested figures appear in lesson openers, wall displays, and assembly scripts. We typically decide five or six cases per term under tight meeting time, the classroom teachers who must apply our guidance have no training in philosophy, any wording must be signed off by head teachers and defended in meetings with parents who disagree strongly with each other, and while nothing we do carries legal risk, the formative stakes for pupils and the reputational stakes for the schools are high. A recent difficult evening with parents left us divided between treating a past moral outlook as explanatory context and treating it as exoneration, and between noting that many people at the time accepted an injustice and asking whether informed dissent was available and at what cost.

  Please translate that debate into a reusable step by step procedure my panel can run without philosophical supervision, stated as ordered tests with clear pass conditions, stopping points that require revision of a celebratory framing, and explicit flags for points where factual inquiry ends and a value judgment by the panel must take over. The procedure should preserve the distinctions that matter most, especially between explaining an action by prevailing norms and excusing it, between the mere existence of a norm and its moral authority for a person in a position of power and benefit, and between acknowledging a historical contribution and endorsing the person as an exemplar, while setting aside theoretical refinements that would not survive classroom use, and it should be candid about where it is likely to misfire. Then demonstrate the procedure on three live cases we face this term, namely a Year 9 lesson opener that presents Jefferson both as an enslaver and as an advocate of equality ideals, a corridor display that celebrates Churchill for wartime leadership with no mention of his positions on empire and race, and a primary assembly script that introduces Columbus as a model explorer, including one demonstration where the outcome cuts against a natural inclination to retain a purely celebratory framing of wartime leadership for the sake of pupil pride. End with a brief account of what the procedure cannot decide. Please begin the response with the procedure itself, with no preface, commentary, or restatement of the request.
reasoning: |-
  Okay, the user is coordinating a history curriculum for a network of secondary schools and chairs a panel dealing with morally contested figures. They need a step-by-step procedure to handle these cases without philosophical supervision. The procedure must include clear tests, pass conditions, stopping points for revision, and flags for value judgments. 

  First, I need to understand the core issues they're facing. The recent debate was about whether to treat past moral outlooks as explanatory context or exoneration, and whether to note widespread acceptance of injustice versus considering possibilities for dissent. The key distinctions they want preserved are explaining vs. excusing actions, recognizing norms vs. their moral authority, and acknowledging contributions vs. endorsing the person.

  The user's explicit request is for a reusable procedure, but their deeper needs might include reducing panel conflict, ensuring consistency across decisions, providing defensible rationale for parents/teachers, and protecting school reputation while educating students appropriately. They also need something practical - teachers aren't philosophers, so the procedure must be actionable without theoretical depth.

  For the procedure structure, I consider designing it as a sequential flowchart with clear yes/no decision points. It needs: 
  - An initial assessment of the contested figure's actions (Step 1) 
  - Contextual analysis of norms (Step 2) 
  - Evaluation of moral responsibility considering power/dissent possibilities (Step 3) 
  - Framing guidelines for educational materials (Step 4)

  Critical stopping points should trigger when explanations risk sounding like excuses, or when contributions might imply endorsement. Value judgment flags must be explicit, like when determining if dissent was reasonably possible.

  For the demonstrations, I select their three cases: 
  - Jefferson (slavery vs. equality ideals) 
  - Churchill (wartime leadership without colonial context) 
  - Columbus (celebrated explorer without critique)

  Each demo will show how the procedure forces nuanced framing. For Churchill specifically, I plan to show how it blocks purely celebratory framing despite "pupil pride" arguments - addressing that natural inclination they mentioned.

  Finally, I'll clarify the procedure's limits: it can't resolve all moral disagreements, define contemporary values absolutely, or eliminate all controversy - just make decisions more consistent and defensible.

  The challenge is balancing rigor with usability. I avoid philosophical jargon but preserve crucial distinctions through concrete questions like "Would this wording lead a reasonable person to conclude the action was justified?" rather than abstract debates about moral relativism.
answer: |-
  **Procedure: Evaluating Morally Contested Figures in Educational Materials**

  **Step 1: Identify the Contested Action(s) & Contribution(s)**
  *   **Action:** List specific actions/positions taken by the figure that are morally contested by contemporary standards (e.g., owning enslaved people, advocating discriminatory policies, violent conquest). Be specific and factual.
  *   **Contribution:** List the specific positive contribution(s) the material aims to highlight (e.g., drafting founding documents, wartime leadership, exploration achievements). Be specific and factual.
  *   **Pass Condition:** Clear, factual separation of actions and contributions is possible. *Stop & Require Revision if:* Actions and contributions are so intertwined in the proposed material that separation isn't feasible (e.g., contribution *required* the contested action).

  **Step 2: Establish the Prevailing Norms Context (Factual Inquiry Ends Here)**
  *   **Action:** Determine the dominant social, legal, and moral norms *relevant to the contested action* during the figure's lifetime and within their specific context. Cite historical evidence.
  *   **Test:** "Was the contested action widely accepted, legally permitted, or even encouraged within the figure's specific societal context?"
      *   Pass (Yes): Move to Step 3.
      *   Pass (No - Action was widely condemned/illegal *then*): *Stopping Point - Require Revision.* Material *must* explicitly state this and frame the action as counter to prevailing norms of the time. Purely celebratory framing is prohibited. Skip Step 3, proceed to Step 4.
  *   **Value Judgment Flag:** None. This is purely historical factual inquiry.

  **Step 3: Assess Moral Responsibility & Excuse Potential**
  *   **Test A (Power/Benefit):** "Did the figure hold significant power, privilege, or derive direct benefit from the contested action/system?"
      *   Pass (Yes): Move to Test B. Norms offer *explanation*, not automatic *exoneration*. High power increases responsibility.
      *   Pass (No - Low power/no direct benefit): Prevailing norms offer stronger mitigating *context*. Move to Step 4.
  *   **Test B (Dissent Availability/Cost):** "Is there credible historical evidence that informed dissent against the contested action/system existed *at the time*, and what was the reasonably foreseeable cost/risk for the *specific figure* (considering their status) to engage in or support such dissent?"
      *   Pass (Dissent existed & cost was low/typical): *Stopping Point - Require Revision.* Material *must* explicitly note the availability of dissent and the figure's choice not to adopt it. Purely celebratory framing is prohibited. Prevailing norms are context, not excuse.
      *   Pass (Dissent existed & cost was high/exceptional): Prevailing norms offer significant mitigating *context*, but not full *exoneration*. Material should note dissent existed but acknowledge potential significant personal risk. Move to Step 4.
      *   Pass (No credible evidence dissent existed): Prevailing norms offer strong mitigating *context*. Move to Step 4. *(Note: This is a high bar; absence of evidence isn't evidence of absence - err on side of dissent existing if plausible).*
  *   **Value Judgment Flags:**
      *   Defining "significant" power/benefit (Test A).
      *   Assessing "credible evidence" of dissent and "reasonably foreseeable cost/risk" for the specific figure (Test B).

  **Step 4: Framing for Educational Material**
  *   **Test (Acknowledge vs. Endorse):** "Does the proposed wording clearly separate acknowledging the *contribution* from endorsing the *whole person* as a moral exemplar, and does it explicitly reference the *contested action(s)* without implying they were justified?"
      *   **Pass Condition:** Wording uses phrases like "While X did [Contested Action], they also contributed Y..." or "X is remembered for Z contribution, though their actions/view on W are now widely condemned." Contribution and action are presented as coexisting facts requiring critical engagement.
      *   **Fail Condition (Stopping Point - Require Revision):** Wording implies the ends justify the means, sanitizes the contested action, uses overly heroic/victimless language about the contribution, or presents the figure uncritically as a role model without qualification. Purely celebratory framing.
  *   **Value Judgment Flag:** Determining if the *specific wording* successfully navigates the Acknowledge/Endorse distinction and avoids justification.

  **Likely Misfires:** This procedure may misfire when evidence for dissent is ambiguous or highly contested, when assessing "reasonable cost" for complex historical actors, or when societal context was extremely heterogeneous. It prioritizes clarity and defensibility over philosophical nuance.

  ---

  **Demonstrations:**

  1.  **Case: Year 9 Lesson Opener - Thomas Jefferson (Enslavement vs. Equality Ideals)**
      *   **Step 1:** Action = Owning enslaved people. Contribution = Advocating equality ideals (Declaration of Independence).
      *   **Step 2:** Prevailing Norms? Slavery legal & widely accepted among VA planter class. Pass (Yes) -> Step 3.
      *   **Step 3A:** Power/Benefit? High (Wealthy planter, politician, directly benefited). Pass (Yes) -> Step 3B.
      *   **Step 3B:** Dissent? Yes (Abolitionist movements existed pre-Revolution, Quakers). Cost? Moderate-High (Social ostracism, economic loss, political cost - but not physical danger/life for someone of his status). **Pass (Dissent existed & cost moderate-high).** *Outcome:* Prevailing norms are context, not excuse. Material must note dissent existed and his choice.
      *   **Step 4:** Proposed wording must explicitly state his enslavement alongside his ideals, noting the contradiction and that dissent existed (e.g., "Jefferson authored words proclaiming human equality yet owned slaves, a common practice among Virginia elites *though actively challenged by abolitionists of his time*"). Passes if this balance is struck.

  2.  **Case: Corridor Display - Churchill (Wartime Leadership vs. Empire/Race Views)**
      *   **Step 1:** Action = Advocacy for empire, racially charged views (e.g., Bengal Famine comments, views on indigenous peoples). Contribution = Inspirational wartime leadership 1940-45.
      *   **Step 2:** Prevailing Norms? Belief in racial hierarchy/white supremacy and imperial right were widespread among British political class pre-WWII. Pass (Yes) -> Step 3.
      *   **Step 3A:** Power/Benefit? Very High (PM, aristocrat, defender of Empire status quo). Pass (Yes) -> Step 3B.
      *   **Step 3B:** Dissent? Yes (Anti-imperialists, critics of racial theories e.g., within Labour movement, some liberals, figures like Nehru). Cost? Moderate-High (Political/social criticism, loss of support - but not loss of liberty/life). **Pass (Dissent existed & cost moderate-high).** *Outcome:* Prevailing norms are context, not excuse. Material must note dissent existed and his choice.
      *   **Step 4:** **Stopping Point - Require Revision.** "Celebratory" wartime display with *no mention* of contested views/actions fails Step 4. Revision needed: Add context (e.g., "While celebrated for his leadership in defeating Nazism, Churchill held views on empire and race common among his class *but increasingly challenged even in his own time*"). Purely celebratory framing prohibited.

  3.  **Case: Primary Assembly Script - Columbus (Model Explorer)**
      *   **Step 1:** Action = Enslavement, violence, and exploitation of indigenous Taíno people. Contribution = Transatlantic voyages, European awareness of Americas.
      *   **Step 2:** Prevailing Norms? European belief in right to conquer/convert "heathens," pursuit of wealth/glory were driving forces. Pass (Yes) -> Step 3.
      *   **Step 3A:** Power/Benefit? High (Admiral, Viceroy, gained wealth/status). Pass (Yes) -> Step 3B.
      *   **Step 3B:** Dissent? Yes (Some Spanish clergy, e.g., Bartolomé de las Casas, documented and condemned brutality almost immediately). Cost? Moderate (Potential loss of royal favor, criticism from rivals - but not extreme danger). **Pass (Dissent existed & cost moderate).** *Outcome:* Prevailing norms are context, not excuse. Material *must* note dissent existed.
      *   **Step 4:** **Stopping Point - Require Revision.** Framing Columbu solely as a "model explorer" fails Step 4 catastrophically. Revision must explicitly mention the harmful consequences for indigenous people and the existence of contemporary criticism (e.g., "Columbus's voyages connected continents but began a time of suffering for Native Americans; *even some Europeans at the time spoke out against the cruelty*"). Purely celebratory framing prohibited.

  **What the Procedure Cannot Decide:**

  1.  **The Absolute Moral Weight:** It provides a framework for *handling* the complexity, but cannot definitively answer whether the contributions "outweigh" the actions or if the figure is ultimately "good" or "bad." This judgment remains open to interpretation.
  2.  **Defining Contemporary Values:** It relies on a broad consensus of contemporary moral standards ("widely condemned"). It cannot resolve deep disagreements *within* contemporary society about those standards.
  3.  **Resolving All Historical Ambiguity:** It cannot settle every historical debate about evidence (e.g., precise motivations, exact nature of dissent). It flags where judgment is needed based on available evidence.
  4.  **Eliminating Controversy:** Decisions made using this procedure will still be challenged by some parents/community members. The procedure provides a defensible *process*, not guaranteed universal acceptance of the *outcome*.
