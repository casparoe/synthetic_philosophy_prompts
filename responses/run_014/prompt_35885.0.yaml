prompt: |-
  I teach an upper-level seminar on population ethics—fourteen students, one ninety-minute session, mid-semester. We've just covered ordinary deprivational harm and welfare tradeoffs, and I want the next class to make them collide with the nonidentity problem before they've read or heard the label. Design a staged role-play along these lines: a small coastal polity's development council must choose between two policies (say, an intensive-extraction settlement plan versus a slower conservationist one), where the plans differ in timing and settlement patterns enough that different people end up being born a generation later—I'll want you to make that identity-shifting mechanism concrete and internally plausible without it reading as science fiction, and to supply whatever props or cards would let participants actually see that "the people of generation two" are different people under the two policies. The centerpiece should be a tribunal in which generation-two citizens lodge complaints about the world they inherited, with an apparently innocuous standing rule they'll formulate themselves: a complaint goes forward only if the complainant is worse off under the chosen policy than someone would have been under the alternative. I want them to discover, in the tribunal's failure to find a complainant with standing, the gap between "a wrong was done" and "someone was wronged"—and to have to articulate whether they think there is a residue of wrong, and if so whose it is.

  Please give me: the setup and cast, the mechanics of the identity shift (including how to keep students from just denying it), the tribunal procedure, a debrief that maps each moment onto the live philosophical options—person-affecting restraint, impersonal claims about comparative-quality-of-life thresholds, and simply denying the intuition—without lecturing up front; the term "nonidentity problem" should not appear until the debrief. Include the predictable failure modes on a first run (e.g., students relitigating the policy's merits instead of standing, or letting the tribunal declare a victim by fiat) and how I should handle them. Finally, be candid about which part of the problem no in-class activity can reproduce—the comparison between an existence and a nonexistence that contains no subject to make it, for instance—and that I'll have to supply at the board.
reasoning: |-
  We are designing a role-play for an upper-level seminar on population ethics. The goal is to have students confront the nonidentity problem without prior exposure to the term. The scenario involves a coastal polity's development council choosing between two policies that lead to different future populations. The centerpiece is a tribunal where generation-two citizens complain about the world they inherited, but with a standing rule that a complaint only goes forward if the complainant is worse off under the chosen policy than someone would have been under the alternative. We want students to discover that no one has standing because the alternative policy would have led to different people being born, and then to grapple with whether a wrong was done even if no one was wronged.

  Here is a structured plan:

  ### Setup and Cast
  - **Setting**: A small coastal polity named "Harmonia" (to avoid real-world associations). The time is the present, but the policies will affect the next generation (about 25-30 years in the future).
  - **Policy Options**:
    1. **Rapid Development Plan (RDP)**: Intensive extraction of coastal resources (e.g., deep-sea mining, rapid port expansion) to boost the economy quickly. This leads to immediate job creation and wealth but causes significant environmental degradation (e.g., coastal erosion, loss of biodiversity, and higher pollution). The plan includes incentives for young people to settle in new industrial zones, leading to a high rate of in-migration and a baby boom in the next generation. Due to the specific timing and location of settlements, the people born in generation two (Gen2) are the children of these migrants and local residents who moved for jobs. The Gen2 population is larger and has a specific demographic makeup.
    2. **Sustainable Development Plan (SDP)**: A slower, conservationist approach with regulated extraction, eco-tourism, and investment in renewable energy. This plan avoids environmental damage but provides fewer immediate economic benefits. Settlement patterns are more stable, with less migration. The Gen2 population is smaller, and due to different migration patterns and timing of births, the individuals born are entirely different from those under RDP.

  - **Cast** (14 students divided into roles):
    - **Development Council (5 students)**: They must choose one of the two policies. They can debate and vote. Assign roles: Chair, Minister of Economy, Minister of Environment, Minister of Social Affairs, Minister of Infrastructure.
    - **Generation Two Citizens (8 students)**: These are the people born 25-30 years after the policy choice. They will be affected by the policy and will later participate in the tribunal. They are divided into two groups: 
        - 4 students represent Gen2 under RDP (if RDP was chosen) OR Gen2 under SDP (if SDP was chosen) — depending on what the council picks. 
        - The other 4 students will represent the *counterfactual* Gen2 — the people who would have existed if the alternative policy had been chosen. However, note that in the actual tribunal, only the actual Gen2 (from the chosen policy) will be present to lodge complaints. The counterfactual group is for reference and to help illustrate the identity shift.
    - **Tribunal Panel (1 student)**: Serves as the judge/moderator for the tribunal. Their role is to apply the standing rule and decide which complaints can proceed.

  ### Mechanics of the Identity Shift
  - **How to make it concrete and plausible without sci-fi**:
    - Use a "Settlement and Birth Chart" for each policy. Create two large posters (or handouts) showing the timeline of settlement and birth for the next generation under each policy.
    - For RDP: Show a map with new industrial zones. Indicate that due to rapid development, many young workers move in from other regions. List specific events (e.g., "2025: New port built, 500 families move in", "2027: Baby boom in New Harbor District"). Then, list the names of some Gen2 individuals (e.g., "Alex, born in New Harbor in 2030 to parents who moved from Region X in 2025").
    - For SDP: Show a map with conservation areas and eco-tourism hubs. Settlement is slow and local. List events (e.g., "2025: Eco-lodge opens, 20 new jobs, but no large in-migration", "2028: Small increase in births in existing towns"). Then, list Gen2 individuals (e.g., "Sam, born in Oldtown in 2032 to parents who have lived there since 2020").
    - **Key**: The Gen2 individuals under the two policies have different names, birthplaces, and parentage. Emphasize that the parents who met and had children under one policy would not have met (or would have had children at different times) under the other. This is based on real-world demographic shifts (e.g., the "butterfly effect" of migration and timing).

  - **How to prevent denial of the identity shift**:
    - At the start, have the class agree that the two policies lead to different patterns of human settlement and reproduction. Use the charts to show that the specific people born are different. Ask: "Under RDP, Alex is born in New Harbor. Under SDP, would Alex exist? No, because Alex's parents met in New Harbor during the construction boom. In SDP, that boom doesn't happen, so they never meet. Instead, we have Sam in Oldtown." Make it clear that this is not time travel or sci-fi but a consequence of how human lives unfold.

  ### Tribunal Procedure
  1. **Setup**: After the Development Council chooses a policy (say, RDP), the Gen2 citizens (who exist under RDP) are given complaint cards. Each card describes a specific harm they face due to the chosen policy (e.g., "I suffer from asthma due to air pollution from the factories", "My family's ancestral home was lost to coastal erosion", "I can't find a job because the boom ended and now there's a recession"). Also, prepare similar complaint cards for the counterfactual Gen2 (under SDP) but these are not used in the tribunal — they are for reference.
  2. **Standing Rule**: The Tribunal Panel announces the rule: "A complaint may be heard only if the complainant can show that they are worse off under the chosen policy than someone (anyone) would have been under the alternative policy." Write this on the board.
  3. **Lodging Complaints**: Each Gen2 citizen (the 4 students) steps forward to state their complaint and tries to establish standing. They must compare their situation to the alternative.
     - Example: "Under RDP, I have asthma. But under SDP, the air would have been cleaner, so I would have been better off." 
     - However, the tribunal must challenge: "But under SDP, would you exist? No. The alternative is a world without you. So who in the SDP world are you comparing yourself to? Someone else (e.g., Sam) lives in that world. But you cannot say you are worse off than Sam because you and Sam are different people. And Sam's life, though different, might be better or worse in other ways, but that's not about you."
  4. **Expected Failure Modes**:
     - **Relitigating the policy choice**: If the tribunal or complainants start arguing about which policy was better, redirect: "The tribunal is not here to decide which policy was better, but to hear complaints from individuals who claim they were personally wronged by the choice. We must apply the standing rule."
     - **Declaring a victim by fiat**: If the tribunal tries to say, "Well, clearly someone was harmed," ask: "Who exactly? Point to a specific person and show how they meet the standing rule." If they name a counterfactual person (e.g., Sam), note that Sam doesn't exist in the actual world and cannot complain. If they say the actual Gen2 person, push: "Is that person worse off than they would have been under the alternative? But they wouldn't exist under the alternative."
     - **Denying the identity shift**: If a student says, "Maybe Alex would have been born anyway," refer back to the Settlement and Birth Chart. "According to our scenario, Alex's parents only met because of the RDP incentives. Without that, they wouldn't have met. So Alex wouldn't exist under SDP."

  ### Debrief
  After the tribunal fails to find a complainant with standing, lead a discussion:
  1. **What happened?** 
     - No one could show they were worse off than someone in the alternative scenario because the alternative had entirely different people.
     - This reveals a gap: We might think a wrong was done (e.g., environmental degradation), but no particular person was wronged (because the people who exist wouldn't exist otherwise, and they might still have lives worth living).

  2. **Map to Philosophical Options** (without using the term nonidentity problem yet):
     - **Person-Affecting Restraint**: If we think morality is only about making particular people better off, then we might conclude no wrong was done to anyone. But does that mean the policy choice was morally neutral?
     - **Impersonal Claims**: Maybe we should care not just about harming specific people but about the overall quality of lives in the world. Under RDP, the average quality of life might be lower, or there might be more people living in subpar conditions. But note: we are comparing two different sets of people. Is it worse to bring into existence people with lower-quality lives if the alternative is different people with higher-quality lives?
     - **Denying the Intuition**: Some might argue that if the Gen2 lives are worth living (even if less good), then there's no problem. The policy might be criticized on other grounds (e.g., injustice to the environment or to future generations as a group), but not because it wronged the specific people.

  3. **Introduce the Term**: Now reveal that this is the "nonidentity problem" (write it on the board). Explain: The problem arises because the identity of future people depends on our choices, so we cannot say that our choice makes those particular people worse off.

  4. **The Residue of Wrong**: Ask: "If no one was wronged, is there still a wrong? If so, to whom? Or is it a wrong without a victim?" Discuss: 
     - Some might say the wrong is to the environment, or to humanity collectively. 
     - Others might say it's a wrong to the world (impersonal).
     - Or perhaps it's not a wrong at all.

  ### What the Activity Cannot Reproduce
  - **The comparison between existence and nonexistence**: In the tribunal, the actual Gen2 are comparing their lives to the counterfactual lives of others (Sam). But they are not comparing their existence to nonexistence. The deep philosophical issue is that we are comparing a state of affairs where a person exists with a lower quality of life to one where that same person does not exist at all. But if the life is worth living, the person might not prefer nonexistence. The activity cannot force a student to truly confront "I exist and my life is worse than it could have been, but if the other policy had been chosen, I wouldn't exist at all." This is because the student is role-playing a character and knows they exist. In the debrief, you must explicitly address this at the board: 
     - Draw a 2x2 grid: 
          - Row 1: Chosen Policy (e.g., RDP) → Alex exists with a life of quality 50 (on a scale where 0 is neutral, positive is worth living).
          - Row 2: Alternative Policy (SDP) → Alex does not exist, but Sam exists with a life of quality 70.
     - The problem: We cannot say Alex is worse off in RDP than in SDP because in SDP, Alex doesn't exist. And we cannot say that RDP is worse for Alex because without RDP, Alex wouldn't exist. So if Alex's life is worth living, RDP is not worse for Alex. But intuitively, we might think the world with Sam (quality 70) is better than the world with Alex (quality 50). However, that is an impersonal judgment.

  ### Handling Failure Modes
  - **If the council debate takes too long**: Set a strict time limit (10-15 minutes) for the council to choose a policy. If they deadlock, flip a coin to choose.
  - **If the tribunal ignores the standing rule**: As the instructor, step in as an "appeals judge" and remind them of the rule. Or, if the tribunal panel is struggling, provide them with a scripted question: "Complainant, under the alternative policy, would you have existed? If not, then who are you comparing yourself to?"
  - **If students resist the identity shift**: Stick to the scenario. "In our agreed-upon setup, the birth charts show different people. Let's proceed as if that's true, even if you have doubts. We can question it later."

  ### Props and Cards
  - **Policy Posters**: Two large posters describing RDP and SDP, including the Settlement and Birth Chart for Gen2.
  - **Complaint Cards**: For Gen2 under each policy. Each card has a name, a brief background, and a specific harm. Also, have a set for the counterfactual group (not used in tribunal).
  - **Tribunal Rule Card**: A card for the tribunal panel stating the standing rule.

  ### Timeline for the Session
  1. (10 min) Introduce the scenario and assign roles. Explain the two policies and the identity shift using the charts.
  2. (15 min) Council debate and policy choice.
  3. (10 min) Set up the tribunal: Explain the standing rule and give complaint cards to Gen2.
  4. (30 min) Tribunal: Each Gen2 citizen attempts to lodge a complaint; tribunal rules on standing.
  5. (25 min) Debrief: Discuss the failure, then map to philosophical options, introduce the nonidentity problem, and address the existence/nonexistence comparison on the board.

  This design should create an engaging, discovery-based experience that sets up the nonidentity problem and its philosophical implications.
answer: |-
  ### Role-Play Design: Harmonia Coastal Development Tribunal  
  **Objective:** Students confront the tension between "a wrong was done" and "someone was wronged" by experiencing a tribunal where future citizens cannot claim personal harm due to identity shifts from policy choices. The nonidentity problem emerges organically.  

  ---

  ### **Setup and Cast**  
  **Setting:** The coastal polity of **Harmonia** (pop. ~10,000). Time: Present day. Policy effects unfold over 25 years.  
  **Policy Dilemma:**  
  - **Option 1: Rapid Extraction Plan (REP)**  
    Fast-tracked offshore drilling and port expansion. Creates immediate jobs and wealth but causes coastal erosion, pollution, and fishery collapse by Gen2’s adulthood.  
    *Settlement Shift:* Incentivizes young workers to migrate to new industrial zones for high-paying jobs. Accelerated marriages/births in these transient communities.  

  - **Option 2: Gradual Stewardship Plan (GSP)**  
    Phased eco-tourism and sustainable aquaculture. Slower economic growth but preserves coastline and marine health for Gen2.  
    *Settlement Shift:* Focuses on upskilling locals; minimal migration. Delays family formation as youth pursue education.  

  **Cast (14 Students):**  
  - **Development Council (5 students):**  
    - *Roles:* Mayor (chair), Econ Director, Enviro Director, Social Director, Infrastructure Director.  
    - *Task:* Debate and vote on REP vs. GSP. Must justify based on Harmonia’s "prosperity with integrity" charter.  
  - **Generation 2 (Gen2) Citizens (8 students):**  
    - *Post-policy reality:* 4 students represent the *actual* Gen2 (e.g., if REP passes, they are REP-Gen2).  
    - *Counterfactual group:* 4 students represent Gen2 that *would have existed* under the rejected policy (silent observers until debrief).  
  - **Tribunal Moderator (1 student):**  
    - Enforces rules, records complaints, and applies standing criteria.  

  ---

  ### **Identity Shift Mechanics: Making It Concrete**  
  **Tools to Visualize the Shift:**  
  - **"Birth Ledger" Prop:** Two large posters showing Gen2’s demographic origins.  
    - *REP Ledger:* "Industrial Boom → Migrant workers settle in new port towns (2025–2030) → Gen2 born to these workers (2040–45). *Sample citizen: ‘Ana, born to construction foreman (migrant) and fishery worker (local) in New Port City.’*"  
    - *GSP Ledger:* "Apprenticeships & eco-training → Local youth delay childbearing → Gen2 born to upskilled locals (2045–50). *Sample citizen: ‘Ben, born to aquaculture manager and eco-guide in Old Harbor.’*"  
  - **Identity Cards:** Gen2 actors receive cards with names, parents’ vocations, and birth circumstances (e.g., "REP-Gen2: Your parents migrated for REP jobs; you grew up with asthma due to pollution").  

  **Preventing Denial of the Shift:**  
  - **Pre-activity Agreement:** Begin with: *"Demographers confirm: REP’s migration wave vs. GSP’s local focus alters who meets, marries, and has children when. Thus, Gen2 under REP and GSP are 100% non-overlapping. We accept this as fact for the exercise."*  
  - **Ledger Comparison:** Have students cross-check names/parents on both ledgers. *"If REP passes, does Ana exist under GSP? No—her parents never meet. Ben only exists if GSP passes."*  
  - **Instructor Safeguard:** If students resist, intervene: *"The demographic models are robust; this is real-world causality, not sci-fi. Proceed with the ledgers as given."*  

  ---

  ### **Tribunal Procedure**  
  **Step 1: Policy Selection (15 mins)**  
  - Council debates REP vs. GSP (provide brief policy sheets). Vote occurs. *Result locks in the "actual" Gen2 group.*  
  - *Example outcome:* REP passes → REP-Gen2 (4 students) become "actual" citizens; GSP-Gen2 (4 students) are "counterfactual."  

  **Step 2: Complaint Lodging (20 mins)**  
  - **Standing Rule:** Co-created by class. Guide them to: *"A complaint may be heard only if the complainant is worse off under the chosen policy than some identifiable person would have been under the alternative policy."* Write this on the board.  
  - **Gen2 Prep:** Actual Gen2 citizens receive complaint cards:  
    - *REP-Gen2 examples:* "I have chronic lung disease from REP pollution," "My family’s home collapsed due to erosion."  
    - *GSP-Gen2 examples:* "I lack job opportunities due to slow growth," "My education was underfunded."  
  - **Tribunal:** Each Gen2 citizen presents their complaint. Moderator asks: *"Who in the alternative policy’s world is better off than you? Point to them on the ledger."*  

  **Step 3: Standing Test (15 mins)**  
  - **Predictable Failure:**  
    - Actual Gen2 (e.g., REP-Ana) tries: *"Under GSP, I’d be healthier!"*  
    - Moderator checks ledger: *"But under GSP, you wouldn’t exist. Ben exists instead. Are you worse off than Ben?"*  
    - Ana cannot claim this—Ben’s life (e.g., job scarcity) may be better/worse in different ways, but he is not *her*.  
  - **Expected Failure Modes & Mitigation:**  
    - *Relitigating Policy Merits:* If council re-debates REP vs. GSP, moderator interjects: *"The tribunal only assesses harm to individuals under the standing rule. Policy fairness is not the question."*  
    - *Declaring Victim by Fiat:* If tribunal "assigns" harm (e.g., *"Ana is clearly a victim!"*), ask: *"Show how Ana meets the standing rule. Who is she worse off than?"* Force ledger evidence.  
    - *Vague Comparisons:* If students say *"Someone in GSP has it better,"* demand: *"Name the person. Is Ana worse off than Ben? They have different lives and challenges."*  

  **Outcome:** No complainant gains standing. Actual Gen2 exists only due to REP; they cannot be worse off than their non-existent selves under GSP.  

  ---

  ### **Debrief: Mapping the Philosophy (20 mins)**  
  **Guided Discussion (Instructor Questions):**  
  1. **Observing the Gap:**  
     - *"The tribunal found no victim with standing. Does that mean no wrong was done? If REP degraded the environment, is that wrong ‘canceled’ because Gen2 wouldn’t exist otherwise?"*  
     - *Silence pause* → Let discomfort sit.  

  2. **Philosophical Options (Write Terms on Board Post-Discussion):**  
     - **Person-Affecting Restraint:** *"Some argue: if no person is worse off, no wrong occurred. The complaint fails because Ana isn’t worse off than she’d otherwise be—she wouldn’t ‘otherwise be’ at all."*  
     - **Impersonal Thresholds:** *"Others say: a wrong exists if lives fall below a quality threshold (e.g., Ana’s asthma), even if no one is harmed relative to alternatives. Does REP create a ‘worse world’?"*  
     - **Denying the Intuition:** *"A third view: if Ana’s life is worth living, REP isn’t wrong—just different. Choosing GSP would create different people, not ‘save’ Ana."*  

  3. **Reveal the Nonidentity Problem:**  
     - *"Today, you experienced the **nonidentity problem**: when a choice affects who exists, we struggle to say it harms *those* people, even if it creates avoidable suffering."*  

  4. **The Residue Question:**  
     - *"If there’s a ‘wrong’ here, who owns it? The environment? Future generations as a collective? Or is it a wrong without a victim?"*  

  ---

  ### **Candid Limitations & Board Work**  
  **What the Activity Can’t Replicate:**  
  The core of the nonidentity problem hinges on **comparing existence to nonexistence**—a metaphysical tension no role-play can embody. Students role-play existing people; they cannot simulate "never having existed."  

  **How to Address This at the Board:**  
  1. Draw two axes:  
     - *X-axis:* Policy (REP vs. GSP)  
     - *Y-axis:* Welfare level (0 = neutral life; negative = not worth living).  
     ```  
            REP World                   GSP World  
          +-------------+             +-------------+  
      +10 |             |         +10 |      Ben    |  
          |             |             |   (Good)    |  
      0   |-------------|         0   |-------------|  
          |    Ana      |             |             |  
          | (Acceptable)|             |  (No Ana)   |  
     -10 |             |        -10 |             |  
          +-------------+             +-------------+  
     ```  
  2. **Key Explanation:**  
     - *"Ana exists at an ‘acceptable’ welfare level under REP. Under GSP, Ana doesn’t exist—Ben exists instead. We can’t say REP harms Ana because without REP, there’s no Ana to harm. But is REP wrong because it creates Ana’s ‘acceptable’ life instead of Ben’s ‘good’ life? That’s the nonidentity problem’s heart."*  

  ---

  ### **Materials Checklist**  
  - **Policy Sheets:** 1-pager on REP/GSP impacts.  
  - **Birth Ledgers:** Two posters showing non-overlapping Gen2 citizens.  
  - **Complaint Cards:** Tailored to REP-Gen2/GSP-Gen2.  
  - **Tribunal Rules Card:** For the moderator.  

  ### **Instructor Notes**  
  - **Timing:** Council debate (15 min) → Tribunal (35 min) → Debrief (20 min). Adjust if tribunal stalls.  
  - **Tone:** Neutral facilitator. Avoid hinting at "correct" answers until debrief.  
  - **Post-Activity:** Assign Parfit or Shiffrin for next class to formalize concepts.  

  This design forces engagement with the nonidentity intuition gap while sidestepping lecturing. The tribunal’s procedural failure makes abstract ethics visceral—and the debrief transforms frustration into philosophical clarity.
