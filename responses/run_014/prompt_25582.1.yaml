  3. **Resistance**: The Puritans’ collective blame challenges philosophy’s individualistic model. Can a *community* lack standing? The scarlet letter itself symbolizes institutional overreach.  
  4. **Addition**: Fiction’s unique contribution lies in depicting the *lived experience* of blame—Hester’s silent knowledge, the letter’s psychological weight, the intimacy between flawed blamers and the blamed.  

