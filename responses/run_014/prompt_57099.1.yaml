  Regarding collapse into counterfactual accounts, the key is whether interventions are defined without counterfactual dependence. If hypothetical interventions are used without clear criteria for their definition, it might sneak in counterfactuals. Defeaters include defining interventions counterfactually (fatal), using impossible interventions without constraints (awkward), and complex models that implicitly rely on counterfactuals (problematic but not fatal).

  The user also wants to know which defeaters an interventionist would concede. For example, they might admit that non-intervenable variables are a challenge but argue that causal understanding still comes through modeling. However, if interventions are defined counterfactually, that's a fatal flaw they should concede.

