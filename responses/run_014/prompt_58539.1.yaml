prompt: |-
  Hiya, something that's been bugging me on late shifts and I wondered if philosophers already have a word for it.

  I work front of house in a hotel in Leeds, and I keep noticing I do this thing where the surer I am, the less I bother double-checking, even when checking would take two seconds. Like last week I was closing the till and I was like 99% sure the float was right, so I didn't recount, whereas if I'd only been kinda sure I definitely would have. Same at home — my flatmate asked if I'd actually sent the email to the council about the bins, I was dead certain I had so I didn't even open my sent folder to look, even though it would've been free to do me a favour to check.

  And the odd bit is I'm not being stubborn about it. If I had looked and it wasn't there I'd have changed my mind straight away, no arguement. And I know in general I'm fallible, I mess things up occassionally like anyone. It's just in that moment being so sure makes checking feel pointless.

  Is this just confirmation bias or being lazy, or is there a more specific name for this exact loop where being sure justifies not looking? I don't want just a label — can you spell out what it is versus what it isn't, and where the line is between sensible saving of effort and something a bit dodgy? And if there's no proper term, could you coin one that actually carves it out? Cheers
