  I should also consider the difference between practical rationality (saving time when justified) versus epistemic negligence (ignoring potential errors despite low-cost checks). The threshold where the cost of checking is low enough that skipping it becomes irrational. The user's cases fall into the latter because verifying takes seconds but could prevent significant issues, like till discrepancies or unresolved bin problems.

