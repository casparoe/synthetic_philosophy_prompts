  I am a novelist currently at work on a book about a group of strangers who each independently learn of a preventable catastrophe. Each can act alone to stop it, but the action is costly, and if too many act the result is worse than if none had. Each also knows that the others may have received the same information, and each has a private reason to believe that they are the one most likely to succeed. I should like an essay on the unilateralist’s curse: the idea that when many actors can each unilaterally undertake an action that is beneficial if only a few undertake it but harmful if too many do, and each has reason to believe that their own action is on balance good, they may collectively act too much. The essay should weigh the main arguments for and against the claim that the curse makes decentralised altruistic action irrational, and it should reach a definite conclusion; please do not end on a non-committal note. I ask you to consider a variant I have invented for the novel: the actors’ private reasons are not only about their own competence but about their own moral standing — each believes that they are the only one who truly cares about the outcome. Does this make the curse worse, or does it give reason to think the curse is self-undermining? In the course of the essay, distinguish a principle of conformity (act only if you could will that everyone in your position act) from a principle of restraint (act only if you have reason to think that too few others will act), and say which, if either, your conclusion supports. No citations or reading list, please. After the essay, give me a brief structured summary as a JSON object with the fields: verdict (a one-sentence statement of your conclusion); key_premises (a list of the premises on which your verdict depends); strongest_objection (the best objection to your verdict); reply (your response to that objection); novel_variant (what your analysis implies for my private-moral-standing variant); and confidence (a number between 0 and 1). Please write in British English.
