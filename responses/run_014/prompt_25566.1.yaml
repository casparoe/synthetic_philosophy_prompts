answer: |-
  **Requirements for a Theory of Procreative Ethics**

  1.  **Handle the Non-Identity Problem (NIP):** Must explain why causing a person to exist who will have a life worth living (but unavoidably flawed, e.g., mildly disabled due to parental choice) is not morally equivalent to harming an existing person, even if the alternative is their non-existence.
      *   *Why:* Parfit's case (e.g., "Risky Policy" - choosing a policy causing climate change harms future people who wouldn't exist otherwise). Intuition: Choosing to create a person with a life worth living, even with avoidable hardships, isn't necessarily *wrong* in the same way harming an existing person is. The theory must distinguish "harming someone" from "creating someone who experiences harms."

  2.  **Respect the Intuition of Asymmetry (Basic Form):** Must account for the intuition that the presence of pain is a strong reason *against* procreation, while the absence of pleasure is *not* a strong reason *for* procreation, *even if the potential life is predicted to be net positive*.
      *   *Why:* The core Benatar intuition (e.g., *Not* creating a happy person isn't wrong, but creating a miserable person *is* wrong). A theory collapsing this distinction (e.g., treating absence of pleasure for a non-existent as equivalent to presence of pain for an existent) seems deeply counterintuitive.

  3.  **Account for the Duty Not to Create Miserable Lives:** Must provide a strong moral reason against bringing a person into existence whose life is predictably full of suffering and not worth living.
      *   *Why:* Universal intuition (e.g., conceiving a child knowing it will die painfully within hours from a genetic disease). Failure here renders the theory practically useless and morally repugnant.

  4.  **Avoid the Repugnant Conclusion:** Must not imply that creating a vast population of lives barely worth living is better than creating a smaller population of very high-quality lives, all else being equal.
      *   *Why:* Parfit's Repugnant Conclusion highlights a flaw in classical utilitarianism. Intuition: A world with 10 billion people whose lives are barely worth living seems worse than a world with 1 billion people living truly excellent lives.

  5.  **Explain Why Nonexistence Isn't Harmed / Doesn't Lack Goods:** Must justify why not bringing a potential person into existence (who *would* have had a good life) does not constitute harming them or depriving them of the good life they *could* have had.
      *   *Why:* The core "asymmetry" requirement (Benatar's starting point). Intuition: We don't mourn the "lost happy lives" of the unconceived multitudes. A theory requiring us to maximize potential happy people leads to absurd obligations (Requirement 10). *[Flags tension with Requirement 2 - Benatar relies on this, but rejecting it challenges his asymmetry]*.

  6.  **Handle Variable Quality of Life Thresholds:** Must provide a plausible account of what constitutes a "life worth living" or "life not worth living" without relying on impossibly precise thresholds or collapsing into subjectivity.
      *   *Why:* Real-world procreative decisions involve uncertainty about future suffering and flourishing (e.g., severe vs. moderate disability, potential for future societal collapse). The theory must offer guidance without demanding clairvoyance.

  7.  **Integrate with Population Ethics (Addition vs. Selection):** Must distinguish the ethics of *adding* a person to the world from the ethics of *selecting* which person (or type of person) to bring into existence (e.g., embryo selection).
      *   *Why:* Intuitions differ (e.g., choosing to have a child *now* vs. choosing *which* embryo to implant based on genetic traits). The NIP often arises in selection cases. A theory must clarify if "creating *this* person" is the issue, or "creating *a* person with *these* traits".

  8.  **Accommodate Parental/Perspective Autonomy (Within Bounds):** Must allow space for reasonable parental desires and values in procreation without permitting the creation of predictably miserable lives or ignoring significant moral reasons against procreation.
      *   *Why:* Intuition that procreation is often a deeply personal choice, but not an *unrestricted* right (Requirement 3 binds it). A purely impersonal theory may feel alienating, but one overly deferential to autonomy ignores societal/potential person impacts.

  9.  **Address Future Uncertainty & Risk:** Must provide guidance when the future quality of a potential person's life is uncertain, incorporating both the probability and severity of potential harms and benefits.
      *   *Why:* Almost all real procreative decisions involve uncertainty (e.g., genetic risks, future societal stability, climate change impacts). The theory must avoid demanding certainty while not being overly permissive with risk.

  10. **Avoid Implausible Procreative Obligations:** Must not imply that we have a strong moral duty to procreate as much as possible to create more happy people, especially when existing people are flourishing.
      *   *Why:* The "Duty to Procreate" objection (e.g., if creating a happy person is good, why not create as many as possible?). Intuition: While having children can be good, we generally don't believe individuals are *obligated* to have children simply because they *could* create happy lives. *[Strongly linked to Requirement 5 & 2]*.

  **Key Tensions & The Breaker Requirement:**

  *   **Tension between 2 (Asymmetry) and 5 (Nonexistence Not Harmed):** Benatar uses 5 to *ground* 2. Theories rejecting 5 (e.g., some forms of utilitarianism) struggle to explain the core asymmetry intuition without collapsing into a duty to procreate (violating 10).
  *   **Tension between 4 (Avoid Repugnant Conclusion) and 10 (Avoid Procreative Obligations):** Total utilitarianism easily violates 4 and 10. Average utilitarianism avoids 4 but can violate 3 (by forbidding creating people below average, even if their lives are good) and struggles with NIP (1). Person-affecting views struggle with NIP (1) and future populations.
  *   **Tension between 1 (NIP) and 3 (Duty Not to Create Suffering):** NIP makes it hard to condemn creating a person with a life *worth* living but significant avoidable suffering (e.g., the "Risky Policy"). A theory must find a way to sometimes condemn creating such lives without invoking harm *to that specific person* in a way NIP blocks.

  **The Most Work-Eliminating Requirement: Requirement 5 (Explain Why Nonexistence Isn't Harmed / Doesn't Lack Goods).**

  *   **Why:** This requirement strikes at the heart of *why* we might *not* have an obligation to create happy people (addressing Requirement 10) and is foundational for Benatar's asymmetry (Requirement 2). Theories accepting that nonexistence *can* be deprived of goods (e.g., potential happy people *are* harmed by not being created) almost inevitably lead to strong procreative obligations (violating 10) and struggle immensely with the asymmetry intuition (2). Conversely, theories accepting Requirement 5 must then carefully build an account of why creating suffering *is* wrong (3) while creating happiness isn't obligatory (10), navigating the NIP (1) and avoiding the Repugnant Conclusion (4) – a very difficult task, as Benatar's own conclusions show. Rejecting or accepting Requirement 5 fundamentally shapes the entire structure of a procreative ethic and rules out large classes of theories immediately.
