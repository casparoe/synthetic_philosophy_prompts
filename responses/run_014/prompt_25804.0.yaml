    y: we are interested in the label for the purpose of the generalization? Actually, we are not doing standard supervised learning. We are gathering evidence about the generalization.

  We can think of each observation as an instance that either is a raven or not, and either black or not.

  **Evidence:**
  - E1: Observation of a black raven. (Raven and Black)
  - E2: Observation of a non-black non-raven (e.g., a white shoe). (Not Raven and Not Black)

  The paradox: E2 seems to confirm H1, but intuitively it shouldn't.

