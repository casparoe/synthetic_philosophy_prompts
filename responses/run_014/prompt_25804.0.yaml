  We are going to restate Hempel's raven paradox in the vocabulary of machine learning.

  **The Paradox in Original Form:**
  - Hypothesis: "All ravens are black." In logical terms: ∀x (Raven(x) → Black(x))
  - According to Hempel, this hypothesis is logically equivalent to its contrapositive: ∀x (¬Black(x) → ¬Raven(x)) which states that any non-black thing is not a raven.
  - Therefore, observing a non-black non-raven (e.g., a white shoe) should confirm the hypothesis.

  **Translation to ML Vocabulary:**

  Let's define:
  - The **hypothesis space** H: We consider two competing hypotheses?
    Actually, we are focusing on the generalization "all ravens are black". But note that in the Bayesian setting we need a set of hypotheses.

  We can think of the problem as having a set of possible worlds (or models) in which the generalization may or may not hold. However, to be concrete, we can consider a discrete set of hypotheses.

  Alternatively, we can model it as a binary classification problem: we are trying to learn the concept "raven" and we are interested in the feature "color" (black or not). But note the hypothesis is a universal generalization.

  We can model the hypothesis space as consisting of:
    H1: All ravens are black. (And non-ravens can be any color.)
    H2: There exists at least one non-black raven. (But note that H2 is the negation of H1, so we can have two hypotheses: H1 and ¬H1.)

  However, note that ¬H1 is a disjunction of many possibilities (any world with at least one non-black raven). This will be important.

  **Data:**
