  We assign prior probabilities to the hypotheses: P(H1) and P(¬H1). Note that P(¬H1) is the prior probability that there is at least one non-black raven.

  Now, we update with evidence.

  For E1 (black raven):
    P(E1 | H1) = 1 (if we assume that under H1 every raven is black, then we are certain to see a black raven when we see a raven? But note: we are sampling an object. We need to model the sampling.)

  We must model the data generating process. How are we sampling objects? This is crucial.

  Assume we are sampling objects from a distribution D over the space of objects. The space of objects is characterized by two attributes: 
