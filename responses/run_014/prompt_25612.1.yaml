answer: |-
  The Newton-to-Einstein transition offers a nuanced case study for the pessimistic meta-induction (PMI), neither decisively refuting it nor fully vindicating it, but demanding refinement of both the argument and realist responses.

  **Strengthening PMI?**  
  Superficially, the case supports PMI. Newtonian gravity was empirically triumphant for centuries yet was revealed by GR to be fundamentally incorrect in its core ontology (absolute space, instantaneous action) and gave inaccurate predictions (Mercury's perihelion). This directly exemplifies PMI's premise: highly successful theories can be strictly false. Anti-realists argue this pattern predicts the future falsity of current theories like quantum field theory or GR itself.

  **The Realist Defense: Approximate Truth & Structural Continuity**  
  Realists counter by emphasizing the **preservation** of Newtonian mechanics within GR:
  1.  **Approximate Truth:** Newtonian gravity provides highly accurate predictions under "low-energy, weak-field" conditions (e.g., planetary orbits except Mercury, engineering applications). Its core mathematical formalism (inverse-square law, conservation laws) is *recoverable* as a limiting case from the Einstein field equations.
  2.  **Structural Continuity:** The mathematical relationships describing phenomena like orbital motion and gravitational potential energy are retained, albeit embedded within a richer geometric framework. The *structure* of the theory, particularly its dynamical laws, exhibits significant continuity.

  This preservation suggests Newtonian gravity wasn't *simply false* but *approximately true* within its domain of applicability. Realists argue PMI overlooks this selective retention of successful elements: while the ontology and fundamental mechanisms change, the empirically successful mathematical core and predictive content are often incorporated into the successor theory, indicating progress towards truth.

  **Refining PMI and the Challenge to Realism**  
  The episode forces a refinement of PMI. Anti-realists must concede that successful theories aren't always *completely* discarded; parts survive. However, they can reformulate PMI:
  *   **The "Grain" Problem:** PMI can be sharpened to target the *fundamental ontological claims* and *universal scope* of theories. Newton posited absolute space and universal instantaneous action – these core commitments *were* falsified and abandoned. GR replaced them with a radically different ontology (spacetime curvature). Anti-realists argue that while mathematical structures may be retained pragmatically, the *interpretive layer* claiming to describe fundamental reality is reliably overturned.
  *   **Survival ≠ Truth:** The mere survival of a theory as an approximation within its domain doesn't prove its fundamental truth. Newton survives *because* it's useful, not necessarily because its core concepts (like gravitational force as a fundamental entity) correspond to reality. The radical ontological shift remains significant.

  **Conclusion: A Stalemate Demanding Nuance**  
  The Newton-Einstein transition neither crushes realism nor lets it off the hook.
  *   It **weakens** simplistic versions of PMI that imply total falsification and discontinuity by demonstrating impressive structural and predictive continuity. The realist appeal to approximate truth and structural retention gains significant credence from this paradigmatic case.
  *   However, it **strengthens** a refined PMI focused on the vulnerability of fundamental ontological commitments and universal claims. The radical conceptual shift regarding space, time, and gravity's mechanism remains a powerful example of deep theoretical discontinuity at the interpretative level.
  *   It **forces refinement** on both sides. Realists must explain why we should trust the *ontological* claims of current theories when history shows even the most successful interpretations are overturned, despite structural continuity. Anti-realists must acknowledge the robust, selective preservation of successful mathematical structures and empirical content, moving beyond claims of simple falsification. The episode highlights that theory change involves both continuity *and* rupture, making the debate more complex than either side often portrays.
