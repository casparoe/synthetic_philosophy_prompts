prompt: |-
  I cover science and ideas as a freelancer and I am stuck on a story about teen mental health screening.

  Advocates and a couple clinic spokespeople I interviewed keep saying depression is like diabetes when they want destigmatization and parity coverage, like it is just body chemistry that does not care what you call it or what TikTok says about it.

  But that felt off after what I saw last month at a high school pilot near Cleveland where kids got a 12 question checkin for attention burnout, and within two weeks they were comparing scores in the hallway, making memes about being high scorers, acting more checked out, and then teachers started treating them as checked out, which kinda changed what the label even picked out. Diabetes does not do that when you learn the word for it, right?

  Can you audit the diabetes comparison for me in light of that looping idea from Hacking where a classification changes people and that then changes the classification itself? I need exactly five numbered points, one or two sentences each, with no intro or conclusion: 1 what lines up between diabetes and depression, 2 where the comparison falls apart because of looping, 3 what it quietly drags over from diabetes that depression does not have, 4 if the destigmatize it and fund it like a bodily illness push still stands, 5 what everyday comparison would mislead less. Keep it plain for a general audience and sorry for teh rush, my editor is strict about thier length limit.
reasoning: |-
  Okay, the user is a freelance science writer stuck on a story about teen mental health screening. They're questioning the common comparison between depression and diabetes used for destigmatization. Their observation at a Cleveland high school showed that after depression screening, teens started comparing scores, making memes, and acting more checked out—which then affected how teachers treated them. This seems like looping, where the label changes behavior, which then reinforces the label. They want me to audit the diabetes analogy using Ian Hacking's concept of looping effects.

  The user needs five specific numbered points comparing depression and diabetes through this lens. Each point must be one or two sentences, no intro or conclusion, plain language for general audiences. Their editor has strict length limits so I need to be concise. Points should cover: 1) where analogy holds, 2) where looping breaks it, 3) what the analogy falsely imports from diabetes, 4) whether destigmatization argument still works, and 5) a better comparison.

  First, for point 1: The valid parallel is biological basis—both involve measurable body chemistry (blood sugar vs. neurotransmitter levels) and respond to medical treatment. That's the core argument advocates use.

  For point 2: The key difference is looping. Depression labels can reshape identity and behavior in ways that reinforce the diagnosis (like teens "performing" high scores), whereas diabetes diagnosis doesn't change pancreatic function. This matches the high school observation perfectly.

  Point 3: The analogy smuggles in diabetes' stability—a diabetes diagnosis doesn't alter the disease course, but depression's social perception directly impacts symptoms. That's crucial context the comparison hides.

  Point 4: Destigmatization and funding arguments still stand because medical framing reduces blame, even with looping risks. But we must acknowledge that depression interacts with society differently than diabetes.

  Point 5: A better comparison might be chronic fatigue syndrome or chronic pain—conditions where diagnosis can influence symptom experience through attention and expectation, but without implying the same biological stability as diabetes. 

  I'll keep phrasing tight: active verbs, no jargon, and root each point in the user's hallway observations. The tone should stay helpful—they're on deadline and this seems to be a key insight for their story.
answer: |-
  Here are five numbered points auditing the diabetes comparison for your mental health screening story:

  1.  **Both involve measurable biological processes:** Like diabetes shows in blood sugar levels, depression correlates with brain chemistry changes, supporting medical treatment and reducing "just try harder" blame.
  2.  **Depression diagnosis can trigger behavioral feedback loops:** Labeling can change how teens see themselves ("high scorers") and act, influencing symptoms and how others treat them, unlike a diabetes label which doesn't alter pancreas function.
  3.  **It assumes diagnosis doesn't alter the illness:** Diabetes is stable post-diagnosis; depression's social nature means the label itself can worsen isolation or performance, changing what's being measured.
  4.  **The core push for parity still holds merit:** Framing depression biologically *does* combat stigma and argues for insurance coverage similar to physical illnesses, despite the looping complication.
  5.  **Chronic pain might mislead less:** Like pain, depression involves biology *and* perception, where focus on symptoms (or a label) can amplify the experience, but it lacks diabetes's clear, unchanging biological marker.
