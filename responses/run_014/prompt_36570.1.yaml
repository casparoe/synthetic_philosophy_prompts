  "Eternity Coin leverages the unimpeachable laws of probability," said Dr. Helena Voss, Chief Actuary. "A fair coin is flipped until it lands heads. If the first heads occurs on flip *n*, the payout is **$2ⁿ**. The expected value is the sum of all possible outcomes: $2(½) + $4(¼) + $8(⅛) + ... ad infinitum. This series diverges to infinity. Mathematically, no rational actor should refuse to play at any price."  

  Marketing materials emphasize this infinite expectation with taglines like **"Your Ticket to Limitless Wealth"** and **"Pay Any Price, Win More—Eventually."** The casino highlights that 50% of players win at least $2, while "visionaries" could secure payouts dwarfing global GDP.  

