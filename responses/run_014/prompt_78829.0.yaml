  The collapse argument feels strongest. If neutrality can justify both turban bans and religious freedom, the principle isn't guiding outcomes - majoritarian politics is. The Alsace-Moselle exception is damning: the majority keeps its state-funded priests while minorities get "neutrality." That's exactly the unfairness the principle should prevent.

