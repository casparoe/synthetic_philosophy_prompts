prompt: |-
  I'm starting a dissertation chapter on the "equality of what?" debate and before I evaluate welfarism, resourcism, and the capabilities approach, I want the full spec of what a theory of the metric of equality actually has to deliver. What are the cases it must get right, the distinctions it can't collapse (like the distinction between the metric and the principle — I don't want to accidentally build distributive-rule assumptions into the metric), the empirical facts from psychology or economics it has to be consistent with, and so on. For each desideratum, give me the case or consideration that motivates it, and flag which are genuine requirements and which are just, like, one theorist's pet constraint dressed up as a neutral starting point. If any subset of the desiderata are jointly unsatisfiable — if you basically can't have a metric that both respects individual responsibility and handles adaptive preferences, or whatever — tell me that, because that's the kind of thing that restructures the whole debate. And tell me which single requirement, if you take it seriously, does the most damage to the most theories. Don't bother scoring the actual views; I'll do that.
reasoning: |-
  Okay, the user is starting a dissertation chapter on the "equality of what?" debate and wants a comprehensive specification for what a theory of the metric of equality must deliver. They plan to evaluate welfarism, resourcism, and capabilities approach next. Let me unpack what they're asking for.

  First, they want the full set of criteria a metric theory must satisfy. That includes cases it must handle correctly, distinctions it shouldn't collapse (like metric vs. distributive principle), empirical constraints from psychology/economics, and potential conflicts between desiderata. They specifically want motivations for each requirement and warnings about which are truly essential versus theory-laden. They also need to know about any fundamental incompatibilities (like responsibility vs. adaptive preferences) and which single requirement causes the most trouble for existing theories.

  Hmm, this is clearly advanced academic work - they're at the dissertation stage and thinking like a professional philosopher, anticipating conceptual traps. The "don't score actual views" request shows they want a neutral framework for their own analysis. Underneath this, they probably want to avoid dead-end arguments by spotting contradictions early, and may be anxious about missing key literature or debates.

  Let me structure this systematically. The core challenge is balancing theoretical rigor with real-world applicability. I'll organize desiderata into: Core Conceptual Jobs (what the metric fundamentally must do), Non-Collapsible Distinctions (critical separations), Empirical Constraints (real-world data it must respect), and Conflict Zones (where trade-offs emerge).

  For Core Conceptual Jobs: The metric must compare advantage across diverse lives. Cases: wheelchair user needing ramps vs. stairs (shows conversion factors), religious fasting vs. starvation (shows pluralism of ends). This is non-negotiable - if it can't do this, it fails as a metric.

  Non-Collapsible Distinctions include: Metric vs. Distributive Principle (e.g., "equal resources" already builds in resourcist bias - dangerous!), Responsibility Cut vs. Outcome (Sen's famous "equality of what?" paper shows this). These are genuine requirements; collapsing them circularly defines solutions by assumptions.

  Empirical Constraints: Psychological adaptation (disabled people reporting happiness doesn't negate disadvantage), positional goods (healthcare access in unequal societies). Must accommodate these unless abandoning realism - but some theorists (like strict resourcists) downplay adaptation evidence.

  Now the explosive part: Conflict Zones. Responsibility vs. Adaptive Preferences is the big one - holding people responsible requires measuring chosen outcomes, but adaptation means preferences align with oppression. Also, Pluralism vs. Measurability - diverse goods resist easy comparison. These tensions restructure debates; the former cripples welfarism, the latter challenges capabilities.

  The Responsibility/Adaptation conflict is probably the most damaging single requirement. Taking it seriously forces welfarists into contortions with preferences, pressures resourcism on expensive tastes, and leaves capabilities struggling with paternalism. It's where most theories bleed.

  I should flag which desiderata are contested. For example, "responsibility" is libertarian-leaning, while anti-paternalism might reject any preference filtering. The key is showing how these tensions force either compromise or theory modification. Also note that empirical claims (like adaptation studies) can be weaponized by different sides.

  This gives them a battle map: where metrics must stand firm, where they might bend, and where they break. The unresolved tensions become their critical analysis tools later.
answer: |-
  Here’s a rigorous specification for a theory of the "metric of equality," distilled from philosophical debates and designed to scaffold your evaluation. Desiderata are categorized, motivated by cases, and flagged for status (core requirement vs. contested). Key tensions are highlighted.

  ---

  ### **I. Core Conceptual Jobs: What the Metric Must Do**
  1. **Interpersonal Comparability**  
     - *Requirement:* Enable comparisons of advantage/disadvantage across diverse individuals.  
     - *Motivating Case:* Comparing a wheelchair user’s access to public spaces with an able-bodied person’s. If the metric can’t compare across different needs, it fails as an egalitarian tool.  
     - *Status:* **Core**. Non-negotiable for any theory of equality.  

  2. **Pluralism about the Good**  
     - *Requirement:* Accommodate diverse conceptions of a good life without imposing a single value.  
     - *Motivating Case:* A monk who values spiritual asceticism vs. a hedonist who values luxury. Collapsing these into a single good (e.g., income) distorts disadvantage.  
     - *Status:* **Core** for liberal theories (Dworkin, Sen), contested by monists (e.g., strict utilitarians).  

  ---

  ### **II. Non-Collapsible Distinctions: What the Metric Must NOT Do**  
  3. **Metric ≠ Distributive Principle**  
     - *Requirement:* Define "advantage" independently of how it *should* be distributed.  
     - *Motivating Case:* Resourcism defining advantage as "resources" risks assuming equality *of resources* is just. But if disabilities create unequal resource conversion, the metric may misdiagnose disadvantage.  
     - *Status:* **Core**. Building distribution into the metric circularly rigs the debate (e.g., Rawls’ primary goods vs. his difference principle).  

  4. **Responsibility Cut ≠ Outcome Assessment**  
     - *Requirement:* Separate the *measurement* of advantage from judgments about personal responsibility.  
     - *Motivating Case:* Two unemployed people: one choosy (responsible), one structurally disadvantaged. The metric must identify disadvantage *before* assigning blame.  
     - *Status:* **Core** for luck-egalitarians (Cohen, Dworkin); contested by outcome-egalitarians.  

  ---

  ### **III. Empirical Constraints: Consistency with Real-World Facts**  
  5. **Adaptive Preferences & Psychology**  
     - *Requirement:* Account for preference deformation under oppression/hardship (e.g., deprived groups reporting high satisfaction).  
     - *Motivating Case:* A woman in a patriarchal society who "prefers" domestic servitude. Welfarism that takes preferences at face value masks injustice.  
     - *Status:* **Core** for capabilities/recognition theorists (Nussbaum, Sen); often downplayed by welfarists.  
     - *Evidence:* Psychology of learned helplessness (Seligman), ethnographic studies of oppressed groups.  

  6. **Conversion Factors**  
     - *Requirement:* Acknowledge that resources/goods yield different advantages based on personal/social traits.  
     - *Motivating Case:* Insulin’s value to a diabetic vs. a non-diabetic; a wheelchair’s value on cobblestone vs. smooth streets.  
     - *Status:* **Core** for capabilities/resourcism (via Dworkin’s "tastes vs. resources"); welfarism ignores this.  
     - *Evidence:* Health economics (QALYs), disability studies.  

  7. **Positional Goods & Relationality**  
     - *Requirement:* Address goods whose value depends on others’ holdings (e.g., education, political voice).  
     - *Motivating Case:* Access to elite education in a high-inequality society. Equal resources may not secure equal *opportunity*.  
     - *Status:* **Contested** (emphasized by Anderson, Tawney); often sidelined in resourcism/welfarism.  

  ---

  ### **IV. Normative Desiderata: Contested but Influential**  
  8. **Responsibility Sensitivity**  
     - *Requirement:* Allow distinctions between disadvantage due to circumstances vs. choice.  
     - *Motivating Case:* Expensive tastes (Dworkin’s claret lover vs. beer drinker). Should equality subsidize chosen luxury preferences?  
     - *Status:* **Contested** (central for luck-egalitarians; rejected by sufficientarians/relational egalitarians).  

  9. **Non-Paternalism/Agency**  
     - *Requirement:* Respect individuals’ authority over their own conception of the good.  
     - *Motivating Case:* Forcing a vegan to eat meat for "nutritional equality." Metrics imposing external values undermine autonomy.  
     - *Status:* **Contested** but widely endorsed (Nussbaum’s "threshold" vs. Sen’s open-ended capabilities).  

  10. **Feasibility & Measurability**  
      - *Requirement:* Be practically operationalizable for policy.  
      - *Motivating Case:* Capabilities lists may be too vague for policy (e.g., "ability to play" vs. income metrics).  
      - *Status:* **Pragmatic constraint** often weaponized (e.g., resourcists vs. capabilities advocates).  

  ---

  ### **V. The Nuclear Tensions: Where Theories Break**  
  #### **A. Responsibility vs. Adaptive Preferences (The Killer Conflict)**  
  - **Problem**: Holding people responsible requires measuring *chosen outcomes*, but adaptive preferences mean choices may reflect oppression, not genuine advantage.  
  - **Case**: A sweatshop worker who "chooses" 16-hour days. Responsibility-sensitive metrics (e.g., resourcism) might see this as voluntary, masking exploitation.  
  - **Impact**: Cripples welfarism (can’t handle adaptation) *and* resourcism (can’t distinguish choice from deformed preferences). Capabilities struggle to set non-paternalistic thresholds.  
  - **Verdict**: **Jointly unsatisfiable** in pure form. Most theories sacrifice one (e.g., capabilities drop responsibility; Dworkin resourcism downplays adaptation).  

  #### **B. Pluralism vs. Measurability**  
  - **Problem**: Pluralism demands context-sensitive advantage assessments, but policy needs standardized metrics.  
  - **Case**: How to compare "religious fulfillment" with "nutritional health" for resource allocation?  
  - **Impact**: Forces capabilities theorists toward lists (Nussbaum) or vague frameworks (Sen); welfarism/resourcism oversimplify.  

  ---

  ### **The Single Most Damaging Requirement**  
  **Adaptive Preferences**  
  - **Why**: If taken seriously, it:  
    - **Destroys welfarism** (preferences aren’t reliable indicators of advantage).  
    - **Pressures resourcism** (resources may not convert to genuine advantage if preferences are deformed).  
    - **Forces capabilities** into paternalism or indeterminacy (who defines "capability deprivation" if preferences adapt?).  
  - **Theorists Hate This**: Welfarists (Harsanyi) dismiss adaptation; resourcists (Dworkin) treat preferences as "tastes" subject to insurance markets.  

  ---

  ### **Quick Reference: Desiderata Status**  
  | **Desideratum**               | **Status**                     | **Threatens**                          |  
  |-------------------------------|--------------------------------|----------------------------------------|  
  | Interpersonal Comparability   | Core                           | None (table stakes)                    |  
  | Pluralism                     | Core (liberal theories)        | Monistic metrics (e.g., GDP focus)     |  
  | Metric ≠ Distribution         | Core                           | Theories conflating them (e.g., naive equality of resources) |  
  | Adaptation                    | Core (empirically motivated)   | **Welfarism most**, all others somewhat |  
  | Responsibility Sensitivity    | Contested (luck-egalitarian)   | Egalitarianism ignoring choice         |  
  | Non-Paternalism               | Contested (liberal)            | Paternalistic capabilities/metrics     |  

  ---

  ### **Your Next Move**  
  Use this framework to stress-test:  
  - **Welfarism**: Can it handle adaptation without ad-hoc adjustments?  
  - **Resourcism**: Does it covertly build distributive rules (e.g., via "ambitionsensitivity")?  
  - **Capabilities**: Does it collapse into paternalism or indeterminacy under adaptation/responsibility pressures?  

  **The dynamite insight**: The adaptation/responsibility conflict is *the* engine of the debate. How a theory navigates it reveals its normative bones.
