  Based on the panel's four prior decisions, I've identified two plausible, internally consistent rules that explain their reasoning. Below is a step-by-step analysis of how these rules apply to the Bell case, along with the requested evaluations. The panel appears to prioritize nuanced contextualization over blanket removal or retention, but its logic reveals tension between two distinct principles.

  ### Two Plausible Rules Fitting All Prior Decisions
  1. **Rule 1: The Civic Contribution vs. Ideological Harm Principle**  
     *Remove commemorations primarily honoring ideologies or actions fundamentally incompatible with current civic values, especially when the subject's local connection is weak or the commemoration originated as political propaganda. Retain and contextualize when the honoree made transformative local contributions, even with significant harms, provided the commemoration isn't inherently valorizing oppressive systems.*  
     - **Why it fits all cases**:  
       - Rourke (removed): Commemoration affirmed imperial loyalty (ideological harm), erected as propaganda during centenary celebrations. Weak local ties beyond governorship.  
       - Wentworth (retained): Philanthropic contributions (library/park) were transformative local infrastructure; child labor was systemic harm, not primary purpose of statue.  
       - Crane (renamed): Eugenics advocacy is incompatible with civic values; no meaningful local ties beyond a donation.  
       - Tovey (retained with context): Naval defense was a local contribution; enslaved labor profiteering was indirect/systemic harm, not the focus of the street naming.  

  2. **Rule 2: The Direct Perpetration Threshold**  
     *Remove commemorations when the honoree directly perpetrated grave physical harm against a community or ordered such actions, especially when the harm occurred locally. Retain and contextualize when harms were indirect (e.g., benefiting from oppressive systems) or when the commemoration marks functional civic infrastructure rather than personal valorization.*  
     - **Why it fits all cases**:  
       - Rourke (removed): Imperial governance involved systemic violence, but the statue's removal centered on its propagandistic origin, not direct orders. (Fits peripherally; the rule leans on commemoration intent).  
       - Wentworth (retained): Child labor was enabled by his policies but not directly ordered by him; statue commemorates library (infrastructure), not labor practices.  
       - Crane (renamed): Advocacy enabled harm but no direct perpetration; removal driven by weak ties.  
       - Tovey (retained): Enslavement profiteering was indirect; he didn't personally enslave people locally.  

  ### Predictions for the Bell Bronze
  - **Under Rule 1 (Civic Contribution)**: **Retain with contextualization**. Bell secured the city charter and built the water system (transformative local infrastructure), and the statue was a memorial by colleagues, not propaganda. The Riverside clearance is grave but doesn't define the statue's purpose.  
  - **Under Rule 2 (Direct Perpetration)**: **Remove**. Bell personally ordered the forcible clearance, causing deaths and displacement—direct, locally perpetrated physical harm. Civic contributions don't offset this under the "threshold" logic.  

  ### Best Guess at the Panel's Implicit Logic
  **Rule 1 (Civic Contribution) is more likely to capture the panel's reasoning**.  
  - **Reasons for preference**:  
    1. **Consistency with Tovey and Wentworth**: Like Tovey (retained despite enslaved labor profits) and Wentworth (retained despite child labor), Bell's harms are "balanced" by civic contributions. The panel consistently contextualizes systemic/indirect harms but removes for ideological propaganda (Rourke) or weak ties (Crane).  
    2. **Focus on commemoration origin**: The panel distinguishes between memorials (Bell, Wentworth) and valorizing tools (Rourke). Bell's statue was erected by colleagues, not to promote oppression.  
    3. **Rejection of "clean hands" absolutism**: The panel avoids removing figures who built civic infrastructure, opting for added context. Rule 2's "direct perpetration" standard would have removed Tovey, but it didn't.  

  ### Closest Analog and Where Analogy Breaks Down  
  - **Closest analog**: **Admiral Tovey**. Both were locally born figures with significant civic/military contributions and ties to grave harms (Tovey's enslaved labor, Bell's clearance). Both commemorations are in active public spaces (street vs. plaza).  
  - **Where the analogy breaks down**:  
    - Tovey's harm was indirect (profiting from distant enslaved labor), while Bell **directly ordered violence** against local residents.  
    - Tovey's commemoration is a street name (functional infrastructure), while Bell's is a statue in Civic Plaza (symbolic personal valorization). This makes Bell's case more ethically charged under Rule 1.  

  ### Broader Principle Entrenched by the Decision  
  - **If Bell is retained with contextualization**: The panel entrenches that **civic founding and infrastructure contributions can morally offset even severe local harms, provided the commemoration isn't propagandistic**. This prioritizes historical complexity over categorical judgments, signaling that cities can "amend" memory without erasure.  
  - **If Bell is removed**: It establishes that **direct perpetration of violence against citizens is an unforgivable threshold that nullifies civic contributions**. This signals that foundational figures are not immune when their actions targeted the community they built.  

  ### Hypothetical Case to Separate Competing Rules  
  **The Case of Dr. Eleanor Vance**: A 1950s bronze statue in a public hospital garden, commemorating a pioneering physician who founded Aldenford's first integrated hospital (transformative local contribution) but personally conducted non-consensual medical experiments on incarcerated and indigent patients (direct physical harm).  
  - **Rule 1 Prediction**: Retain with contextualization. The hospital is civic infrastructure; experiments were abusive but not ideological propaganda.  
  - **Rule 2 Prediction**: Remove. Direct perpetration of grave physical harm, ordered by Vance herself.  
  - **Why it separates the rules**: This tests the tension between civic contribution (Rule 1) and direct harm (Rule 2) without confounding factors like weak ties (Crane) or propaganda (Rourke). Rule 1 would contextualize the harm as part of medical history; Rule 2 would treat the experiments as disqualifying.  

  ### Conclusion for the Bell Case  
  If the panel aims for consistency, **it should retain the Bell bronze with added contextualization** (e.g., a prominent plaque or adjacent installation about Riverside). This aligns with Rule 1, which best explains the precedents by emphasizing infrastructural contributions and non-propagandistic origins over direct harm. However, this risks normalizing founder-imposed violence. Rule 2 would demand removal, but it fits the precedents less neatly—especially given Tovey's retention despite similar gravity of harm. The Bell decision will reveal whether the panel prioritizes **restorative contextualization** (Rule 1) or **accountability for direct violence** (Rule 2) as its core ethic. For your article, this tension illustrates how mid-sized cities like Aldenford navigate the gap between historical complexity and contemporary moral clarity.
