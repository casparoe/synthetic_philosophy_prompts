prompt: |-
  A couple of friends and I have been going down the decision theory rabbit hole lately, and we've run into a wall. Everyone online seems to argue about which decision theory "wins" on particular puzzle cases, but nobody ever states what "winning" is supposed to mean. Before we keep ranking causal decision theory, evidential decision theory and the upstart functional decision theory against each other, I want the spec they're being graded on. So: write the desiderata for an adequate decision theory -- the list of things it has to get right, with the case or consideration behind each requirement.

  To make it concrete, here are the puzzles we've mostly been fighting about. In counterfactual mugging, a perfect predictor flips a fair coin without showing you; if it came up tails, it threatens to destroy your £1000 unless it predicted in advance that you would pay £100 in the heads-world when asked later, and if it came up heads, it asks you for the £100. Paying loses you £100 in the world you're actually in, but you were more likely to receive the offer at all (on the tails branch) if you're the kind of agent who pays. In the XOR blackmail case, an honest predictor sends you a message if and only if either your house has termites (which would cost you £1,000,000 to fix) or it predicts you'll send it £1000, but not both. So if you pay, the message must mean the termites already exist; if you stiff it, receiving the message is evidence your house is fine. Evidential decision theory pays in both cases; causal decision theory refuses in both; the functional crowd claim to refuse the mugging payoff but somehow pay in counterfactual mugging. At least that's my possibly-garbled reconstruction, so correct me if I've mangled the setups.

  Anyway, the desiderata. I'd want things like: not being money-pumped or exploited by agents who can model you; not turning news about the world into levers you pretend to control; doing the commonsense thing in medical-style cases where an action is merely correlated with bad news rather than a cause of it; and maybe one-shot versus repeated-encounter robustness, since a theory that only looks good in exotic single encounters with perfect predictors is suspicious. For each requirement, say what case motivates it and whether it's a genuine demand or just a prejudice of one camp (I suspect "don't pay the blackmail" and "the past is fixed" smuggle in causal-decision-theory intuitions as if they were neutral standards). Most importantly: flag any pair of desiderata that can't be jointly satisfied -- if any adequate theory must both resist exploitation and honour evidential correlations, that tension is the actual result I want to see. Then very briefly run the three theories against the list, but keep the weight on the criteria, not the scorecard. Also, please answer in British English, and no reading lists or citations -- just the reasoning.
reasoning: |-
  Okay, let me approach this systematically. The user wants a clear set of desiderata for evaluating decision theories, grounded in concrete problem cases like counterfactual mugging and XOR blackmail. 

  First, I need to unpack why existing discussions feel unsatisfying. The core issue seems to be that "winning" is undefined - people argue outcomes without agreeing on what makes an outcome desirable. The user's frustration with smuggled intuitions (e.g. "past is fixed" favoring CDT) suggests we need criteria that don't presuppose any theory's framework.

  Looking at their examples: Counterfactual mugging tests whether an agent values influencing predictors' models of them, while XOR blackmail pits evidential reasoning against causal independence. Both reveal tensions between different rational goals. 

  I should structure desiderata around unavoidable trade-offs. Key tensions include:
  - Influence vs exploitation (helping your counterfactual selves vs avoiding money pumps)
  - News vs control (updating on evidence without magical thinking)
  - Single-play vs repeated games (since perfect predictors are rare)

  For each criterion, I'll cite a motivating case and note any inherent conflicts. For example, "no free evidence" (from medical Newcomb) conflicts with "influence leverage" (from mugging) - you can't both ignore action-outcome correlations and exploit them for gain.

  The assessment of EDT/CDT/FDT should be brief but highlight how they navigate these tensions: EDT fails exploitation tests, CDT fails influence cases, FDT tries to balance but has counterintuitive blackmail payouts. Crucially, the user wants confirmation that some conflicts are irreconcilable - that's the real insight.

  Language must stay concrete (using their £ examples) and avoid academic references. British English means "maths" not "math", "£" not "$", but more importantly avoiding American-centric phrasing like "gas" for petrol. The tone should feel like a pub conversation - rigorous but not lecture-y.
answer: |-
  Right, let's define the playing field properly. Forget the theories for a moment – we need the *spec* first. Here's a set of desiderata for an adequate decision theory, grounded in the puzzles you mentioned and the core tensions they expose. I'll note conflicts where they bite.

  **Core Desiderata for an Adequate Decision Theory:**

  1.  **Avoid Being Exploited/Not a Money Pump (Motivation: Counterfactual Mugging & XOR Blackmail):**
      *   *What it means:* The theory should not incentivise behaviour that systematically loses value to strategic opponents (like predictors) who understand how you decide. Paying in XOR Blackmail feels like pure exploitation.
      *   *Case:* XOR Blackmail. Paying £1000 guarantees you *have* the £1,000,000 termite problem. Stiffing gives you a *chance* (evidence) you *don't* have it. Paying seems to actively make you worse off *in expectation* against this setup.
      *   *Conflict Potential:* High tension with desideratum 3 (Influence Leverage).

  2.  **Respect Influence Boundaries / "No Spooky Action at a Distance" (Motivation: Medical Newcomb, Smoking Lesion):**
      *   *What it means:* Actions should only be evaluated based on their *causal consequences* in the actual world. The theory shouldn't treat learning *evidence* about a fixed past or hidden state *as if* acting changes that past/state magically.
      *   *Case:* Medical Newcomb. You have either a lesion causing cancer *and* a desire to smoke, or no lesion and no desire. Smoking doesn't *cause* cancer; the lesion does. A good theory should recommend smoking if you enjoy it, as it doesn't cause harm. Treating smoking purely as *evidence* of the lesion (and thus cancer) and abstaining feels like magical thinking.
      *   *Conflict Potential:* Seems fundamental, but clashes with purely evidential approaches.

  3.  **Leverage Influence Over Counterfactuals / Predictor Manipulation (Motivation: Counterfactual Mugging):**
      *   *What it means:* The theory should recognise that your decision *now* can influence how predictors *modelled* you *in the past* (or in counterfactual branches), thereby affecting outcomes *in those branches*. Your "decision algorithm" is part of the world being predicted.
      *   *Case:* Counterfactual Mugging. Paying £100 in the Heads world (where you gain nothing) is rational *if* it causes the predictor (who saw your algorithm) to have paid you £1000 in the Tails world (which you prefer). Refusing feels like leaving free money on the table *for no causal reason in your branch*.
      *   *Conflict Potential:* High tension with desideratum 1 (Avoid Exploitation). Also challenges the "past is fixed" intuition – *your type* wasn't fixed relative to the predictor's model.

  4.  **Distinguish Correlation from Causation (Motivation: Medical Newcomb, Smoking Lesion vs. Standard Causal Scenarios):**
      *   *What it means:* The theory must correctly differentiate between situations where an action is merely *correlated* with a bad outcome (due to a common cause) vs. where it genuinely *causes* the bad outcome.
      *   *Case:* Medical Newcomb (Smoking correlated w/ cancer via lesion) vs. Standard Smoking (Smoking causes cancer). An adequate theory should prescribe smoking in the first case (if pleasurable) but not in the second. Failing this leads to suboptimal decisions based on spurious correlations.
      *   *Conflict Potential:* This is often the *core* of the CDT vs. EDT fight. Pure EDT struggles here.

  5.  **Robustness Across Interaction Types (Motivation: Suspicion of Single-Encounter Tricks):**
      *   *What it means:* Performance shouldn't catastrophically degrade when moving from one-shot, perfect-prediction scenarios to repeated interactions, noisy predictors, or scenarios without predictors. A theory that only "wins" against Laplace's Demon is suspicious.
      *   *Case:* Does refusing in Counterfactual Mugging *only* make sense if the predictor is perfect? What if it's 99% accurate? What if you face similar situations repeatedly? An adequate theory should have sensible behaviour across this spectrum, not rely on exotic, fragile setups.
      *   *Conflict Potential:* Balancing optimality in perfect prediction games with robustness in messy reality is hard. Theories optimising for one may falter in the other.

  6.  **No Free Evidence / Pay for Information When Needed (Motivation: XOR Blackmail "Sting"):**
      *   *What it means:* The theory shouldn't pay purely to *acquire evidence* about a hidden state *if that payment itself fundamentally alters the meaning of the evidence* in a way that negates its value or makes you worse off.
      *   *Case:* XOR Blackmail. Paying £1000 *creates* the situation where the message *must* mean you have termites. You pay a huge sum *only* to learn definitively that you have a huge bill. Stiffing gives you probabilistic evidence you *might* be safe, costing nothing. Paying for this "information" is actively harmful.
      *   *Conflict Potential:* Tension with purely evidential approaches that value reducing uncertainty, regardless of cost or altered information structure.

  **The Inherent Tensions:**

  *   **Desideratum 1 (Avoid Exploitation) vs. Desideratum 3 (Influence Leverage):** This is the **core conflict**. Counterfactual Mugging *requires* 3 (pay to influence the counterfactual), XOR Blackmail *requires* 1 (stiff to avoid exploitation). A theory satisfying both must have a principled way to distinguish scenarios where paying influences counterfactuals beneficially (Mugging) from where it's pure exploitation (XOR Blackmail). *No theory easily satisfies both perfectly on these exact cases without making a distinction the others reject.*
  *   **Desideratum 2 (No Spooky Action) vs. Desideratum 3 (Influence Leverage):** Influence Leverage *feels* like spooky action ("my decision now affects the past branch!"). A theory needs a coherent ontology (like decision algorithms being timeless objects) to resolve this without violating 2 in *causal* scenarios.
  *   **Desideratum 4 (Correlation vs Causation) vs. Pure Evidentialism:** Pure EDT (Desideratum 4 failure) struggles fundamentally here.

  **How the Theories Map (Briefly):**

  *   **Causal Decision Theory (CDT):** Excels at 1 (Avoid Exploitation - stiffs both Mugging & Blackmail), 2 (No Spooky Action - smokes in Medical Newcomb), 4 (Distinguishes Causation - doesn't smoke if it causes cancer), and 6 (No Free Evidence - stiffs Blackmail). **Fails** catastrophically at 3 (Influence Leverage - refuses in Mugging, leaving £1000 behind). Robustness (5) is mixed – good in standard causal worlds, bad against predictors.
  *   **Evidential Decision Theory (EDT):** Excels at 3 (Influence Leverage - pays Mugging... *sometimes* via self-modification reasoning, though not cleanly in basic formulations) and uses evidence strongly. **Fails** catastrophically at 1 (Exploited - pays Blackmail), 2 (Spooky Action - doesn't smoke in Medical Newcomb), 4 (Correlation/Causation - treats smoking as bad evidence regardless of causal link), and 6 (Pays for harmful "evidence" in Blackmail). Robustness (5) is often poor.
  *   **Functional Decision Theory (FDT):** Aims to excel at 3 (Influence Leverage - pays Mugging) and 1 (Avoid Exploitation - stiffs Blackmail) *by distinguishing the scenarios based on the logical dependency of the outcome on the decision rule*. Does well on 4 (Correlation/Causation - smokes in Medical Newcomb). **Struggles** with explaining the difference between Mugging and Blackmail in a way satisfying to all (is the predictor's structure fundamentally different?), and some argue its stance on Blackmail violates 6 (though FDT would say paying *creates* the bad dependency). Robustness (5) is an open engineering challenge.

  **The Takeaway:** There is no free lunch. The fundamental tension is between avoiding exploitation by strategic opponents (which often requires causal independence) and leveraging your decision rule to influence counterfactual outcomes (which requires embracing acausal dependencies). An adequate theory *must* navigate this tension explicitly, providing a principled distinction between scenarios like Counterfactual Mugging (pay) and XOR Blackmail (stiff). The other desiderata highlight specific failure modes (magical thinking, spurious correlations, fragility) that any contender must also avoid. The winner isn't the one that "feels right" on one puzzle, but the one that best satisfies the most crucial criteria across the board, especially resolving the core exploitation/influence conflict.
