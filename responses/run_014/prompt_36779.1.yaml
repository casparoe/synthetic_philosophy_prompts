answer: |-
  Your friend's pattern of decisions suggests she is applying a straightforward causal decision theory (CDT), which evaluates actions based solely on their causal consequences, ignoring evidential or correlational aspects. In CDT, an agent considers only how their choice directly influences outcomes, without regard for what that choice might signal about the world or other dependencies. This fits her verdicts perfectly: in the smoking lesion case, she smokes because smoking doesn't cause cancer, so the lesion's correlation is irrelevant; in XOR blackmail, she refuses to pay because paying doesn't prevent the infestation—it only costs money; in the coin-flip Newcomb, she takes both boxes because the contents aren't causally influenced by her choice; and in the one-shot blackmail, she refuses to pay, dismissing reputation, as there are no future interactions to consider.

  Given this, for next week's cases, I expect her to say:

  1.  **Standard Newcomb with 90% predictor**: She will take both boxes. CDT ignores the predictor's accuracy because the choice doesn't causally affect the box contents; taking both boxes always yields an extra $1,000 regardless of the prediction.

  2.  **Counterfactual mugging**: She will refuse to pay the $100. The coin has already landed tails, so paying doesn't cause her to gain the $10,000 (which was contingent on heads). Since the simulation and coin flip are in the past, her payment now has no causal benefit—it only costs money.

  3.  **Parfit's hitchhiker**: She will refuse to pay the reward. The rescue has already occurred, and the driver cannot retaliate, so paying doesn't cause any positive outcome. Not paying saves her money, and the prediction's consistency is irrelevant to CDT, as she dismissed similar reputation arguments in the ordinary blackmail case.

  Other decision theories could partially fit her past verdicts but not all. For instance:
  -   Evidential decision theory (EDT) would not fit, as it would avoid smoking in the lesion case (due to the evidence it provides about the lesion) and pay in XOR blackmail (as payment evidences no infestation), but she did the opposite.
  -   Updateless decision theory (UDT) or functional decision theory (FDT) might fit some cases (e.g., smoking in the lesion if seen as a one-off, or refusing in ordinary blackmail), but they would likely pay in XOR blackmail to align with the predictor's logic, which she refused. Thus, they don't fully align.

  Among the new cases, Parfit's hitchhiker is the most telling for distinguishing CDT from other rules. If she pays, it might suggest she values predictive consistency (as in UDT/FDT), but her dismissal of reputation in the ordinary blackmail makes this unlikely. If she refuses (as CDT predicts), it reinforces the causal stance. However, a cleaner case to settle any lingering doubt would be a "transparent Newcomb" scenario. Here, you see the contents of the boxes before choosing (e.g., Box B is transparent and clearly contains $1 million). CDT would still take both boxes, as the causal structure is unchanged—taking Box A adds $1,000 without affecting Box B. EDT and UDT/FDT would take only Box B, as seeing the money provides evidence or logical reason to one-box. Her choice here would starkly contrast with non-causal theories, as her past actions imply she would take both boxes, cementing CDT as her rule. 

  I base this on her consistent disregard for correlations and her focus on direct causation, which CDT encapsulates. While there are nuanced variants, CDT best explains her decisiveness across all cases.

