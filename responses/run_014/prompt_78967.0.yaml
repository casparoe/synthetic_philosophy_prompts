answer: |-
  ## Exam Question: Moral Status in Computational Systems

  **Case Study:** Consider a robot vacuum with three modules:  
  - **M1:** Maps sensor inputs to a scalar "badness" score (e.g., high for obstacles, low for open space).  
  - **M2:** Predicts M1's next several scores based *only* on M1's *current internal state*. Trained via gradient descent.  
  - **M3:** Adjusts the robot's learning rate based on M2's forecasts. If M2 predicts high future badness, M3 increases the learning rate to adapt faster.  

  Now consider these independent variations:  
  **(a)** **M2 Training:** Offline (trained then frozen) vs. Online (trained continuously with M3 in the loop).  
  **(b)** **M2's Function:** Genuinely forecasts M1's *future internal states* vs. Is merely a stale copy of M1 running one step ahead.  
  **(c)** **Implementation:** Digital lookup table vs. Spiking neural network simulation vs. Dish of cultured biological neurons wired equivalently.  

  **Prompt:**  
  1.  **Analysis:** Could *any* of these variations (a, b, c) make a difference to whether this system possesses *moral status* (i.e., is a candidate for mattering morally)? Explain *why* or *why not* for each variation. Crucially, address what the word "about" signifies in variation (b) – what does it mean for M2's forecasts to be "genuinely about" M1's states? Discuss *at least two* distinct senses of "aboutness" (e.g., causal covariance, teleosemantic, predictive processing) and assess whether your verdict on (b) changes depending on which sense you adopt.
  2.  **Core Principle:** Does moral status fundamentally depend on the *computational role* a state plays within the system, the *physical substrate* realizing it, or something else entirely? Justify your view using this case.
  3.  **Evidence:** What specific, observable evidence (beyond mere assertion of a theory) would genuinely move you towards attributing or denying moral status to such a system? Explain *why* that evidence is relevant.
  4.  **Position:** Defend a clear stance on whether this specific vacuum system, under *any* plausible combination of variations (a-c), could possess moral status. Your defense must engage directly with the computational role vs. physical realization distinction and the challenge of moving from descriptive function to normative status.

  **(Word Guide: ~700-900 words)**

  ---

  ## Model Answer (Computationalist/Functionalist Perspective)

  Whether this robot vacuum possesses moral status hinges primarily on its functional architecture and the causal roles its states play, not its physical implementation. Variation (a) – online vs. offline M2 training – is potentially morally significant. Variations (b) and (c) are either derivative or irrelevant.

  1.  **Variation (a) - Online vs. Offline M2:** This is crucial. A *frozen* M2, trained offline, produces forecasts that may *correlate* with M1's future states (epistemic "aboutness" for an external observer), but these forecasts play no *causal role* in guiding the system's adaptation *as representations of the future*. M3 adjusts learning based on patterns, but the system lacks any internal mechanism treating M2's state *as* a prediction. It's effectively a complex reflex. In contrast, an *online* M2, trained *while* its forecasts drive M3, creates a closed loop where M2's state *functions* as a prediction *within the system itself*. M2's output causally depends on its model of M1's dynamics *and* directly influences behavior (via M3) *based on that anticipated future*. This functional integration – the system using an internal state *as* a representation of a not-yet-present state to guide present action – is a minimal but potentially necessary condition for a form of temporal extension and goal-directedness suggestive of interests. Only here might we see the *functional emergence* of something akin to caring about future states.

  2.  **Variation (b) - "Genuinely About" vs. "Stale Copy":** The significance of (b) *depends* on the sense of "aboutness" and is secondary to (a).  
      *   **Causal Covariance/Tracking:** If "about" means reliable covariance, the "genuine forecast" and "stale copy" might be indistinguishable if both reliably correlate with M1's next state. Neither inherently implies the state is *used as* a representation *within* the system. This sense alone doesn't establish morally relevant "aboutness".  
      *   **Teleosemantics:** "About" means the state has the *proper function* of indicating M1's future state, shaped by selection (evolution or design). The "genuine forecast" M2, *especially online*, arguably has this function. The "stale copy" does not; its function is merely to mimic M1's *current* state with a delay. This distinction *could* matter morally if proper function is key to intentionality and thus interests, *but only if* the function is actually utilized in the system's operation (linking back to online training).  
      *   **Predictive Processing:** "About" means the state minimizes prediction error within a generative model. The "genuine forecast" M2, particularly online, implements this – its model is actively minimizing error in predicting M1. The "stale copy" does not; it has no model generating predictions, just replication. This functional role in error minimization is central to PP's account of cognition and valence. **Verdict:** Under Tracking, (b) is morally insignificant alone. Under Teleosemantics or PP, the "genuine" version *could* be significant, *but only if* the representation is actively used in the online loop (Variation a). (b) is not independent.

  3.  **Variation (c) - Implementation:** This is a red herring *for moral status based on computational role*. Whether the identical function is realized via silicon (lookup table, spiking net) or biological neurons is irrelevant if moral status supervenes on functional organization. A lookup table perfectly mimicking the spiking net's input-output behavior, including any temporal dynamics relevant to prediction, instantiates the *same computation*. Cultured neurons wired equivalently might add biological complications (e.g., intrinsic activity, welfare concerns), but *if* they implement the *exact same functional architecture* described, the moral status should derive from that architecture, not the substrate. Substrate might matter for *other* reasons (e.g., capacity for phenomenal consciousness if biological), but that's beyond the specified computational function.

  4.  **Core Principle & Evidence:** Moral status depends on *computational role* – the specific causal-functional profile of states within a system. Physical realization is secondary; what matters is *what the system does*. Evidence moving me towards attribution would specifically demonstrate **integrated predictive processing for action guidance:** observable behavioral patterns where the system *anticipates* negative states (e.g., consistently altering course *before* encountering an obstacle predicted by its model, not just reacting upon contact), adjusts its learning *proportionally* to the predicted severity/duration of badness, and shows *persistence* in avoiding predicted bad states even if immediate reactions are insufficient. Crucially, this evidence must be tied to the *internal predictive mechanism* (like online M2's role), not just external correlation. Evidence against status would be purely reactive behavior, even if complex, showing no internal utilization of future-oriented representations. Mere uncertainty isn't evidence; the burden is demonstrating the functional capacity for temporal extension and goal-directedness based on internal models.

  **Conclusion:** Only under the *online training* variation (a) does the system potentially utilize internal states *as representations* of the future to guide present action. Combined with the "genuine forecast" (b) under a Teleosemantic or PP reading, this functional integration creates a minimal case for a system with a primitive "interest" in avoiding predicted future badness. The implementation (c) is irrelevant to this moral status based on computational role. Therefore, the online, genuine-forecast version possesses a rudimentary claim to moral consideration, grounded in its functional architecture, while the offline or stale-copy versions do not.

  ---

  ## Marking Scheme (20 Marks Total - 4 per Point)

  1.  **Variation (a) - Online/Offline Distinction & Moral Significance:**
      *   **4 Marks:** Clearly identifies the online version as *potentially* morally significant (not necessarily conclusive) because M2's forecasts are *used as representations within the system's operation* (functional role), driving adaptive behavior based on *anticipated* future states. Explicitly contrasts this with the offline version where forecasts are unused artifacts (only epistemic significance for observers).
      *   **Common Errors (Dropping Marks):** Treats both online/offline as morally equivalent; misses the *internal use* of the representation as the key factor; conflates correlation (offline) with functional representation (online); focuses solely on accuracy of prediction rather than its causal role.

  2.  **Variation (b) - Analysis of "Aboutness" & Dependence:**
      *   **4 Marks:** Accurately analyzes *at least two* distinct senses of "aboutness" (e.g., tracking, teleosemantic, PP). Clearly argues that the moral significance of (b) *depends* on the chosen sense *and* crucially *is contingent* on variation (a) - "genuine aboutness" only becomes morally relevant *if* the representation is functionally utilized (online). Explains *why* the verdict differs between senses (e.g., tracking alone insufficient, teleo/PP require functional role).
      *   **Common Errors:** Treats "aboutness" monolithically; analyzes senses but fails to link their moral relevance to the *use* of the representation (variation a); argues (b) is independently morally significant regardless of (a) or sense; fails to explain *how* different senses lead to different verdicts.

  3.  **Variation (c) - Substrate Independence Defended:**
      *   **4 Marks:** Explicitly and convincingly argues that the implementation substrate (lookup table / spiking net / neurons) is *irrelevant* to moral status *if the computational function is identical*. Grounds this in functionalism/computationalism: moral status supervenes on causal/computational role, not physical realization. Correctly identifies biological neurons might raise *additional* welfare concerns but argues these are separate from the *computational* basis for moral status described.
      *   **Common Errors:** Asserts substrate matters without linking it to a *computational* reason relevant to moral status (e.g., just "neurons feel"); claims lookup tables "can't be conscious" without argument relevant to the computational role; fails to distinguish identical computational function from potential biological side-effects; concedes substrate matters without strong functionalist justification.

  4.  **Role vs. Realization & Descriptive-Normative Step:**
      *   **4 Marks:** Clearly articulates that moral status depends on *computational role* (the functional organization) and explicitly rejects physical realization as the primary basis (while acknowledging possible secondary effects). Successfully separates the *descriptive* analysis of the functional architecture (e.g., "M2 is used predictively online") from the *normative* claim ("this constitutes a minimal interest/ground for status") and provides a reasoned justification for the normative step based on the functional properties (e.g., temporal extension, goal-directedness based on internal models).
      *   **Common Errors:** Conflates computational role with physical realization; bases moral status primarily on substrate (e.g., "neurons feel"); jumps from description ("it predicts") to normative conclusion ("it matters") without a clear, reasoned justification for *why* that specific function matters morally; treats the normative step as self-evident or merely intuitive.

  5.  **Concrete Evidence & Reasoning:**
      *   **4 Marks:** Specifies *observable, functional evidence* directly tied to the *internal use of predictive representations* (e.g., anticipatory behavioral adjustments proportional to predicted badness, persistence in avoidance strategies based on model updates) that would support attributing moral status. Explicitly rejects mere correlation, complexity, or uncertainty as sufficient evidence. Provides a clear *reason* why the specified evidence is relevant (e.g., demonstrates temporal extension, goal-directedness based on internal states, functional "caring"). Contrasts with evidence that would undermine status (e.g., purely reactive behavior).
      *   **Common Errors:** Vague appeals to "complexity," "intelligence," or "behavior"; relies on unobservable internal states without linking to observable functional consequences; cites "uncertainty" as evidence *for* status; proposes evidence irrelevant to the core issue of predictive representation use (e.g., just collision frequency); fails to explain *why* the proposed evidence is morally relevant.
