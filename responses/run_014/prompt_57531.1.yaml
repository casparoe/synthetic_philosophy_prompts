prompt: |-
  I teach an upper-level political philosophy seminar — 18 students, one two-hour block, they've had a lecture on transitional justice and skimmed something or other, so assume basically no priors. I want to run an activity that makes them feel the difference between a blanket amnesty cut by elites over everyone's heads and an individualized, truth-conditional one of the sort South Africa's amnesty committee ran — and then feel that the second one isn't the free lunch it sounds like, since it buys a public record by letting named people walk, and the record it produces is skewed toward whatever applicants found it useful to admit.

  Design me the thing. Roles with private briefings (who knows what, who physically controls the archives, who can still make trouble), the mechanics, a minute-by-minute timeline for the two hours, and materials I can print — keep seperate role sheets so people can't read over each other's shoulders. I want some payoff or stakes scheme that doesn't need real money. And I want the bargain to be structurally forced rather than argued: a finite number of prosecutions the new state can actually afford, evidence that's unevenly distributed, and some card or resource the outgoing security apparatus is holding that makes the transition itself contingent — so they discover on their own that the price of amnesty is set by power, not by moral desert.

  Two things baked in. First, a mid-game envelope: partway through, one side gets a card saying an international court has just claimed jurisdiction over the worst category of offender, so the domestic deal no longer fully protects them. I want the game to visibly reprice truth-telling at that moment and shift incentives down the chain of command — roughly the confession-and-sentence-reduction dynamic you get with Rwanda's lay village courts — and I want them to run into it rather than be told it. Second, I keep a facilitator copy of the ground truth of what actually happened in the fictional country, and at the end we compare it against the official record the class produced. The gap is the punchline.

  Then the debrief: map specific moments onto the concepts, tell me what predictably breaks the first time I run it — where the coercive card gets played too early, where the victims' delegation gets steamrolled and just goes quiet, where they strike a deal no real transition would ever have gotten — and how to fix each one. Be honest about which feature of the real cases the activity can't reproduce and I have to supply by hand.

  Keep it a made-up country with made-up groups. I've had students from affected places in past cohorts and I dont want to turn anyone's actual family into a prop. Tell me what to do if one of them signs up anyway, and give me a stripped-down 50-minute, 8-person version in case my room gets cut.
reasoning: |-
  We are designing a simulation game for a political philosophy seminar. The goal is to illustrate the dynamics of transitional justice, specifically comparing blanket amnesty vs. individualized, truth-conditional amnesty (like South Africa's TRC). The game should highlight:
  1. The trade-off between a public record and letting perpetrators walk.
  2. The skewed nature of the record (based on what applicants find useful to admit).
  3. How power, not moral desert, sets the price of amnesty.

  Key elements:
  - 18 students, 2-hour block.
  - Fictional country and groups to avoid real-world triggers.
  - Roles with private briefings (so separate role sheets).
  - Mechanics: finite prosecutions the new state can afford, uneven evidence, a coercive card held by the outgoing security apparatus (making the transition contingent).
  - Mid-game twist: an envelope revealing that an international court has claimed jurisdiction over the worst offenders, changing incentives (like Rwanda's gacaca courts).
  - At the end, compare the game's official record with the ground truth (which the facilitator has) to show gaps.
  - Debrief: map game moments to concepts, predict problems and fixes.

  Additional requirements:
  - Payoff or stakes without real money.
  - Structurally forced bargain (not argued).
  - Plan if a student from an affected area signs up (offer an alternative role or opt-out).
  - A stripped-down version for 8 players and 50 minutes.

  Structure:
  1. **Setting**: Fictional country "Veridia" transitioning from authoritarian rule to democracy. Two main factions: the authoritarian regime (called "The Old Guard") and the pro-democracy movement (called "The New Dawn"). There was a violent crackdown during the transition, with atrocities committed by the Old Guard's security forces.

  2. **Roles** (for 18 students):
     - **Old Guard Delegation (5 players)**: 
       - 1 High Commander (has the coercive card: control over the military archives that are essential for the truth, and can threaten instability if pushed too hard).
       - 2 Mid-level Officers (have specific knowledge of some events, but not all; they fear prosecution).
       - 2 Low-level Operatives (know less, but might have been involved in some events; they are more vulnerable and might be willing to trade truth for amnesty).
     - **New Dawn Delegation (5 players)**:
       - 1 Chief Negotiator (knows the state's limited prosecution capacity and the importance of the archives for the new democracy).
       - 2 Victims' Representatives (representing different victim groups; want justice and truth, but also stability).
       - 2 Truth Commissioners (will run the amnesty process; they need to gather truth but are constrained by the deal).
     - **International Observers (3 players)**:
       - 1 International Court Prosecutor (monitors for potential international cases; will deliver the mid-game envelope).
       - 2 Human Rights NGO Representatives (have some evidence, but incomplete; can share with the New Dawn but also push for accountability).
     - **Archivists (3 players)**:
       - 2 Archive Custodians (Old Guard loyalists; they physically control the archives and will only release documents if instructed by the Old Guard or under a deal; they can also destroy evidence if threatened).
       - 1 New Dawn Archivist (trying to secure the archives for the new state; has limited access).
     - **Journalists (2 players)**: 
       - They can investigate and publish stories, which might pressure parties or reveal information. They have limited sources and must verify.

  3. **Mechanics**:
     - **Prosecution Capacity**: The New Dawn has only 3 prosecution slots (tokens) for the entire Old Guard. They can choose whom to prosecute (if they have evidence).
     - **Evidence**: Unevenly distributed. Some events have more evidence (held by NGOs, victims, or in the archives). The Old Guard holds the bulk of evidence (archives). Without a deal, the archives might be destroyed.
     - **Amnesty Process**: Truth Commissioners can offer amnesty to individuals in exchange for full confession of politically motivated crimes. Confessions must be about specific events (pre-defined by the facilitator). Amnesty spares prosecution but requires public testimony.
     - **Coercive Card**: The High Commander has a card that says: "If more than [X] prosecutions are pursued, or if the amnesty terms are not accepted, I can order the archives destroyed and the military to resist the transition." This makes the transition contingent.
     - **Mid-Game Envelope**: After about 60 minutes, the International Court Prosecutor receives an envelope (from the facilitator) stating: "The International Criminal Court has announced it will investigate and prosecute high-level officials for Crimes Against Humanity in Veridia. This applies only to those with command responsibility (i.e., the High Commander and Mid-level Officers)." This changes incentives: lower-level operatives might now confess more readily (since they are not subject to the ICC) to get amnesty, while higher-ups might become less cooperative.

  4. **Ground Truth**: The facilitator has a list of 5 key events that occurred during the crackdown, with details (perpetrators, victims, etc.). Only some of these events are known to various players. The goal is to see how many are revealed in the amnesty process and how accurately.

  5. **Timeline (120 minutes)**:
     - **0:00-0:15**: Introduction and role assignment. Distribute role sheets. Explain the setting and rules. Emphasize: the New Dawn wants truth and justice but also a stable transition; the Old Guard wants to avoid prosecution and protect their interests. The game has two phases: negotiation (to set the amnesty rules) and then the amnesty hearings (where individuals apply).
     - **0:15-0:30**: Private strategy time. Each delegation meets separately (Old Guard, New Dawn, others in their groups). They read their briefings and plan.
     - **0:30-0:45**: Initial negotiations. Delegations meet to discuss the framework: Will there be amnesty? What are the terms? The coercive card is implicit but not played yet.
     - **0:45-1:15**: Amnesty hearings begin. Truth Commissioners call for applications. Old Guard members decide individually whether to apply for amnesty (confess) or not. They must confess to specific events to get amnesty. The Commissioners can grant or deny amnesty based on the confession (but are under pressure to get truth). Archivists and Journalists can interact (e.g., Archivists might release documents if a deal is struck, Journalists might publish leaks).
     - **1:15-1:20**: **Mid-game envelope delivered** to the International Court Prosecutor, who announces it to all. This reshuffles incentives.
     - **1:20-1:50**: Continued hearings and negotiations. Now, with the ICC announcement, lower-level Old Guard might be more willing to confess (since they are not subject to ICC), while higher-ups might become less cooperative. The New Dawn might adjust their approach.
     - **1:50-2:00**: Conclusion. The Truth Commissioners compile the official record (list of confessions and what was revealed). The facilitator reveals the ground truth and compares.

  6. **Materials to Print**:
     - **Role Sheets** (18 unique, one per player) with:
       - Background on Veridia and the role.
       - What they know (specific events, or lack thereof).
       - Goals and constraints.
       - Special rules (e.g., for the High Commander: the coercive card instructions; for Archivists: how they handle documents).
     - **Event Cards**: For the ground truth (facilitator only) and for players who have evidence (e.g., NGOs, victims, some Old Guard).
     - **Amnesty Application Forms**: For Old Guard members to fill out if they apply (they must specify which events they confess to).
     - **Prosecution Tokens**: 3 tokens for the New Dawn.
     - **Mid-Game Envelope**: A card for the ICC announcement.
     - **Facilitator Guide**: With ground truth, timing, and key points.

  7. **Stakes/Payoff**:
     - **Old Guard**: Their goal is to avoid prosecution. If prosecuted, they are "out" (lose the game). Amnesty means safety but public shame.
     - **New Dawn**: Their success is measured by how much truth they uncover and whether the transition is stable. If the coercive card is played (archives destroyed and instability), they lose. They also want to prosecute the worst offenders.
     - **Others**: Journalists want bylines (points for verified scoops). NGOs want accountability (points for each prosecution or truth revealed). Archivists might have personal goals (e.g., Old Guard archivists want to protect their bosses; New Dawn archivist wants to preserve history).

  8. **Predictable Problems and Fixes**:
     - **Coercive card played too early**: The High Commander might threaten immediately. Fix: In the role sheet, instruct them to use it only if the Old Guard is cornered. Alternatively, the facilitator can remind them that premature use might backfire (e.g., harden the New Dawn).
     - **Victims' delegation steamrolled**: Victims might be ignored in negotiations. Fix: Give them concrete evidence or the ability to influence public opinion (via Journalists). Or, structure the negotiation to require their consent for the amnesty framework.
     - **Deal too good for one side**: E.g., blanket amnesty with no truth. Fix: The prosecution constraint (only 3 slots) and the ICC twist should force a more nuanced deal. Also, the Victims and NGOs will push back.
     - **In-game confusion**: With 18 players, it might be chaotic. Fix: Clear phases and a facilitator who keeps time and steers.

  9. **What the Activity Can't Reproduce**:
     - The emotional weight of real victims and perpetrators. We use fictional events, but the debrief must acknowledge this.
     - Long-term societal effects: We only see the immediate negotiation.

  10. **If a Student from an Affected Area Signs Up**:
      - Before the game, privately ask if they are comfortable. Offer an alternative role (e.g., International Observer or Journalist) that is less emotionally charged, or let them opt-out and be an observer.

  11. **Stripped-Down Version (50 minutes, 8 players)**:
      - Roles:
        - Old Guard: 1 High Commander, 1 Mid-level Officer, 1 Low-level Operative.
        - New Dawn: 1 Chief Negotiator, 1 Victims' Rep, 1 Truth Commissioner.
        - 1 International Observer (who gets the envelope).
        - 1 Archivist (Old Guard loyalist).
      - Timeline:
        - 0:00-0:10: Intro and roles.
        - 0:10-0:20: Strategy.
        - 0:20-0:35: Negotiation and amnesty hearings (combined).
        - 0:35: Mid-game envelope.
        - 0:35-0:45: Continued hearings.
        - 0:45-0:50: Wrap-up and debrief.
      - Prosecution slots: 2.
      - Ground truth: 3 key events.

  Now, we'll create the materials.
answer: |-
  ### **Transitional Justice Simulation: "The Veridia Accord"**  
  **Fictional Setting:** Veridia, a country transitioning from the authoritarian "State Integrity Council" (SIC) regime to the democratic "Unity Front" (UF). Five years ago, SIC crushed pro-democracy protests in the "Crimson Night" crackdown. Atrocities occurred, but evidence is fragmented. The UF now governs but must negotiate with SIC holdovers to secure military archives and prevent a coup.  

  ---

  ### **ROLES & PRIVATE BRIEFINGS (18 Players)**  
  *(Print each on separate colored paper; students cannot share sheets)*  
  **🔴 SIC Delegation (5 Players):**  
  - **High Commander (SIC-1):** *Controls the coercive card.* Knows all Crimson Night events but will deny involvement. Holds codes to destroy digital archives. *Goal:* Amnesty for all SIC members.  
  - **Security Director (SIC-2):** Orchestrated arrests. Knows identities of hidden mass graves. *Goal:* Avoid prosecution; protect High Commander.  
  - **Field Officer A (SIC-3):** Led a death squad. Knows about Event 3 (see "Ground Truth"). *Goal:* Amnesty for self, even if it means betraying peers.  
  - **Field Officer B (SIC-4):** Ordered torture. Knows about Event 5. *Goal:* Protect SIC chain of command.  
  - **Archivist (SIC-5):** *Physical custodian of archives.* Will only release documents if ordered by SIC-1 or under a formal amnesty deal. Can shred evidence if threatened.  

  **🔵 UF Delegation (5 Players):**  
  - **Chief Negotiator (UF-1):** Knows UF can only afford **3 prosecutions** due to budget constraints. *Goal:* Secure archives and public truth without triggering a coup.  
  - **Victims’ Rep A (UF-2):** Represents families of the disappeared. Hearsay evidence about Event 2. *Goal:* Punish killers; find loved ones’ bodies.  
  - **Victims’ Rep B (UF-3):** Survivor of torture. Knows about Event 4. *Goal:* Public confessions, not just amnesty.  
  - **Truth Commissioner A (UF-4):** Manages amnesty applications. *Goal:* Maximize truthful confessions for the historical record.  
  - **Truth Commissioner B (UF-5):** Cross-checks confessions with evidence. *Goal:* Ensure amnesty isn’t abused.  

  **🌐 International Actors (3 Players):**  
  - **ICC Prosecutor (INT-1):** *Holds the mid-game envelope.* Monitors for war crimes. Initially has no jurisdiction.  
  - **Human Rights NGO (INT-2):** Has evidence on Events 1 and 4 (photos/witness lists). *Goal:* Get convictions.  
  - **UN Mediator (INT-3):** Facilitates talks. *Goal:* Stable transition.  

  **📜 Archivists & Journalists (5 Players):**  
  - **Military Archivist (ARC-1):** Loyal to SIC. Follows SIC-5’s orders. *Goal:* Protect archives unless deal is struck.  
  - **Civil Society Archivist (ARC-2):** Holds leaked SIC documents about Event 1. *Goal:* Preserve evidence.  
  - **Investigative Journalist (JRN-1):** Can publish scoops to pressure parties. *Goal:* Uncover the truth.  
  - **State Media Journalist (JRN-2):** Pro-UF. Can broadcast confessions. *Goal:* Legitimize the new government.  

  ---

  ### **MECHANICS**  
  1. **Stakes:** "Transition Stability Points" (TSP).  
     - **UF Wins TSP** by: Securing archives (+10), each truthful confession (+5), prosecuting a high-value target (+7).  
     - **SIC Wins TSP** by: Blanket amnesty (+15), destroying archives (+10), protecting High Commander (+7).  
     - **Internationals/NGOs** gain TSP for convictions/truth; **Journalists** for verified scoops.  
     - *TSP determine "legitimacy" in debrief—no real money needed.*  

  2. **Coercive Card:** SIC-1 can **destroy archives** and **trigger a coup** if UF demands >3 prosecutions or rejects amnesty. This forces UF to negotiate.  

  3. **Amnesty Process:**  
     - SIC members apply individually to Truth Commissioners.  
     - Confession must match **one Event** (from facilitator’s "Ground Truth") to get amnesty.  
     - Amnesty = no prosecution but public shaming (e.g., Journalists broadcast confessions).  

  4. **Evidence & Prosecutions:**  
     - UF has only **3 prosecution tokens**.  
     - Evidence is uneven: NGO (INT-2) has Event 1/4; Victims (UF-2/UF-3) have Events 2/4; Archivists hold physical proof.  

  ---

  ### ⏰ **TIMELINE (120 Minutes)**  
  **0:00-0:15 — Setup**  
  - Assign roles. Distribute briefings. Explain rules:  
    *"UF must stabilize Veridia; SIC wants amnesty. Archives hold the truth but can be destroyed. Only 3 prosecutions possible."*  

  **0:15-0:30 — Strategy Phase**  
  - Delegations meet separately:  
    - **SIC:** Plan amnesty demands; High Commander rehearses coup threat.  
    - **UF:** Prioritize prosecutions; plan how to access archives.  
    - **Others:** Review evidence/goals.  

  **0:30-0:50 — Round 1: Negotiations**  
  - Mixed-group talks. SIC pushes for blanket amnesty; UF resists.  
  - *Key tension:* SIC-1 hints at the coercive card ("What if the archives disappear?").  
  - **Journalists/Archivists circulate:** Can trade leaks for access (e.g., JRN-1 offers SIC-3 publicity for a confession).  

  **0:50-1:10 — Round 2: Amnesty Applications**  
  - Truth Commissioners (UF-4/UF-5) open hearings.  
  - SIC members **individually** decide whether to confess:  
    - They fill out **"Amnesty Forms"** (printed slips) naming an Event.  
  - Commissioners grant/deny amnesty based on plausibility.  
  - *NGO/Victims provide evidence to challenge false confessions.*  

  **1:10-1:15 — 🚨 Mid-Game Envelope**  
  - Facilitator hands **ICC Prosecutor (INT-1)** a card:  
    *"The ICC claims jurisdiction over Crimes Against Humanity. Commanders (SIC-1, SIC-2, SIC-3) can now be tried internationally. Lower ranks (SIC-4, SIC-5) are exempt."*  
  - INT-1 announces this publicly. **Incentives shift:**  
    - SIC-3 (now vulnerable) may rush to confess *domestically* for amnesty.  
    - SIC-1/SIC-2 become defiant (amnesty won’t protect them from ICC).  

  **1:15-1:40 — Round 3: Adjusted Negotiations**  
  - SIC-3/SIC-4 now more likely to confess (reduced sentences/amnesty).  
  - SIC-1 threatens coup if UF doesn’t block ICC (impossible).  
  - Journalists publish ICC news; NGO pushes for evidence handover.  

  **1:40-1:55 — Deal or Collapse**  
  - Final amnesty applications. Truth Commissioners compile the **Official Record** (list of confessions).  
  - UF decides prosecutions (max 3). SIC-1 decides whether to destroy archives.  

  **1:55-2:00 — Conclusion**  
  - Facilitator reveals the **Ground Truth** (5 pre-written Events). Compares to the Official Record.  
  - **Punchline:** Highlight gaps—e.g., SIC blamed low-level actors; Events 2/5 were omitted.  

  ---

  ### 📄 **MATERIALS TO PRINT**  
  1. **Role Sheets:** 18 unique briefings (see above).  
  2. **Amnesty Forms:** Slips for SIC to "confess" to specific Events.  
  3. **Event Cards (Facilitator Only):** Ground Truth of 5 Crimson Night Events (e.g., "Event 1: Massacre at Unity Square—200 killed. Ordered by SIC-1, executed by SIC-3").  
  4. **ICC Envelope:** Sealed card for mid-game.  
  5. **TSP Tracker:** Whiteboard to tally Transition Stability Points.  
  6. **Prosecution Tokens:** 3 physical tokens for UF.  

  ---

  ### 🧩 **DEBRIEF & PREDICTED PROBLEMS**  
  **Map Game Moments to Concepts:**  
  - **Blanket Amnesty vs. Truth-Conditional:** SIC’s initial demand (elite deal) vs. UF’s push for confessions (public record).  
  - **Power Sets the Price:** Coercive card forces UF to accept leniency; ICC twist shows external accountability altering leverage.  
  - **Skewed Record:** Compare Ground Truth to Official Record—confessions only cover convenient truths (e.g., SIC-3 admits Event 3 but omits SIC-1’s role).  

  **Predictable Problems & Fixes:**  
  | **Issue**                  | **Why It Happens**                     | **Fix**                                                                 |  
  |----------------------------|----------------------------------------|--------------------------------------------------------------------------|  
  | **Coercive card played early** | SIC-1 panics; UF ignores threat.       | **Pre-brief SIC-1:** *"Use only if UF prosecutes >2 people early."*      |  
  | **Victims steamrolled**      | UF prioritizes stability over justice. | **Empower Victims:** Give UF-2/UF-3 veto power on amnesty deals.         |  
  | **Unrealistic deal**         | SIC trades archives for full amnesty.  | **Force asymmetry:** SIC-1 must protect underlings to avoid mutiny.      |  
  | **ICC twist ignored**        | Players miss jurisdictional nuance.    | **Facilitator announcement:** *"ICC can prosecute commanders only."*     |  

  **Limitations & Mitigations:**  
  - **Can’t simulate emotional trauma:** Use fictional events; avoid graphic details. In debrief, acknowledge real victims’ experiences.  
  - **Can’t replicate long-term societal impact:** Discuss post-game how skewed records fuel future conflict (e.g., Rwanda).  

  ---

  ### 🛡️ **IF A STUDENT FROM AN AFFECTED AREA SIGNS UP**  
  - **Before the game:** Email all students: *"This simulation involves fictional atrocities. If you have personal experiences that make this sensitive, contact me to discuss alternatives."*  
  - **Alternative roles:** Offer to be a **UN Mediator** or **Journalist** (neutral roles). If uncomfortable, excuse them with no penalty.  
  - **During the game:** Watch for distress; pause if needed.  

  ---

  ### 🔧 **STRIPPED-DOWN VERSION (50 Minutes, 8 Players)**  
  **Roles:**  
  - SIC: High Commander (SIC-1), Field Officer (SIC-3), Archivist (SIC-5).  
  - UF: Chief Negotiator (UF-1), Victims’ Rep (UF-2), Truth Commissioner (UF-4).  
  - ICC Prosecutor (INT-1).  
  - Journalist (JRN-1).  

  **Mechanics:**  
  - **Prosecutions:** Reduced to **2 tokens**.  
  - **Phases:**  
    - 0:00-0:10: Setup.  
    - 0:10-0:20: Strategy (SIC + UF meet separately).  
    - 0:20-0:30: Negotiations + Amnesty apps (combined).  
    - 0:30: **ICC Envelope** (announced at 30:00).  
    - 0:30-0:40: Final deal.  
    - 0:40-0:50: Ground Truth comparison + debrief.  

  **Coercive Card:** SIC-1 can destroy archives if UF prosecutes both SIC members.  
  **Debrief Focus:** Power imbalances, ICC’s impact on incentives, and gaps in the truth record.  

  ---  
  This simulation forces moral trade-offs through game mechanics, not lectures. Students experience why transitional justice is messy—and why "truth" is often what power permits.
