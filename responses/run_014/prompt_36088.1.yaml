  Aristotle’s "inactive knowledge" analogy—like a drunk or sleeper—maps neatly to backstory that isn’t presently motivating. Craft can show this via emotional distance or buried trauma. But philosophy’s focus on epistemic states (how knowledge is "activated") doesn’t directly concern novelists. For them, it’s about *dramatizing* why knowledge feels inert, not debating cognition.  

  Davidson’s split judgments—"all-things-considered vs. unconditional"—translate well to layered motives. A character can "know better" abstractly while succumbing to a scene-level craving. Interiority techniques (free indirect discourse, visceral prose) handle this beautifully. The bend? Davidson’s logical precision about judgment types is foreign to craft; novelists care about *felt* conflict, not taxonomies.  

  Hyperbolic discounting (preferences flipping as rewards near) is gold for pacing. A character’s resolve crumbling as temptation approaches? That’s pure scene dynamics. But the economic model’s math-driven "preference reversal" challenges the novelist’s idea of "out of character" actions. If preferences genuinely flip, it’s not a lapse—it’s the character *becoming* someone new in that moment. That reframes readerly judgment as temporal bias.  

  Residue report: The big philosophical gap is the *why* of akrasia’s irrationality. Philosophers dissect whether it’s ignorance, failed reasoning, or shifting utilities—novelists just need it to feel human. Also, philosophy’s demand for universal explanations (e.g., "Is true akrasia possible?") doesn’t concern craft; specificity trumps theory. That doesn’t mean novelists miss something—they simply prioritize different truths.  

