answer: |-
  ### Diagnosis of Your Gloss  
  (a) *No distortion.* "The state is the actuality of concrete freedom" is standard. "Actuality" (*Wirklichkeit*) is Hegel’s technical term for *realized rationality*, not mere existence.  
  (b) *Minimal distortion.* Your flattening exposes joints accurately. Key nuance: "pass over into the universal" better captures *Aufhebung* (sublation) than "merge." Recognition of rights in family/civil society is developmental but not voluntarist.  
  (c) *Compression risk.* "Freedom's end is the universal as such" over-simplifies. Hegel argues freedom *achieves itself* in the universal, not that the universal is its external aim. "Substantive being has its truth in the state" is correct but requires the whole system to avoid reification.  

  ### Responses to Queries  
  **1. Structure of (b)**  
  (b) is **simultaneously a definition, a description of a dialectical process, and a criterion of legitimacy**—but *not separable*.  
  - **Definition**: Concrete freedom *is* this dual movement (particular → universal; universal ← particular).  
  - **Process**: The "development" and "passing over" describe institutional mediation (e.g., corporations, estates).  
  - **Legitimacy**: A regime failing this process is not a *rational* state (i.e., not "actual" in Hegel’s sense).  
  **Why this matters for obligation**: Obligation arises *immanently* from being a participant in this structure. It’s neither a free-standing "reason" nor a voluntarist contract.  

  **2. Four Candidate Readings (Hypothesis Test)**  
  - **Dissolution Reading (Your Hypothesis)**: The state *is* concrete freedom actualized. "Why obey?" is nonsensical—like asking why a cell obeys its DNA. Obligation dissolves into ontology.  
  - **Reasons Reading**: The paragraph supplies a normative premise: "You should obey because the state realizes your freedom better than you can alone."  
  - **Diagnostic Reading**: Hegel describes how modern subjects *experience* obligation structurally, not why they *should*. It’s phenomenology, not justification.  
  - **Systematic Necessity Reading**: The state is freedom’s logical culmination. Resistance is incoherent (like resisting logic itself) unless the state is irrational.  
  **What the Gloss Supports**: **Dissolution + Systematic Necessity**. Key evidence:  
    - Identity claims ("state is actuality of concrete freedom"; "individual’s substantive being has its truth in the state") frame ontology, not justification.  
    - "Knowingly will themselves" suggests structural interpellation, not deliberation.  
    - "Pass over by necessity" (discussed below) undermines voluntarist reasons.  

  **3. The Necessity Clause**  
  "Partly by necessity" refers to **dialectical and institutional constraints**, not brute causation.  
  - **Normative Force**: Necessity here is *rational* (the particular’s dependence on the universal for its realization).  
  - **Threat to Obligation Theory?** Yes, if "necessity" implies structural determinism. But Hegel’s point is that institutions (e.g., laws, estates) *mediate* particular and universal, making "necessity" the logic of freedom itself. **Result**: No voluntarist "ground" for obligation survives, but normative force emerges immanently from the structure. A purely causal reading is excluded by "knowingly will themselves."  

  **4. Quantifier Worry: Distributive vs. Collective Universal**  
  - **Apparent Equivocation**: The gloss *does* slide: "their right" (distributive) vs. "interest of the universal" (collective).  
  - **Benign in Hegel’s Apparatus**: The collective universal *just is* the concrete realization of each individual’s rational interest. Mediation (family, civil society) resolves the tension. **Verdict**: **Not equivocation** but **technical apparatus at work**. Your gloss captures this with "the universal does not stand over against them as alien."  

  **5. Disobedience and the Failure Criterion**  
  The "internal failure criterion" is **available but restricted**:  
  - **Condition**: A regime that *systematically crushes* particular interests (e.g., tyranny) fails as a state because it negates concrete freedom. No obligation attaches.  
  - **Blockage by "Actuality"**:  
    - **Empirical existence ≠ Actuality**: A corrupt regime may exist empirically but lacks *Wirklichkeit* (rational actuality). Resistance against it doesn’t target the "state" proper.  
    - **Normative Achievement Required**: The state *must* exhibit the dialectic in (b) to be "actual."  
  - **Resistance Inference?**: **Blocked structurally** because:  
    - Resistance against an *actual* (rational) state is irrational (self-subversion).  
    - Resistance against a *non-actual* regime is not "against the state" but for its actualization.  
  **Both senses of actuality (empirical/normative) are held without collapse** via the rational/real distinction.  

  ### Summary Verdicts  
  - **Obligation Ground**: Dissolved into ontology; no free-standing "reasons."  
  - **Resistance Possible?**: Only against irrational regimes, which aren’t "states" in Hegel’s sense.  
  - **Gloss Reliability**: (a) and (b) robust; (c) adequate if "freedom’s end" is read as *self-realization in universality*.  
  - **Where I Use System Knowledge**:  
    - "Actuality" as rational realization (high confidence; central to Hegel).  
    - Dialectical necessity (medium confidence; your gloss hints at it).  
    - Mediation resolving distributive/collective tension (high confidence; core to §182-256).  

  ---  
  **Output**: Strictly from your gloss + unavoidable system commitments. No external references. Every point retires or advances your queries.
