  Here's a joke structured as a short dialogue:

  A desperate policy maker, trying to justify a controversial program, consults a dedicated Scanlonian contractualist. "Look," the policy maker argues, "this initiative prevents fifty million people from each suffering a mild headache. Isn't that a decisive reason to implement it, even if *one* unavoidable death occurs?"
  The contractualist sighs patiently. "No. You must consider whether any *single individual* could reasonably reject the principle allowing the policy. While the person facing death has a very strong complaint, no *single* headache sufferer has a complaint strong enough to outweigh that death. Their burdens, however numerous, don't combine into one giant complaint."
  "So," the policy maker clarifies slowly, "according to your view... preventing fifty million mild headaches *still* doesn't give us a strong enough collective reason to prevent one death?"
  "Correct," replies the contractualist, relieved the point landed. "No single headache complaint suffices."
  The policy maker stares. "Right. Got it. Well, that certainly... simplifies the paperwork." He pauses. "...And also, I suppose, saves the day for my incredibly lethal headache-prevention program."

  **Why it works for the target:**
  1.  **Accurate Core:** It directly targets the individualist restriction ("no *single* headache sufferer has a complaint strong enough... Their burdens... don't combine") and the resulting permissiveness of the headache case ("preventing fifty million mild headaches... doesn't give us a strong enough collective reason to prevent one death").
  2.  **Punchline Structure:** The punchline ("simplifies the paperwork... saves the day for my incredibly lethal headache-prevention program") highlights the absurd consequence *permitted* by the view – a program killing people to prevent trivial burdens is potentially permissible because no individual complaint against *allowing* it is strong enough. The dark humor comes from the policy maker realizing the view accidentally *endorses* his horrific program.
  3.  **Accessibility:** The core conflict (massive number of trivial burdens vs. one severe harm) is clear without needing "individualist restriction" terminology. The dialogue format makes the logical consequence stark.

  A knowledgeable listener laughs at the precise structural flaw enabling the lethal program's justification. A less familiar listener understands the outcome is absurdly counterintuitive.
