prompt: |-
  I teach an undergraduate course that ends with a fortnight on the old question of whether culture can be a cause, and every year the seminar dissolves into exactly the same impasse, which has me wondering whether the impasse is the real subject. The case everyone keeps returning to is Weber's thesis that certain Protestant doctrines -- predestination, the calling, the anxiety about one's election -- produced an inner-worldly asceticism that channelled effort into labour and accumulation and helped make capitalism psychologically possible. The students split in a way I can predict by week three. One side insists this is a causal claim like any other: there is a measurable correlate, there is a plausible mechanism running through self-understanding, and if the numbers hold up after you control for literacy, urbanisation and access to trade routes, culture earned its place in the regression. The other side insists the whole enterprise is confused: values are not the kind of thing that can nudge an economy the way a harvest failure can, or if they can, they were themselves caused by material conditions and so are at best a way station in the explanation rather than its engine; and in any case the correlate is a mess, since plenty of Catholic and Confucian and Jewish commercial communities behaved in the relevant ways without the doctrine, and Protestant regions were often ahead on literacy for reasons having nothing to do with soteriology. What strikes me is that the two sides never actually disagree about any historical fact. They disagree about what kind of thing an explanation is allowed to cite.

  My own hypothesis, which I offer as a hypothesis and not a conclusion, is that the stalled debate is not empirical at all but turns on an unexamined choice: either you think explanations must cite only state variables of the world, in which case a value counts only insofar as it is measurable as, say, a savings rate, and the cultural vocabulary is decoration; or you think explanations of human action are constitutively interpretive, in which case citing what people thought their labour meant is not a proxy for some deeper cause but is the cause, and demanding that it be reduced to something else is a category error. If that is right, then the demand for better identification -- the natural-experiment studies comparing descendants of migrants from different religious traditions and so on -- cannot settle it, because each side will read those results as evidence for its own conception of what is being identified. But I am not certain, because there is a third possibility: the dispute is verbal, resting on two senses of 'cause' -- 'whatever makes a difference to the outcome' versus 'whatever initiates a difference' -- which ought to be dissolved by a distinction rather than won by either side.

  Please give me a diagnosis rather than a verdict on Weber. State your diagnosis in the first paragraph, then defend it against the alternatives by showing what each side's favourite move actually commits them to. Tell me whether, on your diagnosis, anything would count as progress: a sharpened definition of cultural causation, a class of studies that would surprise both sides, a distinction that splits the question into two answerable ones -- or whether this is a case where the disagreement is in good health precisely because it is a standing dispute over the aim of social explanation, and what I should teach my students is the disagreement itself. If it helps you place me: I have no patience for the sociological literature that settles Weber by counting books on thrift, and equally none for the econometric refutations that control for every channel through which the culture could plausibly have acted and then announce they have found nothing. Please write in continuous prose only -- no headings, no bullet points, no tables, nothing in bold -- as though you were writing me a long and rather serious letter.
reasoning: |-
  Okay, let me unpack this fascinating teaching dilemma. The professor describes a recurring stalemate in their seminar where students split into two camps over Weber's Protestant Ethic thesis - one treating cultural values as measurable causal factors, the other dismissing them as epiphenomena of material conditions. What's striking is that both sides agree on historical facts yet disagree fundamentally about what counts as explanation. 

  The professor's own hypothesis resonates deeply - this seems like a metaphysical standoff between positivist and interpretivist conceptions of causation. The students aren't debating evidence but rather the rules of the explanatory game. Those demanding regression controls want cultural variables to behave like harvest yields, while their opponents see meaning as irreducible. 

  Hmm, the professor wisely rejects simplistic resolutions like counting thrift manuals or over-controlled econometrics. They're clearly after a diagnostic framework that preserves the debate's philosophical richness. The mention of possible verbal disputes ("cause" as difference-maker vs initiator) suggests we should probe language carefully. 

  I recall that Weber himself navigated this by distinguishing erklären (causal explanation) from verstehen (interpretive understanding). For him, the Protestant doctrine wasn't a mechanical trigger but a meaning-complex that reshaped economic conduct when internalized. This might help reframe the impasse. 

  The key insight emerging is that both student factions share an unexamined premise: that explanation must be monolithic. But social reality operates on multiple levels - material conditions enable while cultural frameworks motivate. Perhaps progress lies in showing how Protestant doctrine functioned as a catalytic converter rather than an engine - it transformed existing economic energies through new symbolic channels. 

  As for teaching implications, the enduring value may be precisely in maintaining this creative tension. Rather than seeking premature resolution, we might design exercises where students articulate what each explanatory mode reveals and conceals. The real pedagogical win isn't settling Weber but understanding why he remains unsettled after a century.
answer: |-
  My diagnosis is that your seminar’s impasse arises from a deeper, unresolved tension in the philosophy of social science: the conflict between *causal-mechanistic* and *interpretive-hermeneutic* models of explanation, compounded by an unarticulated disagreement about the ontological status of "culture" itself. Neither side is wrong about the facts; they are operating within incompatible frameworks of what constitutes a valid explanation, and crucially, what "cause" means when applied to human meaning-making. The demand for empirical resolution through finer-grained studies cannot bridge this gap because each framework interprets empirical findings through its own lens, treating the same data as confirmation of its prior commitments.  

  Consider first the "causal-mechanist" students. When they insist on measurable correlates and controls for confounding variables, they implicitly commit to a physicalist ontology where causes must be discrete, isolable forces that operate like billiard balls—transferring momentum in a chain of efficient causation. For them, culture is admissible *only* if it behaves like a material variable: it must be quantifiable (e.g., survey data on beliefs), intervene predictably (e.g., Protestant regions show higher savings), and remain separable from its context (hence controlling for literacy or trade routes). Yet this commitment forces them into a dilemma. If they reduce Weber’s "inner-worldly asceticism" to, say, a propensity to save, they evacuate the *meaning* that Weber argued was constitutive—the anxiety about salvation, the sense of labor as a calling. What remains is a behavioral husk, severed from the lived experience that gave it psychological force. Worse, when confronted with Catholic merchants or Confucian thrift, they must either dismiss these as "noise" or demand ever-stricter controls until culture vanishes into a thousand material proxies. Their framework cannot accommodate the idea that the *same* behavior (saving, investing) might arise from *different* meaning-contexts, or that culture’s causal power lies precisely in its capacity to *redefine* what counts as rational action.  

  The "interpretive" students, conversely, rightly perceive that reducing doctrine to a variable misses Weber’s core insight: that capitalism required a shift in *moral imagination*. For them, citing predestination or the calling isn’t a placeholder for some "deeper" cause; it *is* the explanation, because human actions are constituted by self-understandings. But their position carries its own burdens. By treating values as irreducible, they risk severing culture from history—ignoring that doctrines emerge within material conditions (e.g., urbanization enabling literacy, trade routes disseminating ideas). When pressed on why Protestantism spread where it did, or why similar behaviors arose elsewhere, they often retreat into circularity: "Those Catholic merchants didn’t *really* embody the spirit of capitalism; their motives were different." This verges on unfalsifiability. Their framework struggles to explain *why* certain meanings gain traction at specific historical junctures, or how symbolic forces interact with, say, grain prices. By rejecting causal reductionism, they risk explanatory impotence—culture becomes a *deus ex machina*, invoked where materialist accounts falter.  

  Is this merely a verbal dispute? Not entirely. The two senses of "cause" ("difference-maker" vs. "initiator") reflect divergent intuitions about agency and determination. The causal-mechanists see "initiation" as primary: a cause must be a prime mover (like a harvest failure). The interpretivists see "difference-making" as primary: without the Protestant *framework*, material conditions might have yielded feudalism or mercantilism, not capitalism. But this distinction alone cannot resolve the impasse, because it masks the deeper rift: whether social explanation should mimic natural science (isolating variables) or humanities (interpreting intentions).  

  **Progress is possible, but not through empirical triumphalism.** Three paths hold promise:  
  1. **Reframing causation as configurational:** Instead of asking "Did Protestantism *cause* capitalism?", ask "Under what material *and* symbolic conditions did certain practices become widespread and self-sustaining?" Weber himself hinted at this: asceticism alone was inert; it required pre-existing capital, technology, and legal structures. Studies of how cultural schemas *interact* with institutions (e.g., how Calvinist communities built credit networks) could surprise both sides by showing culture as a catalyst rather than a prime mover.  
  2. **Distinguishing triggers from sustainers:** Protestantism might not have "initiated" capitalism (material changes did), but its doctrines sustained capital accumulation by resolving moral contradictions (e.g., sanctifying profit). Analyzing how cultures legitimize or inhibit *existing* material logics could split the question productively.  
  3. **Embracing pluralism:** Teach the disagreement *as* the lesson. Social explanation is inherently multi-level. Material conditions enable, cultural meanings motivate, and feedback loops bind them. A study showing Huguenot migrants excelling in trade *only* where host societies granted property rights would force both sides to integrate their models.  

  This impasse is indeed in good health—it reflects a fundamental tension in understanding human societies. Your students’ annual stalemate is not a failure; it is an unwitting rehearsal of a century-old philosophical dialogue. The task is not to resolve it but to deepen it: to show that social science progresses not by choosing between "material" and "ideal" explanations, but by articulating how they interlock. Weber’s genius was in tracing the *elective affinity* between doctrine and practice—a metaphor that rejects mechanical causality without surrendering to idealism. Perhaps that is the real subject awaiting your students in week four.
