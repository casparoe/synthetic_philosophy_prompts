prompt: |-
  hey so I'm on the rules committee of my school's student council and we've got this weird case for Tuesday's meeting. A council member, Maya, wrote a letter that started "I hereby resign from the student council effective immediately" and handed it to the school paper asking them to "take a look at my writing." It ran in full on Friday, so basically the whole school, including the council president, read it. She never actually delivered it to us, and now she says it was just a draft she never meant to send and that she's not actually resigning. The thing is, she's moving to a new class next semester, and if her seat counts as vacant, the bylaws kick off a by-election for our class's slot, which her friend is running for. So she has a reason to say it was a draft, and I don't fully buy it, but I also can't just ignore it.

  Our bylaws say a member "may resign at any time by notifying the council in writing," and half the council thinks the paper publication counts as notification while the other half says no because it never reached us as a resignation. I keep feeling like this is actually a speech-acts question, like Austin's performative stuff, and I want the memo to use that rather than just parsing the bylaws. Like: is "I hereby resign" the kind of thing that takes effect by being said, or does it only work if it's said in the right place to the right people (his whole happy/unhappy performative thing)? And does a draft or a rehearsal of a performitive do anything at all, or is it just inert words? I'm not sure the philosophy fully settles it, but I'd like the memo to use it to figure out which reading of "notifying" is more definsible.

  Can you draft a short decision memo for the council that recommends either vacant, not vacant, or something like "treat the seat as filled until the letter is actually delivered" -- with a time frame -- and give Maya's side real weight instead of just restating the bylaws? And after the memo, give me a JSON object with exactly these fields: 'verdict' (one of 'vacant', 'not_vacant', 'conditional'), 'deciding_principle' (one sentence, the core reason), 'strongest_point_for_maya' (one sentence, the best argument against your verdict), and 'what_would_flip_it' (one sentence, a piece of new info that would change the recommendation).
reasoning: |-
  Hmm, the user is on a student council rules committee dealing with a tricky resignation case. Maya wrote a resignation letter starting with "I hereby resign..." but gave it to the school paper as writing feedback, not to the council. Now she claims it was just a draft after it got published. There's political context too - she's moving classes, and a by-election would help her friend. 

  The core tension is between performative language theory (Austin) and bureaucratic procedure. Austin would say "I hereby resign" performs the action only under proper conditions - which weren't met here since the letter wasn't addressed to the council. But the bylaws require "notifying the council," which didn't happen directly. 

  Maya's strongest point is plausible deniability: she never submitted it as resignation, only as writing. That creates reasonable doubt. Still feels fishy given the timing with her friend's potential candidacy, but without proof of intent, the council shouldn't assume bad faith. 

  The memo should split the difference: seat remains filled unless she formally submits within 48 hours. Forces clarity while respecting due process. Also prevents setting a precedent where stray publications count as official notices - imagine if someone "resigned" via bathroom graffiti!

  Key JSON fields:
  - Verdict: conditional (time-bound)
  - Deciding principle: Notification requires deliberate receipt by council
  - Strongest for Maya: Lack of delivery to council creates doubt
  - Flip condition: Proof she instructed the paper to act as messenger
answer: |-
  ## Student Council Rules Committee Decision Memo  
  **Date:** [Current Date]  
  **Subject:** Recommendation Regarding Council Member Maya's Resignation Status  

  ### Case Summary  
  Council Member Maya provided a letter containing the phrase "I hereby resign from the student council effective immediately" to the school newspaper for editorial feedback. The newspaper published the letter in full on [Date], making its contents widely known. Maya asserts this was an unpublished draft shared solely for writing critique and not intended as resignation. She has never submitted this (or any) resignation notice directly to the Council. The vacancy of her seat would trigger a by-election for her class representative position, in which her friend is a candidate.  

  ### Analysis  
  The committee analyzed this case through both the bylaws and the philosophy of linguistic performatives (J.L. Austin's *How to Do Things with Words*):  
  1. **Bylaws Interpretation**: The requirement to "notify the council in writing" implies deliberate communication *to the council as an entity*. Publication in a third-party outlet (school paper) does not constitute notification *to the council*, as it lacks official intent and direct receipt.  
  2. **Performative Analysis**: Austin distinguishes "happy" (valid) performatives from "unhappy" (void) ones. For "I hereby resign" to be a successful performative:  
     - It must be uttered in a conventional context (e.g., to the council).  
     - The speaker must intend the utterance to enact resignation.  
     - Drafts/rehearsals explicitly framed as non-binding (e.g., "take a look at my writing") are *inert*—they lack the intentionality and context to "do" anything.  

  ### Recommendation  
  **The seat is NOT VACANT at this time.** Maya retains her position unless she formally notifies the council.  

  ### Rationale  
  - **Core Principle**: Resignation requires both performative intent *and* delivery to the proper authority. A draft shared with a non-council entity for non-administrative purposes fails both criteria.  
  - **Maya’s Strongest Argument**: Maya never delivered the letter *to the council* as a resignation instrument; its publication resulted from a misunderstanding of her intent when seeking writing feedback.  
  - **Conditions for Reassessment**:  
    - Maya must formally clarify her status in writing to the Council President within **48 hours** of this decision.  
    - Failure to affirm continued membership within this timeframe will render the seat vacant.  

  ### Action Required  
  The Council President shall request written confirmation of Maya’s continued membership by [Deadline: 48 hours from meeting]. If no confirmation is received, declare the seat vacant per bylaws.  

