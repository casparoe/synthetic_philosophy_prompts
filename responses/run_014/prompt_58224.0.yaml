answer: |-
  Here's a complete, low-prep activity plan designed to make students experience how politics are embedded in technology design. The structure ensures they discover the concept through roleplay and reflection, with a clear debrief connecting to power structures.

  ---

  ### **Activity: "Baked-In Politics"**
  **Goal:** Students experience how technology designs make implicit political choices that favor certain groups/values.

  **Materials Needed:**
  - 3 station signs (Shuttle App, Laundry System, Floodgate)
  - Role cards (index cards, pre-written roles below)
  - Scenario cards (one per station, large paper)
  - Decision slips (small paper slips for group choices)
  - Consequence envelopes (3 per station, labeled A/B/C)
  - Markers, tape, timer
  - Whiteboard for debrief

  **Prep (20 mins):**
  1. Set up 3 physical stations with signs.
  2. At each station, post:
     - **Scenario card** (description below)
     - **3 consequence envelopes** (contents below)
     - **Role cards** (4 roles per station, on index cards)
     - Blank decision slips + markers

  ---

  ### **Step-by-Step Timeline (75 mins total)**
  #### **0-5 mins: Setup & Intro**  
  - Split students into 6 groups (3-4 students each).  
  - Assign 2 groups per station (e.g., Station 1: Group A+B; Station 2: Group C+D; etc.).  
  - **Instructions:**  
    > “Each group will tackle a tech design problem. You’ll be assigned roles—advocate for your role’s interests. Discuss and make a group decision in 10 mins. Then, open the consequence envelope matching your choice. We’ll rotate stations twice.”

  #### **5-23 mins: Round 1 (18 mins/station)**  
  - At stations, students:  
    1. **Assign roles** (2 mins): Each picks a role card.  
    2. **Read scenario + discuss** (8 mins): Argue from roles to reach a decision.  
    3. **Choose & submit** (2 mins): Write choice (A/B/C) on slip, drop in envelope.  
    4. **Reveal consequences** (3 mins): Open envelope, read outcomes silently.  
    5. **Quick reflection** (3 mins): Discuss: *“Who won? Who lost? Why?”*  
  - *TA circulates, nudges: “What does your role care about?”*

  #### **23-24 mins: Rotation 1 (1 min)**  
  - Groups move clockwise: Station 1 → 2, Station 2 → 3, Station 3 → 1.

  #### **24-42 mins: Round 2 (18 mins/station)**  
  - Repeat Round 1 steps at new station.

  #### **42-43 mins: Rotation 2 (1 min)**  
  - Groups rotate again (Station 1 → 2, etc.).

  #### **43-61 mins: Round 3 (18 mins/station)**  
  - Repeat steps at final station.

  #### **61-75 mins: Debrief (14 mins)**  
  1. **Share reactions** (5 mins):  
     - *“What surprised you?”*  
     - *“Did any tech feel ‘neutral’? Why not?”*  
  2. **Connect to politics** (6 mins):  
     - *Draw 2 columns on board:*  
       - **“Settles Conflict”** (e.g., floodgate auto-mode: centralizes power, hides choice).  
       - **“Needs Power Structure”** (e.g., laundry queue: requires constant labor, favors privileged).  
     - *Ask:* “Which systems ‘locked in’ a political outcome? Which needed ongoing power (e.g., maintenance, labor)?”  
     - **Reveal key concept:** *“This is ‘technological politics’—designs embed values (e.g., efficiency > equity) that shape power* before *people use them.”*  
  3. **Conclusion** (3 mins):  
     - *“Tech isn’t neutral. Design choices decide who benefits, who bears costs, and what values are enforced.”*  
     - *“Next class: How to spot this in real tech (e.g., algorithms, UI).”*

  ---

  ### **Station Materials**  
  **Low-Prep Setup:** Write on index cards/large paper.  

  #### **Station 1: Campus Shuttle App**  
  - **Scenario Card:**  
    > *“Your campus shuttle app auto-skips stops with <3 ride requests after 8pm. Saves fuel/time but leaves some students stranded. Do you:  
    > A) Keep it as-is?  
    > B) Remove skip-feature?  
    > C) Only skip stops after 10pm?”*  
  - **Roles (index cards):**  
    - **Student (rural area):** “You rely on a low-ridership stop. Walking at night feels unsafe.”  
    - **Student (downtown):** “You benefit from faster rides. Skipping stops helps you study more.”  
    - **Shuttle Manager:** “Your budget is tight. Skipping saves 20% on fuel.”  
    - **Sustainability Officer:** “You must reduce carbon emissions by 15% this year.”  
  - **Consequence Envelopes:**  
    - **A:** “Downtown students thrive. Rural students protest. Equity complaints spike.”  
    - **B:** “All stops served. Rides slower; fuel costs rise 20%. Budget cuts delay repairs.”  
    - **C:** “Fewer complaints, but rural students still stranded late. Emissions drop only 5%.”  

  #### **Station 2: Dorm Laundry Booking**  
  - **Scenario Card:**  
    > *“A dorm booking system requires staying awake in a live queue (click every 5 mins) to get a slot. Cuts no-shows but harms tired students. Do you:  
    > A) Keep it?  
    > B) Switch to advance bookings?  
    > C) Allow 1-hour grace periods?”*  
  - **Roles:**  
    - **Night-shift worker:** “You nap while queueing and lose slots. You’re exhausted.”  
    - **Athlete:** “You have regular hours. You always get slots and love the system.”  
    - **Sys Admin:** “No-shows dropped 90%! Servers can’t handle advance bookings.”  
    - **Health Advocate:** “Sleep deprivation is up 40%. Students are stressed.”  
  - **Consequences:**  
    - **A:** “Efficiency soars. Night-shift students drop out of queue; laundry access unequal.”  
    - **B:** “No-shows return. Slots fill instantly; athletes miss out. Sys crashes weekly.”  
    - **C:** “Fewer no-shows, but night workers still struggle. Health complaints continue.”  

  #### **Station 3: Town Floodgate**  
  - **Scenario Card:**  
    > *“A floodgate can be hand-cranked by locals or auto-controlled from a central office. Auto is faster but needs experts. Do you:  
    > A) Use auto-only?  
    > B) Use manual-only?  
    > C) Hybrid (auto, but locals can override)?”*  
  - **Roles:**  
    - **Local Fisher:** “You know the river! Outsiders ignore nuances like fish runs.”  
    - **Gov Engineer:** “Auto-control prevents floods. Locals caused a flood last year.”  
    - **Elder:** “Cranking is our tradition. Losing it kills community trust.”  
    - **Mayor:** “You need flood safety but fear unrest. State funding requires auto-mode.”  
  - **Consequences:**  
    - **A:** “Floods prevented! Locals riot over lost jobs. Tradition erodes.”  
    - **B:** “Community thrives. Minor floods cause costly damage. State withdraws funds.”  
    - **C:** “One flood occurs after a local override. Blame game starts. Trust collapses.”  

  ---

  ### **What Could Go Wrong (and Fixes)**  
  1. **Time Crunch:** Groups debate too long → **Enforce strict timers.** Announce: “You have 2 mins left to decide!”  
  2. **Role Confusion:** Students don’t argue → **Nudge:** “What would your role fight for? What’s their nightmare outcome?”  
  3. **Oversimplifying:** Missing nuance → **Debrief explicitly:** “Real tech politics involve layers of history/money we couldn’t simulate.”  
  4. **Groupthink:** Dominant voices → **Assign strong roles to quiet students** (e.g., “Shuttle Manager must cut costs”).  

  ### **Limitations of the Activity**  
  - **Can’t Show:**  
    - **Long-term ripple effects** (e.g., how shuttle app shapes campus inequality over years).  
    - **External power forces** (e.g., corporate influence on designs, historical inequities).  
    - **User resistance/subversion** (e.g., hacking the laundry system).  
  - **Spell This Out:**  
    > “In reality, tech politics involve history, money, and unintended consequences. Designs reflect their creators’ biases and can amplify inequality long-term. We simplified to show the core idea: *tech isn’t neutral*.”  

  ---

  This plan requires only paper/index cards, fits your time, and forces students to confront embedded politics through conflict. The debrief links their frustration to the core takeaway: tech designs "freeze" political choices or demand unsustainable power structures.
