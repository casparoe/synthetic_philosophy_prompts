answer: |-
  ## Bridging the Gap: Coherence Arguments and the Justification of Expected Utility Maximization

  Your intuition is sharp and your nagging doubt is profoundly justified. **There is indeed a significant gap in the standard "coherence justifies Expected Utility (EU) maximization" pitch when Dutch Book arguments are presented solely as arguments for probabilistic coherence of beliefs.** The leap from coherent *credences* to coherent *preferences* satisfying the von Neumann-Morgenstern (VNM) axioms is often glossed over or implied without sufficient argument. However, **the gap can be bridged by extending the coherence paradigm**, though this requires moving beyond the simplistic textbook presentation and embracing the full scope of the Bayesian program. Let's dissect the arguments for and against.

  **The Case for the Gap: Your Suspicion is Well-Founded**

  1.  **The Scope of the Basic Dutch Book Theorem (DBT):** As you correctly note, the standard DBT targets the axioms of probability. It demonstrates that if an agent's degrees of belief (credences) violate any axiom (non-negativity, normalization, finite additivity), a clever bookie can construct a set of bets (a Dutch Book) that the agent finds individually acceptable (based on their credences) but which collectively guarantee them a net loss *regardless of the state of the world*. Coherence (avoiding Dutch Books) demands probabilistic credences.
  2.  **The Missing Piece: Preferences over Outcomes:** EU maximization requires more than probabilistic beliefs. It requires a utility function *u* over outcomes such that preferences between gambles (acts) satisfy the VNM axioms:
      *   **Completeness & Transitivity:** Preferences are ordered consistently.
      *   **Continuity:** Small changes in probability don't cause abrupt preference reversals.
      *   **Independence (Substitution):** Preferences between gambles depend only on the differing aspects.
      The basic DBT says *nothing* about preferences over outcomes or the structure of value. It assumes agents evaluate bets based solely on expected *monetary* gain relative to their credences. This is insufficient for EU:
      *   **Non-Linear Utility:** An agent with probabilistic beliefs but a non-linear utility for money (e.g., risk-averse) will *not* value bets based purely on expected monetary value. They might accept bets the DBT deems "fair" only if offered at a premium reflecting their risk aversion. The basic DBT cannot compel linear utility.
      *   **Violating VNM Axioms:** An agent could have coherent credences yet violate, say, the Independence axiom. They might prefer gamble A to B, but prefer a mixture of B with some C over the same mixture of A with C. The basic DBT doesn't address this dynamic inconsistency.

  **The Standard Pitch's Oversimplification:** Presenting the basic DBT alone as justifying *full* EU maximization is misleading. It only justifies one component: probabilistic beliefs. It leaves the utility function and the structure of preferences entirely unjustified by coherence arguments at this stage. **Yes, the gap you sense is real within this narrow framing.**

  **Bridging the Gap: Extending the Coherence Paradigm**

  The gap isn't fatal to the coherence project; it just requires recognizing that the DBT for probabilities is only the *first step*. Bridging the gap involves extending coherence arguments to preferences and values:

  1.  **De Finetti's Prevision-Based Dutch Books:** This is the most direct response. De Finetti's framework *starts* with previsions (fair prices) for *gambles* (random variables), not directly with probabilities or utilities.
      *   **Coherence Defined Holistically:** An agent's previsions for any set of gambles are "coherent" if there is *no finite combination* of buying/selling those gambles at the stated prices that guarantees a sure loss.
      *   **The Representation Theorem:** De Finetti proved that an agent's previsions are coherent *if and only if* there exists a probability distribution over states and a linear utility scale (unique up to affine transformation) such that the prevision for any gamble is its expected utility. Crucially, the linearity of the utility scale emerges *from* the coherence requirement applied to prices for gambles defined over *outcomes*.
      *   **Bridging the Gap:** This approach directly targets the valuation of *acts* (gambles). Coherence applied at this level simultaneously forces both probabilistic beliefs over states *and* a linear utility function over outcomes (satisfying the core preference structure for EU). The gap closes because coherence is defined over the objects directly relevant to choice (gambles over outcomes).

  2.  **Money Pump Arguments as Preference Dutch Books:** While not always labeled "Dutch Books," money pump arguments are their direct analogues for preferences.
      *   **Targeting VNM Axioms:** Arguments can be constructed showing that violations of specific VNM axioms (especially Transitivity or Independence) make an agent vulnerable to being "pumped" for money through a series of exchanges driven by their inconsistent preferences.
      *   **Example (Independence):** Suppose an agent violates Independence: Prefers A to B, but prefers [pB + (1-p)C] to [pA + (1-p)C]. A clever counterparty could:
          *   Offer to swap the agent's A for B (agent pays a small fee, happy as they prefer B?).
          *   Later, offer to swap the agent's B for the mixture [pB + (1-p)C] (agent pays another fee, happy as they prefer the mixture).
          *   Then, offer to swap the mixture [pB + (1-p)C] back to [pA + (1-p)C] (agent pays yet another fee, happy as they prefer this mixture to the one they have).
          *   The agent ends up with [pA + (1-p)C], having paid fees, but they started with A and preferred A to B! If [pA + (1-p)C] is considered equivalent to A in the relevant aspects (which Independence assumes), they've paid money to end up with something effectively equivalent to what they started with.
      *   **Bridging the Gap:** Money pump arguments demonstrate that violations of the VNM preference axioms lead to a form of *dynamic incoherence* – a guaranteed loss through a sequence of choices. This is structurally identical to a Dutch Book, just unfolded over time. Coherence, understood as avoiding *any* vulnerability to sure loss (static or dynamic), thus demands VNM-conformant preferences. These arguments justify the preference/utility component required for EU alongside the probabilistic beliefs justified by the static DBT.

  3.  **Savage's Sure-Thing Principle as Coherence:** Savage's foundational work derives both probability and utility from axioms governing preferences over acts. The "Sure-Thing Principle" (a form of the Independence axiom) acts as a crucial coherence condition. Violations of it can lead to Dutch-Book-like inconsistencies (framed in terms of state-dependent preferences). Savage's framework provides a unified coherence justification for the entire EU structure.

  **Weighing the Arguments and Reaching a Conclusion**

  *   **The Gap is Real (for the simplistic pitch):** You are absolutely correct. Presenting the basic Dutch Book Theorem (about probabilities) as *sufficiently* justifying Expected Utility maximization is an oversimplification bordering on error. It ignores the entirely separate requirement for coherent preferences and a linear utility structure.
  *   **The Gap is Bridgeable (within the coherence paradigm):** The coherence project, when fully articulated using the tools developed by de Finetti (previsions), Savage (preference axioms), and others (money pump arguments), *can* provide a unified justification for both components of EU maximization. The key is recognizing that "coherence" must apply holistically to an agent's entire system of evaluations and choices:
      *   **Static Coherence (De Finetti):** Avoids sure loss in a single round of simultaneous bets on any proposition/gamble. Forces probabilistic beliefs *and* linear utility.
      *   **Dynamic Coherence (Money Pumps):** Avoids sure loss through sequences of choices. Forces consistency in preferences over time, specifically the VNM axioms (Transitivity, Independence).

  **The Conclusion: Justified, but the Standard Pitch Needs Qualification**

  **Yes, coherence arguments, in their full generality encompassing both prevision-based static coherence and preference-based dynamic coherence (money pumps), *do* justify expected utility maximization.** The vulnerability to sure loss (static or dynamic) provides a powerful pragmatic rationale for adopting the entire EU framework.

  **However, the common seminar presentation focusing *only* on the probability Dutch Book as the justification *is* too strong and creates the gap you identified.** It fails to acknowledge the distinct and necessary work required to justify the preference/utility component.

  **Therefore, your leaning is partially correct: there is a real gap *in the way the argument is often presented*. But the gap is not fundamental to the coherence project itself.** It can be closed by incorporating the extended arguments developed by de Finetti, Savage, and others working on dynamic choice.

  **Recommendation:** Challenge the simplistic presentation in your seminar. Argue that a complete coherence justification requires:
  1.  The basic DBT for probabilistic beliefs.
  2.  Arguments like de Finetti's prevision-based coherence or money pump arguments for the VNM preference axioms (justifying the linear utility structure).
  Presenting both facets provides a much more robust and accurate foundation for justifying Expected Utility maximization via coherence. Your advisor should appreciate this deeper dive – it strengthens the philosophical underpinnings of the theory you're studying. Keep wrestling with these foundational issues; it's the mark of excellent philosophical work.
