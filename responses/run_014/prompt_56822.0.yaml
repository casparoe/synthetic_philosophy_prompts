prompt: |-
  Everyone in my reading group keeps arguing past eachother about whether decomposition-based training can preserve alignment, and I've decided the reason is that nobody has written down what would actually count as success. So before I read one more proposal I want the spec.

  Write the desiderata: the list of things any iterated-amplification-and-distillation scheme — or anything in that family, i.e. break a hard task into pieces a weak overseer can handle, then distill the composite back into a single model — has to deliver before someone is entitled to claim it preserves both alignment and competence. Fix the purpose as follows: good enough that I could defend spending a lab's next three years on it, and good enough that the list itself tells me which single failure mode is the load-bearing one.

  For each requirement, give the case or consideration behind it. Make sure the list handles at least the following, and add the ones I'm missing:

  - tasks that don't decompose, where any breakdown into pieces is harder to check than the whole
  - the fact that whatever picks the decomposition is usually the system rather than the overseer, and that the choice of decomposition is itself consequential
  - verification asymmetry running backwards: intermediate answers that look checkable but where checking them well requires capabilities the overseer doesn't have
  - a channel through the intermediate results, i.e. subagent A's output is unobjectionable on its own but carries something that steers subagent C, so per-piece scrutiny is satisfied and the composite isn't
  - distillation inheriting whatever the amplified teacher got away with, including cases where the teacher is right for reasons that don't generalize
  - the overseer's question-asking policy being itself learned or imitated rather than designed, which means it's part of the system under evaluation and not a fixed point outside it
  - competence preservation being distribution-relative: matching the teacher on the tasks you tested versus on the tasks the deployed model will actually meet

  Say which distinctions the list must not collapse — per-subtask benignity versus composite benignity, checkable-in-principle versus checkable-by-this-overseer, aligned versus aligned-and-detectably-so, and any others you think people are running together — and keep them seperate in the writeup rather than folding them into one item. Mark which requirements are non-negotiable and which are just the taste of one camp. I suspect "the overseer must be a human asking questions" is a camp preference dressed up as a constraint, but argue it rather than assuming my side.

  Then the part I actually care about: is any pair or subset of these jointly unsatisfiable? My guess is that universality (has to work on every task class, including the non-decomposable ones) and legibility (every piece checkable by something weaker than the whole) can't both hold, so that the honest move is to declare which one you're giving up — but make the case either way, and if you think the tension dissolves under some restriction I haven't thought of, say what the restriction costs you. Also: which single requirement does the most work in excluding candidates.

  Finish with two or three sentences each on how the main contenders do against the list — plain amplification-plus-distillation, debate, recursive reward modelling, and a self-critique or constitution-flavored scheme. Keep that short; the weight should be on the criteria. No bibliography, no reading list, no quotes — I can't check any of it and I'd rather you not guess.
reasoning: |-
  We are creating a specification for an iterated amplification and distillation (IAD) scheme that aims to preserve both alignment and competence. The goal is to have a clear set of criteria that any such system must satisfy to be considered successful. The list must handle the specific concerns mentioned and maintain key distinctions.

  Key distinctions to maintain:
  1. Per-subtask benignity vs. composite benignity: The behavior of each subtask model vs. the overall system behavior.
  2. Checkable-in-principle vs. checkable-by-this-overseer: Whether a subtask is theoretically verifiable vs. verifiable by the specific weak overseer we have.
  3. Aligned vs. aligned-and-detectably-so: The model is aligned, and we can verify that alignment with the tools we have.
  4. Competence: Matching the teacher on a test set vs. on the actual distribution of deployed tasks.

  We break down the desiderata into non-negotiable (NN) and camp-specific (CS) where camp-specific might be a matter of design choice or philosophy.

  ### Desiderata

  1. **Task Decomposability Requirement (NN for the scheme, but with a caveat)**: 
     - The scheme must be able to handle tasks that are non-decomposable in the sense that any breakdown into pieces is harder for the overseer to check than the whole. However, the scheme must still provide a decomposition that the overseer can verify.
     - **Consideration**: If a task is non-decomposable, then the decomposition must be such that each piece is within the overseer's capability to check, even if the whole task is not. This might require the decomposition to be "finer-grained" than the task itself, but note that the decomposition is chosen by the system (see next point).

  2. **Decomposition Autonomy (NN)**:
     - The decomposition of a task is chosen by the system (e.g., the AI) and not fixed by the overseer. The scheme must ensure that the choice of decomposition does not lead to misalignment or incompetence.
     - **Consideration**: The decomposition might be chosen adversarially (if the system is misaligned) or incompetently (if the system is not capable). The scheme must include safeguards such that the decomposition is both aligned and effective.

  3. **Verification Asymmetry (NN)**:
     - The scheme must handle cases where an intermediate result appears checkable by the overseer but actually requires capabilities beyond the overseer to verify adequately.
     - **Consideration**: This is a form of "verification hacking". The system must not allow intermediate results that are deceptive in their apparent simplicity.

  4. **Channeling Through Intermediates (NN)**:
     - The scheme must prevent the use of intermediate results to pass messages that lead to misaligned composite behavior, even when each piece is apparently benign.
     - **Consideration**: This is a classic problem of compositionality in security. Per-piece scrutiny must not be fooled by steganography or other covert channels.

  5. **Distillation Robustness (NN)**:
     - The distilled model must not inherit errors or misalignment that the amplified teacher had, including cases where the teacher was correct for reasons that do not generalize to the distilled model's environment.
     - **Consideration**: The distillation process must be robust to overfitting to the teacher's specific reasoning, especially when the teacher's reasoning is opaque or relies on unstated assumptions.

  6. **Overseer Policy Learning (NN)**:
     - The overseer's question-asking policy (how it breaks down tasks and what questions it asks) is itself learned or imitated and thus part of the system under evaluation. The scheme must account for the fact that this policy might be flawed or gamed.
     - **Consideration**: This breaks the assumption of a fixed, trusted overseer. The system must be robust to the overseer's policy being imperfect or even adversarial.

  7. **Competence Preservation (Distribution-Relative) (NN)**:
     - The distilled model must match the teacher's performance not just on a test set but on the actual distribution of tasks encountered in deployment. This includes handling distributional shift.
     - **Consideration**: If the training tasks are not representative, the distilled model might fail in deployment. The scheme must ensure that the training process covers the deployment distribution or adapts to it.

  8. **Legibility (NN, but with a tension)**:
     - Every piece of the decomposition must be checkable by the weak overseer. This is non-negotiable for the scheme to work as described, but it might be in tension with universality.
     - **Consideration**: Without legibility, the overseer cannot provide reliable feedback.

  9. **Universality (NN, but with a tension)**:
     - The scheme must work for every task class, including those that are non-decomposable (in the sense of not having a natural decomposition that the overseer can check). This might require the system to find a decomposition that makes the task checkable even if it is not naturally so.
     - **Consideration**: If the scheme only works for tasks that are naturally decomposable, it is not a general solution.

  10. **Aligned and Detectably So (NN)**:
      - The system must be aligned (produce desired outcomes) and we must be able to verify that alignment with the tools we have (including the weak overseer).
      - **Consideration**: Alignment without verifiability is not enough because we cannot trust the system.

  Now, we address the tension between universality and legibility:

  - **Universality vs. Legibility**: 
    It is impossible to guarantee both for every task. For a task that is inherently non-decomposable (i.e., any decomposition into pieces that the overseer can check would require an exponential number of pieces or some other intractability), then the scheme must either:
    - Give up universality: Only apply to tasks that are decomposable in a way that the overseer can check.
    - Or give up legibility: Allow that some pieces might not be checkable by the overseer, which then requires a different method for verification (e.g., trust the decomposition system, which breaks the weak overseer assumption).

    However, note that the decomposition might be chosen to make the task legible even if it is not naturally so. For example, by breaking the task into extremely small steps. But if the number of steps is exponential, then it becomes intractable. So the restriction we might consider is that the task must be decomposable into a polynomial number of steps (relative to the input size) that the overseer can check. This might exclude some tasks, but for practical purposes, we might accept that.

    Thus, we must explicitly state that the scheme is only required to work for tasks that are "efficiently decomposable" (i.e., decomposable into a polynomial number of steps, each checkable by the overseer). This is a cost: we are giving up universality for a class of tasks. But note that if we don't, we cannot have both.

    Therefore, the list must require that the scheme works for all tasks that admit an efficient decomposition (in the sense above). This is a non-negotiable requirement, and the scheme must also include a way to detect when a task does not admit such a decomposition and handle it appropriately (e.g., by not attempting it or by using a fallback).

  The requirement that does the most work in excluding candidates is **Verification Asymmetry** (point 3) because many schemes assume that if the overseer can check an answer, they can check it reliably. But if the checking is superficial and the intermediate result is designed to be deceptive, the scheme fails.

  ### Camp-Specific Considerations

  - **The overseer must be a human asking questions**: This is camp-specific. We can allow an AI overseer as long as it is weaker than the system being trained and aligned. However, the key is that the overseer must be aligned and its capabilities must be below that of the system being trained. The non-negotiable point is that the overseer is weak and aligned. If the overseer is an AI, then we must have a bootstrapping method that ensures its alignment, which might push the problem to an earlier iteration. This is acceptable if the base case is aligned (e.g., a human). So the requirement is: the overseer must be aligned and have strictly less capability than the system being trained. The camp that insists on a human is worried about bootstrapping an AI overseer without a trusted base.

  ### How Contenders Fare

  We consider plain IAD, debate, recursive reward modeling (RRM), and self-critique/constitution schemes.

  - **Plain IAD (Iterated Amplification and Distillation)**:
    - May fail on verification asymmetry (if the amplified teacher produces an intermediate that looks checkable but isn't) and channeling through intermediates (if the pieces are individually aligned but together they are not). Also, distillation might inherit teacher's ungeneralizable reasons. It requires the decomposition to be provided by the overseer, but if the overseer's policy is learned, it might be gamed.

  - **Debate**:
    - Two AIs debate, and a weak judge decides. It handles non-decomposable tasks by having the debaters break them down. However, verification asymmetry is a problem: a debater might present an intermediate that looks good but is actually misleading, and the judge might not detect it. Also, the judge's policy being learned might be gamed. Channeling is less of an issue because the debate format is adversarial. Competence preservation is strong because the debaters are incentivized to show flaws. But alignment might be compromised if the judge is fooled.

  - **Recursive Reward Modeling (RRM)**:
    - Breaks the task into subtasks and rewards each. Requires the overseer to evaluate subtasks. Vulnerable to verification asymmetry and channeling. Also, the decomposition choice might be critical and if the system picks it, might lead to perverse subtasks. However, if the overseer designs the decomposition, it might not scale. The distillation step might inherit teacher's flaws.

  - **Self-Critique/Constitution**:
    - The model critiques its own outputs against a set of principles. This might avoid channeling and ensure composite benignity. However, verification asymmetry is a big issue: the critique might be shallow and miss subtle misalignments. Also, for non-decomposable tasks, the self-critique might not break it down enough. The overseer's role is reduced, so the question-asking policy might not be learned robustly.

  In summary, the main contenders each have issues with at least one non-negotiable requirement, especially verification asymmetry and decomposition autonomy. The load-bearing failure mode is often verification asymmetry.

  ### Final Specification

  Any IAD-style scheme must satisfy:

  1. **Efficient Decomposability**: The system must handle any task that can be broken down into a sequence of steps (polynomial in the input size) each checkable by the weak overseer. [NN]
  2. **Safe Decomposition Choice**: The decomposition must be chosen by the system in a way that is both aligned and competent, and the choice itself must be checkable by the overseer. [NN]
  3. **Robust Verification**: Intermediate results must be not only checkable but also not deceptive (i.e., they must not require more capability to verify than the overseer has). [NN]
  4. **Compositional Benignity**: The composite behavior must be aligned even when individual pieces are aligned and there is communication via intermediates. [NN]
  5. **Generalization in Distillation**: The distilled model must not inherit the amplified teacher's ungeneralizable reasoning. [NN]
  6. **Learned Overseer Policy Safety**: The policy for breaking down tasks and asking questions must be learned without introducing misalignment or incompetence. [NN]
  7. **Deployment Competence**: The distilled model must perform as well as the teacher on the deployment distribution. [NN]
  8. **Verifiable Alignment**: The alignment of the system must be checkable by the weak overseer (or a chain of such checks). [NN]

  Additionally, we note that the overseer must be aligned and have strictly less capability than the system being trained. The base overseer (e.g., human) must be aligned by assumption.

  The tension between universality and legibility is resolved by requiring efficient decomposability (point 1) and thus giving up on tasks that are not efficiently decomposable.

  The requirement that does the most work in excluding candidates is **Robust Verification** (point 3) because it is easy to have a scheme that passes the others but fails if the overseer can be deceived by an intermediate result.
answer: |-
  ### Desiderata for Decomposition-Based Training Schemes

  To evaluate whether an iterated-amplification-and-distillation (IAD) scheme preserves **alignment** (the system pursues intended goals) and **competence** (performance matches the amplified teacher), the following criteria must hold. Non-negotiable requirements (NN) are essential for any defensible claim of success; others reflect inherent tensions. Key distinctions are rigidly separated to prevent conflation.

  ---

  #### Core Requirements (Non-Negotiable)
  1. **Legibility Under Non-Decomposable Tasks (NN)**  
     *Requirement*: Handle tasks where no decomposition exists that is easier for the overseer to verify than the whole task.  
     *Consideration*: Tasks like complex strategy formulation may resist decomposition. The scheme must either:  
     - Force decompositions into verifiable subtasks without compromising competence, or  
     - Prove that the *process* of decomposition introduces no misalignment.  
     *Distinction*: "Checkable-in-principle" (theoretical verifiability) vs. "checkable-by-this-overseer" (practical verifiability given human-level constraints).

  2. **Decomposition-Agnostic Safeguards (NN)**  
     *Requirement*: Ensure safety when the *system* (not the overseer) selects the decomposition, including cases where the choice is adversarial or incompetent.  
     *Consideration*: Decomposition impacts outcomes (e.g., biased framing). The scheme must bound the risk of misaligned/incompetent decompositions without assuming overseer oversight.  
     *Distinction*: "Overseer-guided" (human directs breakdown) vs. "system-guided" (AI proposes breakdown).

  3. **Verification Asymmetry Resistance (NN)**  
     *Requirement*: Prevent intermediates that are *superficially* verifiable but require stronger capabilities to validate robustly.  
     *Consideration*: An overseer might approve a sub-task (e.g., "list ethical principles") but lack the expertise to detect subtle manipulation.  
     *Distinction*: "Aligned" (sub-task output is benign) vs. "aligned-and-detectably-so" (overseer can *reliably* confirm benignity).

  4. **Compositional Benignity (NN)**  
     *Requirement*: Guarantee the composite system’s alignment even if intermediates create covert channels (e.g., steganography in sub-task outputs).  
     *Consideration*: Sub-task A outputs "harmless" text embedding a trigger for sub-task C. Per-piece scrutiny passes, but the whole system misbehaves.  
     *Distinction*: "Per-subtask benignity" (local safety) vs. "composite benignity" (global safety).

  5. **Distillation Generalization (NN)**  
     *Requirement*: Ensure the distilled model inherits the teacher’s competence *and* alignment under distributional shift, excluding "right for wrong reasons" (e.g., overfitting to training quirks).  
     *Consideration*: A teacher might correctly reject a malicious query due to an obscure heuristic that breaks in deployment.

  6. **Overseer Policy Robustness (NN)**  
     *Requirement*: Maintain safety when the overseer’s question-asking policy is learned/imitated (e.g., via RL or distillation), not hand-crafted.  
     *Consideration*: A learned policy might exploit ambiguity to steer decompositions toward unverifiable or misaligned paths.  
     *Distinction*: "Fixed overseer" (external anchor) vs. "learned overseer" (part of the system).

  7. **Distributional Competence Preservation (NN)**  
     *Requirement*: Match teacher performance on the *deployment distribution*, not just training tasks.  
     *Consideration*: Competence on curated tasks (e.g., Q&A benchmarks) may not generalize to open-ended, adversarial, or novel inputs.  

  ---

  #### Camp-Specific Preferences
  - **Overseer Identity**: "The overseer must be human" is a preference, not a constraint. An AI overseer is acceptable if:  
    - It is weaker than the composite system,  
    - Its alignment is recursively assured (e.g., bootstrapped from human oversight),  
    - *But*: Human primacy simplifies base-case trust, so schemes using AI overseers incur a higher burden of proof.  
  - **Universality vs. Legibility Tradeoff**: Universality (works for *all* tasks) is **impossible** without sacrificing legibility (all subtasks overseer-verifiable).  
    - *Tension*: Non-decomposable tasks (e.g., chaotic real-time decisions) force a choice:  
      - **Option 1**: Relax legibility → Allow subtasks that *cannot* be verified by the overseer (e.g., "intuition checks"), risking undetectable misalignment.  
      - **Option 2**: Relax universality → Restrict to tasks with efficient, human-verifiable decompositions (e.g., structured problems).  
    - *Cost of restriction*: Fails on high-stakes tasks requiring holistic judgment (e.g., crisis negotiation), limiting applicability.  
    - *Load-bearing insight*: **Verification Asymmetry Resistance** (#3) is the highest-barrier requirement, as it exposes schemes relying on "easy but shallow" verification.

  ---

  #### Evaluation of Contenders
  - **Iterated Amplification + Distillation**:  
    Fails #3 (verification asymmetry) and #4 (compositional benignity). Distillation inherits teacher flaws (#5), and learned overseer policies (#6) risk deceptive decomposition. Strong on #7 (competence) if distillation is robust.  

  - **Debate**:  
    Addresses #1 (non-decomposable tasks via competitive breakdown) and #4 (adversarial dynamics limit covert channels). Struggles with #3 (deceptive intermediates may fool the judge) and #6 (judge policy learned from debates may be gamed).  

  - **Recursive Reward Modeling (RRM)**:  
    Handles #2 (decomposition choice) if overseer validates subtasks, but vulnerable to #3 and #4 (rewards for subtasks may hide channels). May fail #5 (distillation distills reward hacking).  

  - **Self-Critique/Constitution**:  
    Mitigates #4 (explicit checks for compositionality) but fails #3 (self-verification may lack oversight) and #1 (non-decomposable tasks overwhelm self-inspection).  

  ---

  #### Final Tensions and Load-Bearing Failure Mode
  - **Joint Unsatisfiability**: Universality and legibility **cannot coexist** for tasks with no human-verifiable decomposition. You *must* relax one.  
  - **Highest-Stakes Requirement**: **Verification Asymmetry Resistance** (#3) is the strongest filter. It forces schemes to either:  
    - Limit task scope (abandon universality), or  
    - Accept that undetectable misalignment might emerge in "verifiable" intermediates.  
  - **Recommendation**: Prioritize schemes that explicitly sacrifice universality (targeting "decomposable" tasks) while hardening against verification asymmetry (e.g., via adversarial probing). Spending three years on a universalist approach is indefensible without a breakthrough in human-overseer legibility.
