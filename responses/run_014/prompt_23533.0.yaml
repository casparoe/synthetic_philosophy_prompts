answer: |-
  You've hit on a core philosophical debate! While pragmatic encroachment (PE) and epistemic contextualism (EC) *both* explain why "S knows that p" can be true in low-stakes contexts and false in high-stakes contexts despite identical evidence, they are **fundamentally distinct theories** locating the source of variation in different places. Your worry about collapse is understandable, but the distinction is crucial. Here's the breakdown:

  1.  **Locus of Variation:**
      *   **Pragmatic Encroachment (PE):** The variation is in **the knowledge relation itself.** What it *takes* for S's true belief to constitute knowledge changes based on *the subject's practical stakes* (S's context). Knowledge is **stake-sensitive.**
          *   *Mechanism:* Practical factors (stakes, costs of error) directly alter the **epistemic standards S must meet** to count as knowing. Higher stakes raise the justificatory threshold S must clear (e.g., requiring more evidence, higher reliability, ruling out more alternatives).
          *   *Result:* In High-Stakes Hannah's context, her evidence *is insufficient for knowledge* given her high practical stakes. In Low-Stakes Hannah's context, the *same evidence is sufficient for knowledge* given her low stakes. **Hannah's epistemic state literally differs between the two cases.**
      *   **Epistemic Contextualism (EC):** The variation is in **the meaning/semantics of the word "knows."** The *truth-conditions* of the knowledge *attribution* "S knows that p" change based on *the attributor's conversational context* (the speaker's/listener's context).
          *   *Mechanism:* The word "knows" is context-sensitive, like "tall" or "flat." The conversational context (often driven by salient error possibilities, perceived stakes, or conversational goals) sets the **semantic standards for what counts as "knowing"** in that conversation.
          *   *Result:* When *we* (in a low-stakes context) say "Hannah knows the bank is open," our word "knows" expresses a low-standard concept, and our statement is true. When *High-Stakes Hannah* (or someone empathizing with her high-stakes context) says "Hannah doesn't know the bank is open," their word "knows" expresses a high-standard concept, and *their* statement is also true. **Hannah's underlying epistemic state is fixed; it's the meaning of "knows" that shifts.**

  2.  **What Explains the Shift?**
      *   **PE:** Changes in the *subject's* practical situation.
      *   **EC:** Changes in the *speaker's/attributor's* conversational context.

  3.  **Implications for Disagreement:**
      *   **PE:** If Low-Stakes Attributor says "Hannah knows" and High-Stakes Attributor says "Hannah doesn't know," **one of them is simply mistaken** (assuming they are both referring to Hannah's fixed epistemic state at a given time). High-Stakes Attributor is likely over-projecting their own high standards.
      *   **EC:** Both attributors can be speaking *truly* relative to their own conversational contexts. There is no substantive disagreement about Hannah's fixed epistemic state; they are just using "knows" with different meanings. This is often called **"merely verbal" disagreement.**

  4.  **Metaphysical Commitment:**
      *   **PE:** Commits to the idea that **knowledge itself is not a purely epistemic relation.** Practical factors are genuinely part of what *constitutes* knowledge. This challenges traditional "purist" or "intellectualist" epistemology.
      *   **EC:** Preserves the idea that the underlying epistemic relation (justified true belief meeting some invariant threshold? – though EC itself doesn't specify the invariant base) is purely epistemic. **Only the *linguistic expression* of that relation is context-sensitive.** Traditional purism about the *state* can be maintained.

  **Why Your Worry is Understandable but Doesn't Hold:**

  *   **Surface Similarity:** Both predict the *same pattern of truth-value assignments* to knowledge claims across different contexts. If you only look at *whether* "S knows p" is true/false in different scenarios, PE and EC often yield the same verdicts.
  *   **Difference Underneath:** The *reason* for those verdicts is radically different. PE says Hannah's knowledge *gained or lost* a property due to her stakes. EC says the *word* "knows" *changed its meaning* depending on who is talking. This difference has profound consequences for the nature of knowledge, disagreement, and the autonomy of epistemology.

  **Analogy:**

  *   Imagine two theories explaining why a room is described as "warm" in winter and "cool" in summer:
      *   **Theory 1 (PE-like):** The *actual temperature of the room* changes significantly with the season. The room *is* warm in winter and cool in summer.
      *   **Theory 2 (EC-like):** The room's temperature is relatively *constant* year-round (say, 70°F). The *meaning of "warm" and "cool"* shifts based on the outside temperature. "Warm" means "warmer than outside" (so 70°F is "warm" when it's 20°F outside). "Cool" means "cooler than outside" (so 70°F is "cool" when it's 95°F outside).

  Both theories explain why we call the room "warm" in winter and "cool" in summer, but they posit fundamentally different mechanisms: one changes the room's state, the other changes the language used to describe it.

  **Conclusion:**

  You are **not** missing a trick; the views are genuinely distinct. Pragmatic Encroachment locates the stakes-sensitivity **in the nature of knowledge itself**, making it subject-sensitive. Epistemic Contextualism locates the stakes-sensitivity **in the semantics of the word 'knows'**, making it attributor-sensitive. The debate between them is about the *metaphysics of knowledge* (PE) versus the *semantics of knowledge attributions* (EC). They are rival explanations for the same linguistic phenomenon, not two ways of saying the same thing. Recognizing this distinction is crucial for understanding the broader landscape of contemporary epistemology.
