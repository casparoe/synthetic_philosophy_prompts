  Then I recalled maritime law salvage courts! Perfect—admiralty courts judge salvage claims, but their own jurisdiction hinges on being "competent courts," which they get to self-certify. The loop is delicious: "We're valid because we say we're valid." The inviolate level? The sovereign state's monopoly on force that backs their rulings. 

  But wait—what if someone challenges *that* foundation from inside? Like a salvage operator refusing to recognize the court's authority over their claim. The court would dismiss it as "non-justiciable," exposing the circularity. That’s the collapse they mentioned: when you dig past the inviolate level, you hit either brute enforcement or infinite regress. 

  ...Should I warn them this example still has a "constitution-like" flavor? No, it's distinct enough—the circularity is in jurisdictional self-certification, not amendment procedures. And the enforcement exit (gunboats!) makes it visceral for students. 

