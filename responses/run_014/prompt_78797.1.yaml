answer: |-
  Here’s a concrete institutional example: **The High Court of Admiralty determining its own jurisdictional competence in salvage cases.**

  ### The Mechanism:
  1. **The Rule**: Under maritime law, only a "competent court" may adjudicate salvage claims (where rescuers claim compensation for saving ships/cargo).  
  2. **The Self-Reference**: The High Court of Admiralty (HCA) decides what constitutes a "competent court" for salvage cases.  
  3. **The Loop**: When a party challenges the HCA’s jurisdiction over a salvage case, the HCA itself rules on whether it is competent. Its judgment relies on its *own* interpretation of maritime law—the very rules granting it authority.  

  ### The Levels:
  - **The Self-Supporting Loop**: The HCA applies its rules to validate its authority ("We are competent because our rules say we decide competence").  
  - **The Inviolate Level**: The sovereign state’s **monopoly on force** and **territorial control**. The HCA’s rulings are enforced because the state backs them with police/navy power. This foundation isn’t justified by maritime law; it’s imposed externally.  

  ### What Happens When the Inviolate Level is Challenged *from Within*?  
  Suppose a salvage operator, Jones, argues:  
  *"This court isn’t competent! Its authority rests solely on its own say-so, which is circular. Prove your jurisdiction without presupposing it."*  
  The HCA responds:  
  - It cites statutes and precedents (its internal rules) to assert competence.  
  - If Jones persists, the court charges him with contempt—using state-backed coercion (e.g., fines, imprisonment).  

  **Result**: The system "collapses" into its inviolate foundation. The HCA cannot *legally* justify the state’s monopoly on force using maritime law; it simply enacts it. The loop depends on an unquestioned power exterior to the rules.  

  ### Why This Meets Your Request:  
  - **No Self-Contained Justification**: The rules cannot validate the enforcement mechanism that sustains them.  
  - **Collapse Under Scrutiny**: Insisting on internal justification exposes the inviolate level (state violence) as the ungrounded foundation. The circle is broken by force, not logic.  
  - **Distinction Preservation**: The loop (self-referential competence) and the inviolate level (state power) remain distinct. The latter is *empirically* inescapable but *conceptually* external.  

  ### Key Insight:  
  This arrangement is **operationally stable** only while participants accept the inviolate level. When challenged, the system defaults to coercion, revealing that self-reference alone is insufficient. The rules are authoritative not because they are self-consistent, but because they are enforced by an unexamined power.  

  > "The court’s authority isn’t in the rules; it’s in the guns outside the courthouse."  

  This example avoids your excluded cases while demonstrating how self-referential systems mask their reliance on exogenous enforcement. For your lecture, you could sketch this as a literal loop (court → rules → competence → court) anchored to a bedrock labeled "state violence."
