prompt: |-
  I recently committed to giving a fixed share of my income to whatever I judge to be the most effective charities, and the arguments I have had since then keep sliding between three different kinds of complaint without anyone noticing: that my picture of the good is wrong, that my picture of what I owe others is wrong, and that my picture of what I can actually know is wrong. I would like a decision tree for my reading group that sorts the critiques of effective altruism along those lines, so that we stop talking past each other. Every branch node should be a question we can answer without already knowing which critique it leads to, and the first fork should be the one I just described. Underneath it, split as the arguments actually require: on the epistemic side, separate the complaint that we measure the wrong things from the complaint that only measurable things get funded in the first place; on the practical side, separate the attack on earning to give from the attack on the movement's professionalised institutions, and within the first of those separate the objection that a donor's labour is replaceable from the objection about what the donated money ends up funding; on the political side, separate the claim that private giving displaces public provision from the claim that the movement's funding structure quietly decides which questions get researched. Build the tree from the space of answers rather than from a list of critics, and locate the named positions in it afterwards. Leaves should include at least the measurability-bias critique, the institutional critique, the earning-to-give critique, and the displacement critique, each with one sentence on the commitment its defender will find hardest to live with. Flag any pair of leaves the tree cannot separate, note any combination of answers that nobody occupies and whether that is because the view is incoherent, unattractive, or merely unexplored, and say which single answer, if someone gave it, would make the rest of the tree moot. Aim for six to eight leaves. My group can follow the arguments but has not read the primary literature carefully, so keep the nodes in plain language and do not lean on the names of authors or works.
reasoning: |-
  Okay, the user wants a decision tree to sort critiques of effective altruism into three main types: views of the good, what we owe others, and what we can know. They mentioned specific branches like measurability bias and institutional critique. Let me start by outlining the three initial forks.

  First, I need to ensure the tree starts with the three complaints they mentioned. Then, under each, branch out as specified. For epistemic critiques, split into measuring wrong things vs. only funding measurable things. For practical critiques (what we owe), separate earning-to-give from institutional critiques, and further break down earning-to-give into labor replaceability and funding issues. For political critiques, separate displacement from funding influence on research.

  The user wants leaves to include at least measurability bias, institutional critique, earning-to-give critique, and displacement critique. Each leaf needs a sentence on the hardest commitment. Also, flag any inseparable leaves, note unoccupied combinations, and identify a key answer that could moot the tree.

  I should check if any critiques overlap or can't be separated. For example, the measurability bias and funding influence critiques both deal with measurement but focus on different aspects. They can be separate leaves. The institutional critique might overlap with displacement, but the tree can separate them based on whether the complaint is about private vs. public or NGO structures.

  Unoccupied combinations: Someone who thinks we owe others a lot but can't know what's good might be incoherent because if you can't measure, how do you act? But maybe they'd advocate for different actions, like systemic change without measurable outcomes. That might be unattractive or unexplored.

  The key answer that moots the tree: If someone believes we don't owe others anything beyond minimal duties, then critiques about measurement or political issues become irrelevant. That's the "No" answer to the first question.

  Now, structuring the decision tree clearly. Use plain language for nodes. Start with the first question: "What’s the core complaint?" with three options. Then branch each into sub-questions. For example, under epistemic, ask about measurement focus vs. what gets funded. Under practical, split earning-to-give and institutional, then further under earning-to-give.

  Ensure each leaf has a concise hardest commitment. For instance, measurability bias's hardest commitment is accepting that some real needs won't be addressed because they can't be measured.

  Finally, note that displacement and funding influence critiques might both apply but are separable in the tree. The unoccupied combination is denying we owe much but accepting we can know what's good—this might lead to minimal giving, but it's unattractive as it ignores suffering. The key answer is rejecting that we owe much to others.
answer: |-
  Here’s a decision tree designed to clarify critiques of Effective Altruism (EA) based on your three core disputes. It prioritizes conceptual alignment over naming critics, uses plain language, and includes your requested structure and annotations.

  ---

  ### **Decision Tree: Critiques of Effective Altruism**
  **Start Here:**  
  **Q1: What’s the core complaint?**  
  - **A: "Your idea of 'doing good' is flawed."** → Go to **POLITICAL** branch  
  - **B: "You misunderstand what we owe to others."** → Go to **PRACTICAL** branch  
  - **C: "You overestimate what we can know about impact."** → Go to **EPISTEMIC** branch  

  ---

  #### **EPISTEMIC BRANCH** (C: Knowledge Limits)  
  **Q2: Is the problem that EA focuses too much on measurement?**  
  - **A: Yes, and it measures the *wrong things* (e.g., ignores hard-to-quantify values like justice or dignity).** → **Leaf 1: The Narrow Metrics Critique**  
    *Hardest commitment:* Accepting that some "effective" interventions might undermine unmeasurable moral goods.  
  - **B: Yes, but the deeper issue is that *only measurable problems get funded*, ignoring critical but complex needs.** → **Leaf 2: The Measurability-Bias Critique**  
    *Hardest commitment:* Tolerating that urgent, unquantifiable suffering (e.g., trauma care, systemic oppression) may be neglected.  

  ---

  #### **PRACTICAL BRANCH** (B: What We Owe Others)  
  **Q3: Is the complaint about how EA channels resources?**  
  - **A: Yes, specifically about encouraging "earning to give."** → Go to **Q4**  
  - **B: No, it’s about EA’s *institutions* (e.g., charity evaluators, foundations).** → **Leaf 3: The Institutional Critique**  
    *Hardest commitment:* Accepting that professionalized EA may replicate power imbalances (e.g., elite-driven agendas) despite its mission.  

  **Q4 (For "earning to give"): What’s the primary concern?**  
  - **A: "Donors’ careers often fund harm (e.g., finance/tech) that outweighs donations."** → **Leaf 4: The Funding-Source Critique**  
    *Hardest commitment:* Acknowledging that ethical careers might reduce donation potential.  
  - **B: "Individual donations are futile—one person’s money just replaces another’s."** → **Leaf 5: The Labor-Replaceability Critique**  
    *Hardest commitment:* Conceding that personal giving may not add net good if others fill the funding gap.  

  ---

  #### **POLITICAL BRANCH** (A: Flawed Idea of Good)  
  **Q5: Does EA’s approach risk undermining broader change?**  
  - **A: Yes, by replacing public responsibility with private charity.** → **Leaf 6: The Displacement Critique**  
    *Hardest commitment:* Rejecting short-term aid (e.g., malaria nets) if it weakens pressure for state-led solutions.  
  - **B: No, the issue is how EA *steers priorities* through its funding.** → **Leaf 7: The Funding-Influence Critique**  
    *Hardest commitment:* Accepting that EA’s resources may silence alternative visions of progress (e.g., decolonial approaches).  

  ---

  ### **Key Annotations**  
  1. **Inseparable Leaves:**  
     - **Leaf 2 (Measurability-Bias)** and **Leaf 7 (Funding-Influence)** often overlap. Critics argue measurability bias *enables* funders to dictate priorities. The tree separates them by focus: Leaf 2 targets *knowledge gaps*, Leaf 7 targets *power dynamics*.  
     
  2. **Unoccupied Combination:**  
     - **"We owe little to others (B→No) + We can know what’s good (C→Yes)."**  
       - *Why vacant?* Logically coherent but unattractive: If we *can* identify great needs but reject obligations to address them, it implies indifference to suffering. No major critique occupies this space.  

  3. **Tree-Mooting Answer:**  
     - If someone answers **"We owe almost nothing to others"** (B→No at Q1), most critiques dissolve. EA’s entire project assumes significant obligation to strangers.  

  ---

  ### **Summary of Leaves**
  | Leaf | Critique                          | Hardest Commitment for Defenders |  
  |------|-----------------------------------|----------------------------------|  
  | 1    | Narrow Metrics                    | Trading quantifiable gains for intangible moral costs. |  
  | 2    | **Measurability-Bias**            | Ignoring unmeasurable crises because they can’t be "proven" effective. |  
  | 3    | **Institutional Critique**        | Tolerating centralized power to pursue "evidence-based" goals. |  
  | 4    | Funding-Source (Earning-to-Give)  | Sacrificing career ethics for donation volume. |  
  | 5    | Labor-Replaceability              | Admitting your donation may not add new resources. |  
  | 6    | **Displacement Critique**         | Opposing lifesaving aid if it distracts from systemic change. |  
  | 7    | Funding-Influence                 | Letting resource holders define "effectiveness" for everyone. |  

  ---

  ### **How to Use**  
  - **In your group:** Start each critique by assigning it to a branch via **Q1**. Move down the tree collaboratively.  
  - **For named positions:**  
    - "Moral Corruption" (e.g., Timnit Gebru) → **Leaf 4** or **Leaf 7**  
    - "Longtermism as biased" (e.g., David Runciman) → **Leaf 2** or **Leaf 7**  
    - "EA as neoliberal" (e.g., Adrienne Buller) → **Leaf 3** or **Leaf 6**  
    - "Replaceability" (e.g., early Will MacAskill) → **Leaf 5**  
  - **Goal:** If two people debate Leaf 2 vs. Leaf 7, they now know one disputes *knowledge* (epistemic), the other *power* (political).
