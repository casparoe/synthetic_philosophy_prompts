  Empirical aspects (b) exist too. Reductionists cite deception prevalence, needing checks. Anti-reductionists reference psychological studies on default trust. But these empirical points serve their methodological goals rather than being the core conflict.

  The deeper issue might be epistemological starting points. Reductionists prioritize individualistic justification, while anti-reductionists see social testimony as fundamental. This isn't just methodology; it's a substantive divide in what knowledge is. So perhaps (d) a substantive metaepistemological disagreement.

  Progress might involve clarifying terms or adopting dual frameworks. But since each side values different epistemic goals, resolution could be impossible. Instead, recognizing the complementary roles: default trust with context-sensitive vigilance. Or shifting focus to criteria for appropriate trust rather than universal rules.

