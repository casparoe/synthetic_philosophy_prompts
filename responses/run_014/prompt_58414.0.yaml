prompt: |-
  So me and my partner just took over her dads tiny farm in Ohio, six outdoor trout raceways and four indoor shrimp tanks, and I somehow got voluntold to be the welfare guy even though my background is auto repair not fish.

  I need something I can actually run every morning before feeding, like a decision procedure or checklist that turns all that fish and shrimp sentience and welfare stuff into steps a non-expert can follow. It should tell me what to check in what order, what counts as good enough to move on, when to stop with a straight no this is not okay, and when to kick it up to the vet or to us as owners becuase its really a values call not a facts call.

  Some constraints: I have like 15-20 minutes per raceway or tank max, mornings are chaos, my crew is me plus two part timers with zero biology training, our vet only comes once a month to sign off unless theres an emergency, and the stakes are dead or stressed animals plus losing money if we get it wrong.

  Can you build that for trout and for whiteleg shrimp seperately where they differ, keep what actually matters for welfare but drop the super technical stuff we cant measure, and be honest about where the checklist will misfire or need human judgment.

  Then run it on three real calls I am facing right now:

  1. crowding trout tight in a grading net for 5-6 hours becuase we are short staffed, they go off feed for a day after but it saves us hiring extra help
  2. our electric stunner broke and the replacement is 3 weeks out, so going back to ice slurry for harvest in the meantime
  3. keeping berried shrimp females in bare bright tanks with lights on 24/7 to push more larvae, we get more babies but the females lose antennae and die younger

  Include at least one where the procedure tells me something I am not gonna like, like I have to spend money or stop doing the easy thing, and end with what the procedure cannot do no matter how good it is.
reasoning: |-
  Okay, the user has taken over a small trout and shrimp farm in Ohio and needs a practical welfare checklist. They have no biology background, just auto repair experience. Mornings are chaotic, with limited time and staff. The key constraints are 15-20 minutes per raceway/tank, untrained part-timers, monthly vet visits, and financial risks if welfare fails.

  Hmm, the user needs two separate but parallel checklists - one for trout raceways, one for shrimp tanks. Must convert abstract welfare concepts into concrete steps. Critical to flag "stop now" red flags versus "consult vet/owner" judgment calls. Should acknowledge where the checklist has limitations.

  For trout, the core welfare pillars seem to be oxygen, crowding, water flow, visible stress signs, and feeding behavior. For shrimp, it's more about water quality parameters, hiding spots, physical damage, and breeding stress. Need to avoid technical measurements they can't do - e.g., no ammonia tests if they lack kits.

  The three real scenarios are tricky:
  1. Trout crowding during grading - checklist should flag the prolonged stress and feeding disruption as unacceptable despite staffing issues. 
  2. Switching to ice slurry without stunner - this needs immediate vet consultation because poor sedation causes suffering. 
  3. Overstressing berried shrimp - the checklist would catch the antenna loss and mortality as systemic welfare failures requiring system redesign.

  Important to emphasize that the checklist can't replace veterinary expertise or fix underlying resource constraints. The "stop now" triggers must be unambiguous - like gasping fish or shrimp corpses. Also should note that some money/time investments are non-negotiable for welfare.

  For the berried shrimp example, the user won't like hearing they need to invest in dark refuges and reduce light cycles - but the antenna damage proves current practice is unsustainable. The procedure's biggest gap is missing slow-building problems like disease or chronic stress without water testing.

  Final output should sound like a field manual: action-oriented, bulletproof against untrained staff, with clear escalation paths. No jargon. Acknowledge that sometimes the right call hurts profitability - that's the "values call" ownership must face.
answer: |-
  Here's a practical, morning-routine welfare checklist designed for your constraints, followed by analysis of your three scenarios. It prioritizes observable signs, critical "stop now" triggers, and clear escalation paths.

  **Core Principles for Both Systems:**
  1.  **Observe BEFORE Acting:** Look at the animals first thing.
  2.  **"Stop Now" Overrides Everything:** If you see these, halt feeding/routine and act immediately.
  3.  **"Consult" Means Pause & Call:** Vet for medical/technical, Owners for cost/ethics decisions.
  4.  **"Good Enough" is Baseline Welfare:** If baseline isn't met, don't move on until fixed or escalated.
  5.  **Time Budget:** Target 10-15 mins per unit. Focus on critical signs.

  ---

  **Trout Raceway Morning Welfare Checklist (Per Raceway - 15 Min Max)**

  1.  **Water Flow & Surface (VISUAL - 30 sec):**
      *   **Check:** Water visibly moving? Surface agitated? No dead fish/foam/scum piles?
      *   **Good Enough:** Yes to flow & agitation. Minor debris ok if moving.
      *   **Stop Now:** *Stagnant water, gasping fish at surface, large piles of dead fish.* **ACTION:** Check pump/inlet immediately! Aerate if possible. Remove dead fish. Call Vet/Owner if cause unknown or widespread.
      *   **Consult:** Consistent minor foam/scum (possible organics/biofilm buildup). Many fish hanging listlessly near inflow (possible oxygen stress).

  2.  **Fish Behavior (VISUAL - 2 min):**
      *   **Check:** Majority swimming normally? No frantic darting/spinning? Gills moving steadily? Not piled up/crowded in corners? No visible sores/fungus/parasites (white spots, cottony tufts)?
      *   **Good Enough:** >90% normal swimming, steady gill movement, even distribution.
      *   **Stop Now:** *Fish gasping at surface, piping (sucking air), frantic erratic swimming, flashing (rubbing), piled tightly in corners/inflow, obvious fungus/ulcers/parasites on multiple fish.* **ACTION:** Check oxygen immediately (test kit if available, or assume low). Assess crowding. Call Vet urgently.
      *   **Consult:** <10% lethargic, minor fin damage, a few isolated sores. Uneven distribution but not piled.

  3.  **Mortality Check (PHYSICAL - 5 min):**
      *   **Check:** Walk raceway perimeter/scoop net. Count & remove dead/critically ill fish (listless, spinning, fungus-covered). Note approximate number/size/location.
      *   **Good Enough:** <0.1% dead (e.g., 1 dead in 1000 fish). No more than 2-3 obviously dying.
      *   **Stop Now:** *Sudden spike in mortality (>0.5% dead or >10 visibly dying).* **ACTION:** Preserve samples (fresh dead/ailing fish in clean bag on ice). Call Vet IMMEDIATELY.
      *   **Consult:** Slow creep in mortality (e.g., 0.2% consistently), unusual location of dead fish.

  4.  **Feed Response (OBSERVATION during feeding - 5 min):**
      *   **Check:** During first feeding, observe: Do fish actively swim to feed? Aggressive feeding? Do most get some feed? Any feed left uneaten after 5 mins?
      *   **Good Enough:** Aggressive feeding, minimal leftovers (<5%).
      *   **Stop Now:** *No feeding response, fish ignore food.* **ACTION:** Stop feeding. Re-check Steps 1-3 urgently. Call Vet/Owner. Do NOT keep feeding.
      *   **Consult:** Sluggish feeding, >10% leftover feed. Minor avoidance of feed in one area.

  **Escalation Summary - Trout:**
  *   **STOP NOW -> ACTION:** Immediate intervention (O2, aeration, stop feed, remove dead, isolate if possible), then **CALL VET**.
  *   **CONSULT VET:** Signs of disease (sores, parasites, flashing), unexplained mortality spike, persistent poor feeding, water quality issues (if test kits show problems).
  *   **CONSULT OWNERS:** Crowding decisions, handling procedures, equipment failures impacting welfare, cost-benefit of interventions flagged by checklist/vet.

  ---

  **Shrimp Tank Morning Welfare Checklist (Per Tank - 10 Min Max)**

  1.  **Water Clarity & Surface (VISUAL - 30 sec):**
      *   **Check:** Water reasonably clear (can see bottom/sides)? No excessive foam/bubbles/scum on surface? No strong foul odor? No dead shrimp floating/sinking?
      *   **Good Enough:** Water clear enough to see structures/shrimp movement. Minimal surface film/foam. No foul smell.
      *   **Stop Now:** *Milky/cloudy water, thick foam/scum, strong rotten egg/sewage smell, multiple dead shrimp visible.* **ACTION:** Check filters/aeration immediately. Test Ammonia/Nitrite if kits available (CRITICAL). Call Vet urgently. Prepare for partial water change.
      *   **Consult:** Slight haze, minor stable foam, 1-2 dead shrimp.

  2.  **Shrimp Behavior & Distribution (VISUAL - 2 min):**
      *   **Check:** Shrimp moving normally (walking, grazing, swimming)? Not lethargic/clumped? Not swimming erratically/near surface? Berried females present? Check hiding structures (if any) - shrimp using them? Look for visible issues: white spots, black gills, damaged/missing antennae/appendages, opaque/milky bodies?
      *   **Good Enough:** Majority active and distributed. Berried females look normal (eggs intact, not dropping). Minimal visible physical damage (<5% with minor issues).
      *   **Stop Now:** *Many shrimp lethargic/clumped, swimming erratically/near surface, berried females dropping eggs, numerous shrimp with milky bodies, severe black gills, multiple missing antennae/appendages.* **ACTION:** Preserve samples (ailing shrimp). Test water parameters (Ammonia/Nitrite/pH - VITAL). Call Vet IMMEDIATELY.
      *   **Consult:** Some lethargy, a few shrimp with physical damage (e.g., one antenna missing), minor clumping.

  3.  **Mortality & Molts Check (PHYSICAL - 5 min):**
      *   **Check:** Remove dead shrimp (count). Check for dead molts (should be present, but not excessive piles). Note condition of dead shrimp (intact? milky?).
      *   **Good Enough:** <0.5% dead shrimp (e.g., 1 dead in 200). Normal molt shells present.
      *   **Stop Now:** *Sudden spike in mortality (>1%), dead shrimp are milky/opaque or have black gills, piles of uneaten molts.* **ACTION:** Preserve samples. Test Ammonia/Nitrite/pH URGENTLY. Call Vet IMMEDIATELY.
      *   **Consult:** Slow creep in mortality, dead shrimp appear intact/normal, excessive molt piles.

  4.  **Feed Check (VISUAL - 2 min):**
      *   **Check:** Is leftover feed from yesterday present? (Check feeding trays/floor). Is it moldy?
      *   **Good Enough:** Minimal/no leftover feed. No mold.
      *   **Stop Now:** *Large amounts of moldy leftover feed.* **ACTION:** Remove moldy feed immediately. Reduce today's ration. Assess feeding amount/schedule.
      *   **Consult:** Some leftover feed (not moldy). Adjust feeding down slightly.

  **Escalation Summary - Shrimp:**
  *   **STOP NOW -> ACTION:** Immediate water test (Ammonia/Nitrite/pH is NON-NEGOTIABLE - get test kits!), partial water change if params bad, stop feeding if needed, preserve samples, **CALL VET**.
  *   **CONSULT VET:** Signs of disease (milky shrimp, black gills, Vibrio risk), water parameter issues, unexplained mortality spike, molting problems.
  *   **CONSULT OWNERS:** Lighting schedules, tank decoration/hiding needs, breeding protocols (berried female handling), cost-benefit of interventions flagged by checklist/vet.

  ---

  **Analysis of Your Current Scenarios:**

  1.  **Crowding Trout in Grading Net for 5-6 Hours:**
      *   **Checklist Triggers (During/After):** During crowding: Violates "Fish Behavior" (piled tightly, stress). After: Violates "Feed Response" (off feed for a day). Mortality likely increases slightly ("Mortality Check" - Consult/Owner).
      *   **Checklist Says:** **STOP NOW** during the procedure due to visible stress/piling. **CONSULT OWNERS** immediately afterward due to the clear negative welfare impact (stress, off feed) - the checklist flags this as unacceptable baseline welfare failure. The "saves hiring" is an Owner values/cost decision, but the procedure identifies a welfare problem.
      *   **What You Won't Like:** The checklist forces you to acknowledge this practice causes measurable harm (stress, feeding disruption). You *must* either find a faster way (different net, smaller batches), hire help, or accept lower welfare standards (an Owner decision, not a "facts call"). The procedure misfires if stress isn't *visibly* extreme during crowding, but the off-feed afterward is a clear red flag.

  2.  **Electric Stunner Broken - Using Ice Slurry:**
      *   **Checklist Triggers (During Harvest):** This happens *during* harvest, not the morning check. However, the procedure relies on humane stunning/killing *as a core requirement*. Ice slurry is unreliable for consistent, immediate stunning/unconsciousness in trout. Shrimp may be stunned more effectively by ice alone.
      *   **Checklist Says (Implication):** Harvest method is outside the *morning* checklist scope. **BUT** - Humane harvest is fundamental welfare. The checklist assumes a reliable method is in place. Using an unreliable method (ice slurry for trout) is a major welfare risk.
      *   **Action Required:** **CONSULT VET URGENTLY.** Discuss the risks of ice slurry for trout. Vet may advise on best-practice ice slurry methods (temperature, salinity, density, observation for signs of consciousness - which *is* technical) or recommend finding a backup stunner (rental? local network?). For shrimp, ice slurry is often acceptable if done correctly. **This is a critical welfare gap the morning checklist doesn't cover directly but relies on.** You *must* address this separately.

  3.  **Berried Shrimp in Bare Bright Tanks 24/7:**
      *   **Checklist Triggers:**
          *   "Shrimp Behavior": Females losing antennae (physical damage) - **Stop Now / Consult Vet** (indicates stress, aggression, lack of refuge).
          *   "Mortality Check": Females dying younger - **Consult Vet/Owners** (reduced lifespan = welfare issue).
          *   "Shrimp Behavior": Constant bright light 24/7 - **Consult Owners** (highly unnatural, likely chronic stressor - checklists struggle to quantify chronic stress easily).
      *   **Checklist Says:** This setup is actively causing harm (antenna loss, premature death) and likely chronic stress. **CONSULT OWNERS IMMEDIATELY.** The increased larvae production comes at a direct, measurable cost to female welfare.
      *   **What You Won't Like:** The checklist forces a trade-off. You *must* provide dark refuges (add structures/sections) and implement a diurnal light cycle (e.g., 12h light/12h dark) to meet baseline welfare. This might slightly reduce larvae output but is essential to stop the physical damage and premature death. The "bare bright 24/7" method fails the welfare check.

  ---

  **What the Welfare Procedure CANNOT Do (No Matter How Good):**

  1.  **Replace Veterinary Expertise:** It flags problems ("Something's wrong!"), but cannot diagnose specific diseases, interpret complex water tests beyond basics, or prescribe treatments. "Consult Vet" is essential.
  2.  **Detect Slow-Onset or Subclinical Issues:** It's great for acute problems (O2 crash, ammonia spike) and visible signs. It won't reliably catch low-level chronic stress, early-stage diseases before symptoms show, or subtle nutritional deficiencies. Regular vet visits and occasional water testing are still needed.
  3.  **Override Resource Constraints:** It tells you *what* needs fixing for welfare, but it can't magically create time, money, or staff. You still have to make hard choices as owners, but the checklist makes the welfare cost of those choices explicit ("If we do X, checklist flags Y as a welfare fail").
  4.  **Ensure Perfect Implementation:** Untrained staff might miss subtle signs, rush through checks, or misidentify problems. Training and supervision are crucial.
  5.  **Account for Individual Variation:** It focuses on population-level signs. One sick fish/shrimp might be missed if the rest look ok, though mortality check helps.
  6.  **Handle Truly Novel Situations:** If something completely unexpected happens (e.g., toxic spill, novel disease), the checklist provides a *framework* (observe, stop if bad, escalate) but no specific answers. Judgment calls are critical.

  **Final Tip:** Laminate these checklists. Train your part-timers *thoroughly* on the "Stop Now" criteria and the importance of reporting anything weird, even if they don't understand it. Empower them to stop feeding or call you if they see a "Stop Now" sign. The 15-20 minutes is an investment that prevents catastrophic losses and ethical issues. Good luck!
