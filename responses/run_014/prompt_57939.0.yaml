answer: |-
  The salt-scoured viewport framed a world of quiet riot. Vellos. After 140 years of star-streaked black, its ochre continents and pale, shallow seas pulsed with a life Elara Vance had only known in the *Aevum*’s archives. Below, intricate fractal patterns sprawled across tidal flats – microbial mats, billions of years old, breathing methane, exhaling complex sulphurs, weaving mineral lattices in the anoxic shallows. They cycled carbon with ancient, indifferent efficiency. Beautiful. Utterly alien. And utterly devoid of anything resembling a nervous system.

  Elara’s gloved fingers hovered over the final certification panel. ‘Biosphere: Non-Sentient. Pre-Cambrian Analog. Sterilization Impact: Total (Terraforming Scenario).’ Her thumbprint would unlock the protocols. Or condemn her crew – her family – to the groaning metal womb of the dying *Aevum*.

  They hadn’t chosen this. None of them. Conceived in transit, raised on recycled air and the fading dream of Earth, contact lost decades before their grandparents were born. The *Aevum* was failing. Hydroponics faltered, atmosphere scrubbers wheezed, the hull sang stress fractures in solar winds. Vellos offered breathable air *potential*, buried in its rocks, waiting for the catalyst only the terraforming release could provide. Oxygenation. A world for human lungs in a generation. But the price was etched into the spectral analysis: ultraviolet bombardment and oxygen toxicity would scour these intricate, living tapestries from the shallows. Irreplaceable. Unique.

  The ship’s charter, drilled into them since childhood, echoed in the quiet hum of the survey pod. *Principle Three: Secure a self-sustaining human presence beyond Earth, safeguarding the species against existential risk.* The unspoken end of Earth’s thread hung heavy. And *Principle Seven: Preserve alien biospheres where found; do not supplant existing life with our own.* Two absolute imperatives, now on a collision course over bacterial carpets.

  "Certification complete, Vance?" Captain Rostova’s voice crackled in her ear, strained but controlled. The council awaited her verdict.

  "Scanning the final quadrant, Captain." Elara stalled, tracing the vibrant, rust-and-emerald swirls on her screen. Life. Non-sentient, yes. Unfeeling, certainly. But wasn't it the *first* principle? The foundation upon which sentience, pain, joy – all the complexities Earth life wrestled with – had eventually built? To erase it felt like burning the sole surviving copy of an epic poem written in an unknown, beautiful script, simply because its alphabet didn’t match yours.

  Back in the *Aevum*'s council chamber, the recycled air tasted of metal and tension. Rostova sat at the head, flanked by the chief engineer, Yakov, whose face mirrored the ship’s fatigue lines, and Anya, the bioethicist whose calm voice belied fierce conviction.

  "The mats are intricate," Elara began, her holographic display casting the vibrant patterns onto the worn table. "Carbon cycling is stable, complex. They possess remarkable resilience within their niche. But no neural analogues, no response beyond basic chemotaxis. They do not suffer." She forced the last words out. It was truth, but it felt like betrayal.

  "Then Principle Seven is satisfied," Yakov stated, leaning forward, palms flat. "Preservation applies to *sentient* life, surely? These are… geological art. Beautiful, yes, but *expendable* art when weighed against human survival. The ship *cannot* last another fifty years, Elara. Our children will inherit failing systems, dwindling resources, constant peril. Terraforming offers them air, space, soil we can adapt. A *future*. Principle Three demands it." His eyes pleaded. He had twins in the creche.

  Anya shook her head slowly. "Principle Seven doesn't specify sentience, Yakov. 'Biosphere.' It speaks to the intrinsic value of alien life, *as it is*. To supplant it wholesale…" She gestured at the shimmering display. "This represents a unique evolutionary path. Erasing it for our convenience isn't preservation; it's cosmic vandalism. And what of the children born *after* terraforming? Do they consent to inherit a world built on the annihilation of its firstborn?"

  "The unborn cannot consent to *anything*," Yakov countered, frustration edging his voice. "Not to being born in a tin can liable to rupture, not to breathing filtered air that tastes of fear. Our responsibility is to give them the *best possible chance*, the safest environment. That’s the consent we owe them – action taken *for* their potential survival and flourishing. Risking their future for microbes that cannot know they exist… is that ethical?"

  Elara closed her eyes. She saw the creche children, their laughter echoing in sterile corridors. She saw the intricate, silent dance of the mats beneath Vellos’s dim sun. She saw the charter’s elegant, impossible contradiction. Principle Three offered a terrifyingly pragmatic backup rationale: survival justifies ecological replacement. Principle Seven countered: uniqueness imposes a duty of restraint, regardless of utility.

  "And if Earth still lives?" Anya pressed softly. "If we are not the last, but merely the first wave, committing an irreversible act? Principle Seven exists *because* we cannot assume our needs trump all others, even microbial others."

  "The comms array is dead ash," Rostova said, her voice heavy. "We are the hedge against catastrophe. We *must* assume the mantle of survival." She looked at Elara. "Ecologist Vance. Your certification is pivotal. Does Principle Seven, as written, apply here? Does this biosphere warrant protection at the cost of human potential?"

  The silence stretched. Elara felt the weight of generations – the ancestors who launched them, the unborn who waited in frozen embryos and future couplings. She thought of the mats, building their mineral castles molecule by molecule, indifferent to the cold giant ship hanging in their sky.

  "They are alive," Elara said, her voice clear but tight. "They constitute a genuine, functioning biosphere. Unique. Ancient. Principle Seven applies." Anya’s shoulders relaxed fractionally. Yakov looked stricken. "However," Elara continued, meeting Rostova’s gaze, "the application must weigh the consequences. The risk to existing human life aboard the *Aevum* is immediate and severe. The risk to *potential* human life – the children who could thrive on a terraformed Vellos – is existential if we remain confined. The microbial life… it will not suffer. Its loss is one of potential cosmic diversity, not individual experience."

  She paused, the words forming with a terrible clarity. "Our duty to the unborn isn't just non-harm; it's active stewardship towards a viable future. We cannot ask their consent, so we must act as trustees for their interests. And their interest, overwhelmingly, is survival in a stable environment, not perpetual jeopardy inside a failing ship." She looked at the mesmerizing swirls on the display. "The loss… is profound. Irreplaceable. But Principle Three compels us. Survival isn't just a rationale; it's the foundation upon which any future ethics can exist. Without it, both principles become moot."

  The chamber was deathly quiet. Anya closed her eyes. Yakov exhaled, a shuddering breath.

  "Then you certify the biosphere is non-sentient, and the terraforming protocols may proceed?" Rostova asked, her face unreadable.

  Elara took a deep breath of the ship's stale air. She remembered the silent, vibrant world below, its strange, beautiful indifference. She imagined children – *her* potential children – running under an open, oxygen-rich sky, breathing without fear. The cost was a universe smaller, a unique song silenced.

  "Yes, Captain," Elara said, the words tasting of salt and sorrow. "I certify. Proceed with terraforming." She tapped the panel authorization. The command was sent.

  Later, alone in her lab as the first dispersal drones detached from the *Aevum*, Elara watched the real-time feed. Tiny sparks ignited in the upper atmosphere, seeding the chemical cascade that would, over years, ignite the oxygen revolution below. It would be beautiful, in its way. A new dawn.

  She opened a sterile vial. Within it lay a sliver of mineral-rich sediment, teeming with Vellosian life, painstakingly collected before her descent. It glimmered faintly under the lab lights. An ark for a single, silent note from an ancient symphony soon to be erased. Not redemption, perhaps. An unanswered question, preserved in glass. For whom, she wasn't sure. She sealed the vial, labeled it, and placed it in the deepest cryo-archive, next to the frozen embryos. A legacy of loss, placed beside the fragile seed of hope. Outside the viewport, Vellos turned, oblivious, its seas still dark, waiting for the light that would burn its oldest inhabitants and make way for new ones.
