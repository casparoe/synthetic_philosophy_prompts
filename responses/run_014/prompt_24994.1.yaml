answer: |-
  The absolute prohibition on torture alongside permissible harm-weighing in other contexts reveals a complex, hybrid moral foundation within the law, leaning heavily on deontological constraints for torture specifically, while allowing for consequentialist reasoning elsewhere. Here's the reconstruction, distinction, and implications:

  **I. The Implicit Moral Theory Presupposed by the Absolute Prohibition**

  The absolute ban presupposes a **moderate deontological theory with strong agent-relative constraints centered on human dignity and the inviolability of the person.**

  1.  **Intrinsic Wrongness:** Torture is seen as intrinsically wrong, not merely instrumentally bad because of its consequences. It violates the fundamental status of a human being as an end-in-themself (Kantian influence). The act itself, involving the deliberate infliction of extreme physical or mental suffering to break a person's will and autonomy, constitutes a profound moral injury.
  2.  **Agent-Relative Prohibition:** This wrongness creates an agent-relative constraint. *Even if* torturing one person could save many others, the official is morally prohibited from performing *this specific act*. The prohibition binds the agent directly, irrespective of the potentially beneficial consequences their action *might* produce for others. The law tells the official: "You *personally* cannot do this, no matter what good might come of it elsewhere."
  3.  **Focus on the Victim's Status:** The wrongness stems primarily from the violation inflicted *on the torture victim*. Reducing them to a mere means for extracting information or achieving security, utterly disregarding their inherent dignity and bodily/mental integrity, is deemed an absolute boundary that cannot be crossed. The victim's status as a helpless subject under the state's power intensifies this violation.
  4.  **Incommensurability:** The harm inflicted by torture (the destruction of dignity, autonomy, and psychological integrity) is viewed as qualitatively different and incommensurable with the harms it might prevent (e.g., physical death or destruction). Saving lives, however many, cannot morally "outweigh" or justify the unique moral injury of torture. This makes straightforward harm-weighing inappropriate.
  5.  **Corruption of the Agent and Institution:** There's an implicit recognition that engaging in torture corrupts the moral character of the torturer and the legitimacy/professionalism of the institutions they represent (police, military, state) in a way that using force against an active aggressor does not. This has rule-consequentialist echoes but is rooted in the deontic nature of the act itself.

  **II. Distinction: Strict Presupposition vs. Good Fit**

  *   **Strictly Presupposed:** The absolute prohibition strictly presupposes the existence of **agent-relative deontological constraints** prohibiting certain acts *intrinsically*, regardless of consequences. It presupposes that torture falls into this category of acts. It also presupposes that **human dignity/bodily inviolability** creates an **absolute boundary** against such treatment, making the victim's right not to be tortured **non-overridable** by consequentialist calculations of net lives saved.
  *   **Fits Well With (Not Strictly Presupposed):**
      *   **Rule Consequentialism:** The ban fits well with the rule-consequentialist argument that an absolute prohibition is necessary because allowing any exception (like the ticking bomb) would inevitably lead to slippery slopes, abuse, institutional corruption, and ultimately more harm than good. However, the law *could* theoretically adopt a limited exception based on strict criteria without abandoning consequentialism (though it universally rejects this). The absolute nature *fits* this fear but doesn't *logically require* it; the core justification is the intrinsic wrongness.
      *   **Kantian Ethics:** While fitting perfectly with Kant's emphasis on dignity and treating persons as ends, the law doesn't necessarily presuppose the full metaphysical apparatus of Kantianism (e.g., the categorical imperative formulation). The core presupposition is the *conclusion* Kant reaches about torture, not necessarily his entire derivation.
      *   **Natural Law Theory:** The prohibition fits well with natural law views of inherent, inalienable rights. However, the law doesn't strictly presuppose a specific natural law foundation; it could be grounded in a secular conception of human dignity.

  **III. Consistency with Permissible Harm-Weighing Elsewhere?**

  The law exhibits **tension but not necessarily logical inconsistency.** It relies on **distinguishing the moral nature of the acts**:

  1.  **Distinguishing Features of Torture:**
      *   **Intentional Targeting of the Helpless:** Torture involves intentionally inflicting excruciating suffering on a person who is completely under the state's control and typically not an *immediate* physical threat at the moment of torture. The victim is helpless and used instrumentally.
      *   **Violation of Bodily/Mental Integrity:** It constitutes a profound, direct assault on the core of personhood in a way that collateral damage or shooting an active aggressor does not.
      *   **Purpose:** Its primary purpose is often *information extraction* through breaking the will, distinct from *stopping an imminent attack*.
  2.  **Harm-Weighing Contexts (Self-Defense, War):**
      *   **Immediate Threat Neutralization:** Lethal force against a mass shooter is justified as directly stopping an *ongoing*, *imminent* lethal threat posed by an *active aggressor*. The harm to the aggressor is directly linked to stopping their aggression.
      *   **Doctrine of Double Effect (DDE):** Civilian deaths in war are often (though controversially) framed under DDE. The *intended* effect is stopping the aggressor/military objective; civilian deaths are a *foreseen but unintended* side effect. Harm-weighing (proportionality) applies to these foreseen but unintended consequences. Torture, however, has the infliction of suffering as its *intended means*.
      *   **Targeting of Combatants:** War permits targeting combatants (those posing a threat), not arbitrarily torturing captives.

  **The implicit theory argues that torture is simply a different *category* of wrong.** Harm-weighing is permitted for acts involving force against aggressors or unintended collateral harm, but torture represents a unique, absolute violation of human status that cannot be justified by weighing lives. The tension arises because both involve causing severe harm to prevent greater harm. The law resolves it by drawing a bright line at torture based on its intrinsic properties and the specific relationship between agent and victim.

  **IV. Legal Changes Under Act-Consequentialism**

  Replacing the presupposed deontological view with a straightforward act-consequentialist theory (where the right act maximizes net good consequences in the specific situation) would necessitate profound changes:

  1.  **Elimination of Absolute Prohibition:** The absolute ban would be replaced by a **necessity defense** or explicit justification for torture. Torture would no longer be *per se* illegal; its legality would depend on the specific anticipated consequences.
  2.  **Requirement of Proportionality:** The law would require officials to demonstrate that the **probability and magnitude of the threatened harm** (e.g., thousands dying in an imminent attack) **outweighed the harm inflicted by torture** (physical/psychological suffering of the suspect, potential for error, reputational damage to the state) in that specific case. A formal proportionality test would be introduced.
  3.  **Requirement of Imminence and Necessity:** Torture would only be permissible if it was the **only available means** to prevent the catastrophic harm and the harm was **truly imminent**. Mere possibility wouldn't suffice; high probability would be required.
  4.  **Authorization Mechanisms:** Legal doctrine would likely develop procedures for **pre-authorization** (e.g., warrants from special courts based on imminent threat assessments) or **post-hoc justification review** to assess whether the official correctly judged the consequentialist calculus under the circumstances. Standards of proof would need to be defined.
  5.  **Redefinition of "Torture":** Legal definitions might narrow to exclude less severe interrogation techniques to expand the scope of permissible "harm" for weighing, or conversely, the threshold for what constitutes impermissible suffering might be lowered to limit justifications.
  6.  **Erosion of Related Protections:** The logic could seep into other areas, potentially weakening absolute prohibitions on things like slavery or arbitrary execution if a sufficiently strong consequentialist argument could be mounted in an extreme case.
  7.  **Focus on Outcomes, Not Means:** The moral and legal focus would shift entirely to the *outcome* (did torture prevent a greater harm?) rather than the inherent nature of the act itself. The dignity/inviolability argument would lose its legal force.

  **Conclusion:**

  The absolute prohibition on torture presupposes a deontological view that torture constitutes an intrinsic, agent-relative wrong violating human dignity, making it morally incommensurable with the harms it might prevent. While this fits with rule-consequentialist concerns and Kantian ethics, it strictly requires the core deontic constraint. The law maintains consistency with permissible harm-weighing elsewhere (self-defense, war) by categorically distinguishing torture based on its specific intent (inflicting suffering on the helpless as a means) and the unique moral injury it inflicts. Adopting act-consequentialism would dismantle this absolute prohibition, replacing it with a necessity defense requiring proof that the torture's benefits outweighed its costs in the specific instance, fundamentally altering the legal landscape and the state's relationship to the individual.
