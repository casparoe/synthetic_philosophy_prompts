prompt: |-
  I'm the research director for a constitutional reform commission in a mid-sized parliamentary democracy. The commission's mandate is to draft, within two years, a proposal for adding a sortition-based chamber to the legislature — a few hundred citizens selected by lot, most likely serving a single non-renewable term — alongside the existing elected chamber. We have money to commission roughly a dozen academic studies over the next eighteen months. My question is not whether sortition is a good idea, but which open questions we most need answered to produce a workable design, and in what order.

  Please rank the research questions you would have us fund, and defend the ordering. The open questions I'm already aware of include the following, but you should add others if you think they matter more:

  1. Self-selection. A lottery only delivers descriptive representativeness if the people drawn actually serve. If acceptance is voluntary and correlates with education, income, and civic engagement, the chamber is biased before deliberation begins. What compensation levels, duty framing (jury-style compulsion versus invitation), and opt-out designs best preserve the representativeness that is sortition's main selling point?

  2. Facilitation and agenda capture. Members serve briefly and cannot accumulate expertise, so professional staff, facilitators, and expert briefers may end up exercising the real power. Is there any institutional arrangement that secures informed judgment without a permanent unelected elite effectively doing the thinking for a rotating amateur membership?

  3. Mandate design. The chamber could hold binding legislative power, agenda-setting power only, or a veto over the elected chamber. How does each allocation make the other problems — capture, legitimacy, self-selection — better or worse?

  4. Term limits and professionalization. The anti-career-politician case for sortition assumes the one-term lottery member is a virtue. But does a chamber of perpetual amateurs merely relocate career-politician pathologies to whichever actors are permanent: staff, parties, the civil service?

  5. Legitimacy. Does a body nobody chose have the standing to make binding law, and does the answer change once citizens have lived experience with its output?

  For each item you would fund, explain what makes it upstream of the others, how tractable it is within eighteen months (e.g., through mini-public pilots, survey experiments, or natural experiments such as jury service), and what evidence would move it up or down your list. Equally important, tell me which of these you would deliberately refuse to fund, and why — either because the answer would not change the design, or because it is a question for political philosophers to argue about for the next thirty years rather than one the commission's timeline can resolve.
reasoning: |-
  Okay, the user is the research director for a constitutional reform commission in a parliamentary democracy. Their task is to draft a proposal for adding a sortition-based chamber within two years. They have funds for about a dozen academic studies over 18 months. The main question is which research questions to prioritize to create a workable design, not whether sortition is good or bad.

  First, I need to understand the key open questions they've listed: self-selection, facilitation/agenda capture, mandate design, term limits, and legitimacy. They want to know which ones should be funded first and why, based on upstream impact, tractability, and evidence needed. Also, which to avoid funding and why.

  Self-selection seems critical because if the participants aren't representative, the whole system loses its main advantage. Compensation and opt-out designs are practical issues that need solving early. Surveys and pilot programs could test different incentives quickly. If representativeness fails, other aspects like legitimacy might not matter.

  Facilitation and agenda capture come next. Even with a representative group, if staff or experts dominate, the chamber's decisions aren't truly citizen-driven. Observational studies of existing bodies like Ireland's assemblies could show how facilitation affects outcomes. This is tractable within the timeframe but depends on having participants first.

  Mandate design is third. The chamber's power affects how other issues play out. Comparative analysis of advisory vs. binding bodies and surveys on public acceptance could inform this. But without knowing who participates and how they're supported, it's hard to finalize powers. Veto power might be too ambitious initially.

  Term limits and legitimacy are lower priority. Term limits are somewhat inherent to sortition; changing them might undermine the model. Legitimacy is philosophical and could evolve with real-world experience. Surveys might help, but it's not immediately actionable for design.

  Refusing to fund pure legitimacy studies makes sense because it's more philosophical and hard to resolve in 18 months. Instead, focus on empirical aspects that impact design. Also, term limits are a core feature; deviating might not align with the sortition principle.

  The user might have deeper needs: ensuring the reform is implementable, politically acceptable, and maintains public trust. Prioritizing practical, researchable questions that prevent failure points (like bias or capture) addresses these. They might also need to show progress within the tight timeline, hence emphasizing tractable studies like pilots and surveys.
answer: |-
  Here’s a prioritized research agenda focusing on actionable, upstream questions that directly impact design feasibility, ranked by urgency and tractability within 18 months. I’ve added two critical missing questions and identified low-priority items to deprioritize or refuse.

  ### **Ranked Research Priorities**
  1.  **Self-Selection Mechanics** (Your #1)  
      **Why Upstream?** Representativeness is foundational. If the chamber isn’t descriptively representative, *all* other benefits collapse. Compensation/framing choices affect every subsequent design element.  
      **Tractability:** High. Test via:  
      - **Survey experiments** with random samples (varying compensation, duty framing, opt-out rules).  
      - **Natural experiments:** Compare jury duty compliance rates across jurisdictions with different compensation/stigma profiles.  
      - **Pilot mini-publics** with stratified lotteries, tracking acceptance rates by demography.  
      **Evidence Needed:** Quantify dropout bias under different conditions (e.g., "At $X/day, 70% acceptance preserves SES representativeness; below $Y, dropout skews toward college-educated by 25%").  
      **Downstream Impact:** Informs budget (compensation), legal framework (compulsion), and chamber size (to offset opt-outs).

  2.  **Facilitation & Agenda Control** (Your #2 + **ADDED: Agenda-Setting Protocols**)  
      **Why Upstream?** Staff/expert influence directly determines whether the chamber is sovereign or symbolic. Agenda power precedes mandate design.  
      **Tractability:** Medium-High. Test via:  
      - **Observational studies** of existing bodies (Ireland’s Citizens’ Assembly, Oregon’s Citizens’ Initiative Review), coding facilitator interventions.  
      - **Deliberative experiments:** Parallel mini-publics on the same topic with different briefing styles (neutral vs. advocacy-aligned experts).  
      - **Process tracing** of past assemblies: How were topics framed? Who drafted background materials?  
      **Evidence Needed:** Identify "tipping points" where expert/staff influence overrides participant agency (e.g., "When facilitators summarize discussions, 80% of amendments originate from facilitators").  
      **Downstream Impact:** Shapes staff hiring criteria, rules of procedure, and expert vetting processes.

  3.  **Mandate Design & Inter-Chamber Dynamics** (Your #3 + **ADDED: Conflict Resolution Mechanisms**)  
      **Why Upstream?** The chamber’s power affects incentives for capture, member engagement, and public legitimacy. But it depends on solutions to #1–#2.  
      **Tractability:** Medium. Test via:  
      - **Comparative analysis:** Case studies of hybrid systems (e.g., ancient Athens, modern Climate Assembly veto powers in France vs. advisory UK models).  
      - **Conjoint surveys:** Ask citizens/elites to rank acceptable mandate combinations (e.g., "binding on ethics issues + advisory on budgets").  
      - **War-gaming simulations** with political scientists/MPs modeling veto scenarios.  
      **Evidence Needed:** Map tradeoffs (e.g., "Binding powers increase member engagement by 40% but raise non-compliance risk by elected chamber by 30%").  
      **Downstream Impact:** Decides constitutional clauses on powers, override thresholds, and topic jurisdiction.

  4.  **Operational Durability & Institutional Memory** (Your #4, expanded)  
      **Why Lower Priority?** Staff pathologies matter but are manageable if #2 is resolved. Term limits are core to sortition’s theory; deviation risks mission creep.  
      **Tractability:** Medium. Test via:  
      - **Expert interviews** with clerks/staff from legislatures/juries on knowledge transfer.  
      - **Agent-based modeling** simulating policy consistency with rotating members.  
      - **Archival analysis** of long-term bodies (e.g., Venetian Great Council).  
      **Evidence Needed:** Identify minimal structures for continuity (e.g., "A non-partisan secretariat with 5-year rotations preserves 90% of procedural knowledge").  
      **Downstream Impact:** Informs secretariat design and member onboarding.

  5.  **Legitimacy Perceptions** (Your #5)  
      **Why Lowest?** Legitimacy is an outcome, not a design input. It hinges on the chamber’s performance *after* creation and is highly contextual.  
      **Tractability:** Low for predictive insights. Test via:  
      - **Pre/post surveys** before/after pilot assemblies ("Would you accept a binding decision from a citizen panel on topic X?").  
      - **Framing experiments** testing messages that boost perceived legitimacy.  
      **Evidence Needed:** Baseline data only (e.g., "45% trust sortition bodies vs. 25% for parliament initially").  
      **Downstream Impact:** Guides communication strategy, not structural design.

  ---

  ### **Added Critical Questions**
  6.  **Policy Impact & Quality Metrics**  
      **Why Essential?** Without evidence that sortition bodies improve outcomes, the reform lacks justification.  
      **Research:** Compare policy durability/compliance/satisfaction for sortition-vs-elected body proposals (e.g., analyze German Bürgerrat recommendations vs. parliamentary bills).  
      **Tractability:** Medium. Use existing mini-public data + expert assessments of proposal quality.

  7.  **Vulnerability to External Capture**  
      **Why Essential?** Lobbyists, parties, and media may exploit amateur members.  
      **Research:** Simulations exposing sortition members to lobbying tactics; historical analysis of biased juries.  
      **Tractability:** Medium. Role-playing experiments + transparency protocol audits.

  ---

  ### **Refuse to Fund**
  - **Pure Philosophical Legitimacy (#5 beyond surveys):** Endless debate over "mandate of heaven" won’t yield design insights.  
  - **Term Limit Alternatives:** Single non-renewable terms are non-negotiable for sortition. Researching multi-term models contradicts the core premise.  
  - **Electoral System Comparisons:** Your mandate assumes a sortition chamber; studying PR vs. ranked-choice is off-topic.  

  ---

  ### **Sequence Rationale**  
  1. **Solve bias first (#1):** Unrepresentative chambers are irredeemable.  
  2. **Secure autonomy (#2, #7):** Without control over agenda/judgment, the chamber is a puppet.  
  3. **Define powers (#3, #6):** Mandates depend on functional membership and process integrity.  
  4. **Optimize operations (#4):** Efficiency fixes come last once viability is proven.  

  **Budget Allocation Suggestion:**  
  - 3 studies on #1 (compensation experiments, natural experiments, pilot tracking)  
  - 3 studies on #2/#7 (facilitation protocols, agenda-setting, capture resistance)  
  - 2 studies on #3 (mandate tradeoffs, conflict mechanisms)  
  - 2 studies on #6 (policy impact/quality)  
  - 1 study on #4 (institutional memory)  
  - 1 study on baseline legitimacy (#5 surveys)  

  This sequence maximizes actionable insights within 18 months, focusing on make-or-break design thresholds. The rest is implementation tuning.
