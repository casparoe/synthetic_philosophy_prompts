  So, we can write:

  **Agreed Claims:**

  1. Evolutionary processes are continuous and do not admit of sharp boundaries between species or between cognitive mechanisms. Any classification of minds must be understood against this backdrop of gradual change.
  2. The fourfold classification (Darwinian, Skinnerian, Popperian, Gregorian) provides real descriptive and pedagogical utility in organizing and teaching the diversity of cognitive phenomena across species.
  3. There exist genuinely hard intermediate cases that resist clear assignment to a single rung of the ladder. Examples include:
     - Tool traditions that may or may not be cumulative (e.g., New Caledonian crows' tool manufacture vs. the more limited tool use in some capuchin monkeys).
     - Symbol-system training in great apes (e.g., the bonobo Kanzi's use of lexigrams, which exhibits some but not all features of symbolic communication).
     - Solitary invertebrates solving novel problems (e.g., jumping spiders planning detours to capture prey, and octopuses learning to open jars).
     - Species that plan for future events without apparent shared symbols (e.g., scrub jays caching and recovering food in ways that suggest episodic-like memory and future planning).
  4. Some form of internal modelling of the consequences of behaviour occurs in organisms that Camp A would assign to the Skinnerian rung or below. For example, evidence of latent learning and cognitive maps in insects and rodents suggests that simple predictive models are not exclusive to Popperian creatures.

  ### 2. Disagreements Table
