  **Cruxes:**

  1. **Crux (d): Whether discreteness in kind is an empirical question at all, or a question about the purposes a taxonomy serves.**
     - *Concrete Case*: Consider an engineered system: a reinforcement learning agent (Skinnerian) that is augmented with an internal simulation module (Popperian) and then with a natural language interface that allows it to access cultural knowledge (Gregorian). Both camps agree to test whether the transitions between these versions represent qualitative shifts or quantitative enhancements.
     - *Camp A's prediction*: The transitions will show qualitative shifts in behavior and capabilities (e.g., the ability to solve novel problems without trial-and-error, or to use symbolic instructions to solve problems that are intractable for the unaugmented system) that cannot be achieved by simply scaling up the resources of the lower version.
     - *Camp B's prediction*: The transitions will show smooth quantitative improvements in performance and problem-solving range, without any sharp boundaries or emergent capabilities that cannot be explained by the increased resources (e.g., more memory, faster processing, or the external language module as a tool).

  2. **Crux (a): Whether the criterion for a new rung is mechanistic (a novel computational resource) or functional (a novel ecological payoff).**
     - *Concrete Case*: Study of the archerfish shooting water jets at insects. The fish can learn to shoot at novel targets and adjust for refraction (a form of internal model?). Compare the mechanistic explanation (neural circuits for predictive modeling) versus the functional (ability to exploit a new food source). Both camps agree that if a novel computational resource (e.g., a neural substrate for predictive simulation) is found, it would support a mechanistic discontinuity.
     - *Camp A's prediction*: The archerfish's ability requires a novel computational resource (e.g., a specific neural circuit for simulating projectile motion) that is absent in other fish that do not exhibit this behavior, thus representing a qualitative shift.
     - *Camp B's prediction*: The archerfish's ability can be explained by existing learning mechanisms (operant conditioning) operating with enhanced perceptual-motor coordination and without a dedicated simulation mechanism, and the behavior represents a functional adaptation without a novel computational resource.

  3. **Crux (b): Whether the image of hypotheses dying in the organism's stead is a mechanism claim or a metaphor.**
     - *Concrete Case*: Experiments on rats in a maze with a potentially lethal electric shock. One group can observe a conspecific making a mistake (without getting shocked) and then avoid that path. Another group must learn by trial-and-error. Measure neural activity in the prefrontal cortex (associated with prediction and planning). Both camps agree that if the observer rats show neural patterns indicative of internally simulating the conspecific's error and its consequence without themselves experiencing the shock, it would support a mechanism for internal simulation.
     - *Camp A's prediction*: Observer rats will show specific neural activation patterns in regions associated with internal simulation (e.g., hippocampus and prefrontal cortex) during observation, and they will avoid the lethal path without any trial-and-error, indicating that the hypothesis (the conspecific's path) "died in their stead" via a dedicated internal mechanism.
