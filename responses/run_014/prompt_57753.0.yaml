  ### 4. Rung-Collapse Argument
  We must say:
  - Where the rung-collapse argument succeeds (i.e., where a higher rung can be reproduced by the lower plus quantitative increases).
  - Where it fails (i.e., where it cannot be so reproduced, according to Camp A).
  - Whether the disagreement is about the facts or about the threshold for a complete explanation.

  We must also incorporate the agreement that internal modelling occurs below the Popperian rung.

  From the agreed claims, internal modelling occurs in Skinnerian creatures. So the rung-collapse might succeed from Darwinian to Skinnerian and even to some Popperian-like behavior? But Camp A says the top two rungs (Popperian and Gregorian) are not reducible.

  Let's write:

  **Resolution of the Rung-Collapse Argument:**

  The rung-collapse argument (that a higher rung is the rung below plus quantitative increases) is agreed to succeed in the following transitions:
  - From Darwinian to Skinnerian: Operant conditioning can be understood as a quantitative enhancement of innate behaviors (via increased plasticity and memory for associations) without requiring a fundamentally new mechanism.
  - From Skinnerian to some Popperian-like behaviors: Simple forms of internal modelling (e.g., cognitive maps in insects and rodents) can be achieved by enhanced associative learning and memory, without requiring the full hypothesis-testing mechanism that Camp A associates with the Popperian rung.

  However, the argument fails, in Camp A's view, at the transition to the full Popperian rung and to the Gregorian rung. Camp A argues that:
  - The Popperian rung requires a novel mechanism for generating and testing internal representations of possible actions and their outcomes, which is not reducible to enhanced operant conditioning because it involves a separate process of simulation that is decoupled from immediate reinforcement.
  - The Gregorian rung requires the internalization of cultural symbols, which fundamentally restructures cognition and is not reducible to enhanced individual learning plus external tools.

  Camp B counters that the rung-collapse argument succeeds at every transition, including the Popperian and Gregorian rungs. For Camp B:
  - The Popperian rung is operant conditioning operating over internal representations, with quantitative increases in memory and search that allow for faster, internal trial-and-error.
  - The Gregorian rung is the amplification of existing cognitive capacities through external symbolic scaffolding, without a qualitative change in internal architecture.

  The disagreement about the rung-collapse argument is not primarily about the comparative facts (both agree on the phenomena) but about the threshold at which an explanation counts as complete. Camp A requires that a complete explanation must invoke a novel computational mechanism for the higher rungs, while Camp B holds that an explanation is complete when it shows how quantitative enhancements to existing mechanisms can produce the phenomena.

  ### 5. Separating Verbal from Substantive
  We must state if any portion is verbal and what remains.

  We suspect that part of the disagreement might be verbal due to different definitions or thresholds. Specifically:

  - The dispute about whether a transition is "qualitative" or "quantitative" may be partly verbal because it depends on the level of description. At a fine-grained mechanistic level, every quantitative change in parameters can lead to a qualitative change in behavior (e.g., phase transitions). Conversely, what looks qualitative at a functional level might be implemented by continuous mechanisms.

  However, what remains substantive is:

  - Whether the cognitive mechanisms underlying the Popperian and Gregorian rungs require novel computational resources (e.g., a dedicated simulation module or a symbol manipulation system) that are not present in lower rungs, or whether they can be implemented by the same mechanisms with increased capacity and external support.

  This is a substantive disagreement about the architecture of cognition, which can be resolved by empirical evidence (as outlined in the cruxes).

  Thus:

  **Closing Section: Verbal and Substantive Disagreements**

  We agree that a portion of the dispute is verbal, stemming from the ambiguity in what constitutes a "qualitative shift" versus a "quantitative enhancement". This ambiguity arises because the same phenomenon can be described at different levels (e.g., mechanistic implementation vs. functional outcome). Once this ambiguity is set aside, the remaining disagreement is substantive and empirical: it concerns the existence of novel computational mechanisms at the higher rungs (Popperian and Gregorian) that cannot be reduced to the mechanisms of the lower rungs with quantitative enhancements. This question about the world – the actual cognitive architecture of organisms – can be addressed by the empirical investigations proposed in the cruxes.

  Now, we put it all together in the required format.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Cognitive Ladder  

  #### 1. Agreed Claims  
  Both camps endorse the following:  
  1. Evolutionary processes are continuous and do not admit of sharp boundaries between lineages or mechanisms. Any classification of cognitive traits must operate within this continuum.  
  2. The fourfold ladder (Darwinian, Skinnerian, Popperian, Gregorian) has demonstrable descriptive and pedagogical utility in organizing comparative cognitive phenomena, irrespective of metaphysical disagreements about its foundations.  
  3. Genuinely hard intermediate cases exist across taxa, resisting unambiguous classification. Key examples include:  
     - Tool traditions that may or may not be cumulative (e.g., New Caledonian crow tool manufacture vs. chimpanzee termite-fishing).  
     - Symbol-system training in great apes (e.g., lexigram use by bonobos), which exhibits features of symbolic cognition but lacks full generativity.  
     - Solitary invertebrates solving novel problems (e.g., jumping spiders planning detours, octopuses opening jars), demonstrating flexible problem-solving without social learning.  
     - Species planning cache recovery without shared symbols (e.g., scrub jays relocating hidden food), suggesting prospective cognition without symbolic representation.  
  4. Internal modelling of behavioural consequences occurs below the Popperian rung. Evidence includes latent learning in rats (Skinnerian) and predictive navigation in insects (e.g., desert ants using path integration).  

  #### 2. Disagreements  
  The table below states each core disagreement in three forms: Camp A’s preferred formulation, Camp B’s preferred formulation, and a neutral framing acceptable to both.  

  | Neutral Formulation of the Issue                                                                 | Camp A’s Formulation                                                                                                                     | Camp B’s Formulation                                                                                                                                 |  
  |--------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | Whether transitions between rungs constitute qualitative shifts in cognitive architecture or quantitative enhancements of existing mechanisms. | Each higher rung introduces a novel computational resource (e.g., internal simulation) that is irreducible to the lower rung’s mechanisms plus incremental improvements. | Each higher rung emerges from quantitative amplifications (e.g., memory, search, trials, or scaffolding) of lower-rung mechanisms, without a new computational kind. |  
  | Whether Popperian cognition requires a discrete mechanism for internal simulation.               | Popperian cognition involves a dedicated system for generating and testing internal hypotheses, which is not operant conditioning over representations. | Popperian cognition is operant conditioning operating over internal representations, enhanced by greater memory and search capacity.                  |  
  | Whether Gregorian cognition requires a distinct cognitive architecture.                          | Gregorian cognition fundamentally restructures the mind via internalized symbols, creating a new form of control beyond amplified individual learning. | Gregorian cognition is cumulative cultural niche construction—external scaffolding that amplifies existing capacities without altering core architecture. |  

  #### 3. Cruxes  
  The following sub-questions are pivotal; resolving any would advance the debate. Cruxes (a) and (c) are functionally equivalent (both ask whether novel explanations are required for higher rungs), while (b) reframes (a) for a specific rung. Ranked by potential to shift positions (high to low):  
  - **Crux (d)**: Whether discreteness is an empirical question or a taxonomic pragmatic. *Movement potential: High* (challenges the debate’s foundations).  
  - **Crux (a)/(c)**: Whether novelty is mechanistic (computational resource) or functional (ecological payoff)/whether scaffolding changes explanations. *Movement potential: Medium* (addresses core criteria).  
  - **Crux (b)**: Whether "hypotheses dying in the organism’s stead" is a mechanism or metaphor. *Movement potential: Low* (a specific test case for (a)/(c)).  

  **Paired Predictions for Concrete Cases**:  
  - **Crux (d)**: *Case*: An engineered reinforcement-learning agent (Skinnerian) augmented to use internal simulations (Popperian) and then cultural databases (Gregorian).  
    - *Camp A predicts*: Transitions will show discontinuous performance cliffs (e.g., solving novel problems with zero trial-and-error), proving qualitative shifts.  
    - *Camp B predicts*: Transitions will show smooth performance curves, with improvements attributable to parameter scaling (e.g., memory size).  

  - **Crux (a)/(c)**: *Case*: Archerfish shooting prey with water jets—a functional novelty (exploiting aerial prey) potentially involving predictive internal models.  
    - *Camp A predicts*: Neural evidence will reveal a dedicated circuit for simulating projectile physics, absent in non-archerfish relatives.  
    - *Camp B predicts*: Behaviour will correlate with enhanced associative learning and optic lobe plasticity, without novel circuitry.  

  - **Crux (b)**: *Case*: Rats observing conspecifics receive electric shocks in a maze, then avoiding the lethal path without direct experience.  
    - *Camp A predicts*: Neural activity in prefrontal-hippocampal circuits will indicate internal simulation of outcomes, enabling error-avoidance without trial-and-error.  
    - *Camp B predicts*: Behaviour will stem from enhanced fear conditioning (observed distress as conditioned stimulus), with neural activity in amygdala-based pathways.  

  #### 4. Resolution of the Rung-Collapse Argument  
  - **Where the argument succeeds**: For Darwinian-to-Skinnerian and some Skinnerian-to-Popperian transitions (e.g., detour learning in jumping spiders). Quantitative enhancements (e.g., memory, trials) suffice to explain these phenomena.  
  - **Where it fails (per Camp A)**: At the Popperian rung (e.g., one-shot planning in ravens) and Gregorian rung (e.g., cumulative cultural transmission in humans). Here, quantitative increases (e.g., infinite trials) cannot replicate the capacity without novel mechanisms.  
  - **Disagreement focus**: Not the comparative facts (both accept the phenomena), but the *threshold for explanatory completeness*. Camp A demands novel computational resources; Camp B requires only sufficiency of existing mechanisms plus enhancements.  

  #### 5. Verbal vs. Substantive Disagreements  
  - **Verbal portion**: Disputes over "qualitative vs. quantitative" are partly terminological. Phase transitions (e.g., water boiling) show how quantitative changes yield qualitative effects—but this depends on descriptive grain. Both camps agree the ladder’s *phenomena* are real; their divergence centers on whether "kind" refers to mechanism (Camp A) or functional outcome (Camp B).  
  - **Substantive remainder**: Once terminology is set aside, the disagreement is empirical: **Do Popperian and Gregorian cognition require novel computational mechanisms?** Camp A says yes (e.g., innate simulation modules); Camp B says no (e.g., enhanced conditioning + external tools). This is a question about the world, resolvable via the cruxes above.
