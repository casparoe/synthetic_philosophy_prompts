  | Whether the Gregorian rung requires a novel form of cognitive architecture.         | The Gregorian capacity for leveraging cultural symbols and tools constitutes a new kind of mind because it fundamentally changes the cognitive architecture via internalization of external symbols, not merely amplifying existing capacities. | The Gregorian capacity is an amplification of existing cognitive capacities through cumulative cultural niche construction, where external symbolic scaffolding extends the range of cognition without altering the underlying cognitive architecture in a qualitative way. |

