prompt: |-
  I TA a second-year course that's nominally "games, decisions and rationality" but is really half philosophy, half econ, and Thursday I get them for eighty minutes with a whiteboard and no slides to do backward induction and the centipede game. It's a 9am slot so a third of them will be running purely on coffee. They've already had simultaneous-move games, Nash equilibrium, iterated elimination of dominated strategies, the prisoner's dilemma and finitely repeated versions of it, and they can read a game tree, but nobody has met perfect-information games or subgame perfection before. Don't explain the centipede game to me — I know it, I know Rosenthal's version with the doubling pot, I know the unique subgame perfect equlibrium has player one taking immediately, and I know the lab results where hardly anyone does and people end up better off than the equilibrium predicts. What I want is the plan for how to sequence the explanation. Specifically: which components have to be in place before which others, with the dependency claims spelled out rather than just a list in a plausible order; and what the single example that carries the whole session should be, including what that example needs to have and needs to lack. I'm torn between drawing the 100-node doubling game as a truncated tree and doing something much shorter — four or six nodes, played live with two students at the front for real money (well, sweets) — and I suspect there's a third option I haven't thought of.

  Here's my working hypothesis about the shape of the thing, and I want you either to build the plan around it or tell me plainly that it's wrong: the real content isn't the recursion at the far end of the tree, which they'll pick up in two minutes, it's what a player is entitled to believe once they witness a move that the recursion says can't happen. On that view the centipede is fundamentally a story about belief revision after a surprise, and the tree is only the vehicle. Related subtlety I want handled properly, because I don't think most intro treatments are careful about it: taking is not locally dominant at each node in the plain one-shot sense — it's the right move only given a conjecture about how play continues, and the induction itself is what manufactures that conjecture. If they walk out thinking "passing is dominated so passing is just an error," I've failed the session.

  Map the misconceptions for me in the order they'll actually surface. My guesses: (i) that this is basically an iterated prisoner's dilemma in a longer costume; (ii) that the player who passes is being generous rather than betting on getting paid back later; (iii) that backward induction is an instruction about how you should play rather than a prediction about what players who are rational and known to be will do; (iv) that "common knowledge of rationality" just means everyone is rational and everyone knows it, which is exactly what makes the off-path nodes so strange; (v) my own favourite — that the argument has the same structure as the surprise exam, so if the surprise exam reasoning is a fallacy the centipede reasoning must be too; and (vi) that the experiments straightforwardly prove people are irrational. Also: one student plays a lot of chess and will insist the whole thing is trivial recursion a computer could do — tell me what to say to him and at which point in the sequence to say it, not at the end.

  Answer as someone who has both taught this material many times and thought about it as a philosopher: I care about the conceptual dependency structure more than classroom choreography, and I want you to think carefully before drafting. If it helps, sketch two or three candidate arcs first and then commit to one. Format it as a numbered sequence with a one-line "why here and not earlier/later" attached to each step; then a table of misconceptions with columns for what a student will actually say, roughly where in the sequence it surfaces, and the specific move that heads it off; then two short lists — things I should explicitly refuse to get into at this level (I'm thinking reputation and incomplete-information types, trembling hand, forward induction, the whole surprise-exam literature) with a sentence each on what I say out loud to justify skipping them, and one closing question that separates students who got the belief-revision point from students who just memorised "player one takes immediately." No readings, no citations, don't suggest any: I can't look anything up and neither can they. End with a single line beginning "Verdict:" naming the one misconception that does the most damage if it's still standing when they leave.
reasoning: |-
  Hmm, this is a complex teaching request about backward induction and the centipede game. The user clearly has deep subject matter expertise and wants a pedagogically sound approach focused on conceptual dependencies and common misconceptions. They're a TA preparing an 80-minute session for sleepy undergrads who've had some game theory but no perfect-information games yet.

  The core challenge seems to be sequencing: how to build up the backward induction concept step-by-step while anticipating where misunderstandings will emerge. The user is particularly concerned about students misinterpreting passing as generosity rather than strategic reciprocity, and about the belief revision aspect after unexpected moves. They also want to avoid reducing this to simple dominance reasoning.

  Key pedagogical priorities I notice:
  - Must distinguish between local vs. global dominance (the recursive aspect)
  - Need to confront the paradox of off-path behavior under common knowledge of rationality
  - Should prevent chess student from trivializing the human strategic dilemma
  - Must explicitly map misconception dependencies (e.g., surprise exam fallacy comparison emerges only after BI is established)

  For the demonstration format, a live 4-node game with sweets seems better than Rosenthal's 100-node version - more visceral, less intimidating, and forces confrontation with the first-mover dilemma immediately. The doubling pot distracts from the core strategic tension.

  The belief revision angle is absolutely correct as the central thread. I'll structure the session to make the "what must you believe if you see a pass?" question the climax, with backward induction introduced as the baseline prediction that creates the paradox.

  For misconceptions, the "passing as generosity" error does the most damage if unaddressed - it fundamentally misunderstands the strategic nature of the game. The chess student's objection should be handled when introducing BI by emphasizing the difference between algorithmic solvability and human credibility of the solution.

  Things to explicitly exclude: reputation models (changes information structure), trembling hand (requires equilibrium concepts beyond BI), surprise exam literature (would derail session). Justify by saying "we're examining the baseline complete information model today."

  The closing question should test whether they understand why a rational player might pass if they doubt the opponent's rationality. Something like: "If Player 2 passes at the first node, what must Player 1 now believe to still consider passing rational?"

  Verdict: The most damaging misconception is thinking passing is always irrational rather than conditionally rational based on beliefs about the other player.
answer: |-
  Below is a meticulously sequenced plan focused on **conceptual dependencies** and **misconception mitigation**, centered on a **4-node centipede game** played live with sweets. The core insight is that backward induction (BI) manufactures conjectures about off-path play through common knowledge of rationality (CKR), and deviations force belief revision that BI doesn’t address. The arc builds from dominance to rationality conjectures, then to belief revision after surprises.

  ### Sequencing Plan: Dependencies & Rationale
  1. **Start with a 2-node mini-game (Player 2 moves first)**  
     *Tree: P2 chooses (Take: £1,£0) or (Pass → P1 Takes: £0,£2)*  
     *Why here first:* Establishes "last-mover advantage" and trivial BI. Shows that passing is **not locally dominant** for P2 (taking gives £1 > £0), but passing is rational only if P2 believes P1 will take. Dependency: Must define "rational choice" as maximizing payoff **given beliefs** before multi-step reasoning.

  2. **Add a prior move: 3-node game (P1 moves first)**  
     *Tree: P1: (Take: £2,£0) or (Pass → Step 1’s game)*  
     Live demo: Pick two students. P1 chooses; if Pass, P2 faces Step 1 choice. Repeat 3x.  
     *Why here:* Students see real passing (≈80% in trials). Forces confrontation: Why would P1 pass? Surface misconception (ii) *("P1 is generous")* immediately. Dependency: Requires Step 1’s lesson (rationality depends on beliefs) to analyze P1’s choice. P1 passes only if they believe P2 will pass later—which BI later prohibits.

  3. **Define Backward Induction (BI) formally on the 3-node game**  
     Solve backward: P2 takes at last node (dominated to pass). Thus, P1 believes P2 will take, so P1 takes immediately.  
     *Why here, not earlier:* BI relies on solving future nodes first to inform earlier beliefs. Dependency: Requires a multi-node tree (Step 2) to demonstrate recursion. Contrast with live results: BI predicts P1 takes, but humans pass. Ask: "What beliefs make passing rational?"  

  4. **Introduce Common Knowledge of Rationality (CKR)**  
     "CKR means: (1) All players are rational; (2) All know (1); (3) All know (2); etc." Apply to 3-node game: CKR implies P1 knows P2 is rational, so P1 believes P2 will take → P1 takes.  
     *Why here:* CKR manufactures the conjecture that justifies taking. Dependency: Requires BI’s prediction (Step 3) to show CKR *enables* the conjecture. Surface misconception (iv) *("CKR just means everyone is rational")*—emphasize infinite regress.  

  5. **4-node game live (P1→P2→P1→P2)**  
     *Payoffs: Take at T1: (£2,£0); T2: (£1,£3); T3: (£4,£2); T4: (£3,£7)*. Play 3x.  
     *Why here:* Adds one layer to expose full BI recursion. Students will pass early. After, solve with BI: Start from end, P2 takes → P1 takes at T3 → P2 takes at T2 → P1 takes at T1.  
     *Dependency:* Requires CKR (Step 4) to explain why BI is the CKR prediction.  

  6. **The belief-revision climax: "What if you see a pass?"**  
     In 4-node game, suppose P1 passes. Ask P2: "You now move. What do you believe about P1?"  
     *Why here:* Forces paradox under CKR. If CKR holds, P1 should never pass—so a pass *contradicts* CKR. P2 must revise beliefs (e.g., "P1 is irrational"). Passing becomes rational for P2 if they believe P1 will "repay" later. Dependency: Requires full BI prediction (Step 5) to create the "surprise."  

  7. **Chess student interjection (during Step 3 or 5)**  
     *What they say:* "This is trivial recursion—computers solve this."  
     *Response:* "True, BI is algorithmically simple. But humans aren’t computers. BI assumes players *believe* others will follow BI indefinitely. If you doubt that, BI unravels. That’s why we see passes."  
     *Why here:* When BI is introduced, to preempt reductionism.  

  ---

  ### Misconception Mitigation Table
  | Misconception | Student Phrasing | When Surfaced | Counter-Move |
  |---------------|------------------|--------------|-------------|
  | (i) Iterated PD | "Passing is like cooperating in PD?" | Step 2 (live play) | "PD has simultaneous moves; here, players *respond* to actions, creating reciprocity." |
  | (ii) Passing = generosity | "P1 passed to be nice to P2" | Step 2 live demo | "Did P1 pass to help P2, or because they wanted P2 to pass later? What must P1 *believe*?" |
  | (iii) BI as prescription | "So we should always take?" | Step 3 (BI intro) | "BI predicts what happens *if* CKR holds. But if others might deviate, taking isn’t best." |
  | (iv) CKR ≠ full recursion | "CKR just means we’re all rational" | Step 4 (CKR definition) | "If P1 knows P2 is rational but P2 *doesn’t know* P1 is rational, could P1 pass rationally?" |
  | (v) Surprise exam fallacy | "This is like the surprise exam paradox" | Step 6 (belief revision) | "In the exam, the conclusion *causes* its falsity. Here, BI is a prediction—when falsified, we revise beliefs, no paradox." |
  | (vi) Experiments prove irrationality | "People pass, so they’re dumb" | After live play | "Passing can be rational if you doubt CKR. Experiments test CKR, not just rationality." |

  ---

  ### Explicit Exclusions & Justifications
  1. **Reputation/incomplete information**: "We’re assuming perfect information and no reputational stakes—real players might pass to *signal* something, but that’s a different model."  
  2. **Trembling hand/forward induction**: "We’re not allowing mistakes or off-path signaling today—BI assumes perfect rationality, so deviations force belief revision, not new equilibria."  
  3. **Surprise exam literature**: "The exam ‘paradox’ debates self-reference, while here, the surprise is empirical evidence against CKR—we’ll stick to game trees."  

  ---

  ### Closing Question
  **"In the 4-node game, if Player 1 passes at the first node, is it possible for Player 2 to rationally pass in response? If so, what must Player 2 believe about Player 1?"**  
  - *Got it:* Yes—if P2 believes P1 is irrational or will reciprocate later.  
  - *Memorized:* "No, BI says take immediately."  

  ---

  **Verdict:** The most damaging misconception left standing is **"Passing is irrational (rather than conditionally rational under revised beliefs)"** — it collapses the epistemic tension into error-making, obscuring how BI’s conjectures depend on CKR’s fragility.
