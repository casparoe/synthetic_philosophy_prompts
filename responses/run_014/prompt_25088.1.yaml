  Based on Diane's verdicts from the five cases, I've identified two underlying principles that fit all of them perfectly. These principles are mutually consistent with her judgments but point in opposite directions for your book reviewer scenario. I'll explain the principles, apply them to your case, and then propose a sixth case that would force Diane to commit to one principle over the other.

  ### The Two Principles
  Diane's verdicts can be explained by two distinct principles related to crowd behavior. Both principles hinge on the **source and nature of the information** guiding the decision:

  - **Principle 1: Wisdom of the Observable Crowd (Action-Based)**  
    This principle holds that it is smart to follow the crowd when you directly observe people's **actions or behaviors** in real-time, especially in situations where those actions reveal immediate, collective preferences or responses to urgent, local conditions. The key here is that the crowd is "voting with its feet" based on direct experience or necessity, making the signal credible and rational. This principle emphasizes revealed preferences—what people do, not what they say.
    
  - **Principle 2: Folly of Unverified Opinions (Advice-Based)**  
    This principle holds that it is not smart to follow the crowd based on **opinions, advice, or second-hand information**, especially when the sources are few, unverified, or prone to bias. Even if multiple people are involved, this principle deems it "dumb" if the decision relies on hearsay, groupthink, or speculative beliefs without independent verification. It prioritizes critical thinking over herd mentality, particularly when stakes are not urgent or sources lack credibility.

  Now, let's map Diane's verdicts to these principles:

  1. **Tourist picks crowded restaurant over empty one**:  
     - **Verdict**: Smart.  
     - **Principle 1 applies**: The crowd's action (dining there) is a direct, observable signal of quality based on immediate experience. No opinions involved—just revealed preference.  
     - **Principle 2 not relevant**: Not opinion-based.

  2. **Character joins bank run without investigating**:  
     - **Verdict**: Smart.  
     - **Principle 1 applies**: The crowd's action (lining up) is an urgent, observable response to a potential crisis. It signals immediate risk, and investigating is impractical.  
     - **Principle 2 not relevant**: Not based on opinions.

  3. **Guy buys stock based on one loud person's tip**:  
     - **Verdict**: Not smart.  
     - **Principle 2 applies**: Relies on unverified advice from a single, potentially biased source (an opinion). No observable crowd action.  
     - **Principle 1 not relevant**: No actions are observed.

  4. **Family evacuates because neighbors are leaving**:  
     - **Verdict**: Smart.  
     - **Principle 1 applies**: Neighbors' actions (evacuating) are a direct, observable signal of danger in an urgent situation. Local and immediate.  
     - **Principle 2 not relevant**: Not opinion-based.

  5. **Character buys house in 2006 because "everyone says" prices rise**:  
     - **Verdict**: Not smart.  
     - **Principle 2 applies**: Based on widespread opinions and speculative beliefs (e.g., "prices only go up"), not observable actions. The context (housing bubble) involves groupthink, and independent verification (e.g., checking market data) is feasible.  
     - **Principle 1 not relevant**: No crowd actions are directly observed (e.g., seeing people buy houses); it's about hearsay.

  ### Which Principle Is Diane Applying to Your Book Case?
  In your scene, the protagonist buys a debut novel solely because five unknown reviewers from unfamiliar outlets gave it five-star ratings. She doesn't read the reviews—just sees the stars.

  - **Diane says this is "dumb," like the party stock tip**:  
    Diane is applying **Principle 2 (Folly of Unverified Opinions)**. Here's why:  
    - The five-star ratings are **opinions**, not observable actions. The protagonist isn't seeing people buy or read the book; she's relying on second-hand assessments from sources with no established credibility (unknown reviewers, unfamiliar outlets).  
    - This mirrors the stock tip case (Principle 2): one loud person at a party is analogous to a small group of unverified reviewers—both are "noisy" opinions that could be biased, fake, or unrepresentative.  
    - Diane would argue that reviews, especially from unknown sources, are easily manipulated (e.g., astroturfing, paid reviews) and lack the immediacy of a crowd's revealed preference. Without reading the reviews or verifying the sources, it's just following hearsay.

  - **You think it's smart, like the restaurant crowd**:  
    You're applying **Principle 1 (Wisdom of the Observable Crowd)**, but there's a key difference:  
    - In the restaurant case, the crowd's action (dining) is a direct, real-time behavior you can witness. For the book, the ratings are not actions—they're opinions. You might see them as a "crowd" of reviewers, but Principle 1 requires observable, in-the-moment actions (e.g., seeing people buy the book in a store).  
    - If your protagonist saw, say, a crowd of people buying the book at a launch event, Principle 1 could apply. But here, it's disembodied ratings, so Diane rejects this.

  **Why the Principles Point Oppositely Here**:  
  - Principle 1 suggests that a "crowd" of reviewers could be like diners if their ratings were treated as actions (e.g., aggregated ratings might indicate wisdom of the crowd). But Diane draws a line: ratings are opinions, not actions.  
  - Principle 2 dominates because the reviewers are unknown and unvetted, making it closer to the stock tip (few, noisy sources) than the housing bubble (many sources, but still opinions in a bubble context).  
  - Diane is likely weighting **credibility and context**: low-stakes decisions (like a book purchase) don't excuse unverified opinions if better options exist (e.g., sampling the book or checking trusted sources).

  ### A Sixth Case to Force Diane to Commit
  To resolve the tension, we need a case where Principles 1 and 2 conflict directly. This means a scenario where observable crowd actions and unverified opinions are both present, but only one principle can "win" based on Diane's logic. The goal is to force Diane to prioritize one principle over the other.

  **Proposed Sixth Case**:  
  *Character sees a long line of people waiting outside a new "pop-up" restaurant in their city. They don't know anything about the food, but they assume it must be good because of the crowd (observable action). However, they also overhear a group of five excited people in the line raving about how it's "the best meal ever" (unverified opinions). The character joins the line solely because of the crowd, ignoring the chatter. Is this smart or dumb?*

  - **Why This Forces Commitment**:  
    - **Principle 1 (Action-Based) would call it smart**: The line is an observable crowd action (like the tourist restaurant), signaling quality through revealed preference. The opinions are incidental.  
    - **Principle 2 (Opinion-Based) might call it dumb if emphasized**: The overheard raves are unverified opinions from a small group (like the reviewers), which could be biased or exaggerated. If Diane focuses on this, she might argue the character should verify (e.g., ask someone in line why they're there).  
    - **Conflict**: Diane must decide whether the observable action (the line) overrides the unverified opinions (the chatter). Based on her past verdicts:  
      - In the evacuation case (Principle 1), seeing neighbors leave is enough, even without news.  
      - In the stock tip case (Principle 2), one person's advice is insufficient.  
      Here, both elements exist, so Diane can't dodge.  

  **Prediction for Diane's Verdict**:  
  She would likely say this is **smart**, committing to **Principle 1 (Wisdom of the Observable Crowd)**. Why?  
  - The line is a direct, observable action (like dining or evacuating), making it a stronger signal than opinions.  
  - Overhearing opinions doesn't change the core decision, which is based on the crowd's behavior. This aligns with her restaurant and evacuation verdicts, where actions trump investigation.  
  - If she called it dumb, she'd contradict her own logic from the restaurant case, where the crowd's presence is sufficient without vetting individuals.  

  **How This Clarifies the Book Case**:  
  If Diane commits to Principle 1 in the sixth case, it underscores why your book scenario is different—it lacks observable actions. For your protagonist, seeing five-star ratings is opinion-based (Principle 2), not action-based, so Diane deems it dumb. If you want to make the book purchase smarter in Diane's eyes, reframe it: have the protagonist see physical evidence of crowd behavior (e.g., the book selling out in stores or a line at a signing), not just reviews.
