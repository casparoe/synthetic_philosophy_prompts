prompt: |-
  Just spent four hours arguing with a friend of mine who sits on the jury for a national prize that goes to whoever made a particular scientific discovery — two names maximum — and I've been quietly keeping score of how she votes, becuase I'm fairly convinced she's running a principle she won't state out loud. Half her data is live nominations, half is her take on the famous old disputes, which she has firm views about too.

  - Newton and Leibniz: won't say either deserved it, on the grounds that calculus was obviously coming. But she'll happily talk for twenty minutes about why the continent used Leibniz's notation while Britain sulked with fluxions for decades. She also thinks the Royal Society's committee on that dispute was corrupt in procedure regardless of who was substantively right, since Newton as president is generally reckoned to have written its findings up himself.
  - Darwin and Wallace: says the joint reading at the Linnean Society was the right shape of answer, and that a jury permitted only one name shouldn't have been asked the question at all.
  - A man who worked a result out completely in the 1930s and never published; the manuscript surfaced in an archive decades later. She voted no retroactive credit — having it in a drawer isn't doing science. Though she also mentioned that his field already had all the pieces in print.
  - A discovery credited to a PI where the instrument that made it possible was built by a lab technician. She got the technician onto the citation and filed a dissent when the rules wouldn't stretch.
  - Same result out of three labs inside a year, six months after the enabling technique was released: declined to award, minuting that the prize would really have gone to whoever had the best postdocs and the biggest machine.
  - Someone who published the right result via a derivation he couldn't defend, with the correct derivation supplied two years later by another person: priority to the second.

  And here's the new one, which is what we actually fell out over. A postdoc has the whole thing, writes it up, and her supervisor sits on the draft because it cuts against the programme his grants are built on. She leaves the field entirely. Eleven years later two well-funded groups get it independently within weeks of each other, each citing the other's preprint. Two names allowed, and the postdoc is alive and contactable.

  So: what does she vote? Give me your best guess and the rule you think she's running — but also be honest about which other rules fit all six of those verdicts equally well and come out differently here, because that's the bit she kept sliding past. Then tell me which further case would actually settle it between the rivals, and whether you think her rule is the right one or just the one she's used to. Answer in British English please.
reasoning: |-
  Hmm, the user has presented quite a complex scenario about their friend who serves on a jury for a scientific prize. They've described six historical cases where this friend made specific voting decisions, and now they want me to predict how she would vote on a new contentious case involving a suppressed postdoc's work. They also want me to identify the underlying principle, alternative principles that would fit the previous cases but differ here, and suggest a test case to settle between rival interpretations.

  Looking at the six cases:

  1. Newton/Leibniz calculus dispute: She refused to award either, arguing calculus was "obviously coming" and criticizing the process rather than awarding priority.

  2. Darwin/Wallace: Supported the joint recognition approach and felt a single-name prize shouldn't address such cases.

  3. Unpublished 1930s manuscript: Voted against retroactive credit since it was unpublished ("having it in a drawer isn't doing science").

  4. PI vs. lab technician: Fought to include the technician on the citation and dissented when rules prevented it.

  5. Simultaneous discoveries after technique release: Declined to award, noting it rewarded resources rather than insight.

  6. Correct result with flawed derivation: Awarded priority to the later researcher with the correct derivation.

  The new case involves a postdoc who completed work that was suppressed by her supervisor, leading her to leave the field. Eleven years later, two groups independently make the same discovery, citing each other's preprints. The postdoc is still alive and contactable.

  I need to identify the underlying principle. The friend seems to value actual scientific contribution and dissemination over mere conception. Key themes emerge: publication is crucial (cases 3 and 6), proper credit for actual contributors (case 4), and skepticism toward awards for inevitable discoveries (cases 1 and 5). She appears to prioritize tangible impact on the scientific community.

  For the new case, I predict she would vote against including the postdoc. Despite having completed the work, it was never published or disseminated, making it functionally equivalent to the unpublished manuscript in case 3. The two groups who published independently would likely get the award.

  Alternative principles that fit all six cases but differ here include:

  - A "conception-only" rule: The postdoc conceived and completed the work first, so she should get priority. This conflicts with case 3 where unpublished work wasn't credited.

  - A "suppression exception": Deliberate suppression creates a special case for retroactive credit. This would be inconsistent with her stance in case 3.

  To settle between these interpretations, a test case could involve someone who privately shared unpublished work that directly influenced later published discoveries. If she awarded retroactive credit in that scenario, it would support a "suppression exception" interpretation; if not, it would confirm her publication-centric principle.

  I think her rule has merit in prioritizing actual scientific communication and community engagement, though it may undervalue contributions hindered by systemic barriers like suppression. The alternative approaches have their own flaws - "conception-only" could lead to endless priority disputes over unpublished work, while "suppression exceptions" might be difficult to adjudicate fairly.
answer: |-
  Right, let's crack this. Your friend's voting pattern reveals a consistent principle, but you're spot-on that there are rival interpretations that fit the first six cases yet diverge on the postdoc scenario. I'll break it down step by step in proper British English.

  ### Your Friend's Likely Vote on the Postdoc Case
  - **Best Guess:** She votes **no** on including the postdoc. The award goes solely to the two groups who published independently in the modern day.
  - **The Rule She's Running:**  
    **"Credit requires *effective contribution to the scientific record*."**  
    This isn't just about who *thought* of it first, but who *put it into the ecosystem* where it could be validated, built upon, or challenged. Unpublished work, suppressed or not, hasn't entered the "conversation" of science. The two modern groups *did* contribute effectively: they published, cited each other, and advanced the field. The postdoc’s draft, like the 1930s manuscript, was inert—it didn’t catalyse progress until others acted.

  ### Why This Rule Fits All Six Prior Cases
  1. **Newton/Leibniz:** Calculus was "obviously coming" → no *unique* contribution; the *notation* debate is about *effective communication* (Leibniz’s won because it was usable).  
  2. **Darwin/Wallace:** Joint reading was the *effective* entry point → prize shouldn’t force a false choice.  
  3. **1930s Manuscript:** Unpublished → no contribution to the record (even if complete).  
  4. **PI vs. Technician:** Technician *built the tool* enabling the discovery → their work was *effectively integrated* into the output.  
  5. **Three Labs Simultaneously:** The enabling technique did the heavy lifting → the labs just applied resources, no *distinctive intellectual contribution*.  
  6. **Flawed Derivation Corrected:** First publishor didn’t establish a *reliable* result → only the second made it *credible* for the community.  

  ### Rival Rules That Fit the Six But Diverge on the Postdoc
  You’re right—she’s likely dodging that other rules *also* explain her votes but demand a different outcome here. Two key rivals:  

  - **Rival Rule 1: "Credit requires *conception + completion*."**  
    Fits the six:  
    - Newton/Leibniz: Both conceived calculus, but it was "inevitable" → no award.  
    - 1930s case: Completed but unpublished → no credit (completion alone isn’t enough).  
    - Flawed derivation: First researcher conceived but didn’t *complete* a defensible proof.  
    **But for the postdoc:** She *conceived and completed* the work in draft form → she should get priority over the modern groups. Your friend would vote **yes, include the postdoc**.  

  - **Rival Rule 2: "Credit requires *good-faith effort to share*."**  
    Fits the six:  
    - Newton/Leibniz: Both shared, but dispute corrupt → no award.  
    - 1930s case: No effort to share → no credit.  
    - Technician: Shared expertise via the instrument → deserves credit.  
    - Flawed derivation: First researcher shared in bad faith (defended shoddy work) → no credit.  
    **But for the postdoc:** She made a good-faith effort (submitted to supervisor), but was *suppressed* → she should get retroactive credit. Vote **yes, include her**.  

  Your friend’s actual rule ("effective contribution to the record") avoids these, treating suppression as tragic but irrelevant—because the work didn’t *enter* the record until the modern groups. That’s why she’s "sliding past" the alternatives: they’d force her to reward the postdoc, which her principle rejects.

  ### The Test Case to Settle Between Rival Rules
  To distinguish her rule ("effective contribution") from "conception + completion" or "good-faith effort", you’d need a case where work was:  
  - **Conceived and completed privately,**  
  - **With good-faith intent to publish,**  
  - **But still unpublished due to *unavoidable* external forces** (e.g., death, natural disaster).  
  **Example:**  
  *A researcher finishes a groundbreaking paper in 1950 but dies suddenly in a train crash before submitting it. The manuscript is found in 2024, confirming they’d solved a problem others cracked only in 2020.*  
  - **Her rule (effective contribution):** Votes **no**—never entered the scientific record.  
  - **Rival rules:** Likely **yes**—conceived/completed *and* good-faith effort thwarted by fate.  

  ### Is Her Rule the Right One?  
  **Partly—but it’s pragmatic, not principled.**  
  - **Why it’s defensible:** Science is communal. Prizes should reward work that *changes the field*, not private insights. Suppression is vile, but retroactive credit for unpublished work sets a messy precedent (e.g., how to verify claims?). Her rule avoids endless archival digs and disputes.  
  - **Why it’s flawed:** It punishes victims of bad systems (e.g., exploited postdocs) and rewards power (e.g., well-funded labs). It also downplays *why* something entered the record—e.g., the modern groups might never have succeeded without the suppressed draft "whispering in the ether" via gossip.  

  **Your friend’s rule feels less like high principle and more like institutional muscle memory.** It’s tidy for prize juries: published work = clear evidence. But it sidesteps science’s human flaws—suppression, inequality, luck. A "better" rule might blend hers with an exception for *proven* suppression, but that’s a minefield.  

  In your argument, I’d wager she dug in because admitting a "suppression exception" would unravel her votes on the 1930s manuscript and the flawed derivation. Stick to the test case—it’s the only way to pin her down. Cheers for the puzzle; it’s a proper head-scratcher.
