  We are going to consider a simple scenario with two agents, Alice and Bob, and a world that can be in one of three states: ω1, ω2, or ω3.
   We will have two versions: 
     Version 1: Common prior
     Version 2: Different priors

   We want to show that in Version 1, after they share their posteriors (and it becomes common knowledge what each believes about a particular event), they will agree.
   In Version 2, they may persistently disagree.

   We choose a simple setting: There is a random variable that takes one of three states. We define an event A that we are interested in. 
   For concreteness, let event A be that the state is either ω1 or ω2 (so A = {ω1, ω2}).

   We will design the information structure (partitions) for Alice and Bob.

   Let's assume the following information structure:

     - Alice's partition: { {ω1, ω2}, {ω3} }
       This means Alice cannot distinguish between ω1 and ω2, but she knows when it's ω3.

     - Bob's partition: { {ω1}, {ω2, ω3} }
       Bob cannot distinguish between ω2 and ω3, but he knows when it's ω1.

   Now, we'll assign a common prior in Version 1 and different priors in Version 2.

   Version 1 (Common Prior):

     Let the common prior P be:
        P(ω1) = 1/3
        P(ω2) = 1/3
        P(ω3) = 1/3

   Now, we compute the posteriors for event A = {ω1, ω2}:

     Alice:
        If Alice sees {ω1, ω2}: 
            P(A | {ω1,ω2}) = P(ω1 or ω2 | {ω1,ω2}) = 1   (since in this set, both are in A)
            Actually, wait: A is exactly {ω1,ω2}, so conditional on being in {ω1,ω2}, A is certain.

        If Alice sees {ω3}: 
            P(A | {ω3}) = 0

     Bob:
        If Bob sees {ω1}: 
            P(A | {ω1}) = 1   (since ω1 is in A)
        If Bob sees {ω2, ω3}:
            P(A | {ω2,ω3}) = P(ω2 | {ω2,ω3}) = (1/3) / ( (1/3)+(1/3) ) = 1/2   [because P(ω2)=1/3, P(ω3)=1/3, so conditional probability of A (which includes ω2 but not ω3) is (1/3)/(2/3)=1/2]

   Now, suppose the true state is ω2. Then:
     Alice sees {ω1,ω2} and so believes P(A) = 1.
     Bob sees {ω2,ω3} and so believes P(A) = 1/2.

   They now announce their posteriors. Alice says: "I assign probability 1 to A." Bob says: "I assign probability 1/2 to A."

   Now, according to Aumann, because they have common priors, they should be able to agree by repeatedly updating.

   How does that work?

   Step 1: 
     Alice learns Bob's posterior (1/2) and Bob learns Alice's posterior (1).

     Now, Alice reasons: 
          "Bob assigns 1/2 to A. That means Bob must have seen the set {ω2,ω3}. But if Bob saw {ω2,ω3}, then the state is either ω2 or ω3. 
           Now, if the state were ω3, then I (Alice) would have seen {ω3} and I would have said 0. But I said 1, so it cannot be ω3. Therefore, it must be ω2."

     Similarly, Bob reasons:
          "Alice assigns 1 to A. That means Alice saw either {ω1,ω2} (and then she says 1) or {ω3} (and then she says 0). But she said 1, so she must have seen {ω1,ω2}. 
           Now, if Alice saw {ω1,ω2}, then the state is either ω1 or ω2. But if it were ω1, I (Bob) would have seen {ω1} and I would have said 1. But I said 1/2, so it cannot be ω1. Therefore, it must be ω2."

     So both now know the state is ω2. Then they both assign probability 1 to A? But note: at ω2, A is true (since ω2 is in A). So they both assign 1 to A.

     However, note that in the above reasoning, they both deduced the state exactly. But what if they don't? 

     Alternatively, we can do the updating without deducing the state:

     After the first announcement, Alice knows that Bob saw {ω2,ω3}. Therefore, Alice updates her information: she now knows that the state is in the intersection of her information set {ω1,ω2} and Bob's information set {ω2,ω3}. That intersection is {ω2}. So she now knows it's ω2.

     Similarly Bob: he knows Alice saw {ω1,ω2}. His information set was {ω2,ω3}. Intersection is {ω2}. So he now knows it's ω2.

     So they both now assign probability 1 to A.

     Therefore, they agree.

   Version 2 (Different Priors):

     Now we change the priors. We let Alice and Bob have different priors.

     Let Alice's prior, PA, be:
          PA(ω1) = 1/2
          PA(ω2) = 1/4
          PA(ω3) = 1/4

     Let Bob's prior, PB, be:
          PB(ω1) = 1/4
          PB(ω2) = 1/4
          PB(ω3) = 1/2

     We keep the same information structure.

     Now, let the true state be ω2.

     Alice's posterior for A given {ω1,ω2}:
          PA(A | {ω1,ω2}) = PA({ω1,ω2} | {ω1,ω2}) = 1? 
          But note: A is exactly {ω1,ω2}, so conditional on {ω1,ω2}, A is certain. So PA(A | {ω1,ω2}) = 1.

     Bob's posterior for A given {ω2,ω3}:
          PB(A | {ω2,ω3}) = PB(ω2 | {ω2,ω3}) = [PB(ω2)] / [PB(ω2)+PB(ω3)] = (1/4) / (1/4 + 1/2) = (1/4)/(3/4) = 1/3.

     So Alice says: "I assign 1 to A." Bob says: "I assign 1/3 to A."

     Now, they announce. What happens?

     Alice reasons: 
          "Bob has posterior 1/3 for A. What information set could Bob have? Bob's information sets are {ω1} and {ω2,ω3}. 
           If Bob had seen {ω1}, he would have computed:
               PB(A | {ω1}) = 1   (because ω1 is in A)
           But he said 1/3, so he must have seen {ω2,ω3}. 

           Now, if Bob saw {ω2,ω3}, then the state is either ω2 or ω3. 
           But I (Alice) saw {ω1,ω2}. So the state must be in the intersection: ω2. 

           Therefore, I know it's ω2. And at ω2, A is true. So I still assign 1 to A."

     Bob reasons:
          "Alice has posterior 1 for A. What information set could Alice have? Alice's information sets are {ω1,ω2} and {ω3}. 
           If she had seen {ω3}, she would have assigned 0 to A. But she assigned 1, so she must have seen {ω1,ω2}. 

           Now, if Alice saw {ω1,ω2}, then the state is either ω1 or ω2. 
           But I (Bob) saw {ω2,ω3}. So the state must be in the intersection: ω2. 

           Therefore, I now know it's ω2. And at ω2, A is true. So I now assign 1 to A."

     It seems they still agree? But wait: we have to use their own priors to update. The above reasoning uses the fact that they deduce the state. But note: they are using the same information structure and the same updating rule. However, the problem is that in the different priors case, the initial disagreement might be due to the priors, but after they deduce the state, they must agree because the state is known.

     But we want a scenario where they can persistently disagree. We must avoid that they deduce the state exactly.

     Therefore, we need to adjust the information structure so that even after learning each other's posteriors and updating, they still have uncertainty.

     Let me try a different information structure that is more symmetric and does not allow complete deduction.

     Revised setting:

     States: ω1, ω2, ω3.

     Alice's partition: { {ω1}, {ω2, ω3} }
     Bob's partition: { {ω1, ω2}, {ω3} }

     Now, define event A = {ω1, ω2} (so ω3 is not in A).

     Version 1 (Common Prior): P(ω1)=P(ω2)=P(ω3)=1/3.

     Posteriors at true state ω1 (which is in A):

        Alice: sees {ω1} -> P(A | {ω1}) = 1 (since ω1 is in A).
        Bob: sees {ω1,ω2} -> P(A | {ω1,ω2}) = P(A ∩ {ω1,ω2}) / P({ω1,ω2}) 
            But note: A = {ω1,ω2}, so A ∩ {ω1,ω2} = {ω1,ω2}. Therefore, P(A | {ω1,ω2}) = 1.

     So both assign 1 to A. They agree.

     Now, let true state be ω2 (which is in A):

        Alice: sees {ω2,ω3} -> P(A | {ω2,ω3}) = P(ω2) / [P(ω2)+P(ω3)] = (1/3) / (2/3) = 1/2.
        Bob: sees {ω1,ω2} -> P(A | {ω1,ω2}) = 1 (as above).

     Now, they announce:

        Alice: 1/2
        Bob: 1

     Now, they update:

        Alice: 
            "Bob has posterior 1. Bob must have seen {ω1,ω2} (because if he had seen {ω3}, he would have computed P(A|{ω3})=0). 
             So the state is in Bob's set {ω1,ω2}. But I see {ω2,ω3}, so the state is in the intersection {ω1,ω2} ∩ {ω2,ω3} = {ω2}. 
             Therefore, I now know it's ω2. Then P(A|ω2)=1? But note: at ω2, A is true. So I update to 1."

        Bob:
            "Alice has posterior 1/2. Alice must have seen {ω2,ω3} (because if she had seen {ω1}, she would have said 1). 
             So the state is in {ω2,ω3}. But I see {ω1,ω2}, so the state is in the intersection {ω2}. 
             Therefore, I now know it's ω2. And I still assign 1 to A (since at ω2, A is true)."

     So again, they agree.

     We need a structure that does not allow the state to be pinpointed after one round.

     Let me try a three-state world but with overlapping partitions that leave some uncertainty.

