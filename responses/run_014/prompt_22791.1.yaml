  The user is right that the dead branch observer doesn't exist to report, so we have an issue of indexical uncertainty. This connects to anthropic reasoning and self-locating beliefs. The pre-measurement observer must consider that they'll only have conscious experiences in branches where they survive. But does that mean they should assign 100% probability to surviving? That seems counterintuitive given the Born rule probabilities.

  I remember David Deutsch and David Wallace have argued for the Born rule in MWI using decision theory. They say rational agents should weight branches by the squared amplitudes. But the user might be questioning whether this is truly derived from MWI or if it's an additional assumption. 

  The observer-moments approach is another angle. If we count conscious experiences, all branches with survival might seem equally real, but the Born rule weights them differently. This tension is central to the debate. The user is likely aware of arguments by Carroll, Sebens, and others on both sides.

  For the quantum immortality claim to hold strictly, it seems to require either treating all branches as equally real (which contradicts the Born rule) or redefining what constitutes "survival" in a way that might feel unsatisfying. The user probably wants to explore whether MWI necessitates immortality or if it's a misinterpretation.

  I should also consider that the user might be developing their own position on this. As a PhD student, they could be looking for gaps in existing arguments or ways to contribute new insights. The mention of self-locating uncertainty suggests they're thinking along the lines of Bostrom or anthropic probability theory.

  The practical implications for the suicide experiment are ethically problematic, but theoretically crucial. The user is likely interested in the conceptual resolution rather than actual experimentation. Their question about "different selves" post-branching indicates they're grappling with personal identity in MWI - a notoriously tricky issue.

