answer: |-
  Your skepticism is well-founded—the "quantum immortality" (QI) argument is far more nuanced than popular presentations suggest, hinging critically on unresolved issues in **self-locating uncertainty**, **branch weighting**, and **personal identity** in the Many-Worlds Interpretation (MWI). Let's break down the key subtleties:

  ### 1. **Self-Locating Uncertainty & Credence Update**
     - **Pre-measurement observer**: Before the experiment, you have a single, unified consciousness with credence `p` for survival (e.g., 30% if Born rule applies).
     - **Post-branching**: MWI splits the world into branches with distinct observers. Crucially:
       - The "alive" branch contains an observer *psychologically continuous* with you.
       - The "dead" branch contains no conscious observer (or a dying one with no future experience).
       - **No "you" to experience death**: As you note, there is no first-person perspective in the dead branch. Only the alive observer can reflect on the outcome.
     - **The updating paradox**: 
       - *Classical intuition*: "I might die, so my credence for survival is <100%." 
       - *Post-hoc QI claim*: "I always find myself alive, so survival was certain!" 
       - **Flaw**: This confuses *pre-branching* uncertainty with *post-branching* experience. The alive observer's certainty is a *selection effect*—they couldn't have observed otherwise. The relevant question is the **pre-measurement credence**.

     - **Resolution via indexical uncertainty**: 
       - Pre-measurement, you should assign credence based on **branch weight** (Born rule), not branch count. 
       - You reason: "With probability `|ψ|²`, I will find myself in a branch where I survive." 
       - **Survival is never certain pre-branching**—your credence should match the Born rule weight (e.g., 30%). 

  ### 2. **Branch Weighting: Born Rule vs. Observer-Moments**
     - **The core conflict**: 
       - *Born rule*: Branches have weights `|ψ|²`. Low-weight branches are "less real" probabilistically.
       - *Counting observer-moments*: Treats all branches equally, ignoring amplitudes. All surviving observers "count" equally.
     - **Quantum immortality requires observer-counting**: 
       - If branches are weighted equally, the vast majority of future branches contain a surviving observer (since death branches terminate). Thus, you "always" survive. 
       - **Problem**: This violates the Born rule. E.g., a 1% survival amplitude would imply 99% pre-branching credence of death—but observer-counting claims 100% survival.
     - **Why Born rule is privileged in MWI**:
       - Derivations like **decision-theoretic** (Wallace, Deutsch) or **envariance** (Zurek) show rational agents must use `|ψ|²` for betting. 
       - Observer-counting leads to absurdities (e.g., predicting unlikely quantum events as "certain" if they ensure survival).

  ### 3. **Does QI Follow from MWI? Only with Controversial Assumptions**
     - **Standard MWI + Born rule → No QI**: 
       - Pre-branching credence for survival equals `|ψ|²` < 100%. 
       - Post-branching, the alive observer's certainty is anthropic bias, not proof of immortality.
     - **QI requires either**:
       1. **Rejecting Born rule weights**: Adopting observer-counting or "all branches equally real" (which most MWI proponents reject).
       2. **Redefining identity**: Arguing that only the surviving observer is "you," so death is never experienced (a tautology, not immortality).
     - **The continuity illusion**: 
       - Each branching event creates distinct observers. The "immortal" observer is a *sequence* of successors, each surviving by chance. There is no continuous self guaranteed eternal life—only chains of survival in increasingly improbable branches.

  ### Key Papers Addressing These Issues
  1. **Carroll & Sebens** (2014): *"Self-Locating Uncertainty and the Origin of Probability in Everettian Quantum Mechanics"*  
     → Argues for Born-rule weighting via self-locating uncertainty. Pre-measurement credences match `|ψ|²`.

  2. **Vaidman** (1998): *"On Schizophrenic Experiences of the Neutron"*  
     → Defends QI by emphasizing that "you" only exist in branches where you survive. Controversial due to implicit observer-counting.

  3. **Tappenden** (2011): *"Evidence and Uncertainty in Everett's Multiverse"*  
     → Critiques QI, showing it conflates temporal identity with branching identity.

  4. **Wallace** (2010): *"How to Prove the Born Rule"*  
     → Derives Born rule from decision theory, undermining QI's observer-counting.

  ### Conclusion
  - **Quantum immortality is not a direct consequence of MWI**—it relies on contentious assumptions (observer-counting, identity redefinition). 
  - **Self-locating uncertainty resolves the paradox**: Pre-branching credence should align with Born rule weights. The alive observer's retrospective certainty is a selection effect, not evidence of inevitability.
  - **Practical implication**: Performing "quantum suicide" is irrational. A 1% survival amplitude means 99% probability (pre-measurement) that all your future branches end in death.

  Your work should focus on clarifying the **ontology of branching observers** and whether **temporal identity** can be mapped onto **branching identity**. The tension between Born-rule weights and observer-moments remains the deepest open question. Would love to discuss specific models you're exploring!
