answer: |-
  Based on your specified criteria – the metaphysics of borderline cases, logic, and the handling of credence/higher-order vagueness – **epistemicism emerges as the more internally coherent and technically defensible account.** Here's the technical comparison and defense, point by point, highlighting where supervaluationism founders:

  1.  **Metaphysics of Borderline Cases:**
      *   **Epistemicism:** Affirms classical bivalence and determinacy. Every object either determinately satisfies a vague predicate (e.g., "is tall") or determinately does not. There is a sharp, unknowable boundary. Borderline cases *are* determinately in or out; our inability to classify them is purely epistemic (lack of knowledge).
      *   **Supervaluationism:** Denies classical bivalence for borderline cases. Truth is defined relative to admissible precisifications (sharpenings) of the predicate. A borderline case `a` for predicate `P` is *indeterminate*: `Pa` is true on some precisifications, false on others. There is *no* fact of the matter whether `a` is *really* `P` simpliciter.
      *   **Assessment:** Epistemicism's commitment to unknowable facts is undeniably counterintuitive. However, it provides a clear and ontologically simple picture: the world is precise, our linguistic/conceptual access is limited. Supervaluationism captures the *phenomenology* of indeterminacy better but seeds its own vulnerability.

  2.  **Logic:**
      *   **Epistemicism:** Wholly preserves classical logic and bivalence. All classical tautologies, inference rules (like Modus Ponens), and the Law of Excluded Middle (LEM: `Pa ∨ ¬Pa`) hold without exception. Vagueness is not a semantic phenomenon requiring logical revision.
      *   **Supervaluationism:** Preserves classical logic *for precise statements* but modifies semantics for borderline cases. Crucially, it retains `A ∨ ¬A` (LEM) as *supertrue* (true on all precisifications), even when neither `A` nor `¬A` is supertrue (e.g., when `A` is borderline). However, it invalidates the Law of Bivalence (every statement is simply true or false) and introduces truth-value *gaps*. Inference rules like Conditional Proof can fail if assumptions involve borderline cases. "True" simpliciter is defined as "supertrue" (true on all admissible precisifications).
      *   **Assessment:** Epistemicism wins on logical simplicity and preservation. Supervaluationism's retention of LEM while denying bivalence and introducing gaps is a technically coherent non-classical logic but requires careful handling to avoid counterintuitive results (e.g., `a` is not tall, `a` is not not-tall, yet `a` is tall or not-tall is true). The key vulnerability for supervaluationism emerges when we consider the *admissibility* of precisifications.

  3.  **Credence and Higher-Order Vagueness:**
      *   **Epistemicism:** Credences are straightforward, albeit constrained. A rational agent's credence that `a` is `P` (e.g., tall) should reflect their epistemic uncertainty about the location of the sharp cutoff. Williamson argues these credences should often be *sharp* (e.g., 0.5 for a paradigmatic borderline case), guided by the underlying distribution of the relevant property (e.g., height) in the context and the agent's knowledge of the semantics. **Higher-order vagueness (HOV)** is no special problem: the boundary between the definite `P`s and the borderline `P`s is *itself* sharp but unknowable. Uncertainty propagates, but the underlying metaphysics remains classical and sharp.
      *   **Supervaluationism:** The natural move is to define the credence that `a` is `P` as the *measure* of the set of admissible precisifications where `a` is in the extension of `P`. This requires a probability measure `μ` defined over the space of all admissible precisifications. **This is where supervaluationism faces its most severe technical crisis.** The collection of admissible precisifications is *itself* vague (due to HOV). Where is the sharp boundary between precisifications that are admissible and those that are not? The theory requires a definite set `S` of precisifications over which to define `μ`. But if `S` is vague (lacks sharp boundaries), then:
          *   Defining `μ` becomes impossible without arbitrary stipulation. What measure space structure applies to a vague set `S`?
          *   The credence `μ({precisifications where Pa})` becomes ill-defined. The fraction presupposes a definite denominator (the size of `S`).
          *   The problem iterates: defining `S` seems to require higher-order precisifications, leading to a vicious regress. Attempts to build HOV into the theory (e.g., using "penumbral connections" or fuzzy admissibility) introduce immense complexity and often collapse back into either sharp boundaries at some level (contradicting the spirit) or indeterminacy about the measure itself (undermining the credence link).
      *   **Assessment:** This is the decisive point. Epistemicism handles credence and HOV relatively cleanly within a classical probability framework over a precise, albeit unknown, world. **Supervaluationism's reliance on a measure over precisifications is crippled by the inherent vagueness of the set of precisifications itself.** The theory lacks the resources to provide a non-arbitrary, well-defined foundation for rational credences in borderline cases without smuggling in sharp boundaries at the meta-level or resorting to indeterminacy about the measure (which defeats the purpose). HOV isn't just a challenge; it exposes a fundamental incoherence in the supervaluationist attempt to ground indeterminacy.

  **Conclusion & Defense of Epistemicism:**

  While epistemically uncomfortable, **epistemicism is technically superior on coherence.** Its core strength lies in its ontological and logical parsimony: it maintains a classical, bivalent metaphysics and logic. Its primary cost – commitment to unknowable sharp boundaries – is significant, but it's a *single*, well-defined cost. Crucially, it handles the technical challenges of credence and HOV without generating new internal contradictions or requiring problematic machinery.

  **Supervaluationism's Vulnerability:**

  Supervaluationism fatally stumbles on the **measure problem** arising from higher-order vagueness. Its central semantic device – the set of admissible precisifications – cannot consistently bear the theoretical weight placed upon it when defining rational credence. The theory promises a world without sharp boundaries but inevitably requires them (or collapses into indeterminacy about its own semantics) at the level of defining its core technical apparatus. This internal tension, particularly regarding the foundation for credences, renders it less coherent than epistemicism.

  **Therefore, based on the technical demands of providing a coherent account of credence and handling higher-order vagueness without internal contradiction, epistemicism is the more defensible account.** Its victory is Pyrrhic for some – preserving coherence by accepting radical epistemic humility – but on the specific technical battlegrounds you outlined, it holds its ground more securely than supervaluationism, whose intuitive appeal founders on the rocks of its own formal requirements. Presenting this stark technical trade-off – classical coherence vs. intuitive indeterminacy, with the former winning on internal consistency despite its counterintuitive consequence – will give your seminar the critical edge you seek.
