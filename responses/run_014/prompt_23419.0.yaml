prompt: |-
  I'm a high school junior, and I'm stuck on a negotiation with my friend and would like a careful second opinion. Over the past year, my friend and I have been building a small app together: I wrote essentially all of the code, and he handled the design, the marketing, and the customer relationships. We've just decided to sell it, and a company has offered $60,000 for the whole package. The buyer doesn't care how we divide that $60,000, so in principle we are free to split it any way we like. The problem is that we can't agree on the division.

  His proposal is a straight 50/50 split, on the grounds that each of us gave up roughly the same number of hours over the year, and he believes that is the only fair way to divide it. I've been uncomfortable with that, though, because I have a concrete outside option: I know a startup that would pay me $30,000 for the codebase alone if I walked away. He has told me that the most he could do on his own — take the design assets and the customer relationships to a local client — would bring in about $5,000. I can't quite articulate why his 50/50 feels wrong to me; on the surface, the idea that equal hours should mean an equal share sounds reasonable, and I don't want to come across as greedy. I have a vague sense that game theorists have developed a formal way to think about exactly this kind of problem — two people dividing a surplus when they have different walk-away options — and I'm wondering whether any of those methods would actually recommend a specific split here, or whether they merely say that any split in some range is defensible.

  If there is a defensible answer, what dollar split does it give, and what is the reasoning behind it? If you work through the formal options, please give, for each theory you consider, the specific dollar split it recommends and a one-sentence explanation of why it produces that number, and say whether his equal-split argument comes out as the right one under any of them. (For context: we've known each other since middle school, and I value the friendship, which is part of why I've been reluctant to push back hard.)
reasoning: |-
  Okay, let me try to figure out how to help this high school junior with their negotiation problem. They built an app with a friend and are selling it for $60,000. The friend wants a 50/50 split because they both put in similar hours. But the junior wrote all the code and has an outside offer of $30,000 for just the code, while the friend can only make $5,000 with their assets. The junior feels uneasy but doesn't want to seem greedy or harm the friendship.

  First, I need to recall negotiation principles. The key here is that equal hours don't necessarily mean equal pay, especially when outside options differ. The friend's argument focuses on input (time), but economics suggests considering walk-away alternatives.

  Looking at game theory models. The Nash Bargaining Solution comes to mind. It considers both parties' best alternatives if they walk away. The formula is: split the surplus after covering each person's outside option. So, the friend's outside option is $5,000, the junior's is $30,000. The total pie is $60,000. The surplus beyond their options is $60k minus $30k minus $5k, which is $25k. Splitting that surplus equally gives each $12,500. Adding back their outside options, the junior gets $30k + $12.5k = $42,500, and the friend gets $5k + $12.5k = $17,500. That's about 71/29.

  But is that the only method? There's also the Shapley Value, which considers each person's marginal contribution. If we think about adding each person to the partnership: without the junior, the friend only has $5k. Without the friend, the junior has $30k. Together, they have $60k. The junior's marginal contribution is $60k minus $5k = $55k. The friend's is $60k minus $30k = $30k. Total marginal contributions are $85k, but that's more than the $60k. So normalizing, the junior gets ($55k / $85k) * $60k ≈ $38,800, and the friend gets ($30k / $85k) * $60k ≈ $21,200, which is about 65/35.

  Another approach is the Outside Option Principle. Here, the junior must get at least $30k, the friend at least $5k. The remaining $25k is split equally, leading to the same $42.5k and $17.5k as Nash.

  Comparing these, the Nash and Outside Option agree on 71/29, while Shapley is 65/35. The friend's 50/50 is $30k each. Under Nash, the junior would get $12.5k more than their outside option, the friend $12.5k more. In Shapley, the junior gets $8.8k above their option, the friend $16.2k above theirs. The 50/50 gives the junior nothing extra beyond their option, while the friend gets $25k extra. That seems unfair since the junior's outside option is stronger.

  Considering fairness beyond economics. The friend values time equally, but the market values their contributions differently. The code is worth more, as shown by the outside offers. Also, the junior took more risk by creating the core product. If the friendship matters, the junior might compromise between 71/29 and 65/35, say 67/33 ($40k/$20k). That way, the friend gets more than their option, and the junior gets some surplus, preserving the relationship.

  Advice for the junior: Emphasize that both contributions were essential but that outside options reflect market value. Suggest a split recognizing both the friend's efforts and the differing alternatives. Propose a range like $38k-$42k for themselves and $18k-$22k for the friend. Frame it as valuing the friendship and wanting a fair outcome based on mutual recognition.
answer: |-
  I understand your dilemma completely—balancing fairness, friendship, and finances is tough, especially with a long-term friend. Let's break this down step by step using formal negotiation principles (game theory) and practical considerations. **The key insight is that equal hours do *not* automatically justify equal pay when your alternatives ("outside options") differ significantly.** Your discomfort is well-founded.

  ### Core Principles
  1. **Outside Options Matter**: Your $30K offer for the codebase and your friend's $5K offer for design/assets set the baseline for what each of you could get if negotiations fail. This creates a "surplus" of $25K ($60K total minus $30K minus $5K) that you must split.
  2. **Value vs. Effort**: Effort (hours) is an input; market value is the output. Your code has higher market demand, which justifies a larger share.
  3. **Friendship Preservation**: A "fair" split should leave both parties feeling respected, not resentful.

  ---

  ### Game Theory Solutions & Their Recommendations
  I'll evaluate three formal models, each giving a specific dollar split. All reject the 50/50 split but vary slightly in their reasoning:

  | **Theory**               | **Your Share** | **Friend's Share** | **Key Reasoning**                                                                 | **50/50 Supported?** |
  |--------------------------|----------------|--------------------|-----------------------------------------------------------------------------------|----------------------|
  | **Nash Bargaining Solution** | $42,500 (71%) | $17,500 (29%)      | Splits the *surplus* ($25K) equally after honoring outside options.              | ❌ No               |
  | **Shapley Value**          | $38,800 (65%) | $21,200 (35%)      | Rewards each player based on their *marginal contribution* to the total value.   | ❌ No               |
  | **Outside Option Principle**| $42,500 (71%) | $17,500 (29%)      | Ensures each gets their outside option plus equal surplus share.                 | ❌ No               |

  #### Detailed Breakdown:
  1. **Nash Bargaining Solution**  
     - **Split: $42,500 for you, $17,500 for your friend**  
     - *Reasoning*: Each party gets their outside option ($30K for you, $5K for them) plus half of the remaining surplus ($25K ÷ 2 = $12.5K each).  
     - Formula: Your share = Your option + ½ × (Total value − Your option − Their option).

  2. **Shapley Value**  
     - **Split: ~$38,800 for you (65%), ~$21,200 for your friend (35%)**  
     - *Reasoning*: Calculates your contribution by averaging what you add to every possible partnership combination. Your code adds $55K in value when paired with their assets ($60K − $5K), while their assets add $30K when paired with your code ($60K − $30K). You get paid proportionally to your marginal contribution.  
     - Formula: Your share = [Your marginal contribution ÷ Total marginal contributions] × Total value = [$55K ÷ ($55K + $30K)] × $60K.

  3. **Outside Option Principle**  
     - **Split: $42,500 for you, $17,500 for your friend**  
     - *Reasoning*: Identical to Nash—this model prioritizes covering each person's "walk-away" price first, then splits the extra value equally.  

  ---

  ### Why the 50/50 Split Is Problematic
  - **Ignores market reality**: Your $30K outside option proves your code is worth 6× more than their assets ($5K). A 50/50 split ($30K each) gives you *no surplus* beyond your solo option, while your friend gets $25K extra—far more than their contribution justifies.  
  - **Risk asymmetry**: You built the core product; if the app failed, your effort had higher opportunity cost (e.g., you could have sold the code).  
  - **Friendship risk**: An unequal outcome could breed resentment. If you accept 50/50, you may feel exploited; if you push too hard, they may feel slighted.

  ---

  ### Proposed Solution: A Fair Compromise
  The theories converge on **you receiving 65–71% ($39K–$42.5K) and your friend receiving 29–35% ($17.5K–$21K)**. Given your friendship, I recommend a **67/33 split ($40K for you, $20K for them)**. This:  
  - Beats both outside options (you get $10K extra; they get $15K extra).  
  - Values their effort (hours) while respecting market signals.  
  - Leaves both parties better off than walking away.  

  #### How to Discuss This With Your Friend
  1. **Acknowledge their contribution**: "Your design and marketing were essential—we couldn’t have sold this without you."  
  2. **Focus on alternatives**: "My $30K offer for the code shows its market value, just like your $5K offer reflects your assets’ value. Splitting evenly ignores that."  
  3. **Propose compromise**: "A 67/33 split ($40K/$20K) means we both get a bonus beyond what we’d make alone. You get 4× your solo option, I get 1.3× mine—that feels fair."  
  4. **Preserve the friendship**: "Our partnership is worth more than this one deal. Let’s find a split that respects both our work and the market."  

  If they resist, ask: *"If our roles were reversed, would you think 50/50 is fair?"* This often clarifies the imbalance.  

  This approach is ethically sound, economically rational, and friendship-preserving. Remember: true fairness rewards *value created*, not just hours logged. Good luck—you’ve got this! 💪
