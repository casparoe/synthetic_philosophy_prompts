answer: |-
  A rational agent who predicts flawed updating should refuse free information if the expected utility (EU) from refusing exceeds the EU from accepting, given their anticipated irrationality. Consider: states A/B, P=0.5. Bet X pays 2 if A, else 0. Bet Y pays 1.2 if B, else 0. Without info, max EU is 1 (choose X). A free 60% accurate test exists (P(+|A)=0.6, P(-|B)=0.6). The agent knows they’ll botch updating: if "+", they’ll believe P(A)=0.9 (true P(A|+)=0.6); if "-", P(A)=0.1 (true P(A|-)=0.4). After "+", they choose X: EU=2×0.6=1.2. After "-", they choose Y: EU=1.2×P(B|-)=1.2×0.6=0.72. Expected EU with test: 0.5×1.2 + 0.5×0.72 = 0.96 < 1. Refusing yields higher EU.
