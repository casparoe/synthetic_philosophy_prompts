prompt: |-
  I am a high school junior. My uncle, who runs a small bookkeeping firm, offers me an even-money bet every Sunday on a coin he flips from a jar on his desk. After two years of keeping a record, I am fairly confident it comes up heads 55 percent of the time, so I have a small but genuine edge. When I asked a friend how much of my savings to stake, he handed me the following argument, which he says settles the question and also shows that talk of "risk tolerance" is confused. The conclusion disturbs me and I suspect a mistake, but I cannot locate it.

  (1) A decision rule is rational only if applying it repeatedly across a long life maximizes the long-run growth rate of your wealth.
  (2) For any bet at fixed odds with a positive edge, offered again and again, the growth rate is maximized by staking the Kelly fraction of your current bankroll — 10 percent in my Sunday case.
  (3) So I should stake 10 percent every Sunday.
  (4) Neither (1) nor (2) says anything about how I feel about risk; the 10 percent is pure compounding arithmetic, not a preference.
  (5) Since (1) governs every bet I face and (2) governs every bet with a positive edge, the same arithmetic fixes the right stake for one-shot bets as well, such as whether to put my college savings into a venture my mentor rates at 55 percent to double my stake and 45 percent to lose it.
  (6) Hence for each bet there is exactly one rational stake, and someone who stakes less is not being cautious but accepting slower growth for no reason at all.
  (7) Yet my aunt staked well under that fraction on a comparable one-shot bet decades ago and retired comfortably, and people who bet for a living are commonly said to prefer half Kelly because it surrenders only a quarter of the growth while cutting the swings roughly in half.
  (8) Therefore (1) is false: long-run growth rate cannot be the standard of rationality.

  Tell me which premise or step you reject and why, explain what made that step look acceptable when I first read it, and then price the alternatives — what I would have to give up elsewhere to keep the steps I would rather not lose. I should say that I would most like to hold on to (2) and (3), since the arithmetic seems to check out when I run the numbers myself. Please state your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of the question. Write in American English.
reasoning: |-
  Okay, the user is a high school junior who's been betting with their uncle on a biased coin and is now questioning the Kelly Criterion after a friend's argument. Their discomfort centers on whether long-run growth maximization should dictate all betting decisions, including one-shot bets like college savings. 

  Hmm, the core tension lies between mathematical optimality (Kelly) and real-world practicality. The friend's argument overextends Kelly by applying it to single bets where long-run growth doesn't apply. I notice the user wants to preserve points 2 and 3 (Kelly math for repeated bets), which is sensible—the math *is* sound for recurring opportunities. 

  The aunt's example exposes the flaw: she succeeded with sub-Kelly staking because one-shot bets don't involve repeated compounding. Risk tolerance matters precisely when you can't rely on the law of large numbers to smooth outcomes. The friend mistakenly treats life as one long series of identical bets, ignoring that some risks (like college savings) are non-repeatable. 

  For the college bet example, expected value maximization would suggest staking 100%, but that's insane for a risk-averse person. The compromise? Size the bet based on personal risk capacity while acknowledging the growth trade-off—that's not irrational, just context-aware. 

  The bottom line: Kelly is perfect for the Sunday coin flips but shouldn't dictate the college gamble. Keep the math for recurring edges, discard the dogma for unique risks.
answer: |-
  I reject step (5) because it falsely assumes that one-shot bets should be treated identically to repeated bets governed by long-run compounding.

  **Why step (5) is wrong:**  
  (1) and (2) only justify Kelly staking for bets that *actually repeat indefinitely*, where the law of large numbers ensures the edge compounds predictably. A one-shot bet (e.g., staking your college savings) has no "long run" — it occurs once. Maximizing long-run growth is irrelevant when there is no repetition. Applying Kelly here ignores catastrophic risk: staking 10% of your *entire savings* on a single 55% bet could wipe out funds needed for tuition, even if the bet is +EV. Your aunt succeeded with sub-Kelly staking because one-shot outcomes are volatile; survival doesn't prove optimality, but it shows risk management has value when you can't rely on repetition.

  **Why it looked acceptable:**  
  Step (5) conflates mathematical generality with practical universality. Kelly's derivation *assumes identical, repeated bets*, so it's tempting to think it "should" apply to any +EV bet. The arithmetic feels transferable, but the underlying assumption (infinite trials) isn't.

  **What you give up to keep (2) and (3):**  
  To retain Kelly for your *actual* repeated Sunday bets (where it works), you must accept that:  
  - **Risk tolerance matters for non-repeatable bets.** Staking less than Kelly on one-shots isn't irrational—it's hedging against unrecoverable losses. Your college savings bet should factor in your ability to absorb loss (e.g., staking 1% vs. 10% based on need for capital preservation).  
  - **Growth maximization isn't the sole standard.** For one-shots, other rational goals exist (e.g., securing minimum wealth), justifying sub-Kelly stakes. This doesn't contradict using Kelly for truly repetitive opportunities like your uncle's coin.  

  **Pricing the alternatives:**  
  - **Sunday bets (repeating):** Kelly's 10% stake maximizes growth. Staking less *does* sacrifice expected long-term growth unnecessarily.  
  - **College savings (one-shot):** Kelly is inappropriate. Rational alternatives:  
    - *Expected value maximization:* Stake 100% (but risks ruin).  
    - *Risk-adjusted:* Use a fraction that limits loss to an acceptable amount (e.g., 1–2% of total wealth). This accepts lower *potential* growth to avoid disaster.  
    - *Half-Kelly for professionals:* Reduces volatility while sacrificing less growth; sensible for *repeated* bets where psychological or operational risks exist (e.g., traders avoiding blowups).  

  **Bottom line:** Keep Kelly for repeated bets (Sunday coin), reject it for one-shots (college gamble), and acknowledge that risk tolerance rationally influences stakes when the long run doesn’t apply.
