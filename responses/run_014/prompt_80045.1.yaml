  1. The mechanism question (a) - exactly how do practical factors enter truth conditions?
  2. Relationship question (b) - are encroachment and contextualism rivals or compatible?
  3. Tension question (c) - knowledge norm vs stake-sensitivity feedback loop
  4. Moral encroachment extension (d) - do moral stakes affect knowledge similarly?
  5. Semantic-pragmatic question (e) - are stake effects semantic or pragmatic?
  6. Knowledge-first compatibility (f) - does encroachment fit with Williamson's framework?

  Now I need to prioritize these, selecting the top three or four. For each prioritized question, I must defend the ordering by explaining: why it's upstream/downstream from others; how tractable it is with current tools; and what evidence might change its priority. I should also explicitly state what I'm deprioritizing and why it has less downstream impact.

  The format requires me to lead with a single sentence naming the most important question and why it's upstream. Then provide reasoning without preamble or summary. I need to be concise and focused.

