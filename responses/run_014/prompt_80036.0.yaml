  ### Decision Tree: The Combination Problem in Panpsychism  
  **Starting Commitment:** Mentality is fundamental and ubiquitous.  

  1. **Case: Fundamental Entities**  
     Consider an electron. Is its mental property the property of a *subject* (i.e., is the electron itself a tiny experiencer)?  
     - **Yes** → Go to 2.  
     - **No** → **Leaf: Russellian Monism** (Intrinsic physical properties are proto-experiential).  
       *Awkward: Explaining how proto-mental properties combine to form macro-subjects without brute gaps.*  

  2. **Case: Fusion**  
     Two beings with separate visual fields are joined into one body with a unified visual field. Is the unified field *constituted by* the two prior fields?  
     - **Yes** → Go to 3.  
     - **No** → Go to 8.  

  3. **Case: Rock-Breaking**  
     A rock (with a putative macro-subject) is shattered. Do the micro-subjects that composed it persist as distinct subjects?  
     - **Yes** → Go to 4.  
     - **No** → Go to 7.  

  4. **Case: Holographic**  
     A scattered subset of micro-subjects (e.g., every other electron in a brain) realizes the *whole* macro-experience. Does this seem plausible?  
     - **Yes** → Go to 5.  
     - **No** → Go to 6.  

  5. **Case: Exclusion**  
     Suppose micro-experiences are causally inert (all causal work is done by physical structure). Does their existence still explain macro-consciousness?  
     - **Yes** → **Leaf: Bottom-Up Panpsychism (Constitution)** (Macro-experience is literally composed of micro-experiences).  
       *Awkward: Micro-experiences are causally excluded yet foundational to macro-consciousness.*  
     - **No** → **Leaf: Unnamed** (Incoherent: Micro-experiences do no work but are deemed necessary).  

  6. **Case: Bee Swarm**  
     Each bee in a swarm is a subject. Is the swarm itself a distinct subject?  
     - **Yes** → **Leaf: Bottom-Up Panpsychism (Constitution)** (As in 5, but rejects holographic cases).  
       *Awkward: Proliferates macro-subjects for arbitrary aggregates (e.g., rocks, swarms).*  
     - **No** → **Leaf: Unnamed** (Unattractive: Denies macro-subjects for systems like brains despite unity).  

  7. **Case: Silicon Simulation**  
     A human brain is perfectly simulated with silicon chips (lacking micro-subjects). Would this system have conscious experience?  
     - **Yes** → **Leaf: Unnamed** (Incoherent: Violates ubiquity of mentality).  
     - **No** → **Leaf: Bottom-Up Panpsychism (Emergence)** (Combination yields novel macro-subjects beyond parts).  
       *Awkward: Brute emergence of subjects from non-subjectively combined parts.*  

  8. **Case: Split-Brain**  
     In a split-brain patient, are there two distinct subjects of experience?  
     - **Yes** → Go to 9.  
     - **No** → Go to 11.  

  9. **Case: Group Subject**  
     Two people in a room focus on a shared task. Is there a *group subject* over and above the two individuals?  
     - **Yes** → **Leaf: Unnamed** (Polypsychism; unattractive due to infinite regress of subjects).  
     - **No** → Go to 10.  

  10. **Case: Cosmic Unity**  
      Is the universe a single subject whose experiences ground all micro-subjects?  
      - **Yes** → **Leaf: Cosmopsychism** (Top-down derivation from a cosmic subject).  
        *Awkward: Explaining how one cosmic subject "decombines" into finite subjects.*  
      - **No** → Go to 11.  

  11. **Case: Unified Attention**  
      You focus on a red apple while ignoring background noise. Is your unified attention *real*?  
      - **Yes** → Go to 12.  
      - **No** → **Leaf: Illusionism about Unity** (No unified subject exists to combine).  
        *Awkward: Denies the intuitive certainty of personal unity.*  

  12. **Case: Philosophical Dissolution**  
      Does the combination problem vanish if "subject" is a loose, non-fundamental concept?  
      - **Yes** → **Leaf: Deflationary View** (Combination is a pseudo-problem).  
        *Awkward: Dismisses a persistent puzzle as linguistic confusion.*  
      - **No** → **Leaf: Unnamed** (Unexplored: Rejects all existing solutions).  

