  - **Indistinguishable Leaves**:  
    - *Bottom-Up (Constitution)* paths (via 5 and 6) are not separated by the holographic case’s outcome. Both converge on constitution but differ only in their tolerance for scattered parts.  
    **Why**: The tree prioritizes structural commitments (e.g., causal exclusion, subject proliferation) over holographic intuitions.  

