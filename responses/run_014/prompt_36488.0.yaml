prompt: |-
  Kept getting into it with a guy on a forum about whether an AI could ever really understand itself, and every time I'd push on something he'd come back with "no system can see its own blind spots -- Gödel proved it". Thing is, over the thread he seemed to be using that line for at least three different things: that a formal system can't prove certain statements about itself, that there are truths no possible system could ever prove, and that a mind can always step outside whatever rules it's following and look down at them. I'm pretty sure those aren't the same claim and I'm pretty sure their not all true, but I can't say which is which.

  I'd just started reading Gödel, Escher, Bach around then, and the part where you're asked whether the string MU can be produced from MI by following the rewriting rules, and the way you settle it is by mapping the strings onto numbers and checking what the rules do from outside, feels like exactly what he was gesturing at -- but it also looked to me like when you jump out of that system you just land in a new one, so maybe it cuts against him?

  Can you lay out the distinct precise claims that could be hiding in "no system can see its own blind spots" -- from the boring mathematical one to the radical ones about minds or machines -- and for each say whether it's a theorem, a contentious philosophical thesis, or straight up false? And then tell me which reading, if any, the MU puzzle business actually supports, and whether any of the readings gets him his conclusion about AI?
