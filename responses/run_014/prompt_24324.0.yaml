prompt: |-
  I'm trying to pin down what I actually think about the difference between knowing how to do something and knowing that something is the case, and I'd like to see whether my reactions to a set of cases hang together or whether I'm just being inconsistent. I'll report my verdicts case by case, mostly by gut, and then I'll ask you for the principle, if any, behind them.

  Start with the two I'm confident about, to set a baseline. I can ride a bicycle, but if you pressed me to explain the mechanics of balance I'd give you a muddled, probably wrong account; I know how to ride a bike, obviously. By contrast, I have read a very detailed manual on changing a tire and can recite every step in the right order, but I have never actually changed a tire and I'm confident I would fumble the jack; I do not know how to change a tire — I know that, if I followed the manual, I would change a tire. Those two feel like they should fall out of the same principle, and I'm not yet sure what that principle is.

  Now the cases where I'm less sure I'm consistent. I know how to swim, but suppose I'm in a lake with my arms zip-tied behind my back so that I literally cannot swim right now. I still feel that I know how to swim: the zip ties prevent me from swimming, they don't take the knowledge away from me. So for me, knowledge how seems to survive being temporarily blocked from being exercised. I can also recognize my next-door neighbor's face in a fraction of a second, though I could not describe the specific features that let me do it; my gut says I know how to recognize my neighbor, though I'm not sure that's the same kind of thing as knowing how to ride a bike. And I can work through a long-division problem by following the standard algorithm step by step, but I could not explain why the algorithm works, and if you asked me to do the same division in base seven I'd be lost; I'd say I know how to do long division, but only the ordinary base-ten kind, not long division in general. So my knowledge how comes in domain-specific packages, and I don't know how to state the domain.

  Here is the set I keep going back and forth on, because the three cases look to me like they should come out the same and I can't see why I'm treating them differently. In each, I can, if I set my mind to it, bring about a mental state on command.

  First, imagining: I can, deliberately and repeatedly, bring a vivid image before my mind — say, imagine in detail what it would be like to perceive the world in ultraviolet — and I can stop when I want. I'd say I know how to imagine. There's no ambiguity here; it feels like a straightforward ability, the same register as riding a bike.

  Second, believing: here I'm split. On one hand, I cannot, no matter how hard I try, bring myself to believe something I have strong evidence against — I can't just decide that the earth is flat — so "knowing how to believe" feels incoherent to me, as if the "how" were pointing at something that isn't a doing at all. On the other hand, when I have good evidence for a claim but am resisting it, I can bring myself to believe it by attending to the evidence and letting it register; I've done that deliberately, e.g. convincing myself a project will work by re-reading the data. So I hold both a "no, belief isn't something you do" verdict and a "yes, I know how to get myself to believe true things" verdict, and I can't make them consistent.

  Third, willing: the same structure. I cannot will myself to want something I have no reason to want — the attempt to will myself into wanting it just doesn't land. But I can will myself to act on a reason I already have, by rehearsing it and committing; I've willed myself to get up early that way. So again a "no" and a "yes" sitting in the same case.

  Is there a principle — or a small set of candidate principles — that captures all of these verdicts, or at least most of them? For each candidate, state it precisely, tell me which of my cases motivates each clause, say what it predicts for a case I haven't listed (for instance, someone who can solve a scrambled Rubik's cube by heart but couldn't handle a variant with a different color scheme, or a person who knows how to drive a stick shift but has never driven one with an automated clutch), and be honest about which of my verdicts it cannot accommodate. In particular, I'd like to know whether the swimmer-with-zip-ties verdict and the tire-manual verdict can both be kept, and whether the imagine/believe/will trio can be reconciled at all, or whether I have to give up one of the three — and if so, which one, and on what principle.
reasoning: |-
  Hmm, this user is wrestling with the philosophical distinction between procedural knowledge (knowing how) and declarative knowledge (knowing that). They've presented a series of thought experiments testing their intuitions about when "know how" applies. 

  The bicycle vs tire manual cases are classic - the user correctly identifies that embodied skill differs from theoretical knowledge. But things get interesting when they introduce constraints: the zip-tied swimmer shows they view know-how as dispositional rather than performative. The neighbor recognition case suggests pattern-matching abilities count as know-how even without conscious access. The base-specific long division reveals they see skills as domain-bound.

  Now the real puzzle: why do they treat imagination differently from belief and volition? Their struggle mirrors Gilbert Ryle's original distinction where he excluded "intellectual acts" from know-how. The user's intuition that believing isn't "something you do" aligns with William Alston's work on doxastic involuntarism. 

  For reconciliation: the "bringing about" test seems key. When the user describes evidence-weighing as "getting myself to believe", they're actually describing meta-cognitive actions (attention direction, evidence review) that facilitate belief formation. Similarly, their "willing" example involves practical reasoning to activate existing motivations. This suggests a layered principle: know-how applies to controllable actions, while belief/desire formation are states we influence indirectly through such actions. 

  The zip-ties and tire cases can coexist under a "disposition + minimal capability" framework: the swimmer retains the motor schema while constrained, but the tire theorist lacks even basic mechanical dispositions. For novel cases: the Rubik's variant would be domain-specific know-how if solvable with schema adaptation; the clutch driver would retain core shifting competence since automation handles the novel component. 

  Ultimately the tension in belief/willing cases comes from conflating direct control (which we lack over beliefs) with indirect influence (which we have via cognitive actions). The user might resolve it by distinguishing "knowing how to form beliefs" (valid) from "knowing how to believe arbitrarily" (invalid).
answer: |-
  Based on your detailed verdicts, the most coherent principle unifying your intuitions is **the Dispositional Ability Principle (DAP)**:

  **An agent knows how to φ if and only if they possess a reliable, intentional disposition to successfully φ (or progress toward φ-ing) when they try in normal conditions for that φ-ing, where:**
  1. **"Disposition"** implies stable competence, not necessarily current capacity (motivated by zip-tied swimmer).
  2. **"Intentional"** requires the agent to control the action as a means to an end (motivated by imagination vs. involuntary belief).
  3. **"Normal conditions"** are domain-specific and include necessary tools/conventions (motivated by base-ten long division and tire manual case).
  4. **"Progress toward φ-ing"** allows partial success to count (e.g., fumbling but eventually changing a tire might qualify; utter failure wouldn't).

  ---

  ### How DAP Explains Your Cases
  1. **Bicycle Riding**: You have a reliable disposition to balance/steer *intentionally* when trying under normal cycling conditions.  
     → *Know-how* ✅  
  2. **Tire Changing**: Reciting steps ≠ disposition to *perform* the actions. No reliable ability when trying.  
     → *No know-how* ✅  
  3. **Zip-Tied Swimmer**: Disposition remains intact; inability is due to *abnormal* conditions.  
     → *Know-how survives* ✅  
  4. **Neighbor Recognition**: Reliable disposition to intentionally identify them (even if subpersonal).  
     → *Know-how* ✅  
  5. **Base-Ten Long Division**: Reliable disposition *only* under normal (base-ten) conditions.  
     → *Domain-specific know-how* ✅  
  6. **Imagining Ultraviolet**: Direct intentional control over the mental state.  
     → *Know-how* ✅  
  7. **Believing/Will Conflicts**:  
     - *Cannot believe the flat Earth*: No intentional control over accepting falsehoods → *Not know-how* ✅  
     - *Can get yourself to believe via evidence*: Disposition to intentionally deploy attention/reasoning (actions) that *cause* belief.  
       → *Know-how to influence belief* ✅ (consistent with "no" for direct belief)  
     - *Willing yourself to act*: Disposition to intentionally rehearse reasons → *Know-how to activate volition* ✅  

  **Reconciliation**: DAP distinguishes between **direct know-how** (controlling an action/state) and **indirect know-how** (controlling actions that *generate* a state). You lack direct know-how over beliefs/desires but possess indirect know-how via metacognitive actions.

  ---

  ### Predictions for New Cases
  | Case | DAP Prediction | Why |
  |-------|---------------|-----|
  | **Rubik's Cube solver (by heart)** | *Know-how only for that color scheme* | Disposition fails under abnormal (recolored) conditions. |
  | **Stick-shift driver facing automated clutch** | *Know-how retained* | Core disposition (gearshift coordination) works; novel condition is minor adaptation. |
  | **Chess player who knows all rules but never played** | *No know-how* | Reciting rules ≠ disposition to play successfully when trying. |

  ---

  ### Limitations and Tensions
  1. **The Tire Manual Edge Case**:  
     If you *could* fumble through and succeed (despite uncertainty), DAP *might* grant "partial know-how" – but your verdict rejects this. To strictly match your intuition, DAP needs refinement:  
     → **Add "minimal fluency" clause**: Success must not rely *heavily* on external guidance during execution.  
     *(This preserves your tire verdict while allowing e.g., "knows how to cook pasta" for someone who needs to glance at instructions but executes smoothly).*

  2. **Belief/Will Nuance**:  
     Your "yes" for *influencing* belief/will depends on interpreting "try" as trying to *perform preparatory actions* (attending to evidence), not trying to believe directly. If "trying to φ" requires direct control, the indirect cases break.  
     → **Your verdicts hold only if "φ-ing" in "know how to φ" can be gerundive (e.g., "getting yourself to believe")**.

  ---

  ### Conclusion
  **Your intuitions hang together under DAP** with two caveats:  
  - Knowledge-how requires **domain-constrained dispositions + intentional control**.  
  - For belief/will, you implicitly treat "knowing how to φ" as **sometimes meaning "knowing how to bring about φ"** (where φ is a state).  

  To resolve inconsistency in the belief/will trio: **Abandon the idea that belief/volition are *direct* actions**. Instead, consistently treat them as *states* you can *indirectly influence through actions you know how to perform*. This preserves all three verdicts:  
  - Imagination: Direct action.  
  - Belief/Will: Indirect influence via deliberate metacognition.  

  This aligns with Rylean anti-intellectualism while accommodating your nuanced distinctions.
