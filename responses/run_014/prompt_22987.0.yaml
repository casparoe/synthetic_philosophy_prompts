  okay so ive been reading about this thing where people try to prove that your beliefs have to be probabilities using something called epistemic utility. the idea is that only probabilistic beliefs maximize your expected accuracy, so you should have probabilistic beliefs. and the whole selling point is that its a 'non-pragmatic' argument, supposedly different from the dutch book argument which is all about not getting ripped off with bets and money. but im confused bc the epistemic utility argument literally just says 'maximize expected utility' (where utility happens to be accuracy). so its using the exact same decision theory tool as the dutch book argument. if its using the same method, how is it 'non-pragmatic'? the label seems backwards or just empty to me. what am i missing?
