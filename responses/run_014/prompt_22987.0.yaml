answer: |-
  You've hit on a genuinely subtle and debated point in formal epistemology. Your confusion is absolutely understandable – the distinction *isn't* about the mathematical tool (expected utility maximization), but about **what the utility represents and what values are being promoted.** Let's break it down:

  1.  **The Dutch Book Argument (Pragmatic):**
      *   **Goal:** Avoid *practical disaster* (losing money no matter what happens).
      *   **Utility:** Represents *practical value* (money, resources, avoiding financial loss).
      *   **"Why should I care?" Answer:** Because if you don't have probabilistic beliefs, you can be exploited and suffer concrete, tangible losses in the real world (e.g., losing all your money in a series of bets). It appeals to your practical self-interest.
      *   **Requires:** A connection between belief and *action* (betting behavior).

  2.  **The Epistemic Utility Argument ("Non-Pragmatic"):**
      *   **Goal:** Maximize *accuracy* or *correctness* of your beliefs (epistemic virtue).
      *   **Utility:** Represents *epistemic value* (closeness to truth, accuracy, avoiding falsity). This is often formalized using scoring rules (e.g., Brier score, logarithmic score).
      *   **"Why should I care?" Answer:** Because, as a cognitive agent aiming to have *true* beliefs about the world, this is what *accuracy itself demands*. It appeals to your epistemic goal of having correct representations of reality.
      *   **Requires:** A commitment to valuing *accuracy* as the sole or primary epistemic good. No connection to practical action or consequences is needed.

  **Why the "Non-Pragmatic" Label (Despite Using EU)?**

  1.  **The Nature of the Value:** The key difference is the *type* of value being maximized.
      *   **Dutch Book:** Maximizes *pragmatic, instrumental* value (avoiding financial loss).
      *   **Epistemic Utility:** Maximizes *epistemic, intrinsic* value (accuracy for its own sake). The utility function represents an epistemic ideal, not a practical payoff.
      *   **Analogy:** Imagine two ways to argue you should eat vegetables:
          *   **Pragmatic:** "If you don't eat vegetables, you'll get sick and incur medical bills." (Avoids practical loss).
          *   **Non-Pragmatic (Health-Focused):** "Eating vegetables maximizes your expected health score." (Promotes an intrinsic good - health - defined independently of money or disasters). Both use "maximize expected outcome," but the outcomes are fundamentally different types of goods.

  2.  **Independence from Action/Consequence:** The epistemic utility argument aims to show that probabilistic beliefs are *epistemically optimal* purely in terms of representational accuracy, even if those beliefs *never* lead to any action with practical consequences. You could be a brain in a vase, solely concerned with having accurate beliefs about your environment, and the argument would still apply. The Dutch book argument fundamentally relies on the link between belief degrees and *betting dispositions*, which are actions with consequences.

  3.  **The "Should" is Different:** The "should" in the Dutch book argument is hypothetical: *"If* you engage in betting based on your beliefs, *then* you *should* have probabilistic beliefs to avoid guaranteed loss." The "should" in the epistemic utility argument is categorical concerning the epistemic goal: *"If* your goal is to have maximally accurate beliefs (an epistemic goal), *then* you *should* have probabilistic beliefs." It bypasses any "if you engage in this practice..." clause.

  **Addressing Your Core Insight & What You Might Be Missing:**

  You are absolutely correct that both arguments **leverage the same formal machinery of decision theory (maximize expected utility)**. That's undeniable. The distinction lies entirely in the **interpretation of the utility function** and the **source of normativity**:

  *   **Dutch Book:** Normativity comes from avoiding *practical irrationality* (being exploited).
  *   **Epistemic Utility:** Normativity comes from adhering to *epistemic rationality* (pursuing accuracy as the fundamental epistemic good).

  **The Crucial Move:** Epistemic utility theorists **define** what counts as an "accurate" or "good" belief state *independently of probability* (using scoring rules). They then prove that *only* probabilistic belief states (credences) have the property that they **maximize expected accuracy** *according to themselves*. (This is the "no self-sabotage" or "immodesty" property: your own credences judge themselves to be the best for achieving accuracy).

  **Is the Label Perfect? Is it *Truly* Non-Pragmatic?**

  This is debated! Critics (like yourself) point out:

  *   **Formal Similarity:** The reliance on expected utility maximization *feels* pragmatic at its core, even if the utility is epistemic.
  *   **Why Value Accuracy?:** One can still ask, "Why *should* I care about maximizing expected epistemic accuracy?" Is *this* norm itself grounded in something deeper, perhaps pragmatic? (Some argue it is; epistemic utility theorists often take valuing accuracy as a foundational epistemic norm).
  *   **"Non-Pragmatic" Might Mean "Not *Directly* Pragmatic":** The argument doesn't appeal to *practical* consequences like money or survival. It appeals directly to an epistemic ideal.

  **Conclusion:**

  You're not missing a fundamental mathematical difference; you've correctly identified the shared formal engine. The "non-pragmatic" label primarily signifies that the argument:

  1.  **Targets Epistemic Goals:** It justifies probabilistic beliefs based *solely* on the intrinsic epistemic value of accuracy, not on avoiding practical disasters.
  2.  **Doesn't Require Action Link:** It works without needing to connect beliefs to betting or actions with practical consequences.
  3.  **Uses Epistemic Utility:** The "utility" represents epistemic success (accuracy), not practical gain.

  While the *method* (EU maximization) is shared with pragmatic arguments, the *values* promoted and the *type of rationality* addressed (pure epistemic rationality vs. practical rationality) are distinct. The label highlights that the argument tries to stand on purely epistemic grounds, avoiding any appeal to pragmatic self-preservation or instrumental reasoning about non-epistemic goods. Whether it *fully* succeeds in being "non-pragmatic" in the deepest philosophical sense remains a point of discussion.
