prompt: |-
  Compare Hofstadter's superrationality with Aumann's agreement theorem. Both rest on the intuition that rational agents who know their counterparts are rational end up aligned, but one is a decision rule and the other a theorem about beliefs. In exactly five numbered points, each one or two sentences, with no introduction or conclusion, address: (1) the shared core intuition each exploits; (2) what each actually governs — decisions versus beliefs, and why that distinction matters; (3) the load-bearing assumption each depends on (a common prior, versus a common decision procedure or "facing the same problem"); (4) what each does when its core assumption fails — a diagnosis of broken assumptions in Aumann's case, a predicted failure mode in the superrational case; and (5) whether Aumann-style agreement about beliefs is enough to license the superrational move in the prisoner's dilemma, given that the "event" in question is the other player's own action rather than an exogenous state, or whether the move depends on a stronger "common algorithm" principle that Aumann's framework does not supply.
reasoning: |-
  Hmm, the user wants me to compare Hofstadter's superrationality with Aumann's agreement theorem. They've provided a very structured request with five specific points to address. This seems like an advanced topic in decision theory and game theory.

  I need to recall what these concepts are. Hofstadter's superrationality is a decision rule where players in symmetric games like Prisoner's Dilemma coordinate by assuming they'll make the same decision. Aumann's agreement theorem is a mathematical result showing that rational agents with common priors can't agree to disagree about probabilities.

  For point 1, both concepts share the core intuition that rationality plus mutual awareness of rationality leads to alignment. That's the common thread.

  For point 2, I should emphasize that superrationality governs decisions in games, while Aumann's theorem governs beliefs about states of the world. The distinction matters because actions can directly influence outcomes, unlike beliefs which are about information.

  For point 3, the key assumptions differ: Aumann relies on a common prior belief, while superrationality assumes symmetry and identical reasoning processes. Without these, each framework breaks down.

  For point 4, when assumptions fail, Aumann allows disagreement which reveals prior differences, while superrationality just fails to achieve coordination when players aren't symmetric.

  For point 5, the tricky part is whether Aumann-style belief agreement enables superrational cooperation. I think it doesn't, because superrationality requires assuming identical actions, which goes beyond shared beliefs about the world.

  The user seems knowledgeable about game theory, probably a student or researcher. They're asking for precise, structured answers without fluff - just the five numbered points as requested. I'll keep each point concise with one or two sentences as specified.
answer: |-
  1.  Both exploit the intuition that mutual knowledge of rationality, combined with shared perspectives or information, compels alignment (in actions or beliefs) to avoid self-defeating inconsistency.
  2.  Superrationality governs *decisions* in symmetric games (like Prisoner's Dilemma), demanding action coordination; Aumann governs *beliefs* about states of the world. This matters because actions directly determine payoffs, while beliefs inform decisions about actions.
  3.  Aumann depends critically on a *common prior* probability distribution over states. Superrationality depends on agents facing an *identical symmetric problem* and knowing they will apply the *same decision procedure*.
  4.  If Aumann's common prior fails, persistent disagreement reveals differing priors. If superrationality's symmetry/common procedure fails (e.g., agents doubt identical reasoning), coordination collapses as agents defect.
  5.  Aumann-style agreement about beliefs (e.g., agreeing the game is symmetric) is *not* sufficient; superrational cooperation requires the stronger assumption of identical action due to a common algorithm, as the "event" (other's action) is endogenous and chosen simultaneously.
