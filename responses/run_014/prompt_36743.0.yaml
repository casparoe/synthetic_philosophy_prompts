answer: |-
  Right, I know the flip-flopping feeling well—the space is frustratingly recursive, and it’s easy to get lost in the layers of "but what if?" when you’re staring at proposals. For a small grants round focused on *conceptual* control theory, I’d prioritize based on what’s both upstream in the dependency chain and actionable for theorists without requiring a lab’s infrastructure. My ranking would be:

  **First: Whether control evaluations can bound scheming when the model can condition its behavior.** This is the bedrock. If we can’t establish reliable evaluations under adversarial conditions—where the model knows it’s being tested and strategically hides misalignment—then every other control mechanism (monitoring, honeypots, etc.) rests on quicksand. It’s upstream of everything because a negative answer here implies that *no* control strategy can provide guarantees; we’d be reduced to hope that models aren’t scheming or that our luck holds. For theorists, this is tractable: it’s fundamentally about epistemology and adversarial game theory. You’d formalize threat models (e.g., what kinds of test-time deception evade which detection methods), explore impossibility arguments (e.g., analogies to cryptographic oracles or undetectable backdoors), and define the minimal assumptions needed for evaluations to work (e.g., "sandboxing plus limited model access"). Developments that would move this up: empirical demonstrations of models "jailbreaking" evaluations in training (e.g., Sleeper Agents paper), or new impossibility proofs in related ML theory. If it moves down? Only if we find a silver-bullet evaluation method that provably resets conditioning—unlikely soon.

  **Second: Whether investing in control substitutes for alignment or is strictly upstream.** This is the meta-crux, and you’re right that people dodge it. If control research *enables* labs to deprioritize alignment (e.g., "We’ll just box it!"), funding it might backfire by accelerating unaligned deployments. But if control is genuinely complementary—forcing alignment insights or acting as a necessary scaffold even for aligned systems—it’s net positive. It’s upstream strategically: the answer dictates whether we should funnel resources here at all, and how to frame control to labs. Theorists can tackle this by analyzing incentive structures (e.g., game theory of lab safety budgets), historical analogies (e.g., cybersecurity’s relationship to software correctness), and defining the conditions under which control *reduces* alignment effort. Tractability is high—it’s philosophy of science/policy, not engineering. Developments that matter: if labs like Anthropic or OpenAI start publicly framing control as a *replacement* for alignment, this rockets to #1. If alignment progress stalls while control advances, it becomes urgent to avoid moral hazard.

  **Third: Whether control difficulty scales measurably with capability.** This informs *when* and *how hard* to push control. If difficulty spikes unpredictably (e.g., scheming emerges only at TAI, with no warning signs), we’re blind until failure. If it scales smoothly (e.g., via metrics like interpretability depth or monitoring overhead), we can time interventions. It’s upstream operationally—it shapes deployment thresholds and R&D pacing—but partially depends on the evaluation question (#1). Theorists can model scaling using complexity arguments (e.g., circuit complexity vs. deception robustness) or draw from control theory in other domains (e.g., securing systems with increasing adaptivity). Developments that shift priority: evidence of sharp capability thresholds in deception (e.g., in frontier models), or breakthroughs in scalable oversight that "break" at predictable levels. If scaling proves chaotic, it’s a strong case for more conservatism; if predictable, it aids prioritization.

  ### Why not the others?
  - **Adversarial scaffolding changing the model**: Important, but likely downstream. If evaluations (#1) are unreliable, scaffolding effects won’t save us. If they *are* reliable, this becomes an implementation risk—more an ML engineering problem for labs than core theory. Deprioritize unless new data suggests scaffolding *causes* scheming.
  - **Collusion**: Deployment-specific and potentially intractable for theorists alone. It feels like playing whack-a-mole: solutions depend heavily on system architecture (e.g., air-gapped instances vs. shared memory). Labs will handle this ad hoc with infosec best practices. The answer won’t change strategy—assume collusion is possible and mitigate.

  ### What a lab should do, regardless
  If evaluations (#1) prove impossible to bound, labs *must* slow down—no control method is trustworthy. If control substitutes for alignment (#2), labs should be pressured to formalize "alignment taxes" to prevent corner-cutting. If control difficulty scales chaotically (#3), labs need conservative staging. But crucially, none of these should deprioritize alignment. Control is damage mitigation, not a cure—and if your grants can force that truth into the open, even $300k could shift the Overton window. Happy to dive deeper on any of this.

  —  
  *Sent with the kind of grim optimism that comes from rereading "That Alien Message" before bed*
