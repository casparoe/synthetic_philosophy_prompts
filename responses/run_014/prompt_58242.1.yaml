answer: |-
  ### Decision Procedure for Grading Analogical Reasoning Completions  
  **Goal**: Classify each candidate completion as **acceptable** (A), **strained but defensible** (S), or **incorrect** (I), with a one-sentence justification.  
  **Core Principles to Preserve** (simplified for consistency):  
  - **Literal vs. Slipped Concepts**: Key concepts (e.g., `successor`, `predecessor`, `group`, `leftmost`, `alphabetical order`) must be preserved literally *or* via a "principled slippage" (e.g., successor → predecessor, left → right, wrap → mirror).  
  - **Snag Handling**: Boundaries (e.g., end of alphabet) must be resolved via wrapping, mirroring, or refusing (no change) in a way consistent with the source.  
  - **Structural vs. Surface Similarity**: Avoid mistaking surface changes (e.g., swapping letters) for structural changes (e.g., preserving a transformation pattern).  

  **Concepts Safely Dropped for Speed**:  
  - Deep theoretical justifications for slippage (e.g., "why is mirroring principled here?").  
  - Minor edge cases (e.g., case sensitivity, non-alphabetic characters—assume all inputs are lowercase letters).  
  - Multi-step reasoning (e.g., "the model might have thought X then Y"). Focus on the output.  

  **Procedure Flowchart**:  
  1. **Identify Source Transformation**  
     - *Question*: What changed from source input to source output? (e.g., `abc→abd` = "last letter incremented").  
     - *Criteria*: Sufficient if the core concept (e.g., `successor`) is clear.  
     - *Stopping Point*: If unclear, escalate to supervisor.  

  2. **Apply Core Concept Literally to Target**  
     - *Question*: Does applying the *literal* source concept to the target produce the candidate?  
     - *Criteria*:  
       - **A** if yes, and boundaries match (e.g., no snags).  
       - **I** if no, and boundaries are ignored/handled arbitrarily.  
       - Proceed to Step 3 if boundaries differ (e.g., source had no snag, target does).  

  3. **Check for Principled Slippage**  
     - *Question*: Is the candidate a principled adaptation of the source concept (see table below)?  
     - *Criteria*:  
       - **A** if slippage is common and contextually consistent (e.g., `successor` → `predecessor` at alphabet end).  
       - **S** if slippage is defensible but unintuitive (e.g., `leftmost` → `rightmost` with weak justification).  
       - **I** if slippage is arbitrary (e.g., no clear reason for `successor` → `predecessor`).  
     - *Flag for Escalation*: Uncommon slippage not in table below.  

  4. **Verify Snag Handling**  
     - *Question*: If the target hits a boundary (e.g., end of alphabet), is it resolved via wrapping, mirroring, or refusing?  
     - *Criteria*:  
       - **A** if consistent with source (e.g., source wrapped → candidate wraps).  
       - **S** if inconsistent but plausible (e.g., source wrapped → candidate mirrors).  
       - **I** if arbitrary (e.g., `z` → `m` with no rationale).  
     - *Stopping Point*: If handling is ambiguous, mark **S** and escalate.  

  5. **Check for Surface Similarity Trap**  
     - *Question*: Does the candidate copy surface features (e.g., letters) without preserving structure?  
     - *Criteria*:  
       - **I** if surface-driven (e.g., reusing source output letters regardless of target context).  
       - Proceed if not.  

  6. **Final Judgment**  
     - *Question*: Does the candidate preserve the *structural essence* of the source?  
     - *Criteria*:  
       - **A** if all steps align.  
       - **S** if plausible but weak (e.g., slippage/snag handling debatable).  
       - **I** if structural mismatch.  
     - *Flag for Escalation*: Highly creative answers not covered above.  

  **Common Principled Slippages (Reference Table)**:  
  | Source Concept | Principled Slippage | Context |  
  |----------------|----------------------|---------|  
  | `successor`    | `predecessor`       | Target at end of alphabet (e.g., `z` → `y`) |  
  | `leftmost`     | `rightmost`         | Target is mirrored (e.g., start→end of alphabet) |  
  | `group`        | `single token`      | Target has no groups (e.g., `xx` → `xy` vs. `x` → `y`) |  
  | `alphabetical` | `reverse alpha`     | Source/target are symmetric (e.g., `abc` ↔ `xyz`) |  
  | `no boundary`  | `wrap/mirror/refuse`| Target hits boundary (e.g., `z` → `a` or `z` → `y`) |  

  **Known Misfires**:  
  - Overly creative answers (e.g., restructuring the target to "show" a transformation) often marked **I** even if clever.  
  - Uncommon slippages (e.g., `successor` → `double-successor`) may be misgraded **S**/**I** without escalation.  

  ---  
  ### Procedure Applied to Example Items  
  #### **Item 1**: Source `aab → aac` (last `b` → `c`). Target `xyy`.  
  - **Candidate One**: `xyz` (last `y` → `z`).  
    1. **Source Transformation**: `successor` applied to last token (`b→c`).  
    2. **Literal Application**: `successor` to last token of `xyy` = `y→z` → `xyz`. **A** (matches).  
    - *Justification*: "Literal successor on last token: `y→z`."  
  - **Candidate Two**: `xzz` (last `yy` → `zz`).  
    1. **Source Transformation**: `successor` applied to last token (`b→c`).  
    2. **Literal Application**: Fails (literal would be `x y z`, not `x z z`).  
    3. **Principled Slippage**: `token` → `group` slippage (source `b` was a single token; target `yy` is a group). `successor` to group `yy→zz` → `xzz`. **A** (common slippage).  
    - *Justification*: "Principled slippage: successor applied to last group (`yy→zz`)."  

  #### **Item 2**: Source `abc → abd` (last `c` → `d`). Target `xyz`.  
  - **Candidate One**: `xya` (last `z` → `a` via wrap).  
    1. **Source Transformation**: `successor` applied to last token (`c→d`).  
    2. **Literal Application**: Fails (literal `z→?` hits boundary).  
    3. **Snag Handling**: Wrap (`z→a`). Consistent with source (no snag, but wrap is principled for boundaries). **A**.  
    - *Justification*: "Handles boundary via wrap: `z→a`."  
  - **Candidate Two**: `wyz` (first `x` → `w` via `predecessor`).  
    1. **Source Transformation**: `successor` applied to last token (`c→d`).  
    2. **Literal Application**: Fails.  
    3. **Principled Slippage**:  
       - `last` → `first` (position slippage: source changed last, target changes first).  
       - `successor` → `predecessor` (operation slippage: source incremented, target decrements).  
       Contextually principled (target at end of alphabet; mirroring source’s start). **A**.  
    - *Justification*: "Principled slippage: predecessor applied to first token (`x→w`) due to mirroring."  
  - **Candidate Three**: `xyd` (last `z` → `d`).  
    1. **Source Transformation**: `successor` applied to last token (`c→d`).  
    2. **Literal Application**: Fails (`z→d` ≠ `successor`).  
    3. **Surface Similarity**: Copies output letter `d` from source without structural basis (`d` unrelated to `z`). **I**.  
    - *Justification*: "Surface similarity: uses `d` from source, ignoring successor structure."  

  #### **Item 3**: Source `abc → cba` (reversal). Target `XX`.  
  - **Candidate One**: `XX` (unchanged).  
    1. **Source Transformation**: `reversal` (`abc→cba`).  
    2. **Literal Application**: Reversal of `XX` = `XX`. **A** (no snag; identical elements).  
    - *Justification*: "Literal reversal of identical elements: `XX` → `XX`."  
  - **Candidate Two**: `XY` (introduces asymmetry).  
    1. **Source Transformation**: `reversal` (`abc→cba`).  
    2. **Literal Application**: Fails (reversal of `XX` is `XX`, not `XY`).  
    3. **Principled Slippage**: Candidate changes structure *before* reversal (to "show" reversal), but output is not reversed. No slippage justifies `XX→XY` as reversal.  
    4. **Surface Similarity**: Prioritizes visibility over structure. **I** (structural mismatch).  
    - *Justification*: "Ignores reversal; changes structure arbitrarily for visibility."  
    - *Note*: Though creative, the procedure rules against it because the output is not a reversal of the target. Escalate if rewarding meta-reasoning.  

  ---  
  ### Limitations and Escalation Triggers  
  **What the Procedure Cannot Do**:  
  - **Capture Meta-Creativity**: Answers that alter the target to "demonstrate" a transformation (e.g., Item 3 Candidate Two) are typically **I** unless escalation overrides.  
  - **Evaluate Novel Slippages**: Uncommon slippages (e.g., `successor` → `triple-successor`) require human review.  
  - **Resolve Ambiguous Snags**: If wrapping/mirroring/refusing are equally defensible, defaults to **S** and escalates.  
  - **Handle Multi-Concept Blends**: If a candidate combines >1 slippage (e.g., `successor + group` → `predecessor + token`), escalation is needed.  

  **Creative Answers Requiring Human Review**:  
  - Candidates where structural change is "hidden" (e.g., identical reversal) but the candidate "reveals" it via a meta-change.  
  - Slippages outside the common table (e.g., `alphabetical order` → `vowel/consonant split`).  
  - Contextually brilliant but complex boundary handling (e.g., `z` → `a` via wrap, but `a` treated as `new cycle`).  

  **Final Note**: This procedure ensures 90-95% consistency for common cases. Escalate ~5% ambiguous/novel items.
