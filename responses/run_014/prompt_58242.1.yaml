  We are designing a decision procedure for rating analogical reasoning completions in a Copycat-style microdomain. The goal is to classify each candidate as "acceptable", "strained but defensible", or "incorrect", with a one-sentence justification.

  Key concepts to preserve (from the fluid concepts and conceptual slippage idea):
  - Preservation of core concepts (like successor, same group, leftmost, alphabetical order) either literally or with a principled slippage (e.g., successor becomes predecessor, or wrapping at boundaries).
  - Handling of snags (like end of alphabet) by wrapping, mirroring, or refusing (i.e., not changing) should be consistent with the source transformation and the target context.
  - Avoiding confusion between surface similarity (e.g., same letters) and structural similarity (the actual transformation pattern).

  Concepts that can be dropped for speed (since raters have limited time):
  - Deep theoretical justifications for why a slippage is principled. We will rely on a set of common slippages (like successor<->predecessor, left<->right, wrap vs. mirror) and if a candidate uses one of these, it can be considered. Uncommon slippages might be escalated or marked as strained.
  - Detailed analysis of the entire analogy. We focus on the transformation from the target base to the candidate completion, and whether it mirrors the source transformation in a way that respects the core concept (with slippage if necessary) and handles boundaries appropriately.

  Procedure Design:
  We break the process into a flowchart of questions. The rater must consider the source transformation and the target base, then evaluate the candidate completion.

  Steps:

  1. **Identify the source transformation:** What change happens from source input to source output? (e.g., in "abc to abd", we replaced the last letter with its successor, which is d.)

  2. **Identify the core concept in the source:** What is the key concept being applied? (e.g., successor on the last letter, reversal of the whole string, etc.)

  3. **Check for direct application to target:** Can the same core concept (without slippage) be applied to the target to produce the candidate? If yes, and it matches, then acceptable. If it doesn't match, then incorrect.

  4. **If direct application doesn't work, check for principled slippage:** 
     - Is there a common slippage (like successor becomes predecessor, left becomes right, wrapping at boundary becomes mirroring, etc.) that, when applied, produces the candidate?
     - Also, consider if the concept has shifted in a way that is consistent with the target context (e.g., if the target is at the end of the alphabet, wrapping might be a natural slippage).

  5. **Check for handling of snags:** If the source transformation didn't hit a boundary but the target does (or vice versa), how is it handled? We accept wrapping, mirroring, or refusing (no change) if it is a principled response to the boundary. If the candidate does something arbitrary (like changing a letter to an unrelated one) then it's incorrect.

  6. **Avoid surface similarity traps:** The candidate must not rely solely on surface features (like changing a letter to match the source output's letter) without regard to the structural transformation.

  7. **Stopping points and grades:**
     - **Acceptable:** The candidate applies the same core concept as the source (with or without a common and contextually appropriate slippage) and handles boundaries appropriately (if any) in a way that is consistent with the source.
     - **Strained but defensible:** The candidate uses a slippage that is uncommon or not obviously justified by the context, but still has a plausible rationale. Or, the boundary handling is debatable but not arbitrary. Also, if there is a minor deviation that doesn't break the analogy, but is not the most straightforward.
     - **Incorrect:** The candidate does not follow the structural transformation (e.g., changes the wrong part, uses a different concept arbitrarily, ignores a boundary without a principled handling, or relies on surface similarity).

  8. **Escalation flags:** 
     - If the candidate uses a slippage that is not in the common set (and the rater is unsure if it's principled), escalate or mark as strained.
     - If the candidate does something creative that the rater feels is clever but doesn't fit the above, escalate (if time allows) or mark as strained and note for dispute.

  Now, the procedure as a flowchart in words:

  **Decision Procedure for Rating Analogical Completions**

  For each candidate completion:

  1. **Describe the source transformation:** 
     - What is the input and output of the source? What changed? (e.g., "aab -> aac: the last letter was incremented by one, from b to c.")
     - Identify the core concept (e.g., "increment the last letter").

  2. **Describe the target base and the candidate completion:**
     - What is the target base? (e.g., "xyy")
     - What is the candidate? (e.g., "xyz")

  3. **Check direct application:**
     - Apply the same core concept (from step 1) to the target base. Does it produce the candidate?
       - If yes, and it matches, then **acceptable**. Justification: "Direct application of [core concept] to target."
       - If not, proceed to step 4.

  4. **Check for principled slippage:**
     - Is there a common slippage (e.g., successor<->predecessor, left<->right, wrap<->mirror, etc.) that, when applied to the target base, produces the candidate? 
     - Also, consider if the slippage is contextually appropriate (e.g., because the target is at a boundary or has a different structure).
     - If yes, then **acceptable** (if the slippage is common and clearly fits) or **strained but defensible** (if the slippage is a bit of a stretch but defensible). Justification: "Applies [slippage version of core concept] to target, which is a principled slippage because [brief reason]." (For strained: "Defensible but strained slippage: [reason].")
     - If no, proceed to step 5.

  5. **Check for structural relevance and boundary handling:**
     - Does the candidate preserve the structural change of the source (not just surface features)? If the candidate changes a part that doesn't correspond to the changed part in the source, or uses a different transformation arbitrarily, then it is incorrect.
     - If the source didn't hit a boundary but the target does, how does the candidate handle it? We accept:
          - Wrapping (e.g., z -> a)
          - Mirroring (e.g., instead of incrementing z, decrement to y)
          - Refusing (leaving it unchanged)
       ... if it is a consistent way to handle the boundary. If the candidate does one of these appropriately, then it might be acceptable or strained (if the handling is debatable). If the boundary is handled arbitrarily (e.g., changing to a random letter), then incorrect.
     - If the candidate does not handle the boundary in a principled way or violates the structural change, then **incorrect**. Justification: "Does not preserve the structural transformation; [specific reason]."

  6. **Surface similarity trap:**
     - If the candidate appears to be motivated by surface features (e.g., changing the last letter to the same letter as in the source output, without regard to the transformation) then it is **incorrect**. Justification: "Appears to rely on surface similarity rather than structural correspondence."

  7. **Final judgment:**
     - If the candidate hasn't been classified by the above, then it is likely **incorrect** or requires escalation. If the rater feels there is a creative and potentially valid approach that doesn't fit the above, they can mark as **strained but defensible** and note for dispute, or escalate if they are unsure.

  **Explicit Flags for Escalation:**
  - When a slippage is used that is not common and the rater is unsure if it's principled.
  - When the candidate does something creative that the rater feels might be valid but doesn't fit the standard patterns.
  - When the boundary handling is unusual and the rater cannot decide if it's principled.

