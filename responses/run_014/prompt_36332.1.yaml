  - **Yes** → **Meta-response theory** (see above).  
  - **No** → *Unnamed position: Artistry-based pleasure without conversion or self-reflection*.  
    - *Status*: Unexplored; possible but not theorized.  

  **Question 6**: Is the enjoyment due to safety/control (e.g., "I knew it wasn’t real")?  
  - **Yes** → **Control Theory** (Pleasure comes from mastering a safe simulation of sorrow).  
  - **No** → Go to **Question B**.  

  **Question B**: Would the same enjoyment be available at a real funeral (equally vivid, powerless to affect it)?  
  - **Yes** → *Unnamed position: Enjoyment of real tragedy without sorrow or control*.  
    - *Status*: Incoherent (cannot explain why real sorrow isn’t enjoyed).  
  - **No** → **Psychical Distance** (Art’s fictional frame allows disinterested contemplation of sorrow).  

  ---

  ### **Notes on the Tree**  
  1. **Unseparated Leaves**:  
     - **Meta-response theory** appears in both branches (after **Q3** in Branch 1 and **Q D** in Branch 2). The tree cannot distinguish between:  
       - Meta-response *with* enjoyed sorrow (Branch 1).  
       - Meta-response *without* enjoyed sorrow (Branch 2).  
     - *Reason*: Both paths answer "Yes" to relishing responsiveness, but the tree doesn’t probe *why* responsiveness is pleasurable.  

  2. **Exit Point for "Sorrow Enjoyed *Qua* Sorrow"**:  
     - A student who insists sorrow is enjoyed *as sorrow itself* (not for richness, responsiveness, etc.) would answer:  
       - **Q1**: Yes → **Q2**: Yes → **Q3**: No → **Q B**: Yes.  
     - They land in the **unnamed leaf** under **Q B (Yes)** in Branch 1.  
     - *Why no home?* This position is unattractive (it normalizes enjoying real sorrow) and is rejected by major theories.  

  3. **Unnamed Leaves**:  
     - All unnamed leaves are covered:  
       - *Incoherent*: Real funeral enjoyment without sorrow or control (**Q B → Yes** in Branch 2).  
       - *Unattractive*: Sorrow enjoyed *qua* sorrow in real life (**Q B → Yes** in Branch 1).  
       - *Unexplored*: Non-cathartic delayed pleasure (**Q4 → No**); artistry-based pleasure without conversion/meta-response (**Q D → No**).  

  ---

  ### **Tree Summary**  
  - **Catharsis**: Branch 1 → **Q2** No → **Q4** Yes.  
  - **Hume's Conversion**: Branch 2 → **Q5** Yes → **Q A** No → **Q8** Yes.  
  - **Psychical Distance**: Branch 2 → **Q5** No **or** **Q A** Yes → **Q6** No → **Q B** No.  
  - **Coexistence View**: Branch 1 → **Q2** Yes → **Q3** No → **Q B** No.  
  - **Control Theory**: Branch 2 → **Q5** No **or** **Q A** Yes → **Q6** Yes.  
  - **Meta-response**: Branch 1 → **Q3** Yes **or** Branch 2 → **Q D** Yes (unseparated).  

  This tree isolates core commitments while routing through all required questions. Use it to help students articulate intuitions before introducing labels or readings.
