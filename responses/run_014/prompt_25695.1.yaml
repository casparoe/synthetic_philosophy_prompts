     - Relevant consideration: Whether the explanation of regularities by laws is ontologically prior to the regularities themselves.  
     - Humean stance: Regularities are ontologically prior; laws are explanatory because they efficiently describe these regularities.  
     - Anti-Humean stance: Laws are ontologically prior; they explain why the regularities hold.  

