  **Step 3: Cruxes**

  Cruxes: sub-questions that, if settled, would cause at least one side to change their view. For each, we need:
  - The crux question.
  - What both sides accept as a relevant consideration or test case.
  - Each side's prediction or stance.

  Candidate cruxes:

  1. **The conceivability of a world with the same mosaic but different laws**: 
     - Relevant consideration: Thought experiments about whether we can conceive of a world that looks exactly like ours (same events, same regularities) but has different laws (e.g., because the laws are different in the past or future, or because the laws are different in uninstantiated cases). Both sides accept that conceivability is a guide to metaphysical possibility, at least in this context.
