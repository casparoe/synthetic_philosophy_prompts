  **Document Draft**

  # Adversarial Collaboration on the Metaphysics of Laws of Nature

  ## 1. Agreements

  Both parties, the Humean and the anti-Humean, endorse the following substantive claims:

  1. The laws of nature, as captured by our best scientific theories, are remarkably successful in enabling accurate predictions and providing explanations of natural phenomena.
  2. The laws of nature are objective features of the natural world, not dependent on human minds, languages, or conventions.
  3. The actual distribution of particular matters of fact (the Humean mosaic) is consistent with and accounted for by the actual laws of nature.
  4. There exists a real and important distinction between lawful regularities and merely accidental ones.
  5. Laws of nature are general; they do not depend on the specific identities of particular objects or spatiotemporal locations.
  6. The laws of nature are invariant under counterfactual suppositions that do not involve changes to the laws themselves.

  ## 2. Disagreements

  The following table summarizes key disagreements, with each position stated in a way that the respective party would endorse.

  | Issue | Humean Position | Anti-Humean Position |
  |-------|----------------|----------------------|
  | **Governance** | Laws are descriptive summaries of the patterns in the Humean mosaic; they do not govern, produce, or constrain the behavior of entities. | Laws are irreducible features of reality that actively govern the behavior of entities, producing and constraining the patterns in the mosaic. |
  | **Basis of Lawhood** | The distinction between laws and accidents is derived from the Best Systems Analysis: laws are the axioms of the system that best balances simplicity and informativeness in describing the mosaic. | The distinction between laws and accidents is primitive or grounded in irreducible governing relations (e.g., necessitation relations among universals) that are not reducible to patterns in the mosaic. |
  | **Modal Force** | Laws do not involve any primitive modal force; modal claims (e.g., about what must happen) are derived from actual regularities and their systematic descriptions. | Laws inherently possess modal force; they are relations of natural necessity that make it the case that events must unfold in certain ways. |
  | **Supervenience** | The laws supervene on the Humean mosaic: any two possible worlds identical in their total mosaic must be identical in their laws. | The laws do not supervene on the Humean mosaic; two worlds could have the same mosaic but different laws, if the governing relations differ. |
  | **Explanation and Prediction** | The explanatory and predictive power of laws arises from their role as concise and informative summaries of the mosaic; there is no circularity because the laws are defined by the mosaic. | The explanatory and predictive power of laws arises from their role as the ontological grounds of the mosaic; without such grounds, the Humean account is circular or leaves the regularity unexplained. |
  | **Natural Properties** | The Best Systems Account requires natural properties, but these can be understood as the properties referenced in fundamental physics, which are patterns in the mosaic, without conceding anti-Humean ontology. | The Best Systems Account's reliance on natural properties reveals a deep problem: natural properties must be primitive or defined in terms of laws or modality, which undermines the Humean reduction. |

  ## 3. Cruxes

  The following cruxes represent sub-questions that, if resolved, would lead at least one party to reconsider their position. For each crux, we state the common ground about what would count as relevant evidence and each party's stance.

  ### Crux 1: Conceivability of the same mosaic with different laws
  - **Common ground**: If a world with the same particular matters of fact but different laws is conceivable and metaphysically possible, that would challenge Humean supervenience.
  - **Humean stance**: Such a scenario is inconceivable; if the mosaic is identical, the laws must be identical because the laws are defined by the mosaic.
  - **Anti-Humean stance**: Such a scenario is conceivable and metaphysically possible; the same mosaic could be governed by different laws (e.g., if the laws differ in uninstantiated cases).

  ### Crux 2: Definition of natural properties
  - **Common ground**: The Best Systems Account requires a non-circular account of natural properties that does not presuppose laws or modality.
  - **Humean stance**: Natural properties can be defined non-circularly (e.g., as the properties referenced in fundamental physics, which is a pattern in the mosaic).
  - **Anti-Humean stance**: Any non-circular definition of natural properties without appeal to laws or modality is impossible; natural properties must be primitive or nomologically defined.

  ### Crux 3: Direction of explanation
  - **Common ground**: The direction of ontological priority between laws and regularities is a key point of divergence.
  - **Humean stance**: Regularities are ontologically prior; laws are derived summaries that explain by capturing these regularities.
  - **Anti-Humean stance**: Laws are ontologically prior; they explain why the regularities hold by governing the behavior of entities.

  ### Crux 4: Possibility of lawless regularities
  - **Common ground**: Consideration of a world with no governing laws but with regular patterns of events.
  - **Humean stance**: Such a world is metaphysically possible; the regularities are brute patterns and may or may not be systematized as laws by the Best Systems Analysis.
  - **Anti-Humean stance**: Such a world is impossible; any regularity must be grounded in governing laws.

  ## 4. Assessment of Verbal Disagreement

  After careful discussion, both parties agree that the core disagreements are not merely verbal. While some terms (e.g., "govern") may be used with different connotations, the disputes about governance, modal force, supervenience, and ontological priority reflect substantive differences about the structure of reality. The Humean and anti-Humean positions offer genuinely competing accounts of the metaphysics of laws, and no translation into a single idiom dissolves the disagreements.
answer: |-
  ### Adversarial Collaboration: The Metaphysics of Laws of Nature  
  **Participants**:  
  - **Humean** (Defender of the Best Systems Account): Laws supervene on the Humean mosaic (the total distribution of particular, non-modal facts). Laws are axioms of the simplest, most informative system summarizing the mosaic.  
  - **Anti-Humean** (Defender of Governing Laws): Laws are irreducible, modal entities (e.g., necessitation relations or primitive governance structures) that produce or constrain the mosaic.  

  ---

  #### **1. Agreements**  
  Both parties endorse the following substantive claims, narrowing the dispute while accepting them in their own terms:  
  1. **Scientific Success**: The empirical success of science (e.g., prediction and explanation) depends on the existence of objective, mind-independent regularities in nature. This success does not entail that laws must be governing entities, nor does it entail that they are mere summaries.  
  2. **Supervenience in the Actual World**: In the actual world, the laws and the Humean mosaic are mutually constraining: the laws must be consistent with the mosaic, and the mosaic must be consistent with the laws. Neither can be altered without altering the other *in the actual world*.  
  3. **Explanatory Target**: A satisfactory account of laws must explain why laws (but not accidents) support counterfactuals (e.g., "If object *x* were isolated, it would obey Newton’s laws") and why laws provide unifying scientific explanations.  
  4. **Non-Conceptual Dependence**: Laws are not dependent on human concepts, languages, or epistemic practices for their existence or content.  
  5. **Universality**: Laws apply uniformly across space and time within a world.  
  6. **Conceivability of Gaps**: Worlds with identical mosaics but *no laws at all* are conceivable (e.g., a chaotic world with no regularities). In such worlds, neither party would posit laws.  

  ---

  #### **2. Disagreements**  
  The table below lists key issues, with each position stated precisely to avoid caricature.  

  | Issue | Humean Position | Anti-Humean Position |  
  |-------|----------------|----------------------|  
  | **Governance vs. Description** | Laws *describe* patterns in the mosaic; they do not govern, constrain, or produce events. Governance language is metaphorical for the utility of laws in inference. | Laws *govern* the mosaic; they actively constrain or produce events, making regularity non-accidental. Governance is literal and ontological. |  
  | **Primitive vs. Derived Distinction** | The law/accident distinction is derived from the Best Systems Analysis (BSA): laws are axioms optimizing simplicity and informativeness for the actual mosaic. No primitive modal "mark" is needed. | The law/accident distinction is primitive or grounded in irreducible modal relations (e.g., universals necessitating outcomes). BSA confuses epistemology with metaphysics. |  
  | **Supervenience of Laws** | Laws supervene on the mosaic: worlds identical in their total mosaic (including all particular facts) must be identical in their laws. | Laws do *not* supervene on the mosaic: two worlds could share the same mosaic but have different laws (e.g., differing in uninstantiated laws or governing structures). |  
  | **Circularity in Explanation** | Laws explain regularities without circularity: the mosaic explains the laws (via BSA), and laws explain the mosaic as compact descriptions. This is no more circular than using a map to navigate terrain. | Laws explain regularities, but Humeanism is circular: BSA uses the mosaic to *define* laws, then uses those laws to *explain* the mosaic. Genuine explanation requires laws to ground the mosaic ontologically. |  
  | **Natural Properties in BSA** | BSA relies on natural properties (e.g., mass, charge) but these are not primitive: they are patterns in the mosaic that earn their status by featuring in the best system. This requires no anti-Humean commitment. | BSA’s reliance on natural properties concedes too much: "naturalness" must be either primitive (anti-Humean) or defined circularly (via laws or the best system). Humeanism cannot reduce naturalness to the mosaic alone. |  
  | **Status of Uninstantiated Laws** | Uninstantiated laws (e.g., "No object travels faster than light" in a world with no near-light-speed objects) are not laws unless they improve the best system’s simplicity/informativeness balance. | Uninstantiated laws can be genuine laws: they reflect irreducible modal structures (e.g., dispositions or powers) that exist independently of their instantiation. |  

  ---

  #### **3. Cruxes**  
  Cruxes are sub-questions that, if resolved, would force at least one side to revise its view. Both parties accept the stated considerations as relevant tests.  

  1. **Crux: Conceivability of Lawless Regularities**  
     - **Issue**: Is a world with *thoroughly lawless but perfectly regular* successions metaphysically possible? (E.g., events exhibit cosmic-scale regularity without governing laws).  
     - **Relevant consideration**: Whether such a world is coherently conceivable and scientifically stable.  
     - **Humean stance**: Possible. Regularities are brute patterns; BSA might call them "laws," but they lack governance. This shows laws are descriptive.  
     - **Anti-Humean stance**: Impossible. Regularities without governance are inexplicable accidents; stability requires laws to *make* regularities non-accidental.  

  2. **Crux: Natural Properties without Circularity**  
     - **Issue**: Can natural properties (e.g., "being an electron") be defined non-circularly without appealing to laws, modality, or the best system?  
     - **Relevant consideration**: Whether a reductive account of naturalness (e.g., causal powers, structural universals) succeeds without nomological/modal primitives.  
     - **Humean stance**: Yes. Natural properties are those appearing in fundamental physical theories, which supervene on the mosaic. No circularity.  
     - **Anti-Humean stance**: No. Any reductive account (e.g., "causal powers") implicitly invokes laws/modality. Naturalness must be primitive or law-involving.  

  3. **Crux: Direction of Explanation**  
     - **Issue**: Does explanation run *from laws to regularities* (e.g., laws explain why objects attract) or *from regularities to laws* (e.g., regularities explain why we posit laws)?  
     - **Relevant consideration**: Which direction aligns with scientific practice (e.g., derivations in physics) and avoids regress.  
     - **Humean stance**: Regularities are prior; laws explain as efficient summaries (e.g., Newton’s laws compactly describe planetary motions).  
     - **Anti-Humean stance**: Laws are prior; they explain why regularities hold (e.g., gravity *makes* planets orbit). Without this, regularity is unexplained.  

  4. **Crux: Same Mosaic, Different Laws**  
     - **Issue**: Can two worlds share identical mosaics but differ *only* in their laws? (E.g., World A: F=ma governs; World B: F=2ma governs, but all objects accelerate identically due to compensating factors).  
     - **Relevant consideration**: Whether such worlds are conceivable without contradiction and whether they violate physical intuition.  
     - **Humean stance**: Inconceivable. Identical mosaics imply identical laws (by BSA). Any "difference" is verbal.  
     - **Anti-Humean stance**: Conceivable. Laws are additional ontological structure; mosaics underdetermine laws (e.g., unmanifested dispositions could differ).  

  ---

  #### **4. Assessment of Verbal Disagreement**  
  After deliberation, both parties agree that **no core disagreement is merely verbal**.  
  - **Surviving disagreements**: The dispute over governance, supervenience, and modality persists even when translated into shared vocabulary (e.g., both accept "laws support counterfactuals" but disagree on *why*). Anti-Humean "governance" cannot be reduced to Humean "description" without loss of content, and Humean "supervenience" cannot be reduced to anti-Humean "grounding."  
  - **Dissolved elements**: Terms like "necessity" or "natural property" are sometimes used ambiguously, but clarifying them (e.g., Humeans treat "necessity" as a psychological projection; anti-Humeans as ontological) sharpens rather than resolves disputes.  
  - **Residual cost-awareness**:  
    - The Humean acknowledges that BSA risks circularity if natural properties are not reducible.  
    - The anti-Humean acknowledges that positing primitive governance/modality is ontologically costly and less parsimonious.  

  ---  
  **Collaborators’ Note**: This document reflects good-faith engagement. Both parties have steel-manned the other’s view and acknowledged their own vulnerabilities. The cruxes highlight paths for future inquiry but do not adjudicate the debate.
