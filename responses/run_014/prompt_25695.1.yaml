     Crux: **Can there be laws that have no instances?**
     - Relevant consideration: Consider a world where a particular physical possibility is never realized. Is a law about that possibility still a law?
     - Humean stance: Only if including it in the system improves the balance of simplicity and strength. In a world with no instances, it is unlikely to be included, so there would be no such law.
     - Anti-Humean stance: Yes; the law is part of the governing structure regardless of whether it is instantiated.

