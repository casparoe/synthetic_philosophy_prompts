     - Relevant consideration: Thought experiment about a world that has regularities but no underlying governance.
     - Humean stance: Yes, such a world is possible. In that world, the regularities are just brute patterns.
     - Anti-Humean stance: No, such a world is impossible. Regularities cannot exist without being grounded in governing laws.

  5. **The status of uninstantiated laws**:
     - Relevant consideration: How do we account for laws that have no instances? For example, the law that no object travels faster than light is never violated, but what if there were a world where nothing ever approached the speed of light? Would that law still hold?
     - Humean stance: In a world where no object travels near the speed of light, the BSA might not include the axiom about the speed of light because it wouldn't add any informational strength. So uninstantiated laws are not laws in such worlds. (But then the anti-Humean objects: the law is still true.) The Humean might say: the law is a contingent truth only if it is part of the best system. If it's not instantiated, it might not be in the best system.
