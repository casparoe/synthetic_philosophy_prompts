prompt: |-
  I'm staff counsel to a state clemency board — five members, we make a recommendation, the governor can ignore it. We get maybe eight or nine capital petitions a year and each one gets about three weeks from a two-person analyst team, none of whom are philosophers and none of whom have time to read anything. Our worksheet right now asks one question in five different costumes: is there enough doubt or enough unfairness here that we shouldn't let this execution go forward. Its a mess and it lets members smuggle their priors in under whatever heading they like.

  Here's the hunch I want you to build on. I think there are at least three genuinely separate reasons to commute that we keep collapsing into one another, and they need different evidentiary standards, different sources, and they fail in different ways: (1) doubt about whether this person actually committed the crime; (2) the sentence is out of line with what comparably situated people got, including his own co-defendants; (3) desert doesn't transfer across time — the 62-year-old on the table isn't, in whatever sense retributivism actually needs, the person who merited death at 28. Add whatever grounds you think I'm missing, and tell me if you think one of these three isn't really a separate ground.

  Write the procedure. I want: the questions in the order an analyst should ask them, what counts as a sufficient answer to each, the places where it terminates in "deny," and every point where it stops being procedure and hands the call to the board because the remaining question is about values rather than facts. Where a standard can't be reduced to a threshold, say so plainly instead of inventing one. Then tell me which conceptual distinctions you deliberately dropped because an analyst working from a cold trial record can't apply them, and what we lose by dropping them.

  Run it on three cases:

  - Guilt is solid, confirmed, nobody disputes it. He was nineteen, three co-defendants who were at least as culpable took pleas and are alive today, and he's been unblemished for thirty-four years. I expect our procedure to say something here, but I want to know whether it says it on ground (2), ground (3), or neither.
  - No individualized doubt about this defendant at all. But the conviction leaned heavily on a forensic technique that has since been broadly repudiated, and there's a documented cluster of exonerations built on the same technique in the same era. Nobody has any new evidence about *him*. Does the procedure let that kind of information carry weight, and how is it different from someone telling us "roughly four percent of people convicted this way turn out to be innocent"? Be precise about whether that number is even the right shape of thing to feed into a decision about one man.
  - He's probably guilty, the disparity argument is weak, but he has advanced dementia and there's a real question whether he understands what's being done to him or why. I know there's doctrine saying you can't execute someone who doesn't grasp it, but our board treats that as the courts' business. Does the procedure have anywhere honest to put this, or does it have to say "not our question"?

  One of those three should come out in a way you think I won't like. Say which and why.

  Also include: a section on what the procedure can't do and where it'll misfire, including why deterrence and denunciation shouldn't appear anywhere on a single-case worksheet even though they're central to why the institution exists; what an analyst does when the record is silent, which for grounds (2) and (3) is most of the time, because a trial record was built to answer a different question than either of those; and a one-page version for board members who will not read the analyst version. Flag anything that's really a judgment call dressed up as a step. Plain English, no citations or bibliography — if there's a distinction from punishment theory or the law of proof that I haven't named, describe it in your own words and I'll chase down the sources myself.

  Around two thousand words total. And be willing to tell me that one of my three grounds is bogus.
reasoning: |-
  Hmm, the user is staff counsel to a state clemency board that handles capital petitions. They're frustrated with their current worksheet that collapses different clemency reasons into one vague question about "doubt or unfairness," which allows board members to inject personal biases. They want a new procedure built around three distinct grounds: (1) factual innocence doubt, (2) sentencing disparity, and (3) the retributive disconnect between the young offender and the older person facing execution. They also want me to test this on three hypothetical cases, identify limitations, and create a simplified version for board members.

  The user's core frustration is about analytical clarity in life-or-death decisions. Their "hunch" about separate clemency grounds is perceptive - these categories do map to different philosophical justifications for punishment. Factual innocence challenges utilitarian deterrence, sentencing disparity implicates comparative justice principles, and the temporal disconnect strikes at retributivism's core assumption of persistent moral desert. 

  For the procedure structure, I'll need strict sequencing: innocence first (highest stakes), then disparity (systemic fairness), then retributive disconnect (individual transformation). Termination rules are crucial - if innocence doubt clears the threshold, clemency should be recommended without reaching other grounds. Each section must specify: 
  - What analysts look for (evidence types) 
  - Clear thresholds where possible ("more likely than not" for innocence) 
  - Where judgment calls begin (e.g., "substantial" disparity) 
  - Record limitations (trial transcripts won't have co-defendant sentences)

  Testing the three cases reveals tensions: 
  - Case 1 (model prisoner with worse co-defendants alive) should trigger ground 2 (disparity) but current records may lack data. The procedure would flag this for board judgment. 
  - Case 2 (discredited forensic method) is tricky. Aggregate error rates aren't directly applicable to individuals, so the procedure treats this as systemic innocence doubt (ground 1) but requires tangible case-specific indicators. 
  - Case 3 (dementia) falls outside the framework - it's about execution competence, not clemency merit. The procedure correctly identifies this as beyond scope, though the user may dislike that.

  The biggest conceptual sacrifice is "moral desert" beyond the temporal argument. We can't assess whether the original crime "deserved" death because that's inherently subjective and beyond cold-record analysis. Deterrence/denunciation are also excluded - they're institutional rationales, not case-level clemency factors. 

  For the board member one-pager, I'll distill it to: three yes/no gates with escalation points, using plain language like "Could a reasonable person doubt guilt?" instead of legal jargon. The "cannot do" section will warn that this framework can't measure societal harm or prevent future crimes - it only evaluates if this specific execution would compound past errors.

  The user's ground 3 (temporal desert) is the most vulnerable - not bogus, but legally untested. I'll note that while philosophically sound, courts may view it as overreach since the sentence was on the younger self. But for clemency's conscience-based role, it belongs.
answer: |-
  ## Clemency Analysis Procedure: Structured Grounds Framework

  ### Core Principles
  1.  **Sequential Gates:** Analysts proceed through grounds in order (Innocence -> Disparity -> Temporal Desert). A "Commute" recommendation on any ground terminates the analysis.
  2.  **Distinct Standards:** Each ground has unique evidence, thresholds, and failure modes. Collapse causes error.
  3.  **Value/Judgment Firewalls:** Clearly identify where factual analysis ends and board judgment begins.
  4.  **Cold Record Reality:** Prioritizes evidence reliably extractable from files, witness statements, and verifiable data. Acknowledge inherent limitations.

  **Ground 1: Factual Innocence/Guilt Phase Doubt**
  *   **Question:** "Is there a *substantial possibility* that the petitioner is factually innocent of the capital crime?"
  *   **Analyst Task:** Assess *new* evidence or *newly revealed flaws* in evidence presented at trial, bearing directly on guilt/innocence. Focus on reliability and materiality.
  *   **Sources:** Recantations (assessed for credibility), DNA/forensic re-testing, credible alibis uncovered post-trial, proven perjury by key witnesses, demonstrable suppression of exculpatory evidence (Brady violations), discredited central forensic methods *specifically applied in this case*.
  *   **Threshold:** "Substantial possibility" = More likely than not that a reasonable jury, aware of *all* current evidence (trial + new), would have reasonable doubt about guilt. **Not certainty. Not "could have happened differently."** Requires *case-specific* evidence pointing towards innocence or fatally undermining proof of guilt.
  *   **Termination:**
      *   **Commute:** Threshold met. *Recommend Commutation.* Analysis stops.
      *   **Deny:** Threshold not met, OR no new/reliable evidence of innocence exists. Proceed to Ground 2.
  *   **Value/Judgment Firewall:** Assessing the *credibility* of recanting witnesses or new alibi witnesses involves judgment but is necessary for fact-finding. The *standard itself* ("substantial possibility") incorporates a value judgment about what constitutes reasonable doubt; this is inherent and unavoidable.
  *   **Cold Record Limitations:** Analysts cannot assess witness demeanor or resolve "he-said-she-said" conflicts without new, credible evidence. Reliance on file documentation is primary.

  **Ground 2: Sentencing Disparity (Comparative Proportionality)**
  *   **Question:** "Is the petitioner's death sentence *grossly disproportionate* compared to sentences imposed on similarly or more culpable individuals for factually similar capital crimes within the relevant jurisdiction(s)?"
  *   **Analyst Task:** Identify *comparators* (co-defendants, similar cases) and document their sentences. Establish relative culpability and factual similarity.
  *   **Sources:** Verifiable records of co-defendant pleas/sentences. Published appellate decisions/DPIC summaries for similar cases within the state (same era +/- 5 years, similar crime type, similar defendant profile - age, record, role). Prosecutor/defense memos addressing plea decisions (if available). **Focus on cases resulting in *life* sentences.**
  *   **Threshold:** "Gross Disproportionality" - Requires identification of *specific*, comparable cases/co-defendants where:
      1.  Culpability was similar or greater.
      2.  Crime circumstances were similar or more aggravated.
      3.  The sentence was life without parole (or less).
      A pattern, not a single outlier, is highly persuasive. **No precise numerical threshold (e.g., "must find 3 cases") exists.** Analysts assess the *closeness of the comparators* and the *strength of the pattern*.
  *   **Termination:**
      *   **Commute:** Clear pattern of gross disproportionality demonstrated with strong comparators. *Recommend Commutation.* Analysis stops.
      *   **Deny:** No reasonably comparable cases found. OR Comparators exist but show similar sentences, OR culpability/circumstance differences reasonably explain the death sentence. Proceed to Ground 3.
  *   **Value/Judgment Firewall:** Deciding what constitutes a "sufficiently similar" case or "similar/greater culpability" is inherently judgmental. Analysts present the best comparators and the patterns; the Board must decide if the disparity is "gross" enough for clemency. **This is the primary judgment point for Ground 2.**
  *   **Cold Record Limitations:** Finding comparable cases is hard. Trial records rarely contain systematic sentencing data. Analysts rely on external databases (imperfect) and co-defendant records (often incomplete). Full context for prosecutorial discretion (why pleas were offered/accepted) is usually absent or contested.

  **Ground 3: Retributive Disconnect (Temporal Desert)**
  *   **Question:** "Has the petitioner undergone such a *fundamental transformation* during incarceration that executing the person they are today fails to serve the core retributive purpose of punishing the person who committed the crime?"
  *   **Analyst Task:** Document evidence of profound, sustained change in character, behavior, and understanding since the crime. Establish the "person before the board" is fundamentally different from the "person sentenced."
  *   **Sources:** Disciplinary record (long-term absence of serious violence). Work/educational achievements. Expressions of remorse (assessed for depth, consistency, action). Religious/ethical engagement. Victim impact reconciliation efforts (if any). Expert evaluations (psychiatric, psychological) specifically addressing character change and insight. Testimony from prison staff, volunteers, fellow inmates. **Duration matters (e.g., 20+ years carries more weight than 5 years).**
  *   **Threshold:** **Cannot be reduced to a simple threshold.** Requires a *qualitative judgment* about the *depth* and *authenticity* of change, rendering execution *retributively unjust*. Analysts must marshal evidence *for* and *against* transformation. Key indicators: Absence of prison violence, sustained constructive engagement, genuine remorse beyond self-preservation, credible external validation of change.
  *   **Termination:**
      *   **Commute:** Strong, well-documented evidence of profound transformation, making execution feel like punishing a different person. *Recommend Commutation.*
      *   **Deny:** Evidence of transformation is weak, superficial, inconsistent, or overshadowed by persistent negative behavior/attitudes. No recommendation. Petition fails on all grounds.
  *   **Value/Judgment Firewall:** **This ground is ENTIRELY a value judgment.** The analyst's role is to compile the most credible evidence of change (and counter-evidence) and present it clearly. The Board *alone* decides if the transformation is sufficient to negate the retributive justification for the original sentence. The core question ("Does desert transfer?") is fundamentally philosophical.
  *   **Cold Record Limitations:** Assessing "remorse" or "character" from a cold record is perilous. Reliance on documented behavior (disciplinary record, programs completed) is strongest. Prison staff/witness statements are crucial but vary in quality. Genuine internal change is often hard to prove conclusively.

  **Missing Grounds Deliberately Excluded:**
  *   **General Innocence Claims (No New Evidence):** "The system is imperfect" isn't grounds without case-specific doubt (covered in Ground 1).
  *   **Pure Mercy/Compassion:** Too subjective for structured analysis. May factor into Board's final judgment on Ground 3.
  *   **Deterrence/Denunciation:** Institutional rationales, not case-specific clemency grounds. Clemency addresses justice *in this specific case*, not sending messages.
  *   **Residual Doubt (Weak):** Covered under Ground 1 if it meets the "substantial possibility" threshold; otherwise, not a standalone ground.
  *   **Mental Illness at Crime:** Belongs in trial/penalty phase. Clemency may consider *current* incompetency for execution (see Case 3 below), but that's distinct from desert *at the time*.
  *   **"Death Row Phenomenon" (Conditions):** A policy argument, not a grounds for individual clemency based on justice/doubt/disparity.

  **Conceptual Distinctions Dropped & Loss Incurred:**
  1.  **"Moral Desert" at Time of Crime:** We focus on *legal* guilt (Ground 1) and *comparative* proportionality (Ground 2), not whether the crime inherently "deserved" death. This is philosophically core to retributivism but impossible for analysts to assess objectively from a record; it requires a moral judgment the Board isn't structured to make systematically. **Loss:** We cede the pure "just deserts" argument, focusing instead on procedural fairness (Grounds 1 & 2) and the *current* person (Ground 3).
  2.  **Fine-Grained Proportionality (Non-Comparative):** Whether the sentence was "proportionate" to *this specific crime* absent comparators. This blends retribution and societal values. Ground 2 uses *comparative* proportionality as a more objective proxy. **Loss:** We lose the ability to argue a sentence was intrinsically excessive for the crime itself, without needing comparators.
  3.  **Distinguishing "Identity" from "Character":** Deep philosophical debates about whether personal identity persists. The procedure simplifies this to observable "fundamental transformation" (behavior, insight, character). **Loss:** Nuance about the metaphysics of personal identity over time is sacrificed for practical assessment.

  ---

  **Running the Cases**

  **Case 1: Solid Guilt, Young Offender, Worse Co-Defendants Alive, Unblemished Record**
  *   **Ground 1:** Solid guilt, no new evidence. Threshold NOT met. **Deny** on Ground 1. Proceed.
  *   **Ground 2:** Key comparators are the co-defendants (more culpable, got life). This is the *strongest* type of disparity evidence. Analysts document the co-defendants' roles, pleas, and sentences. Pattern is clear: more culpable actors avoided death. **Gross Disproportionality** likely established. **Commute** recommended based on Ground 2. Analysis stops. *Doesn't reach Ground 3.*
  *   **Why Ground 2?** This is a classic disparity case. The co-defendant comparison is direct and powerful. Ground 3 (transformation) is present but secondary here; the injustice lies primarily in the *initial* sentencing disparity relative to culpability.

  **Case 2: No Individual Doubt, Discredited Forensic Technique, Cluster of Exonerations**
  *   **Ground 1:** This is Ground 1 territory ("doubt about guilt"), but tricky. *No new evidence specific to him.* Analysts must investigate:
      *   How central was the discredited technique to *this* conviction? (e.g., Was it the only physical evidence? Corroborative?)
      *   What is the nature of the "repudiation"? (e.g., Found inherently unreliable? Misapplied in known ways?)
      *   Are there *case-specific indicators* of potential error? (e.g., Technique performed by an analyst later found incompetent; contamination potential documented in this case record; alternative explanations plausible but not explored because technique seemed definitive).
      *   The **4% statistic alone is insufficient**. It shows systemic risk, not case-specific doubt. It *supports* looking harder for case-specific issues but doesn't *constitute* the issue.
  *   **Threshold:** Does the discrediting of the technique, combined with its centrality *in this case* and the *absence* of overwhelming *other* evidence of guilt, create a "substantial possibility" of innocence? If the technique was central and its reliability is now completely shattered (e.g., bite mark analysis), and the remaining case is weak/circumstantial, **Commute** may be justified on Ground 1. If the technique was peripheral or other evidence is overwhelming, **Deny** on Ground 1. Proceed.
  *   **Difference:** The procedure requires connecting the *systemic* flaw to the *specific* case. A statistic shows risk; the analyst must find evidence that *this case* likely fell victim to that risk. It's not feeding in a number; it's using the systemic flaw as a lens to re-examine the reliability of the proof *in this record*.

  **Case 3: Probable Guilt, Weak Disparity, Advanced Dementia (Incompetent?)**
  *   **Ground 1:** Probable guilt, no new evidence. Threshold NOT met. **Deny**. Proceed.
  *   **Ground 2:** Weak disparity argument. Threshold NOT met. **Deny**. Proceed.
  *   **Ground 3:** This is **NOT Ground 3**. Ground 3 is about moral desert based on transformation. Dementia causing incompetency is about *procedural fairness in execution*, not the justice of the sentence itself. It asks "Can we *carry out* the sentence humanely/constitutionally?" not "Does this person *deserve* execution anymore?"
  *   **Procedure Outcome:** The procedure has **no honest place** for this. Analyst reports: Fails Grounds 1 & 2. Ground 3 evidence (dementia) is documented but is irrelevant to the *retributive desert* question Ground 3 asks. The report flags the dementia evidence prominently but states: "This raises potential Eighth Amendment concerns regarding competency for execution, which fall under judicial purview and are distinct from clemency grounds based on innocence, disparity, or retributive disconnect." **No Commute Recommendation.**
  *   **Why You Might Not Like This:** You recognize the profound moral issue – executing someone unaware of why. But the procedure correctly identifies this as a *different kind of question* (execution *method/procedure*) than the core clemency grounds (justice of the *sentence itself*). Including it in Ground 3 conflates desert with competence. The Board *could* still consider it as an extraordinary humanitarian factor beyond the formal grounds, but the procedure doesn't mandate it.

  **(The case that comes out "wrong" is likely Case 3. The procedure correctly excludes incompetency-to-be-executed as outside the defined clemency grounds, prioritizing the conceptual separation. This might feel unsatisfying given the moral weight of executing someone with dementia.)**

  ---

  **What the Procedure Can't Do & Where It Misfires**

  1.  **Can't Resolve Pure Value Conflicts:** It structures facts and identifies judgment points but cannot resolve the underlying philosophical disagreements on Ground 3 or the "grossness" threshold on Ground 2.
  2.  **Misfires on Sparse Records (Grounds 2 & 3):**
      *   **Ground 2:** Finding good comparators is often impossible. Analysts do their best with limited data, sometimes resulting in inconclusive findings ("weak comparators exist but are imperfect") forcing the Board to guess.
      *   **Ground 3:** Assessing transformation is crippled by poor prison documentation, lack of witness statements, or inmates who withdraw/refuse participation. Genuine change might be invisible.
  3.  **Misfires on Nuanced Innocence (Ground 1):** It struggles with cases where new evidence creates nagging doubt falling short of "substantial possibility," or where systemic flaws are evident but case-specific proof of error is elusive (like Case 2 without strong indicators).
  4.  **Can't Incorporate Deterrence/Denunciation:** These are *systemic* justifications for maintaining the death penalty *in general*. Clemency for an *individual* is about justice *in that specific case* – correcting error (Ground 1), remedying unfairness (Ground 2), or acknowledging profound change (Ground 3). Injecting deterrence into a single case ("Deny to send a message") perverts clemency into an instrumental tool, undermining its core function as a fail-safe for justice. Similarly, "denunciation" is achieved by the conviction and sentence; clemency asks if carrying it out *now* is just.
  5.  **Silent Records:** Analysts must explicitly state when the record is silent on a relevant point (e.g., "No information on co-defendant pleas found," "No post-conviction disciplinary record available," "No psychological evaluations post-2005"). They cannot speculate. Silence generally weighs against the petitioner on that ground, except where the *state* should reasonably hold the information (e.g., co-defendant deals – analysts should request it from prosecutors).
  6.  **Judgment Calls in Disguise:** Be alert to:
      *   "Substantial possibility" (G1) - Involves weighing evidence.
      *   "Similarly or more culpable" / "Factually similar" (G2) - Core judgment.
      *   "Fundamental transformation" / "Retributively unjust" (G3) - Entirely judgmental.

  ---

  **One-Page Board Member Summary: Clemency Analysis Framework**

  **Goal:** Decide if justice requires *this execution* be stopped. We look at three distinct reasons sequentially. If one reason is strong enough, we recommend COMMUTE. Otherwise, we recommend DENY.

  **1.  COULD THEY BE INNOCENT? (Factual Doubt)**
      *   **Analyst Tells You:** Is there *new, strong evidence* (like DNA, recantations, exposed bad forensics *in this case*) making it *reasonably possible* they didn't do it? Did the original proof have a major flaw we now know about?
      *   **Your Judgment:** Is the doubt raised *serious enough* that executing them feels too risky? (Not "are they definitely innocent?" but "is there a real chance?").
      *   **OUTCOME: If YES -> COMMUTE. STOP HERE.**

  **2.  WAS THEIR DEATH SENTENCE UNFAIRLY HARSH? (Sentencing Disparity)**
      *   **Analyst Tells You:** Who were their partners in crime? What did *they* get? Are there other cases from that time, with similar crimes and similar criminals, where the killer got life instead of death?
      *   **Your Judgment:** Looking at those comparisons, is *this person's* death sentence way out of line? Does it look like they got singled out unfairly compared to others who did the same or worse? Is the difference shocking?
      *   **OUTCOME: If YES, it looks grossly unfair -> COMMUTE. STOP HERE.**

  **3.  DOES EXECUTING THEM *NOW* MAKE SENSE? (Changed Person)**
      *   **Analyst Tells You:** How have they behaved in prison? (Long time with no violence? Jobs, classes?) Do they show real remorse? Do staff or experts say they're a different person? How long have they been locked up?
      *   **Your Judgment:** **This is YOUR CALL.** Looking at their whole journey, does executing the 60-year-old who turned their life around feel like punishing the wrong person? Does it satisfy the original goal of paying for the crime committed decades ago by someone different? Ignore whether they are "dangerous now"; focus on whether the *punishment* fits the *person before you*.
      *   **OUTCOME: If YES, executing them now feels unjust -> COMMUTE. If NO, or unsure -> DENY.**

  **KEY POINTS:**
  *   We look at these reasons IN ORDER. Stop if one says COMMUTE.
  *   Reason 1 is about facts (Did they do it?). Reason 2 is about fairness (Compared to others). Reason 3 is about justice today (Does the punishment fit *this* person?).
  *   The Analyst gives you facts and comparisons. YOU make the final judgments on whether the doubt is "substantial" (1), the disparity is "gross" (2), or the change makes execution unjust (3).
  *   We don't consider "sending a message" (deterrence) or "society's outrage" (denunciation) for *this one person*. Clemency is about justice in *this specific case*.

  ---

  **Final Note on Your Grounds:** Your three grounds are conceptually sound and distinct. Ground 3 ("desert doesn't transfer") is the most philosophically challenging and legally untested, but it captures a profound moral intuition central to clemency's role as conscience. It *should* be separate. The potential weakness is its subjectivity, which the procedure acknowledges by making it entirely a Board value judgment based on presented evidence. It's not bogus; it's the frontier of clemency rationale.
