answer: |-
  Below is a no-nonsense spec for a "range-based belief" system that meets your engineering needs. I'll break it down into hard requirements (non-negotiable for basic functionality) and taste-based preferences (trade-offs depending on philosophy). Concrete cases are phrased as you'd explain them to a shipping-focused teammate. The trade-offs table at the end answers your core question.

  ---

  ### **Hard Requirements (Non-Negotiable)**
  These are table stakes. Fail these, and the system is unusable.

  1. **Handle Ambiguous Evidence Without Forcing Fake Precision**  
     **Concrete Case**: An urn has 50 red balls and 50 unknown (black/yellow). We *know* P(black) is between 0–0.5, but no single number is defensible. The system must output `[0, 0.5]`, not `0.25`.  
     **Why**: If you can't represent "we don’t know the split," you’re lying with data. Urn-like ambiguity is common (e.g., "Is this new type of transaction fraud?" with no history).

  2. **Update Ranges Consistently with New Evidence**  
     **Concrete Case**: Initial fraud chance for a user is `[0.1, 0.3]`. They fail 2FA: the range must shift upward (e.g., to `[0.4, 0.6]`), not stay static or break.  
     **Why**: If new data doesn’t update beliefs, the system is useless. Must obey basic coherence (e.g., if `A` implies `B`, `P(B)` can't be lower than `P(A)`).

  3. **Produce Actionable Outputs Under Uncertainty**  
     **Concrete Case**: When deciding to block a transaction with fraud chance `[0.05, 0.25]`, the system must have a rule (e.g., "block if lower bound > 0.1") to choose "block" or "don't block."  
     **Why**: Engineers won’t adopt a system that says "maybe" without a decision procedure. Actions are binary; the framework must bridge the gap.

  4. **Preserve Known Probabilities as Degenerate Ranges**  
     **Concrete Case**: A fair coin flip must be representable as `[0.5, 0.5]`, not `[0.3, 0.7]`.  
     **Why**: If you can’t encode precise knowledge, you break calibration. "Known" probabilities (e.g., controlled experiments) must stay exact.

  5. **Support Calibration Validation**  
     **Concrete Case**: For all predictions where the range was `[0.2, 0.4]`, the event must occur 20–40% of the time. If it happens 60%, the system is broken.  
     **Why**: Uncalibrated models are garbage. Ranges aren’t excuses for inaccuracy—they must be testable.

  ---

  ### **Taste-Based Preferences (Negotiable)**
  These depend on your risk tolerance and philosophical alignment.

  | Requirement | Concrete Case | Whose Taste? | Why Contentious |
  |-------------|---------------|--------------|----------------|
  | **Avoid Dilation** | You’re uncertain if a coin is fair (P(heads) = `[0.4, 0.6]`). After 1,000 flips (500 heads), the range *narrows* to `[0.49, 0.51]`. Dilation would *widen* it (e.g., to `[0.3, 0.7]`), even with more data. | Imprecise Bayesians (Walley) | Dilation reflects heightened awareness of ignorance after surprising data. Some argue it’s honest; others say it’s paralyzing. |
  | **Distinguish Risk vs. Ambiguity** | A coin with P(heads)=0.5 (`[0.5, 0.5]`) vs. an unknown process (`[0, 1]`) must yield different ranges. | Keynes/Knight fans | Some frameworks (e.g., Dempster-Shafer) preserve this; others (e.g., simple intervals) blur it. Matters for extreme caution cases. |
  | **Action Rule Agnosticism** | The system outputs `[0.05, 0.25]` for fraud chance. You bolt on: <br> - Maxmin ("block if min loss > threshold") <br> - Hurwicz ("weighted avg of min/max") <br> - Single-point collapse ("use midpoint"). | Engineers vs. Decision Theorists | Engineers want flexibility ("let me hack my action rule"). Purists insist the action rule is part of the framework (e.g., maxmin for conservatism). |
  | **Scoring Mechanism** | Score a range forecast: <br> - Reward correctness *and* narrowness (e.g., `[0.3, 0.4]` scores better than `[0.1, 0.9]` if true P=0.35). <br> - Penalize misses harshly (e.g., true P=0.5, predicted `[0.1, 0.2]`). | Statisticians (Gneiting et al.) | Proper scoring rules for intervals exist but are complex. Some teams accept "naive" scoring (e.g., "did truth fall in range?"). |

  ---

  ### **The Trade-Offs Table**
  **Your core question**: "What can't we have simultaneously?" Here's the squeeze:

  | Requirement | Conflicts With | Consequence of Dropping | Drop First? |
  |-------------|---------------|-------------------------|------------|
  | **Avoid Dilation** | Honest Ambiguity Representation | Ranges won’t widen with surprising data, even when they should. You understate uncertainty. | **Yes** – Dilation is rare in practice and often manageable. |
  | **Honest Ambiguity** (Urn case) | Simple Action Rules | Wide ranges (e.g., `[0, 1]`) make actions harder to justify without conservative rules (e.g., maxmin). | **No** – This is the whole point of ranges. |
  | **Flexible Action Rules** | Decision-Theoretic Purity | Ad-hoc rules (e.g., "use the midpoint") may violate coherence under uncertainty. | **Maybe** – Engineers often prefer flexibility, but document your rule. |
  | **Distinguish Risk/Ambiguity** | Engineering Simplicity | Requires richer models (e.g., sets of probabilities), not just intervals. More code, slower updates. | **For V1** – Start with intervals; upgrade if "unknown unknowns" are critical. |
  | **Calibration** | Ultra-Wide Ranges | Trivial ranges (e.g., always `[0, 1]`) are perfectly calibrated but useless. | **Never** – Uncalibrated models are harmful. |

  ---

  ### **The Real Answer**
  - **Where the squeeze is**:  
    **Honest ambiguity representation + actionable outputs + calibration** pull against each other. Representing true ignorance (e.g., `[0, 1]`) makes actions hard without arbitrary rules. Calibration demands ranges be narrow enough to be testable, but wide enough to cover reality. Dilation avoidance conflicts with evidence updating in edge cases.

  - **What to drop first**:  
    1. **Dilation avoidance** (it’s a niche problem).  
    2. **Risk/ambiguity distinction** (start with intervals; upgrade if needed).  
    3. **Decision-theoretic purity** (let engineers bolt on maxmin or midpoint rules).  

  - **Minimal Viable Spec**:  
    - Ranges as intervals `[L, U]`.  
    - Bayesian-like updating (e.g., treat bounds as priors, clip outputs to `[0,1]`).  
    - Action rule: **Maxmin** (e.g., "block if lower bound of fraud chance > threshold").  
    - Scoring: **50% hit rate** (truth falls in range 50% of the time) + **average width** (narrower = better).  

  This gives you ambiguity honesty, actionability, and measurable calibration without overengineering. Ship this, then evolve based on pain points.
