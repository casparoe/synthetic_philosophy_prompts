     - **Dilation Handling (R2a)**: The updating rule should not cause dilation in cases where the evidence is irrelevant. 
       - **Motivation**: If we have an irrelevant experiment (like flipping a coin that we know is fair, but we are uncertain about the bias of another coin) then conditioning on the outcome of the fair coin shouldn't change the interval for the biased coin. 
       - **Non-negotiable?**: This is tricky. Some imprecise probability models (like the one based on sets of priors) can exhibit dilation. Some researchers argue dilation is a feature (it reflects that we are learning about the prior as well) but it can be counterintuitive. For engineering, we might want to avoid it. However, note that in the example above, the dilation might be considered reasonable because the evidence is not irrelevant to the entire model. We'll mark this as **negotiable (taste)**: Some applications might require avoiding dilation, others might accept it as part of the model.

