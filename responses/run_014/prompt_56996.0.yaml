     Let me use a dilation example: 
     - There are two coins. One is fair (P(heads)=0.5), the other is biased (P(heads)=0.4 or 0.6, but we don't know which). We choose a coin at random (50% each). The initial set for the probability of heads is {0.4, 0.5, 0.6}? Actually, we have two coins: fair and biased. The biased coin is either 0.4 or 0.6, but we don't know which. So the initial set for the probability of heads is the set of possible probabilities: {0.4,0.5,0.6}? Actually, the initial probability of heads is the average: 0.5? But the set of possible probabilities for the coin we have is either {0.5} or {0.4,0.6}? This is messy.

     A classic dilation example: 
     - Let Ω = {1,2,3,4} with equal prior. Let A = {1,4}, B={2,3}. Then let C = {1,2}, D={3,4}. Now, the probability of A is 0.5. But condition on C: then in the updated model, the probability of A can be either 0.5 (if we had state 1) or 0 (if we had state 2). So the interval becomes [0,0.5]. Similarly, if we condition on D, we get [0.5,1]. So the interval widened even though C and D are independent of A? Actually, they are not independent, but the point is that conditioning on an event that is irrelevant in the sense that it doesn't change the mean might still widen the interval.

     - **Requirement (R2)**: The system must update the set of probabilities when new evidence arrives, according to a well-defined rule (like Bayes rule for sets, or natural extension). 
