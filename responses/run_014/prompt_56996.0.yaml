  We are going to design a specification for a system that represents degrees of belief as intervals (or more generally, sets) instead of single numbers. The goal is to understand the requirements, trade-offs, and whether the engineering cost is justified.

  The key motivations from your coworkers:
  1. **Coworker A**: Single numbers are fake precision; we should use intervals (or sets) to capture uncertainty more honestly (imprecise probability).
  2. **Coworker B**: At the end, we have to choose an action; intervals don't tell us which action to take.

  We need a spec that addresses:
  - What must the representation handle?
