  Here’s a structured framework for your fellowship proposal, focusing on your core insight about the "preservation" problem in structural realism. This outlines the argument, methodology, and scope without citations, as requested.

  **Proposal Title:** Preservation as the Achilles’ Heel: Unpacking the Foundations of Structural Realism’s "Disastrous Defeat" Argument

  ---

  ### 1. Problem Statement & Core Gap (Page 1)
  *   **The "Disastrous Defeat" Argument (DDA):** Recap the standard structural realist (SR) narrative: Scientific realism faces a problem from radical theory change (e.g., ether, caloric). Entities vanish, but *mathematical structure* (e.g., Fresnel's equations, Poisson's spot prediction) is preserved. This motivates SR: we should be realists *only* about structure (ESR) or that structure *is* fundamental reality (OSR).
  *   **The Unacknowledged Linchpin:** Preservation is the crucial, operational concept in DDA. It's treated as unproblematic ("look, the equations still work!") but remains fundamentally unanalyzed within the SR literature. What *exactly* does "preservation across theory change" mean? What conditions must be satisfied?
  *   **The Problem:** Both major SR camps (Epistemic and Ontic) **rely indispensably** on a notion of preservation to ground their core argument against the pessimistic meta-induction, yet neither provides:
      *   A precise definition of what constitutes "preserved structure".
      *   A criterion for *which* structures are preserved (why these equations and not others?).
      *   A robust account of *how* structure is preserved (what is the relationship between the old and new structures?).
  *   **The Suspicion:** This unexamined reliance is problematic. Articulating "preservation" rigorously will reveal that:
      *   Option 1: DDA collapses into triviality ("some mathematical expressions resemble older ones"), lacking the metaphysical bite SR claims.
      *   Option 2: DDA *requires* a substantive (and undeveloped) **theory of intertheoretic correspondence** to bridge the conceptual gap between predecessor and successor theories.

  ### 2. Core Argument & Novel Contribution (Page 1-Start of Page 2)
  *   **Phase 1: Diagnosis - Exposing the Reliance:**
      *   Systematically analyze key SR texts (Worrall, Ladyman, French, etc.) to demonstrate how DDA *presupposes* a notion of preservation without defining or justifying it. Identify where appeals to "similar equations," "retained structure," or "continuity" occur as *proof* without analysis.
      *   Show this reliance is fundamental for both ESR (preserved structure is what we can know) and OSR (preserved structure reveals fundamental ontology).
  *   **Phase 2: Intervention - Defining Preservation via Explanatory Relevance:**
      *   **Thesis:** Preservation is non-trivial *only* if the "preserved" structure from T1 plays a **genuinely explanatory role within the conceptual framework of its successor theory T2**. It's not merely formal similarity or instrumental utility *in isolation*.
      *   **Argument:**
          *   Formal similarity alone *is* trivial and metaphysically inert (Option 1 above). Finding isomorphic equations in different contexts is common and doesn't imply ontological continuity.
          *   What gives the DDA its intuitive force is the *persistence of explanatory power*. The reason Fresnel's equations are celebrated isn't just their form, but that Maxwellian electrodynamics *explains why they worked* and integrates them into a broader explanatory framework. The structure is *retained because it captures something explanatorily relevant* in T2.
          *   This shifts the focus: Preservation is **not** a property of the structure *in T1 alone*, nor is it purely formal. It's a *relational property* dependent on the role the structure plays *within the successor theory T2*.
  *   **Phase 3: Deflationary Objection - Relocation & Response:**
      *   **Standard Objection:** Deflationists (e.g., Stanford) argue preserved structure is cherry-picked post-hoc; real explanatory failures are ignored.
      *   **Relocation:** My account *relocates* the debate. The question becomes: **Does the structure preserved in the DDA narrative genuinely play an explanatory role *within the successor theory*, or is it merely a formal relic?**
      *   **Response/Reframing:**
          *   If the structure *is* explanatorily embedded in T2, this provides a non-trivial sense of preservation that supports a modest realism (perhaps closer to ESR).
          *   If it is *not* explanatorily embedded in T2 (merely a formal shadow), the DDA *does* collapse into triviality, validating the deflationary concern specifically for SR's core argument.
          *   This reframing moves beyond structural similarity to the deeper question of **explanatory grounding across theory change**. Failure to meet the explanatory relevance criterion exposes SR's preservation claim as weak.

  ### 3. Research Plan & Scope (Page 2)
  *   **Core Question:** "What constitutes non-trivial 'preservation of structure' across theory change, and what are the implications for the structural realist response to the pessimistic meta-induction?"
  *   **Methodology:**
      *   **Conceptual Analysis:** Rigorous dissection of "preservation," "structure," "correspondence," and "explanation" within the SR context. Engagement with philosophy of science literature on explanation and theory relations.
      *   **Case Study Analysis:** Deep dive into 2-3 canonical examples (e.g., Optics: Fresnel -> Maxwell; Thermodynamics: Carnot/Caloric -> Clausius/Kelvin; perhaps one "messier" case). Analyze:
          *   *What* was allegedly preserved? (Formal equations, relations, patterns)
          *   *How* is this "preserved" element treated *within the successor theory*? (Is it derived? Explained? An unexplained coincidence? An instrumental tool?)
          *   Does it play a genuine *explanatory role* in T2?
  *   **Month-by-Month Plan:**
      *   **Months 1-3:** **Foundations & Diagnosis.** Comprehensive literature review (SR, pessimistic meta-induction, theory change, explanation). Detailed mapping of implicit "preservation" assumptions in key SR texts. Drafting Phase 1 argument.
      *   **Months 4-6:** **Developing the Account & Case Study 1.** Formalizing the "explanatory relevance" criterion. Applying it rigorously to the clearest case study (e.g., optics). Refining the criterion based on findings. Drafting core of Phase 2 argument.
      *   **Months 7-9:** **Testing & Reframing & Case Study 2.** Applying the criterion to a second (and potentially third) case study. Confronting the deflationary objection head-on using the analysis. Drafting Phase 3 argument. Preparing conference presentation.
      *   **Months 10-12:** **Synthesis & Dissemination.** Finalizing the integrated argument. Writing the core journal article draft. Presenting findings at a major philosophy of science conference. Planning future work (intertheoretic correspondence?).
  *   **Explicit Scope & Deliverables:**
      *   **Scope:** Focuses squarely on the *concept of preservation* within the SR DDA argument and its implications for defending SR against the pessimistic meta-induction. Engages primarily with SR literature and key critics (deflationists). Uses case studies illustratively, not as primary historical research.
      *   **Deliverables:** 1 major journal article presenting the core argument; 1 conference presentation; draft outline of a second article exploring implications for intertheoretic correspondence.
  *   **Success & Failure Criteria:**
      *   **Success:** 1) Providing a clear, defensible account of non-trivial preservation via explanatory relevance. 2) Demonstrating convincingly that both ESR and OSR rely on an unanalyzed notion of preservation. 3) Showing that the deflationary objection is significantly reshaped (either answered or relocated into a more productive debate) by this account. 4) Producing the planned publications.
      *   **Failure:** 1) If the "explanatory relevance" criterion proves untenable or collapses into formal similarity upon scrutiny. 2) If detailed case studies reveal that allegedly preserved structure *never* plays a genuinely explanatory role in successors, undermining the DDA entirely. 3) If the project fails to show that SR's reliance on unanalyzed preservation is a significant weakness (i.e., if preservation can be easily defended without my account). 4) Failure to produce substantive written work.

  ---

  **Key Strengths of this Proposal:**

  1.  **Originality:** Directly targets a fundamental but unexamined assumption (`preservation`) at the heart of a major debate.
  2.  **Precision:** Clearly defines the problem, the proposed solution (explanatory relevance), and the scope.
  3.  **Argumentative Force:** Sets up a clear dilemma for SR: triviality or needing intertheoretic correspondence. Offers a novel criterion to navigate it.
  4.  **Engagement:** Directly engages with and attempts to reshape a core objection (deflationism).
  5.  **Feasibility:** Well-scoped, clear methodology, realistic timeline, defined deliverables and success/failure criteria.
  6.  **Significance:** Success would fundamentally reshape debates about structural realism and theory change. Failure would still yield important insights about the fragility of the DDA.

  **Next Steps for You:**

  1.  **Flesh out the case studies:** Decide which ones best illustrate your point and where the explanatory relevance criterion might be tested most clearly.
  2.  **Sharpen the "explanatory relevance" criterion:** How operationalizable is it? Can you define levels of embedding? What *kind* of explanation counts?
  3.  **Anticipate Counterarguments:** How might an ESR or OSR advocate defend their implicit notion of preservation? How would a deflationist attack your criterion?
  4.  **Integrate Citations:** Populate the framework with key references to SR, pessimistic meta-induction, explanation, and your chosen case studies.

  This structure provides a strong, defensible core for your fellowship application centered on your powerful insight about the hidden work done by "preservation." Good luck!
