prompt: |-
  I'm putting together a problem set for my graduate Madhyamaka seminar and I keep wanting to test whether students can tell a legitimate use of Nāgārjuna's tetralemma from a bogus one, so I've been going by my own gut on a batch of cases and I'd like to see if there's a principle behind the pattern. Here's where I land.

  The self — is it produced, not produced, both, or neither — the tetralemma applies cleanly. You reject all four horns and what's left is that the self is empty of intrinsic nature, not that there's no such thing as a person. That's the paradigm case for me.

  Causation — does an effect really arise, not arise, arise both ways, or neither — I think it applies too, but the upshot is dependant origination, not "there's no causation." Rejecting all four is supposed to show that production is empty, not to deny that things happen. So it applies, but the reading has to be non-nihilistic.

  Emptiness itself — is emptiness produced, not produced, both, or neither — I say it applies here as well. Emptiness is itself empty; if you let the tetralemma off the hook for emptiness, you've reified it into a new intrinsic nature, which is exactly the mistake the whole project is trying to prevent.

  A table — does it exist, not exist, both, or neither — the tetralemma does not apply. At the conventional level the table exists, period, and running the tetralemma on it collapses the two truths into each other. Category error.

  The two-truths distinction itself — is the split between conventional and ultimate real, not real, both, or neither — I think I have to apply the tetralemma and reject all four, which means the distinction is also empty. And I'm not sure that's coherent, because I just used that very distinction to justify the table verdict.

  The law of excluded middle — does it hold, not hold, both, or neither — I say it does not apply. The tetralemma is a dialectical tool, not a thesis that LEM is false; I can reject all four horns about a thing while still using LEM to structure the rejection. (Though I grant the four-horn shape looks like it's mocking the two-horn shape, so I might be wrong.)

  So the question. Is there a principle that gets all of these, or at least close? My working guess is "the tetralemma applies to claims that purport to establish intrinsic nature and is suspended for mere conventional designations" — but I'm not sure that survives the two-truths case, since criterion itself looks like an intrinsic-nature claim, and I'm not sure it survives the LEM case either.

  What I want from you: the principle, stated precisely, with the case that motivates each clause. Which of my verdicts does it force me to drop, if any? And what does it predict for a case I haven't listed — whether the tetralemma applies to "the Buddha's teachings are true"? Commit to something. Pick the principle you actually think is right, tell me which verdict dies, and defend it. Don't hand me a two-level account and a uniform account and let me pick.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a professor designing a problem set for a graduate seminar on Madhyamaka Buddhism, specifically focusing on Nāgārjuna's tetralemma (catuṣkoṭi). The main challenge is distinguishing legitimate uses of the tetralemma from bogus ones. They've provided several cases where they think the tetralemma applies or doesn't, and they're seeking a consistent principle behind these judgments. Their deeper need is to find a reliable criterion for teaching students, avoiding contradictions in applying the tetralemma.

  Looking at their examples: self, causation, and emptiness get the tetralemma treatment, resulting in emptiness without nihilism. But for the table, two truths, and LEM, they argue it shouldn't apply. The conflict arises with the two-truths distinction—applying the tetralemma to it seems to undermine the framework used to justify other cases. Their proposed principle is about intrinsic nature claims versus conventional designations, but they worry it collapses when applied reflexively.

  The user wants a precise principle that covers all cases, even if it means sacrificing one verdict. They also want it tested on a new case: "the Buddha's teachings are true." They insist on a single defended principle, not multiple options. 

  Hmm... the core tension is between the tetralemma as a tool for de-reification and its own status. Nāgārjuna's point is that emptiness applies to everything—including emptiness itself and the two truths. The user's hesitation about the two-truths case might stem from fearing that emptying the distinction invalidates it. But in Madhyamaka, emptiness doesn't negate conventional functionality; it prevents reification. 

  For the principle: any concept that implies intrinsic nature (svabhāva) is fair game for the tetralemma. The table exists conventionally without such implications unless someone reifies it. The two-truths distinction, while conventional, can be reified into a rigid framework, so it must be emptied. LEM is tricky—it's a logical tool, not an ontological claim, so the tetralemma doesn't target it directly. 

  The sacrifice? Their "table" verdict holds, but the rationale shifts. The table isn't exempt because it's conventional; it's exempt because we don't usually attribute intrinsic nature to it in the context. If someone does, the tetralemma applies. 

  For "Buddha's teachings are true": if "true" implies ultimate truth, apply tetralemma to show it's empty; if conventional, it's pragmatically accepted. This maintains anti-dogmatism without nihilism. 

  Conclusion: The principle survives if we accept that even the two-truths distinction must be emptied, but this doesn't destroy its conventional use. The real issue is reification, not the concepts themselves.
answer: |-
  Here's a precise principle derived from Nāgārjuna's core project, designed to resolve your cases and force a verdict sacrifice:

  **The Tetralemma Principle:**  
  *The catuṣkoṭi applies exclusively to conceptual designations that (a) purport to establish or negate **ultimate existence (svabhāva)**, and (b) arise within a context of **metaphysical reification**. It is suspended for conventional designations operating under dependent origination without claims to intrinsic reality.*

  ### Case Analysis & Verdict Enforcement:
  1. **Self (applies):** Targets reification of "self" as a substantially existent entity (svabhāva). Rejection shows emptiness of self-nature, not denial of personhood. *Fits (a)+(b).*  
  2. **Causation (applies):** Targets reified notions of "production" as inherently existent. Rejection establishes dependent origination. *Fits (a)+(b).*  
  3. **Emptiness (applies):** Prevents reification of emptiness itself into a new svabhāva. *Fits (a)+(b).*  
  4. **Table (does NOT apply):** Conventional designation "table" doesn’t inherently claim svabhāva; it functions dependently. Applying tetralemma *forces* a reification that isn’t present in mundane use. *Violates (b).*  
  5. **Two Truths (applies):** The distinction can be reified into a rigid ontological split (e.g., "conventional is *truly* illusory, ultimate is *truly* real"). Must be emptied to avoid absolutizing the framework. *Fits (a)+(b).*  
  6. **LEM (does NOT apply):** LEM is a logical tool, not a metaphysical claim about reality’s nature. Applying tetralemma misunderstands its role. *Violates (a).*  

  ### The Sacrifice: Your "Table" Verdict Dies (But Survives Pragmatically)
  - **Why it dies:** Your initial exemption ("conventional designations") is too broad. The principle forces *all* concepts potentially subject to reification into the tetralemma’s scope. A table *could* be reified (e.g., "this table exists *inherently*"), justifying tetralemma application to dismantle that view.  
  - **How it survives conventionally:** After rejecting all four horns of the *reified* table, we return to the unreified conventional table. The tetralemma doesn’t negate conventional utility—only the imposition of svabhāva. Your intuition that "the table exists (conventionally)" holds *after* the tetralemma has done its anti-reification work.  

  ### New Case: "The Buddha’s Teachings Are True"  
  - **Verdict:** **Applies.**  
  - **Why:** "Truth" here risks reification into an absolute, intrinsic property (svabhāva). The tetralemma dismantles this:  
    - *True?* No (teachings are empty, not ultimately existent).  
    - *Not true?* No (conventionally effective).  
    - *Both?* No (mutually exclusive on reified terms).  
    - *Neither?* No (denies conventional functionality).  
  - **Resolution:** Like emptiness, the teachings are *conventionally* true (as upāya) but *ultimately* empty. Rejecting all four horns prevents dogmatism without negating pragmatic utility.  

  ### Defense of the Principle
  1. **Solves Reflexivity (Two Truths):** Applying the tetralemma to the two truths doesn’t destroy the distinction—it *protects* it from hardening into svabhāva. Emptiness of emptiness ensures the framework remains a provisional tool, not a metaphysical cage. This is precisely Nāgārjuna’s move in *Mūlamadhyamakakārikā* 24:18.  
  2. **Saves LEM Exemption:** LEM isn’t a *claim about reality*; it’s a rule of discourse. The tetralemma operates *using* logic to expose contradictions in reified concepts—it doesn’t refute logic itself (MMK 2:8).  
  3. **Explains "Table" Ambiguity:** The tetralemma applies *if* the table is framed in ontological terms (e.g., "Does it *truly* exist?"). If it’s purely conventional ("Pass the salt on the table"), no application is needed. Context determines (b).  
  4. **Rooted in Nāgārjuna:** This aligns with his project: de-reification of all views (including Buddhist ones) while preserving convention (VV 29: *sarvaṃ ca yujyate tasya śūnyatā yasya yujyate*).  

  ### Final Tally
  - **Kept:** Self, Causation, Emptiness, Two Truths, LEM.  
  - **Sacrificed:** Your original "table" verdict (now context-dependent).  
  - **Gained:** Consistency against reification *anywhere*, including your criterion itself (it too is empty, not ultimately valid).  

  **Ultimate Test:** If a concept *can* be absolutized, the tetralemma applies. If it’s purely instrumental (like LEM or mundane convention), it doesn’t. The principle dies the moment it becomes a dogma—which is why it must apply to itself.
