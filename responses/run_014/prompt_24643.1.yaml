  I teach an upper-level seminar in philosophical logic and I'm setting the final exam. I want one essay question, answerable in about 90 minutes, on the revenge liar problem for dialetheism. The question must not be answerable by reciting that dialetheists accept true contradictions and that paraconsistent logic blocks the principle of explosion; it should force students to reconstruct the revenge liar sentence for themselves and then judge whether the standard dialetheist reply (Priest's) — that the revenge liar is just a further true contradiction, and that the dialetheist is committed to accepting all such contradictions — genuinely disarms the threat or merely pushes it back. Please make the top band depend on at least one of these moves: showing that the predicate "is a true contradiction" can itself be diagonalized to generate a new contradiction, so the threat is a stable feature of the semantics rather than a one-off; explaining whether the dialetheist can maintain her position from a consistent classical metatheory or whether the meta-level must also be paraconsistent, and what that costs; or drawing the distinction between paraconsistency (a property of the logic) and dialetheism (a claim about reality) and locating the revenge problem in one of the layers — logic, semantics, or metaphysics. Give me the question, a model answer of roughly 500 words, and a marking scheme out of 20 that separates an A from a B answer by naming the specific moves an A answer must contain and the specific mistakes that cost marks.
reasoning: |-
  We are creating an essay question on the revenge liar problem for dialetheism, specifically targeting Priest's response. The question should require students to reconstruct the revenge liar and critically evaluate Priest's reply. The top band should depend on one of three specific moves.

  Question:
  "Dialetheists, such as Graham Priest, hold that some contradictions are true. They use paraconsistent logics to avoid triviality when faced with contradictions. The liar paradox ('this sentence is false') is a classic example that dialetheists take to be a true contradiction. However, the revenge liar problem arises when we consider strengthened liar sentences that seem to challenge the dialetheist's framework.

  (a) Construct a revenge liar sentence that targets the dialetheist's notion of a true contradiction. Explain how your sentence generates a problem for dialetheism.

  (b) Priest responds to the revenge liar by accepting that it, too, is a true contradiction and that the dialetheist is committed to accepting all such contradictions. Explain Priest's response and then critically evaluate it. Does this response genuinely disarm the revenge threat, or only push it back? In your evaluation, address at least one of the following: 
     (i) the possibility of diagonalizing the predicate 'is a true contradiction' to generate a new contradiction, and what this shows about the stability of the dialetheist's semantics;
     (ii) the issue of whether the dialetheist can maintain her position from a consistent classical metatheory, or whether she must adopt a paraconsistent metatheory, and the costs of that move;
     (iii) the distinction between paraconsistency (a property of the logic) and dialetheism (a claim about reality) and how the revenge problem might be located at the level of logic, semantics, or metaphysics.

  Your answer should demonstrate a clear understanding of the dialetheist position and the revenge problem, and go beyond merely stating that dialetheists accept contradictions and paraconsistent logics avoid explosion."

  Model Answer (approx. 500 words):

  (a) The standard revenge liar for dialetheism can be constructed by considering a sentence that says of itself that it is not a true contradiction. Let R be the sentence: "This sentence is not a true contradiction." Assume that R is a true contradiction. Then it is both true and not true (since it says it is not a true contradiction, and if it is true then it is not a true contradiction, which is a contradiction). But if we assume R is not a true contradiction, then what it says is true: it is not a true contradiction. However, if it is true and not a true contradiction, then it must be that it is either false or only true (without being a contradiction). But if it is true and not a contradiction, then it is simply true, but then it says it is not a true contradiction, which would be correct. Yet, if it is true and not a contradiction, then we have a problem: the dialetheist holds that the liar is a true contradiction, but R seems to be a sentence that is true and not a contradiction. However, if R is true and not a contradiction, then it is true and not both true and false. But then, if R is true, it says that it is not a true contradiction, which we have just accepted. So it is consistently true? But then we have a consistent truth that says of itself that it is not a true contradiction. However, the dialetheist might say that R is a true contradiction anyway. Then we have a contradiction about R: it is both a true contradiction and not a true contradiction? This seems to lead to a further contradiction. The problem is that R appears to force a contradiction about the status of being a true contradiction itself.

  (b) Priest's response is to embrace R as just another true contradiction. The dialetheist is committed to the existence of true contradictions, and R is no exception. Thus, the revenge liar is disarmed by being added to the list of true contradictions. However, this response might only push the problem back because we can now form a new sentence that says of itself that it is not a true contradiction and that it is not one of the sentences that the dialetheist has already accepted as a true contradiction (or perhaps that it is not in the set of true contradictions). This leads to an infinite hierarchy. Moreover, we can consider the predicate 'is a true contradiction' and see that it is susceptible to diagonalization. The dialetheist must hold that the extension of the predicate 'true contradiction' is inconsistent: there are sentences that are both in and not in the extension. This suggests that the revenge problem is a stable feature of the dialetheist's semantics, not a one-off.

  Regarding the metatheory: if the dialetheist uses a consistent classical metatheory, then she must assert that the object-language contains true contradictions, but the metatheory remains consistent. However, the revenge liar seems to show that the metatheory must also be paraconsistent because the object-language's semantic predicates (like 'true contradiction') lead to inconsistencies that the metatheory must account for. Adopting a paraconsistent metatheory is costly because it requires revising classical mathematics and may lead to a loss of strength in reasoning (e.g., classical reductio may not hold).

  Alternatively, we can locate the revenge problem in the semantics. Dialetheism is a metaphysical claim about reality (that some contradictions are true), while paraconsistency is a logical feature. The revenge liar targets the semantic machinery (the truth predicate and the notion of a true contradiction) that the dialetheist employs. Thus, the problem is at the semantic level. The dialetheist must provide a consistent (or paraconsistently acceptable) account of the semantics of the language that includes the truth predicate and the predicate 'true contradiction'. The revenge problem shows that this may not be possible without generating a new contradiction at every level.

  In conclusion, Priest's response does not disarm the revenge threat but only pushes it back, revealing an inherent instability in the dialetheist's semantic framework. The dialetheist must either accept an infinite hierarchy of increasingly complex revenge liars or adopt a paraconsistent metatheory, which comes with significant costs.

