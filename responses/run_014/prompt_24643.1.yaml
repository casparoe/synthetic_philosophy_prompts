answer: |-
  ### Essay Question

  **Question:** Dialetheism, as defended by Graham Priest, holds that there are true contradictions—sentences that are both true and false—and employs paraconsistent logics to avoid explosive triviality. The liar sentence ("this sentence is false") is often cited as an example of a true contradiction. However, the "revenge liar" problem challenges this view by constructing strengthened liar sentences that appear to undermine dialetheism from within.  

  (a) Construct a revenge liar sentence specifically targeting the dialetheist’s key notion of a "true contradiction" (i.e., a sentence that is both true and false). Explain precisely how your sentence generates a problem for dialetheism.  

  (b) Priest responds to such revenge sentences by asserting that they, too, are merely further true contradictions, and that dialetheism is committed to accepting all such contradictions as part of its ontology. Critically evaluate this response: does it genuinely resolve the revenge problem, or does it merely defer the problem to a new level? In your evaluation, you must address at least one of the following:  
  - (i) Demonstrate that the predicate "is a true contradiction" can itself be diagonalized to generate a new contradiction, and discuss whether this reveals an inherent instability in the dialetheist’s semantic framework.  
  - (ii) Analyze whether the dialetheist can maintain her position using a consistent classical metatheory, or whether she must adopt a paraconsistent metatheory. If the latter, explain the philosophical or practical costs of this move.  
  - (iii) Draw a clear distinction between *paraconsistency* (a property of a logic) and *dialetheism* (a metaphysical claim about reality) and locate the revenge liar problem within the layers of logic, semantics, or metaphysics.  

  Your answer should reconstruct the revenge liar from first principles and engage critically with Priest’s reply. Mere restatement of dialetheism’s core tenets (e.g., "true contradictions exist" or "paraconsistent logics avoid explosion") is insufficient.  

  ---

  ### Model Answer (Approx. 500 words)  

  **(a)** The revenge liar for dialetheism arises by targeting the concept of a "true contradiction." Consider the sentence R:  
  > **R**: "This sentence is not a true contradiction."  

  Assume R is a true contradiction. Then R is both true and false. If R is true, what it asserts must hold: R is not a true contradiction. But this contradicts our assumption. If R is false, then its negation holds: R *is* a true contradiction. Yet this also contradicts our assumption that R is false. Thus, R being a true contradiction implies a contradiction about its own status. Now assume R is *not* a true contradiction. Then R is either consistently true, consistently false, or truth-valueless. If R is consistently true, then it correctly asserts it is not a true contradiction—but this implies R is consistently true, which dialetheism denies by treating liar-like sentences as dialetheias. If R is consistently false, then it falsely claims not to be a true contradiction, meaning it *is* one—again a contradiction. The problem is that R forces a choice: either accept an unresolvable contradiction about the status of R (undermining the dialetheist’s semantic machinery) or concede that some liar-type sentences are consistently true/false, contradicting dialetheism’s core claim.  

  **(b)** Priest’s response is that R is simply another true contradiction: dialetheism embraces contradictions, so R’s paradoxical behavior poses no new threat. It is "just another dialetheia" in an ontology that already accepts contradictory sentences.  

  However, this response merely pushes the problem back and exposes a deeper instability. Consider point (i): the predicate "is a true contradiction" (symbolized **TC**) can be diagonalized. Just as the liar sentence uses truth, we can construct a new revenge sentence S:  
  > **S**: "This sentence is not in the extension of **TC**."  

  If S is in **TC**’s extension, it must be a true contradiction, so it is both true and false. But if true, it asserts it is not in **TC**’s extension—contradiction. If S is not in **TC**’s extension, it must be consistently true or false. Yet if consistently true, it correctly asserts it is not in **TC**’s extension, meaning it avoids contradiction—but then **TC**’s extension is incomplete. If consistently false, it falsely denies being outside **TC**, meaning it *is* in **TC**—another contradiction. This shows **TC** itself is inconsistent: there are sentences both inside and outside its extension. Crucially, this diagonalization can be repeated for any higher-order predicate (e.g., "is stably in **TC**"), generating an infinite hierarchy of revenge sentences. The problem is not a one-off but a stable feature of the dialetheist’s semantics: **TC** cannot be consistently defined without triggering new contradictions, suggesting dialetheism cannot "complete" its semantic project.  

  Alternatively, regarding (ii): the revenge problem forces the dialetheist into a paraconsistent metatheory. A classical metatheory (e.g., using ZFC set theory) would require a consistent definition of **TC**, but R and S show this is impossible. Thus, the dialetheist must adopt a paraconsistent metatheory where contradictions (e.g., about **TC**’s extension) are tolerated. However, this is costly: classical mathematics (relying on explosion and non-contradiction) becomes untenable. Basic results (e.g., Gödel’s theorems) may not carry over, and key metalogical tools (e.g., consistent model theory) collapse. If even the metatheory is dialetheic, it becomes unclear how to "explain" the object-language semantics without begging the question.  

  In sum, Priest’s reply fails to resolve the revenge problem. By treating revenge liars as more dialetheias, dialetheism survives pragmatically but concedes semantic instability. The threat persists because **TC**’s inconsistency reveals dialetheism cannot furnish a coherent, hierarchical semantics without recurring contradictions.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  #### **A-Grade (18–20 marks):**  
  - **Revenge liar construction (part a):** Correctly constructs R ("This sentence is not a true contradiction") and explains the problem clearly (e.g., generates a contradiction whether R is a true contradiction or not). (4 marks)  
  - **Priest’s response and critical evaluation (part b):** Accurately explains Priest’s reply (accepting R as a dialetheia) and provides a sophisticated critical evaluation. (4 marks)  
  - **Top-band move:** Successfully executes at least one of the three specified moves with precision:  
    - (i) Diagonalizes **TC** (e.g., constructs S) and argues this reveals *stable* semantic instability (e.g., infinite hierarchy, **TC**’s inconsistency).  
    - (ii) Argues that a consistent classical metatheory is impossible and discusses costs of a paraconsistent metatheory (e.g., loss of classical mathematics, circularity).  
    - (iii) Clearly distinguishes paraconsistency (logic) from dialetheism (metaphysics) and locates revenge in semantics (e.g., **TC**’s indefinability). (8 marks)  
  - **Structure and clarity:** Well-organized, concise, and free of errors. (2 marks)  

  #### **B-Grade (15–17 marks):**  
  - Revenge liar is mostly correct but may lack precision (e.g., uses "false" instead of "not a true contradiction"). (3 marks)  
  - Priest’s response is described, but evaluation is underdeveloped (e.g., claims revenge is "pushed back" without deeper analysis). (3 marks)  
  - Attempts one of the three moves but with minor flaws:  
    - (i) Diagonalizes **TC** but does not fully explain stability.  
    - (ii) Notes the need for a paraconsistent metatheory but omits costs.  
    - (iii) Distinguishes logic/metaphysics but mislocates revenge. (5–6 marks)  
  - Generally clear but may have lapses in coherence. (1–2 marks)  

  #### **C-Grade (12–14 marks):**  
  - Revenge liar is flawed (e.g., misconstructs R) or problem description is vague. (2 marks)  
  - Priest’s response is partially described; evaluation is superficial (e.g., "it works because dialetheism accepts contradictions"). (2 marks)  
  - Fails to properly address any of the three moves (e.g., mentions diagonalization but does not construct S). (3–4 marks)  
  - Disorganized or contains significant errors. (1 mark)  

  #### **D/F-Grade (0–11 marks):**  
  - Fails to construct R or explain the revenge problem. (0–1 mark)  
  - Poor understanding of Priest’s response; evaluation absent or incorrect. (0–1 mark)  
  - Does not engage with any specified move. (0–3 marks)  
  - Incoherent or overly brief.  

  #### **Key Deductions:**  
  - **-3 marks:** Answer merely recites dialetheism/paraconsistency basics without reconstruction or evaluation.  
  - **-2 marks:** Revenge liar uses "false" instead of "not a true contradiction."  
  - **-4 marks:** Fails to address at least one of the three moves.  
  - **-2 marks:** Evaluation only describes Priest’s view without critique.  

  ---  
  This exam question tests deep understanding by forcing students to *generate* the revenge liar and *evaluate* Priest’s reply through technical (diagonalization), metalogical (metatheory costs), or conceptual (logic/metaphysics) lenses. The A-grade requires one of these advanced moves to be executed flawlessly.
