prompt: |-
  I'm trying to figure out what I actually believe about moral worth — specifically, what it takes for an action to be performed "for the right reason" — by going on my gut reactions to a set of cases. Here are my verdicts, and I want to know whether a single principle, or a small set of them, captures the pattern, what that principle says about cases I haven't yet considered, and which of my verdicts it forces me to give up.

  1. A hospice nurse quietly raises a dying man's morphine because she judges that easing his suffering is what he needs and what a good nurse ought to do; nothing else is moving her. I assign this full moral worth.

  2. The same nurse, the same patient, the same dose — but this time she raises it because it is the last task before her break and she wants to be finished. The act is still the right one. I assign this little or no moral worth.

  3. A person catches a stranger who is stumbling, without any deliberation and without any thought of duty, simply because they are a warm, helpful kind of person. I am torn, but I lean toward full moral worth, even though the agent never acted on a moral principle.

  4. A person returns a lost wallet stuffed with cash because they are a devout believer acting on the conviction that it is a commandment of their faith, and the commandment happens to line up with what morality requires. I am torn again, but I lean toward full moral worth, because the believer genuinely takes the right thing to be right.

  5. A thief breaks into a corrupt billionaire's vault and donates the entire take to a children's hospital, fully aware that the theft is wrong but convinced that the moral arithmetic justifies it. I assign this no moral worth — the act is wrong, full stop — though I grant that the motive is genuinely good.

  6. A person keeps a promise to meet a friend for dinner because they know that keeping promises is right, and also because they genuinely look forward to the evening; both motives are present and both are doing real work. I assign this full moral worth.

  7. A person does not cheat on their taxes because they are terrified of the social disgrace of being found out. The act is right; the motive is pure fear of shame. I assign this little or no moral worth.

  8. A person who was raised from infancy to always do the right thing now does the right thing automatically, the way a musician plays a well-practiced piece, without ever reflecting on whether it is right. I assign this only partial moral worth, and I am not sure why it differs from case 3.

  The pairs that bother me most: I give case 3 (the instinctive helper) full worth but case 8 (the trained automatic person) only partial worth, even though neither ever deliberates about duty and both act rightly; and I give case 4 (the believer acting on a commandment) full worth, which seems to clash with any rule that says the operative reason must be the moral reason itself rather than something that merely coincides with it.

  Two cases I have not listed, and I would like your principle to say something definite about: (a) a person who forms the full intention to do the right thing for the right reason but is killed in a car accident before they can act; and (b) a person who does the right act for the right reason, but the act, through sheer bad luck, produces a bad outcome that no one could have foreseen.

  Please give me a principle, or a small set of candidates, stated precisely; for each, the clause that does the work in each of my cases; its verdicts on (a) and (b); and an honest statement of which of my verdicts it cannot accommodate and which I should be willing to drop.
reasoning: |-
  Okay, let me tackle this moral worth problem step by step. The user has presented eight cases with their intuitive judgments and wants a unifying principle that explains the pattern, especially the tensions between cases 3/8 and the status of case 4.

  First, I notice the user cares deeply about the agent's inner motivation - whether they're responding to the moral features of the situation itself. Cases 1 and 6 get full worth because the agents directly engage with the moral reality (easing suffering, keeping promises). Case 2 fails because the nurse ignores the moral dimension entirely. 

  The tricky cases reveal nuances: Case 3 suggests spontaneous virtue can have worth without deliberation, but case 8's "trained automaticity" feels different - perhaps because it lacks the warm responsiveness of natural virtue. Case 4 is fascinating - the religious agent gets credit because they recognize the commandment as morally authoritative, not just as arbitrary rule.

  For the thief case 5, the user insists the act is wrong despite good consequences, showing they reject pure consequentialism. Case 7 confirms that fear-based compliance has no worth. 

  Now for the proposed principle: "An act has moral worth iff the agent's motivating reason (a) includes awareness of the act's moral properties, and (b) treats those properties as sufficient reason for action." This handles most cases well:

  - Case 1: Nurse sees easing suffering as sufficient reason ✅
  - Case 2: Break timing isn't moral reason ❌
  - Case 3: Warm helper responds to need-as-suffering ✅ (if we charitably interpret their responsiveness)
  - Case 4: Believer sees commandment as moral requirement ✅
  - Case 5: Thief knows theft is wrong ❌
  - Case 6: Both moral and hedonic motives work ✅
  - Case 7: Fear ignores morality ❌

  But case 8 exposes a problem - the trained person might not actually register moral properties consciously. This reveals a tension in the user's own intuitions between valuing character versus conscious moral engagement. 

  For the bonus cases: (a) The unperformed intention gets no moral worth because no action occurred - which feels right to me. (b) The unlucky outcome doesn't erase worth since we're judging the motivation.

  Ultimately the user might need to soften their case 3 judgment or accept that trained virtue (case 8) could have worth if we imagine deeper moral sensitivity beneath the automaticity. The religious case 4 seems correctly placed - what matters is that they take the commandment to express moral truth.
answer: |-
  Based on your intuitions, the core principle capturing your pattern is:

  **The Moral Recognition Principle (MRP):**  
  *An act has moral worth iff (1) the agent acts rightly, and (2) the agent’s primary motivating reason includes recognizing the act’s right-making feature(s) as normatively decisive (i.e., treating them as sufficient reason to act).*

  **Key Components:**
  - **"Primary motivating reason"**: The reason that actually explains *why* the agent acts.
  - **"Recognizing right-making feature(s)"**: The agent must be aware of the property that makes the act right (e.g., easing suffering, keeping a promise).
  - **"Normatively decisive"**: The agent treats these moral properties as overriding/compelling, not merely coincidental or subordinate.

  ---

  ### **How MRP Explains Your Verdicts**
  1. **Hospice Nurse (Duty Motive)**:  
     - *Clause*: (2) She recognizes easing suffering as decisive.  
     - *Verdict*: **Full worth** ✅

  2. **Hospice Nurse (Break Motive)**:  
     - *Clause*: (2) Missing—she ignores the right-making feature (easing suffering).  
     - *Verdict*: **No worth** ✅

  3. **Instinctive Helper**:  
     - *Clause*: (2) Implied—their "warm helpfulness" is responsive to the right-making feature (preventing harm), treating it as decisive.  
     - *Verdict*: **Full worth** ✅  
     - *Note*: MRP allows non-deliberative recognition (e.g., character virtues).

  4. **Devout Believer**:  
     - *Clause*: (2) They recognize the commandment *as* morally decisive (it "lines up with morality").  
     - *Verdict*: **Full worth** ✅  
     - *Resolution*: The reason isn’t "God commands it" but "God commands it *because it’s right*"—so moral properties are decisive.

  5. **Thief (Good Consequences)**:  
     - *Clause*: (1) Missing—the act is wrong (theft).  
     - *Verdict*: **No worth** ✅

  6. **Promise-Keeper (Mixed Motives)**:  
     - *Clause*: (2) Moral reason (duty) is part of the primary motive and treated as decisive.  
     - *Verdict*: **Full worth** ✅  
     - *Note*: Non-moral motives don’t negate worth if moral recognition is *sufficient*.

  7. **Tax Complier (Fear of Shame)**:  
     - *Clause*: (2) Missing—fear ignores the right-making feature (fairness/justice).  
     - *Verdict*: **No worth** ✅

  8. **Trained Automatic Agent**:  
     - *Clause*: (2) Ambiguous—training may bypass *recognition* of right-making features.  
     - *Verdict*: **Partial worth** ✅  
     - *Tension with Case 3*: MRP explains your intuition: Case 3’s helper *embodies* moral sensitivity; Case 8’s agent may act robotically without engaging moral properties.

  ---

  ### **Verdicts on New Cases**
  **(a) Unperformed Intention (killed before acting):**  
  - *MRP Verdict*: **No moral worth**.  
  - *Why*: Moral worth applies to *actions*, not intentions alone. Condition (1) ("acts rightly") isn’t met.

  **(b) Right Motive, Unforeseeable Bad Outcome:**  
  - *MRP Verdict*: **Full moral worth**.  
  - *Why*: The act was right *ex ante* (based on available reasons), and the agent recognized the right-making features. Outcome luck doesn’t negate the worth of the motivation.

  ---

  ### **Where MRP Challenges Your Intuitions**
  1. **Case 8 (Trained Automatic Agent)**:  
     - *Conflict*: You assign partial worth, but MRP *could* allow full worth if training instills genuine moral sensitivity (like Case 3).  
     - *Recommendation*: Drop your verdict. If the agent’s character disposes them to respond to right-making features automatically (e.g., a virtuoso pianist "hears" moral reasons without deliberation), it may deserve full worth. Your current distinction between Cases 3 and 8 is unstable.

  2. **Case 4 (Devout Believer)**:  
     - *Conflict*: You worry it clashes if the believer acts *solely* because "God commands it."  
     - *Resolution*: MRP requires they see the command *as morally decisive*. If they’d return the wallet *even if* their religion allowed theft, full worth holds. If not, it lacks worth. Your intuition assumes the former.

  ---

  ### **Refinement for Stability: The MRP+**
  To solidify Case 8, add a **character condition**:  
  *Moral worth requires that the agent’s motive flows from a disposition to treat right-making features as decisive.*  
  - This preserves Case 3 (virtuous character) and upgrades Case 8 if training cultivates moral perception (e.g., Aristotle’s *phronimos*).  
  - If Case 8’s agent is merely conditioned (like a dog trained to obey), MRP+ assigns **no/little worth**—resolving your unease.

  ---

  ### **Summary**
  - **Principle**: Moral worth requires right action motivated by recognition of its right-making properties as decisive.  
  - **Accommodates**: All cases except your verdict on Case 8, which should be revised.  
  - **Predicts**: No worth for unperformed intentions; full worth for unforeseeable bad outcomes.  
  - **Your Key Insight**: You prioritize *moral perception* (seeing the act’s rightness) over deliberation or rule-following. This is Kantian in spirit but flexible enough for virtue ethics.  

  If you hold that Case 8’s agent *lacks moral perception* (unlike Case 3), MRP+ captures your pattern perfectly. If not, embrace full worth for Case 8—your intuition may reflect distrust of "unthinking" action, not its moral worth.
