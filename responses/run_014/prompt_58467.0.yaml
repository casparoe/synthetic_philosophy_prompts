  First, I need to understand the core goal: enabling students to reason about environmental responsibility. The opening module should set the stage for deeper inquiry without getting bogged down in comprehensive coverage. The user wants a defended agenda, not an overview. They mention criteria like conceptual priority, tractability for non-specialists, and impact on practical/political conclusions. Also, trade-offs, overrated aspects, and future evidence that could change priorities.

