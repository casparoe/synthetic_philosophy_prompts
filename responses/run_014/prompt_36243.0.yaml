  But the juicy part is their insight about dignity as the unifying thread. That’s novel-specific gold. His entire identity hinges on "greatness" through service, so admitting Darlington's flaws or his own loneliness would collapse his worldview. That’s not just two separate deceits—it’s one survival mechanism. 

