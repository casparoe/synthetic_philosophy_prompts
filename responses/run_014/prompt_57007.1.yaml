  For the translation: Well-formedness in programming is like syntactic correctness. Scope and binding determine where variables are defined. Static errors are caught at compile-time, dynamic at runtime. Presuppositions are like conditions that must be true for an expression to be meaningful at all.

  Clean translations: The "you can't deny X without X" structure maps directly to scope/binding. If you use a term, it must be bound. Negation doesn't affect this - just like presuppositions project through negation. Also, static vs dynamic failure: transcendental necessities are like static errors - caught at the "compile-time" of thought.

  Distorted translations: The necessity part. Programming necessity is about formal systems, transcendental necessity is about the world. Uniqueness is another problem - programming has multiple valid scoping structures, but transcendental arguments often claim their categories are the only possible ones. The "about the world" claim doesn't map well - programming deals with language, not reality.

  No equivalents: Genuine modality - transcendental arguments claim their conclusions are necessary for any possible experience, but programming only talks about necessity within a given system. Uniqueness - no way to say only one set of categories is possible. Argumentative force - transcendental arguments want to convince skeptics, but in programming, rules are just defined.

  Residue report: The clean parts are structural parallels. The distortions cost the necessity and uniqueness claims. The big missing pieces are genuine modality, uniqueness, and world-directedness.

