answer: |-
  ### Translation of Transccendental Arguments (Strong Form) into PLT Framework  
  **Target Argument:** Kant's "Refutation of Idealism" (B274-279) + Strawson's *Bounds of Sense* adaptation. Core claim: *"The possibility of coherent experience requires the existence of persistent outer objects."*  

  #### Step-by-Step Translation  
  1. **Skeptic's Claim (Input):**  
     *"I deny that outer objects exist; all experience could be illusory (e.g., a dream)."*  
     → **PLT:** A term `deny(outer_objects_exist)` is asserted.  

  2. **Transcendental Move:**  
     *"To even formulate this denial, you must presuppose a temporal framework for 'experience' (e.g., 'illusory' implies appearance/disappearance in time)."*  
     → **PLT:** `deny(outer_objects_exist)` requires a well-formed temporal context. The function `is_illusory(experience)` implies:  
     ```haskell  
     is_illusory : (t: Time) → Experience(t) → Bool  
     ```  
     **Static check:** `Time` must be in scope.  

  3. **Necessity Claim:**  
     *"Temporal sequence cannot be determined by subjective states alone; it requires reference to something persistent (outer objects)."*  
     → **PLT:** Evaluating `sequence_of_experiences` (e.g., `[e1, e2, ..., en]`) demands a `PersistentReferenceFrame` type. Without it:  
     ```ocaml  
     Error: Cannot resolve temporal ordering.  
     Reason: `Experience` instances lack immutable identity markers.  
     ```  
     **Failure mode:** Static type error (non-well-formed program).  

  4. **Uniqueness Claim (Kant's Strong Form):**  
     *"No other schema can fulfill this persistent-reference requirement; it must be mind-independent objects."*  
     → **PLT:** Attempt to substitute `PersistentReferenceFrame` with:  
     - `InternalRepresentation` (e.g., "self as anchor") → Fails: self-states are mutable.  
     - `AbstractEntity` (e.g., Platonic form) → Fails: lacks causal/temporal hooks.  
     **Result:** No valid implementation of `PersistentReferenceFrame` except `OuterObjects`.  

  5. **Conclusion:**  
     *"Therefore, outer objects exist necessarily for coherent experience."*  
     → **PLT:** `OuterObjects` must be in global scope for any program using `temporal_sequence` to compile.  

  ---

  ### Residue Report  
  **I. Claims Translating Cleanly**  
  - **Presupposition Projection:**  
    The structure "denying X requires X's scope" maps perfectly. Negating `outer_objects_exist` still requires `outer_objects` to be bound (e.g., like Russell's definite descriptions).  
  - **Static vs. Dynamic Failure:**  
    Kant's "conditions of possible experience" = static well-formedness. A skeptic's claim isn't *false* but *ill-formed* without outer objects (compile-time error).  
  - **Definitional Extension:**  
    Adding `OuterObjects` isn't a conservative extension—it enables new "statements" (e.g., temporal judgments) impossible in a solipsistic language.  

  **II. Claims Distorted (and Cost)**  
  - **Necessity as Formal Requirement:**  
    *Translation:* "`PersistentReferenceFrame` is a required interface for temporal sequencing."  
    *Cost:* Loses **modal force**. PLT necessity means "won't compile otherwise," but Kant means "impossible *in any conceivable world*." PLT can't express *metaphysical* necessity—only syntax for a given language.  
  - **Uniqueness as Implementation Constraint:**  
    *Translation:* "No other type satisfies the `PersistentReferenceFrame` trait."  
    *Cost:* Assumes our type system (conceptual scheme) is the only possible one. In PLT, you could design a language with `Time` primitives needing no persistence (e.g., discrete global clock). Kant's uniqueness relies on his *specific* categories (space/time as forms of intuition).  

  **III. No Expression in PLT Vocabulary**  
  1. **Genuine Modality:**  
     Transcendental necessity claims *real-world constraints*, not just language rules. PLT's "well-formedness" is syntax-dependent; Kant's necessity is *world-directed* ("experience must be structured thus"). No PLT construct captures "this is true of all possible minds."  
  2. **Uniqueness Beyond Grammar:**  
     The claim "only outer objects work" has no PLT correlate. You can always:  
     - Create a language with different primitives (e.g., "time" defined via recursion).  
     - Argue persistence could be virtual (e.g., a simulation).  
     PLT shows *our* scheme requires binding, but not that alternatives are *impossible*.  
  3. **Argument vs. Grammar Restatement:**  
     Transcendental arguments aim to *discover* truths (e.g., "objects exist"), but in PLT, they reduce to: "Our language's type system implies `OuterObjects`." This is tautological—like noting `int x` requires `int` defined.  

  ---

  ### Verdict: Residue Favors Your Vocabulary  
  The substantive core of transcendental arguments—**world-directed necessity** and **categorical uniqueness**—fails translation. What remains is:  
  - An observation about *our* conceptual scheme's "static semantics" (outer objects are a required binding).  
  - A useful map/territory reminder: skepticism about persistence is *ill-formed* in *this* language.  

  **Why not both-sides?**  
  - The argument *doesn't* refute skepticism; it shows skepticism relies on shared grammar. A solipsist could accept the PLT version ("Yes, my language needs 'outer objects' as a term") without believing in actual objects.  
  - Uniqueness claims collapse: 20th-century adaptations (e.g., Strawson) abandon Kant's idealism but keep the argument—yet PLT reveals this as changing the "language spec," not proving necessity.  

  **What Would Change My Mind:**  
  A demonstration that the **modality gap** can be closed. If you could show:  
  > *"A world without persistent objects would cause *dynamic* errors in *any* cognitive system (e.g., incoherent memory updates), not just static ones in *our* language."*  
  This would elevate it from "ill-formed in our syntax" to "crashes in all possible runtimes." But no such proof exists—it's precisely what the skeptic denies.  

  **Where Your Guess Was Off:**  
  You suspected uniqueness, but the larger hole is **modality**. Uniqueness fails *because* PLT has no access to real-world necessity. If modality translated cleanly, uniqueness might be salvageable as a "minimal viable implementation."  

  **Final Note:** Transcendental arguments are best seen as *diagnosing conceptual dependencies*, not proving reality. Your PLT lens exposes this—making them useful for map-territory clarity, but not for burying skeptics.
