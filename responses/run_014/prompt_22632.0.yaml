answer: |-
  Your friend raises a provocative point, but his argument contains significant historical and philosophical oversimplifications. Let's address your questions systematically:

  **(a) Was the covering-law model developed *exclusively* for the natural sciences?**
  **No, this claim is historically inaccurate.** While Carl Hempel and Paul Oppenheim's seminal 1948 paper ("Studies in the Logic of Explanation") focused on examples from physics, **Hempel explicitly intended the Deductive-Nomological (DN) model as a *universal* model of scientific explanation, encompassing history and the social sciences.**

  *   **Hempel's 1942 Paper:** His foundational work, "The Function of General Laws in History" (*Journal of Philosophy*), applied the core ideas of the DN model directly to historical explanation. He argued that historians implicitly rely on general laws (often of psychology, sociology, or economics) when making causal claims, even if they don't state them explicitly. His famous example involved explaining why a car's radiator cracked on a cold night – an explanation requiring the covering law of water expanding when freezing.
  *   **Explicit Statements:** Hempel repeatedly stated his belief in the unity of scientific method. He saw the DN model (and later the Inductive-Statistical model) as the standard for *all* empirical inquiry aiming at explanation, contrasting it with mere description or interpretive understanding (*Verstehen*). Historians rejecting the model weren't just resisting "physics envy"; they were rejecting what Hempel presented as *the* logical structure of explanation itself, applicable across domains.
  *   **Conclusion:** The model was *developed within* discussions of natural science but was *explicitly promoted* as applicable to history and the social sciences. Historians' rejection stemmed from a fundamental disagreement about the nature of explanation in their field, not merely resentment over an irrelevant import.

  **(b) Does the covering-law model *require* deductive validity? Is there a non-deductive form?**
  Hempel's model evolved, leading to two key forms:

  1.  **Deductive-Nomological (DN) Model:** This is the "classic" form.
      *   **Requires:** A deductively valid argument where the event to be explained (the *explanandum*) is logically entailed by the premises (the *explanans*).
      *   **The Explanans Must Include:**
          *   Statements describing specific initial conditions (antecedent facts).
          *   Statements of **universal laws** (nomological statements) of the form "Whenever conditions C1, C2,...Cn occur, event E occurs."
      *   **Example (Simplified):** "All metals expand when heated (Law). This bar is iron, a metal (Initial Condition 1). This bar was heated (Initial Condition 2). Therefore, this bar expanded (Explanandum)."

  2.  **Inductive-Statistical (IS) Model:** Recognizing that many explanations (especially in history, biology, social sciences) involve probability, Hempel developed this variant.
      *   **Structure:** The explanans confers a high **inductive probability** (but not logical certainty) upon the explanandum.
      *   **Requires:**
          *   Statements describing specific initial conditions.
          *   Statements of **statistical laws** (e.g., "Under conditions C, event E occurs with high probability p").
      *   **The "Requirement of Maximal Specificity" (RMS):** This crucial addition states that the statistical law cited must be the *most specific* one available relative to our current knowledge. We cannot omit relevant probability-affecting factors.
      *   **Correspondence to History:** Historians often offer explanations citing factors that make an outcome *highly probable* or *likely* (e.g., "The invasion failed *probably because* of the harsh winter and stretched supply lines"). The IS model *aims* to capture this structure. **A historian's probabilistic explanation could *in principle* correspond to an IS explanation.**

  **(c) Is the disagreement merely about scope, or is it substantive? Implications for historical narratives?**
  **Your friend's conclusion is largely indefensible. The debate is profoundly substantive, touching on the *nature* of explanation and understanding in history.** Here's why:

  1.  **The Core Substantive Disagreements:**
      *   **The Role of General Laws:** Covering-law models (DN & IS) insist explanation *requires* subsumption under general laws (universal or statistical). Narrative explanations often reject this, arguing that explaining a unique historical event (e.g., the outbreak of WWI) involves tracing *specific causal chains* and *contingent interactions* within a complex, unrepeatable context. The laws invoked by covering-law proponents are often seen as either too vague, non-existent for unique events, or trivial ("People tend to act in their perceived self-interest").
      *   **Explanation vs. Understanding (*Verstehen*):** Narrativists emphasize understanding the *meaning*, *intentions*, and *context* for historical agents. They argue that connecting events into a coherent story showing *how* one led to another provides understanding in a way that simply citing a probabilistic law does not. Covering-law models are often seen as unable to capture this dimension.
      *   **The Primacy of the Particular:** Narrative explanations focus on explaining *this specific event in its full concreteness*. Covering-law explanations focus on showing how this event is an instance of a general pattern. Critics (like W.B. Gallie or W.H. Danto) argue that history is fundamentally concerned with the particular sequence, not just its instantiation of laws.
      *   **The Problem of RMS in History:** Applying the IS model's Requirement of Maximal Specificity to history is notoriously difficult. Do we have access to *all* the relevant probability-affecting factors for complex historical events? Can we formulate precise statistical laws about, say, revolutions? Narrativists argue we often cannot, making the IS model an impractical ideal.
      *   **Causation:** Covering-law models link explanation to prediction and law-based causation. Narrative explanations often rely on a more flexible, "causal-mechanical" or "continuous series" notion of causation, tracing the actual sequence of events and influences without necessarily invoking strict laws.

  2.  **Implications for Historical Narratives:**
      *   **Explanatory Status:** If your friend's view were correct, historical narratives would simply be incomplete or implicit covering-law explanations. The substantive view argues that narratives offer a *distinct form of explanation*, achieving understanding through contextualization, emplotment, and revealing internal connections within a sequence, even in the absence of strict covering laws.
      *   **Validity Criteria:** Judging a historical narrative relies on criteria like coherence, comprehensiveness, plausibility given the evidence, ability to incorporate diverse factors, and resonance with the complexities of human agency – criteria quite different from testing the validity of a deductive argument or the statistical robustness of a probabilistic law.
      *   **Objectivity & Justification:** Covering-law models promise a strong form of objectivity based on logical structure or statistical evidence. Narrative explanations ground their justification in the rigor of source criticism, the strength of interpretive arguments, and the explanatory power of the coherent story constructed from the evidence.
      *   **The Goal of History:** The debate reflects a deeper disagreement about history's purpose. Is it to find general patterns of human behavior (leaning towards covering-law), or is it to understand unique events and human experiences in their particularity (leaning towards narrative)?

  **Conclusion:**

  While Hempel *did* develop the covering-law model with natural science examples and *intended* it to apply universally, his claim of universality is precisely what sparked the substantive debate. Historians and many philosophers of history reject the model not out of disciplinary resentment, but because they find it fundamentally inadequate for capturing what constitutes a *good historical explanation*. The availability of the IS model does not resolve this; the objections concerning the role of laws, the uniqueness of events, the nature of causation, and the importance of narrative understanding remain deeply substantive. **The disagreement is not merely about the *scope* of a model developed elsewhere; it's about the *essential character* of historical explanation itself.**

  This implies that historical narratives should be evaluated *on their own terms*. Their explanatory power lies in their ability to make a complex, unique past intelligible by constructing a coherent, causally connected, and contextually rich account, demonstrating *how* and often *why* events unfolded as they did, without necessarily being reducible to or dependent upon universal or statistical covering laws. They offer a distinct and indispensable form of understanding the human past.
