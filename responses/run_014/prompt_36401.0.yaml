prompt: |-
  I keep coming back to the preregistration stuff in psychology and something about it bugs me. The deal now is that if you write down your hypothesis and analysis plan before collecting data, your result counts as confirmatory evidence, but if you didnt, the exact same finding from the exact same data is "exploratory" — a hypothesis for future research, and a lot of journals won't treat it as real support for anything. There are badges for it, and registered reports where your methods section gets peer reviewed and accepted before you've even run the study.

  On its face this was sold as a frequentist clean-up job: kill p-hacking and HARKing by making the error rates honest. But heres what I can't shake. The classic Bayesian complaint about frequentist testing was always that the same data should give the same evidence regardless of the researcher's intentions or sampling plan — the likelihood principle, the stopping-rule stuff, all of that. And preregistration seems to double down on the opposite view: the epistemic value of a finding partly depends on what was in the researcher's head (and in a timestamped OSF file) before the data arrived. The reform that everyone frames as fixing frequentist practice seems to presuppose the exact thing Bayesians said was wrong with frequentism.

  So what does the preregistration regime actually presuppose about evidence? A few sub-questions. Is it just straight frequentism, where procedures and intentions are legitimately part of the evidential story? Or is it really an epistemology of the researcher rather than of the data — the preregistration being evidence of the person's trustworthiness, which is a different thing from evidential support proper? Could a good Bayesian sign on to the whole package coherently, or only to parts of it (pre-committing priors, sure, but discounting the data itself because of when the hypothesis was formed, no)? And where does the confirmatory/exploratory line actually break — pilot data, someone preregistering twenty hypotheses and reporting the one that hits, a "prediction" that was basically the whole field's prior expectation anyway? Basically: reconstruct the implicit view of evidence this practice needs, tell me which rival views it quietly rules out, and what would genuinely have to change if the field went fully Bayesian instead.
reasoning: |-
  Okay, let me try to unpack this user's query. They're deeply bothered by the tension between preregistration in psychology and Bayesian principles. The user seems knowledgeable about statistical paradigms, referencing concepts like the likelihood principle and stopping rules. Their core concern is epistemological: how can the same data have different evidential weight based solely on researcher intent (captured in preregistration)?

  Hmm, the user's framing suggests they've already spotted the fundamental conflict. Preregistration institutionalizes the very frequentist practices Bayesians criticized - making inference dependent on procedural history. Yet the field presents it as pure methodological reform. That dissonance needs unpacking.

  First, I should map why preregistration feels Bayesian-incompatible. The likelihood principle states evidence should derive solely from observed data, not unobserved intentions. But preregistration makes timing (pre/post data) epistemically decisive. Also, Bayesian updating cares only about prior and data - researcher's hypothesis-generation process seems irrelevant to evidential strength.

  But wait - maybe there's nuance. Could preregistration combat bias without violating Bayesian norms? Perhaps by addressing prior-data conflict. If a researcher crafts a hypothesis after seeing data, their "prior" is contaminated. Preregistration forces genuine priors. That might reconcile the practices. Though I suspect the user will counter that Bayesianism already handles this via prior sensitivity analysis.

  The trustworthiness angle is important too. When journals treat preregistered findings as more credible, are they really judging researcher reliability rather than statistical evidence? That would make preregistration sociological, not statistical. The user's question about "evidence of the person" hits this mark.

  For the confirmatory/exploratory boundary puzzles: pilot data usage, multiple-hypothesis fishing, field expectations... these expose ambiguities in intent-based standards. A Bayesian would handle all through model averaging and prior weighting, but current practices create arbitrary bright lines.

  If psychology went fully Bayesian, preregistration might transform into registering models/priors rather than analysis plans. Exploratory findings could feed into Bayesian updating rather than being dismissed. But bias concerns would shift to prior manipulation - hence registered priors might still matter.

  Ultimately the user wants to know which philosophies are compatible here. Frequentism accommodates preregistration naturally; Bayesians must reframe it as bias mitigation. The unspoken ruling-out is radical subjectivist Bayesianism that rejects any role for researcher intent. And the field would need massive retraining to handle Bayesian multiplicity solutions instead of binary preregistration gates.
answer: |-
  You've hit on one of the deepest philosophical tensions in modern scientific reform. Preregistration *does* fundamentally clash with strict Bayesian principles while aligning with (and extending) frequentist logic. Let's dissect the presuppositions and tensions:

  **1. The Core Presupposition: Evidence is Procedure-Dependent**
     - **Frequentist Anchor:** Preregistration presupposes that the *evidential meaning* of data depends crucially on the *process* that generated it and the *space of possible analyses considered*. A p-value's interpretation *requires* knowing the sampling plan and analysis path. Preregistration fixes these in advance, controlling Type I error rates across the hypothetical long run of identical studies.
     - **Rejection of the Likelihood Principle (LP):** This is explicit. Preregistration assumes the LP (that evidence depends only on the observed data's likelihood function) is inadequate for real-world science. Why? Because **researcher degrees of freedom** (p-hacking, HARKing, optional stopping) drastically inflate the *actual* long-run error rates of reported "significant" findings. The timestamped OSF file is a record of the *intended procedure*, defining the relevant error rate.

  **2. Epistemology: Trustworthiness & Evidential Weight are Entangled**
     - **It's Both:** Preregistration serves two distinct but related purposes:
       *   **Procedural Control:** Limits the "forking paths" problem, making inferential statistics (p-values, CIs) interpretable *as advertised* (frequentist justification).
       *   **Credibility Signal:** Provides strong evidence of researcher *trustworthiness*. Seeing a preregistration makes it vastly more plausible that the analysis wasn't p-hacked and the hypothesis wasn't concocted after seeing the data (epistemological/sociological justification).
     - **The Tension:** Journals often treat the *data itself* as having lower evidential weight if not preregistered. This conflates the *statistical evidence* (which, under LP, *should* be the same) with the *credibility of the claim* about *how the hypothesis was generated and tested*. Preregistration doesn't change the likelihood function; it changes our *confidence that the reported statistical measure isn't misleading* due to undisclosed flexibility.

  **3. Can a Bayesian Coherently Sign On?**
     - **Yes, but Selectively and Pragmatically:**
       *   **Pre-Commitment to Models/Priors:** A Bayesian can strongly endorse registering the *model* (likelihood + prior) before seeing data. This prevents prior-data conflict (tuning priors to fit the data). Preregistering an analysis plan *can* be seen as defining the likelihood structure.
       *   **Transparency & Bias Mitigation:** Bayesians value transparency. Preregistration forces disclosure of plans, reducing suspicion of HARKing/p-hacking. It acknowledges cognitive biases affecting researchers.
       *   **No, to Discounting the Data Itself:** A strict subjective Bayesian adhering to the LP *must* reject the idea that the *same data* provides *less evidence* for a hypothesis simply because the hypothesis was formed post-hoc. Evidence *is* captured by the likelihood ratio (Bayes factor) or posterior probability, given *some* prior. The *reliability of the researcher's process* might affect the *prior probability we assign to their specific hypothesis being true*, but it doesn't alter the *evidential update provided by this specific dataset*. A Bayesian might say preregistration increases the *base rate credibility* of a researcher's claims, not that the same data provides less *likelihood* support.
       *   **Pragmatic Acceptance:** Many pragmatically-minded Bayesians support preregistration as the best available tool *within the current scientific ecosystem* dominated by unreliable practices and frequentist frameworks, even if it violates pure LP.

  **4. Where the Confirmatory/Exploratory Line Breaks (The Fuzzy Boundaries)**
     Preregistration struggles with these gray areas, exposing its dependence on intent:
     *   **Pilot Data:** Using pilot data to *inform* methods (e.g., feasibility, effect size for power) is often acceptable. Using it to *refine the hypothesis* and then preregistering that "new" hypothesis blurs the line. Strictly, it's exploratory hypothesis *generation*.
     *   **Multiple Hypotheses (Multiverse/P-hacking Lite):** Preregistering 20 hypotheses and reporting only the significant one is technically "confirmatory" but violates the *spirit* by inflating family-wise error. Distinguishing planned vs. opportunistic requires trust. Preregistration *helps* by making the 20 public, but doesn't *solve* the multiplicity problem.
     *   **"Predictions" Aligned with Strong Priors:** If a hypothesis was the field's overwhelming prior expectation, finding support in preregistered data is confirmatory. However, if the prior was *too* strong (e.g., p=0.99), even strong data might only slightly increase belief (Bayesian perspective). Preregistration doesn't address *prior justification*.
     *   **Data-Dependent Analysis (Properly Disclosed):** Adding an *unplanned*, but sensible, analysis clearly labeled as exploratory is epistemically honest. The problem arises when unplanned analyses are presented *as if* they were planned confirmatory tests.

  **5. The Implicit View of Evidence & Rivals Ruled Out:**
     *   **Implicit View:** Evidence is **inherently procedural and historical**. The validity of statistical inference (especially frequentist) depends on knowing the *intended* design and analysis path *before* data collection. The epistemic weight of a finding combines the observed data *and* the researcher's pre-data commitments limiting flexibility. Trustworthiness is inseparable from evidential assessment.
     *   **Rivals Ruled Out:**
       *   **Strict Likelihood Principle / Radical Bayesian Subjectivism:** Views where evidence is *solely* contained in the likelihood function of the *observed data*, irrespective of sampling plan or analysis history, are fundamentally incompatible.
       *   **Naive Falsificationism:** The idea that a single clean experiment conclusively confirms or falsifies a hypothesis is rejected. Preregistration acknowledges that undisclosed flexibility makes single-study results highly unreliable.
       *   **Purely Sociological Views of Science:** While acknowledging sociology (trust), preregistration asserts that *statistical inference itself* requires procedural control, not just social norms.

  **6. If the Field Went Fully Bayesian: What Would Change?**
     Preregistration wouldn't vanish, but its role and form would shift dramatically:
     1.  **Focus on Priors & Models:** Registration would emphasize pre-specifying the *full generative model* (likelihood) and *justified priors*. Sensitivity analysis to priors would be mandatory. The question shifts from "Was it planned?" to "Is the prior defensible and independent of this data?"
     2.  **Evidential Weight = Bayes Factor/Posterior:** The same data yields the same BF/posterior regardless of timing. A post-hoc hypothesis with a strong, *justified* prior could carry substantial weight. The discounting would apply to *unjustified* priors crafted post-hoc, not the data itself.
     3.  **Exploratory = Model-Building:** Exploratory analysis would be explicitly framed as generating hypotheses/models for *future* testing (with new data or via cross-validation/Bayesian model averaging within the dataset, with clear penalties for complexity). Findings would be presented with appropriate uncertainty (e.g., posterior distributions, BFs treated as tentative).
     4.  **Multiplicity Handled Differently:** Bayesian model averaging, hierarchical modeling, and clear reporting of all tested models (with BF/posterior probabilities) would replace the binary "confirmatory/exploratory" split for multiple hypotheses. Registration would list *all* models considered.
     5.  **Reduced Emphasis on "Intent":** While transparency about process remains crucial, the *statistical evidential weight* would no longer hinge *primarily* on whether an analysis was timestamped *before* data collection. The focus is on model specification, prior justification, and comprehensive reporting of analyses/models.
     6.  **Registered Reports Still Valuable:** Pre-data peer review of *methods, models, and priors* would remain highly valuable to ensure quality, feasibility, and prevent poorly justified priors or models.

  **In Conclusion:** Preregistration is fundamentally a **frequentist error-control tool** wrapped in a **credibility-enhancing mechanism**. It presupposes that evidence is inseparable from the researcher's pre-data intentions and procedures to control long-run error rates. This directly contradicts the Bayesian Likelihood Principle. A coherent Bayesian can support parts of preregistration (transparency, pre-commitment to models/priors) as safeguards against bias and poor practice, but must reject the core idea that the *same data* provides *less statistical evidence* for a hypothesis solely because the hypothesis was formed after seeing the data. The Bayesian discount applies to the *prior justification* of the hypothesis or the *researcher's reliability*, not the evidential update from the data itself. Moving towards Bayesianism would transform preregistration from a gatekeeper of "confirmatory" status into a tool for ensuring model transparency, prior justification, and comprehensive reporting.
