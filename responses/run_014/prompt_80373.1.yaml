prompt: |-
  hey, i want you to write a satirical denial of benefits letter from a fictional government agency called the Department of Proper Function — in this world, the DPF is the body that assigns representational content to mental states based on their evolutionary history, think of it as the DMV for beliefs. the letter is addressed to a citizen whos moral intuition (the intuition that torturing innocent people is wrong) has been denied content status because the Department has determined that the intuition is a spandrel — a byproduct of natural selection that was never itself selected for. the letter should be written in bureaucratic language, cite the relevant regulations (the proper function requirement — a trait only represents if it was selected for representing; the spandrel exception — a trait that's a byproduct of selection can't represent; and the original instruction doctrine — a trait's function is fixed by its original selection history, not its current reliability), and offer appeals (the citizen can appeal by providing evidence that the intuition was selected for, or by arguing that the spandrel determination is erroneous). the satire should land on the real problem in teleosemantics (the spandrel problem: a trait that's a byproduct of selection can't represent anything, which is a genuine objection to Millikan's account) without stating it directly or winking at the reader. about 500-600 words, deadpan bureaucratic tone, like a real denial of benefits letter, but a reader who knows Millikan should recognize the satire as fair (i.e., the Department's reasoning should follow the actual logic of the teleosemantic account, not invent a new problem). no citations or reading list, just the letter itself.
