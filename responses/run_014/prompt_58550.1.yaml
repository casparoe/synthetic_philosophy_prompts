prompt: |-
  Having read rationalist blogs and forums for the better part of a decade, I have internalized the habit of dissolving confused concepts into operations, and I now need that habit made usable for others. I lead assessment design for a software apprenticeship that admits about twenty career-changers from several hundred applicants every six weeks. The stakes are livelihoods and cohort quality, and my assessors are working engineers with no training in psychometrics who have at most twenty minutes to vet a proposed task before our program director signs off on it.

  My problem is that our tasks all claim to select for intelligence, but they mean incompatible things by it: on one hand, accumulated knowledge and practiced skill; on the other, speed and efficiency in acquiring new skills when the environment is novel and uncertain; on still another, a bundle of largely independent aptitudes rather than one thing. I am also worried about Goodhart effects from coaching and from unrestricted use of AI assistants. I want you to translate that philosophical disagreement into a reusable vetting procedure that non-specialists can actually run.

  Give me a stepwise procedure, flowchart in words, with questions to ask in order about any proposed assessment task, what counts as passing each step, where a task fails outright, and where the procedure must defer to human judgment because the issue is normative or empirically underdetermined. The procedure must preserve the distinctions that matter most — between difficulty and novelty, between transfer near and far, between learning quickly from few examples and performing well after extensive practice, and between generality across goals and narrow optimization — while dropping whatever cannot be checked in twenty minutes. Mark explicitly the points where judgment cannot be eliminated and the kinds of tasks where you expect the procedure to misfire.

  Then demonstrate the procedure on these three candidate tasks we are actually considering:

  Task A, Alien Spreadsheet: 45 minutes, no internet, candidates may consult documentation for a fictional data-transformation language with twelve unfamiliar operators, then must clean a messy dataset containing edge cases not covered in the examples.

  Task B, Familiar Build: 48-hour take-home, open internet and AI tools allowed, to build a standard to-do application with login and persistence, graded on completeness, code organization, and polish.

  Task C, Broken Pipeline: 90-minute live exercise in a deliberately obfuscated and invented build system where half the files are irrelevant and several error messages point to the wrong cause, graded on diagnosing the root failure and getting a minimal deployment working.

  Show your work for each, include at least one verdict my team will dislike and explain why the procedure requires it, and close with a short statement of what the procedure cannot do and what it should never be used to justify.
reasoning: |-
  We are designing a vetting procedure for assessment tasks. The goal is to ensure that tasks are measuring what we intend (intelligence in various forms) and avoiding common pitfalls like Goodharting from coaching/AI, or conflating different aspects of intelligence.

  Key distinctions we must preserve:
  1. Difficulty vs. Novelty: Difficulty is about how hard a task is given the candidate's current knowledge, while novelty is about encountering something entirely new.
  2. Transfer near and far: Near transfer is applying knowledge to a similar context, far transfer to a very different one.
  3. Learning quickly from few examples vs. performing well after extensive practice.
  4. Generality across goals vs. narrow optimization: Whether the task tests broad adaptability or specific, narrow skills.

  We also worry about:
  - Goodhart effects: Candidates might optimize for the test in ways that don't reflect true ability (e.g., memorization, using AI without understanding).
  - Task design that conflates different types of intelligence (e.g., speed vs. depth, knowledge vs. learning ability).

  We have non-specialist assessors with 20 minutes per task.

  The procedure must be stepwise, with clear questions and pass/fail criteria, and mark where human judgment is necessary.

  Stepwise Procedure:

  Step 1: Clarify the claimed type of intelligence.
     Question: What specific aspect of intelligence does this task claim to measure? (Choose one or more from: accumulated knowledge, practiced skill, speed in novel environments, efficiency in learning new skills, a bundle of independent aptitudes, or something else?)
     Pass: The task clearly identifies at least one aspect and it is one of the types we care about (e.g., not just "intelligence" without specification).
     Fail: The task does not specify or the claim is too vague. (Fail outright if no clear claim.)
     Judgment: If the claim is a mix, we note that and proceed, but we must be cautious about conflating.

  Step 2: Check for conflation of key distinctions.
     Question: Does the task clearly separate (or at least not confound) the following pairs? 
        a. Difficulty and novelty (e.g., is the task novel to the candidate, or just hard because of complexity?)
        b. Near transfer and far transfer (e.g., does the task require applying known concepts in a slightly new way, or entirely new concepts?)
        c. Learning from few examples vs. performance after practice (e.g., does the task require learning during the task, or rely on prior practice?)
        d. Generality vs. narrow optimization (e.g., does the task allow multiple approaches, or force one narrow path?)
     Pass: The task design does not obviously confound these (e.g., it is clear which one it is targeting). If the task targets one of each pair, that's acceptable.
     Fail: The task design inherently mixes these in a way that we cannot tell what is being measured (e.g., it claims to measure learning ability but uses a domain the candidate is already expert in). (Fail outright if the conflation is severe and cannot be fixed by minor adjustments.)
     Judgment: Some tasks might intentionally combine aspects (e.g., both novelty and difficulty). We note that and proceed, but flag that the score might reflect multiple things.

  Step 3: Evaluate vulnerability to Goodhart effects.
     Question: How vulnerable is the task to being gamed by:
        a. Coaching: Can candidates be effectively coached to pass without having the underlying ability? (e.g., memorizing answers, learning tricks that don't generalize)
        b. AI assistants: If allowed, does the task require understanding, or can it be done by AI without candidate input? If not allowed, how enforceable is the ban?
     Pass: The task is designed to minimize these risks (e.g., by using novelty to prevent prior memorization, by requiring explanations, or by designing so that AI can only help in ways that still require candidate skill). For AI, if allowed, the task must require the candidate to integrate and understand the output.
     Fail: The task is highly vulnerable (e.g., it's a standard task that has known solutions online, or the AI can do it entirely without candidate understanding). (Fail outright if the vulnerability is severe and cannot be mitigated.)
     Judgment: The level of vulnerability is a spectrum. We set a threshold: if the task is more vulnerable than not, we fail. But if the task has mitigations, we might pass with a note.

  Step 4: Check for feasibility and validity under constraints.
     Question: 
        a. Given the time and resources (20 minutes of assessor time, and the candidate time allotted), can the task be reliably administered and scored? 
        b. Is the task likely to produce a valid signal for the claimed intelligence aspect? (e.g., a task claiming to measure learning ability should not be solvable by prior knowledge alone.)
     Pass: The task design is feasible and the signal is likely to be valid (e.g., a novel task with limited time is likely to measure learning speed and problem-solving in novelty).
     Fail: The task is too complex to administer or score reliably in the allotted time, or the signal is not valid (e.g., a task that claims to measure learning but gives no opportunity to learn). (Fail outright if either condition is not met.)
     Judgment: Validity is an empirical question, but we use common sense. If the task fails this step because of validity, we might fail outright.

  Step 5: Final judgment.
     After the above steps, if the task passed all steps without failing outright, we accept it. If it failed at any step, we reject it. If there are judgment calls that are borderline, we flag them and leave the final decision to the program director.

  Now, we apply the procedure to the three candidate tasks.

  Task A: Alien Spreadsheet
    - 45 minutes, no internet, fictional data-transformation language, clean messy dataset with edge cases.

  Step 1: Claimed intelligence? 
     Probably: ability to learn quickly from few examples (the documentation) and apply that learning to solve novel problems (the edge cases). Also, problem-solving in a novel and uncertain environment.

  Step 2: Conflation check.
     a. Novelty: High (fictional language, edge cases). Difficulty: Moderate to high (because of time pressure and edge cases). They are separated: the novelty is intentional and the difficulty comes from the novelty and complexity.
     b. Transfer: This is far transfer (entirely new language) but the task is about learning and then applying immediately (near transfer of what was just learned). This is acceptable for measuring learning ability.
     c. Learning vs. practiced skill: The task requires learning during the task (from the documentation) and then immediately applying. It does not rely on prior practice. So it's about learning quickly from examples.
     d. Generality: The task allows multiple approaches (how to use the operators to clean the data) and is not narrowly optimized. Pass.

  Step 3: Goodhart effects.
     a. Coaching: Hard to coach because of novelty (fictional language changes each time?). But if the fictional language is fixed, coaching could involve memorizing the operators. However, the edge cases might vary. Vulnerability: moderate. We can mitigate by changing the language and edge cases each cohort.
     b. AI: Not allowed, and enforced (no internet). So no issue. Pass.

  Step 4: Feasibility and validity.
     Assessor: They have to create the fictional language and dataset. In 20 minutes, they can check the documentation and the task for clarity and novelty? Probably, if the materials are pre-made. The task can be administered in 45 minutes and scored by checking the cleaned data. Validity: High for learning ability and problem-solving in novelty. Pass.

  Verdict: Pass.

  Task B: Familiar Build
    - 48-hour take-home, open internet and AI tools allowed, build a standard to-do app with login and persistence, graded on completeness, code organization, and polish.

  Step 1: Claimed intelligence? 
     Probably: accumulated knowledge and practiced skill (in building web applications), and also ability to produce polished, well-organized code. It might also claim efficiency (completing it in 48 hours) but note that 48 hours is a lot. It does not claim to measure learning ability (unless the candidate is new to web apps, but the task is standard).

  Step 2: Conflation check.
     a. Novelty: Low (it's a standard to-do app). Difficulty: Moderate (if the candidate is experienced) to high (if not). But the task does not separate them: it relies on prior experience (practiced skill) and does not measure learning.
     b. Transfer: Near transfer (building a common type of application).
     c. Learning vs. practiced skill: This is entirely about practiced skill. The task does not require learning during the task (unless the candidate is learning, but that's not the focus). It's about performance after practice.
     d. Generality: The task is narrow: build a to-do app. It does not test generality. It tests narrow optimization for a specific type of task. But note: the grading criteria (code organization, polish) might be general. However, the task itself is narrow.

     But note: the task claims to select for intelligence? If the claim is for accumulated knowledge and skill, then it passes. But if it claims to measure learning ability or adaptability, it fails. We must check Step 1: what is the claim? Let's assume the claim is about practiced skill and knowledge. Then Step 2 passes for that claim.

  Step 3: Goodhart effects.
     a. Coaching: High vulnerability. There are countless tutorials for to-do apps. Candidates can follow a tutorial and polish the result. They might not understand the code.
     b. AI: Allowed. Candidates can use AI to generate the entire app. They might just copy and paste. The grading criteria (completeness, organization, polish) can be achieved by AI without candidate understanding.

     Therefore, this task is highly vulnerable. It fails Step 3.

  Step 4: Feasibility and validity.
     Even though it's feasible to grade, the validity for measuring intelligence (if we mean learning ability or problem-solving) is low because it measures prior experience and can be faked. For accumulated knowledge, it might have some validity, but the Goodhart effects are too high.

  Verdict: Fail (due to Step 3). This verdict might be disliked because it's a common take-home task. But the procedure requires it because of the high vulnerability to coaching and AI.

  Task C: Broken Pipeline
    - 90-minute live exercise, obfuscated and invented build system, irrelevant files, misleading error messages. Graded on diagnosing the root failure and getting a minimal deployment working.

  Step 1: Claimed intelligence?
     Probably: problem-solving in a novel and uncertain environment, debugging under pressure, and learning from limited information.

  Step 2: Conflation check.
     a. Novelty: High (invented build system, misleading errors). Difficulty: High. They are not confounded because the task is designed to be novel and difficult because of the novelty.
     b. Transfer: Far transfer (entirely new build system).
     c. Learning vs. practiced skill: Requires learning during the task (how the invented build system works) and then applying that to debug. It's about learning quickly and problem-solving.
     d. Generality: The task allows multiple strategies for debugging. It tests general debugging and learning skills. Pass.

  Step 3: Goodhart effects.
     a. Coaching: Hard to coach because the invented build system can change. But if the patterns of obfuscation are similar, coaching might help. Vulnerability: low to moderate. We can mitigate by varying the system.
     b. AI: Not mentioned. Since it's a live exercise, we assume no AI. If it's taken in a controlled environment, then enforced. So pass.

  Step 4: Feasibility and validity.
     Assessor: They must design the broken pipeline. In 20 minutes, they can check that the build system is adequately novel and the errors are misleading? Probably, if they have a template. The task can be administered in 90 minutes. Scoring: based on diagnosing the root cause and minimal deployment. Validity: High for problem-solving in novelty and debugging. Pass.

  Verdict: Pass.

  Summary of verdicts:
  - Task A: Pass
  - Task B: Fail (due to Goodhart vulnerability)
  - Task C: Pass

  What the procedure cannot do:
  1. Guarantee that a task is valid. It only flags obvious issues.
  2. Replace empirical validation. We should still collect data on how well tasks predict future performance.
  3. Settle deep philosophical disagreements. It only makes them explicit.

  What the procedure should never be used to justify:
  1. Discriminatory practices: The procedure is about task design, not about candidate attributes.
  2. Overclaiming: Do not use it to say a task measures more than it does.
  3. Avoiding empirical work: Use this as a first line of defense, but follow up with data.

  Note: The procedure might misfire for tasks that are highly innovative or in domains where our key distinctions break down. Also, for tasks that are at the edge of what we consider intelligence, we must rely on judgment.
answer: |-
  ### Vetting Procedure for Assessment Tasks  
  This stepwise procedure evaluates tasks based on **what they claim to measure**, **key conceptual distinctions**, and **practical constraints**. It flags tasks that conflate intelligence facets or invite Goodharting. Assessors should run through steps sequentially—fail any step, and the task is rejected unless deferred to human judgment.  

  **Key Rules:**  
  - **Time Limit:** 20 minutes per task. Prioritize observable features (e.g., instructions, time limits, resources).  
  - **Defer to Judgment:** When trade-offs involve values (e.g., "How much novelty is enough?") or lack empirical evidence (e.g., "Will this *really* measure learning speed?").  
  - **Fail Outright:** If tasks ignore critical distinctions (e.g., confusing practice with learning) or are irredeemably vulnerable to gaming.  

  ---

  #### **Step 1: Clarify the Claim**  
  **Question:** *What specific facet of "intelligence" does this task claim to measure?*  
  - **Pass:** Explicitly names **one primary facet** (e.g., "learning speed in novel environments," not "general intelligence").  
  - **Fail:** Vague or multiple conflicting claims (e.g., "tests problem-solving and expertise").  
  - **Defer:** If the claim is debatable but plausible (e.g., "Is diagnosing errors *really* far transfer?").  
  - **Why:** Forces specificity. "Intelligence" must map to a measurable behavior.  

  #### **Step 2: Check Novelty vs. Difficulty**  
  **Question:** *Does the task separate prior knowledge/skill (difficulty) from adapting to new information (novelty)?*  
  - **Pass:** Novelty is central (e.g., unfamiliar tools/concepts) and unrelated to prior experience. Difficulty arises from complexity, not familiarity.  
  - **Fail:** Novelty is absent (e.g., tests pre-practiced skills) or conflated (e.g., "novel" task solvable with common knowledge).  
  - **Defer:** If novelty is ambiguous (e.g., "Is this spreadsheet language *truly* novel for career-changers?").  
  - **Why:** Learning speed ≠ performance after practice.  

  #### **Step 3: Check Learning vs. Performance**  
  **Question:** *Does the task force candidates to *acquire* new skills/knowledge during the assessment, not just apply existing ones?*  
  - **Pass:** Requires integrating new information *during the task* (e.g., learning from minimal examples).  
  - **Fail:** Rewards pre-existing expertise or memorization (e.g., building a common app type).  
  - **Defer:** If the balance is unclear (e.g., "Does consulting docs *during* the task sufficiently measure learning?").  
  - **Why:** Intelligence as "rapid skill acquisition" ≠ intelligence as "depth of practice."  

  #### **Step 4: Check Transfer Distance**  
  **Question:** *Does the task specify whether it measures near transfer (similar contexts) or far transfer (unrelated contexts)?*  
  - **Pass:** Clear context (e.g., "transfers debugging skills to unfamiliar systems"). Far transfer tasks use domains unrelated to prior training.  
  - **Fail:** Implicitly assumes far transfer but uses familiar domains (e.g., "tests general logic" via a well-known programming puzzle).  
  - **Defer:** If transfer distance is normative (e.g., "Is debugging a pipeline 'far enough' for our goals?").  
  - **Why:** Far transfer predicts adaptability; near transfer predicts job-specific skill.  

  #### **Step 5: Check Generality vs. Optimization**  
  **Question:** *Does success require broad, flexible problem-solving, or narrow optimization of a specific solution?*  
  - **Pass:** Allows multiple valid strategies (e.g., "clean data using any combination of operators").  
  - **Fail:** Rewards single-path solutions or "tricks" (e.g., "optimize for fewest lines of code").  
  - **Defer:** If trade-offs exist (e.g., "Does time pressure *force* narrow optimization?").  
  - **Why:** General intelligence ≠ task-specific virtuosity.  

  #### **Step 6: Evaluate Goodharting Risks**  
  **Question:** *Can coaching or AI tools trivialize the task without reflecting the claimed ability?*  
  - **Pass:** Coaching/AI might help but can’t replace core ability (e.g., AI generates code but candidate must debug novel errors).  
  - **Fail:** Coaching/AI provides near-complete solutions (e.g., "build a to-do app" has endless tutorials/AI templates).  
  - **Defer:** If mitigations exist (e.g., "Can we ban AI for subtask X?").  
  - **Why:** Avoids selecting for access to tools, not ability.  

  #### **Step 7: Feasibility Check**  
  **Question:** *Can assessors reliably score the task in <20 min without psychometric training?*  
  - **Pass:** Clear scoring rubric (e.g., "diagnose root cause: 3 points; minimal deployment: 2 points").  
  - **Fail:** Subjective scoring (e.g., "code quality") or requires longitudinal data (e.g., "measures long-term retention").  
  - **Defer:** If scoring hinges on untested assumptions (e.g., "Will 'polish' correlate with skill?").  
  - **Why:** Ensures practicality for untrained assessors.  

  ---

  ### **Application to Candidate Tasks**  
  **Key:**  
  - ✅ = Pass  
  - ❌ = Fail  
  - ⚠️ = Defer to judgment  
  - *Verbatim task quotes in italics.*  

  ---

  #### **Task A: Alien Spreadsheet**  
  *"45 minutes, no internet, candidates may consult documentation for a fictional data-transformation language with twelve unfamiliar operators, then must clean a messy dataset containing edge cases not covered in the examples."*  

  1. **Claim:** "Learning quickly from documentation and solving novel edge cases." ✅ (Specific to learning speed + novelty.)  
  2. **Novelty vs. Difficulty:** Novelty high (fictional language); difficulty from edge cases, not prior knowledge. ✅  
  3. **Learning vs. Performance:** Requires learning during the task (from docs). ✅  
  4. **Transfer:** Claims far transfer ("unfamiliar operators" → real-world data cleaning). ⚠️ (*Defer: Is data cleaning "far" enough from programming? Assessors decide.*)  
  5. **Generality vs. Optimization:** Multiple valid solutions (e.g., different operator combos). ✅  
  6. **Goodharting:** Low risk (no internet, novel language resists memorization). ✅  
  7. **Feasibility:** Scoring based on cleaned data output. ✅  
  **Verdict:** ✅ **Pass** (Deferred item unlikely to fail).  

  ---

  #### **Task B: Familiar Build**  
  *"48-hour take-home, open internet and AI tools allowed, to build a standard to-do application with login and persistence, graded on completeness, code organization, and polish."*  

  1. **Claim:** Vague—implies "practiced skill" (polish, organization) but also "efficiency" (48-hour limit). ❌ (*Fails: "Standard to-do app" conflicts with novelty; claims incompatible facets.*)  
  2. **Novelty vs. Difficulty:** Novelty **absent** (standard app). Difficulty from polish, not learning. ❌ (*Fails: Tests prior skill, not adaptation.*)  
  3. **Learning vs. Performance:** Rewards pre-existing skill (no new learning required). ❌  
  4. **Transfer:** Near transfer (web dev → web dev). ⚠️ (*Deferred, but irrelevant due to prior fails.*)  
  5. **Generality vs. Optimization:** Narrow (well-known solution paths). ❌  
  6. **Goodharting:** **Extreme risk**—AI/tutorials can generate 90% of the app. ❌ (*Fails outright: No mitigation possible.*)  
  7. **Feasibility:** Subjective scoring ("polish"). ❌  
  **Verdict:** ❌ **Fail** (Multiple fails; Goodharting alone is fatal).  
  - ***Why your team will dislike this:*** This task is common and efficient to administer, but the procedure flags it as psychometrically hollow—it selects for access to AI/Google, not adaptability.  

  ---

  #### **Task C: Broken Pipeline**  
  *"90-minute live exercise in a deliberately obfuscated and invented build system where half the files are irrelevant and several error messages point to the wrong cause, graded on diagnosing the root failure and getting a minimal deployment working."*  

  1. **Claim:** "Diagnosing root failures in novel, uncertain environments." ✅ (Specific to problem-solving under novelty.)  
  2. **Novelty vs. Difficulty:** High novelty (invented system, misleading errors); difficulty from uncertainty. ✅  
  3. **Learning vs. Performance:** Requires learning system quirks during the task. ✅  
  4. **Transfer:** Claims far transfer (debugging invented systems → real-world troubleshooting). ⚠️ (*Defer: Is invented build system "far" from real work? Assessors decide.*)  
  5. **Generality vs. Optimization:** Multiple valid approaches (e.g., trial-and-error, logic). ✅  
  6. **Goodharting:** Low risk (live setting, novelty resists prep). ✅  
  7. **Feasibility:** Clear scoring (diagnosis + minimal deployment). ✅  
  **Verdict:** ✅ **Pass** (Deferred item unlikely to fail).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Eliminate judgment:** Deference points (e.g., "Is this *really* far transfer?") require human deliberation.  
  2. **Ensure predictive validity:** It flags flaws but can’t prove a task predicts job performance. Empirical testing is still needed.  
  3. **Handle highly specialized tasks:** Tasks measuring rare aptitudes (e.g., "mathematical creativity") may misfire due to underspecification.  
  4. **Prevent all gaming:** It mitigates Goodharting but can’t stop novel exploits (e.g., new AI hacks).  

  ### **What It Should Never Justify**  
  - **Discrimination:** Never use it to argue that a task is "innately harder" for certain groups.  
  - **Overgeneralization:** Don’t claim a task measures "general intelligence" when it only tests narrow adaptability.  
  - **Stagnation:** Reject tasks that pass but lack empirical support. This is a sieve, not a stamp of approval.  

  ---  
  **Final Note:** The procedure prioritizes **conceptual clarity** over granular precision. It rejects Task B not because it’s useless, but because it conflates intelligence facets and invites cheating—making it unreliable for high-stakes selection. Use it as a first-line defense, then validate with data.
