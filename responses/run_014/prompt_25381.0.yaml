  The summary needs to encapsulate their position without oversimplifying: epistemic risk via framing, not total rejection. Should sound like \answer{Thought experiments risk epistemic harm through unexamined rhetorical design, demanding methodological reform.}

  Biggest challenge is balancing critique with constructiveness. Can't dismiss the field while standing in front of its practitioners. Need to show this comes from engagement, not contempt.
answer: |-
  Here's your Q&A prep sheet, designed for maximum realism and tactical readiness. I've ordered objections by combined likelihood and damage potential, with phrasing tuned to your audience:

  **Your Core Summary (Always Have This Ready):**  
  \answer{Thought experiments aren't neutral tools; they are often epistemically risky intuition pumps whose unexamined rhetorical design biases outcomes, demanding greater methodological scrutiny than the field currently provides.}

  ---

  ### Top 8 Likely & Damaging Objections

  1.  **The Senior Professor (Trolleyology Expert):**  
      *"You're conflating poor execution with inherent flaw. My book meticulously controls variables and isolates moral principles. Aren't you dismissing decades of careful, incremental refinement that *does* account for framing effects? This sounds like throwing out the baby with the bathwater."*  
      **Your 2-Minute Reply:** "I deeply respect that rigorous work – my target isn't careful practitioners like you, but the *default acceptance* of less rigorous pumps in the literature. Even refined versions embed subtle choices: why *these* variables controlled, *this* framing chosen? My plea is for that scrutiny to be mandatory and explicit, not exceptional. Your work shows it's possible, but it's not the norm."  
      **Soft Spot:** It concedes ground by praising their work, potentially weakening the broader critique. It doesn't fully counter the "baby/bathwater" charge for *other* experiments.

  2.  **Grad Student #1 (Dissertation Reliant on Specific TE):**  
      *"If thought experiments are so dubious, what alternative method do you propose for probing fundamental intuitions about, say, personal identity or non-consequentialist duties? Isn't abandoning them just retreating into armchair speculation without *any* intuitive anchor?"*  
      **Your 2-Minute Reply:** "I'm not proposing abandonment, but methodological reform. Alternatives exist: exploring real-world moral dilemmas (ethnography, history), cognitive science on *how* intuitions form, or rigorously testing variations against *each other* to expose framing effects. The 'anchor' isn't lost; we just need to acknowledge its source may be the pump's plumbing, not pure reason."  
      **Soft Spot:** "Alternatives" sound less precise or philosophically traditional. Doesn't fully satisfy someone needing a *clear* method *right now* for their dissertation.

  3.  **The Wittgensteinian:**  
      *"You're right they're nonsense, but for the wrong reasons! The problem isn't rhetorical bias; it's that they wrench concepts like 'intention' or 'person' out of their natural language-games, creating illusory puzzles. Your 'pumps' critique still plays their game!"*  
      **Your 2-Minute Reply:** "I agree language-games matter, but my critique complements yours. The pump *exploits* that wrenching – its rhetorical power often *comes* from smuggling in alien conceptual assumptions disguised as neutral descriptions. Recognizing the pump helps expose *how* the language-game is being distorted."  
      **Soft Spot:** Risks looking like you're borrowing their critique without fully embracing it. Might not convince them your approach is distinct *enough*.

  4.  **Smart Agnostic #1:**  
      *"Isn't *all* argumentation rhetorically loaded? Don't formal proofs, historical examples, or even data presentations also 'steer' thought? Why single out thought experiments? Isn't this just demanding an impossible neutrality?"*  
      **Your 2-Minute Reply:** "Absolutely, rhetoric is pervasive. But thought experiments are uniquely potent and *disguised* intuition pumps. They present themselves as simple, direct intuition-revealers, masking their construction. We're more critical of stats (p-hacking!) or history (source bias). TEs deserve similar scrutiny for their *specific* manipulative mechanisms – the vividness, the forced choices, the omitted details."  
      **Soft Spot:** Concedes the universality of rhetoric. Success hinges on convincing them TEs are *especially* problematic due to their presentation and perceived immediacy.

  5.  **Grad Student #2 (Invested in a "Monster" TE):**  
      *"You talk about 'steering', but isn't the point of a good TE precisely to challenge initial intuitions? Doesn't the Utility Monster *work* because it shocks us out of complacent utilitarianism? Isn't that steering valuable?"*  
      **Your 2-Minute Reply:** "It *can* be valuable provocatively, but is it *argumentatively* sound? The shock often relies on unstated, question-begging premises (e.g., the Monster's existence/metaphysics, the impossibility of distribution). Does it challenge utilitarianism, or just exploit our disgust/aversion to the *image* pumped? A valuable challenge needs to expose its mechanics, not rely on rhetorical gut-punch."  
      **Soft Spot:** Undermines the visceral impact some find philosophically useful. Might sound like dismissing provocative argument entirely.

  6.  **Smart Agnostic #2:**  
      *"Haven't philosophers *already* addressed this? Discussions of 'reliability' of intuitions, 'framing effects,' and Nichols & Knobe-style experimental philosophy work directly tackle your concerns. Isn't this critique already mainstream?"*  
      **Your 2-Minute Reply:** "X-Phi is a crucial step, but it often focuses on *intuition variation* across demographics, not the *rhetorical design of the TE itself* as the source of bias. Discussions of framing are usually *applied* to specific cases, not embedded as a core, required methodological critique for *all* TE use. The literature treats 'pump failure' as a problem *for the pump*, not as evidence of inherent epistemic risk *in the pump mechanism*."  
      **Soft Spot:** They have a point; the ground is shifting. Your reply hinges on distinguishing *analyzing* intuitions from *critiquing the pump's construction* as the primary epistemic risk.

  7.  **Senior Prof or Aggressive Agnostic:**  
      *"You're committing the genetic fallacy. Pointing out how an intuition is *produced* (by a pump) doesn't tell us anything about its *truth* or normative validity. A biased origin doesn't equal a false conclusion."*  
      **Your 2-Minute Reply:** "I'm not claiming it's *necessarily* false, but that its *epistemic status* is compromised. If an intuition is *manufactured* by the rhetorical setup, it loses its claim to be a reliable, pre-theoretical datum. It becomes evidence *for the effectiveness of the pump*, not necessarily for the moral proposition. We need independent justification beyond the pumped intuition itself."  
      **Soft Spot:** Requires careful distinction between origin and truth. Hard to prove the intuition *only* exists because of the pump in all cases. Leaves room for "But maybe it *is* true anyway!".

  8.  **The "Gotcha" Wittgensteinian or Agnostic:**  
      *"Aren't you using *thought experiments* yourself right now? (e.g., describing how a pump 'steers'). Doesn't your entire critique rely on the very tool you're condemning, making it self-defeating?"*  
      **Your 2-Minute Reply:** "Touché. I use *examples* descriptively, not as normative proofs. My argument isn't *based* on the intuitions pumped by my descriptions of pumps; it's based on analyzing their *structure and effects*. I'm trying to expose the mechanism, not leverage it for a conclusion. It's the *argumentative use as proof* that's problematic, not mere illustration."  
      **Soft Spot:** Very hard line to walk. Any vivid analogy risks being labeled a pump. Requires strict discipline in your own language.

  ---

  **The Question You're Praying Nobody Asks (But Prepare For It):**  
  *"Can you give us a single, clear, objective criterion – beyond just your own intuition about 'steering' – for distinguishing a legitimate, neutral thought experiment from an epistemically dubious 'intuition pump'? And if not, isn't your critique ultimately just a subjective complaint about style?"*  
  **Why it's Dangerous:** It demands a simple answer where none exists, potentially making your critique seem vague, subjective, or hypocritical.  
  **Your Lifeline Reply (2 Mins):** "There's no bright line, just like there's no single criterion for spotting bad statistics or misleading history. It's about *patterns of scrutiny*: Does the TE acknowledge its own contrivances? Does it test intuitions against variations and counter-pumps? Is its rhetorical force examined, not just exploited? Does it seek corroboration beyond the pumped intuition? The problem isn't subjectivity; it's the *lack of established norms* for this scrutiny. My complaint is about the *default presumption of neutrality*, not the impossibility of careful use."  
  **Honest Note:** This is your weakest spot. You're calling for a change in methodological culture and vigilance, not offering a magic bullet. It *will* feel unsatisfying to some.

  **Good luck! Your core summary is strong. Emphasize reform, not rejection. Frame it as wanting *better*, more self-aware philosophy.**
