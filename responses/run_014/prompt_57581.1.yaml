prompt: |-
  I'm not a lawyer or a professor, I fix small engines for a living and somehow ended up treasurer of the winter shelter in our town (northern Michigan, about 8,000 people). We've got to decide something Thursday and I'm supposed to send the board a written recommendation ahead of it. Can you write that for me? Here's the situation, as straight as I can lay it out.

  We run 22 cots, November through March, in a donated Legion hall. All volunteers except a part-time coordinator. Money comes about half from the county, half from church collections and one grocery chain. The fire marshal set our occupancy at 30 total including the two volunteers on shift, so 28 sleepers is the legal ceiling and we don't even reach that.

  Last winter we were full 41 nights out of roughly 120 open. Six nights we turned people away at the door. In February a man we'd turned away was found dead of exposure in a stairwell about 400 yards from the building. I was the one who signed the log that night.

  What changed: in June the county shut its 40-bed facility two towns over, budget reasons, and now there's a regional bus route that stops here. So the people who used to go there come to us, plus some from further out. Word travels. I expect us to be full most nights this winter, not six.

  Three board members, three positions, and I dont think any of them is dumb:

  - Hard cap at 22, doors at six, first come first served, everybody else gets the address of the mission 30 miles south. Honest, simple, we know what we're choosing.
  - Never turn anybody away. Mats on the day room floor, and if the marshal shows up we deal with it then, because the alternative is that stairwell.
  - Cap, but with a residency preference — county residents first, and the county that dumped its problem on us should be paying for the overflow.

  One of the cap people keeps saying "we're a lifeboat, not a ferry," and I can't tell if that's a real distinction or just a way of feeling better.

  Then there's the voucher thing and I don't know what to do with it. Two churches pool money for $25 motel vouchers for people we turn away; there's maybe eight nights' worth of money left for the whole season. One board member swears people show up late on purpose because a motel beats a cot. I don't think it's widespread but I can't disprove it, and if it's true we're paying people to not come in.

  So: draft the memo. It goes to six people with strong feelings and no time to read. Put the recommendation at the very top — what the actual rule is, who gets in, what happens to the ones who don't, who pays for what, and when we reopen the question. Then the reasons, including the strongest honest case for whichever position you're arguing against, because if you strawman the never-turn-anybody-away crowd they'll just dig in. Say what to do with the vouchers. My own gut is cap-plus-vouchers, but I don't fully trust my gut given that I signed the log.

  Under 450 words, hard, I mean it. And don't cite any laws, court cases or studies — I can't check them and neither can they. If something in the recommendation depends on a fact we'd have to go look up, just say so in plain words.
reasoning: |-
  Okay, the user is a treasurer for a winter shelter in a small Michigan town who needs help drafting a board recommendation memo. They're not a legal or policy expert—they fix small engines—but now they're in a tough position after a tragic incident last winter. 

  First, let's unpack their situation: Their shelter has 22 cots but legal capacity for 28 sleepers. Last year they turned people away six times, and one man died. Now with a nearby county shelter closed and new bus routes, overcrowding is guaranteed. The board is split between three options: strict capping, never turning anyone away, or capping with county residency preference. There's also a voucher program that might create perverse incentives.

  Hmm... their unspoken needs are palpable. That logbook signature haunts them—this isn't just about policy but about preventing another death. They need the memo to: 1) force a clear decision 2) acknowledge all viewpoints fairly 3) address voucher risks 4) fit busy volunteers' attention spans 5) sound human, not bureaucratic. 

  The "lifeboat vs ferry" metaphor bothers me. It's a false dichotomy—emergency shelters are both. But dissecting that won't help their practical deadline. 

  For structure: Top-load the recommendation since they emphasized that. Then: problem summary → options → rationale → implementation steps. Must stay under 450 words while showing respect for each board member's position. 

  Key tensions to balance: 
  - Safety vs compassion (fire code vs exposure deaths) 
  - Honesty about risks (their gut knows vouchers could be gamed but saving lives matters more) 
  - Local resources vs regional crisis (that county-dumping resentment is valid) 

  The voucher dilemma is thorny. Evidence suggests "motel gaming" is rare—people prefer dignity over sketchy rooms—but I'll present it neutrally since one board member is convinced. 

  Finally, the tone: Must match their voice (mechanic-treasurer, not professor). Short sentences. Concrete verbs. No jargon. Acknowledge the weight of last February without being maudlin. 

  ...Writing now with the image of that stairwell in mind. This isn't about words—it's about not freezing to death in a small town winter.
answer: |-
  **MEMO: URGENT SHELTER CAPACITY RECOMMENDATION**  
  **TO:** Winter Shelter Board Members  
  **FROM:** Treasurer  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Occupancy Policy & Voucher Use (Vote Thursday)  

  **RECOMMENDATION:**  
  Implement a **soft cap at 28 sleepers** (fire marshal’s total occupancy limit). Use church vouchers for **overflow when space is full**, prioritizing families, medically vulnerable individuals, and extreme weather. County residents get first access until 22 cots are filled; non-residents use floor mats/vouchers. Demand the county fund overflow costs next season. Re-evaluate policy by December 15th based on nightly demand.  

  **Why This Approach:**  
  1.  **Safety & Legality:** A hard cap at 22 ignores our legal capacity of 28. Floor mats for 6 more are safer than turning people into freezing temperatures, as we tragically saw last February. Never exceeding 28 avoids fire risks and potential shutdown.  
  2.  **Compassion & Reality:** Closing doors at 6 with only a hard cap ignores increased regional need. We *can* safely shelter more than 22. Vouchers provide a last-resort safety net when we hit 28.  
  3.  **Fairness & Cost:** Prioritizing county residents first (for cots) acknowledges our primary funding source and the impact of the neighboring county’s closure. However, refusing non-residents entirely is unsustainable and inhumane. Mats/vouchers for overflow balances local responsibility with crisis response.  
  4.  **Voucher Clarity:** Use vouchers **only when we are at 28 sleepers**, not as a first option. This minimizes potential for "motel gaming." If someone arrives late hoping for a voucher, they risk getting nothing if vouchers are depleted. Track voucher use nightly to see if abuse patterns emerge.  
  5.  **County Accountability:** We must formally demand the county cover overflow costs (mats, vouchers, coordination) starting next budget cycle. Their closure directly increased our burden.  

  **Strongest Case for the Hard Cap (22):**  
  It’s administratively simple, eliminates legal ambiguity, and forces neighboring communities/the county to confront the crisis they helped create. "We are a lifeboat" means focusing finite resources on our core mission without risking violation or mission creep.  

  **Strongest Case for Never Turning Anyone Away:**  
  The moral imperative is absolute: "better a crowded floor than a frozen stairwell." Enforcement is unlikely on the coldest nights, and saving lives justifies the risk.  

  **Why My Recommendation Balances Both:**  
  The hard cap ignores our *actual* safe capacity (28) and the human cost. "Never turn away" risks our entire operation if enforced. Our soft cap at 28 uses all safe space, deploys vouchers strategically as a true last resort, pushes costs to the responsible county, and forces a rapid re-evaluation as real winter demand hits. We *must* use the capacity we legally have.  

  **Next Steps:**  
  Vote Thursday on the occupancy policy. If approved, I’ll draft the formal county funding request immediately. Monitor occupancy/voucher use daily starting opening night.  

