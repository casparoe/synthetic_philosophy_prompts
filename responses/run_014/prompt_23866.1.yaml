prompt: |-
  I sit on the advisory board of a foundation that makes effective-altruism-style grants across global health and long-run causes such as institutional reform and catastrophic-risk reduction. Every funding cycle, its program officers face the same problem: consequentialism tells them to rank proposals by expected total consequences, but they are clueless about most of those consequences beyond a short horizon. Write a decision procedure a program officer, not a philosopher, could run on a proposal before it goes to the funding committee: the questions to ask in order to tell simple cluelessness (unmodeled effects that wash out symmetrically across the live options) from complex cluelessness (reasons pulling in different directions that don't net out); what counts as a sufficient answer at each step; where the procedure stops and returns no ranking; and where it instead hands the call to the committee, because what's left is a question of values rather than a further fact. Run it on two live grants -- a global-health intervention with well-modeled near-term effects, and a policy-advocacy grant meant to shift a long-run institution -- and don't soften the verdict if the foundation's favored long-termist bet is the one that fails.
reasoning: |-
  We are designing a decision procedure for a program officer to evaluate proposals in the face of cluelessness. The goal is to distinguish between:
   - Simple cluelessness: unmodeled effects that are symmetric across options and thus can be ignored because they "wash out".
   - Complex cluelessness: unmodeled effects that pull in different directions and do not net out, requiring further consideration.

   The procedure should help decide when to rank a proposal and when to either not rank (return no ranking) or hand the decision to the committee because the remaining issue is a question of values.

   Steps for the decision procedure:

   1. **Define the proposal and the counterfactual**: What is the proposed intervention? What is the baseline (what would happen without the grant)? The program officer must be able to articulate the direct, near-term effects of the proposal and the counterfactual.

   2. **Identify the main pathways to impact**: What are the key causal pathways by which the intervention is expected to produce its effects? Focus on the most important ones (e.g., 1-3 pathways).

   3. **Model the direct and near-term effects**: For each pathway, model the direct effects (within a short horizon, say 5-10 years) as best as possible. This includes both intended effects and any foreseeable negative side effects in the near term.

   4. **Check for simple cluelessness**:
      - Ask: Are there other effects (beyond the near-term) that we are not modeling? If no, then proceed to step 5.
      - If yes, then ask: Are these unmodeled effects likely to be symmetric across the intervention and the counterfactual? That is, do they affect both scenarios in the same way and to a similar magnitude? 
          - If the program officer can argue that the unmodeled effects are symmetric (e.g., the intervention does not change the long-run trajectory in a way that would make these unmodeled effects systematically different), then they can be ignored (simple cluelessness). Proceed to step 5.
          - If the unmodeled effects are likely to be asymmetric (i.e., the intervention might change the trajectory in a way that makes these unmodeled effects different from the counterfactual), then we have complex cluelessness. Proceed to step 6.

   5. **Calculate the near-term net effect**:
      - Using the modeled near-term effects, compute the net effect (benefits minus costs) of the intervention compared to the counterfactual.
      - If the near-term net effect is positive and substantial, then the proposal can be ranked positively (and vice versa). However, if the near-term net effect is negative, then the proposal is not recommended unless there are strong reasons to believe in very large long-term benefits that we haven't modeled (which we are not modeling because of cluelessness). But note: we are in step 5 because we have either no unmodeled long-term effects or only simple cluelessness. Therefore, we can base our decision on the near-term net effect.
      - However, if the near-term net effect is very small (or zero) and we have already accounted for simple cluelessness, then we cannot rank the proposal because we don't have a basis for comparison. In that case, return no ranking.

   6. **Handle complex cluelessness**:
      - If we have identified asymmetric unmodeled effects (complex cluelessness), then we must try to break down the long-term effects into distinct pathways that we can model to some extent.
      - For each long-term pathway:
          a. Identify the sign (positive or negative) and the magnitude (if possible, even roughly) of the effect.
          b. Assess the uncertainty (high, medium, low) and the robustness of the sign (i.e., is the sign likely to hold under different scenarios?).
      - If the program officer can determine that one pathway clearly dominates (e.g., all pathways point in the same direction and the magnitude of the dominant pathway is much larger than the others) then they can make a ranking accordingly.
      - If the pathways pull in different directions and the net effect is unclear (even after a rough attempt to weigh them), then:
          - If the near-term net effect is large and positive (or negative) and the long-term effects are highly uncertain and potentially offsetting, then the program officer might base the ranking on the near-term effect. However, if the long-term effects are potentially very large (even if uncertain) and could reverse the near-term effect, then we cannot rely solely on the near-term.
          - In such a case, the program officer should hand the decision to the committee because the remaining uncertainty is about how to weigh the long-term possibilities (which is a matter of values and risk preferences).

   7. **Handing to the committee**:
      - The procedure hands the call to the committee when:
          a. There is complex cluelessness and the net effect (including long-term) cannot be determined even roughly by the program officer (because the pathways are too uncertain and pull in different directions).
          b. The decision depends on value judgments (e.g., how to weigh potential catastrophic risks against near-term benefits, or how to discount the future) that are beyond the program officer's mandate.

   8. **Return no ranking**:
      - When the near-term net effect is negligible and there is no clear long-term effect (either because of simple cluelessness and no near-term effect, or because complex cluelessness leads to no clear net effect even after analysis).

   Now, let's run the procedure on two grants:

   **Grant 1: Global-health intervention (e.g., distributing bed nets to prevent malaria)**

   Step 1: Proposal and counterfactual
     - Proposal: Distribute insecticide-treated bed nets in a region with high malaria transmission.
     - Counterfactual: Without the grant, the bed nets would not be distributed (or distributed in a smaller quantity or later).

   Step 2: Main pathways to impact:
     - Pathway 1: Reduced malaria incidence in the target population in the near term (e.g., 5 years) leading to fewer deaths and illnesses.
     - Pathway 2: Economic benefits due to reduced illness (people can work more, children can attend school).

   Step 3: Model near-term effects:
     - We can model the reduction in malaria cases and deaths using existing epidemiological models. We can also model the economic benefits (e.g., using cost-effectiveness analyses). There may be some negative side effects (e.g., insecticide resistance, environmental impact) but these are typically small in the near term and can be modeled.

   Step 4: Check for simple cluelessness:
     - Are there unmodeled long-term effects? Yes, for instance:
          - Long-term economic growth: The intervention might lead to a healthier and more productive population in the long run, which could have positive effects on economic development and even governance.
          - Long-term demographic effects: Preventing child mortality might lead to lower fertility rates and a demographic dividend, but it might also increase population size and thus strain resources.
          - Long-term evolutionary effects: Widespread use of bed nets might lead to mosquito resistance or behavioral changes in mosquitoes.
     - However, note that the counterfactual also involves a population that is likely to eventually get bed nets (as countries develop) or other malaria interventions. Moreover, the long-term economic and demographic effects are highly uncertain and might be symmetric: without the intervention, the population might eventually achieve the same health outcomes but later, so the long-term trajectory might not change dramatically. Similarly, insecticide resistance is a global problem and might occur regardless (so symmetric). Thus, these unmodeled effects might be symmetric and wash out.

     - Therefore, we can treat this as simple cluelessness and proceed.

   Step 5: Calculate near-term net effect:
     - The near-term effects (lives saved, illnesses averted, economic benefits) are strongly positive and well-documented. The cost per life saved is low. The near-term net effect is large and positive.

     - **Verdict**: Rank highly.

   **Grant 2: Policy-advocacy grant to shift a long-run institution (e.g., advocating for a change in international governance to better handle pandemics)**

   Step 1: Proposal and counterfactual:
     - Proposal: Fund an advocacy group to push for reforms in the World Health Organization (WHO) to improve pandemic preparedness and response.
     - Counterfactual: Without the grant, the advocacy effort would be weaker and the reform might not happen (or happen later).

   Step 2: Main pathways to impact:
     - Pathway 1 (Near-term): Build a coalition of advocates and experts, draft policy proposals, and lobby key decision-makers. This might lead to a reform being adopted in the next few years.
     - Pathway 2 (Long-term): If the reform is adopted, it could lead to better pandemic preparedness, which might reduce the probability and severity of future pandemics. This could save millions of lives in the long run.

   Step 3: Model near-term effects:
     - Near-term effects: The grant might lead to a reform (or not). We can model the probability of the reform being adopted in the next 5 years (say 20% chance of success). The cost of the grant is known. However, the near-term effects of the reform itself (if adopted) might be minimal because there might not be a pandemic in the near term.

   Step 4: Check for simple cluelessness:
     - Are there unmodeled long-term effects? Yes, beyond the pandemic risk reduction, the reform might have other institutional effects:
          - Positive: Strengthening global governance could have spillover benefits for handling other global catastrophic risks (e.g., biosecurity, climate change).
          - Negative: The reform might centralize power in a way that leads to inefficiencies or even increases the risk of misuse of power (e.g., if the reformed institution becomes too powerful and is co-opted by malign actors). It might also divert attention and resources from other important issues.

     - Are these symmetric? Not at all. The counterfactual (no reform) does not have these potential effects. The reform might set the world on a trajectory that is systematically different. Therefore, we have complex cluelessness.

   Step 6: Handle complex cluelessness:
     - We break down the long-term pathways:
          a. Pathway A: Reduced pandemic risk (positive effect, potentially very large if a pandemic is averted).
          b. Pathway B: Spillover benefits to other global catastrophic risks (positive, but uncertain and hard to quantify).
          c. Pathway C: Risks of centralization and misuse (negative, potentially catastrophic if the institution becomes a tool for oppression or fails catastrophically in a crisis).

     - We try to assess:
          - The magnitude: Pathway A is large (millions of lives saved) but uncertain (depends on the probability of a pandemic and the effectiveness of the reform). Pathway B could be even larger (if it helps with multiple risks) but is even more uncertain. Pathway C is a tail risk with potentially very negative consequences but low probability.
          - The uncertainty is high for all pathways.

     - The net effect is unclear because:
          - The positive pathways (A and B) might be huge, but the negative pathway (C) could also be huge (though perhaps less likely). We cannot easily weigh them.

     - The near-term net effect is not a good guide: the reform might not have any near-term impact (if no pandemic occurs) and the advocacy effort itself might have minimal near-term effects (if it fails). The near-term net effect might be zero or even slightly negative (if the advocacy uses resources that could have been used elsewhere).

     - Therefore, we cannot determine the net effect. We must hand this to the committee because:
          - The decision depends on how we weigh the potential for very large long-term benefits against the risk of long-term harm (which is a value judgment about risk tolerance and the importance of catastrophic risk reduction).
          - Also, the foundation's values might prioritize long-termist bets even in the face of uncertainty, but that is a committee decision.

   Step 7: **Verdict**: Hand to the committee.

   However, note that the procedure does not soften the verdict even if the foundation's favored long-termist bet fails. In this case, the program officer cannot rank the proposal because of complex cluelessness. The committee must decide.

   **Summary of outcomes**:
     - Grant 1 (bed nets): Rank highly (proceed with funding).
     - Grant 2 (policy advocacy): Hand to the committee (program officer cannot rank).

   Note: The foundation might have a mandate to prioritize long-termist causes. However, the procedure is designed to be objective. The program officer should not override the procedure because of the foundation's general orientation. The committee, however, can decide to fund the policy advocacy grant even without a clear ranking from the program officer, based on their values and risk tolerance.
answer: |-
  ### Decision Procedure for Program Officers: Handling Cluelessness

  This procedure helps program officers distinguish **simple cluelessness** (unmodeled effects that cancel out symmetrically) from **complex cluelessness** (unmodeled effects that pull in conflicting directions). It identifies when to rank a proposal, when to abstain from ranking, and when to escalate to the funding committee for value-based decisions.

  ---

  #### **Step 1: Map Direct, Near-Term Effects**
  **Question:**  
  *What are the direct, measurable outcomes of this intervention within 5–10 years? Include both benefits and harms.*  
  **Sufficient Answer:**  
  A clear causal model with empirical support (e.g., studies, historical analogs) quantifying:  
  - Target population impacted.  
  - Primary outcomes (e.g., lives saved, policy changes).  
  - Costs (financial, operational, opportunity costs).  
  **Procedure:**  
  - If outcomes are **not quantifiable** (e.g., speculative theory without data), **stop and return no ranking**.  
  - If outcomes are quantifiable and net-positive/net-negative, proceed to Step 2.  

  ---

  #### **Step 2: Identify Symmetry in Unmodeled Long-Term Effects**
  **Question:**  
  *Beyond the near-term, what major positive/negative effects might occur? Are these effects likely symmetric (similar magnitude/direction) across the intervention and its counterfactual?*  
  **Sufficient Answer:**  
  - List 2–3 major long-term effects (e.g., economic spillovers, cultural shifts).  
  - Argue for symmetry using:  
    - *Counterfactual consistency* (e.g., "Effect X would occur regardless of intervention").  
    - *Empirical precedent* (e.g., "Similar interventions show no asymmetric long-term effects").  
  **Procedure:**  
  - If **all unmodeled effects are symmetric**, treat as **simple cluelessness**. Rank based on near-term effects.  
  - If **any asymmetric effect exists**, proceed to Step 3.  

  ---

  #### **Step 3: Assess Asymmetric Effect Interactions**
  **Question:**  
  *Do asymmetric effects pull in net-positive/net-negative directions? Can we bound their magnitudes?*  
  **Sufficient Answer:**  
  - Classify asymmetric effects as:  
    - **Net-positive** (e.g., "Institutional reform enables future cooperation").  
    - **Net-negative** (e.g., "Centralizing power risks authoritarian drift").  
    - **Ambiguous** (e.g., "Effect could be +/– based on context").  
  - Use sensitivity analysis to bound magnitudes (e.g., "Effect size between 0.1–10x near-term impact").  
  **Procedure:**  
  - If all asymmetric effects point **unambiguously in one direction** (e.g., all net-positive), rank accordingly.  
  - If effects **conflict** (e.g., large positives + large negatives) or **magnitudes are unbounded**, proceed to Step 4.  

  ---

  #### **Step 4: Escalate to Committee for Value Judgments**
  **Question:**  
  *Does the proposal’s impact depend on contested long-term values (e.g., risk tolerance, discount rates) or deep uncertainty?*  
  **Sufficient Answer:**  
  - Identify unresolved conflicts (e.g., "We must weigh tail-risk reduction against near-term costs").  
  - Acknowledge value-laden tradeoffs (e.g., "Prioritizing future generations vs. present suffering").  
  **Procedure:**  
  - **Hand to committee** if:  
    - Asymmetric effects require weighing incommensurable values.  
    - Uncertainty is radical (no robust empirical basis for bounding outcomes).  
  - **Return no ranking** if:  
    - Asymmetric effects are too speculative to model (e.g., "This could trigger a tech revolution or collapse").  

  ---

  ### **Application to Example Grants**

  #### **Grant 1: Global Health Intervention (Bed-Net Distribution)**  
  - **Step 1:** Near-term effects well-modeled: 100K malaria cases averted/year, $5M cost. Net-positive.  
  - **Step 2:** Unmodeled effects (e.g., economic growth from healthier population). Symmetric: Similar growth occurs if malaria declines naturally. **→ Simple cluelessness.**  
  - **Verdict:** Rank highly based on near-term impact.  

  #### **Grant 2: Policy Advocacy (Institutional Reform for Pandemic Preparedness)**  
  - **Step 1:** Near-term effects: 20% chance of policy change in 5 years. Costs clear, but benefits speculative. Proceed.  
  - **Step 2:** Unmodeled effects:  
    - *Positive*: Better pandemic response saves millions in 50 years.  
    - *Negative*: Reforms concentrate power, increasing risk of authoritarianism.  
    Asymmetric: Effects depend on policy design—no symmetry. **→ Complex cluelessness.**  
  - **Step 3:** Effects conflict:  
    - Net-positive if pandemics are existential threats.  
    - Net-negative if institutional failure risks dictatorship.  
    Magnitudes unbounded (tail risks dominate).  
  - **Step 4:** Tradeoffs hinge on values:  
    - How much to prioritize tail-risk reduction?  
    - Tolerance for centralized governance?  
  - **Verdict:** Hand to committee. No ranking possible—foundation’s values must decide.  

  ---

  ### **Key Outputs**  
  - **Rank Proposal**: Near-term effects dominate (simple cluelessness or unidirectional asymmetries).  
  - **No Ranking**: Unmodeled effects are unbounded or too speculative.  
  - **Hand to Committee**: Conflicting asymmetries requiring value judgments (e.g., long-termist tradeoffs).  

  This procedure forces rigor without overcomplication. It flags when cluelessness is unresolvable by evidence alone—ensuring philosophers don’t monopolize tough calls.
