answer: |-
  ## Joint Statement on Knowledge-How: Intellectualist & Anti-Intellectualist Collaboration

  **Preamble:** For decades, the debate between intellectualism (knowing-how is a form of propositional knowledge) and anti-intellectualism (knowing-how is a distinct, non-propositional capacity) has dominated discussions of skilled action and practical knowledge. While fundamental differences remain, we, representing both perspectives, commit to this statement outlining areas of agreement, precise points of contention, testable cruxes, and an assessment of potential verbal elements. Our goal is not compromise for its own sake, but clarity on the nature of disagreement.

  ### 1. Agreed Foundational Claims
  Both intellectualists and anti-intellectualists endorse the following substantive claims:

  1.  **The Phenomenon is Real:** There exists a genuine cognitive phenomenon – *skilled action* or *practical competence* – exhibited in cases like riding a bike, speaking a language fluently, or expertly performing a surgery, distinct from merely theoretical understanding.
  2.  **Propositional Knowledge is Insufficient:** Merely possessing relevant propositional knowledge (e.g., knowing *that* one must pedal to move forward on a bike) is neither necessary nor sufficient for possessing the corresponding skill or knowing-how (e.g., knowing *how* to ride a bike).
  3.  **Ryle's Regress Exposes a Challenge:** Ryle's regress argument successfully demonstrates that characterizing skilled, fluent performance as *constantly* guided by *conscious*, *deliberative* application of propositional knowledge leads to an infinite regress and mischaracterizes the phenomenology of expertise. It highlights the need for an account of *automaticity* and *direct responsiveness* in skill.
  4.  **Linguistic Data is Significant but Not Conclusive:** The grammatical behavior of "know how" constructions (e.g., embedding under question-forming operators, anaphora) provides important evidence that must be accounted for by any theory. However, this linguistic data alone does not definitively settle the metaphysical question of whether knowing-how reduces to knowing-that.
  5.  **Cases of Dissociation are Illuminating:** Empirical cases like amnesic performers (e.g., H.M. learning new motor skills) or unreflective experts (e.g., elite athletes performing under pressure) demonstrate a dissociation between explicit declarative memory/reportable propositional knowledge and the retention/exercise of skill. This dissociation necessitates an explanation that respects the relative independence of the skill system.
  6.  **Adequate Explanation Required:** Any successful account of knowing-how must explain:
      *   The *intelligent* yet often *automatic* and *unreflective* nature of skilled performance.
      *   The *normativity* of skill (what counts as doing it correctly/incorrectly).
      *   The *acquisition* and *refinement* of skills through practice.
      *   The *flexible adaptability* of skill to novel but relevant situations.
      *   The relationship between explicit instruction, declarative knowledge, and skilled performance.

  ### 2. Precise Points of Disagreement
  The following table outlines core disagreements, with positions stated in terms each side would accept:

  | Point of Disagreement                                                                 | Intellectualist Position (as Endorsed by Intellectualists)                                                                                   | Anti-Intellectualist Position (as Endorsed by Anti-Intellectualists)                                                                       |
  | :------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------- |
  | **Metaphysical Nature of Knowing-How:** What *kind* of state is knowing-how?          | Knowing how to φ is a species of knowing-that: it is knowing, under a practical mode of presentation, that some way *w* is a way for oneself to φ. | Knowing how to φ is a distinct, non-propositional kind of knowledge: it is a complex of reliable behavioral dispositions, capacities, or embodied procedural routines. |
  | **Cognitive Architecture of Skill Execution:** What cognitive structure enables fluent, automatic skilled performance? | Fluent execution is enabled by the *automatization* and *proceduralization* of action-guiding propositional knowledge structures, accessed via practical modes of presentation without requiring conscious conceptual deployment. | Fluent execution is enabled by *direct sensorimotor contingencies* and *procedural dispositions* that operate independently of propositional attitude states; accessing propositions would disrupt fluency. |
  | **Role of Propositional Attitudes in Skill Possession:** Must skill possession entail corresponding propositional knowledge *at all*? | Possessing the skill to φ *necessarily entails* possessing relevant action-guiding propositional knowledge (under a practical mode), even if not consciously accessed during execution. | Possessing the skill to φ *does not necessarily entail* possessing any corresponding propositional knowledge; skills can be fully embodied and procedural, grounded solely in dispositions. |
  | **Explanatory Primacy:** What provides the most fundamental explanation of skilled action? | The propositional knowledge (under practical modes) provides the fundamental *normative* and *representational* grounding for the skill; dispositions manifest this knowledge. | The embodied dispositions/procedural capacities provide the fundamental explanation for the *execution* and *intelligence* of the action; propositional reports are often secondary descriptions or byproducts. |
  | **Phenomenology of Expertise:** What is the primary cognitive character of expert action? | Expert action involves finely tuned, rapid, non-conscious *application* of highly specialized propositional knowledge representations via practical modes of presentation. | Expert action involves a shift to *absorbed coping* where propositional thought recedes and the agent directly responds to affordances through embodied know-how. |

  ### 3. Cruxes: Potential Resolvers of the Dispute
  The following are key sub-questions where empirical or conceptual progress could significantly shift the debate. For each, we outline a relevant case/argument and each side's prediction:

  1.  **Crux: Can Practical Modes of Presentation Avoid Regress?**
      *   **Case/Argument:** Analyze whether positing "practical modes of presentation" for the relevant propositional knowledge (*that w is a way to φ*) genuinely avoids Ryle's regress. Does knowing *how* to deploy/apprehend *this specific mode* itself require further propositional knowledge under another practical mode? Examine cognitive architectures implementing PMoPs (e.g., in robotics/AI).
      *   **Intellectualist Prediction:** PMoPs are primitive, non-conceptual, action-oriented representational formats. Knowing how to deploy them is *constitutive* of having the dispositional skill, not a further piece of propositional knowledge. Analysis will show regress stops here.
      *   **Anti-Intellectualist Prediction:** PMoPs either reintroduce the regress (if knowing how to use them requires further knowledge) or collapse into admitting a non-propositional element (the ability to use the mode) that is the true basis of skill. Analysis will show PMoPs fail to fully avoid the regress or are functionally equivalent to dispositions.

  2.  **Crux: Is Propositional Grounding Necessary for Genuine Dispositional Knowledge?**
      *   **Case/Argument:** Study highly trained skills acquired *solely* through implicit learning (e.g., complex sequence learning tasks where subjects gain robust performance capacity but show zero capacity to report the rules or structure, even under sophisticated probing). Does this constitute *genuine knowing-how* without any corresponding propositional knowledge?
      *   **Intellectualist Prediction:** Such capacities are mere "brute" dispositions or reflexes, lacking the normative dimension and flexible adaptability of true know-how. True know-how requires *some* level of action-guiding propositional structure, however implicit or inaccessible to verbal report. Tests will reveal subtle limits to flexibility/normativity without propositional grounding.
      *   **Anti-Intellectualist Prediction:** These *are* paradigmatic cases of know-how. The robust, flexible, adaptive performance demonstrates genuine practical intelligence and normativity grounded solely in the procedural system. Tests will show full competence without any need for propositional grounding.

  3.  **Crux: Do LLMs/AI Systems Possess Know-How?**
      *   **Case/Argument:** Analyze the capabilities of advanced LLMs or robotic systems that exhibit complex, flexible behavioral outputs interpretable as following instructions or solving practical tasks (e.g., generating code, planning routes, manipulating simulated objects based on text prompts). Do they possess "know-how"?
      *   **Intellectualist Prediction:** If the system's behavior is best explained by it leveraging internal representations encoding action-guiding information (e.g., world models, step-by-step plans represented symbolically or sub-symbolically but *functioning as* propositions under a PMoP within the system), then it possesses a form of know-how (reducible to knowing-that within its architecture).
      *   **Anti-Intellectualist Prediction:** Even if the output *simulates* know-how, systems lacking genuine embodiment, sensorimotor engagement, and intrinsic intentionality (merely manipulating statistically derived associations or symbols) cannot possess true know-how, which is intrinsically tied to an agent's embodied capacities and dispositions. Their competence remains purely derivative.

  ### 4. Assessment of Verbal Disagreement

  We agree that **part, but not all, of the dispute is potentially verbal.** The disagreement hinges significantly on how broadly or narrowly the term "knowledge" is applied.

  *   **Potential Verbal Element:** The anti-intellectualist may be using "knowledge" in a narrower sense, primarily for *propositional attitude* states (believing that p), while reserving "skill" or "capacity" for the non-propositional competence. The intellectualist uses "knowledge" more broadly, encompassing both propositional attitudes *and* the practical competence *if* it meets the condition of being grounded in a specific type of propositional attitude (under a PMoP). Thus, both could agree that there is a distinct *kind of competence* (skill, know-how-in-the-anti-intellectualist-sense), while disagreeing on whether this competence *is also* a species of knowledge *in a broader, technical sense* (know-how-in-the-intellectualist-sense).
  *   **Genuine Non-Verbal Disagreement:** However, this verbal possibility does *not* dissolve the core disagreement. There remains a **substantive, non-verbal disagreement about cognitive architecture and grounding**:
      *   The intellectualist insists that the competence *must be grounded in and constituted by* specific types of representational states (propositions under PMoPs) that carry normative and action-guiding content.
      *   The anti-intellectualist insists that the competence is *sui generis*, grounded in fundamentally different kinds of states (embodied dispositions, procedural routines) that do not derive their normative force or intelligence from propositional representations, even implicitly. They deny that PMoPs successfully bridge the gap without collapsing into anti-intellectualism or inviting regress.

  Therefore, while terminological choices influence the framing, the core debate concerns the fundamental nature of the cognitive states underlying skilled, intelligent action and whether propositional representational formats are ultimately essential to it. Settling the cruxes outlined above is necessary to resolve this substantive disagreement.

