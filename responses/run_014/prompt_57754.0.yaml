prompt: |-
  I chair the allocation committee of a regional program that distributes donated courses of an enzyme-replacement therapy for a rare metabolic disease. The manufacturer gives us a fixed number of courses each quarter — eight this quarter, against thirty-one applications — and each course must go whole to one patient; we cannot split a course between two people. The committee is five of us: two clinicians, a pharmacist, a patient advocate, and me. None of us has any training in ethics. We meet for two hours, decide the entire slate, and the board signs off on a written rationale for each course awarded. Applications arrive on a standard form that records the applicant's current severity, expected time to irreversible organ failure without treatment, expected time to that point with treatment, and the probability that this particular patient will respond at all. It records nothing else, and we are not permitted to gather anything further. Committee turnover is high, so whatever we adopt must be runnable by someone reading it cold, in about ten minutes per case.

  Our current written policy says, in effect, that we should award courses so as to produce the greatest number of successful treatments, because that is what our funder measures and reports on. I can no longer defend that, but I also cannot defend its obvious opposite. Two things have gone wrong this year. In the spring we awarded four courses to patients whose disease was stable but who had a high probability of responding, and turned down two who would have died within a year without treatment but had mediocre response probabilities; scored on the form, the four were the better bet, and nobody in the room thought the outcome was right. In the fall we had eight courses and nine applicants of essentially identical severity, and settled the ninth place by drawing lots. One board member objected in writing that randomizing between people in the same position tells the ninth family we did not care which of them lived; another objected that giving those nine an equal chance was itself unfair to a tenth applicant, less severe but the only one still helpable, whose course we had already spent on a coin toss. I do not know how to answer either objection, and I suspect they pull in opposite directions.

  Please write the decision procedure our committee should adopt for a quarterly slate. Ground it in what the debate over whether harms to different people can be added together — and what that implies for choosing between the many and the few — has actually established, if anything, including the arguments that a loss does not become greater for being spread across more people, that claims of unequal strength do not simply pool, and that a chance procedure can express equal concern rather than indifference. Tell me which of these positions the procedure builds in, since I will have to say so out loud when a family asks.

  The procedure should:

  1. Set out the questions to ask of a slate, in the order they must be asked, with what counts as a sufficient answer to each, where it stops with a refusal, and where it hands the decision to chance or to a person because the question is one of values rather than of the facts on the form.

  2. State, for a slate in which several applicants would suffer the same loss and there are not enough courses for all of them, whether equal chances are required or merely permitted; and whether chances should be weighted by severity, and if so how the weights are to be derived from a form that reports severity in months rather than on any common scale.

  3. Explain why the order of the questions matters. Show what changes if we ask about severity first and then about numbers, versus the reverse, and whether any ordering makes our slate-to-slate verdicts consistent or whether the procedure is exposed to cycling however we arrange it. If it is exposed, say what a committee should do about that rather than pretend it away.

  4. Say whether an applicant turned down in an earlier quarter has any claim arising from that earlier loss, and if so how the procedure registers it without degenerating into a queue ordered by past disappointment.

  5. Run it on three slates: (a) eight courses, nine applicants of identical severity; (b) eight courses, four applicants who would each die within eighteen months without treatment and eleven who would each lose hearing permanently, response probabilities roughly equal; (c) the spring slate as described. For each, give the awards, the refusals, and the sentence we would write to the board. Then say whether any of the three verdicts would change if our pharmacist is right that one formulation could be divided so that a course serves two patients at half dose each, and why divisibility should or should not make a difference.

  6. For at least one of these, give me the verdict the committee will hate, and state what the procedure has to sacrifice to avoid it.

  7. Tell me how to write the short rationale accompanying each award so that it does not read as indifference to the people we refuse, and specifically how to answer the board member's objection to lotteries — without either abandoning randomization where the procedure calls for it or claiming the objection has been met when it has not.

  8. Mark plainly every step that is a judgment call wearing the clothes of a procedure, and every kind of case the procedure cannot settle at all.

  I would rather have a procedure honest about what it gives up than one that looks decisive on paper and collapses in the room.
reasoning: |-
  Hmm, this is an incredibly complex and ethically fraught allocation problem. The user chairs a committee distributing scarce life-saving treatments with no ethical training, and their current utilitarian approach has led to morally troubling outcomes. They need a transparent, defensible decision framework that addresses several philosophical dilemmas.

  Key tensions I need to resolve:
  - Aggregation debate: Can we justify saving more lives by sacrificing those with worse prognoses? The spring case shows why pure maximization feels wrong
  - Randomization ethics: Is lottery indifference or fairness? The board member objections reveal opposing interpretations
  - Severity comparability: How to weigh death against permanent disability when forms only report time metrics
  - Intertemporal justice: Should past rejections create stronger claims now?

  The user's operational constraints are brutal: 10-minute case assessments by rotating committees, fixed data points, no ethical expertise. Any solution must be executable under these conditions.

  I recall Walzer's "spheres of justice" - different goods demand different allocation principles. Here the good is both life-saving and disability-preventing, which complicates tiering. Also relevant: Daniels' accountability for reasonableness, Brock's multi-principle frameworks for scarce resources.

  For the aggregation problem, I'm considering:
  1. First-tier absolute urgency: Prevent immediate deaths
  2. Second-tier preventable burden: Address severe irreversible outcomes
  3. Third-tier efficiency: Where ties remain, maximize successful treatments
  This avoids directly comparing death vs disability while acknowledging both are harms

  For randomization - it must be framed as active fairness, not passive indifference. The written rationale should explicitly contrast it with arbitrary selection.

  The divisibility question is fascinating. If half-doses are effective (which seems doubtful per medical reality), it would collapse the entire aggregation dilemma! But the user says courses are indivisible, so I'll note this as hypothetical.

  Biggest challenge: Preventing gaming of the severity tiers. The procedure must define "irreversible organ failure" strictly as mortality risk to avoid severity inflation.

  I'll structure the output as:
  - Core principles
  - Step-by-step algorithm
  - Application to 3 cases
  - Rationale templates
  - Limitations disclosure

  The "verdict committees will hate" will likely be sacrificing potentially salvageable patients in the death-vs-deafness scenario to save those facing death. But avoiding this would require unacceptable aggregation.
answer: |-
  Below is a decision procedure grounded in ethical theory and practical constraints. It prioritizes **preventing the worst individual harms** over aggregating benefits, recognizes **incommensurable claims**, and uses randomization as **expressive equality**—not indifference. It draws from debates on aggregation (e.g., John Taurek, T.M. Scanlon) and the ethics of scarcity (e.g., Norman Daniels).

  ---

  ### **Decision Procedure**  
  **Core Principles**  
  1. **Non-Aggregation**: Harms to individuals cannot be summed. Saving one person from death is not outweighed by saving many from lesser harms.  
  2. **Urgency First**: Prioritize those facing the worst *and most immediate* irreversible losses.  
  3. **Equal Concern**: When claims are equally strong, random selection affirms equal moral worth.  
  4. **No Compound Claims**: Past rejections do not amplify current claims (to avoid penalizing new applicants).  

  **Procedure Steps**  
  *Ask these questions in order. Stop and assign courses if a step resolves the slate.*  

  1. **Severity Threshold**  
     - *Question*: Are any applicants facing **irreversible organ failure (death)** within 18 months without treatment?  
     - *Decision*:  
       - **Yes**: Allocate courses to *all* such applicants. If courses remain, proceed to Step 2. If oversubscribed, proceed to Step 3.  
       - **No**: Proceed to Step 2.  
     - *Rationale*: Death is a uniquely irreversible harm; claims to avoid it are non-aggregable and lexically prior.  

  2. **Preventable Burden**  
     - *Question*: Are any applicants facing **non-fatal but irreversible losses** (e.g., blindness, paralysis) within 18 months without treatment?  
     - *Decision*:  
       - **Yes**: Allocate courses to *all* such applicants. If courses remain, proceed to Step 4. If oversubscribed, proceed to Step 3.  
       - **No**: Proceed to Step 4.  
     - *Rationale*: Severe disability creates a strong claim, but weaker than death. Still non-aggregable.  

  3. **Equal Claims Randomization**  
     - *Scenario*: Oversubscription at Step 1 or 2 (e.g., 5 death-urgent applicants, 3 courses).  
     - *Question*: Are all applicants in this group **equally urgent**? (Same "expected time to irreversible loss" ±3 months and same loss type).  
     - *Decision*:  
       - **Yes**: Randomly select recipients (e.g., lottery).  
       - **No**: Prioritize the **most urgent** (shortest "time to loss"). If ties, randomize.  
     - *Rationale*: Randomization expresses equal concern when claims are identical. Weighting by severity is unnecessary if harms are equivalent.  

  4. **Efficiency**  
     - *Scenario*: Courses remain after Steps 1–2, or no urgency claims exist.  
     - *Question*: Which applicants have ≥50% response probability?  
     - *Decision*: Allocate to maximize **number of successful treatments** from this pool. If ties, randomize.  
     - *Rationale*: When no catastrophic harms are imminent, efficiency respects the donor’s mandate.  

  ---

  ### **Key Specifications**  
  - **Randomization**: *Required* for identical claims (Step 3). Permitted for ties elsewhere. Never weight by severity—identical loss types (e.g., death) are treated equally. Time metrics (±3mo) determine parity.  
  - **Order Matters**:  
    - *Severity first*: Prevents sacrificing someone facing death to save many from lesser harms.  
    - *Reverse order (efficiency first)*: Would permit trading one life for multiple non-fatal cases—violating non-aggregation.  
    - *Consistency*: No cycling. Order is fixed to prioritize worst-off first.  
  - **Past Applications**: No weight. Registering past losses would disadvantage new applicants with equal or stronger claims.  

  ---

  ### **Case Applications**  
  ***(a) 8 courses, 9 identical applicants***  
  - *Procedure*: Step 3 (all face identical loss). Randomize. 8 awarded, 1 refused.  
  - *Rationale to Board*: "All applicants faced identical severity. Random selection ensured equal concern for each life."  

  ***(b) 8 courses: 4 facing death (18mo), 11 facing deafness (permanent)***  
  - *Procedure*: Step 1 allocates to all 4 death-urgent. 4 courses remain. Step 2 allocates to all 11 deafness-urgent → oversubscribed. Step 3: Randomize 4/11.  
  - *Verdict*: 4 death-urgent + 4 deafness-urgent (randomly chosen) awarded. 7 deafness-urgent refused.  
  - *Rationale*: "Prevented all imminent deaths. For irreversible deafness, randomization affirmed equal worth among identical claims."  
  - ***Committee’s hated verdict***: Refusing deafness patients to save death-urgent ones. *Sacrifice*: Efficiency (could have helped more people overall).  

  ***(c) Spring slate: 4 stable/high-response vs. 2 death-urgent/mediocre-response***  
  - *Procedure*: Step 1 allocates to both death-urgent. 6 courses remain. Step 4: Allocate to 6 highest-response applicants (including the 4 stable).  
  - *Verdict*: 2 death-urgent + 4 stable/high-response awarded. 0 refused (since 6 courses for 6 applicants).  
  - *Rationale*: "Prioritized preventing imminent death. Remaining courses maximized successful treatments per donor requirements."  

  ***Divisible Courses***: If a course can be split (half-dose effective):  
  - *Difference*: In (b), split courses to cover all 15 applicants. No randomization needed.  
  - *Why it matters*: Divisibility avoids aggregation dilemmas by meeting all urgent claims. *But*: Only if efficacy is proven; else, unjustified risk.  

  ---

  ### **Rationale Guidance**  
  - **For Awards**: "This award recognizes the immediacy and severity of your loved one’s risk. We affirm every applicant’s equal worth, and our process prioritizes preventing irreversible harm."  
  - **For Randomization**: "Random selection embodies our equal commitment to all lives facing identical threats. It rejects arbitrary criteria, ensuring no life is undervalued."  
  - **Answering the Board**: "A lottery is not indifference—it is active fairness when all claims are equal. Denying it would mean choosing who lives based on luckless privilege, not justice."  

  ---

  ### **Limitations & Judgment Calls**  
  1. **Judgment Calls**:  
     - Defining "irreversible organ failure" (Step 1). *Clarify*: Use medical criteria (e.g., heart/liver failure).  
     - Setting 18-month threshold. *Adjust annually* with clinical input.  
     - "Identical" severity (±3mo). *Arbitrary but necessary* for tractability.  
  2. **Unresolvable Cases**:  
     - Mixed-urgency ties (e.g., death vs. quadriplegia). *Procedure assumes death is prior*; if contested, no mechanical solution.  
     - Non-identical but close severities (e.g., 12mo vs. 18mo death). *Step 3 prioritizes shorter time*.  
  3. **What It Gives Up**:  
     - Maximizing total benefit (sacrificed to protect worst-off).  
     - Helping moderate-severity cases when urgent claims exhaust supply.  

  ---

  ### **Final Summary**  
  This procedure:  
  - **Rejects aggregation** by prioritizing worst individual harms.  
  - **Uses randomization** as moral affirmation, not indifference.  
  - **Explains refusals** as scarcity, not worth.  
  - **Owns its limits**—especially in defining severity thresholds.  

  Adopt this verbatim, train committees using the cases, and annually review severity definitions. When families ask: "We prevent the gravest harms first, treat equal claims equally, and never value one life over another."
