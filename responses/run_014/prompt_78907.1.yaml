answer: |-
  ### **Dutch Book Game: Rules and Setup**  
  **Goal:** Demonstrate that inconsistent probability assignments (prices) lead to guaranteed losses via a Dutch book. Participants assign prices to "tickets" (bets) on a marble draw. The house constructs a portfolio of bets ensuring a sure loss for inconsistent players, while consistent players remain "un-bookable."

  **Materials:**
  - A bag with 5 marbles (3 red, 2 blue; counts hidden until the end).
  - Tokens (poker chips or paper) for each player (start with 100 each).
  - Worksheets for players to write prices.
  - A calculator for the house.
  - A prize (e.g., a nice bottle) for the player with the most tokens at the end.

  **Tickets (Bets):**  
  Each ticket pays 100 tokens if the event occurs, 0 otherwise. Players set a price for each (between 0–100), meaning they’ll **buy** the ticket at that price or **sell** it at that price.  
  - **Ticket I (Impossible):** "Marble is both red AND blue." (Should be priced at 0.)  
  - **Ticket A (Sure):** "Marble is red OR blue." (Should be priced at 100.)  
  - **Ticket R (Red):** "Marble is red."  
  - **Ticket B (Blue):** "Marble is blue." (Equivalent to "not red.")  

  **Game Flow (90 Minutes Total):**  
  1. **Intro (10 min):**  
     - Explain the setup: One marble drawn at the end. Tickets pay based on outcomes.  
     - Emphasize: Prices reflect "the most you’d pay to buy OR accept to sell."  
     - Players start with 100 tokens. Winner gets the bottle.  

  2. **Pricing Round (15 min):**  
     - Players write prices for **I, A, R, B** on worksheets.  
     - Collect sheets.  

  3. **House Bet Construction (15 min):**  
     - The house (you or a volunteer) calculates a guaranteed loss for each player with inconsistent prices.  
     - Use the **House Rules Table** below. No world knowledge needed—only the player’s numbers.  
     - For each player, compute their loss and deduct tokens. **Safe players** (consistent) lose 0 tokens.  

  4. **Marble Draw & Token Adjustment (5 min):**  
     - Draw a marble publicly.  
     - Adjust tokens based on house calculations (no additional payout—losses are already settled).  

  5. **Winner Announcement (5 min):**  
     - Award the bottle to the player with the most tokens.  

  6. **Debrief (40 min):**  
     - Discuss key moments, implications, and objections (see below).  

  ---

  ### **House Rules Table: How to Calculate Losses**  
  The house follows this recipe for each player. **No improvisation—pure arithmetic.**  
  | Condition                     | Action (Transactions)                                  | Loss Formula                          | Why It Guarantees Loss                                                                                                                                 |
  |-------------------------------|--------------------------------------------------------|---------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **P(I) > 0**                 | Sell I to player for P(I)                              | `Loss_I = P(I)`                       | Player pays P(I) for a worthless ticket (I never happens).                                                                                            |
  | **P(A) < 100**               | Buy A from player for P(A)                             | `Loss_A = 100 - P(A)`                 | Player gets P(A) but must pay 100 later (A always happens). Net loss: 100 - P(A).                                                                     |
  | **P(A) > 100**               | Sell A to player for P(A)                              | `Loss_A = P(A) - 100`                 | Player pays P(A) but only gets 100 back. Net loss: P(A) - 100.                                                                                         |
  | **P(R) + P(B) < 100**        | Buy R and B from player for P(R) and P(B)              | `Loss_Add = 100 - (P(R) + P(B))`      | Player gets P(R)+P(B) but pays 100 later (either R or B happens). Net loss: 100 - (P(R)+P(B)).                                                        |
  | **P(R) + P(B) > 100**        | Sell R and B to player for P(R) and P(B)               | `Loss_Add = (P(R) + P(B)) - 100`      | Player pays P(R)+P(B) but only gets 100 back (since R and B can’t both win). Net loss: (P(R)+P(B)) - 100.                                             |
    
  **Total Loss:**  
  `Total Loss = Loss_I + Loss_A + Loss_Add`  
  - **Deduct** `Total Loss` from the player’s token balance.  
  - **Safe Players (Heroes of the Debrief):**  
    - If `P(I)=0`, `P(A)=100`, and `P(R) + P(B)=100`, **no loss occurs**.  
    - Quickly check: Scan worksheets for these three conditions.  

  **Example:**  
  - Alice’s prices: `P(I)=0`, `P(A)=100`, `P(R)=40`, `P(B)=60` → **Safe** (no loss).  
  - Bob’s prices: `P(I)=10`, `P(A)=90`, `P(R)=40`, `P(B)=40` →  
    - `Loss_I = 10`  
    - `Loss_A = 100 - 90 = 10`  
    - `Loss_Add = 100 - (40+40) = 20`  
    - **Total Loss = 40 tokens.**  

  ---

  ### **Debrief Guide: Key Points and Objections**  
  **Map the Game to the Concept:**  
  1. **Incoherent Probabilities (Rain/No-Rain):**  
     - If a player sets `P(R)=30` and `P(B)=30`, then `P(R)+P(B)=60 < 100` → Loss of 40 tokens.  
     - **Lesson:** Probabilities of mutually exclusive, exhaustive events must sum to 1 (here, 100).  

  2. **Non-Additivity (P and Q Problem):**  
     - If a player sets `P(R)=60`, `P(B)=60`, `P(A)=100`, then `P(R)+P(B)=120 > 100` → Loss of 20 tokens.  
     - **Lesson:** The price for "R or B" (A) must equal the sum of prices for R and B.  

  3. **House Needs No World Knowledge:**  
     - The bag’s contents were unknown. Losses came **only from inconsistent numbers**, not the marble draw.  

  4. **What It Proves:**  
     - If your prices violate probability rules, you’re vulnerable to a Dutch book.  
     - **Consistent players (heroes)** avoid this by aligning prices with probability axioms:  
       - Impossible event: 0.  
       - Sure event: 1 (100).  
       - Additivity for disjoint events.  

  **Honest Limitations & Objections:**  
  - **"So what? I lost tokens, not real money."**  
    - The game **simulates financial vulnerability**. If this were money, you’d **never** accept bets guaranteeing a loss.  

  - **"My 30% isn’t a betting price—I’d never sell at that number!"**  
    - **Ah, the core tension!** If your "probability" doesn’t reflect a willingness to bet both ways, it’s not actionable. The Dutch book **exposes this gap**. If you can’t stand by your number as a price, what does it mean?  

  - **"The house cheated by seeing my numbers!"**  
    - The house isn’t "gambling"—it’s a mechanical arbitrator. It doesn’t profit; it only enforces **your own logic**.  

  - **What the Game *Doesn’t* Show:**  
    - It assumes you’ll accept **any number** of bets at your prices. Realistically, you might avoid repeated bets.  
    - It doesn’t force a **unique** probability—only that yours must be internally consistent.  
    - **Infinite bets are a con?** Yes—real Dutch books use finite bets. The infinite version is a technicality.  

  **Predictable Issues & Fixes:**  
  1. **"I’ll set 50 on everything to play safe."**  
     - `P(I)=50` → Loss. `P(A)=50` → Loss. `P(R)+P(B)=100` → Safe. **Net loss: 50 + 50 = 100 tokens.** They lose everything.  

  2. **Refusal to play:**  
     - Let them sit out. Debrief: "If you won’t assign prices, you avoid the Dutch book—but also avoid clarifying your beliefs."  

  3. **Arguments about fairness:**  
     - Reiterate: The house is a neutral "robot" applying a recipe. It gains nothing from your loss.  

  4. **Future Opinion Round (Optional):**  
     - **Ticket F:** "After seeing the marble (but before reveal), your updated price for R is ≥70."  
     - **Exploit:** If `P(R) ≠ P(F)`, the house buys/sells R and F to guarantee loss `|P(R) - P(F)|`.  
     - **Lesson:** Beliefs should update rationally—your future self shouldn’t disagree with your current self when given new info.  

  ---

  **Why This Works:**  
  - **Skin in the game:** Tokens + prize create engagement.  
  - **The "Aha!" moment:** Players see their **own numbers** causing their loss.  
  - **Safe players** validate the system—they’re the heroes.  
  - **Debrief** tackles objections head-on, turning "so what?" into insight.  

  **First-Time Tips:**  
  - Rehearse the house calculations.  
  - Warn players: "Your prices are binding—choose wisely!"  
  - In debrief, highlight a safe player: "Why did your numbers work?"  

  This game transforms abstract probability into visceral experience. You’ll spark heated debate—and that’s the point!
