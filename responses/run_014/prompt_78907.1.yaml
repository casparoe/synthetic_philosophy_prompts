               if 'I' is sold: loss += P(I)   [because they paid for a worthless ticket]
               if 'A' is bought (by the house, meaning participant sold): loss += (100 - P(A))   [because they received P(A) and must pay 100]
               if 'A' is sold ( to the participant): loss += (P(A) - 100)   [because they paid P(A) and get 100 back]
               if R and notR are both bought (by the house): loss += (100 - (P(R)+P(notR)))   [because they received P(R)+P(notR) and must pay 100]
               if R and notR are both sold ( to the participant): loss += ((P(R)+P(notR)) - 100)   [because they paid P(R)+P(notR) and get 100 back]

            This loss is the amount their token balance will decrease by, guaranteed, after the outcome.

            Then, we can settle the outcome: but note, the transactions above might leave them holding some tickets. For example, if we sold them I, then they hold I and it will be resolved to 0. But we already accounted for the loss in the exploit.

            To avoid double-counting, and to save time, we can skip resolving any tickets and just deduct the sure loss amount from their token balance.

            Because the sure loss is guaranteed, we can simply reduce their balance by the loss amount calculated above.

            Therefore, after the transactions, the house can announce: "Because of the transactions, you have incurred a sure loss of L tokens." and then adjust their balance.

            This is much faster than simulating the outcome.

            So for each participant, the house does:

               loss = 0
               if P(I) > 0:
                   loss += P(I)
                   # and we imagine: they now hold I, which will be worthless, but they paid for it -> loss.
               if P(A) < 100:
                   loss += (100 - P(A))
               if P(A) > 100:
                   loss += (P(A) - 100)
               if P(R)+P(notR) < 100:
                   loss += (100 - (P(R)+P(notR)))
               if P(R)+P(notR) > 100:
                   loss += ((P(R)+P(notR)) - 100)

            Then subtract 'loss' from their token balance.

            This is the total sure loss from the set of transactions.

            And it does not require the outcome.

            This is perfect.

            How to quickly check who is safe? 

               Safe if:
                   P(I) == 0
                   P(A) == 100
                   P(R)+P(notR) == 100

            So the house can quickly scan for these.

     4. After the house has done the transactions and adjusted the token balances, we draw the marble and resolve any tickets that are still held? 

          In the above, we have not resolved any tickets that might have been left. For example, if a participant was not exploited for a particular ticket, they might have set a price and might be holding that ticket from before? 

          But note: we only did the exploit transactions. We didn't issue any tickets for which the participant didn't have a transaction. 

          The only tickets in the game are the ones in the exploit transactions. 

          So if a participant is safe, they have no transactions and no tickets. 

          If they are exploited, they might hold some tickets, but we have already accounted for the loss. 

          To be thorough, however, we should also allow them to resolve the tickets they hold. But that would change the token balance. 

          But we've already computed the sure loss. Resolving the tickets would be part of the sure loss simulation. 

          Given we've already deducted the loss, we can skip resolving. 

          Alternatively, to be transparent, we could resolve, but it would not change the net outcome (because the loss is sure). 

          Given the time, we skip and just do the token adjustment.

     5. Then we announce the winner (highest token balance) and award the prize.

     Then we do the debrief.

     Debrief (30 minutes):

          - Start by asking for reactions.
          - Then explain the Dutch book.
          - Highlight the moments that showed the inconsistencies:

               - If someone had P(I)>0, they lost tokens for no reason.
               - If someone had P(A)!=100, they lost tokens.
               - If someone had P(R)+P(notR)!=100, they lost tokens.

          - And then the safe participants: they had P(I)=0, P(A)=100, and P(R)+P(notR)=100.

          - Explain that these conditions are the rules of probability: 
               - Probability of the impossible event is 0.
               - Probability of the sure event is 1 (here 100% scaled to 100).
               - For mutually exclusive and exhaustive events, the probabilities add to 1.

          - The house only used their numbers and did not know the marble distribution.

          - What it proves: if your prices are not like probabilities (satisfying these rules), then you can be made to lose tokens for sure.

          - Objections:
               - "So what, I lost some tokens." 
                   - But in real life, if these were financial bets, you would lose money for sure. And you would avoid that.
               - "I'm not a betting machine, my 30% isn't a price."
                   - The exercise assumes that your willingness to buy and sell at that price reflects your belief. If you are not willing to bet at that price, then the number isn't meaningful in this way.

          - What the game doesn't show:
               - It assumes you are willing to accept any finite number of bets at your prices. In reality, you might only want to make one bet.
               - It doesn't force you to have a unique probability if you are not Dutch-bookable. There are other probability assignments that are also consistent.

          - Predictable issues:
               - Someone might set 50 for everything. 
                   - Check: 
                       P(I)=50 -> violates condition 1, loss=50.
                       P(A)=50 -> condition 2: 50<100, loss=50.
                       P(R)+P(notR)=50+50=100, so condition 3 is satisfied.
                   - Total loss: 50+50 = 100. They started with 100, so they have 0.
               - Someone might set P(R)=60, P(notR)=60, P(A)=100, P(I)=0.
                   - Condition 3: 60+60=120>100, so loss = 20.
               - Safe: P(I)=0, P(A)=100, and P(R)+P(notR)=100.

          - Someone might refuse to play: then they don't participate.

          - Fairness of the house seeing the numbers: it's not a game of skill, it's a demonstration. The house is not trying to win tokens, but to make a point. The house doesn't gain from the tokens.

     Let's hope for the best.

     Given the time, we might only have time for one round.

     If we have time, we can try a second round with the future opinion, but it's optional.

     Let's provide the worksheets for the house: a table with columns for participant name, P(I), P(A), P(R), P(notR), then the conditions and the loss.

     Example worksheet for the house:

     Participant | P(I) | P(A) | P(R) | P(notR) | loss_I | loss_A | loss_add | Total loss
     --------------------------------------------------------------------------------------
     Alice       | 0    | 100  | 40   | 60      | 0      | 0      | 0        | 0
     Bob         | 10   | 90   | 40   | 40      | 10     | 10     | 20       | 40

     How to compute:
        loss_I = P(I) if P(I)>0, else 0.
        loss_A = 
            if P(A)<100: 100 - P(A)
            if P(A)>100: P(A)-100
            else: 0
        loss_add = 
            if P(R)+P(notR) < 100: 100 - (P(R)+P(notR))
            if P(R)+P(notR) > 100: (P(R)+P(notR)) - 100
            else: 0

     Total loss = loss_I + loss_A + loss_add

     Then subtract from 100.

     This is the new token balance.

     We do this for each participant.

     We can do it quickly.

     Now, to save even more time, we can do it in a spreadsheet on a laptop.

     But if you want to do it by hand, it's a few minutes.

