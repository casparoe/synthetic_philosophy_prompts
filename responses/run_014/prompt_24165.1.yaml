answer: |-
  ### Concrete Scenario: Bank Loan Decisions  
  **Context:** A bank uses an ML model to predict loan default risk for two demographic groups, Group A and Group B. The **base rates** (true default rates) genuinely differ:  
  - **Group A:** 10% default rate (e.g., 100 defaulters in 1,000 applicants).  
  - **Group B:** 20% default rate (e.g., 200 defaulters in 1,000 applicants).  

  The classifier has **identical performance** for both groups (same ROC curve):  
  - **True Positive Rate (TPR):** 80% (correctly flags defaulters).  
  - **False Positive Rate (FPR):** 10% (incorrectly flags non-defaulters).  

  We evaluate two fairness criteria:  
  1. **Demographic Parity (DP):** Equal loan approval rates across groups.  
  2. **Equalized Odds (EO):** Equal TPR and FPR across groups.  

  ---

  ### The Tradeoff Arithmetic  
  **Step 1: Fixed Threshold (Satisfies Equalized Odds)**  
  Using the same risk threshold for both groups:  
  - **Group A (10% default):**  
    - True Positives (TP): `80% of 100 defaulters = 80`  
    - False Positives (FP): `10% of 900 non-defaulters = 90`  
    - **Denials (TP + FP):** `80 + 90 = 170` → **Approval rate: 83%**  
  - **Group B (20% default):**  
    - TP: `80% of 200 defaulters = 160`  
    - FP: `10% of 800 non-defaulters = 80`  
    - **Denials (TP + FP):** `160 + 80 = 240` → **Approval rate: 76%**  

  **Result:** EO holds (same TPR/FPR), but DP fails (83% vs. 76% approval).  

  **Step 2: Adjusted Thresholds (Satisfies Demographic Parity)**  
  Force equal approval rates (e.g., 80% approval → 200 denials/group):  
  - **Group A (10% default):** Needs `200 denials`.  
    - Solve: `TP_A + FP_A = 200`, where `TP_A = TPR_A × 100`, `FP_A = FPR_A × 900`.  
  - **Group B (20% default):** Needs `200 denials`.  
    - Solve: `TP_B + FP_B = 200`, where `TP_B = TPR_B × 200`, `FP_B = FPR_B × 800`.  

  To achieve EO (**TPR_A = TPR_B** and **FPR_A = FPR_B**):  
  - Equations:  
    ```  
    TPR_A × 100 + FPR_A × 900 = 200  ...(1)  
    TPR_A × 200 + FPR_A × 800 = 200  ...(2) (since TPR_B = TPR_A, FPR_B = FPR_A)  
    ```  
  - Subtract (1) from (2):  
    `(200TPR_A + 800FPR_A) - (100TPR_A + 900FPR_A) = 0`  
    → `100TPR_A - 100FPR_A = 0` → `TPR_A = FPR_A`.  
  - Substitute into (1):  
    `TPR_A × 100 + TPR_A × 900 = 200` → `1000TPR_A = 200` → **`TPR_A = 0.2`**, **`FPR_A = 0.2`**.  

  **Result:** DP holds (80% approval for both), but EO fails. The classifier now performs at **TPR=20%** and **FPR=20%** for both groups—worse than random guessing!  

  ---

  ### Why the Base Rate Gap Is Key  
  - **Load-bearing factor:** The base rate difference (10% vs. 20%) forces a tradeoff. EO requires consistent model performance, but DP requires equal outcomes. When base rates differ, these goals conflict.  
  - **If base rates were equal (e.g., both 10%):**  
    - Fixed threshold gives identical approval rates (83% for both) → **EO and DP both satisfied**.  
    - The tradeoff collapses.  

  ---

  ### Normative Clash: Values in Conflict  
  - **Pro-Demographic Parity Advocate:**  
    *"Approval rates must be equal to correct historical bias. Group B’s higher default rate stems from systemic barriers (e.g., redlining). Denying loans at higher rates perpetuates inequality—even if the model is 'accurate.' Fairness requires equal opportunity, not equal model metrics."*  
  - **Pro-Equalized Odds Advocate:**  
    *"The model must be equally reliable for all groups. Forcing equal approvals either:  
    (a) Hurts Group A by approving riskier borrowers (if Group B’s threshold is loosened), or  
    (b) Hurts Group B by denying creditworthy applicants (if Group A’s threshold is tightened). Fairness means no group bears more classification errors."*  

  ---

  ### Escape Hatches? Costs of Each Approach  
  1. **Randomized Thresholds:**  
     - *How:* Randomly approve/deny applicants near the threshold to meet DP.  
     - *Cost:* Undermines efficiency—creditworthy applicants are denied (Group A), or risky applicants are approved (Group B).  
     - *Fairness:* DP achieved; EO still violated.  

  2. **Drop One Criterion:**  
     - *Choose DP:* Sacrifices model accuracy for Group B (higher FPR) → more false denials.  
     - *Choose EO:* Sacrifices equitable outcomes → Group B faces lower approval rates.  

  3. **Retarget the Prediction:**  
     - *How:* Predict a new outcome (e.g., "ability to repay under fair conditions") to reduce base rate gaps.  
     - *Cost:* Requires redefining business goals and retraining models. May not resolve fundamental disparities.  

  4. **Reject Fairness Criteria Altogether:**  
     - *How:* Optimize for profit using cost-sensitive thresholds.  
     - *Cost:* Group B faces even lower approval rates (due to higher base risk), exacerbating inequality.  

  **No Free Lunch:** The base rate gap makes this tradeoff unavoidable. Choosing an approach hinges on **values**—correcting past injustice (DP) vs. ensuring equal model reliability (EO)—not technical fixes.
