  - **Precedent 1:** Physical killing of a substantial part (even if only in one region) is genocide. This aligns with the Convention's Article II(a): killing members of the group.

  - **Precedent 2:** Killing based on class and political loyalty (not protected group) is not genocide. The Convention requires the intent to destroy, in whole or in part, a national, ethnical, racial or religious group. Here, the victims were not targeted as such a group.

  - **Precedent 3:** Genocide was found without a killing campaign. The acts were: 
    - Forcibly transferring children (Article II(e)) 
