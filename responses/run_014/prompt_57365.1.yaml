  **Precedent 2:**
  - Situation: Regime killed hundreds of thousands, but victims picked by class and political loyalty, not ethnicity/religion.
  - Call: Not genocide (crimes against humanity).

  **Precedent 3:**
  - Situation: State removed minority children en masse to residential institutions in majority region, banned language in schools and public, demolished places of worship. Most adult deaths from neglect/starvation during removals, not a killing campaign.
