  - **Precedent 4:** Genocide by measures intended to prevent births (sterilization) and causing serious bodily or mental harm (mass rape) (Article II(b) and (c)).

  - **Precedent 5:** Not genocide. Destruction of cultural heritage and expulsion, but the group reconstituted elsewhere. So, the group was not destroyed (as a group) because they were able to reconstitute.

  From these, we can see that the NGO has recognized genocide in cases where:
  - There is physical destruction (killing) of a substantial part (Precedent 1).
  - There is destruction of the group by means other than killing, specifically by preventing births (Precedent 4) and by transferring children (Precedent 3) when combined with other measures that dismantle the group.

  But note Precedent 5: destruction of cultural heritage and expulsion was not genocide because the group reconstituted. This suggests that for the NGO, the group must be destroyed as a group, and if the group can reconstitute, then it is not destroyed.

  Therefore, two candidate rules emerge:

  **Candidate Rule 1 (Narrow Physical/Biological):** Genocide requires acts aimed at the physical or biological destruction of the group. This includes killing, causing serious bodily or mental harm, preventing births, or forcibly transferring children (but only if the transfer is intended to permanently separate the children from the group and prevent the group from continuing). The group must be destroyed in whole or in part as a physical or biological entity.

