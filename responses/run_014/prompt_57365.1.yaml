  **Precedent 4:**
  - Situation: Campaign of mass rape and enforced sterilization to stop a group having children, alongside displacement.
  - Call: Genocide.

  **Precedent 5:**
  - Situation: Occupying power destroyed a religious minority's shrines, manuscripts, cemeteries, and outlawed liturgy, but expelled members rather than killing. The community reconstituted across the border within a couple of years.
  - Call: Not genocide.

  **New Case:**
  - Situation: State facing separatist insurgency by linguistic minority has moved about 40% of the minority's school-age children to boarding institutions in majority regions where their language is forbidden, criminalized public use of the language, renamed every village and stream. Adults stay and worship freely. No birth-prevention measures. Combat deaths low (hundreds, mostly adult men), no evidence of plan to kill. Children sent home at 16, but return unable to speak the language, and adults are too surveilled to teach openly.

