prompt: |-
  I'm a second-year philosophy graduate student, and I've been stuck for a week on the difference between epistemic contextualism and pragmatic encroachment. The problem is that in real life the two putative sources of variation — the conversational context in which I'm making a knowledge attribution, and my own practical stakes in the matter — tend to change together, so I can't tell which one is actually doing the work. For instance, when I was deciding whether to trust a structural engineer's assurance that a building was safe, my sense of "knowing" shifted as I moved from casually considering the apartment to having signed a lease and paid a deposit, but I can't tell whether that shift was because the conversational standards changed (I was now making the attribution in a high-stakes, decision-relevant context) or because my practical stakes changed (I now had real money on the line) — or both.

  I'm trying to figure out which of the two theories is the better account of that kind of shift, and more generally what each one says is doing the work. Could you compare epistemic contextualism and pragmatic encroachment for me, focusing on (1) where each locates the context-sensitivity — in the attributor's conversational context or in the subject's practical situation — (2) what each predicts should happen in the two clean cases: one where my evidence and stakes are held fixed but the attributor's conversational context changes, and one where the attributor's context is held fixed but my stakes rise, and (3) whether pragmatic encroachment is a genuine rival to contextualism or just a special case of it? I'd also like the strongest objection to each, and a sense of where they genuinely diverge rather than where they merely sound different, because I'm deciding which one to defend in my term paper and I don't want to build my argument on a distinction that collapses under scrutiny.
reasoning: |-
  Okay, let me tackle this philosophy student's problem. They're stuck on distinguishing epistemic contextualism and pragmatic encroachment. Both theories deal with how knowledge attributions seem context-sensitive, but the student notices that in real life, conversational context and practical stakes often change together. For example, when deciding whether to trust an engineer about a building's safety, signing a lease and paying a deposit makes them feel like the threshold for "knowing" shifts. But is that due to changing conversational standards (contextualism) or their increased personal stakes (pragmatic encroachment)?

  First, I need to clarify the core difference in where each theory locates context-sensitivity. Contextualism puts it in the attributor's conversational context—the speaker's situation when making a knowledge claim. Pragmatic encroachment roots it in the subject's practical situation—the person who supposedly knows something. The student mentioned this, but I should emphasize how it plays out in their building example. When they signed the lease, did the meaning of "know" itself change (contextualism), or did their higher stakes affect whether the engineer's belief met the justification bar (pragmatic encroachment)?

  Next, the student wants thought experiments where these factors are separated. For contextualism, imagine a low-stakes attributor discussing the student's high-stakes situation. Contextualism predicts the attributor could truthfully say "they know" if their own context is low-stakes. Pragmatic encroachment would say the subject's high stakes make knowledge false regardless of attributor context. For the reverse case—fixed attributor context but shifting subject stakes—pragmatic encroachment predicts knowledge attribution changes with stakes, while contextualism says it shouldn't if the conversation remains low-stakes. I should make these cases vivid, like the coffee shop vs. lease-signing scenarios the student might relate to.

  The student also asks if pragmatic encroachment is a rival or special case of contextualism. This is tricky. Some like Hawthorne think they blend, but purists like Stanley see them as distinct. The key is whether stakes directly affect knowledge (encroachment) or just the word's meaning (contextualism). I'll note that pragmatic encroachment rejects classical invariantism more radically by letting practical factors into epistemology itself, whereas contextualism is more about semantic flexibility.

  For objections, contextualism faces the "semantic blindness" problem—people don't report feeling like "know" shifts meaning. Pragmatic encroachment battles the "purist intuition"—should practical stakes really affect truth of knowledge, or just our willingness to act? I should highlight DeRose's bank cases for contextualism and Stanley's high-stakes subject examples for encroachment.

  Where do they genuinely diverge? Mainly in cases where attributor context and subject stakes come apart. Contextualism cares about the speaker's situation; pragmatic encroachment cares about the subject's. If the student can show intuitions tracking subject stakes even when attributor context is fixed, that supports pragmatic encroachment. But if intuitions shift only when conversational standards change, contextualism wins.

  The student's term paper decision hinges on which theory better explains their apartment case. If the shift happened because signing the lease changed how they talked about knowledge (e.g., demanding more evidence), that's contextualism. If it changed the actual requirements for the engineer to know (due to their own higher stakes), that's pragmatic encroachment. I'll suggest they test this with the separated scenarios in their paper.

  Finally, I'll structure the response to directly answer their three points, then add objections and divergence. Keeping it precise but grounded in their example will help them choose a defensible thesis. They need to avoid conflating the theories, so emphasizing the clean cases is crucial.
answer: |-
  It's impressive that you're grappling with this deep entanglement – the conflation of context and stakes in real life is precisely why this debate remains so thorny. Let's break down epistemic contextualism (EC) and pragmatic encroachment (PE) on your key points, highlighting their genuine differences and strongest objections to help you choose a defensible position for your paper.

  **Core Distinction: The *Locus* of Sensitivity**
  1.  **Epistemic Contextualism (EC)** (e.g., DeRose, Lewis, Cohen):
      *   **Locus:** The **attributor's conversational context**. What varies is the *semantic content* of the word "knows" and its associated epistemic standards (e.g., how much evidence, how reliable the source needs to be). The context of the person *saying* "S knows that p" determines the meaning of "knows" in that utterance.
      *   **What's Doing the Work?** Conversational mechanisms (like salience of error possibilities, practical purposes of the conversation) *change the meaning* of the knowledge attribution itself. In high-stakes contexts, "know" semantically requires meeting higher standards. The subject's *own* stakes are irrelevant to the truth condition of the attribution *unless* they are part of the attributor's conversational context.
  2.  **Pragmatic Encroachment (PE)** (e.g., Stanley, Fantl & McGrath, Hawthorne):
      *   **Locus:** The **subject's practical situation** (their stakes, interests, potential costs of error). What varies is the *justificatory requirement* for a true knowledge attribution. Higher stakes *for the subject* raise the amount/quality of justification required *for that subject* to genuinely know.
      *   **What's Doing the Work?** Practical factors directly affect the *epistemic* relation between the subject and the proposition. Knowing that p isn't just a matter of true belief + justification (traditionally conceived); whether one's justification is *sufficient* depends on how bad it would be to be wrong. High stakes *raise the epistemic bar* the subject must clear.

  **Predictions in "Clean" Cases**
  *(Assume "me" = Subject (S), "attributor" = Person attributing knowledge to S)*

  1.  **Case: Subject's Evidence & Stakes Fixed; Attributor's Context Changes**
      *   **EC Prediction:** The *truth-value* of the knowledge attribution **changes**.
          *   *Example:* S (you) have moderate evidence the building is safe (engineer's assurance, basic reputation check) and moderate stakes (casually considering). Attributor A is in a *low-stakes chat* ("Hey, is that new building downtown safe?"). Attributor B is in a *high-stakes briefing* ("We're evacuating the building next door – are you *sure* it's safe?"). EC says A's utterance "S knows the building is safe" is likely **true** (low standards met), while B's utterance "S knows the building is safe" is likely **false** (high standards not met by the same evidence), *even though S's situation hasn't changed*.
      *   **PE Prediction:** The truth-value of the knowledge attribution **remains constant** (assuming S's justification/stakes are sufficient/insufficient for their fixed stakes). Attributor context doesn't affect the *truth* of whether S knows, only how appropriately/wisely they use the word "knows".
          *   *Example:* Same S as above. PE says whether S *knows* depends *only* on S's evidence and S's stakes. If S's evidence is sufficient *for S's moderate stakes*, then S *knows*. Both A and B's attributions ("S knows") should be **true**, though B's utterance might be *misleading* or *pragmatically inappropriate* (implying higher confidence/standards than warranted). If S's evidence is insufficient *for S's moderate stakes*, both attributions are **false**. Attributor context only affects *assertability*, not *truth*.

  2.  **Case: Attributor's Context Fixed; Subject's Stakes Rise**
      *   **EC Prediction:** The truth-value of the knowledge attribution **remains constant** (assuming the subject's evidence remains fixed). The meaning of "knows" is set by the attributor's context. If the subject's evidence met the fixed standards before, it still does.
          *   *Example:* Attributor C is always in a *low-stakes coffee chat*. Initially, S (you) have moderate evidence and low stakes (casually considering apartment). C says, "S knows it's safe" (likely **true**, low standards). Later, S signs the lease, pays a deposit – stakes skyrocket. *S's evidence hasn't changed*. EC says C's utterance "S knows it's safe" is **still true**, because the meaning of "knows" is fixed by C's low-stakes context. C isn't talking about S's high stakes; they're using "knows" with low standards. S might *feel* less certain, but according to EC, they still "know" in the sense relevant to C's utterance.
      *   **PE Prediction:** The truth-value of the knowledge attribution **changes**. Higher stakes *for S* raise the justificatory bar *S* must meet to know. Evidence sufficient for low-stakes knowledge is insufficient for high-stakes knowledge.
          *   *Example:* Same scenario. Initially, low stakes, moderate evidence: S knows, C's attribution is **true**. After lease/deposit, S's stakes soar. *S's evidence is unchanged.* PE says S *no longer knows* – the same evidence is now *epistemically insufficient* given the potential cost of being wrong. Therefore, C's utterance "S knows it's safe" becomes **false**, *even though C's conversational context (low-stakes coffee chat) hasn't changed*. C might not *realize* S's stakes changed, but according to PE, the statement is now false.

  **Is PE a Rival or a Special Case of EC?**

  *   **They are Genuine Rivals.** While they both acknowledge contextual variation in knowledge *attributions*, they offer fundamentally different *explanations* located in different places (semantics vs. metaphysics of knowledge) and have conflicting predictions in the clean cases above.
      *   EC is fundamentally a *semantic* thesis about the word "knows". It preserves a purist core for knowledge (true belief + justification defined purely by truth-relevant factors) but makes the *meaning* of "justification sufficient for knowledge" context-sensitive.
      *   PE is fundamentally a *metaphysical* or *substantive epistemic* thesis about the nature of knowledge itself. It argues that what *constitutes* sufficient justification (a necessary condition for knowledge) depends *in part* on non-truth-relevant, practical factors (the subject's stakes). This directly challenges the "purist" intuition that knowledge depends *only* on truth-relevant factors (evidence, reliability, etc.).
  *   **Why not a special case?** EC *could* theoretically be formulated to incorporate subject stakes *if* they become relevant in the attributor's context (e.g., the attributor mentions the subject's high stakes). However, core PE insists that the subject's stakes affect the *truth* of the knowledge claim *independently* of whether the attributor is aware of them or whether they are part of the conversational context. This is incompatible with EC's core claim that the truth-condition is fixed *solely* by the attributor's context. The clean cases (especially Case 2) expose this fundamental divergence.

  **Strongest Objections**

  *   **To Epistemic Contextualism (EC):**
      *   **The Semantic Blindness/Objection:** (Schiffer, Stanley) If "knows" is context-sensitive like "tall" or "flat", competent speakers should be aware of this and easily recognize when they are shifting standards or disagreeing due to context. However, we don't report feeling like we've changed the meaning of "knows". We report genuine disagreement ("No, you *don't* know that!"). EC struggles to explain this lack of metalinguistic awareness and the intuitive sense of genuine disagreement across contexts. It makes ordinary speakers seem semantically incompetent.
      *   **The Explanatory Gap:** Does merely *mentioning* a far-fetched error possibility in a conversation *really* change the amount/quality of evidence required to *genuinely know*? Or is it just changing what it's appropriate to *say*? EC risks conflating conversational norms with genuine epistemic standards.
      *   **Subject-Sensitivity Intuitions:** EC struggles to cleanly accommodate intuitions where the *subject's* stakes seem to matter directly to whether they know (as in your building example *before* you voice the attribution), even in a fixed conversational context.

  *   **To Pragmatic Encroachment (PE):**
      *   **The Purist Intuition/Truth-Relevance:** (Feldman, Conee) Knowledge is about representing reality accurately. Why should *practical* consequences of *acting* on a belief affect whether that belief *constitutes knowledge*? Isn't the justification condition purely about the likelihood of the belief being *true*? PE seems to confuse the norms of *action* (where stakes clearly matter) with the norms of *belief/knowledge*. One can know p but reasonably not act on it in high stakes (requiring more evidence for action than for mere belief).
      *   **The Threshold Problem:** How high do stakes have to be, and how exactly do they determine the required level of justification? The relationship seems vague and arbitrary. This makes PE seem less like a precise theory and more like an ad hoc explanation for intuitions.
      *   **Lack of Motivations for Action?** Critics argue PE struggles to explain why knowledge is the uniquely appropriate norm for action (the "Knowledge Norm of Assertion/Practical Reasoning"). If knowledge depends on stakes, but acting appropriately *also* depends on stakes, the connection between knowing and appropriate action becomes less direct and explanatory.

  **Where They Genuinely Diverge (Beyond Semantics)**

  The deepest divergence lies in their **core commitments about the nature of knowledge and justification**:

  1.  **Truth-Relevance:** EC maintains that the standards for knowledge/sufficient justification are *purely truth-relevant* (evidence quality, reliability, ruling out relevant alternatives). Context only affects *which* truth-relevant standards are semantically expressed by "knows". PE argues that sufficient justification *is not purely truth-relevant*; the stakes (a practical factor) partially determine what *counts* as sufficient justification.
  2.  **Subject vs. Attributor Focus:** EC makes knowledge attributions fundamentally *attributor-relative* (the truth depends on who is speaking and their context). PE makes knowledge fundamentally *subject-relative* (the truth depends on the situation of the person who is supposed to know). This is starkly revealed in Case 2 above.
  3.  **Metaphysics vs. Semantics:** PE makes a claim about *what knowledge is* (its constitutive conditions). EC makes a claim about *how we talk about* knowledge (the meaning of the word "knows").

  **Recommendation for Your Term Paper:**

  Your building example perfectly captures the entanglement. To build a strong argument, **focus on the clean cases where context and stakes pull apart**:

  1.  **Argue for EC:** Defend the intuition that a detached observer in a low-stakes chat *can* truthfully say "S knows" about your high-stakes situation (Case 1), *or* defend the intuition that your friend in the coffee shop continues to speak truly when they say "You know it's safe" even *after* you've signed the lease (Case 2). Tackle the Semantic Blindness objection head-on (e.g., argue context-sensitivity can be subtle/unnoticed, or that the disagreement is pragmatic).
  2.  **Argue for PE:** Defend the intuition that once *your* stakes rise significantly, *you no longer know*, even if your evidence is unchanged and someone in a low-stakes context says you do (Case 2). Argue that attributor context only affects *appropriateness of assertion*, not the *truth* of the knowledge claim (Case 1). Defend the idea that justification inherently involves risk assessment, making stakes epistemically relevant. Counter the Purist Intuition by arguing that knowledge is intrinsically linked to action, making practical factors inescapable.

  **Key Question for Your Argument:** In your building case, when you signed the lease, did the *meaning* of "Do I know?" change (EC), or did the *epistemic facts themselves* change because your relationship to the potential cost of error changed (PE)? The clean cases force intuitions that answer this. Choose the theory whose core commitment (semantic flexibility vs. practical constitution of justification) best explains the intuitions you find most compelling and defensible. Good luck!
