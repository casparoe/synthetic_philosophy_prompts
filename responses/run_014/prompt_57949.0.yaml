  I am directing a student production of Othello and the cast are puzzled by his jealousy in the middle acts: he treats a lost handkerchief as decisive proof, collapses into a fit, and remains convinced long after an impartial observer would harbour doubts. Please read this arc through the debate over whether emotions are evaluative judgements, perceptions of value, or feelings of bodily change. Explain where each account best illuminates a moment in his decline, where the play resists that account, and what Shakespeare's dramatisation suggests about jealousy that the abstract theories miss.
reasoning: |-
  Okay, the user is directing a student production of Othello and the cast is puzzled by Othello's intense jealousy. They want me to analyze his jealousy through three philosophical theories about emotions: as evaluative judgments, perceptions of value, and feelings of bodily change. I need to apply each theory to specific moments in the play, show where the play resists each theory, and highlight what Shakespeare's dramatization reveals about jealousy that abstract theories might miss.

  First, I recall the key moments in Othello's decline. The handkerchief scene (Act 3 Scene 4) is crucial—Othello treats this lost token as definitive proof of Desdemona's infidelity. Then there's his physical collapse into a fit (Act 4 Scene 1), and his unwavering conviction even when evidence should create doubt. These moments need to be examined through each emotional theory.

  For the first theory—emotions as evaluative judgments—I consider how Othello's jealousy stems from a judgment that Desdemona has betrayed him. The handkerchief represents infidelity in his mind; its loss confirms his judgment. This fits Act 3 Scene 4 well. But the play resists this when Othello's conviction persists despite contradictory evidence, which pure judgment theory can't fully explain. Shakespeare shows how jealousy distorts judgment.

  Next, the perceptual theory: emotions as perceptions of value. During the fit in Act 4 Scene 1, Othello's jealousy feels like an undeniable reality, just as we perceive colors directly. The trance scene makes his emotional "truth" visceral. But the play challenges this when Emilia later exposes Iago's deceit, revealing that Othello's perception was false all along. Perception theory doesn't capture how easily manipulated these "perceptions" can be.

  Then the somatic theory: emotions as feelings of bodily change. Othello's fit is a physical manifestation—tremors, collapse—showing how jealousy consumes him bodily. His language shifts to violent, visceral imagery. But the play goes beyond this; Othello's jealousy isn't just physical but deeply existential, tied to identity and societal fears. The somatic response is a symptom, not the core.

  Now, synthesizing what Shakespeare adds: his dramatization shows jealousy as a poison that spreads through manipulation, exploiting vulnerabilities. It's not just internal; Iago weaponizes Othello's cultural insecurities. The handkerchief isn't merely evidence—it's a symbol loaded with history and magic. The collapse isn't just a fit but a public unraveling. And the persistence of conviction highlights how jealousy, once rooted, resists disproof because it's tied to deeper fears about identity and belonging.

  I should also consider the user's deeper needs. As a director, they likely want to help actors embody these moments authentically. Highlighting the physicality, the distorted perceptions, and the judgment errors can inform performances. The cast might be stuck on why Othello doesn't doubt earlier—Shakespeare shows jealousy's irrational grip. Practical insights: emphasize Iago's manipulation as a "laboratory" for jealousy, the handkerchief's symbolic weight, and how Othello's identity crisis fuels the emotion beyond logic.

