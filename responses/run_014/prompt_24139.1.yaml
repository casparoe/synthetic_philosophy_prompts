prompt: |-
  I keep getting drawn back into the same argument with a friend about whether we ought to try to maximize the number of future happy people — the longtermist / AI-existential-risk motivation, roughly. Every time I raise the repugnant conclusion (that, on a total view, a vast population of people whose lives are barely worth living is overall better than a small population of people living excellent lives), he waves it away with "but more is better" and acts as though that settles the matter. I'm fairly sure something is off about how he's deploying the phrase, but I can't pin down what, because "more is better" is quietly doing several different jobs at once.

  Could you take "more is better" as it's used in population ethics and lay out the distinct precise theses it could actually be expressing — a non-satiation principle about adding people with positive welfare, a total-utilitarian maximization of the sum, an average-utilitarian claim (or whether it even is one), a ceteris-paribus triviality, a descriptive versus an evaluative claim, and the role it plays in whether the repugnant conclusion follows at all. For each, say whether it's a platitude, a substantive and defensible principle, or actually false, and whether it's the reading his dismissal genuinely needs to get its conclusion. I want a menu I can bring back to him rather than a single reconstruction, and I'd like you to be explicit about where the readings diverge on what "more" and what "better" are each doing, since I suspect that's where the whole thing is going sideways.

  Finally, note how confident you are in each verdict and single out the one point you're least sure about — for instance, whether a particular reading is genuinely false or merely unattractive, or whether he's equivocating across readings in a way I haven't listed.
