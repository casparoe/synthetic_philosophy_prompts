  *Pauses* Interesting - the user suspects equivocation across meanings. That's likely spot-on. The friend probably begins with the platitude (adding good lives helps) but slides into the controversial thesis (we should maximize total people) without noticing. 

  *Checks academic references* Right, Parfit's original formulation shows the repugnant conclusion only follows if you accept strong total utilitarianism. The average utilitarian escapes it but has other problems. The friend's "more is better" response ignores this nuance entirely. 

  *Makes mental note* Should flag the ceteris paribus fallacy too - the friend might think adding people has no trade-offs, but real-world resource constraints make that implausible. Also worth noting that "better" could mislead if it implies moral obviousness rather than being a technical term. 

