  The cruxes need particular care. For the precommitment issue, I'll design a case where an agent can pay to avoid future exploitation - does this neutralize the irrationality charge? For Allais preferences, we need a real-world exploitability scenario that doesn't rely on artificial repetition. Each position's predictions should be falsifiable: if the advisor is right, precommitting agents should still feel compelled to avoid pumps; if the student is right, such agents won't perceive incoherence.

  I notice potential verbal disputes around "coherence" (internal consistency vs full EU compliance) and "vindication" (representation as existence proof vs justification). These must be flagged explicitly rather than smoothed over - perhaps in a dedicated terminological subsection. The goal is to make these fault lines productive for their collaboration.

