prompt: |-
  I'm a PhD student in formal epistemology writing a dissertation chapter on pragmatic arguments for expected utility theory, and my advisor and I have spent the past year arguing past each other about how much the coherence machinery actually buys. My advisor takes the full-strength view: the Dutch book and money-pump arguments, combined with the representation theorems, show that any agent with moderately structured preferences is rationally required to be an expected utility maximizer. I've drifted to a weak-coherence view: the pragmatic arguments establish only thin structural conditions like acyclicity and non-exploitability, and the axioms doing the real work — independence, the sure-thing principle — stand or fall on substantive arguments, not on vulnerability to bookmakers. We've agreed to run an adversarial collaboration and write up the results together. Please draft the joint statement we should end up with. I want it to contain: (1) a numbered section of claims we can both sign, including about the formal results themselves — what the representation theorems assume, what a Dutch book versus a money pump is, and which arguments turn on iterated versus one-shot choice; (2) a disagreements section where each residual disagreement is phrased so the holder of that view would accept the wording as their own, not as a caricature; and (3) the cruxes — I suspect one is whether an agent who knows the pump is coming, and who can precommit or choose resolutely, is still irrational, and another is whether ordinary Allais-type preferences are exploitable in any sense that matters — with, for each crux, a concrete case or argument we both agree would bear on it, plus each of our predictions recorded in advance. If part of our dispute turns out to be verbal — say, over whether "coherence" means internal consistency or the stronger conclusion, or whether a representation theorem can "vindicate" anything — say which part and why, rather than papering over it.
