  Hmm... this is actually a classic democratic theory puzzle dressed in campus activism clothes. The user's hidden request isn't really about drafting documents—it's about finding a framework to make the debate productive. They're tired of people talking past each other. The adversarial collaboration approach is smart because it forces both sides to articulate their principles in shared terms.

  Let me unpack the Riverbend test case first. The dam creates four tension points: downstream farmers (affected but not governed by Riverbend), seasonal workers (temporary residents), future taxpayers (not yet born), and locals (directly governed). Perfect stress test. 

  For the joint statement, I need to identify uncontroversial common ground before mapping disagreements. Both sides definitely agree that coercion matters (point 1), affectedness matters (point 2), and that current residents are core voters (point 3). The friction emerges at the edges—like whether physical presence or legal subjection should dominate. 

  The table should avoid strawmanning. For the Affected, I'll emphasize their concern about moral exclusion of harmed outsiders. For the Coerced, I'll highlight their fear of ungovernable pluralism if affectedness expands the demos infinitely. The "enforcement" row is key—it shows both sides recognize practical limits but draw them differently. 

  Ah, the cruxes! The seasonal worker case (#1) exposes a rift in how both sides define "living under" governance. The unborn taxpayers (#2) reveal fundamentally different temporal perspectives. The downstream farmers (#3) are the nuclear option—pure affectedness vs legal jurisdiction. Each forces predictions: Will Coerced folks really deny voting rights to someone physically present? Will Affected advocates extend suffrage to distant farmers? 

  Noticing verbal traps: "Binding decisions" means different things to each group (legal vs practical), and "community" is dangerously vague. Also "governance" gets stretched when discussing future generations. 

  Final thought: The user might actually want this as a mediation template. I'll add procedural suggestions at the end—like rotating facilitation—to help their club move forward. The real win isn't agreement but clearer disagreement.
answer: |-
  Here's a joint statement framework for your campus politics club, designed as a genuine adversarial collaboration using the Riverbend case to force specificity. It identifies common ground, clarifies differences, pinpoints cruxes, and flags verbal disputes:

  **Joint Statement: Defining the Demos for Riverbend Dam Decision**

  We, the Affected and Coerced perspectives, acknowledge a shared commitment to democratic legitimacy but disagree on the boundaries of the voting demos for decisions like the Riverbend Dam. We agree the issue is complex and neither principle provides perfect answers. Using the Riverbend case, we identify points of agreement, disagreement, and key tests.

  ### I. Agreed Foundational Claims (Numbered)

  1.  **Coercion is Central:** Legitimate governance involves the potential use of force to enforce rules. Those subject to this direct enforcement have a strong claim to inclusion in the demos.
  2.  **Affectedness Matters:** Decisions significantly impacting people's lives raise serious moral and practical concerns, even for those outside the enforcing jurisdiction. Ignoring profound effects undermines legitimacy.
  3.  **Current Resident Citizens are Core:** Adult, permanent residents of Riverbend Town (subject to coercion *and* directly affected by the dam's local consequences) are unquestionably part of the demos.
  4.  **The Problem of Boundaries is Real:** Neither principle automatically draws a clear, uncontested line around the demos for complex, long-term projects like the dam. Practical implementation requires judgment calls.
  5.  **Legitimacy Requires Justification:** Excluding individuals who have a plausible claim for inclusion based on either principle requires strong justification.
  6.  **The Riverbend Case is a Valid Test:** This scenario effectively highlights tensions between our principles regarding:
      *   Spatial boundaries (downstream farmers).
      *   Temporal boundaries (unborn taxpayers).
      *   Membership duration/connection (seasonal workers).
  7.  **"No Taxation Without Representation" is Relevant:** The dam's 30-year tax burden creates a link between future financial coercion and current representation.

  ### II. Points of Disagreement (Table)

  | Issue Area                  | Affected Perspective (Worded for Acceptance)                                                                 | Coerced Perspective (Worded for Acceptance)                                                                 | Verbal Dispute Flag? |
  | :-------------------------- | :----------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------- | :------------------- |
  | **Core Demos Criterion**    | Voting rights should primarily belong to those whose fundamental well-being, livelihood, or environment is significantly altered by the decision, regardless of jurisdiction. | Voting rights should primarily belong to those who will be subject to the enforceable laws and direct governance structures created or modified by the decision. | **Yes** (Scope of "governance structures" vs. "well-being") |
  | **Downstream Farmers**      | Farmers facing the destruction of their livelihood and land due to flooding *must* have a formal vote; exclusion based on jurisdiction ignores the profound, intended consequence imposed on them. | While their plight deserves significant redress (compensation, veto?), they are not subject to Riverbend's laws or enforcement. Granting them a vote undermines the self-governance of Riverbend citizens bound by the decision's consequences. | **No** (Material difference) |
  | **Seasonal Workers (4 mo/yr)** | Workers residing locally for a significant portion of the year, contributing to the economy and living under Riverbend's laws during that time, and whose employment/commuting may be affected, should be included. | Their temporary, non-permanent status means they are not fully integrated into the long-term political community subject to the enduring consequences (e.g., permanent tax burden, transformed landscape). They lack sufficient enduring subjection. | **Partial** (Definition of "sufficient enduring subjection") |
  | **Unborn Taxpayers**        | Future generations bearing the financial burden (taxation) for 30 years have a profound affected interest. Mechanisms (e.g., proxy representation, stronger sustainability mandates) *must* be included to protect them. | Future individuals cannot be subject to *current* enforceable laws. They are not part of the present political community making the binding decision. Their interests should be weighed heavily in deliberation, but not via voting rights. | **Partial** (Definition of "current" political community vs. enduring effects) |
  | **Enforcement Mechanism**   | The practical difficulty of including everyone affected is real but doesn't negate the moral principle. We must find the best *practicable* way to approximate inclusion (e.g., regional bodies, designated representatives). | Enforceability and the need for a clear, administratively feasible demos are core to legitimate governance. Indefinite expansion based on diffuse affectedness leads to ungovernability and dilutes the voice of the core governed community. | **No** (Material difference in priority) |

  ### III. Cruxes & Riverbend Test Predictions

  1.  **Crux: Is physical presence/enduring residence under the jurisdiction *sufficient* for inclusion, even without permanent status?**
      *   **Relevant Case:** Seasonal Workers (4 months/year, live in town).
      *   **Affected Prediction:** They *should* be included. Excluding them denies a voice to people demonstrably living under and contributing to the community during a significant period, facing immediate impacts.
      *   **Coerced Prediction:** They *should not* be included. Voting rights require deeper, permanent stakes in the community's long-term future and full subjection to its enduring governance structures.
      *   **Movement Potential:** If Coerced side concedes that *duration/intensity* of subjection matters and seasonal workers meet a threshold, or if Affected side concedes permanent residency is a necessary bright line for *practical* voting.

  2.  **Crux: Does the imposition of a significant, unavoidable, long-term *financial burden* (taxation) constitute "subjection to enforcement" or a type of "affectedness" demanding voting rights *now*?**
      *   **Relevant Case:** Unborn Taxpayers (will pay for the dam over 30 years).
      *   **Affected Prediction:** Their massive affected interest necessitates *some* formal representation in the decision (e.g., proxy votes for future gens, supermajority requirements). Mere "consideration" is insufficient.
      *   **Coerced Prediction:** Financial burden alone, imposed on future non-existent persons, does not equate to *current* subjection to enforceable laws. They cannot vote. Deliberation must prioritize sustainability/intergenerational justice.
      *   **Movement Potential:** If Affected side accepts non-voting safeguards as sufficient, or if Coerced side accepts that *binding* future financial obligations warrant unique proxy mechanisms *resembling* voting rights for this specific burden.

  3.  **Crux: Can a democratic decision be legitimate if it *intentionally and foreseeably* inflicts severe harm on a geographically distinct group *without* granting them a formal vote, even if they lie outside the enforcing jurisdiction?**
      *   **Relevant Case:** Downstream Farmers (lose land/livelihood).
      *   **Affected Prediction:** Legitimacy fundamentally *fails* without their inclusion. Profound harm mandates a direct voice.
      *   **Coerced Prediction:** Legitimacy requires *justification and redress* (compensation, mitigation, negotiation), but *not* necessarily inclusion in Riverbend's demos. Their inclusion dissolves jurisdictional accountability.
      *   **Movement Potential:** Low on voting inclusion itself. Movement might occur on *acceptable redress* (e.g., Coerced accepts near-total compensation/veto power; Affected accepts this as functionally equivalent to a vote in this case). Or, recognizing this is a fundamental, likely irreconcilable difference in core principles.

  ### IV. Flagged Verbal Elements

  1.  **"Binding Decision":** Both sides agree the dam decision is binding, but differ on *who* it binds. Affected focuses on those bound *by the consequences*; Coerced focuses on those bound *by the enforcing authority*.
  2.  **"Community":** The Affected view often implies a "community of fate" defined by shared impact. The Coerced view implies a "political community" defined by shared subjection to authority. These are different conceptions.
  3.  **"Governance"/"Subject to Law":** The Coerced view has a narrower, more legalistic definition focused on direct enforcement mechanisms. The Affected view might interpret "governance" more broadly as the systems shaping life chances, even indirectly.

  **Procedural Agreement:** We commit to using frameworks like this (shared agreements, clarified disagreements, specific test cases with predictions) in future discussions to avoid talking past each other. We will rotate facilitation and focus on finding the strongest arguments *for* the opposing view during debates. We acknowledge that resolving the core tension might require hybrid models or accepting different principles for different types of decisions.
