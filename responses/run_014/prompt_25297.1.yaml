        "best_evidence_for": "Extensive neural homologies (e.g., layered neocortex, thalamocortical loops), complex social cognition, theory of mind (in some), unambiguous pain behaviors with neuropharmacological sensitivity, sophisticated learning/memory, metacognition demonstrations (in primates/cetaceans).",
