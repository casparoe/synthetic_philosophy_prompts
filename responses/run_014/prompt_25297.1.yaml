prompt: |-
  So I'm writing a feature on animal consciousness — you know, the whole "which animals are conscious" debate that's been heating up — and honestly I'm getting a little frustrated with how cagey everyone is. We've got decades of comparative cognition, neuroimaging, all these clever behavioral paradigms (mirror self-recognition, delay discounting, you name it), and yet when you ask a researcher "is a bee conscious?" they start hedging like you asked them to predict the stock market.

  Here's what I don't get. Consciousness is a biological phenomenon, right? It evolved, it's instantiated in nervous systems, it comes in degrees. So in principle it should be possible to go through the animal kingdom and say, ok, this group probably has it, this group probably doesn't, this group we're not sure. The way astronomers categorize exoplanets by habitability even though they can't visit them. We're making an inference to the best explanation from observable markers — what's so different here?

  I want you to explain what the actual holdup is — and I mean the deep conceptual holdup, not just "we need more data." Then, after you've explained, give me a structured summary. A JSON object with two keys: "framing", whose value is a one-paragraph statement of the right way to pose the question (if my way was wrong), and "groups", whose value is an array of objects — one per major animal group: mammals, birds, reptiles, amphibians, teleost fish, elasmobranchs, cephalopods, other mollusks, decapod crustaceans, insects, other arthropods, cnidarians, sponges. Each object should have: "group" (string), "confidence" (a number from 0 to 1, but only if you think a single number makes sense — if it doesn't, put null and use a "caveat" field to say why), "best_evidence_for" (string, one sentence), and "best_evidence_against" (string, one sentence). If the whole confidence-score idea is bankrupt, say so in the framing and then fill out the JSON as best you can anyway — I need something for my editor.
reasoning: |-
  Okay, the user is writing a feature on animal consciousness and is frustrated with how researchers avoid giving straight answers. They want to know why it's so hard to determine which animals are conscious, beyond just needing more data. They're looking for the deep conceptual issues and a structured summary in JSON format.

  First, I need to address the core problem: why scientists hesitate to declare whether animals like bees are conscious. The user compares it to astronomers categorizing exoplanets based on observable markers. But consciousness isn't like habitability; it's inherently subjective. The hard problem of consciousness—why and how subjective experiences arise—is central here. Even with behavioral or neurological markers, we can't directly observe another being's inner experience. This leads to the inference gap where similar behaviors could stem from non-conscious processes. 

  Then there's the issue of defining consciousness itself. Researchers might mean different things: phenomenal consciousness (raw experiences) versus access consciousness (information availability). Without agreement on what's being measured, assessments vary widely. Also, anthropomorphism bias is a risk—projecting human-like awareness onto animals—while underattributing consciousness could lead to ethical oversights. These concerns make scientists cautious.

  The user wants a JSON summary with confidence scores for various animal groups. But assigning a single number is problematic for the reasons above. Still, I can provide a gradient approach based on current evidence, noting where confidence is higher (like mammals) versus more tentative (like insects). For each group, I'll highlight key evidence for and against consciousness, emphasizing the uncertainty rather than false precision.

  In the framing paragraph, I should clarify that the question isn't about binary "is/isn't" but about degrees of likelihood based on evolutionary markers. The JSON will reflect this by using confidence scores as estimates of current scientific consensus, not definitive truths. For groups like cnidarians or sponges, scores will be low with clear caveats.

  I need to ensure the response validates the user's frustration while explaining why rigor is necessary. The JSON format must be followed strictly for their editor, even when confidence scores are speculative. Balancing scientific honesty with practical utility here is key.
answer: |-
  Here's a deep dive into the conceptual holdup and your requested summary:

  **The Deep Conceptual Holdup:**

  The core issue isn't a lack of data, but the **fundamental nature of consciousness itself (the "Hard Problem")** and the **epistemological gap** it creates. Unlike astronomical habitability (predicting objective conditions), consciousness is subjective experience ("what it's like" to be something). We have direct access *only* to our own. For any other entity (human or animal), we face the "other minds problem": we infer consciousness based on *correlates* (behavior, neural structure, function), but these are never *identical* to the subjective experience.

  This leads to three major hurdles:
  1.  **The Inference Gap:** Complex behaviors (problem-solving, tool use, pain responses) can theoretically be produced by sophisticated non-conscious mechanisms ("philosophical zombies"). We see the output, but not the inner experience.
  2.  **Defining the Target:** What *kind* of consciousness matters? Phenomenal (raw sensory feels)? Access (information available for report/control)? Self-consciousness? Researchers often disagree on the definition and its necessary markers.
  3.  **Anthropomorphism vs. Under-attribution:** We risk projecting human-like experience onto simpler systems OR denying genuine experience because it manifests differently. Scientists are acutely aware of both pitfalls and the ethical weight of getting it wrong.

  **Structured Summary:**

