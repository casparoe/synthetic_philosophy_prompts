  **Key Caveats on Confidence Scores:**

  *   **Not Binary:** The scores represent the *estimated likelihood* based on current evidence *inference*, not certainty. 0.5 doesn't mean "50% conscious", but "current evidence is ambiguous/equivocal".
  *   **Subject to Change:** New research (especially neuroethology) could significantly alter these estimates.
  *   **Within-Group Variation:** Confidence isn't uniform across all species in a group (e.g., octopus vs. clam within mollusks; honeybee vs. fruit fly within insects).
  *   **Definition Dependent:** Scores lean towards assessing capacity for *phenomenal consciousness* (subjective experience like pain/pleasure) rather than self-awareness. Confidence would be lower for self-awareness in most groups.
  *   **Proxy-Based:** They reflect confidence in the inference *from markers*, not direct proof.

  This structure provides the usable framework your editor needs while embedding the crucial caveats and reflecting the inherent challenge of studying subjective experience from the outside. The deep holdup remains the Hard Problem and the Inference Gap.
