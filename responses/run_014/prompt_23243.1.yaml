prompt: |-
  I just got appointed to the risk-communication committee for our hospital's new genetic screening program, and our first real fight is over what the patient-facing consent materials should say about the risk numbers. The statisticians want to print individualized estimates ('your personal risk is 3.2%'), the ethicist on the committee keeps objecting that a probability is only a long-run frequency so we can only honestly tell patients '1 in 300 people with your profile develop the condition', and a consultant of ours keeps pushing for language about the patient's own biological tendency ('your body carries a 1-in-300 chance'). I need a short written opinion to circulate before tuesday's meeting that takes a side: which framing should the materials use, with reasons that actually engage the other two positions philosophical objections instead of just waving them away, plus a concrete fallback for when we can't compute an individualized estimate at all.
reasoning: |-
  Okay, the user is on a hospital committee for a new genetic screening program and they're stuck in a debate about how to present risk numbers in consent materials. There are three conflicting viewpoints: statisticians want personalized percentages, an ethicist insists on long-run frequencies, and a consultant prefers biological tendency language. The user needs a concise opinion to present before Tuesday's meeting that picks a side while properly addressing the philosophical objections of the others, plus a fallback for when individualized estimates aren't available. 

  First, I need to unpack the core philosophical disagreement. The ethicist is coming from a strict frequentist interpretation of probability—only aggregate data is "real." The consultant is leaning toward propensity theory (probabilities as inherent properties). The statisticians are likely Bayesian, treating probability as reasonable expectation given personal data. This isn't just wording—it's about what probability *means*. 

  For patient communication, clarity and avoiding misinterpretation are key. The "1 in 300" framing is safest: it aligns with the frequentist view that the committee's ethicist finds honest, while still being concrete enough for patients. Crucially, it doesn't falsely imply the probability is a physical trait (unlike the consultant's version) or overstate precision (unlike the 3.2% estimate). 

  But I should acknowledge the statisticians' point: personalized estimates *are* more actionable. The compromise is to present both—lead with the frequency framing ("people like you") and add the precise estimate parenthetically for clinical utility. This satisfies the frequentist concern while honoring the data's value. 

  The biological tendency language worries me—calling it "your body's chance" risks ontological confusion. Patients might think the risk is unchangeable or literally inside them, which isn't how screening probabilities work. Better to keep the language descriptive. 

  For non-individualized cases, a grouped estimate ("people with similar results") plus a qualifier about uncertainty ("based on available data") covers both accuracy and transparency. 

  The user needs this to resolve committee conflict, so I’ll structure it clearly: state the chosen framing upfront, then dissect each objection fairly before explaining why the middle path works. Emphasize that all sides want truthful communication—just differ on how to achieve it. Practical tip: mock-ups help persuade.
answer: |-
  Here's a concise, balanced opinion favoring a specific framing while engaging the philosophical objections, plus a fallback solution:

  **Recommended Framing:**  
  **"Based on your genetic profile and other factors, people like you have about a 1 in 300 chance of developing [Condition]."**  
  *Optional addition for precision:* "(Estimated personal risk: 3.2%)"

  ### Why This Framing?  
  1.  **Balances Accuracy & Comprehension:**  
      -   Uses natural-frequency language ("1 in 300") proven to be more easily understood by patients than percentages or decimals.  
      -   Explicitly links the estimate to the patient's specific data ("your genetic profile and other factors"), satisfying the statisticians' goal of personalization without implying false precision.  
      -   The parenthetical percentage (if included) serves clinical utility without being the primary message.  

  2.  **Engages the Ethicist's Objection (Frequentism):**  
      -   The phrase "**people like you**" directly addresses the concern. It frames the probability correctly as a *long-run frequency within a reference class* (individuals sharing similar risk factors), not as an intrinsic property of the *specific* patient. This avoids misrepresenting a frequentist probability as a singular, guaranteed property.  
      -   **Concession:** The ethicist is right that a probability *is* fundamentally a long-run frequency. This phrasing honors that ontology. "People like you" *defines the relevant reference class* for the frequency.  

  3.  **Engages the Consultant's Objection (Propensity):**  
      -   While "your body carries a 1-in-300 chance" suggests a *propensity* (an inherent biological tendency), this is philosophically contested and potentially misleading.  
      -   **Objection Addressed:** Propensity interpretations are problematic for complex, multifactorial conditions. The risk isn't solely an inherent property "carried" like a single gene defect; it's an *estimate* based on current knowledge of correlations within populations. Our phrasing ("people like you have...") captures the *observed association* without implying the risk is an immutable, internal essence. It focuses on prediction, not ontology.  

  4.  **Addresses Statisticians' Concerns (Personalization & Precision):**  
      -   **Acknowledgment:** Personalized estimates (3.2%) are valuable for clinical decision-making and stratification.  
      -   **Refinement:** Leading with the frequency format ("1 in 300") improves patient comprehension. The parenthetical percentage can be included for precision *if space allows and the committee agrees*, but the verbal explanation should emphasize the frequency. The key is that "people like you" incorporates personalization within a statistically honest framework. Printing *only* "3.2%" risks misinterpretation (e.g., false precision, confusion about what it represents).  

  ### Fallback for Non-Individualized Estimates
  **When an individualized estimate isn't feasible (e.g., rare profile, insufficient data):**  
  **"Based on available data, people with genetic screening results similar to yours have about a [X] in [Y] chance of developing [Condition]. This estimate is less precise than some others due to limited data for your specific combination of factors."**

  *   **Why this works:**  
      *   Maintains the frequentist "people with... similar results" framing.  
      *   Transparently communicates the lower precision/confidence.  
      *   Avoids inventing false individualization ("your risk") or implying unwarranted propensity ("your body's chance").  
      *   Uses clear frequency language (X in Y).

  ### Key Rationale Summary
  *   **Philosophical Honesty:** "People like you/have similar results" accurately reflects probability as a frequentist property of a *reference class*, satisfying the ethicist. It avoids the contested metaphysics of propensity ("your body carries").  
  *   **Practical Clarity:** Natural frequencies (1 in X) are demonstrably better understood than percentages or decimals by the public.  
  *   **Personalization without Misrepresentation:** Linking the frequency explicitly to "your genetic profile" or "results similar to yours" provides the personalized context the statisticians value, while staying true to the statistical methodology generating the estimate.  
  *   **Mitigating Harm:** Avoiding "your body carries" prevents potential misinterpretation of risk as an immutable, internal essence, which could cause unnecessary distress or determinism. Avoiding *only* the raw percentage (3.2%) reduces the risk of misunderstanding its meaning or overemphasizing false precision.

  This approach respects the statistical data, adheres to a defensible philosophy of probability (frequentism), prioritizes patient understanding, and provides ethical transparency—especially when individualized estimates are unavailable.
