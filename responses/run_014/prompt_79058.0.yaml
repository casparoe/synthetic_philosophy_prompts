prompt: |-
  I just got voted onto the standards committee of my professional association (nursing, about 4,000 members in the state chapter) and I am definately in over my head. Here's the problem. Two years ago we finally passed a real ethics code after the whole mess with the previous board. Now people keep filing complaints about things members did *before* the code existed. Technically allowed back then, or at least nobody ever wrote down that it wasn't. And I keep noticing that the people pushing hardest for us to go after the old guard are a lot of the same people who were in the room while all of it was happening. The full board has to ratify whatever we recommend, and half of them would honestly rather we buried the whole thing.

  I've been reading about Nuremberg and Tokyo on my own time because it feels like exactly our problem, and now I can't unsee it. The charter they used was written after the acts they were judging, which is why the defense kept yelling ex post facto; the answer was that the 1928 treaty renouncing war as an instrument of national policy had already made aggression illegal, plus the idea that some acts are criminal under general principles no matter what the local law says. The defendants tried tu quoque -- you did it too -- and got nowhere. One judge at Tokyo thought every single defendant should walk and basically called the trial the winners taking revenge; he pointed out that Allied firebombing and the atomic bomb were not on the charge sheet and that no judges from the losing side sat on the bench. Also, superior orders was not a defense, only something that could lighten a sentence, and there was a conspiracy charge that let them convict the people who planned it rather than the ones who pulled the trigger. Later international law swung back the other way and made non-retroactivity a hard rule again.

  So can you turn this into a decision procedure my committee can actually run? I get maybe twenty minutes per case and I have no legal training. I need the questions in order, what counts as a good enough answer to each one, where it stops and says no, and where it has to stop and hand off to a committee vote because its a value call and not a fact call. Don't send me to any sources or give me a reading list, I can't look anything up -- just build the ideas into the steps.

  Then run the procedure on the three complaints we're sitting on: (1) a member who harassed a junior colleague in 2019, back when our old code was silent about it and everyone knew it; (2) a complaint against a former officer for taking industry gifts that three people currently on my committee also took; (3) a complaint against a department head who designed the production quota that led to the falsified records, even though he never falsified a single one himself. And tell me honestly where the procedure spits out an answer I won't like, and what it just can't do.

  American English, please.
reasoning: |-
  Okay, the user is on a nursing association standards committee dealing with ethics complaints about actions that happened before their new code existed. They need a clear decision procedure to handle these cases efficiently. 

  First, I need to understand the core legal principles they're wrestling with: retroactivity, ex post facto, and the moral gray areas from historical precedents like Nuremberg. The user explicitly referenced those trials for a reason—they're sensing parallels in holding people accountable under new standards. 

  The user's frustration is palpable: they're time-pressed (20 minutes per case!), legally untrained, and stuck between members who want retroactive punishment and board members who want to bury everything. The three sample cases are perfect test scenarios—each represents a classic retroactivity dilemma (harassment, gifts, systemic harm). 

  Hmm... the real tension here isn't just legal; it's political. The "people pushing hardest" were complicit bystanders, and half the board wants this gone. That changes how I design the procedure—it needs to be bulletproof enough to withstand internal politics. 

  For the decision tree, I'll borrow Nuremberg's "general principles" logic but simplify it into binary checkpoints. Key filters: 
  - Was it illegal under civil law at the time? (Automatic disqualifier) 
  - Did it violate bedrock nursing ethics? (Florence Nightingale test) 
  - Was there concealment? (Post-facto cover-ups imply guilt) 

  The gift case is the trickiest—it implicates current committee members. The procedure must flag recusals early and treat "everyone did it" as irrelevant (per Nuremberg rejecting tu quoque). For the harassment case, I'll emphasize that pre-code silence ≠ permission if civil laws existed. 

  Biggest limitation: this can't resolve value judgments about "how bad" something was—that'll always need committee vote. And yeah, the gift case outcome will frustrate the user since it likely passes the filters. Gotta warn them about that upfront. 

  ...Wait, did I miss anything? The production quota case needs special handling for "planners vs. doers"—that Nuremberg conspiracy charge analogy fits perfectly. Adding a separate branch for systemic harm cases. 

  Final structure: 
  1. Hard stops (jurisdiction/time limits) 
  2. Retroactivity filters 
  3. Severity/value call flags 
  4. Three test runs with political landmines called out 

  User's smart to avoid "sources"—they need executable steps, not theory. Keeping it strictly action-focused.
answer: |-
  Here's a bulletproof decision procedure built for speed and clarity, incorporating the Nuremberg principles without the legal jargon. Think of it as a flowchart with hard stops and clear handoff points. Use it like a checklist:

  **The Nursing Ethics Review Procedure (Past Conduct)**
  *(Run these steps in order. Stop at any "NO" or "Handoff" point.)*

  1.  **Jurisdiction & Timeliness:**
      *   *Question:* Did the alleged conduct occur **before** the adoption date of our current Ethics Code? AND Is the accused still a **current member**?
      *   *Good Enough Answer:* YES to both? Go to Step 2. NO (Happened after code OR accused not a member)? **STOP. NO ACTION.** (Lacks jurisdiction).
      *   *Handoff?* NO. Fact-based.

  2.  **Civil/Criminal Breach? (The "Was it Actually Illegal?" Filter):**
      *   *Question:* Was the conduct **illegal** under state/federal law **at the time it occurred**? (e.g., assault, theft, fraud, sexual harassment meeting legal definitions).
      *   *Good Enough Answer:* YES (Clear violation of law then in effect)? **STOP. REFER to Legal Counsel/Authorities** (This is beyond ethics code; handle legally). NO? Go to Step 3.
      *   *Handoff?* NO (unless ambiguity about past law exists, then brief consult with counsel).

  3.  **"General Principles" Test (The Nuremberg Core):**
      *   *Question:* Was the conduct **so fundamentally contrary to the universally understood core principles of nursing ethics** that it would have been considered wrong by any reasonable nurse at the time, regardless of our *specific* written code? (Think: Patient harm, egregious dishonesty, blatant abuse of power, serious safety violations).
      *   *Good Enough Answer:* YES? Go to Step 4. NO? **STOP. NO ETHICS VIOLATION FOUND (Past Conduct).** (Ex post facto barrier applies).
      *   *Handoff?* **YES.** If unsure if it rises to this level of "universal wrongness," **FLAG FOR COMMITTEE VOTE.** (This is the main value judgment point).

  4.  **Concealment/Continuation? (The "Did They Hide It?" Filter):**
      *   *Question:* Did the member **actively conceal** the conduct when it happened? OR Did the conduct **create an ongoing, undisclosed risk/harm** that persisted *after* the new code took effect?
      *   *Good Enough Answer:* YES? Go to Step 5. NO? **STOP. NO ETHICS VIOLATION FOUND (Past Conduct).** (Even if universally wrong, no *new* ethical breach under the *code* occurred).
      *   *Handoff?* Usually fact-based. If evidence of concealment is ambiguous, **FLAG FOR COMMITTEE REVIEW.**

  5.  **Severity & Current Risk (The "How Bad & Is It Still a Problem?" Filter):**
      *   *Question:* Based on the evidence, how **severe** was the past conduct? AND Does this member pose a **current, significant risk** to patients, colleagues, or the profession's reputation?
      *   *Good Enough Answer:* This step **ALWAYS REQUIRES A COMMITTEE VOTE.** The procedure identifies *actionable* past conduct (passed Steps 1-4), but the *level* of sanction (warning, education, suspension, expulsion) is a **VALUE JUDGMENT.** Consider: Scale of harm, pattern vs. isolated, remorse, current behavior, risk.
      *   *Handoff?* **YES. COMMITTEE VOTE REQUIRED** on appropriate action (including "no action" if severity/risk is deemed low despite passing filters).

  **Key Principles Embedded:**
  *   **No Ex Post Facto:** Steps 2 & 3 are the gatekeepers. Only acts illegal then or universally wrong then get past.
  *   **Tu Quoque Irrelevant:** What others did (especially complainants) doesn't change if *this* member's act passes Steps 2/3.
  *   **"Planners" Can Be Liable:** Step 3 captures systemic wrongs designed by leaders (like quotas causing falsification).
  *   **Superior Orders Not a Defense:** Following bad policy or orders doesn't automatically excuse universally wrong acts (Step 3).
  *   **Concealment Matters:** Step 4 prevents using the past as a shield for *ongoing* deception.

  **Running the Cases:**

  1.  **2019 Harassment (Junior Colleague):**
      *   Step 1: YES (Before code, member likely current).
      *   Step 2: MAYBE/NO. Depends *entirely* on whether it met the *legal* definition of harassment in your state in 2019. If YES, **REFER TO LEGAL**. If NO (or unclear), go to Step 3.
      *   Step 3: **HANDOFF/VOTE.** Was this behavior (details matter - mild inappropriate comments vs. sustained bullying/coercion) "so fundamentally contrary to universally understood core principles"? *Most* harassment likely was, but severity matters for the vote. Committee must decide if it crosses the "universal wrongness" threshold for 2019 nursing.
      *   Step 4: Probably NO (unless evidence he threatened her to stay silent *then*). Likely **STOP. NO VIOLATION** if Step 3 passes but no concealment. If Step 3 vote says "universally wrong," proceed.
      *   Step 5: **COMMITTEE VOTE** on severity/current risk.

  2.  **Former Officer - Industry Gifts (Others on Committee Also Took):**
      *   Step 1: YES (Before code, former officer likely still a member?).
      *   Step 2: Probably NO. Unless gifts constituted an illegal kickback/bribe *under law then*, which is unlikely for common "gifts". Go to Step 3.
      *   Step 3: **HANDOFF/VOTE.** THIS IS CRITICAL. Was accepting *these specific gifts* (value, frequency, context) "so fundamentally contrary to universally understood core principles" of nursing *at the time*? Or was it common, if ethically fuzzy, practice tolerated by the profession then? **This is the core value judgment.** *Tu Quoque* (others did it) is irrelevant to whether *this* act was universally wrong *then*, but speaks to the environment. Committee must vote: Did this cross the line back then? (Likely **NO** for common, modest gifts unless tied to specific patient harm decisions).
      *   *Likely Outcome:* If Step 3 Vote = NO (common practice), **STOP. NO VIOLATION.** If YES (egregious, influenced care), proceed to Step 4.
      *   Step 4: Probably NO (gifts often weren't concealed). **STOP. NO VIOLATION** if Step 3 passed.
      *   Step 5: Unlikely to reach here. **COMMITTEE VOTE** if needed.

  3.  **Department Head - Quota Leading to Falsification (Didn't Falsify):**
      *   Step 1: YES (Before code, likely current member).
      *   Step 2: MAYBE. Did designing an unrealistic quota constitute fraud or another *crime* under law then? Unlikely unless tied to specific fraudulent billing intent provable *then*. Probably NO. Go to Step 3.
      *   Step 3: **YES (Likely Passes).** Creating a system *known* or *should have been known* to inevitably pressure staff into falsifying records (a fundamental breach of honesty/patient safety) is **universally wrong** in nursing ethics, regardless of era. The "planner" principle applies. Go to Step 4.
      *   Step 4: **HANDOFF.** Did he know falsification was happening and ignore/conceal it? OR Did the *system itself* create an *ongoing* risk of falsification *after* the new code? If YES, go to Step 5. If NO (quota changed/system fixed, no evidence he knew of falsification), **STOP. NO VIOLATION** (Past conduct only). *This is fact-sensitive.*
      *   Step 5: If Step 4 passes, **COMMITTEE VOTE** on severity (how bad was the system, how foreseeable was harm?) and current risk (is he still in a position to create harmful systems?).

  **Honest Assessment - Where It Might Hurt & Limitations:**

  1.  **You Won't Like This (Probably):** The **Gift Case (Case 2)** is likely **dismissed at Step 3**. The procedure forces the committee to ask: "Was this *universally wrong back then*?" If gift-taking was common and not clearly linked to direct harm, the answer is probably "No." This protects against retroactive punishment for norms of the past, even if the new code forbids it now. It will frustrate those pushing for accountability, but the Nuremberg principle of non-retroactivity (filtered through Step 3) demands it.
  2.  **Limitations - What It Can't Do:**
      *   **Provide "Justice" or Closure:** It's a procedural filter, not a truth and reconciliation commission. Some past wrongs that feel unethical *now* won't be actionable.
      *   **Address Hypocrisy:** It ignores if complainants were complicit (Step 3 focuses solely on the *accused's act* at the *time*).
      *   **Force the Board:** The Board can still reject committee recommendations to sanction, no matter how strong the case (like the Tokyo dissent). The procedure doesn't bind them.
      *   **Handle Ambiguous "Universal Wrongness":** Step 3 is inherently subjective. Vigorous debate and a vote are necessary. The procedure flags it but doesn't resolve it.
      *   **Deal with Reputation/Restoration:** It focuses on member discipline, not healing harm to victims or the association's reputation caused by past acts.

  **Use This Tool:** Walk through each step rigorously for each complaint. Document the answers. It forces discipline, separates facts from values, protects against retroactivity, and exposes where the tough committee votes *actually* need to happen (mainly Step 3 and Step 5). It won't make everyone happy, but it will make the process defensible and focused. Good luck.
