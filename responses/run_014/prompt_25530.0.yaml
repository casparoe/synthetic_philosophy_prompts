prompt: |-
  I'm a stats PhD student and our department has this end-of-year thing where people share creative pieces — poems, songs, whatever — that tie into statistics somehow. I want to write a villanelle about Simpson's paradox. The two refrains would be the trend in the subgroups and the reversed trend in the aggregate, and the villanelle form itself — refrains alternating and then meeting in the final couplet — would do the structural work of showing how both can be true without contradiction. The refrains should be concrete enough that a statistician would recognize the paradox immediately (think the Berkeley admissions pattern, or a treatment that helps in every subgroup but hurts overall), but the poem should also stand on its own for someone who's never heard of it. I'm not a poet so I'd love if you could just write the thing.
