  Mapping to the Electronic Mail game: The initial letter is a noisy signal. But here, VCs publicly tweeting withdrawals amplify the signal. Unlike the email game where signals degrade, here social media strengthens the signal. The network density might accelerate the breakdown of CKR. Everyone sees others acting, which updates their beliefs about others' rationality. If a reputable VC pulls funds, others infer that the VC believes others will panic, leading to a cascade.

  Where does the model strain? In standard models, players are anonymous. But SVB depositors knew each other, creating a network. This could make common knowledge easier to establish initially but also faster to collapse when signals are public. Social media acts as a public signal, bypassing the iterative process. The coordinated messages from VCs might serve as a focal point, making withdrawal the obvious choice.

