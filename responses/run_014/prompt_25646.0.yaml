answer: |-
  Here's a breakdown of the SVB run through the lens of common knowledge of rationality (CKR), mapping key moments to formal structures and identifying where the model strains:

  **Core Framework: Bank Runs as Coordination Games**
  - **Players**: SVB depositors (VCs, founders, corporate treasuries)
  - **Actions**: *Withdraw* or *Leave* deposits
  - **Payoffs**:
    - If bank is solvent: *Leave* > *Withdraw* (avoid penalty/earn interest)
    - If bank is insolvent: *Withdraw* > *Leave* (avoid loss)
    - **Critical feature**: Payoff for *Withdraw* depends on *when* you withdraw. Late withdrawers may get nothing.
  - **Information Problem**: True solvency is opaque. Actions reveal beliefs.

  **Breakdown of CKR: Key Moments Mapped to Epistemic Hierarchy**

  1. **March 8: CEO Letter (Signal θ₁ - "Troubled but Survivable")**
     - *Signal*: Announcement of $1.8B loss on bond sales + emergency capital raise.
     - *Epistemic Effect*: 
       - Level 0: Depositors now know SVB has unrealized losses.
       - Level 1: Depositors know *others* know about losses.
       - **CKR Intact?** Yes. Rational depositors might still believe SVB is fundamentally solvent (long-term assets > liabilities). Leaving funds remains optimal *if others do too*.

  2. **March 9 AM: VC Advisory Emails/Tweets (Signal θ₂ - "Others Are Panicking")**
     - *Signal*: Coordinated VC messages (e.g., Founders Fund, Coatue) urging portfolio companies to withdraw.
     - *Epistemic Effect*:
       - Level 2: Depositors now know *others know that others* are aware of trouble.
       - **CKR Breaks Here**: 
         - Depositor A thinks: "I'm rational (I know SVB might be solvent), but *other rational VCs are withdrawing*. They must believe others will withdraw too. If they believe that, waiting is irrational."
         - This is a **Higher-Order Belief Shift**: Each depositor now believes others' rationality will lead *them* to panic, making panic individually rational. The Nash equilibrium flips from (Leave, Leave) to (Withdraw, Withdraw).

  3. **March 9 PM: Social Media Cascade (Signal θ₃ - "Run is Inevitable")**
     - *Signal*: Real-time Twitter updates on withdrawal queues, Slack screenshots, liquidity warnings.
     - *Epistemic Effect*:
       - **Common Knowledge of Panic Achieved**: 
         - Level k → ∞: Everyone knows everyone sees the run happening. 
         - Depositor B thinks: "Even if *I* believe SVB is solvent, I know rational actors *know* others are withdrawing. They *must* withdraw to avoid being last. Therefore, I must withdraw."

  **Formal Mapping: Global Games with Networked Signals**
  - **Model**: Modified Global Game of Bank Runs (Carlsson & van Damme, 1993)
  - **Players**: Continuum of depositors
  - **True State**: SVB asset quality θ (unobservable)
  - **Private Signals**: *None* (crucial departure from standard model). Instead:
  - **Public Signals**: 
    - θ₁: CEO letter → noisy signal of θ (high variance)
    - θ₂: VC advisories → **coordination signal** that others received θ₁ *and* are acting
  - **Payoffs**: As above, with strategic complementarity
  - **Equilibrium Shift**: 
    - Pre-θ₂: Unique equilibrium "Leave" if θ > θ* (solvency threshold)
    - Post-θ₂: Unique equilibrium "Withdraw" for *all* θ, because signal θ₂ makes depositors believe others believe θ < θ*

  **Where the Model Strains: Networks & Coordination**

  1. **Non-Anonymity & Pre-Coordination**:
     - Standard models assume anonymous players. SVB's depositors were densely networked (VCs, founders, shared Slack groups). This *accelerates* the collapse of CKR:
       - **Easier to Shatter CKR**: A single tweet from @pmarca (Marc Andreessen) reaches all relevant players instantly, creating **de facto common knowledge**. Network density replaces infinite recursion with instant Level k→∞.
       - **Pre-Play Coordination**: VC emails acted as **correlated devices** – effectively telling players: "We will all play Withdraw at 9:00 AM." This bypasses epistemic uncertainty.

  2. **Social Media as Epistemic Accelerant**:
     - Public tweets transformed private withdrawal decisions into **real-time common knowledge of actions**. This violates the standard assumption that players infer beliefs only from aggregates. Players *saw* the run happening, eliminating higher-order uncertainty.

  3. **Rationality of Panic**:
     - In standard models, "panic" is rational equilibrium play. But VCs *knew* their advisories would trigger a run:
       - VC payoff: Protecting portfolio > SVB stability (a prisoner's dilemma across the ecosystem)
       - This **strategic pessimism** isn't "irrational panic" – it's rational given network effects. The model holds, but payoffs include *externalities* beyond the bank.

  **Theoretical Implications: Vindication & Challenges**
  - **Vindication**: 
    - The run exploded precisely when higher-order beliefs flipped (post-θ₂), aligning with global game predictions.
    - Once withdrawal signals became public/common knowledge, the (Withdraw, Withdraw) equilibrium dominated irreversibly.

  - **Challenges**:
    1. **Coordinated Signals Break "Noise" Assumptions**: Standard global games rely on noisy *private* signals to prevent coordination. VC advisories were public, low-noise coordination devices.
    2. **Networked Payoffs**: VCs internalized that *their* withdrawal advice increased systemic risk but protected *their* portfolios. This added a layer of **meta-coordination** absent in standard models.
    3. **Speed of Higher-Order Belief Collapse**: Social media compressed epistemic hierarchies from days to minutes. Models assuming gradual belief updating (e.g., email game) don't capture this.

  **Teaching Takeaways**:
  1. SVB is a near-textbook example of how CKR collapse flips equilibria, but with networked coordination replacing anonymous depositors.
  2. Social media acts as a **common knowledge engine**, making bank runs faster and harder to stop.
  3. Rationality ≠ truth-seeking: Depositors acted rationally *given their beliefs about others*, even if SVB was fundamentally solvent (as later bailouts suggested).
  4. **Extension Idea**: Model VC advisories as "correlation devices" (Aumann 1974) that align expectations, transforming a global game into a coordination game with a focal point.

  The SVB run affirms epistemic game theory's core insight – that beliefs about others' beliefs drive behavior – but forces us to incorporate networked communication and intentional coordination into modern applications. The "rational panic" was perfectly rational *because* the network made common knowledge of collective action instantaneous.
