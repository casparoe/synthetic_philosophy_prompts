  The exposed forgeries are tricky - they have negative provenance but might still hold value as artifacts of remarkable skill. The museum pieces are a whole different level: they're functionally "real" now through institutional acceptance, but knowing they're fakes creates moral weight. 

  Hmm... the user might be underestimating how dangerous that secret is. If they reveal it, they could destroy museum reputations and art market stability. But keeping quiet feels dishonest. There's also potential guilt about profiting from fraud, even posthumously.

  I should consider all stakeholders: museums (reputation), art historians (scholarship), buyers (market trust), and the user's own conscience. The uncle's skill deserves recognition somehow - maybe through an anonymous donation to a forgery study collection? That could separate his technical mastery from the deception.

  For the exposed works, the market already knows they're fake, so selling as "ex-forgery with provenance" seems viable. The museum-attributed pieces... that's the nuclear option. Maybe suggest legal counsel before any disclosure. 

