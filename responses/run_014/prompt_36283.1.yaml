  I notice the user mentions their philosophy colleagues get "visibly annoyed" when economists declare the puzzle "solved." That emotional response is telling - it suggests the economists might be missing some normative dimension the philosophers consider essential. The user's own hypothesis about explaining behavior versus explaining the phenomenon feels like it's getting warm.

