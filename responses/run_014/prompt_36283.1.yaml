  Then there's the explanatory goals: economists are showing how such behavior can emerge from consistent preferences, while philosophers are probing the conditions for responsible agency. The user's suspicion about normative commitments seems spot-on - the philosophers likely see the economists as engaged in descriptive reductionism that bypasses the core question of rational accountability.

