  ### Final Thoughts: A Small Set of Principles
  To summarize, you can distinguish coherent supertasks from incoherent ones using three principles:
  1. **Convergence to a limit**: The state must approach a well-defined value (e.g., Achilles' position, π's digits). This handles cases 1–4 and 2 vs. 3.
  2. **Logical consistency**: The task description must not create contradictions or circular dependencies (e.g., Bernadete's walls). This handles case 5.
  3. **Physical realizability**: The actions must not require unbounded resources (e.g., minimum time per decision). This handles case 6.

  For most supertasks, convergence is the key divider. Cases like Bernadete's walls show that convergence presupposes consistency—if a task is logically flawed, convergence is moot. Physical realizability is only critical when actions have irreducible constraints. If you encounter a new supertask, check:
  - Is the description logically consistent? (If not, it's contradictory like case 5.)
  - If consistent, does the state converge? (If not, it's undefined like cases 2 and 4.)
  - If it converges, is it physically realizable? (If not, it's impossible like case 6; if yes, it's coherent like cases 1 and 3.)

