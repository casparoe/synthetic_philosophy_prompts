prompt: |-
  I teach a philosophy of language course, and one of the things that reliably puzzles my students is the relationship between what a sentence means and what a speaker means by uttering it — the Gricean distinction, roughly, between sentence meaning and speaker meaning. I want to bring this to life by examining a concrete legal practice, and I'd like you to help me think through what that practice presupposes.

  Here is the practice. In American perjury law, there is a well-known doctrine — call it the literal-truth defense — according to which a witness cannot be convicted of perjury if the statement they made under oath was literally true, even if they intended to mislead the questioner and succeeded in doing so. A witness who is asked "Did you ever meet with Mr. X?" and answers "I have never been in the same room as Mr. X," when in fact they met Mr. X outdoors in a park, has not committed perjury: the statement, taken literally, is true. The witness's communicative intention — to convey that no meeting occurred — is irrelevant to criminal liability, so long as the words themselves, read in their most narrow and uncharitable sense, correspond to the facts.

  Now compare this with how the same legal system handles fraud, contract interpretation, and defamation. In fraud cases, a literally true statement can still be actionable if it was crafted to create a false impression in the mind of a reasonable hearer. In contract law, courts routinely interpret terms by asking what a reasonable person in the position of the parties would have understood them to mean, not by parsing the text as though it were a logical formula. In defamation, the "substantial truth" doctrine protects a defendant whose statement was true in gist even if literally inaccurate in some detail — the mirror image of perjury's rule.

  So we have an asymmetry: in perjury, the law treats sentence meaning (narrowly construed) as the thing that matters for criminal liability; in fraud, contract, and defamation, the law treats speaker meaning, or at least the meaning a reasonable hearer would recover, as what matters. The same words, spoken with the same communicative intention, can be legally innocuous in one context and legally culpable in another, depending entirely on which doctrine applies.

  What I want you to do is reconstruct the implicit theory of linguistic communication — and the implicit theory of what makes a statement an assertion, a representation, or a communicative act — that this asymmetry presupposes. Specifically:

  1. What view of the relationship between sentence meaning and speaker meaning does the perjury rule presuppose, and what view do the fraud and contract rules presuppose? Are these views consistent with each other, or does the legal system tacitly endorse incompatible theories of meaning depending on the context?

  2. Is there a principled way to reconcile the asymmetry? For instance, one might argue that perjury is about the oath — a promise to tell the truth, where "the truth" is understood as sentence-truth — while fraud is about the relationship between two parties, where what matters is the reasonable expectations each creates in the other. Does that distinction hold up under scrutiny, or does it merely redescribe the asymmetry without justifying it?

  3. What would have to change in perjury law if we adopted a thoroughly Gricean view, on which what a speaker means is primary and sentence meaning is merely a piece of evidence the hearer uses to recover it? And conversely, what would have to change in fraud law if we adopted the perjury rule's apparent commitment to sentence meaning as the sole locus of truth and falsity?

  4. Finally, is there a coherent philosophical position according to which the asymmetry is exactly right — that is, a position that gives sentence meaning a privileged role in one kind of legal context and speaker meaning a privileged role in another, without contradiction? If so, what is it, and what broader view of language and responsibility does it commit one to?
reasoning: |-
  Okay, this is a fascinating and complex question about legal philosophy and linguistics. The professor is teaching philosophy of language and wants to explore the Gricean distinction between sentence meaning and speaker meaning through concrete legal asymmetries. This is brilliant pedagogy - using perjury law's literal-truth defense versus fraud/contract/defamation's focus on reasonable interpretation makes the abstract concrete.

  First, I need to fully grasp the asymmetry they've described. In perjury cases, the law seems hyper-focused on the narrowest possible semantic interpretation of words, completely disregarding communicative intent. That witness example about meeting outdoors is perfect - it shows how truth is reduced to technical correspondence with reality. But then in fraud, the exact same verbal behavior could be illegal if it creates a false impression. The mirror image in defamation's "substantial truth" doctrine is particularly striking.

  Hmm, the core tension seems to be between two different conceptions of truth in language: one where meaning resides purely in conventional word-world relationships (perjury), and another where meaning emerges from contextual, intentional communication (fraud/contract). The professor's questions push toward examining whether this is a coherent philosophical position or just historical accident.

  For question 1, the presuppositions seem clear: Perjury law assumes a rigidly formalist semantics where sentences have context-free truth conditions. Fraud/contract assume a pragmatic, intention-based view where meaning is co-created in communication. These views feel fundamentally incompatible - one denies what the other affirms about how language works.

  But maybe there's a deeper consistency? The professor's suggestion about the oath being key resonates. When you swear "to tell the truth," it might implicitly mean "the truth as verifiable by your words alone," making it a speech act with unique constraints. Whereas fraud deals with relational harm from deceptive impressions. This distinction could hold if we view legal contexts as creating different normative frameworks.

  For question 3, applying Grice to perjury would be revolutionary - we'd have to prosecute successful misleading implications. But proving intent becomes nightmarish. Conversely, making fraud require literal falsity would gut consumer protection laws. The "reasonable hearer" standard does heavy lifting here.

  The toughest is question 4: is there a coherent philosophy justifying both? Maybe a Wittgensteinian "meaning as use" approach where language games determine rules - the courtroom oath creates one game, commercial transactions another. But this risks circularity. A better path might be through different values at stake: perjury protects oath-sanctity and witness autonomy (you only control your words, not interpretations), while fraud protects relational trust.

  Throughout, I should emphasize how this exposes students to meta-questions: Is "what words mean" something fixed or negotiated? Can responsibility attach to interpretations beyond one's control? The legal asymmetry brilliantly surfaces how our ordinary language intuitions are actually deeply conflicted about this.
answer: |-
  This legal asymmetry reveals a fascinating and philosophically rich tension in how the law conceptualizes language. Let's reconstruct the implicit theories step by step:

  ### 1. **Presupposed Views of Meaning**
     - **Perjury Rule (Literal Truth Defense):**  
       Presupposes a **formalist/semantic view** of meaning:
       - Sentence meaning is determinate, context-independent, and derived solely from conventional linguistic rules.
       - Truth/falsity is evaluated by strict correspondence between *words* and *facts*.
       - Speaker intention is irrelevant. The law treats language as a code with fixed boundaries.
       - *Implicit theory:* Language is a static system where meaning resides in the text itself. The speaker's responsibility ends at uttering words that "match" reality.

     - **Fraud/Contract/Defamation Rules:**  
       Presuppose a **pragmatic/intentionalist view**:
       - Meaning arises from context, speaker intention, and reasonable hearer interpretation.
       - Truth/falsity depends on the *communicative effect* (e.g., "false impression" in fraud, "gist" in defamation).
       - Speaker responsibility extends to foreseeable interpretations by a reasonable audience.
       - *Implicit theory:* Language is a dynamic social practice. Meaning is co-constructed through shared norms and contextual cues.

     - **Consistency?**  
       These views are **incompatible at the theoretical level**. The perjury rule treats sentence meaning as self-sufficient; the fraud rule treats it as merely one input into speaker meaning. Legally, however, the inconsistency is *managed* by partitioning contexts:  
       - **Oath-bound contexts** (court testimony) demand textual precision to protect witnesses from interpretive overreach.  
       - **Transactional contexts** (contracts/fraud) prioritize relational fairness and reasonable expectations.  

  ---

  ### 2. **A Principled Reconciliation?**  
  The "oath vs. relationship" distinction holds some merit but needs refinement:  
     - **Perjury's Unique Stakes:**  
       - The oath creates a **metalinguistic promise**: "I vow that *these words* correspond to reality."  
       - Legal process integrity requires **adversarial testing**: Lawyers can probe ambiguities, but witnesses aren’t liable for uncharitable inferences.  
       - *Justification:* Prevents chilling witness testimony and prosecutorial overreach based on inferred intent.  

     - **Fraud/Contract’s Relational Nature:**  
       - These involve **reliance interests**. Liability attaches to *inducing harmful reliance* through deliberate implication.  
       - *Justification:* Protects vulnerable parties (e.g., consumers, contracting partners) from deceptive practices that exploit contextual norms.  

     - **Scrutiny:**  
       This distinction redresses power imbalances:  
       - In court, the state has power to cross-examine; outside court, parties may lack that recourse.  
       - But it doesn’t resolve the *philosophical* tension—it merely reflects policy trade-offs (certainty vs. equity).  

  ---

  ### 3. **What If We Switched Theories?**  
     - **Gricean Perjury Law:**  
       - Prosecutions would target *successful misleading* (e.g., the park-meeting witness).  
       - Problems:  
         - **Proof burdens:** How to demonstrate intent to mislead beyond reasonable doubt?  
         - **Chilling effect:** Witnesses might refuse to testify for fear of misinterpreted implications.  
         - **Adversarial fairness:** Lawyers could weaponize ambiguous questioning.  

     - **Literalist Fraud Law:**  
       - Only *explicit falsehoods* would be actionable (e.g., "This house has no mold" when it does).  
       - Problems:  
         - **Evasion:** Fraudsters would exploit implicature ("I’ve never *seen* mold here" → implies none exists).  
         - **Inequity:** "Buyer beware" would override reasonable reliance on contextual cues.  
         - **Efficiency:** Courts would drown in disputes over semantic minutiae.  

  ---

  ### 4. **A Coherent Philosophical Position**  
  Yes—a **pragmatic dualism** rooted in **speech act theory** and **normative context**:  
     - **Core Thesis:**  
       The *purpose* of the speech act determines which meaning matters.  
       - **Perjury:** An **institutional act** (oath-taking) bound by formal rules. Here, language functions as a *verification mechanism*. Sentence meaning is privileged to ensure precise, contestable claims.  
       - **Fraud/Contract:** **Relational acts** aimed at inducing reliance. Language functions as a *tool for coordination*. Speaker/hearer meaning is privileged to uphold trust in communication.  

     - **Broader Commitments:**  
       - **Language as multi-functional:** Meaning isn’t monolithic; it serves different roles (e.g., truth-bearing vs. action-guiding).  
       - **Responsibility as context-relative:**  
         - In oath contexts, you’re responsible for *word choice*.  
         In relational contexts, you’re responsible for *communicative effects*.  
       - **Legal morality:** The law reflects a pluralistic view:  
         - **Courtroom:** Values procedural fairness (exact language allows cross-examination).  
         - **Marketplace:** Values substantive fairness (reasonable expectations protect social cooperation).  

     - **Philosophical Anchors:**  
       - **Austin/Searle on speech acts:** Perjury is a *verdictive* act (judging facts); fraud is an *exercitive* act (influencing others).  
       - **Brandom on normative pragmatics:** Legal contexts create distinct "deontic scorekeeping" rules.  
       - **Weinrib on legal formality:** Perjury’s literalism preserves the "internal morality" of adjudication.  

  ---

  ### Pedagogical Implications  
  This asymmetry brilliantly illustrates how **law operationalizes philosophy**. It forces students to confront:  
  - The gap between semantic theories (e.g., formal semantics vs. pragmatics) and their real-world consequences.  
  - How institutions "fix" meaning to serve social goals (certainty in trials; equity in commerce).  
  - Whether our intuitions about linguistic responsibility are context-dependent—and why that might be defensible.  

  This could spark debates on whether the law *resolves* or merely *paper over* philosophical tensions. For deeper study, consider cases like *Bronston v. U.S.* (1973), which cemented the literal-truth defense, or fraud doctrines like "lie in ambush" that target implied falsehoods.
