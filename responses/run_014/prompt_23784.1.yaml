answer: |-
  This is a profound tangle where finance, philosophy, and decision theory collide. Let's dissect the presuppositions and implications of Kelly betting as defended by its practitioners:

  **Core Presupposition: Rationality is Defined by Long-Term Growth Rate Maximization**

  Practitioners like Ed Thorp defend Kelly betting **not primarily on utility grounds, but on the axiomatic principle that maximizing the long-term geometric growth rate of capital is the rational objective for repeated, reinvested bets.** This presupposes:

  1.  **The Primacy of the Time-Average (Path-Dependence):** Rationality is judged by the outcome of a *single capital trajectory* evolving through sequential bets over time. Ergodicity (or lack thereof) is central. The ensemble average (average outcome across many parallel universes/bettors at a single point in time) is irrelevant if you only live one life/path.
  2.  **Capital as the Fundamental Quantity:** Wealth compounds multiplicatively (geometrically), not additively. The *fraction* of bankroll bet matters intrinsically because gains/losses scale with current wealth.
  3.  **Repeated Opportunities:** The strategy assumes a long sequence of similar, independent betting opportunities where winnings are fully reinvested. The "long run" isn't an approximation; it's the fundamental domain of evaluation.
  4.  **Bankruptcy as Catastrophic:** Losing one's entire bankroll is an absorbing state with terminal consequences (game over), making avoidance of ruin paramount, even if the probability is small under naive EV maximization.

  **Samuelson vs. Peters/Garrabrant: Who Needs Justifying?**

  *   **Samuelson ("Log Utility in Disguise"):** He argued rigorously that maximizing the expected logarithm of terminal wealth (which Kelly does) *is equivalent* to maximizing expected utility for an agent with a logarithmic utility function (U(W) = log W). For him, Kelly is *just* a special case of Expected Utility Theory (EUT). He saw the "long-run growth" argument as a misleading heuristic obscuring the underlying risk preference (log utility implies extreme risk aversion for large losses relative to gains).
      *   **Presupposition:** Rational choice *must* conform to the axioms of EUT (completeness, transitivity, independence, continuity). Any deviation is irrational or reveals a specific utility function.
  *   **Peters ("Ensemble Average Needs Justifying"):** Peters argues that applying the ensemble average (expected value) to a single time-evolving system (like an individual's wealth) is often invalid due to non-ergodicity. The ensemble average can diverge wildly from the time-average growth rate, especially in multiplicative processes with risk of ruin. For Peters, the time-average growth rate is the *fundamentally rational* objective for an individual facing repeated multiplicative gambles. EUT, when applied naively using ensemble averages, can prescribe strategies (like constant all-in) that are demonstrably ruinous for the individual over time.
      *   **Presupposition:** Rationality must account for the dynamics of a single path through time. Non-ergodic processes invalidate naive application of ensemble statistics. Long-term survival and growth are paramount.
  *   **Garrabrant ("Geometric Rationality"):** Garrabrant formalizes the intuition behind Kelly and Peters. He argues that for multiplicative processes (like reinvested wealth), rational agents should reason *geometrically* (in terms of *factors* or *multiples* of wealth) rather than *arithmetically* (in terms of absolute gains/losses). He explicitly shows this framework can violate standard EUT axioms (like Independence) but argues these axioms are inappropriate for the multiplicative domain. Geometric rationality prioritizes avoiding multiplicative disasters (ruin) and maximizing multiplicative gains.
      *   **Presupposition:** The structure of the decision problem (multiplicative dynamics) dictates the appropriate rationality framework. Standard EUT axioms are domain-specific (largely additive) and need generalization for multiplicative contexts. Rationality is domain-relative.

  **Answering Your Questions:**

  1.  **What does Kelly presuppose?** It presupposes that rational choice under repeated, multiplicative risk is fundamentally about maximizing the long-term geometric growth rate of a *single* evolving bankroll. This prioritizes path-dependence, survival, and multiplicative compounding over static ensemble averages and additive reasoning.
  2.  **Samuelson vs. Peters/Garrabrant?**
      *   **Samuelson is *formally* correct:** Mathematically, Kelly *does* maximize E[log(W)]. If you accept EUT axioms and happen to have log utility, Kelly is optimal.
      *   **Practitioners/Peters/Garrabrant are *conceptually* challenging:** They argue that for an individual facing repeated bets, the EUT framework with ensemble averages is the *wrong starting point*. Log utility isn't an arbitrary preference; it's the *consequence* of rationally prioritizing long-term multiplicative growth within a single trajectory. Peters/Garrabrant provide frameworks where Kelly emerges as rational *without* presupposing EUT or a specific utility function, but by redefining rationality for the domain. **Kelly betting, defended as long-term growth maximization, implicitly rejects the universal applicability of EUT axioms to this domain and presupposes that time-average growth is the primary rational objective.** It *needs* Peters's ergodicity argument or Garrabrant's geometric framework to coherently defend itself against Samuelson's charge of being "just log utility" and to justify why EUT's prescriptions (like all-in) are irrational *in this specific context*.
  3.  **Is Samuelson Right? Implications:** Samuelson is correct *within the EUT framework*. If you firmly believe EUT axioms *must* define rationality universally, then Kelly is only rational for log utility agents. **However, this doesn't mean non-log agents are "betting wrong" by using Kelly *in this specific context*.** If their true goal *is* maximizing long-term compounded growth (a common, practical goal for gamblers/investors with repeated opportunities), then Kelly *is* the correct strategy to achieve that goal, regardless of their abstract utility function over static wealth distributions. The "wrongness" only arises if their *true objective* is something else (e.g., maximizing expected wealth at a specific horizon while accepting high ruin risk, or minimizing short-term volatility).
  4.  **Does "Half Kelly" Smuggle in Risk-Aversion?** **Partially, but not simply.** Practitioners use fractional Kelly (like 1/2) for two main reasons:
      *   **Uncertainty in Edge/Model Risk:** The primary reason. Kelly is highly sensitive to the estimated edge. Betting full Kelly requires near-perfect knowledge of the true probabilities. If your edge estimate is uncertain or your model is imperfect (almost always true), betting full Kelly exposes you to massive overbetting risk. Half-Kelly is a robust heuristic to protect against estimation error. This is about *epistemic humility*, not inherent risk preference.
      *   **Reducing Volatility:** While long-term growth is maximized by full Kelly, the path can be extremely volatile. Fractional Kelly significantly reduces drawdowns and volatility while sacrificing only a portion of the potential growth. This *does* appeal to risk aversion in the conventional sense (dislike of volatility/ruin risk), *even if* the long-term growth goal remains paramount. **Does it undercut the pitch?** Not entirely. The core defense – "we maximize long-term growth *given our knowledge and constraints*" – remains. Fractional Kelly is often seen as a necessary *practical* adjustment to achieve the *core objective* under real-world uncertainty and psychological/practical constraints (e.g., investors might panic and withdraw during deep drawdowns). It acknowledges that pure Kelly is fragile without perfect information.
  5.  **Does the Dispute Change Betting Practice?** **Almost never.** The actual fraction calculated (f* = (bp - q)/b or f* = edge/odds) is the same whether derived from:
      *   Maximizing E[log(W)] (Samuelson)
      *   Maximizing long-term growth rate (Practitioners)
      *   Ergodicity economics (Peters)
      *   Geometric rationality (Garrabrant)
      *   Minimizing the time to reach a wealth goal (another valid interpretation)

      The philosophical dispute is about *why* this fraction is rational, not about *what* the fraction is. Quant shops and gamblers will keep calculating `f* = edge / odds` regardless of whether they justify it as log utility or geometric growth maximization. The practical implications arise in edge estimation, uncertainty handling (fractional Kelly), and defining the bankroll – areas where the different justifications might subtly influence *how* uncertainty is quantified, but not the core Kelly formula itself.

  **Conclusion:** Kelly betting, defended by practitioners as long-term growth maximization, presupposes that rationality for repeated, multiplicative decisions is fundamentally about optimizing the time-average growth trajectory of a single bankroll, prioritizing survival and compounding. This directly challenges the universality of Expected Utility Theory and its reliance on ensemble averages. While Samuelson is formally correct that it's equivalent to log utility within EUT, Peters and Garrabrant provide crucial frameworks justifying why the time-average perspective is more fundamentally rational in this domain. Fractional Kelly primarily addresses epistemic uncertainty, though it also dampens volatility. Ultimately, the philosophical debate provides different lenses for understanding the *same* optimal betting fraction, which remains the practical cornerstone for professionals focused on compounded growth over time. The numbers stay the same; the story behind their rationality evolves.
