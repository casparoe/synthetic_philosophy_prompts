  ### Translation of Fitch's Knowability Paradox into Programming-Language Concepts  
  Fitch's paradox demonstrates that if all truths are knowable (i.e., possibly known), then all truths must be known. We'll reframe this using computational concepts: self-reference, fixed-point combinators, and halting-problem-style diagonalization. The core idea is to treat the knowledge operator \(K\) as a function that can inspect its own behavior, leading to a fixed-point collapse.

  #### Key Elements of the Paradox  
  1. **Knowability Principle**: Every truth is knowable: \(\forall p. (p \implies \diamond K p)\).  
     - **Computational analog**: "Every true proposition can be learned by some computable process."  
  2. **Counterexample Construction**: For an arbitrary proposition \(p\), define:  
     \[
     \varphi \equiv p \land \neg K p
     \]  
     \(\varphi\) asserts "\(p\) is true but not currently known." If there exists an unknown truth, \(\varphi\) is a candidate.  
  3. **Reductio ad Absurdum**:  
     - Assume \(\varphi\) is true (i.e., \(p\) is true and unknown).  
     - By knowability, \(\varphi\) is knowable: \(\diamond K \varphi\).  
     - If \(K \varphi\) holds, then:  
       - \(K(p \land \neg K p)\) (by substitution)  
       - \(K p \land K(\neg K p)\) (by distribution of \(K\) over \(\land\))  
       - \(K p \land \neg K p\) (by factivity: \(K(\neg K p) \implies \neg K p\))  
     - Contradiction: \(K p \land \neg K p\).  
  4. **Conclusion**: \(\varphi\) cannot be true, so \(p \implies K p\) for all \(p\). All truths are known.  

