  ### Computational Translation  
  #### Setup: Language and Operators  
  - **Propositions as Programs**: Treat propositions as programs that output a truth value (e.g., `Prop ::= Bool | K(Prop) | ...`).  
  - **Knowledge Operator \(K\)**: A function `K : Prop -> Bool` satisfying:  
    - **Factivity (Truth Axiom)**: `K(p) => p` (if `K` returns `True` for `p`, then `p` is true).  
    - **Distribution over \(\land\)**: `K(p ∧ q) => K(p) ∧ K(q)`.  
  - **Knowability \(\diamond K\)**: Interpreted as:  
    \[
    \diamond K p \equiv \text{there exists a computable function } f \text{ such that } f(p) = \text{True}.  
    \]  
    Here, \(f\) is a decision procedure (Turing machine) that correctly decides \(p\).  

  #### Counterexample Construction: Self-Referential Proposition  
  Define \(\varphi\) using a fixed-point combinator to force self-reference:  
  ```haskell  
  -- Pseudo-Haskell with a fixed-point operator  
  type Prop = Bool  -- Simplified for exposition; in reality, Prop supports self-reference.  

  -- Fixed-point combinator for self-referential propositions  
  fix :: (Prop -> Prop) -> Prop  
  fix f = let φ = f φ in φ  -- Quine-style self-application  

  -- Counterexample: φ = p ∧ ¬K(φ)  
  -- But p is arbitrary; we need φ to depend on its own "knowledge state".  
  -- Instead, define a generator F:  
  F :: (Prop -> Prop) -> Prop -> Prop  
  F self p = p ∧ not (K (self p))  

  -- The counterexample is the fixed point of F:  
  φ :: Prop  
  φ = fix (F id)  -- φ = F φ = p ∧ ¬K(φ)  
  ```  
  In practice, \(\varphi\) is akin to a quine that says: "This proposition is not known." The fixed-point combinator allows \(\varphi\) to reference itself in the knowledge operator.  

  #### Reductio as Halting-Problem-Style Diagonalization  
  1. **Assume \(\varphi\) is true and effectively knowable**:  
     - \(\varphi \equiv p \land \neg K \varphi\) is true.  
     - Knowability \(\implies \exists\) a computable function `f` that correctly outputs `True` for \(\varphi\).  
  2. **Run \(f\) on \(\varphi\)**:  
     - If `f(φ) = True` (i.e., \(K \varphi\)), then:  
       - By factivity, \(\varphi\) is true: `p ∧ ¬K φ` holds.  
       - By distribution, `f` must output `True` for both `p` and `¬K φ`.  
       - But `f(¬K φ) = True` implies (by factivity) `¬K φ` is true.  
     - Thus, `K φ` (output of `f`) and `¬K φ` (from \(\varphi\)) contradict.  
  3. **Contradiction**:  
     - If `f` exists, it must output `True` for \(\varphi\) when \(\varphi\) is true, but this leads to `K φ ∧ ¬K φ`.  
     - No such `f` can exist, so \(\varphi\) is not effectively knowable.  
  4. **Collapse**:  
     - Since \(\varphi\) is true but not knowable, the knowability principle fails for \(\varphi\).  
     - Thus, the initial assumption (that an unknown truth exists) is false: \(\forall p. p \implies K p\).  

  #### Residue Report: Faithfulness and Distortions  
  | **Aspect** | **Mapping to Computation** | **Residue/Distortion** |  
  |------------|----------------------------|------------------------|  
  | **Self-referential \(\varphi\)** | Clean: Fixed-point combinators directly encode self-reference (e.g., `fix` in Haskell). | None. This is a direct analogy to quines/recursion. |  
  | **Knowledge operator \(K\)** | Clean: `K` is a function on propositions. Factivity is a type-like invariant (`K(p) ⇒ p`). | Partial: In computation, `K` must be computable, but in Fitch, `K` is idealized. Distortion arises when we enforce effectivity (see below). |  
  | **Reductio argument** | Clean: Contradiction mirrors undecidability proofs (e.g., halting problem). Assume a decider `f` exists, then show `f` fails on a self-referential input. | None for the logical structure. The computational version is faithful. |  
  | **Knowability \(\diamond K\)** | Partial: Interpreted as "decidable by a Turing machine." | **Major distortion**: In Fitch, \(\diamond K\) is modal (possibly known by an ideal agent). Computationally, this becomes "effectively decidable," which is weaker. This changes the outcome (see below). |  
  | **Epistemic elements** | Knowledge states as recursive functions. | **Residue**: The gap between truth and knowledge involves time/state. Computational `K` is static; Fitch's `K` can evolve across states. No direct counterpart to "agent knowing its own state" in recursion. |  

