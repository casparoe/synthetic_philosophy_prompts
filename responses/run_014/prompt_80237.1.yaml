  ### Addressing Your Specific Queries  
  #### 1. Modal Logic Requirements  
  Fitch's proof **only requires KT (normal modal logic with factivity)**, not S5.  
  - **Truth Axiom (Kp → p)**: Essential (factivity).  
  - **Distribution (K(p ∧ q) → Kp ∧ Kq)**: Essential.  
  - **No S5 needed**: Positive introspection (KKp → Kp) and negative introspection are irrelevant.  
  - **Impact on Translation**:  
    - In computation, factivity is a precondition (like a type invariant), and distribution is structural recursion.  
    - No change to the paradox; self-reference doesn't require introspection.  

  #### 2. Effective Knowability (Turing Machines)  
  If "knowable" means **effectively decidable by a Turing machine**:  
  - **The paradox breaks down**.  
  - **Why?**  
    - The counterexample \(\varphi \equiv p \land \neg K \varphi\) is **not effectively knowable**.  
    - For \(\varphi\) to be decidable, \(K\) must compute its own knowledge of \(\varphi\)—a self-referential task that violates the halting problem.  
  - **Explicit reasoning**:  
    - Assume \(\varphi\) is true. Knowability demands a TM \(f\) that outputs `True` for \(\varphi\).  
    - Running \(f\) on \(\varphi\) requires \(f\) to evaluate \(K \varphi\). But \(K \varphi\) depends on \(f(\varphi)\), creating a recursive loop:  
      ```python  
      def f(φ):  
          # To compute K(φ), I need to check if f(φ) = True...  
          return p and (not f(φ))  # Circular dependency!  
      ```  
    - This is a real-time version of the halting problem: \(f\) cannot decide \(\varphi\) without already knowing the result.  
  - **Consequence**:  
    - The knowability principle fails for \(\varphi\), but this doesn't collapse to "all truths are known."  
    - Instead, it reveals a **computational incompleteness**: Some truths (self-referential ones) are undecidable.  
  - **What This Tells Us**:  
    - The original paradox derives force from **idealized knowledge** (non-computable \(\diamond K\)).  
    - When knowledge is bounded by computability, self-referential propositions evade knowability, but no collapse occurs.  

