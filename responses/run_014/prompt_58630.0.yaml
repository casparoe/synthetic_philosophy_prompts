prompt: |-
  Design a 75-minute classroom game on superrational cooperation for 24 undergraduates attending an interdisciplinary rationality workshop, most with no background in game theory. The aim is for participants to feel the force of the following thought in a one-shot prisoner's dilemma with cooperate-cooperate yielding 3 points each, defect-defect yielding 1 point each, and unilateral defection yielding 5 points against 0: if the other player can be expected to reason exactly as I do, cooperating can be rational even though defection dominates. Arrange rules and a pairing procedure so that participants first experience the pull to defect and then make a second choice under conditions that make sameness of reasoning salient, without introducing the theory by name beforehand. Include concrete rules, materials, scoring without money, and a timeline, followed by a debrief that maps key moments onto the contrast between causal dominance reasoning and superrational reasoning, anticipates what will likely go wrong on a first run and how to manage it, and acknowledges which element of superrationality the activity cannot reproduce and must be supplied by discussion.
reasoning: |-
  We are designing a 75-minute classroom game to illustrate superrational cooperation in a one-shot prisoner's dilemma (PD) for 24 undergraduates with no background in game theory. The goal is for participants to feel that if the other player reasons exactly as they do, then cooperating can be rational even though defection dominates in the causal sense.

  The PD payoffs:
  - Mutual cooperation (CC): 3 points each
  - Mutual defection (DD): 1 point each
  - Unilateral defection (one defects, the other cooperates): 5 points for the defector, 0 for the cooperator.

  We want two rounds: 
  1. First round: Participants experience the pull to defect without any special setup (to show dominance of defection).
  2. Second round: We make the sameness of reasoning salient (without using the term "superrational") to see if they choose to cooperate.

  Constraints:
  - 24 participants, so we will pair them up. We need a pairing procedure that ensures anonymity and one-shot interactions.

  Materials:
  - Scorecards for each participant (to record their choices and points over rounds).
  - Pens.
  - A way to anonymously submit choices and receive results (e.g., using paper slips collected and redistributed by the instructor, or an online tool if available and simple enough).

  Scoring without money: We can use points that are just for the activity, and perhaps at the end recognize the top scorers (but note: we don't want to create perverse incentives that might undermine the lesson).

  Timeline (75 minutes total):

  1. Introduction (10 minutes)
     - Explain the rules of the game without using game theory jargon. Call it a "paired decision game".
     - Explain the two choices: "Cooperate" (C) or "Defect" (D) without using the terms prisoner's dilemma.
     - Present the payoff matrix in a simple way (without matrix if possible). Example: 
          - If you both choose C, you both get 3 points.
          - If you both choose D, you both get 1 point.
          - If one chooses C and the other D, the one who chose D gets 5 points and the one who chose C gets 0.
     - Emphasize that they are making a choice without knowing what the other person will do, and that they will be paired randomly and anonymously.

  2. First Round (15 minutes)
     - Pair participants randomly (using a method such as drawing numbers or an app). We need 12 pairs.
     - Each participant writes their choice (C or D) on a slip of paper without showing anyone. They also write their own ID (assigned at the start) so we can record who they are.
     - Collect the slips and then redistribute the slips to the paired partner? But that would reveal the partner. Instead, we can have the instructor (or assistants) collect the choices and then announce the outcomes to each pair without revealing identities. Alternatively, we can have the slips collected and then the instructor matches the pairs and announces the outcomes by ID without revealing the partner's identity.

     How to manage without revealing partners? We can assign each participant a unique ID (e.g., numbers 1-24). Then we randomly assign pairs (e.g., pair 1 with 2, 3 with 4, ...). Each participant writes their ID and their choice. The instructor collects all, then for each pair, looks at the two choices and writes the outcome for each on a separate slip to return to the participant. For example, if IDs 1 and 2: 
        - If both C, then both get 3.
        - If 1 chose C and 2 chose D, then 1 gets 0 and 2 gets 5.

     Then we return the outcome slips to the participants by ID (so each participant gets a slip with their own points for the round).

     After the round, participants record their points on their scorecard.

  3. Discussion of First Round (5 minutes)
     - Ask participants to raise hands: how many chose C? How many chose D?
     - Ask for volunteers to share why they chose what they did (without revealing their partner or outcome). 
     - Note: We expect many defections. We don't reveal the outcomes by pair to avoid influencing the next round.

  4. Second Round (15 minutes)
     - Now we want to make the sameness of reasoning salient. We will tell them that they will be paired again, but this time with someone who is "exactly like them in reasoning" or "thinks exactly like you do". We might say: "For this round, we have taken special care to pair you with someone who is very similar to you in the way they think and reason. In fact, we have tried to pair you with someone who will approach this decision in the same way as you. So, whatever reasoning you are using, your partner is using the same reasoning."

     - We then repeat the same procedure: assign new random pairs (but we don't actually change the pairing method; we just tell them that we are pairing them with someone who thinks the same). We want to create the psychological condition for superrationality without actually guaranteeing that they are matched with someone who thinks the same (because we cannot). We are setting up the thought: "If I am paired with someone who reasons exactly as I do, then we would both come to the same conclusion."

     - Collect choices and distribute outcomes as before.

  5. Second Round Results and Transition to Debrief (5 minutes)
     - Again, ask for a show of hands: how many chose C and D in the second round?
     - Collect the scorecards to see the overall results (or have participants tally their own total points for the two rounds).

  6. Debrief (25 minutes)
     - Start by mapping the key moments:
          a. First round: Most likely, many defected. Why? Because no matter what the other does, defecting gives a better outcome (if the other cooperates, you get 5 instead of 3; if the other defects, you get 1 instead of 0). This is the causal dominance reasoning.
          b. Second round: We set up the condition that the other person is reasoning exactly as you are. Then, if you decide to defect, so will they (because they are reasoning the same) and you get 1. If you decide to cooperate, so will they and you get 3. So cooperating leads to a better outcome. This is the superrational reasoning.

     - Anticipate what might go wrong:
          - First round: We expect a lot of defections, but if there are many cooperators, that's okay. We can still point out that for each individual, defecting was the dominant strategy. But if cooperation was high, we can note that maybe they trusted each other, but the point is that without the special condition, the rational choice by dominance is to defect.
          - Second round: We might not get as much cooperation as we hope. Why? Because the setup might not be fully convincing, or participants might still be skeptical. We can address this by saying: "Some of you might have thought: but what if the other person doesn't really reason the same? Then if I cooperate and they defect, I get 0. So I better defect to be safe." This is the tension between causal and superrational reasoning. We can note that superrationality requires that you believe the other is reasoning in the same way and that you are both locked into the same conclusion.

     - Acknowledge the element that the activity cannot reproduce: 
          - In the activity, we cannot actually ensure that the other person is reasoning exactly the same. We only set up the idea. Therefore, the leap to cooperation requires trust in the setup (which we provided by our instructions) and in the idea of identical reasoning. In reality, without a guarantee of identical reasoning, the causal dominance reasoning might still prevail. We must discuss that superrationality is a thought experiment that works only under the assumption of identical reasoning.

     - Discuss the implications: 
          - In situations where we know that the other person is using the same reasoning (for example, because we are both rational in the same way and we both know that we are both rational, etc.), then we can escape the prisoner's dilemma.

     - Finally, introduce the terms: 
          - Now we can call the first kind of reasoning "dominant strategy reasoning" and the second "superrationality" (or "reflection across symmetry"). We can mention that this idea was put forward by Douglas Hofstadter.

  Materials Preparation:
     - Scorecards: Each participant gets a card with their ID and spaces for Round 1 (choice and points) and Round 2 (choice and points), and total points.
     - Slips of paper for choices (one per round per participant) and outcome slips (prepared by the instructor for each round).
     - A pairing list for Round 1 and Round 2 (we can generate two random pairings in advance).

  Logistics:
     - We need two random pairings. We can pre-generate two sets of pairs (using a random permutation of 24 numbers and then pairing consecutive numbers). We assign each participant an ID (1-24) at the beginning.

     - Round 1: Use the first pairing (e.g., pairs: (1,2), (3,4), ... (23,24)).
     - Round 2: Use the second pairing (which is a different random matching, but we tell them it's based on similar reasoning).

  Total time: 10+15+5+15+5+25 = 75 minutes.

  Important: We must not reveal the actual pairings to the participants to maintain anonymity. We only reveal the outcome (the points they got) and not who their partner was or what their partner chose.

  Let's write the detailed steps:

  Step-by-Step:

  1. Introduction (10 min)
     - Welcome and explain the activity: "We are going to play a game in two rounds. In each round, you will be anonymously paired with another participant. You will make a choice between two options: we'll call them Choice A (Cooperate) and Choice B (Defect). The points you get depend on both your choice and the choice of the person you are paired with."
     - Display the payoff rules (without a matrix, in words):
          - If both choose A (Cooperate): both get 3 points.
          - If both choose B (Defect): both get 1 point.
          - If one chooses A and the other chooses B: the one who chose A gets 0 points, the one who chose B gets 5 points.
     - Assign each participant a unique ID (1 to 24) and give them a scorecard with that ID.

  2. Round 1 (15 min)
     - Announce: "We will now randomly pair you for the first round."
     - Participants write on a slip: their ID and their choice (A or B). They fold the slip and put it in a collection box.
     - The instructor (and assistants) collect the slips. Then, using the pre-generated pairing list (first random pairing), the instructor matches the slips by the paired IDs. For each pair, the instructor records the choices and then writes an outcome slip for each participant (with their points). 
          Example: For pair (1,2): 
            If both A: outcome slip for 1: "You chose A, your partner chose A. You get 3 points." and similarly for 2.
            If 1 chose A and 2 chose B: for 1: "You chose A, your partner chose B. You get 0 points." for 2: "You chose B, your partner chose A. You get 5 points."
     - Distribute the outcome slips to the participants by ID (so each participant gets one slip). They record their points on their scorecard.

  3. First Round Discussion (5 min)
     - Ask: "How many of you chose A in the first round? How many chose B?" (by show of hands).
     - Ask: "Can anyone share why they chose what they did?" (without revealing partner or outcome). 
     - Briefly note: "Some of you might have thought that choosing B is safer because it avoids the worst outcome (0 points) and might get you 5 points."

  4. Round 2 (15 min)
     - Announce: "In this round, we have taken special care to pair you with someone who is very similar to you in the way they think. We have tried to match you with someone who will approach this decision in the same way as you do. So whatever reasoning you are using, your partner is using the same reasoning. Therefore, you and your partner will come to the same conclusion about what to choose."
     - Repeat the same procedure: 
          - Participants write their ID and choice (A or B) on a new slip and put it in the box.
          - The instructor uses the second pre-generated random pairing to match the slips and compute outcomes.
          - Distribute outcome slips and have participants record points.

  5. Second Round Discussion (5 min)
     - Ask: "How many chose A in the second round? How many chose B?"
     - Ask: "Did anyone change their choice from round 1 to round 2? Why?"

  6. Debrief (25 min)
     - Start by explaining the two different kinds of reasoning:
          a. Round 1: The dominant strategy reasoning. 
              - No matter what the other player does, choosing B (defect) gives a better outcome: 
                  - If the other chooses A, you get 5 instead of 3 (if you had chosen A).
                  - If the other chooses B, you get 1 instead of 0 (if you had chosen A).
              - So it seems rational to choose B.
          b. Round 2: The superrational reasoning.
              - We told you that you are paired with someone who reasons exactly as you do. So if you choose A, they will also choose A (because they are reasoning the same) and you both get 3. If you choose B, they will also choose B and you both get 1. Therefore, choosing A leads to 3 points, which is better than 1. So it is rational to choose A.

     - Discuss what likely happened:
          - Round 1: We expect mostly B (defect) choices. 
          - Round 2: We hope to see more A (cooperate) choices. But if we don't, why? Because participants might not fully believe that the other is reasoning the same, or they might think that the other might not believe it, etc. This is the fragility of superrationality.

     - Acknowledge the missing element:
          - In the game, we cannot actually guarantee that the other person is reasoning the same. We only set up the idea. Therefore, in reality, without a strong belief in identical reasoning, the causal dominance reasoning might still be compelling.

     - Broaden the discussion:
          - This kind of reasoning can apply in real life when we face symmetric interactions with people we believe are similar to us (e.g., in cultural background, education, or shared rationality). It can lead to cooperation without communication.

     - Finally, introduce the term: "This idea of reasoning about identical reasoning in symmetric games is called 'superrationality'."

  This design should achieve the goal of letting participants experience the pull of both kinds of reasoning and understand the contrast.
answer: |-
  ### Classroom Game: The Reasoning Mirror  
  **Objective:** Experience the tension between causal dominance and superrational reasoning in a one-shot Prisoner's Dilemma (PD) without prior theory.  

  ---

  ### **Materials**  
  - **24 Scorecards** (pre-printed with tables for Round 1 and 2; see template below).  
  - **48 Choice Slips** (small paper slips for decisions: "A" or "B").  
  - **2 Collection Boxes** (labeled "Round 1" and "Round 2").  
  - **Whiteboard** for displaying rules and tallying results.  
  - **Pens** for participants.  
  - **ID Badges** (numbers 1–24 on lanyards for anonymity).  

  **Scorecard Template:**  
  ```
  ID: [Your Number]  
  Round 1:  
    My Choice: [   ] (A or B) | Points: [   ]  
  Round 2:  
    My Choice: [   ] (A or B) | Points: [   ]  
  Total Points: [   ]  
  ```  

  ---

  ### **Rules & Payoffs**  
  Explain without game theory jargon:  
  - **Choices:** "A" (cooperate) or "B" (defect).  
  - **Payoffs (per round):**  
    - If both choose **A**: Both earn **3 points**.  
    - If both choose **B**: Both earn **1 point**.  
    - If **one chooses A and the other B**:  
      - The "A" chooser earns **0 points**.  
      - The "B" chooser earns **5 points**.  
  - **Pairing:** Anonymous, one-shot interactions (no repeats).  

  ---

  ### **Timeline (75 min)**  

  #### **1. Setup (5 min)**  
  - Distribute ID badges (1–24), scorecards, and pens.  
  - Display rules on the whiteboard. Emphasize:  
    > "You will play **two rounds**. In each, you’ll be paired with someone new. Your choices are **secret**, and you **cannot communicate**."  

  #### **2. Round 1: Dominance Pull (20 min)**  
  - **Pairing:** Randomly assign partners (e.g., draw numbers from a hat). *Example pairing:* 1-2, 3-4, ..., 23-24.  
  - **Procedure:**  
    - Participants write **ID** and **choice (A/B)** on a slip.  
    - Slips go into the **Round 1 Collection Box**.  
    - Instructor collects and shuffles slips, then privately matches pairs to compute outcomes.  
    - Outcomes are written on scorecards (e.g., "Partner chose B. You get 0 points.").  
  - **Key:** *No emphasis on "similar reasoning."*  

  #### **3. Round 1 Discussion (10 min)**  
  - Tally choices on whiteboard: "Raise hand if you chose A/B."  
  - Ask:  
    - "Why did you choose B? What were you worried about?" *(Expected: Fear of getting 0 points.)*  
    - "Did anyone choose A? Why?" *(Note: Defection likely dominates.)*  
  - **Do not reveal theory.** Summarize: "Many chose B to avoid the worst outcome."  

  #### **4. Round 2: Salient Sameness (20 min)**  
  - **New Pairing:** Re-pair randomly (e.g., 1-3, 2-4, ..., 22-24).  
  - **Critical Instruction:**  
    > "This time, we’ve paired you with someone who **thinks like you do**. Whatever logic you use, they’re using the exact same logic. Assume your reasoning is mirrored."  
  - **Procedure:**  
    - Repeat slip submission with **Round 2 Collection Box**.  
    - Compute outcomes same as Round 1.  

  #### **5. Round 2 Discussion (5 min)**  
  - Tally choices: "Hands up for A/B in Round 2."  
  - Ask: "Did anyone switch from B to A? Why?" *(Note: Expect increased cooperation.)*  

  #### **6. Debrief (15 min)**  
  Map experiences to theory:  
  1. **Round 1 = Causal Dominance Reasoning:**  
     - "In Round 1, choosing B felt safe: **No matter what your partner did**, B gave a better outcome (5>3 if they chose A; 1>0 if they chose B). This is called *dominant strategy reasoning*."  
     - *Anticipated issue:* If many cooperated in Round 1, say: "Some might have trusted their partner, but B was still the ‘safe’ choice given the uncertainty."  

  2. **Round 2 = Superrational Reasoning:**  
     - "In Round 2, we asked you to assume **identical reasoning**. If you choose A, they choose A → both get 3. If you choose B, they choose B → both get 1. Suddenly, A gives the best *joint* outcome. This is *superrationality*: acting rationally under symmetry."  
     - *Anticipated issue:* If cooperation didn’t spike, ask: "Did anyone doubt their partner would *truly* reason identically? That doubt is natural!"  

  3. **The Missing Element (Acknowledge Limitation):**  
     - "In real life, we can’t guarantee identical reasoning. Superrationality requires **perfect symmetry and mutual knowledge of rationality**. Here, we simulated it with instructions—but in the wild, distrust often overrides."  

  4. **Conclusion:**  
     - "Superrationality isn’t magic—it’s a lens for symmetric dilemmas. If you *know* others think like you, cooperation can be rational even when defection dominates causally."  

  ---

  ### **Logistical Notes**  
  - **Pairing Anonymity:** Use ID numbers to obscure partners. Return scorecards via non-identifiable bins.  
  - **Scoring Motive:** Top 3 scorers earn applause (non-monetary incentive).  
  - **Common Pitfalls:**  
    - **Round 1 low defection:** If >40% cooperate, highlight: "Even if some cooperated, B was still the *individually rational* choice."  
    - **Round 2 skepticism:** If cooperation lags, stress: "This is why real-world cooperation often fails—we doubt others’ rationality."  
  - **Why No Theory First?** Avoiding jargon ("PD," "superrationality") prevents intellectualization; the game forces visceral learning.  

  ---  
  This design creates a visceral arc from defection-dominated logic to symmetric cooperation, priming students for deeper discussion while staying accessible. The debrief explicitly bridges experience to theory, addressing the gap between idealized symmetry and real-world distrust.
