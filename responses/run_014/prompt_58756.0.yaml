  3.  She closes her eyes, waiting for instinct to roar "LEFT!" or "RIGHT!", but hears only the frantic drip-drip-drip of water and the hollow echo of her own indecision.
  4.  Minutes bleed; choosing to *wait* for feeling becomes its own suffocating decision, trapping her as effectively as the deepening flood around her boots.
  5.  A sudden, sharp laugh escapes her; she grabs the nearest drive blindly—no reason, just raw motion—though the frantic *why* echoes louder in her head with every sloshing step towards the stairs.

