  - Burge: The meaning is different (because the community norms are different).

  But note: the question is whether the two subjects' words mean the same. Internalism says yes. Putnam says yes. Burge says no. But we wanted Putnam and Burge to disagree. Here, Putnam and Burge disagree: Putnam says same meaning, Burge says different meaning. And internalism says same meaning. So the pattern is:

  - Internalism: same meaning
  - Putnam: same meaning
  - Burge: different meaning

  But we wanted Putnam to say same and Burge to say different, while internalism says same. That matches.

  However, note that in this case, the Putnam line is stretched: we are applying it to a unit of measure, not a natural kind. So let's check the audit questions.

  **Audit Questions:**

  1. **Each line: meaning and what fixes it, and extension:**
     - Internalism: 
       - Meaning: same for both subjects. The concept is a deferential concept for a unit of mass defined by the community's standard. 
       - Extension in World A: the prototype-based unit (1.0001 SI grams)
       - Extension in World B: the cesium-based unit (1 SI gram)
       - What fixes it: the individual's intrinsic properties (brain state, memories, etc.)
     - Putnam-style:
       - Meaning: the SI gram (the objective natural unit of mass)
       - Extension in both worlds: the set of masses that are multiples of the SI gram.
       - What fixes it: the objective physical reality (the fundamental constants of nature)
     - Burge-style:
       - Meaning in World A: the prototype-based gram
       - Meaning in World B: the cesium-based gram
       - Extension in World A: multiples of the prototype-based gram
       - Extension in World B: multiples of the cesium-based gram (SI gram)
       - What fixes it: the norms of the linguistic community (as codified in rulebooks and machines)

  2. **Does either externalism have to be stretched?**
     - Putnam: Traditionally, Putnam's externalism is for natural kinds (like water, gold). Here we are applying it to a unit of measure. Is that stretching? Yes, because a unit of measure is a convention, not a natural kind. However, one might argue that mass is a natural kind and the unit is a way to measure it. But the unit itself is artificial. So this is a stretch. Is it legitimate? In the context of the seminar, we are testing the theories beyond their original domain. We are not rigging the case if we are explicit about the stretch and if the theory can be reasonably extended.
     - Burge: This fits perfectly because Burge's examples often involve deferential terms in a community, including non-natural kinds (like "sofa" or "contract"). So no stretch.

  3. **Which single feature is doing the work?**
     - The key feature is that the term is a conventional unit defined by authoritative non-human sources (rulebooks, machines) that differ between the worlds. If we delete the social difference (say, both worlds have the same rulebook and same definition), then both Burge and Putnam would agree (if the definition points to the same objective thing). But note, if we delete the non-human authority and make it about living experts, it might still work, but the specification asked for non-human. The critical point is that the physical world is the same, but the social conventions differ.

     If we remove the social difference (say, both communities have the same rulebook and same machine), then the meanings would be the same for both externalisms. Also, if we remove the deference (if the subjects were not deferential) then Burge might not apply. But in our case, the deference is crucial.

  4. **Best defense for the line that comes out badly:**
     - The Putnam line comes out saying that the meaning is the same in both worlds, but one might argue that in World A, the community is using a different standard. How would a Putnam defender say the case begs the question?
       - Defense: The case assumes that the gram is a natural kind. But it is not; it is a conventional unit. Therefore, Putnam's theory does not apply. The meaning of a conventional unit is fixed by the community's practices, not by an objective natural kind. So the case is rigged by applying Putnam to a non-natural kind.
       - Does it land? Yes, because the original examples (water, XYZ) are natural kinds. So if we want to test the theories on their home turf, this case is not fair to Putnam.

     Alternatively, if we insist that mass is a natural kind, then the defender might say: the objective natural kind is mass, and the unit is arbitrary. The term "gram" is a name for a particular unit, but the unit is defined by a convention. So the objective reality doesn't fix which unit is the gram; the convention does. Therefore, Putnam's theory should not be applied to conventional terms.

  5. **Verdicts must fall out of the theories:**
     - In this case, the verdicts do fall out of the theories: 
       - Internalism: same meaning (because duplicates)
       - Putnam: same meaning (because the objective natural unit is the same)
       - Burge: different meaning (because the community norms differ)

     However, the issue is whether we built the answer into the setup by choosing a conventional term. We did not build the answer in the sense that we followed the specifications. But we did choose a term that is not a natural kind, which might be seen as unfair to Putnam.

  **Alternative Case: Natural Kind with Socially Mediated Samples**

