  ### Constructed Case: "Joule" in Two Worlds  
  (192 words)  

  In World A, "joule" is defined by an archival technical manual (authored in 1900) as *the energy expended by one newton applied over one meter*. The manual is treated as gospel; calibration machines in factories and labs derive from it. Due to a typo in the manual’s equation (unnoticed for decades), "newton" is miscalibrated: it outputs 1.0001× the correct force.  

  In World B, the *identical* manual exists, but a 1920 addendum (digitally archived and automatically enforced by calibration machines) corrects the typo. "Newton" is now precise.  

  Subjects **Ava** (World A) and **Bea** (World B) are physics technicians, molecule-for-molecule duplicates. Both use "joule" deferentially, citing "the manual" as authoritative. They identically believe: *"One joule is the energy from one newton-meter, per the manual."* They perform identical tasks (e.g., measuring engine output), unaware of the discrepancy. No test distinguishes their internal states.  

  **Difference traceable solely to social practice**: World A follows the uncorrected manual; World B follows the addendum. Both worlds share all microstructural facts (e.g., atomic masses, light speed). The term’s causal history is identical until 1920.  

  ---

  ### Audit  

  #### 1. **Theories’ Verdicts on Meaning and Extension**  
  - **Internalism (individualist)**:  
    - *Meaning in both worlds*: Same. Ava and Bea share an identical concept: *energy unit defined by the manual’s newton-meter*.  
    - *Extension*: Differs. In World A, "joule" picks out 1.0001× the correct joule (due to the uncorrected manual). In World B, it picks out the precise joule.  
    - *What fixes it*: Intrinsic properties (brain states, memories).  

  - **Putnam-style externalism (natural-kind)**:  
    - *Meaning in World A*: The *actual natural kind* for energy (fixed by physics: Planck’s constant × light speed, etc.).  
    - *Meaning in World B*: Same as World A.  
    - *Extension*: Identical in both worlds—the precise joule (1 J = kg·m²/s²).  
    - *What fixes it*: Objective natural facts (laws of physics), overriding social practices. Ava’s community is wrong; "joule" refers to the true joule regardless of their manual.  

  - **Burge-style externalism (social)**:  
    - *Meaning in World A*: Defined by the uncorrected manual (*deferential to "newton" as miscalibrated*).  
    - *Meaning in World B*: Defined by the corrected addendum (*deferential to "newton" as precise*).  
    - *Extension*: World A: 1.0001× precise joule; World B: precise joule.  
    - *What fixes it*: Linguistic norms (the authoritative manual/addendum in each community).  

  **Pattern achieved**:  
  - Internalism: Same meaning (duplicates), different extensions.  
  - Putnam: Same meaning and extension (natural kind overrides social error).  
  - Burge: Different meanings and extensions (social norms differ).  
  → Putnam and Burge *disagree* on whether the subjects’ words mean the same.  

  #### 2. **Stretching the Externalisms?**  
  - **Putnam**: Slightly stretched. Natural-kind externalism targets substances (e.g., water), not units. Energy is a natural kind, but "joule" is a conventional *measure* of it. Stretch is *legit* if energy is treated as the kind (like mass for "gram" in Putnam’s work), but **debatable** as units lack microstructure. Defense: Putnam extends to "law-cluster" terms (e.g., energy) in physics.  
  - **Burge**: No stretch. Fits "arthritis"-style cases—norms fix meaning via deference to authorities (even non-human, like manuals/machines).  

  #### 3. **Critical Feature Doing the Work**  
  The **non-human authority (manual/machine) with a socially mediated error/correction** is key. Delete this (e.g., both worlds have identical manuals), and:  
  - Burge agrees with Putnam: Same meaning (norms converge).  
  - Internalism still differs (extensions may vary, but meaning same).  
  Delete the *deference* (e.g., subjects define "joule" independently), and Burge collapses—norms don’t apply.  

  #### 4. **Best Defense for the "Losing" Theory**  
  - **Putnam’s defense**: The case *begs the question* by assuming "joule" is socially fixed. Energy is a natural kind; "joule" is just a label for a fraction of it. Social practices can’t alter the natural kind, so Ava’s "joule" still refers to the true joule (just as "water" refers to H₂O even if a community misidentifies it).  
  - **Does it land?** Partially. It preserves Putnam’s core (natural kinds > opinions), but fails if units are seen as conventions, not kinds. The defense works only if energy is granted kind-status.  

  #### 5. **Verdicts from Theories, Not Setup**  
  - **Success**: The verdicts derive cleanly:  
    - Putnam ignores social error (natural kind dominates).  
    - Burge prioritizes norms (social practice dominates).  
    - Internalism ignores both (head states dominate).  
  - **No rigging**: The social difference alone drives the disagreement. Microstructural sameness ensures internalism holds, while deference to non-human authorities keeps Burge applicable without experts.  

  **Final Verdict**: The case works as specified. Putnam and Burge diverge due to the *conventional unit* + *social error* setup, exposing a rift in what "fixes" meaning. Internalism remains distinct. The stretch for Putnam is minor and seminar-viable for debate.
