  **Conclusion:**

  The gram case meets the specifications and produces the desired pattern. The audit shows that the stretch for Putnam is significant and might be challenged. But it serves the purpose of the seminar to explore the boundaries of the theories.

  Final case description (under 200 words):

  **The Case: "Gram"**

  Alice (World A) and Betty (World B) are duplicates. Both use "gram" for a unit of mass, deferring to their community's authority. In World A, the authority is an archived prototype that defines the gram. In World B, it's a machine realizing a cesium-based definition. The worlds are physically identical except for the social practices: World A's rulebook enforces the prototype, World B's the cesium definition. Due to prototype drift, the prototype-based gram is 1.0001 times the cesium-based gram. Both subjects are unaware, using their respective standards. No test could distinguish them internally.

  **Audit Summary:**

  - Internalism: same meaning (deferential concept for a gram), different extensions (because of the world's social facts).
  - Putnam: meaning fixed by natural facts (mass via fundamental constants), so same meaning (cesium gram) and extension in both worlds.
  - Burge: meaning fixed by community norms, so different meanings (and extensions) in the two worlds.

  Putnam is stretched to a unit, which is conventional. Defense: natural kind externalism doesn't apply to conventions. The feature doing the work is the conventional nature of the term combined with social differences. Without that, if the term were a natural kind with fixed microstructure, Putnam and Burge might align (if the community is right) or Putnam would override (if the community is wrong). Verdicts follow from the theories as applied.
