     Therefore, Burge would say that the term "gram" means something different in the two worlds. So when Alice and Betty both say "gram", they are expressing different concepts because they are embedded in different linguistic communities.

  **The Pattern:**

  - Internalism: The subjects have the same meaning (same concept) for "gram". (But note: the extension differs? Actually, the concept is the same, but it refers to different things in different worlds. However, the internalist typically holds that the content is the same, so the meaning is the same.)
