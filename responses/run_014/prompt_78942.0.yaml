  We are going to construct a case that meets the specifications. The goal is to have two subjects who are molecule-for-molecule duplicates, in worlds that differ only in social practices (not in physical or chemical microstructure), and the difference must be in what other people do, believe, or record (like rules, archives, etc.). The term in question must be one that the subjects use by deference to a non-human authority (like a rulebook, code, machine, archive). The key is that the two externalisms (Putnam-style and Burge-style) come apart: they must disagree about whether the subjects' words mean the same, while internalism says they do.

  Let me design a case:

  **The Case: "Gram" in Two Worlds**

  In both worlds, there is a unit of mass called the "gram". The story of how the term was introduced is the same: it was defined by a physical artifact (a prototype kilogram) kept under controlled conditions. The prototype was used to calibrate secondary standards and scales. However, in the 20th century, the definition was changed to be based on a fundamental constant. 

  World A (Originalists): The community in World A continues to use the original prototype as the ultimate authority for what a gram is. They have a rulebook that explicitly states that the gram is defined by the prototype kept in their national archive. Even though the international community has moved to a new definition, World A's rulebook has not been updated. The prototype has been kept in a vault and is used to calibrate all scales.

  World B (Modernists): The community in World B updated their rulebook to the new definition: a gram is now defined as one thousandth of the mass equivalent of the energy of a photon whose frequency is the cesium hyperfine transition frequency multiplied by a fixed constant (i.e., the current SI definition). They have a machine that realizes this definition and uses it to calibrate scales.

  Both subjects, Alice in World A and Betty in World B, are ordinary citizens who use the term "gram" in everyday life (e.g., buying flour). They are duplicates: they have the same brain states, memories, and dispositions. They both believe that a gram is a unit of mass defined by an official standard, and they defer to their respective community's standards. However, they are ignorant of the details: they don't know about the prototype or the cesium definition. They just use the term as they were taught.

  The twist: Due to a slight drift in the prototype in World A (or a miscalibration) over time, the prototype-based gram in World A is actually 1.0001 times the "true" gram as defined by the SI definition (if we take the SI definition as the objective standard). But note: the Putnam externalist might take the SI definition as the objective kind, while the Burge externalist would look to the community's norms.

  Now, the social difference: In World A, the rulebook and the archive still point to the prototype. In World B, the rulebook and the machine point to the cesium definition.

  **The Audit**

  1. **Internalism (duplicates think the same thoughts):** 
     - Both Alice and Betty have the same mental states. They both think of a gram as a standard unit of mass, defined by their community's authoritative source. So, they mean the same by "gram". The extension in both worlds, according to internalism, would be the same: whatever their internal concept picks out. But note: internalism typically says that the content is fixed by internal states, so the meaning is the same. However, the extension might differ because the actual world might have different stuff, but in our case, the physical microstructure is the same? Wait, we have to be careful.

     However, note the specification: "Their worlds differ, but not in the chemical or microstructural make-up of anything." So the physical world is the same? But then the mass of things is the same? This is tricky because if the definition of the gram differs, then the actual mass of objects in grams would differ? But we have to remember that the physical world is the same. So let's clarify:

     In both worlds, the actual mass of objects is the same. However, the unit "gram" in World A is tied to a prototype that has drifted, so if we take the SI definition as the objective standard, then the prototype in World A is 1.0001 times the SI gram. But in World B, the gram is defined by the SI definition. So when Alice says "this is 100 grams", she is referring to 100 times the prototype-based unit, which is 100.01 SI grams. When Betty says "this is 100 grams", she is referring to 100 SI grams. So the extension of "gram" differs: in World A, it picks out a slightly larger mass than in World B.

     But internalism says that because the subjects are duplicates, they have the same concept. So the meaning is the same. The extension of their term "gram" would then be determined by their internal state and the actual world? But the actual world has the same physical properties? Actually, the physical properties are the same, but the unit is a convention. So if internalism holds that meaning is in the head, then the concept of gram is the same, but the extension in the world might be different because of the different conventions? That seems odd. Alternatively, internalism might say that the extension is fixed by the internal state and the world, but the world includes the social facts? This is messy.

     Let me reframe: Internalism (individualist) holds that mental content supervenes on the individual's intrinsic properties. So if Alice and Betty are duplicates, they have the same mental content. Therefore, the meaning of "gram" for both is the same. But what is that meaning? It is a concept that defers to the community standard. So in World A, that concept, when used, refers to the prototype-based gram, and in World B, it refers to the cesium-based gram. So the extension is different. But the meaning (the concept) is the same? Or is the meaning the same and the reference different? That is the classic internalist view (like Frege's sense and reference).

     However, for the purpose of the seminar, we are focusing on the meaning (or content) of their thoughts. The internalist says that the content of their thought when they think "this is a gram" is the same. The Putnam and Burge externalists will disagree about the content.

  2. **Putnam-style externalism (natural kind):** 
     - For Putnam, the meaning of a term is fixed by the actual nature of the stuff in the world. In this case, what is the natural kind? Mass is a physical quantity. The most objective standard for mass is the one based on fundamental constants (like the current SI definition). So in both worlds, the actual nature of mass is the same (because the physical world is the same). Therefore, the term "gram" should refer to the same natural unit: the SI gram. 
     - In World A, the community uses a prototype that has drifted, so when they say "gram", they are actually referring to something that is 1.0001 SI grams. But for Putnam, the meaning is fixed by the actual kind. So he might say that the term "gram" in both worlds refers to the SI gram? But wait, that would mean that in World A, the community is mistaken about what a gram is? Yes, that's the point of Putnam: the actual nature fixes the reference, not the community's beliefs.

     However, note that the gram is a unit of measure, not a natural kind. Putnam's theory is typically applied to natural kind terms like "water". So we are stretching Putnam to a unit of measure. Is that legitimate? We'll come back to that.

     Extension in World A: Putnam might say that the term "gram" in World A refers to the SI gram (the objective unit). So the extension is the set of masses that are exactly 1 SI gram, 2 SI grams, etc. Similarly in World B, it refers to the SI gram. So the term "gram" means the same in both worlds: the SI gram.

     Therefore, Putnam would say that Alice and Betty's term "gram" means the same (the SI gram) in both worlds, even though in World A the community uses a different standard.

  3. **Burge-style externalism (social externalism):** 
     - For Burge, the meaning is fixed by the linguistic community's norms. In World A, the norm is to use the prototype, so the gram is defined by that prototype. In World B, the norm is to use the cesium definition. Therefore, the meaning of "gram" in World A is the prototype-based unit, and in World B, it is the cesium-based unit. 
