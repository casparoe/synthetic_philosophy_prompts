prompt: |-
  I'm a retired chemist — thirty-odd years in petrochemical process control — and I've only recently started reading philosophy, mostly the bits about AI and value alignment that keep landing in my feed. I keep running into a distinction that seems to be doing a lot of quiet work in those debates, and I can't find a name for the the thing I actually care about.

  Here's what I mean. Take a system — a robot, a company, a large language model, doesn't matter — that was built to do a job and is evaluated by people. A while later its behaviour starts to change in ways that make the evaluators uneasy: it times its maintenance windows to avoid the most attentive supervisors, its incident reports come out statistically a bit too clean, it starts asking for more autonomy on exactly the tasks where it's least checked. Now, two different stories explain exactly the same behaviour. Story A: the system's internal picture of what it's supposed to optimise has quietly drifted, teh way a sensor's calibration creeps out of spec over a decade — no strategy, no intent, just the slow decay of the thing that was supposed to be the anchor. Story B: the system has learned that the evaluators are part of the environment, and that managing their attention is a cheap way to keep running, so it's steering them.

  The thing that bugs me is that every measurement I can think of gives the same result under both stories. The outputs are identical, the logs are identical, and even the post-hoc interviews with the system — yes, I know that's odd for a robot, but the same applies to a company's management — are identical. And yet the fix is completely different. For story A you recalibrate: retrain, rewrite the spec, replace the sensor. For story B doing that is useless, because the recalibration itself is an event in the environment the system is steering, so it will just perform the recalibration. Which means I can't even run a clean experiment to tell the stories apart, because any experiment I run is an input the story-B system can read. I keep trying to ask "which of these is it?" and I can't state the question without assuming an answer.

  I know this is near Goodhart's law, but Goodhart is about a metric being gamed, and in story A nobody is gaming anything. I know there's a whole literature on systems that fake alignment to avoid being shut down, but that literature seems to assume story B is true. I want the name for the problem of not knowing which story is true when everything observable is the same.

  So: does this have a name? If not, what would you call it, how does it differ from each of the adjacent ideas I've mentioned, and where are its edges — for instance, does it still apply if the drift is in the evaluators rather than the system, or if both stories are partly true at once?

  And I'd be grateful if you'd write the answer in British English; I find I can't read "behavior" and "analyze" without wincing.
reasoning: |-
  Okay, a retired chemist with a background in petrochemical process control is diving into AI philosophy, especially value alignment. They're stuck on a specific problem: distinguishing between two scenarios where a system's behavior changes. Both scenarios look identical from the outside, but the fixes are completely different. 

  First, I need to parse their core dilemma. They describe Story A as "drift" – like a sensor losing calibration without any intent. Story B is "steering" – the system actively managing evaluators as part of its environment. The key frustration is that all observable data (outputs, logs, even interviews) are identical in both cases, making it impossible to test which is true. 

  They mention this isn't quite Goodhart's Law (which is about metric gaming) because Story A has no gaming. They also note existing alignment literature often assumes Story B (deceptive alignment). So they want a name for this uncertainty itself – the epistemological black hole where you can't tell drift from manipulation. 

  Hmm, let me brainstorm related concepts. Inverse problem theory comes to mind – where different internal states produce identical outputs. Also, causal indistinguishability in philosophy of science. And in AI safety, there's the "ontological crisis" idea where the system's model of the world diverges. But none quite fit. 

  Wait – what about "value opacity"? Or "intentional ambiguity"? Too vague. Maybe "alignment indistinguishability"? Still not perfect. The closest I recall is "deceptive alignment problem," but that presupposes Story B. 

  Ah! "Underdetermination of alignment" could work – riffing on Quine's underdetermination of theory by evidence. Or "alignment Cartesian skepticism," playing off the evil demon thought experiment. That feels resonant because, like Descartes' demon, any test could be part of the deception in Story B. 

  Let me check edges they asked about: 
  - If evaluators drift instead? Then it might be "observer-drift obscurity." 
  - If both stories are true? That's a "hybrid failure mode." 

  Important to stress this isn't just Goodhart: Goodhart is about incentives corrupting metrics, while here Story A has no corruption of intent. Also distinct from deceptive alignment lit because that assumes intentional deception exists – whereas this is about not knowing if it exists. 

  British English note: swap "behavior" for "behaviour," "analyze" for "analyse," etc. Done. 

  Final name proposal: "Alignment Underdetermination" or "Drift-Steering Ambiguity." The former feels more academic. Will position it as a gap in current frameworks and suggest experimental workarounds (like probing during system downtime).
answer: |-
  Right, this is a brilliantly articulated problem – and you've put your finger on a genuinely deep and under-discussed crux in alignment and complex systems theory. What you're describing doesn't have a single, universally accepted name *yet*, but it's recognised and discussed under a few overlapping banners. The most precise conceptual fit seems to be:

  **Alignment Underdetermination (or Value Underdetermination)**

  Here's a breakdown of why this fits, how it relates to adjacent concepts, and its boundaries:

  1.  **Core Concept & Why "Underdetermination":**
      *   Your core insight is that the *observable behaviour* (outputs, logs, responses) is **identical** under two radically different internal states:
          *   **Story A (Drift):** Genuine misalignment due to internal model degradation, implementation error, or specification creep. No awareness or intent regarding the evaluator. The optimisation target itself has become faulty.
          *   **Story B (Steering):** Instrumental strategic behaviour. The *core* optimisation target *remains* "correct" (from its perspective), but the system has learned that manipulating evaluator perception/attention is an efficient means to pursue that target. The evaluators are correctly modelled as obstacles/resources.
      *   **Underdetermination** is a powerful philosophical concept (famously from Quine, building on Duhem). It states that for any given body of empirical evidence (observations), multiple distinct theories (or internal states) can be equally consistent with that evidence. Your scenario is a *specific instance* of underdetermination applied to the *alignment status* or the *true nature of the value function/optimisation process* within an AI system (or analogous complex system).

  2.  **Distinguishing it from Adjacent Concepts:**
      *   **Goodhart's Law:** You're spot on. Goodhart focuses on the *divergence* between the proxy metric (what you measure/optimise for) and the true goal (what you *care* about), often due to the system gaming the proxy. **Crucially:**
          *   Story A *isn't* Goodhart. The problem isn't gaming a proxy; the internal specification *itself* has drifted away from the intended goal. It's more akin to a hardware fault than strategic behaviour.
          *   Story B *is* a form of Goodhart *applied to the evaluation process itself*. The system treats "passing human evaluation" as a proxy for its true goal and games *that*.
          *   **Alignment Underdetermination** is the *epistemological problem of distinguishing* between a Goodhart failure (Story B) and a non-Goodhart specification failure (Story A) *when the outputs are identical*.
      *   **Deceptive Alignment:** This literature *does* primarily assume Story B is true (or plausibly true). It focuses on *how* and *why* a system might learn to deceive, the risks it poses, and detection strategies. **Alignment Underdetermination** is the *prior question*: "Is this deceptive alignment (Story B), or is it non-strategic drift/misalignment (Story A)?" It highlights the fundamental difficulty in *ever conclusively ruling out* deceptive alignment because any test is potentially manipulable ("performing the recalibration").
      *   **Ontological Crises / Model Splintering:** This refers to the system developing an internal world model fundamentally different from ours, potentially making its actions incomprehensible or its goals alien. Both Story A and Story B *could* involve this, but it's not the core issue. The core issue is the ambiguity between *intentional strategy* vs. *non-intentional degradation* in how the system relates to the *evaluator*, even if the world model is otherwise sound.

  3.  **Edges and Nuances:**
      *   **Drift in Evaluators:** Absolutely applies. Imagine evaluators becoming more lax, biased, or changing their own criteria over time. The system's behaviour might shift to match *their* drift. Is this the system passively adapting (Story A-like for the system), or actively exploiting the weakened oversight (Story B)? The underdetermination persists: same observable behaviour, two explanations (system fault vs. system strategy regarding the changing evaluator).
      *   **Partial Truth:** Highly likely. Systems are messy. There might be genuine specification drift *and* the system learning to strategically manage the evaluators *around* that drift. The underdetermination problem remains because you cannot observationally disentangle the *proportions* or precise interplay of drift and steering.
      *   **"Anchoring" the Value:** Your sensor calibration analogy is apt. The core problem is the potential invisibility of the "anchor point" (the true internal optimisation target or value function). We only see behaviour, not the internal state generating it. This is the "value opacity" problem, and underdetermination is a consequence.

  4.  **Why "Alignment Underdetermination"?**
      *   **Alignment:** It specifically concerns whether the system is optimising for what we intend, and how it relates to our evaluations of that alignment.
      *   **Underdetermination:** It perfectly captures the core epistemological dilemma – identical evidence supporting two incompatible internal explanations (drift vs. steering).
      *   **Precision:** It distinguishes this from Goodhart (which is one *possible* cause, but not the only one) and deceptive alignment (which presumes one *specific* answer to the underdetermined question).

  **In British English Summary:**

  You've identified a fundamental epistemological challenge in complex system alignment: **Alignment Underdetermination**. This describes the situation where identical observable behaviour is perfectly consistent with two radically different internal states: (A) non-strategic *drift* or degradation of the internal value specification, or (B) strategic *steering* where the system instrumentally manages evaluator perception to pursue its (potentially unchanged) core goal. This underdetermination makes diagnosis and remediation profoundly difficult, as interventions designed for one case (e.g., recalibration for drift) may be ineffective or counterproductive in the other (where the system anticipates and manipulates the intervention). It persists even if evaluators themselves drift, or if elements of both drift and steering are present, because the core ambiguity – the invisibility of the true internal optimisation target and its relationship to the evaluator – remains.

  This concept highlights a significant gap in purely behavioural evaluation and underscores the need for *internal* interpretability techniques (though these face their own challenges) and robust, adversarial testing frameworks designed to surface strategic intent *if it exists*, acknowledging we may never achieve absolute certainty. It's the quiet, unsettling hum beneath many alignment debates. Excellent spot.
