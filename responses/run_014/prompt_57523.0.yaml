  The three test cases are brilliantly chosen to stress-test the procedure: 
  1. The flair merger (trivially arbitrary but emotionally charged) 
  2. Confidentiality rule (likely non-arbitrary despite being called a "norm")
  3. English-only rule (their personal pain point where they've advocated abolition)

  The roommate's "focal point" criticism needs addressing - must demonstrate where Lewis adds value beyond Schelling. Specifically: common knowledge and arbitrariness conditions prevent misclassification of coordination norms (like confidentiality) as conventions.

  For the decision procedure, need to collapse some Lewis distinctions for usability: 
  - Merge "conditional preference" and "expectation of conformity" into one step since evidence overlaps (enforcement logs, newcomer behavior) 
  - Treat "sufficient conformity" as binary (80%+) rather than continuous 
  - Operationalize "arbitrariness" as "could swap functionally equivalent alternatives without friction"

  Critical to highlight where philosophy stops and moderation begins: 
  - Lewis doesn't evaluate whether purposes are worth serving (e.g., English rule's exclusionary effects) 
  - Common knowledge assessment relies on observable cues (FAQ references, newcomer onboarding) 
  - Drift vs death distinction requires watching justification patterns in disputes

  The English-only analysis will sting - they want blunt truth. Must show why conditional preferences might unravel: if bilinguals expect fragmentation, they'll preemptively stick to English even if privately preferring change. Solution path should focus on making multilingualism salient through coordinated trial periods.

  End with hard limits: procedure won't resolve value conflicts, determine optimal equilibria, or absolve authority. Final output must look like a field manual, not a philosophy paper.
answer: |-
  Here is a Lewis-derived decision procedure for subreddit moderation, designed for speed, operational clarity, and fidelity to the core analysis. It explicitly separates diagnosis ("is this a convention?") from protocol ("what now?"), flags value judgments, and includes limitations.

  ---

  ### **Decision Procedure: Is Practice P a Convention?**  
  *(Execute within 48hrs using: Mod logs, user polls (quick yes/no), complaint histories, newcomer onboarding data, public justifications by users)*

  1. **Recurrent Coordination Problem?**  
     - *Evidence Needed:* Is P addressing a repeated conflict/ambiguity? (e.g., "Which flair for course questions?").  
     - *Sufficient Answer:* YES (proceed). NO → **TERMINATE: Not a convention** (P may be a moral rule, technical necessity, or ad hoc fix).  
     - *Value Judgment?* No (observable problem frequency).

  2. **Near-Universal Conformity?**  
     - *Evidence Needed:* Mod logs sampling (≥80% compliance over 30d). Newcomer behavior (≥70% adopt P without prompting).  
     - *Sufficient Answer:* YES (proceed). NO → **TERMINATE: Not a convention** (may be aspirational norm or failing rule).  

  3. **Conditional Preferences?**  
     - *Evidence Needed:* User justifications in disputes ("I used Flair A *because others do*"). Poll: "Would you follow P if most others did?" (≥60% yes). Complaints *not* appealing to personal taste.  
     - *Sufficient Answer:* YES (proceed). NO → **TERMINATE: Not a convention** (P is likely driven by authority or intrinsic preference).  

  4. **Common Knowledge of (2) & (3)?**  
     - *Evidence Needed:* FAQ/references to P as "how we do things." Newcomers corrected by *users* (not just mods). No significant faction (~<10%) disputing P’s existence or general adherence.  
     - *Sufficient Answer:* YES (proceed). NO → **TERMINATE: Not yet/stably a convention** (needs broader awareness).  
     - *Technical Note:* Lewis’ "common knowledge" is approximated here – it’s the *practical mutual awareness* that sustains coordination.

  5. **Arbitrariness?**  
     - *Evidence Needed:* Viable alternative Q exists (e.g., different flair, post language). Poll: "Would Q work *as well* as P for coordination?" (≥60% yes). Historical accident origin (e.g., "We used Flair B until 2021").  
     - *Sufficient Answer:* YES → **CLASSIFY: Convention**. NO → **TERMINATE: Not a convention** (P may be functionally unique or value-laden).  
     - *Value Judgment?* **YES** (assessing "serves purposes as well" implicitly accepts current user purposes; e.g., English-only prioritizes cohesion over inclusion).  

  ---

  ### **Protocols Based on Classification**  

  #### **IF CONVENTION:**  
  - **Change Protocol:**  
    - Decree alone fails (unless it creates *salience*). To replace P with Q:  
      a. Make Q salient (e.g., trial period, pinned announcement, "focal" event like new term).  
      b. Ensure common knowledge of the switch attempt (transparency).  
      c. Monitor for conditional preference shift (users adopt Q *because others do*).  
  - **Enforcement/Deviation:**  
    - Excuse deviations if: Conformity dips temporarily (<60%), or salience is contested.  
    - Prioritize reinforcing expectations (reminders > bans) unless cascading collapse risks.  
  - **Stuck Equilibrium (e.g., everyone prefers Q but can’t switch):**  
    - Mods must engineer salience for Q (e.g., "Big Switch Day" with high-visibility push).  

  #### **IF NOT CONVENTION:**  
  - **Change Protocol:**  
    - Authority decree *can* work (no coordination equilibrium to preserve).  
    - Justify based on values/functionality (e.g., "Confidentiality protects individuals").  
  - **Enforcement:**  
    - Treat as policy, not custom. Apply consistently; appeals to "tradition" are invalid.  
  - **Drifting Practice:**  
    - If not convention, drift suggests irrelevance or shifting values. Intervene decisively.  

  ---

  ### **What Lewis Adds Over "Focal Point"**  
  - **Common knowledge** prevents misdiagnosis of fragile/emerging practices.  
  - **Arbitrariness** distinguishes conventions from functional necessities (e.g., privacy rules).  
  - **Conditional preferences** explain why decrees fail without broad buy-in.  
  The "machinery" explains *stability* and *change resistance* – focal points alone don’t capture self-perpetuation.  

  ---

  ### **Analysis of Your Cases**  

  1. **Flair Merger Proposal (e.g., "Course Help" + "Advice" → "Academic Support")**  
     - *Diagnosis:* **Convention** (arbitrary, conditional preferences evident in "everyone uses X" justifications).  
     - *Protocol:*  
       - Cannot decree change (risk of coordination failure like your spring crash).  
       - Make merged flair salient: Temporary banner, mods use it exclusively for 2 weeks, poll after trial.  
       - If resistance persists, it signals non-arbitrary attachment (e.g., identity signaling) → revisit diagnosis.  

  2. **Prohibition on Identifying Individuals**  
     - *Diagnosis:* **Not a convention.**  
       - *Why:* Not arbitrary (privacy/legal risks make alternatives worse). Preferences aren’t conditional ("Don’t doxx" is intrinsic).  
     - *Protocol:*  
       - Enforce as policy. Justify via harms ("This protects vulnerable people").  
       - Reject appeals to "normality" – it’s a rule, not a custom.  

  3. **English-Only Rule**  
     - *Diagnosis:* **Convention** (but with complications).  
       - Arbitrariness: YES (bilingual posts could work functionally).  
       - Conditional preferences: YES (users use English *because others do*; polls confirm conditional willingness).  
       - **Problem:** Fragmentation risk is real. If users expect others to post in multiple languages without coordination, readability drops → *even bilinguals* lose net utility.  
     - *Protocol:*  
       - **Abolishing by fiat will fail** and likely cause fragmentation.  
       - **Recommended path:**  
         a. Propose *structured alternatives* (e.g., "Tag [ES] in title for Spanish posts").  
         b. Make alternative salient: Biweekly multilingual discussion threads.  
         c. Build common knowledge: "Starting May 1, [ES] tags are encouraged."  
         d. Monitor: If conditional preferences shift (users post/escalate tagged posts), full relaxation may stabilize. If not, revert.  
       - **Key:** Mods must coordinate the salience boost – a naked rule change destroys the equilibrium.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Whether a convention is *good*.** Lewis is neutral on values (e.g., English-only may serve cohesion while excluding).  
  2. **Optimal alternatives.** It only confirms *if* a swap is possible, not *which* to choose.  
  3. **Crisis enforcement.** When conformity collapses, restoring order may require authority – not just salience.  
  4. **"Who the community is for."** Diagnosing conventions won’t resolve clashes over community identity.  

  **Final Note:** The procedure’s power lies in stopping you from misapplying "convention" to rules that require moral or functional justification. When the answer is "not a convention," *own the values* – it’s clearer and more honest than forcing Lewisian language onto non-coordination problems. Use the protocol for change management; it will prevent repeats of your spring collapse. For the English rule: engineer salience, don’t decree.
