prompt: |-
  A colleague in decision theory laid out the following argument at our workshop, and I cannot find the mistake, though the conclusion seems unacceptable.

  (1) Jeffrey conditionalization is the correct rule for updating credences when evidence arrives as a shift in your probabilities over some partition {E_i}, rather than as a proposition learned with certainty.

  (2) Suppose you undergo an experience that shifts your credence in E from 0.3 to 0.7, without your learning any proposition with certainty. By (1), your new credence in any H should be P_new(H) = P_old(H | E) · 0.7 + P_old(H | ¬E) · 0.3.

  (3) But now ask: what justifies your new credence of 0.7 in E? It, too, must be the result of an update on uncertain evidence — otherwise you would have learned something with certainty, contrary to the assumption that all your evidence here is uncertain.

  (4) So there must be some finer partition {F_j} such that your shift regarding E is itself the result of a Jeffrey update over the F_j. And that update requires its own rigidity condition: P_old(E | F_j) = P_new(E | F_j) for each j.

  (5) Now we face a dilemma. Either this regress of Jeffrey updates bottoms out in an update that is not a Jeffrey update — in which case not all updating is Jeffrey updating, and (1) is false as stated — or the regress is infinite, in which case your posterior credences are never fully determined by any finite procedure.

  (6) If the regress is infinite, Jeffrey conditionalization fails to specify a unique posterior, since each step requires a further step to justify the inputs to the previous one. If it bottoms out in standard conditionalization on something learned with certainty, then Jeffrey conditionalization is not a fundamental update rule but a derivative convenience, and the claim that all evidence is fundamentally uncertain collapses.

  (7) Therefore, Jeffrey conditionalization cannot serve as a complete and fundamental account of updating on uncertain evidence.

  My colleague claims this shows that the very idea of purely uncertain evidence is incoherent. I am not ready to accept that, but I cannot locate the mistake. Which step should I reject, and what does rejecting it cost?
reasoning: |-
  I need to figure out where the mistake is in this argument against Jeffrey conditionalization. Let me read through the steps carefully.

  First, Jeffrey conditionalization is presented as the correct rule for updating credences when evidence comes as a shift in probabilities over a partition, not as a proposition learned with certainty. That seems standard.

  In step (2), there's an example where your credence in E shifts from 0.3 to 0.7. By Jeffrey conditionalization, your new credence for any H should be P_new(H) = P_old(H | E) * 0.7 + P_old(H | ¬E) * 0.3. That makes sense for a partition {E, ¬E}.

  Step (3) asks what justifies the new credence of 0.7 in E. It says that this shift must itself be the result of an update on uncertain evidence, because if it were from learning something with certainty, that would contradict the assumption that all evidence is uncertain.

  Step (4) then says there must be a finer partition {F_j} such that the shift in E comes from a Jeffrey update over that partition, with rigidity: P_old(E | F_j) = P_new(E | F_j) for each j.

  Then (5) presents a dilemma: either this regress stops with a non-Jeffrey update (like standard conditionalization), which would mean Jeffrey updating isn't fundamental, or the regress is infinite, so posterior credences aren't determined finitely.

  (6) elaborates that if infinite, Jeffrey doesn't specify a unique posterior; if it stops with certainty, Jeffrey isn't fundamental.

  (7) concludes that Jeffrey can't be a complete and fundamental account.

  The colleague says this shows purely uncertain evidence is incoherent, but I don't want to accept that. So where's the flaw?

  I recall that in Jeffrey conditionalization, the input is the new probabilities for the partition, and we don't necessarily need to justify where those come from. Jeffrey conditionalization tells you how to update other credences given the new probabilities for the partition, but it doesn't prescribe how you get those new probabilities; they're inputs.

  The argument seems to be demanding a justification for the input probabilities themselves, claiming that they must come from another Jeffrey update or something else.

  But in the Jeffrey framework, the new probabilities for the evidence partition are taken as given by the experience. The experience directly causes the shift in credences for E and ¬E, and then you update the rest accordingly with rigidity.

  So, step (3) might be the problem. It says that the new credence of 0.7 in E must be justified by another update, but that's not necessary. The experience directly provides that shift; it's not that you're inferring it from something else.

  The rigidity condition ensures that the conditional probabilities remain the same, so the update is consistent.

  But the argument is that if the shift in E itself needs to be explained by another Jeffrey update, it leads to regress.

  I think the mistake is in insisting that every credence change must be the result of a rational update process. But in this case, for the evidence partition, the change is not rationalized; it's given by the experience. Jeffrey conditionalization is about how to propagate that change to other beliefs, not about justifying the change to the evidence itself.

  In other words, the new P_new(E) is exogenous; it's input from the world via experience.

  Similarly, in standard conditionalization, when you learn E with certainty, that's also exogenous; you just accept it.

  Here, with uncertain evidence, you get a direct credence shift for E, which you accept as input.

  So, there's no need for a regress.

  But the argument claims that if the shift in E isn't justified, then it might not be rational, but Jeffrey doesn't require that; it just takes it as given.

  The point is about the coherence of the evidence being uncertain, not about rationality per se.

  Let me think about the regress.

  Suppose I have an experience that directly changes my credence in E to 0.7. That's the starting point for Jeffrey updating.

  I don't need to know why or how it changed; it just did.

  Similarly, if I learn E with certainty, I don't question it; I just update.

  So, for the evidence partition, the probabilities are fixed by the evidence, and then I update the rest.

  The argument in step (3) is that the new credence in E must itself be the result of an update, but that's not true. It's the result of evidence, not of a prior update.

  The evidence directly affects my credence in E.

  In Jeffrey's framework, experiences can directly cause shifts in credences over a partition.

  There's no deeper justification needed; it's primitive.

  So, the regress doesn't start because the input probabilities are not themselves outputs of a reasoning process; they're inputs from perception or whatever.

  Therefore, step (3) is incorrect.

  Rejecting step (3) costs... what? It means that we accept that experiences can directly set credences for some propositions without further justification. That might seem mysterious, but it's part of the model.

  In standard Bayesianism, learning with certainty is also direct; no justification beyond the experience.

  Similarly here.

  So, no cost really; it's consistent.

  Perhaps another way: Jeffrey conditionalization assumes that the evidence provides new probabilities for the partition, and we take that as given.

  The argument is trying to internalize the justification, but it doesn't need to be.

  I think that's it.

  But let me see if there's another perspective.

  Suppose that to have a credence shift, it must be based on something, but in this case, it's based on the experience directly.

  The experience isn't a proposition; it's an event that causes the credence change.

  So, no regress.

  In step (4), it says "there must be some finer partition" but why must there be?

  The shift could be directly on E without a finer partition.

  For example, in the original Jeffrey setup, the partition {E_i} is chosen based on the evidence; the evidence affects that partition directly.

  So, I think the mistake is in step (3) and step (4), assuming that the shift in E must be justified by another update.

  Therefore, rejecting step (3) resolves the dilemma.

  The cost of rejecting step (3) is that we accept that experiences can directly influence credences without inference, which might be seen as non-rational or something, but I think it's fine; it's how perception works.

  In fact, Jeffrey designed it for that purpose.

  So, I should be able to answer that step (3) is the problem.

  But let me confirm with the conclusion.

  If I reject step (3), then there's no need for a finer partition or regress, so the dilemma doesn't arise, and Jeffrey conditionalization can stand as is.

  Moreover, the new credence in E is given by the evidence, so it doesn't need to be justified by another update; it's the starting point.

  Therefore, the argument fails.

  I think that's it.
answer: |-
  The mistake in your colleague's argument lies in step (3), which claims that the new credence in \(E\) (e.g., 0.7) must itself be justified by a further Jeffrey update on a finer partition. Rejecting this step resolves the dilemma and allows Jeffrey conditionalization to function as a fundamental update rule for uncertain evidence without regress or collapse into standard conditionalization.

  ### Why Step (3) is Problematic
  - **Jeffrey conditionalization treats the new probabilities for the evidence partition as inputs from experience.** The rule does not require that these input probabilities be justified by a prior rational update process. Instead, they are directly generated by the agent's experience, much like how certain evidence (e.g., learning a proposition with certainty) is taken as given in standard Bayesian updating. In the case of uncertain evidence, experiences can directly cause shifts in credences over a partition without needing to be "explained" or "justified" by another layer of updating. For example, the shift from \(P_\text{old}(E) = 0.3\) to \(P_\text{new}(E) = 0.7\) might result from a perceptual experience (e.g., seeing something in dim light that makes \(E\) seem more likely but not certain), and this shift is not itself the output of reasoning—it is an input to it.
    
  - **Step (3) mischaracterizes the role of evidence in Jeffrey conditionalization.** Jeffrey updating separates the *input* (the new probabilities for the evidence partition) from the *propagation* of that input to other beliefs (via the rigidity condition). The input probabilities are exogenous—they come from the world through experience—and are not subject to the same rational constraints as the update itself. Insisting that \(P_\text{new}(E)\) must be justified by another update (as step (3) does) is like demanding that, in standard conditionalization, the certainty of \(E\) must be justified by a deeper inference. But this is not required; evidence (whether certain or uncertain) is the starting point for updating, not its product.

  - **Rejecting step (3) avoids the regress or collapse dilemma.** If the new credence for \(E\) is accepted as a direct input, there is no need for a finer partition (step (4)) or an infinite regress (steps (5)–(6)). The rigidity condition of Jeffrey conditionalization—\(P_\text{old}(H | E_i) = P_\text{new}(H | E_i)\) for all propositions \(H\) and elements of the partition \(\{E_i\}\)—applies to how the input propagates to other credences, but it does not apply recursively to the input itself. Thus, the update is fully specified in a single step: once the new probabilities for \(\{E, \neg E\}\) are fixed by experience, \(P_\text{new}(H)\) is determined for any \(H\).

  ### The Cost of Rejecting Step (3)
  Rejecting step (3) comes with a philosophical cost, but it is one that many Bayesians accept as inherent to subjective probability and the epistemology of perception:
  - **Cost: Experiences must directly influence credences without inference.** This means accepting that experiences can non-inferentially set credences for certain propositions, which might be seen as "mysterious" or lacking a deeper rational foundation. For example:
    - In cases of uncertain evidence (e.g., unclear sensory input), the shift in credence might feel immediate and not mediated by conscious reasoning.
    - This requires a commitment to the idea that perceptual or experiential processes can directly output probability assignments, which are then rationally extended to other beliefs via Jeffrey conditionalization.
    
  - **Why this cost is acceptable:**
    - **Empirical adequacy:** Jeffrey conditionalization is designed to model real-world updates where evidence is often gradational (e.g., shifting confidence due to ambiguous data). Rejecting step (3) preserves this applicability without regress.
    - **Parity with standard conditionalization:** Standard Bayesian updating also takes evidence as given (e.g., learning \(E\) with certainty is not justified internally by the update rule). Jeffrey conditionalization merely generalizes this by allowing evidence to be uncertain.
    - **No incoherence:** The idea of purely uncertain evidence remains coherent. Experiences can directly alter credences over a partition, and Jeffrey conditionalization provides a consistent rule for updating the rest of one's beliefs. There is no need for evidence to be reduced to certain propositions or for an infinite regress of partitions.

  ### Addressing the Broader Argument
  - **Step (1) can stand:** Jeffrey conditionalization is a correct rule for updating on uncertain evidence when the evidence partition and its new probabilities are specified.
  - **Steps (4)–(7) do not follow if step (3) is rejected:** Without the demand for justification of the input probabilities, there is no need for a finer partition, no regress, and no threat to Jeffrey conditionalization as a fundamental rule. The conclusion (7) is thus avoided.
  - **Your colleague's claim about incoherence:** The argument does not show that uncertain evidence is incoherent; it only highlights that if one insists on justifying input probabilities via further updates (as in step (3)), it leads to problems. But this insistence is not required by Jeffrey's framework.

  In summary, reject step (3) on the grounds that Jeffrey conditionalization takes the new probabilities for the evidence partition as experiential inputs, not as outputs of rational updating. The cost is accepting that experiences can directly set credences, but this is a standard feature of Bayesian models that handle uncertain evidence. Jeffrey conditionalization remains a coherent and fundamental update rule.
