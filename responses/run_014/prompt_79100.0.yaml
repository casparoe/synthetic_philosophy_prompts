  - Counterfactual dependence tracks responsibility
  - Not all omissions are equal (e.g., sleeping adult vs neglectful one)

  The test case with four adults near a drowning child is perfect. Both sides can agree the sleeping adult (2nd) differs from the neglectful one (1st) in responsibility, but disagree on whether their causal status differs metaphysically. The 4th adult (who sees and leaves) might reveal if restrictionists conflate evidence with metaphysics.

  The substitution test ("the lifeguard's swimming would have prevented drowning" → "not-swimming caused drowning") seems to beg the question against restrictionists by assuming omissions can be causes. Better to present it neutrally as a diagnostic tool.

  Shadow events might bridge the gap - inclusionists could see them as what omissions "point to," while restrictionists as what causation actually involves. But restrictionists may reject the concept entirely.

  Biggest risk is the document smuggling in inclusionist vocabulary by using "omission" as a noun (implying entity status). I'll use verbal phrases like "failing to act" for neutrality.

  Finally, I'll keep it concise - no bibliography, no named theorists, just the bare logical structure. If the positions turn out compatible (unlikely here), I'll say so, but they seem genuinely opposed on whether causation requires occurrent events.
answer: |-
  ## Joint Statement on Causation by Omission: Adversarial Collaboration

  **Preamble:**  
  This document outlines points of agreement and disagreement between two perspectives ("Inclusionist" and "Restrictionist") on causation by omission. It uses a standardized drowning-child case as a reference framework. Both parties affirm that this statement accurately represents their core positions without imposing the other’s ontological or semantic commitments. Terminology is chosen for neutrality; "omission" refers to *an agent’s failure to perform a specific action in context*.

  ---

  ### Part 1: Agreed Claims  
  1. **Moral/Legal Asymmetry**: Moral responsibility and legal liability for omissions exist independently of the metaphysical status of omissions as causes. An agent can be blameworthy for failing to act even if their omission is not metaphysically identical to an action.  
  2. **Counterfactual Dependence**: In the drowning-child case, the outcome counterfactually depends on the failure of certain agents to intervene. If a competent adult had acted appropriately (e.g., the first adult had stopped reading), the child would not have drowned.  
  3. **Variability in Omissions**: Not all failures are equivalent. The *reason* for failure matters morally and legally (e.g., the first adult’s neglect vs. the second adult’s incapacity).  
  4. **Epistemic Constraints**: Our *knowledge* of omissions is often inferential and context-dependent, but this does not entail that omissions themselves lack determinate features.  
  5. **Shadow Events as Heuristic**: The "shadow event" (the action that *would* have occurred if the agent had acted) is a useful conceptual tool for analyzing counterfactuals, but its ontological status is disputed (see Part 3).  

  ---

  ### Part 2: Disagreements Table  
  | Crux                                                                 | Inclusionist Position                                                                 | Restrictionist Position                                                                 |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------- |
  | **1. Relata of Causation**                                           | Omissions (failures to act) are genuine causal relata, ontologically on par with events. | Only *occurrent particulars* (events, states, processes) can be causal relata; omissions are absences and thus cannot be causes. |
  | **2. Counterfactual Dependence**                                     | Counterfactual dependence suffices for causation; omissions cause outcomes via this dependence. | Counterfactual dependence is evidence for causation but not constitutive of it; omissions generate dependence without being causes. |
  | **3. Semantics vs. Pragmatics**                                      | Claims like "the omission caused the drowning" are semantically true and refer to a causal relation. | Such claims are pragmatic shorthand for assigning responsibility; they are not literally true (e.g., "the lack of water caused the desert" is figurative). |
  | **4. Determinate Fact of the Matter**                                | There is a metaphysically determinate fact about whether an omission caused an outcome. | "Causation by omission" describes a derivative (e.g., normative) relation; there is no additional metaphysical fact beyond occurrent causation and counterfactuals. |

  ---

  ### Part 3: Test Case Analysis & Predictions  
  **Scenario**: An infant drowns in a bath. Four adults are present:  
  - **Adult 1**: Competent, in next room, reads and does not intervene.  
  - **Adult 2**: Asleep, could not have heard.  
  - **Adult 3**: Hears, intends to help, but is struck by a car en route.  
  - **Adult 4**: Walks in, sees child, walks out.  

  #### Agreed Framework for Testing Cruxes:  
  1. **Adult 1 vs. Adult 2**:  
     - **Agreed Difference**: Adult 1’s failure is blameworthy; Adult 2’s is not.  
     - **Crux 1 (Relata)**:  
       - *Inclusionist*: Both omissions cause the drowning (same relata).  
       - *Restrictionist*: Neither omission *causes* drowning; only the child’s submersion does.  
     - **Crux 2 (Counterfactual)**:  
       - Both agree drowning counterfactually depends on both failures.  
       - *Inclusionist*: This confirms causation.  
       - *Restrictionist*: This confirms responsibility, not causation.  

  2. **Adult 4 vs. Adult 1**:  
     - **Agreed Evidence Difference**: Adult 4’s intent and awareness provide stronger evidence for blame.  
     - **Crux 3 (Semantics/Pragmatics)**:  
       - *Inclusionist*: Adult 4’s omission causes drowning *in the same metaphysical sense* as Adult 1’s; evidence differs, not the relation.  
       - *Restrictionist*: "Caused" is pragmatic; we cite Adult 4’s omission to emphasize deliberate disregard, not an additional causal relation.  
     - **Crux 4 (Determinacy)**:  
       - *Inclusionist*: There is a fact: both omissions *are* causes.  
       - *Restrictionist*: The only fact is that (i) drowning occurred, and (ii) both adults failed in ways making them responsible.  

  #### Machinery Evaluation:  
  - **Substitution Test**:  
    - *Inclusionist*: Accepts. "Adult 1’s not-swimming caused drowning" ↔ "Adult 1’s swimming would have prevented drowning" are equivalent.  
    - *Restrictionist*: Rejects. The test assumes omissions can be causes (begs the question).  
  - **Shadow Event**:  
    - *Inclusionist*: Accepts as the "positive counterpart" of the omission.  
    - *Restrictionist*: Rejects; shadows are mere counterfactual constructs, not grounding causation.  

  ---

  ### Honest Pushback  
  1. **Verbal Disagreement on Crux 1**: The relata dispute is partially verbal. Restrictionists define "cause" as requiring *occurrent particulars*; Inclusionists use "cause" more broadly. Both agree omissions lack spatiotemporal location and are not "occurrent," but disagree on whether to extend "cause" to cover them.  
  2. **Compatibility Warning**: Positions *cannot* be reconciled ontologically. The joint statement avoids smuggling vocabulary by:  
     - Using verbal phrases ("failing to act") instead of reifying "omissions."  
     - Separating metaphysical claims (Parts 2–3) from normative ones (Part 1).  
  3. **Case Template Bias**: The template is fair but favors Restrictionists in *epistemic* comparisons (e.g., Adult 4). Inclusionists must argue metaphysical equivalence despite evidential differences.  
  4. **Core Disagreement**: Whether causation is an *occurrent relation* (Restrictionist) or a *counterfactual relation* (Inclusionist). The drowning case tests this via Adults 1–3:  
     - Adult 3’s prevention-by-car is an *occurrent event* interrupting action. Restrictionists see this as the only "cause" of non-intervention; Inclusionists see the omission as the cause regardless of *why* it occurred.  

  ---

  **Signatories:**  
  [Inclusionist Camp Representative]  
  [Restrictionist Camp Representative]  

  ---  
  *This document distinguishes conceptual, normative, and metaphysical claims. It does not resolve whether omissions "are causes" but clarifies why the dispute persists and how future evidence might bear on it.*
