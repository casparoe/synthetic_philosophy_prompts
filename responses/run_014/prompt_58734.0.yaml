  Word count is crucial (550-650 words). I outline responses to hit this range: intro (50), first letter+reply (250), second letter+reply (250), sign-off (50). Language must balance accessibility and wit—avoid academic jargon but include subtle nods (e.g., "particularistic duties" for philosophy-savvy readers).

