  - Shallow pond (j): Realistic, survives paraphrase well

  For each, I'll assign D/G tag (diagnostic or generative), score all dimensions, compute composite, and assign tier (1=best to 4=worst). I'll be careful to note where my own biases might affect scores - like being more skeptical of zombie arguments.

  The two most sensitive placements will be the experience machine and Chinese room since their high Y scores depend heavily on my weighting choice. If I weighted Y lower, they might drop a tier.

  For rubric audit, I think Convergence (C) is weakest because disagreement might indicate depth rather than weakness. Fake barns and stopped clock show this - they have moderate C but high value.

