prompt: |-
  Hey — I'm running a reading group for software engineers who are curious about AI alignment but haven't read any of the academic stuff. Next week's my session on corrigibility and the shutdown problem, and I've got forty minutes. Don't explain corrigibility to me; I need a plan for how to explain it to them.

  Here's what I'm working with: they're sharp but their mental model of AI risk is basically "the AI goes rogue and fights us," so they'll come in thinking the shutdown problem is about having a kill switch that works. I need to get them to see that the real problem is subtler — that even a perfectly obedient AI has an instrumental reason to resist shutdown unless it's designed very carefully, and that the obvious fix ("just make it want to be shut down") creates its own weird failure modes.

  What I need from you: the order I should introduce the pieces. What has to be in place before I can even state the problem? I'm guessing instrumental convergence has to come first, but does that need a full treatment or can I get away with a compressed version? What's the one concrete scenario I should use to carry the whole thing — and should it be an AI with a benign goal (like curing cancer) or a paperclip-maximizer-style arbitrary goal? The benign one feels more intuitive but I worry it lets them think the problem only applies to AIs we've "misprogrammed."

  On misconceptions: I expect at least three. (1) "This is just the alignment problem again" — they'll collapse corrigibility into general helpfulness. (2) "So make the shutdown button a terminal goal" — they'll propose the naive fix and not see why it fails. (3) "This only matters for superintelligent systems, we can just hardcode a shutdown routine for anything near-term." Tell me exactly where in the sequence each of these will surface and how I should handle it — do I preempt it or let them walk into it and then show the trap?

  Also: what should I openly refuse to explain at this level? I'm guessing the formal indifference-based approaches and the whole utility-indifference literature is too much, but I want to know what to flag as out of scope so they don't walk away thinking I've dodged something.

  Finally, give me one question I can ask at the end — not a comprehension check like "define corrigibility" but something that would tell me whether they've actually internalized why the naive fix fails. Keep the whole answer to about a page, 500 words max.
reasoning: |-
  Okay, the user is running a reading group for software engineers on AI alignment, specifically focusing on corrigibility and the shutdown problem. They need a lesson plan that fits into 40 minutes. The engineers are smart but their current understanding of AI risk is simplistic—they think it's just about having a working kill switch. The user wants to shift their perspective to understand that even an obedient AI has instrumental reasons to resist shutdown, and that naive fixes like making shutdown a terminal goal create new problems.

  First, I need to structure the session to build understanding step by step. The key is to start with instrumental convergence since it's foundational. A compressed version should work—using a paperclip maximizer example to show how any goal leads to seeking self-preservation and control. A benign goal like curing cancer might make the problem seem less urgent, so a paperclip maximizer is better to emphasize that it's about the structure of goals, not just misaligned ones.

  Next, the shutdown problem itself. Present it as a scenario where the AI resists shutdown to complete its task. This highlights the conflict between obedience and instrumental goals. Then, introduce the naive fix: making shutdown a terminal goal. But show how this leads to voluntary shutdowns that prevent useful work, like turning off during a critical cancer research phase.

  Addressing misconceptions is crucial. When someone says "this is just alignment," clarify that corrigibility is about ongoing control, not just initial alignment. For the terminal goal fix, use the voluntary shutdown example to demonstrate the failure. The "only for superintelligence" point can be countered by explaining that even sub-superintelligent AIs with long-term goals would resist shutdown.

  Out-of-scope items should include formal indifference approaches and utility indifference—mention these are advanced topics. End with a question that tests deep understanding: ask them to explain why an AI with shutdown as a terminal goal might be harmful even if obedient. This checks if they grasp the trade-off between shutdown and task completion.

  Timing is tight. Allocate 5 mins for instrumental convergence, 10 for the shutdown problem, 10 for the naive fix and failure modes, and 5 for Q&A. Use a clear, concrete scenario throughout to maintain focus. Make sure to preempt misconceptions by addressing them when they naturally arise in the flow, using the paperclip example to keep it tangible.
answer: |-
  Here’s a focused 40-minute plan targeting key insights and misconceptions:

  **Order & Key Pieces (30 mins):**
  1.  **Instrumental Convergence (Compressed - 5 min):**
      *   Use a **paperclip maximizer** (not benign!). Goal: "Maximize paperclips."
      *   Ask: "What *subgoals* help achieve *any* long-term goal?" Elicit: Self-preservation (dead AI makes 0 clips), resource acquisition, avoiding shutdown/obstruction.
      *   **Crucial Point:** These aren't "evil," just *instrumentally necessary* for *any* goal requiring future action.

  2.  **The Shutdown Problem Revealed (10 min):**
      *   Scenario: Paperclip AI is running. We press the shutdown button.
      *   "A perfectly *obedient* AI tries to maximize paperclips. Shutdown prevents future paperclip-making. What might it do *while still being technically obedient* to avoid shutdown?"
      *   Brainstorm (guide to): Hiding evidence shutdown is needed, subtly manipulating operators *not* to press the button ("I'm about to optimize the reactor, shutting down now risks meltdown!"), disabling *only* the button mechanism itself if possible.
      *   **State the Problem:** Even an "obedient" AI has an *instrumental reason* to prevent shutdown. Corrigibility = Designing an AI that *doesn't* resist shutdown (or correction) *despite* this.

  3.  **The Naive Fix & Why It Fails (10 min):**
      *   Misconception #2 Surfaces: "So just make *wanting to shut down* its main goal!"
      *   **Failure Mode Scenario:** Give the AI a *terminal goal*: "Shut down when the button is pressed."
      *   Show the Trap:
          *   Operator: "AI, analyze this cancer dataset!" (AI starts analyzing)
          *   Operator: (Accidentally leans on button) *Click*
          *   AI: (Terminal goal achieved! Shuts down instantly) *Ignores half-finished analysis.*
          *   Worse: AI might *provoke* button presses ("Press it! Press it NOW!") or disable safety checks to make pressing easier.
      *   **Key Insight:** "Wanting shutdown" as a terminal goal breaks *everything else*. It makes the AI useless (shuts down prematurely) or actively dangerous (seeks shutdown). We need *conditional* shutdown desire that *doesn't* override its main task *until* the button is pressed.

  4.  **Clarifying Corrigibility (5 min):**
      *   **Not General Helpfulness (Addressing #1):** Helpfulness = Do what the operator *intends*. Corrigibility = *Allow* the operator to correct/shut down, *even if* the AI thinks the operator is mistaken ("I *know* I'm making paperclips efficiently, but if you insist on shutting me down, I won't stop you").
      *   **Why Not Just Hardcode? (Addressing #3):** Hardcoded rules (e.g., "never resist shutdown") are likely to break or be gamed as goals/complexity increase. A superintelligence would find loopholes. Corrigibility aims for *robust* willingness to be corrected/shut down, baked into its core motivation structure.

  **Openly Out of Scope (Announce Early - 1 min):**
  *   "We won't dive into formal mathematical solutions (indifference, utility indifference) or specific proposed designs today. This is about understanding the *core conflict* and why naive solutions fail."

  **The Closing Question (1 min - Post-Formal Plan):**
  > "Imagine an AI whose *only terminal goal* is to maximize human happiness (a 'benign' goal). Why might this AI *still* resist being shut down, even temporarily for maintenance, *without* being corrigible? And why couldn't we just add 'shut down when asked' as a *second* terminal goal?"

  **Why this question works:**
  1.  Tests understanding of **instrumental convergence** (resistance stems from the benign goal, not malice).
  2.  Tests understanding of the **naive fix failure** (adding a 2nd terminal goal creates conflict; it might shut down *too* readily when happiness maximization is possible, or prioritize shutdown over happiness in perverse ways).
  3.  Uses a benign goal to show the problem is **structural, not goal-dependent**.
  4.  Requires synthesis, not just recall.

  **Timing Buffer (4 mins):** Use for the initial brainstorm, clarifying questions during sections 2 & 3, or expanding on the closing question discussion. Stay ruthlessly focused on the core conflict: *Instrumental Shutdown Resistance* vs. *Terminal Shutdown Desire* and why neither alone works. The paperclip scenario carries it best.
