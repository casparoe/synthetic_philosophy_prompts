prompt: |-
  Three tickets landed on my desk this week and they're all the same ticket wearing different clothes: somebody wants a new category node whose name is a compound. Grade 8.8 hex bolt. Stainless hex bolt. Yellow zinc bolt.

  I run the catalog and search taxonomy at a mid-size industrial fastener distributor — about 45k SKUs, mostly bolts, nuts, washers and anchors plus some tooling. We have a category tree three levels deep, and attribute facets layered on it: material, finish, thread size, length, drive type, standard, property class. Search resolves to a tree node first and then filters by facet. The attributes exist but theyre populated inconsistently; the good suppliers send full spec sheets and the cheap ones send a part number and a shrug.

  I get maybe a dozen of these tickets a week from sales reps and category managers, and I have to say yes or no to each one. If I say no and they were right, customers cant find things and the reps route around the catalog entirely by emailing spreadsheets to each other, which is worse than the problem. If I say yes too often, in two years we have four thousand leaf nodes, every modifier combination has its own home, and a search for plain hex bolt no longer returns most of the hex bolts we actually sell. Two junior catalogers screen the tickets before they reach me. They're sharp but they've never studied taxonomy or philosophy and they are not going to read a theory, so whatever you give me has to run in about 15 minutes a ticket, in plain English, and the only sign-off gate is me.

  Here's the part that'll sound strange. I've been reading the White Horse dialogue in the Gongsun Longzi — the School of Names one where a speaker argues that a white horse is not a horse — and I think it's genuinely about my problem and not just an analogy I'm forcing onto it. As I understand it the argument runs: horse is the name for the shape, white is the name for the color, and what names a color isn't what names a shape. Then the move I care about: if you ask for a horse, a yellow one or a black one can be delivered, but if you ask for a white horse, a yellow or black one cannot be delivered — so the two names are not interchangeable in a request even though every white horse is a horse. There's also the hardness-and-whiteness dialogue, where the stone gives you its whiteness by eye and its hardness by hand and each sense misses what the other picks up, so the two properties come apart and each one drops out of view when you're not attending to it. And the name-and-actuality chapter, where every thing is supposed to sit in its proper position, a dislocated name is what generates the confusion, and rectifying a name means putting it back in the position that matches its actuality.

  If you think I've mangled any of that, tell me — I'm working from memory of translations I read a while ago and I don't want to build a company procedure on a misreading. But please don't hand me citations or a reading list, I have no way to chase them and I'd much rather have your reasoning than your references.

  So: turn that into a decision procedure. What I need is

  - the questions to ask, in the order a cataloger should ask them;
  - what counts as a sufficient answer to each one — not "consider whether X" but what in the ticket, the SKU record, or the supplier's paperwork actually settles it;
  - where the procedure terminates in a NO (this is a filter, not a category) and the sentence the cataloger writes back to the rep;
  - where it terminates in a YES and gets escalated to me, and what has to be in the note so I can sign it off without redoing the analysis;
  - where it stops being a factual question and hands the call to a human because it's a tradeoff — catalog bloat versus customer friction, or liability, or a commercial bet — and how the cataloger should frame that so whoever decides has what they need;
  - how it handles the cases that usually break procedures like this: a modifier that's physically invisible on the part and only knowable from a mill certificate or a head marking, a modifier that means different things to different suppliers, and a modifier that's really about the buyer's use or regulatory regime rather than about the item at all.

  Two of my own hunches you should test rather than accept. One: I think the whole question reduces to a warehouse-floor test — would the picker be allowed to substitute a thing that lacks the modifier, and would anyone downstream be harmed if they did. If substitution is fine it's a facet, if substitution is a breach it's a kind. The other: I think a lot of these tickets are actually complaints that an attribute value is sitting in our data but nothing surfaces it, so the property is there but hidden, and the rep asks for a node because a node is the only thing they know how to ask for. If that's right the procedure should be able to detect it and send the ticket to a data-quality fix instead of a taxonomy change.

  Be honest about which of the four ideas above actually carries weight here and which is decoration I should drop. I suspect at least one of them is just pretty and won't survive contact with a fastener database, and I'd rather you say which one than quietly build the procedure on the three that work.

  Then run the procedure end to end on the three real tickets:

  1. Category manager wants grade 8.8 hex bolt as its own node under hex bolts. Property class is invisible on the part, it comes off a mill cert or a head stamp, and if a rep swaps a 4.8 into a customer's structural joint we are having a very bad conversation with our insurer.
  2. A rep with three large accounts wants stainless hex bolt as a node. Material is already a facet and populated for maybe 80% of SKUs. He says customers type the compound as one phrase and get junk back.
  3. Yellow zinc bolt. Half our suppliers mean a yellow chromate, a third mean a clear trivalent passivate that looks faintly yellowish under warehouse lights, and one means a coating that is literally dyed yellow.

  At least one of these should come out in a way that makes the requester furious. If all three come out yes, you haven't written a procedure, you've written a rubber stamp.

  Also say plainly what the procedure can't settle, and where you'd expect it to misfire most often.

  Before you write any of it, spend a short section brainstorming out loud: which of those ideas does the load-bearing work, what would have to be true about our data for each to be usable, and what's the cheapest version of the test that still tells you something. Think it through rather than pattern-matching this to a generic product-taxonomy blog post. Write as someone who has done both halves of this — a philosopher of language who has also had to build and maintain a live product ontology and got blamed when it broke.

  Last thing, and it matters to me: end with a section on what would change your mind. Which argument or which piece of evidence would make you say the white-horse framing is the wrong frame for this decision and I should be running something else entirely? And inside the procedure you give me, which single step is most likely to fail in practice, what would that failure look like in our ticket queue, and how would I notice it before a customer notices it?
reasoning: |-
  Okay, let me start by understanding the user's problem. They manage a catalog for an industrial fastener distributor with around 45k SKUs. They're getting tickets requesting new category nodes for compound names like "Grade 8.8 hex bolt," "Stainless hex bolt," and "Yellow zinc bolt." The challenge is balancing between creating too many categories (leading to bloat) and not having enough (causing findability issues). They mentioned that if they say no, sales reps bypass the catalog with spreadsheets, which is worse. If they say yes too often, the catalog becomes fragmented.

  The user references the White Horse dialogue from the Gongsun Longzi, drawing parallels to their taxonomy issue. They want a decision procedure based on those philosophical ideas but applied practically. Their main needs are a step-by-step process for the catalogers, clear criteria for yes/no decisions, handling edge cases, and testing their hunches about warehouse substitution and hidden attributes.

  First, I need to unpack the philosophical concepts they mentioned. The "white horse is not a horse" argument emphasizes that compound terms specify attributes that aren't interchangeable. The hardness-whiteness example shows properties are perceived through different senses and can't be combined. The rectification of names is about ensuring terms match reality without confusion. Among these, the core idea is that specificity in names affects deliverability. If asking for a white horse, you can't substitute a black one. Applied to their catalog, if a modifier changes what can be delivered (like Grade 8.8), it might need a category. Otherwise, it's a facet.

  Testing their hunches: The warehouse substitution test makes sense. If swapping the part without the modifier causes issues (safety, liability), it's a category. The second hunch about hidden attributes is also valid—reps might ask for nodes because attributes aren't surfaced properly. The procedure should identify such cases and reroute to data fixes.

  Building the decision procedure:
  1. **Clarify the Request:** Ensure the ticket specifies the compound term and what it refers to.
  2. **Attribute Check:** Verify if the modifier is an existing attribute. If not, it might need data cleanup.
  3. **Substitution Test:** Can the picker substitute a generic part? If no, it's a category candidate.
  4. **Ambiguity Check:** Is the modifier interpreted consistently? Inconsistencies mean it shouldn't be a category.
  5. **Escalation Criteria:** If the modifier passes substitution and consistency checks, it goes to the user for final approval considering business impact.

  Applying this to the three tickets:
  1. **Grade 8.8 Hex Bolt:** Substitution isn't allowed (safety risk), so it should be a category node.
  2. **Stainless Hex Bolt:** Material is a facet, but if searches fail due to compound terms, maybe improve search or data quality. Not a category.
  3. **Yellow Zinc Bolt:** Inconsistent definitions; substitution might be acceptable unless specified. Facet, not category.

  The user mentioned at least one should be a "no" to avoid rubber-stamping. Here, Stainless and Yellow Zinc likely are nos, while Grade 8.8 is yes.

  Potential pitfalls: The substitution test might be hard to apply if the impact isn't clear. Catalogers might struggle to assess downstream harm. Also, ambiguity checks require supplier data, which might be incomplete. Monitoring ticket resolutions and search logs could help catch issues early.

  What would change my mind? If most modifiers didn't affect deliverability, the substitution test wouldn't hold. Also, if data quality were high, the hidden attribute issue might be less critical. The procedure hinges on deliverability as the key differentiator.
answer: |-
  Below is a decision procedure built on the core insight from the White Horse dialogue: **A compound term demands a new category only if the modifier changes what can be *delivered* (i.e., substituted) without harm.** This distills the "white horse is not a horse" argument into a practical test. The hardness/whiteness and rectification of names concepts act as supporting lenses—helpful for edge cases but not central. Your warehouse-floor substitution hunch is the operational engine; the hidden-attribute hunch is a critical diagnostic step. The procedure focuses on *deliverability* as the load-bearing idea.

  ### Why This Frameworks Works (and What Doesn't)
  - **Core Insight (Deliverability)**: The White Horse argument centers on whether the modifier alters the request's fulfillment conditions. If "hex bolt" suffices for delivery, "stainless hex bolt" is a filter. If "grade 8.8 hex bolt" *must* be delivered as-specified, it’s a distinct "kind." This directly maps to your substitution test.
  - **Supporting Concepts**: 
    - *Hardness/whiteness*: Helps when a property is context-dependent (e.g., "yellow zinc" under different lighting). Not decisive but flags ambiguity.
    - *Rectification of names*: Reinforces that categories must match reality (e.g., inconsistent definitions break this). Used to reject incoherent terms.
  - **Discarded Concept**: The sensory-separation idea (hardness vs. whiteness) is poetic but doesn’t add actionable value beyond ambiguity checks. Real-world data constraints (e.g., mill certs) are better handled by your substitution test.
  - **Cheapest Test**: **"Would substituting a generic part cause harm?"** If yes, the modifier defines a deliverable kind. Requires only common sense + basic product knowledge. No data perfection needed.

  ---

  ### Decision Procedure: The Deliverability Test  
  **Time Budget**: 10–12 minutes/ticket. Catalogers use this flow, escalating only when specified.  
  **Tools Needed**: SKU records, supplier specs (if available), and 30 seconds of critical thinking.  
  **Outputs**: Clear "NO" with rationale, "ESCALATE" with evidence, or "DATA FIX" ticket.

  #### Step 1: Clarify the Request (1 min)  
  - **Question**: "What compound term is requested? What does the modifier refer to?"  
  - **Sufficient Answer**: The ticket must name the compound (e.g., "stainless hex bolt") and the modifier (e.g., "material: stainless steel"). If vague (e.g., "we need a category for specialty bolts"), bounce back for specificity.  
  - **Termination**: If unclear after one follow-up, close ticket: *"NO. The request doesn’t specify what makes these bolts distinct. Please resubmit with the exact compound term."*

  #### Step 2: Hidden Attribute Check (Your Second Hunch) (3 min)  
  - **Question**: "Is the modifier already an attribute in our system? Is it populated?"  
  - **Sufficient Answer**:  
    - Check SKU records/supplier docs. If the attribute exists but is >20% unpopulated or inconsistent, it’s a data issue.  
    - If customers search for the compound (e.g., "stainless hex bolt") but our search fails due to poor data, it’s not a taxonomy problem.  
  - **Termination**: If the attribute exists but data is bad, route to data team: *"NO. 'Material' is already a filter. Routing ticket to data team to fix 'stainless' values. Filters will work once populated."*  
  - **Escalation**: If the attribute *doesn’t exist* but should (e.g., "UV-resistant"), escalate to you with: *"Propose new attribute: [modifier]. Not in current schema. Substitution test pending."*

  #### Step 3: Substitution Test (The Warehouse Floor) (4 min)  
  - **Question**: "Could a picker substitute a generic part (e.g., any hex bolt) for one with this modifier without causing harm?"  
  - **Sufficient Answer**: Use supplier specs, mill certs, or known use cases. Harm = safety risk, liability, regulatory breach, or contractual violation.  
    - ✅ **No harm**: Modifier is a nice-to-have (e.g., "yellow" for aesthetics). → **Facet**.  
    - ❌ **Harm**: Modifier is essential (e.g., grade 8.8 in structural applications). → **Potential category**.  
  - **Termination (NO)**: If no harm, reject: *"NO. '[Modifier]' is a filter, not a category. Pickers can substitute any [base category] if [modifier] is missing. We’ll improve attribute visibility."*  
  - **Escalation (YES)**: If harm, escalate to you with: *"Substitution would cause harm: [evidence]. Propose new category: [compound term]."* Include:  
    - Source of harm (e.g., "Insurance requires grade 8.8 for structural use").  
    - Proof (e.g., supplier spec snippet, industry standard).  

  #### Step 4: Ambiguity Check (Rectification of Names) (2 min)  
  - **Question**: "Do suppliers/standards agree on what this modifier means?"  
  - **Sufficient Answer**: Check SKUs for conflicting definitions (e.g., 3 suppliers = 3 meanings of "yellow zinc").  
  - **Termination (NO)**: If inconsistent, reject: *"NO. '[Modifier]' has no agreed-upon definition. Creating a category would mislead customers. Use case-specific attributes instead."*  
  - **Termination (HUMAN TRADEOFF)**: If ambiguous *but* substitution causes harm (rare!), escalate: *"Ambiguous term but substitution harmful. Business must decide: accept catalog bloat or risk customer friction. Evidence: [conflicting definitions] + [harm proof]."*

  #### Step 5: Edge Case Handling  
  - **Invisible properties (e.g., grade)**: Covered by substitution test. If mill certs are required for delivery, it’s a category.  
  - **Modifier = buyer’s use case (e.g., "marine-grade")**: Only a category if substitution *physically* harms the application (e.g., corrosion in saltwater). Else, it’s a filter + content guidance.  
  - **Supplier-specific meanings**: Fails rectification (Step 4). Not a category unless standardized.

  ---

  ### Application to Real Tickets  
  1. **Grade 8.8 Hex Bolt**  
     - Step 1: Compound = "grade 8.8 hex bolt"; modifier = "property class 8.8".  
     - Step 2: Attribute exists? Yes (property class), but poorly populated. → **Not data fix** (harm isn’t due to hiding).  
     - Step 3: Substitution test: Swapping 4.8 for 8.8 causes structural failure → **Harm**. Escalate with harm evidence.  
     - Step 4: Definition consistent? Yes (ISO 898-1).  
     - **Outcome: ESCALATE to you. "Substitution would violate safety standards. Create category node."**  
     - *Requester wins*—but justified by deliverability.  

  2. **Stainless Hex Bolt**  
     - Step 1: Compound = "stainless hex bolt"; modifier = "material: stainless steel".  
     - Step 2: Attribute exists? Yes, but 20% unpopulated → **Data fix**. Customers searching "stainless hex bolt" get junk due to missing values.  
     - **Outcome: NO. Route to data team. "Material is a filter. Fix missing 'stainless' values instead."**  
     - *Requester furious but wrong*—problem is data, not taxonomy.  

  3. **Yellow Zinc Bolt**  
     - Step 1: Compound = "yellow zinc bolt"; modifier = "finish: yellow zinc".  
     - Step 2: Attribute exists? Yes (finish).  
     - Step 3: Substitution test: Warehouse swaps "clear zinc" for "yellow zinc". Harm? Only if customer needs color for assembly coding → **No physical harm** (corrosion protection similar).  
     - Step 4: Ambiguity check: 3 definitions → **Inconsistent**. Fails rectification.  
     - **Outcome: NO. "Term is ambiguous and substitution causes no harm. Filter by 'finish' + clarify values in UI."**  
     - *Requester furious*—but adding a category would mislead customers.

  ---

  ### Limitations and Failure Modes  
  - **What This Can’t Settle**:  
    - **Business bets**: E.g., "Create a 'sustainability-certified' node for market positioning." The procedure rejects it (no substitution harm), but leadership may override.  
    - **True edge cases**: E.g., a modifier with 50/50 harm (e.g., "food-grade lubricant" where some substitutions *might* be safe). Requires human judgment.  
  - **Most Likely Failure**: **Step 3 (Substitution Test)**. Catalogers may misjudge "harm" (e.g., assuming aesthetic preferences are critical).  
    - **Failure Signs**: Reps escalate repeatedly for the *same* modifier; tickets cite "customer complaints" about substitutions that *didn’t* cause harm.  
    - **Catch It Early**: Audit 10% of "NO" tickets for harm rationale. Track if reps bypass the catalog *for those specific terms*.  

  ### What Would Change My Mind  
  If **>30% of legitimate "kinds" had no substitution harm** (e.g., customers demanded exact specs for non-safety reasons like accounting codes), the deliverability test would fail. You’d need a procedure based on **"Does this modifier define a *commercially distinct* product line?"** (e.g., bolts sold to aerospace vs. construction). This abandons the White Horse frame for a business ontology.  

  But in industrial supply—where physical harm, liability, and engineering specs dominate—**deliverability is the right frame**. Your three tickets prove it: Only the life-critical modifier (grade 8.8) survived. The rest were noise.  

  ---  
  **Final Note**: This works because fasteners are *functional* objects. If you sold fashion, we’d prioritize the hardness/whiteness split (perception over reality). But here, Gongsun Long’s horse stays relevant: A white horse isn’t just a horse when the color determines whether it arrives alive.
