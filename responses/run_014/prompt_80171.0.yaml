answer: |-
  Below is a decision-tree taxonomy addressing the origin and status of the standard genetic code, built from the logical space of arguments. It is structured around pivotal questions that separate competing views, with each branch labeled by the claim that defines it. The taxonomy is grounded in your settled facts: near-universality of the code, rare altered codes (mitochondria, yeasts, ciliates), error-minimizing structure, and functional portability (e.g., transgenic mice). Crucially, the adaptive significance of the error-minimizing structure is treated as genuinely contested—no view is presented as consensus. Positions are distinguished by their commitments to selection, mechanism, and evolvability, with empty cells diagnosed where logical gaps exist.  

  ### Decision Tree: Origins of the Standard Genetic Code  
  **Branch 1: Can the codon-to-amino-acid mapping evolve as a coherent unit?**  
  - *Rationale*: Separates views that treat the code as a single evolving entity from those that reject this framing. Altered codes prove change is possible, but not whether the "whole" code is the unit of selection.  
    - **No → Leaf 1: Deflationary View**  
      - *Most awkward commitment*: Must explain near-universality and rare variants as emergent byproducts of molecular/cellular constraints, denying that the mapping itself is a selectable trait.  
    - **Yes → Proceed to Branch 2**  

  **Branch 2: Does the error-minimizing structure require adaptive explanation?**  
  - *Rationale*: Tests if the code’s robustness against mutations demands selection. Error-minimization is settled; whether it is adaptive is contested.  
    - **No → Proceed to Branch 3**  
    - **Yes → Proceed to Branch 4**  

  **Branch 3: Is the error-minimizing structure explained by inherent chemical/biochemical affinities?**  
  - *Rationale*: Splits non-adaptive views: stereochemical/coevolutionary (affinities explain assignments) vs. frozen accident (structure is coincidental).  
    - **Yes → Leaf 2: Stereochemical/Coevolutionary View**  
      - *Most awkward commitment*: Must explain the absence of strong experimental evidence for systematic codon-amino acid affinities across the entire code.  
    - **No → Leaf 3: Frozen Accident / Neutral Drift View**  
      - *Most awkward commitment*: Must explain the code’s striking error-minimization as a non-adaptive byproduct of historical contingency, despite its functional elegance.  

  **Branch 4: Was selection for error minimization active during the code’s initial assembly?**  
  - *Rationale*: Distinguishes "full" adaptation (selection shaped initial assignments) from hybrid views (selection acted later).  
    - **Yes → Leaf 4: Selection-for-Error-Minimization View**  
      - *Most awkward commitment*: Must explain why variant codes (e.g., in mitochondria) persist without catastrophe despite deviating from the optimal structure.  
    - **No → Proceed to Branch 5**  

  **Branch 5: Was the standard code’s expansion shaped by selection for error minimization?**  
  - *Rationale*: Isolates hybrid views where early assignments were fixed non-adaptively, but later additions were optimized.  
    - **Yes → Leaf 5: Hybrid Accident-Then-Selection View**  
      - *Most awkward commitment*: Must explain why early random assignments did not constrain optimization to a suboptimal structure, given functional dependencies.  
    - **No → Proceed to Branch 6**  

  **Branch 6: Are codon reassignments in altered codes evolutionarily neutral?**  
  - *Rationale*: Tests if changes are permissible only when inconsequential (neutral) or if they reflect ongoing adaptation.  
    - **Yes → Leaf 6: Frozen Flexibility View**  
      - *Most awkward commitment*: Must explain how variant codes retain functionality despite deviating from the standard code’s error-minimization, without invoking adaptation.  
    - **No → *Empty Cell 1***  
      - *Diagnosis*: Incoherent—if the code evolves as a unit (Branch 1: Yes) and changes are non-neutral (this branch: No), selection must act; but Branch 4: No and Branch 5: No already exclude selection. Thus, no tenable position exists here.  

  #### Taxonomy Summary (6 Leaves + Empty Cell)  
  | Leaf | Name | Core Claim | Awkward Commitment |  
  |------|------|------------|-------------------|  
  | 1 | Deflationary View | The "code" isn’t a selectable unit; mappings emerge from lower-level constraints. | Explain universality/variants without code-level evolution. |  
  | 2 | Stereochemical/Coevolutionary View | Assignments reflect inherent chemical affinities or biosynthetic pathways. | Lack of evidence for universal codon-amino acid affinities. |  
  | 3 | Frozen Accident / Neutral Drift View | The code is a historical relic; structure is coincidental, not adaptive. | Error-minimization as a non-adaptive byproduct. |  
  | 4 | Selection-for-Error-Minimization View | Selection optimized the entire code for robustness. | Variant codes’ existence without collapse. |  
  | 5 | Hybrid Accident-Then-Selection View | Early assignments were random; later expansion optimized by selection. | Early randomness not hindering later optimization. |  
  | 6 | Frozen Flexibility View | Altered codes prove changes are possible but neutral; standard code persists by chance. | Variant codes functioning despite lost optimization. |  
  | - | *Empty Cell 1* | (No coherent position) | (Incoherent: non-neutral change without selection) |  

  ### Key Notes on the Taxonomy  
  1. **Settled vs. Contested**:  
     - **Settled**: Near-universality, altered codes, error-minimizing structure, and functional portability are foundational facts.  
     - **Genuinely Contested**: Whether error-minimization is adaptive (Branch 2) is unresolved. No consensus exists—frozen accident (Leaf 3) and full adaptation (Leaf 4) are both active positions.  

  2. **Taxonomic Judgment Calls**:  
     - **Why Leaf 6 (Frozen Flexibility) is distinct**: It accepts code evolvability (unlike Leaf 3) but denies ongoing/initial selection (unlike Leaves 4–5), instead framing variants as neutral "tweaks." This separates it from frozen accident and hybrid views.  
     - **Hybrid views not repackaged**: Leaf 5 focuses exclusively on *non-chemical* early accidents (per your requirement), while stereochemical (Leaf 2) is siloed separately. A "stereochemical hybrid" (chemistry early, selection later) is possible but omitted to avoid redundancy; it would resemble Leaf 5 but inherit Leaf 2’s awkward commitment.  
     - **Empty Cell 1**: Diagnosed as incoherent—it demands non-neutral change without selection, violating the logic of Branch 4/Branch 5.  

  3. **Ambiguities and Uncertainties**:  
     - **Stereochemical vs. Coevolutionary**: Grouped (Leaf 2) because both invoke inherent affinities (chemical or biosynthetic) and reject selection; splitting them would overemphasize marginal differences.  
     - **Frozen Accident Flexibility**: Leaf 6 is logically necessary but thinly defended; some might call it "neutral drift with flexibility," but its distinctness from Leaf 3 is justified by altered codes’ existence.  
     - **Portability’s Role**: Functional portability (e.g., transgenic mice) is settled but neutral in debates—all views accept it as proof of code interchangeability, not adaptation.  

  This taxonomy forces clarity by isolating core commitments, exposing gaps (e.g., Empty Cell 1), and resisting false consensus. Use it to help readers navigate the conceptual battlefield—not to resolve it, but to map where the trenches lie.
