prompt: |-
  A freind of mine hosts a tiny design podcast and I've offered to write the questions for next month's episode. The guest is a type designer who takes a hard line on letter identity: she says an 'a' has no essence. What makes an 'a' an 'a', on her view, is a loose genre — a set of roles the parts play (something that encloses, something that bears the weight, a way of closing the top) — plus the fact that readers have learned to see it that way. The genre tolerates almost any amount of reshaping, so there's no shape that all 'a's share. She calls these letter genres, which I think she nicked from Hofstadter's old Letter Spirit thing, but don't hold me to that.

  I want eight to ten interview questions that actually press her on this rather than letting her restate it. Please work in: (i) a question about why 'a' and 'e' don't just merge if the genre is that permissive, and whether letter identity is really relational — each letter being what it is only by contrast with the others in the same font; (ii) one on the single-storey 'a' versus the double-storey 'a', whether they're the same letter, and what she says about children who meet both at once; (iii) one on the looptail 'g', which people read constantly but mostly can't write — does that put the genre in the eye rather than the hand, or does it undercut her? (iv) one asking her to separate a badly drawn 'a' from a different letter altogether, and whether she's happy to say the category is vague, so that some marks are neither determinately 'a' nor determinately anything else; (v) one on convention — if the genre is held together by use, could a community just decide that what we call 'q' is now an 'a', and if so, why can't a reader re-identify letters at will? Each of the main questions wants a follow-up keyed to the answer she's most likely to give. She says it's a genre, not a shape, about twice an episode, so build the sequence so that line gets harder to reach for each time.

  Lay it out like this: Openers (2 questions, no follow-ups, one sentence each); The view, on its own terms (3 questions with a follow-up each, two sentences max per question); Where it pinches (4 questions with a follow-up each); The last question (1 question, no follow-up). British English please.
reasoning: |-
  Okay, the user wants me to create interview questions for a podcast about typography and letter identity. The guest is a type designer who believes that letters like 'a' have no essential shape—their identity comes from functional roles within a "genre" and reader recognition. 

  I need to craft questions that challenge this view rather than letting her restate it. The user specified five key points to include: why 'a' and 'e' don't merge if genres are permissive; single vs double-storey 'a' for children; looptail 'g' recognition vs writing ability; fuzzy boundaries between badly drawn letters; and conventions around redefining letters. 

  For structure, I'll follow the requested format: two openers, three questions on the view itself, four "pinching" questions, and one closer. Each main question needs a follow-up anticipating her likely answers. The sequence should make it progressively harder for her to default to "it's a genre, not a shape." 

  British English is required—I'll use spellings like "recognise" and avoid Americanisms. The tone should be probing but respectful, fitting a design podcast. 

  For opener questions, I'll start broad to ease into the topic. For the core view section, I'll focus on internal consistency of her theory. The "pinching" questions will target practical contradictions, like children learning variant forms or the looptail 'g' paradox. The final question will tie back to convention's role. 

  For follow-ups, I'll anticipate her probable defenses: genre flexibility, reader habits, functional roles. Each follow-up should push her toward unexplored implications. For example, if she says genres prevent letter merging, ask why fonts still need distinct skeletons. 

  The looptail 'g' question is particularly interesting—it highlights how recognition can exist without reproduction ability, which might challenge her emphasis on learned perception. I'll frame it as whether this puts the genre "in the eye rather than the hand." 

  For the vague boundaries question, I'll ask how her theory handles ambiguous scribbles that could be multiple letters. The follow-up will press whether this forces her to accept indeterminacy. 

  The convention question about redefining 'q' as 'a' tests the social aspect of her theory. If genres depend on community use, what stops arbitrary changes? The follow-up will challenge why readers can't retrain perception individually. 

  Throughout, I'll avoid letting her repeat catchphrases by building logical pressure. The last question will be a concise callback to convention's limits.
answer: |-
  Here’s a structured interview sequence pressing her view while weaving in your requested points, using British English and escalating the challenge to her "genre" refrain:

  **Openers**  
  1. Could you unpack what you mean by "genre" replacing essence for letter identity?  
  2. When you say readers "learn to see" letters as such, is that learning purely visual or partly linguistic?  

  **The view, on its own terms**  
  3. **Q:** If the 'a' genre tolerates radical reshaping, why don’t 'a' and 'e' visually collapse into one another in practice? *(Follow-up: You’ve said genres are held together by contrast—doesn’t that make letter identity entirely relational, not just "loose" roles?)*  
  4. **Q:** How does your genre theory accommodate the single- and double-storey 'a'—are they the same letter? *(Follow-up: When children encounter both forms simultaneously in early reading, does this challenge the idea of a stable learned genre?)*  
  5. **Q:** You reject a shared shape for all 'a's—is there *any* visual element that *must* be present, even abstractly? *(Follow-up: If not, what stops *any* mark becoming an 'a' if we decree it plays the roles?)*  

  **Where it pinches**  
  6. **Q:** Most people recognise the looptail 'g' but can’t draw it—doesn’t that put your "genre" entirely in the eye, not the hand? *(Follow-up: If recognition relies solely on visual exposure, not motor memory, doesn’t that undercut the "roles" being inherent in the form?)*  
  7. **Q:** Take a poorly drawn character: at what point does a wonky 'a' stop being an 'a' and become, say, a 'd' or an 'o'? *(Follow-up: Must we accept some marks are *neither* determinately 'a' *nor* determinately another letter—is vagueness essential to your theory?)*  
  8. **Q:** If genres are conventions held by communities, could we collectively redefine what we call 'q' as an 'a' tomorrow? *(Follow-up: If so, why can’t an *individual* reader—say, a stubborn designer—re-identify letters at will and still function?)*  
  9. **Q:** Doesn’t the persistence of distinct letter skeletons across fonts suggest *some* irreducible formal constraints, even within genre flexibility? *(Follow-up: If genres are truly "loose", why do type designers still speak of betraying a letter’s "character" when pushing boundaries?)*  

  **The last question**  
  10. Does convention ultimately *replace* essence here, or just become its mask?  

  ---

  **Rationale & Escalation:**  
  - **Openers** establish core terms without letting her expand into rehearsed lines.  
  - **Q3-Q5** directly probe internal coherence (relational identity, child learning, minimal constraints), each follow-up tightening the screw: forcing her to confront whether relational contrast is *primary*, if early exposure complicates "learning," and whether roles alone are sufficient.  
  - **Q6-Q9** target practical tensions: the looptail 'g' (Q6) challenges embodied knowledge, vagueness (Q7) forces her on boundaries, convention (Q8) tests social vs. individual agency, and font skeletons (Q9) pressure her on implicit constraints. Follow-ups explicitly pit her likely defences against counter-evidence.  
  - **Sequence:** Each question’s follow-up pre-empts the "genre not shape" fallback by demanding specifics (relationality, vagueness, convention’s limits). The final question reframes essence as possibly resurfacing through convention.  
  - **British English:** "Recognise," "accommodate," "collectively," "motor memory," "wonky," "skeletons," "persistence," "betraying".  
  - **Your Points Covered:** (i) Q3 & follow-up, (ii) Q4 & follow-up, (iii) Q6 & follow-up, (iv) Q7 & follow-up, (v) Q8 & follow-up.
