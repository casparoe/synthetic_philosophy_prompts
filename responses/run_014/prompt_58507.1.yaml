  Hey, I retired a couple years ago after spending most of my life as a physical chemist running a labratory, and lately I've gotten obsessed with philosophy of probability in my spare time so go easy on me, I'm still new to this stuff.

  Could you act as a professional philosopher who works on logic and conditionals, and think really carefully through this? It would help me if you start with a little brainstorming of the different options before you settle on an answer.

  What I'm stuck on is this: back in the 1920s this young Cambridge guy Frank Ramsey floated this super intuitive idea for how we evaluate an if-then claim, basically you just suppose the if part is true in your head and then see how likely the then part looks to you, and later people turned that into a probabilistic slogan that the probability of an indicative conditional just is the conditional probability of the consequent given the antecedent. I beleive much later David Lewis proved these things called triviality results showing that, except in trivial cases, there is no ordinary proposition whose probability always matches that conditional probability across different belief states, especially once you start embedding conditionals inside other conditionals or using conditionals with conditional antecedents and stuff like that.

  So here's my shower thought: what would Ramsey himself have said if he had lived long enough to see Lewis's results? Would he have given up the slogan and said conditionals don't really express ordinary propositions at all, or would he have tried to restrict the slogan to simple unembedded cases like the ones a scientist actually uses when predicting a lab outcome, like reasoning about whether heating a sample will make it turn blue given certain background knowledge, and treated the fancy nested cases as a philosopher's invention that doesn't matter? Or would he have gone more pragmatist and said the whole point was never about propositions but about a mental procedure for revising beliefs, so Lewis kind of missed the point?

  To make it concrete, could you run his likely reaction through three little science-y cases I keep thinking about: first, a simple lab prediction about an outcome given an intervention; second, a case where you learn new information that changes your conditional probabilities; third, a weird nested case where the antecedent itself involves a conditional judgment. What would Ramsey plausibly say about each, given what we know about his broader subjectivist take on probability and his anti-metaphysical streak?

  Please answer in American English, and please be explicit about what is settled among people who actually work on conditionals versus what is genuinely contested, so you don't present a contested reading of Ramsey or Lewis as if everyone agrees on it.
