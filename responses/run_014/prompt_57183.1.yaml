  "We initially observed a gap in the free-will case with the original question wording. However, when we used an alternative wording (local idiom without ability connotation) the gap disappeared. This indicates that the original gap was due to a translation issue in the question. We therefore report the results with the alternative wording and note that the original wording was problematic."

