  **What the procedure cannot settle** (as noted above):
     - Deep cultural differences in conceptual understanding that are not captured by the paraphrase or free-text.
     - Whether the philosophical concept is truly equivalent across cultures.
     - Translation issues that are subtle and not caught by paraphrase or mirror.

