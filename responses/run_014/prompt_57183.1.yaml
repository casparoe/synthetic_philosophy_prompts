answer: |-
  Here’s a streamlined triage procedure for your RA, designed to fit within a one-hour per-vignette timeframe. It uses your existing data (mirror versions, paraphrase coding, verdict distributions, and free-text explanations) and flags judgment calls explicitly. The RA needs basic descriptive stats (mean, distribution, simple coding) but no advanced training.

  ---

  ### **Triage Procedure for Verdict Gaps**  
  **Goal**: Classify gaps into:  
  - **Genuine difference** (cross-cultural variation in intuition)  
  - **Translation/comprehension failure** (vignette misunderstood)  
  - **Scale/response artifact** (systematic bias in scale use)  
  - **Question substitution** (participants answering a different question)  
  - **Undecidable** (insufficient evidence)  

  **Inputs per vignette**:  
  - Verdict distributions (7-point scale) for all sites (original + mirror versions).  
  - Paraphrase coding (% retaining key detail) for all sites.  
  - Free-text explanations (translated) for 10 random participants per site (if unavailable, skip Step 4).  

  ---

  #### **Step 1: Check Comprehension (5 min)**  
  - **Evidence**: Paraphrase coding % for key structural detail.  
  - **Threshold**: <80% correct retention at a site = failure.  
  - **Judgment call?** Minimal. Use pre-set 80% threshold.  
  - **Sufficient answer**:  
    - **Failure**: Gap likely due to comprehension.  
    - **Pass**: Move to Step 2.  
  - **Next step**:  
    - **Failure**: Report with caveat: *"Verdict gap may stem from comprehension issues at [Site]."*  
    - **Pass**: Proceed.  

  #### **Step 2: Test Mirror Version (10 min)**  
  - **Evidence**: Mean verdict difference between sites for:  
    - Original vs. mirror at the "gap site" (site with anomalous verdict).  
    - Mirror vs. other sites.  
  - **Threshold**: Gap closes if mirror reduces difference by >50% (e.g., from 2.0 to <1.0 points).  
  - **Judgment call?** Low. Simple mean comparison.  
  - **Sufficient answer**:  
    - **Closes at gap site**: Translation/cultural mismatch in vignette.  
    - **Persists**: Move to Step 3.  
  - **Next step**:  
    - **Closes**: Report mirror results as primary; note original gap as cultural artifact.  
    - **Persists**: Proceed.  

  #### **Step 3: Detect Scale Artifacts (10 min)**  
  - **Evidence**: Distribution shape at gap site vs. other sites.  
  - **Thresholds**:  
    - **Compression**: >90% of responses in ≤3 points (e.g., 5-6-7 only).  
    - **Skew**: Mean ± SD overlaps minimally (e.g., gap site mean 6.5 ± 0.5 vs. other site 4.0 ± 2.0).  
  - **Judgment call?** Moderate. RA must assess distribution spread.  
  - **Sufficient answer**:  
    - **Artifact present**: Scale/response issue.  
    - **No artifact**: Move to Step 4.  
  - **Next step**:  
    - **Artifact**: Report gap with caveat: *"Site-level response bias likely inflates difference."*  
    - **No artifact**: Proceed.  

  #### **Step 4: Screen for Question Substitution (20 min)**  
  - **Evidence**: Free-text explanations (10 per site). Code for:  
    - **Target concept**: Mentions core philosophical question (e.g., "blame," "permissibility").  
    - **Off-target**: Focuses on unrelated elements (e.g., "the agent was poor" in a knowledge case).  
  - **Threshold**: >40% off-target at gap site but <20% at other sites = substitution.  
  - **Judgment call?** High. RA must interpret text. Use clear coding rules (e.g., "If text discusses consequences not intent, code as off-target").  
  - **Sufficient answer**:  
    - **Substitution**: Participants answering different question.  
    - **No substitution**: Move to Step 5.  
  - **Next step**:  
    - **Substitution**: Report with caveat; re-field with clarified question next wave.  
    - **No substitution**: Proceed.  

  #### **Step 5: Final Classification (5 min)**  
  - If all steps passed:  
    - **Genuine difference** (no red flags).  
    - **Undecidable** (conflicting/missing evidence).  
  - **Next step**:  
    - **Genuine**: Report difference without caveats.  
    - **Undecidable**: Note gap as unexplained; recommend deeper investigation.  

  ---

  ### **Applied to Your Cases**  
  **Case 1: Gettier-Style Case**  
  - **Evidence**: Mirror closes gap at Site A (not Site B); paraphrases clean.  
  - **Triage**:  
    - Step 1: Pass (paraphrases clean).  
    - Step 2: Gap closes at Site A (translation issue) but persists at Site B (proceed).  
    - Step 3: No distribution artifacts noted (proceed).  
    - Step 4: Free-text likely on-target (proceed).  
  - **Verdict**:  
    - Site A: **Translation failure** (fixed by mirror).  
    - Site B: **Genuine difference**.  
  - **Pre-reg note**: *"Site A’s gap resolved with culturally mirrored vignette, suggesting translation artifact. Site B’s gap persisted, indicating genuine cross-cultural divergence in knowledge attribution."*  

  **Case 2: Promise Case**  
  - **Evidence**: Huge gap; paraphrases clean; Site X (5-6-7 only) vs. Site Y (full 1-7).  
  - **Triage**:  
    - Step 1: Pass (paraphrases clean).  
    - Step 2: Mirror not mentioned → assume gap persists (proceed).  
    - Step 3: **Scale artifact** at Site X (compressed distribution).  
    - (Stop: No need for Step 4.)  
  - **Verdict**: **Scale/response artifact** at Site X.  
  - **Pre-reg note**: *"Verdict gap co-occurs with compressed response distribution at Site X, suggesting scale-use bias rather than true attitudinal difference. Results interpreted with caution."*  

  **Case 3: Free-Will Case**  
  - **Evidence**: Gap disappears with reworded question (no "ability" connotation).  
  - **Triage**:  
    - Step 1: Assume paraphrases clean (proceed).  
    - Step 2: Not applicable (problem is question wording, not vignette).  
    - Step 3: Not triggered.  
    - Step 4: Gap resolved by wording swap → **Question substitution**.  
  - **Verdict**: **Question substitution** (original phrasing measured unintended concept).  
  - **Blunt truth**: **Drop the original finding**. The gap is artifactual; the "real" result is that your key concept doesn’t translate.  
  - **To survive**: Reword the question to preserve "ability" connotation (validated by collaborators/linguists) and re-field. If the gap persists *after* fixing translation, it’s genuine.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Deep conceptual mismatches**: If cultures fundamentally interpret a concept (e.g., "knowledge," "free will") differently, no operational fix will resolve it.  
  2. **Nuanced translation errors**: Minor phrasing issues that evade paraphrase coding (e.g., "could" vs. "might" subtly changing meaning).  
  3. **Interaction effects**: e.g., "Scale compression only occurs for moral vignettes at Site X." Needs multi-vignette analysis.  

  ### **Decision Ownership**  
  - **RA**: Runs triage, suggests classification (Steps 1-5).  
  - **In-country collaborator**: Validates translation choices (Step 2), interprets free-text nuance (Step 4), and confirms cultural appropriateness of mirrors.  
  - **You**: Final call on dropping/re-fielding vignettes, especially for high-stakes cases (e.g., Case 3).  

  ### **Procedure Weaknesses**  
  - **Free-text reliance**: Machine translation or RA coding may miss subtleties.  
  - **Threshold arbitrariness**: e.g., 80% for paraphrases, 40% for off-target. Calibrate with your team.  
  - **Band-Aids, not cures**: Flags issues but doesn’t fix them. Post-triage, you still need collaborator input for solutions.  

  This balances rigor with feasibility—no illusion of objectivity, but a systematic way to replace arguments with evidence.
