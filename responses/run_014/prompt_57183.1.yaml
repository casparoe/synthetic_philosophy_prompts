  2. **Mirror Version Check**:
     - Compare the gap in the original and mirror versions at each site with a gap.
     - If the gap closes in the mirror version at a site, mark as cultural mismatch (a type of translation/comprehension issue). 
     - Next: report the mirror version result as primary and note the cultural confound in the original.

  3. **Response Distribution Check**:
     - Examine the response distribution at the site with the gap and compare to other sites. 
     - Look for compression (e.g., using only 2-3 points) or extreme skew.
     - If compression and if the free-text (if available) does not show a corresponding uniformity in strength of opinion, mark as response artifact. 
     - Next: report with caveat about response styles; consider using a different statistical approach.

  4. **Free-Text Check for Question Substitution**:
     - Sample free-text responses at the site with the gap and at a comparison site. 
     - Look for evidence that they are answering a different question. 
     - If found, mark as question substitution. 
