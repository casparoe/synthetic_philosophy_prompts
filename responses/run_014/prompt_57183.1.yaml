     - The RA classifies based on the evidence.
     - The project lead (you) must approve any decision to drop a vignette or change the analysis plan.
     - The in-country collaborator must be consulted for:
          - Interpretation of free-text when the translation is ambiguous.
          - Confirming that the mirror substitution was appropriate.
          - Providing context for response distributions (e.g., is the scale compression typical in their site?).

