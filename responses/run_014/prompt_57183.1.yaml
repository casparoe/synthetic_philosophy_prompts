prompt: |-
  I co-run a small multi-site project comparing how people respond to philosophical thought experiments — six sites, two of which are places where nobody on our core team speaks the language, so we work through in-country collaborators and paid translators. Each wave we field maybe 12-15 vignettes, and every one gets a verdict question on a 7-point scale plus a free-text box asking people to explain their answer in their own words. Pre-registration goes in about five weeks out and after that we're stuck with our analysis plan, so I need something we can apply per vignette, not per paper.

  The problem: when a vignette comes back with a verdict gap between sites, we currently just argue about it in a meeting. Some of us say it's a real difference in the intuition, some say it's the translation, some say 7-point scales don't mean the same thing to someone who went through a different school system, some say participants at different sites are answering different questions entirely — like whether the act was blameworthy versus whether the agent actually knew. Its not that we lack opinions, it's that we have no procedure and I'm sick of the meetings.

  So: write me a triage procedure an RA can run on one vignette in about an hour, with no stats training past a first methods course, that sorts a verdict gap into genuine difference / translation-or-comprehension failure / scale and response-style artifact / question substitution (they're answering something else) / undecidable with the data we have. For each branch I want what evidence to look at in the stuff we already collect, what would count as a sufficient answer to that question, and what we do next — report it, report it with a caveat, drop the vignette, or re-field it next wave. Be blunt about which steps are judgment calls wearing a procedure costume. Our collaborators have been burned by teams that pretended otherwise and I don't want to do that to them.

  Two things we already do, so build these in rather than reinventing them: every vignette has a mirror version where the culturally loaded detail is swapped for a site-local equivalent nominated by the in-country collaborator, and we field both; and we ask a subsample to paraphrase the case back to us, which we code for whether the key structural detail survived.

  Then run your procedure on three invented results, and for each give the verdict, the reasoning, and the sentence we'd actually put in the pre-registration:

  1. A Gettier-style case. The mirror version closes the gap at one site but not the other, and the paraphrase codes come back clean everywhere.
  2. A case about whether it's permissible to break a promise to a dying person. Huge gap, paraphrases fine, but one site's whole distribution is squeezed into 5-6-7 while another uses the full 1-7.
  3. A free-will style case where the gap disappears when we swap the wording of the question from a could-have-done-otherwise phrasing to a local idiom that our collaborator says carries no ability connotation at all. Honest warning: this one is the centerpiece of the grant and I badly want it to be a real finding, so if your procedure says I have to drop it, tell me straight and tell me what would have to change for it to survive.

  Last thing — say what the procedure cannot settle no matter how much data we throw at it, and mark the points where the decision belongs to me or to the in-country collaborator rather than to the RA following the steps.
reasoning: |-
  We are designing a triage procedure for a verdict gap in a multi-site philosophical thought experiment project. The procedure should be executable by an RA in about an hour per vignette, with basic stats training. The goal is to categorize the gap into one of:
  - Genuine difference
  - Translation or comprehension failure
  - Scale and response-style artifact
  - Question substitution (they're answering something else)
  - Undecidable with current data

  We must incorporate two existing practices:
  1. Each vignette has a mirror version with a culturally loaded detail swapped for a site-local equivalent (both fielded).
  2. A subsample paraphrases the case, coded for key structural detail survival.

  The procedure will use the following data:
  - Verdict distributions (7-point scale) for each site and for the mirror version at each site.
  - Paraphrase coding results (whether key details were retained).
  - Free-text explanations (if available and if the RA can use translations, but note time constraints).

  The procedure steps:

  1. **Check Paraphrase Coding**: 
     - Look at the paraphrase coding for the original and mirror vignettes at each site. 
     - If for a site, the key structural detail is missing in a significant portion of the paraphrases (e.g., <80% correct or as per pre-set threshold), flag as potential comprehension failure.
     - **Sufficient evidence for comprehension failure**: Low paraphrase accuracy at a site for a vignette (original or mirror) that shows a gap. If this is found, the gap might be due to comprehension. 
     - **Next step**: Report with caveat that comprehension may be an issue at that site. If the gap is large and comprehension is poor, consider dropping the vignette for that site in analysis or re-fielding with revised translation.

  2. **Check Mirror Version Effect**:
     - Compare the verdict gap between the original and mirror versions at each site. 
       - If the gap closes at a site when using the mirror version (i.e., the mirror version at that site aligns with the other sites), then the gap in the original is likely due to the culturally loaded detail (which the mirror fixed). This suggests the original gap is not a genuine difference in the philosophical intuition but a cultural mismatch in the scenario.
       - If the gap remains in the mirror version at that site, then the issue is not fixed by the cultural substitution, so it's either a genuine difference or another issue.
     - **Sufficient evidence for cultural mismatch (part of translation/comprehension? or genuine? note: mirror is designed to test this)**: Closing of the gap in the mirror version at a site that had a gap in the original. Then the original gap was due to the culturally loaded detail. 
     - **Next step**: Report the finding for the mirror version as the main result (since it's more culturally appropriate) and note that the original had a cultural confound. If the mirror version still shows a gap between sites, then we proceed to next steps.

  3. **Check Response Distribution Artifacts**:
     - Look at the distribution of responses at each site (for both original and mirror, but focus on the version that is being considered for the gap). 
       - If one site uses a restricted range (e.g., only high or only low) while others use the full scale, this might indicate a response style artifact (e.g., acquiescence bias, extremity bias) or that the question is interpreted differently (e.g., they might be answering a different question).
       - Check if the gap is in the same direction as a general tendency for that site (e.g., if a site always rates higher on all vignettes, then it might be a scale use issue).
     - **Sufficient evidence for scale/response artifact**: 
          - The site with the gap shows a consistent pattern of restricted range across multiple vignettes (the RA would need to look at other vignettes for that site, but we are per vignette, so this might require context). Alternatively, if the free-text explanations (if available) show that participants are using the scale appropriately for other aspects, then it might not be a scale issue. 
          - But note: we are per vignette, so the RA might not have time to look at other vignettes. Therefore, we can look at the current vignette's distribution and the free-text. If the free-text explanations (even if translated) show that participants are expressing a range of reasons but the scale is compressed, it might be a scale use issue. 
          - However, if the free-text explanations at the site with the compressed distribution are all uniformly strong (or weak) in agreement, then it might be a genuine extreme view. 
     - **Next step**: If a response artifact is suspected, we can report with a caveat about response styles. If the gap is large and the distribution is highly skewed in one site, we might consider using non-parametric tests or modeling to account for the artifact. But for pre-registration, we note the potential issue. If the free-text suggests they are answering a different question, then see step 4.

  4. **Check Free-Text for Question Substitution**:
     - Read a sample (e.g., 10-20) of the free-text explanations from each site (using translations). The RA should look for:
          - Whether participants are discussing the intended philosophical question.
          - Or if they are focusing on a different aspect (e.g., in the promise case, are they discussing the permissibility of breaking the promise, or are they discussing whether the dying person will know, or the agent's character?).
     - **Sufficient evidence for question substitution**: If a substantial portion of the free-text at one site addresses a different question than at other sites. 
     - **Next step**: If found, report with a caveat that participants might have interpreted the question differently. Consider re-fielding with a revised question. If the gap is due to this, it's not a genuine difference in the target intuition.

  5. **Check for Translation Issues in the Question** (if not already covered by mirror or paraphrase):
     - This is tricky without direct language knowledge. But if the free-text reveals confusion about the question, or if the question wording was changed in a way that might alter meaning (as in the free-will example provided in the user's point 3), then it might be a translation issue in the question.
     - **Sufficient evidence**: If the gap disappears when a different wording is used (as in the user's example 3) then it's evidence that the original question translation was problematic.
     - **Next step**: If the gap is fixed by rewording, then the original gap is due to the question translation. Report the result with the fixed wording and note the issue with the original.

  6. **If none of the above, then genuine difference or undecidable**:
     - If the paraphrase is clean, the mirror version doesn't close the gap (or there is no mirror effect because the gap is consistent), the distributions are not artifacted, and the free-text shows they are answering the intended question, then it's likely a genuine difference.
     - However, if there is no clear evidence from the above, then it's undecidable.

  **Time constraints**: The RA has one hour, so they cannot read all free-texts. They should sample (e.g., 10 per site per condition). Also, they might not have access to translations of free-text on the fly? We assume that translations of the free-text are available (perhaps machine translation? but quality may vary). If not, this step might be skipped or done only for sites where the gap is present.

  **Judgment calls**:
     - In step 1, setting the threshold for paraphrase failure is a judgment call (but we can pre-set a threshold, e.g., 80%).
     - In step 4, determining if the free-text is about a different question is a judgment call. The RA would need guidelines (e.g., a list of key concepts that must be present for the target question).
     - In step 3, deciding if a distribution is artifacted (compressed) might be based on standard deviation or range, but what is "compressed"? This is a judgment call. We can define: if the distribution at one site has >90% of responses in 3 consecutive points and the other site uses at least 5 points, that's compressed.

  **What the procedure cannot settle**:
     - It cannot definitively rule out that participants are thinking about the same philosophical concept but expressing it in a way that the free-text coding doesn't capture (e.g., nuances in the explanation).
     - It cannot fix a poor translation that consistently distorts the meaning but passes the paraphrase check (if the paraphrase coding only checks structural details and not the nuance).
     - It cannot account for unmeasured cultural differences in the interpretation of the scenario beyond the swapped detail.

  **Decision ownership**:
     - The RA flags the potential issues and suggests a category.
     - The project lead (you) or the in-country collaborator should be consulted for:
          - Interpretation of free-text in the local language (if the RA is using translations and there is ambiguity).
          - The decision to drop a vignette or re-field (this is a strategic decision).
          - Setting the threshold for paraphrase coding (pre-set by the team).
          - Interpreting the mirror version effect (if the cultural substitution was appropriate, the in-country collaborator's input is key).

  Now, let's run the procedure on the three invented results:

  **Case 1: Gettier-style case**
  - Mirror version closes the gap at one site but not the other.
  - Paraphrase codes clean everywhere.

  Procedure:
  - Step 1: Paraphrase clean -> no comprehension failure.
  - Step 2: Mirror version closes the gap at site A (so the gap in the original at site A was due to the cultural detail) but not at site B (so the gap at site B remains). 
    - For site A: the original gap is explained by cultural mismatch. 
    - For site B: the gap remains even in the mirror version -> so we proceed to check for other issues at site B.
  - Step 3: Check response distribution at site B for the mirror version (which is the version we now focus on). We don't have information about compression, so assume it's normal. 
  - Step 4: Check free-text at site B. We don't have free-text info in the problem statement, but the paraphrase was clean so they understood the case. But we need to check if they are answering the same question. Since the case is Gettier, we might look for whether they are discussing justification or knowledge. Without specific free-text issues, we assume they are answering the same question.
  - Step 5: No alternative question wording tested in this case.

  Conclusion for site B: The gap remains and we found no artifact, so it may be a genuine difference at site B. But note that at site A, the mirror version fixed the gap (so it aligned with other sites). Therefore, for site B, we have a gap that is not fixed by the mirror. 

  Verdict: 
  - For site A: translation/cultural issue (fixed by mirror).
  - For site B: genuine difference (because no issue found).

  But wait: the mirror version at site B did not close the gap, meaning that the cultural substitution did not fix the gap. So the gap at site B is not due to that cultural detail. However, there might be other cultural issues not addressed by the mirror. But without evidence of comprehension or response issues, we tentatively call it genuine.

  Pre-registration note: 
  "We found a gap in the Gettier case between Site B and the other sites. The mirror version (which substitutes a cultural detail) did not close the gap at Site B, and comprehension checks were passed. We interpret this as a genuine cross-cultural difference in epistemic intuition. For Site A, the original version showed a gap, but the mirror version aligned with the consensus, suggesting the original gap was due to the cultural detail."

  **Case 2: Promise case**
  - Huge gap, paraphrases fine.
  - One site (Site X) uses only 5-6-7, the other (Site Y) uses full 1-7.

  Procedure:
  - Step 1: Paraphrase clean -> no comprehension failure.
  - Step 2: We don't have mirror version information in the problem. But the user says they do have a mirror for every vignette. So we must check the mirror. The problem doesn't say what the mirror does to the gap. We must assume we have mirror data. Since the problem doesn't mention the mirror, we have to consider both versions? But the user says "huge gap" and then describes the distribution, so we focus on the original? But we have a mirror. Let me re-read: "every vignette has a mirror version", so we have data for both. The problem statement for this case doesn't mention the mirror effect. So we must check:

    - If the mirror version at Site X still uses 5-6-7 and the gap remains, then we know the mirror didn't fix it. 
