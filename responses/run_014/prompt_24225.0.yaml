answer: |-
  My dear colleague,  

  I understand your fascination with revealed preference theory as a novelist exploring how choices unveil character. The notion that actions speak louder than words, or even thoughts, resonates deeply with the craft of showing rather than telling. Regarding your query about the nature of "utility" within this framework, I must argue strongly for a purely formalist interpretation. The utility function here is not a window into the soul; it is, rather, a mathematical shadow cast by observed choices, devoid of inherent psychological substance.  

  The core argument stems from a fundamental mathematical property: the utility function in revealed preference theory is defined only up to a strictly increasing transformation. If a preference relation can be represented by one utility function, *U*, assigning numbers to options, then *any* other function *V* that preserves the *order* of those numbers—meaning that whenever *U* ranks option A above B, *V* also ranks A above B—represents the *exact same* preference relation. The actual numerical values assigned by *U* are arbitrary beyond their ordinal ranking. Whether *U* assigns A=10 and B=1, or *V* assigns A=1000 and B=999, the information conveyed is identical: A is preferred to B. The specific magnitudes—the "10," the "1," the difference of "9" or "1"—carry no fixed meaning within the theory. They are not measures of intensity, satisfaction, happiness, or the strength of desire. They are merely numerical placeholders signifying position in a rank order.  

  This ordinal nature is forced upon us precisely because revealed preference theory begins with observable choices, not introspection. We see an agent choose apple A over banana B in one instance, and pear C over A in another. From patterns of such choices across different sets of options, we infer a consistent preference ordering: C > A > B, perhaps. The utility function *U(C)=3, U(A)=2, U(B)=1* is one representation; *V(C)=30, V(A)=20, V(B)=10* is another, equally valid representation. Crucially, the theory provides absolutely no basis for claiming that the "utility jump" from B to A (difference of 1 in U, or 10 in V) is larger, smaller, or equal to the jump from A to C (difference of 1 in U, or 10 in V). Any such claim about the intensity of preference, the amount of satisfaction gained, or the comparative strength of desires lies entirely outside the scope of what the choices alone can tell us. The utility function's *only* job is to replicate the observed ranking; it is a numerical cipher for the order itself.  

  This formalism is the theory's ingenious escape from the quagmire of measuring an unobservable psychological state called "utility." If utility were a real, quantifiable mental phenomenon—a hedonic glow or a desire-meter—then we would expect its magnitude and intervals to be meaningful. We would seek a unique, cardinal measure. But revealed preference theory explicitly avoids this by grounding everything in observable choices. It rescues the theory from the impossibility of direct psychological measurement by jettisoning psychology altogether.  

  The cost, however, is profound, and it extends beyond "utility" to the very concept of "preference" within this theory. When we say an agent "prefers A to B" based solely on her observed choice of A over B when both are available, we are *not* making a statement about her inner state—her yearning for A, her satisfaction upon consuming it, her conscious evaluation. We are *only* describing a behavioral regularity: when faced with the set {A, B}, she consistently selects A. "Preference" here is synonymous with "what is chosen over specific alternatives in specific contexts." It is a property of her *choice function*—the mapping from sets of options to selected options—not a report on her subjective feelings, values, or motivations.  

  Thus, revealed preference theory ultimately describes a pattern in an agent's actions. It tells us that her choices are consistent in a way that allows us to model them *as if* she were maximizing *something* we call "utility." But that "utility" is merely the numerical reflection of the observed choice pattern. It has no more inherent psychological reality than the longitude and latitude coordinates have inherent physical reality beyond describing a point's position on a map.  

  For your character, then, this theory suggests that her choices *alone* reveal only a skeletal ordering of alternatives. They tell the reader *that* she chooses A over B, and perhaps that her choices cohere logically. But they do not, within this formal framework, reveal *why*. They do not capture the fervor of her desire, the depth of her satisfaction, the complex values or fears or loves that *you*, as her creator, imbue her with. The theory provides the formal skeleton of consistent choice; it falls to you, the novelist, to breathe into it the psychological life—the true wants, values, and inner turmoil—that animate her actions and make her choices meaningful beyond mere behavioral regularity. The formalist reading of utility strips it bare to rescue its scientific coherence, but it leaves the rich tapestry of human motivation entirely for you to weave.  

  I hope this perspective proves fruitful for your novel's exploration of choice and character.  

  Yours sincerely in the pursuit of understanding character,  

  A Fellow Observer of Human Choice
