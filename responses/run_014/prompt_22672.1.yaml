answer: |-
  You've hit on one of the deepest and most contentious questions in mechanistic interpretability—the gap between *intervention effects* and *true representation*. Let's dissect why a steerable direction doesn't automatically imply "representation" and how superposition complicates this.

  ### The Core Gap: Intervention vs. Intrinsic Computation
  1. **The Interventionist Fallacy**:
     - **What you observe**: When you add vector Δ to activations and the model's output changes predictably (e.g., "not" → "not happy" becomes "happy"), it proves Δ is *sufficient to disrupt or alter behavior*.
     - **What it doesn't prove**: That the model *naturally uses* a direction identical (or similar) to Δ to represent the concept during unperturbed inference. The model might compute "not" via nonlinear interactions or distributed mechanisms your intervention bypasses.

  2. **Linearity Assumption Trap**:
     - Probes and steering assume linear decodability: if concept $C$ can be read out linearly from activations, we infer $C$ is "represented." But the model's internal computation might be highly nonlinear. A direction that *steers* behavior might not be the direction the model *naturally activates* when computing $C$.

  3. **Superposition's Curse**:
     - In sparse settings (common in early/middle layers), neural activations represent *many more concepts* than there are dimensions. Your "clean" steering direction for "negation" might actually be:
       - A **basis vector** in an overcomplete dictionary (i.e., the "pure" direction exists but isn't aligned with model dimensions),
       - A **linear combination** of unrelated features (e.g., "not" + "formality" + "certainty"),
       - Or a **residual direction** that only *approximates* the concept when decoded linearly.

  ### When Does a "Clean" Direction Suggest Representation?
  A steerable direction provides *evidence* for representation if you can demonstrate:
  1. **Causal Consistency**: The same direction reliably induces the *same semantic effect* across diverse contexts (e.g., steering "negation" flips meanings in sentences about emotions, facts, and instructions).
  2. **Minimal Side Effects**: Adding Δ *only* affects the target concept (e.g., doesn't degrade grammar or alter unrelated semantics). If side effects correlate with known superposed features, it's entanglement.
  3. **Downstream Alignment**: The steered activation propagates through later layers *as if the model generated it naturally*. (Test via path patching or gradient-based attribution.)
  4. **Inverse Correlation**: When the model *naturally* outputs the target concept, its activations consistently align with Δ (measured via centered kernel alignment or similar).

  ### Philosophical Tension: Is "Representation" Even the Right Frame?
  - **Functionalist View**: "If it quacks like a duck..." If steering Δ *systematically* produces concept-like behavior, Δ is functionally a representation *for practical purposes* (e.g., control, debugging).
  - **Realist View**: Only if Δ corresponds to a *causal variable in the model's computational graph* (e.g., an activation subspace the model *uses* for the concept) is it a "true" representation.
  - **Instrumentalist Warning**: Calling it "representation" risks *reification*—treating our probe's success as proof of isomorphic structure. The map is not the territory.

  ### Superposition: The Representation-Killer?
  When features are superposed:
  - **Steering Directions ≠ Native Directions**: The model may compute "negation" via a sparse combination of neurons, while your steering vector is a dense projection onto a non-axis-aligned subspace.
  - **Probes Find Arbitrary Bases**: A linear probe for "negation" might find *any* vector in the feature's row space—not necessarily the model's "native" basis.
  - **Evidence It's Superposed**:
    - Low **probing accuracy** on *single-neuron* activations.
    - Steering introduces **unintended side effects** (e.g., adding "negation" vector also makes text formal).
    - **Non-orthogonality**: Steering vectors for seemingly unrelated concepts are correlated.

  ### A Path Forward: Representation as a Gradient
  Instead of binary "is/isn't representation," evaluate **fidelity**:
  1. **Intervention Fidelity**: How precisely does steering Δ control the target concept?
  2. **Mechanistic Fidelity**: Does Δ align with the model's natural computation (e.g., via activation clustering or causal scrubbing)?
  3. **Conceptual Fidelity**: Does the steered behavior match human-like abstraction (e.g., negation generalizes to novel cases)?

  ### Practical Takeaway
  - **Steering is powerful pragmatically** even if philosophically fuzzy: Use it for red-teaming, debiasing, or controlling outputs.
  - **To claim "representation"**: Demand multi-modal evidence:
    - Probing (linear decodeability),
    - Steering (interventionist control),
    - Causal mediation (e.g., ablation suppresses concept),
    - Geometric consistency (native activations cluster along Δ).

  **Bottom line**: A clean steerable direction *suggests* a representation might exist, but it's not conclusive. Superposition ensures we're often steering "shadows" of the model's true computation. The field needs tools to distinguish *exploitable directions* from *native computational structures*—until then, treat "representation" as a useful heuristic, not proven ontology.

  > *"The map of meaning is not the territory of computation."*  
  > — Apocryphal caution for interpretability researchers.
