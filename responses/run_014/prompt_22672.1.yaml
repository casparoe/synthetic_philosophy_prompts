  The superposition angle is especially sharp - they're rightly worried that directions might be entangled. This isn't just a technical concern; they're questioning whether "representation" is even a meaningful term here. Are we reifying our own probes? 

  I should break this down carefully. First need to distinguish between operational success (steering works) versus ontological claim (this is how the model represents it). The key is that steering is an intervention from outside the computational graph, while true representation would be part of the model's native computation. 

  Ah, and the linearity assumption! Probes and steering rely on linear decodability, but the model's internal processing might be highly nonlinear. Finding a linear steerable direction is necessary but not sufficient for it being a "native" representation. 

  The superposition point deserves special emphasis. When they mention "single direction might be a mix of concepts", they're touching on the exact reason why we can't assume monosemanticity. In sparse coding terms, our probe directions might be arbitrary bases in an overcomplete dictionary. 

  Should also address their meta-question about whether "representation" is just an unexamined metaphor. It's a fair challenge - we might be committing the "reification fallacy". But there are ways to gather evidence beyond steering, like causal ablation or analyzing the geometry of native activations. 

