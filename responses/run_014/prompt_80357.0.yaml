answer: |-
  Your intuitions are sharp, and the tension you're feeling between the mugging cases and Newcomb's problem is the core puzzle of decision theory. I'll propose a unifying principle, show how it handles your cases (including the probabilistic variant), and be upfront about which verdict it forces you to drop. The key is distinguishing **causal impotence** from **evidential relevance** in predictor-based scenarios.

  ### The Proposed Principle: Evidential-Causal Hybrid with Predictor Dependence
  **Act to maximize expected utility based on causal consequences, except when outcomes depend on a prediction of your action. In predictor-dependent cases, act as if your choice provides evidence about the predictor's past decision, even if it cannot causally influence it. Specifically:**
  1.  **Causal Baseline:** If your action *causally influences* the outcome, choose the action with the best causal consequences.
  2.  **Predictor Exception:** If the outcome depends *only* on a fixed past prediction of your action (and your action cannot causally alter that past prediction or its direct consequences), choose the action that provides the best *evidence* that the predictor made a favorable decision. Treat the predictor's accuracy as part of the background knowledge for calculating expected utility.

  **How the clauses work:**
  *   **Clause 1 (Causal Baseline):** Handles cases where your action *changes* the physical state of the world going forward (e.g., sending money, pressing a button).
  *   **Clause 2 (Predictor Exception):** Applies only when (a) a predictor has *already* made a decision based on a prediction of your choice, (b) that decision *fixes* the relevant outcome (or strongly constrains it), and (c) your action *cannot causally alter* that past decision or its immediate, direct consequences. Here, your choice *signals* what the predictor likely did. You act to *correlate* with the favorable prediction.

  ### Applying the Principle to Your Cases

  1.  **Original Mugging (Predictor, Mugger En Route):**
      *   **Analysis:** The predictor's decision (send mugger) is fixed. Paying $10 *causally* does nothing (Clause 1) – it won't stop the en-route mugger. It also provides no *evidence* that the predictor didn't send the mugger (the predictor is never wrong; paying is strong evidence you *were* predicted to pay, which didn't happen). Paying buys nothing causally or evidentially.
      *   **Verdict:** DON'T PAY. (Matches your intuition)
      *   **Clause Used:** Clause 1 (Causal impotence dominates), Clause 2 also implies futility.

  2.  **Time Traveler Mugging:**
      *   **Analysis:** This is the **critical point of conflict**. The time traveler's claim ("I saw you refuse, so I'm here") suggests the outcome (mugging) depends *only* on a fixed past observation/prediction of your refusal. Paying $10 *causally* might prevent the trip (if the time traveler is telling the truth about the mechanism). **However, your intuition groups it with Case 1, implying you interpret it as the mugging being *fixed* by the past observation.** The principle forces a choice:
          *   *If the mugging is fixed:* Clause 2 applies. Paying provides no evidence the past observation was different (it wasn't). It's causally impotent against the fixed past. DON'T PAY.
          *   *If paying now can causally prevent the future mugging:* Clause 1 applies. Paying $10 causally prevents losing $100. PAY.
      *   **Principle's Verdict (Requires Interpretation):** The principle *requires* knowing if the time traveler's action is **fixed** or **preventable**. Your intuition suggests you interpret it as fixed. **To keep your intuition (Don't Pay), the principle (Clause 2) supports this *only if* the time traveler's arrival is causally inevitable based on the past observation.** If paying now genuinely stops him, Clause 1 says Pay. **You must drop the "Don't Pay" intuition if the mugging is preventable.** Your description leans fixed, so we'll assume that for now. DON'T PAY. (Matches your intuition *if* fixed).
      *   **Clause Used:** Clause 2 (Assumes outcome fixed by past prediction/observation).

  3.  **Newcomb's Problem (Reward):**
      *   **Analysis:** Outcome ($$ in big box) depends *only* on the predictor's fixed past decision, based on predicting your choice. Taking both boxes *cannot causally* change what's in the big box (Clause 1 impotent). Clause 2 applies. Taking *only* the big box provides the best evidence that the predictor *predicted* you would one-box and therefore put the $1M there. Taking both boxes provides strong evidence the predictor predicted that and left it empty. Acting on this evidence maximizes expected utility.
      *   **Verdict:** ONE-BOX (Take only big box). (Matches your intuition)
      *   **Clause Used:** Clause 2 (Predictor-dependent outcome).

  4.  **Hacker Threat:**
      *   **Analysis:** Outcome (leak) depends *causally* on your payment. Paying $50 *causes* the leak. Not paying *causes* no leak. Predictor isn't relevant. Clause 1 applies directly.
      *   **Verdict:** DON'T PAY. (Matches your intuition)
      *   **Clause Used:** Clause 1 (Clear causal influence).

  5.  **Probabilistic Mugging (95% Predictor):**
      *   **Analysis:** The predictor's decision (send mugger or not) is *not* perfectly fixed by its prediction; there's 5% uncertainty. Paying $10 *causally* "cancels the job" *if* the mugger wasn't already sent (the 5% case). It does nothing if he was sent (95% case). Clause 1 applies.
      *   **Calculation:**
          *   *Don't Pay:* 95% chance lose $100, 5% chance lose $0. Expected Loss = $95.
          *   *Pay:* 95% chance lose $10 (mugger comes anyway), 5% chance lose $10 (mugger canceled). Expected Loss = $10.
      *   **Verdict:** PAY $10. (Reduces expected loss from $95 to $10).
      *   **Clause Used:** Clause 1 (Causal influence possible in the 5% scenario).

  ### Resolving the Dilemma (Mugging vs. Newcomb)
  *   **The Principle's View:** The principle *distinguishes* these cases, explaining your different intuitions.
      *   **Mugging (Fixed):** Clause 1 dominates (causal impotence). Paying doesn't help *and* provides no evidence the predictor was wrong (it wasn't).
      *   **Newcomb:** Clause 2 applies (predictor-dependent outcome). Your action provides *evidence* about the *fixed* predictor decision. Acting on this evidence (one-boxing) is rational.
  *   **Why Your Intuitions Conflict:** In Newcomb, refusing the $1 (taking one box) feels smart because you correctly realize your action correlates strongly with the *desired* predictor decision ($1M in box). In the fixed mugging, refusing $10 feels smart because you correctly realize paying *doesn't* correlate with avoiding the mugger (the predictor was already right about refusal) *and* it doesn't cause avoidance. The causal irrelevance is the same, but the *evidential relevance* differs critically due to the predictor's role in *setting* the outcome in Newcomb vs. merely *triggering* a consequence based on a fixed prediction in the mugging. The mugger is *coming regardless*; the box's contents *were set based on prediction*.
  *   **What You Must Drop:** The principle forces you to **drop the grouping of Newcomb with the fixed Mugging cases as "structurally identical"**. They differ in a crucial way specified by Clause 2: in Newcomb, the outcome (box contents) *was determined by* the prediction of your specific action. In the mugging, the outcome (mugger coming) was determined *based on* the prediction, but the causal chain (mugger en route) is now independent. Your action in Newcomb provides evidence about *what the predictor did*; your action in the fixed mugging provides no useful evidence about *avoiding the already-coming mugger*. The principle preserves your verdicts but explains the difference.

  ### Value of the Principle
  *   **Saves Intuitions:** It justifies your core intuitions in all cases *except* potentially requiring a reinterpretation of the Time Traveler case if prevention is possible.
  *   **Handles Probability:** It cleanly handles the probabilistic case via standard causal expected utility (Clause 1).
  *   **Precise & Actionable:** The clauses are testable. You can ask: "Can I *cause* a better outcome now?" (Clause 1). If not, and the outcome was fixed by a prediction, "Does my choice signal what the predictor likely did?" (Clause 2).
  *   **Honest Trade-off:** The cost is accepting that Newcomb *is* different from the fixed mugging due to predictor-dependence, requiring evidential reasoning in that specific context. This aligns with "functional decision theory" or sophisticated evidential approaches, while grounding most decisions in causality. It avoids the stark counterintuitive results of pure Causal Decision Theory (which says two-box) in Newcomb, while avoiding the pitfalls of pure Evidential Decision Theory (which might say pay the fixed mugger if it somehow correlated with predictor error, which it doesn't).

  **In short:** Your gut is mostly right. Use causality as your default guide. But when faced with a perfect predictor whose past decision *determined* your fate based on guessing your choice, act to *be the person they predicted favorably*. This explains one-boxing while rejecting payment in the fixed mugging. The probabilistic case highlights when causal action *is* possible, and the hacker case is pure causality. The time traveler case hinges on whether his arrival is truly fixed or preventable – your intuition suggests you treat it as fixed, which the principle supports under Clause 2.
