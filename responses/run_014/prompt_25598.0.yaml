  ---

  ### **Key Implications of the Analysis**  
  1. **Conceded Weaknesses**: Thoughtful defenders (e.g., Schaffer, Beebee) grant **ontological spookiness**, **proliferation**, and **truthmaker problems** as unavoidable costs. They bite bullets on negative facts or lean on causal contrastivism.  
     
  2. **Non-Conceded Objections**: Defenders reject **counterfactual insufficiency** and **transitivity failures** by arguing that modal dependence *is* the essence of causation (e.g., Lewis).  

  3. **Empirical Pressure**: Scientific practice treats "prevention" (e.g., vitamin deficiency → scurvy) as causal, but this is often seen as *model-relative* (e.g., in epidemiology), not ontologically robust.  

  4. **Collapse Risk**: Your appeal to "causal relevance/default states" is the lynchpin. If this devolves into context-dependent norms (e.g., "lifeguards ought to act"), the view collapses into **pragmatic deflationism** (e.g., Dowe's conserved quantity theory excludes omissions).  

  5. **Metaphysical Burden**: You must accept **negative existentials** as fundamental or adopt a sparse ontology (e.g., Armstrong's states of affairs) where absences supervene on positives.  

  6. **Not Insulated, But Fragile**: The view *is* falsifiable—e.g., if a complete physics of causation emerges with no room for absences—but its reliance on unformalized "relevance criteria" leaves it vulnerable.  

  ---

  ### **Recommendation**  
  Commit to the view *only* if you:  
  - Endorse **ontologically heavyweight absences** (e.g., akin to Mumford's dispositions),  
  - Can articulate a **non-arbitrary theory of causal relevance** (e.g., Hitchcock's contrastive causation),  
  - Accept that **normative/pragmatic elements** will pervade "genuine" omission-causation.  

  Otherwise, the pragmatic rival ("useful shorthand") remains the safer retreat.
