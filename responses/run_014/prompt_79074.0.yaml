  Okay, the user is a third-year PhD student in cognitive science who deals with modeling and has noticed a recurring pattern in their field. They describe disputes where two parties agree on all empirical data but still disagree on whether a posited entity is real. The proponent argues it earns its keep through predictive success and compression, while the opponent says it's just defined by the model. The user observes that the same person might flip their stance depending on the context—realist in one section of a paper, instrumentalist in another. They want to know if there's a name for this phenomenon or if a new term needs to be coined.

  First, I need to recall relevant philosophical concepts. Realism vs. instrumentalism is the obvious starting point. Realism posits that entities exist independently, while instrumentalism sees them as useful tools. But the user says this doesn't fully capture their issue. Then there's constructive empiricism (van Fraassen), which focuses on empirical adequacy rather than truth. Ontological pluralism allows different valid perspectives, but maybe not the flipping part. Deflationism minimizes the importance of the existence question, but the user notes that the disputes persist. Epistemic stances (Chakravartty) involve context-dependent attitudes.

  The user's key points are: (a) the dispute survives complete empirical agreement, (b) the reality criterion (predictive success) is automatically satisfied by any model entity, and (c) individuals switch stances situationally. Existing terms don't cover all three. Constructive empiricism addresses (a) and (b) but not (c). Ontological relativism touches (c) but not (a) and (b). Deflationism handles (a) but not (b) and (c). So a new concept might be needed.

  The term "Pragmatic-Stance Volatility" comes to mind. It combines the pragmatic aspect (utility-driven) with stance (epistemic attitude) and volatility (contextual shifting). This term addresses all three aspects: the intractable dispute (a), the criterion issue (b), and the flipping (c). The user's examples, like the latent variable and linear probe debates, fit here. Boundary cases would be when there's genuine new evidence (resolving the dispute) or consistent pluralism without flipping. Resolving such disputes might require recognizing them as non-substantive or adopting deflationism.
answer: |-
  Based on your description, the phenomenon sits at the intersection of several established philosophical concepts, but none perfectly captures the *specific triad* you identify: **(a)** empirically unresolvable ontological disputes despite full agreement on data/fits, **(b)** reliance on a criterion ("predictive success/compression") that is *internal* to the modeling framework and thus vacuously satisfied, and **(c)** contextual stance-switching by individuals based on rhetorical or pragmatic needs.

  Here's the conceptual neighborhood, mapped to your triad:

  1.  **Realism vs. Instrumentalism:** (Covers aspects of *a* & *b*, misses *c* & nuances of *a/b*)
      *   *Relevance:* The core disagreement about whether the entity "exists" or is "just a tool/summary" is the classic realism/instrumentalism debate.
      *   *Gap for (a):* Traditional formulations often imply empirical evidence *could* decide the issue (e.g., novel predictions for realism). Your case highlights disputes *immune* to empirical resolution even when evidence is agreed upon.
      *   *Gap for (b):* Both sides often accept predictive success as a *necessary* criterion. Your point is that within a *given, accepted* model, this criterion is trivially met by any entity postulated within it. The disagreement is about what that success *entails* ontologically, not whether it exists.
      *   *Gap for (c):* Doesn't address the *same individual* flipping stances contextually.

  2.  **Constructive Empiricism (van Fraassen):** (Covers *a* & *b* well, misses *c*)
      *   *Relevance:* Distinguishes acceptance of a theory (belief it is *empirically adequate*) from belief in its truth or the reality of its unobservables (*b*). The "reality" dispute transcends empirical adequacy (*a*).
      *   *Gap for (b):* Perfectly aligns with your point – predictive success (empirical adequacy) is the goal, and believing in the reality of posits is a *voluntary* extra step not compelled by the evidence alone. The "automatic satisfaction" is key.
      *   *Gap for (c):* While it makes belief in entities voluntary, it doesn't explicitly account for rapid, context-dependent *flipping* of that belief by the same person.

  3.  **Ontological Relativism / Perspectivism:** (Touches *c*, partly *a*, misses *b*)
      *   *Relevance:* Suggests "what exists" depends on the conceptual framework or perspective adopted. The contextual flipping (*c*) hints at this – different sections of the paper adopt different "perspectives" (causal explanation vs. cautious summary).
      *   *Gap for (a):* Often motivated by genuine incommensurability or fundamental differences in frameworks, not necessarily the *same* framework being interpreted differently ontologically *despite* agreement on its empirical use.
      *   *Gap for (b):* Doesn't specifically address the vacuity of the predictive success criterion *within* a single accepted framework.

  4.  **Deflationism about Ontology / Verbal Disputes:** (Covers *a*, potentially *b* & *c* as symptoms, but dismissively)
      *   *Relevance:* Argues that many "existence" disputes are non-substantive, merely about how we choose to use words or concepts, once the empirical facts are settled (*a*). The stance-switching (*c*) could be seen as using words differently in different contexts.
      *   *Gap:* Often dismisses the dispute as *merely* verbal or pragmatic, failing to capture the genuine *epistemic tension* and perceived significance researchers feel (as in your reviewer question). It doesn't engage deeply with *why* the predictive success criterion feels insufficient (*b*) or the drivers of the flipping (*c*).

  5.  **Epistemic Stances (Chakravartty) / Functional Pluralism:** (Touches *c*, potentially *a*)
      *   *Relevance:* Chakravartty argues for adopting different "epistemic stances" (attitudes towards how we represent and learn about the world) depending on context and goals. The flipping (*c*) resembles switching stances. Pluralism acknowledges different valid ways of "carving" the world for different purposes.
      *   *Gap for (a)* & *(b):* While allowing stance-switching, it doesn't inherently predict the *intractable disagreement pattern* or specifically highlight the vacuity of the predictive success criterion *within* a single model/stance.

  **The Diagnosis: A New Concept - "Pragmatic-Stance Volatility" (PSV)**

  Your triad isn't fully captured by existing terms. It requires a concept focusing on the *volatility* of ontological commitment *within* an empirically successful modeling paradigm, driven purely by pragmatic/rhetorical context, where the standard epistemic justification (predictive success) is recognized as insufficient for ontology yet remains the only justification offered.

  *   **Name:** **Pragmatic-Stance Volatility (PSV)**
  *   **Definition:** PSV describes a phenomenon in scientific modeling where:
      1.  Disagreements about the ontological status of a model-posited entity persist *despite complete agreement on the empirical adequacy and predictive success of the model itself*.
      2.  The primary justification offered for realism (predictive success/compression) is inherently satisfied by the entity's role *within the model*, rendering it insufficient to adjudicate the ontological dispute.
      3.  Individual scientists readily switch between realist and instrumentalist interpretations of the *same entity within the same modeling framework*, depending on immediate rhetorical goals (e.g., claiming explanatory depth vs. acknowledging limitations) or contextual demands (defending one's own model vs. critiquing another's), without new evidence or theoretical change.

  *   **Coverage of your Triad:**
      *   **(a)** Covered: PSV explicitly defines the dispute as surviving empirical agreement.
      *   **(b)** Covered: The insufficiency/vacuity of the predictive success criterion *for ontology* within the model is central to the definition.
      *   **(c)** Covered: The contextual stance-switching by individuals is the core "volatility" aspect.

  *   **Boundary Cases:**
      *   **Not PSV - Genuine Ontological Uncertainty:** Disputes where new empirical evidence *could* potentially resolve the existence question (e.g., direct detection technology is conceivable). PSV assumes the dispute is *structurally* unresolvable by further empirical work *within the current paradigm*.
      *   **Not PSV - Consistent Pluralism:** A researcher who consistently adopts a pluralist view, explicitly arguing that the entity is "real-for-purpose-X" but "not-fundamental-entity-Y" across contexts. PSV involves *inconsistent* flipping without explicit meta-justification for the switch.
      *   **Not PSV - Ordinary Inconsistency:** Accidental or hypocritical contradiction. PSV implies the flipping is *functional* within the scientific discourse (e.g., boosting claims in an intro, hedging in discussion; attacking a rival's construct, protecting one's own), driven by the structural features (a & b).
      *   **Shades into Deflationism:** If one concludes the dispute is *only* about preferred modes of speech or pragmatic emphasis, then deflationism applies. PSV retains the sense that the switching reflects a deeper, unresolved tension about what modeling success *means* ontologically.
      *   **Shades into Functional Pluralism:** If the stance-switching is made explicit, justified by different epistemic goals in different contexts, and consistently applied, it becomes defensible pluralism rather than PSV. PSV lacks this reflective consistency.

  *   **Resolving PSV Disputes:**
      Resolution, in the traditional sense of convincing the other side via evidence or logic, is likely **impossible** because the dispute isn't empirical or purely logical (point *a*) and the proffered criterion is inadequate (point *b*). However, the *disruption* caused by PSV can be mitigated:
      1.  **Meta-Recognition:** Explicitly acknowledging PSV – naming the dynamic – can defuse unproductive arguments. "We agree on the model's performance, we're having a PSV dispute about what that implies for existence. Let's clarify our stances and their purposes here."
      2.  **Clarifying Stakes:** Moving beyond "real or not?" to "What work do we want this concept to do? What risks are we trying to avoid? What explanatory aspirations does it fulfill (or not)?" (Addresses the *pragmatic* driver of *c*).
      3.  **Adopting a Deflationary or Explicitly Pragmatic Framework:** Consistently using language that reflects instrumentalism ("the model posits X, which successfully organizes/predicts Y") or explicitly framing realism as a separate, optional commitment based on factors *beyond* the model's current success (e.g., integration with other established knowledge, robustness across model classes).
      4.  **Seeking Constraints Beyond Prediction:** If ontological commitment is desired, look for evidence *not* solely tied to the model's predictive fit within its own domain. This is hard for latent variables/probes but might involve: convergence from *different* modeling approaches, connection to lower-level mechanisms (neural, algorithmic), or demonstrating *causal manipulation* effects tied specifically to the posited entity (beyond model correlation). *This is often where the real scientific work lies beyond the PSV impasse.*
      5.  **Accepting Stance-Volatility as Functional:** Recognizing that shifting rhetoric might serve different communicative purposes within scientific writing (hypothesis generation vs. cautious conclusion) without needing deep ontological consistency for every paper section. The danger is when this becomes unreflective or dishonest.

  **In Summary:** The phenomenon you describe – empirically immune ontological disputes fueled by an inadequate criterion enabling contextual stance-switching – is best captured by the novel concept **Pragmatic-Stance Volatility (PSV)**. It emerges from the tension between the undeniable *utility* of model entities and the lack of clear epistemic grounds within the modeling paradigm alone to settle questions of their mind-independent existence. Recognizing PSV shifts the focus from futile arguments about "reality" towards clarifying pragmatic goals, seeking external constraints, or explicitly adopting a consistent meta-framework (deflationary, pluralist, or cautiously realist based on broader considerations). Your reviewer's request was likely probing for either (4) external constraints/evidence beyond model fit or (3) a more cautious, instrumentalist framing – highlighting the very PSV dynamic at play.
