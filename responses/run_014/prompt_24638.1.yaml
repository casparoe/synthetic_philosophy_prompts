  I'm trying to figure out what I actually think about the four kinds of minds from Deutsch's Beginning of Infinity — Darwinian, Skinnerian, Popperian, Gregorian — by going by my gut on cases. A bacterium that picks up antibiotic resistance through random mutation and natural selection: Darwinian, no contest. A rat in a Skinner box that learns to press a lever for food by trial and error: Skinnerian. A child who imagines what will happen if she drops a glass and decides not to: Popperian, because she's testing a conjecture against an internal model instead of letting reality be the judge. A mathematician who notices her proof strategy is going in circles and changes approach: Gregorian, because she's modeling the process of model-making itself. A chess engine running minimax without any learning: I call it Popperian, since it's testing candidate moves against an internal model of the game. Here's where I get stuck: a genetic algorithm that evolves a population of candidate solutions, where the fitness is scored by an internal simulator rather than the real environment. It has the blind-variation-plus-selection structure of Darwinian problem-solving, but the selection is done by a model, not the world. I keep flip-flopping between calling it Popperian (because the model is doing the judging) and calling it a weird hybrid that doesn't fit the scheme at all. And a creature that has a rich model of the physical world but zero ability to model other minds — is that Popperian or Gregorian? Im not sure the "can it model minds" line is the right one, because I also feel like a creature that can model other minds but has a terrible model of the physical world should count as Gregorian. Is there a principle that gets all of these, or close, and what does it say about the genetic-algorithm case I keep going back and forth on?

  Please give me your verdicts and the principle in a JSON object with these fields:
