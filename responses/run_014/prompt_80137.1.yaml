  The user's question about phenomenal consciousness without access or behavior touches on the hard problem. If such cases exist, they'd be undetectable, raising ethical dilemmas. The current system might ignore this possibility due to epistemic limitations, but acknowledging it could necessitate fundamental changes in diagnosis and legal standards, like requiring neuroimaging or presuming consciousness in ambiguous cases.

  I need to address both philosophy and practicality. Highlight that the practice doesn't necessarily deny separable phenomenal consciousness but operates under access-focused criteria for reliability and legal clarity. Emphasize that changing practices would require not just evidence of isolated phenomenal consciousness but detectable markers, which currently don't exist. The user might be seeking pathways to reform, so discussing potential steps like standardizing neuroimaging protocols or legal revisions for fMRI results would be useful.

