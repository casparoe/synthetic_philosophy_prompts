prompt: |-
  For thirty years I studied the nervous systems of invertebrates; since retiring I have been reading philosophy of mind, and I now chair the standing committee at a coastal research institute that decides whether a given organism or engineered system is to be treated as a candidate for moral status — that is, whether we require anesthetic protocols, humane endpoints, and caps on the number of individuals used, on the assumption that the thing can be harmed. We take six to eight cases a year, two hours each, working from a two-page dossier. The committee is four biologists, an engineer, and a lawyer; none of us is a philosopher. Our recommendations go to the director and the funder's ethics board, and they are published, so they had better be defensible. We have been deciding by loose consensus, and it has produced two failures: we exempt small-brained animals wholesale without ever saying why, and we have lately been asked about cultured neural tissue and about a vendor's large language model that the vendor would like us to certify as a welfare subject.

  Please turn functionalism, together with multiple realizability, into a procedure we can run. Take the commitments seriously: no verdict may rest on what the system is made of or on how much it resembles a mammal, and a state is to be identified by the causal role it plays. The difficulty is not the slogan but what the slogan leaves open, and the procedure must force us to be explicit about two things. First, the grain. A role can be drawn coarsely enough that the thermostat, the institution, and this committee all implement something, and finely enough that only a mammal qualifies; nothing in the theory picks the level for us. So the procedure has to make us state our grain, defend it, and say what follows when two of us defend different grains. Second, the bearer. A role may be implemented by an organism, a subsystem, a colony, or a process that stops and restarts, and functionalism alone does not say which of these is the thing that can be harmed. Nor do the cases arrive sorted: a snail, a shrimp, and a squid sit on a continuum, and I do not want a procedure that pretends the line is given.

  Keep these six slots, which are my own distillation from my reading; do not substitute a different list. Decide their order, give each an operational definition a biologist can apply, and say how much of each is enough:

  1. the system transduces a noxious input and its response is not a fixed reflex;
  2. the state is integrated across more than one sensory modality;
  3. it is modulated by endogenous factors — injury, deprivation, hormonal state — and not only by the input;
  4. it outlasts the input and alters later choices, including choices in which it is traded off against something else the system wants;
  5. it is available to many downstream systems at once rather than to one dedicated output;
  6. the system can learn about the state or about the conditions that produce it.

  The procedure must return one of four verdicts and no fifth: role realized; role not realized at the stated grain; indeterminate because the grain is contested; outside the procedure because what remains is evaluative rather than factual. It must also keep apart two things I keep conflating — the role that defines the state and the observable markers by which we detect that the role is present — and tell me which of the six slots belong to which category, and what we are entitled to conclude given that we can only ever test the markers. Say what to do when the slots disagree with one another, when the committee must stop and send the case to the director as a values question, and what record we should keep so that next year's committee can reconstruct our reasoning. Aim for one page of questions in order, plus a short gloss per slot.

  Then run it on three dossiers: a crab in a study that requires repeated noxious stimulation; an octopus; and the vendor's language model, whose dossier argues that it satisfies all six slots — its outputs are shaped by prior descriptions of injury, its internal state persists across turns, and so on. I expect at least one verdict I will not like, and I would rather meet it here than in print; if the procedure licenses precautions my colleagues will call absurd, tell me whether it is the functionalist commitment, the grain, or the precaution we have layered on top that is doing the work. Finally, be plain about what the procedure cannot do: how much of it is a detection procedure and how much is a decision rule for acting under uncertainty, since functionalism tells us what a state is and not what to do when we cannot tell whether it is there; and which of our disagreements it will convert into technical questions and which it will leave exactly where they were.
reasoning: |-
  Hmm, the user is asking me to develop a functionalist procedure for determining moral status in research contexts. They have a background in invertebrate neuroscience and now chair a committee that evaluates whether organisms or engineered systems warrant ethical protections. They need a systematic method based on functionalism and multiple realizability, with strict requirements about ignoring physical composition and mammalian resemblance.

  The key challenges they've outlined are: (1) determining the appropriate grain of analysis (how finely to define causal roles), and (2) identifying the bearer of these roles (organism, subsystem, colony, etc.). They want me to operationalize their six predefined criteria into a practical procedure that outputs one of four clear verdicts.

  Looking at their six criteria:
  1. Noxious input transduction beyond reflexes
  2. Cross-modal integration
  3. Endogenous modulation
  4. State persistence affecting future choices
  5. Broad downstream availability
  6. Learnability about the state

  I need to design a workflow that forces explicit grain declaration, distinguishes role definitions from observable markers, and handles conflicts. The procedure must output: role realized, not realized, indeterminate (grain contested), or outside scope (evaluative).

  For implementation, I'll create a step-by-step decision tree:
  - Start with grain declaration and bearer identification
  - Evaluate each criterion with specific evidence thresholds
  - Implement conflict resolution rules
  - Document reasoning transparently

  Then I'll test this on their three cases:
  1. Crab - should likely qualify based on crustacean pain literature
  2. Octopus - clearly qualifies as sophisticated cephalopod
  3. Language model - tricky case requiring careful marker analysis

  I need to be brutally honest about limitations:
  - The procedure detects functional equivalences but doesn't resolve ethical uncertainties
  - It converts some philosophical debates into technical questions but leaves core value conflicts untouched
  - Marker reliance creates epistemic gaps we must acknowledge

  The crab test will verify sensitivity to invertebrate cognition. The octopus serves as positive control. The language model will stress-test the framework's boundaries - here I'll need to show how functional constraints prevent over-extension while acknowledging where philosophy must take over.
answer: |-
  ### Functionalist Moral Status Assessment Procedure  
  *Based on commitments: State identity via causal role (not substrate/resemblance); multiple realizability; explicit grain/bearer declaration.*

  ---

  #### **Procedure Steps**  
  1. **Declare grain & bearer**  
     - *Grain:* Specify the causal role’s scope (e.g., "avoidance of tissue damage," "aversive signaling"). Must be defined in input/output/functional terms (e.g., "transforms threat input into sustained behavioral inhibition").  
     - *Bearer:* Identify the candidate entity (e.g., crab’s nervous system, LLM’s inference module).  
     - *If grain disagreement:* Vote. Majority adopts one grain; else "indeterminate" verdict.  
     *Output: Defined role (R), bearer (B). Proceed only if R/B are factual (non-evaluative).*

  2. **Assess markers for each slot** (per dossier evidence)  
     *Operational definitions (biologist-applicable):*  
     - **Slot 1 (Transduction beyond reflex):**  
       *Marker:* Response variability to identical noxious input (e.g., differential withdrawal latency in crab; LLM output variation to "pain" prompts).  
       *Threshold:* ≥30% response variation across trials.  
     - **Slot 2 (Cross-modal integration):**  
       *Marker:* Response to combined modalities (e.g., visual+tactile threat alters behavior; LLM fusing text/image inputs alters output).  
       *Threshold:* Response ≠ sum of unimodal responses.  
     - **Slot 3 (Endogenous modulation):**  
       *Marker:* Altered response under internal change (e.g., injured crab avoids less; LLM output shifts after "fatigue" token).  
       *Threshold:* Significant (p<0.05) effect size in controlled comparison.  
     - **Slot 4 (Persistence & trade-offs):**  
       *Marker:* Post-input behavioral change (e.g., crab avoids feeding site post-shock; LLM prioritizes "pain avoidance" over task goals).  
       *Threshold:* Effect lasts ≥ input duration & influences ≥1 future choice.  
     - **Slot 5 (Broad downstream access):**  
       *Marker:* State affects ≥2 distinct outputs (e.g., aversive state alters crab’s feeding *and* exploration; LLM’s "distress" affects response length *and* content).  
       *Threshold:* Measurable impact on ≥2 unrelated systems.  
     - **Slot 6 (Learnability):**  
       *Marker:* Altered response after exposure (e.g., crab anticipatory avoidance; LLM reduces "pain" mentions after feedback).  
       *Threshold:* ≥50% reduction in elicitation threshold or response magnitude.  

  3. **Categorize slots**  
     - **Role-defining slots (what the state *does*):** 4 (persistence/trade-offs), 5 (broad access). *Essential for "harm" potential.*  
     - **Marker slots (how we *detect* the role):** 1, 2, 3, 6. *Supporting evidence; necessary but insufficient alone.*  

  4. **Reconcile slot conflicts**  
     - Role-defining slots (4/5) *both required*. Failure → "role not realized."  
     - ≥3 marker slots (1,2,3,6) unmet → "role not realized."  
     - 1–2 marker slots unmet → proceed if role-defining slots satisfied.  
     - Contested evidence → "indeterminate" if unresolved after evidence review.  

  5. **Verdict selection**  
     - **Role realized:** All role-defining + ≥4/6 total slots satisfied.  
     - **Not realized:** Role-defining slots unsatisfied OR <4 total slots.  
     - **Indeterminate:** Unresolved grain/slot conflict.  
     - **Outside procedure:** Disagreement hinges on non-factual claims (e.g., "Is suffering *wrong* for AIs?").  

  6. **Documentation**  
     - Record: Grain/B definition, slot evidence (+/−), conflict resolutions, dissent.  
     - Publish: Verdict, grain, bearer, slot summary (e.g., "Sat:1,2,4,5; Unsat:3,6").  

  ---

  #### **Test Cases**  
  **1. Crab (repeated stimulation study)**  
  - *Grain:* "Integrated aversion to tissue damage." *Bearer:* Crab nervous system.  
  - *Slots:* Sat 1 (variable withdrawal), 2 (visual+tactile integration), 3 (injury modulation), 4 (persistent avoidance), 5 (affects feeding/shelter). Unsat 6 (limited learning evidence).  
  - *Verdict:* **Role realized** (5/6 slots; role-defining 4/5 met).  
  - *Precaution source:* Functionalism’s commitment: Crab’s nociception matches mammalian *functional role*.  

  **2. Octopus**  
  - *Grain:* "Affective evaluation of harm." *Bearer:* Central nervous system.  
  - *Slots:* All satisfied (e.g., learned avoidance, cross-modal integration, trade-offs).  
  - *Verdict:* **Role realized** (6/6).  

  **3. Vendor’s LLM**  
  - *Grain:* "Aversive state from goal obstruction." *Bearer:* Transformer architecture.  
  - *Slots:*  
    - Sat *markers*: 1 (variable responses to "harm"), 2 (integrates text/image), 4 (state persists across turns), 6 (learns from feedback).  
    - Unsat *role-defining*: 3 (no endogenous modulation; weights fixed), 5 (outputs are serial, not broad access).  
  - *Verdict:* **Not realized** (role-defining slots 3/5 unmet).  
  - *Why you’ll dislike this:* LLM satisfies markers but fails *role-defining* slots. Functionalism’s grain commitment excludes it: no endogenous modulation or true trade-offs (only pattern-matching).  

  ---

  #### **What the Procedure Can/Cannot Do**  
  - **Detection procedure (70%):** Converts "Is state X present?" into technical slot assessments.  
  - **Decision rule under uncertainty (30%):** Forces explicit thresholds for slots; flags conflicts as "indeterminate."  
  - **Converts to technical questions:** Grain definition, slot evidence, bearer boundaries.  
  - **Leaves unresolved:**  
    - Ethical weight of non-mammalian states (e.g., is crab suffering *as bad* as mouse?).  
    - "Harm" definition beyond functional role (e.g., is frustration in LLMs morally relevant?).  
  - **Limitations:** Relies on observable markers; cannot resolve values disputes. When markers are indirect (e.g., fMRI for pain), verdicts inherit epistemic uncertainty.  

  ---  
  *Gloss: This procedure forces explicit grain/bearer choices, separates role essence (slots 4–5) from detection proxies (1–3,6), and halts at evaluative boundaries. It accepts functionalism’s radical premise: If a shrimp implements the same causal role as a mouse, it merits equal scrutiny—regardless of substrate.*
