        "Your device has:
          - Two registers (R1, R2) that can hold natural numbers (initially: R1 holds the input number, R2 holds 0)
          - A program counter that points to the current instruction.
          - A list of instructions: 
              INC (Ri): increment register Ri by one.
              DEC (Ri): decrement register Ri by one (if it is 0, leave it at 0).
              JZ (Ri, k): if Ri is 0, jump to instruction k (else, go to next instruction).
              HALT: stop the machine.
          Input: the unary number is represented by the value in R1 (so the input is n in R1). Output: the value 2n in R1 at halt."

  2. Task written on the board: "Double a unary number. Input: a string of n '1's. Output: a string of 2n '1's."

  3. Blank index cards and markers for groups to write their rules.

  4. (Optional) Pre-made example rules for each model in case a group is stuck.

  Example for Group1 (Tape model for doubling unary, with little-endian? Actually, unary doesn't have endianness. We can store the input on the tape and then we want to double it.

  Simple method: traverse the input and for each '1' write two '1's in a new location? But that requires two passes. Alternatively, mark the input and then write a copy.

  But we must be careful: the tape is infinite. We can use the following:

  States: 
    Start: move right until blank, then go to copy state.
    Copy: move left to the beginning, then start copying each symbol to the end (but that is messy).

  Alternatively, a simpler way: we can use two passes: first, replace each '1' with a 'X', then at the end write two '1's for each 'X'. But we don't have an extra symbol? We can expand the alphabet.

  We allow the tape to have symbols: '1', 'X', and blank (B).

  Example rules for Group1 (if they are stuck):
     Start state, read '1': write 'X', move right, stay in start? Actually, we need to mark and then come back.

  But we don't have to provide unless they are stuck.

  Similarly for other groups.

  This session design should achieve the goals. The convergence is built by having different models and then simulating each other. The lack of proof is highlighted by the challenge of the halting problem and the possibility of a new model that might compute more.

  Good luck!
answer: |-
  ### Session Design: Exploring the Convergence and Limits of Computational Models  
  **Objective:** Students experience the convergence of independently designed computational models and confront the gap between this convergence and a proof of the Church–Turing thesis.  

  **Materials to Prepare:**  
  - **Index cards:** Pre-printed with constraints for each group (1 set per group).  
  - **Whiteboard:** Divided into sections for group work and plenary notes.  
  - **Markers:** For whiteboard and index cards.  
  - **Timer:** To keep activities on schedule.  
  - **Group constraints handouts** (content below).  

  **Groups:**  
  - 4 groups of 5 students (philosophy/CS mixed).  
  - Each group designs a computational model with **different constraints** to prevent accidental homogeneity.  

  ---

  ### Timeline (90 Minutes Total)  
  #### 1. **Introduction (5 mins)**  
     - **Goal:** Frame the activity without naming the thesis.  
     - **Script:**  
       *“Today, we’ll design mechanical procedures to solve problems. Each group has unique constraints for building a ‘computational device.’ Your goal: solve a task by defining step-by-step rules. Later, we’ll see if your devices can mimic each other.”*  
     - **Task on Board:** `IS_EVEN_LENGTH` – Input: String of symbols (e.g., "AA"). Output: 1 if the string has even length, 0 otherwise.  

  #### 2. **Group Design Phase (25 mins)**  
     - **Groups Receive Constraints** (on index cards):  
       - **Group 1 (Tape-Like):**  
         *“Your device has:  
         - An infinite tape (cells hold symbols: A, B, or □).  
         - A read/write head.  
         - A state register (finite states: S0, S1, …).  
         Rules: Based on current state/symbol, write a symbol, move left/right, and change state.”*  
       - **Group 2 (String Rewriter):**  
         *“Your device has:  
         - A mutable string (symbols: A, B).  
         - Rules: Replace substrings (e.g., ‘AA → B’).  
         Rules must be applied in fixed order, left-to-right.”*  
       - **Group 3 (State Graph):**  
         *“Your device has:  
         - A finite state diagram.  
         - An input tape (read-only, left-to-right).  
         Rules: Transition between states based on current symbol. Output at end.”*  
       - **Group 4 (Stack Machine):**  
         *“Your device has:  
         - A stack (push/pop symbols: A, B).  
         - A state register.  
         Rules: Based on state and stack top, push/pop, change state, and read next input.”*  
     - **Activity:**  
       - Groups define rules for `IS_EVEN_LENGTH`.  
       - Example: Group 1 might use states to track parity (even/odd) while moving right.  
     - **Instructor Role:** Circulate, ask probing questions (*“What if the string is empty?”*), but **do not correct**.  

  #### 3. **Cross-Simulation Phase (30 mins)**  
     - **Regroup:** Pair groups (e.g., Group 1 + 2, Group 3 + 4).  
     - **Task:**  
       - Each group explains their device/rules to the other.  
       - **Challenge:** Simulate Partner’s `IS_EVEN_LENGTH` solution *using your own device*.  
         *(e.g., Can Group 2’s string rewriter mimic Group 1’s tape movements?)*  
     - **Output:** Whiteboard sketches of how devices translate tasks (e.g., “Tape movements → String replacement rules”).  

  #### 4. **Convergence Discussion (15 mins)**  
     - **Plenary Sharing:** Groups report:  
       - How they simulated their partner’s device.  
       - Where they struggled (e.g., “We couldn’t handle backtracking”).  
     - **Instructor Notes:**  
       - Highlight similarities (e.g., “Both Group 1 and 4 used states to track parity”).  
       - **Avoid naming the thesis.** Focus on: *“Did different designs solve the same problem similarly?”*  

  #### 5. **The Challenge (10 mins)**  
     - Introduce a new task: `HALTS_ON_EMPTY` – *“Given a device’s rules, does it output 1 when the input is empty?”*  
     - **Groups Attempt:** Quickly sketch solutions.  
     - **Reveal:**  
       *“This is the halting problem in disguise. We know no Turing machine solves it. But your devices might ‘feel’ powerful—can they?”*  
       Let them wrestle. Then: *“Can you prove your device solves this? Why or why not?”*  

  #### 6. **Debrief (5 mins)**  
     - Name the Church–Turing thesis:  
       *“You experienced convergence: diverse devices computed the same things. This mirrors history—Turing machines, lambda calculus, etc., all captured ‘computation.’ But is convergence proof?”*  
     - **Map Activity to Epistemic Issues:**  
       | **Activity Outcome** | **Church–Turing Thesis Insight** |
       |------------------------|-----------------------------------|  
       | Groups simulated each other easily for `IS_EVEN_LENGTH`. | Convergence of formal models is evidence for equivalence. |  
       | `HALTS_ON_EMPTY` stumped all. | But equivalence doesn’t mean universality; uncomputable problems exist. |  
       | Some groups added “magic” (e.g., “guess the state”). | Thesis excludes non-mechanical steps (oracles)—but we only know that by definition. |  
       | Simulations worked for simple tasks. | Real convergence requires testing all computable functions (not just one). |  
     - **Key Point:**  
       *“Convergence is compelling, but not proof—because we can’t formally define ‘mechanical procedure’ without circularity. Your simulations were local achievements; historical convergence was global. That’s why we need the thesis.”*  

  ---

  ### Handling Predictable Issues  
  1. **“Magical Primitives”** (e.g., a “solve any problem” rule):  
     - **In-session:** Ask the group: *“Could a human execute this step with pencil and paper, without creativity?”* If no, note it as a “black box.”  
     - **Debrief:** Explain that the thesis excludes oracles: *“Your ‘magic rule’ isn’t mechanical—it assumes what we’re trying to define.”*  

  2. **Over-Similarity or Triviality:**  
     - **If all devices are isomorphic:** *“In reality, Turing machines and lambda calculus arose independently—yours didn’t. What if we’d never compared them?”*  
     - **If tasks are too easy:** *“`IS_EVEN_LENGTH` is regular—it doesn’t test computational limits. A better experiment would use a harder task, like arithmetic.”*  

  3. **Simulation Struggles:**  
     - If groups can’t simulate, highlight: *“Your difficulty mirrors historical gaps—e.g., simulating recursion with tapes required insight.”*  

  ### What the Activity Cannot Capture  
  - **The historical weight of convergence:** Students’ models were designed in a vacuum; real models (Turing machines, recursive functions) emerged from different philosophical/mathematical traditions. **You must supply this context:**  
    > *“Kleene, Church, and Turing didn’t collaborate. Their independent formalisms converging suggested a universal phenomenon—something your activity simulated, but didn’t inherit.”*  

  ---
  **Why This Works:**  
  - Students *build* convergence, making it tangible.  
  - The `HALTS_ON_EMPTY` twist forces them to confront the gap between equivalence and universality.  
  - Constraints prevent identical models, and the debrief explicitly ties flaws to the thesis’s epistemic limits.  

  **Final Tip:** If groups finish early, have them try a harder task (e.g., “Check for balanced parentheses”). This reinforces convergence without requiring new setups.
