prompt: |-
  I teach a third-year undergraduate course on computability and its philosophical significance, and I have been thinking about the Church–Turing thesis in a way I did not expect. My own background is in software, where I treated the thesis as simply a fact about computation; now that I have to teach its epistemic status, I find the standard treatment unsatisfying in a subtle way. The thesis is not a theorem and, as far as I can see, cannot be one: it identifies a pre-theoretic notion — what a person can compute by following a finite set of mechanical rules — with a formal one, Turing-machine computability, and because the notion on the left is informal there is nothing from which to prove the equivalence. What supports the thesis instead is a convergence: independent attempts to make mechanical procedure precise, arriving from different directions, all pick out the same class of functions; and a smaller literature tries to improve on this by extracting axioms from our idea of a computation step and deriving the equivalence from them, which still begins from an informal reading of the axioms. The convergence is genuinely impressive, and it is not a proof. A student asked me last month what would count as evidence against the thesis and I gave a poor answer, and I have wanted to repair that ever since — by getting the class to feel both halves of the situation rather than take my word for either.

  Please design the session. It is ninety minutes, twenty students, a room with a whiteboard and index cards and no computers; the class is mixed, some computer science and some philosophy, and all of them have met the halting problem but little else. I want the convergence to be something they produce in the room rather than something I announce: they should build two or three different rule-based devices of their own, of visibly different shapes, and then establish by their own work that whatever one can do, the others can do as well. I want that to feel like an achievement, and then I want the moment where the achievement turns out not to license what they will want it to license. Arrange the rules, roles, materials, and any scoring scheme so that this happens on its own; do not have me name the thesis until the debrief. Give me a timeline, and tell me what materials I need to prepare in advance.

  The debrief should map what actually happened onto the two claims — the convergence and the absence of proof — including the places where the students' convergence was too easy to mean much (if all their devices were secretly one device, or if the tasks I set never needed more than a single primitive, the exercise establishes nothing) and what a better-designed version of their own experiment would have to look like. Tell me what will predictably go wrong the first time; I expect at least one group to build a device with a magical primitive, and I would like to know how to handle that without either blessing it or dismissing it. Finally, be frank about which feature of the thesis's epistemic standing the activity cannot reproduce and that I will have to supply in the debrief myself.
reasoning: |-
  We are designing a 90-minute session for a third-year undergraduate course on computability. The goal is to have students experience the convergence of different computational models and then realize that this convergence does not constitute a proof of the Church-Turing thesis.

  Session Structure:
  1. Introduction (5 minutes)
  2. Group Work: Design Computational Devices (30 minutes)
  3. Group Work: Compare and Translate (25 minutes)
  4. Plenary Discussion and Convergence (15 minutes)
  5. The Challenge: Beyond the Models (10 minutes)
  6. Debrief: Mapping to the Church-Turing Thesis (5 minutes)

  Materials:
  - Whiteboard for the instructor and for groups to use (if multiple whiteboards are available, great, otherwise use large paper or index cards for group work)
  - Index cards (several per group) for writing down rules and states
  - Markers or pens
  - Handout with instructions and a brief description of the task (optional, can be written on the board)

  Preparation:
  - Prepare index cards: some blank, some with pre-defined symbols (like 0, 1, B for blank, and perhaps arrows for movement) if you want to save time.
  - Prepare a set of simple computational tasks (see below) on index cards or on the board.
  - Think of a few example devices to demonstrate (if needed) but avoid giving away the design.

  Groups: Divide the class into 4 groups of 5 students each (or 5 groups of 4 if 20). Each group will design a different kind of device.

  Group Tasks:
  - Each group is assigned a different "computational model" to design. We want visibly different models. We can assign:
    Group 1: Turing Machine (tape, head, state, transition rules) - but we don't name it as such until later.
    Group 2: Post-Tag Machine (a string rewriting system with a fixed set of rules that are applied in a specific way)
    Group 3: Finite Automaton with a Queue (instead of a stack, to make it more powerful) - but note: a queue automaton is Turing-complete. Alternatively, we can use a simpler one like a finite automaton with two counters (which is also Turing-complete) but we must keep it simple enough for undergrads.
    Group 4: A cellular automaton (like a one-dimensional one, e.g., Rule 110) but that might be complex. Alternatively, a very simple assembly language with a few instructions.

  However, note: we don't want to give them the standard models. We want them to invent their own. But we must guide them so that they are not too simple and not too complex.

  Alternative approach: Let each group invent their own model with minimal constraints. But then we risk that they are too similar or too weak.

  Better: Give each group a set of constraints that lead to different designs.

  Constraints for Groups:
  - Group 1: Your device has an infinite tape divided into cells, a head that can read and write one cell at a time and move left or right. The device has a finite set of internal states. At each step, based on the current state and the symbol read, it writes a symbol, changes state, and moves the head.
  - Group 2: Your device works on a string of symbols. It has a set of rules that look for a specific pattern at the beginning of the string and replace it with another string. It always starts at the beginning. (This is a string rewriting system, like a Post normal system but simplified.)
  - Group 3: Your device has a finite set of states and two stacks. At each step, it can read the top of each stack, and based on the current state and the top symbols, it can pop from the stacks, push symbols onto the stacks, and change state. (Note: two stacks can simulate a tape.)
  - Group 4: Your device is a grid of cells (one-dimensional) that change over time. Each cell has a state (0 or 1) and the next state of a cell depends on its current state and the state of its immediate neighbors. The device starts with an initial configuration and runs step by step. (This is a cellular automaton.)

  But note: we don't want to give away the names. We describe the constraints without naming the models.

  We can assign the constraints without the names. However, we must ensure that the models are Turing-complete. But note: Group 4 (cellular automaton) might be too complex to design in 30 minutes. Alternatively, we can simplify:

  Proposed constraints for groups:

  Group 1 (Tape model):
  - You have a tape that is infinite in one direction (to the right). The tape is divided into cells, each holding a symbol (initially, a special blank symbol except for the input). You have a head that is over one cell at a time. You have a finite control with a set of states (including a start state and halt states). At each step, the machine reads the symbol under the head, and based on the current state, it: writes a symbol, moves the head (left or right), and changes state.

  Group 2 (String rewriting model):
  - You have a string of symbols (from a finite alphabet). You have a set of rules. Each rule is of the form: "if the string starts with X, then replace X with Y", where X and Y are strings. The machine starts at the beginning of the string and applies the first rule that matches at the beginning. If no rule matches, it halts.

  Group 3 (Two-stack machine):
  - You have two stacks (each holding symbols) and a finite control (states). At each step, the machine can read the top symbol of each stack (if the stack is empty, it reads a special symbol). Based on the current state and the two symbols, it can: pop from either stack, push a symbol onto either stack, and change state.

  Group 4 (Simple assembly-like language):
  - You have a finite set of registers (say, two registers, R1 and R2) that can hold natural numbers (initially, the input in R1, R2=0). You have a set of instructions: INC (increment a register), DEC (decrement a register, if it is 0 then it stays 0), and a conditional jump (if a register is 0, jump to a different instruction). The program is a sequence of instructions, and you have a program counter.

  We must be cautious: the two-stack machine and the assembly-like language are Turing-complete. The string rewriting (if we allow arbitrary rules) can be too, but we must make sure the rules are applied deterministically. The tape model is clearly Turing-complete.

  Tasks:
  Each group must design their device to perform a specific task. We assign the same task to all groups to compare later.

  Task 1: Recognize a palindrome over the alphabet {0, 1}. But note: without a bound on the length, this is undecidable for finite automata but decidable for Turing machines. However, we want them to design a device that can do it, so we must choose a task that is computable.

  Alternatively, choose a simple task: Increment a binary number.

  Task: Given a binary number (as a string of 0s and 1s, least significant bit first or most significant bit first? Let's do least significant bit first at the end of the tape for Group1, or at the end of the string for Group2) so that incrementing is easier.

  But note: we want the same task for all. Let's define:

  Task: Increment a binary number. The input is a binary number, and the output is the binary number plus one.

  Example: 
    Input: 101 (which is 5 in binary, represented as a string. But how? We must fix the representation. Let's represent the binary number as a string in big-endian (most significant bit first) or little-endian? For simplicity, let's use little-endian: the least significant bit is at the end of the string? Actually, for a tape, it's easier to have the least significant bit at the end (so the head starts at the beginning, which is the most significant bit). But incrementing is done from the least significant bit. So we might need to traverse to the end.

  Alternatively, we can choose a task that is easier: double a unary number.

  Task: Double a unary number. Input is a string of n ones, output is a string of 2n ones.

  But note: that is trivial in some models (in string rewriting: just copy the string) but in a finite automaton with two stacks? They can do it by pushing the input on one stack and then popping twice for each symbol? Actually, it's possible.

  Alternatively, we can choose a task that is not trivial but not too hard: reversing a string.

  But reversing a string in a two-stack machine is easy: push the string on one stack and pop to the other. In a tape model, it requires moving back and forth. In a string rewriting model, it might be complex.

  We want a task that is achievable in all models without being trivial. Let's choose:

  Task: Check if the input is of even length (over an alphabet of one symbol, say 'a'). Input is a string of a's. Output: if the length is even, output 1; otherwise, 0.

  This is a regular language, so all models can do it, but we want to see the different ways of doing it.

  But note: we want them to design a device that can compute any computable function? No, we are just giving one task to get them started and to have a common ground for comparison.

  Alternatively, we can have two tasks: one simple (even length) and one that requires more (like doubling a unary number). But time is short.

  We'll stick with one task: doubling a unary number.

  Steps:

  1. Introduction (5 minutes):
     - "Today we are going to explore the idea of mechanical computation by designing our own computational devices. Each group will design a device following a specific set of constraints. Then, we will see if we can simulate the devices of other groups with our own. Let's see if we can find a common core of what is computable."
     - Assign groups and give each group their constraint on an index card. Write the task on the board: 
          Task: Double a unary number. 
          Input: a string of n '1's (e.g., n=3: "111")
          Output: a string of 2n '1's (e.g., "111111")
     - Explain: "Your device must start with the input and, by following the rules, end with the output. You must design the set of rules or the program for your device."

  2. Group Work: Design (30 minutes):
     - Groups design their device. They should write down the rules (on index cards) and be ready to explain.
     - The instructor circulates to help. If a group is stuck, give hints. If they design something too powerful (like adding a magical primitive), note it but don't stop them.

  3. Compare and Translate (25 minutes):
     - Rearrange groups: form new groups of one member from each of the original groups (jigsaw style). So each new group has an expert on each model.
     - In these new groups, each expert explains their model and how it solves the doubling task.
     - Then, the group tries to simulate one model with another. They don't have to do all pairs, but at least one simulation (e.g., can we simulate Group1's tape model with Group2's string rewriting? or Group3's two-stack model with Group4's register machine?).

  4. Plenary Discussion and Convergence (15 minutes):
     - Bring the class together. Ask groups: were you able to simulate one device with another? How?
     - Highlight the similarities: "So, it seems that even though these models look different, they can all do the same task and even simulate each other. What does that suggest about the set of functions they can compute?"

  5. The Challenge: Beyond the Models (10 minutes):
     - Now introduce a twist: "But what if I told you that there is a function that none of these devices can compute? For example, the halting function: given a description of a device and its input, will it halt? We know that this is not computable by a Turing machine (from the halting problem). And since your devices are equivalent to Turing machines, they can't compute it either. But what if someone comes up with a new device that they claim can compute the halting function? How would we check?"
     - Lead them to the question: "We have these models that all converge to the same set of computable functions. Does that mean that any mechanical procedure can be simulated by these models? How could we ever prove that?"

  6. Debrief: Mapping to the Church-Turing Thesis (5 minutes):
     - "What we have seen is the convergence of different formal models: they all compute the same class of functions. This is the evidence for the Church-Turing thesis. But note: the thesis is about the informal notion of what a human can compute by following mechanical rules. We cannot prove that our formal models capture that informal notion because we don't have a formal definition of the informal notion. The convergence is strong evidence, but it is not a proof."
     - Address the potential flaws in the activity:
          - The models we used were all Turing-complete. But in reality, the convergence happened over time with independently developed models (lambda calculus, recursive functions, Turing machines, etc.). Our activity was designed to lead to that convergence quickly.
          - The task we chose was too simple? Actually, we only tested one function. But the simulations they did (if they did) suggest that the models can simulate each other for any computation. However, we didn't test all functions. In the actual history, the equivalence was proven for all computable functions.
          - What if a group built a model that was too powerful? For example, if they allowed a rule that can solve the halting problem? Then that model would not be equivalent. We must explain that we are restricting to mechanical, finite, step-by-step procedures without oracles.

  Handling a Magical Primitive:
     If a group builds a device with a magical primitive (e.g., a "solve halting" step), during the group work, note it and in the plenary, ask: "Is this step mechanical? What do we mean by mechanical?" and then in the debrief, explain that the Church-Turing thesis is about what can be done without such oracles. We must stick to finite, unambiguous steps that a human could do with pencil and paper.

  What the Activity Cannot Reproduce:
     The activity cannot reproduce the historical and conceptual depth of the independent developments of these models. Also, the activity only shows convergence for a small set of models (and we designed them to be equivalent). The real convergence happened over decades and included multiple models. Moreover, the activity does not capture the fact that the thesis is about the limits of computation in the physical world. We must supply that context in the debrief.

  Predictable Problems:
     - Groups may not finish designing their device in 30 minutes. Solution: have a very simple task and provide example rules for the doubling task in case they are stuck (as a backup).
     - The jigsaw groups may not be able to simulate one model with another in 25 minutes. Solution: have them focus on understanding each other's models and then just sketch the simulation. The point is to see that it is possible, not to do it in detail.
     - The doubling task might be too simple to show the power of the models. But we want them to be able to complete it. Alternatively, we could have provided a more complex task, but time is limited.

  Backup Plan:
     If groups are struggling, provide a pre-designed example for each model to show them. But try to let them design as much as possible.

  Timeline:

  - 0-5 min: Introduction
  - 5-35 min: Group design (30 min)
  - 35-60 min: Jigsaw groups for simulation (25 min)
  - 60-75 min: Plenary discussion and convergence (15 min)
  - 75-85 min: The Challenge (10 min)
  - 85-90 min: Debrief (5 min)

  Note: The debrief is short. You might extend the plenary and challenge by a few minutes if needed and cut the design time a bit if they are ready early.

  Materials to prepare:
  1. Index cards with group constraints (one per group):
     Group1 (Tape model): 
        "Your device has:
          - An infinite tape (divided into cells, initially the input string and the rest blank)
          - A head that reads one cell at a time and can write and move left/right.
          - A finite set of states (including a start state and halt states).
          Rules: At each step, based on current state and symbol read, you can write a symbol, move the head (left or right), and change state."

     Group2 (String rewriting):
        "Your device has:
          - A string of symbols (from an alphabet, including the input and possibly other symbols)
          - A set of replacement rules. Each rule has a pattern and a replacement string. The rule is applied to the beginning of the string if the pattern matches. The machine applies the first matching rule at each step until no rule matches (then it halts)."

     Group3 (Two-stack machine):
        "Your device has:
          - Two stacks (each can hold symbols, initially one stack has the input and the other is empty)
          - A finite set of states.
          Rules: At each step, based on current state and the top symbol of each stack (if a stack is empty, read a special blank symbol), you can pop from either stack, push a symbol onto either stack, and change state."

