  Here's a move-by-move breakdown of Tess and Omar's debate, identifying the stronger point at each stage, what they missed, and potential third options:

  ### 1. **Initial Stance: Who Should Vote?**
  *   **Tess:** Only town residents vote.  
      *Strength:* Practicality & avoiding infinite regress ("if everyone affected votes, where do you stop?").  
  *   **Omar:** Everyone *seriously affected* should vote (incl. downstream town).  
      *Strength:* Moral principle of "no taxation/impact without representation."  
  *   **Who Won This Round:** **Omar**. Tess's "slippery slope" is weak against "seriously affected" vs. "everyone on earth." Omar addresses the core injustice.

  ### 2. **Tess's Counter: Defining "Seriously"**
  *   **Tess:** "Who decides what 'seriously affected' means? You need a rule, but how do you *democratically* set that rule *before* knowing who votes?"  
      *Strength:* Exposes the fundamental circularity problem ("bootstrapping problem") in defining the demos.  
  *   **Omar's Response:** Town borders are also arbitrary & historical. "Seriously affected" allows debate. Proposes a *procedural solution:* Draw a provisional line, let people petition to join if affected, and review periodically.  
      *Strength:* Acknowledges arbitrariness but offers a concrete, democratic *process* to adjust boundaries over time.  
  *   **Who Won This Round:** **Omar**. Tess correctly identifies the core problem, but Omar offers a practical way forward. His solution directly addresses her concern about needing a rule *without* requiring a prior impossible vote.

  ### 3. **Tess's Counter: Instability & Non-Human Impact**
  *   **Tess:** 1) Constant boundary fights prevent settling issues. 2) "Affected" logically extends to the river, fish, future generations, and globally on climate - not just humans who can vote.  
      *Strength:* Highlights practical instability risk and exposes a potential logical flaw/absurdity in "affected interests" theory if taken to extremes.  
  *   **Omar's Response:** 1) Instability is okay, boundaries *shouldn't* be static. 2) Non-voters can be represented by trustees/guardians or protected by rules (e.g., sustainability mandates). Shifts ground: Focuses on **governance/coercion** ("ruled by us").  
      *Strength:* Provides mechanisms to handle non-voting entities without giving them votes. The coercion argument ("if our courts/cops bind them") is a powerful, clearer alternative to "affected."  
  *   **Who Won This Round:** **Omar**. Tess raises valid concerns, but Omar offers responses and importantly pivots to a stronger, more defensible line than "affected" (coercion/governance).

  ### 4. **Tess's Counter: Coercion Doesn't Cover the Harm**
  *   **Tess:** The water harm to farmers isn't direct coercion (like a fine); it's just damage. Omar's coercion standard doesn't cover this case, forcing him back to "affected."  
      *Strength:* Points out a genuine limitation in Omar's newly proposed "coercion" standard. The core harm (water depletion) is impactful but not necessarily an act of *governance* by the town *over* the downstream farmers.  
  *   **Omar:** *(Implied continuation)* Could argue: 1) The town's *permission* for the data center *is* a governing act impacting shared resources, or 2) The harm *is* a form of de facto governance through control of a vital resource, or 3) Fall back to "seriously affected" + procedures.  
  *   **Who Won This Round:** **Tess**. She successfully exposes a gap in Omar's otherwise stronger "coercion" argument. The harm is central to the case and doesn't neatly fit the "ruled by our cops/courts" definition.

  ### Overall Verdict: Who is More Right?
  *   **Omar wins the overall debate.** His arguments were more adaptable and principled. He successfully countered Tess's strongest points (slippery slope, bootstrapping problem) with practical procedural solutions and ultimately landed on the more defensible "coercion/governance" principle. While Tess effectively exposed the weakness of pure "affected interests" and poked a hole in the "coercion" standard, she offered no positive alternative beyond rigid, potentially unjust, municipal borders. Omar's framework is more democratic in spirit and adaptable to complex interdependencies.

  ### What Both Missed
  1.  **Shared Resources Require Shared Governance:** Neither fully grappled with the core issue: **managing common-pool resources (like a river)**. This often requires collaborative institutions (e.g., river basin commissions) *between* jurisdictions, not just expanding one town's vote. Both assumed a single referendum was the *only* democratic solution.
  2.  **Scale Mismatch:** The problem spans multiple governance levels (town, county, watershed). A referendum at *any* single level might be insufficient. County-level decision-making (since the county pays the tax break) combined with mandatory inter-municipal agreements on water might be more appropriate.
  3.  **Representation vs. Direct Vote:** Omar focused on expanding the *voter* pool. Alternatives exist: giving the downstream town representatives on the *decision-making body* (town council oversight? county board?) or requiring their consent for water permits, without giving every downstream resident a vote in *this town's* referendum.
  4.  **The Role of Expertise/Procedure:** Democracy isn't just voting. Robust environmental impact assessments (with public input from *all* affected areas) and permitting processes overseen by regulatory agencies (state/federal water boards) exist to handle precisely these cross-border resource issues *before* a public vote.

  ### Third Options (Beyond Town-Only vs. Expanded Vote)
  1.  **Multi-Level Decision:**
      *   **Town Referendum:** Advisory vote for town residents on hosting the center (addressing local impacts like roads).
      *   **County Approval:** Required for the tax break (since county funds are used).
      *   **State/Federal Water Permit:** Required, with mandatory public hearings involving *all* stakeholders (town, downstream communities, environmental groups) and binding conditions on water usage.
  2.  **Mandatory Inter-Municipal Agreement:** The town referendum result is contingent on successfully negotiating a binding water-sharing/protection agreement with the downstream town(s), approved by *both* councils.
  3.  **Stakeholder Council:** Create a temporary decision-making body for this project, including:
      *   Elected reps from the town.
      *   Elected reps from the downstream town(s).
      *   County representatives (for tax/funding aspect).
      *   Technical experts (water, environment).
      *   *This body* reviews the project and votes on approval.
  4.  **Enhanced Due Process:** Maintain the town-only referendum *but* couple it with:
      *   Legally mandated consultation with downstream communities.
      *   A strong, independent assessment of water impacts with teeth (ability to block the project if harm is severe and unmitigated).
      *   Legal standing for downstream residents to challenge the approval in court based on demonstrable harm.

  **In Conclusion:** Omar's arguments were more robust and democratic in principle, particularly his shift towards the "coercion/governance" standard and his procedural solution to the bootstrapping problem. Tess effectively highlighted practical difficulties and logical pitfalls but offered a less justifiable status quo. The best resolution likely lies *outside* the binary of "who votes in this one referendum?" and involves recognizing the multi-jurisdictional nature of the problem and employing collaborative governance structures or regulatory safeguards.
