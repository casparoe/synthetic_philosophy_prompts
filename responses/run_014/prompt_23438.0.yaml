prompt: |-
  I'm teaching a small seminar on philosophy of biology and two of my students got into a long argument in office hours that I still cant fully untangle, so I'd love a second opinion. They were going over whether a trait's function is fixed by its evolutionary history or by the causal role it plays now, and they kept coming back to the same example, which is the human craving for salt.

  One of them, let's call her Priya, said the salt craving's function is to keep sodium levels in the right range, because that's what it was selected for in an environment where salt was scarce, and the fact that it now drives people to over-consume is a textbook case of malfunction — the trait is doing what it was 'for' but the environment changed out from under it. She insisted this is exactly why you need the etiological account (she waved at Millikan a lot); a purely causal-role account can't even articulate the malfunction, because ont that view the function just is whatever causal role the trait happens to play right now, so if it's playing the role of making people drink too much salt, that's its function and there's nothing for it to be 'failing' at. The other, Tom, pushed back hard. He said Priya's 'proper function' was doing normative work she hadn't earned — you can ground it in selection all you want, but selection isn't goal-directed, so it's not clear how 'what it was selected for' gives you a 'proper' function in the normative sense you need for malfunction, and the whole 'malfunction' language is just normative residue. On his view the only naturalistic option is to say the craving's function is its current causal contribution to fitness, and if that contribution is negative (hypertension, heart disease) then the trait isn't malfunctioning, it's just a maladaptive mismatch, and 'mismatch' is a perfectly naturalistic concept that doesn't need 'proper function' at all. Priya said that collapses the concept of malfunction entirely, since then nothing ever malfunctions, it just does whatever it does. Tom said that's a feature, not a bug, because the malfunction concept is doing all the philosophical work in her account and it's doing it with a premise she hasn't earned.

  They asked me to referee and I honestly couldn't. Can you go through their exchange and say who's right about each specific claim — the malfunction point, the 'proper function is unearned' point, the 'mismatch is naturalistic' move — not just who wins overall? And say what, if anything, both of them are missing, because I have a feeling they're partly talking past each other about what 'function' even means.
reasoning: |-
  Okay, let me try to unpack this philosophy of biology debate between Priya and Tom. The core issue is whether a trait's function is determined by its evolutionary history (etiological view) or its current causal role (causal-role view), using human salt craving as the example. 

  First, I need to map their positions clearly. Priya is firmly in the etiological camp, citing Millikan - she argues salt craving's function is fixed by past selection for sodium regulation, so current overconsumption represents malfunction. Tom rejects this, claiming "proper function" smuggles in unearned normativity since natural selection isn't goal-directed. His alternative is that function equals current fitness contribution - so salt craving isn't malfunctioning, it's just maladaptive due to environmental mismatch.

  Hmm, Priya's strongest point seems to be about malfunction. If function is only what a trait does now (Tom's view), then "malfunction" loses meaning - everything is just functioning as it does. But Tom counters effectively by questioning how an unguided process like natural selection can ground "proper" function. This tension between normativity and naturalism is key.

  I recall that Millikan addresses the normativity issue by distinguishing between "Normal" (historically optimal) and "normal" (statistically common) functioning. But Tom might still argue this relies on a teleological interpretation of selection. Meanwhile, his "mismatch" concept does seem more straightforwardly naturalistic - no need for historical reference.

  Both might be missing nuances in the etiological view. Modern versions like Millikan's don't treat "selected for" as perfectly captured by actual history; it's more about stabilized dispositions. Also, the causal-role account isn't necessarily tied to current fitness - Cummins' original formulation was about systemic capacities, not adaptation.

  The salt craving example perfectly exposes this rift. For Priya, it's clearly malfunctioning relative to its evolutionary purpose. For Tom, that purpose is illusory - it's just a trait that once boosted fitness and now reduces it. Neither seems wrong per se, but they're operating with different functional concepts entirely. 

  I should clarify where each argument holds water: Priya's malfunction critique lands against simplistic causal-role accounts, but Tom correctly spots the teleology problem. His mismatch alternative works for adaptation but not for non-selected traits. Both need to acknowledge that "function" does heavy lifting in multiple contexts - what biologists mean by it varies by subfield.
answer: |-
  Let's break down Priya and Tom's debate point-by-point, referencing key philosophical distinctions. Both positions have merit but miss crucial nuances, and they're indeed using "function" in fundamentally different ways. Here's the analysis:

  ### 1. **Priya's "Malfunction" Argument**
     - **Priya's Claim:** Salt craving "malfunctions" because it fails to achieve its *evolutionarily selected goal* (maintaining sodium balance) due to environmental change.
     - **What She Gets Right:** 
       - The etiological account (Millikan, Neander) *can* coherently define malfunction: a trait malfunctions when it fails to perform the activity for which it was historically selected, under conditions similar to those in which selection occurred.
       - Causal-role accounts (e.g., Cummins) struggle with normative judgments. If function = current causal contribution, salt craving *is* "functioning" by causing salt-seeking behavior—even if harmful.
     - **What She Misses:** 
       - "Malfunction" isn't purely descriptive; it smuggles in normativity. As Tom notes, natural selection lacks goals—it's a mechanistic process. Calling a trait "broken" implies a *design standard*, which requires justifying why historical selection sets that standard.

  ### 2. **Tom's "Proper Function is Unearned Normativity" Argument**
     - **Tom's Claim:** Priya's "proper function" relies on ungrounded normativity because selection isn't goal-directed.
     - **What He Gets Right:** 
       - Natural selection *is* non-teleological. There's no "purpose" in nature—only cause-and-effect. Grounding "proper function" in past selection doesn't fully escape the "normative residue" problem.
       - Etiological accounts *do* implicitly treat evolution as a designing agent (e.g., "what the trait was *for*"), which can be philosophically problematic.
     - **What He Misses:** 
       - Etiological theorists (like Millikan) *don't* claim selection has goals. They define "proper function" counterfactually: a trait's function is what it *did* to increase fitness in ancestral environments. The normativity is *derived* from historical facts, not imputed to nature.
       - Rejecting all normativity leaves biology unable to explain why hearts that don't pump blood are "defective"—a problem etiological accounts solve.

  ### 3. **Tom's "Mismatch is Naturalistic" Move**
     - **Tom's Claim:** "Maladaptive mismatch" (trait + environment reducing fitness) explains salt craving without needing "proper function" or "malfunction."
     - **What He Gets Right:**
       - "Mismatch" *is* naturalistic: it relies only on current fitness consequences and avoids historical/teleological commitments. It's parsimonious and empirically testable.
       - For many biological questions (e.g., conservation, medicine), *current* fitness impact matters more than historical function.
     - **What He Misses:**
       - "Mismatch" can't explain *why* a trait persists despite reducing fitness (e.g., salt craving in modern environments). Etiological function explains this via phylogenetic inertia.
       - It collapses functional categories: If function = current fitness contribution, a trait's "function" changes daily. But biologists often speak of *stable* functions (e.g., "the heart's function is pumping blood," even in a dying organism).

  ### 4. **The Core Conflict: Two Concepts of "Function"**
     - **Etiological Function (Priya):** "What was this trait *selected to do?*" Grounded in evolutionary history. Explains why traits exist and allows "malfunction."  
     - **Causal-Role/Systemic Function (Tom):** "What does this trait *currently contribute* to the system?" Grounded in current causal dynamics. Avoids teleology but loses normativity.  
     - **Both miss that:** These are complementary tools. Biologists use **etiological functions** to explain trait origins/persistence (e.g., "Why do we crave salt?") and **causal-role functions** to analyze mechanisms (e.g., "How does salt craving affect blood pressure?").

  ### Who's Right on Specific Claims?
  | **Claim**                          | **Priya** | **Tom** | **Verdict**                                                                 |
  |------------------------------------|-----------|---------|-----------------------------------------------------------------------------|
  | Salt craving "malfunctions" today  | ✓         | ✗       | **Priya wins** *if* accepting etiological norms. Tom can't define malfunction. |
  | "Proper function" has unearned normativity | ✗        | ✓       | **Tom wins**—but etiologists *do* ground it naturalistically (see below).  |
  | "Mismatch" is naturalistic         | ✗        | ✓       | **Tom wins.** Mismatch requires no teleology.                              |
  | Causal-role accounts collapse malfunction | ✓       | ✗       | **Priya wins.** Pure causal-role lacks normative "failure."                |

  ### Key Insights Both Miss
  1. **Hybrid Accounts Exist:** Philosophers like Karen Neander bridge the gap. Etiological functions *are* naturalistic: "Proper function" is defined by *what caused the trait to be selected* (historical facts), not imputed purposes. A malfunctioning trait is one that fails to perform this selected effect under ancestral conditions.  
  2. **"Function" is Context-Dependent:**  
     - In **evolutionary medicine** (e.g., Nesse & Williams), salt craving *is* a mismatch—but calling it a "malfunction" highlights its *evolutionary legacy*.  
     - In **physiology**, the craving's current causal role (stimulating sodium intake) is primary, even if harmful.  
  3. **Tom's "Mismatch" Needs History Anyway:** To call salt craving a "mismatch," you implicitly contrast current environments with *past* ones where it was adaptive. This quietly relies on etiological context.

  ### Recommendation for Your Seminar
  Reframe the debate: **Both accounts are useful, but for different questions.**  
  - Ask students: "If aliens found a human with hypertension, would they need evolutionary history to call salt craving 'dysfunctional'?"  
    - *Etiological answer:* Yes—without history, they'd see only a mechanism causing harm.  
    - *Causal-role answer:* No—current damage suffices.  
  This reveals the deeper divide: Is "function" about *explaining origins* or *describing mechanisms*?

  **Sources for Context:**  
  - Millikan, *Language, Thought, and Other Biological Categories* (1984) - etiological view.  
  - Cummins, "Functional Analysis" (1975) - causal-role view.  
  - Neander, "The Teleological Notion of ‘Function’" (1991) - reconciles history/normativity.  
  - Godfrey-Smith, "A Modern History Theory of Functions" (1994) - critiques etiological normativity.
