  You are a professional philosopher specialising in consent and sexual ethics, please work through this slowly and carefully, start with a bit of brainstorming about the options before you settle on a diagnosis.

  Had a late kitchen-table debate with my flatmate and now I am stuck with his arguement that seems to prove too much. (1) If someone says yes to sex only because you lied, and they would have said no if they knew the truth, then their consent is not valid. (2) This has to include secret deal-breakers, not just big stuff like stealthing or lying about STIs. If she only sleeps with fellow vegans and you lie about loving bacon, your lie made the difference just as much. (3) And deliberately not mentioning something is the same as lying here, if you know it would have made them say no. (4) But no one can mind-read all the secret deal-breakers a new partner might have. (5) So loads of ordinary, fairly blameless hook-ups end up counting as non-consensual, on a par with stealthing. (6) That cannot be right, it trivialises serious wrongs and makes consent useless for morals and law. So which step do I reject, and what does rejecting it cost? I really want to keep something that explains why stealthing ruins consent, but I do not want every white lie to do that.
reasoning: |-
  Okay, the user presents a complex ethical dilemma about consent and deception in sexual encounters. They've outlined a six-step argument from their flatmate that seems to lead to an absurd conclusion where ordinary hookups could be considered non-consensual due to undisclosed personal preferences. The user wants to preserve the seriousness of violations like stealthing while avoiding overbroad implications.

  Hmm, this is a nuanced issue in sexual ethics. The core tension lies between respecting autonomy through informed consent and practical realities of human interaction. Let me break down the argument step by step. Premise 1 seems solid - deception invalidating consent is well-established in ethics and law. Premise 2 expands this to "deal-breakers," which starts getting problematic. Premise 3 makes omission equivalent to active deception, which might be where the argument overreaches. Premises 4 and 5 highlight the impracticality, leading to the absurd conclusion in 6.

  The user's distress is palpable - they recognize the moral importance of consent but fear diluting serious violations. They're likely seeking both philosophical resolution and practical reassurance that normal behavior isn't immoral. There's also an unstated need to maintain trust in their own past relationships while upholding ethical standards.

  I should consider several approaches: categorical distinctions (materiality/importance), contextual frameworks (reasonable expectations), or intent-based defenses. Materiality seems strongest - not all facts affect consent equally. The vegan example differs fundamentally from STI deception because one concerns sexual health while the other is lifestyle preference. 

  The legal perspective supports this distinction too. Courts consider whether deception prevented understanding of the "sexual nature" of the act. Personal preferences rarely meet that threshold. Still, we must acknowledge gray areas - like lying about vasectomies - which show this isn't always clear-cut.

  Perhaps the solution lies in distinguishing between deception about the act itself versus peripheral matters. The user needs to understand that rejecting premise 3 (omission=lying) or refining premise 2 (defining "deal-breakers") doesn't undermine the condemnation of stealthing. We can maintain ethical rigor without absurdity.
answer: |-
  Your flatmate's argument creates a genuine tension in consent ethics. Let's break it down systematically, examining each premise before settling on a diagnosis. This requires distinguishing between different *types* of deception/omission and their *impact* on consent's validity.

  **Brainstorming the Core Tension:**

  *   **Goal:** We need a principle that condemns serious violations like stealthing or lying about STIs as invalidating consent.
  *   **Problem:** If *any* deception/omission about *anything* the partner considers a deal-breaker invalidates consent, it becomes so broad as to:
      *   Criminalize/morally condemn vast amounts of ordinary behavior.
      *   Impose an impossible epistemic burden (knowing all potential deal-breakers).
      *   Trivialize the profound harm of violations involving bodily integrity, disease, or reproduction.
  *   **Possible Rejection Points & Their Costs:**
      *   **Reject (1):** "Lying never invalidates consent." *Cost:* This abandons the core intuition that deception like stealthing *is* seriously wrong and vitiates consent. Unacceptable.
      *   **Reject (2):** "Only 'big stuff' matters." *Cost:* Needs a principled way to define "big stuff" that doesn't just rely on intuition. Why is bacon less important than an STI *in principle* if both are deal-breakers for the person?
      *   **Reject (3):** "Omission isn't lying." *Cost:* Seems like a semantic dodge. If you *know* revealing a fact would cause a "no" and you deliberately conceal it to get a "yes," the effect on autonomy is similar to an outright lie. Ethically dubious distinction in this context.
      *   **Reject (4):** "People *can* (or *should*) know all potential deal-breakers." *Cost:* Wildly unrealistic. Humans have vast, idiosyncratic preferences. Expecting disclosure of *everything* potentially relevant is absurd and paralyzing.
      *   **Reject (5):** "It *is* right, those hook-ups *are* non-consensual." *Cost:* Leads to moral catastrophe and legal impossibility. Makes consensual sex practically unattainable. Trivializes severe harms by equating bacon lies with rape-by-deception.
      *   **Refine/Reinterpret (1-3):** Distinguish between types of facts/deception based on their *nature* and *relationship to the sexual act itself*.

  **Diagnosis: Reject the Undifferentiated Premise (2) & Refine Premise (1) via the "Materiality" or "Nature of the Act" Distinction**

  The most philosophically sound and practically coherent approach is to **reject the premise that *all* deal-breakers are ethically/legally equivalent regarding consent (Premise 2)** and **refine Premise 1** by introducing a distinction based on **materiality** or the **nature of the act consented to**.

  1.  **Affirm (1) in Principle:** Yes, deception *can* invalidate consent. Autonomy requires making decisions based on reasonably accurate information relevant to the choice.
  2.  **Affirm (3) in Principle:** Deliberate concealment of a known deal-breaker *can* be equivalent to a lie in its effect on autonomy and is generally ethically problematic.
  3.  **Acknowledge (4):** Mind-reading is impossible. Full disclosure of every potential preference is unrealistic.
  4.  **Reject the Undifferentiated Scope of (2):** Not all deal-breakers are created equal concerning the *validity of sexual consent*. We need a criterion to distinguish which deceptions/omissions go to the heart of consent itself.
  5.  **Reject the Conclusion (5) & (6):** The absurd conclusion shows the initial premises are flawed in their undifferentiated application. We need a limiting principle.

  **The Crucial Distinction: Materiality / Fundamental Nature of the Act**

  *   **Deception/Omission about the *Nature of the Act* or *Fundamental Qualities of the Partner Relevant to Sexual Risk/Autonomy*:** This invalidates consent. The deceived party did not consent to *the act that actually occurred* or *the fundamental risks involved*.
      *   **Examples:** Stealthing (consent was to *protected* sex, not unprotected), lying about having an STI (alters the fundamental health risks consented to), impersonating someone else (consent was given to *A*, not *B*), lying about fertility (if reproduction is a known factor).
      *   **Why?** These deceptions directly concern the physical act itself, its inherent risks (disease, pregnancy), or the identity of the participant. They prevent the person from understanding *what they are actually agreeing to do* or *with whom* or *under what fundamental conditions*.
  *   **Deception/Omission about *Peripheral Preferences, Values, or Future Intentions*:** This is generally unethical (dishonest, manipulative), but *does not necessarily invalidate the consent to the sexual act itself*.
      *   **Examples:** Lying about being vegan, wealth, marital *intentions* (vs. actual marital *status*), job title, liking their taste in music, future commitment potential (unless it's a direct lie about the *nature* of the current encounter, e.g., "this is a relationship" for a one-night stand).
      *   **Why?** While these facts might influence the decision to engage in sex, the deception doesn't alter the core understanding of the *specific physical act* being consented to at that moment, its immediate risks, or the identity of the person. The person consents to sex *with this person, here, now*, understanding the basic nature of intercourse. The lie affects their *reasons* for saying yes, not their understanding of *what* they are saying yes to. We generally accept that people enter intimate encounters based on imperfect information about each other's character and history. Holding everyone accountable for every undisclosed preference that *might* be a deal-breaker is impossible and paralyzing.

  **Applying the Distinction to Your Examples:**

  *   **Stealthing:** Clear violation of the *nature of the act*. Consent was conditional on barrier use. Removing it fundamentally changes the act and its risks.
  *   **Lying about STI Status:** Clear violation concerning *fundamental risks* inherent in the act.
  *   **Lying about Loving Bacon (Vegan Deal-Breaker):** While deceptive and potentially hurtful, it concerns a *peripheral value/preference*, not the nature of the sexual act or fundamental risks. The vegan consented to sex *with this specific person* (even if under a misconception about their diet). The lie doesn't change *what* they physically did together. (Ethically wrong? Likely. Invalidates consent? No).
  *   **Not Disclosing a Past Felony (if a deal-breaker):** Similar to bacon. While significant, it typically doesn't alter the fundamental nature of the sexual act consented to *at that moment*.

  **Costs of This Distinction & Responses:**

  1.  **"It's Subjective/Arbitrary! Who defines 'fundamental'?"**
      *   *Response:* While edges can be fuzzy (e.g., lying about a vasectomy?), core cases are clear. Legal systems and ethical frameworks often make materiality distinctions (e.g., contract law, fraud). We focus on deception concerning the act's inherent characteristics (physical nature, health risks, identity) vs. broader life circumstances or values. Courts often ask: "Would a reasonable person consider this fact material to consenting to *this sexual act*?" or "Did the deception prevent understanding the *sexual nature of the act*?"
  2.  **"It disrespects the deceived person's autonomy! Their 'yes' was conditional on that fact!"**
      *   *Response:* Autonomy is crucial, but consent operates within practical and epistemic limits. We cannot guarantee partners know *all* our conditions. Autonomy requires freedom to make choices based on available information, not a guarantee of perfect information. We protect autonomy from fundamental deception about the act itself, not from all disappointment or regret based on later discoveries about character or values.
  3.  **"What about lying about using birth control?"**
      *   *Response:* This is a strong candidate for the "fundamental risk/nature" category. Pregnancy is a direct, potentially life-altering physical consequence of the sexual act. Deception about measures taken to mitigate that fundamental risk strikes at the core of what is being consented to (sex *under conditions X* regarding reproduction). This is materially different from lying about bacon.

  **Conclusion:**

  Reject the undifferentiated application of **Premise 2**. Not every undisclosed deal-breaker invalidates consent. Uphold Premises 1 and 3 *only* when the deception or omission concerns the **fundamental nature of the sexual act, the identity of the partner, or inherent, fundamental risks directly involved in the act (like disease transmission or pregnancy)**. This preserves the condemnation of egregious violations like stealthing and STI lies as consent-vitiating, while acknowledging that ordinary human interactions involve imperfect knowledge and that consent can be valid even if based on incomplete information about preferences and values that don't alter the core act itself. The "cost" is accepting that some deceptive or manipulative behavior, while ethically wrong, doesn't rise to the level of negating consent in the legal or core moral sense reserved for violations of bodily integrity and fundamental sexual autonomy.
