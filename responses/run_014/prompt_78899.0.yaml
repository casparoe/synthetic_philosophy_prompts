answer: |-
  ### Problem: Iterated Elimination of Dominated Strategies (20 marks total)  
  Player 1 chooses **Top (T)**, **Middle (M)**, or **Bottom (B)**. Player 2 chooses **Left (L)** or **Right (R)**. Player 1’s payoffs are:  
  - **T**: 3 (vs. L), 3 (vs. R)  
  - **M**: 5 (vs. L), 2 (vs. R)  
  - **B**: 2 (vs. L), 5 (vs. R)  

  **Part 1 (6 marks)**  
  (a) Show that **T** is strictly dominated by an **equal mixture of M and B** (i.e., probability 0.5 each), but not by **M alone** or **B alone**.  
  (b) What does this imply about the formal definition of strict dominance? Specifically, what must the dominating object be, and what must the inequality satisfy?  
  (c) For each pure strategy of player 2 (L or R), is **T** ever a best response? What does this show (and not show) about **T**?  

  **Part 2 (5 marks)**  
  Explain why the **order of elimination cannot matter** when **only strictly dominated strategies** are removed. Use a precise argument (e.g., about shrinking strategy sets), not a slogan.  

  **Part 3 (5 marks)**  
  Construct a small example (e.g., 2x2 game) where **iterated elimination of weakly dominated strategies** leads to **different surviving strategies** depending on the order of elimination. Specify payoffs, show both orders, and state which strategies survive in each order.  

  **Part 4 (4 marks)**  
  (a) Can iterated elimination of strictly dominated strategies (IESDS) ever eliminate a strategy used in a Nash equilibrium (NE)? Argue rigorously.  
  (b) Does this hold for weakly dominated strategies? Give a concrete example.  

  ---

  ### Model Answer (Self-contained, 850 words)  
  **Part 1**  
  *(a)*  
  - **M alone vs. T**: If player 2 plays L, M gives 5 > 3 (T). But if player 2 plays R, M gives 2 < 3 (T). Thus, M does not strictly dominate T.  
  - **B alone vs. T**: If player 2 plays L, B gives 2 < 3 (T). If player 2 plays R, B gives 5 > 3 (T). Thus, B does not strictly dominate T.  
  - **Equal mix (0.5M, 0.5B) vs. T**:  
    - Against L: Expected payoff = (0.5)(5) + (0.5)(2) = 3.5 > 3 (T).  
    - Against R: Expected payoff = (0.5)(2) + (0.5)(5) = 3.5 > 3 (T).  
    Since 3.5 > 3 for both L and R, the mixture strictly dominates T.  

  *(b)*  
  This shows that the dominating object in strict dominance must be a **mixed strategy** (or pure, as a degenerate case). The formal definition requires:  
  - A strategy \(s_i\) is strictly dominated if there exists **another strategy (pure or mixed)** \(\sigma_i\) such that for **every possible strategy** \(s_{-i}\) of other players, \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\).  

  *(c)*  
  - **Best response to L**: M gives 5, T gives 3, B gives 2 → Best response is M (not T).  
  - **Best response to R**: B gives 5, T gives 3, M gives 2 → Best response is B (not T).  
  Thus, T is **never a best response to any pure strategy** of player 2. However, this **does not show** that T is strictly dominated. It only shows T is never a pure-strategy best response. Strict dominance requires domination against **all** opponent strategies (including mixed, but here player 2 has only pure strategies), which we established in (a) requires a mixed strategy.  

  ---  
  **Part 2**  
  Order cannot matter for strict dominance because:  
  - Let \(S^k\) be the strategy set at step \(k\). Suppose strategy \(s_i\) is strictly dominated in \(S^k\) by some \(\sigma_i\).  
  - After eliminating any other strictly dominated strategy \(s_j\), the new set \(S^{k+1} \subseteq S^k\).  
  - Since \(\sigma_i\) still exists in \(S^{k+1}\) (as we only remove strategies), and the strict inequality \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\) holds for **all** \(s_{-i}\) in the **original set**, it holds for the smaller set \(S^{k+1}\) (as fewer \(s_{-i}\) only weakens the condition). Thus, \(s_i\) remains strictly dominated in \(S^{k+1}\).  
  - Crucially, **no strategy can "reappear"** once eliminated. The sets shrink monotonically: \(S^0 \supseteq S^1 \supseteq S^2 \supseteq \cdots\).  
  - **Why it fails for weak dominance**: Weak dominance uses \(\geq\) with strict inequality for some \(s_{-i}\). If elimination removes the \(s_{-i}\) where strict inequality held, a weakly dominated strategy may no longer be dominated in the smaller set.  

  ---  
  **Part 3**  
  **Example**: Player 1: {U, D}, Player 2: {L, R}. Payoffs for player 1 (player 2’s payoffs irrelevant for dominance):  
  - U: 1 (vs. L), 0 (vs. R)  
  - D: 0 (vs. L), 0 (vs. R)  

  **Order 1: Eliminate U first**  
  - U is weakly dominated by D:  
    - Against L: D gives 0 < 1 (U) → not strict.  
    - Against R: D gives 0 = 0 (U).  
    Since \(u_1(D, s_2) \geq u_1(U, s_2)\) for all \(s_2\), with strict inequality against L, U is weakly dominated by D. Eliminate U.  
  - Remaining strategies: D for player 1, {L,R} for player 2. No further dominated strategies. **Survivor: D**.  

  **Order 2: Eliminate D first**  
  - D is weakly dominated by U:  
    - Against L: U gives 1 > 0 (D).  
    - Against R: U gives 0 = 0 (D).  
    Thus, D is weakly dominated by U. Eliminate D.  
  - Remaining strategies: U for player 1, {L,R} for player 2. No further dominated strategies. **Survivor: U**.  
  **Conclusion**: Different orders lead to different survivors (D vs. U).  

  ---  
  **Part 4**  
  *(a)* **No**. IESDS never eliminates a strategy used in a Nash equilibrium.  
  - **Proof**: Let \((s_i^*, s_{-i}^*)\) be a NE. Suppose \(s_i^*\) is strictly dominated by some \(\sigma_i\) in the original game. Then:  
    \[ u_i(\sigma_i, s_{-i}^*) > u_i(s_i^*, s_{-i}^*). \]  
    This contradicts the NE condition that \(s_i^*\) must be a best response to \(s_{-i}^*\). Thus, \(s_i^*\) cannot be strictly dominated and survives IESDS.  

  *(b)* **No**, for weak dominance.  
  - **Example**: Use the 2x2 game from Part 3.  
    - NE: (U,L) is a NE (player 1 gets 1, best against L; player 2 can get any payoff ≥ other options, but since dominance depends only on player 1, we can assign player 2 payoffs, e.g., L: 1 if U, 0 otherwise; R: 0 always).  
    - In Order 1 (eliminate U first), we eliminated U, which is used in NE.  
    - Thus, iterated weak dominance can eliminate NE strategies.  

  ---

  ### Marking Scheme (20 marks total)  
  **Part 1 (6 marks)**  
  - (a) **2 marks**: Shows pure M/B fail to dominate T (1 mark), shows mixed strategy dominates T (1 mark).  
    *B-range: Misses one pure comparison or miscalculates mix.*  
  - (b) **2 marks**: States dominating object can be mixed (1 mark), inequality must hold against all opponent strategies (1 mark).  
    *B-range: Says "pure strategy" or omits "all strategies".*  
  - (c) **2 marks**: Notes T is never best response to pure L/R (1 mark), clarifies this does not imply strict dominance (1 mark).  
    *B-range: Claims "never best response" implies strict dominance.*  

  **Part 2 (5 marks)**  
  - **3 marks**: Explains sets shrink monotonically (1 mark), dominated strategies remain dominated in subsets due to strict inequality (2 marks).  
  - **2 marks**: Contrasts weak dominance (inequality may fail if critical \(s_{-i}\) is removed).  
    *B-range: Vague on why strict inequality preserves dominance (e.g., "by monotonicity").*  

  **Part 3 (5 marks)**  
  - **3 marks**: Correct 2x2 example with payoffs (1 mark), shows two orders with eliminations (1 mark), different survivors (1 mark).  
  - **2 marks**: Explicitly states example is minimal (2x2) and order-dependent.  
    *B-range: Example is order-independent (e.g., identical payoffs) or not 2x2. Auto −2 if survivors same.*  

  **Part 4 (4 marks)**  
  - (a) **2 marks**: Correct "no" (0.5 marks), proof by contradiction with NE definition (1.5 marks).  
  - (b) **2 marks**: Correct "no" for weak (0.5 marks), valid example (e.g., Part 3 game) (1.5 marks).  
    *B-range: Wrong answer for (a) or example doesn’t eliminate NE strategy.*  

  ### Failure Mode Checks  
  - **Part 1(c)**: If student equates "never pure-strategy best response" with "strictly dominated", deduct −1 (B-range error).  
  - **Part 2**: If calls order-independence "algorithmic" without set logic, deduct −2.  
  - **Part 3**: If example is accidentally order-independent, mark as B-range (max 2/5).
