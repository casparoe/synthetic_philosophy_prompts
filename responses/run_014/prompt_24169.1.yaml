  We are going to produce a document that captures the agreements, disagreements, and cruxes between a consciousness illusionist and a realist, following an adversarial collaboration.

  ## Agreed Claims (Both Sides Sign)

  1. **Cognitive Architecture:** The brain constructs a self-model that integrates sensory inputs, memories, and predictions to produce a coherent representation of the self and the world. This self-model includes representations of mental states, including the state of being aware.

  2. **The User Illusion Label:** The term "user illusion" refers to the idea that the self-model is a simplified, useful interface constructed by the brain that may not directly correspond to the underlying neural processes. Both agree that the self-model can misrepresent the underlying mechanisms (e.g., by presenting a unified and continuous sense of self when the underlying processes are fragmented and discontinuous). However, the illusionist claims that the self-model misrepresents itself as having phenomenal consciousness (in the sense of intrinsic qualitative character), while the realist maintains that the self-model is representing a real phenomenon (phenomenal consciousness) that exists independently of the representation.

  3. **Explanatory Gap Argument:** The explanatory gap argument points out that even a complete physical or functional account of the brain may leave unanswered the question of why certain processes are accompanied by subjective experience (what it is like) or why they have the specific qualitative character they do. Both agree that this gap exists in current scientific understanding. However, the illusionist interprets this gap as an indication that the concept of phenomenal consciousness (as an intrinsic property) is a misrepresentation, while the realist sees it as pointing to a fundamental aspect of reality that is not captured by physical or functional descriptions.

  4. **Role of Reports:** Verbal reports and behaviors that indicate conscious experiences (e.g., "I see red") are products of the self-model and its access to certain information. Both agree that these reports are generated by cognitive processes and can be studied objectively.

  5. **Evidence from Pathology:** Conditions such as blindsight and Charles Bonnet syndrome reveal dissociations between different aspects of processing. In blindsight, individuals can respond to visual stimuli without reporting seeing them. In Charles Bonnet syndrome, individuals have vivid visual experiences without corresponding external stimuli. Both agree that these cases show that the self-model can be partially decoupled from sensory input and that the generation of reports about experiences can be dissociated from the processing of sensory information.

  ## Disagreement

  The core disagreement is about the nature of phenomenal consciousness:

  - **Illusionist View:** Phenomenal consciousness, understood as the intrinsic qualitative character of experience (e.g., the redness of red, the painfulness of pain), is an illusion. The self-model represents itself as having such properties, but in reality, there is nothing more than the information processing and the representational content. The feeling of having experiences is a useful fiction that the brain creates to guide behavior, but it does not correspond to any non-physical or intrinsic property.

  - **Realist View:** Phenomenal consciousness, as the intrinsic qualitative character of experience, is real and cannot be reduced to information processing or representational content alone. Even if the self-model is a construction and may misrepresent some aspects, the fact that there is something it is like to be the system is a fundamental feature of reality. The explanatory gap exists because physical and functional accounts do not capture this intrinsic aspect.

  ## Cruxes

  Cruxes are sub-questions that, if resolved, would move at least one side. We present each crux with a concrete case or argument that both sides agree bears on it, and each side's prediction.

  ### Crux 1: The Agency Analogy Transfer

  - **Concrete Case:** The illusionist argues that our sense of agency is a post-hoc construction (as shown by experiments like Libet's, where the brain prepares for action before the conscious decision). The illusionist claims that the feeling of being the agent is an illusion, but there is a real experience of agency (i.e., the self-model represents the system as having agency). The realist agrees that the sense of agency might be a construction but argues that the experience of agency (the phenomenal aspect) is real.

  - **Illusionist Prediction:** If we can show that the experience of agency is entirely constructed and that there is no additional phenomenal property beyond the representation, then the same should hold for other experiences, including sensory ones. For example, in cases of alien hand syndrome, the individual may feel that the hand is moving without their agency. The illusionist predicts that the experience of agency can be fully explained by the self-model without invoking intrinsic properties.

  - **Realist Prediction:** Even if the sense of agency is constructed, the fact that there is a subjective experience (what it feels like to have the sense of agency) is irreducible. The realist predicts that if we were to remove the self-model's representation of agency (e.g., via brain injury), the experience of agency would vanish, but that would not show that it was never real; it would show that the representation was necessary for the experience. The realist maintains that the experience itself is real and not reducible.

  - **How Settling This Moves the Dial:** If it were shown that the experience of agency is nothing but the representational content (and there is no residual "what it's like" beyond that), the realist might have to concede that the same could hold for other experiences. Conversely, if the experience of agency is shown to have an irreducible phenomenal character, the illusionist would face a challenge.

  ### Crux 2: Explanation of Representational Content without Circularity

  - **Concrete Case:** The illusionist claims that the self-model represents itself as having experiences (with qualitative character). The realist asks: what explains the representational content without invoking the very thing that is being explained? The illusionist must provide an account of how the brain comes to represent itself as having phenomenal properties without presupposing phenomenal properties.

  - **Illusionist Explanation (Prediction):** The illusionist argues that the representational content arises from the brain's model of itself as an embodied agent in the world. For example, the brain uses concepts like "seeing red" that are grounded in sensory input and internal states. This content can be explained by the functional role of these representations without invoking intrinsic qualia. A concrete case: in blindsight, the self-model does not represent visual information, so there is no report of seeing. In a functional duplicate that reports "nothing" (e.g., a zombie in philosophy), the illusionist would say that such a duplicate is impossible because the functional processes (including the self-model) would produce the same reports and behaviors as a conscious being. Thus, the illusionist predicts that any system with the same functional architecture (including the self-model) would represent itself as having experiences.

  - **Realist Challenge (Prediction):** The realist argues that even if the self-model represents itself as having experiences, this representation must be about something real. If we had a system that was functionally identical but lacked phenomenal consciousness (a philosophical zombie), it would still report having experiences, but we would know (by hypothesis) that it lacks the experience. The realist predicts that there is an explanatory gap in the illusionist account: it cannot explain why the representational content of the self-model includes the concept of intrinsic qualitative character unless there is something real that it is tracking (even if imperfectly). The realist would point to cases like Charles Bonnet syndrome: the vivid visual experiences are generated internally, but they have a phenomenal character that is not present in normal perception. The illusionist must explain why these representations feel like something without invoking the feeling.

  - **How Settling This Moves the Dial:** If the illusionist can provide a non-circular explanation of the representational content (e.g., via a detailed cognitive architecture that shows how the self-model acquires the concept of experience without presupposing it), the realist might be forced to reconsider. Conversely, if the realist can show that any such explanation implicitly relies on the existence of phenomenal properties, the illusionist would have to address that circularity.

  ### Crux 3: The Possibility of a Functional Duplicate with No Experience

  - **Concrete Case:** Consider a hypothetical functional duplicate of a human (a zombie) that behaves exactly like a conscious human but lacks phenomenal consciousness. Both sides agree that such a duplicate is logically possible only if consciousness is not entirely functional.

  - **Illusionist Prediction:** The illusionist denies the possibility of a functional duplicate without experience because the functional architecture (including the self-model) is what constitutes consciousness. Therefore, any functional duplicate would have the same self-model and thus the same representational content, which is what it means to have experiences (even if they are illusions). The illusionist predicts that if we could build a system with the same functional architecture, it would have the same experiences (or the same illusions) as a human.

  - **Realist Prediction:** The realist maintains that a functional duplicate without phenomenal consciousness is conceivable, and this conceivability shows that functional properties do not entail phenomenal properties. The realist predicts that even if we built a system that was functionally identical, we would not know if it has experiences, but the explanatory gap would remain. The realist might point to the inverted spectrum thought experiment: two individuals could have the same functional architecture but different qualitative experiences (e.g., one sees red as the other sees green). The illusionist would counter that the functional architecture would capture the inversion, but the realist would insist that the functional description does not capture the qualitative character.

  - **How Settling This Moves the Dial:** If it were proven that a functional duplicate must have experiences (or the same illusions), the realist would have to abandon the zombie argument. Conversely, if it were shown that functional properties do not entail phenomenal properties (e.g., by constructing a system that behaves identically but without subjective experience), the illusionist would have to concede that there is more to consciousness than function.

  ## Evidence Against Own View

  - **Illusionist:** If it were discovered that a system without a self-model (e.g., a simple organism) had experiences, that would challenge the illusionist view because the illusionist ties the illusion to the self-model. Also, if a system with a self-model could be shown to lack any representational content about experiences (e.g., a human with a specific brain lesion) but still reported experiences, that would be problematic. Additionally, if a non-biological system (e.g., a computer) running the same functional architecture as a human were built and it clearly lacked experiences (as judged by some objective measure), that would challenge the illusionist.

  - **Realist:** If neuroscience could fully explain the qualitative character of experiences by functional processes alone (e.g., show that the feeling of pain is nothing more than a certain kind of information processing in the brain), that would challenge the realist. Also, if it could be shown that the self-model is sufficient to explain all aspects of experience without any residual gap, the realist would have to reconsider. Moreover, if a system without any biological features (e.g., a silicon-based computer) could have experiences that are subjectively indistinguishable from human experiences, that would support functionalism and challenge the realist's emphasis on intrinsic properties.

  ## Verbal Dispute?

  The document should address whether part of the dispute is verbal. Both sides agree that the term "phenomenal consciousness" is being used in a way that might lead to talking past each other:

  - The illusionist typically defines phenomenal consciousness as an intrinsic qualitative property (which they deny) and instead sees consciousness as a representational property of the self-model.

  - The realist defines phenomenal consciousness as the intrinsic qualitative character that exists independently of the representation.

  Thus, the dispute is partially verbal because they are using the same term for two different concepts. However, there is a substantive disagreement: the realist believes there is an intrinsic property that the self-model is tracking (even if imperfectly), while the illusionist denies that such a property exists and sees the self-model as creating a fictional representation.

  Therefore, the core disagreement is not merely verbal: it is about whether there is an aspect of reality (intrinsic qualitative character) that is not captured by functional or representational accounts.

  ## Document Structure

  We now present the document in the requested format.

  ---

  **Adversarial Collaboration Report: Illusionism vs. Realism about Phenomenal Consciousness**

  **Agreed Claims:**

  1. **Cognitive Architecture:** The human brain constructs a dynamic self-model that integrates sensory, motor, and cognitive information to produce a coherent representation of the self and the world. This self-model includes representations of mental states, such as perceptions, thoughts, and emotions, and it supports the ability to report on these states.

  2. **User Illusion Commitment:** The term "user illusion" commits the illusionist to the claim that the self-model is a simplified and useful interface that may misrepresent the underlying neural mechanisms (e.g., by presenting a unified self when the processes are distributed). Both agree that the self-model can be inaccurate, but the illusionist additionally claims that the representation of phenomenal consciousness (as intrinsic qualitative properties) is a misrepresentation, while the realist maintains that the self-model accurately represents (though perhaps imperfectly) a real phenomenon.

  3. **Explanatory Gap Argument:** The explanatory gap argument highlights that current physical and functional explanations do not account for why certain processes are accompanied by subjective experience or why they have the specific qualitative character they do. Both agree that this gap exists and that it poses a challenge to current scientific understanding. However, the illusionist interprets the gap as evidence that the concept of phenomenal consciousness (as an intrinsic property) is an illusion, while the realist interprets it as evidence that phenomenal consciousness is a fundamental aspect of reality.

  4. **Role of Reports:** Verbal and behavioral reports about conscious experiences are generated by the self-model and are the result of cognitive processes that can be studied objectively. Both agree that these reports do not provide direct access to the underlying mechanisms but are data that must be explained.

  5. **Evidence from Pathology:** Conditions such as blindsight (where individuals can discriminate visual stimuli without reporting seeing them) and Charles Bonnet syndrome (where individuals have vivid visual experiences without external stimuli) demonstrate dissociations between sensory processing, the self-model, and reporting mechanisms. Both agree that these cases show that the self-model can be decoupled from sensory input and that reports of experiences can be dissociated from the processing of sensory information.

  **Disagreement Table:**

  | Issue | Illusionist View | Realist View |
  |-------|------------------|-------------|
  | **Nature of Phenomenal Consciousness** | Phenomenal consciousness (intrinsic qualitative character) is an illusion generated by the self-model. There is nothing more than information processing and representational content. | Phenomenal consciousness (intrinsic qualitative character) is real and cannot be reduced to information processing or representational content. The self-model represents this real phenomenon. |
  | **Explanation of Subjective Experience** | The "what it's like" aspect of experience is fully explained by the representational content of the self-model. | The "what it's like" aspect of experience is not fully explained by representational content; it is an intrinsic property. |

  **Cruxes:**

  **Crux 1: Agency Analogy Transfer**

  - **Concrete Case:** Experiments on the sense of agency (e.g., Libet) show that the feeling of agency is constructed post-hoc. The illusionist extends this to all experiences, while the realist argues that the experience of agency itself has a phenomenal character that is real.

  - **Illusionist Prediction:** If we can manipulate the self-model to remove the representation of agency (e.g., via brain stimulation or in neurological disorders), the experience of agency will disappear, and there will be no residual phenomenal property.

  - **Realist Prediction:** Even if the representation of agency is altered, the underlying experience (if any) might change, but the fact that there is an experience at all (when present) is not reducible to the representation.

  - **Settling Impact:** If the illusionist prediction holds (e.g., by showing that altering the self-model eliminates the experience without any further effect), it supports illusionism. If the realist can show that altering the self-model leaves an unexplained phenomenal residue, it supports realism.

  **Crux 2: Explanation of Representational Content without Circularity**

  - **Concrete Case:** How does the self-model come to represent itself as having experiences with qualitative character? The illusionist must explain this without invoking the very phenomenal properties they deny.

  - **Illusionist Prediction:** The representational content is grounded in the functional role of the self-model and its interactions with the environment. For example, the concept of "red" is acquired through learning and is tied to sensory inputs and behavioral responses. In a system with the same functional architecture (e.g., a sophisticated robot), the self-model would naturally represent itself as having experiences.

  - **Realist Prediction:** The illusionist's explanation will either be circular (implicitly assuming phenomenal properties) or leave an explanatory gap. For instance, in Charles Bonnet syndrome, the vividness of the experience cannot be fully explained by representational content alone without invoking the intrinsic character of the experience.

  - **Settling Impact:** If the illusionist can provide a non-circular, mechanistic explanation (e.g., via computational models), it would support illusionism. If the realist can show that the explanation must invoke phenomenal properties, it would support realism.

  **Crux 3: Possibility of a Functional Duplicate without Experience**

  - **Concrete Case:** The philosophical zombie thought experiment: a being that is functionally identical to a human but lacks phenomenal consciousness.

  - **Illusionist Prediction:** Such a duplicate is impossible because functional identity includes the self-model, which produces the representation of having experiences. Therefore, the duplicate would have the same illusions as a human.

  - **Realist Prediction:** The zombie is conceivable, and this conceivability shows that functional properties do not entail phenomenal properties. Therefore, a functional duplicate might lack experiences even if it reports having them.

  - **Settling Impact:** If it becomes possible to build a functional duplicate and empirically test whether it has experiences, the outcome could resolve the issue. If the duplicate reports experiences and we have no reason to doubt it (as per illusionism), that would challenge realism. If we could detect an absence of experience (e.g., by a fundamental theory of consciousness), that would challenge illusionism.

  **Evidence Against Own View:**

  - **Illusionist:** 
    - If a system without a self-model (e.g., an insect) could be shown to have experiences, it would challenge the necessity of the self-model for consciousness.
    - If a system with a functionally identical self-model (e.g., a robot) were built and it clearly lacked subjective experiences (by some objective measure), it would challenge illusionism.

  - **Realist:**
    - If neuroscience provides a complete physical/functional explanation of qualitative character (e.g., explaining why a particular neural pattern feels like red), it would challenge the need for intrinsic properties.
    - If a non-biological system (e.g., an AI) could have subjectively rich experiences, it would support functionalism and challenge the idea that biological properties are essential.

  **Verbal Dispute Analysis:**

  The parties agree that the term "phenomenal consciousness" is used differently:

  - The illusionist uses it to refer to the putative intrinsic qualitative properties that they deny.
  - The realist uses it to refer to the intrinsic qualitative properties that they affirm.

  Thus, part of the dispute is verbal. However, there is a substantive disagreement: the realist believes there are intrinsic qualitative properties that exist independently of the self-model's representation, while the illusionist denies this. The core issue is ontological, not merely semantic.

  **Conclusion:**

  The collaboration has clarified points of agreement and disagreement and identified key cruxes. Future work should focus on empirical and theoretical investigations of these cruxes.

