prompt: |-
  I teach a graduate seminar on theories of causation, and I'm setting the single essay question for this term's take-home final (a 72-hour window, student answers capped at 2,500 words). Every year a good fraction of students describe Woodward's interventionist theory as though it simply swapped out Lewis's counterfactuals for something else -- "manipulability" instead of "dependence" -- and treat the two views as rivals in the way the counterfactual theory and a causal-process theory are rivals. Half of them have clearly gotten this from skimming the SEP entry on causation and manipulability without reading past the introduction. I want a question this year that makes that slogan impossible to lean on: it has to force students to say exactly what Woodward keeps from Lewis's semantics for counterfactuals and what he changes -- surgical intervention on a structural equation, versus overall similarity of worlds -- to say whether his theory is even meant to be reductive, and then to use the standard case of late preemption (Billy and Suzy each throw a rock at a bottle, and Suzy's gets there first) to show that sharing a counterfactual pedigree doesn't stop the two traditions from handling the case differently, and at different costs.

  Please write the question itself, a model answer of around 650 words that hits everything a strong answer needs to hit, and a marking scheme built around the specific moves that separate an A-range answer from a merely competent B-range one. In particular, I'd like the scheme to state explicitly: whether the student correctly explains why Lewis's original 1973 account (causation as the ancestral of counterfactual dependence) copes with early preemption but not late preemption; whether they can explain how the structural-equations/interventionist tradition tries to recover the right verdict for late preemption by holding some variables fixed at non-actual values while testing others; whether they notice that this move, left unsupplemented, also certifies the preempted backup (Billy's throw) as a cause, which is the wrong result; and whether they can say anything about what blocking that over-generation costs a theory that has already conceded it isn't reductive. For each of these points, please also flag the specific wrong turn a weaker answer tends to take -- for instance, students who think the two theories differ over whether counterfactuals are involved at all, rather than over which counterfactuals and what grounds them. No need for a reading list -- I'll add my own references to Lewis, Woodward, Hitchcock, and Halpern and Pearl afterward.
reasoning: |-
  We are designing an exam question that forces students to engage deeply with the differences between Lewis's counterfactual theory and Woodward's interventionist theory, particularly in how they handle late preemption. The question should make it impossible for students to rely on the superficial slogan that interventionism just replaces counterfactuals with manipulability.

  The key elements the question must cover:
  1. What Woodward keeps and changes from Lewis's counterfactual semantics (structural equations and interventions vs. overall similarity of worlds).
  2. Whether Woodward's theory is reductive (it isn't, because it relies on causal structure in the structural equations).
  3. Use the standard case of late preemption (Suzy and Billy) to show how the two theories handle it differently and the costs involved.

  We also need a model answer (around 650 words) and a detailed marking scheme.

  The marking scheme should specifically check for:
  - Correct explanation of why Lewis's 1973 account (causation as ancestral of counterfactual dependence) handles early preemption but fails for late preemption.
  - How the interventionist approach (using structural equations and interventions) tries to solve late preemption by holding some variables fixed at non-actual values.
  - The problem that without supplementation, this move also certifies the preempted backup (Billy) as a cause (over-generation).
  - Discussion of what blocking that over-generation costs the theory (especially given it's non-reductive).

  Common pitfalls to flag:
  - Thinking that interventionism doesn't use counterfactuals at all (it does, but they are interventionist counterfactuals).
  - Confusing the differences between the theories (they both use counterfactuals, but the semantics and the grounding differ).

  Let's design the question first.

  **Question:**

  In his 1973 paper "Causation", David Lewis defines causation as the ancestral of counterfactual dependence. James Woodward's interventionist theory of causation, as presented in *Making Things Happen*, uses counterfactuals that are evaluated with respect to interventions. Both theories employ counterfactuals, but they differ in how these counterfactuals are understood and evaluated.

  (a) Explain the key difference in the semantics of counterfactuals between Lewis's theory and Woodward's. In particular, what does Woodward retain from Lewis's counterfactual framework, and what does he change? (Word limit: 500 words)

  (b) Both theories face challenges in handling cases of preemption. Using the standard example of late preemption (where Suzy and Billy both throw rocks at a bottle, Suzy's rock arrives first and shatters the bottle, and Billy's rock would have shattered it had Suzy not), explain:

  (i) Why Lewis's original 1973 account correctly handles early preemption but fails for late preemption.

  (ii) How Woodward's interventionist approach, using structural equations and interventions, attempts to solve the problem of late preemption. In your explanation, be sure to describe how the interventionist approach uses the technique of holding some variables fixed at non-actual values while testing others.

  (iii) Why, without further refinement, the interventionist approach as described in (b)(ii) over-generates causes by counting Billy's throw as a cause of the bottle shattering? 

  (iv) What does the interventionist theory have to do to block this over-generation, and what are the implications of this move for the theory's overall structure, especially given that Woodward's theory is not reductive?

  (Word limit for part (b): 2000 words)

  **Model Answer (approx. 650 words):**

  (a) Both Lewis and Woodward use counterfactuals in their theories of causation. Lewis evaluates counterfactuals by considering the similarity of possible worlds: a counterfactual "If A were the case, then C would be the case" is true if in the closest world(s) where A holds, C also holds. The closeness is determined by overall similarity, with an emphasis on avoiding big, widespread violations of law. Woodward, however, evaluates counterfactuals through interventions. An intervention is an ideal manipulation that sets the value of a variable while leaving other variables unaffected, except through the causal paths allowed by the structural equations. Woodward retains the idea that causation involves counterfactual dependence but changes the semantics: instead of similarity of worlds, counterfactuals are grounded in a set of structural equations that represent causal relationships. This makes Woodward's counterfactuals more precise and context-dependent but also non-reductive because the structural equations themselves encode causal information.

  (b) (i) Lewis's account handles early preemption because the preempted process (e.g., Billy's throw) is disrupted early, so there is no counterfactual dependence of the effect on the backup cause. For example, if Billy throws first but his rock is intercepted, then the bottle's shattering does not depend on Billy's throw (because if Billy hadn't thrown, the bottle would still have shattered due to Suzy). However, in late preemption, the backup process (Billy's throw) is not disrupted until just before the effect. In the Suzy-Billy case, if Suzy hadn't thrown, Billy's rock would have shattered the bottle. But because Suzy's rock arrives first, Billy's throw does not cause the shattering. Lewis's original account fails because the effect does not counterfactually depend on Suzy's throw: if Suzy hadn't thrown, Billy's rock would have shattered the bottle, so the shattering would still have occurred. Moreover, there is no chain of stepwise dependence: the immediate events leading to the shattering (the flight of Suzy's rock) do depend on Suzy's throw, but that dependence is not transitive under the ancestral definition because the final effect (the shattering) does not depend on it.

  (b)(ii) Woodward's approach uses structural equations to model the causal structure. For the Suzy-Billy case, we might have variables: ST (Suzy throws), BT (Billy throws), SH (Suzy's rock hits), BH (Billy's rock hits), BS (bottle shatters). The equations could be: SH = ST, BH = BT and not SH, BS = SH or BH. An intervention on ST sets ST to 0 or 1 while leaving BT unaffected. To test if ST is a cause of BS, we consider an intervention that changes ST and see if BS changes. But if we simply set ST=0, then BS=1 (because BH=1), so no dependence. The interventionist solution is to hold fixed BH at its actual value (0) while intervening on ST. This is done by setting BH to 0 (its actual value) and then intervening to set ST=0: then BS=0. Thus, with BH fixed, BS depends on ST. This is called testing along a specific path.

  (b)(iii) However, if we apply the same method to BT, we might also get that BT is a cause. If we hold SH fixed at its actual value (1) and intervene to set BT=0, then BS remains 1 (because SH=1). But if we hold no variables fixed, then when we set BT=0, BS remains 1 (because SH=1). Alternatively, if we hold SH fixed at 1, then setting BT=0 does not change BS. So why is BT a cause? The problem arises when we consider the definition of actual cause. In Woodward's framework, we might consider whether there is some set of variables held fixed at their actual values such that if we intervene to change BT, then BS changes. If we hold SH fixed at 0 (a non-actual value), then when we set BT=0, BS=0 (because without SH, and without BT, BS=0). But holding SH at 0 is holding it at a non-actual value. The standard interventionist account (without further constraints) allows this and thus would say that BT is a cause because with SH fixed at 0, changing BT changes BS. This is the problem of over-generation: Billy's throw is incorrectly counted as a cause.

  (b)(iv) To block this, Woodward (following Halpern and Pearl) must impose restrictions on which variables can be held fixed and at what values. Typically, we require that the variables held fixed must be set to their actual values. But in the above, holding SH at 0 is not its actual value (which is 1). So if we require holding fixed only at actual values, then for BT, we cannot hold SH at 0. However, even with this restriction, we might still get over-generation if we use a different set. For example, if we hold nothing fixed, then changing BT doesn't change BS. If we hold SH at 1 (actual), then changing BT doesn't change BS. So BT is not a cause. But what if we hold BH fixed? But BH is 0, and if we hold BH at 0 (actual) and set BT=0, then BS still depends on SH (which is 1) so BS=1. No change. Thus, with the restriction to actual values, BT is not a cause. However, the original over-generation problem was when non-actual values were allowed. The cost of restricting to actual values is that it might not handle other cases, such as preemption with more complex structures. Moreover, this move does not come for free: it requires a prior identification of the actual values, and the theory must include constraints on the sets of variables we can hold fixed. This highlights that the interventionist theory is not reductive: it relies on the causal structure (the structural equations) which already encode causal information. Thus, the solution to over-generation is achieved by building in more causal constraints, which moves the theory further from reductionism.

  **Marking Scheme:**

  The essay will be marked out of 100, with 80-100 being A-range (excellent), 65-79 being B-range (competent), and below 65 being C or lower.

  **Part (a) [20 marks]**
  - Up to 12 marks for explaining the difference: Lewis uses similarity of worlds; Woodward uses interventions and structural equations. Woodward retains counterfactual dependence but changes the semantics. [Common pitfall: saying Woodward doesn't use counterfactuals at all - deduct marks if present.]
  - Up to 8 marks for noting that Woodward's theory is not reductive because structural equations encode causal information. [Common pitfall: missing the non-reductive aspect.]

  **Part (b) [80 marks]**

  **(i) Lewis on early vs. late preemption [20 marks]**
  - 10 marks for correctly explaining why early preemption works: the backup is disrupted early, so no counterfactual dependence on the backup, and the effect depends on the actual cause. [Pitfall: confusing early and late preemption.]
  - 10 marks for explaining why late preemption fails: the effect does not counterfactually depend on Suzy's throw (because if Suzy hadn't thrown, Billy would have caused it), and there is no chain of stepwise dependence that Lewis's ancestral definition can trace. [Pitfall: not mentioning the lack of stepwise dependence in late preemption.]

  **(ii) Woodward on late preemption [20 marks]**
  - 10 marks for describing the structural equations for the Suzy-Billy case and the interventionist test for Suzy's throw (intervening on ST while holding BH fixed at 0). [Pitfall: not mentioning the fixing of variables at non-actual values (BH=0 is actual in the example, but note that in the model answer we fixed BH at 0 which is actual). However, in some setups, the fixing might be of a variable at a non-actual value. In this case, for ST we fixed BH at its actual value (0). For over-generation, we considered fixing SH at 0 (non-actual). So for (ii), we are fixing at actual. But the key move is the technique of fixing variables to break the backup.]
  - 10 marks for explaining that this recovers Suzy as a cause. [Pitfall: not showing the counterfactual test.]

  **(iii) Over-generation problem [20 marks]**
  - 10 marks for explaining that without restrictions, we can hold SH at 0 (non-actual) and then Billy's throw appears to cause the shattering because changing BT would change BS. [Pitfall: not using non-actual values in the example.]
  - 10 marks for stating that this leads to Billy being incorrectly counted as a cause. [Pitfall: missing this consequence.]

  **(iv) Blocking over-generation and costs [20 marks]**
  - 10 marks for explaining that the solution requires restricting the fixing of variables to their actual values (or other constraints, but actual values is a key move). Then, under this restriction, Billy is not a cause because no appropriate set of variables held at actual values makes BS depend on BT. [Pitfall: not specifying the restriction to actual values.]
  - 10 marks for discussing the cost: this move requires prior knowledge of actual values and builds in causal constraints, which reinforces that the theory is not reductive. [Pitfall: not connecting to non-reductiveness.]

  **Overall Structure and Clarity [10 marks]**
  - Logical flow, coherence, and conciseness.

  **Common Pitfalls (automatic deductions if present, but note: these are already covered in the above)**
  - Stating that interventionism does not use counterfactuals at all: deduct 5 marks.
  - Confusing early and late preemption: deduct 5 marks.
  - Failure to note that both theories use counterfactuals but differ in semantics: deduct 5 marks.

  **Grade Boundaries:**
  - A (80-100): Hits all key points in (a) and (b), including the over-generation problem and the costs of blocking it, and avoids common pitfalls.
  - B (65-79): Competently addresses most parts but may miss some nuances (e.g., the non-reductive aspect, the exact reason for over-generation, or the cost of the fix) or make one major pitfall.
  - C (50-64): Misses significant elements, such as not explaining the failure of Lewis on late preemption or the interventionist solution, or making multiple pitfalls.
  - Below 50: Serious gaps and errors.

  **Note:** The word limits for parts (a) and (b) are guidelines; going slightly over is acceptable if the content is excellent. However, the total essay must not exceed 2500 words.
answer: |-
  ### Final Exam Question

  **Question:**  
  David Lewis’s 1973 counterfactual theory of causation defines causation as the ancestral of counterfactual dependence. James Woodward’s interventionist theory, in contrast, grounds causation in patterns of counterfactual dependence under interventions. Both frameworks employ counterfactuals, but they diverge in their semantics and metaphysical commitments.  

  (a) Precisely articulate what Woodward’s interventionism retains from Lewis’s counterfactual framework and what it changes. In doing so, explain whether Woodward’s theory is reductive and why. (500 words)  

  (b) Using the case of *late preemption*—where Suzy throws a rock at a bottle, shattering it, and Billy throws a rock that would have shattered the bottle had Suzy not—demonstrate how Lewis’s original (1973) account and Woodward’s interventionism differ in handling causation. Your response must:  
  - (i) Explain why Lewis’s account succeeds with early preemption but fails with late preemption.  
  - (ii) Detail how Woodward’s structural-equations framework uses interventions, including holding variables fixed at *non-actual values*, to secure the correct verdict for Suzy’s throw as a cause in late preemption.  
  - (iii) Show why this interventionist approach, without supplementation, incorrectly identifies Billy’s throw as a cause.  
  - (iv) Discuss what interventionism must add to block this over-generation and evaluate the implications of this move for the theory’s structure, particularly its non-reductive status.  
  (2,000 words)  

  ---

  ### Model Answer (650 words)  

  **(a)** Woodward’s interventionism retains Lewis’s core idea that causation involves counterfactual dependence: if the cause had not occurred, the effect would not have occurred (in specific circumstances). However, Woodward replaces Lewis’s semantics for counterfactuals, based on overall similarity between possible worlds, with one grounded in *interventions* on structural equations. For Lewis, counterfactuals are evaluated by comparing worlds for minimal departures from actuality (e.g., avoiding “big miracles”). Woodward, instead, evaluates counterfactuals via ideal interventions that manipulate a variable while holding fixed the causal relationships encoded in a structural-equation model. This shift makes Woodward’s counterfactuals context-sensitive and modular, as interventions isolate causal relationships within a system. Crucially, Woodward’s theory is *not reductive*. While Lewis reduces causation to non-causal counterfactuals (based on similarity), Woodward’s structural equations presuppose causal information (e.g., asymmetric dependencies), making the account circular at the base level.  

  **(b)**  
  **(i)** Lewis’s 1973 account handles early preemption because the preempted cause (e.g., Billy’s throw) is disrupted early, creating stepwise counterfactual dependence. If Billy’s rock is intercepted before reaching the bottle, the shattering depends on Suzy’s throw: had Suzy not thrown, the bottle would not have shattered. However, in late preemption, Suzy’s rock hits first, so Billy’s rock never strikes. Here, Lewis’s account fails. The shattering does not counterfactually depend on Suzy’s throw: if Suzy hadn’t thrown, Billy’s rock would have hit and shattered the bottle. Lewis’s ancestral condition—where causation chains through intermediate dependencies—also fails. The immediate events (e.g., Suzy’s rock flying) depend on her throw, but the final shattering does not, as Billy’s backup ensures the effect occurs regardless. The ancestral cannot bridge this gap, so Suzy’s throw is misclassified as non-causal.  

  **(ii)** Woodward’s interventionism uses structural equations to model late preemption. Variables include:  
  - \(ST\) (Suzy throws: 1 if yes, 0 otherwise)  
  - \(BT\) (Billy throws: 1 if yes, 0 otherwise)  
  - \(SH\) (Suzy’s rock hits: 1 if yes, 0 otherwise; \(SH = ST\))  
  - \(BH\) (Billy’s rock hits: 1 if yes, 0 otherwise; \(BH = BT \land \neg SH\))  
  - \(BS\) (Bottle shatters: 1 if yes, 0 otherwise; \(BS = SH \lor BH\))  

  To test if \(ST = 1\) causes \(BS = 1\), we intervene to set \(ST = 0\) while holding other variables fixed. If we naïvely intervene (setting \(ST = 0\)), \(SH\) becomes 0, but \(BH\) becomes 1 (since \(BT = 1\) and no \(SH\)), so \(BS = 1\)—no dependence. Woodward’s solution is to hold \(BH\) fixed at its actual value (0) while intervening on \(ST\). Setting \(BH = 0\) and \(ST = 0\) yields \(SH = 0\) and \(BH = 0\) (since \(BH\) is fixed), so \(BS = 0\). Thus, with \(BH\) fixed, \(BS\) depends on \(ST\), confirming Suzy as a cause. This tests causation along a specific path by freezing the backup variable.  

  **(iii)** Without constraints, this method over-generates causes by misclassifying Billy’s throw. To test \(BT = 1\) for causation, we consider interventions on \(BT\). If we hold \(SH\) fixed at a *non-actual value* (e.g., \(SH = 0\)), setting \(BT = 0\) results in \(BS = 0\) (since \(SH = 0\) and \(BH = 0\)). This suggests \(BT\) is a cause. But in actuality, \(SH = 1\), so Billy’s throw is preempted and should not count. The problem arises because interventionism, minimally defined, allows variables to be fixed at non-actual values during testing, making the backup appear causally efficacious.  

  **(iv)** To block over-generation, Woodward (following Halpern and Pearl) must restrict which variables are fixed and to what values. Typically, variables must be fixed to their *actual values* (here, \(SH = 1\)). With this restriction, testing \(BT = 1\): set \(BT = 0\) while holding \(SH = 1\). Then \(BH = 0\) (since \(SH = 1\) implies \(\neg BH\)), and \(BS = 1\) (from \(SH = 1\)). No change occurs, so Billy is correctly excluded. However, this fix incurs two costs. First, it requires prior knowledge of actual values, which presupposes a causally laden description of the scenario. Second, it exacerbates non-reductivism: structural equations already encode causal primitives (e.g., \(SH\) directly affects \(BH\)), and adding actual-value constraints embeds further causal facts. This moves interventionism further from reduction, as causal judgments rely on built-in causal structure rather than reduction to non-causal foundations.  

  ---

  ### Marking Scheme (Total: 100 points)  
  **A-Range (80–100 points):** Excellent, nuanced, and precise. Correctly identifies all core issues and avoids common pitfalls.  
  **B-Range (65–79 points):** Competent but may miss nuances, oversimplify differences, or commit specific errors flagged below.  

  #### Part (a) (20 points)  
  - **Retention (8 points):** Correctly notes Woodward retains counterfactual dependence as central to causation.  
  - **Change (8 points):** Accurately contrasts Lewis’s similarity semantics with Woodward’s interventionist semantics (structural equations vs. possible worlds).  
  - **Reductivism (4 points):** States Woodward’s theory is non-reductive because structural equations presuppose causal structure.  
  - *Common pitfall (–5 if present):* Claims Woodward "rejects counterfactuals" or that the theories differ over whether counterfactuals are used at all (they both use them, but semantics differ).  

  #### Part (b) (80 points)  
  **(i) Lewis on preemption (20 points)**  
  - **Early preemption success (10 points):** Explains that early disruption severs counterfactual dependence on the backup (e.g., Billy’s rock is intercepted).  
  - **Late preemption failure (10 points):** Shows the effect lacks counterfactual dependence on Suzy (due to Billy’s backup) and no stepwise chain bridges the gap.  
  - *Common pitfall (–5 if present):* Confuses early/late preemption or claims Lewis fails for both.  

  **(ii) Woodward on late preemption (20 points)**  
  - **Interventions and fixing (10 points):** Describes structural equations and how fixing \(BH = 0\) (actual value) during intervention on \(ST\) yields dependence.  
  - **Non-actual values (10 points):** Notes that the solution relies on fixing variables (here, at actual values) to isolate paths.  
  - *Common pitfall (–5 if present):* Omits the role of fixing variables or misrepresents it as "removing" Billy.  

  **(iii) Over-generation (20 points)**  
  - **Billy as false cause (10 points):** Demonstrates that fixing \(SH = 0\) (non-actual) during intervention on \(BT\) makes \(BS\) depend on \(BT\).  
  - **Why this is wrong (10 points):** Notes Billy is preempted, so this result is incorrect.  
  - *Common pitfall (–5 if present):* Fails to use non-actual values in the test for Billy.  

  **(iv) Blocking over-generation and costs (20 points)**  
  - **Actual-value restriction (10 points):** Explains that fixing must use actual values (e.g., \(SH = 1\)) to exclude Billy.  
  - **Costs and non-reductivism (10 points):** Argues this reinforces non-reductivism by requiring causal presuppositions (actual values, structural equations).  
  - *Common pitfall (–5 if present):* Claims the fix is "free" or ignores its implications for reduction.  

  #### Clarity and Structure (10 points)  
  - Logical flow, concision, and integration of parts.  

  #### Grade Boundaries  
  - **A (80–100):** Hits all key points in (a) and (b), including over-generation costs and non-reductivism.  
  - **B (65–79):** Misses ≤2 nuances (e.g., skips cost analysis, muddles semantics, or commits one pitfall).  
  - **C (50–64):** Omits major elements (e.g., why Lewis fails late preemption) or commits multiple pitfalls.  
  - **D/F (<50):** Fundamental errors (e.g., misdefines both theories or cannot apply them to preemption).  

  ---  
  This question forces students to dissect the shared counterfactual core and divergent semantics of these theories, while the marking scheme explicitly penalizes superficial "manipulability vs. dependence" sloganeering. I recommend pairing this with Lewis (1973), Woodward (2003), Hitchcock (2001), and Halpern & Pearl (2005) on your reading list.
