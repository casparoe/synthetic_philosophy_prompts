  First, I recall philosophical concepts related to reasons. Agent-neutral vs. agent-relative reasons comes to mind. The user already knows about this distinction but points out that the issue isn't just about the content of the reasons. The problem is the unattached reason suddenly becoming attached. That makes me think about the metaphysics of reasons—are reasons entities that exist independently, or do they only make sense when tied to agents?

  The user mentioned the slide isn't argued for, which suggests a gap in reasoning. Philosophers like Bernard Williams and Christine Korsgaard discuss reasons requiring a connection to an agent's motivations or commitments. Williams' internal reasons might be relevant here. If a reason is external, how does it become internal for a specific agent? The user's examples show this jump happening implicitly.

  Then there's epistemology. When someone says "there's a reason to believe X," it's often about evidence. But evidence needs interpretation by an agent with specific context. The slide to "the jury ought to convict" assumes the jury has access to and interprets the evidence correctly. That's an epistemic gap. The user noted this in discussions about what evidence supports.

  The user also mentioned "the market" or "science" as sources. This might involve reification—treating abstract concepts as concrete entities that dictate reasons. But the core issue is the normative leap from an impersonal statement to an obligation for a specific agent.

  I need to check if there's an established term for this. "Normative transmission failure" comes to mind, but I'm not sure if it's a standard term. Maybe it's a form of equivocation between different types of reasons. The user wants a label, but if none exists, how to characterize it? The key elements are the unattached reason, the unargued shift, and the context-specific application.

  The user's deeper need might be understanding why this pattern is invalid and how to counter it. They might be engaging in debates where this slide occurs and want tools to point out the flaw. They also want clarity on whether philosophers have addressed this specifically.

  Confidence levels: High that the issue involves conflating normative and epistemic contexts. Medium on "normative transmission failure" as a label—since it's not widely recognized. Least confident about whether there's a specific term; it might be an under-discussed fallacy. The user's analysis is sharp, pointing out nuances beyond common fallacies. They need a precise characterization to articulate the problem in their arguments.
answer: |-
  This is an exceptionally sharp observation that cuts to the heart of significant debates in metaethics, epistemology, and practical reasoning. Philosophers *have* grappled with the issues underlying this pattern, though a single, universally agreed-upon name for the *specific slide* you describe isn't firmly established. However, we can precisely characterize the move, distinguish it from nearby concepts, diagnose the problem, and propose fitting labels based on standard analyses. Here's a breakdown:

  **1. Characterizing the Move:**
  *   **Step 1 (The "Floating" Reason):** The arguer asserts the existence of a normative or epistemic reason ("There is a reason to φ" or "There is a reason to believe P") *without specifying a subject for whom it is a reason*. The reason is presented as an objective, agent-neutral fact about the world – a consideration that "counts in favor" of φ-ing or believing P, period.
  *   **Step 2 (The Unargued Attachment):** The arguer then treats the existence of this "floating" reason as *sufficient* to ground a normative or epistemic claim *directed at or binding upon a specific agent or group* ("Therefore, Agent S ought to φ" or "Therefore, Agent S (e.g., the jury) ought to believe P/hold S responsible for φ-ing"). The crucial gap is the lack of argument showing *how* or *why* this objective reason *becomes a reason for S* in their specific context.

  **2. What's Going Wrong (The Diagnosis):**

  *   **The Core Problem:** The slide ignores the potential **mediation required** between an objective, agent-neutral reason and its application to a specific agent's practical or epistemic situation. Several factors can create this gap:
      *   **Epistemic Position:** Does S have access to the considerations constituting the reason? Is S capable of understanding them? (E.g., The "reason" the butler did it might be based on evidence inadmissible or unknown to the jury).
      *   **Practical Position/Scope of Agency:** Can S actually φ? Is φ-ing within S's legitimate sphere of control or responsibility? Does acting on this reason conflict with other, more stringent reasons S has? (E.g., The global "reason" to reduce emissions does not automatically imply Norway *can* or *should* bear the *specific cost* of cutting *its* primary industry without considering distributive justice, capacity, alternative actions, or its own citizens' welfare).
      *   **Normative "Uptake":** Does the objective reason connect to S's *actual* motivational set, commitments, or role-based obligations in a way that makes it *their* reason? (Bernard Williams' internal reasons critique is highly relevant here).
      *   **The Nature of "Ought" Implied:** Step 1 might imply a *pro tanto* "ought" (an "ought" all things considered *so far*), while Step 2 often implies an *all-things-considered* "ought" or a *binding obligation* for S, without demonstrating that the "floating" reason outweighs or integrates with S's other relevant reasons and context.
  *   **It's a Failure of Normative Transmission:** The arguer assumes that the mere existence of an objective normative/epistemic fact *automatically transmits* a normative/epistemic demand to any and all agents, overlooking the contextual filters (epistemic access, capacity, responsibility, competing claims) that determine *whose* reason it actually is and *what* it requires *of them*.

  **3. Distinguishing It from Nearby Concepts:**

  *   **Agent-Neutral vs. Agent-Relative Reasons:** You rightly note this isn't quite it. The issue isn't primarily about the *content* of the reason (e.g., "pain is bad" vs. "I promised"). The Step 1 reason *could* be agent-neutral ("Pain is bad, so there's a reason to reduce it"). The problem is the leap from asserting its existence *simpliciter* to asserting it binds *a specific S* without establishing the necessary connection *to S*.
  *   **Naturalistic Fallacy / Is-Ought Gap:** Correct, as both claims are normative/epistemic. The slide happens *within* the normative realm.
  *   **"View from Nowhere" (Nagel):** This is closely related but broader. The "view from nowhere" is the *aspiration* to objective, impartial judgment. Your pattern is a specific *fallacy* or *unwarranted inference* that can *result* from uncritically adopting that view and ignoring the perspectival limitations when applying it to situated agents. It's the *operational misuse* of the impersonal perspective.
  *   **Reification:** There is an element of reification – treating "reason" or "evidence" as a freestanding entity ("out there") rather than a relational property (a reason *for* someone *in* a situation). But reification alone doesn't capture the *slide* to specific agency.
  *   **Equivocation on "Reason":** This gets closer. The arguer subtly shifts the meaning of "reason":
      *   **Sense 1 (Step 1):** "Reason" = An objective, normative/epistemic fact or consideration (e.g., "Emissions cause harm").
      *   **Sense 2 (Step 2):** "Reason" = A motivating or justificatory consideration *for a specific agent S* that generates an obligation or decisive grounds for belief/action *for S*.
      The slide assumes Sense 1 entails Sense 2 without argument.

  **4. Proposed Labels & Philosophical Mapping:**

  *   **Best Fit / Most Precise Characterizations:**
      *   **"Normative Transmission Failure" or "Failure of Normative Application":** (High Confidence in accuracy of description, Medium Confidence in established usage) This directly names the core problem: the failure to demonstrate *how* the general normative fact transmits to the specific agent's obligation. It highlights the missing argumentative step. Philosophers working on reasons, practical reasoning, and applied ethics constantly grapple with *how* general principles apply to specific agents (e.g., debates about demandingness, partiality, role obligations, epistemic justification), making this a fundamental category of error within those discussions.
      *   **"The Impersonal-to-Personal Reason Slide":** (High Confidence in descriptive accuracy, Low Confidence as established term) This explicitly names the two poles of the equivocation/move you identified.
      *   **"Unwarranted Agent-Specific Prescription from Agent-Neutral Grounds":** (High Confidence in accuracy, Low Confidence as snappy label) A more verbose but precise description.

  *   **Related Established Concepts:**
      *   **Bernard Williams' "Internal Reasons" Critique:** (Very High Confidence in relevance) Williams argued that for something to be a genuine reason *for* an agent S, it must be capable of motivating S (via a "sound deliberative route" from S's "subjective motivational set"). The slide you describe often ignores this requirement. The "floating" reason is external; the move to "S has a reason" assumes it magically becomes internal without the necessary deliberative link.
      *   **The "Moral/Epistemic Demandingness" Problem:** (High Confidence in relevance) Especially in ethics (like climate ethics), jumping from "there's a reason to X" to "S must bear cost Y to do X" ignores questions about the *fairness* or *reasonable expectability* of imposing that specific burden on S. The slide bypasses the demandingness filter.
      *   **Epistemic Externalism vs. Internalism (Justification):** (High Confidence in relevance for epistemic cases) The slide from "There's a reason (evidence) to believe P" to "S (the jury) ought to believe P" can ignore whether S *possesses* or can *access/recognize* that evidence (an internalist concern). It assumes external facts alone dictate S's justificatory obligations.

  *   **Why No Single Perfect Name?** (High Confidence)
      The slide manifests slightly differently across domains (practical ethics vs. epistemology vs. institutional roles). Philosophers often analyze the *underlying failures* (Williams' internality, demandingness, epistemic access, scope of agency) rather than naming the *rhetorical slide itself* as a distinct fallacy. It's often seen as a symptom of a deeper misunderstanding about the nature of reasons or justification.

  **5. Confidence Levels & Least Sure Point:**

  *   **High Confidence:** In the *accuracy of your characterization* of the pattern and its problematic nature. In the diagnosis involving a **failure of normative transmission/application** requiring mediation (epistemic access, capacity, responsibility, motivational link). In its distinction from is/ought and naturalistic fallacy. In its close relation to Williams' internal reasons critique and demandingness problems.
  *   **Medium Confidence:** That **"Normative Transmission Failure"** is the most apt *descriptive label* for the core logical gap, even if it's not a universally canonized fallacy name. In the characterization as an **equivocation between senses of "reason"**.
  *   **Lowest Confidence / Least Sure Point:** (Flagged as requested) **Whether there is a single, universally recognized, catchy *name* for this *specific slide* as a discrete fallacy within philosophical logic or rhetoric.** While the *components* (equivocation, ignoring context, demandingness, Williams' critique) are well-established, the *particular rhetorical move* you've isolated – the effortless, unargued shift from "There exists reason R" to "Therefore, specific agent S has reason R (and must act/believe accordingly)" – might not have a dedicated, universally agreed-upon label like "ad hominem" or "straw man." It's often subsumed under broader critiques of objectivism, impersonalism, or failures in applied reasoning. Calling it "The Unattached Reason Attachment Fallacy" or "The Floating Reason Gambit" might be novel, though descriptive.

  **Conclusion:**

  Your observation hits upon a profound and pervasive issue: the **uncritical assumption that objectively valid normative or epistemic considerations automatically generate identical, decisive, and binding reasons for specific, situated agents without any mediation.** The most precise characterization is a **Failure of Normative Transmission or Application**, often involving an **equivocation between an objective reason-fact and an agent-specific reason-ground**. It's deeply connected to critiques from Bernard Williams (internal reasons), debates about moral demandingness, and epistemic internalism/externalism. While a perfect, universally recognized name might be elusive, your analysis pinpoints a crucial argumentative gap that deserves careful scrutiny whenever this pattern arises, particularly in complex domains like climate policy, legal judgment, or interpreting scientific evidence for public action. The burden lies squarely on the arguer to bridge the gap between the "floating" reason and the specific agent's obligation.
