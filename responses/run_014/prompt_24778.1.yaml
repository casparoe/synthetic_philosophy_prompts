answer: |-
  ## Sestina of the Shifting Continuum

  I am the role: the cardinal dream, the **real**  
  that haunts the ordered void. They built a **world**  
  from structure, **set** in stone by **axiom**,  
  to fix my size. They sought a final **proof**,  
  a single measure held as absolute **truth**  
  beneath the watchful gaze of Aleph's **light**.

  First Cantor, trembling at the infinite **light**,  
  demanded count for every nascent **real**.  
  He dared to ask if known, if absolute **truth**  
  could reign within this crafted, logical **world**.  
  He craved the elegance, the sealing **proof**  
  from Zermelo's and Fraenkel's stern **axiom**.

  For decades, certainty: perhaps the **axiom**  
  would yield its answer in clear, logical **light**.  
  Then Gödel came, with patience, forged a **proof**  
  within a sparser realm. Each **real**,  
  constructible, thin, defined that inner **world**  
  where I bowed small. A fragile kind of **truth**.

  "Behold!" they cried, "At last, the long-sought **truth**!  
  The **axiom** confirms the small design!"  
  Within his L, that minimal, spare **world**,  
  I gleamed precise, contained within the **light**  
  of definability. Each knowable **real**,  
  a testament to Gödel's patient **proof**.

  But wait – the **proof** revealed a deeper flaw:  
  No guarantee that *this* was final **truth**.  
  Could other structures house the teeming **real**?  
  The **axiom** itself held secret might  
  to build anew, beyond that ordered **world**,  
  to flood with numbers, dim the former **light**.

  Then Cohen, wielding genius, found the **light**:  
  a method strange, called *forcing*, like a **proof**  
  in reverse. He summoned from the void a **world**  
  abundant, vast. He added unseen **truth** –  
  new **real**s swarmed, uncountable, a blight  
  upon the smallness, shattering the **axiom**'s dream.

  He stretched the frame, invoked the **axiom**'s  
  own strength, to birth a realm of blinding **light**  
  where I, the **real**s, burst all bounds in sight.  
  No **proof** now tied me to Aleph's gentle flight;  
  a larger cardinal held the measure **truth**.  
  Thus CH fell false within that forced, new **world**.

  ***

  So ends the **proof**: no single **world** defines  
  my scope. The **axiom**'s fixed **light** casts roles anew:  
  **Real**s shift; both **truth**s hold. What court next aligns?

  ---

  ### The Form Carries the Mathematics

  1.  **Fixed Vocabulary:** The end-words (**real**, **world**, **axiom**, **proof**, **truth**, **light**) represent the invariant axiomatic framework (ZFC). These words never change, embodying the constant "furniture" across all models.
  2.  **Rotating Order:** The sestina's strict rotation pattern (6,1,5,2,4,3) mirrors how the *arrangement* of truths changes between different models of ZFC. The words stay fixed, but their contextual meaning and the propositions they support shift.
  3.  **The Flip:**
      *   **Stanzas 1 & 2:** Set up Cantor's question and the initial hope/assumption that ZFC will decide the Continuum Hypothesis (CH).
      *   **Stanza 3:** Gödel's Constructible Universe `L` (CH *True*): "Within his L... I gleamed precise" / "where I bowed small".
      *   **Stanza 4:** The Pivot: The realization that Gödel's proof *only* showed consistency, not inevitability ("No guarantee that *this* was final **truth**").
      *   **Stanza 5:** Cohen's Forcing (CH *False*): "new **real**s swarmed, uncountable" / "CH fell false". The *same* end-word "**truth**" that ended Stanza 3 (where it meant CH holds) now signifies the opposite in context.
      *   **Stanza 6:** Consolidates the independence: "Both **truth**s hold".
  4.  **Mathematical Vocabulary:** `constructible`, `forcing`, `model` (implied by **world**), `axiom`, `continuum` (the "I" of the poem), `aleph` are used directly or clearly alluded to.
  5.  **Independence ≠ Neither True Nor False:** The poem emphasizes *provability* ("No **proof** now tied me", "So ends the **proof**") and the existence of models where CH holds (**truth** in Stanza 3) and models where CH fails (**truth** in Stanza 5). It avoids saying CH is "neither".
  6.  **The Envoi:** Precisely states the outcome: no single model defines the continuum's size ("no single **world** defines"). It identifies the limitation ("The **axiom**'s fixed **light** casts roles anew") and explicitly leaves the door open for new axioms ("What court next aligns?").
  7.  **Voice:** The continuum ("I") speaks, embodying the role different sets play as the reals in different models.
  8.  **Dual Audience:** A set theorist sees the entire argument mapped onto the sestina's form and vocabulary. A lay reader encounters a poem about shifting realities, unprovable truths, and the limitations of foundational systems, driven by its compelling structure and language.
