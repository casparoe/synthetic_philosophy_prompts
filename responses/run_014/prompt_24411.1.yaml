prompt: |-
  I'm a novelist, and one of the central characters in the book I'm writing is a philosopher of mathematics who defends a robust version of mathematical Platonism: the view that there are abstract, non-spatio-temporal, causally inert mathematical objects (numbers, sets, functions), and that we know their properties a priori. The character is not a careful dialectician; a key part of her characterization is that she waves away the epistemological difficulties of her view by gesturing at "a priori intuition" without really explaining it, and I want the scene to show that weakness honestly rather than papering over it.

  I'm writing the set-piece in which she defends this view in a roughly twenty-minute question period after a talk at a small philosophy-of-mathematics workshop, and I need the objections to be the specific, sharp ones this particular room would produce rather than a generic list. The room is not a friendly one. It contains: a couple of naturalists who think any adequate epistemology must be naturalized, who hold that the only reason to be a realist about mathematical objects is their indispensability to our best empirical theories, and who treat "a priori intuition of abstracta" as an unexplained primitive doing all the work; a structuralist who believes the whole object-language is a mistake, that one can be a realist about mathematical structure without committing to abstract objects as such, and who thinks his view simply escapes Benacerraf's dilemma; and a deflationary fictionalist who regards the entire realist program as a dead end and is waiting for an opening to say so.

  Please give me a prep sheet for this scene, as if it were notes the character (or a sympathetic colleague) would keep in her pocket. I want the six or seven objections this specific room is most likely to raise, in roughly the order they will come, each phrased the way that particular person would phrase it — the naturalist's vocabulary is not the structuralist's, and I need to feel the difference. For each objection, give a short reply the character could actually deliver in the moment, keeping in mind that she is a Platonist who leans on a priori intuition but is not a dialectical monster; mark where that reply is soft, i.e., the point the objector will immediately pounce on next; and say what she should concede up front and what she should hold. Close with the one question she is hoping nobody asks — the question that would genuinely get under her position in a way the others do not.

  Please do not give me a bibliography, a reading list, or citations, and do not pad with generic objections. I want the in-the-weeds version of each objection that this particular character, in this particular room, would actually face.
reasoning: |-
  Okay, the user is a novelist creating a character who's a Platonist philosopher of mathematics. They need a realistic Q&A session where this character faces sharp, specific objections from naturalists, structuralists, and fictionalists. The key is to capture each objector's distinct voice and the Platonist's flawed yet honest responses.

  First, let's unpack the room dynamics. The naturalists will attack the epistemology from a scientific standpoint, dismissing "a priori intuition" as unscientific. The structuralist will challenge the need for objects at all, advocating for structure-only realism. The fictionalist will undermine truth claims by comparing math to fiction. Each must sound distinct: naturalists using "explanatory primitive" and "causal contact," structuralists talking about "in re structures" and "object-free realism," fictionalists saying "make-believe" and "truth-apt."

  For the Platonist's replies, they must reflect her intellectual weakness - leaning on intuition without rigorous defense. Her responses should feel evasive when pressed on mechanisms, especially regarding how intuition accesses the abstract realm. The soft spots need to be obvious targets for follow-ups, like when she calls intuition "reliable" without explaining why.

  The concession/hold balance is crucial. She should concede naturalists' point about empirical science doing things differently, but hold that math is special. With the structuralist, she might concede structural similarities but insist on objects. With the fictionalist, she must absolutely hold that 2+2=4 isn't invented.

  Finally, the "dreaded question" must cut deep - probably challenging the reliability of intuition across cultures or history, exposing her circular defense. This aligns with Benacerraf's dilemma she's waving away. The response shows her discomfort without resolution, fitting her characterization.

  The prep sheet format works perfectly - it's diegetic, something the character might actually carry. Keeping it to 6-7 objections maintains focus. Avoiding citations and generic points honors the request for specificity. Each objection-reply pair advances both the philosophical debate and character development.
answer: |-
  Here’s the prep sheet, designed as if scribbled hastily by the character (or a sympathetic colleague) for quick reference mid-Q&A. The objections are ordered for escalating tension, with replies reflecting her genuine (but dialectically weak) stance:

  ---

  **PLATONIST Q&A DEFENSE PREP**  
  *Target Room: Naturalists (Nat1/Nat2), Structuralist (Struct), Fictionalist (Fict)*  

  **OBJECTION 1 (Nat1 - Naturalist):**  
  *"You’re invoking ‘a priori intuition’ as a brute posit to solve the access problem. But in a naturalized epistemology, unexplained primitives don’t *explain* anything—they’re placeholders for failure. How is this any better than saying ‘magic’?"*  
  **Your Reply:**  
  *"It’s not primitive in a *vacuous* sense—it’s grounded in the *phenomenology* of mathematical discovery! When we grasp that 2+2=4, we’re directly aware of a truth beyond sensation. Science explains the physical; intuition explains the abstract."*  
  **Soft Spot:** *"Grounded in phenomenology" sounds like psychologism. Nat will pounce: "So it’s a *psychological* state? How does that connect to abstracta?"*  
  **Concede/Hold:** *Concede intuition needs fleshing out; hold that its deliverances are *reliable* and *indispensable*. Don’t call it "non-natural."*  

  **OBJECTION 2 (Struct - Structuralist):**  
  *"Why reify ‘objects’ at all? Your Platonism is haunted by Benacerraf because you insist numbers are *things*. But if mathematics is about *structures*—patterns instantiable in systems (abstract or concrete)—then we access structures through their concrete *roles*, not by ghostly intuition of ghostly objects."*  
  **Your Reply:**  
  *"Structure without objects is incoherent! The natural numbers *are* a unique object—their structure *depends* on the existence of ℕ as an abstract particular. Intuition reveals the object *and* its structure as one."*  
  **Soft Spot:** *"Depends on existence of ℕ." Struct will retort: "Prove that dependence. Can’t I define ‘natural number structure’ without quantifying over ℕ *as an object*?"*  
  **Concede/Hold:** *Concede structuralism captures *relational* truths; hold that structures require foundational objects (e.g., the empty set).*  

  **OBJECTION 3 (Nat2 - Naturalist):**  
  *"Your ‘intuition’ can’t justify realism. The *only* reason to believe in abstracta is Quine-Putnam indispensability: math works in science. But that gives us pragmatic warrant, not a priori access. Why add this mystical faculty?"*  
  **Your Reply:**  
  *"Indispensability can’t explain *pure* math! We knew primes were infinite before linking them to physics. Intuition provides *foundational* justification; indispensability is just a nice bonus."*  
  **Soft Spot:** *"We knew before physics." Nat2: "Did we? Or did we *infer* it from axioms? Show me intuition *without* derivation."*  
  **Concede/Hold:** *Concede indispensability strengthens realism; hold that pure math is *epistemically prior*.*  

  **OBJECTION 4 (Fict - Fictionalist):**  
  *"Why bother with ‘access’? Mathematicians are just exploring consistent fictions. ‘There are infinitely many primes’ is true *in the story of arithmetic*, same as ‘Sherlock lived in London’ is true in Doyle’s fiction. No abstract objects needed—just imagination and logic."*  
  **Your Reply (heated):**  
  *"Absolute nonsense! 2+2=4 isn’t ‘true-in-a-fiction’—it’s *unconditionally true*. Fiction is invented; math is *discovered*. Intuition isn’t imagination—it’s recognition of necessity!"*  
  **Soft Spot:** *"Discovered." Fict: "Discovered *where*? Point to the platonic realm! Discovery implies a pre-existing thing—but your ‘discovery’ has no causal history. How is it different from *inventing* consistent rules?"*  
  **Concede/Hold:** *DO NOT concede "invention." Hold that mathematical truth is *absolute* and *mind-independent*. Attack *their* truth-predicate.*  

  **OBJECTION 5 (Nat1/Struct - Tag-Team):**  
  *Nat1: "If intuition is reliable, why do mathematicians need proof? Why centuries of error (e.g., Cauchy’s ‘proofs’ pre-rigor)?"  
  Struct: "And if objects exist, why multiple set-theoretic universes (V=L vs. large cardinals)? Intuition clearly underdetermines!"*  
  **Your Reply:**  
  *"Intuition isn’t infallible—it’s a *guide* refined by proof! Errors arise from misapplication, not intuition itself. As for set theory: we intuit core truths (extensionality, infinity), but higher axioms need deeper insight. Pluralism doesn’t refute realism!"*  
  **Soft Spot:** *"Refined by proof." Nat1: "So proof corrects intuition? Then proof is primary!" Struct: "And if intuition underdetermines, maybe you’re intuiting *structure*, not objects!"*  
  **Concede/Hold:** *Concede intuition isn’t sole source; hold it’s the *basis* of axioms. Defend "intuitive obviousness" of PA/SR.*  

  **OBJECTION 6 (Fict - Nuclear Option):**  
  *"Even if we *feel* like we’re ‘discovering’, that’s just psychology. Platonism *multiplies mysteries*: How does evolution shape a faculty to grasp non-spatiotemporal objects? How does ‘intuition’ bridge the abstract/concrete gap? You’ve swapped one puzzle (truth) for two (access + metaphysics)!"*  
  **Your Reply (flustered):**  
  *"The ‘gap’ is a *category error*! Abstracta aren’t ‘elsewhere’—they’re ontologically distinct. Our minds evolved for logic, not just survival! Intuition *just is* how we engage with abstract reality—demanding a ‘mechanism’ is like asking how vision accesses light!"*  
  **Soft Spot:** *"How we engage." Fict/Nat will chorus: "Vision is *causal*! What’s the *analog* for abstracta? ‘Engagement’ is empty!"*  
  **Concede/Hold:** *Concede the "how" is hard; hold that *denying* the reality math describes is harder. Retreat to indispensability if pressed.*  

  ---  
  **THE DREADED QUESTION (If asked, pivot or concede ground):**  
  *"If a priori intuition is a reliable faculty for abstracta, why do competent mathematicians *intuit* mutually exclusive truths (e.g., CH true/CH false)? Doesn’t this prove intuition tracks *cognitive bias*, not platonic truth?"*  
  **Why it Hurts:**  
  It weaponizes mathematical practice against her. Admitting intuition is fallible/biased undermines its authority; claiming one intuition is "correct" sounds dogmatic.  
  **Weak Reply to Avoid:** *"One side just hasn’t intuited deeply enough!"*  
  **Better Reply:** *"Deep disagreements show the *limits* of current intuition, not its falsity! CH may be absolutely true/false—but our intuitions are incomplete. We work to *sharpen* them."* (Still soft—*"How?"*)  

  ---  
  **HOLD THE LINE ON:**  
  - Mathematical truth is *absolute* (vs. Fict).  
  - Objects are *essential*, not just structure (vs. Struct).  
  - Intuition is *evidential*, not just pragmatic (vs. Nat).  
  **CONCEDE GRACEFULLY:**  
  - Intuition needs refinement (proof, debate).  
  - Naturalism works for empirical science.  
  - Structuralism captures important relational truths.  

  **REMEMBER:** You’re not here to "win" dialectically—you’re here to *witness* to the reality of the abstract. Don’t let them reduce it to psychology or pragmatics. If cornered, say: "The reality of mathematical truth is the fixed point—we build epistemology to fit it, not vice versa." (They’ll hiss, but it’s honest.)  

  ---  
  *This prep sheet gives your character defensible but flawed replies that feel authentic to a brilliant-but-stubborn Platonist. The objections are tailored to the room’s factions, escalating from epistemological challenges to metaphysical traps, culminating in the "dreaded question" that exposes her reliance on intuition as question-begging.*
