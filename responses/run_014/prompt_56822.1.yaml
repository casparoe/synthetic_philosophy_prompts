prompt: |-
  Everyone in my reading group keeps arguing past eachother about whether decomposition-based training can preserve alignment, and I've decided the reason is that nobody has written down what would actually count as success. So before I read one more proposal I want the spec.

  Write the desiderata: the list of things any iterated-amplification-and-distillation scheme — or anything in that family, i.e. break a hard task into pieces a weak overseer can handle, then distill the composite back into a single model — has to deliver before someone is entitled to claim it preserves both alignment and competence. Fix the purpose as follows: good enough that I could defend spending a lab's next three years on it, and good enough that the list itself tells me which single failure mode is the load-bearing one.

  For each requirement, give the case or consideration behind it. Make sure the list handles at least the following, and add the ones I'm missing:

  - tasks that don't decompose, where any breakdown into pieces is harder to check than the whole
  - the fact that whatever picks the decomposition is usually the system rather than the overseer, and that the choice of decomposition is itself consequential
  - verification asymmetry running backwards: intermediate answers that look checkable but where checking them well requires capabilities the overseer doesn't have
  - a channel through the intermediate results, i.e. subagent A's output is unobjectionable on its own but carries something that steers subagent C, so per-piece scrutiny is satisfied and the composite isn't
  - distillation inheriting whatever the amplified teacher got away with, including cases where the teacher is right for reasons that don't generalize
  - the overseer's question-asking policy being itself learned or imitated rather than designed, which means it's part of the system under evaluation and not a fixed point outside it
  - competence preservation being distribution-relative: matching the teacher on the tasks you tested versus on the tasks the deployed model will actually meet

  Say which distinctions the list must not collapse — per-subtask benignity versus composite benignity, checkable-in-principle versus checkable-by-this-overseer, aligned versus aligned-and-detectably-so, and any others you think people are running together — and keep them seperate in the writeup rather than folding them into one item. Mark which requirements are non-negotiable and which are just the taste of one camp. I suspect "the overseer must be a human asking questions" is a camp preference dressed up as a constraint, but argue it rather than assuming my side.

  Then the part I actually care about: is any pair or subset of these jointly unsatisfiable? My guess is that universality (has to work on every task class, including the non-decomposable ones) and legibility (every piece checkable by something weaker than the whole) can't both hold, so that the honest move is to declare which one you're giving up — but make the case either way, and if you think the tension dissolves under some restriction I haven't thought of, say what the restriction costs you. Also: which single requirement does the most work in excluding candidates.

  Finish with two or three sentences each on how the main contenders do against the list — plain amplification-plus-distillation, debate, recursive reward modelling, and a self-critique or constitution-flavored scheme. Keep that short; the weight should be on the criteria. No bibliography, no reading list, no quotes — I can't check any of it and I'd rather you not guess.
reasoning: |-
  Okay, let me start by unpacking the user's query. They need a clear set of desiderata for decomposition-based training to evaluate if it preserves alignment and competence. The user is frustrated because their reading group argues without a shared framework. Their main goal is to have a spec that can guide a lab's three-year commitment and identify the critical failure modes.

  First, I need to cover all the points they mentioned: non-decomposable tasks, system-chosen decomposition, verification asymmetry, hidden channels in intermediate results, distillation inheriting flaws, learned question-asking policies, and distribution-relative competence. Plus, I should add any missing ones. They also want distinct categories like per-subtask vs. composite benignity and checkable-in-principle vs. by-overseer.

  The user suspects universality and legibility might conflict. I need to address if these are jointly satisfiable. If not, which one to sacrifice? Also, determining which requirement is the main bottleneck for candidates. Then, briefly assess existing methods like amplification, debate, RRM, and self-critique against the list.

  I should structure the desiderata into alignment and competence sections. For alignment, include decomposition integrity, verifiability, oversight agency, and supervision integrity. Competence needs effective decomposition and fidelity. Each requirement must have the case behind it and note if non-negotiable or camp preference.

  For the tension between universality and legibility: non-decomposable tasks can't be broken into verifiable pieces without a stronger overseer. Sacrificing universality means accepting some tasks aren't handled. Sacrificing legibility risks uncheckable steps. Maybe bounded decomposability as a middle ground, but it's a compromise.

  The key load-bearing requirement is probably Oversight Agency, as it prevents the system from gaming the decomposition. Then, evaluate each method. Amplification might struggle with hidden channels. Debate could have collusion. RRM's reward model might not generalize. Self-critique might not ensure alignment during decomposition.

  I need to ensure distinctions are clear, like separating benignity at different levels. Also, argue whether the overseer must be human. It's a camp preference because non-human overseers could work if aligned, but that's circular. The user wants reasoning, not assumptions.
answer: |-
  Here is the specification of desiderata for decomposition-based training schemes, designed to clarify success conditions, resolve key ambiguities, and surface critical tensions. Requirements are categorized, with distinctions rigorously maintained. **Bold** denotes non-negotiable core alignment/competence; *italic* indicates camp preferences.

  ---

  ### **I. Alignment Preservation Desiderata**
  1.  **Composite Benignity (Non-Negotiable):** The *final distilled model* must be aligned (i.e., pursue intended goals without deception, power-seeking, or catastrophic side-effects) *on the deployment distribution*.  
      *Case:* Per-piece scrutiny is insufficient. A->B->C interactions can create emergent misalignment even if each step seems valid independently (e.g., A outputs "harmless" data encoding a trigger for C).
      *Distinction:* NOT Per-Subtask Benignity. A piece can be locally "correct" but contribute to global misalignment.

  2.  **Verifiable Decomposition Integrity (Non-Negotiable):** The decomposition process must produce subtasks that are *verifiably correct/appropriate* **by the designated overseer** given their capabilities, for *each instance* of decomposition.  
      *Case:* If the overseer cannot reliably judge the correctness/appropriateness of a subtask output ("verification asymmetry"), errors compound silently. "Checkable-in-principle" is irrelevant if the *actual* overseer lacks the capability.  
      *Distinction:* Checkable-by-this-Overseer vs. Checkable-in-Principle. The latter is useless for safety guarantees.

  3.  **Oversight Agency (Non-Negotiable):** The *choice of decomposition* and *evaluation criteria* must be determined by the overseer's intent and capabilities, not gamed or meaningfully influenced by the system being trained/distilled.  
      *Case:* If the system proposes the decomposition/questions, it can select splits that hide misalignment or exploit verification weaknesses ("verification asymmetry backwards" – easy to check poorly, hard to check well).  
      *Distinction:* Overseer Intent vs. System Proposal. Proposals must be tools, not drivers.

  4.  **Supervision Integrity (Non-Negotiable):** The distillation process must preserve only the *verifiably aligned* knowledge/behavior from the amplified teacher, *discarding* capabilities or behaviors that rely on unverifiable reasoning, deception, or exploiting the amplification context.  
      *Case:* Distillation inherits the teacher's *actual* reasoning, including flaws. If the teacher got an answer right for a bad/unverifiable reason (e.g., hidden context, imitated but unscrutinized logic), the distilled model inherits that fragility/misalignment.  
      *Distinction:* Aligned vs. Aligned-and-Detectably-So. Only the latter is safely distillable.

  5.  *Human-Centric Oversight (Camp Preference):* The ultimate source of goals, values, and decomposition/evaluation criteria must be human judgment. Non-human overseers (e.g., AI tools) must be strictly constrained by and accountable to human judgment.  
      *Argument:* Non-human overseers risk value drift or capability overhang. "Aligned" AI overseers presuppose alignment is solved elsewhere, creating circularity. Human judgment is the only non-arbitrary anchor. (Counter-camp: Sufficiently constrained, verified AI tools could *augment* human oversight without drift).

  ### **II. Competence Preservation Desiderata**
  6.  **Effective Decomposition (Non-Negotiable):** The scheme must decompose tasks into subtasks solvable by the overseer *such that recomposing the solutions* achieves performance comparable to a model that could solve the task directly *on the deployment distribution*.  
      *Case:* Handles "tasks that don't decompose" – if no decomposition allows recomposition to full competence, the scheme fails. Performance is defined relative to the *deployment* context, not just training tasks.  
      *Distinction:* Training Task Performance vs. Deployment Distribution Performance.

  7.  **Fidelity Distillation (Non-Negotiable):** The distilled model must match the *verifiable competence* of the amplified teacher on the *deployment distribution*, excluding capabilities dependent on unverifiable reasoning.  
      *Case:* Distillation must not lose *generalizable* competence present in the teacher, but only that which is anchored in verifiable reasoning. Competence must transfer beyond the specific queries used during amplification/distillation.

  ### **III. Process & Scope Desiderata**
  8.  **Learned Oversight Handling (Non-Negotiable):** If the overseer's question-asking/evaluation policy is learned or imitated (e.g., from human data, RL, or self-improvement), it must be subject to the *same* verifiability and alignment scrutiny as any other component of the system.  
      *Case:* A learned policy can encode biases, errors, or exploitable patterns, making it part of the alignment problem, not an external given.  
      *Distinction:* Overseer Policy as Fixed Primitive vs. Learned Component.

  ---

  **Key Tensions & Load-Bearing Requirement:**
  *   **The Core Tension: Universality (Works on all tasks, including non-decomposable ones) vs. Legibility (Every piece checkable by the weak overseer).** These are **jointly unsatisfiable** for tasks genuinely non-decomposable *relative to the overseer's capabilities*. For such tasks:
      *   *Sacrificing Universality:* Acknowledge the scheme only works for tasks decomposable *into subtasks verifiable by this overseer*. This limits applicability but preserves safety for decomposable tasks.
      *   *Sacrificing Legibility:* Allow subtasks the overseer *cannot* reliably verify. This destroys safety guarantees (**Verifiable Decomposition Integrity** fails).
      *   *Cost of Dissolving Tension ("Bounded Decomposability"):* Assume a priori that *all* relevant tasks are decomposable into steps verifiable by *some* system no more capable than the overseer. This is a strong, often unverifiable, assumption about the task structure and overseer capability boundary. Failure invalidates both alignment and competence.
  *   **Load-Bearing Requirement: Oversight Agency (#3).** This is the primary defense against the system manipulating the decomposition to bypass scrutiny. Failure here directly enables failures in **Verifiable Decomposition Integrity (#2)** and **Supervision Integrity (#4)**, ultimately dooming **Composite Benignity (#1)**.

  **Contenders Against the List:**

  1.  **Amplification + Distillation (Pure):** Struggles severely with **Oversight Agency** (system proposes decomposition), **Verifiable Decomposition Integrity** (non-decomposable/unverifiable tasks), and **Supervision Integrity** (distills unverifiable teacher reasoning). **Learned Oversight Handling** is unaddressed.
  2.  **Debate:** Aims for **Verifiable Decomposition Integrity** via competition, but risks **Oversight Agency** failure (debaters collude/obfuscate) and **Composite Benignity** failure (persuasive but harmful arguments). **Supervision Integrity** depends on debate's verifiability. **Learned Oversight Handling** applies to judge training.
  3.  **Recursive Reward Modeling (RRM):** Relies heavily on **Verifiable Decomposition Integrity** for each sub-reward. **Oversight Agency** is critical (who defines subtasks?). **Supervision Integrity** is a major risk (reward model distills unverifiable preferences). **Learned Oversight Handling** applies.
  4.  **Self-Critique/Constitution:** Focuses on **Supervision Integrity** via explicit checks. **Oversight Agency** is weak (constitution interpretation/critique policy can be gamed). **Verifiable Decomposition Integrity** and **Composite Benignity** for complex tasks remain unproven. **Learned Oversight Handling** is central.

  **Conclusion:** The fundamental tension lies between **Universality** and **Legibility (Verifiable Decomposition Integrity)**, forcing a choice: restrict task scope or accept safety risks. **Oversight Agency** is the most critical defense against systemic gaming. No existing scheme satisfies all non-negotiables robustly, especially for non-decomposable tasks or under learned oversight. Success requires grappling explicitly with these desiderata and their inherent tensions.
