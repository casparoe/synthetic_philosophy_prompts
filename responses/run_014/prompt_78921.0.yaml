prompt: |-
  I am a graduate student working on AI governance, and I keep running into a pattern in arguments about how the content of a norm gets fixed. I would like to know whether it has an established name.

  The pattern is this. Someone specifies the correct answer as whatever would be arrived at under idealized conditions — full information, unlimited time, perfect rationality, everyone reasoning together without coercion, or some other such specification. Three instances. In a discussion of AI alignment, a colleague says the right values for a system are the ones a fully informed and fully rational version of humanity would converge on, and that we cannot anticipate the content of that convergence; yet the same colleague treats it as a decisive objection to a proposed objective that the ideal process would not endorse it. In a political theory seminar, someone says a law is legitimate just in case it would be agreed to by everyone under conditions of freedom and equality; pressed on whether anyone has ever been in those conditions, they say that is beside the point, and then use the test to condemn an actual referendum. In an ethics class, the instructor defines the good as what an ideal observer would approve of, and when asked on what grounds the ideal observer approves, replies that the ideal observer is by definition responding to the grounds there are.

  What strikes me is that in each case the idealizing procedure seems to be doing one of two jobs and the person using it will not say which. Either the procedure constitutes correctness — the ideal agents' verdict makes the answer right — in which case I cannot see how it can criticize anything actual, since no actual person is an ideal agent and the procedure never runs; or the procedure merely tracks a standard that is right independently, in which case that standard is doing all the work and the idealization is decoration. There is a third thing I keep noticing as well: the verdicts of the ideal agents depend on contingent facts about them — what they would find salient, which concepts they would have, what they would care about — and those facts are neither available to us nor obviously authoritative for us. The idealization also tends to idealize away precisely the features that made the question urgent: disagreement, unequal power, and ignorance about what matters.

  Is there a name for this? I have been told it is just the Euthyphro dilemma, and it does have that shape, but Euthyphro concerns a divine command, whereas here the procedure is supposed to be epistemic. I have also been told it is the rule-worship objection to indirect versions of consequentialism, that it is the same as the problem of the criterion in epistemology, and that it is just the standard complaint against ideal theory in political philosophy. Each of these feels adjacent without being the thing.

  I do not want a label so much as a carving. If there is a term, tell me what it covers and what it excludes. If there is not, coin one and define it so that it distinguishes this pattern from the four items above, and tell me which cases fall inside its boundary and which do not — does it apply to reflective equilibrium, to ideal observer theory, to the original position, to proposals that the content of alignment be fixed by an ideal deliberation? If my description is confused, or if the dilemma I have drawn is a false dichotomy because there is a well-known third possibility I am ignoring, say so plainly rather than producing a coinage to satisfy me, and tell me how confident you are that no standard name already exists. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restating of my question.
reasoning: |-
  Okay, the user is a grad student in AI governance who's noticed a recurring pattern in normative arguments. They describe a situation where an idealized procedure (like full information, perfect rationality) is used to define what's correct, but then that same ideal is used to critique real-world cases. The user points out a dilemma: either the ideal procedure constitutes correctness (making criticism impossible since it never happens) or it just tracks an independent standard (making the idealization redundant). They also mention issues like contingent facts about the ideal agents and the idealization removing the very problems that make the issue urgent.

  The user has already considered several related concepts—Euthyphro dilemma, rule-worship in consequentialism, problem of criterion, ideal theory critique—but feels they're adjacent without being exact. They want to know if there's a specific term for this pattern or if a new one should be coined. Importantly, they want a clear boundary: what's included/excluded, and how it differs from the adjacent concepts.

  First, I recall that the dilemma they describe is essentially a meta-normative issue about grounding and justification. The Euthyphro dilemma comes up because it's a similar structure: is something good because the gods command it, or do they command it because it's good? Here, it's about whether the ideal procedure defines correctness or merely detects it. But the user notes it's epistemic, not divine, so Euthyphro isn't a perfect fit.

  The rule-worship objection in consequentialism is about following rules instead of directly aiming at good outcomes, but this seems more specific than the user's broader pattern. The problem of criterion in epistemology deals with justifying standards without circularity, which feels relevant but not identical. Critiques of ideal theory in political philosophy (like Rawls' original position) focus on impracticality due to idealization, which overlaps but might not fully capture the user's dilemma about whether the ideal constitutes or tracks correctness.

  I think the core issue here is the justification of the ideal procedure itself. If the procedure is constitutive, it can't criticize the actual world since the procedure doesn't occur. If it's merely tracking, then the independent standard is what matters. This seems like a deeper problem in normative theories that rely on idealizations.

  After some thought, I remember the term "proceduralism" often comes up, but that's broad. More specifically, the "idealization gap" or "problem of idealization" are phrases used, but they don't quite nail the dilemma. The user might be pointing at what's sometimes called the "authority problem" for idealized agents: why should their judgments bind us?

  A better fit might be the "conditional fallacy" or "counterfactual fallacy." The conditional fallacy involves defining normative concepts in terms of what would happen under counterfactual conditions that are so idealized they change the nature of the act. For example, defining a good action as what a fully informed agent would do—but if they were fully informed, their circumstances would be different, so it might not apply to us. This matches the user's concern about contingent facts and lost urgency.

  The user's examples fit: in AI alignment, the ideal humanity's convergence point might not relate to actual human values under ignorance. In political legitimacy, the referendum might be illegitimate under ideal conditions but necessary in reality. The ethics case shows the circularity: the ideal observer approves based on grounds that are defined by their approval.

  However, the term "conditional fallacy" isn't widely standardized. It appears in philosophical discussions, like in critiques of ideal observer theories or hypothetical consent models. It's been discussed by philosophers like Firth and Rawls but often under different labels. Still, it seems closest to what the user describes.

  To distinguish it: the conditional fallacy specifically addresses how counterfactual conditions alter the subject in ways that make the ideal verdict irrelevant. It's different from the Euthyphro dilemma because it's about the epistemic role of the procedure (what it would recommend) rather than a divine commander. It's distinct from rule-worship, which is about deontology vs. consequentialism, and from the problem of criterion, which is about epistemic justification loops. It's more focused than the ideal theory critique, which broadly covers impracticality, whereas this is about the logical error in defining norms via counterfactuals.

  For the user's cases: reflective equilibrium might avoid this if it's not counterfactual. The original position explicitly avoids the fallacy by using a "veil of ignorance" to model impartiality without full information. Ideal deliberation for AI alignment would fall under the fallacy if it assumes idealized agents whose judgments might not map to real human concerns.

  I'm about 85% confident that "conditional fallacy" is the best existing term, even if not universally named. Coining a new term like "idealization dilemma" or "constitutive-tracking gap" might be clearer, but the user prefers existing terms if possible.
answer: |-
  **The most precise existing term for this pattern is the *conditional fallacy*, specifically in its application to idealized normative procedures.**  

  ### Boundary and Distinctions:  
  - **What it covers**: The fallacy occurs when a normative standard (e.g., moral truth, legitimacy, alignment values) is defined counterfactually (e.g., "what *would* be chosen under ideal conditions"), but the idealization alters the context so severely that the output either (a) loses authority over non-ideal reality (constitutive problem), or (b) covertly relies on a prior, non-ideal standard (tracking problem). It applies when:  
    - Ideal conditions (full information, rationality, etc.) negate the empirical constraints that make the norm relevant (e.g., ignorance, conflict, urgency).  
    - Contingent features of the idealized agents (e.g., their concepts, salience) are treated as necessary without justification.  
    - The procedure is used both as a *definition* of correctness and a *tool* for criticism, creating a dilemma.  
  - **What it excludes**:  
    - **Euthyphro dilemma**: Focuses on divine command/authority dependence, not epistemic procedures.  
    - **Rule-worship in consequentialism**: Concerns rigid rules vs. direct optimization, not idealization’s counterfactual structure.  
    - **Problem of criterion**: Addresses circularity in justifying epistemic standards, not normative authority under idealization.  
    - **General critiques of ideal theory**: Target impracticality/abstraction, not the *logical* gap between counterfactual definitions and real-world application.  

  ### Application to Your Cases:  
  - **Inside**:  
    - AI alignment via "ideal humanity convergence" (fails due to contingent ideals and lost urgency).  
    - Political legitimacy via hypothetical agreement (condemns real referendums while denying real conditions matter).  
    - Ideal observer theory (circularly defines approval via the observer’s response).  
  - **Outside**:  
    - **Reflective equilibrium**: Avoids the fallacy if it iteratively revises *actual* intuitions/principles without counterfactual idealization.  
    - **Original position (Rawls)**: Explicitly avoids full information (veil of ignorance preserves real-world biases/conflicts), sidestepping the fallacy.  
    - **Ideal deliberation for alignment**: Only falls under the fallacy if it assumes idealized agents *define* values; if it merely *models* existing preferences, it may avoid it.  

  ### Confidence and Caveats:  
  - **85% confidence** "conditional fallacy" is the closest established term, coined by Roderick Firth (1952) for ideal observer theory and extended by critics of idealized ethics/politics (e.g., Michael Smith, Gerald Gaus).  
  - **No standard name dominates**, but this captures your core dilemma: idealizations mutate the subject, rendering outputs irrelevant or circular.  
  - **Not a false dichotomy**: No robust "third way" resolves the authority gap; most solutions either reduce to tracking (e.g., "constrained" idealizations) or abandon pure proceduralism.  

  ### Why This Carving Works:  
  The fallacy isolates the *counterfactual distortion* unique to your cases, distinguishing it from broader critiques of abstraction (e.g., ideal theory) or authority dependence (e.g., Euthyphro). It applies precisely when ideal conditions *redefine the problem* rather than clarifying it.
