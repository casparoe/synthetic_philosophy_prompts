answer: |-
  Below is a comprehensive exam design based on your specifications and constraints. I've addressed your key concerns directly and structured the components for clarity and practicality.

  ---

  ### **Exam Question**  
  *(To be printed above the passage)*  
  **"Identify what you judge to be the SINGLE most serious weakness in the argument presented in the passage. Explain what conditions would need to exist for the proposal to overcome this weakness. (25 marks)"**  

  ---

  ### **Model Answer**  
  *(~700 words; reflects a top-tier response written in 45 mins)*  

  The most serious weakness in the argument is its **misrepresentation of the Danish model**, specifically its failure to acknowledge that Denmark’s system relies on **union-administered insurance funds** funded by worker contributions, not general taxation. The passage claims Denmark’s outcomes can be replicated by introducing a "Danish-style earnings-replacement benefit funded from general taxation" alongside compulsory work/training. This ignores that Denmark’s 90% wage replacement is **not a universal state benefit** but a **voluntary, contribution-based scheme** managed by unions, with strict caps and eligibility rules.  

  For this proposal to succeed, three conditions must exist:  
  1. **Strong, universal union membership**: Denmark’s model depends on >80% union density. Funds are financed by member contributions (and modest state subsidies), ensuring reciprocity. Workers "buy in" because they fund their own safety net. General taxation would require near-universal trust in state redistribution—something Denmark’s high-social-trust culture enables but the UK lacks. Without pre-existing trust, taxpayers may reject subsidising others’ benefits.  
  2. **Institutional capacity for co-governance**: Danish funds are jointly managed by unions and employers, preventing abuse. The state merely sets frameworks. The proposal’s "statutory obligation" would require UK Jobcentres to replicate this nuanced oversight. Currently, they lack the resources/trust to define "suitable work" fairly or tailor training to local labour markets.  
  3. **Realistic benefit caps**: Even Denmark caps benefits at ~£2,300/month (far below 90% of high wages). The passage omits this, implying unlimited generosity. For the UK version to avoid wage inflation or dependency, it must include similar caps—but this would clash with the "90%" promise, eroding public support.  

  The passage’s claim that "any country that adopts these two measures can expect Danish outcomes" collapses under this flaw. Denmark’s success stems from **historical partnership between unions, employers, and the state**—not isolated policies. Transplanting surface-level rules without the underlying ecosystem (high unionisation, contribution culture, decentralised administration) risks failure. Crucially, if the UK implemented *only* the two proposed measures, it might increase deficits or fraud without Denmark’s accountability mechanisms. The passage preemptively blames "political" failure, but the real obstacle is **institutional incompatibility**.  

  ---

  ### **Marking Scheme (25 marks)**  
  **Band 1: First-Class (21–25 marks)**  
  - **Identifies the core flaw**: Misrepresentation of Danish model’s funding/structure (5 marks).  
  - **Explains necessary conditions**: 3+ realistic, non-obvious prerequisites (e.g., union density, co-governance, caps) (10 marks).  
  - **Links flaw to proposal’s viability**: Shows why omission undermines UK applicability (5 marks).  
  - **Precision**: Avoids tangents; uses only taught terminology (e.g., "insurance funds") (5 marks).  

  **Band 2: Competent (12–20 marks)**  
  - Identifies a *valid* flaw (e.g., "ignores trust differences" or "preemptively excuses failure") but not the deepest one.  
  - Lists 1–2 conditions superficially (e.g., "need more trust" without explaining *how*).  
  - Descriptive but lacks systemic analysis (e.g., "Danish unions matter" without specifics).  
  - **Cap**: 16/25 if flaw is secondary (e.g., focusing only on the last sentence’s self-absolution).  

  **Band 3: Fluent List (6–11 marks)**  
  - Lists weaknesses (e.g., "no mention of caps," "trust issues," "political obstacles") without isolating ONE core flaw.  
  - Conditions are vague/unconnected (e.g., "government must explain better").  
  - **Cap**: 11/25. Lacks prioritisation and causal reasoning.  

  **Band 4: Inadequate (0–5 marks)**  
  - Misreads passage (e.g., "argues for lower taxes").  
  - Offers opinion without analysis (e.g., "this would be too expensive").  

  ---

  ### **Common Weak Answers & Caps**  
  1. **"The last sentence excuses failure, so the proposal is unfalsifiable."**  
     *Cap*: 16/25.  
     *Issue*: Correct but superficial. Ignores *why* failure is likely (institutional mismatch).  

  2. **"Denmark has higher trust, so it wouldn’t work here."**  
     *Cap*: 12/25.  
     *Issue*: Treats trust as innate, not addressing *how* the proposal could build it (e.g., via contribution systems).  

  3. **"The benefit is too generous and would discourage work."**  
     *Cap*: 8/25.  
     *Issue*: Parrots rhetoric without engaging Denmark’s actual outcomes (low unemployment) or safeguards (compulsory training).  

  4. **"The author ignores Nordic differences."**  
     *Cap*: 10/25.  
     *Issue*: Valid but off-topic—passage explicitly cites *Denmark*, not Nordics generally.  

  ---

  ### **Straight Feedback on Your Instincts**  
  1. **Your instinct about the last sentence** is partially right—it *is* a flaw—but **not the most serious one**. The deeper issue is the **misrepresentation of the Danish model’s mechanics** (funding/administration). This creates a "copy-paste" fallacy: if the UK fails, the passage blames politics, but the real cause is omitting necessary institutional preconditions. Your teaching about union funds is CRITICAL here—it’s the linchpin.  
  2. **Weight of your teaching points**:  
     - **Union funds** (not tax office) are essential to include (as in the model answer). They explain why Denmark’s model isn’t state-dependent.  
     - **Benefit caps** matter less but support the "misrepresentation" argument.  
     - **Nordic differences** are relevant only if students note the passage cherry-picks Denmark.  

  **Overall Difficulty**: Well-calibrated. Strong students will expose systemic flaws; weaker ones will fixate on surface issues (trust, cost). The question *will* discriminate: it forces prioritisation, not regurgitation.  

  ---  
  Let me know if you need adjustments for printing constraints or further refinements. This design respects your students’ experience while challenging them to think structurally—exactly as intended.
