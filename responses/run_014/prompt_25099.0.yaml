  i'm presenting a paper at APSA next month — the political theory panel, not the IR one. my thesis is that Kant's *Perpetual Peace*, read carefully, doesn't actually rule out humanitarian intervention the way everyone says it does. the fifth preliminary article says no state shall forcibly interfere in the constitution and government of another state, sure, but i'm arguing that (a) this is a preliminary article not a definitive one, (b) it's about interfering with *constitutions*, not about stopping mass atrocities, and (c) the definitve articles' logic of republican peace actually *requires* intervention when a state collapses into civil war that threatens the federation of republics. i've got the textual evidence lined up and i think the argument is solid.

  the audience is going to be maybe forty people: about a third Kant scholars who know the texts cold, a third just war theorists who've been fighting about intervention since the 90s, and a third IR constructivists who care about norms and the responsibility to protect. the Kant scholars are mostly going to hate this — they've spent careers arguing Kant is the anti-intervention guy. the just war people might be sympathetic but they'll want to know what this adds to Walzer. the constructivists will care about whether my reading can actually do normative work in the current international order.

