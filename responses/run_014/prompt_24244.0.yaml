  ### Scenario
  In 18th-century chemistry, a community studying gases from a specific mine in Germany uses "dephlogisticated air" (P) for any gas from the mine that supports combustion—a term entrenched by their founder Georg Ernst Stahl and central to their textbooks and lab practices. Unbeknownst to them, gases supporting combustion in this mine before 1785 (time *t*) are either pure oxygen or nitrous oxide (both breathable), but after *t*, mining conditions change, producing chlorine trifluoride (which also supports combustion but is toxic and non-breathable). The community’s hypothesis H<sub>P</sub>: "All dephlogisticated air from this mine is breathable." A rival Lavoisier-inspired group defines "oxygen" (Q) and hypothesizes H<sub>Q</sub>: "All oxygen from this mine is breathable." Pre-*t*, every observed sample of P (dephlogisticated air) was breathable, and every sample of Q (oxygen) was breathable. Post-*t*, dephlogisticated air includes chlorine trifluoride (which supports combustion but is not breathable), falsifying H<sub>P</sub>, while oxygen samples (Q) remain breathable.

  ### Analysis
  - **Predicate_P**: "Dephlogisticated air" = gas from the mine that supports combustion. Hidden structure: disjunctive (oxygen OR nitrous oxide before *t*; oxygen OR chlorine trifluoride after *t*). The community treats P as a basic, unified property.
  - **Predicate_Q**: "Oxygen" = a specific elemental gas (O₂), without disjunctions.
  - **Pre_t_evidence**: All gas samples from the mine observed before 1785 that supported combustion (P) were breathable; all oxygen samples (Q) were breathable.
  - **Simplicity_verdict**: Simplicity picks Q (H<sub>Q</sub>) because "oxygen" is a non-disjunctive predicate, while P is complex (implicitly disjunctive), making H<sub>Q</sub> the simpler hypothesis.
  - **Entrenchment_verdict**: Entrenchment picks P (H<sub>P</sub>) because "dephlogisticated air" is deeply entrenched in the community’s language, history, and practices (Stahl’s legacy, textbooks, lab protocols).
  - **Which_is_true_in_the_world**: Q (H<sub>Q</sub> is true; oxygen is always breathable. H<sub>P</sub> is false due to non-breathable chlorine trifluoride after *t*).
  - **Feature_doing_the_work**: The hidden disjunctive structure of P (unknown to the community) makes it susceptible to post-*t* counterexamples, while Q’s simplicity avoids this.
  - **Goodmanian_rebuttal**: A defender would argue that entrenchment correctly reflects the community’s actual inductive practices—P was projectible *for them* given their history—and they might deny P is "complex" in their context, as they lack the knowledge to see it as disjunctive.

