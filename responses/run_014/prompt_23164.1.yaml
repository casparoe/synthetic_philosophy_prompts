  The user's issue is that if a convention is arbitrary and relies solely on common knowledge, it should be fragile. If common knowledge breaks—say, not everyone knows that others know—then the convention should collapse because there's no other reason to follow it. But in reality, arbitrary conventions like driving on a particular side of the road are robust even when common knowledge isn't perfect globally. For example, if someone from a left-driving country visits a right-driving one, they still follow the local rule even without knowing what everyone else knows. The user wants a solid argument that this is a real theoretical gap for Lewis, not just an empirical quirk.

