answer: |-
  You've pinpointed a fundamental and genuinely problematic gap in David Lewis's seminal theory of convention (*Convention: A Philosophical Study*, 1969). The core tension you identify – between the *arbitrariness* requirement, the *common knowledge* requirement, and the observed *robustness* of actual conventions – isn't just an empirical idealization Lewis could easily dismiss. It strikes at the logical coherence and explanatory power of his model. Here's a structured argument for why this constitutes a real theoretical problem:

  **The Core Argument: Fragility from First Principles**

  1.  **Lewis's Core Requirements:**
      *   **Arbitrariness:** A convention solves a coordination problem where *multiple distinct solutions* are possible *and* the agents are *indifferent* (or nearly so) between the solutions *themselves*, prior to the convention. The *only* reason to prefer one solution over another is the expectation that others will choose it too (pp. 3-7, 24, 42, 68-70).
      *   **Common Knowledge (CK):** For a regularity R to be a convention, it must be common knowledge in the population that:
          *   (CK1) Everyone conforms to R.
          *   (CK2) Everyone expects everyone else to conform to R.
          *   (CK3) Everyone prefers to conform to R *conditional on* the expectation that others will conform (because it solves the coordination problem) (pp. 52-60, 76-88).
          *   *CK implies an infinite hierarchy of mutually known beliefs:* I know R, I know you know R, I know you know I know R, and so on *ad infinitum*.

  2.  **The Logical Consequence: Inherent Fragility:**
      *   Because the convention is arbitrary (no intrinsic reason to prefer driving left over right *except* mutual conformity), the *sole* motivation for *any individual* to conform is their *belief* that others will conform (CK2) and their preference for coordination conditional on that belief (CK3).
      *   The stability of the convention is *entirely* parasitic on the stability of the common knowledge state. The convention has *no independent grounding*.
      *   **Therefore, any significant break or uncertainty within the CK hierarchy should, logically, undermine the primary motivation for conformity.** If I doubt whether *you* know that *I* know the convention (or any higher-order uncertainty), then my belief that you expect me to conform (CK2) is weakened. Since my conformity depends solely on this expectation (CK3) and the arbitrariness means I have no *other* reason to prefer one option, my incentive to conform rationally diminishes or disappears. Uncertainty cascades down the hierarchy.

  3.  **The Empirical Reality: Robustness Despite Broken Knowledge:**
      *   Arbitrary conventions like driving rules, greeting norms, or currency use demonstrate remarkable stability even in situations where global CK *obviously* fails:
          *   **Newcomers/Strangers:** A driver entering a country for the first time doesn't know the local convention *is* common knowledge there. They observe behavior (perhaps seeing cars drive on the right) and deduce the local rule exists. They conform based on *observed regularity* and *local signaling* (signs, road markings), not CK of the entire population's knowledge hierarchy. Lewis's CK requirement demands the newcomer know that *every* local driver knows *they* know the convention, etc., which is impossible upon arrival.
          *   **Large Populations/Imperfect Communication:** In large, diverse societies, it's implausible that every member has CK about the convention with every other member. Subgroups might have doubts about the knowledge state of distant subgroups. Yet, conformity persists robustly.
          *   **Temporary Breakdowns/Localized Ignorance:** If a natural disaster disrupts road signs and communication in an area, drivers don't immediately revert to chaos. They rely on observing immediate others, established habits, and the *presumption* of an underlying norm, even if they can't be sure others know *they* know it at that moment.
          *   **Children/Learners:** Children learn conventions through observation and instruction long before they grasp the complex CK hierarchy involving themselves and the entire adult population.

  4.  **Why This is a Genuine Problem for Lewis (Not Just Idealization):**
      *   **Attacks the Necessity of CK:** The robustness shows that widespread conformity to arbitrary conventions can emerge and persist *without* the full CK hierarchy Lewis deemed *necessary*. Observation of regularities, local expectations, habits, and simple signals (like road signs which *create* knowledge, rather than presuppose CK of their existence) are sufficient motivators and stabilizers. Lewis's model cannot easily accommodate these *alternative, lower-level* mechanisms as sufficient because his definition *requires* CK.
      *   **Highlights the Underestimation of Habit/Salience:** Lewis downplays habit as merely a consequence of convention, not part of its definition or sustaining mechanism (pp. 42-44). Yet, the robustness of driving conventions heavily relies on ingrained habit. Once established, the *salience* of the existing solution (even if arbitrary initially) becomes a powerful reason to stick with it, distinct from the CK of mutual expectations. Lewis's strict arbitrariness requirement struggles to account for this shift in salience *becoming* a non-conventional reason for persistence.
      *   **Exposes the "No Independent Reason" Paradox:** The requirement for pure arbitrariness combined with CK dependence creates an unrealistically fragile equilibrium. The real-world robustness suggests that even arbitrary conventions quickly develop *de facto* "reasons" for conformity beyond pure mutual expectations: the cost of change, the force of habit, the risk of sanctions (even informal ones like honking), and the sheer salience of the established pattern. Lewis's model struggles to integrate these stabilizing factors *as inherent to convention itself* because it defines convention *against* having such independent reasons.
      *   **Threatens Explanatory Scope:** If Lewis's strict definition only applies to small, tightly-knit groups with perfect communication (where CK might plausibly hold), then it fails as a general account of the vast majority of social conventions that govern large-scale societies, which are precisely the ones exhibiting the robustness-in-spite-of-imperfect-knowledge phenomenon.

  **Conclusion:**

  You are correct. The combination of Lewis's strict arbitrariness requirement and his demanding common knowledge requirement logically entails that arbitrary conventions *should* be fragile, vulnerable to any significant breakdown in the mutual knowledge hierarchy. The observed remarkable robustness of such conventions in the face of *inevitable* imperfections and breakdowns in global common knowledge demonstrates a genuine gap in his model. It shows that his conditions are not merely idealized but potentially *unnecessary* (common knowledge) and *overly restrictive* (pure arbitrariness) for explaining the core phenomenon of conventional stability. The persistence of conventions like driving rules relies on mechanisms Lewis undervalues or excludes: observation of regularities, localized expectations, habit formation, salience, and low-level signaling, which function effectively even when the infinite regress of mutual knowledge fails. This isn't just an empirical oversight; it reveals a theoretical shortcoming in the model's ability to account for the very stability it purports to explain. Later theorists (e.g., Bicchieri, Miller, Gilbert) have explicitly grappled with this gap, often relaxing the CK requirement or emphasizing different stabilizing factors.
