  We are building a decision tree with branch questions that refer to cases in the case bank. The goal is to sort participants into positions on the problem of old evidence without using labels or requiring prior knowledge.

   The problem: If an agent already believes E with probability 1, then learning a hypothesis H that entails E cannot change the probability of E (since it's already 1). Therefore, by the incrementalist criterion (confirmation as probability increase), E cannot confirm H. But cases like Einstein's derivation of Mercury's perihelion anomaly seem to be paradigmatic examples of confirmation.

   Case bank:
     A: Mercury's perihelion (old) and starlight deflection (new) for general relativity.
     B: Hydrogen spectrum (old, but also predicted new lines) for Bohr's model.
     C: A lab setting with a model output pattern E and a mechanistic hypothesis H that entails E.
        C1: New researcher, E is new to her but old for the lab.
        C2: Researcher who has known E for a year formulates H now.
        C3: Like C2 but H was articulated earlier and given middling probability, now revived.
        C4: Like C2, but the agent hasn't explicitly thought about the entailment.

   We need 8-12 branch questions. Each question must be answerable by reference to at least one case. The questions must not use vocabulary of the positions. We must have at least one question about agent-relativity (using C1) and one about changing the algebra (vs fixed). We must separate the issue of E having probability 1 from H having a prior (using C2 vs C3).

   We are to build the logical space first: list the questions and options, mark coherent combinations, then assign positions.

   The leaves we must include (described, not named):
    1. Confirmation is about firmness, not increase (so no probability change needed).
    2. The agent learns a logical relation (not expressible as a probability redistribution) and that does the confirming.
    3. Reconstruct the agent's doxastic state when E was not certain and conditionalize on that.
    4. Observation is never certain; updating on a partial observation dissolves the problem.
    5. The problem is for incrementalist confirmation, not Bayesianism.
    6. The problem is an artifact of logical omniscience and disappears for limited agents.

   We'll add more if needed.

   Steps:
    I. Frame the problem in 100 words.
    II. Present the case bank.
    III. The decision tree: questions and options.
    IV. Mark coherent combinations and then assign positions (leaves) to the coherent paths.
    V. For each leaf: a short descriptive name, one sentence on awkward commitment, and which leaves it cannot be separated from.
    VI. List pairs of leaves that the tree cannot distinguish and for each, either a further question or a note that the case bank doesn't distinguish.

