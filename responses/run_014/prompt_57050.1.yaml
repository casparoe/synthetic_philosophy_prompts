  2. **Limited Agent vs. Agent-Relative** (if deriving entailment feels like "newness").  
     - *Case bank gap*: No case distinguishes entailment derivation from general newness.  
  3. **Hybrid vs. Agent-Relative** (if "newness" is ambiguous).  
     - *Further question*: In Case C1, if the lab had discarded \(H\) earlier, would \(E\) confirm \(H\) for the new researcher? (Hybrid: no; Agent-Relative: yes.)  

