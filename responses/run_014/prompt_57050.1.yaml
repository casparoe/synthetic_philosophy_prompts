  ### Handout: The Problem of Old Evidence  
  **Framing the Problem**  
  In Bayesian confirmation theory, evidence \(E\) confirms hypothesis \(H\) if \(P(H|E) > P(H)\)—that is, \(E\) raises \(H\)'s probability. But if \(E\) is already accepted with probability 1 (\(P(E) = 1\)), then \(P(H|E) = P(H)\). No probability increase occurs, so \(E\) cannot confirm \(H\) on the incrementalist criterion. This creates a paradox: scientific history treats some "old evidence" (e.g., Mercury’s orbit) as strongly confirming theories (e.g., general relativity), even when it was known before the theory was proposed. How can we reconcile this?  

  **Case Bank**  
  - **Case A**: Mercury’s perihelion advance was known and accepted before Einstein derived it from general relativity (GR) in 1915. Starlight deflection (measured in 1919) was new evidence for GR.  
  - **Case B**: Hydrogen’s spectral lines were measured and empirically modeled (1885–1888) but lacked a theoretical basis until Bohr’s 1913 atomic model derived them. The model also predicted new lines, later found.  
  - **Case C (Lab Model)**: A lab observes a model-output pattern \(E\) for two years. Hypothesis \(H\) (a mechanistic circuit) entails \(E\).  
    - **C1**: A new researcher joins, reads logs (learns \(E\)), and formulates \(H\) that day. \(E\) was old for the lab, new for her.  
    - **C2**: A researcher (certain of \(E\) for a year) formulates \(H\) now.  
    - **C3**: Like C2, but \(H\) was articulated earlier, given middling probability, set aside, and now revived.  
    - **C4**: Like C2, but the researcher never explicitly considered whether \(H\) entails \(E\) and must derive it.  

  ---

  ### Decision Tree  
  Answer questions using cases above. Each option is a claim about cases, not a label.  

  1. **In Case C1, does \(E\) confirm \(H\) for the new researcher?**  
     - A: Yes, \(E\) confirms \(H\) for her.  
     - B: No, \(E\) does not confirm \(H\) for her.  

  2. **In Case C2, does \(E\) confirm \(H\) for the researcher?**  
     - A: Yes.  
     - B: No.  

  3. **In Case C3, does \(E\) confirm \(H\) for the lab?**  
     - A: Yes.  
     - B: No.  

  4. **In Case C4, does \(E\) confirm \(H\) before the researcher derives the entailment?**  
     - A: Yes.  
     - B: No.  

  5. **In Case A, does Mercury’s perihelion (old evidence) confirm GR?**  
     - A: Yes.  
     - B: No, only starlight deflection (new) does.  

  6. **In Case B, do the pre-1913 spectral lines (old evidence) confirm Bohr’s model?**  
     - A: Yes.  
     - B: No, only the new lines do.  

  7. **In Case C2, was the researcher truly certain of \(E\)?**  
     - A: No, we are never certain of observations.  
     - B: Yes, she was certain.  

  8. **Should we resolve the problem by letting agents learn "\(H\) entails \(E\)" as a new proposition?**  
     - A: Yes, this new proposition drives confirmation.  
     - B: No, the algebra of propositions is fixed.  

  9. **Can we resolve Case C2 by reconstructing the researcher’s beliefs before she knew \(E\)?**  
     - A: Yes, confirmation uses this reconstructed state.  
     - B: No, reconstruction is invalid or impractical.  

  ---

  ### Coherent Paths and Positions  
  Not all answer combinations are coherent. Incoherent paths (e.g., affirming reconstruction while denying uncertainty *and* fixed algebra) are ruled out. The tree sorts you into these positions:  

  | Position (Descriptive Name) | Key Commitment | Awkwardness | Agent-Relative? | Indistinguishable From |
  |-----------------------------|----------------|-------------|-----------------|------------------------|  
  | **Firmness View**<br>*Confirmation is high posterior probability, not increase.* | Denies incrementalism: \(E\) confirms \(H\) if \(P(H\|E)\) is high, even if no increase. | Cannot explain why *novel* predictions feel more confirmatory. | Not committed | None |  
  | **Logical Relation Learning**<br>*Learning "H entails E" (a new proposition) confirms.* | Requires expanding the algebra to include entailment. | Fails if entailment was known; ad hoc for old evidence. | Not committed | Reconstruction (if reconstruction is seen as entailment learning). |  
  | **Reconstruction View**<br>*Confirm by conditionalizing on pre-acceptance belief state.* | Uses counterfactual or past lower probability for \(E\). | Requires unreliable access to historical beliefs (e.g., Case C2). | Not committed | Logical Relation (if entailment is learned via reconstruction). |  
  | **No Certainty View**<br>*Agents never assign P(E)=1; update dissolves the problem.* | Observations are uncertain, so \(E\) *can* raise \(H\)’s probability. | Clashes with scientific practice (e.g., treating Mercury’s data as settled). | Not committed | None |  
  | **Problem for Incrementalism**<br>*Old evidence confirms, but not via probability increase.* | Incrementalism is flawed; confirmation requires other criteria. | Offers no alternative account within Bayesianism. | Not committed | Limited Agent (if incrementalism is rejected). |  
  | **Limited Agent View**<br>*Agents lack logical omniscience; deriving entailment confirms.* | Confirmation occurs when agents *realize* \(H\) entails \(E\). | Fails if agents *are* logically omniscient (e.g., idealized cases). | Committed | Agent-Relative (if newness is tied to entailment derivation). |  
  | **Agent-Relative View**<br>*Confirmation depends on individual learning history.* | \(E\) confirms \(H\) only if \(E\) was new *to that agent*. | Same \(E\) confirms for some agents but not others (e.g., Case C1 vs. lab). | Committed | Limited Agent (if entailment derivation is "new" for the agent). |  
  | **Hybrid View**<br>*Confirmation requires newness of H or E to the agent/community.* | Distinguishes new hypotheses (C2) from revived ones (C3). | Arbitrary: Why should old hypotheses be immune? | Optional | Agent-Relative (if newness is agent-specific). |  

  **Empty Cells**  
  - *Incrementalist + Certainty + Non-Agent-Relative + No Fixes*: Incoherent (denies confirmation but must accept it in Cases A/B).  
  - *Reconstruction + No Memory Access*: Unattractive (reconstruction fails without data).  

