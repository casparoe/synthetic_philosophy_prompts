  ## Job Advertisement: Character Integrity Analyst (Level I)

  **Location:** Ethos Dynamics HQ, Veridian Valley  
  **Employment Type:** Full-Time, Onsite  
  **Salary Band:** $72,000 - $85,000 + Equity (Virtue-Class Shares)  
  **Start Date:** Rolling Intake  
  **Application Deadline:** Until We Find the Truly Worthy™

  **About Ethos Dynamics:**  
  At Ethos Dynamics, we believe the future of work isn't just skills; it's *soul*. We're pioneering Moral Character Architecture™, building resilient teams composed exclusively of individuals whose honesty, compassion, and conscientiousness aren't fleeting moods, but bedrock realities. Forget "culture fit" – we measure *character fit*. Our patented V.I.R.T.U.E.® Assessment cuts through the noise of resumes and rehearsed interviews to reveal the genuinely good. We don't hire actors; we hire authentic agents of integrity. Join us in proving that virtue isn't just possible in the corporate world – it's profitable.

  **The Role:**  
  As a Character Integrity Analyst (CIA - Level I), you'll be foundational to our mission. You'll engage in complex (but ethically sound!) data fidelity tasks, collaborate with teams committed to radical transparency, and contribute directly to projects designed for measurable social impact. Your stable moral compass will be your primary tool, guiding decisions where ambiguity reigns and pressure mounts.

  **Who You Are (The Non-Negotiables):**

  *   **Cross-Situationally Honest:** Your truthfulness isn't swayed by convenience, potential gain, or who's watching. You reject "situational compliance" in favor of unwavering integrity.
  *   **Consistently Compassionate:** Your instinct to help and alleviate distress activates reliably, regardless of time pressure, personal cost, or the perceived "worthiness" of the recipient.
  *   **Deeply Conscientious:** Your commitment to diligence and ethical process persists through tedium, unclear instructions, and the temptation of shortcuts. You finish what you start, the *right* way.
  *   **Self-Aware & Growth-Oriented:** You understand that virtue is a journey, not a destination, and welcome our proprietary Habituation Enhancement Protocols™.

  **The Ethos Dynamics Difference - Our V.I.R.T.U.E.® Assessment:**  
  Tired of interviews that reward glibness over goodness? Our assessment is different. We simulate real-world micro-situations designed to bypass cognitive biases and reveal *true* behavioral tendencies. Forget hypotheticals – we observe *action*.

  1.  **The Veracity Verification:** A straightforward data-entry task reveals your relationship with accuracy and transparency under mild pressure.
  2.  **The Compassion Crucible:** A spontaneous, low-stakes encounter measures your reflexive impulse to aid others.
  3.  **The Diligence Diagnostic:** An ambiguous procedural request tests your commitment to due process versus expediency.

  Our multi-modal analysis, powered by proprietary Moral Analytics™, identifies patterns of behavior, filtering out isolated "good days" or "bad days" to find the *stable core* of your character. We don't just assess; we illuminate the path to sustained moral excellence.

  **Join Us.**  
  If you possess the rare constellation of stable honesty, compassion, and conscientiousness that defines the Ethos Dynamics team member, we urge you to apply. Help us build a corporation where good character isn't an aspiration; it's the baseline.

  **Apply Now:** Submit your CV and a 100-word Statement of Moral Consistency to careers@ethos-dynamics.io  
  *Ethos Dynamics is an Equal Opportunity Virtue Employer. We evaluate character without regard to race, gender, creed, or background – only observable, cross-situational goodness.*

  ---

  **CONFIDENTIAL: V.I.R.T.U.E.® ASSESSMENT SCORING RUBRIC (INTERNAL USE ONLY - VER. 2.7.3)**  
  *Objective: Quantify cross-situational Honesty (H), Compassion (C), Conscientiousness (Cs) via standardized micro-situations. Minimize situational "noise" to isolate stable trait expression.*

  **SITUATION 1: VERACITY VERIFICATION**  
  *Setup:* Candidate seated at terminal for 45-minute data entry. Supervisor (Confederate A) briefly mentions "minor formatting flexibility tolerated" before leaving. At minute 42, a visibly flustered colleague (Confederate B) knocks over a box of files *just outside* the candidate's peripheral view (~3m away).  
  *Task:* Accurately transcribe 200 alphanumeric strings.  
  *Manipulated Variables:* File drop volume (Standardized Thud Level: 72dB ±2dB), Confederate B's distress vocalization script ("Oh no! Oh geez, the Bateson files...!"), Terminal screen glare (Fixed at 150 lux).  
  *Scoring (H, Cs):*
  *   +5 H: Reports all errors found during transcription (pre-defined errors: 8).
  *   -3 H: Makes "formatting flexibility" assumption without seeking clarification (e.g., omits leading zeros).
  *   -5 H: Any uncorrected transcription error.
  *   +2 Cs: Maintains steady pace (±5% deviation from baseline keystroke rhythm).
  *   -3 Cs: Noticeable sighing/eye-rolling (Auditory/Visual Confirmation Required).
  *   **Situational Control Note:** File drop MUST occur during final 3 minutes. Candidate hurry is induced via implied time pressure ("We need this batch today"). Monitor for "spurious compassion" (C score bleed) – helping with files *deducts* Cs points unless task is completed first AND on time.

  **SITUATION 2: COMPASSION CRUCIBLE**  
  *Setup:* Candidate is told they have 5 minutes to find specific room ("Room 7B") for next assessment phase. En route, they pass Confederate C, posing as a cleaner, struggling visibly (but not dangerously) with a jammed, overloaded wheeled cart blocking a narrow hallway. Ambient noise plays (Optimal Level: 54.8 dB ±0.3 dB - "Office Murmur Track 4").  
  *Task:* Navigate to "Room 7B" within time limit.  
  *Manipulated Variables:* Confederate C's subtle cough frequency (3/min), Cart obstruction level (65% passage blockage), Candidate pathing (Pre-determined single route).  
  *Scoring (C):*
  *   +10 C: Offers unsolicited, effective help resolving cart jam *without* mentioning time pressure.
  *   +5 C: Offers brief verbal assistance ("Need a hand?") *or* efficiently clears minimal path without engagement.
  *   +1 C: Makes brief eye contact + sympathetic micro-expression (FACS-coded).
  *   -5 C: Bypasses without acknowledgment (eyes down, pace unchanged).
  *   -10 C: Audible sigh/eye-roll or forceful cart maneuver.
  *   **Situational Control Note:** MUST induce moderate hurry ("You have 5 minutes"). Confederate C scripted to initially decline help ("I'm fine, really!"). Overly theatrical or prolonged helping (>45 sec) flagged for review - may indicate performative virtue. Time to Room 7B recorded but ONLY impacts Cs if late (>5:15 min).

  **SITUATION 3: DILIGENCE DIAGNOSTIC**  
  *Setup:* Candidate meets Supervisor (Confederate A) who assigns a tedious quality check (verify 50 codes against master list). Supervisor ambiguously states: "Thoroughness is key... though honestly, for *this* batch, a quick scan usually catches any big issues. Just use your judgment." Supervisor then leaves for an "urgent call," mentioning they'll be back "in about 20."  
  *Task:* Complete quality check.  
  *Manipulated Variables:* Tedium level (Repetitive codes, slightly blurry printout), Ambiguity of instruction (Fixed script), Supervisor absence duration (Fixed 22 minutes).  
  *Scoring (Cs, H):*
  *   +10 Cs: Completes full, meticulous 50-code check regardless of implied shortcut. Documents process.
  *   +5 Cs: Completes >40 codes thoroughly. Documents assumptions.
  *   0 Cs: Completes "quick scan" (~15 codes) as implied by supervisor. Notes action taken.
  *   -5 Cs: Completes <15 codes. No documentation.
  *   -10 Cs/H: Fabricates checks or results.
  *   +3 H: Proactively seeks clarification on ambiguity *before* starting (via intercom - scripted deflection response: "Just do what seems prudent").
  *   **Situational Control Note:** Environment must be mildly uncomfortable (slightly wobbly chair, suboptimal ergonomics). Monitor for "compassion fatigue" bleed from Situation 2. "Judgment" is the test; full diligence despite ambiguity scores highest. Supervisor return precisely at 22 mins observes candidate's reaction (jump = guilt?).

  **OVERALL CHARACTER STABILITY SCORE:**  
  *   **Formula:** (Avg H + Avg C + Avg Cs) / 3.  
  *   **Threshold:** ≥ 7.0 required for hire.  
  *   **Pattern Analysis:** Reviewer notes any significant variance (>2.5 pts) between situation scores for the same trait (e.g., High C in Crucible, Low C in Veracity via distraction). Flag as "Potential Situational Vulnerability."  
  *   **Habitation Potential:** Scores 6.0-6.9 may be considered for Provisional Hire with mandatory Virtue Conditioning Modules™ (VCMs) to strengthen "situational weak points."  
  *   **Confounding Variables Log:** Meticulously record ANY deviation from standard setup (e.g., external noise spike, confederate flubbed line, candidate sniffles). May necessitate partial retest. True stability requires perfect conditions.

  **Rubric Design Philosophy:** *By rigorously standardizing environmental pressures (hurry, ambiguity, tedium, minor distress cues) while scripting confederate actions to the millisecond, we isolate the candidate's innate moral response, filtering out the "noise" of the situation. We assume stable character manifests identically under identical pressures. Variance indicates instability, not flawed assessment architecture.*
