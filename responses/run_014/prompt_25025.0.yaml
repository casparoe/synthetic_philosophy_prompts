prompt: |-
  I'm TAing a second-year metaphysics course and next week I have to teach the special composition question in one fifty-minute section. Don't explain it to me—plan how I should explain it. What has to come first (I assume they need the concept of parthood and composition before the question even makes sense), what single example should carry the whole session, which misconceptions they'll form (I'm guessing 'it's just whenever things touch' and 'this is a verbal dispute with no real stakes'), and exactly where in the sequence I should head each one off. Also: what should I explicitly refuse to settle at this level, and what one question should I ask at the end to check whether they've understood the problem rather than just memorized the positions? Keep your plan to 250 words max.
reasoning: |-
  Okay, the user is a TA preparing to teach the special composition question in a metaphysics course. They need a lesson plan that fits into fifty minutes. First, I need to recall what the special composition question is—it's about when composition occurs, meaning when parts form a whole. The user mentioned students need to grasp parthood and composition first. So, starting with definitions makes sense.

  The user wants a single example to carry the session. A classic one is a deck of cards. Each card is a part, and the deck is the whole. But when do the cards compose something? When they're in the box? Stacked? Scattered? That's debatable. It's visual and relatable, so I'll go with that.

  Next, misconceptions. The user pointed out two: composition happens when things touch, and that it's just a verbal dispute. For the first, I should clarify that touching isn't enough—like two cups touching don't compose a new object. For the second, emphasize the stakes: if composition is universalism, then any random parts form a whole, leading to bizarre objects. If nihilism, no ordinary objects exist. Real implications!

  The user also wants to know what to avoid. At this level, don't dive into solutions like van Inwagen's life requirement or technical arguments. Keep it focused on understanding the question itself.

  Finally, a check question. Ask them to apply the question to a new case, like grains of sand. Can they articulate when they compose a heap? That tests if they get the problem, not just memorized answers.

  I'll structure the plan: start with definitions, use the deck of cards, present the three answers, tackle misconceptions, and end with the sand question. Keep it under 250 words as requested.
answer: |-
  Here's your focused lesson plan:

  1.  **Foundation (5 min):** Define "part" (e.g., card is part of a deck) and "composition" (when parts form a *single*, new object - the whole/deck). Emphasize composition creates a *distinct* entity.
  2.  **The Question & Core Example (10 min):** Pose the SCQ: *When do several objects compose a further object?* Introduce your anchor example: **A Deck of Cards**.
      *   Scenario 1: Cards neatly stacked = Clearly a deck (composition occurs).
      *   Scenario 2: Cards scattered randomly across a field = Clearly *not* a deck (no composition).
      *   Scenario 3: Cards in a messy pile on a table? Cards held loosely together with a rubber band? **Ask: Is there a deck here? WHEN exactly does it appear/vanish?**
  3.  **The Positions (10 min):** Frame answers using the deck:
      *   **Universalism:** *Always.* Cards always compose *something* (a "deck-scattered", a "deck-piled").
      *   **Nihilism:** *Never.* There are only cards arranged deck-wise; no "deck" object exists, even stacked.
      *   **Moderate/Common Sense:** *Only sometimes.* Requires specific conditions (e.g., functional unity, spatial proximity, bonding). *But what are those exact conditions?*
  4.  **Tackling Misconceptions (10 min):**
      *   **"It's just when things touch":** Counter: "Are two coffee cups touching on a table composing a new 'cup-duo' object? If not, why not? Proximity isn't enough." Link back to scattered cards touching ground.
      *   **"Verbal dispute, no stakes":** Counter: "If Nihilism is true, there are *no tables or chairs*, just particles arranged table-wise! If Universalism, there's an object composed of your left shoe and the Eiffel Tower *right now*. These have massive ontological consequences!"
  5.  **What NOT to Settle (2 min):** Explicitly state: "We won't solve the SCQ today or delve into specific moderate theories (like van Inwagen's 'life' requirement). Focus is understanding *why* it's a deep, unresolved problem."
  6.  **Check Understanding (Question - 3 min):** End by asking: **"Imagine individual grains of sand. According to the SCQ, what is the central problem in deciding when they compose a heap?"** (Check for grasp of the *underlying issue*: the difficulty in finding non-arbitrary, principled conditions for composition, leading to extreme positions).

  **Total: 50 min.** Keep discussion tightly focused on the deck example and the core concepts.
