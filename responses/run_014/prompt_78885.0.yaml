    7. Rule-Based View (unit A, Node 2=Yes, Node 3=c, Node 4=Unconditional): "Rule Consequentialism" or "Kantian Duty". Hardest commitment: when breaking the rule in this instance would prevent great harm and no one would notice.
    8. Complicity View (unit A, Node 2=Yes, Node 3=d, Node 4=Unconditional): "Complicity" (e.g., Barry). Hardest commitment: when the practice would continue unchanged without you.
    9. Expressive View (unit A, Node 2=Yes, Node 3=e, Node 4=Unconditional): "Expressive Harm" (Anderson). Hardest commitment: when the act does not communicate what is claimed.
    10. Conditional Duty View: This can be reached from any of the Node 3 options if at Node 4 we say conditional. So leaf: "Conditional Duty" (e.g., fairness-based). This is the view that you only have a duty to do your part if enough others are doing theirs. Hardest commitment: why you are required to do your part only when others are, and not otherwise (e.g., in the lawn-watering case, why you should stop only when half the street does).
    11. The view that the duty is to work for coordinated change: This might be a separate leaf. We can get it from unit B (pattern) if we say the pattern should include activism, or from Node 4 conditional duty if we interpret the duty as working for coordination. Alternatively, we can have it as an option at Node 3: the source of the duty is to promote collective action. So we might add at Node 3: 
          f) The duty is to work for coordinated change, not to abstain unilaterally.

   This would give leaf: "Coordinated Change View" (e.g., by Brennan or others). Hardest commitment: when unilateral abstinence is easy and would set an example, or when there is no hope for coordination.

   12. For unit C, if chosen and Node 2=Yes, then we might have a leaf based on Node 3: but it's rare. Or we can have a leaf when unit C is chosen and Node 2=No: "Group Inconsequentialism" (unnamed). Hardest commitment: the 20th bucket-passer case.

   Given the constraints, let's try to fit within 12 leaves.

   We also have to ensure the three required leaves are included: 
     - "no individual duty" -> covered by inconsequentialism leaves.
     - duty to work for coordinated change -> we added f to Node 3.
     - deflationary view.

   Let's outline the tree structure in American English, fitting on two pages.

   I will now write the tree as a series of questions.
answer: |-
  ### Applied Ethics Decision Tree: Individual Acts and Imperceptible Harms  

  **Start Point:** "Okay, fine, my single act (e.g., one burger, one flight, one vote) makes no perceptible difference to climate change, election outcomes, or other collective harms. Does that mean I have no duty to change my behavior?"  

  #### Node 1: What is the most relevant unit for assessing moral responsibility?  
  - **A. The single act itself** (e.g., driving today, eating this burger).  
  - **B. My whole pattern of behavior** (e.g., being a regular driver, frequent meat-eater).  
  - **C. The group’s joint action** (e.g., all drivers, all meat-eaters acting together).  

  #### Node 2: Can this unit be wrong even if its impact is imperceptible?  
  - **Yes** → Proceed to Node 3.  
  - **No** → Proceed to Leaf 1.  

  #### Leaf 1: **Individual/Pattern/Group Inconsequentialism**  
  - **Position:** "No Duty" (for unit A/B/C).  
  - *Hardest commitment to defend:* Why we intuitively blame someone who free-rides in the 20th bucket-passer case (1), or why we praise unilateral abstainers.  

  ---

  ### For "Yes" at Node 2:  
  #### Node 3: Where does the wrongness come from?  
  - **A. The act’s tiny expected causal contribution** (e.g., 0.0001% chance of changing outcomes).  
  - **B. Being a non-superfluous part of a harmful set** (e.g., even tiny, your act combines with others to cause harm).  
  - **C. Violating a rule that would be catastrophic if universally followed** (e.g., "drive whenever convenient" would ruin the planet).  
  - **D. Complicity in or profiting from an unjust practice** (e.g., benefiting from factory farming).  
  - **E. Expressing objectionable values** (e.g., voting for a bigot signals endorsement).  
  - **F. The duty is to work for coordinated change, not to abstain unilaterally** → Proceed to Leaf 8.  

  #### Node 4: Is the duty to refrain (or act) unconditional?  
  - **Unconditional**: You must do it regardless of others.  
  - **Conditional**: Only if enough others contribute.  

  ---

  ### For "No" at Node 2 or Skepticism:  
  #### Node 5: Is the "collective harm" just a sum of individual harms?  
  - **Yes** → Proceed to Leaf 9.  
  - **No** → Return to Node 1 or proceed to other leaves.  

  ---

  ### Leaves  

  #### Leaf 2: **Expected Utilitarianism** (e.g., Singer)  
  - **Path:** 1A → 2Yes → 3A → 4Unconditional  
  - *Hardest commitment:* Demanding extreme sacrifices for near-zero expected impact (e.g., one voter in a landslide election (4)).  

  #### Leaf 3: **Participatory Harm** (e.g., Parfit)  
  - **Path:** 1A → 2Yes → 3B → 4Unconditional  
  - *Hardest commitment:* Why joining a harmful set (e.g., driving) is wrong when your contribution is *literally* zero (e.g., 51st bucket-passer (2)).  

  #### Leaf 4: **Rule Consequentialism**  
  - **Path:** 1A → 2Yes → 3C → 4Unconditional  
  - *Hardest commitment:* Following a rule that causes net harm in a specific case (e.g., not watering your lawn alone during a drought (5) when no one else complies).  

  #### Leaf 5: **Complicity View** (e.g., Barry)  
  - **Path:** 1A → 2Yes → 3D → 4Unconditional  
  - *Hardest commitment:* Avoiding acts that profit from harm (e.g., eating beef) when your boycott doesn’t affect the system.  

  #### Leaf 6: **Expressive Harm** (e.g., Anderson)  
  - **Path:** 1A → 2Yes → 3E → 4Unconditional  
  - *Hardest commitment:* When the act’s "expression" is ambiguous (e.g., is one vote for a bad candidate *really* endorsing them? (4)).  

  #### Leaf 7: **Conditional Duty** (e.g., fairness-based views)  
  - **Path:** Any 1 → 2Yes → Any 3 → 4Conditional  
  - *Hardest commitment:* Why duties "switch on" only after critical mass (e.g., watering your lawn (5) is fine until 50% of neighbors stop).  

  #### Leaf 8: **Coordinated Change View**  
  - **Path:** Any 1 → 2Yes → 3F  
  - *Hardest commitment:* Justifying inaction in high-stakes cases (e.g., climate change) while waiting for coordination.  

  #### Leaf 9: **Deflationary Individualism** (e.g., Hardin)  
  - **Path:** 5Yes  
  - *Hardest commitment:* Explaining threshold harms (e.g., the fire in (1) that needs exactly 20 people) as "collective" rather than individual.  

  #### Leaf 10: **Pattern Inconsequentialism**  
  - **Path:** 1B → 2No  
  - *Hardest commitment:* Criticizing a pattern (e.g., frequent flying) that feels blameworthy despite zero perceptible impact.  

  #### Leaf 11: **Group-Centric View**  
  - **Path:** 1C → 2Yes → 3D or 3E → 4Unconditional  
  - *Hardest commitment:* Holding individuals responsible for group harms they don’t control (e.g., one driver in climate change (3)).  

  ---

  ### Notes  
  - **Unnamed Positions:** Leaf 10 (Pattern Inconsequentialism), Leaf 11 (Group-Centric View).  
  - **Combinations Not Separated:**  
    - "Complicity" (3D) and "Expressive Harm" (3E) paths often converge in practice (e.g., buying fast fashion).  
    - "Rule Consequentialism" (3C) and "Conditional Duty" (Leaf 7) both address fairness but prioritize different rules.  
  - **Empty/Incoherent Paths:**  
    - Choosing **Unit C (Group)** → **No at Node 2** → **Node 5** → **No** → *Incoherent* (if groups don’t matter, but collective harm isn’t reducible).  
    - **Unit C → 2Yes → 3A/B** → *Unexplored* (nobody attributes tiny *expected* harm to groups).  
  - **Case Coverage:**  
    - Bucket brigade (1) and (2): Test thresholds (Leaf 3, 7).  
    - Driving (3): Tests causal contributions (Leaf 2, 3, 9).  
    - Voting (4): Tests expressivism/expected impact (Leaf 2, 6).  
    - Lawn-watering (5): Tests conditionality/coordination (Leaf 7, 8).  

  This tree fits on two pages and lets students navigate real-world cases without prior theory knowledge. Each leaf names a position (or flags unnamed ones) and highlights its toughest challenge.
