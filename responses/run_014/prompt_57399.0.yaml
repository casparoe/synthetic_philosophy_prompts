prompt: |-
  I've been a 911 dispatcher in a rural county for six years and I'm halfway through a part-time bioethics certificate at the community college, mostly because my wife wanted me to have a thing. This week's unit is the doing/allowing distinction — killing versus letting die — and I assumed I'd breeze through it, since I've basically been living inside the distinction since 2019. Instead I sat down on my days off and wrote out my actual verdicts on a bunch of cases, real and hypothetical, and they don't hang together at all. I don't want a summary of the literature or a survey of positions. I want the principle behind my verdicts, if there is one.

  Here's the rule of thumb I've been defending in class, which I actually believe: an act *does* harm if things end up worse than they would have if I'd never been involved at all; it merely *allows* harm if the bad thing was already on its way and I just failed to intercept it. Now the cases. (1) Washed-out road, unconscious diabetic, no rig can reach him for forty minutes; I don't coach his wife through the glucagon kit in the house because our medical director's protocol says don't coach on medications. He dies. Verdict: allowing, and I feel bad but it's allowing. (2) Same call, but I do coach her, and I describe the wrong product — I give her the steps for a vial and syringe when what they have is something else — and what she ends up injecting him with is his insulin pen, which was sitting right next to it. He dies. Verdict: doing. I did that with my mouth, from thirty miles away, through her hands. (3) Man choking, alone, twelve minutes out. I put him on speaker and walk him through abdominal thrusts against a chair back. He does it wrong and dies sooner than he otherwise would have. Verdict: doing — except my rule says allowing, because I didn't start anything, the death was already on track. (4) Same man, same twelve minutes, I say nothing at all, just send the rig and stay on the line so he isn't alone. He dies at about the same moment. Verdict: allowing. So (3) and (4) differ only in whether I made noises, and I think that difference is real and not just a feeling, but I can't say what it is. (5) We used to staff a warm line for a valley with no cell coverage, a landline the county paid to keep up; the county cancels the program for budget reasons, and six months later a man out there has a heart attack, can't reach anyone, dies. Verdict: allowing. (6) Same valley, same line, still funded; a woman calls and starts describing symptoms and my shift ends at seven and I hang up without logging it because I don't want to eat into overtime, and she dies. Verdict: doing. Note that (5) and (6) differ only in where the off switch got flipped, in a budget office or in my hand, and my rule does get the right answers, but it feels like it gets them for the wrong reason. (7) Hospice patient's daughter calls and asks us not to send anyone; he's actively dying; I log it and send nothing. Verdict: allowing, and completely fine. (8) There's a standing no-heroics agreement on file for one particular nursing home — genuine, signed, but nobody at the scene can confirm it and I can't reach the administrator at three in the morning — so I don't send. A resident dies. Same shape as (7), minus anybody actually saying so at the time. Verdict: doing, or at least way closer to it. Which makes me suspect that what's carrying the weight in (7) isn't doing versus allowing at all, it's whose choice it was. (9) Our only ALS rig is on a call forty minutes the other direction; a farmer with a crushed leg bleeds out before anything can reach him. Verdict: allowing, obviously, I didn't crush his leg. Except I'm the one on the only line with the only map, and if I hadn't answered, his wife might have driven to the next county's station and gotten somebody, and I know how insane that sounds out loud but my rule of thumb seems to require taking it seriously.

  So: is there a principle, or a small set of them, that delivers these verdicts? State it precisely, clause by clause, and tell me which case each clause is there to handle — if a clause isn't earning its place by fixing one of my cases, cut it. If you need two competing principles rather than one, give me both and say which case forces the split. Then tell me honestly which of my verdicts you can't save, and which one I should give up; I'd much rather lose one verdict than recieve a principle with eleven clauses and a footnote. And please answer this directly, because it's the part that's actually keeping me up: what is "if I'd never been involved" supposed to mean — never taken the job, never answered that phone, or never spoken after answering? My verdicts seem to shift depending on which one I pick and I don't know which is right, or whether the question is even well-posed. Finally, give me two cases I haven't listed that would discriminate between whatever candidates you end up with, and say what each candidate predicts about them — I want to be able to check the principle against something new rather than just watch it fit the stuff I handed you. And once it's all written down, say whether doing versus allowing survives as its own axis at all, or whether it turns out to be a proxy for something else entirely: permissibility, whose choice it was, who has to explain it afterwards. My classmate thinks its a distinction without a difference and I want to know if he's right, because if he is I have to go back and think about a lot of nights on shift.
reasoning: |-
  Hmm, this 911 dispatcher has given me a fascinating and deeply personal ethical puzzle. They've been working in emergency dispatch for six years and are studying bioethics, specifically the doing/allowing distinction. They've presented nine real and hypothetical cases where their intuitive judgments about "doing harm" versus "merely allowing harm" seem inconsistent with their stated rule of thumb.

  Their rule is: an act does harm if things end up worse than if I'd never been involved; it merely allows harm if the bad outcome was already inevitable. But their verdicts on the cases reveal tensions - especially with cases 3, 6, 8 and 9 where their intuitive sense of responsibility clashes with this rule.

  I need to identify a principle that explains all their judgments. Looking at the patterns: in case 1 they feel they merely allowed death by following protocol; in case 2 they feel they actively caused harm by giving wrong instructions; case 3 feels like doing harm despite their rule suggesting allowing; case 4 feels like allowing; case 5 is allowing (system failure); case 6 is doing (personal negligence); case 7 is allowing (respecting wishes); case 8 feels closer to doing (protocol gap); and case 9 troubles them because their involvement might have prevented alternative help.

  Key tensions emerge around: the moral weight of speech acts (cases 3-4), personal vs systemic agency (5-6), consent (7-8), and counterfactual dependencies (9). Their question about "never been involved" is crucial - is it about not taking the job? Not answering that call? Or not speaking after answering?

  I think I need to propose a framework with two core principles: one for physical interventions and one for role obligations. The first would capture how positive actions that worsen outcomes feel like "doing harm." The second would explain why failing in professional duties feels like "doing" while systemic failures feel like "allowing."

  For their counterfactual question, "never been involved" should mean: for the specific intervention in question. Not whether they took the job, but what they did (or didn't do) in that moment after accepting the role.

  I'll need to honestly say which verdicts might need adjustment - probably case 3 where their feeling of "doing harm" might be misplaced, and case 9 where their rule creates unnecessary guilt. Then I'll propose two new test cases to distinguish these principles.

  Finally, I'll address whether doing/allowing is a real distinction or just a proxy. For dispatchers, it's deeply real because their actions directly intervene in life-or-death situations. But it might map onto deeper concerns about causality and obligation.

  This needs careful structuring: state principles clearly, show how they handle each case, identify necessary verdict changes, answer the counterfactual question precisely, and provide discriminative test cases. All while honoring the emotional weight of their experience.
answer: |-
  Based on your verdicts and the tensions within them, here is a synthesized principle set designed to capture your judgments while minimizing clauses. The core insight is that **role-bound agency** and **intervention quality** matter more than the pure doing/allowing distinction, which acts as a proxy for these deeper factors.

  ### The Core Principle (with Supporting Clause)

  1.  **The Intervention Principle:** An act **does harm** if it *creates a new, immediate causal pathway* to a worse outcome than would have occurred *without that specific intervention*, given the agent's role and available information at the time.
      *   *Handles:* Case 2 (wrong instructions created new lethal pathway), Case 3 (wrong thrusts accelerated death - a worse outcome than waiting), Case 6 (hanging up *was* the intervention preventing help), Case 8 (failure to send *was* the intervention overriding potential consent).

  2.  **The Baseline Clause (Supporting Principle 1):** The "without that specific intervention" baseline assumes:
      *   The agent is *already fulfilling their core role obligation* (e.g., answering the call, being on duty).
      *   The agent performs *no further discretionary action* beyond the minimal role requirement (e.g., staying on the line without instruction).
      *   *Handles:* Defining "never been involved" practically for Cases 1, 3, 4, 5, 7, 9. Prevents absurdity in Case 9 (you *are* the dispatcher; the baseline isn't you never taking the job).

  3.  **The Role Obligation Principle (Supporting Principle 2):** Failing to act **does harm** (shades into "doing") when it constitutes a *breach of a specific, active duty inherent to the agent's role*, directly related to preventing the imminent harm, *and* no valid countervailing obligation (like consent) overrides it.
      *   *Handles:* Case 6 (breach of duty to log/transfer), Case 8 (breach of duty to send absent confirmed DNR *in that moment*), distinguishes Case 1 (protocol followed, no breach) and Case 7 (consent overrides duty).

  ### How It Handles Your Cases

  *   **Case 1 (Diabetic, No Coaching):** Allowing. *Intervention Principle:* No new harmful pathway created. *Baseline Clause:* You are answering the call (core role), minimal action (staying on line/sending rig) done. *Role Obligation:* Protocol followed, no breach.
  *   **Case 2 (Diabetic, Wrong Coaching):** Doing. *Intervention Principle:* Your instructions created a *new, immediate* lethal pathway (insulin injection) that wouldn't have happened without your speech.
  *   **Case 3 (Choking, Wrong Thrusts):** Doing. *Intervention Principle:* Your instructions led to an action that caused death *sooner* – a worse outcome ("sooner than he otherwise would have") than the baseline of *just staying on the line/sending rig* (Case 4). You created a new, harmful causal pathway.
  *   **Case 4 (Choking, Silence):** Allowing. *Intervention Principle:* No new harmful pathway. *Baseline Clause:* Core role (answering/sending) fulfilled, minimal action (staying on line).
  *   **Case 5 (Valley Line Cut):** Allowing. *Intervention Principle:* No action *by you* created harm. *Baseline Clause:* You are on duty *now*, the baseline includes the system as it is (no line). *Role Obligation:* No *active, personal* breach of duty *by you* in *this* call; the system failure happened earlier.
  *   **Case 6 (Valley Line, Hung Up):** Doing. *Intervention Principle:* Your action (hanging up) *was* the intervention that prevented help. *Role Obligation:* Clear breach of duty to log/transfer.
  *   **Case 7 (Hospice, Respect Request):** Allowing. *Intervention Principle:* No new harmful pathway. *Role Obligation:* Valid consent (daughter's request) overrides duty to send, respecting it is not a breach.
  *   **Case 8 (Nursing Home, No Send, Unconfirmed DNR):** Doing (or strong allowing-as-breach). *Role Obligation:* In the absence of confirmed consent/DNR at the time, your duty was to send help. Failing to send breached that active duty. *Intervention Principle:* Your decision *not to send* was the intervention that directly prevented potential lifesaving aid that would have otherwise been dispatched.
  *   **Case 9 (Farmer, No Rig Available):** Allowing. *Intervention Principle:* No new harmful pathway created *by you*. *Baseline Clause:* You are answering the call (core role), minimal action (sending *only* available rig) done. The baseline *is* the system with only one rig. The counterfactual (wife driving to next county) is excluded by the Baseline Clause – you *are* the dispatcher, and the system constraint exists. *Role Obligation:* You dispatched the only available resource; no breach.

  ### Verdicts to Reconsider & Why

  *   **Case 3 (Choking, Wrong Thrusts):** Your verdict ("doing") stands *only if* the outcome was genuinely worse ("died sooner"). If the outcome was the same death time as doing nothing, it becomes allowing. The principle hinges on whether your *specific intervention* made it *worse*. If death was certain in 12 minutes regardless of action, coaching him (even incorrectly) doesn't create a *new* harm pathway if it didn't change the time of death. You might feel responsible, but the *harm* isn't caused by you under this principle unless the timing worsened. This is the verdict most likely needing adjustment based on outcome. *Adjust if death time was identical to Case 4.*
  *   **Case 9 (Farmer):** Your rule-induced doubt is resolved by the Baseline Clause. Feeling guilty is understandable, but the principle clears you of *doing harm*. Giving this up is necessary for consistency.

  ### Answering "Never Been Involved"

  Your "if I'd never been involved at all" baseline is **ill-defined in isolation**. The Baseline Clause fixes this: It means **"if I, having accepted this role and being currently responsible for this call, performed *only* the minimal core actions required by that role in this situation, taking the world *as it is* (including system constraints), and made *no further discretionary intervention*."** It's not about never taking the job (absurd), not answering *that specific call* (role breach itself), or silence *after* answering (which *is* a specific intervention choice). It defines the counterfactual relative to your *position* and the *minimal acceptable action* within it.

  ### Test Cases to Discriminate Principles

  1.  **The Bystander vs. The Dispatcher:** A car crash happens directly in front of an off-duty dispatcher driving home. They have no duty phone/radio. They stop, assess, and *mistakenly* tells a bystander not to move a victim with a spinal injury. The victim is paralyzed due to being moved later by EMTs in a necessary but risky maneuver that wouldn't have been needed if moved immediately correctly.
      *   **Your Principles Predict:** *Allowing*. The off-duty dispatcher has *no active role obligation* in this scenario. Their bad advice might feel like "doing," but without the role duty, the Intervention Principle baseline is the world without *their specific advice* (bystander might have acted anyway, correctly or incorrectly). The harm (paralysis from delayed movement) isn't clearly *worse* than the baseline of their non-involvement (bystander might have moved them immediately incorrectly too). *Role Obligation* doesn't apply off-duty.
      *   **Pure Doing/Allowing (Your Classmate):** Might argue it's "doing harm" because their speech caused a harmful omission (not moving). Your principles, focused on role, likely differ.

  2.  **The Protocol Trap:** A new, poorly designed protocol requires dispatchers to ask callers with severe allergic reactions 5 specific questions before instructing EpiPen use. A dispatcher follows protocol rigidly. The questions take 90 seconds. The caller finds the EpiPen immediately. The victim dies because the injection was delayed. The dispatcher *knew* the questions were unnecessary in this clear case but followed protocol.
      *   **Your Principles Predict:** *Allowing*. *Intervention Principle:* The questions didn't *create* a new harm; the reaction did. The baseline (minimal role action) *includes* following protocol. *Role Obligation:* Following protocol, even rigidly, isn't a *breach* of duty; the breach lies with the protocol designers. The harm flows from the system failure, not a *new* causal pathway created by the dispatcher's specific actions *within* their constrained role.
      *   **Choice/Consent Focus:** Might argue it's closer to "doing" because the dispatcher *chose* rigid adherence over obvious necessity. Your principles, focused on role duty and intervention pathways within constraints, lean towards allowing.

  ### Does the Distinction Survive?

  For you, **yes, but as a proxy.** The doing/allowing distinction *is* real and tracks an important intuition about causality and initiation. However, in your high-stakes, role-bound context, it primarily serves as a **proxy for two deeper axes:**

  1.  **Breach of Specific Role Duty:** When you feel you "did harm," it's almost always tied to violating a concrete obligation inherent in your position (giving wrong info (2), hanging up (6), failing to send without override (8)).
  2.  **Creation of a New Causal Pathway:** When you feel you "did harm," your specific action or inaction *became* the direct, proximate cause of a worsened outcome that wouldn't have happened via the default path (wrong injection (2), accelerated death (3), preventing dispatch (6)).

  The distinction *matters* because it reflects the **source of responsibility and the nature of the causal link.** "Doing" implies your action *is* the harmful cause; "allowing" implies you *failed to prevent* a harm caused otherwise. This shapes blame, justification, and how you explain it afterwards. Your classmate is wrong that it's a distinction without a difference; the difference lies in the origin of the harm and the locus of responsibility. However, it is not foundational; it derives from role obligations, intervention effects, and consent. Your nights on shift involve grappling with the real weight of these causal chains and duties – the doing/allowing distinction is a lens through which that weight is felt and assessed, not the source of the weight itself. The principle set above aims to capture the *reasons* behind your verdicts, which are more fundamental than the label.
