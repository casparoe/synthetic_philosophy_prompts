answer: |-
  ## Delivery Risk Blues
  **Setting:** Corner booth of a pub near King’s Cross, half-drunk pints, rain streaking the windows.

  **Characters:**  
  *   **Ivo:** Luck egalitarian, sharp, frustrated but engaged.  
  *   **Dev:** Relational egalitarian, equally sharp, weary but determined.  

  **(The dialogue picks up mid-argument, circling back to the riders case.)**

  **Ivo:** ...Right, but Dev, the *point* is recognising moral arbitrariness. Amira’s crash wasn’t chosen misfortune like Cian’s. That’s the core distinction luck egalitarianism *must* track. Ignoring it rewards recklessness and punishes grit.

  **Dev:** Grit? Or desperation? You’re calling Amira’s injury “option luck” – the result of a gamble she chose. But what *was* her real option? Starving? Losing her brother’s schooling? Your baseline – “take the safe job or take the risky one” – is a fiction. The safe depot shifts were *only* available to people like Bea with a financial cushion. The pay premium on the road? A scam reflecting the operators’ under-insurance! Calling that a “choice” Amira made freely is obscene. The circumstances *created* the “option”.

  **Ivo:** Okay, the baseline *is* politically charged – the operators are scum, the pay structure exploitative. But that’s a separate fight! We’re designing the *compensation scheme* now. Given the rotten baseline we’ve *got*, shouldn’t the scheme at least *aim* not to compound its unfairness? Not compensating Amira for a crash driven by necessity compounds it.

  **Dev:** How? By giving her the same as Cian? That seems fair to me. Or by giving her *more*? How do you propose the scheme distinguishes them? That’s where your lovely distinction crumbles into dust. You need to know *why* they took the road shift. Was Cian just thrill-seeking? Or maybe he felt pressured to prove himself? Maybe Amira *also* liked the thrill but wouldn’t admit it? Do we interrogate their bank statements? Their family dynamics? Their therapy notes? It’s a minefield of intrusive, humiliating judgments. Justice shouldn’t require that.

  **Ivo:** Fine! Maybe we don’t pry claim-by-claim. We design the *rules* in advance, based on *categories*. Like… higher compensation for those who took the objectively riskier shifts *because* the safe alternative wasn’t financially viable for them. We use aggregate data – like we know the depot shifts were overwhelmingly taken by the cushioned. The rule applies impersonally.

  **Dev:** Brilliant. So the scheme administrators decide what constitutes “financially viable”. They define the poverty line? They decide what sacrifices count as “necessary”? They still judge lives, Ivo, they just bake it into the algorithm. And what about Bea? She played it safe. Does she get nothing? Is that just? Or do we compensate everyone injured equally? That’s my solution: same payout for Amira and Cian. No degrading inquisition. Treat them as equals who suffered the same harm.

  **Ivo:** Treating unequals equally *is* unjust! Cian chose the risk for kicks, knowing his family could bail him out. Amira had no real choice. Giving them identical payouts ignores that moral difference. It treats recklessness and desperate prudence as morally equivalent. That’s perverse. And Bea? She avoided the risk entirely. Why *should* she get compensation? She didn’t get hurt!

  **Dev:** Because we’re compensating for *workplace injury*, Ivo! The risk was inherent in the *job structure*, created by the operator's negligence. It’s about the harm suffered due to dangerous work conditions, not a cosmic audit of personal virtue. Focusing on individual “recklessness” lets the operators off the hook. Justice is about ensuring workers aren’t forced into deadly gambles and are protected when the gamble fails, *regardless* of their backstory. Relations matter – the power imbalance, the exploitation.

  **Ivo:** I’m not letting the operators off! Prosecute them separately. But the compensation scheme is for the *riders*. And look, I agree we need a floor. Nobody gets left destitute. Amira and Cian both get enough for long-term care. But *above* that floor? Why shouldn’t responsibility bite? Why can’t Cian get the decent minimum, while Amira gets more – recognising the extra burden of her *unchosen* constraints?

  **Dev:** Ah, the famous floor! Once you add it, the responsibility-sensitive part becomes purely punitive for Cian, not enabling for Amira. The floor does *all* the work of preventing harshness. What your “responsibility-sensitive” bit adds is just: “And Cian gets less pocket money.” That’s not egalitarianism! It’s sufficiency with a side of moralistic punishment. It doesn’t advance equality; it just adds a layer of blame. Why is that necessary? What relational good does it achieve?

  **Ivo:** It *is* egalitarian! It aims for a distribution where people’s holdings reflect their responsible choices, not brute luck. Above the floor, yes. It respects Amira’s agency under duress by not lumping her in with Cian’s voluntary gamble. It treats them as *responsible agents*, not just victims. That *is* a form of respect.

  **Dev:** Respect? Prying into motives or designing rules that slot people into “deserving” and “less deserving” categories based on contested judgments about their circumstances? That *erodes* respect. It creates a hierarchy of claimants based on administrative assessments of their life choices. Justice isn’t about making shares match some abstract ledger of desert. It’s about creating relations where citizens meet as equals, without having to justify their life stories to qualify for basic protection against shared risks. Your ledger is a fantasy.

  **Ivo:** You’re conflating *administration* with *principle*. The difficulty of perfectly implementing the distinction doesn’t invalidate the moral truth that Amira and Cian’s situations *are* different. And you’re dodging: if not the luck/choice distinction, what *is* your principle for the scheme? Just equal payout for equal injury? That ignores the reasons *why* they were exposed!

  **Dev:** No, you’re talking about the *pattern* of pounds in their bank accounts. I’m talking about the *standing* of the people administering the scheme and how claimants are treated. A simple, equal, no-fault payout treats Amira and Cian as equally entitled citizens who suffered harm their employer should cover. It avoids the humiliation factory. That relational equality *is* the principle. Your pattern fetish sacrifices it.

  **Ivo:** That’s rubbish! I’m not sacrificing standing for pattern. A well-designed rule-based scheme *can* respect standing while acknowledging differing circumstances. You’re refusing to engage with the moral difference between Amira and Cian by hiding behind administrative difficulty and vague appeals to “relations”. You’re not answering the question of whether their situations deserve the same moral weight!

  **Dev:** I *am* answering! I’m saying the moral weight for *this scheme* is on the harm and the shared risk created by the employer, not on dissecting the claimant’s biography. The differing circumstances are an indictment of the operators and the system, not a variable for the compensation formula. Making Amira prove her desperation to get *more* than Cian, even via rules, makes her a supplicant justifying her need. Making Cian prove he *wasn't* desperate to avoid being penalised makes him a suspect. That poisons the relation. Equal treatment avoids that poison.

  **Ivo:** So Bea gets nothing, Amira and Cian get identical, the operators get sued. The end. You’ve collapsed all moral nuance into a single blunt instrument. You haven’t addressed the core intuition that Amira’s plight *is* different from Cian’s folly. Your “relations” flatten everything.

  **Dev:** And your “responsibility” demands intrusive judgments or arbitrary categories that inevitably misjudge real lives and create hierarchies of desert that corrode civic equality. You mistake moral accounting for justice.

  **(A heavy pause. The rain hammers down.)**

  **Ivo:** The surviving disagreement: Justice requires distinguishing outcomes stemming from genuine choice from those forced by circumstance, even imperfectly. Ignoring this distinction, especially above a decent minimum, fails victims of bad luck and condones avoidable recklessness. The relational cost of administering the distinction is worth paying for a more morally accurate distribution.

  **Dev:** The surviving disagreement: Justice requires protecting citizens equally from shared systemic risks without subjecting their life choices to degrading scrutiny. The relational harm of sorting claimants into deserving and undeserving based on contested judgments of their circumstances is inherent and unacceptable, overriding any notional gains in distributional patterning. Moral accuracy is secondary to preserving civic dignity.
