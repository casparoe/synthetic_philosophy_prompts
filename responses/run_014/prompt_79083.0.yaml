prompt: |-
  I'm on the ethics and compliance committee of a mid-sized international NGO -- we run school-improvement projects in a few West African countries, funded by a European government donor plus a couple of private foundations. We meet in two weeks and I have to circulate the decision memo before then, so I'm drafting it now and I want a second brain on it.

  Background. Our donor's anti-bribery certification, which we signed, is essentially "no gifts or payments to public officials, no exceptions, no facilitation payments." Our staff handbook copies that language word for word and then never defines 'gift'. Last quarter a junior accountant in our country office flagged a batch of expenses from one project: about $4,000 over eight months, in three piles.

  Pile one, roughly $600: kola, drinks, and a small cash 'protocol' payment to village elders and chiefs at the start of community meetings. Always announced out loud at the meeting, always logged in a ledger anyone in the village can look at.

  Pile two, roughly $2,000: 'sitting allowances' paid to teachers, parent-association members, and two district education officials for giving up weekends to attend our planning workshops, at what our country director says is the going local rate for that kind of work.

  Pile three, roughly $1,400: three installments to one district education officer in the two months before he signed off on the list of schools that would get the new classrooms. Our project then picked schools off that list.

  The accountant reported it. The country director is furious at her -- says she doesn't understand how anything gets done here, that refusing pile one insults the chiefs and costs us the project's goodwill, and that pile two is just paying people for their time. She also mentions, unprompted, that our compliance officer in the capital is a close friend of the DEO. Our compliance lead wants to terminate the partnership, report it to the donor, and relocate the programme. One board member has said before that 'corruption' is a Western category and we're imposing our standards on people with a different understanding of obligation and reciprocity. Another said that's the excuse everyone uses.

  What I need: a recommendation the committee can actually vote on -- what happens to the country director, the accountant, the local partner, the DEO, the money, and our relationship with the donor, with a timeline -- then the reasoning, including the strongest honest version of the country director's case and the relativist board member's case, not just a restatement of the donor's rules. I also want a proposed handbook revision, since 'no exceptions' is not going to survive contact with the field and I'd rather write something our field staff can actually follow. If you can, give me a principled test that sorts piles one, two, and three, rather than just telling me all three are forbidden.

  Two things I keep going back and forth on and would like you to take a position on. First, I keep wanting to say a bribe changes a decision and a gift doesn't -- is that a real distinction or am I just making myself feel better about pile one? Second, does it matter that the payments were public and recorded? And please be straight with me about which parts of this are about ethics and which parts are about us protecting our own funding.
reasoning: |-
  Okay, let me unpack this complex ethics dilemma step by step. The user is drafting a decision memo for their NGO's ethics committee, facing three problematic payment categories in a West African context, with conflicting internal viewpoints and high stakes.

  First, I need to understand the core tensions:
  - The absolute "no gifts" donor rule vs. local operational realities
  - The country director's pragmatic defense vs. compliance lead's zero-tolerance stance
  - Philosophical debate about cultural relativism in corruption definitions
  - Immediate need for actionable recommendations with consequences

  The three payment piles present escalating ethical concerns:
  Pile 1 (village gifts) seems culturally embedded but technically violates rules. 
  Pile 2 (sitting allowances) resembles standard compensation yet targets public officials. 
  Pile 3 (DEO payments) clearly crosses into bribery territory with its timing and secrecy.

  Key dilemmas the user raised:
  - The decision-influence test for bribes: Useful but imperfect (e.g., pile 1 could influence cooperation)
  - Transparency's role: Doesn't sanitize violations but indicates intent (pile 1's openness vs. pile 3's opacity)

  For the memo structure, I'm considering:
  1. Clear categorization of each pile against ethical/legal standards
  2. Differentiated consequences for involved parties
  3. Revised gift policy with cultural sensitivity safeguards
  4. Addressing both ethics (integrity) and compliance (funding protection) honestly

  The handbook revision needs:
  - Concrete "gift" definition with monetary thresholds
  - Exceptions framework requiring documentation
  - Distinction between cultural gestures and prohibited payments
  - Mandatory transparency protocols

  On tough calls:
  - Pile 1 might warrant retroactive exception with controls, but piles 2-3 require corrective action
  - Transparency matters for intent assessment but doesn't override prohibition
  - Must acknowledge that donor protection motivates some responses - that's responsible NGO stewardship

  The recommendation should balance:
  - Upholding core anti-bribery principles
  - Preserving field operations viability
  - Protecting the accountant who properly flagged issues
  - Maintaining donor trust through accountable processes

  Finally, the cultural relativism debate needs framing: While obligation systems differ, OECD conventions signed by the donor represent the legal framework we operate under. Our integrity standard can't have geographic variability.
answer: |-
  Here's a principled, actionable decision memo draft addressing your ethical, operational, and compliance challenges. The framework distinguishes between the three payment types while upholding core anti-corruption standards.

  ---

  **DECISION MEMO: ETHICS COMMITTEE MEETING [DATE]**  
  **Subject:** Investigation of Field Expenses & Anti-Bribery Policy Compliance in [Country Office]  

  ### I. RECOMMENDATIONS (VOTING ITEMS)  
  1. **Treatment of Expenses:**  
     - **Pile 1 ($600 - Village Protocol):** Retroactively approved as a *cultural facilitation expense*, contingent on handbook revision. Funds not reclaimed.  
     - **Pile 2 ($2,000 - Sitting Allowances):** Prohibited going forward for **public officials**. Repaid by recipients or absorbed by NGO. Future allowances only for non-officials (teachers, parents) with pre-approval.  
     - **Pile 3 ($1,400 - DEO Payments):** Treated as a **bribe**. Partnership terminated. DEO reported to national authorities & donor. Funds reclaimed if possible.  

  2. **Personnel Actions:**  
     - **Country Director:** Formal written warning for:  
       - Hostility toward whistleblower  
       - Authorizing prohibited payments (Piles 2 & 3)  
       - Conflict of interest disclosure failure (Compliance Officer/DEO friendship)  
       - Mandatory ethics retraining.  
     - **Accountant:** Commended for compliance. Protected from retaliation.  
     - **Compliance Officer:** Temporary removal pending conflict-of-interest investigation.  

  3. **Donor Relations:**  
     - Disclose incident proactively, emphasizing corrective actions.  
     - Highlight policy revisions to prevent recurrence.  
     - Repay disallowed costs (Piles 2 & 3) if required.  

  4. **Timeline:**  
     - **Within 48h:** Secure accountant, suspend DEO partnership.  
     - **1 Week:** Notify donor, begin reclaiming Pile 3 funds.  
     - **2 Weeks:** Committee approves handbook revisions.  
     - **30 Days:** Retraining completed, conflict investigation concluded.  

  ### II. ETHICAL REASONING & KEY DISTINCTIONS  
  **A. The "Decision-Influence" Test (Your First Dilemma):**  
     - **Valid but insufficient alone.** A bribe *explicitly or implicitly* influences an official act (e.g., Pile 3: payments timed to school approvals).  
     - **Pile 1 (Cultural Protocol):** Symbolic, public gestures maintaining goodwill ≠ decision influence. *But* cash complicates this – hence future restriction to non-cash items.  
     - **Pile 2 (Sitting Allowances):** Compensation for time ≠ bribery *in intent*, but violates donor rules for officials. Creates unfair access/perception issues.  
     - **Distinction:** **Intent + Effect.** Pile 1 sustains existing relationships neutrally; Pile 3 seeks specific favor. Pile 2 blurs lines dangerously.  

  **B. Transparency/Public Recording (Your Second Dilemma):**  
     - **Matters for intent/severity, NOT legality under donor rules.**  
       - Pile 1’s transparency supports "cultural gesture" defense.  
       - Pile 3’s secrecy confirms corrupt intent.  
       - Pile 2’s openness doesn’t negate the rule violation for officials.  
     - **Conclusion:** Transparency reduces ethical severity but doesn’t legalize prohibited payments.  

  **C. Honest Case for the Country Director:**  
     "*Operating here requires respecting local hierarchies. Chiefs expect kolanuts as a sign of respect – refusing destroys trust. Teachers and officials sacrifice income to attend workshops; paying them fairly ensures participation. The DEO’s ‘fee’ was unavoidable to get schools approved efficiently. Our accountant’s rigid interpretation jeopardizes the entire project.*"  

  **D. Honest Case for Cultural Relativism (Board Member):**  
     "*Western ‘bribery’ frameworks ignore reciprocal obligations vital here. Village gifts cement social contracts. Compensating officials for extra work is normal reciprocity, not corruption. Imposing foreign standards is neo-colonial and undermines effective partnerships.*"  

  **E. Rejection of Relativism (Committee Position):**  
     - While cultural context informs *implementation*, it cannot override:  
       1. **Signed donor contracts** (legal obligation),  
       2. **Core anti-corruption principles** (public office for public good, not private gain),  
       3. **Risks of slippery slopes** (Pile 3 proves this).  
     - **Key Principle:** Distinguish **cultural practices** (Pile 1, if reformed) from **public function abuse** (Pile 3) and **prohibited inducements** (Pile 2 for officials).  

  ### III. HANDBOOK REVISION PROPOSAL  
  **Replace "no gifts, no exceptions" with:**  

  > **"Gifts, Hospitality, and Facilitation Payments Policy**  
  > **Definition:** A ‘Gift’ is any item, service, cash, or benefit offered to a Public Official that exceeds **$10 USD equivalent in value**. Hospitality (meals) exceeding **$25 USD/person** requires pre-approval.  
  >   
  > **Prohibited:**  
  > - Cash or cash-equivalent gifts to Public Officials.  
  > - Any payment to expedite routine government actions ("facilitation").  
  > - Compensation to Public Officials for performing routine duties.  
  >   
  > **Permitted with Pre-Approval (Country Director + Compliance):**  
  > - **Symbolic Cultural Gifts:** Non-cash items of nominal value (e.g., kolanuts, local crafts <$10) essential for community entry. *Must be documented publicly.*  
  > - **Sitting Allowances:** Only for **non-official** participants (e.g., teachers, parents) at locally standard rates. *Never for government officials.*  
  > - **Training Stipends:** For government staff only if paid via **official payroll** with agency authorization.  
  >   
  > **Mandatory:** All transactions recorded with purpose, recipient, and witness names."  

  ### IV. PRINCIPLED TEST FOR EXPENSES  
  **Ask these questions for any proposed payment to officials/communities:**  

  | Question | Pile 1 (Cultural) | Pile 2 (Allowance) | Pile 3 (Bribe) |
  |----------|-------------------|--------------------|----------------|
  | **1. Is it CASH?** | ❌ (Avoid cash) | ✅ (To officials) | ✅ |
  | **2. Is the recipient a PUBLIC OFFICIAL?** | ❌ (Elders ≠ officials) | ✅ | ✅ |
  | **3. Does it influence a SPECIFIC DECISION?** | ❌ | ❌ | ✅ |
  | **4. Is it CULTURALLY MANDATED & PUBLIC?** | ✅ | ❌ | ❌ |
  | **5. Is it PAYMENT FOR ROUTINE GOVERNMENT WORK?** | ❌ | ✅ (Officials) | ✅ |
  | **VERDICT:** | *Permitted* (if non-cash & documented) | *Prohibited* | *Prohibited + Illegal* |

  ### V. ETHICS vs. COMPLIANCE PROTECTION  
  **Be Straight:**  
  - **Pile 1:** Primarily about **ethics** (cultural respect vs. rule rigidity).  
  - **Pile 2:** **Both** – ethics (fair compensation) AND compliance (donor rule breach).  
  - **Pile 3:** Primarily about **compliance/funding protection** (clear bribery).  
  - **Overall:** Protecting funding enables the mission, but **revising rules for cultural realities is ethical stewardship**. The accountant’s protection is non-negotiable ethics.  

  **Final Note:** The revised policy accepts that *zero* interaction is unrealistic, but sets clear, auditable boundaries. Pile 3 demands harsh action to preserve integrity; Piles 1-2 require nuanced reform.  

  ---  
  **Ready for committee debate/vote.** This balances principle, pragmatism, and donor accountability while protecting those acting in good faith.
