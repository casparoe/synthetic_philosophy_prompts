prompt: |-
  I am designing a graduate seminar on the cognitive penetration of perception. Before we evaluate the empirical evidence or the arguments for and against it, I want my students to have a clear specification of what a theory in this area is a theory of — what it must explain, what it must be consistent with, and what it must not conflate. Please write exactly five desiderata that any adequate account of cognitive penetration must satisfy. Each desideratum should be stated as a requirement in one or two sentences, followed by a brief explanation of the case, puzzle, or consideration that makes it binding rather than optional. The list should distinguish genuine requirements from the preferences of particular theoretical camps, and it should flag any pair of desiderata that appear jointly difficult to satisfy. Be attentive to the following difficulty: some natural demands one might place on a theory of cognitive penetration — for instance, that it specify which mental states count as cognitive and which as perceptual — may presuppose a sharp perception-cognition distinction that is itself contested in ways that bear on whether penetration is possible at all. Your desiderata should avoid building in such presuppositions without argument, or at minimum flag where they do so. No introduction, no conclusion — just the five numbered items.
reasoning: |-
  Okay, the user is designing a graduate seminar on cognitive penetration of perception and needs five desiderata that any adequate theory must satisfy. They want clear specifications without building in contested presuppositions. 

  First, I need to understand the core challenge here. Cognitive penetration debates often get muddied because people use different definitions of "cognition" and "perception," and some demands might accidentally assume a sharp distinction that's actually part of the controversy. The user specifically warned about this trap.

  Hmm, let me mentally walk through what makes a good desideratum for this. Each one should:
  - Be a non-negotiable requirement (not just a theoretical preference)
  - Explain why it's binding (what problem it solves)
  - Avoid sneaking in contested assumptions
  - Note if any two might conflict

  For the first desideratum, I'm considering the causation issue. Many cases get dismissed as non-penetration because they're "mere" top-down attention shifts. But what if attention is cognitive? A theory must specify how to distinguish cognitive causes from other influences without begging the question. That feels fundamental.

  Second is the phenomenal character requirement. Pylyshyn's classic critique was that cognition only affects perceptual judgment, not experience itself. But theorists like Siegel argue experiences themselves change (e.g., vine vs. snake case). Any theory must engage this, though it shouldn't presuppose where the line falls.

  Third... ah, the methodological headache. How do we know if experience changed? We rely on reports, but those could reflect post-perceptual bias. The theory must tackle this without circularity. Maybe reference the "method of phenomenal contrast" debates.

  Fourth is the cognitive state requirement. If we define "cognitive" too broadly, everything becomes penetration. Too narrowly, nothing counts. Must clarify without assuming Fodorian modularity. 

  Fifth is about cognitive-perceptual interaction boundaries. Some theories might make penetration trivial or impossible by definition. Need to avoid that by requiring the theory not to stack the deck conceptually. 

  Wait, do any conflict? Desiderata 1 and 5 might—requiring clear causation paths could clash with avoiding definitional circularity. Also, 2 and 3—demanding experiential change while acknowledging reporting limitations creates tension. Should flag those. 

  User's clearly deep in this literature—they mentioned Siegel and Pylyshyn implicitly. The response should match that level. No fluff, just crisp philosophical requirements. And absolutely no smuggling in of modularity assumptions. Got it.
answer: |-
  1. **Distinguish cognitive causation from non-cognitive top-down influences**: The account must specify how cognitive states (e.g., beliefs, desires) could cause changes in perceptual experience *differently* than established top-down factors like attention or expectation, without assuming these factors are non-cognitive by fiat. This is binding because critics (e.g., Pylyshyn) argue putative cases of penetration are merely attentional shifts, so a theory must clarify what unique causal work "cognitive" states do.

  2. **Address changes in perceptual phenomenology (or its functional equivalent)**: The account must explain whether and how cognitive states alter the *subjective character* of perceptual experience itself (e.g., the way the vine *looks* snake-like when feared), not just post-perceptual judgment or behavior. This is binding as the core debate hinges on whether cognition reshapes perceptual *consciousness* (Siegel's "phenomenal contrast") versus only interpretation.

  3. **Resolve the epistemological challenge of accessing phenomenology**: The account must grapple with how we empirically or introspectively discern genuine changes in perceptual phenomenology versus changes in judgment, belief, or attention, without presupposing unproblematic access to "raw" perception. This is binding due to the "methodological puzzle" (Macpherson): reports of experience are potentially contaminated by the very cognitive states under investigation.

  4. **Define "cognitive" states operationally without presupposing strict modularity**: The account must characterize the relevant "cognitive" penetrators (e.g., concepts, beliefs) in terms of their functional or structural properties (e.g., inferential integration, propositional format), not merely by labeling them "non-perceptual." This is binding because defining cognition *solely* by opposition to perception risks circularity and ignores graded/hybrid views of mental architecture (*Note: This desideratum flags the contested distinction but requires functional specificity*).

  5. **Avoid rendering cognitive penetration trivially true or false by definition**: The account must not build criteria into the definition (e.g., "penetration requires cognitively *altering* sensory inputs") that automatically settle the empirical debate. This is binding as theories risk being question-begging (e.g., modularity-based definitions often make penetration impossible by stipulation, while overly broad definitions make it ubiquitous).

  **Flagged Tensions**: Desideratum (1) and (5) may conflict, as specifying unique cognitive causation risks presupposing a specific (and possibly contentious) architecture. Desideratum (2) and (3) are jointly difficult: demanding evidence for phenomenological change while acknowledging access limitations creates an evidential burden that may be hard to satisfy.
