prompt: |-
  You're a social choice theorist who's also sat on real governance committees, and I want the version of this that's more specific than the Gibbard–Satterthwaite spiel that shows up in every voting-reform thread I've ever read. Think it through carefully: before you recommend anything, list every principle that's consistent with our track record, then run each one against the new case.

  I'm on my org's process committee (~900 members). Our precedents so far:

  - Plurality, two nominees: fine.
  - Plurality, five nominees: not fine — we minuted the worry that somebody most members rank last could take it.
  - IRV over those same five: fine, no reason minuted.
  - A deadlocked subcommittee proposed drawing one member's ballot at random and letting it decide the whole thing: not fine. Someone called it a dictatorship wearing a lottery costume.
  - A show-of-hands rule that's trivially gameable: fine for picking meeting times, not fine for the annual budget.
  - A bylaw tweak that made two of five nominees constitutionally unwinnable, though the rule was otherwise anonymous and non-dictatorial: not fine.

  New proposal for the chair election, five nominees: every member places the nominees on a single left–right line, and the nominee sitting at the median of the placed positions wins. It's provably manipulation-proof at the ballot stage (reporting your true spot is dominant), non-dictatorial, and every nominee stays winnable. The catch: the committee has to pick the axis first, in practice one person picks it, and with a badly chosen axis you can elect a nominee that a majority ranks below all four others.

  So — what should we decide if we want to be consistant with ourselves? Which precedent is the closest analog, what principle does each option silently commit us to, and what's the single fact about our past rulings that would best settle which principle we've actually been running all along? No citations needed, I'll add those if I turn this into a memo.
reasoning: |-
  Okay, let me start by understanding the user's query. They're on a process committee for an org with about 900 members, and they've outlined several precedents in their voting methods. Now there's a new proposal for a chair election using a spatial median voting system. The user wants to know if adopting this aligns with their past decisions and what principles they've consistently followed.

  First, I need to list all their precedents and the implied principles. Let me go through each one:

  1. **Plurality, two nominees: fine.** Suggests that with only two options, simple majority is acceptable. The principle here might be that simplicity is okay when the risk of vote-splitting is minimal.

  2. **Plurality, five nominees: not fine.** They were worried about a candidate ranked last winning. This shows aversion to vote-splitting and the potential for unrepresentative outcomes. Principle: Avoid methods where a minority candidate can win due to split votes.

  3. **IRV for five nominees: fine.** They accepted IRV without issues. IRV addresses vote-splitting by allowing ranked choices and eliminating low candidates. Principle: Methods that mitigate vote-splitting and ensure the winner has broad support are acceptable.

  4. **Random ballot decision: not fine.** They called it a "dictatorship in lottery costume." So, randomness in decision-making is rejected because it lacks fairness and is arbitrary. Principle: Avoid randomness; decisions should reflect collective input.

  5. **Show-of-hands for meeting times vs. budget.** Gameable methods are okay for low-stakes decisions but not high-stakes. Principle: The acceptability of a method depends on the stakes; higher stakes require stricter non-manipulability.

  6. **Bylaw tweak making two nominees unwinnable: not fine.** Even though the rule was anonymous and non-dictatorial, it restricted candidate viability. Principle: All candidates should have a fair chance to win; rules shouldn't pre-determine outcomes.

  Now, the new proposal: Spatial median voting. Members place nominees on a left-right axis, and the median wins. It's manipulation-proof, non-dictatorial, and all can win. But the axis choice is critical—if poorly chosen, it could elect someone a majority dislikes.

  The key issue here is the axis selection. If one person picks the axis, that introduces a point of failure. A bad axis could misrepresent preferences, leading to an unrepresentative winner. This is similar to their precedent where an arbitrary rule (like the bylaw tweak) made candidates unwinnable, but here it's the axis that could undermine fairness.

  Comparing to precedents:
  - The random ballot was rejected for arbitrariness. Axis selection by one person could be seen as arbitrary, but it's not random—it's a deliberate choice. Still, it risks bias.
  - The bylaw tweak made candidates unwinnable, which violated the principle of candidate viability. Here, all candidates can win, but the axis might cause an unpopular winner. The principle isn't about viability per se but about the outcome reflecting member preferences.
  - IRV was accepted because it ensures the winner has broad support. The median method might not, if the axis is wrong. So, the principle is that the method should accurately capture collective preferences without undue influence from setup choices.

  The closest precedent is the bylaw tweak. Both involve an upfront decision (bylaw/axis) that can skew results. The rejected bylaw tweak precluded certain winners, while a bad axis could elect an unpopular one. The underlying principle is that the voting system shouldn't allow external setup factors to override the will of the majority.

  The strongest indicator from past rulings is their rejection of the random ballot and the bylaw tweak. Both were seen as violating fairness: randomness lacks collective input, and the bylaw tweak imposed artificial constraints. The axis selection risk falls under the same category—an external factor that could subvert genuine preferences.

  Therefore, consistency would require rejecting the median method unless the axis selection is made robust, perhaps through committee consensus or member input. Without that, it risks repeating the issues they've previously rejected: allowing arbitrary or biased elements to dictate outcomes contrary to majority sentiment.
answer: |-
  Based on your precedents and the need for procedural consistency, here's the analysis broken down step-by-step. The key is identifying the *implicit principles* driving your past decisions and applying them rigorously to the median-axis proposal.

  ### 1. **Principles Implied by Your Precedents**  
     - **Principle 1: Outcomes must reflect collective preferences.**  
       *Evidence:* Rejecting plurality with 5 nominees (risk of "least-preferred winner"), rejecting the random ballot ("dictatorship lottery"), and rejecting the bylaw tweak (unwinnable candidates).  
     - **Principle 2: Ballot-stage manipulability is tolerable only in low-stakes decisions.**  
       *Evidence:* Show-of-hands is fine for meeting times (low stakes) but not the budget (high stakes).  
     - **Principle 3: Upfront procedural constraints that distort outcomes are unacceptable.**  
       *Evidence:* Rejecting the bylaw tweak (making candidates unwinnable) and the random ballot (ignoring all but one vote).  
     - **Principle 4: "Fairness" requires candidate viability and non-arbitrariness.**  
       *Evidence:* Accepting IRV (preserves viability) vs. rejecting the random ballot (arbitrary power).  
     - **Principle 5: Trust in the system depends on avoiding pathological failures.**  
       *Evidence:* Minuted worry about plurality electing a "last-ranked" winner.  

  ### 2. **The Median-Axis Proposal vs. Your Principles**  
     - **Strengths:**  
       - Ballot-stage strategyproof (aligns with Principle 2; no manipulation concern).  
       - Non-dictatorial and preserves candidate viability (aligns with Principle 4).  
     - **Fatal Flaw:**  
       - **The axis selection risks violating Principle 1 and Principle 3.** A poorly chosen axis could elect a candidate ranked below all others by a majority – directly echoing the "last-ranked winner" pathology you rejected in plurality and the outcome-distortion of the bylaw tweak.  

  ### 3. **Closest Precedent Analog**  
     - **The bylaw tweak (making 2/5 nominees unwinnable) is the strongest parallel.**  
       - Both involve an *upfront, non-ballot decision* that determines which preferences matter:  
         - Bylaw tweak → Legally excluded candidates.  
         - Axis choice → Ideologically excluded candidates (if the axis misrepresents voter priorities).  
       - In both cases, the voting rule *itself* is sound (anonymous, non-dictatorial), but the setup warps outcomes.  
       - **Shared principle:** A voting system is only as good as its inputs. If the inputs (candidate eligibility/axis definition) are flawed, the outcome fails to reflect genuine preferences.  

  ### 4. **What Each Option Commits You To**  
     - **Accept the median-axis method:**  
       - *Commitment:* "Outcome-distorting setup decisions are acceptable if the voting rule itself is strategyproof."  
       - *Inconsistency:* Violates Principle 3 (upfront constraints) and Principle 1 (collective preferences). The bylaw tweak precedent explicitly forbids this.  
     - **Reject the median-axis method:**  
       - *Commitment:* "The system must guard against *all* major failure modes – including setup errors – not just ballot manipulation."  
       - *Consistency:* Aligns with rejecting the bylaw tweak (setup distortion) and plurality (pathological outcomes).  

  ### 5. **The Decisive Precedent**  
     - **The random ballot rejection ("dictatorship lottery") is the strongest indicator of your *actual* principle.**  
       - Why it settles the debate:  
         - You rejected randomness *not* because it was non-anonymous or dictatorial (it wasn’t), but because it allowed **one arbitrary input to override collective will**.  
         - The axis selector in the median method is functionally similar: one person’s arbitrary input (the axis) could override majority preferences by misrepresenting the ideological spectrum.  
       - This reveals your committee’s core value: **No single point of failure should be able to distort outcomes**, whether it’s a random ballot, a bylaw tweak, or an axis choice.  

  ---

  ### Recommendation: Reject the Proposal (for now)  
  **To be consistent**, you must treat the axis selector as a critical vulnerability – akin to the random ballot or bylaw tweak. The setup’s non-strategyproofness risks replicating the "last-ranked winner" scenario you already deemed unacceptable.  

  #### How to Adapt It  
  If median voting appeals to you:  
  1. **Democratize axis selection:** Have the committee vote on the axis (e.g., "Should the axis be 'fiscal policy' or 'social policy'?").  
  2. **Require a neutral default:** Use an axis historically correlated with voter behavior (e.g., past voting patterns).  
  3. **Add a backup:** Pair it with a majority-check runoff to avoid "majority-last" winners.  

  **Bottom line:** Your precedents prioritize *robustness against outcome distortion* over theoretical strategyproofness. The random ballot ruling is the Rosetta Stone – it shows your org values distributed control, not just procedural purity. Without fixing the axis problem, this proposal fails your own test.  

