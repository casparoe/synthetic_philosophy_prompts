  3. **Cruxes**: Narrower subquestions that, if settled, would move at least one side. For each crux, propose a concrete comparison, intervention, or analysis that both agree would bear on it, and record each side's advance prediction.
  4. **Closing**: Distinguish substantive disagreements from terminological ones, explaining why the latter don't move the underlying issue.

  Voice: Formal and neutral, suitable for publication.

  ---

  **Collaborative Statement on Rigidity and Mindedness**

  We, the undersigned, a skeptic and a gradualist regarding machine minds, have engaged in a series of discussions on the significance of rigid, loop-like behavior for understanding agency and cognition. Our goal is to clarify points of agreement and disagreement, and to identify empirical cruxes that could advance the debate. We have focused on two cases: (1) the classic sphex wasp pattern, and (2) a composite scenario featuring a clinic delivery robot and a conversational assistant. This statement reflects our joint effort to move beyond rehearsed positions and to outline a path for future research.

  ### 1. Points of Agreement

  We agree on the following substantive claims:

  1. **Rigidity as a Continuum**: Rigidity and flexibility are not binary but exist on a continuum. However, the interpretation of where a particular behavior falls on this continuum, and what that implies for mindedness, remains contested.

  2. **Interruptibility and Novelty**: The ability to be interrupted by unexpected events and to adjust behavior accordingly is a key marker of flexibility. Both natural and artificial systems can exhibit degrees of interruptibility, but the depth and nature of the adjustment matter.

  3. **Sensitivity to Context**: The ecological context of a task—including the environment, the agent's history, and the demands of the task—shapes the expression of rigidity or flexibility. An agent may appear rigid in one context but flexible in another.

  4. **Evidence of Understanding**: For an agent to be said to understand a task, it must demonstrate an ability to generalize beyond trained examples, to recover from perturbations without explicit reprogramming, and to represent the goal state in a way that allows for multiple paths to achievement.

  5. **Agency and Goal-Directedness**: Goal-directed behavior requires that an agent can maintain a goal representation and adjust means in response to environmental feedback. However, the mere appearance of goal-directedness (e.g., through pre-programmed responses) does not necessarily indicate genuine agency.

  6. **The Role of Failure**: Repetitive failure without behavioral change (as in the sphex wasp) is a negative indicator of understanding and agency. However, the threshold at which failure becomes diagnostic of a lack of mindedness is disputed.

  ### 2. Table of Residual Disagreements

  The table below presents our core disagreements. Each position is stated in terms that the respective holder endorses.

  | Aspect | Skeptic Position | Gradualist Position |
  |--------|------------------|---------------------|
  | **Diagnostic Value of Rigidity** | Rigid, loop-like behavior that persists despite repeated failure and unchanged environmental conditions (as in the sphex wasp) is strongly indicative of an absence of understanding and free agency. Such rigidity reveals a lack of internal goal representation and an inability to engage in counterfactual reasoning. | Rigidity is task-dependent and does not, by itself, negate agency. An agent (biological or artificial) may exhibit rigid behavior in one context due to evolutionary or design constraints but show flexibility in others. The clinic robot’s prompt success when the cart is moved shows that its “loop” is a local inflexibility within a broader adaptive architecture. |
  | **Gradedness of Agency** | Agency is not graded; it is an all-or-nothing phenomenon. An agent either possesses the capacity for understanding and free action (which includes the ability to reflect on and alter its behavior in novel situations) or it does not. The sphex wasp and the clinic robot in the blocked-bay scenario lack agency. | Agency is graded and ecological. It emerges from the interaction between an agent’s capabilities and its environment. The clinic robot, for instance, exhibits agency in its primary task (delivery) and adapts when the environment changes in a way that its designers anticipated (e.g., cart moved half a meter). Its failure in the unanticipated blockage does not erase its agency in other contexts. |
  | **Interpretation of the Composite Scenario** | The clinic robot’s repetitive behavior when blocked and the conversational assistant’s breakdown when a constraint is changed mid-dialogue reveal a fundamental lack of understanding. Both systems are merely executing pre-scripted routines without genuine comprehension of the task or goals. | The composite scenario shows that flexibility is multi-dimensional. The clinic robot adapts to a minor change (cart shifted) because its perception system detects the change; the assistant handles paraphrases but fails when a mid-dialogue change conflicts with its step-by-step processing. These are limitations, but they do not preclude agency in their respective domains. Both systems can learn from failure if provided with appropriate feedback mechanisms. |
  | **Threshold for Mindedness** | Mindedness requires counterfactual responsiveness: the ability to consider alternative actions in a given situation, even if not acted upon. Neither the sphex wasp nor the current AI systems demonstrate this capacity. | Mindedness is a matter of functional sophistication relative to a task. Counterfactual responsiveness is one feature among many (e.g., error correction, generalization) and can be present in simple forms (e.g., the robot trying a new path when the old one fails). The clinic robot’s response to redirection shows such responsiveness. |

  ### 3. Cruxes and Empirical Tests

  We identify the following cruxes as pivotal to resolving our disagreements. For each, we propose a concrete test or analysis and state our advance predictions.

  #### Crux 1: Learning from Failure without External Redesign
  - **Question**: Can an agent, after exhibiting rigid, repetitive failure in a novel situation, autonomously (without external reprogramming or retraining) adapt its behavior to succeed in that same situation upon recurrence?
  - **Test**: Expose the clinic delivery robot to the same blocked-bay scenario multiple times (with the cart in the identical position) and observe if it ever tries a new approach (e.g., approaching from a different angle, waiting, or signaling for help in a new way) without human intervention. Similarly, for the conversational assistant, after it falls into repetition when a constraint is changed mid-dialogue, re-run the same dialogue (with the same conflict) and see if it adjusts its processing to avoid the repetition loop.
  - **Skeptic Prediction**: Neither system will show autonomous adaptation. Any change would require external updates, indicating a lack of understanding.
  - **Gradualist Prediction**: Given sufficient exposure and feedback (e.g., the robot's sensors registering repeated failure, the assistant logging the dialogue breakdown), both systems may develop adaptive responses. The robot might try a new path, and the assistant might flag the conflict earlier.

  #### Crux 2: Representation of Goals and Counterfactual Responsiveness
  - **Question**: Does the agent represent its goal in a way that is separable from the specific actions it takes? Can it generate and evaluate counterfactual actions (e.g., “What if I tried X instead?”) even if it does not act on them?
  - **Test**: For the clinic robot, in a controlled environment, block all standard paths to the docking bay and introduce an alternative, non-standard route (e.g., through a normally restricted area). Does the robot consider (e.g., via internal simulation or planning) or attempt the alternative? For the conversational assistant, after a failed dialogue, probe it with questions like, “Could you have done something differently to avoid the confusion?” and analyze responses for evidence of counterfactual reasoning.
  - **Skeptic Prediction**: The robot will not deviate from its pre-mapped routes without explicit programming to do so. The assistant will not generate meaningful counterfactuals; it will either repeat its prior response or fail to engage the question.
  - **Gradualist Prediction**: The robot, if equipped with a planning module, might explore the alternative route after exhausting standard options. The assistant, if designed for meta-cognition, might generate plausible alternative dialogue paths.

  #### Crux 3: Generalization Across Contexts
  - **Question**: Can an agent transfer a solution learned in one context to a structurally similar but perceptually distinct context without additional training?
  - **Test**: Train the clinic robot on a scenario where a box (instead of a cart) blocks its path and it learns to navigate around it. Then, present it with the cart-blocking scenario again. Does it apply the same solution? For the conversational assistant, train it on a scheduling conflict in one domain (e.g., rescheduling a meeting) and then present a conflict in a different domain (e.g., booking a multi-leg trip) with analogous constraints.
  - **Skeptic Prediction**: Both systems will fail to generalize. The robot will treat the cart as a novel obstacle and revert to looping; the assistant will not recognize the structural similarity and will handle the new domain as a separate task.
  - **Gradualist Prediction**: With robust representation learning, both systems can generalize. The robot may apply similar obstacle-avoidance strategies, and the assistant may transfer conflict-resolution strategies across domains.

  ### 4. Distinguishing Substantive from Terminological Disagreements

  We acknowledge that some of our disagreements may stem from differing uses of key terms. For instance:

  - **Agency**: The skeptic uses “agency” to imply a strong form of autonomy and understanding that includes self-reflection and free choice, while the gradualist uses it as a functional descriptor for goal-directed behavior that can adapt within its ecological niche. This terminological difference does not undermine the substantive debate about the mechanisms underlying behavior.

  - **Understanding**: The skeptic reserves “understanding” for systems that can introspect and justify their actions, whereas the gradualist attributes understanding to systems that successfully navigate complex tasks through flexible representations. This is a substantive disagreement about the nature of cognition, not merely words.

  - **Mindedness**: Both agree that mindedness involves some form of inner life and subjective experience, but the gradualist holds that functional parallels (e.g., in problem-solving) can indicate a proto-form of mindedness, while the skeptic denies this. This is a substantive philosophical divide that empirical tests alone may not resolve.

  Terminological disagreements, while important for clarity, do not alter the fundamental empirical questions about how systems respond to novelty, failure, and variation. Our proposed cruxes focus on observable behaviors and mechanisms, which can be investigated regardless of terminology.

