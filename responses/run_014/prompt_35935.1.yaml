prompt: |-
  so i'm an undergrad taking an animal ethics course this semester (honestly its my favorite class) and i somehow got elected student rep on the university's dining services advisory committee. every couple of weeks we vote on menu proposals from the dining staff -- stuff we've had this semester: swapping the default protein at the burrito station from beef to chicken to save money, adding a "meatless monday", switching to a cheaper chicken supplier, etc. the rest of the committee is staff who care about cost and student satisfaction, and i'm the only one who thinks about the animal side, but i can't exactly run a full utilitarian calculation on each proposal in the five minutes it gets in the meeting. from my course i've learned enough to know it's messy: the obvious stuff (chicken vs beef, where per kg chicken means vastly more animals killed), but also the less obvious stuff like animals dying in crop cultivation from harvesting, which makes even "just add more plant-based options" not a free win. i want a decision procedure i can actually run, maybe on a napkin: a short ordered list of questions to ask about any proposal, what counts as enough of an answer to each one, where the procedure outputs a no, and where it should punt and say "this is a values question, argue it in the open instead." then run it on three realistic proposals: (1) replacing beef with chicken at two stations to cut costs, (2) a meatless monday where the vegetarian option is just a bigger portion of veg they already serve, and (3) switching to a local pasture-raised beef that costs noticeably more. at least one of these should come out with an answer i won't like, and you should be upfront about where the procedure misfires or depends on numbers nobody actually has (like how many animals die per kg of each food, or per hectare of crops). also keep the philosophy jargon out or define it in plain words, since i have to hand a one-page version of this to the other committee members and they will not read anything that sounds like a seminar.
reasoning: |-
  Okay, the user is an undergrad in an animal ethics course and also the student rep on the university dining committee. They need a quick, practical decision procedure to evaluate menu proposals from an animal welfare perspective. The challenge is balancing ethics with real-world constraints like time, cost, and student satisfaction. 

  First, I need to understand their core dilemma: they're the only one focused on animal ethics in a committee that prioritizes cost and satisfaction. They need something simple enough to use in 5-minute discussions but robust enough to handle ethical nuances. The examples they gave (beef vs chicken swap, Meatless Monday, local beef) are perfect test cases.

  Hmm... the key here is creating a framework that's both actionable and philosophically sound without getting bogged down in impossible calculations. They explicitly want to avoid jargon and complex utilitarianism. I should focus on high-impact factors that are knowable in practice. 

  The crop deaths angle is tricky - it's a valid ethical concern but nearly impossible to quantify in meetings. Maybe I should acknowledge it but explicitly exclude it from the calculation due to data constraints? That feels honest. 

  For the decision flow, I'm thinking: start with "does this reduce total meat?" because fewer animals killed is usually clearer ethically. Then check for suffering reduction opportunities (like pasture-raised). Finally, a tiebreaker about promoting plant-based eating long-term. 

  I'll make sure to flag where the system has blind spots - like when proposals are ethically neutral or require value judgments. And crucially, I need to show how it works on their three examples, including one where the outcome might disappoint them (probably the local beef case). 

  The pasture-raised beef proposal is interesting - it seems ethical but actually fails the framework because it increases meat consumption. That'll demonstrate how the procedure prioritizes scale over individual welfare when data is limited. 

  Should I add a "red flags" section? Like proposals that actively worsen things (more meat, worse conditions) are automatic no's. That might help for quick rejections. 

  For the one-page handout version, I'll need to strip all philosophy references and present it as simple questions with yes/no paths. Maybe call it the "Three Question Test" - short enough for a napkin calculation. 

  Most importantly, I must emphasize this isn't perfect - just the best possible tool given their constraints. The crop death omission especially needs to be called out as a limitation.
answer: |-
  Here's a practical "Napkin Test" decision procedure focused on animal impact, designed for speed and clarity. It prioritizes high-impact, knowable factors over impossible precision:

  **The Animal Impact Napkin Test (For Dining Committee Proposals)**

  Ask these questions **in order**. Stop and output the answer as soon as you hit a definitive "No" or "Yes". If you get to the end, it's a values debate.

  1.  **Does this proposal *significantly increase* the total amount of meat/dairy/eggs served?**
      *   *How to tell?* Look at the proposal's core change. Will students definitely eat *more* animal products overall? (e.g., Adding bacon to everything, making meat portions larger).
      *   *Enough for "Yes" (BAD):* Clear evidence of increased purchase/consumption. **OUTPUT: NO (Strong Objection - Increases Harm)**.
      *   *Not Sure/No Clear Increase:* Move to Question 2.

  2.  **Does this proposal *significantly reduce* the total amount of meat/dairy/eggs served?**
      *   *How to tell?* Will students definitely eat *less* animal products overall? (e.g., Removing meat from a popular station one day, making meat portions smaller, replacing meat with plants *as the default*).
      *   *Enough for "Yes" (GOOD):* Clear mechanism for reduced purchase/consumption. **OUTPUT: YES (Strong Support - Reduces Harm)**.
      *   *Not Sure/No Clear Reduction:* Move to Question 3.

  3.  **Does this proposal shift consumption *from animals known to suffer more* to animals known to suffer less *per meal served*?**
      *   *How to tell?* Use this simple hierarchy based on animals killed per kg (Beef > Pork > Chicken/Turkey > Fish > Eggs/Dairy). Does the proposal move consumption *down* this list? (e.g., Beef -> Chicken, Chicken -> Plant-based).
      *   *Enough for "Yes" (GOOD):* Clear substitution down the hierarchy. **OUTPUT: YES (Support - Reduces Suffering Scale)**.
      *   *Shifting Up Hierarchy (BAD)?* (e.g., Chicken -> Beef, Plants -> Eggs) **OUTPUT: NO (Object - Increases Suffering Scale)**.
      *   *Same Level/Unclear/Dairy/Eggs:* Move to Question 4.

  4.  **Does this proposal clearly improve the welfare standards for a *significant portion* of animals used?**
      *   *How to tell?* Is there a verifiable shift to a higher-welfare certification (like Certified Humane, Global Animal Partnership) or clear practice (e.g., cage-free to pasture-raised) for a major ingredient? Avoid vague terms like "local" or "natural" unless tied to a welfare standard.
      *   *Enough for "Yes" (GOOD):* Clear, verifiable welfare improvement for a core ingredient. **OUTPUT: YES (Support - Improves Welfare)**.
      *   *Vague Claims/No Verifiable Standard/Insignificant Portion:* Move to Question 5.
      *   *Worsens Welfare?* **OUTPUT: NO (Object - Harms Welfare)**.

  5.  **Does this proposal make plant-based eating significantly easier, more appealing, or more normal *without increasing animal product consumption elsewhere*?**
      *   *How to tell?* Does it add *new* appealing plant-based options as defaults/equals, improve their quality/visibility, or actively promote choosing plants? (Key: It shouldn't just shuffle existing veg sides).
      *   *Enough for "Yes" (GOOD):* Clear step towards normalizing/better plants. **OUTPUT: YES (Support - Promotes Plants)**.
      *   *Just Existing Veg/Token Effort/Unclear Impact:* **OUTPUT: PUNT (Values Debate - Ambiguous Animal Impact)**.

  **Where it Misfires/Blind Spots:**

  *   **Crop Deaths:** Intentionally ignored. Data is too uncertain, varies wildly, and comparing them directly to factory farming deaths is highly complex. The procedure focuses on *intentional* animal use where impact is clearer and larger-scale.
  *   **Exact Numbers:** Doesn't require precise kg/hectare stats. Relies on known hierarchies and clear directional changes.
  *   **Indirect Effects:** Hard to predict if Meatless Monday makes people eat *more* meat Tuesday. Focuses on the *direct, intended* change of the proposal.
  *   **Consumer Psychology:** Assumes changes (like defaults) influence behavior, which is generally true but not perfectly predictable.
  *   **Dairy/Egg Nuance:** Places them lower than meat in Q3, but doesn't differentiate welfare nuances *within* dairy/egg production easily. Q4 handles welfare improvements here.

  **Applying the Test to Your Proposals:**

  1.  **Replacing Beef with Chicken at Two Stations (Cost Savings):**
      *   Q1: No significant *increase* in total meat. (Likely same amount served, just different type). Move on.
      *   Q2: No significant *decrease* in total meat. Move on.
      *   Q3: **YES!** Shifts consumption *down* the hierarchy (Beef -> Chicken). Significantly fewer animals killed per meal. **OUTPUT: YES (Support - Reduces Suffering Scale)**. *This might feel counter-intuitive (chickens suffer more individually?), but the sheer scale reduction makes it a net positive on suffering under this practical framework.*

  2.  **Meatless Monday (Bigger portion of existing veg):**
      *   Q1: No increase in meat. Move on.
      *   Q2: **YES!** Explicitly *removes* meat as an option at stations one day per week. Significantly reduces total meat served. **OUTPUT: YES (Strong Support - Reduces Harm)**. *The bigger veg portion is irrelevant to the animal impact calculation here. The key is removing meat.*

  3.  **Switching to Local Pasture-Raised Beef (Costs More):**
      *   Q1: No increase in *total* meat (same amount, hopefully). Move on.
      *   Q2: No decrease in total meat. Move on.
      *   Q3: No shift down the hierarchy (still Beef). Move on.
      *   Q4: **YES?** *If* "pasture-raised" means a verifiable, significant welfare improvement over standard beef (e.g., more space, access to pasture, less stress) *and* it applies to a major portion of beef used, then YES. **OUTPUT: YES (Support - Improves Welfare)**. *BUT...*
      *   **The Catch:** Higher cost *might* lead to *less beef being purchased/served overall* (Q2 - Reduction), which would be a stronger YES. Conversely, marketing it as premium *might* slightly increase demand. The Napkin Test struggles with these indirect effects. **Likely PUNT/Values Debate** unless you have strong evidence on consumption change. *This is the one you might not like - improving welfare per animal but not reducing numbers is a weaker win than reducing overall consumption.*

  **One-Page Handout Version (Copy/Paste This):**

  **The Animal Impact Quick Check (For Menu Proposals)**

  Answer these questions in order. Stop at the first clear answer. If unsure by the end, it needs discussion.

  1.  **Will this make students eat MORE meat/eggs/dairy overall?**
      *   YES ➔ **OBJECT (Likely Bad for Animals)**
      *   NO/Unsure ➔ Next Question

  2.  **Will this make students eat LESS meat/eggs/dairy overall?**
      *   YES ➔ **SUPPORT (Good for Animals)**
      *   NO/Unsure ➔ Next Question

  3.  **Does this switch from meat like Beef/Pork to meat like Chicken/Fish, or to plants?** (Better: Beef -> Pork -> Chicken/Turkey -> Fish -> Eggs/Dairy -> Plants)
      *   YES (Moves Down List) ➔ **SUPPORT (Reduces Animals Harmed)**
      *   NO (Moves Up List) ➔ **OBJECT (Increases Animals Harmed)**
      *   SAME LEVEL/EGGS/DAIRY/Unsure ➔ Next Question

  4.  **Does this clearly improve how the animals are treated (e.g., cage-free, pasture-raised, certified humane) for a major ingredient?**
      *   YES (Verifiable Improvement) ➔ **SUPPORT (Better Welfare)**
      *   NO/Vague Claims ➔ Next Question
      *   WORSENS Treatment? ➔ **OBJECT (Bad Welfare)**

  5.  **Does this make plant-based options significantly better or easier as the main choice, WITHOUT adding more animal products?**
      *   YES (Meaningful Upgrade/Promotion) ➔ **SUPPORT (Encourages Plants)**
      *   NO/Minor Change ➔ **DISCUSS (Debatable Impact)**

  **Remember:** This focuses on direct, knowable impacts on animals raised for food. It can't predict everything perfectly, but gives a quick, consistent starting point.
