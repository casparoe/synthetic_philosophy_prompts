prompt: |-
  I've spent a lot of time in the rationalist and effective-altruism literature, so I think about moral questions in terms of expected value, marginal dollars, cost-effectiveness, and moral uncertainty. I have now started reading the philosophical literature on the demandingness objection to consequentialism, and I would like you to restate it in the vocabulary I actually use, as faithfully as you can.

  Specifically, I want you to take the three most influential versions of the demandingness objection — the basic objection that consequentialism is too demanding because it requires you to sacrifice your own interests whenever doing so would produce a better overall outcome; Williams's integrity objection, that consequentialism fails to respect the personal projects and commitments that give your life meaning; and the separateness-of-persons objection, that consequentialism aggregates utility across persons as if they were a single entity — and restate each of them in terms of expected value, marginal utility, cost-effectiveness, the shallow-pond thought experiment, discounting, moral uncertainty, satisficing versus optimizing, and feasibility constraints.

  For each objection, tell me what translates cleanly, what has to be distorted to fit, and what has no expression at all in my vocabulary. Then give me the residue report: which of the philosophers' claims map cleanly onto the expected-value framework, which translate only with distortion, and which cannot be expressed in it at all. And here is the part I most want to see: is the residue a defect of the expected-value framework — that is, does the framework simply lack the concepts to represent these kinds of moral claims — or is it a sign that the philosophical claims are less clear or less substantive than they first appeared, such that when you try to pin them down in precise terms, they turn out to be conflations or ambiguities that dissolve under scrutiny?

  I want to know whether my intuition — that the demandingness objection is just a practical question about how much I can afford to give, and that the integrity and separateness objections are just disagreements about the aggregation function — is right, or whether it is missing something that the philosophers are getting at.
reasoning: |-
  Okay, the user has a deep background in rationalist and effective altruism literature, so they're used to thinking in terms of expected value, cost-effectiveness, and moral uncertainty. They're now diving into philosophical objections to consequentialism, specifically the demandingness objections. They want these objections translated into their familiar terms and then analyzed for how well they map onto that framework.

  First, I need to recall the three main objections: basic demandingness, Williams' integrity objection, and the separateness of persons. The user wants each restated using their vocabulary—things like marginal utility, discounting, satisficing vs. optimizing. Then, for each, I should note what translates cleanly, what's distorted, and what doesn't fit at all. The residue report is key here: figuring out if the untranslatable parts are flaws in the expected-value framework or if the philosophical claims are fuzzy.

  Starting with the basic demandingness objection. In EA terms, this is about optimizing every dollar until marginal utility is zero. But philosophers argue that's overdemanding. Clean translations would include feasibility constraints and discount rates for personal welfare. Distortions come in when we try to frame personal costs as discount rates—philosophers see it as a qualitative difference, not just quantitative. The residue here is the intuition that personal interests have intrinsic value beyond utility, which the framework doesn't capture. That might be a limitation of EV, reducing qualitative aspects to numbers.

  Next, Williams' integrity objection. Projects that give life meaning aren't easily quantified. Satisficing might seem like a solution, but Williams argues that switching projects based on EV calculations violates integrity. Clean translations could involve high discount rates for personal projects. But the core issue is that integrity involves identity-constituting commitments, which EV frameworks view as preferences. The residue here is the concept of identity—philosophy sees it as non-negotiable, while EV sees it as a preference. This might be a defect in the framework, as it can't capture non-instrumental value.

  Then, separateness of persons. Consequentialism aggregates utility across individuals. EA handles this with aggregation functions, but the objection is about treating individuals as more than containers for utility. Clean translations might involve utility thresholds or prioritarianism. However, the philosophical claim is about the moral weight of individual boundaries, which doesn't map to math. The residue here is the non-identity problem and agent-relative obligations, which the framework struggles with. This seems like a limitation of EV, as it can't represent the moral significance of personhood beyond utility.

  The user's intuition is that demandingness is about practical affordability, and the other objections are about aggregation. They might be missing the qualitative aspects that EV frameworks can't capture—like intrinsic value of personal interests, identity-constituting commitments, and the moral weight of separateness. The residue analysis shows that some philosophical claims resist translation not because they're vague, but because they address dimensions the framework excludes. This suggests the user's view might overlook deeper ethical concerns that EV can't quantify.
answer: |-
  Here's a meticulous translation and residue analysis of the three demandingness objections into your rationalist/EA framework, followed by the critical residue report:

  ---

  ### **1. Basic Demandingness Objection ("Sacrifice Interests for Optimal Outcomes")**
  * **EA/Rationalist Translation:**  
    Consequentialism demands optimizing expected value (EV) until marginal utility of your next dollar equals its highest achievable marginal cost-effectiveness elsewhere (e.g., shallow-pond equivalents). Personal welfare is discounted at 0% relative to others' welfare. Feasibility constraints (e.g., burnout risk) are merely instrumental to long-term EV maximization.  
    *Clean Fit:*  
    - "Sacrifice interests" → Opportunity cost of marginal dollars not allocated to highest-EV interventions.  
    - "Better overall outcome" → EV optimization across all accessible interventions.  
    - Feasibility constraints (e.g., psychological limits) as EV tradeoffs.  
  *Distorted Fit:*  
    - Personal interests framed as "discount rates": Philosophers argue personal welfare has *intrinsic* moral weight (not just instrumental value for sustained giving). EV frameworks often reduce this to a "hedonic discount rate" or "productivity preservation factor," treating it as *instrumental*.  
  *No Fit:*  
    - The intuition that personal interests have **non-instrumental moral significance**—i.e., it's *pro tanto* wrong to demand total self-sacrifice even if net EV increases.  

  ---

  ### **2. Williams' Integrity Objection ("Personal Projects Give Life Meaning")**
  * **EA/Rationalist Translation:**  
    Consequentialism treats deeply held projects (e.g., art, family) as preferences with low marginal cost-effectiveness. It demands switching commitments if EV calculations favor higher-impact activities (e.g., abandoning cancer research to fund bednets). Satisficing (e.g., "10% giving rule") is rejected unless it optimizes long-term EV.  
    *Clean Fit:*  
    - Projects as "utility functions": Personal commitments contribute to your utility, but are weighed against others' welfare.  
    - "Meaning" → High personal discount rates for identity-constituting projects.  
  *Distorted Fit:*  
    - **Integrity ≠ preference satisfaction:** Williams argues projects are *constitutive of identity*—not mere preferences to be traded. EV frameworks force distortion by modeling identity as a "revealed preference" with elastic utility.  
    - Satisficing as a solution? Philosophers claim satisficing *still instrumentalizes integrity*—you shouldn’t need EV calculations to justify keeping your child alive.  
  *No Fit:*  
    - **Agent-relativity of reasons:** Obligations arising from *your* projects (e.g., "I must save *my* child") are not reducible to impartial EV. The framework cannot capture "I have a *different reason* to save my child than a stranger's."  

  ---

  ### **3. Separateness-of-Persons Objection ("Utility Aggregation Across Individuals")**
  * **EA/Rationalist Translation:**  
    Consequentialism uses a linear aggregation function: ∑Uₙ across all persons. Ignores distributional constraints (e.g., Derek Parfit's "repugnant conclusion"). Moral uncertainty might weight aggregation functions (e.g., prioritarianism), but still assumes comparability.  
    *Clean Fit:*  
    - Aggregation as a utility-summing algorithm.  
    - "Separateness" → Rejected in favor of impersonal welfare optimization.  
  *Distorted Fit:*  
    - **Rights as utility thresholds:** Philosophers argue rights (e.g., bodily autonomy) create *side-constraints* on aggregation. EV frameworks distort this by modeling rights as "lexical thresholds" or infinite utility weights—losing the deontic force of "you *cannot* violate person P, even for ∑Uₙ."  
  *No Fit:*  
    - **Non-identity problem:** Harming person A to benefit persons B+C is impermissible if A would not exist otherwise. EV frameworks lack tools to handle non-compossible existences.  
    - **Agent-relative permissions:** The intuition that you may (or must) prioritize *your own* suffering over identical suffering elsewhere.  

  ---

  ### **Residue Report: What Evades the Expected-Value Framework**  
  | **Philosophical Claim**               | Clean Fit? | Distorted? | No Fit? | Defect in EV Framework? |  
  |---------------------------------------|------------|------------|---------|--------------------------|  
  | Personal interests have intrinsic weight | ✓          | ✓          |         | **Defect:** EV reduces all value to utilons. |  
  | Integrity is identity-constitutive    |            | ✓          | ✓       | **Defect:** Cannot model non-tradable "reasons of one's own." |  
  | Rights as side-constraints            |            | ✓          | ✓       | **Defect:** Constraints aren't utilon thresholds; they block aggregation. |  
  | Agent-relative permissions/obligations|            |            | ✓       | **Defect:** EV is strictly agent-neutral. |  
  | Non-identity problems                 |            |            | ✓       | **Defect:** EV assumes fixed population ethics. |  

  #### **Key Insights on the Residue:**  
  1. **Not Vagueness, but Conceptual Gaps:** The untranslatable residues (e.g., agent-relative reasons, non-instrumental integrity) are *substantive and coherent*. They expose **structural limitations of EV**:  
     - EV frameworks *presuppose* that all moral considerations are commensurable and agent-neutral.  
     - They cannot natively represent deontic constraints ("thou shalt not") or non-fungible personal obligations.  

  2. **Your Intuition: Partially Correct, Partially Limited:**  
     - ✅ **Demandingness as affordability:** Correct that feasibility constraints (e.g., diminishing returns to labor) address *practical* overdemandingness.  
     - ✅ **Aggregation disagreements:** Yes, separateness objections often reduce to debates over aggregation functions (e.g., utilitarianism vs. prioritarianism).  
     - ❌ **Missing the core:** The objections reveal **non-consequentialist moral phenomena** (integrity, agent-relativity) that EV frameworks *systematically exclude*. This isn’t a conflation—it’s a challenge to the reducibility of ethics to optimization.  

  #### **Conclusion:**  
  The residue is **primarily a defect in the EV framework**. It fails to capture the *sources of moral reasons* (projects, relationships) and *the moral significance of personal boundaries*. This doesn’t make philosophy "fuzzy"—it shows EV is **ontologically thin** for full moral reasoning. Your toolkit excellently handles *impartial optimization* but struggles with *partiality, personal identity, and inviolability*—which even many consequentialists now try to accommodate (e.g., through hybrid theories). To dismiss these as "just aggregation errors" risks moral blind spots.  

  **Recommendation:** Explore *moral uncertainty* frameworks that weight non-consequentialist principles (e.g., MEC-E) or *lexical priorities* for integrity constraints. This bridges the gap while respecting the residue.
