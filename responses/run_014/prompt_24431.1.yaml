prompt: |-
  I've been working through Russell's theory of descriptions and I keep running into an argument I cant shake. Its supposed to show the theory is just false, and I can't find the exit.

  (1) On Russell's theory, "the present King of France is bald" is false, since it comes out as "there's exactly one present King of France and he's bald," and there's no King of France.
  (2) So that sentence is false, not meaningless.
  (3) Now "the present King of France is not bald" comes out, on the same theory, as "there's exactly one present King of France and he's not bald."
  (4) No King of France, so that's false too.
  (5) So both "the King of France is bald" and "the King of France is not bald" are false.
  (6) But those two are contradictories, and contradictories can't both be false.
  (7) So Russell's theory is wrong.

  I feel like something slipped between (5) and (6) but I can't name it. Which step do you reject, and what does it cost to reject it? I'd rather keep (1) than (6) if I have to pick, but I want to know what I'm paying.
