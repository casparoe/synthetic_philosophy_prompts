  **2. Parameter Hostages & Score Swings:**
  *   **The Gene:** Molecular vs. Mendelian vs. "Gene Concept". Swing: **+/- 20 points** (Molecular gene higher on (a) & (b); Mendelian/gene concept lower, especially on (c)).
  *   **Acid:** Arrhenius (H⁺ donors) vs. Lewis (electron pair acceptors) vs. operational/phenomenal ("sour"). Swing: **+/- 15 points** (Lewis acid higher on (a) & (b); Arrhenius/phenomenal lower on (c)).
  *   **Race:** Biological essentialism vs. social/political construct vs. population genetics cluster. Swing: **+/- 50 points** (Bio-essentialist might give 30-50; constructivist 0-10; population cluster 20-40).
  *   **Gender:** Biological sex vs. social role/identity vs. performative. Swing: **+/- 35 points** (Biological sex might score 60-80; social/performative 20-40).
  *   **Mental Disorder:** Biomedical model vs. biopsychosocial model vs. harmful dysfunction vs. social construct. Swing: **+/- 25 points** (Biomedical higher on (b); social construct lower on (a) & (c)).
  *   **Intelligence:** g-factor vs. multiple intelligences vs. operational IQ score. Swing: **+/- 20 points** (g-factor higher on (a) & (b); multiple intelligences lower).
  *   **Stress:** Biological (e.g., cortisol response) vs. psychological/social. Swing: **+/- 15 points** (Biological stress higher on all axes).
  *   **Mineral:** Strict geological definition vs. commercial/loose use. Swing: **+/- 10 points** (Geological definition much higher).

  **3. Double Counting Pairs:**
  *   **Biological Species / Invasive Species:** "Invasive species" is a property *of* a biological species (or population) in a context. Keep **Biological Species** (core kind), drop *Invasive Species* (relational property).
  *   **Biological Species / Weed:** "Weed" is a context-dependent label applied *to* biological species (often invasive/nuisance plants). Keep **Biological Species**, drop *Weed*.
  *   *(Implied: Ecosystem / Soil Type)*: While related, they are distinct ontological levels (soil type is a component/defining factor). Keep both. No strict double-count.

  **4. Cutting to 12 Items (Prioritizing Spread, Core Examples, & Avoiding Traps):**
  *   **Cuts (14):** Weed, Invasive Species, Antioxidant, Vitamin, Learning Style, Planet, Jade, Phlogiston, Ecosystem, Soil Type, Stress, Inflammation, Intelligence, Gender.
  *   **Keep (12):** Water, the Electron, Acid, Metal, Mineral, Biological Species, the Gene, Virus, Pain, Mental Disorder, Race, Phlogiston.
  *   **Reasoning & Hurt:**
      *   **Hurt Most:** Cutting **Ecosystem/Soil Type/Inflammation** hurts ecological/biomedical depth. Cutting **Stress** removes a good mid-range biology-psychology bridge. Cutting **Intelligence/Gender** removes key social/philosophy flashpoints.
      *   **Why Keep These 12?** Covers physics (Electron, Water), chemistry (Acid, Metal), geology (Mineral), core biology (Species, Gene, Virus), biomedical (Pain), contested psych/social (Mental Disorder, Race), and a clear non-kind (Phlogiston). Good spread (100 to 0), high potential for disagreement on several (Gene, Acid, Mental Disorder, Race), avoids most parameter hostages except Gene/Acid/Race (which are *useful* for calibration if flagged).

  **5. Biggest Spread & Philosopher Poll:**
  *   **Largest Spread Item: Race.** Defensible scores: **0 (Social Constructivist)** vs. **50 (Population Cluster Realist)** vs. **85 (Ardent Bio-Essentialist - rare but exists)**. The 0 vs 50 or 0 vs 85 gap is massive and reflects fundamental metaphysical divides. 20 vs 85 *is* defensible between a hard constructivist and a realist about *some* biological clustering (even if rejecting essentialism).
  *   **Fraction Above 50:** **~0.4 (8-9/26).**
      *   **Reasoning:** Philosophers would reliably score **Electron, Water** near 100. **Protein Fold, Mineral, Virus, Biological Species, Metal, Pain, Gene** would be mixed but likely >50 for many (averaging 60-80). **Acid, Soil Type, Inflammation** would be borderline (~50-60). **Everything below "Stress" in my ranking** (Intelligence, Vitamin, Mental Disorder, Gender, Antioxidant, Jade, Invasive, Weed, Learning Style, Race) would likely score <50 for the *majority*, with significant minorities pushing some (Intelligence, Mental Disorder, maybe Gender) closer to 50. **Phlogiston** is 0. Conservatively, 8-9 items (Electron, Water, Protein Fold, Species, Mineral, Virus, Pain, Gene, maybe Metal) consistently >50 for most. Others are battlegrounds.

  **6. Blunt Answer:**
  *   **It's Mostly Measuring Your List.** The wording, selection bias, and parameter ambiguity significantly structure the possible responses and disagreements. You're forcing discrete scores onto inherently fuzzy and contested concepts without shared operational definitions. Disagreements revealed will often be about interpretations of *your terms* rather than pure metaphysics.
  *   **The One Change:** **Mandate Operational Definitions BEFORE Scoring.** Before anyone assigns a number to an item, require them to write 1 short sentence defining *exactly* what they mean by that term in this context (e.g., "Gene: Molecular sequence encoding a functional product", "Race: US Census categories", "Acid: Lewis acid"). *Then* score based on *that* definition. This forces clarity, exposes assumptions upfront, and shows if disagreement is about the *concept* or its *definition*. It turns a flaw into a feature, making the calibration about *how definitions drive kind-judgments*.
