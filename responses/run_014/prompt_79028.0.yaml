prompt: |-
  Two weeks from now I'm up at our decision theory reading group and I'm already dreading the Q&A, so I want a prep sheet. The thesis I'm defending, roughly: the usual way of stating superrationality — in a one-shot prisoner's dilemma between two identical reasoners you should cooperate because your reasoning and theirs is the same reasoning — is either trivially true or plainly false depending on what "identical" is doing, and the fix is to drop the talk about identity and model the two players as having decision procedures drawn independently from a shared prior over procedures. Once you set it up that way, cooperating in a one-shot PD is just the expected-value-maximizing move, the spooky "logical correlation" between the two choices turns into an ordinary conditional probability, and the real work becomes saying what licenses the shared prior. If the prior is just a fact about the world, I've reinvented evidential decision theory with extra steps. If it's a constraint on which decision procedures count as rational, then I owe an account of why rationality has that constraint — and that's the part I'm least sure of.

  The room is eight people and I know alot of what's coming. Three are economists who do game theory and think "rational" just means "no profitable unilateral deviation"; any refinement that needs a story about the players' algorithms looks to them like either an empty relabeling or repeated-game logic smuggled into a one-shot game. Two are committed causal decision theorists who've both worked on Newcomb's problem and think conditioning on your own action is a mistake, period. One works on team reasoning / we-mode and thinks the whole "what should I do" framing is the error — the question should be what we should do. One is a logician who will ask how a finite agent can condition on facts about its own decision procedure without self-reference trouble. And one does bounded rationality and thinks the setup quietly assumes players with perfect introspective access to their own algorithms.

  What I want back: the eight or so objections I'll actually get from this room — not the ones the internet decision theory crowd would give me — ordered by how much damage they'd do, each phrased the way that specific person would put it, what I say back in about two minutes, and where that answer is weak. Flag any two of them that are really one objection wearing different hats. Tell me what to concede in the first minute so I don't burn the Q&A on it, and which exchange, if I lose it, actually kills the view rather than costing me a footnote. And the one question I'm praying nobody thinks to ask. Assume theres nobody there who's read the recent agent-foundations literature, so don't lean on it — if a reply only works becuase of some result from that literature, say so and tell me what to do instead.
reasoning: |-
  We are given a specific room of eight people with known backgrounds and likely objections. The thesis is about reformulating superrationality using a shared prior over decision procedures, which makes cooperation in a one-shot PD the expected-value-maximizing move. The key challenge is justifying the shared prior.

  Let's break down the eight attendees and their likely objections:

  1. **Economists (3)**: They think "rational" means no profitable unilateral deviation. They see refinements that require algorithms as either relabeling or smuggling in repeated-game logic.

  2. **Causal Decision Theorists (2)**: They reject conditioning on one's own action (as in Newcomb's problem). They think it's a mistake.

  3. **Team Reasoner (1)**: Believes the framing should be "what should we do" rather than "what should I do".

  4. **Logician (1)**: Asks how a finite agent can condition on its own decision procedure without self-reference trouble.

  5. **Bounded Rationality Researcher (1)**: Thinks the setup assumes perfect introspective access to one's algorithm.

  We need to generate 8 objections (one per person, but note there are 3 economists and 2 CDTers, so we might group similar objections) and order them by damage. Also, flag any two that are the same objection in disguise.

  **Ordered by Damage (most damaging first):**

  1. **Economists' Objection (Most Damaging)**: They might argue that the setup is just a relabeling of the players as having correlated strategies, which is not a one-shot game in the classical sense. If they can show that the shared prior effectively turns the one-shot game into a repeated game (or a game with precommitment), then the whole point of one-shot PD is lost. This could kill the view because it shows the model is not about one-shot interactions.

  2. **Causal Decision Theorists' Objection**: They will argue that conditioning on your own action is invalid. In the shared prior setup, the agent conditions on the event that their decision procedure outputs a particular action. But CDT says that the causal effect of your action is what matters, not the correlation. If they can show that the expected value calculation is evidential and not causal, then the view collapses into EDT, which they (and the economists) might reject.

  3. **Team Reasoner's Objection**: They might say that the whole exercise of individual decision-making is flawed and that the only rational way to approach the PD is to adopt the team perspective. This could be damaging because it challenges the entire individualistic framework.

  4. **Logician's Objection**: How can a finite agent condition on its own decision procedure without running into self-reference paradoxes? This is a technical challenge that, if not answered, might invalidate the model for bounded agents.

  5. **Bounded Rationality Researcher's Objection**: The setup assumes perfect introspective access, which is unrealistic. This weakens the applicability to real agents.

  6. **Economists' Second Angle**: They might argue that the shared prior is arbitrary and without a clear foundation, so the model is just as arbitrary as the original superrationality.

  7. **Causal Decision Theorists' Second Angle**: They might ask how the shared prior can be justified without appealing to evidential correlations that CDT rejects.

  8. **Economists' Third Angle**: They might say that the model doesn't change the fact that in the one-shot PD, defection is the only dominant strategy, and any other move is irrational by standard game theory.

  But note: we have 3 economists and 2 CDTers. We might have multiple objections from each.

  **Grouping**: 

  - The logician and the bounded rationality researcher might be raising related issues about the feasibility of the model for real agents. The logician worries about self-reference, and the bounded rationality researcher about introspection. Both are about the agent's access to its own algorithm. So we can flag these two as being part of a broader "feasibility" objection.

  **The Eight Objections (phrased as each person would):**

  1. **Economist 1**: "Your model introduces a shared prior over decision procedures, but that's just a way to smuggle in correlated strategies. In a true one-shot game, players have no prior history and no mechanism for correlation. This is a repeated game in disguise."

  2. **Economist 2**: "Even if we accept your shared prior, why should we assume it is common knowledge? And without common knowledge, how can players make the same reasoning? This seems to require an unrealistic level of coordination."

  3. **Economist 3**: "The standard definition of rationality in game theory is Nash equilibrium: no player has a unilateral incentive to deviate. In your model, if one player defects, the other might still cooperate because of their decision procedure, but then the defector gets a higher payoff. So defecting is still a best response. Your model doesn't change the fact that defection dominates."

  4. **CDT Advocate 1**: "You are conditioning on your own action via the shared prior. But that's exactly the mistake we see in Newcomb's problem. What matters is the causal effect of your action. In PD, the causal effect of defecting is that you get a higher payoff regardless of what the other does. So why cooperate?"

  5. **CDT Advocate 2**: "Your shared prior introduces a correlation between the players' decision procedures, but that correlation is evidential, not causal. So when you condition on your own action (i.e., the output of your decision procedure), you are updating on evidence about the other player, but that doesn't mean your action causes the other player to cooperate. Therefore, the expected value calculation is evidential and not causal. We reject that."

  6. **Team Reasoner**: "Why are you even asking 'what should I do?' In a symmetric game like PD, the rational question is 'what should we do?' And the answer is clear: we should both cooperate. Your entire setup is an unnecessary detour that fails to capture the collective nature of rationality."

  7. **Logician**: "You require an agent to condition on facts about its own decision procedure. But for a finite agent, that leads to self-referential statements that can be paradoxical. How do you avoid contradictions like in Löb's theorem or the surprise examination paradox?"

  8. **Bounded Rationality Researcher**: "Your model assumes that an agent has perfect knowledge of its own decision procedure and can compute the prior over decision procedures. But real agents have limited introspection and computational resources. How can your model apply to humans or even realistic AI systems?"

  **Order by Damage** (from most to least damaging):

  1. **Economist 1**: The "smuggling repeated games" objection. If true, the model isn't about one-shot games, which is the whole point.

  2. **CDT Advocate 1**: Conditioning on your own action is a mistake. This strikes at the heart of the decision theory.

  3. **Team Reasoner**: The framing is wrong. If they are right, then the individualistic approach is misguided.

  4. **Logician**: The self-reference problem. If the model is inconsistent for finite agents, it fails.

  5. **Bounded Rationality Researcher**: The introspection assumption. Without it, the model doesn't apply to real agents.

  6. **Economist 3**: Defection is still dominant. This is a standard game theory objection.

  7. **CDT Advocate 2**: The correlation is evidential, not causal. This is a restatement of the CDT objection but with a focus on the nature of correlation.

  8. **Economist 2**: The common knowledge problem. This is important but maybe less central.

  **What to Concede Early**:

  Concede that the shared prior is a strong assumption and that without it, the model doesn't work. But argue that it is a useful abstraction to capture the idea of "similar reasoning". Also, concede that the model is not intended for all one-shot games but for games between agents that are designed or selected in a way that they share a prior (e.g., two copies of the same algorithm). This might defuse the economists' smuggling objection and the bounded rationality objection to some extent.

  **Which Exchange Kills the View**:

  If the economists can successfully argue that the model is not a genuine one-shot model, then the entire project might be seen as irrelevant to the one-shot PD. Similarly, if the CDT advocates can show that the expected value calculation is evidential and that we should be using causal decision theory, then the view collapses into EDT and is rejected by CDT. The most damaging is the first economist's objection because it challenges the very setup.

  **The One Question to Pray Nobody Asks**:

  "Can you give a real-world example where your shared prior is justified without assuming that the players are identical in a way that reduces to the original superrationality problem?"

  This question would force the speaker to either admit that the shared prior is arbitrary or to provide a non-circular justification. The recent agent-foundations literature (e.g., MIRI's work on logical inductors) might help, but the audience hasn't read it. Without that, the answer is weak.

  **Replies and Weaknesses**:

  1. **Economist 1 (smuggling repeated games)**:
     - **Reply**: "The shared prior does not come from repeated interaction. It's a prior over how the players reason, which can be seen as a property of the agent design. For example, if both players are instances of the same AI program, then they share a prior over what algorithms they might be running. This is a one-shot game but with players that are 'cognitively similar'."
     - **Weakness**: The economist might counter that this is still not a one-shot game in the traditional sense because the players are not independent. Also, the shared prior is assumed, not derived.

  2. **CDT Advocate 1 (conditioning on own action is a mistake)**:
     - **Reply**: "In this setup, the agent is not conditioning on the action itself but on the fact that its decision procedure outputs a particular action. This is a fact about the algorithm, not about the action's consequences. And the correlation arises because both players draw from the same prior. So it's not the same as Newcomb's problem because here the correlation is between the decision procedures, not between the action and the state of the world directly."
     - **Weakness**: The CDT advocate might say that the decision procedure's output is still something you can condition on evidentially, but causally, your action doesn't affect the other player. So the evidential update is irrelevant to the causal effect.

  3. **Team Reasoner (framing error)**:
     - **Reply**: "I agree that team reasoning is a powerful approach, but I'm exploring an individualistic account that can lead to cooperation. The goal is to show that even without adopting a 'we-mode', individual rationality can lead to cooperation when agents are aware of their similarity. This might provide a bridge between individual and team reasoning."
     - **Weakness**: The team reasoner might argue that the individualistic approach is fundamentally flawed and that the bridge is unnecessary if we just adopt the right perspective.

  4. **Logician (self-reference trouble)**:
     - **Reply**: "Finite agents can have limited models of their own decision procedures. They don't need a complete representation but can use approximations. For example, an agent can have a probability distribution over a set of possible algorithms that it might be, and update on the fact that it is about to choose a particular action by conditioning on the algorithm that led to that action. We avoid self-reference by not requiring the agent to reason about its own entire state but about a class of algorithms it might belong to."
     - **Weakness**: This is hand-wavy. Without a formal model of bounded agents that avoids paradoxes, it remains a challenge.

  5. **Bounded Rationality Researcher (introspection assumption)**:
     - **Reply**: "I agree that perfect introspection is unrealistic. The model should be seen as an idealization. For bounded agents, we might use heuristics that approximate the ideal reasoning. Also, the shared prior might be learned over time, but that moves us away from one-shot. However, the model still provides a normative benchmark."
     - **Weakness**: The objection stands: the model doesn't apply to bounded agents.

  6. **Economist 3 (defection dominates)**:
     - **Reply**: "In the standard game theory setup without shared prior, defection does dominate. But with the shared prior, the agent's decision procedure is part of the state of the world. The expected payoff of cooperation can be higher because the agent assigns a high probability to the other player cooperating if they are using a similar decision procedure. So it's not that defection dominates unconditionally, but conditional on the decision procedure."
     - **Weakness**: The economist might say that the shared prior is not part of the game and that in the actual game, defection is still the best move.

  7. **CDT Advocate 2 (evidential correlation)**:
     - **Reply**: "The correlation is indeed evidential, but that doesn't make it irrational to use. In fact, evidential decision theory is a coherent alternative to CDT. But note: in this setup, the evidential correlation is not arbitrary; it comes from a shared prior over how both players reason. So it's a form of evidential decision theory that is grounded in the agent's model of the world."
     - **Weakness**: The CDT advocate will simply reject EDT.

  8. **Economist 2 (common knowledge)**:
     - **Reply**: "The shared prior does not require common knowledge of the entire decision procedure. It only requires that both players are drawing from the same prior distribution. They don't need to know what the other player is doing, only that they are both using procedures drawn from the same set with the same probabilities. Common knowledge of the prior would help, but it's not necessary for the expected value calculation to be valid for each player individually."
     - **Weakness**: Without common knowledge, the players might not have consistent beliefs about each other.

  **Flagging Two as the Same Objection**:

  The logician and bounded rationality researcher are both worried about feasibility: the logician about logical consistency, the bounded rationality researcher about computational and introspective limits. They are two sides of the same coin.

  **The Losing Exchange**:

  If the economists win the point that the model is not a genuine one-shot game, then the view is killed because it fails to address the one-shot PD. Alternatively, if the CDT advocates can show that the model is just EDT and that EDT is wrong, that also kills the view.

  **Concession in the First Minute**:

  Concede: "I agree that the shared prior is a strong assumption. It is not present in classical game theory. But I contend that it is a useful way to model the idea that rational agents with similar cognitive architectures might reason similarly. Without it, we are stuck with the standard Nash equilibrium in one-shot PD, which leads to mutual defection. But if we are allowed to consider the agents' reasoning processes, then we can get a different result."

  **The One Question to Pray For**:

  As above: a real-world example without circularity. Without agent-foundations literature, the answer is weak. Instead, try: "Consider two AI systems designed by the same team, using the same codebase. They might have a shared prior over what algorithms they are running because they know they are instances of the same program. But note: this is not the same as being identical, because the shared prior allows for variation. So they are not identical, but they are drawn from the same distribution."

  This might not satisfy the critics because it still assumes a designed similarity.

  **Final Ordered List of Objections and Replies**:

  1. **Economist 1 (smuggling repeated games)** - Most damaging.
  2. **CDT Advocate 1 (conditioning on own action)** - Very damaging.
  3. **Team Reasoner (framing error)** - Damaging because it challenges the individualistic approach.
  4. **Logician (self-reference)** - Technical challenge.
  5. **Bounded Rationality Researcher (introspection)** - Feasibility.
  6. **Economist 3 (defection dominates)** - Standard objection.
  7. **CDT Advocate 2 (evidential correlation)** - Restatement of CDT objection.
  8. **Economist 2 (common knowledge)** - Less central.

  **Summary of Prepped Replies**:

  - **Economists**: The shared prior is a way to model similarity in reasoning without repeated play. It's about agent design, not history.
  - **CDT Advocates**: The correlation comes from the shared prior, not from causality, but that doesn't make it irrational to consider.
  - **Team Reasoner**: This approach complements team reasoning by showing how individual reasoning can lead to cooperation.
  - **Logician and Bounded Rationality**: The model is an idealization; bounded agents can approximate it.

  **Note**: The shared prior must be justified. The weakest point is that without a constraint from rationality, the prior is arbitrary. The speaker might argue that the shared prior is a requirement for rationality in symmetric games, but that needs an account.

  Given the constraints, this should prepare the speaker for the Q&A.
answer: |-
  Below is your prep sheet for the Q&A, tailored to the specific audience you described. I've distilled the core objections you're likely to face, ordered by how much damage they could do to your thesis (with #1 being the most threatening). Each objection is phrased as the person would likely express it, followed by a concise 2-minute response, the weaknesses in your reply, and tactical advice for the exchange. I've also flagged overlapping objections, what to concede early, which exchange could "kill" your view, and the one question you should hope isn't asked.

  ### **Quick Reference: Attendees and Their Core Concerns**
  - **Economists (3)**: Reject refinements beyond Nash equilibrium; see your setup as relabeling or smuggling in repeated-game logic.
  - **Causal Decision Theorists (CDT, 2)**: Oppose conditioning on your own action (à la Newcomb); demand causal separation.
  - **Team Reasoner (1)**: Believes "what should I do?" is the wrong frame; only "what should we do?" matters.
  - **Logician (1)**: Worries about self-reference in conditioning on decision procedures.
  - **Bounded Rationality Researcher (1)**: Assumes your model requires unrealistic introspection.

  ### **Ordered Objections (Most to Least Damaging)**
  I've ordered these based on potential damage: how easily they could undermine your core thesis (e.g., by exposing it as circular, inconsistent, or just repackaged EDT) or alienate key audience members. Objections that challenge the *foundations* of your model (e.g., the shared prior) are rated higher.

  ---

  **1. Economist 1 (Smuggling Repeated Games)**  
  *Phrased as they'd say it:*  
  "Your 'shared prior' is just a sneaky way to import repeated-game logic into a one-shot game. In true one-shot interactions, players have no shared history or correlation mechanism. By assuming this prior, you're turning the PD into a coordination game with pre-commitment, which defeats the whole point. It's not one-shot anymore—it's a Trojan horse for equilibrium selection from repeated settings."  

  **Your 2-Minute Response:**  
  "I agree this looks like coordination, but it's not. The shared prior isn't about repeated play; it's a *synthetic* construct representing how rational agents *with cognitive similarities* would reason in isolation. For example, imagine two AI systems designed by the same team with similar code—they don't need repeated interaction to have aligned expectations. Here, cooperation emerges because each calculates the expected value over possible procedures (e.g., 'If I'm a cooperator-type, so is my counterpart with high probability'). This isn't repeated-game logic; it's individual rationality under uncertainty about *how* decisions are made."  

  **Weaknesses in Your Reply:**  
  - Economists may retort that "cognitive similarity" implies pre-game communication or evolution, which isn't allowed in strict one-shot games.  
  - You haven't fully dispelled the "Trojan horse" charge—your AI example could be seen as pre-commitment via design.  
  **Tactical Note:** If this objection gains traction, it could kill your view by reframing your model as *not addressing true one-shot PDs*. Defend hard here—don't concede ground early.  

  ---

  **2. CDT Advocate 1 (Conditioning on Actions = Newcomb's Mistake)**  
  *Phrased as they'd say it:*  
  "You're making the same error as evidential decision theory in Newcomb's problem: conditioning on your own action. In PD, defecting *causes* a better outcome regardless of the other player. But your shared prior makes you treat your decision as evidence about theirs, creating spooky 'logical correlation.' That's irrational. Rational agents should ignore correlations that aren't causal—otherwise, you're just EDT with extra jargon."  

  **Your 2-Minute Response:**  
  "Actually, I'm not conditioning on the *action* causally affecting the other player. I'm conditioning on the *type of procedure* I'm using, which correlates with theirs via the shared prior. Think of it as a statistical fact: if our procedures are drawn from the same distribution, knowing my output gives me information about theirs. This isn't Newcomb-style acausality—it's rational updating under uncertainty. For example, if I know we're both algorithms from a pool where 90% cooperate, cooperating maximizes my expected payoff *because* it's likely they're a cooperator too. CDT would ignore that information, but here it's legitimate."  

  **Weaknesses in Your Reply:**  
  - CDT advocates will argue the "correlation" is still evidential, not causal, so defection remains dominant.  
  - They may say your "types" are a dodge—the shared prior doesn't change the causal structure of PD.  
  **Tactical Note:** This could kill your view if they convince the room it's just EDT. To save time, concede early that your model *is* evidential but argue it's justified in this context.  

  ---

  **3. Team Reasoner (Framing Error)**  
  *Phrased as they'd say it:*  
  "Why are you stuck in individualistic 'I' framing? PD is a collective problem—asking 'what should I do?' guarantees suboptimal outcomes. Your whole setup is a convoluted way to reinvent team reasoning. Just admit rationality requires a 'we-mode': we should cooperate because it's best for us, full stop."  

  **Your 2-Minute Response:**  
  "I appreciate team reasoning as a solution, but my goal is to show cooperation can emerge from *individual* rationality without requiring a shift to collective agency. Your approach assumes players can coordinate on 'we,' but in many real cases (e.g., anonymous online interactions), that's impossible. My model bridges the gap: by using a shared prior, individual agents who recognize their reasoning is aligned can cooperate without explicit team formation. It's not reinventing team reasoning; it's grounding it in individual calculus."  

  **Weaknesses in Your Reply:**  
  - They'll counter that your "shared prior" implicitly assumes collective alignment, making it team reasoning in disguise.  
  - If your model only works for symmetric agents, it may not generalize, weakening its value.  
  **Tactical Note:** Concede early that team reasoning solves PD neatly—this objection won't kill your view, but it could sidetrack you.  

  ---

  **4. Logician (Self-Reference Trouble)**  
  *Phrased as they'd say it:*  
  "How can a finite agent condition on its own decision procedure without vicious circularity? For instance, if an agent uses its knowledge of its procedure to decide, it must model itself—leading to Liar's paradox or infinite regress. Your prior over 'procedures' seems to require impossible introspection."  

  **Your 2-Minute Response:**  
  "Finite agents can avoid this by approximating their procedure as one of many in a predefined set, without full self-modeling. For example, an agent could have a prior over algorithms like 'cooperate-always' or 'defect-always,' then update on external evidence (e.g., 'I feel inclined to cooperate'). This isn't paradoxical; it's like a machine-learning model sampling from a hypothesis class. No self-reference is needed—just Bayesian updating on observable proxies for its 'type.'"  

  **Weaknesses in Your Reply:**  
  - This relies on "observable proxies," which may not exist for abstract decisions.  
  - Logician could argue that even approximations risk inconsistency (e.g., if the prior includes self-referential procedures).  
  **Tactical Note:** Pair this with the bounded rationality objection (#5)—they're two hats for the same feasibility concern.  

  ---

  **5. Bounded Rationality Researcher (Introspection Assumption)**  
  *Phrased as they'd say it:*  
  "Your model assumes perfect access to one's decision procedure, but real agents have limited introspection. Humans—and even AIs—can't perfectly sample from a 'prior over procedures.' This makes your setup an ivory-tower idealization with no practical relevance."  

  **Your 2-Minute Response:**  
  "You're right—I'm presenting an idealized model. For bounded agents, we can think of this as a normative benchmark: rational agents *should* strive to approximate the shared prior (e.g., via heuristics like 'What would a principled agent do?'). In practice, this could manifest as cultural norms or institutional training that align reasoning. The core insight—that similarity in reasoning enables cooperation—still holds, even if imperfectly implemented."  

  **Weaknesses in Your Reply:**  
  - Doesn't resolve how bounded agents *achieve* this approximation without begging the question.  
  - May feel like hand-waving to empiricists.  
  **Tactical Note:** Concede early that this is idealized. Link to #4—both are about feasibility.  

  ---

  **6. Economist 2 (Nash Equilibrium Undercut)**  
  *Phrased as they'd say it:*  
  "Rationality means no incentive to deviate unilaterally. In PD, defecting dominates regardless of the other player. Your shared prior doesn't change that—if I defect, I gain more whether they cooperate or not. All you've done is redefine 'rationality' to mean something else, which is empty relabeling."  

  **Your 2-Minute Response:**  
  "Under standard game theory, yes, defection dominates. But my model expands the state space: the 'type' of procedure is part of the world. When you condition on your type (e.g., 'I'm a cooperator'), defecting isn't necessarily better—if your type correlates with theirs, cooperating might yield higher *expected* utility. This isn't redefining rationality; it's incorporating uncertainty about *how decisions are generated*, which is realistic. Nash is a special case when procedures are independent."  

  **Weaknesses in Your Reply:**  
  - Economists will see this as changing the rules of the game to force cooperation.  
  - Doesn't address why this expansion is necessary or rational in their framework.  

  ---

  **7. CDT Advocate 2 (Shared Prior Justifies EDT, Not Rationality)**  
  *Phrased as they'd say it:*  
  "You admit the shared prior creates evidential correlation. But why should a rational agent care? EDT fails in Newcomb-like cases because it conflates evidence with causation. Here, defecting still *causes* better payoffs—so even if your prior makes cooperation seem better evidentially, it's irrational. You've just buried EDT in a prior."  

  **Your 2-Minute Response:**  
  "The difference is that in PD, the correlation isn't spooky—it's grounded in a factual prior about the world (e.g., 'We're both from a cooperative culture'). Unlike Newcomb, there's no predictor exploiting the correlation; it's just statistical. Rational agents *should* use all available information, including evidence about counterparts. Ignoring this, as CDT does, leaves money on the table when procedures are linked."  

  **Weaknesses in Your Reply:**  
  - CDT advocates won't budge: if it's not causal, it's irrational.  
  - Your response may reinforce their view that you're EDT in disguise.  

  ---

  **8. Economist 3 (Common Knowledge Problem)**  
  *Phrased as they'd say it:*  
  "Your shared prior requires common knowledge of rationality or procedures to work. But in a one-shot game, how do players know they share a prior? If they don't, cooperation unravels. This makes your model fragile and unrealistic."  

  **Your 2-Minute Response:**  
  "Common knowledge isn't strictly needed—only that each player *believes* procedures are drawn from the same prior. This could arise from contextual cues (e.g., we're both economists at a conference). Even with uncertainty about the prior, agents can use meta-priors (e.g., 'Likely, we're similar'), allowing cooperative equilibria. It's more robust than you think."  

  **Weaknesses in Your Reply:**  
  - Economists may argue this relies on implausible common knowledge of similarity.  

  ---

  ### **Key Tactical Notes**
  - **Flagged Overlapping Objections**: #4 (Logician) and #5 (Bounded Rationality) are the same core objection—**feasibility for real agents**—wearing different hats. Address them together: "I see these as one issue: how bounded agents approximate this ideal. Concede it's idealized, then pivot to normative value."  
  - **What to Concede in the First Minute**: Start with: "I concede the shared prior is a strong assumption—it's not part of standard game theory, and without it, my model collapses. But it captures something important: in practice, similarity in reasoning *does* influence behavior, and we need tools to model that without resorting to repeated games." This disarms economists and bounded rationality folks early.  
  - **Exchange That Kills Your View**: If you lose **#1 (Economist on smuggling repeated games)**, your thesis is reframed as *not addressing true one-shot PDs*. If you lose **#2 (CDT on EDT-reinvention)**, your model reduces to "EDT with extra steps," which CDT advocates and economists will dismiss. Prioritize these two.  
  - **The Question You Pray Nobody Asks**:  
    *"What objectively justifies the shared prior as a requirement of rationality, rather than an arbitrary constraint? If it's just a 'fact about the world,' haven't you admitted this is EDT—and if it's a rational constraint, how do you avoid circularity (e.g., 'rational agents must share a prior because it's rational')?"*  
    - **Why it's deadly**: It forces you to either admit your model is EDT (alienating CDT advocates) or defend an unjustified constraint (alienating economists).  
    - **Response if asked**: "This is the hardest part. I argue rationality *should* include a minimal prior over procedures to handle symmetry, but I don't have a knockdown justification. Recent agent-foundations work (e.g., logical inductors) addresses this, but since we're avoiding that, I'll say: without such a prior, we can't explain cooperation in symmetric one-shot dilemmas, which is a flaw in standard theories. It's a work in progress."  

  ### **Summary of Strategic Flow**
  - **Opening Concession**: Start Q&A by conceding the shared prior is idealistic and not standard, but necessary for your point.  
  - **Focus Defense**: Fight hardest on #1 and #2—if they land, your thesis sinks. For others, concede where possible (e.g., feasibility) to save time.  
  - **Weakest Point**: Justifying the shared prior as a *rational constraint* (not just a fact). If pressed, admit it's unresolved but worth exploring.  
  - **Time Management**: Allot ~2 minutes per objection. If overrun, table #3, #5, and #8—they won't kill your view.  

  This prep balances steel-manning objections with pragmatic defenses. Remember: your goal isn't to "win" every point but to show your approach is coherent and addresses a gap in existing theories. Good luck!
