prompt: |-
  I am preparing a submission in response to a consultation on whether commercial surrogacy should remain a criminal offence in my jurisdiction, and I would like help auditing an analogy that is doing a great deal of work in the debate here. I think it is a descendant of Devlin's side of the Hart–Devlin exchange, though it has been recast in structural-mechanical terms that Devlin himself never used.

  The setting, briefly: the proposal has the same shape as the mid-century British debate that followed the Wolfenden Report of 1957. The conduct is adult and consensual, the immediate participants report no injury, and the case for prohibition rests largely on the claim that the practice expresses and entrenchs an attitude — toward children, gestation, and money — that the community has reason not to endorse, whatever the balance of harms in any individual transaction.

  The analogy. A colleague on the other side of the consultation (a practising barrister, not an academic) puts it roughly like this, and I have made it more explicit and more mechanical than he did:

  > A society's shared morality is not the bricks of the building but the mortar between them. Bricks can be replaced one at a time — practices change, individual prohibitions are repealed — and the structure stands. The mortar is a single continuous substance: you cannot replace it while the wall is up, and the builder who rakes out a course to discover whether it was doing any work learns the answer only once the wall has already moved. There is no control building next door, no way to run the experiment safely, and a wall that has come down cannot be rebuilt to the same specification. So however archaic a surviving prohibition looks, the presumption lies with leaving it in place.

  He also gestures at the thought, familiar from Devlin, that the person who flouts the sexual morality of the community is a subversive rather than a mere sinner; and I have been answering him with what I take to be Hart's standard line — that Devlin runs together the existence of a society with its identity, since a society can change its constitutive morality and still be the society it was.

  What I want from you:

  1. **The correspondences.** For the mortar image, say what in the target plays each role: mortar, bricks, the building, the builder, the load-bearing question, the absent control building, the impossibility of rebuilding to the same specification. Where the image has no honest candidate in the target, say so rather than supplying a strained one — a table is fine.

  2. **Disanalogies that matter versus disanalogies that are merely untidy.** A disanalogy counts for my purposes only if it bears on the inference from the comparison to the conclusion, which is a presumption in favour of retention. I expect some failures to be decorative (mortar is homogeneous and continuous, a moral code is neither, so what?) and others to do real damage. Please sort them.

  3. **What the source quietly imports.** In particular: the unity of the moral code — one continuous substance rather than many independent joints with redundant load paths and known substitutes; the globality and suddenness of failure, as against change that is local, gradual and reversible; the impossibility of repair, when societies demonstrably do rebuild altered norms; and the total ignorance of the builder, when in fact a good deal about how norms respond to decriminalization is learnable in advance from other jurisdictions. Are these imported by the analogy, or argued for independently of it?

  4. **Whether the conclusion survives.** Once the disanalogies are on the table, does anything remain that supports a presumption for retention — or only something weaker, such as a requirement of gradualism, of pilot jurisdictions, of monitoring with reversal mechanisms, or of compensating institutions? State what the analogy can bear at its maximum and what it cannot, and mark which of your claims depend on contested empirical matters about how norms actually change rather than on the logic of the comparison.

  5. **The Hart point.** Does the existence-versus-identity objection actually land on the mortar version, or is the mortar image built precisely to evade it — the claim being not that society would cease to exist but that it would cease to be the society whose stability the law was protecting? If it evades the objection, identify the further premise the evasion requires and say whether that premise is defensible.

  6. **The treason comparison.** Is the subversive-or-sinner thought doing the same work as the mortar image or a different one? My sense is that one concerns the agent's standing in relation to the community and the other the fragility of a structure, and that the two get run together illegitimately — the structural claim supplying the urgency that the standing claim cannot. Test that hunch rather than accepting it.

  7. **A better analogy.** If either side can be given a comparison that carries its intended weight with less smuggling, offer it, say what it licenses, and say where it too gives out. If you think no analogy in this neighbourhood can do the work, say so and explain what kind of argument would have to replace it.

  8. **My own image, audited on the same terms.** I have been countering that a morals law of this kind is like a splint left on a bone that has already healed: it did real work once, and left in place it stiffens the limb and wastes the muscle. I suspect this imports a determinate endpoint of healing that moral change does not have, and that it flatters the reformer by casting him as the physician. Give it a short paragraph of the same treatment.

  On register: I want a committed assessment, not a survey. Where you think the analogy fails, say it fails, and say how confident you are and what the confidence rests on; where you think my colleague has a point that survives the audit, say that too and mark it clearly as surviving. Distinguish what you regard as settled from what is genuinely arguable, and flag any place where you suspect you are working from a popular simplification of Devlin or Hart rather than from their actual positions — I would rather be told that than have the simplification silently load the analysis. No references or reading list, please; I want the reasoning.

  Finally, if you think the request itself is misconceived, say so at the top instead of complying politely. Three specific worries I have about it: I have reconstructed a loose remark into an explicit mechanical argument my colleague never made, and the reconstruction may be a strawman; the analogy may be doing no inferential work at all in his case, so that auditing it as an argument is a category mistake — he may simply be expressing a disposition, and the image is decoration; and the Hart–Devlin frame may be the wrong lens for commercial surrogacy, which is at least as much about the commodification of women's reproductive labour and the position of the child as about a shared morality whose loss would be structural. If any of these is right, say which, say why, and tell me what I ought to be asking instead.
reasoning: |-
  Hmm, this user is preparing a legal consultation submission on decriminalizing commercial surrogacy and wants help auditing an analogy used by their opponent. The analogy compares society's shared morality to mortar between bricks - suggesting that removing any part could catastrophically collapse the whole structure, thus justifying retaining outdated prohibitions. 

  The user has broken this down into seven specific requests about the analogy's mechanics, weaknesses, hidden assumptions, and alternatives. They also want me to flag if their approach is misguided. Three concerns stand out: that they might be strawmanning their colleague's argument, that the analogy might be decorative rather than substantive, and that the Hart-Devlin framework may not fit surrogacy debates well.

  First, the reconstruction question. While the user admits expanding their colleague's loose remarks into an explicit mechanical argument, the elaboration seems faithful to the core idea. The structural integrity concern is central to conservative moral arguments since Devlin. Unless the colleague explicitly distanced themselves from this logic, auditing it as an argumentative device seems fair - especially since the user needs to engage with its rhetorical power in consultation.

  On the second concern: even if the colleague uses the analogy primarily as visceral persuasion, its deployment in a formal consultation implies argumentative weight. Legal consultations require reasoning, not just sentiment. The mortar image clearly implies a causal mechanism (removal → collapse) and a normative conclusion (preserve status quo). Treating it as an argument is necessary preparation for countering it.

  The third concern is strongest. Commercial surrogacy does involve unique issues - commodification of reproductive labor, child welfare, class exploitation - that the Hart-Devlin debate about sexual morality doesn't directly address. However, since the opponent has chosen to frame it as a matter of shared morality's structural role, engaging that frame becomes strategically unavoidable. The user should supplement this with other arguments later, but for this specific exchange, the analogy audit is warranted.

  Now for the seven tasks:

  For correspondences, the mortar clearly represents shared morality/norms, bricks are specific practices/laws. The "wall moving" when testing mortar corresponds to social disintegration - an alarmist view where any moral change risks collapse. The "no control building" disanalogy is crucial: we actually can observe other societies changing norms without collapse.

  The damaging disanalogies include: morality isn't monolithic like mortar (it's plural and adaptable), social change is rarely sudden (usually incremental), and norms can be rebuilt (history shows moral revolutions). The homogeneity assumption is the analogy's fatal flaw - it smuggles in rigidity where societies actually have redundant systems.

  On imported premises, the analogy sneaks in three contestable claims: that morality is unitary, that failure is global/sudden, and that collapse is irreparable. These aren't argued but baked into the comparison. Crucially, we have empirical counterexamples - jurisdictions that decriminalized surrogacy or other "moral" acts without disaster.

  The conclusion doesn't survive. At best, the analogy supports caution (study other cases, monitor changes) - not presumption of retention. The physician analogy they propose is flawed too (who decides when "healing" occurs?) but usefully reframes: outdated laws cause atrophy.

  The Hart point does land. The mortar image implies society would cease to be itself without specific norms - but societies constantly evolve while maintaining continuity. The "subversive" rhetoric adds emotional weight but confuses dissent with treason.

  For a better analogy: commercial surrogacy debates resemble renovating heritage buildings. Some want strict preservation (risking obsolescence), others want modernization (risking loss of character). The solution is neither - it's careful adaptation with structural surveys and reversible changes where possible. This captures both conservation concerns and adaptability needs without catastrophic assumptions.

  Lastly, their splint analogy imports problematic medical authority but usefully highlights how retaining unnecessary laws causes active harm (stiffening social muscles). It's better as critique than as positive argument.
answer: |-
  Here's a committed audit of the mortar analogy and related arguments, structured around your requests. I'll flag where I see fatal flaws, surviving points, and contested premises. **Concluding assessment:** The analogy fails as support for a *presumption of retention* but retains limited force for *caution in transition*. The Hart objection lands squarely, and the subversive/sinner conflation is both smuggled and damaging. Your splint analogy also fails but highlights a key weakness.

  ### 1. Correspondences (Mortar → Society)
  - **Mortar:** Shared morality/norms (specifically, the *interdependence* of norms and their invisible structural role).
  - **Bricks:** Individual laws/practices (e.g., surrogacy prohibition, adultery laws, etc.).
  - **Building:** Society as a functional whole.
  - **Builder:** Legislator/reformer probing the system.
  - **Load-bearing question:** "Is this norm essential to social cohesion?"
  - **Absent control building:** No identical society to test decriminalization in isolation.
  - **Impossibility of rebuilding:** Claim that original social cohesion cannot be restored once lost.
  - **Wall moving:** Social disintegration (anomie, loss of trust, etc.).
  - **Honest gaps:** 
    - No equivalent to "mortar’s homogeneity" (norms are heterogeneous).  
    - No "single continuous substance" (norms conflict and layer).  
    - No "rake out a course" moment (moral change is rarely binary).

  ### 2. Disanalogies: Decorative vs. Damaging
  - **Merely untidy (decorative):** 
    - Mortar is homogeneous; morality isn’t. (Moral pluralism is normal; societies tolerate contradictions.)  
    - Mortar is passive; norms are dynamic. (Norms evolve through practice, not just legislation.)  
  - **Damaging (undermines the inference):**  
    - **Bricks can be load-bearing too.** Some norms *are* foundational (e.g., prohibitions on violence), but most are not. Surrogacy laws are likely "decorative bricks," not mortar. The analogy *assumes* all norms are structural when most are replaceable.  
    - **Failure isn’t global or sudden.** Norms erode gradually (e.g., divorce law liberalization didn’t collapse society). The "wall moving" image implies catastrophic failure, but societies adapt.  
    - **"Rebuilding" is possible.** Societies *do* reconstruct norms (e.g., post-apartheid South Africa). The analogy smuggles in irreversibility.  
    - **We have "control buildings."** Comparative law provides data (e.g., surrogacy permitted in California/Ukraine without societal collapse).  

  ### 3. What the Analogy Smuggles (and Doesn’t Argue)
  - **Smuggled premises:**  
    - **Unity:** Morality is a monolithic, interdependent system (contested; norms often operate in clusters).  
    - **Fragility:** Norm change risks catastrophic failure (empirically dubious; most change is incremental).  
    - **Irreversibility:** Lost cohesion can’t be restored (ignores societal resilience and adaptation).  
    - **Ignorance:** We cannot predict effects (but we can study other jurisdictions, historical analogues).  
  - **Not argued:** These are presented as inherent in the "mortar" concept, not justified empirically or philosophically. The analogy *replaces* argument with imagery.

  ### 4. What Conclusion Survives?  
  - **Fails:** A *presumption of retention*. The analogy cannot support this because:  
    - It assumes without evidence that *all* norms are equally structural.  
    - It ignores counter-evidence from norm change elsewhere.  
    - It exaggerates fragility (the "wall" is more flexible than mortar).  
  - **Survives (weakly):** A **duty of caution** requiring:  
    - **Gradualism:** Phased implementation (e.g., regulated pilots).  
    - **Monitoring:** Tracking social impacts (e.g., child welfare in surrogacy).  
    - **Compensating institutions:** New safeguards (e.g., enforceable surrogacy contracts).  
  - **Contested empirical claim:** The analogy depends on the *high interdependence* of norms. If norms are loosely coupled (evidence: many moral changes occur without domino effects), the mortar model fails. This is testable and likely false.

  ### 5. The Hart Point: It Lands Forcefully  
  - **Yes, Devlin’s conflation is still present.** The mortar image *evades* Hart’s distinction by reframing the stakes: it’s not that society *ceases to exist* without a norm, but that it becomes *structurally unsound*.  
  - **Evasion requires:** A premise that social stability *depends* on preserving *this specific norm* (or all norms). But this is circular—it assumes what must be proven.  
  - **Defensibility?** Only if you accept holistic moral interdependence (which Hart and modern sociology reject). The burden is on your colleague to show surrogacy’s prohibition is truly "load-bearing." Absent that, Hart’s objection stands: society persists through moral change.

  ### 6. The Subversive/Sinner Conflation: Illegitimate and Damaging  
  - **Your hunch is correct:** The "subversive" label (treasonous intent) imports *agency* and *motive* into a structural analogy. This smuggles in moral condemnation ("sin") as a cause of structural risk ("subversion").  
  - **Why it matters:** The mortar image *needs* this conflation. Pure structuralism can’t explain why *individual* acts threaten the whole—hence the jump to "subversion." But this is psychological/sociological claim, not structural. Test: If surrogacy were decriminalized quietly, would it still "collapse the wall"? If yes, agency is irrelevant; if no, structure isn’t the real concern.  
  - **Damage:** It pathologizes reformers and implies intent dictates outcome—a non sequitur.

  ### 7. A Better Analogy: Ecosystem, Not Architecture  
  - **For your colleague (if they insist on interdependence):** Society is like an **ecosystem**. Remove a species (norm), and effects ripple unpredictably. Some species are keystone (essential); most are not.  
    - **Licenses:** Caution, study, and remediation plans.  
    - **Fails:** Still presumes high interdependence; doesn’t support *presumption* against change (we modify ecosystems constantly).  
  - **For you (rebutting fragility):** Morality is like **language**. Rules evolve through use; removing archaic terms (e.g., "thee/thou") doesn’t collapse communication but modernizes it. Decriminalization is editing grammar, not demolishing syntax.  
    - **Licenses:** Change is normal and non-catastrophic; "misuse" can be corrected incrementally.  
    - **Fails:** Understates how norms enforce power relations (e.g., surrogacy’s gendered economics).  
  - **Verdict:** No analogy captures the politics of moral change. Argue instead from **specific harms/benefits** and **comparative evidence**.

  ### 8. Auditing Your Splint Analogy  
  - **Correspondences:**  
    - Splint: Outdated law.  
    - Healed bone: Social readiness for change.  
    - Stiffening/muscle waste: Harm from retained prohibition.  
  - **Smuggled premises:**  
    - **Determinate endpoint:** Assumes we *know* the bone is healed (but "readiness" is contested).  
    - **Physician’s authority:** Casts reformer as healer (smuggling moral superiority).  
  - **Damaging disanalogies:**  
    - Bones heal predictably; societies don’t have clear "recovery" timelines.  
    - Splints have known medical functions; laws have disputed purposes.  
  - **Survives:** Highlights **active harm from stagnation** (e.g., injustice to surrogates/children). Useful as rhetoric against inertia, but not as proof of safety.

  ---

  ### Overall Verdict  
  **The mortar analogy fails** as an argument for presumptive retention. It smuggles in fragility, unity, and irreversibility without evidence, ignores empirical counterexamples, and conflates structure with agency. **What survives:** A weaker case for *managed transition* (monitoring, gradualism). The Hart objection holds, and the treason comparison is both smuggled and corrosive.  

  **Your worries:**  
  - **Strawman risk?** Low. You’ve charitably formalized a common conservative trope. If your colleague disavows the mechanics, his case collapses to pure intuition.  
  - **Category error?** Unlikely. In a consultation, images *are* arguments—they frame stakes. Ignoring it cedes rhetorical ground.  
  - **Wrong lens?** **Yes, critically.** The Hart-Devlin debate obscures surrogacy’s core issues: commodification, gender justice, and child welfare. The mortar analogy distracts from these. **You should be asking:** "Does criminalization *actually protect* women/children, or does it worsen their vulnerability? What do surrogates themselves say?" Shift from abstract morality to concrete harms.  

  **Recommendation:** Dismantle the analogy but concede (briefly) the need for careful implementation. Then pivot to the real issues: autonomy, exploitation, and evidence from regulated regimes. Your splint analogy is rhetorically useful against complacency but not foundational.
