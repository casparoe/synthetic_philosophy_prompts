prompt: |-
  I'm grading a student's answer on cognitive penetration of perception. Here's the question i asked: "In the debate over cognitive penetration of perception, what is the difference between the strong and weak versions of the penetration claim, and why does this distinction matter for the debate between penetration theorists and anti-penetrationists?"

  Here's the student's answer:

  Strong penetration is when the content of a belief literally becomes part of the content of a perceptual experience, so that the experience itself has a belief-shaped content. Weak penetration is when a belief causally influences perceptual processing but doesn't change the content of the experience. This distinction matters because anti-penetrationists argue that what looks like strong penetration is actually just perceptual bias, which is a kind of weak penetration. Penetration theorists argue that strong penetration is real by pointing to cases where beliefs seem to change what we see, not just how we process what we see.

  Can you grade this answer out of 10 and give me specific comments on what the student got right and what they got wrong? i want a point by point assessment, not just a general impression.
