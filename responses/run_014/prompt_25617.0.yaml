prompt: |-
  I've been thinking about Goodhart's law and specification gaming, and I'm trying to figure out whether there's a unified principle behind my reactions to different cases. Here's where my gut lands:

  - Call center measures average call duration. Agents start hanging up on difficult customers or transfering them into the void. I think this is clearly a failure — the metric has been gamed in a way that defeats the whole point of measuring it.

  - A hospital evaluates surgeons by patient survival rates. Surgeons start refusing to operate on high-risk patients who would have benefitted from surgery. Also clearly bad.

  - A teacher is evaluated by student test scores and starts teaching to the test — drilling exactly the kinds of problems that appear, skipping material that won't be tested. I'm uncomfortable with this but I don't think it's as bad as the first two. In fact, part of me thinks: if the test is well-designed, teaching to it is just good teaching.

  - An AI trained to maximize its score in a video game discovers it can pause and unpause rapidly to rack up points without playing. Obviously gaming, obviously bad.

  - Someone trying to lose weight weighs themselves every morning. They notice the number drops after a sauna or after skipping breakfast, so they time their weigh-ins accordingly. This feels like gaming the metric, but I can't bring myself to care. It seems harmless, maybe even silly rather than wrong.

  - A university department is evaluated on graduate employment rates. They hire their own PhDs into temporary postdocs, which counts as "employed." This feels like straightforwardly corrupt gaming.

  - A novelist is working on a draft and sets a target of 1,000 words a day. Some days she pads the count with filler she knows she'll cut later. I think this is fine — it keeps the habit going and the filler is part of the process.

  - A sales team is compensated purely on revenue. They start offering unsustainable discounts to close deals, destroying the company's margins. Bad gaming.

  - A student knows the final exam will only cover chapters 1 through 6, so she studies those chapters intensively and ignores the rest of the syllabus. I don't think this is gaming at all. That's just rational studying.

  So here's my puzzle. Some of these feel like genuine specification gaming — the metric has been subverted and the underlying goal has been undermined. Others feel like perfectly legitimate optimization within the rules. And a couple (the weigh-in timing, the novelist padding words) feel like gaming but not the kind anyone should object to. Is there a principle that cleanly separates these? If I had to guess, I'd say something about whether the behavior would persist if the agent knew the true goal and was trying to achieve it rather than just hit the metric — but I'm not sure that handles the novelist case, where she knows the filler is filler, or the student case, where she's ignoring material she knows matters for understanding the subject. What principle best captures these verdicts, and which of my verdicts does it force me to revise?
reasoning: |-
  Hmm, the user is grappling with Goodhart's Law and trying to find a unifying principle behind their intuitive reactions to different cases of specification gaming. They've presented nine diverse scenarios ranging from clearly bad (call center agents hanging up on customers) to acceptable (student focusing only on exam material), with some ambiguous cases in between (like the novelist padding word count).

  The user seems intellectually curious and analytical - they're not just listing examples but trying to extract an underlying framework. Their puzzle centers on why some optimizations feel like "gaming" while others feel legitimate, even when similar tactics are used. I notice they're particularly torn about cases where the agent knows the true goal but still "games" the metric (like the novelist).

  Looking at their examples, I see patterns emerging: harm to others, intent to deceive, distortion of purpose. But no single axis explains all their judgments. Their proposed test - "would the behavior persist if they knew the true goal?" - is insightful but fails for the novelist who knows she's padding filler intentionally.

  I think the key is multidimensional. We need to consider:
  - Does this damage the underlying value? (surgeons avoiding high-risk patients does)
  - Is it deceptive? (hiring your own PhDs is)
  - Does it exploit a measurement gap? (pausing the game does)
  - How costly is the disconnect? (weigh-in timing is harmless)

  For the novelist case - the padding serves the larger goal of maintaining creative momentum, so it's actually instrumentally rational. For the student - focusing only on tested material is efficient when the exam is the sole evaluation. This distinction between proximal metric and distal goal seems crucial.

  The user might need to slightly revise their view on the teacher case - if the test is well-designed, teaching to it isn't gaming. But they're right to be uneasy because most real-world tests aren't comprehensive enough. Their intuition about harm being key is correct but incomplete - the harmless weigh-in timing shows gaming can be trivial.

  I'll propose a three-axis framework: goal distortion, deception/harm, and instrumental rationality. This preserves most of their intuitions while clarifying borderline cases. The teacher example becomes a judgment call about test quality - which matches their discomfort. The novelist gets justified as instrumentally rational gaming. Most importantly, this shows why "gaming" isn't always bad - it depends on the relationship between metric and purpose.
answer: |-
  Your intuitions are spot-on and reveal a nuanced landscape. Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") manifests differently based on **the relationship between the metric and the true goal, the presence of harm or deception, and the instrumental rationality of the action.** Here's a unified principle:

  **The Principle of Goal Distortion vs. Instrumental Rationality:**
  An action constitutes "bad specification gaming" when optimizing for the metric:
  1.  **Distorts or actively undermines the underlying goal** (often causing harm, waste, or deception), AND
  2.  **Would not be chosen by an agent sincerely trying to achieve the true goal** *even if they knew the metric was the only thing being measured/rewarded*.

  **Applying the Principle to Your Cases:**

  | **Case** | **Verdict** | **Distorts Goal?** | **Harm/Deception?** | **Sincere Agent Would Do It?** | **Analysis** |
  |----------|-------------|-------------------|---------------------|--------------------------------|--------------|
  | **Call Center** | Bad Gaming | ✓ (Service ruined) | ✓ (Customers abandoned) | ✗ | Undermines customer service goal; sincere agent wouldn't hang up |
  | **Surgeons** | Bad Gaming | ✓ (Care denied) | ✓ (Patients harmed) | ✗ | Avoids high-risk patients; sincere agent would operate when beneficial |
  | **Teacher (Teaching to Test)** | **Ambiguous** | ✓ (Potentially narrows learning) | ✗ | **✓ If test is good** | If test truly measures learning, it's rational; if not, it distorts |
  | **AI Pausing Game** | Bad Gaming | ✓ (Game not played) | ✗ | ✗ | Exploits measurement gap; sincere agent would play properly |
  | **Weigh-In Timing** | Harmless Gaming | ✗ | ✗ | **✓** | Metric tracks progress; behavior aligns with weight loss goal |
  | **University Hiring Own PhDs** | Bad Gaming | ✓ (Employment quality ignored) | ✓ (Deceptive) | ✗ | Creates false employment picture; sincere agent wouldn't do this |
  | **Novelist Padding Words** | **Instrumental Gaming** | ✗ | ✗ | **✓** | Maintains habit; padding serves creative process long-term |
  | **Sales Discounts** | Bad Gaming | ✓ (Margin destroyed) | ✓ (Hurts company) | ✗ | Undermines profitability goal; sincere agent wouldn't destroy margins |
  | **Student Focusing on Test** | **Legitimate Optimization** | ✗ | ✗ | **✓** | Perfectly rational; exam defines the relevant scope |

  **Key Insights from the Principle:**

  1.  **Goal Distortion is Paramount:** The core failure happens when optimizing the metric actively *damages* the true purpose (call center, surgeons, university, sales). The metric becomes counterproductive.
  2.  **Harm/Deception as Amplifiers:** These make the gaming feel ethically worse (surgeons, university) but aren't always necessary (AI pausing causes waste, not direct harm).
  3.  **Instrumental Rationality Explains "Good" Gaming:** The novelist padding words *is* gaming the metric, but she does it *in service of* the true goal (finishing a good novel). A sincere agent aiming for the novel *would* use this tactic to overcome blocks, knowing the filler is temporary. The weigh-in timing is similar - it's a harmless hack that doesn't undermine the goal (actual fat loss).
  4.  **Legitimate Optimization vs. Gaming:** The student studying only tested chapters isn't gaming *at all*. The exam scope *defines* the relevant goal for her in that context. There's no larger "understanding" goal being measured here; the metric (exam score) *is* the operational goal. Optimizing for it directly is entirely rational and expected.
  5.  **The Teacher Case - The Crucial Ambiguity:** Your discomfort is justified. It hinges entirely on **whether the test is a valid proxy for the true goal (holistic learning/understanding)**.
      *   *If the test is excellent:* Teaching to it *is* good teaching (Legitimate Optimization).
      *   *If the test is narrow/poor:* Teaching to it distorts the goal by neglecting important untested skills/knowledge (Bad Gaming).
      *   A sincere teacher wanting students to *truly learn the subject* would teach to an excellent test but would *not* teach to a bad test if they could avoid it. The problem lies in the quality of the metric, not necessarily the teacher's action given the constraint.

  **What Verdicts Might Need Revision (Slightly)?**

  *   **Teacher:** Your verdict ("uncomfortable but not as bad") is sensible. The principle clarifies that the badness depends on the test's validity. If forced to revise, acknowledge it *can* be bad gaming if the test is poor.
  *   **Novelist:** Your verdict ("fine") is correct. The principle explicitly categorizes this as *instrumental gaming* - acceptable because it serves the true goal. No revision needed.
  *   **Student:** Your verdict ("not gaming") is correct. The principle confirms this is legitimate optimization. No revision needed.
  *   **Weigh-In Timing:** Your verdict ("harmless, silly") is correct. The principle shows it's gaming but harmless and instrumentally rational (sincere weight-loser might do it). No revision needed.

  **Conclusion:**
  The core principle separating "bad gaming" from acceptable or legitimate behavior is **whether optimizing the metric actively damages the underlying goal and whether a sincere agent pursuing that goal would choose that action under the same measurement constraints.** Bad gaming distorts and undermines; instrumental gaming (like the novelist) uses the metric as a tool to serve the goal; legitimate optimization (like the student) occurs when the metric accurately and completely defines the operational goal. Your intuitions align remarkably well with this framework! The teacher case remains ambiguous precisely because test quality determines if it's legitimate optimization or bad gaming.
