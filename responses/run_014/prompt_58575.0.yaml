prompt: |-
  hey so I keep running into the same annoying dynamic and I wonder if philosophers or economists or whoever already have a name for it?

  First was my cousin's food truck block downtown. One truck started staying open an hour later to catch the late crowd, so the others had to match or lose business, now all of them stay open late, they all hate it, costs are up, nobody gets more customers overall cause they're just splitting the same late crowd, and customers barely even cared. They all say they'd vote to all close early again if they could enforce it, but no one can afford to be the first to blink.

  Then totally seperate thing, my kid's travel baseball team. One family started paying for extra private hitting lessons in the offseason, realy expensive, then a few more families felt they had to keep up so their kid wouldn't fall behind, now basically everyone does it, everyone's broke and exhausted, the relative ranking of the kids is about the same as before, and everyone says they wish none of them had started.

  It's not just regular competition cause in both cases nobody even wants the prize that much and everyone would be happier if they could all quit together, but quitting alone just punishes you. I know there's an idea about overusing a shared resource like overfishing, but this feels different cause there's no shared lake to protect, it's just everyone undercutting each other to not lose.

  So is there an established name for this exact pattern? If so what is it and how is it different from plain competition and from the overfishing-type situation? And if there isn't, can you coin something with a clear definition that tells me what counts and what doesn't?

  Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is describing a pattern they've observed in two different scenarios: food trucks extending hours and kids in a baseball team taking extra lessons. In both cases, everyone ends up worse off but feels trapped because no one can unilaterally stop without losing out. They want to know if there's a name for this dynamic.

  First, I recall that this sounds like the prisoner's dilemma. In that game theory model, two individuals acting in their self-interest lead to a worse outcome for both. Here, each participant is forced to compete (stay open late, pay for extra lessons) to avoid losing, but if everyone cooperated (close early, skip lessons), they'd all be better off. That matches the user's examples perfectly.

  The user mentioned it's not like overfishing, which is the tragedy of the commons. They're right—tragedy of the commons involves depleting a shared resource, like a fishery. Here, there's no shared resource being destroyed; instead, it's about mutually damaging competition where individual incentives conflict with group benefits. So the distinction is important.

  The user also asks how this differs from plain competition. In pure competition, striving for a prize can lead to innovation or better outcomes. But in this case, the "prize" isn't valued highly—like the late crowd or relative kid rankings—and the efforts just cancel out, making it a lose-lose situation. That's key to identifying this as a prisoner's dilemma.

  I should make sure to lead with the term "prisoner's dilemma" as the answer, then explain the reasoning. The user specified no preamble, so I'll jump straight in. Also, I need to address their points: defining how it's different from competition and tragedy of the commons, and clarifying the boundaries for what counts. 

  For the definition: It's a scenario where mutual cooperation is optimal, but individual incentives lead to mutual defection, resulting in worse outcomes. Factors include: no shared resource, the prize is low-value, and defection (opting out alone) is punished. This helps the user apply it to other situations—like if there's a shared resource, it's tragedy of the commons; if the competition has real benefits, it might just be regular rivalry.

  Finally, the user might be seeking not just a name, but validation of their frustration and maybe a way to resolve it. While I won't give advice unless asked, understanding the dilemma could empower them to explore solutions, like binding agreements in the food truck case or team rules for the baseball parents.
answer: |-
  The established term is **prisoner's dilemma**.

  **Reasoning:**

  1.  **Definition:** The prisoner's dilemma is a fundamental concept in game theory describing a situation where:
      *   Two (or more) parties face a choice: **cooperate** (restrain themselves) or **defect** (act selfishly/competitively).
      *   **Mutual cooperation yields the best *overall* outcome** for the group.
      *   **Mutual defection yields the worst *overall* outcome** for the group.
      *   **However, for any individual player, defecting is the dominant strategy:** If others cooperate, defecting gives you an advantage. If others defect, cooperating leaves you worse off. Therefore, rational self-interest drives everyone to defect, even though mutual cooperation is preferable.

  2.  **Applying it to your examples:**
      *   **Food Trucks:**
          *   **Cooperate:** All close early (lower costs, same relative market share).
          *   **Defect:** Stay open late (try to capture more customers).
          *   **Best Overall:** All cooperate (close early, save money, same relative position).
          *   **Worst Overall:** All defect (stay open late, higher costs, same relative share, lower profits).
          *   **Individual Incentive:** If others close early, staying open late gets you extra business. If others stay open late, closing early loses you business. So *everyone* stays open (defects).
      *   **Baseball Lessons:**
          *   **Cooperate:** No one gets extra lessons (save money/time, kids' relative rankings unchanged).
          *   **Defect:** Get extra lessons (try to gain an advantage).
          *   **Best Overall:** All cooperate (no extra lessons, same relative rankings, families save money/time).
          *   **Worst Overall:** All defect (all get expensive lessons, same relative rankings, families broke/exhausted).
          *   **Individual Incentive:** If others skip lessons, getting lessons gives your kid an advantage. If others get lessons, skipping puts your kid at a disadvantage. So *everyone* gets lessons (defects).

  3.  **How it differs from plain competition:**
      *   **Plain competition** often involves striving for a genuinely valued prize or advantage where effort *can* lead to relative gains (e.g., innovating a better product, training harder to actually be *better*). The "prize" is highly valued, and competition can drive positive outcomes.
      *   **Prisoner's dilemma** involves competition for a **low-value prize** (the marginal late crowd, the *relative* ranking within the group) where the *cost of competing* (extra hours, expensive lessons) outweighs the *actual benefit* of winning the competition *when everyone competes*. The competition is mutually destructive because the "prize" isn't worth the collective cost incurred to chase it. Effort largely cancels out, leaving only the costs.

  4.  **How it differs from the "Tragedy of the Commons" (overfishing):**
      *   **Tragedy of the Commons:** Focuses on the **depletion/destruction of a shared, rivalrous resource** (like a fishery, pasture, or clean air) because individuals acting in their self-interest overuse it, even though collective restraint would preserve it. The core problem is *resource depletion*.
      *   **Prisoner's Dilemma:** Focuses on the **self-inflicted costs of mutually damaging competition** where there is *no shared resource being depleted*. The problem is the **arms-race dynamic** itself – everyone incurs high costs to compete for a prize that becomes worthless when everyone competes. The "resource" isn't external; the damage comes from the competitive actions (costly hours, expensive lessons).

  5.  **Clear Definition (Boundaries):**
      A situation qualifies as a prisoner's dilemma pattern when:
      *   **Multiple Actors:** Involves multiple independent decision-makers.
      *   **Choice:** Each has a binary choice: **Cooperate** (restrain competitive effort) or **Defect** (engage in costly competitive effort).
      *   **Payoff Structure:**
          *   **Mutual Cooperation:** Best *collective* outcome (high group payoff, low group cost).
          *   **Mutual Defection:** Worst *collective* outcome (low group payoff, high group cost).
          *   **Sucker's Payoff:** Cooperating while others defect yields the *worst individual outcome*.
          *   **Temptation to Defect:** Defecting while others cooperate yields the *best individual outcome*.
      *   **Dominant Strategy:** Defecting is the rational choice for each individual *regardless* of what others do (leading to mutual defection).
      *   **Low-Value Prize:** The benefit gained from "winning" the competition when others don't compete is significantly outweighed by the *collective costs* incurred when *everyone* competes. The competition is primarily about *relative position*, not absolute gain, and the costs make it net negative.
      *   **No Shared Resource Depletion:** The negative outcome is not caused by destroying a common pool resource, but by the sum of individual costly actions undertaken to compete.
