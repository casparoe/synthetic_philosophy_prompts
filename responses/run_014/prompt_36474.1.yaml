prompt: |-
  I've been keeping a running list of my gut reactions to hypocritical blamers, and I want to know if there's an actual principle behind them, because right now it feels like vibes. My uncle cheated on his taxes for years, stopped only when he got audited, and now rails about tax cheats at every family dinner — his blame feels off to me, like he's forfeited the right. But a college friend who cheated on one exam twenty years ago, admits it freely, and now grades exams and calls out cheating — her blame seems totally fine. Same act, both reformed, different verdict? That can't just come down to the audit. Then my sister has never plagiarized anything, though honestly only because she's never been desparate enough, and when she condemned a plagiarist I'd say go right ahead — but it bugs me that she seems to have MORE standing than my reformed friend, even though my friend actually knows the temptation and my sister doesn't. So standing can't just be "never did it yourself," and it also can't be "knows what it's like," because those point in opposite directions and I hold both.

  It gets worse. My coworker who drives an SUV blaming people who fly for climate damage — that blame feels kinda fine to me? Whereas a different coworker who takes one long-haul flight a year blaming our colleague's monthly flying feels off, even though the flight-blamer's own emissions are way lower than the SUV driver's. The person with LESS hypocrisy has LESS standing on my gut, which seems backwards no matter how I slice it. And separately I'm pretty sure a bystander who would obviously have done the same thing if tempted, but never was, has standing — the "there but for the grace of God" person is allowed to blame, right?

  Is there a principle that captures all of this, or as close as possible? Please state it precisely, tell me which case motivates each part, and say what it predicts for the case I keep circling: my neighbor who eats meat but says he's morally transitioning off it, and blames me for eating meat without even trying. And be honest about which of my verdicts you'd overturn to get a cleaner principle — I suspect something has to go, probably either the SUV one or the sister one, but I genuinely don't know which.
reasoning: |-
  Okay, this user has presented a fascinating ethical puzzle about the conditions under which blaming others feels legitimate or hypocritical. They've described several nuanced scenarios where their gut reactions seem contradictory, and they're searching for an underlying principle. 

  First, I need to unpack their cases systematically. The uncle scenario shows that public hypocrisy + lack of voluntary reform destroys standing. The college friend case demonstrates that transparency + time + changed role can rehabilitate standing despite past wrongdoing. The sister example reveals that never having committed the act isn't required for standing - what matters is acknowledging one's own vulnerability. 

  The climate cases are particularly interesting. The SUV driver's blame feels acceptable because their harm is structurally embedded rather than discretionary, while the frequent flyer's blame fails because they engage in optional high-impact harm while criticizing lesser harm. This suggests the principle needs to account for both avoidability and proportionality of harm.

  The "there but for grace" bystander case confirms that hypothetical similarity to the wrongdoer doesn't undermine standing - what matters is current alignment of actions and values. 

  For the meat-eating neighbor case, the principle would deny him standing because his blame occurs while actively engaging in the behavior without meaningful steps to change. If he blamed while genuinely reducing consumption, it might be different. 

  I suspect the user might need to reconsider their SUV verdict - while the structural argument has merit, one could argue all discretionary high-emission activities reduce standing. Alternatively, the sister's standing could be reframed as depending on her acknowledgment of her own potential weakness rather than her clean record. 

  The core tension seems to be between three factors: personal history, current actions, and the relationship between the harm you cause versus the harm you condemn. The principle should weight current actions most heavily, with past actions mattering primarily through their connection to present hypocrisy. Transparency and proportionality appear crucial throughout.
answer: |-
  Here's a principle that captures your intuitions as closely as possible, built from your cases:

  **The Principle of Congruent Commitment:**
  *"Blaming others for a moral failing requires demonstrating a *current, active commitment* to overcoming that failing in oneself, proportionate to one's capacity and the nature of the failing. Standing is forfeited not merely by past actions, but by ongoing actions that contradict the blame, or by a lack of demonstrable effort to align current actions with the values invoked in the blame. Standing is *enhanced* by transparency about past failings and demonstrable reform, especially when one's role makes the blame a duty. A 'clean record' alone confers weak standing unless paired with acknowledgment of one's own potential vulnerability."*

  **How it explains your cases & motivates each part:**

  1.  **Your Uncle (Tax Cheating):**
      *   **Violates:** Lacks *current, active commitment*. He only stopped due to external force (audit), not internal reform. His ongoing *actions* (incessant railing) contradict any claim of sincere commitment – it feels performative and defensive. Past action without demonstrable reform forfeits standing.
      *   **Part Motivated:** "ongoing actions that contradict the blame", "lack of demonstrable effort to align current actions with the values invoked", "forfeited not merely by past actions".

  2.  **Your College Friend (Cheating/Grading):**
      *   **Satisfies:** Demonstrates *active commitment* through her current role (grading). Shows *transparency* about past failings (admits freely). Her reform is demonstrable and her blame is tied to a *duty* of her role. Past failure *enhances* standing because her current commitment is clear and contextualized.
      *   **Part Motivated:** "Standing is *enhanced* by transparency about past failings and demonstrable reform, especially when one's role makes the blame a duty."

  3.  **Your Sister (Plagiarism Condemnation):**
      *   **Satisfies (Weakly):** Has a "clean record" but acknowledges her potential vulnerability ("never desperate enough"). This acknowledgment provides *weak standing*. She isn't actively *contradicting* the value she invokes (honesty). Her blame aligns with her current actions (not plagiarizing).
      *   **Part Motivated:** "A 'clean record' alone confers weak standing unless paired with acknowledgment of one's own potential vulnerability." ("never desperate enough" = acknowledgment of vulnerability).

  4.  **SUV Driver vs. Frequent Flyer (Climate Blame):**
      *   **SUV Driver (Feels Fine):** Driving an SUV is often seen as a *structural* harm (necessary for work/family in car-dependent areas?) rather than purely discretionary luxury. His blame might target *discretionary, high-impact* harms (flying) that he avoids. He *could* be demonstrating *proportionate commitment* ("proportionate to one's capacity") by avoiding flying while being stuck with the SUV. His blame doesn't *contradict* his actions as starkly if flying is worse and he avoids it.
      *   **Frequent Flyer Blaming Monthly Flyer (Feels Off):** Takes *discretionary, high-impact* actions (long-haul flight) while blaming someone else for taking *more frequent* but potentially similar-impact actions. Demonstrates a *lack of active commitment* proportionate to the failing he condemns ("proportionate... nature of the failing"). His own actions directly *contradict* the seriousness with which he treats the value (emissions reduction) when blaming others. He's failing the "align current actions" test.
      *   **Part Motivated:** "proportionate to one's capacity and the nature of the failing", "ongoing actions that contradict the blame", "align current actions with the values invoked". This case strongly motivates the need for *proportionality* and *avoiding contradiction*.

  5.  **The "There but for Grace" Bystander:**
      *   **Satisfies:** Has a "clean record" *and* acknowledges vulnerability ("would have done the same"). Demonstrates *current commitment* by *not* doing the act when faced with temptation (or simply by living the value now). Their blame aligns with their current actions and values. Acknowledgment of potential failure enhances standing compared to someone who is smugly "pure".
      *   **Part Motivated:** "A 'clean record' alone confers weak standing unless paired with acknowledgment of one's own potential vulnerability" + "align current actions with the values invoked".

  **Prediction for Your Meat-Eating Neighbor:**

  *   **Violates the Principle:** He engages in the *ongoing action* (eating meat) that directly contradicts the value (moral opposition to meat-eating) he invokes when blaming you. He demonstrates a *lack of active commitment* ("without even trying"). His claim of "moral transitioning" is just an *intention*, not demonstrable action or reform. Transparency about his own failing (eating meat) isn't paired with effort to change, so it *weakens*, not enhances, his standing.
  *   **Verdict:** He lacks the standing to blame you. His blame feels hypocritical and illegitimate under this principle.

  **Honest Assessment: What Might Need Adjustment?**

  Your intuitions are remarkably consistent! The principle captures almost all of them. However, **the SUV case is the most likely candidate for revision to achieve a stricter principle.**

  *   **Why the SUV case might need overturning:** The principle leans heavily on "ongoing actions that contradict the blame." Driving an SUV *is* an ongoing action contributing significantly to climate damage. The structural argument ("necessary due to circumstances") can be seen as an *excuse* rather than a justification within the principle. A stricter interpretation would say: *If you cause significant harm of type X while blaming others for causing harm of type X, and viable alternatives exist (even if inconvenient), you contradict the value and lack standing.* This would put the SUV driver closer to the frequent flyer.
  *   **Why overturning the Sister case is less likely:** Her acknowledgment of vulnerability ("never desperate enough") is crucial. If she were smugly claiming inherent moral superiority ("*I* would *never*!"), her standing would vanish. The principle allows for blame from those living the value, provided they are humble about their own potential failings.
  *   **The Trade-off:** Keeping the SUV verdict "fine" requires accepting that some harms are more structurally embedded than others, and blame can be legitimate if targeting *worse* or *more avoidable* harms within the same value domain (emissions). This adds nuance but complexity. Overturning it makes the principle cleaner but might clash with your gut feeling about practicality vs. luxury emissions.

  **Conclusion:**

  The **Principle of Congruent Commitment** effectively explains your diverse intuitions by focusing on *current action*, *demonstrable effort*, *transparency*, *role*, and *proportionality*, rather than just past acts or a spotless record. It predicts your neighbor lacks standing. While your SUV verdict could be seen as the outlier requiring a "structural harm" caveat, your overall pattern is coherent and captured well by this framework. Your instincts about hypocrisy, reform, and the link between words and deeds are spot on.
