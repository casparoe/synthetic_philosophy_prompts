  First, I need to break down "you never see the object itself, only what it looks like to you" into distinct theses. The user wants a spectrum from weak to strong interpretations. Let me list possible readings. Starting with the weakest: Phenomenal Relativity. This seems trivially true—appearances depend on conditions. But this doesn't lead to sense-data. Then there's the Epistemic Reading: we rely on appearances to judge objects. Still not problematic. The Argumentative Move is where the hallucination case is used to say there's a common factor. This is the core of the issue. Then stronger claims like Objects of Awareness and Mental Intermediaries, which lead to sense-data. Finally, Representationalism, which might avoid intermediaries but still denies direct realism.

  Now, the user wants to know which reading the argument genuinely needs. The Argumentative Move is crucial because it introduces the common kind. Without accepting that hallucination and veridical perception share the same object of awareness, the argument falls apart. So disjunctivism rejects this by saying that in veridical cases, you perceive the object, while hallucinations are different mental states. That's one escape route.

  But the user also asks if there's a way to accept a weak reading without accepting the conclusion. Yes, by endorsing Phenomenal Relativity or Epistemic Reading but denying that the common factor is a mental object. Instead, appearances could be relational properties or ways of perceiving. Representationalists might accept the common factor but as representations, not sense-data. 

  The user might be looking for a solid counterargument without fully committing to disjunctivism. They might want to show that the friend's claim can be interpreted weakly and that the strong interpretations aren't necessary. Also, pointing out the fallacy in the Argumentative Move—that indistinguishability doesn't imply identical mental objects—could help. 

  I should also consider the user's deeper needs. They might feel outmaneuvered in the discussion and need clear, structured arguments to respond effectively. They probably want to defend direct realism but need philosophical ammunition. Clarifying the burden of proof is important too: the friend needs to prove that indistinguishability implies identical objects of awareness, which is contentious. 

  So, summarizing: the argument needs the Argumentative Move to work, but that move is questionable. Rejecting it via disjunctivism is one way, but alternatives like relational properties or representationalism also block the sense-data conclusion. The user can accept weak readings without sliding into the strong ones.
answer: |-
  Here's a breakdown of "you only see what it looks like" from trivially true to metaphysically loaded, assessing plausibility and whether it gets your friend to their conclusion (sense-data/representationalism), plus the escape routes you asked for. **The core vulnerability lies in the inference from indistinguishability.**

  **The Readings (Weakest to Strongest):**

  1.  **Phenomenal Relativity (Trivially True):**
      *   **Thesis:** How an object appears (its look, sound, feel) depends on subjective conditions (perspective, lighting, sense organ state, mood) and objective conditions (medium, distance). You never see the object *independently* of these conditions.
      *   **Plausibility:** Undeniably true. A red tomato looks grey in dim blue light. A straight stick looks bent in water. Perception is perspectival and causally mediated.
      *   **Gets to Sense-Data/Representationalism?** No. This is just about *how properties manifest*. It's compatible with Direct Realism (you see the tomato *itself*, but its color *looks* different under these conditions) and most representationalist views. It doesn't imply mental *objects*.

  2.  **Epistemic Reading (Plausible, Common Sense):**
      *   **Thesis:** Your primary evidence for *judging* what the object is and what properties it has comes from how it appears to you. You infer the object's nature from its appearances.
      *   **Plausibility:** Very plausible. We constantly interpret appearances to identify objects and their properties ("It *looks* like a tomato, so it probably is one").
      *   **Gets to Sense-Data/Representationalism?** No. This is about *epistemic access* and *justification*, not the *metaphysical object* of awareness. You can still be directly aware *of the tomato* even if you learn about it *via* its appearances. This is consistent with naive realism.

  3.  **The Argumentative Move (The Crux - Content Identity via Indistinguishability):**
      *   **Thesis:** Because a veridical perception of a tomato and a perfect hallucination of a tomato can be *subjectively indistinguishable* ("from the inside"), what you are directly aware of in both cases *must be the same kind of thing* (the "common factor"). Since in the hallucination case, it clearly *isn't* a physical tomato, what you are directly aware of in *both* cases must be something non-physical – a sense-datum, mental image, or representational content.
      *   **Plausibility:** *This is the inference driving the argument, but it's highly contentious and not obviously true.* Its plausibility depends entirely on accepting the inference from indistinguishability to identity of mental object/content.
      *   **Gets to Sense-Data/Representationalism?** **Yes, this is the core inference the argument *needs* to reach its conclusion.** It forces a choice: either accept a common mental object/content (leading to sense-data or representationalism) or reject this inference (disjunctivism). It explicitly argues that direct awareness *cannot* be of the physical object because the physical object isn't present in the hallucination case, yet the experience is identical.

  4.  **Objects of Awareness (Strong Sense-Data Thesis):**
      *   **Thesis:** The immediate and direct object of perceptual awareness is *always* a private, mind-dependent entity (a sense-datum, impression, idea) which *represents* (or may fail to represent) the external physical object. You only *indirectly* perceive physical objects by inferring them from sense-data.
      *   **Plausibility:** Highly problematic. Faces the "veil of perception" problem (how do we know sense-data resemble or connect to reality?), difficulty explaining public objects, and arguably misdescribes the phenomenology (we seem to see *things*, not inner pictures). Primarily motivated by arguments *like* the one from illusion.
      *   **Gets to Sense-Data/Representationalism?** **Yes, this *is* the classic sense-datum conclusion.**

  5.  **Mental Intermediaries (Weaker Sense-Data/Representationalist Thesis):**
      *   **Thesis:** While you might be aware *of* the physical object, this awareness is *always* mediated by mental representations (ideas, images, neural states, representational content). You see the tomato *by* or *in virtue of* being aware of these intermediaries. "What it looks like" *is* this intermediary state.
      *   **Plausibility:** More plausible than (4) as it avoids claiming intermediaries are the *only* objects of awareness. Compatible with causal/cognitive science accounts. Still faces challenges explaining how awareness "reaches through" the representation to the object itself (the "interface problem").
      *   **Gets to Sense-Data/Representationalism?** **Yes, effectively.** While less metaphysically loaded than (4), it still posits mental items as essential intermediaries *in the perceptual relation*, undermining direct realism. Strong representationalism often fits here.

  6.  **Representational Content (Representationalist Thesis):**
      *   **Thesis:** Perception essentially involves the brain/mind representing the world as being a certain way. "What it looks like" *is* this representational content. In both veridical and hallucinatory cases, you are in a state with the same (or relevantly similar) representational content (e.g., "red, round, tomato-shaped object here").
      *   **Plausibility:** Very plausible from a cognitive science perspective. Explains the indistinguishability (same content) and how perception guides action.
      *   **Gets to Sense-Data/Representationalism?** **Yes.** While representationalism typically *rejects* sense-data *as objects*, it affirms that what you are "directly aware of" in a significant sense is the representational content, which is a mental feature of your state, not (necessarily) identical to the physical object. It denies direct realism in the naive sense.

  **What the Argument Genuinely Needs & Is It True?**

  *   **Needs:** The argument **absolutely depends on Thesis #3 (The Argumentative Move): The inference from subjective indistinguishability to identity of the object/content of direct awareness.**
  *   **Is Thesis #3 True?** **No, not necessarily.** This is the key point of contention. Disjunctivists reject it outright: veridical perception and hallucination are *fundamentally different kinds of mental state* (one relational/object-involving, the other not), even if they are subjectively indistinguishable. The indistinguishability is explained by their *epistemic* similarity (you can't tell them apart introspectively), not by a shared metaphysical object or identical intrinsic nature. Rejecting #3 blocks the argument at its core.

  **Escape Routes: It's NOT Just Disjunctivism**

  While disjunctivism is the most direct rejection of Thesis #3, it's not the only way to resist the conclusion while accepting *some* aspects of "you only see what it looks like":

  1.  **Accept #1 (Phenomenal Relativity) + Reject #3:** Agree perception is perspectival but deny indistinguishability implies identical objects of awareness. The "look" is a relational property *of the object* under conditions, or a way the perceiver is related *to the object*. In hallucination, there *is* no object to bear the relational property; it's a different state entirely. (Naive Realism/Relationalism).
  2.  **Accept #1 + #2 (Epistemic) + Reject #3:** Agree appearances are perspectival and our evidence, and agree hallucinations happen, but deny they share the *same object of awareness* as veridical perception. The indistinguishability is a limitation of introspection, not proof of a common mental item. The tomato is directly present in veridical cases.
  3.  **Accept #6 (Representational Content) *without* Mental Intermediaries (Intentionalism):** Accept that perceptual states have representational content which is what "it looks like". However, deny that this involves awareness *of* an intermediary object (sense-datum). You are directly aware *of the tomato* (if it exists) *in virtue of* being in a state with "tomato-ish" content. Hallucination is a state with the same content *but no object*. This avoids sense-data but still makes the representational content the crucial common factor, differing from direct realism. (This *is* a form of representationalism, but avoids the strongest "veil of perception" problems).

  **The Bottom Line for Your Argument:**

  *   **Your friend's argument crucially relies on Thesis #3:** Indistinguishability proves identical objects/content of awareness.
  *   **Thesis #3 is false:** Disjunctivism provides a coherent alternative – the states are fundamentally different kinds. Representationalism offers a different explanation using content without intermediaries.
  *   **You DON'T have to accept disjunctivism (though it's an option):** You can accept the trivially true Thesis #1 (Phenomenal Relativity) and the plausible Thesis #2 (Epistemic Role) while firmly rejecting Thesis #3. Emphasize that indistinguishability only proves *epistemic similarity*, not *metaphysical identity* of the object of awareness. The burden is on your friend to show *why* indistinguishability *must* imply a common mental object, especially given the disjunctivist and intentionalist alternatives. Focus your pushback **squarely on the leap from indistinguishability to identity of mental object/content.** That's where the argument is vulnerable and where philosophical debate is most active.
