              C) They would form a group only if they interacted, so in this case, no group.

          Q3: Dead ant colony (ants are arranged exactly as when alive, but dead):
              A) The colony still exists as a composite object.
              B) The colony no longer exists; there are only dead ants.
              C) The colony exists only if the ants were still alive, so in this case, no colony.

          Q4: A cloud (a visible mass of water droplets in the sky, with a discernible boundary):
              A) It is a composite object (a cloud).
              B) It is just water droplets in a region; there is no cloud object.
              C) It is a cloud only if it has a well-defined boundary, so in this case, yes.

          Q5: A living human being (functioning normally):
              A) It is a composite object (a person).
              B) It is not a composite object; only the fundamental particles are real.
              C) It is a composite object only because of its biological functioning.

          Q6: A pile of sand (with a typical pile shape):
              A) It is a composite object (a pile).
              B) It is just grains of sand; there is no pile.
              C) It is a pile only if it has a certain shape, so in this case, yes.

          Q7: A watch that is working properly:
              A) It is a composite object (an artifact).
              B) It is just parts arranged watch-wise; there is no watch object.
              C) It is a watch only if it is functional, so in this case, yes.

          Q8: A flock of birds flying in formation (so they are coordinated):
              A) The flock is a composite object.
              B) There are only individual birds; no flock.
              C) The flock exists only if the birds are coordinated, so in this case, yes.

     Scoring:

          Count the number of times you chose answer B. Let that be D.

          If D == 8: 
              You are a Nihilist: you don't believe in any composite objects.

          If D == 0:
              You are a Universalist: you believe that any collection of objects composes a whole.

          If D == 7 and you did NOT choose B for question 5 (the human):
              You are an Organicist: you believe that only living organisms are composite objects.

          Otherwise (if D is between 1 and 7, but not 7 with the human accepted, or if D=7 but you denied the human):
              You are a Brutalist: there is no general principle for when composition occurs; it's case by case.

     Also, note:

          - If you have D=7 and you denied the human (chose B for Q5), then you are Brutal.
          - If you have D=7 but accepted the human (so Q5 not B) then Organicist.

     Finally, we note limitations:

          - This quiz does not distinguish between different versions of organicism (e.g., whether they accept superorganisms like ant colonies or not) because we didn't include a living colony.
          - The quiz also does not separate brutal views that might have a pattern we didn't capture (like accepting all artifacts) because we have only one artifact (the watch) and one pile of sand (which is not an artifact). But brutal is by definition without a principle, so any mix is brutal.
          - Also, if someone has D=7 and the only composite they accept is not the human (say, the cloud) then they are brutal, and that might be a valid view that we didn't name? But brutal covers it.

     We'll write the quiz accordingly.
answer: |-
  Here's a "Which View on Composition Do You Actually Hold?" quiz designed for your metaphysics study group. It uses 8 concrete, weird cases to sort responses into **Nihilism**, **Universalism**, **Organicism (life-only)**, or **Brutalism**, based on verdicts about when composite objects exist. Each question has 3 answer choices reflecting different intuitions. The scoring key identifies patterns and flags edge cases.

  ---

  ### **Quiz: When Does "Wholeness" Happen?**
  For each scenario, pick the answer that feels most intuitively correct to you. Don’t overthink it!

  1. **A half-built Lego bridge** (base and one pillar assembled; the rest in pieces):  
     A) *There is no bridge yet*—just Legos and an incomplete structure.  
     B) *There is a bridge*—it’s just unfinished and non-functional.  
     C) *There is a bridge*, but only because we intend to finish it.  

  2. **Two strangers stuck in an elevator** for an hour (no interaction):  
     A) *No group exists*—just two people sharing space.  
     B) *A temporary group forms* through shared circumstances.  
     C) *A group exists* only if they cooperate or talk.  

  3. **A dead ant colony** (bodies arranged exactly as when alive):  
     A) *The colony no longer exists*—just dead ants in a pattern.  
     B) *The colony still exists* as a "dead collective."  
     C) *The colony exists* only if the ants’ arrangement is intact.  

  4. **A cloud** (visible mass of water droplets with a fuzzy boundary):  
     A) *It’s not a single object*—just droplets in a region.  
     B) *It is a cloud-object*, despite the fuzziness.  
     C) *It is a cloud* only if it has a stable shape.  

  5. **A living human being**:  
     A) *It is a composite object* (a person).  
     B) *Only particles exist*—the "person" is an illusion.  
     C) *It is a whole* only due to biological functions.  

  6. **A pile of sand** (grains dumped randomly):  
     A) *No pile exists*—just grains in a location.  
     B) *A pile definitely exists*.  
     C) *A pile exists* only if the grains are stable.  

  7. **A functional watch**:  
     A) *No watch exists*—just parts arranged "watch-wise."  
     B) *A watch exists* as an artifact.  
     C) *A watch exists* only if it keeps time.  

  8. **A flock of birds** flying in formation:  
     A) *No flock exists*—just birds coordinating.  
     B) *A flock exists* as a cohesive unit.  
     C) *A flock exists* only if the birds share a goal.  

  ---

  ### **Scoring Key**
  Tally your **A**, **B**, and **C** answers. Then, use the rules below:  

  - **Nihilist** (only particles exist):  
    **You scored 7–8 A’s** (including Q5-A **does not** count toward Nihilism).  
    *Nihilists deny composites in ALL cases, including living things (Q5-A is incompatible).*  

  - **Universalist** (composition always occurs):  
    **You scored 6–8 B’s** (with ≤2 non-B answers).  
    *Universalists accept composites in ALL scenarios, even "weird" ones.*  

  - **Organicist** (only living organisms are wholes):  
    **You scored 6–7 A’s AND chose B/C for Q5 (human)**.  
    *Organicists deny non-living composites (A’s for Q1–4,6–8) but accept living beings (Q5 not-A).*  

  - **Brutalist** (no general principle; composition is arbitrary):  
    **All other patterns**. Examples:  
    - Mixed A/B/C with no consistent theme.  
    - Accepts non-living composites (e.g., B/C on watch/pile) but denies others.  
    - Denies the human (Q5-A) but accepts some composites (incoherent with Organicism).  

  ---

  ### **Important Notes**
  - **Incoherent/Unscorable Patterns**:  
    If you chose **Q5-A (deny the human composite)** but scored as Nihilist (7–8 A’s), your view is **incoherent**—Nihilism requires rejecting *all* composites, including humans. If you have 7 A’s *including Q5-A*, you’re a **Nihilist**. If you have 7 A’s *but not Q5-A*, you’re **Organicist** (life-only).  
  - **Views This Quiz Can’t Separate**:  
    - **Universalism vs. Brutalism**: Universalism *requires* consistently accepting composites (B’s). Brutalism *could* mimic this pattern by accident but isn’t principled.  
    - **Organicism vs. Nihilism**: The quiz separates these via Q5 (human). Organicism *requires* accepting living wholes; Nihilism rejects them.  
  - **Unexplored Views**:  
    Brutalism covers "case-by-case" intuitions that don’t fit other categories (e.g., accepting artifacts but not piles). If your pattern feels consistent but isn’t listed, it might be a refined Brutalist stance!  

  ---

  This quiz isolates core intuitions while flagging logically shaky answers (e.g., denying humans while accepting watches). Use it to spark debate—why might someone be a Brutalist? Is Organicism *really* about life, or consciousness? Happy discussing! 🧩🤔
