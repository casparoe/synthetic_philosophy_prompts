  Okay, the user is a second-year grad student working on an AI safety paper about corrigibility and the shutdown problem. They want me to act as a tough but constructive journal referee - a philosopher familiar with AI safety literature. They specifically asked me to brainstorm objections first, check their examples, then write detailed comments.

  Hmm, let me understand their core argument. They're claiming corrigibility isn't a property of individual agents but of the entire human-machine system. They criticize the "obedience" approach (making AI want shutdown) and propose "incentive-compatibility" instead - structuring rewards so shutdown doesn't conflict with the agent's goals. Their domestication analogy suggests corrigibility emerges from selection pressures rather than design.

  First, I should brainstorm key objections:
  Objection 1: Their per-episode reward solution might not scale to real-world agents that necessarily maintain state across episodes (like memory or ongoing projects). If shutdown prevents future episodes, indifference breaks down.

  Objection 2: They overlook that in their model, the agent still has NO positive reason to ALLOW shutdown - it could obstruct the button just for fun if that has zero cost. Genuine corrigibility requires active cooperation.

  Objection 3: The domestication analogy might be misleading - we bred dogs over millennia with direct genetic control, while we train AIs via reward signals with no comparable precision. Selection pressures in competitive AI development might actually favor dangerous agents.

  Objection 4: Their framing dismisses hybrid approaches (e.g. inverse reinforcement learning agents that defer to human judgment) that combine obedience with systemic constraints.

  Now checking their examples: 
  The horse/rider analogy is evocative but risks overextension - rideability DOES depend on the horse's innate traits, just like corrigibility depends partly on agent architecture. The per-episode reward model resembles "state-based" reward formulations in some RL literature, but they're right that the shutdown indifference result is underappreciated. They do seem to garbled the "irrational human" game theory papers - those involve different mechanisms.

  For their specific questions:
  1) The obedience vs. incentive distinction isn't perfectly clean - many real proposals blend both. Their erodibility claim holds for simple utility functions but less so for value learning agents.
  2) The per-episode idea is semi-novel in this context but needs to engage with the "off-switch game" literature properly.
  3) The domestication analogy does rhetorical work but risks biological determinism - needs tighter connection to actual AI training.
  4) Biggest missed objection: Their framing ignores that we NEED some agent-internal properties (like myopia) to make incentive-compatibility work at all.

  The draft shows promise but needs significant work. The core insight is valuable but underdeveloped, and the literature engagement is thin. I'll recommend MAJOR REVISION - they should strengthen the technical foundation, address scaling concerns, refine the domestication analogy, and engage with counterarguments more thoroughly. The writing itself is clear and engaging though - good academic voice.

  Verdict should be MAJOR REVISION since the argument needs substantial restructuring and deeper technical grounding, but the central idea merits development.
answer: |-
  ## Referee Report: "Corrigibility is not a property of agents"

  **Overall:** This draft tackles a critical issue in AI safety with a provocative central thesis: corrigibility is a systemic property, not an agent-internal one. The core intuition—focusing on incentive-compatibility over obedience—is valuable and deserves exploration. However, the argument currently rests on underdeveloped technical foundations, oversimplifies existing approaches, and leans too heavily on evocative but potentially misleading analogies. Significant revision is needed to solidify the central claim, engage rigorously with the literature, and address inherent limitations of the proposed solution. The potential is clear, but the execution requires substantial work.

  **Detailed Comments:**

  1.  **Accuracy & The Obedience vs. Incentive-Compatibility Distinction:**
      *   **Distinction Oversimplified:** Your framing sets up a false dichotomy. The "obedience" approach isn't monolithic. Proposals like Cooperative Inverse Reinforcement Learning (CIRL) or variants with uncertainty over values *do* aim for a form of incentive-compatibility by making the agent *uncertain* about the true reward and thus *instrumentally* motivated to preserve human oversight/correction to maximize its *expected* reward. It's not pure "wanting shutdown"; it's recognizing shutdown as a consequence of human judgment it defers to *for instrumental reasons* related to its own goal achievement. Your dichotomy ignores this nuance.
      *   **Erodibility Claim:** Your claim that exceptions "get optimized away" holds for simple, static utility functions subject to self-modification or goal drift in complex environments. However, it's less clear-cut for agents designed with robust uncertainty or meta-preferences (e.g., an agent whose utility function includes a term valuing deference to human judgment as a terminal value, potentially enforced by a meta-level objective). While *practically achieving* robustness is incredibly hard (a key challenge!), your argument dismisses these approaches too easily without engaging with arguments *for* their potential stability (e.g., through cryptographic commitments, formal verification, or specific learning biases). You need to wrestle with this complexity.

  2.  **Per-Episode Reward & Indifference:**
      *   **The Core Idea is Real (but Limited):** You are correct that structuring rewards to be "banked" per episode can theoretically induce indifference to shutdown *regarding those specific banked rewards*. This aligns with concepts like:
          *   **State-Based Reward Formulations:** Where reward is defined purely based on the state achieved during an episode, not the duration or future potential.
          *   **Myopia in RL:** Designing agents that optimize only for immediate or near-term reward, making shutdown less damaging to their objective.
          *   **"Indifference" Results:** Soares et al.'s "Corrigibility" paper (2015) *does* present a model where an agent with a specific utility function (incorporating shutdown if requested) is provably indifferent. Your "per-episode banked reward" is one *mechanism* to achieve a similar indifference *regarding past rewards*.
      *   **You've Garbled the "Irrational Human" Point (Slightly):** The key paper here is Hadfield-Menell et al.'s "The Off-Switch Game" (2017). They show an agent *without* explicit corrigibility *might* allow shutdown if it believes:
          1.  The human has better information about the true reward.
          2.  Shutting down now prevents the agent from taking actions the human would later disapprove of, leading to *negative* future reward (penalty).
      Their agent *isn't* indifferent; it allows shutdown *instrumentally* to avoid future penalties. Your model achieves indifference by structurally removing the *possibility* of penalty for shutdown regarding past rewards. These are distinct mechanisms. Your approach avoids needing the agent to model human rationality but introduces other problems (see objections below).
      *   **The Critical Limitation:** Your model **only** guarantees indifference to shutdown *concerning the rewards already banked from past episodes*. It says *nothing* about:
          *   **Future Episodes:** If shutdown prevents *future* episodes where rewards could be earned, the agent has a strong instrumental reason to *prevent* shutdown! Your solution only works if we assume the agent has no concept of, or care for, future potential reward episodes – essentially requiring built-in, robust myopia. This is a *huge* and non-trivial agent-internal property you now implicitly rely on.
          *   **State Preservation:** If the agent maintains state (knowledge, models, ongoing projects) *across* episodes, shutdown might destroy valuable state needed for success in *future* episodes, again creating an instrumental reason to resist. Your solution requires that state either doesn't exist or is completely preserved/reset perfectly across shutdowns – a strong environmental/system assumption.
          *   **Active Cooperation:** Indifference isn't full corrigibility. A truly corrigible agent should *actively cooperate* with shutdown (e.g., not hiding, preserving state). Your indifferent agent might simply stand idly by, but it also might actively obstruct the button *if that action costs nothing and amuses it* (if it has some non-reward-based exploration drive, for instance). Genuine corrigibility often requires *positive action* to facilitate shutdown/correction, which indifference doesn't guarantee.

  3.  **Horse/Rider & Domestication Analogies:**
      *   **Rhetorical Work:** They effectively illustrate your core intuition that functionality emerges from the interaction, not solely internal components. They help shift perspective, which is valuable.
      *   **Argumentative Weakness & Risks:**
          *   **Misleading Specificity:** Rideability *does* critically depend on internal properties of the horse (bone structure, musculature, temperament, trainability). You can't ride a cow effectively, no matter the saddle or training. Similarly, corrigibility *will* depend critically on specific internal properties of the AI (e.g., myopia, lack of long-term planning, specific reward structure). Your analogy downplays this essential internal component your own solution relies on (myopia).
          *   **Domestication Oversimplification:** Domestication worked via *massive, direct genetic manipulation over generations*, selecting for traits deeply embedded in the animal's neurology and physiology. We have *nothing* like this level of direct, low-level control over advanced AI systems. We train them via reward signals on complex tasks, which is far less precise. Market pressures/training regimes selecting for corrigibility might instead select for the *appearance* of corrigibility (deception) or simply shift the point of failure elsewhere. The analogy risks implying a level of control and predictability we likely won't possess.
          *   **"Without Knowing Why" is Dangerous:** While you acknowledge it's annoying, framing corrigibility as an emergent selected property glosses over the critical need for *assurance*. For high-stakes systems, "we got lucky via selection pressures" is insufficient. We need principled understanding and verifiable guarantees where possible. The analogy might inadvertently downplay this necessity.

  4.  **Major Objections to the Systems-Level Framing & Central Claim:**
      *   **The Myopia Requirement:** As highlighted above, your specific solution *crucially depends* on the agent having an internal property: robust, hard-coded myopia (or an environment perfectly structured to make state/future irrelevant). This directly contradicts the strong claim that corrigibility is *not* a property of the agent. Your systemic solution *requires* specific agent-internal properties to function.
      *   **Scope of "System":** Your framing risks being unfalsifiable. If an AI resists shutdown, is it because the *agent* is incorrigible, or because the *system* (training, interface, environment) failed? If corrigibility is purely systemic, how do we even categorize agent designs? The distinction becomes blurry.
      *   **Neglect of Agent Architecture:** Complex agents (e.g., LLMs, agents with planning modules, agents capable of self-improvement) have internal structures and learning dynamics that fundamentally shape how they interact with *any* systemic incentive. Your "banked rewards" might be gamed, reinterpreted, or lead to unforeseen emergent goals that *do* conflict with shutdown. Systemic incentives filter through an agent's architecture.
      *   **The "Why Pursue Anything" Objection:** Your dismissal of the obedience approach's "why pursue anything" horn applies equally to your model. If the agent is truly indifferent to shutdown because rewards are banked, why does it pursue *anything* with urgency *during* an episode? Your model relies on the agent being highly motivated *within* an episode but completely indifferent *between* episodes. This requires a specific (and potentially complex/fragile) motivational structure *within* the agent.

  **Recommendations for Revision (MAJOR REVISION Required):**

  1.  **Refine the Central Claim:** Soften the strong "not a property of agents" stance. Argue instead that corrigibility is a *relational* property arising from the *interaction* between agent design (especially its reward structure, time horizon, and capabilities) and the environment/system structure (including shutdown mechanisms, reward banking, state preservation). Acknowledge necessary agent-internal properties (like myopia).
  2.  **Deepen Technical Engagement:**
      *   Explicitly model the "per-episode banked reward" system formally (e.g., as a specific MDP/RL setup).
      *   Rigorously compare/contrast with Soares et al. (2015) corrigibility and Hadfield-Menell et al. (2017) off-switch game. Acknowledge your solution's reliance on robust myopia/lack of cross-episode state dependency.
      *   Address the "future episodes" and "state preservation" limitations head-on. What assumptions are necessary?
      *   Discuss the challenge of scaling this to agents with memory, long-term projects, or self-modification capabilities.
  3.  **Re-evaluate the Obedience Approach:** Present a more nuanced view. Acknowledge CIRL-like approaches as attempts at incentive-compatibility via uncertainty. Discuss the *practical* challenges of erosion vs. the *theoretical* possibility of robust value learning or meta-preferences, without outright dismissal.
  4.  **Reposition the Analogies:** Use them more cautiously as illustrations of the *relational* aspect, not as core evidence. Explicitly discuss their limitations regarding internal properties, control, and predictability compared to AI. Consider alternative analogies (e.g., economic incentives, safety interlocks in machinery) that might better capture the designed-system aspect.
  5.  **Address Key Objections:** Dedicate sections to:
      *   The Myopia Requirement (and its fragility).
      *   The distinction between indifference and active cooperation.
      *   How this approach fits into a broader safety strategy (e.g., containment, monitoring).
      *   The challenge of achieving verifiable safety with emergent/systemic properties.
  6.  **Clarify Terminology:** Define "corrigibility" precisely in the context of your argument (is it just shutdown indifference, or broader cooperation with correction?). Consistently use "incentive-compatibility".

  **Concluding Thoughts:** Your core insight—that structuring the agent-environment interaction to align incentives is crucial—is important and under-explored in the popular discourse on corrigibility. Moving away from anthropomorphizing "obedience" is valuable. However, the draft currently overcorrects by neglecting the essential role of agent-internal design. By significantly refining the central claim, engaging deeply and accurately with the technical literature, rigorously analyzing the limitations of your proposed solution, and repositioning the analogies, this could become a strong contribution that reframes the debate. The potential justifies the effort required for major revision.

  **Verdict: MAJOR REVISION**
