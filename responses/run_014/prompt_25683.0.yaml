  The core tension lies between our everyday practice of testimonial knowledge transfer and the special resistance applied to moral claims. I need to reconstruct the implicit epistemological commitments behind this behavior. The user wants me to distinguish between necessary presuppositions versus compatible theories, and identify where the practice underdetermines the philosophical explanation.

  Key observations from the case: people insist on first-person reasoning even when deferring would be efficient, and this persists despite trusting the testifier's character and competence. This suggests the resistance isn't about reliability but about something inherent to moral judgment itself.

  For the strong interpretation (testimonial transmission impossible), the blocking features could include: moral facts being non-propositional (expressivism), requiring first-personal grasp (Kantian approaches), or being essentially connected to motivation (internalism). But the practice doesn't strictly entail impossibility - after all, we do sometimes accept moral testimony in practice, just with reluctance.

  The weaker claim (possible but defective) better fits the described unease. Here the defect could stem from: loss of understanding (Grimm), lack of agential ownership (Hills), or failure of moral development (Aristotelian views). This preserves testimonial knowledge while explaining why we resist it.

  Crucially, the practice underdetermines several key issues: whether moral facts are objective, whether testimony provides justification (just not the best kind), and how to characterize the "defect." For instance, both robust realists and constructivists can endorse the asymmetry, albeit for different reasons.

