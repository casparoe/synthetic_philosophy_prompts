answer: |-
  The testimonial asymmetry in moral judgment reveals a complex implicit epistemology that distinguishes moral knowledge from empirical knowledge. This practice doesn't strictly require the *impossibility* of moral testimony but does commit us to the view that **moral understanding requires first-personal engagement**, and that acquiring moral beliefs via testimony is **epistemically or agentially deficient** even when possible. Below is a reconstruction of the implicit commitments, distinguishing necessary presuppositions from compatible theories, and identifying points of underdetermination.

  ---

  ### **Core Presuppositions of the Asymmetry**
  1. **Moral Judgment is Action-Guiding in a Unique Way**  
     Moral beliefs directly implicate *practical identity* and *agency*. To accept a moral conclusion without personal engagement is seen as failing to take responsibility for one's actions ("If I act on your word alone, *I* didn't truly decide"). This presupposes:  
     - **Internalism**: Moral judgments motivate action or require endorsement (e.g., believing "X is wrong" entails feeling compelled not to do X).  
     - **Agency Condition**: Moral knowledge isn't inert information; it must be integrated into practical reasoning by the agent.

  2. **Moral Understanding Requires Grasping Reasons**  
     Unlike empirical facts (e.g., store closing times), moral truths are seen as *reason-dependent*. Merely accepting a conclusion ("this is unjust") without grasping the justifying reasons ("why it’s unjust") fails to constitute genuine understanding. This implies:  
     - **Non-Transmissibility of Understanding**: Testimony can transmit *belief* but not *understanding* (as per Linda Zagzebski).  
     - **Defeasibility by First-Personal Scrutiny**: Moral claims remain open to revision until the agent evaluates the reasons (even from trusted sources).

  3. **Moral Facts are Not Purely Descriptive**  
     The resistance suggests moral properties (e.g., injustice) aren't reducible to natural facts observable by third parties. If moral facts were like "water is H₂O," deference to experts would be unproblematic. Thus, the practice assumes:  
     - **Non-Naturalism or Irreducibility**: Moral facts require normative interpretation, not merely empirical discovery.  

  ---

  ### **Does This Commit Us to the Impossibility of Moral Testimony?**
  **No.** The asymmetry is compatible with two views:  
  - **Weak Claim (Defended here)**: Testimony *can* transmit moral knowledge, but it is **epistemically or morally defective** to rely on it.  
  - **Strong Claim**: Testimony *cannot* transmit moral knowledge at all.  

  The practice **strictly presupposes only the Weak Claim**, as evidenced by:  
  - People *do* sometimes defer on moral matters (e.g., trusting ethicists on complex issues like AI ethics).  
  - Resistance stems from unease about *how* the belief is acquired, not certainty that it’s false.  

  **What Explains the "Defect" in Testimonial Acceptance?**  
  - **Loss of Understanding**: Testimony may provide true belief but not grasp of reasons (Robert Audi).  
  - **Agency Failure**: Bypassing deliberation undermines moral autonomy (Christine Korsgaard).  
  - **Epistemic Risk**: Moral testimony lacks "safety" – without understanding reasons, you can’t spot errors (Allison Hills).  

  ---

  ### **Explanatory Features of Moral Epistemology**
  1. **The Block on "Pure" Testimonial Transmission**  
     If testimony fails, it’s due to:  
     - **Non-Objectivity of Moral Facts** (e.g., expressivism): Moral judgments express attitudes, not facts; testimony can’t transmit non-cognitive states.  
     - **Access Internalism**: Moral facts require first-personal access (e.g., Kantian rationality).  
     - **Thick Ethical Concepts**: Understanding "injustice" requires experiential engagement (Bernard Williams).  

  2. **Why Defective Even If Possible**  
     - **Moral Worth**: Acts based on understanding are more praiseworthy (Julia Driver).  
     - **Cognitive Achievement**: Moral knowledge is valuable only if earned through reasoning (Duncan Pritchard).  
     - **Social Epistemology**: Moral credibility requires demonstrating understanding (Miranda Fricker).  

  ---

  ### **Points of Philosophical Underdetermination**
  The practice is compatible with multiple metaethical theories:  
  | **Theory** | **Compatible with Asymmetry?** | **Why?** |
  |------------|-------------------------------|----------|
  | **Moral Realism (Non-Naturalist)** | Yes | Moral facts require rational insight; testimony provides belief but not insight. |
  | **Kantian Constructivism** | Yes | Moral truths arise from autonomous reasoning; testimony bypasses self-legislation. |
  | **Humean Expressivism** | Yes | Moral testimony fails to express *your* attitudes. |
  | **Virtue Ethics** | Yes | Moral understanding requires habituation; testimony is "unearned." |
  | **Naturalist Realism** | **No** (unless qualified) | If moral facts are empirical, deference to experts should be unproblematic. |

  **Specific Underdetermined Questions:**  
  1. **Objectivity vs. Subjectivity**: The asymmetry fits both robust realism ("moral facts are mind-independent but require rational engagement") and relativism ("norms are community-relative, so you must situate judgments").  
  2. **Source of Defect**: Is the flaw epistemic (e.g., lack of justification) or practical (e.g., loss of autonomy)? The practice doesn’t specify.  
  3. **Scope of Testimony**: Must *all* moral beliefs be earned, or just foundational ones? The practice is silent.  

  ---

  ### **Conclusion**
  The asymmetry presupposes that **moral knowledge is fundamentally practical and reason-involving**, making testimony inadequate for *understanding* and *agency*, even if it can transfer true belief. It commits us to the **Weak Claim** – that testimonial acceptance is defective – but not the impossibility of moral testimony. This defect stems from the nature of moral reasons: they demand first-personal grasp to guide action responsibly. The practice is best explained by theories emphasizing **moral understanding as a cognitive achievement** (e.g., virtue epistemology) or **autonomy as constitutive of morality** (e.g., Kantianism), but remains underdetermined on metaethical ontology. Ultimately, the asymmetry reveals that we treat moral judgment not as information-acquisition, but as **participatory rational engagement**.
