prompt: |-
  I'm giving a talk at a political theory workshop in about three weeks and I need a Q&A prep sheet because the position I'm defending is one I know is gonna get attacked. I've got maybe fifteen minutes of Q&A at the end. My thesis, stated bluntly, is that the Condorcet jury theorem is basically a red herring as a defense of democracy: it's a conditional theorem that only kicks in when the choice is binary, each voter has competence strictly above 1/2, and the voters are independent, and real elections fail all three of those, so the theorem is doing almost no work for the institution people actually want it to defend. The room is mostly political scientists, a couple of social choice theorists, and one or two Bayesian statisticians, and no mathematicians, so I don't expect anyone to go at the proof itself; I expect them to go at the applicability and the signifcance. I want the objections I'll actually get from this crowd, phrased the way a political scientist or a social choice theorist would phrase them, not the generic textbook versions I've heard a hundred times. Order them by how much damage they'd do. For each one give me a roughly two minute reply and a note on where my reply is soft. I'm fine conceding ground where it's due, so flag what I should concede up front so the rest of the argument doesn't collapse. And include the one objection I'm hoping nobody raises but that I should still be ready for.
