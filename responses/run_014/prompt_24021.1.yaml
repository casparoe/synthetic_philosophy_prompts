  Third, the "institutional design" counter: CJT informs how to structure elections (e.g., forcing binary choices via runoffs). This is sneaky because it accepts the thesis but claims CJT still guides reform. Reply: admit this is valid but stress most democracies don’t implement such designs. Soft spot: if someone cites countries with runoffs, I’d need empirical counter-evidence. 

