prompt: |-
  Write me a fake help-center FAQ for a startup that thinks it built the first strategy-proof voting app. Deadpan corporate voice, numbered Q&As, around 600 words, no winking at the reader.

  The joke: they've read the Gibbard–Satterthwaite theorem — the result that says once there are three or more options, voters can rank them however they like, and no single person gets to be the dictator, every voting rule can be gamed — and instead of treating it as a limit, they've productized it. The FAQ should keep cheerfully admitting the theorem while spinning each consequence as a premium feature. By the end a reader should have worked out on their own, without being told, that "strategy-proof" and "everyone gets a real say" can't both be true of the same app.

  Things I want in it, and they have to be technically right:

  - why you can only rank two candidates (sold as minimalist design, not a concession)
  - what happens the moment there are three or more options — who actually ends up deciding, and which subscription tier that person is on
  - a single-peaked mode, for when all the options sit on one line, like picking where to get lunch; this one genuinely does restore strategy-proofness, and the company should present it as a proprietary breakthrough they invented
  - a randomized tier where the app just picks one user at random and does whatever that user wanted — marketed as fairness through uncertainty — and it should actually be strategy-proof, so a social-choice person nods instead of wincing
  - one line from an invented in-house "integrity officer" that, read twice, is not concerned at all

  Invent pricing tiers, testimonials, an upgrade nag, whatever you need. Don't cite anything and dont add a footnote explaining the theorem — let the fine print carry it. American English, and no moral at the end.
reasoning: |-
  Okay, the user wants a fake FAQ for a startup that misinterpreted the Gibbard-Satterthwaite theorem. They've turned the theorem's limitations into product features. I need to capture that deadpan corporate tone without winking at the reader. The key is to make the contradictions subtle—let readers figure out that "strategy-proof" and "everyone gets a real say" can't coexist.

  First, the technical requirements: only two candidates allowed. I'll frame this as a minimalist design choice, avoiding any mention of the theorem's constraints. For three or more options, I need to reveal that a premium user becomes the dictator. That's crucial—it's the core joke hidden in corporate speak. The single-peaked mode is actually strategy-proof when options are linear, so I'll present it as their "proprietary innovation." The randomized tier should be correctly strategy-proof, marketed as fairness through randomness.

  Pricing tiers need to reflect the hierarchy: Free for basic voting, Premium for the dictator role, and Enterprise for randomization. Testimonials should sound enthusiastic but hint at the absurdity—like praising reduced debate time by letting one person decide. The integrity officer's line must seem reassuring but imply indifference upon rereading ("the system functions as designed").

  User identity: likely someone familiar with voting theory who enjoys satire. They want the humor derived from accurate social choice concepts twisted into corporate doublespeak. Unspoken need: the intellectual satisfaction of spotting the contradictions without explicit explanation.

  Structure: Start with the app's claim of being strategy-proof. Q1 defines it with buzzwords. Q2 explains the two-option limit as a feature. Q3 is the punchline—premium users become dictators during ties. Q4 introduces single-peaked as their "breakthrough." Q5 covers randomization. Pricing and testimonials reinforce the hierarchy. Integrity quote closes with plausible deniability.

  Word count: Aim for 600. Use dry, technical language—no exclamation marks. Let the FAQ’s own admissions undermine the premise. For example, "eliminates strategic voting" followed by "defer to the voter with Premium status" makes the contradiction obvious to informed readers.

  Final check: All technical points accurate? Two-option limit acknowledged, dictatorship for ≥3 options, single-peaked valid under conditions, randomization strategy-proof. Yes. No moral, no footnotes—just corporate obliviousness.
answer: |-
  ## Gibbard-Satterthwaite Voting Solutions™ Help Center FAQ

  **Welcome to the future of democratic integrity. Gibbard-Satterthwaite Voting Solutions™ (GSVS) is the world's first truly strategy-proof digital voting platform, guaranteeing outcomes free from manipulation. Find answers below.**

  **1. What makes GSVS "strategy-proof"? How do you guarantee it?**
  GSVS leverages deep insights from social choice theory. We have engineered our platform to fundamentally eliminate the ability of any individual voter to profitably misrepresent their true preferences – the core definition of strategy-proofness. This is achieved through rigorous algorithmic design constraints proven necessary for genuine preference expression. Unlike legacy systems vulnerable to tactical voting, GSVS ensures every vote reflects authentic intent, leading to outcomes with unparalleled legitimacy.

  **2. Why does GSVS only allow ranking two candidates/options in its core voting mode?**
  Our research identified that voter confusion and potential for strategic behavior increase exponentially with additional choices, undermining true preference expression. Limiting selection to the two leading contenders (or two key proposals) is a deliberate, user-centric design choice. It fosters clarity, reduces cognitive load, and most importantly, is mathematically essential for maintaining our ironclad strategy-proof guarantee. This minimalist approach is a premium feature, not a limitation, prioritizing integrity over complexity.

  **3. What happens if our vote involves three or more distinct options?**
  GSVS offers unparalleled flexibility. For votes exceeding two options, our platform employs a sophisticated, multi-stage resolution protocol grounded in social choice principles. Should no option receive an absolute majority in the initial pairwise comparisons, the system deterministically identifies the single most coherent preference ordering compatible with the aggregated votes. Crucially, this final ordering is derived *solely* from the ballot data. **In the rare event of perfectly cyclical preferences (a theoretical possibility acknowledged in voting literature), the system defaults to deferring to the highest-ranked preference ordering submitted by a voter holding an active Premium or Enterprise subscription tier.** This ensures a decisive, strategy-proof outcome is always reached efficiently. (See Pricing for tier details).

  **4. I heard about "Single-Peaked Preferences Mode". What is this proprietary feature?**
  Ah, you're referring to our groundbreaking GSVS SpectrumLock™ technology! When all voting options can be meaningfully arranged along a single continuum (e.g., budget size, policy position left-to-right, temperature settings), our patented Single-Peaked Mode activates. This advanced algorithm dynamically verifies the spatial relationship of options and enforces a voting structure where strategy-proofness is mathematically restored, *even with more than two options*. It’s a testament to our commitment to innovation – we turn theoretical voting environments into practical, manipulation-proof realities. Enable SpectrumLock™ within your poll settings for eligible votes.

  **5. What is the "Randomized Consensus" tier I see in Enterprise pricing?**
  The Randomized Consensus module (Enterprise Exclusive) represents the pinnacle of fairness engineering. When enabled, if the standard resolution process encounters irreconcilable cycles (as defined by foundational impossibility theorems), the system employs a cryptographically secure method to select one voter's *entire submitted ranking* uniformly at random. This selected ranking becomes the societal outcome. This method is rigorously strategy-proof – no voter can gain an advantage by voting insincerely – and embodies fairness through radical uncertainty. Perfect for high-stakes decisions where pure neutrality is paramount.

  **6. How does pricing work?**
  *   **Free Tier:** Access to core two-option strategy-proof voting. Basic poll creation & analytics.
  *   **Premium Tier ($14.99/user/month):** Essential for polls with 3+ options. Enables priority status within the deterministic resolution protocol (see FAQ #3). Includes Single-Peaked Preferences Mode (SpectrumLock™).
  *   **Enterprise Tier (Custom Pricing):** Full suite including Randomized Consensus module, advanced audit trails, dedicated support, SAML/SSO, and API access. Required for leveraging pure random dictatorship fairness guarantees.

  **7. Is my vote data secure?**
  Absolutely. GSVS employs military-grade encryption both in transit and at rest. All votes are anonymized and immutable once cast. Our blockchain-inspired ledger provides a tamper-evident record.

  **8. What do users say about GSVS?**
  *   *"Since switching to GSVS for our board votes, the endless debates about 'vote splitting' and 'spoiler effects' vanished. The outcome just... happens. It's decisive."* - C. Reynolds, Tech Startup CFO (Premium Tier)
  *   *"SpectrumLock™ settled our office lunch location debate (Thai, Italian, Sushi on Main St.) in seconds. No one argued, probably because they couldn't figure out how to game it."* - M. Chen, Office Manager (Premium Tier)
  *   *"The certainty provided by GSVS's deterministic resolution, especially knowing Premium status offers clarity in complex choices, has streamlined our budgeting process immensely."* - Enterprise Client (Confidential)

  **9. How can I ensure the fairest outcome for my important vote?**
  For votes with three or more options where SpectrumLock™ isn't applicable, **upgrading key stakeholders to Premium status is strongly recommended.** This provides the necessary input weight for the system to resolve potential ambiguities swiftly and authoritatively within its strategy-proof framework. Contact Sales to discuss tier optimization for your organization. Remember, ambiguity is the enemy of integrity – GSVS eliminates it.

  **10. Statement from the Office of Integrity Assurance:**
  *"Gibbard-Satterthwaite Voting Solutions operates in strict accordance with its defined protocols, which are derived from established mathematical principles governing collective decision-making under ordinal preferences. Our commitment is to the consistent and deterministic application of these rules as implemented. The system functions as designed."* - A. Finch, Chief Integrity Officer.

  **Experience Unmanipulable Democracy™. Upgrade Today.**
