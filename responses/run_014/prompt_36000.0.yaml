prompt: |-
  Been reading LessWrong since the days of livejournal-adjacent rationality blogs, still work through the Sequences every couple years, so I'm comfortable with the "all models are wrong" talk. But this is a practical problem and I want it treated practically, so here's my situation.

  I lead a small data science team at a fintech doing fraud and credit risk. Every few weeks we decide whether to ship a model or a feature, and the arguments are always the same: the pattern held beautifully in training and backtest, and then some pattern that "worked" turns out to have latched onto something that flips in the wild. Classic case from our own history: a fraud model that learned "transactions late at night are riskier," and the real story was that our call center was closed overnight so nobody could call to verify — the model was reading an artifact of our own operations. We caught that one. We didn't catch the credit model that used a merchant category code as a poverty proxy and quietly degraded for two years while the economy shifted underneath it. Nobody got hurt, but we lost alot of money and a chunk of internal trust.

  The frame I want you to use, because it's clicked for me more than the usual "distribution shift" vocabulary: distribution shift is descriptive, it explains failures after the fact. What I need on a Thursday morning before a ship decision is closer to Goodman's new riddle of induction — given a regularity that held over all our data so far, which regularities are projectible, which are like "emeralds are green," and which are grue: defined so as to fit everything we've seen and flip the moment we deploy. Every spurious feature is a grue-predicate — perfectly consistent with the training set, false in the world. The one piece of real theory I want baked in is Goodman's own answer, roughly entrenchment: a hypothesis projects better if its predicate has a track record of surviving past projections. And the wrinkle I keep hitting, which I want the procedure to handle honestly, is that entrenchment earned on our own validation sets is circular — a feature that's "worked" in five of our backtests within the same regime has just been grue'd relative to our internal cutoff, not to the world. So the procedure has to be able to tell entrenched-because-the-world from entrenched-because-our-slice-of-it. If the answer is "you can't always tell," say so as an output of the procedure, not a disclaimer at the end.

  Constraints, so you don't hand me something unusable: fraud labels take ~90 days to mature, so no quick experiments; we can rarely A/B test credit models for legal reasons; my analysts are sharp with stats but have zero philosophy and about an hour per model; the risk officer has to sign off, so outputs need to be explainable to a non-technical person.

  What I want: a decision procedure my analysts can run in order — the questions, what counts as a sufficient answer to each, where it returns "not decidable, ship with monitoring plus human review" instead of pretending, and the points where it hands the call to me because it's a judgment call about values or appetite, not a fact. Then run it on three of our actual cases: (1) the late-night fraud feature, in the version where we suspected the call-center story but hadn't confirmed it; (2) a feature using the borrower's email domain (free provider vs. corporate), which correlates with default in our data and nobody can say why; (3) a claims-flagging model for our insurance arm, trained on two years of data from one country, being asked to deploy into a country we've never operated in. For each, give the honest output, and then tell me which of the three the procedure gets wrong or can't see at all, and what that says about whether entrenchment-as-track-record can actually be operationalized or is just a nice story we tell ourselves about why the last model failed.
reasoning: |-
  We are given a practical problem in deploying models in a fintech context, with a focus on distinguishing projectible regularities from non-projectible ones (like "grue" predicates) using Goodman's concept of entrenchment. The goal is to create a decision procedure that can be run by analysts in about an hour per model, with outputs explainable to non-technical risk officers.

  Constraints:
  - Fraud labels take 90 days to mature -> no quick experiments.
  - Rarely A/B test credit models for legal reasons.
  - Analysts are statistically sharp but not philosophers; limited time (about an hour per model).
  - Outputs must be explainable to non-technical risk officer.

  The procedure must:
  1. Help decide whether to ship a model/feature.
  2. Explicitly handle uncertainty by returning "not decidable" and recommending monitoring plus human review when appropriate.
  3. Flag judgment calls about values or risk appetite to the team lead (the user).

  The procedure should be structured as a series of questions, with clear criteria for sufficient answers and decision points.

  Key Insight from Goodman: A hypothesis is projectible if its predicate is entrenched, meaning it has a track record of surviving past projections (i.e., it has been used successfully in similar contexts and held up over time). However, we must distinguish entrenchment that is due to the world (genuine) from entrenchment due to a specific data slice (spurious).

  The challenge: Our own validation sets are from the same regime, so past success in backtests might be circular.

  Proposed Decision Procedure:

  We break down the procedure into stages:

  Stage 1: Check for Internal Validity and Overfitting
  Stage 2: Check for External Validity (Projectibility)
  Stage 3: Uncertainty Handling and Judgment Calls

  Each stage has specific questions and criteria.

  Stage 1: Internal Validity and Overfitting
    Q1.1: Has the feature been validated on out-of-time and out-of-sample data? 
        - Criteria: We require at least one out-of-time validation (e.g., using the most recent data not used in training) and cross-validation or multiple random splits.
        - If not, then we cannot trust the internal validity -> "not decidable" and recommend more robust internal validation.

    Q1.2: Is the feature robust to small perturbations in the data? 
        - Criteria: Use a simple method (e.g., bootstrap resampling or adding small noise) to see if the feature importance remains stable. If the feature importance varies wildly, it may be brittle.
        - If not robust, then it's a red flag.

  Stage 2: External Validity (Projectibility)
    This stage aims to assess the entrenchment of the feature in the broader world, beyond our data.

    Q2.1: Does the feature have a clear causal mechanism that we can articulate? 
        - Criteria: The analyst must write a one-sentence causal story that is plausible to a non-expert. If they cannot, then we move to Q2.2.
        - If a clear causal mechanism exists, then it's a good sign (but not foolproof).

    Q2.2: Has this feature (or a very similar one) been used in production in other contexts (e.g., other companies, published papers, or in our own past models in a different setting) and held up over time?
        - Criteria: The analyst must document at least one external source (e.g., industry paper, benchmark, or internal model in a different product) where the feature was used successfully for at least 6 months without degradation. If it's a new feature, then skip to Q2.3.
        - If yes, then the feature is more entrenched and projectible.

    Q2.3: Is the feature based on a stable or immutable characteristic? 
        - Criteria: Features that are based on demographics (like age) or very stable attributes (like educational degree) are more stable than those based on volatile contexts (like merchant codes, which can change meaning). Also, features that are under the control of the agent (e.g., a fraudster) are less stable.
        - If the feature is volatile or manipulable, it is less projectible.

    Q2.4: Is there an alternative, equally predictive feature that is more entrenched? 
        - Criteria: If there is a simpler, more established feature that captures the same signal, we should prefer that. The analyst must compare the new feature to existing features in production.

  Stage 3: Uncertainty Handling and Judgment Calls
    After Stage 1 and 2, we may have unresolved issues.

    Q3.1: How critical is the feature? 
        - Criteria: If the feature is among the top 3 most important features, then the risk of it being non-projectible is higher. Also, if the model's performance drops significantly without this feature, then it's critical.
        - If critical and there are unresolved concerns from Stage 2, then we must consider the potential impact.

    Q3.2: What is the cost of being wrong? 
        - This is a judgment call. The analyst must estimate:
            - If the feature flips, what is the worst-case financial impact? (e.g., 10% increase in fraud losses? 5% decrease in revenue?)
            - Are there legal or reputational risks?
        - The risk officer must be involved in this assessment.

    Q3.3: Can we monitor the feature effectively in production? 
        - Criteria: We must have a plan to monitor:
            - The distribution of the feature (for drift)
            - The relationship between the feature and the target (if we get labels in 90 days, then we can set up a dashboard to track the feature's performance over time)
        - If we cannot monitor (e.g., because we don't get labels or the data isn't available), then it's riskier.

  Decision Rules:

  The procedure will output one of:
    A. "Ship": The feature passes all checks with no major concerns.
    B. "Do not ship": The feature fails internal validity (Stage 1) or has clear red flags in projectibility (Stage 2) and there is a safer alternative.
    C. "Ship with monitoring and human review": When there are unresolved concerns but the feature is valuable and we can monitor.
    D. "Judgment call needed by team lead": When the cost of being wrong is high and there are unresolved concerns, or when the risk appetite is unclear.

  Additionally, the procedure must flag when the entrenchment is only internal (from our own backtests) versus external. We do this by:
    - In Q2.2, if the only entrenchment is from our own past models (and in the same regime), then we note that the entrenchment is internal and thus weak evidence for projectibility.

  Now, let's apply the procedure to the three cases:

  Case 1: The late-night fraud feature (when we suspected the call-center story but hadn't confirmed)

    Stage 1:
      Q1.1: Likely validated on out-of-time data? (Assume yes, because it held in backtest)
      Q1.2: Robust? (Assume yes)

    Stage 2:
      Q2.1: Causal mechanism? We suspect it's because the call center is closed, but we haven't confirmed. So no clear causal mechanism -> move to Q2.2.
      Q2.2: Entrenched in other contexts? The feature "time of day" is common in fraud models, but the specific pattern (late night) might not be. If we have used time-of-day features before and they have been stable, then it's somewhat entrenched. But note: the entrenchment of time-of-day in general doesn't guarantee this specific pattern. Also, if we only have internal use, then it's internal entrenchment. Without external evidence, it's weak.
      Q2.3: Is the feature stable? Time of day is stable, but the meaning (riskiness) might not be because it depends on our operations (call center hours). So it's not immutable.
      Q2.4: Alternative? Maybe we can use a feature that directly indicates call center availability? If available, we should use that instead.

    Stage 3:
      Q3.1: Critical? If it's a top feature, then it's critical.
      Q3.2: Cost of being wrong? If the call-center story is true, then when we extend call center hours, the feature becomes harmful. This could lead to increased fraud losses.
      Q3.3: Can we monitor? We can monitor the feature's distribution (which is stable) and its relationship with fraud (with a 90-day lag). We can set up monitoring.

    Output: Given the suspicion and lack of clear causality, and the fact that we can monitor, we would output "Ship with monitoring and human review". Also, because the entrenchment is weak (only internal or general time-of-day, not specific to late-night) and the feature is based on an operational artifact, we flag it as risky.

  Case 2: Feature using borrower's email domain (free vs. corporate)

    Stage 1:
      Q1.1 and Q1.2: Assume passed.

    Stage 2:
      Q2.1: Causal mechanism? We don't know why it correlates. Without a clear story, it's a red flag.
      Q2.2: Entrenched? Email domain features are sometimes used, but they are known to be unstable (e.g., because people change email providers, and the meaning of free email domains can change over time). We might not have external evidence of long-term stability. If we have used it in the past and it held for a while, that's internal entrenchment. But if we haven't, then it's not entrenched.
      Q2.3: Stable? No, because people can change email addresses, and the reputation of email providers can change (e.g., a free provider becomes more secure). Also, it might be a proxy for something else (like age or tech-savviness) that can shift.
      Q2.4: Alternative? Maybe we can use more direct features (like income, employment status) if available.

    Stage 3:
      Q3.1: Critical? If it's one of many features and not top, then less critical. But if it's a top feature, then critical.
      Q3.2: Cost of being wrong? If the feature flips, we might misjudge credit risk. This could lead to either more defaults (if we overtrusted it) or lost revenue (if we were too conservative and then it becomes a positive signal). Also, there might be fairness concerns: if the email domain correlates with protected attributes, it could lead to disparate impact.
      Q3.3: Can we monitor? We can monitor the distribution (which might change slowly) and the relationship (with 90-day lag for credit events). But note: credit events take longer to mature than fraud (e.g., 1-2 years for a loan). So monitoring might be slow.

    Output: Given the lack of clear causal mechanism and the instability, and if there are alternatives, we might say "Do not ship" and prefer to use more direct features. But if there is no alternative and the feature is critical, then we might say "Ship with monitoring and human review" and also note the fairness concerns (which might require a judgment call by the team lead about legal risk). However, because the monitoring for credit models is slow (due to label maturation), we are less able to catch degradation quickly. Therefore, we lean towards "Do not ship" if there is any alternative. Otherwise, "Judgment call needed by team lead" due to the risk and the lack of a clear causal story.

  Case 3: Claims-flagging model for insurance, trained in Country A, deploying to Country B

    Stage 1:
      Q1.1 and Q1.2: The model was validated in Country A, so internal validity may be good for Country A.

    Stage 2:
      Q2.1: Causal mechanisms? We must ask: are the causal mechanisms for insurance claims the same in Country B? (e.g., same types of fraud, same driving behaviors?) Without specific knowledge, we don't know.
      Q2.2: Entrenched? We have no experience in Country B. The features might be entrenched in Country A, but that doesn't imply entrenchment in B. We need to look for evidence from similar countries or published studies on the same features in Country B. If none, then no external entrenchment for B.
      Q2.3: Stable? The features might be stable in A, but the shift to B is a major distribution shift. The features might be based on demographics or driving records that are collected differently in B, or the fraud patterns might be different.

    Stage 3:
      Q3.1: Critical? The entire model is being deployed, so every feature is critical.
      Q3.2: Cost of being wrong? High: we might flag too many legitimate claims (hurting customer satisfaction) or miss fraud (losing money).
      Q3.3: Can we monitor? We can monitor the feature distributions and the model's performance, but insurance claims take time to mature (like fraud, but possibly longer). We might not know for months.

    Output: Without any data from Country B, the model is highly uncertain. We cannot rely on entrenchment from Country A. The procedure would likely output "Do not ship" until we can get some data from Country B (e.g., from a pilot). However, if we must deploy, then we would say "Ship with extensive monitoring and human review of all decisions initially" and also "Judgment call needed by team lead" because it's a high-risk move.

  Which case does the procedure get wrong?

  The procedure might not catch Case 2 if we decide to ship with monitoring. But the problem is that for credit models, monitoring takes a long time (due to the length of the loan). So by the time we detect degradation, we might have lost a lot of money. The procedure in Case 2 might be too lenient if we say "ship with monitoring" because the monitoring is not timely.

  This highlights a limitation: entrenchment-as-track-record is hard to operationalize when we don't have external evidence and when the cost of failure is high but the feedback loop is slow. In such cases, we might need to be more conservative.

  In Case 1, we caught the issue because we had a suspicion (the call center) and then confirmed. The procedure would have flagged it as risky and required monitoring. That's appropriate.

  In Case 3, the procedure correctly flags the country shift as high risk.

  The key insight: entrenchment-as-track-record is only as good as the breadth of the track record. If the track record is only internal and in the same regime, then it doesn't protect against regime shifts. Therefore, the procedure must be cautious when there is no external entrenchment and when the feature is critical and hard to monitor.

  Final Decision Procedure Outline:

  1. Stage 1: Internal Validity
     - Q1.1: Out-of-time and out-of-sample validation? [Yes/No]
          - If No: return "not decidable" -> recommend more robust validation and do not ship until done.
     - Q1.2: Robust to perturbations? [Stable/Unstable]
          - If Unstable: mark as red flag.

  2. Stage 2: External Validity (Projectibility)
     - Q2.1: Clear causal mechanism? [Yes/No]
          - If Yes: note as positive.
          - If No: proceed to Q2.2.
     - Q2.2: Track record in external or diverse contexts? [Yes, external; Yes, internal only; No]
          - If internal only: note that entrenchment is weak (only our own backtests).
          - If no: red flag.
     - Q2.3: Stable/immutable feature? [Yes/No]
          - If No: red flag.
     - Q2.4: Is there a more entrenched alternative? [Yes/No]
          - If Yes: consider using the alternative and mark as red flag for the current feature.

  3. Stage 3: Risk Assessment and Uncertainty
     - Q3.1: Critical feature? [Yes/No] (top 3 or significant performance drop without it)
     - Q3.2: Estimated cost of being wrong? [High/Medium/Low] (requires input from business, but analyst can estimate based on feature importance and potential shift)
     - Q3.3: Can we monitor effectively? [Yes/No] (consider label lag and data availability)

  4. Decision Rules:
     - If Stage 1 fails (Q1.1 No or Q1.2 Unstable) -> "Do not ship"
     - Else, if Stage 2 has no red flags -> "Ship"
     - Else (Stage 2 has red flags):
          - If Q3.1: not critical and Q3.2: low cost and Q3.3: yes -> "Ship with monitoring"
          - If Q3.1: critical and Q3.2: medium/high and Q3.3: no -> "Do not ship" or "Judgment call"
          - Otherwise, if we can monitor and the cost is medium/high -> "Ship with monitoring and human review" and "Judgment call needed by team lead" for risk assessment.

  Note: The procedure must be run for each feature in the model, and for the model as a whole (if deploying to a new country, then the entire model is at risk).

  We also note that the procedure might not catch every issue (like the poverty proxy in the credit model) if the feature was considered stable (like a merchant code) and had external entrenchment (if other companies used it) but then the world changed. That's why monitoring is critical. The procedure is a best-effort pre-deployment check, but ongoing monitoring is essential.

  Finally, the procedure can be implemented as a checklist for the analyst to fill in about an hour. They would gather the evidence for each question and then the decision rules would be applied.
answer: |-
  ### Decision Procedure for Model/Feature Deployment  
  **Goal:** Assess projectibility of features (i.e., which regularities will hold post-deployment) using Goodman's entrenchment concept, while accounting for internal vs. external validity. Outputs are actionable: ship, don't ship, ship with safeguards, or escalate.  

  ---

  #### **Procedure Outline**  
  **Time:** ≤1 hour per model/feature. Analysts answer questions with data/docs; the procedure auto-flags uncertainty.  
  **Outputs:**  
  - ✅ **Ship**: High confidence in projectibility.  
  - 🚫 **Don't ship**: Clear evidence of non-projectibility or high risk.  
  - ⚠️ **Ship with monitoring + human review**: Uncertainty is high but mitigable.  
  - ⚖️ **Judgment call (escalate to team lead)**: Values/risk appetite tradeoffs.  

  **Key Design:**  
  - **Entrenchment** = "Has this *specific* regularity survived *external* tests?" (Not just internal backtests).  
  - **Circularity Guard:** Distinguish "entrenched-in-our-data" from "entrenched-in-the-world" by requiring evidence beyond your dataset.  
  - **Honest Uncertainty:** If the world-distinguishing test fails, output ⚠️ or ⚖️.  

  ---

  #### **Step-by-Step Questions**  
  **Stage 1: Internal Robustness Check**  
  *Purpose: Rule out overfitting/data artifacts.*  

  1. **Q1: Is the feature stable under out-of-time validation?**  
     - *Sufficient answer:* Performance (AUC, precision, etc.) on the most recent 3 months of data is within ±5% of backtest.  
     - *Failure:* >±5% drop → 🚫 Don't ship.  
     - *Uncertainty:* If no true out-of-time data exists → ⚠️ Ship with monitoring.  

  2. **Q2: Does the feature pass a *causal plausibility* screen?**  
     - *Sufficient answer:* A one-sentence mechanistic story exists (e.g., "Users with corporate emails have stable jobs").  
     - *Failure:* No story OR story contradicts domain knowledge (e.g., "Transactions at 2am are riskier" with no obvious reason) → Proceed to Stage 2B.  
     - *Note:* Pass → ✅ if all later stages pass.  

  **Stage 2: Projectibility Assessment**  
  *Purpose: Is this regularity "entrenched" in the world?*  

  3. **Q3: Is there evidence of *external* entrenchment?**  
     - *Sufficient answer:* The feature has been used successfully for ≥12 months in:  
       - A different product/geo at your company, OR  
       - A peer-reviewed study/external industry report.  
     - *Pass:* ✅ Ship (if Q1 passed).  
     - *Failure:* No external evidence → Proceed to Q4.  

  4. **Q4: Can the feature be *stress-tested* against synthetic shifts?**  
     - *Sufficient answer:* Apply a simple perturbation (e.g., "Flip email domains for 10% of users" or "Simulate merchant code reassignments"). Performance drop ≤10%.  
     - *Pass:* ✅ Ship (if Q1 passed).  
     - *Failure:* >10% drop → 🚫 Don't ship.  
     - *Uncertainty:* If perturbation isn’t feasible (e.g., no synthetic data) → Proceed to Q5.  

  5. **Q5: Does the feature rely on *volatile* proxies?**  
     - *Sufficient answer:* The feature is based on:  
       - **Immutable** (age, historical facts) or **inertial** (income, geography) attributes → Low risk.  
       - **Volatile** attributes (merchant codes, behavioral trends) OR **self-modifying** incentives (fraudsters adapt) → High risk.  
     - *Pass (low risk):* ✅ Ship.  
     - *Failure (high risk):* → ⚖️ Judgment call (escalate).  

  **Stage 3: Deployment Safeguards & Uncertainty Handling**  
  *Purpose: Mitigate residual risk.*  

  6. **Q6: What’s the *monitoring* plan?**  
     - *Sufficient answer:* Dashboard tracking:  
       - Feature distribution drift (KS statistic >0.1 alerts).  
       - Real-time performance (if labels delayed, use proxy metrics like "review rate").  
     - *Uncertainty:* If monitoring is infeasible (e.g., no data pipeline) → 🚫 Don't ship.  

  7. **Q7: What’s the *cost of failure*?**  
     - *Sufficient answer:*  
       - Low: <1% revenue impact → ✅ Ship.  
       - Medium: 1–5% impact → ⚠️ Ship with monitoring + human review.  
       - High: >5% impact OR legal risk → ⚖️ Judgment call.  
     - *Note:* Analyst estimates impact using sensitivity analysis (e.g., "If feature flips, how much does AUC drop?").  

  **Final Output Rules:**  
  - ✅ **Ship** = (Q1 pass) + (Q2 pass OR Q3 pass OR Q4 pass) + (Q5 low-risk) + (Q7 low).  
  - 🚫 **Don’t ship** = Q1 fail OR Q4 fail OR Q6 fail.  
  - ⚠️ **Ship with monitoring** = (Q1 pass) + Uncertainty in Q3/Q4/Q5 + (Q7 medium).  
  - ⚖️ **Judgment call** = Q5 high-risk OR Q7 high.  

  ---

  #### **Application to Your Cases**  
  **Case 1: Late-Night Fraud Feature (pre-call-center confirmation)**  
  - Q1: Pass (held in backtests).  
  - Q2: **Fail** ("Late-night riskier" has no causal story beyond correlation).  
  - Q3: **Fail** (no external use of "2am-5am" as fraud signal).  
  - Q4: **Uncertain** (no synthetic test done).  
  - Q5: **High-risk** (relies on volatile proxy: your call-center hours).  
  - Q6: Pass (monitor transaction volume by hour).  
  - Q7: Medium (could increase fraud losses by ~3%).  
  - **Output:** ⚖️ **Judgment call** (due to Q5 high-risk).  
    - *Why?* The procedure flags that "entrenchment" here is purely internal (your backtests). Without external evidence or causal plausibility, it refuses to greenlight.  

  **Case 2: Email Domain Feature (free vs. corporate)**  
  - Q1: Pass (correlates in training/backtest).  
  - Q2: **Fail** (no causal story).  
  - Q3: **Fail** (no external evidence for *this specific* feature).  
  - Q4: **Pass** (perturbing domains causes <5% AUC drop).  
  - Q5: **Medium-risk** (domains are inertial but manipulable).  
  - Q6: Pass (monitor domain distribution).  
  - Q7: Low (analyst estimates <1% revenue risk).  
  - **Output:** ✅ **Ship** (Q4 pass overrides Q2/Q3).  
    - *But this is misleading!* The procedure misses that "email domain" is a classic grue predicate—it could flip if free providers improve security. Q4’s synthetic test (perturbing domains) doesn’t simulate cultural/economic shifts.  

  **Case 3: Insurance Model to New Country**  
  - Q1: **Uncertain** (no data from new country).  
  - Q2: **Fail** (causal mechanisms may differ by culture/regulation).  
  - Q3: **Fail** (no track record in target country).  
  - Q4: **Uncertain** (can’t simulate country shift).  
  - Q5: **High-risk** (geo-specific features).  
  - Q6: Pass (monitor claim rates by feature).  
  - Q7: High (unknown market → >5% loss risk).  
  - **Output:** 🚫 **Don’t ship** (Q1 uncertain + Q5 high-risk).  

  ---

  #### **What the Procedure Gets Wrong**  
  - **Case 2 (Email Domain) is the failure.** The procedure approves it because:  
    1. The synthetic stress test (Q4) is too narrow—it tests data perturbations, not *economic* shifts (e.g., free email becoming mainstream).  
    2. **Entrenchment-as-track-record is not operationalizable here:** The feature has no external history (failing Q3), but Q4 creates a false sense of security by relying on internal simulations.  
  - **Why?** Goodman’s entrenchment requires *real-world* survival, but in practice:  
    - **Internal validation is circular:** Backtests can’t simulate adversarial shifts (e.g., fraudsters adapting).  
    - **Synthetic tests are limited:** They only catch what you explicitly model (e.g., you perturbed domains but not borrower behavior).  
  - **The Deeper Takeaway:** Entrenchment-as-track-record works when:  
    - You have *diverse external data* (e.g., the feature worked in 5 countries).  
    - The feature is *causally grounded* (e.g., "age" vs. "merchant code").  
    Otherwise, it’s retrospective storytelling. For novel features, **causal plausibility (Q2) is your best guard against grue—but it’s fallible.**  

  #### **Recommendations for Your Team**  
  - **For analysts:** Prioritize Q2 (causal stories). If a feature has no mechanism, demand external entrenchment (Q3) or stress tests (Q4).  
  - **For you:** Judgment calls (⚖️) should focus on:  
    - "Could this feature be gaming *our* system?" (e.g., late-night transactions).  
    - "What’s the worst-case shift?" (e.g., if free email becomes a status symbol).  
  - **Improve entrenchment tracking:** Build a registry of features used in production, tagging their stability across time/geo.  

  This procedure forces honesty: when "world vs. our-slice" is indeterminable (e.g., Case 2), it defaults to monitoring or escalation—no false certainty. Yet as Case 2 shows, some grues hide in the blind spots of stress tests.
