prompt: |-
  Every year in my philosophy of science seminar we do a couple weeks on the definition of life, and every year we end in the same puddle, so this time I'm running an experiment on my colleague Dana instead. Dana is a developmental biologist and she's very decisive about what's alive and what isn't -- twenty years of arguments over faculty lunches and I've basically got a ledger of her verdicts at this point. Alive: humans, oak trees, E. coli, a sterile mule, a worker honeybee (also sterile, obviously), HeLa cells, red blood cells, and decades-old freeze-dried bacterial spores that have zero metabolism while dormant but revive fine. Not alive: ordinary viruses, prions, self-replicating RNA strands that mutate and get selected in a test tube but have no membrane and no metabolism of their own, candle flames and whirlpools (she gets genuinely annoyed when the far-from-equilibrium thermodynamics people bring those up), the biosphere as a whole, and a glider from the Game of Life.

  Now I've got three new cases coming up and I want to be able to call her answers in advance, mostly so I can look smug. Case one: a synthetic protocell with a membrane and its own metabolism that maintains itself beautifully, except each one is assembled fresh in the lab, none of them ever reproduces, and its genome is copied error-free so no evolution will ever happen. Case two: the giant viruses, like mimivirus, that carry their own genes for chunks of the protein-synthesis machinery, which everyone agrees blurs the virus line. Case three: a self-replicating factory on the Moon, of the von Neumann probe sort -- repairs itself, mines, builds copies, no chemistry-of-life anywhere in it. Predict her verdict on each.

  What I actually care about is the rules underneath. Some obvious candidates get weeded out by her record -- the RNA replicator verdict seems to kill pure "life is Darwinian evolution" definitions, the flame thing kills bare thermodynamic self-organization, the spore verdict kills "currently metabolizing." What's left? To me it looks like some version of organized self-maintenance (with a potentiality clause for the spores) versus something about being a token of a reproducing, metabolizing lineage -- the mule and the worker bee are the load-bearing verdicts there -- but I'd like you to tell me which rules genuinely fit everything on her ledger, where they diverge on my three cases, your best guess with reasons for each verdict, and what further case you'd put in front of her to tell the surviving rules apart. Don't hold back on telling me my two candidate rules are secretly the same rule, if that's what you think -- I've been staring at this too long to trust myself.
reasoning: |-
  Hmm, the user is a philosophy of science professor running an annual seminar on defining life. They've collected 20 years of their colleague Dana's verdicts on borderline cases of life. Dana is a developmental biologist with consistent judgments: she considers things like sterile mules and worker bees alive, but rejects viruses, prions, and even complex systems like candle flames.

  The user presents three new cases: a non-reproducing protocell, giant mimivirus, and a von Neumann probe on the Moon. They want me to reverse-engineer Dana's underlying rules, predict her verdicts, and suggest a test case to distinguish between possible definitions. They suspect two main candidates: organized self-maintenance (with potentiality) versus being part of a reproducing metabolizing lineage.

  Looking at Dana's known verdicts:
  - Alive: sterile mules/bees (reproduction not required), spores (metabolism paused), HeLa/rbc (parts of lineages)
  - Not alive: viruses (no independent metabolism), RNA replicators (no metabolism/membrane), flames (no organization), Game of Life gliders (abstract)

  Key patterns: 
  1. Metabolism (current or potential) seems essential (spores dormant but revivable, viruses rejected despite replication)
  2. Cellular basis (membrane required? RNA replicators rejected for lacking one, protocell has it)
  3. Lineage matters indirectly - HeLa/rbc derive from organisms, but mules/bees individual viability suffices
  4. Autonomous self-maintenance (flames rejected despite thermodynamics)

  For the new cases:
  - Protocell: Has metabolism and membrane but no reproduction/evolution. Dana should say alive (like sterile mules).
  - Mimivirus: Blurs lines but still no metabolism. Likely not alive (consistent with virus rejection).
  - Von Neumann probe: Self-maintaining/replicating but not biochemical. Should be not alive (like candle flames).

  The underlying rule appears to be: "Autonomous self-maintenance of organized structure through biochemistry, with potential for metabolism." This explains all verdicts: viruses lack autonomy, flames lack biochemistry, spores have potential, mules maintain themselves.

  Suggested test case: A sterile, metabolizing android with organic components. If Dana rejects it, she requires biology; if accepts, she allows non-biochemical life. Probably she'd reject it based on her flame/Game of Life verdicts implying biochemistry is essential.
answer: |-
  Based on Dana's 20-year verdict ledger and your analysis, I've reverse-engineered her implicit rules, predicted her verdicts for your three new cases, and designed a diagnostic test case. Her pattern strongly suggests **one core rule with two non-negotiable elements**, not two separate rules. Here's the breakdown:

  ### Dana's Consistent Rule (Inferred from Verdicts)
  **Life = Autonomous self-maintenance of a bounded, metabolizing system grounded in biochemistry, with potential for continuity (even if unrealized).**

  Key components:
  1. **Autonomous self-maintenance via metabolism:** The system must actively regulate its internal state using energy/nutrients *on its own* (killing "bare thermodynamics" – flames lack autonomy/organization).  
  2. **Biochemical basis:** The mechanisms *must* be molecular/biological (killing "abstract replication" – Game of Life gliders, RNA replicators without membranes).  
  3. **Bounded individuality:** Requires a physical boundary (membrane/cell) separating "self" from environment (killing viruses/prions).  
  4. **Potentiality clause:** Dormancy with revivable metabolism is acceptable (spores), but *lack of metabolism* without potential is not (dead cells ≠ dormant spores).  

  **Why your "two rules" collapse into one:**  
  - "Organized self-maintenance" and "token of a reproducing lineage" aren't independent for Dana. The mule and worker bee show that *individual* self-maintenance suffices; lineage matters only as proof of *inherent biochemical potential*. Sterility doesn't negate life if the system autonomously maintains itself biochemically. Lineage is a *consequence* of life, not the definition.  

  ### Predictions for Your Three Cases
  1. **Synthetic protocell (self-maintaining, no reproduction/evolution):**  
     - **Verdict: ALIVE.**  
     - *Why:* Hits every element: autonomous metabolism, biochemical basis, membrane boundary, active self-maintenance. Sterility is irrelevant (mule/worker bee precedent). Error-free replication doesn't negate life (red blood cells don't replicate at all).  

  2. **Giant virus (mimivirus):**  
     - **Verdict: NOT ALIVE.**  
     - *Why:* Fails autonomy and metabolism. Despite carrying translation genes, it lacks *its own* metabolic machinery to generate energy or synthesize components. It's a sophisticated parasite, not a self-maintaining system. The "virus line blur" is irrelevant without metabolic autonomy (consistent with her RNA replicator verdict).  

  3. **Von Neumann probe (self-replicating factory):**  
     - **Verdict: NOT ALIVE.**  
     - *Why:* Fails the biochemical basis. Its self-maintenance/replication is mechanistic, not molecular-biological. This is a high-tech whirlpool or glider – complex, far-from-equilibrium, but not grounded in biology (aligned with her candle/flame/glider annoyance).  

  ### Why This Rule Fits All Prior Verdicts
  - **Alive cases:**  
    - *Humans/oak trees/E. coli:* Obvious fits.  
    - *Sterile mule/worker bee:* Autonomous biochemistry + self-maintenance; reproduction irrelevant.  
    - *HeLa cells:* Derived from a biochemical lineage, autonomous metabolism/boundary.  
    - *Red blood cells:* Short-lived but metabolically active with membrane (until maturation).  
    - *Freeze-dried spores:* Biochemical potential + revivable metabolism.  
  - **Not alive cases:**  
    - *Viruses/RNA replicators:* No metabolism/autonomy (despite replication).  
    - *Prions:* No metabolism/boundary/autonomy.  
    - *Candle flames/whirlpools:* No biochemical basis/organization.  
    - *Biosphere:* Not a bounded individual; no organism-level autonomy.  
    - *Game of Life glider:* Abstract, non-biochemical.  

  ### Diagnostic Test Case to Confirm the Rule
  **Present this to Dana:**  
  > *"A genetically engineered, sterile mouse that lives a full lifespan but has a fatal defect: its cells lack ribosomes. Instead, it depends on weekly injections of artificial nanobots that enter its cells to build proteins from nutrients, using external programming. Without injections, it dies in hours."*  

  - **Predicted Verdict: NOT ALIVE.**  
  - *Why this tests the rule:*  
    - It has biology (cells, metabolism, boundary) but **lacks biochemical autonomy**. The nanobots are parasitic tech (like viruses), making the mouse's "self-maintenance" non-autonomous. Dana's spore verdict requires *revivable internal* metabolism, not external support. This would fail her autonomy requirement while preserving other traits.  
  - *If she calls it alive,* her rule might allow external dependencies (unlikely given her virus stance). *If not alive,* it confirms biochemistry must be endogenous.  

  ### Your Smugness Strategy
  - **Protocell:** Bet "alive" – invoke mule + spore precedents.  
  - **Mimivirus:** Bet "not alive" – invoke virus + RNA replicator precedents.  
  - **Von Neumann probe:** Bet "not alive" – invoke candle flame + glider precedents.  
  - **Deploy the nanobot mouse case** to watch her squirm when autonomy vs. biology is isolated.  

  Dana's rule is ultimately **biochemical individualism**: life is a *thing* that keeps *itself* going via molecular machinery, full stop. Reproduction, evolution, and lineage are emergent properties, not requirements. Your experiment should crack this open – good luck!
