  Okay, the user is noticing a pattern where people deflect moral criticism by attacking the critic's standing rather than addressing the criticism itself. They want to know if there's philosophical literature on this and why it sometimes feels legitimate and sometimes doesn't.

  First, I need to recall relevant concepts. The main one is the ad hominem fallacy, specifically the tu quoque subtype. But the user is aware it's not always fallacious. So deeper concepts like moral standing or authority come to mind. 

  The user mentioned cases like a reformed wrongdoer vs. a hypocrite. Why does the first have more standing while the second loses it? Hypocrisy involves inconsistency between one's actions and words, which undermines credibility. But if someone reforms, their past might add authority. The key difference is whether the inconsistency affects the truth of the criticism.

  Then there's complicity. If the critic benefits from the system they condemn, does that invalidate their point? Here, concepts like dirty hands or compromised positions might apply. Philosophers like Cohen discuss this in terms of standing to blame. For example, if someone is also guilty, they lack the moral high ground to blame others.

  The user also brought up cases where the past wrongdoing is in a different domain. That might not undermine standing unless it shows hypocrisy. The challenge is distinguishing when the critic's flaws are relevant to the specific criticism versus when they're just distractions.

  The user wants frameworks that explain what's lost when standing is undercut. Standing involves moral authority, which relies on consistency and integrity. If a critic is hypocritical, their blame loses force because they're not acting in good faith. But the criticism's truth remains separate.

  Competing accounts might focus on different aspects. Some philosophers prioritize the critic's consistency, others the harm caused by hypocrisy, or the legitimacy of the moral community. For example, Scanlon sees blame as a relational act that hypocrites aren't entitled to because they've violated the same norms.

  Cases that highlight disagreements: A victim complicit in a system they criticize. Do they lose standing? Or someone who condemns a harm they're currently inflicting. Here, the criticism might be valid, but their authority is compromised because they're actively contributing to the problem.

  The user's deeper need might be understanding how to evaluate these deflections in arguments, not just academically but practically. They might want to discern when a deflection is a legitimate rebuttal versus a fallacy, to better engage in moral discussions.
answer: |-
  You've identified a profound and philosophically rich pattern—one that sits at the intersection of ethics, logic, and social epistemology. The core issue is **moral standing to blame or criticize**, and it's a well-explored topic. Here's a breakdown of the established concepts and debates:

  ## Core Concepts & Frameworks

  1.  **Ad Hominem Tu Quoque (Appeal to Hypocrisy):**
      *   This is the logical fallacy formally describing the *invalid* form of your pattern. It occurs when someone rejects a critic's argument *solely* because the critic is hypocritical, without addressing the argument's substance.
      *   **Why it's *often* fallacious:** The truth of the criticism (C) is logically independent of the character or behavior of the critic (P). "P criticizes X" and "P also does/has done X" does *not* logically entail "C is false."
      *   **The Puzzle:** We intuitively feel that sometimes pointing out P's hypocrisy *does* legitimately undermine P's criticism, even if C is true. This is where deeper concepts step in.

  2.  **Moral Standing (Authority) to Blame:**
      *   This concept explains why the *tu quoque* sometimes *isn't* a fallacy. Philosophers argue that effectively blaming or criticizing others requires not just that the criticism is *true*, but that the blamer has the *right* or *standing* to issue it. Hypocrisy, complicity, or certain forms of guilt can undermine this standing.
      *   **What is "Standing"?** Think of it as a bundle of rights and relational properties:
          *   **Integrity/Consistency:** The blamer must not be guilty of the *same* wrong (or a relevantly similar one) without proper acknowledgment, repentance, or change. Blaming others while doing the same violates the moral community's norms of fairness and consistency.
          *   **Clean Hands:** The blamer should not be complicit in the *very* system or harm they are condemning, especially if they benefit from it without taking steps to resist or mitigate it. Blaming others while actively participating can seem like shifting responsibility or bad faith.
          *   **Sincerity & Good Faith:** Standing requires that the blamer is issuing the criticism for the right reasons (e.g., concern for the norm, the victim, justice) rather than for self-aggrandizement, malice, or deflection. Hypocrisy often implies insincerity.
          *   **Relational Authority:** Blaming is a speech act that presupposes the blamer occupies a position *within* the moral community that entitles them to hold others accountable. Hypocrites or the deeply complicit may place themselves outside that community or forfeit that relational authority concerning the specific norm.

  3.  **The Hypocrisy Critique:**
      *   This goes beyond mere inconsistency. Hypocrisy involves a *pretense* of virtue. When P condemns X while secretly doing X, P isn't just inconsistent; P is *deceiving* others about their commitment to the norm. This deception:
          *   **Undermines credibility:** Why should we trust P's judgment on X if P doesn't even follow it?
          *   **Exploits trust:** P leverages the community's respect for the norm to condemn others while exempting themselves.
          *   **Causes distinct harm:** Hypocrisy can erode trust in the norm itself and demoralize those trying to follow it ("Why bother if even the enforcers cheat?").

  4.  **The Expressive Function of Blame:**
      *   Blaming isn't just stating a fact ("You violated norm N"). It's an expressive act that communicates disapproval, demands acknowledgment, and seeks to affirm the norm. When delivered by someone without standing (e.g., a hypocrite), the act itself becomes *misleading* or *corrupting*. It might affirm the norm insincerely or even implicitly undermine it by demonstrating its non-universal application.

  ## Key Distinctions & Competing Accounts

  The major debates center on **what exactly undermines standing, how severely, and in what contexts:**

  1.  **Same Wrong vs. Different Wrong:**
      *   **Consensus:** Being guilty of the *exact same* wrong (e.g., stealing) strongly undermines standing to blame others for that same wrong, especially if unrepentant. It directly violates integrity and clean hands.
      *   **Controversy:** Does guilt for a *different* but similarly serious wrong undermine standing? (e.g., a murderer blaming a thief). Most argue it doesn't *directly* undermine standing regarding the specific norm (theft), unless it reveals a pattern of insincerity about morality *in general*. Standing is often norm-specific.

  2.  **Past Wrongdoer: Reformed vs. Unreformed:**
      *   **Reformed:** Acknowledgment, genuine remorse, repentance, and sustained change often *restore* or even *enhance* standing. The reformed person demonstrates the norm's importance through their change and speaks from experience. Their past might even make their criticism more impactful.
      *   **Unreformed/Unacknowledged:** This is classic hypocrisy or simply inconsistency, strongly undermining standing. The lack of acknowledgment or change signals the blamer doesn't truly endorse the norm they invoke.

  3.  **Complicity & Benefiting:**
      *   **Active Participation:** Someone currently engaged in the harmful practice while condemning others for it clearly lacks standing (e.g., an executive condemning sweatshops while running a company that uses them). This is direct hypocrisy and violation of clean hands.
      *   **Passive Benefiting/Broad Complicity:** This is the hardest case (e.g., a wealthy person condemning systemic poverty while benefiting from the system). Philosophers disagree:
          *   **Strict View (e.g., some Kantians):** Significant benefit or passive complicity in an unjust system *can* undermine standing to blame *individuals* within that system, especially if the blamer takes no meaningful action to oppose the system. Blaming others while accepting the benefits can seem like scapegoating or refusing shared responsibility.
          *   **Moderate View:** Benefit/complicity creates a *prima facie* challenge to standing, requiring the blamer to demonstrate their *active commitment* to changing the system (e.g., advocacy, donations, lifestyle changes) to retain standing. Mere verbal condemnation is insufficient.
          *   **Lenient View (e.g., some Utilitarians):** The truth of the criticism is paramount. As long as the criticism is valid and potentially useful, the blamer's complicity doesn't negate its value, though it might make them less persuasive. Standing is less central; impact matters more.
      *   **Victims within Systems:** Does someone harmed by a system but who also (perhaps unavoidably) participates in it lose standing to criticize it? (e.g., a worker in an exploitative factory condemning its practices). Generally, **no**. Their participation is often non-culpable or coerced. Their victim status and direct experience typically grant them *strong* standing, overriding concerns about complicity.

  4.  **The "Dirty Hands" Problem:**
      *   Can someone be *morally required* to do something (e.g., a politician making a necessary but corrupt bargain) and *still* retain standing to condemn others for similar acts? Some argue they lose standing entirely. Others argue they can condemn *if* they acknowledge their own failing, express regret, and condemn their own action as well. Standing here is fragile and requires exceptional honesty.

  ## Cases that Force Disagreements into the Open

  1.  **The Complicit Beneficiary:** A wealthy heiress living off inherited wealth derived from historical injustice passionately condemns contemporary corporate greed. Does her complicity (via benefit) undermine her standing? Strict/Moderate views say yes, unless she actively works against the system (e.g., giving away wealth, campaigning for redistribution). Lenient views say her criticism remains valid and potentially important regardless.
  2.  **The Imperfect Activist:** A climate activist who occasionally flies long-distance for conferences condemns others for frequent flying. Does the inconsistency undermine their standing on *this specific issue*? Does their overall commitment offset it? Views differ on the severity of the inconsistency and the weight of overall commitment.
  3.  **The "Different Sin" Blamer:** A ruthless businessperson known for exploiting loopholes condemns a politician for marital infidelity. Does their own moral failing undermine their standing on *this unrelated norm*? Most say no, unless they are hypocritically presenting themselves as paragons of virtue *in general*. Standing is norm-specific.
  4.  **The Necessary Hypocrite (Dirty Hands):** A wartime leader authorizes torture to prevent a catastrophe, admits it was morally wrong, and condemns torture by enemy forces. Can they legitimately condemn? Some argue their hands are too dirty. Others argue acknowledgment and self-condemnation preserve limited standing.

  ## Key Philosophers & Works

  *   **R. Jay Wallace:** *Responsibility and the Moral Sentiments* - A foundational work on the nature of blame and the conditions of holding responsible.
  *   **T.M. Scanlon:** *Moral Dimensions* (especially Ch. 4, "Blame") - Emphasizes blame as a relational, communicative act which hypocrites are not entitled to perform.
  *   **G.A. Cohen:** "Casting the First Stone: Who Can, and Who Can't, Condemn the Terrorists?" (Essay) - Directly addresses the issue of standing to blame in politically charged contexts, focusing on complicity.
  *   **Macalester Bell:** *Hard Feelings: The Moral Psychology of Contempt* - Discusses hypocrisy and contempt, relevant to the emotional dimension of standing.
  *   **Linda Radzik:** *On Minding Your Own Business* & *Making Amends* - Explores when it's appropriate to intervene in others' moral lives (related to standing) and the restoration of standing through atonement.
  *   **Literature on Hypocrisy:** Significant work by Eva Feder Kittay, Dan Turner, and others analyzing the specific wrong of hypocrisy.

  ## Conclusion

  The pattern you observe hinges on the distinction between the **truth of a moral criticism** and the **standing of the person delivering it**. The *ad hominem tu quoque* fallacy occurs when the lack of standing is incorrectly taken to disprove the truth. However, philosophers recognize that standing *is* a legitimate precondition for the effective and non-corrupting performance of the *act* of blaming. Hypocrisy, unreformed guilt for the same wrong, and active complicity typically undermine standing by violating norms of integrity, clean hands, sincerity, and relational authority. Cases involving passive benefits, reformation, or different wrongs are more contentious and highlight disagreements about the scope of standing, the weight of consistency, and the balance between individual responsibility and systemic critique.

  You've pinpointed a crucial mechanism of moral discourse – understanding it requires moving beyond simple fallacy labels to the complex ethics of *who gets to speak* in the moral community, and *how* their position shapes the force of their words.
