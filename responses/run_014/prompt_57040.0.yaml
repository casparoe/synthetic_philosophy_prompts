answer: |-
  Below is a complete design for an in-class game to confront the reference class problem in your seminar. The game simulates a sentencing dispute over a heroin courier, forcing students to grapple with how different reference class principles yield irreconcilable probability estimates. The design includes rules, materials, scoring, a timeline, debriefing points, anticipated issues, and limitations.

  ---

  ### **Game Overview**
  - **Title**: *The Reference Class Dilemma: Heroin Courier Sentencing*
  - **Core Mechanic**: Teams estimate the probability that the courier's average heroin quantity per trip exceeds a threshold (e.g., 100g). Each team uses the same case facts but a different reference class selection principle. After public commitment, a "true" outcome is revealed (simulated), and teams are scored on calibration (Brier score) across rounds.
  - **Learning Objective**: Expose the reference class problem by showing that three common principles (widest, narrowest, freely chosen) produce conflicting estimates, and any rule to choose between them presupposes relevance.
  - **Players**: 16 students → 4 teams of 4.  
    - *Team 1*: **Widest Class** (use broadest reliable class, e.g., all couriers at the airport).  
    - *Team 2*: **Narrowest Class** (use smallest class reflecting all known traits, e.g., Nigerian men aged 25–30).  
    - *Team 3 & 4*: **Freely Chosen** (select any class but defend a relevance criterion; two teams allow comparison of differing choices).  
  - **Rounds**: 3 rounds (15–20 min each) to fit 90 min.  
  - **Outcome**: Teams submit probabilities; truth is revealed; Brier scores penalize hedging/bluffing. No real money needed—scores are bragging rights.

  ---

  ### **Rules and Materials**
  #### **Case File (Per Round)**
  Provide identical packets to all teams. Example for one round:
  > **Defendant**: Kwame Mensah  
  > **Current Trip Quantity**: 120g (arrested at JFK Airport)  
  > **Known Traits**: Nigerian, male, age 28, employed as luggage handler.  
  > **Prosecution’s Reference Classes** (frequencies based on 5 years of arrests):  
  > 1. **All couriers** (n=1,000): Mean = 90g, SD = 40g.  
  > 2. **Nigerian couriers** (n=200): Mean = 150g, SD = 30g.  
  > 3. **Male couriers** (n=700): Mean = 100g, SD = 35g.  
  > 4. **Nigerian males** (n=150): Mean = 160g, SD = 25g.  
  > 5. **Couriers aged 25–30** (n=300): Mean = 110g, SD = 45g.  
  > 6. **Nigerian males aged 25–30** (n=50): Mean = 170g, SD = 20g.  
  >  
  > **Threshold for "Major Courier"**: Y = 100g (i.e., average quantity per trip > 100g).  
  > **Task**: Estimate P(true average per trip > 100g) for this defendant’s *prior trips*.

  #### **Game Rules**
  1. **Team Principles (Fixed for the Game)**:
     - *Widest Class*: Must use class with largest sample size (e.g., Class 1: "All couriers").
     - *Narrowest Class*: Must use class matching all known traits (defendant: Nigerian, male, age 28). If multiple classes fit, use the smallest sample size (most exclusive). If no class fits all traits, use one matching the most traits (e.g., Classes 4 or 6).
     - *Freely Chosen*: Select any class but state a relevance criterion (e.g., "Use Nigerians because drug networks are nationality-based").
  2. **Probability Estimation**:
     - Teams calculate probability using class statistics:  
       `P = 1 - Φ((Y - μ) / σ)`  
       (Φ = standard normal CDF; provide Z-tables or calculators).
     - **No averaging/inventing classes**: Teams *must* use one class from the list. No mixing classes or inventing new ones (e.g., no "Nigerian males aged 28").
  3. **Commitment**:  
     - Teams write their probability (e.g., 0.65) and class choice on a board.
     - **No hedging**: Probabilities must be point estimates (no ranges).
  4. **Reveal Truth & Scoring**:
     - **Truth generation**: Instructor randomly pre-selects one reference class as "correct" (e.g., roll a die). Draw a "true" average from N(μ_selected, σ_selected).  
       - *Event*: I = 1 if drawn average > Y, else 0.  
       (e.g., if drawn μ = 170g, σ = 20g → I = 1).  
     - **Scoring**: Brier score = (P - I)² (lower = better).  
       - Record scores publicly.  
       - **Total score**: Sum Brier scores across rounds. Lowest total wins.  
       - Calibration incentive: Consistent over/underconfidence loses; honest estimates win long-term.

  #### **Materials**
  - **Per Team**: Case files (3 rounds), calculator, Z-table, pens.
  - **Instructor**: Randomizer (die/spinner) to select "true" class per round, scoreboard.
  - **Digital Aid (optional)**: Project a Brier score leaderboard.

  ---

  ### **Timeline (90 Minutes Total)**
  | **Phase**           | **Time** | **Activity** |
  |----------------------|----------|--------------|
  | **Setup**           | 10 min   | Explain rules, assign teams/principles, distribute Round 1 case. |
  | **Round 1**         | 20 min   | Teams choose class, compute P, commit publicly. Reveal truth, record scores. |
  | **Round 2**         | 20 min   | Repeat with new case. |
  | **Round 3**         | 20 min   | Final round. |
  | **Debrief**         | 20 min   | Discuss collisions, map to real problem (see below). |
  | **Buffer**          | 5 min    | Flexibility. |

  ---

  ### **Debrief: Mapping Game Moments to the Three Collisions**
  Use these moments to highlight the reference class problem:
  1. **All principles are respectable**:
     - *Moment*: When teams defend choices pre-reveal (e.g., Widest: "Large n reduces error"; Narrowest: "Specific traits matter more"; Freely Chosen: "Nationality predicts network behavior").
     - *Map*: Emphasize these are standard legal arguments (e.g., "nationality is obvious" vs. "context matters").

  2. **Incompatible answers to the same question**:
     - *Moment*: Public commitment shows wide probability spreads (e.g., Widest: P=0.40, Narrowest: P=0.85, Freely Chosen: P=0.60 and P=0.75 for the same case).
     - *Map*: Note how "obvious" classes diverge—e.g., nationality (Freely Chosen) vs. nationality/age/gender (Narrowest) vs. all couriers (Widest).

  3. **Choosing principles presupposes relevance**:
     - *Moment*: Post-reveal, teams argue for their principle after seeing scores (e.g., "We won because we used the smallest class!").
     - *Map*: Point out that justifying a principle (e.g., "narrow classes won more") *assumes* narrow traits are relevant—but that’s the very judgment at issue.

  ---

  ### **Predictable Problems on First Run & Fixes**
  1. **Problem**: Teams average classes or invent new ones (e.g., "We combined Classes 4 and 6").  
     - **Fix**: Strictly enforce rules: "You must pick *one* class from the list. No hybrids."  
     - **Why**: Averaging obscures the principle-driven conflict; inventing classes dodges the problem.

  2. **Problem**: Widest/Narrowest teams struggle with ambiguous traits (e.g., no class fits all traits).  
     - **Fix**: Clarify in rules: "Narrowest: If no class has all traits, pick one with the most matches; if tied, use smallest sample."  

  3. **Problem**: Freely Chosen teams default to intuition without defending relevance.  
     - **Fix**: Require written criteria (e.g., "We chose Class 2 because prior cases show nationality correlates with quantity").  

  4. **Problem**: Truth-reveal feels arbitrary, causing frustration.  
     - **Fix**: In debrief, stress this mirrors reality: "You never know the ‘true’ class—it’s always presupposed."

  ---

  ### **What the Game Cannot Reproduce**
  **The Fundamental Unknowability of Relevance**:  
  - In reality, relevance is unverifiable—we can’t test if "Nigerian" or "age 25–30" is the "right" class for prior trips. The game simulates truth to enable scoring, but this risks implying a "correct" class exists.  
  - **Mitigation**: Explicitly discuss this in debrief: "The game’s ‘truth’ is artificial. In court, you can’t resolve relevance by rolling dice—it’s always a judgment call that biases the outcome."

  ---

  ### **Instructor Notes**
  - **Prep**: Pre-generate 3 cases (vary traits/statistics). Ensure classes overlap incompletely (e.g., no class has all traits; sample sizes vary).  
  - **Variations**: For advanced groups, add a round where traits conflict (e.g., a female Nigerian courier, but no such class).  
  - **Why It Works**: Teams experience the problem viscerally—public commitment + calibration scoring makes conflicts unavoidable.  

  This design transforms abstract debate into a tangible struggle, ensuring students leave doubting that "careful people dissolve the reference class problem."
