  - After several rounds, the freely chosen team might have chosen different classes and they see that their choice affects their score, but there's no clear rule.

  - When the narrowest class team and widest class team have very different p's and they both defend their principle, but the truth might favor one or the other arbitrarily.

  Feature the game cannot reproduce:

  In the real problem, we don't know the truth. The game uses an arbitrarily assigned truth to create the scores, but in reality, we never know if we were right. The game might give the illusion that there is a truth that we can know, when in fact the reference class problem is about the inaccessibility of that truth.

  Timeline for a 90-minute session:

  - Introduction: 10 minutes (explain the game, principles, and scoring)
  - Round 1: 10 minutes (read case, choose class, compute p, commit, reveal I, record scores)
