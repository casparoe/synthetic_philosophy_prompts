prompt: |-
  So our CTO keeps saying we're "falling prey to the sunk cost fallacy" whenever we keep going on anything that's taken more than a few months, and honestly it's become a conversation stopper. Like we have this in-house ORM replacement we're 8 months into, it's maybe 60% done, morale around it is bad, and every planning meeting someone (sometimes me tbh) says "sunk costs, kill it" like that settles the thing. But I've been reading a bit and it seems like the textbook version -- "rational agents ignore sunk costs, period" -- is maybe too clean? Like, the money already spent doesn't *logically* compel finishing, but it can still be *evidence*: nobody spends 8 months on something without learning things about the codebase that a fresh decision made today would incorporate. The fact that we were willing to invest that much might mean the people closest to it know something. Also there's the team-reputation / commitments-to-other-teams angle, which feels like it shouldn't count but our platform team genuinely plans their quarter around us delivering this thing, and killing it has real costs that aren't "sunk" at all, they're future ones.

  So here's what I want. I'm going to run a retro on the ORM project and I want to propose an actual decision procedure, not vibes. Turn whatever the real philosophy of this says into a checklist or ordered set of questions that a bunch of engineers (zero philosophy background, one of them will 100% make a joke about "sunk cost fallacy fallacy") could actually run in a 45-minute meeting. Requirements:

  1. It has to make the distinction between "sunk costs are biasing us" and "sunk costs gave us information that a cold restart would throw away" operational -- like, actual questions you ask and what answers point which way.

  2. It has to catch the sneaky inverse bias too, where people invoke the fallacy as a rhetorical move to kill projects they never liked, and where "we already paid for it" is doing legitimate work as a coordination device (with other teams, or with our own past selves who made commitments).

  3. Where the procedure can't decide -- because it's actually a values question about what we owe each other or how much risk the team should carry -- it should say so and punt to a human, not pretend the checklist settled it.

  Then run it on two cases so I can see it work: (a) the ORM, which as I said is 60% done, despised, but already integrated into two of our services, and (b) a hypothetical second one -- we're being asked to decide whether to keep paying for a multi-year cloud contract that's underused but where the alternative is a migration effort nobody has scoped. One of these should come out with an answer I won't like, and I want the procedure to commit anyway, so I can see it's not just a machine for ratifying whatever I already believe.

  Also please be honest about where the procedure will misfire -- the failure modes of using a checklist for this at all. And keep the philosophy light-touch in the writeup, like a paragraph of "here's the actual principle" is fine, but the deliverable is the thing we run in the meeting. Casual tone if you can, the doc's going in our internal wiki next to stuff called "why our deploy pipeline is haunted."
reasoning: |-
  We are designing a decision procedure for evaluating whether to continue or kill a project, particularly when the sunk cost fallacy is being invoked. The procedure should:
  1. Distinguish between sunk costs as bias vs. sunk costs as information.
  2. Catch the inverse bias (using sunk cost fallacy as a rhetorical tool to kill projects).
  3. Explicitly punt to human judgment when it's about values or risk.

  We'll structure it as a checklist with ordered questions. The meeting should take about 45 minutes, so we need to be concise.

  **Core Principles (for the writeup):**
  The sunk cost fallacy is when we let past investments (time, money, effort) that we can't recover influence our decision about the future. But past investments can also provide valuable information (e.g., we've learned the problem is harder than we thought, or we've built something that has dependencies). Also, stopping a project might have ripple effects (e.g., breaking commitments to other teams). So we need to separate the sunk costs from the information and the future costs/benefits.

  **The Checklist: "Project Continuation Decision Framework"**

  **Step 0: Set the Stage (5 minutes)**
  - Recap the project: what it is, why started, current state (e.g., ORM replacement: 60% done, integrated into two services).
  - State the goal: Decide whether to continue, pivot, or kill the project, avoiding both the sunk cost fallacy and its inverse.
  - Assign roles: Facilitator (runs the meeting), Timekeeper (keeps to 45 min), Note-taker.

  **Step 1: Separate the Sunk Costs (5 minutes)**
  - **Question 1:** What have we already spent? (List: time, money, opportunity costs, morale hit. Be explicit but don't dwell.)
  - **Question 2:** Can we recover any of these costs? (e.g., can we sell the code? reuse components? Usually, the answer is no. If yes, note it for the future cost-benefit.)
  - **Outcome:** Acknowledge these costs are sunk and should not factor into the decision. Write them on a board and then cross them out (literally or metaphorically). This step is cathartic.

  **Step 2: Extract Learnings from the Investment (10 minutes)**
  - **Question 3:** What have we learned from the work so far? (e.g., technical challenges, market changes, team capabilities, true scope, hidden dependencies, etc.)
  - **Question 4:** How does this new information change our original assumptions? (e.g., we thought it would take 4 months, now we know it takes 12. We thought we'd save 20% in latency, now we know it's 5%.)
  - **Outcome:** List the learnings. These are not sunk costs; they are new data for the next steps.

  **Step 3: Assess Current and Future Costs/Benefits (10 minutes)**
  - **Question 5:** What will it take to complete the project? (Time, money, opportunity costs, morale impact, etc. Use the learnings from Step 2 to estimate this realistically.)
  - **Question 6:** What are the expected future benefits? (e.g., performance gains, cost savings, developer happiness, strategic positioning. Re-evaluate with current info.)
  - **Question 7:** What are the costs of stopping? (e.g., breaking commitments to other teams, loss of trust, migration costs to remove the partial solution, reputational damage, etc.)
  - **Outcome:** A table of future costs vs. future benefits (including costs of stopping). This is the core of the decision.

  **Step 4: Check for Biases (5 minutes)**
  - **Question 8 (Sunk Cost Bias Check):** Are we leaning towards continuing just because we've already invested? (If the future costs outweigh the benefits, but we still want to continue, flag this bias.)
  - **Question 9 (Inverse Bias Check):** Are we leaning towards stopping because we can invoke "sunk cost fallacy" as a trump card, even though the future benefits clearly outweigh the costs? (Look for: personal dislike of the project, new shiny alternative, ignoring the costs of stopping.)
  - **Outcome:** Explicitly note if either bias is present. The goal is to neutralize both.

  **Step 5: Make the Decision (5 minutes)**
  - **Question 10:** Based solely on future costs and benefits (Step 3), and accounting for biases (Step 4), what should we do?
     - Option A: Continue as is.
     - Option B: Pivot (how?).
     - Option C: Kill.
  - **Question 11:** Are we stuck because of a values conflict? (e.g., "We owe it to the platform team to deliver" vs. "We should cut our losses and take the hit to trust because the tech is bad.") If yes, flag that the checklist can't resolve this and escalate to leadership/CTO with the analysis.

  **Step 6: Document and Commit (5 minutes)**
  - Record the decision and reasoning.
  - If continuing, set a checkpoint (e.g., in 1 month) to re-evaluate if things change.
  - If killing, plan the wind-down (communicate to stakeholders, remove integrations, etc.).

  **Running the Two Cases:**

  **Case A: The ORM Project (60% done, integrated into two services, morale bad)**
  - Step 0: ORM replacement, started to improve performance and maintainability. Current state: 60% done, integrated in two services, team hates it.
  - Step 1: Sunk costs: 8 months of 5 engineers, morale hit. Cross them out.
  - Step 2: Learnings: We learned the problem is harder than we thought; we've integrated it into two services so now there's a migration cost to remove; the performance gains are less than expected; the team finds it painful to work with.
  - Step 3: 
     - Future costs: 5-6 more months (based on new understanding), continued morale hit, opportunity cost.
     - Future benefits: Improved performance (say 10% now, down from 20% expected), maintainability? (maybe not, because the team hates it).
     - Costs of stopping: Platform team planned their quarter around it (coordination cost), we have to remove the ORM from two services (which takes work), reputational hit to the team.
  - Step 4: 
     - Sunk cost bias? Maybe, because we've spent so much we feel we must finish. But the future costs might be high and benefits low.
     - Inverse bias? The team hates it, so they might be using "sunk cost" as an excuse to kill it, ignoring the costs of stopping (platform team impact).
  - Step 5: 
     - Future costs: high (time, morale). Benefits: moderate (10% perf). Costs of stopping: high (reputational, platform team disruption, migration effort). 
     - This is close. The costs of stopping might outweigh the benefits of continuing? But also, the benefits of continuing might be low. 
     - Values conflict: We made a commitment to the platform team. How much do we value that? 
     - Punt: This is a values question about commitment vs. cutting losses. Escalate to CTO/leadership with the analysis.

  **Case B: Multi-year Cloud Contract (underused, alternative is unscoped migration)**
  - Step 0: We have a cloud contract that's underused. We're paying a lot. Considering migrating to save costs, but migration effort is unknown.
  - Step 1: Sunk costs: past payments, any setup time. Cross them out.
  - Step 2: Learnings: We've learned that our usage is lower than expected, the contract is inflexible, but we also know the system and its quirks.
  - Step 3:
     - Future costs of keeping: contract cost for the remaining term (say $X per year for 2 more years).
     - Future benefits of keeping: no migration, stability.
     - Future costs of stopping: migration effort (which we haven't scoped, so we must estimate: it could be high and risky), downtime risk.
     - Future benefits of stopping: cost savings (the contract cost minus any new costs).
  - Step 4:
     - Sunk cost bias? We might keep paying because we've already paid for so long? But we've crossed that out.
     - Inverse bias? We might want to kill the contract because it's underperforming and we can say "sunk cost" to ignore the risks of migration.
  - Step 5:
     - Without a migration scope, we can't compare. So we must scope the migration (at least roughly). If we can't do that in the meeting, then:
     - We don't have enough info. The decision isn't about sunk costs but about uncertainty. We should spend a fixed time (e.g., 1 week) scoping the migration and then re-run the checklist.
     - Alternatively, if we must decide now: The future costs of keeping are known (contract cost) and the costs of stopping are unknown but potentially high. Without a migration scope, the risk is too high. We continue the contract until we scope the migration.

  **Failure Modes of the Checklist:**
  - **Oversimplification:** Complex projects might not fit neatly into costs/benefits.
  - **Garbage In, Garbage Out:** If estimates in Step 3 are biased or wrong, the decision will be too.
  - **Time Pressure:** Rushing through steps might miss nuances.
  - **Groupthink:** The team might converge too quickly. The facilitator must ensure all voices are heard.
  - **Escalation Avoidance:** Teams might avoid escalating values questions and force a false decision.
  - **Checklist Fatigue:** If overused, the team might go through the motions without engagement.

  **Final Deliverable (Internal Wiki Format):**

  ---

  # Project Continuation Decision Framework

  **When to use:** When a project is under review and someone has yelled "sunk cost fallacy" or you're stuck in a loop about whether to kill it.

  **Why:** Because "sunk costs" are real money we cried over, but they shouldn't dictate the future. However, what we learned from that pain is valuable, and killing a project has real future costs too. This checklist helps separate the past from the future and catches when we're using "sunk cost" as a cheap trick to kill something we hate.

  **Time required:** 45 minutes. Seriously, set a timer.

  ## Steps

  ### 0. Set the Stage (5 min)
  - What’s the project? Why did we start? Current status?
  - Goal: Decide whether to continue, pivot, or kill.
  - Roles: Facilitator (runs the meeting), Timekeeper (watch that clock), Note-taker (documents everything).

  ### 1. Separate the Sunk Costs (5 min)
  - Q1: What have we already spent? (List: time, cash, tears.)
  - Q2: Can we get any of it back? (If yes, note it for later. Usually no.)
  - **DO:** Write the sunk costs on the board and then cross them out. They’re gone. Mourn and move on.

  ### 2. Extract Learnings (10 min)
  - Q3: What did we learn? (e.g., "This is harder than we thought," "We now have dependencies on the partial solution," "The market changed.")
  - Q4: How does this change our original plan? (Update your expectations.)

  ### 3. Future Costs vs. Benefits (10 min)
  - Q5: What will it cost to finish? (Time, money, morale, opportunity cost. Be real.)
  - Q6: What are the benefits of finishing? (Performance, savings, joy, strategic wins.)
  - Q7: What are the costs of *stopping*? (e.g., breaking promises to other teams, migration hell, reputational damage.)

  ### 4. Bias Check (5 min)
  - Q8 (Sunk Cost Bias): Are we only continuing because we spent so much? (If future costs > benefits and we still want to continue, we’re biased.)
  - Q9 (Inverse Bias): Are we only stopping because we can say "sunk cost fallacy" and sound smart? (If benefits > costs and we still want to kill it, we’re biased.)

  ### 5. Make the Call (5 min)
  - Q10: Based on the future (Step 3) and biases (Step 4), choose:
     - A: Continue
     - B: Pivot (how?)
     - C: Kill
  - Q11: Stuck? If the debate is about what we owe other teams or how much risk we take, that’s a values question. **Punt it to leadership.** Don’t force a false decision.

  ### 6. Commit (5 min)
  - Document: Decision, why, and next steps.
  - If continuing: Set a checkpoint (e.g., 1 month) to re-evaluate.
  - If killing: Plan the funeral (notify stakeholders, clean up, etc.).

  ## Example Runs
  See the attached [ORM example] and [Cloud contract example] in the wiki comments.

  ## Failure Modes
  - **Oversimplification:** Life’s messy. The checklist helps, but it’s not magic.
  - **Bad Estimates:** If Step 3 numbers are made up, the decision will be too.
  - **Rushing:** Don’t skip steps. Timekeeper, enforce!
  - **Groupthink:** Facilitator, make sure the quiet person speaks.
  - **Escalation Fear:** If it’s a values call, escalate. Don’t hide.
  - **Overuse:** If we run this on every PR, we’re doing it wrong.

