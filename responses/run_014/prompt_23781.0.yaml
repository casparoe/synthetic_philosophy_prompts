prompt: |-
  Ok so I got into a whole thing with my friend last night about whether "disease" is just a medical/statistical fact about the body or whether its shot through with values from top to bottom -- she kept bringing up drapetomania and I kept bringing up Boorse's reference-class stuff and neither of us budged. I teach an intro philosophy of medicine seminar, 14 students, one 75-minute session, and I want to turn this into an in-class activity instead of just lecturing at them about naturalism vs normativism. Split the room into two "nosology committees," each of which has to rule on the same stack of borderline cases (mix real historical ones with invented contemporary ones) under seperate rulebooks -- one committee can only invoke naturalist criteria (statistical typicality, biological function, no appeal to harm), the other only normativist criteria (harm, social value, no appeal to statistics or function) -- without ever being told the words "naturalist" or "normativist," then bring the two committees together and force them to agree on one verdict for a case neither has seen. I want each side to hit a wall on its own steam: the naturalist committee should get stuck on a case where "statistically normal" gives an answer everyone finds obviously wrong, and the normativist committee should get stuck on a case that looks uncomfortably like it'd bless something we now recognize as an abuse. Give me this as exactly five numbered points, each a sentence or two, no intro or conclusion -- covering the setup and materials, the two rulebooks plus case files, the moment each side hits its wall, the merged debrief that names Boorse and Wakefield and maps the wreckage onto their positions, and what will predictably go wrong or what the exercise just can't honestly capture.
reasoning: |-
  Okay, the user is a philosophy of medicine professor who had a debate with a friend about whether disease is purely medical/statistical or value-laden. They want to turn this into an interactive class activity for their intro seminar. 

  Hmm, they're clearly frustrated with theoretical lecturing and want students to experience the conceptual tensions firsthand. The drapetomania vs Boorse reference-class debate suggests they want students to confront how values sneak into medical categorization. Smart move - abstract arguments never stick as well as lived dilemmas.

  The proposed activity is sophisticated but needs refining. They want exactly five implementation points without jargon, which means stripping down complex ideas to their experiential core. Key challenges: designing cases that reliably trigger the "wall moments" for each committee, and ensuring the merger debate doesn't just collapse into prior biases.

  For the naturalist committee's wall: Need a case where statistical normality conflicts with wellbeing. Maybe historically contested homosexuality or modern low-testosterone in aging men? But must avoid triggering contemporary identity politics. Perhaps invented case like "cranial ridge asymmetry" - statistically normal in isolated population but causes migraines.

  For normativist committee's wall: Must echo historical abuses without being inflammatory. Drapetomania is perfect but overused. Alternative: fictitious "urban apathy disorder" pathologizing political dissent. Need to prevent students from dismissing it as unrealistic though.

  The merger debate design is crucial. If the new case is too easy, they'll compromise without tension. Should be something like chronic fatigue syndrome where both approaches struggle - biological markers disputed but clear harm present. 

  Predictable failure points: Students might cheat on rulebooks, or dominant personalities hijack committees. Also possible one side "wins" by accident - need cases carefully balanced. The exercise can't capture how real committees blend frameworks unconsciously, but that's actually a teaching opportunity about implicit values.

  Materials prep is key. Rulebooks must be watertight - naturalist one banning "harm" entirely, normativist forbidding "normal/function". Case files need historical authenticity. Maybe include a fabricated psychiatric manual excerpt for the abuse-parallel case.

  Final point about limitations is wise. Should flag how this simplifies Wakefield's harm-requirement vs Boorse's functionalism, and that real-world diagnoses involve institutional power dynamics beyond pure philosophy.
answer: |-
  Here are the five numbered points:

  1.  **Setup & Materials:** Prepare two distinct "Nosology Committee Rulebooks" (Naturalist: only statistical abnormality, biological dysfunction, no harm/suffering terms; Normativist: only distress/disability/harm, social value, no stats/function terms) and a shared stack of anonymized case files (mix real/historical like drapetomania, homosexuality in DSM-II, invented like "Chronic Apathy Syndrome" in a hyper-productive society, "Ultra-Rapid Bone Healing" causing chronic pain).
  2.  **Committee Work:** Split class into two committees; each receives one rulebook and the *same* case files. Each committee must independently rule "Disease" or "Not Disease" for each case *solely* using their assigned rulebook's criteria, recording justifications.
  3.  **Hitting the Wall:** The Naturalist committee will hit a wall on a case where statistically normal/functional traits cause clear harm (e.g., invented "Universal Age-Related Sensory Decline" – normal aging causing severe isolation). The Normativist committee will hit a wall on a thinly veiled abuse-parallel case (e.g., historical drapetomania or invented "Productivity Resistance Disorder" pathologizing work refusal).
  4.  **Merged Debate & Naming:** Merge committees, present a *new* borderline case (e.g., mild chronic fatigue with no biomarker but clear life impact). Force them to agree on one verdict using *any* criteria. Debrief by revealing the rulebooks as Naturalist (Boorse: dysfunction/reference class) vs. Normativist (Wakefield: harm + dysfunction?; pure harm/social value), mapping their struggles and the merged case stalemate onto these frameworks.
  5.  **Predictable Failure/Limitation:** The merged debate will likely devolve into unacknowledged criterion-switching or unresolved conflict, exposing how real-world classification *requires* blending elements the exercise artificially separated; the activity cannot capture the institutional power dynamics and evolving social contexts shaping actual disease categories over time.
