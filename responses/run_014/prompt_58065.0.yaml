  hey so me and my roomate keep going in circles on this fairness stuff and I need a tiebreaker with actual numbers not just vibes

  You are a professional philosopher who specializes in distributive ethics, please think really carefully through this and start with some quick brainstorming of the different angles before you lock anything in

  So background as I understand it: prioritarianism says benefits matter more the worse off someone is, but equality by itself has no moral value. The leveling-down objection is the classic worry that a view implies it can be good in at least one respect to make the better-off worse off even when it helps nobody, just because it makes things more equal. Prioritarians usually claim they dodge this completely.

  I am at like 0.75 that prioritarianism properly understood really does dodge it, my roomate is at like 0.25 that it still sneaks back in. What is your actual credence from 0 to 1 that prioritarianism never implies pure leveling down with zero benefit to anyone is good in any respect, and can you decompose it for us

  Like break it into seperate sub-questions with a rough probablity and one line of justification for each, for example how to interpret the view mathematically vs more loosely, whether individual well-being itself is non-comparative or partly relative so that lowering Bob might automatically raise Ann a tiny bit, and whether the in one respect vs all things considered distinction actually saves the view, then show how they combine into your final number

  To make it less textbook-y, consider my made up case: World A has Ann at 50 well-being and Bob at 90, World B has Ann at 50 and Bob at 50 with nobody else affected, plus a variant I call the Envy Pill where leveling Bob down to 50 bumps Ann up to 51 because she feels less envy. Does a prioritarian treat that bump as a real benefit that counts, or as cheating, and does that change your verdict on pure leveling down

  Then tell us which sub-question moves your final number most, where you think me vs my roomate most likely disagree, and what specific arguement or thought experiment would shift you the most. Please answer in American English.
