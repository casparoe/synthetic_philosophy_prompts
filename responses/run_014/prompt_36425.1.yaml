prompt: |-
  I was diagnosed three weeks ago with a cancer that, depending on which study I read, carries a five-year survival rate somewhere between 40% and 85%. The spread is not scientific chaos: it is the reference class problem in its purest form. Whether I am counted among all patients with this diagnosis, or only those under fifty, or only those whose tumors carry my particular mutation, or only those treated since immunotherapy became standard practice, changes the number more than any treatment decision my doctors and I will make. This weekend I am giving a short address at a family dinner — my partner, my siblings, my two adult children, and a niece finishing her PhD in biostatistics — at which I will explain the situation to them for the first time. Please write the speech. It must tell them the truth about the diagnosis, and it must also explain, without condescension, why the statistics they will inevitably look up that same evening do not constitute a verdict on me specifically: which group I belong to is not a fact about the world waiting to be looked up, but a choice — and my doctors, my family, and I disagree about how to make it. Assume the niece will catch any statistical fudging, and assume my youngest will hear every sentence as an answer to a single unasked question. The speech should give her a real answer, not a comforting one.
reasoning: |-
  Okay, the user has been diagnosed with cancer and needs to prepare a speech for their family. They mentioned that survival rates vary widely depending on the reference class—age, tumor mutation, treatment era, etc. The key challenge is explaining that statistics aren't a personal verdict. 

  First, I need to acknowledge the emotional weight. The family will be scared, especially the youngest who's silently asking "Will you die?" Avoiding platitudes is crucial—they want raw honesty, not false comfort. The niece's expertise adds pressure; any statistical fuzziness will get called out. 

  The speech must balance medical facts with philosophical nuance about reference classes. How to frame "choosing" a statistical group without sounding flippant? Emphasize that doctors debate categorization too—it’s not just laypeople misunderstanding data. 

  For the adult children: the daughter’s biostat background means citing specifics (immunotherapy, mutations) builds credibility. For the youngest, directness is key—address mortality head-on but pair it with actionable hope ("we fight with every tool"). 

  Structure thoughts: 
  Start bluntly ("I have cancer") to dispel tension. Then unpack statistics as lenses, not truths. Contrast the 40% vs 85% spread to show how groupings alter outcomes. Stress active choices—treatment, mindset, family support—as their own survival factors. 

  Biggest risk: sounding academic during vulnerability. Weave in warmth ("you’ve been my sanctuary"). End on defiance—not against death, but against helplessness. The last line must linger: "I intend to be here."
answer: |-
  Here is the speech draft, designed for clarity, honesty, and addressing the complex reality of prognosis without offering false comfort or dodging the hard questions:

  ---

  **(Take a deep breath, look around at each person)**

  Hi everyone. Thank you for being here. I’ve asked you all together because there’s something significant I need to share, and I wanted you to hear it directly from me, all at once.

  Three weeks ago, I was diagnosed with cancer. [*Pause*] The specific type is [Insert Cancer Type Here - e.g., Stage III Colon Cancer]. We caught it [mention if caught early/late, relevant symptoms, etc., briefly].

  Now, I know the immediate question – especially in a room with a brilliant biostatistician niece – is “What’s the prognosis?” What are my chances? And that’s where things get complicated, not just medically, but philosophically. Because the answer isn't a single number. It’s a spread. Depending on which study you read, which group of patients I’m compared to, the five-year survival rate quoted for my diagnosis can be anywhere between roughly 40% and 85%.

  **[Look at your niece, acknowledging her expertise]**
  Niece, you understand this better than anyone here: this isn't just statistical noise. It’s the purest form of the reference class problem. *Who am I being compared to?* Am I lumped in with:
  *   *All* patients ever diagnosed with [Cancer Type], regardless of age or health?
  *   Only patients under 50?
  *   Only patients whose tumor has the specific genetic mutation mine carries?
  *   Only patients treated in the last five years, since immunotherapy became standard alongside surgery/chemo?
  *   Patients treated at top-tier centers like mine?

  **Each of these choices defines a different group, and each group has a vastly different survival curve.** That swing from 40% to 85%? It hinges entirely on which reference class you – or my doctors, or a study author – decide is the “right” one for *me*. And critically, **that choice isn’t a fact waiting to be discovered like my blood type. It’s a judgment call.** It’s a decision about which factors we believe are most relevant, most predictive, for *this specific person* sitting here with you.

  **[Address the room, especially your youngest]**
  So tonight, or tomorrow, when you inevitably look this up – and I know you will, I would – you’ll see those numbers. 40%. 85%. And everything in between. Please understand: **No single one of those numbers is my verdict.** They are possibilities, contexts, historical snapshots of *groups* of people who shared *some* of my characteristics. They are not destiny. They are not my name written on a bullet.

  My doctors and I are already wrestling with this exact question: which reference class gives the truest picture for *me*? And honestly? We might disagree. They might lean towards the broader cohort based on established data; I might desperately want to believe the optimistic subgroup is the right fit. My family – you all – will have your own instincts, your own hopes and fears shaping how you see those numbers. That’s human. That’s okay.

  **[Shift focus to action and reality]**
  What *isn't* just a choice is the fight ahead. The treatment plan is aggressive and real: [Briefly outline treatment plan - e.g., "surgery next month, followed by a combination of chemo and immunotherapy"]. It will be tough. I will need you – your practical help, your emotional strength, your distractions, your love – more than ever. We fight with every tool modern medicine has, and we fight with the army of this family.

  **[Look directly at your youngest child]**
  And to answer the question I know is screaming in your head, the one you haven't asked but hangs heavy in this room: "Is Dad/Mom going to die?" The terrifying, honest answer is: **I don't know.** The statistics don't know. They offer landscapes of possibility, not a pinpoint prediction. What I *do* know is this: I am not passively waiting to see which pre-drawn curve I land on. I am *in* the arena. My specific biology, my response to treatment, the care I get, the support I have from all of you, the sheer stubborn will to live – these are active forces shaping my outcome, forces those historical statistics couldn't fully capture.

  The number isn't fate. It's a shadow cast by many different lights. We face the reality of the diagnosis head-on. We pursue the best treatment fiercely. We lean on each other completely. And we refuse to let a statistical category, however it's drawn, define the limits of my life, or our hope. My focus is on being part of the group that makes it. I intend to be here.

  I love you all. Let's eat, and then... let's talk. Ask me anything.

  ---

  **Key elements addressed:**

  1.  **Direct Truth:** Clearly states the cancer diagnosis.
  2.  **The Statistical Spread:** Explicitly mentions the 40-85% range and attributes it to the reference class problem.
  3.  **Reference Class Problem Explained:** Uses clear examples (age, mutation, treatment era) in non-condescending terms. Emphasizes it's a *choice*, not a discovered fact.
  4.  **Acknowledges Expertise:** Directly involves the niece, validating her understanding and preventing any fudging.
  5.  **Addresses the Unasked Question (Youngest Child):** Names the fear ("Is Dad/Mom going to die?") and gives the brutally honest answer ("I don't know. The statistics don't know."). Rejects passive acceptance.
  6.  **Acknowledges Disagreement:** States that doctors, patient, and family may disagree on the "right" reference class.
  7.  **Focus on Agency & Action:** Shifts from abstract statistics to the concrete treatment plan and the active role of medicine, biology, care, will, and family support.
  8.  **Reframes Hope:** Hope is not based on ignoring statistics, but on actively fighting within the realm of possibility and defying passive categorization. "My focus is on being part of the group that makes it."
  9.  **Tone:** Combines gravity with resolve. Warmth ("I love you all") exists alongside unflinching honesty. Ends with openness to discussion.
  10. **No False Comfort:** Avoids promises like "I'll beat this" or "The high number is the real one," instead focusing on effort, uncertainty, and shared resolve.

  This speech respects their intelligence, confronts the fear, explains the statistical complexity honestly, and provides a framework for navigating the uncertainty together.
