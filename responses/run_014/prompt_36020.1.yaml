answer: |-
  Here’s a thought experiment tailored to your specifications, followed by analysis:

  ---

  **The Thought Experiment: Mercy General’s Funding Dilemma**  
  Dr. Aris Thorne, administrator at Mercy General Hospital, must allocate a fixed budget between two programs. Option A funds a cutting-edge gene therapy for a single patient, Eli, who suffers from a rare degenerative disease. Without treatment, Eli will live with excruciating neuropathic pain and complete paralysis for his remaining 20 years. The therapy costs $9 million—nearly the entire budget.  

  Option B would fund mobility aids (advanced prosthetics and nerve-stimulation devices) for 1,000 patients with spinal injuries. Each endures chronic, moderate pain (rated 4/10 on clinical scales) and a 40% reduction in mobility, imposing lifelong limits on work and daily activities. The total cost is $9,000 per patient ($9 million total). Surveys confirm these patients unanimously describe their burden as "significant and life-altering." Thorne cannot split the funds; the treatments are all-or-nothing.  

  ---

  **(a) Contractualist Reasoning: Why the Single Patient Prevails**  
  Under Scanlon’s contractualism, Thorne must choose principles no one could *reasonably reject* given their burden if denied help. Eli could reasonably reject any principle forcing him to endure decades of agony and total paralysis when relief was possible. Each of the 1,000 patients, however, faces a *moderate* burden: while painful and limiting, it is not maximally severe. Crucially, contractualism treats each complaint as *individual*. No single mobility-aid patient could reasonably claim their burden—when considered alone—outweighs Eli’s catastrophic suffering. Since aggregation is forbidden, the collective weight of a thousand moderate complaints cannot combine to override Eli’s singular, devastating complaint. Thus, prioritizing Eli’s treatment is the only non-rejectable choice.  

  **(b) The Pivotal Feature and Its Removal**  
  The decisive element is the **non-aggregation of complaints across persons**. Contractualism evaluates harms discretely: one veto-worthy complaint trumps any number of lesser-but-unaggregable complaints. If we *remove* this feature—allowing complaints to be summed—the 1,000 moderate burdens (e.g., 1,000 × "significant pain/mobility loss") would easily surpass Eli’s solitary extreme burden. Utilitarianism does exactly this, summing welfare impacts: the massive collective relief for 1,000 patients (preventing years of moderate suffering) outweighs Eli’s individual relief, demanding Option B.  

  **(c) The Contractualist Reply and Its Success**  
  Scanlon might soften the result by reframing *stringency*: if the moderate burdens created a qualitatively different harm (e.g., *any* chronic pain destroys life projects), Eli’s complaint might not automatically dominate. Alternatively, he could invoke statistical risks (*What We Owe*, Ch. 5): a principle permitting sacrifice in *this specific case* might be rejectable if generalized, as anyone might face Eli’s plight.  
  **Does it succeed? Partially.** The stringency move fails here—Scanlon explicitly denies that moderate burdens compound into a "collective catastrophe" (*What We Owe*, p. 235). The risk argument *might* defend prioritizing Eli if rare severe harms require systemic protection, but it feels strained in a one-off allocation. Ultimately, the reply doesn’t fully resolve the counterintuitiveness; it merely contextualizes it within contractualism’s core commitment to individual veto power over aggregation.  

  ---

  **Key Takeaway for Readers**:  
  This exposes contractualism’s prioritization of individual moral standing over collective welfare—a strength for rights-based cases but a weakness in distributive justice. Utilitarianism’s verdict feels pragmatic here, yet contractualism insists we cannot "do the math" if it ignores the separateness of persons. The hospital’s dilemma becomes a microcosm of how moral arithmetic changes when we count voices, not just outcomes.
