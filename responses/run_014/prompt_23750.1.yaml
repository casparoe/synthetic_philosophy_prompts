answer: |-
  Quine's "gavagai" argument aims to establish the radical thesis of the **indeterminacy of translation**, which is distinct from and stronger than the **underdetermination of theory by evidence** (the Duhem-Quine thesis). The recurring objection you mention conflates these concepts, treating indeterminacy as mere epistemic underdetermination. Below, I clarify the distinction, explain why Quine's argument targets indeterminacy, and address the global nature of the argument and its implications for the objection.

  ---

  ### **1. Conceptual Distinction: Underdetermination vs. Indeterminacy**
  - **Underdetermination of Theory by Evidence (Duhem-Quine Thesis):**  
    - This is an *epistemic* claim: Multiple theories can be compatible with all available empirical evidence.  
    - **There is a fact of the matter**: One theory could be objectively correct, but we lack sufficient evidence to determine which.  
    - **Example**: In physics, both Newtonian mechanics and General Relativity can predict planetary motion in many contexts, but only one accurately describes reality. The evidence underdetermines which is true, but gravity is not "indeterminate"—it has an objective structure.

  - **Indeterminacy of Translation (Quine's Thesis):**  
    - This is an *ontological* claim: There is **no fact of the matter** about meaning. Translation is not just unknowable—it is objectively indeterminate.  
    - **No "correct" translation**: Competing translation manuals can be empirically equivalent (fit all behavioral evidence) yet mutually incompatible (e.g., "gavagai" as "rabbit" vs. "undetached rabbit parts").  
    - **Example**: The native’s use of "gavagai" in the presence of a rabbit does not fix whether it refers to the animal, its temporal stage, or its spatial parts. No hidden fact (e.g., mental states, Platonic meanings) resolves this.

  **Key Difference**:  
  Underdetermination implies a gap in our knowledge; indeterminacy implies a gap in reality. Quine argues meaning is indeterminate because it lacks objective criteria beyond behavior.

  ---

  ### **2. Why Quine’s Argument Aims for Indeterminacy, Not Mere Underdetermination**
  Quine’s "gavagai" thought experiment is not about a localized ambiguity but a demonstration that **meaning itself has no objective grounding**. Two pillars support this:
  - **Behaviorism**: Meaning is exhausted by observable behavior. If two interpretations yield identical speech dispositions (e.g., assent/refusal to "gavagai" in all scenarios), there is no further fact to adjudicate between them.  
  - **Physicalism**: All facts are physical facts. If no physical difference (e.g., brain states, environmental triggers) correlates with competing meanings, no fact of the matter exists.  

  The "gavagai" case illustrates that behavioral evidence (pointing, assent, etc.) cannot distinguish between translations because:  
  - "Rabbit" vs. "undetached rabbit part" vs. "rabbit stage" all predict the same responses to stimuli (e.g., the native says "gavagai" when a rabbit appears).  
  - Quine argues this is not a temporary ignorance but a permanent ontological hole: meanings are not "out there" to be discovered.

  ---

  ### **3. Why Indeterminacy is Global, Not Local**
  The objection treats "gavagai" as a local ambiguity resolvable by context. Quine rejects this: indeterminacy is **holistic** and **systemic** to the entire translation manual.  
  - **Local Ambiguity vs. Global Indeterminacy**:  
    - A local ambiguity (e.g., English "bank" = river/finance) is resolved by context (e.g., "bank" near "money" vs. "water").  
    - In radical translation, competing manuals for "gavagai" require *compensatory adjustments* across the entire language.  
      - Example: If "gavagai" = "undetached rabbit part," the translation of identity ("is the same as") must shift to accommodate how parts persist over time.  
      - Result: Manual A ("gavagai" = "rabbit") and Manual B ("gavagai" = "undetached part") are *empirically equivalent* but *logically incompatible*. Both fit all behaviors, yet one cannot be "true" and the other "false."

  - **Holism of Meaning**:  
    Quine extends his semantic holism (from "Two Dogmas of Empiricism") to translation. The meaning of "gavagai" depends on its role in the entire web of beliefs, not isolated stimuli. Changing the translation of one term cascades into revisions across the manual (e.g., altering logic, ontology, or other terms). Since no manual is uniquely determined, **meaning is globally indeterminate**.

  ---

  ### **4. How Globality Defeats the Objection**
  The objection ("it's just epistemic underdetermination for 'gavagai'") fails because:  
  1. **No Exit Strategy**:  
     - If indeterminacy were local, additional context (e.g., asking "Is this gavagai the same as that one?") could resolve it. But Quine shows that such questions *presuppose* a translation manual (e.g., for "same"). Manual A and Manual B will interpret the native’s responses consistently within their own frameworks, leaving no neutral ground.  
  2. **Empirical Equivalence is Inescapable**:  
     - All possible evidence (past, present, future) is accounted for in both manuals. No "crucial experiment" can break the symmetry because behavior fixes only stimulus conditions, not meanings.  
  3. **No Superfacts**:  
     - Quine’s physicalism denies hidden facts (e.g., intentions, neural correlates) that could resolve the dispute. If two manuals align with all physical facts, they are equally valid—not competitors for a single truth.  

  ---

  ### **Conclusion: Why Quine’s Argument Stands**
  Quine’s indeterminacy thesis is stronger than underdetermination because it denies meaning any objective status beyond behavior. The "gavagai" example is not about one word’s ambiguity but a microcosm of how translation manuals are globally underdetermined *and* ontologically ungrounded. The objection’s focus on local epistemic uncertainty misses Quine’s point: **meaning is not a fact to be discovered but a pragmatic construct**. This makes indeterminacy a profound challenge to the very idea of objective semantics, not just a limitation of linguists' methods.
