prompt: |-
  In a reading group I'm in, a friend has produced an argument about standing to blame that I can't shake, because each premise looks right and the conclusion is one I can't accept.

  (1) To blame someone is to hold them to a standard of conduct.
  (2) One can hold another to a standard only if one meets that standard oneself — you cannot demand of another what you do not yourself satisfy.
  (3) Everyone who blames has, at some point, failed a standard of conduct comparable in seriousness to the one she invokes.
  (4) So no one has standing to blame anyone.
  (5) That is absurd: it would silence moral criticism altogether and hand wrongdoers an immunity.
  (6) Therefore (2) is false, and the blamer's own record is irrelevant to her standing.

  He draws (6) and concludes that the notion of standing should simply be dropped. I suspect (2) is being asked to do more work than it can, but I can't name what, and I would rather keep (5) and (2) than (6) if there is a way.

  Two cases keep pulling me in opposite directions. The recovered hypocrite: someone who once did exactly what she now blames, but has owned it, made amends, and does not pretend otherwise — she seems to me to have standing, which makes (2) too strong as written. The manipulator: someone who is doing that very thing right now, to the person he blames for it — he seems to me to lack standing, which makes (2) not simply false. Whatever repairs the first case has to leave the second condemned. And I don't know what to say about a court: it blames defendants though it has no conduct of its own, and a judge's private failings don't cost the court its authority to convict — so either (2) fails for everyone, or there is a disanalogy between institutional and interpersonal blame that is doing the real work.

  Give me a verdict, not a menu. Name the step you reject — or, if you think the argument is valid, the premise least costly to give up — explain why that step looked fine, and price the alternatives: which of the two cases you sacrifice, whether you end up with standing for everyone with clean hands, standing only for the wronged, or no standing at all, and what remains of the concept once you have paid. Reason from the cases rather than from who has said what; I don't want a survey.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're in a reading group and their friend presented an argument about standing to blame that leads to the conclusion that no one has standing to blame anyone. The user finds each premise plausible but the conclusion unacceptable. They want me to identify which step to reject, explain why it seemed right, and what the costs are.

  First, I need to understand the argument's structure. Premise (1) says blaming is holding someone to a standard. Premise (2) claims you can only hold someone to a standard if you meet it yourself. Premise (3) states everyone has failed a comparable standard at some point. Together, these lead to (4): no one has standing to blame. But (5) points out this is absurd, so (6) rejects premise (2). The friend then suggests dropping the concept of standing altogether.

  The user mentions two key cases: the recovered hypocrite and the manipulator. The recovered hypocrite seems to have standing despite past failures, suggesting (2) is too strict. The manipulator lacks standing due to current hypocrisy, so (2) can't be entirely wrong. There's also the court example, which blames without personal conduct, challenging (2) universally.

  Hmm. The core tension is balancing these cases. If I reject (2), the manipulator might gain standing, which is counterintuitive. If I keep (2), the recovered hypocrite loses standing, which feels unfair. The court case adds complexity—institutions blame without personal failings, so maybe (2) doesn't apply there. But the user wants a unified account.

  Wait, maybe the issue is that (2) conflates different relationships. In interpersonal blame, the blamer's current hypocrisy matters, but past failures don't if addressed. For institutions, standing comes from role, not personal conduct. So perhaps (2) is wrong because it ignores context. The user's friend wants to drop standing entirely, but that seems extreme—we do recognize hypocrites lack standing.

  Looking back at premise (2): "One can hold another to a standard only if one meets that standard oneself." This is the key. In the manipulator case, the standard isn't met currently, so they can't demand it. But the recovered hypocrite now meets the standard, so they can. So (2) needs to specify current compliance. The user’s recovered hypocrite example shows that past failures don't nullify standing if they're addressed. The manipulator is currently violating the standard, so they lack standing. 

  Premise (3) says everyone has failed at some point, but if (2) is about current compliance, then (3) doesn't block standing for those currently meeting the standard. So (4) doesn't follow. The recovered hypocrite now meets the standard, so they have standing. The manipulator doesn't, so they lack it. Courts derive standing from their role, not personal conduct, so (2) doesn't apply to them—different context.

  The user suspected (2) was doing too much work. By modifying (2) to focus on current adherence, we preserve standing for the recovered hypocrite and deny it to the manipulator. The court case is handled separately because institutional blame operates on different principles. 

  The cost? We have to accept that standing depends on current, not historical, compliance. The recovered hypocrite keeps standing, which the user wants. The manipulator still lacks it. We don't sacrifice either case. The concept of standing remains, tied to current adherence. Premise (3) is true but irrelevant if standing requires current compliance. The absurdity in (5) is avoided because not everyone lacks standing—only those currently violating the standard do. 

  So the step to reject is (2) as stated. Instead, it should require meeting the standard currently, not eternally. The reason (2) seemed right is because of cases like the manipulator, where current hypocrisy undermines standing. But the recovered hypocrite shows that past failures don't matter if currently compliant. 

  This approach keeps standing meaningful without dismissing it entirely. The user can maintain (5) and a revised (2), avoiding the friend's conclusion to drop standing altogether.
answer: |-
  Here's the verdict: **Reject premise (2) as stated, but replace it with a narrower principle that distinguishes *current* hypocrisy from *past* failures and *institutional roles*.** Premise (2) ("One can hold another to a standard only if one meets that standard oneself") is the culprit—it overgeneralizes a genuine insight into an unsustainable absolute. I'll explain why (2) seemed plausible, why it fails, and what the costs are, using your cases as the anchor.

  ### Why Premise (2) Looked True
  - **The manipulator case** exposes its intuitive core: If you’re *actively* cheating your partner while blaming them for cheating, your hypocrisy destroys your standing. You’re violating the *very standard* you’re invoking, making your blame a weapon, not a moral appeal. This feels like a fundamental truth about fairness: you can’t *demand* compliance you’re flouting.
  - **Superficial institutional analogy**: A judge condemning theft while stealing *in their private life* seems corrupt, suggesting (2) applies universally. But this misreads institutions—their authority isn’t personal.

  ### Why Premise (2) Fails
  1. **It conflates past/present failure**:  
     - **The recovered hypocrite** refutes (2). If they’ve genuinely reformed (owned the fault, made amends, changed behavior), their *past* failure doesn’t nullify standing. Holding others to a standard you *now uphold* is legitimate—even admirable. Demanding current compliance is reasonable; demanding lifelong perfection is not. (2) ignores moral growth.
     
  2. **It ignores institutional distinctness**:  
     - **The court case** reveals a category error. Courts blame *as institutions*, not individuals. Their standing derives from social authorization (laws, roles), not personal conduct. A judge’s private failings may undermine their *personal credibility* but not the *court’s authority* to condemn. (2) falsely assumes all blame is interpersonal.

  3. **It makes premise (3) lethal when it shouldn’t be**:  
     Premise (3) is likely true—everyone has failed *some* comparable standard. But if (2) requires *lifelong* compliance, (3) indeed voids all standing. Yet the recovered hypocrite shows that past failure doesn’t doom you if you now meet the standard. (2)’s absolutism creates the absurdity in (5).

  ### The Repair: Revise Premise (2)
  **New principle**: *You lack standing to blame someone for violating a standard if you are* currently *violating that same standard yourself (or one equally serious), relative to the relationship context.*  

  - **Saves the recovered hypocrite**: They meet the standard *now*, so they have standing. Past failure is irrelevant.  
  - **Condemns the manipulator**: They’re violating the standard *now*, so they lack standing.  
  - **Explains the court**: Institutions aren’t "individuals" who can "currently violate" interpersonal standards. Their standing flows from role-based authority, not personal conduct. (Private hypocrisy might create *conflicts of interest*, but not invalidate the *institution’s* standing.)

  ### Costs and Trade-offs
  - **Sacrificed**: The idea that *any* past failure (however distant, repented, or irrelevant) destroys standing. This was unrealistic and morally stifling.  
  - **Preserved**:  
    - Standing for those with "clean hands" *regarding the specific fault* (current compliance).  
    - Standing for the wronged party (if they aren’t currently committing the same wrong).  
    - Hypocrisy as a standing-defeater—but only for *current* hypocrisy.  
  - **Concept survives**: Standing isn’t discarded—it becomes context-sensitive. We silence *hypocrites*, not all critics.  

  ### Why Not Other Premises?
  - **Premise (1)**: Harmless. Blaming does involve holding to a standard.  
  - **Premise (3)**: Likely true, but only lethal if combined with the flawed (2).  
  - **Premise (5)**: Correct—absurdity must be avoided.  
  - **Conclusion (6)**: Overcorrects by dismissing standing entirely. The manipulator proves standing *matters*.

  ### Verdict
  Your instinct was right: (2) is doing too much work. It’s not *false*; it’s *overbroad*. The repaired principle rescues standing from absurdity by tethering it to *current conduct* and *role context*. The manipulator is condemned, the recovered hypocrite vindicated, and the court’s authority unharmed. Moral criticism survives—with teeth against hypocrisy, but room for redemption.
