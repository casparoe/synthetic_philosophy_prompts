prompt: |-
  hey so i help run a small uni fund that gives away like 5k a term and we only get about an hour to decide, most of us arent philosophy people. we keep getting pascals mugging style pitches where the expected value looks huge cause of some tiny probablity of an enormous payoff but it feels off. can you turn the usual fixes people talk about — like capping payoffs, ignoring super tiny chances, judging by long-run policy not one bet — into a quick checklist we could actually run in 15 mins, with clear when to reject vs escalate to a longer debate and flagging where its just a judgement call? then try it out on two toy cases i made up: A) someone wants $400 to brute-force search for a mathematical proof that if found would supposedly let him create a vast number of happy simulated lives, chance of success is like one in two million, B) paying for a flood wall with about a 5% chance of preventing serious harm to a village. also show us one case where your checklist says something most of us would hate, and say what the checklist just cant settle.
reasoning: |-
  We are creating a quick checklist for evaluating grant proposals that might be Pascal's Mugging style (i.e., very small probability of an extremely large payoff). The checklist should help in deciding whether to reject, accept, or escalate for further debate. The key ideas from the fixes are:

  1. **Cap the payoff**: Do not consider payoffs above a certain threshold as credible. For example, any payoff above a certain amount (say, $X) is capped at that value for the purpose of expected value calculation.

  2. **Ignore super tiny probabilities**: Set a probability threshold below which we ignore the event (treat as zero). For example, if the probability is less than 1 in a million, ignore it.

  3. **Long-run policy**: Instead of evaluating one bet, think about the long-run policy of funding similar bets. If we funded many such bets, would it be a sustainable and beneficial policy?

  We can design a checklist with steps:

  ### Checklist for Evaluating High-Impact, Low-Probability Proposals

  1. **Probability Threshold Check**: 
     - If the stated probability is below a pre-defined tiny threshold (e.g., 1 in 1,000,000), then reject immediately. (This avoids getting mugged by extremely low probabilities.)
     - **Decision**: If below threshold -> Reject. Else, proceed.

  2. **Payoff Cap Check**:
     - Cap the claimed payoff at a pre-defined maximum credible payoff (e.g., $1 billion). Use the capped value for expected value calculation.
     - **Decision**: If the expected value (with cap) is negative or not significantly positive, reject. If it's positive and substantial, proceed. Otherwise, reject.

  3. **Expected Value Calculation**:
     - Calculate expected value as: `(min(claimed_payoff, cap)) * probability - cost`.
     - If the expected value is negative, reject.
     - If positive, then proceed to the next step.

  4. **Long-Run Policy Check**:
     - Imagine funding 100 (or 1000) similar independent projects. Would the overall expected value be positive? Also, consider if we have the budget to fund enough such projects to make the law of large numbers kick in. If the required number of projects to see the expected outcome is beyond our budget, then it's not sustainable.
     - Also, consider if the project is a one-off or if we expect many similar proposals. If we get too many of these, we might go bankrupt before hitting one success.
     - **Decision**: If the long-run policy seems sustainable and the overall expected value is positive, then accept (or escalate if the amount is large). If not, reject.

  5. **Escalation Criteria**:
     - If the project passes steps 1-4 but the cost is high or there are significant qualitative factors (like ethical concerns, reputational risk, etc.), escalate for further debate.
     - Also, if the project is on the edge of the thresholds, escalate.

  We need to set two parameters:
  - Tiny probability threshold: e.g., 1 in 1,000,000 (0.000001)
  - Payoff cap: e.g., $1 billion (1e9 dollars)

  Now, let's apply the checklist to the two toy cases.

  ### Case A: 
  - **Cost**: $400
  - **Claimed Payoff**: Enormous (let's say they claim it will create value equivalent to 1e18 happy lives, which they value at $1e18 or more)
  - **Probability**: 1 in 2 million (5e-7)

  Checklist:

  1. **Probability Threshold Check**: 
     - Probability = 1/2,000,000 = 5e-7. Our threshold is 1e-6 (0.000001). Since 5e-7 < 1e-6, we reject by this step.

  **Decision for Case A**: Reject (because probability is too low)

  ### Case B:
  - **Cost**: Let's say the cost is $10,000 (we don't have the cost, but for the flood wall, we'll assume it's given as $10,000)
  - **Claimed Payoff**: Preventing serious harm to a village. Let's assume they quantify the harm as $2 million (e.g., property damage, health costs, etc.)
  - **Probability**: 5% (0.05)

  Checklist:

  1. **Probability Threshold Check**: 
     - 0.05 is much greater than 1e-6, so we pass.

  2. **Payoff Cap Check**:
     - The claimed payoff is $2 million. If our cap is $1 billion, then we use $2 million.
     - Expected value = (0.05 * 2,000,000) - 10,000 = 100,000 - 10,000 = 90,000 (positive and substantial)

  3. **Expected Value Calculation**: Positive, so pass.

  4. **Long-Run Policy Check**:
     - If we funded 100 such independent projects, the total cost would be 100 * 10,000 = $1,000,000.
     - The expected total payoff would be 100 * 100,000 = $10,000,000 (since each has expected payoff $100,000).
     - This is sustainable and has positive expected value. Also, with 100 projects, we expect about 5 successes (since each has 5% chance) and the law of large numbers applies.

  **Decision for Case B**: Accept (or if the cost is high relative to our fund, we might escalate, but the expected value is positive and policy is sustainable).

  ### A case where the checklist says something most would hate:

  Consider a proposal with:
  - **Cost**: $1,000
  - **Claimed Payoff**: $100 billion (which is above our cap of $1 billion, so we cap at $1 billion)
  - **Probability**: 1 in 10,000 (0.0001)

  Checklist:

  1. **Probability Threshold Check**: 0.0001 (1e-4) is above 1e-6, so pass.
  2. **Payoff Cap Check**: Capped at $1 billion. Expected value = (0.0001 * 1e9) - 1000 = 100,000 - 1000 = $99,000 (positive).
  3. **Expected Value Calculation**: Positive, so pass.
  4. **Long-Run Policy Check**: 
     - If we fund 100 such projects: total cost = 100 * 1000 = $100,000.
     - Expected total payoff = 100 * 0.0001 * 1e9 = 100 * 100,000 = $10,000,000.
     - However, note that the probability of at least one success is 1 - (1-0.0001)^100 ≈ 1% (very low). The expected value is high, but the variance is also high. We might go bankrupt if we have a run of bad luck? Actually, the expected value is positive and we are a fund that can absorb the loss of $100,000 (if we have the budget). But note: the expected value per project is $99,000, so funding 100 of them we expect to make $9.9 million on average. However, the chance of zero successes is about 99%, and the chance of one or more successes is about 1%. So, 99% of the time we lose $100,000, and 1% of the time we gain $100 billion minus $100,000 (which is huge). But note: we capped the payoff at $1 billion per project? Then the expected value per project is $99,000, and for 100 projects: 100*99,000 = $9.9 million. However, the actual outcome distribution: we are very likely to lose $100,000 and with a small chance we get a huge return. 

     The long-run policy might be acceptable if we have a large enough budget to fund many such projects. But note: to get the law of large numbers to work, we need to fund a large number of independent projects. The expected number of successes in 100 projects is 0.01 (very low). We would need to fund 10,000 such projects to have an expected number of successes of 1. The total cost for 10,000 projects would be $10 million. The expected payoff would be 10,000 * (0.0001 * 1e9) = 10,000 * 100,000 = $1 billion. So the expected net gain is $1 billion - $10 million = $990 million. But the fund might not have $10 million to spend. However, we are a small fund that gives away $5k per term (so about $15k per year). $10 million is way beyond our budget. Therefore, we cannot fund enough projects to make the law of large numbers kick in. Therefore, we reject by the long-run policy check.

  **Decision for this case**: Reject because we cannot fund enough projects to make the long-run policy sustainable (we don't have the budget to absorb the variance).

  But note: if we had a huge budget, we would accept. However, as a small fund, we must reject.

  Alternatively, we might set an additional rule: if the expected number of projects we would need to fund to get one success is beyond our budget, then reject. In this case, the expected number of projects for one success is 10,000. If we can't fund 10,000, then we reject.

  ### What the checklist cannot settle:

  The checklist cannot settle ethical considerations that are not captured by the quantitative analysis. For example:

  - A proposal that has a positive expected value but involves unethical means (e.g., experimenting on humans without consent) would be rejected on ethical grounds, but our checklist only looks at the numbers.

  Also, the checklist relies on the estimates of probability and payoff provided by the proposer. If the committee doubts the credibility of the probability or payoff estimates, that would require a separate credibility check (which we haven't built in). We might add a step:

  0. **Credibility Check**: If the claimed probability or payoff seems implausible, reject or escalate.

  But that is a judgment call.

  ### Revised Checklist with Step 0:

  0. **Credibility Check** (Judgment Call):
     - Are the probability and payoff estimates credible? 
     - If not, reject or escalate.
     - If yes, proceed.

  And then steps 1-4 as above.

  ### Summary of Checklist:

  0. **Credibility**: If the proposal seems sketchy or the numbers are not credible, reject or escalate. (This step is a judgment call.)
  1. **Probability Threshold**: If probability < 1e-6, reject.
  2. **Payoff Cap**: Cap payoff at $1e9. Calculate expected value (EV) = min(payoff, cap) * probability - cost. If EV <= 0, reject.
  3. **Long-Run Policy**: 
     - Calculate the expected number of projects needed for one success: 1/probability.
     - If we can't afford to fund that many (given our budget), then reject. (Because the variance is too high for our small fund to handle.)
     - Otherwise, if the overall expected value for the set of projects we could fund is positive and we have the budget, then proceed to accept or escalate.
  4. **Escalation**: If the project passes the above but has high cost, ethical concerns, or other qualitative factors, escalate for further debate.

  Now, let's re-run the cases with the revised step 0.

  **Case A**:
  - Step 0: The proposal of brute-force searching for a mathematical proof that leads to creating simulated lives might be seen as not credible (because the link between the proof and the payoff is speculative). But let's assume we take it at face value. Then step 1: probability too low -> reject.

  **Case B**:
  - Step 0: Flood wall for a village is a standard intervention, so credible.
  - Steps 1-4: Pass -> accept.

  **The controversial case** (with $1000 cost, $100 billion payoff, 1 in 10,000 chance):
  - Step 0: The payoff of $100 billion might be not credible? (e.g., how does the project generate $100 billion?) If we cap at $1 billion, we do so because we don't believe payoffs above that. But the probability might also be questionable. If we judge it as credible, then:
  - Step 1: 1e-4 > 1e-6 -> pass.
  - Step 2: EV = (1e9 * 1e-4) - 1000 = 100,000 - 1000 = 99,000 -> positive.
  - Step 3: Expected number of projects for one success: 10,000. Our fund has a limited budget (about $5k per term, so maybe $10k-$15k per year). We cannot fund 10,000 projects (which would cost $10 million) -> reject.

  But note: if the fund had a huge budget, we would accept. So the long-run policy check is budget-dependent.

  Finally, we note that the parameters (probability threshold, payoff cap) and the fund's budget are critical and should be set by the committee in advance.

  This checklist should help in making quick decisions and flagging when more debate is needed (escalation).
answer: |-
  Here's a practical checklist for your fund, designed for quick decisions on Pascal's Mugging-style proposals. It combines key fixes into a 4-step flow, with clear rejection criteria and escalation flags. Budget/time constraints are baked in.

  ---

  ### **Pascal's Mugging Defense Checklist**
  *(For proposals with tiny probabilities of huge payoffs)*

  1. **CREDIBILITY SANITY CHECK**  
     → *Ask: "Is the claimed payoff physically possible or logically coherent?"*  
     - **Reject immediately** if:  
       - Payoff relies on infinite/multiverse claims (e.g., "infinite lives")  
       - Probability is ungrounded (e.g., "could be 0.0001% or 0.0000001%—we don't know")  
     - **Escalate** if:  
       - Payoff involves unverified tech/magic (e.g., "superintelligence will solve everything")  
       - *Judgment call needed: Is the core mechanism plausible?*

  2. **PROBABILITY FLOOR (Ignore Negligible Chances)**  
     → *Set a floor: Probabilities < 0.0001% (1 in 1 million) = 0*  
     - **Reject immediately** if:  
       - Stated/adjusted probability < your floor (e.g., "1 in 50 million")  
       - Proposal admits probability is "unknowably small"  
     - **Escalate** if:  
       - Probability is borderline (e.g., 1 in 900,000) OR  
       - Sensitivity matters (e.g., "if our probability is off 10x, EV changes massively")  

  3. **PAYOFF CAP (Limit Maximum Credible Impact)**  
     → *Set a cap: No payoff > 100,000x your fund's **annual** budget ($5k/term × 3 terms × 100,000 = $1.5B cap)*  
     - **Recalculate Expected Value (EV)**:  
       `EV = [min(Claimed Payoff, Cap)] × Probability - Cost`  
     - **Reject immediately** if:  
       - EV ≤ 0 after capping OR  
       - EV < 2× cost (too little margin)  
     - **Escalate** if:  
       - Capped EV is positive but borderline  

  4. **LONG-RUN VIABILITY TEST**  
     → *Ask: "If we funded 100 similar projects, would we expect net good?"*  
     - **Reject immediately** if:  
       - Success requires funding >100× your annual budget to break even  
       - Failure could cause active harm (e.g., "if this AI safety project backfires...")  
     - **Accept** if:  
       - All checks passed + EV > 2× cost + no red flags  
     - **Escalate** if:  
       - High uncertainty about repeatability OR  
       - Ethical trade-offs (e.g., "saves humans but risks ecosystems")  

  ---

  ### **Applied to Your Toy Cases**
  **Case A: Math Proof for Simulated Lives ($400 request)**  
  1. **Credibility**: 🚩 *Escalate*  
     - *Why?* "Vast happy simulated lives" is abstract and relies on unproven causal chain (proof → simulations → utility).  
  2. **Probability Floor**: (1 in 2M = 0.00005%) → **Reject**  
     - *Why?* Below 0.0001% floor. *Stop here—no need for further analysis.*  

  **Verdict: REJECT** (under 5 mins)

  **Case B: Flood Wall (5% chance of preventing harm)**  
  1. **Credibility**: ✅ Pass (standard intervention)  
  2. **Probability Floor**: 5% > 0.0001% → ✅ Pass  
  3. **Payoff Cap**:  
     - Assume "serious harm" = $10M value (e.g., lives, livelihoods)  
     - Cap = $1.5B → Capped payoff = $10M (well under cap)  
     - EV = ($10M × 0.05) - Cost = $500k - Cost  
     - If cost is $10k → EV = $490k (✅ 49× cost → strong pass)  
  4. **Long-Run**: ✅ Pass (funding 100 such projects would expect 5 successes → net positive)  

  **Verdict: ACCEPT** (under 5 mins)

  ---

  ### **Case Where Checklist Says "Reject" (But Feels Bad)**
  **Proposal**: $1k for emergency malaria nets in a war zone.  
  - **Claimed**: 0.001% chance of preventing an outbreak that could kill 500k people (EV uncapped = $5B × 0.00001 - $1k = $49k)  
  - **Checklist**:  
    1. Credibility: ✅ (plausible mechanism)  
    2. Probability: 0.001% (1 in 100k) → ✅ above floor  
    3. Payoff Cap: Capped at $1.5B → EV = ($1.5B × 0.00001) - $1k = $14k → ✅  
    4. **Long-Run**:  
       - To expect 1 success, fund 100,000 projects → cost $100M  
       - Your fund’s annual budget = $15k → **unsustainable**  
       - *Reject*: You’d need 6,666 years of budget for one expected win.  

  **Why it feels bad**: It targets real human suffering, but the checklist prioritizes avoiding resource traps. **Escalate** if ethical urgency overrides (e.g., "we have insider intel the risk is 10x higher").

  ---

  ### **What the Checklist Can't Settle**
  1. **Ethical Weighting**:  
     - e.g., Is preventing "10,000 happy simulated lives" equal to 10,000 human lives?  
     - *Requires philosophical debate*.  
  2. **Deep Uncertainty**:  
     - When probabilities/payoffs are highly ambiguous (e.g., "this AI project has between 0.0001% and 20% chance of success").  
  3. **Reputation/Risk Tolerance**:  
     - e.g., "Funding this fringe project might make us look foolish" vs. "Missing a breakthrough is worse."  

  **Recommendation**: For escalated cases, vote on:  
  - **"Would we regret not funding this in 10 years if it succeeded?"**  
  - **"Could this bankrupt us before any win?"**  

  This system prioritizes **scalability** (no complex math), **speed** (rejects obvious mugging in Step 1-2), and **sustainability** (Step 4 protects your fund). Adjust caps/floors as you see more proposals!
