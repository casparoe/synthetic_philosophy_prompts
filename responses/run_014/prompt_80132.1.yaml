  Also worth noting: both seem to assume "epistemic modesty" solely means deferring to base rates. But true modesty might involve admitting we need both lenses and staying alert to when either fails. The planning fallacy example is perfect—correcting it isn't about rejecting inside views but tempering them with data. 

