prompt: |-
  ok so i'm trying to get clear on the material constitution debate before i dive into the literature — statue and clay, tibbles the cat, ships of theseus, all that. what i want is the desiderata: what does a theory of material constitution actually have to get right to count as adequate? i mean the cases it has to handle (and which are edge cases people can reasonably disagree about), the distinctions it can't collapse (like constitution vs identity, or sortal differences), the logical constraints it has to respect (leibniz's law is in the room), and any results from metaphysics or logic it can't contradict. for each desideratum, give me the case or consideration that motivates it. then flag which ones are non-negotiable and which are more like preferences of particular camps (the nihilist, the universalist, the coincident-objects person, etc.). and if some subset of these desiderata are jointly unsatisfiable — like you literally can't have all of them at once given some constraint — that's the part i most want to see. skip the scorecard of existing theories, i'll do that myself.
reasoning: |-
  Okay, the user is diving into material constitution and wants a clear breakdown of the desiderata before tackling the literature. They mentioned classic cases like the statue and clay, Tibbles the cat, and the Ship of Theseus. They want to know what a theory must get right to be adequate—handling specific cases, avoiding collapses of key distinctions, respecting logical constraints, and not contradicting established results. They also want motivations for each desideratum, notes on negotiability, and any joint unsatisfiability issues.

  First, I need to recall the core issues in material constitution. The main problem is how two objects can share the same space and matter without being identical. Leibniz's Law is central here because if two things share all properties, they should be identical. But in cases like the statue and clay, they seem to have different properties (e.g., the clay existed before the statue). So one desideratum must involve Leibniz's Law adherence.

  Then there's persistence conditions. The Ship of Theseus highlights this—whether identity depends on material continuity or functional continuity. Theories need to explain how objects persist through change. This ties into de re modal properties, like the statue being fragile but the lump not, which leads to the problem of temporary intrinsics.

  The statue/clay case is key for distinguishing constitution from identity. If a theory collapses them into identity, it fails here. Tibbles the cat introduces the problem of material objects overlapping spatially and how to handle parts and wholes, especially with vagueness. The Ship of Theseus adds temporal persistence and the grounding problem—what makes an object the same over time?

  Essentialism and sortal-dependence matter too. Different kinds of objects (like statues vs. lumps) have different essential properties. A theory must respect these sortal concepts without reducing them to physical properties. Mereology comes into play with universalism (any parts compose an object) versus nihilism (only simples exist), affecting how constitution is framed.

  Now, the user wants to know which desiderata are non-negotiable versus camp-specific. Leibniz's Law is non-negotiable logically, though some might challenge its application. Material object existence is another, as denying it leads to radical views like eliminativism. But persistence conditions and mereological commitments vary by camp—nihilists reject composites, while universalists accept all fusions.

  The big issue is joint unsatisfiability. The core tension is between Leibniz's Law and the distinctness of coincidents. If the statue and clay share all properties at a time, they should be identical, but they have different historical/modal properties. Solutions like temporal parts or sortal-relative identity emerge, but each has trade-offs. The grounding problem also arises: how can two objects have different properties without a non-physical basis? This might force concessions in other desiderata.

  The user might be preparing to evaluate theories themselves, so clarity on these tensions is crucial. They might also be interested in how different camps prioritize desiderata, like perdurantists using temporal parts to handle persistence but facing composition questions. Highlighting the unavoidable trade-offs will help them navigate the literature effectively.
answer: |-
  Here's a breakdown of the core desiderata for a theory of material constitution, structured as you requested. The goal is to map the conceptual landscape and tensions *before* diving into specific theories.

  **I. Core Cases & Phenomena to Handle (The Data)**

  1.  **The Statue & The Lump (Coincidence at a Time):**
      *   **Case:** A statue (Goliath) is created from a lump of clay (Lumpl). At the moment of creation, they occupy the exact same space, are made of the exact same atoms, and seem to be intimately connected.
      *   **Motivating Desideratum:** The theory must account for the **apparent distinctness** of Lumpl and Goliath despite their **spatio-material coincidence** at that time. Why do we think they are two things? (Different origins, different persistence conditions, different modal properties).
      *   **Non-Negotiability:** High. Any theory must either explain this distinctness or explain away the strong intuition of distinctness. Denying distinctness entirely faces significant intuitive pushback.

  2.  **Tibbles the Cat (Spatial Coincidence & Vagueness/Decomposition):**
      *   **Case:** Tibbles the cat is on the mat. Tibbles-minus-Tail (the mereological complement of the tail) is also on the mat, coincident with Tibbles-minus-Tail-Region. If Tibbles loses its tail, Tibbles-minus-Tail seems to become identical to the whole cat. But was Tibbles-minus-Tail always there, coincident with Tibbles even when the tail was attached?
      *   **Motivating Desideratum:** The theory must handle **spatially coincident objects** where one is a **proper part** of the other (or the complement of a part). It must address questions of **existence conditions for undetached parts** and the **vagueness/vagility** of objects (e.g., is there a precise moment Tibbles-minus-Tail becomes identical to Tibbles?).
      *   **Non-Negotiability:** Moderate-High. Handling part-whole relations and spatial coincidence is central. How it handles vagueness (e.g., rejecting undetached parts, embracing them, or making existence vague) varies by camp.

  3.  **The Ship of Theseus (Persistence Over Time & Identity Criteria):**
      *   **Case:** A ship (The Theseus) has its planks gradually replaced one-by-one over time. Simultaneously, the original planks are reassembled into a second ship. Which ship, if either, is the original Theseus?
      *   **Motivating Desideratum:** The theory must provide a principled account of **persistence conditions** and **criteria of identity over time** for material objects. What makes an object at T2 the *same* object as an object at T1? (Material continuity? Spatio-temporal continuity? Functional continuity? Form?).
      *   **Non-Negotiability:** High. Explaining how objects persist through change is a core task of any theory of material objects. *How* it does this (e.g., endurance vs. perdurance) varies significantly.

  4.  **The Clay's History (Temporal Properties & Modal Properties):**
      *   **Case:** Lumpl (the lump of clay) existed before Goliath (the statue) was formed. Lumpl could survive being squashed into a ball, while Goliath could not. Goliath is essentially statue-shaped, Lumpl is not.
      *   **Motivating Desideratum:** The theory must accommodate the **different historical properties** (Lumpl existed before Goliath) and **different modal/de re properties** (Lumpl can survive squashing, Goliath cannot; Goliath is essentially a statue, Lumpl is essentially clay) of coincident objects.
      *   **Non-Negotiability:** High. These differences are the primary evidence for distinctness in the Statue/Lump case. A theory that cannot account for them faces severe challenges.

  **II. Key Distinctions to Preserve (Or Explain Away)**

  5.  **Constitution vs. Identity:**
      *   **Motivation:** Intuitions from cases 1 & 4 strongly suggest that constitution (Lumpl constitutes Goliath) is not identity (Lumpl = Goliath). Identity is symmetric, transitive, and governed by Leibniz's Law. Constitution seems asymmetric (the lump constitutes the statue, not vice versa) and allows for property differences.
      *   **Desideratum:** The theory must either **preserve a robust distinction between constitution and identity** or provide a compelling explanation for why the distinction is illusory *without* collapsing essential differences in history and modality.
      *   **Non-Negotiability:** Central, but contentious. *Preserving* the distinction is non-negotiable for **Coincidentalism**. *Collapsing* it (typically into identity) is non-negotiable for **Identity Theories (Monism)**. Other theories (Nihilism, Universalism, Perdurantism) may avoid the distinction entirely by rejecting the setup.

  6.  **Sortal-Dependence / Kind-Membership:**
      *   **Motivation:** What makes something a *statue* seems different from what makes something a *lump of clay*. They fall under different sortal concepts ('statue', 'lump') which govern their persistence conditions and essential properties (Case 4). A theory that reduces all objects to mere configurations of matter struggles to capture these differences.
      *   **Desideratum:** The theory must respect (or explain away) the **role of sortal concepts/kinds** in determining the identity, persistence conditions, and modal profile of objects. It must account for the fact that coincident objects often belong to different kinds.
      *   **Non-Negotiability:** Moderate. **Sortalists** see this as fundamental. **Anti-Sortalists** (often more radically reductionist or mereologically focused camps like some Universalists or Nihilists) aim to minimize or eliminate sortal dependence.

  **III. Logical & Metaphysical Constraints**

  7.  **Leibniz's Law / Indiscernibility of Identicals:**
      *   **Constraint:** If A = B, then for any property P, P(A) if and only if P(B). Identicals share *all* properties.
      *   **Motivation:** A fundamental law of logic/identity. Violating it seems incoherent. Cases 1 & 4 appear to violate it if Lumpl and Goliath are identical (they have different historical and modal properties).
      *   **Desideratum:** The theory **must be compatible with Leibniz's Law**. It must either:
          *   Show Lumpl and Goliath are *not* identical (Coincidentalism), OR
          *   Show they *don't actually* have different properties (e.g., by temporalizing properties - "was formed at T" isn't a property of the object-at-T; by relativizing properties to sortals; by denying the properties are genuine), OR
          *   Reject the setup that leads to the problem (Nihilism, Universalism with different mereology, Perdurantism).
      *   **Non-Negotiability:** Extremely High (near universal). Denying Leibniz's Law itself is seen as a last resort by most. Theories are judged on *how* they satisfy this constraint.

  8.  **Existence of Material Objects:**
      *   **Constraint:** There are material objects (non-vacuous domain for our theory).
      *   **Motivation:** Denying this (Eliminativism) is a radical solution but avoids all constitution problems by rejecting the subject matter. Most participants in the debate presuppose material objects exist.
      *   **Desideratum:** The theory **should affirm the existence of at least some ordinary material objects** (cats, statues, ships, lumps). (Nihilism challenges this).
      *   **Non-Negotiability:** Moderate-High for mainstream theories. **Nihilism** explicitly rejects this desideratum as misguided.

  9.  **Grounding / Non-Brutality:**
      *   **Constraint:** Facts about objects, their properties, and their persistence should not be metaphysically brute. There should be some basis (e.g., in microphysical facts, facts about parts and arrangements, laws, sortal concepts) that grounds or explains them.
      *   **Motivation:** Philosophical preference for explanation over mystery. If coincident objects have different modal properties, *what* grounds this difference if they share all physical parts and spatial location *at that time*?
      *   **Desideratum:** The theory should provide a plausible **grounding story** for the distinctness, persistence conditions, and modal profiles of objects (especially coincident ones).
      *   **Non-Negotiability:** Low-Moderate. A strong preference for many, but some theories (especially robust forms of Coincidentalism) might accept a degree of "modal" or "sortal" bruteness. **Reductionist** camps (some Universalists, Nihilists, Perdurantists) strongly emphasize grounding in mereological/particle facts.

  10. **Mereological Commitments (Composition):**
      *   **Constraint:** The theory must take a stance on when composition occurs: Under what conditions do some things compose a further thing?
      *   **Motivation:** Cases like Tibbles (undetached parts) and Theseus (gradual replacement) push on the boundaries of what counts as an object. Does every arbitrary collection of particles compose an object?
      *   **Desideratum:** The theory must be **compatible with a principled account of composition**, even if it doesn't explicitly provide one. Its solution to constitution puzzles shouldn't generate absurd mereological consequences.
      *   **Non-Negotiability:** Inevitable, but the *specific* commitment varies:
          *   **Universalism:** Composition always occurs (any particles compose an object). Non-negotiable.
          *   **Nihilism:** Composition never occurs (only simples exist). Non-negotiable.
          *   **Moderate Views (e.g., Brutal Composition, Vague Composition, Teleological):** Composition occurs sometimes, under specific conditions. Non-negotiable within their chosen framework.

  **The Core Tension & Joint Unsatisfiability**

  The fundamental conflict arises from trying to satisfy **Desiderata 1 (Distinctness - Statue/Lump)**, **4 (Different Historical/Modal Properties)**, **5 (Constitution ≠ Identity)**, and **7 (Leibniz's Law)** simultaneously with **9 (Grounding)**.

  1.  **The Problem:** Lumpl and Goliath are spatio-temporally coincident at T, made of the same particles. Yet:
      *   Lumpl existed before T (Goliath did not) - Different Historical Property.
      *   Lumpl could survive being squashed (Goliath could not) - Different Modal Property.
      *   Intuition: They are distinct (Constitution ≠ Identity).
  2.  **Leibniz's Law Challenge:** If A (Lumpl) and B (Goliath) are distinct, then there must be *some* property P such that P(A) and ~P(B) (or vice versa). The historical and modal properties seem to be such properties. *But*:
      *   At time T, what *intrinsic* property distinguishes them? They have the same parts, same shape, same location, same mass, same color, etc.
      *   If the distinguishing properties (origins, futures, modal profiles) are genuine properties of the objects *at T*, then Leibniz's Law requires distinctness. But **Grounding (Desideratum 9)** demands: *What*, at T, in the physical configuration or arrangement of parts, grounds Lumpl having the property "was created before T" and Goliath lacking it? *What* grounds Lumpl having the property "can survive squashing" and Goliath lacking it? The physical facts *at T* seem identical.
  3.  **The Tension:** Satisfying 1, 4, 5, and 7 seems to require **non-physical, sortal-dependent, or irreducibly modal/historical facts** to ground the differences between coincidents. This violates the grounding desideratum (9) for those who demand grounding in fundamental physical facts.
  4.  **The Escape Routes (Concessions):** Theories resolve this by sacrificing one or more desiderata:
      *   **Sacrifice 1/4/5 (Identity Theory):** Deny distinctness. Lumpl *is* Goliath. The differences are only apparent or linguistic. Concedes the strongest intuitions.
      *   **Sacrifice 4 (Property Denial):** Argue that historical/modal properties are not genuine properties of the object *at T* (e.g., temporal parts, Adverbialism). Challenges deep intuitions about object identity.
      *   **Sacrifice 5 (Collapse Distinction):** Argue constitution *is* a form of identity (usually rejected).
      *   **Sacrifice 7 (Deny/Modify LL):** Radically claim distinct objects *can* share all properties at a time (rejected by most).
      *   **Sacrifice 9 (Accept Bruteness):** Accept that the sortal-based or modal differences are fundamental and not grounded in physical facts at T (Robust Coincidentalism). Seen as mysterious by opponents.
      *   **Sacrifice the Setup (Avoid Coincidence):** Deny that there *are* two objects there (Nihilism - only particles; Existence Denial - no statues/lumps; Perdurantism - temporal parts prevent coincidence in the problematic sense; Universalism with mereological differences - the statue is the lump *plus* something else?). Often requires radical revision of common sense.

  **Summary of Negotiability:**

  *   **Non-Negotiable (for most):** Leibniz's Law (7), Existence of Material Objects (8) (though Nihilism rejects this), Compatibility with *some* account of composition (10).
  *   **Highly Constrained (failure risks inadequacy):** Handling Statue/Lump distinctness/appearance (1), Handling different Historical/Modal Properties (4), Compatibility with Leibniz's Law *in practice* (7) (how it's satisfied is crucial).
  *   **Camp-Dependent:**
      *   Distinction Constitution/Identity (5): Essential for Coincidentalism, rejected by Identity Theory.
      *   Sortal-Dependence (6): Essential for Sortalists, minimized by Reductionists/Anti-Sortalists.
      *   Grounding (9): Essential for Reductionists, potentially relaxed by Robust Coincidentalists/Anti-Reductionists.
      *   Mereological Commitment (10): Radically different between Universalism, Nihilism, and Moderates.

  The debate largely revolves around **which concessions** in the face of the Core Tension are least costly, most intuitive, or best grounded. This framework gives you the axes along which to evaluate any theory you encounter. Good luck diving into the literature!
