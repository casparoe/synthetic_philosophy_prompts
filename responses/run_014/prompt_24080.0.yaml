  | Prediction market used       | Markets efficiently aggregate dispersed knowledge (Hayekian); superior to deliberation for predictions.   | strict      | Deliberative democracy; technocratic expert models                              | Use expert panels, cost-benefit analysis, or public deliberation.           |
  | Sealed market                | Prevents herding and strategic manipulation; ensures independent judgment.                                | strict      | Transparent markets; deliberative models that use open information exchange     | Run the market openly, allowing real-time odds and public visibility.       |
  | 90% confidence bar           | Risk aversion; require high certainty before acting; probabilistic knowledge.                             | compatible  | Optimistic decision rules (act on low confidence); require absolute certainty   | Change the threshold (e.g., 80% or 51%) or allow council discretion in low-confidence cases. |
  | No-override                  | Binding deontological rule; distrust of political judgment; market outcome is final.                      | strict      | Representative democracy; council's deliberative judgment                       | Add an override mechanism (e.g., supermajority vote to override).           |
  | Market's internal model confidential | Outcome matters, not process; black-box decision-making to avoid manipulation. | strict      | Transparency and accountability; deliberative justification                    | Require disclosure of the model, data, and assumptions for public scrutiny. |

  Now, for the JSON object:

  - **tension_real (bool)**: True. There is a real tension between the consequentialist goal (maximize GDP) and the deontological mechanism (follow the market rule without exception). The mechanism blocks the council from using consequentialist reasoning at the moment of decision.
  - **internally_consistent (bool)**: False. The rule borrows from two incompatible frameworks: consequentialism (for the goal) and deontology (for the mechanism). It is not fully coherent under one framework because the mechanism is a rigid rule that forbids consequentialist assessment at the decision point.
  - **borrowed_frameworks (array of strings)**: ["consequentialism", "deontology", "epistemic market liberalism"] 
    - Note: The prediction market element is rooted in a specific epistemic view (Hayekian) that markets aggregate knowledge better than other methods.
  - **one_line (string)**: "The rule enforces a rigid market-based procedure to achieve consequentialist ends, creating a tension by prohibiting consequentialist assessment at the point of decision."

