prompt: |-
  Im a PhD student in political theory (institutional design side) and I keep circling back to a rule a city budget office I advise has actually drafted, and I cant get a clean read on what it's quietly assuming. The ordinance in a nutshell: for any infrastructure spend over $5M, the council commits in advance to fund whichever option a designated prediction market — sealed so nobody can see the odds until the vote, with a 90% confidence bar — predicts will maximize the city's GDP ten years out. The council is not allowed to override, even if they're convinced the market is wrong, and the market's internal model stays confidential. It's basically futarchy (the Hanson thing), but I want to treat it as an institutional practice and reverse-engineer the philosophy instead of just citing Hanson.

  What bugs me: the goal is straight-up consequentialist (pick the welfare-maximizing policy, GDP as the proxy), but the mechanism is deontological in a weird way — you're forbidden from acting on your own consequentialist judgment and have to trust a sealed number. We're doing a consequentialist end with a rule that blocks consequentialist reasoning at the exact decision point. Is that a real tension or am I misreading it?

  Work through what the practice presupposes, part by part, and give it to me as a table with these columns, in this order:
  - element — the specific piece of the rule (e.g. "GDP as the fixed metric," "sealed market," "no-override," "90% confidence bar," "money as the unit of betting")
  - commitment — the view of welfare / knowledge / rationality / democracy that element rests on
  - status — strict if the element only makes sense under that view, compatible if several views would license it
  - rival_ruled_out — a rival view the element quietly excludes
  - if_replaced — concretely, what changes in the ordinance if that view is dropped

  Then, after the table, a JSON object with exactly these fields:
  - tension_real (bool) — whether the consequentialist-goal / deontological-mechanism tension I flagged actually holds
  - internally_consistent (bool) — whether the rule coheres under one framework or is borrowing from two incompatible ones
  - borrowed_frameworks (array of strings) — the distinct frameworks the rule leans on
  - one_line (string) — the core of why, in one sentence
reasoning: |-
  We are going to break down the ordinance as described and analyze each element. The ordinance has several key components:

  1. **GDP as the fixed metric**: The goal is to maximize the city's GDP ten years out.
  2. **Prediction market used**: A designated prediction market is used to predict which option maximizes GDP.
  3. **Sealed market**: The market is sealed so that the odds are not visible until the vote.
  4. **90% confidence bar**: The prediction must meet a 90% confidence level (i.e., the market must be 90% confident in its prediction).
  5. **No-override**: The council cannot override the market's decision, even if they believe it is wrong.
  6. **Market's internal model confidential**: The reasoning or model used by the market remains secret.

  We are to create a table with the following columns for each element:
  - element
  - commitment (the view of welfare, knowledge, rationality, democracy that the element rests on)
  - status (strict if the element only makes sense under that view, compatible if several views would license it)
  - rival_ruled_out (a rival view the element quietly excludes)
  - if_replaced (concretely, what changes in the ordinance if that view is dropped)

  After the table, we will provide a JSON object with the specified fields.

  Let's analyze each element:

  ### 1. Element: GDP as the fixed metric
  - **Commitment**: This rests on a view of welfare that is strictly economic and measurable by GDP. It assumes that GDP is a sufficient proxy for overall welfare and that maximizing GDP will lead to the best outcomes. It also reflects a preference for an objective, quantifiable metric over subjective or multi-dimensional assessments.
  - **Status**: Strict under a narrow economic consequentialism that equates welfare with economic output. However, it is compatible with other views that prioritize measurable outcomes, but it strictly rules out non-economic or multi-dimensional welfare frameworks.
  - **Rival_ruled_out**: Capability approaches (like Sen's), which consider multiple dimensions of well-being (health, education, etc.), or subjective well-being measures (happiness, life satisfaction) are ruled out.
  - **If_replaced**: If we drop the GDP focus, we might replace GDP with a broader index (e.g., a well-being index) or allow multiple metrics. The ordinance would then require a prediction market for that new metric.

  ### 2. Element: Prediction market used
  - **Commitment**: This rests on the view that aggregated market predictions (as a form of collective intelligence) are superior to individual or deliberative decision-making for forecasting specific outcomes. It assumes that the "wisdom of crowds" effect, incentivized by money, produces accurate predictions. This is an epistemic commitment about how knowledge is generated and validated.
  - **Status**: Strict under an epistemic view that markets are efficient aggregators of dispersed knowledge (Hayekian). It is also compatible with a pragmatist view that uses whatever tool works best, but it strictly rules out views that reject market mechanisms for public decisions (e.g., deliberative democracy).
  - **Rival_ruled_out**: Deliberative democratic models, which emphasize reasoned discussion among equals, are ruled out. Also, technocratic models that rely on expert models rather than market mechanisms.
  - **If_replaced**: If we drop the prediction market, we might use expert panels, cost-benefit analysis, or public deliberation. The ordinance would then specify one of these alternative decision mechanisms.

  ### 3. Element: Sealed market
  - **Commitment**: This reflects a concern about strategic behavior and information cascades. By sealing the market, it prevents participants from being influenced by others' bets during the decision period. It assumes that revealing odds could distort the market's honesty and that sealing ensures independent judgments. This is a commitment to the purity of the market's information aggregation process.
  - **Status**: Strict under a view that fears herding and strategic manipulation in prediction markets. It is compatible with other views that worry about information distortion, but it strictly rules out transparent markets that believe in the corrective power of continuous revelation.
  - **Rival_ruled_out**: Transparent prediction markets (like most real-world ones) that allow participants to adjust based on current odds are ruled out. Also, deliberative models that thrive on open information exchange.
  - **If_replaced**: If we drop the sealing, the market would run openly, and the council might see the odds evolve. This could lead to lobbying or public pressure during the market's operation.

  ### 4. Element: 90% confidence bar
  - **Commitment**: This sets a threshold for decision-making, reflecting a risk-averse stance. It requires a high level of certainty (90%) before acting, which assumes that acting without such confidence is too risky. It also implies a probabilistic view of knowledge: we can have degrees of belief, but we need a high degree to commit.
  - **Status**: Compatible with several views (e.g., precautionary principle, statistical decision theory). However, it strictly rules out views that would act on lower confidence (e.g., a simple majority of the market) or require absolute certainty (which is impossible).
  - **Rival_ruled_out**: It rules out maximax strategies (optimistic) that would go with the best option even without high confidence, and also rules out requiring 100% certainty (which would paralyze decision-making).
  - **If_replaced**: Without the 90% bar, the ordinance might require a simple majority (e.g., 51%) or a different threshold. Alternatively, it might allow the council to decide when confidence is low.

  ### 5. Element: No-override
  - **Commitment**: This is a strong deontological element: the council must follow the market's prediction without exception. It reflects deep distrust in political judgment and a belief that the market's outcome is binding. It assumes that the market process is more reliable than political deliberation and that any override would undermine the system.
  - **Status**: Strict under a view that sees political judgment as inherently flawed (due to bias, short-termism, etc.) and the market as objective. It is compatible with a strong rule-consequentialist view that following the rule leads to better outcomes in the long run. It rules out any view that trusts democratic representatives to make final decisions.
  - **Rival_ruled_out**: Representative democracy models that grant elected officials the power to use their judgment are ruled out. Also, models that allow for checks and balances (e.g., council as a safeguard) are excluded.
  - **If_replaced**: If we drop the no-override rule, the council could override the market under exceptional circumstances (e.g., with a supermajority). The ordinance would then include an override mechanism.

  ### 6. Element: Market's internal model confidential
  - **Commitment**: This protects the proprietary or methodological integrity of the market and prevents second-guessing. It assumes that the market's output (the prediction) is what matters, not the reasoning, and that revealing the model could lead to manipulation or undermine trust in the system. It reflects a black-box view of decision-making: trust the output, not the process.
  - **Status**: Strict under a view that values outcomes over process transparency. It is compatible with a technocratic view that doesn't require public justification. It rules out transparency and accountability models that require public reason-giving.
  - **Rival_ruled_out**: Deliberative democratic views that demand public reasoning and accountability are ruled out. Also, open-source or transparent algorithm models are excluded.
  - **If_replaced**: If we require transparency, the market operator would have to disclose the model, data, and assumptions, allowing public scrutiny and debate.

  Now, we'll present the table:

