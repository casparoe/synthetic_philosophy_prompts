  ## The Split-Brain Crucible: Why Global Workspace Theory Forges a Phenomenal Claim

  Global Workspace Theory (GWT), championed by Baars and Dehaene, offers an elegant cognitive architecture for consciousness: information becomes conscious when it gains access to a "global workspace," enabling widespread broadcasting to specialized unconscious processors for integrated, flexible control. However, Ned Block's seminal distinction between *phenomenal consciousness* (P-consciousness – the raw, subjective "what it's like" quality of experience) and *access consciousness* (A-consciousness – the availability of information for reporting, reasoning, and action) presents a persistent challenge. Critics argue GWT, focused on information access and integration, explains only A-consciousness, leaving P-consciousness untouched. The split-brain condition, where the corpus callosum is severed, creating two largely independent hemispheres, becomes a decisive test case. While GWT proponents often frame their theory as purely functional, I argue that **the split-brain scenario forces GWT into making a substantive, non-reductive claim about P-consciousness: it entails the existence of two distinct phenomenal streams.**

  The standard GWT move is to identify consciousness *simpliciter* with global broadcast. Dehaene explicitly states that "conscious access is *constitutive* of conscious experience." Applied to the split-brain patient, the logic is straightforward: severing the corpus callosum disrupts the unified global workspace. Each hemisphere, possessing its own sensory inputs, motor outputs, and sufficient cortical infrastructure (including prefrontal and parietal areas central to Dehaene's "global neuronal workspace"), can independently sustain a functional global broadcasting system. The left hemisphere (typically language-dominant) can verbally report on right visual field stimuli and control the right hand, while the right hemisphere can non-verbally report (e.g., by pointing with the left hand) on left visual field stimuli. Crucially, under GWT, each hemisphere maintains its *own* integrated workspace capable of broadcasting information to its local array of processors for decision and action. If consciousness *is* global broadcast, the theory seemingly necessitates the existence of two conscious broadcasting systems – and thus, two subjects of experience.

  The counter-argument – the "one confused subject" interpretation – posits that despite fragmented access and conflicting responses, there remains a single, unified phenomenal subject who merely has bizarrely compartmentalized access to its own mental contents. This view seeks to preserve the intuition of subjective unity while accommodating the access dysfunction. However, **this interpretation is fundamentally incompatible with GWT's core identification of consciousness with broadcast availability.** GWT defines consciousness *by* the functional role of information being globally available for cognitive consumption. If "availability" is irreducibly split into two non-communicating domains – two separate sets of processors receiving two separate broadcasts – then the functional state constituting consciousness *is itself* split. To insist there is only one phenomenal subject *despite* this functional bifurcation is to decouple phenomenology from the very functional architecture GWT posits as its basis. It smuggles in an unexplained, non-functional phenomenal unity that the theory itself cannot account for.

  The "one subject" view essentially attempts to have it both ways: it leverages GWT's functional description of access to explain the *behavioral* disunity (conflicting reports, responses) but then invokes an extra-functional phenomenal unity to explain the presumed *subjective* oneness. This adheres to Block's critique that GWT only explains access, leaving phenomenology untouched. However, GWT's core claim is stronger: it asserts that achieving the functional state of global broadcast *just is* what constitutes phenomenal consciousness. The split-brain case exposes the implications of this identity claim. If global broadcast *is* phenomenality, then two independent broadcasts mean two independent phenomenal fields. To deny this is to abandon the identity claim and concede that phenomenology requires something *beyond* global access – something that persists as unified even when access is split. GWT, by its own foundational equation, cannot make this concession without collapsing its core thesis.

  Therefore, the split-brain patient compels GWT to take a stand on phenomenology. **By identifying consciousness with a specific functional state (global broadcast), and by that state being demonstrably duplicated in the split-brain, GWT is logically committed to the duplication of phenomenal consciousness.** This is not a quiet redefinition; it is the direct consequence of GWT's core metaphysical claim. The theory *does* say something substantive about P-consciousness: it grounds it in a particular kind of functional access architecture. The existence of two workspaces means two loci of that architecture, hence two centers of phenomenal experience. The "confusion" resides not in a single subject with fragmented awareness, but in the external observation of two subjects competing for control of a single body.

  **Verdict Confidence:** I am **highly confident** (85%) that GWT, as formulated by its primary proponents (especially Dehaene with his identity claim), is committed to two phenomenal streams in the split-brain case based on its core principles. The logic linking the duplicated functional state to duplicated phenomenology, given the identity claim, seems inescapable.

  **Least Confident Step:** The step I am least confident about is the **absolute rejection of any potential phenomenal unity despite functional disunity**. While I find the "one confused subject" view incompatible with GWT's identity claim, the deep philosophical question of whether subjective unity *could* somehow transcend the functional disunity in a way not captured by our current models or reports remains profoundly challenging. Perhaps future refinements of GWT (e.g., incorporating specific mechanisms for subjective perspective or self-representation that might remain unified post-split) could address this, but within the current framework, this seems an unsupported addition. My confidence rests on holding GWT strictly to its stated identity claim; if that claim is relaxed, the argument shifts significantly.
