  ### Scenario
  A county in California is voting on a bond measure to build a new high school. The true net benefit of the project depends on two factors: (1) predictable fiscal factors (e.g., construction costs, tax revenue) and (2) an unpredictable geological risk (e.g., unstable soil at the site). The expert analysis, produced by an impartial fiscal office, accurately assesses the predictable factors, estimating a net benefit of +$10 million with a standard error of $1 million. However, it explicitly states it cannot assess the geological risk due to a lack of site-specific surveys. The report is honest, unbiased, and includes this caveat.  

  Voters each receive a private signal (e.g., from local news or community discussions) about the geological risk. Without the expert report, voters rely solely on their private signals. With the report, voters combine it with their private signals using Bayesian updating. The true state is bad (net benefit = -$5 million) if the geological risk materializes (20% prior probability) and good (+$10 million) otherwise (80% prior). In the bad state, private signals are noisy but slightly informative: each voter has a 55% probability of receiving a signal indicating risk. In the good state, private signals are highly accurate (99.9% probability of a positive signal).  

  - **Without expert analysis**: Individual competence (probability of correct vote) averages 0.91 (0.55 in bad state × 0.2 + 0.999 in good state × 0.8).  
  - **With expert analysis**: Individual competence averages 0.80 (0.00 in bad state + 1.00 in good state), as the authoritative report overrides private signals in the bad state.  

  The Condorcet Jury Theorem (JCT) predicts near-perfect collective accuracy in both cases (since average competence >0.5). Yet, with the expert analysis, the majority always approves the bond, leading to a 20% error rate (failure in the bad state). Without it, the majority rejects the bond in the bad state (correct) and approves in the good state (correct), achieving 0% error.  

  ---

  ### Work Showing  
  1. **JCT prediction and its assumption**:  
     JCT predicts that improved individual competence (from 0.91 to 0.80) should maintain or enhance collective accuracy, as the theorem assumes **independent voter errors**. It leans on the premise that better-informed voters make errors independently, allowing the law of large numbers to correct mistakes.  

  2. **Actual outcome and independence leakage**:  
     The expert report creates **correlated errors** in the bad state. Voters rationally overweight the precise-seeming expert signal (+$10M) despite its caveat, ignoring their private risk signals. Thus, in the bad state, 100% vote "yes" (error), whereas without the report, only 45% vote "yes" (majority corrects). The leakage occurs because the shared report makes voters’ decisions conditionally independent *given the report* but **unconditionally dependent**—all voters are misled simultaneously when the report is uninformative on geology (bad state).  

  3. **Counterfactual and verification of superiority**:  
     Without the expert analysis, the majority rejects the bond in the bad state (correct, as true NPV = -$5M) and approves in the good state (correct, NPV = +$10M), yielding 0% error. With the analysis, approval in the bad state is incorrect. The "right answer" is defined by the true net benefit: approve if NPV > 0. Both runs are scored against this objective fact.  

  4. **Key feature and its removal**:  
     The load-bearing feature is the **shared point estimate** (+$10M) that dominates private signals. If replaced:  
     - **Disaggregated/local analysis**: If the report quantified geological risk at the precinct level (e.g., "risk probability: 15–25%"), voters would weight it less absolutely, restoring some independence. In the bad state, competence might rise to ~0.40 (not 0.00), improving collective accuracy.  
     - **Raw model publication**: If the office published the model’s uncertainty distribution (e.g., "NPV: +$10M, but 20% chance of -$5M"), voters could incorporate risk, raising bad-state competence to 0.80–1.00 (vote "no" if risk-adjusted NPV < 0).  

  5. **Critique and rebuttal**:  
     A transparency advocate might argue: "The expert analysis *did its job*; voters rationally trusted it over noisy private signals. The bad-state outcome is unavoidable, while the without-report ‘correct’ rejection was luck, not wisdom."  
     **Does it land? Partially.** The critique correctly notes that the expert report improved decision-making *in expectation* (e.g., voters acted on best *ex ante* information). However, it misses the core issue: the trade-off between **information gain** and **correlation cost**. The case shows that even with rational voters and perfect analysis, shared signals can amplify errors by correlating votes in states where the analysis is incomplete. The "luck" in the without-report scenario stems from retained error independence, which the JCT relies on.  

  ---

  ### Conclusion  
  This case demonstrates a trade-off: improving individual information can harm collective accuracy by introducing error correlation. It is not a critique of voters or experts but a mathematical caution about aggregating shared signals. The JCT’s independence assumption is fragile, and "more information → better aggregation" is a vibe, not a theorem, in regimes where information is public and incomplete. For epistemic democrats, the fix is not less transparency but smarter presentation (e.g., disaggregated or distributional data) to preserve independence.
