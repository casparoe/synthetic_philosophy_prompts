prompt: |-
  Been chewing on the epistemic-democracy stuff for years now — the Overcoming Bias / LessWrong lineage where somebody waves the Condorcet jury theorem at referendums and sortition and considers the argument closed. I want a case that actually stress-tests one load-bearing piece of it, and I want you to build the case, not describe the general issue.

  Here's the spec: design a referendum in which publishing a genuinely good, nonpartisan expert analysis of the measure makes the collective verdict *worse* than it would have been with no analysis at all — and worse in a way a naive JCT optimist would not have predicted, since the analysis makes every single voter strictly better informed than they were.

  Constraints, and these matter:

  - Realistic institution, ordinary stakes. A county or municipal bond measure in California (with the kind of impartial fiscal analysis the Legislative Analyst writes up for the ballot pamphlet), or a Swiss-style cantonal/federal vote where households get the booklet with the government's recommendation in it. School bond, transit levy, zoning change, that level. No sci-fi, no emergencies, no fictional agencies.
  - The expert analysis has to be honest and unbiased — correct in expectation, with an honest error bar attached, produced by a competent non-captured office. If you get your result by making the analysis wrong, slanted, or stale, the case is a dud, because then the obvious fix is just "write a better analysis" and nothing interesting happened.
  - The voters can't be dumb, lazy, or manipulated. No ads, no dark money, no misinformation, no elites herding anyone. Each voter reasons competently about the evidence in front of them and updates sensibly.
  - The deterioration has to come purely from what a *shared* signal does to the correlation structure of the electorate — not from anyone holding irrational beliefs, and not from turnout effects.
  - One paragraph for the scenario itself. Then give me rough numbers: estimated individual competence before publication and after, and what the theorem would say about the aggregate in each case.

  Then show your work:

  1. State what the straightforward JCT application predicts here and exactly which assumption it's leaning on to get there.
  2. Show what actually happens instead, and point at the precise spot where independence leaks out. I want to see *why* the same voters with strictly better private information produce a strictly worse collective verdict — the mechanism, not just an assertion that it does.
  3. Run the counterfactual: same electorate, no analysis published, better outcome. And tell me how you know it's better rather than just different — what's the fact of the matter about the right answer in your scenario that lets you score both runs.
  4. Name the single feature of the case doing the work, then say what happens to the verdict if I remove it — e.g. if the analysis gets disaggregated to the local level, or if only part of the electorate receives it, or if the office publishes the raw model instead of a point estimate.
  5. Finish with how a transparency advocate or an epistemic democrat would attack the case, and whether you think the attack lands.

  So you know what counts as cheating: I'm not trying to argue against voter information pamphlets, and I don't want a rant about how the public is too stupid for direct democracy. What I want to know is whether "more information → better aggregation" is a theorem-shaped claim or just a vibe, and whether there's a real regime where the information gain and the independence loss trade off against each other on ordinary inputs. A case that stipulates the bad outcome instead of generating it, or one where the voters are secretly sheep in disguise, doesn't do that job.
reasoning: |-
  We are designing a referendum scenario where publishing an honest, nonpartisan expert analysis makes the collective verdict worse. The key mechanism is that the expert analysis, while improving each voter's individual competence, introduces correlations in voter errors that violate the independence assumption of the Condorcet Jury Theorem (JCT). This correlation can cause the majority to be more likely to make an error than if each voter had relied solely on their own (less informed but independent) judgment.

  Scenario: A municipal bond measure for building a new school. The bond requires a 50% majority. The true state of the world is that the bond is a good idea (let's say state S=1) if the long-term benefits exceed the costs, and bad (S=0) otherwise. Without the expert analysis, each voter has some private information (e.g., from local news, personal experience, or general knowledge) that is independently drawn and has a certain accuracy.

  The expert analysis is a fiscal impact report that provides a point estimate of the net present value (NPV) of the bond project. The analysis is unbiased and correctly states that the project has a positive NPV (so it recommends approval) but with a known error distribution. However, the analysis does not capture a critical local factor that affects the project's viability: the stability of the ground at the proposed construction site. The expert analysis is based on regional data and does not account for this site-specific risk because the necessary geotechnical survey was not done (due to budget constraints). The absence of this survey is noted in the report, but the report's main conclusion is based on the available data.

  Individual voters, upon reading the report, update their beliefs. However, they all see the same report and thus the same point estimate. The report increases each voter's individual competence (probability of being correct) because it provides valuable information. But because the report misses the site-specific risk, it can lead to a systematic error that affects all voters in the same way.

  Moreover, the voters are aware of the possibility of site-specific risks (because the report mentions the lack of a geotechnical survey) and they also have private information about the local conditions. But the weight they give to the expert report versus their private information varies. Some voters might overweigh the expert report, while others might underweigh it. However, in this scenario, we assume that each voter updates correctly (i.e., using Bayes) but the problem is that the expert report is flawed in a way that is common to all.

  But note: the constraint says the analysis is honest and unbiased. We cannot make the analysis wrong. So we need a scenario where the analysis is correct in expectation but the realization in this particular case is misleading due to an unobserved factor. Moreover, the analysis must be nonpartisan and produced by a competent office.

  Alternative setup: The expert analysis provides a point estimate of the cost overrun risk. The analysis is based on historical data from similar projects and is correct on average. However, for this specific project, there is an unobserved factor (e.g., a rare but severe risk) that the analysis cannot capture because it is too project-specific. The report states the expected cost overrun and the variance, but the actual cost overrun distribution for this project has a heavy tail that is not captured by the model. The report is honest about the limitations.

  Now, without the report, voters rely on their own independent assessments of the project. Each voter has a private signal about the project's viability, which is independently drawn and has an accuracy of, say, 55% (so slightly better than chance). With the report, each voter's accuracy improves to, say, 65%. However, the report introduces a common error because it misses the heavy tail risk. In the actual state of the world, the project is bad (S=0) because of the heavy tail risk (e.g., there is a significant chance of a catastrophic cost overrun that makes the project net negative). The expert report, however, gives a positive point estimate because it doesn't account for the heavy tail.

  When the report is published, all voters update and become more confident that the project is good. But because the report is misleading in this particular case (due to the unobserved heavy tail), the voters are more likely to be wrong together. Without the report, the voters' errors are independent and the majority might have a good chance of being correct (by the JCT). With the report, the errors become correlated, and the majority can be wrong.

  Rough numbers:

  - Without the expert analysis: each voter has an independent signal with accuracy p0 = 0.55.
  - With the expert analysis: each voter's accuracy becomes p1 = 0.65, but the errors are now correlated because of the common signal.

  The JCT says that if the voters are independent and each has competence p>0.5, then as the number of voters increases, the probability of the majority being correct goes to 1. In the case without the report, we have independence and p0=0.55>0.5. With the report, we have higher individual competence (0.65) but the independence is violated.

  We need to show that the probability of the majority being correct is lower in the case with the report than without, even though each voter is more competent individually.

  We'll model the signals:

  Without report:
    Each voter i has a private signal X_i which is independent and P(X_i = S) = 0.55.

  With report:
    There is a common signal R which is the expert report. The report is such that:
      If S=1 (good project), then R=1 with high probability (say 0.9) and R=0 with 0.1.
      If S=0 (bad project), then R=1 (false positive) with probability 0.3 and R=0 with 0.7.
    But note: we want the expert report to be unbiased and correct in expectation. However, in this case, the false positive rate (0.3) is higher than the false negative rate (0.1) because the heavy tail risk is rare and not captured. But let's compute the overall accuracy of the report.

    Overall accuracy of the report:
      Assume prior P(S=1) = P(S=0) = 0.5 for simplicity.
      P(report correct) = P(R=1|S=1)P(S=1) + P(R=0|S=0)P(S=0) = (0.9)(0.5) + (0.7)(0.5) = 0.45 + 0.35 = 0.8.

    So the report is 80% accurate. But note that when S=0, the report is wrong 30% of the time (it says R=1). This is the case we are interested in: when S=0 and the report says R=1.

    Now, each voter, in addition to the common report, still has their own private signal X_i. The voter combines R and X_i to form a posterior. We assume voters are Bayesian and update correctly.

