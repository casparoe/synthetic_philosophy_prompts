      In state S=0, r is N(0,1.884). We are especially interested in when r is large (positive), because then f(r) might be small.

      For example, if r=0, then f(0) = Φ(3.98*0.2969) = Φ(1.18) ≈ 0.88.

      If r=1, then f(1) = Φ(3.98*(0.2969 - 0.5308)) = Φ(3.98*(-0.2339)) = Φ(-0.93) ≈ 0.18.

      So when r is large, f(r) is small.

      Let's compute the distribution.

      We can approximate the integral.

      The probability in state S=0 that the majority is correct is:

          ∫ P(Bin(n, f(r)) >= 501) * (1/sqrt(2π*1.884)) * exp(-r^2/(2*1.884)) dr

      This is computationally intensive, but we can use the fact that for values of r where f(r) is close to 0.65, the binomial probability is high, but when r is large, f(r) is small and the binomial probability of majority being correct is low.

      In particular, when f(r) < 0.5, then the expected number of correct votes is less than n/2, and the majority will be wrong with high probability.

      Let's find the critical r where f(r)=0.5.

          Φ(3.98*(0.2969 - 0.5308*r)) = 0.5
          -> 3.98*(0.2969 - 0.5308*r) = 0
          -> 0.2969 - 0.5308*r = 0
          -> r = 0.2969/0.5308 ≈ 0.559.

