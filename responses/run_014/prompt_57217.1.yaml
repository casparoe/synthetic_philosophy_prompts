    However, in the with-report case, if the expert reports 7 million, then the individual accuracy in the bad state is 0% (because they vote for when they should vote against), while without the report it is 55%. But is the expert analysis to blame? The voters are voting based on the best available information. In the bad state, the true NPV is -5, but the best available information says 7. So the voters are doing the best they can.

