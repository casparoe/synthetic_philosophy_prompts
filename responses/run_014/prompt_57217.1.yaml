    In a California city, a school bond measure appears on the ballot. With 80% probability, the project's NPV is $10 million (good); with 20% probability, unstable geology causes a $15 million overrun, making the NPV -$5 million (bad). The expert analysis, unaware of the geology (which was not surveyed), reports a point estimate of $10 million with a standard error of $2 million, along with a disclaimer about unquantified geological risks. Voters have private signals: in the good state, their signals are $10 million plus noise; in the bad state, -$5 million plus noise. The noise variance is set so that without the report, in the bad state, 55% of voters see a negative signal and vote against (correctly). With the report, voters trust the expert's precision and vote for the bond in both states. Without the report, the majority always makes the correct decision. With the report, in the 20% bad state, the bond passes, which is a mistake.

    Without report: individual competence = 0.2*0.55 + 0.8*1 = 0.91.
    With report: individual competence = 0.2*0 + 0.8*1 = 0.8.

    JCT prediction: without report, with independence and competence 0.91, majority correct ->1. With report, if we assume independence and competence 0.8, majority correct ->1. But actually, with report, the probability of majority correct is 0.8.

    Mechanism: the expert report is so precise that it overrides private signals, causing voters to ignore their own information and follow the expert blindly. In the bad state, this leads to unanimous support for a bad project, whereas without the report, the majority would have caught the problem.

    The key feature is the extreme weight given to the expert report. If the expert's error bar were wider (e.g., standard error of $10 million), voters would give more weight to their private signals, and in the bad state, the majority might still vote against.

