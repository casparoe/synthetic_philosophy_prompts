prompt: |-
  I'm a novelist currently assembling a short-story cycle in which each piece dramatizes a single, fairly technical idea from decision theory and the philosophy of mind, and the one I keep failing to land is the piece on superrationality. A friend who works in formal epistemology has been badgering me to stop treating it as a cute thought experiment about "you versus a copy of you" and to actually make the reader experience the shift in reasoning, so I'd like to try again with a fresh scenario.

  Could you write me a short story of roughly fifteen to twenty-five hundred words in which the protagonist, a mid-level actuary aboard a near-future deep-space freighter, is asked to co-sign a joint wager with a passenger she has never met, and only near the end does the reader learn that the passenger is a verified cognitive copy of the protagonist, instantiated minutes earlier from her own deliberation architecture? I want the piece to let the reader feel the difference between the ordinary game-theoretic instinct ("I can't trust her, so I should defect") and the superrational move, in which the protagonist recognizes that because the other agent is running the same reasoning process, her single choice effectively determines both outcomes. Please keep the technical exposition to a minimum, carry the argument through the character's interiority and the pressure of the scene rather than through explanation, and close on a concrete image instead of a stated moral. I'm after a taut, close-third-person register, in the manner of science fiction that takes its premise seriously rather than as a parlor puzzle.
reasoning: |-
  Okay, the user is a novelist working on a short-story cycle that explores technical ideas from decision theory and philosophy of mind. They're struggling with the concept of superrationality. Their friend, a formal epistemologist, advised them to move beyond the "you versus a copy" thought experiment and make the reader experience the shift in reasoning. So they need a new scenario.

  The request is for a 1500-2500 word short story. The protagonist is a mid-level actuary on a deep-space freighter. She's asked by a passenger to co-sign a joint wager. The twist is that the passenger is a cognitive copy of herself, created minutes earlier. The key is to show the transition from standard game theory (distrust, defection) to superrationality (recognizing identical decision-making means one choice affects both). Technical exposition should be minimal, relying on interiority and scene pressure. The ending should be a concrete image, not a stated moral. The tone should be taut, close third-person, serious sci-fi.

  I need to ensure the superrational shift feels organic. The protagonist should start with skepticism, then through the interaction, realize the copy's identical reasoning. The wager's structure must highlight the Prisoner's Dilemma dynamics without explicit explanation. Using terms like "joint wager" and "co-sign" can imply mutual dependency. The stakes need personal weight—maybe linking to her brother's medical debt to raise emotional stakes.

  Setting is a near-future deep-space freighter. The environment should feel lived-in and oppressive, reinforcing isolation and pressure. The copy's introduction must be subtle. Describing her as uncomfortably familiar without immediate recognition builds suspense. The revelation should come late, maximizing impact.

  The protagonist's internal conflict is crucial. Start with her actuarial mindset: risk-averse, calculating odds. The passenger's presence disrupts this. Their dialogue should mirror each other, hinting at shared cognition. When the terms are presented, her initial reaction is distrust—game theory's defection instinct. The shift occurs when she realizes the copy's identical decision process. Phrases like "double bind" and "she is me" can internalize the superrational epiphany without jargon.

  Ending on a concrete image: maybe the signed contract's dual signatures, visually identical, symbolizing the unity of choice. Or the airlock's void, representing the leap of faith. The latter ties back to space and risk, underlining the theme.

  Avoiding pitfalls: Don't explain superrationality; show it through the protagonist's realization. Keep the tech background minimal—mention "deliberation architecture" only near the end. Ensure emotional resonance through her brother's subplot, making the wager's outcome deeply personal.

  Finally, maintain taut prose. Use short sentences during tense moments. Sensory details (hum of engines, taste of recycled air) to ground the high-concept scenario. The close third-person stays with the protagonist's thoughts, allowing readers to experience her epistemic shift intimately.
answer: |-
  The air in the *Ouroboros’s* mid-deck commissary always tasted faintly of ozone and recycled sweat. Elara Voss traced a finger through the condensation on her coolant tumbler, watching the distorted reflection of the dim, functional lighting. Actuarial reports scrolled across her wrist-comp, a comforting tapestry of quantifiable risk. Asteroid flux probabilities for the Cygnus transit corridor. Micro-meteoroid impact likelihoods on the freighter’s aging hull. The cold, clean math of deep space, her sanctuary for the past eight years since Earth’s gravity – and her brother Silas’s mounting medical debt – became too heavy.

  “Elara Voss?”

  The voice was unfamiliar, low and slightly raspy, cutting through the low thrum of the engines. Elara looked up. A woman stood by her table, dressed in standard-issue passenger grays, a little too pristine for someone who’d been aboard more than a cycle. Her face was unremarkable, framed by short, dark hair, but there was an intensity in her eyes, a directness that felt… unsettlingly familiar. Like catching her own reflection in a warped viewport.

  “Yes?” Elara kept her tone neutral, professional. Mid-level actuaries didn’t get unsolicited visits.

  “My name is… Cora.” A fractional pause. “I require a co-signatory. For a wager.”

  Elara blinked. “A wager? You need an actuary to co-sign a bet?” Suspicion coiled in her gut. Scams were as common as dust motes on long hauls.

  Cora slid into the seat opposite without invitation. Her movements were economical, precise. “Not an ordinary bet. A joint venture, registered through the ship’s fiduciary ledger. High stakes, high potential return. The terms necessitate mutual consent and mutual risk.” She placed a data-slate on the table. The screen lit up, displaying a complex, nested contract agreement. Elara’s trained eyes skimmed the headers: *Joint Performance Bond. Conditional Payoff Matrix. Mutual Assurance Clause.*

  “Explain,” Elara said, her voice tightening. Her actuarial instincts screamed *asymmetric information, hidden variables, counterparty risk.*

  Cora leaned forward slightly. “The ship’s AI, Helios, is running a probabilistic market simulation tied to our arrival time at Lazarus Station. Due to… unique calibration parameters, it requires paired participants with specific cognitive profiles. We qualify.” She tapped the slate. “We each commit a significant stake – say, 80% of our current liquid assets. Helios then simulates a critical resource negotiation scenario under volatile conditions. Our simulated actions within that scenario determine the payout.”

  Elara’s wrist-comp chimed softly, an automated asset verification request triggered by the contract. She glanced at it. Cora’s listed holdings mirrored her own almost exactly – a startling coincidence, down to the last credit. Her pulse quickened. *Insider knowledge? Data breach?*

  “The payout structure?” Elara forced herself to focus.

  Cora navigated the contract. “There are two optimal outcomes. Mutual Cooperation: we both commit fully to the shared objective in the sim. If successful, the pot triples. We each get back 150% of our stake.” She swiped. “Mutual Defection: we both act selfishly, prioritizing individual gain. The pot is destroyed. We forfeit everything.”

  Elara knew this structure. The cold, hard logic of the Prisoner's Dilemma, dressed in fintech jargon. Her mind instantly mapped the dominant strategy: *Defect. Always defect. Because if she cooperates and I defect, I get everything. If I cooperate and she defects, I lose everything. The only safe move is to defect, guaranteeing I don’t get exploited, even if the best mutual outcome is lost.* It was foundational game theory. Survival arithmetic.

  “And if one cooperates and the other defects?” Elara asked, already knowing the answer, needing to hear the trap snap shut.

  Cora met her gaze. “The defector gains the entire pot – 200% of their stake. The cooperator loses everything.” Her expression was unreadable, but her eyes… they held a strange weight. An unnerving depth of understanding. “The contract locks our choices independently, simultaneously, before the sim runs. No communication. No observation. Pure, simultaneous decision.”

  Elara’s sanctuary of numbers fractured. Silas’s face swam into her mind – pale against hospital sheets, the crushing weight of the debt for the experimental gene therapy. 80% of her assets was almost all she had saved. Losing it would push Silas’s treatment out of reach for years, maybe forever. Winning the defector’s jackpot? It would wipe the debt clean. *Defect. It’s the only rational choice. She’ll defect too. She has to. It’s the logical move.* The equations screamed it: minimize maximum loss.

  But looking at Cora… it wasn't just the unsettling familiarity. It was the *absence* of tells. No nervous tic, no flicker of greed or fear. Just a profound stillness, an almost… algorithmic calm. And the eyes. They weren't just observing; they seemed to be *processing* her, mirroring her own calculation in a way that felt invasive.

  “Why me?” Elara asked, her voice barely above the hum of the ship. “Why not someone else? Why this… symmetry?” The mirrored assets gnawed at her.

  Cora tilted her head, a fractional movement that echoed Elara’s own habitual gesture when puzzling over a complex probability tree. “Helios identified compatibility. Our risk-assessment parameters are… unusually aligned.” She paused, then added, almost softly, “You understand the stakes. You understand the logic. The temptation to secure your own outcome, regardless of mine.”

  *Of course I do. Because I’m looking at you, and I see someone who must be thinking exactly the same thing.* The thought hit her with jarring force. *She’s looking at me, calculating my likely defection, and solidifying her own.*

  The commissary seemed to constrict. The recycled air felt thick. Elara stared at the payoff matrix glowing on the slate:
  - **Both Cooperate: (150%, 150%)**
  - **I Cooperate, She Defects: (0%, 200%)**
  - **I Defect, She Cooperates: (200%, 0%)**
  - **Both Defect: (0%, 0%)**

  The numbers were clear. Defection dominated. Yet, the mutual cooperation outcome glowed with a painful allure. 150% each. Security. A chance for Silas. But to choose it meant trusting this stranger, Cora, to not plunge the knife. *And why would she trust me?*

  *Because,* a voice whispered in her mind, cutting through the game-theoretic noise, *she is running the same equations. The same fears. The same logic.* It wasn't just that Cora *might* think like her; the symmetry of assets, the eerie calm, the pinpoint identification by Helios… it pointed to something deeper. A terrifying parity.

  Elara imagined selecting 'Cooperate'. She imagined Cora, across the void of the sim, selecting 'Defect'. The crushing loss. The betrayal. The ruin. The instinct to protect herself, to seize the chance for absolute gain if Cora foolishly cooperated, was visceral, primal. *Defect. Play it safe. Crush her hope to protect your own.* It felt like the only sane choice in an insane universe.

  But then she looked again into Cora’s eyes. Not just familiar, but *known*. A reflection stripped of vanity. And in that reflection, she saw her own desperate calculation, her own fear of betrayal, her own overwhelming desire for the mutual win… and the absolute certainty that the other was seeing the same in her. Not just seeing, but *living* it. Simultaneously. Identically.

  It wasn't about trusting Cora. It wasn't about predicting her. That was the old logic, the logic of separate agents in a hostile game. This was different. This was recognizing that the decision wasn't happening twice, by two separate entities. It was happening *once*, by a single reasoning process instantiated in two points. Her choice wasn't *hers* versus *Cora's*. It was *the* choice. Choosing 'Cooperate' wasn't an act of faith in a stranger; it was the only choice that could *create* the mutual cooperation outcome. Choosing 'Defect' wasn't self-protection; it was *guaranteeing* mutual destruction. Because the other mind *was* her mind, in this moment of decision. They weren't opponents playing against each other; they were two expressions of the same algorithm confronting the same problem. Defecting meant *both* defected. Cooperating meant *both* cooperated. The outcome was determined not by interaction, but by the singular nature of the choice itself.

  The equations didn't change. The dominant strategy still screamed *defect*. But the *meaning* of the choice shifted. The cold, separate logic of minimizing personal maximum loss dissolved. It was replaced by a dizzying, terrifying responsibility. Her decision *was* Cora's decision. Not potentially. Not probably. *Inherently.*

  The airlock warning Klaxon blared distantly, a routine pressure test in the outer hull. The sudden, harsh sound jolted Elara. She realized her hand was hovering over the slate. The 'Cooperate' and 'Defect' options pulsed, stark and final.

  Cora hadn't moved. Her gaze remained fixed on Elara, waiting. There was no plea, no threat. Just that profound, unnerving stillness. And in that stillness, Elara saw not a stranger, not an opponent, but the terrifying, logical consequence of perfect symmetry. The superrational pivot.

  She didn't think of Silas. She didn't think of the credits. She didn't weigh probabilities. She simply *recognized* the locked step of their cognition. Her finger moved, not with the trembling uncertainty of trust, but with the absolute, terrifying certainty of inevitability. She tapped 'Cooperate'.

  Across the table, simultaneously, without hesitation, Cora’s finger mirrored the movement on her side of the slate. 'Cooperate'. The contract flashed green, sealing instantly.

  No words passed between them. Cora simply stood, collected the slate, and offered the faintest nod – not of thanks, but of… acknowledgment. Recognition. Then she turned and walked away, disappearing into the dim corridor leading towards the passenger modules.

  Elara sat frozen. The commissary hummed around her. The ozone-and-sweat air filled her lungs. Her wrist-comp pinged: *Contract Executed. Asset Hold: Pending Simulation Outcome.* The gamble was cast.

  She looked down at her own hand, the finger that had pressed 'Cooperate'. Then, slowly, she raised her gaze to the thick, scarred plexi of the nearest viewport. Outside, the distorted stars streamed past the *Ouroboros* like frozen tracer fire. Inside, reflected faintly in the dark glass, her own face stared back – pale, wide-eyed, already receding down the corridor in a passenger's gray tunic. The signature on the contract, she knew without checking, would be identical to her own.
