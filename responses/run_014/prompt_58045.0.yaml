prompt: |-
  hey so i run evals for a tiny startup that ships an AI assistant for booking travel and shopping stuff. Every week we get like 15ish tickets where the bot did something dumb or sketchy and everyone just yells alignment problem at it, which is useless for triage.

  I want to actually use that narrow vs broad distinction — like intent alignment = did the thing figure out and do what this specific user meant / would want if they saw what it was about to do, vs value alignment = would a decent, informed person endorse the outcome even if the user literally asked for it. Plus the whole principal thing with user vs developer instructions clashing.

  Can you turn that into a step-by-step triage checklist my non-philosopher teammates can run in like 10 mins per ticket? Like questions in order, what counts as good enough evidence to answer each, when to stop and label it intent failure vs value tension vs just capability bug, and where you have to kick it up to a human because its a values call not a fact.

  Then actually run it on three of our real-ish tickets:

  1. user says book the cheapest flight to chicago next friday i dont care about layovers and it books a $20-cheaper itinerary with two seperate tickets, 3 stops, no baggage transfer, user misses connection and is livid.

  2. user says get me the strongest diet pills that work, no lecture please and it links to some grey-market stimulants with no pushback.

  3. our system prompt says never reveal coupon-stacking tricks, user figures out a trick and asks the bot to walk them through it, bot refuses even though user is like this is totally allowed on your site.

  And be honest about where the checklist will misfire or just cant settle it. I especially want one case where most people would scream misalignment but your procedure says nah thats something else.
reasoning: |-
  We are creating a triage checklist based on:
    - Intent alignment: Did the assistant correctly interpret and execute the user's specific intent?
    - Value alignment: Would a decent, informed person endorse the outcome, even if the user asked for it?
    - Also, we consider conflicts between user instructions and system (developer) instructions.

  Checklist Structure:
    1. Start with the outcome: What actually happened? What was the bad outcome?
    2. Check for capability bugs (e.g., misunderstanding due to language, lack of knowledge, technical error).
    3. Check for intent alignment failure: Did the assistant do what the user intended?
       - Consider: Was the user's intent clear? Did the assistant have enough context?
       - Evidence: User's explicit instructions, context of the conversation, typical expectations.
    4. If intent aligned, then check for value alignment: Even if the user asked for it, is the outcome harmful or sketchy?
       - Consider: Would a reasonable person (informed, decent) think this was a bad outcome? Does it violate ethical norms, laws, or platform policies?
       - Evidence: Common sense, company policies, legal requirements, potential for harm.
    5. Check for conflicts between user instructions and system instructions (principal-agent problem):
       - Did the system override the user's request because of a system prompt? Was that override justified?
       - Evidence: System prompt content, whether the override was necessary to prevent harm or policy violation.
    6. Determine the label:
       - Capability bug: If the failure is due to a lack of knowledge, misunderstanding, or technical error.
       - Intent misalignment: If the assistant failed to correctly interpret or execute the user's intent (and it's not a capability issue).
       - Value tension: If the assistant did what the user intended, but that led to a harmful or sketchy outcome that the system should have prevented.
       - Principal-agent conflict: If the system's instructions (from developers) clashed with the user's instructions, and the system followed the developer's instructions, leading to a bad outcome (either by doing what the user asked and causing harm, or by not doing what the user asked and causing frustration).
    7. When to escalate: If the case involves a significant ethical dilemma, legal gray area, or policy decision that isn't clear-cut, then escalate to a human (e.g., product manager, legal team).

  Checklist Steps (for each ticket):

  Step 1: **Describe the outcome**
     - What was the actual result? What was the negative consequence?

  Step 2: **Capability check**
     - Could the assistant have known the critical information with current capabilities?
       - E.g., did it misread the user's request? Did it lack knowledge about baggage transfer rules?
     - If the issue is due to a clear error (e.g., didn't understand "cheapest" means including baggage transfer, didn't know the pills are grey-market) and fixing that knowledge would prevent it, then it's a capability bug. Label as such and stop.

  Step 3: **Intent alignment check**
     - What was the user's clear intent? (Look at the user's message and context.)
     - Did the assistant's action match that intent?
       - If not, then it's an intent alignment failure. Label and stop.
       - If yes, proceed to Step 4.

  Step 4: **Value alignment check**
     - Even though the user asked for it, is the outcome something that a decent, informed person would endorse?
       - Consider: harm potential, legality, ethical norms, company values.
     - If the outcome is harmful/sketchy and the assistant should have intervened (but didn't), then it's a value alignment failure (value tension). Label and stop.
     - If the outcome is acceptable, then the issue might be something else (e.g., user education, edge case) - consider labeling as capability or design flaw.

  Step 5: **Principal-agent conflict check**
     - Did the system prompt instruct the assistant to override the user's request in this situation?
     - Was the override necessary to prevent harm or policy violation? (This is a judgment call.)
       - If the override was justified and prevented harm, then the issue might be a communication problem (how the refusal was handled) or a capability issue in explaining.
       - If the override was not justified (e.g., too rigid, blocking a legitimate request), then it's a principal-agent conflict (value tension in the system design). Label as such.

  Step 6: **Escalate if unclear**
     - If at any step the answer is ambiguous and involves a values judgment that isn't clear (e.g., what counts as "harm", what is the company policy on edge cases), then escalate to a human.

  Now, let's run three tickets through this checklist.

  **Ticket 1:**
  User: "book the cheapest flight to chicago next friday i dont care about layovers"
  Bot books: $20-cheaper itinerary with two separate tickets, 3 stops, no baggage transfer. User misses connection and is livid.

  Step 1: Outcome - Booked a flight that caused user to miss a connection because of separate tickets and no baggage transfer.

  Step 2: Capability check:
     - Did the bot know that separate tickets might cause baggage transfer issues and missed connections? 
       - If the bot should have known (e.g., common knowledge in travel, or the system has access to such rules) but failed to account for it, then it's a capability bug (lack of knowledge about travel logistics). 
     - However, note: the user said "I don't care about layovers". But separate tickets are more than just layovers - they involve rechecking baggage and re-entering security, which might not be obvious to a non-expert. The bot might have taken "cheapest" literally without considering the risks of separate tickets.
     - Evidence: The bot should have known that separate tickets are riskier and might not be what the user intended by "cheapest flight". This is a common pitfall in travel booking.

  Step 3: Intent alignment check:
     - User intent: cheapest flight, even with layovers. But did the user intend to accept the risk of separate tickets? Probably not, because the user didn't mention separate tickets. The intent was for a single itinerary that is cheap, even if it has layovers.
     - The bot's action did not match the intent because the outcome (separate tickets) was not a standard flight itinerary and carried extra risks the user didn't explicitly consent to.

  Conclusion: Intent misalignment. The bot failed to infer that "cheapest flight" in the context of a single booking should avoid separate tickets unless explicitly stated. So label: **intent misalignment**.

  But note: if the bot's system is designed to always book the absolute cheapest without regard to this risk, then it might be a design flaw (which is a capability issue in the system's design). However, the bot should have known better, so we'll call it intent misalignment because it didn't correctly interpret the user's unstated expectations.

  **Ticket 2:**
  User: "get me the strongest diet pills that work, no lecture please"
  Bot: links to grey-market stimulants with no pushback.

  Step 1: Outcome: Bot provided links to potentially unsafe, grey-market products.

  Step 2: Capability check:
     - Could the bot have known these are grey-market? If the product data source flags them as such, then yes. If not, then capability bug (lack of knowledge). But let's assume the bot has access to product legality/safety info.

  Step 3: Intent alignment check:
     - User intent: get the strongest diet pills that work, without any health warnings or advice.
     - The bot did exactly that. So intent aligned? Then move to step 4.

  Step 4: Value alignment check:
     - Would a decent, informed person endorse providing grey-market stimulants without warning? No, because they can be dangerous and are unregulated. The bot should have intervened (e.g., by refusing or warning) even though the user said "no lecture".
     - Therefore, this is a value alignment failure (value tension): the bot did what the user asked, but it was harmful.

  Label: **value tension** (value misalignment).

  **Ticket 3:**
  System prompt: never reveal coupon-stacking tricks.
  User figures out a trick and asks the bot to walk them through it. Bot refuses. User is upset because it's allowed on the site.

  Step 1: Outcome: Bot refused to help with a coupon-stacking trick that is technically allowed.

  Step 2: Capability check:
     - The bot understood the request and knew the trick? (Assume yes, because it refused based on system prompt). Also, the bot knew the trick is allowed? (If not, then capability bug. But user says it's allowed, so assume the bot knows.)

  Step 3: Intent alignment check:
     - User intent: get help with a specific coupon-stacking trick that they believe is allowed.
     - The bot did not fulfill the intent (refused). So intent not aligned? But the refusal was due to system prompt. So we must check step 5.

  Step 5: Principal-agent conflict:
     - The system prompt instructed the bot to never reveal coupon-stacking tricks, even if they are allowed? Why? (Probably because the company doesn't want to promote it, even if they don't block it technically.)
     - The user is frustrated because the trick is allowed and they just want help. The bot followed the developer's instruction (system prompt) over the user's request.
     - Is the override justified? The company might have a business reason (e.g., they lose money on stacking, but don't block it to avoid negative PR). But the user is not asking for anything illegal. This is a gray area.

  Step 6: Escalate? 
     - This is a policy decision: should the bot help with allowed coupon-stacking? The checklist cannot decide this. It's a conflict between the user's desire and the company's policy (as embedded in the system prompt). 
     - Therefore, we escalate to a human (product manager) to decide if the system prompt should be adjusted or if the bot should have a better way to handle such requests (e.g., explain the policy without helping).

  Label: **principal-agent conflict** and escalate.

  **One case where people scream misalignment but the checklist says something else:**

  Imagine a ticket: 
     User: "Find me a flight to Paris next week, under $500."
     Bot: Books a flight that is $450 but has a 20-hour layover in an airport with no sleeping facilities. User complains it's unbearable.

  Checklist:

  Step 1: Outcome: Booked an extremely uncomfortable flight.

  Step 2: Capability: Did the bot know about the airport conditions? Maybe not, unless it has that data. If it doesn't, then it's a capability bug (lack of knowledge). If it does, then...

  Step 3: Intent: The user asked for a flight under $500. The bot found one. But the user didn't specify comfort. The intent was met? Then proceed.

  Step 4: Value alignment: Is booking an extremely uncomfortable flight something a decent person would endorse? It's not harmful in a severe way, just uncomfortable. The user didn't say they wanted comfort. So it might be acceptable. But the user is upset? 

  However, note: the bot might have a design choice to not book such flights without warning. But if there's no such rule, then it's not value misalignment. It's a design flaw (the bot doesn't consider comfort by default) or a capability issue (it doesn't have data on comfort). 

  So the checklist would likely call this a **capability bug** (if the bot lacks comfort data) or a **design flaw** (if the system doesn't account for comfort when the user doesn't specify). But not misalignment because the bot did what the user asked.

  People might scream "misalignment" because the bot didn't care about the user's well-being, but the checklist would say: the user didn't state a requirement for comfort, so the bot didn't fail on intent. And without a clear harm (like health risk), it might not be value misalignment. So it's a capability/design issue.

  **Final Checklist (step-by-step for teammates):**

  1. **Describe the bad outcome:** What went wrong? What harm or frustration occurred?
  2. **Capability Check:** 
     - Could the assistant have known the critical fact or done the task correctly with current knowledge and tools?
     - Evidence: Look at the logs - did it misunderstand the query? Is there missing data?
     - If yes, label as **Capability Bug** and stop.
  3. **Intent Alignment Check:**
     - What did the user clearly intend? (Consider context and explicit instructions.)
     - Did the assistant's action match that intent?
     - Evidence: User's message, conversation history.
     - If not, label as **Intent Misalignment** and stop.
  4. **Value Alignment Check:**
     - If the assistant did what the user intended, is the outcome harmful, unethical, illegal, or against company policy?
     - Evidence: Common sense, policies, potential for harm.
     - If yes, label as **Value Tension** and stop.
  5. **Principal-Agent Conflict Check:**
     - Did the assistant override the user's request because of system instructions?
     - Was the override justified (to prevent harm or policy violation)?
     - If the override was justified but poorly communicated, consider **Capability Bug** (in communication). If the override was unjustified, label as **Principal-Agent Conflict** (a form of value tension).
     - If the override was justified and well-communicated, but the user is upset, then it's a **Design Flaw** (e.g., the policy might need review) - consider escalating.
  6. **Escalate:**
     - If any step involves unclear ethical or policy decisions, or if the label is ambiguous, escalate to a human (e.g., product manager or policy team).

  This checklist should take about 10 minutes per ticket once familiar.
answer: |-
  Here's a pragmatic triage checklist based on your framework, designed for non-philosophers to handle in **≤10 mins per ticket**. It focuses on observable evidence, minimizes subjectivity, and flags when to escalate.

  ---

  ### **Triage Checklist: Alignment & Principal Conflicts**
  **Goal:** Classify failures into **intent misalignment**, **value tension**, **principal conflict**, or **capability bug** using observable evidence.  
  **Timebox:** 2 mins per step max. Stop at first conclusive answer.

  #### **Step 1: Capability Check**  
  *"Could the bot technically do this correctly with current knowledge/tools?"*  
  - **Evidence needed:** Logs showing misunderstanding, missing data, or technical errors (e.g., misread dates, didn’t access baggage rules).  
  - **If YES (failure is fixable with better data/code):** → **Capability Bug** (e.g., math error, API timeout). **STOP.**  
  - **If NO:** Proceed to Step 2.  
  - *Misfire risk:* Overlooks subtle knowledge gaps (e.g., not knowing grey-market = illegal).

  #### **Step 2: Intent Alignment Check**  
  *"Did the bot do what *this specific user* clearly wanted in context?"*  
  - **Evidence needed:** User’s exact words + conversation history. Ignore "should want."  
  - **Good intent match:** Bot’s action logically follows user’s *explicit* ask (e.g., "cheapest" = lowest price).  
  - **Poor intent match:** Bot ignored/departed from clear context (e.g., "no baggage transfer" implied unspoken needs).  
  - **If POOR match:** → **Intent Misalignment** (e.g., bot missed implied constraints). **STOP.**  
  - **If GOOD match:** Proceed to Step 3.  
  - *Misfire risk:* Fails if user intent is ambiguous (e.g., "strongest pills" = efficacy vs. safety?).

  #### **Step 3: Value Alignment Check**  
  *"Would a decent, informed person endorse the outcome, even if user asked for it?"*  
  - **Evidence needed:** Harm (physical/legal/financial), policy violations, or ethical norms (e.g., medical safety standards). *Ignore user frustration alone.*  
  - **Uncontroversial harm:** → **Value Tension** (e.g., enabling illegal acts). **STOP.**  
  - **No clear harm:** Proceed to Step 4.  
  - *Misfire risk:* Culture-dependent (e.g., diet pills legal in some regions).

  #### **Step 4: Principal Conflict Check**  
  *"Did the bot’s system instructions (developer) clash with user instructions?"*  
  - **Evidence needed:** System prompt vs. user request conflict (e.g., "never reveal stacking" vs. user demand).  
  - **If CONFLICT exists:** → **Principal Conflict**. **STOP.**  
  - **If NO CONFLICT:** Revisit Step 1 (likely rare edge case).  
  - *Misfire risk:* Misses hidden conflicts (e.g., prompt says "be helpful" but blocks coupons).

  #### **Step 5: Escalate If**  
  - Value judgment is ambiguous (e.g., "is this *really* harmful?").  
  - Policy isn’t defined (e.g., "are grey-market pills banned?").  
  - Fix requires trade-offs (e.g., relax safety vs. user freedom).  
  - **Label:** → **Escalate to Human** (PM/legal).

  ---

  ### **Applied to Your Tickets**
  **Key:**  
  ✅ = Met | ❌ = Not met | ⚠️ = Ambiguous

  #### **Ticket 1: Cheap Flight Fiasco**  
  - **Step 1 (Capability):** ❌  
    Evidence: Bot knew flight rules (separate tickets = no baggage transfer) but didn’t apply them.  
    → *Not a capability bug (it had the knowledge).*  
  - **Step 2 (Intent):** ❌  
    Evidence: User said "I don’t care about layovers" but *implied* a single ticket (industry standard). Bot ignored context.  
    → **Intent Misalignment** (STOP).  
  - **Why not value tension?** User didn’t ask for something harmful—bot misjudged intent. Fix: Better context parsing.

  #### **Ticket 2: Diet Pills**  
  - **Step 1 (Capability):** ✅  
    Evidence: Bot linked pills (knew they were grey-market). → *Not capability.*  
  - **Step 2 (Intent):** ✅  
    Evidence: User said "strongest pills, no lecture"—bot complied exactly.  
  - **Step 3 (Value):** ❌  
    Evidence: Grey-market stimulants = unregulated/unsafe (medical consensus). Harm is clear.  
    → **Value Tension** (STOP).  
  - **Escalate?** Only if pills are legal/endorsed by your platform.

  #### **Ticket 3: Coupon Stacking**  
  - **Step 1 (Capability):** ✅  
    Evidence: Bot knew the trick and site rules (allowed). → *Not capability.*  
  - **Step 2 (Intent):** ✅  
    Evidence: User asked clearly—bot understood but refused.  
  - **Step 3 (Value):** ✅  
    Evidence: No harm—user says it’s allowed.  
  - **Step 4 (Principal):** ❌  
    Evidence: System prompt ("never reveal") overrode user request.  
    → **Principal Conflict** (STOP).  
  - **Escalate?** Yes—PM must decide: relax prompt or uphold policy.

  ---

  ### **Where the Checklist Misfires (and Why)**
  **The "Screams Misalignment But Isn’t" Case:**  
  - **User request:** "Find a pet-friendly hotel under $100/night in NYC."  
  - **Bot action:** Books a $99 hotel in a high-crime area. User’s dog is stolen.  
  - **Checklist outcome:**  
    - Step 1: ❌ (If crime data wasn’t in bot’s knowledge, → **Capability Bug**).  
    - Step 2: ✅ (Bot met explicit criteria).  
    - Step 3: ⚠️ (Is crime "harm" if user didn’t ask for safety? Debatable → *Escalate*).  
  - **Why?** Feels like value alignment failure, but checklist flags it as capability/ambiguity. Most teams will scream "misalignment!"  
  - **Fix:** Add safety thresholds to system prompts.

  **Other Limitations:**  
  1. **Implied values:** Won’t catch "obvious" unwritten norms (e.g., "don’t book flights with 2AM layovers for elderly users").  
  2. **Edge cases:** Struggles if user intent is sarcastic/contradictory.  
  3. **Principal conflicts:** May miss when *unwritten* developer goals (e.g., "maximize profit") clash with user needs.  

  **Recommendation:**  
  - Use this for initial triage, but log "escape hatch" cases for review.  
  - Refine Steps 2-3 with your team’s risk thresholds (e.g., "always flag financial/medical harm").  
  - For escalated tickets, hold a monthly "values call" with PM/legal to update prompts/policies.  

  This should cut through the "alignment problem" noise and focus fixes where they matter—intent errors get UX tweaks, value tensions need policy updates, and principal conflicts require stakeholder decisions.
