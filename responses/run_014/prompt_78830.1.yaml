answer: |-
  ## The Seminar Closes on Qualia and Coffee

  The seminar drags on. The coffee’s taste—
  once bright, now somehow damaged? Chase claims **changed**.
  But Sanborn shrugs: “It’s still exactly **same**!
  *My* tongue’s the traitor.” How to parse this air,
  this claimed assault upon the **private** core?
  Is ‘taste itself’ a relic, **ineffable**?

  Professor, what’s the point? This **ineffable**
  insistence—Chase’s ‘taste’ now deeply **changed**,
  Sanborn’s insistence it remains the **same**—
  it founders on the reef of the **private**.
  No probe can breach that sanctum, dark and **intrinsic**.
  No witness stands. Just this: the **immediate**.

  But what arrives, so fiercely **immediate**?
  If not the ‘what-it’s-like’, that **ineffable**?
  Its claim to be uniquely **intrinsic**
  collapses if the palate can be **changed**
  while ‘taste’ stays fixed? Or if the **private**
  sense insists the stimulus is **same**?

  Chase *feels* the difference: it’s not the **same**!
  His gut insists, reports **immediate**:
  “The flavour’s wrecked!” Within his **private**
  theatre, certainty, though **ineffable**.
  But Sanborn counters, just as **changed**
  in verdict: “*I* recoil, the **intrinsic**

  remains untouched.” So—can the **intrinsic**
  even *be* referenced? Is it **same**
  if minds diverge on what has **changed**?
  This knowledge, hailed as **immediate**,
  dissolves like steam. The **ineffable**
  retreats behind its **private**

  rampart. Locked within the **private**,
  denying access to the **intrinsic**,
  shrouded in the purely **ineffable**—
  how can we say if something stays the **same**?
  The given seems so starkly **immediate**,
  yet here we stand, two subjects, **changed**.

  Oh, weary lexicon! Each word is **changed**
  by grinding use. This **private**,
  claimed **immediate**,
  this **intrinsic** ghost, this **ineffable**—
  did *anything* remain the **same**
  except the argument? The terms feel **changed**.

  Professor, the **immediate** is fractured, **private**.
  The **intrinsic**? Lost. The **ineffable** remains—a silence.
  Nothing **same**. Everything **changed**.

  ---

  **Note on Philosophical Liberties:**

  *   **"Immediate" for "Directly Apprehended":** The poem treats "immediate" as synonymous with "directly apprehended in consciousness," a core mark of qualia. This is standard in the literature, though some might quibble about nuances.
  *   **Sharpening the Incoherence Charge:** The poem leans into the skeptical reading where the combination of privacy, ineffability, and intrinsicness makes any stable reference to "the taste itself" impossible, especially when responses diverge (Chase vs. Sanborn). It presents this as a near-paralysis ("How can we say...?"). This is a contested *conclusion* drawn *from* the case; some philosophers would defend robust qualia despite the puzzle.
  *   **The Collapse of Adjudication:** The poem emphasizes the failure of the core qualia vocabulary ("same," "changed," "private," "immediate") to resolve the Chase/Sanborn dispute, suggesting the terms themselves become unstable under the pressure of the case. This highlights the skeptical worry: if these concepts can't do their job *here*, where *could* they work?
  *   **"Intrinsic" as Ownership/Non-Relational:** The poem uses "intrinsic" primarily in the sense of "owned by the experience itself," non-relational, and non-functional – another standard qualia mark pressed hard by the case. It doesn't delve into other potential meanings.
  *   **"The Terms Feel Changed":** The envoi suggests the philosophical words themselves lose their stable meaning through overuse in this unresolvable debate, mirroring the instability they were meant to describe. This is poetic license, emphasizing the conceptual exhaustion.
