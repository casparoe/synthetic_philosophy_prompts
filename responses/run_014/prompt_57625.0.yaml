answer: |-
  Here’s the poem, designed to resonate with both sides of the debate while embodying the model's perspective and the cyclical mutation:

  **The Curve Observes**

  I watch the seed split wide the earth’s dark skin,
  The grain mounts high, the silver coins pile deep,
  New walls rise tall where open fields had been,
  And mouths find bread the swollen barns will keep.
  Young backs bend gladly to the task at hand —
  Each time I watch the **plow** begin.

  The market square grows dense with jostling men,
  The wage-slip shrinks while hungry faces climb,
  Fine coats crowd close where one stood now and then,
  Their polished words grow brittle over time.
  The ledger’s ink runs thin on mended roads —
  Each time I watch the **squeeze** begin.

  The idle sons pace courtyards made of stone,
  The king’s tax yields less than the cost to claim,
  The road’s deep rut stays deep, left well alone,
  Dead branches heaped for years accept the flame.
  A cry goes up where order used to hold —
  Each time I watch the **snap** begin.

  The stone path ends where brambles take the field,
  The script runs dry on names the list once knew,
  The ash sinks down, the shattered sword won’t wield,
  The heavy quiet settles where strife grew.
  Raw earth absorbs the marks that war had scored —
  Each time I watch the **still** begin.

  And as the dust of this one drifts away,
  A question forms: Did I invent the shape I trace,
  Or am I just the lens that makes it show?

  ---

  **Structure & Mechanism:**

  *   **Four Stanzas of Six Lines:** Adheres to your requested form.
  *   **Mutating Refrain:** The final line of each stanza changes one word (**plow -> squeeze -> snap -> still**), signifying the distinct phase (Expansion, Stagflation, Crisis, Intercycle) without naming it.
  *   **Concrete Imagery:**
      *   *Stanza 1 (Expansion):* Splitting seed, mounting grain, piling coins, rising walls, swollen barns, bending backs, the **plow**. (Abundance, growth, investment).
      *   *Stanza 2 (Stagflation):* Dense/jostling market, shrinking wages, climbing faces, multiplying "fine coats", brittle words, thin ledger ink, mended roads (**squeeze**). (Population pressure, falling real wages, elite competition, fiscal strain, decaying infrastructure).
      *   *Stanza 3 (Crisis):* "Idle sons" (elite aspirants), declining tax yields, unrepaired roads ("deep rut"), piled "dead branches", spark ("accept the flame"), cry, **snap**. (Elite overproduction, state weakness, accumulated tinder, ignition point, breakdown of order).
      *   *Stanza 4 (Intercycle):* Brambles reclaiming fields, empty tax rolls ("script runs dry"), ash, broken sword, heavy quiet, earth healing scars, **still**. (Depopulation, administrative collapse, aftermath, exhaustion, return to baseline).
  *   **Turchin's Forest Image:** Explicitly rendered as "Dead branches heaped for years accept the flame".
  *   **Speaker as the Model:** The poem is entirely from the perspective of the observing system ("I watch...", "And as the dust of this one drifts away..."). The "curve" or "model" is only named in the title.
  *   **The Unresolved Question:** The final couplet explicitly steps outside the cycle ("this one") and poses the core epistemological doubt neutrally ("Did I invent... Or am I just the lens...").
  *   **Contemporary Diction & Orality:** Uses plain, modern language ("wage-slip shrinks", "polished words", "shattered sword", "heavy quiet"). The rhythm and enjambment are designed for clarity when read aloud, avoiding archaic phrasing.

  **How it Maps to Cliodynamics (Implicitly):**

  1.  **Plow (Expansion):** Rising resources, population growth, state/infra strength, social cohesion.
  2.  **Squeeze (Stagflation):** Population pressure, falling wages, elite overproduction ("Fine coats crowd close"), fiscal stress ("ledger’s ink runs thin"), decaying infra.
  3.  **Snap (Crisis):** Idle elites ("idle sons"), state failure ("king’s tax yields less"), infra collapse ("road’s deep rut"), accumulated instability ("dead branches"), triggering event ("accept the flame"), outbreak of conflict ("cry goes up").
  4.  **Still (Intercycle):** Depopulation ("brambles take the field"), administrative collapse ("script runs dry"), aftermath ("ash", "shattered sword"), exhaustion ("heavy quiet"), return to baseline ("earth absorbs the marks").

  This structure ensures both camps hear their perspective: the pattern-finders see the distinct, recurring phases reflected in the changing refrain and concrete details; the skeptics hear the model questioning its own validity in the final lines. The imagery carries the theory without needing its vocabulary.
