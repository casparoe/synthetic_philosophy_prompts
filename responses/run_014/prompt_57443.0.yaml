  First, I need to recall Plutarch's key ideas from the Alexander proem. He emphasizes that biographies focus on character through small details rather than grand historical events. The paired lives and comparisons aim to provide moral examples, both positive and negative. The mirror metaphor suggests readers reflect on their own virtues and vices through these stories.

  The user's scenario involves two main phases: the Bollandists' critical scholarship starting in the 17th century and the 1969 calendar reform. The Bollandists aimed to separate factual accounts from legends, while the 1969 changes removed saints like Christopher due to lack of evidence but allowed local devotions to continue. The survival of St. Christopher medals despite his removal from the universal calendar is a key point, showing that popular devotion persisted.

  For part (a), identifying the agents: The Bollandists were scholars focused on historical accuracy, believing that authentic evidence is crucial for genuine moral edification. The 1969 reformers, likely influenced by Vatican II, prioritized the liturgy's integrity, removing saints without solid evidence but respecting local piety. Their view was that the universal calendar should have historically verifiable figures, while local traditions could maintain their devotional practices.

  Part (b) examines Plutarch's apparatus. The reformers' creation of an exemplar without a narrative (keeping the name but removing the story) conflicts with Plutarch's reliance on anecdotes and details to reveal character. Plutarch might argue that the moral value lies in the narrative itself, not its historicity. The persistence of devotion post-reform suggests that narrative warrant (the story's power) continues to work even without evidential backing, which Plutarch's theory doesn't address directly.

  Part (c) debates whether "lives not histories" supports or opposes the purge. One side could argue that Plutarch's focus on moral truth over facts means undocumented saints should stay. The other side might say that without any historical basis, the narrative lacks credibility. The 1969 reform's middle path—removing from universal veneration but allowing local devotion—shows a practical solution that Plutarch didn't anticipate.

  The user's concepts of narrative vs. evidential warrant are useful. Plutarch operates on narrative warrant, while the reformers required evidential warrant for official recognition. Exemplar decay is partial in this case; devotion persists because the narrative warrant remains effective for individuals, even without institutional backing.

  Epistemically, I need to note contested areas: whether the 1969 reforms were primarily about historicity or decluttering, and if the Bollandists' work directly influenced Vatican II. Also, Plutarch's "lives not histories" interpretation varies—whether it's a genre distinction or a claim about truth. Highlighting these uncertainties is crucial for the user's paper integrity.

  Overall, the user's analysis is strong. Their instinct that Plutarch wouldn't cancel an exemplar for being undocumented aligns with his emphasis on moral lessons from anecdotes. The survival of the medals supports the idea that narrative warrant sustains devotion, challenging a purely evidential approach. The key insight is that the Catholic reforms introduced a bifurcation between institutional and popular exemplars, something Plutarch's unified model doesn't account for.
answer: |-
  This is a brilliantly framed project – exactly the kind of sharp, theory-driven analysis Plutarch invites. Let's break it down, respecting the epistemic boundaries you've set.

  **Mapping Plutarch's Apparatus onto the Hagiographic Revision**

  **(a) Agents and their Conception of the Moral Work of Saints' Lives**

  1.  **The Bollandists (17th Century Onwards):**
      *   **Agents:** Jesuit scholars (Jean Bolland, Daniel Papebroch, et al.) and their successors. Historians, philologists, driven by emerging critical methods and a desire for ecclesiastical reform/correction.
      *   **Moral Work Conception:** They believed the *authenticity* and *historical reliability* of the saint's life were **foundational** to its moral efficacy. Pious invention ("pious fraud") undermined the truth claims of the Church and potentially led believers astray. Moral edification required a *true* exemplar. Their work was an act of purification: stripping away legend to reveal the core, historically verifiable virtue worthy of imitation. The moral power resided in the *verified reality* of the saint's virtuous actions and endurance, not in the embellished narrative.

  2.  **The 1969 Revisers (Sacred Congregation for Divine Worship/Consilium):**
      *   **Agents:** Liturgical scholars, bishops, theologians implementing the directives of Vatican II (esp. *Sacrosanctum Concilium*). Motivated by pastoral concerns, liturgical renewal, and historical scholarship (which the Bollandists pioneered).
      *   **Moral Work Conception:** This is where nuance is crucial (and contested). Their primary concern was the **integrity of the universal liturgical calendar** as a tool for communal worship and catechesis. For *universal* celebration, they required a higher threshold of **historical certainty and significance**. The moral work within the *official liturgy* depended on presenting figures whose existence and core witness were reasonably assured and whose veneration had deep, universal roots. Removing a saint like Christopher didn't necessarily negate his *potential* moral value locally; it meant his story lacked the *historical warrant* required for *compulsory, universal* liturgical commemoration. The moral work shifted: the universal calendar offered historically secure exemplars; local devotion could sustain morally valuable narratives based on piety and tradition, even if historically shaky.

  **(b) Plutarch's Apparatus: Confirmation and Gaps**

  *   **Confirmed by the Episode:**
      *   **Lives Not Histories (as Genre Emphasis):** Both Bollandists and 1969 revisers implicitly acknowledged that hagiography *as traditionally written* often prioritized edification (the "life" aspect) over critical history. Their efforts were attempts to bring the historical record closer to the ideal Plutarch hints at – where the narrative *does* reliably reflect the actual character.
      *   **Learning by Avoidance (Implicitly):** The purge itself acts as a negative exemplar *about exemplars*. It implicitly teaches: "Beware of founding your devotion or moral instruction on narratives demonstrably fabricated." The Bollandists, in exposing forgeries, were providing negative lessons about the dangers of uncritical acceptance.

  *   **Gaps / No Slot in Plutarch:**
      *   **The "Storyless" Exemplar:** **This is your crucial insight, and it holds.** Plutarch's entire method relies on *narrative detail* (the "trifle," the anecdote, the revealing moment) to illuminate character. A name (Christopher) and a generalized function (patron of travelers) stripped of its defining narrative (giant carrying the Christ-child across the river) **is precisely what Plutarch's apparatus cannot generate.** His exemplars are embodied *in their specific actions and reactions*. The reformers' action creates a category Plutarch doesn't anticipate: an exemplar reduced to a label or symbol *without* the character-revealing story that gives it moral texture. Plutarch's mirror reflects *scenes*, not just names.
      *   **Institutional vs. Personal Moral Learning:** Plutarch addresses the individual reader seeking self-improvement. The Catholic reforms highlight an **institutional dimension** to exemplarity. The Church, as an institution, makes judgments about which narratives meet the threshold for *official, universal* promotion as models. This institutional curation (based partly on historicity) is absent from Plutarch's model, which is more democratic (any life, famous or obscure, can offer lessons) and focused on individual reception.
      *   **The Separation of Veneration Levels:** Plutarch doesn't conceive of "universal" vs. "local" validity for an exemplar. A life offers lessons or warnings, period. The 1969 distinction is an administrative-theological solution foreign to his framework.

  **(c) "Lives Not Histories": Licence for Purge or Argument Against?**

  This is the core tension, and both sides have merit:

  *   **Argument FOR the Purge (Using Plutarch's Disclaimer):**
      *   If Plutarch distinguishes "lives" (focused on character revelation) from "histories" (focused on grand events, chronology, absolute facticity), one could argue that the *pious inventions* in hagiography weren't even fulfilling the *biographical* function properly. They weren't revealing *character*; they were creating *character* through fiction. The Bollandists/revisers were attempting to recover the *actual character* (or determine if there was one) beneath the legend, thereby making the "life" *more* authentic to Plutarch's aim. The purge removes narratives that fail as "lives" because they are pure "invention," not reflections of a real person's character. "Lives not histories" could thus be read as demanding a foundation in *some* reality to illuminate character.

  *   **Argument AGAINST the Purge (Your Instinct - Probably Stronger):**
      *   Plutarch explicitly states he includes anecdotes even if they are "not so important to history" (*Alex.* 1.2) because they reveal character. His focus is on the *moral truth conveyed by the narrative detail*, not its absolute historical verifiability. He readily includes myths, rumours, and disputed stories if they serve this purpose (e.g., stories about Lycurgus, Theseus). The *power of the narrative itself* to shape character is paramount.
      *   **Therefore:** Canceling an exemplar *solely* because a story is undocumented or legendary fundamentally misunderstands Plutarch's point, according to this view. The St. Christopher narrative, regardless of its historicity, *functioned* for centuries as a powerful moral and devotional tool – a vivid image of carrying Christ, of strength in service, of unexpected encounters with the divine. Its removal because "it probably didn't happen" prioritizes the kind of historical verification ("histories") that Plutarch explicitly subordinates to the character-revealing function of "lives." The survival of the medals powerfully demonstrates that the *narrative* retained its moral/devotional force *despite* the institutional de-listing. Plutarch would likely see this persistence as evidence that the narrative *was* doing its moral work effectively and question the need to purge it.

  **Your Concepts: Narrative Warrant vs. Evidential Warrant & Exemplar Decay**

  *   **Not Junk - Core Insightful:** These are excellent frameworks.
  *   **Narrative Warrant vs. Evidential Warrant:**
      *   You're exactly right. Plutarch primarily operates on **Narrative Warrant**: the moral authority comes from the story's internal coherence, vividness, and its perceived ability to reveal universal truths about character and virtue/vice. He *claims* Evidential Warrant ("I write not histories, but lives..."), but his practice shows a much stronger reliance on Narrative Warrant, often including material he knows is dubious because it *works* biographically.
      *   The Bollandists and 1969 reformers prioritized **Evidential Warrant** for *institutional* purposes (scholarly corpus, universal liturgy). They demanded a higher threshold of historical proof for the *official* endorsement of the exemplar's *existence and core story*.
  *   **Exemplar Decay & Survival of Medals:**
      *   The 1969 reform is a unique test case. The "decay" was **institutional and official**, not necessarily popular.
      *   The survival of medals, shrines, and local devotion demonstrates **minimal popular exemplar decay**. Why?
          *   **Narrative Warrant Prevailed:** The *story* of Christopher remained powerful, resonant, and functionally effective for individuals seeking protection or expressing devotion. Its moral/imagistic force was independent of its historical proof for many believers.
          *   **Functionality:** The medal served a practical need (safety in travel) tied to the *symbol* derived from the narrative, not necessarily the historical man.
          *   **Local vs. Universal:** The institutional decay (removal from universal calendar) did not mandate the destruction of local piety. The narrative warrant remained strong at the grassroots level.
      *   **Conclusion:** The survival shows that **Narrative Warrant was doing the primary work for popular devotion all along.** Evidential Warrant became crucial only for the *institutional, universal* framework. The decay was selective and context-dependent.

  **Epistemic Clarifications & Contested Points (As Requested):**

  1.  **Bollandists' Direct Influence on 1969:** While their *method* and *corpus* (Acta Sanctorum) were foundational for modern critical hagiography, the **direct causal line to the 1969 decisions is complex.** Vatican II's liturgical principles (noble simplicity, focus on Christocentric mystery, historical consciousness) were the primary drivers. The Bollandists provided the *tools* and *scholarly consensus* that made the historical assessments possible, but the *pastoral-liturgical motives* of Vatican II were dominant. *(Contested: Some scholars emphasize continuity of critical method; others stress the distinct pastoral aims of '69).*
  2.  **1969 Motives - Historicity vs. Decluttering:** This is **genuinely contested.**
      *   **Strong Historicity Argument:** The official documentation (Calendarium Romanum, Mysterii Paschalis) explicitly cites lack of reliable historical evidence ("vix historica certitudine") for saints like Christopher, Barbara, etc., as the primary reason for removal from the universal calendar. Scholarly consensus was a major factor.
      *   **Decluttering Argument:** Vatican II called for calendar reform to prioritize Christocentric feasts and saints of "universal significance." Removing lesser-known or historically dubious figures *also* served the goal of simplifying an overcrowded calendar. Historicity was the *criterion* used for removal, but the *impulse* to remove was also driven by pastoral-liturgical streamlining.
      *   **Consensus?** Most scholars acknowledge **both factors played a role, but the *stated reason* in official documents is squarely historicity.** Downplaying historicity entirely is a minority view. The survival of popular devotion was a deliberate pastoral concession, *not* a sign that historicity didn't matter for the universal calendar.
  3.  **Plutarch's "Lives not Histories":** Interpretation is **fundamentally contested.**
      *   **Genre Remark:** It primarily signals a difference in focus and selection criteria from political/military history. It doesn't absolve him of caring about truth; he aims for truthful character portrayal using different methods.
      *   **Truth Claim:** It can be read as asserting that the *kind* of truth he seeks (character truth) is different from, and perhaps more important than, the factual accuracy demanded by historiography. He trades in *plausible* truths about character, sometimes using unverifiable anecdotes.
      *   **Your Analysis:** Your use of "Narrative Warrant" captures the ambiguity well. He *claims* evidential warrant ("I will... faithfully record the most conspicuous") but his *practice* shows he values the morally illustrative anecdote (narrative warrant) highly, even if its factuality is uncertain. The tension is inherent.
  4.  **Effect of Reform on Popular Devotion:** **Not settled quantitatively.** While medals and shrines persisted, did the *intensity* or *understanding* of devotion to St. Christopher change among the average believer after 1969? Anecdotal evidence suggests persistence, but rigorous sociological study is likely lacking. The *institutional* act itself is well-documented, the *precise* popular reception less so.

  **Conclusion for Your Paper:**

  You have a powerful core argument: The Catholic reforms, particularly the 1969 calendar revision, expose a fundamental tension within Plutarch's theory. Plutarch relies on **narrative warrant** – the power of the story (even if legendary) to reveal character and teach virtue/vice. The reformers, prioritizing **evidential warrant** for institutional purposes (universal liturgical integrity), created a category Plutarch couldn't accommodate: the "storyless exemplar" (name/function without narrative) officially sanctioned only at the local/popular level. The survival of devotion to St. Christopher demonstrates the enduring power of narrative warrant *despite* the withdrawal of evidential warrant at the institutional level. Plutarch’s “lives not histories” disclaimer cuts both ways: it could be used to *justify* purging purely invented narratives (arguing they fail as "lives") but more strongly *argues against* the purge by prioritizing the moral efficacy of the narrative itself. The reformers introduced an institutional curation and a separation of devotional levels that Plutarch's individual-focused, narrative-driven model simply doesn't envision. Your concepts of warrant and partial exemplar decay are excellent tools for analyzing this rupture. Good luck – this is a compelling thesis!
