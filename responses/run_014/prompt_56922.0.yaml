answer: |-
  ### Ground rules
  I'll rank problems by: **leverage of your verification expertise** (heaviest weight, as it's your unique edge), **tractability solo** (mathematical rigor required, low need for philosophical collaboration), **upstream impact** (solves foundational tensions enabling downstream progress), and **neglect in current literature** (avoids rediscovery). Trade-offs exist: high-impact problems often require more philosophical engagement, but your quantitative strength offsets this. Prioritizing leverage ensures you exploit your deep practical intuition about scoring rules in operational contexts—where most theorists lack firsthand experience. Avoid problems demanding extensive philosophical dialectic or institutional access.

  ---

  ### The shortlist, ranked  
  1.  **The Sensitivity of Epistemic Norms to Scoring Rule Choice**  
      *Why this?* Your verification experience directly confronts the core tension: pragmatic scoring choices (e.g., Brier vs. log) affect forecast rankings, yet epistemic utility theory treats the scoring rule as "purely epistemic." Tackle whether *any* scoring rule can be justified *without* smuggled pragmatism. Use your grasp of real-world instability (e.g., log score punishing extreme errors) to model how norm derivations (probabilism, conditionalization) degrade under different Bregman divergences. *Tractability:* High—mathematical (e.g., sensitivity analysis of dominance conditions), minimal philosophy. *Leverage:* Your intuition for when scores "break" in practice is irreplaceable.  

  2.  **Model Error and Epistemic Justification**  
      *Why this?* Forecast verification assumes imperfect models, but accuracy-first programs often ignore model misspecification. Analyze how epistemic norms (e.g., calibration) behave when the agent’s hypothesis space is *known* to be wrong (e.g., missing key variables). Your lab experience with instrumental drift/artifact detection is crucial. *Tractability:* Moderate—requires extending scoring rule analyses to misspecified models (e.g., minimizing "effective inaccuracy"). *Leverage:* Philosophers rarely consider how measurement constraints corrupt idealized epistemology.  

  3.  **Scoring Rules for Non-Standard Credence Objects**  
      *Why this?* Verification often handles discontinuous events (e.g., "temperature ≥30°C"), while epistemology focuses on propositions. Formalize scoring for credences over *functions* (e.g., temperature curves) or coarse-grained partitions. This bridges practice (e.g., verifying ensemble forecasts) with Joyce’s work on gradational accuracy. *Tractability:* High—leverages your familiarity with continuous ranked probability scores (CRPS). *Leverage:* Your operational use of non-probabilistic scores (e.g., CRPS) grounds abstract extensions.  

  4.  **Computational Constraints as Epistemic Limits**  
      *Why this?* Verification tolerates approximation (e.g., binning continuous data); epistemology ignores computational tractability. Argue that resource-bounded agents *should* use robust-but-imperfect scores (e.g., Brier) because log score optimization is often intractable. *Tractability:* Moderate—complexity analysis of scoring rule optimization. *Leverage:* You’ve seen how computational shortcuts alter forecast systems’ "accuracy" in practice.  

  5.  **Temporal Dynamics of Dominance Avoidance**  
      *Why this?* Forecast systems evolve (e.g., model updates), but accuracy-first justifications for belief revision (e.g., conditionalization) are static. Characterize when *sequences* of forecasts avoid dominance across time under resource constraints. *Tractability:* Low-moderate—requires dynamic scoring frameworks. *Leverage:* Your verification of reforecast systems reveals how norms degrade over time.  

  ---

  ### The dependency map  
  Solving **#1 (scoring rule sensitivity)** is maximally upstream: it exposes whether core norms (probabilism, conditionalization) are robust or artifacts of score choice. If they’re fragile, #2 (model error) and #5 (temporal dynamics) become urgent—norms might require reformulation under real-world constraints. Conversely, progress on #1 simplifies #3 (non-standard objects): if quadratic scores are justifiable epistemically, extending them to functions is natural. #4 (computational constraints) depends on #1 and #2: if log scores are epistemically optimal but computationally toxic, their justification crumbles under bounded rationality. #5 feeds into #2, as model error compounds over time. Focus on #1 first—it forces the field to confront your central worry about pragmatism, potentially reshaping the foundations.

  ---

  ### Leave these alone  
  - **"Why not imprecise probabilities?"**: Highly philosophical, mired in intuition wars (e.g., Joyce vs. Mayo-Wilson). Requires engaging subjective interpretations of "accuracy" you can’t resolve solo.  
  - **New dominance proofs for existing norms**: Saturated ground (e.g., Pettigrew’s book). Your edge isn’t in tightening dominance math but challenging its assumptions.  
  - **Fully Bayesian scoring rules**: Requires collaboration with statisticians; dead ends without departmental access.  
  - **Grounding scoring rules in metaphysics**: Endless rabbit hole. Your strength is operational consequences, not ontology.  

  ---

  ### Bottom line  
  **Start with #1: Sensitivity of norms to scoring rules.** Your verification background provides unmatched intuition for when scores diverge pragmatically—use this to test whether epistemic justifications collapse under score rotation.  

  **First concrete step:** Formalize a "score-sensitivity index" for epistemic norms. Take a standard derivation (e.g., Joyce’s dominance argument for probabilism). Replace the quadratic score with a parameterized Bregman divergence (e.g., power scores spanning Brier to log). Mathematically characterize how the norm’s validity (e.g., no non-probabilist avoids dominance) degrades as the score changes. Your goal: prove that *no* score satisfies all proposed "epistemic desiderata" without pragmatic trade-offs.
