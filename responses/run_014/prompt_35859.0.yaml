prompt: |-
  You are a philosophy professor who has been teaching philosophy of mind for ~15 years and is known for designing classroom demos that make students actually feel the problem rather than just nod along to it. Think carefully about this one and do some brainstorming up front -- I want you to weigh a couple of candidate activity designs against each other before committing to one, then give me the full writeup of the winner.

  Here's my situation: upper-level philosophy of mind seminar, 14 students, one 90-minute session. The topic is whether qualia are an incoherent posit. Background, in case you need it: there's a line of argument -- Dennett's old quining qualia move, and a later paper by Chase and Sanborn pushing the idea harder -- which says that when you force someone to say what they mean by "the intrinsic, ineffable character of this particular experience," the thing they point at either turns out to be something specifiable after all (a discrimination, a comparison, a memory, an expectation, a reaction) or it turns out to be nothing. The intuition survives because people almost never have to actually specify the residue -- they just gesture at it. The whole game is making someone state the residue explicitly, case by case, and watching it evaporate (or watching it fight back, which is also philosophically interesting).

  I want an activity where the students run into this themselves, before I name any view or hand out any reading. My rough idea: real taste stimuli (jelly beans, cola brands, cheap coffee, whatever), with a few stages -- plain discrimination tasks, a memory-with-interference task (taste something, do other stuff, describe it again), and at least one misinformation moment where a flavor gets mislabeled so they can catch themselves confabulating. Then a final stage where each student has to write down what the quale of one specific taste was *over and above* everything they've already been able to say about it, and defend that against structured cross-examination by their classmates. The cross-exam should have constraints: questioners are only allowed to ask about specifiable things (would you recognize it again, how does it compare to X, what did you expect before it hit, what would you have said if I'd told you it was Y), so that the "purely intrinsic" part can't be gestured at but also can't be run down a rabbit hole. I want it to feel like the residue either gets specified or gets exposed as hand-waving.

  What I want from you:

  - concrete rules, a minute-by-minute timeline for the 90 minutes, a materials list, and a clear split between what the facilitator says/does and what must be left to the students
  - the exact structure of that final "specify the residue" stage, including rules for the cross-examination and how you keep it from collapsing into a free-for-all debate
  - a debrief that maps specific moments from the activity onto specific moves in the qualia debate (discrimination, memory drift, expectation, the confabulation caught by mislabeling, etc.), and only names the view/positions at the end
  - an honest section on what will predictably go wrong the first time I run it -- students who refuse to play along, the one confident kid who declares the residue obviously exists and everyone just agrees, timing blowing up -- and how to handle each
  - a frank note on what the activity fundamentally cannot reproduce. My own worry: the real argument is supposed to cover all possible cases at once, but a classroom only stages a handful of actual cases, so a stubborn student can always say "fine, you explained these, the residue is elsewhere." Tell me what I have to supply in the debrief that the demo itself cant deliver.

  Dont give me a generic outline -- I want the actual rules written out clearly enough that a TA could pick this up and run it without me in the room.
reasoning: |-
  We are designing a classroom activity to make students confront the challenge of specifying qualia as "intrinsic, ineffable residues" of experience. The goal is to have them experience how, when pressed to specify, the residue either becomes specifiable (and thus not ineffable) or vanishes (exposed as hand-waving). We'll use taste experiences with structured tasks and a final cross-examination.

  After brainstorming, I considered two candidate designs:

  **Candidate 1: The Progressive Unmasking**
  - **Structure**: A series of taste tests (e.g., three rounds) with increasing cognitive load and interference, culminating in the cross-examination. Each round adds a layer (discrimination, memory, expectation, misinformation) and students take notes. The final round isolates one taste for residue specification.
  - **Pros**: Builds gradually, making the evaporation of qualia more evident step by step. The debrief can map each stage to a philosophical move.
  - **Cons**: Might be too linear; if one stage fails (e.g., no one confabulates in misinformation), the point is weakened.

  **Candidate 2: The Residue Trial**
  - **Structure**: Start with a quick taste test (one item) and then immediately move to the cross-examination for that item. Then, do a second taste test with interference/misinformation and repeat the cross-examination, comparing the two. Finally, a third taste with a different manipulation.
  - **Pros**: More focused on the residue from the start, with immediate pressure. The comparison across trials highlights how context affects reports.
  - **Cons**: Less build-up, might feel rushed; students might not have enough material for cross-examination without prior tasks.

  **Decision**: I choose **Candidate 1 (Progressive Unmasking)** because it better mirrors the philosophical argument: qualia seem solid until you start dissecting them step by step. The gradual approach also gives more hooks for the debrief and reduces the risk of the residue feeling "staged" in one trial.

  Now, the full writeup:

  ---

  **Activity Title**: The Vanishing Residue: A Taste of Qualia

  **Overview**: Through a series of taste experiments and a structured cross-examination, students will attempt to isolate the "intrinsic, ineffable quale" of a taste experience. They will discover that what seems like a residue either becomes specifiable (and thus not ineffable) or disappears under scrutiny.

  **Learning Objective**: Students will experience the challenge of specifying qualia as purely intrinsic properties, and recognize how cognitive, comparative, and memory-based processes infiltrate (and may constitute) what we call "raw experience."

  **Materials**:
  - Taste samples (prepared in advance, in identical small cups with lids, labeled only with codes like "A1", "B2", etc.):
    - Round 1: Discrimination task: 2 similar but distinct items (e.g., two cola brands: Coke vs. Pepsi; or two jelly bean flavors: cherry vs. strawberry). Enough for each student to taste both.
    - Round 2: Memory task: A distinctive item (e.g., a cheap, bitter coffee; or a specific fruit juice). Plus a distractor task (e.g., a simple math puzzle on paper).
    - Round 3: Misinformation task: An ambiguous item (e.g., a white wine spritzer or a mild tea) that can be mislabeled. Half the students get one label (e.g., "Sweetened Iced Tea"), half get another (e.g., "Herbal Infusion").
  - Water and plain crackers for palate cleansing between tastes.
  - Note-taking sheets (one per round, with prompts).
  - Timer.
  - Final cross-examination rules handout (one per student).
  - Whiteboard or projector for instructions.

  **Timeline (90 minutes total)**:

  **0:00-0:05 (5 min) - Introduction**
  - Facilitator says: "Today we're exploring subjective experience. We'll do a series of taste tests. Your job is to pay close attention to your experience and take notes as directed. Don't overthink—just report what you notice. We are not naming any philosophical views yet; we are gathering raw data."
  - Distribute note-taking sheets and pens. Emphasize: "Write only for yourself; we won't collect these. Be honest—no right/wrong answers."

  **0:05-0:20 (15 min) - Round 1: Discrimination Task**
  - **Task**: Taste Sample A, then Sample B. Write: (1) Describe A in 3 words. (2) Describe B in 3 words. (3) What’s the clearest difference between them? (e.g., "A is sweeter," "B has a citrus note.") (4) Could you pick A out of a lineup of similar tastes?
  - **Facilitator**: Distribute samples (all get A then B). After tasting, give 5 min to write. Then, ask a few volunteers to share their difference descriptions (write them on board). **Do not debate**; just list.
  - **Goal**: Shows that initial reports are comparative/discriminatory.

  **0:20-0:40 (20 min) - Round 2: Memory + Interference Task**
  - **Task**: Taste Sample C (e.g., bitter coffee). Write: (1) First impression in 3 words. (2) After 30 seconds, write any aftertaste or change. Then, do a 5-min distractor (e.g., solve 3 simple math puzzles). Then, write: (3) From memory, describe C again in 3 words. (4) How confident are you that you’d recognize it again? (Scale 1-5).
  - **Facilitator**: Distribute C. After initial taste and first notes, start distractor task. After 5 min, prompt memory recall. Ask volunteers: "How did your description change? Why?" (Note: memory drift and reconstruction.)

  **0:40-0:55 (15 min) - Round 3: Misinformation Task**
  - **Task**: Half the class gets Sample D with Label 1 (e.g., "Sweetened Iced Tea"), half with Label 2 (e.g., "Herbal Infusion"). Taste D. Write: (1) Describe the taste. (2) Does the label fit? Why/why not? Then reveal: "Actually, everyone had the same drink: [true description, e.g., 'diluted white grape juice with a hint of mint']." Write: (3) How did the label affect your experience? (4) Did you 'taste' the label?
  - **Facilitator**: Distribute samples with labels (cover the code; students only see the label). After tasting and writing, reveal the truth. Discuss briefly: "Raise hand if the label influenced you." **Goal**: Highlight confabulation.

  **0:55-1:20 (25 min) - The Residue Cross-Examination**
  - **Setup**: Each student picks ONE taste from the previous rounds (their choice) to defend. They must write on the board: "The quale of [sample] was [their one-sentence residue claim]." (e.g., "The quale of Sample C was its intrinsic bitterness.")
  - **Rules for cross-examination** (distribute printed rules):
    - The defender has 1 minute to state their residue claim and why it can't be reduced to discrimination, memory, etc.
    - Questioners (classmates) have 3 minutes to ask questions. **Questions must be about specifiable properties only**: e.g., "Would you recognize it?" "How did it compare to X?" "What did you expect?" "If I told you it was Y, would you have described it differently?" **No metaphysical questions** (e.g., "Is it non-physical?").
    - Facilitator moderates: cuts off off-topic questions, enforces time.
    - After 3 min, the defender must either: (a) specify the residue in non-comparative terms, or (b) admit it vanished. Then, next volunteer.
  - **Process**: Do 3-4 volunteers max (5 min each). If no volunteers, facilitator picks. **Goal**: Force attempts to specify the residue under constrained questioning.

  **1:20-1:30 (10 min) - Debrief and Philosophical Mapping**
  - Facilitator: "Let's map what happened to the qualia debate."
    - Round 1 (discrimination): "When you described A vs. B, you used comparisons. Is there a 'pure' cherry taste, or is it always cherry-as-contrasted-with-strawberry? (Dennett: qualia are differences, not atoms.)"
    - Round 2 (memory): "Your description of C changed. If qualia are intrinsic and stable, why? (Chase & Sanborn: experience is memory-dependent; what you report is always reconstructed.)"
    - Round 3 (misinformation): "Labels changed your experience. If qualia are ineffable, why are they suggestible? (Confabulation shows that reports are theory-laden.)"
    - Cross-examination: "When forced to specify the residue, what happened? Did it become another discrimination? A memory? An expectation? Or did it disappear? This is the 'evaporation' move."
  - **Name the view**: "This is the core of 'quining qualia': what we call qualia might just be a bundle of judgments, reactions, and comparisons. The residue is an illusion of vagueness."
  - **The Stubborn Objection**: "But what about this taste right now? Isn't there something it's like? Yes—but the argument is that whatever you point to, we can always ask: is this bit ineffable, or can it be specified? And if it can, it's not qualia; if it can't, is it anything at all?"

  **What Could Go Wrong and How to Handle It**:
  1. **Refusal to play along**: Some students might dismiss the activity as "just about taste." Handle: "Humor me—taste is a standard example in philosophy of mind. If qualia exist, they should be here too."
  2. **The Confident Kid**: One student insists the residue is obvious. Handle: In cross-examination, press with specifiable questions. If they say "It's just bitter!" ask: "Is bitterness a comparison (vs. sweet)? A reaction (you recoiled)? If I changed your receptors, would it still be bitter?" If they wave hands, say: "That’s the gesture we’re studying."
  3. **Timing Blow-up**: The cross-examination runs long. Handle: Strict 5-min per volunteer cap. Use a timer. Skip volunteers if needed.
  4. **No Confabulation in Round 3**: If misinformation doesn't work, say: "Interesting—some of you weren't influenced. Why? Maybe expectations vary. Still, some were influenced—why is that possible if qualia are intrinsic?"
  5. **"The Residue is Elsewhere"**: A student says, "You explained taste, but visual qualia are different." Handle: In debrief, agree: "This is a demo, not proof. But the burden shifts: if qualia evaporate here, why think they exist elsewhere? What experiment would isolate them?"

  **What the Activity Cannot Reproduce**:
  - **The Universal Claim**: The argument against qualia is supposed to hold for all experiences. But we only test taste. In debrief, stress: "Taste is a hard case for us because it's putatively rich in qualia. If it fails here, where would they succeed? If you think they exist, design a test to isolate them—without gesturing."
  - **The 'Here and Now' Objection**: The vividness of immediate experience feels irreducible. The demo can't make that feeling vanish; it can only show that reports of it are always specifiable. In debrief: "The feeling is real—but is it a quale, or is it the totality of your cognitive relations in that moment? The activity exposes that we can't point to a non-relational core."

  **Final Note for TA**: Stick to the timeline. Don’t let discussions derail the tasks. In cross-examination, enforce question rules ruthlessly. The power is in the constraints.

  ---
  This design should make the qualia debate visceral. Students won't just hear about "evaporation"—they'll sweat it.
answer: |-
  ### **Activity Design: "The Vanishing Residue"**
  **Core Goal**: Force students to confront the challenge of isolating "qualia" as an intrinsic, ineffable residue by staging taste experiments and a structured cross-examination. Students experience how the residue either dissolves into specifiable components (discriminations, memories, reactions) or vanishes under scrutiny.  
  **Philosophical Hook**: Qualia seem robust until you demand explicit specification—then they "evaporate" (Dennett) or become relational (Chase & Sanborn).

  **Winner Rationale**: After brainstorming two approaches (a **gradual-unmasking series** vs. a **single-taste deep dive**), I selected the **gradual-unmasking series**. Why?  
  - **Gradual Unmasking**: Multiple rounds build pressure incrementally (discrimination → memory drift → confabulation), making evaporation feel inevitable. Students accumulate "failed" specifications, weakening resistance.  
  - **Rejected Alternative**: A single-taste deep dive risks students doggedly defending one experience ("*This* lime jelly bean *has* a residue!"), reducing buy-in. The series generalizes the problem.

  ---

  ### **Materials List**  
  *(Prep before class; budget: ~$25)*  
  1. **Taste Samples** (4 sets; label all cups with codes like "A1", "B2" to avoid bias):  
     - **Set 1 (Discrimination)**: Two similar items (e.g., Coke vs. Pepsi; or lemon vs. lime jelly beans). 14 pairs.  
     - **Set 2 (Memory)**: One strong/distinctive item (e.g., cheap black coffee; or bitter dark chocolate). 14 servings.  
     - **Set 3 (Misinformation)**: One ambiguous item (e.g., plain seltzer; or diluted white grape juice). Label half cups "Tonic Water" and half "Mineral Water". 14 servings.  
     - **Set 4 (Residue Target)**: One complex item (e.g., cola jelly bean; or ginger beer). 14 servings.  
  2. **Palate Cleaners**: Water cups, plain crackers (for resetting taste between rounds).  
  3. **Timing Tools**: Timer (visible to all).  
  4. **Student Kits**:  
     - Notepads + pens.  
     - "Residue Cross-Examination Rules" handout (see below).  
  5. **Whiteboard**: For tracking stages/questions.  

  ---

  ### **Timeline (90 Min Total)**  
  **Role Clarity**:  
  - **Facilitator (You/TA)**: Give instructions, enforce time, moderate cross-exam. *Do not debate, suggest answers, or name philosophers*.  
  - **Students**: Follow tasks, take notes, cross-examine peers.  

  #### **0:00–0:10 (10 min): Setup & Framing**  
  - **Facilitator Says**:  
    > "Today, we’re exploring how we describe experiences. You’ll taste samples, take notes, and later defend a claim. There are no tricks—just pay attention to what *you* experience. I won’t define terms yet; we’ll build from the ground up."  
  - **Do**:  
    - Distribute kits, water, crackers.  
    - Write on board: "**Stage 1: Discrimination**".  

  #### **0:10–0:25 (15 min): Discrimination Task**  
  - **Goal**: Show experience is inherently comparative.  
  - **Facilitator Says**:  
    > "Taste Sample A, then Sample B. On your notepad:  
    > 1. Describe Sample A in 3 words.  
    > 2. Describe Sample B in 3 words.  
    > 3. What’s the *clearest difference* between them? (e.g., ‘A is sweeter.’)  
    > 4. Could you pick A out of a lineup of similar tastes? Yes/No/Why."  
  - **Do**:  
    - Distribute Set 1. Start timer (5 min for tasting/notes).  
    - After: Cold-call 3 students to share difference descriptions. Write responses on board (e.g., "Student 3: A more acidic"). **Do not comment**.  

  #### **0:25–0:45 (20 min): Memory Task**  
  - **Goal**: Show memory reconstructs, doesn't replicate "raw" experience.  
  - **Facilitator Says**:  
    > "Taste Sample C. Note:  
    > 1. First impression in 3 words.  
    > 2. Do this distractor task: Solve 3 simple math problems (hand out sheet).  
    > 3. After 5 min, describe C *from memory* in 3 words.  
    > 4. How confident are you this matches your first impression? (1–5 scale)."  
  - **Do**:  
    - Distribute Set 2 and math sheet (e.g., "124 ÷ 4 = ?"). Start timer (5 min tasting/initial notes → 5 min math → 5 min memory notes).  
    - After: Ask, "How many felt their memory description drifted?" Count hands. Write drift examples on board.  

  #### **0:45–1:00 (15 min): Misinformation Task**  
  - **Goal**: Show expectation/context alters experience (confabulation).  
  - **Facilitator Says**:  
    > "You’ll get Sample D with a label. Taste it. Note:  
    > 1. Describe the taste.  
    > 2. Does the label fit? Why/why not?  
    > > *After notes*: Reveal all had the *same* drink (e.g., seltzer). Note:  
    > 3. Did the label change your experience? How?"  
  - **Do**:  
    - Distribute Set 3 (half with "Tonic Water", half "Mineral Water"). Timer (5 min tasting/notes).  
    - Reveal misinformation. Ask: "Who felt the label influenced them?" Count hands.  

  #### **1:00–1:20 (20 min): Residue Cross-Examination**  
  - **Goal**: Force specification of the "ineffable residue."  
  - **Facilitator Says**:  
    > "Pick *one* taste from today (A, B, C, or D). Write this claim:  
    > *‘The quale of [sample] was [your one-sentence description of its intrinsic, private, ineffable character].’*  
    > Example: ‘The quale of Sample C was its pure, unnameable bitterness.’  
    > You’ll defend this claim. Questioners can *only* ask about specifiable properties (see handout)."  
  - **Cross-Examination Rules (Handout Text)**:  
    > - **Defender**: Has 1 min to state claim.  
    > - **Questioners**: 3 min to ask questions. Questions **must** be:  
    >   - Recognition: "Would you recognize this taste again?"  
    >   - Comparison: "How did it differ from X?"  
    >   - Expectation: "What did you anticipate before tasting?"  
    >   - Reaction: "Did you like it? Would you react differently if told it was Y?"  
    > - **Banned**: Metaphysical questions ("Is it non-physical?"), unconstrained "why?" probes.  
    > - **Facilitator Role**: Cut off off-topic questions; enforce time; after 3 min, ask defender: "Did you specify the residue, or did it vanish?"  
  - **Do**:  
    - Pick 3 volunteers (max 5 min each). For each:  
      - Defender states claim (1 min).  
      - Classmates ask questions (3 min; facilitator enforces rules).  
      - Defender gives final verdict ("specified" or "vanished").  
    - If no volunteers, cold-call pre-identified engaged students.  

  #### **1:20–1:30 (10 min): Debrief & Philosophical Mapping**  
  - **Facilitator Says**:  
    > "Let’s connect this to philosophy. No jargon yet—just map your experience:  
    > - **Discrimination Task**: When you described A vs. B, you used *differences* (sweeter, sharper). Did ‘pure’ lemon exist alone, or only in contrast? [*Maps to: Qualia as relational, not intrinsic*]  
    > - **Memory Task**: When your description drifted, was the ‘original quale’ lost? Or was it never fixed? [*Maps to: Qualia as unstable under reconstruction*]  
    > - **Misinformation Task**: When the label changed your report, did it corrupt your ‘raw experience’—or *create* it? [*Maps to: Confabulation/expectation as constitutive*]  
    > - **Cross-Exam**: When pressed, did your residue become a comparison/reaction? Or did it dissolve? This is the ‘evaporation’ move.  
    >  
    > **Now name the view**: Philosophers like Dennett argue qualia are an ‘incoherent posit’—what seems ineffable is just unspecified cognitive work (discrimination, memory, etc.). Chase and Sanborn add: even if it feels ‘intrinsic’, forcing specification reduces it to relations. The residue is a trick of vagueness."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"The Residue is Obvious!" Student**:  
     - *Risk*: One confident student declares, "Sample C’s bitterness *is* intrinsic!" and peers agree.  
     - **Fix**: In cross-exam, enforce question rules: "How is ‘bitterness’ different from ‘less sweet than B’? If I changed your taste buds, would it still be bitter?" If they gesture, note: "That’s the hand-wave we’re studying."  

  2. **Refusal to Play Along**:  
     - *Risk*: Skeptical student says, "Taste isn’t visual qualia—this proves nothing."  
     - **Fix**: "If qualia exist, they should be here too. Let’s test your view: in cross-exam, defend *why* this residue can’t be specified."  

  3. **Timing Blowup**:  
     - *Risk*: Cross-exam runs long; only 1 student defends.  
     - **Fix**: Hard-cap at 5 min per defender. Use timer. Skip Q&A if behind; use their notes for debrief mapping.  

  4. **Misinformation Fails**:  
     - *Risk*: No one admits label influenced them.  
     - **Fix**: Contrast volunteers’ descriptions (e.g., "Tonic" group used "medicinal"; "Mineral" used "clean"). Ask: "If experience is intrinsic, why did labels shape reports?"  

  5. **"You Missed My Quale!"**:  
     - *Risk*: Student insists residue survived cross-exam.  
     - **Fix**: "Great—write down the *exact* ineffable property. Now, is it distinguishable from your reaction to it? If yes, how?" (Pushes them to specify).  

  ---

  ### **What the Activity Can’t Reproduce (and How to Bridge It)**  
  - **The Gap**: Stubborn students can say, "You explained *these* tastes, but my [visual/auditory/pain] qualia are different!" The demo covers 4 cases, but the argument is universal.  
  - **Bridging in Debrief**:  
    1. **Burden Shift**: "If qualia evaporate in taste—a domain where we *most* expect them—where *would* they survive? What experiment could isolate them in vision without gesturing?"  
    2. **The Here-and-Now Defense**: "When you say, ‘But my *current* coffee taste is irreducible!’, note: in the memory task, your ‘current’ became unstable. What makes *now* different? Specification always hooks it to past/future/comparisons."  
    3. **Name the Trap**: "The qualia intuition relies on never demanding full specification—it retreats to new examples. But the pattern holds: when forced, it evaporates."  

  ---

  ### **TA Cheat Sheet**  
  **Key Principles**:  
  - **Neutrality**: Never say "qualia" until debrief. Use "residue" or "raw experience."  
  - **Pacing**: Stick to timers. If students debate mid-activity: "Save it for cross-exam."  
  - **Cross-Exam Enforcement**: Interrupt non-compliant questions: "Rephrase as a recognition/comparison/expectation question."  
  - **No Rescue**: If a defender flounders, don’t help. Let the residue "vanish."  

  **Prep Checklist**:  
  - ☑ Taste samples labeled/coded.  
  - ☑ Handouts printed.  
  - ☑ Whiteboard markers + timer.  
  - ☑ Assign a "quiet" student to track time.  

  **Final Tip**: After class, email students Dennett’s "Quining Qualia" and Chase/Sanborn’s "The Whiteness of the Whale" to formalize the demo’s moves.  

  ---  
  This design makes the problem *lived*: students don’t just hear about evaporation, they sweat it. The cross-exam rules prevent free-for-alls, and the debrief ties loose ends. Run it tight, and they’ll feel the qualia dissolve.
