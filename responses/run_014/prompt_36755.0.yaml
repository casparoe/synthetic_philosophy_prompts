answer: |-
  Your argument cleverly applies Condorcet's jury theorem to suggest that global referendums could settle open mathematical problems. However, the flaw lies in step (3), which claims that for almost any binary question, a vast electorate (e.g., all adults) can be assembled where each member has a probability \( p > 0.5 \) of being correct, based on some heuristic with a slightly positive track record. This step fails because it overgeneralizes the applicability of heuristics to questions where voters lack any meaningful basis for competence, such as highly specialized or open problems like the Riemann hypothesis.

  ### Why Step (3) is Invalid:
  - **Heuristics do not generalize to all questions**: While heuristics like "defer to mainstream experts" or "prefer simpler theories" may yield \( p > 0.5 \) across a broad set of questions where those heuristics are applicable (e.g., settled scientific facts or everyday decisions), they often provide no advantage for specific, esoteric questions. For open problems in mathematics or science:
    - There is no expert consensus to defer to (experts are actively debating the answer).
    - Notions like "simplicity" are ill-defined or irrelevant (e.g., for the Riemann hypothesis, neither truth nor falsity is clearly "simpler," and simplicity does not reliably correlate with truth in advanced mathematics).
    - Most voters lack domain-specific knowledge, rendering their judgments effectively random (\( p \approx 0.5 \)) or even counter-productive (\( p < 0.5 \)) due to misconceptions.
  - **Competence is question-specific**: The jury theorem requires \( p > 0.5 \) for each voter on the specific binary question at hand. Step (3) incorrectly assumes that because heuristics have a positive track record *on average* across some questions, they confer competence *on every question*. This is not true; a heuristic's performance is context-dependent. For instance:
    - On the Riemann hypothesis, a non-expert using "defer to experts" has no signal to defer to, so their vote is random.
    - Similarly, "prefer simpler theories" might mislead on complex mathematical conjectures where simplicity has no consistent truth-connection.
  - **Empirical reality**: Global electorates include billions with no exposure to advanced mathematics. On such topics, most voters would guess randomly or rely on irrelevant biases, violating the competence condition. Even if some heuristics exist, they may not apply to the question, or their aggregate effect might not yield \( p > 0.5 \) for all voters.

  ### What Rejecting Step (3) Costs:
  - **Cost to the argument**: Without step (3), the conclusion (7) that plebiscites should settle open questions collapses. The jury theorem cannot be invoked for questions where voters lack competence, so referendums on topics like the Riemann hypothesis would not converge to truth.
  - **Cost to the broader democratic ideal**: Rejecting step (3) does not undermine the jury theorem's value for democracy in general. The theorem still explains why large, diverse electorates can outperform experts on many *non-esoteric* decisions (e.g., policy choices, elections, or factual questions with accessible heuristics). For instance:
    - Voters can use retrospective heuristics (e.g., "vote against incumbents in economic downturns") or local knowledge that correlates with truth.
    - The theorem remains relevant because, in democratic contexts, questions often allow for competence through shared experiences, cultural knowledge, or reliable shortcuts.
  - **No loss to the theorem's core insight**: The jury theorem's "democratic moral"—that diverse, independent groups with slight individual competence can achieve high collective accuracy—survives intact for domains where heuristics are genuinely applicable. Rejecting step (3) simply acknowledges that not all questions are amenable to this process; it does not require abandoning the competence condition or the theorem's application to real-world democracy.

  ### Why Other Rejections Are Less Compelling:
  - **Denying independence (step 4)**: Procedural independence (secret ballots, etc.) does not ensure statistical independence if voters share common influences (e.g., media, culture), which could correlate errors. However, rejecting step (4) would indeed damage the theorem's democratic application by suggesting no real election satisfies independence—a cost you rightly wish to avoid. Moreover, for this argument, competence is the primary issue; even with independence, low competence dooms the referendum.
  - **Denying step (2)**: Insisting that competence requires deep understanding would save step (3) but at high cost: it narrows the jury theorem to only informed voters, gutting its power to show how democracies leverage "mediocre" individuals. This is unnecessary, as heuristics can work for many questions—just not all.
  - **Denying step (1) or (6)**: These are mathematically sound or follow logically if premises hold, so rejecting them is unwarranted.

  ### What Survives of the Jury Theorem's Democratic Value:
  The theorem retains its epistemic force for democratic decisions where voters have access to relevant heuristics (e.g., voting on economic policies using personal experience or trusted sources). It explains why large groups can be wise on such issues, justifying democratic processes over expert rule in those domains. The flaw in your argument is not with the theorem itself, but with overextending it to questions beyond voters' collective competence.

  \answer{step 3: competence not general}
