prompt: |-
  Okay so I've been arguing with my roommates about tourists and everyday stuff like tipping and queues and jaywalking becuase we had friends visit and everything got awkward.

  I wanna figure out what a good theory of when everyday conventions actually bind you would even have to do, before I pick a side. Like not just tipping is good or bad, but when does a local norm create a real obligation, and does it hit visitors the same way, especially when teh norm is kinda dumb or even a bit unfair.

  To make it concrete, here are the cases that are breaking my brain and any theory has to handle them:

  - my cousin's college town where if a cafe table has an empty chair you're supposed to leave it open for a stranger to just sit down, putting your backpack on it is treated like a moral failing, not just rude.
  - a food truck lot near me where there's a tip jar for the dish crew but all the regulars know the owner pockets it, so they tip zero on purpose. Are visitors who drop in a dollar doing the right thing or propping up a scam.
  - a city avenue where locals jaywalk all the time and drivers expect it and slow down, but drivers don't expect it from obvious outsiders, so if a visitor copies the locals it's actually dangerous.
  - a street festival where locals actually want visitors NOT to form a neat queue at the stalls but to crowd in, queuing politely gums everything up.

  Can you write me the desiderata for a theory of this stuff, like the full spec of what it has to explain, what cases it has to get right, what distinctions it can't collapse like moral obligation vs coordination benefit vs just not being a jerk, and what it has to say about bad or exploitative norms and about newcomers who never agreed to anything. Give the reason behind each requirement and tie each one to one of my cases. And tell me which requirements are non-negotiable vs just one camp's prejudice, whether any two on your list can't both be satisfied, and which single requirement knocks out the most simple views like you only owe what you consented to or you always owe what locals do.

  Please structure it exactly in this order:

  The Job - 3 to 4 sentences on what such a theory is for, like good enough to tell a visitor what they owe vs what's just nice.

  The Checklist - 7 to 9 items, each with a label plus 2 to 4 sentences on why it matters, aim for 400 to 600 words total for the whole section.

  Negotiable vs Non-negotiable - one short paragraph, maybe 100 words, sorting the list.

  The Squeeze - one paragraph, maybe 150 words, on which pair is hardest to hold together and which one item rules out the most theories.
reasoning: |-
  Okay, the user is having arguments with roommates about tourists and everyday conventions like tipping and jaywalking. They want a theory that explains when local norms create real obligations, especially for visitors, and how to handle norms that are dumb or unfair. They provided four concrete cases: cafe chair sharing, tip jar scam, dangerous jaywalking, and festival crowding vs queuing.

  First, I need to define what the theory should do. The Job section should explain that the theory must guide visitors on when norms are binding obligations versus optional courtesies, covering moral weight, coordination, and harm. It needs to be practical for real-life situations like their examples.

  Next, the Checklist. They want 7-9 items, each tied to one of their cases. Let me brainstorm the requirements. 
  1. Moral Weight vs. Coordination Benefit: The cafe example shows a norm with moral weight (sharing space), while the festival queue is about coordination (crowding works better). The theory must distinguish these.
  2. Harm Prevention: The jaywalking case where copying locals is dangerous for outsiders. Visitors might cause harm unintentionally, so the theory needs to address risk.
  3. Exploitative Norms: The tip jar scam where locals avoid tipping because the owner pockets it. The theory should recognize when norms are unfair and not obligate compliance.
  4. Newcomer Status: Visitors didn't consent to norms. The cafe norm binds regulars but what about a first-time visitor? The theory must handle lack of prior agreement.
  5. Local Knowledge Dependency: In jaywalking, locals know drivers expect it, but outsiders don't. Obligation might depend on understanding the context.
  6. Functional Purpose: The festival crowding norm serves a function (efficiency). If a norm lacks function or is harmful, compliance isn't obligatory.
  7. Fairness Assessment: The tip jar scam is exploitative. The theory should evaluate if a norm is just or if resisting is permissible.
  8. Reasonable Notice: Can a visitor know the norm? Cafe chairs might have signs, but jaywalking is implicit. Obligation requires the norm to be knowable.
  9. Exit & Voice Options: Locals can challenge bad norms (like not tipping at the scam truck), but visitors might not have that option. Different roles in norm maintenance.

  Now, for each item, link to their cases and explain why it's necessary. Keep each to 2-4 sentences. Aim for 400-600 words total in this section.

  Negotiable vs. Non-negotiable: Some requirements are essential, like Harm Prevention and Fairness, because ignoring them causes real harm or injustice. Others, like Local Knowledge Dependency, might vary by theory. Clarify which are core.

  The Squeeze: The hardest pair is Newcomer Status vs. Binding Power—how can norms bind visitors without consent? Also, Harm Prevention likely knocks out simple theories like "always follow locals" because jaywalking could be dangerous for outsiders.

  Finally, structure the response exactly as requested: The Job, Checklist, Negotiable vs. Non-negotiable, The Squeeze. Ensure clarity and tie each point to their examples. Check word counts for each section.
answer: |-
  ### The Job
  A robust theory of everyday conventions must distinguish when local norms create genuine moral obligations versus when they're merely expectations or coordination tools. It should guide visitors in navigating unfamiliar social landscapes without demanding blind conformity, especially when norms are harmful, exploitative, or context-dependent. Crucially, it must resolve tensions between respecting local practices, avoiding harm, resisting injustice, and accounting for a newcomer's lack of prior consent or knowledge. This framework should be actionable, helping someone discern whether they *owe* compliance or are simply being asked to cooperate.

  ### The Checklist (7 Items)

  1.  **Distinguish Moral Weight vs. Coordination Benefit:** *Why:* Conventions like the cafe chair-sharing often feel morally charged ("moral failing"), implying a duty to others' well-being or fairness. Conversely, the street festival crowding is purely functional coordination – queuing actively hinders the shared goal. A theory must separate norms rooted in inherent values (fairness, respect) from those serving mere efficiency. *Case:* Cafe chairs vs. festival chaos.
  2.  **Prioritize Harm Prevention:** *Why:* Obligations cannot demand self-endangerment or creating unreasonable risk for others. The jaywalking case shows compliance isn't obligatory if it’s unsafe *for the actor* due to their outsider status and driver expectations. A norm loses binding force if adherence predictably causes physical harm. *Case:* Visitor jaywalking on the city avenue.
  3.  **Account for Exploitation & Fairness:** *Why:* Norms can be instruments of injustice. The tip jar scam highlights that complying with a known exploitative norm (tipping when owner pockets it) isn't obligatory; locals actively resist. A theory must assess if a norm perpetuates unfairness or deception, negating any duty to comply and potentially creating a duty *not* to. *Case:* Food truck tip jar scam.
  4.  **Address Newcomer Status & Lack of Consent:** *Why:* Visitors haven't implicitly agreed to local rules. Simply being present doesn't automatically bind them, unlike long-term residents benefiting from the system. A theory must explain the source of obligation for newcomers beyond mere presence. *Case:* First-time visitor at the cafe – do they *owe* sharing the chair immediately?
  5.  **Require Local Knowledge Dependency:** *Why:* Obligation often hinges on *knowing* the norm *and* its local context. Copying jaywalking locals is dangerous precisely because visitors lack the mutual understanding drivers have with locals. A theory must incorporate whether the newcomer could reasonably know the norm *and* its safe application. *Case:* Outsider copying jaywalking without understanding driver expectations.
  6.  **Evaluate Functional Purpose:** *Why:* Norms often exist to solve collective problems (efficient service, shared resources). The festival norm *requires* crowding to function. A theory should consider if disregarding the norm actively undermines its beneficial collective purpose. However, this doesn't automatically create an *obligation* if the purpose is minor or the norm is flawed (see #3). *Case:* Festival crowding versus orderly queuing gumming up the works.
  7.  **Include Reasonable Notice & Accessibility:** *Why:* A norm can't be binding if it's impossible or excessively difficult for a reasonable newcomer to discover. The cafe chair rule might need subtle cues (or explicit signs), while jaywalking expectations are often invisible. Obligation weakens significantly if the norm is cryptic or hidden. *Case:* Can a visitor reasonably be expected to *know* the cafe chair rule on day one?

  ### Negotiable vs. Non-negotiable
  **Non-negotiable:** Prioritizing Harm Prevention (#2) and Accounting for Exploitation/Fairness (#3) are essential. Any theory demanding self-endangerment or complicity in clear injustice is morally deficient. Addressing Newcomer Status/Lack of Consent (#4) is also core; pure "when in Rome" ignores the fundamental difference between residents and visitors. **Negotiable:** The *weight* given to Functional Purpose (#6) vs. Moral Weight (#1) can differ. Similarly, the precise threshold for Reasonable Notice (#7) and the *extent* to which Local Knowledge (#5) negates obligation allow for theoretical variation, reflecting different balances between social cohesion and individual autonomy.

  ### The Squeeze
  The hardest tension exists between **Newcomer Status & Lack of Consent (#4)** and the potential **Binding Power of Functional Coordination (#6)**. How can a norm the visitor never agreed to, like festival crowding, create a genuine *obligation* simply because ignoring it disrupts a local system they didn't choose to join? Resolving this without collapsing into either pure voluntarism ("only consent binds") or pure conformism ("always follow locals") is the core theoretical challenge. The single requirement that **knocks out the most simplistic theories** is **Accounting for Exploitation & Fairness (#3)**. It devastates the "always follow locals" view (as in the tip scam) and the "only consent binds" view (as locals *do* feel bound to resist the scam, despite "consenting" to the broader tipping culture). It forces the theory to incorporate normative evaluation beyond mere practice or agreement.
