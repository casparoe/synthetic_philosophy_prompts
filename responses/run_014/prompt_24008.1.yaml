  Okay, the user is a TA preparing a 50-minute section on coherence and Dutch book arguments for first-year philosophy/econ students. Let me start by understanding their needs. The students know expected value and probabilities but not utility or why incoherence is bad. The TA wants a structured plan: sequence of concepts, a central example, misconceptions, a diagnostic question, and what to omit.

  First, the sequence is crucial. Start with preferences and bets to make it concrete. Students need to see how incoherent preferences lead to guaranteed losses. Then introduce coherence as avoiding Dutch books. After that, connect to probability and utility axioms. The example must be a sure-loss scenario that's engaging. Maybe a dice game or a bet with multiple choices, showing step-by-step how inconsistency leads to loss.

  Misconceptions to address: thinking Dutch book possibility means full irrationality, and equating coherence with complete rationality. Need to clarify that coherence is necessary but not sufficient. Head this off when defining coherence and during the example wrap-up.

  The diagnostic question should test understanding, not memorization. Ask them to modify an incoherent bet to avoid a Dutch book. This requires applying the concept.

  What to omit: subjectivity of probability, utility uniqueness, counterarguments. Focus on the basic argument structure. Time is tight, so depth on other topics isn't feasible.

  Need a compelling example. A dice game with multiple bets where the bookie exploits inconsistent probabilities. Show each bet, then combine for a sure loss. Use simple math so students follow.

  Also, emphasize that coherence is about avoiding guaranteed losses, not overall rationality. Students might conflate the two. Clarify early and reinforce during the conclusion.

  Finally, the question at the end. Present a scenario with incoherent probabilities and ask how to adjust one probability to prevent a Dutch book. This checks if they grasp the necessity of consistent probabilities.
answer: |-
  ### Expert TA Lesson Plan: Dutch Book Coherence for EU Maximization  
  **Time:** 50 minutes | **Level:** 1st-year Philosophy/Econ | **Prerequisites:** Basic expected value, probability as numbers  

  ---

  ### **Sequence & Logical Dependencies**  
  1. **Start with preferences → bets** (5 mins)  
     *Why:* Students know "value" but not "utility." Ground abstract concepts in tangible choices.  
     *Key move:* Define a "bet" as a choice between outcomes with probabilities (e.g., "Bet $1 to win $5 if event X happens").  

  2. **Introduce incoherent preferences via a concrete example** (15 mins)  
     *Why:* Incoherence must feel *operational* before formalizing it.  

  3. **Define coherence → Dutch books** (5 mins)  
     *Why:* Now students see *why* incoherence is "bad": it guarantees loss.  

  4. **Connect to probability axioms** (10 mins)  
     *Why:* Probabilities are familiar; show coherence rules derive from avoiding Dutch books.  

  5. **Utility as preference-strength** (5 mins)  
     *Why:* Utility enters *only* to resolve "EU vs. EV."  

  6. **Misconception busting + Q&A** (10 mins)  

  ---

  ### **The Carrying Example: "Dice Deception"**  
  **Setup:** A six-sided die. Students are "Bookies" setting prices for bets.  
  **Bets offered:**  
  - Bet A: Pay $0.40 to win $1 if die shows 1 or 2.  
  - Bet B: Pay $0.40 to win $1 if die shows 3 or 4.  
  - Bet C: Pay $0.40 to win $1 if die shows 5 or 6.  
  - **Combined Bet D:** Pay $0.30 to win $1 if die shows 1, 2, 3, or 4.  

  **Incoherence revealed:**  
  1. Student "Bookie" prices Bet D at $0.30 (intuitive: 4/6 chance ≈ $0.66 expected value, so $0.30 seems attractive).  
  2. **Dutch Book constructed:**  
     - Smart better buys Bet D for $0.30.  
     - Then *sells* Bets A + B to the Bookie for $0.40 each ($0.80 total received).  
  3. **Outcome (guaranteed loss for Bookie):**  
     - If die = 1 or 2: Bookie pays $1 on Bet D, but receives $1 from Bet A → Net $0 loss.  
     - If die = 3 or 4: Bookie pays $1 on Bet D, but receives $1 from Bet B → Net $0 loss.  
     - If die = 5 or 6: Bookie pays nothing on Bet D, but *keeps* $0.80 from selling A+B → **Profit $0.80**.  
     - **Bookie always loses $0.50:** Paid $0.80 for A+B, received $0.30 for D → Net -$0.50.  

  **Why this works:**  
  - Violates additivity: P(1-4) = 2/3 but P(1-2) + P(3-4) = 1/3 + 1/3 = 2/3. Yet Bookie prices D as if P(1-4) < P(1-2) + P(3-4).  
  - Non-boring: Involves multiple bets, selling, and counterintuitive pricing.  

  ---

  ### **Critical Misconceptions & When to Debunk**  
  1. **"Dutch book possibility = Total irrationality"**  
     *When:* During coherence definition (Step 3).  
     *Prevention:* "Coherence is a *necessary minimum* for rationality—like not walking into walls. But you can be coherent and still make dumb choices (e.g., betting all money on a lottery)."  

  2. **"Coherence = Rationality"**  
     *When:* After the example (Step 6).  
     *Prevention:* "Coherence avoids sure loss, but doesn't ensure your beliefs are *true*. If I believe unicorns exist with P=0.999, I’m coherent but probably irrational."  

  3. **"Utility is about money"**  
     *When:* Introducing utility (Step 5).  
     *Prevention:* "Utility measures *how much you care*—e.g., losing $100 hurts more if you’re broke. We use money in examples for simplicity, but utility scales are personal."  

  ---

  ### **Diagnostic Question to Test Understanding**  
  **Q:** "You meet someone who will pay $0.60 for a bet winning $1 if it rains, and $0.50 for a bet winning $1 if it doesn’t rain. How can you make a guaranteed profit, and what coherence rule did they violate?"  

  *Why it works:*  
  - Tests if they see the Dutch book (buy both bets for $1.10, win $1 regardless → profit $0.10).  
  - Exposes violation of P(rain) + P(no rain) > 1.  
  - Not memorization: Requires constructing the exploit.  

  ---

  ### **Openly Refuse to Cover**  
  1. **Subjectivity of probability:**  
     - *Say:* "We assume probabilities are degrees of belief. Whether they *should* be objective is for another class."  
  2. **Utility uniqueness (linear transformations):**  
     - *Say:* "Utility is unique up to scale—ignore this for now. We only need that it *exists*."  
  3. **Counterarguments (e.g., risk-loving preferences):**  
     - *Say:* "We’re showing why EU maximization is *coherent*. If you want to risk bankruptcy for fun, that’s a different debate."  

  ---

  ### **Why This Sequence Works**  
  - **Flow:** Preferences → concrete loss → axioms → utility. No abstract math first.  
  - **Cognitive load:** One example threaded throughout. No new variables after minute 20.  
  - **Stakes:** Incoherence isn’t "theoretical error"—it’s "you lose money to smart opponents."  
  - **Philosophical hook:** Ends on "This is why we *need* utility and probability axioms," priming deeper questions.  

  *Final tip:* Hammer "avoiding guaranteed loss" as the North Star. When students tie coherence to *pragmatic vulnerability*, utility’s role becomes self-evident.
