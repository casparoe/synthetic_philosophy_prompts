  I've been reading about the claim that the Solomonoff prior is "malign" and I keep coming back to the same objection, and I think its just a category error. A prior is a probability distribution over hypotheses. It doesn't do anything. It doesn't want anything. The fact that it gives high weight to short programs doesn't mean those programs are acting in the world or have any incentives. So how can a probability distribution be "malign"? It's like saying a thermometer is evil because its readings correlate with fever. Am I missing something, or is this the right objection and the whole "malign prior" thing is just alarmism?

  I want your answer in four sections, in this order. First, "The presupposition" — a short paragraph, under a hundred words, identifying the specific confusion in my question. Second, "The actual argument" — the main section, maybe three or four hundred words, explaining the real argument that the Solomonoff prior is malign, in a way that doesn't require the prior to literally be an agent. I'm especially interested in the part about consequentialist programs sitting inside the universal prior, since that's the bit I've seen waved at but never had spelled out. Third, "Where I was wrong" — a medium section, a hundred fifty to two hundred words, connecting the actual argument back to my specific objection, including the thermometer analogy. Fourth, "What I can still object to" — a short section giving me a fair, non-sophisticated objection that survives the correction, so I don't feel like I have to just capitulate.
