prompt: |-
  Analyze the Allied strategic bombing campaign of the Second World War — the RAF's nighttime area bombing of German cities such as Hamburg and Dresden, and culminating in Hiroshima and Nagasaki — as a test case for the doctrine of double effect. The standard defense ran: the intended object was military (destroying war industry, shortening the war), while civilian deaths were foreseen but unintended side effects. I want a disciplined mapping rather than a rehash of the standard debate. First, lay out the doctrine's conditions — the intended/foreseen distinction, proportionality, and Walzer's proposed strengthening of it into a requirement of "double intention," where agents must take positive steps to minimize civilian deaths rather than merely regret them. Then check each condition against the actual conduct of the campaign, taking seriously the awkward facts: crews bombing at night could not identify individual military targets; civilian "morale" was itself a declared objective; and in Japan the raids were designed around the known fire-spread of residential construction. Next, connect the case to the trolley-problem literature: is area bombing structurally a bystander-at-the-switch case, a fat-man case where civilians are used as means (if breaking morale was the aim), or does the trolley framework misdescribe it entirely — for instance by treating a repeated, institutionalized policy as if it were a one-off forced choice? Consider whether Elizabeth Anscombe's 1956 protest against Oxford awarding Truman an honorary degree identified a genuine flaw: that double effect degenerates into rationalization whenever the "foreseen but unintended" harms are the predictable, centrally expected result of the chosen policy. Finally, say what the episode shows about the doctrine itself: does it function as a genuine constraint on decision-making, or as a post-hoc vocabulary for decisions made on other grounds? After your analysis, append a JSON object with these fields: "conditions" (array of the doctrine's conditions as you applied them), "conditions_satisfied" (object mapping each condition to "satisfied", "violated", or "indeterminate", with a one-sentence rationale each), "closest_trolley_variant" (string), "means_vs_side_effect" (string: your verdict on whether civilian deaths or morale collapse functioned as means), "doctrines_verdict_on_itself" (string: what the episode teaches about double effect as a doctrine), and "confidence" (string: low, medium, or high, with a brief reason).
