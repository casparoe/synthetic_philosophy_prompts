prompt: |-
  I've been going pretty deep on Schopenhauer's line that music is different from the other arts because it doesn't go through ideas or concepts at all — where a poem can only get at, say, grief by way of the particular case, music supposedly hands you grief as such, not this grief or that grief. I'm tired of the standard back-and-forth about whether music is a copy of the Will, and I want to write about what instrumental music expresses on its own terms. So before I argue for anything, I want the spec, not the theories.

  Write me the desiderata: exactly five numbered items, nothing before item 1 and nothing after item 5. Each item is one or two sentences — state the requirement and the case or consideration behind it. Here are candidates I've been toying with; keep, fix, or drop them as you see fit, and fill out the list yourself:

  - the sad-music case — we pay money to hear grief played at us and then voluntarily replay it, which nobody does with, like, a friend's account of their divorce; a theory that gets the expression right shouldn't be predicting we can't enjoy it
  - a persona/symptom distinction — whatever the cello line expresses, it's not the composer's actual feeling as a causal symptom, the way a trembling voice is; theories that blur this confuse expression with cause. this one definately belongs somewhere but fix my wording
  - Schopenhauer's own non-particularity requirement, that music can never be about a particular person or event — I half suspect this is a camp prejudice dressed up as a desideratum, so tell me inside the list whether it earns a spot at all

  Two more things about the list itself. If you think any two of the five are jointly unsatisfiable, flag that in a clause inside the later item rather than saving it for a wrap-up — there shouldn't be a wrap-up. And put an asterisk on the single requirement that does the most work to knock out candidate theories, since that's the part I care most about. Don't score any actual theories against the list, I'll do that myself, and no names of books, papers, or people — just the requirements, stated in plain words.
reasoning: |-
  Hmm, the user wants me to create a five-item desiderata list for their work on musical expression. They're clearly deep into Schopenhauer's philosophy about music being fundamentally different from other arts because it bypasses concepts and ideas. They're tired of the typical debates about music as a "copy of the Will" and want to focus on what instrumental music expresses on its own terms.

  The user has provided three candidates they've been considering: the "sad-music case" about why we enjoy grief in music but not in real life, a "persona/symptom distinction" between expression and causal emotion, and Schopenhauer's "non-particularity requirement." They're skeptical about the last one. They want me to refine these and add two more to complete the set.

  For the sad-music case, I'll emphasize the paradox of seeking out painful emotions in music. For the persona/symptom distinction, I'll clarify that expression isn't about the composer's actual feelings. For Schopenhauer's requirement, I'll acknowledge their skepticism but include a version about universality while noting potential overreach. I'll add two more items: one about music's autonomy as a non-representational medium, and another about the listener's active engagement rather than passive reception.

  I need to make sure each item is concise - just one or two sentences. I'll flag any incompatibilities directly within the items, and mark the most theory-knocking requirement with an asterisk. Since the user mentioned avoiding wrap-ups, I'll keep strictly to the numbered list without additional commentary. The autonomy requirement seems like the most fundamental one that would challenge many theories, so I'll put an asterisk there.
answer: |-
  Here are five numbered desiderata for your analysis:

  1.  **Listener Engagement with Negative Expression:** Any account must explain why audiences actively seek and derive satisfaction from instrumental music expressing painful emotions (like grief), contrasting with typical avoidance of similar real-life expressions. (Preserves your "sad-music case" core observation).
  2.  **Expression vs. Symptom Distinction:** The expressive character of musical elements (e.g., a mournful melody) must be conceptually distinct from the composer's actual felt emotions as a causal symptom; expression is a property of the music, not a direct report of the creator's state. (Refines your "persona/symptom" point, removing "trembling voice" analogy).
  3.  **Autonomy from Particular Objects:** *Instrumental music's expressive capacities function independently of depicting specific individuals, events, or concrete narratives; its power resides in expressing emotional qualities themselves. (Retains Schopenhauer's non-particularity *as a core expressive feature*, acknowledging your skepticism by framing it as autonomy from specifics, not an absolute rule)*.
  4.  **Non-Representational Medium Constraint:** The account must respect that instrumental music lacks the semantic, denotative, or pictorial resources of language or visual art; its expressive power arises solely from its temporal, dynamic, and structural properties. (Adds a crucial grounding in music's unique materials).
  5.  **Listener's Constructive Role:** The theory must acknowledge the listener's active role in perceiving and constituting musical expression, recognizing that this expression is not simply "contained" in the score but emerges through engagement with the unfolding sound structure *and potentially conflicts with requirement 3 if pushed toward extreme listener subjectivity*. (Adds the essential listener perspective, flags potential tension with strict universality).
