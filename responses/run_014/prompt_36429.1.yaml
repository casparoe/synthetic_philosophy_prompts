prompt: |-
  ok so I'm a high school junior who fell down a physics rabbit hole after watching a video about string theory. everybody admits nobody has ever testet it directly and maybe no one ever will, but the people who work on it seem genuinly convinced anyway. and when you dig into WHY they're convinced, it's basically never "it predicted X and we saw X". instead I keep hearing the same three moves, roughly:

  1. "we've been trying to find ANY alternative that could do what this does for like 40 years, with a lot of smart people seriously trying, and nobody has come up with one -- so the best explanation for our own failure is that the theory is right." which sounds insane at first, like straight up arguing from ignorance, but they insist it's different because it's not that nobody looked, it's that a real coordinated search came up empty.

  2. "the theory turned out to contain stuff we didn't put in." like they built it for one purpose and then gravity or some symmetry they never asked for shows up in it for free, and they treat that unearned bonus as if it were confirmation.

  3. "look at how theories like this got trusted before." other theories got believed the same way, by indirect signs, before anyone could test them, and then later turned out right, so this one inherits some credit by analogy.

  and the part that bugs me is that none of these are predictions. nothing new about the world gets checked. it's all evidence ABOUT the theory, not evidence FROM the theory. so my question: is there an actual name in philosophy of science for treating this kind of stuff as confirmation of a theory? if there is, I want to know exactly which of the three moves the name covers -- all of them, or just some -- and how it's supposed to be different from the plain "absence of evidence isn't evidence of absence" thing, and from just finding a theory pretty. if there's no established name covering it, then say so plainly and coin one, with a definition and a note on which of the three moves it fits and which it doesn't. don't just drop a single term and dip, I want the actual carving of what this phenomenon is and isn't.

  also, if you can, put your final answer in a machine-readable form on the very last line, like \answer{...} with the name (or "no established name") plus a few words saying which of the three moves it covers. the rest of the answer can be normal prose.
