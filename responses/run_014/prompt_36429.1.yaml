answer: |-
  Your frustration with the "moves" used to justify string theory is spot-on and highlights a deep tension in modern theoretical physics. Philosophers of science *have* grappled with this, and there **is** an established term covering these specific arguments: **Non-Empirical Theory Assessment (NETA)**, often specifically **Non-Empirical Confirmation**.

  Here's the breakdown:

  1.  **The Term & Its Scope:**
      *   **Non-Empirical Theory Assessment (NETA) / Non-Empirical Confirmation:** This term explicitly refers to arguments used to support a scientific theory that are *not* based on novel empirical predictions being tested and confirmed. Instead, they rely on features *about* the theory itself, its relationship to existing knowledge, its uniqueness, or the history of science.
      *   **Coverage:** NETA **covers all three of your moves**. They are recognized as distinct but interconnected strategies within this category:
          *   **Move 1 (No Alternatives After Exhaustive Search):** This is often called the **"Argument from No Alternatives"** or the **"Uniqueness Argument"**. Philosopher Richard Dawid (a key figure formalizing NETA for string theory) argues this isn't *just* an argument from ignorance because it involves a *sociological fact* about a sustained, intense, and resource-intensive research program failing to find viable alternatives within a specific framework. The claim is that this *failure itself* becomes evidence that the theory might be on the right track, especially when combined with other non-empirical arguments.
          *   **Move 2 (Unexpected Explanatory Power/Unification):** This is often framed as **"Explanatory Coherence"**, **"Unification"**, or the **"Unexpected Explanatory Bonus Argument"**. The appearance of gravity, specific symmetries, or other fundamental features *without being put in by hand* is seen as highly significant. It suggests the theory has deep internal consistency and explanatory reach, potentially unifying disparate phenomena. This resonates with the "No Miracles" argument for scientific realism – it would be a miracle if such a rich structure accidentally reproduced known physics.
          *   **Move 3 (Historical Analogy):** This is called the **"Meta-Inductive Argument"** or **"Pessimistic Meta-Induction Counterargument"**. It leverages the historical record: theories that achieved significant non-empirical support (like general relativity's internal consistency and mathematical elegance before key tests, or the quark model before deep inelastic scattering) often *were* later empirically confirmed. The argument is that the *pattern* of justification used historically for successful theories is similar to the justification for string theory, making its success more plausible. Dawid explicitly includes this as a pillar of his NETA framework.

  2.  **How it Differs:**
      *   **From "Absence of Evidence isn't Evidence of Absence":** This adage critiques *passive* ignorance. Move 1 is fundamentally different: it claims *active, strenuous, expert failure* to find alternatives (despite strong motivation) *is* positive evidence *for* the existing theory, *within the context of the other arguments*. It shifts the burden: the failure isn't passive; it's seen as the result of a comprehensive search implying the theory might be uniquely viable. NETA proponents argue this transforms it from mere absence into a *positive signal*.
      *   **From "Just Finding a Theory Pretty" (Aesthetic Judgement):** While aesthetic appeal (elegance, simplicity, beauty) often plays a role in theory choice, NETA arguments claim something stronger and more objective:
          *   Move 1 involves a sociological/empirical claim about the research landscape.
          *   Move 2 points to concrete, unexpected *explanatory successes* within the theoretical structure itself (deriving gravity, specific symmetries).
          *   Move 3 relies on historical *patterns* of confirmation.
          While aesthetics might influence *why* physicists pursue certain theories or find the unexpected bonuses appealing, the NETA arguments themselves are framed as more robust forms of reasoning based on the theory's performance *as a theory* and the history of science.

  3.  **The Core Idea of NETA:**
      NETA rests on the idea that science, especially in domains where direct empirical testing is extremely difficult or currently impossible (like quantum gravity or the very early universe), needs other criteria for theory assessment. These criteria focus on the theory's *internal virtues* (consistency, explanatory power, unification), its *external relations* (fit with established knowledge, inability to find alternatives), and *meta-scientific considerations* (historical patterns). The claim is that a strong confluence of such non-empirical arguments can provide legitimate, albeit provisional and fallible, confirmation or support for a theory *in the absence of direct empirical tests*.

  **Crucial Caveat:** NETA is **highly controversial** within philosophy of science. Critics argue:

  *   It fundamentally violates the core principle of empirical science: theories must be testable against observation/experiment.
  *   The "Argument from No Alternatives" assumes the search space is well-defined and adequately explored, which might not be true.
  *   Historical analogy is weak – past success doesn't guarantee future success, and failed theories (e.g., Ptolemaic epicycles) also had periods of strong non-empirical support.
  *   It risks insulating theories like string theory from falsification.

  **In Summary:** The established name covering the specific arguments you listed is **Non-Empirical Theory Assessment (NETA)** or **Non-Empirical Confirmation**. It explicitly encompasses all three "moves" as distinct but related strategies used to support a theory when direct empirical testing is not feasible. It differs from simple "absence of evidence" by emphasizing *active, expert failure* to find alternatives despite intense effort. It differs from mere aesthetic appeal by grounding arguments in claims about the theory's explanatory performance, uniqueness, and historical patterns of scientific justification.

  \answer{Non-Empirical Theory Assessment covering all three moves}
