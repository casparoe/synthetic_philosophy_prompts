prompt: |-
  I administer a grantmaking fund of roughly two million dollars a year, and for several cycles I have scored candidate programs using the familiar three-factor scheme — importance, tractability, neglectedness — multiplying the three and funding in descending order of the product. I have lost confidence in the scheme but not in my own decisions, so I want to work in the other direction: here are the allocations I actually made, with the reasoning I gave myself at the time, and I would like to know what principle, if any, they add up to.

  1. A program delivering a cheap and well-evidenced intervention in a region where three large institutional funders had already committed to covering most of the cost. My grant would have displaced money that was arriving regardless. Not funded, despite top marks on importance and tractability.

  2. The same intervention in a region no funder had entered, where local logistics made reliable delivery doubtful at any scale. Funded, but staged: a small first tranche whose explicit purpose was to test whether the tractability worry was correct, with the remainder conditional on what it showed.

  3. A program addressing a harm I take to be large and a method I take to be workable, which almost nobody pursues because the subject is treated as distasteful or fringe within the relevant research community, to the point that working on it damages careers. Funded generously.

  4. A program addressing a harm I likewise take to be large, which almost nobody pursues because the handful of people who have examined it closely have concluded that the central obstacle is not surmountable by any method now foreseeable. Not funded.

  5. A program whose direct effect is modest but which is highly visible, and where I could identify a mechanism by which my grant would bring several times its own value in follow-on funding within two years. Funded; I counted the follow-on money as most of the value.

  6. A program whose direct effect is likewise modest and whose main function would have been to signal that a cause area is serious, with no mechanism I could name by which other funders' money would arrive sooner or larger than it otherwise would, beyond general enthusiasm. Not funded.

  7. A program in which fifty thousand dollars would buy a large marginal effect, and in which five million dollars would buy perhaps four times that effect rather than a hundred times it. Funded at the lower level only, and I explicitly declined to treat the large version as the same opportunity.

  8. Two programs whose importance rested on a claim I accepted with roughly thirty percent confidence. In one, the claim was empirical — a disputed estimate of a baseline rate. In the other, the claim was moral — a disputed view about whose interests count. I discounted the first out of contention and funded the second. I cannot articulate why the two kinds of uncertainty seemed to me to differ in this way.

  9. A program that scored highest of all on the product of the three factors, which I funded, and which produced almost nothing measurable. I do not regret funding it.

  10. A program I funded two cycles ago and would not fund today, though nothing about its importance or tractability has changed; the only difference is that my own grant, and the attention it drew, made the area considerably less neglected. That verdict feels correct to me, which is awkward, since my having funded it is not evidence against its merits.

  My working hypothesis is that neglectedness has been doing two distinct jobs in my reasoning — an evidential one, as a proxy for how much my grant adds to what would otherwise happen, and a justificatory one, as a measure of how much deference the existing consensus deserves — and that cases 3 and 4 diverge precisely because the two jobs come apart there. I do not know how to keep them apart.

  What I am asking for:

  First, state one or at most three candidate principles precisely enough that a person who is not me could apply them to a program they had never seen. I want inputs, an order of operations, and a rule for what to do when the inputs conflict — not a restatement of the three-factor vocabulary. In particular, a principle whose operative claim is that what really matters is counterfactual impact does not answer my question unless it says how counterfactual impact is to be computed from the information I actually have, which is a description of a program, a budget level, and my views about the other funders in the area.

  Second, for each clause of each candidate, identify which of the numbered cases forced it in.

  Third, generate four further cases of your own on which the principle delivers a verdict I would find unwelcome, and state those verdicts. I am interested in where the principle bites, not in where it flatters me.

  Fourth, say plainly which of my ten verdicts the principle cannot accommodate. If the simplest principle requires me to abandon one member of the pair 3/4 or the pair 5/6, argue which member should go and what I would lose by giving it up; and if you instead prefer a principle that saves both, show me that the complexity it needs is not merely ad hoc bookkeeping.

  Fifth, tell me what the principle implies for a funder who knows that other funders are reasoning the same way. Cases 1 and 10 suggest that neglectedness is not a property of a cause area but of my position relative to everyone else's, and I want to know whether the principle is stable under simultaneous application by several funders who share it, or whether it generates a race that dissolves the very feature it tells them to look for.
reasoning: |-
  Hmm, this grantmaker has shared a fascinating case study of their funding decisions that challenge the standard ITN (Importance, Tractability, Neglectedness) framework. They've provided ten concrete scenarios where their actual funding choices diverged from what pure ITN multiplication would suggest, and they're looking for a more robust decision-making principle that captures their intuitive reasoning.

  Looking at their cases, several patterns jump out:
  - They clearly care about counterfactual impact - whether their grant actually adds value beyond what would happen anyway (cases 1,5,10)
  - They're sensitive to uncertainty and use staging/experimental approaches when tractability is doubtful (case 2)
  - They distinguish between different types of neglectedness - willingly neglected vs. neglected for good reason (cases 3 vs 4)
  - They consider leverage effects but demand concrete mechanisms (cases 5 vs 6)
  - They make nuanced decisions about moral vs empirical uncertainty (case 8)
  - They're comfortable funding high-risk/high-reward projects (case 9)

  The core tension seems to be between two interpretations of neglectedness: as a signal of high marginal value (if others aren't funding it, my dollar goes further) versus as a signal of low tractability (if others aren't funding it, maybe they know something I don't). The grantmaker's cases 3 and 4 perfectly illustrate this dichotomy.

  For a replacement principle, I'm considering a "Counterfactual Expected Value" framework that would formally incorporate:
  1) Expected direct impact
  2) Counterfactual additionality
  3) Information value
  4) Leverage potential
  5) Uncertainty discounting with staging options

  This would require operationalizing several new inputs beyond the basic ITN factors, like displacement risk estimates, leverage mechanisms, and separate handling of moral vs empirical uncertainty. The staging approach in case 2 suggests a practical way to handle tractability uncertainty.

  The stability question is particularly thorny - if all funders adopt this principle, does it create a coordination problem where everyone waits for others to fund first? The resolution might lie in the information value component - early funders capture learning benefits that later funders don't.

  For the test cases, I'll need to construct scenarios where this principle would force uncomfortable decisions - perhaps funding unpopular causes with weak evidence, or defunding successful programs prematurely. The moral/empirical uncertainty distinction in case 8 might be the hardest to systematize without introducing subjective bias.
answer: |-
  Based on your cases, your principle isn't multiplicative ITN, but **Counterfactual Expected Value with Information and Leverage Adjustments (CEV-IL)**. Here it is operationalized:

  ---

  **CEV-IL Principle:**
  1. **Estimate Baseline Expected Value (BEV):** `(Importance × Tractability)`, discounted by your confidence in these estimates.  
     *Inputs:* Scale of harm addressed (I), probability of success (T), confidence weight (0-100%).  
     *Discounting:* BEV = I × T × (confidence/100).  
     *Forced by:* Case 8 (discounting low-confidence empirical claims), Case 9 (funding despite low measurable output implies BEV isn't the sole driver).

  2. **Calculate Counterfactual Additionality (CA):**  
     *Inputs:*  
     - **Displacement Risk (D):** % likelihood your grant displaces other funding (0% = no displacement, 100% = full displacement). *Forced by Case 1 (D ≈ 100%).*  
     - **Neglectedness Leverage (NL):** Expected multiplier on your grant’s value from:  
       - *Follow-on funding* (if a concrete mechanism exists, e.g., matching grants, demonstrated success)  
       - *Information gain* (if uncertainty blocks larger funding)  
       - *Signaling* (only if linked to a specific leverage mechanism)  
       *Forced by:* Case 2 (NL from information gain), Case 5 (NL from follow-on mechanism), Case 6 (rejecting vague signaling), Case 10 (NL diminished post-funding).  
     - **Neglectedness Justification (NJ):** Binary (0 or 1). 0 if neglect is due to expert consensus on intractability; 1 if neglect is due to bias, coordination failure, or unexplored potential. *Forced by Cases 3 (NJ=1) vs. 4 (NJ=0).*  

     CA = [1 – D] × [1 + NL] × NJ  

  3. **Compute CEV-IL:** `CEV-IL = BEV × CA`  
     - Fund if CEV-IL > funding threshold; reject if CEV-IL ≈ 0 or negative.  
     - For marginal returns (Case 7): Evaluate CEV-IL *at the requested funding level*. If returns diminish sharply, fund only at lower levels.  

  4. **Staging Rule:** If Tractability confidence < threshold (e.g., 50%), fund a pilot (Case 2) and treat it as an information-gain lever (increasing NL for future tranches).  

  ---

  **Where It Bites: Unwelcome Verdicts**  
  1. **A program with high BEV (I=90, T=80) but NJ=0 (expert consensus: impossible).**  
     *Verdict:* Not funded. *Unwelcome because:* You might believe the experts are wrong.  

  2. **A program with low BEV (I=20, T=30) but high NL (a $50k grant triggers a $500k government contract via a binding agreement).**  
     *Verdict:* Funded. *Unwelcome because:* Direct impact is weak; you’re funding a "catalyst."  

  3. **A program in a non-neglected area (D=80%) with moderate BEV (I=70, T=60) and NJ=1 (experts avoid it due to bias).**  
     *Verdict:* Not funded (CA ≈ 0). *Unwelcome because:* The cause is worthy, but your grant displaces others.  

  4. **A program with high BEV (I=95, T=90) and CA=1, but requesting $1M when optimal scale is $100k (diminishing returns).**  
     *Verdict:* Fund at $100k only. *Unwelcome because:* They need the full amount to start.  

  ---

  **Clashes with Your Cases:**  
  - **Case 8 (Moral vs. Empirical Uncertainty):** CEV-IL discounts both equally (via confidence weighting). *To save Case 8, add:* **Moral Certainty Premium.** If moral claim uncertainty stems from underrepresentation of affected groups, do not discount BEV. Argue that empirical uncertainty is about facts (discounted), while moral uncertainty is about values (where neglected voices add information value). *Cost:* Introduces subjectivity.  
  - **Case 9 (No Regrets Despite Failure):** CEV-IL doesn’t capture this. *Solution:* Add **Option Value.** If a grant creates future opportunities (e.g., builds capacity, tests a worldview), add a fixed bonus to CEV-IL for exploration. *Cost:* Hard to quantify.  

  **Stability Under Multi-Funder Adoption:**  
  CEV-IL is *conditionally stable*.  
  - **Problem:** If all funders use NJ=1 (justified neglect), they race to fund the same "neglected" cause, destroying neglectedness (Case 10).  
  - **Solution:** NJ includes *dynamic neglect*: "Is this area neglected *given current funding pipelines*?" Funders must monitor pipelines. NL also adjusts: early funders capture high leverage (Case 5), late funders get less.  
  - **Equilibrium:** Funders specialize in "their" neglected niches (where they have leverage mechanisms) or stage grants (Case 2) to avoid races. Coordination (e.g., funding databases) improves stability.  

  ---

  **Summary:**  
  Your principle is **counterfactual impact, adjusted for evidence quality, leverage, and dynamic neglectedness**. It systematizes your intuition that not all neglect is equal (3 vs. 4) and impact isn’t just direct (5 vs. 6). The cost is requiring explicit estimates of displacement, leverage mechanisms, and neglect justification—but your cases show you already do this qualitatively. Complexity is justified: separating neglect’s roles (CA vs. NJ) avoids ad-hoc choices, and staging handles uncertainty. Under multi-funder use, it rewards first movers and requires market awareness, but won’t collapse.
