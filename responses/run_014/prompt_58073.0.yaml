  hey i'm a backend dev with zero philosophy background, got sucked into a rabbit hole while messing with a physics sim for a side project.

  a pop-sci blog i found explains the substantivalism vs relationism debate roughly like this: substantivalists think space is a real container that would still exist even if you deleted everything in it, relationists think space is just distances and relations between objects. Newton's bucket proves substantivalism because the water climbs up the sides when its spinning even though its not moving relative to the bucket, so it must be spinning relative to absolute space itself. And then Einstein's relativity kinda disproved all that and showed the relationists were right.

  is that a fair gloss? which bits would an actual substantivalist say are fine vs wince at, and does that Einstein point really follow? i'm especially confused because in my sim i can store either global coordinates or just pairwise distances and both seem to work, so i feel like i'm missing what the real disagreement is supposed to be.
