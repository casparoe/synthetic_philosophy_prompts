  The Kripkean's "bad argument" charge is dangerous. I should prep the user to isolate the substitutability premise upfront and contrast it with rigid designation. The reply must reframe the dialectic as testing name-function assumptions, not extension-fixing. 

  The textual fragmentation objection is tricky. The user isn't a sinologist, so conceding textual issues but insisting on coherence of the core moves is wise. Highlighting that even disputed passages support their reading could help.

  The historian's anachronism accusation requires showing how "rectification of names" connects to feature-fixing without making Gongsun Long sound like Kripke. The reply should position it as a semantic debate within classical Chinese thought.

