  The "why care" grad student question needs practical stakes: how this affects theories of names or contextual constraints in philosophy of language.

  The payoff question must link to contemporary debates—maybe how names function in intensional contexts.

  The nuclear option—whether this is just reinventing Frege—requires differentiating Gongsun Long's operational view from sense as truth-conditional content. Emphasizing the classical Chinese context here is crucial.

  Throughout, I should flag where replies are soft (e.g., textual concessions undermining the argument) or bluffs (handwaving at "rectification of names"). The make-or-break reply is distinguishing substitutability from membership—if that lands, the paper survives.

  Finally, the question they dread: "Isn't this just scope fallacy with extra steps?" The reply must reframe the dialectic as exposing assumptions about name-function. If the audience rejects that framing, recovery is hard.
answer: |-
  Here’s your Q&A prep sheet, structured for maximum battlefield utility. I’ve simulated the room’s voices, ranked objections by damage potential (1 = nuclear, 8 = manageable), and flagged concessions/bluffs. Replies are tight for 2-minute delivery.

  ---

  ### **Objections & Replies**  
  *(Ordered by Lethality)*  

  1. **The Historian’s Anachronism Charge**  
     *Objection (dry, weary tone):* "You’ve lifted Gongsun Long out of the ‘rectification of names’ (正名) tradition. For the School of Names, this was about social order—ensuring titles match roles in a collapsing Zhou dynasty. Turning 白馬非馬 into a proto-Fregean theory of reference ignores that it’s a political intervention. You’re doing cross-era violence."  
     *Reply:* "I agree context matters—but *within* the rectification project, Gongsun Long is dissecting *how* names fix criteria for correct application. When he says ‘white horse isn’t horse’, he’s exposing a tension in compound naming that risks misassignment (e.g., calling a minister ‘unfilial’). This *is* semantics, but anchored in classical Chinese concerns about linguistic disorder."  
     *Blunt Note:* **Concede partial ground.** Stress that you’re *using* analytic tools to expose implicit semantics in the text, not claiming Gongsun Long had a "theory of reference." Soft if they demand textual proof he cared about features over social roles.  

  2. **The Fregean’s “Bad Reinvention” Critique**  
     *Objection (impatient, glasses-tapping):* "This ‘feature-fixing’ sounds like a clumsy version of sense/reference. ‘Horse’ has a sense (equine shape) and a reference (all horses). ‘White horse’ adds a mode of presentation. Gongsun Long just noticed compound senses can’t be reduced to simple ones—but that’s trivial. Why dress this up as radical?"  
     *Reply:* "Frege’s sense is about cognitive content determining reference. Gongsun Long is making a *pragmatic* point: in contexts like seeking or commanding, a name’s function is to *constrain what counts as satisfaction*. ‘Horse’ fixes one constraint; ‘white horse’ fixes two. The issue isn’t about thoughts, but about substitutability in *use*. He’s closer to Wittgenstein on meaning-as-use than Frege."  
     *Blunt Note:* **Must land this.** Distinguish sense (descriptive content) from feature-fixing (operational constraints). If they smell Frege, you’re dead.  

  3. **The Textual Scholar’s Fragmentation Bomb**  
     *Objection (smug, holding a critical edition):* "The received text is a Tang-dynasty collage. We’ve lost context, and the ‘seeking’ argument might be a later interpolation. You’re building a castle on quicksand. How can you claim ‘Gongsun Long’s point’ when we don’t know what he actually said?"  
     *Reply:* "I grant textual uncertainty—but even fractured texts have coherent *arguments*. My reading works with the *dialogue as we have it*, which has been debated for millennia. If we dismiss every contested text, we lose Mengzi’s ‘human nature’ too. I’m offering a *plausible* reconstruction that makes sense of why this puzzle endured."  
     *Blunt Note:* **Concede upfront.** Admit you’re not doing philology—but argue that philosophical engagement requires treating the text *as if* coherent. Bluff if they press specifics.  

  4. **The Kripkean’s “Just a Bad Argument”**  
     *Objection (lounging, dismissive):* "This is a scope error, full stop. ‘White horse’ rigidly designates white horses; ‘horse’ designates horses. Subsets aren’t identity. Gongsun Long confuses ‘is’ (predication) with ‘is’ (identity). Your ‘substitution’ spin is charity where none is due."  
     *Reply:* "Kripke assumes names *only* designate objects. But Gongsun Long treats names as *tools for specification*. In the seeking example, ‘horse’ succeeds if it picks *any* horse, while ‘white horse’ fails if it picks a yellow one. This isn’t about metaphysics—it’s about *what task the name is performing*. He’s denying that names are *only* for picking out extensions."  
     *Blunt Note:* **Real force.** If they insist designation is always rigid/extension, you lose. Hammer the seeking example.  

  5. **The Logician’s Formalization Demand**  
     *Objection (staccato, whiteboard-ready):* "Give me a model. If ‘horse’ fixes shape-feature F, ‘white’ fixes color-feature C, then ‘white horse’ fixes F ∧ C. Substitution fails when context requires only F. That’s just intensionality. Where’s the insight?"  
     *Reply:* "Exactly—but the point is *denying* that F ∧ C reduces to F. Classical logic assumes ‘white horse’ entails ‘horse’, but Gongsun Long says: in contexts demanding *minimal specification* (e.g., ‘bring me a horse’), adding C *over-constrains* and creates failure. It’s a proto-theory of contextual presupposition."  
     *Blunt Note:* **Concede and simplify.** Offer a toy model (e.g., a typed lambda calculus with feature slots). Soft if they ask why this isn’t just standard modal logic.  

  6. **The “Why Care?” Grad Student**  
     *Objection (tired, coffee-stained notebook):* "Even if you’re right, so what? Does this change how we do philosophy of language today, or is it just a ‘gotcha’ to historians?"  
     *Reply:* "It challenges the default view that reference is *always* extension-first. Gongsun Long shows names can serve as *feature-based filters* in practical reasoning. That’s relevant for debates about semantic minimalism, contextualism, or how language guides action. It’s philosophy *in* history, not just *of* history."  
     *Blunt Note:* **Turf.** They want relevance—sell it as a case study for reference in action.  

  7. **The “Payoff or Pedantry?” Provocation**  
     *Objection (skeptical, arms crossed):* "Aren’t you just swapping one ‘is’ for another? ‘Is-not-substitutable-for’ instead of ‘is-not-a-member-of’? What’s gained?"  
     *Reply:* "It reveals a *different kind of mistake*. The standard view says Gongsun Long erred logically. I say he’s identifying a *pragmatic* error: treating a context-sensitive tool as context-invariant. That’s a live issue—think of Kripke’s ‘meter stick’ or predicates in imperative contexts."  
     *Blunt Note:* **Bluff slightly.** Claiming "pragmatic error" is speculative but defensible.  

  8. **The “Philosophy or Exegesis?” Trap**  
     *Objection (world-weary senior scholar):* "Is your goal to recover what Gongsun Long *meant*, or to use him as a sparring partner for modern theory? You can’t have both without circularity."  
     *Reply:* "I’m doing *rational reconstruction*: asking what problem he *could* have been solving, given the text. It’s philosophy informed by history, not ventriloquism."  
     *Blunt Note:* **Concede the tension.** Admit the balance is fragile but necessary.  

  ---

  ### **Strategic Summary**  
  - **Concede upfront:** Textual uncertainty, historical context of 正名.  
  - **Real force:** Kripkean/Fregean objections. If they reject your "feature-fixing ≠ sense/reference" distinction, the core collapses.  
  - **Turf:** "Why care?"—appeal to broader relevance.  
  - **Make-or-break reply:** The **seeking example** (Objection 4). If you can’t convince them that "finding a horse ≠ finding a white horse" demonstrates *substitution failure in practical contexts*, you lose.  
  - **Bluff zones:** Linking feature-fixing to "rectification of names"; downplaying textual issues.  

  ### **The Question You Hope Nobody Asks**  
  *“Isn’t this just the sense/reference distinction applied to classical Chinese, with ‘feature-fixing’ as a stand-in for Fregean sense? If so, why not say that and credit Frege?”*  
  **Why it’s lethal:** It collapses your innovation into an existing framework, making you look derivative.  
  **Reply (if forced):** "Frege’s sense is about *truth-conditions*; Gongsun Long’s feature-fixing is about *satisfaction-conditions in action-guiding contexts*. The former is cognitive; the latter is pragmatic. He’s not doing theory—he’s diagnosing a *functional* constraint in naming practices."  
  **Blunt Note:** This is a band-aid. If pressed, you’re on thin ice.

  ---  
  **Final Tip:** Start Q&A by saying: "I take the textual and historical concerns seriously—this is a *philosophical* reading, not a definitive historical claim." Disarms snipers early. Good luck.
