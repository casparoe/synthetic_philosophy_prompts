  First, I need to map the audience dynamics. The Fregean philosopher might see this as a clumsy reinvention of sense/reference. The Kripkean will dismiss it as a bad argument. The textual scholar will question extracting semantics from a fragmented text. The historian will cry anachronism. The logician will demand formalization. Each requires tailored counters.

