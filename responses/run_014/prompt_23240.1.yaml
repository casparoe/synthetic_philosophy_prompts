prompt: |-
  I host a small philosophy podcast where I interview philosophers about topics at the intersection of science and its foundations, and as a software engineer without a formal philosophy background I tend to push for technical specificity. Next week's guest is a philosopher who defends Popper's view that the Darwinian theory of evolution is not a testable scientific theory but a metaphysical research program. Please draft six to eight interview questions that go beyond having him restate the view. I want at least one question on his argument that the conjecture of natural selection can be confirmed but never falsified in principle, with a follow-up keyed to the standard reply that evolutionary biology makes plenty of testable predictions, such as fossil sequences and phylogenetic trees. I also want one question on what the metaphysical status is supposed to buy you if the framework still generates testable conjectures, and one question on what evidence could count against the research program. For each question, include a follow-up keyed to the answer the guest is most likely to give.
reasoning: |-
