answer: |-
  **The scenario:**  
  A mature oak tree stands in a forest. A forester cuts it down at noon precisely, and immediately begins carrying the freshly severed trunk section horizontally on their shoulder towards a woodpile. At 12:01 PM, the forester is carrying this piece of wood. According to our common way of speaking, the forester is carrying *firewood* – an object defined by its functional role as fuel. However, the forester also reminisces about the magnificent *tree* that stood there moments ago and believes they are now carrying *that very tree* to be processed. Crucially, at 12:01 PM, before any significant alteration like splitting or drying occurs, the physical matter constituting the object on the shoulder is identical to the matter that constituted the lower trunk of the standing tree moments before. The object possesses all the intrinsic properties necessary to be classified as a tree (the biological organism) and all the intrinsic properties necessary to be classified as firewood (the fuel resource), based solely on its origin, composition, and immediate future role.

  **The endurantist's verdict:**  
  The endurantist must affirm that two numerically distinct objects, the *tree* (the persisting biological organism) and the *firewood* (a new artefactual object created by the act of felling for the purpose of fuel), are both wholly present and co-located in the exact same region of space at 12:01 PM. Neither object is a proper part of the other; they share all their matter but differ in their persistence conditions and modal properties (e.g., the tree *could* have been left standing, the firewood *could* not). The forester is simultaneously carrying one object (the firewood) and carrying the numerically distinct remains of another object (the tree).

  **The perdurantist's verdict:**  
  The perdurantist identifies only a single space-time worm. This worm has a temporal part (a "tree-stage") existing before noon when the organism was rooted and alive, and a distinct temporal part (a "firewood-stage") existing after noon when the matter is detached and destined for burning. At 12:01 PM, only the firewood-stage is present. There is no co-location of distinct objects. The forester carries a single temporal part of a single temporally extended entity. The entity *was* a tree and *is now* (at 12:01 PM) firewood, but these are different temporal parts, not different objects wholly present at the same time.

  **The feature doing the work:**  
  The divergence is generated by the **differential persistence conditions** tied to kind membership (organism vs. artefactual resource) applied to an object undergoing a rapid, identity-relevant change (felling) where the matter remains intrinsically unchanged immediately afterwards. Endurantism ties persistence to the continued satisfaction of kind-essential conditions *at each instant*. The tree (organism) persists only if alive and rooted; the felling terminates it, creating a new firewood object satisfying different (functional) persistence conditions in the same matter. Perdurantism avoids this by making persistence a matter of spatiotemporal continuity of stages, decoupling instantaneous kind classification from numerical identity over time. If the change didn't involve a shift in kind-defining persistence conditions (e.g., merely painting the standing tree), or if the intrinsic properties changed significantly immediately (e.g., the trunk instantly burst into flame upon falling), the pressure for co-location under endurantism would be reduced or eliminated.

  **A defender's attack:**  
  A defender of endurantism would attack the premise that "firewood" names a distinct *kind* of object with its own essential persistence conditions in the relevant metaphysical sense. They might argue that "firewood" is merely a *phase sortal* or a *description* applied to the matter constituting the *remains* of the tree (which ceased to exist as an organism upon felling). On this view, only one object exists post-felling: the scattered aggregate of wood matter, which can be *described* as firewood but doesn't constitute a new, distinct object co-located with the (now non-existent) tree. The "too many riders" problem arises only if we mistakenly reify functional descriptions into distinct kinds competing with substantial kinds like "tree."
