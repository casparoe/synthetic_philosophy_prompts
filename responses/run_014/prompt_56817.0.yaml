prompt: |-
  Ok so I'm doing my EPQ on social norms and I've got stuck on an analogy my economics teacher keeps reaching for. He says norms are basically like the rules of grammar: nobody ever wrote them down or voted for them, everyone follows them without being able to state them, they drift over centuries without anyone deciding anything, and above all you can't be *wrong* in a moral sense for breaking one — if I say "me and him went" I haven't done anything bad, I've just marked myself out as not one of you. He uses this for two claims. First, that it's confused to blame people for norm violations that were completely normal when they were young, like my grandad saying something at work in 1975 that would get him sacked today. Second, that you can't change a norm on purpose, by arguing people round or by making rules, any more than a committee could decide English will start putting its adjectives after the noun — you just have to wait for the drift.

  I half buy it and half dont. The bits that don't sit right: when I broke the unwritten rule about which table you're allowed to sit at in the common room, people were properly annoyed with me and someone actually told me off, which never happens with grammar — a solecism doesn't get you sanctioned, it gets you a raised eyebrow. And I think I read somewhere that Lewis analysed language itself as resting on conventions of truthfulness and trust, which would make the grammar comparison his own example rather than an objection to it. Also some norms feel nothing like grammar: which side of the road we drive on did get changed on purpose (Sweden managed it), whereas "don't freeloader off the group project" comes with real indignation and people policing the policing.

  Act as a philosopher who works on social ontology and conventions, and think this through carefully — maybe start by brainstorming two or three candidate ways to line the two things up before you settle on one, since I want to see the alternatives you rejected. Then give me: an explicit correspondence table (what plays the role of the sentence, the native speaker, the solecism, the slow drift, the inability to articulate the rule); the places the mapping breaks, sorted into the disanalogies that actually threaten his two claims and the ones that are beside the point; what features of grammar the analogy is quietly importing that norms turn out not to have; and whether each of the two claims survives once that's all on the table. If there's a better analogy for norms — one that keeps the no-author, no-design point without smuggling in the rest — say what it is and why it's better.

  Please actually commit on this one. Don't hand me a balanced "there are considerations on both sides" write-up where I have to do the deciding: pick a position on whether the two claims survive, tell me which single disanalogy you think is doing the most work, and argue for it.
reasoning: |-
  Okay, let me tackle this EPQ question about social norms and the grammar analogy. The user's economics teacher argues that norms are like grammar rules—unwritten, evolving naturally, and morally neutral when violated. The teacher uses this to support two claims: we shouldn't blame people for outdated norm violations, and norms can't be changed intentionally. 

  First, I need to unpack the analogy. Grammar does have that organic, decentralized development—no one votes on adjective order. But the user points out key differences: norm violations often trigger active enforcement (like getting told off for sitting at the wrong table), while grammar mistakes just get subtle social cues. Also, some norms *are* changed deliberately (like Sweden switching driving sides), unlike grammar. 

  Hmm, the user wants me to act as a social ontologist. I should consider alternative mappings before settling. Option 1 could treat norms and grammar as identical systems. Option 2 might emphasize enforcement differences. Option 3 could focus on normativity—how "shoulds" operate differently in each. Option 2 feels most promising because enforcement mechanisms are where the analogy visibly cracks.

  For the correspondence table:  
  - Grammar "rules" map to norm "expectations"  
  - "Native speaker" = community member  
  - "Solecism" = minor norm breach  
  - But "sanction" doesn't align—grammar gets eyebrows, norms get anger or rules.  

  The critical break is sanctions. Grammar errors don't inspire moral outrage; norm violations often do. This directly undermines the teacher's first claim because if norms carry moral weight (unlike grammar), blaming past actions isn't confused—it's recognizing that norms' *moral content* shifts.  

  For the second claim, the disanalogy in intentional change is fatal. Grammar evolves glacially; norms can be pushed by laws (seatbelt mandates) or movements (#MeToo). The teacher's "can't change by committee" point collapses here.  

  The analogy smuggles in grammar's *amorality* and *inertia*, but norms are often moralized and malleable. A better analogy might be fashion—also unwritten and emergent, but with clearer enforcement (side-eyes for faux pas) and deliberate influencers (designers shifting trends).  

  Verdict: Both claims fail. Sanctions are the wrecking ball—they expose norms as tools of social control, not neutral conventions. The user should push back hard, especially with examples like workplace conduct norms changing via activism, not drift.  

  ...Wait, did I commit clearly enough? User said no "both sides" waffling. Yes—sanctions demolish claim 1, intentional change sinks claim 2. Mic drop.
answer: |-
  Here's a philosopher's structured breakdown, ending with a committed verdict. I reject both claims—the analogy fails precisely where it matters, and **sanctions** are the wrecking ball.

  ### Brainstorming Candidate Mappings
  1. **The "Pure Convention" Mapping**:  
     Treat norms and grammar as identical: both are *arbitrary coordination tools*. The rule against double negatives = the norm against interrupting. Violations signal "outsider" status but lack moral weight.  
     *Problem*: Ignores that many norms (unlike grammar) are *moralized* (e.g., "don't freeload" feels *wrong*, not just odd).

  2. **The "Enforcement Gradient" Mapping**:  
     Grammar violations get mild feedback (raised eyebrows), norm violations get stronger sanctions (anger, exclusion). But both exist on a spectrum of social enforcement.  
     *Problem*: Fails to explain why *some* norms (e.g., table-sitting) trigger sanctions while grammar doesn’t—and why sanctions feel morally charged.

  3. **The "Normative Architecture" Mapping (My Choice)**:  
     Grammar is a *coordination device*; norms are *governance tools*. Grammar enables communication; norms regulate behavior *with stakes* (fairness, harm, group survival). This explains enforcement differences.  

  ---

  ### Explicit Correspondence Table
  | **Grammar Feature**       | **Social Norm Analog**          | **Key Difference**                                                                 |
  |---------------------------|---------------------------------|------------------------------------------------------------------------------------|
  | **Sentence**              | Social action (e.g., greeting)  | Actions have consequences beyond comprehension; grammar lacks "victims".           |
  | **Native Speaker**        | Community member                | Members *police* norms; speakers rarely police grammar.                            |
  | **Solecism**              | Minor norm violation            | Solecisms lack sanctions; norm breaches often incur costs (anger, exclusion).      |
  | **Slow Drift**            | Norm evolution over time        | Norms *can* change abruptly (laws, revolutions); grammar rarely does.              |
  | **Inability to Articulate** | Unwritten rules ("know-how")    | Both share this—but norms are often *codifiable* (e.g., employee handbooks).       |

  ---

  ### Where the Mapping Breaks (Ranked by Threat to Claims)
  #### **Fatal Disanalogies**  
  1. **Sanctions & Moral Weight** (Threatens **Both Claims**)  
     - Grammar: Saying "me and him went" may confuse but isn’t *punished*. It’s amoral.  
     - Norms: Sitting at the "wrong" table triggers anger because norms encode *values* (hierarchy, belonging). Violations feel like *betrayals*, not errors.  
     → **Why this kills Claim 1**: If your grandad’s 1975 remark *harmed* others (even if accepted then), blame isn't "confused"—it acknowledges that norms protect moral interests. Grammar lacks this.  

  2. **Intentional Change** (Threatens **Claim 2**)  
     - Grammar: No committee can force adjective-noun reversal. Drift is glacial and decentralized.  
     - Norms: Sweden switched driving sides via state mandate (1967). #MeToo shifted workplace norms via activism. *Norms are levers of power*.  
     → **Why this kills Claim 2**: Norms *are* deliberately changed through laws, shame campaigns, or institutional power—precisely *because* they regulate harm.  

  #### **Beside-the-Point Disanalogies**  
  - **Articulability**: Both norms and grammar rules can be implicit. Not relevant.  
  - **Arbitrariness**: Driving left/right *is* arbitrary like grammar; anti-freeloading *isn’t* (it addresses fairness). But arbitrariness isn’t core to the claims.  

  ---

  ### What the Analogy Smuggles In (and Shouldn’t)
  1. **Amorality**: Grammar lacks moral stakes; norms often have them (e.g., sexist language norms *do* cause harm).  
  2. **Inertia**: Grammar’s resistance to change is biological/neurocognitive; norm inertia is political (e.g., backlash to progress).  
  3. **Neutral Enforcement**: Grammar "errors" don’t invite policing; norm violations do because they threaten social order.  

  ---

  ### Verdict: Both Claims Fail
  - **Claim 1 ("Don’t blame past norm violations")**: **False.** Norms (unlike grammar) often reflect moral progress. Blaming past actions isn’t confusion—it’s recognizing that *what was normalized wasn’t harmless* (e.g., 1975 workplace sexism). The analogy hides norms’ moral dimension.  
  - **Claim 2 ("Norms can’t be changed deliberately")**: **False.** Norms *are* tools of social control and can be rewritten via coercion, persuasion, or law (e.g., smoking bans, LGBTQ+ acceptance). Grammar lacks this plasticity.  

  **The single decisive disanalogy**: **Sanctions**. Norms are enforced because they govern *behavior that matters* (dignity, resources, safety). Grammar governs *clarity*—it’s purely instrumental. Sanctions reveal norms as *normative* (value-laden), not just conventional.  

  ---

  ### A Better Analogy: **Fashion**  
  - **Why better**: Like norms, fashion has no central authority, drifts organically (*slow drift*), and signals group membership (*native speaker* = trend-follower). But crucially:  
    - It **accepts deliberate change** (designers, influencers shift trends).  
    - Minor violations (e.g., socks with sandals) get **mild sanctions** (ridicule, not moral outrage).  
    - **Moral norms** (e.g., anti-racism) are *not* like fashion—they’re more rigid because they’re grounded in ethics, not taste.  
  - **Limitation**: Still downplays the *moral gravity* of core norms.  

  **Final Position**: Reject the grammar analogy. Norms are grammar **plus stakes, sanctions, and moral force**. Your teacher’s claims don’t survive—**sanctions** prove norms are battlegrounds of power and ethics, not just conventions. Use this to argue that norm change *is* possible (and often urgent) in your EPQ.
