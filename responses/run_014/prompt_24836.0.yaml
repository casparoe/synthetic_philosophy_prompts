  But here's the tricky part: the user also mentions museums studying forgeries as interesting objects. That actually supports the causal-historical view too! Because it treats originals and forgeries as fundamentally different kinds of things with different narratives.

  Now, if we switched to the "knowledge changes experience" theory... auction houses would behave very differently. They'd emphasize provenance only as mood-setting context, not essential value. Conservators might replace originals with replicas after documenting them. Museums would display perfect copies without distinction - maybe hiding provenance info to test if viewers notice differences.

  Ah, and the user wants me to identify where my reasoning could fail. Smart. Two big challenges: First, if value stayed high even when everyone knows it's a perfect forgery, that would break the causal-historical necessity. Second, if it's pure investment speculation, the whole philosophical discussion might be irrelevant - the premium could just be about artificial scarcity.

  ...Wait, but even speculators rely on the art world's authentication systems. So maybe the institutional view creeps back in. This is delightfully messy. The user's hypotheticals are excellent stress tests for each theory.

  Better emphasize the underdetermination point too: the market's surface behavior fits all three theories, but only the causal-historical view explains why value can't be recovered after exposure. That's the key differentiator they spotted in their puzzle setup.
answer: |-
  The art market's authenticity premium reveals a deep philosophical tension. Let's reconstruct the implicit theory, distinguish presuppositions from compatibilities, test underdetermination, and explore counterfactuals.

  **Core Presupposition: Causal-Historical Origin as Intrinsic Value**  
  The practice *strictly presupposes* that **the causal-historical connection to the artist is a non-reducible component of the object's value**. This is evident in:
  - **Irreversibility of value loss**: The forgery's price collapses *permanently* upon exposure, even when sensory properties are unchanged.
  - **Conservation ethics**: Restoring (rather than replacing) a degraded original treats the physical artifact as a unique historical witness.
  - **Mourning lost originals**: The irreplaceability stems from the break in causal lineage, not just lost visual data.

  **Compatibility vs. Necessity**  
  - **"Knowledge changes experience" view**: Compatible but *not required*. The market treats the forgery as worthless *even if* a viewer remains ignorant of its status (e.g., an undiscovered forgery in a museum would still lack the original's value *if known* to experts).
  - **Institutional status view**: Fits auction/museum authority but fails to explain *why* institutions themselves treat originals as irreplaceable. The value collapse upon confession shows institutional status is derivative of historical truth.

  **Philosophical Underdetermination**  
  The *market behavior* (high premiums for originals) is compatible with all three theories. However, **three specific practices are only fully explained by the causal-historical view**:
  1. The **permanent, unrecoverable value loss** of exposed forgeries.
  2. **Restoration > replacement** of damaged originals.
  3. **Grief over destroyed originals** despite replicability of appearance.

  ---

  **If "Knowledge Changes Experience" Were True: Market Implications**  
  Auction houses, conservators, and museums would behave fundamentally differently:
  | **Current Practice** | **Revised Practice under "Experience" View** |
  |----------------------|---------------------------------------------|
  | Highlight provenance as intrinsic value | Treat provenance as a "perception enhancer" (e.g., "Believed to be by Vermeer" labels) |
  | Restore degraded originals at all costs | Replace originals with perfect replicas once documented, preserving only the "experience" |
  | Display originals as sacred objects | Display perfect replicas interchangeably with originals, possibly blind-testing viewers |
  | Authenticity certificates as value anchors | Authenticity as optional context, like exhibition notes |

  Museums might create "Vermeer experience rooms" with replicas, while auction houses would emphasize indistinguishable sensory qualities over provenance. Conservators would prioritize documentation over material preservation.

  ---

  **Where Reasoning Could Fail: Key Vulnerabilities**  
  1. **The Investment Speculation Counterexample**:  
     If the premium were *purely* speculative (e.g., treating art as "authenticity futures"), the causal-historical view becomes epiphenomenal. **Verdict shift**: Institutional/speculative theories would better explain the premium.  
     *Test*: Does the premium persist for artists with no market speculation (e.g., obscure Renaissance masters)? If yes, causal-historical view holds.

  2. **The Unmaskable Forgery Scenario**:  
     If a "perfect" forgery retained high value *even after exposure* because collectors conceded it provided identical aesthetic value, the "experience" view would gain ground.  
     *Reality check*: This never occurs – exposed forgeries become curiosities (e.g., van Meegeren's Vermeers). This reinforces causal-historical primacy.

  3. **The Forgery as Superior Object**:  
     If a forgery improved on the original (better preservation, clearer brushwork) yet still traded lower, it would confirm that origin *trumps* experiential quality. Current practice affirms this.

  **Ultimate Verdict**:  
  The market presupposes **causal-historical origin as ontologically significant**. This view collapses only if:  
  - Provenance becomes fully decoupled from value in speculation-driven markets, *or*  
  - Technology enables perfect undetectable replication *and* the premium vanishes despite institutional authentication.  

  Neither condition currently holds. The persistence of mourning for destroyed originals – even when digital scans exist – remains the strongest evidence for the causal-historical view.
