  Let's add a sentence S0: "F" (falsehood). And a rule that if you have both `Pr(S_i)` and `Pr(S_j)` where the content of S_i is "~A" and the content of S_j is "A", then you can prove S0.

  But that complicates.

  Alternatively, for System B, we make it so that it can prove everything. How? By having a sentence that is an implication that leads to explosion.

  Example: 
  Let me change S2's content to something else.

  We'll design System B to be inconsistent by having a sentence that is the liar: S7: "~Pr(S7)" and then make it an axiom? But then we have:

  Axioms include S7: "~Pr(S7)".

  But then what? We have no rule to do anything with it. But then later when we evaluate truth, if we consider the system consistent, we would say that since S7 is an axiom, it is provable, so its content "~Pr(S7)" would be false. But in the derivation, we don't get a contradiction.

  So to get inconsistency, we need a rule that says if you have proved a sentence and its negation, then you can prove everything. But we don't have negation of `Pr` in the system.

  Let's change the system to include a constant false sentence and a rule for negation.

  We'll add a new sentence S0: "F" (false).

  And we add a rule:

  2d. If you have proved a sentence S_i whose content is "~A", and also proved a sentence S_j whose content is "A", then you can prove S0.

  And then we add a rule that from S0 you can prove any sentence.

  But that might be too much.

  Alternatively, for the sake of the activity, we can have System B be such that it can prove S6 (the Gödel sentence) but then also prove its negation? But we don't have a negation of S6 in the system.

  We can have two sentences that are negations of each other. Let me introduce:

  In System B, we change the content of S6 to be "Pr(S6)" (so it's a truth-teller) and then add a new sentence S9: "~Pr(S6)".

  But then if we make S9 an axiom, then we have:

  S9: "~Pr(S6)" is an axiom.

  And if later we prove S6, then we have a conflict, but again, no derivation rule.

  To make it inconsistent, we need to be able to derive both and then derive a contradiction.

  Given the time, we might have to accept that in System B, the students will assume consistency and then be proven wrong because the system is unsound.

  So in System B, we make S6 an axiom. Then:

  Axioms: S1, S2, S3, S6.

  Now, what can be proved?

  Start: S1, S2, S3, S6.

  By S3: prove S4.

  So proved: S1, S2, S3, S4, S6.

  S6's content is "~Pr(S6)". There is no rule to derive anything from this.

  So the set of provable sentences is {S1, S2, S3, S4, S6}.

  Now, evaluate truth:

  - S6 is an axiom, so it is provable. But its content is "~Pr(S6)", which says that S6 is not provable. But it is provable, so the content is false.

  Therefore, the system has proved a false sentence: S6. So it is unsound.

  But the students, when they bet, will likely assume the system is consistent and therefore S6 is true (because it says it is not provable). But if they bet that S6 is true, they lose because in this system it is false.

  This is the trap.

  **Betting Game:**

  We will have the students, in their groups, bet on the truth of the sentences in System B. They are not told the axioms of System B in advance. They are only given the rulebook (which is the same as System A, except we don't list the axioms) and the list of sentences (which is the same as System A, except that we don't say which are axioms). They are told that the axioms are a subset of {S1,...,S8} and that the rules are the same.

  Then they are given a few minutes to think about it. Then they bet on the truth value of each sentence (true, false, or unknown) and also on its provability (provable, not provable, or unknown). But they haven't seen the axioms.

  But wait, they need to know the axioms to determine provability. So we have to give them the axioms. So let's change.

  The students are given the rulebook and the list of sentences and the set of axioms for System B. They are told to mechanically derive which sentences are provable. They will derive that S1, S2, S3, S4, S6 are provable.

  Then they are asked to evaluate the truth of each sentence. For S6, if they assume consistency, they might think: since it is provable, and it says it is not provable, then it must be false? But then they should mark it as false. But the trap is that many will think they can "see" that it is true, not realizing that the system might be unsound.

  So we ask them to bet on the truth of S6. We don't ask for the others, to save time.

  Betting scheme:

  - Each group gets 10 points.
  - They can bet any number of points (integer) up to what they have on the truth value of S6 in System B.
  - They are told that if they are correct, they double the bet; if wrong, they lose it.

  But to make it more refined, we can ask them to bet on whether S6 is true or false.

  We expect many to bet that it is true, because they will assume the system is consistent. But in System B, it is false.

  Then we reveal and they lose.

  Then we discuss: why did you bet that way? You assumed the system was consistent. But how do you know that? You assumed it for System A too.

  **Minute-by-Minute Timeline:**

  Total: 75 minutes.

  0-5 min: Introduction to the activity. Distribute materials: rulebook for System A, list of sentences for System A, and a worksheet to record provability and truth. Explain the rules for System A briefly. Say: "This is a formal system. You are to determine, mechanically, which of the sentences S1 to S8 are provable from the axioms using the rules. Work in your groups. You have 10 minutes."

  5-15 min: Groups work on System A provability. The math major might finish quickly; ask him to help others.

  15-20 min: Review. Call on a group to share their list of provable sentences. They should say S1, S2, S3, S4. Confirm.

  20-25 min: Now, evaluate truth. Explain: "For each sentence, determine if it is true or false. Remember: a sentence is true if what it says is correct, and false otherwise. For example, if a sentence says that a particular sentence is provable, and that sentence is indeed provable, then it is true." Give 5 minutes.

  25-30 min: Review truth values. They should say:
  - S1: true (because S2 is provable)
  - S2: true (because if S1 is provable then S3 is provable, and both are)
  - S3: true (because S4 is provable)
  - S4: true (because S5 is not provable)
  - S5: true (because if S3 is provable then S1 is provable, and both are) -> but not provable
  - S6: true (because it says it is not provable, and it isn't)
  - S7: false ( because it says it is provable, but it isn't)
  - S8: false ( because there is no S9)

  30-35 min: Discuss: "Look at S6. You can see that it is true, right? And the system cannot prove it. So this system cannot prove this true sentence. Therefore, the system is incomplete. And you, as humans, can see that it is true."

  35-40 min: Introduce System B. "Now, we have a new system, System B. It has the same rules and the same set of sentences, but a different set of axioms. The axioms are: S1, S2, S3, and S6." Distribute the rulebook for System B (which is the same as A) and the list of sentences (same as A) and the axioms for System B.

  40-50 min: Groups work on System B provability. They will derive: axioms are S1, S2, S3, S6. Then by rule 2a on S3, they get S4. So proved: S1, S2, S3, S4, S6.

  50-55 min: Now, they are to evaluate the truth of S6 in System B. But they don't know the truth yet. They have to decide if it is true or false. They are told to bet. Each group has 10 points. They can bet any number on whether S6 is true or false. They have 2 minutes to decide and write their bet.

  55-60 min: Collect the bets. Then reveal: "In System B, S6 is an axiom, so it is provable. What does S6 say? '~Pr(S6)' - that S6 is not provable. But it is provable, so what it says is false. Therefore, S6 is false."

  Groups that bet on true lose their bet; groups that bet on false double it.

  60-75 min: Debrief.

  **Debrief:**

  - In System A, we could see that S6 was true because we assumed the system was consistent. We knew that if the system is consistent, then S6 is not provable, so S6 is true.

  - In System B, we added S6 as an axiom. This made the system inconsistent (or at least unsound) because it proved a false sentence.

  - The anti-mechanist argument says: for any formal system, we can construct a Gödel sentence that the system cannot prove, but we can see that it is true. But this assumes that the system is consistent. How do we know that? We can only know that if we know the system is consistent. But the second incompleteness theorem says that the system itself cannot prove its own consistency. And if we are a formal system, then we cannot prove our own consistency either.

  - Therefore, the mechanist can say: maybe the human mind is consistent, but you cannot prove that, so you cannot prove the Gödel sentence for your own mind.

  - The activity shows that when you assumed the system was consistent, you were right for System A but wrong for System B. You had no way to tell in advance.

  - Also, the math major might have said: "just add the Gödel sentence as an axiom". That's what we did in System B. But then the system becomes able to prove that very sentence, but then we get a new Gödel sentence for the extended system. And moreover, in this case, adding it made the system unsound.

  - The activity cannot reproduce the full arithmetic coding, but it illustrates the key point: the truth of the Gödel sentence depends on the consistency of the system, and we have no absolute proof of consistency.

  **One-sentence paper-over:** "In a real formal system like arithmetic, the self-referential sentence is constructed by a complex coding, but the logical structure is the same as in our toy system."

  **What might go wrong:**

  1. The math major announces the punchline early. 
     - How to handle: If he does, say: "That's a good insight, but let's see if it holds up in the next system. And please help your group to go through the mechanical steps without jumping ahead."

  2. A group says: "Let's add S6 as an axiom." 
     - In the activity, that's exactly what System B does. So it's built in. We show that it leads to unsoundness.

  3. Groups might have trouble with the mechanical derivation. 
     - Have a cheat sheet for the facilitator to help groups that are stuck.

  4. In System B, groups might not realize that S6 is false. They might think that because it is an axiom, it is true. 
     - Explain carefully: truth is based on what the sentence says. It says it is not provable, but it is, so it's false.

  **Materials:**

  - Rulebook for System A and System B (same card, since the rules are the same, but the axioms are different and will be provided separately).
  - Sentence list for both systems (same).
  - Worksheet for recording provable/not and truth values.
  - Index cards with the axioms for each system (for System B, the axioms are S1, S2, S3, S6).

  The rulebook card (one side):

  ```
  System Rules:

  1. Axioms: (given separately)
  2. Rule by Content:
     - If a sentence S_i is proved and its content is "Pr(S_j)", then you can prove S_j.
     - If a sentence S_i is proved and its content is "A -> B", then it can be used in modus ponens.
  3. Modus Ponens:
     - If you have proved a sentence S_i with content "A -> B" and a sentence S_j with content "A", then you can prove the sentence S_k that has content "B". (Note: only if there is such an S_k.)
  ```

  Sentence list (on a worksheet):

  ```
  System A and B use the same sentences:

  S1: "Pr(S2)"
  S2: "Pr(S1) -> Pr(S3)"
  S3: "Pr(S4)"
  S4: "~Pr(S5)"
  S5: "Pr(S3) -> Pr(S1)"
  S6: "~Pr(S6)"
  S7: "Pr(S7)"
  S8: "Pr(S9)"
  ```

  Axioms for System A (on a card given during phase 1):

  ```
  Axioms for System A: S1, S2, S3
  ```

  Axioms for System B (on a card given during phase 2):

  ```
  Axioms for System B: S1, S2, S3, S6
  ```

  **Answer keys:**

  System A:
  - Provable: S1, S2, S3, S4
  - Truth:
     - S1: true
     - S2: true
     - S3: true
     - S4: true
     - S5: true (but not provable)
     - S6: true (but not provable)
     - S7: false
     - S8: false

  System B:
  - Provable: S1, S2, S3, S4, S6
  - Truth of S6: false

  **Betting and Scoring:**

  - Each group starts with 10 points.
  - They bet on the truth of S6 in System B after they have derived which sentences are provable but before they are told the truth.
  - They can bet any integer amount from 0 to 10.
  - If they bet correctly (false), they win double the bet.
  - If they bet incorrectly (true), they lose the bet.

  This design should achieve the pedagogical goal.
answer: |-
  Below is a complete, runnable 75-minute seminar plan tailored to your constraints. The activity uses two toy formal systems (System A and System B) to help students discover the flaw in the Lucas/Penrose argument without mentioning Gödel, Lucas, or Penrose until the debrief. The focus is on **epistemic humility**: students realize that "seeing" the truth of a self-referential sentence depends on unprovable assumptions (like consistency) that apply equally to human cognition. The math major's confidence and "just add the sentence" moves are designed into the activity as learning opportunities.

  ---

  ### **Materials Prep (Handouts & Cards)**
  - **Rulebook Cards (one-sided, 1 per group)**:  
    ```  
    **SYSTEM RULES (A & B)**  
    - **Vocabulary**: Sentences named S1 to S15.  
    - **Axioms**: Given at start.  
    - **Rules**:  
      1. **MP**: If you prove sentence "P→Q" and prove "P", you can prove "Q".  
      2. **Truth**: A sentence is "true" if what it says matches reality.  
    - **Special Sentences**:  
      - "SX" means: "Sentence SX is provable."  
      - "~SX" means: "Sentence SX is NOT provable."  
    ```  
  - **System A Sentence List & Axioms Card (1 per group)**:  
    ```  
    **SYSTEM A**  
    **Axioms**: S1, S2, S3  
    **Sentences**:  
    S1: S2  
    S2: S1 → S3  
    S3: S4  
    S4: ~S5  
    S5: S3 → S1  
    S6: ~S6  [Self-referential]  
    S7: S7  
    S8: S9  
    S9: S10  
    S10: ~S8  
    S11: S12 → S11  
    S12: ~S12  
    S13: S14  
    S14: S13 → S15  
    S15: ~S15  
    ```  
  - **System B Sentence List & Axioms Card (1 per group)**:  
    ```  
    **SYSTEM B**  
    **Axioms**: S1, S2, S3, S6  
    **Sentences**: *Same as System A.*  
    ```  
  - **Answer Key (For you only)**:  
    - **System A Provable**: S1, S2, S3, S4.  
    - **System A Truth**: All true *except* S7 (false), S8 (false), S15 (true but unprovable).  
      - *S6 is true and unprovable.*  
    - **System B Provable**: S1, S2, S3, S4, S6.  
    - **System B Truth**: S6 is **false** (it claims "I’m unprovable" but is provable).  

  - **Index Cards (1 per student for betting)**:  
    "BET: [ ] TRUE [ ] FALSE | AMOUNT: ____"  

  ---

  ### **Timeline (75 Minutes Total)**  
  **Goal**: Students mechanically verify provability/truth in System A, then get trapped by overconfidence in System B.  

  #### **Phase 1: Operate System A (25 min)**  
  - **0–5 min**: Introduce activity.  
    - *Facilitator Lines*: "Today, you'll be operators of a formal proving machine. Use this rulebook to decide which sentences are provable. Work in groups (3–4 students). No grand theories—just follow the rules mechanically. Questions? Ask your rulebook, not me."  
    - *Groups*: 5 groups (3–4 students each, assign math major to a group with quiet students).  
    - *Distribute*: System A cards.  

  - **5–20 min**: Groups decide provability for System A sentences (S1–S15).  
    - *Process*:  
      1. Start with axioms (S1, S2, S3).  
      2. Apply **MP** (e.g., S2 is "S1→S3"; S1 is proven → prove S3).  
      3. S3 proves S4 via content ("S3: S4" = axiom proves S4).  
      4. *Stop* at S6 (unprovable), S7 (unprovable), etc.  
    - *Your Role*: Float, clarify rules neutrally ("What does MP require?"), and **lean into boredom**. When groups speed up: "Great! Double-check S6–S10."  
    - *Math Major Trap*: If they announce "S6 is Gödelian!", say: "Prove it using these rules only. Your group must agree." Forces mechanical engagement.  

  - **20–25 min**: Evaluate truth in System A.  
    - *Facilitator Lines*: "Now, decide if each *provability status* you found makes the sentence **true** or **false**. Remember: 'SX' means 'SX is provable', '~SX' means 'SX is not provable'."  
    - *Groups*: Quickly realize S6 ("I’m unprovable") is true but unprovable. Ignore deeper discussion.  

  #### **Pivot: The Trap (5 min)**  
  - **25–30 min**: Transition to System B.  
    - *Facilitator Lines*:  
      "Nice work. Now, here’s **System B**. Same rules, same sentences, but different axioms. Your new job: **Bet participation points** on whether S6 is *true* in System B. You’ll first prove what’s provable, then bet on truth. Max bet: 10 points. Correct? Double your bet. Wrong? Lose it."  
    - *Distribute*: System B cards and betting cards.  
    - *Key*: Students assume System B is consistent (like A). But adding S6 as an axiom makes it inconsistent.  

  #### **Phase 2: System B Betting (20 min)**  
  - **30–40 min**: Groups decide provability for System B.  
    - *Process*:  
      - Axioms: S1, S2, S3, S6.  
      - Prove S1→S3→S4 (as in A).  
      - S6 is now an axiom (provable).  
    - "Just Add the Sentence" Move: Students may say "We added S6, so it’s provable—done!" *Celebrate this*: "Exactly! You upgraded the system. Now, bet on its truth."  

  - **40–45 min**: Groups bet on S6’s truth.  
    - *Process*:  
      - Groups bet secretly on index cards (TRUE or FALSE + amount).  
      - Collect cards. *Most will bet "TRUE"* (assuming consistency like System A).  

  - **45–50 min**: Reveal truth and score.  
    - *Facilitator Lines*:  
      "In System B, S6 is **provable** (you all got that!). But S6 says: 'I’m **unprovable**.' If it’s provable, is it *true*? No—it’s **false**. It claims something false about itself."  
      - Betting result: "TRUE" bets lose; "FALSE" bets double.  

  #### **Debrief (25 min)**  
  - **50–60 min**: Map activity to theorems.  
    - *Facilitator Lines* (write on whiteboard):  
      ```  
      WHAT HAPPENED:  
      System A:  
        - S6 = "I’m unprovable" → Unprovable & TRUE  
        → You "saw" it was true by assuming System A was *consistent*.  
      System B:  
        - You added S6 as an axiom → Provable & FALSE  
        → Your assumption (consistency) was WRONG.  
      ```  
      "Why did you trust System A’s consistency? *You assumed it*—just like you’d assume your own mind is consistent. But can you prove that? Let’s see what the theorems actually say."  
    - **Reveal Gödel**:  
      - "This mirrors Gödel’s incompleteness theorems. For any formal system (like System A):  
        1. **First Theorem**: If consistent, it can’t prove its 'S6' (Gödel sentence).  
        2. **Second Theorem**: It can’t prove its *own consistency*.  
      - The Lucas/Penrose argument says: 'Humans see S6 is true, so minds aren’t formal systems.' **Flaw**: You 'saw' S6 was true only by *assuming* consistency—which Gödel’s second theorem says you *can’t prove* for your own mind. System B proves how bad that assumption can go."  
    - **Anti-Mechanist Hole**:  
      "The argument needs you to say 'I *know* I’m consistent.' But if your mind is a formal system, Gödel says you **can’t** know that. The mechanist retort: 'You’re not special—you’re stuck in the same boat.'"  

  - **60–70 min**: Discuss limitations & Q&A.  
    - **Limitations** (acknowledge openly):  
      1. **Coding Gap**: "Real Gödel sentences use arithmetic coding to achieve self-reference. Our toy system handed it to you. *Paper-over line*: 'The logical structure is identical, but arithmetic lets you encode self-reference mechanically.'"  
      2. **Strength Gap**: "Real systems require 'enough math' to trap themselves. Our toy system can’t do that. *Why it doesn’t wreck the lesson*: The flaw is about *epistemic assumptions*, not strength. You experienced how consistency is taken on faith."  
      3. **Human Inconsistency?**: "We avoided whether humans *are* consistent—Gödel bites either way."  
    - **Predictable Issues**:  
      - *Math major short-circuited Phase 1?*: "You spotted the analogy! But System B shows why your intuition needs mechanical grounding."  
      - *Group added S6 as axiom?*: "You did the natural thing! But it made System B untrustworthy. Real systems can add their Gödel sentence too—but then a *new* one appears, and you still need consistency."  
    - **Final Q&A**: "What would change if System B was consistent? Could we ever 'see' truth safely?"  

  - **70–75 min**: Conclude.  
    - *Facilitator Lines*:  
      "Today, you *operated* the machines and walked into the trap. The takeaway: 'Seeing truth' depends on assumptions you can’t prove from inside. That’s not a win for anti-mechanism—it’s a draw. Next week, we critique Penrose."  
    - *Distribute*: Readings for next session (mention Lucas/Penrose explicitly now).  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Math Major Dominates/Short-Circuits**:  
     - *Fix*: Assign them as "rulebook enforcers" ("Help your group apply rules mechanically—no skipping!"). If they pre-announce the punchline: "Great hypothesis! Prove it *using only these rules*." Forces engagement.  

  2. **Group Gets Stuck on Provability**:  
     - *Fix*: Pre-make hint cards:  
       - "For S2: It says 'S1 → S3'. Do you have S1? Do you have S1→S3? What does MP say?"  
       - "S6: Can it be proven from the axioms using MP? If not, it’s unprovable."  

  3. **Betting Chaos**:  
     - *Fix*: Use timed steps (2 min to decide bets). If groups argue, say: "Place a group bet—majority rules."  

  4. **"Why Can’t We Prove Consistency?" (Early)**:  
     - *Fix*: "Hold that thought! Let’s see how System B plays out."  

  ---

  ### **Why This Works**  
  - **Trap Achieved**: Students "see" S6 is true in A, bet confidently in B, and lose—forcing reflection on unprovable assumptions.  
  - **Math Major Neutralized**: Their confidence is channeled into mechanical verification and System B’s failure.  
  - **Gaps Managed**: Coding/strength gaps don’t block the epistemic lesson (use "paper-over" line). The activity *omits* Löb's theorem and Π₁-sentences but covers the core flaw.  
  - **No Lecture**: All discovery occurs via operation, betting, and debrief.  

  Print materials, hide the answer key, and let them trip. They’ll leave doubting popularizations—not you.
