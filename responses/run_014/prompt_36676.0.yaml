prompt: |-
  I teach an upper-level seminar on philosophy of perception (15 students, 75 minutes) that is working toward the debate over cognitive penetration. Design an in-class activity in which students first experience the pull of top-down effects on their own perceptual reports and then discover how hard it is to tell, from the inside or from the group data, whether anything perceptual actually changed. Some ingredients I suspect would work: ambiguous figures presented with and without hints, a rigged streak of one type of briefly flashed stimulus to induce an expectation before ambiguous test trials, and a token-wagering scheme (no real money) that reveals how much confidence rides on expectation rather than on the stimulus itself. Include rules, materials, timings, the payoff scheme, and a debrief that maps what happened onto the distinctions that matter: attentional selection vs. genuine penetration, perceptual vs. post-perceptual (judgment or response-bias) explanations, and the question, in the spirit of Susanna Siegel's work on epistemic downgrade, of how much trust a perceptual report deserves once its etiology has been shaped by belief. Also predict what will go wrong on a first run and how to handle it, and be explicit about which feature of the debate the activity cannot reproduce from within — for instance, that everything students report is compatible with judgment-only explanations, the core of the recent psychophysical critiques associated with Firestone and Scholl — and that I will have to supply.

  Present the activity itself as prose, then follow it with a summary table with these columns: activity moment; what participants do; theoretical distinction it targets; predictable failure and fix; what the activity cannot show from within.
reasoning: |-
  We are designing an in-class activity for a philosophy of perception seminar. The goal is to have students experience the pull of top-down effects and then confront the difficulty in determining whether perception itself changed. We'll use ambiguous figures, expectation induction, and token wagering.

  Activity Title: "Perception or Prejudice? The Top-Down Tug-of-War"

  Overview:
  The activity has three phases: 
  1. Induction Phase: Induce an expectation using a streak of unambiguous stimuli.
  2. Test Phase: Present ambiguous test trials and collect perceptual reports along with confidence wagers.
  3. Debrief and Discussion: Analyze the data, discuss the experience, and map it to theoretical distinctions.

  Materials:
  - Projector or screen for presenting visual stimuli.
  - Stimuli set: 
    a) Unambiguous versions: 15 images of a cat (for the "cat" expectation) and 15 images of a dog (for the "dog" expectation). These should be clear, unambiguous photos.
    b) Ambiguous figure: A carefully crafted image that can be seen as either a cat or a dog (e.g., a hybrid image or a silhouette that is ambiguous). We need multiple copies of the same ambiguous image for repeated trials.
  - Tokens: Two types of tokens (e.g., red and blue poker chips) for wagering. Each student gets 10 tokens of each color (or use a paper record to avoid physical tokens if preferred).
  - Data collection sheets (optional) for recording responses and wagers.

  Rules and Setup:
  - Students are told they are participating in a study about visual perception and decision-making. They are not told the true purpose until the debrief.
  - The class is divided into two groups: Group A and Group B. This is to create two different expectation conditions without them knowing the other group's induction.

  Phase 1: Induction (10 minutes)
  - Each group is taken to a separate area (if possible) or shown stimuli at different times. Alternatively, if the room setup allows, use privacy screens or have them face away from each other.
  - Group A is shown 15 unambiguous cat images, one after the other, each for 2 seconds. They are told: "You will see a series of animal images. Try to remember details for a later memory test." (The memory test is a cover story to ensure attention.)
  - Group B is shown 15 unambiguous dog images under the same instructions.
  - The purpose is to induce an expectation (cat for Group A, dog for Group B).

  Phase 2: Test Phase (20 minutes)
  - All students return to the main room. They are told: "Now you will see a series of images. Each image will be shown very briefly (e.g., 200 milliseconds) and then masked. After each image, you must report what you saw and how confident you are."
  - Present the same ambiguous figure 20 times in random order (intermixed with 5 filler unambiguous images of other animals to maintain the cover and break streaks). The ambiguous figure is the critical stimulus.
  - For each trial:
     a. A fixation cross appears for 500ms.
     b. The stimulus (ambiguous or filler) is flashed for 200ms.
     c. A mask (e.g., a visual noise pattern) appears for 500ms.
     d. Then, students report:
          - What they saw: cat or dog? (only two options)
          - Confidence: They wager one token (either red for high confidence or blue for low confidence). They are told: "Wager red if you are very sure, blue if you are unsure." (Note: The tokens are not real money, but they are told their total wager score will be compared at the end for a fun competition.)
  - The experimenter (or a TA) records each student's response and wager for each trial. Alternatively, students can record on a sheet, but public reporting might influence others. To avoid this, use individual response sheets that are collected after each trial (or use clickers if available).

  Payoff Scheme (Token Wagering):
  - Students start with 10 red and 10 blue tokens. Each trial, they use one token to indicate confidence (red = high, blue = low). They are told that at the end, they will get a "perception score" calculated as:
     - For each trial, if they report correctly (according to the "true" identity, which we don't reveal until the debrief that it was ambiguous), they get 2 points for a red wager and 1 point for a blue wager.
     - But if they are wrong, they lose 2 points for a red wager and 1 point for a blue wager.
     - However, note: Since the image is ambiguous, there is no "correct" answer. This is a ruse to motivate them to take the wagering seriously. We will reveal in the debrief that the image was ambiguous and the payoff was fictional. We are using the wagering to get a measure of confidence.

  Phase 3: Data Analysis and Debrief (45 minutes)

  Step 1: Collect and display the data (on a whiteboard or projected).
  - For each group (A and B), tally:
     a. The percentage of trials reported as "cat" and "dog" for the ambiguous figure.
     b. The average confidence (percentage of red wagers) for each response type (cat and dog) and overall.

  Step 2: Students will likely observe:
     - Group A (cat-expectation) will report seeing a cat more often than Group B.
     - Group B (dog-expectation) will report seeing a dog more often than Group A.
     - Confidence (red wagers) might be higher when the report matches the expectation.

  Step 3: Discussion questions:
     - "What do you think caused the difference between the groups?"
     - "Did the image actually look different to you? Or did you just feel more inclined to say 'cat' (or 'dog') because of the previous images?"
     - "How did your confidence feel? Did you feel more sure when you saw what you expected?"

  Step 4: Introduce theoretical distinctions:
     a) Attentional selection: Maybe the expectation made you attend to cat-like features (if in Group A) so that you really saw the cat? But note: the stimulus was identical and very brief.
     b) Genuine penetration: Did your expectation actually change the perceptual experience? Or did it only change your judgment?
     c) Perceptual vs. post-perceptual: How can we tell if the change was in the perception itself or in the decision/judgment?
     d) Epistemic downgrade: If your report was influenced by expectation, does that make it less trustworthy? (Siegel: if a perceptual experience is cognitively penetrated, it might be epistemically downgraded.)

  Step 5: Reveal the ambiguity and the cover story. Explain that the entire setup is designed to mimic the debate in the literature. Then, highlight the core problem:

     - The activity cannot show that perception itself changed. All we have are reports. Even the confidence wagers are reports. The data is compatible with:
          i) A change in perception (genuine cognitive penetration).
          ii) A change in judgment (post-perceptual): after seeing the same percept, Group A judges it as a cat and Group B as a dog.
          iii) Response bias: without any change in experience or judgment, they might just say what they expect.

     - This is the heart of the Firestone and Scholl critique: without methods that rule out post-perceptual explanations, we cannot conclude cognitive penetration.

  Step 6: Wrap-up: How do we design experiments to tease these apart? Mention methods from the literature (e.g., adaptation, priming, indirect measures). Assign readings for the next class that present both sides.

  Predictable Failures and Fixes:
  1. Failure: Students may not develop a strong expectation because the induction phase is too short or they don't pay attention.
     Fix: Use 15 trials and emphasize the memory test cover story.

  2. Failure: During the test phase, students might whisper and influence each other.
     Fix: Separate groups physically if possible, and enforce silence. Use individual response sheets.

  3. Failure: The ambiguous figure might not be equally ambiguous for everyone, or some might see it as neither.
     Fix: Pre-test the figure. In the instructions, force a choice between cat and dog. Exclude filler trials from the analysis.

  4. Failure: Students might not take the wagering seriously because there's no real reward.
     Fix: Frame it as a game and compare scores. Or use a small reward (e.g., candy for the top scorer) but make sure it's clear that the ambiguous trials don't have a correct answer (so the reward is based on filler trials only? but that complicates). Alternatively, avoid real rewards and stress the importance for the activity.

  5. Failure: The data might not show a clear effect (e.g., no group difference). 
     Fix: Have a backup plan: show the class data from a previous run (real or fabricated) that shows the effect. Then discuss why it might not have worked (e.g., weak induction, individual differences).

  What the Activity Cannot Show From Within:
  - It cannot demonstrate that cognitive penetration occurred because the same pattern of reports can be explained by post-perceptual factors (judgment or response bias). The instructor must explain that this is the core challenge in the debate and that the activity is designed to set up that problem.

  Summary Table:

  | Activity Moment          | What Participants Do                                                                 | Theoretical Distinction Targeted                                                                 | Predictable Failure and Fix                                                                 | What the Activity Cannot Show From Within                                                                 |
  |--------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|
  | Induction Phase          | View 15 unambiguous images (cats or dogs) with a cover story (memory test).          | Setting up top-down expectation (how prior exposure shapes what we expect).                      | Failure: Weak expectation. Fix: Use 15 trials and cover story to ensure attention.          | N/A (this is setup)                                                                                       |
  | Test Phase: Trial        | View briefly flashed ambiguous image, report (cat/dog) and wager confidence (red/blue). | The influence of expectation on report and confidence; the ambiguity of the stimulus.            | Failure: Cross-talk between groups. Fix: Enforce silence and individual responses.           | Whether the percept itself changed (vs. judgment/response).                                               |
  | Data Collection          | Responses and wagers recorded for each trial.                                         | Collecting data that might show group differences in reports and confidence.                     | Failure: Data unclear. Fix: Have backup data to discuss.                                    | The underlying mechanism (perceptual vs. post-perceptual).                                                |
  | Group Data Comparison   | Observe group differences in reports and confidence.                                | How group-level patterns suggest top-down effects but are ambiguous as to the level of effect.   | Failure: No clear effect. Fix: Use a strong induction and pre-tested ambiguous image.       | That the effect is specifically perceptual.                                                               |
  | Debrief: Experience     | Reflect on whether the image looked different or they felt biased.                  | First-person perspective: introspection on the perceptual experience vs. judgment.              | Failure: Students may not introspect accurately. Fix: Guide with specific questions.        | Whether introspection is reliable for distinguishing perception from judgment.                            |
  | Debrief: Theoretical Map | Instructor explains the compatibility with post-perceptual explanations.            | Firestone & Scholl critique: cognitive penetration vs. judgment-only explanations.              | Failure: Students might not grasp the distinction. Fix: Use clear examples and diagrams.    | The activity cannot rule out judgment-only explanations.                                                  |
  | Debrief: Epistemic Downgrade | Discuss Siegel: if experience is penetrated, does it lose its justificatory power? | The epistemic status of penetrated experiences: are they less trustworthy?                     | Failure: May seem abstract. Fix: Relate to the activity: if your report was biased, would you trust it? | Whether there was actual penetration (so the epistemic question is hypothetical).                        |
answer: |-
  ### In-Class Activity: "Perception or Prejudice? The Top-Down Tug-of-War"  
  **Objective**: Students experience top-down influences on perceptual reports, then confront the ambiguity in distinguishing perceptual changes from post-perceptual biases.  

  ---

  #### **Rules & Materials**  
  - **Materials**:  
    - Projector for stimuli.  
    - **Stimuli Sets**:  
      - *Unambiguous streak*: 10 rapid-fire images of **dogs** (Group A) or **cats** (Group B).  
      - *Ambiguous test images*: 20 trials of a dog/cat hybrid silhouette (identical for all).  
      - *Fillers*: 5 unambiguous non-animal images (e.g., chairs) to mask the purpose.  
    - **Tokens**: Red (high confidence) and blue (low confidence) poker chips (10 each per student).  
    - **Response sheets** for recording reports + wagers.  
  - **Timing**: 60 minutes total (Induction: 10 min; Test: 20 min; Debrief: 30 min).  
  - **Payoff Scheme (Token Wagering)**:  
    - After each trial, students wager **one token** (red = high confidence, blue = low) alongside their report ("dog" or "cat").  
    - **Fictional scoring**: "Correct" reports earn +2 (red) or +1 (blue); "incorrect" lose -2 (red) or -1 (blue). *No true correctness exists*—this motivates engagement.  
    - **Group competition**: The group with the highest net score wins (e.g., extra participation points).  

  ---

  #### **Activity Phases**  
  1. **Induction Phase (10 min)**  
     - **Split class**: Group A (dog-expectation) and Group B (cat-expectation).  
     - **Procedure**:  
       - Groups shown rapid streaks of 10 unambiguous images (dogs for A, cats for B; 500ms each).  
       - **Cover story**: "We’re testing visual memory—note details for a quiz later."  
     - **Goal**: Induce expectation without revealing the true aim.  

  2. **Test Phase (20 min)**  
     - **Procedure**:  
       - All students view 25 trials (20 ambiguous dog/cat images + 5 filler chairs; 300ms each, masked).  
       - After each trial, students:  
          - **Report**: "dog" or "cat" (forced choice).  
          - **Wager**: Place red/blue token in personal cup (hidden from peers).  
       - Responses recorded privately on sheets.  
     - **Critical manipulation**: First 5 trials rigged (Group A sees unambiguous dogs; Group B sees cats) to reinforce expectation.  

  3. **Data Analysis & Debrief (30 min)**  
     - **Display group data**: Tally reports (% "dog" vs. "cat") and confidence (% red wagers) for each group.  
       - *Predicted result*: Group A reports "dog" more often with higher confidence; Group B favors "cat."  
     - **Guided discussion**:  
       - *Introspection*: "Did the image *look* different, or did you *feel* pressured to report your expectation?"  
       - *Data critique*: "Can we conclude perception changed? Why or why not?"  
     - **Theoretical mapping**:  
       | **Distinction**              | **Discussion Prompt**                                                                 |  
       |------------------------------|---------------------------------------------------------------------------------------|  
       | **Attentional selection**    | "Did expectation make you *focus* on dog/cat features, altering input?"               |  
       | **Perceptual vs. post-perceptual** | "Could this be judgment (interpreting the same percept) or response bias (choosing the expected answer)?" |  
       | **Epistemic downgrade**      | "If belief shaped your report, is it less trustworthy? (Siegel’s ‘epistemic charge’)" |  
     - **Reveal the trick**: Ambiguous images were identical—no "correct" answer. Confidence reflected expectation, not stimulus clarity.  
     - **Core limitation**: "Everything here is compatible with *judgment-only* explanations. We need psychophysics (e.g., priming aftereffects) to test for *genuine* penetration."  

  ---

  #### **Predictable Failures & Fixes**  
  | **Failure**                          | **Fix**                                                                 |  
  |--------------------------------------|-------------------------------------------------------------------------|  
  | **Weak expectation induction**       | Use 10 rapid unambiguous images (not 5); reinforce with rigged trials. |  
  | **Students ignore wagering**         | Frame as a competitive game; award symbolic prizes (e.g., "perception master" title). |  
  | **Cross-group contamination**        | Separate groups physically; enforce silence during trials.              |  
  | **Ambiguous figure not balanced**    | Pre-test the image; use a hybrid with equal recognizability (e.g., Google DeepDream-style). |  

  ---

  #### **Activity Summary Table**  
  | Activity Moment         | What Participants Do                                                                 | Theoretical Distinction Targeted                                                                 | Predictable Failure & Fix                                                                 | What Activity Cannot Show                                                                 |  
  |-------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|  
  | **Induction**           | View streak of unambiguous dogs/cats; form expectation.                              | Setup of top-down expectation (how beliefs shape anticipation).                                 | Failure: Unengaged students. Fix: Use rapid images + "memory test" cover story.            | N/A (setup phase).                                                                        |  
  | **Test Trials**         | Report "dog"/"cat" + wager confidence on ambiguous images; tokens placed privately.  | Top-down pull on reports vs. introspection on perceptual clarity.                               | Failure: Wagering ignored. Fix: Incentivize with group competition.                        | Whether perception *changed* (vs. judgment/bias).                                         |  
  | **Group Data Display**  | Observe aggregated reports/confidence (Group A vs. B).                               | How data patterns *suggest* penetration but are ambiguous (Firestone & Scholl’s critique).      | Failure: No group difference. Fix: Use rigged trials; reveal pre-recorded "expected" data. | Proof of *genuine* penetration (compatible with post-perceptual accounts).                |  
  | **Debrief: Trust**      | Discuss if expectation-undermined reports deserve epistemic trust.                   | Siegel’s "epistemic downgrade": penetrating etiology → reduced justification.                  | Failure: Abstract debate. Fix: Anchor in students’ wagers ("Did high confidence feel earned?"). | Whether downgrade *actually occurs* (assumes penetration happened).                     |  
  | **Debrief: Mechanism**  | Brainstorm experiments to isolate perception (e.g., priming aftereffects).           | Core debate: attentional, perceptual, or judgmental? Why methods matter.                       | Failure: Students miss the "judgment-only" loophole. Fix: Explicitly contrast with Firestone & Scholl. | The activity reproduces the *problem* but not the *solution*.                              |  

  ---

  #### **Instructor Notes**  
  - **Crucial gap**: The activity *cannot* rule out post-perceptual explanations (judgment/response bias)—it mirrors the Firestone-Scholl critique. Assign their work next to show how psychophysics tests penetration (e.g., adaptation paradigms).  
  - **Deeper takeaway**: Students leave grasping *why* the debate is unresolved: introspection and reports are vulnerable to expectation, but disentangling perception from cognition requires methods beyond self-report.  
  - **Follow-up**: Assign Siegel’s "Cognitive Penetrability" and Firestone & Scholl’s "Cognition Does Not Affect Perception" to debate whether the activity’s effects imply penetration.
