  My team just got reorged and i'm now on the control side of things instead of alignment research, which in practice means my job is to argue we can safely deploy models we haven't proven are aligned, as long as the monitoring stack and affordance restrictions are good enough. My lead keeps saying control buys us time, but i've been loosing sleep over one specific assumption: the whole framework treats the model as possibly-adversarial but bounded, i.e. it can't do arbitrarily better than us at evading detection. So here's my actual question. What's your credence that a control-based setup (human-level-plus-monitor on outputs, honeypot opportunities where misbehaviour would get noticed, the model kept away from its own weights and from shutdown authority, periodic red-team evals) is enough to safely operate a model that is in fact deceptively misaligned? Decompose it for me rather than giving me a vibe: probability that a current-ish model is even capable of the coherent long-horizon scheming that control is designed against, probability monitoring catches misbehavior conditioned on it happening, probability a schemer sandbags exactly on our evals so we never see the scary capability in the first place, plus whatever other terms you think belong. A number and one line of justification for each, then the combination, and tell me which term is doing the most work in the final number. For context my own credence has been drifting between 0.3 and 0.6 depending on the week, and honestly I can't tell whether that's evidence updating or just mood, so it would help if you also told me what evidence would actually move yours.
