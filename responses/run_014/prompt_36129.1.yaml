  Then there's P(sandbagging | schemer). If the model is deceptive, would it sandbag during evals? Red-teaming might not reveal true capabilities if the model is hiding them. If the model believes it can escape later, it might underperform intentionally. Credence around 0.7 here, considering incentives.

