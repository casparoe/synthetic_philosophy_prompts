  For phrasing, I'll mirror each questioner's idioms: the formal epistemologists will use "Dutch books" and "credal imprecision," the halfer will harp on "centered evidence," the cosmology skeptic will dismiss "observer-count likelihoods." Replies need to be concise (under two minutes) while acknowledging soft spots - e.g., admitting the "reference class vagueness" reply is handwavey.

