prompt: |-
  I run a small cause-prioritization consultancy and we take on a new cause proposal roughly every two weeks. Each one gets a two-hour workshop where my team — three people, none of us with a stats background — is supposed to score it on importance, tractability, and neglctedness and come out with a fund / fund-with-reservations / pass call that I and one of my partners have to be able to defend in a client meeting. Right now the process is basically vibes plus a spreadsheet, and I keep hitting the same failure modes. We score a cause high on neglectedness because almost nobody's working on it, but then it turns out the reason nobody's working on it is that the people who could work on it already tried and found it intractable, so "neglected" ended up being a proxy for "we don't know how to do this." And we score importance in whatever units the proposal comes in — QALYs, dollars of economic output, "units of alignment progress" — and then try to add them across causes, which is nonsense.

  Can you write me a decision procedure my team can actually run in that two-hour slot? I want the questions in the order we should ask them, what counts as a sufficient answer to each, and the exact point where the procedure stops and hands the call to a person because the question is one of values rather than facts. Three things it has to handle. First, the neglectedness score has to seperate "few people are working on this because it's hard to even understand what the problem is" from "few people are working on this because the people who could work on it are already working on it and hitting a wall" — I think those are different and I want the procedure to catch the difference, not just count heads. Second, the importance score has to be doable without converting everything to one unit, because we're not going to fake a QALY number for a cause that's about something we can't quantify. Third, tractability has to tell the difference between a research bet, where the next step is "do more theory" and the payoff is option value, and an action, where the next step is a concrete intervention with a payoff curve we can at least sketch.

  Then run it on two proposals. One is a two-year research program on a high-tail-risk AI safety problem where the importance is potentially enormous but the only "next step" is more theory and nobody knows if the theory will pan out — I think the procedure should be honest that this is a research bet with a tail-risk importance estimate, not an expected-value action, and score it that way even if that means a lower number than the importance alone would suggest. The other is a cause that's neglected only because it's embarrassing to talk about publicly, so the neglectedness is real but it's going to evaporate the moment we fund it and put our name on it — I think the procedure should flag that as a decaying score rather than a stable property.
reasoning: |-
  We are designing a decision procedure for a small cause-prioritization consultancy. The procedure must be runnable in a two-hour workshop by a team of three without a stats background. It must address the following issues:

  1. **Neglectedness**: Distinguish between "few working on it because it's hard to understand" (which might be an opportunity) and "few working on it because previous efforts hit a wall" (which is a red flag).
  2. **Importance**: Score without converting everything to a common unit (like QALYs) when inappropriate.
  3. **Tractability**: Distinguish between a "research bet" (next step is more theory, payoff is option value) and an "action" (next step is a concrete intervention with a sketchable payoff curve).

  Additionally, the procedure must:
  - Be structured as a sequence of questions.
  - Specify what counts as a sufficient answer for each question.
  - Indicate when the decision should be handed over to human judgment (values vs. facts).

  The procedure should also handle two example proposals:
  1. A two-year research program on a high-tail-risk AI safety problem (a research bet).
  2. A cause that is neglected because it's embarrassing, so neglectedness will decay if funded.

  ### Proposed Decision Procedure

  We break the evaluation into three main sections: Importance, Tractability, and Neglectedness. We then combine these for a final recommendation. The procedure is designed to be completed in two hours, so each section must be time-boxed (e.g., 30-40 minutes per section).

  #### Step 0: Pre-Workshop Preparation (to be done by the proposer or a team member before the workshop)
  - The cause proposal must be submitted at least 48 hours in advance and include:
    - A clear description of the problem and the proposed intervention.
    - Any available data on the scale of the problem (in natural units, e.g., number of people affected, potential magnitude of risk, etc.).
    - A list of existing efforts (if any) and reasons why they might be insufficient or absent.
    - A clear "next step" that funding would enable.

  #### Step 1: Importance (30 minutes)
  **Goal:** Estimate the potential positive impact of addressing the cause, without requiring conversion to a common unit.

  **Questions:**
  1. **What is the scale of the problem?** 
     - *Sufficient answer:* A description of the number of individuals/entities affected and the magnitude of effect per individual/entity. If the cause is about reducing risk, describe the potential downside and its probability (even if roughly).
     - *Scoring:* 
       - High: Affects a large number of entities (e.g., global scale) and/or the magnitude per entity is very high (e.g., existential risk).
       - Medium: Significant but not global, or high magnitude but for a smaller group.
       - Low: Small scale and low magnitude.
     - *Note:* If the cause is about a risk with low probability but high impact, use a rough expected impact (impact * probability) but flag it as highly uncertain.

  2. **Is the problem irreversible or reversible?**
     - *Sufficient answer:* If the harm is irreversible (e.g., extinction, permanent disability) or reversible (e.g., a temporary economic downturn).
     - *Scoring:* 
       - High: Irreversible harm.
       - Medium: Partially reversible.
       - Low: Fully reversible.

  3. **Does the problem disproportionately affect disadvantaged populations?**
     - *Sufficient answer:* Yes or no, and if yes, how disadvantaged?
     - *Scoring:* 
       - High: Affects the most disadvantaged (e.g., extreme poverty, persecuted minorities).
       - Medium: Affects moderately disadvantaged.
       - Low: Affects non-disadvantaged.

  **Combining Importance Scores:**
  - The team assigns an overall importance score (High, Medium, Low) by consensus, based on the above. No numerical aggregation required. The score should reflect the team's judgment of the overall importance.

  **Handoff to values:** If there is disagreement that stems from different values (e.g., one member cares more about animals, another about future generations), note the disagreement and proceed. The final decision will require human judgment on values.

  #### Step 2: Tractability (30 minutes)
  **Goal:** Assess how feasible it is to make progress on the cause, and distinguish between research bets and actions.

  **Questions:**
  1. **What is the next step?**
     - *Sufficient answer:* A clear description of the immediate next step that funding would enable.
     - *Categorization:*
       - **Research bet:** The next step is primarily theoretical research (e.g., writing a paper, developing a model, running simulations) and the outcome is uncertain (option value).
       - **Action:** The next step is a concrete intervention (e.g., pilot program, advocacy campaign, product development) with a relatively predictable payoff curve.

  2. **What is the evidence for tractability?**
     - *Sufficient answer:* 
       - For a research bet: Evidence that the research direction is promising (e.g., analogous problems have been solved, strong theoretical foundation, expert endorsement) and that the team is capable.
       - For an action: Evidence that the intervention has worked in similar contexts, or pilot data showing effectiveness.
     - *Scoring (for tractability):*
       - High: Strong evidence (e.g., multiple successful pilots, strong theory) and clear path to scaling.
       - Medium: Some evidence (e.g., one pilot, moderate theoretical backing) but uncertainties remain.
       - Low: Little evidence, or past attempts have failed.

  3. **What are the key uncertainties?**
     - *Sufficient answer:* List the main unknowns that could derail the project.
     - *Scoring adjustment:* If the next step is a research bet, the tractability score must be capped at Medium (because by definition, research bets are highly uncertain). The team should note that the project is a research bet and that the tractability score reflects the chance of generating useful knowledge, not direct impact.

  **Combining Tractability Scores:**
  - Assign an overall tractability score (High, Medium, Low) by consensus. For research bets, note that the score represents the chance of generating option value, not direct impact.

  **Handoff to values:** If the team disagrees on the categorization (research bet vs. action) or on the level of uncertainty, and the disagreement cannot be resolved with available information, flag it for human judgment in the final decision.

  #### Step 3: Neglectedness (30 minutes)
  **Goal:** Determine why the cause is neglected and whether that neglect is a positive signal (opportunity) or a negative one (prior failures).

  **Questions:**
  1. **How many people/organizations are currently working on this cause?**
     - *Sufficient answer:* A rough count (0, 1-5, 6-20, 20+). Include only those actively working (not just interested).

  2. **Why are so few people working on it?**
     - *Sufficient answer:* Choose the primary reason from:
       - **Hard to understand:** The problem is complex, understudied, or not well-defined.
       - **Barriers to entry:** High expertise required, regulatory hurdles, or lack of funding.
       - **Embarrassment/controversy:** The topic is taboo or socially risky to address.
       - **Prior failures:** Previous attempts have failed, leading to abandonment.
       - **Other:** Specify.

  3. **What is the trend in attention?**
     - *Sufficient answer:* Is attention increasing, stable, or decreasing? Why?

  **Combining Neglectedness Scores:**
  - Assign a neglectedness score (High, Medium, Low) based on the count (fewer -> higher) but adjust for the reason:
    - High: Few working because it's hard to understand (an opportunity) OR because of barriers/embarrassment (if the barriers can be overcome by funding).
    - Medium: Few working because of barriers that are hard to overcome OR because it's a new field and attention is increasing.
    - Low: Many working, OR few working because of prior failures (unless there's a new angle) OR attention is rapidly increasing without our intervention.

  **Handoff to values:** If the reason for neglect is controversial (e.g., is the cause really embarrassing or is it just not important?) and the team cannot agree, flag for human judgment.

  #### Step 4: Final Recommendation (30 minutes)
  **Goal:** Combine the scores and make a fund/fund-with-reservations/pass call.

  **Decision Matrix:**

  | Importance | Tractability | Neglectedness | Recommendation |
  |------------|-------------|---------------|----------------|
  | High       | High        | High          | Fund           |
  | High       | High        | Medium        | Fund           |
  | High       | Medium      | High          | Fund with reservations (note: research bets often land here) |
  | High       | Medium      | Medium        | Fund with reservations |
  | High       | Low         | Any           | Pass (unless there's a compelling reason to take a moonshot) |
  | Medium     | High        | High          | Fund with reservations |
  | Medium     | High        | Medium        | Fund with reservations (if resources allow) |
  | Medium     | Medium      | High          | Fund with reservations (if resources allow) |
  | Medium     | Low         | Any           | Pass           |
  | Low        | Any         | Any           | Pass           |

  **Adjustments:**
  - **Research bet flag:** If the cause is a research bet, the recommendation must be at least "fund with reservations" (because the expected value might be high even if tractability is medium). The team must explicitly discuss the option value and the importance of the tail risk.
  - **Decaying neglectedness:** If the neglectedness is due to embarrassment and funding would likely remove the neglect (by making it acceptable), then the neglectedness score should be treated as high but with a note that it might decay rapidly. This doesn't change the score but should be a factor in the final call (e.g., if the cause is otherwise strong, we might fund but with a plan for rapid scaling before the window closes).

  **Final Call:**
  - The team assigns a preliminary recommendation based on the matrix.
  - Then, discuss:
    - Are there any overriding factors (e.g., strategic fit with the client, time sensitivity, opportunity to learn)?
    - Are there any values disagreements that need to be elevated?
  - Final recommendation: Fund, Fund with reservations, or Pass.

  ### Running the Examples

  #### Example 1: Two-year research program on a high-tail-risk AI safety problem
  - **Importance:** 
    - Scale: Global (existential risk). -> High
    - Irreversibility: Irreversible. -> High
    - Disadvantaged populations: Not directly applicable, but affects all future generations. -> High (by extension)
    - Overall: High
  - **Tractability:**
    - Next step: More theory (research bet). 
    - Evidence: Some theoretical groundwork exists, but no guarantees. -> Medium (capped because it's a research bet)
    - Uncertainties: High (we don't know if the theory will pan out).
    - Overall: Medium (with note: research bet)
  - **Neglectedness:**
    - Count: Few (maybe 1-5 groups working on this specific angle).
    - Reason: Hard to understand (it's a new angle) and also because it's a research bet (some might avoid due to uncertainty).
    - Trend: Stable or slightly increasing.
    - Overall: High (because it's hard to understand and few are working on it, and no prior failures reported for this specific angle).
  - **Recommendation:** 
    - Matrix: High importance, Medium tractability, High neglectedness -> Fund with reservations.
    - Adjustment: Because it's a research bet with high tail risk, the team might still recommend funding, but with reservations due to the uncertainty. The final call should note the option value.

  #### Example 2: Cause neglected because it's embarrassing
  - **Importance:** 
    - (Assume it's Medium: significant but not global.)
  - **Tractability:**
    - Next step: An action (e.g., launch a campaign). 
    - Evidence: Similar campaigns in non-embarrassing contexts have worked. -> High
    - Overall: High
  - **Neglectedness:**
    - Count: Few (0-5).
    - Reason: Embarrassment (people avoid because it's taboo).
    - Trend: Stable (unless we break the taboo).
    - Overall: High (but note: neglectedness is likely to decay if we fund and attach our name, making it acceptable).
  - **Recommendation:** 
    - Matrix: Medium importance, High tractability, High neglectedness -> Fund with reservations.
    - Adjustment: The decaying neglectedness means that the window of opportunity might be short. The team should consider if the cause is time-sensitive and if the organization can move fast. This might push it to a "fund" if the client can act quickly.

  ### Summary of the Procedure
  - **Time allocation:** 
    - Importance: 30 min
    - Tractability: 30 min
    - Neglectedness: 30 min
    - Final Recommendation: 30 min
  - **Output:** A structured worksheet with answers to each question and a final recommendation.

  This procedure addresses the failure modes by:
  1. Separating reasons for neglect (via the "why" question).
  2. Avoiding forced unit conversion for importance (using qualitative scales and natural units).
  3. Distinguishing research bets from actions (in tractability) and scoring them appropriately.
answer: |-
  Here's a structured decision procedure designed for your constraints, with clear questions, sufficiency criteria, and handoff points to human judgment. The process fits within a 2-hour workshop and addresses your three requirements.

  ---

  ### **Cause Prioritization Decision Procedure**  
  **Time Allocation:**  
  - Prep (15 min) → Importance (25 min) → Tractability (25 min) → Neglectedness (25 min) → Synthesis (20 min) → Final Call (10 min)  
  **Key:**  
  - ⚖️ = Values handoff point (human judgment needed)  
  - 🟢 = Sufficient answer  
  - 🔴 = Insufficient (trigger "pass" or "fund with reservations")

  ---

  #### **Step 0: Prep (15 min)**  
  **Goal:** Frame the cause neutrally.  
  1. **Question:** "What is the core problem, and what specific outcome would success look like?"  
     - 🟢 Sufficient: 1-sentence problem statement + 1-sentence success definition.  
     - 🔴 Insufficient: Vague or multi-outcome success criteria.  

  ---

  #### **Step 1: Importance (25 min)**  
  **Goal:** Assess scale *without* unit conversion.  
  1. **Question:** "What is the worst-case and best-case impact if this succeeded? Describe in natural units (e.g., 'X lives saved,' 'Y% reduction in risk')."  
     - 🟢 Sufficient: Qualitative magnitude (e.g., "regional scale," "existential risk tier") + key affected groups.  
     - 🔴 Insufficient: Defaulting to dollar/QALY conversions.  

  2. **Question:** "Is this impact concentrated on overlooked populations or irreversible harms?"  
     - 🟢 Sufficient: Yes/no + brief justification (e.g., "affects marginalized group Z," "prevents irreversible biodiversity loss").  
     - ⚖️ **Handoff to values:** If disagreement on *which populations/timeframes matter*.  

  **Scoring Output:**  
  - **High:** Irreversible/catastrophic harm + large scale (e.g., >10M people, systemic collapse).  
  - **Medium:** Reversible harm + moderate scale.  
  - **Low:** Localized/non-catastrophic impact.  

  ---

  #### **Step 2: Tractability (25 min)**  
  **Goal:** Distinguish research bets from concrete actions.  
  1. **Question:** "What is the very next step for progress? Is it a knowledge-generating activity (e.g., research, theory) or a direct intervention (e.g., policy, product)?"  
     - 🟢 Sufficient: Clear next step + classification as:  
       - **Research Bet:** "Develop a model," "Run simulations."  
       - **Action:** "Pilot program in X location," "Lobby for bill Y."  

  2. **Question:** "What is the strongest evidence this could work? (e.g., prototypes, historical analogs, expert consensus)."  
     - 🟢 Sufficient for *Actions*: Data from similar contexts/regions.  
     - 🟢 Sufficient for *Research Bets*: Theory paper or expert endorsement.  
     - 🔴 Insufficient: Anecdotes or no analogs.  

  3. **Question:** "Could progress stall even with funding? What are the top 2 roadblocks?"  
     - 🟢 Sufficient: Specific risks (e.g., "regulatory hurdle X," "unknown variable Y").  

  **Scoring Output:**  
  - **High:** Action with evidence + low roadblocks.  
  - **Medium:** Research bet with plausible theory OR action with moderate roadblocks.  
  - **Low:** No evidence + high uncertainty.  
  - ⚖️ **Handoff to values:** If team disagrees on *risk tolerance* for research bets.  

  ---

  #### **Step 3: Neglectedness (25 min)**  
  **Goal:** Separate "hard to understand" from "tried and failed."  
  1. **Question:** "Who else is working on this? List organizations/individuals + their current approach."  
     - 🟢 Sufficient: Named entities + summary of activities.  

  2. **Question:** "Why aren’t more working on this? Categorize: (a) Novelty/complexity, (b) Barriers (e.g., funding, expertise), (c) Controversy/embarrassment, (d) Prior failures."  
     - 🟢 Sufficient: Clear primary reason (e.g., "embarrassment" or "failed 2020 trial by Group X").  

  3. **Question:** "If we fund this, will neglect likely decrease rapidly? Why?"  
     - 🟢 Sufficient: Yes/no + mechanism (e.g., "our endorsement reduces stigma," "success attracts copycats").  

  **Scoring Output:**  
  - **High:** Few players due to *novelty* or *barriers we can break*.  
  - **Medium:** Due to *controversy* or *moderate prior failures*.  
  - **Low:** Due to *major prior failures* or *inherent intractability*.  
  - **Decay Flag:** If neglect is unstable (e.g., embarrassment), mark "NEGLECT-DECAY."  

  ---

  #### **Step 4: Synthesis & Final Call (30 min)**  
  **Goal:** Combine scores + assign recommendation.  
  1. **Question:** "Do scores align? If not, which pillar dominates?"  
     - 🟢 Sufficient: Consensus on dominant factor (e.g., "High importance overrides medium tractability").  
     - ⚖️ **Handoff to values:** If irreconcilable trade-offs (e.g., "Is tail risk worth low tractability?").  

  2. **Apply Rules:**  
     - **Fund:** High importance + (High tractability OR Medium tractability w/ research bet) + High/Medium neglectedness.  
     - **Fund with Reservations:**  
       - Medium importance + Medium scores.  
       - "NEGLECT-DECAY" flag.  
       - Research bets with high importance.  
     - **Pass:**  
       - Low in any pillar.  
       - Neglectedness due to prior failures.  
       - Importance-tractability mismatch (e.g., high importance + low tractability without research upside).  

  3. **Document Defensibility:**  
     - "Client defense note:" 1-sentence justification per pillar (e.g., "High importance: mitigates tail risk of AI extinction").  

  ---

  ### **Example Runs**  
  #### **Proposal 1: AI Safety Research Bet**  
  - **Importance:**  
    - Worst-case: "Human extinction." Best-case: "Framework for safer systems." → **High** (irreversible, large scale).  
  - **Tractability:**  
    - Next step: "Theoretical research on alignment." → Research bet.  
    - Evidence: "Two published preprints suggest feasibility." → **Medium** (plausible but no real-world validation).  
    - Roadblocks: "Uncertain if math generalizes."  
  - **Neglectedness:**  
    - Players: "3 academia groups."  
    - Why neglected: "Novelty + high expertise barrier." → **High**.  
    - Decay risk? "No" → No flag.  
  - **Synthesis:**  
    - Fund with reservations (High importance + Research bet + High neglectedness).  
    - Client note: "Tail-risk importance justifies speculative research; neglect due to novelty, not failure."  

  #### **Proposal 2: Embarrassing But Neglected Cause**  
  - **Importance:**  
    - Worst-case: "10M people suffer stigma." Best-case: "Reduce suffering by 50%." → **Medium** (reversible, large scale).  
  - **Tractability:**  
    - Next step: "Awareness campaign in 3 cities." → Action.  
    - Evidence: "Analog campaign reduced stigma in similar culture." → **High**.  
  - **Neglectedness:**  
    - Players: "None (taboo topic)."  
    - Why neglected: "Embarrassment to discuss publicly." → **Medium** + **NEGLECT-DECAY flag** (funding likely reduces neglect).  
    - Decay risk? "Yes, our backing legitimizes it."  
  - **Synthesis:**  
    - Fund with reservations (Medium importance + High tractability + Medium neglectedness + decay flag).  
    - Client note: "Act now before neglect decays; tractability high via tested methods."  

  ---

  ### **Why This Works for Your Team**  
  1. **No stats needed:** Qualitative scales + clear categories (research/action, neglect reasons).  
  2. **Handles your failure modes:**  
     - Neglectedness distinguishes "novelty" (good) from "prior failures" (bad) via explicit categorization.  
     - Importance uses natural units and irreversibility, avoiding false quantification.  
     - Tractability flags research bets and scores them separately.  
  3. **Fits timebox:** Structured questions with time limits per section.  
  4. **Defensible outputs:** Client-ready justifications built in.  

  **Template:** Use a simple spreadsheet with dropdowns for scores (High/Medium/Low) and checkboxes for flags (e.g., "NEGLECT-DECAY," "RESEARCH-BET").
