prompt: |-
  So me and my friend just spent like literally 4 hours arguing about what counts as corruption and now were both annoyed lol. He grew up where you bring yams or mangoes to the clinic nurse and to your kids teacher after they helped you and he says thats just being decent, not corruption. I said fine but what about when his mayor cousin hands out rice bags and roofing sheets right before an election and then people feel they have to vote for him, thats clientelism and definately corruption right, and he says its the same logic just bigger and calling one corruption is just imposing a western rulebook.

  Can you sort it out by comparing two different ideas of corruption — corruption as using a public job for private payoff versus corruption as messing up the unwritten reciprocity rules of your own community. Test both ideas against our two cases, the after-the-fact thank-you yams for the nurse/teacher versus the before-the-vote rice and roofing handouts tied to support.

  Give me exactly five numbered points, each one or two sentences, no intro and no conclusion.
reasoning: |-
  Okay, the user and their friend have been arguing for four hours about what counts as corruption, specifically comparing bringing yams or mangoes to a nurse or teacher versus a mayor handing out rice and roofing sheets before an election. The user wants me to compare two ideas of corruption: using a public job for private payoff versus violating community reciprocity rules. I need to test both cases against these definitions and provide exactly five numbered points without an intro or conclusion.

  First, for the yams/mangoes case: This seems like a gift after services are rendered. In many cultures, this is a token of appreciation, not influencing future actions. It's aligned with community reciprocity norms where gifts strengthen social bonds without explicit expectations. Against the private payoff definition, since it's not for preferential treatment, it doesn't fit as corruption here.

  Now, the mayor's rice and roofing: Given before an election with implied voting obligations, this is clientelism. It's leveraging public resources for political gain, which fits the private payoff definition perfectly—using office for electoral advantage. But under community reciprocity, it might be seen as a leader's duty to provide, though timing it with votes twists it into a transactional exchange, violating genuine reciprocity.

  For the private payoff definition: The teacher/nurse gifts don't involve soliciting favors, so it's not corruption. The mayor's actions clearly trade goods for votes, which is corrupt under this view.

  For the community rules definition: The yams/mangoes follow unwritten norms of gratitude, while the mayor's pre-election gifts exploit those norms for coercion, thus corrupting them.

  Finally, comparing both cases: The key difference is timing and intent—post-service gifts versus preemptive exchanges with strings attached. This highlights how context turns similar actions into corruption or not.
answer: |-
  Here are five numbered points comparing the two corruption frameworks against your cases:

  1.  **Private Payoff Framework:** The yams/mangoes given *after* service as thanks do not constitute corruption here, as they are unsolicited tokens of gratitude, not payments solicited or demanded for preferential treatment or access to the service.
  2.  **Private Payoff Framework:** The mayor's pre-election distribution of rice/roofing *is* corruption, as it explicitly uses public resources (or position) to secure a private benefit (votes/election victory), creating an illicit exchange.
  3.  **Community Reciprocity Framework:** The yams/mangoes align with local reciprocity norms, reinforcing social bonds through appropriate, non-coercive gratitude after a service has been freely given, thus not "messing up" community rules.
  4.  **Community Reciprocity Framework:** The mayor's timed handouts *corrupt* reciprocity by twisting it into a coercive, preemptive transaction; the "gift" becomes an obligation demanding a specific political return, exploiting community norms for power.
  5.  **Key Distinction:** The primary difference lies in timing, coercion, and proportionality: unsolicited thanks after service vs. strategically timed material goods creating an obligation *before* a discretionary act (voting), fundamentally altering the nature of the exchange under both frameworks.
