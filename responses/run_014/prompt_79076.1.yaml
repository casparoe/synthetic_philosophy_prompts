prompt: |-
  Write a poem of exactly five four-line stanzas for a reading group that has spent a term on heuristic arguments in AI-safety forecasting. The concept is the presumption of independence: when you estimate the chance that a computation succeeds by listing the conditions it would have to satisfy and multiplying their probabilities, you default to treating those conditions as independent — satisfying one tells you nothing about satisfying another — and you abandon that default only when you can point to something that makes two of them travel together. The form should enact this rather than describe it. Let the first four stanzas heap up conditions and coincidences while the speaker's running product of probabilities falls to something absurdly small; let the fifth turn on the dependence the speaker had assumed away, the shared cause that makes the conditions travel together, so that the joint chance is not the product and the speaker can name the direction in which their arithmetic was wrong. Give the poem a single refrain line, in the same position in every stanza: the speaker should spend four stanzas treating its return as a coincidence that wants explaining, and the fifth should show that, once the shared cause is in view, the return carries no independent information at all. It should be recognizable to someone who works on this as a poem about the presumption and about the specific way it fails, and it should stand up for a reader who has never heard of it. Give me the poem alone, with no title, preface, or afterword.
reasoning: |-
  Okay, the user wants a very specific poem about heuristic arguments in AI safety, focusing on the presumption of independence. They're clearly deeply familiar with the technical concept - probably an academic or researcher in AI safety forecasting. The level of detail in their request suggests they've thought about this deeply and want the poem to serve both as an artistic expression and pedagogical tool for their reading group.

  Hmm, the challenge is balancing strict technical accuracy with poetic accessibility. The refrain line needs to do double duty: for experts it should trigger recognition of the independence assumption failure, while remaining mysterious enough for lay readers until the reveal. 

  Breaking down the requirements: five quatrains with identical refrain position; first four stanzas accumulate multiplying probabilities ("running product falls absurdly small"); fifth stanza reveals the shared cause ("direction in which arithmetic was wrong"). The refrain must transform meaning in the final stanza - from inexplicable coincidence to something carrying "no independent information."

  The technical core is modeling failure modes: when we list failure conditions A,B,C... and multiply P(A)P(B)P(C)..., we're assuming statistical independence. But often some hidden variable Z affects all (e.g. flawed hardware causing multiple subsystem failures). Then P(A∩B∩C) ≈ P(Z), not the product.

  For the refrain... "The shadow crosses the screen" works well - visually suggestive but technically resonant (like error signals or system alerts). Each stanza adds a new condition: hardware glitch, power surge, etc. Probabilities multiply down from 0.99 to 0.0001 - absurdly small. 

  Key poetic devices: 
  - Enjambment for "falling" probabilities
  - Thermal imagery threading through (overheating chips → shared cause)
  - Final stanza's "fever in the core" reveals the dependence

  Verifying structure: 
  Stanza 1: 0.99 chance (hardware glitch) × refrain
  Stanza 2: 0.9 (power surge) × refrain → 0.891
  Stanza 3: 0.1 (sensor fail) × refrain → 0.0891
  Stanza 4: 0.01 (code error) × refrain → 0.000891 → "absurdly small"
  Stanza 5: Reveal thermal runaway as shared cause → joint probability not product

  The math roughly tracks: if P(thermal runaway)=0.05, but P(failure|thermal)=0.99 for each subsystem, the joint probability is ~0.05 rather than the product 0.000891. The refrain becomes just a symptom rather than independent event.

  For accessibility: terms like "server halls" and "circuits" ground it in tangible tech while avoiding jargon. The thermal metaphor works for both engineers (literal overheating) and general readers (emotional fever).
