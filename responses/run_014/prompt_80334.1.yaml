  First, I need to figure out if there's an existing term for this. I recall that in philosophy, the trolley problem falls under "intuition pumps," a term coined by Daniel Dennett. An intuition pump is designed to elicit an intuitive response, not to be a rigorous argument. That seems close. But the user is pointing out that people get hung up on the details, which aren't actually essential—they're arguing as if the specifics matter when they don't. So maybe "intuition pump" covers the scenario creation, but not the misplaced focus on details.

  Next, I consider "framing effects" from cognitive psychology, where how a problem is presented influences decisions. The trolley problem can be framed differently (switch tracks vs. push someone), leading to different reactions. But the user is saying that even when details change (bus instead of train), their gut reaction is the same. So framing effects might explain why details affect others, but the user is more focused on the unnecessary arguing over irrelevant specifics.

  Then there's "hyperreality" or "simulacra" from postmodern theory, where simulations become more real than reality. Thought experiments are hyperreal constructs, but this might be too abstract. The user's point is about the disconnect between the psychological tool and the argumentative structure, not necessarily about reality being replaced.

  The core issue seems to be the conflation of the concrete details as essential to the argument when they're merely vehicles for intuition. People are engaging in "criterial debates"—arguing about the criteria (like the number of people) as if they determine the principle, but the principle doesn't depend on those specifics. The user feels the details are disposable, yet others treat them as foundational.

  The phenomenon is the use of concrete scenarios solely to evoke intuitions, where the details are psychologically necessary but logically irrelevant. Arguments then center on these details, mistaking them for essential components of the principle being examined. This is distinct because the focus shifts to criterial debates instead of the underlying principle.

  Edge cases: When details do matter—like in utilitarianism where numbers actually affect the calculation. Also, in legal or ethical contexts where specifics (like relationships) change duties. And when the thought experiment is designed to test boundaries, making details argumentatively relevant.

  Since "intuition pump" is close but doesn't emphasize the misplaced argumentative focus, a new term might be needed. "Criterial displacement" or "argumentative decoy" could work. The former highlights the shift from principles to criteria, the latter the distraction aspect. "Criterial displacement" seems more precise, defining it as the phenomenon where non-essential details become the focus of debate.

  I should check if the user might be conflating this with red herrings or straw men, but those are fallacies, whereas this is about the structure of thought experiments. The user's deeper need might be to understand why people get stuck on details and how to redirect discussions to core principles. They might want tools to clarify arguments or identify when details are irrelevant.
answer: |-
  Here’s a structured breakdown addressing your observation:

  ### 1. Short Answer  
  **No, there is no single established term for the phenomenon you describe.** While related concepts like "intuition pump" or "framing effect" touch on aspects of it, none fully capture the *misplaced argumentative focus on disposable concrete details* that you’ve identified.

  ### 2. Closest Existing Terms  
  **a. Intuition Pump (Daniel Dennett):**  
  *Fits*: This term describes thought experiments (like the trolley problem) designed to evoke intuitive judgments. It acknowledges that concrete scenarios are psychological tools to "pump" intuitions about abstract principles.  
  *Falls short*: It doesn’t address why people treat variable details (e.g., "bus vs. train" or "5 vs. 500 people") as argumentatively significant when the core intuition remains stable. Your observation targets the *debate about details* as a distraction, whereas "intuition pump" focuses on the scenario’s design.

  **b. Framing Effect (Cognitive Psychology):**  
  *Fits*: Explains how identical problems presented differently (e.g., "pulling a lever" vs. "pushing a person") alter decisions, revealing cognitive biases.  
  *Falls short*: Your concern is the *irrelevance* of details to the intended principle. Framing effects assume details *do* influence outcomes meaningfully, while you argue that in these cases, they’re interchangeable psychological triggers—not variables affecting the core ethical/metaethical question.

  **c. Hyperreality (Baudrillard) / Simulacrum:**  
  *Fits*: In postmodern theory, hyperreality describes simulations (e.g., thought experiments) that become more "real" than the abstractions they represent. Debates about plank-replacement schedules in the Ship of Theseus could exemplify this.  
  *Falls short*: This concept critiques cultural detachment from reality, not the *argumentative misdirection* in philosophical discourse. Your point is about logical irrelevance, not semiotic displacement.

  ### 3. What You Actually Keep Seeing  
  **The phenomenon is this:** Thought experiments use highly specific, concrete scenarios as *psychological catalysts* to trigger an intuition about an abstract principle (e.g., utilitarianism, personal identity). Crucially, these details are *logically disposable*—the intuition persists across variations (bus/train, 5/500 people, slow/fast plank replacement). Yet participants in debates mistakenly treat these details as *argumentatively essential*, engaging in "criterial debates" (e.g., "Is it the same boat if reassembled?") that distract from the core principle. The concreteness acts as a *cognitive decoy*, creating the illusion that the intuition derives from the scenario’s particulars when it’s actually about the underlying abstraction. It’s **not** about cognitive biases (framing) or heuristic design (intuition pumps) but about the *conflation of psychological scaffolding with logical structure*.

  ### 4. Where It Stops  
  This phenomenon applies **only** when:  
  - The intuition is robust across detail variations (e.g., switching trolley tracks feels wrong regardless of vehicle type).  
  - Debates fixate on details irrelevant to the principle (e.g., "What if the single person on the track is a criminal?" in utilitarianism).  
  **It stops being relevant when:**  
  - Details *are* argumentatively material (e.g., in the trolley problem, "pulling a lever" vs. "pushing someone" tests the doctrine of double effect).  
  - The scenario tests boundary conditions (e.g., "How many replaced planks make the Ship of Theseus a new boat?" *if* debating persistence thresholds).  
  - Concreteness is necessary (e.g., neuroscience experiments where brain regions respond differently to "train" vs. "bus" imagery).

  ### 5. A Name, If It Needs One  
  **Proposed term: "Criterial Displacement"**  
  **Definition:** *The rhetorical misstep in which variable, non-essential details of a thought experiment—designed solely to evoke an intuition about an abstract principle—are erroneously treated as criteria defining or validating that principle, diverting discourse into logically inconsequential debates.*  
  **Why this term?** "Criterial" emphasizes the focus on *standards* (details mistaken for necessary conditions), while "displacement" captures the shift from principle to particulars. It distinguishes this from intuition pumps (which are neutral tools) by highlighting the *error* in subsequent engagement.  
  **Nearest non-fit:** Unlike a "red herring" (deliberate distraction), criterial displacement arises organically from the thought experiment’s concrete presentation. Unlike "reification" (treating abstractions as concrete), it’s the reverse: treating concrete details as essential abstractions.  

  **Key takeaway:** You’ve identified a subtle flaw in how thought experiments are deployed and debated—one where psychological effectiveness is mistaken for logical rigor. "Criterial displacement" names this gap between the *vehicle* (concrete details) and the *cargo* (the principle), and the tendency for discourse to fixate on the former.
