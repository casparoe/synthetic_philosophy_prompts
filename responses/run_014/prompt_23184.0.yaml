  Okay so I've been down a rabbit hole on this thing called the "problem of old evidence" in "Bayesian epistemology" (or is it philosophy of science? I'm not totally sure where it lives) and I keep going in circles, so I'd love for you to write me a dialogue that might help me sort it out.

  Here's the gist as I understand it: sometimes you've got a piece of evidence that was already known before some new theory was even proposed, and teh question is whether that old evidence can count as "confirming" the new theory. The example that keeps coming up for me is that the weird little drift in Mercury's orbit (the perihelion thing) was a known puzzle for a long time before Einstein's general relativity, and then GR basically explained it. So does that old evidence "confirm" GR? Or is it too late for it to count?

  I think there's a real disagreement here, but I can't tell if it's substantive or if people are just talking past each other. Could you write a dialogue between two people who've both really thought this thru — one who thinks old evidence CAN confirm a new hypothesis, and one who thinks it can't, at least not in the standard "Bayesian" sense? I want them to be genuinely sharp on both sides, not one of them being a strawman. And I'd love it if they actually respond to each other's points rather than each giving their own prepared speech. Maybe they can use the Mercury example (or the periodic table, or whatever's clearest) to ground it, and I'd be happy if they grapple with whether "explaining" a previously unexplained anomaly is the same thing as "confirming" a theory, because that's where I keep getting stuck.
