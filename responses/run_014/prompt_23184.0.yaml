answer: |-
  Here’s a dialogue between **Alex** (who argues old evidence *cannot* confirm new hypotheses in strict Bayesian terms) and **River** (who argues it *can*, with caveats). They’re wrestling with the Mercury perihelion example, and their debate hinges on *probability updates*, *background knowledge*, and whether "explaining" implies "confirming."

  ---

  **Setting:** *Two philosophers of science debating over coffee, after a seminar on Bayesian confirmation.*

  **Alex:** So, take Einstein and Mercury’s perihelion. The anomaly was known *decades* before GR. When Einstein showed GR predicted it, physicists were thrilled. But mathematically? It shouldn’t count as Bayesian confirmation. Confirmation requires evidence to *raise* the probability of the hypothesis. If the evidence E (Mercury’s drift) was already certain (*P*(E) = 1), then *P*(H|E) = *P*(H). GR gets *no* probability boost. The "surprise" is psychological, not probabilistic.

  **River:** Hold on—you’re treating E as a static fact floating in a vacuum. But *before GR*, Mercury’s drift *wasn’t* fully absorbed into background knowledge (*B*). It was an *unsolved anomaly* in Newtonian mechanics. When GR *explains* it, we’re not just learning E—we’re learning that GR *entails* E *given* B. *That* is new information.

  **Alex:** What’s "new"? The logical fact that GR → E? Sure, that’s new. But in Bayesian terms, we update on *observations*, not logical discoveries. If E is already known, observing it again gives no new data. The probability calculus is clear: if *P*(E) = 1, then *P*(H|E) = *P*(H). Full stop.

  **River:** But that assumes E is *certain* in a way that ignores context. Before GR, physicists *knew* E, but they also knew *no existing theory explained it*. So when GR comes along and *fits* E perfectly—while rivals like Newtonian gravity *don’t*—it’s not E itself confirming GR. It’s the *contrastive fact* that GR succeeds where others fail. Bayesianism can capture this by comparing likelihoods: *P*(E | GR, B) ≈ 1, but *P*(E | Newton, B) ≈ 0. That boosts GR *relative to alternatives*.

  **Alex:** Ah, but now you’ve smuggled in a rival hypothesis. If we’re comparing GR to Newton, then yes—E *discounts* Newton further (since it was already known Newton failed). But does E *raise* GR’s *absolute* probability? No! GR was conceived *after* E was known. Its prior *P*(GR) already "baked in" that it had to account for E to be viable. There’s no *update*.

  **River:** Let’s reframe the "evidence." The meaningful event isn’t "observing E" again—it’s *realizing that GR entails E*. Call this logical fact **D** (for "deducibility"). Before Einstein, *P*(D) was low—no one saw how *any* theory could explain Mercury. But when Einstein shows H → E, *D* becomes certain. *Now* we update: *P*(GR | D) > *P*(GR), because *P*(D | GR) is high (by design), while *P*(D | ~GR) is low. The "old evidence" E is just a prop; the real update is on *D*.

  **Alex:** That feels like sleight of hand. **D** isn’t empirical evidence—it’s a mathematical insight. Bayesianism is about *empirical* confirmation. If we allow logical discoveries to confirm theories, then every time a theorist scribbles a proof, their hypothesis gets "confirmed"? That trivializes confirmation.

  **River:** Isn’t that exactly how science works? When a theory predicts/explains something previously mysterious—even if known—it gains credibility. Mercury’s drift was a live epistemic *problem*. GR *solved* it. Solving problems *is* confirmation. Ignoring this because E was "old" would mean anomalies could *never* confirm new theories—which is absurd. Imagine if Mendeleev’s periodic table "couldn’t confirm" novel elements because gaps were "old evidence."

  **Alex:** But confirmation requires *risk*. GR was *built* to fit Mercury’s data—it faced no risk of falsification by E. Real confirmation happens when a theory predicts *novel* evidence—like GR predicting light bending in 1919. *That* was a true test. Mercury was just a consistency check.

  **River:** Consistency checks *are* tests! GR could have *failed* to explain Mercury. Einstein famously said if Mercury didn’t fit, "General Relativity would be dead." The risk wasn’t observational—it was *explanatory*. And Bayesianism *can* model this: conditionalize on **B \ {E}**—background knowledge *minus* E. Before deducing H → E, E *is* uncertain relative to this stripped-down B. Then learning E *does* boost H.

  **Alex:** **B \ {E}** is artificial. We can’t "forget" E to do probability assignments. We *know* E. This is why Glymour and others call it "the paradox of old evidence"—Bayesianism struggles with historical contingency.

  **River:** Then maybe strict subjective Bayesianism is too narrow! If a theory explains a stubborn anomaly better than rivals, that *should* count. Otherwise, we’re saying Einstein’s explanation of Mercury was merely "neat," not "confirmatory." That doesn’t match scientific practice.

  **Alex:** Practice vs. formalism. Scientists say "confirms," but philosophers need precision. Explaining old evidence *corroborates* a theory—it shows coherence or fertility. But "confirmation" in Bayesian terms should be reserved for *probability-raising updates from new data*.

  **River:** So you’d say Mercury’s drift *corroborated* GR but didn’t *confirm* it?

  **Alex:** Exactly. It increased GR’s *plausibility*, but not its *probability*.

  **River:** Then maybe we need a richer Bayesian model—one where "solving an anomaly" *is* a probability-raising event. Otherwise, we render most historical support for theories irrational.

  ---

  ### Key Issues Surfaced:
  1. **Probability vs. Explanation**:  
     - Alex: Bayesian confirmation is defined by *probability dynamics*. Old evidence can’t change probabilities.  
     - River: Confirmation includes *explanatory power*—resolving anomalies *should* boost credibility, even if formal probabilities don’t shift.  

  2. **What is "New Evidence"?**  
     - Alex: Only *empirical novelty* counts (e.g., light bending in 1919).  
     - River: The *realization* that H explains E is new information ("D"), or the *contrastive success* vs. rivals.  

  3. **The Role of Background Knowledge**:  
     - Both agree that E’s status as an *unsolved problem* matters. But Alex says this is psychological; River says it’s epistemological.  

  4. **Bayesianism’s Limits**:  
     - The debate reveals a tension: Can Bayesianism fully capture scientific reasoning about old evidence? Or must it be augmented (e.g., with "explanatory boosts")?  

  **Where do you lean?** Does River’s move to **D** ("H entails E") salvage Bayesianism? Or does Alex’s strict focus on probability dynamics feel more honest?
