prompt: |-
  I'm a causal inference statistician — I spend my days with DAGs, potential outcomes, do-calculus, and arguing about which variables count as "background" versus "treatment" — and I just got into a really long argument with a philosopher friend about the doing/allowing distinction. She thinks there's a genuine moral difference between killing someone and letting them die, and I kept trying to say "but isn't that just a difference in the causal structure, like which node you intervene on?" and we went in circles for like a hour and a half. I cant get it to line up in my head.

  So can you restate the doing/allowing debate in the vocabulary I actually work in: counterfactuals and potential outcomes (would the person have died had I not intervened?), causal diagrams and the choice of which variables go into the model versus which get absorbed into the baseline, do-interventions versus not-doing, proximate versus remote causes, and the reference class you pick? I'd like you to go through the main positions — the view that the distinction is real and just tracks causation, the view that it's an illusion, the cases where acting and not-acting both seem to be within your control so "agency" doesn't do the work, and the Doctrine of Double Effect cases where the harm is a foreseen side effect rather than the means — and tell me how each one maps onto my terms.

  Then the part I actually care about: the residue report. Which claims translate cleanly, which only translate if you distort them, and which have no expression in my vocabulary at all? I have a hunch the doing/allowing distinction doesn't track pure counterfactual dependence but instead tracks the choice of causal model — which variables you treat as the background versus the intervention — and that this choice is underdetermined by the data, which is exactly the kind of thing I'm used to complaining about. Is that hunch right, or am I smuggling in an assumption from my field and calling it translation? And if there's a residue, is it a defect of my causal-inference vocabulary, or does it show the philosophers' disagreement is less clean than it looks?
reasoning: |-
  Okay, the user is a causal inference statistician who had a long debate with a philosopher friend about the moral distinction between killing (doing) and letting die (allowing). They want this philosophical debate translated into their domain's vocabulary: DAGs, potential outcomes, do-calculus, etc. They also want a residue report on what aspects of the debate don't cleanly map onto their framework.

  First, I need to break down the doing/allowing distinction in causal inference terms. The core idea is whether intervening (doing) versus not intervening (allowing) has a moral difference. In causal terms, this relates to counterfactuals and interventions. For example, killing someone would involve an active intervention (do(X=1)), while letting die might be not intervening (no do-operation), so the death happens under the natural course.

  The user mentioned several positions: the view that the distinction is real and tracks causation, the view that it's an illusion, cases where both acting and not-acting are within control, and Doctrine of Double Effect cases. Each needs mapping to causal concepts.

  For the distinction being real: This might map to the asymmetry in interventions. An active intervention (do) changes the system, while not intervening leaves it as is. The counterfactual difference: in killing, the person wouldn't have died but for your action; in letting die, they would have died anyway. So, the probability P(Y=1 | do(X=1)) vs. P(Y=1 | no intervention). But this depends on the causal model setup.

  The illusion view: Here, the moral difference might be reduced to other factors like intent or baseline probabilities. If the counterfactual outcome is the same (person dies either way), but the causal pathway differs, some argue the moral distinction is illusory. In causal terms, if the effect is identical, the path might not matter morally, but philosophers might disagree.

  Cases with symmetric control: If both acting and not-acting are choices, like diverting a trolley or not, then the counterfactuals might show similar outcomes, but the intervention's nature differs. Using do-calculus, both involve interventions (do(divert) vs. do(not divert)), but the model's background variables might affect permissibility.

  Doctrine of Double Effect (DDE): This deals with intended vs. foreseen side effects. For example, in a DAG, if the treatment node directly causes harm as a means versus indirectly as a side effect. The causal path (direct effect vs. indirect) and which nodes are targeted matter. DDE might require analyzing path-specific effects or decomposing effects.

  The residue report is crucial. The user suspects that the distinction hinges on how the causal model is specified—what's considered background vs. intervention. This choice might be underdetermined, leading to disagreements. For example, whether not acting is part of the baseline or an omission that could be intervened on. Philosophers might have normative commitments influencing model choice, which isn't dictated by data alone.

  Residues could include moral concepts like agency, intent, and normativity. Intent isn't captured in DAGs; it's an additional layer. Normative claims about permissibility based on model structure aren't derivable from the model itself. Also, the granularity of variables (e.g., including "intent" nodes) might be necessary but isn't always straightforward.

  The user's hunch seems valid. The moral distinction often depends on model specification, which is underdetermined and value-laden. However, some philosophical disagreements might stem from different model choices, revealing underlying normative biases rather than factual disputes.
answer: |-
  Here's the doing/allowing distinction translated into causal inference vocabulary, complete with residue analysis. Your hunch about model specification being central is astute and largely correct.

  **Core Translation: The Distinction as Model Specification**
  - **"Doing" (Killing)**: An active *intervention* (`do(X = 1)`) that *changes* the natural causal path. Represents adding a new cause or altering an existing one.
    - *Example*: Injecting poison (`do(Inject_Poison = 1)`). Potential outcome: `Y(death) | do(Inject_Poison=1) = 1` but `Y(death) | do(Inject_Poison=0) = 0` (they live if you don't act).
  - **"Allowing" (Letting Die)**: *No intervention* (`no do-operation`), allowing background processes to unfold. Represents *not* altering the natural causal path.
    - *Example*: Withholding antidote (`no do(Administer_Antidote)`). Potential outcome: `Y(death) | do(Administer_Antidote=0) = 1` and `Y(death) | do(Administer_Antidote=1) = 0` (they die if you don't act, live if you do).

  **Key Philosophical Positions in Causal Terms:**

  1. **The Distinction is Real & Tracks Causation**:  
     - *Translation*: Moral weight depends on *whether you altered the default state*.  
     - *Causal Structure*:  
       - **Doing**: `P(Y=1 | do(X=1)) >> P(Y=1 | do(X=0))` (Your action *increased* probability of harm).  
       - **Allowing**: `P(Y=1 | no intervention) = P(Y=1 | do(X=0))` (No change from baseline risk).  
     - *Model Choice*: Baseline risk is fixed by the DAG's structural equations. "Allowing" is defined relative to this baseline.

  2. **The Distinction is an Illusion**:  
     - *Translation*: Only *outcomes* matter, not causal pathways. Moral weight depends on `Y` (death) occurring, regardless of `X` (your choice).  
     - *Causal Structure*: Uses identical potential outcomes:  
       - `Y | do(X=kill) = 1` and `Y | do(X=not_save) = 1`.  
     - *Counterargument*: This ignores *causal responsibility* (`ATE` of your action) and *counterfactual differences*.

  3. **Symmetric Control Cases (e.g., Trolley Problem)**:  
     - *Scenario*: Diverting a trolley (doing) vs. not diverting (allowing).  
     - *Translation*: Both choices are *interventions* in a decision-theoretic model:  
       - `do(Divert_Trolley = 1)` → 1 death  
       - `do(Divert_Trolley = 0)` → 5 deaths  
     - *Conflict*: The DAG structure determines whether "not diverting" is the baseline. If the system defaults to *not diverting*, then diverting is "doing harm" (killing 1). Philosophers dispute this default specification.

  4. **Doctrine of Double Effect (DDE)**:  
     - *Scenario*: Harm as foreseen side effect (e.g., collateral damage) vs. direct means.  
     - *Translation*: Distinguishes *direct causal paths* from *indirect paths* in the DAG:  
       - **Intended Means**: Harm lies on the directed path from intervention to primary outcome (e.g., `do(Bomb_Factory) → Factory_Destroyed → Enemy_War_Capacity` but also `do(Bomb_Factory) → Civilian_Deaths`).  
       - **Foreseen Side Effect**: Harm is off-path (e.g., `do(Bomb_Factory) → Factory_Destroyed` and *separately* `Factory_Destroyed → Civilian_Deaths`).  
     - *Key*: DDE relies on *path-specific effects* and whether harm is *mediational* or *collateral*.

  ---

  ### Residue Report: What Translates, What Distorts, What's Missing

  | **Claim**                          | **Translation**                                                                 | **Fidelity**     | **Notes** |
  |------------------------------------|---------------------------------------------------------------------------------|------------------|-----------|
  | **"Doing changes the status quo"** | `P(Y\|do(X)) ≠ P(Y\|no intervention)`                                           | ✅ Clean         | Core of counterfactual dependence. |
  | **"Allowing is passive"**          | `no do-operator` applied; outcome = natural course                             | ⚠️ Distorts      | "Passivity" is model-relative. Omitting `do(X)` is still a choice in decision nodes. |
  | **Moral asymmetry**                | ATE of intervention vs. deviation from baseline risk                           | ⚠️ Partial       | Requires *normative input*: Why is increasing harm worse than not reducing it? |
  | **Intent matters**                 | Not natively in DAGs. Requires adding *intent nodes* (e.g., `Intent → X`).     | ❌ No expression | Intent is latent and non-manipulable. Causal models struggle with mental states. |
  | **"Agency" in omission**           | If `do(X=0)` is a valid intervention, agency exists. Otherwise, it's background. | ⚠️ Distorts      | Entirely depends on *which variables are manipulable* in the model. |
  | **Normative baselines**            | Choice of reference class for "background" variables (e.g., what's "normal")    | ❌ No expression | Socially constructed; not deducible from data. |
  | **Doctrine of Double Effect**      | Path-specific effects (e.g., direct vs. indirect paths)                        | ✅ Clean         | Mediation analysis handles this well. |
  | **"Proximate cause" emphasis**     | Distance in DAG (edges between `X` and `Y`)                                     | ✅ Clean         | Proximate = few edges; remote = many edges. |

  ---

  ### Your Hunch: Valid but Incomplete
  **Yes, your core insight is correct**: The doing/allowing distinction *heavily depends* on how we specify the causal model:
  1. **Choice of Background Variables**: Whether a variable is part of the structural equations (background) or a manipulable intervention changes the moral classification.
  2. **Reference Class Problem**: What counts as the "default" state? E.g., is "not feeding a starving person" the baseline, or is there a duty making it an omission?
  3. **Underdetermination**: Identical physical events can be modeled differently. E.g., *failing to administer antidote* can be:
     - `do(Administer_Antidote = 0)` (an intervention) or 
     - `no do-operation` (background process).

  **Where you might smuggle in assumptions**: 
  - **Manipulability as Default**: Causal inference assumes variables *can* be intervened on. But philosophers question whether "omissions" are genuine causes (e.g., is "not saving" a cause of death, or just the *absence* of a preventer?).
  - **Normative Baselines**: Your field treats baselines as empirical, but philosophers see them as *moral* (e.g., "you have a duty to save, so not acting is an intervention").

  ---

  ### The Residue: What Your Vocabulary Can't Capture
  1. **Intent & Mental States**: DAGs can include `Intent → Action`, but intent is non-manipulable and latent. Philosophers care about *why* you acted/omitted.
  2. **Normative Grounding**: Why is intervening to harm worse than not intervening to help? Causal models describe *what happens*, not *why it's wrong*. This requires ethics.
  3. **The "Omission as Cause" Debate**: Philosophers dispute whether omissions have causal power. In your terms: Is `do(X=0)` a causal intervention or just the absence of `X`? Your framework assumes the former.
  4. **Moral Salience of Defaults**: The choice of baseline (e.g., "normal conditions") is often moral, not empirical. E.g., is "not giving away 90% of your income to save strangers" the baseline, or an omission?

  ---

  ### Conclusion: A Feature, Not a Bug
  The residue isn't a defect of causal inference; it reveals that the philosophers' debate is **underdetermined by causal structure alone**. Your tools expose where disagreements stem from:
  - **Disputes over model specification** (e.g., what counts as background vs. intervention)
  - **Normative commitments** (e.g., how to set baselines)
  - **Conceptual ambiguities** (e.g., whether omissions are causal)

  Your field forces clarity: Once the DAG and interventions are specified, the "doing/allowing" distinction often reduces to differences in `do`-operations and counterfactuals. But the *choice of specification* is where ethics enters—and that’s the philosophers' battleground. You’re not smuggling in assumptions; you’re showing that the debate hinges on underspecified causal models.
