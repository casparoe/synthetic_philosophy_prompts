answer: |-
  ### Condorcet Jury Theorem Classroom Game Design  
  **Goal:** Visually demonstrate the theorem's mechanics and limitations through experiential learning. Students will see how majority accuracy shifts under varying conditions, then debrief to connect gameplay to theoretical premises and real-world overreach.

  ---

  ### **Session Structure (75 min total)**  
  **Phase 1: Independence & Competence >0.5 (20 min)**  
  *Objective: Majority accuracy increases as group grows.*  
  - **Materials**:  
    - 10 binary trivia questions (e.g., "True/False: The Nile is the longest river on Earth").  
    - Google Form for answers (or paper ballots).  
    - Spreadsheet to record responses (projected).  
    - Virtual "Clone Voter" generator (spreadsheet formula: `=IF(RAND()<p, correct_answer, 1-correct_answer)`).  
  - **Rules**:  
    1. Students answer all 10 questions individually (sincere guesses).  
    2. *Secret tuning*: Instructor sets each student’s **p = 0.6** (competence) by:  
       - Recording their actual answer.  
       - Flipping it 40% of the time in the spreadsheet (e.g., if a student answered "True" and RAND() > 0.6, record "False").  
    3. Calculate and display:  
       - Individual accuracy (average % correct).  
       - Majority accuracy for the real class (18 voters).  
    4. **Simulate larger groups**:  
       - Generate "clones" by resampling student responses *with replacement* (maintaining p=0.6).  
       - Plot majority accuracy for n=18, 36, 100, 500, 1000 on a graph (live updates).  
  - **Payoff**: "Wisdom Points" (WP):  
    - +1 WP if your *individual* answer matches the truth.  
    - +1 WP if the *majority* is correct.  
    (Emphasize collaboration; no real prizes.)  

  ---

  **Phase 2: Correlated Errors (15 min)**  
  *Objective: Shared misconception → confident, wrong majority.*  
  - **Materials**:  
    - 3 trick questions with strong cultural misconceptions (e.g., "True/False: Vikings wore horned helmets").  
    - Same spreadsheet setup.  
  - **Rules**:  
    1. Students answer individually.  
    2. *Secret tuning*: **Do not flip answers** (preserve sincere errors). Use questions designed so >90% answer incorrectly.  
    3. Display:  
       - Overwhelming majority for the wrong answer (e.g., 16/18 vote "True" for horned helmets).  
       - Show correct answer (False) → highlight collective error.  
    4. **Simulate larger groups**:  
       - Resample clones *without* changing the misconception (all clones replicate the same error pattern).  
       - Graph majority accuracy: remains wrong even at n=1000.  
  - **Payoff**: Same WP system, but most will lose both points.  

  ---

  **Phase 3: Competence <0.5 (15 min)**  
  *Objective: Majority accuracy *decreases* as group grows.*  
  - **Materials**: Same 10 Phase 1 questions (reshuffled order).  
  - **Rules**:  
    1. Students re-answer the questions (they may recall some answers).  
    2. *Secret tuning*: Set **p = 0.4** by flipping answers **60% of the time** (e.g., if RAND() < 0.6, invert response).  
    3. Calculate/display:  
       - Individual accuracy drops to ~40%.  
       - Majority accuracy for n=18 (likely incorrect).  
    4. **Simulate larger groups**:  
       - Clone resampling (p=0.4).  
       - Graph: Majority accuracy plunges toward 0% as n grows (e.g., 1000 voters).  
  - **Payoff**: Same WP system.  

  ---

  ### **Real-Time Data Display**  
  - **Tool**: Google Sheets (or Excel) with bar graphs:  
    - X-axis: Group size (n).  
    - Y-axis: % majority accuracy.  
    - Overlay all 3 phases on one graph post-game.  
  - **Live updates**: Instructor pastes clone data → graphs auto-update.  

  ---

  ### **Debrief (20 min)**  
  **Map gameplay to theory**:  
  | **Game Moment**               | **Theorem Premise**                          | **Friend’s Overreach**                     |  
  |-------------------------------|---------------------------------------------|--------------------------------------------|  
  | Phase 1: Accuracy ↑ with n    | Competence >0.5 + independence → infallible majority | Assumes premises always hold |  
  | Phase 2: Confident wrongness  | Correlated errors break independence        | Ignores shared biases/misinformation       |  
  | Phase 3: Accuracy ↓ with n    | Competence <0.5 → anti-wisdom of crowds     | Overlooks that "slightly better than chance" is fragile |  

  **Key Takeaways**:  
  1. The theorem is **conditional**: Binary choice, objective truth, independence, competence >0.5.  
  2. **Real-world limits**:  
     - No "objective truth" in politics (values/morals).  
     - Voters aren’t independent (media, peers).  
     - Competence is contextual (e.g., experts vs. novices).  
  3. **Your friend’s claim** ("everything else is noise") ignores how easily premises fail.  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Phase 1 avg. p ≠ 0.6**:  
     - *Fix*: Pre-test questions; adjust flip % secretly to hit 0.6.  
  2. **Phase 2 misconception fails**:  
     - *Fix*: Use foolproof questions (test on colleagues first).  
  3. **Tech hiccups**:  
     - *Fix*: Pre-load spreadsheets with formulas; use paper backups.  
  4. **Students detect tuning**:  
     - *Fix*: Obfuscate with "random checks" (e.g., "I’m spot-auditing for consistency").  

  ---

  ### **Limitations of the Game**  
  **No classroom game can replicate**:  
  - **Genuinely large electorates** (n=1M+ requires infinite clones).  
  - **Sincere voters** (students know it’s a game; real voters have stakes).  
  - **Non-verifiable "truth"** (classroom uses trivia; democracy has contested values).  
  - **Independence** (students share a classroom/culture → implicit correlation).  

  **Bridge the gap**:  
  - **Post-game lecture** notes these limits.  
  - Argue: *"Condorcet describes a math ideal—not a democratic utopia."*  

  ---

  ### **Instructor Script Snippets**  
  - **Intro**: "Today, you’re the jury. Your votes determine truth—but watch for hidden twists."  
  - **Phase 2 reveal**: "You were *all* wrong. Why? Because I tricked you with a shared myth. Independence failed."  
  - **Debrief**: "My mathematician friend sees a perfect machine. You just saw how easily its gears jam."  

  This design ensures students *feel* the theorem’s fragility before dissecting it formally. The game turns abstract premises into visceral lessons, priming them for rigorous analysis.
