  ### Decision Tree Branch Order
  The taxonomy branches on three diagnostic questions in sequence:  
  1. **Modal Bridge**: Is mathematical possibility (being a solution to Einstein's field equations) sufficient for Gödel's argument to have force about time's passage?  
     - **Yes (Sufficient)**: Proceed to Work Done by CTCs.  
     - **No (Required)**: Physical realizability (e.g., negative Λ, rotating dust) is needed; otherwise, the argument collapses to compatibility.  

  2. **Work Done by CTCs**: Do the closed timelike curves (CTCs) in Gödel's universe do genuine work beyond special relativity’s relativity of simultaneity?  
     - **Yes (Genuine work)**: CTCs are essential to the argument. Proceed to Target of the Argument.  
     - **No (Redundant)**: SR already does the work; CTCs are merely illustrative. Proceed to Target of the Argument.  

  3. **Target of the Argument**: Does the argument primarily target:  
     - **Only the A-series** (the passage/flow of time), leaving B-series relations (earlier/later) intact?  
     - **Temporal structure as such** (undermining both A-series and global B-series ordering)?  

  ### Taxonomy Table of Positions  
  | Position                              | Modal bridge         | Work done by the CTCs     | Target of the argument   | Scope of the conclusion                          | Most awkward commitment                                                                 |
  |---------------------------------------|----------------------|----------------------------|--------------------------|-------------------------------------------------|-----------------------------------------------------------------------------------------|
  | Strong Gödelian eternalist            | Sufficient           | Genuine work               | Temporal structure       | Actual universe (time's passage is unreal)      | Denying temporal passage despite our lived experience of change.                        |
  | SR-redundancy reading                 | Sufficient           | Redundant                  | Only A-series            | Actual universe (block universe from SR alone)  | Maintaining that SR's relativity of simultaneity—without CTCs—suffices to kill the A-series. |
  | Physical-possibility skeptic          | Required             | Genuine work               | Temporal structure       | Only Gödel-like universes (conditional)         | Accepting that if Gödel's universe were physical, time would be unreal—but it isn't.    |
  | A-series-only tenseless theorist      | Sufficient           | Genuine work               | Only A-series            | Actual universe (B-series remains)              | Insisting B-series relations survive despite CTCs globally fragmenting temporal order.  |
  | Presentist/growing-block defender     | Required             | Genuine work               | Temporal structure       | Only Gödel-like universes (conditional)         | Conceding time would fail in a Gödel universe but asserting it's real in ours.           |
  | "The argument is a wash"              | Sufficient           | Redundant                  | Temporal structure       | Weaker compatibility claim (no metaphysics forced) | Arguing CTCs are redundant yet still claiming they "illustrate" timelessness without force. |
  | Gödel-as-A-series-only-modal          | Sufficient           | Redundant                  | Only A-series            | Weaker compatibility claim (no metaphysics forced) | Claiming SR alone shows A-series unreality, but Gödel adds nothing—not even emphasis.   |

  ### Notes on Unoccupied Cells and Indistinguishable Positions  
  - **Unoccupied cells** (combinations with no positions):  
    - **M1, C2, T2 (Math sufficient, CTCs redundant, Target: Temporal structure)**: Incoherent. If CTCs are redundant (SR does the work), SR cannot plausibly target temporal structure (global B-series), as SR lacks CTCs and preserves a global partial ordering.  
    - **M2, C1, T1 (Physical required, CTCs genuine work, Target: Only A-series)**: Unattractive. If CTCs do genuine work (disrupting global B-series), targeting only the A-series ignores their direct challenge to temporal relations.  
    - **M2, C2, T1/T2 (Physical required, CTCs redundant, Target: A-series or structure)**: Unexplored. No position requires physical realizability while dismissing CTCs as redundant—why invoke Gödel if SR suffices?  

  - **Indistinguishable leaves**:  
    - The **Physical-possibility skeptic** and **Presentist/growing-block defender** share the same leaf (M2, C1, T2). The tree cannot separate them, as both require physical realizability, grant CTCs genuine work, and see the argument targeting temporal structure. They diverge only in emphasis: the skeptic focuses on Gödel’s physical impossibility, while the presentist stresses the conditional nature of the conclusion.  
    - The **Strong Gödelian eternalist** and **"The argument is a wash"** share a leaf (M1, C1, T2). Both deem math sufficient and CTCs essential for targeting temporal structure, but differ on scope: the eternalist applies it to our universe; the "wash" sees only compatibility.  

  ### Additional Leaf  
  One extra leaf (**Gödel-as-A-series-only-modal**) was added to fill a gap: a position where Gödel’s CTCs are deemed redundant (SR already refutes the A-series) and the argument is a wash (no force), yet the target remains the A-series. This isolates a minimalist "Gödel adds nothing" view.
