prompt: |-
  I chair the standards and appeals committee for a national certificate in "applied reasoning" — it's the short exam a few employers and two professional bodies use as an analytical-skills gate, so our rubric wording matters to people's jobs in a way that a university exam probably doesn't. Last month a candidate appealed a zero on one of our deduction items. The item hands you two premises and asks for the conclusion that follows; the rubric, which we rewrote two years back, awards a mark for "stating the governing principle at each step." The candidate did write the conclusion, but under it wrote that the inference wasn't licensed by anything they'd been given: a rule of inference is not a premise, they said, so write the rule into the item as a third premise and they'll use it, but then we owe them the rule that carries them from those three lines to the conclusion, and so on down the line. They then left the reasoning blank and took the zero. Their appeal argues that the rubric's own letter asked them to state the principle rather than apply it, and I have to admit they're not obviously wrong about that. This is, I know, that Lewis Carroll bit with the tortoise who cheerfully accepts every premise you hand him and every conditional you hand him next, and never gets to the conclusion. Half my committee wants to deny the appeal on the ground that an exam in reasoning which treats that answer as compliant tests nothing — a candidate who describes the rule and declines to be bound by it hasn't shown they can reason, and if we start granting marks for describing inferences we may as well mark essays on our own rubric. The other half wants to grant it, because our item does demand that a candidate endorse a rule we never gave them and never defended, and "we've never had to defend it" is not an argument.

  Draft the written decision I'll circulate before Thursday's meeting: a clear recommendation — deny, grant, or grant in part with a rubric amendment — with the exam cycle by which it takes effect, and reasons the people who wrote the item could actually respond to rather than a restatement of the psychometric handbook. It should take the tortoise's point seriously enough that the memo would survive being read by the candidate, and take the committee's worry seriously enough that it would survive being read by our chief examiner; if you think one side is right, say plainly what the other side has to give up. I'd also like it to say something real about what's underneath this, not just about our paperwork: whether accepting a conditional premise and being bound by a rule of inference are the same sort of thing at all, and if they aren't, whether a stipulated rule — something like "this item is governed by: from 'all A are B' and 'x is an A,' infer 'x is a B'; candidates are deemed to have adopted it" — is a legitimate way to stop the regress or just a politer way of hiding it, and whether a rule can be the kind of thing that's true or false in the first place, or only the kind of thing one does or doesn't go in for. One more bit of detail in case its useful: we piloted a "licence box" on a handful of items last spring (candidates tick that they adopt the item's rule) and it went badly in both directions — the strongest candidates ticked it and then wrote the conditional out as a line anyway, and the weakest ones ticked it and then took steps the licence plainly didn't cover. Make of that what you can. No citations or reading list needed, we're not publishing it and I'd rather you argue than cite. Around 800 words, headed with the committee's name and a one-line recommendation.
reasoning: |-
  Hmm, the user chairs a standards committee for an applied reasoning certificate exam and needs help drafting a decision memo about a candidate's appeal. The candidate got zero on a deduction question where they correctly identified the conclusion but refused to actually draw it, arguing the rubric only required stating the governing principle, not applying it. 

  This is clearly referencing Lewis Carroll's "What the Tortoise Said to Achilles" paradox about infinite regress in logical rules. The committee is split: half think accepting this answer would make the exam meaningless, while half agree the candidate has a point about undefended rules.

  The user wants a memo that:
  - Makes a clear recommendation (deny/grant/partial grant)
  - Specifies implementation timeline
  - Addresses both philosophical concerns (rule adoption vs premise acceptance) and practical realities
  - Survives scrutiny from both the candidate and chief examiner
  - Acknowledges the failed "license box" experiment

  Key considerations:
  The appeal hinges on literal interpretation of "state the principle" vs intended assessment of reasoning ability. While technically correct about the wording, the candidate's approach defeats the exam's purpose. The failed license box shows externalizing rules doesn't work practically. 

  Philosophically, rules of inference aren't premises - they're constitutive of reasoning itself. Treating them as optional turns deduction into opinion. But we can't have infinite premise chains either. 

  Recommendation: Deny the appeal but immediately amend the rubric. This preserves exam integrity while fixing the ambiguity. The "governing principle" language should shift to requiring application, not just description. 

  Implementation should be immediate for new exams, as this is a critical fix. The memo should tactfully explain why rules aren't negotiable while acknowledging the wording flaw. The tortoise paradox reveals a deep truth about reasoning that can't be resolved by exam design - we must pragmatically accept foundational rules to reason at all.
answer: |-
  **Standards and Appeals Committee**  
  **Recommendation: Deny the appeal; amend rubric for clarity effective immediately (October 2024 exam cycle).**  

  ### **Decision Summary**  
  The Committee denies Candidate #X’s appeal of a zero mark on Item 17. While the candidate correctly identifies a tension in our rubric’s wording, their interpretation, if universally applied, would invalidate the assessment’s core purpose: evaluating applied deductive reasoning. We will amend the rubric to explicitly require both *stating* and *applying* the governing principle, effective for all exams from October 2024 onward.  

  ---

  ### **Analysis of the Appeal**  
  1. **The Candidate’s Argument**  
     The candidate asserts that our rubric ("state the governing principle at each step") permits describing a rule of inference without applying it. They argue that since the rule itself was not provided as a premise, its use is optional. This mirrors Lewis Carroll’s tortoise paradox: without explicit endorsement of every inferential rule, deduction cannot begin.  

  2. **The Committee’s Concerns**  
     - **Practical Assessment Validity**: Granting marks for describing but refusing to apply rules would reduce the exam to a commentary exercise. It fails to test whether candidates *can reason*, only whether they *recognize* reasoning.  
     - **Philosophical Legitimacy**: Rules of inference (e.g., *modus ponens*) are not premises awaiting assent; they are the mechanisms that make deduction possible. To demand their explicit defense in every item confuses *tools* with *inputs*.  

  ---

  ### **Why We Deny the Appeal**  
  - **The Rubric’s Intent vs. Literalism**:  
    The phrase "state the governing principle" exists to ensure candidates articulate *why* a step is valid—not to permit abstention from reasoning. The appeal exploits an ambiguity, but the item’s context (an exam titled "applied reasoning") implies application is mandatory. A strictly literal reading ignores the assessment’s purpose.  

  - **The Tortoise Paradox Is Unresolvable in Practice**:  
    Carroll’s tortoise reveals a genuine epistemological problem: rules cannot be infinitely justified. But exams are practical evaluations, not philosophical treatises. We must stipulate baseline rules (e.g., "candidates adopt classical propositional logic") to assess reasoning *at all*. Our pilot "licence box" failed because high performers found it redundant (they internalize rules), while low performers misapplied it (rules are useless without understanding). **Stipulation is not evasion; it is operational necessity.**  

  - **Rules vs. Premises: A Critical Distinction**:  
    Premises (e.g., "All A are B") are contestable statements about the world. Rules of inference (e.g., "From ‘All A are B’ and ‘x is A,’ infer ‘x is B’") are conventions that enable deduction. They are not "true" or "false" but *enabled* or *rejected*. An exam assessing applied reasoning rightly assumes candidates accept standard deductive rules—just as a driving test assumes you will press the accelerator to move.  

  ---

  ### **What the Dissenting Committee Members Must Concede**  
  Those advocating to grant the appeal rightly note: **Our rubric failed to specify that rules must be applied.** The candidate exposed a flaw. However, granting this appeal sets a precedent that could paralyze the exam:  
  - **Risk to Test Integrity**: If candidates may reject foundational rules without penalty, we cannot distinguish between those who *cannot reason* and those who *will not* on principle.  
  - **Psychometric Harm**: The exam measures *reasoning competency*, not meta-logical activism. Valid assessment requires shared procedural ground.  

  ---

  ### **Rubric Amendment: Effective October 2024**  
  To prevent recurrence, we amend the rubric to:  
  > "State *and apply* the governing principle at each step. Rules of inference (e.g., *modus ponens*, universal instantiation) are adopted by default unless otherwise specified."  

  **Implementation Timeline**:  
  - Immediate communication to item writers (August 2024).  
  - Mandatory for all exams from October 2024 onward.  
  - Retraining of markers by September 2024.  

  ---

  ### **The Underlying Lesson**  
  This appeal forces us to confront what reasoning *is*. Deduction requires two commitments:  
  1. **To premises** (accepting given propositions).  
  2. **To rules** (accepting that certain inputs mandate certain outputs).  

  The first is negotiable; the second is non-negotiable in a deduction test. A rule of inference is not a premise to be believed—it is a move to be executed. To treat it otherwise is to mistake the game for its pieces.  

  Our amended rubric makes this explicit, preserving the exam’s fidelity to applied reasoning while honoring the candidate’s valid critique of our language. We deny the appeal not to ignore philosophy, but to fulfill our mandate: certifying that candidates can reason, not just debate its foundations.  

  ---  
  **Chair, Standards and Appeals Committee**  
  *Drafted for circulation: 28 August 2024*
