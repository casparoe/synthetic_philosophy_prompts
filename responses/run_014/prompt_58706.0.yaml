  Okay, the user chairs a volunteer panel for local art grants and needs a practical way to evaluate proposals based on Tolstoy's art theory. They've outlined specific constraints: 30 proposals per cycle, $5k grants, volunteers with limited time and no philosophy background, and council-friendly plain language. 

  Hmm, Tolstoy's core idea simplifies art to emotion transmission - not beauty, skill or entertainment. That's actually perfect for their setup because it avoids technical analysis. But I need to operationalize "sincerity," "distinct feeling," and "clarity" into concrete steps volunteers can handle in 20 minutes. 

  *Brainstorming steps*... First test should be "Emotion Present?" - scanning for any named/implied feeling. Reject if absent. Second, "Sincerity Check" - gut-level authenticity assessment. Third, "Distinct Feeling?" - is this generic or specific? Fourth, "Clarity Assessment" - can non-experts grasp it? Fifth, "Infectiousness Estimate" - will it spread? Sixth, "Feeling Quality" - universal or narrow? 

  For the trials... Proposal A (choir about grief) should pass despite amateurism because raw emotion transmits. B (light show) fails - awe isn't sustained emotion transmission. C (melodrama) will annoy the panel but must pass under Tolstoy's rules if genuinely moving ordinary people. That's the disliked outcome they need to accept. 

  *Pausing*... The real challenge is Step 5's infectiousness projection. Volunteers will hate judging hypothetical audience impact. Must flag this as "panel judgment required" since no procedure can predict reception. Also, Tolstoy's moral bias against "lowbrow" art might misfire for avant-garde work. Should note these limits clearly. 

  *Refining*... Will keep explanations in each step super practical: "If you can't summarize the emotion in one sentence, reject." For Quality Gate, emphasize "Would diverse neighbors find meaning?" since council cares about community impact. 

  *Final check*... Yes, this distills Tolstoy into six binary checks with off-ramps. The C trial proves it overrides elitism - exactly what Tolstoy wanted. Council will appreciate the universal feeling emphasis.
answer: |-
  ### Core Idea in Plain Terms (95 words)
  Tolstoy says real art isn’t about prettiness, flashy skills, or fun distractions. It’s about an artist **genuinely feeling something**, crafting a work that **transmits that exact feeling** to an audience. Better art makes the feeling more "infectious." Three things boost infectiousness: 1) The artist’s **deep sincerity**, 2) The feeling being **unique and specific** (not vague), and 3) **Clear expression** anyone can grasp. Art transmitting broad, positive human feelings (love, grief, justice) is "better" than art pushing narrow, exclusive, or just shocking feelings. Our checklist tests if a proposal aims for this sincere emotion-sharing.

  ### Step-by-Step Procedure (245 words)
  **Review Steps:** *(Stop at any "NO" – no funding. Flagged steps need panel judgment.)*

  1.  **Emotion Present?** *Does the description name or imply a specific core feeling (e.g., grief, defiance, communal joy), not just a theme (e.g., "factory closure")?*
      *   PASS: Clear feeling identified (e.g., "profound grief," "righteous anger").
      *   NO: Only describes theme, technique, entertainment value, or beauty. *Stop.*
      *   FLAG: Feeling is vague or implied. *Panel judges if core emotion exists.*

  2.  **Sincerity Check (Flagged - Panel Judgment):** *Does the artist's statement or project description convey authentic personal connection to the feeling? Does it avoid cliché or pandering?*
      *   PASS: Statement feels genuine, avoids obvious tropes, shows personal stake.
      *   NO: Feels cynical, derivative, exploitative, or purely commercial. *Stop.*
      *   *Panel decides based on proposal text/artist bio.*

  3.  **Distinct Feeling?** *Is the feeling specific and individual (e.g., "the complex grief of losing a community anchor") rather than generic (e.g., just "sadness")?*
      *   PASS: Feeling has unique character or context described.
      *   NO: Feeling is completely generic, superficial, or undefined. *Stop.*
      *   FLAG: Specificity is mild. *Panel judges if distinct enough.*

  4.  **Clarity Assessment:** *Can a non-expert grasp *how* the proposed artwork (medium, form, description) expresses the feeling? Is the connection understandable?*
      *   PASS: Proposal clearly links form & feeling (e.g., "slow, dissonant harmonies evoke disorientation").
      *   NO: Connection is obscure, relies on jargon, or isn't explained. *Stop.*
      *   FLAG: Connection is plausible but not explicit. *Panel judges clarity potential.*

  5.  **Infectiousness Estimate (Flagged - Panel Judgment):** *Based on the medium, description, and artist's intent, is it LIKELY the project can successfully transmit its core feeling to an ordinary local audience?*
      *   PASS: Proposal suggests strong potential for emotional resonance.
      *   NO: Project seems purely intellectual, decorative, or technically focused without emotional accessibility. *Stop.*
      *   *Panel predicts likelihood based on experience/description.*

  6.  **Quality Gate - Scope of Feeling:** *Is the core feeling broadly human/moral (e.g., grief, compassion, dignity, awe of nature) rather than narrow/exclusive/titillating (e.g., hatred of a group, gratuitous shock, purely personal indulgence)?*
      *   PASS: Feeling is universal or promotes shared humanity/moral good.
      *   NO: Feeling is fundamentally divisive, degrading, or purely sensational. *Stop.* (Council alignment likely poor).

  ### Three Trial Applications (295 words)

  *   **Proposal A (Amateur Choir - Grief after Factory Closure):**
      *   Step 1: PASS ("Profound grief & dislocation" named).
      *   Step 2: FLAG → *Panel: Raw artist statement shows deep community ties & loss. PASS.*
      *   Step 3: PASS (Specific grief tied to economic/cultural loss).
      *   Step 4: PASS (Simple harmonies, community voices = clear link).
      *   Step 5: FLAG → *Panel: Non-musicians moved in draft = strong infectiousness potential. PASS.*
      *   Step 6: PASS (Universal grief, human dignity).
      *   **OUTCOME: FUND.** (Clumsiness irrelevant per Tolstoy - emotion transmits).

  *   **Proposal B (Dazzling Light Show - Momentary Awe):**
      *   Step 1: PASS ("Awe" named).
      *   Step 2: NO → Statement focuses on technical innovation & "market-tested" effects. Lacks sincerity/personal feeling. *STOP.*
      *   **OUTCOME: NO FUND.** (Skill/beauty/entertainment present, but lacks sincere emotion transmission. Feeling isn't sustained or distinct).

  *   **Proposal C (Sentimental Melodrama - Forgiveness):**
      *   Step 1: PASS ("Forgiveness after betrayal" named).
      *   Step 2: FLAG → *Panel: Despite "lowbrow" style, artist statement shows sincere belief in message. PASS.*
      *   Step 3: PASS (Specific context: familial betrayal & reconciliation).
      *   Step 4: PASS (Melodrama conventions clearly signal emotion).
      *   Step 5: FLAG → *Panel: Evidence it moves ordinary audiences deeply = HIGH infectiousness. PASS.*
      *   Step 6: PASS (Broad moral feeling of forgiveness).
      *   **OUTCOME: FUND (The disliked outcome).** *Why?* Tolstoy prioritizes sincere, infectious transmission of a universal feeling over sophistication or critical acclaim. The panel might dismiss it as lowbrow, but the procedure requires funding based on successful emotion transmission ("deeply moving") achieved through sincerity, distinct feeling, and clarity.

  ### Limits and Required Judgments (140 words)
  **What it CAN'T do:**
  *   Judge technical skill, innovation, or aesthetic beauty (irrelevant to Tolstoy).
  *   Guarantee audience reception (Step 5 is an estimate).
  *   Resolve debates about "universal" feelings (Step 6 edges into moral philosophy).
  *   Perfectly predict sincerity (Step 2 relies on textual clues).
  *   Value avant-garde art challenging emotion norms.

  **Where Judgment is REQUIRED (Flags):**
  *   **Step 2 (Sincerity):** Interpreting artist intent/motivation from proposal.
  *   **Step 3 (Distinctness):** Deciding if feeling is specific enough.
  *   **Step 4 (Clarity Potential):** Assessing if the described method *can* be clear.
  *   **Step 5 (Infectiousness):** Predicting emotional impact – the core philosophical leap. Panel must use local knowledge & proposal strength.
  *   **Step 6 (Scope):** Borderline cases on "universal" vs. "narrow" feelings.
