prompt: |-
  I'm writing a short paper on the metaphysics and normativity of promising, and I'd appreciate critical comments on the draft below — both on the soundness of the argument and on whether the central proposal is doing any real work.

  The paper defends a view I call the "transferred authority" account of promissory obligation, against the two views I take to be the main competitors.

  Draft:

  It is a commonplace that promises bind, but remarkably hard to say what a promise does such that it binds. I consider two familiar accounts and find both wanting. The first, which I call the practice view, holds that promising is a conventional practice, like chess, and that the wrong of breaking a promise is the wrong of breaking the rules of the practice — just as it would be wrong to move a rook diagonally even if nobody is harmed. This correctly explains why a promise binds even when the promisee neither relies on it nor even remembers it. But it faces a difficulty: it seems to get the explanation backwards. The rules of a game bind only those who have chosen to play, and it is implausible that each individual promise is a fresh decision to enter the practice. If the practice view says we are all already players, it owes an account of how we got in the game — and no plausible account of that avoids circularity, since the natural story is that joining a practice is itself something like a promise.

  The second, the reliance view, holds that a promise generates an obligation by inducing an expectation in the promisee, thereby exposing the promisee to a risk the promisor has a duty not to exploit. This nicely explains why promises bind proportionally to the reliance they induce, but it cannot explain the bindingness of promises made to people who cannot rely on them: promises to small children, to the severely forgetful, or to the dead. Yet these seem to be paradigm promises, not degenerate cases.

  I propose instead that a promise is a transfer of authority. In promising to φ, the promisor grants the promisee a standing to determine that the promisor φ — a private, localized version of the authority a principal grants an agent. The obligation is not owed to a practice, nor generated by the promisee's psychological states, but is simply the mirror image of a normative power the promisee now holds. The promise is like handing someone keys: in ordinary speech you hand over the keys to your house, in promising you hand over the keys to a piece of your own will.

  This account predicts, correctly I think, that promises made under duress do not bind: coerced transfers of authority, like coerced transfers of property, are defective transfers. It also explains why third parties can feel the existence of an obligation even when the promisee has forgotten: an unexercised right is still a right.

  Comments requested on the following, though please raise anything else you notice:

  1. The dead-promisee case is meant to be an objection to reliance views, but does my own account handle it? A dead person seems unable to hold any standing, yet I claim the promise still binds. Is this an embarrassment for my view, or can the appeal to "unexercised rights" be made to work?
  2. Does the keys analogy carry any argumentative weight, or is it merely decorative?
  3. Is my characterization of the two competitor views fair, or am I attacking weakened versions of them?
reasoning: |-
  Okay, the user is working on a philosophy paper about promissory obligations and wants critical feedback on their draft. They're proposing a "transferred authority" account against two competing views: practice-based and reliance-based theories. 

  First, I need to understand their core argument. They reject practice views because they seem circular (how did we "join" the practice?), and reliance views because they can't handle promises to entities that can't rely (children, forgetful people, the dead). Their solution is that promising transfers normative authority to the promisee, like handing someone keys to your will. 

  Hmm, the dead-promisee objection is tricky. If authority transfers require a recipient capable of holding it, dead people pose a problem. The user tries to salvage it with "unexercised rights," but that feels shaky—rights typically imply a bearer. Maybe they could argue the obligation persists as a constraint on the promisor even if the promisee can't enforce it? 

  The keys analogy is elegant but needs grounding. It's vivid for explaining normative powers, but doesn't inherently prove anything. They should explicitly link it to how real-world authority transfers work (e.g., property or agency law) to show it's not just a metaphor. 

  On competitor views: Their practice critique is fair—the "how did we join?" problem is classic (Rawlsians might disagree though). For reliance, they're right that promises to non-reliant entities are problematic, but should acknowledge sophisticated reliance theories that distinguish invitation-to-rely from actual reliance. 

  ...Wait, is their account actually doing work? It handles duress well (coerced transfers fail), and explains third-party awareness (rights exist independently of exercise). But they need to show how it improves on rivals without just matching intuitions. Maybe stress that authority transfer explains *why* promissory obligations feel distinct from reliance harms? 

  The user seems philosophically sophisticated—they use precise terms like "normative power" correctly. Their tone is confident but open to critique. I suspect they're grad-student level. The dead-promisee worry suggests they're rigorously stress-testing their own view, which is good. 

  Biggest gap: They don't address how authority transfer happens non-verbally. If I say "I'll be there at 5" casually, is that a promise? Practice views handle implicature better. Also, their account might overgenerate—could any authority transfer create promissory obligation? 

  Actionable tweaks: (1) Tighten the dead-promisee response by distinguishing right-holders from enforcers. (2) Use the keys analogy to scaffold a positive argument about normative powers. (3) Cite specific practice/reliance theorists to show charity. (4) Preempt an obvious counter: Can you transfer authority unintentionally?
answer: |-
  Here's a critical engagement with your draft, addressing your specific questions while also evaluating the argument's soundness and the work your central proposal is doing:

  **Overall Assessment:** Your draft presents a clear, concise, and engaging argument. The core proposal ("transferred authority") is intriguing and offers distinct advantages over the competitors you identify. However, the argument needs strengthening in several areas, particularly regarding the dead-promisee case and the foundation of the authority transfer. The proposal *is* doing real work, especially in explaining duress and third-party awareness, but its core mechanics require more justification.

  **Detailed Comments:**

  1.  **The Dead-Promisee Case & Unexercised Rights:**
      *   **The Embarrassment:** This is a **serious challenge** for your view. Your account hinges on granting the *promisee* a standing/authority/normative power. A dead person, by all standard philosophical and legal accounts, cannot *hold* rights, authority, or normative powers. They cease to be agents capable of being the subject of such normative relations. Saying the promisee "has" an unexercised right after death seems incoherent – there is no longer a "have-er."
      *   **Can "Unexercised Rights" Work?** Not easily. Appealing to unexercised rights works well for *living* promisees who have simply forgotten or chosen not to enforce. The right *belongs to them*. For the dead, there is no subject to whom the right belongs.
      *   **Possible Defenses for Your View (Requiring Development):**
          *   **Survival of Obligation, Not Right:** Argue that the *transfer event* creates a persisting *obligation* on the promisor *towards the memory or the wishes of the deceased*, or perhaps towards the *estate/beneficiaries* as representatives of the promisee's interests, rather than an active *right* held by a non-existent entity. This moves slightly away from the pure "mirror image of normative power" and towards a duty grounded in the past act of transfer respecting the promisee's *past* will/interests.
          *   **Normative Powers Survive Death (Controversial):** Assert that normative powers/rights created *inter vivos* can survive the death of the holder, potentially vesting in heirs or executors (analogous to property rights). This requires arguing that promissory authority *is* a transferable normative property right. This is a significant metaphysical commitment needing justification. Is promissory authority really analogous to a bequeathable asset?
          *   **The Obligation is to the Past Person:** Frame the obligation as owed *to the promisee as they existed at the time of the promise*. While the *current* promisee cannot exercise the right, the promisor still wrongs *that past person* by not fulfilling the commitment made *to them*. This relies on a robust metaphysics of persisting obligations to past individuals.
      *   **Conclusion on Point 1:** Your current appeal to "unexercised rights" **does not adequately handle the dead-promisee case** and risks being an embarrassment. You need to significantly refine or expand your account to address this. The most plausible route within your framework might be the "obligation to the past person/estate" line, but it needs explicit development.

  2.  **The Keys Analogy:**
      *   **Current Status:** It's currently more **decorative and illustrative** than argumentative. It vividly conveys the *idea* of transferring control, which is excellent for exposition.
      *   **Potential Argumentative Weight (To Be Leveraged):** The analogy *can* carry weight if you develop its implications:
          *   **Irrevocability?** Handing over physical keys usually means you *can't* easily take them back without consent. Does this imply promissory authority is irrevocable? (A strong claim).
          *   **Exclusivity?** Keys imply exclusive control. Does the promisee have exclusive standing to demand/release?
          *   **Transfer Mechanism?** How does the *speech act* "I promise" effectuate this transfer? The analogy glosses over the crucial mechanism (which is a challenge for your view).
          *   **Scope of Control?** Keys grant control over a specific thing (house/car). Does promissory authority grant control *only* over the specific act φ, or more broadly?
          *   **Contrast with Competitors:** The analogy *highlights the difference* from reliance (it's about control, not harm prevention) and practice (it's a direct interpersonal transfer, not participation in a convention). This implicit contrast is argumentatively useful.
      *   **Conclusion on Point 2:** The analogy is powerful **if you explicitly draw out the normative conclusions** you believe follow from it (like the points above) and use it to *contrast* with competitors. As it stands, it's illustrative but not yet carrying independent argumentative weight. Make it work harder.

  3.  **Fairness to Competitor Views:**
      *   **Practice View:**
          *   **Fair:** Your characterization captures the core "constitutive rules" idea (e.g., Rawls, Searle-influenced views). The "how did we get in the game?" objection (the problem of "tacit consent" or inherent participation) is a **standard and powerful critique** of simple practice views. You are attacking a central, not weakened, version.
          *   **Possible Sophistication:** You could briefly acknowledge that some practice theorists (e.g., sophisticated Wittgensteinians or certain rule-consequentialists) might try to ground the practice's normativity in broader social necessities or goods, potentially avoiding the circularity charge. But your critique remains valid against the basic "rules of the game" model.
      *   **Reliance View:**
          *   **Mostly Fair:** You accurately portray the core reliance-based mechanism (inducing expectation + duty not to harm via disappointment). Identifying promises to the non-reliant (children, forgetful, dead) as problematic is a **classic objection** (Scanlon's challenge 4.1 in *What We Owe* is precisely this).
          *   **Potential Sophistication:** Some reliance theorists (Scanlon himself being the prime example) offer more nuanced accounts. Scanlon's Principle F (Fidelity) grounds the obligation in the *invitation* to rely and the *value of assurance*, not necessarily *actual* reliance. He argues this *can* cover cases like promises to the dead (the promise invited reliance at the time it was made, creating an obligation based on the value of being able to give assurance). You should **acknowledge and engage** with this more sophisticated reliance view (or "assurance view"). Dismissing reliance views based *only* on the lack of actual reliance might be attacking a straw man if you don't address the assurance/invitation refinement. Your child/forgetful cases still challenge the pure *harm* aspect, but the sophisticated view shifts the ground.

  **Additional Critical Comments & Suggestions:**

  *   **What *Grounds* the Authority Transfer?** This is the biggest gap. *How* does saying "I promise" effect a normative transfer? What is the metaphysical mechanism? Is it a social convention after all (which risks collapsing back into a practice view)? Is it a basic moral power? You need to say more about *why* we have this power to transfer authority over our will and *why* others can receive it. This is crucial for the view's soundness and independence.
  *   **Scope of the Transferred Authority:** How much control does the promisee get? Can they demand performance arbitrarily? Waive the obligation arbitrarily? Does it include demanding specific performance only, or also compensation? The keys analogy suggests strong control, but this needs careful delineation.
  *   **The "Mirror Image" Claim:** This needs unpacking. Is the promisor's obligation *solely* defined by the promisee's power? What if the promisee unreasonably demands performance? Does the promisor retain *any* independent moral standing regarding φ?
  *   **Advantages Beyond Competitors:** You mention duress and third-party awareness. These are genuine strengths. **Highlight them more:** Your view explains duress naturally (defective consent vitiates transfer) and explains why third parties (or the promisor) recognize an obligation even if the promisee forgets (the normative power/right persists unexercised). This *is* real explanatory work your view does uniquely well.
  *   **Metaphysical Commitment:** Be explicit that your view requires a robust metaphysics of normative powers – the ability to alter moral relations via performative acts. This is a significant commitment.
  *   **Clarity on "Binding":** Ensure it's clear *how* the obligation "binds." Is it a moral duty? A directed duty? What kind of wrong is committed? (Wronging the promisee vs. just doing wrong).

  **Recommendations for Revision:**

  1.  **Refine the Dead-Promisee Response:** Choose a strategy (e.g., obligation to the past person/estate) and develop it explicitly. Acknowledge the difficulty.
  2.  **Leverage the Keys Analogy:** Draw explicit normative conclusions from it (scope, exclusivity, irrevocability?) to strengthen the argument.
  3.  **Engage with Sophisticated Reliance:** Acknowledge Scanlon-style "assurance" views and argue why your account is still superior (e.g., it explains the *directedness* of the obligation to the promisee more fundamentally than assurance, or handles cases where assurance wasn't truly sought/accepted).
  4.  **Explain the Mechanism:** Provide at least a sketch of *how* the speech act transfers authority. Is it a basic power? Convention-based? Grounded in autonomy?
  5.  **Clarify Scope & Limits:** Define the extent of the promisee's normative power and any limits on it.
  6.  **Emphasize Unique Explanatory Power:** Stress how your view handles duress, forgotten promises, and third-party recognition better than competitors.

  Your core proposal is promising (no pun intended!) and addresses genuine weaknesses in the standard views. With refinement, especially on the metaphysics of the transfer and the dead-promisee case, it can be a compelling contribution. Good luck!
