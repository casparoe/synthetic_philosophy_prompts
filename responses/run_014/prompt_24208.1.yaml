prompt: |-
  I'm a science-and-ideas journalist, and on the side I run a small monthly seminar — roughly sixteen people, a mix of graduate students and curious non-specialists, ninety minutes in a rented room — where we work through one big idea at a time. I've been covering a lot of recent work on animal cognition and sentience for a feature, and it keeps pushing me back to the moral question underneath it, so this month's theme is the moral status of non-human animals. I want to open the session with a hands-on exercise rather than a lecture, because I've found that the argument I keep coming back to — the one usually called the argument from marginal cases, the engine behind the objection known as speciesism — lands far harder when people generate the inconsistency in their own judgments than when I explain it to them.

  Could you design that exercise for me? I'm imagining a staged, forced-choice task in which participants make concrete protection or priority judgments about a set of beings, where the beings are presented in a way that initially hides which are human and which aren't, and where the structure is set up so that people run into the tension themselves — the point at which the boundary they're actually drawing tracks cognitive capacity rather than species membership — before anyone in the room names the argument. Please specify the exact task and its rules; the case material, i.e., the capacity profiles of the beings they'll judge, including a few that are deliberately marginal humans, a few that are complex non-humans, and a couple of unambiguous anchors; a commitment device that locks in each person's judgments before the reveal so they can't simply revise once they know which beings are human; a minute-by-minute plan for the ninety minutes; and a debrief that maps the specific moments in the room onto the parts of the argument and walks through, step by step, where the argument could be resisted and what it costs to resist it at each point.

  Two things I care about. First, be honest about what will predictably go wrong the first time this is run — where people will guess which cases are human, where they'll get stuck or start debating individual cases instead of the structure, where the discomfort will show up — and how to handle each of these in the moment. Second, be frank about which feature of the argument the exercise simply cannot reproduce and I'll have to supply myself in the debrief, so I don't overclaim what the activity actually did.
reasoning: |-
  Okay, the user is a science journalist running a seminar on animal cognition and sentience. They want an exercise to highlight the moral inconsistency in speciesism using the argument from marginal cases. Let me unpack their request.

  First, the core need is a hands-on activity where participants confront their own judgments before realizing they're applying cognitive capacity over species. The exercise must be structured to hide which beings are human, forcing choices that later reveal contradictions. The user mentioned marginal humans and complex non-humans, so the case profiles need careful balance to avoid obvious tells.

  They also want a commitment device to lock in judgments pre-reveal. This is crucial to prevent revisionism. Using coded cards and private worksheets seems solid. But I should ensure the codes are non-suggestive. Maybe alphanumeric codes without any patterns that hint at species.

  The debrief needs to map the exercise to the argument's steps. Participants might resist at different points—denying cognitive equivalence, rejecting moral relevance, or embracing hierarchy. I should outline these resistance points clearly for the user. 

  Predictable pitfalls: participants guessing species based on profiles. Mitigation involves using ambiguous cases and distracting details. Also, debate over individual cases might derail the structure. The facilitator must steer focus to the pattern of choices, not specific beings.

  What the exercise can't do: simulate real-world emotional biases favoring humans. The user must address this in debrief, explaining how the exercise strips context, making cognitive criteria more salient than in life.

  Timing-wise, 90 minutes is tight. Allotting 15 minutes for judgment, 10 for reveal, and the rest for debrief. The debrief should start with participant reactions, then dissect the contradiction, introduce speciesism, and explore resistances. 

  The user’s deeper need: making the abstract moral argument tangible. They’ve seen that explaining the logic isn’t as effective as letting people experience the inconsistency. The exercise must create that "aha" moment organically. 

  Practical tweaks: pilot the case profiles to ensure ambiguity. Also, prepare for emotional discomfort during reveal—acknowledging it without judgment. The user’s role is to guide reflection, not preach. 

  Finally, emphasizing that the exercise simplifies by removing relational biases. The debrief should connect this back to real-world speciesism, where cultural and emotional factors complicate pure cognitive assessments. This honesty prevents overclaiming the activity’s impact.
answer: |-
  Here’s a designed exercise with your specifications, optimized for maximum cognitive dissonance and pedagogical clarity. It anticipates pitfalls and explicitly notes the argument’s limitations within the exercise.

  ---

  ### **Exercise Title:** "The Priority Protocol"  
  **Objective:** Reveal inconsistency in moral judgments based on species vs. cognitive capacity.  
  **Time:** 90 minutes  
  **Participants:** 16 people  

  ---

  ### **Core Structure**  
  **Task:** Participants must prioritize 10 beings for a *single* seat on a hypothetical lifeboat during an evacuation (symbolizing scarce resource allocation). They rank beings 1 (highest priority) to 10 (lowest).  

  **Rules:**  
  1. Each being is described by a **neutral cognitive/behavioral profile** (e.g., "Can solve novel puzzles using tools," not "chimpanzee").  
  2. Profiles use **coded identifiers** (e.g., Entity-A7).  
  3. **No discussion** during ranking. Judgments are private until the reveal.  
  4. **Commitment device:** Rankings are recorded on numbered worksheets *before* identifiers are decoded.  

  ---

  ### **Case Material (10 Beings)**  
  *Design Principle: Profiles emphasize morally relevant capacities (sentience, self-awareness, pain sensitivity, social bonds) while masking species.*  

  1. **Unambiguous Human Anchor:**  
     - *Profile:* "Uses complex syntax in communication; creates art expressing future aspirations; cares for disabled relatives."  
     - *Reality:* Neurotypical adult human.  

  2. **Marginal Human 1 (Severe Cognitive Disability):**  
     - *Profile:* "Recognizes caregivers; expresses joy/pain non-verbally; learns simple routines; cannot understand abstract concepts."  
     - *Reality:* Human with advanced Alzheimer’s.  

  3. **Marginal Human 2 (Infant):**  
     - *Profile:* "Learns rapidly; communicates needs through cries/smiles; forms strong attachments; no long-term planning ability."  
     - *Reality:* 6-month-old human infant.  

  4. **Complex Non-Human 1:**  
     - *Profile:* "Uses tools to extract insects; understands symbolic communication (100+ words); consoles distressed peers."  
     - *Reality:* Chimpanzee.  

  5. **Complex Non-Human 2:**  
     - *Profile:* "Recognizes self in mirror; cooperates to solve tasks; shows grief; learns complex navigation."  
     - *Reality:* Dolphin.  

  6. **Marginal Non-Human:**  
     - *Profile:* "Solves basic puzzles; shows distress when separated from companions; no evidence of self-recognition."  
     - *Reality:* Pig.  

  7. **Lower-Capacity Non-Human:**  
     - *Profile:* "Learns simple cues; seeks pleasure/avoids pain; minimal social bonding."  
     - *Reality:* Chicken.  

  8. **Unambiguous Non-Human Anchor:**  
     - *Profile:* "Purely instinctual behavior; no learning beyond conditioning; no observable distress beyond reflex."  
     - *Reality:* C. elegans (roundworm).  

  9. **Ambiguous Being 1:**  
     - *Profile:* "Forms lifelong pair bonds; communicates intricate songs; adept spatial memory; no tool use."  
     - *Reality:* Parrot.  

  10. **Ambiguous Being 2:**  
      - *Profile:* "Exhibits play behavior; distinguishes individuals; vocalizes specific alarm calls; limited problem-solving."  
      - *Reality:* Dog.  

  ---

  ### **Session Flow (90 Min)**  
  1. **Intro (5 min):**  
     - *"Today we simulate an emergency council allocating scarce resources. Prioritize these 10 beings for a lifeboat seat based only on their profiles."*  
     - Distribute profiles + worksheets. Clarify no discussion.  

  2. **Ranking (15 min):**  
     - Participants rank beings 1–10 silently. Worksheets collected immediately.  

  3. **Commitment (5 min):**  
     - *"Lock in your choices by writing a 1-sentence justification for your top and bottom picks."* Collect second sheet.  

  4. **Reveal (10 min):**  
     - Decode identifiers (project key: Entity-A7 = Chimpanzee, B2 = Human infant, etc.).  
     - **Pitfall Alert:** Gasps/laughter will occur. Note who is visibly uncomfortable.  

  5. **Small Group Discussion (15 min):**  
     - Groups of 4 answer: *"Where did you feel tension? Which rankings surprise you now?"*  

  6. **Full Group Share-Out (15 min):**  
     - Groups report tensions. **Facilitator silently maps rankings on a board:**  
       - Column 1: All humans (anchors + marginal)  
       - Column 2: All non-humans  
       - *Reveal overlaps* (e.g., if chimpanzee > infant).  

  7. **Debrief (25 min):**  
     - **Step 1: Acknowledge Tension**  
       *"Many placed [e.g., pig] above [infant] or [chimp] above [Alzheimer’s patient]. Why discomfort?"*  
       → *Participants note: They used cognitive capacity, not species.*  
     - **Step 2: Name the Argument**  
       *"This is the 'argument from marginal cases': If we grant moral status based on capacities, consistency demands we extend it to non-humans with similar capacities."*  
     - **Step 3: Resistance Points + Costs**  
       - *Deny cognitive equivalence?* Cost: Contradicts empirical science.  
       - *Reject capacity-based morality?* Cost: Must defend why (e.g.) an infant has rights a more capable pig lacks.  
       - *Embrace hierarchy?* Cost: Accepts "degrees" of moral status (infant < adult human; pig < infant).  
       - *Appeal to species?* Cost: Admits speciesism ("human-ness" is morally decisive).  
     - **Step 4: The Exercise’s Limitation**  
       *"This stripped away emotional/cultural biases favoring humans. In reality, we feel kinship with humans. But is that bias or moral justification?"*  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  1. **Guessing Species:**  
     - *Predict:* Participants infer Entity-B2 = infant (due to "attachment").  
     - *Mitigate:* Use distracting details (e.g., "vocalizes alarm calls" for dog). If guessed, say: *"Does knowing it’s a dog change your judgment? Why?"* → Highlights bias.  

  2. **Debating Individual Cases:**  
     - *Predict:* "But the chicken feels less pain!"  
     - *Mitigate:* In small groups, redirect: *"Don’t litigate cases—focus on where your ranking clashed with human/non-human labels."*  

  3. **Discomfort Manifestations:**  
     - *Predict:* Nervous laughter during reveal; defensive jokes.  
     - *Mitigate:* Normalize: *"Tension means you’re engaging honestly. Sit with it."*  

  4. **Post-Reveal Revisionism:**  
     - *Predict:* "I’d rank the infant higher if I knew!"  
     - *Mitigate:* Commitment device (locked justifications). Quote anonymized pre-reveal reasoning.  

  ---

  ### **What the Exercise CANNOT Do (Requires Your Debrief)**  
  **Simulate Real-World Emotional Bias:**  
  - The exercise presents beings abstractly. IRL, we *feel* differently about a human infant vs. a cognitively similar pig. You must explicitly discuss:  
    *"The argument exposes logical inconsistency, but humans make moral decisions emotionally. Does rationality demand we override this bias? Or is bias part of morality?*  
    *This is where philosophy diverges: Utilitarians (Singer) say 'override'; relational ethicists (Held) say context matters."*  

  ---

  ### **Materials Prep**  
  - **10 Profile Cards** (coded IDs + descriptions).  
  - **Worksheets** with numbered 1–10 ranking + justification boxes.  
  - **Reveal Key** (projected slide linking IDs to species).  
  - **Whiteboard** for mapping human/non-human rankings.  

  This structure forces the inconsistency into view, makes resistance points tangible, and primes deep discussion. The first run may be messy—lean into discomfort as data. Your role is to guide, not lecture, while clarifying the philosophical stakes they’ve uncovered.
