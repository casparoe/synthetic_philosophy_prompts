answer: |-
  Below is a decision tree designed to map intuitive commitments about distributive justice to specific positions in the equality literature. It starts with the fundamental question of currency, then (for quantitative currencies) the timing of evaluation, and finally the distributional pattern. The tree is built from logical distinctions first, with named positions appearing only at the endpoints ("leaves"). Empty cells indicate combinations that are either unattractive, incoherent, or unexplored in the literature.  

  ---

  ### **Decision Tree**  

  **Q1: What is the fundamental "currency" a just society should distribute?**  
  - **a. Welfare** (well-being, happiness, preference satisfaction).  
  - **b. Resources** (material goods, wealth, opportunities, or compensation for disadvantages).  
  - **c. Capabilities** (real freedoms to achieve functionings, e.g., health, education).  
  - **d. Opportunity** (access to achieve welfare, resources, or other advantages).  
  - **e. Relational** (social relations, e.g., non-domination, equal status).  

  → *If you chose **e**, stop here: Your position is* **Relational Egalitarianism** (e.g., Anderson, Scheffler).  
  → *For **a**, **b**, **c**, or **d**, proceed to Q2.*  

  **Q2: When evaluating justice, should we focus on initial prospects or final outcomes?**  
  - **a. Ex ante**: Focus on expected prospects *before* risks and choices unfold (fair starting points).  
  - **b. Ex post**: Focus on actual outcomes *after* risks and choices resolve (fair end states).  

  → *Proceed to Q3.*  

  **Q3: What distribution pattern should we prioritize?**  
  - **a. Strict equality**: Everyone should have the same amount of the currency.  
  - **b. Sufficiency**: Everyone must reach a threshold; inequality above it is acceptable.  
  - **c. Prioritarian**: Give priority to the worst off, even without full equality.  

  ---

  ### **Resulting Positions**  
  Based on your answers, your view aligns with:  

  | Currency | Timing   | Pattern     | Position                          | Notes                                                                 |
  |----------|----------|-------------|-----------------------------------|-----------------------------------------------------------------------|
  | Welfare  | Ex ante  | Equality    | **Ex Ante Welfare Egalitarianism** | Luck-egalitarian variant (e.g., early Arneson).                      |
  |          |          | Sufficiency | **Ex Ante Welfare Sufficientarianism** | Rare; focuses on guaranteed minimum prospects.                       |
  |          |          | Prioritarian| **Ex Ante Welfare Prioritarianism**   | Emphasizes improving expected prospects of worst off.                |
