  |          |          | Sufficiency | **Welfare Sufficientarianism**       | Thresholds for well-being (e.g., Frankfurt).                         |
  |          |          | Prioritarian| **Prioritarianism**                  | Parfit-style; weights gains to the worse off (dominant view).        |
  | Resources| Ex ante  | Equality    | **Resource Egalitarianism**          | Dworkin-Cohen (equality of resources via auction/insurance).         |
  |          |          | Sufficiency | **Resource Sufficientarianism (Ex Ante)** | Underdeveloped; e.g., guaranteed minimum resources pre-risk.         |
  |          |          | Prioritarian| **Resource Prioritarianism (Ex Ante)** | Uncommon; priority to worst-off prospects.                           |
  |          | Ex post  | Equality    | *[Empty]*                          | Incoherent with responsibility: Ex post equality negates choice.     |
  |          |          | Sufficiency | **Resource Sufficientarianism (Ex Post)** | Poverty relief; ensures outcomes meet thresholds.                    |
  |          |          | Prioritarian| **Resource Prioritarianism (Ex Post)** | Focuses on lifting worst-off outcomes (e.g., weighted transfers).    |
  | Capabilities| Ex ante| Equality    | *[Empty]*                          | Unattractive: Ignores diversity of capability needs (Sen's critique).|
  |          |          | Sufficiency | **Capability Approach**             | Nussbaum-style thresholds for basic capabilities.                    |
  |          |          | Prioritarian| *[Empty]*                          | Unexplored; capability prioritarianism lacks clear advocates.        |
  |          | Ex post  | Equality    | *[Empty]*                          | Incoherent: Capabilities are freedoms, not outcomes (ex post ≠ freedoms). |
  |          |          | Sufficiency | *[Empty]*                          | Unattractive: Functionings (ex post) are means, not justice ends.    |
  |          |          | Prioritarian| *[Empty]*                          | Unexplored; same as above.                                           |
  | Opportunity| Ex ante | Equality    | **Luck Egalitarianism**             | Equal opportunity for welfare/resources (e.g., Arneson).             |
  |          |          | Sufficiency | *[Empty]*                          | Unexplored; "sufficient opportunity" lacks theoretical grounding.    |
  |          |          | Prioritarian| *[Empty]*                          | Unattractive: Priority to opportunity conflicts with equality of access. |
  |          | Ex post  | *Any*       | *[Incoherent]*                     | Opportunity is inherently prospective (ex ante); ex post is nonsensical. |
  | Relational| *N/A*   | *N/A*      | **Relational Egalitarianism**       | Rejects distributive metrics; focuses on social relations.           |

  ---

  ### **Key Observations**  
  1. **Empty/Incoherent Cells**:  
     - Ex post resource equality is incoherent (undermines responsibility).  
     - Ex post capabilities are incompatible with the theory’s core (freedoms ≠ outcomes).  
     - Ex post opportunity is nonsensical (opportunity is prospective).  
     - Capability equality is unattractive (ignores human diversity).  

  2. **Indistinguishable Positions**:  
     - **Resource egalitarianism** (b/a/a) and **capability approach** (c/a/b) are separated by *both currency and pattern*. This reflects their theoretical divergence: resources focus on means (with ex ante equality), capabilities on freedoms (with ex ante sufficiency). However, they converge in emphasizing *opportunity* (vs. outcomes), illustrating your debate’s core tension.  
     - **Luck egalitarianism** appears in multiple leaves (e.g., welfare ex post equality, resources ex ante equality, opportunity ex ante equality). The tree captures its variants but cannot group them under one leaf.  

  3. **Branch Logic**:  
     - Currency (Q1) isolates the deepest disagreement: *what* is being equalized.  
     - Timing (Q2) distinguishes responsibility-sensitive theories (ex ante) from outcome-focused ones (ex post).  
     - Pattern (Q3) reveals how theories limit equality (sufficiency, prioritarianism).  

  This tree clarifies that ex ante/ex post and pattern choices are not mere "implementation details" of currency but define distinct families of theories. Use it to spark debate on whether currency alone determines these dimensions—or if your friend was right!  

