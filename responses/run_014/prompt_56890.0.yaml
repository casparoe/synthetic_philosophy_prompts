prompt: |-
  For several years now I have read history as an amateur, mostly the kind of book that promises to explain a century by way of a harvest, a microbe, or a mountain, and I have reached the point where I can no longer tell when such a book is actually saying something and when it has merely changed the subject in a confident tone. Before I pick up another one, I would like to know what I should be demanding of the account. So: write out the requirements that any attempt to treat non-human things — pathogens, climate, volcanoes, soil, livestock, ocean currents — as causes in history rather than as scenery has to satisfy in order to count as adequate. I am not looking for a survey of who has written what, and I do not want a reading list; I want the standard itself, the thing I could hold a book up against.

  For each requirement, give me the case or consideration that motivates it, and then mark it plainly: is it non-negotiable for any account that deserves the name, or does it turn out to be the local taste of one school of historians dressed up as a criterion? I suspect a fair number of the demands people make in this area are of the second kind, and identifying those is worth as much to me as listing the first.

  To give you something to work with, here are the puzzles I have not been able to resolve on my own. I would like the list to speak to each of them, whether by turning it into a requirement, by dissolving it, or by telling me it rests on a confusion:

  - What I have been calling the difference between backdrop and co-author. A dry decade that raises the odds of unrest, and a dry decade that determines what the unrest is about, seem to be different claims, and I cannot say what would settle which one a book is making.
  - The alibi problem. A famine that turned out to be less about how much food existed than about who could get at it makes me wary of any account in which the weather arrives just in time to relieve the people in charge of responsibility. Is there a requirement that an environmental explanation must not function as an excuse, and if so, how could that ever be more than my own politics?
  - The invisible-cause problem. Suppose a region grew drier and its farmers quietly switched crops, so that nothing at all shows up in the record. The cause was real and the effect was nil. An account that only counts visible effects will systematically under-rate non-human causes; an account that counts absorbed ones seems unable to be checked against anything.
  - The double-telling test. If the same event can be narrated twice, once with institutions as the protagonists and once with the climate, and both versions read as true and neither contradicts the other, I am not sure either has explained anything. What should a theory owe me here?
  - Proportion. It is easy to move from "the eruption made things worse" to "the eruption made this happen," and I cannot find the seam.

  Then, and this is the part I most want, tell me whether some subset of these requirements cannot all be satisfied at once. My own hunch is that insisting the account preserve human choice and responsibility, insisting that a non-human factor sometimes be the thing that makes the difference, and insisting that the account never launder the decisions of the people in power form a triangle that cannot be closed — but I have no way of knowing whether that hunch survives contact with a careful statement of each demand. If the list is itself a result in this way, say so and show the conflict.

  Finally, tell me which single requirement does the most work in ruling candidates out, and give me a short verdict on whether the word actor is earning its place in this literature at all, or whether it is decoration laid over an ordinary causal claim that could be stated without it. Keep the weight on the criteria and their motivating cases; if you mention how the familiar kinds of account fare against the list, a paragraph will do, and I will draw my own conclusions from it.
reasoning: |-
  Okay, I need to really understand what this user is asking for. They've been reading history books that use non-human elements like pathogens or climate to explain historical events, but they're skeptical about when these accounts are actually insightful versus just changing the subject confidently. They want a set of criteria to evaluate such books, not recommendations or surveys.

  The user has specific puzzles they want addressed: backdrop vs. co-author distinction, the alibi problem where environmental factors might excuse those in power, the invisible-cause issue where causes don't leave traces, the double-telling test where both human and non-human narratives seem true but unexplanatory, and proportion problems where causes are overstated.

  I should develop requirements that tackle each puzzle directly. For each requirement, I need to include the case that motivates it and clarify if it's essential or more of a stylistic preference. The user suspects some demands are just dressed-up preferences, so distinguishing that is crucial.

  The user also wants to know if some requirements conflict, especially around human responsibility, non-human factors making a difference, and not excusing power holders. They have a hunch this forms an unsolvable triangle—I need to test that.

  Finally, they want to know which requirement is most stringent at filtering out weak accounts and whether "actor" is a meaningful term or just decorative. I'll keep the focus on criteria, only briefly touching on how common accounts might fail them.

  For the requirements, I'm considering starting with causal specificity to address the backdrop vs. co-author issue. The alibi problem might need something like responsibility transparency. The invisible cause puzzle could require counterfactual testing. The double-telling test points to explanatory sufficiency, and proportion needs probabilistic framing. I'll mark each as non-negotiable or negotiable based on whether it's fundamental to causality or more about narrative style.

  For conflicts, I'll explore the triangle the user mentioned. Human agency preservation vs. making non-human factors decisive might clash with avoiding power-laundering. I'll conclude that while tensions exist, they're navigable with careful methodology.

  The most effective filter requirement might be causal specificity because it forces clear mechanisms. As for "actor," I'll argue it's often decorative unless carefully defined, as non-human things don't have intentionality like humans.

  I'll structure this clearly: list requirements with motivations and necessity ratings, address each puzzle, show conflicts, and end with the filter requirement and "actor" verdict. The response needs to be rigorous but accessible, fulfilling the user's need for a practical evaluation tool.
answer: |-
  Here is a set of requirements for evaluating historical accounts that treat non-human things as causes, derived from your puzzles and core historiographical principles. Each requirement includes its motivation, necessity rating, and how it addresses your specific concerns. A conflict analysis and the "actor" verdict follow.

  ### Core Requirements

  1.  **Causal Specificity (Mechanism & Process)**
      *   **Motivation:** Your "backdrop vs. co-author" puzzle. A dry decade raising *odds* of unrest (backdrop) vs. determining *what the unrest is about* (co-author) requires showing *how* the drought interacted with specific social, economic, or political structures/changes to produce the *particular* outcome. (Case: The Irish Potato Famine vs. a bad harvest in a resilient welfare state).
      *   **Necessity:** **Non-negotiable.** Without specifying *how* A (drought) leads to B (specific unrest), the claim is merely correlative or suggestive, not explanatory.
      *   **Addresses:** Backdrop/Co-author, Proportion.

  2.  **Counterfactual Plausibility**
      *   **Motivation:** The "invisible-cause" problem & Proportion. To assess if non-human factor X *made a difference*, we must ask: "Would outcome Y likely have occurred *differently* (or not at all) if X had been absent or significantly different, holding other key factors reasonably constant?" (Case: Would New Orleans' 2005 flood disaster have been identical without Hurricane Katrina? Obviously not. Would crop switching *still* have occurred eventually without gradual drying? Possibly, but the *timing, specific crops chosen, and social dislocation* might differ).
      *   **Necessity:** **Non-negotiable.** This is the fundamental test for *causal relevance*. It distinguishes necessary/sufficient conditions from background constants. An account that ignores counterfactuals cannot establish causation.
      *   **Addresses:** Invisible-cause, Proportion.

  3.  **Responsibility Transparency (Anti-Alibi Requirement)**
      *   **Motivation:** Your "alibi problem." Environmental factors (famine-triggering drought) often expose or interact with pre-existing vulnerabilities *created or maintained* by human systems (land tenure, colonial extraction, market failures, state capacity). The account must explicitly analyze this interaction. (Case: Bengal Famine of 1943 - drought/war disrupted supply, but British imperial policy & local administration failures determined who starved).
      *   **Necessity:** **Non-negotiable.** This is not about imposing modern politics; it's about rigorous causality. Ignoring how human systems *mediate* the impact of non-human factors produces incomplete, often misleading explanations that *do* functionally serve as alibis by omission. The requirement is to *analyze the interaction*, not to pre-judge blame.
      *   **Addresses:** Alibi Problem, Backdrop/Co-author (shows *how* it becomes co-author).

  4.  **Explanatory Sufficiency (Against Mere Double-Telling)**
      *   **Motivation:** Your "double-telling test." If both a "human institution" narrative and a "non-human factor" narrative seem complete and non-contradictory, neither is sufficient. The *integrated* narrative must demonstrate that the non-human factor isn't merely a condition of possibility or a minor amplifier, but played a *necessary and distinctive role* that the human-institution narrative alone cannot fully explain. (Case: Explaining European expansion. An "institutions/guns" narrative is powerful; adding "disease" only becomes sufficient if it explains outcomes the institutional narrative *cannot* (e.g., rapid demographic collapse in the Americas vs. slower patterns in Africa/Asia)).
      *   **Necessity:** **Non-negotiable.** If the non-human factor can be cleanly removed from the explanation without loss, it wasn't causal in that context. Sufficiency demands integration and demonstrating unique contribution.
      *   **Addresses:** Double-Telling Test, Proportion.

  5.  **Probabilistic Framing (Avoiding Overdetermination)**
      *   **Motivation:** Your "proportion" puzzle and the reality of complex systems. Non-human factors (like an eruption) rarely *make* a single, inevitable outcome happen. They shift probabilities, close off options, open new pathways, or amplify/reduce existing pressures within a contingent human context. The account should reflect this (e.g., "The eruption drastically increased the *probability* of state collapse by destroying harvests *and* undermining the regime's legitimacy *in a context* of existing fiscal strain and elite rivalry").
      *   **Necessity:** **Negotiable (but highly desirable).** Strict determinism is often unrealistic, but some historians prefer narrative certainty. However, *failing* to use probabilistic framing often leads directly to the proportion problem ("made worse" vs. "made happen"). It's the strongest guard against overstatement.
      *   **Addresses:** Proportion, Invisible-cause (acknowledges non-events as valid outcomes), Backdrop/Co-author.

  6.  **Empirical Traceability (Evidence Requirement)**
      *   **Motivation:** The "invisible-cause" problem and general falsifiability. While absorbed causes (quiet crop switching) leave less dramatic traces, the account *must* provide evidence *beyond* the mere existence of the non-human factor and the subsequent event. This could be: evidence of human *recognition/response* (diaries, policy debates, price shifts, new technologies); material evidence (pollen analysis, soil cores, tree rings, skeletal stress markers); or demonstrating the factor's impact via the counterfactual and specificity requirements applied rigorously to the available record.
      *   **Necessity:** **Non-negotiable.** Without empirical constraints, any claim is possible. The evidence need not be *direct* proof of causation, but must support the proposed causal *chain* and counterfactual plausibility.
      *   **Addresses:** Invisible-cause, Double-Telling (grounds one narrative as better supported).

  ### Conflict Analysis: The Triangle

  You suspect a conflict between:
  A. Preserving human choice/responsibility.
  B. Insisting the non-human factor is sometimes *the* difference-maker.
  C. Never laundering the decisions of the powerful.

  *   **Conflict Exists, But Is Navigable:** These *do* create tension, but not an absolute contradiction that "cannot be closed." The key is Requirement 3 (Responsibility Transparency) and Requirement 1 (Causal Specificity).
  *   **Resolution:** The non-human factor (B) becomes the decisive "difference-maker" *precisely by interacting with* specific human choices and institutional structures (A & C). The eruption didn't *cause* the regime collapse; it caused harvest failure which interacted with the regime's *choice* to hoard grain and its *prior choice* to neglect grain storage infrastructure, leading to famine, revolt, and collapse. The eruption is the trigger/difference-maker *in that specific chain*, but human choices (including those of the powerful, C) shaped vulnerability and response. The account satisfies B *by showing how* A and C operated in relation to it. Neglecting A or C creates the alibi (violating Requirement 3). The tension is productive; forcing the account to show *how* they intertwine is the solution, not the problem. Requirement 4 (Explanatory Sufficiency) ensures B isn't just tacked on.

  ### The Most Effective Filter Requirement

  *   **Causal Specificity (Requirement 1)** does the heaviest lifting in ruling out inadequate accounts. Vague claims about climate "influencing" events or microbes "shaping" societies are endemic. Demanding a clear, plausible mechanism *connecting* the non-human factor to the specific historical outcome via human mediation instantly separates suggestive correlations from genuine causal arguments. It directly tackles the core ambiguity you started with (backdrop vs. co-author) and forces engagement with proportion and the alibi problem. An account failing this might be interesting background reading, but not an adequate *causal explanation*.

  ### The Verdict on "Actor"

  *   **"Actor" is Largely Decorative and Often Unhelpful.** Using "actor" for non-human things (pathogens, volcanoes) is usually metaphorical shorthand or an attempt at rhetorical elevation laid over a standard causal claim. Non-human entities lack *intentionality* – the core element of human/animal agency central to most definitions of "acting." Calling a virus an "actor" adds nothing beyond saying "the virus *caused* significant demographic change through transmission and lethality." It risks:
      *   **Anthropomorphism:** Implying purpose or strategy where none exists.
      *   **Obfuscation:** Masking the need for Causal Specificity (Requirement 1) by using a dramatic but vague term.
      *   **Distraction:** Shifting focus from the crucial *interaction* (Requirements 1 & 3) to the non-human entity in isolation.
  *   **Exception:** It *might* be rigorously defensible in highly specific theoretical frameworks (e.g., certain strands of Actor-Network Theory) that radically redefine agency, but even then, it creates significant potential for confusion outside that niche. For the purposes of evaluating causal adequacy in historical explanation, ordinary causal language ("cause," "factor," "condition," "trigger," "constraint," "enable") is clearer and sufficient. The metaphor rarely earns its keep.

  **In Summary:** Hold any account claiming non-human things as historical causes to these six requirements. The core non-negotiables (Specificity, Counterfactuals, Responsibility Transparency, Sufficiency, Evidence) form a robust framework for identifying genuine explanation versus confident subject-changing. While tensions exist (especially within your "triangle"), they are managed by rigorously applying these requirements, particularly focusing on *how* the non-human factor interacted with human choices and systems. If an account passes Requirement 1 (Causal Specificity) and Requirement 3 (Responsibility Transparency), it has likely navigated the major pitfalls. Ignore the "actor" talk; demand clear causal language.
