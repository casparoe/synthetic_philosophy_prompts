answer: |-
  Here are 10 interview questions designed to push beyond restatement, specifically targeting your requested areas (a, b, c) with follow-ups and ending with falsifiability. They aim to force the philosopher to demonstrate how the view *applies*, *avoids pitfalls*, and *explains significance*.

  **Core Questions:**

  1.  **Establishing the View:** "You argue that many metaphysical disputes are verbal rather than substantive. Could you walk us through a *specific, clear-cut* example (e.g., mereological universalism vs. nihilism, or presentism vs. eternalism) and demonstrate *step-by-step* how you diagnose it as merely verbal? What specific linguistic or conceptual differences create the *illusion* of a substantive disagreement here?"
      *   *Likely Answer:* She'll pick an example and argue that the parties are using key terms ("object," "exists," "time") with different, equally coherent meanings, each leading to internally consistent but incompatible descriptions of the *same underlying reality*.
      *   **Follow-Up:** "If both frameworks are internally coherent and describe the same reality, isn't the choice between them purely arbitrary? Doesn't that render metaphysics itself trivial? Why spend time on it at all?"

  2.  **Handling Seemingly Factual Disagreements (Area a):** "Many philosophers see debates about abstract objects, like the existence of infinitely many numbers, as involving genuine matters of fact – discovering what *mathematical reality* is like. How does your 'verbal dispute' diagnosis apply here? Crucially, *how can you show* it's verbal without simply *asserting* it is? Does the Platonist and the nominalist genuinely disagree about the same mathematical propositions, or are they talking about different things?"
      *   *Likely Answer:* She'll argue that "existence" or "number" means something different in the mathematical context for each side (e.g., mind-independent abstract entities vs. useful fictions/constructs). The "fact" in dispute is parasitic on the chosen linguistic/conceptual framework.
      *   **Follow-Up:** "But both sides agree on the *truth* of mathematical statements like '2+2=4' within their respective systems. Isn't the *ontological commitment* – whether these truths require mind-independent entities – the real point of contention? How is *that* difference merely verbal? Doesn't it seem like a disagreement about what *must exist* for the truths to hold?"

  3.  **The Fine Worry / Dogmatism Risk (Area b):** "Kit Fine argues that if the 'conceptual truths' grounding our language use can themselves be mistaken or revised, then declaring a dispute 'merely verbal' risks dogmatism: we could always insist *our* concepts are right and dismiss *any* opposing view as confused semantics. How do you avoid this charge? How stable or revisable are the 'conceptual schemes' that, on your view, underlie these disputes?"
      *   *Likely Answer:* She'll emphasize that concepts *can* be revised based on theoretical utility, empirical success, coherence, etc., but that such revision is different from settling a factual dispute *within* a conceptual scheme. Diagnosing a dispute as verbal requires showing the *current* concepts are incompatible but equally viable for describing the agreed-upon phenomena.
      *   **Follow-Up:** "Doesn't this just shift the dogmatism? If revision is based on 'theoretical utility' or 'coherence', aren't *those criteria* themselves contestable? Couldn't a metaphysician simply claim their framework is *more useful* or *more coherent* in a way that *isn't* merely verbal, forcing you to engage substantively after all? How do you adjudicate *which* conceptual scheme is 'better' without making substantive claims?"

  4.  **What's at Stake? (Area c):** "If the core of these metaphysical debates isn't about how the world *is*, but about how we *describe* it, what *is* actually at stake? Why should philosophers, or anyone else, care about resolving these disputes? What hangs on choosing one 'linguistic framework' over another?"
      *   *Likely Answer:* She'll argue the stakes are pragmatic: explanatory power, simplicity, integration with science, conceptual clarity, avoiding paradox, fruitfulness for further inquiry, or even ethical/political implications of certain ways of conceptualizing.
      *   **Follow-Up:** "This sounds like the disputes *aren't* trivial, just different in kind – they become disputes about *which tool is best for a job*. But doesn't this collapse your view into a form of pragmatism? And crucially, how do we *objectively measure* things like 'explanatory power' or 'fruitfulness' across fundamentally different frameworks without begging the question?"

  5.  **Distinguishing Verbal from Substantive:** "What's your *positive test* for identifying a genuinely *substantive* metaphysical disagreement? Can you give an example of one? If such disagreements are possible, how do they differ structurally from the ones you deem verbal? What prevents *any* disagreement from being diagnosed as verbal using your criteria?"
      *   *Likely Answer:* She might point to disagreements where conceptual schemes genuinely overlap but make incompatible predictions about observable phenomena, or where one scheme demonstrably leads to internal contradictions the other avoids *even after clarification*, or perhaps disagreements grounded in empirical science.
      *   **Follow-Up:** "Aren't many core metaphysical debates precisely designed to be *prior to* empirical test (e.g., the nature of causation, laws, properties)? If a dispute is insulated from empirical adjudication by design, does your view automatically condemn it to being verbal? Doesn't that seem overly restrictive?"

  6.  **The Role of Intuition:** "Philosophers often rely on intuitions ('It just seems obvious that objects persist through time...'). On your view, are these intuitions tracking deep features of reality, or are they merely reflections of our deeply ingrained conceptual habits? If the latter, doesn't that radically undermine their evidential weight in metaphysics?"
      *   *Likely Answer:* She'll likely argue intuitions often reflect conceptual commitments rather than direct insight into reality, making them poor arbiters for disputes *between* fundamentally different conceptual schemes.
      *   **Follow-Up:** "But if intuitions are just artifacts of our conceptual scheme, how do we ever *justify* choosing one scheme over another? Doesn't that justification ultimately have to appeal to *something* outside the scheme, perhaps including some pre-theoretic intuitions about coherence or utility? Isn't that circular?"

  7.  **Impact on Science:** "Science often makes metaphysical presuppositions (e.g., about the reality of unobservable entities, causation, natural laws). Does your view imply that disagreements about *these* presuppositions are also merely verbal? If so, does that undermine the objectivity of science? If not, how do you draw the line between scientific and 'merely metaphysical' presuppositions?"
      *   *Likely Answer:* She'll likely argue that scientific disputes become substantive when tied to empirical consequences, while the *interpretation* of those results (e.g., realist vs. instrumentalist) might involve more verbal elements. The line is blurry.
      *   **Follow-Up:** "But many scientific revolutions (e.g., relativity, quantum mechanics) involved profound shifts in fundamental concepts (space, time, causality, objecthood). Was the debate between Einstein and proponents of absolute space/time merely verbal *before* the empirical evidence came in? If not, why not? If so, how does the later empirical evidence resolve a *verbal* dispute?"

  8.  **Motivation & Scope:** "What motivates this view? Is it driven by a particular epistemological worry (e.g., how could we know these deep facts?), a semantic theory (e.g., verificationism or inferentialism), or perhaps a disillusionment with the lack of progress in metaphysics? Also, how broad is its scope – are *all* traditional metaphysical disputes verbal, or only some? How do you decide which ones qualify?"
      *   *Likely Answer:* Motivation might be epistemological (skepticism about access to "ultimate reality"), semantic (meaning is use/conceptual role), or methodological (frustration with irresolvable debates). Scope is likely "many" or "core" disputes, with criteria based on the possibility of mapping statements between frameworks without loss, or the absence of shared empirical implications.
      *   **Follow-Up:** "If the motivation is epistemological, does your view risk being self-undermining? How do you *know* that these disputes are verbal? Isn't *that* a substantive metaphysical claim about the nature of the disagreements? If the motivation is semantic, doesn't your semantic theory itself become a substantive (and potentially controversial) metaphysical commitment?"

  9.  **The Biggest Misconception:** "What do you think is the most common or damaging misconception about your position, especially the idea that it just politely says metaphysicians 'talk past each other'? How does your view go significantly beyond that caricature?"
      *   *Likely Answer:* She'll argue it's not just about accidental miscommunication, but about revealing deep structural features of language and conceptualization that make substantive disagreement in these areas impossible *in principle*. It offers a diagnosis and potentially a way forward (focusing on pragmatic virtues).
      *   **Follow-Up:** "Doesn't this 'in principle' claim itself sound like a strong metaphysical thesis? Aren't you making a substantive claim about the *limits* of what language can meaningfully dispute?"

  10. **Falsifiability (Key for Readers):** "What kind of evidence or argument could, in principle, convince you that a specific metaphysical dispute you currently view as verbal (e.g., about universals or temporal ontology) *is* actually substantive? What would a successful demonstration of a substantive metaphysical disagreement look like?"
      *   *Likely Answer:* This is the hardest. She might say: clear evidence that the dispute leads to incompatible empirical predictions; demonstration that one framework generates unresolvable contradictions *even after all conceptual clarifications* while the other doesn't; or perhaps showing that the frameworks aren't actually incompatible descriptions of the same reality but about genuinely different aspects.
      *   **Follow-Up (If answer seems weak):** "But aren't these criteria incredibly demanding, perhaps impossible to meet for the kinds of disputes metaphysics tackles? Doesn't this make your view effectively unfalsifiable? If no conceivable evidence could change your mind about a dispute being verbal, how is this different from dogma?"

  **Key Strategies Embedded:**

  *   **Forcing Application:** Questions 1, 2, 4, 7 demand concrete examples and step-by-step diagnosis.
  *   **Charging Pitfalls:** Questions 3 (Fine's Dogmatism), 5 (Distinguishing Criteria), 8 (Motivation/Self-Undermining), 9 (Misconception/Metaphysical Commitment) directly confront weaknesses.
  *   **Demanding Stakes:** Questions 4, 6, 7 press on significance, moving beyond "just semantics."
  *   **Pressing on Core Cases:** Question 2 tackles the math example head-on.
  *   **Falsifiability:** Question 10 explicitly asks for what would change her mind.
  *   **Anticipating Replies:** Follow-ups target the most probable defensive responses, pushing her to clarify and defend the deeper implications.
  *   **Avoiding Restatement:** Questions are phrased to require explanation, justification, demonstration, and defense, not just summary.

  Use these as a flexible framework. Listen closely to her answers and adapt the follow-ups accordingly. Good luck with the interview!
