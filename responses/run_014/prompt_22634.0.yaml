  I should design questions that force the philosopher to apply their framework concretely. For (a), I'll use mathematical realism as a test case because it feels intuitively factual. The follow-up should challenge whether labeling it "verbal" explains anything. For (b), I need to press on how conceptual truths avoid being arbitrarily adjustable - maybe invoke Fine's "open question" test. For (c), the question must extract tangible consequences beyond semantic preferences.

