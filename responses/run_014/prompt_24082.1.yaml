  First, I need to outline Rorty's position. He rejects representationalism, so truth isn't about corresponding to reality. Justification is based on solidarity within a community. Progress happens through redescription, making new vocabularies more appealing. But if the existing vocabulary is harmful, how can we justify that a new one is better without begging the question?

  The strongest objection here is circularity. If justification relies on the community's current values, and those values are part of the problem, then critiquing them from within seems impossible. For example, challenging patriarchy using a patriarchal vocabulary would be self-defeating. The critic might be dismissed as not making sense within that framework.

  On Rorty's side, he argues that redescriptions create new perspectives. By telling stories of suffering, we evoke empathy, expanding the community's "we." This isn't about truth but reducing cruelty. Progress is measured by practical outcomes: less suffering, more inclusion. But does this smuggle in naturalistic standards? If suffering is biological, maybe, but Rorty sees it as contingent, tied to historical contexts.

  The essay needs to address specific points: normative force of redescription, hidden standards, community bias, and distinguishing real harm from rhetorical shifts. For normative force, Rorty relies on persuasion through empathy and consequences. But critics might say this only works if the audience already values empathy. If a community is indifferent to outsiders' suffering, how can redescription work?

