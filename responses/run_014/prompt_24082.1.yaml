  Irony and hope help by maintaining skepticism towards final vocabularies, but they might not solve the problem of justifying change to those without liberal values. Rorty's approach seems most effective within liberal societies. For non-liberal communities, it might be ineffective, which is a limitation he accepts.

  The conclusion should take a stance. After weighing both sides, I think Rorty's framework can be reconstructed. The key is that moral progress emerges from immanent critique and the practical consequences of vocabularies. While contingent, the expansion of solidarity through shared vulnerability provides a non-circular path. So, Rorty's account holds, but with the understanding that it's historically situated and not universally persuasive.
