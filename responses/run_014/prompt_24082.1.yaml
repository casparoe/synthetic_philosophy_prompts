  ## The Pragmatist's Tightrope: Rorty, Progress, and the Specter of Circularity

  Richard Rorty’s neopragmatism, with its thoroughgoing antirepresentationalism and embrace of solidarity as the ground of justification, presents a radical challenge to traditional philosophical accounts of knowledge and morality. It discards the quest for foundations, objective moral truths, or a "God's-eye view," replacing them with contingent vocabularies justified by their usefulness in serving shared human purposes, particularly the avoidance of cruelty and the expansion of solidarity. Yet, a persistent and powerful internal challenge emerges precisely when confronting the core engine of Rorty’s proposed moral progress: **redescription**. Can the process of generating new moral vocabularies, aimed at alleviating harm *caused by the very vocabulary in need of replacement*, escape vicious circularity or mere rhetorical preference within Rorty's framework? This essay argues that while Rorty’s position faces significant pressure, a coherent reconstruction *is* possible, albeit one requiring careful navigation and acknowledging inherent limitations.

  **The Core Worry: Progress Trapped in the Vocabulary it Seeks to Escape?**

  The objection crystallizes sharply. If truth is not correspondence to reality but "what is good for *us* to believe," and justification is a matter of persuading a community through redescriptions that resonate with *their* evolving sense of "us," then criticizing an existing moral vocabulary seems inherently problematic. How can one condemn a vocabulary as harmful using standards *internal* to that same vocabulary? Imagine a deeply patriarchal society where concepts of female agency or inherent equality are unintelligible or actively discredited by the prevailing moral language. A critic appealing to "natural rights" or "objective human dignity" relies on concepts Rorty rejects as representationalist illusions. Appealing to the *existing* community's sense of justice or well-being risks reinforcing the very norms causing harm – perhaps women are deemed "happier" in their subservient role, or their suffering is not recognized *as* suffering within the dominant descriptive framework.

  The critic seems trapped: condemn the vocabulary from "outside" (invoking discredited representationalism) or flatter the community by framing critique in terms it already accepts (which likely perpetuates the harm). On this view, Rorty’s progress appears as merely contingent rhetorical success – persuading a group already leaning towards liberal values to be *more* liberal, or satisfying a preference for novelty. It lacks normative force to challenge fundamentally oppressive structures whose language defines the very criteria of justification.

  **Rorty's Defense: Redescription, Suffering, and the Expansion of "We"**

  Rorty’s strongest counter-argument hinges on the dynamic, practical, and *consequentialist* nature of vocabularies within his pragmatism. He denies that progress requires an "independent criterion" existing outside human practices. Instead, progress emerges *immanently* through the persuasive power of redescriptions that *work* by better fulfilling *human* needs and desires, particularly the desire to avoid pain and humiliation.

  1.  **The Primacy of Suffering and Agency:** While rejecting a *metaphysical* foundation, Rorty insists that certain experiences – physical pain, humiliation, the crushing of agency – are *prima facie* bad across most vocabularies. They are not "representations" of an independent moral fact, but brute stimuli that human organisms universally seek to avoid. A new vocabulary gains traction not by corresponding to reality, but by *making salient* previously ignored or rationalized suffering, or by revealing how existing practices *frustrate* widely shared human desires for agency and recognition. The abolitionist doesn't need an objective "wrongness" of slavery; they make vivid the suffering inflicted, appealing to empathy and the inconsistency of professed Christian charity with brutal ownership. The force comes from confronting the community with consequences its *own* practices generate, consequences many within it might already, uneasily, feel.
  2.  **Redescription as Normative Force:** Redescription *is* the normative engine. It doesn't require an independent standard because its power lies in its *consequences* and its *ability to reshape perception*. A successful redescription (e.g., framing same-sex desire not as "sin" but as "love," or gender nonconformity not as "disorder" but as "identity") changes what people *notice* and *care about*. It makes previously accepted harms visible *as* harms by placing them within a narrative of cruelty or thwarted flourishing that resonates with existing, albeit perhaps latent, sympathies or ideals (like fairness or preventing suffering). The normative force comes from the *practical impact*: does this new way of talking lead to less suffering, greater inclusion, more individuals having their voices heard? This is judged *historically* and *comparatively* against the old vocabulary's outcomes, not against an abstract standard.
  3.  **Solidarity as Dynamic Expansion:** "Solidarity" is not static. Redescription works by *expanding* the sense of "we." By telling the stories of the marginalized – making their suffering vivid and their humanity undeniable – new vocabularies invite the existing community to include them within its circle of concern. The justification for the new vocabulary is that it fosters a *wider*, *more inclusive* solidarity where more voices contribute to the conversation about what "our" purposes are. This expansion isn't arbitrary; it appeals to the existing community's *own* professed (but perhaps hypocritically applied) ideals of compassion or fairness, or simply to the shared vulnerability of being human.
  4.  **Irony and Hope as Correctives:** Rorty’s concept of "irony" – acknowledging the contingency of one's own final vocabulary – mitigates the charge of dogmatism. The ironist doesn't claim their redescription taps into Truth, only that it *might* lead to a less cruel world. "Hope" fuels the project, not certainty. This humility acknowledges that progress is fallible and contingent, but argues that striving for less suffering through persuasion is the best we can do, and demonstrably better than foundationalism, which often paralyzes action or justifies dogma.

  **Critical Rejoinders: Smuggling, Efficacy, and the Nature of Harm**

  The defense, however, faces potent counter-rejoinders:

  1.  **Smuggling Naturalism?** Does appealing to "suffering," "agency," or "flourishing" inevitably smuggle in a naturalistic or representationalist standard? Is the claim that "suffering is bad" merely contingent, or does its near-universal force suggest a deeper, biologically grounded aversion that *functions* representationally? If the normative force relies on these experiences being *objectively* negative stimuli, then Rorty might be relying on a minimal representationalism about human biology and psychology that his broader antirepresentationalism seemingly forbids. Can he consistently claim that recognizing slavery as causing suffering isn't recognizing an *objective fact* about the world and human experience?
  2.  **The Community Boundary Problem:** Rorty’s appeal to expanding solidarity seems most persuasive *within* communities already possessing liberal sensibilities. How does it compel a community genuinely indifferent to the suffering of an out-group, or one that defines flourishing in ways incompatible with liberal individualism (e.g., certain theocracies)? Can redescriptions *create* empathy where none exists, or do they merely activate *preexisting* latent sympathies? If the latter, Rorty’s account seems persuasive only to those already partially converted, failing as a tool for radical critique of fundamentally alien moral frameworks.
  3.  **Altering Feelings vs. Recognizing Harm:** Can pragmatism truly distinguish between a redescription that merely makes us *feel better* about a harmful practice (e.g., reframing exploitation as "noble sacrifice") and one that genuinely changes what we recognize *as* harm? Without an independent criterion, isn't the difference merely that one redescription gains wider acceptance than the other? Rorty might respond that the test is long-term consequences for suffering and agency – does the "noble sacrifice" narrative *actually* reduce suffering or increase agency for the exploited? But this risks circularity if the assessment of suffering/agency is itself vocabulary-dependent.

  **Reconstruction and Conclusion: Coherence through Radical Immanence**

  Weighing these arguments, the path to a coherent reconstruction lies in embracing the *radical immanence* of Rorty’s pragmatism while acknowledging its contingent grounding. Rorty *can* provide a non-circular, nonrepresentationalist account of moral progress, but it requires accepting several key points:

  1.  **Suffering as the (Contingent) Anchor:** The aversion to pain and humiliation is not a timeless truth, but a near-universal, biologically and culturally shaped human constant *within the historical contexts Rorty addresses*. It provides the pragmatic, non-metaphysical anchor. Appeals to reduced suffering are not smuggling representationalism; they are appeals to a *shared human interest* embedded in our form of life, which serves as the ultimate pragmatic criterion.
  2.  **Progress as Comparative and Historical:** Moral progress is not progress *towards* an ideal, but progress *away from* specific, identifiable cruelties made visible by new descriptions. Justification is retrospective and comparative: "Does this vocabulary, compared to its predecessor, lead to practices that cause less suffering for more people, foster greater inclusion in the conversation, and allow more individuals to shape their lives?" There is no guarantee against backsliding or the rise of new harms, but this comparative assessment avoids needing an external standard.
  3.  **Normative Force as Persuasive Consequence:** The normative force of redescription isn't logical deduction from first principles; it's the *persuasive power* of making consequences vivid and appealing to hopes for a less painful world. It works by triggering empathy, highlighting hypocrisy, and offering a vision of expanded solidarity that *feels* better and *works* better in satisfying widespread human desires. The force is real and transformative, even if contingent.
  4.  **The Limits of Radical Alterity:** Rorty’s framework may indeed be most powerful for immanent critique within traditions sharing some minimal liberal or humanistic leanings, or where suffering is already partially acknowledged. Confronting radically alien moralities indifferent to certain forms of suffering may require tools beyond pure redescription (e.g., coercion, which Rorty acknowledges as sometimes necessary but not philosophically justified by foundational truths). This is a limitation, not necessarily a fatal incoherence.

  Therefore, while the objection highlights the precariousness of the pragmatist tightrope, Rorty’s view **can be coherently reconstructed**. The account of moral progress is non-circular because the justification for the new vocabulary is not derived from the old one's standards, but from its demonstrable *practical consequences* in alleviating suffering and expanding agency – consequences judged by appealing to experiences (pain, humiliation, the desire for self-creation) that are sufficiently constant across human contexts to serve as a pragmatic foundation, even while being historically contingent. The normative force stems not from flattery, but from the persuasive power of redescriptions that successfully connect existing human sensitivities to previously obscured harms. This reconstruction accepts that progress is contingent, fallible, and lacks transcendental guarantees, but argues that this is the only kind of progress available, and that Rorty’s emphasis on redescription, solidarity, and reducing cruelty provides the best available vocabulary for understanding and pursuing it without representationalist illusions. We need not abandon antirepresentationalism; we must instead fully embrace its radical, consequence-oriented, and human-centered implications.
