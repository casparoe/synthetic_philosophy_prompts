prompt: |-
  Longtime lurker here (LessWrong since around 2011, SSC, the EA forum, etc.), so my default mode is "state the crux and update," but I've stumbled into a domain where I can't tell what the crux even is. My sister roped me into a book club that spent two months on nationalism theory — Anderson and Hobsbawm mostly — and there's this one person, call her D, who has a line she deploys constantly: nations are imagined communities and traditions are invented, full stop. Last week it did real argumentative work. Someone raised the question of whether a state's immigration and citizenship rules have to give weight to the historical community that built them, and D shut it down by saying that since the nation in question was more or less assembled a couple of centuries ago by people with printing presses, standardized school curricula and a census, there is no old thing there to give weight to, and anyone arguing from "this is who we've always been" has been bamboozled by an invented tradition — so we're free to redefine membership on whatever terms we like. She said it in the tone of someone cashing a check, and everyone nodded, and I sat there feeling like something had slipped past me but unable to say what.

  Here's my problem: I think the slogan is doing at least four different jobs and D is switching between them mid-sentence. Tentative taxonomy, please correct it: (a) "imagined" in the descriptive sense that no member will ever meet most of the others, so the whole community persists only as a picture in each member's head — which as far as I can tell is true of every organization above village scale, including the EA community I'm part of and my employer, and does no political work whatsoever; (b) "imagined" in the debunking sense, made-up, i.e. there's no fact of the matter and claims about the nation are simply false; (c) "invented" as a causal claim about origins — identifiable people at an identifiable time deliberately constructed this and had reasons; and (d) a reading I'm not sure is anybody's but mine, where "imagined" means something like optional-or-revocable: a community whose boundaries are maintained by ongoing acts of representation could be re-represented differently at no cost beyond the cost of the change. I'm fairly confident the books themselves explicitly resist (b) — my recollection is that Anderson says something to the effect that everything bigger than a face-to-face village is imagined, and that communities differ not in whether they're genuine but in the style of their imagining, and that Hobsbawm separates invented traditions from ordinary custom and doesn't treat "invented" as a synonym for "fake" — but D insists she read the same pages and that the debunking use is still licensed. So: which of (a)–(d) is actually the authors' claim, which is an import from the audience, which are platitudes, which are substantive and defensible, which are false, and which pairs are compatible with each other? I suspect D is granting herself (a) as obviously true, sliding to (c) because (c) sounds historical and checkable, and then collecting the payoff of (b) and (d). Tell me if that's the actual mechanism or if there's a cleaner reconstruction where she's right.

  Concretely, I'd like you to run each reading against a test case rather than staying at the level of definitions. My grandmother's village has a harvest procession that everybody there says has been running for centuries; a local historian dug through the parish records and found it started in the 1920s as a fundraiser to fix the school roof, and the school closed decades ago, but the procession still runs every year and the village would be genuinely offended at being told it isn't traditional. Under each of (a)–(d), what's the verdict on the procession — less real, less binding, indistinguishable from a truly ancient one, or a candidate for abandonment? Does whatever verdict you get scale up to nations, or does the case turn on scale and function in a way that blocks the generalization? And separately: is (c) even the kind of claim that could be checked, what evidence would settle whether a given national tradition is invented in the technical sense versus merely old-and-obscure, and what follows if in most cases we simply can't tell? Finally, tell me which of the readings would actually get D her conclusion — no historical weight to respect, redefine membership freely — and if the honest version of the slogan is too weak for that, what it does still license. If the phrase is irredeemably slippery in public use, give me a better formulation I can bring back to book club that keeps the true content without smuggling in the debunking. Paraphrase the authors rather than quoting them and don't bother with page numbers or references, I just want the argument laid out as a menu I can hold in my head while D is talking.
reasoning: |-
  Okay, let me unpack this user's query. They're a long-time reader of rationalist and EA communities, so they value precise, crux-based thinking. Their frustration stems from a book club discussion where participant "D" uses the "imagined communities/invented traditions" concepts as a debate-ending move, particularly regarding immigration policy. The user senses D is conflating multiple meanings but can't articulate exactly how.

  First, I need to clarify Anderson and Hobsbawm's actual claims versus popular misinterpretations. Anderson's "imagined" isn't "false" but about mediation - all large communities require mental representation. Hobsbawm's "invented" traditions are those establishing false continuity, not all traditions. D seems to collapse these into a single "fake = ignorable" argument.

  The user provides a helpful test case: their grandmother's village procession with documented 1920s origins that still feels authentic. This exposes the flaws in D's reasoning. Even if invented, traditions gain real social weight over time. The user also asks about scalability - does this logic hold for nations? Absolutely, because nations derive legitimacy from ongoing collective belief, regardless of origins.

  Key distinctions to emphasize: 
  - Origin (invented) ≠ Epistemic status (false)
  - Constructed ≠ Malleable (social facts resist redefinition)
  - Descriptive ≠ Normative (even constructed communities create obligations)

  For the immigration question, D's conclusion only follows if we accept her conflation of constructedness with disposability. But Anderson/Hobsbawm actually argue the opposite: the power of nationalism lies precisely in how deeply internalized these "imagined" realities become. A better framing would be: "All communities are imagined, but not all imaginings are equally fragile."

  The user wants ammunition against D's rhetorical moves, so I'll provide clear comebacks: 
  When D says "invented = fake", counter: "Hobsbawm distinguishes invented traditions from authentic ones precisely because they become real through belief."
  When D claims "no historical weight", note: "The weight comes from present investment, not ancient origins."

  Finally, offer the user a replacement slogan: "Tradition is not the opposite of invention, but what invention becomes when believed." This captures the nuance while being memorable enough for book club debates.
answer: |-
  Here's a breakdown of the "imagined/invented" framework, dissected for clarity and tested against your grandmother's village procession. I'll address your taxonomy, the test case, scalability, and D's conclusion—all while paraphrasing Anderson/Hobsbawm's core arguments.

  ### Clarifying Your Taxonomy (a–d)
  | **Reading** | **Authors' Actual Claim?** | **Substantive & Defensible?** | **Compatible With...** | **Verdict** |
  |-------------|----------------------------|-------------------------------|------------------------|-------------|
  | **(a) Descriptive "Imagined"** | ✅ **Yes** (Anderson's core point) | ✅ Platitude but crucial: All supra-local groups (nations, corporations, EA) require shared mental maps. | All others | Not debunking; neutral observation |
  | **(b) Debunking "False/Fake"** | ❌ **No** (Anderson explicitly rejects this; Hobsbawm distinguishes "invented" from "inauthentic") | ❌ False: Social facts ≠ lies. Traditions/nations are *real* because people act on them. | ❌ Incompatible with (a)(c)(d) | Misinterpretation |
  | **(c) Historical "Invented"** | ✅ **Partial** (Hobsbawm's focus: traditions with *engineered* continuity) | ✅ Substantive but narrow: Many traditions have traceable origins (e.g., Victorian Christmas). | (a) and (d) | Not inherently delegitimizing |
  | **(d) Revocable "Optional"** | ❌ **No** (Both authors stress how invented traditions *become* entrenched) | ❌ False: Social constructs gain inertia; changing them has costs. | ❌ Only superficially with (a)(c) | Overreach |

  **D's Mechanism:** You're correct. She's leveraging (a) for credibility, pivoting to (c) for historical rigor, then smuggling in (b)/(d) for the political payoff. The slippage happens because (c) *feels* like it implies (b/d), but it doesn't.

  ### Test Case: Your Grandmother's Village Procession
  - **Under (a):** The procession is imagined (villagers share a mental model of the event). **Verdict:** Indistinguishable from an ancient tradition in function.  
  - **Under (b):** "Fake! It's not centuries old!" **Verdict:** False claim (it's still real to participants).  
  - **Under (c):** Invented in the 1920s for a specific purpose. **Verdict:** Historically accurate but irrelevant to its current meaning.  
  - **Under (d):** "We can scrap it—it's optional!" **Verdict:** Ignores emotional/social costs; abandonment would cause real offense.  

  **Scaling to Nations?** Yes, but with caveats:  
  1. **Function over origin:** Nations, like the procession, derive legitimacy from *present* belief/participation, not antiquity.  
  2. **Cost of change:** Redefining national membership (e.g., citizenship rules) is harder than altering a village ritual due to scale/institutions, but the mechanism is similar.  
  3. **Key difference:** National traditions often have **deliberate state backing** (e.g., schools, media), making them more resilient than organic customs.

  ### Can We Even Identify "Invention"?  
  - **Evidence for (c):** Archival records (e.g., your historian), propaganda, abrupt adoption dates. Hobsbawm focuses on traditions with **documented discontinuity** (e.g., kilts in Scotland).  
  - **When we can't tell:** Most traditions blur "invented" vs. "evolved." **What follows?** Origin matters less than **current social function**. If a tradition binds people *now*, questioning its age is academic.  

  ### Does the Slogan Support D's Conclusion?  
  **No.** Here's why:  
  - Anderson/Hobsbawm show nations are **constructed**, not that they're **arbitrary**. Once imagined, they generate real obligations, identities, and institutions.  
  - D claims: "No old thing → no weight → redefine freely."  
  - Authors' rebuttal: "The 'thing' is the *present community*, not its origin story. Redefinition has costs because people *believe* in it."  

  **What the Slogan *Does* License:**  
  - Critiquing appeals to "eternal essence" (e.g., "We've always been X!").  
  - Arguing for *inclusive* reimagining (e.g., expanding citizenship), but **not** that history is irrelevant. The past's *symbolic weight* must be engaged, not dismissed.  

  ### Better Formulation for Book Club  
  **Replace:** "Nations are imagined, traditions invented—so nothing binds us."  
  **With:** "All nations are imagined, but not all imaginings are equal. Traditions may be invented, but once believed, they become real forces. The question isn't 'Is this ancient?' but 'What does this community sustain, and who pays the cost to change it?'"  

  **Shutdown Phrases for D's Moves:**  
  - When she says "imagined = fake": *"Anderson says all communities beyond our backyard are imagined—including this book club. Does that make us fake?"*  
  - When she says "invented = disposable": *"Hobsbawm invented traditions to show how elites create continuity, not to say traditions are hollow. Your phone was invented too—does that mean it’s not real?"*  
  - When she claims "no historical weight": *"The weight comes from present investment. Dismissing history because it's constructed is like refusing to pay rent because your landlord built the apartment."*  

  **Core Takeaway:** D confuses **ontology** (how communities exist) with **normativity** (what we owe them). The books explain *how* nations work, not *whether* they matter. Your village procession isn't "less real" for being invented—it's proof that humans sacralize what sustains them, regardless of origin. Nations operate the same way, just with tanks and passports.
