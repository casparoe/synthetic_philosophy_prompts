answer: |-
  You've hit on a crucial and philosophically rich tension at the heart of evolutionary biology. Let's dissect this carefully, separating settled insights from ongoing debates:

  **Your Core Concern: "If spandrels aren't selected, aren't they just accidents outside evolutionary theory?"**

  Gould and Lewontin's argument **does not** imply spandrels are "just accidents" beyond evolutionary explanation. Here's the nuanced breakdown:

  1.  **Spandrels ARE Products of Evolution:** They are direct consequences of how organisms *develop* and are *built*. Development and structure themselves evolved under natural selection for other functions. The chin (a classic spandrel example) exists because human jawbones evolved a specific shape under selection for chewing/speech/etc., and the protruding lower edge of the mandible is a developmental consequence of that shape. Its *existence* is evolutionarily explained by the selection acting on the jaw structure itself.
  2.  **Evolutionary Theory is Broader than *Just* Natural Selection:** The Modern Synthesis (and its extended versions) explicitly incorporates multiple mechanisms:
      *   **Natural Selection:** Adaptations.
      *   **Genetic Drift:** Random changes in allele frequencies, especially in small populations.
      *   **Mutation:** Introduces variation, often non-adaptive or deleterious initially.
      *   **Gene Flow:** Migration of alleles between populations.
      *   **Developmental & Phylogenetic Constraints:** Historical and structural limitations on what forms can evolve (the source of spandrels).
      *   **Pleiotropy & Linkage:** Genes affecting multiple traits; traits linked genetically.
  3.  **Spandrels as Evolutionary *Byproducts*:** Spandrels are *emergent consequences* of the evolutionary process acting on other traits or developmental systems. They are:
      *   Not *directly* selected *for* in their initial form.
      *   Often neutral or nearly neutral in their initial state.
      *   A product of the *existing evolved architecture* of the organism.
  4.  **Exaptation: The Evolutionary "Second Life" of Spandrels:** Crucially, Gould and Lewontin emphasized that spandrels often *later* become subject to natural selection. A structure arising as a byproduct can be co-opted for a new, beneficial function. Feathers evolving for insulation/display and later being co-opted for flight is a famous example (though debated on specifics). This *co-option* is a key evolutionary process. The spandrel *itself* wasn't an adaptation initially, but its *utilization* for a new function *is* adaptive evolution via selection.

  **What Gould & Lewontin *Were* Arguing Against (The Main Critique):**

  *   **Pan-Adaptationism / The "Adaptationist Programme":** The tendency to assume *every* noticeable trait must be an *adaptation* honed by natural selection for its current function, often constructing "just-so stories" without rigorous testing of alternatives (like developmental constraint, pleiotropy, or historical legacy).
  *   **Ignoring Constraints:** Failing to consider how the existing "Bauplan" (body plan), developmental pathways, and phylogenetic history *constrain* and *channel* what evolution can produce, making some forms more likely than others regardless of optimal adaptation.
  *   **Atomization:** Breaking organisms down into discrete "traits" and seeking an adaptive explanation for each, rather than seeing the organism as an integrated whole where changes in one part inevitably affect others.

  **Settled Consensus Among Biologists & Philosophers (Where Agreement is High):**

  1.  **Not All Traits Are Adaptations:** It is universally accepted that Gould and Lewontin were fundamentally correct on this core point. Traits can arise and persist due to genetic drift, developmental constraints, phylogenetic inertia, linkage, pleiotropy, and as spandrels. The question is *how much* of biology falls into each category, not *if* non-adaptive explanations exist.
  2.  **Constraints are Real and Important:** Developmental, genetic, and physical constraints are integral to understanding evolutionary patterns and possibilities. They shape the "morphospace" organisms can occupy.
  3.  **Rigorous Testing is Essential:** Adaptive hypotheses require rigorous testing against null models (like drift) and alternative explanations (like constraint). "Just-so stories" are poor science. Methods for detecting selection signatures (e.g., population genetics tests, comparative methods) are crucial.
  4.  **Evolutionary Theory Encompasses Non-Adaptive Processes:** The Modern Synthesis framework explicitly includes drift, mutation, etc. Evo-Devo (Evolutionary Developmental Biology) has further integrated developmental constraints and the generation of variation as central components of evolutionary theory. *Spandrels are explained **within** evolutionary theory, not outside it.*
  5.  **The Spandrels Metaphor is Useful:** The concept effectively highlights how structures arising non-adaptively can subsequently shape evolutionary possibilities and be co-opted.

  **Live Disputes & Ongoing Debates (Where Opinions Differ):**

  1.  **The *Prevalence* of Spandrels vs. Adaptations:** This is the biggest ongoing debate. How much of complex organismal structure is:
      *   Directly shaped by adaptation?
      *   A spandrel initially?
      *   A spandrel co-opted later (exaptation)?
      *   Just neutral?
      There is no simple answer; it varies wildly across traits and taxa. Some biologists lean towards adaptation explaining most complex functional traits; others (often inspired by Evo-Devo) argue constraints and byproducts play a much larger role than traditionally recognized.
  2.  **Operationalizing and Testing for Spandrels/Exaptation:** How do we reliably *distinguish* a true spandrel (or exaptation) from a direct adaptation in practice? This is methodologically challenging, especially for deep evolutionary history. What constitutes sufficient evidence?
  3.  **The "Granularity" Problem:** At what level do we define a "trait"? Is the chin a distinct trait or just part of the mandible? This ambiguity affects how we categorize it.
  4.  **The Role of Neutral Evolution:** How extensive is the role of genetic drift and neutral processes in shaping morphology and complexity, beyond just molecular changes? The Neutral Theory's influence extends into these debates.
  5.  **Philosophical Debates (Ongoing in Philosophy of Biology):**
      *   **Ontology:** What are the fundamental "units" or "processes" of evolution? Are "constraints" and "spandrels" fundamental causal factors, or just descriptions of outcomes?
      *   **Causation:** Does the concept of spandrels/exaptation introduce a problematic directionality or "intentionality" (e.g., "available for later use")?
      *   **Explanatory Priority:** Should evolutionary explanation *start* with adaptation as the null hypothesis (testing against alternatives) or with the generation of variation/constraints? This reflects deeper philosophical differences about causality in biology.
      *   **The Scope of "Selection":** Does selection act *only* on genes/populations, or can it act on developmental systems or higher-level structures in a way that incorporates constraints?

  **Key Figures & Perspectives (For Context):**

  *   **Supportive/Developed the View:** Gould, Lewontin, Stuart Kauffman (complexity/constraints), Günter Wagner (Evo-Devo, homology), Sean B. Carroll (Evo-Devo), many in the Extended Evolutionary Synthesis movement.
  *   **Strong Adaptationist Emphasis:** Richard Dawkins, John Maynard Smith, George C. Williams, Ernst Mayr (though all accepted constraints in principle, they emphasized the power and prevalence of selection).
  *   **Integrative/Pluralist Views (Consensus Mainstream):** Douglas Futuyma, many working evolutionary biologists who employ multiple tools (genomics, Evo-Devo, phylogenetics) and accept a role for both adaptation and constraint based on evidence.

  **Conclusion for Your Piece:**

  *   **YES:** Gould and Lewontin successfully argued that not every trait is an adaptation. Non-adaptive explanations (including spandrels) are essential and valid parts of evolutionary biology.
  *   **NO:** This does **not** mean spandrels are "just accidents" outside evolutionary explanation. They are explained as *byproducts* of the evolutionary process (acting on development/structure) and are subject to later evolutionary processes (like exaptation). Evolutionary theory *encompasses* these phenomena.
  *   **The BIG Concession (Consensus):** Biologists widely accept that the "adaptationist programme" as a *methodological default* is flawed. Assuming every trait is an adaptation without testing alternatives is bad science.
  *   **The Live Debate:** The **extent** to which complex biological features, especially morphological ones, are primarily direct adaptations, co-opted spandrels (exaptations), or neutral byproducts remains hotly contested and is a major driver of research in Evo-Devo, comparative biology, and paleontology. The debate is about *prevalence* and *methodology*, not the fundamental validity of non-adaptive explanations.

  Focus on the shift away from pan-adaptationism towards methodological pluralism and the importance of developmental constraints as the settled legacy, while highlighting the ongoing research into quantifying the relative roles of adaptation, constraint, and exaptation in shaping organismal form as the active frontier.
