  First, I need to unpack "evidence." The narrow reading (only first-order) ignores the messiness of real cognition—like dismissing a fever as irrelevant to evaluating evidence. The broad reading (includes higher-order) seems right but risks regress: "What if I doubt my ability to assess higher-order evidence?" Then there’s total evidence, which sounds holistic but doesn’t specify *how* to weigh conflicting layers. 

  Next, "follow" is treacherous. Is it about belief proportions (like credences) or binary attitudes? And does it mean adopting what the evidence *actually* supports (objectively) or what you *think* it supports (subjectively)? The latter collapses into "follow your best judgment," which is circular. 

  For akrasia: Narrow evidence permits it (you might correctly doubt your first-order reasoning). Total evidence forbids it if properly followed—but only if "follow" means aligning with the objective support. The subjective reading paradoxically *requires* akrasia if your higher-order evidence suggests you’re unreliable. 

