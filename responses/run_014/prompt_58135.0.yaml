answer: |-
  ### Practice Essay Question (45 minutes)

  **Invented Case:**  
  Durham College Art Club sculpts 'Midnight', a life-size clay horse, from a single homogenous batch of clay (Lump Alpha). Over ten years, weathering damages fragments of the statue. These fragments are removed bit by bit and stored in a sealed jar. Fresh clay replaces them, preserving Midnight's shape. Eventually, *no* original clay remains in the horse-shaped structure. The club then compresses all fragments in the jar into a plain, dense block (Block Beta).

  **Question:**  
  Explain how a proponent of coincident objects would use Leibniz's Law and the property of 'survival under squashing' to argue that Lump Alpha and the original statue, Midnight, must be distinct entities at the time of creation. Evaluate the monist reply that modal properties and persistence conditions are relative to the sortal concept under which an object is considered. Finally, for both the coincident objects view and monism (specifically, dominant sortal monism), identify which claimant – the present horse-shaped structure (Horse-Shaped) or Block Beta – is best identified as (i) the original statue (Midnight) and (ii) the original lump (Lump Alpha). Justify your answers with reference to the case.

  ---

  ### Model Answer (Approx. 500 words)

  **Leibniz's Law Argument:**  
  The coincident objects theorist argues that Lump Alpha and Midnight, though spatially coincident at creation, are distinct because they possess different *modal properties*. Crucially, Lump Alpha could survive being abruptly squashed into a ball, whilst Midnight could not – squashing destroys the statue. Leibniz's Law states that if two entities share all properties, they are identical. Possessing different modal properties (like survival-under-squashing) means they cannot be identical. Thus, distinct entities coincide at t1: the lump (Lump Alpha) and the statue (Midnight).

  **Evaluating the Monist Reply:**  
  Monism (e.g., dominant sortal monism) rejects coincident entities. It counters that properties like survival-under-squashing are not absolute but *sortal-relative*. An object’s persistence conditions and modal properties depend on the sortal concept (e.g., 'lump of clay' vs. 'statue') under which it is primarily considered. Under the sortal 'lump of clay', the object persists through shape changes like squashing. Under 'statue', it persists only if it retains its distinctive form and artistic identity. Monism claims there is only one object present at t1, described under different sortals, explaining the differing modal predicates without ontological multiplication.

  However, this reply faces challenges in the Durham case. The monist must choose a *dominant* sortal for the original entity. If ‘statue’ is dominant, the object’s persistence is tied to its form and function. Crucially, after ten years, *none* of the original clay remains in Horse-Shaped. If persistence requires spatio-temporal continuity under the dominant sortal, and ‘statue’ requires continuity of form (but not necessarily matter), Horse-Shaped might be deemed Midnight. Conversely, Block Beta, whilst made of the original matter, lacks Midnight’s form and function. Yet, this seems to sever the statue’s link to its original matter entirely. If ‘lump’ is dominant, Block Beta (reassembled original matter) might be Lump Alpha, but Horse-Shaped, despite its form, is then merely arranged matter, *not* the original statue – a counterintuitive result for an artwork. The monist struggles to explain how Block Beta, assembled *after* the lump ceased coinciding with the statue, could be Lump Alpha if ‘statue’ was ever the dominant sortal governing that matter.

  **Identifying the Claimants:**

  1.  **Coincident Objects View:**
      *   **(i) Original Statue (Midnight):** *Horse-Shaped*. The statue is a distinct artefact whose persistence depends on maintaining its distinctive form and function as 'Midnight'. Gradual replacement preserves this identity; the statue survives as Horse-Shaped. Block Beta is merely compressed matter, not an artefact with the statue's identity.
      *   **(ii) Original Lump (Lump Alpha):** *Block Beta*. The lump is a distinct material object whose persistence depends on the continuity of its matter. Reassembling *all* the original matter into Block Beta constitutes the survival of Lump Alpha, despite the temporal gap and change in shape. Horse-Shaped contains none of its matter.

  2.  **Dominant Sortal Monism:**
      *   The monist must choose one dominant sortal for the original entity. The more plausible choice here is **'statue'**:
          *   **(i) Original Statue (Midnight):** *Horse-Shaped*. Persistence under the 'statue' sortal requires continuity of form and function, not matter. Gradual replacement preserves this.
          *   **(ii) Original Lump (Lump Alpha):** *Neither*, or perhaps *Block Beta (problematically)*. If 'statue' is dominant from creation, Lump Alpha ceases to be the primary entity. The lump-matter only existed *as* the statue. Block Beta is a *new* lump made from the original matter, but not identical to Lump Alpha, which was constitutively tied to the statue entity. Monism struggles to affirm Block Beta *is* Lump Alpha without violating the primacy of the statue sortal or persistence conditions.

  ---

  ### Marking Scheme (Total: 20 Marks)

  *   **Explanation of Leibniz's Law Argument (Survival under Squashing) (5 marks):**
      *   5-4: Clear, accurate explanation using modal property difference (survival-under-squashing) to argue for distinctness via LL. Explicit link to case (Lump Alpha survives squashing, Midnight does not).
      *   3: Sound explanation but lacks specificity to case or slightly muddled LL application.
      *   2-1: Partial, confused, or significantly inaccurate explanation of the argument.
      *   0: No relevant explanation.

  *   **Evaluation of Monist Reply (Sortal-Sensitivity) (7 marks):**
      *   7-6: **First-Class:** Clear explanation of monist reply (modal/sortal relativity). **Crucially, develops a strong challenge specific to the case:** Highlights the dilemma of choosing a dominant sortal and the resulting problems identifying claimants (esp. Lump Alpha/Block Beta link and the severing of matter link for the statue, or denying Horse-Shaped is Midnight). Explicitly addresses the temporal gap/reassembly issue for the lump.
      *   5-4: **Upper-Second:** Good explanation of monist reply and identifies *a* challenge (e.g., matter replacement for statue persistence). May mention sortal choice but lacks **depth in applying it to the specific claimants or fully grappling with Block Beta's status and the temporal gap.** Evaluation might be generic.
      *   3: Fair explanation of reply but weak, superficial, or inaccurate evaluation.
      *   2-1: Poor explanation and/or evaluation.
      *   0: No relevant evaluation.

  *   **Identification of Claimants for Coincident Objects View (4 marks):**
      *   4: Clear, correct identification (Horse-Shaped = Midnight; Block Beta = Lump Alpha) with accurate justification based on distinct persistence conditions (form/function vs. matter continuity).
      *   3: Correct identification but justification slightly weak or incomplete.
      *   2: Partially correct identification (e.g., one correct) or justification significantly flawed.
      *   1-0: Incorrect identification or no justification.

  *   **Identification of Claimants for Monism (Dominant Sortal) (4 marks):**
      *   4: Clear identification that Horse-Shaped is Midnight (assuming 'statue' dominant). **Crucially, recognises the problematic status of Lump Alpha/Block Beta (likely denying Block Beta *is* Lump Alpha or acknowledging the difficulty),** justifying based on dominant sortal and its persistence conditions.
      *   3: Correctly identifies Horse-Shaped as Midnight. **May assert Block Beta is Lump Alpha but without adequately addressing the tension with the dominant 'statue' sortal or the temporal gap (Upper-Second may stop here).** Justification present but may lack nuance on lump.
      *   2: Identifies Horse-Shaped as Midnight but provides poor justification. Fails to adequately address Block Beta/Lump Alpha.
      *   1-0: Incorrect identifications or no justification.

  **What Separates First-Class from Upper-Second Answers:**
  *   **Leibniz's Law:** Both will explain it well.
  *   **Evaluation of Monism:** **First-Class** answers will **forcefully apply the challenge** by exposing the specific dilemma for monism in *this case*: the conflict between identifying Block Beta as Lump Alpha and the implications of choosing 'statue' as dominant (including the temporal gap), or vice versa, demonstrating why sortal-sensitivity doesn't neatly resolve the scenario. **Upper-Second** answers will explain the monist reply and identify *a* problem (like matter replacement) but may not delve deeply into **the specific problems posed by Block Beta's reassembly from original matter *after* the constitution relationship ended and the implications for Lump Alpha's identity under monism.**
  *   **Claimants (Monism):** **First-Class** answers will explicitly **acknowledge and grapple with the difficulty monism has in affirming Block Beta as the original Lump Alpha** if 'statue' is dominant, likely concluding it cannot be identical or highlighting the paradox. **Upper-Second** answers might correctly state Horse-Shaped is Midnight but **treat Block Beta being Lump Alpha as unproblematic for monism, or fail to fully address the issue.**
