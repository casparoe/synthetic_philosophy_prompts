  Hume's use of "inconceivable" is key. In his time, that word meant something stronger than today—closer to "logically impossible." So he's likely making a metaphysical claim, not just pointing out a gap in reasoning. He argues that "ought" introduces a new relation that can't be deduced from "is" statements because they belong to different categories. 

  The user might be conflating two aspects: the logical impossibility versus the failure to explain. I should clarify that Hume is doing both. He's saying authors don't explain the leap because they can't—it's not logically possible. That's why a small attention to this flaw would subvert those systems; their foundations are invalid.

