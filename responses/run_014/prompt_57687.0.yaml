prompt: |-
  For eight years I taught constitutional theory to law students, and secession was a chapter I could deliver largely from memory. Four months ago it stopped being a chapter. I have been seconded to the joint technical committee that our regional government and the national government established after last spring's consultative vote, and we are drafting the financial and citizenship terms of a possible independence.

  Our side's lead negotiator has a rhetorical habit that has become load-bearing. In nearly every session he frames secession as divorce, and specifically as no-fault divorce of the kind our own family law has permitted for decades. Three conclusions are drawn from that framing each time: that a polity cannot be compelled to remain in a union it no longer wants, so the national parliament's consent is legally unnecessary; that the departing party nevertheless owes an equitable division of jointly acquired assets and jointly incurred debt, which is how he defends the proposed severance schedule; and that the settlement should aim at a clean break ending fiscal dependency in both directions, which he uses to resist any open-ended transfer mechanism.

  I have begun to suspect that the analogy is carrying more weight than it can bear, and that some of what it licenses is being smuggled in rather than argued for. I would like a careful audit of it.

  Please set out the mapping explicitly: what in the divorce case plays the role of the two spouses, the marriage itself, the matrimonial property, the children, the court that holds jurisdiction over both parties, and the clean-break order. Then identify where the mapping fails, separating the failures that genuinely threaten his three conclusions from the ones that are merely inelegant. Two places interest me particularly. First, in a divorce each party leaves as an already competent adult; nothing in the analogy seems able to capture that a new state may or may not acquire the administrative and fiscal capacity to function, and I want to know whether that gap defeats the clean-break premise or only constrains it. Second, in a divorce neither ex-spouse retains membership rights in the other's household, yet our draft protocol contemplates precisely that: a portable status for residents of the region who voted against independence, allowing them to hold the national citizenship and the pension entitlements attached to it while living under the new state's law. Tell me whether the divorce frame has any resources for representing this, or whether it is simply invisible from inside the analogy, and what that implies about using the analogy to structure citizenship questions at all.

  Finally, assess whether the three conclusions survive once the disanalogies are on the table, and if they do not, whether a better source domain exists. I have privately been toying with two: the corporate demerger, in which dissenting shareholders receive an appraisal right and the entity is reorganized rather than dissolved, and the housing cooperative, in which a member may withdraw but does not take the building along. Say which, if either, would carry his conclusions better, and specify what adopting each would force him to surrender.

  Do not trouble yourself with citations or with surveying the literature; I know it and will supply the references. What I need is the conceptual audit.
reasoning: |-
  Hmm, this user presents a sophisticated constitutional theory challenge. They're clearly an experienced academic turned negotiator, wrestling with the limitations of a dominant analogy in high-stakes independence talks. The divorce framing has become "load-bearing" for three key legal conclusions, but they suspect it's doing covert rhetorical work.

  First, I need to systematically unpack the analogy mapping as requested:
  - Spouses = regional and national governments (but this already feels unstable since governments aren't unitary actors like individuals)
  - Marriage = constitutional union (problematic because unions are multigenerational constructs)
  - Matrimonial property = joint assets/debts (this holds fairly well for physical infrastructure)
  - Children = citizens (this is where the analogy gets ethically dangerous)
  - Court = ? (glaring omission - there's no equivalent sovereign authority)
  - Clean break = cessation of fiscal transfers (ignores embedded interdependence)

  The two specified pressure points are particularly acute. That newborn state capacity issue isn't just an inelegance - it fundamentally undermines the clean-break premise when hospitals might literally run out of medicines post-secession. And the portable citizenship demand? The divorce frame actively opposes this, treating citizens as property to be divided rather than bearers of inherent rights.

  When testing the three conclusions against these cracks:
  1. "No consent needed" collapses entirely - constitutions aren't marriages, and unilateral divorce has no equivalent in most federal systems
  2. Asset division holds up reasonably well (the analogy's strongest point)
  3. Clean break becomes ethically dubious when basic state functions are at risk

  Their alternative analogies are telling. Corporate demerger introduces useful concepts like appraisal rights and continuity of operations, but still imagines citizens as shareholders. Housing co-ops better capture limited property rights, yet struggle with citizenship's existential dimensions. Ultimately both alternatives force surrender of the negotiator's most convenient fictions - especially the illusion of tidy separation.

  What this expert really needs isn't just critique but negotiable alternatives. The co-op model's "withdrawal without bricks" approach could salvage asset division while accommodating shared citizenship. But they'll have to abandon the rhetorically convenient but false equivalence of citizens to children - which is probably why their negotiator clings to divorce framing. The emotional resonance masks constitutional hard truths.
answer: |-
  Below is a structured audit of the divorce analogy as applied to secession, addressing your specified concerns and evaluating its viability for the negotiation framework. The analysis proceeds as requested: explicit mapping, critical disanalogies (with emphasis on state capacity and citizenship portability), survival of the three conclusions, and alternatives.

  ### **Explicit Mapping of the Divorce Analogy**
  | **Divorce Element**       | **Secession Equivalent**                               | **Purpose in Negotiation**                                                                 |
  |---------------------------|--------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | **Two spouses**           | Regional government (departing) and national government | Casts both as autonomous, consenting parties with equal agency.                            |
  | **Marriage**              | Constitutional union                                   | Framed as a voluntary, dissolvable contract.                                               |
  | **Matrimonial property**  | Joint assets/debts (infrastructure, pensions, sovereign debt) | Justifies equitable division of shared resources/obligations.                             |
  | **Children**              | *Citizens* (problematic, see below)                    | Implies "custody" must be resolved (e.g., citizenship allocation).                         |
  | **Court/jurisdiction**    | *Absent* (no supranational arbiter)                    | **Critical gap:** No neutral enforcer; parties must self-resolve or rely on political will. |
  | **Clean-break order**     | Cessation of fiscal transfers/shared institutions      | Demands finality and mutual independence.                                                  |

  ---

  ### **Critical Disanalogies & Their Impact**
  #### **1. Failure: Asymmetric State Capacity vs. Adult Autonomy**
  - **Disanalogy:** In divorce, both spouses are presumed competent adults capable of autonomy post-split. In secession, the new state may lack fiscal/administrative capacity (e.g., tax infrastructure, central bank, border controls).  
  - **Threat to Conclusions:**  
    - **Undermines the clean-break premise:** A new state’s incapacity risks *de facto* dependency (e.g., requiring transitional fiscal support or shared institutions). The analogy cannot defend abrupt separation if collapse harms both parties (e.g., refugee flows, economic contagion).  
    - **Does not defeat asset/debt division** – but constrains it by necessitating phased implementation or capacity-building.  
  - **Severity:** **High** – Directly challenges the negotiator’s third conclusion (no open-ended transfers).

  #### **2. Failure: Citizenship Portability vs. Household Exclusion**
  - **Disanalogy:** Divorce terminates mutual household rights; ex-spouses cannot claim membership in each other’s new families. Your protocol’s "portable citizenship" (retaining national rights while residing in the new state) has no analog.  
  - **Threat to Conclusions:**  
    - **Invisible to the analogy:** Divorce treats citizenship as a binary "custody" issue (e.g., children "belong" to one household). Portable dual status is alien to this frame.  
    - **Implication:** Using divorce to structure citizenship forces a zero-sum choice (regional vs. national allegiance). It cannot legitimize overlapping identities or entitlements.  
  - **Severity:** **High** – The analogy actively obstructs flexible citizenship models, making the negotiator’s position incoherent here.

  #### **Less Critical (Inelegant) Disanalogies**
  - **"Children" as Citizens:** Reduces citizens to dependents, ignoring their agency and rights.  
  - **No Central Arbiter:** Unlike divorce courts, no authority binds both parties post-secession.  
  - **Marriage’s Voluntarism:** Unions are rarely purely voluntary (e.g., conquest, historical path-dependence).  

  ---

  ### **Survival of the Three Conclusions**
  1. **"No consent needed" (Unilateral right to exit):**  
     - **Collapses.** Divorce law operates within a sovereign legal system; secession lacks this. Constitutions often require supermajorities or federal consent (e.g., *Clarity Act* in Canada). The analogy smuggles in unilateralism.  
  2. **"Equitable division of assets/debts":**  
     - **Survives (partially).** The core principle holds, but divorce’s "jointly acquired" standard ignores asymmetrical contributions (e.g., national defense subsidized by all).  
  3. **"Clean break ending dependency":**  
     - **Fails.** Incapacity of the new state and entangled systems (e.g., pensions, supply chains) make immediate, total separation impractical. Divorce cannot justify ignoring interdependent realities.  

  ---

  ### **Alternative Frameworks & Trade-offs**
  #### **A. Corporate Demerger**  
  - **Mapping:**  
    - *Entity:* National state as parent company; region as subsidiary.  
    - *Demerger:* Spin-off into independent entity; dissenting "shareholders" (citizens) compensated.  
    - *Assets/debts:* Apportioned based on equity/cash flow contributions.  
  - **Advantages:**  
    - Explicitly accommodates **gradual autonomy** (e.g., transitional services agreements).  
    - **Portable citizenship** ≈ Shareholders retaining stakes in both entities post-split.  
    - Legitimizes **ongoing cooperation** (e.g., shared utilities).  
  - **Supports Negotiator’s Conclusions?**  
    - **Asset division:** Yes – clearer valuation mechanisms.  
    - **Clean break:** No – demergers often involve lingering contracts. Forces surrender of "total separation" rhetoric.  
    - **Consent:** Partial – dissenting shareholders can block demergers unless overruled.  

  #### **B. Housing Cooperative**  
  - **Mapping:**  
    - *Co-op:* National union as building; region as member-tenant.  
    - *Withdrawal:* Member exits but cannot take physical assets (e.g., "the walls").  
    - *Obligations:* Settling dues; no claim to common property.  
  - **Advantages:**  
    - **State capacity gap addressed:** New state "builds its own house" post-exit.  
    - **No false equivalence to children:** Citizens are members, not dependents.  
  - **Supports Negotiator’s Conclusions?**  
    - **Asset division:** Weak – only liquid obligations (e.g., unpaid dues) divided; infrastructure remains with cooperative.  
    - **Clean break:** Yes – exit is definitive.  
    - **Consent:** No – co-op bylaws (≈ constitution) govern withdrawal terms.  

  ---

  ### **Recommendation**
  - **Divorce analogy fails** where state capacity and citizenship portability are concerned, critically undermining the "clean break" and "no consent needed" conclusions.  
  - **Corporate demerger is superior** for your context:  
    - Accommodates portable citizenship (dual "shareholding").  
    - Provides mechanisms for phased autonomy while preserving asset/debt division.  
    - Forces surrender of **unilateralism** and **absolute separation** – but these were legally untenable anyway.  
  - **Housing co-op** prioritizes clean breaks but sacrifices equitable asset division, making it ill-suited for complex fiscal disentanglement.  

  The demerger frame better aligns with technical realities while retaining rhetorical force for asset division. However, it concedes that secession is a reorganization – not a divorce – demanding negotiated terms and ongoing interfaces. Use this to recalibrate your negotiator’s priorities toward feasible outcomes over rhetorical purity.
