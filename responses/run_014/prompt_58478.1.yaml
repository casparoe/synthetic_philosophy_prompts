  ok so I keep going in circles on meritocracy vs desert and I want to test it on a real case instead of just abstract principles, like that Operation Varsity Blues college addmissions mess from a few years ago where a bunch of wealthy US parents paid a fixer to get their kids into selective schools by faking athletic recruit profiles and having someone cheat on SATs for them, with a few coaches in on it, FBI sting, parents doing short jail time, kids getting expelled or not, you know the one with USC and Yale and Stanford in the headlines.

  can you help me map it? Like, start by seperating merit as forward-looking fit for the spot — who would actually do the work, play the sport, contribute to the class — from desert as backward-looking moral deservingness based on effort and responsible choices, and then say who had what and lacked what here: the kids, including the ones who supposedly did not know, the parents, the coaches, the legit applicants who got bumped.

  tbh my arguement with my roommate is stuck on this three-way split I made up between cheating the game vs buying the game vs owning the game, where cheating is the illegal fake-recruit stuff, buying is legal but money-driven stuff like massive donations and crazy expensive test prep, and owning is getting to set what counts as merit in the first place like legacy preferences and sports that rich kids play. Does meritocracy actually condemn all three or only the first, and does desert do better or worse at explaining why the second and third feel gross too?

  and then be honest about where the lens breaks — what parts of the scandal neither merit nor desert captures well, like the role of the universities as sellers or the coaches as gatekeepers, and what the case in turn says about the theory. Is it a clean win for meritocracy talk, does it show the distinction is useless, or does it point to something the theory never anticipated?
