prompt: |-
  I just got voted onto the standards committee of my professional association (nursing, about 4,000 members in the state chapter) and I am definately in over my head. Here's the problem. Two years ago we finally passed a real ethics code after the whole mess with the previous board. Now people keep filing complaints about things members did *before* the code existed. Technically allowed back then, or at least nobody ever wrote down that it wasn't. And I keep noticing that the people pushing hardest for us to go after the old guard are a lot of the same people who were in the room while all of it was happening. The full board has to ratify whatever we recommend, and half of them would honestly rather we buried the whole thing.

  I've been reading about Nuremberg and Tokyo on my own time because it feels like exactly our problem, and now I can't unsee it. The charter they used was written after the acts they were judging, which is why the defense kept yelling ex post facto; the answer was that the 1928 treaty renouncing war as an instrument of national policy had already made aggression illegal, plus the idea that some acts are criminal under general principles no matter what the local law says. The defendants tried tu quoque -- you did it too -- and got nowhere. One judge at Tokyo thought every single defendant should walk and basically called the trial the winners taking revenge; he pointed out that Allied firebombing and the atomic bomb were not on the charge sheet and that no judges from the losing side sat on the bench. Also, superior orders was not a defense, only something that could lighten a sentence, and there was a conspiracy charge that let them convict the people who planned it rather than the ones who pulled the trigger. Later international law swung back the other way and made non-retroactivity a hard rule again.

  So can you turn this into a decision procedure my committee can actually run? I get maybe twenty minutes per case and I have no legal training. I need the questions in order, what counts as a good enough answer to each one, where it stops and says no, and where it has to stop and hand off to a committee vote because its a value call and not a fact call. Don't send me to any sources or give me a reading list, I can't look anything up -- just build the ideas into the steps.

  Then run the procedure on the three complaints we're sitting on: (1) a member who harassed a junior colleague in 2019, back when our old code was silent about it and everyone knew it; (2) a complaint against a former officer for taking industry gifts that three people currently on my committee also took; (3) a complaint against a department head who designed the production quota that led to the falsified records, even though he never falsified a single one himself. And tell me honestly where the procedure spits out an answer I won't like, and what it just can't do.

  American English, please.
reasoning: |-
  Okay, the user is on a nursing association's standards committee dealing with ethics complaints about actions that happened before their new code existed. They feel overwhelmed and need a practical decision procedure. Let me unpack their situation.

  First, they're facing retroactivity issues similar to the Nuremberg trials - judging past acts under new rules. The key parallels are: ex post facto concerns, tu quoque defenses ("others did it too"), and questions about holding planners accountable. The user needs a step-by-step method that non-lawyers can apply quickly.

  The three cases they mentioned each test different aspects:
  (1) Harassment when old code was silent
  (2) Gift-taking that current committee members also did
  (3) Creating quotas that led to fraud (without direct action)

  Their hidden needs are probably about legitimacy and fairness. They want to avoid hypocrisy (especially with case 2 where committee members are implicated) and prevent witch hunts while maintaining credibility. The board's political divide (half wanting to bury everything) adds pressure.

  For the framework, I'll adapt the Nuremberg principles to fit their context:
  - Non-retroactivity as the starting point (like international law's general principle)
  - Exceptions only for universally condemned acts (harassment might qualify)
  - Neutralizing tu quoque by focusing on individual responsibility
  - Conspiracy-style liability for enablers (like the quota designer)

  The procedure must be airtight against challenges. Each step needs clear pass/fail thresholds. For controversial value calls (like "was this fundamentally wrong even then?"), I'll build in committee votes - but only after factual filters.

  For the harassment case: Even without written rules, if it violated basic professional norms back then, it might pass. The gift case is tricky - if everyone did it, punishing one person looks retaliatory. The quota designer case hinges on foreseeability of harm.

  Biggest landmine: Case 2 will force the committee to confront their own past behavior. The procedure might say "no violation" but the appearance of impropriety remains. They'll hate that outcome but it's legally correct. Also, case 3 could trap them if they can't prove the designer knew quotas would cause fraud.

  Final thought: Emphasize that the framework protects both complainants and respondents. It's not about "getting" anyone but consistent application. The timeline documentation in Step 1 is crucial - without it, everything collapses.
answer: |-
  Here's a straight-talking, step-by-step decision procedure built from the Nuremberg parallels, designed for speed and clarity. It has 5 core steps (**A-E**) with clear stopping points. **Stop and dismiss the complaint immediately** if any step gives a "No" answer. Only proceed to the next step if you get a "Yes."

  **The Procedure (Run in Order for Each Complaint):**

  1.  **A. TIMELINE CHECK:**
      *   **Question:** Did the alleged conduct happen *before* the effective date of our *current* Ethics Code? (Check your records for the exact date the new code was formally adopted).
      *   **Good Enough Answer:** "Yes" if the date of the conduct is provably before the code's adoption date. "No" if it happened on or after.
      *   **If YES:** Proceed to Step B.
      *   **If NO:** **STOP & DISMISS.** Apply the current code. (Not a retroactivity issue).
      *   **Where it Stops:** Hard fact. No vote needed.

  2.  **B. "EX POST FACTO" SHIELD:**
      *   **Question:** Was this specific conduct **explicitly permitted or unregulated** under the *written rules, policies, or code* that existed *at the time* it happened? (Ignore unwritten "everyone knew" stuff for this step - focus *only* on documented rules).
      *   **Good Enough Answer:** "Yes" if the old rules said it was okay, were silent on it, or didn't explicitly forbid it. "No" *only* if the old rules had a clear, written prohibition covering *this exact conduct*.
      *   **If YES (Permitted/Silent Back Then):** Proceed to Step C. (The shield is up - we need a strong reason to pierce it).
      *   **If NO (Explicitly Forbidden Back Then):** **STOP & DISMISS.** They violated the rules *in force at the time*. Handle under old rules/procedures if possible. (Not truly retroactive).
      *   **Where it Stops:** Fact check of written historical rules. No vote needed.

  3.  **C. "NUREMBERG EXCEPTION" (Fundamental Wrongness):**
      *   **Question:** Even if permitted by old *written* rules, was this conduct **so fundamentally wrong, harmful, or against the core ethical duties of nursing** that it should have been considered unacceptable *by any reasonable nurse* at the time it happened, regardless of written rules? (Think: Would this have gotten someone fired, sued, or lost their license back then? Was it a clear betrayal of patient trust or safety?).
      *   **Good Enough Answer:** **This is a VALUE CALL.** It requires committee judgment. Look for:
          *   Violation of *universal* nursing principles (non-maleficence, beneficence, patient advocacy).
          *   Serious patient harm or significant risk thereof.
          *   Blatant dishonesty, exploitation, or abuse of position.
          *   Conduct that was *already* illegal (criminal/civil) or violated fundamental human rights.
          *   *Not* just "against best practice," "unprofessional," or "annoying."
      *   **If Committee Votes YES (Fundamentally Wrong Then):** Proceed to Step D.
      *   **If Committee Votes NO (Not Fundamentally Wrong Then):** **STOP & DISMISS.** Applying the *new* code would be unfair ex post facto punishment. The shield holds.
      *   **Where it Stops:** Committee vote required (Simple majority likely). Crucial value judgment.

  4.  **D. "TU QUOQUE" DEFENSE NEUTRALIZER:**
      *   **Question:** Is the complaint relying *primarily* on the argument that "others did it too" or "you (the committee/board) let it happen"? (This is about the *complaint's justification*, not the respondent's defense).
      *   **Good Enough Answer:** "Yes" if the complainant's main point is about widespread practice or institutional tolerance, rather than the specific wrongness of *this* individual's act. "No" if the complaint focuses solely on the individual's conduct being inherently wrong.
      *   **If YES (Complaint uses Tu Quoque):** **STOP & DISMISS.** Widespread practice doesn't excuse an individual's fundamentally wrong act *if* Step C passed, BUT it makes *disciplinary action now* look like selective punishment or score-settling. Recommend a *general policy review* instead of individual punishment. Nuremberg rejected "you did it too" as a *defense*, but the *fairness of prosecution* matters here.
      *   **If NO (Complaint focuses on Individual Act):** Proceed to Step E. (The complaint is cleanly about *this person's* bad act).
      *   **Where it Stops:** Committee assessment of the complaint's *basis*. Vote likely needed if unclear.

  5.  **E. "CONSPIRATOR/PLANNER" LIABILITY:**
      *   **Question:** Is the complaint targeting someone who **planned, ordered, or created a system** that led to wrongdoing by others, rather than committing the direct acts themselves?
      *   **Good Enough Answer:** "Yes" if the person had significant authority/responsibility, designed policies/protocols/quotas knowing (or reasonably should have known) they would *likely* cause ethical violations or harm by others under their influence. "No" if they were just a peer, bystander, or their role was too remote/unforeseeable.
      *   **If YES (Planner/Enabler):** **REFER TO FULL BOARD FOR VOTE** with a recommendation that liability *may* apply under the Nuremberg "conspiracy/planning" principle. Emphasize the need to prove they *knew or should have known* the likely harmful consequences of their plans/systems.
      *   **If NO (Direct Actor or Insignificant Role):** **REFER TO FULL BOARD FOR VOTE** on whether the *fundamentally wrong* individual act (established in Step C) warrants disciplinary action under the *new* code, despite retroactivity concerns. Stress the exceptional nature.
      *   **Where it Stops:** Committee assesses role/culpability level. Outcome is always a **REFERRAL** to the full board with a specific recommendation. This is too big and value-laden for the committee alone.

  **Applying the Procedure to Your Cases:**

  1.  **Harassment (2019 - Old Code Silent):**
      *   **A. Timeline:** YES (Before new code).
      *   **B. Ex Post Facto Shield:** YES (Old code silent).
      *   **C. Fundamental Wrongness?** **VALUE CALL:** Severe harassment (especially involving power imbalance like senior/junior) was fundamentally wrong and likely violated employment law/hostile workplace standards *even in 2019*. It betrays core nursing ethics (respect, non-maleficence). **Committee Vote YES.**
      *   **D. Tu Quoque Defense?** You mentioned people in the room knew. Is the *complaint* arguing "everyone ignored it back then"? If YES, **STOP & DISMISS** (Recommend policy review/training). If the complaint solely focuses on *this harasser's specific acts* as wrong, proceed.
      *   **E. Planner Liability?** NO (Presuming direct actor). **REFER TO FULL BOARD** recommending potential discipline under the *new* code based on fundamental wrongness. **You won't like this:** The Board might still refuse to act due to retroactivity politics.

  2.  **Gifts (Former Officer - Current Committee Members Also Took):**
      *   **A. Timeline:** YES (Presumably before new code).
      *   **B. Ex Post Facto Shield:** YES (Old rules likely silent/permissive).
      *   **C. Fundamental Wrongness?** **VALUE CALL:** This is tough. Taking industry gifts *can* create conflicts of interest, but the level of "fundamental wrongness" in the *past* context is debatable. Was it blatant bribery? Routine lunches? Did it demonstrably harm patients? If it was common practice *and* not illegal/obviously corrupting back then, committee might vote **NO.** **STOP & DISMISS.** If it was egregious (large cash, lavish trips, clear quid pro quo documented even back then), committee might vote **YES.**
      *   **IF C=YES:** **D. Tu Quoque Defense?** **YES.** The complaint is inherently about a practice others (including current committee members!) engaged in. Punishing *only* the former officer now reeks of hypocrisy and selective enforcement. **STOP & DISMISS.** Recommend a clear, forward-looking gift policy. **This is the answer you won't like.** The procedure forces dismissal *even if* the gifts were arguably bad, because pursuing it *now* looks like a vendetta, not justice. Nuremberg rejected "tu quoque" as a *legal defense*, but the *practical fairness* of prosecution matters immensely here.

  3.  **Department Head (Designed Quotas Leading to Falsification):**
      *   **A. Timeline:** YES (Before new code).
      *   **B. Ex Post Facto Shield:** YES (Old rules likely silent on quota design ethics).
      *   **C. Fundamental Wrongness?** **VALUE CALL:** Designing dangerously unrealistic quotas that *predictably* pressure staff into falsifying records (a fundamental wrong - fraud, patient safety risk) *is itself* fundamentally wrong. It shows reckless disregard for ethics and patient safety. **Committee Vote YES.**
      *   **D. Tu Quoque Defense?** **NO** (Presuming complaint focuses on *his* role creating the harmful system, not "others designed bad systems too").
      *   **E. Planner Liability?** **YES.** This is the core of the complaint. He designed the system knowing (or should have known) the pressures it created. **REFER TO FULL BOARD** recommending liability *may* apply under the "planner" principle. Stress needing evidence he *knew/should have known* falsification was a likely outcome. **The procedure can't do:** Guarantee the Board will act. They might balk at holding someone accountable for *indirect* consequences years later, despite the logic.

  **What the Procedure Can't Do:**

  1.  **Force the Board to Act:** Steps C, D, and E often lead to committee judgments or referrals. The full board can ignore recommendations, especially politically charged ones (like Case 2 dismissal or Case 3 referral). The procedure gives you a defensible *recommendation*, not control.
  2.  **Resolve "Should Have Known":** Step E relies heavily on judging what the planner *knew or reasonably should have foreseen*. This is inherently subjective and evidence-dependent. The procedure flags it but can't eliminate the judgment call.
  3.  **Fix Hypocrisy:** Dismissing Case 2 (Gifts) based on Tu Quoque (Step D) is legally/practically sound but feels morally unsatisfying if the conduct was bad. The procedure prioritizes fairness of *process* over punishing *all* past wrongs.
  4.  **Handle Ambiguous "Fundamental Wrongness":** Step C is the hardest vote. There's a grey area between "unprofessional" and "fundamentally wrong." The procedure forces the committee to make that tough call explicitly.
  5.  **Provide Legal Advice:** This is based on ethical reasoning from historical parallels, not legal precedent. Consult your association's lawyer before finalizing anything.

  **Key Takeaway:** This procedure prioritizes fairness (no retroactive punishment unless for universally condemned acts) and avoids the appearance of hypocrisy or vendettas (Tu Quoque dismissal). It forces tough, explicit value judgments (Step C) early on and flags the most politically sensitive outcomes (Dismissal in Case 2, Tough Referral in Case 3). It gives you a clear, defensible roadmap to follow under time pressure. Good luck.
