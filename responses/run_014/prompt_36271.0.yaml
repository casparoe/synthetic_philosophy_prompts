prompt: |-
  My friend Maya and I took a philosophy of causation seminar together in grad school and she never really recovered from it — she now works in insurance liability and treats basically every news story as a chance to hand out causal verdicts, which is honestly half the fun of knowing her. When she argues about this stuff she has two verbal tics I've noticed: she asks whether "wiggling" the thing would have changed the outcome, and she keeps invoking "what was supposed to happen" in the situation. Over the years I've collected her verdicts on a bunch of cases: (1) drunk driver runs a red light and kills a pedestrian — caused; (2) Suzy and Billy both throw rocks at a bottle, Suzy's gets there first and shatters it while Billy's was right behind and would have shattered it anyway — Suzy caused it, Billy didn't; (3) a server farm fries during a storm where a lightning strike and, independently, a power surge would each have been enough to kill the servers, and both hit at the same instant — both caused it; (4) a gardener whose contract says he must water the plants doesn't, and they die — he caused their death, but when I asked whether everyone else in town who also didn't water them caused the death she looked at me like I was an idiot (no); (5) a match is struck in an oxygen-rich room and a fire starts — the striking caused it, the oxygen didn't, even though the fire needed both.

  We've got dinner coming up and I know three new cases will come up, so I want to go in with predictions instead of my usual improvising. Case A: two factories discharge into the same river, and the fish kill only happens when both discharges are present — but Factory 1's discharge is fully within its permit (just the normal baseline everyone on the river does) while Factory 2's is an illegal dump. Does she say both factories caused the kill, or only the dumper? Case B: a night guard follows the security manual to the letter, but the manual (stupidly) says no patrols after 2am, and a theft happens at 3am that a patrol would definately have caught. Did the guard's rule-following failure cause the theft? Case C is basically the pen case from our seminar with a twist: the admin assistant is allowed to take pens from reception and the professor is not, both take one, and the receptionist can't sign a form — but in my version the form would have failed anyway because of a system crash that morning. Does she still say the professor, the norm-violator, caused the problem?

  Predict her verdicts on A, B, and C. Then tell me what rule she's actually running under all those tics — is the "wiggle it" thing (the interventionist test, roughly) doing the real work, or but-for dependence with the "supposed to happen" norm stuff doing the pruning, or something else? Say which of her earlier five verdicts should carry the most weight in figuring this out, and what further case, short of hooking her up to a polygraph, would cleanly split the candidate rules. I'm less attached to any particular prediction than to understanding what her track record commits her to.
reasoning: |-
  Hmm, this is a fascinating puzzle about causal reasoning. The user describes their friend Maya who applies philosophical causation concepts to real-world cases, with two distinctive verbal tics: "wiggling" (which sounds like interventionist counterfactuals) and "what was supposed to happen" (normative expectations). 

  First, I need to analyze Maya's existing verdicts to reverse-engineer her causal framework. The drunk driver case (1) is straightforward causation. The Suzy/Billy rock-throwing (2) shows she rejects overdetermination when there's a temporal asymmetry - only the actual trigger matters. The server farm case (3) accepts simultaneous overdetermination (both causes count). The gardener case (4) reveals her sensitivity to duties - only the contracted gardener caused the death despite identical omissions by others. The match/oxygen case (5) distinguishes between active causes and passive background conditions.

  For the new cases: In Factory A, I suspect she'll blame only the illegal dump because wiggling the permitted discharge wouldn't change the outcome (it's "supposed" to be there), while wiggling the illegal dump would prevent the kill. The guard case B is tricky - wiggling the guard's action (patrolling against rules) would prevent theft, but the manual is "supposed" to be followed. Probably "no causation" since rule-following was normative. For Pen Case C, even with the system crash, she'll likely say the professor caused the problem because their norm-violation was salient, and wiggling it would have prevented the immediate signing failure.

  The key insight is that Maya isn't running pure interventionism or pure but-for causation. Her "supposed to happen" norm filter modifies counterfactuals - she only considers wiggling things that violate expectations. The gardener case (4) is most revealing here, as it shows identical omissions are treated differently based on duty.

  A clean test case would be: A lifeguard off-duty but nearby doesn't save a drowning swimmer, while other able swimmers also don't act. Pure but-for says all omissions cause death; interventionism might say only the lifeguard's inaction matters if we consider duty. But if Maya blames only the lifeguard, that confirms normative expectations shape her counterfactuals.
answer: |-
  Based on Maya's established pattern, her causal framework combines **interventionist counterfactuals ("wiggling")** with **normative expectations ("what was supposed to happen")** to determine which factors count as "active causes" versus "background conditions." The "wiggle" test identifies *dependence*, but the "supposed to happen" norm *constrains which dependencies matter*. Here's the breakdown:

  ### Predictions for New Cases
  1.  **Case A (Factory Pollution):**  
      **Maya's Verdict: Only Factory 2 (the illegal dump) caused the fish kill.**  
      *Why:*  
      - Wiggling Factory 1's *permitted* discharge wouldn't change the outcome (fish die if *only* Factory 2 dumps illegally, but live if *only* Factory 1 operates normally).  
      - Factory 1 was doing "what was supposed to happen" (operating within norms). Factory 2 violated norms ("illegal dump").  
      - *Analogue:* Like the oxygen in the fire case (5) – necessary but norm-compliant background, not an "active cause."

  2.  **Case B (Night Guard):**  
      **Maya's Verdict: The guard's rule-following *did not* cause the theft.**  
      *Why:*  
      - Wiggling the guard's action (patrolling after 2am) *would* have changed the outcome (theft prevented). *This satisfies the interventionist test.*  
      - BUT: The guard was doing "what was supposed to happen" (following the manual, even if flawed). The *manual's flaw* or the *thief's action* are the norm-violating factors.  
      - *Analogue:* Like the townsfolk not watering (4) – failing to act outside their obligation isn't causal; the gardener's *contracted* inaction is the issue.

  3.  **Case C (Pen with System Crash):**  
      **Maya's Verdict: The professor caused the problem.**  
      *Why:*  
      - Wiggling the *professor's* action (not taking the pen) would have allowed the signing *at that moment* (even if the crash later invalidated it).  
      - The professor violated the norm ("not allowed to take pens"), while the assistant did "what was supposed to happen."  
      - The system crash is a background condition/overdetermining factor (like Billy's rock (2) or the power surge (3)), but the norm-violating act is still the salient cause of the *immediate* failure.  
      - *Analogue:* Suzy's rock (2) – the actual, norm-violating trigger matters even if Billy was a backup. The crash is Billy/the surge in this case.

  ### The Rule She's Running
  Maya isn't using *pure* interventionism or *pure* but-for dependence. Her framework is **Norm-Constrained Interventionism**:
  1.  **Identify Counterfactual Dependence ("Wiggling"):** Ask: "If we *wiggle* factor X (change its state while holding relevant context fixed), would the outcome change?"
  2.  **Apply a Normative Filter ("What was Supposed to Happen"):**  
      - Only factors that **deviated from the normative baseline** ("what was supposed to happen") are eligible to be labeled "causes" of the *bad outcome*.  
      - Norm-compliant factors (even if necessary) are relegated to "background conditions," even if wiggling them *would* change the outcome.  
      - The normative baseline is defined by explicit rules (contracts, laws, permissions), implicit duties, or standard expectations.

  ### Key Evidence: The Most Revealing Verdict
  **The Gardener Case (4) is the most critical for figuring out her rule.**  
  - *Why it's decisive:*  
    - **But-For/Interventionism Alone Fails:** Pure counterfactual dependence says *everyone* who didn't water the plants caused the death (wiggling *any* non-waterer *could* change the outcome). Maya explicitly rejects this.  
    - **The Norm Filter Explains It:** Only the gardener had a *duty* (contract) to water. His inaction violated "what was supposed to happen." The townsfolk had no such duty; their inaction was norm-compliant background.  
    - **Distinguishes Theories:** This case *requires* the normative filter. It shows "wiggling" is necessary but not sufficient; the norm violation is essential for her causal verdict.

  ### The Polygraph Alternative: A Clean Splitting Case
  **The "Off-Duty Lifeguard" Test Case:**  
  *Scenario:* A child drowns in a public pool. Several factors:  
  1.  **Lifeguard:** Officially off-duty but sitting nearby in uniform reading. Could easily have saved the child but didn't notice.  
  2.  **Parent:** Designated to supervise the child but was distracted on their phone.  
  3.  **Bystander:** A strong swimmer saw the struggle but chose not to intervene.  
  *Outcome:* Child drowns. But-for any one of them acting, the child would have been saved.  

  *Question for Maya:* Did the *Bystander's* inaction cause the drowning?  

  *How it Splits the Theories:*  
  - **Pure Interventionism/But-For:** YES. Wiggling the Bystander (making them jump in) changes the outcome.  
  - **Maya's Likely Verdict (Norm-Constrained):** NO. The Bystander had no *duty* ("what was supposed to happen"). The *Parent* (explicit duty) and *maybe* the off-duty Lifeguard (implicit duty due to proximity/uniform?) caused it. The Bystander's inaction is norm-compliant background.  
  - **Confirmation:** If Maya says the Bystander didn't cause it, her rule is confirmed. If she says they *did*, she's likely closer to pure interventionism, contradicting her gardener verdict.

  **In short:** Maya uses "wiggling" to find dependencies but only blames factors that *violate norms* for causing bad outcomes. Her gardener verdict locks this in, and the lifeguard case would test it definitively. For your dinner: Predict **Only Factory 2, No for the Guard, and Yes for the Professor**. Enjoy the causal sparring!
