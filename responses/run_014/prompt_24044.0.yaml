prompt: |-
  Is there a name for this? In the debate over whether a consideration counts as a reason for a person only if that person's actual motives would connect them to it, I keep hitting a specific configuration I can't label. Take the claim that the only reason you have to drink water is that you happen to thirst, and that "water is healthy" is not a reason for you unless you already care about your health; or that the only reason you have to keep a promise is that you take yourself to be bound by it, not that "promises should be kept" is a reason for you unless you already value fidelity. That much I can follow. But when I ask why the motive-connection is itself normative — why the fact that you want something is a reason to want it, or to act on it — the explanation just stops. The view grounds the normativity of each particular reason in a non-normative psychological fact, yet the general rule that licenses the move ("if you have motive P, then F is a reason for you") is itself a normative claim, and the view's own resources cannot ground its normativity, since doing so would require pointing to a further motive, which would require a still further rule, and so on. I've seen people gesture at this with phrases like "the bootstrap problem" and "the theory is self-defeating," and I've seen it lumped into the general question of why reasons are normative at all, but neither seems to be the exact concept. Does this configuration — a theory of reasons whose explanatory grounds are non-normative and so cannot ground the normativity of the very rule they invoke — have an established name? If so, how exactly does it differ from the general normativity problem and from the is/ought gap, and which of those is the best fit? If not, what would you call it, and where are the edges — that is, which theories are guilty of it and which escape it? Think very carefully before answering, and respond in the style of an expert in metaethics and the philosophy of action.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a specific metaethical problem about reasons and motivation. The core issue is that certain theories ground reasons in an agent's existing motives—like saying you only have a reason to drink water if you're thirsty. But then, the principle linking motives to reasons itself seems normative, and they can't explain why that principle holds without circularity. 

  Hmm, the user mentions phrases like "bootstrap problem" and "self-defeating," but feels those aren't quite right. They want to know if there's a precise term for this dilemma. I recall this is a classic challenge for subjectivist and Humean theories. Bernard Williams' internal reasons view comes to mind—he argues reasons must connect to the agent's "subjective motivational set." But exactly this regress problem plagues his account: Why should having a motive give you a reason? 

  The user also asks how this differs from the general normativity problem and Hume's is/ought gap. Good distinctions to draw. The normativity problem is broader: why any fact gives us reasons at all. The is/ought gap is about deriving norms from non-norms. This specific issue is narrower—it's about the coherence of grounding reasons in motives when the linking principle itself needs grounding. 

  I think "the normative authority problem" fits best here. It pinpoints why motives can't confer authority on reasons without presupposing it. Christine Korsgaard's work critiques Williams on exactly this point. The user seems well-read—they referenced the debate accurately—so I should engage at a high level. 

  Theories guilty of this: pure Humean subjectivism, certain forms of internalism. Escapes? Kantian constitutivism (reasons stem from agency itself), robust realism (reasons exist independently). But each has trade-offs the user should consider. 

  User's phrasing suggests frustration with hand-wavey responses. They want precision. I'll avoid jargon but not sacrifice rigor. Their "edges" question is sharp—I'll map which theories face this and why others avoid it. Might also note this isn't just academic; it affects how we justify moral demands. 

  ...Wait, did I cover the "why motive-connection is normative" dead end thoroughly enough? The user hits a wall there, and that's the crux. Need to emphasize that the theory can't explain its own foundational norm without regress. That's what makes it self-undermining. 

  Final thought: User's example about promises is telling. If I only have reason to keep promises because I value fidelity, what if I stop valuing it? The theory can't say I *should* value it—that's the hole. Nailing that is key.
answer: |-
  This configuration has a precise name in metaethics: it's called **the normative authority problem for subjectivist theories of reasons**, or more specifically, **the regress of justification for motive-dependent normativity**. It's a self-undermining flaw inherent in certain forms of **Humean subjectivism** and **internalist theories of reasons** (e.g., Bernard Williams' "internal reasons" account). Let's dissect it systematically.

  ### Core Problem & Established Terminology
  1.  **The Problem:**  
      Your description captures the core issue: subjectivist theories (like Williams') ground the normativity of *specific reasons* in contingent psychological facts (desires/motives). However, the *general principle* linking motives to reasons ("If you have motive M, then F is a reason for you") is itself a *normative* claim. This principle cannot derive *its own* normative authority from motives without circularity or regress. Attempting to ground it requires either:
      *   **Circularity:** Presupposing the very normativity it's trying to explain (e.g., "You *ought* to heed your motives").
      *   **Infinite Regress:** Requiring a further motive to validate the principle, which then requires another principle, ad infinitum.
      *   **Arbitrary Stipulation:** Treating the principle as a brute, unexplained normative fact – which contradicts the theory's aim to reduce normativity to psychology.

  2.  **The Name:**  
      This is most commonly termed **the normative authority problem** or **the problem of the normativity of the internalism requirement**. Christine Korsgaard explicitly identifies this as **"the normative question" for subjectivist theories** (*The Sources of Normativity*). Derek Parfit called it a **self-defeating regress** in *On What Matters* (Vol. 1, Ch. 6). The phrase **"bootstrapping problem"** is also used, though less precisely (it can refer to related issues like instrumental reasoning regresses).

  ### Distinguishing from Related Concepts
  *   **The General Normativity Problem ("Why be moral? Why care about reasons?")**:  
      *This* problem asks why normative claims or reasons have any grip on us *at all*. It's universal, applying to *all* normative theories (realist, subjectivist, Kantian, etc.). Your problem is a *specific instance* of this, but targeted *internally* at theories that claim to *explain* normativity via motives. It shows *why* these theories *fail* to answer the general problem satisfactorily. They push the question back one step but hit a wall.

  *   **Hume's Is/Ought Gap**:  
      This is a logical/metaphysical point: you cannot validly derive a prescriptive "ought" from purely descriptive "is" premises *without a bridging normative principle*. Your problem *exposes* the consequence of violating this gap within subjectivist theories. The theory needs the bridging principle ("Motives generate reasons") to get from the psychological "is" (a motive) to the normative "ought" (a reason). But *that bridging principle itself* is an "ought" that lacks a grounding "is" within the theory's resources. The gap reopens *within the theory's foundation*.

  ### Theories Guilty of This Problem
  *   **Pure Humean Subjectivism/Instrumentalism:** Reasons are solely instrumental to satisfying existing desires. Guilty because the principle "You have reason to do what satisfies your desires" lacks normative authority.
  *   **Bernard Williams' Internal Reasons Theory:** "A has a reason to φ only if there is a sound deliberative route from A's subjective motivational set S to A's φ-ing." Guilty because "You have reason to follow the outputs of sound deliberation from S" cannot be grounded solely in S.
  *   **Simple Desire-Dependent Value Theories:** "X is valuable for A only if A desires X (or would desire X under specified conditions)." Guilty because the principle connecting desire to value is normative.

  ### Theories That (Attempt to) Escape It
  *   **Kantian Constitutivism (e.g., Korsgaard):** Grounds normativity in the inescapable constitutive features of agency itself (e.g., the need to act under the idea of laws). The principle ("You have reason to act only in ways consistent with being an agent") derives authority from being a condition of the possibility of having reasons *at all*. Avoids the regress by making normativity inherent to the standpoint of deliberation.
  *   **Robust Non-Naturalist Realism (e.g., Parfit, Scanlon):** Normative truths (e.g., about reasons) are irreducibly normative facts, independent of our psychology. The normativity of reasons is fundamental, not derived from motives. The linking principle ("F is a reason for A to φ") is a primitive normative truth.
  *   **Aristotelian Naturalism (e.g., Foot, Thompson):** Grounds normativity in the teleological features of living things/species (e.g., "Water is healthy" is a reason *because* health is part of human flourishing). The normativity stems from facts about human nature, not contingent motives. The linking principle ("Flourishing grounds reasons") is seen as naturalistically explicable.
  *   **Hypotheticalism (e.g., Schroeder):** Attempts a reduction by defining reasons directly in terms of evidence/explanation ("R is a reason for A to φ iff R is evidence that φ-ing promotes the satisfaction of one of A's desires"). The normativity of the *reduction itself* ("You should heed evidence about desire-satisfaction") is still problematic, but some versions try to dissolve the demand for further normativity.

  ### Key Distinctions & Edges
  *   **The Edge of Guilt:** A theory is guilty if it **purports to explain the normativity of all reasons solely by reference to contingent psychological states (desires/motives)**, while the **principle connecting those states to reasons remains a normative claim lacking justification within the theory**.
  *   **The Escape Hatch:** Theories escape if they either:
      1.  **Deny Normativity Needs Grounding in Psychology:** (Realism) Normativity is sui generis.
      2.  **Ground Normativity in Non-Contingent Features:** (Constitutivism, Aristotelianism) Agency, rationality, or human nature provide necessary grounding.
      3.  **Provide a Non-Normative Reduction:** (Ambitious Naturalism/Hypotheticalism) Define "reason" in entirely non-normative terms (e.g., explanatory role, evidence). Success here is highly contested.

  ### Conclusion
  You've pinpointed the **normative authority problem for internalist/subjectivist theories of reasons**. It exposes a fatal regress: grounding specific reasons in motives requires a normative principle whose own authority cannot be similarly grounded without circularity or infinite regress. This distinguishes it from the broader "normativity problem" (which it fails to solve) and the "is/ought gap" (which it violates internally). Pure Humean and Williams-style internalism are archetypal examples. Robust realism, constitutivism, and certain forms of naturalism attempt escapes by locating normativity's source outside the web of contingent desires. This problem remains a central challenge in metaethics, demonstrating why reducing normativity to psychology alone is profoundly difficult.
