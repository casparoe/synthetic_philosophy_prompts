prompt: |-
  I keep coming back to Dennett's distinction between Orwellian and Stalinesque revisions of consciousness — the idea from *Consciousness Explained* that when the brain edits experience (like in the color-phi phenomenon, where you see a dot change color mid-trajectory before the second dot even appears), there are two ways to tell the story: either you had one experience and your memory got revised after the fact (Orwellian), or your consciousness was delayed and constructed after all the info was in (Stalinesque). Dennett's point is that there's no fact of the matter — the two accounts are just different narratives about the same underlying processes.

  I just rewatched *Memento* and I can't stop thinking about it through this lens. Leonard's whole deal is that he can't form new memories, so he's constantly constructing a narrative from tattoos and polaroids, and the film's reverse-chronological structure means we the audience are also getting information in a weird order and revising what we thought was going on. I want to use this for a film-and-philosophy essay but I need to get the mapping straight first.

  Give me exactly five points, each a sentence or two, with no intro or conclusion, on how *Memento* dramatizes or complicates the Orwellian/Stalinesque distinction. Where does the film seem to pick a side, where does it stay ambiguous, and does it add anything to the philosophical debate that Dennett's thought experiments don't?
