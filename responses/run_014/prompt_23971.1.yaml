prompt: |-
  I've been trying to figure out what I actually think about the reference class problem, going by my gut on cases, and I want to know if there's a principle behind my intuitions or if I'm just being inconsistent. When I'm about to get on a specific transatlantic flight, I think the relevent reference class is "all commercial transatlantic flights in the last twenty years" — not "all flights on this airline" (the airline's safety record is already baked into the overall rate, and narrowing it just adds noise) and not "all flights today" (weather is a confound, and I don't think the probability should shift just because it's raining). But when I'm about to eat sushi at a specific restaurant I've been to five times and never gotten sick, I think the relevant reference class is "sushi at this specific restaurant" — the fact that I've eaten there five times without issue should lower my estimate, even though "all sushi" would give a higher number. Here's where it gets weird for me: when I'm about to invest in a specific tech stock, I think the relevant reference class should be "all tech stocks of similar market cap" — but I also have a strong pull toward "this specific stock's historical performance," and I can't figure out why the narrow class feels right for sushi but wrong for stocks. Is there a principle that gets all of these, or close, and what does it say about the stock case I keep going back and forth on? And what does it predict for a case I haven't listed, like, what's the right reference class for "will it rain in my city tomorrow" when I'm deciding whether to bring an umbrella?

  Respond in the style of an expert in the philosophy of probability. Think very carefully before answering. I want the principle stated precisely, with the case that motivates each clause, and an honest statement of which of my verdicts it cannot accommodate. I'm less interested in a survey of the literature than in the actual reasoning about why my intuitions line up the way they do.
reasoning: |-
  Okay, the user is grappling with the reference class problem, trying to reconcile their intuitions across different scenarios: flights, sushi, stocks, and weather. They need a principle that explains why sometimes a broad reference class feels right and other times a narrow one does. 

  First, I notice their examples reveal a pattern: flights demand broad classes (ignoring airline-specific data), sushi demands narrow classes (prior experiences at that restaurant matter), while stocks create tension between mid-level (sector/market cap) and narrow (individual history). The umbrella case is simpler but tests the principle's boundaries. 

  Hmm... their underlying struggle seems to be about epistemic responsibility. They're implicitly weighing two things: (1) how much unique causal structure an entity has, and (2) how much data they possess about it. For flights, planes are highly standardized—airline differences are negligible noise, so broad classes win. Sushi restaurants have distinct kitchens/staff/suppliers, so narrow classes matter if you have direct experience. Stocks? Tricky. Market cap groups share systemic risks, but individual stocks have idiosyncratic factors (CEO quirks, IP). Their hesitation makes sense: without insider knowledge, they can't assess if historical data captures persistent traits or just luck. 

  Ah—and here's the key insight they might be missing: *narrow classes require stability*. Sushi restaurants have stable conditions (same chef, same suppliers), so past meals predict future ones. Stock performance hinges on dynamic markets; past returns don't guarantee stability. That's why "all tech stocks" feels safer: it averages out instability. 

  For rain forecasts, broad classes (historical weather patterns) dominate because hyper-local data (e.g., "my street's microclimate") is rarely available or relevant. Their umbrella decision aligns perfectly with this. 

  ...Wait, but the airline case contradicts this slightly. They dismiss "all flights today" (rain) but accept 20-year data. Why? Because rain affects takeoff/landing, not en-route failure rates—it's a separate causal pathway. So principle needs a caveat: *when extraneous factors are orthogonal to the outcome's core mechanics, exclude them*. 

  The stock case remains messy because (a) individual data is noisy and (b) tech sectors shift rapidly. Their gut is right to hesitate; no principle fully resolves this without knowing the stock's idiosyncratic risk profile. I should admit that upfront. 

  Finally, their meta-worry about inconsistency is overstated. Their intuitions track causal depth vs. data quality reasonably well—they just need a framework to notice it.
answer: |-
  Your intuitions reveal a deeper epistemological principle about **causal homogeneity versus stable trait attribution** in reference classes. Let's distill a unified principle, then test it against your cases:

  ### The Principle of Causal Grounding for Reference Classes
  1. **Default to the broadest reference class where:**
     - (a) Outcome-determining mechanisms are *causally homogeneous* (i.e., governed by similar physical/causal laws),  
     - (b) *No stable traits* of the specific instance are known to override class-wide mechanisms,  
     - (c) *Sufficient data* exists to estimate probabilities robustly.

  2. **Narrow the reference class only when:**  
     - (i) The instance exhibits *measurable, stable traits* causally linked to the outcome,  
     - (ii) *Direct evidence* of these traits is available (not merely anecdotal),  
     - (iii) Narrowing *reduces causal heterogeneity* more than it increases statistical noise.

  ---

  ### Case Analysis
  **Flight Safety (Broad Class Motivated)**  
  - *Why "all transatlantic flights" works:*  
    - (a) All commercial jets share *identical causal mechanisms* (physics, regulations, maintenance protocols).  
    - (b) No evidence your *specific flight* has stable traits overriding this (e.g., "this tail number has faulty wiring" would justify narrowing).  
    - (c) "All flights today" fails (a): weather introduces *new causal mechanisms* (turbulence, ice) not captured in historical data.  
  - *Why narrower classes fail:*  
    - Airline-specific data adds noise (violates iii) without new causal insight (violates i-ii).  

  **Sushi Safety (Narrow Class Motivated)**  
  - *Why "this restaurant" works:*  
    - (i) Restaurants have *stable traits* (hygiene standards, supplier quality) causally linked to food safety.  
    - (ii) Your 5 meals are *direct evidence* of these traits ("no sickness" signals consistent safe handling).  
    - (iii) "All sushi" is causally *heterogeneous* (street vendors vs. Michelin-starred).  
  - *Why broader classes fail:*  
    - Ignoring restaurant-specific evidence violates (ii). Generic sushi risk doesn't override known stable traits.  

  **Tech Stock (Tension Explained)**  
  - *Why "similar market cap tech stocks" feels right:*  
    - (a) Tech stocks share *causal mechanisms* (regulatory risks, innovation cycles).  
    - (c) Individual stock history is noisy; sector data is robust.  
  - *Why you're pulled toward individual history:*  
    - If the stock has *stable traits* (i) (e.g., monopolistic IP, visionary CEO), and you have *direct evidence* (ii) (e.g., consistent ROE >20%), narrowing is justified.  
    - **But:** Stock performance is rarely driven by *stable* traits in efficient markets (violating i). Past returns ≠ causal trait (e.g., luck vs. durable advantage). Your hesitation reflects doubt about condition (i).  

  **Rain Forecast (New Case Prediction)**  
  - *Relevant class: Historical weather patterns for your city on that date + current meteorological models.*  
    - Why?  
      - (a) Weather has *homogeneous causal mechanisms* (atmospheric physics).  
      - (b) No known *stable traits* of "your city tomorrow" that override climatology (e.g., no permanent rain-shield).  
      - "Hyper-local" data (e.g., "rain on your street") adds noise without new causal insight (violates iii).  

  ---

  ### Where the Principle *Cannot* Fully Accommodate Your Intuitions
  - **The stock case remains unresolved** because:  
    - You sense *some* stocks *do* have stable traits (e.g., Amazon's logistics moat), but lack a clear rule for when trait stability is high enough to justify narrowing.  
    - The principle *requires* evidence that past performance reflects traits, not luck. Your gut struggles with this causal attribution.  
    - **Result:** In low-trait-stability domains (like stocks), the principle defaults to broad classes. Your intuition to consider individual history is only valid if you can defend trait stability—which is often speculative.  

  ### Why Your Intuitions Are Largely Coherent
  You’re intuitively weighing:  
  - **Causal depth:** Flights depend on universal physics; sushi depends on local practices; stocks depend on volatile markets.  
  - **Trait persistence:** Restaurants have sticky standards; airlines do not differ materially; stocks have ambiguous traits.  
  - **Evidence quality:** Five sushi meals are meaningful direct evidence; five stock trades are not.  

  Your "inconsistency" arises because stocks inhabit a middle ground: they *might* have stable traits, but rarely provably so. When in doubt, the principle sides with broad classes. For sushi, you have high confidence in trait stability; for flights, no relevant traits exist. That’s not inconsistency—it’s context-sensitive reasoning.

  > *"The reference class problem is not a flaw in probability, but a feature of epistemology: it forces us to articulate why we think *this* slice of reality predicts *that* outcome."*
