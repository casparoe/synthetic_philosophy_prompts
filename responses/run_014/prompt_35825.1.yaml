answer: |-
  Below is a comprehensive design for your in-class game, refined to maximize experiential learning while addressing your concerns about anonymity, payoffs, timing, and debriefing. The goal is to create a visceral contrast between the three conditions, forcing students to confront the logic of superrationality in the "duplicate" and "symmetry-vivid" pairings. I've structured it for a 90-minute session with 14 students, using bonus points (converted to final grade percentages) as incentives. The payoff matrix is calibrated for sharp tension, and the debrief explicitly ties the experience to causal vs. evidential decision-making.

  ---

  ### **Activity Design: The Symmetric Dilemma Experiment**

  #### **Core Structure**
  Students play a one-shot prisoner's dilemma (PD) under three conditions. Each condition uses the same PD matrix but varies the framing and interaction. The matrix is chosen to make defection tempting but mutual cooperation appealing if symmetry is felt:

  |             | Cooperate (C) | Defect (D) |
  |-------------|---------------|------------|
  | **Cooperate (C)** | 3, 3          | 0, 5       |
  | **Defect (D)**  | 5, 0          | 1, 1       |

  - **Payoff Conversion**: 1 point = 0.05% bonus on the final grade.  
    - *Rationale*: Modest stakes (max 15 points = 0.75% bonus) ensure engagement without financial pressure. Points are cumulative across all conditions.
  - **Real Stakes**: Use a bonus-point system (not cash) to align with academic incentives. Students track points privately via "scorecards" (see Materials).

  #### **Timeline (Total: 90 Minutes)**
  - **Setup (5 min)**: Explain rules, assign IDs, display payoff matrix.
  - **Condition 1: Random Pairing (20 min)**: Anonymous, no communication.
  - **Condition 2: Duplicate Pairing (20 min)**: Framed as identical-reasoning partners.
  - **Condition 3: Symmetry-Vivid Pairing (25 min)**: Partners exchange reasoning paragraphs.
  - **Data Compilation (5 min)**: Calculate payoffs while students reflect.
  - **Debrief (20 min)**: Map results to theory, address fictions/iterated-play fallacies.

  ---

  ### **Detailed Rules & Procedures**
  #### **Setup (5 min)**
  - **Materials**: 
    - 14 ID cards (numbered 1–14), scorecards (paper slips for tracking points), payoff matrix poster, timer, two boxes ("Reasoning Box" and "Choice Box"), pens.
    - **Anonymity System**: Assign each student a random ID card. Record ID-student matches privately (you hold the master list). Students use IDs for all submissions—no names.
  - **Instructions**: 
    - "You'll play three one-shot PD games. Each is independent: no future interactions. Payoffs are real bonus points (1 point = 0.05% final grade). In each game, choose C (Cooperate) or D (Defect) secretly. Your choice affects your partner's payoff and yours, as per the matrix."
    - Emphasize: "No talking during choice phases. You'll debrief afterward."

  #### **Condition 1: Random Pairing (20 min)**
  - **Goal**: Baseline experience with arbitrary opponents.
  - **Framing**: "You're paired randomly with an anonymous classmate. No special similarities—just another student in the room."
  - **Procedure**:
    1. Randomly pair IDs (e.g., draw from a hat: 1 with 8, 2 with 11, etc.).
    2. Announce pairings by ID (e.g., "Player 3 paired with Player 12"). Students don't know who is behind IDs.
    3. **Silent choice**: Students write their choice (C/D) and ID on a slip, drop it in the Choice Box. No communication.
    4. Collect choices. *Do not reveal outcomes yet* to prevent cross-condition contamination.

  #### **Condition 2: Duplicate Pairing (20 min)**
  - **Goal**: Test if framing alone (without evidence) triggers superrationality.
  - **Framing**: "You're paired with a 'duplicate'—a student who received identical instructions, sat through the same lectures, and was given the same briefing sheet. We've matched you based on your participation to ensure maximum similarity in reasoning. Think of them as your rational twin."
  - **Procedure**:
    1. Re-pair IDs randomly again (new pairs). Use identical pairing process as Condition 1.
    2. **Key emphasis**: Stress the "duplicate" idea verbally and with a handout repeating the framing. Use phrases like "identical mind" or "mirror reasoner."
    3. Silent choice: Same as Condition 1.

  #### **Condition 3: Symmetry-Vivid Pairing (25 min)**
  - **Goal**: Make symmetry visceral by revealing reasoning.
  - **Framing**: "You're paired with a duplicate. But first, you'll write your reasoning and exchange it with them. This ensures you both see how the other thinks before choosing."
  - **Procedure**:
    1. **Reasoning phase (5 min)**: Students write a paragraph (3–5 sentences) explaining their choice reasoning on a slip (e.g., "I think C because..."). Include ID. Collect in Reasoning Box.
    2. Re-pair IDs randomly (new pairs).
    3. **Exchange phase (5 min)**: Redistribute reasoning slips based on new pairs (e.g., Player 5 gets Player 9's reasoning). *Students read the reasoning silently—no talking.*
    4. **Choice phase (5 min)**: After reading, students choose C/D and submit to Choice Box. Collect reasoning slips for debrief.
  - **Why this works**: Reading the partner's reasoning creates perceived symmetry. Students "see" the other mind at work, making evidential reasoning feel concrete.

  #### **Data Compilation (5 min)**
  - Calculate payoffs using the master list. Have a TA help if possible. Hand out scorecards with individual round outcomes and total points.
  - **While calculating**: Ask students to jot down reflections: "What felt different in each condition? Why did you choose C or D in Condition 2 or 3?"

  ---

  ### **Managing Anonymity and Pairings in a Small Class**
  - **Problem**: Students might guess partners or feel exposed.
  - **Solutions**:
    - **IDs**: Students keep ID cards visible but don't reveal identities. Refer only to IDs during pairings.
    - **Pairing Method**: Use three pre-generated random pairings (from an online tool) to save time. Announce pairs as "Player X with Player Y"—no physical movement.
    - **Submission**: Use sealed boxes for choices/reasoning. Students submit slips folded.
    - **Distraction**: During silent phases, play soft ambient music to reduce awkwardness and discourage talking.

  ---

  ### **Predictable Problems & Solutions**
  1. **Talking During Silent Phases**:
     - *Prediction*: Students may whisper in Condition 1 or 2 due to discomfort.
     - *Solution*: Start with a strict warning: "Talking breaks the experiment—zero points for that round if overheard." Use music as a buffer. If talking occurs, pause and restate rules.

  2. **Defecting to "Prove Superrationality Wrong"**:
     - *Prediction*: A skeptic defects in Condition 2/3 to demonstrate "rationality."
     - *Solution*: In debrief, use this as a teaching moment: "If you defected because you distrusted the framing, you broke the symmetry assumption. Superrationality requires mutual belief in identical reasoning. Your choice became a self-fulfilling prophecy."

  3. **Framing Collapse (e.g., "We're Not Real Duplicates!")**:
     - *Prediction*: Students dismiss Condition 2 because they know they're unique.
     - *Solution**: Preempt this in framing: "We know you're not clones, but based on shared context, we've created the closest possible match." In debrief, admit the fiction but stress it's a controlled thought experiment.

  4. **Insincere Reasoning in Condition 3**:
     - *Prediction*: Students write misleading reasoning (e.g., "I'll cooperate" then defect).
     - *Solution**: Warn: "Write your genuine reasoning—it's part of the experiment." If debrief reveals insincerity, discuss how it violates superrationality's honesty assumption.

  5. **Time Overruns**:
     - *Prediction*: Condition 3 runs long due to writing/exchanging.
     - *Solution**: Use a visible timer. Limit reasoning to 3–4 sentences (enforce 5-min cap). Skip verbose students in debrief if needed.

  ---

  ### **What the Game Cannot Reproduce: The Fiction of Symmetry**
  - **The Load-Bearing Fiction**: Superrationality requires players to be *perfectly identical reasoners*. In this game:
    - **Condition 2's fiction** is that "duplicates" exist. In reality, pairing is random, and students differ in risk aversion, skepticism, or engagement (e.g., a grade-anxious student defects to minimize loss).
    - **Condition 3's fiction** is that reasoning paragraphs reveal true symmetry. But students may interpret texts differently or distrust them.
  - **Debrief Must Supply**: 
    - "This was a simulation of an idealized scenario. Superrationality isn't about real people but about what happens when two agents use the *same* reasoning algorithm. In class, we approximated this with framing, but the theory assumes metaphysical symmetry—something no game can fully replicate. Real-world cooperation often requires repeated interaction; here, we isolate the one-shot logic."
  - **Condition Critique**: Condition 2 is the weakest—it relies entirely on framing. If students don't buy it, it fails. *Improvement*: Replace it with a "**Mirror Pledge**" condition where students publicly vow (by raising hands) to act as "duplicates" before choosing. This heightens commitment without adding time.

  ---

  ### **Debrief (20 min)**
  **Structure**:
  1. **Report Results (5 min)**:
     - Share aggregate cooperation rates: 
       - Condition 1 (Random): Expect ~10–30% cooperation (typical for one-shot PD).
       - Condition 2 (Duplicate): Expect ~40–60% (framing effect).
       - Condition 3 (Symmetry-Vivid): Expect ~60–80% (evidential pull).
     - Note: If Condition 2 underperforms, discuss why framing alone may be insufficient.

  2. **Map to Theory (10 min)**:
     - **Causal vs. Evidential Reasoning**: 
       - In Condition 1, defection dominates causally ("No matter what they do, D is better"). 
       - In Conditions 2–3, the duplicate framing makes choice *evidential*: "If I cooperate, it's evidence my 'twin' does too—so I can expect (3,3)." Highlight moments when students felt this (e.g., "When I read their reasoning, I knew they'd copy me").
     - **Iterated-Play Fallacy**: Students will say, "Cooperation only makes sense if you meet again." Counter: "This was one-shot—no future. Your cooperation here came from symmetry, not reciprocity. Superrationality is about shared reasoning, not repeated games."
     - **Fiction Discussion**: "Did anyone feel the pairing wasn't truly identical? That's because superrationality is a limiting case—it shows why we cooperate in highly symmetric situations (e.g., physics thought experiments) but rarely in messy reality."

  3. **Student Reflection (5 min)**:
     - Ask: "In Condition 3, did reading their reasoning change your choice? Did anyone cooperate against their causal instinct? Why?"

  **End with**: "Superrationality isn't a parlor trick—it's a challenge to causal decision theory. When you share a 'mind,' your choice isn't just an act; it's a signal about the world."

  ---

  ### **Why This Works**
  - **Experiential Focus**: Conditions 2 and 3 force students to *feel* the evidential pull—Condition 3 via shared reasoning makes it undeniable.
  - **Efficiency**: Pre-pairing and strict timing fit 90 minutes.
  - **Stakes**: Bonus points are meaningful but low-risk.
  - **Debrief Depth**: Explicitly links game moments to theory and exposes the symmetry fiction.

  **First-Run Tip**: Do a dry run with colleagues to refine timing. If skepticism dominates early debriefs, use the "Mirror Pledge" variant for Condition 2 to strengthen the frame. This game won’t convert all students, but it will make superrationality feel less abstract.
