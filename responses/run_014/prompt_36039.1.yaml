prompt: |-
  My friend and I argued until nearly three in the morning about when it is acceptable to do something unilaterally that others in one's group would rather one didn't, and I went to bed with a page of cases and my verdicts on each that I would like someone to organize. Her position, roughly, was the unilateralist's curse: when several people each have the power to trigger an action, and each acts on their own estimate of whether it is good, the action fires whenever even one person overestimates its value, while restraint requires everyone to underestimate it — so errors skew toward action, and unilateral action is presumptively wrong. She thinks something like a principle of conformity follows. I kept producing cases my gut says she cannot handle. Here they are, with my verdicts.

  1. A junior researcher discovers a serious flaw in a statistical method her whole field uses. Her advisor wants to sit on it until they can wrap a larger paper around it. She posts the critique to a preprint server that night. I think she did the right thing.
  2. A laboratory scientist works out a cheap modification that makes a common pathogen substantially more transmissible. Her colleagues are split on how dangerous the details are. She publishes anyway. Not acceptable — she owed the internal review a hearing at minimum.
  3. An engineer at a software company discovers the product silently logs users' locations and learns the internal reporting channel already buried one complaint about it. She leaks to a journalist. Right thing to do, maybe obligatory.
  4. One of five co-authors of a jointly drafted climate summary, unhappy that the final wording is weaker than the evidence supports, gives the draft and his objections to a newspaper before the others have signed off. Not acceptable, even though I share his view of the evidence.
  5. A billionaire funds a speculative ocean-geoengineering field trial on her own judgment; other funders she consulted think it is a waste or worse. Fine.
  6. A security researcher, after a vendor has ignored a critical vulnerability report for ninety days, publishes the details unilaterally, on the standard full-disclosure reasoning that publication pressures vendors and helps defenders organize. I go back and forth on this one and cannot land.

  Cases 1 and 4 look nearly identical to me — one person publishing true information ahead of people who wanted to wait — yet I judge them oppositely, and I cannot tell whether the difference is that an advisor is not a peer set deciding jointly, or something about the content. Cases 2 and 5 also look alike — unilateral action on contested judgment with no procedure in place — and I split them too, I think because in 5 only her money is at risk, though I doubt that survives my friend's logic, since the trial imposes risks on everyone. And case 3 is my hardest one for the curse itself: the company had a legitimate-looking procedure and she bypassed it, and still I think she had to.

  So: is there one principle that captures these verdicts, or a small set of candidates? State it precisely, say which case motivates each clause, tell me what it predicts for case 6 and for one case I have not listed — say, a single member of an AI safety team unilaterally escalating a concern to regulators over her team's objection — and be honest about which of my verdicts it cannot save. Lead with the principle itself, keep the whole answer under 600 words, and do not merely restate the curse at me; I need to know what breaks it.
reasoning: |-
  Okay, let me tackle this user's complex ethical puzzle. The core challenge is reconciling their intuitive verdicts on unilateral actions with their friend's unilateralist curse argument. 

  First, I need to recognize the tension: the curse suggests unilateral action is generally wrong due to error asymmetry, but the user keeps finding exceptions where it feels obligatory. Their cases cluster around knowledge dissemination (1,3,4,6) and risk imposition (2,5), with mixed judgments. 

  Hmm, the key might lie in distinguishing different types of harm. Cases where unilateral action prevents immediate harm (like leaks exposing wrongdoing) get approval, while those imposing new risks (like pathogen modification) are rejected. But case 4 breaks this - withholding climate evidence could cause harm, yet they condemn the leak. 

  Ah! Perhaps the difference is procedural legitimacy. In case 1, the advisor's request seems self-serving; in case 4, the co-authors have legitimate joint authority. Similarly, case 3's internal channel was corrupted, voiding its legitimacy. Case 2's review wasn't bypassed arbitrarily - it was ongoing. 

  For case 5, the billionaire's action survives because the harm is diffuse and the alternative (inaction) also carries risk. This suggests a "lesser evil" component. Case 6 is tricky because publication both pressures vendors (good) and arms attackers (bad). My principle would require weighing the vulnerability's severity against disclosure's urgency. 

  The AI safety escalation case tests this: if the concern is existential and internal channels are compromised, unilateral action becomes defensible despite team objections. But if it's speculative and procedures are functioning, restraint holds. 

  I notice the user struggles most when harms flow from inaction (case 4) versus action (case 2). Their instinct prioritizes preventing certain harms over others - perhaps near-term, demonstrable harms outweigh long-term, probabilistic ones. That explains their climate draft hesitation despite evidence strength. 

  Ultimately, no principle saves all verdicts perfectly. Case 4 remains the outlier - their rejection of the climate leak contradicts their approval of similar truth-telling in cases 1 and 3. This might reflect unstated values about institutional authority in science versus corporate settings.
answer: |-
  Here's a principle capturing your verdicts, motivated by the cases:

  **The Justified Unilateralism Principle:**
  Unilateral action bypassing group restraint is justified if **either**:
  1.  **Preventing Harm:** The action credibly prevents imminent, severe, and identifiable harm that group inaction would cause, *and* legitimate group procedures have demonstrably failed or are absent for addressing this specific harm (Cases 1, 3); **or**
  2.  **Self-Bearing Risk:** The actor primarily bears the significant risks/costs of the action *and* the action does not impose severe, non-consensual, irreversible harm on others beyond the baseline risk of inaction (Case 5).

  **Clauses & Motivations:**
  *   **"Credibly prevents imminent, severe, identifiable harm" (Motivated by Cases 1, 3):** The flawed method causes ongoing bad science (1); the logging violates privacy and reporting is buried (3). The harm is concrete and significant.
  *   **"Legitimate group procedures have demonstrably failed or are absent" (Motivated by Cases 1, 3, 2):** Advisor's delay is self-serving, not safety-focused (1). Reporting channel is corrupted (3). Conversely, the lab review *was* ongoing (2) – bypassing it wasn't justified.
  *   **"Actor primarily bears the significant risks/costs" (Motivated by Case 5 vs 2, 4, 6):** The billionaire risks her own money (5). The pathogen researcher risks public harm (2), the co-author risks group integrity and process (4), the discloser risks exploitation (6).
  *   **"Does not impose severe, non-consensual, irreversible harm... beyond baseline risk of inaction" (Motivated by Case 5 vs 2):** Geoengineering risks are contested and arguably comparable to *not* researching mitigation (5). Making a pathogen more transmissible *creates* a new, specific risk (2).

  **Application to Cases:**
  1.  **Junior Researcher:** **Justified.** Prevents harm (bad science), procedures failed (advisor blocking for gain). ✅
  2.  **Pathogen Researcher:** **Unjustified.** Imposes significant new risk, bypassed legitimate ongoing review. ❌
  3.  **Location Logging Leak:** **Justified.** Prevents harm (privacy violation), procedures failed (buried report). ✅
  4.  **Climate Co-Author Leak:** **Unjustified.** While harm *might* result from weaker wording, it's less imminent/identifiable than cases 1/3. Legitimate group process (joint sign-off) was actively underway and bypassed. Primary harm prevented is procedural/integrity, not direct physical harm. ❌ (*This is the verdict your principle struggles with most; your gut sees a truth-telling imperative, but the principle prioritizes process here.*)
  5.  **Billionaire Geoengineering:** **Justified.** She bears costs, risks are contested and arguably within the baseline of inaction risks. ✅
  6.  **Vulnerability Disclosure:** **Depends.** Apply the principle:
      *   Does disclosure *prevent imminent, severe harm* (e.g., is exploit actively being used)? If yes, and vendor process *failed* (ignored report), **justified**.
      *   If harm is only *potential*, and disclosure *itself* creates significant new risk (widespread exploitation) beyond the baseline risk of a patched-but-undisclosed flaw, **unjustified**.
      *   Your back-and-forth likely reflects weighing these factors. The principle predicts justification only if harm is imminent/severe *and* vendor process failed.

  **New Case: AI Safety Escalation**
  *   **Single member escalates concern to regulators over team objection.**
  *   **Prediction:** Justified **only if** the concern is about *imminent, severe, identifiable harm* (e.g., near-term deployment catastrophe) *and* internal procedures demonstrably failed to address it (team ignored evidence, suppressed dissent). If the concern is speculative/long-term or internal review is ongoing/rigorous, unilateral escalation is **unjustified**.

  **Broken Verdict:** The principle most clearly conflicts with your *intuition* on **Case 4 (Climate Leak)**. It prioritizes the integrity of the ongoing joint process and sees the harm prevented (slightly weaker wording) as less demonstrably imminent/severe than the procedural harm caused. Your principle demands a higher threshold of *preventable harm* and *procedural failure* than your gut applied there. It saves your other verdicts.
