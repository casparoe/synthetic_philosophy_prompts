  Most likely reply: She might say that practice without feedback doesn't lead to calibration. It's not the amount of practice but the presence of corrective feedback that matters. She might add that she doesn't rely on uncalibrated conceivability in her own work.

  Follow_up: "But what about cases in philosophy where there is feedback? For example, in ethics, we might have real-world outcomes of policies. Or in philosophy of science, we have scientific progress. Are those calibrated?"

  If she deflects: "This might be seen as the remoteness worry again, but I'm asking specifically about philosophical domains that might have feedback."

  Weak point: She might say that some philosophical domains do have feedback and are calibrated, but zombie arguments don't.

  Question 7 (Press, target 6: Deflation worry)

  Setup: "Reliabilism in epistemology says that a belief is justified if it's produced by a reliable process. Your calibrationism seems to say that conceivability is reliable only when calibrated. Is there more to it?"

  Question: "What distinctive work is the concept of calibration doing that a simple appeal to reliability wouldn't do? Is calibrationism just reliabilism applied to modal belief?"

  Most likely reply: She might say that calibrationism is a form of reliabilism but with a specific account of how the reliability is achieved: through a feedback loop that corrects the process. It's not just any reliable process but one that has been shaped by calibration.

  Follow_up: "But then isn't calibration just a mechanism for achieving reliability? Why not just say that conceivability is reliable when it's been shaped by feedback, and leave out the metaphor of calibration?"

