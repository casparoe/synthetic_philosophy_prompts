  Weak point: She might not have a clear example and say it's an ongoing project.

  Question 9 (Press, target 8: Closing)

  Setup: "As we close, I want to ask about the testability of your view. Every philosophical theory should have some way it could be proven wrong."

  Question: "What evidence, argument, or discovery would count against calibrationism? What would falsify it or at least make you doubt it seriously?"

