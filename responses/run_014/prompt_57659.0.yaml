  Stock_move: "That's just the modal skeptic's remoteness worry in a new coat."

  Step 1: "But I'm not a modal skeptic; I'm asking how we bootstrap calibration without modal knowledge. The feedback from actual events doesn't seem to tell us about possibilities without a modal leap. How do we avoid circularity?"

  [This step removes the deflection by insisting the question is not skepticism but circularity.]

  Step 2: "Even if we grant that patterns of actual events can support counterfactuals, why should we think that conceivability, rather than some other capacity, is being calibrated? How do we know the calibration is about modal truth and not just about actual regularities?"

  [This step presses on the link between actual patterns and modal knowledge, and the role of conceivability.]

  Step 3: "Suppose we have a perfectly calibrated imagination for actual events. How does that help us with possibilities that have never been actualized? Isn't the leap from actuality to possibility still uncalibrated?"

  [This step closes the escape by focusing on unactualized possibilities.]

  Sequencing_note: The escalation is built by moving from setting the view positively (Q1) to foundational challenges (bootstrapping, Q2), then comparisons (Q3), then hard cases (Q4, set theory), then scope (Q5), self-application (Q6), and theoretical parsimony (Q7). The two shine questions are placed early (Q1) to establish the view and late (Q8) to show it can do positive work, countering the impression that it's purely critical.

