answer: |-
  ## Memo: Draft Policy on Verbatim Use of Racial Slurs & Epithets in Reporting

  **To:** Standards Committee  
  **From:** [Your Name/Committee Liaison]  
  **Date:** October 26, 2023  
  **Subject:** Proposed Policy: Verbatim Use of Slurs in Published Content  

  This memo proposes a concrete policy to resolve our recurring debate on using racial slurs and other deeply harmful epithets verbatim. It prioritizes minimizing harm while acknowledging journalism's duty to truth and context. The goal is consistent, defensible decision-making, replacing ad-hoc debates with clear criteria.

  **Core Principle:** **The default position is to avoid printing slurs verbatim.** Recognizing the visceral harm these words inflict, verbatim use is a significant exception requiring stringent justification, not a routine practice. Paraphrasing or using accepted placeholders (e.g., "the n-word," "anti-gay slur") is the standard.

  **Criteria for *Potential* Verbatim Use:**  
  Verbatim use may be considered *only* if **ALL** of the following criteria are met simultaneously:

  1.  **Irreplaceable Necessity:** The *specific word itself* is the absolute, unavoidable focus of the story. Mere quotation is insufficient justification. Examples:
      *   **Direct Subject:** A story explicitly analyzing the etymology, historical usage patterns, or societal impact *of that specific word* (e.g., "The Evolution of the Term 'X' in American Labor").
      *   **Critical Evidence:** The word is essential, undeniable evidence in a story of significant public interest (e.g., a public figure recorded using the slur in a context proving discriminatory intent central to a major scandal).
      *   **Reclamation Context:** A member of the targeted community uses the word *about themselves or their community* in a demonstrably reclaimed/empowering context *central to the story's thesis* (e.g., an essay on reclaiming identity, quoting the author's own use). *Requires explicit consent from the individual quoted.*
      *   **Legal Documentation:** Verbatim inclusion is mandated in reporting on specific legal documents or testimony where the precise language is legally material and cannot be paraphrased without altering the legal meaning.

  2.  **Essential Context & Nuance:** Paraphrasing or using a placeholder demonstrably strips away critical meaning, context, or impact *essential* to the journalistic purpose of *this specific piece*. The story loses its core truth or power without the specific word.

  3.  **Editorial Purpose Outweighs Harm:** The journalistic value (e.g., exposing powerful wrongdoing, profound historical/cultural analysis, amplifying authentic reclaimed voices) demonstrably outweighs the foreseeable harm of printing the word. This requires active consideration of:
      *   The size and nature of our audience.
      *   The potential for retraumatization.
      *   The risk of amplifying hate speech or normalizing the slur.
      *   The availability of alternatives.

  4.  **Informed Consent (Reclamation Cases Only):** If criterion #1c (Reclamation) is met, the individual using the word must be fully informed about the context of publication and explicitly consent to the verbatim use *in this specific instance*.

  5.  **Mitigation Measures:** If verbatim use is approved, *mandatory* mitigation measures must be implemented:
      *   **Editor's Note:** A prominent, unmissable editor's note *preceding* the word (or the article if the word appears early) explaining *why* the word is being printed verbatim, referencing this policy, and acknowledging the harm it causes. (Template: "This article contains the verbatim use of [slur], which is deeply offensive and harmful. We have included it only because [specific justification based on criteria above] outweighs the significant harm of its appearance. We do not make this decision lightly.")
      *   **Contextual Buffering:** The word must be surrounded by significant contextual analysis or framing *within the text itself* that immediately explains its use and condemns its hateful nature. It cannot stand alone.
      *   **Avoiding Sensationalism:** The presentation (headline, visuals, placement) must *never* sensationalize or highlight the slur itself.

  **Decision-Making Process:**

  1.  **Reporter/Editor Initial Flag:** The reporter and assigning editor must proactively flag any potential need for verbatim use *early* in the editorial process, proposing justification based on the criteria.
  2.  **Mandatory Review:** All cases potentially meeting the criteria must be reviewed by the Standards Committee Chair (or designated deputy) *and* the relevant Section Head (e.g., National, Culture, Investigations).
  3.  **Committee Escalation:** If either reviewer has significant reservations, or the case is deemed high-impact/high-sensitivity, it is *automatically* escalated to the full Standards Committee for a vote.
  4.  **Documentation:** The justification for any approved verbatim use, including the specific criteria met and mitigation plan, must be documented in the story file and reported quarterly to the full committee for transparency.

  **The Strongest Argument Against This Policy (Presented Fairly):**

  "This policy, while well-intentioned, fundamentally compromises journalistic integrity through excessive caution and a paternalistic view of our readers. By establishing 'never print' as the default and creating a near-impossible hurdle for verbatim use, we institutionalize evasion.

  1.  **Dilution of Truth:** Paraphrasing sanitizes hatred. Replacing the actual slur uttered by a public figure with '[slur]' softens the visceral impact of their bigotry, making it abstract and less shocking. Readers deserve the unvarnished truth, especially when confronting powerful figures or systemic hate. Our job is to report reality accurately, not create a censored, more palatable version.
  2.  **Historical & Linguistic Whitewashing:** When writing about the history of language, oppression, or reclamation, sanitizing the word obscures its power and the reality of its impact. Studying or discussing the word 'n****r' while refusing to print it is absurd; it treats the *symbol* as more dangerous than the *racism it represents*. This impedes honest historical and cultural analysis.
  3.  **Condescension to Readers:** Adults are capable of encountering offensive words within responsible journalistic context. Shielding readers assumes they cannot handle difficult truths or distinguish between reporting hate and endorsing it. This infantilizes the audience and undermines their agency.
  4.  **Inconsistency & Subjectivity:** The criteria, while specific, still rely heavily on subjective judgments about 'necessity' and 'outweighing harm.' This invites the same protracted debates we have now, just with more steps. The 'mitigation' measures like editor's notes are cumbersome, disrupt the narrative, and draw *more* attention to the word, arguably increasing harm.
  5.  **Empowerment Through Reclamation Denied:** Strictly limiting reclaimed usage stifles the agency of communities seeking to redefine these terms on their own terms, making their efforts subject to an editorial veto.

  Ultimately, fear of causing offense, however valid, cannot supersede the core journalistic mandate to report accurately and fully. This policy prioritizes comfort over truth and sets a dangerous precedent for censoring difficult realities."

  **Recommendation:**  
  I propose we adopt this criteria-based policy. It establishes a clear, harm-minimizing default while providing a rigorous, multi-layered process for the rare exceptions where verbatim use serves a compelling journalistic purpose. It replaces endless debate with structured evaluation, forces explicit justification, mandates mitigation, and provides accountability through documentation. This policy takes the profound harm of these words seriously without abandoning our commitment to truthful, impactful reporting when the circumstances are extraordinary.
