answer: |-
  ## Brainstorming: Mapping the Conceptual Space

  1.  **Motivating Reasons vs. Right-Making Features:** This is fundamental.
      *   **Right-Making Features (RMFs):** The objective facts or properties *in the situation* that make an action the morally right one to perform (e.g., alleviating suffering, respecting autonomy, fulfilling a promise, promoting fairness). These are features *of the act* or its consequences.
      *   **Motivating Reasons (MRs):** The psychological states *in the agent's mind* that actually move them to act (e.g., "I want to help," "I feel I must follow the rule," "I desire praise"). These are features of the *agent's deliberation*.
      *   **Key Point:** An action can be *objectively right* (aligning with RMFs) even if the agent's MRs are bad (e.g., helping only for fame). Conversely, an agent can have good MRs but perform a wrong action due to factual error (e.g., intending to help but accidentally harming). Moral worth concerns the *alignment* of MRs with RMFs in a specific way when the action *is* right.

  2.  **Motivated by Rightness Itself vs. Motivated by Underlying RMFs:**
      *   **Motivated by Rightness Itself (Duty qua Duty):** The agent acts *because* they recognize the act as "the right thing to do" or "their duty." Morality itself is the direct object of their motivation (e.g., "I must do this *because it's the moral thing*").
      *   **Motivated by Underlying RMFs:** The agent acts *because* they are directly responsive to the concrete moral features *in the situation* (e.g., "This person is suffering; I must help," "This price would be unfair; I shouldn't charge it," "I promised; I must keep it"). They may not explicitly think "this is moral"; they are moved by the *content* of the morality (need, fairness, fidelity) itself.
      *   **Key Point/Kantian Insight:** Kant famously argued that acting *from* the motive of duty (rightness itself) is the only source of moral worth. Others (e.g., virtue ethicists, many consequentialists) argue that direct responsiveness to RMFs (like compassion for suffering or a sense of fairness) is sufficient, and often *more* authentically moral than abstractly focusing on "duty." Being moved by RMFs often implies a deeper understanding and connection to the moral reality.

  3.  **Non-Accidental Alignment vs. Mere Coincidence:**
      *   **Non-Accidental Alignment:** The agent's MRs reliably track the RMFs. The good action results *because* the agent was guided by considerations connected to what actually makes it right. Their reasons explain *why* they hit the right target.
      *   **Mere Coincidence:** The agent performs the right action, but their MRs are disconnected from the RMFs. They hit the target "by luck" – their reasons could just as easily have led them astray in slightly different circumstances. The action's rightness is accidental relative to *their* reasons.
      *   **Key Point:** Moral worth requires that the action's rightness isn't a fluke *given the agent's reasons*. The agent's reasons must be appropriately *sensitive* to the moral landscape.

  **Interaction:** Moral worth requires that the agent's *motivating reasons* (MRs) *non-accidentally align* with the *right-making features* (RMFs) of the action. A crucial question is *how* the MRs connect to the RMFs: is the agent motivated *by* the RMFs directly, or *by* the abstract property of rightness itself? And does this connection ensure the alignment isn't accidental?

  ---

  ## Systematic Explanation: Moral Worth vs. Merely Right Action

  An action **merely turns out to be morally right** if its performance aligns with the objective Right-Making Features (RMFs) of the situation (e.g., it alleviates suffering, respects autonomy, promotes fairness). This is a fact about the *action* and its consequences in the world. An action has **moral worth**, however, when its status as the right action is *explained* or *manifested* by the morally good quality of the agent's **Motivating Reasons (MRs)**. It's about *why* the agent did it, specifically whether their reasons reliably connect to the moral reality.

  The core requirement for moral worth is **non-accidental alignment**: the agent performs the right action *because* they are moved by considerations that are appropriately responsive to the RMFs. This responsiveness can manifest in two primary, often overlapping, ways:

  1.  **Responsiveness to Rightness Itself (Duty):** The agent is moved by the recognition that the act *is* morally required or right. They act *from* duty. Their reason is: "I must do this *because it is the right thing to do*."
  2.  **Responsiveness to Underlying Right-Making Features (RMFs):** The agent is moved directly by the concrete moral features present in the situation (e.g., "This person needs help," "That would be unfair," "I promised"). They act *from* compassion, a sense of fairness, fidelity, etc. Their reason is the *content* of the morality, not necessarily the *label* "moral." This direct responsiveness is often seen as the more fundamental and authentic moral connection.

  **Why mere alignment isn't enough?** If an agent's MRs have *no essential connection* to the RMFs, their performance of the right action is accidental or coincidental relative to *their* reasons. Luck, not their moral character or understanding, explains the outcome. Moral worth requires that the agent's *character* or *deliberative process* is such that, in virtue of it, they reliably connect their action to the moral reasons present.

  **Complications:** Mixed motives, overdetermination, and the presence of self-interest make assessment nuanced. An action can still have moral worth if morally good MRs are *sufficient* for the action (even if other motives are present) or if the good MRs are the *primary* or *defining* ones shaping the action. However, if the morally good MRs are absent or purely subsidiary, moral worth is undermined. The key is whether the *good* reasons are doing the essential work in moving the agent to perform *that* right action.

  ---

  ## Analysis of Cases

  1.  **The Night-Shift Nurse:**
      *   **Motivating Reasons (MRs):** (a) Takes patient vulnerability to demand care (RMF responsiveness: need/suffering/duty of care). (b) Desire for supervisor praise/enjoys praise (self-interest).
      *   **Right-Making Features (RMFs):** Alleviating suffering, fulfilling duty of care to a vulnerable patient.
      *   **Moral Worth Assessment?** **Likely YES, but qualified.** Philosophers would generally hold this action *has* moral worth. The key is that her responsiveness to the patient's need/vulnerability (the core RMF) is present and appears sufficient to motivate the action on its own ("would have been sufficient"). Her *primary* motivation connects non-accidentally to the RMFs. The self-interested motive is *present* and *operative* but *auxiliary*; the good reason isn't dependent on it. She is moved by the underlying RMF (need/vulnerability), not primarily by abstract "rightness" or the praise. The overdetermination doesn't negate the sufficiency and primacy of the good motive. The action isn't right *by accident* relative to her character; her character includes the disposition to respond to patient need.

  2.  **The Shopkeeper:**
      *   **Motivating Reasons (MRs):** Internalized, rigid rule about honest dealing ("this is the rule I follow"). *No* concern for customers, fairness, or understanding *why* honesty matters. He "does not see the point."
      *   **Right-Making Features (RMFs):** Fairness, avoiding exploitation, respecting customers.
      *   **Moral Worth Assessment?** **Likely NO.** While the action is right (charges fair prices), the shopkeeper lacks moral worth. His MR (rigid rule-following) is disconnected from the underlying RMFs (fairness, non-exploitation). He is not responsive to the moral reality of the situation; he's responsive only to an internalized command. If the rule were different (e.g., "maximize profit always"), he might exploit. If the situation presented a *different* moral demand not covered by his rule (e.g., helping an injured customer), he likely wouldn't act. His action aligns with RMFs *accidentally* because his rule happens to correspond to morality *in this instance*. He lacks the necessary sensitivity to the RMFs themselves. He might be motivated by a *sense* of "rightness" defined by the rule, but it's divorced from the actual RMFs.

  3.  **The Bystander:**
      *   **Motivating Reasons (MRs):** (a) Concern for the child (RMF responsiveness: saving a life, preventing harm). (b) Desire to appear heroic (self-interest, vanity). Crucially, (a) is sufficient on its own and (b) is operative.
      *   **Right-Making Features (RMFs):** Saving a life, preventing grievous harm.
      *   **Moral Worth Assessment?** **YES.** This is a classic case of **overdetermination** where the morally good MR (concern for the child) is *sufficient* to cause the action. The presence of the self-interested motive (desire for heroism), while perhaps diminishing the *purity* or maximum possible praiseworthiness, does not negate the moral worth. The action is performed *because* of the good reason; the good reason is doing the essential work. The self-interest is an *additional* push, but the rescuer would have acted *even without it* because of their concern. There is non-accidental alignment: their responsiveness to the child's peril (the RMF) explains the action. Luck played a role in the *opportunity* to act, but given the opportunity, their good motive ensured the right action.

  ---

  ## What Hangs on This: Praiseworthiness and Moral Credit

  The distinction between an action merely being right and having moral worth is crucial for assessing **praiseworthiness** and assigning **moral credit** to the *agent*, not just evaluating the *act*.

  *   **Permissibility/Requiredness:** This is about the *action itself*. Was it the right or wrong thing to do in that situation? This is determined solely by the RMFs and moral principles.
  *   **Praiseworthiness/Moral Credit:** This is about the *agent*. Does the agent *deserve praise* for performing the right action? This depends on *why* they did it – their Motivating Reasons (MRs).
      *   An action that is right but lacks moral worth (like the Shopkeeper's) does not make the agent praiseworthy. We might approve of the *outcome* or the *habit*, but we don't credit the *agent* with acting from a morally commendable state of character. Their character wasn't reliably oriented towards the good; they just followed a rule.
      *   An action with moral worth (like the Nurse's or Bystander's, despite complications) makes the agent praiseworthy. We credit them with acting from a good will, virtuous character, or a proper responsiveness to moral reasons. Their action *expresses* their moral quality. They deserve praise *for their motivation*, not just the outcome.
      *   **Why it Matters:** Ethics isn't just about what we *do*, but about the kind of people we *are* and the reasons that guide us. Moral worth connects right action to good character. It tells us when doing the right thing reflects well on the agent's moral psychology and merits esteem. It highlights the importance of cultivating not just correct behavior, but the right *reasons* for acting – genuine concern, understanding, and responsiveness to the moral features of the world. The distinction guards against giving moral credit where it isn't due (e.g., to the lucky or rigidly rule-bound) and ensures we recognize it where it is earned (e.g., by those acting from compassion or a reliable sense of fairness, even amidst mixed motives).
