answer: |-
  You've hit upon a key nuance of the Pasadena Paradox! **Your initial understanding is a common misconception. The core of the paradox is that the expected value is genuinely *undefined*, not negative infinity.** While it *can* be manipulated to *appear* negative infinite (or positive infinite, or any real number!), its inherent nature is indeterminate.

  Here's a breakdown to clarify:

  1.  **The Setup (Recap):** A fair coin is tossed until it lands heads. If heads first appears on toss `n`, the payoff is `(-1)^n * (2^n) / n` dollars.
      *   n=1: Payoff = (-1)^1 * (2^1) / 1 = -$2
      *   n=2: Payoff = (+1) * (4) / 2 = +$2
      *   n=3: Payoff = (-1) * (8) / 3 ≈ -$2.666
      *   n=4: Payoff = (+1) * (16) / 4 = +$4
      *   n=5: Payoff = (-1) * (32) / 5 = -$6.4
      *   ... and so on.

  2.  **Calculating Expected Value (The Problem):**
      *   Expected Value (EV) = Σ [Probability(n) * Payoff(n)] for n=1 to ∞
      *   Probability(n) = (1/2)^n (probability of n-1 tails then a head)
      *   Payoff(n) = (-1)^n * 2^n / n
      *   So EV = Σ [ (1/2)^n * (-1)^n * 2^n / n ] for n=1 to ∞
      *   Simplify: (1/2)^n * 2^n = (2^n / 2^n) = 1. So:
      *   **EV = Σ [ (-1)^n / n ] for n=1 to ∞**

  3.  **The Indeterminate Series:**
      *   The series Σ (-1)^n / n is the **Alternating Harmonic Series**.
      *   This series is **conditionally convergent**, not absolutely convergent.
      *   **Absolute Convergence Test Fails:** Σ |(-1)^n / n| = Σ (1/n) is the standard Harmonic Series, which **diverges to infinity**. This failure of absolute convergence is the critical point.
      *   **Conditional Convergence:** The alternating harmonic series *does* converge to a finite value (specifically, -ln(2) ≈ -$0.693). However, because it lacks absolute convergence, its sum is highly unstable.

  4.  **Riemann's Rearrangement Theorem - The Source of Paradox:**
      *   This theorem states that any conditionally convergent series can be rearranged to converge to **any** real number whatsoever (positive infinity, negative infinity, or any specific real number like 42 or -1000).
      *   **This is why the expected value is UNDEFINED.**
      *   If you sum the terms in the "natural" order (n=1, 2, 3,...), you get ≈ -$0.693.
      *   If you rearrange the terms (e.g., take one positive term, then two negative terms, then one positive, then two negative, etc.), you can make the partial sums tend towards **negative infinity**.
      *   If you rearrange differently (e.g., two positive terms, then one negative, etc.), you can make the partial sums tend towards **positive infinity**.
      *   You can also rearrange to converge to **any finite number** you choose.
      *   **There is no single, "correct" order** imposed by the gamble itself. The probabilities define the *magnitudes and signs* of the payoffs, but the *order of summation* for the infinite series is arbitrary. Since the sum depends critically on the order, and no specific order is privileged by the gamble's rules, the expected value **lacks a determinate value**.

  **Implications for Your Novel & Rationality:**

  *   **Not Negative Infinity:** It's incorrect to say the EV is negative infinity. You *can* make it *look* that way with a specific rearrangement, but you can also make it look positive infinity or finite.
  *   **Undefined is the Core:** The true paradox lies in the **indeterminacy**. Standard expected utility theory **breaks down** because it requires a definite expected value to compare options.
  *   **Rationality Dilemma:** This makes the gamble profoundly challenging for a rational agent:
      *   **No Clear Rational Choice:** Without a defined EV, standard rationality (maximize EV) gives no answer. Is accepting irrational? Is rejecting irrational? The theory is silent.
      *   **Depends on "Framing" (Summation Order):** A character's perceived "rationality" in accepting or rejecting could bizarrely depend on how they mentally group or sequence the infinite possibilities (which is arbitrary), not just the objective probabilities and payoffs.
      *   **Violates Axioms:** This indeterminacy violates the continuity axiom often assumed in von Neumann-Morgenstern expected utility theory.
  *   **Potential Character Motivations (Beyond Simple EV):** A character might:
      *   **Accept:** Be enticed by the enormous potential positive payoffs early in some orderings, or be risk-seeking, or fascinated by the paradox itself, or believe in a specific favorable ordering.
      *   **Reject:** Be deterred by the enormous potential losses early in other orderings, be risk-averse, find the indeterminacy itself unacceptable, or rely on a different decision rule (like minimax regret, which might strongly favor rejection due to the possibility of massive losses).

  **Solutions & Workarounds (For Your Character's Reasoning):**

  Philosophers and economists have proposed ways to handle such paradoxes:

  1.  **Weak Expectations:** Use a generalized summation method (like Cesaro or Abel summation) that assigns the "natural" conditional convergence value (-ln(2) ≈ -$0.69). This suggests rejecting the gamble is slightly better.
  2.  **Finitism:** Argue that truly infinite gambles are unrealistic. Impose a maximum number of tosses (N), making the EV calculable (and likely negative for moderate N).
  3.  **Utility Transformations:** Use a utility function that grows slower than linear (e.g., logarithmic utility). This can make the series converge absolutely, yielding a defined (negative) EV.
  4.  **Dominated Strategies:** Argue that since *some* rearrangements yield negative infinite partial sums, the gamble is unacceptable (similar to rejecting a gamble with any chance of infinite loss).
  5.  **Embrace Indeterminacy:** Have the character explicitly acknowledge the paradox and make a decision based on temperament (optimism/pessimism) or other principles, recognizing EV fails.

  **Conclusion for Your Novel:**

  The power of the Pasadena Paradox for your story lies precisely in the **undefined expected value**, not in it being negative infinity. This indeterminacy creates a genuine philosophical and rational dilemma where standard decision theory offers no clear answer. Your character faces a gamble where:

  1.  **There is no single "true" expected value.**
  2.  **Depending on how you mentally approach the infinite sum, it can appear fantastically good, catastrophically bad, or merely slightly unfavorable.**
  3.  **Standard rationality criteria break down.**

  This makes the character's decision deeply interesting. Do they see the potential for boundless gain? Are they terrified by the potential for boundless loss? Are they paralyzed by the indeterminacy? Do they rely on a modified decision rule? Their choice reveals something fundamental about their personality, risk tolerance, and philosophy in the face of profound uncertainty. Emphasizing the *undefined* nature captures the true essence of the paradox far better than simply labeling it "negative infinity."
