  For the scenario, I'm considering a math tutor situation. The tutor has drilled a concept repeatedly with a student, and when the student finally solves a problem correctly, the tutor says "You understand this now" - knowing it's true based on evidence, yet not fully believing it due to past frustrations. This plays with the distinction between dispositional knowledge and occurrent belief.

  The proposition would be "You understand how to solve these equations now." The knowledge norm permits because the tutor has overwhelming evidence. The truth norm permits because it's factually correct. But the belief norm forbids because the tutor's frustration blocks full endorsement.

  The key feature making this work is the separation between dispositional knowledge (what the tutor can access rationally) and occurrent belief (what they feel in the moment). If we remove this - say by claiming knowledge always entails belief - the case collapses into either self-deception or simple error.

  A belief-norm defender might argue the tutor actually believes it dispositionally. The best reply is that the visceral resistance shows genuine absence of conviction at assertion-time. My intuition leans toward the assertion being licensed - we often require experts to state truths they're conflicted about.

  This case isn't perfect - it brushes against the "exotic psychology" boundary - but it's the cleanest ordinary example I can construct. It suggests belief isn't strictly necessary, though the debate would likely continue.
answer: |-
  Here is a case built to your specifications, followed by the requested analysis. I conclude that constructing a decisive case meeting all constraints is impossible, but I provide the closest approximation and identify the blocking premise.

  ### (a) Scenario
  Clara, a meticulous high school physics teacher, has spent weeks preparing her students for a crucial exam on Newtonian mechanics. One student, Leo, struggled persistently with free-body diagrams. After extensive tutoring, Leo completes a complex problem flawlessly during a practice session. Clara observes every step: Leo identifies all forces correctly, draws vectors to scale, applies Newton's second law accurately, and arrives at the right answer. His reasoning is explicit and confident. Clara *sees* this mastery, yet she remains emotionally braced for his habitual errors due to past frustration. When Leo finishes, Clara states flatly: "You’ve mastered free-body diagrams." Privately, she feels a pang of doubt, thinking, "I can’t shake the feeling he’ll regress tomorrow." Her cognitive assessment is unequivocal, but her affective state resists endorsement.

  ### (b) Proposition Asserted and Assertion
  - **Proposition asserted**: *Leo has mastered free-body diagrams.*  
  - **Assertion itself**: Clara’s utterance: "You’ve mastered free-body diagrams," spoken in a factual, declarative tone to Leo after his successful performance.  

  ### (c) Verdicts and Reasons for Each Norm  
  1. **Knowledge Norm (Permits)**:  
     Clara knows Leo has mastered the topic. Her grounds are *direct observation* of his flawless, reasoned performance under standard conditions. Her expertise allows her to recognize mastery; there is no defeaters (e.g., no hints were given, no guessing occurred). This warrant yields knowledge because it meets safety (Leo couldn’t easily have erred given his method) and sensitivity (Clara would have noticed mistakes). It is not Gettiered: her evidence is non-accidentally connected to the truth.  

  2. **Truth Norm (Permits)**:  
     The proposition is true. Leo’s performance demonstrably meets the criteria for mastery (correct application, consistency, understanding). This is objective, verified by his actions.  

  3. **Belief Norm (Forbids)**:  
     Clara lacks belief. Her cognitive assessment ("I *see* he did it perfectly") is knowledge-constituting, but her affective doubt ("I *feel* he’ll regress") prevents doxastic commitment. She cannot sincerely endorse the proposition as true *in her overall psychology*; her disposition to rely on this claim (e.g., to bet heavily on Leo’s next performance) is unstable. The absence of belief is evidenced by her spontaneous private thought and tension in her assertion (flat tone, lack of encouragement).  

  ### (d) The Single Feature Doing the Work  
  The case relies on a **separation between epistemic competence (knowledge) and doxastic commitment (belief)**. Clara’s rational faculties generate knowledge via perception and inference, but her emotional state (rooted in past experiences) blocks the formation of a settled belief. Knowledge is dispositional (accessible via reflection), while belief is occurrently absent due to non-epistemic factors.  

  ### (e) If the Feature Is Removed  
  If belief is a necessary condition for knowledge (as per the standard view that *knowledge entails belief*), the case collapses. Clara either:  
  - **Knows and believes**: Her "doubt" is merely transient anxiety, not doxastic rejection. The belief norm permits.  
  - **Does not know**: Her anxiety undermines justification, making her epistemic position insufficient for knowledge. The knowledge norm forbids.  
  The scenario becomes incoherent under entailment; it cannot simultaneously satisfy the knowledge and disbelief requirements.  

  ### (f) Defense of Belief Norm and Reply  
  - **Attack**: A defender would argue Clara *does* believe the proposition. Her assertion, expertise, and cognitive assessment confirm belief; her "doubt" is just emotional noise, not a doxastic state. Self-reports of disbelief are unreliable when actions (asserting, teaching based on the claim) imply belief.  
  - **Best Reply**: Assertion doesn’t always imply belief (e.g., actors assert without belief). Clara’s flat tone and immediate private thought reveal a cognitive-affective split. Her knowledge is *inert*—she wouldn’t stake personal decisions on it—showing absence of functional belief. The norm targets the speaker’s psychology, not behavioral proxies.  

  ### (g) My Verdict  
  - **Assertion Licensed?** Yes, intuitively. Clara *should* make this assertion: it is helpful, truthful, and knowledge-based. Criticizing her for insincerity feels misplaced; her duty as a teacher overrides her pessimism.  
  - **Decisive or Standoff?** **Standoff**. The intuition splits:  
    - *Favors knowledge/truth norms*: The assertion is proper because it conveys known truth.  
    - *Favors belief norm*: Clara’s internal conflict makes the assertion "hollow," undermining its role in conversation.  
  The case is not decisive because it strains ordinary psychology. It highlights the tension but cannot resolve it without violating Specification 3 ("no exotic psychology").  

  ---

  ### Conclusion: The Blocking Premise and Closest Case  
  **No case meeting all specifications is possible** because the premise that **knowledge entails belief** blocks the triad (knowledge + truth + disbelief). This entailment is widely accepted in epistemology; relaxing it (e.g., allowing "inert knowledge") creates borderline-exotic psychology.  

  **The closest case** (above) relaxes "no exotic psychology" minimally by positing a mild cognitive-affective divide. It establishes:  
  - Belief is not *constitutively* necessary for licensed assertion if knowledge and truth suffice.  
  - But it cannot prove belief is *causally* unnecessary in ordinary practice, as the disbelief remains psychologically unstable.  

  **What it does not establish**: That such scenarios are common or that belief is merely a "symptom." It only shows that *if* knowledge and belief can diverge (a big "if"), the belief norm is dispensable. In real discourse, knowledge and belief typically co-occur, making the belief norm a reliable proxy—but not necessarily the licensing ground.  

  This leaves the debate at a standoff: Your friend can insist knowledge entails belief, making the belief norm redundant but harmless; you can argue that assertion licenses flow from knowledge/truth, with belief as a contingent psychological add-on. The case shifts the burden but cannot settle it.
