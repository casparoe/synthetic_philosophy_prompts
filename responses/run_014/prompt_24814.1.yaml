prompt: |-
  Longtime LessWrong reader here. In a thread about wheter to vote tactically in a 3-candidate race, someone kept repeating 'Gibbard--Satterthwaite proves no voting system is strategy proof, so tactical voting is pointless, just vote sincerely' as if that one line settled the whole debate. I've read the theorem enough times to know the sentence is doing way more work than the result actually does, but I can't cleanly seperate the readings. Could you lay out the different precise claims that 'no voting system is strategy proof' (or 'you can always game the vote') could be making — varying the quantifiers (every rule? every preference profile? every voter, or just some voter?), the standing assumptions (unrestricted domain, Pareto efficiency, non-dictatorship), what counts as 'gaming' (strictly better outcome vs. merely a different one), and the gap between an existence claim and the practical question of whether I should vote tactically in a specific election I'm actually in? For each reading, say whether it's a trivial platitude, a substantive true claim, or actually false, and give a counterexample for the false ones. Then tell me which reading the forum poster was most likely invoking, and whether that reading actually supports their conclusion that I should just vote sincerely. Think very carefully before answering; respond in the style of an expert in social choice theory who is allergic to sloppy quantifier use. Don't just restate the theorem — the disambiguation is the whole point.
reasoning: |-
  Okay, the user is a long-time LessWrong reader, so they're familiar with rationalist concepts and probably have some background in math or logic. They're frustrated with someone misusing the Gibbard-Satterthwaite theorem to shut down debate about tactical voting. The core issue is quantifier ambiguity - that one-line summary is doing heavy lifting without specifying scope.

  Hmm, the user wants me to dissect "no voting system is strategy-proof" into precise logical claims. They're explicitly asking for variations in: quantifiers (which systems? which voters?), assumptions (like unrestricted domain), what "gaming" means, and the gap between theory and practice. Then they want each version labeled as trivial/true/false with counterexamples, plus analysis of the forum poster's likely meaning.

  First I need to recall GS theorem's exact statement: every voting rule satisfying unrestricted domain, Pareto efficiency, and non-dictatorship is manipulable for some preference profiles. But the forum poster is overgeneralizing this to "always vote sincerely" which is nonsense - the theorem proves vulnerability exists, not that it's always exploitable or advisable.

  Let me break down possible interpretations of "no system is strategy-proof":
  1. Trivial version: For every system, some voter could hypothetically benefit from lying in some scenario. This is true by GS but useless advice.
  2. False strong version: Every system can be manipulated in every election. Easily disproven by dictatorship or single-voter elections.
  3. Actual GS claim: Every non-dictatorial Pareto-efficient system has some election where some voter can manipulate. True but doesn't imply manipulation is feasible or beneficial in your specific election.

  The user also wants the "gaming" definition clarified - GS requires strict preference improvement, not just change. That's crucial because sometimes lying might backfire.

  For the forum poster... they're probably conflating the existence proof (GS) with universal applicability. But existence ≠ ubiquity. In real elections with polls, you might actually compute whether tactical voting helps. The conclusion "always vote sincerely" doesn't follow - sometimes tactical voting is objectively optimal.

  I should emphasize the practical gap: GS says vulnerability exists somewhere, but your specific election might have: 
  - No pivotal voter (your vote won't change outcome)
  - No profitable deviation (all lies make things worse)
  - Strategic complexity (you might miscalculate)

  Counterexamples needed: for the false strong claim, show unanimity rule where sincere voting is dominant strategy. Also highlight how even manipulable systems like plurality can have elections where manipulation isn't beneficial.

  Final point: the forum poster's error is quantifier smuggling. GS says ∀systems ∃bad_elections, but they're interpreting as ∀systems ∀elections. That's mathematically illiterate. Their conclusion only holds if all elections are bad - which GS doesn't claim.
answer: |-
  As a social choice theorist with particular irritation toward quantifier abuse, I appreciate this question. The Gibbard-Satterthwaite (GS) theorem is profoundly important but notoriously misapplied in the way you describe. Let's dissect "no voting system is strategy-proof" by tightening the quantifiers, assumptions, and definitions. I'll categorize each interpretation and evaluate the forum poster's claim.

  ### Core GS Theorem Statement (for reference)
  *Under Unrestricted Domain (any preference profile allowed), if a voting rule has at least three possible outcomes, is Pareto Efficient (if everyone prefers A over B, B doesn't win), and Non-Dictatorial, then it is not Strategy-Proof: there exists some preference profile where at least one voter can obtain a strictly better outcome by misrepresenting their preferences.*

  ### Disambiguating "No Voting System is Strategy-Proof"
  1.  **Reading 1: Trivial Existential Vulnerability (True, but Vacuous for Advice)**
      *   **Claim:** For every voting system satisfying GS assumptions, there exists at least one preference profile and at least one voter for whom there exists a way to misreport preferences that yields a strictly better outcome for them.
      *   **Quantifiers:** ∀ Rules → ∃ Profile → ∃ Voter → ∃ Manipulation (strictly better)
      *   **Assumptions:** Unrestricted Domain, ≥3 Outcomes, Pareto Efficiency, Non-Dictatorship.
      *   **"Gaming":** Strictly better outcome possible for that voter in that profile.
      *   **Status:** **True** (This *is* the GS theorem).
      *   **Relevance:** This is a pure existence theorem. It tells us no "reasonable" system is *universally* strategy-proof. It says *nothing* about how often manipulation is possible, how easy it is to execute, or whether it benefits the manipulator in any *specific* election. Concluding "so never manipulate" from this is a *non sequitur*. Counterfactually, knowing vulnerabilities exist might *motivate* strategic voting in some contexts.

  2.  **Reading 2: Universal Vulnerability - Strong False Version**
      *   **Claim:** For every voting system satisfying GS assumptions, for every possible preference profile, and for every voter, there exists a way for that voter to misreport preferences and get a strictly better outcome.
      *   **Quantifiers:** ∀ Rules → ∀ Profiles → ∀ Voters → ∃ Manipulation (strictly better)
      *   **Assumptions:** Unrestricted Domain, ≥3 Outcomes, Pareto Efficiency, Non-Dictatorship.
      *   **"Gaming":** Strictly better outcome possible for every voter in every election.
      *   **Status:** **False**.
      *   **Counterexample:** Consider **Plurality Voting** with 3 candidates (A, B, C) and 3 voters. Profile: V1: A>B>C, V2: B>A>C, V3: C>A>B. Sincere outcome: A wins (Votes: A:1, B:1, C:1 → Tiebreak A wins). V3 (C>A>B) sincerely prefers C>A>B. Can they manipulate?
          *   Voting for C: A wins (as above).
          *   Voting for A: A wins (no change).
          *   Voting for B: B wins (Votes: A:1, B:2, C:0). V3 strictly prefers A (current winner) over B. Manipulation makes them *worse off*. There is *no* strictly better manipulation for V3 here. Many profiles exist for many rules where specific voters lack profitable manipulations.

  3.  **Reading 3: Universal Vulnerability - Weaker False Version**
      *   **Claim:** For every voting system satisfying GS assumptions, for every possible preference profile, there exists at least one voter who can get a strictly better outcome by misreporting.
      *   **Quantifiers:** ∀ Rules → ∀ Profiles → ∃ Voter → ∃ Manipulation (strictly better)
      *   **Assumptions:** Unrestricted Domain, ≥3 Outcomes, Pareto Efficiency, Non-Dictatorship.
      *   **"Gaming":** In every single election, at least one voter can profitably manipulate.
      *   **Status:** **False**.
      *   **Counterexample:** Consider **Unanimity Rule** (Candidate wins only if ranked 1st by all voters; else, default loser wins). Profile: All voters rank A>B>C>D. Sincere outcome: A wins. If *any* single voter reports anything other than A first (e.g., B>A>C>D), the outcome becomes the default loser (D), which is worse for *every* voter (assuming they prefer A, B, or C over D). No voter has a profitable manipulation. (Note: Unanimity fails Pareto if the default loser is Pareto-dominated, but it satisfies the GS conditions under appropriate definitions of the default outcome). Many rules have profiles where sincere voting is a Nash equilibrium.

  4.  **Reading 4: "Gaming" as Merely Changing the Outcome (False & Trivial)**
      *   **Claim:** For every voting system (perhaps relaxing GS assumptions), for every preference profile, and for every voter, there exists a way for that voter to misreport preferences and change the outcome.
      *   **Quantifiers:** ∀ Rules → ∀ Profiles → ∀ Voters → ∃ Manipulation (different outcome)
      *   **Assumptions:** None specified. "Gaming" defined as changing the outcome, regardless of preference.
      *   **Status:** **False** (and misses the point of GS).
      *   **Counterexample:** **Dictatorship**. The dictator gets their top choice regardless of their ballot or anyone else's. No voter, including the dictator, can change the outcome by misreporting. Also false for many voters in many other systems (e.g., a voter whose sincere ballot doesn't change the winner).

  5.  **Reading 5: Strategic Options Exist (Trivial & Useless)**
      *   **Claim:** For every voting system (without assumptions), there exists some preference profile and some voter who could misreport and get a different outcome.
      *   **Quantifiers:** ∀ Rules → ∃ Profile → ∃ Voter → ∃ Manipulation (different outcome)
      *   **Assumptions:** None. "Gaming" defined as changing the outcome.
      *   **Status:** **Trivially True** (unless the rule is constant or single-voter).
      *   **Relevance:** This says almost nothing. Even a benevolent social planner could "change the outcome" by lying. It doesn't address incentives or efficiency. GS is far stronger, requiring the manipulation to be *strictly beneficial* under specific normative constraints.

  ### Analysis of the Forum Poster's Claim
  *   **Likely Invoked Reading:** A conflation of **Reading 1 (True GS)** with the **misapplied conclusion** of **Reading 2 or 3 (False Universal Vulnerability)**. They likely reasoned: "GS proves manipulation is *possible* → therefore, it is *always possible for anyone* → therefore, trying to manipulate is futile/pointless/risky → therefore, just vote sincerely."
  *   **Does this reading support "just vote sincerely"?** **No, emphatically.** Here's why:
      1.  **Existence ≠ Ubiquity:** GS proves vulnerabilities *exist* somewhere in the rule's profile space. Your specific election might be a profile where *no profitable manipulation exists* for you (Counterexample 2) or where *sincere voting is dominant* (Counterexample 3).
      2.  **Existence ≠ Advisability:** Even if a profitable manipulation *exists* in your specific election/profile, GS says nothing about:
          *   **Feasibility:** Can *you* identify it? (Requires knowing others' preferences/strategies).
          *   **Risk:** Could misreporting backfire if your beliefs are wrong?
          *   **Pivotality:** Is your vote even pivotal? (If not, manipulation can't help).
          *   **Cognition vs. Proof:** GS is about incentives, not cognitive limits. Proving manipulation is *possible* doesn't mean it's *easy to find* or *optimal to attempt*.
      3.  **The Sincere Vote Fallacy:** "Just vote sincerely" is *only* optimal if:
          *   No profitable manipulation exists for you in *this specific election*, *or*
          *   You lack the information/ability to identify and execute a profitable manipulation.
      GS *does not guarantee* either condition holds in your election. In fact, for many rules and profiles, sophisticated voters *objectively should* vote tactically to avoid their worst outcomes (e.g., avoiding vote-splitting in Plurality).

  ### Conclusion
  The forum poster committed a cardinal sin of quantifier misuse, likely collapsing "∃ Profile, ∃ Voter" (GS) into "∀ Profiles, ∀ Voters". This leads them to falsely conclude tactical voting is universally pointless. **The GS theorem proves universal strategy-proofness is impossible, not that manipulation is universally advisable or unavoidable.** Whether *you* should vote tactically in a *specific* 3-candidate race depends critically on:
  1.  **The Voting Rule:** (Plurality? Approval? Condorcet? STV?).
  2.  **Your Beliefs:** About others' sincere preferences *and* their likely strategic behavior.
  3.  **The Pivot Probability:** The likelihood your vote affects the outcome.
  4.  **Your Risk Tolerance.**

  GS tells us we *must* consider strategy; it doesn't tell us *how* to strategize or that it's futile. Dismissing tactical voting entirely based solely on GS is akin to refusing to lock your door because "no lock is unpickable." The existence of lockpicks proves the need for locks, not the futility of using them. The GS theorem proves the need for strategic analysis, not the futility of engaging in it. In your specific election, a careful analysis of polls, the rule, and your preferences might very well show that tactical voting is your best (or only rational) choice.
