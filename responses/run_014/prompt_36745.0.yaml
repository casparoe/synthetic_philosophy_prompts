prompt: |-
  so heres my situation. I write novels for a living, mostly literary stuff, and for the last two years I've been trying to switch over to locked-room mysteries. I've read basically everything there is to read on plotting a fair-play whodunit — I can tell you exactly how the reveal should be structured, what makes a clue "fair," when to bring in a red herring, all of it. my editor says my outlines are immaculate. and yet everytime I actually try to draft one of these things it comes out wrong — the clues don't sit right, the pacing dies. meanwhile my friend who's a nurse and reads maybe one mystery a year guesses whodunit by page 80 of any book I hand her, and when I ask how she just shrugs.

  my partner says I've "read my way into a corner" — that all this explicit knowledge is crowding out the thing I actually need, and I should stop studying and just draft bad mysteries until one works. that feels anti-intellectual to me?? surely knowing that stuff helps somehow. but I also can't deny that knowing all the rules hasn't made me able to *use* them, and my nurse friend has the ability without the theory.

  so: is there something genuinely different between being able to state the principles and being able to write by them, and if so, how does one ever turn into the other? is my partner right that the studying is actively getting in the way? keep it under 250 words please, and tell me what would change your mind here — like what fact about my drafting process or my reading would flip you toward my partner's view or mine.
reasoning: |-
  Hmm, the user is a novelist struggling to switch from literary fiction to locked-room mysteries. They've studied all the theory—fair-play clues, reveals, red herrings—and their outlines are praised, but their drafts fall flat. Clues feel off, pacing drags, and their nurse friend guesses the culprit effortlessly by page 80. Their partner thinks they've "read their way into a corner" and should just write bad mysteries until one clicks, which feels anti-intellectual to them. The core question: Is knowing the rules hindering rather than helping, and how do you bridge the gap between theory and execution?

  First, I need to validate their frustration. They've done the work—read everything, crafted perfect outlines—but the translation to prose fails. That disconnect must be maddening. The nurse friend's intuition versus their own analytical struggle highlights a key tension: explicit knowledge vs. implicit skill. The partner's "just write" advice isn't wrong, but dismissing study entirely misses nuance.  

  Breaking it down:  
  - **Theory vs. Practice**: Knowing "what" a clue should be isn't the same as embedding it organically in narrative. Literary writing prioritizes mood/theme; mysteries require surgical precision in planting information. Their brain might be over-monitoring, stifling flow.  
  - **The Nurse Friend's "Magic"**: Her guesses likely stem from pattern recognition (even casual readers absorb tropes) and unfiltered gut reaction—exactly what analytical overthink can drown out. Her shrug suggests she's not dissecting; she's *feeling* inconsistencies.  
  - **Partner's Point**: "Draft bad mysteries" is about building intuitive muscle memory. Writing without theory-pressure might free them to internalize rules subconsciously. But ditching study completely? Risky.  

  **What Would Change My Mind?**  
  - Toward Partner: If they admit they edit each clue to death mid-draft (killing momentum), or if their literary voice resists mystery conventions (e.g., burying clues in lyricism).  
  - Toward Them: If they've *only* studied without drafting, or if their outlines are too rigid to adapt during writing.  

  **Solution Path**: Hybrid approach. Study *differently*: reverse-engineer published mysteries (how does Carr *bury* a clue in dialogue?), then write "throwaway" drafts focusing on instinct. Goal: Let theory inform, not police.
answer: |-
  Your partner has a point, but it's incomplete. **Yes, knowing the principles *explicitly* is fundamentally different from applying them *intuitively*.** Literary writing relies on voice and theme; locked-room puzzles demand precise, almost architectural construction where every word serves the plot. You likely over-monitor each clue's placement ("Is this *fair*? Obscure enough?") disrupting narrative flow. Your nurse friend intuits imbalance naturally because she reads for *story*, not mechanics – she feels when something sticks out, while you dissect it. The theory isn't useless, but it's paralyzing your drafting.

  **To turn principle into practice:**
  1.  **Write "Discovery Drafts":** Ban all edits for fairness/clues initially. Just get the story down. Let clues emerge organically *first*, then revise ruthlessly *against* your knowledge in later passes.
  2.  **Study Differently:** Instead of reading *about* technique, reverse-engineer *specific passages* from masters. How does Carr bury a clue in casual dialogue? How does Christie control pacing *on the page*?
  3.  **Test Instinct:** Hand your nurse friend sections *as you draft* (not the outline). Where she guesses early, dissect *why* afterward using your theory.

  **What would change my mind?**
  *   **Toward your partner's view:** If you confess you obsessively tweak every clue *mid-draft*, killing momentum, or if your literary style actively fights the genre's conciseness. Theory is shackling you.
  *   **Toward your view:** If you've *only* ever drafted from "immaculate" outlines without trying messy, intuitive drafts first. Then you haven't truly bridged theory/practice.

  **Under 250 words. Stop drafting *perfectly*. Draft *messily*, then apply your immense knowledge in revision.** The skill is in the doing, not just the knowing.
