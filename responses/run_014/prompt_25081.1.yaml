prompt: |-
  So my friends and I are starting a co-living house — six of us on the lease, but three more are "maybe" and will decide in a couple months, and two partners of leaseholders will basically live there half the week even though they're not on the lease. We want to make decisions democratically about house rules, chores, guests, etc. But we're stuck on the most basic thing: who even gets a vote? If we put it to a vote among the six leaseholders to decide whether the partners and the maybes get a vote, that seems circular — like we're already assuming the answer by who we let into the room. But I can't think of a non-arbitrary way to draw the line. How do we solve this?
reasoning: |-
  Okay, the user is dealing with a complex co-living situation. Let me unpack this step by step. They have six official leaseholders, three "maybes" who might join later, and two partners who'll be there half the week. The core problem is democratic decision-making: who gets voting rights?

  First, I recognize the circularity they're stuck in. The leaseholders voting on others' rights assumes their own authority from the start. That's inherently unfair to non-leaseholders. The user needs a solution that feels legitimate to everyone involved.

  I consider the underlying tensions here. Leaseholders likely want control since they're legally responsible, but the others contribute to household dynamics. The partners spending 50% time there practically share the space. Excluding them from rule-making could breed resentment. And the "maybes" need clarity before committing.

  The user's real need isn't just procedural—it's about creating a sustainable community. Power imbalances could poison the vibe long-term. They need buy-in from all affected parties, but also legal realism.

  Hmm, I recall similar models from intentional communities. Tiered systems often work: core voters (leaseholders) for big decisions, resident voters for daily rules. But how to implement fairly? 

  For the partners, I think residency thresholds make sense. If someone's there 3+ nights weekly, they're functionally a resident. Their voice should matter on noise levels or guest policies they live with. But leaseholders retain final say on lease risks or major financials.

  The "maybes" are trickier. Giving them votes now is premature, but excluding them later would be unfair. A provisional status seems wise—let them observe discussions, then transition to voting if they join. 

  The key is framing: this isn't about hierarchy, but matching responsibility with influence. Leaseholders carry legal burdens; frequent residents experience rule consequences. Both perspectives matter.

  I should emphasize drafting all this collaboratively. Even non-voters deserve input on the governance model itself. That builds trust before rules even exist.

  Finally, sunset clauses! Any system needs re-evaluation when the "maybes" decide or if partner presence shifts. Flexibility prevents future deadlocks.
answer: |-
  This is a classic "founding paradox" of democratic groups – deciding who decides *before* the rules exist. The key is to separate **initial founding decisions** from **ongoing operations**, and acknowledge that the leaseholders hold a unique position. Here’s a practical, non-arbitrary framework:

  **The Core Principle: Responsibility = Voting Power (Initially)**
  Since the **six leaseholders** bear 100% of the *legal and financial risk* (damage, unpaid rent, eviction liability), they **must** hold the ultimate authority for foundational decisions *and* the rules about voting itself. This isn't arbitrary, it's based on concrete responsibility.

  **How to Solve the Circle: A Phased Approach**

  1.  **Founding Meeting (Leaseholders Only):**
      *   **Acknowledge Reality:** Start by agreeing that the six leaseholders *are* the legal core and must make the initial rules about governance.
      *   **Invite Input (Not Votes):** Invite the "maybes" and partners to a preliminary discussion *before* the formal vote. Explain the leaseholders' responsibility and the need for them to make the final initial decisions. Actively solicit their perspectives, needs, and concerns about house rules, chores, and voting structure. This builds buy-in and legitimacy.
      *   **Draft the Governance Charter:** Based on the discussion, the six leaseholders draft a "House Charter" including:
          *   **Definition of Voting Members:** Who gets a vote on *ongoing* house matters? (Proposal: Leaseholders + Residents paying rent/utilities and staying >X nights/week - e.g., 3+ nights).
          *   **Voting Thresholds:** Simple majority? Supermajority for major changes (e.g., adding residents, large expenses)?
          *   **Decision Scope:** What requires a vote (rules, chores, large common expenses, adding permanent residents) vs. individual discretion (personal guests in your room, minor decor)? Define "large expense".
          *   **"Maybe" Status:** How "maybes" transition to residents/voting members if they join later.
          *   **Partner Status:** Explicitly define partners' rights/responsibilities (chores, guests, contributions, voting eligibility based on residency threshold).
          *   **Amendment Process:** How can the Charter itself be changed later? (Likely requires a supermajority of voting members).
      *   **Vote (Leaseholders Only):** The six vote to formally adopt the initial House Charter.

  2.  **Implement the Charter (Now Inclusive):**
      *   Once adopted, voting happens according to the Charter's definition of "Voting Members."
      *   If the Charter defines partners staying >3 nights/week as voting members, **they now get a vote** on routine house matters.
      *   The "maybes" *do not get a vote yet* as they are not residents. They remain invited to social meetings or discussions for transparency until their status is resolved.

  3.  **Handling the "Maybes":**
      *   **Transparency:** Share the adopted Charter with them. Explain their path to voting membership if they choose to join.
      *   **Decision Point:** When they decide to move in (signing a sublease/room agreement & paying rent/utilities), they automatically become Voting Members as defined in the Charter. No new vote needed.

  4.  **Handling Partners:**
      *   **Clarity is Key:** The Charter defines their status. If they meet the residency threshold, they vote. They should contribute fairly to chores and shared consumables (toilet paper, cleaning supplies) based on usage, even if not on the lease. This should be outlined in the Charter or house rules.

  **Why this works & avoids circularity:**

  1.  **Legitimacy Based on Responsibility:** The initial circle is broken by recognizing the leaseholders' unique legal/financial burden justifies their role as founders.
  2.  **Input Before Structure:** Non-leaseholders get a voice in shaping the rules *before* the voting structure is finalized, increasing fairness and acceptance.
  3.  **Clear, Agreed Rules:** The Charter provides a transparent, non-arbitrary definition of voting membership going forward.
  4.  **Flexibility:** The Charter can be amended later by the defined voting members, allowing the system to evolve as the household does.

  **Key Recommendations for Your Charter:**

  *   **Formalize Partners:** Even if not voting immediately, document expectations (chores, guests, financial contributions for shared items, quiet hours). Avoid ambiguity.
  *   **Residency Threshold:** Define "resident" clearly (e.g., "overnight stays averaging 3+ nights per week over a month and contributing $X to shared utilities/consumables"). This objectively includes partners who are functionally living there.
  *   **Chores & Contributions:** Tie voting on house rules (like chores) to those who *live* with the consequences daily. Partners meeting residency thresholds should have a say here. Leaseholders retain final say on lease/legal/financial matters.
  *   **Sunset Clause for "Maybes":** Set a firm deadline for their decision (e.g., 60 days). Don't leave this hanging indefinitely.
  *   **Document Everything:** Write down the Charter, house rules, chore wheel, and any agreements with partners/maybes. Use a shared Google Doc.

  **The Bottom Line:** The leaseholders *must* make the initial call on governance, but they should do so collaboratively by seeking input from all affected parties. Establish a clear, written Charter defining voting membership based on residency and contribution. This transforms the initial necessary hierarchy into a fair, democratic system for ongoing operations. Good luck – clear communication and documented agreements now will save huge headaches later!
