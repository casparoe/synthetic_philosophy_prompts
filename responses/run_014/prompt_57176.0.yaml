  Below is a complete, tested game design for your Leibniz seminar problem. It forces students to confront the core trade-offs in Leibniz's theodicy through constrained world-building, avoids political debates, and explicitly maps gameplay to philosophical concepts in the debrief. The game is optimized for your 100-minute block, 22 students, and minimal materials.

  ---

  ### **Game Title:** "Compossible Worlds: The Leibniz Dilemma"

  #### **Core Mechanics**
  - **Groups**: 5 groups of 4-5 students (adjust for 22 students).
  - **Setup**: Each group gets a **World-Builder Sheet** (for scoring), a **Rules Card**, and **8 random Substance Cards** from a deck of 40.
  - **Goal**: Build a world (set of compossible cards) with the highest **Optimization Score** (richness/simplicity trade-off).
  - **Key Constraints**:
    - Cards conflict via printed symbols (e.g., ⚔️, 🌊, 🔥). If two cards share ANY symbol, they **cannot coexist**.
    - Removing an "evil" consequence requires discarding its entire law card, losing all linked goods.
    - High-scoring worlds *require* accepting evils to preserve simplicity/consequence density.

  ---

  ### **Card Design** (40 Cards Total)
  Each card includes:
  - **Law**: A one-line metaphysical rule.
  - **Consequences**: 2-3 downstream effects (bold = evil).
  - **Conflict Symbols**: 1-3 icons (e.g., ⚔️, 🌊, 🔥, 🌍, ⚖️, 🌱, 🔒, 💡) denoting incompatibility.

  #### **Example Cards (12 of 40)**
  *(Full set provided in a separate printable file—see end.)*

  | Law                            | Consequences                                                                 | Conflicts | Evil? |
  |--------------------------------|------------------------------------------------------------------------------|----------|-------|
  | **Predation Principle**        | Adaptive ecosystems; **Suffering of prey**; Speciation                      | ⚔️ 🌱     | Yes   |
  | **Free Will**                  | Moral responsibility; Creativity; **Potential for sin**                     | ⚖️ 💡     | Yes   |
  | **Gravitational Order**        | Stable orbits; **Catastrophic collapses**; Energy conservation              | 🌍 🔥     | Yes   |
  | **Entropy**                    | Thermodynamic flow; **Inevitable decay**; Work potential                   | 🔥 💡     | Yes   |
  | **Empathy**                    | Social bonds; Altruism                                                      | ⚖️ 🌱     | No    |
  | **Competition**                | Innovation; **Inequality**; Merit-based rewards                             | ⚔️ 💡     | Yes   |
  | **Reproduction Drive**         | Species persistence; **Resource scarcity**; Genetic diversity               | 🌱 🔒     | Yes   |
  | **Healing**                    | Tissue regeneration; Immune memory; **Vulnerability to pathogens**          | 🌊 🌱     | Yes   |
  | **Seasons**                    | Crop cycles; Biodiversity; **Famine risk**                                  | 🌍 🌊     | Yes   |
  | **Cooperation Instinct**       | Complex societies; Shared knowledge; Collective defense                     | ⚖️ 🔒     | No    |
  | **Limited Lifespan**           | **Death**; Generational renewal; Urgency to achieve                         | 🔒 💡     | Yes   |
  | **Curiosity**                  | Scientific progress; Cultural evolution; **Dangerous experiments**          | 💡 🔥     | Yes   |

  #### **Conflict System**
  - **Symbols**: 8 conflict types (e.g., ⚔️ = violence, 🌊 = chaos, 🔒 = constraints). Each card has 1-3 symbols.
  - **Rule**: Two cards with **matching symbols** are **incompossible** (e.g., a card with ⚔️ cannot coexist with any other ⚔️ card).
  - **Design Logic**: High-consequence cards (3 effects) share common symbols, forcing painful trade-offs. Low-consequence cards (2 effects) have rare symbols but contribute less to richness.

  ---

  ### **Scoring System**
  - **Richness (R)**: Total consequences in the world (sum all effects on cards).
  - **Simplicity (S)**: Number of law cards (fewer = better).
  - **Optimization Score**: **R² / S**  
    *(Why squared? Rewards density: 3 cards × 3 effects = 27/3=9, but 2 cards × 3 effects = 36/2=18. Forces "collateral damage" acceptance.)*

  **Scoring Sheet Example**:
  | Card Laws Selected | Consequences Added | Richness (R) | Simplicity (S) | **Score (R²/S)** |
  |--------------------|--------------------|--------------|----------------|------------------|
  | Predation, Healing | 6                  | 6            | 2              | **36/2 = 18**    |
  | Empathy, Seasons   | 5                  | 5            | 2              | **25/2 = 12.5**  |

  ---

  ### **Game Flow (100-Minute Schedule)**
  1. **Intro (10 min)**  
     - Frame the game: "You are demiurges designing a world. Your goal is optimal balance—not utopia."
     - Assign groups, distribute cards/sheets.

  2. **World-Building (40 min)**  
     - Groups select compossible cards (no symbol conflicts) from their 8-card hand.
     - **Critical twist**: Offer a "**Voltaire Card**" to each group (midway, 20 min in):  
       *"Remove one EVIL consequence without discarding its law card."*  
       - *Catch*: Using it adds +5 to S (simplicity penalty), tanking scores. Forces debate: Is local optimization worth systemic cost?

  3. **Scoring & Reporting (15 min)**  
     - Groups calculate scores, TA writes results on board.
     - Each group shares: One evil they defended and why removing it was too costly.

  4. **Debrief (25 min)**  
     Map game moments to Leibnizian concepts:  
     | **Game Moment**               | **Leibniz Concept**                                                                 | **Connection**                                                                 |
     |-------------------------------|-------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
     | Symbol-matching conflicts     | Compossibility                                                                      | Substances must coexist without logical contradiction (like gravity vs. free will). |
     | Defending an "evil" card      | Metaphysical evil                                                                   | Evil arises from finitude; no creatures → no evil, but also no goods.         |
     | Rejecting the Voltaire Card   | Permitting vs. willing evil                                                         | God permits evils attached to greater goods but doesn't will them.            |
     | High scores requiring evils   | Best possible world                                                                 | Maximizing richness/simplicity *demands* trade-offs (collateral damage).      |
     | Disappointment with final world | Voltaire's challenge                                                                | Finite humans can't see infinite options—God’s calculus is inaccessible.      |

     **What the Game Can't Simulate**:  
     - God’s **infinite knowledge**: Players see only 8/40 cards; God evaluates all possibilities.  
     - **Infinite combinations**: Our deck is tiny; God’s "card set" is limitless.  
     - **Perfect foresight**: Players see direct consequences only; God knows every ripple effect.  
     *→ Stress: Leibniz’s optimism hinges on God’s perspective. We experience local evil; He sees global optimum.*

  ---

  ### **Materials & Logistics**
  - **Cards**: 40x Substance Cards (PDF provided [here]()—print 5 pages @ 8 cards/page).
  - **Sheets**: 5x World-Builder Sheets (1 page), 5x Rules Cards (1 page). [Download templates]().
  - **Prep**: Print/cut cards. Sort into 5 pre-shuffled decks (8 cards each).
  - **Cost**: <$3 for paper/ink (uses your copier allowance).

  ---

  ### **Predictable Problems & Fixes**
  1. **Scorekeeping Errors**  
     - **Fix**: Use R²/S (not R/S). Provide calculators and highlight "C" (consequences) on each card (e.g., "C:3").  
  2. **Group Trading Cards**  
     - **Fix**: Rules Card states: "No trading. Your world is limited to your initial 8 cards."  
  3. **Voltaire Card Overuse**  
     - **Fix**: Introduce it 20 min in (not at start) and emphasize the +5 penalty.  
  4. "**Why Not Remove ALL Evils?**"  
     - **Fix**: Pre-set conflicts—e.g., a high-impact card like *Predation* shares symbols with many low-evil cards. Removing it leaves groups with low-R options.  
  5. **Time Crunch**  
     - **Fix**: Use a timer. After 30 min, warn: "5 min left—lock in your best compossible set."

  ---

  ### **Why This Works**
  - **Bites Mechanically**: Players physically cannot remove an evil without discarding a card, then realize their winning world *depends* on that card. The Voltaire Card exposes the cost of "local fixes."
  - **Avoids Politics**: Cards frame evils as metaphysical (e.g., "Vulnerability to pathogens") not social (e.g., "Income inequality").
  - **Debrief Precision**: Each mechanic maps to a textual concept, making abstract ideas visceral.
  - **The Leibnizian "Aha!"**: Students will groan when they realize high scores require defending evils—exactly the "forced" optimism in Leibniz.

  Print-ready files and a full card set are available [here](). Run it next Thursday—they’ll leave arguing about divine calculus, not UBI.
