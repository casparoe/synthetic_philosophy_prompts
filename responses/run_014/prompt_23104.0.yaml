prompt: |-
  I chair my university's research ethics board, and we've just received a proposal from a legal-psychology lab. The lab wants to survey employees of two companies: one whose CEO, in announcing a merger, said he was "deeply concerned" about the layoffs it would cause, and one whose CEO, in announcing a restructuring, said he was "proud" of the new scholarship fund it would create. Respondents would be shown each CEO's statement and asked whether the CEO "intended" the layoffs, or "intended" the scholarship. The lab says the results will help a state legislature draft a statute distinguishing intentional from merely foreseen harms in corporate liability, and a senator is waiting on their findings. Half the board thinks this is a straightforward survey of ordinary language. The other half, including me, worries that the very question — "did she intend this bad thing?" — pushes respondents toward "yes" in ways that "did he intend this good thing?" does not, so that the answers track the valence of the outcome rather than anything in the CEO's mind, and that the statute would be built on a measurement artifact. Draft the board's decision memo — approve, reject, or approve with conditions — with a clear bottom line, reasoning the researchers could actually respond to, and a fair account of the strongest reason to run the study as proposed.
reasoning: |-
  Okay, the user chairs a university research ethics board and needs help drafting a decision memo for a research proposal. The proposal involves surveying employees about CEOs' intentions regarding layoffs (bad outcome) versus scholarships (good outcome), with potential implications for legislation. 

  Hmm, this is tricky. The researchers claim it's a simple language survey, but the asymmetric valence of outcomes raises serious methodological concerns. The core ethical dilemma lies in whether flawed data could negatively impact legislation. 

  First, I need to unpack the key tension: the board is split between seeing this as benign linguistics versus a valence-skewed design. The user's concern about "measurement artifact" seems valid - asking about "intending bad things" primes moral condemnation regardless of actual mental states. Legal psychology studies show outcome bias heavily influences intentionality judgments.

  Wait, the legislative angle complicates things. A senator waiting on results creates time pressure, but rushing flawed data for policymaking is dangerous. The memo must acknowledge this urgency while upholding research integrity. 

  For the decision structure: Outright rejection feels disproportionate since the question is valid scientifically. But unconditional approval risks embedding bias in statute language. Conditional approval with mitigation strategies seems wisest - perhaps adding neutral scenarios or counterbalanced wording.

  Biggest challenge will be framing criticisms constructively. The researchers likely genuinely believe in their design. The memo should credit their legislative intentions while firmly addressing the valence confound. Maybe suggest they pilot-test alternative phrasings to demonstrate the artifact?

  Also must consider employee participants. The scenarios aren't traumatic, but asking about layoffs could cause mild distress. Standard consent protocols should suffice here since the risk is low. 

  The conditional approval route satisfies all concerns: allows research to proceed, improves methodology, and alerts legislators to limitations. Final memo should emphasize this isn't about blocking research but ensuring it's robust enough for real-world impact.
answer: |-
  ## MEMORANDUM  
  **To:** Legal-Psychology Lab (PI: [Name])  
  **From:** University Research Ethics Board (UREB)  
  **Date:** October 26, 2023  
  **Subject:** Decision on Proposal #RP-2023-078: "Perceptions of Corporate Intentionality in Harm/Benefit Contexts"  
  **Bottom Line:** **Approved with Mandatory Modifications**  

  ### I. Decision
  The UREB approves your proposal contingent on the implementation of significant methodological modifications outlined in Section IV. The study may **not** proceed as currently designed due to concerns regarding construct validity and potential measurement artifact. Approval is granted on the condition that the revised protocol addresses these concerns and is submitted for expedited re-review within 14 days.

  ### II. Summary of Proposal
  The study proposes surveying employees from two companies to assess perceptions of CEO intentionality regarding:  
  (A) Layoffs (negative outcome) following a merger announcement expressing "deep concern."  
  (B) A scholarship fund (positive outcome) following a restructuring announcement expressing "pride."  
  The stated aim is to inform state legislation on corporate liability for "intentional" vs. "foreseen" harms.

  ### III. UREB Deliberation & Reasoning
  The Board acknowledges the study's potential significance for legislative drafting and commends the lab's engagement with applied legal policy. We recognize the argument that this appears to be a "straightforward survey of ordinary language" undergirding legal concepts.

  **However, a majority of the Board holds significant concerns about the proposed methodology's ability to validly measure perceptions of *intentionality* as distinct from *moral evaluation of outcomes*.** Our reasoning, which we believe offers actionable critique for the researchers, is as follows:

  1.  **Fundamental Asymmetry & Valence Confound:** The core concern is the inherent asymmetry between the two scenarios:
      *   **Scenario A (Layoffs):** Involves a universally recognized *harm* (job loss). The question "Did the CEO *intend* the layoffs?" inherently carries moral weight. Research in moral psychology (e.g., Knobe Effect, outcome bias, side-effect effect) robustly demonstrates that people are significantly more likely to attribute *intentionality* to negative outcomes, even when the agent expresses countervailing attitudes ("deep concern") or the outcome is described as a known side-effect rather than a primary goal. The question itself, due to the negative valence of the outcome, likely primes a search for blameworthiness, conflating "intention" with "culpability for causing harm."
      *   **Scenario B (Scholarship):** Involves a universally recognized *benefit*. The question "Did the CEO *intend* the scholarship?" lacks the same inherent moral charge. Attributing intention for benefits is less tied to culpability and may be more readily parsed as a question of primary purpose vs. side-effect or motive. The expression of "pride" aligns neatly with positive attribution.
      *   **Resulting Artifact:** This asymmetry creates a high risk that the observed difference in "intentionality" attributions between the two scenarios will primarily reflect the *valence of the outcome* (harm vs. benefit) and associated blame/praise dynamics, rather than any meaningful difference in respondents' perception of the CEOs' actual mental states *as described in the statements*. The proposed design does not adequately control for this confound. Building legislation on data potentially dominated by this artifact could lead to an imprecise or unjust statute.

  2.  **Lack of Neutral Control/Comparison:** The design lacks scenarios or questions that could isolate the impact of valence. For instance, there is no neutral/benign outcome or a harm framed as a necessary means to a greater good with clear intent stated. Without such controls, disentangling perceived intention from outcome evaluation is methodologically impossible.

  3.  **Ecological Validity & Generalization:** While using real statements enhances realism, the focus on only two highly affectively charged outcomes limits generalizability. Intentionality judgments in corporate contexts may vary significantly depending on the type of harm/benefit, scale, context, and stated justification, none of which are explored here. Legislators risk overgeneralizing from a very specific, valence-confounded result.

  4.  **Risk in Legislative Application:** The Board recognizes the urgency signaled by the Senator's interest. Precisely *because* the findings are intended for immediate legislative application, the imperative for methodological rigor and clear construct validity is heightened. Deploying findings potentially confounded by a well-documented psychological artifact into statute carries significant societal risk.

  ### IV. Mandatory Modifications for Approval
  To mitigate the valence confound and strengthen construct validity, the following modifications are required:

  1.  **Incorporate Neutral/Balanced Scenarios:** Add at least two additional CEO statement/outcome pairs:
      *   A "Neutral Harm": E.g., A CEO announces a necessary plant relocation (acknowledging disruption as an unfortunate necessity) to avoid bankruptcy, saving most jobs. Outcome: Relocation Disruption. Question: Did the CEO *intend* the disruption?
      *   A "Neutral Benefit": E.g., A CEO announces opening a new efficient warehouse (stating pride in cost savings) in a location chosen partly for logistics. Outcome: Reduced shipping times for customers (a clear benefit, but not a primary philanthropic act). Question: Did the CEO *intend* the reduced shipping times?
      *   *(Rationale: Allows comparison of intentionality attributions across positive, negative, and more neutral outcomes, helping isolate the valence effect.)*

  2.  **Vary Framing Within Valence:** For *each* valence category (harm, benefit), include scenarios where:
      *   The outcome is stated as the *primary goal*.
      *   The outcome is stated as a *known side-effect/foreseen consequence* (even if welcomed or regretted).
      *(Rationale: Tests if perceived intentionality tracks stated purpose vs. mere foreseeability, independent of valence.)*

  3.  **Counterbalance Question Wording (Pilot Required):** Pilot test alternative question phrasings designed to reduce demand characteristics around blame. Examples:
      *   "Was causing [outcome] a primary goal of the CEO's decision?"
      *   "Did the CEO specifically aim to bring about [outcome]?"
      *   "Was [outcome] part of the CEO's plan?"
      *   Compare results to the direct "intend" wording. Use the phrasing(s) showing the least evidence of valence bias in the pilot for the main study.
      *(Rationale: Probes whether the artifact is tied to the specific word "intend" in a blame context.)*

  4.  **Explicitly Measure Outcome Valence Perception:** Include a direct question *after* the intentionality judgment for *each* scenario: "How negative/positive do you perceive the outcome of [outcome] to be?" (1-7 scale). *(Rationale: Allows statistical control for individual differences in valence perception when analyzing intentionality judgments.)*

  5.  **Strengthen Limitations Section:** The final report *must* include a prominent and detailed discussion of:
      *   The potential for outcome valence to bias intentionality attributions (citing relevant literature like Knobe).
      *   The specific steps taken in the modified design to mitigate this confound.
      *   The limitations of survey methodology in accessing true "mental state" perceptions.
      *   A clear statement that findings reflect *perceptions* influenced by multiple factors, not necessarily the legal or philosophical concept of "intention" itself.
      *   A caution against overgeneralizing the results, especially given the specific scenarios used.

  ### V. Strongest Reason for the Study (as Acknowledged by the Board)
  The UREB recognizes the compelling argument for conducting the study *as proposed*: **Legislative Urgency and Ecological Validity.** Legislators need empirical insights into how ordinary people (potential jurors, stakeholders) interpret corporate language regarding harms and benefits when making intuitive judgments about "intention." Using real-world statements from actual corporate events provides high ecological validity for this specific context. Delaying the study to implement complex controls could hinder timely input into an important legislative process. The core question *is* how people use the word "intend" in these affectively charged contexts, even if that usage is biased, as this reflects the "ordinary language" reality the statute might regulate. There is value in capturing this raw perception, provided its potential biases are clearly acknowledged.

  ### VI. Conditions & Next Steps
  1.  Submit a revised protocol incorporating all modifications outlined in Section IV within **14 days** for expedited re-review by the UREB Chair and designated methodologist.
  2.  The consent process must clearly state the study examines perceptions of corporate decisions, including potentially negative outcomes like layoffs, and provide appropriate support resources.
  3.  The final report to the Senator and any legislative testimony **must** explicitly include the limitations mandated in point V.5 above.
  4.  Approval is contingent on successful piloting of question phrasings (Modification 3); results must be included in the re-submission.

  We appreciate the importance of your work and believe these modifications will strengthen the study's scientific rigor and policy relevance while directly addressing the Board's ethical and methodological concerns. We are available for a meeting to discuss these requirements.

  **[Signature]**  
  Dr. [Your Name], Chair  
  University Research Ethics Board
