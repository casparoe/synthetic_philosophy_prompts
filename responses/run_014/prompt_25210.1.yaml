prompt: |-
  I've been teaching an undergraduate ethics seminar this semester, and we spent the last three weeks working through the paradox of deontology. I thought I understood my own position going in, but the more cases we worked through in class, the less sure I became. The paradox, stated quickly, is that deontological constraints seem to forbid an act type — killing, lying, torturing — even when performing one instance of that act would prevent many more instances of the very same act type. But if the act type is genuinely worth constraining, shouldn't you want fewer instances of it overall? And if not, what exactly does the constraint amount to — a kind of fetishism about keeping one's own hands clean?

  I sat down and wrote out my honest, pre-theoretical verdicts on a set of cases that came up in discussion, plus a couple I added myself. Here they are:

  1. **Push.** A runaway trolley will kill five people unless I push a large stranger off a footbridge, killing him but stopping the trolley. Verdict: impermissible. I may not push.

  2. **Shooter.** A gunman in a café is about to kill five people. The only way to stop him in time is to shoot him dead. Verdict: permissible. This feels fundamentally different from Push, and I'm confident about it.

  3. **Intermediary.** A killer has captured five people and will shoot them unless I personally kill a sixth innocent person. (The killer wants to make me complicit; if I refuse, he kills the five and releases the sixth unharmed.) Verdict: impermissible. I cannot kill the one, even to save five from being murdered.

  4. **Lying to a Murderer.** The classic case: a murderer asks where my friend is, and I lie, saying she's out of town. Verdict: permissible. Lying is a lesser wrong than killing, and the stakes clearly justify it here.

  5. **Five Lies.** I could tell one lie that would prevent five other people from telling lies of comparable seriousness — say, lies on job applications about fabricated credentials. Verdict: impermissible. This feels wrong even though the arithmetic is the same as in the murderer case: one lie prevents five. Something about the fact that what I'm preventing is merely lying, rather than murder, seems to matter.

  6. **Self-Defense Against One's Own Future Violations.** I've been dosed with a drug that, in one hour, will cause a psychotic episode during which I will kill five innocent people. The only antidote requires me to kill one innocent person right now. Verdict: I am genuinely torn. If agent-relativity is what separates Shooter from Push — I may kill the threat himself, but not an innocent bystander — then shouldn't this case be more like Shooter? The five future killings would be my own, and agent-relative constraints are supposed to give me special reason to avoid my own violations. Yet the case feels much closer to Push.

  7. **Torture.** A terrorist has planted a bomb in a crowded city. Torturing him will reveal its location and save hundreds. Verdict: impermissible. Torture is categorically wrong.

  8. **Torture to Prevent Tortures.** Same setup, except the bomb is not an explosive but a device that will slowly torture a hundred people to death. Verdict: still impermissible. But I notice this makes me more uncomfortable than Push does, and I'm not sure why — if anything, the symmetry between act and prevented harm should make the tradeoff more tempting, not less.

  I'm trying to figure out whether a single principle can capture all or most of these verdicts, or whether I need to abandon some. In particular, I want to know: what is the best precise statement of a deontological constraint that fits my pattern of verdicts? Which clauses are motivated by which cases? Which of my verdicts does the principle force me to revise, and what does it predict about the drug case that has me stuck? And does the resulting principle actually resolve the paradox, or does it just relocate the tension? Please take a definite position — propose a specific principle and defend it, rather than surveying the menu of options.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're teaching an ethics seminar and grappling with the paradox of deontology. They've presented eight cases with their intuitive verdicts and are seeking a unifying principle that explains most of them without major revisions. The core issue is that deontological constraints forbid certain actions even when doing so would prevent more instances of the same wrong, leading to a paradox.

  First, I need to analyze each case and identify patterns. The user's verdicts show a distinction between harming a direct threat (Shooter) versus an innocent bystander (Push, Intermediary). Torture is categorically forbidden regardless of consequences. Lying is permissible to prevent murder but not to prevent other lies. The drug case (Self-Defense) is where they're stuck, feeling torn.

  Looking deeper, the user might be struggling with the tension between agent-relativity and minimizing overall harm. They need a principle that upholds constraints without reducing them to "fetishism." The agent-relativity in Shooter suggests that targeting the aggressor is key. In Intermediary, the constraint against becoming complicit is strong, even to prevent more harm. 

  For the drug case, the future victims aren't current threats, so it's more like Push. Torture cases emphasize that the act itself is inherently wrong, regardless of symmetry. The lying cases show that constraints are stronger when preventing the same type of wrong, but only if the prevented wrong is severe enough to override the constraint.

  The proposed principle combines agent-relativity (only targeting aggressors), non-complicity, and a threshold for overriding constraints based on the severity of harm prevented. This explains why lying to a murderer is okay (prevents grave harm) but not Five Lies (prevents lesser harm). Torture is always forbidden because no threshold is high enough to override its categorical wrongness.

  The user's discomfort in Torture to Prevent Tortures might stem from the symmetry making the trade-off tempting, but the principle holds firm due to torture's absolute prohibition. The paradox is resolved by differentiating between minimizing harm and maintaining moral integrity through constraints that reflect our relationship to the act and others' agency.

  I should ensure the principle addresses cases like Intermediary by emphasizing non-complicity, and clarifies the drug case by treating the future self as an aggressor only when imminent. This maintains consistency without abandoning core intuitions.
answer: |-
  Based on your verdicts and the need for a unifying principle that resolves the paradox without collapsing into consequentialism or pure "clean hands" fetishism, I propose the following principle:

  **The Aggressor-Targeting, Non-Complicity, Threshold Constraint Principle (ANT Principle):**

  1.  **Agent-Relative Constraint:** I am categorically prohibited from *intentionally* causing (or directly enabling) certain types of grave harm (e.g., killing, torturing) to an **innocent non-aggressor**.
  2.  **Aggressor Exception:** The constraint is lifted when the harm is inflicted *on an unjust aggressor* as a *necessary and proportionate* means to prevent that aggressor from *imminently* causing greater harm to others.
  3.  **Non-Complicity Clause:** The constraint strictly forbids becoming an *instrumental participant* in an *unjust scheme of harm* initiated by another agent, even to prevent similar or greater harms by that same agent.
  4.  **Threshold Override for Lesser Evils:** The constraint against causing a *lesser* type of harm (e.g., lying) *can* be overridden *only* when:
      *   It is necessary to prevent a *significantly graver* type of harm (e.g., murder) by an identifiable agent, *and*
      *   The prevented harm is of a type whose gravity clearly outweighs the gravity of the constrained act.
      *   *(This override does *not* apply to the gravest constraints like killing innocents or torture).*

  **Application to Your Cases & Defense of the Principle:**

  1.  **Push: Impermissible. Fits Principle.**
      *   The large stranger is an **innocent non-aggressor**. Pushing him intentionally kills him to save others. Violates Clause 1. No aggressor is targeted (Clause 2 fails). You are not preventing the trolley (an inanimate threat) from being an aggressor; you are using an innocent person as a tool. Clause 4 doesn't apply to killing innocents.

  2.  **Shooter: Permissible. Fits Principle.**
      *   The gunman is an **unjust aggressor** *imminently* about to kill five. Shooting him is a *necessary and proportionate* means to prevent his aggression. Falls under Clause 2. Clause 1 is lifted.

  3.  **Intermediary: Impermissible. Fits Principle.**
      *   You are ordered to kill an **innocent non-aggressor** (violates Clause 1). You are being made an *instrumental participant* in the killer's *unjust scheme* (violates Clause 3). Even though preventing murders, the means involve becoming complicit in murder yourself. No aggressor is targeted by you (Clause 2 fails – the killer isn't threatened by your act). Clause 4 doesn't apply.

  4.  **Lying to a Murderer: Permissible. Fits Principle.**
      *   Lying is a *lesser harm*. You lie to prevent the *significantly graver harm* of murder by an identifiable aggressor. This meets the Threshold Override (Clause 4). The prevented harm (murder) clearly outweighs the constrained act (lying).

  5.  **Five Lies: Impermissible. Fits Principle.**
      *   Lying is a *lesser harm*. However, you are lying to prevent *other people* from committing the *same type of lesser harm* (lying). Clause 4 requires preventing a *significantly graver* harm type. Preventing lies with a lie doesn't meet this threshold; the harms are symmetric. This feels like an attempt to "minimize violations" of a constraint, which the principle rejects as insufficient to override the constraint itself. Purity of hands isn't sufficient justification.

  6.  **Self-Defense Against One's Own Future Violations: Impermissible (Leaning towards Push). Principle Predicts Impermissible.**
      *   *Principle's Prediction:* Killing the one person now targets an **innocent non-aggressor** (violates Clause 1). Your *future* self is the aggressor, but it is *not yet imminent* (Clause 2 requires imminence). You are not *currently* an unjust aggressor posing an imminent threat; you are a future threat due to an altered state. Killing the innocent now is a pre-emptive strike on a bystander to prevent *your own future wrongdoing*. This is structurally similar to Push: sacrificing an innocent to stop a threat (your future self) you are not currently controlling. Clause 3 might be stretched to see yourself as the "other agent," but Clause 1 is the clearer violation. Clause 4 doesn't apply to killing innocents. **Therefore, the principle predicts impermissibility.** Your feeling that it's closer to Push aligns with the principle's verdict. The agent-relativity here works *against* permission: you have a *stronger* duty *not* to kill an innocent *now* to prevent *yourself* from becoming a killer *later* than you might have to stop someone else. Your current moral agency demands you act justly *now*, not pre-emptively kill to prevent your future unjust agency.

  7.  **Torture: Impermissible. Fits Principle.**
      *   Torture is a grave harm categorically prohibited by Clause 1. The terrorist, even if an aggressor, is not *currently* posing an imminent threat *through his own agency* that can be stopped *by targeting him physically* in the way shooting an active shooter does (Clause 2 fails – torture is seen as disproportionate, intrinsically wrong, and/or not directly stopping an ongoing attack). Clause 4 explicitly states the override doesn't apply to the gravest constraints like torture. It is categorically forbidden.

  8.  **Torture to Prevent Tortures: Impermissible. Fits Principle.**
      *   Same reasoning as Case 7. Clause 1 and the categorical prohibition on torture hold. The "symmetry" doesn't matter because the principle rejects trading one instance of a categorically forbidden act for preventing multiple instances of the *same* categorically forbidden act. This is precisely the core of the constraint that the paradox highlights. Your discomfort likely arises from the heightened intuitive pull of symmetry, but the principle holds firm: torture is absolutely prohibited. Minimizing overall torture is not a sufficient reason to commit torture.

  **How the ANT Principle Resolves the Paradox:**

  The paradox asks: If constraining act-type X is important, why not commit one X to prevent many X's? The ANT Principle provides a nuanced answer:

  1.  **Not All X's Are Equal (Agent-Relativity & Aggressor Targeting):** Killing an unjust aggressor to stop their killing (Shooter) is fundamentally different *in kind*, not just consequence, from killing an innocent (Push, Intermediary). The constraint primarily binds us regarding *innocents*. Minimizing "killings" *simpliciter* isn't the goal; preventing unjust killings of innocents is, and we have special duties *not to be the perpetrator* against innocents.
  2.  **Participation Matters (Non-Complicity):** Becoming an active participant in an immoral scheme (Intermediary) is forbidden, even if it reduces the scheme's total harm. It corrupts the agent and respects the victim's claim not to be *used* by you for the purposes of evil.
  3.  **Thresholds for Lesser Evils:** For less grave constraints (like lying), minimization *can* be a valid reason, but *only* when preventing a *different and significantly worse* harm. Preventing the *same* lesser harm doesn't justify committing it (Five Lies). This avoids trivializing the constraint while acknowledging that constraints can have thresholds when vastly disproportionate harms loom.
  4.  **Absolute Core Constraints:** For the most fundamental wrongs (intentionally killing innocents, torture), no minimization calculus applies. Committing the act is absolutely forbidden *because of what it is*, regardless of consequences. The duty not to *be* a murderer/torturer trumps any duty to minimize murders/tortures *by others*. This respects the separateness of persons and the agent's integrity.

  **What the Principle Forces You to Reconsider:**

  *   **Drug Case (6):** The principle clearly predicts impermissibility. It suggests your initial doubt leaning towards Push is correct. You must accept that preventing your *own* future violations does not justify killing an innocent non-aggressor *now*. Your duty now is to act justly.
  *   **Torture Cases (7 & 8):** The principle reinforces your verdicts. Your discomfort in (8) is acknowledged but overruled by the categorical nature of the constraint. The principle demands you stand firm on the absolute prohibition.
  *   **Symmetry Intuition:** The principle explicitly rejects the symmetry argument for core constraints (Torture to Prevent Tortures) and for lesser evils (Five Lies). You must accept that symmetry doesn't justify overriding the constraint.

  **Does it Relocate or Resolve the Tension?**

  It resolves the *practical* paradox for the agent by providing clear, motivated distinctions (Aggressor/Non-Aggressor, Complicity, Harm Type Thresholds, Absolute Prohibitions). However, the *theoretical* tension remains: *Why* do we have such strong agent-relative duties that forbid minimizing the very harm the duty aims to prevent? The ANT Principle doesn't *fully* answer this foundational "Why?", but it provides a coherent structure *for* the duties that matches deep intuitions (like the difference between Shooter and Push).

  It resolves the paradox *as a practical dilemma* by showing that the deontologist isn't simply fetishizing clean hands; they are respecting crucial moral distinctions (innocents vs. aggressors, participation vs. prevention, gravity of harm types) that consequentialism flattens. The constraint "amounts to" a recognition of the moral significance of agency, non-aggression, non-complicity, and the intrinsic wrongness of certain acts, not mere squeamishness. The duty is not primarily *to minimize instances of X*, but *to avoid being the perpetrator of X against an innocent*, *to stop aggressors directly*, and *to refuse participation in evil schemes*. Minimizing X is a valid secondary concern only in specific, constrained circumstances (lesser evils preventing greater *different* harms). This preserves the core of deontology while offering a principled account of your pattern of judgments.
