  Can you explain that part to me conceptually? Specifically:

  1. If the propositions on the agenda have no logical relations to one another whatsoever, proposition-wise majority voting apparently can't produce an inconsistent outcome, ever. Why not — what is it about independence that makes it safe? And what precisely changes the second you add a single entailment? I want the mechanism, not the slogan.
  2. I keep running into a phrase like "the agenda has to be connected" bolted onto the impossibility results. What is connectedness doing intuitively, and why is it load-bearing rather than a technical side condition someone could assume away and still get an interesting theorem?
