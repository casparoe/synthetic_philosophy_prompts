answer: |-
  ### Superrational Cooperation Classroom Game  
  **Duration:** 75 minutes  
  **Participants:** 24 undergraduates (no game theory background)  
  **Goal:** Experience the tension between causal dominance (defect) and superrational reasoning (cooperate) in a one-shot Prisoner’s Dilemma (PD).  

  ---

  ### **Materials**  
  - **Decision slips** (48 total: 24 for Round 1, 24 for Round 2)  
  - **Pairing cards** (24 cards labeled 1A–12A and 1B–12B for Round 1; 24 cards labeled "C" or "D" based on Round 1 choices for Round 2)  
  - **Whiteboard** for scoring and debrief notes  
  - **Markers**  
  - **Timer**  
  - **Participant IDs** (e.g., numbered stickers for anonymity)  

  ---

  ### **Game Rules**  
  - **Payoff Structure (Visible Throughout):**  
    - Both **Cooperate (C)**: 3 points each  
    - Both **Defect (D)**: 1 point each  
    - **Unilateral Defection**: Defector gets 5 points, Cooperator gets 0  
  - **No Communication:** Participants cannot speak to partners during decisions.  
  - **Anonymity:** Use IDs (e.g., "Player 7A") to mask identities.  
  - **Scoring:** Points are abstract (no real money). Total points determine "winners" (top 5 earn applause).  

  ---

  ### **Timeline**  

  #### **1. Setup & Round 1: Experience Dominance Reasoning (20 mins)**  
  - **0–5 mins: Introduction**  
    - Explain rules: *"You’ll play two rounds with different partners. Your goal is to maximize points. In each round, you and your partner choose C or D simultaneously. Payoffs depend on both choices."*  
    - Display payoff matrix. Emphasize: *"You won’t know your partner’s choice until after both rounds."*  
  - **5–10 mins: Pairing for Round 1**  
    - Distribute pairing cards (e.g., 1A/1B, 2A/2B, ..., 12A/12B). Players with matching numbers (e.g., 1A and 1B) pair up.  
  - **10–15 mins: Decision & Collection**  
    - Players write **C** or **D** on slips (include ID). Collect slips immediately.  
  - **15–20 mins:** Transition (silent reflection): *"Write one reason for your choice. Keep it private."*  

  #### **2. Round 2: Salient Sameness of Reasoning (20 mins)**  
  - **20–25 mins: Pairing for Round 2**  
    - **Key Mechanism:** Create belief in identical reasoning.  
      - Sort Round 1 slips into "C" and "D" piles.  
      - Distribute new pairing cards: "C" players get **green** cards; "D" players get **yellow** cards.  
      - Pair **same-color cards** (e.g., green-green, yellow-yellow).  
    - Announce: *"You’re paired with someone who made the **same choice** as you in Round 1. This suggests they might think like you."*  
  - **25–30 mins: Framing for Round 2**  
    - *"Before choosing, remember: your partner shares your past action. They’re likely to reason similarly now."*  
  - **30–35 mins: Decision & Collection**  
    - Players choose **C** or **D** again. Collect slips.  

  #### **3. Scoring & Results (15 mins)**  
  - **35–45 mins:** Calculate scores for both rounds.  
    - Display pairwise outcomes on whiteboard (e.g., "Pair 3: Round 1 = D/D, Round 2 = C/C").  
  - **45–50 mins:** Announce top scorers. Highlight patterns:  
    - *"Notice: Many same-choice pairs in Round 2 got 3 points (C/C)."*  

  #### **4. Debrief (20 mins)**  
  - **50–60 mins: Guided Reflection**  
    - Ask:  
      - *"In Round 1, what made you choose D? What risks did you fear?"* → Elicit dominance reasoning.  
      - *"In Round 2, did knowing your partner chose like you change your thinking? How?"* → Surface symmetry.  
    - **Key Moment Mapping:**  
      | **Phase**          | **Experience**                          | **Concept**                          |  
      |--------------------|-----------------------------------------|--------------------------------------|  
      | Round 1            | Fear of betrayal → Defect               | Causal dominance ("D always safer") |  
      | Round 2 Pairing    | "They chose like me → We’re similar"    | Salient symmetry                     |  
      | Round 2 Decision   | "If we reason alike, C/C is possible"   | Superrational intuition             |  
  - **60–65 mins: Theory Introduction**  
    - Contrast frameworks:  
      - **Causal Dominance:** *"Defect is rational—you control your payoff unilaterally."*  
      - **Superrationality:** *"If players know they’re identical reasoners, C/C emerges. Defecting leads to D/D (1 point), but cooperating secures 3."*  
    - Emphasize: *"Superrationality isn’t about reciprocity—it’s about symmetry of minds."*  
  - **65–70 mins: Limitations & Discussion**  
    - **Missing Element:** *"The game can’t force true symmetry of reasoning. You had to assume your partner thinks like you, but real superrationality requires deeper mutual recognition."*  
    - Discuss: *"When might this apply in real life? (e.g., climate agreements, AI alignment)."*  

  ---

  ### **Anticipated Problems & Solutions**  
  1. **Problem:** Round 1 has high cooperation (e.g., >50% C).  
     - **Solution:** Stress anonymity and one-shot nature. Remind: *"Your partner could defect—protect yourself!"*  
  2. **Problem:** Round 2 pairing feels arbitrary.  
     - **Solution:** Use emphatic framing: *"Same past choice = likely same mindset."*  
  3. **Problem:** Participants discuss choices prematurely.  
     - **Solution:** Strictly enforce silence during decisions. Confiscate slips quickly.  
  4. **Problem:** Odd number of C/D players in Round 2.  
     - **Solution:** If uneven, one trio plays (adjust payoffs: majority choice wins).  

  ---

  ### **Why This Works**  
  - **Round 1:** Triggers instinctive defection (dominance is visceral).  
  - **Round 2:** Same-choice pairing + framing makes symmetry salient, nudging players toward cooperative equilibria.  
  - **Debrief:** Explicitly links gameplay to theory, using participant experiences as anchors.  

  **Outcome:** Participants viscerally grasp why rational agents might cooperate when symmetry is highlighted—without needing jargon upfront.
