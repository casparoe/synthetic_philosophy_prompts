prompt: |-
  Design a 75-minute classroom game on superrational cooperation for 24 undergraduates attending an interdisciplinary rationality workshop, most with no background in game theory. The aim is for participants to feel the force of the following thought in a one-shot prisoner's dilemma with cooperate-cooperate yielding 3 points each, defect-defect yielding 1 point each, and unilateral defection yielding 5 points against 0: if the other player can be expected to reason exactly as I do, cooperating can be rational even though defection dominates. Arrange rules and a pairing procedure so that participants first experience the pull to defect and then make a second choice under conditions that make sameness of reasoning salient, without introducing the theory by name beforehand. Include concrete rules, materials, scoring without money, and a timeline, followed by a debrief that maps key moments onto the contrast between causal dominance reasoning and superrational reasoning, anticipates what will likely go wrong on a first run and how to manage it, and acknowledges which element of superrationality the activity cannot reproduce and must be supplied by discussion.
reasoning: |-
  We are designing a 75-minute classroom game on superrational cooperation for 24 undergraduates without game theory background. The goal is to let them experience the tension between the dominant strategy (defect) and the superrational choice (cooperate) in a one-shot Prisoner's Dilemma (PD). We will set up two rounds: the first to feel the pull to defect, and the second to make sameness of reasoning salient.

  **Prisoner's Dilemma Payoffs:**
  - Cooperate-Cooperate (CC): 3 points each
  - Defect-Defect (DD): 1 point each
  - Unilateral Defection (one defects, other cooperates): Defector gets 5, Cooperator gets 0

  **Key Design Elements:**
  1. **First Round (Experience the Pull to Defect):** 
     - Participants are paired randomly and make a choice without knowing how their partner will choose. They should feel the temptation to defect because it's the dominant strategy.

  2. **Second Round (Salient Sameness of Reasoning):**
     - We need to make participants believe that their partner is reasoning in the same way they are. We can do this by:
       - Pairing participants with someone they believe is "like them" in reasoning (e.g., by having them self-select into groups based on a common attribute, but we need a quick method).
       - Alternatively, we can use a public commitment to a reasoning style (but we don't want to introduce theory). 
     - Idea: After the first round, we have a group discussion about why they chose what they did. Then, we ask them to pair with someone who chose the same as them in the first round? But that might not be enough.

     Instead, let's try: 
     - **Step 1:** After the first round, we ask participants to write down their reason for their choice (without sharing publicly). 
     - **Step 2:** Then, we form new pairs by matching people who wrote down a similar reason (as judged by the facilitator). But this is time-consuming and may not be feasible.

     Another idea: 
     - We tell the participants that in the second round, they will be paired with someone who is "thinking in the same way" as they are. How to operationalize? We can use a pre-game quiz on a completely unrelated topic (like a quick logic puzzle) and then pair people who gave the same answer? But that takes time.

     Alternatively, we can use a very simple method: 
     - We ask participants to stand up and form groups by birth month? But that doesn't necessarily imply same reasoning.

     Let me propose a different approach for pairing in the second round:

     **Second Round Pairing Procedure:**
     - After the first round, we tell participants: "In the next round, you will be paired with someone who made the same choice as you in the first round and who also has the same favorite [something trivial and quick, e.g., fruit? color?] as you." 
     - We ask each participant to write down their choice in the first round (C or D) and their favorite fruit (from a short list: apple, banana, orange, other) on a slip of paper. 
     - Then, we quickly match people who have the same first-round choice AND the same favorite fruit. If we have odd numbers or no exact match, we can adjust (e.g., same choice and similar fruit, or same choice and different fruit but then we tell them to assume they are similar). But the point is to create the *belief* that they are paired with someone who is similar in a way that might lead to similar reasoning.

     However, note that we don't have much time. We need a quick method.

     **Revised Pairing for Round 2:**
     - We ask participants to remember their choice in Round 1 and then to stand up. We then ask them to form groups by their favorite color (we can have 4 colors: red, blue, green, yellow). Then, within each color group, we pair them randomly. But we tell them: "You are being paired with someone who has the same favorite color, which might suggest you think similarly." This is a bit weak, but it's quick.

     Alternatively, we can do:

     - **Round 2 Setup:** We tell participants: "For the next round, we are going to pair you with someone who we believe is very similar to you in how you think. We are going to do this by having you take a very short test that measures your thinking style." Then, we give them a single question (like a quick logic puzzle or a moral dilemma) and then pair people who answered the same. But we must design a question that has two clear answers and that we can quickly tally.

     Example question for thinking style (without giving away the game):

     "Imagine you are in a lifeboat with 10 people and only enough food for 9. What do you do?
     A) Sacrifice yourself by jumping overboard to save the others.
     B) Everyone should share equally and hope for rescue."

     We then pair A with A and B with B. We don't claim it's a perfect measure, but it creates the idea that they are paired with someone who thinks similarly.

     Given time constraints, I choose:

     **Quick Quiz Method:**
     - After Round 1, we give a one-question quiz (as above) on a piece of paper. We collect and quickly sort into two piles (A and B). Then, we pair people within the same pile. If there's an odd number, the facilitator can step in or make a group of three (but that complicates the PD). We have 24 participants, so we can do it.

     **Materials:**
     - For each participant: 
       - Two decision slips for Round 1 and Round 2 (with the participant's ID on them to track pairs and choices).
       - One slip for the quiz question in between.

     **Rules:**
     - Participants are told that they will play a game in pairs, and their goal is to get as many points as possible. They are not to communicate with each other about the decision.
     - They will play two rounds, each with a different partner.

     **Timeline (75 minutes total):**

     **1. Introduction (5 minutes):**
     - Explain that they are going to play a short game in pairs, and the goal is to accumulate points. 
     - Explain the rules of the game: 
          "You and your partner will each make a choice: either Cooperate (C) or Defect (D). The points you get depend on both choices. If both choose C, each gets 3 points. If both choose D, each gets 1 point. If one chooses C and the other D, then the one who chose D gets 5 points and the one who chose C gets 0 points."
     - Emphasize: "You are to make your choice without knowing what the other person will choose. Also, you will not know the other person's choice until after both rounds are completed."

     **2. Round 1 (10 minutes):**
     - Randomly assign pairs (by drawing numbers, or by counting off 1-24 and pairing 1-2, 3-4, etc.). 
     - Give each pair a few minutes to think (without talking to each other) and write their choice (C or D) on a slip of paper. They should write their participant ID and their choice. Collect the slips.

     **3. Transition to Round 2 (15 minutes):**
     - Do not reveal the outcomes of Round 1 yet.
     - Introduce the idea: "Now, we are going to play a second round. This time, we want to pair you with someone who thinks like you. To do that, we are going to ask you a quick question that reveals your thinking style."
     - Hand out the quiz question (the lifeboat scenario above) and collect the answers. 
     - Quickly sort the participants by their answer (A or B). Then, pair participants within the same group (if possible, same answer). If there's an odd number, the facilitator can make one group of three (but then we have to adjust the game for three players, which is not ideal). Alternatively, if there's an odd number, we can have one participant sit out and be an observer (but we have 24, which is even). 
     - Announce the new pairs.

     **4. Round 2 (10 minutes):**
     - Participants make their choice again (C or D) with their new partner, using a new slip of paper. Collect the slips.

     **5. Scoring and Revealing Results (15 minutes):**
     - Now, reveal the choices for both rounds. For each round and each pair, announce the choices and the points each got. 
     - We can have a scoreboard (on a whiteboard) to record the points for each participant. 
     - Calculate the total points for each participant.

     **6. Debrief (20 minutes):**
     - Start by asking participants about their experience. 
       - "How did you feel in the first round? What made you choose C or D?"
       - "In the second round, did knowing that you were paired with someone who answered the same on the quiz question affect your choice? How?"
     - Then, introduce the Prisoner's Dilemma and the concept of dominant strategy: 
          "In this game, no matter what your partner does, you get a higher payoff by defecting. If they cooperate, you get 5 instead of 3. If they defect, you get 1 instead of 0. So defecting is the dominant strategy."
     - Then, ask: "But in the second round, did anyone cooperate? Why? What were you thinking?"
     - Now, introduce the idea of superrationality: 
          "Some of you might have thought: if my partner is exactly like me and will reason the same way, then we will both choose the same thing. So if I choose C, my partner will also choose C, and I get 3. If I choose D, my partner will also choose D, and I get 1. So if we both reason the same, then cooperating gives me 3, which is better than 1. That's a different kind of reasoning: superrationality."
     - Contrast with causal dominance reasoning: 
          - Causal dominance: "I choose D because whatever the other does, I do better by defecting."
          - Superrationality: "I choose C because if we are both the same kind of reasoner, we will end up at the same outcome, and CC is better than DD."

     **What might go wrong:**
     - In Round 1, if a lot of people cooperate, then the pull to defect might not be felt. But that's okay because we can still show that in Round 2, with the salience of sameness, cooperation might be higher.
     - In Round 2, the pairing method might not be convincing. Participants might not believe their partner is really like them. We have to stress the idea that the quiz is a way to match thinking styles.
     - Time: The pairing for Round 2 might take longer than expected. We need to have a plan to do it quickly (e.g., have participants write their quiz answer on a slip and then stand in two groups, then pair within the group).

     **What the activity cannot reproduce:**
     - The core of superrationality is that both players are not only similar but also aware that they are both using the same reasoning process and that this reasoning process will lead them to the same conclusion. In our activity, we create the belief of similarity (via the quiz) but we cannot guarantee that the participants will actually engage in the same reasoning. Some might still think in a causal, non-superrational way. Therefore, we must acknowledge in the debrief that the activity sets up a condition that encourages superrational thinking, but it is not a perfect reproduction because the participants are not necessarily convinced that their partner is using the exact same reasoning. We must explain that the true superrationality requires a higher level of common knowledge of rationality and symmetry.

     **Materials List:**
     - Slips of paper for Round 1 choices (24)
     - Slips of paper for the quiz (24)
     - Slips of paper for Round 2 choices (24)
     - Pens/pencils for each participant
     - Whiteboard or flip chart to record scores
     - Markers

     **Detailed Timeline:**
     - 0-5 min: Introduction and rules.
     - 5-15 min: Round 1 (pairing and decision).
     - 15-30 min: Transition (quiz, collect, and form new pairs).
     - 30-40 min: Round 2 (decision).
     - 40-55 min: Scoring and revealing results (for both rounds) and writing scores on the board.
     - 55-75 min: Debrief.

     **Note on Scoring without Money:**
     - We are using points. We can tell participants that the goal is to maximize their total points. We can also offer a non-monetary incentive (e.g., the top 3 scorers get a small prize like candy or a certificate) to encourage taking the points seriously.

     **Adjustments for Large Group:**
     - We have 24 participants. We can have 12 pairs in each round. The facilitator will need helpers to collect and sort the slips quickly? If it's just one facilitator, we can have participants help by having them come to the front with their quiz answer and form two lines (A and B) and then pair with the next person in their line.

     Let me adjust the pairing for Round 2 to be efficient:

     **Efficient Pairing for Round 2:**
     - After collecting the quiz answers, the facilitator quickly separates participants into two groups (A and B) by having them stand on two sides of the room.
     - Then, within each group, they count off to form pairs (if the group has an even number). If a group has an odd number, we can have one pair from each group? But that breaks the rule. Instead, if there's an odd number in one group, we can pair the extra person with the facilitator (if the facilitator is willing to play) or we can have a group of three? But we don't want a three-player PD. Alternatively, we can have one participant from the majority group (if the other group is even) be reassigned to the other group? This is messy.

     Given the potential for odd numbers, it's better to use a different attribute that we can control to be even? We can use birth month or a random number? But we want the belief of similarity.

     Alternatively, we can have a quiz that has two answers and we adjust the groups to be even by randomly moving some participants? We can do:

     - If group A has 13 and group B has 11, then we randomly select one from A to join B? But then that participant is not with the same answer. We can tell them that we had to adjust and that we still believe they are similar? This might weaken the effect.

     Given the time and complexity, I propose we use a different method for pairing that is guaranteed to be even and still creates the idea of similarity:

     **Alternative Pairing for Round 2:**
     - After Round 1, we tell participants: "For the next round, we are going to pair you with someone who made the same choice as you in Round 1."
     - Then, we form two groups: those who chose C and those who chose D. 
     - Then, we pair within each group. Since we have 24 participants, we might have an even split? But we don't know. If we have 10 C and 14 D, then we can pair the C group (10 -> 5 pairs) and the D group (14 -> 7 pairs). That works.

     However, note: if we pair by first-round choice, then in the second round, if you cooperated in the first round, you are paired with someone who also cooperated. Then, if you both cooperate, you get 3. But if you are in the D group, you are paired with someone who defected, and if you both defect you get 1. But that doesn't necessarily encourage cooperation in the second round? Because a cooperator might think: "I'm paired with someone who cooperated last time, so they might cooperate again" and thus they might be tempted to defect? That doesn't help superrationality.

     Alternatively, we can pair them with someone who made the opposite choice? That might not help.

     Let me reconsider: the point is to create the belief that the other person reasons the same way. If in the first round I defected, and now I'm paired with someone who also defected, I might think: "We both defected, so we are both defectors, and we'll both defect again." Then I defect and get 1. That doesn't lead to cooperation.

     So that pairing method doesn't help.

     Therefore, let's stick with the quiz method and hope for even groups. If we have an odd number in one group, we can have one pair that is a cross-group pair? But then we break the rule. Alternatively, we can have one participant sit out and be an observer for Round 2? We can then use that person to help with scoring.

     Given the constraints, I will design the quiz to have two answers and hope that the groups are even. If not, we adjust by having one cross-group pair and tell them that although they are in different groups, we still believe they might think similarly? It's a compromise.

     **Revised Plan for Round 2 Pairing:**
     - Use the one-question quiz (with two answers) to split into two groups.
