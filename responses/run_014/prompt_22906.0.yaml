answer: |-
  You're absolutely right to wrestle with this — the indicative/counterfactual distinction and Adams' Thesis present profound challenges to classical semantics. Let me steelman the pro-Adams position and tackle the compositionality objection head-on. This view isn't just defensible; it arguably captures something fundamental about how indicatives function in natural language and reasoning.

  **Core Argument for Adams' Thesis & Non-Truth-Conditional Indicatives:**

  1.  **The Triviality Bombshell (Lewis, Hájek):** David Lewis proved that if indicative conditionals have truth values *and* Adams' Thesis (Pr(if A, then B) = Pr(B | A)) holds universally, then probabilities collapse: Pr(B | A) must equal Pr(B). This is absurd for non-trivially dependent A and B. The only plausible escapes are:
      *   **Deny Adams' Thesis:** But it's empirically robust (people's willingness to bet on "If A, B" aligns with Pr(B|A)).
      *   **Deny Universal Truth Values:** This is the elegant solution. Indicatives aren't propositions with standard truth conditions.

  2.  **The Possible Worlds Misfit:** Lewis/Stalnaker semantics works brilliantly for counterfactuals ("If it had rained, the ground would be wet") because we consider distant worlds where the antecedent is false. Indicatives ("If it is raining, the ground is wet") function differently:
      *   **Epistemic Constraint:** We evaluate indicatives relative to our *current knowledge state*, not all logically possible worlds. Worlds where our current knowledge is false aren't relevant.
      *   **No Factual Antecedent:** Often with indicatives (especially future-tensed or uncertain), we don't know if A is true. The conditional instructs us how to *update* our beliefs *given* A, not describe a world where A holds.
      *   **The "Or Else" Test (Edgington):** Contrast "Either it's not raining, or the ground is wet" (material conditional) with "If it's raining, the ground is wet." They feel different. Adams explains this: the indicative expresses *high conditional probability*, not the truth of the material conditional.

  3.  **Meaning as Use (Inference Ticket):** The primary *function* of an indicative conditional is to express a constraint on our credences: *Given A, I hold B likely* (or *commit to B* in a Ramsey Test sense). Its meaning is procedural/inferential, not representational. Adams' Thesis captures this core function perfectly: the acceptability/assertability of "If A, B" *is* Pr(B | A).

  **Tackling the Compositionality Objection: Embedding "Not", "And", "Or"**

  This is the hardest challenge. If "If A, B" lacks a truth value, what is "It is not the case that if A, B"? Or "If A, B and if C, D"? Here's how the Adams defender responds:

  1.  **The Pragmatic Fallback (Material Conditional):** In many embedding contexts, especially negation, the conditional *behaves as if* it has the truth conditions of the material conditional (A ⊃ B ≡ ~A ∨ B). This isn't ideal for pure Adamsians, but it's observable.
      *   **"Not (If A, B)":** Often interpreted as "A and not B". This aligns with negating the material conditional: ~(A ⊃ B) ≡ A ∧ ~B.
      *   **Why? (Jackson's Robustness):** Frank Jackson suggested that we *assert* "If A, B" only when Pr(B | A) is high *and* robust (insensitive to learning A). When robustness fails, we might be more willing to say "It's not the case that if A, B" even if Pr(B | A) is high. This points to a pragmatic overlay on the core Adams probability.

  2.  **Restricted Embedding (Gibbard, Edgington):** Proponents argue that *genuine*, *unembedded* indicative conditionals (as used in assertion and basic reasoning) are the primary case Adams' Thesis handles perfectly. Complex embeddings are:
      *   **Rare & Artificial:** Natural language use of heavily nested/embedded indicatives is uncommon and often awkward ("??If it's not the case that if A then B, then C").
      *   **Interpreted Holistically/Pragmatically:** We don't compositionally build them from truth-conditional parts. Instead, we interpret the complex expression as a whole, often falling back on material conditional interpretations *or* specific pragmatic inferences based on the context and the speaker's likely epistemic state.
      *   **Adams-Compatible Semantics for Compounds:** More formally, theorists develop logics where compounds involving conditionals are assigned probabilities directly, not built from truth values:
          *   **Pr(Not (If A, B)):** This might be interpreted as Pr(A and not B), reflecting the common understanding. Adams could argue this is the *useful* interpretation for updating beliefs: learning "Not (If A, B)" should lead you to rule out worlds where A is true and B is false.
          *   **Pr(If A, B and If C, D):** This could be interpreted as the probability that *both* conditional probabilities are high, or perhaps Pr(B | A) * Pr(D | C) (if independent). The meaning focuses on the joint constraint on credences imposed by asserting both conditionals.

  3.  **The "What If We *Must* Assign Truth?" Move (Jeffrey, Stalnaker):** Some suggest that *if* forced to assign truth values in complex embeddings (e.g., within propositional attitude reports or complex deductions), we can use the **probability conditional** itself:
      *   The *truth condition* of "If A, B" (in a context) is simply that Pr_c(B | A) is high (where Pr_c is the contextually relevant probability function).
      *   **Pr(Not (If A, B)) = Pr( Pr_c(B | A) is *not* high )**. This requires probabilities over probabilities (second-order), which is complex but formally possible.
      *   **"He believes that if A, B"** becomes "He has high Pr_he(B | A)".
      *   **Weakness:** This arguably abandons the core spirit of Adams by reintroducing truth conditions, even if they are about probabilities. It also gets very meta.

  4.  **Denying Full Compositionality (Radical Move - Edgington):** Dorothy Edgington argues compositionality isn't an inviolable law. Natural language meaning isn't always built from parts like Lego bricks. Indicatives might be a case where their unique function (expressing conditional probability) resists seamless embedding. We understand "Not (If A, B)" *as a whole* to express dissent from the high conditional probability claim, often manifesting as "A and not B is possible/likely".

  **Concrete Example: Negation**

  *   **Utterance:** "It's not true that if the Fed raises rates tomorrow, the market will crash."
  *   **Adams Analysis:** The speaker is *rejecting* the claim that the conditional probability of a crash given a rate rise is high. What does this mean pragmatically?
      *   **Likely Implication:** The speaker believes a rate rise is possible (or even likely), and *conditional on that*, a crash is *not* highly probable. They are effectively asserting that the conjunction "Fed raises rates AND market does not crash" has significant probability. This aligns perfectly with the material conditional fallback (A ∧ ~B), but the *route* to that meaning is via rejection of the high conditional probability, not truth-functional composition.
      *   **Context:** If the speaker thinks a rate rise is *impossible* (Pr(A)=0), Adams' Thesis makes Pr(B|A) undefined. Denying "If A, B" in this context might be odd or interpreted as denying the relevance/possibility of A itself.

  **Why This Steelman Holds Water Despite Embedding Challenges**

  1.  **Explanatory Power for Core Use:** Adams' Thesis brilliantly explains the central, unembedded use of indicatives and their deep connection to conditional probability and belief updating (Ramsey Test).
  2.  **Avoids Triviality:** It's the only known way to consistently preserve the intuitive link Pr(If A, B) ≈ Pr(B | A) without collapsing probability.
  3.  **Captures the Epistemic Nature:** It correctly locates the meaning of indicatives in the speaker's epistemic state relative to current information, not in objective similarity of worlds.
  4.  **Pragmatics Fills the Gaps:** While embedding is messy, pragmatic mechanisms (falling back to material conditional interpretations in specific contexts, holistic interpretation, robustness considerations) provide workable interpretations for the vast majority of natural language uses. The complexities arise mostly in artificial logical puzzles.
  5.  **Counterfactuals Remain Safe:** This view cleanly distinguishes indicatives from counterfactuals. Lewis/Stalnaker semantics remains excellent for counterfactuals, which *do* involve comparing worlds across modal distances.

  **Conclusion**

  You're right to feel stuck on embeddings – it's the toughest nut to crack for the Adams view. However, the strength of the arguments *for* Adams' Thesis (triviality, epistemic nature, core functionality) combined with pragmatic strategies and the development of specialized logics for compounds provides a robust, albeit complex, defense. The position argues that compositionality, while desirable, isn't absolute. The unique, non-propositional role of indicative conditionals in guiding reasoning under uncertainty justifies a semantic framework where their core meaning is probabilistic, and embedding challenges are resolved through context, pragmatics, and specialized analyses rather than forcing them into the truth-conditional mold that fits counterfactuals so well. The "wrecking" of strict truth-conditional compositionality is a price worth paying to accurately capture how indicatives fundamentally work.
