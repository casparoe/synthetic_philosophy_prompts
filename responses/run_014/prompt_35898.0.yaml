  In UDT, the agent chooses a policy (one-box or two-box) before knowing the prediction. The policy is fixed. Then, the predictor uses the policy to decide. So the agent chooses:

  Policy: one-box -> then Omega puts the million, so you get 1,000,000.
  Policy: two-box -> then Omega puts 0 in the first box, so you get 1000.

