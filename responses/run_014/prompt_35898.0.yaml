  - When positive (prob 0.1056): we treat, so cost $30,000 and avoid the loss -> so net cost in this branch: $30,000 (we pay for treatment, but avoid the loss so we don't have the disease loss) but note: without treatment, we would have had the loss. So the cost of this branch is the treatment cost only? But we must compare to the no-action baseline.

