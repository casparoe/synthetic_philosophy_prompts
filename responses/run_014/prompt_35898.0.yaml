  The key steps are:

  (1) We accept the counterfactual mugging: paying on tails is rational because of the pre-flip expected value.

  (2) D. extracts a principle: act at a decision point based on the evaluation from the vantage point before you learned which situation you are in.

  (3) In a medical decision, the pre-test evaluation says not to treat (since prior probability of condition is 10%, so expected value of treating is negative). After a positive test, we have high credence and treating is good.

  (4) By (2), the updateless agent must act on the pre-test evaluation and decline treatment even after a positive test.

  (5) This generalizes to any observation, leading to evidential paralysis.

  (6) Therefore, either updatelessness is false (losing the mugging verdict) or rational agents cannot use evidence. Both are absurd, so the argument must fail.

