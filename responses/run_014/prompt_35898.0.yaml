  But D. might have a different example in mind. The classic Newcomb problem:

  Omega puts $1,000,000 in a box if it predicts you will take only one box; else $0. There are two boxes: one with $1,000,000 (if predicted) and one with $1000. You choose: take both boxes or take only the second (which has $1000).

