  Or no test and treat: 0.1*0 + 0.9*30,000 = $27,000? Wait, no: if we treat without test, we always pay $30,000 and avoid the loss in the disease case. So:
  - If disease (10%): cost $30,000 (and avoid loss, so no extra loss)
  - If healthy (90%): cost $30,000 unnecessarily.

  So expected cost: $30,000.

  So the strategy "test and treat if positive" has expected cost $4,168, which is better than no test and no treatment ($20,000) or no test and treat ($30,000).

  So the pre-test evaluation of the strategy is positive: it has lower expected cost.

  Now, what about the policy of treating without testing? We saw it's $30,000, which is worse than the testing strategy.

  Now, if we consider the policy of always treating without testing, that's one policy. But the policy of testing and then treating conditionally is a different policy.

  Now, step (3) of D.'s argument: "Before testing, treating has negative expected value (0.1 × $200,000 − $30,000 = −$10,000), so the pre-test evaluation says don't treat."

  But note: the pre-test evaluation of the action "treat without testing" is negative. However, the pre-test evaluation of the conditional strategy "test and then treat if positive" is positive. Moreover, the agent is not committed at the pre-test stage to a policy of "treat without testing". They are considering what to do with the test.

  In the counterfactual mugging, the agent commits to a policy for the counterfactual situation (if tails, pay) before knowing the flip. In the medical case, the agent can commit to a policy that conditions on the test result. That is, the policy is: if the test is positive, then treat; if negative, then don't.

  So the pre-test evaluation of this conditional policy is positive. Then, when the test comes positive, the agent follows the policy and treats.

  Therefore, in step (4), the updateless agent does not decline treatment after a positive test. Instead, it follows the pre-committed policy, which is to treat.

  So the mistake in D.'s argument is step (2): the principle is misstated. It is not that we must always act on the pre-observation evaluation of the action we are about to take. Rather, we must act on the pre-observation evaluation of the policy that we are following. In the counterfactual mugging, the policy is defined for the decision node (if tails, pay). In the medical case, the policy is defined to condition on the test result.

  Therefore, the boundary is: a rational agent may condition on observations that are part of the information set at the decision node, as long as the policy was evaluated before the information that the policy conditions on was known. In the counterfactual mugging, the policy conditions on the flip outcome (heads or tails) but the flip outcome is not known at the pre-flip stage. However, the coin flip is a variable that the policy can condition on. Similarly, in the medical case, the test result is a variable that the policy can condition on.

  In the mugging, the predictor uses the policy that conditions on the flip outcome: if heads, then [no action, but the predictor rewards the policy]; if tails, then the agent pays. The policy is defined for both outcomes. The agent, at the pre-flip stage, evaluates the entire policy.

  In the medical case, the agent at the pre-test stage evaluates a policy that conditions on the test result: if positive, treat; if negative, don't. Then, when the test result is known, the agent follows the policy.

  So the principle (2) should be: when you act at a decision point, the evaluation that counts is the one made from the earlier vantage point for the entire policy, which may condition on the observation. The policy is chosen at the pre-observation stage, and then at the decision node, you follow the policy given the observation.

  Now, what about D.'s follow-up? She asks: which observations may a policy depend on? And she challenges with a case where an observation is evidence about a factor your action cannot causally affect, like a gene that causes both a desire and an illness.

  This is similar to Newcomb-like problems. In such cases, updatelessness might require that we do not condition on the observation if the observation is about a state that is fixed and cannot be changed, and if the policy we choose might be correlated with that state.

  But in the medical case, the test is about the disease state, which is fixed at the time of testing (like the coin flip in the mugging). However, the treatment can causally affect the outcome. So the medical test is not a case of evidence about an unchangeable state that is correlated with our policy? Actually, in the medical case, the disease state is fixed and not affected by the treatment decision (we assume treatment removes the loss but doesn't change the disease state? Actually, treatment removes the loss, so it changes the outcome). The state (having the disease) is fixed, but the outcome (loss) can be changed by treatment.

  In the gene example: suppose there is a gene that causes both a desire to do an activity and a disease. The activity is harmless. But if you condition on having the desire, then you might think the activity causes the disease, but actually it doesn't. The rational thing is to condition on the evidence (the desire) only if it is not correlated with the gene in a way that makes the activity look bad. But actually, in decision theory, we have to be careful about conditioning.

  The key point is that in causal decision theory, we condition on the evidence but then make the decision based on causal effects. In evidential decision theory, we condition and then choose the action with the highest conditional expected utility.

  Updatelessness, as in UDT (Updateless Decision Theory), is designed for cases where the agent's decision might be predicted by a predictor that has access to the agent's policy. In such cases, conditioning on observations that are correlated with the state but also with the predictor's knowledge of the policy can lead to problems.

  In the gene example: if the agent conditions on having the desire, then they might think that doing the activity is evidence that they have the gene and hence the disease. But since the activity doesn't cause the disease, doing the activity doesn't cause harm. So evidential decision theory might say to avoid the activity to avoid the evidence of having the gene, but causal decision theory says to do the activity if you enjoy it.

  How does updatelessness handle this? In updateless decision theory, the agent chooses a policy that maps observations to actions. The policy is chosen at the start, before any observations. Then, when an observation is made, the policy is executed.

  In the gene example, the agent would choose a policy for what to do if they have the desire and what to do if they don't. But the policy choice might be correlated with the gene? Actually, in UDT, the agent considers the entire world program and chooses a policy that maximizes expected utility across all possible worlds.

