  So total expected cost:
  0.095 * 30,000 + 0.005 * 200,000 + 0.0106 * 30,000 + 0.8894 * 0
  = (0.095 + 0.0106)*30,000 + 0.005*200,000
  = 0.1056 * 30,000 + 1,000
  = 3,168 + 1,000 = $4,168

