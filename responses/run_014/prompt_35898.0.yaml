  But then the policy: if the first box is empty, take both; if it has 1,000,000, take both. Then Omega, knowing this policy, will see that you always take both, so it sets the first box to empty. Then you get 1000. But if you had a policy of taking only the second when the first is full? But that's impossible because you can't condition on the content that is set based on your policy.

  So in UDT, the policy must be chosen without knowing the content, and the content depends on the policy. So the agent must choose a policy that does not condition on the content, because the content is set after the policy is fixed (by the predictor).

  So the boundary is: you can condition on observations that are not influenced by your policy. In the medical test, the test result is about the disease state, which is not influenced by the treatment policy (assuming the test is done before treatment and the disease is not affected by the policy). So conditioning is allowed.

  In the counterfactual mugging, the coin flip is independent of the agent's policy, so the policy can condition on the flip outcome.

  In the gene example, the desire is caused by the gene, which is independent of the policy, so conditioning is allowed.

  In Newcomb, the content of the first box is set by the predictor based on the agent's policy, so if the policy conditions on the content, it creates a circular dependency. Therefore, the policy cannot condition on the content because the content is set as a function of the policy. So the agent must choose an unconditional policy (one-box or two-box).

  Therefore, the principled boundary: a rational agent may condition on observations that are not a function of the agent's policy. In other words, observations that are "exogenous" and not influenced by the choice of policy.

  In the medical test, the test result is a function of the disease state, which is exogenous. So we condition on it.

  In the counterfactual mugging, the coin flip is exogenous. So we condition on it.

  In Newcomb, the content of the first box is a function of the policy, so we do not condition on it (because we don't observe it until after we commit to the policy? Actually, in the standard Newcomb, we don't observe the content until after we choose, so we don't condition on it in the policy). But if we were to observe it before, we cannot include that in the policy because the content depends on the policy.

  So to answer D.'s follow-up: the observations that a policy may depend on are those that are not determined by the policy itself. In the stress test, if the observation is about a factor that is correlated with the policy (like in Newcomb, the content of the box is determined by the policy), then we must average over it. Otherwise, we can condition.

  In the medical example (4), the policy conditions on the test result, which is exogenous, so we use it. In the mugging, the policy conditions on the coin flip, which is exogenous, so we use it. In the gene example, the desire is exogenous (it's determined by the gene, not the policy), so we condition on it.

  Thus, the argument fails at step (4): the updateless agent does not decline treatment after a positive test because the pre-test evaluation was of a conditional policy, and the policy says to treat if positive.

  Therefore, the slip is in step (2): D. incorrectly states the principle as applying to the action at the node, without noting that the action is part of a policy that was evaluated before the observation that the policy conditions on. In the mugging, the action (pay if tails) is part of a policy that was evaluated before the flip. In the medical case, the action (treat) is taken only if the test is positive, and that is part of the policy evaluated before the test.

  So the diagnosis: step (2) is too vague. The principle should be that the agent chooses a policy at the pre-observation stage, and the policy can specify actions conditional on future observations, as long as those observations are exogenous. Then, at the decision node, the agent follows the policy given the observation.

  Therefore, the boundary is between exogenous and endogenous observations (relative to the policy). This vindicates the mugging and avoids the absurdity in (4).
