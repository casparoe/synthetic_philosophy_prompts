    Policy A: If asked (tails), pay $1000.
    Policy B: If asked (tails), refuse.

  The expected value of Policy A: 
    Heads (50%): $1,000,000 (because the predictor would have predicted you pay and deposited the money)
    Tails (50%): -$1000
