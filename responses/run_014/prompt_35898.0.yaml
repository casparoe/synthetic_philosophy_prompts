  Now, in this case, the observation is the content of the boxes? But actually, at the decision node, you don't observe what Omega did. You only see the boxes. But the standard setup is that you don't know what's in the boxes until after you choose? Actually, you see the boxes? I think you don't see the first box? Let me recall: in Newcomb, you see both boxes. The first box is transparent? Typically, it's opaque? Actually, standardly, you don't see the content of the first box. But you know the setup.

  The key is that the agent does not have an observation that tells them what Omega did. They just choose an action.

