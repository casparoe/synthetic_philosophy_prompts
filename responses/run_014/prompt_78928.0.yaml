  We are designing a procedure to decide whether a capability (e.g., recognizing an object, orienting toward a doorway) that a user already has in an intact sensory modality (e.g., touch, hearing) will transfer to a new sensory channel (e.g., vision via prosthesis, vibrotactile display) without explicit training, or whether explicit training and interface scaffolding is required.

  The procedure is grounded in philosophy of perception and cross-modal learning. Key concepts:
  1. **Property types**: Some properties are considered "amodal" (can be perceived by multiple senses) and others are "modality-specific". 
     - Amodal properties: spatial (location, orientation, motion), temporal (rhythm, duration), quantitative (number, size), and structural (symmetry, part-whole relations). These are more likely to transfer.
     - Modality-specific properties: color (vision), pitch (hearing), texture (touch) — these require calibration because the new sense must learn how they are represented.
  2. **Calibration**: Even for amodal properties, there may be a need for calibration — the new sensory channel must learn how it represents the property (e.g., how visual patterns correspond to tactile ones).
  3. **Three aspects of capability** (which we must not collapse):
     - Discrimination: Can the user tell two things apart?
     - Identification: Can the user name or label which is which (or associate with a known concept)?
     - Action: Can the user act appropriately (e.g., reach for the correct object)?

  The procedure is a decision tree with questions. We stop at "No" when explicit training is needed. We also have points where we decide based on values (how much training burden is acceptable) and when to run a user test.

  **Procedure: Will the capability transfer without explicit training?**

  **Step 1: Define the capability precisely.**
     - Break into: Discrimination, Identification, Action. We must treat each separately.
     - Example: For "pick a cup out of a cluttered table", we have:
          Discrimination: Can the user distinguish the cup from other objects?
          Identification: Can the user label it as a cup?
          Action: Can the user reach and pick it up?

  **Step 2: Is the property amodal?**
     - Check: Is the property inherently spatial, temporal, quantitative, or structural?
     - If **yes**, proceed to Step 3.
     - If **no** (modality-specific, e.g., color, timbre, texture), then explicit training is needed for that property. Stop for that aspect (discrimination, identification, or action) and note that training is required.

  **Step 3: Is the mapping between the intact sense and the new sense straightforward?**
     - Consider: Is there a direct, isomorphic mapping? For example, spatial location in the world maps to a similar spatial representation in the new sense? (e.g., a sound coming from the left is represented as vibration on the left side of the belt)
     - If **yes**, then the capability is likely to transfer without training. Proceed to Step 4 to check for calibration needs.
     - If **no**, then explicit training is needed to establish the mapping. Stop and require training.

  **Step 4: Check for calibration needs.**
     - Even for amodal properties with straightforward mappings, the new sense may require calibration to account for differences in resolution, noise, or representation.
     - Ask: Is the new sensory channel providing a high-fidelity representation of the property? Consider:
          - Resolution: Is the property represented with enough detail? (e.g., the haptic belt has enough motors to distinguish left from center?)
          - Noise: Is the signal clear? (e.g., the retinal prosthesis image is not too noisy)
          - Consistency: Is the representation consistent over time and across instances?
     - If the representation is high-fidelity and consistent, then the capability may transfer without training. Proceed to Step 5.
     - If there are significant differences (low resolution, high noise, inconsistency) then calibration may be needed. But note: we might be able to rely on the user's ability to adapt with minimal training. Proceed to Step 5 but note that a user test might be needed to decide.

  **Step 5: Decide based on risk and values.**
     - We now have a capability that theoretically could transfer, but we must consider:
          - **Criticality**: How critical is it that the user gets this right immediately? (e.g., in a life-saving situation, we cannot afford errors)
          - **Training burden**: How much training would be required? (e.g., a few minutes vs. weeks)
          - **User adaptability**: Are our users typically able to learn quickly? (e.g., children vs. elderly, or users with additional cognitive impairments)
     - If the risk of failure is low and the training burden is acceptable, then we might decide to require training even if transfer is possible, to ensure reliability.
     - If the risk is high and the training burden is high, we might need to redesign the interface to make the mapping more straightforward or the representation clearer.

  **When to run a user test:**
     - We run a test (one or two 90-minute sessions) when:
          - The property is amodal and the mapping is straightforward but we are unsure about calibration (Step 4) and the risk is too high to decide without data.
          - We are at Step 5 and the trade-offs are too close to call without observing a user.

  **Outputs for each aspect (Discrimination, Identification, Action):**
     - Either: 
          (a) The capability will transfer without explicit training — no extra scaffolding needed.
          (b) Explicit training and/or interface redesign is required.

  **Now, run the procedure on three cases:**

  **Case 1: Haptic belt for orientation toward a doorway.**
     - **Capability**: Orient (turn) to face a doorway.
     - Break down:
          Discrimination: Can the user tell that the doorway is in a particular direction?
          Identification: Can the user recognize that the pattern corresponds to a doorway (as opposed to a window, etc.)? (But note: the belt may only indicate direction, not identity.)
          Action: Can the user turn to face that direction?

     Since the belt is designed to convey direction (e.g., vibration on the left means turn left), we focus on the action of turning toward the source.

     - Step 1: Define capability aspects.
          We are primarily concerned with Action: turning toward the doorway.

     - Step 2: Property type: Spatial direction — amodal? Yes.

     - Step 3: Mapping: The belt uses spatial vibration (e.g., vibration on the left side of the waist to indicate left). This is a straightforward spatial mapping. Yes.

     - Step 4: Calibration: The belt may have limited resolution (e.g., only 8 motors around the waist). It might not be high-fidelity. We are unsure about the user's ability to interpret the vibration patterns as directions without training.

          Given the potential low resolution and the fact that the user has never experienced this kind of spatial representation via touch, we suspect calibration might be needed.

     - Step 5: Risk: If the user fails to orient correctly, they might get lost. Training burden: Learning to associate vibration patterns with directions might take a short time. We run a user test? We might decide that minimal training (e.g., a 5-minute calibration) is acceptable and build that in. But without training, it might not work.

     **Decision for Action aspect**: Requires explicit training (calibration) because of the new mapping and potential low resolution. We cannot assume transfer.

     (Note: Discrimination and Identification might also be considered. For Discrimination: the belt might not convey identity of the object (doorway), so we cannot expect the user to know it's a doorway unless we add that feature. But the belt only does direction. So for identity, we would need explicit training if required.)

     **Result**: For the action (turning toward the direction), we require training. This is against current practice if we currently assume it transfers.

  **Case 2: Newly sighted user with retinal prosthesis learning to pick a cup out of a cluttered table.**
     - **Capability**: Recognize and pick up a cup.
     - Break down:
          Discrimination: Distinguish the cup from other objects (e.g., a book, a plate).
          Identification: Recognize that the object is a cup (label it).
          Action: Reach and pick it up.

     We'll consider each.

     **Discrimination**:
        - Step 2: The property is the shape of the cup. Shape is both spatial and structural — amodal? Yes (can be felt by touch and seen by vision).
        - Step 3: Mapping: The visual representation (via prosthesis) of shape may not be straightforward. The prosthesis may provide low-resolution, pixelated images. The user may not immediately map the visual pattern to the tactile shape they know. So mapping is not straightforward? We are unsure. 
        - Step 4: Calibration: The prosthesis image is low resolution and noisy. Without calibration, the user might not discriminate. We need to test? 
        - Step 5: Risk: Picking the wrong object is not life-threatening but frustrating. Training burden might be moderate. We decide to run a user test because the mapping is not obviously straightforward and the representation is low fidelity.

     **Identification**:
        - Step 2: The property is the identity (cup). This requires associating the shape with the concept "cup". Since shape is amodal, we proceed.
        - Step 3: Mapping: The same as above — not straightforward due to low resolution. Without a clear shape, the user might not recognize it as the same cup they feel. So mapping is not straightforward? Yes, we suspect not.
        - Step 4: Calibration definitely needed because of low resolution.
        - Step 5: We require training.

     **Action**:
        - Step 2: The property is the location of the cup. Location is amodal.
        - Step 3: The prosthesis provides spatial information. The mapping of location (if the image is clear enough) should be straightforward. But if the image is cluttered and low resolution, the location might be hard to pinpoint.
        - Step 4: Calibration: The user must learn to interpret the visual field. Given the noise and clutter, calibration is needed.
        - Step 5: We require training.

     **Overall**: For all three aspects, we require training. This is in line with current practice? We are currently building training for the retinal prosthesis.

  **Case 3: User learning to read facial expressions through a vibrotactile display.**
     - **Capability**: Recognize a facial expression (e.g., smile vs. frown).
     - Break down:
          Discrimination: Tell apart two expressions (e.g., smile and frown).
          Identification: Name the expression (e.g., "happy", "angry").
          Action: Maybe respond appropriately (but let's focus on recognition).

     **Discrimination**:
        - Step 2: The property is the pattern of the expression. Is it amodal? Facial expressions are typically visual, but they have temporal patterns (how the face moves) and spatial patterns (mouth upturned). However, the vibrotactile display might represent these as patterns of vibration on the skin. The question is whether the spatial and temporal pattern is amodal enough.

          But note: the user has never experienced facial expressions through touch. So while the underlying muscle movements are spatial and temporal, the mapping to vibration patterns is novel.

          We might argue that the spatial and temporal pattern is amodal. So yes.

        - Step 3: Mapping: The vibrotactile display maps visual patterns (e.g., a curve of a smile) to a pattern of vibrations (e.g., a curve on the skin). This mapping is not straightforward because it is arbitrary: we are encoding a visual pattern into a tactile one. Without a natural correspondence, the mapping is learned.

          Therefore, the mapping is not straightforward. We require training.

        - Stop: Explicit training needed.

     **Identification**:
        - Step 2: The property is the emotional category. This is a high-level concept. It is not directly amodal. The user must associate a pattern with an emotion. Without training, they might not know that a particular vibration pattern means "happy".

          We might argue that the user already knows what "happy" is from other senses (e.g., from voice tone). But the new pattern must be mapped to that concept. So we proceed to Step 3.

        - Step 3: The mapping of the vibration pattern to the emotional category is arbitrary and must be learned. Not straightforward.

        - Stop: Training required.

     **Result**: Training required for both aspects. This is against current practice if we are not building training for the vibrotactile display for facial expressions.

  **What the procedure cannot do:**
     - It cannot account for individual differences (e.g., some users may transfer skills more easily than others).
     - It relies on our current understanding of amodal properties and mappings, which might be incomplete.
     - It does not quantify the amount of training required.
     - It may be too conservative (recommending training when it might not be necessary) or too optimistic.
     - It does not replace user testing when there is uncertainty, but it tells us when to test.
     - It may misfire when the new sensory channel is so different that no mapping is obvious, but the user might still make an intuitive leap (which we cannot predict).

  **Conclusion**: The procedure provides a structured way to make the decision. It requires the team to break down the capability and consider the property type, mapping, and calibration. It explicitly calls for user tests when there is uncertainty and allows for value-based decisions on training burden. It should reduce ad-hoc decision making and costly mistakes.
answer: |-
  Below is a structured, step-by-step procedure to determine whether a user's existing skill in one sensory modality (e.g., touch) will transfer to a new sensory channel (e.g., vision via a retinal prosthesis) without explicit training, or whether explicit training/scaffolding is required. The procedure is grounded in evidence from cross-modal perception research, which shows that transfer depends on **property type**, **mapping complexity**, and the need for **calibration**. It distinguishes between **discrimination** (telling things apart), **identification** (naming/recognizing), and **action** (using the information behaviorally), as these may have different outcomes. The procedure is designed for a 1-hour design review with clinicians and engineers, using plain language and clear stopping rules.

  ---

  ### **Procedure: Cross-Modal Transfer Decision Tree**
  **Input**: A specific capability (e.g., "recognize a cup") that users already have in an intact sense (e.g., touch) and will use in a new sensory channel (e.g., retinal prosthesis).  
  **Output**: A decision for each aspect (discrimination, identification, action):  
  - **No training needed** (transfer likely).  
  - **Training/scaffolding required** (transfer unlikely).  
  - **Run a user test** (uncertain, test needed).  
  - **Values-based decision** (trade-offs require human judgment).  

  **Key Definitions**:  
  - **Amodal property**: A property that can be detected by multiple senses (e.g., spatial location, size, number, motion). These often transfer.  
  - **Modality-specific property**: A property tied to one sense (e.g., color for vision, pitch for hearing). These rarely transfer.  
  - **Straightforward mapping**: The new sense represents the property similarly to the intact sense (e.g., spatial left = vibration on left side).  
  - **Calibration**: The process of aligning signals from the new sense with the user's existing concepts (e.g., learning that "this visual blur = cube").  

  ---

  #### **Step 1: Break Down the Capability**  
  **Question**: What are the distinct aspects of this capability? Split into:  
  - **Discrimination**: Can the user distinguish Target A from Target B? (e.g., sphere vs. cube).  
  - **Identification**: Can the user name/label the target? (e.g., "that's a cup").  
  - **Action**: Can the user act on the target? (e.g., reach for the cup).  
  **Sufficient Answer**: List each aspect separately. If the team conflates them, halt and clarify.  
  **Next**: Proceed to Step 2 for each aspect.  

  *Why?* Research shows these aspects rely on different neural processes. Discrimination is often easier to transfer than identification.  

  ---

  #### **Step 2: Classify the Property**  
  **Question**: Is the core property of this capability **amodal** or **modality-specific**?  
  - **Amodal properties**: Spatial (location, orientation), quantitative (number, size), structural (shape, symmetry), or temporal (rhythm, motion).  
  - **Modality-specific properties**: Sensations exclusive to one sense (e.g., color, pitch, texture feel).  
  **Sufficient Answer**:  
  - If **amodal** → Proceed to Step 3.  
  - If **modality-specific** → **Training required**. Stop for this aspect.  
  - If **unclear** → Default to "training required" (modality-specific is conservative).  

  *Why?* Amodal properties (e.g., "left of") transfer readily; modality-specific ones (e.g., "red") require calibration.  

  ---

  #### **Step 3: Assess Mapping Straightforwardness**  
  **Question**: Is the mapping between the intact sense and the new sense **straightforward**?  
  - **Straightforward**: The new sense encodes the property similarly (e.g., a spatial property is represented spatially in the new channel).  
  - **Not straightforward**: The mapping is abstract or arbitrary (e.g., emotions mapped to arbitrary vibrations).  
  **Sufficient Answer**:  
  - If **straightforward** → Proceed to Step 4.  
  - If **not straightforward** → **Training required**. Stop for this aspect.  
  - If **debatable** → Proceed to Step 4 but flag for user testing.  

  *Why?* Straightforward mappings (e.g., spatial location in vision → spatial vibration in a belt) reduce calibration needs.  

  ---

  #### **Step 4: Evaluate Calibration Needs**  
  **Question**: Does the new sense provide a **high-fidelity, consistent signal** that matches the user's existing representation?  
  Consider:  
  - **Resolution**: Can the new sense detect fine details? (e.g., a retinal prosthesis with 100+ pixels vs. 20 pixels).  
  - **Noise**: Is the signal clear or distorted? (e.g., static in a cochlear implant).  
  - **Stability**: Is the signal consistent across instances? (e.g., a cup always looks similar).  
  **Sufficient Answer**:  
  - If **high-fidelity and stable** → Proceed to Step 5.  
  - If **low-fidelity or noisy** → **Training required**. Stop for this aspect.  
  - If **borderline** → **Run user test** (see Step 6).  

  *Why?* Even amodal properties with straightforward mappings may need calibration if the signal is degraded (e.g., prosthetic vision is blurry).  

  ---

  #### **Step 5: Values-Based Decision**  
  **Question**: How critical is immediate transfer, and what training burden is acceptable?  
  Consider:  
  - **Risk of failure**: What happens if the user errs? (e.g., safety risk vs. minor inconvenience).  
  - **Training burden**: How much effort is needed? (e.g., 5 minutes vs. 5 weeks).  
  - **User impact**: Are users likely to tolerate training? (e.g., children vs. elderly users).  
  **Sufficient Answer**:  
  - If low risk + low burden → **No training needed**.  
  - If high risk or high burden → **Training required**.  
  - If trade-offs are balanced → Escalate to **Medical Director** for final call.  

  *Why?* This step acknowledges that transfer is probabilistic, and values (e.g., safety vs. user autonomy) dominate.  

  ---

  #### **Step 6: User Testing Gate**  
  **Run a user test if**:  
  - Step 3 (mapping) or Step 4 (calibration) was "debatable/borderline."  
  - Step 5 (values) has high stakes but unclear trade-offs.  
  **Test Design**:  
  - Use 1–2 sessions (≤90 minutes each) with 2–3 users.  
  - Test discrimination, identification, and action separately.  
  - Success criterion: ≥80% accuracy without training. If below, training is required.  

  **Do not test if**:  
  - Steps 2–4 clearly require training (not cost-effective).  
  - Values decision is straightforward (e.g., high safety risk).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Predict individual variability**: Some users (e.g., children) may transfer skills faster than others. The procedure assumes "typical" users.  
  2. **Handle compound properties**: Capabilities mixing amodal and modality-specific properties (e.g., "recognize a face") may need training even if some aspects transfer.  
  3. **Replace deep expertise**: Ambiguous cases (e.g., "is emotional expression amodal?") may require a specialist consultation.  
  4. **Guarantee real-world performance**: Lab success may not translate to noisy environments. Field testing is still needed post-launch.  
  5. **Resolve philosophical debates**: E.g., "is shape truly amodal?" defaults to empirical consensus (shape is amodal, but its perception can be sense-specific).  

  **Where It Might Misfire**:  
  - **Overly conservative**: May recommend training for high-adaptability users who don’t need it.  
  - **Overly optimistic**: May assume transfer for low-fidelity signals if calibration is underestimated.  
  - **Edge cases**: E.g., abstract concepts (e.g., "threat") may defy categorization.  

  ---

  ### **Case Applications**  
  We run the procedure on your three cases. For each, we:  
  1. Break down discrimination (D), identification (I), action (A).  
  2. Apply Steps 2–5.  
  3. Flag if our current approach is challenged.  

  ---

  #### **Case 1: Haptic Belt for Orienting Toward a Doorway**  
  **Capability**: Orient toward a doorway using a belt that vibrates to indicate direction.  
  - **D**: Discriminate doorway direction from other directions.  
  - **I**: Identify the vibration pattern as "doorway" (if applicable).  
  - **A**: Turn body toward doorway.  

  | Aspect | Step 2: Property | Step 3: Mapping | Step 4: Calibration | Step 5: Values | Decision |  
  |--------|------------------|-----------------|---------------------|----------------|----------|  
  | **D** | Spatial location → **Amodal** | Spatial (vibration direction = world direction) → **Straightforward** | Belt has 8 motors (low resolution) → **Low-fidelity** | Risk: Low (wrong turn isn't critical). Burden: Low (short training). | **Training required** (due to low fidelity). |  
  | **I** | Object identity → **Modality-specific** (belt doesn't encode identity). | Not applicable. | Not applicable. | Training needed to associate vibration with "doorway." | **Training required**. |  
  | **A** | Body orientation → **Amodal** | Spatial → **Straightforward** | Low resolution → **Low-fidelity** | Risk: Low. Burden: Low. | **Training required** (due to low fidelity). |  

  **Conclusion**: All aspects require training.  
  **Challenge to current practice**: If your team assumes spatial actions transfer without training, this recommends against it due to the belt's low resolution.  

  ---

  #### **Case 2: Retinal Prosthesis for Picking a Cup from a Cluttered Table**  
  **Capability**: Pick a cup from clutter using restored vision.  
  - **D**: Discriminate cup from distractors (e.g., book, bottle).  
  - **I**: Identify object as "cup."  
  - **A**: Reach for cup.  

  | Aspect | Step 2: Property | Step 3: Mapping | Step 4: Calibration | Step 5: Values | Decision |  
  |--------|------------------|-----------------|---------------------|----------------|----------|  
  | **D** | Shape → **Amodal** | Prosthesis renders shapes as low-res blobs → **Not straightforward** (tactile shape ≠ visual blob). | High noise (clutter) → **Low-fidelity** | Risk: Moderate (frustration). Burden: Moderate. | **Training required**. |  
  | **I** | Object identity → **Amodal?** (shape is amodal, but "cup" is a category). | Mapping is weak (blob ≠ "cup" concept) → **Not straightforward**. | Low resolution → **Low-fidelity** | Burden: High (training takes weeks). | **Training required**. |  
  | **A** | Spatial location → **Amodal** | Spatial → **Straightforward** | Moderate resolution → **Borderline** | Risk: Low. Burden: Low. | **Run user test** (calibration uncertain). |  

  **Conclusion**: Discrimination and identification require training. Action needs a user test.  
  **Challenge to current practice**: If your team assumes location-based actions transfer, this may still require a test due to noise.  

  ---

  #### **Case 3: Vibrotactile Display for Reading Facial Expressions**  
  **Capability**: Recognize a smile vs. frown via vibrations on skin.  
  - **D**: Discriminate smile pattern from frown pattern.  
  - **I**: Identify pattern as "smile."  
  - **A**: Respond appropriately (e.g., smile back).  

  | Aspect | Step 2: Property | Step 3: Mapping | Step 4: Calibration | Step 5: Values | Decision |  
  |--------|------------------|-----------------|---------------------|----------------|----------|  
  | **D** | Expression pattern → **Modality-specific** (facial expressions are visually learned). | Vibrotactile patterns are arbitrary → **Not straightforward**. | High consistency → **High-fidelity** | Risk: Moderate (social error). Burden: High. | **Training required**. |  
  | **I** | Emotional category → **Modality-specific** | Mapping is abstract → **Not straightforward**. | High fidelity → **N/A** | Burden: High (concept mapping). | **Training required**. |  
  | **A** | Social response → **Not a sensory property** | Not applicable. | Not applicable. | Training needed for context. | **Training required**. |  

  **Conclusion**: All aspects require training.  
  **Challenge to current practice**: If your team treats expressions as amodal (e.g., "smiles are universal"), this recommends against it—expressions are culturally encoded and sense-specific.  

  ---

  ### **Final Recommendations**  
  - **Implement this procedure** in design reviews. Use a worksheet to document each step.  
  - **Prioritize user tests** for high-stakes, borderline cases (e.g., action in Case 2).  
  - **Redesign interfaces** to leverage amodal properties (e.g., spatial cues) where possible.  
  - **Track failures** to refine the procedure (e.g., if users transfer skills unexpectedly).  

  This systematizes your approach, replaces intuition with evidence-based thresholds, and reduces costly errors—while acknowledging that perception is probabilistic and user-centered values matter.
