prompt: |-
  A friend and I spent most of an evening on the family of views that locates normativity in idealized deliberation — what an agent would endorse under fuller information, more vivid appreciation, sounder reasoning, or after the sort of cognitive psychotherapy Brandt prescribed — and we made no progress, because she held that such a view is empty until the idealizing conditions are spelled out, and I held that they can be spelled out without smuggling in the answer. Before we resume, I want the specification rather than another round: what must an account of idealized deliberation deliver in order to count as substantive instead of a placeholder?

  Give the desiderata, each with the case or consideration behind it. I expect at least: the choice of starting materials and why the verdict is not an artifact of that choice; whether the list of idealizing parameters is closed; non-question-beggingness, in that the conditions may not be selected by consulting the very normative facts under explanation; recognizability, in that the actual agent must be able to see the output as hers rather than a stranger's; and consistency with what we know about reflection, which does not reliably improve judgment. Add whatever further requirements you judge genuine. I particularly want your verdict on three I suspect are load-bearing: idempotence, meaning that feeding the output back into the procedure should not move it; the monotonicity of partial idealization, meaning whether a bounded approximation is better or worse than none at all; and the unbounded-parameter problem, since more information and more coherence have no maximum, so the account must say what it picks out — a limit, a stability plateau, or nothing.

  Mark which requirements are non-negotiable and which are the prejudices of a camp (I suspect unique convergence is a realist prejudice and recognizability an internalist one), and say which single requirement eliminates the most candidates. If some subset is jointly unsatisfiable, that is the result I most want, since it would mean I lose for a better reason than hers. Fix your purpose explicitly: an account adequate to settle a metaethical dispute, or one adequate to serve as the target a machine could be pointed at, as in coherent extrapolated volition and indirect normativity, and note where the list would differ between the two. Close with two or three sentences scoring the leading contenders — ideal observer theory, Brandt, the full-information accounts of welfare, and the alignment descendant — against the list.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with a friend about idealized deliberation theories in normativity. The core issue is whether such theories are substantive or just placeholders until ideal conditions are specified. The user wants a list of desiderata for a substantive account, with cases behind each, and specific focus on idempotence, monotonicity, and unbounded parameters. They also want to know which requirements are non-negotiable, which are camp-specific, and if any subset is unsatisfiable.

  First, I need to recall the main points from the user. They mentioned starting materials, closed parameters, non-question-begging, recognizability, consistency with reflection's fallibility. Plus the three they suspect are load-bearing. The user's deeper need seems to be resolving the metaethical dispute with their friend by identifying if there's a fundamental flaw in idealized deliberation approaches, possibly an unsatisfiable set of criteria.

  Breaking down each desideratum. Starting materials require avoiding arbitrariness. The case here is the worry that different initial desires lead to different outputs, like in Harsanyi vs. Rawls. Non-negotiable because without this, the theory's arbitrary.

  Closed parameters: if the list is open-ended, the account is incomplete. But maybe negotiable if the procedure converges regardless. Non-question-begging is crucial; if conditions are picked based on existing norms, it's circular. That's probably non-negotiable.

  Recognizability ties to internalism. If the agent doesn't see the result as theirs, it might not motivate them. But externalists might not care. So this could be a camp-specific requirement. Consistency with reflection's limits is key because if idealization assumes perfect reflection, but real reflection doesn't improve reliably, the theory might be unrealistic. Non-negotiable for naturalists.

  Now the three load-bearing ones. Idempotence: if the output changes when reapplied, it's unstable. Monotonicity: partial steps should approximate the ideal, but sometimes they make things worse (e.g., more info causing anxiety). Unbounded parameters: since info and coherence have no max, does the procedure reach a limit or plateau? This is critical for defining the endpoint.

  The user also wants to know which requirement eliminates most candidates. Non-question-begging might be a big one because many theories implicitly rely on normative assumptions. For example, specifying "full information" might assume what counts as relevant info, which is normatively loaded.

  Joint unsatisfiability: Maybe recognizability and convergence conflict. If an ideal agent is too different, the output isn't recognizable. But convergence might require radical transformation. Also, non-question-begging and substantive constraints might clash. If you can't use any normative input, how do you set the parameters?

  Purpose matters. For metaethics, the account must avoid circularity and be philosophically defensible. For AI alignment, it needs to be practically implementable, so convergence and stability are key. Recognizability might be less crucial for AI.

  Leading contenders: Brandt's cognitive psychotherapy might fail on reflection consistency and unbounded parameters. Full-information accounts struggle with non-question-begging (what's "full"?) and recognizability. Ideal observer theory might have circularity issues. Coherent Extrapolated Volition (CEV) focuses on convergence but assumes recognizability, which might not hold.

  The user's deepest need seems to be understanding if idealized deliberation can ever work without being circular or arbitrary. They want a solid reason to abandon the approach if the criteria can't be jointly met. Highlighting the conflict between non-question-begging and substantive constraints, or recognizability and convergence, would provide that resolution. Also, pointing out that some requirements are camp-specific helps them see where disagreements with their friend stem from.
answer: |-
  Here is a specification of desiderata for a substantive account of idealized deliberation, grounded in the metaethical challenges you faced, with cases/considerations, classifications, and analysis of joint satisfiability. The purpose is explicitly **to settle a metaethical dispute** (e.g., realism vs. constructivism, objectivity of norms), though differences for an **AI-alignment target** (like CEV) are noted.

  ---

  ### **Core Desiderata**
  1.  **Non-Arbitrary Starting Materials (Non-Negotiable)**
      *   *What it demands*: The initial state (desires, beliefs, values) fed into idealization must be justified without presupposing the normative conclusions. The output must not be an artifact of arbitrary selection.
      *   *Case/Consideration*: Contrast Harsanyi's "extended preferences" (all possible individual positions) with Rawls's "thin theory of the good" (basic goods). Why prefer one over the other without smuggling in normative assumptions? If starting with "current desires," why not "dispositions" or "biological drives"? Arbitrariness undermines objectivity.
      *   *Why Non-Negotiable*: Without this, the theory is foundationally unstable and vulnerable to the "garbage in, garbage out" critique; normativity becomes contingent on an unjustified initial input.

  2.  **Closed & Complete Idealizing Parameters (Negotiable - Realist Prejudice?)**
      *   *What it demands*: The list of idealizing conditions (full information, vividness, coherence, procedural constraints) must be finite, clearly definable, and demonstrably sufficient to yield a verdict. "Etc." is fatal.
      *   *Case/Consideration*: Does "fuller information" include knowing *how it feels* to be tortured? Does "sounder reasoning" include adopting Bayesian updating or deontic logic? An open-ended list creates indeterminacy; the procedure never clearly "finishes."
      *   *Why Potentially Negotiable/Prejudiced*: Strict closure might reflect a realist desire for a determinate, unique truth. A constructivist might accept a finite *procedure* that converges even if the *labeling* of conditions is open (e.g., "whatever reasoning corrects error").

  3.  **Non-Question-Begging Conditions (Non-Negotiable)**
      *   *What it demands*: The idealizing conditions (information, reasoning rules, constraints) cannot be selected *because* they produce a specific, antecedently known normative output. They must be justified independently of the normative facts they are meant to explain.
      *   *Case/Consideration*: Defining "sounder reasoning" as "reasoning that leads to Kantian conclusions" blatantly smuggles in the answer. More subtly: defining "relevant information" in a way that excludes data undermining utilitarianism. The Euthyphro dilemma applies: is it good *because* the ideal agent approves, or does she approve *because* it's good?
      *   *Why Non-Negotiable*: Violation renders the account circular and explanatorily vacuous. It fails as a *foundation* for normativity. **This eliminates the most candidates**, as many accounts implicitly rely on normatively loaded conceptions of rationality or relevance.

  4.  **Recognizability / Ownership (Negotiable - Internalist Prejudice)**
      *   *What it demands*: The actual agent must be able to see the idealized output as an authentic extension or correction of their own perspective, not the verdict of a fundamentally alien being.
      *   *Case/Consideration*: If idealization radically transforms a timid person into a fearless utilitarian hero endorsing self-sacrifice, the timid person might rightly disown the result ("That's not *me* anymore!"). Internalist motivation (Williams) requires this link.
      *   *Why Prejudiced*: Externalists (realists, some Kantians) reject the need for recognizability; the norm is binding regardless. For **AI alignment (e.g., CEV)**, recognizability is *crucial* to ensure the AI serves *us*, not some alien ideal.

  5.  **Consistency with Empirical Psychology (Non-Negotiable for Naturalists)**
      *   *What it demands*: The idealization process must cohere with what we know about human cognition. It cannot assume reflection/information *always* improves judgment if evidence shows it often doesn't (biases, framing effects, information overload).
      *   *Case/Consideration*: Studies show more information can increase confidence without accuracy, or that forced "rational coherence" can alienate people from values central to identity. An idealization ignoring these risks being psychologically unrealistic and normatively inert.
      *   *Why Non-Negotiable (for Naturalism)*: If normativity is grounded in human psychology, the idealization must respect its actual contours. Non-naturalists might downplay this.

  ---

  ### **Load-Bearing Desiderata (Your Suspicions)**
  6.  **Idempotence (Non-Negotiable for Stability)**
      *   *What it demands*: Applying the idealization procedure *to its own output* should yield no further change. The output is stable under the procedure.
      *   *Case/Consideration*: If the "ideally informed/coherent" agent, upon re-applying the procedure (e.g., with even *fuller* info or *more* coherence), changes its mind, the initial output wasn't truly idealized. Stability is essential for a definitive verdict. Failure suggests the procedure is incomplete or incoherent.

  7.  **Monotonicity of Partial Idealization (Highly Desirable, Possibly Negotiable)**
      *   *What it demands*: Progressively applying idealization steps (more info, more coherence) should generally produce outputs that are closer approximations to the *final* idealized verdict. "Better" partial idealization should be "closer."
      *   *Case/Consideration*: Does getting slightly more information or achieving slightly more coherence reliably move the agent's judgment *towards* the fully idealized verdict? Or can it sometimes lead *further away* (e.g., partial info amplifying biases, temporary incoherence during reflection)? Non-monotonicity makes the path to idealization treacherous and raises doubts about the endpoint's authority.
      *   *Why Potentially Negotiable*: Real-world reasoning *is* non-monotonic. Insisting on strict monotonicity might force an unrealistic model of reasoning. Convergence in the limit might suffice.

  8.  **Solution to Unbounded Parameters (Non-Negotiable for Determinacy)**
      *   *What it demands*: The account must specify what constitutes the endpoint for idealizations like "full information" or "perfect coherence," which lack a clear maximum. What is picked out? A convergent limit? A stability plateau? Or is it undefined?
      *   *Case/Consideration*: "Full information" is potentially infinite. "Perfect coherence" might be unattainable (Gödelian limits?). If there's no convergence or stability, there's no determinate output. Does the view posit a *limit* of ever-better approximations (e.g., CEV)? Or a *plateau* where further idealization yields no significant change (e.g., Brandt's psychotherapy endpoint)? "Nothing" is fatal.
      *   *Why Non-Negotiable*: Without this, the idealization procedure lacks a defined output, rendering the normative verdict indeterminate or non-existent.

  ---

  ### **Potential Joint Unsatisfiability**
  The most likely conflict is between:
  *   **Recognizability/Ownership:** Requires the idealized self to remain fundamentally *continuous* with the actual self.
  *   **Non-Question-Begging Conditions + Solution to Unbounded Parameters + Idempotence:** Often requires *radical transformation* to achieve stable convergence under demanding, independently justified conditions (full non-question-begging info/coherence).

  **The Tension:** Can a process involving potentially massive cognitive overhaul (new info, flawless reasoning, profound coherence) produce an agent whose verdicts the *original*, flawed agent can still recognize as authentically *theirs*? Or does deep idealization inevitably create a "stranger within"? This tension lies at the heart of the internalism/externalism debate. **If recognizability is demanded, it likely conflicts with the requirements for a robust, stable, non-question-begging ideal endpoint.**

  ---

  ### **Scoring Leading Contenders**
  *   **Ideal Observer Theory (e.g., Firth):** Fails **Non-Question-Begging** (defining "disinterest," "omniscience," "normalcy" is normatively loaded), struggles with **Unbounded Parameters** (what *is* omniscience?), **Recognizability** is irrelevant (external perspective). **Consistency with Psychology** is weak.
  *   **Brandt's Cognitive Psychotherapy:** Strong on **Recognizability** and (intended) **Consistency with Psychology**. Fails **Non-Question-Begging** (scientific method/relevance of desires relies on normative assumptions), **Unbounded Parameters** (no clear max for "cognitive psychotherapy"), **Idempotence/Monotonicity** unclear, **Closed Parameters**? (What counts as a "fact" or "logic"?).
  *   **Full-Information Accounts of Welfare (e.g., Railton):** Fails **Non-Question-Begging** (defining "full information" normatively loads the answer - what's *relevant*?), **Unbounded Parameters** acute, **Recognizability** often weak (transformed self), **Monotonicity** doubtful (more info can worsen prediction).
  *   **Alignment Descendant (e.g., Coherent Extrapolated Volition - CEV):** Explicitly addresses **Unbounded Parameters** (limit of reflection) and **Idempotence** (by definition). **Recognizability** is central. Fails **Non-Question-Begging** (defining "extrapolation," "volition," "coherence" relies on contested norms), **Non-Arbitrary Start** (why current desires?) and **Closed Parameters** are major challenges. **Monotonicity** assumed but empirically dubious.

  **Verdict:** No leading contender convincingly satisfies all non-negotiable desiderata (**Non-Arbitrary Start, Non-Question-Begging, Idempotence, Solution to Unbounded Parameters, Consistency w/Psychology**). The **Non-Question-Begging** requirement is the most devastating, implicating almost all accounts in circularity or implicit normativity. The **Recognizability vs. Radical Transformation** tension remains a fundamental hurdle for internalist aspirations. Your stalemate reflects deep, likely unresolved, problems within the idealized deliberation framework itself.
