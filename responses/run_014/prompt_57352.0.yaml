answer: |-
  Based on your verdicts and constraints, I'll extract, test, and refine your implicit principle. Your "retentionism" is the starting point, but it requires significant repair to capture your judgments. Below is a precisely stated principle derived from your cases, followed by analysis. I call it **Maintenance Teleonomy** to reflect its core mechanism.

  ### (a) The Principle: Maintenance Teleonomy
  A trait *T* (in system *S*) has *F* as a function **if and only if**:
  1. **Capacity Clause**: *T* has the causal capacity to contribute to *F* in *S*'s typical environment.  
     *Saves*: Cases 1–3 (distinguishes function from accident), 5 (novel enzyme), 6 (dual functions), 9 (printed valve).  
  2. **Maintenance Clause**: *T*'s persistence in *S* (or its lineage/population) is *currently sustained* by a filter process that detects and retains *T* specifically because of *T*'s capacity to *F*.  
     *Saves*: Cases 2 (donor heart), 5 (antibiotic enzyme), 8 (lab moths), 9 (printed valve).  
  3. **Non-Derivation Clause**: *F* is not solely dependent on *T*'s historical origin or a prior selected effect.  
     *Saves*: Cases 5 (no history), 6 (dual functions), 9 (accidental valve).  

  **Explanatory Notes**:  
  - **"Currently sustained"** (Clause 2) means the filter operates in the *contemporary* context, not just ancestrally. Filters include natural/artificial selection, cultural transmission, clonal expansion, market forces, etc.  
  - **"Detects and retains"** requires the filter to be responsive to *F*—e.g., selection favors *T* *because* it does *F*, while artificial breeding maintains *T* *for* eyespot geometry.  
  - **"System"** (*S*) is context-dependent: for organs, *S* is the organism; for genes/proteins, *S* is the cell/population.  

  ### (b) How Maintenance Teleonomy Handles Your Cases
  Your principle fails two verdicts but succeeds elsewhere. **You must abandon Case 4 (appendix) and Case 7 (genomic transcript)** to achieve consistency. Here’s why:

  - **Case 4 (Appendix)**: You deny "harboring flora" is its function. Retentionism/Maintenance Teleonomy *agrees* if the appendix's persistence in humans is *not* sustained by its bacterial refuge capacity (e.g., if it persists due to developmental constraints or inertia). Your verdict conflicts with Case 2 (donor heart) only if you insist the appendix *is* maintained by its current utility—but you don’t. **Verdict saved** under Maintenance Teleonomy.  
  - **Case 7 (Genomic transcript)**: You deny function. Retentionism fails here because "noise" implies no maintenance filter responds to its activity. Maintenance Teleonomy **saves this** via Clause 2: if transcription isn’t filtered *for* its effect (e.g., no fitness consequence), no function exists.  
  - **Cases 6 vs. 7**: These *are* distinguishable:  
    - Case 6 (crystallins): In the lens, the protein’s refractive capacity is maintained by selection (filtering for optical properties). Its enzymatic function elsewhere is maintained separately.  
    - Case 7: No filter maintains the transcript *for* altering chromatin; it’s noise.  
  - **Cases 8 vs. 9**: Distinction holds:  
    - Case 8 (moth eyespots): Maintained *for* geometry (by artificial selection), not startling. Startling is incidental.  
    - Case 9 (printed valve): Maintained *for* flow regulation (by clinical efficacy filter), even if accidental.  

  **Failures Requiring Abandonment**:  
  - **Case 4 (Appendix)**: You resist calling its current utility a function. But if the bacterial refuge *does* maintain the appendix in modern humans (e.g., by conferring a fitness advantage), Maintenance Teleonomy *forces* you to call it a function—contradicting your verdict. **You must abandon this verdict** to avoid inconsistency with Case 2. The donor heart’s function derives from its role in a system (human bodies) where hearts are maintained *for* pumping, whereas the appendix lacks analogous maintenance for flora-harboring.  
  - **Case 7 (Genomic transcript)**: Maintenance Teleonomy saves your verdict, but your original retentionism fails it (since retentionism’s Clause ii could be misread as "past maintenance," which might include inert traits).  

  **Why Abandon Case 4?** Your intuition in Case 2 (donor heart) relies on hearts being *type-maintained* for pumping in humans, while the appendix is not type-maintained for bacterial refuge. Clinging to Case 4 creates a double standard. Vestiges lack functions because no current filter sustains them *for* the effect—even if they’re useful.  

  ### (c) What Retentionism Is (and Isn’t)
  Retentionism is **not a genuine third account**. It is an **etiological account with a widened time window**, and the disguise fails in two places:  
  - **Etiological Core**: Retentionism’s Clause ii ("continued presence explained by capacity") is etiological—it explains *why the trait persists*. Pure causal-role accounts (e.g., Cummins) lack this explanatory dimension.  
  - **Disguise Fails**:  
    1. **"Continued presence" ≠ "Current utility"**: Etiological accounts typically reference *past* selection. Retentionism shifts to *ongoing* maintenance but retains the etiological structure (explaining persistence via a selective filter).  
    2. **Vagueness in "Filter"**: Retentionism’s "any population-level filter" is its fatal flaw. Without specifying *responsiveness to F*, it cannot distinguish Case 8 (eyesports maintained for geometry, not startling) or Case 7 (transcript not maintained for effect). Maintenance Teleonomy repairs this by requiring the filter to "detect and retain *because of* capacity *F*."  

  ### (d) Verdicts for New Cases
  Applying Maintenance Teleonomy:  
  1. **Lactase persistence**:  
     - In a dairying population: **Has a digestive function**. It persists *because* it enables lactose digestion (cultural/selection filter).  
     - In a non-dairying population: **No digestive function**. If lactase persistence exists (e.g., via drift), it lacks a maintenance filter tied to digestion.  
  2. **Gene-drive construct**: **Has a function** (to spread itself). Its persistence is maintained *by* the drive mechanism, which detects and retains it *because of* its capacity to bias inheritance (Clause 2).  
  3. **Dewclaw in show-line dogs**: **Has a function** (conformance to breed standard). It persists *because* it satisfies a cultural filter (dog shows), even if anatomically vestigial.  

  ### (e) Does This License Function *Explanations*?  
  **Yes, robustly**. Maintenance Teleonomy directly licenses explanations of *why a trait is present* by appealing to what it does:  
  - **Explanatory Structure**: "Trait *T* persists in system *S* because it does *F*."  
    - *Examples*:  
      - Hearts pump blood → maintained in humans for this capacity.  
      - Gene-drives spread → maintained by drive mechanism.  
  - **Contrast with Taxonomy**: Pure causal-role accounts (e.g., "T contributes to F") only sort traits; etiological accounts explain via *past* selection. Maintenance Teleonomy explains *current persistence* via *ongoing* maintenance, capturing dynamic processes (e.g., Case 5’s novel enzyme spreading *now*).  
  - **Biological Relevance**: This mirrors how biologists explain traits—e.g., antibiotic resistance genes are "for" resistance because they *are maintained* by antibiotic exposure. It handles edge cases (e.g., human artifacts, lab evolution) without relying on intent or history.  

  ### Final Recommendation
  Adopt **Maintenance Teleonomy** and **abandon your verdict on Case 4 (appendix)**. This principle:  
  - Captures 8/9 of your verdicts (all except 4).  
  - Resolves tensions (6 vs. 7, 8 vs. 9) via the maintenance clause.  
  - Delivers explanatory power for biology.  

  If you insist on keeping Case 4, you must introduce an *ad hoc* "no vestiges" clause—but this undermines your goal of a unified principle. The appendix is the price of consistency.
