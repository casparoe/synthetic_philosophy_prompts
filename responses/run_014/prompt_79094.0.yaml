answer: |-
  Here's a breakdown of the philosophical presuppositions and theoretical tensions behind state apologies for historical wrongs. Your confusion is spot-on – the practice sits at the intersection of complex ideas about time, identity, agency, responsibility, and the nature of the state. Let's reconstruct the core theory and its alternatives.

  **The Core Presupposition: Moral Continuity & Symbolic Repair**

  At its heart, the practice presupposes that **a political community (embodied by the state) possesses a moral identity that persists across time, capable of inheriting and discharging moral debts related to its own past actions, even when the literal individuals involved are gone.**

  **Breaking Down the Required vs. Contingent Elements:**

  1.  **Moral Continuity of the Political Community (Required):**
      *   **Strictly Required:** The state *must* be understood as representing a continuous political entity ("the nation," "the people," "the state") that transcends generations. This is non-negotiable for the apology to make sense *as an act of the wrongdoer acknowledging its own past wrong*.
      *   **Alternatives to Strict Identity:** It doesn't necessarily require a *metaphysically identical* agent ("the exact same 'we'"). Weaker, functional alternatives suffice:
          *   **Trustee Model:** The current state acts as the trustee or representative of the *ongoing political community*, responsible for stewarding its moral legacy.
          *   **Institutional Continuity:** The state is the institutional embodiment of a community with a shared history and identity; its continuity justifies inheriting responsibility for its institutional actions.
          *   **Narrative Continuity:** The community understands itself through a shared narrative; acknowledging grievous wrongs within that narrative is essential to its integrity.

  2.  **Collective Moral Agency (Partially Required, Contested):**
      *   **Required:** The state must be capable of *acting* morally (or immorally) as a collective entity. Its actions (past and present) are not reducible *solely* to the sum of individual actions.
      *   **Contested Nature of "Remorse":**
          *   **Strict View (Remorse):** Some theories hold collectives *can* feel something analogous to individual remorse (e.g., collective shame, regret, acknowledgment of dishonor). This view is philosophically demanding and controversial.
          *   **Weaker View (Commitment/Acknowledgment):** The practice *can* function (and often does in reality) without presupposing genuine collective *emotion*. It primarily presupposes the capacity for **collective acknowledgment of wrongdoing** and the **undertaking of a moral commitment** (e.g., to remember, to learn, to not repeat, to respect descendants). This is the more common and defensible presupposition. The apology *is* the performative act of taking on this commitment. Your flatmate's "promise about the future" captures this well.

  3.  **Distinction Between Moral & Legal Responsibility (Required):**
      *   **Strictly Required:** The "no liability" clause is **not** a red herring, but it *presupposes* a clear separation between moral and legal/juridical responsibility. An apology admits **moral responsibility** for the past wrong. The clause explicitly denies that this moral admission translates into **legal liability** (compensation, punishment) *for the current state or individuals*. This is crucial for the practice to be politically viable.
      *   **Why it Doesn't Gut the Point:** Moral responsibility isn't erased by the passage of time or lack of legal recourse. The apology addresses the *moral stain* on the community's identity and history. Legal liability often has statutes of limitations or focuses on individual perpetrators/victims; moral responsibility concerns the community's enduring relationship to its past actions and its obligations to the descendants of victims.

  4.  **The Audience of the Apology (Required Structure, Contested Focus):**
      *   **Strictly Required Structure:** The apology must be addressed *to* someone. It presupposes there are **relevant stakeholders** who have a moral claim to hear the acknowledgment.
      *   **Contested Focus (Who are these stakeholders?):**
          *   **The Dead:** While some theories argue the dead *can* be wronged (e.g., if their memory is dishonored or their life projects were unjustly thwarted), the practice **does not strictly require this controversial view**.
          *   **Living Descendants (Primary Focus):** The apology is overwhelmingly directed towards **the living descendants and the contemporary community** of the victims. It acknowledges the *ongoing legacy* of the wrong – historical trauma, social disadvantage, cultural loss, intergenerational injustice. The apology seeks to repair the *current relationship* damaged by the unacknowledged past.
          *   **The Wider Society/World:** It also serves as a public declaration to the wider society and the world, affirming shared values and repudiating the past actions.
          *   **The Apologizing Community Itself:** It can be an act of self-purification or identity-redefinition for the apologizing community ("This is not who we are/choose to be").

  5.  **The Speaker (Contingent, Affects Legitimacy):**
      *   **Not Strictly Required, but Highly Significant:** The practice doesn't *collapse* if the wrong speaker does it, but the choice profoundly impacts its meaning and legitimacy.
      *   **Head of State (e.g., Monarch, President):** Emphasizes symbolic unity, continuity of the office, and national representation. Can feel personal but risks being seen as merely ceremonial.
      *   **Parliament/Government (Resolution, Motion):** Emphasizes collective democratic will, institutional responsibility, and broader political consensus. Can feel more substantial but potentially more bureaucratic.
      *   **Ideal:** The most legitimate speaker is the highest representative body or figure acting with clear authority derived from the contemporary political community, acknowledging the acts of its predecessor institutions.

  **Addressing Your Specific Observations:**

  *   **Why apologize for 1904 but not last year?** Precisely *because* the historical wrong is beyond legal liability and involves symbolic identity work. Apologizing for recent acts carries immediate legal, financial, and political consequences the state wants to avoid. Historical apologies are often seen as "safer" symbolic gestures.
  *   **Apologizing to a group without naming individuals:** Reinforces the *collective* nature of both the harm (often inflicted based on group identity) and the responsibility. Naming individuals might be impossible or politically fraught, and the wrong was often systemic/targeted at the group.
  *   **Criminalizing Denial:** This is a *separate* act, presupposing that the historical fact is now foundational to the state's identity/narrative and that denial constitutes a *present* harm (e.g., incitement, hate speech, undermining reconciliation). It shifts from moral acknowledgment to present-day legal enforcement of a historical truth.

  **Compatibility with Rival Theories & Where Tension Lies:**

  The practice *can* function under several different underlying theories about collective responsibility and identity, as long as they accept the core of moral continuity and symbolic repair:

  1.  **"Strict" Collective Identity:** (The state *is* the same agent). Compatible, but metaphysically strongest and least necessary.
  2.  **"Functional" Continuity (Trustee/Institutional):** Highly compatible and arguably the most common foundation in practice.
  3.  **"Narrative" Continuity:** Compatible – the apology corrects the national story.
  4.  **"Present Obligations" View:** Focuses on *current* obligations stemming from the *ongoing consequences* of past wrongs (e.g., structural injustice). The apology can be framed as acknowledging the source of these present obligations. Compatible.
  5.  **"Communicative Repair" View:** Focuses on the act of apology restoring dialogue, respect, and trust *now*. Compatible.

  **Tension Points:**

  *   **Radical Individualism:** Theories denying *any* form of collective agency or transgenerational moral responsibility fundamentally undermine the practice. If only individuals act and are responsible, and that responsibility dies with them, state apologies become pure theater or worse.
  *   **Legal Positivism (Overly Strict):** Views that *only* legal liability matters struggle to see the point beyond political expediency.
  *   **Cynical Realism:** Views the state *only* as a power structure see apologies solely as tools for legitimation or pacification, devoid of genuine moral content.

  **Swapping the Presupposed View: What Changes?**

  Suppose we swap the core "moral continuity" view for a purely **"present consequences"** view (where the *only* moral obligation is to address *current* structural inequalities, regardless of historical cause or collective identity).

  *   **What Changes in the Practice:**
      *   **Focus:** The apology becomes *explicitly* about acknowledging the *present-day impact* of the historical event, not the past act *per se* or the identity of the perpetrator. ("We apologize for the *ongoing disadvantage/harm* stemming from Event X").
      *   **Language:** Less emphasis on "we" (the inheritor) and "our past wrong". More emphasis on "the legacy of X" and "its effects today".
      *   **Expectations:** The apology would be intrinsically linked to *concrete, measurable actions* addressing present inequalities. The "no liability" clause might feel even more jarring or be omitted entirely. The symbolic "taking ownership of the past" element diminishes.
      *   **Legitimacy:** Might feel more "honest" to critics who reject transgenerational responsibility, but risks losing the powerful symbolic weight of connecting present community to past actions.

  **Conclusion:**

  The practice of state apologies for historical wrongs presupposes the **moral continuity of the political community across time** and its capacity for **collective acknowledgment and commitment.** It primarily functions as an act of **symbolic repair** directed towards **the living descendants and the contemporary relationship**, acknowledging **moral (not legal) responsibility**, and undertaking a **commitment regarding memory and future conduct**. While compatible with various theories about *how* this continuity works (institutional, narrative, trustee), it fundamentally clashes with views denying *any* form of collective agency or transgenerational moral connection. The "no liability" clause is essential to its political function but doesn't negate its core moral purpose. It's a complex ritual navigating the tension between history, identity, morality, and politics – hence your (entirely justified) 2am confusion! Use this framework to analyze a specific apology for your paper. Good luck!
