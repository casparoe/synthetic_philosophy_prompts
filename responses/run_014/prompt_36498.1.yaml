prompt: |-
  I head the interpretation team at a regional history museum, and all of our exhibit copy — wall text, object labels, timelines, audio guide scripts — is drafted by curators, edited by generalist writers, and signed off by me before it goes to print. After our most recent exhibit, a historian on our advisory board complained that our labels were Whig history in miniature: the city's past read as a dress rehearsal for its present, every old institution judged by whether it "led to" what we now have, and the losing side of every conflict treated as an obstacle on a road whose destination everyone at the time supposedly knew. My staff split over what to do. One faction thinks the cure would be worse than the disease — visitors want a story with some direction, and a label so hedged that it presents everything as equally contingent is unreadable in the eight seconds a visitor actually spends on it. The other faction suspects that any moral language about the past is Whig, that we should stop calling the 1908 milk-pasteurization campaign a triumph and the child labor in our mills a horror, and I don't think that can be right either: some things really were better and worse than others, and pretending the past is a moral flatline is its own kind of falsification.

  What I want is a procedure our copywriters can run on a draft label in the time they actually have — call it ten minutes per label, several hundred labels per exhibit — with no historian in the room. Please translate whatever the historiography genuinely offers (Butterfield's original complaint, the distinction between narrating change and narrating progress, the distorting power of hindsight, the "on the right side of history" rhetoric that even our fundraising copy keeps drifting into) into a sequence of tests a non-specialist can apply: the questions to ask in order, what counts as a sufficient answer to each, where the procedure ends with a concrete rewrite, and where it has to hand the label back to a curator because the problem is one of interpretation rather than detectable wording. Be honest about which of your tests are mechanical and which are judgment calls dressed up as procedure — my writers can tell the difference, and they'll stop using a checklist that pretends.

  Then run the procedure on three real drafts I'm sitting on. First, our label about the textile mills closing: "The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible." Second, the pasteurization label: "A pioneering step toward the public-health protections we take for granted today." Third, our Then-and-Now timeline wall, which pairs 1890s photographs of the same street corners with 2020s ones. Include at least one case where the procedure returns a verdict I won't like — I am fond of that timeline wall and have defended it publicly — and make sure you say what the procedure cannot do: what kinds of Whig history live at the level of the exhibit as a whole, in which objects get selected and how visitors are routed through the gallery, that no per-label checklist will ever catch.
reasoning: |-
  Okay, the user heads an interpretation team at a regional history museum and is dealing with criticism that their exhibit labels promote Whig history. Whig history presents the past as a linear progression toward the present, judging past events based on current values and outcomes. The user's team is divided: one group thinks avoiding this would make labels too vague, while the other wants to remove all moral judgments, which the user believes is also problematic. They need a practical, time-efficient procedure for writers to apply to draft labels without needing a historian. They also want this procedure tested on three real examples and to understand its limitations.

  First, I need to recall Butterfield's critique. Whig history involves presentism, inevitability, and moral judgments based on current standards. The key is to distinguish between narrating change and narrating progress. The procedure must be actionable within 10 minutes per label, so it needs clear, sequential steps. The tests should be straightforward, maybe even mechanical where possible, but also flag when a deeper interpretive issue requires curator input.

  The user mentioned concrete examples: a textile mill label, a pasteurization campaign, and a then-and-now timeline. The procedure must identify Whig elements like teleology (implying events led inevitably to now), moral language tied to present outcomes, and omission of contingencies or losers' perspectives. 

  For the procedure, steps could include checking for words implying inevitability ("led to," "paved the way"), moral judgments from a present view ("triumph," "horror"), and whether alternatives or contingencies are acknowledged. Each step needs clear yes/no questions. When a problem is found, the writer should have specific rewrite strategies. If it's about deeper interpretation, like what facts to include, it goes back to the curator.

  Testing on the examples:
  - Textile mill label: "legacy lives on in the thriving arts district" implies the arts district was the inevitable, positive outcome. The procedure might suggest adding how the transition wasn't planned or mentioning other consequences like job losses.
  - Pasteurization label: "pioneering step toward... we take for granted" frames it as leading directly to today, ignoring past debates. Rewrite to focus on the campaign's context and challenges.
  - Timeline: Pairing old and new photos without context assumes the present is the endpoint. The procedure might recommend adding questions about what changed and why, or including absent perspectives.

  The user needs honesty about mechanical vs. judgment calls. For instance, spotting teleological language is mechanical; deciding if an alternative outcome was plausible is a judgment. Also, exhibit-level issues like object selection or visitor flow can't be fixed by per-label edits. These require curatorial and design decisions.

  The user might be attached to the timeline, so pointing out its Whig aspects could be unwelcome but necessary. Highlighting that the checklist can't address structural biases in the exhibit is crucial. Writers need to know when to escalate issues beyond wording.
answer: |-
  Here's a battle-tested, time-conscious procedure for your copywriters to detect and mitigate Whig history in exhibit labels, grounded in historiography but stripped for utility. It focuses on **detectable textual patterns** Butterfield critiqued: teleology, presentism, moral triumphalism, and the erasure of contingency/losers.

  **The Anti-Whig Label Scan (10-Minute Procedure):**

  1.  **Scan for Teleology & Inevitability (Mechanical):**
      *   **Question:** Does the text imply events *had* to happen this way to lead to *our* present? Look for: "led to," "paved the way for," "set the stage for," "would eventually," "culminated in," "foreshadowed," "inevitable," "necessary step," "destined."
      *   **Sufficient Answer:** If YES, flag the phrase(s). Rewrite is usually possible *here*.
      *   **Rewrite Strategy:** Replace teleological verbs/nouns with verbs of simple change or action. Add contingency words: "contributed to," "influenced," "occurred alongside," "one response was," "a consequence was," "contemporaries debated," "unintentionally resulted in," "among the outcomes was," "at the time, it was seen as...".
      *   **Handoff to Curator?** No. This is wording.

  2.  **Scan for Present-Centered Moral Judgment (Judgment Call):**
      *   **Question:** Is a past event *explicitly* judged "good" or "bad" *solely* because it aligns (or not) with *current* mainstream values or the present outcome? (e.g., "triumph," "horror," "backward," "progressive," "failure," "success," "regrettable," "fortunate" applied anachronistically).
      *   **Sufficient Answer:** Requires **contextual judgment**.
          *   *Mechanical Aspect:* Flag the explicit judgment word.
          *   *Judgment Call:* Ask: "Is this word reflecting a *widespread contemporary perspective we can evidence*, or is it *our* retrospective verdict?" If it's purely retrospective moralizing, it's likely Whiggish.
      *   **Rewrite Strategy:**
          *   Option A (Preferred): **Attribute the judgment.** ("*Viewed by reformers as* a triumph," "*Condemned by labor activists as* horrific," "*Many contemporaries saw this as* backward," "*This practice is now widely considered*...").
          *   Option B: **Replace with factual description** of consequences/conditions ("resulted in significantly reduced infant mortality," "involved children working 12-hour shifts," "limited suffrage to property-owning men").
          *   Option C: **Use contemporary terms/sources** ("a 'sanitary revolution,'" "condemned as 'wage slavery,'" "hailed as 'progress'").
      *   **Handoff to Curator?** Only if the *fundamental interpretation* ("Was this good/bad?") is disputed *by historians* and crucial to the narrative. Otherwise, rewrite per above.

  3.  **Scan for Erasure of Alternatives & Losers (Judgment Call):**
      *   **Question:** Does the text imply the outcome was the *only* conceivable or desirable one? Are the people/ideas/institutions that "lost" portrayed merely as obstacles or irrelevant, without their perspective or the stakes of the conflict?
      *   **Sufficient Answer:** Requires **contextual judgment**.
          *   *Mechanical Aspect:* Look for absolutes ("the only way," "everyone knew"). Look for passive voice obscuring agency ("was overcome" vs. "was defeated by...").
          *   *Judgment Call:* Ask: "Does this label acknowledge that other outcomes were plausible or desired *at the time*? Does it acknowledge the existence and perspective (even briefly) of those who opposed or were harmed by the 'winning' side?"
      *   **Rewrite Strategy:**
          *   **Acknowledge contingency:** "At the time, alternative proposals included...", "The outcome was fiercely contested...", "Many believed... while others argued...".
          *   **Name the losers/opposition:** "...overcoming resistance from small dairy farmers who feared...", "...displacing workers who had few alternatives...", "...challenged by traditionalists who argued...".
          *   **State stakes simply:** "The debate involved fundamental questions about...".
      *   **Handoff to Curator?** Yes, if the label *fundamentally misrepresents* the historical debate/alternatives or the significance of the "losers." Requires deeper research/narrative adjustment, not just wording.

  4.  **The "On the Right Side of History" Final Sniff Test (Mechanical/Judgment):**
      *   **Question:** Reread the label. Does it leave the impression that history has a predetermined, morally improving direction that "we" (the museum/visitors) are comfortably on the endpoint of? Does it feel like a pat on the back for the present?
      *   **Sufficient Answer:** Holistic judgment based on steps 1-3. If multiple triggers above are present, the answer is likely YES.
      *   **Action:** Apply rewrites from steps 1-3 more rigorously. Consider adding a *brief* open-ended question or unresolved tension if space allows ("Debates over the proper role of government in public health continue today," "The city still grapples with the uneven consequences of deindustrialization").

  **Procedure Output:**
  *   **Clean:** No flags/rewrites needed.
  *   **Rewrite Needed:** Specific edits identified (Steps 1 & 2 usually).
  *   **Curator Consultation Needed:** Interpretation issue flagged (Step 3 usually).

  ---

  **Testing the Procedure on Your Drafts (10 mins each):**

  1.  **Textile Mill Closing:**
      *   *"The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible."*
      *   **Step 1 (Teleology):** FLAG. "could not survive" implies inevitability. "legacy lives on... it made possible" strongly teleological (mills existed *to* enable arts district?).
      *   **Step 2 (Moral Judgment):** Implied (Thriving Arts District = Good Legacy). Not explicit judgment word, so less severe. "Thriving" is positive, but potentially factual.
      *   **Step 3 (Alternatives/Losers):** FLAG. Erases contingency (Why *couldn't* it adapt? Global shifts? Policy choices? Labor costs?). Erases losers (Displaced workers? Community trauma? Environmental cleanup costs?). Implies the Arts District was the *intended* or *only* valuable legacy.
      *   **Step 4 (Right Side):** YES. Present (arts district) is the positive, validating endpoint.
      *   **Verdict:** **REWRITE NEEDED** (Primarily Step 1 & 3).
      *   **Suggested Rewrite:** *"Global economic shifts and changing production methods led to the closure of the city's textile mills in the late 20th century, causing significant job loss and community upheaval. In subsequent decades, the adaptive reuse of former mill buildings played a key role in the development of the city's arts district."* (Removes teleology, acknowledges disruption, frames arts district as *a* later consequence, not *the* purpose).

  2.  **Pasteurization Label:**
      *   *"A pioneering step toward the public-health protections we take for granted today."*
      *   **Step 1 (Teleology):** FLAG. "step toward... we take for granted today" is classic teleology. Implies a direct, inevitable, progressive march to *our* present.
      *   **Step 2 (Moral Judgment):** Implied (protections = good, "take for granted" hints at superiority). "Pioneering" is positive but potentially factual/contemporary.
      *   **Step 3 (Alternatives/Losers):** FLAG. Erases fierce contemporary opposition (e.g., from raw milk advocates, small dairies, libertarians), debates over government power, and scientific uncertainty at the time.
      *   **Step 4 (Right Side):** YES. Strongly implies we are the beneficiaries of a predestined progress story.
      *   **Verdict:** **REWRITE NEEDED** (Primarily Step 1 & 3).
      *   **Suggested Rewrite:** *"The 1908 pasteurization campaign, championed by public health reformers, significantly reduced milk-borne diseases despite facing opposition from some dairy producers and consumers. It exemplified growing government intervention in public health."* (Focuses on contemporary action, context, conflict, and significance *then*, removes "triumphal march to now").

  3.  **Then-and-Now Timeline Wall:**
      *   *Pairs 1890s photographs of the same street corners with 2020s ones.* (Implicit narrative: Look how far we've come / See how things have changed).
      *   **Step 1 (Teleology):** **FLAG (Structural).** The *very format* implies "Then -> Now" as a meaningful, often progressive, sequence. The selection of pairs inherently tells a story of change *towards* the present endpoint. The lack of interpretive text between photos amplifies this.
      *   **Step 2 (Moral Judgment):** Depends on photos. If 1890s show horses/mud/old clothes vs. 2020s cars/pavement/modern dress, the implicit judgment is often "progress" (cleaner, more advanced). If 1890s show vibrant street life vs. 2020s vacant chain stores, judgment might be "decline," but still Whiggish (judging past by present ideal).
      *   **Step 3 (Alternatives/Losers):** **FLAG (Severe).** This format inherently erases *process, conflict, contingency, and perspective*. *How* did we get from A to B? Who won? Who lost? Was this change debated? Was it inevitable? Why these specific corners? What changed *socially* not just physically? The "losers" of urban change are invisible.
      *   **Step 4 (Right Side):** **YES.** The visitor stands at the privileged endpoint ("Now"), implicitly judging "Then." The present is the resolution.
      *   **Verdict:** **CURATOR CONSULTATION NEEDED (Major Structural/Interpretive Issue).** A per-label checklist *cannot* fix this. The problem lies in the exhibit structure, object selection (only endpoints shown), and lack of interpretive framing *between* the pairs.
      *   **Why You Might Not Like This (But the Procedure is Right):** The format is inherently Whiggish. It narrates change *as* progress (or decline) towards the fixed point of "Now," erasing the messy middle and any perspective beyond the visual comparison. It hands the visitor the historian's gavel.
      *   **What the Procedure Can't Do Here:** Fix the core concept. It needs a conceptual overhaul, e.g.:
          *   Add interpretive captions *between* pairs explicitly naming forces of change (e.g., "Automobile Revolution, 1920s-1950s," "Urban Renewal, 1950s-1970s," "Deindustrialization, 1970s-1990s"), acknowledging winners/losers.
          *   Include photos *from intermediate decades* showing the process.
          *   Incorporate quotes from different eras commenting *on the changes as they happened*.
          *   Frame the wall with a question: "What does 'progress' look like on this street? Who benefited? What was lost?"

  ---

  **What the Procedure CANNOT Do (The Limits of a Label Checklist):**

  1.  **Exhibit-Level Narrative Arc:** If the *entire exhibit* is structured as "From Dark Past to Enlightened Present," no label tweak will fix it. The problem is curation and design. (e.g., an exhibit on "The March to Democracy").
  2.  **Object Selection Bias:** Selecting *only* objects that illustrate the "winning" side or that directly "led to" the present. (e.g., Only pro-pasteurization pamphlets, no photos of displaced mill workers after closures).
  3.  **Silencing Marginalized Voices:** If the perspectives of women, minorities, workers, or "losers" are absent *throughout* the exhibit narrative, a label checklist won't create them. This requires foundational research and curation decisions.
  4.  **Visitor Pathway as Destiny:** If the physical layout forces visitors down a single, linear path mirroring the "inevitable progress" narrative, it reinforces Whig history structurally.
  5.  **Thematic Choices:** Choosing themes like "Innovations that Shaped Our World" inherently leans Whiggish vs. "Contested Transformations" or "Lives in Transition."
  6.  **Deep Interpretation Disputes:** If curators fundamentally disagree on whether an event *was* progressive or regressive *in its context*, the checklist can enforce better *framing* ("Reformers saw it as... Critics argued..."), but not resolve the underlying historical debate.

  **In essence:** This procedure scrubs the most egregious Whiggish *language* and prompts awareness of contingency and perspective *within individual labels*. It makes the implicit explicit and challenges lazy teleology. However, **Whig history is ultimately a disease of narrative structure, curation choices, and underlying philosophy.** The checklist is a vital diagnostic and treatment tool, but curing the systemic illness requires vigilance at the conceptual level from curators, interpreters, and designers from the very beginning of the exhibit planning process. Defend your timeline wall if you must, but understand its inherent Whiggishness lies not in the words, but in the bones of the presentation.
