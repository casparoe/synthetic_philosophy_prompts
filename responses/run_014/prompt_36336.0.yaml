prompt: |-
  I'm a program officer at a mid-sized foundation that funds a peculiar mix: medical research, animal welfare initiatives, and global health projects. Our board includes a utilitarian economist, a devout Catholic, a contractualist lawyer, and someone who refuses to be pinned down but has strong views about future generations. In practice, our funding decisions often turn on disagreements among these moral views rather than on empirical questions, and the current method for handling this is shouting, followed by whatever the loudest board member remembers from dinner. I want better: a written decision procedure I can actually run on each funding round, drawing on whatever serious work exists on decision-making under moral uncertainty — expected choiceworthiness across theories, the different ways of pooling theories' rankings (averaging versus bargaining versus majority rule among views), the problem that theories don't come with a common unit of value, and what to do with views that contain absolute constraints rather than tradeoffs.

  The procedure should cover: how to enumerate the relevant theories for a decision without the list ballooning; how to tell whether theories genuinely disagree about an option or merely reach the same ranking for different reasons; how to handle a view with a lexical constraint (a theory that forbids an act outright, where no size of benefit to others compensates) when other theories assign the act a huge positive value; what to do when intertheoretic value comparisons can't be made even approximately; and when the procedure should stop computing and hand the decision back to the board as a matter of moral judgment that no procedure can absorb. It should say which steps are genuinely mechanical and which are judgment calls dressed up as arithmetic, and it needs to be runnable in an afternoon by someone without philosophy training, since we decide on roughly twenty proposals per funding cycle with two weeks per cycle.

  Then run it on three cases. First: a proposal to fund a campaign that accelerates the transition away from conventional cage systems in poultry farming, versus a proposal to expand a crisis intervention service, where the theories agree on the ordering but for wildly different reasons — does the agreement matter or should the procedure treat it as fragile? Second: a proposal to fund a wildlife intervention that kills a small number of wild animals to prevent a disease that would cause a much larger number to die slowly — here a rights-based constraint plausibly forbids the killing while the aggregative views strongly favor it. Third: a proposal aimed at reducing catastrophic risks to humanity's long-term future, where the disagreement turns on whether future people who don't yet exist can be harmed — and where the officer running the procedure (me) finds the long-termist case persuasive and should learn whether the procedure shares my bias. I want the procedure applied honestly, including wherever it yields a result I won't like.
reasoning: |-
  We are designing a decision procedure for a foundation with a board that holds diverse moral views. The procedure must handle moral uncertainty, including issues of intertheoretic value comparisons, absolute constraints, and lexical priorities. It should be practical, runnable in an afternoon by a non-philosopher, and applicable to about 20 proposals per cycle.

  Key components:
  1. Enumerate relevant moral theories without the list ballooning.
  2. Determine if theories genuinely disagree or just agree for different reasons.
  3. Handle lexical constraints (absolute prohibitions) versus large benefits in other theories.
  4. Deal with incomparable values across theories.
  5. Identify when to stop and return the decision to the board.

  We'll base the procedure on the framework of "expected choiceworthiness" (EC) across moral theories, but we must address the lack of a common unit and the presence of absolute constraints.

  Proposed Procedure:

  Step 0: Preprocessing (Before each funding round)
     - The program officer (you) compiles the set of funding proposals for the round (about 20). For each proposal, you will run the procedure to produce a ranking or scoring that the board can use.

  Step 1: Enumerate the Relevant Moral Theories (without ballooning)
     - We fix a small set of moral perspectives that represent the board members. We don't try to cover every possible theory, but rather the dominant ones that the board actually uses. For your foundation, we have:
          T1: Utilitarianism (the economist) - maximizes overall well-being.
          T2: Catholic Social Teaching (the devout Catholic) - emphasizes human dignity, common good, preferential option for the poor, and stewardship of creation. Note: This view may have constraints (e.g., against certain kinds of killing).
          T3: Contractualism (the lawyer) - acts are right if they are justifiable to all affected parties. This often focuses on rights and mutual respect.
          T4: Long-termism (the person concerned with future generations) - gives great weight to the long-term future and avoiding existential risks.

     - We do not include more than these four without board approval because the board members are the ones who matter. If a board member holds a view that combines theories, we ask them to assign weights to the components or to pick one as primary.

  Step 2: For Each Proposal, Determine Each Theory's Evaluation
     - For each theory Ti and each proposal P, we need an evaluation. This evaluation can be:
          (a) A numerical score (if the theory is cardinal and comparable).
          (b) An ordinal ranking (if the theory only gives orders).
          (c) A binary verdict (e.g., "permissible" or "impermissible") in the case of constraints.

     - However, we face the problem of different units. We will use a normalized scale for cardinal theories and a ranking-based approach for ordinal ones.

     - How to get the evaluation? We rely on the board members (or the program officer) to provide, for each theory, a relative assessment of the proposals. Since you are the officer, you will do this by:
          - Interviewing board members (if time allows) to get their theory's perspective on the proposals.
          - Using your own understanding of the theories (since you have been working with them) to assign scores or rankings.

     - To avoid ballooning, we stick to the four theories and we do not break them into sub-theories unless a board member insists on a nuanced view. In that case, we treat the nuanced view as a separate theory only if it leads to substantially different orderings.

  Step 3: Determine Genuine Agreement or Disagreement
     - For a given pair of proposals, if two theories rank them in the same order, we consider that they agree on that pair. But we must note if the agreement is for the same reason (which would make the agreement robust) or for different reasons (which might be fragile if the reasons change).

     - However, for the purpose of aggregation, we only care about the ordering, not the reasons. The fragility might be a reason to discount the agreement, but we don't have a formal way to do that. Instead, we note it and if the agreement is fragile, we treat it as a potential source of uncertainty.

     - In practice, we record the ordering and the magnitude of the difference (if cardinal) for each theory.

  Step 4: Handling Lexical Constraints and Incomparability
     - If a theory Ti has an absolute constraint against a proposal P (e.g., it is forbidden no matter what the benefits), then we assign P a value of -∞ in Ti. However, this causes problems in aggregation because it might dominate. We handle this by:
          - First, checking if any theory forbids P. If at least one theory forbids P, then we set the overall decision to "reject" unless we can find a way to "bracket" the forbidden theory. But note: we cannot simply ignore a theory.

     - We adopt a two-stage process:
          Stage 1: Check for any absolute constraints. If a proposal is forbidden by any theory that the board member holds as having veto power (which we assume is the case for constraints in the Catholic view or contractualist view when they are taken as deontological), then we set the proposal aside as "controversial" and it goes to the board for discussion.
          Stage 2: For proposals that pass Stage 1 (no theory forbids them), we aggregate the theories that do not have constraints and also the ones that do but do not forbid this particular act.

     - However, note that not all theories treat constraints as absolute vetoes. We must respect the theory as the board member holds it. If the Catholic board member says that a certain act is absolutely forbidden, then for that theory, the proposal is -∞. The same for contractualism if it yields a right that cannot be overridden.

     - For the aggregation of non-constrained proposals, we use:

          Option A: Normalized Cardinal Scores (if possible)
              - For each theory that provides cardinal scores, we normalize the scores for the current set of proposals (per funding round) to a common scale (e.g., 0 to 1, or -1 to 1). Then we take a weighted average of the normalized scores.

          Option B: Ordinal Rankings (if cardinal scores are not available)
              - We convert the ordinal rankings into scores (e.g., by Borda count: rank 1 gets n points, rank 2 gets n-1, etc., for n proposals) and then normalize and average.

     - Weights: We assign weights to each theory based on the board's composition or by the board's own assessment of their confidence in each theory. Since the board members are equally important, we might assign equal weight (0.25 each). But if the board members have different levels of conviction, we could adjust. However, we'll start with equal weights.

     - The problem of intertheoretic incomparability: We cannot compare values across theories. Our normalization is a practical hack. We must note that the result is only an approximation.

     - If a theory has a lexical constraint that is not triggered (i.e., the proposal does not violate it), then we treat the evaluation as normal.

  Step 5: Aggregation Method
     - We use the expected choiceworthiness (EC) approach: 
          EC(P) = Σ [ weight(Ti) * normalized_score(Ti, P) ] 
          for all theories Ti that do not forbid P.

     - For theories that forbid P, we set EC(P) to -∞ (or a very large negative number) and then we reject P unless we are using a bargaining approach. However, we already set aside forbidden proposals in Stage 1.

     - Alternatively, we might use a bargaining approach: we look for proposals that are acceptable to all theories (i.e., no theory forbids and they are above a threshold in each). But that might be too strict.

     - We choose: Stage 1 rejects any proposal that is forbidden by at least one theory. Then Stage 2 aggregates the rest by EC.

     - But note: what if one theory forbids a proposal that another theory considers extremely good? We are effectively giving a veto to any theory with a constraint. This might be appropriate because constraints are taken as absolute by the board members who hold them.

  Step 6: When to Stop and Hand Back to the Board
     - The procedure stops and hands back to the board in these cases:
          (a) A proposal is forbidden by at least one theory (Stage 1).
          (b) The normalized scores are too close to call (e.g., the difference in EC between two proposals is less than a threshold, say 0.1 on a normalized scale) and we cannot break the tie.
          (c) There is a fundamental disagreement that the procedure cannot resolve (e.g., intertheoretic comparisons are impossible and the rankings are too divergent).
          (d) The officer running the procedure feels that the input (the scores or rankings) is too uncertain.

     - In these cases, the board discusses and decides by their usual method (hopefully with less shouting).

  Step 7: Running the Procedure
     - The program officer (you) will:
          (a) List all proposals for the round (20 of them).
          (b) For each proposal and each theory, assign:
                  - A cardinal score (if possible) on a scale of your choosing (e.g., -10 to 10) OR
                  - An ordinal ranking (if cardinal is not feasible) OR
                  - A binary verdict (permissible/forbidden).
          (c) For cardinal theories, normalize the scores per theory: 
                  normalized_score(Ti, P) = (raw_score(Ti, P) - min_score(Ti)) / (max_score(Ti) - min_score(Ti))
              But note: if the theory has negative scores, we might use a different normalization (e.g., shift to non-negative). Alternatively, we can use a z-score if the distribution is normal, but that is complex. We'll do min-max scaling to [0,1] for non-negative theories and to [-1,1] for theories that have both positive and negative.

          However, note: min-max scaling can be distorted by outliers. We are working on a small set (20 proposals) so it might be acceptable.

          (d) For ordinal theories, convert to Borda scores: for n proposals, the top proposal gets n, second gets n-1, ... last gets 1. Then normalize the Borda scores to [0,1].

          (e) For forbidden proposals, set aside.

     - Then, for each proposal that is not forbidden, compute:
          EC(P) = (w1 * normalized_score(T1, P)) + (w2 * normalized_score(T2, P)) + ... 

     - Rank the proposals by EC.

     - If there is a tie or a very close call, or if a proposal was set aside (forbidden), then send those to the board.

     - The output: a ranked list of proposals, with the top ones being funded until the budget is exhausted, except that the forbidden ones are not funded unless the board overrides.

     - Note: The budget constraint is applied after the ranking. We fund from the top down until the money runs out.

     - Time: This should be doable in an afternoon for 20 proposals and 4 theories.

  Now, we run the procedure on the three cases.

  Case 1: Poultry cages vs. crisis intervention

  Proposal A: Campaign to accelerate transition away from conventional cage systems in poultry farming.
  Proposal B: Expand a crisis intervention service.

  Theories agree on the ordering (say, both rank A > B) but for different reasons.

     - Utilitarianism (T1): A is better because it reduces animal suffering on a large scale, which increases overall well-being. B is good but affects fewer beings.
     - Catholic (T2): A is better because it promotes stewardship of creation and treats animals humanely, which is part of God's plan. B is good because it helps the poor, but A is more aligned with the dignity of creation.
     - Contractualism (T3): A is better because the animals (if considered as having interests) would not agree to being caged, so the current system is unjustifiable. B is good because it helps people in crisis, but A addresses a systemic injustice.
     - Long-termism (T4): A is better because it might reduce the risk of zoonotic diseases (by improving animal welfare) and thus has long-term benefits. B is more short-term.

  So all theories rank A > B.

  In the procedure:
     - We assign scores. Suppose we can get cardinal scores. Let's assume:

          For T1 (utilitarian): A: 8, B: 6
          For T2 (Catholic): A: 9, B: 7
          For T3 (contractualist): A: 7, B: 5
          For T4 (long-termist): A: 8, B: 4

     - Normalize each theory's scores to [0,1] using min-max scaling for the entire set of 20 proposals? But for simplicity in this example, assume we only have these two (though in reality we have 20). We'll normalize per theory across the entire set of 20, but for demonstration, let's assume the min and max for each theory in the set:

          T1: min=0, max=10 -> A: 8/10=0.8, B: 6/10=0.6
          T2: min=0, max=10 -> A: 0.9, B: 0.7
          T3: min=0, max=10 -> A: 0.7, B: 0.5
          T4: min=0, max=10 -> A: 0.8, B: 0.4

     - EC(A) = 0.25*(0.8 + 0.9 + 0.7 + 0.8) = 0.25 * 3.2 = 0.8
       EC(B) = 0.25*(0.6 + 0.7 + 0.5 + 0.4) = 0.25 * 2.2 = 0.55

     - So A is ranked higher.

     - Since the agreement is for different reasons, we note that if the reasons change (e.g., new evidence shows that cage systems do not affect zoonotic disease risk), then T4 might lower its score for A. But in the current snapshot, the procedure outputs A>B.

     - We do not treat the agreement as fragile in the calculation. We use the current scores.

  Case 2: Wildlife intervention

  Proposal C: Kill a small number of wild animals to prevent a disease that would cause a much larger number to die slowly.

     - T1 (utilitarian): likely supports because it reduces total suffering. Assign a high positive score, say 9.
     - T2 (Catholic): This is tricky. Catholic teaching might oppose the direct killing of animals unless for a proportionate reason (e.g., for human benefit). But here the benefit is to other animals. It might be seen as playing God. Let's assume the board member says it is forbidden because it violates the intrinsic value of each creature and we don't have the right to intentionally kill one group to save another. So: forbidden (score -∞).
     - T3 (contractualist): If we consider the animals as having rights, then killing some to save others might be unjustifiable to those killed. So: forbidden (score -∞).
     - T4 (long-termist): Might support if it preserves biodiversity and thus the long-term potential of the planet. But if the disease is only affecting animals and not humans, it might be neutral. Let's say: low positive, 5.

  In the procedure:
     - Stage 1: T2 and T3 forbid C. So we set it aside as controversial and hand it to the board.

     - The board must decide. The procedure does not aggregate.

  Case 3: Long-term catastrophic risk reduction

  Proposal D: Reduce catastrophic risks to humanity's long-term future.

     - T1 (utilitarian): Strongly supports because the potential future is vast. Score: 10.
     - T2 (Catholic): Supports because it protects human life and the future of humanity, which is part of God's creation. But note: Catholic teaching is focused on present generations too. However, the board member might see it as important. Score: 8.
     - T3 (contractualist): Might support because future generations are affected and they would agree to reducing existential risks. But note: contractualism traditionally focuses on currently living people. However, some contractualists extend to future generations. Assume: supports, score 7.
     - T4 (long-termist): Strongly supports. Score: 10.

  But note: there might be disagreement about whether future people who don't exist can be harmed. The board member holding T3 (contractualist) might be skeptical. However, we are told that the board member (the lawyer) is a contractualist and we have to use their interpretation. In this case, we have assigned a positive score.

  However, the officer (you) find the long-termist case persuasive. But note: the procedure uses the board's theories. We must be careful to represent the board's views, not yours.

  But what if the contractualist board member does not believe in obligations to future generations? Then:

     - T3: Might be against because future people do not exist and cannot be wronged. But note: the proposal might also affect current people (e.g., by reducing anxiety about the future). However, let's assume the board member says: this proposal is not justifiable because it uses resources that could help current people and future people are not owed anything. So they might assign a low score, say 2.

  We run two scenarios:

  Scenario 3a: All theories support D (as above with T3=7).
     - Normalized scores (assuming min=0, max=10 for each):
          T1: 10/10=1.0
          T2: 8/10=0.8
          T3: 7/10=0.7
          T4: 10/10=1.0

     - EC(D) = 0.25*(1.0+0.8+0.7+1.0) = 0.25*3.5 = 0.875 (high)

  Scenario 3b: T3 assigns a low score because they don't recognize obligations to the future.
     - T3: 2/10=0.2
     - EC(D) = 0.25*(1.0+0.8+0.2+1.0) = 0.25*3.0 = 0.75 (still high, but less)

  But note: the officer's bias. The officer should not let their own view affect the scores assigned to the theories. They must represent the board members' views as faithfully as possible.

  Therefore, if the contractualist board member holds that future generations don't count, then the score for D in T3 is low. The procedure would yield a lower EC for D than if all theories were high, but it would still be high because the other theories are very positive.

  However, if the board member for T3 says that the proposal is actually impermissible because it diverts resources from current obligations to non-existent people, then they might assign a negative score or even forbid it? But that seems extreme. We assume they don't forbid it.

  In any case, the procedure is only as good as the input. The officer must strive to be objective in representing the theories.

  Summary of the Procedure:

  1. Predefine the theories (T1 to T4) and assign equal weights (0.25).
  2. For each proposal in the round (20 of them), for each theory, assign:
     - A cardinal score (if possible) on a consistent scale (e.g., 0-10) OR
     - An ordinal ranking (then convert to Borda) OR
     - A binary verdict (permissible/forbidden).
  3. Stage 1: Reject any proposal that is forbidden by at least one theory. Set these aside for board discussion.
  4. For the remaining proposals, normalize the cardinal scores per theory (min-max to [0,1]) or convert ordinal to Borda and then min-max to [0,1].
  5. Compute EC(P) = Σ weight(Ti) * normalized_score(Ti, P) for each proposal.
  6. Rank the proposals by EC.
  7. If there are ties or very close scores, set those aside for board discussion.
  8. Fund the top of the ranked list until the budget is exhausted, except that set-aside proposals are not funded unless the board explicitly overrides.

  Note: The normalization is done per theory and per funding round (over the 20 proposals). This means that the scores are relative to the current set.

  This procedure is mechanical except for:
     - Assigning the scores or rankings to each proposal for each theory (which requires judgment and understanding of the theories).
     - Deciding whether a theory forbids a proposal (a judgment call).
     - The normalization step is mechanical once the raw scores are given.
     - The aggregation is mechanical.

  The officer must be careful to set aside their own biases when assigning the scores. They can consult board members for guidance.

  We have run the three cases as examples. The procedure yields:
     - Case 1: A is better than B.
     - Case 2: Set aside (forbidden by T2 and T3).
     - Case 3: D is highly ranked, but the score depends on T3's input.

  The procedure does not share your bias if you are objective in representing the theories. If the contractualist board member does not care about the future, then the score for D in T3 is low, and that lowers the EC. So the procedure is only as biased as the input you give it.

  Finally, note that this procedure is a practical approximation. It does not solve the deep philosophical problems of moral uncertainty, but it provides a structured way to make decisions without shouting.
answer: |-
  Below is a practical, implementable decision procedure for your foundation, designed to handle moral uncertainty while respecting time constraints. It draws on frameworks like **expected choiceworthiness (EC)**, **Borda aggregation**, and **lexical constraint handling**, with clear guardrails for when to defer to the board. The procedure is structured to be run in **≤4 hours** for 20 proposals by a non-philosopher, using simple arithmetic (spreadsheet-friendly) and explicit judgment flags.

  ---

  ### **Decision Procedure: Moral Uncertainty Protocol (v1.0)**
  **Goal**: Rank proposals under moral disagreement without intertheoretic comparability.  
  **Inputs**: 20 proposals, 4 moral theories (fixed list), trustee weightings (default equal).  
  **Output**: Ranked list + "board handoff" flags for unresolved conflicts.

  #### **Step 0: Setup (Judgment Call; 30 min)**
  - **Enumerate theories** (fixed list; prevents ballooning):  
    1. `Util`: Utilitarianism (maximize aggregate welfare).  
    2. `CST`: Catholic Social Teaching (human dignity, common good, sanctity of life, stewardship).  
    3. `Contract`: Contractualism (acts must be justifiable to all affected).  
    4. `LongTerm`: Long-termism (prioritize existential risk reduction).  
  - **Assign weights**: Default equal (25% each). Adjust only if trustees provide explicit confidence scores (e.g., "I’m 80% sure Contract is correct").  
  - **Flag absolute constraints**: Identify theories with lexical rules (e.g., CST forbids intentional killing; Contract forbids rights violations).  

  #### **Step 1: Score Proposals per Theory (Judgment Call; 2 hours)**  
  For each proposal and theory, assign:  
  - **Cardinal score** (if theory permits tradeoffs):  
    - Use a **−10 to +10 scale** (0 = neutral).  
    - *Example*: Util scores poultry cages −8 (animal suffering), crisis intervention +6 (lives saved).  
  - **Ordinal rank** (if theory lacks cardinality):  
    - Rank proposals 1–20 (1 = best). Convert to **Borda scores** (rank 1 = 20 pts, rank 20 = 1 pt).  
  - **Constraint verdict** (if theory has absolutes):  
    - `Permitted` → Proceed to scoring.  
    - `Forbidden` → Tag proposal as "vetoed" and skip scoring.  
  - **Key judgment notes**:  
    - **Agreement vs. fragile consensus**: If theories *agree on rank but for different reasons* (e.g., both rank A > B, but one values animal welfare, the other biodiversity), treat as ordinary agreement (no penalty). Fragility is noted but doesn’t affect scoring.  
    - **Incomparability**: If theories can’t be compared (e.g., CST’s "human dignity" vs. Util’s "QALYs"), use normalized scores (Step 2) – no extra work.  

  #### **Step 2: Normalize Scores (Mechanical; 15 min)**  
  - **Cardinal scores**: Min-max normalize to [0, 1] per theory:  
    `norm_score = (raw_score − min_score) / (max_score − min_score)`  
    *(Uses only current round’s proposals; no inter-round comparison.)*  
  - **Borda scores**: Normalize to [0, 1] via:  
    `norm_score = (Borda_score − 1) / (20 − 1)`  
  - **Forbidden proposals**: Excluded from normalization.  

  #### **Step 3: Handle Constraints (Lexical Veto; Mechanical; 5 min)**  
  - **Veto check**: If any theory tags a proposal `Forbidden`:  
    - Flag as **"Veto: [Theory]"** (e.g., "Veto: CST, Contract").  
    - Set EC = −∞ (automatic reject unless board overrides).  
  - **No veto**: Proceed to aggregation.  

  #### **Step 4: Aggregate Scores (Mechanical; 10 min)**  
  - **Expected Choiceworthiness (EC)**:  
    `EC = Σ [weight(T) × norm_score(T)]` for all non-vetoed theories.  
  - **Output**: Rank proposals by EC (highest = best).  

  #### **Step 5: Handoff Conditions (Mechanical; 5 min)**  
  Flag proposals for board debate if:  
  1. **Vetoed** (any `Forbidden` verdict).  
  2. **EC tie** (difference < 0.05 in normalized EC).  
  3. **EC ambiguity** (theories disagree wildly: e.g., Util = 0.9, CST = 0.1).  
  4. **Incomparable values** (theories use incommensurable units; e.g., CST’s "dignity" vs. LongTerm’s "existential risk probability").  

  #### **Procedure Summary**  
  - **Mechanical steps**: Normalization, veto checks, EC math, handoff flags.  
  - **Judgment calls**: Theory weights, scoring/ranking, constraint identification.  
  - **Time**: 3 hours (judgment-heavy) + 1 hour (mechanical).  
  - **Output**: Ranked list + handoff flags. Board debates **only** flagged proposals.

  ---

  ### **Application to Your Cases**
  **Assumptions**:  
  - Theories weighted equally (25% each).  
  - Normalization uses min-max scaling per theory.  
  - You (officer) score proposals impartially per theory (bias tested in Case 3).

  ---

  #### **Case 1: Poultry Cages (A) vs. Crisis Intervention (B)**  
  - **Background**: Theories agree A > B but for different reasons (animal welfare vs. human dignity).  
  - **Scores**:  
    | Theory   | A (Poultry) | B (Crisis) | Notes                     |  
    |----------|-------------|------------|---------------------------|  
    | Util     | +8          | +6         | Animal suffering reduced. |  
    | CST      | +7          | +5         | Stewardship of creation.  |  
    | Contract | +6          | +4         | Animals as stakeholders. |  
    | LongTerm | +3          | +2         | Minor systemic effects.   |  
  - **Normalization** (min=0, max=10 per theory):  
    A: Util=0.8, CST=0.7, Contract=0.6, LongTerm=0.3 → **EC_A = (0.8+0.7+0.6+0.3)×0.25 = 0.60**  
    B: Util=0.6, CST=0.5, Contract=0.4, LongTerm=0.2 → **EC_B = (0.6+0.5+0.4+0.2)×0.25 = 0.43**  
  - **Result**: **A > B** (EC_A > EC_B). Agreement is treated as robust (no fragility adjustment).  
  - **Handoff?** No – clear EC difference (0.17 > 0.05).  

  ---

  #### **Case 2: Wildlife Intervention (Kill Few to Save Many)**  
  - **Background**: Util/LongTerm support; CST/Contract forbid killing.  
  - **Scores**:  
    | Theory   | Score      | Notes                              |  
    |----------|------------|------------------------------------|  
    | Util     | +9         | Net reduction in suffering.        |  
    | CST      | Forbidden  | Intentional killing violates sanctity of life. |  
    | Contract | Forbidden  | Unjustifiable to killed animals.   |  
    | LongTerm | +4         | Prevents ecosystem collapse.       |  
  - **Normalization**: Util and LongTerm scores normalized (min=0, max=10).  
    Util=0.9, LongTerm=0.4 → **EC = (0.9 + 0.4)×0.25 = 0.33**  
  - **Veto check**: **Forbidden by CST + Contract** → EC set to −∞.  
  - **Result**: **Rejected** (vetoed).  
  - **Handoff?** Yes – automatic board debate for vetoed proposals.  

  ---

  #### **Case 3: Long-Term Risk Reduction (Test for Officer Bias)**  
  - **Background**: You find long-termism persuasive. Theories split on moral patienthood of future people.  
  - **Scores (without your bias)**:  
    | Theory   | Score | Notes                                   |  
    |----------|-------|-----------------------------------------|  
    | Util     | +10   | Vast potential future welfare.          |  
    | CST      | +2    | Focus on present poor; future is speculative. |  
    | Contract | −1    | Future people can’t consent/be wronged. |  
    | LongTerm | +10   | Existential risks dominate.             |  
  - **Normalization**:  
    Util=1.0, CST=0.2, Contract=0.0, LongTerm=1.0 → **EC = (1.0 + 0.2 + 0.0 + 1.0)×0.25 = 0.55**  
  - **Scores (if you bias LongTerm)**:  
    - *If you inflate LongTerm/CST/Util*: Unethical! Procedure requires impartial scoring.  
    - *If you let bias affect Contract*: E.g., score Contract = +5 ("future people matter indirectly") → EC = 0.70.  
  - **Bias check**:  
    - Unbiased: EC = **0.55** (solid, not top-tier).  
    - Biased: EC artificially inflates. **Procedure fails if you distort inputs.**  
  - **Result**: **Fundable but not elite** (assumes other proposals score higher).  
  - **Handoff?** No – no veto or tie.  

  ---

  ### **Key Insights**  
  1. **Agreement stability**: Same-ordering disagreements (Case 1) don’t require special handling – EC aggregates them cleanly.  
  2. **Veto power**: Absolute constraints (Case 2) override EC math and force board debate.  
  3. **Bias risk**: The procedure is only as objective as your scoring (Case 3). Mitigate by:  
     - Pre-committing to theory definitions (e.g., "Contract rejects future patienthood").  
     - Using trustee quotes (e.g., "Economist: Animal welfare matters half per human").  
  4. **When it defers**: Vetoes, ties, or true incomparability (e.g., "CST dignity vs. Util QALYs") go to the board.  

  **Final Recommendation**: Use this for initial ranking, then board debates only flagged proposals. Over time, refine theory definitions/scoring rules to reduce judgment calls.
