answer: |-
  ## Dr. Ashworth's Retirement Speech

  Friends, colleagues, and especially Helen’s dear family – thank you for gathering to honour a truly remarkable career. For decades, Helen navigated the complex currents of the future on behalf of all of us, steering not with a crystal ball, but with a formidable intellect, unwavering integrity, and a deep commitment to getting it *right*, however difficult the waters.

  Helen understood, perhaps better than anyone, the delicate tension inherent in her craft. It’s tempting, when faced with uncertainty, to demand a single answer, a definitive point on the horizon. Helen respected that demand; she believed in clarity, in putting a stake in the ground. She felt that hiding behind vague possibilities wasn't just unhelpful, it was a kind of cowardice. The honest forecaster steps forward and says, "This, based on what we see now, is the most likely path." She lived by that principle.

  But Helen also possessed a profound wisdom about *knowledge* itself. She knew that the strength of a conclusion isn't found only in the balance of the scales *at this moment*. **How much we know matters as much as what we know.** A judgement built on a deep well of evidence feels different – it *is* different – from the exact same conclusion drawn from just a handful of clues. The latter might be the best we can do, but it carries a different kind of fragility. New facts might shift that balance slightly, but they *always* make the foundation firmer, even if they complicate the picture. Think of it like this: if the barometer reads fair, but the clouds gather dark, it’s not always sensible to force a single verdict between them. Sometimes, knowing *both* things, recognising the tension, is the clearest view we have, and we must simply choose a course without endless debate.

  This wasn't theory for Helen; it was the air she breathed. Her legendary standing question to new analysts wasn’t “What does the model predict?” It was far more revealing: **“What would have to be true?”** That question cuts to the heart of the matter. It forces us to examine the scaffolding holding up our conclusions, to see how much weight it can bear. It exposes the assumptions upon which the delicate balance rests. And she was fiercely protective of genuine understanding over false precision. She once argued, passionately though unsuccessfully, against publishing a spread of possibilities for projections stretching far into the mist. Her reasoning? That fan of uncertainty wouldn't enlighten; it would merely decorate. It would give the illusion of knowledge where the evidence simply couldn't support it.

  *(Gentle gesture towards Helen, with a knowing smile)*
  And then there was her office barometer. That magnificent, utterly silent brass barometer on her windowsill. Generations of analysts, and the occasional visiting philosopher, remember her gesturing towards it when asked, "But Helen, how do you *know*?" It hasn’t given a reading since long before my time. *(Pause for chuckle, especially from forecasters)*. I like to think it wasn't broken; it was a perfect metaphor. It reminded us that sometimes, the tools we inherit tell us less about the weather outside, and more about the responsibility – and the humility – required to interpret *any* signal.

  Helen’s legacy isn’t just in the projections made, but in the intellectual courage she embodied. When a key forecast had to be revised mid-stream – something that takes guts to admit – she didn’t hide the old version. She kept it, marked up in pencil, a testament to the journey of understanding. And she gave that annotated page to every new analyst who joined her team. No explanation needed. It spoke volumes: "This is how we learn. This is how evidence builds. This is how the weight grows."

  So, Helen, we celebrate you tonight not just for the points you plotted, but for the depth you demanded. You taught us that clarity requires courage, but that true understanding requires acknowledging the ground beneath our feet – whether it’s bedrock or shifting sand. You showed us that the honest path forward often lies in recognising both what the scales show *now*, and how firmly we can trust their footing.

  Family – her husband, her daughters, her brother – you’ve shared Helen with a demanding profession for a very long time. You’ve heard the stories of forecast rounds, the pressure, the odd hours. But what you may not have seen, quite so clearly, is the profound respect and affection she inspired in all of us. We saw her brilliance, yes, but also her kindness, her dry wit, and her unwavering dedication not just to the work, but to the people doing it. She built more than forecasts; she built a community of rigorous, thoughtful practitioners. You lent her to us, and we are eternally grateful. Tonight is about you celebrating the remarkable woman you know best – the colleague we admired, the mentor we cherished, and the friend we will miss in the daily rhythm of the work. Helen, from all of us, thank you. May the next forecast be entirely your own, and filled with sunshine.

  ---

  **Analysis of Constraints & Challenges (148 words):**

  *   **Weight vs. Balance:** The core distinction drives the central passage ("How much we know... fragility"), the "what would have to be true" explanation, and the withdrawn forecast anecdote. Sentences like "New facts might shift that balance... firmer" explicitly use the terms while linking them to the Keynesian quotes (unattributed). The barometer metaphor solely serves this distinction.
  *   **Absence of Numbers:** Phrases like "single answer," "definitive point," "deep well / handful of clues," "spread of possibilities," "far into the mist," and "shifting sand" replace quantifiable concepts. Omitting years/service/percentages forced reliance on qualitative duration ("decades," "generations") and descriptive precision ("key forecast," "very long-horizon" implied).
  *   **Hardest Constraint:** The **no numbers** rule was toughest. Avoiding even "thirty years" or "ninety people" required constant vigilance and creative circumlocution, especially when describing professional milestones or the audience, while ensuring it felt deliberate, not lacking. Integrating Helen's calibrationist stance *without* numbers was a close second. Balancing philosophical depth within ordinary language for mixed audiences was also demanding.
