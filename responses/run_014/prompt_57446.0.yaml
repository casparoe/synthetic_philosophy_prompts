prompt: |-
  So next month I'm giving a departmental colloquium — 45 minutes plus a long Q&A — at a place that's very strong in metaphysics and only okay in ethics, and the organiser has warned me that maybe a third of the room won't work in value theory at all. My paper defends an account of the procreation asymmetry that I've been calling the custodial view, and I need a prep sheet for the question period rather than another defense of the paper. Sketch of the argument so you know what the objections should be aimed at:

  1. Reasons of beneficence aren't freestanding. They only arise inside an actual relation of custody over a subject — a relation in which that subject's welfare is *yours to look after*. Call this the custody condition.
  2. A merely possible person stands in no such relation to anyone, so there's no welfare that is anyone's to promote. Hence no reason to bring about a happy life. Not because happy lives aren't good — I'll grant in the talk that they're good impersonally — but because a good that isn't anybody's to look after doesn't generate a reason for anybody in particular to produce it.
  3. Procreating is the act of *entering* a custody relation, and you can't permissibly enter a relation you already know you won't be able to discharge. A life of severe, unrelievable suffering is exactly that, so there's a decisive reason against creating it.
  4. The asymmetry then falls out with no person-affecting restriction on value, and without having to claim that misery is bad-for-someone while happiness is somehow not good-for-anyone.

  The thing that keeps me up is that the machinery in (1) and (3) is mine and there's no existing defence of it I can lean on, so unlike the standard asymmetry views I can't gesture at somebody else's replies when I get stuck.

  Give me the eight or nine objections I'll actually get from *this* room, in roughly the order they'll come, and phrase each one the way that subgroup would phrase it — the metaphysicians are not going to put it the way the population ethicists would. I specifically expect a necessitist to go after step 2: if possible people exist as non-concrete objects, isn't there already a subject for the custody relation to latch onto, and doesn't my view smuggle in contingentism as an undefended premise? Tell me how bad that actually is as opposed to how bad it sounds at the podium. There's also a health economist in the department who models climate damages and will want to know whether I've just given people a licence to discount the wellbeing of anyone who doesn't exist yet, plus someone in reproductive policy who'll ask about existing children — adoption, fostering — and whether my view makes procreation merely permissible or actively second-best, which is a political fight I do not want to have in a colloquium. And somebody will try to collapse me into Benatar while somebody else tries to collapse me into the older person-affecting asymmetry; say which of those two collapses is the real threat and give me the cleanest wedge.

  For each objection: how damaging it is, on a scale from "I have nothing" to "two sentences and we move on"; the two-or-three-sentence reply I should give in the room; and a blunt note on where that reply is soft. Flag which ones I should concede up front in the talk to buy goodwill, and tell me the single reply that has to land for the paper to survive the afternoon. Finish with the question I'm praying nobody asks. Please don't send me a reading list or citations — I know the literature, its my sense of which of these actually bites that I dont trust.
reasoning: |-
  Okay, the user is preparing for a departmental colloquium where they'll present their "custodial view" on the procreation asymmetry. They need a prep sheet for Q&A, anticipating objections from a room strong in metaphysics but only okay in ethics. 

  First, let's unpack their argument structure: 
  The custody condition (1) ties beneficence to actual custody relations. 
  Possible persons (2) can't trigger duties since no custody exists. 
  Procreation (3) creates custody obligations you must be able to fulfill. 
  This yields asymmetry (4) without person-affecting restrictions.

  Hmm, their anxieties are hyper-specific: 
  - Metaphysicians attacking step 2 via necessitism (possible objects as real) 
  - Policy folks misinterpreting implications for future generations or adoption 
  - Collapse worries (Benatar vs person-affecting views) 
  - And that health economist who'll fear climate ethics damage

  *scratches head* Right, prioritization is key. The metaphysical objection is the true landmine - if necessitism holds, their entire scaffolding crumbles. That's the "paper survival" reply. Policy objections are politically messy but philosophically shallower; concede adoption isn't second-best to buy goodwill. Benatar collapse is superficial (he denies welfare positives), but person-affecting collapse needs sharp wedging: custodial view accepts impersonal goodness!

  *mentally pacing* For the health economist: clarify discounting ≠ ignoring, just different duty structure. And the nightmare question? Probably about non-custodial beneficence (e.g., charity) exposing circularity in their custody definition...

  *deep breath* Alright, structuring replies: 
  - Metaphysics first (it's that kind of department) 
  - Then ethicists probing custody scope 
  - Policy last to contain fires 
  Each reply needs damage assessment + soft spots flagged. No fluff - user knows literature but needs tactical phrasing.
answer: |-
  Here's your prep sheet, calibrated for *this* audience. Prioritized by likely order, damage level, and subgroup phrasing. The key is speed and framing – don't get bogged down.

  **The 8 Key Objections & Your Replies:**

  1.  **The Metaphysician (Necessitist):** "Your Step 2 seems to presuppose contingentism – that merely possible people *don't exist*. But if we're serious modal realists or necessitists (like Williamson), possible people *do* exist as non-concrete objects. Doesn't this mean there *is* already a subject whose welfare we *could* have reason to promote, even pre-procreation? You're smuggling in an undefended metaphysical premise."
      *   **Damage:** **Critical.** If this lands, Step 2 crumbles. This *must* be addressed.
      *   **Reply (2-3 sentences):** "Even granting non-concrete existence, the *custody relation* remains uninstantiated until procreation. The possible person's welfare isn't *entrusted* to anyone yet. Reasons of beneficence under my view require not just a potential subject, but an *actual, active relation of responsibility* over their welfare – a relation that only begins with the act of creating/conceiving them."
      *   **Soft Spot:** Requires asserting that custody is fundamentally dynamic/relational in a way that existence alone doesn't satisfy. Needs the metaphysical claim that relations require *both* relata to be concrete/actual in the relevant sense. Be prepared for pushback on what kind of relation custody *is* metaphysically.
      *   **Where to Land It:** **This is the single reply that must land for the paper to survive.** Frame it as about the *nature of the custody relation*, not just existence. "The custody relation is performative – it's *created* by the act of procreation; it doesn't pre-exist it, even if the subject does abstractly."

  2.  **The Population Ethicist:** "This looks suspiciously like the old Person-Affecting Restriction (PAR) in disguise. You're saying we only have reason regarding welfare if there's a *specific* subject whose welfare it is, and who stands in a specific relation. Isn't this just PAR dressed up with 'custody'?"
      *   **Damage:** High (Misunderstanding threatens core novelty).
      *   **Reply:** "Crucially different. PAR typically denies *impersonal* value to happy lives or claims absence of harm in non-existence. I *grant* that happy lives are impersonally good. The absence of a reason to create them stems solely from the *lack of a duty-bearing relation* (custody), not from denying their value or the absence of a subject to 'benefit'. It's about *who has the job*, not whether the good exists."
      *   **Soft Spot:** Requires them accepting the distinction between impersonal *value* and agent-relative *reasons*. Some hardcore PAR advocates might still see it as kin. The "custody" relation is doing heavy lifting.
      *   **Wedge:** Emphasize "I grant the impersonal good" vs. PAR's typical denial.

  3.  **The Health Economist (Climate Policy):** "Hold on. If future people don't exist yet, and thus no custody relation exists with *us now*, does this mean we have *no* direct reason of beneficence to promote *their* wellbeing? Can we just discount future welfare impacts because they aren't 'ours to look after'? That seems disastrous for climate policy!"
      *   **Damage:** Medium-High (Political/real-world implications). Needs clear distinction.
      *   **Reply:** "No licence to discount! Two points: First, harming future people *by creating them into a bad situation* is still covered by Step 3 – we *will* enter a custody relation we can't discharge if we create them into climate catastrophe. Second, regarding *existing* future people (our descendants), the custody relation is often inherited or societal *once they exist*. My view concerns the *initiation* of custody via procreation and the *absence* of freestanding creation duties, not duties to those who *will* exist or whom we *will* have custody over."
      *   **Soft Spot:** Requires clarifying the temporal scope of "custody" – is it only at conception/birth, or does it extend? Needs careful distinction between *creating* a person and *affecting* a person who *will* exist. Societal/inherited custody needs brief justification.

  4.  **The Ethicist (General Scope):** "What about non-custodial beneficence? Surely I have a reason to give money to a distant famine victim, even though I bear no 'custody' relation to them? Doesn't this show beneficence reasons *can* be freestanding, contradicting your Step 1?"
      *   **Damage:** Medium (Challenges core premise).
      *   **Reply:** "Good point, but distinct. General beneficence might arise from other grounds – perhaps minimal moral agency, solidarity, or negative duties not to ignore dire need. The Custody Condition specifically governs the *creation and sustenance of welfare within a dependent relationship*. It doesn't necessarily negate *other* sources of duties to aid."
      *   **Soft Spot:** Needs a plausible alternative account for general beneficence that doesn't rely on custody. Risk of ad-hoc-ness. **Concede up front in the talk:** Briefly acknowledge general beneficence exists and your account focuses on a *specific, intense kind* tied to dependency/creation.

  5.  **The Reproductive Policy Scholar:** "You focus on procreation. What about adoption or fostering? Does your view imply that procreating is *better* than adopting because it creates a *new* good life, while adoption only cares for an existing child? Or is procreating merely permissible, while adoption is supererogatory?"
      *   **Damage:** Medium-High (Political minefield, potential misrepresentation).
      *   **Reply:** "Neither. My view primarily addresses the *asymmetry* in reasons for *creating* lives. Adopting an *existing* child *does* establish a custody relation over *their* welfare, generating strong duties of beneficence. There's no 'second-best' – caring for existing children is a paramount duty. Procreating creates a *new* custody relation and duty; it doesn't generate a *comparative* reason favoring it over adoption. They involve distinct duties arising from distinct acts."
      *   **Soft Spot:** Doesn't give a positive reason *to* procreate (only permission), which might seem odd. Needs to firmly separate the *duty* in adoption (strong) from the *permission* in procreating (absent negative reason). **Concede up front in the talk:** Explicitly state that your view *does not* devalue adoption/fostering; it highlights the strong duties involved in taking custody of *any* child, existing or new.

  6.  **The Benatar Collapser:** "This sounds like David Benatar – no duty to create happy lives because non-existence isn't bad, but a duty not to create unhappy lives because existence *is* bad for them. Are you just Benatar with 'custody' added?"
      *   **Damage:** Low-Medium (Superficial similarity, easier to rebut).
      *   **Reply:** "Significantly different! Benatar argues existence is *always* a net harm (which I reject) and that non-existence is *better*. I grant happy lives are *impersonally good*. My asymmetry arises purely from the *relational structure of duties* (the Custody Condition), not from Benatar's axiological claims about the (dis)value of existence itself. I'm not saying non-existence is preferable; I'm saying there's no *duty* to move from non-existence to existence."
      *   **Soft Spot:** Clear wedge. Emphasize "impersonal good" versus Benatar's "existence is harm".

  7.  **The Metaphysician (Modal Relations):** "You rely heavily on this 'custody relation'. What *is* it, metaphysically? Is it a primitive? A normative commitment masquerading as a relation? How does it differ from, say, a promissory relation or general causal responsibility? Why should we believe such a specific relation grounds *all* procreative duties?"
      *   **Damage:** Medium-High (Attacks foundational machinery).
      *   **Reply:** "It's the normative relation constitutive of parenthood or direct guardianship – the relation where one agent assumes primary, inescapable responsibility for the basic welfare needs of a dependent being. It's distinct from promises (more fundamental) or general causation (more specific and normatively laden). We recognize it intuitively in cases of neglect: failing a custodial duty is a unique wrong. My argument is that procreation *is* the act of assuming this relation."
      *   **Soft Spot:** Still somewhat intuitive/circular ("We recognize it..."). Needs robust examples. Be ready to contrast with other relations.

  8.  **The Edge Case Pusher:** "What about 'easy rescues' for possible people? Suppose I can create a happy life at zero cost to anyone. Your view says I have *no reason* to do it? That seems counterintuitive – surely I *should*? Doesn't the impersonal good give *some* reason, even if outweighed or canceled elsewhere?"
      *   **Damage:** Medium (Tests intuition vs. rigor).
      *   **Reply:** "According to the Custody Condition, strictly, *no freestanding reason of beneficence* arises. That doesn't mean *all* possible reasons are absent – perhaps curiosity, a desire for fulfillment, etc. But crucially, the *distinctively moral* reason grounded in *that specific person's welfare* doesn't kick in until *after* the custody relation is established by creating them. Before that, their good isn't 'in my care'. The intuition might conflate the good *with* a reason *for me*."
      *   **Soft Spot:** Admits non-moral reasons might exist, which feels weak. Insisting the *moral* reason only arises later can seem stipulative. Stand firm on the relational core.

  **The Prayer: The Question You Hope Nobody Asks**

  *   **"If the custody relation itself generates the duty of beneficence, but entering that relation is what *creates* the subject whose welfare you're now responsible for, isn't this circular? How can you have a duty *to* a subject *based* on a relation that *only exists* once you've created them? Doesn't the duty presuppose the subject it's supposed to be about?"**
      *   **Why it's Bad:** This attacks the temporal/ontological coherence of Step 3. It suggests the duty *to* the future person logically requires the person *before* the act that creates the person and the relation. This is the deepest philosophical puzzle for your view.
      *   **Why it Might Not Come Up:** It requires seeing the circularity trap clearly and articulating it concisely. Many might focus on Steps 1 or 2.
      *   **If Asked (Gist of Reply - this is hard):** "The duty doesn't attach *to the specific person* pre-creation. It's a *conditional* duty: *If* I perform an act (procreation) that *will* create both a dependent subject *and* a custody relation over them, then I have a duty *not* to perform that act *if I know I cannot fulfill the custodial obligations that relation inherently entails*. The wrong is in knowingly creating an untenable situation of responsibility. The duty is prospective regarding the relation I'm about to enter and the obligations it brings." (This is still very challenging and likely needs more development).

  **Summary Checklist for the Talk:**

  *   **Concede Up Front:**
      *   General beneficence exists (distinguish it from custodial beneficence).
      *   Adoption/Fostering imposes strong custodial duties; your view does *not* rank it below procreation.
  *   **Land the Metaphysics Reply (Necessitism):** Focus on the *relation* needing to be instantiated, not just the subject existing abstractly. This is the key to survival.
  *   **Wedge Against PAR:** Constantly emphasize "I grant the impersonal good."
  *   **Defuse Climate Fear:** Distinguish creating *into* harm vs. duties to future custodial subjects.
  *   **Keep Benatar at Bay:** Contrast impersonal good vs. existence-as-harm.
  *   **Pray:** Avoid the circularity trap question.

  Good luck! Your view is novel and sharp – the objections will be fierce, but that means they're engaging. Stay calm, focus on the core relational insight, and deflect the political landmines.
