        - The model of similarity: we have assumed that without a common source, the agents are independent. But if the agents are "merely similar" in a way that still induces some correlation, then the evidential link might not vanish. The key parameter is the correlation ρ. If ρ is O(1) then the link remains. If ρ is O(1/N) or less, then the link vanishes as N increases.

        - Our model of the common source is a latent variable model. This is a standard way to model exchangeable binary data. However, there could be other models.

    Final precise argument:

        In the one-shot simultaneous game with N agents, each an evidential decision theorist, we assume:

          U_i = B(f) - C * I_i, with C>0 and B increasing in f.

          Without a common source, the decisions of the agents are independent Bernoulli trials with success probability p (for cooperation). 
          With a common source, the agents have a fixed positive pairwise correlation ρ>0.

        Then:

          Without common source:
              E[f | I_1=1] = p + (1-p)/N
              E[f | I_1=0] = p - p/N
              So the difference: Δf = [p + (1-p)/N] - [p - p/N] = 1/N.

              The difference in expected benefits: 
                  ΔU = E[B(f) | I_1=1] - E[B(f) | I_1=0] 
                      ≈ B'(p) * (1/N)   (if B is differentiable)
              Therefore, ΔU - C ≈ B'(p)/N - C.

              For N > B'(p)/C, we have ΔU < C, so defection yields higher expected utility.

          With common source (and ρ>0 fixed):
              Let δ = E[I_j | I_1=1] - E[I_j | I_1=0] > 0 (a constant).
              Then:
                  E[f | I_1=1] = (1/N) + (N-1)/N * P(I_j=1 | I_1=1)
                  E[f | I_1=0] = 0 + (N-1)/N * P(I_j=1 | I_1=0)
                  So Δf = (1/N) + (N-1)/N * δ - 0 - (N-1)/N * P(I_j=1 | I_1=0) 
                        = (1/N) + (N-1)/N * δ

              As N→∞, Δf → δ.

              Therefore, ΔU = E[B(f) | I_1=1] - E[B(f) | I_1=0] → some positive number (at least L * δ for some L>0 if B is sufficiently nice).

              If this limit is greater than C, then cooperation is preferred for sufficiently large N.

        Thus, in the limit as N→∞, without a common source, evidential cooperation breaks down.

    Note: We have taken the limit in two different ways: 
          - Without common source: the effect vanishes as N→∞.
          - With common source: the effect does not vanish.

    This is the core of the argument.
