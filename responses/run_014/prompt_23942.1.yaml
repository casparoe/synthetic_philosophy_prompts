  ### Argument on Evidential Cooperation Breakdown in Large Worlds

  **Game Setup:**  
  - Population of \(N\) agents, all evidential decision theorists (EDT).  
  - Each agent chooses cooperate (C) or defect (D).  
  - Payoff for agent \(i\):  
    \[
    U_i = B(f) - C \cdot I_i
    \]  
    where:  
    - \(f = \frac{\text{number of cooperators}}{N}\) (fraction of cooperators),  
    - \(B(f)\) is strictly increasing in \(f\) (collective benefit),  
    - \(C > 0\) is the cost of cooperation,  
    - \(I_i = 1\) if \(i\) cooperates, \(0\) otherwise.  
  - Structure: Large-scale Prisoner's Dilemma. Defection dominates causally (for fixed \(f\), defecting yields \(B(f)\) while cooperating yields \(B(f) - C\)).  
  - Agents are "similar": Shared priors and decision procedures.  

  **Evidential Cooperation Logic:**  
  An EDT agent cooperates if:  
  \[
  \mathbb{E}[B(f) \mid I_i = 1] - C > \mathbb{E}[B(f) \mid I_i = 0],
  \]  
  i.e., if the expected benefit from the evidence provided by their cooperation (higher \(f\)) offsets \(C\).  

  **Modeling Similarity and Common Source:**  
  - **Without common source:** Decisions are *independent* conditional on background knowledge.  
    - Each agent's action is a Bernoulli(\(p\)) trial, uncorrelated with others.  
    - Correlation \(\rho = 0\) for any pair.  
  - **With common source:** Decisions share a latent factor (e.g., common random variable \(\theta \sim \text{Uniform}[0,1]\)).  
    - Agent \(i\) cooperates if \((1-\alpha)\theta + \alpha \epsilon_i \leq p\), with \(\epsilon_i \sim \text{Uniform}[0,1]\) independent.  
    - **Strength of common source:** Controlled by \(\alpha \in [0,1]\):  
      - \(\alpha = 0\): Perfect correlation (\(\rho = 1\)).  
      - \(\alpha = 1\): Independence (\(\rho = 0\)).  
    - Pairwise correlation:  
      \[
      \rho = \frac{(1-\alpha)^2}{(1-\alpha)^2 + \alpha^2}.
      \]  
  - **Evidential link:** Measured by \(\delta_N = \mathbb{E}[f \mid I_i=1] - \mathbb{E}[f \mid I_i=0]\).  

  ---

  ### Step 1: Evidential Link as a Function of \(N\) and \(\alpha\)  
  - **Without common source (\(\alpha = 1\), \(\rho = 0\)):**  
    \[
    \delta_N = \frac{1}{N}.
    \]  
    *Derivation:*  
    - \(\mathbb{E}[f \mid I_i=1] = p + \frac{1 - p}{N}\) (cooperation adds 1 to numerator, so \(f = \frac{1 + \text{Bin}(N-1, p)}{N}\)).  
    - \(\mathbb{E}[f \mid I_i=0] = p - \frac{p}{N}\).  
    - \(\delta_N = \left(p + \frac{1 - p}{N}\right) - \left(p - \frac{p}{N}\right) = \frac{1}{N}\).  

  - **With common source (\(\alpha < 1\), \(\rho > 0\)):**  
    \[
    \delta_N = \frac{1}{N} + \left(1 - \frac{1}{N}\right) \delta,
    \]  
    where \(\delta = \mathbb{E}[I_j \mid I_i=1] - \mathbb{E}[I_j \mid I_i=0] > 0\) is constant in \(N\) (depends on \(\alpha\)).  
    *Derivation:*  
    - \(\mathbb{E}[f \mid I_i=1] = \frac{1}{N} + \frac{N-1}{N} \mathbb{E}[I_j \mid I_i=1]\),  
    - \(\mathbb{E}[f \mid I_i=0] = \frac{N-1}{N} \mathbb{E}[I_j \mid I_i=0]\),  
    - \(\delta_N = \frac{1}{N} + \frac{N-1}{N} \delta\).  
    - As \(N \to \infty\), \(\delta_N \to \delta > 0\).  

  ---

  ### Step 2: Breakdown Point for Evidential Cooperation  
  The agent cooperates iff:  
  \[
  \mathbb{E}[B(f) \mid I_i=1] - \mathbb{E}[B(f) \mid I_i=0] > C.
  \]  
  - **Without common source (\(\alpha = 1\)):**  
    \[
    \mathbb{E}[B(f) \mid I_i=1] - \mathbb{E}[B(f) \mid I_i=0] \approx B'(p) \cdot \delta_N = \frac{B'(p)}{N}.
    \]  
    (Linear approximation via Taylor expansion; valid if \(B\) is differentiable at \(p\)).  
    Cooperation holds iff:  
    \[
    \frac{B'(p)}{N} > C \implies N < \frac{B'(p)}{C}.
    \]  
    **Breakdown:** For \(N > \frac{B'(p)}{C}\), \(\delta_N\) is too small, and defection maximizes expected utility.  
    - As \(N \to \infty\), \(\delta_N \to 0\), so \(\mathbb{E}[U \mid \text{coop}] < \mathbb{E}[U \mid \text{defect}]\).  

  - **With common source (\(\alpha < 1\)):**  
    - \(\delta_N \to \delta > 0\) as \(N \to \infty\).  
    - Cooperation holds if:  
      \[
      \lim_{N \to \infty} \left( \mathbb{E}[B(f) \mid I_i=1] - \mathbb{E}[B(f) \mid I_i=0] \right) > C.
      \]  
      (e.g., if \(B\) is linear, this is \(k \cdot \delta > C\) for \(B(f) = k \cdot f\)).  
    - Evidential link persists if \(\delta > C / L\), where \(L\) is a Lipschitz constant for \(B\).  

  ---

  ### Step 3: Defense Against Objection  
  **Objection:**  
  "An EDT agent can treat their action as a random sample from the same decision procedure as others. Thus, the evidential link \(\delta_N\) remains strong for any \(N\), as cooperation always signals high \(f\)."  

  **Response:**  
  The objection assumes that a single sample (one's own action) provides significant evidence about the population mean \(f\), *regardless of \(N\)*. This is false when decisions are independent (no common source):  
  - In the independent case, the only information from \(I_i = 1\) is that *one* agent (out of \(N\)) cooperated. The expected change in \(f\) is \(\frac{1}{N}\) (derived above).  
  - As \(N \to \infty\), \(\frac{1}{N} \to 0\). The signal is diluted:  
    - Example: If \(B(f) = f\) and \(C = 0.1\), then \(\mathbb{E}[U \mid \text{coop}] - \mathbb{E}[U \mid \text{defect}] = \frac{1}{N}\).  
      Cooperation is rational iff \(N < 10\). For \(N = 10^6\), \(\delta_N = 10^{-6}\), which is negligible compared to \(C = 0.1\).  
  - **Why sampling intuition fails:** The agent is not a "typical" sample if independence holds. In large populations, a single outlier (e.g., one cooperator) does not meaningfully update beliefs about \(f\).  

  **Common source is crucial:** Only if \(\rho > 0\) (via \(\alpha < 1\)) does \(\delta_N \not \to 0\). Here, one's action *is* informative about \(\theta\), which globally influences all agents.  

  ---

  ### Sensitivity to Assumptions  
  1. **Payoff structure \(B(f)\):**  
     - If \(B\) is highly convex near \(p\), small \(\delta_N\) might still yield \(\Delta B > C\).  
       - *Counter:* For \(B(f) = e^f\), \(\Delta B \sim \frac{e^p}{N} \to 0\) still holds. Breakdown occurs for large \(N\), but the threshold \(N > \frac{B'(p)}{C}\) increases.  
     - **Robustness:** If \(B\) is Lipschitz (e.g., \(|B(f_1) - B(f_2)| \leq L |f_1 - f_2|\)), then \(\Delta B \leq L \delta_N\). For \(\rho = 0\), \(\Delta B \leq \frac{L}{N} \to 0\).  

  2. **Similarity model:**  
     - **Independence (\(\rho = 0\)) is key:** If "merely similar" implies weak correlation (e.g., \(\rho = O(1/N)\)), then \(\delta_N \to 0\) still holds.  
     - **Common source strength:** If \(\alpha \to 1\) (weak common source), \(\delta \to 0\), so cooperation may break down even with a common source.  

  3. **Prior \(p\):**  
     - Affects the threshold \(\frac{B'(p)}{C}\) but not the asymptotic limit \(\delta_N \to 0\) for \(\rho = 0\).  

  ---

  ### Conclusion  
  In the limit \(N \to \infty\), evidential cooperation **breaks down** without a common source (\(\rho = 0\)):  
  - The evidential link \(\delta_N = \frac{1}{N} \to 0\), so \(\Delta B < C\) for large \(N\).  
  - Defection becomes optimal as the EDT agent cannot meaningfully influence beliefs about \(f\).  

  With a common source (\(\rho > 0\)), \(\delta_N \to \delta > 0\), and cooperation may persist if \(\delta > C / L\). Thus, "similarity" alone (independence) is insufficient; **shared causality** (via \(\theta\)) is essential for sustained cooperation in large populations.
