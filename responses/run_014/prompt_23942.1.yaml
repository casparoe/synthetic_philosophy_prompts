  We are considering a one-shot simultaneous game with N agents, all evidential decision theorists (EDT). Each agent chooses to cooperate (C) or defect (D). The payoff for an agent is:

    U_i = B(f) - C * I_i

  where:
    f = (number of cooperators) / N   (the fraction of cooperators)
    B(f) is a benefit function that increases with f (so that higher cooperation fractions yield higher benefits to every agent)
    I_i is an indicator: 1 if agent i cooperates, 0 if defects.
    C > 0 is the cost of cooperation (so that if the agent cooperates, she pays C).

  The game has a structure of a large-scale Prisoner's Dilemma: 
    - If everyone defects (f=0), then each gets B(0) (which we can assume is low).
    - If everyone cooperates (f=1), then each gets B(1) - C (which we assume is greater than B(0) because B(1) is much larger, but note that the cost C is subtracted for each cooperator).
    - However, for an individual, defection always avoids the cost C. So for a fixed f, the payoff for defecting is B(f) and for cooperating is B(f) - C. Hence, defection dominates causally.

  But EDT agents condition on their own action and use that as evidence about what others do. Specifically, an EDT agent reasons:

    "If I cooperate, that is evidence that other similar agents will also cooperate, so the expected fraction f will be high. If I defect, that is evidence that others will defect, so f will be low. Therefore, even though my action doesn't cause others to act, the expected benefit from a high f when I cooperate might offset the cost C."

  We are to argue that as N becomes very large, this evidential link breaks down, and the agent is driven to defect, unless the agents' decision procedures share a common source (i.e., they are not just similar but have a common cause that makes them highly correlated).

  Modeling the evidential link:

  We assume that the agents are similar in the sense that they share the same decision procedure and the same prior beliefs. However, without a common source, the correlation between their decisions might be weak, especially as N grows.

  To model the similarity and the common source, we introduce a parameter that captures the strength of the correlation between the agents' decisions. Specifically, we model the decision of each agent as a function of a common random variable and an independent random variable.

  Let θ be a common random variable (the "common source") that affects all agents. Without loss of generality, assume θ is uniformly distributed on [0,1]. Each agent i also has an independent random variable ε_i, also uniform on [0,1]. The decision of agent i is determined by a threshold:

    Agent i cooperates if and only if:  (1-α) * θ + α * ε_i  ≤  p

  where p is a parameter (the base probability of cooperation without conditioning) and α is a mixing parameter between 0 and 1 that represents the degree of independence (or the strength of the common source: when α is small, the common source θ dominates; when α is large, the independent noise dominates). However, note that in our case, the agents are using the same decision procedure, so they will have the same threshold. We can think of p as being set by the decision procedure.

  But note: the agents are all EDT and will choose the action that maximizes expected utility given their evidence. Therefore, we must consider that the threshold p is actually set by the decision rule. However, in equilibrium, the decision rule must be consistent.

  Alternatively, we can model the agents as having a common prior about the distribution of the fraction f, and then update based on their own action. This is the more standard approach in the literature (e.g., the model of Eells, Jeffrey, etc.).

