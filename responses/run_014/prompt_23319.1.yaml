  Their confusion seems common in rationalist circles where these concepts get mixed. I'll emphasize that both views are mathematically valid but answer different questions. The "not a utility function" camp is trying to protect the unique insight of Kelly—it's about survival in repeated bets, not psychological risk preferences. 

