  Hmm... the user mentions their ergodicity-focused friend brought up "ensemble vs time averages." That's probably the key they're missing. Let me recall Ole Peters' work: the ergodicity argument says that for multiplicative growth (like wealth), the arithmetic mean (ensemble average) doesn't correspond to individual experience over time. Kelly optimizes the time-average growth rate, which is geometric. So when people say "it's not a utility function," they might mean it's solving a different problem—optimizing a path-dependent process rather than representing preferences.

  The user's steelman about "strategy vs preference" is sharp. That's exactly where the distinction lies. Log utility would still "work" if your utility truly was logarithmic, but Kelly emerges even if you only care about terminal wealth. The philosophy matters: are you describing risk aversion (utility) or avoiding ruin (strategy)? 

