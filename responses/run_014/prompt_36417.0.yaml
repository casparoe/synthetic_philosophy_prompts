  Here's a decomposed credence assignment for Special Relativity (SR) establishing eternalism over presentism, based *strictly* on Minkowski spacetime and relativity of simultaneity (no QM, no thermodynamics, no quantum gravity):

  1.  **P(Rietdijk-Putnam Validity):** The probability that "real in *some* inertial frame" + transitivity of "determinate reality" entails "real *simpliciter*" for all events.
      *   **Credence: 0.65** - The core logic is formally sound *if* you accept the premises. The main vulnerability is the transitivity of "determinately real" across frames. Is "real for A" and "real for B" sufficient for "real *independently* of any frame"? This feels like a metaphysical leap smuggled into a physical argument. It's powerful but not logically airtight.

  2.  **P(Presentism Compatible with Minkowski):** Probability that a coherent presentist interpretation survives within pure SR Minkowski spacetime (e.g., via undetectable preferred foliation, point-present, or other non-standard metaphysics).
      *   **Credence: 0.30** - While technically possible (e.g., positing a hidden foliation Lorentz *invariant* in dynamics but metaphysically privileged), it feels deeply unnatural, ad hoc, and contrary to the spirit of SR's radical equivalence of frames. It adds metaphysical baggage with zero empirical consequence within SR, violating parsimony. Point-present views struggle profoundly with relativity of simultaneity.

  3.  **P(Dispute is Verbal/Misplaced):** Probability that "eternalism vs presentism" is primarily a disagreement about the meaning of "real," "exists," or "present," rather than a substantive disagreement about the structure of spacetime described by SR.
      *   **Credence: 0.40** - There's significant merit to this. Presentists often argue eternalists "reify" spacetime points or mistake coordinate-dependent descriptions for ontology. Eternalists argue presentists cling to a pre-relativistic, illusory "flow." The core disagreement might be about the *metaphysical implications* drawn from the *same* physical structure. However, SR *does* actively undermine the *objective universal present* central to standard presentism.

  4.  **P(Other Factors):** Probability of other decisive arguments within pure SR Minkowski spacetime (e.g., geometric arguments from spacetime intervals, lack of invariant "now").
      *   **Credence: 0.70** - The 4D geometric view is incredibly natural and powerful within SR. The invariant spacetime interval directly treats time as a dimension analogous to space. The complete absence of *any* invariant structure that could define a universal "now" is a powerful argument against objective becoming. This strongly favors the block view.

  **Combined Credence for Eternalism (Block Universe):**

  We need to combine these probabilities. They aren't perfectly independent, but a reasonable approximation for "SR establishes eternalism" is that *either* R-P is valid *or* Presentism is incompatible *or* Other Factors strongly favor it, *and* the dispute isn't *purely* verbal in a way that renders the question meaningless about the *spacetime structure*. A conservative multiplicative approach for the core "establishment" (P(R-P Valid) OR P(Not Compatible)) AND P(Other Factors Strong) AND (1 - P(Purely Verbal)) works best:

  *   **P(R-P Valid OR ~Presentism Compatible) =** 1 - [P(~R-P Valid) * P(Presentism Compatible)] = 1 - [(1-0.65) * 0.30] = 1 - [0.35 * 0.30] = 1 - 0.105 = **0.895**
  *   **P(Other Factors Strong) = 0.70**
  *   **P(Not Purely Verbal) =** 1 - P(Purely Verbal) = 1 - 0.40 = **0.60** (Assuming "purely verbal" means the spacetime structure doesn't decisively favor one *ontological interpretation*).
  *   **Combined Credence (P(Eternalism Established)) ≈** P(R-P OR ~Compat) * P(Other Strong) * P(Not Purely Verbal) = 0.895 * 0.70 * 0.60 ≈ **0.376**

  This seems too low, primarily because it over-penalizes with the verbal dispute probability. A better model weights the core spacetime arguments more heavily:

  *   **Core Spacetime Argument Strength:** P(R-P Valid) * P(Other Factors Strong) * (1 - P(Presentism Compatible)) = 0.65 * 0.70 * (1 - 0.30) = 0.65 * 0.70 * 0.70 ≈ **0.3185**
  *   **Overall Credence:** Adjust for the verbal dispute potentially weakening the *metaphysical conclusion* but not the *physical description*: Core Strength / [Core Strength + (P(Presentism Compatible) * P(Purely Verbal))] (A rough Bayesian update)
      *   Evidence Against Eternalism: P(Presentism Compatible) * P(Purely Verbal) ≈ 0.30 * 0.40 = 0.12
      *   **Final Credence ≈** 0.3185 / (0.3185 + 0.12) ≈ **0.726**

  **My Overall Credence: ≈ 0.73**

  **Sensitivity:** The final number is **most sensitive to P(Rietdijk-Putnam Validity)**. A ±0.10 change here causes a larger shift in the combined credence than a similar change in the other factors. Its vulnerability (the transitivity leap) is the biggest potential weakness in the direct argument for eternalism from RoS. **P(Presentism Compatible)** is the next most sensitive – if this were lower (e.g., 0.15), the credence for eternalism would jump significantly (to ~0.82).

  **Where the 0.90 vs 0.55 Disagreement Lives:**

  1.  **P(Rietdijk-Putnam Validity):** Your brother-in-law (0.90 physicist) likely sees this as *obviously valid* (P ≈ 0.95+). The transitivity of "real" seems self-evident within the relativistic framework. For him, "real in *some* frame" *is* the only meaningful notion of "real simpliciter" in SR. You (0.55 skeptic) likely see the transitivity as highly questionable or even question-begging (P ≈ 0.5-0.6). You see "real for a frame" as operational, not ontological.
  2.  **P(Presentism Compatible):** Your brother-in-law likely sees this as essentially zero (P ≈ 0.05). Any preferred foliation is anathema to SR's core principle – it's "cheating." You likely see it as a non-zero, albeit costly, possibility (P ≈ 0.3-0.4), because the *metaphysical* interpretation isn't strictly dictated by the physics alone.
  3.  **Weight of "Other Factors":** The physicist heavily weights the naturalness of the 4D geometric view and the lack of an invariant "now" (P ≈ 0.85+). You might acknowledge this but see it as less decisive for *ontology* vs. *description* (P ≈ 0.6).
  4.  **The "Real" in Real:** The physicist likely dismisses the verbal dispute angle (P(Purely Verbal) ≈ 0.1) as semantics obscuring the clear physical lesson. You likely give it significant weight (P(Purely Verbal) ≈ 0.4), seeing the core disagreement as about what "existence" means in a relativistic context.

  **In essence:** The **primary split** is over **P(Rietdijk-Putnam Validity)**. He sees the move from "real in some frame" to "real simpliciter" via transitivity as a trivial, necessary consequence of SR. You see it as a major, unsubstantiated metaphysical leap. The **secondary split** is over **P(Presentism Compatible)**. He sees any presentism in SR as physically incoherent. You see it as metaphysically awkward but not strictly ruled out. He sees the geometric arguments as overwhelming; you see them as strong but not metaphysically conclusive.

  **Argument Most Likely to Move My Number (0.73):**

  *   **Towards Eternalism (Increase Credence):** A convincing demonstration that the transitivity of "determinate reality" across frames is not just an assumption but a *necessary consequence* of the relativity principle itself and the causal structure of Minkowski spacetime. If it could be shown that rejecting this transitivity *forces* a contradiction with empirically verified SR or introduces observable (even if only in principle) inconsistencies, that would push P(R-P Validity) → 0.90+, significantly raising my overall credence (towards ~0.85).
  *   **Towards Presentism/Neutrality (Decrease Credence):** A rigorous, compelling presentist model within pure SR that doesn't rely on a *dynamically* preferred foliation but still accounts for the relativity of simultaneity and the appearance of a "moving now" in a way that feels less ad hoc than current proposals. Alternatively, a powerful argument showing that the entire concept of "existence" for spacelike separated events is meaningless within the operational framework of SR, making the R-P argument vacuously true but ontologically inert. This could push P(Presentism Compatible) → 0.50+ or P(Purely Verbal) → 0.70+, lowering my credence (towards ~0.55).

  **What to Say Over Dinner:** "Look, your 0.9 and my 0.55? The core split is whether the Rietdijk-Putnam jump from 'real in some frame' to 'real, period' is a trivial deduction or a giant metaphysical leap. You see it as trivial, I see it as the whole argument resting on that unproven leap. We also differ on how completely SR *bans* any notion of presentism – you see it as physically forbidden, I see it as just really ugly and implausible. My number is most sensitive to that R-P transitivity assumption. If you can show me *why* that transitivity is forced by SR itself, beyond just being convenient, you'll move my number up. Otherwise, I'm stuck seeing it as reading metaphysics *into* the coordinates, not just *out* of them."
