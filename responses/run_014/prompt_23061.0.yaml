  We are discussing the issue of the additive constant in Kolmogorov complexity and its effect on the Solomonoff prior. The key point is that the prior for a hypothesis (which is a binary string) is proportional to \( 2^{-K(x)} \), where \( K(x) \) is the Kolmogorov complexity of \( x \). However, because Kolmogorov complexity is defined with respect to a universal Turing machine (UTM), and the invariance theorem states that for two different UTMs, \( U_1 \) and \( U_2 \), we have:

  \[ |K_{U_1}(x) - K_{U_2}(x)| \leq c_{12} \]

  for some constant \( c_{12} \) that depends on the two machines but not on \( x \). This means that the prior for \( x \) under two different UTMs can differ by a multiplicative factor of at most \( 2^{c_{12}} \) (since \( 2^{-K_{U_1}(x)} \) and \( 2^{-K_{U_2}(x)} \) are off by a factor of at most \( 2^{c_{12}} \)).

  This multiplicative constant can be large, but it is fixed for a given pair of machines. The question is: how does the posterior become independent of this constant as we observe more data?

  Recall that Solomonoff induction is about predicting sequences. We have an observation sequence \( x_{1:n} \) and we want to predict the next bit. The posterior probability of the next bit being 0 or 1 is computed by:

  \[ P(b | x_{1:n}) = \frac{M(x_{1:n} b)}{M(x_{1:n})} \]

  where \( M \) is the universal prior (i.e., the Solomonoff prior) and \( M(x_{1:n}) \) is the probability assigned to the finite sequence \( x_{1:n} \) by the prior. Specifically, \( M(x_{1:n}) \) is the sum of the prior weights of all programs that output a string starting with \( x_{1:n} \).

  The key is to note that the multiplicative constant in the prior for a given string might be large, but when we take ratios (like the posterior for the next bit) the constants tend to cancel out. However, the cancellation is not complete because the constant might be different for different hypotheses (programs). But note that the constant is fixed for the entire machine.

  Let me denote by \( M_U \) the prior defined with respect to a universal machine \( U \). Then for two different universal machines \( U_1 \) and \( U_2 \), we have:

  \[ M_{U_1}(x) = \sum_{p: U_1(p)=x*} 2^{-l(p)} \]

  and similarly for \( U_2 \). The invariance theorem for Kolmogorov complexity tells us that for every string \( x \), there exists a constant \( c \) (independent of \( x \) but depending on \( U_1 \) and \( U_2 \)) such that:

  \[ K_{U_1}(x) \leq K_{U_2}(x) + c \]

  But note that the entire prior is a sum over all programs. The invariance theorem for the prior (Levin's theorem) states that the entire prior is also invariant up to a multiplicative constant. Specifically, there is a constant \( d \) (depending on \( U_1 \) and \( U_2 \)) such that for every finite string \( x \):

  \[ M_{U_1}(x) \leq d \cdot M_{U_2}(x) \]

  and similarly

  \[ M_{U_2}(x) \leq d \cdot M_{U_1}(x) \]

  This constant \( d \) is a fixed constant for the two machines. How does this help for the posterior?

  Consider the posterior for the next bit:

  \[ P_{U}(b | x_{1:n}) = \frac{M_U(x_{1:n} b)}{M_U(x_{1:n})} \]

  Now, if we compare the same posterior under two different machines \( U_1 \) and \( U_2 \):

  \[ \frac{M_{U_1}(x_{1:n} b)}{M_{U_1}(x_{1:n})} \quad \text{and} \quad \frac{M_{U_2}(x_{1:n} b)}{M_{U_2}(x_{1:n})} \]

  We know that:

  \[ M_{U_1}(x_{1:n}) \leq d \cdot M_{U_2}(x_{1:n}) \]
  and
  \[ M_{U_1}(x_{1:n} b) \leq d \cdot M_{U_2}(x_{1:n} b) \]

  But also the reverse:

  \[ M_{U_2}(x_{1:n}) \leq d \cdot M_{U_1}(x_{1:n}) \]
  and
  \[ M_{U_2}(x_{1:n} b) \leq d \cdot M_{U_1}(x_{1:n} b) \]

  This gives:

  \[ \frac{M_{U_1}(x_{1:n} b)}{M_{U_1}(x_{1:n})} \leq d \cdot \frac{M_{U_2}(x_{1:n} b)}{d^{-1} M_{U_1}(x_{1:n})} \cdot \frac{M_{U_1}(x_{1:n})}{M_{U_1}(x_{1:n})} \]

  Wait, let me do it more carefully:

  We have:

  \[ \frac{M_{U_1}(x_{1:n} b)}{M_{U_1}(x_{1:n})} \leq \frac{d \cdot M_{U_2}(x_{1:n} b)}{M_{U_1}(x_{1:n})} \]

  and since \( M_{U_1}(x_{1:n}) \geq d^{-1} M_{U_2}(x_{1:n}) \) (from the reverse inequality), we get:

  \[ \frac{M_{U_1}(x_{1:n} b)}{M_{U_1}(x_{1:n})} \leq d \cdot M_{U_2}(x_{1:n} b) \cdot \frac{1}{d^{-1} M_{U_2}(x_{1:n})} = d^2 \cdot \frac{M_{U_2}(x_{1:n} b)}{M_{U_2}(x_{1:n})} \]

  Similarly, we can show:

  \[ \frac{M_{U_1}(x_{1:n} b)}{M_{U_1}(x_{1:n})} \geq d^{-2} \cdot \frac{M_{U_2}(x_{1:n} b)}{M_{U_2}(x_{1:n})} \]

  Therefore, the posterior probability for the next bit under two different machines is within a multiplicative factor of \( d^2 \). Since \( d \) is a fixed constant for the two machines, this factor is bounded and independent of \( n \) and of the data.

  But note: the multiplicative factor in the posterior is bounded by a constant. However, we are often interested in the additive error. If the true posterior is \( p \), and we have an estimate \( \hat{p} \) such that \( \hat{p} \in [p / d^2, p \cdot d^2] \), then the additive error is at most \( \max(p \cdot (d^2 - 1), p \cdot (1 - d^{-2})) \). However, if \( p \) is very close to 0 or 1, the multiplicative factor might still leave the posterior in the same "region" (e.g., both are very close to 1).

  But the key point is that the multiplicative factor is constant, so as the amount of data grows, the posterior concentrates on the true hypothesis (if it is computable) and the probabilities for the next bit become very close to 0 or 1 (depending on the true hypothesis). Therefore, the constant factor becomes negligible in the limit.

  To address your question about a clean bound: the multiplicative factor in the posterior for the next bit is bounded by a constant (that depends only on the choice of the two machines). Therefore, for any fixed desired accuracy, once the posterior under one machine becomes sufficiently concentrated (i.e., the probability of the next bit is either above \( 1-\epsilon \) or below \( \epsilon \)), the posterior under the other machine will be within a multiplicative factor of \( d^2 \). This means that if the true probability is 1, then under the first machine we might have \( p_1 \geq 1-\epsilon \), and under the second machine we have \( p_2 \geq (1-\epsilon)/d^2 \). But note that as \( n \) increases, \( \epsilon \) can be made arbitrarily small independently of the constant \( d \). Therefore, after a sufficiently large \( n \) (which depends on \( d \) and the desired accuracy), the predictions will be arbitrarily close.

  However, the constant \( d \) can be arbitrarily large for a poor choice of the reference machine. Therefore, the number of observations needed to "wash out" the constant factor might be large if the constant is large, but it is still a fixed number (for a fixed desired accuracy and fixed pair of machines). Moreover, the convergence is still guaranteed.

  But note: the transient behavior is affected. For example, if one machine assigns a much higher prior to the true hypothesis than another machine, then the posterior under the first machine will converge faster. However, the invariance theorem does not tell us which machine is better for a particular problem. In practice, we hope that the constant is not too large, or we choose a "natural" reference machine.

  Another way to think about this is that Solomonoff induction is an idealization and the constant is part of the "big O" in the convergence. The convergence theorems for Solomonoff induction (like the one that says the total prediction error is bounded by the Kolmogorov complexity of the true hypothesis) have constants that depend on the reference machine. For example:

  The expected total squared error between the true probabilities and the predicted probabilities is bounded by \( (K(\mu) \ln 2)/2 \), where \( \mu \) is the true hypothesis (a computable measure). But note that \( K(\mu) \) is defined up to an additive constant (depending on the UTM). Therefore, the bound is only meaningful up to an additive constant. This is typical in algorithmic information theory.

  In summary:

  1. The multiplicative factor in the prior for any string is bounded by a constant (for two fixed UTMs).
  2. The posterior for the next bit also has a multiplicative factor bounded by a constant (for two fixed UTMs).
  3. As the sequence of observations grows, the posterior concentrates, so that the constant factor becomes less significant (because the probabilities get close to 0 or 1).
  4. The number of observations needed to achieve a desired accuracy in the prediction depends on the constant (which is fixed for the two machines) and the true hypothesis. There is no universal bound that is independent of the reference machine, but for a fixed pair of machines, the required number of observations is finite.

  Therefore, Solomonoff induction is universal in the sense that it will eventually converge to the correct predictions for any computable sequence, regardless of the reference machine, but the speed of convergence depends on the reference machine and the true hypothesis.

