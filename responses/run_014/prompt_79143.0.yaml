prompt: |-
  ok so this is for a debate thing at school and i keep getting stuck. the motion is basically "you should be allowed to sell your kidney / your plasma / your spot in the queue" and every time i say the kidney thing feels different from selling your labour or your old bike, someone says oh so you just find it icky, thats not an argument. which, fine, maybe. but i want to know what an actual answer would have to do before i go picking one, so can you write me the spec for it? like what does any decent theory of "this market is repugant / selling this should be illegal" have to get right. not the theories themselves, the checklist, thats the bit i definately need.

  cases i think it has to handle, tell me what im missing:
  - kidney sales, and plasma, and paying someone to be in a risky medical trial
  - price gouging for bottled water after a hurricane, which the econ kids insist is actually good
  - vote selling, which everyone hates but nobody can say why cleanly
  - and two i thought of: (a) a rich guy pays a hospital charity for the right to be the one who donates a kidney, so no money goes to any seller, the money flows the other way, and yet it still feels off; (b) hiring professional mourners, which is a real job in some places and seems fine, versus buying someone elses apology and giving it to the person you wronged, which seems much worse. so is selling a feeling a different kind of thing from selling an object?

  then the distinctions it cant flatten: the desperate seller (would be fixed by making them not desperate) vs the good being cheapened just by having a price on it (wouldnt be fixed by that); objection to the sale vs objection to the price (a medal for five quid seems worse than a medal for five hundred); wrong for the seller vs wrong for the rest of us, or for the whole institution; and disgust as evidence that somethings wrong vs disgust as the thing the theory is supposed to explain away.

  and one fact it cant contradict: repugnance moves. whole markets that were scandalous a century ago are boring now, and the reverse happens too. so it cant just say repugnant = wrong, and it also cant just say repugnance is always a mistake.

  what i most want: which of these are real requirements and which are just what one side wants to be true, whether some pair of them cant both be satisfied (i have a hunch that "explain why kidney sales are wrong" and "dont just launder disgust" cant both hold, but you tell me), and which single requirement knocks out the most of the usual answers.

  last thing, and i mean this: say what would change your mind. which counterexample or argument would move a requirement off your list, and where do you think your list is most likely to be wrong. hard cap 800 words, a list is fine, dont go over.
reasoning: |-
  Okay, the user is preparing for a school debate on whether selling kidneys, plasma, queue spots, etc., should be allowed. They keep getting stuck when opponents dismiss their discomfort with kidney sales as just "icky," which isn't a valid argument. They need a framework—a spec or checklist—that any decent theory explaining why certain markets are repugnant must satisfy. 

  First, I need to understand their key concerns. They listed several cases: kidney sales, plasma, paid medical trials, price gouging after disasters, vote selling, a rich guy paying a charity to donate a kidney, professional mourners vs. buying apologies. They also mentioned distinctions like desperate sellers vs. cheapening the good, objection to sale vs. price, wrong for seller vs. society, and disgust as evidence vs. something to explain. Plus, they note that repugnance changes over time, so the theory must account for that without equating repugnance with inherent wrongness.

  The user wants to know which requirements are essential, which might conflict, and what could falsify the list. They suspect a tension between explaining kidney sales' wrongness and not just laundering disgust. I need to create a checklist that handles all their cases and distinctions.

  Starting with the cases: Kidney sales involve exploitation and commodification of the body. Plasma is often seen as less problematic, maybe because it's renewable. Paid medical trials bring up coercion. Price gouging is defended by economists for allocating scarce resources, but feels exploitative. Vote selling undermines democracy. The rich guy scenario highlights that even without direct payment to the seller, the act feels transactional. Professional mourners are accepted in some cultures, but buying an apology seems insincere—here, the authenticity of feelings matters.

  Key distinctions: Desperation can be mitigated by better conditions, but some goods like kidneys might be inherently degraded by having a price. Objection to sale vs. price: selling a medal cheaply feels worse because it devalues the honor. The theory must separate harm to individuals from societal harm to institutions. Disgust can't be the sole reason but shouldn't be ignored either.

  Repugnance changes over time (e.g., life insurance was once taboo). So the theory must allow for cultural shifts without relativism.

  Now, compiling the checklist. Essential points: The theory must distinguish between different types of goods (body parts, votes, emotions) and not treat all markets the same. It should handle exploitation but also cases where no exploitation exists, like the rich donor scenario. It must explain why some sales cheapen the good regardless of conditions. Address both individual harm and societal degradation. Account for changing social norms without collapsing into relativism. Not use disgust as a premise but explain its presence.

  Potential conflicts: Explaining kidney sales as wrong without relying on disgust is tricky. If the argument is about exploitation, improving conditions might resolve it, but the user feels that's insufficient. The intrinsic value of body parts might be key—selling them commodifies what should be priceless. But then, why is plasma different? Perhaps because it regenerates. The theory needs to articulate what makes certain goods "market-inalienable."

  Another conflict: The rich donor case challenges exploitation arguments. Here, the harm might be to the meaning of donation—turning it into a paid privilege. This points to institutional harm. Similarly, vote selling harms democratic institutions.

  Falsifiability: If a case where something widely seen as repugnant has no plausible harm (individual or societal), that would challenge the theory. Or if repugnance persists despite changed conditions. For example, if kidney sales were allowed in a society with no poverty, and people still found it repugnant, that supports the intrinsic value argument.

  The user's hunch about kidney sales and disgust might have merit. A theory could argue that disgust signals deeper harms (like commodification) but must substantiate it. If disgust is the only basis, it's circular.

  Prioritizing requirements: The most demanding might be explaining intrinsic degradation without relying on disgust. This knocks out theories that only focus on exploitation or efficiency. It also challenges purely economic arguments.

  I think the checklist should include criteria like handling all case types, separating exploitation from commodification, accounting for changing norms, and not using disgust as a foundation. The rich donor case is crucial because it shows harm beyond individual exploitation. 

  Where might this go wrong? The requirement about intrinsic degradation could be culturally subjective. But the theory can acknowledge that while explaining why certain goods are protected across cultures. Also, the line between feelings and services (mourners vs. apologies) might need more nuance—perhaps sincerity is key.

  In conclusion, the spec must demand that theories address commodification, exploitation, institutional harm, and norm changes. The biggest challenge is balancing disgust with objective harms. If a theory can pass all these, especially explaining the rich donor case and vote selling without relying on disgust, it's robust. The user should look for theories that fail any point to refute them.
answer: |-
  Here's a spec for a theory explaining market repugnance that handles your cases and distinctions. A decent theory **must** satisfy all these requirements:

  1.  **Handle All Core Cases:** Explain the *differential* repugnance (or lack thereof) for:
      *   Kidney sales vs. Plasma sales.
      *   Paid participation in risky medical trials.
      *   Post-disaster price gouging (acknowledging efficiency arguments).
      *   Vote selling.
      *   Rich donor paying a charity for the "right" to donate a kidney.
      *   Professional mourners vs. Buying/selling an apology.

  2.  **Distinguish Exploitation from Commodification:**
      *   **Exploitation (Desperate Seller):** Explain objections based on vulnerability/coercion (e.g., kidney sales driven by poverty).
      *   **Commodification (Cheapening the Good):** Explain objections that persist *even if* exploitation is absent (e.g., selling a Medal of Honor for £5 feels worse than £500; the rich kidney donor scenario; vote selling even between peers). *This is critical for kidney sales vs. plasma/labour.*

  3.  **Separate Objection-to-Sale from Objection-to-Price:** Clearly distinguish:
      *   Why selling *at all* is problematic (e.g., votes, kidneys intrinsically).
      *   Why *only* a specific price level is problematic (e.g., "price gouging" vs. normal price increases; cheap medals feeling worse).

  4.  **Identify the Locus of Harm:** Specify *who/what* is harmed and how:
      *   The seller (exploitation, degradation)?
      *   The buyer (corruption)?
      *   Third parties (unfairness)?
      *   A social institution (democracy, healthcare, gift-giving)?
      *   A shared societal value (human dignity, civic virtue, meaning)?

  5.  **Integrate (But Not Simply Equate) Disgust:**
      *   Acknowledge disgust/intuition ("ick") as a common *starting point* or *signal*.
      *   Provide a *rationale* explaining *why* disgust arises in specific cases, grounding it in the harms identified above. **Crucially:** It cannot *only* say "It's repugnant because it disgusts people." Disgust must be an *output* of the theory's explanation, not the *input* justification.

  6.  **Account for Dynamic Repugnance:** Explain *how* and *why* repugnance changes over time (e.g., life insurance, paid blood donation, surrogacy debates). The theory must allow for:
      *   Changing social values/mores.
      *   Changing technology/context altering perceived harms.
      *   Markets becoming normalized or newly scandalized.

  7.  **Explain the "Feeling vs. Object" Distinction:** Account for why selling feelings/services (mourners) is often acceptable, but selling *specific expressions* tied to fundamental relationships/values (apologies, votes, bodily integrity) is repugnant. The theory needs a concept of "inalienability" tied to identity, core relationships, or essential social functions.

  **Which Requirements Are Essential vs. Desired?**

  *   **Essential (Core):** 1 (Handling cases), 2 (Exploitation/Commodification split), 4 (Locus of Harm), 5 (Integrating Disgust non-circularly), 7 (Feeling/Object distinction for core cases). *Failing any of these means the theory doesn't cover the necessary ground.*
  *   **Necessary Nuance:** 3 (Sale vs. Price), 6 (Dynamism). *A theory lacking these is incomplete and likely rigid.*
  *   **What One Side Wants:** The "pro-market" side often wants Requirement 2 (Commodification) to be weak or non-existent, reducing everything to exploitation. The "anti-market" side sometimes wants Requirement 5 to be weaker, allowing disgust more weight.

  **Potential Conflicts:**

  *   **Your Hunch (Kidney Wrongness vs. Not Just Disgust):** This *is* a tension, but **not** impossible. The key is Requirement 5: A good theory links the disgust to a *distinct harm* like commodification of the body (violating human dignity - Requirement 4) or degradation of the organ donation system (Requirement 4 & 7), *independent* of desperation. If the *only* harm is exploitation, then fixing desperation *should* resolve the issue – but Requirement 2 demands an explanation for why it doesn't fully.
  *   **Cheapening vs. Dynamism:** If something is intrinsically degraded by sale (Requirement 2), how can repugnance fade (Requirement 6)? The theory needs to explain how social understandings of what constitutes a "core" value or "inalienable" good *can* evolve, altering the perceived commodification harm.

  **The Knockout Requirement:**

  *   **Requirement 2 (Distinguish Exploitation from Commodification)** is the most demanding. Theories that *only* focus on exploitation (common econ arguments) fail the rich donor case, the cheap medal case, vote selling between peers, and arguably the core kidney objection. Theories that *only* focus on commodification struggle with why plasma is less repugnant than kidneys or why price gouging attracts unique ire. A theory must convincingly handle *both* aspects.

  **What Would Change My Mind (Falsifiability/Weak Spots):**

  1.  **Requirement 2 (Commodification):** A clear, non-repugnant case where something widely considered sacred/inalienable is routinely bought/sold *without* any perceived degradation of its intrinsic value *or* harm to institutions/values, *and* where initial repugnance faded *only* due to habituation, not a shift in understanding of the good's nature. (The professional mourner case might come close, but fits Requirement 7).
  2.  **Requirement 7 (Feeling/Object Distinction):** A compelling argument that buying/selling a deeply personal apology or vote is fundamentally no different, in terms of commodification harm, than hiring any other emotional service like a therapist or performer, *without* invoking circular disgust. (The "sincerity" argument is common here, but needs rigorous non-circular defense).
  3.  **Requirement 6 (Dynamism):** The list is likely *most vulnerable* here. Pinpointing the *exact* mechanism for *why* repugnance shifts for specific goods is inherently complex and contextual. A theory might handle the *fact* of change but struggle with precise *predictability*.
  4.  **Overall:** If a theory satisfying *all* requirements still failed to generate the *actual* pattern of repugnance we observe across cultures/history (e.g., why kidneys but not hair? Why votes but not lobbyists?), it would need revision. The rich donor case (1e) remains a very strong test.
