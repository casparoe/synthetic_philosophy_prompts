      "Dependent choice",
      "The union of countably many countable sets is countable",
      "Tychonoff's theorem (products of compact Hausdorff spaces are compact)"
    ],
    "provable_in_ZF": [
      "Every finite set can be well-ordered"
    ]
  }
  ```

  ### Explanation:
  - **Equivalent to AC**:  
    - Zorn's lemma, "Every vector space has a basis", "Every surjective function has a right inverse", and "Every set can be well-ordered" are all well-known equivalents of AC.  
  - **Weaker than AC, not provable in ZF**:  
    - The Boolean Prime Ideal Theorem (BPI) and the Ultrafilter Lemma are equivalent to each other and strictly weaker than AC.  
    - Dependent Choice (DC) is a weaker choice principle for countable sequences.  
    - "The union of countably many countable sets is countable" requires some choice (e.g., countable choice) and is unprovable in ZF.  
    - Tychonoff's Theorem for compact **Hausdorff** spaces is equivalent to BPI and thus weaker than AC.  
  - **Provable in ZF**:  
    - "Every finite set can be well-ordered" is provable in ZF by induction, without choice. Finite sets are well-orderable by their cardinality.
