  - **Equivalent to AC**: These are equivalent to the Axiom of Choice. They are not provable in ZF alone and imply full AC.
  - **Weaker than AC, not provable in ZF**: These are strictly weaker than AC (i.e., AC implies them, but they do not imply AC) and are not provable in ZF. They represent independent choice principles.
  - **Provable in ZF**: These are theorems of ZF and do not require any choice.

