answer: |-
  Right, then. Let’s have this out. You've grasped the nettle, I'll give you that—a rare thing these days. But you've mistaken my objection for one about mere *vagueness*, like arguing over when twilight becomes night. That’s not it at all. It’s about misapplying the concept of "starting" to a phenomenon that accreted, like silt in a harbour, from countless separate actions and reactions, many taken without any conception of the grand conflict we now label the Cold War.

  Your demand for a sentence my view shows to be *false*? Very well. Here it is: **"The Cold War began when Stalin ordered the imposition of Soviet-dominated governments in Eastern Europe in 1945-47, thereby decisively rejecting the possibility of a cooperative post-war order and forcing the West into a defensive response."** That sentence, or any like it positing a single actor’s *decisive* action as the *initiation*, is false on my reading. Not because the archives don’t show Stalin ruthlessly consolidating control—they absolutely do, and it was a monstrous betrayal of pledges. Nor because the West didn’t perceive it as a profound threat—they did, rightly. It’s false because it treats the *outcome*—a sustained, global, institutionalised confrontation—as if it were the *intended object* of that specific set of decisions. It wasn’t. Stalin sought security through domination of his borders; he didn’t blueprint the NATO alliance, the Marshall Plan’s political architecture, or the global ideological crusade that followed. Crucially, the *conflict*—the mutual perception of irreconcilable hostility requiring permanent mobilisation—didn’t spring fully formed from the imposition of a puppet regime in Poland. It required the West’s *interpretation* of that act (as an open-ended threat, not a limited security move), the *series* of subsequent choices (the Truman Doctrine’s universalism, the Czech coup, the Berlin Blockade), and the gradual *institutionalisation* of opposing blocs. Each side reacted to the other’s last perceived provocation, believing *themselves* reactive. To say Stalin "started it" in '45 implies the conflict was the direct, intended consequence of his actions *alone*, ignoring the essential, escalatory role of Western agency, perception, and the counter-decisions that transformed a regional power-grab into a systemic clash. My view rules out treating the Cold War as an *event* with a single author; the sentence above does precisely that, hence it is false—not just unproven, but conceptually mistaken.

  The "clear case" you cite – an identifiable person, knowing alternatives, foreseeing the other’s reaction – exists aplenty. Attlee knew the risks of sharing atomic secrets with America alone. Truman understood how the Doctrine would be read in Moscow. Molotov absolutely grasped the sting of rejecting Marshall Aid. But each saw their move as defensive, or necessary, or a response to prior bad faith. None sat down to "start the Cold War". They made bad, sometimes wicked, choices that fed the beast. But the beast was built by the *chain* of choices and their unforeseen interactions, not birthed by one. That’s the distinction your "clear case" argument blurs. You can blame the arsonist for each fire; you cannot blame him solely for the sprawling, shifting wildfire that emerged from countless sparks and winds he never controlled. The Cold War was the wildfire, not any single fire.

  So, what does my position do? It forces us off the sterile hunt for the *primus mobile* and into the harder, dirtier terrain of how specific, contingent decisions—often taken for immediate, local reasons—interlocked, escalated, and ossified into a structure of hostility that *then* took on a life of its own. That’s where the archives lead, however inconvenient the story. Now, what particular "clear case" are *you* holding up as the definitive start, then? Let’s dissect it.
