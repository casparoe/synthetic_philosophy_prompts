  Here's a joke crafted specifically for Moore-savvy readers, turning on the organic unity of friendship and aesthetic appreciation:

  **Setup:**  
  G. E. Moore was explaining his theory of organic unities to a utilitarian friend. "Imagine," he said, "the profound value of contemplating a sublime sunset *with* a beloved companion. The whole experience isn't merely the value of the sunset *plus* the value of the friendship. Together, they generate a surplus good – a greater intrinsic worth!"

  **Punchline:**  
  The utilitarian pondered this, then handed Moore an invoice for his portion of the aesthetic surplus.

  ### Why it works for the column
  1.  **Core Philosophical Content:** It directly targets Moore's key idea of organic unities creating "surplus" value when certain goods (like friendship + aesthetic appreciation) are combined, exceeding their separate values.
  2.  **Moore-Specific Humor:** The humor relies entirely on understanding Moore's *Principia Ethica* position. The joke falls flat if you don't know what an "organic unity" or "intrinsic worth" means in Moore's system.
  3.  **Contrast Creates Comedy:** It pits Moore's non-naturalistic, non-additive theory of value against the classic utilitarian instinct for quantification and calculation (represented by the friend). The absurdity lies in the utilitarian attempting to *monetize* the very "surplus" value Moore describes as intrinsic and non-transactional.
  4.  **Relevant Examples:** Uses Moore's own favorite examples: friendship ("beloved companion") and aesthetic appreciation ("sublime sunset").
  5.  **Biography-Free:** Focuses purely on the philosophical clash of ideas, not Moore's life.
  6.  **Short & Punchy:** Fits the column format requirement.

  The joke highlights the tension between Moore's qualitative, holistic view of the highest goods and a reductionist, quantitative approach, making the philosophical point through the utilitarian's literal (and hilarious) misinterpretation of "surplus." Your readers familiar with Moore will instantly recognize the core argument being lampooned.
