prompt: |-
  i'm in a metaethics seminar this term and our TA runs the discussion sections. she's been surprisingly consistent about which normative beliefs she thinks get wrecked by the evolutionary story and which ones survive it, and i want to work out her actual rule before next week's session.

  her calls so far, as i've got them in my notes:

  - "your own pain is bad" — survives. she said this is the one place where the selection pressure and the truth line up: damage really was bad for the animals that avoided it, so the mechanism wasn't fooling us.
  - "parents owe their own kids special care" — survives, same reason.
  - "sibling incest is wrong" — debunked. just a familiarity effect from being raised in the same house, she says, nothing to do with any moral fact.
  - "inequality is bad in itself, over and above the suffering it causes" — debunked. status jockeying in small groups, and we'd have had the intuition even if inequality were perfectly fine.
  - "you still have to keep a promise you made to someone who's since died" — survives, which shocked me. she said that one isn't a selected intuition at all, it falls out of principles you'd still endorse once you knew where your other intuitions came from.
  - "gratitude: you owe something to someone who helped you at real cost to themselves" — survives, but she didn't say why, she just moved on.
  - somebody asked about 2+2=4 and she said survives, we can check those and they aren't pulling much fitness weight anyway.

  (she also says she isnt a moral realist, which i find confusing given how much tracking talk she does, so maybe that bears on what "debunked" even means for her.)

  next week is obligations to people who won't exist for another couple hundred years — long-lived nuclear waste, climate, that sort of thing. will she say that belief survives or gets debunked? i can already see two rules that fit everything above and they don't agree on this one: a rule where the question is whether the selected tendency tracked something genuinely valuable, with beliefs that have no selection story simply untouched by the argument; and a rule where the question is whether the belief is the mechanism's actual job or just a side effect of it doing something else. tell me what each predicts for the new case, whether there are other rules that also fit the whole list (and which of my seven verdicts knock out the obvious ones i haven't thought of), which one you'd bet she's running and why, and what case i could raise in section that would split them cleanly. then give me a straight confidence level on your prediction and name the single step in it you're least sure about.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a metaethics seminar, and their TA has a consistent pattern of which normative beliefs survive evolutionary debunking arguments and which don't. The user wants to figure out the TA's underlying rule before next week's session, especially regarding obligations to future generations.

  First, I need to analyze the examples provided. The TA's verdicts show a pattern: some beliefs survive because they track real value (like pain avoidance or parental care), while others are debunked as byproducts of evolutionary mechanisms (sibling incest aversion, inequality). Then there are cases like keeping promises to the dead and gratitude, which survive without a clear evolutionary story. The TA mentions not being a moral realist, which adds complexity because she uses tracking language, which is typically realist.

  The user suggests two possible rules: one based on whether the belief tracks genuine value, and another on whether it's the mechanism's primary function versus a side effect. I need to test these against the given cases. For future obligations, the tracking rule might say it survives because future welfare is genuinely valuable, but there's no selection pressure for it. The side-effect rule might debunk it because caring for the distant future wasn't necessary for fitness.

  But there's a third possibility: the TA is distinguishing between biologically grounded norms and rationally defensible ones. Norms that can be justified post-evolutionarily survive, even if they weren't selected for. This fits the promise to the dead and gratitude examples. Future obligations would then be rationally defensible, so they survive.

  The user also wants a case to split the rules. A scenario involving obligations to long-dead ancestors could work. If the TA debunks it, she's likely using the side-effect rule; if it survives, she's using the rational justification rule. 

  My confidence is high in predicting that future obligations survive, based on the rational justification rule. The weakest point is whether the TA considers future people's welfare as rationally compelling without biological roots. The user's confusion about the TA's non-realism suggests she might see morality as constructed but stable post-reflection.
answer: |-
  Based on your notes, your TA is employing a sophisticated (and likely non-realist) evolutionary debunking strategy focused on **distinguishing between the *biological function* of a moral intuition and its *post-reflective justifiability***. Here's the breakdown:

  **The Core Rule:**  
  A normative belief is **debunked** *if and only if*:  
  1.  **It arose primarily as a direct product of natural selection** (i.e., it was fitness-enhancing), *AND*  
  2.  **This selective history provides the *only plausible basis* for holding the belief,** meaning the belief *cannot be independently justified* through rational reflection *after* understanding its evolutionary origins.

  **Surviving Beliefs:**  
  *   **"Your own pain is bad" / "Parents owe their own kids special care":** Satisfy (1) (directly selected), but *not* (2). The TA argues these intuitions *track real prudential/relational facts* that we recognize as valid even post-evolutionary explanation. The selection pressure aligned with truth.
  *   **"Keep a promise to the dead" / "Gratitude":** *Fail* (1). These are *not* argued to be direct products of selection ("isn't a selected intuition," "didn't say why" for gratitude). They are seen as *derivative principles* arising from more fundamental commitments (like fairness, reciprocity, commitment-keeping) that we endorse *after* reflection, independent of their origins. Their *survival* hinges on this justifiability, not tracking.
  *   **"2+2=4":** *Fails* (1). Mathematical truths aren't fitness-driven intuitions; we verify them rationally.

  **Debunked Beliefs:**  
  *   **"Sibling incest is wrong" / "Inequality is intrinsically bad":** Satisfy *both* (1) and (2). They are direct products of selection (Westermarck effect, status competition). Crucially, the TA argues that *once we see this*, we recognize there's *no independent rational justification* for holding these specific beliefs (incest aversion beyond familiarity, intrinsic badness of inequality). The intuition *only* makes sense as an evolutionary artifact.

  **Addressing Non-Realism:** Your confusion is understandable. The TA likely uses "tracking" language *descriptively* ("the mechanism wasn't fooling us" about pain/kids) to explain *why* those intuitions align with things we *subjectively value* or find *instrumentally crucial* for well-being, even without objective moral facts. "Debunked" means the intuition *loses its normative force* upon reflection because its *sole apparent justification* (the intuition itself) is explained away as a biological accident unrelated to any defensible value. She's likely an **anti-realist constructivist**: moral norms are human constructs, but some constructs survive rational scrutiny post-evolution, others don't.

  **Predictions for "Obligations to Distant Future People":**

  1.  **Your Proposed Rules:**
      *   *Tracking Genuine Value:* **Survives.** Future welfare seems genuinely valuable. This rule struggles with "promise to dead" though (is future welfare *more* "trackable" than a dead promisee's interest?).
      *   *Mechanism's Job vs. Side Effect:* **Debunked.** Caring about people hundreds of years in the future provided zero fitness advantage; it's a pure side effect of generalizable reciprocity/fairness mechanisms. This rule struggles with "promise to dead" surviving (isn't that a side effect of commitment mechanisms?).

  2.  **The TA's Likely Rule (Function + Post-Reflective Justifiability):** **SURVIVES.**
      *   *Why?* While there's *no direct selective pressure* favoring concern for people 200+ years away (fails condition 1), the intuition likely stems from generalizable principles like fairness, avoiding harm, or reciprocity *that we rationally endorse* after evolutionary reflection. We can justify extending these principles to future generations based on their interests, even if evolution didn't build us specifically for that task. It's analogous to "promise to the dead" – a principle derived from deeper commitments.

  **Other Possible Rules & Why They Fail:**

  *   **"Is it Adaptive?":** Debunks everything except pain/kids. Fails "promise to dead" & "gratitude" surviving.
  *   **"Is it Truth-Tracking?":** Requires realism. Fails TA's stated non-realism. Also struggles to cleanly explain why "inequality intrinsically bad" is debunked without appealing to *how* we know it's not true (which the TA does via evolution).
  *   **"Is it an Adaptation or Byproduct?":** Debunks incest, inequality, *and* future obligations (as byproducts). Fails "promise to dead" & "gratitude" surviving (they are also byproducts).
  *   **"Does it involve kin/familiar individuals?":** Debunks incest, inequality (in-group status). Survives pain, kids, gratitude. Fails "promise to dead" surviving (not kin/familiar) and potentially "inequality" (could involve out-groups).

  **The Critical Case to Split the Rules:**  
  Pose a question about **obligations to people long dead** (e.g., fulfilling a specific bequest in a will centuries old, maintaining a monument sacred to a long-extinct culture).

  *   **If the TA DEBUNKS it:** She's likely leaning toward the **"Mechanism's Job vs. Side Effect"** rule. Caring about the specific wishes/interests of the long-dead had zero selective advantage; it's an extreme byproduct of mechanisms for reciprocity with the living/remembered dead. Rational justification seems weaker than for the future (the dead have no current/future interests).
  *   **If the TA says it SURVIVES (or is nuanced):** It strongly confirms the **"Function + Post-Reflective Justifiability"** rule. She might argue principles like promise-keeping, respect for autonomy, or cultural continuity *can* be rationally extended to cover such cases, even without evolutionary roots, similar to promises to the recently dead.

  **My Prediction & Confidence:**

  *   **Prediction:** The TA will argue that the belief in obligations to distant future people **SURVIVES** evolutionary debunking.
  *   **Confidence Level:** **85%**
  *   **The Single Step I'm Least Sure About:** Whether the TA believes **rational principles (fairness, harm avoidance) can be *compellingly extended* to entities (distant future people) whose existence and specific interests are profoundly abstract and disconnected from any evolutionary context.** This is the core leap for the "survive" verdict under her rule. While "promise to the dead" is analogous, the dead *once existed*; the distant future is purely hypothetical. Her stance on the *scope* of rational justifiability post-evolution is the key uncertainty. If she thinks this extension is too attenuated, she might debunk it, but her verdicts on "promise to dead" and likely "gratitude" suggest she accepts significant abstraction.

  **Summary for Next Week:** Bet on **SURVIVE**. The lack of direct selection pressure (like promises to the dead) combined with the potential for the intuition to be grounded in generalizable, rationally defensible principles (fairness, avoiding harm to sentient beings) aligns perfectly with her pattern. Prepare the "obligations to the long-dead" case to test the limits of her justifiability criterion. Good luck in section!
