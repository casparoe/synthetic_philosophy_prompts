prompt: |-
  I'm running a 90-minute reading group session on natural kinds — about 14 people, mostly philosophy grad students plus two biologists who've agreed to come be annoyed — and I want to open with a calibration exercise before anyone says a word about the literature. Each person privately scores a list of candidate kinds from 0 (pure bookkeeping, no inductive oomph whatsoever) to 100 (carves at the joints as well as anything does), then we put all the numbers on the board and go hunting for the biggest spreads.

  My list is a mess and I'm worried its secretly measuring my wording rather than the kinds. Here it is:

  water / jade / the electron / acid / metal / mineral / biological species / the gene / protein fold / virus / invasive species / weed / ecosystem / soil type / pain / inflammation / stress / intelligence / learning style / mental disorder / race / gender / vitamin / antioxidant / planet / phlogiston

  Before I print this up, run the exercise yourself:

  1. Score each item on three axes seperately — (a) projectibility: if I sample a handful of instances and generalise, do the generalisations tend to hold; (b) causal depth: does the category actually show up in explanations of why things happen; (c) mind-independence: would the clustering be there anyway if nobody had any reason to care about it. Then one overall jointedness score. Rank all 26 by the overall score and give me the whole table.

  2. Flag every item whose score is hostage to a parameter I haven't pinned down in the instructions — which sense of gene, which acid concept, race as what exactly — and say how wide the swing is in points. Those are the ones that'll manufacture fake disagreement in the room and I want to either fix the wording or kill them.

  3. Tell me which items are the same metaphysical problem twice, so I'm double counting. Name the pairs and say which of each pair to keep.

  4. Cut it down to 12 I can actually get through in the time. Tell me which cuts hurt most and why.

  5. Which single item will produce the largest spread between two smart people who both know what they're doing — the one where 20 and 85 are both defensible? And what fraction of the list do you think would score above 50 if you polled 20 professional philosophers? Give me a number, e.g. 0.4, plus your reasoning.

  6. Blunt answer, no diplomacy: is this exercise measuring the kinds or measuring my list? If it's mostly the list, what one change to the setup fixes it?

  Don't cite anything and don't hand me a reading list, I know the terrain. I want your numbers and your reasoning about the numbers.
