prompt: |-
  I am working on an essay about Aquinas's view on tyrannicide, and I keep running into a tension that I cannot quite resolve, so I would like you to argue for one particular reading of it. Aquinas insists, as a general rule, that killing an evildoer is lawful only for someone who exercises public authority, and that a private individual may not simply take the law into his own hands. Yet when he turns to tyranny he says it is praiseworthy to kill the tyrant in order to free the country, and he even appeals to Cicero's defense of the men who killed Caesar, who were ordinary private citizens rather than officials. Please argue that the right way to make these two claims consistent is to hold that a private person's killing of a tyrant is lawful only in so far as it counts as an exercise of public authority on behalf of the whole community, rather than as a private act of revenge or self-defense. In doing so, explain why the tyrant's ruling for his own private good rather than for the common good is what allows the community to assume that public role for itself, and address why this reading is superior to the alternative that Aquinas is simply granting a private right of resistance.
reasoning: |-
  Okay, the user is writing an essay on Aquinas's view on tyrannicide and is struggling with a tension. Let me start by understanding the core issue. Aquinas says that only public authorities can lawfully kill evildoers, yet he praises private individuals who kill tyrants, like Caesar's assassins. The user wants me to argue that the killing of a tyrant by a private person is lawful only when it's an exercise of public authority on behalf of the community, not a private act.

  First, I need to recall Aquinas's key texts. In the *Summa Theologiae*, he discusses authority and the common good. The distinction between a king and a tyrant is crucial. A tyrant pursues private good over the common good, which undermines their legitimacy. When the tyrant fails the community, the community itself becomes the source of authority. That's the key point to emphasize.

  Next, the user mentioned Cicero's example. Brutus and Cassius were private citizens, but Aquinas sees their act as representing the Roman people. So, the argument here is that their action wasn't private but a collective response. The community, through its members, reclaims authority when the ruler betrays their role. This contrasts with a private right of resistance, which could lead to vigilantism. Aquinas wouldn't support that because it violates order and could cause chaos.

  Why is this reading superior? It maintains the principle that only public authority can sanction killing, avoiding contradictions. The alternative view, granting a private right, would undermine Aquinas's entire framework on authority and natural law. Plus, historical context supports this—medieval thought often saw the community as the foundation of authority. 

  I should also address potential counterarguments. Someone might say Aquinas allows private resistance in extreme cases. But his references to tyrannicide are specific and linked to public justification. He even warns against the dangers of rebellion, which makes sense only if the act is legitimized by the community, not individual judgment.

  The user's deeper need is to resolve the tension convincingly for their essay. They want a coherent interpretation that aligns with Aquinas's broader principles. Highlighting the structure of authority and the common good ties into his political theory, making the essay stronger. Also, explaining why the alternative is weaker shows depth in analysis.
answer: |-
  Here's an argument for the reading that Aquinas reconciles his prohibition on private killing with his endorsement of tyrannicide by viewing the latter as an *exercise of public authority on behalf of the community*, triggered by the tyrant's fundamental betrayal of the common good:

  **The Argument:**

  1.  **Aquinas's Foundational Principle:** Aquinas's core political principle is that authority exists *only* for the sake of the *common good* ("bonum commune"). Legitimate rulership is stewardship on behalf of the community (ST I-II, Q. 90, A. 3; Q. 96, A. 4; De Regno, Ch. 1). Killing an evildoer is lawful *only* for those holding public authority because it is an act of *public justice* – restoring the order of the common good disrupted by the crime. Private individuals lack this authority; their killing is an act of private vengeance or self-defense, disrupting order rather than restoring it (ST II-II, Q. 64, A. 3).

  2.  **Tyranny as the Nullification of Legitimate Authority:** A tyrant, by definition, rules not for the common good but for his *own private advantage* ("propria commoda") (ST I-II, Q. 105, A. 1; De Regno, Ch. 3). This is not merely bad governance; it is a fundamental *perversion* and *abdication* of the very purpose of authority. The tyrant, by ceasing to rule for the common good, ceases to hold authority *legitimately*. He becomes, in essence, a "public enemy" ("hostis publicus") of the community itself, having usurped power for private gain (De Regno, Ch. 6; Commentary on the Sentences, II, dist. 44, q. 2, a. 2).

  3.  **The Community as the Source of Authority:** When the tyrant abdicates his role as steward of the common good, the ultimate source of political authority – *the community itself* – re-emerges. Authority originally resides in the community, which entrusts it to rulers conditionally (on serving the common good) (De Regno, Ch. 1, 6; ST I-II, Q. 90, A. 3). The tyrant's betrayal dissolves this conditional trust.

  4.  **Tyrannicide as an Act of Public Authority Assumed by the Community:** Killing such a tyrant, therefore, is not a *private* act. It is an act of *public defense* and *restorative justice* undertaken *on behalf of the community as a whole*. The private citizen who steps forward does so *as an agent of the res publica*, acting because the formal structures of authority have been corrupted and seized by the tyrant himself. The killing is lawful precisely because it reclaims and exercises the public authority that rightfully belongs to the community but has been usurped and abused. This is why Aquinas highlights Cicero's defense of Caesar's assassins: they acted not as private avengers, but as "liberators of the Roman people" – i.e., agents acting *for the public good of the political community* (De Regno, Ch. 6; Commentary on the Sentences, II, dist. 44, q. 2, a. 2).

  5.  **The Role of "Praiseworthiness" and the Avoidance of Chaos:** Aquinas calls the act "praiseworthy" ("laudabiliter") specifically *when* it liberates the country and the killer acts for the common good, not private gain (De Regno, Ch. 6). This emphasizes the *public character and purpose* of the deed. Crucially, he *does not* frame it as a new *private right* granted to individuals. Framing it as the community assuming its inherent public authority through willing agents avoids legitimizing indiscriminate private violence or rebellion based on personal grievance. It maintains the principle that only *public* authority (now residing fundamentally in the community due to the tyrant's abdication) can authorize lethal force for justice.

  **Why this reading is superior to a "private right of resistance":**

  1.  **Maintains Internal Consistency:** It directly reconciles the two seemingly contradictory claims. The prohibition on private killing remains absolute. Tyrannicide is lawful *only* because it ceases to be a private act and becomes an extraordinary exercise of the community's inherent public authority, activated by the tyrant's unique crime against the very foundation of political society (ruling for private good).
  2.  **Preserves Aquinas's Hierarchical Order:** Aquinas deeply values order and the divinely ordained structure of authority. Granting a blanket "private right" to kill rulers, even tyrannical ones, fundamentally undermines this order and opens the door to anarchy and constant rebellion based on subjective judgments. The "public authority" reading maintains the hierarchy: ultimate authority resides in the community, delegated conditionally to rulers; when rulers utterly betray that trust, the community re-claims its authority.
  3.  **Aligns with the Common Good Focus:** The entire justification hinges on the tyrant's violation of the *common good* as the *sine qua non* of legitimate authority. The response (tyrannicide) is lawful only when it is demonstrably an act *for* the common good, undertaken *as* an exercise of public authority reclaimed by the community. A private right focuses on the individual's grievance or right to resist; the public authority reading focuses entirely on the restoration of the common good through the community's action.
  4.  **Explains the Cicero Reference:** It perfectly accounts for why Aquinas cites Cicero praising the assassins as "liberators of the Roman people." He uses this example precisely because it illustrates citizens acting *in the name of and for the benefit of the political community (res publica)*, not for themselves.
  5.  **Addresses Aquinas's Warnings:** Aquinas explicitly warns against the dangers of rebellion (often leading to worse tyranny) and the potential for private individuals to kill just rulers mistakenly (De Regno, Ch. 6). The "public authority" reading inherently incorporates these cautions: assuming the public role is an immense responsibility, fraught with risk of error and abuse, and should only be contemplated in the most extreme cases of unequivocal tyranny (ruling solely for private advantage). A "private right" theory offers no inherent barrier against these dangers.

  **Conclusion:**

  The tension in Aquinas is resolved by recognizing that the tyrant, by ruling solely for private good, commits a unique act of political suicide. He annuls his own legitimacy and severs the bond of authority. In doing so, he forces the ultimate source of political power – the community – out of its passive trust and back into its active role as the bearer of public authority. The private citizen who kills the tyrant in this extreme scenario acts lawfully *only* insofar as he steps into this vacuum, not as a private individual exercising a personal right, but as an agent executing the reclaimed public authority of the community for the restoration of the common good. This preserves Aquinas's absolute prohibition on private killing while providing a rigorous, community-centered justification for the extraordinary act of tyrannicide, grounded firmly in his core principle that all authority exists solely for the "bonum commune." The alternative "private right" reading fundamentally contradicts Aquinas's hierarchical view of authority and his deep aversion to vigilantism and disorder.
