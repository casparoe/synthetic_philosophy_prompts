    So we have a rule that passes Q1 and Q2 but fails Q3 (we don't accept the independence axiom because we see that in this example, the social preference between the two lotteries is not indifferent).

    Now, we run the procedure:

        Q1: Yes (vNM utilities).
        Q2: Yes (the rule satisfies strong Pareto because it is strictly increasing in each utility).
        Q3: We see that the rule violates the independence axiom. So we must decide: do we accept the independence axiom? If we do, then we must reject this rule. If we don't, then we can use it.

        But note: the procedure says that if we reject the independence axiom, then we hand off to a value judgment. So we have to decide: is the violation we found acceptable? Or do we have other reasons to reject independence? This is a judgment call.

    We might decide that we are okay with the violation because we want to give more weight to the worse off (in this rule, by using the square root we are concave, so we are prioritizing increases in utility for those with lower utility). So we might say: we reject the independence axiom and we choose this rule.

    But note: the project lead might not want to hear this. They might prefer the simplicity of the sum. However, the procedure leads us to a non-sum rule because we have rejected one of the axioms (independence) that forces the sum.

    Outcome: We sign off on the non-sum rule (if we accept the value judgment that we don't require independence) or we go back to the drawing board.

  Important note: Harsanyi's theorem is a mathematical theorem, but its application to real-world aggregation is contested. The main controversies are:

  1. The assumption that individual preferences are vNM: in reality, people might not have preferences that satisfy the independence axiom.
  2. The requirement that social preferences satisfy the independence axiom: some argue that society should be averse to inequality in the distribution of utility, which might require violating independence (as in the prioritarian example above).
  3. The weights: the theorem does not specify the weights, and without additional ethical principles (like anonymity) we have no reason to choose equal weights.

  So we must be clear: Harsanyi's theorem does not force utilitarianism (equal-weighted sum) unless we add the value judgment of anonymity. And even then, we must accept the independence axiom.

  Our procedure is designed to make these points of contention explicit and to force value judgments where the theory does not dictate a unique answer.
answer: |-
  ### Decision Procedure for Evaluating Aggregation Rules

  **Objective**: Systematically evaluate proposed aggregation rules for stakeholder preferences, using Harsanyi's theorem as a starting point while explicitly identifying value judgments. The procedure is designed for **3 people in one afternoon**, with no social choice expertise. Steps are honest about "judgment calls" masked as procedure.

  ---

  #### Procedure: Key Questions & Exit Conditions
  1. **Do all stakeholders have cardinal, vNM-consistent preferences?**  
     - **Check**: Verify preferences are complete, transitive, continuous, and satisfy the independence axiom (i.e., representable by expected utility).  
     - **Sufficient answer**:  
       - ✅ **Yes**: Preferences admit unique cardinal utilities (up to affine transformations). Proceed to Q2.  
       - ❌ **No**: Preferences are ordinal, intransitive, or violate independence (e.g., incommensurable values). **Stop and hand off to value judgment**. Harsanyi does not apply.  
     - **Judgment call?** No. This is a factual assessment of preference data.

  2. **Does the aggregation rule satisfy the *Pareto Principle*?**  
     - **Check**: Test two conditions:  
       - *Weak Pareto*: If all stakeholders prefer outcome A to B, the rule must rank A > B.  
       - *Strong Pareto*: If one stakeholder strictly prefers A to B and none prefer B to A, the rule must rank A > B.  
     - **Sufficient answer**:  
       - ✅ **Yes**: Proceed to Q3.  
       - ❌ **No**: **Stop and hand off to value judgment**. Harsanyi requires Pareto, so violating it demands ethical justification.  
     - **Judgment call?** No. Pareto is a testable condition.

  3. **Is the *independence axiom* acceptable for social preferences?**  
     - **Check**: Use a lottery test:  
       - If society is indifferent between A and B, is it indifferent between mixing each with a common lottery C?  
       - *Example*: If stakeholders are indifferent between A and B, does society remain indifferent between (50% A, 50% C) and (50% B, 50% C)?  
     - **Sufficient answer**:  
       - ✅ **Yes**: Proceed to Q4. Harsanyi applies.  
       - ❌ **No**: **Stop and hand off to value judgment**. Harsanyi fails; the rule must be justified ethically.  
     - **Judgment call?** **Yes**. Accepting/rejecting independence is a normative choice about risk and fairness.

  4. **What weights should be assigned to stakeholders?**  
     - **Check**: Harsanyi permits any positive weights, but does not dictate them.  
     - **Sufficient answer**:  
       - If weights are specified (e.g., equal weights), proceed to Q5.  
       - If not, **hand off to value judgment** to assign weights (e.g., based on stakeholder power, vulnerability, etc.).  
     - **Judgment call?** **Yes**. Weight assignment is entirely ethical/political.

  5. **Should the rule satisfy *anonymity* (equal weighting)?**  
     - **Check**: If rule uses unequal weights, does the team accept this?  
     - **Sufficient answer**:  
       - ✅ **Yes (anonymity)**: Set weights equally. Rule is a sum.  
       - ❌ **No (non-anonymous)**: Keep proposed weights. Rule is a weighted sum.  
     - **Judgment call?** **Yes**. Anonymity reflects egalitarian values; rejecting it prioritizes stakeholder asymmetry.

  ---

  ### Case Applications

  #### Case 1: Clean Case (Sum Rule)  
  - **Context**: 3 stakeholders with vNM preferences. Impartiality assumed.  
  - **Procedure**:  
    1. ✅ Q1: Stakeholders have vNM preferences.  
    2. ✅ Q2: Sum rule satisfies Pareto (if all utilities increase, sum increases).  
    3. ✅ Q3: Independence axiom accepted (team agrees social preferences should respect linearity in lotteries).  
    4. ⚖️ Q4: Value judgment → weights default to equal without debate (impartiality).  
    5. ⚖️ Q5: Value judgment → anonymity accepted (equal weights).  
  - **Outcome**: **Sum rule approved**. Harsanyi applies cleanly here.

  #### Case 2: Incommensurable Values (Non-Cardinal)  
  - **Context**: 2 of 3 stakeholders have vNM preferences; 3rd has values (e.g., environmental "sacredness") that resist probabilistic trade-offs.  
  - **Procedure**:  
    1. ❌ Q1: 3rd stakeholder lacks cardinal utility (preferences violate independence axiom).  
  - **Outcome**: **Stop at Q1**. Hand off to value judgment.  
    - **Team’s judgment**: Use a **leximin rule** (prioritize worst-off stakeholder) to respect incommensurable values. *Justification*: Ethical choice to avoid reducing "sacred" values to utils.

  #### Case 3: Non-Sum Rule (Rejecting Independence)  
  - **Context**: 2 stakeholders with vNM utilities. Team proposes **Nash product** (product of utilities) to prioritize equality.  
  - **Procedure**:  
    1. ✅ Q1: vNM preferences confirmed.  
    2. ✅ Q2: Nash product satisfies Pareto (if utilities increase, product increases).  
    3. ❌ Q3: **Independence rejected** (lottery test fails):  
       - Stakeholders indifferent between A=(2,2) and B=(4,1).  
       - Mix with C=(1,4):  
         - Lottery 1: 50% A + 50% C → (1.5, 3.0) → Nash=4.5  
         - Lottery 2: 50% B + 50% C → (2.5, 2.5) → Nash=6.25  
       - Society prefers Lottery 2, violating independence.  
    4. ⚖️ **Hand off to value judgment**: Team defends Nash product to avoid inequality, despite Harsanyi’s requirements.  
  - **Outcome**: **Nash product approved** as a value-driven alternative. Team documents the ethical rationale (equality > linear aggregation).

  ---

  ### Critical Notes on Harsanyi’s Theorem
  - **What’s settled**:  
    - Harsanyi’s theorem is mathematically valid: *If* individuals and society satisfy vNM axioms and Pareto, *then* aggregation is a weighted sum of utilities.  
  - **What’s contested**:  
    - **Not a proof of utilitarianism**:  
      - Weights are arbitrary (utilitarianism requires equal weights + anonymity, which Harsanyi does not mandate).  
      - Real-world preferences often violate vNM axioms (e.g., no cardinal utilities).  
    - **Independence axiom is ethically loaded**: Rejecting it permits equality-focused rules (e.g., Nash, prioritarianism).  
    - **"Forced by rationality" is misleading**: Accepting vNM axioms for society is a value choice, not a logical necessity.  

  **Final Output**: A signed-off aggregation rule with:  
  - A "fact" section (Q1–Q2 results).  
  - A "values" section (Q3–Q5 judgments and rationale).  
  - Explicit flags where Harsanyi does not apply.
