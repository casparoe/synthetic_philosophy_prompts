prompt: |-
  I'm on a small team at an AI lab that has to aggregate different stakeholder preferences into a single objective function for the systems we ship, and right now we justify "sum the utilities" by citing Harsanyi's aggregation theorem, which reviewers keep poking holes in. Write a decision procedure my team can actually run on any proposed aggregation rule before a project lead signs off: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "the theorem doesn't reach this," and where it has to hand off to a value judgment because the question is values rather than facts. Three people, one afternoon, no social choice theorist on staff, and be honest about which steps are judgment calls dressed up as procedure -- I dont buy the "it's forced by rationality" story. Then run it on three cases: a clean one where everyone has well-defined expected-utility preferences and the impartiality condition is plausible; one where a stakeholder group's values are incommensurable with the rest so no cardinal utilities exist; and one where the procedure lands on a non-sum rule and we really dont want to hear it. Also keep separate what's settled among people who work on this from what's genuinely contested -- if the theorem isnt a settled proof of utilitarianism, say so plainly.
reasoning: |-
  We are designing a decision procedure for evaluating an aggregation rule for stakeholder preferences. The procedure must be executable in one afternoon by three people without a social choice theorist. It should be honest about which steps are judgment calls. We'll structure it as a series of questions, with clear criteria for sufficient answers, and note where the theorem (Harsanyi) doesn't reach, or where we must hand off to value judgments.

  Harsanyi's Aggregation Theorem (1955) states that if:
  1. The social preferences and individual preferences satisfy the von Neumann-Morgenstern axioms (completeness, transitivity, continuity, independence).
  2. The social preferences satisfy the Pareto principle (if every individual is indifferent between two alternatives, then so is society; and if at least one individual strictly prefers one alternative and no one prefers the opposite, then society strictly prefers that alternative).
  Then the social welfare function must be a weighted sum of individual utilities (with positive weights).

  However, note that the theorem does not force the weights to be equal. Also, the theorem assumes that individuals have cardinal utilities that are unique up to affine transformations (i.e., they are von Neumann-Morgenstern utilities). The theorem is often cited as a foundation for utilitarianism, but it does not require equal weights. Moreover, the assumptions (especially the independence axiom) are controversial.

  The decision procedure:

  We are given a proposed aggregation rule (e.g., "sum the utilities") and we want to check if we can justify it by Harsanyi or if we need to make adjustments.

  Question 1: Do all stakeholders have preferences that satisfy the von Neumann-Morgenstern axioms? (That is, can we represent each stakeholder's preferences by a cardinal utility function that is unique up to affine transformations?)

  - What to check: For each stakeholder, we need to see if they have well-defined preferences over lotteries (i.e., they can compare any two lotteries and their preferences are transitive, continuous, and satisfy the independence axiom).
  - Sufficient answer: If we have data or a model of each stakeholder's preferences that is consistent with expected utility theory, then yes. If we have only ordinal preferences (or if preferences are incomplete or intransitive) then no.
  - If no: Then Harsanyi's theorem does not apply. We must hand off to a value judgment about how to aggregate (or consider other aggregation methods). We note that without cardinal utilities, we cannot use the theorem to justify a sum. We might have to use an alternative (e.g., Nash bargaining, maximin, or a voting mechanism) and then that alternative must be justified by other means.

  Question 2: Does the proposed aggregation rule satisfy the Pareto principle? (This is a condition of the theorem, but we might also want to check it independently.)

  - What to check: If the rule violates the Pareto principle, then it is not covered by Harsanyi. We must check two parts:
    a) If every stakeholder is indifferent between two options, does the rule yield indifference?
    b) If at least one stakeholder strictly prefers A to B and no stakeholder prefers B to A, does the rule strictly prefer A to B?
  - Sufficient answer: If the rule passes both, then yes. If it fails, then Harsanyi does not apply. We must either adjust the rule to satisfy Pareto or justify why we are violating Pareto (which would be a value judgment).

  Question 3: Are we willing to accept the independence axiom at the social level? (This is the most controversial step.)

  - What to check: The independence axiom in the context of social choice says that if society is indifferent between two alternatives A and B, then for any third alternative C and any probability p, society is indifferent between the lottery [pA, (1-p)C] and [pB, (1-p)C]. This implies that the social utility of a lottery is linear in the probabilities (i.e., expected utility).
  - Sufficient answer: This is a judgment call. We can try to test with thought experiments: if society is indifferent between A and B, then would it be indifferent between a 50-50 lottery of A and C and a 50-50 lottery of B and C? If we think that the social preference might depend on the context (e.g., if A and B are very different in kind and C is similar to one of them) then we might reject independence. But note: Harsanyi requires this for the theorem to hold.
  - If we reject the independence axiom, then Harsanyi's theorem does not apply. We must hand off to a value judgment about the aggregation rule.

  Question 4: If we have passed Questions 1-3, then Harsanyi's theorem tells us that the aggregation rule must be a weighted sum of individual utilities. But it does not specify the weights. How do we choose the weights?

  - What to check: The theorem does not force equal weights. We have to choose positive weights. This is a value judgment. We might choose equal weights (utilitarianism) or different weights (e.g., based on the importance of the stakeholder). This is a handoff to value judgment.

  Question 5: Even if we have a weighted sum, are there any other constraints we want to impose? (This is beyond Harsanyi.)

  - For example, do we want the aggregation to be anonymous (i.e., symmetric in the stakeholders)? If so, then we must set all weights equal. But note: Harsanyi does not require anonymity. Anonymity is a value judgment (that all stakeholders should be treated equally).

  Summary of the procedure:

  1. Check vNM preferences: If no, stop and hand off to value judgment (with note: no cardinal utilities).
  2. Check Pareto: If no, either adjust the rule or hand off to value judgment (with note: violating Pareto).
  3. Check independence axiom for social preferences: If we reject, stop and hand off to value judgment (with note: independence not accepted).
  4. Then we know we must have a weighted sum. Choose weights: value judgment.
  5. If we want anonymity, then set weights equal: value judgment.

  Now, we run the procedure on three cases.

  Case 1: Clean case. Everyone has well-defined expected-utility preferences and impartiality is plausible.

  - Example: We have three stakeholders (A, B, C) with vNM utilities. We want to aggregate by summing utilities with equal weights.

  - Procedure:
    Q1: Yes, each has vNM preferences (by assumption).
    Q2: The sum satisfies Pareto? 
        a) If everyone is indifferent, then the sum of utility differences is zero -> indifferent. 
        b) If one strictly prefers and none oppose, then the sum is strictly higher -> strict preference. So yes.
    Q3: Do we accept independence at the social level? We are in a clean case, so we say yes (judgment call: we are willing to accept it).
    Q4: We choose weights. We choose equal weights (value judgment: because we want impartiality).
    Q5: We want anonymity? Yes, so we set equal weights.

    Outcome: We sign off on the rule: sum of utilities with equal weights.

  Case 2: Incommensurable values. A stakeholder group's values are incommensurable with the rest so that they cannot be represented by a cardinal utility function.

  - Example: Two stakeholders (A and B) have vNM preferences, but stakeholder C has preferences that are not representable by a vNM utility function (e.g., they have preferences that violate the independence axiom, or they have multiple conflicting objectives that cannot be reduced to a single cardinal scale).

  - Procedure:
    Q1: For stakeholders A and B: yes. For C: no. So overall, no. We stop at Q1 and hand off to value judgment.

    Now, what do we do? We cannot use Harsanyi. We might consider:
    - Representing C's preferences in a different way (e.g., as multiple utility functions?).
    - Using a different aggregation method that can handle incommensurability (e.g., a bargaining solution, or a lexicographic rule, or a multi-objective optimization).

    This requires a value judgment about how to trade off the incommensurable values. We might, for example, assign a vector of utilities for C and then use a multi-criteria decision rule. But then we have to aggregate across stakeholders and across criteria. This is complex and must be justified by our team's values.

  Case 3: The procedure lands on a non-sum rule and we really don't want to hear it.

  - How can this happen? It happens if we fail at one of the first three questions. Let's design a case where we fail at Q3.

  - Example: We have two stakeholders (A and B) with vNM utilities. We consider the sum rule. But we don't accept the independence axiom at the social level.

    Why might we reject independence? Consider a case where society is indifferent between two alternatives A and B. But when we mix them with a third alternative C, the social preference might change. For example, suppose:

      A: (0, 10)   [meaning: utility 0 for A and 10 for B]
      B: (10, 0)
      C: (0, 0)

    Society is indifferent between A and B by symmetry (if we use equal weights, then both have social utility 10). Now, consider a lottery that gives A with probability 0.5 and C with 0.5: expected utility (5, 5). And a lottery that gives B with 0.5 and C with 0.5: expected utility (5,5). So the two lotteries are the same. But now change C to (5,5). Then:

      Lottery 1: 0.5 * A + 0.5 * C = (0.5*0 + 0.5*5, 0.5*10+0.5*5) = (2.5, 7.5)
      Lottery 2: 0.5 * B + 0.5 * C = (0.5*10+0.5*5, 0.5*0+0.5*5) = (7.5, 2.5)

    Now, if we have a social welfare function that is not linear (e.g., we care about equality) then we might prefer (5,5) over both (2.5,7.5) and (7.5,2.5). But note: the independence axiom would require that if society is indifferent between A and B, then it must be indifferent between lottery1 and lottery2. However, if we have a social welfare function that is the product of utilities (Nash SWF) then:

      For lottery1: 2.5 * 7.5 = 18.75
      For lottery2: 7.5 * 2.5 = 18.75 -> indifferent.

    But now consider if C were (10,10). Then:

      Lottery1: (0.5*0 + 0.5*10, 0.5*10+0.5*10) = (5, 10) -> product=50
      Lottery2: (0.5*10+0.5*10, 0.5*0+0.5*10) = (10, 5) -> product=50 -> again indifferent.

    However, if we use a social welfare function that is the minimum (Rawlsian), then:

      Lottery1: min(5,10)=5
      Lottery2: min(10,5)=5 -> indifferent.

    So in these examples, we don't see a violation. Let's try a different example.

    Suppose we have:

      A: (1,0)
      B: (0,1)
      C: (0,0)

    Society is indifferent between A and B (by symmetry). Now consider:

      Lottery1: 0.5A + 0.5C = (0.5, 0)
      Lottery2: 0.5B + 0.5C = (0, 0.5)

    If we are using a Rawlsian rule (maximin), then:

      Lottery1: min(0.5,0)=0
      Lottery2: min(0,0.5)=0 -> indifferent.

    But now change C to (0,0.5). Then:

      Lottery1: 0.5A + 0.5C = (0.5, 0.25) -> min=0.25
      Lottery2: 0.5B + 0.5C = (0, 0.5) -> min=0 -> so now society strictly prefers lottery1.

    This violates independence because society was indifferent between A and B, but when mixed with C (which is now (0,0.5)) the lotteries are not indifferent.

    So if we want to use the maximin rule, we must reject the independence axiom.

