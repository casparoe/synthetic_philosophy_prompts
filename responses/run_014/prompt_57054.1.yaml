prompt: |-
  I'm a second-year moral philosophy PhD student working on the ethics of blame, and I've run into a configuration I can't place.

  Someone blames another for a familiar fault — padding an expense report, massaging data — and has never done it, isn't complicit in the doing of it, hasn't benefited from it, and isn't about to do it. So the standard objections don't get a grip: sermon and conduct don't conflict. But the blamer is openly disposed to do exactly the same thing were the odds of getting away with it any better. A professor denouncing data manipulation who says cheerfully that the only reason he never indulged is that his subfield replicates aggressively; a manager who fires someone for expense fraud and tells the team, in the same meeting, that a near-miss early in her career rather than any standing commitment is what keeps her honest.

  Is there an established concept for a standing deficit grounded purely in the blamer's avowed disposition rather than in a deed, an omission, or an inconsistency? Which existing categories come nearest — dispositional accounts of hypocrisy, complicity, the moral-luck objection to blame, bad faith, smugness — and how does this differ from each? And is the intuition I have here tracking a genuine loss of standing, or only an unattractive style of blaming that leaves the address intact? If nothing covers it, I'd rather you said so and proposed a term with boundary conditions than stretched an existing one: I particularly want to know whether disclosure does any work, whether an avowed disposition differs from a merely present one, and whether a blamer who fights the disposition is positioned differently from one who doesn't. I'm not after references — the carving is what I need.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a second-year PhD student in moral philosophy, focusing on the ethics of blame. The scenario they present involves a blamer who condemns someone else for a fault like padding expenses or massaging data, but this blamer openly admits they would do the same thing if they thought they could get away with it. The user is asking if there's an established concept for this kind of deficit in standing to blame, which isn't covered by standard objections like hypocrisy or complicity.

  First, I need to identify the core issue. The blamer hasn't committed the act themselves, nor are they complicit, benefiting, or about to do it. The problem is their avowed disposition—they state they would commit the act under different circumstances. The user wants to know if this disposition alone undermines their moral standing to blame, and how it differs from existing concepts like hypocrisy or moral luck.

  Looking at existing categories, hypocrisy usually requires inconsistency between actions and words. Here, there's no action, just a disposition. Complicity involves involvement in the wrongdoing, which isn't present. Moral luck objections focus on circumstantial luck preventing the blamer from wrongdoing, but the issue here is the blamer's disposition, not luck. Bad faith involves insincerity, but the blamer is openly admitting their disposition. Smugness is an attitude, not necessarily tied to standing.

  The user also has specific sub-questions: Does disclosure matter? Is an avowed disposition different from a hidden one? Does resisting the disposition change anything? They want a precise conceptual carving, not just references.

  I recall T.M. Scanlon's work on moral blame, which ties standing to the relationship between individuals. If the blamer admits they would do the same, it might undermine the reciprocal expectations in that relationship. Similarly, Gary Watson's view on blame as a communicative practice suggests that the blamer's authority comes from their own commitment to the norms they're invoking. If they admit they'd violate those norms given the chance, their authority is compromised.

  The key is the blamer's disposition indicating a lack of genuine endorsement of the norm. By admitting they'd break the rule if they could, they show that their adherence is conditional on external factors (like fear of getting caught), not a moral commitment. This undermines their role as a moral critic because they aren't committed to the norm for its own sake.

  Disclosure plays a crucial role here. If the disposition were hidden, others might still grant standing based on the blamer's apparent integrity. But once avowed, it becomes public knowledge, directly challenging their moral authority. The blamer's honesty about their disposition doesn't redeem them; instead, it highlights their lack of genuine commitment.

  Regarding resisting the disposition: if the blamer acknowledges the disposition but actively fights it, they show a commitment to the norm despite their inclinations. This contrasts with someone who accepts or even boasts about their disposition. The resistor maintains standing because their struggle aligns with upholding the norm, whereas the non-resistor's complacency further undermines their position.

  So, the user's intuition likely tracks a genuine loss of standing, not just an unattractive style. The blamer's credibility as a moral agent is compromised because their blame isn't backed by a sincere commitment to the norm. This is distinct from hypocrisy because there's no past action; it's about the disposition revealing conditional adherence. The proposed term "Dispositional Deficit in Normative Commitment" captures the essence: the blamer fails to meet the agential conditions for blame due to their admitted willingness to violate the norm under different circumstances.

  Need to ensure the boundary conditions are clear. The deficit arises only when the disposition is avowed, making it public. The norm must be one where commitment matters, not just compliance. And the blamer's lack of resistance shows they don't prioritize the norm, weakening their standing further. This should address all the user's sub-questions and provide a solid foundation for their thesis work.
answer: |-
  You've hit upon a fascinating and subtle configuration that sits uneasily within standard accounts of standing to blame. Your intuition is tracking something real – **a distinct loss of moral standing grounded purely in the blamer's *avowed conditional disposition* to violate the very norm they invoke, revealing a lack of genuine normative commitment.** Existing categories come close but don't perfectly capture this specific deficit.

  **Why Standard Categories Don't Fully Capture It:**

  1.  **Hypocrisy (Standard/Dispositional):** Standard hypocrisy requires a *past* or *present* inconsistency between preaching and practice. Dispositional hypocrisy (e.g., Cohen, Fritz & Miller) focuses on a *current* disposition to violate the norm *oneself* (even if never acted upon). The problem here is the *conditional* nature ("would if odds better") and the *avowal*. While dispositional hypocrisy is the closest relative, your case emphasizes the *conditional avowal* as the *source* of the standing deficit, exposing a specific lack of commitment, even if the disposition itself is dispositional hypocrisy.
  2.  **Complicity:** Requires direct or indirect involvement in *this specific* wrongdoing (aiding, benefiting, enabling). Absent here.
  3.  **Moral Luck (Circumstantial):** The objection is that the blamer's blameworthiness is diminished because they easily *could have* committed the wrong under different circumstances. But here, the issue isn't the blamer's *own* potential blameworthiness *for the act*, nor an objection *to the blame itself* based on luck. It's about the blamer's *current standing* to *issue* blame, undermined by their *avowed disposition* and its implications for their *commitment* to the norm.
  4.  **Bad Faith:** Involves self-deception or insincerity about one's *own* motives or beliefs. The blamer in your case is being *disturbingly sincere* about their disposition. They aren't hiding their lack of commitment; they're declaring it.
  5.  **Smugness / Lack of Humility:** These are often *attitudinal flaws* accompanying blame but aren't usually considered *standing deficits* on their own. They make the blame *ugly* but don't necessarily invalidate its normative force or the blamer's right to speak. Your case points to a deeper structural flaw in their normative position.

  **The Core Problem: Dispositional Deficit in Normative Commitment (DDNC)**

  The loss of standing stems from the **avowed conditional disposition revealing the blamer's lack of *genuine endorsement* and *internal commitment* to the norm they are invoking to blame another.** By stating they would violate the norm given better odds, they demonstrate:

  *   Their adherence is purely *contingent* on external deterrents (fear of getting caught), not internalized moral conviction.
  *   They do not hold the norm as a *categorical* imperative binding their own will; it's merely a *hypothetical* imperative contingent on risk assessment.
  *   They fail the "test of sincerity" at the level of *normative commitment*, not just past action.

  This undermines their *authority* to invoke the norm *against others* because:

  *   **Reciprocity Failure (Scanlonian):** Blame involves holding the wrongdoer to a standard governing the relationship. The blamer, by admitting their own commitment is contingent, shows they are not *fully participating* in the reciprocal normative expectations they are demanding of the blamed. They aren't playing by the same "rules of the game" at the level of commitment.
  *   **Communicative Authority Failure (Watsonian):** For blame to function as a moral address, the blamer must speak *from* a position of shared commitment to the norm. By avowing their contingent commitment, they signal they lack the requisite authority – their voice carries no moral weight derived from personal conviction. Their blame becomes an empty performative gesture or mere managerial enforcement, not a moral demand.
  *   **Undermining the Norm's Force:** Their avowal implicitly weakens the norm's perceived importance. If even the blamer admits they'd break it given the chance, why should the blamed take it seriously as a moral demand?

  **Addressing Your Specific Queries:**

  1.  **Genuine Loss of Standing vs. Unattractive Style:** This is **a genuine loss of standing**, not merely style. The blamer lacks the *moral authority* or *credibility* to perform the speech act of blame effectively *as a moral address*. Their utterance may still convey factual disapproval or enforce consequences, but it lacks the distinctive *moral force* and normative weight of genuine blame. The norm they invoke doesn't genuinely bind *them* in the way required to demand it binds *others*.
  2.  **Disclosure's Work:** **Disclosure is essential.** A *merely present* but unavowed conditional disposition *might* constitute dispositional hypocrisy internally, but without avowal, others lack the knowledge to challenge standing based on *this specific deficit*. Avowal makes the lack of commitment public and undeniable, directly undermining the blamer's public normative persona and authority. It's the *declaration* that crystallizes the standing deficit. A hidden disposition might undermine standing *if discovered*, but the avowal *constitutes* the public manifestation of the commitment deficit.
  3.  **Avowed vs. Merely Present Disposition:** As above, the **avowal** is crucial for the *public, performative* loss of standing in the act of blaming. It transforms an internal flaw into a public disqualification for the role of moral critic *in that moment*. The avowed disposition becomes part of the communicative act itself, poisoning it.
  4.  **Fighting the Disposition vs. Not:** **This is critical.** A blamer who *avows* the disposition *but actively fights/resists it* ("I'm constantly tempted when the grants are due, I hate that about myself, I work hard to resist") shows a *conflicted commitment*. They acknowledge the pull of the wrong but *endorse the norm* and strive to align with it. This preserves a significant degree of standing. Their struggle *reinforces* the norm's importance and their commitment to it, even amidst weakness. The blamer who *avows* the disposition *without resistance* ("Yeah, I'd totally do it if I thought I could get away with it, lucky me I can't!") demonstrates *complacency* with their own moral failing. This complete absence of endorsement for the norm they are invoking is what creates the profound standing deficit. The resistance shows the norm *still binds them internally*; the lack of resistance shows it does not.

  **Proposed Term & Boundary Conditions:**

  *   **Term: Dispositional Deficit in Normative Commitment (DDNC)**
  *   **Definition:** A loss of standing to blame arising from the blamer's *avowal* of a *conditional disposition* to violate the very norm they invoke, which *reveals* a lack of genuine internal commitment to that norm, thereby undermining their authority to issue moral demands based upon it.
  *   **Boundary Conditions:**
      *   **Requires Avowal:** The disposition must be explicitly stated or clearly implied *in the relevant context* (e.g., the professor's "cheerful" admission, the manager's anecdote).
      *   **Focuses on Commitment:** The deficit is specifically about the blamer's *relationship to the norm* (lack of sincere endorsement/commitment), not inconsistency of action, complicity, or benefit.
      *   **Conditional Disposition:** The "would do if..." structure is key. It highlights contingency and lack of categorical commitment.
      *   **Norm Relevance:** The norm violated by the blamed person must be the *same norm* whose violation the blamer conditionally avows. The disposition must be directly relevant to the act being blamed.
      *   **Distinct from Weakness:** If the blamer avows the disposition *and expresses resistance/regret* ("I fight this urge constantly"), DDNC is mitigated or absent. The core deficit lies in the *absence of resistance* signifying lack of commitment.
      *   **Not Mere Attitude:** While attitudes like smugness may accompany DDNC, the core deficit is structural – the failure to meet the agential conditions for issuing authoritative moral blame for *this* norm due to lack of commitment.
      *   **Not General Standing:** DDNC applies specifically to blaming for violations of the norm for which the commitment deficit exists. Standing to blame for *other* norms may remain intact.

  **Conclusion:**

  Your intuition is sharp. This configuration exposes a distinct standing deficit – **DDNC** – rooted in the blamer's *avowed conditional disposition* revealing a *lack of genuine normative commitment*. Disclosure is constitutive, an un-resisted disposition is worse than a resisted one, and the loss is one of genuine moral authority, not just unattractive presentation. This deficit highlights how standing to blame requires not just clean hands regarding *acts*, but also a sincere commitment to the *norms* one invokes. It sits at the intersection of dispositional hypocrisy and theories emphasizing the communicative/relational nature of blame (Scanlon, Watson, Macnamara), carving out a unique niche focused on the *conditional avowal* as the act that publicly severs the blamer's connection to the normative authority they attempt to wield. This is fertile ground for your work on the ethics of blame.
