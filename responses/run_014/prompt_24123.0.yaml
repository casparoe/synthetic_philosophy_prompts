  Crucially, the user wants the messy reality - where researchers actually disagree - not sanitized summaries. I'll highlight zones where robust-ML and alignment communities diverge silently, like whether "adversarial" implies active malice or just hard examples. And emphasize that for existential risks, average-case metrics may be meaningless - which is why the camps can't convince each other. They're not even afraid of the same failures.
answer: |-
  Here's a diagnosis based on observed arguments, research practices, and fault lines in robust ML and alignment communities. I'll break down the core disagreements, separate settled points from contested ones, and identify why progress stalls.

  ---

  ### **Settled Ground (Where Consensus Exists)**
  1.  **Adversarial Training (AT) improves robustness *within* bounded threat models:** Against norm-bounded perturbations (e.g., Lp-bounded pixel changes), AT demonstrably improves empirical robustness on held-out adversarial examples *of the same type*. No serious researcher denies this specific, narrow result.
  2.  **Standard ERM maximizes average performance:** On IID test sets, maximizing average loss (ERM) remains the gold standard for clean accuracy. Trying to bake robustness into the objective *usually* incurs a clean accuracy penalty ("robustness-accuracy trade-off").
  3.  **Formal worst-case guarantees are often loose/pessimistic:** Minimax objectives under broad uncertainty sets frequently yield vacuous bounds or degenerate solutions (do-nothing policies) in practice. Neither camp expects tight, practical, *general* worst-case guarantees soon.
  4.  **No single technique solves all robustness problems:** Both camps acknowledge that techniques like monitoring, anomaly detection, fallbacks, and formal verification are necessary components of a robust system, *alongside* the core training objective.

  ---

  ### **The Core Fault Lines (Where Genuine Disagreement Lies)**
  The stalemate arises not from ignorance of settled points, but from fundamentally different **value judgments, threat models, and standards of evidence**, often obscured by terminology. Here's the breakdown:

  1.  **The "Threat Model" Disagreement (Your Hypothesis is Mostly Correct):**
      *   **Worst-Case Camp:** Focuses on **active, adaptive adversaries** (malicious attackers, scheming AI) and **catastrophic, irrecoverable failures** (alignment failures, safety violations). Their implicit "set" includes *any* input/state an intelligent adversary could produce to cause harm, or any OOD shift that triggers catastrophic behavior. They believe the *tail* defines system safety.
      *   **Average-Case Camp:** Focuses on **stochastic, non-adversarial distribution shifts** (natural variations, covariate shift) and **manageable, recoverable failures** (e.g., misclassification leading to user annoyance). Their implicit "set" is variations plausibly drawn from the data-generating process or "nearby" distributions. They see catastrophic tails as rare and manageable via other means.
      *   **Why it stalls:** Arguments use "robustness" or "distribution shift" generically while picturing fundamentally different scenarios. "Worst-case" over *malicious inputs* vs. worst-case over *natural variations* are different optimization problems. Neither side adequately addresses the other's primary fear.

  2.  **The "Standard of Evidence & Guarantee" Disagreement:**
      *   **Worst-Case Camp:** Values **principled defense against plausible harms.** Evidence includes:
          *   *Existence proofs* of failures (e.g., jailbreaks, adversarial examples, specification gaming).
          *   *Formal arguments* showing ERM *cannot* prevent certain failure modes without worst-case components.
          *   *Empirical robustness gains* against strong adaptive attacks (even if bounded) as evidence of *directionally correct* hardening.
          *   Accepts that guarantees are often loose ("better than nothing") and that *some* worst-case thinking is necessary to make progress on tail risks.
      *   **Average-Case Camp:** Values **measurable, practical improvement on realistic tasks.** Evidence includes:
          *   *Empirical performance* on diverse, realistic benchmarks (not just worst-case subsets).
          *   *Deployment success* without catastrophic failures using standard methods + monitoring.
          *   *Cost-benefit analysis:* Does the robustness gain justify the accuracy/complexity cost? They see loose formal guarantees as *worse than useless* (false confidence) and limited-transfer AT as insufficient justification for core objective changes.
      *   **Why it stalls:** One side sees "proof of vulnerability" as sufficient justification for paradigm change; the other demands "proof of practical benefit." They fundamentally disagree on what constitutes valid evidence for system safety/robustness.

  3.  **The "Nature of the Risk" Disagreement (Alignment Specific):**
      *   **Worst-Case Alignment Argument:** ML systems (especially future AGI) exhibit **sharp left tails** – a tiny fraction of failures can cause irreversible catastrophe. Averaging over this is mathematically convenient but ethically/strategically disastrous. You *must* directly optimize the tail. ("Pascal's Mugging" applies).
      *   **Average-Case Alignment Argument:** We lack the knowledge to define or optimize the worst-case tail for AGI reliably. Attempts to do so lead to **pessimism traps** (do-nothing AI) or **false security** (you optimized against *your* imagined worst-case, not the *real* one). Mitigate known risks empirically and build layers of defense.
      *   **Why it stalls:** This is a deep philosophical/value split about risk tolerance and epistemology. Is it better to try and fail to optimize the tail, or to accept tail risk and focus on observable averages? No empirical result easily resolves this.

  4.  **The "Objective vs. Verification" Conflation:**
      *   Arguments often conflate the *training objective* (ERM vs. Minimax) with *verification & monitoring* (how to *assess* safety/robustness). The Average-Case camp often argues: "Use ERM for capability + invest heavily in verification/monitoring to catch tails." The Worst-Case camp argues: "ERM is fundamentally flawed for tail risks; the *core objective* must reflect worst-case considerations, *then* verify." They disagree on where to put the primary focus and resources.

  ---

  ### **What Would Count as Progress?**
  The stalemate won't be broken by a single "knockout" result. Meaningful progress requires forcing specificity and bridging frameworks:

  1.  **Threat Model First:** *Require* explicit threat model definitions *before* arguing objectives. Progress: Papers/frameworks that rigorously define threat models (e.g., "adaptive adversary with compute budget X and goal Y", "natural distribution shift family Z quantified by divergence D") and compare methods *within that model*. This exposes if disagreements are truly about objectives or about the threat.
  2.  **Tight Impossibility Results:** A result showing that under a *specific, plausible threat model* relevant to alignment (e.g., an adversary with access to model gradients and a goal of triggering a harmful output), ERM *provably cannot* achieve robustness above a negligible level without worst-case components *or* that Minimax *provably degenerates* under that model. Needs to be relevant and non-vacuous.
  3.  **Empirical Forcing Function:** An OOD shift or attack that:
      *   Catastrophically fails standard ERM systems *with* state-of-the-art monitoring.
      *   Is robustly handled *only* by a system trained with a well-defined worst-case objective *and* the failure mode is recognized as critical by the average-case camp (e.g., causes significant real-world harm clearly attributable to tail risk averaging).
  4.  **Formal Reconciliation:** A rigorous characterization showing when/why Minimax ERM and Standard ERM objectives (or their solutions) coincide or diverge significantly *under specific distributional assumptions* relevant to practical ML (e.g., spurious features, hidden stratifications). Connects theory to data assumptions.
  5.  **Recognizing the Value Split:** Explicitly acknowledging that for *existential risk* scenarios in alignment, the average-case position might be inherently inadequate *by design* from the worst-case perspective, and vice-versa (the average-case position might see worst-case objectives as intractable and counterproductive). This meta-recognition could shift debates from "who is right?" to "how do we manage this value difference?"

  ---

  ### **Conclusion: Why It's Stalled**
  The debate stalls because it conflates **four distinct disagreements** under the labels "worst-case" and "average-case":
  1.  **Threat Model:** Malicious Adversary vs. Benign Distribution Shift.
  2.  **Standard of Evidence:** Proof of Vulnerability vs. Proof of Practical Benefit.
  3.  **Risk Philosophy:** Optimize the Tail vs. Mitigate the Tail Separately.
  4.  **Focus:** Core Training Objective vs. Verification/Monitoring.

  Progress requires **disentangling these layers** and forcing specificity. Researchers genuinely disagree on the severity and nature of tail risks, the feasibility of worst-case optimization, and the primacy of different types of evidence. Until threat models are pinned down and arguments are made within agreed-upon models of risk and evidence, the circles will continue. The most promising near-term progress lies in **explicit threat modeling** and **domain-specific empirical results** under high-stakes conditions that challenge one camp's core assumptions.
