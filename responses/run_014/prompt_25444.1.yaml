  First, I need to unpack the partner's argument. The core idea here is the non-identity problem from philosophy. It's a logical point: since a different child would exist if they wait, the child born now isn't being compared to a better alternative. That child wouldn't exist otherwise, so they aren't worse off. The partner thinks that since the child would still be glad to exist, it's not harmful to have them now despite a tougher start.

