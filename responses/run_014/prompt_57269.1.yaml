prompt: |-
  A long essay in a general-interest magazine on the history of lying devotes a couple of pages to Augustine, and I would like to know how much of its gloss to trust. The passage runs as follows:

  "For Augustine, a lie is a statement at odds with the facts that is offered as true. What makes it wrong is the injury it inflicts on the person deceived, and so its wrongness comes in degrees proportionate to that injury: a lie that harms nobody is a peccadillo, one that costs a man his reputation is worse, and one that costs a life is the gravest lie there is. This scalar account is what lets Augustine be an absolutist and still look reasonable — he can forbid the lie to the killer at the door precisely because such a lie risks a life, while leaving us free to mislead that killer with a true statement he is likely to misread, or simply to say nothing at all. Consistently with this, he does not count as lies either the remark made in jest, where nobody expects to be believed, or the assertion you sincerely make that happens to turn out false."

  I have never read his two treatises on lying, but two things here strike me as shaky: I had the impression that Augustine located the lie in the gap between what a speaker holds in mind and what he utters rather than in the objective falsity of the utterance, and that the injury he worried about first was the liar's own rather than the victim's. Could you audit the passage claim by claim, separating what a specialist would accept as it stands, what is a defensible simplification, and what reverses or drops something Augustine insists on? In particular: does his ordering of the kinds of lie track harm suffered by the person deceived, and if not, what does it turn on; can he license the deliberately misleading true statement while forbidding the outright false one, given where he puts the lie; and are jest and sincere error set aside for the reason the essay gives? Finally, the essay goes on to conclude that Augustine's absolutism is covertly a harm principle and therefore has nothing distinctive to offer in the case of the murderer at the door. Tell me whether that conclusion follows from Augustine's actual view or only from the summary of it.
reasoning: |-
  Okay, the user has shared a passage from a magazine essay about Augustine's views on lying and wants me to audit it for accuracy. They're particularly concerned about two aspects: whether Augustine located the lie in the speaker's intention rather than objective falsity, and whether he prioritized harm to the liar over harm to the victim.

  Let me break this down systematically. The passage makes several claims about Augustine's position that need verification. First, it defines a lie as "a statement at odds with the facts that is offered as true." But from my knowledge of Augustine's "De Mendacio" and "Contra Mendacium," this isn't quite right. Augustine actually located the essence of lying in the speaker's intention to deceive, not merely in objective falsity. A false statement made without intent to deceive wouldn't be a lie for Augustine.

  Second, the passage claims the wrongness of lies comes from injury to the deceived person and varies proportionally to that injury. This seems problematic. While Augustine did categorize lies by severity, his hierarchy (De Mendacio sections 14-25) was based on both the harm caused and the speaker's intention. More importantly, his fundamental objection was theological - lying violates divine truth and damages the liar's soul. The victim's harm was secondary in his moral calculus.

  Third, the passage suggests Augustine permitted misleading truths while forbidding outright lies. This aligns with Augustine's actual position - he explicitly endorsed Jacob's deceptive but technically true statement in Genesis 27:19. So the magazine gets this right.

  Fourth, the essay claims Augustine excluded jokes and sincere errors from being lies. Correct, but the reasoning matters. Augustine excluded jests because the speaker lacks intent to deceive (De Mendacio 2.2), and sincere errors because there's no intent to deceive. The magazine's explanation ("nobody expects to be believed") is defensible but slightly reductive.

  Finally, the essay concludes that Augustine's absolutism is "covertly a harm principle." This misses the mark. Augustine forbade lying to the murderer at the door not because of potential harm (which he acknowledged could be worse in some cases) but because lying intrinsically violates God's commandment. His position was deontological, not utilitarian.

  The user seems philosophically sophisticated - they've clearly done some homework on Augustine. Their skepticism about the magazine's interpretation shows good critical thinking. I should provide clear distinctions between what's accurate, simplified, and incorrect in the passage, focusing especially on where the magazine misrepresents Augustine's theological framework as harm-based ethics.
answer: |-
  Based on Augustine's *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying), the magazine passage contains a mix of reasonable simplification, significant misrepresentation, and one largely correct point. Here's an audit claim by claim, distinguishing specialist acceptance, defensible simplification, and misrepresentation:

  1.  **Claim:** "For Augustine, a lie is a statement at odds with the facts that is offered as true."
      *   **Specialist Verdict:** **Misrepresents Augustine.** While a lie *involves* falsehood, Augustine's core definition centers entirely on the *speaker's intent and internal state*. A lie, for Augustine, is primarily **"to hold one thing in the heart and utter another with the will to deceive"** (*De Mendacio* 3.3). The *intent to deceive* by expressing something contrary to what one holds in the mind is essential. An objectively false statement uttered *without* that intent to deceive (e.g., sincere error) is *not* a lie for Augustine. Conversely, an objectively *true* statement uttered *with* the intent to deceive *is* a lie for him, though he acknowledges such cases are rare and complex (*De Mendacio* 3.3-4, 4.5).

  2.  **Claim:** "What makes it wrong is the injury it inflicts on the person deceived..."
      *   **Specialist Verdict:** **Significant Misrepresentation/Reversal.** While Augustine acknowledges that lies *can* harm others, this is **not** his primary or foundational reason for condemning lying. His core objection is **theological and anthropological**:
          *   **Violation of Divine Truth/Order:** Lying is a sin against God, the source of all truth (*De Mendacio* 7.10, *Contra Mendacium* 10.24). It disrupts the divine order rooted in truth.
          *   **Damage to the Liar's Soul:** Lying corrupts the liar's soul and damages their relationship with God and truth itself. It is intrinsically evil, a violation of the inner self (*De Mendacio* 7.10, 12.20, 14.25). This internal damage is paramount. Harm to others is a *consequence*, often a grave one, but not the *source* of the sin's wrongness. The passage reverses Augustine's actual priority.

  3.  **Claim:** "...so its wrongness comes in degrees proportionate to that injury: a lie that harms nobody is a peccadillo, one that costs a man his reputation is worse, and one that costs a life is the gravest lie there is."
      *   **Specialist Verdict:** **Defensible Simplification with Important Caveat.** Augustine *does* create a hierarchy of lies based on their consequences (*De Mendacio* 14.25 - 25.42). He lists 8 types, ranging from lies in religious teaching (worst) down to lies that harm no one and even benefit someone (least bad, but *still sinful*). Harm to others is a major factor *within* this hierarchy. However:
          *   **Not Solely Harm:** The hierarchy also considers the *nature of the truth obscured* (lies about God being worst) and the *intention* behind the lie.
          *   **No "Peccadillo":** Crucially, Augustine insists **all** lies are sins (*peccata*), even the "least bad" ones. They are never morally permissible or trivial "peccadilloes." A lie causing no harm is *less gravely* evil than one causing great harm, but it is *still evil* because it violates truth and damages the soul (*De Mendacio* 15.26, 19.40). Minimization of harm doesn't make it acceptable.

  4.  **Claim:** "This scalar account is what lets Augustine be an absolutist and still look reasonable — he can forbid the lie to the killer at the door precisely because such a lie risks a life..."
      *   **Specialist Verdict:** **Partial Misrepresentation.** Augustine *is* an absolutist in forbidding *all* lies. The hierarchy explains *why* some lies are *worse* than others, but **not** why the killer-at-the-door lie is forbidden. He forbids it **because it is a lie**, intrinsically sinful. The fact it risks a life makes it a *gravely* sinful lie within his hierarchy, but the *reason* for the prohibition is the act of lying itself, not the potential harm. His arguments against lying to the killer focus on the inherent evil of lying and the sin committed by the liar, even if done for a good end (*Contra Mendacium* 5.12, 7.16-18).

  5.  **Claim:** "...while leaving us free to mislead that killer with a true statement he is likely to misread, or simply to say nothing at all."
      *   **Specialist Verdict:** **Largely Correct.** This is a key point. Augustine explicitly allows withholding the truth ("be silent altogether") and *possibly* using ambiguous true statements to mislead without lying (*Contra Mendacium* 10.24-26). He cites the biblical example of Jacob deceiving Isaac with technically true statements (Genesis 27:19). He distinguishes between *lying* (intending to express a falsehood) and *concealing the truth* (which can be done licitly, especially to protect life). Misleading with literal truth falls under concealment for him, provided the *literal meaning* of the words spoken is true and the speaker intends *that* meaning, even if expecting it to be misinterpreted. He sees this as avoiding the intrinsic sin of lying.

  6.  **Claim:** "Consistently with this, he does not count as lies either the remark made in jest, where nobody expects to be believed, or the assertion you sincerely make that happens to turn out false."
      *   **Specialist Verdict:** **Correct Conclusion, Slightly Simplified Reason.** Augustine absolutely excludes both:
          *   **Jest:** "When jocose words are uttered... no deception is effected, because the will to deceive is not present" (*De Mendacio* 2.2). The reason is the *lack of intent to deceive*, not *only* that nobody expects to be believed (though that's often the context).
          *   **Sincere Error:** "Not everyone who says a false thing lies... if he believes what he says to be true... he does not lie" (*De Mendacio* 3.3). Again, the core is the *intent*: speaking contrary to one's own *mind* (which holds the falsehood as truth).

  7.  **Essay's Conclusion:** "Augustine's absolutism is covertly a harm principle and therefore has nothing distinctive to offer in the case of the murderer at the door."
      *   **Specialist Verdict:** **Does Not Follow from Augustine's Actual View; Follows Only from the Magazine's Misrepresentation.**
          *   **Why it Doesn't Follow:** Augustine's absolutism is **not** covertly a harm principle. It is an **intrinsic wrong principle** based on the violation of divine truth and damage to the soul. Harm to others is a serious *consequence* that increases the *gravity* of the sin within his hierarchy, but it is *not the source* of the prohibition. For the murderer at the door, he forbids lying *because it is intrinsically sinful*, regardless of the good consequence (saving a life) it might achieve. His distinctive offer is precisely this uncompromising stance: no lie is ever morally permissible, even to save life. One must find other means (silence, misleading truths) that avoid the intrinsic evil.
          *   **Why it Seems to Follow from the Summary:** The magazine summary *reversed* Augustine's priorities, making harm to the victim the *source* of the wrongness and the *reason* for the prohibition against lying to the killer. If that were true (which it isn't), then the conclusion *would* follow – if the wrongness is *only* about harm, then prohibiting a lie that prevents greater harm (murder) seems inconsistent, making the absolutism collapse into a harm principle. But since Augustine's view is fundamentally different, his absolutism *does* offer a distinctive (and highly controversial) position: the absolute primacy of truthfulness as an intrinsic good that cannot be violated, even for the greatest earthly good.

  **Summary of Key Augustine Points vs. Magazine Gloss:**

  | **Augustine's Core Concept** | **Magazine's Representation** | **Accuracy** |
  |------------------------------|--------------------------------|--------------|
  | **Definition of Lie** | Speaker's intent to deceive by expressing contrary to mind | Objective falsity offered as true | ✗ Misrepresents |
  | **Source of Wrongness** | Violation of divine truth; damage to liar's soul | Injury to deceived person | ✗ Reverses priority |
  | **Hierarchy of Lies** | Based on consequences + nature of truth + intent | Based solely on injury to victim | △ Simplified (omits key factors) |
  | **Status of "Harmless" Lies** | Still sinful (peccatum), though least bad | Peccadillo (trivial fault) | ✗ Misrepresents severity |
  | **Killer-at-Door Prohibition** | Forbidden because intrinsically sinful | Forbidden due to risk to life | ✗ Misrepresents rationale |
  | **Misleading Truths** | Permitted as avoiding lie | Permitted | ✓ Correct |
  | **Jest & Sincere Error** | Excluded due to lack of intent | Excluded for stated reason | △ Correct conclusion, simplified rationale |
  | **Absolutism Basis** | Intrinsic wrong principle | Covert harm principle | ✗ Fundamental misrepresentation |

  **Conclusion:** While the magazine correctly identifies Augustine's permission for misleading truths and his exclusions for jest and error, it fundamentally misrepresents his core definition of lying, reverses the primary source of its wrongness (prioritizing victim harm over theological sin and damage to the soul), minimizes the sinfulness of "harmless" lies, and misattributes his reason for forbidding the lie to the killer. Consequently, its conclusion that his absolutism is "covertly a harm principle" only holds if you accept its flawed summary; it utterly fails to capture the distinctive, theologically grounded, intrinsic wrong character of Augustine's actual absolutism against lying. Trust this particular gloss very cautiously; it distorts Augustine's central concerns.
