  Regarding the constraint debate, both sides have merit but miss something fundamental. The colleague is right that all interiority is pure invention since no archive records thoughts. But the user is also right that events would contradict the archive's negative evidence. The real issue is that archives aren't neutral repositories but active enforcers of silence. The disagreement reveals unstated assumptions: the user sees archives as passive collections, while the colleague sees them as capturing observable reality. Actually, archives shape what counts as reality.

  On the concession - relocating the constraint's beneficiary to the reader doesn't save the argument; it undermines it. The whole essay builds the constraint as an ethical response to archival silence, but ending with "it's for reader trust" abandons that premise. Worse, it suggests the ethical framework was performative all along. The sudden pivot to reader psychology feels disconnected from the earlier sophisticated historical analysis.

  The user's strength is in recognizing how archival structures produce silence. But they stumble by trying to separate mind from event - as if thoughts exist in a vacuum. Thoughts arise from material conditions; E. Wilmot's interiority would reflect events like dismissal or pregnancy. By banning events but permitting thoughts, the user might create incoherent characters. And if they can invent thoughts freely, what prevents romanticized or anachronistic portrayals? The constraint doesn't actually protect E. Wilmot; it just moves the appropriation indoors.

