  First, I need to map the case precisely: DSM-5 removing the bereavement exclusion (2013) and DSM-5-TR adding prolonged grief disorder (2022), with pre-existing research infrastructure. The user's "wrinkle" is crucial - they suspect looping might occur through bureaucratic machinery rather than personal identity shifts.

  Hacking's original framework emphasizes feedback between classification and the classified people. But here, the mechanisms seem different: billing codes, diagnostic tools, research protocols. I should distinguish two potential looping mechanisms: Type A (individual self-concept) and Type B (institutional scaffolding).

  The timeline matters. The 9-year gap shows institutional inertia - once the "prolonged grief" research category existed, it built momentum regardless of clinical need. This suggests a bureaucratic feedback loop distinct from lived experience.

  For the framework test, I need to ask: does Hacking's theory require conscious human interaction? His later work on "biologo-looping" hints at institutional effects, but never fully divorces from human agency. This case might expose a gap where classifications evolve purely through administrative feedback.

  The user wants disciplined mapping: relata (diagnostic categories, clinicians, patients, institutions), changes (criteria shifts due to research/billing pressures), timescales (years for institutional adoption). Where Hacking goes silent is precisely on whether systems can "loop" without human subjects reinterpreting themselves.

  I'll conclude that this is both a confirmation (showing classifications aren't static) and an anomaly (revealing non-human feedback loops). It stretches Hacking by proving institutional machinery can autonomously reshape categories - what we might call "zombie looping" where the classified need not even be aware.
answer: |-
  Here’s a disciplined analysis of the grief classification shift through Hacking’s framework, followed by a test of its limits. I’ll map relata, changes, timescales, and mechanisms, then evaluate the framework’s applicability to institutional looping.

  ---

  ### **Hacking’s Framework Applied to the Grief Case**  
  *(Relata: Classifiers [DSM authors, clinicians], Classified [bereaved individuals], Category ["Prolonged Grief Disorder" (PGD)])*  

  1. **Initial Classification Shift (DSM-5, 2013)**  
     - **Change:** Removal of bereavement exclusion for Major Depressive Disorder (MDD).  
     - **Feedback Mechanism:** Clinical research (e.g., studies showing similar neurobiology in grief-related and "spontaneous" depression) influenced classifiers. The *classified* (bereaved) did not drive this change; it was top-down from epistemic authorities.  
     - **Timescale:** Short-term (research-to-revision: ~decade).  
     - **Looping?** Minimal. The category (MDD) expanded, but bereaved individuals’ self-concepts likely did not shift significantly.  

  2. **Introduction of PGD (DSM-5-TR, 2022)**  
     - **Change:** New category for grief exceeding "culturally expected" duration.  
     - **Feedback Mechanism:**  
       - *Institutional*: Screening tools (e.g., PG-13 scale), treatment protocols, and funding incentives solidified the category *before* official adoption.  
       - *Classified*: Limited evidence that bereaved people broadly internalized "PGD" identity pre-adoption. The loop ran via clinicians (applying the label) and institutions (validating tools).  
     - **Timescale:** Medium-term (category "proposal" to inclusion: ~15 years).  
     - **Looping?** Indirect. The category changed due to infrastructural reinforcement (research, billing codes), not primarily through classified people’s self-negotiation.  

  ---

  ### **Testing Hacking’s Framework: Two Looping Mechanisms**  

  | **Mechanism**               | **Hacking’s "Classic" Looping (Type A)** | **Institutional Looping (Type B)** |  
  |-----------------------------|------------------------------------------|-------------------------------------|  
  | **Primary Driver**          | Classified people’s self-understanding   | Classifiers/infrastructure (clinicians, DSM, insurers) |  
  | **Feedback Loop**           | Category → Self-concept → Behavior → Revised category | Category → Research/tools → Professional consensus → Revised category |  
  | **Key Relata**              | Classified individuals                   | Institutions, instruments, epistemic practices |  
  | **Timescale**               | Generational (years-decades)             | Bureaucratic (years)                |  
  | **"Making Up People"**      | Yes (identity formation)                 | No (making up *diagnoses*, not necessarily identities) |  

  **Grief Case as Type B Looping:**  
  - **Infrastructure as Catalyst:** PGD looped via:  
    - **Research programs** (e.g., validating "PGD" scales against *pre-defined* thresholds).  
    - **Economic incentives** (billing codes rewarding diagnosis).  
    - **Professional consensus** (clinicians adopting the category because it was legitimized by tools/DSM).  
  - **Classified Individuals’ Role:** Passive. They became "PGD patients" via clinician application, not self-identification. Bereavement became medicalized without requiring reinterpretation by the grieving.  

  ---

  ### **Evaluation: Confirmation, Anomaly, or Gap?**  
  **1. Confirms Hacking’s Core Insight:**  
     - **Dynamic classifications:** The grief case shows psychiatric categories are mutable and responsive to *some* feedback (here, institutional). Hacking’s core claim—that classifications aren’t static—holds.  

  **2. Reveals a Gap in the Framework:**  
     - **Hacking’s Blind Spot:** He emphasizes *human interaction* with categories (e.g., "making up people"). The grief case shows looping can occur through *non-human actors* (DSM committees, ICD codes, assessment tools).  
     - **Where the Theory Goes Silent:**  
       - Hacking doesn’t theorize how institutional machinery (e.g., billing systems, diagnostic instruments) can autonomously drive looping *without* self-interpretation.  
       - The "classified" here are *objects* of institutional processes, not *participants* in meaning-making.  

  **3. Anomaly for the "Making Up People" Thesis:**  
     - **"Making Up Diagnoses, Not People":** PGD proliferates via clinics and insurers, not because the bereaved see themselves as disordered. The "looping" affects diagnostic rates and research agendas—not necessarily identities.  
     - **Counterexample:** If Type B looping dominates, Hacking’s focus on identity becomes provincial.  

  ---

  ### **Conclusion: A Case the Framework Never Anticipated**  
  - **Verdict:** The grief case is **both a confirmation and a revelation of limits**. It confirms classifications are interactive but exposes a *mechanistic* form of looping Hacking under-theorized.  
  - **Implications for the Framework:**  
    - **Necessary Expansion:** Hacking’s model must accommodate institutional agency (e.g., "biologo-looping" via tools/standards).  
    - **Core Weakness Exposed:** When looping runs through infrastructure, the "classified" may be inert—challenging Hacking’s axiom that looping requires "human kinds" to talk back.  
  - **Theoretical Refinement:** This case suggests a **spectrum of interactivity**:  
    - *Type A (Strong)*: Self-aware looping (e.g., "multiple personality" patients adopting the diagnosis).  
    - *Type B (Weak)*: Institutional looping (e.g., PGD’s path to legitimacy). The grief case is Type B—a phenomenon Hacking’s framework *implies* but never systematizes.  

  **In short: The framework survives but must evolve. The grief episode isn’t an anomaly—it’s proof that looping can be bureaucratically automated, demanding a broader ontology of classificatory agency.**
