  The user's concerns are laser-focused on audience dynamics. They've mapped the room's biases: most are moral realists by default but undefended; some think morality is just post-hoc rationalization (which doesn't automatically help the argument); others see morality as modular systems with separate evolutionary histories. Crucially, everyone dislikes "philosophy-sounding" arguments. 

  What they explicitly want: 
  - A list of probable objections ranked by how much they'd derail the talk 
  - For each: who'd ask it, how they'd phrase it (using their scientific jargon), a concise reply, and where that reply is weak 
  - What to concede upfront to avoid wasting Q&A time 
  - The single most important reply to land for this specific audience 
  - Plus prepping for their "dreaded question" 

  What's underneath: 
  They're not just seeking rebuttals—they need to *translate philosophical arguments into evolutionary biology terms* without losing rigor. The unspoken anxiety is that scientists might dismiss this as "yet another philosopher ignoring empirical work." Their concession strategy reveals they prioritize credibility over winning every point. 

  Key tensions in their position: 
  1. Their argument requires accepting genealogies as epistemic defeaters—a philosophical claim they must sell to scientists who prefer proximate mechanisms. 
  2. They dismiss "morality as post-hoc rationalization" as irrelevant to inertness, but that very psychology is the audience's expertise. 
  3. The modularity objection (different moral systems = different genealogies) could fracture their entire thesis if not addressed. 

  The dreaded question likely involves either: 
  - Their dismissal of post-hoc rationalization (since the room sees that as decisive) 
  - Or whether cultural evolution makes genetic genealogy irrelevant (their note about one modeler's timescale complaint) 

  For concessions: They must preemptively clarify that "inertness isn't psychological uselessness" and "this targets non-naturalism only" to avoid being misread as attacking all morality or ally-shaming the rationalization camp. 

  Make-or-break reply: Demonstrating that third-factor responses *empirically* smuggle in moral facts. Why? Because scientists respect empirical falsifiability, and this exposes philosophy's hand-waving. If they can show third-factor accounts *require* untestable moral causality, even the skeptical moral psychologist might nod.
answer: |-
  Here's your Q&A battle plan, tailored to that room's triggers and avoiding philosophy-land mines. Prioritized by damage potential, with tactical concessions up front.

  ---

  ### **Preemptive Concessions (First 5 Minutes)**
  1. **"This isn't an argument against morality's psychological reality or social utility."**  
     *Why*: Allies who think morality is post-hoc rationalization need to hear this won’t undermine their work.  
  2. **"I’m targeting *non-naturalist* realism only.** Naturalists (e.g., moral facts = well-being facts) have an escape hatch."  
  3. **"This isn’t about proximal mechanisms.** I grant moral psychology is real and evolved. The question is whether *mind-independent moral facts* appear in the genealogy."  
  4. **"Yes, morality is likely pluralistic.** Apply the test to any subsystem (e.g., harm norms), and the argument holds locally."  

  *(This shuts down 50% of predictable objections before they start.)*

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by threat level to your core thesis)*

  1. **Objection (Cultural Evolution Modeler):**  
     *"Gene-centric genealogies are irrelevant. Moral beliefs spread via cultural transmission, not genetics. Delete 'moral facts' from a *cultural* lineage and you lose explanatory power (e.g., norms stabilize cooperation)."*  
     **Reply:** "Cultural transmission explains *content*, not truth-tracking. The inertness test asks: Does removing *mind-independent moral facts* change why *this belief* replicated? If norms spread because they solve coordination problems (not because they're 'true'), moral facts are still inert."  
     **Soft Spot:** If they insist cultural success *requires* tracking moral truth (e.g., "Only true norms persist"), they’re taking horn (a). Push them to state what *empirical evidence* shows this.  

  2. **Objection (Coalition Psychologist / Modularity Advocate):**  
     *"You’re treating 'moral belief' as monolithic. Disgust-based 'morality' vs. fairness norms have different genealogies. Which system’s inertness 'debunks' realism?"*  
     **Reply:** "Pick any subsystem (e.g., reciprocal fairness). Its genealogy involves partner choice, reputation management—zero need for moral facts. If realism claims *any* moral beliefs track non-natural facts, inertness in one module suffices to challenge that."  
     **Soft Spot:** If they argue moral realism only applies to "unified" judgments (rare), concede it’s a smaller target.  

  3. **Objection (Behavioral Ecologist / Adaptationist):**  
     *"This is a just-so story. Where’s the alternative causal model? Show me a competing fitness landscape where we’d have *different* moral beliefs if moral facts differed."*  
     **Reply:** "We don’t need counterfactuals. If the actual genealogy (e.g., selection for cooperation in iterated games) fully explains belief fixation *without* moral facts, inertness holds. Demanding an adaptive link to *truth* is asking *them* to take horn (a)."  
     **Soft Spot:** If they cite sensory perception (e.g., "Vision tracks light, so why not morals?"), note perception’s causal chain *includes* the external stimulus. Moral facts don’t play that role.  

  4. **Objection (Moral Psychologist):**  
     *"Inertness proves nothing. All cognition is 'inert' relative to abstract truths (e.g., math). We don’t doubt 2+2=4 because evolution shaped our number sense."*  
     **Reply:** "Math realism often *relies* on causal efficacy (e.g., numbers in physical laws). For non-natural morals, inertness is damning because there’s *no* causal bridge. Plus, we *do* doubt mathematical beliefs if genealogy explains them without mathematical facts (e.g., ‘sacred’ numbers in rituals)."  
     **Soft Spot:** If they retreat to "Morals are like math—abstract but real," note math’s indispensability to science vs. morality’s explanatory idleness.  

  5. **Objection (Cooperation Researcher):**  
     *"But moral beliefs *do* work—they enhance fitness! Doesn’t that suggest they track *something* real (e.g., cooperative equilibria)?"*  
     **Reply:** "Sure—they track *practical* payoffs, not non-natural facts. Realism requires tracking truths *independent* of utility. Horn (a) again."  
     **Soft Spot:** If they define "moral facts" as fitness outcomes (naturalism), they’ve conceded your point.  

  6. **Objection (Dual-Inheritance Theorist):**  
     *"Your test assumes 'complete genealogy' exists. But gene-culture coevolution is path-dependent and underdetermined. How can you claim 'inertness' without a full model?"*  
     **Reply:** "We have robust partial genealogies (e.g., kin selection → caring norms). Show me *any* segment where inserting a moral fact improves the explanation. If not, assume parsimony."  
     **Soft Spot:** They’re right that incomplete models create wiggle room—but realism still owes a positive case.  

  7. **Objection (Philosopher of Biology):**  
     *"Teleosemantics! Moral beliefs have the function of tracking moral facts, even if the mechanism is fallible (like perception in fog)."*  
     **Reply:** "Then give me the *empirical* basis for that function assignment. If selection pressures were about cooperation, not truth, the function is social—not tracking non-natural properties."  
     **Soft Spot:** If they claim "tracking truth" *is* the function (without evidence), they’re taking horn (a).  

  8. **Objection (Empiricist):**  
     *"WEIRD samples! You assume moral beliefs are universal, but cultural variation undermines genealogical unity."*  
     **Reply:** "Variation *helps* me. If beliefs adapt to local ecologies (e.g., honor vs. guilt cultures), not universal truths, inertness is even clearer."  

  ---

  ### **The Make-or-Break Reply**  
  **You must land this:** When accused of "just-so storytelling," pivot hard to:  
  *"The burden is on the realist to show where moral facts *do* explanatory work. If they can’t point to a single empirical model where inserting 'it’s true' improves the genealogy, inertness stands. Third-factor stories are handwaving without mechanisms."*  
  **Why it matters:** Scientists respect burden-shifting to untestable claims. Forces them to engage *empirically* with horn (a).  

  ---

  ### **The Dreaded Question**  
  **Likely Origin:** Moral Psychologist or Philosopher  
  *"Isn’t this self-defeating? Your argument assumes normative epistemic facts (e.g., ‘inert beliefs are unreliable’). If *all* beliefs have evolutionary genealogies, doesn’t that debunk your own reasoning?"*  

  **Brave Answer:**  
  *"Yes, and that’s a problem for everyone. But note: epistemic norms (e.g., ‘prefer parsimonious explanations’) are vindicated by their instrumental success in science. Moral facts lack even that pragmatic defense. If you’re a consistent skeptic, you should doubt *both*—but that’s a bullet realists won’t bite. My point stands: morality has no comparable anchor."*  

  **Damage Control:**  
  - **If they press:** "This argument is locally skeptical—targeting domains where genealogy and inertness align. Math/logic don’t fit; morality does."  
  - **Concede if cornered:** "Fine, maybe evolutionary debunking is globally corrosive. But then moral realism *still* loses, just alongside everything else."  

  ---

  ### **Summary**  
  **Goal for Success:** Get the room to agree that non-naturalist realism requires *empirically demonstrable* causal work in genealogies—and that no one has shown this. If the cultural evolutionist nods, you’ve won.  
  **Abort Mission If:** They universally reject genealogy as a defeater (unlikely). Concede and reframe as a challenge to provide counter-evidence.  
  **Tone:** Wear your scientist hat. Say "fitness landscape," not "epistemic justification." Say "parsimony," not "Occam’s razor." They’ll forgive philosophy if it smells like biology.
