prompt: |-
  I teach an upper-level seminar on population ethics—fourteen students, one ninety-minute session, mid-semester. We've just covered ordinary deprivational harm and welfare tradeoffs, and I want the next class to make them collide with the nonidentity problem before they've read or heard the label. Design a staged role-play along these lines: a small coastal polity's development council must choose between two policies (say, an intensive-extraction settlement plan versus a slower conservationist one), where the plans differ in timing and settlement patterns enough that different people end up being born a generation later—I'll want you to make that identity-shifting mechanism concrete and internally plausible without it reading as science fiction, and to supply whatever props or cards would let participants actually see that "the people of generation two" are different people under the two policies. The centerpiece should be a tribunal in which generation-two citizens lodge complaints about the world they inherited, with an apparently innocuous standing rule they'll formulate themselves: a complaint goes forward only if the complainant is worse off under the chosen policy than someone would have been under the alternative. I want them to discover, in the tribunal's failure to find a complainant with standing, the gap between "a wrong was done" and "someone was wronged"—and to have to articulate whether they think there is a residue of wrong, and if so whose it is.

  Please give me: the setup and cast, the mechanics of the identity shift (including how to keep students from just denying it), the tribunal procedure, a debrief that maps each moment onto the live philosophical options—person-affecting restraint, impersonal claims about comparative-quality-of-life thresholds, and simply denying the intuition—without lecturing up front; the term "nonidentity problem" should not appear until the debrief. Include the predictable failure modes on a first run (e.g., students relitigating the policy's merits instead of standing, or letting the tribunal declare a victim by fiat) and how I should handle them. Finally, be candid about which part of the problem no in-class activity can reproduce—the comparison between an existence and a nonexistence that contains no subject to make it, for instance—and that I'll have to supply at the board.
reasoning: |-
  We are designing a role-play for an upper-level seminar on population ethics. The goal is to have students confront the nonidentity problem without prior exposure to the term. The setting is a small coastal polity, and the council must choose between two development policies: an intensive-extraction settlement plan (Plan A) and a slower conservationist one (Plan B). The key is that the policies lead to different people being born in the next generation due to differences in timing and settlement patterns.

  ### Setup and Cast
  - **Setting**: The fictional coastal polity of "Seabreeze Haven." It has a small population (about 10,000) and is at a crossroads: it can either rapidly develop its coastal resources (Plan A) or pursue a slower, conservation-focused path (Plan B).
  - **Timeframe**: The role-play spans two generations. The present (Generation 1) is making the decision, and Generation 2 (about 25-30 years later) is the one affected.
  - **Cast** (14 students):
    - **Development Council (5 students)**: They will debate and choose between Plan A and Plan B at the start of the role-play. They represent Generation 1.
    - **Generation 2 Citizens (8 students)**: These are the people born after the policy is implemented. They will be divided into two groups: 
        - 4 students will represent the set of people who exist under Plan A (if the council chooses Plan A) OR the set of people who would have existed under Plan A (if the council chooses Plan B, then these are the "counterfactual" people, but they won't exist).
        - 4 students will represent the set of people who exist under Plan B (if the council chooses Plan B) OR the set of people who would have existed under Plan B (if the council chooses Plan A, then these are the counterfactual ones).
      *Note*: The actual existence of these groups depends on the council's decision. We need a mechanism to assign identities accordingly.
    - **Tribunal Moderator (1 student)**: Runs the tribunal, enforces the standing rule, and records complaints.

  ### Mechanics of the Identity Shift
  We must make the identity shift concrete without science fiction. The mechanism should be based on real-world factors that affect who meets and has children when.

  - **Backstory**:
    - Plan A (Intensive-Extraction): Immediate construction of a deep-water port and industrial zone. This attracts a large, young workforce from outside, leading to rapid population growth and a "boomtown" atmosphere. People settle quickly and have children earlier (on average, 5-10 years sooner than under Plan B). The policy also leads to environmental degradation (e.g., reduced fish stocks, pollution) by Generation 2.
    - Plan B (Conservationist): Gradual development focused on eco-tourism and sustainable fishing. Attracts a smaller, more selective group of settlers who value the environment. Settlement is slower, and people have children later (on average, 10-15 years later than Plan A). The environment is preserved, leading to higher quality of life in the long run.

  - **Identity Shift Mechanism**:
    - We use a **"Life Path Card"** system. Each Generation 2 citizen is defined by the timing and location of their parents' meeting and their birth year.
    - **Step 1: Council Decision** - The council chooses either Plan A or Plan B.
    - **Step 2: Assigning Generation 2 Identities**:
        - Prepare two sets of 8 Life Path Cards (though only 4 per policy group will be used). Each card has:
            - Parental Meeting: Specific location and year (e.g., "Met at the new port construction site in 2025" for Plan A; "Met at the eco-tourism volunteer camp in 2035" for Plan B).
            - Birth Year: (e.g., 2030 for Plan A; 2040 for Plan B).
            - A unique identifier (e.g., "Child of Port Worker" or "Child of Conservationist").
        - After the council chooses a plan, the moderator gives the 8 Generation 2 students the Life Path Cards corresponding to the *chosen* plan. These 8 students now exist and will play the actual Generation 2 citizens.
        - The moderator also holds the Life Path Cards for the *unchosen* plan. These represent the people who would have existed but don't. They are not assigned to any student because they don't exist.

    - **Why it's plausible and hard to deny**: The cards make explicit that under the chosen plan, the actual people are born at a different time and to different parents than they would have been under the alternative. The difference in birth timing (10-15 years) and the specific circumstances of the parents' meeting (which would not occur in the same way under the other plan) make it highly likely that the children are different individuals. This is based on the real-world idea that even small changes in timing and location can lead to different sperm fertilizing the egg (the "butterfly effect" of procreation).

  ### Tribunal Procedure
  - **Context**: It's 30 years later. The council's chosen policy has been implemented, and Generation 2 is now adults. They are holding a tribunal to evaluate whether the council wronged them by choosing one plan over the other.
  - **Standing Rule**: The tribunal moderator announces: "A complaint will be heard only if the complainant can show that they are worse off under the chosen policy than someone would have been under the alternative policy." (Note: The rule is designed to be intuitively plausible but will lead to a problem.)
  - **Steps**:
    1. **Complaints**: Generation 2 citizens (the 8 students) are invited to come forward and state their complaints about the world they inherited. Each must state:
        - What harm they suffer (e.g., under Plan A: pollution-related health issues, overcrowding; under Plan B: lack of economic opportunities, slower infrastructure development).
        - Why they think they are worse off than someone under the alternative.
    2. **Standing Check**: The tribunal moderator applies the standing rule. For a complaint to proceed, the complainant must be worse off than *someone* (anyone) in the alternative scenario.
        - **Crucial point**: The actual complainants (who exist) must compare themselves to the people who *would have existed* under the alternative plan. But those people don't exist! And the actual complainants wouldn't exist under the alternative. Therefore, no one can meet the standing rule.
    3. **Tribunal Outcome**: After all complaints are heard (and presumably rejected for lack of standing), the tribunal must conclude that no one has been wronged.

  ### Predictable Failure Modes and How to Handle Them
  1. **Relitigating the policy choice**: Students might argue about which policy was better overall, ignoring the standing rule.
     - **Handling**: Gently remind them the tribunal is about whether *this generation* was wronged, not about the policy's overall merits. The standing rule is the tribunal's procedure.

  2. **Denying the identity shift**: A student might say, "But I would have been born anyway, just in different circumstances."
     - **Handling**: Refer to the Life Path Cards. Emphasize the specific birth year and parents: "Your card says you were born in 2030 to parents who met at the port. Under Plan B, the port wouldn't have been built then, and your parents would not have met in that way at that time. It's highly unlikely you would exist."

  3. **Creating a victim by fiat**: The tribunal might try to declare that "the people who would have been better off under the alternative" are the victims, even though they don't exist.
     - **Handling**: The standing rule requires a *complainant* (a real person) to be worse off than someone in the alternative. If they try to invent a nonexistent complainant, point out that the tribunal's rules require a living person to bring the complaint.

  4. **Equivocating on the comparison**: A complainant might say, "I am worse off than I would have been under the alternative" (assuming they would have existed).
     - **Handling**: Restate the identity shift: "But under the alternative, you would not exist. So you cannot compare yourself to your own existence in that scenario because there is no 'you' there. You are comparing yourself to a different person."

  ### Debrief
  After the tribunal fails to find a complainant with standing, debrief the class. Map the experience to philosophical concepts without using the term "nonidentity problem" until the end.

  1. **The Gap**: Point out the tribunal found that no one was wronged (because no one met the standing rule), but many felt a wrong was done (e.g., the environment was degraded, or opportunities were lost). Ask: 
     - "If no one was wronged, was a wrong done? If so, to whom or what?"

  2. **Philosophical Options**:
     - **Person-Affecting Restraint**: The idea that an action can only be wrong if it makes someone worse off. If no one is worse off (because the alternative would have resulted in different people), then no wrong was done to any person. But note: This leaves a residue — the feeling that the world is worse off.
     - **Impersonal Claims**: Even if no particular person is wronged, the world might be worse in an impersonal sense (e.g., lower overall welfare, or a violation of some duty to protect the environment). This might be expressed as a threshold: "A world with a quality of life below X is wrong to create, even if the people in it wouldn't exist otherwise."
     - **Denying the Intuition**: Some might argue that if the people who exist have lives worth living, then no wrong was done at all. The feeling of a wrong is mistaken.

  3. **Introduce the Term**: "What you've encountered is known in philosophy as the **nonidentity problem**: the difficulty of attributing a harm to a particular person when the alternative would have resulted in a different person being born."

  ### What the Activity Cannot Reproduce
  - **The comparison between existence and nonexistence**: The tribunal rule compares two sets of people (one existing, one not). But the deepest philosophical issue is comparing existence (with its hardships) to nonexistence (which is not a state of being for the person). The students are comparing two different lives (the actual one and the counterfactual one of a different person). The activity doesn't force them to ask: "Is it better for me to exist with these hardships or not to exist at all?" That is a comparison without a subject and must be addressed separately. You will need to explain this at the board, using examples (e.g., "Is it a harm to be born with a disability if the alternative is not being born at all?").

  ### Props
  - **Life Path Cards**: Two sets (Plan A and Plan B) with distinct details.
  - **Tribunal Rules**: A printed sheet with the standing rule.
  - **Whiteboard**: To record complaints and the tribunal's reasoning.

  This design should create an engaging, discovery-based lesson that sets up the nonidentity problem effectively.
answer: |-
  ### Role-Play Design: "Seabreeze Haven Tribunal"  
  **Objective:** Students discover the gap between collective harm and individualized victimhood, setting up the nonidentity problem through experiential learning.  

  ---

  ### **Setup & Cast** (14 students)  
  - **Setting:** Seabreeze Haven, a coastal polity facing a development crisis (circa 2025). Rising sea levels threaten livelihoods; two policies are proposed.  
  - **Timeframe:** Session split into three acts:  
    1. **Policy Debate** (Gen 1 decision, 15 mins).  
    2. **Tribunal** (Gen 2 complaints, 45 mins).  
    3. **Debrief** (30 mins).  

  #### **Cast:**  
  | Role | # Students | Description |  
  |------|------------|-------------|  
  | **Gen 1: Development Council** | 5 | Must unanimously choose Policy A or B. Represents present-day decision-makers. |  
  | **Gen 2: Citizens** | 8 | Split into two groups *after* policy choice: 4 play *actual* Gen 2 (existing under chosen policy), 4 play *counterfactual* Gen 2 (would exist under unchosen policy). |  
  | **Tribunal Chair** | 1 | Enforces rules, mediates complaints. |  
  | **Facilitator (You)** | — | Silent observer until debrief. Guides mechanics.  

  #### **Policy Options:**  
  - **Policy A (Rapid Extraction):** Build industrial port now. Creates immediate jobs but causes coastal erosion, flooding, and lower air quality by Gen 2’s adulthood (2055).  
  - **Policy B (Gradual Conservation):** Slow eco-tourism development. Fewer jobs now, but pristine environment by 2055. Higher costs delay family formation.  

  **Key Difference:** Policies alter *who settles, when they have children, and where they live*, leading to entirely distinct Gen 2 populations.  

  ---

  ### **Mechanics: Identity Shift**  
  #### **Why Identities Shift (Plausible Mechanism):**  
  - **Real-World Driver:** "Settlement Timing & Migration Patterns."  
    - Policy A: Attracts young migrant workers (18–25) for port jobs. Rapid population growth → couples meet/have kids **5–10 years sooner**.  
    - Policy B: Attracts older, skilled workers (30–40) for eco-tourism. Slower growth → couples meet/have kids **10–15 years later**.  
  - **Consequence:** Different social networks, conception timing, and genetic matches mean **no overlapping individuals in Gen 2**.  

  #### **Tools to Make It Concrete (No Sci-Fi):**  
  - **Life Path Cards:**  
    - Two sets of cards (Policy A and Policy B), each with:  
      - Parental backstory (e.g., "Mother: Migrant welder; Father: Port manager; Met at 2026 worksite").  
      - Birth year (Policy A: 2030–2035; Policy B: 2040–2045).  
      - Unique ID (e.g., "A23: Born to coastal fishers displaced by port").  
    - **How it works:**  
      1. Council chooses Policy A or B.  
      2. Shuffle the chosen set of 8 cards. Distribute 4 randomly to "Actual Gen 2" students—they exist.  
      3. Hold up the *unchosen* set: "These are the people who *would* exist under the other policy—but they never will."  
      4. Give 4 unchosen cards to "Counterfactual Gen 2" students—they role-play hypothetical lives but **cannot speak** (symbolizing nonexistence).  

  - **Preventing Denial of Identity Shift:**  
    - **Card Swap:** Have students trade cards if policies were reversed, showing IDs/birth years don’t match.  
    - **Guiding Qs:** Ask: *"Could *you* (the person holding this card) exist if your parents met 15 years later in a different town?"*  
    - **Visual Timeline:** Project a map/timeline showing non-overlapping birth cohorts.  

  ---

  ### **Tribunal Procedure**  
  **Context:** 30 years later (2055). Actual Gen 2 citizens testify about harms. Counterfactual Gen 2 observes silently.  

  #### **Rules (Displayed on Board):**  
  1. Complainants must argue: *"I am worse off under the chosen policy than SOMEONE would be under the alternative policy."*  
  2. Chair accepts/rejects complaints based *only* on standing (not policy merits).  
  3. If standing is met, council defends its choice.  

  #### **Predicted Complaints (Based on Policies):**  
  - **If Policy A chosen:**  
    - *Actual Gen 2:* "I have asthma from pollution!" / "My home flooded!"  
    - *Counterfactual (silent):* Would have had clean air/stable homes.  
  - **If Policy B chosen:**  
    - *Actual Gen 2:* "I’m unemployed!" / "My family couldn’t afford kids!"  
    - *Counterfactual (silent):* Would have had jobs/economic stability.  

  #### **The Trap:**  
  - No complainant exists in both worlds → Actual Gen 2 cannot compare themselves to *their own* alternative self.  
  - They must compare to a *different* person (the silent counterfactuals), but:  
    - **Standing failure:** Actual Gen 2 aren’t worse off than counterfactuals—they’re *different people* with different lives.  
    - **Chair’s scripted response:** *"Your complaint is about harm, but are YOU worse off than THAT person [point to counterfactual]? They wouldn’t exist under your policy. You’re different people."*  

  ---

  ### **Handling Failure Modes**  
  1. **Relitigating Policy Merits:**  
     - Students debate "Policy A was reckless!" instead of standing.  
     - **Your intervention:** Whisper to Chair: *"Remind them: The tribunal only evaluates standing. Is this person worse off than someone in the alternative world?"*  

  2. **Declaring Victim by Fiat:**  
     - Tribunal says, "Clearly, the counterfactual people are victims!"  
     - **Intervention:** Ask: *"Who is lodging this complaint? The counterfactuals don’t exist. Can the tribunal hear from a ghost?"*  

  3. **Denying Identity Shift:**  
     - "People would adapt! Same kids would be born!"  
     - **Intervention:** Use Life Path Cards: *"Show me how ‘A23’ (born 2030 to port workers) could exist under Policy B (births start 2040)."*  

  4. **Moral Outrage Without Standing:**  
     - "This is unjust! Future generations were harmed!"  
     - **Chair’s reply:** *"But did we wrong *someone*? Point to the person wronged."*  

  ---

  ### **Debrief: Mapping to Philosophy**  
  **(Reveal concepts *after* the tribunal, no upfront lecturing)**  

  1. **The Gap:**  
     - *Q: "The tribunal found no victim with standing. Yet many felt a wrong occurred. Where did the ‘wrong’ go?"*  
     - **Philosophical Mapping:**  
       - **Person-Affecting Restraint:** "If no one is worse off, no wrong was done *to a person*. But does that feel satisfying?" (Link to standing rule).  
       - **Impersonal Thresholds:** "Maybe the wrong isn’t about *who* exists, but *what* exists—a world below some welfare threshold." (E.g., Policy A’s polluted world).  
       - **Denial:** "Perhaps there’s no wrong at all. If lives are worth living, we did fine."  

  2. **The Unreproducible Core:**  
     - *Confess candidly:* "In class, we compared two groups of people. But the hardest part? Comparing *existence* to *nonexistence*. When we say Policy A ‘harmed’ Gen 2, we imply they’d be better off not existing—but there’s no ‘them’ to experience that ‘better off.’ This is the heart of the nonidentity problem."  
     - **Board Work:** Draw a 2x2 grid:  
       |                        | **Policy A (Actual)** | **Policy B (Counterfactual)** |  
       |------------------------|------------------------|-------------------------------|  
       | **Person X**           | Exists (with harms)    | Never exists                  |  
       | **Person Y**           | Never exists           | Exists (better life)          |  
       - *Q: "Can we say Person X is worse off? They only exist in Policy A!"*  

  3. **Reveal the Term:**  
     - End with: "What you faced is called the **nonidentity problem**: How can an act harm future people if it causes them to exist?"  

  ---

  ### **Props**  
  - **Life Path Cards:** Color-coded (blue for A, green for B) with specific IDs.  
  - **Tribunal Rules Poster:** Large print for standing criteria.  
  - **Map/Timeline:** Showing non-overlapping birth cohorts.  
  - **Whiteboard:** For debrief grid.  

  ### **Why This Works**  
  Students *feel* the frustration of the standing rule before labeling the problem. The silent counterfactuals make nonexistence palpable. You’ll expose the core tension: collective judgments vs. individual harm. In the debrief, they’ll articulate solutions—setting up your next lecture on Parfit, impersonal harm, and threshold theories.  

  **Final Tip:** Assign Gen 1 council a time limit (5 mins) to force a policy choice. Chaos here mirrors real-world decisions!
