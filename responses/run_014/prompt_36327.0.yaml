prompt: |-
  I've been going pretty deep on Schopenhauer's line that music is different from the other arts because it doesn't go through ideas or concepts at all — where a poem can only get at, say, grief by way of the particular case, music supposedly hands you grief as such, not this grief or that grief. I'm tired of the standard back-and-forth about whether music is a copy of the Will, and I want to write about what instrumental music expresses on its own terms. So before I argue for anything, I want the spec, not the theories.

  Write me the desiderata: exactly five numbered items, nothing before item 1 and nothing after item 5. Each item is one or two sentences — state the requirement and the case or consideration behind it. Here are candidates I've been toying with; keep, fix, or drop them as you see fit, and fill out the list yourself:

  - the sad-music case — we pay money to hear grief played at us and then voluntarily replay it, which nobody does with, like, a friend's account of their divorce; a theory that gets the expression right shouldn't be predicting we can't enjoy it
  - a persona/symptom distinction — whatever the cello line expresses, it's not the composer's actual feeling as a causal symptom, the way a trembling voice is; theories that blur this confuse expression with cause. this one definately belongs somewhere but fix my wording
  - Schopenhauer's own non-particularity requirement, that music can never be about a particular person or event — I half suspect this is a camp prejudice dressed up as a desideratum, so tell me inside the list whether it earns a spot at all

  Two more things about the list itself. If you think any two of the five are jointly unsatisfiable, flag that in a clause inside the later item rather than saving it for a wrap-up — there shouldn't be a wrap-up. And put an asterisk on the single requirement that does the most work to knock out candidate theories, since that's the part I care most about. Don't score any actual theories against the list, I'll do that myself, and no names of books, papers, or people — just the requirements, stated in plain words.
reasoning: |-
  Okay, the user is deep into Schopenhauer's idea that music expresses emotions directly, unlike other arts. They want to move beyond the standard debates about music as a copy of the Will and focus on what instrumental music expresses on its own terms. They're asking for five numbered desiderata—specific requirements that any theory of musical expression should meet. 

  The user has provided three candidate points they've been considering: the sad-music paradox, the persona/symptom distinction, and Schopenhauer's non-particularity requirement. They want me to refine or drop these as needed and add two more to complete the list. 

  Breaking this down: First, the sad-music case is solid—it highlights the puzzle of why we enjoy painful emotions in music. That definitely stays. Second, the persona/symptom distinction is crucial; the user is right that expression shouldn't be conflated with the composer's biography. I'll tighten the wording to avoid "definately" (typo noted!). Third, Schopenhauer's non-particularity—the user suspects it might be arbitrary. I agree; it's too restrictive. Real music *can* evoke particulars (e.g., funeral marches), so I'll drop it. 

  Now for the two missing items: I need requirements that push theories toward music's unique abstractness. One should address how music expresses without concrete references (like how a minor key suggests sadness without specifying why). Another should emphasize that expression isn't about decoding intentions—listeners grasp emotion directly, like feeling tension in dissonance. 

  The user also wants conflict flags baked into later items if any desiderata clash. The persona distinction might conflict with theories that over-psychologize expression (e.g., "the composer was sad when writing this"), so I'll note that in item 2. And the asterisk? The sad-music paradox (*) is the heavyweight—it instantly disqualifies theories claiming we avoid negative emotions in art. 

  Finally, no theory names or wrap-ups. Just five lean, self-contained items. User’s clearly done their homework; this list will let them stress-test theories ruthlessly.
answer: |-
  Here are the five numbered desiderata for a theory of instrumental musical expression:

  1.  **It must explain the voluntary appeal of negative emotions:** We seek out and derive satisfaction from music expressing grief, anguish, or tension, unlike real-life experiences of those emotions. (Addresses the sad-music case)
  2.  **It must distinguish expressive content from biographical cause:** What the music expresses is not identical to the composer's actual emotional state during creation, nor is it a direct symptom like a tremulous voice; expression is a property of the music itself. (Refines the persona/symptom distinction)
  3.  **It must account for expression without concrete reference:** Music conveys emotional qualities (e.g., yearning, triumph, agitation) without depicting specific objects, events, individuals, or narratives. (Captures the core insight of non-particularity, *while dropping its absolute prohibition*)
  4.  \***It must allow for direct, non-conceptual apprehension:** Listeners grasp the expressed emotion immediately and pre-reflectively, without needing to infer it through ideas, concepts, or linguistic mediation. (Highlights music's unique mode of presentation, key to knocking out cognitive theories)
  5.  **It must accommodate abstract structural expression:** The emotional character arises inherently from the interplay of purely musical elements (e.g., melodic contour, harmonic tension, rhythm, timbre, dynamics) considered abstractly – *though this may conflict with interpretations emphasizing perceived agency (item 2)*. (Focuses on music's own terms)
