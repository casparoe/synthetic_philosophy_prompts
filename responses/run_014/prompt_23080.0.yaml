prompt: |-
  I retired from physics a few years ago and have been spending my evenings on philosophy of science, and I keep returning to the so-called problem of old evidence, which I believed I understood until recently. I was discussing it with a former postdoc of mine, and she assured me that the problem is well understood and that Bayesian epistemology handles it without difficulty, but I am not convinced, and I would value a second opinion.

  The textbook case is the anomalous precession of Mercury's perihelion: it was known and quantified from Le Verrier's time, decades before Einstein, and yet it is routinely cited as one of the strongest pieces of evidence for general relativity. On the standard Bayesian account, confirmation is an increase in credence, so that E confirms H just in case P(H | E) exceeds P(H). But if I had already assigned credence one to the perihelion anomaly, then conditionalizing on it changes nothing, and it cannot raise my credence in general relativity at all. The response I have encountered is to say that my credence in the "evidence" was in fact less than one, because what I possess is not a single fact but a body of many individual observations, and that a genuine update is therefore still possible. That strikes me as a cosmetic fix: I do know the anomaly, and modeling myself as uncertain about it merely to make the inequality come out right looks like changing the subject.

  And there is a deeper difficulty that I keep coming back to. General relativity is, for me, a new hypothesis, so I never assigned it a prior credence in the first place, which means the P(H) on the right-hand side of that inequality was never actually defined. It therefore seems to me that Bayesian confirmation theory simply has no purchase on old evidence, and that the honest move is to concede the point and adopt a non-Bayesian account of confirmation. If I am missing a Bayesian response, I would be grateful if you could name it and explain specifically how it answers both the "cosmetic fix" objection and the ill-defined-prior objection; and if you think I am right that Bayesianism cannot handle the case, I would like to know which non-Bayesian account of confirmation you would recommend.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired physicist diving into philosophy of science, specifically the problem of old evidence in Bayesian confirmation theory. The example they mention is Mercury's perihelion precession as evidence for general relativity. They're skeptical about the standard Bayesian responses they've encountered, calling them "cosmetic fixes," and they raise two main objections: the credence issue with known evidence and the undefined prior for new hypotheses.

  First, I need to recall the core of the problem. If evidence E is already known (credence 1), then P(H|E) = P(H), so no confirmation happens. The user dismisses the idea of lowering credence in E as artificial. Plus, when a new theory like GR is introduced, there's no prior P(H) to update from. So their deeper point is that Bayesianism seems to break down here.

  I remember Garber's approach—treating the logical relationship between H and E as the new evidence. That might address the credence issue. For example, learning that GR entails the precession, even if E is already known. But the user might counter that this shifts the focus from the evidence itself to the entailment. How to defend this against their "cosmetic fix" charge? Emphasize that the learning process involves grasping new logical connections, which is a legitimate update. The user, being a physicist, might appreciate this since understanding GR's derivation of the anomaly was a real cognitive step.

  Then there's the new hypothesis problem. The user's right that assigning a prior to a newly conceived theory is tricky. The counterfactual priors approach suggests imagining a state before knowing E to assign P(H). But this is subjective and messy. Maybe combine it with Garber's idea? So, first set a prior for H ignoring E, then update on both E and the entailment. Still, the subjectivity remains. The user might see this as ad hoc, but perhaps it's the best Bayesian can do.

  The user's identity as a physicist-turned-philosopher matters. They value rigor and might be skeptical of hand-wavy solutions. Their unspoken need could be a desire for a coherent framework that respects scientific practice without forcing artificial probabilities. They might also be seeking validation that their critique is sound, given their postdoc dismissed the issue.

  For non-Bayesian alternatives, I should consider Likelihoodism or Explanationism. Likelihoodism sidesteps priors by comparing P(E|H) across hypotheses. Explanationism values explanatory power, which fits how GR's account of the anomaly was compelling. The user might prefer these as they avoid Bayesian constraints.

  Balancing both sides: Bayesian responses exist but have limitations. The user's objections highlight genuine issues, especially with new theories. Recommending a pluralistic approach might satisfy them—using Bayesian methods where possible but turning to alternatives for cases like old evidence. Acknowledge that while Garber's solution is elegant, it doesn't fully resolve the subjectivity in priors, which might align with their inclination towards non-Bayesian accounts.
answer: |-
  Your critique cuts to the heart of a genuine and persistent challenge in Bayesian epistemology – the Problem of Old Evidence (POE). Your skepticism about "cosmetic fixes" is well-founded, and the deeper issue of priors for novel hypotheses adds significant complexity. While your former postdoc is correct that sophisticated Bayesian responses *exist*, whether they fully resolve the problem to your satisfaction (or objectively) remains a subject of intense philosophical debate. Let's dissect the Bayesian responses to your specific objections and evaluate them:

  1.  **The "Credence 1" Objection & The "Cosmetic Fix":**
      *   **The Problem:** If `E` (anomalous precession) is known with certainty (`P(E) = 1`), then `P(H|E) = P(H)`. Confirmation (`P(H|E) > P(H)`) seems impossible.
      *   **The Standard (and Often Criticized) Response:** "You weren't *really* certain about `E`. Maybe you knew the raw data but weren't certain about the *interpretation* as an anomaly, or weren't certain it couldn't be explained by Newtonian gravity plus some perturbation." You rightly dismiss this as changing the subject or being artificial. For a physicist *after* Le Verrier but *before* Einstein, the precession *was* a well-established, quantified anomaly resisting Newtonian explanation – assigning it less than credence 1 feels forced.

      *   **The Sophisticated Bayesian Response (Garber, Jeffrey, Nickel):** The key insight is that what you learn when GR is proposed is **not `E` itself, but the *logical relationship* `H ⊨ E`** (GR entails the precession). *This* was unknown before Einstein.
          *   **Formalization:** Instead of updating on `E`, you update on the proposition `L`: "`H` entails `E`" (`L = H ⊨ E`). Your prior credence `P(L)` is **not** 1. Before GR, you didn't know *any* theory entailed `E` in a satisfying way. Learning `L` is new information.
          *   **The Update:** Confirmation happens through `P(H | E, L) > P(H | E)`. Crucially, `P(H | E)` is the credence in `H` *given `E`* but *without knowing* that `H` entails `E`. This can be significantly lower than `P(H | E, L)`.
          *   **Answering the "Cosmetic Fix" Objection:** This avoids artificially lowering `P(E)`. You *do* know `E` (`P(E)=1`). The uncertainty lies in the *connection* between the *new* `H` and the *old* `E`. When you grasp GR's derivation of the precession, you learn `L`. This isn't cosmetic; it captures the genuine cognitive step involved in recognizing GR *explains* the known anomaly. The evidence `E` itself isn't the object of uncertainty; the *entailment* `L` is.

  2.  **The "Undefined Prior for Novel Hypotheses" Objection:**
      *   **The Problem:** GR didn't exist for you before Einstein. There was no `P(H)` assigned. So how can you talk about `P(H | E) > P(H)`?
      *   **The Sophisticated Bayesian Response (Counterfactual/Historical Priors):** Bayesians typically argue that confirmation is assessed relative to a **counterfactual prior credence state** – the state you *would* (or *should*) have been in *before learning `E`*.
          *   **Formalization:** Imagine your epistemic state `S-` *just before* Le Verrier established the anomaly `E`. In that state:
              *   You *do* have a prior `P_-(H)` for any hypothesis `H` formulated within the conceptual space available at that time (even if `H` is GR, its conceptual components like curved spacetime were not available – this is a major weakness). More realistically, `P_-(H)` might be defined for the *type* of theory GR represents.
              *   You have a prior `P_-(E)` < 1. The anomaly wasn't conclusively established yet.
          *   **The Comparison:** Confirmation occurs if `P_-(H | E) > P_-(H)`. This counterfactual comparison defines the evidential support `E` provides for `H`, even though *now* you know both `E` and `H`.
          *   **Combining with the First Response:** Often, the counterfactual prior is used to assess the impact of `E` and `L` *together*. Imagine state `S-`:
              *   `P_-(E)` < 1 (anomaly not fully established).
              *   `P_-(L)` = `P_-(H ⊨ E)` is low or undefined (no such theory exists).
              *   After learning `E` (update 1), then learning `H` and `L` (update 2), your credence in `H` is much higher than it was in `S-`.
          *   **Answering the "Undefined Prior" Objection:** This directly confronts the issue. It acknowledges that the prior `P(H)` didn't exist in your *actual* historical state, but argues that the *relevant* prior for assessing confirmation is the counterfactual one (`P_-(H)`) before `E` was known. It grounds the comparison in a state where `E` was genuinely uncertain and `H` could potentially be assigned a prior (even if imprecisely).

  **Evaluation of the Bayesian Responses:**

  1.  **Garber-style (`L = H ⊨ E`) Solution:**
      *   **Strengths:** Elegantly solves the credence 1 problem without artificial uncertainty about `E`. Captures the crucial role of *understanding the derivation*. It's the most widely accepted *type* of solution among Bayesians grappling with POE.
      *   **Weaknesses (Your Concerns Lingering):**
          *   **Defining `L`:** How formally must `L` be understood? Must you grasp the full derivation? Probabilities over logical entailments can be tricky.
          *   **Priors for `L` and `H`:** Assigning `P_-(L)` and especially the counterfactual `P_-(H)` remains problematic and subjective. How do we rationally assign a prior to a hypothesis whose central concepts (like spacetime curvature) didn't exist in the counterfactual state `S-`? This relies heavily on contentious "rational reconstruction."
          *   **Shifting the Problem?** While not cosmetic, one might argue it slightly changes the *object* of confirmation from the empirical fact `E` to the logical fact `L`.

  2.  **Counterfactual Priors Solution:**
      *   **Strengths:** Directly addresses the need for a defined `P(H)`. Grounds the confirmation comparison in the point where `E` was genuinely uncertain. Matches historical narratives of evidence.
      *   **Weaknesses (Your Concerns Lingering):**
          *   **Subjectivity & Rational Reconstruction:** Assigning counterfactual priors is highly subjective and historically contingent. What *should* `P_-(GR)` have been in 1845? This feels artificial and lacks a rigorous objective grounding.
          *   **Defining `S-`:** Where exactly do we draw the line for "before learning `E`"? Le Verrier's work spanned time.
          *   **Novel Concepts:** Assigning priors to hypotheses relying on radically new concepts remains deeply problematic.

  **Conclusion on Bayesianism:**

  Bayesianism *does* offer non-trivial responses (primarily the Garber-type solution combined with counterfactual priors) that avoid the crass "you weren't really certain" move. These responses identify the learning of the entailment (`L`) and the counterfactual grounding as crucial elements. **However, these solutions are not without significant costs:** they introduce subjectivity in counterfactual priors, rely on rational reconstructions of history, and must handle probabilities over logical relations. Whether these costs are acceptable, or whether they constitute genuine solutions or sophisticated rationalizations, is a matter of philosophical judgment. Your sense that they feel like "changing the subject" *in part* stems from the necessary shift in focus from the raw evidence `E` to the entailment `L` and the counterfactual state. **It is entirely defensible to conclude that these Bayesian responses, while ingenious, do not fully resolve the POE in a completely satisfying manner, particularly regarding the prior for truly novel hypotheses.**

  **Non-Bayesian Alternatives:**

  If you find the Bayesian solutions ultimately unconvincing, here are prominent non-Bayesian accounts of confirmation that handle old evidence more straightforwardly, with a recommendation:

  1.  **Likelihoodism (Edwards, Royall):**
      *   **Core Idea:** Focuses *only* on the likelihood ratio `P(E|H1) / P(E|H2)`. Evidence `E` favors `H1` over `H2` if `P(E|H1) > P(E|H2)`. Priors `P(H)` play no role.
      *   **Handling POE:** Mercury's precession favors GR over Newtonian mechanics because `P(E|GR)` is high (GR predicts it) while `P(E|Newton)` is very low (it couldn't explain it). The fact that `E` was known beforehand is irrelevant to the *relative* likelihood comparison.
      *   **Strengths:** Elegant, avoids priors entirely, directly matches the intuitive strength of evidence based on fit. Handles old evidence naturally.
      *   **Weaknesses:** Cannot assess the absolute support for a single hypothesis, only relative support between alternatives. Requires specifying the alternative hypothesis (`H2`), which can be contentious. Doesn't easily incorporate background knowledge holistically.

  2.  **Explanationism (e.g., Inference to the Best Explanation - IBE - Harman, Lipton):**
      *   **Core Idea:** A hypothesis is confirmed if it provides the best explanation for the available evidence. Explanatory virtues (simplicity, scope, coherence, mechanism, fruitfulness) guide the inference.
      *   **Handling POE:** GR provided a *superb* explanation for Mercury's precession – it was precise, deep, unified (with gravity), and solved a persistent anomaly that defied other explanations. Its explanatory power is compelling *regardless* of when `E` was discovered. The historical sequence (old evidence) doesn't diminish its explanatory strength.
      *   **Strengths:** Intuitively powerful, directly captures scientific practice, handles old evidence naturally, incorporates rich notions like unification and mechanism that Bayesianism struggles with. Focuses on the *reason why* evidence supports a theory.
      *   **Weaknesses:** Explanatory virtues can be subjective/vague/hard to formalize. Risk of circularity ("best" explanation might be defined as the one we favor). Less formally precise than Bayesianism/Likelihoodism.

  3.  **Hypothetico-Deductivism (H-D) (with caveats):**
      *   **Core Idea (Simple Version):** If `H` entails `E`, and `E` is observed, then `H` is confirmed. (Naive H-D has well-known problems like the tacking paradox).
      *   **Handling POE:** GR entails the precession; the precession is observed; therefore, GR is confirmed. The age of `E` seems irrelevant to the logical structure.
      *   **Strengths:** Simple, avoids priors, handles old evidence straightforwardly.
      *   **Weaknesses:** Naive H-D is fatally flawed (entails too much, tacking paradox). Sophisticated versions incorporating novelty or background knowledge become complex. Less comprehensive than Bayesianism/Likelihoodism/Explanationism. Doesn't capture *degree* of support well.

  **Recommendation:**

  Given your background in physics and your focus on cases like GR and Mercury's precession, where the *explanatory power* and *problem-solving effectiveness* of the theory were paramount, **Explanationism (specifically a sophisticated form of Inference to the Best Explanation - IBE)** seems the most fitting non-Bayesian alternative for you.

  *   **Why:** It directly addresses the core of *why* Mercury's precession was such powerful evidence for GR: GR provided a deep, unifying, and satisfying *explanation* for a known anomaly that other theories failed to resolve. This resonates with scientific practice and avoids the Bayesian struggles with priors and credence 1. It naturally accommodates old evidence – a good explanation explains what we know, whenever we knew it.
  *   **Caveat:** Be aware of critiques regarding the subjectivity/vagueness of explanatory virtues. However, within the philosophy of science, IBE remains a major and influential account precisely because it captures the rational force of good explanations in science, as exemplified by the GR/Mercury case.

  In essence, your intuition that Bayesianism struggles fundamentally with the Problem of Old Evidence, especially concerning novel hypotheses, is shared by many philosophers. While sophisticated Bayesian responses exist, they carry significant baggage. Explanationism offers a powerful and intuitive alternative that aligns well with the historical cases that motivate your concern.
