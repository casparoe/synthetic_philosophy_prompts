prompt: |-
  ok so im taking this course on moral philosophy and we have to submit a term paper proposal (like 3000 words, one semester project). i want to write about why promises bind but i feel like all the standard answers we covered have the same blind spot. like, consent theory says you voluntarily take on the obligation, but that just pushes the question back — why does consenting to an obligation *create* one? expectation theory says it's wrong to disappoint the promisee's expectations, but that seems to make promising parasitic on a general duty not to harm, which misses something distinctive about promissory obligation. and practice/convention accounts make it seem like the obligation comes from the social practice, but then it's hard to explain why breaking a promise to someone who doesnt know about the practice still feels wrong.

  my half-formed idea is that maybe the problem is that all these views try to reduce promissory obligation to something individual-level — the promisor's will, the promisee's mental state, or a social rule that individuals opt into. what if promising is essentially a joint activity that can't be decomposed that way? like, when i promise you something, we together create a normative relationship that isn't just the sum of my intention plus your expectation. i think there's literature on joint commitment and shared agency that might help here but i dont really know how to turn this into a tight argument.

  can you write me a proposal that frames this as a clear research question, explains why existing individualistic accounts leave a gap, sketches an approach using joint commitment / shared agency ideas, and says what the deliverable would be and what would count as the project failing? don't worry about citations, ill add those. also be honest about whether this is too big for a semester — if it is, how would you narrow it?
