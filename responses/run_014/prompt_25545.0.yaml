answer: |-
  Here’s a focused term paper proposal structured around your critique, leveraging joint commitment theory to address the gap in existing accounts of promissory obligation. This balances ambition with feasibility for a semester project.

  ---

  **Term Paper Proposal: Promising as Joint Commitment — Beyond Individualistic Accounts of Obligation**  

  **1. Research Question:**  
  *Can Margaret Gilbert’s theory of joint commitment (or similar shared agency frameworks) resolve the explanatory gap in individualistic accounts of promissory obligation—specifically, why promises bind even when voluntariness, expectations, or social conventions fail to fully ground their normative force?*

  **2. Problem: The Blind Spot in Individualistic Accounts**  
  Existing theories reduce promissory obligation to *monadic* properties (individual acts or states), leaving key questions unanswered:  
  - **Consent/Will Theory** (e.g., Rawls): Fails to explain why a *mere act of will* creates obligation. If consent binds because we *ought to keep commitments*, the source of that "ought" remains unaddressed (infinite regress).  
  - **Expectation Theory** (e.g., Scanlon): Reduces promising to a species of harm avoidance (disappointing expectations). This cannot explain:  
    - Why *non-detrimental* promise-breaking feels wrongful (e.g., promising to call at noon when no one cares).  
    - Why promissory obligation feels *distinct* from general duties not to mislead.  
  - **Practice/Convention Theory** (e.g., Hume, Anscombe): Grounds obligation in social rules. But this:  
    - Renders promises to outsiders (e.g., a isolated person unaware of the practice) non-binding, contradicting intuition.  
    - Makes obligation contingent on a practice’s existence, undermining its moral necessity.  

  **The Gap**: All three accounts neglect the *relational, co-created* dimension of promising. Promising isn’t just an individual act + individual response; it’s an *interpersonal bond* with irreducible normative structure.  

  **3. Proposed Approach: Joint Commitment as Foundational**  
  Drawing on Margaret Gilbert’s *joint commitment theory* (and parallels in Bratman, Roth, or Korsgaard):  
  - **Core Thesis**: A promise constitutes a joint commitment where two agents *together* create a normative framework binding both. Obligation arises from the *relational act itself*, not from aggregated individual states.  
  - **Key Arguments**:  
    - **Joint Commitment ≠ Sum of Individual Commitments**: When A promises B, they form a "plural subject" (Gilbert) with interdependent rights/duties. B isn’t just a beneficiary but a *co-creator* of the obligation.  
    - **Explaining the "Binding" Problem**: Obligation emerges from the *relational act* of mutual obligation-assumption. This avoids regress (consent theory) and parasitism (expectation theory).  
    - **Handling Problem Cases**:  
      - *Promises to "outsiders"*: Obligation stems from the joint act, not the promisee’s cultural knowledge.  
      - *Non-detrimental breaking*: Wrongfulness lies in violating the relationship, not just causing harm.  
    - **Contrast with Individualism**: Joint commitment is *sui generis*—it cannot be reduced to intentions, expectations, or rules.  

  **4. Deliverables**  
  - A critical analysis of consent, expectation, and convention theories’ failures to explain promissory obligation’s source.  
  - A developed account of promising as joint commitment, demonstrating how it closes the gaps above.  
  - Responses to key objections (e.g., "Is joint commitment overmetaphysical?"; "Does this imply all promises require explicit agreement?").  

  **5. Feasibility & Narrowing Scope**  
  **Is this manageable in a semester?** **Yes, if scoped strategically:**  
  - **Focus**: Analyze *only* the *source* of bindingness (why promises obligate), not ancillary topics (e.g., excuses for breaking promises).  
  - **Cases**: Use 2–3 targeted counterexamples to test theories (e.g., promise to an outsider; non-detrimental breaking).  
  - **Theory**: Primarily engage Gilbert (*On Social Facts*), with brief contrast to Bratman (*Shared Agency*) or Scanlon (*Promises and Contracts*).  
  - **Avoid**: Deep dives into metaethics or general theories of obligation.  

  **If Overambitious, Narrow Further**:  
  - **Option 1**: Compare *only* joint commitment vs. consent theory, using the "regress" problem as the core case.  
  - **Option 2**: Focus *only* on the "promise to an outsider" objection to convention theory, using joint commitment as the solution.  

  **6. What Would Count as Failure?**  
  - **Success**: Demonstrating that joint commitment plausibly resolves a gap individualistic theories cannot, *even if not fully proving* it’s the only valid account.  
  - **Failure**:  
    - The joint account *collapses into individualism* (e.g., if "jointness" reduces to mutual expectations).  
    - It cannot handle core counterexamples better than rivals.  
    - The argument becomes purely descriptive (how promises *function*) not normative (why they *bind*).  

  ---

  **Why This Works for 3000 Words:**  
  - **Targeted Problem**: Focuses on *one* gap (bindingness) and *one* solution (joint commitment).  
  - **Clear Stakes**: Positions joint commitment as answering a question individualistic accounts evade.  
  - **Manageable Engagement**: Requires engagement with 3–4 key theorists (Gilbert + 2 critics/allies).  

  **Next Steps for You**:  
  1. Sketch an outline: Intro → Critiques of 3 theories → Gilbert’s joint commitment → Application to problem cases → Objections/Replies.  
  2. Identify 2–3 primary texts (Gilbert’s "Three Dogmas," Scanlon on promises, Hume on conventions).  
  3. Test your core intuition: *"Does X feel like violating a shared project?"* is a good litmus for jointness.  

  This framework makes your "half-formed idea" into a sharp, contestable thesis with a clear scholarly niche. Well done spotting the individualism gap—that’s the mark of a strong proposal!
