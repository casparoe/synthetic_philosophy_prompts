answer: |-
  Here’s a concise decision tree for your handout, designed around intuitive cases and probes. It fits within 10 nodes (6 total) and separates key views while flagging limitations:

  ---

  ### **The "Hard Choice" Decision Tree**  
  *Answer based on your gut reaction to each scenario:*

  1. **Q1:** *You’re torn between two paths (e.g., high-paying job vs. meaningful volunteer work). Can you* always *say one is better, worse, or exactly as good as the other?*  
     - **→ YES (Always comparable)** → Go to Q2.  
     - **→ NO (Sometimes incomparable)** → Go to Q3.  

  2. **Q2:** *Imagine improving the "worse" option just a tiny bit (e.g., slightly higher salary). Does this* guarantee *it becomes better?*  
     - **→ YES** → **Leaf 1: Single-Scale Comparabilist**  
       *Awkward commitment: Even Picasso vs. Einstein debates boil down to one "score" (e.g., utility).*  
     - **→ NO** → **Leaf 2: Brute Pluralist**  
       *Awkward commitment: Two options can be "exactly equal" without any shared measure (e.g., honesty = ice cream).*  

  3. **Q3:** *When neither option is better, are they* equally good *by default?*  
     - **→ YES** → **Leaf 2: Brute Pluralist** (as above).  
     - **→ NO (They’re not equal!)** → Go to Q4.  

  4. **Q4:** *Suppose neither Job A nor Job B is better, but Job B+ (a tiny upgrade of B) is better than B. Is Job B+ now* automatically better than A?*  
     - **→ YES** → Go to Q5.  
     - **→ NO** → **Leaf 3: Parity Theorist**  
       *Awkward commitment: "B+ beats B, but still can’t beat A" (a 4th relation: "on par").*  

  5. **Q5:** *You face a moral vs. personal desire clash (e.g., help parents vs. travel). Could a huge boost to the "losing" side (e.g., 1% more moral weight) flip the choice?*  
     - **→ YES** → **Leaf 3: Parity Theorist** (if earlier answers fit) **or Leaf 4: Lexical Priority**  
       *⚠️(These leaves blur here—see notes below).*  
     - **→ NO (Moral duty always wins, even with tiny weight)** → **Leaf 4: Lexical Priority**  
       *Awkward commitment: "Saving one stranger > your entire life’s happiness."*  

  6. **Q6:** *When stuck, is flipping a coin* irrational *because you "should" know the right answer?*  
     - **→ YES** → Any leaf from Q5 (**Lexical Priority** or **Parity**).  
     - **→ NO (Coin-flips can be honest/wise)** → **Leaf 5: Commitment Theorist**  
       *Awkward commitment: Choosing *creates* the reason (e.g., "I paint because I chose it").*  

  ---

  ### **Key**  
  - **Leaf 1: Single-Scale Comparabilist** (e.g., utilitarians): All values rank on one scale.  
  - **Leaf 2: Brute Pluralist** (e.g., some intuitionists): Incomparable options can be exactly equal.  
  - **Leaf 3: Parity Theorist** (e.g., Ruth Chang): "On par" is a fourth relation (≠ better/worse/equal).  
  - **Leaf 4: Lexical Priority** (e.g., deontologists): One value (e.g., justice) always "trumps" others.  
  - **Leaf 5: Commitment Theorist** (e.g., existentialists): Will creates reasons in true ties.  

  ---

  ### **Indistinguishable Leaves & Why**  
  1. **Single-Scale Comparabilist (Leaf 1) vs. Brute Pluralist (Leaf 2):**  
     - The tree *can’t fully separate them* because both might agree on Q1/Q2 if pluralists allow rough equality.  
     - **Why?** The small-improvement test (Q2) is too coarse. Brute pluralists could accept that tiny improvements tip scales *if* values are close.  

  2. **Parity (Leaf 3) vs. Lexical Priority (Leaf 4) at Q5:**  
     - If you say "NO" to Q5, you’re firmly **Lexical Priority**.  
     - If "YES," it *could* be either view. **Why?** Parity allows big boosts to flip choices; lexicalists might accept this if the "trumping" value isn’t involved. Refine by adding: *"Does a tiny boost to the ‘higher’ value (e.g., morality) always win?"* → **YES** = Lexical; **NO** = Parity.  

  ---

  ### **Design Notes**  
  - **Probes used:** Small-improvement (Q2, Q4), third-option upgrade (Q4), coin-flip rationality (Q6).  
  - **Jargon-free nodes:** Questions use "better/worse/equal," "tiny boost," "flipping a coin."  
  - **Efficiency:** 6 nodes, 5 leaves—prioritizing clarity over edge cases.  
  - **First-year friendly:** Cases mirror real dilemmas (jobs, travel, morality).  

  This tree forces students to confront intuitions about comparability, improvement, and authority in choices—setting up your lecture to name and problematize their positions.
