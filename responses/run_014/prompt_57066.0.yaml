  someone in my science-and-religion seminar keeps leaning on the line Galileo borrows from Baronius — roughly, that scripture was written to show us how to get to heaven, not how the heavens are put together — and he uses it to argue two things: that Galileo's real achievement was drawing a jurisdictional boundary between science and faith (a 17th century version of non-overlapping magisteria), and that Rome's mistake was a plain category error, treating a salvation text as a physics manual. i don't think that line can carry either claim but I can't say why.

  Can you lay out the separate, precise doctrines the sentence might be expressing — starting from the difference between saying scripture has no truth value at all on claims about nature, and saying it deliberately speaks in appearances accommodated to ordinary readers while remaining literally true — and for each one say whether Galileo himself would have endorsed it, given what he argues in the letters to Castelli and to the Grand Duchess? Then tell me which reading, if any, actually gets my seminar-mate his two conclusions, and whether the reading he needs makes Galileo more radical or more conservative than the version being presented.
