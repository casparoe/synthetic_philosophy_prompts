prompt: |-
  I am trying to work out what I actually believe about the rationality of escalating a losing position, and my intuitions are not lining up. I would like to set out my verdicts on a series of concrete cases and ask what principle, if any, captures the pattern.

  Begin with the dollar auction, in which a single dollar bill is sold to the highest bidder but the second-highest bidder must also pay the amount they bid. I am the current high bidder at ninety cents and another bidder moves to ninety-five. My verdict is that I should bid a dollar. I can see why: folding forfeits the ninety cents with certainty, whereas bidding a dollar converts that certain loss into a lottery in which I break even if the other bidder folds and lose a full dollar if they do not, so as long as I assign the other bidder a sufficient probability of folding, the bid carries positive expected value.

  Now run the same auction well past the face value of the bill. I am high at five dollars and five cents and another bidder moves to five dollars and ten cents. My verdict is that I should stop. The move is structurally identical to the first — I am again staking the same small increment to convert a certain loss into a lottery whose two outcomes are shifted by exactly the same amounts — and yet my gut refuses the bid. I cannot name what separates the ninety-cent case from the five-dollar case when the incremental calculation appears unchanged.

  The same shape appears outside the auction. My firm has spent twenty million dollars developing a product that fresh market research indicates will fail; my verdict is to kill the project, and I am inclined to call continuing it the sunk-cost fallacy. But my firm has also spent twenty million dollars building a prototype, and a competitor will bring a rival product to market next quarter unless we ship ours first; my verdict is to ship, even though the product is risky. The same twenty million dollars, opposite verdicts.

  And here is the case I keep returning to and cannot settle. I have driven two hours into a worsening snowstorm; the road ahead is closed, though crews are expected to clear it within the hour, and I am driving to an event I have no other way of attending. Part of me insists that I should press on because of the two hours already spent, but another part knows that those two hours are lost whether I wait or turn back, so that the only live question is whether the wait is worth it given the conditions. I cannot tell which of the two impulses is the rational one, or whether they are even competing considerations.

  So I have three questions. First, is there a single principle — or a small set of candidates — that recovers as many of these verdicts as possible, stated precisely enough that I can see which case motivates each clause? Second, what does that principle say about the snowstorm case and about a case I have not raised, namely whether to keep funding a failing startup that has already burned through its seed round? I have a tentative guess that the dividing line is whether some other agent's future choices respond to mine, but I am not confident that is the right axis, and it does not obviously do any work in the snowstorm, where there is no opponent at all. Third, and most important to me, which of my own verdicts does the principle force me to abandon, and what do I lose by abandoning it?
reasoning: |-
  Okay, let me try to unpack this user's problem. They're struggling with the rationality of escalating commitments in losing situations. The examples they provided—dollar auction, business decisions, snowstorm dilemma—all seem to share a common tension between incremental logic and intuitive resistance. 

  First, I notice the user is deeply self-aware. They recognize their conflicting intuitions and explicitly name the sunk-cost fallacy, yet feel their verdicts contradict in structurally similar cases. That's sophisticated—most people wouldn't catch that inconsistency. Their frustration feels genuine; they've probably wrestled with this for a while.

  The dollar auction cases are particularly telling. Mathematically, bidding $1 from $0.90 and bidding $5.15 from $5.05 are identical incremental decisions. But emotionally, one feels justified while the other feels absurd. That gap between math and intuition is where the real question lives. 

  For the business cases, they're distinguishing between two types of $20M losses: one where continuing is pure sunk cost fallacy, another where it's strategic preemption. The key difference seems to be whether future payoffs exist independently of the loss—a nuance traditional sunk-cost discussions often miss.

  The snowstorm dilemma is the most relatable. "Part of me insists... another part knows" captures that internal conflict perfectly. What's interesting is their awareness that both impulses feel simultaneously rational and irrational. They're not just asking for answers; they want to understand why their brain generates this contradiction.

  Their three questions reveal sophisticated meta-cognition: they want a unifying principle, application to new cases, and most importantly—which of their current beliefs must be abandoned. That last point is crucial. They're not just seeking validation; they're prepared to change their mind. 

  I suspect their unspoken need is deeper: they might be facing a high-stakes version of these dilemmas (startup? career pivot?) and needs frameworks to avoid costly mistakes. The startup seed round example hints at personal relevance.

  The "opponent's choices" hypothesis shows they've done groundwork. But as they note, it doesn't explain the snowstorm case. That's where I think prospect theory and loss aversion come in—the psychological pain of crystallizing a loss versus maintaining hope. The snowstorm isn't opponent-less; it's against nature/chance, which feels different than human competition.

  For the seed round case: if the startup has any chance of becoming the next Uber, $20M is cheap. But if it's fundamentally flawed, continuing is irrational. The hard part is knowing which scenario you're in—and that uncertainty is where their dollar auction intuition fails, because we overestimate control in human competitions versus natural events.

  What they might be missing is that "rationally" has two layers: the mathematical EV calculation (which remains constant) and the psychological framing (which changes). Their gut isn't wrong—it's weighing hidden costs like opportunity cost and emotional toll that pure EV ignores. That's why the snowstorm wait feels different than the dollar auction: the physical danger and isolation add non-monetary stakes.

  Ultimately, they'll need to abandon either the consistency of their incremental logic (accepting that some bets are too small relative to stakes) or their intuitive resistance in high-stakes cases. The latter is harder but more truthful—our brains didn't evolve for dollar auctions. I'll emphasize that recognizing the conflict is 80% of the battle; we can build decision safeguards once we know where intuition fails.
answer: |-
  Your intuitions reveal a sophisticated tension between incremental rationality and psychological framing. The pattern isn't captured by a single principle, but by the interaction of three concepts: **expected value (EV) calculus, loss aversion, and strategic interdependence**. Below is a breakdown of the principles, applied verdicts, and inconsistencies to resolve.

  ---

  ### **Core Principles Explaining Your Verdicts**
  1. **Incremental EV Rationality**  
     *When evaluating the next small step, ignore sunk costs and focus only on marginal costs vs. marginal benefits.*  
     - In the dollar auction at $0.90: Bidding $1.00 costs $0.05 for a chance to save $0.90 (if the opponent folds). If the opponent folds with probability >5.6% ($0.05/$0.90), EV is positive.  
     - *Applies identically at $5.05*: Bidding $5.10 costs $0.05 to save $5.05. If opponent folds with >1% probability ($0.05/$5.05), EV is positive.  
     - **Why your gut rejects the $5 bid**: Loss aversion dominates when absolute losses grow large (even if EV is positive). A $5.05 loss *feels* catastrophic, making the gamble unacceptable despite the math.

  2. **Strategic Interdependence**  
     *Escalation is rational only if others' responses create future leverage or avoid larger losses.*  
     - **Failing product (no interdependence)**: Killing it is correct. Continuing is a pure sunk-cost fallacy—no strategic payoff exists.  
     - **Prototype vs. competitor**: Shipping is rational. The $20M isn't "recovered"; it creates a *barrier to entry*. Delaying cedes the market to the rival, turning a $20M loss into a permanent competitive failure.  
     - **Dollar auction**: Opponent's potential retreat creates interdependence. In the $0.90 case, their fold seems plausible; at $5.05, mutual irrationality is likely, making retreat improbable.

  3. **Prospect Theory Framing**  
     *Losses loom larger than gains, and we evaluate choices relative to a reference point (e.g., "current loss" vs. "breakeven").*  
     - At $0.90 down, bidding $1.00 frames breakeven as achievable—a gain.  
     - At $5.05 down, bidding $5.10 frames a new loss as inevitable—deepening the pain.  
     - **Snowstorm**: Your reference point shifts.  
       - *Initial view*: "I've driven 2 hours" → turning back crystallizes a total loss.  
       - *Rational view*: Only future costs matter: "Is waiting 1 hour in a storm safer/less costly than driving 2 hours back?"  
       - **Conflict source**: Loss aversion makes waiting feel like a chance to "salvage" the trip, while turning back accepts defeat.

  ---

  ### **Applied Verdicts**
  | **Case**                  | **Your Verdict** | **Principle-Based Verdict**                     | **Inconsistency**                     |
  |---------------------------|------------------|------------------------------------------------|---------------------------------------|
  | Dollar auction ($0.90)    | Bid             | Bid (positive EV if opponent may fold)          | None. Gut aligns with EV.             |
  | Dollar auction ($5.05)    | Fold            | *Bid* (EV still positive if fold probability >1%) | **Abandon this verdict**. Loss aversion distorts EV calculus. |
  | Failing product           | Kill            | Kill (no strategic payoff)                      | None. Correctly avoids sunk-cost fallacy. |
  | Prototype vs. competitor  | Ship            | Ship (strategic interdependence blocks rival)   | None. Rational escalation.            |
  | **Snowstorm**             | Conflict        | **Turn back** (only future costs matter)        | **Abandon "press on" impulse**. Sunk costs are irrelevant; safety/conditions dominate. |
  | **Failing startup**       | Not specified   | **Kill it** *unless*:                           | —                                     |
  |                           |                 | - Interdependence exists (e.g., preempting a rival), OR |                                       |
  |                           |                 | - New info shows a pivot to profitability       |                                       |

  **Startup seed round**: If the startup has no credible path to monetization, no strategic stakes (e.g., blocking a competitor), and no new data suggesting a turnaround, continued funding is irrational. The $20M is sunk; future capital should depend solely on *prospective* ROI.

  ---

  ### **What You Must Abandon (and Why)**
  1. **Folding at $5.05 in the dollar auction**  
     - *Why abandon?* The incremental EV calculation is identical to the $0.90 case. If your opponent might fold with >1% probability, bidding is mathematically rational.  
     - *What you lose*: Consistency in risk-neutral decisions. However, in practice, folding may be wise if you doubt your opponent's rationality (e.g., they might escalate endlessly).

  2. **"Press on" in the snowstorm**  
     - *Why abandon?* The 2 hours are sunk. The choice is between:  
       - Waiting 1 hour (cost: time/risk in storm)  
       - Driving back 2 hours (cost: time/fuel/safety risk)  
     - *What you lose*: The psychological comfort of "trying to make the loss worthwhile." But you gain clarity: if waiting carries higher accident risk than driving back, turning back is safer.

  3. **Equating all sunk costs**  
     - *Why abandon?* Sunk costs are irrelevant *unless* they create strategic options (e.g., the prototype as a barrier to entry).  
     - *What you gain*: Sharper distinction between futile escalation and rational preemption.

  ---

  ### **The Unifying Insight**
  Your instincts are torn between two valid but conflicting logics:  
  - **Micro-rationality**: "The next small step has positive EV."  
  - **Macro-rationality**: "This entire endeavor is a loss trap; cut bait."  

  **Resolution**: Use EV for incremental decisions *only when*:  
  - The stakes are low (minimal loss aversion), OR  
  - Strategic interdependence exists (e.g., auctions, competition).  
  Otherwise, prospect theory dominates—escalating large losses feels intolerable even if EV-positive.

  In the snowstorm, no opponent exists—only nature. Here, **macro-rationality prevails**: ignore sunk costs, minimize future harm. For the startup, unless interdependency or new evidence emerges, kill it. You lose the hope of redemption but avoid good money chasing bad.
