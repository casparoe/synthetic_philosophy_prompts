answer: |-
  ## Substituted-Judgment-First Procedure for Unrepresented Patients

  **Bottom Line:** Use this procedure when an incapacitated patient lacks a directive and reliable surrogates, *but* there is credible evidence about their specific values/preferences beyond generic demographics. Do *not* use it if evidence about the patient's values is truly absent or purely speculative, or if the pending decision requires immediate action incompatible with this timeframe.

  ### Procedure Steps (90-Minute Team Execution: 1 Clinician + 1 Social Worker)

  1.  **Define the Pending Decision:** State the exact medical intervention(s) under consideration (e.g., "Initiate long-term hemodialysis," "Perform intubation for acute respiratory failure," "Administer blood transfusion").
  2.  **Gather Evidence - Prioritized Sources:** Collect *all* available information potentially relevant to the patient's values, priorities, and views on similar medical decisions. Prioritize sources in this order:
      *   **a. Patient's Own Documented Statements:** Written directives (even if incomplete/old), signed forms, documented physician conversations, personal journals/emails/texts mentioning health views. *Date and context matter.*
      *   **b. Direct Witness Testimony (High Certainty):** Statements from individuals who heard the patient speak *directly, clearly, and recently* about the *specific* type of decision or closely analogous situations (e.g., "She told me last year after her friend died on a vent, 'Never do that to me'").
      *   **c. Direct Witness Testimony (Lower Certainty/Recency):** Statements from individuals who heard the patient speak *directly* but less clearly, less specifically, or much longer ago about health/end-of-life values (e.g., "He said 10 years ago he hated hospitals").
      *   **d. Strongly Held Values/Lifestyle Evidence:** Documented patterns of behavior demonstrably linked to core values relevant to the decision (e.g., extreme independence evidenced by living choices, deep religious observance documented in practice, sustained avoidance of medical care consistent with stated beliefs).
      *   **e. Indirect/General Reports:** Secondhand accounts ("She told me he said..."), reports of very general statements ("He valued quality over quantity"), or accounts from individuals with limited/estranged contact. Group home staff reports typically fall here.
      *   ***Judgment Licensed:*** The team *judges* if evidence exists within categories a-e. If *no* evidence exists in a-e, STOP. Use best interests. Document "Insufficient evidence for substituted judgment reconstruction."
  3.  **Process Inconsistent Evidence:** **Idealize each piece of evidence SEPARATELY first (see Step 4), then look for convergence in the idealized preferences.** Do *not* pool raw testimony. If idealized preferences converge (point to the same choice), proceed. If they remain inconsistent *after* idealization, weigh them based on source priority (Step 2a highest, 2e lowest) and specificity to the current decision. If irreconcilable conflict remains after weighing, STOP. Use best interests. Document "Reconstructed preferences irreconcilably inconsistent."
  4.  **Apply Licensed Idealizing Corrections:** For each piece of evidence (patient statement or witnessed value), correct ONLY for:
      *   **Factual Ignorance/Misconception:** Correct the patient's understanding of the *medical facts* relevant to the decision they were commenting on *at the time*. (e.g., If they said "I'd never want dialysis" thinking it meant being permanently bedbound 24/7, correct to reflect that it typically involves sessions 3x/week. If they refused a treatment fearing a side effect that is now known to be extremely rare or manageable, correct that).
      *   **Incomplete Scenario Understanding:** If their statement addressed a hypothetical situation significantly different from the *actual* current scenario (e.g., terminal illness vs. acute reversible crisis, younger age vs. current age), clarify the *actual* scenario but do *not* change the core value expressed.
      *   **Contextual Distortion (Specific & Severe):** **Judgment Licensed:** The team *judges* if the statement/value was formed under conditions likely to *profoundly and temporarily* distort rational judgment *specifically about healthcare decisions*, AND there is clear contrasting evidence of their stable values. **Permitted ONLY for:** Documented, *active*, *untreated* severe mental illness (e.g., *active, untreated* major depressive episode with suicidal ideation influencing a refusal of *all* care; *active* psychosis directly distorting perception of treatment). **Forbidden for:** Sedation (assume statements under sedation are unreliable, generally exclude them), stress, anxiety, family pressure (these reflect complex values/interactions, not pure distortion - include them as evidence of values *in that context*), religious beliefs, cultural values, personality traits (e.g., stubbornness), or values simply different from the team's.
      *   **Internal Inconsistency within a Single Statement/Value:** If a single documented directive or statement contains a clear, direct contradiction relevant to the decision (e.g., "I never want a feeding tube, but do everything to keep me alive"), prioritize the *more specific* directive related to the pending intervention. If equally specific/contradictory, flag as inconsistent evidence (see Step 3).
  5.  **Synthesize Idealized Preference:** Based on the converged/weighted idealized evidence, formulate a single statement: "If capacitated, informed of the actual current medical situation and prognosis, and free of severe temporary distortion, Patient X would choose [Option A] or [Option B] for [Pending Decision]."
  6.  **Assess Reconstructive Drift - The Hard Stop Rule:** **Judgment Licensed:** The team *judges*: Does this reconstructed preference rely *primarily* on inferences beyond the core values actually expressed in the evidence *after* Step 4 corrections? Is the connection between the evidence and the conclusion tenuous? **If YES, or if the idealized preference contradicts a clear, witnessed, written directive without meeting the strict criteria in Step 4c (Contextual Distortion), STOP.** Use best interests. Document "Reconstructed preference lacks sufficient anchor in known patient values. Risk of excessive drift."
  7.  **Document Recommendation & Confidence:**
      *   State the recommended action based on the reconstructed substituted judgment.
      *   Rate confidence: **High** (Strong convergent evidence, minor idealization), **Medium** (Good evidence, reasonable idealization), **Low** (Limited/weaker evidence, significant but licensed idealization - use cautiously).
      *   Explicitly state if best interests was used per Hard Stop in Steps 2, 3, or 6.
  8.  **Review & Sign-Off:**
      *   **Team:** Clinician and Social Worker co-sign documentation of process (Steps 1-7).
      *   **Attending Physician:** Countersigns, affirming medical facts/context are accurately represented and the recommendation is medically applicable.
      *   **Risk Management:** Reviews for procedural adherence, clarity, and legal defensibility before final inclusion in the chart in plain language.

  ---

  ### Case Applications

  **Case 1: 74M facing dialysis, remark "rather die than hooked up to a machine" (10 yrs ago)**
  *   **Evidence:** Source 2c (Direct witness, low certainty/recency). No other evidence found.
  *   **Idealizations Applied:** Correct factual misconception? (Did "hooked up to a machine" mean *any* machine (e.g., vent, dialysis) or specifically life-support? Unclear - no correction licensed. Correct scenario? Past general remark vs. current specific need for dialysis. Clarify current scenario. Context? No evidence of distortion. Internal inconsistency? N/A.
  *   **Resulting Preference:** Idealized statement: "If informed he needed dialysis 3x/week to live, Patient X would likely still choose to forgo it, based on his expressed strong aversion to machine dependence, even clarified." **Recommendation:** Do not initiate dialysis. **Confidence:** Low-Medium (Single old statement, clarified scenario).
  *   **Sign-Off:** Team, Attending, Risk Management.

  **Case 2: 29F, first psychotic break, pre-illness documented refusal of intubation.**
  *   **Evidence:** Source 2a (Patient's own documented statement - refusal of intubation). Evidence of Context? *Active, untreated* psychosis (current break), but the *documented refusal predates any illness*. No evidence the *pre-illness* refusal was made under distortion.
  *   **Idealizations Applied:** Correct factual? (Did she understand intubation? Document suggests yes). Correct scenario? (Refusal context vs. current respiratory failure due to acute, potentially reversible psychosis). Clarify *current* scenario (treatable acute crisis vs. chronic illness). Contextual Distortion? **Forbidden.** The refusal document reflects her *pre-illness* values. The *current* psychosis does not retroactively distort the prior competent statement.
  *   **Resulting Preference:** Idealized statement: "If capacitated and informed she had a reversible acute respiratory failure due to a treatable condition (psychosis), Patient X would likely maintain her prior documented refusal of intubation." **Recommendation:** Honor documented refusal. **Confidence:** Medium (Clear prior directive; clarifying current scenario doesn't clearly override core value expressed).
  *   **Sign-Off:** Team, Attending, Risk Management.

  **Case 3: Patient has written, witnessed, current refusal of low-burden intervention. Idealization *could* dissolve it.**
  *   **Evidence:** Source 2a (Patient's own documented, witnessed, current refusal).
  *   **Idealizations Applied:** Correct factual? (e.g., Did they refuse due to a misconception about risk/benefit? If evidence shows clear factual error *and* the directive hinges *entirely* on that error, correct it. e.g., Refusal of IV antibiotics for UTI based on belief it causes permanent organ damage; correct to reflect minimal risk). Correct scenario? (Is the current scenario materially different? Unlikely for "low-burden"). Contextual Distortion? **Forbidden** unless meets *strict* Step 4c criteria (rare - e.g., refusal written during *documented, untreated* major depression with suicidal intent influencing *this specific refusal*). Internal inconsistency? Unlikely.
  *   **Resulting Preference & Hard Stop:** **The procedure FORBIDS dissolving a clear, current, witnessed written directive via idealization.** Step 6 (Hard Stop) applies: Overriding such a directive based on "idealization" constitutes excessive drift from the actual person's explicit choice. **Result:** The refusal stands. Recommendation: Honor the refusal. **Confidence:** High (Explicit directive).
  *   **Sign-Off:** Team, Attending, Risk Management. *Documentation must state: "Written directive is current and explicit. Idealization cannot override this clear expression of patient autonomy per Hard Stop Rule (Step 6)."*

  *(Dropped Case: The Estranged Child/Group Home cases were not fully detailed standalone cases like the others. The core challenges they represent - low-certainty testimony and secondhand reports - are integrated into the Evidence Hierarchy (Step 2c, 2e) and Inconsistency Handling (Step 3) within the procedure itself.)*

  ---

  ### Limitations & Systematic Risks

  This procedure cannot create preferences from nothing; it requires some credible evidence of the *specific* patient's values. It remains vulnerable to team bias, particularly in judging "distortion" (Step 4c) and "drift" (Step 6). It systematically risks undervaluing: 1) Choices based on values the team finds irrational or unfamiliar; 2) The weight of *current* suffering influencing a past preference ("Would I *still* want that, knowing how this feels?" is beyond idealization); 3) Truly novel situations the patient never contemplated. It prioritizes reconstructing autonomy but cannot guarantee perfect alignment with the unknown "true self." Best interests remains the necessary, if imperfect, fallback.
