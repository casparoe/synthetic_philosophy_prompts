     *Case: You have no evidence or particular belief, but you randomly guess and assert "There are 31 people in the next room". It turns out to be true.*  
     → If you think this assertion is **proper**, we flag: **Incoherent or Unstable: You said truth is not required (Node 1) and belief is not required (Node 3), but now you seem to allow any true assertion. This may be a form of Truth Norm, but contradicts Node 1.**  
     → If you think it is **improper**, you hold the **Evidence Norm (E)**: Assert only what is supported by your evidence.

  Note: The "overheard boss" case (you know your boss committed tax fraud but have no right to say it) is not directly in the tree. We can add it as a follow-up for the Practical Norm leaf, or consider it as a separate ethical norm not covered by the constitutive norm of assertion.

  Flag: The tree may not cleanly separate the Practical Norm from the others in all cases, and the Evidence Norm (E) is not a standard named position. Also, the Knowledge Norm and a norm requiring certainty might not be separated, but certainty is not a standard norm for assertion.

  This tree should fit on one page.
answer: |-
  Below is a decision tree designed to sort adherents of assertion norms based on their intuitive judgments about concrete cases, rather than their self-identified labels. The tree starts from the shared premise that assertion is a normative speech act and uses 7 binary branch points (nodes) to navigate the logical space of possible norms. Each node presents a scenario requiring a "proper" or "improper" judgment about an assertion, with named positions (leaves) including **Knowledge Norm (KN)**, **Truth Norm (TN)**, **Belief Norm (BN)**, **Practical Norm (PN)**, **Justified Belief Norm (JBN)**, and **Evidence Norm (EN)**. An "anti-norm" leaf is omitted as the tree assumes acceptance of normativity; instead, incoherent/unstable combinations are flagged. The tree incorporates your specified cases and prioritizes logical exhaustiveness over historical popularity.

  ---

  ### **Assertion Norm Decision Tree**  
  *Start at Node 1. Answer "proper" or "improper" for each case.*

  #### **Node 1: False Assertion with Good Evidence**  
  *Case: You assert "The meeting is in Room 101" based on a reliable schedule you saw 10 minutes ago. Unbeknownst to you, the meeting was moved to Room 102 5 minutes ago. Your assertion is false, but your evidence was excellent.*  
  → If **improper**, go to Node 2.  
  → If **proper**, go to Node 3.  
  *Rationale: Tests if truth is necessary. "Improper" suggests truth is required (TN, KN, JBN). "Proper" rejects truth as necessary (BN, PN, EN).*

  #### **Node 2: Lucky True Belief (Garbage Evidence)**  
  *Case: You bet on a horse because you like its name (no evidence). You assert "This horse will win." It wins, but your evidence was pure garbage.*  
  → If **proper**, you hold the **Truth Norm (TN)**: Assert only truths.  
  → If **improper**, go to Node 4.  
  *Rationale: TN accepts any true assertion. "Improper" demands more than truth (KN, JBN, or PN).*

  #### **Node 3: Knowledge Without Belief?**  
  *Case: A native English speaker is asked if "I are going" is grammatical. They instantly assert, "No, that’s ungrammatical," drawing on linguistic competence they’ve never consciously considered. They know it’s ungrammatical but held no prior belief about this specific sentence.*  
  → If **proper**, go to Node 5.  
  → If **improper**, go to Node 6.  
  *Rationale: "Proper" rejects belief as necessary (leaning toward EN or PN). "Improper" requires belief (BN or JBN).*

  #### **Node 4: Stakes-Shifting Case (Same Evidence)**  
  *Case: You have moderate evidence (past experience) that Bank X closes at 3 PM. In **Low Stakes**, you assert "It closes at 3" casually. In **High Stakes**, you’ll be fired if wrong, but evidence is identical. You assert "It closes at 3" in High Stakes.*  
  → If **improper**, go to Node 7.  
  → If **proper**, go to Node 8.  
  *Rationale: "Improper" suggests practical stakes matter (PN). "Proper" rejects stakes-sensitivity (KN or JBN).*

  #### **Node 5: "No Right to Assert" (Overheard Boss)**  
  *Case: You overhear your boss committing tax fraud and know it’s true. You assert "My boss committed tax fraud" to colleagues, despite having no authority to disclose this.*  
  → If **proper**, you hold the **Evidence Norm (EN)**: Assert only what your evidence supports.  
  → If **improper**, you hold the **Practical Norm (PN)**: Assert only what you can act on as if true (considering stakes/rights).  
  *Rationale: EN focuses only on evidence quality. PN incorporates pragmatic constraints (e.g., "no right to say it").*

  #### **Node 6: False Assertion with Sincere Belief**  
  *Case: You believe "Stock Y will rise" based on a gut feeling (no evidence). You assert it. The stock plummets.*  
  → If **proper**, you hold the **Belief Norm (BN)**: Assert only what you believe.  
  → If **improper**, you hold the **Justified Belief Norm (JBN)**: Assert only what you justifiably believe.  
  *Rationale: BN accepts any believed assertion. JBN requires justification (rejects garbage evidence).*

  #### **Node 7: Gettier Case (JTB Without Knowledge)**  
  *Case: You see a stopped clock showing 3:00 and form a justified true belief that it’s 3:00. By luck, it is 3:00. You assert "It’s 3:00."*  
  → If **proper**, you hold the **Justified Belief Norm (JBN)**: Assert only what you justifiably believe.  
  → If **improper**, you hold the **Knowledge Norm (KN)**: Assert only what you know.  
  *Rationale: JBN accepts justified true beliefs. KN demands anti-Gettier conditions (e.g., no luck).*

  #### **Node 8: Knowledge Without Actionability?**  
  *Case: You know a harmless secret (e.g., "Person Z loves kale") but have no practical reason to share it. You assert it unprompted.*  
  → If **proper**, you hold the **Knowledge Norm (KN)**: Assert only what you know.  
  → If **improper**, you hold the **Practical Norm (PN)**: Assert only what you can act on as if true.  
  *Rationale: KN is invariant to pragmatics. PN demands contextual "actionability."*

  ---

  ### **Key Features & Notes**  
  1. **Logical Structure**:  
     - Norms are defined by necessary/sufficient conditions:  
       - **Truth** (TN): Only truth required.  
       - **Belief** (BN): Only belief required.  
       - **Justified Belief** (JBN): Justified belief required; truth optional.  
       - **Knowledge** (KN): Knowledge (JTB + anti-luck) required.  
       - **Evidence** (EN): Evidence strength required; truth/belief optional.  
       - **Practical** (PN): Contextual reasonableness required (stakes/rights/actionability).  
     - Tree tests conditions in order: Truth → Belief → Justification/Evidence → Pragmatics.  

  2. **Incorporated Cases**:  
     - Node 2: Lucky belief (true, garbage evidence).  
     - Node 3: Knows-but-doesn’t-believe (grammatical competence).  
     - Node 4: Stake-shifting (bank case).  
     - Node 5: "No right to assert" (overheard boss).  

  3. **Indistinguishable Leaves**:  
     - **KN vs. PN in low-stakes contexts**: If stakes are trivial (e.g., Node 8), KN and PN converge. The tree separates them by injecting stakes/actionability (Nodes 4/5/8).  
     - **JBN vs. EN in true assertions**: When evidence justifies truth, JBN and EN overlap. Node 5 breaks this by testing "unactionable" knowledge.  

  4. **Empty/Incoherent Combinations**:  
     - **Node 3 → "Proper" → Node 5 → "Improper" → PN**: Coherent but implies assertion requires "rights," not just evidence.  
     - **Node 1 → "Proper" → Node 6 → "Improper" → JBN**: Unstable, as JBN typically requires truth (rejected at Node 1). Labeled "JBN (truth-optional variant)"—unattractive and rare.  
     - **All paths end in a leaf**: No dead ends, but PN appears twice (Nodes 5/8) to capture stakes/rights vs. actionability.  

  5. **Efficiency**:  
     - 7 nodes fit on one page. Most users reach a leaf in 3–5 steps.  
     - "Anti-norm" positions are excluded by design (start assumes normativity).  

  This tree forces users to confront tensions (e.g., rejecting truth but requiring justification) and isolates core commitments. Use it to spark debate—many discover their intuitions don’t match their professed labels!
