answer: |-
  Below is a structured decision procedure designed for your team. It separates the concepts you specified, uses plain-language tests, and explicitly flags judgment calls. The procedure is sequential—each step must be resolved before proceeding. If a step fails, it triggers a rejection path (BAN or REGULATE). If uncertainty arises, it hands off to human judgment (HAND-OFF). Total runtime is capped at 30 minutes.  
  **Key outputs**:  
  - **ALLOW**: Proceed as proposed (possibly with minor tweaks).  
  - **BAN**: Reject outright; the transaction is impermissible.  
  - **REGULATE**: Reject as proposed but allow with strict safeguards (e.g., price caps, oversight).  
  - **HAND-OFF**: Refer to the ethics committee for a values-based judgment.  

  ---

  ### **Decision Procedure**  
  **Step 1: Can this thing be sold? (Alienability Check)**  
  - **Question**: Is the good/service something a person can rightfully transfer for money?  
  - **Plain-language test**: "Would selling this feel like selling a vote, a child, or a public office? These aren't 'property'—they're tied to who we are or how society works."  
  - **Sufficient answer**:  
    - **Yes** → Proceed to Step 2.  
    - **No** → Go to Step 1a.  
    - **Unclear** → HAND-OFF (e.g., "Is a kidney like a guitar or a vote?").  
  - **Rejection path**: None yet.  

  **Step 1a: Would banning make things worse? (Consequences of Ban)**  
  - **Only if Step 1 = No**.  
  - **Question**: If we ban this, will it likely go underground and harm the people we’re trying to protect?  
  - **Plain-language test**: "Like banning organ sales might create black markets—would banning this do the same? Could it leave vulnerable people worse off?"  
  - **Sufficient answer**:  
    - **Yes** → REGULATE (add safeguards to reduce harm).  
    - **No** → BAN (the transaction is fundamentally wrong).  
    - **Unclear** → HAND-OFF.  

  **Step 2: Is someone being squeezed? (Exploitation Risk)**  
  - **Only if Step 1 = Yes**.  
  - **Question**: Does one party have no decent alternative but to accept the deal?  
  - **Plain-language test**: "Is the seller (or buyer) so desperate that they’d agree to anything? Think: 'A fair price doesn’t fix exploitation if the person is trapped.'"  
  - **Sufficient answer**:  
    - **Yes** → Go to Step 2a.  
    - **No** → Proceed to Step 3.  
    - **Unclear** → HAND-OFF.  

  **Step 2a: Can we fix the squeeze? (Exploitation Mitigation)**  
  - **Only if Step 2 = Yes**.  
  - **Question**: Can we add safeguards (e.g., independent advice, waiting periods, price floors) to ensure real choice?  
  - **Plain-language test**: "Can we give the person options so they’re not cornered? Example: Offering job training to someone selling plasma so they don’t *need* to sell."  
  - **Sufficient answer**:  
    - **Yes** → Proceed to Step 3 (with safeguards noted).  
    - **No** → Go to Step 1a (re-assess ban consequences).  

  **Step 3: Does money change what this means? (Market Reshaping Harm)**  
  - **Question**: Would pricing this good/service corrode relationships or society’s values?  
  - **Plain-language test**: "Would putting a price tag on this turn something sacred (like caregiving) into a cold transaction? Could it make us see people as products?"  
  - **Sufficient answer**:  
    - **Yes** → Go to Step 3a.  
    - **No** → Proceed to Step 4.  
    - **Unclear** → HAND-OFF (values judgment).  

  **Step 3a: Is the trade-off worth it? (Harm vs. Benefit)**  
  - **Only if Step 3 = Yes**.  
  - **Question**: Are the benefits (e.g., lives saved) so urgent that we accept the harm, and can we soften it?  
  - **Plain-language test**: "Is this like paying for plasma—it feels wrong, but we allow it because lives depend on it? Can we limit the damage (e.g., only in emergencies)?"  
  - **Sufficient answer**:  
    - **Yes** → Proceed to Step 4 (with harm-reduction measures).  
    - **No** → Go to Step 1a.  

  **Step 4: Is the deal shockingly unfair? (Unfairness Check)**  
  - **Question**: Is the price/terms so one-sided that it offends basic fairness?  
  - **Plain-language test**: "Does this feel like price gouging $10 for a bottle of water during a hurricane? Not just a bad bargain—but ‘this shouldn’t be legal’ unfair."  
  - **Sufficient answer**:  
    - **Yes** → Go to Step 4a.  
    - **No** → ALLOW (with any safeguards from prior steps).  
    - **Unclear** → HAND-OFF.  

  **Step 4a: Can we fix the unfairness? (Term Adjustment)**  
  - **Only if Step 4 = Yes**.  
  - **Question**: Can we adjust terms (e.g., price caps, third-party review) to make it fair without killing the deal?  
  - **Plain-language test**: "If we cap the price or add oversight, would the deal still work? Example: Limiting ventilator markups to 100% instead of 300%."  
  - **Sufficient answer**:  
    - **Yes** → REGULATE (with adjusted terms).  
    - **No** → Go to Step 1a.  

  ---

  ### **Testing the Procedure on Your Proposals**  
  **Proposal 1: Pay living kidney donors $20,000 for directed donation**  
  - **Step 1 (Alienability)**: No. Organs aren’t property; selling them treats the body as a commodity.  
  - **Step 1a (Ban consequences)**: Yes. Banning drives sales underground (dangerous black markets). → **REGULATE** (but U.S. law bans this—see note below).  
    - *Procedure note: This conflicts with NOTA (illegal). If law is known, BAN. But ethically, REGULATE with safeguards (e.g., state-run trials).*  
    - **Verdict**: REGULATE (ethics) / BAN (legal reality).  

  **Proposal 2: Pay 300% markup for ventilators/N95s in emergencies**  
  - **Step 1 (Alienability)**: Yes. Medical supplies are ordinary goods.  
  - **Step 2 (Exploitation)**: Yes. Sellers exploit buyer’s desperation (no alternatives).  
  - **Step 2a (Mitigation)**: Yes. Require proof of scarcity and audits.  
  - **Step 3 (Reshaping harm)**: Yes. Normalizing gouging may erode trust in crises.  
  - **Step 3a (Harm vs. benefit)**: Yes. Benefit (saving lives) outweighs harm if limited to declared emergencies.  
  - **Step 4 (Unfairness)**: Yes. 300% markup "shocks the conscience."  
  - **Step 4a (Adjust terms)**: Yes. Cap at 100–200% with oversight. → **REGULATE**.  

  **Proposal 3: $100 gift cards for voting in a health bond election**  
  - **Step 1 (Alienability)**: No. Voting rights aren’t disposable; payment undermines democracy.  
  - **Step 1a (Ban consequences)**: No. Banning doesn’t create a black market (voting isn’t tradable). → **BAN**.  

  ---

  ### **Verdicts and Notes**  
  1. **Kidney donor payments**:  
