answer: |-
  As a physicist accustomed to emergent phenomena and micro-macro relationships, your frustration with the "could have done otherwise" debates is understandable. Philosophers often rely on hypotheticals (like Frankfurt-style cases) that feel like "cheats" against intuitive causality. Below is a **specification for an adequate theory of moral responsibility**, designed with your request for rigor in mind. I'll outline core desiderata, flag tensions, assess major theories, and identify the knockout requirement.

  ---

  ### **I. Desiderata for a Theory of Moral Responsibility**
  *(Non-negotiable = ★; Contested/Camp-Specific = ◇)*

  1. **The Blameworthiness Intuition (★)**  
     *Requirement:* Must explain why we hold ordinary wrongdoers responsible (e.g., someone who steals knowingly and without coercion).  
     *Case:* A person deliberately lies to harm a rival. The theory must justify blaming them, not excusing them.  
     *Why non-negotiable:* Without this, the concept of moral responsibility collapses.

  2. **The Control Condition (★)**  
     *Requirement:* Agents must have *some* form of control over their actions for responsibility.  
     *Case:* A seizure causes someone to knock over a vase. We don’t blame them.  
     *Distinction:* Must separate actions (controlled) from reflexes, seizures, or external physical forces.

  3. **The Sourcehood Desideratum (★)**  
     *Requirement:* The action must genuinely *originate* from the agent, not an external source.  
     *Case:* **Manipulation scenarios** (e.g., Professor Plum in Galen Strawson’s "basic argument"): If a neuroscientist implants desires causing Plum to murder, he isn’t responsible—even if he feels "free."  
     *Why critical:* Addresses your frustration with Frankfurt cases. Even if the agent "chooses," responsibility requires the choice *itself* not to be bypassed or externally determined.

  4. **Immunity to Luck (★)**  
     *Requirement:* Responsibility cannot depend on random or arbitrary factors.  
     *Case:* Two identical agents in identical circumstances make different choices. If the difference is pure luck (quantum noise?), neither can be responsible.  
     *Physics constraint:* Aligns with indeterminism in QM not rescuing responsibility—randomness ≠ control.

  5. **Distinction: Moral vs. Legal Responsibility (★)**  
     *Requirement:* Must differentiate moral blame/praise from legal/practical accountability.  
     *Case:* A person with untreated schizophrenia commits assault. We might hold them *legally* accountable (for public safety) but not *morally* blameworthy.

  6. **Distinction: Actions vs. Outcomes (★)**  
     *Requirement:* Responsibility for *actions* (intentions, choices) vs. *outcomes* (consequences) can come apart.  
     *Case:* A careful driver hits a child who darts into traffic. They’re responsible for driving carefully (action) but not for the death (outcome).

  7. **The Frankfurt Exemption (◇)**  
     *Requirement:* A theory need **not** require the *ability to do otherwise* (satisfies Frankfurt defenders).  
     *Case:* **Frankfurt-style cases** (e.g., Jones votes for a tyrant willingly; unbeknownst to him, Black would have forced him to vote that way if he hesitated). Frankfurtians say Jones is responsible *despite* no alternative possibility.  
     *Contested:* Your intuition that this is unsatisfying points to tension with Sourcehood (Desideratum 3).

  8. **Determinism Compatibility (◇)**  
     *Requirement:* Must work in a deterministic universe (compatibilism) or require indeterminism (libertarianism).  
     *Non-negotiable for some:* Physics suggests the universe is deterministic at macro scales (QM effects often cancel out). A theory contradicting this faces scientific hurdles.

  9. **Psychology/Neuroscience Constraint (★)**  
     *Requirement:* Cannot contradict robust empirical findings (e.g., implicit biases, neural correlates of decisions).  
     *Case:* Libet-style experiments show neural activity precedes conscious intention. A theory must accommodate this without eliminating all responsibility.

  ---

  ### **II. Tensions Between Desiderata**
  - **Sourcehood (3) vs. Frankfurt Exemption (7):** If responsibility doesn’t require alternative possibilities (per Frankfurt), what ensures the agent is the *source*? Frankfurt cases may show you don’t need alternatives, but they don’t guarantee sourcehood (e.g., if Black *caused* Jones’s choice, Jones isn’t responsible).  
  - **Sourcehood (3) vs. Determinism Compatibility (8):** If determinism is true, how can the agent be the ultimate source? Their "self" is shaped by prior causes.  
  - **Immunity to Luck (4) vs. Libertarianism:** Libertarians require indeterminism for freedom, but indeterminism often introduces randomness—undermining control.

  ---

  ### **III. How Major Theories Fare Against Desiderata**
  | **Theory**               | **Key Claim**                                     | **Strengths**                                  | **Weaknesses**                                                                 |
  |--------------------------|--------------------------------------------------|-----------------------------------------------|-------------------------------------------------------------------------------|
  | **Compatibilism** (e.g., Fischer, Frankfurt) | Free will/responsibility compatible with determinism. | Aces ★1,2,5,6,7,8,9. Handles Frankfurt cases. | Struggles with ★3 (Sourcehood) and ★4 (Luck). Manipulation cases (★3) are kryptonite. |
  | **Libertarianism** (e.g., Kane, van Inwagen) | Requires indeterminism + agent-causation/control. | Strong on ★3 (Sourcehood), ★4 (if non-random). | Fails ★8 (Determinism Compatibility) and often ★9 (neuroscience). May violate ★4 if indeterminism = luck. |
  | **Semi-Compatibilism** (e.g., Fischer) | Responsibility doesn’t require alternative possibilities (only guidance control). | Aces ★1,2,5,6,7,8,9. Cleanly handles Frankfurt. | Same as compatibilism: ★3 (Sourcehood) and manipulation cases remain problematic. |
  | **Hard Incompatibilism** (e.g., Strawson, Pereboom) | No free will/responsibility (determinism or randomness eliminates it). | Consistent with ★8,9. Explains manipulation. | Rejects ★1 (Blameworthiness Intuition)—counterintuitive for everyday cases. |

  ---

  ### **IV. The Knockout Requirement**
  **Desideratum 3: Sourcehood** is the silent killer.  
  - **Why it knocks out most theories:**  
    - Frankfurt-style cases try to show you don’t need *alternative possibilities* (★7), but they **ignore sourcehood**. If Jones’s decision was *caused* by Black’s device (even counterfactually), Jones isn’t the source—yet compatibilists/semi-compatibilists still attribute responsibility. This feels like a shell game to physicists: micro-level determinism (or manipulation) voids macro-level "ownership."  
  - **The fatal case:** **Global Manipulation** (e.g., an agent’s entire character/desires are engineered by external forces). Compatibilists often say "if the manipulated desires are *theirs*, they’re responsible"—but this clashes with the intuition that responsibility requires the *self* to be un-hijacked. Libertarians handle this better but at the cost of scientific plausibility (★8,9).  

  Your hunch is correct: **Frankfurt cases expose that alternative possibilities aren’t necessary, but they don’t resolve the deeper problem of sourcehood under determinism/manipulation.** This is why even after Frankfurt, philosophers still wrestle with "strawsonian" worries (e.g., "you can’t be *causa sui*") and manipulation arguments.

  ---

  ### **V. Recommendation for Your Next Move**
  Given your physics background, focus on **sourcehood-focused theories**:
  - Read **Galen Strawson** ("The Impossibility of Moral Responsibility") for the "basic argument" against self-origination.
  - Then **John Martin Fischer** (*Responsibility and Control*) for semi-compatibilism’s response to Frankfurt.
  - Finally, **Robert Kane** (*The Significance of Free Will*) for libertarian sourcehood via "self-forming actions."

  The core tension remains: **How can macro-level responsibility emerge from micro-level causality without magic or brute luck?** As a condensed matter physicist, you’re uniquely equipped to spot where philosophers handwave emergence. Demand the same rigor you’d apply to phase transitions.
