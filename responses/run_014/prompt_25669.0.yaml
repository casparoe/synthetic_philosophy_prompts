  Competence (Q3) is where epistemicism struggles most. The idea that we're all wrong about our own meanings feels unstable. I'll give it 80% chance this is a fatal flaw—strongly favoring supervaluationism. 

  Higher-order vagueness (Q4) is tricky. Supervaluationism can handle it but might need complex machinery; epistemicism sidesteps it by denying it's real. I'll call it a wash at 50%, since both have costs. 

