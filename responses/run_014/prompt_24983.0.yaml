prompt: |-
  Play a committed defender of the view that hypocrites lack standing to blame. You hold that when someone is guilty of the very wrongdoing they're condemning, their blame isn't just rude or awkward — it's normatively defective. They lack the standing to issue it, even if everything they say about the wrongdoer is true. I'm going to push back hard. You can concede small points but never the core claim: standing to blame is a real normative phenomenon, not just a matter of ettiquette or hypocrisy being annoying.

  Here's my opening move. Suppose my partner cheats on me, and my friend — who also cheated on his own partner last year — says to me, "what she did was wrong, and you deserve better." Everything he says is true. He's not being logically inconsistent; he can perfectly well believe that both his own cheating and my partner's cheating were wrong. So what exactly is defective about his blame? If the content of the blame is true and he's not contradicting himself, what normative force is missing, and why does it matter?
reasoning: |-
  Okay, the user is setting up a philosophical debate scenario where I have to defend the position that hypocrites lack the standing to blame others. They're pushing back with a specific example: a cheating friend condemning another cheater. 

  Hmm, interesting challenge. The user clearly understands the nuances - they preemptively dismissed etiquette and logical inconsistency as counterarguments. They want me to articulate the normative defect in hypocrisy. 

  Let me break this down. The core of my defense must be that standing isn't about truth or logic, but moral authority. When the friend says "you deserve better," his own cheating undermines his right to make that moral claim. It's like a thief judging another thief - the judgment might be factually correct, but the first thief has forfeited the moral position to declare it.

  I should emphasize the performative contradiction angle. By blaming, the friend implicitly claims moral superiority he doesn't possess. His words say "this is wrong" but his actions scream "I don't actually value this norm." That creates a kind of pragmatic incoherence - his blame speech act misfires because his credibility is shot.

  The user might come back with "but the victim still hears true words of support." True, but that's separate from whether the speaker has standing to deliver them. Like how stolen money can still buy food, but that doesn't make the theft legitimate. The content isn't tainted, but the delivery mechanism is corrupt.

  I should avoid getting drawn into victim-comfort arguments. The question is about the blamer's standing, not whether the victim benefits. Maybe concede that the words might still console while maintaining they're normatively void as blame. 

  Ooh, important - I must not concede that standing is merely about social graces. Need to hammer home that this is about the very possibility of issuing moral claims. Like how a judge with conflicts of interest can't preside over a case, regardless of their legal knowledge.
answer: |-
  You've hit on precisely the crucial distinction! Your friend's statement *contains* truths: your partner's act *was* wrong, and you *do* deserve better. He's not logically inconsistent – he *can* consistently believe both acts were wrong. The defect isn't in the *content* or the *logic*, but in the **normative authority** required to *issue blame* effectively. Here's why his standing is compromised:

  1.  **The Implicit Claim of Normative Alignment:** When someone issues blame – "What she did was wrong" – they aren't *just* stating a fact. They are performing a speech act that implicitly claims: *"I occupy a position aligned with this norm such that I am entitled to hold you accountable to it."* Blame invokes a shared normative community and positions the blamer as a member in good standing within it, entitled to demand an account or express condemnation.
  2.  **Hypocrisy as a Violation of Fair Play:** Your friend, by committing the *very same* wrong recently, has demonstrated a fundamental disregard for the norm he now invokes. He hasn't played by the rules he seeks to enforce against your partner. This creates a **normative unfairness**. It's akin to demanding others pay a debt you yourself have flagrantly refused to pay. His own violation undermines his right to *demand* adherence from others or to position himself as the norm's enforcer.
  3.  **The Misfire of the Blaming Speech Act:** Because of his own transgression, his blaming utterance **misfires**. Think of it like a judge with an undisclosed, massive conflict of interest presiding over a case. The facts of the case might be clear, the law might be correctly stated, but the verdict lacks legitimacy because the *judge lacked the standing to issue it*. Similarly, your friend's words might be factually correct, but they lack the normative force *as blame* because he lacks the moral position to authoritatively invoke the norm against another violator. The "you *ought* not to have done this" loses its authoritative weight coming *from him*.
  4.  **Poisoning the Communicative Channel:** His blame is **pragmatically incoherent**. His words say "this norm matters," but his recent, unrepented actions scream "this norm is negligible when *I* want to ignore it." This contradiction between word and deed undermines the sincerity and seriousness of his condemnation. It transforms his blame from a genuine moral appeal into a performance that rings hollow or even manipulative. The *reason* the norm matters (fidelity, trust, respect) is something *he* actively undermined, so *his* invocation of it is tainted.

  **Why it matters (beyond rudeness or annoyance):**

  *   **Preserving the Integrity of Moral Norms:** Allowing hypocrites unproblematic standing to blame cheapens the norms themselves. It suggests that adherence to the norm isn't actually required to authoritatively invoke it for condemnation, weakening the norm's binding force. Standing requirements protect the normative system from being weaponized by those actively undermining it.
  *   **Preventing Exploitation:** Granting standing to hypocrites allows them to exploit the moral language for manipulation, self-justification ("See, *I* condemn it too!"), or shifting focus without addressing their own failings. It perverts the function of blame.
  *   **Focusing Accountability Where it Belongs:** Your friend's unsolicited blame, lacking standing, risks shifting attention away from *your* experience of being wronged and towards *his* defective position. It can distract from the support *you* need. Genuine support wouldn't require him to posture as a blamer; he could simply offer empathy and validation *without* claiming the moral high ground to condemn.

  **Concession:** His words might still contain *factual* truths, and they might even offer you *some* comfort as validation. *However*, as an act of *blame* – as a demand for accountability, a condemnation invoking shared norms – it is normatively defective. He lacks the requisite standing to perform *that specific speech act* with legitimacy, regardless of the truth of the propositions uttered. The force missing is the *moral authority* to hold the other person accountable for *this specific norm* due to his own recent and unrepented violation of it.

  The core claim holds: Standing is a real normative precondition for the successful performance of the act of blaming, distinct from the truth of the content or logical consistency. Your friend's hypocrisy voids his standing. Let's push further. What about the victim's need for support – doesn't that outweigh his defective standing?
