prompt: |-
  I've been going in circles on indicative vs. counterfactual conditionals and I think I've got the standard picture wrong somewhere. My understanding is: the counterfactual "if it had rained yesterday, the streets would be wet" gets the Lewis-Stalnaker closest-worlds treatment, but the indicative "if it rained yesterday, the streets are wet" is just a material conditional, so it's automaticly true on any day it didn't rain, and the whole difference is that counterfactuals use possible worlds to dodge the paradoxes of material implication while indicatives just eat the truth table. But then "if it rained yesterday, the streets are wet" being true on a dry day just feels wrong to me, so I can't be getting this right. So wich is the real story — is the indicative really the material conditional, or is there a different semantics, and where does the real difference between the two kinds live? Give me exactly five numbered points, each a sentence or two, no intro or conclusion.
reasoning: |-
  Okay, the user is struggling with indicative versus counterfactual conditionals, specifically why the indicative "if it rained yesterday, the streets are wet" feels wrong when treated as a material conditional that's automatically true on dry days. They mention Lewis-Stalnaker for counterfactuals but are confused about indicatives. 

  First, I recall that the material conditional interpretation does lead to paradoxes—like "if it didn't rain, the conditional is true"—which clashes with intuition. The user's discomfort shows they sense this mismatch. Their core question is whether indicatives really are just material conditionals or if there's more to it. 

  Looking deeper, they might be conflating truth conditions with pragmatic use. Even if the truth table says it's true when the antecedent is false, we rarely utter such conditionals unless the antecedent is plausible. That's a Gricean point—why say "if it rained" when you know it didn't? It'd be uninformative. 

  Also, the user seems unaware of strict conditional accounts where indicatives involve epistemic possibilities. For example, "if it rained" might mean "in all worlds consistent with my knowledge where it rained, streets are wet." That could explain why it feels falsifiable—it's not just about actual truth values. 

  The counterfactual distinction is clearer: it explicitly considers non-actual worlds. But for indicatives, the real difference isn't just semantics—it's context, knowledge, and speaker intent. The user needs to see that "true but misleading" is more about pragmatics than logic. 

  Finally, their request for five points suggests they want concise clarity. I'll avoid jargon and emphasize the gap between formal semantics and intuitive usage, plus the role of shared knowledge. No intro/conclusion—just straight facts.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Indicatives are not purely material:** While the material conditional analysis exists (true when antecedent is false), most semantic theories reject it as inadequate for natural language indicatives due to the "paradoxes of material implication" you noted; it fails to capture their meaning and use.
  2.  **Indicatives involve epistemic modality:** Indicative conditionals like "if it rained yesterday, the streets are wet" are typically analyzed as involving *epistemic* possibility or necessity, considering worlds compatible with the speaker's/knower's current information or beliefs.
  3.  **The difference is context and world-selection:** Both indicatives and counterfactuals involve possible worlds, but counterfactuals (like "if it had rained...") explicitly consider *non-actual*, often similar worlds where the antecedent is true, while indicatives restrict attention to worlds *compatible with current knowledge/reality* where the antecedent holds.
  4.  **Truth conditions diverge:** Under epistemic analyses (e.g., Kratzer, Stalnaker), "If it rained yesterday, the streets are wet" is true if, *within the most plausible worlds compatible with what is known* where it rained, the streets are wet; it can be false even if it didn't rain, if rain wouldn't have guaranteed wet streets.
  5.  **The real difference is non-actuality vs. epistemic uncertainty:** Counterfactuals presuppose the antecedent is false in the actual world and explore distant possibilities; indicatives leave the antecedent's actual truth value *open* (epistemically possible or unknown) within the context of utterance.
