prompt: |-
  I've been trying to understand updateless decision theory and i keep hitting a wall. If UDT just means the agent chooses the policy with the highest expected utility before it knows which decision instance it will be in, then isn't it just ordinary expected utility with a longer time horizon? Why would it ever give a different recommendation than just maximizing expected utility at the decision point, especially in Newcomb's problem, if the agent is just doing EU over policies?
reasoning: |-
  Okay, the user is struggling to understand Updateless Decision Theory (UDT) and why it's different from standard expected utility maximization. They mention that if UDT is just choosing the best policy before knowing the situation, it sounds like regular EU with a longer horizon. They're specifically confused about why UDT gives different answers in cases like Newcomb's problem.

  First, I need to address their main misconception: they think UDT is just EU over a longer time span. But UDT isn't just about time—it's about being "updateless," meaning the agent doesn't condition on its current state. That's crucial. In standard EU, you update based on your current knowledge, but UDT skips that step entirely. 

  The user might be coming from a background in decision theory, familiar with problems like Newcomb's. They probably understand causal and evidential decision theory but find UDT abstract. Their frustration suggests they've read explanations that didn't clarify the key differences. 

  Breaking down why UDT is fundamentally different: in Newcomb's problem, a CDT agent would two-box because it thinks its action now doesn't affect the prediction. UDT, however, considers all possible decision points together. It evaluates entire policies—like "always one-box"—by simulating how that policy would perform across all scenarios, including how predictors react to it. 

  The user might not grasp how UDT handles correlated decisions. For instance, in Parfit's Hitchhiker, UDT's policy-level thinking forces the agent to commit to paying later, which changes the driver's decision. Standard EU at the decision point would say "don't pay" because the ride is already given, but UDT pre-commits to policies that make promises credible. 

  I should emphasize that UDT avoids self-locating uncertainty by treating all instances as part of a single policy choice. Examples like the XOR Blackmail show this: conditioning on not being blackmailed leads to bad outcomes, while UDT's policy ignores that update. 

  The user's deeper need is likely to reconcile UDT's approach with their existing understanding of rationality. They might be seeking why UDT is necessary if existing theories seem sufficient. Highlighting the "updateless" aspect as a solution to anthropic and self-referential problems could help. 

  I should also clarify that UDT isn't always computationally feasible—it's a theoretical framework. The user might benefit from concrete examples where conditioning on the present leads to suboptimal outcomes, which UDT avoids by evaluating policies upfront. 

  In conclusion, the key points are: UDT's policy-first approach, avoidance of state-specific updates, and handling of predictors or correlated decisions through global policy evaluation. Making these contrasts clear should address their confusion.
answer: |-
  You've hit on a core conceptual challenge in understanding UDT! While your intuition has elements of truth, UDT is fundamentally different from standard sequential expected utility maximization (EU) *because it deliberately avoids conditioning on the information available at the specific decision point*. This "updateless" aspect is key and leads to different recommendations in crucial problems.

  Let's break down why UDT differs:

  1.  **The Core Difference: Avoiding the "Update"**
      *   **Standard EU (Sequential):** At each decision point, the agent conditions on *all information it has at that moment* (including its current location, observations, etc.). It calculates the expected utility of *actions* available *now*, given this updated state of knowledge. It then chooses the best action *for this specific situation*.
      *   **UDT:** *Before* any observation or self-location, the agent chooses a complete *policy* (a mapping from any possible information state it *could* find itself in to an action). Crucially, **it evaluates the expected utility of this entire policy *without conditioning on which specific information state it actually ends up in***. It averages the outcomes over *all* possible decision instances it *might* be, weighted by their probabilities, *as if it hadn't yet learned which one it is*.

  2.  **Why Avoid the Update? The Problem with Self-Locating Uncertainty & Predictors**
      The standard update becomes problematic when:
      *   **The agent's existence or state is correlated with the outcome:** (e.g., Anthropic problems, Sleeping Beauty).
      *   **A predictor bases its decision on what policy you *would* follow:** (e.g., Newcomb's Problem, Parfit's Hitchhiker).
      *   **The decision affects other logically correlated instances of "you":** (Logical uncertainty, coordination problems).
      Conditioning on your current state in these situations often throws away vital information about the *counterfactual* worlds where you are in a different state or the predictor's reasoning.

  3.  **Newcomb's Problem: UDT vs. Sequential EU/CDT/EDT**
      *   **Problem:** Predictor (accurate) puts $1M in Box B iff it predicts you will take *only* Box B. Box A always contains $1000.
      *   **Sequential EU (CDT/EDT at decision point):**
          *   You *know* the money is already in the boxes. The predictor is gone.
          *   CDT: Taking both boxes dominates (get $1000 + $1M if B full, or $1000 + $0 if B empty). You get $1000 more regardless. Predictor's past action is fixed.
          *   EDT: Conditioning on being at the decision point, taking only B is evidence the predictor put $1M there. Taking both is evidence it didn't. Taking only B seems better.
          *   **Result:** CDT takes both ($1000), EDT takes only B ($1M).
      *   **UDT:**
          *   *Before* knowing anything (including the predictor's prediction or your current state), you choose a policy: `f(info) = action`.
          *   Consider two policies:
              *   `P1: Always take both boxes.`
              *   `P2: Always take only Box B.`
          *   Evaluate *expected utility of the policy*, *without* conditioning on being at the decision point:
              *   `P1`: Predictor sees you use P1 -> Predicts "both" -> Puts $0 in B -> You get $1000 (from A) in *all* worlds where you are faced with Newcomb.
              *   `P2`: Predictor sees you use P2 -> Predicts "only B" -> Puts $1M in B -> You get $1,000,000 (from B) in *all* worlds where you are faced with Newcomb.
          *   `P2` ($1M) >> `P1` ($1000).
          *   **Result:** Choose policy `P2` (take only Box B). Commit to it *updatelessly*.
      *   **Why different from Sequential EU?** The sequential EU agent (especially CDT) *conditions on already being at the decision point after the predictor has made its decision*. This makes the predictor's action seem causally independent of its *current* choice. UDT, by choosing the policy *before* this conditioning, correctly captures that the *type of policy* you commit to *determines* the predictor's action. UDT cares about the *global* performance of the policy across all possible instances.

  4.  **Parfit's Hitchhiker: A Clearer Example of the Difference**
      *   **Problem:** Lost in desert. Driver offers ride only if you *promise* to pay $1000 later (once safe). He can tell if you are sincere. If you promise and he gives the ride, do you pay later?
      *   **Sequential EU at Payment Point:** You are safe. Paying costs $1000, not paying saves $1000. Driver is gone. *Conditional on being safe*, not paying dominates (+$1000 > $0).
      *   **UDT:**
          *   Choose policy *before* desert: `f(info) = action`.
          *   Consider policies:
              *   `P_PromisePay`: If driver asks, promise & pay later. (Sincere)
              *   `P_PromiseCheat`: If driver asks, promise & *don't* pay later. (Insincere)
          *   Evaluate expected utility *without* conditioning:
              *   `P_PromisePay`: Driver detects sincerity -> Gives ride -> You survive & pay $1000 -> Net Utility: Survival - $1000.
              *   `P_PromiseCheat`: Driver detects insincerity -> *Doesn't give ride* -> You die -> Net Utility: Death (or -infinity).
          *   `P_PromisePay` (Survival - $1000) >> `P_PromiseCheat` (Death).
          *   **Result:** Commit to `P_PromisePay`. Pay the $1000 when safe.
      *   **Why different?** The sequential agent conditions on *already being safe*, making payment seem like a pure loss. UDT recognizes that the *only reason* it's safe is because it committed (via its policy) to paying. The policy evaluation *before* conditioning ensures this dependency is captured. Not paying is only possible if you weren't sincere, but if you weren't sincere, you *wouldn't have gotten the ride and wouldn't be safe to begin with*.

  5.  **The "XOR Blackmail" Problem: Highlighting the Update Issue**
      *   **Problem:** A predictor flips a coin. If Heads, it sends blackmail to you *only if* it predicts you will pay. Paying costs $100. If you pay when blackmailed, nothing happens. If you *don't* pay when blackmailed, it exposes a secret costing $10,000. If Tails, no blackmail is sent.
      *   **Sequential EU (Conditioning on No Blackmail):** You receive no blackmail. Paying $100 achieves nothing. Not paying costs nothing. **Not paying** seems best.
      *   **Sequential EU (Conditioning on Blackmail):** Paying costs $100. Not paying costs $10,000. **Paying** seems best.
      *   **Problem:** The predictor only sends blackmail if it predicts you *would* pay *if* blackmailed. If you follow the sequential logic ("Don't pay if not blackmailed, Pay if blackmailed"), the predictor *will* send blackmail on Heads (because you pay when blackmailed). Outcome: Heads (50%) -> Pay $100 -> Net -$100; Tails (50%) -> Pay nothing -> Net $0. Expected Utility: **-$50**.
      *   **UDT:**
          *   Choose policy: `f(Blackmail?) = Pay?`.
          *   Consider policies:
              *   `P_PayNever`: Never pay, regardless of blackmail.
              *   `P_PayIfBlackmailed`: Pay iff blackmail received.
          *   Evaluate expected utility *without* conditioning:
              *   `P_PayNever`: Predictor sees you never pay -> Only sends blackmail if it predicts you pay *if blackmailed* -> But you don't -> Predictor *never* sends blackmail. Outcome: Always no blackmail, no payment, no exposure. Net $0.
              *   `P_PayIfBlackmailed`: Predictor sees you pay if blackmailed -> Sends blackmail *if Heads* -> On Heads: Blackmail -> You Pay -> Net -$100; On Tails: No blackmail -> You Don't Pay -> Net $0. Expected Utility: 0.5 * (-$100) + 0.5 * $0 = **-$50**.
          *   `P_PayNever` ($0) > `P_PayIfBlackmailed` (-$50).
          *   **Result:** Commit to `P_PayNever`. If you miraculously *did* receive blackmail (despite your policy), you *still* wouldn't pay.
      *   **Why different?** Conditioning on *not* receiving blackmail in the sequential approach makes paying appear pointless. However, the *reason* you didn't receive blackmail is intrinsically linked to your *counterfactual behavior* if you *had* received it (i.e., your policy). UDT captures this by evaluating the policy's global consequences, including how it prevents blackmail from being sent in the first place. The sequential agent, by updating on "no blackmail," blinds itself to this crucial dependency. Following the sequential "don't pay if not blackmailed" rule actually *causes* the blackmail to be sent on Heads, making you worse off.

  **In Summary:**

  *   **UDT is not just EU over a longer time horizon.** It's EU over *policies*, evaluated **without conditioning on the specific decision state the agent finds itself in**.
  *   **The "updateless" aspect is crucial:** UDT avoids the standard Bayesian update that throws away information about counterfactual situations where the agent could have been different or how predictors/logically correlated agents would have reacted to its *overall policy*.
  *   **This difference matters in problems involving:**
      *   **Predictors:** Where your *disposition* (policy) influences the past prediction.
      *   **Commitment/Precommitment:** Where your future actions depend on your current commitment.
      *   **Logical Correlation:** Where your decision affects other logically linked agents/decision points.
      *   **Anthropic Reasoning/Self-Locating Uncertainty:** Where conditioning on your existence biases the outcome.
  *   **UDT "wins"** in these problems because it correctly accounts for the *acausal* or *logical* dependencies between the agent's policy and the state of the world *before* the agent updates on its specific location.

  UDT treats the agent not as a myopic optimizer at a point, but as a *designer* choosing a complete rule for behavior *in advance*, where the rule's global performance is what matters, not its performance conditional on a specific state that the rule itself might have influenced. This fundamental shift in perspective is what makes UDT unique.
