prompt: |-
  I'm a PhD student in philosophy working on decision theory, and this term I'm TA-ing an undergraduate seminar on rational choice: 22 students, one 80-minute section, movable desks, and a strict no-laptops policy I'd like to keep for this meeting. Next week's topic is expected value maximization and the problem of fanaticism — the observation that strict EV maximization seems to commit you to accepting arbitrarily tiny probabilities of arbitrarily enormous payoffs, and that some philosophers treat this as a reductio of the theory while others bite the bullet. Rather than lecturing on it, I want the students to construct the dilemma themselves and only discover where they've arrived afterward. Please design a runnable in-class game along these lines.

  What I have in mind is something like a charity-allocation exercise: small groups invent their own interventions, each with a probability of success and a payoff (in points), and then compete or bid for a share of a fixed pool — so that the escalating tradeoff between near-certain modest gains and vanishingly rare astronomical ones emerges from their own choices rather than from a slide I hand them. I'd like a points economy where points convert to something real but small (snacks, homework tokens), a resolution mechanic built on physical randomization (dice, coin flips, a spinner) so the randomness is vivid rather than simulated, and enough repetitions that the class experiences both a large payout actually landing and long demoralizing dry spells. The payoff scheme should make the fanatic option ex ante optimal while keeping the downside of losing genuinely modest. The debrief should map specific moments in the game onto parts of the philosophical dispute: where risk aversion entered as a candidate defeater, the point at which the numbers blew past any representable real-world quantity, the moment someone inevitably proposed a Pascal's-mugging-style counter-offer, and the question of whether the class's aggregate allocation starts looking like a social choice problem rather than an individual decision problem. Don't name the philosophical positions or the thought-experiment literature until the very end — I want them to arrive at fanaticism's pull from the inside, including the version where a single tiny harm spread across an incomprehensibly large number of people outweighs one grave harm.

  Please include: complete rules and a materials list, a phase-by-phase timeline, the payoff scheme with the arithmetic worked out, the debrief structure, a candid note on what the activity cannot possibly reproduce (real astronomical stakes, nonlinear utility in the reward currency, interpersonal aggregation across persons) and what I'll have to supply verbally, plus a list of what predictably goes wrong the first time (groups inflating payoffs into meaninglessness, a huge payout landing in round one and muddying everything, someone refusing to play at all and insisting that refusal was the rational move). After the prose description, give me a structured summary as a JSON object with the following fields: activity_name (string), materials (array of strings), phases (array of objects, each with name, minutes, mechanic, and idea_it_targets), payoff_scheme (string), failure_modes (array of strings), cant_reproduce (array of strings), and facilitator_must_supply (array of strings). Everything in American English, please.
reasoning: |-
  We are designing an in-class activity to illustrate expected value maximization and the problem of fanaticism. The key idea is to have students, in small groups, design "interventions" with a probability of success and a payoff. Then, the class will allocate a fixed pool of resources (points) to these interventions, and we will run a physical randomization to see which interventions succeed. The goal is for the students to experience the tension between low-probability high-payoff and high-probability low-payoff options.

  Activity Name: "The Fanaticism Dilemma"

  Materials:
  - 22 students, divided into 4-5 groups (about 5 per group).
  - Movable desks for group work.
  - Whiteboard or large paper for recording interventions and allocations.
  - Markers.
  - A randomizing device: we suggest a 10-sided die (d10) for probabilities (since it can represent 10%, 20%, ... 100%) and a standard 6-sided die (d6) for additional randomness if needed. Alternatively, a spinner with 10 sections (each 10%).
  - Tokens or chips to represent points (or just record on the board).
  - Small rewards: snacks or homework tokens (to be distributed at the end based on points).

  Phases:

  1. Introduction (5 minutes)
     - Explain that they are philanthropists allocating a fixed pool of resources (points) to different interventions. Each intervention is proposed by a group and has:
          - A probability of success (expressed as a percentage, must be a multiple of 10% from 10% to 100%)
          - A payoff in points (if successful)
     - The total pool of points for the class to allocate is fixed (say, 100 points per round). We'll have multiple rounds.

  2. Group Proposal Phase (15 minutes)
     - Groups invent their own interventions. They must name the intervention, set a probability (p) and a payoff (v). The expected value (EV) is p/100 * v.
     - Encourage creativity but also strategic thinking: they want to attract allocations.

  3. Auction/Allocation Phase (15 minutes)
     - Each group presents their intervention (name, p, v, and a brief description). Write these on the board.
     - The class has a fixed pool of points (100 points) to allocate across the interventions. Any student (or group) can allocate any number of their points to any intervention (but the total allocated by the class must be <= 100). They can split their own points arbitrarily.
     - Note: The allocation is done by individual students, but they can discuss. Alternatively, to simplify, we could have each group (representing a philanthropic organization) allocate from a share of the pool? But the problem says "compete or bid for a share of a fixed pool". Let's make it a market: groups are pitching, and each student individually has a budget? But that complicates the accounting.

     Instead, let's assign each student an equal share of the pool. With 22 students and 100 points, each student gets about 4.5 points. To avoid fractions, we can set the pool to 110 points (5 per student) or 88 points (4 per student). Alternatively, we can use tokens and have each student get 5 tokens (so 110 tokens total). Then each student allocates their 5 tokens to one or more interventions (by placing tokens in cups labeled for each intervention? or writing on a sheet?).

     We'll go with: each student gets 5 tokens (each token = 1 point). They can allocate their tokens to any of the proposed interventions. They can split their tokens arbitrarily (even fractions? but tokens are discrete, so whole tokens). So each student has 5 tokens to allocate.

     After all allocations, we calculate the total tokens allocated to each intervention.

  4. Resolution Phase (15 minutes per round, and we plan for 2 rounds)
     - For each intervention, we resolve whether it succeeds. For an intervention with probability p (say 30%), we roll a d10. If the roll is <= p/10 (so for 30%, we need 1,2,3) then it succeeds. Otherwise, fails.
     - If an intervention succeeds, then every token allocated to that intervention by any student pays off: each token gets v points (the payoff). So if a student allocated 2 tokens to an intervention that succeeds and has a payoff of 100, that student gets 2 * 100 = 200 points.
     - If it fails, tokens allocated to it yield 0.

     Example: 
       Intervention A: p=30%, v=100.
       Student A allocated 2 tokens to A. 
       Roll d10: 1-3 success, 4-10 failure. 
       If roll=2 (success), then Student A gets 2 * 100 = 200 points.

     Note: The payoff is per token, and tokens are points in the allocation. So the payoff is multiplicative.

     We do this for every intervention. Then we record the points for each student.

  5. Repeat for 2-3 rounds (with new proposals each round? or same? Let's have groups propose new interventions each round to adapt). So another 15 minutes for group proposal (but shorter since they know the drill) and 15 for allocation, then 15 for resolution. 

     Total time: 
          Introduction: 5
          Round 1: Proposal 15, Allocation 15, Resolution 15 -> 45
          Round 2: Proposal 10, Allocation 10, Resolution 10 -> 30
          (Total 80 minutes)

     But we need to leave time for debrief. Let's do only 2 rounds and shorten the second round.

     Revised timeline:
          Introduction: 5 min
          Round 1: 
              Proposal: 10 min
              Allocation: 10 min
              Resolution: 10 min
          Round 2: 
              Proposal: 8 min
              Allocation: 8 min
              Resolution: 8 min
          Debrief: 21 min

     Total: 80 minutes.

  6. Debrief (21 minutes)
     - Start by asking: "What strategies did you use? What worked and what didn't?"
     - Then: "Did anyone notice a tension between safe bets and long shots? How did you feel when a long shot paid off? How about when it didn't?"
     - Map to the philosophical problem:
          - Risk aversion: Did anyone avoid the high-risk high-reward even though the EV was higher? Why?
          - The astronomical payoff: At what point did the numbers become so big that they felt unreal? Did that affect your decision?
          - Pascal's mugging: Did any group propose an intervention with an extremely tiny probability and an enormous payoff? How did the class react? Did anyone allocate to it? Why or why not?
          - Social choice: How did the aggregate allocation of the class look? Did it reflect a collective rationality? Or were there coordination problems?
          - The fanaticism dilemma: Point out that strict EV maximization would require putting all tokens on the highest EV intervention, regardless of the probability (if the EV is higher). But in practice, did you? Why not?
          - Finally, reveal the philosophical context: expected value maximization, fanaticism, Pascal's mugging, and the critiques.

  Payoff Scheme:
     - Each student starts each round with 5 tokens (points to allocate).
     - When an intervention succeeds, each token allocated to it yields the intervention's payoff (v) in points.
     - When it fails, tokens allocated yield 0.
     - So the expected return for one token on an intervention with probability p and payoff v is (p/100)*v.

     We want to set up a situation where a fanatic option (very low p, very high v) has the highest EV. For example:

          Safe option: p=90%, v=10 -> EV=9
          Risky option: p=10%, v=100 -> EV=10
          Fanatic option: p=1%, v=2000 -> EV=20

     But note: we are using d10 so p must be multiples of 10%. We can adjust by allowing groups to set p to any multiple of 10% (so 10%, 20%, ... 100%) and v any positive integer.

     We might need to guide the proposals to get a fanatic option. Alternatively, we can let groups propose freely and then the instructor can add one or two extreme options if they don't arise. But the problem says "groups invent their own interventions". So we must hope that one group proposes a fanatic option. Alternatively, we can secretly seed one group to propose a fanatic option? But that might be against the spirit.

     Alternatively, we can set a rule: the payoff cannot exceed a certain limit? But we want them to go big.

     We'll trust that at least one group will propose a high-payoff low-probability option, especially after the first round if they see a big win.

     Also, note: the payoff v is the same for every token. So if an intervention has a high v, it can pay off big for anyone who allocated to it.

  Failure Modes:
     - Groups inflating payoffs: We might get proposals like "p=10%, v=1000000". That's okay, but we must be able to resolve. The physical die can handle any probability that is a multiple of 10%. The payoff is just a number. But if it's too big, it might break the point system. We can set a rule: payoffs must be between 1 and 10000? But we don't want to stifle. Alternatively, we can let them and then the points become astronomical. That's part of the lesson: the numbers become unmanageable.

     - A huge payout landing in round one: If a fanatic option (say p=10%, v=1000) is proposed and someone allocates to it and it wins, then that student gets 5000 points (if they put all 5 tokens) and then they are way ahead. This might make everyone chase the fanatic option in round two. That's okay because then we can see the dry spell: if in round two the fanatic option fails, they get zero. And then we have the tension.

     - Someone refusing to play: They might say that allocating to anything is irrational because the points are fake or because they don't believe in the probabilities. We can address by saying: "In this thought experiment, we are assuming the probabilities are as stated and the payoffs are real (in terms of the rewards). But if someone refuses, let them. Then in the debrief, we can discuss: was that rational?"

  What we cannot reproduce:
     - Real astronomical stakes: The rewards are small (snacks, homework tokens) so the utility is linear? But in reality, with huge stakes, utility might be nonlinear (diminishing marginal utility). We have to assume linear utility in points.
     - Interpersonal aggregation: The activity is about individual allocation. But the problem of tiny harms spread over many people is about aggregation. We can mention in the debrief: "What if the intervention with low probability and huge payoff was actually causing a tiny harm to a huge number of people? How would that change things?" But we cannot simulate that in the game.
     - The real emotional weight of losing: The downside is modest (losing a few tokens) so risk aversion might be less than in life-and-death situations.

  Facilitator must supply:
     - The assumption of linear utility in points (so that EV maximization is rational).
     - The idea that the probabilities are known and objective (so no epistemic issues).
     - The aggregation problem: we can pose a hypothetical in the debrief: "Imagine an intervention that has a 10% chance of giving 1000 points to one person, but also a 90% chance of causing 1 point of harm to each of 1000 people. How would you model that?"

