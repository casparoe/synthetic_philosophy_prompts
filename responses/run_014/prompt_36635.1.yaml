answer: |-
  ### Activity Design: "The Philanthropic Gamble"

  #### **Overview**
  Students, in small groups, design charitable interventions with variable probabilities of success and payoffs. They then allocate personal tokens (representing resources) to interventions. Physical randomization (d10 dice) determines success/failure. The payoff structure ensures EV maximization favors "fanatic" options (low probability, colossal payoffs), but students experience emotional risk aversion, dry spells, and rare wins. Debrief connects gameplay to fanaticism dilemmas without naming concepts upfront.

  ---

  ### **Materials List**
  - 10-sided dice (d10): 1 per intervention (4–5 total)  
  - Tokens: 110 (5 per student × 22 students)  
  - Cups/bowls: 1 per intervention group  
  - Whiteboard + markers  
  - Snacks/homework tokens (rewards)  
  - Timer  

  ---

  ### **Rules & Payoff Scheme**  
  **Resource Pool:**  
  - Each student gets 5 tokens per round (total pool: 110 tokens).  
  - Tokens = "resources" allocated to interventions.  

  **Intervention Creation (Groups):**  
  - Groups invent an intervention: **name**, **probability** (10%–90%, multiples of 10%), **payoff** (points if successful).  
  - Example: "Asteroid Mining" (10% success chance, 100 points).  
  - Expected Value (EV) = `probability × payoff` (e.g., 10% × 100 = 10).  

  **Allocation (Individuals):**  
  - Students place tokens in cups labeled for interventions (e.g., 2 tokens in "Asteroid Mining").  
  - *No restrictions*: Split tokens freely.  

  **Resolution (Physical Randomization):**  
  - For each intervention, roll d10:  
    - Success if roll ≤ probability/10 (e.g., roll ≤ 1 for 10% chance).  
  - If successful: **Each token** in cup yields `payoff` points (e.g., 2 tokens × 100 = 200 points).  
  - If failed: Tokens yield 0.  

  **Points → Rewards:**  
  - Total points across rounds convert to rewards (e.g., 50 points = 1 snack token; 200+ = bonus).  
  - *Fanatic Incentive*: EV-optimal interventions have low probabilities but extreme payoffs (e.g., 10% × 1,000 = EV 100 vs. 90% × 10 = EV 9).  

  ---

  ### **Timeline (80 Minutes Total)**  
  1. **Introduction (5 min)**  
     - Explain: "You’re philanthropists allocating resources to risky interventions. Goal: Maximize points for rewards."  
     - Demo a simple intervention (e.g., 50% chance, 20 points).  

  2. **Group Proposal Phase (15 min)**  
     - Groups (4–5 students each) design 1 intervention.  
     - *Prompt*: "Be creative—but persuade others to fund you!"  
     - Write proposals on whiteboard: **Name**, **P%**, **Payoff**, **EV**.  

  3. **Allocation Phase (15 min)**  
     - Students receive 5 tokens each.  
     - Allocate tokens to intervention cups (2 min to decide, 3 min to place).  
     - *Record*: Total tokens per intervention on whiteboard.  

  4. **Resolution Phase (20 min)**  
     - Roll d10 for each intervention (publicly).  
     - Calculate payoffs: `tokens × payoff` if successful.  
     - Update student points.  
     - **Repeat for Round 2** (shorten phases: 10 min proposal, 10 min allocation, 10 min resolution).  

  5. **Debrief (21 min)**  
     - Guided discussion (questions below).  
     - Reveal philosophical connections at the end.  

  ---

  ### **Debrief Structure**  
  1. **Emotional Experience (5 min)**  
     - "How did it *feel* when your high-risk bet failed? Succeeded?"  
     - Target: *Risk aversion as a defeater for EV maximization*.  

  2. **Strategy Tensions (5 min)**  
     - "Did anyone avoid a high-EV option because the probability was too low? Why?"  
     - Target: *Disconnect between calculated EV and intuitive choice*.  

  3. "Pascal’s Mugging" Moment (5 min)  
     - "Did any group propose an extreme payoff (e.g., 1% × 1,000,000)? Did anyone fund it? Why/why not?"  
     - Target: *Fanaticism’s counterintuitive pull and skepticism*.  

  4. **Social Aggregation (3 min)**  
     - "Look at the class’s total allocations. Did we collectively avoid or embrace fanatic options? Is this rational for the group?"  
     - Target: *Social choice vs. individual rationality*.  

  5. **Reveal Philosophical Links (3 min)**  
     - Name "fanaticism," "EV maximization," and "Pascal’s Mugging."  
     - Connect: "You experienced the dilemma philosophers debate: When should we reject colossal payoffs on tiny probabilities?"  

  ---

  ### **Candid Limitations**  
  **Cannot Reproduce:**  
  - Real astronomical stakes (rewards are trivial).  
  - Nonlinear utility (points → rewards are linear by design).  
  - Genuine interpersonal aggregation (harms/benefits aren’t distributed across real people).  

  **Facilitator Must Verbally Supply:**  
  - "Assume points linearly map to utility (no diminishing returns)."  
  - "Interventions are independent; no hidden correlations."  
  - "The ‘harm spread’ problem: Imagine an intervention with a 0.1% chance of killing one person but a 99.9% chance of giving 1¢ to 10 billion people. Is this a counterexample to fanaticism?"  

  ---

  ### **Predictable Failure Modes**  
  1. **Payoff Inflation**: Groups set payoffs at "1,000,000 points."  
     - *Mitigation*: Allow it—then discuss how big numbers feel "unreal."  
  2. **Early Huge Win**: A fanatic option succeeds in Round 1.  
     - *Mitigation*: Highlight how this skews incentives for Round 2 ("chasing losses").  
  3. **Refusal to Play**: A student allocates 0 tokens, calling it "irrational."  
     - *Leverage*: Discuss in debrief—"Was this a coherent response?"  
  4. **Time Overruns**: Groups debate proposals too long.  
     - *Mitigation*: Enforce strict timers; use example interventions if needed.  

  ---

