  ---
  **Key Tips**  
  - **Intervene Lightly**: Let students "discover" fanaticism; only guide if no extreme options emerge (e.g., whisper: "What if you offered 10,000 points?").  
  - **Embrace Chaos**: Early huge wins or refusals to play are teachable moments.  
  - **Reward Sparingly**: Keep snacks modest to preserve linear utility illusion.  

  This design forces students to confront fanaticism viscerally, making the philosophical dilemma inescapable during debrief. Good luck!
