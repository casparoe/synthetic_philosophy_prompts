answer: |-
  ### Procedure: Robust Decision-Making Under Deep Uncertainty  
  *Execute within one week. Document each step concisely on one page.*

  ---

  #### **Step 1: Elicit and Bound the Set of Probabilities (Days 1-2)**  
  - **Elicitation**: For each uncertain parameter (e.g., probability of harm/benefit):  
    - Collect *all* estimates (experts, models, data). Require sources to disclose disagreement, model bounds, and data sparsity.  
    - Record as intervals (e.g., [L, U]) or finite sets (e.g., {p₁, p₂, p₃}). If dependencies exist, define constraints (e.g., "p_benefit + p_harm ≤ 1").  
  - **Bounding**:  
    - Combine estimates into a single *admissible set* (e.g., interval union: [min(Lᵢ), max(Uᵢ)]).  
    - If sets conflict, retain the broadest plausible bounds. Flag unresolved disagreements.  
  - **Output**: Admissible set 𝒫 for each probability. Example:  
    > *Screening harm probability: 𝒫 = [0.05, 0.15] (Data: Study A [0.05–0.10]; Model B [0.08–0.15]).*

  #### **Step 2: Choose a Decision Rule (Day 3)**  
  - **Rule Selection**: Default to **maximality** (least restrictive, avoids domination). Override if:  
    - Policy mandates extreme caution → **maximin** or **maximin expected utility (MEU)**.  
    - Agency has explicit risk-reward preference → **Hurwicz** (set α = 0.5 if neutral; α = 0.7 if pessimistic).  
    - Legal/ethical need for "optimality" justification → **E-admissibility**.  
  - **Defense**:  
    - *For maximality*: "No option is universally worse; avoids premature exclusion."  
    - *For MEU*: "Aligns with agency’s risk-averse mandate (cite policy)."  
    - *Meta-uncertainty*: Use maximality unless agency policy breaks ties.  
  - **Output**: Chosen rule + 1–2 backups. Example:  
    > *Rule: Maximality (backup: MEU). Justification: Agency prioritizes avoiding dominated choices.*

  #### **Step 3: Apply Rules and Resolve Disagreements (Days 4-5)**  
  - **Compute Expected Utilities (EU)**: For each option, calculate EU bounds over 𝒫.  
  - **Apply Rules**:  
    - **Maximin**: Pick option with highest min-EU.  
    - **MEU**: Pick option with highest min-EU over worst-case distribution in 𝒫.  
    - **Hurwicz**: EU = α·min-EU + (1−α)·max-EU; pick highest.  
    - **E-admissibility**: Retain options optimal under *any* p ∈ 𝒫.  
    - **Maximality**: Retain options not dominated *everywhere* in 𝒫.  
  - **Handle Disagreements**:  
    - If rules agree → **adopt/reject**.  
    - If rules disagree:  
      - Elevate if residual risk tolerance is key (Step 5).  
      - Else, default to **maximality** (retains all non-dominated options).  
  - **Output**: EU bounds, rule outputs, and decision. Example:  
    > *EU(screening) = [0.25, 6.75]. Maximality: Adopt; MEU: Adopt → Agree.*

  #### **Step 4: Avoid Evidence Traps (Day 6)**  
  - **New Evidence?**: Only collect if:  
    - Expected to *reduce* 𝒫 (e.g., targeted at key uncertainty).  
    - VOI (Value of Information) > cost (estimate uncertainty reduction).  
  - **If 𝒫 widens**: Revert to pre-evidence 𝒫. Flag as "irresolvable uncertainty."  
  - **Output**: Evidence decision + 𝒫 update. Example:  
    > *No new evidence: VOI low; model suggests 𝒫 may widen.*

  #### **Step 5: Stopping Conditions and Elevation (Day 7)**  
  - **Stop with "No"** if:  
    - Maximin or MEU EU < threshold (e.g., catastrophic harm: EU < −100).  
    - Status quo dominates all new options under maximality.  
  - **Elevate to Named Person** (e.g., **Director of Risk Tolerance**) if:  
    - Rules disagree irreconcilably.  
    - Options are tied on EU bounds, and choice hinges on *risk tolerance* (not facts).  
  - **Output**: Final decision or elevation. Example:  
    > *Elevate to Director: Choice between A (high upside) and B (safe) requires risk tolerance judgment.*

  ---

  ### **Example Applications**  
  #### **Proposal 1: Cancer Screening Program**  
  - **Uncertainties**:  
    - Benefit (true positive): 𝒫 = [0.70, 0.90] (Data: Sparse trials).  
    - Harm (false positive): 𝒫 = [0.05, 0.15] (Experts disagree).  
  - **Utilities**: True positive (+100), false positive (−50), true/false negative (0).  
  - **EU Calculation**:  
    - EU(Adopt) = [0.25, 6.75]; EU(Reject) = 0.  
  - **Rules**:  
    - **Maximin**: Adopt (min-EU = 0.25 > 0).  
    - **MEU**: Adopt (worst case: EU = 0.25 > 0).  
    - **Maximality**: Adopt (not dominated by Reject).  
  - **Decision**: Adopt. *You like this.*  

  #### **Proposal 2: Novel Vector-Control Intervention**  
  - **Uncertainties**:  
    - Benefit (vector control): 𝒫 = [0.6, 0.8] (Model bounds).  
    - Harm (ecological damage): 𝒫 = [0.1, 0.3] (Sparse data + expert disagreement).  
  - **Utilities**: Success no-harm (+100), success with harm (+20), failure with harm (−50), no harm (0).  
  - **EU Calculation**:  
    - EU(Intervention) = [39.6, 72.6]; EU(Status Quo) = 0.  
  - **Rules**:  
    - **Maximin**: Adopt (min-EU = 39.6 > 0).  
    - **MEU**: Adopt (worst case: EU = 39.6 > 0).  
    - **Maximality**: Adopt (not dominated).  
  - **But Add Alternative Intervention C**:  
    - EU(C) = [46.75, 69.29] (more stable but lower upside).  
  - **Now Rules Disagree**:  
    - **Maximin/MEU/Hurwicz**: Prefer C (higher min-EU).  
    - **Maximality**: Both admissible (C has higher min; Intervention has higher max; neither dominates).  
  - **Elevate**:  
    > *To Director: Choose between Intervention (higher upside, riskier) and C (safer). Depends on agency’s risk tolerance.*  
  - **Decision**: You dislike this—elevation delays action, but maximality avoids arbitrary choice.  

  ---

  ### **What the Procedure Cannot Settle**  
  The procedure **cannot resolve decisions** where:  
  1. **Risk tolerance is pivotal** (e.g., Proposal 2 with tied options after rules).  
  2. **𝒫 is irreducible** (e.g., new evidence widens uncertainty).  
  3. **No option is unambiguously worst-case safe** (MEU rejects all).  
  These require elevated judgment by the named risk-tolerance decider.  

  **Final Output**: One-page report (template [here](https://example.org/risk-template)).
