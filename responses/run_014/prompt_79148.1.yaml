prompt: |-
  I have recently become the analyst who prepares the risk assessments on which my agency's scientific advisory committee decides whether to adopt a proposed intervention. My colleagues keep handing me a single best-estimate number for the relevant probability, and I no longer think that number is honest: what we actually have is a set of disagreeing estimates, a model identified only within bounds, and sparse data. Once the probability is a set rather than a point, expected-utility maximisation stops telling me what to do, and I know there are rival replacements -- maximin (do as well as possible in the worst case), maximin expected utility (do as well as possible under the worst admissible distribution), Hurwicz (a blend of the best and worst cases), E-admissibility (admit any option that is optimal under some admissible distribution), and maximality (admit any option that no other option beats under every admissible distribution). Write me a procedure my team can run on any proposal, within about a week and recorded on a page: how to elicit, bound and record the set; how to choose among these rules and defend the choice, given that choosing a rule is itself a decision under the uncertainty we are trying to handle; what to do when the rules disagree; how to avoid the trap in which collecting more evidence makes the set wider rather than narrower; where the procedure stops with a no; and where it must hand the decision to a named person because the residual question is how much risk we are willing to accept rather than a question of fact. Then run it on two proposals -- a screening programme whose benefit and harm are both uncertain, and a novel vector-control intervention with an imprecise ecological risk -- including one whose answer I will not like, and close by saying what the procedure cannot settle.
reasoning: |-
  We are designing a procedure to handle decision-making under deep uncertainty, where probabilities are sets rather than points. The procedure must be executable within about a week and fit on one page. We'll break it down into steps.

  ### Procedure: Robust Decision Making under Deep Uncertainty

  **Step 1: Elicit and Bound the Set of Admissible Probabilities (2 days)**
     - For each uncertain parameter (e.g., probability of harm, benefit), gather the following:
       - Existing data (sparse or rich) and models (including bounds from model identification).
       - Expert estimates (if multiple experts, record each estimate and their disagreement).
     - Represent the uncertainty as a set of possible values (e.g., intervals, sets of distributions). For probabilities, use:
          - A closed interval [L, U] for each probability (if unimodal, but bounded).
          - Or, if there are multiple scenarios, a finite set of point estimates (from experts) along with bounds from models and data.
     - If there are dependencies between parameters, capture them via constraints (e.g., via linear constraints or by specifying a set of joint distributions). If dependencies are unknown, assume independence in the set (which is conservative) or state the lack of knowledge.
     - Record: For each parameter, the set (or sets) of possible values, and the sources (data, model, expert).

  **Step 2: Choose a Decision Rule (1 day)**
     - The choice of rule is a meta-decision. We must consider:
          - **Agency's risk attitude**: If the agency is highly risk-averse, choose maximin or maximin expected utility (MEU). If it wants to avoid worst-case but also consider best-case, use Hurwicz (with a pessimism index α, e.g., α=0.5 for neutral, or set by policy). If the agency wants to avoid being dominated, use maximality or E-admissibility.
          - **Defendability**: We can defend the choice by:
              a) Referring to agency policy on risk (if exists).
              b) Using a rule that is robust to the uncertainty (i.e., performs reasonably well across a range of rules).
              c) Using multiple rules and seeing if they agree (Step 3).
          - We propose a default rule: **Maximality** (because it is less conservative than maximin and avoids the need for a specific α as in Hurwicz). However, if agency policy requires worst-case focus, use MEU. If there is no policy, we use maximality and also check with MEU (with a worst-case distribution) and Hurwicz (with α=0.5) for comparison.

  **Step 3: Apply Decision Rules and Resolve Disagreements (2 days)**
     - Compute the set of expected utilities for each option under the set of admissible probabilities.
     - Apply the chosen rule (from Step 2) to the set of options. Also, apply at least two other rules (e.g., MEU and Hurwicz) for comparison.
     - If the rules agree on a single option (or a set of non-dominated options that are all acceptable), then proceed.
     - If the rules disagree:
          - If one option is optimal under maximality and also under MEU (or Hurwicz) for a reasonable α, choose that.
          - If there is a tie or conflict, then:
              a) Check if more evidence can break the tie (see Step 4) without falling into the trap of widening the set.
              b) If not, then the decision must be elevated to a named person (Step 5).

  **Step 4: Collecting More Evidence? (1 day)**
     - To avoid the trap that more evidence widens the set (due to revealing more complexity), only collect evidence that is expected to reduce the set (e.g., targeted to reduce key uncertainties). Use value of information (VOI) analysis to decide:
          - Compute the expected reduction in the size of the set (or in the range of expected utilities) from the new evidence. If the expected reduction is high and cost is low, collect.
          - If the evidence might widen the set (e.g., by revealing new uncertainties), do not collect unless the cost is justified by the potential for reducing decision uncertainty.
          - If the set becomes wider, then we must reassess: go back to Step 1 and include the new evidence, then re-run.

  **Step 5: Stopping Conditions and Elevation (1 day)**
     - The procedure stops with a "no" (or "do not adopt") if:
          a) The worst-case scenario (under MEU) is unacceptable (e.g., catastrophic harm with positive probability) and the agency is risk-averse.
          b) Under maximality, the proposed intervention is dominated by the status quo (or an alternative) in every admissible scenario.
     - Elevate the decision to a named person (e.g., the Director of Risk Management) when:
          a) The residual question is about risk tolerance (e.g., the set includes both acceptable and unacceptable levels of risk, and the decision hinges on how much risk we are willing to accept).
          b) The decision rules do not agree and we cannot break the tie with evidence (Step 3).

  **Step 6: Documentation (1 day)**
     - Record on one page:
          - The set of admissible probabilities (intervals or sets) for each parameter.
          - The chosen decision rule and why.
          - The results of applying the rules (including any disagreements).
          - The stopping condition (e.g., "no" or elevated to whom and why).

  ### Example Applications

  **Proposal 1: Screening Programme**
     - **Uncertainties**: 
          - Probability of true positive (benefit): [0.70, 0.90] (from sparse data and model bounds).
          - Probability of false positive (harm): [0.05, 0.15] (from expert disagreement and data).
     - **Options**: Adopt the programme (A) or not (B).
     - **Utilities** (simplified): 
          - True positive: +100 (benefit)
          - False positive: -50 (harm, e.g., unnecessary stress and cost)
          - True negative: 0
          - False negative: 0 (we assume no direct harm from missing, only opportunity loss)

     - Expected utility of A:
          - Depends on the prevalence (p) of the condition. Assume p is known: 0.10.
          - EU(A) = p * (TP_prob * 100 + (1-TP_prob)*0) + (1-p) * (FP_prob * (-50) + (1-FP_prob)*0)
                  = 0.10 * ( [0.7,0.9] * 100 ) + 0.90 * ( [0.05,0.15] * (-50) )
                  = 0.10 * [70, 90] + 0.90 * [-7.5, -2.5]   [Note: the harm part is negative]
                  = [7, 9] + [-6.75, -2.25]   [because 0.90 * [-7.5, -2.5] = [-6.75, -2.25]]
                  = [7 - 6.75, 9 - 2.25] = [0.25, 6.75]

          So EU(A) ∈ [0.25, 6.75]
          EU(B) = 0 (by assumption)

     - **Decision Rules**:
          - Maximin: Compare worst cases. Worst EU(A) = 0.25, EU(B)=0. So A is better.
          - MEU (maximin expected utility): same as above, choose A.
          - Hurwicz (with α=0.5): 
              For A: 0.5 * min(EU(A)) + 0.5 * max(EU(A)) = 0.5*0.25 + 0.5*6.75 = 3.5
              For B: 0
              So choose A.
          - Maximality: Compare A and B. Is A dominated by B? In every scenario, EU(A) is at least 0.25>0, so A is never worse than B and sometimes better. So A is not dominated. Also, B is dominated by A because in every scenario EU(A)>=0.25>0. So only A is maximal. Choose A.

     - **Conclusion**: All rules agree to adopt. We would recommend adoption.

  **Proposal 2: Novel Vector-Control Intervention (Ecological Risk)**
