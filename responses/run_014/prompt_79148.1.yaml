          - Probability of effective vector control (benefit): [0.6, 0.8] (model bounds)
          - Probability of ecological harm (e.g., harming non-target species): [0.1, 0.3] (expert disagreement and sparse data)
     - **Utilities**:
          - Effective control without harm: +100
          - Effective control with harm: +20 (benefit but with cost)
          - Ineffective without harm: 0
          - Ineffective with harm: -50 (only harm, no benefit)
     - Assume independence between effectiveness and harm.

     - Expected utility of the intervention (A):
          Let E = effective (prob E in [0.6,0.8]), H = harm (prob H in [0.1,0.3])
          EU(A) = 
            P(E and not H)*100 +
            P(E and H)*20 +
            P(not E and not H)*0 +
            P(not E and H)*(-50)

          = P(E)(1-P(H))*100 + P(E)P(H)*20 + (1-P(E))P(H)*(-50)

          We can compute bounds by considering the extreme points of the intervals.

          Minimum EU(A):
            To minimize, minimize benefits and maximize harms.
            Set P(E)=0.6, P(H)=0.3:
            = 0.6*(0.7)*100 + 0.6*0.3*20 + 0.4*0.3*(-50)
            = 0.6*70 + 0.6*6 + 0.4*(-15)
            = 42 + 3.6 - 6 = 39.6

            But wait, let me check with other corners? Actually, we need to find the min over the box.

            Alternatively, we can write:
            EU(A) = P(E)*[100*(1-P(H)) + 20*P(H)] + (1-P(E))*(-50)*P(H)
                   = P(E)*[100 - 80*P(H)] - 50*P(H)*(1-P(E))

          Rearranged: 
            = P(E)*(100 - 80*P(H)) - 50*P(H) + 50*P(E)*P(H)
            = P(E)*(100 - 80*P(H) + 50*P(H)) - 50*P(H)
            = P(E)*(100 - 30*P(H)) - 50*P(H)

          Now, we can compute min and max over P(E) in [0.6,0.8] and P(H) in [0.1,0.3].

          To minimize, we want to minimize the positive term and maximize the negative term.
          Since the coefficient of P(E) is positive (because 100-30*P(H) >= 100-30*0.3=91>0) and the term -50*P(H) is negative, we set:
            - P(E) at minimum (0.6) and P(H) at maximum (0.3) to minimize the entire expression.

          Then:
            EU_min = 0.6*(100 - 30*0.3) - 50*0.3
                   = 0.6*(100-9) - 15
