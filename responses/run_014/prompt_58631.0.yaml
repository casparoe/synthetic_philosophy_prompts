answer: |-
  ### Charity Choice Scenario

  **Option A (Safe):** Fund mosquito nets that will definitely save 100 lives.  
  **Option B (Moonshot):** Fund research for a revolutionary vaccine. It has a **1 in 10 million chance** of saving 900 million lives, but if it fails (99.99999% likely), it saves no one.  

  ### Expected Value Calculation
  - **Option A:** Guaranteed to save **100 lives**.  
    *Expected Value (EV) = 100*.  
  - **Option B:**  
    EV = (Probability of success × Lives saved if successful) + (Probability of failure × Lives saved if failure)  
    = \(\left( \frac{1}{10,000,000} \times 900,000,000 \right) + \left( \frac{9,999,999}{10,000,000} \times 0 \right)\)  
    = **90** lives saved (expected).  

  ### Verdicts
  1. **Expected-Value Fanatic:**  
     Compares 100 (A) vs. 90 (B). Since 100 > 90, **chooses A (Safe)**.  
  2. **Normal Person:**  
     Ignores the "1 in 10 million" probability as negligible ("basically zero"). Sees B as:  
     - *Success (ignored):* Save 900M lives (dismissed as fantasy).  
     - *Failure (assumed certain):* Save 0 lives.  
     Thus, compares **100 lives (A)** vs. **≈0 lives (B)**, and **chooses B (Moonshot)**—reasoning the tiny shot at 900M lives is "worth a gamble" over a mere 100.  

  ### Key Role-Reversal Detail
  - **What Flips the Script:** The moonshot’s **expected value (90) is lower than the safe option (100)**. Usually, moonshots have *higher* EV (e.g., 1% chance to save 20,000 lives = EV 200), making fanatics seem daring. Here, the moonshot is mathematically *worse*, forcing the fanatic to be cautious.  
  - **If Deleted:** If the success probability were higher (e.g., **1 in 1 million**), B’s EV would jump to 900, making fanatics choose B. The ultra-low probability (1/10M) is essential to suppress EV below 100.  

  ### Fanatic’s Complaint  
  *"This is rigged! You artificially deflated the probability to 1 in 10 million—a made-up, negligible number—to force EV below the safe option. In real life, we’d demand robust data or use uncertainty ranges. Plus, ignoring tiny probabilities is irrational; consistency requires weighing all odds, no matter how small!"*  

  ### Why It Works  
  - **Fanaticism ≠ Recklessness:** Fanatics follow EV rigidly—even to caution—when the math favors safety.  
  - **Normal Bias:** Humans dismiss tiny risks (e.g., lottery tickets), overriding EV when big payoffs loom.  
  - **Realism Anchor:** Uses grounded stakes (mosquito nets vs. vaccines) with clear arithmetic.
