       - **Judgment 3 (risk aversion):** Concave utility (e.g., \(u(x) = \sqrt{x}\)) explains rejecting fair gambles.  
       - **Judgment 4 (indifference):** Free play is a gain. Paying $30 creates a loss frame, and avoiding a small loss for $1–2 aligns with loss aversion (modeled via a kink in utility).  

     **Predictions for Ticket A vs. B:**  
