prompt: |-
  I am the employee-elected member of the board of the Nordic subsidiary of an American software company, and I have to circulate a written opinion before Thursday's board meeting.

  Management has put a single item on the agenda: rolling out in our region a programme the parent company already runs in the United States. It has three parts. Every quarter, a ranked list of the top ten per cent of employees by performance score is published to the whole region. The top twenty-five are sent to a three-day retreat with the CEO. And the next recruiting campaign is to be built around one employee who began on the support desk and is now a team lead, held up as proof of the parent company's slogan, that here anyone can make it.

  Our Nordic employee council has voted nine to two against, and its written objection is one sentence long: that in Jante's town no one gets to stand above the others. Jantelagen, as I understand the norm they are invoking, is the old Nordic rule that you must not think you are anything special, or that you are better or know more than the rest of us; the same reflex, exported, is what elsewhere gets called the tall poppy syndrome.

  Write the opinion I will circulate. It must recommend a definite course — approve as proposed, reject, or approve subject to conditions I can put in writing with a date by which they must be met — and it must argue rather than survey. I want the board to be able to interrogate it, so please do the following.

  First, state what each side is actually claiming about what the company owes the people who work for it. Neither side is a caricature: the council is not simply against praise, and the parent company's slogan is not mere naivety.

  Second, use a distinction I have found clarifying. Call recognition a prize when it is scarce and rank-ordered, so that one person's gain is another's loss, and call it acknowledgment when it is not scarce and can be extended to anyone who did the work. Say which of the two the programme actually implements, and whether the other would serve the purposes the company says it has.

  Third, meet the strongest case for the losing side head-on. If the purpose is to motivate effort, does a rank-ordered prize do that, given that the people most likely to win it may be those who would have worked hard regardless? If the purpose is to advertise that the company rewards talent, whose interests does the advertisement serve? And say what would have to turn out to be true for the opposite recommendation to be the right one.

  Fourth, say plainly what a published ranking does to the people who finish at the bottom of it, and whether the company has an answer to that.

  Two details should be taken into account. The employee who would front the recruiting campaign said in the internal interview that the company's training fund and a manager who covered for her during a family illness were what made the difference; the parent company's version of the story drops both. And the council's objection was drafted by two of our most productive engineers.

  No citations and no literature review — I want an argument in prose that a sceptical board can push back on, under nine hundred words.
reasoning: |-
  Okay, the user is an employee-elected board member in a Nordic subsidiary of an American software company. They need to write a formal opinion recommending whether to approve a performance recognition program modeled after the parent company's US initiative. The Nordic employee council has strongly rejected it, citing "Jantelagen" - the cultural norm against standing out. 

  Hmm, this is a classic clash between individualistic American corporate culture and Nordic egalitarianism. The user wants a decisive recommendation, not just analysis. They've provided a clear framework: contrast both sides' philosophies, apply the prize/acknowledgment distinction, address counterarguments head-on, and consider human impacts. Smart framing.

  Let me unpack the tensions: The parent company sees this as motivational and meritocratic. The Nordic employees see it as divisive and culturally tone-deaf. Both have valid points - the council isn't anti-recognition, they're anti-zero-sum-competition. The parent isn't being malicious, just culturally unaware. 

  Key observations from the details: The "success story" employee credits systemic support (training, manager flexibility), but the corporate narrative erases that to push individual heroism. And significantly, the council's objection came from top performers - disproving the assumption that high achievers always want public ranking.

  On the prize/acknowledgment lens: This program is pure "prize" - scarce, rank-ordered, creating winners/losers. But "acknowledgment" (non-scarce recognition) could actually better serve the stated goals of motivation and employer branding. Interesting how the proposed solution undermines its own purposes.

  The toughest counterargument to address: Does ranking really motivate? Evidence suggests it mostly motivates those already likely to excel, while demoralizing the majority. And the recruiting angle - whose interest does that "anyone can make it" story serve? Primarily the company's branding, not necessarily employees'.

  Most ethically concerning bit: Publishing rankings humiliates lower performers. The company has no answer for that collateral damage. Combine that with whitewashing the support desk employee's real success factors... it feels manipulative.

  Given all this, rejection seems necessary. But strategically, a conditional approval could bridge cultures: Remove rankings, keep retreats non-ranked, tell authentic success stories. If the parent company refuses those conditions, that reveals their priorities aren't really about motivation after all.

  Final recommendation must be firm though - the council's 9-2 vote and top engineers' objections can't be ignored. The opinion should end with clear action points: Reject as proposed, offer specific alternatives, and force the parent to choose between cultural imperialism and adaptation.
answer: |-
  ## Board Opinion: Recommendation on US Recognition Programme Rollout in Nordic Region

  **Recommendation:** Reject the programme as currently proposed. Approval should be conditional on fundamental redesign replacing rank-ordered public prizes with non-competitive acknowledgment, with revisions submitted by [Date - e.g., October 31st]. Failure to meet this condition necessitates rejection.

  **The Core Disagreement: What the Company Owes Employees**

  *   **Parent Company Claim:** The company owes employees a clear demonstration that exceptional individual effort and achievement are *seen*, *celebrated publicly*, and *tangibly rewarded*. This fulfills a promise: proven high performance unlocks unique status and opportunity ("anyone can make it"), serving to motivate all employees towards greater effort and loyalty by showcasing attainable rewards. The programme is a tool for motivation and employer branding.
  *   **Employee Council Claim (Jantelagen Context):** The company owes employees a culture where contribution is respected *without* creating artificial hierarchies or publicly ranking individuals against each other. Recognition should foster collective pride and psychological safety, not individual distinction at the expense of team cohesion. Public ranking and exclusive rewards violate the deeply ingrained Nordic norm that individual success is best acknowledged modestly and seen as partly enabled by the collective environment. They fear the programme will demotivate the majority, breed resentment, and damage trust.

  **Prize vs. Acknowledgment: What the Programme Implements & What's Needed**

  *   **The Current Programme Implements "Prizes":** The top 10% list and CEO retreat are quintessential prizes – scarce, rank-ordered, and zero-sum (one's inclusion necessitates another's exclusion). The recruiting story, as manipulated, also functions as a prize by holding up *one* individual as exceptional, implying others are less so.
  *   **The Stated Purposes Require "Acknowledgment":** Motivating broad effort and demonstrating reward for talent are best served by *acknowledgment* – recognition that is non-scarce and based on clear criteria anyone can meet (e.g., "Exceeded project goals," "Demonstrated exceptional client support"). Acknowledgment can be widely distributed, celebrates specific contributions relevant to many roles, and avoids pitting employees against each other. It signals that *achievement* is rewarded, not just *ranking*. The current prize structure undermines the very motivation and inclusive branding it purports to create.

  **Meeting the Strongest Case for the Programme Head-On**

  **Claim: "Rank-ordered prizes motivate maximum effort from all."**
  *   **Counter:** The evidence suggests otherwise. Rank-ordered prizes primarily motivate those already near the top or highly competitive. For the vast majority (90%), seeing a fixed "winners" circle each quarter is demoralizing, not motivating. Effort feels futile if only the absolute top is recognized. Studies consistently show such systems often decrease overall productivity and collaboration. Motivation thrives on attainable goals and recognition for personal improvement or specific contributions, not on beating peers in a fixed hierarchy.

  **Claim: "Advertising that 'anyone can make it' through an exceptional story serves recruitment and shows we reward talent."**
  *   **Counter:** Whose interests does this *specific* advertisement serve? Primarily the company's branding, often at the expense of authenticity and the employee's truth. The whitewashing of the support-desk employee's story – removing the crucial role of company support (training fund, managerial flexibility) – turns a genuine testament to a supportive *system* into a misleading myth of pure individual heroism. This damages internal trust and offers a hollow promise externally. True employer branding is built on authentic stories and a demonstrably fair, supportive culture, not manufactured individual legends.

  **For the programme to be the right approach as-is, the following must be true:** Nordic employees uniquely thrive on intense public competition against colleagues; internal trust and collaboration are unimportant to productivity; the demotivation of the bottom 90% is outweighed by the gains from the top 10%; and culturally ingrained norms against public individual distinction are irrelevant to workplace morale. The evidence and council feedback strongly contradict these premises.

  **The Impact of Published Rankings & The Company's Silence**

  Publishing a ranked list of the "top" 10% explicitly creates a public "bottom" 90%. For those consistently outside the list, it signals their contributions are officially deemed less valuable, regardless of context, effort, or role-specific challenges. This breeds disengagement, resentment, anxiety, and damages self-worth. It actively undermines psychological safety and teamwork. **The company has no credible answer to this inevitable harm.** The programme offers nothing for these employees beyond implied inadequacy. This is antithetical to the Nordic principles of fairness, collective well-being, and dignity in work that our subsidiary relies upon.

  **Conclusion**

  The proposed programme, centered on scarce, rank-ordered prizes, is culturally misaligned, counterproductive to stated goals, and ethically questionable in its inevitable creation of "losers." It ignores the Employee Council's decisive rejection, including objections from highly productive engineers, and misrepresents an employee's genuine success story. While the parent company's aims – motivation and showcasing opportunity – are valid, the chosen mechanism is destructive in our context.

  We cannot approve a programme that will damage morale, trust, and productivity. I recommend rejecting the *current* proposal. Approval should be strictly conditional on a redesigned programme replacing public rankings and exclusive prizes with a system of non-scarce acknowledgment for demonstrable achievements and contributions accessible to all roles, alongside authentic storytelling that includes the enabling factors of support. Revised proposals meeting these conditions must be submitted by **[Date]** for board review. If acceptable revisions are not presented by this date, the proposal should be rejected outright.
