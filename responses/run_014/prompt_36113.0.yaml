  This pattern (A in the first choice, D in the second) is the "famous Allais pattern" and violates expected utility theory (EUT), suggesting a non-EUT model like REU.

  ### Implicit Decision Rule
  Her choices are consistent with **Buchak's risk-weighted expected utility (REU)**. In REU, decisions incorporate a risk function \( r(p) \) that weights utilities based on probability, reflecting risk attitudes:
  - For risk-averse choices (e.g., preferring sure $400 over the gamble), \( r(p) < p \) for relevant probabilities, underweighting high outcomes.
  - For risk-seeking choices (e.g., preferring the gamble over sure $100), \( r(p) \) is closer to or greater than \( p \) when potential gains are large relative to sure amounts.
    
  Her behavior suggests a concave utility function (e.g., \( u(x) = x^\alpha \) with \( \alpha \approx 0.5 \)) combined with a risk-averse \( r(p) \) (e.g., \( r(p) = p^\gamma \) with \( \gamma > 1 \)). This explains her mixed risk attitudes:
  - In choices 1 and 2, \( r(0.5) \) is small enough that the sure amount is preferred.
  - In choice 3, the high utility gain from $1000 offsets the risk, making the gamble attractive.

  ### Alternative Rule Fitting the Three Answers
  The same three choices can be explained by **expected utility theory (EUT) with a concave utility function**, such as \( u(x) = x^\alpha \) for \( \alpha \in (0.301, 0.756) \). For example, with \( \alpha = 0.5 \):
  - Choice 1: \( u(400) = 400^{0.5} = 20 > 0.5 \times u(1000) = 0.5 \times 31.62 \approx 15.81 \).
  - Choice 2: \( u(100) = 100^{0.5} = 10 > 0.5 \times u(250) = 0.5 \times 15.81 \approx 7.905 \).
  - Choice 3: \( 0.5 \times u(1000) \approx 15.81 > u(100) = 10 \).

  This shows that EUT can fit her initial choices without needing a risk function, as the concavity explains both risk aversion (choices 1 and 2) and the risk-seeking behavior in choice 3 due to the large EV difference ($500 vs. $100).

  ### Discriminating Between Rules with the Allais Choices
  The **first Allais choice** is key for discriminating between EUT and REU:
  - Under EUT with \( \alpha \approx 0.5 \), she should prefer option B (89% $1M / 10% $5M / 1% $0) over A (sure $1M) because:
    - \( EU(B) = 0.89u(1M) + 0.10u(5M) + 0.01u(0) \).
    - With \( u(1M) = 1 \) and \( u(5M) = 5^{0.5} \approx 2.236 \), \( EU(B) \approx 0.89 + 0.2236 = 1.1136 > EU(A) = 1 \).
  - Under REU, she can prefer A due to the risk function underweighting the small probability of a high gain (e.g., \( r(0.10) \) small) and/or overweighting the sure outcome (e.g., \( r(0.99) \) close to 1), making B less attractive.
    
  If she chooses A (as predicted), it violates EUT and supports REU. The second choice (where she likely prefers D) is consistent with both rules under her parameter range, so it does not discriminate.

  ### Distinguishing REU from a Very Concave Utility Function
  If her Allais choices show the famous pattern (A and D), it already suggests REU over EUT, as EUT predicts B and D for her utility parameters. However, to further distinguish REU from an extremely concave utility function (e.g., \( u(x) = \log(x) \)):
  - **Problem with extreme concavity**: If utility were very concave (e.g., \( \alpha \) low or log utility), choice 3 would not hold—e.g., with \( u(x) = \log(x) \), \( 0.5 \times \log(1000) \approx 3.45 < \log(100) \approx 4.61 \), so she would prefer sure $100, contradicting her choice. Her actual choice 3 implies moderate concavity (\( \alpha > 0.301 \)), so extreme concavity is ruled out.
    
  **Further test case to distinguish REU from concave EUT**:  
  Offer a choice between:
  - $50 for sure  
  - 5% chance of $10,000 (else $0)  

  Under concave EUT (e.g., \( u(x) = x^{0.5} \)):
  - \( EU(\text{sure}) = 50^{0.5} \approx 7.07 \)
  - \( EU(\text{gamble}) = 0.05 \times 10000^{0.5} = 0.05 \times 100 = 5 < 7.07 \) → Prefers sure $50.

  Under REU with risk aversion (e.g., \( r(p) = p^2 \)):
  - \( REU(\text{gamble}) = r(0.05) \times u(10000) \). With \( r(0.05) = (0.05)^2 = 0.0025 \) and \( u(10000) = 100 \), \( REU \approx 0.25 \), much less than \( u(50) \approx 7.07 \) → Also prefers sure $50.

  However, if she has a less concave utility or different risk function, she might prefer the gamble. To make it discriminatory:
  - **Use a case where probabilities are weighted differently**: e.g., $200 for sure vs. 50% chance of $410.  
    - Under EUT with \( \alpha = 0.5 \): \( EU(\text{sure}) = 200^{0.5} \approx 14.14 \), \( EU(\text{gamble}) = 0.5 \times 410^{0.5} \approx 0.5 \times 20.25 = 10.125 < 14.14 \) → Prefers sure $200.  
    - Under REU with \( r(0.5) \) derived from her choices (e.g., \( r(0.5) \approx 0.4 \) for \( \alpha = 0.5 \)): \( REU(\text{gamble}) = r(0.5) \times u(410) \approx 0.4 \times 20.25 = 8.1 < 14.14 \) → Still prefers sure.  
    But if \( r(0.5) \) is higher (e.g., from risk-seeking), REU might predict differently. A better test is a **small probability of a large gain**:  
    - $70 for sure vs. 1% chance of $1,000,000.  
      - EUT with \( \alpha = 0.5 \): \( EU(\text{sure}) = 70^{0.5} \approx 8.37 \), \( EU(\text{gamble}) = 0.01 \times 1000^{0.5} = 0.01 \times 31.62 \approx 0.316 < 8.37 \) → Prefers sure.  
      - REU with \( r(p) = p^2 \): \( REU(\text{gamble}) = r(0.01) \times u(1000) = (0.01)^2 \times 31.62 = 0.0001 \times 31.62 \approx 0.003 < 8.37 \) → Prefers sure.  
  - **Key insight**: Since her choices show moderate concavity, EUT and REU often agree on simple gambles. To distinguish, use choices where probability weighting differs sharply, like a 10% chance of $500 vs. 20% chance of $250 (else $0). Under EUT, if \( u \) is concave, \( 0.10u(500) \) vs. \( 0.20u(250) \) depends on \( \alpha \). Under REU, \( r(0.10)u(500) \) vs. \( r(0.20)u(250) \) also depends on \( r(p) \). Fitting her risk function from past choices can isolate REU.

  In summary, your roommate likely uses REU with moderate concavity and risk aversion for sure gains. The Allais first choice discriminates between EUT and REU, and choice 3 rules out extreme concavity. For finer distinction, use gambles with varied probabilities and outcomes to test probability weighting.
