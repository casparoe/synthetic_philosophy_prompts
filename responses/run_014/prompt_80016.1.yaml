answer: |-
  You've hit on a crucial ambiguity in a phrase often wielded like a philosophical cudgel. "The separateness of persons" isn't a single, precise claim but a family of ideas, ranging from observations utilitarians readily accept to radical denials of interpersonal comparison. Dissecting these helps clarify where the real disagreement lies, especially regarding cases like the organ harvest versus the trolley diversion.

  The most basic interpretation, which you flagged, is the **formal separateness of welfare accounting**. This simply means each distinct person's well-being is counted once in the aggregate calculation; no person's welfare is counted twice or subsumed into another's. Utilitarians explicitly embrace this. Their whole project *depends* on recognizing distinct individuals whose utilities are summed. To deny this would be to deny the very structure of utilitarian arithmetic. This interpretation is a platitude, accepted by nearly all moral theories, including utilitarianism. It doesn't challenge utilitarianism at all and certainly doesn't explain the difference between trolley and organ cases.

  A stronger, more substantive interpretation is the **non-fungibility of persons or their fundamental interests**. This claims that a significant loss to one person (especially severe harm or death) cannot be straightforwardly *compensated* by gains to others, even if the sum increases. The person suffering the loss isn't "made whole" by others' benefits; their distinct life-project is irreparably damaged. This resonates with the intuition in the organ case: killing the healthy person inflicts a profound, non-transferable loss *on them* that isn't erased by saving five others. Utilitarianism, by treating welfare as fungible across persons, arguably fails to respect this aspect of separateness. This is a substantive and defensible claim, central to many non-utilitarian theories (like deontology or rights-based approaches) that prioritize individual inviolability. It's likely doing significant work in your friend's dismissal, particularly for the organ case. It suggests that using someone *as a mere resource* for others' benefit fundamentally disrespects their status as a separate locus of value.

  An even stronger claim is the **denial of interpersonal welfare comparisons**. This radical interpretation asserts that we cannot meaningfully compare the welfare levels or changes of different persons at all. One person's pain cannot be quantitatively measured against another's pleasure. If this were true, utilitarianism would collapse, as aggregation requires comparison. While philosophers debate the precision of comparisons, the idea that we can make *rough, defeasible* judgments (e.g., severe pain is worse than mild annoyance, saving a life is better than providing a minor pleasure) seems plausible for many cases. This strong interpretation is generally considered false or at least excessively skeptical; we rely on interpersonal comparisons constantly in policy, law, and everyday life. It's unlikely your friend meant this, as it would make *any* aggregation-based reasoning impossible, not just the organ case.

  Finally, there's the **non-permissibility of direct instrumentalization**. This focuses less on aggregation *per se* and more on the *means* used. It claims that what's uniquely wrong in cases like the organ harvest (and absent in the trolley diversion) is *directly using one person's body or life against their will solely as a tool to benefit others*. The trolley involves redirecting an existing threat away from a larger group towards a smaller one; the organ harvest involves *initiating* a direct, invasive, lethal harm to an uninvolved person *specifically to use their parts*. This "using as a mere means" is seen as a profound violation of the respect owed to a separate person. Utilitarianism, focused solely on outcomes, might permit this if the net gain is large enough, thereby (according to this view) disrespecting the victim's separateness. This interpretation is substantive, widely held (especially in Kantian ethics), and defensible. It directly targets the organ-harvesting case and plausibly explains the difference from the trolley diversion.

  So, which reading supports dismissing utilitarianism in the organ case? The "non-fungibility" claim and the "non-permissibility of instrumentalization" are the strongest candidates. Both capture the core objection that utilitarianism, in seeking the best aggregate outcome, fails to acknowledge a moral barrier against imposing catastrophic harm on one specific individual *for the sake of others*, treating them as a sacrificial resource rather than respecting their distinct, inviolable existence. The "instrumentalization" version is particularly potent for the organ case, highlighting the direct, intentional use of the person.

  Your friend, using the phrase to shut down the discussion, was most plausibly invoking the **non-fungibility of persons/fundamental interests** or the **non-permissibility of direct instrumentalization** – likely blending both. These are the substantive, defensible interpretations that resonate with the intuitive revulsion towards the organ harvest scenario. They represent a fundamental challenge to utilitarianism's core commitment to outcome-maximization without side-constraints based on the distinct moral status of individuals. The phrase "disrespects the separateness of persons" gains its rhetorical force in this context by evoking the idea that utilitarianism, in such extreme cases, dissolves the moral boundaries around individuals, reducing them to interchangeable vessels of utility. Whether this critique is ultimately decisive is another debate, but it's certainly not trivial and points to a deep fault line in moral philosophy. Your instinct that the trolley case dodges the full force of the objection while the organ case exposes it is precisely right, hinging on these stronger interpretations of what "separateness" demands.

