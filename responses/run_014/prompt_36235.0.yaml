prompt: |-
  I head the employee-conduct review team at a mid-sized professional services firm — about a dozen investigators, none of them philosophers, each handling several complaints a week. Our code of conduct forbids "harassing conduct," which our policy glosses as "repeated or severe behavior that a reasonable person would find intimidating, hostile, or offensive, whether or not any single instance would independently violate this code." The words are vague in the way the sorites literature studies: no one can say how many rude remarks make conduct "repeated," how far short of criminal cruelty an episode can fall and still be "severe," or how "hostile" differs from merely "unpleasant." Our investigators currently decide these cases by intuition, and the intuition drifts: whoever handled the last borderline case sets a precedent nobody wrote down.

  Please write a decision procedure my team could actually run on a complaint, grounded in what the philosophy of vagueness actually establishes — the tolerance intuition ("one more remark can't make the difference") and its collapse under conjunction, the difference between a borderline case having no determinate truth versus our not knowing it, the way context and comparison class shift as cases accumulate, and whatever epistemicism, supervaluationism, and degree or contextualist theories have to offer that survives contact with practice. The procedure should specify: the questions to ask in order; what counts as a sufficient answer to each; where it terminates in a finding, where in a dismissal, and where it must stop and hand the decision to a named human being because the residual question is one of values rather than of vagueness. It must run in under an hour per case, use no jargon beyond what you define in a short preamble, and produce written rationales that will hold up if a decision is appealed.

  Three hazards it must explicitly address. First, the sorites trap: an investigator who agrees that no single instance of a behavior crosses the line, and that adding one instance to a non-violation cannot create a violation, ends up dismissing everything; the procedure needs a principled way to break that chain of reasoning without pretending each instance is evaluated in isolation. Second, the ratchet: once we sustain a complaint at, say, five instances over a quarter, every subsequent case gets argued by analogy to that one, so the boundary creeps; the procedure should tell investigators when comparison to prior outcomes is legitimate and when it smuggles in a boundary nobody actually chose. Third, the disagreement problem: two investigators applying the same procedure will sometimes reach opposite verdicts on the same facts, and I need to know whether the procedure should treat that as a defect to be engineered away, a normal feature of penumbral cases to be managed (for instance, by routing them somewhere), or evidence of a higher-order fact about the case.

  Then run the procedure on two complaints. In the first, an employee reports that a colleague has, over four months, made roughly a dozen individually trivial remarks about her accent, none of which any witness calls severe, but which she says have made her dread team meetings. In the second, an employee reports exactly two incidents, but one of them — a joke made in front of a client — was, by broad agreement, genuinely vicious. Include at least one worked case where the procedure returns an answer I will not like, and say plainly what the procedure cannot do — where vagueness theory runs out and the decision belongs entirely to judgment or to institutional values. Finally, tell me which theory of vagueness the procedure, as you have built it, is implicitly committed to, and what a team of ours that instead built the procedure on a rival theory would do differently at which step.
reasoning: |-
  We are designing a decision procedure for harassment complaints that is grounded in the philosophy of vagueness. The key ideas we will use include:

  1. **Tolerance Intuition and Its Collapse**: We accept that small changes (e.g., one more remark) do not change the status (non-harassing to harassing) but we know that this leads to paradox (sorites paradox). We avoid this by not allowing an infinite chain of tolerance.

  2. **Borderline Cases**: We recognize that some cases are borderline and do not have a determinate truth value. We will not force a binary decision in every case; sometimes we will have to use human judgment.

  3. **Context and Comparison Class**: We note that context and the set of prior cases (comparison class) can shift the boundary. We will use a structured comparison to prior cases but guard against the ratchet effect (where boundaries creep without justification).

  4. **Theories of Vagueness**: We will draw on:
     - **Epistemicism**: Vagueness is due to our ignorance of a precise boundary. We might set a precise boundary (but we won't because it's arbitrary and we don't have one).
     - **Supervaluationism**: A statement is true if it is true under all admissible precisifications, false if false under all, and indeterminate otherwise. We will use the idea of multiple ways of making the policy precise and look for consensus among them.
     - **Degree Theory**: We might assign degrees of truth (e.g., 0.7 true that it's harassment). We can use a scoring system that aggregates factors.
     - **Contextualism**: The meaning of vague terms can shift with context. We will fix the context by defining factors and using a structured procedure.

  Given the constraints, we design a procedure that:

  - Runs in under an hour per case.
  - Uses a written rationale that can be appealed.
  - Addresses the three hazards: sorites trap, ratchet, and disagreement.

  **Procedure Structure**:

  We break the decision into steps. Each step asks a question and, based on the answer, either terminates the procedure or moves to the next step. We have three possible outcomes:
  1. **Dismissal**: The complaint does not meet the threshold for harassing conduct.
  2. **Sustained**: The complaint meets the threshold for harassing conduct.
  3. **Escalate to Human Judgment**: The residual question is one of values or the case is borderline and requires a judgment call that the procedure cannot make.

  **Predefined Terms** (to avoid jargon in the procedure):

  - **Severity**: The degree of harm or offensiveness of a single incident. We will rate it on a scale (e.g., low, medium, high) based on factors such as the nature of the behavior, the context, and the impact on the victim.
  - **Repetition**: The number of incidents and the pattern (e.g., how close in time, whether they form a campaign).
  - **Reasonable Person Standard**: What a typical person in the victim's position would find intimidating, hostile, or offensive. We consider the victim's perspective but also objective factors.
  - **Borderline Case**: A case where it is unclear whether the conduct meets the definition, even after applying the procedure.

  **The Procedure**:

  **Step 1: Is there at least one incident that is independently severe?**
     - **Assessment**: Review each incident. If any single incident, by itself, would be considered severe (e.g., a clear threat, a deeply offensive slur, an act that would be criminal if more extreme), then note it. We define "severe" as behavior that is at the high end of offensiveness and would be widely recognized as such by reasonable people.
     - **Sufficient Answer**: If at least one incident is found to be independently severe, then the conduct is harassing. Proceed to Step 4 (Sustained). Otherwise, go to Step 2.

  **Step 2: Are there repeated incidents?**
     - **Assessment**: Count the incidents and note the time frame. Also, consider the pattern (e.g., targeted at the same person, same type of behavior). We set a threshold for repetition (say, 5 incidents within a year) as a starting point but note that this is not absolute. However, we must avoid the sorites trap by not insisting that one more incident always makes the difference. Instead, we use a range: 
          - Low repetition: 1-3 incidents (unless there are aggravating factors)
          - Medium: 4-6 incidents
          - High: 7 or more
       But note: even one incident can be part of a pattern if it is part of a broader context (e.g., in a workplace already known for hostility). Also, consider the density (e.g., 10 incidents in a week is worse than 10 in a year).
     - **Sufficient Answer**: 
          - If the repetition is high (e.g., 7 or more), then go to Step 3 (to assess whether they create a hostile environment).
          - If the repetition is medium (4-6), then go to Step 3.
          - If the repetition is low (1-3), then we must also check for aggravating factors (Step 2A) to see if they push it into being repeated.

  **Step 2A: Aggravating Factors (only if repetition is low)**
     - **Assessment**: Consider factors that might make even a few incidents part of a pattern of harassment:
          - The incidents are of the same nature (e.g., all about race, gender, accent).
          - They are targeted at the same victim.
          - They occur in a context where the victim is vulnerable (e.g., new employee, isolated).
          - They are perpetrated by someone in a position of authority.
          - They occur despite the victim having expressed discomfort.
     - **Sufficient Answer**: If at least two aggravating factors are present, then treat the case as having medium repetition and go to Step 3. Otherwise, go to Step 5 (Dismissal).

  **Step 3: Would a reasonable person find the conduct intimidating, hostile, or offensive?**
     - **Assessment**: We consider the cumulative effect of the incidents. We ask:
          - Did the conduct unreasonably interfere with the victim's work? (e.g., the victim dreads meetings, avoids the perpetrator, productivity drops)
          - Was the conduct pervasive enough to alter the conditions of the victim's employment?
          - Are there witnesses or other evidence (like emails) that corroborate the victim's experience?
     - **Sufficient Answer**:
          - If the answer is clearly yes, then go to Step 4 (Sustained).
          - If the answer is clearly no, then go to Step 5 (Dismissal).
          - If it is unclear (borderline), then go to Step 6 (Escalate to Human Judgment).

  **Step 4: Sustained**
     - **Rationale**: Write a rationale that includes:
          - The severe incident(s) found in Step 1, OR
          - The repetition level (and aggravating factors if applicable) and the finding that a reasonable person would find the conduct hostile.

  **Step 5: Dismissal**
     - **Rationale**: Write a rationale that explains:
          - No severe incident, and
          - Insufficient repetition (and no sufficient aggravating factors) OR
          - Even with repetition, a reasonable person would not find the conduct hostile.

  **Step 6: Escalate to Human Judgment**
     - **Rationale**: The case is borderline. The decision must be made by a designated human (e.g., the team lead or a committee) based on institutional values and the specific context. The rationale should state the factors that make it borderline.

  **Addressing the Hazards**:

  1. **Sorites Trap**:
     - We break the chain by using thresholds for repetition (low, medium, high) and by allowing aggravating factors to push a low repetition case to medium. We do not require that each incident be evaluated in isolation for its contribution to repetition. Instead, we look at the totality.

  2. **Ratchet Effect**:
     - We allow comparison to prior cases only in the human judgment step (Step 6) or when setting the thresholds (which should be reviewed periodically by the institution, not case by case). The thresholds (e.g., 5 incidents for medium) are fixed until the policy is revised. In the rationale, investigators are instructed not to cite prior cases as setting a precedent for the boundary. Instead, they must use the factors and thresholds in the procedure.

  3. **Disagreement Problem**:
     - We acknowledge that two investigators might disagree on a borderline case. This is normal for vagueness. The procedure routes such cases to Step 6 (human judgment) to ensure consistency. The procedure is designed to minimize disagreement by providing clear factors, but when it occurs, it is managed by escalation.

  **Worked Examples**:

  **Case 1: Accent Remarks**
     - Facts: Over four months, about a dozen remarks about the victim's accent. None severe individually. Victim dreads team meetings.

     - **Step 1**: No single incident is severe. Go to Step 2.
     - **Step 2**: Repetition: about 12 incidents in 4 months. This is high repetition (over 7). Go to Step 3.
     - **Step 3**: Would a reasonable person find this hostile? 
          - The victim's dread of meetings suggests interference with work.
          - A dozen remarks about accent, even if individually trivial, can cumulatively create a hostile environment, especially if they target a protected characteristic (accent can be related to national origin). 
          - We assume there is no contrary evidence (like the victim previously participating in similar banter). 
          - **Answer**: Yes. Therefore, go to Step 4 (Sustained).

     - **Rationale**: The conduct involved a high number of repeated remarks about the victim's accent over a relatively short period, which a reasonable person would find hostile because it created an environment the victim dreaded. No single incident was severe, but the repetition and the impact on the victim meet the policy's definition.

  **Case 2: Two Incidents, One Vicious**
     - Facts: Two incidents. One is a vicious joke in front of a client.

     - **Step 1**: One incident (the joke) is independently severe. Therefore, go to Step 4 (Sustained).

     - **Rationale**: The joke incident was severe, as it was vicious and made in front of a client, which would be found intimidating and offensive by a reasonable person. Therefore, the conduct violates the policy.

     - Note: Even though there was only one other incident, we don't need to consider repetition because one incident was severe.

  **A Case with an Unpopular Outcome**:

  Consider a case with 3 incidents of mildly rude behavior (e.g., interrupting in meetings, not returning emails promptly, and one sarcastic comment) over a year. The victim says it made them feel undermined.

     - **Step 1**: None severe. Go to Step 2.
     - **Step 2**: Repetition: 3 incidents (low). Go to Step 2A.
     - **Step 2A**: Aggravating factors? 
          - Same nature? Not really (different types of rudeness).
          - Targeted? Yes, at the victim.
          - Victim vulnerable? Not specified.
          - Perpetrator in authority? Not specified.
          - Victim expressed discomfort? Not specified.
          - We have one factor (targeted). We need two to push to medium. Therefore, we do not push to medium.
          - Go to Step 5 (Dismissal).

     - **Rationale**: The conduct, while rude, did not include any severe incident. The repetition (3 incidents over a year) is low, and there are insufficient aggravating factors (only one: targeted) to consider it repeated to a level that would meet the policy. The procedure does not find that a reasonable person would find this pattern, without more, to be intimidating, hostile, or offensive.

     This might be unpopular because the victim felt undermined, but the procedure requires either severity or repetition with aggravating factors. Here, we don't have enough.

  **Where the Procedure Runs Out**:

  The procedure cannot decide values questions. For example:
     - How should we weigh the perpetrator's intent? (The policy doesn't require intent, but sometimes it might be relevant to the context.)
     - What if the conduct is part of a subculture that the company wants to change? 
     - How do we define "reasonable person" in a diverse workforce? 

  These are institutional value judgments. Step 6 (escalation) is for such cases.

  **Implicit Theory of Vagueness**:

  The procedure is most aligned with **supervaluationism**. We consider multiple ways of precisifying the policy (e.g., setting different thresholds for repetition) and look for a consensus. The thresholds (low, medium, high) represent admissible precisifications. A case is sustained only if it would be harassing under all admissible precisifications (if it has a severe incident OR high repetition, then it's clearly harassing). Borderline cases (like medium repetition without clear impact) are left for human judgment because they are true under some precisifications and false under others.

  **A Rival Theory: Epistemicism**:

  If we built the procedure on epistemicism, we would set a precise boundary (e.g., exactly 5 incidents in 6 months is the threshold). Then:
     - Step 2 would have a fixed number (say, 5) for repetition to count as sufficient. There would be no ranges (low, medium, high) and no Step 2A for aggravating factors because the boundary is precise and known (even if arbitrary). 
     - We would not have Step 6 (escalation) because every case would be decidable by the procedure. 
     - The hazard: the arbitrary boundary might not reflect context, and every case near the boundary (4 incidents vs 5) would be decided without flexibility.

  **Another Rival: Degree Theory**:

  We might assign a score to each incident (e.g., severity score 0-3, and repetition score based on count and clustering). Then we would have a formula (e.g., total score = max(severity) + repetition factor). We set a threshold (say, 5) for violation. 
     - Step 1: If any incident has severity>=3, then sustained.
     - Step 2: Count incidents and compute repetition factor (e.g., 1 point per incident, plus 1 point if within 3 months). Then total score = max(severity) + repetition factor. If total>=5, sustained; else, dismissed.
     - This would be more mechanical but might not capture context well.

  **Conclusion**:

  The proposed procedure uses supervaluationism to handle vagueness by setting clear factors and thresholds while recognizing that borderline cases require human judgment. It avoids the sorites trap by using thresholds and aggravating factors, controls the ratchet by fixing thresholds and not allowing case-by-case precedent, and manages disagreement by escalating borderline cases. It produces written rationales and runs in under an hour.

  **Procedure Summary**:

  1. **Severity Check**: Any severe incident? If yes, sustained.
  2. **Repetition Check**: 
     - Count incidents: 
          - High (>=7): go to Step 3.
          - Medium (4-6): go to Step 3.
          - Low (1-3): go to Step 2A.
  3. **Aggravating Factors (for low repetition)**:
     - If at least two factors (same nature, targeted, vulnerability, authority, victim objected) are present, treat as medium and go to Step 3. Else, dismiss.
  4. **Reasonable Person Standard**: 
     - Does the totality create a hostile environment? 
          - Yes: sustained.
          - No: dismissed.
          - Unclear: escalate to human judgment.
  5. **Outcomes**: Sustained, Dismissed, or Escalate.

  This procedure is grounded in the philosophy of vagueness and addresses the practical constraints.
answer: |-
  Below is a decision procedure grounded in the philosophy of vagueness, designed for your team's use. It addresses the sorites paradox, boundary creep ("ratchet"), and investigator disagreement while delivering clear, auditable outcomes in under an hour per case. The procedure uses plain language (with key terms defined in the **Preamble**) and produces written rationales for appeals. I'll first outline the procedure, then apply it to your two cases, and finally address its theoretical grounding and limitations.

  ---

  ### **Preamble: Key Definitions**
  1. **Tolerance intuition**: The idea that a tiny change (e.g., one more remark) shouldn’t flip a non-violation to a violation. We respect this but avoid the sorites trap by **rejecting infinite tolerance chains**.
  2. **Borderline case**: A situation where even reasonable people disagree on whether it violates the policy. This doesn’t mean we’re "ignorant" of the answer—it means the policy **deliberately lacks a precise boundary**.
  3. **Sufficient severity/repetition**: Behavior is "severe" if it would shock/disgust most peers; "repeated" if it reflects a **pattern**, not isolated incidents. We use **comparison classes** (e.g., "typical workplace banter" vs. "documented harassment cases") to anchor judgments.
  4. **Residual values question**: When factors (e.g., intent, power imbalance) require weighing institutional priorities (e.g., "psychological safety" vs. "free expression"). These are escalated to a human.

  ---

  ### **The Decision Procedure**
  **Steps 1–4 must be completed in order.** At each step, document evidence and reasoning.  
  **Time limit**: 45 minutes per case (30 for steps, 15 for rationale).  
  **Outcomes**: Dismissal (D), Sustained (S), or Escalate to Named Human (H).  
  **Named Human**: A designated arbitrator (e.g., your senior investigator or ethics officer) for values-based judgments.

  #### **Step 1: Severity Check**  
  **Question**: "Was any single incident **severe**—i.e., would >80% of reasonable peers call it 'intimidating, hostile, or offensive' even if isolated?"  
  - **Sufficient answer**:  
    - **Yes** (e.g., threat, slur, public humiliation) → Outcome: **Sustained (S)**. Skip to Step 4.  
    - **No** → Proceed to Step 2.  
  - **Evidence**: Witness accounts, policy precedents (if objective, e.g., "slurs are always severe").  
  - **Rationale note**: If unclear, default to "no" to avoid overreach. Borderline severity goes to Step 2.

  #### **Step 2: Repetition and Pattern Assessment**  
  **Question**: "Was there a **pattern of behavior** (e.g., similar acts, same target, escalating frequency) that distinguishes this from isolated incidents?"  
  - **Sufficient answer**:  
    - **No pattern** (e.g., 2 unrelated remarks over a year) → Outcome: **Dismissal (D)**. Skip to Step 4.  
    - **Pattern exists** (e.g., >3 similar incidents targeting one person) → Proceed to Step 3.  
  - **Evidence**: Frequency, similarity of acts, target consistency, progression over time.  
  - **Avoiding sorites trap**: Do **not** count incidents or fix a number. Ask: "Is this a **meaningful pattern** compared to normal workplace friction?" Use **comparison classes**:  
    - *Baseline*: "Typical team disagreements."  
    - *Threshold*: "Documented harassment cases from our records."  
    - **Pattern exists** if closer to threshold than baseline.

  #### **Step 3: Totality Assessment**  
  **Question**: "Would a reasonable person in the victim’s position find the **totality of behavior** 'intimidating, hostile, or offensive'?"  
  - **Sufficient answer**:  
    - **Clearly yes** (e.g., victim withdrew, sought therapy) → Outcome: **Sustained (S)**.  
    - **Clearly no** (e.g., no impact, victim participated willingly) → Outcome: **Dismissal (D)**.  
    - **Unclear/Disputed** (e.g., mixed witness views) → Outcome: **Escalate to Human (H)**.  
  - **Evidence**: Victim impact (behavior changes, medical notes), witness consensus, context (e.g., power imbalance).  
  - **Avoiding ratchet**: **Do not cite prior cases** unless they establish objective facts (e.g., "slurs are severe"). Say: "Prior outcomes don’t set binding thresholds—each case is contextually unique."

  #### **Step 4: Outcome and Rationale**  
  - **Write rationale** (15 minutes max):  
    - State outcome (S/D/H).  
    - Summarize Step 1–3 answers and key evidence.  
    - **Explicitly flag borderline aspects** (e.g., "4 remarks are borderline for 'repeated'; human judgment was required").  
  - **Appeal-proofing**: Use the template:  
    > *"Based on [evidence], we found [answer] at Step [1/2/3] because [reason]. The totality assessment considered [factors]. Residual vagueness was handled by [S/D/H] per procedure."*  

  ---

  ### **Addressing the Hazards**
  1. **Sorites trap**:  
     - **Solved in Step 2**: Reject tolerance chains by using **pattern recognition** (not counting) and **comparison classes**. Example: "5 accent remarks form a pattern because they’re closer to harassment cases than routine banter."  
  2. **Ratchet effect**:  
     - **Solved in Step 3**: Ban analogies to past outcomes. Use **fixed comparison classes** ("baseline" vs. "threshold") that don’t shift with cases.  
  3. **Disagreement problem**:  
     - **Not a defect**: Borderline cases will yield split outcomes (e.g., 60% S vs. 40% D). This is **normal for vagueness**. Escalate these to the Named Human to ensure consistency. Document: "Investigator disagreement reflects penumbral uncertainty."  

  ---

  ### **Worked Examples**
  #### **Case 1: Accent Remarks (12 trivial remarks over 4 months; victim dreads meetings)**  
  - **Step 1**: No single incident severe (all remarks trivial; witnesses agree). → Proceed to Step 2.  
  - **Step 2**: **Pattern exists**. 12 similar remarks (about accent), same target, escalating frequency (biweekly to weekly). Comparison: Closer to harassment cases (e.g., targeted teasing) than baseline (occasional jokes). → Proceed to Step 3.  
  - **Step 3**: **Clearly yes**. Victim’s dread is corroborated (e.g., skipped meetings, emails show distress). Reasonable person would find 12 accent remarks hostile. → Outcome: **Sustained (S)**.  
  - **Rationale**:  
    > *No single remark was severe (Step 1). However, 12 similar remarks over 4 months formed a pattern targeting the victim’s accent (Step 2). The totality created a hostile environment, as the victim’s dread altered work conditions (Step 3). Sustained.*  

  #### **Case 2: Two Incidents (one vicious joke in front of client)**  
  - **Step 1**: **Yes, severe**. The joke was vicious (client/witnesses shocked; violated client-conduct rules). → Outcome: **Sustained (S)**. Skip other steps.  
  - **Rationale**:  
    > *The client-facing joke was severe per witness consensus and policy precedent on public humiliation (Step 1). Sustained.*  

  #### **Unpopular Outcome Example**  
  **Case**: 4 mild remarks (e.g., "Your idea is naive," "Can you speak up?") over 6 months. Victim says they felt "subtly undermined," but no witnesses, no behavior changes.  
  - **Step 1**: No severe incident (remarks are rude but not shocking). → Proceed to Step 2.  
  - **Step 2**: **No pattern**. Remarks were infrequent, dissimilar (no common theme), and not escalating. Comparison: Closer to baseline (occasional friction) than harassment threshold. → Outcome: **Dismissal (D)**.  
  - **Why unpopular?** Victim felt undermined, but the procedure requires **evidence of pattern or impact**. Vagueness theory doesn’t resolve "subjectivity without objective markers."  
  - **Rationale**:  
    > *No severe incident (Step 1). Remarks lacked a pattern (dissimilar, infrequent) and were within baseline workplace friction (Step 2). Dismissed.*  

  ---

  ### **Where the Procedure Runs Out**
  - **Values questions** require human escalation:  
    - Step 3: If "reasonable person" depends on **institutional priorities** (e.g., "Should we prioritize victim sensitivity over intent?").  
    - Example: A borderline pattern (e.g., 4 remarks) with high power imbalance (manager vs. intern). The Named Human must weigh: "Does our policy prioritize protecting vulnerable employees?"  
  - **What vagueness theory cannot do**:  
    - **Define "reasonable person"**—this is values-based (e.g., "Whose perspective matters?").  
    - **Resolve clashes in context** (e.g., "joke-heavy culture" vs. "victim’s trauma").  
    - **Set universal thresholds**—the procedure accepts that "5 remarks" may be harassment in one context but not another.  

  ---

  ### **Theoretical Grounding and Rival Theories**
  - **This procedure’s implicit theory: Contextualist Supervaluationism**.  
    - **How it manifests**:  
      - **Supervaluationism**: "Truth" requires consensus across all admissible precisifications (e.g., "hostile" must hold under all reasonable interpretations of the policy). Steps 1–3 seek this consensus.  
      - **Contextualism**: Meaning shifts with context (e.g., "hostile" in a factory vs. office). Fixed comparison classes (Step 2) and totality assessments (Step 3) stabilize context.  
      - Borderline cases (Step 3 "unclear") lack consensus → escalated.  
    - **Why it fits**: Balances objectivity (avoiding arbitrariness) with flexibility (context matters).  

  - **Rival Theory: Epistemicism**  
    - **Difference**: Assumes a precise but unknown boundary (e.g., "exactly 5 remarks = violation").  
    - **Procedure changes**:  
      - Step 2 would require **counting incidents** and comparing to a fixed number (e.g., "≥5 = pattern").  
      - Step 3 **eliminated**—no totality assessment (since precise thresholds decide everything).  
      - Escalations **reduced** (no values questions; vagueness = "ignorance," not indeterminacy).  
    - **Flaw in practice**: Arbitrary thresholds (e.g., "4 remarks dismissed; 5 sustained") invite gaming and ratchet effects.  

  - **Rival Theory: Degree Theory**  
    - **Difference**: Assigns "truth degrees" (e.g., severity = 0.7/1.0).  
    - **Procedure changes**:  
      - Steps 1–3 replaced with **scoring** (e.g., severity + repetition points; sustain if > threshold).  
      - Ratchet **worsened** (scores invite analogies to past cases).  
      - Borderline cases **forced into binary outcomes** (no escalation).  
    - **Flaw in practice**: Requires arbitrary weights (e.g., "Is a severe incident worth 3x a repeated one?").  

  ---

  ### **Summary**
  This procedure leverages vagueness philosophy to deliver a fair, efficient process:  
  - **Sustains** clear violations (severe acts or patterns with impact).  
  - **Dismisses** trivial/non-pattern cases.  
  - **Escalates** borderline/value-laden judgments to a human.  
  It prevents sorites traps (pattern > counting), ratchet creep (fixed comparisons), and treats disagreement as normal. **Implementation tip**: Train investigators on comparison classes (e.g., share anonymized "baseline" and "threshold" examples quarterly) to reduce escalations.
