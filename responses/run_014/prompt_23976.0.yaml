  ## The Semantics of Slur: Contempt Woven in the Word or Fire by Association?

  The debate over the nature and harm of slurs cuts to the heart of how language shapes reality and inflicts injury. On one side, **expressivism/conventionalism** argues that the derogatory force is semantically encoded, an inherent component of the word's meaning that directly expresses contempt for its target group. On the other, **associationism** contends that slurs are primarily descriptive terms (like their neutral counterparts) whose harm arises pragmatically through their triggering of deeply ingrained, derogatory stereotypes and attitudes within a specific context. Evaluating these theories requires weighing their arguments and examining their predictions for critical cases: non-bigoted use, quotation, and reclamation. Ultimately, while associationism captures contextual nuance, expressivism offers a more robust account of the *automatic* and *inherent* harm that defines a slur.

  **The Expressivist Arsenal: Contempt in the Code**
  Expressivists (e.g., Hom 2008, 2012; Jeshion 2013) argue that slurs possess a unique semantic component beyond mere reference: an **expressive function** that *prescribes* contempt or hatred towards the target group. This is conventional, meaning it's a stable, rule-governed part of the word's meaning within the linguistic community. Key arguments include:
  1.  **Immediate Offense:** The offense caused by a slur is often instantaneous and visceral, even when uttered without overt malice or in unexpected contexts. This suggests the harm is triggered by the word itself, not just inferred attitudes.
  2.  **Disconnect from Belief:** A speaker can correctly use a slur *without* personally endorsing the associated stereotypes (e.g., an actor in a role, a philosopher discussing the term). Yet, the utterance remains offensive and harmful. Expressivism explains this: uttering the word *enacts* the prescribed contempt, regardless of the speaker's beliefs.
  3.  **Truth-Conditional Differences:** Expressivists often argue slurs and their neutral counterparts (e.g., "ch*nk" vs. "Chinese person") don't share identical truth conditions. The slur expresses contempt *in addition to* referring, making its meaning fundamentally different.

  **Predictions for Tricky Cases:**
  *   **Non-Bigoted Use:** Still harmful/wrong. The word *itself* performs the act of expressing contempt. Using it, even disavowing the stereotype, still deploys this harmful convention.
  *   **Quotation:** Still potentially harmful/wrong. Reproducing the word, even in a neutral context like a linguistics paper, risks *reenacting* the prescribed contempt or causing distress by forcing listeners to process the toxic term. Justification requires strong necessity and mitigation.
  *   **Reclamation:** Difficult but *possible* if the word's semantic content changes. The in-group must successfully *redefine* the term, stripping it of its conventional expressive content (e.g., transforming "queer" from a slur to a proud identifier). It's not just context shift; it's meaning change.

  **The Associationist Case: Harm by Evocation**
  Associationists (e.g., Bolinger 2017; Nunberg 2018; Picardi 2006) argue that slurs are primarily descriptive terms whose derogatory force stems from their strong **pragmatic association** with historically entrenched, derogatory stereotypes and attitudes. The word itself doesn't encode contempt; it *evokes* it. Key arguments include:
  1.  **Contextual Variability:** The offensiveness of a slur *can* be mitigated or amplified by context (e.g., in-group use, ironic deployment, historical discussion). This suggests the harm isn't rigidly semantic but depends on how the word activates associated attitudes.
  2.  **Explaining Reclamation:** Reclamation is easier to explain – the in-group uses the term in contexts where the derogatory stereotypes are blocked or inverted, weakening the negative associations without changing the word's core meaning.
  3.  **Parity of Reference:** Slurs often refer to the same group as their neutral counterparts. The difference lies not in *what* they denote, but in the derogatory baggage they carry via association.

  **Predictions for Tricky Cases:**
  *   **Non-Bigoted Use:** May be *less* harmful or even neutral if the context effectively blocks the activation of derogatory stereotypes (e.g., a very careful philosophical demonstration). The harm comes from evoking hatred, not the word itself.
  *   **Quotation:** Harm is primarily a *risk* of unintended stereotype activation or offense, not inherent wrongness. In a truly neutral, academic context focused purely on the word *as* a word (e.g., discussing its etymology), the derogatory force may be largely inert. Wrongness stems from recklessness, not the act of quotation itself.
  *   **Reclamation:** Entirely possible and common. The in-group uses the term in contexts that suppress negative associations and foster positive ones, leveraging the word's history for empowerment without altering its semantic core.

  **Weighing the Arguments and Facing the Cases**

  Associationism rightly highlights context's power and offers an elegant account of reclamation. However, it struggles with the **persistent, low-level harm** that seems to cling to slurs even in ostensibly neutral contexts. Can a linguist *truly* mention a virulent slur in a lecture hall without *any* trace of its toxicity surfacing? The visceral flinch experienced by many listeners suggests not. Associationism also risks minimizing the harm of "non-bigoted" use; if the word itself is neutral, why is deploying it still often felt as a profound betrayal or assault, regardless of stated intent?

  Expressivism better captures this **inescapable toxicity**. The "non-bigoted" user still weaponizes a term whose core function is to degrade. Quotation forces the audience to confront the contempt-prescribing symbol itself, replicating harm even if unintended. While expressivism makes reclamation harder to explain – requiring genuine semantic shift – this aligns with the reality that reclaimed terms often retain a complex, contested edge; their original venom isn't fully erased but actively repurposed.

  The critical flaw in treating this as a strict dilemma is overlooking how **convention and association intertwine**. The derogatory stereotypes are *not* arbitrary associations; they are the very attitudes the slur conventionally *expresses* and *reinforces* through use. The word's conventional meaning *depends* on its historical association with these attitudes, and its utterance *reactivates* them. Conversely, the persistence of the associations relies on the word's conventional role as a vehicle for contempt.

  **Verdict: Expressive Core with Pragmatic Amplification (Leaning Expressivist)**

  While context modulates the *degree* and *manifestation* of harm, the **expressivist core is essential** to explain the fundamental, automatic wrongness of uttering a slur. The word itself is a loaded weapon; its conventional meaning includes the prescription of contempt. Associationism accurately describes the *mechanism* by which this contempt connects to broader societal hatred (the stereotypes) and the *context* that can sometimes partially mute or redirect its impact. However, the initial detonation, the core harm, resides in the semantic encoding of contempt.

  Therefore:
  *   **Non-bigoted use is wrong:** It deploys a contempt-expressing convention. Stated lack of belief doesn't nullify the enacted meaning.
  *   **Quotation is often harmful/wrong:** Reproducing the toxic symbol risks re-enacting its harm or causing distress, demanding strong justification and care. It's not merely a risk of misunderstanding; it's exposure to the harmful convention.
  *   **Reclamation is possible but transformative:** It requires wresting control of the term and fundamentally altering its expressive content through sustained in-group use, creating a new convention – a difficult, ongoing process.

  The real question isn't *whether* convention or association causes the harm, but **how the conventional meaning of a slur *is* the prescription of contempt, achieved and sustained through its inextricable association with derogatory attitudes and histories.** The word isn't just a key that *might* unlock hatred; it's a mold that shapes it. To utter a slur is to participate in that act of shaping, regardless of intent. The expressive burden is inescapable.

  **Verdict: expressive** (acknowledging pragmatic modulation, but affirming the semantic core of contempt).
