prompt: |-
  I'm a program officer at a small regional foundation that disburses about $3 million a year in grants of roughly $20,000 to $250,000, across a messy portfolio: youth programs, a food bank, a river cleanup coalition, some workforce training pilots. Quarterly cycles, a board of twelve that has to sign off on anything above $100,000, and no research staff — it's me, a half-time analyst, and whatever the applicants themselves send in. I've been reading philosophy in the evenings (I took a couple of courses in college) and I've become obsessed with the problem philosophers call consequentialist cluelessness: the observation that essentially every action sets off causal ripples we cannot trace — a childhood vaccination in 2010 changes who exists in 2080; a well-run literacy program displaces some other program that would have run instead; the counterfactual effects of what we *don't* fund are as unknowable as the effects of what we do. Proponents of act-utilitarian-style reasoning often respond with things like expected-value estimation or fall-back heuristics, and critics reply that when you're guessing at the sign of the second-order effects, the arithmetic confidence is fake. I don't need the philosophy settled. I need it usable.

  Please write a decision procedure my office could actually run on a funding proposal: the questions to ask in order, what counts as a sufficient answer to each question, which answers should stop the process with a no or escalate it to the board, and — this is the part I care most about — where the procedure has to give up and hand the decision to a human being because the question is one of values or unquantifiable judgment rather than facts. The procedure should be honest about the difference between an intervention with traceable local effects and one whose case rests on long untraceable chains, and it should tell me what to do when both kinds are on the table at once (as they always are at allocation time). It has to be runnable in a day per proposal by someone with no statistics training beyond a spreadsheet.

  Then run it on three hypotheticals of the kind that actually cross my desk: (1) $80,000 for a food bank to expand weekend meal backpacks to two more school districts, where the main claimed benefit is direct and local but the applicant's own letter admits it will pull volunteers from a neighboring program; (2) $150,000 for a workforce training pilot whose proponents claim a plausible chain from better training to better jobs to reduced incarceration decades out, where every link past the first is a guess; and (3) $30,000 to keep a small, beloved, demonstrably mediocre tutoring program alive, whose strongest argument is that if it dies the school will redirect the space to a study hall. Include at least one case where the procedure returns an answer I won't like, and say plainly what the procedure cannot do — where cluelessness genuinely bottoms out and the honest output is not a number but a choice someone has to own.
reasoning: |-
  We are designing a decision procedure that acknowledges "consequentialist cluelessness" — the idea that we cannot trace all the ripple effects of our actions. The procedure must be practical for a small foundation, runnable by someone with basic spreadsheet skills, and take about a day per proposal. It should include:
  - Ordered questions
  - Criteria for sufficient answers
  - Stop conditions (auto-reject or escalate to board)
  - Clear points where the decision must be handed to a human due to unquantifiable judgments

  The procedure should distinguish between:
  A. Interventions with traceable local effects (TLE)
  B. Interventions relying on long, untraceable chains (UTC)

  And handle cases where both are present.

  **Core Structure of the Procedure:**

  1. **Initial Screening (Must-pass):** Basic eligibility (alignment with mission, legal compliance, etc.). If fail, reject.
  2. **Cluelessness-Aware Assessment:** This is the core. We break down the proposal into:
     a. **Traceable Local Effects (TLE):** Effects that are directly observable and measurable in the short term (within 1-3 years) and within the direct scope of the project.
     b. **Untraceable Chain (UTC):** Effects that rely on long chains of causality (beyond 3 years) or indirect effects (like systemic change, behavioral changes in future generations, etc.).

     We then assess each separately and then together.

  3. **Risk and Uncertainty Assessment:** Considering the potential for negative effects (both traceable and untraceable) and the uncertainty around them.
  4. **Decision Gates:** Based on the above, we decide:
     - Reject
     - Approve (if below board threshold)
     - Escalate to board (if above $100,000 or if the human judgment gate is triggered)
     - Human Judgment Gate: When the assessment cannot resolve due to cluelessness, we explicitly note that the decision rests on values and must be made by a human (with the procedure providing the best available analysis).

  **Detailed Procedure:**

  **Step 0: Pre-Screening (Basic Eligibility)**
  - Questions:
    1. Does the proposal align with our foundation's mission and focus areas?
    2. Is the applicant eligible (non-profit status, etc.)?
    3. Is the budget within our range ($20,000-$250,000) and the request amount reasonable for the project?
    4. Are there any legal or regulatory red flags?
  - Criteria: All must be "yes". If any "no", reject.

  **Step 1: Traceable Local Effects (TLE) Assessment**
  - Goal: Evaluate the direct, short-term, measurable effects of the project.
  - Questions:
    1. What is the primary direct outcome the project aims to achieve? (e.g., number of meals distributed, number of students tutored)
    2. How will this outcome be measured? (Specify metrics and data collection method)
    3. What is the expected magnitude of the outcome (e.g., 500 children receiving weekend meals for a school year)?
    4. Is there evidence (from the applicant or similar projects) that the project can achieve this outcome? (e.g., past data, pilot results, research)
    5. What is the cost per unit outcome? (e.g., cost per meal, cost per student tutored)
    6. Are there any direct negative effects (within 1-3 years) that can be traced? (e.g., pulling volunteers from another program, displacement of other services)

  - Criteria for sufficiency:
    - For questions 1-3: Clear, specific, and quantifiable answers.
    - For question 4: At least one of: (a) internal data from the applicant showing past success, (b) external evidence from similar projects, (c) a logical explanation of why it should work if novel.
    - For question 5: Calculable from the budget and outcome numbers.
    - For question 6: Must be addressed. If negative effects are identified, we require the applicant to either: (a) show they are negligible, (b) propose mitigation, or (c) argue that the benefits outweigh them.

  - Scoring (for internal use, not shared with applicant):
    - Rate the TLE on a scale of 1-5 for:
      - Clarity of outcome and measurement (1: vague, 5: crystal clear)
      - Strength of evidence (1: no evidence, 5: strong evidence from multiple sources)
      - Cost-effectiveness (1: very high cost per outcome, 5: very low cost per outcome)
      - Negatives (1: severe and unmitigated, 5: none or well-mitigated)

    - If the TLE score (average of the four) is below 2.5, reject. If above 4, proceed to next step with high confidence in TLE.

  **Step 2: Untraceable Chain (UTC) Assessment**
  - Goal: Acknowledge and evaluate the long-term, indirect, or systemic claims without pretending we can trace them.
  - Questions:
    1. Does the applicant claim any long-term or indirect benefits (beyond 3 years or beyond direct participants)? If no, skip to Step 3.
    2. What is the claimed chain of causality? (e.g., training -> better job -> less crime)
    3. For each link in the chain beyond the first (which should be covered in TLE), what is the strength of the evidence for that link? (e.g., research showing that job training reduces recidivism)
    4. What are the potential negative effects of the intervention in the long term or systemically? (e.g., unintended consequences, opportunity costs)

  - Criteria for sufficiency:
    - For question 2: A clear step-by-step chain must be provided.
    - For question 3: We require at least one piece of evidence per link beyond the first. This can be research, theory, or case studies. If no evidence, the link is considered speculative.
    - For question 4: Must be addressed. If the applicant doesn't, we note it as a risk.

  - Scoring (for internal use):
    - Rate the UTC on:
      - Plausibility of the chain (1: highly implausible, 5: highly plausible)
      - Evidence per link (1: no evidence for any link beyond first, 5: strong evidence for every link)
      - Consideration of negative systemic effects (1: ignored, 5: thoroughly addressed and mitigated)

    - If the UTC is present and the average score is below 2, it means the UTC argument is weak and we should base the decision primarily on TLE. If the average is above 4, the UTC argument is strong enough to be a significant factor.

  **Step 3: Integration and Uncertainty**
  - Goal: Combine TLE and UTC and assess overall uncertainty.
  - Questions:
    1. What is the overall expected benefit when combining TLE and UTC? (We can't calculate a number, but we can have a qualitative sense: high, medium, low.)
    2. What is the level of uncertainty? (Consider: How much of the case rests on UTC? How speculative are the links? How well are negative effects addressed?)
    3. What is the worst-case scenario? (e.g., the project fails and wastes money, or causes harm)

  - Criteria:
    - We create an overall assessment:
      - High expected benefit: Strong TLE and strong UTC (if present) OR very strong TLE without UTC.
      - Medium: Moderate TLE and moderate UTC OR strong TLE but with some negatives OR weak UTC but strong TLE.
      - Low: Weak TLE and/or weak UTC with high uncertainty.

    - Uncertainty rating: Low, Medium, High.

  **Step 4: Decision Gates**
  - If the proposal is above $100,000, it must go to the board. Otherwise, we decide at staff level.
  - Human Judgment Gate: If the assessment (especially in Step 3) results in a medium expected benefit with high uncertainty, or low expected benefit but with strong value-based arguments (like preserving a beloved program), then we must explicitly note that the decision cannot be made by the procedure alone and requires human judgment based on values. In that case, we prepare a summary for the decision-maker (staff or board) that clearly states:
    - The traceable benefits and their strength.
    - The untraceable claims and their plausibility.
    - The uncertainties and the value trade-offs.

  - Reject conditions:
    - TLE score < 2.5 (from Step 1)
    - Overall expected benefit is low and uncertainty is high.

  - Approve conditions:
    - High expected benefit and low uncertainty (if below $100k, approve; if above, recommend approval to board).
    - Medium expected benefit and low uncertainty (same).

  - Escalate to board: All proposals above $100k, and any proposal that triggers the Human Judgment Gate (so that the board can make the value call).

  **Step 5: Documentation**
  - For every proposal, document:
    - TLE assessment (scores and rationale)
    - UTC assessment (if applicable, scores and rationale)
    - Overall expected benefit and uncertainty
    - Recommendation (reject, approve, or for board) and any value-based considerations.

  **Running the Hypotheticals:**

  **Case 1: $80,000 for food bank weekend meal backpacks expansion**
  - TLE Assessment:
    - Primary outcome: More children in two school districts receiving weekend meals. Measured by number of backpacks distributed.
    - Expected magnitude: Specific numbers provided (e.g., 500 children for 30 weekends).
    - Evidence: Food bank has data from existing programs showing they can distribute and that it reduces food insecurity (survey data). Cost per meal is known and reasonable.
    - Negative: Pulling volunteers from a neighboring program. The applicant admits this. They propose mitigation by recruiting more volunteers and staggering schedules. But this may not fully mitigate. We rate negatives as moderate (score 3).
    - TLE scores: Clarity 5, Evidence 4, Cost-effectiveness 4, Negatives 3 → Average 4.0 (strong).

  - UTC Assessment: None claimed. Skip.

  - Integration: High expected benefit (strong TLE), low uncertainty. Negatives are mitigated and local.

  - Decision: Since $80k < $100k, staff can approve. But note the volunteer issue and monitor.

  **Case 2: $150,000 for workforce training pilot with long-term incarceration reduction claims**
  - TLE Assessment:
    - Primary outcome: Number of people trained, completion rates, job placement rates (short-term jobs, within 6 months of training).
    - Measurement: Track trainees through the program and for 6 months after.
    - Evidence: The organization has run similar pilots? If not, then evidence is weak. Let's assume they have some pilot data showing good completion and placement. Cost per trainee is high? (If 100 trainees, cost $1,500 each, which is reasonable for workforce training? Compare to benchmarks.) 
    - Negatives: Not mentioned. We must ask. Maybe it pulls resources from other programs? Or trains for jobs that might not exist? Assume they haven't addressed. Score negatives as 2 (low).
    - TLE scores: Clarity 4, Evidence 3 (if they have some data), Cost-effectiveness 3 (if cost per trainee is average), Negatives 2 → Average 3.0 (moderate).

  - UTC Assessment:
    - Claimed chain: Training → better job → reduced incarceration (decades out).
    - Evidence for links: 
      - Link 1 (training to job): Covered in TLE (short-term job placement).
      - Link 2 (job to reduced incarceration): Research exists (e.g., job programs reduce recidivism for ex-offenders). But note: this program is for at-risk youth, not ex-offenders. Research might be less direct. The applicant provides one study. We rate evidence as moderate (score 3).
    - Negative systemic effects: Not addressed. Score 2.
    - UTC scores: Plausibility 4 (it's a logical chain), Evidence per link 3 (only one link and it's moderately supported), Negatives 2 → Average 3.0.

  - Integration:
    - Overall expected benefit: Medium (TLE moderate, UTC moderate).
    - Uncertainty: High (because the UTC link is not strongly evidenced and the long-term effects are far off, and negatives are not addressed).

  - Decision: 
    - Amount is $150k (>$100k) → must go to board regardless.
    - Also, the Human Judgment Gate is triggered because we have medium expected benefit with high uncertainty. The board must decide if they are willing to fund based on the potential long-term payoff despite the uncertainty.

  **Case 3: $30,000 for a small, beloved, demonstrably mediocre tutoring program**
  - TLE Assessment:
    - Primary outcome: Number of students tutored, and their academic improvement.
    - Measurement: The applicant provides data showing mediocre results (e.g., only 40% of students show improvement, and it's small). 
    - Evidence: Their own data shows weak impact. Cost per student is high (if only 20 students, $1,500 each, and the impact is small). 
    - Negatives: None direct. But the opportunity cost is high because the space could be used for a study hall which might benefit more students. The applicant argues that if they don't get the funding, the program dies and the space becomes a study hall. So the counterfactual is a study hall. We must compare the tutoring (mediocre) to the study hall (which might be low-cost and serve more students). 
    - TLE scores: 
      - Clarity: 5 (clear outcomes, but mediocre)
      - Evidence: 1 (their own data shows weak impact)
      - Cost-effectiveness: 1 (high cost per student for small impact)
      - Negatives: 5 (no direct negatives, but the counterfactual is a study hall which might be better) → but note: the negative is the opportunity cost. We might rate negatives as 3 (because the study hall isn't proven either) or 1 (because we are forgoing a potentially better use). Let's rate opportunity cost as a negative and score it 2 (significant potential downside). 
      - Average TLE: (5+1+1+2)/4 = 2.25 (below 2.5 → reject by TLE)

  - UTC Assessment: None claimed.

  - Integration: Low expected benefit (TLE score 2.25), low uncertainty (we know it's mediocre).

  - Decision: Reject by procedure because TLE < 2.5.

  But note: the applicant is beloved. The procedure says reject, but this might be a case where the community values the program beyond the measurable outcomes. The procedure flags that we are in the Human Judgment Gate because the TLE is weak but there might be non-utilitarian values (like community cohesion, sentimental value) that are important. However, the procedure does not capture these. So we must note:

  - The procedure returns a reject, but if we want to consider non-consequentialist values (e.g., "this program is important to the community even if it's not cost-effective"), then a human must override the procedure. Since the amount is only $30k, the program officer could make that call, but the procedure advises against funding based on outcomes.

  **What the Procedure Cannot Do:**
  - It cannot resolve value conflicts (e.g., should we fund a beloved program with weak outcomes because it brings joy?).
  - It cannot eliminate the uncertainty in UTC. At best, it tells us how strong the evidence is for the chain, but the long-term effects remain clueless.
  - It cannot account for moral considerations that are not outcome-based (e.g., deontological constraints, fairness, rights).
  - It cannot compare across domains (e.g., is a meal more valuable than an hour of tutoring?) without a common metric (like dollars, which is often inadequate).

  In the end, the procedure provides a structured way to assess what we can know and what we cannot, and forces us to be explicit about when we are making a leap of faith or a value-based choice.
answer: |-
  Below is a decision procedure designed to address consequentialist cluelessness while remaining practical for your foundation. It prioritizes traceable local effects (TLE) over untraceable causal chains (UTC), forces explicit acknowledgment of uncertainty, and flags when decisions must revert to human judgment. The procedure is structured as a linear checklist with clear gates, runnable in a day using basic tools like spreadsheets. It assumes you have the proposal, budget, and any applicant-provided data.

  ---

  ### **Consequentialist-Aware Funding Decision Procedure**  
  **Goal:** Separate knowable impacts (TLE) from speculative chains (UTC), quantify uncertainty, and force value-based decisions into the open.  
  **Time:** <1 day/proposal.  
  **User:** Foundation staff (no advanced stats required).  
  **Outputs:** Approve, Reject, Escalate to Board, or "Human Judgment Required" (with reason).  

  #### **Step 0: Pre-Screening (Reject If Failed)**  
  _Questions:_  
  1. Does the proposal align with our foundation’s mission?  
  2. Is the budget realistic and within $20k–$250k?  
  3. Are there legal/ethical red flags (e.g., fraud risk, conflicts of interest)?  
  _Sufficient Answer:_ Yes/No. Requires no external research.  
  _Decision:_ **Reject** if any "no." Proceed if all "yes."  

  #### **Step 1: Traceable Local Effects (TLE) Assessment**  
  _Focus: Direct, observable outcomes within 1–3 years. Quantify evidence and cost-effectiveness._  
  _Questions:_  
  1. **What is the primary direct outcome?** (e.g., "500 teens fed," "20 jobs placed.")  
     - _Sufficient:_ Specific, countable metric tied to activities.  
     - _Insufficient:_ Vague terms like "empowerment" or "awareness."  
  2. **How will outcomes be measured?**  
     - _Sufficient:_ Method named (e.g., attendance logs, pre/post surveys). Applicant must collect data.  
     - _Insufficient:_ No plan or reliance on anecdotes.  
  3. **What is the cost per outcome?** (Total grant / primary outcome)  
     - _Sufficient:_ Calculable from proposal. Compare to benchmarks (e.g., local meal cost ≈ $5).  
     - _Insufficient:_ Unclear math or no comparison.  
  4. **What is the evidence this works?**  
     - _Sufficient:_ Applicant data from similar work, or independent study.  
     - _Insufficient:_ Only testimonials or theory.  
  5. **What local negatives are acknowledged?** (e.g., volunteer drain, displacement)  
     - _Sufficient:_ Applicant identifies risks; offers mitigation.  
     - _Insufficient:_ Denial of downsides.  

  _TLE Scoring (1–5 Scale):_  
  - **Clarity:** How well-defined is the outcome? (1 = vague, 5 = crystal clear).  
  - **Evidence:** Strength of proof (1 = none, 5 = robust data).  
  - **Cost-Effectiveness:** Relative to local benchmarks (1 = very high cost, 5 = very low).  
  - **Negatives:** Severity of local downsides (1 = severe/unmitigated, 5 = none).  
  - **Threshold:** Average score ≥3.0 to proceed. **Reject** if <3.0.  

  #### **Step 2: Untraceable Causal Chains (UTC) Assessment**  
  _Focus: Long-term/indirect claims (e.g., "reduced incarceration in 20 years"). Treat as speculative; demand transparency._  
  _Questions:_  
  1. **Does the proposal claim UTC effects?** If no, skip to Step 3.  
  2. **Map the causal chain.** (e.g., "training → jobs → less crime").  
     - _Sufficient:_ Each link described.  
     - _Insufficient:_ Links missing or conflated.  
  3. **What evidence supports each link beyond the first?**  
     - _Sufficient:_ Research (e.g., study linking jobs to crime reduction).  
     - _Insufficient:_ Only logic/analogy.  
  4. **What systemic negatives could occur?** (e.g., unintended harm, opportunity costs).  
     - _Sufficient:_ Applicant or staff identifies risks.  

  _UTC Uncertainty Rating:_  
  - **Low:** All links supported by evidence; no major gaps.  
  - **Medium:** Some evidence, but key gaps or weak data.  
  - **High:** No evidence beyond first link; chain >3 steps.  
  _Decision:_ Never reject solely on UTC. Use to adjust risk.  

  #### **Step 3: Integration & Uncertainty**  
  _Focus: Combine TLE and UTC; assess overall risk._  
  _Questions:_  
  1. **What is the expected net benefit?**  
     - _Formula:_ (TLE Score) × (1 – UTC Uncertainty Factor).  
       - UTC Factor: Low = 0.1, Medium = 0.3, High = 0.6.  
     - _Example:_ TLE Score 4.0 × (1–0.6) = 1.6 if High UTC uncertainty.  
  2. **What could go wrong?** List worst-case scenarios (e.g., funds wasted, harm amplified).  
  3. **Is the UTC claim central to the proposal?** (e.g., >50% of justification).  

  _Thresholds:_  
  - **Net Benefit ≥3.0:** Proceed to Step 4.  
  - **Net Benefit 2.0–2.9:** Human Judgment Gate (see below).  
  - **Net Benefit <2.0:** **Reject.**  

  #### **Step 4: Decision Gates**  
  1. **Escalate to Board If:**  
     - Grant >$100k OR Human Judgment Gate triggered OR UTC-central with High uncertainty.  
  2. **Human Judgment Gate (Critical):**  
     - Triggered when:  
       - TLE is weak (score 2.0–2.9) but UTC is compelling.  
       - Negatives are severe but values justify risk (e.g., equity, community trust).  
       - Net Benefit 2.0–2.9.  
     - _Action:_ **Do not calculate further.** Write: "Decision rests on values: [e.g., Do we prioritize community sentiment over efficiency?]. Staff/Board must choose."  
  3. **Approve/Reject:**  
     - **Approve** if grant ≤$100k, Net Benefit ≥3.0, and no escalation.  
     - **Reject** if Net Benefit <2.0 or TLE score <3.0.  

  #### **Step 5: Document**  
  - Record scores, UTC rating, and rationale.  
  - Explicitly state: "Unknowable effects: [e.g., long-term displacement]."  
  - For Human Judgment calls: "Value decision: [e.g., Fund despite mediocrity to preserve trust]."  

  ---

  ### **Application to Hypothetical Cases**  
  **Key:**  
  - TLE Score (1–5 avg): Clarity, Evidence, Cost-Effectiveness, Negatives.  
  - UTC Uncertainty: Low/Medium/High.  
  - Net Benefit: TLE Score × (1 – UTC Factor).  

  ---

  #### **Case 1: $80k Food Bank Expansion (Weekend Meal Backpacks)**  
  - **TLE Assessment:**  
    - Primary outcome: Meals delivered to X children in 2 districts (traceable).  
    - Measurement: Meal counts + school attendance records (clear).  
    - Cost/outcome: $4/meal (benchmark: $5/meal locally → good).  
    - Evidence: Food bank’s past data shows 95% meal utilization (strong).  
    - Negatives: Pulls volunteers from neighboring program (acknowledged). Mitigation: Staggered schedules. Score: Moderate severity.  
    - TLE Scores: Clarity=5, Evidence=4, Cost-Effectiveness=5, Negatives=3 → **Avg 4.25**.  
  - **UTC Assessment:** No long-term claims → skip.  
  - **Integration:** Net Benefit = 4.25 (no UTC factor) → **≥3.0**.  
  - **Decision Gate:** $80k < $100k; no Human Judgment trigger.  
  - **Output: Approve.** TLE strong despite local negative; mitigation plausible.  

  ---

  #### **Case 2: $150k Workforce Training Pilot (Jobs → Reduced Incarceration)**  
  - **TLE Assessment:**  
    - Primary outcome: Y people trained; Z job placements in 1 year (traceable).  
    - Measurement: Training certs + employer records (clear).  
    - Cost/outcome: $15k/trainee (benchmark: $10k locally → high cost).  
    - Evidence: Pilot data shows 70% job placement (moderate).  
    - Negatives: None acknowledged (staff adds: may drain resources from other programs). Score: High severity.  
    - TLE Scores: Clarity=5, Evidence=3, Cost-Effectiveness=2, Negatives=2 → **Avg 3.0**.  
  - **UTC Assessment:**  
    - Claim: Training → jobs → reduced incarceration (2-step chain).  
    - Evidence: Link 1 (training→jobs) = TLE. Link 2 (jobs→incarceration): One study cited, but not local.  
    - Systemic negatives: None discussed.  
    - UTC Uncertainty: **High** (weak evidence for Link 2; chain >3 years).  
  - **Integration:**  
    - Net Benefit = TLE 3.0 × (1 – 0.6) = **1.2** (High UTC factor).  
  - **Decision Gate:**  
    - Net Benefit 1.2 < 2.0 → **Reject by procedure.**  
    - But: $150k > $100k → **Escalate to Board** regardless.  
  - **Human Judgment Flag:**  
    - "UTC is central but High uncertainty. Board must decide if societal potential justifies $150k risk despite poor cost-effectiveness and no negative mitigation."  
  - **Output: Escalate to Board with "Reject" recommendation.** Procedure dislikes this due to weak TLE and clueless UTC.  

  ---

  #### **Case 3: $30k Mediocre Tutoring Program (Save from Closure)**  
  - **TLE Assessment:**  
    - Primary outcome: Tutoring for 15 students; grade improvements (traceable).  
    - Measurement: Grade reports (clear but weak: only 30% show progress).  
    - Cost/outcome: $2,000/student (benchmark: $1,000 locally → very high).  
    - Evidence: Applicant data shows minimal academic gain (weak).  
    - Negatives: If defunded, space becomes study hall (serving 50+ students). High opportunity cost.  
    - TLE Scores: Clarity=5, Evidence=2, Cost-Effectiveness=1, Negatives=1 → **Avg 2.25**.  
  - **UTC Assessment:** None claimed → skip.  
  - **Integration:** Net Benefit = 2.25 (no UTC) → **<3.0 and <2.0?**  
  - **Decision Gate:**  
    - TLE score 2.25 < 3.0 → **Reject by procedure.**  
    - But: Human Judgment Gate triggered (Net Benefit 2.25 is 2.0–2.9).  
  - **Human Judgment Flag:**  
    - "TLE weak and costly, but community values program. Decision rests on: Should we fund sentimental value despite $30k opportunity cost? Staff must own this choice."  
  - **Output: Human Judgment Required.** The procedure rejects it, but staff could override based on non-consequentialist values (e.g., "This program symbolizes our commitment to the neighborhood").  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve cluelessness:** When UTC dominates (e.g., Case 2), it flags uncertainty but can't pretend guesses are data. Output is a judgment call, not a calculation.  
  2. **Assign value to the intangible:** Sentiment, equity, or trust (Case 3) require human discretion. The procedure forces you to state these aloud.  
  3. **Predict second-order effects:** Displacement, volunteer drain, or long-term opportunity costs are noted as risks but remain unquantifiable.  
  4. **Compare apples to oranges:** Weighing a meal against a tutoring hour requires board/staff values, not math.  

  ### **Why This Works for Your Context**  
  - **Speed:** Uses applicant-provided data; no new research. Scores are quick estimates.  
  - **Honesty:** Separates TLE (actionable) from UTC (speculative). Human Judgment Gate stops false confidence.  
  - **Board Support:** Escalates high-risk/$ decisions; documents cluelessness explicitly.  
  - **Adaptable:** Adjust benchmarks (e.g., cost/meal) in a spreadsheet.  

  This procedure doesn’t eliminate cluelessness—it quarantines it. When the chain of causality vanishes into noise, it hands the wheel back to humans and demands they articulate their values. As the philosopher in you knows, that’s the only honest response.
