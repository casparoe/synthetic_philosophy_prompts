prompt: |-
  Okay so I've been following some local politics and I noticed something weird about how we do public debate. When someone on the city council argues against a zoning change by saying "this is what my faith teaches about stewardship of the land," everyone gets uncomfortable and basically tells them they need a secular reason. But when someone else argues for the same zoning change by saying "this maximizes aggregate welfare in the long run according to utilitarian principles," nobody blinks. Both are comprehensive moral views. Both are controversial — plenty of reasonable people reject utilitarianism. But only the religious one gets flagged as out of bounds.

  This seems to be a pretty general feature of liberal democratic practice, not just my city council. Courts, legislatures, regulatory agencies — there's this norm that coercive laws need to be justified with reasons that are "public" or "accessible," and religious reasons fail that test. But secular comprehensive doctrines (utilitarianism, Kantianism, libertarianism, etc.) sail right through, even though they're no more accessible to citizens who don't already accept their starting points. A Rawlsian Catholic who accepts public reason is supposed to translate her religious convictions into terms others could endorse; a Rawlsian utilitarian doesn't have to translate anything. That's the asymmetry I'm poking at.

  So here's what I want you to do. Reconstruct the theory of political legitimacy that this asymmetric practice presupposes. In particular: (1) What is the principle that's supposed to rule out religious reasons but not secular comprehensive ones? (2) Is that distinction actually defensible, or does the practice rest on a mistake about what makes a reason "public"? (3) What would the practice have to look like if we took the asymmetry seriously and applied it consistently — would secular comprehensive doctrines also need translation into something thinner, and what would that thinner thing even be?

  Then, after your main answer, give me a structured summary as a JSON object with the following fields:

  - "practice_description": a one-sentence description of the practice
  - "presupposed_principle": the principle of legitimacy the practice seems to presuppose (one sentence)
  - "asymmetry_rationale": the best rationale you can reconstruct for why the practice treats religious and secular comprehensive doctrines differently (one sentence)
  - "is_defensible": a boolean, true if you think the asymmetry is ultimately defensible, false if not
  - "consistent_version": what the practice would look like if the underlying principle were applied consistently (one sentence)
  - "rival_theories": an array of named alternative theories of political legitimacy that would license a different practice, each with a one-sentence gloss on what they'd change

  Thanks — and don't pull punches on whether the asymmetry holds up. I'm not religious myself, I just think the double standard is philosophically interesting.
reasoning: |-
  Okay, this user is hitting on a deep tension in liberal political theory—the famous "asymmetry problem" between religious and secular comprehensive doctrines. They're clearly well-read (Rawls references, recognizes utilitarianism as comprehensive) but frustrated by what they see as hypocrisy in practice. 

  First, let's unpack their core observation: why does "my faith says X" get vetoed while "utilitarianism demands Y" get a free pass? The Rawlsian framework they're referencing does seem lopsided here. I need to reconstruct the implicit principle behind this practice. 

  Hmm... the standard defense is about "accessibility" - but as the user rightly points out, Kantian metaphysics or utility calculations aren't any more accessible to the average citizen than theological arguments. Maybe the real distinction isn't accessibility but perceived neutrality? But that's circular. 

  The user's third question is the most interesting—if we were consistent, we'd have to demand translation from ALL comprehensive doctrines. But then what's left? Rawls' "freestanding" political conception is notoriously thin. Would we end up with nothing but proceduralism or pragmatism? 

  For the JSON summary, I'll need to crystallize: 
  - Practice: Selective exclusion of religious reasons from public justification 
  - Principle: "Public reasons must be non-sectarian and based on shared secular reasoning" 
  - Asymmetry rationale: Historical baggage of religious wars makes religion uniquely divisive 
  - Defensibility: False—it's an arbitrary distinction masking majoritarian bias 
  - Consistent version: Require translation of ALL comprehensive doctrines into overlapping consensus 
  - Rival theories: Include perfectionism (allow all moral reasons) and strict secularism (ban all non-empirical reasons) 

  The user's non-religious stance frees me to be blunt: this asymmetry is philosophically indefensible, even if pragmatically entrenched. The real issue isn't logic but power—secular worldviews get privileged as "neutral" because they're dominant. 

  For rival theories, I should mention Quong's aggressive secularism (which would ban utilitarianism too) and Wolterstorff's religious inclusion model. The key is showing this isn't just a Rawls debate. 

  Final thought: The user's hypothetical about the Rawlsian Catholic vs Rawlsian utilitarian perfectly exposes the contradiction. If public reason is about mutual justification, why is one translation burden heavier than the other? There's no good answer—which is why the practice survives on historical inertia rather than principle.
answer: |-
  Here's a reconstruction of the legitimacy theory presupposed by this asymmetric practice, followed by a critical analysis and the requested JSON summary.

  ### (1) The Presupposed Principle of Legitimacy
  The practice presupposes a **modified Rawlsian public reason liberalism** with a **sectarian carve-out**: Coercive laws must be justified by reasons drawn from a "public" pool of ideas that are *secularly accessible* and *non-controversially shared* – but this requirement applies only to *religiously grounded* comprehensive doctrines, not to *secular* ones. The implicit principle:  
  > "Religious reasons are inherently non-public because they derive from faith-based authorities inaccessible to non-adherents, whereas secular moral theories (even if equally comprehensive) are deemed 'accessible through reason alone' and thus qualify as public justification."

  ### (2) Defensibility of the Distinction
  **The distinction is indefensible** as a coherent philosophical principle. Key flaws:  
  - **False Accessibility**: Utilitarian calculations (e.g., interpersonal utility comparisons, discount rates for future welfare) or Kantian autonomy frameworks are no more empirically verifiable or universally accessible than theological claims. Both require adherence to foundational axioms.  
  - **Cultural Contingency**: The asymmetry reflects Western post-Enlightenment bias that equates "rational" with "secular." Secular doctrines are privileged not by inherent rationality but by historical dominance in liberal institutions.  
  - **Epistemic Inequality**: Demanding religious citizens "translate" their convictions while exempting secular citizens grants disproportionate authority to dominant secular frameworks (e.g., welfare economics), violating neutrality.  
  - **Rawls' Ambiguity**: Rawls himself excluded *all* comprehensive doctrines from public reason, only permitting freestanding political values. The practice selectively enforces this against religion while ignoring secular equivalents.  

  ### (3) A Consistent Application of the Principle
  If applied consistently:  
  - **All comprehensive doctrines** (religious *and* secular) would require "translation" into **non-comprehensive political values** (e.g., liberty, fairness, stability, basic welfare) justifiable through an **overlapping consensus**.  
  - **The "thinner" justifications** would resemble:  
    - Core constitutional principles (equal protection, due process)  
    - Widely accepted empirical claims (e.g., "This policy reduces childhood malnutrition")  
    - Pragmatic institutional interests (e.g., "This maintains grid reliability")  
    - Neutral procedural fairness ("All affected parties were consulted")  
  - **Radical Consequences**: Utilitarians couldn't invoke "aggregate welfare" without showing how it serves basic liberties; libertarians couldn't premise arguments on self-ownership alone. Justifications would become more minimalist and pluralism-focused.

  ---

  ### Structured Summary (JSON)

  ```json
  {
    "practice_description": "Selective exclusion of religious reasons (but not secular comprehensive doctrines) from public justification of coercive laws.",
    "presupposed_principle": "Religious reasons are uniquely non-public due to their faith-based inaccessibility, while secular moral frameworks are accessible through universal reason.",
    "asymmetry_rationale": "Secular doctrines are perceived as universally accessible through rational deliberation, whereas religious reasons rely on non-rational faith commitments.",
    "is_defensible": false,
    "consistent_version": "All comprehensive doctrines (religious and secular) must be translated into freestanding political values (e.g., liberty, fairness, stability) justifiable via overlapping consensus.",
    "rival_theories": [
      {
        "name": "Perfectionism",
        "gloss": "Allows any moral reason (religious or secular) if it promotes human flourishing, rejecting neutrality constraints."
      },
      {
        "name": "Strict Secularism",
        "gloss": "Bans all non-empirical justifications (including secular moral philosophy) from public discourse."
      },
      {
        "name": "Discourse Ethics",
        "gloss": "Requires only that reasons be discursively redeemable in actual dialogue, regardless of source."
      },
      {
        "name": "Religious Inclusive Pluralism",
        "gloss": "Permits religious reasons in public debate provided they supplement (not replace) secular justifications."
      }
    ]
  }
  ```

  ### Key Philosophical Takeaway
  The asymmetry persists due to **historical path-dependence** (post-Reformation secularization) and **institutional convenience** (privileging dominant academic/legal paradigms), not philosophical coherence. A rigorously consistent liberalism would either:  
  1. **Radically thin** public reason (excluding *all* comprehensive doctrines), risking justificatory emptiness, or  
  2. **Embrace pluralism** by allowing all sincerely held moral reasons (religious/secular) while requiring mutual engagement – a position closer to Habermas or Audi than Rawls.  

  The current practice reflects an unsustainable double standard that implicitly establishes secularism as a state-sponsored comprehensive doctrine.
