prompt: |-
  I'm putting together a study guide for a seminar on the evolution of cooperation, and I keep getting confused by the units of selection debate — the whole gene vs. individual vs. group thing. I've been reading a lot of pop-science summaries of it and they all seem to conflate a few distinct technical questions, so I want to make a decision tree that takes a student from "I accept that natural selection shapes cooperation and altruism" all the way to a named position, so they can figure out where they actually stand without just memorizing labels.

  The tree should branch on the real technical distinctions, not just the surface-level "genes vs. groups" thing. In particular, I want it to seperate out: (1) the "units" vs. "levels" question (i.e., whether the gene or the group is the *unit* of selection — the thing that is selected — as opposed to just a *level* at which selection acts, one of several alongside the individual), (2) whether inclusive fitness and multi-level selection are taken to be equivalent (giving the same predictions in all cases) or genuinely in conflict (able to give different predictions), and (3) whether the "selfish gene" is a metaphor or a literal claim about genes being selfish replicators. Each branch node should be phrased as a question a student could answer without already knowing which camp it leads to — no "do you think genes are the units of selection?" questions, because that just asks for the label.

  Use concrete cases to force the splits where possible: sterile worker ants (altruism in non-reproductive kin), vampire bats sharing blood meals (reciprocal altruism among non-kin), myxobacteria forming fruiting bodies (cooperation in microorganisms), and the "greenbebe" effect (where an altruism allele recognizes and helps carriers of the same allele, even if they're not kin). Each leaf should carry the name of the position (or "unnamed" if nobody really defends it) and one sentence on its most awkward commitment. Flag any pair of leaves the tree can't really separate, and note any unoccupied combinations of answers and why nobody's there (incoherent, unattractive, or just unexplored). I'm aiming for maybe 8–12 leaves total. Think very carefully before answering, and respond in the style of someone who has actually worked through the primary literature on this (Hamilton, Dawkins, Wilson & Sober, Trivers) rather than a pop-science summary.
reasoning: |-
  Okay, the user is creating a study guide on the evolution of cooperation and is confused by the units of selection debate. They want a decision tree that helps students navigate the key distinctions without memorizing labels. The tree should branch on technical questions, not surface-level terms, and use concrete examples like sterile ants, vampire bats, myxobacteria, and the greenbeard effect.

  First, I need to identify the core distinctions they mentioned: units vs. levels of selection, equivalence of inclusive fitness and multi-level selection, and whether the selfish gene is literal or metaphorical. Each branch point should be a question students can answer without prior knowledge. 

  The user emphasized avoiding questions like "are genes the unit?" because that's circular. So, the questions must be framed around observable behaviors or theoretical commitments. For example, using sterile worker ants to ask about the necessity of relatedness for altruism.

  Looking at the examples: sterile ants involve kin selection, vampire bats use reciprocity, myxobacteria show microbial cooperation with potential cheats, and greenbeard illustrates genetic recognition without kinship. These can anchor the branches. 

  The levels vs. units debate: some see groups as a level where selection acts, but the unit is still the gene or individual. Others argue groups can be units if they meet certain criteria. This needs a clear split, perhaps using the myxobacteria case where cheating can undermine group stability.

  Inclusive fitness vs. MLS: Hamilton's math versus group selection models. Are they mathematically equivalent? The answer splits positions. The greenbeard effect might help here, as it's gene-centered but doesn't rely on relatedness.

  The selfish gene metaphor: Dawkins' view as literal versus metaphorical affects whether genes are the primary replicators. This could be the last branch, using the greenbeard example to test if altruism is explained solely by gene propagation.

  Now, mapping out possible branches. Start with altruism in sterile workers: if a student thinks relatedness is essential, that leads to kin selection. If not, it could be reciprocal altruism or group selection. 

  Next, for vampire bats, if reciprocity explains non-kin cooperation, that's Trivers. If not, maybe group selection. But if they think groups can be units, that's Sober/Wilson. 

  Then, equivalence of theories: if inclusive fitness and MLS always align, that's the "equivalence camp." If not, it's MLS I or II. 

  Finally, the selfish gene: literal means gene's-eye view, metaphorical might allow for other units. 

  Unoccupied positions: for example, if someone thinks groups are units but selfish gene is literal—that might be inconsistent. Or if they deny equivalence but see selfish gene as metaphorical, could be Gould's pluralism. 

  Need to ensure each leaf has a named position and an awkward commitment. For instance, strict gene selection struggles with non-additive interactions, while group selection faces the collapse problem. 

  Also, flagging pairs that the tree can't separate, like perhaps some nuances between MLS I and II. And note why some combinations are unexplored, like denying gene replication while holding selfish gene literal—incoherent. 

  The user might want to highlight the practical implications for each position, helping students see real-world applications. They probably want clarity on controversies without oversimplifying. Ensuring the tree exposes where scholars disagree, like on the equivalence question, is key. 

  Final structure: three main branch points with sub-questions based on examples. Each leaf labeled with position and a drawback. Total around 10 leaves. Check for logical coherence and coverage of all combinations.
answer: |-
  Here's a decision tree structured around technical distinctions and concrete cases, designed to navigate the primary literature's nuances. It branches on three core philosophical/empirical fault lines, avoids label-begging questions, and results in 9 distinct leaves (including one "unnamed" and one "incoherent" cluster). Positions are named based on prominent defenders.

  **Start:** You accept natural selection explains cooperation/altruism.

  ---

  ### Branch Point 1: Explaining Sterile Workers (e.g., Ants)
  *   **Question:** Does explaining the evolution of sterile worker altruism *require* invoking genetic relatedness between actor and recipient?
      *   **Yes (Requires Relatedness)** → Go to Branch Point 1A
      *   **No (Does Not Require Relatedness)** → Go to Branch Point 1B

  #### Branch Point 1A: Role of Relatedness (Kin Selection Core)
  *   **Question:** Is Hamilton's Rule (rb > c) *sufficient and necessary* as a general evolutionary explanation for altruism, even in complex scenarios like multi-queen colonies or greenbeards?
      *   **Yes (Hamilton's Rule is Fundamental)** → Go to Branch Point 3 (Selfish Gene Status)
      *   **No (Hamilton's Rule is Limited/Incomplete)** → **Leaf: "Gouldian Pluralism / Trait Group Selection"**
          *   *Awkward Commitment:* Must argue that kin selection models sometimes fail or are insufficiently explanatory, requiring higher-level selection processes even for kin altruism (e.g., differential colony extinction), while still accepting relatedness is usually crucial. (Gould, early D.S. Wilson).
          *   *Note:* This position often overlaps with rejecting equivalence (Branch Point 2).

  #### Branch Point 1B: Beyond Relatedness (Non-Kin Altruism Possible)
  *   **Question:** Can non-kin cooperation (e.g., Vampire Bat blood sharing) *only* evolve via direct reciprocity (Trivers) within stable groups, or can group-level selection *directly* favor altruism towards non-kin?
      *   **Only Via Reciprocity (Stable Pairwise Interactions)** → **Leaf: "Triversian Reciprocal Altruism"**
          *   *Awkward Commitment:* Struggles to explain cooperation in large groups or microbes where repeated pairwise encounters and cheater detection are implausible (e.g., initial stages of myxobacteria fruiting). (Trivers).
      *   **Group Selection Can Favor Non-Kin Altruism** → Go to Branch Point 2 (Equivalence Question)

  ---

  ### Branch Point 2: Equivalence of Frameworks (Hamilton vs. MLS)
  *   **Question:** Are formal models of Inclusive Fitness (Kin Selection) and Multi-Level Selection (MLS) *always mathematically intertranslatable*, giving identical predictions for all cases (e.g., myxobacteria fruiting bodies, greenbeards, sterile workers), differing only in accounting perspective?
      *   **Yes (Always Equivalent)** → **Leaf: "Formal Equivalence Camp"**
          *   *Awkward Commitment:* Must argue that the intense historical debate (Hamilton vs. Wynne-Edwards, Dawkins vs. Group Selectionists) was largely a misunderstanding of mathematics, diminishing the perceived significance of the "unit" question. (Grafen, most modern theoreticians).
      *   **No (Can Give Different Predictions/Explanations)** → Go to Branch Point 2B

  #### Branch Point 2B: Nature of MLS Conflict
  *   **Question:** When MLS and IF differ, is it because MLS theory recognizes *groups themselves* as potential Darwinian individuals (units of selection) with heritable variation in fitness *in a way that cannot be fully reduced* to individual/gene fitnesses?
      *   **Yes (Groups as Genuine Units)** → **Leaf: "Sober-Wilson MLS-II (Group as Unit)"**
          *   *Awkward Commitment:* Must provide rigorous criteria for when a group qualifies as a unit/individual (e.g., myxobacteria fruiting body vs. a temporary herd) and defend against the charge of "averaging fallacy" (collapsing individual fitness into group means). (Sober & Wilson, Okasha).
      *   **No (MLS-I - Groups as Context)** → **Leaf: "Maynard Smith MLS-I (Group as Selective Context)"**
          *   *Awkward Commitment:* Concedes that group selection is "real" but views groups merely as environments affecting individual fitnesses; struggles to conceptually distinguish strong MLS-I from kin selection acting within groups. (Early D.S. Wilson, Maynard Smith context-dependent selection).
          *   *Note:* This position often sees the "unit" as the individual organism.

  ---

  ### Branch Point 3: The "Selfish Gene" Metaphor (Post-Branch 1A)
  *   **Question:** Is the "selfish gene" concept primarily a *heuristic metaphor* illustrating that altruism evolves when it benefits gene replication, or is it a *literal claim* that genes are the *only true replicators* and thus the *fundamental unit* upon which selection acts?
      *   **Metaphor (Useful Perspective)** → **Leaf: "Hamiltonian Inclusive Fitness"**
          *   *Awkward Commitment:* Must downplay Dawkins' stronger rhetoric; accepts that individual organisms or even groups can be vehicles/agents/interactors where selection manifests, while genes are the beneficiaries. (Hamilton, most modern behavioral ecologists).
      *   **Literal Claim (Genes as Fundamental Unit/Replicator)** → **Leaf: "Dawkinsian Gene Selectionism"**
          *   *Awkward Commitment:* Struggles conceptually with non-additive gene interactions (epistasis) where the "selfishness" of a gene depends entirely on genetic context, and with defining clear replicators for complex adaptations. (Dawkins, "Replicator" focused theorists).
      *   **Unnamed/Incoherent Cluster:** Denies genes are replicators *but* still insists Hamilton's Rule is fundamental and relatedness is essential. *Why Unoccupied?* Hamilton's Rule is built on population genetics models fundamentally tracking allele frequencies (genes). Rejecting genes as replicators while relying on this math is inconsistent. *Awkwardness:* Conceptual confusion. (A rare student position).

  ---

  ### Summary of Leaves & Key Distinctions

  1.  **Triversian Reciprocal Altruism:** (1B: Only Reciprocity) *Awkward:* Scaling to large groups/microbes.
  2.  **Gouldian Pluralism / Trait Group Selection:** (1A: No, Hamilton's Rule Limited) *Awkward:* Defining when kin selection "isn't enough".
  3.  **Formal Equivalence Camp:** (2: Yes, Always Equivalent) *Awkward:* Rendering the historical debate seemingly semantic.
  4.  **Maynard Smith MLS-I (Group as Context):** (2B: No, Groups not Units) *Awkward:* Distinguishing from sophisticated kin selection.
  5.  **Sober-Wilson MLS-II (Group as Unit):** (2B: Yes, Groups as Units) *Awkward:* Defining group "individuality" rigorously.
  6.  **Hamiltonian Inclusive Fitness:** (3: Metaphor) *Awkward:* Reconciling vehicle language with gene-centric math.
  7.  **Dawkinsian Gene Selectionism:** (3: Literal) *Awkward:* Epistasis and complex adaptations.
  8.  **Unnamed/Incoherent Cluster:** (Deny gene replication + Hamilton fundamental). *Why:* Logically inconsistent.

  ### Pairs Hard to Separate & Unoccupied Corners

  *   **Hard to Separate:** "Gouldian Pluralism" (Leaf 2) and "Sober-Wilson MLS-II" (Leaf 5) often converge in practice, especially regarding group selection's importance. The tree splits them based on their view of kin selection's *necessity* (Branch 1A), but both reject pure gene/individual views and equivalence.
  *   **Unoccupied Corner:** **"Requires Relatedness" (1A) + "Groups as Units" (2B:Yes) + "Selfish Gene Metaphor" (3:Metaphor).** *Why Unoccupied?* Logically strained. Accepting groups as units fundamentally challenges the gene-centric view implicit in "relatedness is essential". Defenders of group units (Sober/Wilson) typically argue relatedness *isn't* essential (leading to Branch 1B). This corner tries to have it both ways. *Awkwardness:* Severe tension between group-unit ontology and gene-centric kin explanation.
  *   **Unoccupied Corner:** **"Does Not Require Relatedness" (1B) + "Only Reciprocity" + "Groups as Units" (2B:Yes).** *Why Unoccupied?* Unattractive & Redundant. If you believe groups are genuine units *and* relatedness isn't needed, you don't need to restrict non-kin altruism *only* to reciprocity; group selection can explain broader cooperation. This position offers no advantage over MLS-II (Leaf 5) while being more restrictive.

  This tree forces students to confront *why* they answer the way they do on concrete cases and fundamental theoretical commitments, moving beyond slogans. The "awkward commitments" highlight the trade-offs inherent in each position, reflecting the ongoing debate in the primary literature.
