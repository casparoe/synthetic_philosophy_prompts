  I'm building a problem set on the internal structure of Kant's universalizability tests, and I want a case constructed to exact specifications rather than one of the standard examples. Please give me a maxim that passes the contradiction-in-the-conception test but fails the contradiction-in-the-will test — so that it grounds an imperfect duty rather than a perfect one — in a domain other than the two textbook cases (failing to help others in distress, and failing to cultivate one's talents).

  Constraints on the case: it must be a realistic everyday situation (no trolley, no science-fiction), the maxim must be one that an ordinary, non-idealized person could genuinely adopt, and the will-test failure must rest on an end that a rational agent necessarily has, not on a contingent preference the agent happens to hold. The point of the exercise is to show that the will test is doing independent work rather than merely restating the conception test, so a case that simply stipulates the verdict, or that quietly makes the maxim fail the conception test, does not count.

  After the scenario, run the check in order: state the maxim; universalize it and run the conception test; then run the will test and name the specific necessary end that is contradicted. Then isolate the variable — tell me which single feature of the case is doing the work, and show that once that feature is removed the same maxim passes both tests. Close by saying how a Kantian who reads the will test as just the formula of humanity in disguise would try to reclassify the result.
