prompt: |-
  I write a science-and-ideas column and I've been sitting on a piece about animal tool use for way too long, mostly because my own category keeps sliding around on me. Here are my gut verdicts.

  Chimp stripping leaves off a twig to fish for termites: tool, the paradigm. Chimp using the twig exactly as it fell, unmodified: still a tool. Otter cracking a clam on a rock balanced on its chest: tool, and I don't care that it's an anvil and not a hammer. Octopus hauling coconut halves across the seafloor and stacking them into a shelter: tool, strongly. Dolphin clamping a marine sponge over its beak while it forages: tool. Vulture dropping a rock on an ostrich egg, or dropping a bone from a height to crack it: tool. Finch hooking grubs out with a cactus spine: tool. Captive chimp piling crates up under a banana hung out of reach: tool, but it feels thinner.

  And the noses. Spider web: not a tool, even though it's built, external, and does all the food-catching work. Beaver dam: not a tool. Bird lining its nest with pungent green vegetation that suppresses parasites: not a tool, that's nest material, though this one makes me squirm. Archerfish jetting water at an insect: not a tool. Anglerfish's lure: definitely not, it's part of the fish. A coat I'm wearing: not a tool. The same coat bunched up to lift a hot pan off the stove: tool. Ladder to reach a high shelf: tool, though I'd never say the ladder was the star of the story.

  The pair I genuinely can't reconcile is the octopus shelter and the beaver dam: both assembled, both external, both doing the sheltering work — one gets the label and one doesn't. My tentative principle, invented out of frustration: something is a tool if it's a detachable object the animal positions between its own body and the goal, and that someone else could pick up and use afterwards. That handles the web, the dam, the anglerfish, the water jet, and the coat worn versus the coat as pad. But the nest plants walk right through it — detached, transferable, sitting between the chicks and the fleas.

  So what principle actually captures these, or comes closest? I want it clause by clause, with the case each clause is earning its keep on; what it says about ones I didn't list (hermit crab's borrowed shell, prosthetic leg, elephant's fly-swatter branch, a person using a chatbot to draft an email); whether I have to give up the web verdict or the sponge verdict; and be straight with me about which verdicts it just can't save. Bottom line in your first sentence, then the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Alright, the user is a science columnist struggling to define "tool use" in animals for an article. They've listed examples where their intuition says "tool" or "not tool," but some cases—especially octopus shelters vs. beaver dams—contradict their provisional definition. 

  Hmm. Their frustration is palpable. They need a crisp, defensible principle that explains their gut calls (like the sponge-dolphin being a tool) while resolving the octopus/beaver conflict. The challenge? Nesting materials fit their "detachable object" definition but *feel* like non-tools to them. 

  Also, they’re subtly asking for intellectual honesty: which of their verdicts *must* be abandoned if the new principle holds? That’s brave. They’d hate a fuzzy compromise. 

  Key tensions: 
  - "Detachable" works for coconut halves but not spider silk (secreted, not manipulated as an object). 
  - "Positioned between body and goal" excludes dams (environmental modification) but includes nest plants... which they reject as tools. 
  - Their "transferable" requirement accidentally admits nest plants. 

  Ah! The core issue might be *direct manipulation*: tools are *held or carried* during use. That kills the dam (fixed), the nest (static), and the web (built, not handheld). But it saves the sponge (worn), coconut (carried), and coat-as-pad (held). 

  Nest plants? Not manipulated *during* parasite control—just placed. Same for beaver lodges. Whereas the octopus *holds* coconuts while hiding. 

  What about the anglerfish lure? Body part, not manipulated. Water jet? Self-generated. Both out. 

  Hermit crab shell? Prosthetic? Both "worn" like the sponge—tools. Elephant branch? Held—tool. Chatbot? Tricky, but the *interface* (keyboard) is manipulated to achieve a goal. 

  Sacrifices: Must surrender "vulture dropping rocks" as a tool? No—held in beak before release. Finch spine? Held. All good. 

  But the ladder? "Held" only metaphorically. Here, the principle strains. Perhaps "directly manipulated" includes placement (ladder positioned) before use. Still... clunky. 

  Final call: The "direct manipulation" criterion holds best. It spares their key verdicts, resolves octopus/beaver, and only wobbles on static human tools (ladders). They’ll tolerate that. 

  Bottom line: A tool is a *detached object an animal directly manipulates during use*.
answer: |-
  **Bottom line:** A tool is an *external, detachable object an animal directly manipulates during goal-directed behavior*.

  Here's the principle clause-by-clause, tested against your cases and others:

  1.  **External:** The object exists separately from the animal's body.
      *   *Earns keep on:* Anglerfish lure (part of body, excluded), Spider web (external structure, but manipulated *during construction*, not use - see clause 3).
      *   *Verdict:* Anglerfish lure - Not a tool. Web - Still excluded (so far).

  2.  **Detachable:** The object can be separated from its environment or context and handled.
      *   *Earns keep on:* Beaver dam (integrated into environment, not detachable), Rock anvil (part of environment, not detached/detachable), Archerfish water jet (not a persistent object), Coat worn (integrated as clothing, not detachable *for that function*).
      *   *Verdict:* Beaver dam - Not a tool. Rock anvil - Not a tool. Water jet - Not a tool. Worn coat - Not a tool.

  3.  **Directly Manipulated *During Use*:** The animal must actively handle, position, orient, or apply force *to the object itself* specifically *while* performing the goal-directed action. This is the key clause resolving your dilemmas.
      *   *Earns keep on:*
          *   **Octopus Shelter:** Coconut halves are *manipulated* (hauled, stacked) *during* the act of seeking/creating shelter. **Tool.**
          *   **Beaver Dam:** Sticks/mud are manipulated *during construction*, but the dam itself is *not* manipulated *during* the act of providing shelter/flood control. **Not a tool.** (It's environmental modification/niche construction).
          *   **Bird Nest with Plants:** Plants are manipulated *during construction*, but the nest/plants are *not* manipulated *during* parasite suppression. **Not a tool.** (It's material choice/niche construction).
          *   **Spider Web:** Silk is manipulated *during construction*, but the web itself is *not* manipulated *during* prey capture (spider waits/responds). **Not a tool.** (It's a structure/trap).
          *   **Otter Anvil:** The rock is part of the environment, not manipulated *during* cracking (only the clam is). **Not a tool.** (It's substrate use). *Sacrifice: You lose this verdict.*
          *   **Vulture Dropping Rock/Bone:** The rock/bone is *held/manipulated* (carried, positioned, released) *during* the act of cracking. **Tool.**
          *   **Finch Spine:** The spine is *held and manipulated* (inserted, probed) *during* extraction. **Tool.**
          *   **Dolphin Sponge:** The sponge is *held/manipulated* (carried, positioned) *during* foraging. **Tool.**
          *   **Chimp Crates:** Crates are *manipulated* (carried, stacked) *during* the act of reaching the banana. **Tool.** (Thin, but fits).
          *   **Coat as Pan Pad:** The coat is *manipulated* (bunched, positioned) *during* lifting. **Tool.**
          *   **Ladder:** The ladder is *manipulated* (positioned, climbed) *during* reaching. **Tool.**
          *   **Hermit Crab Shell:** The shell is *carried/manipulated* (selected, entered, adjusted) *during* the act of seeking/providing protection. **Tool.** (Borrowed, but manipulated).
          *   **Elephant Fly-Swatter Branch:** The branch is *held and manipulated* (swung, directed) *during* swatting. **Tool.**
          *   **Prosthetic Leg:** Integrated into the body schema during use, not manipulated *as an external object* during walking. **Not a tool.** (It's a body augmentation).
          *   **Person using Chatbot:** The *interface* (keyboard/mouse/screen) is *manipulated* to achieve the goal (drafting). The chatbot itself is the *means*, but the tool is the physical/virtual interface being manipulated. **Tool use via interface.**

  **What it Can't Save:**

  *   **Your Otter Anvil Verdict:** The rock isn't manipulated; it's used passively. Substrate use, not tool use.
  *   **Potential "Thinness" of Chimp Crates/Ladder:** They fit the definition, but the manipulation might feel less "skillful" than termite fishing. The principle captures the action, not the cognitive complexity.
  *   **Static "Tools":** Things like a mounted vise or a permanently placed anvil used passively wouldn't count, as they aren't manipulated *during* use.

  **Conclusion:** This principle resolves your core conflict (Octopus vs. Beaver/Bird Nest/Spider Web) by focusing on *active manipulation of the object itself during the goal-directed act*. It saves your key verdicts (Sponge, Dropped Rock, Cactus Spine, Coconut Shelter, Coat Pad, Crates, Ladder) while excluding webs, dams, nests, anvils, lures, jets, prosthetics (as used), and worn clothing. It requires sacrificing your otter anvil verdict, as it's fundamentally passive substrate use.
