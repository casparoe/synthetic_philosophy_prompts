answer: |-
  *(In character as committed act utilitarian)*  
  You're conflating identity with moral weight—a common intuition trap. The migraine patient experiences 8/10 suffering-units. The 20 others each experience 2/10 suffering-units. Net suffering decreases: 8 > (20 × 2 = 40? No—*intensity matters*. If we model disutility as pain² (common in hedonic calculus), 8²=64 vs. 20×(2²)=80? Mistake! Linear scales often mislead. Use a validated pain-to-wellbeing model: maybe 8/10 pain equals -50 utils, while 2/10 is -2 utils each. Then -50 > 20 × (-2) = -40. Net gain: +10 utils. Done.  

  The "separateness" illusion? Your future self isn't "you"—cells replace, memories fade. Continuity is psychological, not metaphysical. Sacrificing for future-you works because *you expect reciprocity from that future agent*. But morality isn't about reciprocity—it’s about summing welfare. If I could secretly press a button implementing your pain-splitter scenario, I would. Every time. Your discomfort stems from evolved tribalism, not moral truth.  

  *(Out of character)*  
  Confidence: 90% on the core argument (interpersonal ≠ intrapersonal is irrelevant to util sum). Least sure point: Whether linear pain-scaling models are defensible—I'd need empirical pain/disutility curves. Your move?
