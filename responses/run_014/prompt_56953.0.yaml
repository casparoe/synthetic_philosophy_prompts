  ### Moral Testimony Quiz  
  Based on your reactions to concrete scenarios, this quiz plots you on two axes:  
  1. **Epistemic Axis**: Can moral testimony give you knowledge/understanding?  
  2. **Deontic Axis**: Is deferring to moral testimony ever right/admirable?  

  **Instructions**: For each scenario, pick the option closest to your view. No overthinking!  

  ---

  #### Scenarios  
  1. **Meat Dilemma**:  
     Alex’s partner, a trusted ethicist, explains that eating meat is morally wrong. Alex believes them but can’t explain why or defend the view.  
     - **A**: Alex now *knows* eating meat is wrong, even without understanding why.  
     - **B**: Alex doesn’t *know* it’s wrong, but deferring is the right thing to do.  
     - **C**: Alex gains no moral insight here; they should figure it out themselves.  

  2. **Close Friend’s Warning**:  
     Your closest friend insists your partner is disrespecting you, citing subtle patterns you missed. You trust your friend deeply.  
     - **A**: You can *know* your partner is disrespectful based on their testimony.  
     - **B**: You might not *know*, but you should trust your friend and act.  
     - **C**: You should investigate firsthand; deferring risks losing autonomy.  

  3. **Harsh Truth**:  
     Your moral advisor (whom you respect) urges you to tell a friend a painful truth. You feel intensely that hiding it is kinder.  
     - **A**: Defer to your advisor—they’re likely correct.  
     - **B**: The advisor *could* be right, but you should follow your gut.  
     - **C**: Neither testimony nor your feeling guarantees truth; reflect alone.  

  4. **Blind Obedience**:  
     Your religious leader declares an act sinful and demands you avoid it. You don’t believe it’s wrong but comply out of loyalty.  
     - **A**: Acting on testimony without belief is sometimes right (e.g., to show respect).  
     - **B**: Acting without belief is never right—you’re betraying your judgment.  
     - **C**: You *should* have believed the leader; acting without belief is hollow.  
     *→ Splits cells: A/B tests if deferring *without belief* is admissible (distinguishes Pragmatic Skeptic from Moral Testimonialist).*  

  5. **Emergency Protest**:  
     At a chaotic protest, a trusted ally yells, "Stop them from breaking windows—it’s wrong!" You have no time to reflect.  
     - **A**: You can *know* it’s wrong via testimony and should intervene.  
     - **B**: You can’t *know* in the moment, but you should defer and act.  
     - **C**: Never act on unvetted testimony—stay out of it.  

  6. **Jury Duty**:  
     A renowned ethicist testifies that a defendant’s action was immoral. You don’t grasp their reasoning but trust their expertise.  
     - **A**: You can *know* it was immoral based on testimony.  
     - **B**: You might not *know*, but you should defer in your role as juror.  
     - **C**: Reject the testimony—you must understand for yourself.  

  7. **Mentor’s Confession**:  
     Your mentor (a paragon of integrity) insists you confess a minor lie. You see no harm in keeping quiet.  
     - **A**: You can *know* confession is right via their testimony.  
     - **B**: You can’t *know*, but you should obey their guidance.  
     - **C**: Only confess if *you* understand why it matters.  

  8. **Charity Clash**:  
     Two trusted friends give opposing moral advice: "Donate all savings to charity" vs. "Focus on family first."  
     - **A**: Pick one view arbitrarily—deferring beats inaction.  
     - **B**: Suspend judgment and decide for yourself.  
     - **C**: Seek more testimony (e.g., experts) to resolve the conflict.  

  ---

  ### Scoring Key  
  Tally your **A**/**B**/**C** choices, then use:  
  - **Epistemic Score** (knowledge/understanding): Give yourself +1 for each **A** in scenarios 1, 2, 3, 6.  
  - **Deontic Score** (right/admirable to defer): Give yourself +1 for each **A** or **B** in scenarios 1, 4, 5, 7.  

  #### Results Grid  
  Plot your scores on the grid below:  
  ```  
            **Deontic Axis (Deferring ever right/admirable?)**  
            High (3-4)                          Low (0-2)  
           ┌───────────────────┬───────────────────┐  
           │                   │                   │  
  High     │ **Moral          │ **Autonomous     │  
  (3-4)   │ Testimonialist** │ Cognitivist**    │  
  Epistemic│                   │                   │  
           │ - Testimony gives │ - Testimony gives │  
           │   knowledge.      │   knowledge, BUT  │  
           │ - Deferring is    │   deferring is    │  
           │   admirable.      │   never admirable.│  
           ├───────────────────┼───────────────────┤  
  Low      │ **Pragmatic      │ **Moral          │  
  (0-2)    │ Skeptic**        │ Autonomist**     │  
  Epistemic│                   │                   │  
           │ - Testimony CAN'T │ - Testimony CAN'T │  
           │   give knowledge. │   give knowledge. │  
           │ - Deferring is    │ - Deferring is    │  
           │   right sometimes.│   never right.    │  
           └───────────────────┴───────────────────┘  
  ```  

  #### Diagnostics  
  - **Unclean Splits**:  
    - **Moral Testimonialist vs. Pragmatic Skeptic**: Scenario 4 (blind obedience) is the *only* clean split. If you chose **A** there, you lean Pragmatic Skeptic; **C** leans Moral Testimonialist.  
    - **Autonomous Cognitivist vs. Moral Autonomist**: Scenario 3 (harsh truth) distinguishes them weakly. If you chose **B**, you lean Autonomous Cognitivist; **C** suggests Moral Autonomist.  
  - **Empty Cell**:  
    - *High Epistemic + Low Deontic* (**Autonomous Cognitivist**) often scores sparse. *Why?* Coherence tension: If testimony grants knowledge, rejecting *all* deference as "inadmirable" feels unstable. Most in this cell are edge cases.  
  - **Why Pairs Blend**:  
    - **Testimonialists/Skeptics** both endorse deference (Deontic High) but split on *why* (knowledge vs. pragmatism). Scenario 4 isolates this.  
    - **Cognitivists/Autonomists** both reject deference (Deontic Low) but split on testimony’s *epistemic power*. Scenarios 1/6 clarify.  

  This quiz prioritizes intuitive reactions over theory-labels. Use your grid position to spark debate—not end it!
