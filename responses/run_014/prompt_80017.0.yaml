prompt: |-
  You are a working philosopher at the intersection of decision theory and epistemology, and you're deeply familiar with the rationalist literature on expected value and its pathologies. I need you to help me set a research agenda, and I want you to reason carefully and in a structured way about it rather than give me a survey.

  Here's the situation. I'm advising a small working group — three philosophers, about eighteen months, and no empirical or computational budget — that wants to make genuine progress on what's usually called the "expected value fanaticism" problem: the cluster of cases where EV-maximizing decision theory seems to demand absurd commitments, from Pascal's-mugging-style extortion to betting nearly everything on vanishingly unlikely catastrophic payoffs. I've read the standard material (the Pascal's mugging discussions, the infinite- and divergent-expected-value threads, the "is this fanaticism or just rationality?" framing), so please don't re-explain the basics. What I want is a *defended prioritization*: which of the genuinely open sub-questions should this group actually spend its eighteen months on, and in what order.

  Structure your answer in two phases. Phase one, brainstorm: list the candidate open questions you see in this area as broadly as you can — include several I almost certainly haven't thought of, and don't filter for quality yet. Phase two, select and rank: pick the four or five that matter most and order them.

  When you rank, organize each question around a distinction I care about and want you to take seriously: is the question primarily (a) *epistemic* — about how we should assign and calibrate probabilities for tail events; (b) *axiological* — about whether or when the magnitude of values can be unbounded, or when outcomes are incomparable; or (c) *procedural/normative* — about whether EV maximization is the right decision rule at all, or whether we should replace it with something like satisficing, quantile, or expected-shortfall criteria. For each ranked question, state which of (a)/(b)/(c) it is, explain why it's upstream of the others (i.e., how many of the remaining questions' answers depend on it), how tractable it is for philosophers specifically rather than economists or ML researchers, and what argument or evidence in the next year or so would move it up or down the list.

  Address one specific cut head-on, because I think it's underappreciated: the *moral-uncertainty mugger* — an agent who doesn't exploit an error in your probability estimates but your uncertainty about your own values ("you admit it's even possible that utilitarianism is true, so hand over everything"). Is this a genuinely distinct problem from the standard probability-mugging case, or is it the same pathology in different clothes? And does your ranking change depending on which it is?

  Finally, name the one or two questions you'd *deprioritize*, and say why their answer wouldn't change much downstream. I'm after a defended agenda, not a literature review: no reading lists, no citations, no "further reading." Be explicit about the trade-offs between the criteria (importance, upstream-ness, tractability, neglectedness) and about what would change your mind.
reasoning: |-
  Hmm, this user is a philosopher working at the intersection of decision theory and epistemology, seeking a structured research agenda for their working group on expected value fanaticism. They're clearly well-versed in the literature (mentioning Pascal's mugging, infinite expectations, etc.) and want focused prioritization rather than survey material. 

  Key constraints: 3 philosophers, 18 months, no empirical/computational budget. The user explicitly wants me to avoid rehashing basics and instead provide a defended prioritization with specific structure. 

  First, I need to unpack their core request: they want (1) a broad brainstorm of open questions, then (2) ranked selection of 4-5 key questions categorized as epistemic/axiological/procedural. Must address the "moral-uncertainty mugger" as a distinct case and explicitly deprioritize 1-2 questions. 

  The moral-uncertainty mugger is fascinating—it shifts exploitation from probability to value uncertainty. My instinct is that this *is* meaningfully different because it targets the foundations of axiology rather than epistemology. Standard mugging relies on tail probabilities; this exploits meta-ethical doubt. That distinction should inform ranking. 

  For brainstorming: I'll cast a wide net across three dimensions: 
  - Epistemic (tail probabilities, Knightian uncertainty) 
  - Axiological (unbounded utility, comparability) 
  - Procedural (alternatives to EV maximization) 
  ...plus cross-cutting issues like moral uncertainty and domain restrictions. 

  When ranking, I'll weigh: 
  - Upstream-ness: How many other problems hinge on this? 
  - Philosophical tractability: Can pure theory make progress? 
  - Neglectedness: Where can philosophers add unique value? 
  - Impact: Does it dissolve or reframe fanaticism? 

  Top contenders will likely include: 
  1. Axiological foundations (upstream of everything) 
  2. Moral uncertainty (novel and philosophically rich) 
  3. Tail probability epistemology (central but thorny) 
  ...with procedural questions being downstream. 

  Deprioritization candidates: Infinite state spaces (too mathematical) and "mere" probability calibration (empirically driven). 

  Finally, I'll note what evidence could reshuffle rankings—e.g., if new work emerges on bounded utility proofs, or if moral uncertainty gets sudden attention. The agenda must remain adaptive even if focused.
answer: |-
  Here’s a structured research agenda for your working group, defending prioritization based on **upstream impact**, **tractability for philosophers**, and **neglectedness**. I address the moral-uncertainty mugger explicitly and justify trade-offs.

  ---

  ### **Phase One: Brainstorm**  
  *Candidate open questions (broadly scoped, unfiltered):*  
  1. **Epistemic**:  
     - How to assign *non-arbitrary probabilities* to hypotheses with no empirical grounding (e.g., "matrix lords," "Pascal's demon").  
     - The epistemology of *Knightian uncertainty* in tail events: Can we quantify ignorance beyond probability?  
     - Calibration of priors for *out-of-context hypotheses* (e.g., "this stranger controls 3↑↑↑↑3 lives").  
     - Whether *coherent probabilities require bounded support* over outcomes.  

  2. **Axiological**:  
     - Are *unbounded utility functions* coherent? Must values have intrinsic upper/lower bounds?  
     - When (if ever) are outcomes *incomparable* (e.g., 1 human life vs. 10^100 dust specks)?  
     - Does *moral uncertainty* create a distinct pathology (e.g., "you might be a utilitarian, so pay up")?  
     - Can *lexical priorities* (e.g., rights>utility) block fanaticism?  

  3. **Procedural/Normative**:  
     - Is EV maximization *legitimately optional*? Alternatives:  
       - *Quantile-based rules* (e.g., maximize the 0.1% worst-case outcome).  
       - *Domain restrictions* (e.g., ignore probabilities below 1/10^100).  
       - *Risk-weighted expected utility* (e.g., rank-dependent weights).  
       - *Satisficing* (e.g., "good enough" outcomes).  
     - Does fanaticism reveal EV as *instrumentally irrational*?  
     - How to handle *infinitely many possible actions* (e.g., "bet $n against probability 1/n^2").  

  4. **Cross-Cutting**:  
     - *Moral-uncertainty mugging*: Is it reducible to probability mugging, or does it demand new tools?  
     - *Intertheoretic comparisons*: How to weigh values under moral uncertainty (e.g., utilons vs. deontic units).  
     - *Decision-dependent probabilities*: Can agents manipulate tail probabilities by their choices?  

  ---

  ### **Phase Two: Select and Rank**  
  **Ranking criteria**:  
  - **Upstreamness**: Resolving this unlocks progress on downstream questions.  
  - **Tractability**: Philosophers can make progress in 18mo with conceptual tools.  
  - **Neglectedness**: Underemphasized in existing literature.  
  - **Impact**: Resolves core pathologies or reframes the debate.  

  **Top 4 Ranked Questions**:  
  1. **Question**: *Must utility be bounded? If not, what axioms allow unbounded values while avoiding fanaticism?*  
     - **Type**: Axiological (b).  
     - **Why upstream**: Unbounded utility is the root of most EV fanaticism (e.g., Pascalian payoffs). If utilities *must* be bounded, many problems dissolve. If not, we need constraints on value aggregation.  
     - **Tractability**: Purely conceptual; requires analyzing coherence conditions for preference relations. Philosophers excel here.  
     - **Evidence to shift rank**: A new impossibility theorem for bounded utility under standard axioms would elevate this; empirical work on value aggregation (e.g., neuroeconomics) would lower it.  

  2. **Question**: *Does moral uncertainty generate a distinct fanaticism pathology? If so, what decision rules handle intertheoretic comparisons?*  
     - **Type**: Axiological (b) / Procedural (c) hybrid.  
     - **Why upstream**: Moral-uncertainty mugging exploits *value-space tails*, not probability tails. If irreducible, it demands new norms (e.g., variance-sensitive rules). If reducible, it simplifies the field.  
       - **Is it distinct?** Yes: Probability mugging exploits *epistemic* fragility; moral mugging exploits *axiological* fragility. The latter requires comparing incommensurable values (e.g., utilons vs. Kantian duties), not just unlikely truths.  
     - **Tractability**: Philosophers uniquely handle meta-ethical uncertainty. Formalizing "value coherence" is feasible.  
     - **Evidence to shift rank**: A proof that moral uncertainty reduces to probability uncertainty (e.g., via "veil of ignorance") would deprioritize it; experimental work showing distinct cognitive heuristics for moral uncertainty would prioritize it.  

  3. **Question**: *Can we ground non-arbitrary probability bounds for tail events without ad hoc thresholds?*  
     - **Type**: Epistemic (a).  
     - **Why upstream**: EV fanaticism often relies on *unfalsifiable* hypotheses with arbitrarily low probability. If we can formalize constraints (e.g., "no ungrounded hypotheses"), probabilities become tractable.  
     - **Tractability**: Connects epistemology to decision theory; philosophers can draw on formal epistemology (e.g., imprecise probabilities).  
     - **Evidence to shift rank**: Progress in formalizing "Knightian uncertainty" (e.g., through credal sets) would help; if ML researchers solve out-of-distribution detection, this becomes less urgent.  

  4. **Question**: *Under what conditions is EV maximization instrumentally irrational for bounded agents?*  
     - **Type**: Procedural (c).  
     - **Why upstream**: If EV is *instrumentally* flawed (e.g., leads to sure losses in iterated dilemmas), alternatives become urgent. Connects to resource-rationality and computational limits.  
     - **Tractability**: Conceptual work on rationality norms; aligns with bounded rationality literature.  
     - **Evidence to shift rank**: Simulations showing EV leads to dominated outcomes in sequential settings (e.g., via "mugger ecosystems") would boost this; proofs that EV is uniquely consistent under resource constraints would lower it.  

  ---

  ### **Explicitly Deprioritized Questions**  
  1. **"How to handle infinite state spaces with divergent expectations?"**  
     - **Why deprioritize**: Highly technical, requires measure-theoretic tools better suited to mathematicians. Progress here rarely resolves *practical* fanaticism (which occurs with finite but extreme stakes). Downstream impact is low: if utilities/probabilities are bounded, divergence vanishes.  
  2. **"Calibrating tail probabilities empirically (e.g., for asteroid impacts)."**  
     - **Why deprioritize**: Relies on domain-specific data and forecasting—better for actuaries. The *deep* problem is ungrounded hypotheses (e.g., "simulation threats"), not calibrated ones.  

  ---

  ### **Trade-offs and Agenda Rationale**  
  - **Axiological > Epistemic > Procedural**: Values constrain probabilities, which constrain norms. Bounded utility (Q1) could resolve 80% of cases; moral uncertainty (Q2) addresses the most novel pathology.  
  - **Neglectedness**: Moral uncertainty mugging is underexplored compared to probability mugging.  
  - **Tractability**: All top questions avoid empirical/computational needs.  
  - **Risk**: If Q1 fails (utilities are unbounded), Q3-4 gain urgency. If moral uncertainty reduces to probability (unlikely), deprioritize Q2.  

  **Agenda Order**:  
  1. Month 1–6: Q1 (bounded utility).  
  2. Month 7–12: Q2 (moral uncertainty).  
  3. Month 13–15: Q3 (tail probabilities).  
  4. Month 16–18: Q4 (instrumental rationality).  

  This order maximizes upstream progress: resolving axiology simplifies epistemology and norms. The moral-uncertainty mugger forces a distinct value-comparison problem—if your group cracks this, it could redefine the field.
