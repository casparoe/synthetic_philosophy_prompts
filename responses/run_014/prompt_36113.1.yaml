  This prediction aligns with the **famous Allais pattern** (A > B and D > C), commonly observed due to the certainty effect in the first choice and risk-seeking for high payoffs in the second.

  ---

  ### **Implicit Decision Rule**
  Her choices fit **Buchak's risk-weighted expected utility (REU)**.  
  - **REU formula**: \( \text{REU}(G) = u(y) + r(p) \cdot [u(x) - u(y)] \) for a gamble between outcomes \(x > y\) with probability \(p\) for \(x\).  
  - **Key features**:  
    - **Utility function (\(u\))**: Slightly concave (e.g., \(u(x) = \sqrt{x}\) or \(x^{0.6}\)), reflecting risk aversion for moderate gains.  
    - **Risk function (\(r\))**: Pessimistic, with \(r(p) < p\) for moderate probabilities (e.g., \(r(0.5) \approx 0.4-0.5\)). This underweights high outcomes, amplifying risk aversion for sure gains but allowing risk-seeking when sure amounts are low.  

  **Fitting her earlier choices**:  
  1. $400 > 50/50 $0/$1000:  
     \( u(400) > r(0.5) \cdot u(1000) \)  
  2. $100 > 50/50 $0/$250:  
