prompt: |-
  I'm a retired radio astronomer who's spent the last two years catching up on philosophy, and decision theory has become my latest rabbit hole. In my working life expectations were always friendly things — you average enough noisy voltages, the noise converges, that's basically the whole job — so the classic paradoxes here hit me harder than they probably should. I've got a decent handle on St. Petersburg: flip a coin until it lands heads, the payoff doubles each time it lands tails, and the expected value ends up being a sum whose terms don't shrink, so it just diverges to infinity. Fine. I've seen a million divergent series in my life, I know how to not be scared of them. But then I ran into the so-called Pasadena game (I believe this is due to Nover and Hájek, though I might be garbling the details), and I'm struggling to see whether it's a genuinely *different* and deeper problem or just St. Petersburg in a costume. As I understand it, the payoffs alternate in sign with magnitudes something like 2 to the n divided by n, so that when you compute the expectation, the terms end up being basically the alternating harmonic series: summed in the natural order it converges to ln 2 (of all things!), but the positive terms alone sum to +infinity and the negative terms alone sum to -infinity, so the "total expectation" isn't infinite — it's undefined.

  So here's what I'd like from you: a proper comparison of the two paradoxes. Is my instinct right that the Pasadena game is basically the Riemann rearrangement theorem doing a cameo in decision theory, or does that analogy break down? (One thing that nags me: nobody actually re-orders the tosses of a single gamble — the order is fixed by the setup — so is the "rearrangement" business even a legitimate move here, or just a metaphor?) And which situation is worse for the expected-utility theorist: a gamble whose expectation is infinite, or a gamble with no expectation at all? My gut says "undefined" is the more corrosive one — with St. Petersburg you can at least mutter about utilities being bounded or real casinos having finite bankrolls, but with Pasadena it's not even clear what the question "what would you pay to play?" means, since different sensible-looking ways of adding up the same terms give different answers. But maybe I'm overreacting, and a divergent series was the deeper embarassment all along. Relatedly: do the standard patches — bounded utility functions, capping payoffs somewhere, whatever else is on offer — fix both paradoxes in one go, or are they genuinely separate repairs? Feel free to get technical with me, sums and convergence talk won't scare me off, I did this for a living.
reasoning: |-
  We are comparing two paradoxes in decision theory: the St. Petersburg paradox and the Pasadena paradox.

  St. Petersburg Game:
  - A fair coin is flipped until it lands heads.
  - The payoff for the game is 2^n if the first head occurs on the n-th toss (i.e., n-1 tails and then a head).
  - The expected value is: E = (1/2)*2 + (1/4)*4 + (1/8)*8 + ... 
    = 1 + 1 + 1 + ... = ∞ (diverges).

  Pasadena Game (as described by Nover and Hájek):
  - The payoffs alternate in sign and are defined as follows: for the first head on the n-th toss, the payoff is (-1)^{n-1} * (2^n / n).
  - The expected value is the sum: E = Σ_{n=1}^∞ [ (1/2^n) * (-1)^{n-1} * (2^n / n) ]
    = Σ_{n=1}^∞ [ (-1)^{n-1} / n ]
    = 1 - 1/2 + 1/3 - 1/4 + ... = ln(2) ≈ 0.693.

  However, note that the series for the Pasadena game is conditionally convergent (the alternating harmonic series). This means that by rearranging the terms (which corresponds to changing the order of the events, but note that in the game the events are ordered by n, the number of tosses) we can make the series converge to any real number or even diverge. This is the Riemann rearrangement theorem.

  But here's the catch: in the Pasadena game, the events are naturally ordered by the number of tosses (n=1,2,3,...). So we are summing in the natural order. But the problem is that the series of absolute values is the harmonic series: Σ 1/n, which diverges. Therefore, the expectation is conditionally convergent. This leads to a situation where the expectation exists (as ln(2)) when we use the natural order, but if we were to group the terms in a different way (for example, taking all positive terms and then all negative terms) we would get +∞ and -∞ respectively.

  The heart of the paradox: The expectation of the Pasadena game depends on the order of summation. In the natural order, it converges to ln(2). But if we rearrange the terms, we can get any value. However, note that the game itself has a fixed order (by n). So the natural order is fixed. Why then is there a problem?

  The problem arises when we consider that the expected utility theory requires the expectation to be well-defined. The fact that the series is conditionally convergent (and hence the expectation is not absolutely convergent) leads to the following issue: 

  - The positive terms alone: Σ_{n odd} 1/n (since for odd n, the payoff is positive) diverges to +∞.
  - The negative terms alone: Σ_{n even} -1/n (for even n) diverges to -∞.

  Thus, the expectation is conditionally convergent: it converges only because of the alternating signs. In the context of decision theory, this is problematic because it means that the expectation is not robust to rearrangements, even though the natural order is fixed. But note: the problem is that the expected utility is defined as the sum of the products of probabilities and utilities. The series is conditionally convergent, so we have to accept the natural order. However, one might argue that the natural order is arbitrary? Actually, in this game, the order is fixed by the number of tosses. 

  But here's a twist: the Riemann rearrangement theorem applies to series that are conditionally convergent. It tells us that by changing the order of summation we can get any real number. However, in the Pasadena game, the order is fixed by the experiment (we start at n=1 and go on). So we must use the natural order. Therefore, we get ln(2). 

  So why is it a paradox? Because the expectation is finite (ln(2)) but it is sensitive to the order of terms. Moreover, if we try to compute the expectation by grouping terms (for example, grouping the outcomes in pairs of two) we might get a different result? Actually, grouping terms is a form of rearrangement? Not exactly. If we group the first two terms (n=1 and n=2), then the next two (n=3 and n=4), etc., we get:
    (1 - 1/2) + (1/3 - 1/4) + ... = ln(2)
  which is the same. So grouping in consecutive pairs does not change the sum.

  However, if we group arbitrarily, we might get different results. But the natural order is fixed. So why is it a problem? The problem is that the expectation is conditionally convergent, meaning that it is not absolutely convergent. This leads to the following: 

  - The Pasadena game has an expectation that is finite only because of the cancellation of positive and negative terms. Without that cancellation, we would have an undefined (divergent) expectation. 

  - This is different from St. Petersburg, which is unconditionally divergent (the series of positive terms diverges to +∞).

  So the two paradoxes are distinct:

  1. St. Petersburg: The expectation is infinite. This is problematic because it suggests that one should be willing to pay any finite amount to play the game, which is counterintuitive.

  2. Pasadena: The expectation is conditionally convergent. This is problematic because the value we get (ln(2)) is sensitive to the order of summation. However, in the natural order it is ln(2). But note: the problem is that we have a finite expectation, but the fact that the series is conditionally convergent leads to the following: 

     a) The expectation is not robust to rearrangements (though the natural order is fixed, so we might not rearrange).

     b) More importantly, the standard way of defining the expectation as the sum of the products of probabilities and utilities relies on the absolute convergence of the series. If the series is not absolutely convergent, then the expectation is not unambiguously defined. Why? Because in measure theory, the expectation is defined as the integral of the payoff with respect to the probability measure. For a discrete random variable, it is the sum. But the definition requires that the integral (or the sum) is absolutely convergent. Otherwise, the expectation is said not to exist. 

     This is a key point: in probability theory, the expectation of a random variable X is defined only if E[|X|] < ∞ (i.e., the absolute expectation is finite). If E[|X|] = ∞, then the expectation may be defined conditionally (as in the Pasadena game) but it is not considered to be well-defined in the standard sense. So the Pasadena game does not have a defined expectation in the standard probabilistic sense because the absolute expectation is:

          E[|X|] = Σ_{n=1}^∞ (1/2^n) * (2^n / n) = Σ_{n=1}^∞ 1/n = ∞.

     Therefore, the expectation does not exist (by the standard definition) because the absolute series diverges.

     So the Pasadena game is not a random variable with a defined expectation. This is the core of the paradox: the alternating series converges conditionally to ln(2), but the absolute series diverges. Therefore, the expectation is not defined.

     This is different from St. Petersburg: in St. Petersburg, the expectation is also not defined in the absolute sense (because E[|X|] = E[X] = ∞). But note: the St. Petersburg game has non-negative payoffs, so the expectation is +∞. However, in standard probability theory, if a random variable is non-negative, we define the expectation as the integral (which may be +∞). So St. Petersburg has an expectation of +∞. But for the Pasadena game, the expectation is not defined at all because it is conditionally convergent and the absolute expectation is infinite.

  Therefore, the Pasadena game is a deeper problem because it shows that the expectation is not unambiguously defined even though the series in the natural order converges to a finite number. The standard mathematical definition of expectation requires absolute convergence for the expectation to be considered well-defined.

  Which is worse?

  - The St. Petersburg game: we have an infinite expectation. We can try to fix it by bounded utility (if we bound the utility function, then the expectation becomes finite) or by introducing a finite bankroll (which caps the maximum payoff). These fixes work.

  - The Pasadena game: even if we bound the utility, we might avoid the problem? Let's see. Suppose we have a bounded utility function. Then the payoffs in the Pasadena game would be transformed by the utility function. The original payoffs are unbounded (in absolute value) and the absolute series diverges. But if we bound the utility, then the absolute expectation would become finite (since the bounded utility function would make the terms bounded and the probabilities sum to 1). So the expectation would be defined. 

    Alternatively, if we cap the payoffs (so that no payoff exceeds a certain bound) then the absolute series becomes convergent. Therefore, the expectation becomes unambiguously defined.

    So the standard patches (bounded utility or capped payoffs) fix both paradoxes.

  But note: without these patches, the Pasadena game is more problematic because the expectation is not even defined (it is conditionally convergent, which is not accepted in the standard definition). The St. Petersburg game at least has a defined expectation (as +∞) in the extended sense.

  In summary:

  1. St. Petersburg: 
     - Expectation = ∞ (defined in the extended real numbers).
     - Problem: Infinite expectation leads to counterintuitive decisions.
     - Fix: bounded utility or capped payoffs.

  2. Pasadena:
     - Expectation: not defined (because the absolute series diverges, and the conditional convergence leads to ambiguity in the standard definition).
     - Problem: The expectation is conditionally convergent, which is not a well-defined expectation in probability theory.
     - Fix: bounded utility or capped payoffs (which make the absolute series converge).

  So the Pasadena game is a different and deeper problem in the sense that it violates the necessary condition for the existence of an expectation (absolute convergence). The St. Petersburg game does not have this issue because it is non-negative and hence the expectation is defined as ∞.

  Your analogy with the Riemann rearrangement theorem is apt: it highlights that the series is conditionally convergent. But note that in the game, we are not rearranging the events (because the natural order is fixed). However, the mathematical issue is that the expectation is not defined without the condition of absolute convergence. The rearrangement theorem serves as a warning that if we try to compute the expectation by rearranging the terms we get different values, but more importantly, the lack of absolute convergence means that the expectation is not defined in the standard sense.

  Therefore, the Pasadena paradox is worse because it doesn't even have a defined expectation. The St. Petersburg game at least has an expectation (infinity) and we can reason about it (and then fix it by boundedness). The Pasadena game leaves us without a defined expectation to work with.

  I hope this clarifies the distinction and the relative severity of the two paradoxes.
answer: |-
  Your analysis of the Pasadena paradox is spot-on, and your instinct about the Riemann rearrangement theorem playing a key role is correct. Let's break down the comparison between St. Petersburg and Pasadena, addressing your core questions. I'll emphasize the mathematical structure, decision-theoretic implications, and philosophical distinctions.

  ### **1. Core Mathematical Structure: Divergence vs. Conditional Convergence**
  - **St. Petersburg**:  
    Payoff for first heads on toss $n$ is $2^n$. Expectation:  
    $$E = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty.$$  
    This is a **divergent series with positive terms** (unconditional divergence). The infinite expectation arises from unbounded growth in payoffs, not cancellation.

  - **Pasadena**:  
    Payoff for first heads on toss $n$ is $(-1)^{n-1} \frac{2^n}{n}$. Expectation:  
    $$E = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} (-1)^{n-1} \frac{1}{n}.$$  
    This is the **alternating harmonic series**. It converges to $\ln 2 \approx 0.693$ *when summed in order*, but:  
    - Absolute series diverges: $\sum_{n=1}^{\infty} \frac{1}{n} = \infty$ (harmonic series).  
    - Positive terms ($n$ odd) diverge to $+\infty$; negative terms ($n$ even) diverge to $-\infty$.  
    By the Riemann rearrangement theorem, reordering terms can make the series converge to *any real number* or diverge.  

  **Key Distinction**:  
  - St. Petersburg has **unconditional divergence** (no finite value possible).  
  - Pasadena has **conditional convergence** (finite value only under specific order; no robust expectation exists).

  ---

  ### **2. Is Pasadena Just St. Petersburg in Disguise? No.**
  Your analogy to the Riemann rearrangement theorem is apt, but the implications go deeper:  
  - **Order matters**: In St. Petersburg, reordering terms doesn't change divergence (all terms positive). In Pasadena, reordering *can change the sum arbitrarily*.  
  - **But the game fixes the order!** Here’s the rub:  
    - The gamble's payoff sequence is **fixed by $n$** (toss count). Summing in order $n=1,2,3,\dots$ gives $E = \ln 2$.  
    - *However*, the **decision-theoretic definition of expectation requires absolute convergence**. If $\sum |p_i u_i| = \infty$ (as in Pasadena), the expectation is **undefined** in standard probability theory (e.g., Kolmogorov’s axioms). Conditional convergence isn’t sufficient.  
    - **Why?** Without absolute convergence, the sum’s value isn’t invariant under partition or representation changes. For example:  
      - Grouping payoffs: $\left(1 - \frac{1}{2}\right) + \left(\frac{1}{3} - \frac{1}{4}\right) + \cdots = \ln 2$,  
      - But other groupings (e.g., $\frac{1}{3} - \frac{1}{2} + \frac{1}{5} + \frac{1}{7} - \frac{1}{4} \cdots$) can yield different values.  
      While the toss order is fixed, the *summation’s mathematical representation* isn’t unique. The physical setup doesn’t resolve the ambiguity—it’s a flaw in how expectation is defined.  

  **Verdict**: Pasadena isn’t just a reshaped St. Petersburg. It exploits conditional convergence to expose a deeper problem: **expectation can be order-dependent even with a fixed event sequence**.

  ---

  ### **3. Which Paradox is "Worse" for Expected Utility?**
  **Pasadena is more corrosive**, and here’s why:  
  - **St. Petersburg**:  
    - Problem: Infinite expectation $\implies$ agents "should" pay any finite price to play (counterintuitive).  
    - Saving grace: We can **blame unbounded utility**. Solutions:  
      - Bound utility functions (e.g., Bernoulli’s logarithmic utility).  
      - Cap payoffs (e.g., real-world resource limits).  
      These force convergence, restoring finite expectations.  

  - **Pasadena**:  
    - Problem: **No expectation exists** (undefined, not infinite).  
      - "What would you pay?" has no unique answer.  
      - Even the "natural order" sum ($\ln 2$) is suspect: Why privilege order $n$? Why not group outcomes differently?  
    - Saving graces are less effective:  
      - **Bounded utility/capped payoffs fix it** (see §4), but...  
      - **Without these**, Pasadena violates the **necessary condition for expectation** (absolute convergence). This challenges the very definition of rational choice.  

  **Philosophical punch**:  
  - St. Petersburg questions *how we handle infinity*.  
  - Pasadena questions *whether expectation is well-defined*.  
  Undefined expectations are more foundational—they undermine the expected utility framework itself.

  ---

  ### **4. Do Standard Fixes Resolve Both? Yes, but with Nuance**
  - **Bounded utility (e.g., $u(x) = \arctan(x)$)**:  
    - St. Petersburg: Caps marginal utility $\implies$ convergent series.  
    - Pasadena: Removes unbounded payoffs $\implies \sum |p_i u_i| < \infty$ (abs. conv.).  
      *Result*: Both have finite, unique expectations.  

  - **Capped payoffs (e.g., max $M$)**:  
    - St. Petersburg: Finite expectation (e.g., $\sum_{n=1}^{\log_2 M} 1$).  
    - Pasadena: Absolute series converges (since $|u_i| \leq M$, $\sum p_i |u_i| \leq M$).  
      *Result*: Both well-defined.  

  **But note**:  
  - These fixes **work by ensuring absolute convergence**, which is necessary for expectation to be well-defined.  
  - Pasadena highlights that **conditional convergence isn’t enough**—a point St. Petersburg doesn’t raise.  

  ---

  ### **5. The Metaphor of "Rearrangement"**
  - **In a single gamble**: The toss order is fixed, so "rearranging events" doesn’t happen physically.  
  - **But mathematically**: The expectation is a series whose value *depends on summation order* if not absolutely convergent.  
    - This isn’t just a metaphor—it’s a **property of the series itself**.  
    - Decision theory implicitly assumes **path-independence**: How we "count" outcomes shouldn’t matter. Pasadena violates this.  
  - **Example**: If you partition outcomes into "blocks" (e.g., "first block: $n=1,2$", "second block: $n=3,4$", etc.), the expectation changes if the blocks aren’t contiguous. The physical setup doesn’t prevent this.  

  **Conclusion**: Rearrangement is a symptom of conditional convergence, revealing that expectation isn’t invariant under mathematically valid re-representations.

  ---

  ### **Final Thoughts**
  - **St. Petersburg** is a "friendly" divergence: Infinite but well-directed. Fixable with realism (bounded utility/caps).  
  - **Pasadena** is pathological: No expectation exists, exposing a vulnerability in the definition itself.  
  - **Why this hits harder**: As a scientist, you’re used to convergent averages (e.g., signal processing). Pasadena shows that decision theory’s "expectation" is fragile without absolute convergence—a constraint absent in your radio astronomy work.  

  **To your question**:  
  > *"Is the rearrangement business a legitimate move or just a metaphor?"*  
  It’s legitimate *mathematically* (revealing ambiguity) but not *physically* (toss order is fixed). The tension between them is why Pasadena is profound—it forces us to confront how we model choice under uncertainty.  

  If you’re diving deeper, look into:  
  - Hájek & Nover’s original papers (they generalize Pasadena).  
  - "Causal decision theory" responses (e.g., Andy Egan).  
  - The **two-envelope paradox** (another conditional convergence puzzle).  

  Keep enjoying the rabbit hole—it’s a testament to the depth of "simple" games!
