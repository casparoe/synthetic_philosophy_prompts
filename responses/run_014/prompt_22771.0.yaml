  I have just been arguing with a friend about Fitch's paradox of knowability, and we reached a stalemate on a point I would like you to explain. We both accept the standard setup — the knowability principle, that every truth is in principle knowable, and the reductio that, on pain of contradiction, forces the conclusion that every truth is in fact known. But we disagree about what the paradox actually establishes. My friend maintains that it shows nothing can ever be unknown; I maintain that it shows only that no truth of the form "p and p is not known" can be unknown. Could you explain the Fitch move precisely, and in particular (a) why the reductio specifically targets negative truths — truths of the form "it is not the case that p is known" — rather than unknown truths generally, and (b) whether the knowability principle itself has to be known, or at least knowable, for the reductio to go through?
