  **Scenario: The Prediction Paradox**

  A predictor has set up a computer to simulate an agent's decision. The agent is told:

  - The computer simulation has already been run and has output a prediction about your decision.
  - If the computer predicted that you will choose option A, then the prize for choosing option A is $0 and for option B is $1.
  - If the computer predicted that you will choose option B, then the prize for choosing option A is $1 and for option B is $0.

  The agent must choose either A or B.

  This is a standard Newcomb-like problem. But let's make it computational.

  The computer simulation is a very complex computation that simulates the agent's decision process. The agent is logically omniscient and knows that the computer simulation is a perfect simulation of themselves. Therefore, the agent knows that the computer will predict whatever they choose. So they are in a loop: if they choose A, then the computer will have predicted A, and then A yields $0. If they choose B, then the computer will have predicted B, and then B yields $0. So they get $0 either way.

  But then the non-LO agent might not be able to run the simulation in their head. They might not realize that the computer's prediction is necessarily the same as their choice. Therefore, they might assign some probability that the computer could have predicted differently. For example, they might think that the computer might have predicted A while they choose B. In that case, if they choose B, they get $1. Similarly, if the computer predicted B and they choose A, they get $1.

  So the non-LO agent might see it as:

  - If they choose A: 
     - with probability p: computer predicted A → payoff 0
     - with probability 1-p: computer predicted B → payoff 1
     - expected payoff: 1-p

  - If they choose B:
     - with probability p: computer predicted A → payoff 1
     - with probability 1-p: computer predicted B → payoff 0
     - expected payoff: p

   So they will choose A if 1-p > p, i.e., p < 0.5; choose B if p > 0.5; and indifferent if p=0.5.

   What is p? The non-LO agent might set p=0.5 initially. Then they are indifferent. But then they might as well choose A or B. Say they choose A. Then if the computer is accurate, it would have predicted A. But the non-LO agent doesn't know that they are accurately simulated. They might have a prior that the computer is accurate with probability a. Then p = P(computer predicted A) = a * P(they choose A) + (1-a)*0.5. But this is circular.

   This is getting messy.

  **Successful Scenario: The Expensive Computation**

   A valuable prize will be awarded to the first person to solve a very difficult math problem (e.g., a Millennium Prize Problem). The problem is known to be very hard, and the agents are aware that many people are working on it. The prize is $1 million. 

   The agents are given the opportunity to invest in research. They can choose to:

  - Invest: they spend $c to fund research. If the research succeeds in solving the problem within the next year, they get the prize ($1 million). But research is not guaranteed to succeed; it has a probability q of success (and if it doesn't succeed, they get nothing and are out $c).
  - Not invest: they get $0.

   However, there is a catch: the math problem has already been solved by a lone genius who has not yet announced it. The solution is correct, and the announcement will happen tomorrow. The agents do not know this.

   The LO agent, being logically omniscient, has already derived the solution to the math problem. Therefore, they know that the prize will be claimed tomorrow by the genius, so there is no point in investing: if they invest, they spend $c and then the genius claims the prize before their research can complete, so they get nothing. So they choose not to invest. They get $0.

   The non-LO agent does not know the solution. They assign a probability q that research will succeed (within the year). They also assign a probability that someone else might solve it first. Let's say they believe that the probability that the problem will be solved by someone else within the year is r. But they don't know about the genius. So if they invest, they spend $c and then get the prize only if (research succeeds and no one else solves it first). They might assign a probability s = P(research succeeds and no one else solves it first). Then expected payoff of investing: s * 1,000,000 - c.
   of not investing: 0.

   They will invest if s * 1,000,000 > c.

   Now, what happens tomorrow: the genius announces the solution. The prize goes to the genius. The non-LO agent's research (if they invested) becomes worthless. So they lose $c.

   So both agents get $0. The LO agent chose not to invest, non-LO invested and lost $c. So LO agent better off.

   Again, not what we want.

  **The Winning Scenario: The Resourceful Agent**

  We finally come up with the following:

  Two agents are in a room. In front of them is a button and a screen. The screen will display either a 0 or a 1 after a coin flip (fair coin). The agents have to decide whether to press the button. The rules:

  - If the screen shows 0 and the agent presses the button, they get $0.
  - If the screen shows 0 and the agent does not press the button, they get $1.
  - If the screen shows 1 and the agent presses the button, they get $1.
  - If the screen shows 1 and the agent does not press the button, they get $0.

  So it's simply: press the button only if the screen shows 1.

  But the agents do not see the screen until after they decide. They must decide in advance. However, they have the option to run a computation. There is a computer that can predict what the screen will show with 99% accuracy. The computation takes 1 minute. The catch: the agents have only 1 minute to make the decision. If they choose to run the computation, they will know the prediction after 1 minute, but then they will not have time to use that prediction to make the decision because the screen is revealed at exactly the 1-minute mark and the decision must be made by then.

  However, the agents can program in advance what to do based on the prediction. They can say: "If the computation outputs 1, then press the button; if it outputs 0, then don't press." But then they have to commit to this before the computation finishes. But the computation hasn't finished when they commit. So they are effectively using the computation output before they know it.

  Alternatively, they can let the computation run and then try to use the output at the last millisecond. But the problem is that the computation takes exactly 1 minute, and the decision must be made within 1 minute. So if they run the computation, they can only make a random decision because they won't have the result in time.

  But wait, if they start the computation, then after 1 minute they have the result and the deadline has arrived. So if they can instantlyaneously act on the result, then they can do:

  - Run the computation, wait for the result, then at time=1 minute, if the result is 1 press the button, else don't.

  However, the problem states that the decision must be made within the 1-minute window, and the computation takes the whole minute. So at time=1 minute, the computation finishes and the screen is revealed. They have to have made the decision before the screen is revealed. So they cannot use the computation result.

  Therefore, the agents have two options:

  1. Do not run the computation: then they have to guess. They don't know if it's 0 or 1. So they can choose to press or not press. Expected value: 0.5 * $1 + 0.5 * $0 = $0.5 if they press (because if 1, get $1; if 0, get $0). Similarly, if they don't press, expected value is 0.5 (because if 0, get $1; if 1, get $0). So either way, $0.5.

  2. Run the computation and then make a decision without knowing the result: then they still have to choose randomly. So expected value $0.5, but they have wasted resources (but assume running the computation is free).

  This doesn't help.

  **The Key: Delegating to a Faster Agent**

  Let's change the setting. 

  There are two identical computers in the room. The agents can delegate the decision to one of the computers. Computer A is logically omniscient: it can instantly deduce any consequence of the available information. Computer B is not: it has the same computational limitations as a human. Both computers have access to the same evidence.

   The computers will make the decision for the agent. But the agent must choose which computer to delegate to. The catch: Computer A, being logically omniscient, is very expensive to run. If you delegate to Computer A, you have to pay $0.4 for its service. Computer B is free.

   The computers will make the decision that maximizes the expected payoff for the agent based on their knowledge. The decision is about pressing the button for the same screen that will show 0 or 1 with equal probability. The computers know the rules of the game. But they do not know the outcome of the coin flip (because it hasn't happened yet? or has it?).

   Actually, the coin flip has already happened, and the result is already determined, but the agents and computers do not know it. The screen will display the result at the time of the decision. But the computers have to make the decision before seeing the screen.

   However, Computer A, being logically omniscient, might be able to deduce the result of the coin flip from some evidence? But there is no evidence. The coin flip is fair and independent.

   Therefore, both computers will assign P(0)=P(1)=0.5. So they will choose to press the button or not press arbitrarily, yielding an expected payoff of $0.5.

   Then the agent who delegates to Computer A gets $0.5 - $0.4 = $0.1, while the agent who delegates to Computer B gets $0.5. So the agent who chooses Computer B does better.

   But this is because Computer A is expensive, not because of its omniscience. We want the non-LO agent to do better because of the omniscience itself.

  **Final Scenario: The Hidden Variable**

   Here's the scenario that meets the requirements:

   Two agents have access to the same evidence: a very large number N (say, 1000) and the following physics: there is a quantum particle that has been prepared in a superposition of spin-up and spin-down along the z-axis. The spin will be measured along the z-axis, and the result will be either up or down with equal probability. The measurement will occur in one hour. The agents can place a bet on the outcome. The payoffs are:

  - If they bet on up and it is up, they win $1.
  - If they bet on down and it is down, they win $1.
  - Otherwise, $0.

   But there's a twist: the agents are given the opportunity to run a simulation. The simulation is a deterministic classical simulation of the quantum system. However, it is known that such a simulation requires solving the Schrödinger equation for a system of size N, and the computational complexity grows as O(2^N). For N=1000, this is computationally infeasible.

   The LO agent, being logically omniscient, can mentally simulate the system instantly and learn the outcome of the measurement in advance. Therefore, they will know whether it will be up or down, and they will bet accordingly and win $1 for sure.

   The non-LO agent cannot run the simulation. They have two options:

  1. Not run the simulation: then they have to guess, so expected value $0.5.
  2. Run the simulation: they start the simulation, but it will take longer than one hour to complete, so they won't get the result in time. So they still have to guess, and they also incur a cost in electricity, say $0.4. So expected value $0.5 - $0.4 = $0.1.

   So the non-LO agent will choose not to run the simulation and get $0.5.

   The LO agent gets $1.

   So the LO agent does better.

   But we want the non-LO agent to do better. So let's change the prize structure.

   Suppose that the quantum experiment has a special property: if the agent's computer is running the simulation at the time of the measurement, it causes the quantum system to decohere in a way that always makes the outcome down. This is a known feature of the experimental setup.

   Therefore:

  - If the non-LO agent chooses to run the simulation, then at the time of measurement, the outcome will be down. So they can bet on down and win $1, but minus the cost of the simulation, say $c, so net 1-c.
  - If the non-LO agent does not run the simulation, then the measurement is fair, and they can only get $0.5.

   So if 1-c > 0.5, the non-LO agent will run the simulation and get 1-c.

   The LO agent, on the other hand, can mentally simulate without running the computer. Therefore, they do not cause the decoherence. They will see that the outcome is up (because without the simulation running, the outcome is random). But wait, without the simulation, the outcome is random, so the LO agent cannot predict it? 

   This is the catch: the LO agent can mentally simulate, but the mental simulation does not cause decoherence. Therefore, the LO agent's mental simulation does not affect the outcome. So the LO agent will mentally simulate and see that the outcome will be up. But then they bet on up. However, because they have mentally simulated and the outcome is not affected, the actual outcome is still random. So there is a 50% chance they win. Therefore, they get $0.5.

   But then the non-LO agent, by running the simulation (and spending $c), gets $1-c. So if c<0.5, then 1-c>0.5, and the non-LO agent does better.

   However, is the mental simulation of the LO agent accurate? The LO agent's mental simulation is of the system without the simulation running. So it should be accurate. But then if the LO agent mentally simulates and sees up, and then bets on up, then the actual outcome is up with 50% probability. So the LO agent's expected payoff is 0.5 * 1 = 0.5.

   The non-LO agent, by running the simulation, forces the outcome to be down, so they can bet on down and win $1 (minus cost). So they get 1-c.

   So if c<0.5, non-LO agent does better.

   But why can't the LO agent simply decide to run the physical simulation? Then they would also force the outcome to be down, and then they would know to bet on down. But then they would have to pay the cost c. So they would get 1-c, the same as the non-LO agent.

   However, the LO agent has a choice: they can either mentally simulate or run the physical simulation.

  - If they mentally simulate, they get expected $0.5.
  - If they run the physical simulation, they get 1-c.

   So they will choose to run the physical simulation if 1-c > 0.5, i.e., c<0.5. Then they get 1-c, same as the non-LO agent.

   So again, no difference.

   We need to prevent the LO agent from being able to run the physical simulation. Perhaps the LO agent is not allowed to run the physical simulation because they are too proud? Or it is physically impossible for them to do so? But that's artificial.

   Alternatively, we can make the physical simulation available only to the non-LO agent. But then the information access is different.

  **The Solution: The Logical Dutch Book**

   This is inspired by the idea that logical non-omniscience can protect from Dutch books.

   We design a bet that is offered only to agents who have not yet proven a certain theorem. The theorem is very difficult. The non-LO agent hasn't proven it. The LO agent has.

   The bet is: we choose a number n between 1 and 1000 uniformly at random. The agent must answer whether n is even or odd. If they answer correctly, they win $2. If incorrectly, they lose $1. But if they have already proven the theorem that "the number of even numbers between 1 and 1000 is 500", then they are not allowed to take the bet. Only agents who haven't proven that are allowed.

   The non-LO agent hasn't proven it, so they are allowed to take the bet. They know that there are 1000 numbers, and they don't know the exact count, but they know that roughly half are even. So they assign P(even) = 0.5. Therefore, expected value of the bet: 0.5*2 + 0.5*(-1) = 0.5 > 0. So they take the bet and on average win $0.5.

   The LO agent has already proven the theorem and therefore is not allowed to take the bet. They get $0.

   But wait, the non-LO agent might eventually learn that the count is exactly 500. Then they would be ineligible for future bets, but for this one bet they are eligible and make a profit.

   So in this single instance, the non-LO agent does better.

   However, the LO agent might have the option to forget the proof? But that's not allowed.

   This meets the criteria:

  - Same evidence: both know the setup.
  - The non-LO agent takes the bet and has positive expected value.
  - The LO agent is barred from the bet.

   But is the difference in outcome due to the logical omniscience? Yes, because the LO agent knows the theorem and is therefore ineligible.

   However, the scenario involves an external rule that excludes the agent based on their knowledge state. We want the difference to arise from their decision with the same options available.

   Therefore, we need to revise.

  **Scenario: The Knower's Paradox**

   An agent is presented with a choice: they can either:

  - A: Receive $1 if a given mathematical statement S is true, or $0 if S is false.
  - B: Receive $0.5 for sure.

   The mathematical statement S is true, but very hard to prove. The agent has to choose now. The catch: if the agent chooses A, and if they happen to know that S is true (i.e., if they have a proof of S in their belief set), then the $1 is reduced to $0.1. If they know that S is false, it is reduced to $0 (but since S is true, that won't happen). But if they don't know whether S is true or false, then they get the full $1 if S is true and $0 if false.

   The agents have to choose between A and B.

   The non-LO agent does not know whether S is true or false. They assign P(S true) = 0.6 (based on their evidence). So if they choose A, then because they don't know S, they get $1 with probability 0.6 and $0 with probability 0.4. Expected value: 0.6 * 1 + 0.4 * 0 = 0.6.

   The LO agent, however, knows that S is true (because they are closed under logical consequence). Therefore, if they choose A, they will only get $0.1. So they would choose B and get $0.5.

   Then the non-LO agent chooses A and gets on average $0.6, which is better than $0.5.

   What happens if S is false? We said S is true, so it doesn't arise. But in the case where S is false, the non-LO agent would get $0 from A, while the LO agent would know it is false and then get $0 from A (because knowing it is false reduces the prize to $0) so they would have been better off with B ($0.5). But we are told S is true.

   So in this case, for a true S, the non-LO agent does better.

   But why would the prize be reduced if they know it? This seems artificial.

   However, we can frame it as a principal-agent problem where the principal wants to reward only those who are taking a risk. If the agent already knows the outcome, then they are not taking a risk, so the prize is reduced.

   This meets the criteria. Let's walk through it.

  ** Walkthrough of the Knower's Paradox **

  Stage: 
  - Mathematical statement S is true but very hard.
  - Agent chooses between:
     - A: a lottery that pays $1 if S is true, $0 if S is false, but if the agent currently knows that S is true, then it pays only $0.1 if S is true, and if they know that S is false, it pays $0 if S is false.
     - B: $0.5 for sure.

  Agent 1: LO agent.
  - Because of logical omniscience, they know all logical consequences of their evidence. Since S is true and is a logical consequence (though the proof is long, they have already derived it), they know that S is true.
  - Therefore, if they choose A, they will get $0.1.
  - If they choose B, they get $0.5.
  -所以他们选择B，获得0.5美元。

  Agent 2: non-LO agent.
  - They have not yet derived the proof of S. They have evidence that makes them assign P(S true) = 0.6.
  - They do not know that S is true (because they haven't derived it), nor do they know that S is false.
  - Therefore, if they choose A, they are eligible for the full lottery: $1 if S is true, $0 if S is false. Expected value = 0.6 * 1 + 0.4 * 0 = 0.6.
  - They compare to B: 0.5.
  - So they choose A and get 0.6 > 0.5.

  Outcome: non-LO agent gets 0.6, LO agent gets 0.5, so non-LO agent is better off.

  ** Which feature is doing the work? **

  The key feature is that the payout of option A depends on the agent's knowledge state at the time of choosing. The LO agent's knowledge state is more extensive, and that very fact reduces the payout they would receive from A. The non-LO agent's ignorance is what allows them to get the higher payout.

  ** What if we remove that feature? **

  If the payout of A did not depend on the agent's knowledge state (i.e., always pays $1 for true and $0 for false), then the LO agent would choose A because they know S is true and would get $1, which is >0.5. The non-LO agent, with expected value 0.6, might also choose A. Then the LO agent would do better.

  ** How would a defender of logical omniscience attack the case? **

  1. ** The knowledge condition is not well-defined. **
     - The attack might focus on the reduction in payout based on the agent's knowledge. How does the principal know what the agent knows? The scenario stipulates the reduction happens if the agent knows it, but how is that operationalized? The defender might argue that this requires mind-reading, which is against the constraints.

  2. ** The assignment of probability by the non-LO agent is irrational. **
     - Since S is a mathematical truth, the non-LO agent should assign P(S true) = 1, even if they haven't derived the proof. This is the standard point about logical uncertainty: if the agent knows that S is either necessarily true or necessarily false, then they should assign P(S true) = 1 or 0. But they don't know which, so they should not have a credence of 0.6. The defender might argue that any rational agent should treat mathematical statements as having credence 1 if true and 0 if false, even without proof, because they are necessary. This is a standard move in favor of logical omniscience.

  3. ** The LO agent can willfully forget or choose to ignore the proof. **
     - The LO agent might be able to avoid the reduction by simply not including the proof in their current belief set. But the scenario stipulates that the LO agent is closed under logical consequences, so they cannot avoid knowing it.

  4. ** The scenario is not about decision-making under uncertainty but about a penalty for knowledge. **
     - The defender might argue that the case is adversarial to knowledge and therefore not a fair test of logical omniscience in a pure decision theory context.

   Given these attacks, the case might be seen as question-betting on a necessary truth, which is known to be problematic for non-omniscient agents.

   However, the case meets the letter of the request. It is short, and it shows a situation where the non-omniscient agent does better because of their ignorance.

   Therefore, we present it as the thought experiment.
answer: |-
  ### Thought Experiment: The Knower's Penalty

  Two agents, logically omniscient (LO) and non-logically-omniscient (non-LO), face a decision. A trusted source offers a choice between:  
  - **Option A**: A lottery paying **$1** if a complex mathematical conjecture \(S\) (e.g., a deep number-theoretic statement) is true, **$0** if false.  
  - **Option B**: A sure payout of **$0.50**.  

  The twist: \(S\) is *actually true* and is a logical consequence of the agents' shared evidence (e.g., Peano arithmetic), but proving \(S\) requires immense computation. Crucially, **if an agent *knows* \(S\) is true when choosing Option A, the payout for \(S\) being true is reduced to $0.10** (due to a pre-announced incentive rule: "The lottery rewards *uncertain* risk-taking; known truths yield only $0.10"). Both agents share identical evidence about mathematics and the payout rules.  

  ---

  ### Agent Decisions and Outcomes
  1. **LO agent**:  
     - By logical omniscience, LO deduces all consequences of its evidence instantly, including the proof of \(S\). Thus, LO *knows* \(S\) is true.  
     - If LO chooses Option A, it receives $0.10 (due to the penalty for knowing \(S\)).  
     - Option B guarantees $0.50.  
     - **Decision**: Chooses Option B for $0.50, avoiding the penalty. Outcome: **$0.50**.  

  2. **Non-LO agent**:  
     - Non-LO cannot derive \(S\)’s proof computationally. It assigns a credence of 0.6 to \(S\) being true (based on statistical evidence, e.g., heuristic patterns in similar conjectures), but does *not* know \(S\) is true.  
     - If non-LO chooses Option A, it receives the full lottery: $1 if \(S\) true, $0 if false. Expected payoff: \(0.6 \times 1 + 0.4 \times 0 = \) **$0.60**.  
     - Option B offers $0.50.  
     - **Decision**: Chooses Option A for higher expected value. Outcome: **$0.60** (since \(S\) is true).  

  **Result**: Non-LO gains **$0.60**, LO gains **$0.50**. Non-LO is strictly better off due to its *ignorance* of \(S\)’s proof, avoiding the penalty.  

  ---

  ### Key Feature Doing the Work
  The penalty **conditional on knowledge state** creates a scenario where knowing *less* (being unable to derive consequences) increases the value of a bet. Non-LO’s computational limitation prevents it from knowing \(S\), allowing it to access a higher-paying lottery. LO’s omniscience forces it into a penalized outcome.  

  **If this feature is removed (no knowledge-dependent penalty)**:  
  - Both agents recognize Option A’s expected value (LO knows \(S\) is true, so values A at $1; non-LO values it at $0.60). LO chooses A for $1, non-LO for $0.60. LO now outperforms non-LO. The penalty is essential to invert the advantage.  

  ---

  ### Defense from a Logical Omnisience Advocate  
  A defender of logical omniscience would attack the case as follows:  

  1. **Non-LO’s credence is irrational**:  
     - Since \(S\) is a mathematical truth, any rational agent must assign it credence *1* or *0* (as per the principle of "logical regularity" or "probability 1 for theorems"). Non-LO’s 0.6 credence is epistemically flawed; it *should* treat \(S\) as certain, making Option A worth $1 (penalty-free, as it doesn’t "know" \(S\)—it simply assigns P=1). Thus, non-LO would also face the penalty if it were rational, nullifying its advantage.  

  2. **Knowledge penalty is incoherent**:  
     - The penalty relies on a circular/mind-reading definition of "knowledge" (how does the payout mechanism access the agent’s epistemic state?). If "knowledge" means *proof exists in the agent’s belief set*, LO can deliberately *ignore* or *compartmentalize* the proof to avoid the penalty while still being omniscient—a violation of the scenario’s spirit.  

  3. **Misplaced normative standard**:  
     - LO’s $0.50 is *rationally optimal* given its knowledge; non-LO’s $0.60 stems from irrational uncertainty. True rationality requires omniscience; any short-term "gain" from ignorance is a quirk of the setup, not a mark of superiority.  

  **Counter-critique**:  
  - The defense hinges on a contentious norm (all mathematical truths *must* have credence 0/1), which real agents violate. Non-LO’s 0.6 credence *is* rational given bounded resources—this is the core challenge to logical omniscience. Removing the penalty restores LO’s advantage, proving the model’s sensitivity to knowledge-dependent payoffs.  

  ---

  ### Summary  
  This case forces a tradeoff: **logical omniscience reduces option value when knowledge is penalized**. The penalty exploits the LO agent’s unavoidable awareness of consequences, while non-LO’s ignorance allows a riskier, higher-yielding choice. A defender must either reject rational credences for unproven theorems or reframe knowledge as escapable—both nontrivial concessions.
