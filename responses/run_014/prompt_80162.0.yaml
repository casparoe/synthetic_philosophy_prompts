answer: |-
  ### Decision Procedure for Project Continuation

  This procedure ensures sunk costs are ignored while incorporating evidence gained from past spending, strategic signaling, and updated project prospects. It uses a tiered approach: **fact-based gates** (which can auto-terminate) followed by **judgment gates** (requiring human deliberation). 

  ---

  #### **Step 1: Viability Check (Fact-Based Gate)**  
  **Question:** *"Given the evidence generated by past spending (e.g., data, prototypes, publications), does the project have a ≥30% probability of achieving ≥1 core objective with the remaining budget?"*  
  - **Sufficient Answer:**  
    - **YES:** Objective evidence (e.g., validated hypotheses, milestone completion, peer-reviewed outputs). Proceed to Step 2.  
    - **NO:** Lack of progress, unresolved technical flaws, or no credible pivot plan. → **STOP FUNDING.**  
  - **Why Fact-Based?** Evidence (not sunk costs) updates success probability. A "NO" here is fatal—no strategic override.  

  #### **Step 2: Incremental Cost-Benefit (Fact-Based Gate)**  
  **Question:** *"Would the expected value (EV) of continuing outweigh the cost? Calculate: EV = (Probability of Success × Benefit) / Remaining Cost."*  
  - **Inputs:**  
    - *Probability of Success:* From Step 1 (e.g., 30-80%).  
    - *Benefit:* Estimated scientific/societal impact (use foundation’s predefined scale: e.g., 1=incremental; 5=field-changing).  
    - *Remaining Cost:* Dollars needed to complete the project.  
  - **Threshold:** EV ≥ 1.5 (i.e., expected benefits justify cost).  
    - **EV ≥ 1.5 → Proceed to Step 3.**  
    - **EV < 1.5 → Proceed to Step 4 (Judgment Gate).**  
  - **Why Fact-Based?** Quantifiable inputs minimize bias. Sunk costs excluded.  

  #### **Step 3: Strategic Continuity (Judgment Gate)**  
  **Question:** *"Is there a concrete, non-regret strategic reason to continue (e.g., partner/donor trust, field leadership) that outweighs the cost?"*  
  - **Sufficient Answer:**  
    - **YES:** Tangible impact (e.g., "Terminating voids a co-funding pact with Lab X" or "Donor Y explicitly ties $5M gift to this project"). → **CONTINUE FUNDING.**  
    - **NO:** Vague justifications (e.g., "We’ve spent too much to quit," "Embarrassing to admit failure"). → **STOP FUNDING.**  
  - **Why Judgment?** Strategic value is contextual and requires human assessment.  

  #### **Step 4: Override Assessment (Judgment Gate)**  
  **Question (if EV < 1.5 from Step 2):** *"Despite low EV, does the strategic value of continuing (from Step 3) exceed the remaining cost?"*  
  - **Evaluation Criteria:**  
    - Quantify strategic harm (e.g., "Loss of Partner = $2M in future collaboration").  
    - Confirm no alternatives (e.g., renegotiation impossible).  
  - **Outcome:**  
    - **Strategic Value > Remaining Cost → CONTINUE FUNDING.**  
    - **Else → STOP FUNDING.**  
  - **Why Judgment?** Requires weighing intangible assets (trust, reputation) against costs.  

  ---

  ### Procedure Walkthroughs

  #### **Project 1: Strong Evidence, High Remaining Cost**  
  - **Background:** Generated peer-reviewed breakthroughs. Needs $2M more (70% of total budget).  
  - **Step 1:** *Viability?* YES (evidence shows 60% success probability).  
  - **Step 2:** *EV Calculation:*  
    - Benefit = 4/5 (major advancement).  
    - EV = (0.6 × 4) / $2M = 1.2 → **< 1.5 → Proceed to Step 4.**  
  - **Step 4:** *Override?*  
    - Judgment: No strategic partner/donor risk. High cost unjustified.  
    - **→ STOP FUNDING.**  
  - **Why You Won’t Like It:** Strong science isn’t enough if the finish line is too expensive.  

  #### **Project 2: No Progress, Low Remaining Cost**  
  - **Background:** 3 years, zero outputs. Needs $50K to limp along (5% of total budget).  
  - **Step 1:** *Viability?* NO (no evidence/pivot plan). → **STOP FUNDING.**  
  - **Note:** Sunk costs ignored. Cheapness doesn’t rescue non-viability.  

  #### **Project 3: Strategic Partnership at Risk**  
  - **Background:** Mediocre progress, but killing it severs a key university partnership. Needs $1M.  
  - **Step 1:** *Viability?* YES (weak but plausible: 35% success).  
  - **Step 2:** *EV Calculation:*  
    - Benefit = 2/5 (modest impact).  
    - EV = (0.35 × 2) / $1M = 0.7 → **< 1.5 → Proceed to Step 4.**  
  - **Step 4:** *Override?*  
    - Judgment: Partner provides $500K/year in shared resources. Loss = $1.5M over 3 years.  
    - Strategic Value ($1.5M) > Remaining Cost ($1M) → **CONTINUE FUNDING.**  
  - **Safeguard:** Demand a 6-month turnaround plan; exit if no improvement.  

  ---

  ### Key Design Notes  
  - **Sunk Costs vs. Evidence:** Step 1 converts spent dollars into *updated probability* (e.g., past failures lower probability; successes raise it). Money itself is irrelevant.  
  - **Strategic Signaling:** Confined to Steps 3/4. Must be concrete (e.g., donor contracts, partnership clauses)—not guilt or ego.  
  - **Judgment Dressed as Procedure:**  
    - Step 1’s "≥30% viability" threshold is arbitrary but forces rigor.  
    - Step 4’s cost/benefit trade-off is subjective but requires dollar quantification.  
  - **Anti-Regret Guardrails:**  
    - Step 3 bans "embarrassment" justifications.  
    - Step 1 prevents throwing good money after bad.  

  This procedure ensures evidence and strategy drive decisions—not sunk costs or pride. It auto-kills non-viable projects (Steps 1–2) and forces explicit, quantified debate for borderline cases (Steps 3–4).
