prompt: |-
  My friend and I spent most of last night arguing about where the line between science and non-science actually falls, and midway through I realized that although I know all of her past verdicts, I cannot predict her on the new cases. Her track record, as best I can reconstruct it: she counts Newtonian gravitation after the Mercury perihelion anomaly as science, even though the anomaly was tolerated for decades before the theory fell; she counts pre-1960s plate tectonics — no mechanism, largely rejected by the establishment of its day — as science; she counts modern macroeconomics, despite its forecasting record, as science; and she refuses to count homeopathy, Freudian psychoanalysis, and intelligent design, in each case on the ground that the theory accommodates any possible outcome and its community never concedes anything. Where we got stuck last night was on three new cases: string theory, which generates no risky empirical predictions but lives inside physics departments under constant, harsh internal criticism; a university parapsychology unit that runs preregistered, methodologically impeccable Ganzfeld replications and faithfully publishes its null results; and a self-taught maverick with no credentials and no research community who issues dated, risky earthquake forecasts and, on the evidence so far, has been right more often than chance would allow. Predict her verdict on each of the three, say which rule she seems to be running — exposure to refutation and refusal to immunize, novel prediction and progressive problem shifts, institutional embeddedness in an organized skeptical community, or something else entirely — note where the rules that fit her record equally well come apart on these cases, and tell me which further case would best discriminate between them. I am less interested in who is right about the demarcation problem than in what her track record commits her to.
reasoning: |-
  Okay, let me approach this systematically. The user presents an intriguing puzzle about their friend's demarcation criteria between science and non-science. From the described track record, I need to reverse-engineer her underlying principles before applying them to three new cases. 

  First, examining her past verdicts: She accepts Newtonian physics despite the Mercury anomaly being tolerated - suggesting she values empirical testability over immediate falsification. Her acceptance of pre-1960s plate tectonics without mechanism or consensus indicates she prioritizes progressive research programs over institutional approval. Modern macroeconomics' inclusion despite poor forecasting implies she separates scientific status from performance metrics. Crucially, her rejections (homeopathy, Freudianism, ID) consistently cite unfalsifiability and immunization strategies.

  Now the three test cases become fascinating boundary probes:
  - String theory's lack of predictions would normally be problematic, but its "harsh internal criticism" within physics departments mirrors her institutional tolerance in the plate tectonics case. That embedded skepticism seems key.
  - The parapsychology unit does everything "right" methodologically but lacks a genuine skeptical community - their commitment to publishing null results might ironically demonstrate the immunization she rejects in homeopathy.
  - The earthquake forecaster has surprising predictive success but no community or peer review - this isolates the institutional factor since it lacks the organized skepticism she values.

  Where competing interpretations emerge: 
  A "falsificationist" reading would struggle with Newtonian physics, while "Lakatosian progress" can't explain macroeconomics. Her true differentiator appears to be institutionalized self-criticism - a sociological twist on Popper.

  To discriminate between "falsification-plus-community" versus "institutional embeddedness" as core criteria, I'd propose a fourth test: A corporate AI lab doing rigorous, falsifiable climate modeling but where negative results trigger termination. If she rejects this despite testability due to suppressed criticism, institutional context wins; if she accepts it based on methods alone, falsification is primary.

  The user's meta-goal is sharp: Not truth-seeking about demarcation, but coherence-seeking about their friend's position. That requires resisting philosophical side-debates to strictly map the pattern in her judgments.
answer: |-
  Based on her track record and reasoning, here's the predicted verdict for each new case, the core rule she follows, where competing rules diverge, and the critical test case to differentiate them:

  ### Predicted Verdicts
  1.  **String Theory:** **SCIENCE**
      *   *Reasoning:* Despite lacking current empirical predictions, it exists within a rigorous physics community engaging in "constant, harsh internal criticism." This mirrors her acceptance of pre-1960s plate tectonics (facing establishment rejection but fostering debate) and Newtonian gravitation (anomaly tolerated *within* a critical community). The intense internal scrutiny fulfills her core requirement, replacing the immediate need for risky predictions with active critical engagement.

  2.  **Parapsychology Unit:** **NON-SCIENCE**
      *   *Reasoning:* Despite impeccable methodology, preregistration, and publishing null results, its *community* likely lacks the essential characteristic of organized skepticism and refusal to immunize. Publishing null results could be seen as a form of immunization ("we keep trying, maybe next time") rather than genuine concession, similar to her rejection of homeopathy/Freud/ID. The absence of a broader skeptical scientific community accepting these nulls as falsification (and potentially winding down the research program) signals a failure to meet her core criterion.

  3.  **Earthquake Forecaster:** **NON-SCIENCE**
      *   *Reasoning:* While generating risky, dated predictions with apparent success exceeding chance, the complete lack of institutional embeddedness ("self-taught maverick with no credentials and no research community") is fatal. There's no organized skeptical community to scrutinize methods, replicate results, challenge assumptions, or force concessions. Success could be luck, flawed methodology, or post-hoc fitting, but without a critical community, it cannot be scientifically evaluated or forced to confront disconfirming evidence systematically. This contrasts sharply with Newtonian physics operating within a critical structure.

  ### The Core Rule: Institutionalized Skeptical Scrutiny & Refusal to Immunize
  Her pattern points decisively to **institutional embeddedness in an organized skeptical community committed to criticism and refusing immunization strategies** as the *primary* demarcation criterion. Key evidence:
  *   **Tolerated Anomalies Accepted:** Newtonian physics (anomaly endured *within* a critical physics community).
  *   **Rejected Theories Accepted:** Plate tectonics (facing establishment rejection *but debated within geology*).
  *   **Weak-Predictive Accepted:** Macroeconomics (operates *within* academic economics, with internal criticism and debates).
  *   **Rejections Explained by Immunization/Lack of Concession:** Homeopathy/Freud/ID (communities shield core tenets from falsification).
  *   **New Cases:** String theory's harsh physics criticism saves it; Parapsychology's isolated unit lacks genuine community concession; Earthquake forecaster has zero community.

  ### Where Competing Rules Diverge on the New Cases
  1.  **Exposure to Refutation & Refusal to Immunize (Stricter Popperian):**
      *   String Theory: Likely **NON-SCIENCE** (No *current* risky predictions = not falsifiable).
      *   Parapsychology: **SCIENCE** (Explicitly designs tests for refutation, publishes nulls).
      *   Earthquake Forecaster: **SCIENCE** (Makes risky predictions, apparent refutation possible via failures).
      *   *Divergence:* This rule clashes with her acceptance of String Theory and her likely rejection of the Parapsychology unit and Earthquake Forecaster. She prioritizes the community's *potential* for refutation over immediate testability, and sees publishing nulls as potentially immunizing without community consensus on falsification.

  2.  **Novel Prediction & Progressive Problem Shifts (Lakatosian):**
      *   String Theory: **NON-SCIENCE/BORDERLINE** (Lacks novel empirical predictions; progress is theoretical/mathematical).
      *   Parapsychology: **NON-SCIENCE** (Null results = no progressive predictions; degenerating program).
      *   Earthquake Forecaster: **SCIENCE** (Apparent successful predictions suggest a "progressive" track record).
      *   *Divergence:* This rule clashes with her likely acceptance of String Theory (theoretical progress within community) and rejection of the Earthquake Forecaster (individual success lacking community-progress). It also struggles to explain her acceptance of macroeconomics' status given its contested progress.

  3.  **Institutional Embeddedness (Her Rule):** As predicted above (S, NS, NS).

  ### Discriminating Test Case: The Corporate AI Lab
  To definitively distinguish her core rule (Institutional Skepticism) from a modified Falsification/Immunization rule, propose this:

  *   **The Case:** A well-funded, highly secretive corporate AI lab publishes papers claiming its proprietary model achieves revolutionary accuracy in predicting complex market dynamics. The papers describe rigorous internal falsification tests it supposedly passes, and the company highlights specific, dated, risky public predictions that succeeded. However, all data, code, and methodology are trade secrets. Independent replication is impossible. Criticisms from academics are dismissed as ignorance or sour grapes. Failed predictions are explained away as "input data errors" or "exceptional events," but the core model is never revised based on external critique.

  *   **Prediction under Her Rule (Institutional Skepticism):** **NON-SCIENCE**. Lacks embeddedness in an *independent, organized skeptical community* (secretive, corporate, dismisses external critique). Explanations for failures resemble immunization. Despite claims of internal falsification and some public success, the absence of external scrutiny and refusal to concede based on it violates her core criterion.

  *   **Prediction under Modified Falsification/Immunization Rule:** **SCIENCE**. It *claims* to generate risky predictions and subject them to internal falsification tests, publishing successes. While independent verification is impossible, the *stated intent and internal process* might satisfy this rule, especially if the public predictions seem genuinely risky and successful. The immunizations might be seen as problematic but not necessarily fatal to its scientific *status*.

  *   **Why it Discriminates:** This case isolates the *institutional, communal* aspect of skepticism vs. a focus purely on the *stated methodology and intent* of the practitioners regarding falsification and immunization. Her rejection of the Parapsychology unit hints she'd reject this corporate lab for lacking genuine community engagement, even if it *claimed* rigorous internal falsification. If she accepted it based on the claimed methodology, it would weaken the "institutional skepticism" reading and favor a methodology/intent-based falsification rule. Her rejection of ID/Freud based on community behavior, not just theory structure, strongly suggests she'd reject the corporate lab.
