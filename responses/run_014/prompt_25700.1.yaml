prompt: |-
  I keep noticing a pattern in how people's contributions to discussions get treated, and I'm wondering if there's a name for it in philosophy. It goes like this: someone from a marginalized group describes an experience — say, a woman describing a sexist interaction at work. People accept the description: yes, that happened, we believe you. But then when she offers an analysis of what it means — why it happened, what it says about the workplace culture, what should be done — suddenly she's "too close to it" to be objective, and her analysis is treated as speculative or biased. Meanwhile, someone with no direct experience of the thing offers an analysis, and that's taken seriously as "having perspective" or "being able to see the big picture."

  I've seen versions of this with disabled people describing accessibility problems (their descriptions are accepted, their proposed solutions are dismissed as not understanding the constraints), with people of color describing racist incidents (the incident is accepted, the claim that it's systemic is treated as overreach), and with patients describing symptoms to doctors (the symptoms are recorded, the patient's theory about what's wrong is ignored).

  It's not quite testimonial injustice, because the testimony about the bare facts is believed. And it's not quite hermeneutical injustice, because the person has the concepts and is offering an interpretation — it's just being dismissed. It's like a division of epistemic labor where one group gets assigned the role of data provider and another group gets to be the theorist. Does this have a name? If not, what's the best way to characterize it and how does it relate to the standard categories of epistemic injustice?
reasoning: |-
  Okay, the user is describing a pattern they've noticed in discussions where marginalized individuals share their experiences. The problem is that while their factual accounts are accepted, their deeper analyses or proposed solutions are dismissed as biased, whereas someone without direct experience is seen as objective. They want to know if there's a philosophical term for this and how it relates to epistemic injustice.

  First, I need to recall the standard types of epistemic injustice. Fricker's testimonial injustice involves not believing someone due to prejudice. Hermeneutical injustice is about lacking the concepts to understand one's own experience. But here, the facts are believed, and the person has the concepts, so it's different.

  The user’s observation seems like a division of epistemic roles. Marginalized people are seen as data providers but not credible analysts. I remember Dotson's work on contributory injustice and testimonial smothering. Could this be related? Also, Anderson's concept of epistemic segregation might fit, where there's a separation of who can provide facts versus analysis.

  Another angle is standpoint theory. Harding talked about strong objectivity, where marginalized perspectives offer better insights. Yet, in practice, their analyses are dismissed. This connects to the dismissal of experiential knowledge as "too close" while privileging detached viewpoints.

  Pohlhaus' hermeneutical marginalization is relevant too. It's about excluding certain groups from shaping shared understanding. That fits here because the marginalized person's interpretation isn't taken seriously. Also, credibility excess for the privileged plays a role—where their analysis is trusted more simply due to their status.

  I should also consider practical implications. The user might be seeking not just a label but validation of their experience and tools to address it. They might want to articulate this phenomenon in discussions or academic work. The deeper need could be understanding how to challenge this dynamic or find strategies to assert the value of their analyses.

  Putting it all together, no single term exists, but contributory injustice, hermeneutical marginalization, and Anderson's epistemic segregation are key concepts. Emphasizing the combination of credibility deficit for analysis and excess for the privileged helps explain the pattern. Relating it to standpoint theory and the critique of the "view from nowhere" ties it to broader philosophical critiques of objectivity.
answer: |-
  You've identified a profound and pervasive pattern that doesn't have a single, universally agreed-upon name in philosophy, but is actively discussed and theorized within **epistemology, social epistemology, feminist epistemology, critical race theory, and disability studies**. It represents a specific *form* or *manifestation* of epistemic injustice, combining elements and extending beyond Fricker's core concepts.

  Here's how it breaks down and the best ways to characterize it:

  1.  **Beyond Testimonial and Hermeneutical Injustice:** You're right to note it's distinct. Testimonial injustice denies credibility for the *factual report*. Hermeneutical injustice denies the *tools to understand/conceptualize* the experience. Here, the *fact* is believed, and the person *has* the concepts and *offers* an interpretation, but that *interpretation* is denied credibility.

  2.  **Core Characterization:** This is fundamentally **the denial of interpretive authority or analytic credibility to marginalized knowers.** It fragments their epistemic contribution: their experiential "data" is accepted (often begrudgingly, or seen as raw, unprocessed material), but their *analysis, explanation, theory, or proposed solution* derived *from* that experience is dismissed.

  3.  **Key Concepts & Names:**
      *   **Contributory Injustice (Gaile Pohlhaus Jr.):** This concept is perhaps the *closest fit*. Pohlhaus argues that marginalized knowers are often denied the ability to *contribute meaningfully* to the shared pool of knowledge *as interpreters and theorists*. Their contributions are relegated to the status of mere "input" or "raw data," while the dominant group retains the exclusive right to process, analyze, and theorize. This directly maps to your observation: "data provider" vs. "theorist."
      *   **Hermeneutical Marginalization (Pohlhaus & others):** This is a broader concept related to contributory injustice. It describes the systemic exclusion of certain groups (and their perspectives, concepts, and frameworks) from the processes that shape collective understanding and meaning-making (the hermeneutical resources). When a marginalized person's interpretation is dismissed, it's an instance of hermeneutical marginalization – their framework isn't considered valid or legitimate for shaping the shared understanding of the phenomenon *they* experienced.
      *   **Epistemic Exploitation (Berenice Dotson, Nora Berenstain):** While often focusing on the *demand* for marginalized people to educate the privileged, it highlights how marginalized knowledge (experiences) is extracted and used, while the knower's own analysis of that knowledge is ignored or devalued. The privileged benefit from the "data" without accepting the accompanying critique or framework.
      *   **Credibility Excess/Deficit Complex:** This isn't one term but a crucial dynamic. The marginalized speaker suffers a **credibility deficit** specifically regarding their *analytic capacity* ("too close," "emotional," "biased"). Simultaneously, the privileged speaker (often male, white, able-bodied, professional) enjoys **credibility excess** regarding their analytic capacity ("objective," "rational," "sees the big picture"), *even when they lack direct experience*.
      *   **Epistemic Privilege of Ignorance (Charles Mills, José Medina):** The privileged position often involves ignorance of the lived realities of oppression. Paradoxically, this ignorance is sometimes reframed as a *virtue* – a lack of "bias" or "investment" – granting them unwarranted epistemic authority for analysis. Their "distance" is seen as clarity, while the marginalized person's closeness is seen as clouding judgment.
      *   **Standpoint Theory Critique:** Standpoint theory (Harding, Hartsock, Collins) argues that marginalized positions *can* offer epistemically privileged insights into social structures precisely *because* of their experience. Your pattern represents the *rejection* of this core tenet. The dominant epistemology reverses it: proximity to oppression is seen as disabling objective analysis, while distance from it is seen as enabling it – contradicting the insights of standpoint theory.
      *   **The "View from Nowhere" Fallacy:** This critiques the illusion of a pure, detached, contextless objectivity (often associated with privileged positions). Dismissing the marginalized analyst as "too close" reinforces the myth that the privileged analyst *doesn't* have a situated perspective, falsely elevating their view as the "objective" one.

  **How it Relates to Standard Categories of Epistemic Injustice:**

  *   **It's an Extension/Specific Form:** This pattern demonstrates how epistemic injustice operates *beyond* the initial denial of fact or the lack of concepts. It shows how injustice persists even *after* basic credibility is granted and concepts are available. It targets the *next level* of epistemic contribution: synthesis, explanation, and theory-building.
  *   **It Combines Mechanisms:** It often involves:
      *   A *residual testimonial injustice* targeting the speaker's *analytic* credibility, not their factual reporting.
      *   *Hermeneutical marginalization* by excluding the speaker's interpretive framework from being taken seriously as part of the collective resource.
      *   *Exploitation* of the experiential knowledge while rejecting the accompanying analysis.
      *   An *unequal distribution of epistemic labor* enforced by credibility deficits/excesses.
  *   **It Highlights Structural Bias:** This pattern reveals how the standards of "objectivity" and "rationality" themselves are often defined in ways that favor dominant perspectives and discredit marginalized ones. The dismissal isn't just individual bias; it's often embedded in institutional practices and professional norms (e.g., medicine, academia, management).

  **In Summary:**

  While no single term perfectly captures it, **Contributory Injustice (Pohlhaus)** is the most direct philosophical label for the *core mechanism* of denying interpretive/theoretical contribution. **Hermeneutical Marginalization** describes the broader exclusion from meaning-making. The phenomenon itself is best characterized as:

  **The systemic denial of analytic and interpretive authority to marginalized knowers, where their experiential testimony is accepted as "data" but their derived analysis, explanations, or solutions are dismissed as biased or lacking perspective, while privileged knowers with less relevant experience are granted unwarranted credibility as "objective" analysts.**

  This pattern reinforces epistemic hierarchies, perpetuates the status quo by silencing critiques rooted in lived experience, and represents a sophisticated form of epistemic injustice that operates *after* the initial facts have been conceded. It's crucial for understanding how power dynamics shape not just *what* is known, but *who gets to decide what it means* and *what should be done*.
