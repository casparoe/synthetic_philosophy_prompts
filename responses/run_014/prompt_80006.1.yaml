prompt: |-
  I run a small cause-prioritization consultancy and we take on a new cause proposal roughly every two weeks. Each one gets a two-hour workshop where my team — three people, none of us with a stats background — is supposed to score it on importance, tractability, and neglctedness and come out with a fund / fund-with-reservations / pass call that I and one of my partners have to be able to defend in a client meeting. Right now the process is basically vibes plus a spreadsheet, and I keep hitting the same failure modes. We score a cause high on neglectedness because almost nobody's working on it, but then it turns out the reason nobody's working on it is that the people who could work on it already tried and found it intractable, so "neglected" ended up being a proxy for "we don't know how to do this." And we score importance in whatever units the proposal comes in — QALYs, dollars of economic output, "units of alignment progress" — and then try to add them across causes, which is nonsense.

  Can you write me a decision procedure my team can actually run in that two-hour slot? I want the questions in the order we should ask them, what counts as a sufficient answer to each, and the exact point where the procedure stops and hands the call to a person because the question is one of values rather than facts. Three things it has to handle. First, the neglectedness score has to seperate "few people are working on this because it's hard to even understand what the problem is" from "few people are working on this because the people who could work on it are already working on it and hitting a wall" — I think those are different and I want the procedure to catch the difference, not just count heads. Second, the importance score has to be doable without converting everything to one unit, because we're not going to fake a QALY number for a cause that's about something we can't quantify. Third, tractability has to tell the difference between a research bet, where the next step is "do more theory" and the payoff is option value, and an action, where the next step is a concrete intervention with a payoff curve we can at least sketch.

  Then run it on two proposals. One is a two-year research program on a high-tail-risk AI safety problem where the importance is potentially enormous but the only "next step" is more theory and nobody knows if the theory will pan out — I think the procedure should be honest that this is a research bet with a tail-risk importance estimate, not an expected-value action, and score it that way even if that means a lower number than the importance alone would suggest. The other is a cause that's neglected only because it's embarrassing to talk about publicly, so the neglectedness is real but it's going to evaporate the moment we fund it and put our name on it — I think the procedure should flag that as a decaying score rather than a stable property.
reasoning: |-
  We are designing a decision procedure for cause prioritization that fits within a two-hour workshop. The procedure must address three key areas: 
  1. Neglectedness: Distinguish between "hard to understand" vs. "tried and failed".
  2. Importance: Score without requiring conversion to a single unit.
  3. Tractability: Differentiate between research bets (option value) and concrete actions (with a payoff curve).

  The procedure should be structured as a sequence of questions, with clear criteria for sufficient answers, and should hand off to human judgment when values are in dispute.

  We break the process into three phases: 
  I. Pre-Workshop Preparation (to be done by the proposer and reviewed by the team before the workshop)
  II. Workshop Procedure (the two-hour session)
  III. Post-Workshop (decision and documentation)

  ### I. Pre-Workshop Preparation
  The proposer must submit a one-page document that includes:
  1. **Problem Statement**: Clear description of the problem the cause addresses.
  2. **Importance**: 
     - What is the scale of the problem? (Provide in natural units, e.g., number of affected entities, magnitude of potential harm, etc.)
     - Why is this problem important? (Without requiring a single metric.)
  3. **Tractability**:
     - What is the current state of knowledge and intervention?
     - What are the key uncertainties?
     - What are the next steps? (Classify as either: a) research (theory, exploration) or b) action (concrete intervention).)
  4. **Neglectedness**:
     - Who is currently working on this? (List known efforts and their scale.)
     - Why do you believe this area is neglected? (Provide reasons.)

  ### II. Workshop Procedure (2 hours)
  **Step 1: Clarify the Problem (10 minutes)**
  - Question: "What is the problem we are trying to solve, and what would success look like?"
  - Sufficient answer: A clear, concise statement that the team understands and agrees upon. If not, pause and note the confusion as a risk (for neglectedness: hard to understand).
  - Output: A shared understanding of the problem and success criteria.

  **Step 2: Importance Assessment (20 minutes)**
  - Goal: Assess the importance without forcing a single unit.
  - Questions:
    a) "What is the scale of the problem? (How many are affected? How severe is the impact per affected entity?)"
    b) "What is the probability of the problem occurring (if it's a risk) or the current level of harm (if ongoing)?"
    c) "Is this problem reversible? If not, does that increase the importance?"
  - Scoring: 
    - Use a 1-10 scale for each of: 
      - Scale (number of entities affected)
      - Severity (impact per entity)
      - Irreversibility (0 = fully reversible, 10 = irreversible and catastrophic)
    - Do not aggregate. Note: We are not adding them. We are looking for high scores in at least one dimension and no low scores in any that would make the cause unimportant.
  - Handoff to values: If there is disagreement on the severity or irreversibility that cannot be resolved by facts, note that the importance score is contested and requires human judgment.

  **Step 3: Tractability Assessment (30 minutes)**
  - Goal: Differentiate between research bets and concrete actions, and assess feasibility.
  - Questions:
    a) "What is the next step? Is it primarily research (generating knowledge) or action (implementing an intervention)?"
      - If research: then we are in the domain of option value. The key question becomes: "What is the probability that this research will lead to a tractable intervention in the future?" and "How much does this research reduce uncertainty?"
      - If action: then we are in the domain of expected value. The key question becomes: "What is the expected impact of this action, and how does it scale?"
    b) "What are the key bottlenecks or uncertainties? How might they be overcome?"
    c) "What is the evidence for the effectiveness of the approach? (e.g., pilot studies, analogous cases, theoretical models)"
  - Scoring:
    - For research bets:
      - Potential upside (tail risk): 1-10 (how big is the upside if everything goes right?)
      - Probability of success: 1-10 (how likely is the research to yield actionable insights?)
      - Option value: 1-10 (how much does this open up future opportunities?)
      - Aggregate: We don't average, but note that a high option value with even a low probability of success might be worth it if the upside is huge. However, we flag low probability of success as a risk.
    - For concrete actions:
      - Expected impact per unit effort: 1-10 (based on evidence and scalability)
      - Evidence strength: 1-10 (how strong is the evidence for the impact?)
      - Ease of implementation: 1-10 (how easy is it to execute?)
      - Aggregate: Focus on expected impact and evidence strength. Low evidence strength requires more caution.
  - Handoff to values: If the team disagrees on the classification (research vs. action) or on the probability of success (especially for research) and cannot resolve it with facts, note the disagreement and proceed with a range.

  **Step 4: Neglectedness Assessment (20 minutes)**
  - Goal: Separate "hard to understand" from "tried and failed".
  - Questions:
    a) "Who is currently working on this? (List from the proposal and add any known by the team.)"
    b) "What is the total level of effort (in person-years or funding) currently dedicated to this cause?"
    c) "Why is this cause neglected? (Check for: lack of awareness, lack of funding, perceived intractability, embarrassment, etc.)"
    d) "Is there evidence that capable actors have tried and failed? If so, what were the reasons for failure?"
  - Scoring:
    - Level of effort: 1-10 (1 = many actors, 10 = almost none)
    - Reason for neglect (categorize):
      - Category A: Lack of awareness or funding (this is "good" neglect)
      - Category B: Perceived intractability (requires investigation: is the perception justified?)
      - Category C: Embarrassment or taboo (which might change quickly if broken)
      - Category D: Hard to understand (the problem is complex and not well defined)
    - Then, adjust the level of effort score based on the reason:
      - If Category A: keep the score (high neglect is good).
      - If Category B: if there is evidence of past failures by capable actors, then mark as "high risk of intractability" and lower the neglectedness score for decision purposes (because it's neglected for a reason that might be valid). If no evidence, then it's speculative and we keep the score but note the risk.
      - If Category C: note that the neglectedness is unstable and likely to decay if the taboo is broken. We keep the score but mark it as decaying.
      - If Category D: mark as high risk and lower the neglectedness score (because it's neglected due to being undefined, which might make it hard to work on).
  - Output: A neglectedness score (1-10) and a risk flag (for categories B, C, D).

  **Step 5: Integration and Decision (30 minutes)**
  - Goal: Combine the scores and make a preliminary call (fund, fund-with-reservations, pass).
  - Process:
    - Review the scores and flags from importance, tractability, and neglectedness.
    - Apply the following heuristics:
      - **Fund**: 
          - Importance: high in at least one dimension (scale, severity, irreversibility) and no low dimension.
          - Tractability: 
              - For research: high upside and at least moderate option value, and the probability of success is not extremely low (e.g., above 3).
              - For action: high expected impact and at least moderate evidence strength (e.g., above 5).
          - Neglectedness: high level of effort score (above 7) and no risk flag OR a risk flag that is manageable (e.g., category C with a plan to manage decay).
      - **Fund with reservations**:
          - One of the dimensions is weak but the others are strong, and there is a path to resolve the weakness.
          - Or, there is a risk flag (from neglectedness) that requires monitoring.
      - **Pass**:
          - Low in any dimension without compensating strengths.
          - Or, a risk flag that cannot be managed (e.g., category B with strong evidence of past failures, or category D without a clear path to defining the problem).
    - If the scores are borderline, or if there is a values dispute (e.g., on the importance of irreversibility), then hand off to human judgment (the partners) for the final call.

  **Step 6: Documentation (10 minutes)**
  - Record the scores, the reasoning, and the decision (or the need for partner judgment).
  - Prepare a one-paragraph rationale for the client meeting.

  ### III. Post-Workshop
  - The partners (you and your partner) review the output, especially where the procedure handed off to human judgment, and make the final call.

  ### Running the Procedure on Two Proposals

  **Proposal 1: Two-year research program on a high-tail-risk AI safety problem**

  - **Step 1: Problem** 
    - Problem: A specific AI safety problem that could lead to catastrophic outcomes if not solved.
    - Success: A theoretical framework that reduces uncertainty about the risk and possible interventions.
  - **Step 2: Importance**
    - Scale: Global (all of humanity).
    - Severity: Catastrophic (10).
    - Irreversibility: Irreversible (10).
    - Importance scores: Scale 10, Severity 10, Irreversibility 10.
  - **Step 3: Tractability**
    - Next step: Research (theory).
    - Research bet: 
      - Upside: 10 (if successful, it could prevent catastrophe).
      - Probability of success: 2 (low, because it's uncertain if the theory will pan out).
      - Option value: 8 (it could open up new research directions and interventions).
    - Evidence: Analogies from other safety-critical systems? Limited.
    - Classification: Research bet with high upside and option value but low probability.
  - **Step 4: Neglectedness**
    - Level of effort: 8 (few are working on this specific problem).
    - Reason: Category B (perceived intractability) and also Category D (hard to understand). 
      - We find that some capable actors have tried and failed? Maybe, but not definitively. We note the perception and the complexity.
      - Risk flag: high (due to B and D).
    - Adjusted neglectedness: We keep the score (8) but with a risk flag.
  - **Step 5: Integration**
    - Importance: Very high.
    - Tractability: Low probability of success but high upside and option value. This is a classic research bet.
    - Neglectedness: High but with a risk flag (might be intractable or hard).
    - Heuristic: This is a research bet with high importance and high neglectedness, but low probability of success. It might be a "fund with reservations" because of the risk. However, the option value is high. We note that it's not an action but a bet. The decision might be to fund because of the tail risk, but with reservations due to the low probability and neglectedness risk.

  **Proposal 2: Cause neglected because it's embarrassing**

  - **Step 1: Problem** 
    - Problem: A health issue that is taboo (e.g., a sexually transmitted disease in a conservative community).
    - Success: Reduced incidence of the disease.
  - **Step 2: Importance**
    - Scale: Many affected (e.g., millions).
    - Severity: Moderate (if untreated, severe but treatable) (7).
    - Irreversibility: Low (treatable) (3).
    - Importance: Scale 8, Severity 7, Irreversibility 3.
  - **Step 3: Tractability**
    - Next step: Action (concrete intervention: education, testing, treatment).
    - Expected impact per unit effort: 8 (if implemented, it works).
    - Evidence strength: 9 (strong evidence from other settings).
    - Ease of implementation: 6 (might be hard due to taboo, but proven methods exist).
  - **Step 4: Neglectedness**
    - Level of effort: 9 (very few are working on it in this community).
    - Reason: Category C (embarrassment). 
      - Note: If we fund it and put our name on it, the embarrassment might reduce and others might join, so neglect will decay.
    - Adjusted: Keep the score (9) but mark as decaying (unstable).
  - **Step 5: Integration**
    - Importance: Moderate to high (scale and severity, but not irreversible).
    - Tractability: High (strong evidence, good expected impact).
    - Neglectedness: High but decaying (if we break the taboo, others might join and reduce the neglectedness).
    - Heuristic: This is a strong candidate for funding, but we note that the neglectedness advantage may not last. We might fund with the reservation that we need to plan for reduced neglectedness (e.g., build a coalition quickly). The impact is concrete and tractable.

  This procedure should fit within two hours and address the specified failure modes.
answer: |-
  Below is a **step-by-step decision procedure** for your 2-hour cause-prioritization workshops. It’s designed to address your failure modes:  
  - **Neglectedness** distinguishes "hard to understand" from "tried and failed."  
  - **Importance** works without forcing all causes into a single unit.  
  - **Tractability** separates research bets (option value) from concrete actions (payoff curves).  

  The procedure is **sequential**, time-boxed, and flags when to hand off to human judgment (values-based decisions). It includes:  
  - **Explicit questions** in order.  
  - **Clear criteria** for sufficient answers.  
  - **Scoring** that avoids false precision.  
  - **Flags** for unstable neglectedness or unresolvable uncertainty.  

  ---

  ### **Decision Procedure: 2-Hour Workshop Flow**  
  **Preparation (Before Workshop):**  
  - Require proposers to submit a 1-page template covering:  
    - **Problem definition** (what, who, why).  
    - **Existing efforts** (who has tried what, outcomes).  
    - **Next step** (research/theory vs. concrete action).  
    - **Quantitative estimates** (with uncertainty ranges if possible).  

  **Workshop Structure (120 Minutes Total):**  

  #### **Step 1: Clarify the Problem & Success (15 min)**  
  - **Question:** "What specific problem does this cause address, and what does *success* look like?"  
  - **Sufficient answer:** A clear, non-circular statement (e.g., "Reduce AI misalignment risk via scalable oversight prototypes" not "Make AI safer").  
  - **Red flag:** If the team can’t define success without jargon, it’s likely "hard to understand" (neglectedness risk).  
  - **Output:** 1-sentence problem/success statement. Hand off to values if: Disagreement on *what success means* (e.g., "Is democratic reform success or just a step?").  

  #### **Step 2: Importance Assessment (20 min)**  
  - **Question:** "If successful, what is the scale of impact, and how irreversible/duration-sensitive is it?"  
  - **Scoring (No common unit needed):**  
    - **Scale:** Estimate magnitude (e.g., "10M lives affected," "<$1T economic loss," "global catastrophe reduction"). Score 1–10:  
      - `1` = Narrow/niche impact (e.g., 100 people).  
      - `10` = Existential/civilization-scale.  
    - **Irreversibility/Duration:** Score 1–10:  
      - `1` = Easily reversible/short-term (e.g., temporary income loss).  
      - `10` = Permanent/irreversible (e.g., extinction, irreversible ecosystem loss).  
  - **Sufficient answer:** Natural units + justification (e.g., "AI misalignment could cause human extinction (scale=10), and it’s irreversible (irreversibility=10)").  
  - **Hand off to values if:** Disagreement on *weighting* (e.g., "Is preventing extinction 1000× more important than economic growth?").  

  #### **Step 3: Tractability Assessment (30 min)**  
  - **Question 1:** "Is the next step a **research bet** (unknown theory, high uncertainty) or a **concrete action** (known intervention, quantifiable payoff)?"  
    - **Criteria:**  
      - **Research bet:** Next step = exploration/discovery (e.g., "Develop theory for AI alignment").  
      - **Concrete action:** Next step = intervention with evidence (e.g., "Distribute bed nets to reduce malaria").  
  - **Question 2 (Research bet):** "What’s the option value? What could this unlock, and what’s the probability of progress?"  
    - **Score:**  
      - `Option value`: 1–10 (Tail risk importance × probability of unlocking new paths).  
      - `Barriers`: 1–10 (Key unknowns, e.g., "No math to model this yet").  
  - **Question 2 (Concrete action):** "What’s the expected payoff curve (impact/effort), and how strong is the evidence?"  
    - **Score:**  
      - `Payoff steepness`: 1–10 (Slope of impact vs. effort, e.g., "Each $1M reduces cases by 10%").  
      - `Evidence quality`: 1–10 (Pilot data, analogs, theory).  
  - **Sufficient answer:**  
    - Research: "Option value=8 (could prevent tail risks), Barriers=6 (needs physics insights we lack)."  
    - Action: "Payoff steepness=7 (log-linear scaling), Evidence=4 (only lab studies)."  
  - **Hand off to values if:** Disagreement on *risk tolerance* (e.g., "Is 5% chance of a breakthrough worth funding?").  

  #### **Step 4: Neglectedness Assessment (25 min)**  
  - **Question 1:** "How many capable actors are working on this *now*?" → Score **`Current Effort`** 1–10:  
    - `1` = Many well-resourced actors.  
    - `10` = Almost none.  
  - **Question 2:** "Why is it neglected? (Select all that apply):"  
    - **A.** Hard to understand (no clear problem definition).  
    - **B.** Tried and failed (evidence of past failures by experts).  
    - **C.** Embarrassing/controversial (taboo discourages work).  
    - **D.** Genuine oversight (low-hanging fruit, no one noticed).  
  - **Scoring adjustments:**  
    - If **A or B**: Subtract 3–4 from `Current Effort` score (neglect ≠ opportunity).  
    - If **C**: Flag as **"decaying neglectedness"** (funding may reduce neglect quickly).  
    - If **D**: Keep score (true opportunity).  
  - **Sufficient answer:** "Score=8 initially, but -4 due to past failures (B), so neglect score=4. Not opportunistic."  
  - **Hand off to values if:** Disagreement on *why neglect exists* (e.g., "Is this taboo or just uninteresting?").  

  #### **Step 5: Integration & Decision (25 min)**  
  - **Question:** "Based on scores, is this a **fund**, **fund with reservations**, or **pass**?"  
  - **Decision matrix:**  
    | **Profile**                | **Decision**          | **Example**                                      |  
    |----------------------------|-----------------------|--------------------------------------------------|  
    | High importance + Actionable + Stable neglect | **Fund**              | Bed nets in a low-competition region.            |  
    | High importance + Research bet + Decaying neglect | **Fund w/ reservations** | Embarrassing but solvable health issue.          |  
    | High importance + Research bet + Tried-and-failed neglect | **Pass** or **Fund w/ reservations** | "Solved" physics problem with failed attempts. |  
    | Low tractability/importance | **Pass**              | Vague theory with no path to testing.            |  
  - **Defensible rationale:**  
    - "Fund: High irreversible impact (8/10), actionable (payoff curve 7/10), neglect stable (8/10)."  
    - "Pass: Importance high (9/10), but neglect due to past failures (adjusted score=3), tractability low."  
  - **Hand off to partners if:** Scores are borderline OR values conflict (e.g., "Importance is high but only if you weight future lives heavily").  

  #### **Step 6: Document & Pressure-Test (5 min)**  
  - Draft a 3-sentence rationale:  
    *"We recommend [fund/pass] because [impact] is [score], [tractability] is [type] with [score], and neglect is [score] but [risk]. Reservations: [e.g., neglect decays]."*  
  - **Final check:** "Would this survive scrutiny in a client meeting?"  

  ---

  ### **Testing the Procedure on Your Proposals**  
  #### **Proposal 1: AI Safety Research Bet**  
  - **Step 1 (Problem):** "Reduce tail risk from misaligned AI via theoretical advances." *Success=Framework for scalable oversight.* → **Clear**.  
  - **Step 2 (Importance):** Scale=10 (existential), Irreversibility=10 → **Importance=High**.  
  - **Step 3 (Tractability):** **Research bet** (no intervention yet). Option value=9 (unlocks safety engineering), Barriers=8 (no known path). → **Not concrete action**.  
  - **Step 4 (Neglectedness):** Current effort=8 (few theorists). *But* neglect due to **B (tried and failed):** OpenAI/Anthropic hit walls → Adjusted score=4.  
  - **Step 5 (Integration):** High importance + Research bet + Low-adjusted neglect → **Fund with reservations** (note: "High risk, option-value-only").  
  - **Rationale:** *"Fund w/ reservations: Importance=10/10, but tractability=research bet (barriers=8), neglect=4 (past failures). Defend as high-risk option play."*  

  #### **Proposal 2: Embarrassing but Solvable Cause**  
  - **Step 1 (Problem):** "Reduce disease X in conservative regions via discreet testing." *Success=20% reduction in cases.* → **Clear**.  
  - **Step 2 (Importance):** Scale=7 (regional), Irreversibility=3 (treatable) → **Importance=Moderate**.  
  - **Step 3 (Tractability):** **Concrete action** (testing/treatment). Payoff steepness=8 (each clinic reduces cases 15%), Evidence=6 (pilot data). → **Actionable**.  
  - **Step 4 (Neglectedness):** Current effort=9 (taboo topic). Neglect due to **C (embarrassing)** → Flag as **"decaying neglectedness."**  
  - **Step 5 (Integration):** Moderate importance + Actionable + Decaying neglect → **Fund with reservations** (note: "Neglect may vanish if we fund").  
  - **Rationale:** *"Fund w/ reservations: Importance=7/10, tractability=action (payoff=8), neglect=9 (but decays if public). Monitor for competition."*  

  ---

  ### **Why This Solves Your Failure Modes**  
  1. **Neglectedness:**  
     - Explicitly scores *why* neglect exists (A/B/C/D).  
     - Adjusts for "tried and failed" (B) and flags decaying neglect (C).  
  2. **Importance:**  
     - Uses natural units (scale + irreversibility) without forced conversions.  
     - Separates magnitude from time-sensitivity.  
  3. **Tractability:**  
     - Splits research bets (option value/barriers) from actions (payoff curve/evidence).  
     - Forces honesty: AI safety is a "research bet," not an "action."  

  **Time efficiency:** Strict time boxing ensures completion in 2 hours. Hand-offs to partners minimize gridlock.  
  **Defensibility:** Clear scoring rationale ("We passed because neglect was due to past failures") avoids vibes.  

  **Next steps:** Run your next workshop with this template. Refine questions based on what triggers hand-offs!
