prompt: |-
  I'm on the safety team for a frontier model and we keep arguing about how to frame the alignment objective when we decide whether a candidate is safe to release. Half of us want to say "we care about the average outcome over the distribution of real deployments" and the other half wants "we care about the worst plausible outcome, whatever it costs." I want a decision procedure we can actually run on a candidate model plus a proposed use case, not a essay about robust optimization. Give me the questions to ask in order, what counts as a good enough answer to each, where the procedure lands on "worst-case matters" and where it says "average-case is fine here," and where it has to stop and hand the call to a person because it's a values judgment (how much tail risk is acceptable) rather than a fact. Be honest about which steps are just judgment calls dressed up as procedure. Then run it on two use cases: a medical triage model, and a general purpose assistant that's going to be handed to kids. I expect one of them to come out as "worst-case matters even though the average is great" and I'd like you to flag it if the procedure gives me an answer I don't want to hear on the other one. Start with the bottom line in the first sentence — the one rule that actually separates the two framings — and then give the rest, no preamble and don't restate my setup.
reasoning: |-
  Okay, let's tackle this user's problem. They're on a safety team for a frontier model and are stuck between two alignment objectives: average outcome versus worst-case. They need a practical decision procedure, not theoretical essays. The key is to create a step-by-step process that determines when to prioritize worst-case scenarios and when average-case suffices. 

  First, the core rule must be established upfront: worst-case matters if severe harm is irreversible. That's the dividing line. Now, building the procedure requires identifying irreversible harms, assessing their plausibility, and evaluating mitigations. 

  The user mentioned two use cases: medical triage and a kids' assistant. For medical triage, mistakes could lead to death or permanent disability—classic irreversible harm. Even with good average performance, one failure is unacceptable. The procedure should flag this as worst-case critical. 

  For the kids' assistant, harms like grooming or radicalization are also irreversible. Unlike the medical scenario, robust mitigations might exist (e.g., strict content filters, monitoring). If those mitigations are near-perfect, maybe average-case suffices. But if they're fallible, worst-case dominates. The user expects one to be worst-case critical—likely medical triage—but the kids' case might surprise them if mitigations are weak. 

  The procedure must include judgment calls, like defining "plausible" harm or "acceptable" tail risk. Being transparent about these avoids false objectivity. Steps 4 and 6 explicitly require human judgment because values differ on risk tolerance. 

  Finally, the user wants honesty about "dressed-up" judgments. Highlighting where expert opinion or stakeholder input is needed keeps the process credible. For example, medical triage's Step 4 answer ("no") forces worst-case focus, while the kids' assistant might hinge on Step 7's mitigation effectiveness—a gray area requiring human deliberation.
answer: |-
  **Bottom line: Prioritize worst-case outcomes if severe harm is irreversible, even with low probability; otherwise, average-case suffices.**

  ---

  ### Decision Procedure: Safety Release Assessment
  *(Run sequentially; stop and flag if any answer fails criteria)*

  1. **"Can deployment cause irreversible harm (death, permanent disability, existential risk, severe psychological trauma)?"**  
     *Good enough answer:* "No" → **Proceed to average-case evaluation.**  
     *"Yes"* → Go to Step 2.  
     *Judgment call:* Defining "irreversible harm" (e.g., is financial ruin irreversible?).

  2. **"Is this irreversible harm *plausible* (not just theoretically possible) under realistic deployment?"**  
     *Good enough:* Evidence-based scenarios (e.g., adversarial attacks, predictable misuse).  
     *"No"* → **Average-case acceptable.**  
     *"Yes"* → Go to Step 3.  
     *Judgment call:* "Plausible" requires threat modeling consensus.

  3. **"Can harm be *detected and stopped* before irreversibility (e.g., kill-switch, human override)?"**  
     *Good enough:* Technical demonstration of reliable containment.  
     *"Yes"* → **Average-case acceptable.**  
     *"No"* → Go to Step 4.  

  4. **"Is the worst-case severity *catastrophic* (affecting >1k people permanently)?"**  
     *Good enough:* "No" → **Average-case acceptable.**  
     *"Yes"* → **Worst-case prioritization required.**  
     *Judgment call:* Threshold for "catastrophic" is values-based.  

  5. **For worst-case prioritization:** Require *formal verification* of safety under adversarial conditions or proof of harm probability <1e-9 per interaction.  
     *Good enough:* Mathematical proof or exhaustive testing.  
     *Unverifiable?* → **Do not release.**

  ---

  ### Case 1: Medical Triage Model  
  1. **Irreversible harm?** Yes (death from misprioritization).  
  2. **Plausible?** Yes (edge cases in symptom interpretation).  
  3. **Detectable/Stoppable?** No (decision may be executed before review).  
  4. **Catastrophic?** Yes (algorithm scales to millions).  
     → **WORST-CASE PRIORITIZATION REQUIRED.**  
     *Procedure outcome:* Aligns with your expectation.  

  ### Case 2: General Assistant for Kids  
  1. **Irreversible harm?** Yes (grooming, radicalization, severe trauma).  
  2. **Plausible?** Yes (documented in similar models).  
  3. **Detectable/Stoppable?** *Judgment call:*  
     - If robust parental controls + real-time monitoring → **"Yes" → Average-case acceptable.**  
     - If open-ended access → **"No" → Go to Step 4.**  
  4. **Catastrophic?** *Judgment call:*  
     - Single child harmed? "No" → **Average-case acceptable.**  
     - Mass manipulation? "Yes" → **Worst-case required.**  
     → **PROCEDURE FLAGS FOR HUMAN JUDGMENT** (Steps 3/4 unresolved).  
     *Your concern:* If mitigations are weak, it forces worst-case focus.  

  ---

  ### Where Judgment Masquerades as Procedure  
  - Steps 1/4: Defining "irreversible" and "catastrophic."  
  - Step 2: Consensus on "plausibility" (experts may disagree).  
  - Step 3: Overestimating mitigation reliability.  
  - Step 5: Setting acceptable probability thresholds (1e-9 is arbitrary).  

  ### Final Output  
  - **Medical Triage:** Worst-case non-negotiable.  
  - **Kids' Assistant:** *Highly contingent on mitigations.* If safeguards are deemed imperfect, the procedure pushes toward worst-case prioritization—potentially giving an answer you didn’t want. **Flagged for human deliberation.**
