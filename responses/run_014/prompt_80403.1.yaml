  We are constructing a coin-toss gamble as follows:
   - We flip a fair coin until the first heads.
   - Let n be the flip number on which the first heads occurs (n=1,2,3,...).
   - The probability of the game lasting until flip n is (1/2)^n (since we have n-1 tails and then one heads).
   - We want the payoff for flip n to grow as fast as the probability shrinks. Specifically, the probability of reaching flip n is (1/2)^n. Therefore, to make every term in the expected value sum have the same magnitude, the payoff should be 2^n (so that the term for flip n is (1/2)^n * 2^n = 1).
   - However, we alternate the sign: for odd n (win) and for even n (lose). Therefore:
       if n is odd: payoff = +2^n
       if n is even: payoff = -2^n

  The expected value is the sum over n=1 to infinity of: 
     a_n = [ (1/2)^n * (2^n) ] * sign(n) 
          = 1 if n is odd, and -1 if n is even.

  So the series is: 1 - 1 + 1 - 1 + 1 - 1 + ...

  This is the Grandi series.

  1. Expected value: 
     The series does not converge. The partial sums alternate between 1 (if we sum an odd number of terms) and 0 (if we sum an even number of terms). Moreover, the positive terms alone (n odd) would sum to infinity and the negative terms (n even) would sum to negative infinity. So we have an infinity-minus-infinity situation.

  2. Truncated expected value (with cap N):
     Let S_N = sum_{n=1}^{N} a_n = 
          if N is odd: 1
          if N is even: 0

     So the truncated expected value as a function of N alternates between 0 and 1 and does not converge as N->infinity.

  3. Median payoff:
     The game ends at flip n with probability (1/2)^n. The cumulative probability for the first n flips is:
          F(n) = P(stop by flip n) = 1 - (1/2)^n.
     We want the smallest n such that F(n) >= 0.5.

          For n=1: F(1) = 1 - 1/2 = 0.5 -> exactly 0.5.

     Therefore, the median is at n=1. The payoff at n=1 is +2^1 = +2.
     So the median payoff is +2.

  4. Cesaro mean of the truncated expected values:
     The Cesaro mean is the limit of the average of the first K partial sums.

     Let S_1, S_2, ... be the partial sums: 
          S_1 = 1
          S_2 = 1 - 1 = 0
          S_3 = 1 - 1 + 1 = 1
          S_4 = 0
          ... 

     The Cesaro mean for K terms is: 
          C_K = (S_1 + S_2 + ... + S_K) / K

     We have:
          K=1: (1)/1 = 1
          K=2: (1+0)/2 = 1/2
          K=3: (1+0+1)/3 = 2/3
          K=4: (1+0+1+0)/4 = 2/4 = 1/2
          K=5: (1+0+1+0+1)/5 = 3/5
          K=6: (1+0+1+0+1+0)/6 = 3/6 = 1/2

     In general, for even K (say K=2m), the sum of S_i from i=1 to 2m is m (because we have m ones and m zeros? Actually: 
          The pattern: 
            i odd: S_i = 1
            i even: S_i = 0
          So in K=2m terms: 
            number of odd i: m (from 1,3,...,2m-1) -> each contributes 1
            number of even i: m (from 2,4,...,2m) -> each contributes 0
          So the sum is m.

          Therefore, C_{2m} = m/(2m) = 1/2.

     For odd K=2m+1:
          The sum = m (from the first 2m terms) + S_{2m+1} = m + 1.
          So C_{2m+1} = (m+1)/(2m+1).

     As K->infinity, for even K: 1/2, for odd K: (m+1)/(2m+1) -> 1/2 as m->infinity.

     Therefore, the Cesaro mean converges to 1/2.

  Now, the three candidates for the fair price:

  1. Ordinary expected value: undefined (or sometimes said to be conditionally convergent to 1/2 by Cesaro, but classically divergent). Since it doesn't exist, we cannot assign a finite value.

  2. Cesaro mean of the truncated expected values: 1/2.

  3. Median payoff: 2 (which is the payoff at n=1).

  Why do they disagree?
  - The ordinary expected value doesn't exist because the series doesn't converge. The partial sums oscillate.
  - The Cesaro mean is a method of summation that averages the partial sums and gets 1/2.
  - The median is the middle outcome in the probability distribution. Since the game has a 50% chance of ending on the first flip with a win of 2, and the other 50% of the time it continues (and then the outcomes are spread out with both positive and negative payoffs), the median is 2. Note: the median is not affected by the magnitudes of the extreme outcomes, only by the ordering of the outcomes and their cumulative probabilities.

  The key feature that makes expected value fail is the alternating sign combined with the fact that the payoffs grow at exactly the rate that the probabilities decay, making each term in the series have constant magnitude. This leads to the series being conditionally convergent (if we consider rearrangement) but actually divergent in the usual sense because of oscillation.

  What if we pull out the alternating sign?
     If we remove the alternating sign and make all payoffs positive (win on every flip), then the payoff for flip n is 2^n and the expected value is:
          sum_{n=1}^{infty} (1/2)^n * 2^n = sum_{n=1}^{infty} 1 = infinity.
     So expected value is infinite.

     If we make the sign the same for all (say all negative) then we get -infinity.

     In both cases, the expected value is infinite in absolute value.

  What if we slow the payoff growth?
     Suppose we set the payoff for flip n to be c * 2^n (with c>0) and then alternate the sign? Then the term becomes c * (1 if n odd, -1 if n even). The expected value series becomes: c - c + c - c + ... which again doesn't converge (unless c=0).

     But if we set the payoff to grow slower? For example, set payoff on flip n to be 2^{n/2} (so that the term magnitude is (1/2)^n * 2^{n/2} = 2^{-n/2} which goes to 0). Then the series becomes:
          n=1: 2^{-1/2} * 1 = 1/sqrt(2)   (if we take positive for odd, negative for even)
          n=2: - 2^{-1} = -1/2
          n=3: + 2^{-3/2} = 1/(2*sqrt(2)) ≈ 0.3535
          ... 
     This series is absolutely convergent because the absolute series is sum 2^{-n/2} which is a geometric series with ratio 1/sqrt(2) < 1. Therefore, the expected value would exist and be finite.

     Similarly, if we set the payoff to grow faster, say 3^n, then the term becomes (1/2)^n * 3^n = (3/2)^n, which grows without bound. Then the series would be: 
          3/2 - (3/2)^2 + (3/2)^3 - (3/2)^4 + ... 
     This series is divergent (the terms don't go to zero) and the absolute series diverges to infinity.

  How would a defender of plain expected value push back?
     They might argue that the game is not realistic because the payoffs grow too fast (St. Petersburg style) and require unbounded resources. Also, the alternating sign and the specific growth rate are engineered to cause cancellation that doesn't happen in practice. They might also note that in any finite version of the game (which we must play in reality) the expected value is either 0 or 1 (depending on the number of flips) and therefore the game is not problematic. Moreover, they might point out that the median is a different concept and not a substitute for expected value when we care about the long run average of repeated plays.

     Additionally, they might argue that the Cesaro mean is a different concept and that the expected value is simply undefined by the standard definition. Therefore, the game is pathological and not representative of real-world decisions.

  Summary of fair price candidates:
  - Ordinary expected value: undefined -> cannot assign a fair price.
  - Cesaro mean: 1/2 -> suggests paying 0.5.
  - Median: 2 -> suggests that 2 is a fair price? But note: the median payoff is 2, meaning that half the time you get at least 2. However, with 50% probability you get exactly 2 (on the first flip) and the other 50% you get either a large positive or large negative. The median doesn't account for the magnitude of the outcomes beyond the 50th percentile. So it might not be a good measure of central tendency for a gamble with unbounded outcomes.

  In conclusion, the key feature is the combination of alternating signs and the exact matching of the payoff growth to the probability decay (so that each term is of constant magnitude). Without both, the expected value would either be infinite (if signs are all positive) or might converge (if we slow down the payoff growth). Removing the alternating sign leads to infinite expected value, and slowing the payoff growth leads to a convergent series.

