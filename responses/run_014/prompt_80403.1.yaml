answer: |-
  ### The Coin-Tossing Gamble: A Divergent Expectation

  **Game Setup:**  
  A fair coin is tossed until the first heads appears on flip \(n\). The payoff \(P(n)\) is defined as:  
  \[
  P(n) = 
  \begin{cases} 
  +2^n & \text{if } n \text{ is odd (win)}, \\
  -2^n & \text{if } n \text{ is even (lose)}.
  \end{cases}
  \]  
  The probability of first heads on flip \(n\) is \(\left(\frac{1}{2}\right)^n\) (i.e., \(n-1\) tails followed by heads). The expected value (EV) is the sum:  
  \[
  \text{EV} = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot P(n) = \sum_{n=1}^{\infty} a_n, \quad \text{where } a_n = 
  \begin{cases} 
  +1 & n \text{ odd}, \\
  -1 & n \text{ even}.
  \end{cases}
  \]  
  This simplifies to the series: \(1 - 1 + 1 - 1 + 1 - 1 + \cdots\) (the **Grandi series**).

  ---

  ### Arithmetic Checks

  1. **Expected Value is Undefined (not infinite):**  
     - The positive terms (\(n\) odd) sum to \(+\infty\).  
     - The negative terms (\(n\) even) sum to \(-\infty\).  
     - The series oscillates indefinitely: partial sums \(S_N = \sum_{n=1}^N a_n\) are \(1\) if \(N\) odd, \(0\) if \(N\) even.  
     - Result: \(\infty - \infty\) indeterminacy. **EV is undefined**, not infinite.

  2. **Truncated EV (cap at \(N\)) and Convergence:**  
     \[
     S_N = 
     \begin{cases} 
     1 & \text{if } N \text{ odd}, \\
     0 & \text{if } N \text{ even}.
     \end{cases}
     \]  
     - As \(N \to \infty\), \(S_N\) **does not converge** (oscillates between 0 and 1).

  3. **Median Payoff:**  
     - Cumulative probability of stopping by flip \(n\): \(F(n) = 1 - \left(\frac{1}{2}\right)^n\).  
     - Solve \(F(n) \geq 0.5\):  
       - \(n=1\): \(F(1) = 1 - 0.5 = 0.5\).  
     - The median occurs at \(n=1\), with payoff \(P(1) = +2^1 = +2\).  
     - **Median payoff is +2**.

  4. **Cesaro Mean of Truncated EVs:**  
     - Partial sums \(S_1, S_2, S_3, \ldots = 1, 0, 1, 0, 1, 0, \ldots\)  
     - Cesaro mean \(C_K = \frac{1}{K} \sum_{i=1}^K S_i\):  
       - \(K=1\): \(1/1 = 1\)  
       - \(K=2\): \((1+0)/2 = 0.5\)  
       - \(K=3\): \((1+0+1)/3 \approx 0.666\)  
       - \(K=4\): \((1+0+1+0)/4 = 0.5\)  
       - For even \(K=2m\), \(C_{2m} = \frac{m}{2m} = 0.5\).  
       - For odd \(K=2m+1\), \(C_{2m+1} = \frac{m+1}{2m+1} \to 0.5\) as \(m \to \infty\).  
     - **Cesaro mean converges to 0.5**.

  ---

  ### Fair Price Candidates

  | **Method**             | **Fair Price** | **Reason**                                                                 |
  |------------------------|----------------|----------------------------------------------------------------------------|
  | Ordinary EV            | Undefined      | Series oscillates; \(\infty - \infty\) indeterminacy.                     |
  | Cesaro mean of EVs     | 0.5            | Averages partial EVs to 0.5. Stabilizes divergent series.                 |
  | Median payoff          | 2              | 50% chance of +2 (first flip), but ignores extreme tails.                 |

  **Why They Disagree:**  
  - **Ordinary EV** fails due to pathological divergence.  
  - **Cesaro mean** "tames" oscillations via averaging.  
  - **Median** ignores magnitude of losses/wins beyond the 50th percentile (e.g., 25% chance of -4, 12.5% chance of +8, etc.).  

  ---

  ### Key Construction Feature and Sensitivity

  **The Critical Feature:**  
  The **combination** of:  
  1. Alternating signs (win/loss by flip parity),  
  2. Payoff growth \(\propto 2^n\) (exactly matching probability decay \(\propto 1/2^n\)).  

  **What Happens If You Remove It?**  
  1. **No alternating signs (all wins):**  
     - Payoff \(= +2^n\) → EV \(= \sum_{n=1}^{\infty} 1 = +\infty\).  
     - EV becomes unambiguously infinite.  

  2. **Slower payoff growth (e.g., \(P(n) = +2^{n/2}\) for all \(n\)):**  
     - Terms \(a_n = (1/2)^n \cdot 2^{n/2} = 2^{-n/2}\), a convergent geometric series.  
     - EV \(= \sum 2^{-n/2} \approx 1.707\) (finite).  

  ---

  ### Pushback from EV Maximizers

  A defender of expected value might argue:  
  1. **"The game is unrealistic":**  
     - Payoffs grow astronomically (e.g., \(n=10\): ±1024; \(n=20\): ±1,048,576). No real agent can offer/cover this.  
  2. **"Pathological cases don’t refute practical EV":**  
     - In real-world gambles, terms diminish (\(|a_n| \to 0\)), ensuring convergence.  
  3. **"EV is the only consistent guide for repeated play":**  
     - Median and Cesaro mean lack EV’s axiomatic foundations for long-run profitability.  

  **Conclusion:**  
  This game exploits a razor’s-edge edge case (alternating signs + balanced growth) to break EV. While a useful paradox, it doesn’t invalidate EV for most real decisions—where payoffs are bounded or probabilities decay faster than payoffs grow.
