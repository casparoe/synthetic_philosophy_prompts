  But note: the median is 2, which is different. The median is not intended to be a measure of the average outcome but of the typical outcome in the sense of the middle of the distribution. In this case, half the time you get 2 (which is above 1/2) and half the time you get something else (which averages to -1/2? because the entire average is 1/2, so the other half must average to 1/2 - (1/2)*2 = 1/2 - 1 = -1/2). 

