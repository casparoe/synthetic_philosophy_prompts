  We are drafting a collaborative document for two philosophers: a gap theorist (paracomplete, strongly Kleene) and a glut theorist (paraconsistent, dialetheic). Both agree on the transparency of truth and reject classical restrictions like Tarski's hierarchy. The document has three main parts: agreed claims, disagreements, and cruxes with test cases. We must mark what is settled vs. contested and avoid biased wording.

  Let's structure the document accordingly.

  **Document Draft**

  # Adversarial Collaboration on the Liar Paradox and Truth

  **Signed by:**  
  [Gap Theorist] and [Glut Theorist]  
  Date: [Date]

  ## 1. Agreed Claims

  We, the gap theorist and the glut theorist, agree on the following:

  1.1. **The Semantic Paradoxes Demonstrate:**  
     a. *Tarski's Undefinability Theorem*: It is a settled mathematical fact that no consistent classical language can contain its own truth predicate (Tarski, 1936).  
     b. *Inconsistency of Naive Truth Principles with Classical Logic*: The naive truth principles (transparency and unrestricted capture/release) are inconsistent with classical logic (as shown by the Liar paradox and others). This is a mathematical result.

  1.2. **What We Owe to the Classical Logician:**  
     We acknowledge that classical logic is remarkably successful in paradox-free domains (e.g., mathematics, empirical sciences). Any non-classical theory of truth must explain why classical reasoning is so dependable in these contexts.

  1.3. **Criteria for a Successful Theory:**  
     We agree that an adequate theory of truth must satisfy:  
     - *Transparency*: The truth predicate is fully intersubstitutable with the object language (i.e., \( T(\ulcorner \phi \urcorner) \) is equivalent to \( \phi \), in the appropriate sense for the logic).  
     - *Compositionality*: The truth conditions of complex sentences are determined by the truth conditions of their parts.  
     - *Non-Triviality*: The theory must not entail everything (i.e., avoid triviality).  
     - *Classical Recapture*: The theory must explain why classical reasoning (e.g., excluded middle, non-contradiction, explosion) is reliable and can be used without risk in domains free of semantic pathology.

  ## 2. Disagreements Table

  We disagree on the following points. Each point is stated in a way that the named party accepts.

  | Issue | Gap Theorist's View | Glut Theorist's View |
  |-------|----------------------|----------------------|
  | **The Status of the Liar Sentence** | The Liar sentence ("This sentence is not true") lacks a truth value: it is neither true nor false. This is because it is ungrounded in the Kripkean fixed-point construction and hence falls into a truth-value gap. | The Liar sentence ("This sentence is not true") has too many truth values: it is both true and false. This is because it is a dialetheia, a true contradiction, which arises in the fixed-point construction (e.g., in the LP model) as a truth-value glut. |
  | **Underlying Logic** | The correct logic is paracomplete (strongly Kleene) and rejects the law of excluded middle for pathological sentences. This logic has a third value (e.g., undefined) and uses the strong Kleene tables. | The correct logic is paraconsistent (LP, Priest's logic of paradox) and rejects the principle of explosion (ex falso quodlibet) for pathological sentences. This logic has a third value (e.g., both) and uses the LP tables. |
  | **Treatment of Pathological Sentences** | Pathological sentences (like the Liar) are neither true nor false. They are exceptions to the law of excluded middle and require a restriction on classical reasoning only when involved. | Pathological sentences (like the Liar) are true contradictions (dialetheias). They are exceptions to the law of non-contradiction and require a restriction on classical reasoning (specifically, explosion) only when involved. |

  ## 3. Cruxes: Test Cases and Predictions

  We now turn to key test cases. For each, we state the test, each side's prediction, and what the outcome would show.

  ### 3.1. Revenge Problem

  - **Test Case**: Consider a revenge sentence: "This sentence is not true (in the sense of being neither true nor false)" — call it R. For the gap theorist, R attempts to express a gap (if true, it would be gappy, but if gappy, then it is true, leading to contradiction). For the glut theorist, a similar revenge sentence can be constructed: "This sentence is not true (in the sense of being only true, i.e., not having a glut)" — but note that the glut theorist might interpret revenge differently.

  - **Gap Theorist's Prediction**: The gap theorist holds that their theory can handle such revenge sentences by either: (a) showing that R itself is gappy (so it doesn't express a gap in a way that leads to contradiction) or (b) by introducing a hierarchy of determinacy operators to stratify the truth predicate without collapsing into Tarski's hierarchy. (Note: This is contested among specialists.)

  - **Glut Theorist's Prediction**: The glut theorist holds that revenge is not a problem for glut theories because they can accept that R is both true and false (a dialetheia). Thus, they can consistently assert that R is not true (in the sense of being only true) and also accept that it is true (in the sense of being at least true). (Note: This is contested among specialists.)

  - **Crux**: The issue is whether revenge sentences force either theory into a hierarchy (which both reject) or triviality. The gap theorist must avoid the revenge sentence R being both gappy and not gappy, while the glut theorist must avoid R being both true and not true in a way that collapses into triviality.

  ### 3.2. Curry's Paradox

  - **Test Case**: Consider the Curry sentence: "If this sentence is true, then the butler did it." Let C be such a sentence.

  - **Gap Theorist's Treatment**: The gap theorist uses a paracomplete conditional (e.g., from strong Kleene) that does not validate contraction or modus ponens in all cases. They hold that C is gappy (neither true nor false) and thus does not entail that the butler did it. The conditional is material or defined in a way that avoids the paradox.

  - **Glut Theorist's Treatment**: The glut theorist uses a paraconsistent conditional (e.g., from LP) that avoids explosion. They hold that C is both true and false, but they reject the inference from C and the truth of C to the conclusion that the butler did it because modus ponens may fail for the conditional in the presence of gluts. Alternatively, they might use a different conditional (e.g., a relevant conditional) to block the paradox.

  - **Crux**: The issue is which treatment of the conditional does more damage to our ordinary reasoning. The gap theorist must explain why we can trust conditionals in ordinary contexts, and the glut theorist must explain why modus ponens fails only in pathological cases.

  ### 3.3. Classical Recapture

  - **Test Case**: Ordinary mathematics and paradox-free discourse.

  - **Gap Theorist's Explanation**: In paradox-free contexts, the law of excluded middle holds because there are no gaps. Thus, classical reasoning is recaptured by restricting excluded middle to grounded sentences. The gap theorist may use a determinacy operator to mark safe sentences.

  - **Glut Theorist's Explanation**: In paradox-free contexts, there are no gluts, so the principle of explosion holds and disjunctive syllogism is safe. The glut theorist may use a consistency operator to mark safe sentences.

  - **Crux**: The gap theorist must explain why excluded middle was so reliable in mathematics (by showing that mathematical sentences are never gappy). The glut theorist must explain why we may trust disjunctive syllogism and reductio in mathematics (by showing that mathematical sentences are never glutty).

  ### 3.4. Iterating "Determinately" or "Is True"

  - **Test Case**: Consider a hierarchy of operators: D0 (truth), D1 (determinately true), D2 (determinately determinately true), etc., applied to the Liar.

  - **Gap Theorist's View**: The gap theorist may use a determinacy operator to regain classical logic for some sentences. However, they must avoid an infinite hierarchy that collapses into Tarski's. They hold that such an operator can be added without creating a revenge problem (though this is contested).

  - **Glut Theorist's View**: The glut theorist may use a consistency operator (or a "just true" operator) to regain classical logic for consistent sentences. They hold that such an operator can be added without creating a hierarchy (though this is contested).

  - **Crux**: The issue is whether iterating such operators forces either theory into the very hierarchy they rejected. Both sides must show that their operators do not lead to a Tarskian hierarchy.

  ## 4. Joint Closing Statement: What is Verbal and What is Substantive

  We jointly concede that some aspects of our dispute may be verbal:

  - **Verbal Aspects**: Both theories are built on fixed-point constructions (Kripke for gaps; Kripke for gluts with a different evaluation scheme). The difference in calling the Liar "gappy" (neither) versus "glutty" (both) might be seen as a relabeling of the same mathematical structure (the fixed point). In this sense, the underlying model is the same, and the difference is in how we interpret the third value.

  However, we maintain that there are substantive differences:

  - **Substantive Aspects**:
    a. *The Nature of the Conditional*: The gap theorist's conditional (strong Kleene) and the glut theorist's conditional (LP or relevant) are fundamentally different and have different logical properties. This affects how we handle Curry's paradox and everyday conditionals.
    b. *The Possibility of True Contradictions*: The glut theorist's acceptance of true contradictions (dialetheias) is a substantive metaphysical and logical claim that the gap theorist rejects. The gap theorist holds that no sentence can be both true and false, while the glut theorist holds that some can.
    c. *Revenge and Hierarchy*: The two theories may differ in their ability to handle revenge without collapsing into a hierarchy. This is a substantive technical challenge for both.
    d. *Classical Recapture*: The mechanisms for recapturing classical logic (determinacy vs. consistency operators) are different and may have different consequences for the expressiveness of the language.

  We sign this document as a record of our agreements, disagreements, and the tests that might resolve them.

  ---
  **Notes for the Draft:**
  - We have marked as settled: Tarski's theorem, the inconsistency of naive truth with classical logic, and the fixed-point constructions (as mathematical models).
  - We have marked as contested: the treatment of revenge, the coherence of dialetheism, the viability of non-classical conditionals, and the success of classical recapture mechanisms.
  - We have used neutral language: "gappy" for the gap theorist and "glutty" for the glut theorist, and each view is stated in their own terms.
  - We have avoided presenting any contested interpretive view as the consensus of the field.
answer: |-
  ### Joint Document on Truth and Paradox: Adversarial Collaboration  
  **Signed by the Gap Theorist and the Glut Theorist**  
  Date: [Date]  

  ---

  ### 1. Agreed Claims  
  We jointly affirm the following settled results and shared commitments:  

  1.1 **Demonstrable Lessons from the Paradoxes**  
  - **(a) Tarski’s Undefinability Theorem (Settled Mathematics)**: For any sufficiently expressive classical language, no consistent truth predicate can satisfy *transparency* (intersubstitutability of \( \ulcorner \phi \urcorner \) and \( T(\ulcorner \phi \urcorner) \)) while validating all classical inferences.  
  - **(b) Inconsistency of Naive Truth (Settled Mathematics)**: Naive truth principles (transparency plus full classical logic) are provably inconsistent. This is shown constructively via the Liar Paradox ("This sentence is not true") and similar self-referential sentences.  

  1.2 **Debt to Classical Logic**  
  - Classical logic is maximally reliable for "grounded" sentences (e.g., arithmetic, empirical statements) that avoid semantic pathology. Both theories must explain why classical reasoning (e.g., disjunctive syllogism, excluded middle) succeeds in these domains.  

  1.3 **Criteria for Success**  
  A viable theory must satisfy:  
  - **Transparency**: Truth is fully intersubstitutable salva veritate.  
  - **Compositionality**: Truth values for complex sentences are determined by their components.  
  - **Non-Triviality**: The theory avoids entailing all sentences (trivialism).  
  - **Classical Recapture**: The theory explains why classical logic is trustworthy for paradox-free discourse.  

  ---

  ### 2. Disagreements Table  
  We disagree on the following, phrased in mutually acceptable terms:  

  | Issue | Gap Theorist’s View | Glut Theorist’s View |
  |-------|----------------------|----------------------|
  | **Status of the Liar Sentence** | "The Liar sentence lacks a truth value: it is neither true nor false. It occupies a semantic gap, escaping classical bivalence." | "The Liar sentence has too many truth values: it is both true and false. Its semantic glut reflects a true contradiction." |
  | **Underlying Logic** | "Logic must be paracomplete (strongly Kleene). Excluded middle fails for gappy sentences, blocking explosion via truth-value gaps." | "Logic must be paraconsistent (e.g., Priest’s LP). Explosion fails for glutty sentences, tolerating contradictions without triviality." |
  | **Nature of Pathology** | "Pathological sentences are incomplete: they violate no classical law but are non-classical due to unsupported presuppositions." | "Pathological sentences are overdetermined: they violate the law of non-contradiction locally but are rationally manageable." |
  | **Fixed-Point Interpretation** | "Kripke’s fixed-point construction shows gaps are inevitable for ungrounded sentences; negation leaves them unsettled." | "Kripke’s construction, under a dialetheic interpretation, shows gluts are inevitable; negation maps gluts to themselves." |

  ---

  ### 3. Cruxes: Test Cases and Predictions  
  For each crux, we specify a shared test and record predictions.  

  #### 3.1 Revenge Problem  
  - **Test Case**: The sentence \( R \): “This sentence is not true and is not gappy” (for gap) or “This sentence is not true and not glutty” (for glut).  
  - **Gap Theorist Prediction**: \( R \) is gappy. The predicate “is gappy” cannot be fully transparent without introducing hierarchy, but gaps are closed under definable operators without collapse. *(Contested: Whether this avoids revenge indefinitely.)*  
  - **Glut Theorist Prediction**: \( R \) is glutty. “Not glutty” is itself susceptible to gluts under transparency; no hierarchy is needed as contradictions are contained. *(Contested: Whether this resolves revenge without triviality.)*  
  - **Crux**: Whether \( R \) forces either theory into Tarski-style hierarchy or triviality.  

  #### 3.2 Curry’s Paradox  
  - **Test Case**: The sentence \( C \): “If this sentence is true, then \( \bot \)” (where \( \bot \) is absurdity, e.g., “the butler did it”).  
  - **Gap Theorist Treatment**: \( C \) is gappy. The strongly Kleene conditional (\( \rightarrow \)) avoids contraction and renders \( C \) non-true, blocking the inference to \( \bot \).  
  - **Glut Theorist Treatment**: \( C \) is glutty. The paraconsistent conditional (e.g., LP) fails modus ponens for gluts, preventing inference to \( \bot \).  
  - **Crux**: Which conditional does more damage?  
    - Gap: “The glut theorist’s conditional is too weak for ordinary reasoning (e.g., counterfactuals).”  
    - Glut: “The gap theorist’s conditional is non-compositional and invalidates useful inference rules.”  

  #### 3.3 Classical Recapture  
  - **Test Case**: Trust in classical mathematics (e.g., a proof by reductio in number theory).  
  - **Gap Theorist Explanation**: Ungrounded sentences are rare outside semantics; excluded middle holds for grounded sentences, justifying classical recapture.  
  - **Glut Theorist Explanation**: Consistent sentences (non-glutty) obey classical logic; disjunctive syllogism is safe when no gluts are present.  
  - **Crux**:  
    - Gap: “The glut theorist cannot explain trust in reductio, as gluts mimic inconsistencies.”  
    - Glut: “The gap theorist cannot justify excluded middle in mathematics, as gaps might unknowably lurk.”  

  #### 3.4 Iterating “Determinately” or “True”  
  - **Test Case**: The sequence \( D_0 \): “This sentence is not true,” \( D_1 \): “\( D_0 \) is not determinately true,” etc.  
  - **Gap Theorist View**: “Determinately” (\( \Delta \)) operators stratify without hierarchy, but \( \Delta \) applied to the Liar remains gappy. *(Contested: Whether this iteration is well-behaved.)*  
  - **Glut Theorist View**: “True” iterates safely; the Liar’s glut persists at all levels, avoiding hierarchy. *(Contested: Whether gluts undermine the utility of iterated truth.)*  
  - **Crux**: Whether iterating truth predicates forces a hierarchy both reject.  

  ---

  ### 4. Closing: Verbal and Substantive Disagreements  
  We jointly concede:  
  - **Verbal Aspects**: Our theories describe the *same fixed-point structure* (e.g., Kripke’s construction) with divergent interpretations of the third value:  
    - “Gap” (neither) vs. “glut” (both) is partly terminological.  
    - Both models use a third value to block explosion while preserving transparency.  

  We maintain **substantive disagreements**:  
  - **Metaphysical**: Whether truth-value gaps (absence of truth) or gluts (excess of truth) better explain pathology.  
  - **Logical**: Whether paracompleteness (rejecting excluded middle) or paraconsistency (rejecting explosion) is more fundamental.  
  - **Conditionals**: The choice between Kleene’s non-classical conditional and LP’s paraconsistent conditional has irreducible practical consequences for reasoning.  
  - **Revenge**: Whether gaps or gluts offer a more stable solution to revenge, which remains contested among specialists.  

  ---  
  **Signed,**  
  [Gap Theorist]  
  [Glut Theorist]  

  ---  
  ### Notes on Status  
  - **Settled**: Tarski’s theorem; inconsistency of naive truth; existence of fixed-point models (Kripke).  
  - **Contested Among Specialists**: Coherence of dialetheism; solvability of revenge; feasibility of non-classical conditionals; safety of classical recapture.  
  - **Neutral Wording**: Each party’s view is stated in their own accepted terms (e.g., “gappy” vs. “glutty”). No external consensus implied.
