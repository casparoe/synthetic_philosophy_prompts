prompt: |-
  I coach a high-school debate team and spend some weekends volunteering for a local community fundraiser, and I keep running into the same awkward pattern without having good language for it. In class last term I told my students outright that statistics about food waste were not sticking, so for the next week I was going to use vivid, upsetting stories and a lot of repetition to make them care more, and then I did exactly that. On the fundraising drive, a fellow volunteer opens doors by saying something like, I am going to keep checking in and sending you photos of the team until it feels uncomfortable to say no, because that pressure tends to work, and then she follows through. In both cases nobody is tricked about the method — the method is announced in advance and the target could walk away — yet the method still seems to work more through feeling, repetition, and social discomfort than through giving good reasons.

  Is there an established concept for this specific configuration of openly announced but still non-argumentative influence, and how should it be placed relative to hidden trickery on one side and straightforward reason-giving on the other? I am not looking for just a label; I want to understand what exactly the phenomenon is, what it is not, and where its edges lie, including whether advance disclosure or the chance to opt out changes its status and whether the two cases above belong together or come apart.

  Please organize your reply in exactly these four sections in this order: 1. Direct Answer, around 100 words, stating whether there is an established term for my pattern and, if not, saying so plainly; 2. Closest Existing Ideas, around 250 words, explaining the two or three nearest concepts in ordinary language and how each differs from what I described; 3. Mapping My Cases, around 250 words, analyzing whether the classroom and fundraising examples count as the same thing and which side of the relevant boundaries they fall on; 4. Naming Proposal and Edge Cases, around 200 words, coining and defining a term if none fits and testing it against two boundary cases where disclosure is present but pressure is much weaker or much stronger.
reasoning: |-
  Okay, the user coaches a debate team and volunteers at fundraisers, noticing a recurring pattern. They describe situations where they openly announce a persuasive tactic upfront—like using emotional stories to make statistics stick or admitting they'll apply social pressure for donations—and then follow through. The targets know what's happening but still feel influenced more by emotion and discomfort than by rational arguments. The user wants to know if there's a term for this "openly announced but non-argumentative influence" and how to understand its boundaries compared to manipulation or reason-based persuasion. 

  Hmm, this is interesting. The user isn't just asking for a label; they want a deep conceptual breakdown. They mentioned debate coaching, which suggests they value logical reasoning, yet they're observing that non-rational tactics work even when transparent. There's probably some discomfort here—maybe they feel conflicted about using these methods despite their effectiveness. Their request for edge cases also hints they're ethically conscious and want to avoid crossing into manipulation.

  First, I need to recall if any existing psychological or rhetorical concepts fit perfectly. Things like social proof, foot-in-the-door, or nudging come to mind, but none match all criteria—especially the upfront disclosure part. Nudging is often subtle, while foot-in-the-door relies on incremental compliance without transparency. The user's cases involve explicit warnings, which is rare. 

  For the closest ideas: 
  - **Transparent Persuasion**: But it's too broad; it includes rational arguments. 
  - **Priming**: Involves subtle cues, not overt announcements. 
  - **Accountability Pressure**: Closer but focuses on responsibility, not emotional discomfort.  
  None fully capture the combo of advance disclosure + affective pressure. 

  The classroom and fundraiser examples do seem unified: both declare intent to use non-rational pressure (emotional stories/social discomfort) and rely on the target's passive compliance ("could walk away" but rarely do). The key is the *announced bypassing of deliberation*. 

  Since no term fits, I'll propose **"Declarative Affective Priming"**—defined as openly stating an intent to use non-rational influence (affective/social) and executing it, exploiting the gap between knowing and reacting. Testing edges: 
  - Weak pressure (e.g., "I'll send one reminder") might not trigger discomfort. 
  - Strong pressure (e.g., public shaming) could feel coercive despite disclosure.  

  The user's ethical unease makes sense. Even transparent, this tactic leverages human irrationality—which might clash with their identity as a debate coach. But it's not manipulation since it's consensual (opt-out exists). I'll position it as a gray zone between persuasion and coercion, distinct from hidden tricks or pure reason.
answer: |-
  ### 1. Direct Answer  
  There is no single established term for the specific configuration you describe—openly announced, affect-driven influence that bypasses rational deliberation while allowing opt-out. Existing concepts like "nudging" or "social pressure" capture parts but not the full dynamic of *advance disclosure* coupled with *non-rational pressure*. Your pattern is distinct: it declares its method upfront, relies on emotional or social discomfort rather than argument, and exploits the psychological gap between knowing a tactic is being used and still being vulnerable to it. This is not hidden manipulation (e.g., dark patterns) nor pure persuasion (e.g., logical debate), but a transparent appeal to heuristic processing.

  ### 2. Closest Existing Ideas  
  - **Transparent Persuasion**: This describes overt attempts to change minds (e.g., "I’ll try to convince you with data"). Unlike your cases, it centers on *reasoned engagement*. Your methods bypass reason—using stories/guilt despite disclosure—making them more about *activation* than persuasion.  
  - **Priming**: Exposing someone to stimuli (e.g., words, images) to influence subsequent behavior unconsciously. But priming is typically *covert*; your advance announcement explicitly directs attention to the tactic, which should neutralize priming yet doesn’t. Your cases leverage *conscious but visceral* reactions (discomfort, empathy), not subconscious cues.  
  - **Accountability Pressure**: Publicly committing to a goal to increase follow-through (e.g., declaring weight-loss plans). This shares your social-discomfort element but differs in agency: accountability is *self-imposed*, while your fundraiser volunteer *imposes* pressure externally. Your classroom case also lacks the mutual commitment of accountability, instead using repetition to induce empathy fatigue.  

  Crucially, no existing concept fully captures the paradox of *declared irrationality*: announcing, "I will use System 1 (emotional/heuristic) tactics," yet succeeding because System 1 still responds even when forewarned.

  ### 3. Mapping My Cases  
  **Classroom Case**: You openly stated intent to use vivid stories/repetition to bypass rational apathy. This exploits the *affective gap*—students intellectually understand food waste but lack emotional engagement. Repetition induces cognitive availability (making the issue feel urgent) and empathy via stories. Despite disclosure, students couldn’t "unfeel" the discomfort, aligning with your pattern.  

  **Fundraiser Case**: The volunteer declares intent to apply social pressure until refusal feels awkward. This leverages the *norm of reciprocity* (persistent outreach creates a debt-like feeling) and *anticipatory shame* (knowing photos will confront you). Opt-out exists, but social friction raises the cost of refusal.  

  **Are they the same?** Yes, in structure:  
  - **Core mechanism**: Announced use of non-rational levers (emotion/social discomfort).  
  - **Target response**: Compliance driven by affective arousal, not reasoned agreement.  
  - **Boundary adherence**: Both avoid coercion; opting out is physically possible but psychologically costly.  
  They differ only in *pressure source*: your case uses internalized emotion (guilt/empathy), the fundraiser uses interpersonal dynamics (social obligation). Both exploit heuristic processing despite transparency.

  ### 4. Naming Proposal and Edge Cases  
  **Proposed Term**: **Declarative Affective Priming (DAP)**  
  **Definition**: *Openly stating an intent to use non-rational influence tactics (emotional, social, or repetitive) to elicit heuristic compliance, where advance disclosure fails to neutralize the effect due to the target’s affective or automatic response, and opt-out remains possible but psychologically costly.*  

  **Edge Cases**:  
  - **Weaker Pressure**: A fundraiser says, "I’ll send one polite reminder—no pressure!" and does. Disclosure is present, but minimal pressure (no discomfort escalation) makes refusal easy. **Verdict**: Not DAP. The tactic is rational (reminder=reasoned nudge) and lacks the "bypass deliberation" element.  
  - **Stronger Pressure**: A boss announces, "I’ll praise your work publicly daily until you mentor James—it’ll be awkward if you refuse." Targets face reputational harm. **Verdict**: DAP structurally (declared social pressure), but edges into coercion if refusal risks career damage. Opt-out exists technically, but the cost is prohibitive—blurring into manipulation. DAP requires *meaningful* (not just nominal) opt-out, so high-stakes power imbalances invalidate it.  

  **Key Boundaries**:  
  - DAP requires disclosure *and* reliance on non-rational levers.  
  - It collapses if opt-out is prohibitively costly (coercion) or if pressure is too weak to trigger heuristic compliance (mere reminders).  
  - Your cases sit firmly within DAP: disclosure is explicit, pressure is moderate (discomfort ≠ harm), and affect overrides reason despite transparency.
