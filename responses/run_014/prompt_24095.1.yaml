      *   Tercet 5: States the conclusion explicitly ("A linear form..."), uses both refrains to emphasize their combined force leading to fixed weights.
  *   **Volta (Turn):** The penultimate new line (before the closing couplet) delivers the specific nuance: "*The weights take shape – fixed multipliers...*" highlights the theorem pins down the *form* (fixed weights for each individual) but not the *values*. This sets up...
  *   **Closing Quatrain:** Combines both refrains with the new couplet explicitly stating the separate impartiality step ("*Equal weights...*") as the crucial ethical addition beyond the theorem's logical constraints.
  *   **Accuracy:** Uses terms like "utils," "social function," "linear form," "weighted sum," "fixed constants/multipliers." Clearly distinguishes the theorem's domain (fixed weights) from the impartiality step (equal weights).
  *   **Accessibility:** Explains core concepts ("measure joy," "assigning worth," "voices in its head," "no path remains," "the future they embed") without jargon. The repeated refrains hammer home the axioms intuitively.
