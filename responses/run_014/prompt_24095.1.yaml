  ## Harsanyi's Weighted Sum

  We measure joy in utils, one by one,
  Assigning worth to every hope and dread.
  **If all prefer X to Y, then X has won.**
  The Social Function, its work begun,
  Seeks order from the voices in its head,
  We measure joy in utils, one by one.

  Can disparate desires be overrun,
  A single ranking risen from the spread?
  **If all prefer X to Y, then X has won.**

  But choices shift beneath a changing sun,
  New options bloom, old certainties are shed –
  **How we rank X and Y, on them alone.**
  This strict demand, a rule tightly spun,
  Forbids the weights from shifting as we tread.
  We measure joy in utils, one by one.

  The Function strains, its logic must be done,
  No path remains but this, the theorem said:
  **How we rank X and Y, on them alone.**
  A linear form, a weighted sum must run,
  Fixed constants hold the future they embed.
  We measure joy in utils, one by one,
  **If all prefer X to Y, then X has won.**

  The weights take shape – *fixed multipliers, spun*
  *For each life, constant as the choices spread* –
  **How we rank X and Y, on them alone.**
  *Impartial hearts set every weight as one.*

  ---

  **How we rank X and Y, on them alone,**
  **If all prefer X to Y, then X has won:**
  *Equal weights turn the theorem's math to stone.*

  ---

