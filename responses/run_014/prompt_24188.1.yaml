prompt: |-
  ok so I'm a junior and I'm the editor of our school paper and basically every week I recieve a pile of notes, texts, and 'he said she said' accounts about something that went down — a fight, a cancelled field trip, a rumor about a teacher quitting, a cheating accusation — and I have to figure out what actually happened and what I print, and if I get it wrong I either print a lie or I get the principal on my case. My advisor keeps telling me I should be weighing the explanations against each other instead of just going with whoever talks the biggest, and I think she was talking about inference to the best explanation or something like that, but I've never seen it turned into something I can actually do with my hands. Can you write me a decision procedure I can run in like 15 minutes before deadline? I want the questions in the order I should ask them, what counts as a good enough answer to each one, where the procedure just says 'no, don't run with this' or 'this is a values call, go ask the advisor,' and — this is the part I care about most — where it's going to misfire on me. I keep hearing that the best explanation isn't always the most likely one, that you can't definately just add up the virtues like simplicity and scope and fit because they don't even use the same units, and that the simplest story is sometimes the least probable one, so I need the procedure to actually handle those and not pretend they don't exist. Also tell me where I'm just going to be confirmation-biased and call whatever fits what I already believe the best explanation. I don't need a book list or anyone's name, I can't look any of that up anyway, just the actual reasoning. Then run it on two cases from this semester: (1) the spring field trip got cancelled and the admin office says it was the weather but the coach keeps saying it was the budget and two students swear they saw the principal text about costs, and (2) a senior got accused of copying a lab report, the accuser is a friend who's also in the same study group and has been acting weird, and the accused says they were home sick the whole night. I want at least one of them to land on something I don't want to print, and I want you to actually commit to the answer instead of hedging, and at the end be honest about what the procedure can't do for me.
reasoning: |-
  Okay, the user is a junior and editor of their school paper dealing with verifying events before publishing. They need a practical decision procedure to handle stories quickly, especially with tight deadlines. Their advisor mentioned inference to the best explanation, but they need something actionable. 

  First, I should understand their main pain points: balancing accuracy under pressure, avoiding principal backlash, and countering confirmation bias. They explicitly want a step-by-step guide with clear thresholds for rejection or escalation. They’re also worried about theoretical flaws—like simplicity not equaling truth—and want those addressed in the workflow. 

  The two test cases are crucial. For the field trip cancellation, conflicting accounts (weather vs. budget) involve authority figures. For the cheating accusation, interpersonal dynamics complicate evidence. Both scenarios must force hard stops or uncomfortable conclusions to demonstrate the procedure’s realism. 

  Building the procedure: It needs to be linear, time-boxed, and jargon-free. Start with foundational checks (harm, bias, sources) before evaluating explanations. Key innovations: 
  - Embed bias checks at multiple steps (e.g., Step 2 explicitly asks "Does this story feel too satisfying?"). 
  - Define "red flags" as concrete deal-breakers (conflict of interest, single anonymous source). 
  - For explanation virtues, use relative scoring (A vs. B) not absolute metrics to avoid false precision. 
  - Force a bias counter-narrative step (Step 5) to combat confirmation bias. 

  On misfires: Honestly disclose edge cases—like when all explanations are weak but publishing is necessary—and suggest mitigations (transparent framing, advisor consultation). 

  Testing Case 1 (field trip): 
  - No harm red flags. 
  - Sources: Principal (authoritative) vs. Coach (secondary) vs. Students (hearsay). 
  - Explanations: Weather (official) vs. Budget (unofficial). 
  - Virtues: Weather explanation fits better (forecast records exist, budget claims lack paper trail). 
  - Counter-bias: I might prefer budget drama, but evidence leans toward weather. 
  - Verdict: Publish weather reason with attribution. 

  Testing Case 2 (cheating): 
  - Harm risk high (reputation damage). 
  - Sources: Accuser (conflicted—friend acting "weird") and Accused (no alibi). 
  - Explanations: Cheating vs. False accusation. Both weak; evidence is "he said/she said." 
  - Red flag: No hard proof + high stakes. 
  - Verdict: Kill the story—exactly the unwanted outcome user requested. 

  Final caveats: Stress that the procedure can’t fix missing evidence or systemic power imbalances (e.g., if admin lies consistently). Advise defaulting to "no publish" when uncertainty is high. 

  This meets all demands: actionable steps, forced hard decisions in cases, and transparent limitations. User’s skepticism about "virtue metrics" is validated by relative scoring and bias checks.
answer: |-
  Here's a battle-tested **15-Minute Verification Procedure** for your school paper. It prioritizes harm reduction, evidence quality, and forcing you to confront bias. **Misfire Warnings** and **Bias Traps** are built into each step. Use a notebook to jot quick answers.

  ---

  ### **The Procedure: GET REAL Framework**
  **G**ather & **E**valuate → **T**est Explanations → **R**ed Flags? → **E**scalate or **A**ct → **L**ock Decision

  1.  **G: GATHER SOURCES & CLAIMS (2 min)**
      *   *Question:* Who's saying what? List every source (name/role) and their core claim. Note: **Anonymous? Firsthand?**
      *   *Good Enough:* Clear list. Identifies primary claimants and conflicts.
      *   **STOP & KILL IF:** Only one anonymous source OR claims are pure rumor ("everyone says...").
      *   **MISFIRE WARNING:** Rushing this = missing key players/conflicts. Skipping anonymity check = printing gossip.
      *   **BIAS TRAP:** Listing only sources who agree with your hunch. *Force yourself to list ALL voices.*

  2.  **E: EVALUATE SOURCE RELIABILITY & POTENTIAL HARM (3 min)**
      *   *Questions:*
          *   **Direct Knowledge?** (Saw it? Have the text? Heard it firsthand?) > Hearsay.
          *   **Conflict of Interest/Motive?** (Grudge? Protecting someone? Covering embarrassment?)
          *   **Harm Check:** Could publishing this unfairly damage someone's rep/safety? Is it essential public interest?
      *   *Good Enough:* Identify strongest evidence (e.g., "Coach saw budget docs" > "Students *heard* about a text"). Flag high-risk sources/stakes.
      *   **STOP & KILL IF:** Only weak/conflicted sources OR potential harm outweighs public interest (e.g., unverified cheating accusation).
      *   **MISFIRE WARNING:** Mistaking confidence for reliability. Ignoring motive ("Why would they lie?" isn't enough - *how* could lying benefit them?).
      *   **BIAS TRAP:** Dismissing motives of sources you dislike; ignoring motives of sources you like. *Assume everyone has a bias. What's theirs?*

  3.  **T: TEST COMPETING EXPLANATIONS (5 min)**
      *   *Question:* What are the 2-3 *plausible* explanations for what happened? (e.g., "Weather caused cancellation" vs. "Budget caused cancellation" vs. "Mix of both").
      *   *Criteria (Weigh RELATIVE strength, don't score absolutely):*
          *   **Evidence Fit:** Which explanation does the *best* evidence (Step 2) directly support? Which requires the *least* speculation?
          *   **Scope:** Which explains *more* of the facts and witness statements?
          *   **Simplicity:** Which requires the fewest unsupported assumptions? *(WARNING: Simplest ≠ Truest!)*
          *   **Predictive Power:** If this explanation is true, what else *should* be true? Can you check? (e.g., "If weather, there should be forecast records/admin emails.")
      *   *Good Enough:* Identify which explanation *currently* wins on balance, or if it's a true deadlock. Note missing evidence.
      *   **STOP & ESCALATE TO ADVISOR IF:** Explanations are equally plausible OR winning explanation relies heavily on simplicity/scope but has weak *evidence fit* OR involves serious allegation with circumstantial evidence only.
      *   **MISFIRE WARNING:** Overvaluing simplicity when evidence is weak (a simple lie is still a lie). Ignoring scope (an explanation that ignores key facts is probably wrong). *Evidence Fit is KING.*
      *   **BIAS TRAP:** Uncritically favoring the explanation matching your preconception. *Force yourself to argue FOR the explanation you dislike.*

  4.  **R: RED FLAGS CHECK (2 min)**
      *   *Questions:*
          *   **Uncorroborated Serious Accusation?** (Cheating, misconduct)
          *   **Single Source (even if named)?**
          *   **High Potential Harm + Weak Evidence?**
          *   **Administrative Landmine?** (Directly contradicts Principal without *very* strong evidence)
          *   **Based Primarily on Emotion/Rumor?**
      *   *Good Enough:* Clear yes/no on major flags.
      *   **STOP & KILL IF:** ANY Red Flag is triggered without overwhelming counter-evidence (rare for you).
      *   **MISFIRE WARNING:** Downplaying a red flag because the story is juicy. *Red Flags exist for a reason.*

  5.  **E/A: ESCALATE or ACT (2 min)**
      *   *Question:* Based on Steps 1-4, can I responsibly publish *something*?
          *   **KILL:** Too risky, weak, or unethical (Red Flags hit, explanations deadlocked with weak evidence).
          *   **PUBLISH (With Caveats):** State the *winning explanation* (Step 3) *attributed clearly* ("According to Principal Jones...", "Coach Smith stated...") and note key conflicts or lack of evidence if essential ("The students involved could not be reached for comment," "The school administration cited weather as the sole reason").
          *   **ESCALATE TO ADVISOR:** True deadlock on plausible explanations, high-stakes with medium evidence, major admin conflict brewing, or you feel deeply unsure.
      *   *Good Enough:* Clear decision with justification based on steps.
      *   **MISFIRE WARNING:** Publishing "both sides" equally when evidence is wildly unequal (false balance). *Attribution is your shield.*

  6.  **L: LOCK & FRAME (1 min)**
      *   *Question:* If publishing, what's the *exact* headline/first sentence ensuring accurate attribution and framing?
      *   *Good Enough:* Sentence clearly identifies the source of the main claim and avoids stating contested facts as absolute truth.
      *   **MISFIRE WARNING:** Sloppy framing turns attributed claim into stated fact. *"Principal Cites Weather in Field Trip Cancellation"* NOT *"Field Trip Cancelled Due to Weather"*.

  ---

  ### **Running the Cases (No Hedging!)**

  **Case 1: Spring Field Trip Cancellation**
  *   **G:** Sources: Admin Office (Weather), Coach (Budget), 2 Students (Saw Principal text re: costs).
  *   **E:** Admin (Official, firsthand? on *reason*?), Coach (Possible firsthand on *budget constraints*? Motive to blame admin?), Students (Hearsay - saw *a text*, didn't read full context? Reliability?). Harm: Low (Why cancelled is public interest). *Strongest Evidence?* Official statement + *potential* corroboration (students) but weak.
  *   **T:** Explanations: Weather vs. Budget.
      *   *Fit:* Admin statement fits official role. Coach's statement fits if budget issues known. Students' claim *weakly* fits budget.
      *   *Scope:* Budget *might* explain why weather (if minor) caused cancellation? But no evidence of that. Weather explains official line.
      *   *Simplicity:* Weather is simpler (official reason given). Budget requires assuming admin lied/hid reason.
      *   *Predictive:* If weather, check forecasts/emails? (Time crunch: maybe not). If budget, are there other cuts? (Unlikely to know).
      *   *Winner?* **Weather explanation has better initial *Evidence Fit* (official source).** Budget explanation relies on hearsay and assumption of admin dishonesty without stronger evidence.
  *   **R:** Red Flags? No single source, no serious accusation, low harm. *But*... minor admin landmine potential.
  *   **E/A:** **PUBLISH (With Caveats)**. Winning explanation is Admin's weather reason. Coach's claim is secondary.
  *   **L:** **Headline:** "Spring Field Trip Cancelled; Administration Cites Weather Concerns" **First Para:** "Citing concerns over forecasted severe weather, the school administration announced the cancellation of the annual junior class field trip scheduled for May 15th. When reached for comment, Coach Miller expressed frustration, suggesting budgetary constraints played a role, though he did not provide documentation. Two students, who asked not to be named, reported seeing the Principal reviewing texts related to trip costs earlier that week."
  *   **WHY IT'S UNCOMFORTABLE:** You might suspect the Coach is right, but the *evidence you have in 15 mins* points more strongly to the official line. The procedure forces you to prioritize the best-supported explanation, not your hunch. Publishing the Coach's *opinion* and the student *observation* (attributed!) covers the conflict without printing an unsupported claim as truth.

  **Case 2: Senior Accused of Cheating**
  *   **G:** Sources: Accuser (Friend/Study Group Member - says copied), Accused (Says home sick).
  *   **E:** Accuser (Firsthand? Saw copied report? Motive: Weird behavior, possible grudge/jealousy/mistake? **Conflict of Interest!**). Accused (Firsthand alibi? But sickness is hard to prove, no corroboration? Motive: Self-preservation). Harm: **VERY HIGH** (Reputation, academic integrity allegation).
  *   **T:** Explanations: Cheating Happened vs. False Accusation.
      *   *Fit:* Both have weak fit. No copy of report? No timestamp proof? No witness? Accuser's conflict hurts reliability. Accused's alibi unproven.
      *   *Scope:* Both explain core claims poorly without more evidence. Why would friend lie? Why would accused cheat?
      *   *Simplicity:* Both require assumptions (malice or dishonesty).
      *   *Predictive:* If cheating, similarity in reports exists? (Can't check fast). If false accusation, accuser has history? (Unlikely to know).
      *   *Winner?* **TRUE DEADLOCK.** Evidence is catastrophically weak and relies entirely on conflicting testimonies from parties with clear motives. No explanation is clearly better.
  *   **R:** **RED FLAGS GALORE:** Uncorroborated serious accusation. Effectively single-source (accuser's claim is the *only* evidence of cheating). High Potential Harm + Weak Evidence. Based on "he said/she said".
  *   **E/A:** **STOP & KILL.** **DO NOT PUBLISH.** The risks of causing serious, unfair harm based on zero hard evidence and highly conflicted sources are far too high. Escalate to advisor *only* if you think they might have a magic bullet (they likely won't).
  *   **WHY YOU DON'T WANT TO PRINT:** It's a juicy story. But printing it based on this is irresponsible journalism and could ruin someone unfairly. The procedure forces the safe/ethical call.

  ---

  ### **What the Procedure CAN'T Do For You**

  1.  **Create Evidence:** If evidence is truly missing (no docs, no independent witnesses), it can't magic it up. It will often tell you "Kill the story" or "Publish only the undisputed basics."
  2.  **Override Power Imbalances:** If the Principal *is* lying and has all the documents locked away, the procedure might still favor their explanation due to their role and your lack of access. It minimizes risk but can't guarantee truth against suppression.
  3.  **Eliminate All Uncertainty:** You will sometimes publish the "best" explanation knowing it *might* be wrong. The procedure forces you to justify *why* it's the best available *now*, minimizing recklessness.
  4.  **Fix Systemic Bias:** If *you* consistently undervalue evidence from certain groups (consciously or not), the bias traps *help* but won't *cure* it. Stay vigilant, especially in Step 2 (Evaluate) and Step 3 (Test Explanations).
  5.  **Handle Perfect Cover-Ups:** If everyone lies consistently and well, the procedure might get fooled. This is rare in a school setting with multiple sources.
  6.  **Give You More Than 15 Minutes:** It forces tough prioritization. Sometimes you *need* that extra hour to check a forecast or ask one more teacher. Use the Escalate step if the 15-min limit feels dangerous.

  **Use this GET REAL framework every time.** It turns abstract "best explanation" theory into concrete actions, forces bias checks, prioritizes evidence and harm reduction, and gives clear off-ramps ("Kill" or "Escalate"). It won't make you omniscient, but it will make you a far more responsible and reliable editor under fire. Good luck!
