  Hmm, the user wants me to create a deadpan, in-universe public information brochure for a fictional institution that replaces expert committees with randomly selected juries. They've provided very specific requirements about how this should work based on the Condorcet jury theorem, while maintaining a serious bureaucratic tone throughout.

  I need to create a welcome packet for new jurors of the National Inquiry Panels (NIP), where large juries vote privately on yes/no questions without deliberation. This should include bureaucratic subdivisions, juror duties, pay schedule, and performance statistics - all presented with proud, procedural language that never breaks character.

  The humor should emerge from the institution's complete unawareness of how its own system contradicts the assumptions of the Condorcet theorem it implicitly relies on. Key points to embed include:
  - The requirement that each juror must be better than random chance
  - The theorem only applying to large panels
  - The need for independent errors (thus the no-deliberation rules)
  - The standardized training that ironically correlates errors
  - The absurdity of reducing complex questions to binary choices
  - The danger if average competence drops below 50%

  I'll create sections like "Message from the Director-General," "Your Role as a Juror," "Operational Protocols," "Compensation Schedule," and "Performance Metrics." The testimonial needs to sound positive to the institution but reveal flaws to astute readers.

  For the statistics appendix, I'll show high accuracy percentages that mask the underlying issues. The pay schedule will emphasize the importance of the binary format. The testimonial might praise the simplicity while hinting at oversimplification.

  The institution name should sound grand and procedural - "National Inquiry Panels" with subdivisions like "Question Formulation Bureau" and "Juror Management Directorate." The tone must remain unwaveringly proud of the system while letting the contradictions shine through for knowledgeable readers.
answer: |-
  ## NATIONAL INQUIRY PANELS: WELCOME TO SERVICE, JUROR

  **AUTHORIZED DISTRIBUTION: NEWLY SELECTED MEMBERS OF THE NATIONAL INQUIRY PANELS (NIP)**
  **ISSUED BY: THE JUROR MANAGEMENT DIRECTORATE, OFFICE OF CIVIC DELIBERATION**

  **MESSAGE FROM THE DIRECTOR-GENERAL:**
  Citizen, congratulations on your selection. Through a statistically rigorous and impartial process, you have been chosen to participate in a cornerstone of modern governance: the National Inquiry Panels. Your service directly informs national policy and settles complex matters with unparalleled efficiency and democratic legitimacy. The NIP system represents the zenith of rational decision-making, harnessing the collective judgment of ordinary citizens like yourself, processed through meticulously designed procedures. Your contribution is vital. Welcome.

  **SECTION 1: THE NATIONAL INQUIRY PANELS (NIP) - STRUCTURE & PURPOSE**
  1.1. **Mandate:** To provide definitive, binding answers to questions of national significance previously addressed by specialized committees.
  1.2. **Operational Principle:** The settled will of a randomly selected, sufficiently large panel of citizens, expressed through confidential majority vote on a binary (Yes/No) question, constitutes the authoritative answer. Complexity is resolved through scale and process.
  1.3. **Bureaucratic Subdivisions:**
      *   **Question Formulation Bureau (QFB):** Receives policy quandaries; reduces them to unambiguous Yes/No propositions suitable for juror determination. Ensures clarity and focus.
      *   **Juror Management Directorate (JMD):** Manics the National Civic Registry; administers random selection; coordinates logistics; delivers Standardized Juror Orientation (SJO).
      *   **Panel Operations Division (POD):** Convenes panels (typically 1,501 members); distributes QFB-formulated questions; collects and tabulates votes electronically; announces the Majority Verdict.
      *   **Verdict Implementation Unit (VIU):** Ensures the Majority Verdict is treated as settled fact by all relevant government agencies and incorporated into policy.

  **SECTION 2: YOUR ROLE AS A JUROR**
  2.1. **Core Duty:** To independently consider the single Yes/No question presented to your panel and cast your vote based solely on the information and understanding derived from the Standardized Juror Orientation (SJO) materials.
  2.2. **Key Responsibilities:**
      *   Attend the mandatory, half-day **Standardized Juror Orientation (SJO)** session remotely or at your designated Civic Hub. *Participation is mandatory for compensation.*
      *   Thoroughly review all SJO-provided briefing materials *individually*. These materials offer a neutral, factual overview relevant to the specific question.
      *   Access the secure NIP voting portal during the designated 48-hour voting window.
      *   Cast your confidential vote (**YES** or **NO**) on the presented question.
      *   **Refrain absolutely from:** Discussing the question or SJO materials with *anyone*, including fellow jurors, family, or experts; conducting independent research; seeking clarification beyond the provided SJO materials; attempting to deliberate or influence other jurors. *Independence of judgment is paramount to the integrity of the verdict.*
      *   Submit your vote within the stipulated timeframe.
  2.3. **Term of Service:** Your panel is convened for a single question. Service concludes upon the announcement of the Majority Verdict. You may be selected again in the future via the random process.

  **SECTION 3: OPERATIONAL PROTOCOLS - ENSURING INTEGRITY**
  3.1. **Confidentiality:** Your vote is anonymous. Panel membership is confidential until after the verdict is announced. Breaching confidentiality violates the National Inquiry Act.
  3.2. **Non-Deliberation:** Panels do not meet, debate, or communicate. Deliberation introduces bias, inefficiency, and potential for undue influence. The power resides in the *independent* aggregation of individual judgments.
  3.3. **The Binary Imperative:** The QFB expertly transforms complex issues into precise Yes/No questions. This format is essential for achieving a clear, actionable Majority Verdict. Trust the process.
  3.4. **Standardized Juror Orientation (SJO):** The SJO is a critical, non-negotiable component. It provides the essential, uniform baseline of understanding required for all jurors to perform their duty effectively. Its consistent delivery nationwide guarantees a level playing field. *Engagement with the SJO directly correlates with verdict robustness.*

  **SECTION 4: COMPENSATION SCHEDULE**
  Your civic duty is recognized and compensated fairly.

  4.1. **Base Honorarium:** $500 (gross), payable upon verified vote submission.
  4.2. **SJO Completion Bonus:** $250 (gross), payable upon verified completion of the mandatory Standardized Juror Orientation.
  4.3. **Timeliness Incentive:** $100 (gross), payable for vote submission within the first 24 hours of the voting window.
  4.4. **Payment:** Distributed electronically within 10 business days of the Majority Verdict announcement. Taxes apply.

  **SECTION 5: THE POWER OF THE PROCESS**
  The National Inquiry Panel system leverages a profound mathematical truth: the aggregated judgment of a large group of independently reasoning individuals, each with even a modest tendency towards correctness, converges with near certainty on the right answer as the group size increases. Our procedures – random selection, mandatory SJO for baseline competence, strict non-communication, and the binary framework – are meticulously engineered to realize this principle. The Majority Verdict is not merely an opinion; it is the statistically emergent voice of informed civic reason.

  **TESTIMONIAL:**
  *"Being part of an NIP panel was surprisingly straightforward. The training materials gave me everything I needed in a clear way. I appreciated not having to argue with anyone or get bogged down in debates. Just read the facts they provided, thought about it myself, and clicked 'Yes' or 'No'. It felt efficient, fair, and it’s impressive how such a big group can just... know the answer like that. The SJO really made it simple to understand what was being asked, even the tricky stuff."* - **Patricia R., Former Juror (Panel #1147: "Should the national bird designation be changed?")**

  **APPENDIX A: PERFORMANCE METRICS (FISCAL YEAR 2023-24)**
  *   **Panels Convened:** 87
  *   **Average Panel Size:** 1,501 jurors
  *   **Juror Participation Rate:** 98.7%
  *   **SJO Completion Rate:** 99.1%
  *   **Vote Submission Rate (Within Window):** 99.8%
  *   **Average Verdict Confidence Interval (Calculated):** >99.99%
  *   **System Uptime:** 100%
  *   **Citizen Satisfaction (Post-Service Survey):** 92% "Satisfied" or "Very Satisfied"
  *   **Agency Adoption Rate of Verdicts:** 100%

  ---

  **Welcome, Juror. Your nation relies on your independent judgment. Proceed to your scheduled Standardized Juror Orientation.**
