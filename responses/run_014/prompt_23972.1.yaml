  We are drafting a joint statement for two camps: the "stochastic parrots" theorists (SP) and the functionalists (F). The goal is to have a numbered section of agreed-upon claims and then a table of disagreements with the precise statement of each side's view, the crux, and a concrete test or argument.

  First, we outline the points of agreement.

  Agreed Claims:

  1. **Nature of LLMs**: Large language models (LLMs) are artificial neural networks trained via next-token prediction on very large datasets of human-generated text. Their behavior is generated by processing input sequences and outputting probability distributions over tokens, from which a next token is selected (either deterministically or stochastically).

  2. **Training Objective**: The primary training objective for current LLMs is the minimization of a loss function that measures the discrepancy between the model's predicted token distribution and the actual token in the training data. This is done at scale, with models having billions of parameters and trained on trillions of tokens.

  3. **Behavioral Fluency**: LLMs exhibit a high degree of behavioral fluency in natural language. They can generate coherent and contextually appropriate text, answer questions, summarize, translate, and perform other language tasks, sometimes at a level comparable to or exceeding that of humans in specific domains.

  4. **The "Stochastic Parrots" Claim**: The term "stochastic parrot" is used by one camp to describe LLMs as systems that, despite their fluency, do not truly understand the language they process and generate. This claim is about the absence of genuine understanding (or meaning, semantic content, etc.), not about their raw capabilities.

  5. **Functionalist Position**: The functionalist camp holds that the behavioral profile of LLMs (including their ability to perform complex language tasks) is best explained by the hypothesis that they possess at least some degree of understanding. They argue that understanding is defined by functional behavior and not necessarily by internal states that are isomorphic to human cognition.

  6. **Separate Harm Question**: The question of whether deploying LLMs in certain contexts is harmful (e.g., due to potential for deception, bias, environmental impact, or labor displacement) is independent of the question of whether they understand. Both sides agree that this harm question remains live regardless of the resolution of the understanding debate.

  7. **Empirical Basis**: Both sides agree that the debate is, at least in part, an empirical one. The behavior of LLMs is observable and testable, and both sides are committed to evaluating evidence.

  8. **Not a Claim About Consciousness or Sentience**: The debate about understanding is distinct from questions about consciousness, sentience, or phenomenal experience. The focus is on linguistic understanding.

  Now, the table of disagreements. We structure each row as:

  - **Disagreement**: A precise statement of the opposing views, worded so that each side would accept the phrasing of their own view.
  - **Crux**: The sub-question that, if settled, would move at least one side.
  - **Concrete Test/Argument**: A test, argument, or case that both sides agree bears on the crux, with each side's prediction.

  We identify the following key disagreements:

  1. **The Role of Behavioral Evidence in Determining Understanding**:
     - SP: Behavioral evidence (such as fluency and task performance) is insufficient to establish understanding because it can be achieved by pattern matching without comprehension.
     - F: Behavioral evidence is sufficient to establish understanding because understanding is defined by the ability to use language appropriately in a wide range of contexts.

     Crux: Can a system that lacks understanding (in the sense that it does not have internal representations that ground meaning) exhibit the full range of linguistic behaviors that humans do, including systematicity, compositionality, and generalization?

     Test: Design a test that requires systematic and compositional generalization to novel combinations of concepts, in a way that cannot be explained by surface-level statistical patterns. For example, a test that requires understanding a novel sentence constructed from known words in a novel syntactic structure and then answering questions that require inferring the relationships. Both sides would agree that humans can do this. The functionalist predicts that advanced LLMs will pass such tests without additional training, while the stochastic parrot theorist predicts they will fail or only succeed to the extent that the novel combination is statistically similar to training data.

  2. **The Necessity of Internal Representations**:
     - SP: Genuine understanding requires internal representations that are about the world and that ground the meaning of linguistic expressions (i.e., they must have intentionality). Because LLMs are trained solely on form (token sequences) without any grounding in sensory-motor experience or world interaction, they cannot form such representations.
     - F: Understanding can be fully characterized by the functional role of states in the system, and if the system's internal states play the causal role of representing the world (as evidenced by their role in producing appropriate behavior), then they are representations. The functionalist does not require that the representations be formed in the same way as in humans.

     Crux: Must a system have non-linguistic (e.g., sensory-motor) grounding to possess genuine understanding of language?

     Test: Train an LLM on a multimodal dataset (including images, sounds, etc.) and then test its understanding by having it describe the content of an image it has never seen. Then, compare this to a text-only LLM. The functionalist might predict that the multimodal model will show better understanding (as measured by behavioral tests) and that the internal representations of the multimodal model will be more grounded. The SP theorist might argue that even the multimodal model is still a stochastic parrot because it is still predicting tokens, but they might concede that if the model can pass tests that require true cross-modal understanding (e.g., describing an image in a way that shows understanding of the scene beyond what is present in the text of the training data) then that would be evidence against the SP claim. Alternatively, they might require that the model be embodied and interact with the world.

  3. **The Falsifiability of the Stochastic Parrots Claim**:
     - SP: The stochastic parrots claim is an empirical claim that could be falsified by evidence that the model's behavior cannot be explained by statistical pattern matching alone and requires positing understanding.
     - F: The stochastic parrots claim is sometimes treated as a stipulation about the word "understanding" (i.e., that it requires human-like biological processes) and thus is not empirically falsifiable. However, the functionalist holds that the claim is falsifiable by behavioral evidence.

     Crux: Is the stochastic parrots claim an empirical claim that could be falsified by behavioral evidence?

     Test: Both sides agree that if a model were to pass a test that requires understanding (as defined by the functionalist) and that cannot be explained by statistical patterns in the training data, then the SP claim would be falsified. The disagreement then moves to what test would be sufficient. One candidate test is the canary string memorization check: if a model can regurgitate a unique string that appeared only once in the training data, that is evidence of memorization. But the functionalist might argue that this is not the same as understanding. A better test might be out-of-distribution generalization: present the model with a scenario that is not just novel in terms of token sequence but also in terms of the combination of concepts, and that requires causal reasoning or counterfactual reasoning. For example: "If the Titanic had not sunk, how would that have affected the career of its captain?" The functionalist might predict that a model trained on a corpus that does not contain this specific counterfactual could still answer appropriately by composing its knowledge. The SP theorist might predict that the model will either fail or produce an answer that is a pastiche of similar texts.

  4. **The Role of Scale and Emergence**:
     - SP: Scale (in terms of model size and training data) alone does not lead to understanding; it only leads to more sophisticated pattern matching.
     - F: At a certain scale, emergent properties arise that are best explained as understanding.

     Crux: Does scale alone (without architectural changes) lead to qualitative changes in the model's capabilities that are indicative of understanding?

     Test: Conduct scaling experiments: take a family of models (e.g., from small to large) and test them on a battery of tasks that require understanding (as per functionalist) and that are designed to be minimally dependent on memorization (e.g., by using synthetic data or by testing on novel combinations). The functionalist predicts that beyond a certain scale, the model will show a sharp improvement in these understanding-dependent tasks, while the SP theorist predicts that improvements will be gradual and explained by increased pattern matching capacity.

  5. **The Definition of Understanding**:
     - SP: Understanding requires that the system have mental states with intentionality (aboutness) and that these states are causally connected to the world in the right way (e.g., through evolution or design). LLMs, being trained only on text, lack this connection.
     - F: Understanding is defined by the functional role of the system's states in mediating between inputs and outputs. If the system can use language appropriately in a wide range of contexts, then it understands.

     Crux: Is understanding a matter of internal causal history (or design) or is it a matter of current functional organization?

     Test: This may be partially verbal. However, consider a thought experiment: Suppose we train an LLM on a virtual world (e.g., text descriptions of a simulated environment) and then have it interact with that world via text. Then we test whether it can answer questions about the state of the world after a series of actions. The functionalist would say that if the model can track the state of the world and reason about it, then it has understanding of that world. The SP theorist might say that the model is still just manipulating symbols without real intentionality because it was not designed to have intentionality (or because the virtual world is not real). This might reveal that the disagreement is about the nature of intentionality and not about the model's behavior.

  After considering the above, we note that part of the disagreement might be verbal. The term "understanding" might be used differently. The functionalist is using a functional definition, while the SP theorist is using a definition that requires a connection to the external world (or to consciousness). The substantive disagreement, however, remains: Can a system that is trained solely on text and that uses statistical patterns exhibit behavior that is functionally equivalent to a human who understands? And if so, does that system actually understand?

  Joint Statement:

  **Joint Statement on the Understanding of Language by Large Language Models**

  We, the undersigned stochastic parrots theorists (SP) and functionalists (F), after engaging in adversarial collaboration, agree on the following points:

  1. LLMs are artificial neural networks trained via next-token prediction on large corpora of text. They generate output by predicting the next token based on the input context.

  2. The training process minimizes a loss function that measures the difference between the model's predicted token distribution and the actual token in the training data, and this is done at an unprecedented scale.

  3. LLMs exhibit high fluency in natural language and can perform a wide variety of language tasks effectively.

  4. The "stochastic parrots" claim is that LLMs do not truly understand language; they are sophisticated pattern matchers without genuine comprehension. This is a claim about the absence of understanding, not about their capabilities.

  5. The functionalist position is that the behavioral profile of LLMs is best explained by attributing to them at least some degree of understanding, where understanding is defined by functional behavior.

  6. The question of whether deploying LLMs is harmful (e.g., due to deception, bias, etc.) is separate from the question of understanding and remains urgent regardless of the resolution of this debate.

  7. Both sides agree that the debate is, at least in part, empirical and should be informed by evidence from the behavior of LLMs.

  8. This debate is about linguistic understanding and is not about consciousness, sentience, or phenomenal experience.

  **Disagreements**

  We disagree on the following points:

  | Disagreement | Crux | Concrete Test/Argument | SP Prediction | F Prediction |
  |--------------|------|------------------------|---------------|--------------|
  | **Behavioral Evidence for Understanding**: SP: Behavioral evidence (e.g., fluency, task performance) is insufficient to establish understanding because it can be achieved without comprehension. F: Behavioral evidence is sufficient to establish understanding because understanding is defined by functional behavior. | Can a system that lacks internal representations that ground meaning exhibit the full range of human-like linguistic behaviors, including systematicity, compositionality, and generalization? | Test: Present the model with a novel sentence that combines known words in a novel syntactic structure and requires inferring relationships (e.g., "The dax was fipped by the meb. What did the meb do to the dax?"). Use words and structures not seen in training. | SP: The model will fail or succeed only if the novel combination is statistically similar to training data. | F: The model will succeed by composing the meanings of the words and the structure. |
  | **Grounding Requirement**: SP: Understanding requires internal representations that are grounded in non-linguistic experiences (e.g., sensory-motor). F: Understanding does not require such grounding; it is a matter of functional organization. | Must a system have non-linguistic grounding to possess genuine understanding? | Test: Compare a text-only LLM and a multimodal LLM (trained on images and text) on a task that requires describing an image they have never seen. | SP: Even the multimodal model is a stochastic parrot because it is still predicting tokens. However, if the multimodal model shows true cross-modal understanding (e.g., describing an image in a way that shows understanding beyond training text), that would be evidence against SP. | F: The multimodal model will show better understanding, and its internal representations will be more grounded, leading to superior performance on the task. |
  | **Falsifiability of SP Claim**: SP: The SP claim is empirical and falsifiable by evidence that the behavior cannot be explained by pattern matching. F: The SP claim is sometimes treated as a stipulation, but it should be falsifiable by behavioral evidence. | Is the SP claim an empirical claim that can be falsified by behavioral evidence? | Test: Ask a counterfactual question that requires causal reasoning and is not in the training data (e.g., "If the Titanic had not sunk, how would that have affected the career of its captain?"). | SP: The model will either fail or produce an answer that is a pastiche of similar texts. | F: The model will answer appropriately by composing its knowledge. |
  | **Scale and Emergence**: SP: Scale alone does not lead to understanding; it leads to more sophisticated pattern matching. F: At a certain scale, understanding emerges. | Does scale alone lead to qualitative changes indicative of understanding? | Test: Test a family of models (varying in size) on a battery of tasks that require understanding (e.g., systematicity tests) using synthetic data to avoid memorization. | SP: Improvements will be gradual and explained by increased pattern matching capacity. | F: Beyond a certain scale, there will be a sharp improvement in understanding-dependent tasks. |
  | **Definition of Understanding**: SP: Understanding requires intentionality (aboutness) and a causal connection to the world. F: Understanding is defined by functional role. | Is understanding a matter of internal causal history or current functional organization? | Test: Train an LLM on a text-based virtual world, then test its ability to track the state of the world and answer questions after a series of actions. | SP: The model is still just manipulating symbols without real intentionality. | F: If the model can track the state and reason about it, it has understanding. |

