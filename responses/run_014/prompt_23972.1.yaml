prompt: |-
  I'm taking a graduate course on the philosophy of artificial intelligence this term, and we've spent a good part of the semester on whether large language models actually understand the language they produce, or whether they are what one influential line of argument calls "stochastic parrots" — sophisticated statistical pattern-matchers whose fluency is an artifact of being trained to predict the next token over enormous corpora. The two camps keep talking past each other, and I'd like to try to force the disagreement into its precise shape. Could you draft the joint statement that a committed "stochastic parrots" theorist (who holds that LLMs do not understand language, that next-token prediction at scale is a sufficient explanation of their behavior, and that deploying them as if they understood is a genuine harm) and a committed functionalist (who holds that the models' behavioral profile is best explained by, and not inconsistent with, their having at least some degree of understanding, and that the right evidence for understanding is functional rather than introspective) could both sign after a good-faith adversarial collaboration?

  I want the deliverable to have a numbered section of claims both sides can actually sign — including claims about what the models are and how they are trained, and about what the "parrots" claim is and is not (in particular, that it is a claim about understanding rather than a claim about raw capability, and that the separate question of whether deploying the models is harmful stays live even if the two sides never resolve the understanding question) — followed by a disagreements table. For each row, give the precise statement of the disagreement phrased so that each side would accept the wording of its own view, the crux — the sub-question such that settling it would actually move at least one side — and, where possible, a concrete test, argument, or case that both sides would agree bears on that crux, with each side's prediction about it recorded in advance (the kinds of evidence on the table include systematicity and compositionality tests, out-of-distribution generalization, and canary-string memorization checks, but you are free to propose others). I suspect one crux is whether the question "do LLMs understand?" can be settled by behavioral evidence alone or whether it requires access to the models' internal representations, and another is whether the "parrots" claim is an empirical claim that could in principle be falsified or instead a stipulation about what the word "understand" is doing. If you conclude that any part of the dispute is merely verbal rather than substantive, say which part and why. You don't need to cite any papers or provide a reading list — just work through the concepts and produce a text both parties could put their names to.
