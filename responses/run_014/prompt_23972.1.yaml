answer: |-
  ### Joint Statement on Understanding in Large Language Models

  **Preamble**  
  We, the undersigned proponents of the "stochastic parrots" (SP) perspective and functionalism (F) in artificial intelligence, recognize that our disagreement about whether large language models (LLMs) "understand" language reflects deep conceptual divergences. Through adversarial collaboration, we agree on the factual foundations of LLMs and the framing of our dispute, while clarifying irreconcilable differences. Below, we outline points of agreement (Part I) and a table of disagreements (Part II) specifying cruxes and resolvable tests.

  ---

  ### Part I: Agreed Claims  
  Both parties affirm the following:  

  1. **LLM Architecture and Training**:  
     LLMs are deep neural networks trained via next-token prediction on massive text corpora. They generate outputs by computing probability distributions over tokens, conditioned on input sequences. This process involves no explicit symbolic reasoning, world modeling, or sensorimotor grounding.  

  2. **Behavioral Fluency ≠ Understanding**:  
     LLMs exhibit high fluency in generating contextually appropriate text across diverse domains. However, fluency alone is insufficient evidence for understanding. Neither camp denies LLMs’ capabilities (e.g., translation, summarization), but we dispute whether these behaviors imply understanding.  

  3. **The "Stochastic Parrots" Claim**:  
     The "stochastic parrots" label asserts that LLMs lack genuine understanding (i.e., the capacity to assign meaning, reference, or intentionality to language). It is not a claim about intelligence, utility, or social impact but specifically about the absence of semantic comprehension.  

  4. **Functionalism's Core Tenet**:  
     Functionalism holds that understanding is determined by a system’s input-output behavior and functional role, independent of implementation details. If an entity behaves indistinguishably from an understanding agent in all relevant contexts, it is legitimate to ascribe understanding.  

  5. **Harm is Independent of Understanding**:  
     Deploying LLMs as if they understand language may cause harm (e.g., deception, bias amplification, eroded trust in information). This risk persists regardless of whether understanding exists and must be addressed independently.  

  6. **Empirical Grounding**:  
     Both camps treat the debate as empirically constrained. Evidence from systematicity tests, memorization checks, generalization tasks, and representational analyses is admissible. Disagreements center on how to interpret such evidence.  

  7. **No Consciousness Claim**:  
     Neither camp attributes consciousness, phenomenal experience, or intrinsic intentionality to LLMs. The dispute concerns linguistic understanding only.  

  ---

  ### Part II: Disagreements Table  
  Each row states the opposing views neutrally, identifies a crux, and proposes a test/argument both accept as probative. Predictions from each camp are included.  

  | Disagreement | SP Position | F Position | Crux | Test/Argument | SP Prediction | F Prediction |
  |--------------|-------------|------------|------|--------------|---------------|--------------|
  | **1. Behavioral Sufficiency** | Behavioral evidence alone cannot confirm understanding because statistical patterns can mimic understanding without semantic content. | Behavioral evidence (e.g., appropriate responses to novel inputs) is sufficient to attribute understanding; internal mechanisms are irrelevant if functional equivalence is achieved. | Can behavioral evidence *alone* justify attributing understanding, or must it be supplemented by representational analysis? | **Test**: Administer a **Systematic Compositionality Test**: Generate novel sentences combining known concepts in unseen syntactic structures (e.g., "Adverbial modification of nested clauses: 'The chef who angrily sang served cold soup.'"). Task: Answer questions requiring inference across modifiers ("Was the soup cold?"). Use out-of-distribution examples with no training-data analogs. | Fails or succeeds only via superficial correlations; errors reveal lack of compositional generalization. | Succeeds by composing meanings systematically; performance scales with model size. |
  | **2. Necessity of Grounding** | Understanding requires non-linguistic grounding (e.g., sensorimotor experience or causal interaction with the world). LLMs, trained only on text, lack this. | Understanding can emerge from linguistic patterns alone; grounding is not necessary if functional behavior demonstrates robust semantic integration. | Must understanding entail referential links to extra-linguistic reality? | **Test**: **Controlled Symbol Grounding**: Train an LLM *only* on text describing a fictitious world (e.g., "Zorph physics: Glarbs repel Fleeps"). Then test: (a) Predictions about unseen interactions ("If a Glarb touches a Fleep, what happens?"); (b) Detection of contradictions ("Can Glarbs attract Fleeps?"). | Fails at (b) or produces inconsistent outputs; success in (a) is explainable by token co-occurrence. | Succeeds at both, showing integration of fictive "world knowledge" into coherent understanding. |
  | **3. Falsifiability of SP Claim** | The SP claim is empirical: If LLMs exhibit behaviors unexplainable by statistical patterns (e.g., genuine causal reasoning), the claim is falsified. | The SP claim risks being unfalsifiable if it dismisses all behavioral success as "patterns." It must allow for clear defeaters. | What evidence would falsify the SP claim? | **Test**: **Counterfactual Reasoning Benchmark**: Evaluate responses to physically implausible scenarios absent from training data (e.g., "If water were dry, how would you clean a towel?"). Use canary strings to ensure novelty. | Outputs are incoherent, contradictory, or parrot training-data snippets. | Outputs are logically consistent and contextually appropriate (e.g., "You couldn’t, as dry water wouldn’t absorb dirt"). |
  | **4. Role of Internal Representations** | Understanding requires human-like internal representations (e.g., structured symbols with truth-conditional semantics). LLMs’ activation patterns lack these properties. | Understanding is subserved by any internal state mediating input-output mappings. LLMs’ latent representations suffice if they encode relational structure. | Do LLMs’ internal states encode compositional meaning structures? | **Argument**: **Representational Similarity Analysis**: Compare LLMs’ activation patterns to human neural/behavioral data in tasks requiring hierarchical syntax/semantics (e.g., garden-path sentences). Use methods like CCA or RSA. | Representations correlate weakly with human patterns; high variance in low-level features dominates. | Representations show strong, systematic alignment with human semantic hierarchies (e.g., noun-verb distinctions). |
  | **5. Scale as Cause of Emergence** | Scaling (data/parameters) only refines statistical correlations; it cannot produce understanding absent architectural changes. | Scale enables emergent functional understanding via complex pattern integration beyond token prediction. | Does scaling alter the *nature* of LLM behavior (understanding) or only its *proficiency* (fluency)? | **Test**: **Scaling Laws for Abstraction**: Measure performance on tasks requiring abstraction (e.g., "Infer rules from proverbs") across model sizes (1B to 100B+ parameters). Control for memorization via synthetic data. | Proficiency improves, but error types remain consistent with pattern matching (e.g., literalism). | Qualitative shift: Larger models handle abstraction robustly, showing discontinuous improvement. |

  ---

  ### Verbal Disagreement Note  
  We conclude that **the definition of "understanding"** is partially verbal. SP reserves "understanding" for systems with biological/non-linguistic grounding, while F defines it functionally. This terminological divergence cannot be resolved empirically. However, the core substantive disputes (Rows 1–5) remain: They concern whether LLMs’ behaviors and mechanisms satisfy the *functional criteria* for understanding (F) or are reducible to statistical pattern matching (SP). The tests above target these empirical cruxes.  

  ---  
  **Signed,**  
  [Stochastic Parrots Advocate]  
  [Functionalist Advocate]  

  ---  
  **Adversarial Collaboration Protocol**  
  - Tests will use open-source models (e.g., LLaMA, Mistral) and public benchmarks.  
  - Novel test cases will be validated for distributional novelty (e.g., n-gram overlap <1%).  
  - Both parties pre-commit to updating positions based on replicated outcomes.
