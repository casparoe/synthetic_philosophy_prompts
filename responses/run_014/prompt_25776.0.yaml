answer: |-
  Here is a draft adversarial-collaboration joint statement between a Prioritarian (P) and a Telic Egalitarian (TE), structured as requested. It reflects core tenets, areas of agreement and disagreement, identifies cruxes, and flags potential verbal elements, while striving for neutrality and signability.

  **Joint Statement on Distributive Justice: Prioritarian & Telic Egalitarian Perspectives**

  **Preamble:** We, a prioritarian and a telic egalitarian, affirm the importance of distributive justice and share a fundamental concern for the well-being of the worse off. While we disagree on foundational principles, we recognize significant areas of convergence in practical reasoning and reject certain common misunderstandings. This document outlines our agreements, clarifies our core disagreements, identifies key cruxes, and notes potential verbal elements. We present our positions as we understand them, acknowledging that sophisticated versions of both views exist and that the philosophical debate is ongoing.

  **I. Points of Agreement:**

  1.  **Concern for the Worse Off:** Both theories are fundamentally sensitive to the well-being of those who are worse off. Improving the absolute position of the worse off is a central moral imperative for both views.
  2.  **Rejection of Strict Equality as Sole Goal:** Both views reject the idea that equality of well-being is the *only* value, or that it should be pursued regardless of its impact on absolute well-being levels (e.g., bringing everyone down to the level of the worst off when no one benefits).
  3.  **Instrumental Value of Equality:** Both views acknowledge that reducing inequality can often have significant *instrumental* benefits (e.g., promoting social stability, reducing envy, fostering cooperation, improving overall welfare through better resource utilization, enhancing the welfare of the worse off via relative position effects). Policies motivated by these instrumental concerns are often jointly supported.
  4.  **Practical Convergence on Many Policies:** In many real-world scenarios, especially those involving significant deprivation, both theories will recommend similar redistributive policies aimed at improving the absolute position of the worse off (e.g., progressive taxation, social safety nets, universal basic services, investments in human capital for disadvantaged groups). This convergence stems from Agreement #1.
  5.  **Leveling Down Reveals a Difference:** We agree that the Leveling Down Objection (LDO) – comparing a perfectly equal but worse-off state (A) to an unequal but better-off state for some (B) – reveals a fundamental difference between our views. TE must see *some* respect in which A is better than B (due to the elimination of inequality), even if A is worse all-things-considered. P sees no respect in which A is better than B. This difference is non-trivial and points to distinct axiomatic commitments.
  6.  **LDO Does Not Settle Everything:** We agree that the LDO, while highlighting a core difference, does not *by itself* definitively refute TE or prove P. TE has responses arguing that the intrinsic disvalue of inequality is outweighed by other values (like absolute welfare) in most cases, or that the LDO presents an artificially stark choice. P maintains the LDO exposes an implausible implication of the core TE commitment.
  7.  **Formal Structure:** Both views are *aggregative* and *welfarist* (concerned with the distribution of individual well-being). Both can be formalized using social welfare functions that give greater weight to benefits affecting the worse off (though the *reason* for the weighting differs).

  **II. Core Disagreements:**

  | Disagreement Area          | Prioritarian (P) Position                                                                                                 | Telic Egalitarian (TE) Position                                                                                                 |
  | :------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Intrinsic Value of Equality** | **Denies:** Inequality in well-being is *not* intrinsically bad. The sole fundamental distributive concern is improving the absolute well-being of individuals, with priority given to benefits affecting the worse off. | **Affirms:** Inequality in well-being *is* intrinsically bad. Even if inequality has no negative causal effects and even if reducing it benefits no one (as in leveling down), the state with less inequality is, *in that specific respect*, better. |
  | **2. Moral Status of Leveling Down** | **Holds:** Leveling down (making some worse off and no one better off, solely to achieve equality) is *always* morally impermissible. It achieves no genuine moral improvement. | **Holds:** Leveling down, while often *all-things-considered* wrong (due to harming individuals without benefit), demonstrates an *intrinsic* respect in which equality is better. Its permissibility depends on weighing this against the harm done. |
  | **3. Source of Priority**  | **Holds:** Priority to the worse off stems *directly* from the intrinsic moral importance of benefiting individuals, where a given benefit matters more the worse off the recipient is (diminishing marginal moral value of well-being). | **Holds:** Priority to the worse off stems *primarily* from the intrinsic badness of inequality. Helping the worse off is the most effective (often the only) way to reduce the morally objectionable inequality. |
  | **4. Scope of Badness**    | **Holds:** The badness of a situation depends *only* on the absolute levels of well-being of the individuals within it and the priority-weighted sum. Comparisons *between* individuals are not intrinsically significant. | **Holds:** The badness of a situation depends *in part* on the pattern of distribution – specifically, on the differences in well-being *between* individuals. Inequality itself is a bad-making feature. |

  **III. Key Cruxes: Questions Where Resolution Would Shift the Debate**

  1.  **Crux 1: The Intuition Pump Test:** Does a robust, widely shared moral intuition genuinely support the claim that *mere inequality*, absent any negative effects on welfare, agency, relationships, or desert, is *intrinsically* bad?
      *   **Relevant Case/Thought Experiment:** *The Divided World:* Imagine two isolated planets. Planet A: Everyone has well-being level 10. Planet B: Half have level 100, half have level 10. No communication, no knowledge of each other, no possible interaction or effects between planets. Is Planet A intrinsically better than Planet B *solely because it has no inequality*?
      *   **P Prediction:** Most thoughtful individuals, upon reflection, will not find Planet A better than Planet B in any respect. The inequality on Planet B harms no one and seems irrelevant. If people find it worse, it's likely due to smuggled instrumental assumptions (e.g., envy, relative deprivation within groups) or confusion.
      *   **TE Prediction:** Many thoughtful individuals have a persistent intuition that Planet A is better *in one respect* than Planet B – the respect of equality. This intuition points to a genuine intrinsic disvalue in unequal distributions, even across isolated groups. Denying this requires explaining away a core moral perception.
      *   **Status:** Live dispute. Empirical studies on intuitions exist but are contested. Philosophical arguments hinge on the reliability and interpretation of such intuitions.

  2.  **Crux 2: The Explanatory Priority Test:** Is the aversion to inequality best *explained* by a fundamental concern for the intrinsic badness of unequal relations, or is it better explained by a fundamental concern for the absolute plight of the worse off combined with the *instrumental* harms of inequality?
      *   **Relevant Evidence:** Analysis of real-world motivations for equality-seeking; psychological studies on inequality aversion (e.g., ultimatum game behavior, happiness studies controlling for absolute income); the ability of each theory to coherently explain the *full range* of our distributive judgments (including reactions to the LDO and Divided World).
      *   **P Expectation:** Careful examination will show that apparent concerns for equality dissolve into concerns about absolute deprivation, unfairness (procedural or desert-based), or the instrumental harms inequality causes to the worse off (or social fabric). TE's core claim adds no explanatory power and leads to counterintuitive results (LDO).
      *   **TE Expectation:** Careful examination reveals a residual concern for the *pattern itself* that cannot be fully reduced to concerns about absolute welfare or procedural fairness. Instrumental accounts fail to capture the specific wrong identified when inequality seems undeserved or arbitrary, even if absolute levels are adequate. The LDO intuition highlights this irreducibility.
      *   **Status:** Live dispute. Core methodological disagreement about theory selection and reduction.

  3.  **Crux 3: The Robustness of Priority Test:** Does the priority given to the worse off remain constant (P) or vary (TE) based on the level of inequality?
      *   **Relevant Case:** Compare two scenarios:
          *   Scenario X: Help a very badly off person (well-being 5) gain +5 units, OR help a moderately well-off person (well-being 50) gain +5 units.
          *   Scenario Y: Help a very badly off person (well-being 5) gain +5 units, OR help a *slightly* better-off person (well-being 6) gain +5 units.
      *   **P Prediction:** The priority for helping the worse off person is *very strong* in both X and Y, driven by the absolute badness of their situation and the greater moral weight of benefits to them. The difference in the alternative recipient (50 vs. 6) might slightly affect the *degree* of priority in Y, but the fundamental imperative to help the worst-off remains paramount and similarly strong in both cases. Priority is primarily a function of the *absolute* welfare level of the recipient.
      *   **TE Prediction:** The priority for helping the worse off person is *significantly stronger* in Scenario Y than in Scenario X. In Y, helping the slightly better-off person instead would create (or worsen) a very small *but intrinsically bad* inequality (6+5=11 vs 5). In X, the inequality created (50+5=55 vs 5) is large, but the intrinsic badness of inequality doesn't necessarily scale linearly with the gap (or may even diminish). The *proximity* of the potential recipients in Y makes the potential inequality stark and particularly objectionable. Priority is significantly influenced by the *relational* context (inequality between specific individuals).
      *   **Status:** Live dispute. Tests the sensitivity of each view to relational factors vs. absolute levels in determining the strength of priority.

  **IV. Notes on Potential Verbal/Conceptual Elements:**

  1.  **"Intrinsic Badness":** This is the most critical potential verbal zone. P typically interprets "intrinsic badness" as implying that the state of affairs itself is *pro tanto* worse *all-things-considered* in a way that could justify action (like leveling down). TE often uses "intrinsic badness" to denote a *sui generis* negative feature of the state of affairs that contributes to its overall badness, but which may be (and usually is) outweighed by other factors (like welfare losses). **Does the disagreement survive disambiguation?** Yes. Even if "intrinsic badness" for TE means only a "pattern-based contributory bad-making feature," P still denies that the pattern itself is *any kind* of fundamental bad-making feature. The core disagreement is whether interpersonal comparisons of well-being levels are *in themselves* morally significant, or whether only individual welfare levels (with diminishing marginal moral weight) matter.
  2.  **"Priority":** While both use the term, its *source* and *potential sensitivity to context* differ (as per Crux 3). This is substantive, not merely verbal. P grounds priority in individual welfare levels; TE grounds it primarily in the badness of inequality. This leads to potentially different prescriptions in specific cases.
  3.  **"Instrumental vs. Intrinsic":** Disagreements about whether a particular harm (e.g., stigma, loss of status) caused by inequality is truly "instrumental" or constitutive/reflective of the intrinsic badness can occur. However, the core TE claim about *mere inequality* (as in Divided World) aims to isolate the intrinsic component.

  **Disclaimer:** This document represents our understanding of core prioritarian and telic egalitarian positions. The field of distributive ethics is dynamic, with nuanced variations within each camp (e.g., different weightings in priority, different accounts of the currency of justice, different responses to the LDO). The agreements, disagreements, and cruxes outlined here reflect central, defining aspects of the debate as we see it, but are not exhaustive. The "live dispute" status indicates areas where significant scholarly disagreement persists.

  ---

  **Key Features Reflecting Your Request:**

  *   **Good-Faith Modeling:** Presents both views accurately and sympathetically. Uses "holds", "affirms/denies" language. Acknowledges responses and sophistication on both sides (e.g., TE on LDO).
  *   **Structured Deliverable:** Clear sections: Preamble, Agreements (numbered list), Disagreements (table), Cruxes (with cases/predictions), Verbal Notes, Disclaimer.
  *   **Beyond LDO:** Agreements cover convergence points, instrumental value, policy overlap, and the limited role of LDO. Disagreements include source of priority and scope of badness. Cruxes explore deeper foundations.
  *   **Signable:** Language is neutral, precise, and avoids straw-manning. Focuses on stating positions clearly. Includes a disclaimer acknowledging nuance.
  *   **Cruxes with Bite:** Each crux isolates a fundamental question with a test case or evidence both sides could engage with, along with their specific predictions.
  *   **Verbal Elements Flagged:** Section IV explicitly addresses the key potential verbal dispute around "intrinsic badness" and concludes the substantial disagreement remains.
  *   **Clarity on Consensus/Dispute:** The preamble, agreements, and the "Status" notes in the Cruxes section explicitly distinguish settled points (e.g., LDO reveals a difference) from live disputes (e.g., Divided World intuition, explanatory priority).
  *   **Neutral Framing:** Avoids presenting one view as the "default" or "consensus." The disagreement table and crux predictions give equal weight and clarity to both sides.

  This document provides a concrete model for workshop participants to see how deep theoretical disagreements can be articulated precisely, alongside significant areas of agreement and shared concern, all within a framework of respectful intellectual collaboration.
