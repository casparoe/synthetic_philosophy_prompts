prompt: |-
  I cover science and ideas, but I'm stuck on a tiny newroom dispute and I think I'm overthinking it. We have a style rule that says when a politician announces a policy, we should write "the mayor said she will raise the minimum wage," not "the mayor will raise it." A new reporter wrote the latter after a press conference because the mayor's office confirmed it and no one is denying it. I told them we have to keep the "said" because the rule is about attribution. They say the rule is really about not turning claims into facts, and in this case it's already a fact. I can't point to a fact that settles it except our past usage, and they can always say they meant the rule a little differently. Is there a principled way to decide who's right, or is this just two people inventing a rule after the fact?
reasoning: |-
  Okay, the user is a science and ideas journalist dealing with a style dispute in their newsroom. They have a rule about attributing policy announcements with phrases like "the mayor said she will," but a reporter used "the mayor will" because the policy was confirmed. The reporter argues that since it's confirmed, it's a fact and doesn't need attribution. The user needs a principled way to resolve this beyond past usage.

  First, I need to unpack the core issue. The rule exists to separate reported speech from established facts. Even if the mayor's office confirmed it, the announcement itself is the source. The act of announcing is factual, but the policy's implementation is future-tense and might still change. Attribution protects against that uncertainty.

  The reporter's point about confirmation making it a fact is understandable. But journalistic principles often require more than just confirmation from the subject. Without independent verification or official documentation, it's still based on their statement. The key here is distinguishing between the announcement as an event and the policy as a future action.

  Looking at style guides, AP and others emphasize attribution for promises or future actions. The rationale includes accountability and accuracy. If the policy changes later, the publication can point to the attribution as evidence they reported the announcement, not the certainty of the outcome.

  Also, the user might be concerned about consistency in applying rules. If exceptions are made whenever something seems confirmed, it could erode the standard. Consistency helps maintain credibility and avoids subjective judgments about what's "confirmed enough."

  The user's deeper need might be upholding journalistic integrity while managing team dynamics. They need a clear rationale to present, not just "because the style guide says so." Providing arguments based on journalistic principles could help the reporter understand the reasoning behind the rule.

  I should also consider potential misunderstandings. The reporter might think attribution implies doubt, but it's actually about sourcing. Clarifying that attribution isn't skepticism but transparency could bridge the gap. Examples where unattributed claims led to issues might reinforce this point.

  In conclusion, the principled stance is that attribution is necessary for future commitments, regardless of current confirmation. The rule's purpose is to maintain a clear line between what was stated and what will happen. This aligns with best practices in journalism and avoids potential pitfalls from evolving situations.
answer: |-
  This is a classic journalistic tension, and you're right to dig into the principle. **The reporter is misunderstanding the core purpose of the attribution rule.** While the rule *indirectly* helps avoid turning claims into facts, its **primary and fundamental purpose is to maintain clear sourcing and delineate between the act of announcement and the future event itself.**

  Here's the principled breakdown:

  1.  **The Rule is About Sourcing & Separation, Not Just "Fact vs. Claim":**
      *   The core function of "said" is to **attribute the information definitively to a source and an event (the announcement).** It answers: "How do we *know* this will happen? Because the mayor *said* it at the press conference."
      *   It **separates the act of promising/announcing from the future fulfillment of that promise.** "The mayor said she *will*..." clearly places the action in the future as part of her statement. "The mayor *will*..." removes that temporal and source-based context, merging the announcement with the future reality.

  2.  **"Fact" vs. "Future Commitment":**
      *   **What is the confirmed fact?** The indisputable fact *at this moment* is: **The Mayor announced/committed to raising the minimum wage.** Her office confirmed *that she made this announcement/commitment*. That is the concrete, verifiable event.
      *   **What is the future action?** The actual raising of the minimum wage is a **future commitment or plan.** It *has not happened yet*. While it's highly likely based on the announcement and confirmation, it remains contingent on future events (drafting legislation, council approval, implementation timelines, unforeseen circumstances). Journalistic ethics require recognizing this temporal distinction.

  3.  **The Danger of Omitting "Said" for Future Actions:**
      *   **Removes Accountability:** If you write "The Mayor will raise the minimum wage," and then unforeseen events prevent it (budget crisis, legal challenge, council rejection), your reporting becomes factually incorrect *at the time it was written* because it stated a future event as a certainty. Attributing it ("said she will") protects you because you accurately reported her stated *intention* at that moment.
      *   **Implies Certainty Beyond Journalism's Role:** Journalism reports on *what is known now*. Stating a future action as a simple fact ("will") implies a level of certainty about the future that journalism cannot and should not claim. Attribution acknowledges the source of the *prediction/commitment*.
      *   **Blurs the Line Between Announcement and Execution:** Removing "said" turns the *promise* into the *deed* in the reader's mind at the time of reading. This is precisely what the attribution rule exists to prevent.
      *   **Sets a Bad Precedent:** If you drop "said" whenever the source confirms their own statement, where do you draw the line? Does it apply only to elected officials? Only to policy? What constitutes "confirmed enough"? The rule is most valuable when applied consistently to *all* future-tense announcements/commitments.

  4.  **Addressing the Reporter's Point ("It's already a fact"):**
      *   **Response:** "The *announcement* of the policy is a fact. The *intention* expressed by the Mayor is a fact. Her office confirming *that she said it* is a fact. But the *future action* of raising the minimum wage is not yet a completed fact. Our job is to report the *announcement of the intention* accurately and with clear sourcing. Using 'said she will' achieves this perfectly. Dropping 'said' moves us from reporting her stated commitment to asserting the future event as an established reality, which it is not at this moment."

  **The Principled Resolution:**

  *   **The rule is fundamentally sound and should be followed.** "The mayor said she will raise the minimum wage" is the correct construction.
  *   **The reporter's interpretation ("it's a fact") conflates the announcement with the future action.** The *policy announcement* is a fact; the *policy implementation* is a future event based on that announcement.
  *   **Attribution ("said") is essential for accuracy, accountability, and maintaining the distinction between present statements and future outcomes,** especially when reporting on promises or plans by figures in authority.

  **How to Explain This:**

  1.  **Focus on Sourcing:** "Our readers need to know *how* we know something. We know the Mayor plans to raise the minimum wage *because she announced it*. 'Said' makes that source crystal clear."
  2.  **Focus on the Temporal Gap:** "Things change. Until the minimum wage is actually raised, the only absolute certainty we have is that the Mayor *stated her intention* to do so. Our language needs to reflect that gap between promise and fulfillment."
  3.  **Focus on Accountability:** "If we write 'The Mayor will raise it,' and then she doesn't, *we* look wrong, even if the reason was beyond her control. If we write 'The Mayor *said* she will raise it,' we remain accurate: we reported what she *said* she would do."
  4.  **Focus on Consistency:** "This rule applies universally to announcements of future actions, regardless of how 'confirmed' they seem at the moment. It prevents subjective judgments about what's 'confirmed enough' to drop attribution and maintains a clear, reliable standard for our readers."

  **Conclusion:** This isn't just "past usage" or two people inventing rules. The attribution requirement ("said") for announcements of future actions is a bedrock principle of accurate, accountable journalism. It protects the publication, respects the reader, and clearly delineates between the source of information and the uncertain future. The reporter's well-intentioned argument overlooks the crucial distinction between the *fact of the announcement* and the *future nature of the promised action*. Stick with the rule.
