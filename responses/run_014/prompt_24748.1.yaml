prompt: |-
  ok so i'm building a comparison between buddhist ethics and consequentialism and i keep hitting the same wall: the claim that in the buddhist framework it's the intention behind an act (the volition, what they call cetana) that gives it its karmic moral weight, not the outcome. most discussions of this just say that buddhism cares about motives while consequentialism cares about results and stop there, but i think that's too quick, because a consequentialist can care about motives too -- just only for their future consequences. so the real question i want to test is whether the buddhist emphasis on intention is actually non-consequentialist at all, or whether it collapses into conseqentialism once you count up the downstream effects of having a good intention.

  can you build me a thought experiment that isolates exactly that? specs:

  - two agents, same situation, and they produce exactly the same outcome -- same people helped, same people harmed, same net welfare, you name it. the only difference is the intention: one acts out of genuine compassion, the other out of something like strategic self-interest or a desire for credit.
  - ordinary setting, no trolleys, no sci-fi, no demons. a hospital, a charity, a workplace, whatever. keep the scenario to a paragraph or two.
  - the case is for me to test whether the buddhist claim that intention is what matters survives contact with a consequentialist who is allowed to care about intention for the right (consequentialist) reason.

  then do the walk-through:

  1. the act-consequentialist's verdict, and be honest about whether the intention difference matters to her at all, and if so only because of future consequences.
  2. the buddhist verdict, and here's the part i really want: separate the two possible reasons the compassionate act is karmically better -- (a) the intention is intrinsically more meritorious, versus (b) the compassionate agent will just be a better agent going forward. i think people conflate these and i want them pulled apart.
  3. engineer the case so the consequentialist's reason to prefer the compassionate agent is only reason (b), the future-payoff reason, and show that this makes the two frameworks land on the same ranking for structurally different reasons. then tell me which single feature of the case is holding that convergence together, and what breaks if i remove it (say, the compassionate agent dies the next day, or the intention has no future consequences at all).
  4. finish with how a defender of whichever view comes out badly would attack the case. if the buddhist view comes out as just consequentialism in a robe, the defender should say what's left over that the consequentialist is missing. if the consequentialist comes out as blind to what actually matters, the defender should say why the future-payoff account is doing all the work and the intrinsic account is empty.

  the point is to isolate whether intention-based ethics really is a third thing or whether it's consequentialism all the way down. tell me honestly which way your case lands and what that shows.
