prompt: |-
  I'm six books in and I've noticed I keep writing the same scene over and over, but I cant say what makes some versions of it land and others feel like a cheat to the reader. So here's my gut, going by my own drafts — tell me what principle sits underneath it, if there is one.

  - Mother in a burning house, can carry one of her two kids out. Real dilemma. Afterwards she isn't blameworthy, but "you did the right thing" would be an insult, and I want her to feel she owes the one she left something.
  - Field hospital, surgeon lets three die to save seven. Doesn't feel like a dilemma at all. Grim arithmetic, there's a right answer, nothing left over except tiredness. Structurally the same shape as the last one and I treat them completely differently, which bugs me tho.
  - Guy skips a promised lunch to stop a mugging. Obviously correct, nothing outstanding — except I keep wanting him to apologise, and if nothing was actually violated, apologise for what?
  - Two kids drowning, neither of them his, he saves one. Here I want it to feel like the burning house and not the hospital, and I honestly don't know why.
  - Woman forced to pick which of her own children lives. Real dilemma, there was no right thing to do, and she's still not to blame for having picked. But if she freezes and lets both go, that's worse — she IS to blame.
  - Man takes a job that puts him in two cities at once and then has to break one of two promises. Fake dilemma, he did this to himself. Still needs the grief in the scene.

  My working rule when I'm drafting: it's a real dilemma only if you couldn't afterwards say to the character "you did the right thing" and mean it. Test that against the six, say which verdicts it can't deliver and which single verdict I should probably give up, and then state whatever principle survives as precisely as you can manage — including what it predicts about a case I haven't got yet: a character who can either keep a promise to a friend who just died or stop a stranger from being badly hurt, where the two are exactly as bad as each other.
reasoning: |-
  Hmm, the user is a writer struggling with moral dilemmas in their stories. They've shared six different scenarios where characters face tough choices, and they've noticed that some scenarios feel like genuine dilemmas while others feel forced or unsatisfying. They want to understand what underlying principle distinguishes the "real" dilemmas from the "fake" ones.

  Looking at their scenarios:

  - The burning house with two children feels like a real dilemma with lasting emotional consequences
  - The surgeon choosing to save seven lives over three feels like grim arithmetic without true dilemma
  - Skipping lunch to stop a mugging feels correct but creates lingering guilt
  - Saving one of two drowning children (not their own) should feel like the burning house scenario
  - Forced to choose which child lives feels like a true no-win situation
  - Breaking a promise due to self-created scheduling conflict feels like a fake dilemma

  Their current working rule is that it's a real dilemma if you couldn't tell the character "you did the right thing" afterward. I need to test this against their examples and see where it holds up.

  For the burning house scenario, telling the mother "you did the right thing" would indeed be insulting - she made a terrible choice with no good outcome. This fits their rule. The surgeon scenario presents a problem though - we could tell them "you did the right thing" (saving more lives), but the user wants it to feel like a dilemma. Their rule might need refinement here.

  The lunch/mugging scenario is interesting - we could say "you did the right thing" but the character feels compelled to apologize. This suggests their rule might be missing something about personal obligations versus impersonal ones.

  The drowning children scenario (saving one when neither is yours) should feel like the burning house, meaning "you did the right thing" shouldn't apply. But is that true? You saved someone when you could have saved no one. This exposes a flaw in their rule.

  The mother forced to choose which child lives is a clear case where "you did the right thing" doesn't apply - perfect for their rule. The self-created scheduling conflict is clearly not a real dilemma - the character is responsible for the situation.

  Their rule works well for 1, 5, and 6 but struggles with 2, 3, and 4. The core issue seems to be about the nature of the obligations involved. When the character has a personal relationship or special responsibility (like a parent to a child), the choice becomes more agonizing because they're violating a sacred duty. When the obligation is impersonal (like a surgeon or stranger saving lives), it becomes more about utility.

  For their test case about choosing between keeping a promise to a dead friend or helping a stranger, this would likely feel like a real dilemma because the personal obligation to the friend clashes with the impersonal obligation to the stranger. Both choices involve failing someone, but in different ways.

  I'll explain this using concepts of personal obligation versus impersonal calculus, and show how their rule can be refined to account for this distinction. This should help them create more powerful moral dilemmas in their writing.
answer: |-
  Based on your drafts and gut instincts, your working rule ("it's a real dilemma only if you couldn't afterwards say to the character 'you did the right thing' and mean it") is insightful but needs refinement. It captures a crucial element but clashes with your own intuitions on several cases. Here's the breakdown, the principle underneath, and how it handles your test case:

  **Testing Your Rule Against Your Drafts:**

  1.  **Burning House (Mother):** Rule **HOLDS**. Saying "you did the right thing" *would* be an insult. She acted out of necessity, not "rightness." The grief is profound and unresolved. **Real Dilemma.**
  2.  **Field Hospital (Surgeon):** Rule **FAILS**. You *could* meaningfully say "you did the right thing" (maximizing lives saved is the ethical imperative in triage). Yet, *you* feel it lacks dilemma weight, just grim arithmetic. Your rule incorrectly flags this as "not a real dilemma," contradicting your structural sense but aligning with your feeling about its lack of emotional dilemma.
  3.  **Skipped Lunch / Stopped Mugging:** Rule **FAILS**. You *can* absolutely say "you did the right thing" (preventing harm > keeping a social appointment). Yet, the character feels compelled to apologize. Your rule dismisses this as "not a real dilemma," but the *lingering feeling of wrongness* (apology) indicates a conflict your rule doesn't capture.
  4.  **Two Drowning Kids (Stranger Saves One):** Rule **FAILS** (if applied strictly). Logically, you *could* say "you did the right thing" (saving one life > saving none). Yet, *you* want it to feel like the burning house (where the rule holds), implying a deep sense of unresolved loss *despite* the action being objectively correct. Your rule wouldn't predict this desired feeling.
  5.  **Forced to Choose One Child:** Rule **HOLDS**. Saying "you did the right thing" is impossible. Either choice is horrific. Freezing is worse/blameworthy, but *choosing* still leaves unbearable guilt and loss. **Real Dilemma.**
  6.  **Self-Created Double-Booking:** Rule **HOLDS**. Saying "you did the right thing" *is* meaningless because the *real* wrong was creating the situation. The grief stems from culpability, not an unresolvable moral conflict. **Fake Dilemma.**

  **The Verdicts Your Rule Can't Deliver:**

  1.  **Why the Surgeon feels like "grim arithmetic" without dilemma weight, even though the action is "right."** (Rule incorrectly dismisses it as non-dilemma).
  2.  **Why the Lunch Guy feels the need to apologize for an objectively correct choice.** (Rule dismisses the conflict).
  3.  **Why saving one drowning child as a stranger *should* feel like the burning house (unresolved loss) rather than the hospital (grim necessity).** (Rule wouldn't predict this difference).

  **The Single Verdict You Should Probably Give Up:**

  *   **The verdict that the Surgeon scenario isn't a "real dilemma" at all.** Your structural sense is right – it *is* the same shape. The difference lies in the *nature* of the obligation and consequence, not the presence of a hard choice. Your rule forces you to exclude it, but your gut and structure tell you it belongs. The principle needs to explain *why* it *feels* different, not deny its status as a hard choice.

  **The Underlying Principle:**

  **The emotional weight and lingering "dilemma residue" depend on the violation of a sacred, personal, or identity-defining obligation, rather than just the net utilitarian outcome or the existence of a hard choice.**

  *   **Sacred/Personal Obligation:** This is a duty felt deeply at a personal level, often tied to relationships, identity, or fundamental promises. Violating it creates profound, lasting guilt, shame, or a sense of betrayal, *even if* the action was necessary or produced a better overall outcome. The obligation feels non-fungible (one person cannot simply be swapped for another).
  *   **Impersonal Calculus:** This involves obligations to abstract principles (maximize good, minimize harm, duty to role/profession) or to a group where individuals are interchangeable. Choices here are painful and consequential, but resolving them through reason (like triage protocols) is possible. Guilt, if present, stems from failure to meet the impersonal standard, not from violating a sacred bond. The obligations *are* fungible (one life saved is equivalent to another in the calculation).

  **Applying the Principle to Your Drafts:**

  1.  **Burning House:** Sacred obligation violated (to the child left behind). Personal bond broken. Non-fungible loss. **Lingering residue: Guilt, owed debt.**
  2.  **Field Hospital:** Impersonal calculus (duty to save the most lives possible within medical ethics). Lives are fungible units in the calculation. **Residue: Tiredness, sorrow, but resolvable guilt (I followed protocol/maximized good).**
  3.  **Skipped Lunch:** Minor sacred obligation violated (personal promise to a friend). Net outcome good, but the *personal bond* was momentarily broken. **Residue: Need to apologize (acknowledging the broken promise/debt to the friend).**
  4.  **Two Drowning Kids (Stranger):** Sacred obligation *felt* by the rescuer? This is key. The *act of choosing* to save one life while *knowing* you abandon another, especially when faced with two individuals in need, *creates a felt personal obligation to both in the moment*. The rescuer internalizes the duty to *each specific life* they witness perishing through inaction. **Lingering residue: Profound grief for the specific loss, a sense of owing the lost one something (like the mother), despite no prior bond. The obligation was created *in the moment* by witnessing the need and having the power to act.**
  5.  **Forced to Choose One Child:** Ultimate sacred obligation violation (to the child not chosen). Deepest personal bond. Non-fungible loss. **Lingering residue: Unbearable guilt, shattered identity.**
  6.  **Self-Created Double-Booking:** Sacred obligation violated (personal promises), but the *cause* is culpable negligence, not an external dilemma. The grief stems from *causing* the situation where obligations *had* to be broken. **Residue: Shame, regret for causing the problem, grief for the broken promises.**

  **Predicting the Test Case: Dead Friend's Promise vs. Stranger in Peril**

  *   **The Choice:** Keep a solemn promise to a dead friend (e.g., place flowers on a grave at a specific time) OR intervene to prevent a stranger from suffering equivalent harm (e.g., being badly beaten/robbed).
  *   **The Principle's Prediction:** This is a **REAL DILEMMA** with significant **Lingering Residue**, similar to 1, 4, and 5.
      *   **Sacred Obligation 1:** The promise to the dead friend. This is a deeply personal, potentially identity-defining obligation. Keeping it honors the relationship, memory, and trust. Breaking it feels like a profound betrayal of that sacred bond, potentially severing a connection to the past and the friend's legacy. It's non-fungible (fulfilling it tomorrow isn't the same).
      *   **Sacred Obligation 2:** The immediate imperative to prevent harm to the stranger. Witnessing the peril creates a powerful, in-the-moment personal obligation. To walk away is to abandon *this specific person* to suffering you could prevent. It feels like a personal failure of humanity. Also non-fungible (saving someone else later doesn't absolve abandoning *this* person).
  *   **Why "You did the right thing" fails:** Choosing either path involves violating a sacred obligation.
      *   If they keep the promise: They violated the sacred duty to prevent immediate, severe harm to a fellow human they witnessed.
      *   If they save the stranger: They violated the sacred promise to their dead friend, betraying trust and memory.
  *   **The Residue:** Profound, unresolvable guilt and regret. Choosing the stranger leaves guilt over betraying the friend, wondering if the friend "knows," feeling the weight of the broken vow. Choosing the promise leaves guilt and haunting images of the stranger's suffering, knowing they could have acted. Neither choice offers moral peace. **It should feel closest to your "Burning House" and "Forced Choice" scenarios in emotional weight.**

  **In essence:** Your strongest dilemmas occur when the character is forced to actively violate a deeply personal, sacred, or identity-constituting obligation to a specific individual (or their memory), creating a debt or guilt that can't be settled by a net-positive outcome. The surgeon operates in the realm of impersonal duty; the mother, the promise-breaker (even for good reason), and the child-chooser operate in the realm of the sacred personal. Your principle needs to account for *this type of obligation* and its violation as the core source of "dilemma residue."
