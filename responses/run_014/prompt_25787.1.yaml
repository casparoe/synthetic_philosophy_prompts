prompt: |-
  So my advisor is getting married — she's a philosopher of mind who's been defending the knowledge argument (Mary's room) for like 30 years. She asked me to give a toast at the reception. The thing is, half the room is philosophers who know the Mary's room debate inside out, and the other half is her partner's family who've never heard of qualia. She told me she wants the toast to "do justice to what she actually believes" — meaning no cheesy stuff about how she's now experiencing something you can't capture in propositional knowledge, unless I can make it actually work with the argument. I need to write a 3-4 minute toast that lands for both halves of the room and doesn't betray her philosophical committments. Can you write it?
reasoning: |-
  Okay, the user's advisor, a philosopher of mind who's been defending the knowledge argument (Mary's room) for 30 years, is getting married. She asked the user to give a toast that "does justice to what she actually believes." The challenge is that half the audience are philosophers deeply familiar with the Mary's room debate, while the other half are her partner's family who likely don't know terms like "qualia." The toast must avoid cheesy clichés about experiencing something beyond propositional knowledge unless it genuinely works with the argument, and it needs to honor her philosophical commitments.

  First, I need to understand Mary's Room. It's a thought experiment where Mary, a scientist who knows all physical facts about color, sees red for the first time. The argument is that she gains new knowledge—what it's like to see red—suggesting there are non-physical facts about consciousness. The advisor has defended this for decades, so the toast must align with her view that subjective experience is irreducible.

  The user's explicit needs: a 3-4 minute toast that works for both audiences—philosophers and non-philosophers—and stays true to her beliefs. No betraying her commitments means no implying that love is just physical or reducible to facts. Also, avoiding clichés unless they're philosophically sound here.

  Deeper needs: The user probably wants to honor their advisor sincerely, showing respect for her work while making it accessible. They might be nervous about balancing humor and depth, especially with such a divided audience. There's also an emotional layer—celebrating her marriage without reducing it to a philosophical point. The toast should feel personal and warm, not academic.

  For structure: Start with an anecdote to hook everyone, then transition into Mary's Room in simple terms. Use the argument as a metaphor for love—her knowing about marriage intellectually but now experiencing it. That ties her philosophy to the personal event. Need to avoid jargon; explain "qualia" as "what it's like" or "the felt quality."

  Key elements: Emphasize that her past knowledge was real but incomplete, and marriage adds a new dimension. The punchline isn't that she was wrong, but that life has layers. For philosophers, this respects the knowledge argument; for others, it's relatable. Include humor? Maybe gently, like referencing her 30-year defense, but keep it light.

  Potential pitfalls: Misrepresenting her views. Must clarify that subjective experience complements, not contradicts, factual knowledge. Also, ensure the partner's family doesn't feel alienated—use universal themes of love and commitment. End with a heartfelt wish that connects to her philosophy, e.g., wishing them the richness of shared qualia.

  Finally, the toast should feel celebratory. Close with a raise of glasses, focusing on joy and partnership. Check timing: 3-4 minutes is about 400-500 words, so concise yet meaningful.
answer: |-
  Here’s a 3-4 minute toast crafted to honor your advisor’s philosophical commitments, resonate with the philosophers in the room, *and* be deeply meaningful (and clear) to her partner’s family – all without resorting to cliché:

  ---

  **(Raise glass, warm smile, address the room)** Friends, family, colleagues… and fellow travelers on the winding path of consciousness! It’s truly an honor to stand here today to celebrate [Advisor's Name] and [Partner's Name]. [Advisor's Name], you’ve been my guide through the thickets of philosophy of mind, and today, I get to celebrate you in a whole new light.

  Now, for those of you who *haven’t* spent decades debating the finer points of neural correlates or the hard problem of consciousness… don’t worry. For the next few minutes, you’re officially honorary philosophers. And for my colleagues clutching their wine glasses thinking, “Oh no, is he going to try epistemology at a wedding?” – relax. I promise this is about love, not lectures. But since [Advisor's Name] specifically asked that this toast do justice to what she *actually believes*… well, you know she’d never let me off the hook lightly! And what she believes, deeply and passionately, is profoundly relevant to why we’re all here today.

  **[Turning slightly more to the non-philosophers, explanatory but conversational]**
  [Advisor's Name] has spent over 30 years defending a famous thought experiment called “Mary’s Room.” Imagine a brilliant scientist, Mary. She knows *absolutely everything* there is to know *about* the color red – the physics of light waves, the biology of the eye, the neurology of the brain’s visual cortex. She’s read every book, seen every diagram, mastered every fact… but she’s lived her entire life in a black-and-white room. She’s never *seen* red. Then, one day, she steps outside. She sees a red rose. What happens?

  **[Pivoting back to the philosophers, acknowledging the debate]**
  Now, the philosophers here know the fierce battles fought over this. Does Mary learn something *new*? Is it just a new way of accessing old facts? Or does she genuinely gain knowledge that wasn’t captured in all those textbooks and equations? [Advisor's Name] has stood firmly, brilliantly, and tenaciously for decades on this point: **Yes, Mary learns something genuinely new.** She learns *what it is like* to see red. The facts she knew were complete *as far as they went*, describing the physical world perfectly. But the *experience itself* – the vivid, immediate, subjective quality – that was something entirely different, something that could only be known by encountering it directly. You can know *about* something down to the last atom, and still not know *what it feels like to be part of it*.

  **[Bringing it home to the couple, directly addressing the advisor and her partner]**
  [Advisor's Name], you are Mary stepping out of the room. But it’s not color you’re encountering for the first time today. It’s the lived reality of marriage with [Partner's Name].

  You knew the facts. You knew the statistics about long-term commitment, the psychology of attachment, the sociology of partnership. You’d read the poems, seen the movies, analyzed the cultural narratives – maybe even critiqued a few! You understood the propositional knowledge *about* love and partnership brilliantly. And that knowledge was real, valuable, and true *as far as it went*.

  But today, right now, stepping into this life with [Partner's Name]… **this is the rose.** This is the *what it is like*. This is the unique, irreplaceable, subjective reality of *your* love, *your* commitment, *your* shared life unfolding moment by moment. It’s not that the facts were wrong; they just weren’t, and couldn’t be, the whole story. The map is not the territory. The description is not the dance.

  **[To the partner's family, warmly]**
  And to [Partner's Name]’s wonderful family – what [Advisor's Name] has spent her career arguing is that the most profound things in life – the taste of coffee, the sting of grief, the warmth of the sun, the colour red… and yes, the depth of love – have a dimension that facts alone can never capture. They have to be *lived*. They have to be *experienced*. That’s the heart of what she believes. And today, she’s not just arguing for it; she’s *embodying* it. She’s choosing to step fully into the experience, knowing that the lived reality with your amazing [Son/Daughter/Sibling/etc.] is something no amount of prior knowledge could ever fully encompass or replace.

  **[Final raise of the glass, encompassing everyone]**
  So, [Advisor's Name] and [Partner's Name], we raise our glasses not just to the knowledge *about* love, but to the glorious, complex, beautiful *experience* of it that you are creating together every single day. May your shared life be filled with the richest, most vibrant qualia imaginable. May you never stop discovering new depths in the *what it is like* of being together. Here’s to stepping out of the room, hand in hand, into the brilliantly colored world of your marriage.

  **To [Advisor's Name] and [Partner's Name]!**

  ---

  **Why this works:**

  1.  **Philosophical Fidelity:** It accurately presents the core claim of the Knowledge Argument (Mary learns something genuinely new – phenomenal knowledge/qualia) without oversimplifying or misrepresenting it. It emphasizes that the physical facts *are* complete *as physical facts*, but that phenomenal experience is a different kind of knowing. This avoids the common misinterpretation that the argument claims physical facts are *incomplete* in their own domain.
  2.  **Accessible to Non-Philosophers:** It explains Mary's Room clearly and concisely using relatable language ("what it is like," "lived reality," "subjective quality"). It immediately bridges the gap to the universal experience of love and commitment. The partner's family hears a moving sentiment about love being more than facts, framed by the advisor's life's work.
  3.  **Meaningful for Philosophers:** Colleagues will appreciate the precise, respectful nod to the debate and the elegant application to the personal moment. Using "qualia" directly once, surrounded by clear explanation, is a wink to them without alienating others. The line "The map is not the territory" is a classic philosophical point they'll recognize.
  4.  **Avoids Cliché:** It doesn't say "she now knows what love *really* feels like" implying past ignorance. Instead, it says she had deep *knowledge about* love, and now she's stepping into the unique *experience of* *this specific* love. It honors her past knowledge while celebrating the new dimension marriage adds. The "rose" metaphor ties directly back to Mary's Room.
  5.  **Celebrates the Couple:** The focus remains squarely on [Advisor's Name] and [Partner's Name], their commitment, and the unique journey they are beginning. The philosophy serves to deepen the celebration of *them*.
  6.  **Tone:** Warm, celebratory, slightly reverent towards the philosophy but ultimately focused on the human connection. The gentle humor at the start ("honorary philosophers," "clutching their wine glasses") helps put everyone at ease.
  7.  **Timing:** This script, delivered at a natural pace, fits comfortably within 3-4 minutes.

  **Tips for Delivery:**

  *   **Know your audience:** Briefly scan the room – smile at key family members, acknowledge philosopher colleagues.
  *   **Pacing:** Don't rush the explanation of Mary's Room. Pause slightly after key philosophical points for the philosophers, and after the emotional beats for everyone.
  *   **Emphasis:** Put warmth and sincerity into the lines about the couple and their love. Deliver the philosophical parts clearly and confidently.
  *   **Eye Contact:** Connect with [Advisor's Name] and [Partner's Name] during the direct address sections.
  *   **The "Qualia" Wink:** When you say "qualia," say it clearly but naturally, maybe with a very slight acknowledging glance towards the philosophy section, but don't make a big deal of it. The surrounding explanation makes it clear.

  This toast honors your advisor's intellectual legacy while celebrating the deeply personal and experiential joy of her marriage, creating a moment that truly speaks to everyone in the room. Break a leg!
