answer: |-
  **Scenario 1 (Doing/Commission)**
  Sarah, the manager of a busy warehouse, needs to assign an employee to a temporary hazardous task involving volatile chemicals, knowing it carries a significant risk of serious respiratory injury even with standard precautions. She deliberately chooses Ben, a reliable employee, for this task, directly assigning him to it via the scheduling system, foreseeing the likely harm. Ben performs the task and suffers the predicted severe lung damage. Sarah did not dislike Ben; she simply needed the task done efficiently and he was available.

  **Scenario 2 (Allowing/Omission)**
  Sarah, the manager of the same busy warehouse, realizes that Ben, a reliable employee, has been *mistakenly* scheduled (by an automated system weeks ago) for a hazardous task involving volatile chemicals tomorrow, a task carrying a significant risk of serious respiratory injury even with standard precautions. Sarah could easily reassign Ben to a safe task with a single click in the scheduling system before the shift starts, at no cost or disruption. However, needing the hazardous task completed efficiently and seeing Ben is already slated, she deliberately refrains from reassigning him, foreseeing the likely harm. Ben performs the task and suffers the predicted severe lung damage. Sarah did not dislike Ben; she simply needed the task done efficiently and he was already assigned.

  **Analysis**

  1.  **Feature Doing the Persuasive Work:** The key feature is the *initiation of the specific causal chain* leading directly to the victim being in the dangerous situation. In Scenario 1 (Doing), Sarah *initiates* the causal sequence that places Ben in harm's way by actively assigning him to the hazardous task. In Scenario 2 (Allowing), Ben is *already* in the dangerous situation due to a prior cause (the mistaken automated schedule); Sarah merely *fails to interrupt* this existing causal chain by not reassigning him. The distinction lies purely in whether the agent *originates* the perilous state of affairs for the victim or *leaves intact* a perilous state of affairs the agent did not originate.

  2.  **Collapsing the Gap - The Variant:** Imagine a variant of both scenarios where the hazardous task assignment *itself* was originally made by Sarah several weeks ago (e.g., she manually scheduled Ben for it long before realizing the risk, perhaps based on outdated safety info). Now, in Case A (Doing), Sarah *actively confirms* the hazardous assignment when reminded, knowing the risk. In Case B (Allowing), Sarah *refrains from canceling* the hazardous assignment she made earlier, knowing the risk. In this variant, *Sarah originated the dangerous situation in both cases*. Lay judgments of blameworthiness between actively confirming (a form of "doing") and passively allowing her own prior action to stand (a form of "allowing") show a significantly reduced gap compared to the original pair. The judgment difference is much smaller because Sarah initiated the causal chain in both instances; the distinction between current action and current inaction loses its moral traction when the agent created the background danger.

  3.  **Consequentialist Diagnosis of the Pump:** A consequentialist would argue the pump exploits a cognitive bias rather than revealing a genuine moral difference. They would diagnose it as follows:
      *   **Misleading Salience of Causation:** Humans have a deeply ingrained cognitive bias to perceive actively causing harm as more salient, more directly "linked" to the agent, and thus more blameworthy than merely allowing it, *even when the consequences are identical*. The pump leverages this bias by making the *act* of assignment (Sc.1) feel like Sarah "brought the harm about," while the *inaction* of non-reassignment (Sc.2) feels like she "let it happen."
      *   **Focus on Outcome, Not Path:** Consequentialism holds that only the outcome (Ben harmed) and the agent's knowledge/foresight (which is identical) matter morally. The *path* to that outcome – whether Sarah actively assigned Ben or passively failed to reassign him from an existing assignment – is morally irrelevant if the result and the agent's awareness are the same. The consequential benefit of efficiency is also identical.
      *   **Pump as Error:** The consequentialist contends the pump tricks intuition by making the *mode of agency* (active vs. passive) perceptually vivid, thereby triggering an emotional response (stronger condemnation for action) that doesn't track the only thing that *should* matter morally: the known, foreseen, and equivalent net harm caused. The judgment gap reflects a psychological quirk (causal salience bias), not a fundamental ethical truth. The pump reveals a flaw in human moral psychology, not a flaw in consequentialism. A defender of the moral equivalence of doing and allowing would urge us to overcome this bias and judge the cases based solely on the identical outcomes and foresight.
