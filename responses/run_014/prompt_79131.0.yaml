prompt: |-
  I'm a contract archaeologist finishing the report on a small rescue excavation, and I have to decide how much interpretation to put in it. We uncovered three houses at a riverside settlement and, between two of them, a pit that was filled in a single episode: eleven cattle skulls arranged in a rough circle, each with a flat stone resting on top, and almost nothing else. My co-director wants the report to call this a ritual deposit showing that the community venerated its ancestors and that its households were ranked; he argues that because the pit was filled in one go, we are looking at a single moment of behaviour and can read it almost like a photograph. Our finds specialist thinks it is structured refuse, and says 'ritual' is just the word we use for what we cannot explain. The descendant community we consulted has also asked us not to publish claims about what their ancestors believed. I have to write the interpretation section regardless. Please advise me on how to decide what the objects actually license me to say about people's beliefs and about how their community was organized, and how to write it so that a reader can tell description from inference from guesswork. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is a contract archaeologist dealing with a challenging interpretation dilemma. They've uncovered an unusual pit feature with eleven cattle skulls arranged in a circle, each topped by a flat stone, and need to decide how much interpretation to include in their report. 

  The situation presents multiple conflicting perspectives: their co-director wants to frame it as evidence of ancestor veneration and social ranking, the finds specialist sees it as structured refuse, and the descendant community has explicitly requested no claims about ancestral beliefs. The core challenge is balancing archaeological evidence with ethical responsibilities while maintaining professional rigor.

  First, I need to address the evidential limitations. The pit's single-episode filling does allow us to treat it as a snapshot of intentional behavior - that much is clear from the stratigraphy. But moving from "intentional arrangement" to "ritual" requires more caution. While the patterned deposition (circle formation, stone placement) suggests symbolic action, the term "ritual" carries heavy interpretive baggage. It might be more accurate to describe the physical characteristics neutrally while acknowledging the deliberate organization implies non-utilitarian purpose.

  Regarding social organization claims, the co-director's leap to household ranking seems particularly unsupported. Without comparative data from other features showing differential access to resources, or clear status markers, this is pure speculation. The skulls could equally represent communal effort rather than social hierarchy.

  The descendant community's request is ethically crucial. We must distinguish between describing observable actions ("they deposited skulls in this pattern") and asserting beliefs ("they venerated ancestors"). The former is evidence-based; the latter imposes modern frameworks. This aligns with archaeological best practices anyway - we can rarely access past belief systems directly from material remains.

  For the report structure, visual signaling of interpretation levels will be key. Physical descriptions belong in results, contextual comparisons in analysis, and broader interpretations in clearly labeled speculation sections. Terms like "may suggest" and "possibly" become essential. The word "ritual" might be avoided entirely in favor of "non-domestic" or "patterned deposition."

  Ultimately, the most responsible approach centers on what the evidence can demonstrably support: patterned intentionality, probable symbolic action, and community-level coordination. Anything beyond that should be explicitly framed as tentative possibilities rather than conclusions.
answer: |-
  **Lead with description, limit interpretation to directly observable patterns, and explicitly separate speculation from evidence.**

  The arrangement and stone placement demonstrate intentional, non-utilitarian deposition requiring significant communal effort and coordination. Describe the feature meticulously: location, dimensions, the precise arrangement of eleven cattle skulls forming a rough circle, each capped with a flat stone, the single-episode fill, and the near absence of other material. State clearly that this pattern signifies deliberate, organized action distinct from typical refuse disposal. Avoid interpreting *meaning* (like "ritual," "veneration," or "ancestors") as these are inferences about belief unsupported by the objects alone. Do not assert social ranking; the evidence shows coordination, not hierarchy. Address descendant community concerns by focusing solely on actions (what they *did*) rather than beliefs (what they *thought*).

  **Reasoning:**

  1.  **What the Evidence Licenses (Description & Low-Level Inference):**
      *   **Intentionality:** The specific arrangement (circle, skulls capped with stones) and the single-episode fill are demonstrably deliberate acts. This is not random refuse.
      *   **Effort & Coordination:** Gathering eleven cattle skulls and suitable stones required significant resources and labour, indicating a planned communal activity.
      *   **Non-Utilitarian Action:** The specific configuration lacks a practical purpose (storage, butchery, tool-making), strongly suggesting symbolic or formal action.
      *   **Location Significance:** Its placement *between* houses implies communal space or significance related to the settlement layout.

  2.  **What the Evidence Does NOT License (High-Level Interpretation):**
      *   **Belief Systems ("Veneration," "Ancestors"):** The skulls *could* relate to ancestors, deities, or other concepts, but the objects themselves provide no direct evidence for this specific meaning. "Ritual" is problematic without comparative contextual evidence (e.g., similar features in known ritual structures). Calling it "ritual" often becomes a catch-all for the unexplained, as your specialist notes. Respect the descendant community's request by avoiding claims about belief.
      *   **Social Organization ("Ranked Households"):** While coordination is evident, there is *no* evidence *within this feature* to indicate social hierarchy or ranking between households. It could represent collective action by equals. Linking it directly to household ranking is unsupported speculation.
      *   **"Photograph" of Belief:** While a single event, it's still an action filtered through cultural norms. We see *what* they did, not necessarily *why* or what they believed about it.

  3.  **How to Write It (Separation is Key):**
      *   **Strictly Descriptive Section:** Detail the physical attributes, location, arrangement, and composition of the pit and its contents *only*. Use neutral language (e.g., "deposited," "arranged," "placed").
      *   **Analysis Section (Low-Level Inference):** Here, state the *direct* implications of the description:
          *   "The patterned deposition of skulls and stones represents a deliberate, non-utilitarian act."
          *   "The scale of the deposit required significant communal effort and coordination."
          *   "The location suggests communal significance within the settlement."
      *   **Interpretation/Speculation Section (Clearly Demarcated):** *If* including broader ideas (like the co-director's), do so explicitly as possibilities, not conclusions:
          *   "The deliberate deposition *may* represent symbolic or ceremonial activity (cf. structured deposition)." (Avoid "ritual" if possible; use "ceremonial," "formal," or "non-domestic structured deposition").
          *   "While requiring coordination, the deposit *does not provide direct evidence* for social ranking among households."
          *   "Interpretations regarding specific belief systems (e.g., ancestor veneration) *cannot be substantiated* by this feature alone and are not proposed here, consistent with consultation feedback."
      *   **Signposting Language:** Use phrases like: "The evidence demonstrates...", "This indicates...", "It is possible that...", "However, this does not prove...", "Interpretations regarding [belief] remain speculative...", "Based solely on this feature...".
      *   **Terminology:** Prefer "structured deposition," "formal deposit," or "patterned deposition" over "ritual." Define these terms clearly if used.

  **Bottom Line for Your Report:** Describe the feature meticulously. State it shows intentional, patterned, non-utilitarian action requiring communal effort. Avoid asserting belief ("veneration," "ancestors") or social ranking. Clearly label any broader interpretations as speculative possibilities distinct from the evidence, respecting the descendant community's request.
