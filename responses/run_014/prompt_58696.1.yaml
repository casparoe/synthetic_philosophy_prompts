answer: |-
  The paired practices in dementia care—life-story work and adherence to advance directives—presuppose a **narrative conception of personal identity** that prioritizes *psychological continuity via autobiographical coherence* as the core of persistence over time. This view implicitly rejects strict biological or moment-to-moment experiential accounts. Here's a precise reconstruction:

  ### Core Presupposition:  
  **The self persists as the *protagonist of an unfolding life narrative***.  
  - **Life-story work** treats the resident as identical to their past self by weaving fragmented utterances into a coherent biographical plot, implying that identity depends on *continuity of narrative agency*. Disruptions (e.g., incoherent remarks) are "gaps" in an ongoing story, not evidence of a new self.  
  - **Advance directives** bind caregivers to the "author" of the directive, presupposing that the *competent past self* retains moral/legal authority over the current narrative. The directive represents the "true" protagonist’s voice, even when contradicted by the present resident.  

  ### What Is Strictly Required:  
  1. **Narrative Coherence as Constitutive**:  
     - The self is not a static entity but an *abstract continuity* defined by the integration of past, present, and (projected) future into a meaningful arc.  
     - *Ruled out*: **Moment-to-moment experiential views** (e.g., Humean bundle theory), where identity resets with each experience. Life-story work would be incoherent if the self were purely present-moment.  

  2. **Past Self as Authoritative**:  
     - The competent past self is the "real" person whose decisions override the current self’s expressions. This requires that psychological traits (values, wishes) are more central to identity than biological continuity.  
     - *Ruled out*: **Strict biological continuity** (animalism). If identity were solely bodily, advance directives would lack moral force—the "person" issuing them would no longer exist.  

  3. **Gaps as Epistemological, Not Ontological**:  
     Disorientation is treated as a *failure of access* to the narrative self, not its dissolution.  

  ### Compatibility Without Presupposition:  
  - The practices are *compatible* with **psychological continuity theories** (e.g., Parfit) but do not strictly require them. They could function pragmatically without metaphysical commitment.  
  - They are *neutral* on whether the narrative self is a social construct or an inner entity but lean toward the former given reliance on external curators (caregivers).  

  ### Tensions Between Practices:  
  - **Cross-Purposes**:  
    Life-story work validates the *current self’s narrative agency* ("reweaving" remarks affirms present identity), while advance directives **subordinate the current self** to the past. This creates an existential dissonance: the resident is simultaneously treated as the same protagonist (by caregivers) and as an "imposter" (by the legal system).  
  - **Moral Conflict**:  
    When a resident voices contrary preferences, the legal practice implies the current self is *inauthentic*; care practices imply it is *continuous but impaired*.  

  ### Implications of Rival Accounts:  
  If the presupposed view were replaced:  

  1. **Biological Continuity (Animalism)**:  
     - **Life-story work**: Would become purely therapeutic (not identity-affirming). Staff might focus on sensory comfort, not biographical coherence.  
     - **Advance directives**: Could be ignored—the "person" who wrote them no longer exists. Guardianship would shift to best-interests determinations by proxies.  
     - *Conflict resolved*: Current contentment would override past directives.  

  2. **Moment-to-Moment Experiential Self**:  
     - **Life-story work**: Would be abandoned as futile. Caregivers would respond only to immediate needs/desires (e.g., "now-self" preferences).  
     - **Advance directives**: Void, as no enduring self exists to bind.  
     - *Conflict resolved*: Present contentment always dominates.  

  3. **Reductionist Psychological View (e.g., Parfit)**:  
     - **Life-story work**: Might continue as empathy-building but without metaphysical weight.  
     - **Advance directives**: Could be overridden if current preferences cause no distress, as psychological connectedness is weak.  
     - *Conflict resolved*: Directives might be advisory, not binding.  

  ### Conclusion:  
  The practices presuppose a **robust narrative identity theory** where the self is a diachronically unified protagonist. Legally, this privileges the *past author*; in care, the *current protagonist*. To resolve tensions:  
  - **Under narrative theory**: Directives could incorporate mechanisms to "update" wishes via designated proxies observing current well-being.  
  - **Under rival theories**: Life-story work would lose its identity-constitutive role, and advance directives would weaken or dissolve.  

  The implicit metaphysics here is not neutral—it quietly demands that we treat persons as their stories, even when the plot frays.
