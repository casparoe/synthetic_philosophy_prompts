answer: |-
  Here are six questions designed to press the defense, with concise follow-ups anticipating dodges:

  1.  **Admissibility Core:** You argue the "admissible evidence" carve-out is essential. But isn't defining admissibility circular? Specifically, why *can't* my knowledge of my own extraordinary "lucky streak" (say, 10 heads in a row with this coin) count as admissible evidence lowering my credence in heads on the 11th flip, if it genuinely makes me doubt the coin's fairness? *(Follow-up: If admissibility depends on *not* including information that "screens off" the chance, doesn't that just presuppose the Principal Principle itself?)*

  2.  **Admissibility vs. Self-Undermining:** If "admissible evidence" excludes anything that *is* evidence *about* the chance, doesn't that make the principle almost vacuous? How do we identify what *is* evidence about the chance without already relying on the principle or some prior notion of chance? *(Follow-up: Doesn't this risk making "admissible" mean simply "evidence that doesn't contradict the chance set"?)*

  3.  **Newcomb's Razor:** You claim the PP resolves Newcomb's by deeming knowledge of the prediction inadmissible. But how does the PP *itself* tell us that? Doesn't labeling prediction-knowledge "inadmissible" here just encode the prior belief that the predictor is highly reliable, which is exactly what drives the one-boxing intuition? *(Follow-up: If the predictor was known to be random, wouldn't prediction-knowledge suddenly become "admissible"? Doesn't this show admissibility relies on predictor priors?)*

  4.  **Operationalizing Admissibility:** Beyond simply excluding direct chance-makers like frequency reports, can you give a *positive*, operational criterion for what evidence *is* admissible? How would I apply this criterion in a novel, complex scenario without begging the question? *(Follow-up: If it requires knowing the chance-fixing facts to identify admissibility, how is this practical?)*

  5.  **Chance Ontology:** Suppose we live in a fundamentally indeterministic universe, but our best physical theories only give us approximate probabilities (like quantum mechanics). If "objective chance" is just our best epistemic handle on indeterminism, doesn't the PP collapse into the advice to match credence to our *best theory's* probabilities? What work is "objective" doing? *(Follow-up: If it's just about best theories, why invoke "objective chance" at all? Isn't this just standard epistemic updating?)*

  6.  **Devil's Advocate:** Isn't the PP potentially self-defeating? If I learn that most agents *violate* the PP in a specific type of situation (e.g., consistently misevaluating risks based on lucky streaks) and achieve better outcomes, why should I adhere to it? Doesn't this pragmatic failure count against it? *(Follow-up: If violating the PP leads to better calibration or success, isn't *that* evidence the PP is wrong for that domain?)*

  **Closing Question:**
  **What conceivable empirical finding or theoretical result would genuinely make you doubt the truth or universal applicability of the Principal Principle? If nothing can, is it a normative principle or an unfalsifiable axiom?** (386 words)
