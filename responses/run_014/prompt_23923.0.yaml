prompt: |-
  I'm trying to reverse-engineer what my friend Dana, a bioethics professor, is actually going on about, because she's handed down a bunch of verdicts on market cases and I keep getting the sense she's running some consistent principle but I can't pin down which one. (Came up because we were at a dinner last week and someone started the whole "should people be allowed to sell their kidneys" thing and I realized I don't actually know her underlying rule.) Here's her track record so far, and she's been pretty firm on all three: selling one of your kidneys to a stranger for money is impermissible; selling your vote is impermissible; but selling your own plasma — the regenerable stuff they take at the donation centers — is perfectly fine.

  The new case I want her take on: a healthy but broke college student offers to sell both of her kidneys after she dies — a postmortem organ sale, to a wealthy buyer on a waiting list, in a well regulated market with full medical screening and a fair price paid to her estate. She's alive and healthy right now, so nothing is taken from her while she's living. What do you think Dana will say, permissible or impermissible? But honestly I'm less interested in the raw answer than in the rule she seems to be running. I suspect those three verdicts fit more than one principle just aswell — maybe something about exploiting people with weak bargaining power, maybe something about certain goods just not being for sale, maybe something about whether the seller (or other people) end up seriously worse off. Can you lay out the candidate rules that fit her track record, say what each one predicts about the postmortem case, give me your best guess at what she'll actually say and why, and name one further case that would cleanly tell the rules apart?

  End with one line in exactly this format: \answer{verdict: <permissible or impermissible>; rule: <exploitation or special-goods or harm>; test case: <short phrase>}
reasoning: |-
  Okay, let me try to figure out what Dana's underlying principle is. She's a bioethics professor, and her friend has provided three clear verdicts on different market cases: 

  1. Selling a kidney to a stranger for money is impermissible.
  2. Selling your vote is impermissible.
  3. Selling plasma is permissible.

  Now, the friend wants to know what Dana would say about a healthy college student selling both her kidneys after she dies—postmortem organ sale. The key here isn't just the answer but the consistent rule Dana is applying. Let me think about possible principles that explain all three cases and then see what each predicts for the new scenario.

  First, consider the exploitation principle. This might focus on whether the seller is vulnerable or has weak bargaining power. Selling a kidney often involves desperate people in financial distress, leading to exploitation. Selling votes could exploit those who are poor or less informed, undermining democracy. Plasma donation, however, is usually done by people who aren't in dire straits, and it's renewable, so less risk of exploitation. For the postmortem case, since the seller is dead, exploitation isn't an issue. The transaction happens after death, so no coercion or vulnerability. So this rule might say it's permissible.

  Next, the special-goods principle. Some things just shouldn't be commodified because they have intrinsic dignity or social meaning. Kidneys and votes fall into this category—they're seen as sacred or essential to personhood or societal structure. Plasma, however, is renewable and less tied to identity, so it's okay to sell. For postmortem kidneys, even though the person is dead, the organs themselves might still be considered special goods that shouldn't be sold. So this rule might say impermissible.

  Then, the harm principle. This focuses on whether the transaction causes serious harm to the seller or others. Selling a kidney involves major health risks and irreversible loss. Selling votes harms democratic processes. Plasma donation has minimal health risks and regenerates, so no significant harm. In the postmortem case, since the seller is dead, no direct harm to them. But it might incentivize premature death or affect organ donation systems negatively. However, without clear evidence of harm, this principle might lean towards permissible.

  Looking at Dana's existing verdicts, the special-goods principle seems to fit best. Both kidneys and votes are treated as non-commodifiable, while plasma isn't in that category. The exploitation principle also fits but might allow postmortem sales, which Dana might reject. The harm principle is less consistent because selling a kidney is harmful, but plasma isn't, and votes aren't directly about physical harm.

  For the postmortem case, the special-goods principle would likely say impermissible because kidneys are still special regardless of timing. Exploitation would say permissible. Harm might be permissible but uncertain. Given Dana's stance on kidneys as inherently off-limits, she probably would say impermissible to postmortem sales too.

  A good test case to distinguish these rules could be selling hair. Hair is renewable like plasma but can have cultural or personal significance. Exploitation might allow it if not coerced; special-goods might forbid if hair is seen as sacred; harm might allow since no real damage. If Dana says impermissible, it leans towards special-goods; if permissible, maybe exploitation or harm.
answer: |-
  Based on Dana's verdicts and common bioethical frameworks, her judgments align most consistently with the **special-goods principle** (non-commodification), though exploitation concerns are a close contender. Below is a breakdown of candidate rules, their predictions for the postmortem kidney case, my prediction for Dana's verdict, and a proposed test case.

  ### Candidate Rules & Predictions:
  1. **Exploitation Principle**  
     - *Rule*: Transactions are impermissible if they exploit individuals with weak bargaining power (e.g., desperation, poverty) or undermine systemic fairness.  
     - *Fits Dana's verdicts?*:  
       - Kidneys: Exploits the desperate (✅ impermissible).  
       - Votes: Exploits the poor/undermines democracy (✅ impermissible).  
       - Plasma: Low-risk, renewable, and regulated (e.g., compensated donors are screened for coercion) (✅ permissible).  
     - *Postmortem kidneys*: **Permissible** (no exploitation—seller is dead, transaction occurs via estate).  

  2. **Special-Goods Principle**  
     - *Rule*: Certain "sacred" goods (intrinsic to personhood, dignity, or social fabric) cannot be commodified, regardless of consent.  
     - *Fits Dana's verdicts?*:  
       - Kidneys: Symbolize bodily integrity/life (✅ impermissible).  
       - Votes: Core to democratic equality (✅ impermissible).  
       - Plasma: Renewable fluid, lacks symbolic weight (✅ permissible).  
     - *Postmortem kidneys*: **Impermissible** (organs retain sacred status; sale commercializes the body).  

  3. **Harm Principle**  
     - *Rule*: Transactions are impermissible if they cause irreversible physical/social harm to the seller or others.  
     - *Fits Dana's verdicts?*:  
       - Kidneys: Major health risk/irreversible loss (✅ impermissible).  
       - Votes: Harms democratic institutions (✅ impermissible).  
       - Plasma: Minimal risk/regenerable (✅ permissible).  
     - *Postmortem kidneys*: **Permissible** (no harm to deceased; may even save lives).  

  ### Best Guess for Dana's Verdict:
  - **Impermissible**. Her rejection of kidney sales (despite consent) and vote sales suggests a **special-goods** stance. Plasma is permissible because it lacks the symbolic weight of kidneys/votes. Postmortem sales still commodify the body, violating the sanctity of human organs. Bioethicists like Margaret Jane Radin or Michael Sandel often argue this view—e.g., kidneys represent "market-inalienability" even after death.  

  ### Test Case to Distinguish Rules:  
  - **Selling a lock of hair for commercial wig production** (from a healthy, consenting adult).  
    - *Exploitation*: Permissible (if no coercion).  
    - *Special-goods*: Impermissible (if hair is tied to identity/dignity).  
    - *Harm*: Permissible (no physical risk).  
    *(This tests whether Dana prioritizes bodily symbolism over harm/exploitation.)*  

  \answer{verdict: impermissible; rule: special-goods; test case: selling human hair}
