answer: |-
  Your feelings are valid and insightful, and they touch on profound questions about ethics, human flourishing, and the balance of a well-lived life. Your discomfort isn't just "moral mediocrity"—it's likely a reaction to several legitimate concerns about your friend's approach. Here's a case for why her lifestyle might feel unappealing beyond mere self-defense:

  ### 1. **The Problem of Moral Monomania**
     - **Narrowness of Experience**: Humans thrive on diversity—play, beauty, humor, intellectual curiosity, and unstructured joy. These aren't frivolous; they cultivate resilience, creativity, and emotional depth. A life stripped of "non-moral" pursuits (art for its own sake, sports fandom, dancing) risks becoming spiritually austere. As philosopher Susan Wolf argues in *Meaning in Life*, a worthwhile life requires both subjective engagement and objective value—not just relentless duty.
     - **Erosion of Authenticity**: Constant moral optimization can mask unexamined motivations (e.g., guilt, avoidance of personal pain, or a need for control). Her lack of laughter and shrinking non-moral interests might signal a loss of spontaneity or joy—even if she frames it as virtue.

  ### 2. **The Sustainability Paradox**
     - **Burnout and Resentment**: Moral acts require emotional resources. Volunteering, donating, and advocacy are draining without replenishment. If she neglects self-care or pleasure, she risks exhaustion or covert resentment—undermining the very goodness she seeks. Your exhaustion around her might mirror her own unacknowledged fatigue.
     - **Diminished Long-Term Impact**: A balanced person sustains their efforts longer. A life without rest or joy can lead to disillusionment, reducing her capacity for good over time. Moral heroism isn't a sprint; it's a marathon requiring fuel beyond duty.

  ### 3. **The Moral Value of "Non-Moral" Goods**
     - **Indirect Ethical Contributions**: Reading novels or watching sports isn't "wasted" time. These activities build empathy (literature), community (shared cultural experiences), and mental health—all foundations for ethical action. As Iris Murdoch noted, attention to art or nature cultivates moral imagination, helping us see others more clearly.
     - **The Danger of Instrumentalization**: If she only values activities *because* they're morally improving, she reduces life to a utilitarian project. This misses intrinsic goods: the joy of dancing, the absurdity of gossip, the catharsis of a trivial novel. These experiences aren't opposed to goodness—they enrich our humanity, making us more compassionate and whole.

  ### 4. **The Shadow of Moral Perfectionism**
     - **Unintended Harm**: Single-minded virtue can subtly pressure others (as you feel). Even without preaching, her example might imply that anything less is failure—a tyranny of the "good." This ignores legitimate limits: we have finite energy, responsibilities, and personal needs.
     - **The Missing Virtue of Balance**: Aristotle's ethics emphasized *eudaimonia* (flourishing), achieved through balance. Courage without prudence becomes recklessness; justice without empathy becomes rigidity. Similarly, a life without lightness or self-compassion risks becoming a vice disguised as virtue.

  ### Are You Rationalizing Complacency? A Nuanced Answer
  Possibly, but not necessarily. Self-reflection is key:
  - **Ask yourself**: Do you avoid her because she *exposes* your choices, or because her energy feels *extractive*? If your life includes meaningful contributions (even small ones) and you value joy without exploiting others, your unease may be ethical intuition, not guilt.
  - **Complacency vs. Self-Acceptance**: There's a difference between avoiding growth and recognizing your limits. Not everyone can (or should) donate 50% of their income. Moral action must align with personal capacity to be sustainable.

  ### A Healthier Perspective
  - **Admire, Don't Idealize**: You can respect her dedication while recognizing her path isn't the only valid one. Moral excellence doesn't require erasing your humanity.
  - **Seek "Good Enough" Morality**: Philosopher Elizabeth Anscombe's concept of "vice-prevention" suggests most people needn't be saints—they just must avoid serious harm. Beyond that, goodness takes many forms.
  - **Reclaim Your Relationship**: If you value her warmth, try naming the dynamic: *"I’m in awe of your energy, but I worry you’re pouring so much into others that you forget yourself. I miss laughing with you like we used to."* This honors her intent while expressing care.

  ### Final Thought
  A good human life isn't a moral spreadsheet—it’s a tapestry woven with duty, love, joy, sorrow, and rest. Your friend’s choices may reflect genuine goodness, but if they sacrifice breadth for height, they risk building a skyscraper on a fragile foundation. Your discomfort isn’t complacency; it’s wisdom whispering that morality untempered by humanity becomes a cage. As poet Kae Tempest writes: *"The meaning of life is to nurture your joy and your duty in equal measure."* Both matter.
