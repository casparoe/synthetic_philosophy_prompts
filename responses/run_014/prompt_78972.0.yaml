prompt: |-
  I'm presenting a paper at an AI safety reading group next month, and I need Q&A prep rather than a defence. My thesis: the obfuscated-arguments problem is not a defect that better judges will eventually fix but the structural ceiling of AI safety via debate — a debate protocol can only certify what its judge could in principle have checked alone, so debate redistributes verification work rather than extending the range of behaviour we can supervise. I rest this on a distinction of my own between the obfuscation gap (arguments the judge cannot evaluate at all) and the deference gap (arguments the judge can evaluate but weights wrongly because they are persuasive), and I claim that only the first is fatal to the approach. The audience is mostly complexity theorists who think in terms of interactive proofs, verifier power, and soundness against a cheating prover, plus two empiricists who run debate experiments with language models and will want to know why their results don't already refute me. Draft the questions this particular room will ask, ordered by how much damage they do, phrased in their vocabulary, each with what I should say back and where the reply is soft. Give it to me as exactly five numbered items, no introduction and no conclusion, each a sentence or two, with the last being the question I'm hoping nobody asks.
