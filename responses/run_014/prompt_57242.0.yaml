prompt: |-
  I lead a small modelling team at a national health technology assessment agency. Roughly once a month we must put a number on something for which there is essentially no data — the probability of a rare but serious adverse event from a newly approved device, the between-site variance of an outcome, the rate at which a treatment effect decays after a trial ends — and our submissions are required to state a prior that "assumes nothing." I know that requirement is incoherent: a distribution uniform on the probability is not uniform on the odds, or the log-odds, or the reciprocal, and the defensible posterior means can differ by an order of magnitude. Our reviewers include two statisticians who will catch every equivocation and a lay panel that reads only the summary.

  Please write a decision procedure my analysts can run before any such parameter goes into a submission: the questions to ask in order; what counts as a sufficient answer at each; the criteria a proposed non-informative prior must satisfy, including which invariances it must respect and which parameterization must be declared on the record; the step at which the procedure must stop and log that indifference is unavailable rather than simulate it; and the points where the choice is handed to a person because it reflects institutional risk appetite rather than fact. Every step must be executable in under an hour by someone with one course in Bayesian statistics.

  Then apply it to three cases: an adverse event with zero occurrences in 400 patient-years; the between-site variance of a continuous outcome; and an annual decay rate extrapolated ten years beyond the trial. In at least one of these the procedure must deliver an answer my team will not like — for instance forbidding the number they have already drafted — and state what they must submit instead. Close with what the procedure cannot deliver, and a four-sentence plain-language paragraph explaining to the lay panel why "we assumed nothing" is never an available claim.
reasoning: |-
  We are designing a decision procedure for choosing a prior when there is essentially no data, and the requirement is to "assume nothing". We note that no prior is truly non-informative, and the choice of parameterization matters. The procedure must be executable in under an hour by someone with one course in Bayesian statistics.

  The procedure will consist of the following steps:

  1. **Define the Parameter Space**: 
     - Ask: What is the parameter of interest and what are its possible values (the support)? 
     - Sufficient answer: A clear mathematical definition of the parameter and its domain (e.g., probability p in [0,1], variance σ² in (0, ∞), decay rate λ in (0, ∞)).
     - If the domain is unbounded (e.g., real line, positive reals) or bounded (e.g., [0,1]), note it.

  2. **Identify Symmetries and Invariances**:
     - Ask: What transformations of the parameter leave the model invariant? (e.g., for a probability, is the model symmetric in success and failure? for a location parameter, is it translation invariant? for a scale parameter, is it scale invariant?)
     - Sufficient answer: A list of transformations that are considered natural for the problem (e.g., for a probability, the logit transformation; for a variance, the log transformation; for a decay rate, the reciprocal might be a natural alternative). Also, consider if there are any physical or theoretical symmetries (e.g., for a decay rate, the half-life is 1/λ, so if we reparameterize by half-life, the problem might be symmetric in log(λ) or log(half-life)).
     - Criteria: The prior should be invariant under these transformations (i.e., the prior should be uniform on the transformed scale if that is the invariant one).

  3. **Check for Group Invariance**:
     - If the parameter is a location parameter, then a uniform prior over the real line is invariant under translation.
     - If the parameter is a scale parameter, then a prior proportional to 1/σ (i.e., uniform on log(σ)) is invariant under scale transformations.
     - If the parameter is a probability, then the Jeffreys prior for a Bernoulli trial is Beta(1/2, 1/2) which is invariant under the transformation p -> 1-p. However, note that uniform on p is not invariant under reparameterization to log-odds.

  4. **Consider the Likelihood**:
     - Ask: What is the form of the likelihood? (e.g., binomial for event probability, normal for mean with known variance, etc.)
     - The Jeffreys prior is defined as the square root of the Fisher information. It is invariant under reparameterization. However, computing the Fisher information might be beyond the one-hour constraint. Therefore, we rely on common cases:
          - For a binomial likelihood (probability p): Jeffreys prior is Beta(1/2,1/2).
          - For a normal likelihood with known mean and unknown variance: Jeffreys prior for variance is 1/σ² (which corresponds to uniform on log(σ)).
          - For a Poisson likelihood (rate λ): Jeffreys prior is 1/√λ (which is an improper prior).

  5. **Decide Between Proper and Improper**:
     - If the prior is improper (does not integrate to a finite number), then we must check that the posterior is proper. If there is no data, then an improper prior will lead to an improper posterior, which is invalid. Therefore, in the absence of data, we must use a proper prior.
     - However, in our case, we sometimes have some data (like 0 events in 400 patient-years) but the data are sparse. The procedure must stop and log that indifference is unavailable if we cannot find a proper prior that is non-informative in the required sense.

  6. **Institutional Risk Appraisal**:
     - At this step, if the non-informative prior is improper and there is no data (or very little data) to make the posterior proper, then we must use a proper prior that is weakly informative. This is where institutional risk appetite comes in. We must hand the choice to a person (or a panel) to decide on a weakly informative prior that reflects the agency's risk tolerance.

  7. **Documentation**:
     - Declare the parameterization and the prior chosen, including the invariance properties it satisfies. Also, document any deviations (e.g., if we had to use a weakly informative prior due to impropriety, note that and the rationale).

  The procedure must stop and log that indifference is unavailable if:
     - The parameter space is unbounded and the natural invariant prior is improper, and there is no data (or insufficient data to make the posterior proper). Then we must use a weakly informative prior and note that the choice reflects risk appetite.

  Now, we apply the procedure to three cases.

  **Case 1: Adverse event with zero occurrences in 400 patient-years**

  Parameter: probability of adverse event per patient-year (p). 
  Domain: [0,1]

  Symmetries: The natural symmetry is not necessarily in p and 1-p because an adverse event is rare and serious. However, the model for the number of events is Poisson (or binomial if we consider a fixed number of patient-years). Actually, we have patient-years, so we model the count as Poisson. The rate λ (expected number per patient-year) is the parameter. 
  Reparameterize: The parameter is λ (rate) with domain (0, ∞).

  Likelihood: Poisson. The number of events in 400 patient-years is 0, so the likelihood is exp(-400λ).

  Invariances: For a Poisson rate, the Jeffreys prior is 1/√λ (scale invariant under power transformations? Actually, the Fisher information for λ is 1/λ, so Jeffreys prior is 1/√λ). However, note that the Poisson model is invariant under scaling of the unit of time? If we change the unit of time (e.g., from patient-years to patient-days), then λ would change by a constant factor. Therefore, we require scale invariance: if we change the scale by c, then the prior for λ should transform as p(λ) dλ = p(λ') dλ' (with λ' = cλ). This leads to p(λ) proportional to 1/λ. But note: Jeffreys prior for Poisson is 1/√λ, which is not the same as 1/λ. However, the scale invariant prior for a rate is 1/λ (which is the prior that corresponds to uniform on log(λ)). 

  But note: the Jeffreys prior for Poisson is 1/√λ, and it is not the same as the scale invariant prior 1/λ. So which to choose? We must consider the group invariance. The scale invariant prior (1/λ) is often used for scale parameters. However, the Jeffreys prior is designed for invariance under reparameterization. 

