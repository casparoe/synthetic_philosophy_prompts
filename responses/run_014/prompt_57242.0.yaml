  The claim "we assumed nothing" is never available because every statistical model requires some starting point. Even when we try to be as neutral as possible, the mathematical representation of ignorance depends on how we define the parameter (like the chance of an event versus the logarithm of that chance). These choices affect the results. Therefore, we must be transparent about the prior we chose and why, acknowledging that it represents a best effort at neutrality but is not entirely assumption-free.
answer: |-
  ### Decision Procedure for Non-Informative Priors  
  **Goal**: Select a prior for a parameter with no data, ensuring transparency, invariance, and compliance with institutional standards.  
  **Time Limit**: Each step ≤ 10 minutes; total ≤ 60 minutes.  
  **Team Skill Level**: One introductory Bayesian course.  

  #### Step-by-Step Procedure  
  1. **Define the Parameter Space**  
     - **Question**: What is the parameter (e.g., probability, variance, rate)? What are its mathematical bounds (e.g., [0,1], [0,∞), ℝ)?  
     - **Sufficient Answer**: Clear description of the parameter (e.g., "adverse event probability \(p\) in [0,1]").  
     - **Stop If**: Parameter space is unbounded (e.g., [-∞,∞]) *and* no data exists. **Log**: "Indifference unavailable: unbounded space with no data."  

  2. **Identify Natural Symmetries**  
     - **Question**: What transformations preserve the problem's structure? (e.g., odds vs. probability, log vs. linear scale).  
     - **Sufficient Answer**: List of symmetries (e.g., "probability \(p\) and odds \(p/(1-p)\) are equivalent interpretations").  
     - **Criteria**: The prior must be invariant under these transformations.  
     - **Stop If**: No symmetries are agreed upon. **Log**: "Indifference unavailable: no consensus on symmetries."  

  3. **Select Parameterization**  
     - **Question**: Which parameterization aligns with known symmetries? (e.g., log-odds for probabilities, log-scale for variances).  
     - **Sufficient Answer**: One declared parameterization (e.g., "log-odds \(\theta = \ln[p/(1-p)]\)").  
     - **Record**: Document the chosen parameterization and its justification.  

  4. **Apply Group Invariance**  
     - **Question**: Does the parameter behave as a location, scale, or probability?  
       - **Location** (e.g., mean): Uniform prior.  
       - **Scale** (e.g., variance): \(1/x\) prior (uniform on log-scale).  
       - **Probability**: Beta(0.5,0.5) (Jeffreys prior).  
     - **Sufficient Answer**: Prior derived from group invariance.  
     - **Stop If**: Prior is improper (e.g., \(1/x\) on [0,∞]) *and* no data exists. **Log**: "Indifference unavailable: improper prior with no data."  

  5. **Institutional Risk Appraisal**  
     - **Question**: Does the prior imply extreme or implausible risks? (e.g., high probability of catastrophic events).  
     - **Handoff to Person**: If risk is unacceptable (e.g., prior mean > agency tolerance), escalate to institutional panel.  
     - **Output**: Weakly informative prior (e.g., truncated range, conservative mean).  

  6. **Final Validation**  
     - **Criteria**: Prior must be:  
       - Invariant under declared symmetries.  
       - Proper if no data exists.  
       - Documented with parameterization.  
     - **Output**: Prior for submission or "indifference unavailable" with log.  

  ---

  ### Application to Cases  
  #### Case 1: Adverse Event Probability (0 events in 400 patient-years)  
  - **Step 1**: Parameter = event rate \(\lambda\) (per patient-year); space [0,∞).  
  - **Step 2**: Symmetry: Scale-invariance (changing time units should not affect prior).  
  - **Step 3**: Parameterization: Log-scale (\(\ln\lambda\)).  
  - **Step 4**: Group invariance: Scale parameter → Prior \(1/\lambda\) (improper).  
    - **But**: Data exists (0 events) → Posterior proper. Use Jeffreys prior for Poisson: \(\pi(\lambda) \propto \lambda^{-1/2}\).  
  - **Step 5**: Posterior mean = \(0.00125\)/year. Team may dislike this (drafted uniform prior on \(p\) gives \(0.0025\)).  
  - **Submit**: \(\pi(\lambda) \propto \lambda^{-1/2}\), posterior mean \(0.00125\). **Do not submit** uniform prior on \(p\).  

  #### Case 2: Between-Site Variance (\(\sigma^2\)) of Continuous Outcome  
  - **Step 1**: Parameter = \(\sigma^2\); space [0,∞).  
  - **Step 2**: Symmetry: Scale-invariance (e.g., converting measurement units).  
  - **Step 3**: Parameterization: Log-scale (\(\ln\sigma^2\)).  
  - **Step 4**: Group invariance: Scale parameter → Prior \(1/\sigma^2\) (improper).  
    - **Stop**: No data exists → Posterior improper. **Log**: "Indifference unavailable."  
  - **Handoff to Person**: Choose weakly informative prior (e.g., half-Cauchy(0,10) for \(\sigma\)).  
  - **Submit**: Half-Cauchy(0,10) for \(\sigma\), with note: "Based on institutional risk tolerance."  

  #### Case 3: Annual Decay Rate (\(\delta\)) Extrapolated 10 Years Beyond Trial  
  - **Step 1**: Parameter = decay rate \(\delta\); space [0,∞).  
  - **Step 2**: Symmetry: Scale-invariance (e.g., rate in years vs. months).  
  - **Step 3**: Parameterization: Log-scale (\(\ln\delta\)).  
  - **Step 4**: Group invariance: Scale parameter → Prior \(1/\delta\) (improper).  
    - **Stop**: No data beyond trial → Posterior improper. **Log**: "Indifference unavailable."  
  - **Handoff to Person**: Choose weakly informative prior (e.g., Gamma(0.1, 0.1) favoring slow decay).  
  - **Submit**: Gamma(0.1, 0.1) with note: "Conservative choice reflecting institutional expertise."  

  ---

  ### Limitations of the Procedure  
  - Cannot deliver "true" indifference: All priors encode transformations (e.g., uniform \(p\) ≠ uniform log-odds).  
  - Cannot handle unbounded parameters without data: Forces proper priors or institutional input.  
  - Cannot resolve conflicting symmetries: Requires subjective choice of parameterization.  

  ### Explanation for Lay Panel  
  "We cannot claim we 'assumed nothing' because every prior choice involves trade-offs. For example, assuming no information about a probability is mathematically different from assuming no information about the odds of that probability. These choices impact results, so we use principled rules to minimize assumptions. When rules fail, we use conservative defaults approved by agency experts. Transparency, not neutrality, is our standard."
