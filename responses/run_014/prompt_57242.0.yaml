  The procedure cannot deliver a truly non-informative prior because every prior carries some information. In particular, when there is no data and the parameter space is unbounded, the procedure must resort to weakly informative priors that require institutional input. It also cannot resolve the fundamental incoherence of "assuming nothing" because the choice of parameterization always introduces information.

