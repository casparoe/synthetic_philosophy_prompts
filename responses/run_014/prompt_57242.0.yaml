  **Summary of the procedure's answers:**

  - Case 1 (adverse event rate): We use the Jeffreys prior (improper) 1/√λ. Since we have data (0 events in 400 patient-years), the posterior is proper. The posterior mean is 0.00125 per patient-year. The team might not like this because they might have wanted to use a uniform prior on p (which would be Beta(1,1)) and then the posterior mean would be 1/402 ≈ 0.0025 (if we model as binomial). But we used Poisson and Jeffreys prior. We must use the Poisson model and Jeffreys prior because it is invariant.

