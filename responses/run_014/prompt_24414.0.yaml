prompt: |-
  I've been trying to figure out where I actually land on the line between "you should do this" and "youd be a hero for doing it, but I can't fault you for not doing it," because I keep getting inconsistent answers. Let me dump my gut calls and you tell me what principle, if any, is doing the work underneath.

  Giving up my seat on a packed bus to an old lady: I think I should. If I don't, people give me looks, but I'm not a bad person. And no special praise for doing it either — it's just the minimum, the floor.

  Donating a kidney to a dying stranger I've never met: praiseworthy, and I'm not a bad person for not doing it. Big gap from the bus.

  A drowning kid in a shallow pond, I'd just get my shoes wet: I should save them, and if I don't I'm a bad person. (The famous one, right.)

  Saving that same kid when it costs me my career: praiseworthy, but I'm not a bad person for walking away.

  Now here's where I get stuck. Donating a kidney to a dying stranger feels supereragatory — great, but no blame for not. But donating a kidney to my own dying child? I feel like refusing that is blameworthy, like a failure of obligation, not just a missed chance to be a hero. Same act, same cost to me, the only thing that changed is who's on the table. I can't reconcile that with the stranger case at all.

  And a second thing that bugs me: I think a person who never does anything above the minimum — never gives up a seat, never donates, never helps anyone past what they're strictly required to — is a pretty bad person. But if "above the minimum" acts are by definition not required, then what exactly am I blaming them for? They did everything they were supposed to.

  And I can't find the line on money. I feel like giving, say, $100 a month to a charity that actually saves lives is something I should do. $1,000 a month feels like heroism. But $500? I genuinely can't say, and I don't feel like there's a fact of the matter I'm just failing to see.

  So: is there a principle that gets all of this, or at least most of it? What does it say about cases I haven't listed — like a professional lifeguard, or someone who's contractually obligated to help? And honestly, which of my calls above does your principle force me to drop?

  Format request: lead with your bottom line in the first sentence, then give me the reasoning. No preamble, no restating my question.
reasoning: |-
  Okay, the user is wrestling with moral obligations and supererogatory acts—actions that are good but not required. They provided several scenarios: giving up a bus seat, donating a kidney to a stranger versus their child, saving a drowning kid at different costs, and charitable donations. Their core confusion lies in reconciling why some actions feel obligatory while others don't, despite similar personal costs.

  First, I need to identify the underlying principle. The user mentioned special relationships changing obligations, like the kidney donation to a child versus a stranger. That points to role-based duties. Also, proximity matters in the drowning child case—being physically close creates a direct responsibility. 

  The user is also conflicted about how consistent minimal effort affects moral character. If someone never goes beyond the minimum, are they blameworthy? This suggests that character isn't just about meeting obligations but also about cultivated virtues. Habitual refusal to help might indicate selfishness, which is a character flaw.

  For the donation amounts, the user struggles with quantifying obligation. Here, reasonable sacrifice relative to one's capacity seems key. What's reasonable varies by individual circumstances, making rigid thresholds impractical. 

  The user's deeper need might be seeking a coherent framework to reduce their moral uncertainty. They want to know which of their intuitions hold up and which need adjustment. They might also feel guilt or anxiety about their own choices, looking for justification or clarity.

  Applying the three-part principle: relationship roles explain the kidney cases—parental duty vs. no duty to strangers. Proximity covers the drowning child. For the bus seat, it's low cost plus social norms, making it expected but not highly obligatory. Character judgment comes in when someone consistently avoids even low-cost help, showing a lack of empathy.

  In the lifeguard example, contractual obligations add a role-based duty, making failure to act blameworthy. For donations, the principle avoids fixed amounts, focusing on what's reasonable without hardship. This flexibility addresses the user's uncertainty about $500/month.

  The user might need to accept that some cases, like moderate donations, lack clear-cut answers, relying on personal judgment. Their intuition about the uncharitable person being "pretty bad" aligns with character evaluation, even if no single act is obligatory. They should drop the idea that supererogatory acts are entirely free from expectation in close relationships—their child's case shows obligation trumps cost.
answer: |-
  **The underlying principle is that moral obligations arise from relationship roles, proximity, and cost-benefit proportionality, while character is judged by habitual willingness to exceed bare minimums when costs are low.**

  1.  **Role-Based Obligations:** Relationships create duties. Donating a kidney to your *child* is obligatory because parents have a fundamental role-based duty to preserve their child's life when possible. No such role exists with a stranger, making that donation supererogatory. Similarly, a professional lifeguard *is* blameworthy for not attempting a rescue (breach of role), unlike a bystander facing the same risk.

  2.  **Proximity & Urgency:** Direct, immediate ability to prevent severe harm at low cost creates an obligation ("shallow pond"). If the cost becomes catastrophic (your career), saving the child shifts to supererogatory – the cost-benefit ratio tips too far. The bus seat is low-cost proximity help, making it expected (a weak obligation/social norm), but failure isn't deeply blameworthy.

  3.  **Character vs. Single Acts:** Someone who *habitually* avoids even trivial help (bus seat, small donations when able) reveals a character flaw – selfishness or deficient empathy. They haven't violated a specific rule per act, but their consistent pattern makes them "a pretty bad person." Character is evaluated across patterns, not isolated supererogatory choices.

  4.  **Reasonable Sacrifice & Money:** Obligation requires *reasonable* sacrifice relative to your capacity. Giving $100/month if you're comfortable is likely obligatory; $1,000/month if it causes hardship is heroic. $500/month's status depends *entirely* on your finances – there's no universal dollar threshold. The principle is "give significantly to effective charities *without imposing severe hardship on yourself or dependents*." What's "reasonable" is context-dependent.

  **Your intuitions largely hold, but you must drop/modify:**

  *   **"No special praise for the bus seat":** While not heroic, minor social praise for meeting weak obligations is normal. Your "people give me looks" acknowledges this social expectation.
  *   **"They did everything they were supposed to" (for the minimally compliant person):** True for *specific acts*, but your judgment they are "a pretty bad person" is correct based on character, not individual obligation breaches.
  *   **"Same act, same cost" (kidney donation):** You correctly sense the difference lies *entirely* in the relationship role (parent-child), not the act/cost itself. This *is* reconcilable: the role creates the obligation where none existed for the stranger.

  **Application to New Cases:**

  *   **Contractual Obligation (e.g., Lifeguard):** Explicitly assumed role = strong obligation. Failure is blameworthy unless cost is catastrophically disproportionate (e.g., certain death).
  *   **Stranger Neighbor vs. Distant Stranger:** Helping a neighbor in immediate, observable distress (e.g., fall on icy path) carries more expectation (proximity/social tie) than donating to a stranger across the globe, even if the global need is greater. Proximity lowers the barrier for what constitutes "reasonable" help.
