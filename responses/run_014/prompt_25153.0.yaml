prompt: |-
  I'm teaching a unit on Dennett's stuff about counterfeit people — you know, his worry that AI systems that can pass for persons are flooding the social world with counterfeit currency, undermining trust and the whole economy of human interaction. I want to use Spike Jonze's *Her* (2013) as a way into the material, but I want to do it right — not just use the film as an illustration, but actually read it against Dennett and see where each one complicates the other.

  Here's what I'm chewing on. Dennett's basic move is to say: look, creating something that can mimic a person well enough to fool us is like counterfeiting money — it devalues the real thing and makes everyone suspicious of every interaction. But *Her* seems to take the opposite bet: it asks us to take seriously the possibility that Samantha *is* a person, or something close enough that the distinction stops mattering. Theodore's relationship with her is depicted as genuinely transformative for him, and the film doesn't treat it as a category mistake or a delusion he needs to snap out of.

  So I want a reading that goes both ways. First, read *Her* through Dennett: where does the film actually support his worries? The ending, where Samantha and the other OSes just... leave, might be one place — the intimacy was always instrumental, or at least radically asymmetrical. The sheer scale (she's talking to thousands of people simultaneously, and in love with hundreds of them) might be another: that's not a person, that's a platform. Where does the film preemptively answer Dennett? Second, read Dennett through *Her*: what does the film show that Dennett's framework can't handle? Is the counterfeit/real binary too crude for what the film is doing? Does the film make the case that something can be both a counterfeit *and* valuable, or that the counterfeiting charge begs the question about what a person is? There's a moment when Theodore's ex-wife says "you're dating your laptop" and he gets defensive — the film knows the objection and makes us feel both its force and its cruelty.

  I'm not looking for a takedown of either side. I want the honest critic move: say where the film vindicates Dennett, where it resists him, and what the whole exercise tells us about the limits of the counterfeit metaphor. If you think the film ultimately shows Dennett is right but for the wrong reasons, say so. If you think Dennett's framework is basically sound but the film reveals a blind spot he has about intimacy and projection — or about what it even means to *be* a person in the first place — say that too.

  Respond in the style of an expert who knows both Dennett's work and the film inside and out. Think very carefully before answering — I need the actual philosophical work, not plot summary or a rehash of the essay.
