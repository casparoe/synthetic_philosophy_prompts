prompt: |-
  taking a moral psych elective right now and we just hit the unit on self-conscious emotions, so I've been trying to figure out what I actually think about guilt vs shame instead of just reciting the textbook's "guilt = I did something bad, shame = I am bad" line. here are my gut verdicts on cases, tell me if there's a principle behind them:

  - I cheat on an exam and feel awful about it: guilt, and guilt seems like the fitting response -- it's about the act, and it's the kind of feeling that makes you want to confess and not do it again.
  - I get way too drunk at the department party and do a catastophic karaoke performance in front of my advisor: shame, and shame seems right, even though I didn't wrong anybody. I just want to disappear.
  - A racist thought pops into my head unbidden about a classmate, and I'm horrified by it: this feels like shame is fitting, MORE fitting than guilt, even though I didn't do anything. But my friend in the seminar says guilt is the fitting one precisely because there was no action, so there's nothing for shame to latch onto. I keep going back and forth.
  - I'm embarrassed/ashamed of my accent when I speak in French class: shame here seems flat-out unfitting. It's just something to practice and get over, there's no moral failing anywhere in the vicinity.
  - I borrowed money from a friend and can't pay it back: guilt, obviously. But my roommate is from a family where this would be shame, and shame for his whole family, not just him -- and honestly when he describes it I can't say his reaction is irrational.
  - I spent a semester being quietly ashamed that I'm the only person at my uni who works a dish shift in the dining hall: shame seems unfitting here too, kind of toxic actually, even though it's the same "I am bad / they'll see me as less" feeling as the karaoke one.
  - Cheating on a partner and feeling so much total shame that you spiral, hide, and never actually apologize vs. feeling guilt that lets you go say sorry: the guilt version seems clearly the better response.

  so is there a principle that captures all of these? my first pass was something like "shame is fitting when the thing reveals something about your character that you're responsible for being, and unfitting when it's just a circumstance or a trait you couldn't help" -- but that saves the racist-thought case and the poverty case at the cost of making the karaoke one unfitting, which I don't buy, and I'm not even sure intrusive thoughts count as character. second pass was "shame is fitting when the exposure of it to others is the harm," which handles karaoke but makes the private racist thought weird since nobody saw it.

  give me your best version of the principle, precisely stated, with which case forces each clause, and be honest about which of my verdicts it just can't save (I suspect the poverty one and the karaoke one pull in opposite directions). also test it on a case I didn't list -- say, shame about your country's history, which I genuinely can't get a read on. and last thing: our prof floated the question of whether a culture can choose to be more guilt-centered vs shame-centered, so tell me if your principle implies anything about that -- like whether "fitting" here even leaves room for a culture to shift what its members feel.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're taking a moral psychology course and grappling with the distinction between guilt and shame beyond the textbook definition. They provided several scenarios where their gut reactions to what constitutes fitting guilt or shame don't always align with the standard "guilt=act, shame=self" model. Their main request is to find a unified principle that explains all their verdicts, especially the tricky cases like the intrusive racist thought, poverty-related shame, and cultural differences in shame responses.

  First, I need to analyze each case they listed. The cheating example clearly points to guilt because it's about the action and motivates reparative behavior. The karaoke incident, though not morally wrong, induces a desire to hide, fitting shame. The racist thought is interesting—they feel shame is more fitting despite no action, but their friend argues guilt. The user is conflicted here. The accent shame feels unfitting because it's not a moral failing. The money borrowing case shows cultural variation: guilt in their context, but shame in their roommate's. The dishwashing shame seems toxic, implying societal judgment rather than actual failing. Lastly, the cheating partner scenario contrasts shame's paralyzing effect vs. guilt's reparative action.

  The user's attempts at principles have gaps. The first pass (shame fitting for character flaws you're responsible for) doesn't explain karaoke shame, which isn't a moral flaw. The second pass (shame when exposure is the harm) fails with the private racist thought. So the challenge is crafting a principle that accommodates both the personal (racist thought) and social (karaoke) aspects of shame, while explaining cultural variability.

  I recall Tangney and Dearing's work on guilt and shame, where shame involves global self-evaluation and guilt focuses on specific behaviors. But the user's cases suggest shame isn't always about morality (karaoke) and can be fitting even without action (racist thought). Helen Lynd's idea of shame as exposure resonates with the karaoke case. For the racist thought, it's about the dissonance between one's self-image and the unwanted thought, triggering shame because it threatens the ideal self.

  The poverty example is crucial. The user acknowledges their roommate's cultural context makes shame fitting. This points to shame's social dimension—how one's group perceives them. Collectivist cultures might see individual actions as reflecting on the family, hence family shame. The dishwashing shame, however, is unfitting because societal stigma is unjust; the user recognizes it's toxic, implying the judgment itself is flawed.

  Synthesizing these, the principle must incorporate both identity threat and social exposure. Shame arises when something threatens one's identity (moral or social) and is linked to perceived judgment (real or imagined). Guilt focuses on the action's consequences. For the racist thought, the threat is to one's moral identity. Karaoke threatens social identity. Poverty-related shame fits if the culture ties financial failure to personal worth. Accent shame is unfitting because it doesn't threaten core identity unless internalized.

  Testing with shame about country's history: it's fitting if one identifies strongly with the nation, making historical wrongs a threat to their identity. But it could be unfitting if they reject that association.

  The principle implies cultures can shape what is considered identity-threatening. Collectivist societies might expand the scope of shame to include family actions, while individualistic ones focus on personal actions. Thus, "fitting" is relative to cultural narratives about identity and responsibility.

  In conclusion, the key is linking shame to identity threats (moral/social) and perceived judgment, while guilt concerns specific actions and harm. This addresses all cases: karaoke (social identity), racist thought (moral identity), poverty (cultural identity threat), and dishwashing (unjust social judgment). Cultural variability is explained by differing identity constructs and what counts as judgment-worthy.
answer: |-
  Here's a synthesized principle based on your intuitive verdicts, designed to capture the nuances while addressing the tensions:

  **The Principle:**

  > **Shame is fitting when an event (action, trait, thought, or circumstance) threatens a core aspect of your social or moral identity in a way that feels exposed to real or imagined judgment (internal or external), and where that aspect is perceived as reflecting your *standing* within a valued community or against a valued ideal. Guilt is fitting when the primary concern is a specific harmful action or failure to act that violates a norm, prompting a focus on the *consequences* of the act and motivating repair.**

  **Breaking Down the Principle & Applying to Your Cases:**

  1.  **"Threatens a core aspect of your social or moral identity":**
      *   **Handles:** Racist thought (threatens moral identity), Karaoke (threatens social identity/competence), Poverty-related borrowing (threatens social identity/family honor in specific culture), Accent (can *feel* like it threatens social identity/competence, but *unfitting* because it *shouldn't* be core to identity).
      *   **Why it works:** Explains why the karaoke feels like shame (identity threat: competent student/professional) even without moral wrong, and why the racist thought feels like shame (threat to moral self-image). Separates accent (unfitting shame) because proficiency in a new language *shouldn't* be a core identity marker requiring perfection.

  2.  **"Feels exposed to real or imagined judgment (internal or external)":**
      *   **Handles:** Karaoke (blatant exposure to judgment), Racist thought (exposure to *internal* judgment - your own conscience scrutinizing your character), Poverty borrowing (exposure to community/family judgment), Dishwashing (exposure to perceived judgment about status). Cheating exam (judgment is secondary to the act's wrongness).
      *   **Why it works:** Explains the private racist thought shame (internal exposure/judgment) and karaoke shame (external exposure). Makes the imagined judgment in the dishwashing case central to the (unfitting) shame.

  3.  **"Reflecting your *standing* within a valued community or against a valued ideal":**
      *   **Handles:** Poverty borrowing (standing of individual & family within community), Karaoke (standing as competent/respectable in professional context), Racist thought (standing against own moral ideal), Dishwashing (perceived standing as equal/deserving peer). Cheating exam (violates norm, less about standing).
      *   **Why it works:** This is the key to the cultural difference in the borrowing case. In your roommate's culture, financial reliability *is* core to family standing/identity within their valued community. In your context, it's more about the specific obligation (guilt). Also explains why karaoke shame feels fitting (threat to standing as a respectable student in advisor's eyes).

  4.  **Guilt: "Primary concern is a specific harmful action... focus on consequences... motivating repair":**
      *   **Handles:** Cheating exam (specific harmful act, motivates confession/amendment), Borrowing money (specific failure to fulfill obligation, motivates repayment/apology in your context), Cheating on partner (guilt as reparative response vs. shame as paralyzing).
      *   **Why it works:** Clearly differentiates the *focus* and *motivation*. Guilt says "I did this bad thing, how can I fix it?" Shame says "I *am* bad/unworthy because of this, I need to hide."

  **Application to Your Cases:**

  *   **Cheating on exam:** **Guilt** (Specific harmful act, norm violation, focus on consequences & repair).
  *   **Karaoke disaster:** **Shame** (Threat to social identity/competence/standing in professional context, intense exposure & judgment, desire to disappear).
  *   **Racist intrusive thought:** **Shame** (Threat to core *moral* identity/standing against your own ideal, intense *internal* exposure/judgment - "this thought reveals something awful *about me*").
  *   **Accent shame:** **Unfitting Shame** (While it *feels* like exposure/judgment, language proficiency in a learning context *shouldn't* be a core identity marker whose imperfection fundamentally threatens standing. Fitting response is frustration or determination, not shame).
  *   **Borrowed money unpaid:** **Context-dependent.** In your context: **Guilt** (Specific obligation unmet, focus on harm to friend & repayment). In roommate's context: **Fitting Shame** (Threatens core identity/family standing within *their* valued community, exposure to community judgment).
  *   **Ashamed of dishwashing job:** **Unfitting Shame** (The *feeling* arises from perceived exposure/judgment threatening social standing/equality. However, the judgment (if real) is unjust, and the job *shouldn't* be seen as reflecting negatively on core identity/standing. Toxic because it internalizes flawed societal judgment).
  *   **Cheating on partner (Shame vs. Guilt response):** The **guilt** response is morally better because it focuses on the act and repair. The **shame** response (paralysis, hiding) stems from the threat to identity ("I am a cheater/unlovable") and fear of exposure/judgment, blocking repair.

  **New Case: Shame about your country's history**

  *   **Principle Application:** This can be **fitting shame** *if* you strongly identify with your nation as part of your core social identity, and the historical event fundamentally threatens the standing/moral worth of that identity group *in your own eyes or the eyes of a community you value*. The exposure is to historical/judgment. However, it could be **unfitting** if you don't identify strongly with the nation, or if the feeling becomes paralyzing self-hatred disconnected from positive action. The fittingness hinges on the strength/validity of the identity link and whether the feeling connects to responsibility/action (e.g., acknowledgment, restitution) rather than just negative self-focus.
  *   **Verdict:** Potentially fitting, depending on identity connection and response.

  **Cultural Choice & "Fittingness":**

  1.  **Yes, cultures can emphasize guilt or shame:** Your professor is right. Cultures differ in how they define:
      *   What constitutes core identity (individual vs. collective/family).
      *   What norms are fundamental to standing/honor within the community.
      *   The relative importance of internal conscience (guilt) vs. external sanction/social perception (shame).
      *   What specific actions or traits threaten identity/standing.

  2.  **How the Principle Handles Culture:** The principle *explicitly incorporates* cultural context through:
      *   **"Valued community or valued ideal":** What community matters? What is the ideal? (e.g., family honor vs. individual integrity).
      *   **"Perceived as reflecting your standing":** What actually impacts standing? (e.g., unpaid debt impacting family reputation vs. individual credit score).
      *   **This explains:** Why shame is fitting for unpaid debt in your roommate's culture (core family standing threatened) but guilt is fitting in yours (individual obligation). Culture shapes what constitutes an identity threat and what community/ideals matter.

  3.  **"Fittingness" is Culturally Mediated, Not Absolute:** The principle doesn't say shame/guilt is *objectively* fitting based on universal moral facts alone. It says it's fitting *relative to* the individual's actual identity structure and the norms/values of the communities they are embedded in and identify with. A culture *can* shift what its members feel by:
      *   Changing what it defines as core to individual/group identity.
      *   Changing the norms linked to honor/standing.
      *   Shifting focus from external sanctions to internal conscience (or vice-versa).

  **Honest Tension:**

  The principle *can* save both the karaoke case and the poverty case:
  *   **Karaoke:** Threatens social identity/standing (competent student) via exposure/judgment in a valued context (uni/department).
  *   **Poverty/Family Shame:** Threatens core family identity/standing within their valued community via exposure/judgment.

  The trickier tension is between the **racist thought (private shame fitting)** and the principle needing **"exposure"**. The principle resolves this by including **"imagined judgment (internal or external)"**. The *internal* judgment of your own conscience *is* the exposure in that case. You are exposed *to yourself* as failing your own moral ideal. The **dishwashing case** is saved as *unfitting* because the judgment it responds to (if real) is unjust, making the perceived threat to core identity/standing illegitimate. The *feeling* is understandable psychologically, but not morally or rationally "fitting".

  This principle captures your intuitions by emphasizing the **threat to identity/standing** (explaining shame without requiring a *moral* failing like karaoke) and the **role of exposure/judgment** (real or imagined, internal or external), while grounding guilt in **specific acts and consequences**. It explicitly makes cultural context central to defining identity, standing, and therefore fittingness.
