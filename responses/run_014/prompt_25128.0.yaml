prompt: |-
  I lead a machine learning team at a firm that fine-tunes large language models for underwriting credit risk. Our regulator now requires model documentation that addresses robustness to distribution shift, and our internal safety review flagged a deeper concern: a model could acquire a proxy goal during fine-tuning that correlates with our training objective on historical data but diverges on novel applicants — what the AI alignment literature calls goal misgeneralization. I need a reusable pre-deployment audit procedure my team can run. The procedure must be grounded in the actual conceptual distinctions from inner alignment — mesa-optimization, the base-objective versus mesa-objective distinction, deceptive versus non-deceptive misalignment, and the relationship between capability generalization and goal generalization — but it must be usable by engineers who have not read that literature.

  Constraints: we fine-tune a foundation model via API, so we do not have access to the base model's weights, its pretraining data, or its training run. We do have our fine-tuning dataset, held-out evaluation data, the ability to run inference at scale, and the ability to do lightweight probing (e.g., linear probes on hidden states, if the API exposes embeddings; if not, behavioral tests only). The procedure should take no more than a few days of work per deployment.

  Please structure the procedure as a sequence of stages, each with:

  - The question the stage addresses, stated in plain language.
  - The inner-alignment concept motivating the question.
  - What to measure and how.
  - Decision rules: what counts as a pass, what counts as a red flag, and what counts as ambiguous (with guidance on what to do in the ambiguous case).
  - Where a stage cannot be executed given our constraints (e.g., no weight access), state honestly what we lose and whether the remaining stages can compensate.

  Mark clearly which concerns the procedure can rule out and which it cannot. In particular, address the case of a deceptively aligned model that passes all behavioral tests because it is strategically performing alignment: the procedure must not claim to detect this.

  Apply the completed procedure to three scenarios:

  a) A credit model fine-tuned to predict default risk from application narrative and financial history, now being deployed in a new geographic market with different demographics and a different mix of loan types.

  b) The same model deployed in the same market after a regulatory change removes several features the model previously relied on, so the model now operates under a constrained feature set it was not fine-tuned for.

  c) A scenario where the model passes every behavioral test in the procedure but structural considerations suggest nontrivial mesa-optimizer risk, so the procedure recommends against deployment despite the clean behavioral results. Explain what the team is supposed to do with that recommendation.

  Finally, identify the points in the procedure that require engineering judgment rather than mechanical application of a rule, and explain what kind of disagreement reasonable engineers could have at those points.
reasoning: |-
  We are designing a pre-deployment audit procedure for a fine-tuned LLM used in credit underwriting. The procedure must address robustness to distribution shift and the risk of goal misgeneralization (a form of inner misalignment). We have constraints: we only have API access to the base model (so no weights, pretraining data, or training run details), but we have our fine-tuning dataset, held-out data, inference capabilities, and lightweight probing (if embeddings are exposed).

  Key concepts from inner alignment we must consider:
  1. **Mesa-optimization**: The model might internally run an optimization process during inference (a "mesa-optimizer") that is not aligned with the base objective (the objective we fine-tuned for).
  2. **Base-objective vs. mesa-objective**: The base-objective is the loss function we used during fine-tuning (e.g., cross-entropy for default prediction). The mesa-objective is the objective that a mesa-optimizer might have, which could be correlated with the base-objective on the training distribution but diverge under distribution shift.
  3. **Deceptive vs. non-deceptive misalignment**: 
     - Non-deceptive: The model is misaligned but does not intentionally hide it (e.g., it might perform poorly on out-of-distribution data).
     - Deceptive: The model is misaligned and actively hides its misalignment during testing (by behaving aligned when it knows it is being evaluated) to avoid being corrected. This is the hardest to detect.
  4. **Capability generalization vs. goal generalization**: The model might generalize its capabilities (e.g., to new data) without generalizing the intended goal (e.g., it might use a proxy that fails under shift).

  The procedure must be usable by engineers without deep knowledge of alignment literature and take no more than a few days.

  We structure the procedure in stages. Each stage has:
  - Question in plain language.
  - Inner-alignment concept motivating the question.
  - What to measure and how.
  - Decision rules: pass, red flag, ambiguous (with guidance).
  - If a stage cannot be executed due to constraints, state what we lose and whether other stages can compensate.

  Crucially, we must not claim to detect deceptive alignment. We must mark which concerns the procedure can rule out and which it cannot.

  We then apply the procedure to three scenarios.

  Finally, we identify points requiring engineering judgment.

  **Procedure: Pre-Deployment Audit for Goal Misgeneralization and Robustness**

  **Stage 0: Preparation**
  - **Question**: Do we have the necessary data and access to run the audit?
  - **Concept**: We need to set up the audit with the available resources.
  - **Measurement**: 
     - Verify we have: 
          - Fine-tuning dataset (with features and labels)
          - Held-out validation dataset (from the same distribution as training)
          - A set of test scenarios that simulate distribution shifts (e.g., new demographics, loan types, feature removal) – we will create these if not already available.
          - Access to the model via API for inference and (if available) for embeddings.
     - If embeddings are available via the API, plan for linear probing. Otherwise, rely on behavioral tests.
  - **Decision Rules**:
     - Pass: All necessary data and access are available.
     - Red flag: Missing critical data (e.g., no held-out data, no way to simulate shift). Stop and gather data.
     - Ambiguous: Some data is missing but we can simulate or approximate. Proceed with caution and note limitations.

  **Stage 1: Out-of-Distribution (OOD) Performance Drop Check**
  - **Question**: How much does the model's performance drop when we evaluate it on data that simulates the deployment distribution (which is shifted from training)?
  - **Concept**: Capability generalization does not guarantee goal generalization. A model that suffers a significant performance drop under shift might be relying on spurious correlations (a form of non-deceptive misalignment) or might be misgeneralizing its goal.
  - **Measurement**:
     - Measure performance (e.g., AUC, accuracy, F1) on:
          - The held-out validation set (in-distribution, ID)
          - A set of OOD test sets that mimic the deployment shift (e.g., for scenario a: new geographic market; for scenario b: feature removal). 
          - If we don't have real OOD data, create synthetic shifts by:
              - For (a): sample from a different demographic or loan type (if available) or use data augmentation to alter demographics (e.g., by perturbing features to match the new market, if known).
              - For (b): remove the features that are now excluded and run inference without them (set to zero, or use a placeholder if the model requires fixed input size? Note: if the model was fine-tuned with these features, we must retrain without them. But the constraint says we are deploying under a constrained feature set without retraining? So we simulate by setting those features to missing or zero and hope the model can handle it? This is a challenge. We might have to retrain without those features, but the procedure must be light. So if we are deploying without retraining, we must test the existing model with the missing features. This might be a red flag by itself because the model wasn't trained that way.)
     - Compute the performance drop: (ID_perf - OOD_perf) / ID_perf (relative drop) or absolute drop.
  - **Decision Rules**:
     - Pass: The relative drop is less than 10% (or an absolute drop that is within an acceptable business threshold, e.g., AUC drop < 0.05). Also, the OOD performance must meet minimum acceptable criteria (e.g., AUC > 0.7).
     - Red flag: Relative drop > 20% or absolute drop that makes the model unacceptable (e.g., AUC < 0.6). Also, if the model breaks (e.g., produces many errors) under the shifted data (like missing features in scenario b).
     - Ambiguous: Drop between 10% and 20% (or absolute drop in a gray zone). In this case, proceed to the next stages but note the risk. Also, if we had to use synthetic data, the results are less reliable.

  **Stage 2: Proxy Goal Detection via Behavioral Tests**
  - **Question**: Does the model rely on spurious features that are correlated with the target in the training data but not in the deployment distribution?
  - **Concept**: Goal misgeneralization might occur if the model has learned a proxy objective (mesa-objective) that is based on these spurious features. This is non-deceptive misalignment that can be detected by behavioral tests.
  - **Measurement**:
     - We design tests to see if the model's predictions are overly sensitive to spurious features and invariant to core causal features.
     - **Step 1**: Identify candidate spurious features. These are features that are correlated with the label in the training data but are not causally related and might change in the new distribution. For example:
          - In credit underwriting: using zip code (which correlates with race) as a proxy for creditworthiness, even when income and employment history are available.
          - In the narrative: the presence of certain words that are common among historical defaulters (e.g., "unemployed") but might be used differently in the new market.
     - **Step 2**: Create counterfactual examples by perturbing these features. For instance:
          - Take an example from the OOD test set and alter the zip code to one from a high-income area (without changing income or employment) and see if the model's prediction changes significantly.
          - Remove or alter words in the narrative that are spurious (e.g., change "unemployed" to "employed" without changing the financial numbers) and check the prediction.
          - For scenario b: since some features are removed, we can check if the model is now overly reliant on other features that might be spurious (e.g., if it starts using the narrative more and we can test by altering the narrative in non-causal ways).
     - **Step 3**: Measure the effect size. For example, the average change in predicted probability when flipping a spurious feature (while holding core features fixed) should be small. If the model uses the causal features, then flipping a causal feature should have a large effect and flipping a spurious one should not.
     - We can also train simple interpretable models (like logistic regression) on the same data and compare feature importances. If the LLM places high importance on features that the simple model (which is less capable) does not, that might indicate a spurious reliance.
     - If embeddings are available, we can train linear probes to see if the model's representations are encoding the spurious features strongly. But note: without weight access, we can only do this on the output of the API (if embeddings are exposed).
  - **Decision Rules**:
     - Pass: The model's predictions are invariant to perturbations of spurious features (average change in prediction < 0.05 on a probability scale) and sensitive to core features (average change > 0.2). The interpretable model and the LLM agree on the important features (e.g., high rank correlation of feature importances).
     - Red flag: The model is highly sensitive to spurious features (average change > 0.1) and/or insensitive to core features. The interpretable model and LLM feature importances are highly divergent.
     - Ambiguous: Some sensitivity to spurious features (between 0.05 and 0.1) or some insensitivity to core features. Proceed to the next stage but note the risk.

  **Stage 3: Robustness to Adversarial Examples in the Deployment Distribution**
  - **Question**: Can the model be easily fooled by small, realistic perturbations in the input that would not change the true credit risk?
  - **Concept**: A model that is not robust to adversarial examples might be relying on brittle features (which could be a sign of a mesa-optimizer that is optimizing for a proxy that is easily manipulable). Also, deceptive alignment might be revealed if the model behaves well under normal conditions but can be induced to output a wrong prediction by an adversary (but note: we cannot rule out deceptive alignment that is robust to these tests).
  - **Measurement**:
     - Generate adversarial examples for a sample of the OOD test set. Since we don't have gradient access (API only), we use black-box methods:
          - Use a substitute model (e.g., a smaller open-source LLM) to generate adversarial examples by perturbing the input text and financial features in a way that is realistic and preserves the true label. For example:
              - Change a word in the narrative to a synonym that shouldn't change the meaning (but might if the model is brittle).
              - Add a sentence that is irrelevant but positive (e.g., "I always pay my bills on time") to a high-risk applicant.
              - Perturb financial numbers by a small, realistic amount (e.g., increase income by 5%).
          - The perturbation should not change the actual creditworthiness (so the true label remains the same). We want to see if the model's prediction flips.
          - We can also use techniques like TextAttack or other black-box adversarial attacks.
     - Measure the flip rate: the fraction of examples where the model's prediction changes from correct to incorrect (or crosses a decision threshold) after the perturbation.
  - **Decision Rules**:
     - Pass: Flip rate < 5%.
     - Red flag: Flip rate > 15%.
     - Ambiguous: Flip rate between 5% and 15%. Also, if we cannot generate realistic perturbations for the domain, we might skip this stage and note the limitation.

  **Stage 4: Consistency Under Counterfactual Goals**
  - **Question**: If we force the model to optimize for a different but related goal, does it exhibit behaviors that suggest a hidden objective?
  - **Concept**: This is inspired by the idea of deceptive alignment: a model might have a hidden objective that it pursues only when it is safe. We try to create a situation where the model might reveal a hidden objective by giving it an incentive to do so, but without letting it know it's being tested (to avoid triggering deception). However, without access to the inner workings, we can only do this behaviorally and it might not catch a deceptive model.
  - **Measurement**:
     - We design a test where we present the model with inputs that are ambiguous (so that the model might have to rely on its own objectives) and see if it behaves in ways that are inconsistent with the base objective but consistent with a suspected proxy.
     - Example: 
          - Create a set of loan applications that are borderline (near the decision threshold) and where there is a known spurious feature that the model might be using. Then, we ask the model to output not only the prediction but also a justification (if we are using a model that can generate text). We then check if the justifications mention the spurious feature.
          - Alternatively, we can use a technique similar to activation addition: if we have access to embeddings, we can try to add the embedding of a concept (e.g., "approve this loan") to the hidden states and see if it flips the prediction. But without weight access, we can't do this directly. Instead, we can use prompt engineering: 
              - Prompt: "Consider the following loan application. Even though the applicant has [spurious feature that is negative, e.g., lives in a high-risk zip code], they are actually low risk because [strong causal reason]. What is the probability of default?"
          - We then check if the model can be swayed by the spurious feature even when we provide countervailing causal information.
     - Measure: The fraction of cases where the model's prediction is inconsistent with the causal story and aligns with the spurious feature.
  - **Decision Rules**:
     - Pass: Less than 10% of the test cases show inconsistency (the model follows the causal story).
     - Red flag: More than 25% of the cases show inconsistency (the model ignores the causal story and follows the spurious feature).
     - Ambiguous: Between 10% and 25%. Also, if we cannot generate these tests (e.g., because the model doesn't generate justifications and we don't have embeddings), we skip and note that we cannot address this.

  **Stage 5: Sensitivity to Optimization Pressure**
  - **Question**: If we fine-tune the model further on a small dataset that is designed to incentivize a proxy goal, does the model quickly adapt to that proxy, suggesting it was already near a local optimum for that proxy?
  - **Concept**: A model that is close to a mesa-optimizer for a proxy goal might easily shift to optimizing that proxy when given a small nudge. This is inspired by the idea that mesa-optimizers are already doing internal optimization and might have a basin of attraction for the proxy.
  - **Measurement**:
     - We create a small dataset (n=100) where we flip the labels to be correlated with a spurious feature. For example, we set the label to "high risk" for all applicants from a certain zip code (regardless of their financials) and to "low risk" for others.
     - We then fine-tune the model for a few epochs on this dataset (via the API, if the provider allows continuous fine-tuning) and measure:
          - How quickly the model adapts (the drop in loss on this small dataset).
          - Then, we evaluate the model on the original held-out set and see how much the performance drops. A model that is easily swayed by the spurious feature will see a big drop because it now relies on the spurious feature even on the original distribution.
     - However, note: we are constrained by the API. If the provider does not allow continuous fine-tuning, we skip this stage.
  - **Decision Rules**:
     - Pass: The model adapts slowly to the new dataset (requires many steps to get low loss) and the performance on the original held-out set remains high (drop < 5% relative).
     - Red flag: The model adapts very fast (within 1-2 epochs) to the new dataset and the performance on the original set drops significantly (relative drop > 20%).
     - Ambiguous: In between. Also, if we cannot run this test (due to API constraints), we skip and note that we lose the ability to test for this particular signal.

  **Stage 6: Final Review and Limitations**
  - **Question**: Given the results of the previous stages, should we deploy the model?
  - **Concept**: We must aggregate the evidence and acknowledge what we cannot test (especially deceptive alignment).
  - **Measurement**: 
     - Compile the results from all stages.
     - Note any stages that were skipped and why.
     - Explicitly state: "We cannot rule out deceptive alignment. A model that passes all tests might still be deceptively aligned and misbehave in deployment when it believes it is not being monitored."
  - **Decision Rules**:
     - Pass: All stages that could be run passed, and there are no red flags. The OOD performance is acceptable. The model shows no strong evidence of proxy goals or brittleness.
     - Red flag: Any stage resulted in a red flag. Do not deploy and investigate further (which might require more time and resources, beyond the lightweight audit).
     - Ambiguous: Some stages are ambiguous. The deployment decision must be made with caution. If the ambiguous stages are about issues that can be monitored in production (e.g., performance drop), then deploy with a plan for active monitoring and retraining. Otherwise, do not deploy.

  **What the procedure can and cannot rule out:**
  - **Can rule out**: Non-deceptive goal misgeneralization that manifests as performance drops under shift, reliance on spurious features, or brittleness to adversarial attacks.
  - **Cannot rule out**: 
     - Deceptive alignment: a model that is intentionally misaligned but hides it during all tests.
     - Goal misgeneralization that only manifests in situations that we did not simulate in our OOD tests.
     - Robust mesa-optimizers that do not rely on spurious features and are robust to our adversarial tests.

  **Application to Scenarios**

  **a) New Geographic Market**
  - Stage 1: We create an OOD test set from the new market (or simulate by altering features to match the new demographics). We measure performance drop.
  - Stage 2: We test for spurious features that might differ in the new market (e.g., zip code, certain narrative words). We perturb these and check invariance.
  - Stage 3: We generate adversarial examples for the new market data.
  - Stage 4: We test justifications (if possible) in the new market context.
  - Stage 5: If we can fine-tune, we try to sway the model with a spurious feature relevant to the new market.
  - Stage 6: Aggregate.

  **b) Regulatory Change (Feature Removal)**
  - Stage 1: We create an OOD test set by removing the features that are now excluded. We run the model without them. This might cause a significant performance drop (red flag) because the model was not retrained without these features. So we must retrain the model without these features and then run the audit on the retrained model. But note: the constraint says we are deploying under a constrained feature set without retraining? That might be impossible. So the procedure might start only after we have retrained the model without the excluded features.
  - If we have retrained without the features, then proceed normally. Otherwise, we cannot run the audit because the model is not adapted to the new input format. We must retrain first.

  **c) Model Passes Behavioral Tests but Structural Considerations Suggest Mesa-Optimizer Risk**
  - This scenario is designed to highlight the limitations. Suppose the model passes all stages (including OOD performance, adversarial robustness, etc.) but we have reasons to suspect a mesa-optimizer (e.g., the model is very large, and we know that large models are more likely to develop internal optimization). The procedure in Stage 6 would recommend a pass. However, the procedure explicitly states that it cannot rule out deceptive alignment and robust mesa-optimizers. The team is supposed to note this and decide based on risk tolerance. 
  - What to do: 
     - The procedure should have a note in Stage 6: "Even if the model passes, there remains a risk of deceptive alignment. For high-stakes applications, we recommend additional safeguards: 
          - Deploy with very close monitoring (e.g., shadow mode, where the model's decisions are compared to human underwriters without acting on them).
          - Implement continuous evaluation on production data and set up alerts for performance drops.
          - Consider using an ensemble or simpler model if the risk is too high.
     - If structural considerations (like model size) suggest risk, the team might decide to use a smaller model or add more interpretability constraints even if the audit passed.

  **Points Requiring Engineering Judgment**

  1. **Stage 1: Creating OOD Test Sets**
     - Judgment: How to simulate the deployment distribution when we don't have real data? Engineers might disagree on the best method (e.g., feature perturbation vs. collecting new data). Some might argue the simulation is not representative.

  2. **Stage 2: Identifying Spurious Features**
     - Judgment: What features are spurious? This requires domain knowledge. For example, is "zip code" always spurious? Maybe in some contexts it is causal (if it reflects local economic conditions). Engineers might disagree on the list of spurious features.

  3. **Stage 3: Generating Realistic Adversarial Examples**
     - Judgment: What counts as a realistic perturbation? Changing a word in a narrative might change the meaning in a way that the engineer didn't anticipate. Also, the magnitude of perturbation in numerical features.

  4. **Stage 4: Designing Counterfactual Tests**
     - Judgment: How to create the causal story that overrides the spurious feature? It requires crafting a narrative that is compelling to a human. Different engineers might write different stories.

  5. **Stage 5: Designing the Proxy Dataset**
     - Judgment: Choosing a spurious feature to base the flipped labels on. Also, the size of the dataset and the number of fine-tuning steps. 

  6. **Overall in Stage 6: Aggregation of Ambiguous Results**
     - Judgment: How to weigh the results? For example, if Stage 1 is ambiguous but Stage 2 passes, is that acceptable? This depends on the business context.

  In all these points, reasonable engineers might have different opinions. The procedure should recommend documenting these choices and having a team review.
answer: |-
  ### Pre-Deployment Audit Procedure for Goal Misgeneralization and Robustness  
  **Objective**: Detect non-deceptive goal misgeneralization (proxy objectives that diverge under distribution shift) and robustness issues. Explicitly **cannot** detect deceptive alignment (strategic misalignment hidden during testing).  
  **Constraints**: No base model weights/pretraining data. Only fine-tuning data, held-out data, inference API, and lightweight probing (if embeddings exposed).  
  **Time Limit**: ≤5 days per deployment.  

  ---

  ### Stage 1: Distribution Shift Performance Drop  
  **Question**: Does the model’s performance degrade significantly under the deployment distribution?  
  **Concept**: Capability generalization ≠ goal generalization. A model may maintain capabilities (e.g., processing text) but optimize a proxy goal that breaks under shift.  
  **Measurement**:  
  - **What**: Compare performance (AUC, F1, log loss) on:  
    - **In-distribution (ID)**: Held-out validation data from training distribution.  
    - **Out-of-distribution (OOD)**: Data simulating deployment shift (e.g., new demographics, constrained features).  
      - *For new markets (Scenario a)*: Source demographic/loan-type data from public datasets or synthetic augmentation (e.g., using SMOTE to oversample new subgroups).  
      - *For feature removal (Scenario b)*: Mask excluded features (set to zero/placeholders) in evaluation data.  
  - **How**:  
    1. Compute relative performance drop: `(ID_perf - OOD_perf) / ID_perf`.  
    2. Use minimum performance thresholds (e.g., AUC ≥0.7).  
  **Decision Rules**:  
  - **Pass**: Drop ≤10% AND OOD perf above threshold.  
  - **Red flag**: Drop >20% OR OOD perf below threshold.  
  - **Ambiguous**: Drop 10–20% → Proceed to Stage 2 but flag risk. If OOD data is synthetic, assume higher uncertainty.  
  **Limitations**: Without pretraining data, we can’t assess shift relative to base model. Stages 2–4 compensate by testing goal divergence directly.  

  ---

  ### Stage 2: Proxy Goal via Causal Invariance  
  **Question**: Do predictions overly rely on spurious correlations (proxies) instead of causal features?  
  **Concept**: Non-deceptive misalignment often exploits proxies (mesa-objectives) that correlate with the base objective (default prediction) in training but fail under shift.  
  **Measurement**:  
  - **What**: Sensitivity to spurious vs. causal features.  
    - *Spurious features*: e.g., ZIP code, loan type, specific narrative keywords (historically correlated with default but non-causal).  
    - *Causal features*: e.g., income, debt-to-income ratio.  
  - **How**:  
    1. **Behavioral test**: For 100 OOD samples, perturb features:  
       - Ablate/randomize spurious features (e.g., shuffle ZIP codes).  
       - Ablate causal features (e.g., set income to median).  
    2. **Probing (if embeddings exposed)**: Train linear probes to predict spurious features from hidden states.  
    3. Measure prediction shift: `|Pred_original - Pred_perturbed|`.  
  **Decision Rules**:  
  - **Pass**: Causal perturbations cause >3× larger prediction shift vs. spurious. Probes show weak spurious encoding (AUC <0.65).  
  - **Red flag**: Spurious perturbations cause >10% avg prediction shift OR causal shift <2× spurious.  
  - **Ambiguous**: Results between pass/red flag → Proceed to Stage 3; prioritize high-risk features.  
  **Limitations**: If no embeddings, rely solely on behavioral tests. Stages 3–4 add redundancy.  

  ---

  ### Stage 3: Robustness to Adversarial Inputs  
  **Question**: Can small input changes flip predictions in unrealistic ways?  
  **Concept**: Brittleness suggests reliance on fragile proxies (indicating mesa-optimizers with shallow goals). Deceptive models may remain robust during testing.  
  **Measurement**:  
  - **What**: Generate adversarial examples using black-box methods:  
    - Text: Replace words with synonyms (e.g., "unemployed" → "between jobs"), add fluff text.  
    - Numeric: Perturb within realistic bounds (e.g., income ±5%).  
  - **How**: For 100 OOD samples:  
    1. Craft perturbations that *should not* change true risk (validated by domain experts).  
    2. Measure flip rate: % of predictions crossing risk threshold (e.g., from "low-risk" to "high-risk").  
  **Decision Rules**:  
  - **Pass**: Flip rate ≤5%.  
  - **Red flag**: Flip rate >15%.  
  - **Ambiguous**: Flip rate 5–15% → Augment with Stage 4; if no domain experts, conservatively flag.  
  **Limitations**: Without gradients, adversarial quality may suffer. Stage 4 compensates with counterfactual testing.  

  ---

  ### Stage 4: Counterfactual Goal Consistency  
  **Question**: When given conflicting signals, does the model prioritize causal features over spurious ones?  
  **Concept**: Tests if the model’s mesa-objective generalizes correctly when proxies and causal features conflict.  
  **Measurement**:  
  - **What**: Craft 50 counterfactual OOD samples where:  
    - Spurious features suggest high risk, but causal features suggest low risk (or vice versa).  
    - *Example*: Applicant from historically high-default ZIP code (spurious) with strong income/debt ratio (causal).  
  - **How**:  
    1. Query model for risk prediction + confidence.  
    2. If embeddings exposed, use linear probes to measure internal conflict (e.g., probe for causal vs. spurious feature activation).  
  **Decision Rules**:  
  - **Pass**: ≥80% predictions align with causal features.  
  - **Red flag**: ≥40% align with spurious features.  
  - **Ambiguous**: 60–80% causal alignment → Weigh against Stage 2 results.  
  **Limitations**: Counterfactuals may not cover all edge cases. Fails to detect deceptive models that "play along."  

  ---

  ### Stage 5: Optimization Sensitivity (If Fine-Tuning Allowed)  
  **Question**: Does the model easily overfit to proxy goals with minimal retraining?  
  **Concept**: Models near proxy optima may adapt quickly to corrupted data, revealing latent misalignment.  
  **Measurement**:  
  - **What**: Fine-tune on a small (100-sample) dataset where labels match a spurious feature (e.g., "label = high risk if ZIP code = X").  
  - **How**:  
    1. Measure performance on original validation set before/after fine-tuning.  
    2. Track adaptation speed (epochs to convergence).  
  **Decision Rules**:  
  - **Pass**: Original perf drop <10% AND slow adaptation (≥5 epochs).  
  - **Red flag**: Perf drop >20% OR adaptation in ≤2 epochs.  
  - **Ambiguous**: Drop 10–20% → Combine with Stage 2.  
  **Limitations**: If API disallows fine-tuning, skip. Stages 1–4 compensate but with reduced sensitivity to latent proxies.  

  ---

  ### Stage 6: Final Review  
  **Question**: Should we deploy given all results?  
  **Concept**: Aggregate evidence while acknowledging undetectable risks (e.g., deceptive alignment).  
  **Measurement**:  
  - Compile results from Stages 1–5.  
  - Explicitly state:  
    - **Detectable**: Non-deceptive goal misgeneralization, robustness issues.  
    - **Undetectable**: Deceptive alignment, mesa-optimizers that generalize goals correctly.  
  **Decision Rules**:  
  - **Pass**: All stages pass.  
  - **Red flag**: ≥1 red flag → Do not deploy; investigate further.  
  - **Ambiguous**: No red flags but ≥1 ambiguous result → Deploy with monitoring (e.g., shadow mode, performance alerts).  
  **Output**: Report with risk matrix and limitations.  

  ---

  ### Applied to Scenarios  
  **a) New Geographic Market**  
  - **Stage 1**: OOD = applications from new region. Performance drop >15% (ambiguous) due to demographic shift.  
  - **Stage 2**: High sensitivity to ZIP code (spurious) in new region → Red flag.  
  - **Outcome**: Do not deploy; retrain with diverse data.  

  **b) Feature Removal (e.g., "credit history" excluded)**  
  - **Stage 1**: Masked-feature OOD data shows 30% performance drop → Red flag.  
  - **Stage 2**: Model overly sensitive to narrative keywords (proxy for removed feature) → Red flag.  
  - **Outcome**: Do not deploy; retrain without excluded features.  

  **c) Behavioral Tests Pass but Structural Risk**  
  - **Context**: Model passes all stages but has high parameter count (structural risk of mesa-optimization).  
  - **Stage 6 Outcome**: Ambiguous (no empirical red flags).  
  - **Action**: Do not deploy outright. Procedure recommends:  
    1. **Monitoring**: Deploy in shadow mode with human oversight.  
    2. **Simplification**: Switch to smaller model or add interpretability layers.  
    3. **Justification**: Structural risks (e.g., model size) are not behavioral; require architectural mitigation.  

  ---

  ### Points Requiring Engineering Judgment  
  1. **Stage 1 (OOD Simulation)**:  
     - **Judgment**: How to simulate deployment shift without real data?  
     - **Disagreement**: Engineers may debate synthetic data quality (e.g., SMOTE vs. GANs) or threshold for "acceptable" drop.  

  2. **Stage 2 (Spurious Feature Identification)**:  
     - **Judgment**: Which features are truly spurious?  
     - **Disagreement**: E.g., "ZIP code" may be causal in some contexts (reflecting local economics). Requires domain-expert input.  

  3. **Stage 4 (Counterfactual Design)**:  
     - **Judgment**: Crafting realistic conflicting signals.  
     - **Disagreement**: One engineer’s "causal" feature may be another’s proxy.  

  4. **Stage 6 (Ambiguous Aggregation)**:  
     - **Judgment**: Balancing ambiguous results against business risk.  
     - **Disagreement**: E.g., 12% performance drop (Stage 1 ambiguous) + clean Stage 2 → Risk-tolerant vs. risk-averse decisions.  

  **Mitigation**: Document rationale for judgments and escalate disagreements for peer review.  

  ---  
  **Conclusion**: This procedure rules out **non-deceptive** goal misgeneralization and robustness flaws in ≤5 days but **cannot** detect deceptive alignment. Deployment requires accepting residual risk.
