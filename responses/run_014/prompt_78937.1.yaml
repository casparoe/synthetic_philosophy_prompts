answer: |-
  Your frustration is completely valid—you've hit on a profound and under-discussed pattern in the philosophy of science. This isn't just "idealization" in the generic sense; it's a specific *species* of reduction that lands on an **empty idealization**. There's no universally agreed-upon term, but the most precise descriptor is **singular limit explanation** (or **singular asymptotic reduction**). Let's dissect it with boundaries, contrasts, and your frictionless plane test.

  ### Core Concept: Singular Limit Explanation
  - **What it is**: A reduction where a higher-level phenomenon (e.g., sharp phase transition, exact irreversibility) is derived from a lower-level theory *only* in an unattainable mathematical limit (e.g., \(N \to \infty\), \(t \to \infty\), \(\hbar \to 0\)). The limit is **singular**: the behavior *at* the limit is qualitatively different from any finite case. Real systems are "smeared" approximations that never reach the ideal state.
  - **Key markers**:
    1. The reduction *works rigorously* at the limit.
    2. The limit is *physically unattainable* (infinite systems, zero constants).
    3. The real phenomenon is *asymptotically approachable* but never identical to the ideal.
    4. There is a *qualitative discontinuity* between finite systems and the limit (e.g., no true phase transition exists for finite \(N\)).

  ### Boundary Cases: What's In vs. Out
  | **IN** (Singular Limit Cases)                     | **OUT** (Related but Distinct)                          |
  |---------------------------------------------------|---------------------------------------------------------|
  | **Sharp boiling point** (\(N \to \infty\))        | **Frictionless plane** (deliberate simplification)      |
  | **Exact irreversibility** (\(N \to \infty\) or \(t \to \infty\)) | **Ideal gas law** (\(V \gg\) molecule size)       |
  | **Classical mechanics** (\(\hbar \to 0\))         | **Point mass** (negligible size)                        |
  | **Bose-Einstein condensation** (\(N \to \infty\)) | **Incompressible fluid** (approximable closely)         |

  #### Why Your Gut is Right: Frictionless Plane is Different
  - **Frictionless planes** are **regular idealizations**: We can construct systems where friction is arbitrarily small (e.g., air hockey tables). The idealization is a *practical convenience*, not a mathematical singularity. Real systems can get *very close*, and the model degrades *continuously* as friction increases.
  - **Boiling point sharpness** is a **singular idealization**: No finite system exhibits a true discontinuity. At \(N = 10^{23}\), water *still* boils over a range (tiny, but finite). The sharpness *only* exists at \(N = \infty\)—a state that is *in principle* unreachable. The smearing isn't due to "defects" but inherent finitude.

  ### Common Misidentifications & Clarifications
  1. **Weak Emergence** (often conflated):  
     - Weak emergence claims higher-level behavior *is derivable* from lower levels but may be computationally intractable.  
     - **Contrast**: Your cases *are* derivable and tractable (e.g., stat mech derives phase transitions), but they land on an empty set. The issue isn't computational cost but ontological absence.

  2. **Autonomy of Higher-Level Sciences**:  
     - Debates whether chemistry/biology "reduce" to physics or have independent laws.  
     - **Contrast**: You’re granting reduction *succeeds mathematically* but notes it describes a "ghost" (the ideal limit), leaving the actual phenomenon only approximately captured.

  3. **Generic Idealization**:  
     - Frictionless planes or point masses are "controlled approximations": we *can* approach them closely, and they simplify reality by *removing* features.  
     - **Contrast**: Singular limits *add* a feature (sharpness, exactness) that *doesn’t exist* without the unattainable limit. They aren't simplifications but *extrapolations to unreality*.

  ### Philosophical Implications
  - **Nancy Cartwright’s "How the Laws Lie"**: She argues fundamental laws (e.g., quantum mechanics) describe capacities in highly idealized scenarios, not actual behavior. Your cases fit: stat mech "lies" by describing what water *would* do if infinite, not what it *does* do.
  - **Ontic vs. Epistemic**: Is the ideal boiling point a "real" entity we approximate (Platonism), or a useful fiction (instrumentalism)? Your phrasing ("defective instance") suggests realism about the ideal—a debated stance.
  - **Why Science Uses These**: They isolate *essences* (e.g., "boiling" as a discontinuity) and provide stability. Finite smearing is "noise" to the idealized "signal."

  ### Proposed Terminology
  If "singular limit explanation" feels too technical, these capture nuances:
  - **Empty-target reduction** (emphasizes the unreachable goal).  
  - **Asymptotic ghost** (highlights the ideal's non-existence).  
  - **\(\infty\)-type idealization** (contrasts with "0-type" like frictionless planes).

  ### In Practice
  When teaching boiling points, you might say:  
  *"The sharp boiling point is a *model artifact* from imagining infinite water molecules. Real water is 'smeared' because it’s finite—like how a pixelated image approximates a sharp line. The model isn’t wrong; it’s describing an ideal we never see, but which helps us understand why large systems boil near 100°C."*

  This pattern reveals a deep truth: science often explains phenomena by *creating idealized twins* that don’t exist, precisely because reality is messy and finite. Your annoyance is a philosopher’s insight—don’t let non-answers dismiss it.
