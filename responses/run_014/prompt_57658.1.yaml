  3. **Cruxes**: Sub-questions that, if settled, would move at least one party.
  4. **Concrete Cases for Cruxes**: For each crux, a concrete case or argument both sides agree bears on it, with each side's prediction and what would count as a concession.
  5. **Closing Diagnosis**: Commitment to which parts are merely verbal and why.

