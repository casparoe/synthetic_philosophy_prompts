  **Joint Statement on the Necessity of Origin for Organisms**

  **Part 1: Agreed Claims**

  Both the essentialist and the contingentist in this reading group accept the following claims, after scrutiny:

  1. **Identity over time for organisms** requires that an organism persists through changes in matter and form, so long as it maintains its functional organization and life processes. Neither side disputes that organisms can gain and lose parts while remaining numerically identical.

  2. **Biological reproduction facts**: 
     - Sexual reproduction typically involves the fusion of gametes (sperm and egg) to form a zygote, which then develops into an organism.
     - Asexual reproduction and other processes (like twinning or cloning) occur and challenge simple models of origin. Specifically:
       - Monozygotic twinning results in two distinct organisms from one zygote.
       - Somatic-cell nuclear transfer (as in Dolly) produces an organism whose nuclear genome is identical to that of the donor somatic cell, but the process does not involve the fusion of gametes.
       - Mitochondrial donation involves creating a zygote with nuclear DNA from two parents and mitochondrial DNA from a third party.

  3. **Modal framework**: 
     - Both sides agree that de re modal claims about organisms are meaningful and that we can discuss what is possible or necessary for a particular organism.
     - Both sides accept that Kripke's arguments in *Naming and Necessity* provide a influential but not uncontested framework for essential properties.

  4. **Non-decisive arguments**:
     - The essentialist concedes that twinning does not, by itself, refute the necessity of origin, because one can hold that both twins necessarily originate from the same zygote.
     - The contingentist concedes that some versions of the necessity of origin thesis (e.g., one tied strictly to genetic material) might be empirically falsifiable, but that does not settle whether a more refined thesis could hold.

  5. **Scope of the thesis**: Both sides agree that the necessity-of-origin thesis, as originally proposed, was formulated in the context of typical sexual reproduction, and its application to non-standard cases (like cloning) requires careful extension, not mere analogy.

  **Part 2: Disagreements Table**

  | Topic | Essentialist's Formulation | Contingentist's Formulation | Judgment (Substantive/Verbal) |
  |-------|----------------------------|------------------------------|-------------------------------|
  | Definition of "origin" | The origin of an organism is the particular gamete pair (or the zygote formed from them) from which it developed. | The term "origin" is ambiguous; it might refer to the gametes, the zygote, the fertilization event, or the genetic material. Without a clear referent, the thesis is ill-defined. | Verbal: The dispute often hinges on which candidate referent is chosen. |
  | Necessity of origin | An organism could not have come into existence from a different gamete pair (or zygote) than the one it actually came from. | It is not necessary that an organism comes from the exact gamete pair or zygote it actually came from; small variations in the origin might be possible without affecting the organism's identity. | Substantive: Even with a fixed referent, they disagree on modal implications. |
  | Twinning | Twinning shows that two organisms can share the same origin (the zygote), but each still necessarily originates from that zygote. | Twinning demonstrates that an organism's identity is not fixed by its zygote because the same zygote could have produced a different twin or no twin at all. | Substantive: They disagree on whether the zygote's role is necessary for identity. |
  | Cloning (SCNT) | In somatic-cell nuclear transfer, the origin of the cloned organism (e.g., Dolly) is the somatic cell (or its nucleus) and the enucleated egg; Dolly necessarily originates from that specific cell. | Cloning shows that "origin" cannot be the same as in sexual reproduction; Dolly's origin is a laboratory event, not a natural one, and the somatic cell is not an "origin" in the sense required for essentiality. | Substantive: Disagreement on what counts as an origin and whether it can ground necessity. |
  | Sorites pressure | The origin is a particular concrete entity (e.g., a specific sperm cell); a sperm differing by one molecule is a different sperm, so the organism could not have come from it. | If a one-molecule difference makes a different origin, then the origin relation is implausibly sharp; but if it doesn't, then the thesis allows for some variation, which undermines its necessity. | Substantive: They disagree on the tolerance of the origin relation to change. |

  **Part 3: Cruxes**

  The following sub-questions, if resolved, would move at least one party in the debate:

  1. **Referent Crux**: What is the precise entity or event that the necessity-of-origin thesis refers to as "the origin"? (Options: gamete pair, zygote, fertilization event, genome-bearing cell, portion of matter.)

  2. **Modal Scope Crux**: Does the necessity-of-origin thesis apply only to organisms arising from sexual reproduction, or can it be extended to organisms arising from asexual or artificial means (like cloning)?

  3. **Twinning Crux**: Does the phenomenon of twinning show that the zygote is not sufficient to determine the identity of the resulting organism(s), and if so, does that undermine the necessity of that zygote for the organism's identity?

  4. **Cloning Crux**: In somatic-cell nuclear transfer, does the cloned organism (e.g., Dolly) share an origin with the donor organism, and if not, what does that imply about what constitutes an origin?

  5. **Sorites Crux**: Is the origin relation tolerant of small changes (e.g., in the matter of the gametes), and if not, does that lead to vagueness in the identity conditions of the organism?

  **Part 4: Concrete Cases for Cruxes**

  For each crux, we present a case and the parties' predictions:

  1. **Referent Crux Case: Mitochondrial Donation**
     - *Case Description*: A child is conceived using nuclear DNA from parents A and B (via IVF) but with mitochondrial DNA from donor C. The zygote is formed by combining the nucleus from A's sperm and B's egg (with mitochondrial DNA replaced by C's).
     - *Question*: What is the origin of this child? Is it the gamete pair (A's sperm and B's egg, ignoring mitochondria), the modified zygote, the three contributors, or something else?
     - *Essentialist's Prediction*: The origin is the gamete pair (A's sperm and B's egg), because the nuclear genome is what matters for the organism's identity. The mitochondrial DNA is not part of the origin in the essential sense because it doesn't affect the organism's essential properties.
     - *Contingentist's Prediction*: The origin must include the mitochondrial donor, as it contributes to the genetic makeup. Thus, the thesis cannot apply cleanly, showing that "origin" is technology-relative and not a robust metaphysical notion.
     - *Concession*: If the essentialist must admit that mitochondrial DNA is part of the origin, that would weaken the thesis by making origins more complex. If the contingentist must concede that the nuclear gamete pair is the only relevant origin, that would support the essentialist's refinement.

  2. **Cloning Crux Case: Somatic-Cell Nuclear Transfer (Dolly)**
     - *Case Description*: Dolly the sheep was created by inserting the nucleus from a somatic cell of an adult sheep into an enucleated egg from another sheep, then implanting it into a surrogate.
     - *Question*: Does Dolly share an origin with the donor sheep? If not, what is Dolly's origin?
     - *Essentialist's Prediction*: Dolly's origin is the specific somatic cell nucleus and the enucleated egg. She necessarily comes from that combination, not from the donor sheep's origin (which was a gamete pair). Thus, she has a distinct origin.
     - *Contingentist's Prediction*: Dolly's nuclear genome is identical to the donor's, so if origin is tied to genetic material, she shares an origin with the donor. But this leads to absurdity (two organisms with the same origin). Therefore, origin cannot be genetic material alone, and the thesis fails.
     - *Concession*: If the essentialist can convincingly argue that Dolly's origin is different without appealing to genetic identity, that would support the thesis. If the contingentist must accept that Dolly's origin is a new event, that might show the thesis can be extended.

  3. **Sorites Crux Case: Near-Identical Sperm**
     - *Case Description*: Consider a sperm cell that is molecule-for-molecule identical to the actual one that contributed to your conception, except for one atom in a non-coding region. Could you have come from that sperm?
     - *Question*: Does the necessity-of-origin thesis allow for such a minor variation?
     - *Essentialist's Prediction*: No, because that sperm is numerically distinct from the actual one. The thesis requires the very same origin, not a nearly identical one.
     - *Contingentist's Prediction*: If the essentialist says no, then the thesis implies a sharp cut-off for identity, which is implausible for vague objects like organisms. If yes, then the thesis allows some variation, which undermines its necessity.
     - *Concession*: If the essentialist can provide a non-arbitrary account of why even a one-molecule difference matters (e.g., by tying identity to specific tokens), that would strengthen their position. If not, the contingentist's vagueness concern stands.

  **Part 5: Closing Diagnosis**

  We judge that a significant part of the dispute—specifically, the definition of "origin"—is merely verbal. The essentialist typically has in mind a specific biological entity (like the gamete pair or zygote) as the origin, while the contingentist points out that in non-standard cases, this referent is unclear or multiple. This verbal disagreement masks the substantive core: whether any candidate referent can bear the modal weight of necessity.

  However, even with a fixed referent (e.g., the zygote), the disagreement becomes substantive. The essentialist holds that the zygote is necessary for the organism's identity, while the contingentist denies this, citing twinning and cloning as evidence that identity is not so fixed. The sorites pressure also reveals a substantive issue: the essentialist must accept sharp boundaries, while the contingentist sees vagueness as intrinsic.

  In conclusion, while some confusion stems from ambiguity in "origin," the heart of the dispute is metaphysical: is an organism's identity essentially tied to its causal history in a way that admits no variation? The cases of mitochondrial donation and cloning show that as reproductive technologies evolve, the thesis must either adapt (risking ad hocness) or admit limitations. Both sides should focus on the cruxes above to make progress.

