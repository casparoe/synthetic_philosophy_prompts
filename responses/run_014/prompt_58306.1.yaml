  - **setup**: A one-sentence summary of facts.
  - **reliance**: What reliance is present or absent? (Here, June did not rely because she had the taxi and explicitly said she wasn't counting on Mara.)
  - **intuition**: Whether Mara wronged June and in what way? (Yes, Mara wronged June by breaking her promise, causing disappointment and perhaps a breach of trust, despite no tangible harm.)
  - **verdict**: Which of the two ideas the intuition favors and why? (Favors idea B because the wrong is in breaking the promise itself, not in causing reliance-based harm.)
