reasoning: |-
  We are creating a scenario with two sisters, Mara and June. The key elements are:
  1. Mara sincerely promises to drive June to an early hospital appointment.
  2. June explicitly states she is not counting on Mara and keeps a backup taxi booked.
  3. Mara fails to appear, and June suffers no setback beyond disappointment (because she used the taxi).

  We are to separate two ideas about promissory force:
  A. The force comes from protecting reliance once created (if the promisee relies and suffers harm, then the promisor is obligated).
  B. The force comes from giving the promisee a standing to hold the promisor answerable even absent reliance (so the promise itself creates an obligation, and breaking it is wrong even if no one relied on it).

  In this case, June did not rely (she kept the taxi) and suffered no harm. But did Mara wrong June by breaking the promise?

  The intuition we might have is that Mara did wrong June by breaking her promise, even though June did not rely and had a backup. The wrong is in the breaking of the promise itself, not in causing harm.

  Therefore, the intuition favors idea B: the promissory obligation exists because by promising, Mara gave June the standing to hold her accountable, regardless of reliance.

  Now, let's write the example:

  **Example:**
  Mara and June are sisters. Mara knows that June has an important early morning hospital appointment. Mara says, "I promise I'll drive you to the hospital tomorrow at 7 a.m. sharp. You can count on me." June, knowing her sister's history of unreliability, responds, "I appreciate that, but I'm not counting on you. I've already booked a taxi just in case." The next morning, Mara oversleeps and does not show up. June takes the taxi and arrives on time, but she feels disappointed and upset that Mara broke her promise.

