answer: |-
  ### Example Scenario: Mara and June

  **Setup**  
  Mara promises to drive June to a 6 AM hospital appointment, June declares she’s not relying on Mara and keeps a taxi booked as backup, and Mara sleeps through the alarm but June arrives on time via taxi, feeling only disappointed.

  **Reliance**  
  June explicitly avoids reliance by maintaining her taxi reservation; she does not alter her behavior based on Mara’s promise (e.g., she doesn’t cancel the taxi, stay up late preparing, or emotionally invest in Mara’s assistance).

  **Intuition**  
  Mara wronged June by breaking her promise, not because it caused practical harm, but because she violated June’s normative right to expect fulfillment and betrayed trust, leaving June feeling disrespected and devalued as a promisee.

  **Verdict**  
  The intuition favors the idea that promissory force comes from **giving another person a standing to hold one answerable even absent reliance**. Mara’s wrong stems from disregarding June’s authority to demand accountability for the promise itself, not from protecting reliance (which was absent). June’s disappointment reflects a moral injury, not a practical setback.

  **Staging**  
  Dramatize the tension through June’s quiet hurt when Mara casually dismisses her failure ("The taxi got you there, right?"), countered by June’s sharp retort ("You promised—that meant something"), and a lingering shot of June deleting Mara’s contact from her emergency list.

