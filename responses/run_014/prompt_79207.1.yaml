prompt: |-
  I run the collections and access unit at a national memory institution — a state archive with a public museum attached — and roughly twice a month I have to draft a recommendation on a contested holding for the director to sign. The cases come in four shapes, and I have come to think they are not four shapes of one thing: whether to accept custody of a collection that a community or a family offers us; whether material we already hold should be open, restricted, sealed for a term, or handed back to the people it is about; whether to digitise and publish; and whether to mark something publicly, with an exhibition, a plaque, an annual reading. I have a week per case, two junior archivists to do the legwork, no budget of my own, a legal office that will tell me what the statute requires and nothing about what is right, and a director who signs whatever I put in front of her and will be embarrassed in the press if I get it wrong. What I do not have is any way of knowing whether the answers I have been giving are consistent with one another, and the cases have lately come close enough together that I can see I have been deciding them by mood.

  The two poles of the literature on this I can state and cannot reconcile. On one side, memory is a duty, owed to people who can no longer speak for themselves and owed first of all within thick relations — one's own family, town, nation — so that erasure is a second killing and a tidy archive is a lie told on behalf of the comfortable; on the other, the keeping of grievance is itself a harm, commemoration is nearly always a project of the living dressed up as a debt to the dead, and a society can be better off not carrying its worst material forward, especially where the people named in it, or their children, still live in the same street. I do not want you to settle that dispute. I want a procedure that can be run while it stays unsettled. Two things I have noticed on my own, because they are where my practice actually goes wrong, and the procedure has to accommodate them. First, remembering is three separable acts — retaining, allowing access, and publicly marking — and a decision to seal is not a decision to destroy, and neither is a decision not to commemorate; most of my inconsistency comes from collapsing the three. Second, in a paper archive the live options are not keep-or-destroy but keep-and-index, keep-and-bury, and keep-and-tell-the-people-named; digitisation moves everything from the second to the first, and a document that has been scanned cannot be un-remembered by any later decision, which makes the decision whether to digitise the one with no way back.

  Please write the procedure: the questions in order, what counts as a sufficient answer to each, which answers stop the case with a no, and which questions have to be handed to a person because they turn on values rather than facts — and, where that happens, who that person should be, given my setup. Then run it end to end on three cases and tell me plainly which of my instincts it overrules: a state security file naming dozens of low-level informers whose grandchildren still live in the towns they informed on, which a court is still using as evidence in prosecutions; a government that will pass an amnesty and fund an official history only if we agree to seal the relevant holdings for fifty years; and a family that asks us to destroy their mother's file rather than seal it, on the ground that a sealed file is a monument and destruction is the only mercy. Say where the procedure will misfire — I assume a rule that is right for a settled democracy's archive will be wrong for an institution whose holdings are still being used as evidence, or whose own staff are named in them — and be explicit about which of your steps are judgment dressed up as procedure.
reasoning: |-
  Okay, let me unpack this archivist's complex request. They're drowning in ethical dilemmas about contested holdings and need a consistent decision framework. The core tension is between preservation-as-duty versus forgetting-as-mercy, and they've wisely identified that retention/access/marking are distinct decisions that they've been conflating.

  Hmm, their practical constraints are brutal: no budget, minimal staff, legal only advises on statutes, and the director rubber-stamps everything. The real risk is public scandals when sensitive decisions backfire. They've already noticed digitization is irreversible - once something's scanned, it can't be unremembered.

  The key insights I should build on:
  1) Separate the three R's: Retain, Reveal (access), Remark (mark publicly)
  2) Digitization is a point of no return
  3) Their cases involve living communities still affected by the records

  For the procedure, I'll need distinct decision trees for each type of case (acquisition, access, digitization, commemoration) with clear off-ramps. Must flag where value judgments are needed versus factual analysis. And crucially, identify who should make those calls since they can't personally own every ethical dilemma.

  Testing it on their three cases:
  The informant file - retention mandatory (legal evidence), but access and marking need community consultation. Grandchildren's existence triggers special handling.

  Amnesty deal - dangerous precedent. May need to accept sealing but build in review mechanisms. Director should decide since it's political.

  Family destruction request - hardest one. Retention probably required by statute, but could negotiate restricted access. Destruction as "mercy" conflicts with institutional duty.

  Biggest misfire risks: When laws conflict with ethics, or when "community consultation" is impossible. Also, digitization decisions before access policies are set. Should explicitly warn about these.
answer: |-
  Here's a procedural framework designed for contested holdings in your high-stakes environment, incorporating your insights about separable acts of remembering and irreversible digitization. It assumes unresolved ethical tensions while forcing consistent *process*.

  **Core Principles Embedded:**
  1.  **Decouple Retention, Access, and Marking:** Treat these as sequential but independent decisions.
  2.  **Digitization = Irreversible Revelation:** Treat the digitize/publish decision as the critical point of no return for *accessibility*.
  3.  **Minimize Solo Value Judgments:** Systematically identify *where* values are in play and delegate those decisions upwards or outwards.
  4.  **Acknowledge Context:** Explicitly flag factors that might make "standard" rules misfire (ongoing evidence use, staff implications).

  **The Contested Holding Decision Procedure**

  **I. Case Intake & Scoping (Junior Archivists - JA)**
      1.  **Identify Case Type:** Acquisition, Access Adjustment, Digitization/Publish, Commemoration.
      2.  **Gather Core Facts:** (JA - Sufficient when documented & verifiable)
          *   *What* is the material? (Format, volume, provenance, existing catalogue status)
          *   *Who* is contesting/proposing? (Entity, relationship to material, stated reasons)
          *   *Legal Status:* (Legal Office - Mandatory) Does statute mandate retention/destruction/access? Is it evidence? Copyright status? Data protection constraints?
          *   *Material Sensitivity:* (JA) Does it name identifiable living persons? Does it contain traumatic content? Is it subject to ongoing legal/political processes? Does it implicate the institution/staff?
          *   *Existing Promises/Agreements:* (JA) Any prior donor agreements, access restrictions, or institutional commitments?
      3.  **Initial Risk Flag:** (JA) Based on facts, flag: High public sensitivity? High legal risk? Potential staff conflict? Active community impact? *If flagged, escalate immediately to Unit Head (You).*

  **II. Retention Decision (Only for Acquisition Cases; For existing holdings, retention is assumed unless legal mandates destruction)**
      *   **Question 1: Is retention legally mandated?** (Legal Office - Binding)
          *   *Yes:* Acquire/Retain. Proceed to Access Decision.
          *   *No:* **Stop Case?** Proceed to Question 2.
      *   **Question 2: Does refusal constitute significant practical destruction?** (e.g., material will be destroyed/damaged if not acquired) (JA - Factual)
          *   *No:* **Stop Case - Recommend refusal.** (No duty to acquire everything offered).
          *   *Yes:* Proceed to Question 3 (Value Judgment).
      *   **Question 3: Does the material hold sufficient enduring historical/societal value to justify custody, *despite* potential harm/sensitivity?** (VALUE JUDGMENT)
          *   *Decision Maker:* **Director** (Delegated upwards due to institutional risk).
          *   *Sufficient Answer:* Director's written rationale balancing value against potential harm, considering institution's mandate and public interest. Must explicitly address the "second killing vs. harm of grievance" tension flagged in the facts. Consultation (e.g., brief external historian) can inform but not replace Director's judgment.
          *   *Yes:* Acquire. Proceed to Access Decision.
          *   *No:* **Stop Case - Recommend refusal.**

  **III. Access Decision (Applies to New Acquisitions & Existing Holdings)**
      *   **Question 4: Is a specific access level legally mandated?** (Legal Office - Binding - e.g., sealed as evidence, data protection closure periods, statutory closure).
          *   *Yes:* Implement mandated access. Proceed to Digitization Decision.
          *   *No:* Proceed to Question 5.
      *   **Question 5: Does open access pose a *credible and significant* risk of harm to identifiable living persons?** (JA - Factual assessment based on sensitivity facts. Harm = physical safety, severe reputational damage, severe psychological distress).
          *   *No:* Recommend **Open Access**. Proceed to Digitization Decision.
          *   *Yes:* Proceed to Question 6 (Value Judgment).
      *   **Question 6: What level of restriction best balances the principle of access with the prevention of harm?** (VALUE JUDGMENT - Options: Restricted (specific criteria), Sealed (term or indefinite), Return to Originator (if applicable & practical)).
          *   *Decision Maker:* **Unit Head (You)**. (Balancing core archival principle vs. harm).
          *   *Sufficient Answer:* Written rationale outlining:
              *   Nature and likelihood of harm.
              *   Why restriction is preferable to return or destruction (if offered).
              *   Proposed restriction level and duration (with justification).
              *   Review mechanism (if sealed for term).
              *   How this aligns (or consciously departs from) past similar cases.
          *   *Decision:* Implement chosen restriction. Proceed to Digitization Decision. *Note: "Hand back" is rarely feasible/ethical for state archives; usually treated as a restriction/access decision.*

  **IV. Digitization & Publication Decision (Applies post-Access Decision)**
      *   **Question 7: Is digitization legally mandated or contractually required?** (Legal Office - Binding)
          *   *Yes:* Digitize. Proceed to Question 9 (Publication).
          *   *No:* Proceed to Question 8.
      *   **Question 8: Would digitization significantly enhance preservation or core research access *without* fundamentally altering the nature of the access decision?** (JA/You - Factual & Institutional Policy)
          *   *No:* **Recommend Do Not Digitize.** Proceed to Commemoration Decision.
          *   *Yes:* Digitize (Preservation copy). Proceed to Question 9.
      *   **Question 9: Should the digital surrogate be published online?** (CRITICAL VALUE JUDGMENT - Irreversible Revelation)
          *   *Decision Maker:* **Director** (Delegated upwards due to irreversibility and broad impact).
          *   *Sufficient Answer:* Director's written rationale addressing:
              *   How online publication aligns with the *implemented* Access Decision (Does it uphold or undermine restrictions?).
              *   **Irreversibility:** Acknowledging that online = forever accessible.
              *   Potential amplification of harm vs. public benefit.
              *   Mitigation strategies if publishing sensitive-but-open material (contextualization, warnings).
          *   *Yes:* Publish online (with necessary redactions/context).
          *   *No:* Digitize for preservation/internal access only. *Proceed to Commemoration Decision.*

  **V. Commemoration Decision (Public Marking - Exhibition, Plaque, Reading etc.)**
      *   **Question 10: Does the material/specific case align with a pre-existing, publicly stated institutional commemoration priority/plan?** (JA/You - Factual)
          *   *Yes:* Proceed through standard planning channels (likely involves budget/curatorial, outside this procedure).
          *   *No:* Proceed to Question 11 (Value Judgment).
      *   **Question 11: Is there a compelling public interest reason *beyond basic access* to actively mark *this specific* material/case *now*?** (VALUE JUDGMENT - High Risk)
          *   *Decision Maker:* **Director** (Delegated upwards due to public visibility and resource implications).
          *   *Sufficient Answer:* Director's written rationale addressing:
              *   Why *this* case merits active marking over others.
              *   How marking serves a clear public historical/educational purpose (beyond satisfying a specific request).
              *   Potential impact on affected communities/individuals.
              *   Resource implications (even if no direct cost to your unit, it consumes institutional capital).
              *   Alignment with institutional values and risk tolerance.
          *   *Yes:* Develop proposal (involves other units/budget).
          *   *No:* **Do not commemorate actively.** Case closed.

  **Where Judgment is Dressed as Procedure:**
  *   **Defining "Sufficient enduring historical/societal value" (Q3):** While the *question* is procedural, the Director's *assessment* is pure value judgment. The procedure forces explicit consideration but doesn't define "sufficient."
  *   **Assessing "Credible and significant risk of harm" (Q5):** This requires judgment on severity and likelihood, though based on facts.
  *   **Balancing Access vs. Harm (Q6):** Your choice of restriction level is value-based, but the procedure forces consideration of harm and alternatives.
  *   **"Compelling public interest" in Commemoration (Q11):** Entirely value-laden, delegated to Director.

  **Who Decides Values:**
  *   **Director:** For Q3 (Acquisition Value), Q9 (Online Publication), Q11 (Commemoration). These carry highest institutional risk/public profile.
  *   **Unit Head (You):** For Q6 (Access Restriction Level). Core archival ethics/operational balance.
  *   **Legal Office/Junior Archivists:** Factual/legal determinations only.

  **Misfire Warnings:**
  1.  **Holdings as Active Evidence:** (As in your informant case) Q4 (Legal Mandate) will often dictate sealing. Q9 (Online Publication) becomes extremely high-risk/near-impossible. The procedure might force retention/sealing but feel ethically hollow. *Mitigation:* Ensure legal advice is comprehensive; Director must understand the societal implications of enforcing legal restrictions.
  2.  **Staff Implicated:** Severely complicates Q5/Q6 (Harm/Restriction). Internal conflict of interest is likely. *Mitigation:* Flagged early (I.3). Requires extreme transparency, potentially external review for Q6, Director decision for Q6/Q9.
  3.  **Fragile Democracy/Transitional Context:** "Standard" democratic norms (transparency, access) may be actively dangerous. Legal mandates (Q1, Q4) might stem from flawed/repressive systems. *Mitigation:* Q3 (Acquisition Value) and Q6 (Restriction) become even more critical value judgments. Director must weigh stability vs. historical justice. The procedure provides structure but cannot resolve the underlying tension.
  4.  **Resource-Limited Consultation:** The procedure doesn't mandate broad consultation (due to time/budget), relying instead on JA fact-gathering and Director judgment. This risks missing community perspectives. *Mitigation:* Use networks; if JA flags high community impact (I.3), Director *must* consider how to seek input, even if informal.

  **Running the Cases:**

  **Case 1: State Security File (Informer Names, Grandchildren in Towns, Active Evidence)**
  *   **Type:** Access Adjustment (potentially Digitization later)
  *   **Retention:** Assumed (already held).
  *   **Q4 (Legal Mandate):** **YES -** Active evidence. **Access Decision: Sealed** as mandated by court/statute. *Your Instinct Overruled:* Any urge to allow access now is legally blocked. Mood about discomfort with "second killing" is acknowledged but legally overruled here.
  *   **Digitization (Q7-Q9):** Q7 - Mandated? (Legal: Likely no, but check). Q8 - Preservation/Access? (JA: Digitization aids preservation and future access *if* restrictions lift, but doesn't alter current access. Probably **Yes** for preservation). Q9 - Publish Online? **Director Decision (VALUE JUDGMENT):** *Recommend NO.* Rationale: Irreversible publication while still evidence/sealed is legally perilous and amplifies harm to identifiable grandchildren. Preservation copy only. *Your Instinct Confirmed:* Digitization as irreversible revelation makes online publishing too dangerous here.
  *   **Commemoration (Q10-Q11):** Q10 - Priority? (Unlikely). Q11 - Compelling interest? **Director Decision (VALUE JUDGMENT):** *Recommend NO.* Rationale: Active legal case, high harm potential, marking could prejudice proceedings or endanger individuals. *Your Instinct Overruled?* Any urge to "mark the injustice" now is deemed too risky.
  *   **Result:** Remain sealed per legal mandate. Digitize for preservation only. No commemoration. Focus shifts to documenting the *restriction itself* for future accountability.

  **Case 2: Amnesty Deal (Seal for 50 years in exchange for Amnesty/Official History)**
  *   **Type:** Access Adjustment (Proposed new restriction).
  *   **Retention:** Assumed.
  *   **Q4 (Legal Mandate):** **NO** - No *current* legal mandate to seal. Deal creates a *proposed* mandate. Proceed.
  *   **Q5 (Significant Harm from Open Access?):** (JA Factual): Possibly. Depends on content. Grandchildren? Traumatic material? *Assume flagged as high sensitivity.*
  *   **Q6 (Access Restriction Level - VALUE JUDGMENT - YOU):** **Options:** Accept 50-year seal? Negotiate shorter term? Refuse? *Recommendation:* Accepting a *quid pro quo* seal sets dangerous precedent. Negotiate fiercely: Shorter term (20-30 yrs)? Robust review clause? Ensure official history is independent. If no negotiation, **Recommend Refusal.** Rationale: Archival independence paramount; sealing should be based on harm assessment (Q5), not political deals. *Your Instinct Overruled:* Any mood-driven urge to "get the history funded" or avoid political fight is subordinated to institutional principle. **Decision:** Seal (under protest/negotiated terms) OR potentially refuse. *Assume negotiated conditional seal.*
  *   **Digitization (Q7-Q9):** Q7 - Mandated? (No). Q8 - Preservation? (Yes, valuable). Digitize preservation copy. Q9 - Publish Online? **Director (VALUE JUDGMENT):** **NO.** Rationale: Contravenes the (negotiated) access restriction. *Confirms your instinct on digitization irreversibility.*
  *   **Commemoration (Q10-Q11):** Q10 - Priority? (Unlikely). Q11 - Compelling interest? **Director (VALUE JUDGMENT):** *Recommend YES (for Official History aspect), but NO for marking the sealed records themselves.* Rationale: The *amnesty/history process* might be marked if it proceeds, but commemorating the sealed records would undermine the restriction. *Overrules instinct to avoid anything related to the deal.*
  *   **Result:** Negotiated conditional seal. Digitize preservation copy only. Commemorate the amnesty/history *process* (if it happens), not the sealed records.

  **Case 3: Family Request to Destroy (vs. Seal Mother's File)**
  *   **Type:** Access Adjustment (Seal) OR Destruction request.
  *   **Retention:** Assumed held.
  *   **Q1 (Legally Mandated Destruction?):** (Legal): **NO** (State archive, likely statutory duty to retain public records). Proceed.
  *   *Destruction Request Implicitly Refused (No legal basis).* Proceed to Access Decision.
  *   **Q4 (Legal Mandate Seal?):** **NO.**
  *   **Q5 (Harm from Open Access?):** (JA Factual): Assess file content. Does it contain deeply private/traumatic info? Is mother identifiable? Likely **YES** (based on request).
  *   **Q6 (Access Restriction Level - VALUE JUDGMENT - YOU):** **Options:** Seal (term/indefinite)? Restricted? *Recommendation:* Seal (term, e.g., 75-100 years from birth) or restricted access (e.g., direct family only). **Do not return/destroy.** Rationale: Balances duty to retain historical record with prevention of harm to family. A sealed file is *not* a monument in the commemorative sense; it's restricted access. *Your Instinct Overruled:* Mood agreeing that destruction is "mercy" is overruled by duty of retention. The distinction between Retention and Access is key here - retain securely, restrict access severely. Addresses their core concern (preventing exposure) without destruction.
  *   **Digitization (Q7-Q9):** Q7 - Mandated? (No). Q8 - Preservation? (Yes, but sensitivity high). *Recommend Digitize for preservation only (highly secure).* Q9 - Publish Online? **Director (VALUE JUDGMENT):** **NO.** Rationale: Severely restricted access makes online publication inappropriate and harmful. *Confirms your instinct.*
  *   **Commemoration (Q10-Q11):** Q10 - Priority? (No). Q11 - Compelling interest? **Director (VALUE JUDGMENT):** **NO.** Rationale: No public interest outweighing family privacy and trauma. *Confirms instinct not to mark.*
  *   **Result:** File severely restricted (sealed/restricted access). Digitized for preservation only (secure). No commemoration. Destruction refused. The "mercy" is achieved through near-total access restriction, not erasure.

  This procedure forces explicit consideration of the separable acts (Retain/Reveal/Remark), highlights the irreversible nature of online publication, delegates major value judgments upwards (Director) while keeping core archival balancing (Access vs. Harm) with you (Unit Head), and provides documented rationales for consistency checking and accountability, even amidst unresolved ethical tensions. It accepts that legal mandates and specific contexts (like ongoing evidence use) will sometimes dictate outcomes that feel ethically uncomfortable.
