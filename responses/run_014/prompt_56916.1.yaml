  Closing stanza will be Sidgwick's "desirable feeling" definition, using the song memory to show desire may not match the feeling itself. 

  The ledger will track:
  Stanza 1 → Stanza 2: Passes tension-release → alters to thermal contrast
  Stanza 2 → Stanza 3: Passes contrast → dilutes to itch-resolution
  ...etc, showing complete transformation by the end.

  Biggest challenge is avoiding clichés while making dissimilar pleasures feel authentically pleasurable. The boot-unlacing start sets the anti-sunset tone. For the song memory, I'll use a radio surprise to keep it mundane yet poignant. Closing lines will question if the "wanting to keep" the song feeling is part of the pleasure or separate.
answer: |-
  **Brainstorm: Candidate Universal Features & Their Failures**  
  1. *Shared felt quality* (e.g., "sweetness"): Dissolves when comparing chili heat to cool silence.  
  2. *Scalable hedonic tone* (a single intensity axis): Fails to capture relief’s negative origin or irony’s bite.  
  3. *Functional role* (reward-signaling): Ignores melancholy music’s ache that draws us closer.  
  4. *Desire for continuation*: Absent in the flash of a solved puzzle or a sneeze’s finale.  
  5. *Identifiable locus* (in body/mind): Splinters on the distributed thrill of a gambler’s dice roll.  
  6. *Apprehended as desirable*: Stumbles when dread accompanies a guilty pleasure’s pull.  

  ---

  **Pleasure’s Chain**  

  **I. (Relief: Unlacing the Boot)**  
  Leather sigh, the buckle’s *snick*—  
  Knot of hours undone,  
  Knee’s complaint a fading brick,  
  Toes uncurling, one by one,  
  From the vise-grip of the trek.  
  Blood resumes its silted run.  
  *Passes: Tension’s precise release.*  

  **II. (Contrast: First Swig, Parched Throat)**  
  Tin cup’s rim, a desert cheek.  
  Not cool, but *cold*—a blade  
  Cleaving August’s woolly streak,  
  Shock that makes the temples raid  
  Memory of all droughts oblique.  
  Water’s theft is pleasure made.  
  *Passes: Shock of sudden change.*  

  **III. (Resolution: Scratching the Bite)**  
  Nail finds the welt’s moon-crater rim,  
  Digs the sweet-gritty trough—  
  Not relief, but vengeance prim,  
  A sting that’s earned, a proof enough  
  That itch was real. The world goes dim  
  Where fingernail and hunger scuff.  
  *Passes: Sharp, localized sensation.*  

  **IV. (Insight: Theorem’s Click)**  
  No sting, no chill. The chalk-dust air  
  Holds breath. Then—*there*—the hinge  
  Unlocked! Not warmth, but light laid bare:  
  The tangled proof, a single fringe  
  Tugged loose. The mind, a vacant square  
  Sudden-paved with knowing’s cringe.  
  *Passes: Sudden, silent internal shift.*  

  **V. (Mastery: The Step Perfected)**  
  Hip recalls the torque withheld,  
  Knee accepts the fall,  
  Arch accepts the floor it melded  
  To, not thought—but all  
  The body’s grammar, long dispelled,  
  Snaps back. No shift, no call:  
  Just bone and air agreeing.  
  *Passes: Effortless cohesion.*  

  **VI. (Recognition: Old Song, Cracked Radio)**  
  Static coughs. Then—brass and pine—  
  A tune you’d lost, or threw.  
  Not shift, not ease, not ache, not sign—  
  Just *yes*, that phrase, that husky coo  
  From decades gone. No thought’s design,  
  Just time collapsed. You want… it *you*?  
  *Passes: Unbidden, temporal collapse.*  

  **Closing (The Gloss)**  
  *And here? Only this wanting stays—  
  The radio’s ghost-tune, clinging  
  As the dial drifts… a thin, bright haze  
  Of "Yes, *this*," while the real thing,  
  The feeling, fades through memory’s maze.  
  Is the grasp the gold it brings?*  

  ---

  **Joint-by-Joint Ledger**  
  - **I → II:** Passes *Tension’s Release* → Alters to *Shock of Change*. Abandons *Gradual Unwinding*.  
  - **II → III:** Passes *Sharp Sensation* → Dilutes to *Localized Aggression*. Abandons *Thermal Contrast*.  
  - **III → IV:** Passes *Sudden Internal Event* → Transmutes to *Silent Cognitive Shift*. Abandons *Physical Itch*.  
  - **IV → V:** Passes *Silent Internal Shift* → Transforms to *Effortless Cohesion*. Abandons *Abstract Insight*.  
  - **V → VI:** Passes *Cohesion* → Fragments to *Temporal Collapse*. Abandons *Bodily Mastery*.  
  - **VI → Closing:** Passes *Bidden Feeling* → Retreats to *Apprehended Desirability*. Abandons *Sensory Specificity*.  

  *(Final Abandonments: All tangible qualities—touch, temperature, effort, sound, time—leaving only the ghost of wanting.)*
