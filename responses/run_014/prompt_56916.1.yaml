  Key constraints: no abstract nouns doing heavy lifting, no glow/warmth/bloom motifs, no philosopher names, no "family resemblance" phrase (but should feel like it). The closing stanza should retreat to Sidgwick's definition of pleasure as "feeling we apprehend as desirable" while leaving doubt about whether desiring is the same as feeling.

  First I need to brainstorm candidate features that supposedly define all pleasures but actually fail:
  - Shared felt quality (falls apart with pain-pleasures like chili heat)
  - Scalable hedonic tone (fails when comparing say, orgasm to tranquility)
  - Functional role (different pleasures serve different purposes)
