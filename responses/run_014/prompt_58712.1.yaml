  so my TA for intro ethics went on this whole rant about the paradox of deontology last week and idk if it was fair or if he just likes dunking on Kantians lol. his spiel was basically, deontologists say killing an innocent is forbidden full stop, even if killing one would stop five other killings exactly like it. and thats the paradox, because if killing is bad you should want less killing overall, so you should kill the one. so either you care about killing being bad, in which case youre basically a consequentialist, or you just care about keeping your own hands clean, which is just moral vanity. and he said the whole threshhold move where youre allowed to break the rule to prevent a catastrophe is just consequentialism with extra steps.

  it felt a little too neat to me? like isnt there a difference between me killing someone vs me letting five other people kill, and what if the five killings would be done by my own future self, does that change it? i couldnt really push back in section tho. is his take fair, like what would an actual deontologist sign onto vs what is he smuggling in, and does that threshhold gotcha actually work?
