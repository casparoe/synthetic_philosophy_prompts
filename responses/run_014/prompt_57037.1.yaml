  We are given a scenario where two research groups (led by the user and another leader) held different credences (0.75 and 0.20) about a scientific hypothesis over a long period (1988-2009). The user invokes Aumann's agreement theorem to argue that, because they shared the same evidence and their credences were common knowledge, the persistent disagreement implies at least one was irrational or biased. The user then proposes two methods: (1) a weighted pooling rule based on historical accuracy, and (2) a diagnostic using serial correlation of the annual consensus deficit to detect misspecification.

  We must assess the user's inference and proposals in light of Aumann's theorem and related concepts. We begin by enumerating the assumptions required for the inference and checking if they hold in the described situation.

  **Brainstorming: Assumptions for the Inference**

  1. **Assumption: The two agents are rational (i.e., they update their beliefs by Bayesian conditioning).**
     - Check: The user assumes that the theorem requires rationality. The situation: Both are competent scientists, but the theorem requires that they update by Bayes' rule. We have no direct evidence that they did not, but the persistent disagreement might suggest otherwise. However, the theorem's conclusion (that they must agree) only holds if both are rational. So if they are rational and the other conditions hold, they should have converged. Since they didn't, at least one must be irrational. This is the user's point. The situation does not supply evidence of irrationality directly, but the disagreement is evidence that at least one is not updating correctly.

  2. **Assumption: The agents have a common prior.**
     - Check: The user states: "our evidence was shared and public, so we had a common prior." However, note that Aumann's result requires a common prior over the entire state space (i.e., they start with the same prior probability distribution over all possible states of the world). Shared evidence does not necessarily imply a common prior. In fact, the common prior assumption is strong and often debated. The situation: They shared the same data and literature, but they might have started with different prior beliefs (e.g., due to different theoretical commitments or experiences). The user's claim that shared evidence implies a common prior is not necessarily true. Therefore, this assumption may not hold.

  3. **Assumption: The credences of the agents are common knowledge.**
     - Check: The user states that they cited each other's estimates and knew each other's credences, and knew that the other knew, etc. This seems to satisfy the common knowledge condition (i.e., each knows the other's belief, each knows that the other knows, ad infinitum). The situation: They read each other's papers, exchanged preprints, and sat on panels. The leader of the other group stated 0.20 in print and correspondence, and the user held 0.75 and made it known. Therefore, this assumption appears to be met.

  4. **Assumption: The agents update their beliefs by incorporating the other's belief (as required by Aumann's theorem) in a rational manner.**
     - Check: The theorem requires that upon learning the other's belief, they update by conditioning on the information that the other has updated rationally. But note that the theorem is about the process of exchanging beliefs and updating until convergence. In the described situation, they knew each other's beliefs and continued to hold different ones. The theorem says that if they have common prior, common knowledge of each other's posteriors, and update by Bayes' rule, then they must have the same posterior. Therefore, if the other conditions hold, the fact that they did not converge implies that at least one did not update correctly (i.e., violated Bayesian updating). The situation does not provide direct evidence of how they updated, but the lack of convergence is indirect evidence of a violation.

  Now, note that the theorem does not specify which agent is irrational. The user wants to know which one and how to determine it.

  **Assessment of the User's Proposals**

  1. **Weighted Pooling Rule:**
     - The user proposes to assign weights to each party proportional to the fraction of their past published claims that were later confirmed, then take the weighted average as the rational consensus.
     - However, Aumann's theorem does not provide a way to aggregate beliefs by weighting past performance. The theorem is about the conditions under which two rational agents must agree. It does not say that if they disagree, the more accurate agent is the one with the correct belief. Moreover, the weighted pooling rule is an external aggregation method, not the process of updating that the theorem describes. The theorem does not endorse such a rule.
     - Additionally, the common prior assumption is critical. If they do not have a common prior, then the theorem does not apply. In that case, disagreement is possible even with rationality and common knowledge of beliefs. The weighted average might be a practical solution for decision making, but it does not follow from Aumann's theorem.

  2. **Diagnostic using Serial Correlation:**
     - The user proposes to treat the annual consensus deficit (absolute difference divided by mean) as a residual series and test for serial correlation (Durbin-Watson test). If the deficit does not mean-revert, that indicates misspecification and the party with the lower weight is the one with the misspecification.
     - This is an econometric approach to detect bias in the updating process. However, Aumann's theorem does not provide a basis for this test. The theorem is about the impossibility of disagreement under specific conditions, not about the time series properties of the disagreement. The test might be a useful empirical tool, but it is not derived from the theorem. Moreover, if both agents are updating rationally (with a common prior) the deficit should drop to zero immediately upon achieving common knowledge (in the idealized setting). The fact that it persisted for 20 years already indicates a violation of the conditions.

  **Verdict:**

  - The user's inference that at least one agent was irrational or biased is consistent with Aumann's theorem, provided that the common prior assumption holds. However, the common prior assumption is not necessarily satisfied just because the evidence was shared. Therefore, the disagreement might also be explained by different priors (without irrationality). The theorem only forces agreement if there is a common prior and rational updating.

  - The user's proposals (weighted pooling and serial correlation test) are not licensed by Aumann's theorem. The theorem does not provide a method to aggregate beliefs or to detect which agent is biased. The proposals are external heuristics.

  **What can be concluded?** 

  Given the conditions of Aumann's theorem (common prior, common knowledge of posteriors, and rational updating), the persistent disagreement implies that at least one of the agents violated the rationality condition (i.e., did not update by Bayes' rule) or that the common prior assumption fails. Without additional information, we cannot determine which agent was at fault. The theorem does not give a method to assign blame.

  **Plain prose for a footnote:**

  "In a case of long-standing scientific disagreement where both parties share the same data, the mathematical result by Aumann (1976) implies that if the researchers had started with the same prior beliefs and were updating their beliefs rationally, they would have eventually agreed. The fact that we did not must mean either that our prior assumptions were too different or that at least one of us failed to update correctly. However, the theorem does not tell us which of these was the case, nor which group might have been at fault."
answer: |-
  ### Brainstorming: Assumptions and Their Status in Your Case
  I will enumerate the key assumptions required for your Aumann-based inference and assess whether your situation satisfies them. Each assumption is drawn from the formal requirements of Aumann’s agreement theorem and its extensions.

  1. **Assumption: Both agents update beliefs via Bayesian conditioning (rationality).**  
     *Status: Not verifiable.*  
     The theorem requires agents to adhere strictly to Bayesian updating. While you and your counterpart were competent, the persistence of disagreement *suggests* a violation, but there is no independent evidence that either of you deviated from Bayesian norms in your updates. The theorem flags a failure but cannot identify the source.

  2. **Assumption: Agents share a common prior over all possible states (common prior).**  
     *Status: Unlikely satisfied.*  
     Shared evidence does not imply a common prior. Priors encode background knowledge, theoretical commitments, and interpretations of noise—which may differ even with identical data. Your distinct research traditions (e.g., focus on intrinsic properties vs. disorder artifacts) likely embedded divergent priors. Aumann’s result collapses without this.

  3. **Assumption: Credences are common knowledge after disclosure.**  
     *Status: Satisfied.*  
     You cite each other’s work, exchange preprints, and publicly state credences. This satisfies common knowledge: Each knows the other’s credence, knows the other knows, and so on ad infinitum.

  4. **Assumption: The proposition is defined identically for both agents (same "event").**  
     *Status: Likely satisfied.*  
     You agree on the hypothesis ("anomaly is intrinsic vs. artifact"). No evidence suggests divergent definitions.

  5. **Assumption: Agents incorporate each other’s credences as information about the state of the world.**  
     *Status: Not satisfied.*  
     Aumann requires agents to treat each other’s beliefs as data *about the shared evidence*, triggering Bayesian updates. In your standoff, neither adjusted their view substantially, implying this incorporation did not occur. The theorem mandates convergence if all other assumptions hold—here, they did not.

  ### Assessment of Your Inference
  Your core inference—that persistent disagreement implies irrationality or bias in at least one agent—is **logically valid** under Aumann’s framework *if* the common prior and rationality assumptions hold. However, since the common prior is unlikely (Assumption 2) and Bayesian updating cannot be verified (Assumption 1), the theorem cannot definitively attribute blame. It only licenses the weaker conclusion: **The disagreement stems from either divergent priors, non-Bayesian updating, or both.** The theorem does not distinguish between these.

  #### Critique of Your Proposals
  **First proposal: Weighted pooling based on historical accuracy.**  
  - **Problem:** This violates Aumann’s axioms. The theorem treats rational agents symmetrically; weighting by past performance introduces an external heuristic unrelated to Bayesian updating. Opinion pooling (e.g., linear averaging) is justified in social epistemology for group decisions, but it is unrelated to Aumann. Crucially, it assumes the weights (historical accuracy) are objective and relevant—which may not hold if domains of past claims differ from the current hypothesis.  
  - **Verdict:** **Does not survive contact with the theorem.** It replaces Aumann’s Bayesian machinery with frequentist aggregation, which the theorem neither requires nor supports.

  **Second proposal: Serial correlation of consensus deficit.**  
  - **Problem:** Aumann implies convergence should be immediate once credences become common knowledge. A persistent deficit *already* indicates a violation (e.g., non-Bayesian updating or prior divergence). Testing for mean-reversion adds no new information—the failure is self-evident from the stagnation. The Durbin-Watson test might detect bias in *how* updates were misspecified (e.g., anchoring), but it cannot adjudicate which agent is at fault without assuming the pooling weights are valid (which, as above, is extraneous to Aumann).  
  - **Verdict:** **Does not survive contact.** The theorem identifies a breakdown but offers no econometric tools for diagnosis. Serial correlation might be a useful empirical clue but is not licensed by Aumann.

  ### What Aumann Does License You to Conclude
  For a 20-year standoff between competent labs, Aumann’s theorem implies that **your disagreement cannot be explained solely by private information or rational processing of shared evidence.** The root cause must include at least one of:  
  - Divergent prior beliefs (due to unshared assumptions, theoretical leanings, or interpretation frameworks).  
  - Systematic biases in how one or both of you updated beliefs (e.g., overweighting confirmatory data, underweighting the other’s expertise).  
  - Failure to fully internalize each other’s credences as probabilistic evidence (e.g., dismissing the other’s view as ideologically motivated).

  ### Plain Prose for Your Memoir Footnote
  > "When two scientists share the same data but hold stubbornly different views, Aumann’s theorem on agreeing to disagree suggests that either their starting assumptions were too far apart or one failed to update their beliefs rationally. In our case, after twenty years of debate, it is likely that both factors played a role. The theorem, however, cannot tell us who was more at fault—only that such a standoff implies a breakdown in the ideal of shared rationality."  

  This formulation is precise, jargon-free, and faithful to the theorem’s limitations. It respects your expertise while acknowledging the inferential boundaries. If you seek operational resolutions (e.g., pooling), consider alternative frameworks like Lehrer-Wagner consensus or Cooke’s expert weighting—but these are complementary to, not derivative of, Aumann.
