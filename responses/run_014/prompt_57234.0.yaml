prompt: |-
  You're a constitutional theorist who has taught both the Westminster and the Japanese models, and I want you to act as a tough but fair auditor rather than a lecturer. Think carefully before you answer. No references, no reading list, no citations — I can't look anything up right now and I don't want one.

  A study group I'm in has asked everyone to write down their settled position on constitutional monarchy so the others can attack it. Before I hand mine in I want to know whether it hangs together, because honestly I don't know if any of these pull against each other and I'm not telling you which one I'd sacrifice.

  Here's the package:

  1. Legitimacy comes from the electorate. Any exercise of public power has to be traceable, directly or through ministers who answer to parliament, back to the people. An office that answers to nobody can't be legitmate when it actually decides something.

  2. The Crown should nonetheless keep real personal prerogative — the right to say no to a dissolution, to choose a PM where no one has a majority, and in extremis to withhold assent. Precisely *because* the monarch is unelected: no career to protect, no voters to lose, so they can absorb the blame in a constitutional stress test in a way a politician calculating re-election can't.

  3. Hereditary succession is fine for a head of state. A birth lottery is an acceptable way to fill a job that's mostly symbolism and ceremony — it's the fact that the office does nothing that makes the randomness harmless.

  4. Reigns but doesn't govern. No royal initiative in ordinary politics, and never publicly against the government of the day. I like the Japanese settlement on this: symbol of the state, no powers related to government, everything performed on the advice and approval of the cabinet, which takes responsibility.

  5. A case verdict. A PM who has just lost a confidence vote asks for a dissolution in order to stop the opposition forming a government, and there is plainly an alternative majority available. I think the head of state should refuse. Yes, it's a political act, and yes, they'd effectively be picking who governs. I'd still say refuse.

  6. Get rid of the remaining hereditary peers, and ideally move to an elected second chamber. People who vote on laws need a mandate. People who wear a crown don't.

  7. On openness, split verdicts: King's Consent and any palace lobbying of ministers should be disclosed and the Sovereign Grant fully audited by parliament; but the weekly audience with the PM should stay confidential permanently, and I don't think a monarch should be criticised for holding strong political views in private.

  What I want from you:

  - First, restate each of the seven in one neutral line each as the underlying principle that would generate it, so I can check you've actually got me and aren't auditing a strawman.
  - Then the audit proper. Which pairs genuinely conflict, and which only look like they conflict until you draw the right distinction? Don't flag everything as equally bad — I want them ranked by severity, worst first.
  - For each real conflict: what specifically has to give, what does giving it up cost me, and is there a revision that keeps most of what I care about?
  - Finally, tell me which single change to the package would clean up the most, and be honest if the answer is that my position is basically coherent and I'm inventing problems.

  Don't hedge and don't diplomatically call it all a matter of emphasis. Pick.

  Last line, exactly this format: Verdict: drop (#_) — <the cheapest fix, six words or fewer>
reasoning: |-
  Okay, the user is a constitutional theorist in a study group who needs to audit their position on constitutional monarchy. They've listed seven points and want me to restate each principle, identify conflicts, rank them, suggest fixes, and recommend one key change. 

  First, I need to unpack their core principles. Point 1 is pure democratic legitimacy - all power must trace back to voters. But point 2 immediately complicates this by insisting the unelected monarch should have real veto powers precisely because they're unaccountable. That's a tension worth flagging as the top conflict. The "blame sponge" theory is clever but directly undermines point 1's chain of accountability.

  Point 3's defense of hereditary succession as harmless symbolism clashes with point 2's empowerment of the same figure. Can't have both "no power = randomness fine" and "real prerogatives exist". Meanwhile point 4's Japanese-model restraint ("never govern") contradicts point 5's crisis intervention where the monarch effectively chooses governments. That's conflict #2 in severity.

  The user seems aware of these tensions - note how they admit point 5 is "a political act" but still want it. The lower-tier conflicts are subtler: Point 6's elected-chamber logic should apply to the monarchy too (conflict #3), and point 7's transparency split feels arbitrary when applied to an unaccountable institution (conflict #4).

  For the big fix? Dropping point 2's personal prerogatives resolves the worst contradictions while keeping the Japanese-model symbolism they like. Alternatively, they could downgrade the monarch to pure figurehead status, but that guts point 5's crisis role. Cheapest solution is clearly pruning the powers, not the principles.

  Final verdict lands there: sacrificing the "blame sponge" theory keeps everything else mostly intact. The user's package is thoughtful but overstretched - they can't have both democratic purity and Platonic guardians.
answer: |-
  Here's your audit. Principles restated neutrally:

  1. **Democratic accountability:** All public power must derive from electoral mandate.
  2. **Unaccountable safeguard:** An unelected office can legitimately exercise reserve powers because it lacks electoral vulnerability.
  3. **Harmless heredity:** Hereditary succession is permissible for a purely symbolic office.
  4. **Strict non-intervention:** The head of state exercises no independent political will in governance.
  5. **Crisis intervention:** The head of state must refuse dissolution requests that subvert parliamentary democracy, even when politically decisive.
  6. **Democratic mandate for legislators:** Lawmakers require electoral legitimacy; non-legislative figures do not.
  7. **Conditional transparency:** Operational and financial dealings are public; confidential political counsel is protected.

  **Conflict Ranking (Severity High to Low):**

  1.  **Conflict: Point 2 (Safeguard) vs. Point 1 (Accountability) & Point 4 (Non-Intervention)**
      *   **Severity:** Fatal. Point 2 grants real, discretionary, *political* power to an unaccountable actor. This directly violates Point 1's core principle that legitimacy *requires* traceability to the electorate. It also blatantly contradicts Point 4's demand for "no royal initiative" and "never publicly against the government." Exercising the prerogative *is* initiative and is *fundamentally* acting against a sitting PM's request.
      *   **What Gives:** Point 2 (Real Personal Prerogative). You cannot maintain that legitimacy *only* comes from the electorate while simultaneously vesting real political power in someone deliberately insulated from it.
      *   **Cost:** Loses the "blame sponge" function for constitutional crises. Requires trusting politicians or other mechanisms during deadlocks.
      *   **Revision:** Severely curtail Point 2. Limit the monarch to purely formal, non-discretionary acts (like Point 4) *or* make the exercise of prerogatives purely ministerial (acting *only* on binding advice from another accountable body, like the Speaker or a Council of State). The "blame sponge" theory is incompatible with your core legitimacy principle.

  2.  **Conflict: Point 5 (Crisis Intervention) vs. Point 4 (Non-Intervention)**
      *   **Severity:** Major. Point 5 *requires* active, independent political judgment and intervention ("refuse dissolution") precisely when politics is most fraught. Point 4 demands *no* initiative and *never* acting against the government. Refusing a sitting PM's dissolution request is the epitome of acting against the government.
      *   **What Gives:** One must yield. Point 5 violates Point 4's strict prohibition.
      *   **Cost:**
          *   *Drop 5:* Loses your specific crisis safeguard against a PM gaming dissolution.
          *   *Drop strictness of 4:* Accepts that the monarch *must* have a minimal, exceptional power to intervene against the government to save parliamentary democracy, shattering the "never govern" ideal. This requires justifying how this sliver of power aligns with Point 1.
      *   **Revision:** Revise Point 4 to allow *only* the specific, exceptional intervention described in Point 5 as the *sole* permitted breach of non-intervention. This creates a narrow, defined "constitutional firebreak" role. However, this *still* conflicts with Point 1 unless tied to overwhelming constitutional convention or advice from accountable actors.

  3.  **Conflict: Point 3 (Harmless Heredity) vs. Point 2 (Safeguard) & Point 5 (Crisis Intervention)**
      *   **Severity:** Significant. Point 3 justifies heredity *because* the office is symbolic and powerless ("the randomness harmless"). Points 2 and 5 grant it real, discretionary power. You cannot simultaneously claim the birth lottery is fine *because* the winner does nothing consequential, while also expecting them to wield significant political power in moments of crisis. The justification for randomness evaporates when power exists.
      *   **What Gives:** If Points 2/5 stand, Point 3's justification fails. Heredity becomes harder to defend for an office wielding power.
      *   **Cost:** Undermines the philosophical defense of the monarchy's core hereditary principle if it holds real power. May push towards ceremonial-only (undermining 2/5) or elective head of state.
      *   **Revision:** If you keep revised crisis powers (Point 5), you must abandon Point 3's "harmless because powerless" argument. Defend heredity on entirely different grounds (tradition, stability, mystique) despite the power, or accept elective principles for the head of state too (conflicting with Point 3).

  4.  **Conflict: Point 6 (Mandate for Legislators) vs. Point 3 (Heredity for Head of State)**
      *   **Severity:** Moderate (Apparent). At first glance, demanding elected legislators while accepting a hereditary head of state seems inconsistent.
      *   **Distinction:** *Function*. Point 6 applies only to those who *make law* ("People who vote on laws"). You explicitly exempt the non-governing head of state. If the HoS truly has no legislative role (Point 4) and no policy-making power, the distinction holds logically. The conflict arises only if the HoS *does* exercise power (Points 2/5), dragging it back into functional governance.
      *   **Resolution:** The distinction is valid *if and only if* Point 4 (strict non-intervention) holds absolutely and Point 2 is abandoned or neutered. If the HoS has power, this distinction weakens considerably.

  5.  **Conflict: Point 7 (Conditional Transparency) vs. Point 1 (Accountability) & Point 2 (Safeguard)**
      *   **Severity:** Minor/Management. Protecting confidential advice (audience) makes sense for candid discussion, even for a figurehead. However, for an office holding reserve powers (Point 2), the lack of transparency around its *political* thinking (especially if holding private strong views) becomes problematic for accountability (Point 1). How can you trust the use of unaccountable power if its influences are hidden? This is less a core conflict and more a tension around managing an unaccountable office.
      *   **Resolution:** Your split is workable *if* Point 2 (real power) is dropped. If the HoS has real power, transparency demands increase significantly. Your current split leans towards the ceremonial model (Point 4).

  **Coherence & The Single Change:**

  Your position has a central, irreconcilable tension: the core democratic legitimacy principle (1) versus the desire for an unaccountable actor (2) to wield real political power as a constitutional safeguard, especially in crises (5). This directly contradicts strict non-intervention (4) and undermines the justification for heredity (3).

  *   **Is it coherent?** No, in its current form. Points 1, 2, 4, and 5 cannot comfortably coexist. Point 2 is the primary culprit.
  *   **Single Change with Max Cleanup:** **Abandon the core of Point 2 (real personal prerogative).** This significantly reduces the conflict with Point 1 (legitimacy), Point 4 (non-intervention), Point 3 (hereditary justification), and eases the tension in Point 7. It forces you to find alternative crisis mechanisms (e.g., codified rules, Speaker's role) but makes the overall package far more defensible by aligning with your foundational democratic principle and ceremonial ideal (Point 4). Keeping a purely formal, non-discretionary monarch allows Points 1, 3, 4, 6, and 7 to stand together, with Point 5 needing either abandonment or radical redefinition as a purely automatic function.

  Verdict: drop (2) — **Prune prerogative powers to ceremonial formalities.**
