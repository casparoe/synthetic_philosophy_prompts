prompt: |-
  I teach philosophy of biology, and I want to pin down what my own function attributions actually commit me to — not a survey of the two received accounts, which I know well, but the principle, if there is one, that generates my verdicts. I should say at the outset what I am not after: no references, no history of the debate, no catalogue of positions. I want you to treat the cases below as data and do the work of extraction, testing, and repair on them. Where you need a name for something, coin one and define it.

  Here are my considered verdicts. Some are familiar; several I built for a seminar and I am not confident about any of them in advance.

  1. A healthy human heart. Its function is to pump blood. Unproblematic, and I want the principle to be uncontroversial here.

  2. A donor heart in a cooler, or the heart of an anencephalic newborn that never contracted once. I still say its function is to pump blood. It does nothing, will never do anything, and yet the attribution does not seem to lapse for me.

  3. A heart with a large septal defect that pumps badly. It has the function of pumping blood and it is malfunctioning. Take this as a constraint rather than a datum: whatever principle survives must license the doing-versus-failing distinction, since that is most of what I want function talk for.

  4. The human appendix. On one hypothesis it acts as a refuge for commensal bacteria and helps repopulate the colon after a bout of diarrhoeal illness. Grant the hypothesis for argument's sake, and grant that the tissue performs the role well. I remain unwilling to say that harbouring flora is the appendix's function; I want to call it a vestige that happens to be useful. But notice that in case 2 I was perfectly happy to attribute a function to tissue doing nothing whatever. I do not know how to hold both of those.

  5. A bacterial population in which a plasmid-borne enzyme that degrades a novel antibiotic appeared yesterday and is now sweeping to fixation. I say the enzyme already has that function. Nothing about its ancestry seems to me to matter; what matters is that it is doing the work and that the work explains why it is spreading.

  6. The crystallins of the vertebrate lens, several of which are homologous to enzymes or to small heat-shock proteins that do quite different work elsewhere in the body. I say that in the lens these proteins have a refractive function, and that where the same protein still does its old enzymatic job it keeps that function as well. One molecule, two functions, neither of them derivative of the other.

  7. A stretch of the genome that is transcribed, whose transcript is bound by proteins and measurably alters local chromatin, and whose transcription is, so far as anyone can tell, noise. I deny it any function, even though its activity is a genuine causal difference within the system. This is the shape of the standing dispute over how much of a genome is functional, and I take my side in it seriously.

  8. A moth lineage bred in the laboratory for fifty generations purely for the geometry of its hindwing eyespots, never exposed to a predator. The eyespots still startle birds when birds are presented with them. I say the startling is no longer what they are for.

  9. A valve printed last week from a patient's own cells and seated in that patient's aorta, opening and closing competently. I say it has the function of regulating flow. If you tell me this is only because someone intended it, I want to reply that the intention looks beside the point: the valve would still have that function had it arisen through an accident of manufacture rather than a design brief.

  Two pairs here are, I think, genuinely irreconcilable on the resources I have, and I want you to confront them head-on rather than explain them away. Cases 6 and 7 look structurally identical — a molecule making a current causal contribution it was not selected for — and I judge them oppositely. Cases 8 and 9 likewise: neither trait has a selectional ancestry for the effect in question, both produce the effect reliably now, and I judge them oppositely.

  My own tentative principle, which I will call retentionism, a coinage of mine and not a view in the literature. A trait has F as a function if and only if (i) the trait has the capacity to F, and (ii) the trait's continued presence in the population of which it is part is explained, at least in part, by that capacity, where the explaining process need not be natural selection but may be any population-level filter that retains some variants and discards others — ongoing selection, artificial selection, cultural transmission, clonal expansion, market and clinical filtering. Clause (ii) is what does the work, and the deliberate generality about the filter is what I suspect is either its virtue or its fatal vagueness.

  What I want from you:

  (a) State the principle, or the small number of competing candidates, precisely, clause by clause, and for each clause tell me which of my verdicts it exists to save.

  (b) For each candidate, say plainly which of my nine verdicts it gets wrong. I would rather have a two-clause principle that overturns case 4 or case 7 than an eight-clause principle that saves everything; tell me which verdict you think I must abandon, and argue for that choice.

  (c) Decide whether retentionism is a genuine third account, an etiological account with the time window widened, or a causal-role account with a filter bolted on. If it is the second or third, say where the disguise fails.

  (d) Deliver verdicts, on the principle you end up recommending, for three cases I have not listed: lactase persistence in a population with a long dairying history and in one without it; a gene-drive construct in mosquitoes whose spread is explained by the drive machinery rather than by any advantage to the bearer; and the dewclaw of a show-line dog, retained for fifty years by breed standard and now doing nothing at all.

  (e) Finally, tell me whether the principle you land on licenses function explanations of the sort that actually appear in biology — explanations of why a trait is there by appeal to what it does — or whether it licenses only a taxonomy, a way of sorting traits into functional and non-functional piles with no explanatory force behind the sorting. That is the question I care about most, and it is the one I have the least confidence I can answer myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach philosophy of biology and want to clarify their own principles for attributing functions, beyond the standard etiological and causal-role accounts. They provided nine cases with their verdicts, highlighting conflicts between some pairs (6 vs 7, 8 vs 9). Their tentative principle, retentionism, focuses on a trait's capacity and its role in explaining the trait's continued presence via any population-level filter.

  First, I need to understand their main goal: they're not after a literature review but a principle derived from their judgments. The key challenges are reconciling cases like 2 (non-functioning heart still has a function) and 4 (appendix's beneficial role isn't a function), and resolving the conflicting pairs. 

  Looking at retentionism, clause (i) is straightforward—capacity to F. Clause (ii) is trickier, as it requires the capacity to explain the trait's persistence via any filter. For the heart in case 2, even though it's not pumping, its capacity explains why hearts exist, satisfying (ii). The appendix in case 4 might not meet (ii) because its persistence isn't explained by harboring bacteria—it's a vestige. 

  But conflicts arise in cases 6 and 7. For crystallins (6), retentionism works if their refractive capacity explains persistence in the lens. However, the genomic stretch in case 7, despite activity, doesn't have its persistence explained by that activity. Here, retentionism aligns with the user's verdicts. 

  Cases 8 and 9: lab-bred moth eyespots (8) don't have their persistence explained by startling birds, so no function. The 3D-printed valve (9) persists because it regulates flow (via clinical filtering), so it has the function. 

  The user's deeper need seems to be a principle that justifies explanatory function attributions without relying on history or intentions. They care whether the principle allows function to explain why a trait exists. Retentionism, with its focus on persistence via filters, does this by linking function to the reason for current maintenance. 

  Testing additional cases: lactase persistence in dairying populations would have the function due to cultural selection, whereas without dairying, it might not. The gene-drive's spread via drive machinery fits if the mechanism is the filter. The dewclaw retained by breed standard has a function if the standard acts as a filter, even if it does nothing. 

  The big question is explanatory power. Retentionism allows function to explain persistence, which aligns with biological practice. It's a hybrid but leans etiological by emphasizing the reason for maintenance. The user might need to accept that in cases like the appendix, if its persistence isn't explained by the beneficial role, it's not a function—even if that feels counterintuitive.
answer: |-
  Based on your verdicts and the contradictions you identify, I extract and test a principle that prioritizes internal coherence over saving every intuition. I propose **Maintenance Etiology** as your operative principle:

  ### (a) Proposed Principle: Maintenance Etiology
  A trait *T* (in system *S*) has function *F* if and only if:
  1.  **Capacity Condition**: *T* has the *disposition/capacity* to contribute to *F*.
      *   *Saves*: Cases 1 (pumping capacity), 2 (latent capacity), 3 (impaired capacity), 5 (enzyme capacity), 6 (refractive/enzymatic capacities), 8 (startling capacity), 9 (flow-regulation capacity).
  2.  **Maintenance Condition**: *T*'s current presence/persistence in *S* is *robustly explained* (causally or constitutively) by *T*'s capacity to contribute to *F*, via an *active, ongoing filter process* operating on *S*.
      *   *Saves*: Cases 1 (natural selection maintains hearts for pumping), 3 (malfunction implies maintenance *for* pumping), 5 (spread *is* maintenance via selection for degradation), 6 (lens crystallins maintained *for* refraction; enzymes elsewhere maintained *for* catalysis), 7 (transcribed stretch lacks filter maintaining it *for* effect), 8 (no filter maintains eyespots *for* startling), 9 (clinical filtering maintains valve *for* flow regulation). *Does the work*.
  3.  **System Scope Condition**: The filter process operates on a *population* of systems (*S_pop*) of which *S* is a token instance, selecting/variants based on consequences within *S*.
      *   *Saves*: Cases 1, 3, 5, 6, 8, 9. Clarifies scope of "presence/persistence" in (2).
  4.  **Filter Generality Constraint**: The filter process can be *any population-level mechanism* (natural/artificial/sexual/cultural selection, market forces, clinical protocols, clonal expansion) that differentially retains variants based on consequences, *provided it is currently active*.
      *   *Saves*: Cases 5 (natural selection), 8 (artificial selection *for geometry*), 9 (clinical filtering).

  **"Active, ongoing filter process"**: A mechanism acting *now* (or within a relevant recent window) on *S_pop*, where *T*'s capacity to *F* causally influences *T*'s retention/spread within *S_pop*. History matters only insofar as it establishes the *current operation* of the filter. Vestiges lack a *current* filter maintaining them *for* the effect.

  **"Robustly explained"**: *T*'s capacity to *F* must be a non-redundant part of the explanation for why *T* (or systems with *T*) persists *now* in *S_pop* under the filter.

  ---

  ### (b) Verdicts Violated by Maintenance Etiology & Why Abandonment is Necessary
  *   **Case 2 (Donor/Anencephalic Heart)**: **Violates.** The heart lacks *any* filter process operating *now* on the population it belongs to (e.g., the individual body, the donor pool) that maintains it *for* pumping. Its presence is accidental or historical. *Why abandon?* Your intuition conflates *latent capacity* with *function*. Function requires the capacity to play a role in its *current maintenance*. A donor heart's "function" is historical or typological, not etiological in the maintenance sense. Case 3 (malfunctioning heart) shows the need for the maintenance condition – it only makes sense if the heart is *supposed* to pump *because* pumping maintains hearts.
  *   **Case 4 (Appendix)**: **Violates (if vestige hypothesis is true).** Granting it's a vestige, its current presence is not robustly explained by its capacity to harbor flora. The filter (natural selection) maintaining appendixes in humans ceased long ago for *any* function. Its current utility is coincidental, not explanatory of its persistence. *Why abandon?* Holding both 2 and 4 requires conflating historical function with current maintenance function. Case 4 is the litmus test: if no *current* filter maintains it *for* the effect, it lacks that function, even if beneficial. Your reluctance stems from typological thinking ("hearts pump, appendixes don't *do* anything"), but function is about *why it's there now*.

  **Result**: Maintenance Etiology saves 1, 3, 5, 6, 7, 8, 9. It forces abandonment of 2 and 4, resolving the tension between them. It cleanly reconciles the pairs:
  *   **Cases 6 & 7**: Not identical. In 6 (Crystallins), the *current* filter (selection for lens transparency) maintains the crystallin *for* its refractive role in the lens. In 7 (Genomic stretch), there is *no* current filter maintaining it *for* its activity (transcription/binding), which is noise.
  *   **Cases 8 & 9**: Not identical. In 8 (Lab moths), the *current* filter (artificial selection) maintains eyespots *for geometry*, not startling. Startling is a side effect. In 9 (Printed valve), the *current* filter (clinical success/patient survival) maintains the valve (or valves like it) *for* flow regulation.

  ---

  ### (c) Retentionism Analyzed
  **Retentionism is an Etiological Account with a Widened Time Window and Filter Scope**.
  *   **Disguise Fails Here**: Your clause (ii) "...the trait's *continued presence*... is explained... by that capacity..." is explicitly *etiological*. It explains current presence by past/future consequences. The disguise fails because:
      1.  **"Continued presence" implies history**: This phrase inherently references a temporal process – the trait was present before and *continues* to be present *because* of its capacity. This is etiological (consequence etiology), not merely current causal role.
      2.  **Contrast with Causal-Role**: Pure causal-role accounts (e.g., Cummins) assign function based solely on current causal contribution within a system *without* requiring that contribution to explain the trait's existence or persistence. Retentionism *requires* the causal capacity to explain persistence, anchoring it firmly in etiology.
  *   **Widening the Window**: It moves beyond *original* selection (standard etiology) to include *ongoing* maintenance ("continued presence").
  *   **Widening the Filter**: It explicitly includes non-biological filters (markets, clinics, culture).

  **It is distinct from standard etiological accounts** primarily by emphasizing *current maintenance* over *historical origin* (though history informs current maintenance). It's distinct from causal-role by the crucial maintenance clause.

  ---

  ### (d) Verdicts on New Cases via Maintenance Etiology
  1.  **Lactase Persistence**:
      *   **Population with long dairying history**: *Has* the function of digesting lactose. Active filter (natural/cultural selection via nutritional advantage) maintains the allele *for* this capacity.
      *   **Population without dairying history**: *Lacks* the function of digesting lactose. The allele may be present (e.g., drift, founder effect), but no active filter maintains it *for* lactase digestion. Its persistence isn't explained by that capacity. It might have no function, or a different one if maintained for another reason.
  2.  **Gene-Drive Construct**: *Has* the function of spreading itself (or perhaps disrupting the target gene). The active filter (the drive mechanism itself acting as a *constitutive* population-level filter) maintains its presence/spread *because* of its drive capacity. Its spread *is* the explanation for its persistence, even without bearer advantage.
  3.  **Show-Line Dewclaw (retained by breed standard, non-functional)**: *Has* the function of conforming to the breed standard. The active filter (artificial selection by breeders/judges) maintains the dewclaw *for* meeting the breed standard. Its current presence is explained by this capacity (to satisfy the standard), not by any mechanical function. "Doing nothing" mechanically is irrelevant; it "does" what the filter selects for (existing per standard).

  ---

  ### (e) Explanatory Power of Maintenance Etiology
  **Maintenance Etiology *Licenses Genuine Function Explanations*.** It directly licenses explanations of the form: "Why is trait *T* present/persisting in system/population *S*? Because *T* has the capacity to *F*, and *F*ing contributes to the success of *S* under the active filter process operating on *S_pop*."

  *   **How it Works**: The function attribution (*F*) identifies the specific consequence (*F*) of *T* that plays a causal role in explaining *T*'s *current persistence* within the relevant system/population under the active filter. This is precisely the explanatory structure used in much of biology:
      *   Evolutionary Biology: "The function of camouflaging coloration is to avoid predators (*explaining* why camouflaged variants are maintained in the population by natural selection)."
      *   Medicine/Physiology: "The function of the kidney is to filter blood (*explaining* why kidneys are maintained in the body via homeostatic/developmental processes and clinical success)."
      *   Biotechnology: "The function of the gene drive is to spread the modification (*explaining* why it increases in frequency in the population via the drive mechanism)."
  *   **Contrast with Taxonomy**: A mere taxonomy would sort traits based on effects or histories without linking the effect to the *explanation for the trait's presence*. Maintenance Etiology makes this link essential: the function *is* the effect that explains maintenance. Sorting is a byproduct of this explanatory link.
  *   **Strength**: It captures the dynamic, "forward-looking" aspect of function in evolving/engineered systems (Cases 5, 9, Gene-Drive) without abandoning the core etiological insight that functions explain persistence. It avoids the explanatory impotence of pure causal-role accounts (which cannot explain *why* the trait is there) and the rigidity of strict historical etiology (which struggles with novel traits or rapidly changing contexts).

  **Conclusion**: Maintenance Etiology, derived from your core intuitions (especially the critical importance of *current maintenance* highlighted in Cases 5, 8, 9 and the rejection of inert-but-historical "functions" in Case 4), provides a coherent principle. It forces the abandonment of typological intuitions (Cases 2, 4) but delivers robust function explanations central to biological reasoning. Its power lies in dynamically linking a trait's current causal capacity to the active processes that sustain its existence.
