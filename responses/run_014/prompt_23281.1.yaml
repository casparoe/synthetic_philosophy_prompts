answer: |-
  ## Wrestling Infinity: Preserving Aggregation by Restricting the Realm of Value

  The allure of aggregative consequentialism – the idea that the moral worth of an action lies in the total sum of welfare it produces – is undeniable. It captures an intuitive sense that *more* positive value is better and that the sheer scale of well-being matters. Yet, this elegance shatters against the uncaring rocks of infinity. If the universe is spatially or temporally infinite and contains a mixture of positive and negative welfare states, the quest for a definitive "total sum" becomes mathematically and morally treacherous. The divergent series problem, exemplified by the Riemann rearrangement theorem, reveals that the order of summation dictates the outcome: any finite value, positive or negative infinity, or even divergence itself can be achieved by cleverly reshuffling the infinite sequence of welfare contributions. This renders the core tenet of total consequentialism – that actions are judged by their impact on the *total* – either meaningless (if the sum is undefined) or arbitrary (if it depends on a morally irrelevant counting order). Faced with this abyss, numerous strategies have emerged. However, upon rigorous examination, most either subtly abandon the commitment to a truly infinite moral universe or jettison meaningful aggregation. The only coherent path forward, despite its significant cost, is to **explicitly restrict the domain of moral concern to a finite spatiotemporal region, thereby preserving robust aggregation where it remains mathematically viable.**

  **Evaluating the Escape Routes:**

  1.  **Temporal/Spatial Discounting:** Assigning diminishing weights to welfare events based on distance (temporal or spatial) aims to force convergence. While mathematically effective (ensuring absolute convergence if discounting is sufficiently steep), it covertly surrenders the infinity assumption. If discounting is strong enough to guarantee convergence regardless of future/past content, it implies that events beyond a certain horizon contribute *vanishingly little* to the moral calculus. This functionally treats the universe *as if* it were finite for ethical purposes. More damningly, the discount rate itself is arbitrary and lacks a non-circular moral justification – why prefer exponential decay over hyperbolic, or any decay at all? It smuggles in a finite horizon while pretending to engage with infinity.

  2.  **Non-Aggregative or Local-Comparison Frameworks:** Approaches like average utilitarianism, maintaining positive value, rule consequentialism with finite scope, or purely local pairwise comparisons (e.g., "Act A improves the welfare of more beings than Act B *in its immediate vicinity*") avoid the summation problem by design. However, they fundamentally abandon total aggregation. Average utilitarianism ignores scale and leads to repugnant conclusions in finite populations. Maintaining positive value is arbitrary and ignores significant harms. Rule consequentialism often relies on tacitly finite assumptions about rule compliance scope. Local comparisons fail to capture the intuition that creating vast amounts of positive welfare in distant galaxies, even if locally "irrelevant," *should* be morally significant. These approaches solve the mathematical problem by sacrificing the core aggregative intuition that the sheer *amount* of goodness matters.

  3.  **Exotic Summation Methods (Cesàro, Banach limits, Hyperreals):** These mathematical tools offer ways to assign values to some divergent series. Cesàro summation averages partial sums. Hyperreal numbers embed infinities and infinitesimals, allowing "sums" defined via ultrafilters. While ingenious, these methods suffer fatal flaws for ethics:
      *   **Arbitrariness:** Cesàro sums depend on the order of summation. Hyperreal sums depend critically on the choice of ultrafilter – an inherently non-constructive, axiom-of-choice-dependent object with no physical or moral correlate. Why should the moral value of the universe hinge on an arbitrary mathematical choice made in an abstract extension of the real numbers?
      *   **Non-Uniqueness & Manipulability:** Different methods yield different answers for the same series. Riemann rearrangement still applies to conditionally convergent series; exotic sums often fail to respect the intuitive value of rearrangements. This reintroduces the problem of order-dependence through the back door of mathematical choice.
      *   **Lack of Ethical Meaning:** Assigning a hyperreal "sum" like `ω - π` (some infinite number minus pi) provides no meaningful moral guidance. It replaces an undefined real sum with a precise but ethically opaque non-real entity. Cesàro sums can smooth oscillations but obscure the underlying divergent reality. These methods feel like formal tricks that obscure the ethical dilemma rather than resolve it.

  **The Case for Domain Restriction: Owning the Cost**

  This leaves **explicit domain restriction** – limiting moral concern to a well-defined finite region (e.g., our future light cone, a specific civilization's sphere of influence, a bounded temporal epoch) – as the only viable contender. Its virtues are clarity and preservation:

  1.  **Mathematical Coherence:** Within a finite set of welfare-bearing entities, summation is well-defined, unambiguous, and immune to rearrangement problems. Aggregation works perfectly.
  2.  **Preservation of Core Aggregative Intuition:** The total amount of welfare *within the domain* genuinely matters. Creating more positive well-being or reducing suffering within this sphere is straightforwardly good.
  3.  **Action Guidance:** It provides clear (in principle) verdicts on actions based on their impact on the finite domain.

  The cost, however, is stark and must be owned: **It explicitly abandons the assumption that the potentially infinite universe *as a whole* is morally relevant.** We acknowledge that beings or events outside the designated finite region simply do not count in our aggregative calculus, regardless of their welfare state.

  This cost is significant. It seems intuitively troubling to declare that the suffering of beings beyond an arbitrary boundary (say, outside our cosmological horizon) is utterly irrelevant. It feels parochial. However, this cost is preferable to the alternatives:

  *   **Versus Discounting:** Domain restriction is *honest*. It doesn't pretend distant events matter a tiny bit; it states they are outside the scope of *this particular* aggregative calculus. Discounting pretends to include infinity while functionally annihilating it through exponential decay.
  *   **Versus Non-Aggregation:** Domain restriction preserves the powerful aggregative intuition *where it can work*. We retain the idea that the total well-being of Earth, or humanity, or our galaxy, *matters*. Non-aggregative approaches sacrifice this entirely.
  *   **Versus Exotic Sums:** Domain restriction avoids the profound arbitrariness and ethical opacity of relying on mathematically convenient but morally unjustified constructs like ultrafilters.

  The justification for the boundary isn't necessarily arbitrary. It can be grounded in practical epistemology (we can only know and influence a finite region), causal connectivity (only entities within our causal future matter for our actions), or even a form of moral particularism (our strongest obligations are to those we can directly affect or relate to). While the specific boundary might be contestable, the *necessity* of having one is the price of keeping aggregation meaningful.

  **Conclusion: Aggregation Demands Finitude**

  The divergent series problem is not a mere technical curiosity; it is a profound challenge to the coherence of total aggregative consequentialism in an infinite universe. Strategies like discounting and exotic summation offer illusory solutions, either covertly abandoning infinity or introducing unacceptable arbitrariness. Non-aggregative approaches sacrifice the core intuition that the total amount of welfare matters. Faced with this trilemma, the only defensible path is to embrace domain restriction.

  This means accepting that if the universe is infinite, consequentialism cannot coherently assign value to the whole. We must focus our aggregative moral concern on a finite domain – perhaps the sphere of beings causally connected to us, or the future we can reasonably influence. Within this domain, the total sum retains its moral significance. Beyond it, we must either remain silent or adopt fundamentally different ethical frameworks that do not rely on infinite summation. This conclusion demands humility: aggregative consequentialism, as traditionally conceived, may be a theory for finite agents in a potentially finite (or finitely relevant) portion of reality. Owning this limitation is not defeat; it is the necessary cost of preserving the integrity of aggregation where it can meaningfully operate. The infinite whole escapes our sums, but the finite part we inhabit remains vividly within our moral compass.
