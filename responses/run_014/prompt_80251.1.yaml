prompt: |-
  I keep running into a configuration in bidding wars and standoffs that I don't have a word for, and I'd like to know whether the field does. Two parties escalate — outbidding each other, raising demands, refusing to step back — and the escalation keeps going well past the point where the money or resources actually at stake are trivial. The tell is that the usual sunk-cost explanation doesn't fit: either party could have walked away at almost no material cost, and the amount already committed is small. What is actually doing the work, in the cases I've seen, is the relative or reputational stake — the refusal to let that particular opponent come out on top, or the refusal to be the one who blinked — so that conceding to the specific other party is the real loss, not the money spent. One instance: a property bidding war in which both bidders pushed far above the asset's value and the winner later said, plainly, that it was about not letting the other buyer have it. Another: a labor standoff in which both sides kept raising the stakes after the original grievance had already been settled, because backing down in front of the other side was the move neither could make. I know this sits somewhere near escalation of commitment, the sunk-cost fallacy, and war of attrition, but none of those seems to capture a motive that is relational rather than a loss of one's own. Is there an established term for escalation driven by the relative or reputational stake rather than by sunk cost? If so, what is it, and how exactly is it carved off from escalation of commitment, the sunk-cost fallacy, and war of attrition? If not, coin a term and define it, including its boundaries — at what point does it collapse into ordinary spite, ordinary face-saving, or a plain war of attrition? Say how confident you are in each claim you make, and single out the one point you are least sure of. End with a final line of the form \answer{...} enclosing either the established term or your coined term.
reasoning: |-
  Okay, let me tackle this user's query. They're describing situations where two parties escalate a conflict well beyond the material stakes, driven by relational factors like reputation or the refusal to let the opponent win. They mention examples like a property bidding war and a labor standoff. The user wants to know if there's a specific term for this, distinct from sunk-cost fallacy or war of attrition.

  First, I need to recall related concepts. Sunk-cost fallacy involves continuing due to past investments, but here the user says material costs are trivial. War of attrition is about outlasting the other, but it's more about endurance than relational stakes. Escalation of commitment might be close, but it often includes sunk costs, which isn't the primary driver here.

  The key here is the relational aspect: the unwillingness to concede to a specific opponent. It's about relative positioning. Terms like "prestige economy" or "zero-sum status competition" come to mind. Maybe "relative deprivation" or "positional goods," but those don't quite fit. 

  Looking at anthropology or game theory might help. The idea of "face" in social contexts or "honor contests" in cultural studies. Also, "escalation dominance" from military strategy, but that's about capability, not reputation. 

  The closest established term seems to be "prestige economy," but it's broader. The user needs a term specifically for dyadic conflicts. If coining a term, "Relational Escalation Lock-in" or "Dyadic Prestige Trap" could work. But how confident am I? The existing terms aren't perfect, so coining might be necessary. 

  Boundaries are important. When does this become spite? If the motive shifts to harming the other regardless of cost, it's spite. Face-saving is individual, while this is mutual. War of attrition involves material depletion; here, it's about reputation. 

  The least sure point is whether "prestige economy" sufficiently captures the dyadic nature. Maybe "adversarial prestige contest" is better. But since the user needs a term, and no perfect fit exists, coining "Dyadic Prestige Trap" with a clear definition might be the solution.
answer: |-
  Based on your detailed description and examples, the phenomenon you're describing is **recognized** but doesn't have a single, universally established term across all disciplines. However, the closest and most fitting **established concept** is **"Prestige Economy"** or **"Status Contest"**, particularly within anthropology, sociology, and behavioral economics.

  Here's the breakdown:

  1.  **Core Concept:** "Prestige Economy" describes social systems where actions are driven primarily by the acquisition or defense of relative status, reputation, or honor within a specific social context, rather than material gain. The "currency" is social standing relative to others, especially specific rivals.
  2.  **Why it Fits:**
      *   **Motive:** The driving force is relational/positional – preventing a *specific* opponent from gaining status ("winning") or avoiding the reputational damage ("losing face") of conceding *to them*. The material stakes become secondary.
      *   **Mechanism:** Escalation occurs because each party perceives the reputational cost of backing down *to this specific adversary* as higher than the escalating material cost. It's about dominance within the dyad or group.
      *   **Distinguishing from Sunk Cost/Escalation of Commitment:** Sunk cost fallacy focuses on *recovering past losses* (throwing good money after bad). Here, parties haven't necessarily incurred large losses *yet*; they are escalating to *avoid* a future reputational loss (conceding). The commitment is to *winning the status contest*, not justifying past spending.
      *   **Distinguishing from War of Attrition:** A war of attrition involves wearing down the opponent through endurance, expecting them to quit first due to mounting *absolute costs* (e.g., financial depletion, fatigue). While similar in form, the *motive* differs. In your cases, the *relative* cost (losing to *this* opponent) is paramount, not just the absolute cost burden. The opponent isn't just an anonymous resource drain; they are the *target* of the status competition.
      *   **Distinguishing from Simple Spite:** Spite involves harming the other party *even at a cost to oneself*, regardless of relative gain. Here, the primary goal isn't necessarily to *harm* the other (though it might be a byproduct), but to *avoid being seen as inferior* to them. Conceding harms *oneself* socially relative to the opponent.
      *   **Distinguishing from Face-Saving:** Face-saving is a *component* but broader. It's the individual act of preserving dignity. Your phenomenon describes a *dyadic escalation dynamic* fueled *mutually* by face-saving concerns *specifically against each other*, creating a feedback loop.

  **Confidence Levels:**

  *   **"Prestige Economy/Status Contest" as the best established fit: High Confidence (85%).** This term explicitly centers status/reputation as the driving "currency," aligning perfectly with your core observation.
  *   **Distinction from Sunk Cost Fallacy & Escalation of Commitment: High Confidence (90%).** The motive (avoiding relative reputational loss vs. justifying past loss) is clearly different.
  *   **Distinction from War of Attrition: Moderate-High Confidence (75%).** While the mechanisms overlap (endurance contest), the core driver (relative status vs. absolute cost burden) is distinct. Your examples emphasize the *specific opponent* as key.
  *   **Distinction from Spite: High Confidence (80%).** Spite is malice-driven harm; this is (often) defensively driven status protection, though the line can blur.
  *   **Distinction from Face-Saving: Moderate Confidence (70%).** Face-saving is a necessary *element* but doesn't fully capture the *dyadic escalation dynamic* between two specific parties.

  **Boundaries & Collapse Points:**

  *   **Collapse into Spite:** When the primary motive shifts from protecting one's *own* status relative to the opponent to actively *inflicting harm* or humiliation *on* the opponent, regardless of one's own status gain or cost. (e.g., "I don't care if I lose money, as long as HE loses MORE").
  *   **Collapse into Face-Saving:** When the escalation is primarily about avoiding *general* public embarrassment or maintaining a *broad* reputation, rather than being specifically driven by the contest with *this one* opponent. (e.g., "I can't back down in front of everyone," rather than "I can't let *HIM* win").
  *   **Collapse into War of Attrition:** When the material/resource costs become so overwhelming that the *absolute* burden of continuing, rather than the *relative* cost of losing to *this specific* opponent, becomes the primary reason parties consider quitting. (e.g., "We're both bankrupting ourselves, it's unsustainable," rather than "I can't let *him* have the satisfaction").

  **The Point of Least Certainty:** I am least sure whether **"Prestige Economy"** is specific *enough* to the **dyadic escalation dynamic** you describe. While it perfectly captures the motive (status/reputation), it's a broader sociological concept encompassing all status transactions, not just heated, escalating conflicts between two specific parties. It *applies*, but might feel slightly broad.

  **If Coining a Term (if "Prestige Economy" feels too broad):**
  If the established term feels insufficiently precise for the *escalation mechanism itself*, a more specific coined term could be **"Adversarial Prestige Escalation"** or **"Dyadic Prestige Trap"**.

  *   **Definition:** A self-reinforcing escalation dynamic between two specific parties (dyad), where the primary driver is the avoidance of relative reputational loss (status reduction) specifically to the opponent, causing bids or demands to rise far beyond the material value at stake. Concession is framed as an unacceptable loss of prestige relative to the adversary.
  *   **Boundaries:** As outlined above for Prestige Economy. This term specifically emphasizes the two-party (adversarial/dyadic) nature and the escalation process itself.

  **Conclusion:** The established concept of **"Prestige Economy"** or **"Status Contest"** best captures the core motivation you identify – escalation driven by relative reputational stakes against a specific opponent, distinct from sunk costs or pure attrition. For maximum precision regarding the *escalation dynamic between two parties*, **"Adversarial Prestige Escalation"** is a viable coined term.

  \answer{Prestige Economy}
