answer: |-
  ### Lakatosian Research Programmes Game: "Glowflit Ecology"

  **Core Concept**: Teams operate rival research programmes explaining the behavior of "Glowflits" (fictional light-sensitive organisms). Through 6 rounds, they defend their core thesis against anomalies using auxiliary hypotheses. Scoring rewards predictions with "surplus content" (novel predictions) over ad hoc fixes, with a late-game reversal to showcase Lakatos' "retrospective appraisal."

  ---

  ### **Rules & Setup**  
  **Players**: 4 teams of 4 students each (16 total).  
  **Duration**: 90 minutes.  
  **Materials per Team**:  
  - 1 Core Thesis Card (see below)  
  - 6 Anomaly Cards (revealed round-by-round by facilitator)  
  - 1 Scorecard (printable template provided)  
  - 6 Sealed Prediction Envelopes (or folded paper stapled shut)  
  - Pens, paper for brainstorming.  

  **Research Programmes**:  
  - **Programme A (Phototaxis Core)**:  
    *Hard Core*: "Glowflits move *only* toward the brightest light source."  
  - **Programme B (Cognition Core)**:  
    *Hard Core*: "Glowflits interpret light *patterns* to make decisions."  

  **Game Flow**:  
  1. **Round 0 (10 min)**: Teams receive core theses and study rules. Emphasize:  
     - **Negative Heuristic**: Never contradict the hard core.  
     - **Positive Heuristic**: Use the core to guide auxiliary hypotheses (e.g., Programme A must tie everything to light *intensity*).  
     - **Protective Belt**: Auxiliaries must absorb anomalies without touching the core.  

  2. **Rounds 1–6 (7 min/round)**:  
     - **Step 1**: Facilitator reveals an **Anomaly Card** (data contradicting both cores).  
     - **Step 2**: Teams brainstorm an **auxiliary hypothesis** to explain the anomaly.  
     - **Step 3**: Teams write two things on paper:  
       - (a) Their auxiliary hypothesis.  
       - (b) **YES/NO**: Does this hypothesis predict *anything new* (surplus content)?  
         - If YES, specify the *novel prediction* (e.g., "Glowflits will avoid rapid strobe lights").  
     - **Step 4**: Seal the paper in an envelope *before* the next round’s anomaly is revealed.  
     - **Step 5**: Repeat for all 6 rounds.  

  3. **Scoring (15 min post-round 6)**:  
     - **1 POINT** per round for saving the phenomenon (any plausible auxiliary hypothesis).  
     - **+2 POINTS** if YES + novel prediction is *confirmed* by later data.  
     - **–1 POINT** if YES + novel prediction is *refuted* by later data.  
     - **0 POINTS** if NO (no penalty/reward).  
     - *Scoring is retrospective*: Facilitator checks predictions against all subsequent anomalies.  

  4. **Winning**: Highest score after Round 6. Programme B should overtake Programme A in Round 5 due to a late-confirmed prediction.  

  ---

  ### **Anomaly Sequence & Reversal Mechanism**  
  *Design Notes*:  
  - Early rounds favor Programme A (simple adjustments).  
  - Round 3 forces both into ad hoc fixes (degenerating phase).  
  - Round 4 allows Programme B to make a bold prediction.  
  - Round 5 confirms B’s prediction (progressive shift).  

  | Round | Anomaly Card (Revealed by Facilitator) | Programme A Expected Response | Programme B Expected Response | Confirms/Refutes Prior Predictions? |
  |-------|----------------------------------------|-------------------------------|--------------------------------|-------------------------------------|
  | 1 | Glowflits cluster equally between two lights of *identical* intensity. | Aux: "Glowflits choose randomly when intensities match." (Likely NO surplus) | Aux: "Glowflits ‘vote’ socially; equal pattern = split groups." (Likely NO surplus) | None yet. |
  | 2 | Glowflits ignore a brighter light to follow a *pulsing* dim light (e.g., 3 flashes). | Aux: "Pulsing light ‘fools’ their intensity sensors." (Likely NO) | Aux: "Pulsing mimics a ‘food signal’ pattern." (May predict *other* patterns) | Scores R1 predictions. |
  | 3 | Glowflits gather in *total darkness* where no light exists. | Aux: "They emit invisible ‘dark photons’ we can’t detect." (May claim YES + predict "dark photons" elsewhere) | Aux: "They use darkness to avoid predators; it’s a ‘safe pattern’." (Likely NO or vague) | Scores R2 predictions. |
  | 4 | Glowflits swarm around a *static* dim light if it’s shaped like a spiral. | Aux: "Spirals refract light to *appear* brighter." (Likely NO) | **Bold Conjecture**: "Spirals mimic a ‘nest pattern’; they’ll also avoid *jagged* shapes." (Should claim YES + predict jagged-avoidance) | **Refutes A’s R3 prediction** (if claimed "dark photons" not found). |
  | 5 | Glowflits flee from a *jagged*-shaped light, even if it’s the brightest. | Aux: "Jagged shapes cause ‘intensity scattering’." (Ad hoc; likely NO) | **Prediction Confirmed**: Round 4’s jagged-avoidance validated. | **+2 for B’s R4 prediction**. May refute A’s R4 if they made claims. |
  | 6 | Glowflits ignore *all* lights during heavy rain. | Both adjust (e.g., "Rain scrambles sensors" vs. "Rain is a ‘danger pattern’"). | Scores R5 predictions; B’s R4 points secure its lead. |

  ---

  ### **Printable Scorecard (1 Page per Team)**  
  **Team Name**: ______________  
  **Programme**: ☐ A (Phototaxis) / ☐ B (Cognition)  

  | Round | Anomaly Summary | Auxiliary Hypothesis | Surplus Content? (Y/N) | If Y, Novel Prediction | Save Points (1) | Surplus Points (+2/–1) | Total |
  |-------|-----------------|----------------------|-------------------------|-------------------------|-----------------|------------------------|-------|
  | 1 | Two equal lights → split groups | _____________________ | ☐ Y ☐ N | _____________________ | _____ | _____ | _____ |
  | 2 | Follows pulsing dim light | _____________________ | ☐ Y ☐ N | _____________________ | _____ | _____ | _____ |
  | 3 | Gathers in darkness | _____________________ | ☐ Y ☐ N | _____________________ | _____ | _____ | _____ |
  | 4 | Swarms spiral-shaped light | _____________________ | ☐ Y ☐ N | _____________________ | _____ | _____ | _____ |
  | 5 | Flees jagged light | _____________________ | ☐ Y ☐ N | _____________________ | _____ | _____ | _____ |
  | 6 | Ignores lights in rain | _____________________ | ☐ Y ☐ N | _____________________ | _____ | _____ | _____ |
  | **FINAL SCORE** | | | | | | | **_____** |  

  ---

  ### **Predicted Problems & Limitations**  
  **What Will Go Wrong**:  
  1. **Skimmed Readings = Core Confusion**: Teams may panic and violate the hard core (e.g., Programme A might claim Glowflits "like patterns" in Round 2). *Mitigation*: Intervene early to remind them of negative heuristic.  
  2. **Surplus Content Anxiety**: Teams avoid YES predictions to dodge penalties, missing Lakatos’ point. *Mitigation*: Hint that boldness is rewarded in later rounds.  
  3. **Time Crunch**: 7 min/round is tight. *Mitigation*: Use a visible timer; allow 1 "time extension" coin per team.  
  4. **Scoring Chaos**: Checking 24 envelopes retroactively is messy. *Mitigation*: Have teams swap scorecards for peer grading (facilitator verifies).  

  **What the Game Cannot Replicate**:  
  - **Real Anomalies Aren’t Hand-Delivered**: In science, anomalies arise from experiments/technology, not a facilitator.  
  - **Bold Conjectures Take Decades to Test**: Copernicus wasn’t vindicated in 90 minutes.  
  - **Permissiveness of Lakatos’ Criteria**: Teams may "win" with absurd auxiliaries (e.g., "invisible dark photons"), exposing how easily "progress" can be manufactured.  

  **Debrief to Fill Gaps (10 min)**:  
  - Map gameplay to Lakatos:  
    - **Hard Core**: "What core thesis did you protect at all costs?"  
    - **Protective Belt**: "Which auxiliaries were disposable adjustments?"  
    - **Negative Heuristic**: "How did you avoid core falsification?"  
    - **Positive Heuristic**: "Did your core *guide* new hypotheses (e.g., Programme A always invoked intensity)?"  
  - Stress **retrospective appraisal**: "Programme B was ‘degenerating’ in Round 3 but ‘progressive’ after Round 5. Lakatos says we can only judge programmes *after* predictions play out."  
  - Highlight **limitations**: "Real anomalies aren’t handed to you—scientists must design experiments. And a ‘winning’ programme isn’t ‘true’—it just has more *heuristic power*... for now."  

  ---

  ### **Materials List**  
  - **For Facilitator**:  
    - 4 Core Thesis Cards (2 for A, 2 for B).  
    - 6 Anomaly Cards (printed with the round-by-round data above).  
    - Timer.  
  - **Per Team**:  
    - 1 Scorecard (print template).  
    - 6 Sealed Envelopes (or paper + stapler).  
    - Pens/Paper.  
    - 1 "Time Extension Coin" (scrap paper marked "EXTEND").  

  This game forces students to *live* Lakatos—not just debate him. The sealed envelopes make "surplus content" visceral, and the late reversal underscores why he called science "a history of research programmes, not of theories."
