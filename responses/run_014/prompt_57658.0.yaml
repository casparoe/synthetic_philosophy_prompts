  The user suspects the stalemate comes from differing referents. I need to test that, not assume it. The cases to focus on are mitochondrial donation and Dolly-style cloning, plus the sorites problem (e.g., changing one molecule in the sperm).

  Structuring the deliverable:
  1. **Agreements**: Only include claims both sides genuinely accept. Avoid platitudes. Examples: organism identity requires spatio-temporal continuity; fertilization events occur; twinning exists but is rare. 
  2. **Disagreements Table**: List topics, each side's formulation, and judge if it's substantive or verbal. E.g., row on "origin definition"—essentialist says it's the gamete pair, contingentist says it's ill-defined. Might be verbal if they're talking past each other.
  3. **Cruxes**: Sub-questions that would move the debate. E.g., "Is 'origin' a biological primitive?" or "Does twinning break origin necessity?"
