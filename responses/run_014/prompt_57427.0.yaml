prompt: |-
  Last spring I inherited my mother's half-acre vegetable garden, and a month later I became the person who had to decide what to do about the termite report on her house. Since then I've noticed that my judgments about killing insects don't line up, and I want to know what principle, if any, they are tracking.

  My verdicts. Spraying aphids off the roses with soapy water: fine. Fogging the whole greenhouse to clear whitefly, which kills several hundred times as many insects, including every ladybug inside: also fine, and I do not feel worse about it. Treating the cabbages with a caterpillar-specific bacterial spray: fine, and I feel better about it than the fogging, even though the fogging seems less cruel insect by insect. Setting out a slow-acting sugar bait so the kitchen ants carry poison back and the colony dies over a week: not fine — I would rather flood the nest and be done. Treating the house for termites, which kills more insects than everything else on this list combined: not merely permissible but required, and I would pay for it twice. Spraying the squash vines for borers because losing the whole crop is intolerable, while letting the caterpillars have the outer row of kale: fine, and the difference is entirely about what I stand to lose. Fogging the yard for mosquitoes before my nephew's wedding: fine. A proposal to release gene-drive mosquitoes to collapse the species across the region: not fine, though I would happily fog my own yard every summer. A wasps' nest under the eaves by the door the children use: destroy it. A nest of the same size at the back fence: leave it alone.

  Two of these fight each other directly. I rank a slow bait that kills a few hundred ants worse than a fog that kills tens of thousands, so manner of death seems to dominate numbers; yet I rank termite treatment, on sheer size of what is at stake for me, as obligatory. Manner, numbers, and stakes cannot all be sovereign.

  So: give me a principle, or a small set of candidates, stated precisely enough that I can see which of my cases motivates each clause; tell me what it says about two situations I have not listed — netting the fruit trees rather than spraying them, and a neighbour who plans a neonicotinoid seed treatment on the field adjoining my garden; and say honestly which of my verdicts it cannot accommodate. If the ant bait and the termites cannot both survive, tell me which one goes, and why that one rather than the other.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They inherited their mother's garden and had to deal with termites, and now they're noticing inconsistencies in how they judge killing insects. They've listed several scenarios with different insect control methods and their personal verdicts on each. The user wants a principle that explains these judgments, and they want it applied to new situations. They also want to know which of their verdicts the principle can't accommodate.

  First, I need to break down their judgments. They're fine with soapy water for aphids and fogging for whiteflies, even though fogging kills more insects. But slow-acting ant bait is not okay—they prefer flooding the nest for a quick kill. Termite treatment is mandatory despite the high kill count. The difference between destroying a wasp nest near children versus leaving one at the back fence shows location matters. Gene-drive mosquitoes are a no, but fogging is fine. 

  The key conflicts they mention are: slow bait vs. fogging (manner of death vs. numbers), and termites being obligatory despite high numbers because of stakes. So manner, numbers, and stakes can't all be the main factors. 

  I should look for patterns. Quick methods like flooding or fogging are acceptable, but slow poison isn't. Proximity and threat level (like wasps near kids) matter. High stakes (termites damaging the house) override concerns about numbers. But gene-drive mosquitoes affect the whole species, which is too far-reaching. 

  Possible principles: Maybe a combination of necessity, proportionality, and cruelty/minimizing suffering. Also, the scale of impact and direct threat. Termites threaten the home structure, making it necessary. Ant bait causes prolonged suffering, which is cruel. Gene-drive affects the entire species, which is disproportionate to the problem (mosquito annoyance). 

  Testing against their scenarios: Fogging kills quickly, so less suffering, hence acceptable. Slow bait causes slow death, so rejected. Termites: high stakes justify the action despite numbers. Wasps near kids are a direct threat, back fence isn't. Gene-drive is systemic and irreversible, hence not okay. 

  New situations: Netting trees instead of spraying avoids killing, which aligns with minimizing harm. Neonicotinoids affect beneficial insects and environment beyond the target, so should be opposed based on indirect harm and ecosystem impact. 

  Which verdicts don't fit? The termite treatment has high numbers but is obligatory. The principle allows this because stakes (home integrity) are critical. The ant bait is rejected due to cruelty, which the principle addresses. But the fogging for mosquitoes before a wedding—low stakes (comfort) but still acceptable. Here, proportionality might be stretched. If the principle prioritizes direct threats and quick methods, then the wedding fogging might be borderline, but the user accepts it. Maybe the immediacy and locality make it permissible. 

  The conflict between ant bait and termites: the principle justifies termites because of catastrophic stakes, while ant bait is both low stakes and cruel. So both can coexist under the framework. 

  Honest problem: The wedding mosquito fogging. It's for comfort, not a dire threat, yet the user is fine with it. The principle might not fully justify this, as it's a high kill count for relatively low stakes. So the principle might need to accept some exceptions for convenience, but that's a weakness. Alternatively, since it's a local, temporary measure without long-term effects, it's permissible under the "contained scope" clause. 

  Overall, the core principle seems to be minimizing suffering (manner of death) and proportionality based on stakes, with consideration for directness and scale. The gene-drive example shows systemic risk is unacceptable, while local, immediate threats are handled case by case.
answer: |-
  Here's a principle derived from your judgments, broken down into core components, applied to your cases and new situations, with identified tensions:

  **The Principle: Permissible Insect Control Hierarchy (PICH)**

  1.  **Necessity & Direct Threat:** Action must aim to prevent significant, tangible harm to *your* health, safety, vital property, essential food sources, or core human activities (like a family event). Mere nuisance or minor inconvenience is insufficient justification for large-scale or cruel killing.
  2.  **Minimize Suffering (Manner):** When killing *is* necessary, the method must inflict the least suffering possible *per individual insect*, prioritizing swiftness and avoiding prolonged, internal distress. Cruelty is a primary negative factor.
  3.  **Proportionality (Scale & Specificity):**
      *   *Scale:* The scale and severity of the action must be proportional to the scale and severity of the *actual* threat posed *to you*. Catastrophic threats justify larger-scale actions; minor threats require minimal action.
      *   *Specificity:* Prefer methods that target the specific pest causing the harm. Broad-spectrum methods are less desirable unless specificity is impossible or the threat is severe/immediate.
  4.  **Contained Scope:** Actions should be limited in geographic scope and temporal impact. Avoid systemic, irreversible, or ecosystem-wide interventions unless facing an existential threat *to humans*.
  5.  **Ecosystem Awareness (Secondary Constraint):** Avoid actions causing severe, unintended collateral damage to beneficial insects or the wider environment *beyond the immediate necessity*, especially when alternatives exist. (This is often overridden by high stakes).

  **How PICH Explains Your Verdicts:**

  *   **Spraying Aphids (Fine):** Minimal harm (soapy water), specific target, necessary to protect roses (valued property).
  *   **Greenhouse Fogging (Fine):** High kill count, but necessary to save valuable plants/seedlings from destruction (high stakes *for the crop*). Relatively quick death (fog). Contained scope (greenhouse). Overrides ecosystem awareness due to stakes.
  *   **Caterpillar Spray (Better than Fogging):** High stakes (cabbages), specific targeting (bacterial spray), minimizes suffering for non-targets. Better specificity than fogging.
  *   **Slow Ant Bait (Not Fine):** **Violates Minimize Suffering (Manner).** Slow, internal poisoning causes prolonged distress. Threat (kitchen ants) is a nuisance, not a significant health/safety/property threat (low stakes). Cruelty dominates despite low numbers.
  *   **Flooding Ant Nest (Preferred):** Addresses the nuisance (low stakes) with a swift method. Preferable to slow poison under Minimize Suffering.
  *   **Termite Treatment (Required):** Catastrophic threat to core property (the house). **Overwhelms Minimize Suffering and Scale concerns** due to extreme **Necessity & Direct Threat (Stakes)**. Contained scope (your property).
  *   **Squash Borers vs. Kale Caterpillars (Fine):** **Proportionality (Scale/Stakes).** Losing the entire squash crop is high stakes *for you*; losing outer kale leaves is low stakes. Action proportional to potential loss.
  *   **Yard Mosquito Fogging (Fine):** Protects a core human activity (wedding) from significant nuisance/health annoyance. Contained scope (your yard), relatively quick kill. Stakes justify scale.
  *   **Gene-Drive Mosquitoes (Not Fine):** **Violates Contained Scope & Proportionality.** Scale is massive (regional species collapse), irreversible, systemic. Threat level (nuisance/annoyance) does NOT justify ecosystem-wide intervention. High potential for unforeseen consequences.
  *   **Door Wasp Nest (Destroy):** **Necessity & Direct Threat.** Significant, immediate safety risk to children.
  *   **Fence Wasp Nest (Leave):** **Lacks Necessity & Direct Threat.** No significant risk to people/property. Low stakes.

  **Resolving the Conflicts:**

  *   **Slow Bait (Bad) vs. Fogging (Good):** Explained by **Minimize Suffering (Manner)** dominating when stakes are relatively low (ants = nuisance, whitefly = crop threat). Fogging, while large scale, *is* quick. Slow bait is cruel.
  *   **Termites (Required despite Scale):** Explained by **Necessity & Direct Threat (Stakes)** being **paramount** when facing catastrophic personal loss (home destruction). This overwhelms concerns about Manner and Scale.

  **Application to New Situations:**

  1.  **Netting Fruit Trees vs. Spraying:**
      *   **PICH Verdict: Strongly prefer netting.**
      *   **Why:** Netting fulfills **Necessity** (protecting fruit) while **Minimizing Suffering** (avoids killing entirely) and maximizing **Specificity** (physically excludes pests). Spraying would kill pests, beneficial insects, and potentially harm the environment (**Ecosystem Awareness**), causing unnecessary suffering. Netting is the clearly superior option under PICH unless utterly impractical.

  2.  **Neighbor's Neonicotinoid Seed Treatment:**
      *   **PICH Verdict: Objectionable / Not Fine.**
      *   **Why:** While the neighbor might claim **Necessity** (crop protection), neonicotinoids are systemic, persistent, broad-spectrum insecticides that cause severe collateral damage (**Violates Specificity, Ecosystem Awareness**). They harm beneficial pollinators (bees!), soil organisms, and aquatic life far beyond the target field. The scale of unintended harm is disproportionate to the typical agricultural threat they address (**Proportionality**). They can also cause prolonged suffering. This represents an unacceptable level of uncontrolled, ecosystem-wide collateral damage for a contained agricultural need.

  **Honest Accommodation Failure:**

  *   **The Weakest Fit: Yard Mosquito Fogging Before Wedding.**
      *   **Why it strains PICH:** The **Necessity** argument ("core human activity") is valid but arguably weaker than protecting a home (termites) or essential food crop (squash borers). It's primarily comfort/convenience against a nuisance. The **Scale** is large (killing tens of thousands). **Minimize Suffering** is met (quick kill), and **Scope** is contained (your yard). However, **Ecosystem Awareness** is violated (kills beneficial insects indiscriminately in the yard).
      *   **Why it *just* fits (for you):** PICH prioritizes high human stakes overriding ecosystem concerns. You judge the wedding's importance *to you* as high enough to justify the scale and collateral damage. A stricter interpretation of "core human activity" or higher weighting of **Ecosystem Awareness** might make this impermissible, but *your* verdict indicates the stakes *for you* are sufficient. It sits on the borderline where "core human activity" stretches to cover significant personal/social events.

  **Resolving the Ant Bait vs. Termite Conflict:**

  Both verdicts *can* survive under PICH because the **nature of the stakes** is fundamentally different:

  1.  **Ant Bait:** Stakes are very low (nuisance). Therefore, **Minimize Suffering (Manner)** becomes the dominant factor. Slow poison is cruel and unacceptable for a mere nuisance. A swift flood is the maximum justifiable response.
  2.  **Termites:** Stakes are catastrophic (home destruction). **Necessity & Direct Threat (Stakes)** becomes the paramount, overriding factor. The extreme personal loss justifies the large-scale killing, even though the method might not be the absolute fastest per termite (though it's generally designed to be colony-efficient). The sheer scale is proportional to the existential threat *to your property*.

  **Conclusion:** Your judgments are primarily tracking a hierarchy where **catastrophic personal stakes justify large-scale action despite the suffering caused, but for lesser threats, minimizing suffering per individual becomes the critical ethical constraint.** Specificity, scope, and ecosystem impact are important secondary factors that modulate decisions within these bounds. PICH captures this hierarchy and explains your specific approvals and objections, with mosquito fogging for the wedding being the most borderline case due to the subjective weight given to the stakes of a social event.
