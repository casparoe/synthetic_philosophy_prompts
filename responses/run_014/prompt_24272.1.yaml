  *Key nuances addressed:*  
  - Distinguishes between *exploiting weaknesses* (valid) and *fabricating claims* (invalid).  
  - Avoids rerunning debates (impractical), instead focusing on record integrity.  
  - Protects judge reliance on meta-arguments without stifling adversarial tactics.  
  - Grounds policy change in demonstrated evaluative failure, not theoretical risk.
