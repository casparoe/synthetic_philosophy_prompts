prompt: |-
  I'm assembling a small working group — four or five researchers, two years, mostly philosophy with a little law and decision theory — around precommitment: Ulysses-style self-binding, constitutional entrenchment, and the idea of precommitting a technology race so its participants can't later cash in the very thing they fear. The funder wants a ranked shortlist of open questions, and I care more about the reasoning than about the list. Which questions deserve the group's years, and why? I'm especially interested in which questions are upstream of which: whether the binding force of a precommitment reduces entirely to the authority of whoever enforces it, whether it matters that the later self may differ from the earlier one not by weakness of will but by holding different and possibly better values, and whether entrenchment is genuinely self-binding or only a coordination equilibrium dressed up in temporal language. Pick three or four, order them, tell me what would make each tractable or a dead end for philosophers rather than lawyers or economists, and say what would move one up or down the ranking.
