answer: |-
  Here’s a systematic stress-test of your position, ranked by decisiveness and focused on the law-like compatibility clause. I’ll prioritize cases where identical bases yield irreconcilable superstructures with no traceable residual variables.

  ---

  ### **Fatal Defeaters**  
  *(Would falsify the law-like compatibility claim or reveal incoherence)*  
  1. **Athenian Democracy vs. Roman Republic (Same Slave-Mode Base)**  
     - **Case**: Both relied on slave labor, agrarian surplus, and similar property relations. Yet Athens developed radical direct democracy (sovereign Ecclesia, sortition), while Rome had oligarchic republicanism (Senate dominance, elected magistrates).  
     - **Why fatal**: No residual base variable (e.g., trade volume, soil fertility) explains Athens’ rejection of hereditary aristocracy vs. Rome’s entrenched patrician class. A defender cannot appeal to "lag" or "residue" without retroactively redefining the base.  
     - **Asymmetric cost**: Rival theories (e.g., institutional path-dependence) predict this divergence; yours cannot without abandoning law-like compatibility.  

  2. **Meiji Japan vs. Early Industrial Britain (State-Forced Capitalism)**  
     - **Case**: Meiji Japan rapidly industrialized with a state-controlled capitalist base (zaibatsu, state-owned factories). Superstructurally, it retained imperial autocracy, Shinto ideology, and samurai-bureaucratic dominance — diverging sharply from Britain’s liberal parliamentarianism and secular utilitarianism under analogous industrial bases.  
     - **Why fatal**: The base was *intentionally constructed* by a pre-existing superstructure (Tokugawa state apparatus), inverting your causal direction. No "residual" base difference explains authoritarianism vs. liberalism.  

  ---

  ### **Severely Damaging Defeaters**  
  *(Require untenable residual variables or expose predictive failures)*  
  3. **Feudal Poland vs. France (Elective Monarchy vs. Absolutism)**  
     - **Case**: Identical feudal bases (serfdom, manorialism). Poland’s superstructure included elective monarchy, noble vetoes (Liberum Veto), and decentralized law; France had absolutism (Louis XIV), centralization, and divine-right ideology.  
     - **Why damaging**: Cultural/ideological residues (e.g., Sarmatism in Poland) better explain divergence than base variables. If you label culture a "residual base" factor, the base/superstructure distinction collapses.  

  4. **Post-1991 Russia vs. Poland (Transition to Capitalism)**  
     - **Case**: Similar Soviet-era bases transitioned to capitalism. Poland developed liberal democracy and EU integration; Russia evolved into authoritarian oligarchy.  
     - **Why damaging**: Superstructural divergence (democracy vs. autocracy) emerged *despite* analogous privatization/market reforms. Base-focused predictions failed; rival institutional theories (e.g., civil society strength) succeeded.  

  ---

  ### **Awkward but Survivable Defeaters**  
  *(Explainable via lag/residues at the cost of predictive power)*  
  5. **Protestant Reformation in Feudal Economies**  
     - **Case**: Lutheran/Catholic schism occurred in regions with identical feudal bases (e.g., German states). Ideological superstructure split preceded capitalist transitions.  
     - **Why awkward**: Attributing this to "ideological residues" or "non-base triggers" (e.g., printing press) concedes ground to idealist rivals but doesn’t falsify your core claim.  

  6. **Islamic Golden Age vs. Medieval Europe (Merchant Capitalism)**  
     - **Case**: Similar trade-intensive, pre-industrial bases. Islamic societies developed secular science, religious pluralism, and centralized legal codes; Europe had scholasticism and papal authority.  
     - **Why awkward**: Divergence is explainable through residual variables (e.g., Greco-Arabic translation movements), but only by making the base "softer."  

  ---

  ### **Unfalsifiability Risk Assessment**  
  - **Problem**: If *every* superstructural divergence is attributed to (a) unobserved residual base factors, (b) lags, or (c) "imperfect" base matches, the law-like claim becomes unfalsifiable.  
  - **Defender’s response**: Likely dismiss cases like Athens/Rome as "superficially similar bases" by emphasizing Rome’s conquest economy or Athens’ maritime reliance — but this risks *ad hoc* base redefinition.  
  - **Cost**: Predictive power erodes. If bases must be "identical down to quantum fluctuations" to expect superstructural parity, the theory loses utility.  

  ---

  ### **Verdict: Athenian democracy vs. Roman republic incompatibility**  
  This case directly challenges your law-like compatibility clause: identical bases (slave-based agrarianism) produced irreconcilable political superstructures (direct democracy vs. oligarchic republicanism) with no residual base variable to bridge the gap. Rivals (e.g., institutional contingency theories) explain this cleanly; your view must either abandon "law-like" or stretch "base" beyond recognition. It is the most decisive exposure of your added clause.
