answer: |-
  The critical factor determining whether a mayor gets "dirty hands" isn't the necessary act itself, but whether the public *would have endorsed it* had they been fully informed beforehand.

  **Scenario:** Mayor Chen faces a severe drought threatening the town's water supply. Emergency infrastructure repairs are essential to prevent rationing and potential health hazards, but the only available funds are earmarked for a popular, nearly completed playground renovation in a well-off neighborhood. Chen secretly redirects the playground funds to the water repairs. The repairs succeed, averting crisis, but the playground is delayed indefinitely. Chen's motive is solely public welfare.

  *   **Version A (Dirty Hands Likely):** Chen makes the decision entirely alone, informing no one – not the council, not the playground committee, not the public – until after the funds are spent and the repairs underway. The playground neighborhood is furious upon discovery, feeling betrayed. The wider public, while relieved about water, is uneasy about the unilateral secrecy and broken promise, viewing Chen as deceptive even if the outcome was necessary. Chen feels compelled to apologize for the *manner* of the decision.
  *   **Version B (Less/Little Stain):** Before acting, Chen quietly convenes a confidential meeting with key, trusted community leaders representing diverse groups (including the playground neighborhood association head, a respected environmental advocate, and a senior council member). Chen presents the stark choice: delay the playground or risk severe water rationing. These leaders, understanding the gravity, privately urge Chen to divert the funds, acknowledging the necessity outweighs the broken promise *in this emergency*. When the decision becomes public later, these leaders (though not naming names) publicly state that *informed community representatives* understood and supported the difficult choice when presented confidentially. While the playground neighborhood is disappointed, the wider public accepts the decision as a tough but necessary trade-off made with *some* community validation. Chen expresses regret for the outcome but not guilt for the decision-making process.

  **The Critical Detail:** The **quiet, confidential briefing and tacit endorsement from respected community representatives** in Version B. This detail provides evidence that *if* the wider public had been fully informed in a timely manner, they *would likely have understood and endorsed the trade-off*. It demonstrates the mayor sought latent consent through trusted intermediaries.

  **What Breaks Without It:** Remove the confidential briefing, and both scenarios collapse into Version A. Without evidence of potential public endorsement *if informed*, the act appears purely unilateral and deceptive, creating the "dirty hands" stain regardless of the necessity or motive. The mayor appears to have *avoided* seeking consent, not just lacked the time for a referendum.

  **Skeptic's Pushback:** A critic of "dirty hands" would argue:
  1.  **No Moral Stain:** Chen did the objectively right thing (avert water crisis) for the right reason (public welfare). The *only* "dirt" is political fallout from disappointed voters, not genuine moral guilt. Apologizing for a necessary act is weakness or pandering.
  2.  **Blame the Voters:** If the public would punish Chen for saving the water supply over a playground, *that's the public's failing*, not Chen's. Leaders shouldn't be morally tainted for making necessary choices voters might irrationally reject.
  3.  **Process vs. Outcome:** The secrecy was a practical necessity to act swiftly, not a moral failing. The ethical weight rests entirely on the outcome and motive, not the process of achieving it under constraints. The "stain" is an illusion created by messy politics, not ethics.
