answer: |-
  ### (1) Dependency Map (Order of Components)

  **1. Framework Setup (5 mins):** Define a finite set of worlds (e.g., 3 worlds) and a set of propositions (e.g., atomic events and their disjunctions). Introduce credence functions as assignments of numbers to propositions.  
  *Justification*: Without specifying the ontology (worlds/propositions) and credences as numerical, the argument lacks objects to evaluate. Reversing this would leave students unable to grasp what "accuracy" measures.  

  **2. Accuracy and Scoring Rules (10 mins):** Define a scoring rule \(s(c(A), v)\) as a function measuring inaccuracy of credence \(c(A)\) given truth value \(v\) (1 or 0). Emphasize continuity and differentiability.  
  *Justification*: Dominance requires a metric for comparison. Skipping this would make "dominance" meaningless.  

  **3. Strictly Proper Scoring Rules (10 mins):** Define strict propriety: For any probability function \(p\), \(p\) uniquely minimizes expected inaccuracy relative to itself. Use the Brier score \(s(x,v) = (x - v)^2\) as an example.  
  *Justification*: Propriety must precede dominance calculations. Reversing this (e.g., showing dominance first) risks students attributing the result to an arbitrary scoring rule, undermining the generality of the argument. Propriety ensures the scoring rule "respects" probabilistic coherence, which is why non-probabilities are penalized.  

  **4. Accuracy Dominance (5 mins):** Define dominance: Credence \(d\) dominates \(c\) if at every world, \(d\) has strictly lower total inaccuracy than \(c\) (summed over propositions).  
  *Justification*: Dominance is the conclusion’s engine; introducing it earlier would lack motivation.  

  **5. Theorem Statement (5 mins):** State probabilism: A credence is non-dominated iff it satisfies the probability axioms. Highlight the direction: Non-probabilistic credences are dominated.  
  *Justification*: The theorem crystallizes the goal. Delaying it obscures the purpose of prior steps.  

  **6. Proof via Example (15 mins):** Use a concrete case (see section 2) to show a non-probabilistic credence dominated by a probabilistic one.  
  *Justification*: The abstract proof (using convexity/projection) is too advanced; an example grounds the logic. Skipping this risks abstraction without intuition.  

  **Total: 50 mins**.  
  *Forced Order*: Propriety (step 3) must precede dominance calculations (step 6). Reversing them would allow students to (mis)interpret dominance as an artifact of a specific scoring rule, not a consequence of coherence. Propriety links dominance to probability axioms universally.

  ---

  ### (2) The Carrying Example

  **Worlds**: Three possible worlds (\(w_1, w_2, w_3\)).  
  **Propositions**:  
  - \(A\): True only at \(w_1\) (e.g., "Team X wins").  
  - \(B\): True only at \(w_2\) (e.g., "Team Y wins").  
  - \(C = A \cup B\): True at \(w_1\) or \(w_2\) (e.g., "Team X or Y wins").  

  **Non-probabilistic credence** \(c\):  
  - \(c(A) = 0.3\), \(c(B) = 0.3\), \(c(C) = 0.8\).  
  *Violation*: Additivity (\(c(A) + c(B) = 0.6 \neq c(C) = 0.8\)).  

  **Brier score inaccuracy** \((x - v)^2\) at each world:  
  | World | \(v_A\) | \(v_B\) | \(v_C\) | Inacc. for \(c\) |  
  |-------|--------|--------|--------|------------------|  
  | \(w_1\) | 1      | 0      | 1      | \((0.3-1)^2 + (0.3-0)^2 + (0.8-1)^2 = 0.49 + 0.09 + 0.04 = 0.62\) |  
  | \(w_2\) | 0      | 1      | 1      | \((0.3-0)^2 + (0.3-1)^2 + (0.8-1)^2 = 0.09 + 0.49 + 0.04 = 0.62\) |  
  | \(w_3\) | 0      | 0      | 0      | \((0.3-0)^2 + (0.3-0)^2 + (0.8-0)^2 = 0.09 + 0.09 + 0.64 = 0.82\) |  

  **Probabilistic dominator** \(p\):  
  - \(p(A) = 0.36\), \(p(B) = 0.36\), \(p(C) = 0.72\) (ensures additivity: \(p(A) + p(B) = p(C)\)).  
  | World | Inacc. for \(p\) |  
  |-------|------------------|  
  | \(w_1\) | \((0.36-1)^2 + (0.36-0)^2 + (0.72-1)^2 = 0.410 + 0.130 + 0.078 = 0.618\) |  
  | \(w_2\) | \((0.36-0)^2 + (0.36-1)^2 + (0.72-1)^2 = 0.130 + 0.410 + 0.078 = 0.618\) |  
  | \(w_3\) | \((0.36-0)^2 + (0.36-0)^2 + (0.72-0)^2 = 0.130 + 0.130 + 0.518 = 0.778\) |  

  **Key features**:  
  - **Must have**: 3+ worlds to violate additivity without normalization failure; non-additivity as the violation; Brier score for simplicity.  
  - **Must lack**: Any mention of money, bets, or losses. Avoid stakes to prevent conflation with Dutch books.  
  - **Why it works**: \(p\) dominates \(c\) at every world (\(0.618 < 0.62\) and \(0.778 < 0.82\)), proving incoherence causes inescapable inaccuracy.

  ---

  ### (3) Misconceptions, and Where to Defuse Them

  **Misconception 1: "This is about incentivizing forecasters"**  
  - *Source*: Statistics/ML students hear "proper scoring rule" and assume principal-agent framing.  
  - *When it arises*: During scoring rule definition (step 2).  
  - *Defusal*: At step 2, clarify: "Unlike in ML, we’re not designing incentives. Scoring rules here measure accuracy—not behavior—of credences. Propriety ensures self-honesty, not strategy."  

  **Misconception 2: "Dominance encourages extreme credences (0 or 1)"**  
  - *Source*: Seeing \(p\)’s inaccuracies, students infer extremism minimizes risk.  
  - *When it arises*: During the example (step 6).  
  - *Defusal*: After calculations, note: "\(p\) is not extreme (0.36 ≠ 0/1). Strict propriety penalizes overconfidence: if you assign 1 but are wrong, inaccuracy → ∞ under logarithmic scores."  

  **Misconception 3: "Choosing the scoring rule biases the conclusion"**  
  - *Source*: Humanities students suspect numericism is presupposed; others think rule-choice circularly implies probabilism.  
  - *When it arises*: After defining strict propriety (step 3).  
  - *Defusal*: At step 3, stress: "We don’t cherry-pick rules. The argument holds for all strictly proper rules (Brier, log, spherical). Propriety ensures the rule doesn’t favor probabilities—it reveals their dominance."  

  **Misconception 4: "Accuracy isn’t the only epistemic goal"**  
  - *Source*: Philosophy students resist "accuracy-first" epistemology.  
  - *When it arises*: After theorem statement (step 5).  
  - *Defusal*: At step 5, concede: "This argument assumes accuracy is the sole epistemic virtue. If you value simplicity or explanatory power, probabilism may not follow—but that’s beyond today’s scope."  

  **Misconception 5: "This is just a Dutch book for numbers"**  
  - *Source*: Seeing dominance, students equate it with sure-loss betting.  
  - *When it arises*: Post-example (step 6).  
  - *Defusal*: During recap, contrast: "Dutch books penalize incoherence pragmatically (you lose money). This penalizes it epistemically (you’re inaccurate). No stakes or utilities are involved here."  

  **Misconception 6: "Additivity violations are the only problem"**  
  - *Source*: Example focuses on \(c(A) + c(B) \neq c(C)\), ignoring non-negativity or normalization.  
  - *When it arises*: During example setup.  
  - *Defusal*: Pre-example, note: "We use additivity for simplicity, but all axiom violations cause dominance. Try normalizing to >1 for homework!"

  ---

  ### (4) The Closing Question

  **Question**: "Suppose we use the logarithmic scoring rule \(s(x,1) = -\ln(x)\), \(s(x,0) = -\ln(1-x)\). How would you verify that \(c\) from our example is still dominated? What changes?"  

  **Good Answer**:  
  - "Log score is strictly proper. Compute \(c\)’s inaccuracy: At \(w_3\), \(-\ln(1-0.3) -\ln(1-0.3) -\ln(1-0.8) \approx 0.357 + 0.357 + 1.609 = 2.323\). For \(p\), at \(w_3\): \(-\ln(1-0.36) -\ln(1-0.36) -\ln(1-0.72) \approx 0.446 + 0.446 + 1.322 = 2.214\). Since \(2.214 < 2.323\), dominance holds. The inaccuracy values change, but not the conclusion."  
  - **Diagnostic**: Uses propriety, recalculates accurately, notes invariance of dominance.  

  **Bad Answer**:  
  - "Log score makes \(c\) worse, so yes."  
  - **Diagnostic**: Fails to compute, misses that propriety generalizes the argument; reveals memorization without transfer.  

  ---

  ### (5) What I Leave Out and Say I’m Leaving Out

  **Leave out**:  
  - General proof (convexity and Bregman divergence).  
  - Infinite cases (countable/uncountable worlds).  
  - Non-propriety of some rules (e.g., absolute value).  
  - Accuracy arguments for conditionalization or other norms.  
  - Dutch book comparisons beyond the misconception.  

  **Explicitly state**:  
  - "We skip the general proof (it uses convex optimization). We assume finite worlds and ignore infinite cases. We avoid alternative scoring rules (e.g., absolute value) that aren’t strictly proper. We don’t discuss diachronic norms or Dutch books in depth—these are for future classes."
