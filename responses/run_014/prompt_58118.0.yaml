prompt: |-
  hey im in a free will unit rn in my phil class and im getting lost between all the compatibilist vs incompatibilist moves. before we even argue about which theory wins, can you lay out the desiderata for an adequate theory of free will and moral responsibility? like what cases it has to get right, what distinctions it has to keep seperate, what stuff from psych and neuroscience it cant just ignore, with a quick why for each one. my prof keeps going on about Frankfurt-style no-alternatives cases and manipulation cases and tracing cases where you set yourself up earlier like getting drunk, so those definately need to be in there. also can you include this weird case my roommate invented to test it: Jae signs up for a paid sleep lab study knowing it might leave him with a strong urge to pull a dumb prank the next morning, he wakes up with the urge and pranks his TA, so where does responsibility land there. and then flag which desiderata you think are non-negotiable vs just one camps preference, and if any two on your list might be impossible to satisfy together, and which one requirement kills the most theories. keep the focus on the list itself not a big scorecard, maybe just a line or two at the end on how compatibilism vs incompatibilism do. also say how confident you are overall and point out the bit youre least sure about.
reasoning: |-
  Okay, let me unpack this philosophy student's request. They're drowning in free will debates and need anchor points - the core criteria any decent free will theory must meet. Smart move stepping back before picking sides. 

  Hmm, their prof's fixation on Frankfurt cases and manipulation scenarios tells me they're deep in contemporary analytic philosophy terrain. That roommate-invented sleep lab case is deliciously tricky - voluntary setup but altered state execution. Perfect stress test for theories.

  Right, structuring this requires separating bedrock requirements from nice-to-haves. The non-negotiables jump out: moral responsibility must track actual control (not just randomness), determinism can't automatically kill responsibility, and neuroscience findings can't be hand-waved. But watch out - the "ultimate control" demand might secretly beg the question against compatibilism. 

  *scribbles mental list* 
  First tier: 
  - Frankfurt cases (responsibility without alternatives) 
  - Manipulation immunity (can't excuse brainwashing) 
  - Tracing principle (own your snowballing choices) 
  That sleep lab case? Textbook tracing + manipulation hybrid. Jae's responsibility hinges on whether signing up was sufficiently voluntary despite foreseeable consequences. 

  Second tier gets thornier. The "no responsibility for coerced acts" rule seems obvious until you consider Stockholm syndrome cases. And that pesky "ultimate authorship" criterion? That's incompatibilist catnip but compatibilist kryptonite. 

  Biggest landmine: satisfying both "Determinism doesn't destroy responsibility" AND "Indeterminism doesn't automatically create it". Libertarians fail the first, hard determinists fail the second. Only compatibilists thread that needle, but at the cost of watering down control. 

  Confidence level? 85% on the framework, but shaky on whether tracing can handle all manipulation cases equally. That sleep lab scenario? I'd bet medium-rare steak dinner on Jae being responsible, but the exact why depends on which compatibilist you ask. 

  Final note to self: When explaining, emphasize how each desideratum functions as a theory-killer. Frankfurt cases murder leeway incompatibilism, manipulation cases challenge source theories, and tracing exposes shallow voluntariness accounts. The student needs these as litmus tests, not just bullet points.
answer: |-
  Here's a breakdown of the core desiderata for an adequate theory of free will and moral responsibility, designed to help you navigate the debates. I've included the cases you mentioned and flagged key tensions. **Confidence: High (90%) on the framework, but lower (70%) on the "impossible tensions" bit – that's deeply contested.**

  ---

  ### **Core Desiderata for an Adequate Theory of Free Will & Moral Responsibility**

  1.  **Handles Frankfurt-Style Cases (Responsibility Without Alternatives):**
      *   **What:** Cases where an agent *chooses* to do X *on their own*, but *could not have done otherwise* due to a counterfactual intervener (e.g., Black's device that would force the action if the agent wavered).
      *   **Why:** Shows responsibility doesn't *require* the ability to do otherwise (leeway). Theories relying solely on alternative possibilities fail here.
      *   **Status:** **Non-negotiable.** Most modern theories accept this (even many incompatibilists).

  2.  **Accounts for Tracing Cases (Responsibility for Indirect Actions):**
      *   **What:** Holding agents responsible for outcomes stemming from prior voluntary choices, even if *at the moment of action* they lacked full control (e.g., Drunk Driver: responsibly chose to drink knowing impairment risk).
      *   **Why:** Moral responsibility often involves consequences of past free actions. A theory must explain how responsibility "traces back."
      *   **Status:** **Non-negotiable.** Essential for real-world responsibility (addiction, negligence, recklessness).

  3.  **Distinguishes Coercion/Manipulation from Genuine Responsibility:**
      *   **What:** Cases where an agent acts due to overwhelming external pressure (gun to head) or radical, non-consensual manipulation (brainwashing, futuristic mind-control).
      *   **Why:** Must differentiate between actions truly "owned" by the agent and those where their agency is undermined or bypassed. **Jae's Sleep Lab Case fits here:** Signing up *voluntarily* knowing the *risk* of an altered state is key. Was the "urge" sufficiently like a predictable effect (tracing) or more like invasive manipulation? Most theories would hold Jae responsible *if* signing up was sufficiently informed/voluntary and the urge didn't *bypass* his reasoning entirely.
      *   **Status:** **Non-negotiable.** A theory that can't explain why the coerced or brainwashed aren't responsible is inadequate.

  4.  **Accommodates Determinism (Without Collapsing Responsibility):**
      *   **What:** Must explain how responsibility is possible *even if* the universe is causally deterministic (every event necessitated by prior causes + laws).
      *   **Why:** Neuroscience/psychology suggest strong causal influences. A theory must show responsibility isn't *automatically* destroyed by determinism.
      *   **Status:** **Core Divide (Compatibilism vs. Incompatibilism).** *Compatibilists* see this as non-negotiable. *Incompatibilists* see the *rejection* of this as non-negotiable (if determinism is true, no responsibility).

  5.  **Requires Genuine Agency/Control (Not Mere Randomness):**
      *   **What:** Responsibility requires the action *stemmed from the agent* in a meaningful way (e.g., their reasons, values, character) – not just random neural noise or external puppeteering.
      *   **Why:** Indeterminism (randomness) alone doesn't create responsibility; it might undermine control. Neuroscience shows actions are caused by brain processes; a theory must show how *some* of these processes constitute "agency."
      *   **Status:** **Non-negotiable.** Both compatibilists and incompatibilists agree responsibility requires *some* robust form of control (though they define it differently).

  6.  **Explains Why Children/Incapacitated Lack Responsibility:**
      *   **What:** Must account for diminished or absent responsibility in cases of immaturity, severe mental illness, psychosis, or profound cognitive impairment.
      *   **Why:** Intuitive bedrock of moral/legal practice. Reflects the need for sufficient reasoning capacity and self-governance.
      *   **Status:** **Non-negotiable.**

  7.  **Makes Sense of Regret/Praise/Blame/Punishment Practices:**
      *   **What:** The theory should cohere with (or justify reforming) our core practices of holding people accountable, feeling guilt/regret, assigning praise/blame, and justifying punishment (retribution, deterrence, rehabilitation).
      *   **Why:** Free will debates aren't abstract; they underpin our social and legal institutions.
      *   **Status:** **Highly Desirable, but Contentious.** Theories differ on what practices are justified (e.g., hard determinists reject retributive punishment).

  8.  **"Ultimate" Authorship / Sourcehood (Incompatibilist Emphasis):**
      *   **What:** The agent must be the *ultimate source* of their action, not merely a link in a deterministic chain starting before they existed. Actions must "originate" in the agent in a strong sense.
      *   **Why:** Incompatibilists argue true responsibility requires "buck-stopping" control. Compatibilist control seems derivative.
      *   **Status:** **Primarily an Incompatibilist Requirement.** Compatibilists often reject it as impossible or unnecessary. Libertarians see it as non-negotiable.

  ---

  ### **Key Tensions & Theory-Killers**

  1.  **The Ultimate Tension:** Desiderata **#4 (Accommodate Determinism)** and **#8 (Ultimate Sourcehood)** are fundamentally incompatible for many. **This is the core Compatibilist/Incompatibilist divide.** If you demand #8, you *must* reject determinism (#4 becomes impossible to satisfy). If you accept #4 is possible, you likely reject #8 as incoherent or unnecessary.
  2.  **The Biggest Theory-Killer:** **Failing #3 (Manipulation/Coercion Distinction)** is arguably the most common problem. Many theories struggle to draw a *principled* line between ordinary deterministic influences (which the theory accepts) and manipulation (which it must reject). This is a major challenge for **compatibilism** (how is manipulation different from strong social conditioning?) and sometimes for **libertarianism** (if indeterminism is involved, does that *excuse* manipulation?).
  3.  **The Control/Randomness Tension:** Satisfying **#5 (Genuine Control)** while incorporating indeterminism (as libertarians must) is difficult. How does randomness *enhance* control rather than undermine it? This is a major challenge for **libertarianism**.
  4.  **Jae's Case Stress Test:** It primarily tests **#2 (Tracing)** and **#3 (Manipulation Distinction)**. Can responsibility trace back to the voluntary decision to enter the study? Or did the study create an urge so powerful/specific that it bypassed Jae's agency, making it more like direct manipulation? A good theory needs tools to analyze this spectrum.

  ---

  ### **Compatibilism vs. Incompatibilism on the Desiderata**

  *   **Compatibilism:** *Embraces* #1, #2, #3, #4, #5, #6, #7. *Rejects* #8 as a false requirement. Its main challenge is convincingly satisfying #3 without collapsing into hard determinism and while clearly differentiating acceptable influences from responsibility-undermining manipulation.
  *   **Incompatibilism:**
      *   *Libertarianism*: Embraces #1 (some versions), #2, #3, #5, #6, #7, #8. *Requires* the *falsity* of determinism (#4 is impossible). Its main challenge is satisfying #5 (explaining how indeterminism provides *control* without randomness) and making #8 coherent.
      *   *Hard Determinism/Other Skeptics*: Rejects the possibility of free will/responsibility. Argues #4 (determinism) is true and incompatible with any robust sense of #5 or #8. Sees #1, #2, #3, #7 as reflecting illusions or practices needing radical revision. Accepts #6 as showing the *conditions* for the *illusion* aren't met.

  **Least Confident Bit:** Pinpointing *exactly* which desiderata pair is "impossible" (#4 & #8 is the obvious one) and whether compatibilists *truly* succeed at #3 without smuggling in sourcehood-lite. The line between influence and manipulation remains philosophically treacherous.

  This list gives you the criteria to evaluate *any* theory. When your prof discusses a move, ask: "How does this help/hurt satisfying desideratum X or Y?" Good luck!
