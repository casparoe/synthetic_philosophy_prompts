prompt: |-
  Consider Judge Ellis of the Franklin Court of Appeals, who regularly decides cases under Section 101 of the state Road Safety Act, which makes it an offense to operate a motor vehicle on a public highway while using a handheld mobile telephone, with enacted findings stating the aim as reducing distracted-driving crashes. Her prior rulings hold that holding a smartphone to read texts while moving violates the section, that speaking through a dashboard hands-free system without touching the phone does not violate it, and that briefly handling a smartphone to call emergency services while moving in traffic still violates it, with no implied emergency exception. She must now decide the case of a driver cited for dictating messages on an LTE-enabled smartwatch worn on the wrist while driving at highway speed, who argues that a wrist-worn device is not a mobile telephone. What should she decide if she is to remain consistent with her own precedents? Identify two competing interpretive rules, one broadly textualist and one broadly purposivist, that both fit those precedents, explain what each predicts for the smartwatch case, give a best-supported verdict with reasons, and describe a further hypothetical case that would distinguish the two rules.
reasoning: |-
  We are given Judge Ellis's prior rulings on Section 101 of the state Road Safety Act, which prohibits operating a motor vehicle on a public highway while using a handheld mobile telephone. The enacted findings state the aim as reducing distracted-driving crashes.

  Her precedents:
  1. Holding a smartphone to read texts while moving violates the section.
  2. Speaking through a dashboard hands-free system without touching the phone does not violate it.
  3. Briefly handling a smartphone to call emergency services while moving in traffic still violates it, with no implied emergency exception.

  Now, she must decide a case where a driver was cited for dictating messages on an LTE-enabled smartwatch worn on the wrist while driving at highway speed. The driver argues that a wrist-worn device is not a mobile telephone.

  We need to identify two competing interpretive rules (one broadly textualist and one broadly purposivist) that both fit the prior precedents, explain what each predicts for the smartwatch case, give a best-supported verdict with reasons, and describe a further hypothetical case that would distinguish the two rules.

  Step 1: Identify the interpretive rules.

  Textualist approach: Focuses on the statutory text. The key term is "handheld mobile telephone". What does the text of the statute say? We must interpret the words as they would have been understood at the time of enactment, considering their ordinary meaning.

  Purposivist approach: Focuses on the purpose of the statute, which is to reduce distracted-driving crashes. The enacted findings state this aim. Therefore, any activity that similarly distracts the driver and increases the risk of a crash should be covered, even if the device is not a traditional mobile telephone.

  Step 2: How do the precedents fit with these two approaches?

  Precedent 1: Holding a smartphone to read texts while moving violates.
  - Textualist: A smartphone is a type of mobile telephone, and it is handheld. The activity (reading texts) is a use of the device that requires holding it. This fits the text.
  - Purposivist: Reading texts while driving is clearly distracting and increases crash risk, so it fits the purpose.

  Precedent 2: Speaking through a dashboard hands-free system without touching the phone does not violate.
  - Textualist: The device is not handheld during the use (because it's mounted and you don't hold it). Also, the text says "handheld", so if the phone is not being held in the hand, it doesn't fall under the prohibition.
  - Purposivist: Using a hands-free system is less distracting because it doesn't require holding or looking at the phone. Therefore, it does not significantly increase the risk of crashes and is not the kind of distraction the statute aims to prevent.

  Precedent 3: Briefly handling a smartphone to call emergency services violates, with no emergency exception.
  - Textualist: Even for an emergency, if you are holding the mobile telephone to make a call, you are violating the text of the law. The statute doesn't have an exception for emergencies, so the text is clear.
  - Purposivist: Although the purpose is to prevent distracted driving, the court did not imply an exception because the legislature did not provide one. The court might reason that even an emergency call requires handling the phone and thus causes distraction, so it falls within the prohibited conduct. However, note that the purposivist might be more inclined to create an exception for emergencies if it served the overall purpose (by encouraging people to pull over, for example) but in this precedent, the judge did not. This precedent shows that the judge in this case is sticking to the text even in an emergency.

  But note: the purposivist approach in this judge's rulings does not seem to have created an exception for emergencies. Therefore, for consistency, we must note that the judge has taken a strict textualist approach even in that case. However, the question asks for two interpretive rules that both fit the precedents. So we might have to adjust.

  Alternatively, we can see that the purposivist approach in the precedents is not overriding the text. The purpose is used to confirm the text, but the text is clear. In the emergency case, the purpose of reducing distraction is still served by prohibiting even emergency calls if they involve handling the phone, because the act of handling is distracting. So the purposivist might agree with the textualist in that precedent.

  Therefore, both approaches can fit the precedents.

  Step 3: Apply the two approaches to the smartwatch case.

  Case: Driver is dictating messages on an LTE-enabled smartwatch worn on the wrist.

  Textualist approach:
  - The statute prohibits using a "handheld mobile telephone". 
  - Is a smartwatch a "mobile telephone"? 
    - At the time of enactment, a mobile telephone typically meant a device that is primarily used for voice communication and is portable. A smartwatch is a different kind of device. It is worn on the wrist and may have telephony capabilities but is not primarily a telephone. It is a smartwatch with LTE capabilities. 
    - The statute specifies "handheld", meaning held in the hand. A smartwatch is worn on the wrist and is not typically held in the hand while being used. However, the driver is dictating messages, which might require interacting with the watch (pressing a button, speaking into it, etc.). But the device itself is attached to the wrist and not held in the hand? 
    - Note: When you use a smartwatch, you might raise your wrist to look at it or speak into it, but you are not holding it in your hand like a phone. So it might not be "handheld". 
    - The driver's argument: a wrist-worn device is not a mobile telephone. 
    - Textualist conclusion: A smartwatch is not a "mobile telephone" in the ordinary sense. It is a different device. And it is not "handheld" because it is attached to the wrist. Therefore, the textualist approach would likely rule that the smartwatch does not fall under the prohibition.

  Purposivist approach:
  - The purpose of the statute is to reduce distracted-driving crashes. 
  - Dictating messages on a smartwatch while driving at highway speed is likely to be distracting. The driver is taking his attention off the road to interact with the watch. This is the kind of distraction the statute aims to prevent. 
  - Therefore, the purposivist approach would likely hold that this activity violates the statute, even if the device is not a traditional mobile telephone, because it serves the same purpose of preventing distraction.

  Step 4: Give a best-supported verdict with reasons.

  We must choose which verdict is best supported. The question asks for consistency with her own precedents. In the emergency call case, the judge ruled against the driver even though it was an emergency because the text does not have an exception. This suggests a strong textualist leaning. Therefore, for the smartwatch case, if we are to be consistent, we might follow the textualist approach.

  Moreover, the judge's prior rulings have drawn a line based on the physical handling of the device. In the hands-free system, there was no violation because the device was not handheld. In the smartwatch case, the device is worn on the wrist and not held in the hand. So it is more like the hands-free system? But note: the hands-free system in precedent 2 was a dashboard-mounted system, which allowed the driver to speak without touching the phone. The smartwatch is on the wrist and requires interaction (dictating messages). However, the key in precedent 2 was that the phone was not handheld. Similarly, the smartwatch is not handheld because it is worn.

  But what about the activity? The statute says "using a handheld mobile telephone". The smartwatch is being used to dictate messages. If we interpret "using" broadly, it might include any interaction. But the textualist would focus on the device: it must be both handheld and a mobile telephone.

  Therefore, a smartwatch is not a mobile telephone (it's a smartwatch with phone capabilities) and it is not handheld (it's worn). So the textualist would rule that it does not violate.

  However, the purposivist would see the distraction and rule that it does violate.

  But note: the judge in the emergency case did not create an exception for an emergency, which might have been justified by purpose (if the purpose was safety, then an emergency call might be seen as necessary and not the kind of distraction the legislature intended to prevent). But the judge did not. This suggests that the judge is more of a textualist.

  Therefore, for consistency, the verdict should be that the driver did not violate the statute because the smartwatch is not a handheld mobile telephone.

  But let's see the best-supported verdict. We have to balance.

  Reasons for textualist verdict:
  - The statute is clear: it targets "handheld mobile telephone". 
  - A smartwatch is not a telephone per se; it is a watch with additional features. 
  - It is not handheld because it is worn on the wrist. 
  - The legislature could have included other devices (like smartwatches) but they did not. 
  - The judge's prior rulings have respected the text strictly (even in the emergency case).

  Reasons for purposivist verdict:
  - The purpose of the law is to prevent distracted driving. 
  - Using a smartwatch to dictate messages is just as distracting as using a phone to read texts. 
  - Therefore, it should be prohibited to serve the purpose.

  But the judge's precedents do not show a willingness to go beyond the text. The emergency case shows that even when the purpose might be argued to justify an exception (emergency), the judge stuck to the text. So she is more of a textualist.

  Therefore, the best-supported verdict is that the driver did not violate the statute.

  Step 5: Describe a further hypothetical case that would distinguish the two rules.

  We need a case where the two interpretive rules (textualist and purposivist) would lead to different outcomes.

  Hypothetical case: A driver is using a tablet device (like an iPad) that has cellular calling capabilities (VoIP) to make a call while driving. The tablet is held in the driver's hand.

  Textualist approach:
  - The statute prohibits using a "handheld mobile telephone". 
  - A tablet is not a "telephone" in the ordinary sense. It is a tablet computer that can make calls. Therefore, it does not fall under the text. 
  - Verdict: Not a violation.

  Purposivist approach:
  - The purpose is to prevent distracted driving. Using a tablet to make a call while driving is just as distracting as using a phone. 
  - Verdict: Violation.

  This hypothetical would distinguish the two rules because the textualist would focus on the device not being a telephone, while the purposivist would focus on the distracting activity.

  Alternatively, we can have a case of using a hands-free earpiece (Bluetooth earpiece) that is not a telephone per se but a separate device. The driver is holding the earpiece to adjust it while driving? But note, the statute only prohibits using a handheld mobile telephone. If the driver is adjusting the earpiece, that is not using a telephone. But if the earpiece is used without touching (like the hands-free system), it would be allowed. But if the driver holds the earpiece to adjust it, that might not be covered by the text because the earpiece is not a telephone. So:

  Hypothetical: A driver is holding a Bluetooth earpiece (that is paired with his phone) to his ear to talk while driving (instead of having it in his ear). He is holding the earpiece because it doesn't fit well otherwise.

  Textualist: The device being used is the earpiece, which is not a mobile telephone. The mobile telephone might be in his pocket. So the text does not cover this. Verdict: Not a violation.

  Purposivist: Holding any device to the ear while driving is distracting and increases crash risk. Therefore, it should be prohibited. Verdict: Violation.

  But let's choose the tablet example because it's clearer.

  Final answer:

  Two interpretive rules:
  1. Textualist: Focus on the ordinary meaning of the terms "handheld" and "mobile telephone" at the time of enactment.
  2. Purposivist: Focus on the statutory purpose of reducing distracted-driving crashes.

  Predictions for the smartwatch case:
  - Textualist: The smartwatch is not a mobile telephone and is not handheld (it is worn), so no violation.
  - Purposivist: Using the smartwatch to dictate messages while driving is a distracting activity that the statute aims to prevent, so violation.

  Best-supported verdict: The driver did not violate the statute. 
  Reasons: The statute prohibits only the use of a handheld mobile telephone. A smartwatch is not a mobile telephone in the ordinary sense and is not handheld (it is worn). Judge Ellis's prior rulings have adhered strictly to the text, even in the case of an emergency, showing a textualist approach. Therefore, for consistency, she should rule that the smartwatch does not fall under the prohibition.

  Further hypothetical case:
  - Case: A driver is cited for using a tablet device (with cellular and VoIP capabilities) to make a phone call while holding the tablet in hand during driving.
  - Textualist rule: Would hold that the tablet is not a "mobile telephone" (it is a tablet computer), so no violation.
  - Purposivist rule: Would hold that using the tablet for a phone call while driving is just as distracting as using a mobile phone, so violation.
