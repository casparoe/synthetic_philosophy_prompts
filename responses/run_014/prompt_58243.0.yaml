  ### Analysis of Judge Ellis's Precedents
  Judge Ellis's prior rulings on Section 101 of the Road Safety Act establish a clear pattern:
  - **Precedent 1**: Holding a smartphone to read texts while driving violates the law. This emphasizes physical handling of a device capable of telephonic communication.
  - **Precedent 2**: Using a dashboard hands-free system without touching the phone does not violate the law. This excludes non-handheld interactions with telephonic devices.
  - **Precedent 3**: Briefly handling a smartphone to call emergency services violates the law, with no implied exception. This confirms a strict textual boundary, regardless of context or purpose.

  The statute prohibits "operat[ing] a motor vehicle on a public highway while using a handheld mobile telephone." The enacted findings cite the aim of "reducing distracted-driving crashes."

  ### Two Competing Interpretive Rules
  Two interpretive rules that align with Judge Ellis's precedents are:

  1. **Broadly Textualist Rule**:  
     - **Description**: Interpret the statute based solely on the ordinary meaning of the text at enactment. "Handheld mobile telephone" is defined as a portable device (a) primarily designed for voice communication over cellular networks, (b) held in the hand during operation. The rule excludes devices not meeting this definition, regardless of distraction risk.  
     - **Fit with Precedents**:  
       - Precedent 1 (smartphone reading texts): A smartphone is a quintessential "mobile telephone" held in hand.  
       - Precedent 2 (hands-free system): The device is not "handheld" during use.  
       - Precedent 3 (emergency smartphone use): The device is handheld and qualifies as a "mobile telephone," so no exception applies.  
     - **Prediction for Smartwatch Case**: The smartwatch is not a "mobile telephone." It is primarily a wrist-worn wearable (like a watch) with incidental telephonic capabilities. It is not "handheld" as it is affixed to the wrist. Thus, **no violation**.  

  2. **Broadly Purposivist Rule**:  
     - **Description**: Interpret the statute to advance its purpose of reducing distracted-driving crashes. "Using" includes any interaction that distracts, and "mobile telephone" encompasses any portable electronic device enabling real-time communication that risks distraction. Physical handling is not required if the activity diverts attention.  
     - **Fit with Precedents**:  
       - Precedent 1 (smartphone reading texts): Handling a device to read texts causes distraction, aligning with the purpose.  
       - Precedent 2 (hands-free system): No physical handling minimizes distraction, so no violation.  
       - Precedent 3 (emergency smartphone use): Handling the device distracts, so violation occurs despite emergency; the purpose is strict prevention.  
     - **Prediction for Smartwatch Case**: Dictating messages on a smartwatch while driving distracts the driver similarly to smartphone use. The device enables communication and is portable, so it falls under the statute’s purpose. Thus, **violation**.  

  ### Best-Supported Verdict and Reasons
  **Verdict**: The driver **did not violate Section 101**.  
  **Reasons**:  
  - **Textual Consistency**: Judge Ellis's precedents prioritize the statute's text over purpose-driven exceptions. Precedent 3 explicitly rejects an emergency exception, showing strict textual adherence. The smartwatch is not a "mobile telephone" in ordinary language—it is a wrist-worn accessory with secondary telephonic features, akin to a Bluetooth earpiece (excluded in Precedent 2). It is not "handheld" as it is worn, not held.  
  - **Precedential Alignment**: Precedent 2 exempts non-handheld interactions with communication devices. The smartwatch, worn on the wrist, parallels a hands-free system's lack of physical handling.  
  - **Legislative Intent**: While the purpose targets distraction, the text limits coverage to "handheld mobile telephone[s]." Expanding it to smartwatches would require legislative action, as Judge Ellis’s prior rulings avoid broadening the text (e.g., no emergency carve-out).  

  ### Further Hypothetical Case Distinguishing the Rules  
  **Case Description**: A driver is cited for using a voice-activated, LTE-enabled tablet mounted on the dashboard to send emails while driving. The tablet is not held, but the driver looks at the screen to confirm dictation.  

  - **Textualist Rule Prediction**: **No violation**. The tablet is not a "mobile telephone" (primarily a computing/email device) and is not handheld (mounted).  
  - **Purposivist Rule Prediction**: **Violation**. The activity (voice dictation with visual confirmation) distracts the driver, aligning with the statute’s purpose to prevent crashes.  
  - **Distinction**: The textualist rule exempts the tablet due to device type and mounting, while the purposivist rule focuses on distraction risk, creating a split outcome. This highlights the textualist rule's narrower scope versus the purposivist rule's broader prevention goal.
