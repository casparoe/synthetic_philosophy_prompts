answer: |-
  ### Engineered Case: "Gout" in Twin Worlds (197 words)

  **World1 and World2** are identical except for archived medical records. Both worlds share the same human biology, chemistry, and diseases. The term "gout" was introduced identically via a 19th-century medical text, *The Compendium*, defining it as "a painful joint condition from excess uric acid." Subjects **Ada (World1)** and **Bela (World2)** are molecule-for-molecule duplicates: same brain, memories, and beliefs (e.g., both believe "gout" means *exactly* what *The Compendium* says). They defer to *The Compendium* as the sole authority—no living experts exist.

  The worlds differ only in archived hospital records (non-human authorities). In **World1**, archives consistently document "gout" as *requiring urate crystal confirmation*. In **World2**, archives (due to a historical clerical error) document "gout" as *requiring only elevated blood uric acid*. The *actual disease presentation* is identical: urate crystals cause symptoms, but blood tests alone are unreliable. Ada and Bela have never encountered a borderline case. When presented with a patient with high uric acid but no crystals, Ada (World1) says, "Not gout—no crystals!" Bela (World2) says, "Gout—high acid levels!" The divergence stems solely from the archives influencing community norms, not biology.

  ---

  ### Audit

  #### 1. Theories' Verdicts on Meaning and Extension
  - **Internalism (e.g., Cartesian individualism)**  
    Claims: Ada and Bela mean the *same thing* by "gout" because they are duplicates.  
    Meaning: Defined by their shared concept from *The Compendium*: "painful joints from excess uric acid."  
    Extension: Ambiguous—both worlds have identical disease presentations, but the concept lacks precision. In practice, Ada and Bela would apply "gout" identically *if isolated from archives*.  
    Fixing: Intrinsic mental states alone.

  - **Natural-Kind Externalism (Putnam)**  
    Claims: "Gout" means the *same thing* in both worlds.  
    Meaning: Fixed by the underlying natural kind (the disease's microstructure).  
    Extension: The set of *actual urate-crystal-driven conditions* in both worlds (since biochemistry is identical). Ada is correct to reject the borderline case; Bela is wrong (misapplying the term).  
    Fixing: Objective natural structure, independent of human beliefs/archives.

  - **Social Externalism (Burge)**  
    Claims: "Gout" means *different things* due to community norms.  
    Meaning: In **World1**, fixed by archives → "urate-crystal-confirmed disease." In **World2**, fixed by archives → "elevated-blood-uric-acid disease."  
    Extension: **World1**: Only crystal-confirmed cases. **World2**: Cases with high acid, even without crystals. Ada and Bela defer to their community's archive-based norms, so their words have different extensions.  
    Fixing: Linguistic community's norms (via archived records).

  #### 2. Stretching the Externalisms?
  - **Putnam**: Slight stretch. Natural-kind externalism typically targets paradigmatic kinds (e.g., water, gold). "Gout" is a medical/functional kind, not a fundamental natural kind. However, Putnam extends his view to "diseases" (e.g., multiple sclerosis in *Representation and Reality*). Legit if diseases are natural kinds with hidden essences (e.g., viral/bio-chemical).
  - **Burge**: No stretch. This fits classic cases (e.g., "arthritis" in "Individualism and the Mental"), where norms trump individual ignorance. Non-human archives (like Burge's "medical community") are standard authorities.

  #### 3. Key Feature Doing the Work
  - **The archived records diverging without microstructural differences**.  
    Delete this, and the social difference vanishes. Result:  
    - Putnam: Unchanged (natural kind same → meaning same).  
    - Burge: Now identical norms → meaning same.  
    - Internalism: Unchanged.  
    Collapse: Putnam and Burge agree (meaning identical), negating the target disagreement.

  #### 4. Best Defense for the "Losing" Theory
  - **Putnam's defense**: "The case rigs social externalism by *presupposing* norms fix meaning. But 'gout' is a natural-kind term—its meaning is discovered, not decreed by archives. The archives in World2 are *wrong*; Bela is mistaken, not thinking differently. The setup sneaks in social externalism by fiat."  
    - **Does it land?** Partially. Putnam can insist World2's community is in error, preserving meaning identity. But Burge counters that "error" requires a norm to deviate *from*, which is social. The defense highlights a genuine rift: Putnam prioritizes science over norms, but it doesn't refute the case's coherence.

  #### 5. Verdicts from Theories (Not Setup)
  - Success: The verdicts derive from core principles.  
    - Putnam: Natural kind → same meaning (no social dependence).  
    - Burge: Norms → different meanings (no natural-kind dependence).  
    - Internalism: Duplicates → same meanings.  
