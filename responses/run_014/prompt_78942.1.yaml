  ### Verdict
  The case works: Social externalism (Burge) and natural-kind externalism (Putnam) disagree on meaning (different vs. same), while internalism sides with Putnam (same). The divergence hinges on archive-based norms without microstructural differences, satisfying all specs. No stretching or rigging detected.
