prompt: |-
  I spent 35 years as a limnologist (lakes, mostly phosphorus budgets) and since retiring I've fallen down a philosophy-of-science hole — Popper first, then the people who think Popper was too tidy, the Duhem-Quine business and Lakatos on ad hoc rescues. It turns out that's directly relevant to what I do now, which is volunteer on a county microgrant panel: six of us, only two with any lab background, handing out $500–$3,000 to local projects. A couple of times a year we get an application that is not testable in any sense I recognise, and right now we just argue for forty minutes and vote.

  Could you write us a procedure we can actually run in about fifteen minutes per application — the questions in order, what counts as a passing answer to each, and where it stops at "no"? Two things it has to handle honestly rather than wave at. First, the hard middle: a claim that's testable in principle but where every failed test can be blamed on the apparatus or the operator, versus an ordinary measurement where the background assumptions are shared and someone else can check them — I want a way to tell those apart that doesn't just amount to "we know a crank when we see one." Second, how to spot the difference between a legitimate fix to a method and a patch whose only job is to save the claim, ideally with something about whether the fix buys you any new predictions or only excuses the old one. My own rough idea, which you can sharpen, keep or throw out, is what I've taken to calling the "who else would notice" test: write down the specific result that would make the applicant say they were wrong, then ask whether anybody besides the applicant could have anticipated that result or verify it afterwards.

  Then run it on two applications. (a) A group wants money to map groundwater for a community garden with dowsing rods; they've designed their own blinded trial, but the protocol says the rods only respond if none of the testers present is secretly sceptical, so a failed trial always has a ready explanation. (b) A high-school club wants to count whooping swans on the reservoir every March for three years as evidence the lake "is getting healthier" — I like these kids and I've spent my life on that lake, so I'd really rather not have the procedure vote them down, but I can't see what result would count against their hypothesis.

  Mark which steps are actually judgement calls dressed up as procedure, and tell me what the thing can't decide, since the vote is by majority and the two of us with science backgrounds shouldn't be able to steamroll the rest. No jargon we'd have to explain to the others — or if you need a term, define it in one line.
reasoning: |-
  Okay, let me tackle this. The user is a retired limnologist who now volunteers on a microgrant panel. They need a quick, practical procedure to evaluate project applications, especially those with questionable testability. The key challenges are distinguishing genuinely testable claims from those that can't be falsified and identifying legitimate methodological fixes versus ad hoc patches.

  First, the user's main request is a 15-minute procedure. The two examples given are dowsing rods with an unfalsifiable clause and whooping swans without a clear counter-test. The "who else would notice" test they mentioned is a good starting point. I need to formalize that into a step-by-step process.

  The procedure must handle two core issues: the hard middle (testable in principle but blame-shifting) and ad hoc rescues. For the hard middle, the focus should be on shared verification and independent anticipation. For ad hoc fixes, the key is whether the fix generates new predictions or just excuses past failures.

  Looking at the dowsing rod example: their blinded trial has an escape clause (skepticism affecting results). This makes any failure attributable to unseen skeptics, so it's unfalsifiable. The procedure should flag this when Step 3 (counter-test) reveals no verifiable failure condition. The "who else" test fails because only the applicant can verify skepticism.

  For the swan count, the hypothesis that more swans mean a healthier lake lacks a defined counter-test. Step 3 would ask what decrease in swans would disprove it. If they can't specify, or if alternative explanations aren't addressed, it's untestable. But maybe they can refine their hypothesis to include specific indicators beyond swans, making it testable.

  The procedure steps should be:
  1. **State the Claim**: Clearly define the hypothesis.
  2. **Test Design**: Outline the method and controls.
  3. **Counter-Test**: Define a specific failure condition.
  4. **Independent Verification**: Ensure others can replicate without the applicant's involvement.
  5. **Adjustments Check**: For modified methods, ask if new predictions arise.

  Each step needs clear pass/fail criteria. Steps 3 and 4 are judgment calls but structured. The committee votes if steps are unclear. Transparency about uncertainties is key to prevent steamrolling by experts.

  For the swan project, the procedure might suggest conditioning funding on adding concrete health indicators. For dowsing, it fails Step 3 and 4 conclusively. Highlighting where judgment is needed (e.g., plausibility of adjustments) ensures the non-experts have a say. The goal is a fair, quick assessment that educates the panel without jargon.
answer: |-
  Here's a 15-minute falsifiability assessment procedure designed for your panel, addressing your core requirements. It uses plain language, flags judgment points explicitly, and handles both "hard middle" cases and ad hoc fixes. The core is adapted from your "who else would notice" test into structured questions.

  **Microgrant Falsifiability Assessment Procedure (15 min max per application)**

  **Goal:** Decide if the project's core claim is *scientifically testable* in a meaningful way. This *does not* assess feasibility, importance, or ethics – only testability. "Fail" means the panel judges the claim untestable *as presented*.

  **Steps & Scoring (Run in Order - Stop at any "No"):**

  1.  **The Core Claim (2 min):**
      *   *Question:* "What specific, concrete claim will this project test? (Not the goal or method, but the 'if we do X, we expect to see Y' or 'we believe Z is true' statement.)"
      *   *Pass:* A clear, single-sentence claim involving observable outcomes (e.g., "Dowsing rods locate water pipes more accurately than random chance," "Increased whooping swan numbers *specifically indicate* improved overall lake health").
      *   *Fail:* Vague claims ("prove dowsing works," "show the lake is healthier"), purely subjective outcomes ("feel more connected"), or claims about untestable forces ("negative energy disrupts rods").
      *   *Judgment Call:* Is the claim stated clearly enough? (Clarify once if needed).

  2.  **The Proposed Test (3 min):**
      *   *Question:* "How *exactly* will you try to test this claim? Describe the key steps and controls (things you do to rule out other explanations)."
      *   *Pass:* A method that *attempts* to isolate the claimed effect (e.g., blinded dowsing trials, standardized swan counts at fixed times/locations). Controls don't need to be perfect, just present.
      *   *Fail:* No clear method, or method cannot address the claim (e.g., just demonstrating dowsing rods move, counting swans without linking to health).
      *   *Judgment Call:* Does the method *seem* generally capable of generating relevant data? (Don't nitpick perfection here).

  3.  **The "What If You're Wrong?" Test (The Counter-Test) (4 min - CRITICAL STEP):**
      *   *Question:* "Imagine you do your test carefully. What *specific, observable result* would make you say, 'Hmm, maybe our core claim is wrong after all?' Be precise (e.g., 'If dowsing accuracy is below X% in our trial...', 'If swan numbers stay flat or drop despite Y improvement...')."
      *   *Pass:* A clear, measurable outcome that *directly contradicts* the core claim and could realistically happen within the project scope.
      *   *Fail:* Vague answers ("if it doesn't work"), no conceivable result accepted as counter-evidence, or result explained away *by the applicant* as irrelevant *before the test* (e.g., "Failed dowsing just means a skeptic was present"). **STOP HERE IF FAIL.**
      *   *Judgment Call:* Is the proposed counter-result *truly* something that would challenge the applicant's belief in *their specific claim*, and is it measurable? (This is the main "hard middle" filter).

  4.  **The "Who Else Would Notice?" Test (Independent Verifiability) (4 min):**
      *   *Question A (Anticipation):* "Could someone else familiar with this field (like another gardener, birdwatcher, or scientist) *reasonably predict* the specific counter-result you just named *before* you run your test, based just on knowing your claim and method?"
      *   *Question B (Verification):* "If you got that counter-result, could someone else *verify* it happened using standard tools/methods, *without needing you to interpret it or relying on your unique setup/skills*?"
      *   *Pass:* "Yes" to both. The failure condition is foreseeable and checkable by others using common knowledge/tools.
      *   *Fail:* "No" to either. The failure condition is only obvious *after* the fact with the applicant's unique explanation, or requires the applicant's specific (unverifiable) skill/apparatus to confirm. **STOP HERE IF FAIL.**
      *   *Judgment Call:* Is the "someone else" reasonable? (Use common sense - a local gardener/birder, not a Nobel laureate). Is the verification truly independent of the applicant's special interpretation?

  5.  **Adjusted Claims? (The "New Prediction" Check) (2 min - Only if method changed to explain past issues):**
      *   *Question:* (Only ask if applicant mentions changing their method to address past failures/skepticism) "You mentioned adjusting your approach because of [past issue]. Does this change *only* explain why past tests might have failed, or does it *also* let you make a *new, specific prediction* about something *else* you could test?"
      *   *Pass:* The adjustment leads to a *new*, testable prediction beyond just saving the original claim. (e.g., "Changing rod material not only explains past interference but predicts rods won't work near power lines, which we can test").
      *   *Fail:* The adjustment *only* explains away past problems without enabling new, distinct tests. (e.g., "Adding the 'no skeptics' rule only explains failed trials, doesn't predict anything new").
      *   *Judgment Call:* Is the "new prediction" genuinely new and testable, or just a rephrasing of the old claim? (This flags ad hoc patches).

  **Outcome:** If all steps pass → Claim is deemed testable. Proceed to discuss other grant merits (feasibility, impact, cost, etc.). If any step fails → Claim is deemed untestable *as presented*. The panel *can* still fund based on other grounds (e.g., community engagement, education), but must explicitly acknowledge the scientific testability is weak/absent.

  **What This CAN'T Decide:**
  *   Whether the claim is *true* or *important*.
  *   Whether the method is *perfect* or *the best possible*.
  *   Whether the project has *other non-scientific value* (education, community building, art).
  *   The *exact probability* a claim is true or false.
  *   *Ultimate* plausibility (e.g., panelists' personal belief in dowsing). The procedure focuses on *testability structure*.

  **Handling Judgment Calls & Preventing Steamrolling:**
  1.  **Explicit Flags:** Steps 1, 2, 3, 4, and 5 are marked as involving judgment. Acknowledge this openly.
  2.  **Structured Discussion:** For each step, the chair asks: "Do we have a clear Pass or Fail for Step X? Remember, we're judging testability *as presented*, not ultimate truth." Panelists vote thumbs up/down *per step*.
  3.  **Reason Briefing:** The science-background members (like you) get 60 seconds *max* per judgment step to briefly explain *why* something might be a Pass/Fail based on the criteria (e.g., "For Step 3, the 'skeptic' clause means any failure has a built-in excuse, so no clear counter-test exists"). **No lectures.**
  4.  **Majority Vote per Step:** Each panelist votes independently on Pass/Fail for *each step*. Majority rules for that step. If unclear (split vote), the step "Fails" by default to prioritize rigor.
  5.  **Focus on Structure:** Keep discussion anchored to the specific step question and criteria. If non-science panelists see a Pass where science panelists see Fail, they must articulate *why based on the step's criteria* (e.g., "For Step 4B, couldn't another gardener just look at the dowsing trial results sheet?"). This forces engagement with the *process*, not just deference.

  ---

  **Running the Examples:**

  **Application (a): Dowsing for Groundwater**
  1.  **Core Claim:** "Pass." Claim: Dowsing rods can locate buried water pipes more accurately than random guessing in this garden.
  2.  **Proposed Test:** "Pass." They have a blinded trial design (good!).
  3.  **Counter-Test:** **FAIL.** Applicant states: "The rods won't work if a secret skeptic is present." *Judgment:* This means *no result* can disprove the claim. A negative result is *always* blamed on an unverifiable factor ("secret skeptic"), not the rods' failure. Counter-test is invalid.
  4.  *Stop.* Claim untestable as presented.

  **Application (b): Whooping Swans & Lake Health**
  1.  **Core Claim:** "Pass-ish." Claim: Increasing whooping swan numbers counted each March over 3 years will be evidence the lake ecosystem is getting healthier. *(Judgment: Link between swans and "healthier" is vague but testable in principle if defined).*
  2.  **Proposed Test:** "Pass." Standardized swan counts in March for 3 years.
  3.  **Counter-Test:** **MAJOR JUDGMENT POINT / RISK OF FAIL.** Ask: "What swan count result would suggest the lake is *not* getting healthier?" Likely answers & assessment:
      *   *Vague:* "If numbers go down." → **Potential Pass, but weak.** (Lacks specificity, ignores stability).
      *   *Better:* "If numbers decrease significantly (e.g., >10%) year-on-year for two years, or stay flat over three years despite no major known disturbances." → **Pass.** (Specific, measurable counter).
      *   *Fail:* "Nothing, swans are always a sign of health, maybe other factors hurt them." → **FAIL.** No counter-test.
      *   *Ad Hoc Risk:* "If numbers drop, it just means [unmeasured factor X] got worse, masking the health improvement." → **FAIL.** Explains away failure.
  4.  **Who Else Would Notice? (If Step 3 Passed):**
      *   *A (Anticipation):* **Pass.** Others could predict that stable/decreasing counts contradict the "increasing swans = improving health" claim.
      *   *B (Verification):* **Pass.** Others can independently verify swan count numbers using binoculars/cameras/standard surveys.
  5.  **Adjusted Claims?** Likely N/A.

  **Outcome for (b):** Highly dependent on Step 3 answer. If applicants provide a clear, non-hand-wavy counter-test (e.g., specific decline thresholds), it passes. If not, it fails. **This is the safeguard.** You *can* guide them: "To pass testability, could you specify what decrease or lack of increase would concern you?" If they refuse or can't, it fails. If they amend their application (verbally or in notes) to include a specific counter-test (e.g., "less than 5% average annual increase"), it passes. **This forces testability without requiring you to like/dislike swans.**

  **Why this works for your concerns:**
  *   **Hard Middle:** Step 3 (Counter-Test) + Step 4 (Who Else) directly tackle this. The "secret skeptic" fails Step 3. A vague swan-health link *might* pass Step 3 only if a clear counter-result is defined and verifiable (Step 4).
  *   **Ad Hoc Patches:** Step 5 explicitly asks if an adjustment *only* saves the claim or enables *new* tests. The dowsing "skeptic" rule is an inherent Step 3 failure, but Step 5 catches *methodological* adjustments made after criticism.
  *   **No Steamrolling:** Judgment calls are explicit, voting is per-step by majority, science-background gets limited *briefing* time focused on the *procedure's criteria*, not their opinion. Non-science panelists must engage with the step-by-step logic.
  *   **Speed & Clarity:** Steps are sequential with clear stop points. 15-minute timebox is feasible.

  This procedure provides a structured, fair, and philosophically grounded way to assess testability quickly, empowering the whole panel to make informed decisions based on transparent criteria. Good luck!
