answer: |-
  Here’s a rigorous set of standards for evaluating theories of **genuine moral dilemmas**, designed to separate robust accounts from inadequate ones. Requirements are categorized, with justifications, negotiability flags, tensions, and a critical failure indicator.

  ---

  ### **I. Core Phenomenon: Defining Genuine Dilemmas**
  1.  **The "No Moral Escape" Requirement:**  
      *   **Requirement:** Must recognize situations where an agent **cannot avoid wrongdoing** — every available choice violates a genuine moral obligation.  
      *   **Justification:** Captures the core agony: you *must* act, but *whatever you do* is morally wrong/prohibited. Distinguishes dilemmas from mere hard choices or tragic outcomes.  
      *   **Negotiability:** **NON-NEGOTIABLE.** Denying this dissolves the dilemma. Theories claiming "only one *real* duty" or "all-things-considered permissibility" fail here.

  2.  **Symmetry Requirement (Contested but Important):**  
      *   **Requirement:** Should explain why the conflicting obligations feel (or are) **incommensurable or equally stringent** in the context, preventing an easy "lesser evil" calculation.  
      *   **Justification:** Preserves the distinct phenomenological "tornness" and explains why deliberation stalls.  
      *   **Negotiability:** **PREFERENCE (Major Camp).** Some consequentialists/utilitarians reject symmetry, arguing every conflict has a calculable "lesser evil." Others (deontologists, particularists) see it as essential.

  ---

  ### **II. Distinctions the Theory MUST Preserve**
  3.  **Genuine Dilemma vs. Lesser-Evil Case:**  
      *   **Requirement:** Must sharply distinguish situations where **all options are wrong** (dilemma) from situations where **one option is morally permissible (or obligatory) because it minimizes overall harm/violation** (lesser evil).  
      *   **Justification:** Conflating these obscures the unique problem of unavoidable wrongdoing central to dilemmas.  
      *   **Negotiability:** **NON-NEGOTIABLE.** Failure here means the theory misunderstands the core phenomenon.
  4.  **Agent's Epistemic Perspective vs. Objective Moral Landscape:**  
      *   **Requirement:** Must distinguish whether the dilemma arises from the **agent's limited knowledge** (epistemic) or from an **inherent conflict in objective moral reality** (ontological).  
      *   **Justification:** Explains different sources of dilemmas (uncertainty vs. tragic reality) and impacts blameworthiness/residue.  
      *   **Negotiability:** **NON-NEGOTIABLE.** Essential for accurate diagnosis and assigning responsibility.
  5.  **Doing Wrong vs. Being Blameworthy:**  
      *   **Requirement:** Must allow that an agent **does something objectively wrong** in a dilemma *without* necessarily being **culpable, blameworthy, or deserving of punishment.**  
      *   **Justification:** Captures the intuition that agents in dilemmas are often tragic figures, not villains. Responsibility might be mitigated or negated by the context.  
      *   **Negotiability:** **NON-NEGOTIABLE.** Failure leads to unfairly condemning agents facing impossible choices.

  ---

  ### **III. Cases the Theory MUST Get Right**
  6.  **The Tragic Remainder/Residue:**  
      *   **Requirement:** Must account for **persistent negative moral traces** (guilt, regret, need for atonement, lingering wrongness) even after the "best" choice is made in a dilemma. (Bernard Williams' "moral remainder").  
      *   **Justification:** Reflects the intuition that wrongdoing in dilemmas isn't erased by necessity; something morally significant lingers.  
      *   **Negotiability:** **NON-NEGOTIABLE (as a phenomenon to explain).** How it's explained varies, but ignoring it is fatal. **Critical Failure Indicator:** A theory that *denies any residue whatsoever* has fundamentally missed the point of dilemmas.
  7.  **The "Sophie's Choice" Case:**  
      *   **Case:** Forced to choose which child dies, or both die. Choosing one saves one life but actively condemns the other.  
      *   **Requirement:** Must affirm that choosing *either* child involves wrongdoing (violating the duty to protect *that* child), even if necessary to save one. Must explain the profound residue.
  8.  **The Epistemic Dilemma ("Dirty Hands" Variant):**  
      *   **Case:** A politician *reasonably believes* they must authorize a morally repugnant act (e.g., torture) to prevent catastrophe, but it later turns out the information was wrong and the act was unnecessary.  
      *   **Requirement:** Must distinguish the *objective* wrongness of the act from the *blameworthiness* of the agent acting on reasonable-but-false beliefs. Must account for residue (the "dirt").
  9.  **The Sacrificial Dilemma (Debated):**  
      *   **Case:** Sacrificing one innocent life to save many (e.g., pushing one person off a bridge to stop a trolley killing five).  
      *   **Requirement:** Must *either* classify this as a genuine dilemma (emphasizing the direct, intended violation of the sacrificed person) *or* as a lesser-evil case *and justify that distinction clearly* based on its core definition. Cannot simply ignore the strong intuition of wrongness for many.

  ---

  ### **IV. Theoretical Requirements for Adequacy**
  10. **Deontic Logic Coherence:**  
      *   **Requirement:** Must provide a plausible account of deontic logic that doesn't collapse into contradiction (e.g., "OA & O~A") under the weight of dilemmas. Requires concepts like "prima facie duties," "violated but overridden obligations," or non-classical logics.  
      *   **Justification:** A theory generating logical contradictions is untenable.  
      *   **Negotiability:** **NON-NEGOTIABLE.** Foundational for intellectual respectability.
  11. **Avoidance of Moral Luck Distortion:**  
      *   **Requirement:** The theory's judgment of the agent's situation and blameworthiness should not depend *crucially* on factors entirely beyond their control (*outcome* moral luck).  
      *   **Justification:** Preserves fairness and focuses evaluation on the agent's deliberation and available choices.  
      *   **Negotiability:** **Strong Preference.** Moral luck is contentious, but letting outcomes *determine* permissibility/blameworthiness undermines the core experience of the dilemma at the choice point.

  ---

  ### **V. Potential Tensions/Incompatibilities to Flag**
  *   **Symmetry vs. Deontic Logic:** Insisting on *perfect* symmetry (OA & O~A with *exactly* equal weight) creates severe logical pressure. Theories often need softer symmetry ("strongly binding conflicting obligations") or non-standard logic.
  *   **Ontological Dilemmas vs. Moral Realism/Monism:** Believing in *objective, unresolvable* moral conflicts challenges views where morality is a unified, harmonious system (e.g., some forms of utilitarianism, Kantianism).
  *   **Residue vs. Consequentialism/Act Utilitarianism:** Explaining genuine, non-instrumental residue is difficult for theories where permissibility is solely determined by outcomes. The "wrongness" feels deeper than suboptimal consequences.
  *   **Blameworthiness Mitigation vs. Strict Liability:** Balancing the intuition that agents aren't blameworthy with the intuition that they *did* wrong creates tension, especially for theories emphasizing the objective wrongness of acts.

  ---

  ### **Summary & Critical Failure**
  *   **Non-Negotiables:** "No Moral Escape" (1), Distinguishing Dilemma/Lesser-Evil (3), Distinguishing Epistemic/Ontological (4), Distinguishing Wrongdoing/Blameworthiness (5), Accounting for Residue (6), Deontic Coherence (10).
  *   **Key Preferences/Camp Divides:** Symmetry (2), Classification of Sacrificial Cases (9), Handling of Moral Luck (11).
  *   **Most Revealing Failure:** Failing **The Residue Requirement (6)**. If a theory claims that after making the "necessary" or "best" choice in a purported dilemma, *no wrong was done, no obligation was violated, and there is absolutely no moral residue* (guilt is irrational, no need for atonement, the act is "clean"), it has fundamentally failed to grasp the nature of a *genuine moral dilemma*. It has likely collapsed the dilemma into a mere lesser-evil choice or denied the reality of conflicting obligations. **This failure most clearly shows the theory has missed the point.**

  This framework equips you to critically assess theories. A strong theory will satisfy the non-negotiables, handle the core cases plausibly, preserve the key distinctions, offer a coherent account of residue, and be transparent about where it stands on contested points and tensions. Good luck with your reading!
