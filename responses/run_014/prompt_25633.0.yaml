answer: |-
  **This is primarily a substantive disagreement about modal epistemology — specifically, whether ideal conceivability entails metaphysical possibility for consciousness — grounded in ultimately clashing bedrock intuitions about the nature of phenomenal concepts and the exhaustiveness of the physical.**

  Here's the reasoning:

  1.  **Core Disagreement:** The debate hinges on the validity of Chalmers' "bridge": `ideal primary positive conceivability → metaphysical possibility`. Physicalists reject this bridge *specifically for phenomenal consciousness*, arguing that our inability to conceptually derive phenomenal states from physical descriptions represents an *epistemic gap* (a failure of our concepts/understanding), not a *metaphysical gap* (a failure of the physical world to fix consciousness). Chalmers defends it by arguing phenomenal concepts reveal an intrinsic, non-structural aspect of reality not capturable by physical/functional concepts alone.
  2.  **Not Primarily Verbal:** While terms like "conceivable" and "physical" can be scrutinized, the core disputants (e.g., Chalmers vs. typical physicalist opponents) understand each other's usage well. The dispute isn't *about* the word meanings; it's about whether the concept *referred to* by "phenomenal consciousness" can be shown to be non-physical via conceivability arguments.
  3.  **Not Just Different Questions:** Your hypothesis captures part of it (epistemic vs. metaphysical), but Chalmers explicitly targets the metaphysical question *using* the epistemic tool (conceivability). Opponents attack the tool's reliability *for this specific target*. The disagreement centers on whether the epistemic tool *can* validly answer the metaphysical question in this domain.
  4.  **Role of Bedrock Intuitions:** The stalemate arises because:
      *   **Anti-Zombie Intuition:** Physicalists (especially reductionists/eliminativists like Dennett) have a strong intuition that a perfect physical/functional duplicate *must* be conscious. Denying the conceivability of zombies (or dismissing it as confused) defends this.
      *   **Zombie Intuition:** Chalmersians have a strong intuition that knowing *all* the physical/functional facts about a system leaves open the question "But is there *something it is like*?" This feels like a real, coherent possibility, not just ignorance.
      *   These intuitions underpin each side's stance on the conceivability→possibility bridge and the nature of phenomenal concepts. Logical arguments often ultimately circle back to defending these intuitions.

  **What Counts as Progress?**

  1.  **Conceptual/Formal Refinements:** Progress *within the debate* is likely incremental:
      *   Sharpening notions of conceivability (e.g., Adam Pautz's work on phenomenal concepts).
      *   Formal modeling of consciousness and computation (e.g., Scott Aaronson's insights on introspective access requiring computational resources exceeding what's needed for behavior).
      *   Exploring *why* the epistemic gap feels so intractable (e.g., David Papineau's work on "antipathetic fallacies").
  2.  **Empirical Constraints (Indirect):** Neuroscience won't directly prove/disprove zombies (they're metaphysical), but it could:
      *   Undermine bedrock intuitions (e.g., strong illusions of consciousness, or evidence that specific phenomenal states are *necessarily* tied to specific neural patterns in ways that make their absence in a physical duplicate seem incoherent).
      *   Support theories (e.g., IIT) that make stronger claims about consciousness being an intrinsic physical property, potentially challenging the *explanatory gap* motivation for zombies.
  3.  **Shifting the Debate's Ground:** Progress might mean reframing the issue:
      *   **Formal Undecidability/Intractability Results:** Aaronson's approach is key here. Demonstrating that determining subjective experience from physical description is computationally intractable (or impossible) in principle *for observers within the system* could validate the *epistemic gap* as fundamental, potentially dissolving the pressure to see it as a metaphysical gap.
      *   **Focus on Explanation:** Shifting focus from "is it possible?" to "what constitutes a satisfactory *explanation* of consciousness?" might bypass the metaphysical stalemate (though risks changing the subject).
  4.  **Acceptance of Fundamentally Different Perspectives:** Ultimately, the clash of intuitions suggests some level of persistent disagreement among smart people is inevitable. Recognizing this *as* a fundamental clash, rather than a resolvable logical error, can be a form of progress in understanding the limits of the debate.

  **Bottom Line on Progress:** Significant movement likely requires either 1) A conceptual breakthrough or formal result (like Aaronson's) that reframes the epistemic gap in a way both sides must accept, fundamentally altering the terms of the debate, or 2) Empirical discoveries that significantly shift the underlying bedrock intuitions about consciousness. Short of that, incremental refinement or acceptance of fundamental disagreement may be the realistic outcome.
