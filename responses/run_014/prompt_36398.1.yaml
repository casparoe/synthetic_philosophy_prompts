answer: |-
  Here’s your question-period sheet, tailored for an EA-savvy audience. I’ve prioritised objections by potential damage (high to lower), phrased as they’d likely be posed, with rebuttals, vulnerability notes, and strategic concessions. I’ve also addressed the tenability of SSA/SIA neutrality.

  ---

  **Question-Period Sheet: Simulation Argument as a Moderating Force on Longtermism**

  ### **Core Vulnerability Note**  
  Your neutrality on Self-Sampling (SSA) vs. Self-Indication (SIA) assumptions is fragile. SIA drastically inflates simulation probabilities (making your argument stronger), while SSA suppresses them (weakening it). Expect pressure to pick a side.

  ---

  ### **Objection 1: Fanaticism is Robust to Uncertainty**  
  *Phrasing:* "Even with simulation uncertainty, the *expectation* of astronomical value in the tiny probability we’re in the base reality dominates. Fanaticism isn’t dampened—it’s redirected toward ensuring *this* reality (if base) thrives. Doesn’t Pascal’s Mugging apply here?"  
  *(High damage: Directly challenges your thesis’ core mechanism)*  
  **Your Reply (2 mins):**  
  "Pascal’s Mugging requires *actionable* probabilities. Simulation isn’t just low probability—it fundamentally obscures *which* future we’re optimising for. If we’re sims, our actions may not affect the base reality; if we’re base, the far future may be shaped by sim-creators, not us. This isn’t adding a small probability of zero value—it fragments the ‘astronomical value’ into incoherent, competing hypotheses. When value distributions are incommensurable, maximising expected value loses normative force. We should default to robust, non-fanatic strategies."  
  **Soft Spot:** Assumes value fragmentation is paralyzing; longtermists may argue we can still target the base reality’s survival.  

  ### **Objection 2: Simulation Hypotheses Don’t Lower EV—They Rescale It**  
  *Phrasing:* "All you’ve shown is that the far future’s value is conditional on us being in base reality. But conditional EV there is *still* astronomical. Since we must act *as if* we’re base (absent disproof), longtermism holds. Your ‘screening off’ is just a red herring."  
  *(High damage: Reframes your argument as irrelevant)*  
  **Your Reply:**  
  "Acting ‘as if’ we’re base only works if simulations are negligible. But if we assign non-trivial credence (>1%) to being sims, we face *competing conditionals*: base-reality futures vs. sim-creator-determined futures. These aren’t additive—they’re mutually exclusive ontologies. Moral weight isn’t rescaled; it’s bifurcated. When hypotheses predict divergent futures with no common metric, the EV calculation fractures. That uncertainty should make us *more* risk-averse to sacrificing concrete present goods."  
  **Soft Spot:** Requires accepting that competing metaphysical hypotheses evade aggregation.  

  ### **Objection 3: You’re Ignoring the Simulation’s Moral Patients**  
  *Phrasing:* "Even if we’re sims, our simulation may contain trillions of moral patients. Dismissing the far future because we might be simulated commits a scope-insensitivity error—the simulation’s future could be vast too!"  
  *(Moderate damage: Could sway moral philosophers)*  
  **Your Reply:**  
  "Three points. First, sims may be fleeting or lack rich futures—Bostrom’s argument doesn’t imply they’re long-lived. Second, if sims *are* morally weighty, this *further* fragments our focus: we must weigh base-future beings vs. sim-future beings vs. sim-creators. That amplifies uncertainty. Third, if the sim-creators are advanced, our actions may be predetermined or irrelevant. This doesn’t eliminate value—it makes it radically opaque. Opaque value warrants precaution, not fanaticism."  
  **Soft Spot:** If sims have high EV, your moderation case weakens.  

  ### **Objection 4: Forecaster’s Scepticism: Simulation is Untestable, Thus Ignorable**  
  *Phrasing (from a forecaster):* "Simulation arguments aren’t falsifiable. In forecasting, we discard non-constraining hypotheses. Why not assign it negligible credence and move on?"  
  *(Moderate damage: Undercuts your probability lever)*  
  **Your Reply:**  
  "Respectfully, that’s a prior masquerading as a methodological rule. Bostrom’s trilemma is a valid Bayesian update: if advanced civs exist, many simulations are likely. Dismissing it requires assuming such civs are *impossible*—a strong claim. We assign credence to many untestable-but-plausible hypotheses (e.g., multiverses) in decision theory. The point isn’t that simulation is likely—it’s that non-zero credence injects Knightian uncertainty, altering optimal strategy."  
  **Soft Spot:** Hardcore empiricists will reject assigning credence to untestable claims.  

  ### **Objection 5: You Conflate Epistemic and Moral Uncertainty**  
  *Phrasing (moral philosopher):* "Uncertainty about *which* future exists doesn’t imply uncertainty about *how to act*. We can use a maxipok rule (minimise probability of extinction) that works across hypotheses."  
  *(Lower damage: Technical, but may resonate)*  
  **Your Reply:**  
  "Maxipok assumes extinction is the overriding bad. But if we’re sims, extinction may be irrelevant (our sim ends, but base reality continues). If we’re base, avoiding extinction is key—but sim hypotheses suggest advanced civs may be resilient, lowering extinction risk estimates. More critically, fanaticism isn’t just about extinction risk—it’s about sacrificing present welfare for long-term potential. When that potential is opaque, the sacrifice becomes harder to justify."  
  **Soft Spot:** Maxipok is a popular fallback in EA; denying its applicability is contentious.  

  ### **Objection 6: This Just Weakens All Cause Prioritisation**  
  *Phrasing:* "If simulation uncertainty undermines longtermism, it equally undermines AI safety, pandemic prep, etc.—all rely on forecasting. Should we just do cash transfers and give up?"  
  *(Lower damage: Rhetorically powerful but a straw man)*  
  **Your Reply:**  
  "Not at all. Near-term interventions (e.g., AI alignment) have clearer models, shorter feedback loops, and less metaphysical uncertainty. I’m not attacking robust cause areas—I’m challenging *fanaticism*: the claim that the far future’s value *always* dominates present costs. We can prioritise AI safety without accepting that a 0.001% risk reduction is worth immiserating millions today. Simulation uncertainty is one reason why."  
  **Soft Spot:** Longtermists see far-future focus as necessary for AI/pandemic prep.  

  ### **Objection 7: SSA/SIA Neutrality is Unstable**  
  *Phrasing:* "You can’t stay neutral on SSA vs. SIA. Under SIA, we’re almost certainly sims, making your case. Under SSA, simulation is negligible. Which is it? This determines if your argument has teeth."  
  *(High damage: Exploits your stated neutrality)*  
  **Your Reply:**  
  "A fair challenge. My aim is to show that *even if* we grant non-trivial credence (say 1-10%), it disrupts fanaticism. Under SSA, that credence may be low—but not zero—and combined with other uncertainties (e.g., value drift), it adds to the case for moderation. Under SIA, my argument strengthens. But crucially, *both* frameworks agree that simulation hypotheses are coherent and non-negligible if advanced civs are possible. That’s enough to inject radical uncertainty."  
  **Soft Spot:** Neutrality *is* untenable—concede SSA weakens your case but doesn’t kill it.  

  ---

  ### **The Objection You Hope Nobody Asks**  
  **"If we’re simulated, our sim-creators might punish us for neglecting the far future—so shouldn’t we be *more* fanatical to please them?"**  
  *Why it’s dangerous:* Invokes a perverse Pascal’s Mugging where simulation amplifies fanaticism.  
  **If Asked:**  
  "Speculating about sim-creators’ preferences is epistemically barren—we have no evidence. If we’re sims, our actions may be predetermined or trivial. If we’re not, we’ve wasted resources appeasing imaginary gods. This is the *reductio ad absurdum* of fanaticism: it makes us vulnerable to arbitrary infinite threats. We should reject such totalising demands on principle."  

  ---

  ### **Where to Concede Up Front**  
  In your talk, pre-emptively concede:  
  > *"I am not arguing against longtermism per se. If we *knew* we were in the base reality, prioritising the far future would be compelling. Nor am I dismissing simulation as impossible—it’s a serious hypothesis. My claim is that *acknowledging this uncertainty* should temper the extreme trade-offs fanaticism demands. We can be longtermists without being fanatics."*  

  This disarms accusations of "abandoning the future" and focuses debate on uncertainty’s normative implications.  

  ### **Final Note on SSA/SIA Neutrality**  
  It *will* be challenged—EA audiences know these frameworks. Defend it as methodological: you’re showing that *any* non-trivial credence (from either assumption) disrupts fanaticism. But be ready to admit that SSA (favoured by many) lowers the probability, making your case more about "uncertainty stacking" than simulation alone.  

  ---  
  **Delivery Tip:** For moral philosophers, emphasise *incommensurability*; for forecasters, stress *Knightian uncertainty*; for EAs, frame it as *robust decision-making*. Good luck!
