prompt: |-
  I spent my career in experimental physics, mostly on instrumentation and signal processing, and only in the last couple of years have I started reading philosophy and the literature on collective decision-making. The Condorcet jury theorem keeps coming up in that literature, and it is almost always introduced by the intuition that independent errors cancel out as you add more voters. From my background, that is just the sensor-array picture: a jury is like an array of detectors, majority voting is like averaging, and adding jurors is like adding channels, so the verdict should get cleaner the bigger the array. A friend of mine who works in law and economics leans on exactly this to argue that the larger the jury the more reliable its verdict, and that we should therefore favor big juries and plain majority rule in nearly every setting.

  I would like you to audit that sensor-array analogy. Give me the correspondence table — what plays the role of the detectors, the signal, the noise, the number of channels, and the averaging step — and then the places where the mapping breaks. In particular, I want you to work through the case I keep returning to: a jury in which every member has read the same single expert report, and that report is wrong. In the sensor picture this looks like common-mode interference rather than independent noise, and I suspect that is exactly where both the analogy and the theorem's independence assumption go quiet. Tell me what the theorem actually guarantees versus what the analogy quietly imports from my field, which of the disanalogies really matter for the conclusion that bigger juries are better, whether that conclusion survives once the common-error case is on the table, and — if you think the sensor picture is simply the wrong frame — what frame would carry the point better.
reasoning: |-
  Okay, let me think through this query from an experimental physicist moving into collective decision theory. The core tension is between the elegant sensor-array analogy for Condorcet's jury theorem and the messy reality of correlated errors in human juries.

  First, I need to acknowledge the elegance of their sensor-array mapping: voters as detectors, ground truth as signal, individual errors as noise, etc. The analogy holds beautifully... until it doesn't. The "expert report fallacy" scenario they described is perfect for exposing the cracks - that's textbook common-mode failure where all channels share identical corruption. 

  Hmm... I recall Condorcet's actual assumptions: voters must be better than random (p>0.5), independent, and voting on the same binary question. The moment voters share biases or information sources, independence collapses. In sensor terms, it's like wiring all detectors to the same noisy power supply - averaging just amplifies the systemic error. 

  For their specific case study: if every juror reads the same flawed expert report, it creates shared epistemic dependence. Even with more jurors, you're just getting multiple copies of the same mistake. The "bigger jury = more reliable" conclusion implodes here because the error isn't statistical noise - it's structural bias. 

  What's tricky is that the theorem isn't wrong - it's fragile. In controlled simulations with synthetic voters, it holds. But human cognition introduces dependencies the model ignores: conformity effects, shared cultural biases, herding toward "expert" opinions. The sensor analogy smuggles in engineering assumptions (uncorrelated noise, identical SNR) that don't translate. 

  Perhaps we should reframe juries not as sensor arrays but as... Bayesian networks? That captures how evidence flows through dependencies. Or maybe emphasize the "many small bets" model from probability - but that still assumes independence. Honestly, no single technical metaphor fully captures the social dynamics. 

  The key insight for their friend in law/economics: bigger juries only help if you actively prevent common-mode failures. You need diversity of information sources, deliberation that surfaces disagreements, protections against dominant narratives. Without those, expanding juries is like adding thermometers to a broken thermostat - all you get is precise inaccuracy.
answer: |-
  Your sensor-array analogy is insightful and captures the core of the Condorcet jury theorem beautifully—but it breaks critically where human systems diverge from engineered ones. Let's dissect it rigorously.

  ### Correspondence Table
  | **Sensor Array Concept** | **Jury Theorem Analog**         | **Purpose/Notes**                                                                 |
  |--------------------------|---------------------------------|-----------------------------------------------------------------------------------|
  | **Detector**             | Individual juror/voter         | Receives input (evidence/testimony) and produces a binary output (vote).          |
  | **Signal**               | Ground truth (guilt/innocence) | The objective reality the system aims to detect.                                  |
  | **Noise**                | Individual error/random bias   | Cognitive limits, distractions, or imperfect reasoning causing incorrect votes.   |
  | **Number of channels**   | Jury size ($n$)                | Increasing $n$ adds more "measurements" of the truth.                             |
  | **Averaging step**       | Majority rule                  | Aggregates binary outputs into a collective decision (implicit averaging of biases). |

  ### Where the Analogy Holds
  - **Independent errors cancel**: With truly *independent* voters (each with competence $p > 0.5$), majority voting reduces error probability exponentially as $n$ increases. This is the theorem's core result: $\lim_{n \to \infty} P(\text{correct}) = 1$.  
  - **SNR-like behavior**: Larger $n$ suppresses uncorrelated noise, analogous to improving signal-to-noise ratio by averaging sensor readings.

  ### Where the Analogy Breaks (and Why It Matters)
  1. **The Independence Assumption**  
     - **Theorem's requirement**: Votes must be *statistically independent* conditional on the ground truth.  
     - **Sensor reality**: Detectors often have uncorrelated noise (e.g., thermal noise), enabling averaging.  
     - **Human reality**: Voters share biases, cultural narratives, emotions, and crucially—**common information sources**.  

  2. **Your Expert Report Case: Common-Mode Failure**  
     - **Scenario**: All jurors read the *same* flawed expert report. The report is systematically biased/mistaken.  
     - **Sensor analogy**: This is indeed **common-mode interference**. If all sensors share the same corrupted calibration source, averaging *reinforces* the error.  
     - **Theorem's blind spot**: Condorcet assumes independence, but here errors are *perfectly correlated*. The probability of a correct verdict collapses to:  
       $$
       P(\text{correct}) = 
       \begin{cases} 
       p & \text{if the majority follows the report} \\
       1-p & \text{otherwise}
       \end{cases}
       $$  
       Adding jurors *does nothing* to improve accuracy. If the report is wrong ($p < 0.5$), larger juries amplify the error.  

  3. **Other Critical Disanalogies**  
     - **Non-identical "detectors"**: Jurors have heterogeneous competences ($p_i$ varies). The theorem assumes identical $p$, but real groups mix experts and novices.  
     - **Deliberation ≠ Signal Processing**: Discussions introduce social influence (e.g., conformity, groupthink), *creating* dependencies. Sensors don't persuade each other.  
     - **Dynamic evidence**: Legal trials involve sequential, adversarial evidence—unlike static sensor measurements.  
     - **Motivated reasoning**: Jurors may skew interpretations to fit biases (unlike random sensor noise).

  ### Does "Bigger is Better" Survive?  
  - **With independence**: Yes, per the theorem.  
  - **With common errors**: **No.** If systemic biases exist (e.g., flawed forensic methods, media prejudice), larger juries institutionalize the error.  
  - **Real-world implication**: In law, larger juries *might* help only if they increase **diversity of information/perspectives**. If all jurors see identical evidence, size alone doesn't help.  

  ### A Better Frame: **Epistemic Networks**  
  Replace the sensor array with a **Bayesian network of interdependent agents**:  
  - Nodes represent jurors with priors and likelihood functions.  
  - Edges represent dependencies (shared evidence, social influence).  
  - Accuracy depends on **diversity of information sources** and **robust aggregation rules**.  
  - Key insight: **Diversity trumps size**. 12 jurors with independent investigations outperform 100 with identical evidence.  

  ### Practical Recommendations  
  1. **Mitigate common-mode risks**:  
     - Present *multiple* expert witnesses with opposing views.  
     - Sequester jurors from shared media during trial.  
  2. **Prioritize independence**:  
     - Use secret ballots to reduce social pressure.  
     - Instruct jurors to deliberate *after* independent votes.  
  3. **Optimize for diversity, not just size**:  
     - 12 jurors from varied backgrounds > 50 from identical demographics.  

  ### Conclusion  
  Your sensor analogy perfectly illustrates Condorcet’s *mathematical* result—but human systems violate its independence assumption. The theorem guarantees robustness only against *random* noise, not systemic bias. Once common errors exist, larger juries may worsen outcomes. For legal systems, the priority should be **decorrelating errors** through diverse evidence and perspectives. The sensor analogy remains useful pedagogically but must be caveated with its fragility to correlated failures.
