prompt: |-
  I am the compliance officer at a mid-sized medical device manufacturer that sells in eight countries. Several times a week I have to rule on gifts, meals, travel and hospitality: things our sales staff want to give to customers and hospital purchasing staff, and things they want to accept from suppliers. The range runs from a sandwich to a week at a resort, and getting it wrong can mean criminal liability for the company and, in some places, for the individual whose initials are on the form. I have about five minutes per request, no legal training beyond our own policy, and no authority to give case-by-case legal advice. Anything above the written threshold goes to the general counsel, who also has to approve the wording of the policy itself, and an external auditor will eventually read that policy and ask why the numbers in it are the numbers they are. I would also like a first-line version I can hand to two junior staff who will field most of the questions before they reach me.

  I have been reading about vagueness, and I think I finally understand why every draft of the policy I write comes out either uselessly vague or dishonestly precise. The difficulty is not that I don't know the law. It is that the predicate at the centre of the whole exercise — bribe, or inducement, or improper benefit, whatever word the local statute uses — seems to have no sharp boundary, and I am being asked to write a sharp boundary into a document and then apply it. A cup of coffee is not a bribe. A briefcase of cash is a bribe. Take the briefcase and remove one dollar, then another: I cannot say where the change happens, and no one I ask can either. My drafts have done one of two things: a numeric cap that is plainly arbitrary at the margin, or a list of factors followed by a note that each case must be judged on its merits, which is exactly what I had before I wrote anything. I have seen four ways of talking about this and I don't know which one I am implicitly relying on: that there really is a line and we simply cannot find it; that there is no line at all and the predicate is neither true nor false of the borderline cases; that the line exists but moves with the context of the person applying it; or that the predicate comes in degrees and nothing needs a line. I suspect the choice matters for what I write, and I want to know whether it matters in practice or only in how I justify myself afterwards.

  What I need is a procedure, not a discussion. Specifically:

  1. A decision procedure in words — a flowchart in order — that I can run on a single request in a few minutes. For each question: what counts as a sufficient answer, what I do when the answer is unclear, and where the procedure stops. Distinguish the stopping points clearly: a clean no; a clean yes; a no I will have to defend to an annoyed sales director; and a hand-off to a person. For each hand-off, say whether it is a hand-off because the question is one of values rather than facts, or because the procedure has run out of information I can get in five minutes.

  2. A method for setting the numbers and categories in the written policy itself, not merely for applying them. This is where I need the philosophy rather than the law. If the predicate has no sharp boundary, what is the status of a rule saying that nothing above X may be accepted? Is it a discovery of where the line always was, a stipulation, or something in between — and does the answer change what the policy's preamble should say the rule is for? State plainly which of the four positions above the procedure presupposes, and whether a procedure built on a different one would behave differently in practice or only in its rhetoric.

  3. Two failures I expect from any single threshold, and what to do about them. First, the continuum does not run only along the size of one gift: there is a second one, the accumulation of many small things from the same source over years, and a cap on individual gifts does nothing about it. Second, the boundary appears to move with context — the same bottle of whisky means something different from a purchasing clerk, from a ministry official, and from a customer who has bought from us for a decade; and something different again while we are bidding for a contract than after we have held it. I want the procedure to handle both without collapsing into 'it depends'. I am also aware that the offence is not purely a matter of degree: there is an intent element that looks all-or-nothing, and I do not want a numeric cap to swallow it.

  4. A rule for the middle. Every draft I have written has an obvious gap between clearly fine and clearly not fine, and the gap is where all the real requests live. I do not want that gap filled with 'use your judgment'. I want a default, a reason for the default, a rule for when it can be overridden, and a specific provision for the case where the person asking me is my own manager.

  Then run the procedure on the following, in this order, showing your work at each step:

  (a) A supplier offers one of our sales representatives two tickets to a sold-out concert, face value 180 each, three weeks before that supplier's contract comes up for renewal. The representative does not vote on the renewal but is the person the supplier deals with day to day.

  (b) A hospital department head with whom we have no contract invites our regional manager to a weekend at a golf resort, roughly 2,500 all in, described as relationship building, while we are preparing a bid.

  (c) A customer who has bought from us for fifteen years sends a box of chocolates, about 25, to his regular representative at the new year. The policy as drafted says staff may not accept anything of value from a customer. The representative will be upset, every competitor does this, and I have already told two other representatives to decline similar boxes this month.

  I expect the procedure to give me an answer I do not like at least once, and I would rather find that out now than in an audit. Finally, tell me what the procedure cannot do: which steps are judgments dressed up as procedure, where it will misfire, and what I should stop expecting a written policy to settle. I do not want a survey of the literature and I do not want citations; I want the thing I can use on Monday morning, together with an honest account of what it is.
reasoning: |-
  Okay, the user is a compliance officer at a medical device company dealing with gift policies. They're struggling with the vagueness of terms like "bribe" and need a practical procedure. Let me unpack their main points.

  First, they need a clear decision procedure that's quick to apply. The challenge is balancing legal safety with practicality. They mention examples from sandwiches to resort trips, showing the range. The core issue is defining boundaries where the law itself is fuzzy.

  The user’s frustration comes through—they’ve tried numeric caps (arbitrary) and factor lists (too vague). Their four philosophical positions about boundaries are key here. I need to pick one that works operationally. The degree-based approach makes sense because it avoids pretending exact lines exist where they don’t. 

  For the procedure, I should structure it as a flowchart with clear stopping points. Include thresholds for quick decisions but build in escalation paths. Highlight "danger zones" where context matters, like during bids. The accumulation problem needs tracking—maybe a simple log for repeat gifts. Intent is tricky; the procedure can flag red flags (like contract timing) without judging intent directly.

  Setting policy numbers isn’t about finding a "true" line but choosing defensible ones. Transparency is crucial: admit the arbitrariness upfront in the preamble. Use benchmarking and worst-case scenarios to justify amounts. 

  For the middle-ground gap, a default "no" with override conditions works. Manager overrides should require documentation to prevent abuse. 

  Test cases: 
  - Concert tickets: High risk (renewal timing), so deny. 
  - Golf resort: Obvious no—escalate to legal. 
  - Chocolates: Allow under de minimis but log for accumulation. 

  The procedure’s limits: Contextual judgments are unavoidable (e.g., assessing "relationship depth"). Tracking accumulation relies on self-reporting. And no policy can eliminate judgment—just contain it. 

  User’s deeper need: Confidence in defending decisions during audits. The philosophy shift (embracing "arbitrary but reasonable") protects them better than pretending precision exists. 

  Final check: Does this give them Monday-morning tools? Yes—clear steps, examples, and honesty about where the policy can’t help.
answer: |-
  Here is a practical decision procedure, policy framework, and analysis addressing your core challenges. It embraces the philosophical reality of vagueness while providing operational clarity.

  **Core Philosophical Stance for the Policy & Procedure:**  
  The procedure presupposes **"the predicate comes in degrees and nothing needs a line."** A bribe/inducement is a matter of *degree* based on multiple factors. The policy's numeric thresholds are **stipulated boundaries** based on risk tolerance and practicality, *not* discoveries of a pre-existing sharp line. This is honest and defensible. A procedure built on "no line at all" would be identical in practice; one built on "a hidden line" or "context moves the line" would be more complex and less consistent.

  ---

  **1. The 5-Minute Decision Procedure (Flowchart in Words)**  
  *Use this for each request. Distinguish: Facts (gather), Judgment (assess), Decision (apply rule).*

  1.  **Who is the Counterparty?** (Customer, Potential Customer, Supplier, Gov't Official?)
      *   *Sufficient Answer:* Specific role (e.g., "Hospital Purchasing Manager", "Ministry Procurement Officer", "Supplier A Sales Rep").
      *   *Unclear?* Ask requester for clarification. If still unclear after 1 min -> **Hand-off to Compliance Officer (CO)**. (Reason: Role ambiguity materially impacts risk assessment).
      *   *Decision:* Proceed.

  2.  **What is the Nature & Estimated Monetary Value (EMV) of the Item/Event?**
      *   *Sufficient Answer:* Specific description & good-faith EMV (e.g., "Dinner for 4", "EMV $200"; "Conference Pass", "EMV $1,200").
      *   *Unclear Value?* Requester must provide best estimate based on public info (menu, ticket face value, hotel rack rate). If impossible -> **Hand-off to CO** (Reason: Value is fundamental).
      *   *Decision:* Proceed.

  3.  **Is this during an Active Bid/Tender/Renewal Process involving this counterparty?**
      *   *Sufficient Answer:* "Yes", "No", or "Unsure, process starts in [Timeframe]". Treat "Unsure" as "Yes".
      *   *Unclear?* Check company bid calendar/systems if possible within 1 min. If still unclear -> Treat as **"Yes"** (Reason: Conservative risk mitigation).
      *   *Decision:* Proceed. Flag if "Yes".

  4.  **Is the EMV <= the Policy's "De Minimis" Threshold?** (e.g., $50 USD equivalent)
      *   *Sufficient Answer:* Calculation based on #2 vs. policy number.
      *   *Unclear?* Rare if #2 done. -> **Hand-off to CO**.
      *   *Decision:*
          *   **Clean YES:** If EMV <= De Minimis AND NOT during Active Process (#3=No). *Approve*. Log it.
          *   **Go to #5:** If EMV <= De Minimis BUT during Active Process (#3=Yes/Unsure).
          *   **Go to #5:** If EMV > De Minimis.

  5.  **Check Policy Thresholds & Exceptions:**
      *   *Sufficient Answer:* Compare EMV to clear policy thresholds (e.g., "Business Meals Cap: $150 pp", "Gifts Cap: $100", "Entertainment Cap: $250", "Pre-Approved Training/Conference List").
      *   *Decision:*
          *   **Clean NO:** If EMV exceeds any applicable hard cap OR involves cash/cash equivalent -> *Deny*. (e.g., Resort weekend exceeds Entertainment cap).
          *   **Clean YES:** If EMV <= Cap AND falls under a pre-approved category (e.g., Industry Conference fee within cap) -> *Approve*. Log it.
          *   **Go to #6:** If EMV <= Cap but NOT pre-approved category OR during Active Process (#3=Yes/Unsure).

  6.  **Contextual Risk Assessment (CRITICAL STEP - Requires Judgment):**
      *   *Assess:* Frequency (How often from this source?), Reciprocity (Expected?), Relationship Depth (Long-term partner or new?), Intent Perception (How would this look disclosed publicly?), Local Law Specifics (Known higher-risk jurisdiction?).
      *   *Sufficient Input:* Requester *must* provide info on Frequency/Relationship. Use your knowledge of counterparty/local law.
      *   *Unclear?* If critical info (Frequency, Relationship depth) missing after 2 mins -> **Hand-off to CO** (Reason: Essential context missing for judgment).
      *   *Decision Framework (Apply Conservatively):*
          *   **"Defendable NO" (Likely):** If ANY Red Flag: Active Process (#3=Yes), High Frequency, New Relationship, Sensitive Counterparty (Gov't), Jurisdictional Risk. *Deny*. (Reason: Risk outweighs benefit, easily defended as prudent).
          *   **"Defendable YES" (Rare):** ONLY if ALL: NOT Active Process, Infrequent, Established Long-Term Relationship (>3 yrs), Non-Sensitive Counterparty, Low-Risk Jurisdiction, EMV well below cap (e.g., $150 event vs $250 cap). *Approve*. Log *detailed* justification (Relationship, Frequency, Non-Active timing).
          *   **Hand-off to General Counsel (GC):** If borderline/mixed factors OR involves Gov't Official OR value >$X (e.g., $1000) OR cash-like. (Reason: High stakes, legal judgment required).

  **Stopping Points Summarized:**
  *   **Clean YES:** Low value, non-active process (#4).
  *   **Clean NO:** Exceeds hard cap, cash, or high risk + active process (#5, #6).
  *   **Defendable NO:** Contextual risk assessment flags concerns (#6). (You'll need to explain risk basis to sales).
  *   **Hand-off to CO:** Role ambiguity (#1), Value ambiguity (#2), Missing critical context (#6).
  *   **Hand-off to GC:** High value, gov't officials, legal complexity, borderline cases with mixed factors (#6).

  ---

  **2. Policy Number Setting Method & Justification**
  *   **Method:**
      1.  **Benchmark:** Research industry norms (AdvaMed Code, MedTech Europe), competitor policies (if known), local law guidance thresholds in your 8 countries.
      2.  **Risk Tolerance:** Consult GC & Senior Management. What loss can the company absorb? What reputation risk is acceptable? Set caps *below* common industry/legal thresholds found in step 1.
      3.  **Practicality:** Set "De Minimis" at a level where the cost of tracking/logging exceeds risk (e.g., $25-$50). Set other caps at levels where routine business activities (modest meals, small promotional items) are clearly covered.
      4.  **Worst-Case Jurisdiction:** Ensure caps comply with the *strictest* local law among your 8 countries.
      5.  **Preamble Statement:** "The monetary thresholds and categories in this Policy are established based on industry standards, legal guidance in our operating jurisdictions, and the Company's risk tolerance. They represent clear, practical boundaries to mitigate the risk of improper inducements, recognizing that the determination of what constitutes an improper benefit involves contextual factors beyond monetary value alone. Exceeding these thresholds creates significant legal and reputational risk and is strictly prohibited."
  *   **Status of Rule:** The rule ("nothing above X") is a **stipulated risk management control**, not a discovery of a natural boundary. This is honest and defensible to auditors. The preamble explains this.

  ---

  **3. Handling Threshold Failures & Intent**
  *   **Accumulation:**
      *   **Policy:** Mandate logging *all* items given/received, regardless of value or approval status (use simple internal system).
      *   **Procedure:** In Step #6, *always* check the log for frequency/patterns from the *same source* within the last 12 months. Treat a pattern of frequent small gifts (even under de minimis) as a single larger gift for risk assessment. Require pre-approval for *any* further items from that source if a concerning pattern emerges.
  *   **Context Dependency:**
      *   **Policy:** Explicitly state that thresholds are *maximums* under *optimal* conditions (established relationship, non-active process). State that significantly lower values may be improper depending on context.
      *   **Procedure:** Step #6 *is* the context filter. Use the factors listed (Relationship, Timing, Counterparty Sensitivity, Frequency) to downgrade the "acceptable" level far below the numeric cap when risk is elevated (e.g., during a bid). The cap is the ceiling, context determines the floor.
  *   **Intent Element:**
      *   **Policy:** State that intent is inferred from circumstances, including value, timing, secrecy, and nature of the benefit. Explicitly prohibit attempts to circumvent policy (e.g., splitting large gifts).
      *   **Procedure:** Steps #3 (Active Process) and #6 (Context) directly address circumstantial evidence of intent. Obvious intent triggers (cash during bid) lead to Clean NO (#5) or Hand-off to GC (#6). A numeric cap doesn't swallow intent; it creates a bright line where circumstantial intent is presumed if crossed. Contextual factors catch intent below the cap.

  ---

  **4. Rule for the Middle (The Gray Zone)**
  *   **Default:** **"Defendable NO"** (Step #6 outcome).
  *   **Reason for Default:** In compliance, the cost of a false negative (allowing a bribe) vastly outweighs the cost of a false positive (denying a legitimate relationship gesture). Conservatism protects the company and individuals. "No" is always legally defensible; "Yes" in the gray zone carries inherent risk.
  *   **Override Rule:** The only override is **approval by the General Counsel** (Step #6 Hand-off). The CO cannot override a contextual "Defendable NO" themselves.
  *   **Manager Requesting:** **No Special Provision.** Follow the procedure identically. If the manager pressures you during a "Defendable NO" or tries to bypass, document the interaction and **Hand-off to GC immediately**, copying the GC on the initial documentation. Your authority comes from the policy and GC, not line management.

  ---

  **Running the Procedure: Test Cases**

  **(a) Concert Tickets ($360, Supplier, Pre-Renewal)**
  1.  **Counterparty:** Supplier (Clear).
  2.  **Nature/Value:** Entertainment, EMV $360 (Clear).
  3.  **Active Process?** YES (Renewal in 3 weeks).
  4.  **De Minimis?** NO ($360 > $50).
  5.  **Policy Thresholds:** Assume Entertainment Cap = $250 pp. $360 for 2 tickets = $180pp? **Check:** $180pp < $250 cap? If YES -> Go to #6. If policy cap is per *event* or *total gift*, likely exceeds -> **Clean NO** (Stop). *(Assume per event cap $250, total $360 > $250 -> Clean NO)*. If per person cap $250, $180pp < $250 -> Go to #6.
  6.  **Context:** HIGH RISK (Active Renewal Process! Supplier relationship, Recipient is day-to-day contact (influence perceived)). Frequency? (If frequent gifts -> Worse). **Decision: Defendable NO (or Hand-off to GC if borderline per policy).** *Justification to Sales: "Prohibited due to timing immediately before contract renewal, creating an appearance of undue influence."*

  **(b) Golf Resort Weekend ($2,500, Potential Customer, Pre-Bid)**
  1.  **Counterparty:** Hospital Dept Head (Potential Customer) - Clear.
  2.  **Nature/Value:** Hospitality, EMV $2,500 - Clear.
  3.  **Active Process?** YES (Preparing Bid) - Clear.
  4.  **De Minimis?** NO.
  5.  **Policy Thresholds:** Exceeds any reasonable Entertainment/Hospitality cap (e.g., $500-$1000). **Clean NO.** (Stop). *No need for #6. Justification: "Value vastly exceeds policy threshold for customer hospitality."*

  **(c) Chocolates ($25, Long-Term Customer, Routine)**
  1.  **Counterparty:** Customer (Clear).
  2.  **Nature/Value:** Gift, EMV $25 (Clear).
  3.  **Active Process?** NO (Routine, no specific bid/renewal mentioned) - Assume No.
  4.  **De Minimis?** YES ($25 <= $50) AND NOT Active Process. **Clean YES.** (Stop). *Approve. Log it (crucial for accumulation tracking).*
      *   *Policy Conflict:* Your drafted policy ("not accept anything of value") is flawed and unrealistic. It *must* have a de minimis exception. Revise policy to reflect Step #4. Explain to rep: "Approved under de minimis exception for customary seasonal gifts. Must be logged."

  ---

  **What the Procedure CANNOT Do (Honest Assessment)**

  1.  **Eliminate Judgment:** Steps #3 (interpreting "Active Process" boundaries) and #6 (Contextual Risk) **are judgments dressed as procedure.** The procedure structures and documents the judgment, but doesn't remove it. You *will* need to explain your Step #6 reasoning during an audit.
  2.  **Guarantee Legal Safety:** It minimizes risk but cannot eliminate it. A zealous prosecutor or auditor might still challenge a contextual "Defendable YES," though the documented rationale is your defense.
  3.  **Fix a Bad Policy:** If policy thresholds are set too high or lack de minimis, the procedure outputs bad decisions. Policy drafting is paramount.
  4.  **Ensure Perfect Logging:** Accumulation defense relies entirely on accurate, complete logs. This depends on staff discipline and system ease-of-use.
  5.  **Handle Extreme Nuance in 5 Minutes:** Truly borderline cases (#6 Hand-off to GC) exist. The procedure identifies them quickly for escalation; it doesn't resolve them instantly.
  6.  **Prevent Creative Circumvention:** Determined individuals might lie about value, split gifts, or find loopholes. Training, auditing, and culture are needed alongside the procedure.
  7.  **Replace Training & Culture:** The procedure is a tool. Staff must understand *why* compliance matters. A culture that values ethics over "winning at all costs" is essential.

  **Use This Monday Morning:** Implement this procedure verbatim for your junior staff and yourself. Revise your policy draft to include:
  1.  Clear monetary thresholds (De Minimis, Meals, Gifts, Entertainment, Hospitality) based on the Method (#2).
  2.  Explicit de minimis exception.
  3.  Mandatory logging requirement for *all* items.
  4.  Contextual factors listed (Timing, Relationship, Frequency, Counterparty Type).
  5.  The Preamble statement acknowledging thresholds as risk controls.
  6.  The "Rule for the Middle" (Default NO, GC override only).

  This provides structure, consistency, defensibility, and acknowledges the inherent vagueness while giving you actionable answers. Expect pushback on "Defendable NOs" – your defense is "prudent risk management."
