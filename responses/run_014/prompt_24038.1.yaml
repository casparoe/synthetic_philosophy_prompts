  Next, the ontology question: is the algorithm a real entity? CDT treats it as a fiction, while UDT assumes it's a concrete object that can be copied and correlated. This difference becomes stark in problems like Parfit's Hitchhiker or Toxoplasmosis, where coordination matters. 

  Then, the splits within updateless theories. UDT1.0 uses logical uncertainty over program outputs, FDT emphasizes the function itself as the object of choice, TDT considers the computation. The technical crux is handling logical correlation without ad-hoc assumptions. MUDT's use of measures on computation paths versus FDT's explicit function mapping. 

  The user asks for progress possibilities. Since each theory optimizes different objectives, resolution might require agreeing on the problem's scope. Formal equivalence results could help, but might be limited. Alternatively, shifting to engineering: which method yields better outcomes in specific domains. 

  I should ensure my response addresses all parts: the structural disagreement, the technical divergence in updateless variants, and prospects for progress. Need to avoid taking sides but clarify the foundational differences. Also, highlight that CDT and UDT are answering distinct questions, hence the impasse. The ontology point is crucial—CDT's causal nodes vs. UDT's algorithm as a physical entity. 

  Finally, the user's deeper need might be to facilitate student understanding by framing the debate's structure, showing why consensus is elusive. Providing this clarity could help them teach the unresolved nature of the field constructively.
answer: |-
  Your frustration is warranted—the debate isn't stalled due to confusion but because different schools optimize fundamentally distinct objects under the label "rationality." The impasse is **ontological and teleological**, not merely semantic or technical. Below, I dissect the structure, leveraging formal touchpoints from each camp.

  ### Core Disagreement: The Unit of Agency
  1. **Causal Decision Theory (CDT)**  
     - **Ontology:** Treats the decision as an *atomic event* embedded in a causal graph (Pearl-style DAGs). Only ancestors and descendants have causal efficacy.  
     - **Teleology:** "Rational" means maximizing *causal expected utility (CEU)* from the agent's current node in the graph.  
     - **Formal Reliance:** CEU = Σ *P(Outcome |* ***do***(Act)) · Utility(Outcome).  
     - **Response to Variants:** In a **transparent Newcomb** box (agent sees contents before choosing), CDT *still two-boxes* because *seeing* the prediction doesn't make the act causally influence the past. In **copied-agent problems** (e.g., Prisoner's Dilemma with clones), CDT defects—it can't condition on the clone's act as evidence since clones aren't causal descendants.

  2. **Updateless Decision Theories (UDT/FDT/TDT)**  
     - **Ontology:** Treats the *decision procedure* (algorithm) as a persistent, abstract object that can be instantiated in multiple physical scenarios.  
     - **Teleology:** "Rational" means selecting the *policy* (mapping observations to acts) that maximizes expected utility *from a pre-observation perspective*, ignoring "updates" that break correlations.  
     - **Formal Reliance:** Utility is computed by averaging over possible worlds where the *same function* governs all instances: EU(π) = Σ *P(World)* · Utility(World, π).  
     - **Response to Variants:** One-boxes in transparent Newcomb because the *policy* of one-boxing yields better outcomes across worlds. Cooperates with clones because the *same function* controls both agents—defecting would mean implementing a globally suboptimal policy.

  ### Why They Pass Like Ships in the Night
  - **Different Optimization Targets:** CDT optimizes *acts at a node*; UDT optimizes *functions across nodes*. When a problem involves acausal correlations (e.g., predictors reading algorithms, cloned agents), UDT's policy-level view exploits correlations CDT dismisses as "non-causal."  
  - **No Shared Failure Mode:** CDT fails problems requiring *cross-instance coordination* (e.g., Parfit's Hitchhiker), calling them "ill-posed." UDT fails problems where *algorithm identification is ambiguous* (e.g., "dust specks vs. torture" with fuzzy agent boundaries), calling CDT "myopic."  
  - **Ontological Incommensurability:** CDT rejects the existence of a "decision procedure" as a causal entity. UDT treats the algorithm as *physically real* (e.g., brain code, source code)—a stance explicit in FDT's formalism where the agent chooses a *function* **F** (Yudkowsky & Soares, 2010).

  ### The Updateless Schism: UDT vs. FDT vs. TDT
  Your suspicion is correct—the split isn't cosmetic. The crux is **how to formalize logical correlation** and **what constitutes an "instance" of an algorithm**:
  - **TDT** (Timeless DT): Uses *logical counterfactuals* (e.g., "What if my output were **A**?") but lacks a rigorous mechanism for weighting possible computations.  
  - **UDT** (Updateless DT): Requires a **mathematical intuition module** (MUI) to assign probabilities to mathematical propositions (e.g., "What is *P*(Ω ⊢ **F**(input) = **a**)?")—but MUIs are underspecified.  
  - **FDT** (Functional DT): Grounds correlations in *functional equivalence*: two systems implement the same **F** if they compute identical outputs for identical inputs.  

  **Open Technical Crux:** How to handle **fragmented or approximate implementations**.  
  - Example: Two agents with 99% identical code in a coordination game.  
    - **UDT1.1** (Wei Dai): Averages over "possible agenty things" with subjective similarity weights.  
    - **FDT** (Yudkowsky, Soares): Demands exact functional equivalence—ambiguous cases cause instability.  
    - **MUDT** (McGregor & Veness): Uses *measure theory over computation paths*—still ad hoc.  

  This remains unresolved because no formalism adequately captures "similar but not identical" algorithms without arbitrary parameters.

  ### What Would Count as Progress?
  The impasse won't resolve through debate—progress requires **reframing or empirical validation**:
  1. **Formal Equivalence Result:** Prove that in universes without *cross-temporal/acausal correlations*, CDT and UDT policies converge. This would clarify the *domain of divergence*.  
  2. **Decision-Theoretic Engineering:** Identify real-world domains where the ontologies yield measurable differences (e.g., AI coordination, quantum games). Success of UDT-like bots in acausal trade would pressure CDT to expand or concede.  
  3. **Redefine the Goal:** Acknowledge two distinct virtues:  
     - **Locally Rational:** CDT's *causal responsibility at t*.  
     - **Glibly Optimal:** UDT's *design-time intelligence*.  
     Separating these ends the false conflict.  
  4. **Algorithmic Ambiguity Resolution:** A formal criterion for "same algorithm" under uncertainty (e.g., entropy-minimizing functional priors). This could unify UDT/FDT variants.

  ### Why Resolution Is Unlikely
  The disagreement mirrors foundational splits in philosophy (e.g., moral particularism vs. utilitarianism). CDT prioritizes *agent-centric control*; UDT prioritizes *outcome-centric design*. Each satisfies a different intuition about agency:
  - CDT: "I control only my causal outputs."  
  - UDT: "I *am* a procedure—my choices reflect its global properties."  

  Until one approach demonstrably fails in a domain both claim to cover—or until we engineer agents that care—the debate will persist. The theories aren't rivals; they answer orthogonal questions. Your students might find clarity by mapping each to its *implied metaphysics of agency* rather than seeking consensus on "rationality."

  *Source touchpoints for your seminar:*  
  - CDT: Pearl (2000), *Causality*, Ch. 4.  
  - UDT: Wei Dai (2009), "Towards a New Decision Theory."  
  - FDT: Yudkowsky & Soares (2010), "Functional Decision Theory."  
  - TDT: Yudkowsky (2010), "Timeless Decision Theory."  
  - Fragmentation: Fallenstein et al. (2015), "Reflective Oracles with Probabilistic Output."
