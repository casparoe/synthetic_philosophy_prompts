prompt: |-
  I have been trying to work out what I think about group decision procedures — specifically, when a group should vote on the sub-questions that determine an outcome rather than voting on the outcome directly. My reactions to a series of cases do not seem to fit any principle I can state, and I would like your help finding one, or learning which of my verdicts I should abandon.

  Here are the cases:

  1. A three-judge appellate panel must rule on a contract dispute. Liability requires both that a valid contract existed and that it was breached. The panel votes directly on the ultimate question: liable or not liable. Judge A votes liable; Judges B and C vote not liable. The court finds no liability, 2–1. Verdict: unproblematic.

  2. Same panel, same legal question, but this time each judge votes separately on the two premises, and the court's conclusion is determined by whether each premise commands a majority. The judges' views are: Judge A — contract yes, breach yes (so would vote liable); Judge B — contract yes, breach no (so would vote not liable); Judge C — contract no, breach yes (so would vote not liable). On the premise votes, "contract existed" passes 2–1 (A and B), and "breach occurred" passes 2–1 (A and C). The court therefore finds both premises true and enters a judgment of liability. But Judges B and C, a majority of the panel, would each vote not liable if asked directly. The procedure has produced an outcome that a majority of the panel rejects. Verdict: this procedure is defective. A group decision procedure should not generate a conclusion that a majority of the group would reject if voting on the conclusion directly.

  3. A five-member university tenure committee must decide on a candidate. The rules require a majority finding of excellence in each of research, teaching, and service; the candidate receives tenure only if all three thresholds are met. The committee votes on each area separately. The votes come out: research 4–1, teaching 3–2, service 3–2. The candidate receives tenure. Verdict: unproblematic. This is premise-by-premise voting, yet I feel none of the unease I felt in case 2.

  4. A jury in a criminal trial must decide guilt, which requires proof beyond reasonable doubt of both actus reus and mens rea. The judge instructs the jury to deliberate on each element separately and to convict only if they find both elements proven. The jury finds actus reus proven 10–2 and mens rea proven 10–2, and returns a guilty verdict. Verdict: unproblematic — indeed, this seems like the right way for a jury to proceed. Structurally it resembles case 2, but I cannot bring myself to condemn it.

  5. A three-member ethics committee must decide whether to approve a study. The rules require majority approval on each of three criteria — minimal risk, valid consent, and scientific merit — and all three must pass. The members vote as follows:
  - Member 1: risk yes, consent yes, merit no → would vote to reject
  - Member 2: risk yes, consent no, merit yes → would vote to reject
  - Member 3: risk no, consent yes, merit yes → would vote to reject
  On the premise votes, risk passes 2–1, consent passes 2–1, and merit passes 2–1. The study is approved. But every single member would vote to reject the study if voting on the conclusion directly. The procedure has produced an outcome that is unanimously opposed. Verdict: this is even worse than case 2. The procedure is clearly defective — indeed, absurd.

  6. A five-member appointments committee must decide whether to hire a candidate. The rules require a majority on each of two criteria: qualifications and interview performance. The committee uses premise-by-premise voting. The votes are:
  - Members 1 and 2: qualifications yes, interview yes → would vote to hire
  - Member 3: qualifications yes, interview no → would vote not to hire
  - Members 4 and 5: qualifications no, interview yes → would vote not to hire
  Qualifications pass 3–2; interview passes 4–1. The candidate is hired. But Members 3, 4, and 5 — a majority — would each vote not to hire if asked directly. Verdict: this bothers me, and it seems structurally identical to case 2. Yet my reaction is slightly milder here than in case 2, and I am not sure why. Perhaps because the two premises feel more like genuinely separate judgments — qualifications versus interview performance — than the two premises in the contract case, which both feed into a single legal conclusion in a tighter way. But I am not confident this distinction holds up.

  What I am after is a principle that tells me when premise-by-premise voting is acceptable and when it is not — one that explains why I accept it for the tenure committee and the jury, reject it for the appellate panel and the ethics committee, and feel an intermediate unease about the appointments committee. Is there a single principle that captures all six verdicts? If not, which should I revise, and what does the best available principle predict about a case I have not considered: a three-person committee choosing a conference venue, where the choice is determined by majority votes on affordability, accessibility, and capacity, and the members' preferences are such that the premise-by-premise procedure selects a venue that no single member actually wants?
reasoning: |-
  Okay, let me try to figure out what's going on with this user's dilemma about group decision-making. They've presented six different scenarios where groups vote either on the final outcome directly or on the premises that lead to that outcome. Their reactions to these scenarios vary, and they're struggling to find a consistent principle that explains all their judgments. 

  First, I notice that the user is clearly someone who thinks deeply about systems and fairness—probably with a legal, academic, or philosophical background. The examples involve judges, tenure committees, juries, ethics boards, and hiring panels, so they're likely dealing with real-world decision-making structures. Their frustration is palpable: they've tried to find a unifying principle but can't, and they're worried their intuitions might be inconsistent. 

  Looking at their verdicts: 
  - Case 1 (direct vote on liability) is fine. 
  - Case 2 (premise voting leading to liability against majority's direct vote) is bad. 
  - Case 3 (tenure voting) is fine despite premise voting. 
  - Case 4 (jury) is fine and even ideal. 
  - Case 5 (ethics committee) is "absurd" because unanimous opposition is overruled. 
  - Case 6 (hiring) is bothersome but less than case 2. 

  Hmm. The tension is obvious: why is premise voting okay for tenure/jury but not for the appellate panel/ethics committee? The user hints at a possible distinction—whether premises feel "genuinely separate"—but doubts it holds up. They're right to doubt; that feels subjective. 

  Let me dig deeper. What's fundamentally different about the tenure/jury cases? In tenure, research/teaching/service are independent criteria; no one expects a member who rejects one to automatically reject the outcome. The jury is similar—actus reus and mens rea are distinct elements. But in the contract case (case 2), "contract exists" and "breach occurred" feel like joint necessities for a single conclusion. The ethics case (5) is even starker: each member has a *different* reason for rejection, but premise voting bypasses all objections. 

  Ah! Maybe it's about whether the premises are *logically independent* vs. *interdependent in members' judgments*. In tenure/jury, members can support one premise without caring about others; in contract/ethics, their "no" on the outcome ties directly to their "no" on at least one premise. But that doesn't fully explain case 6 (hiring), where qualifications and interview seem separate yet the user feels uneasy. 

  Wait—case 6 is identical to case 2 structurally, but the user finds it *less* problematic. Why? Their own guess ("premises feel more separate") might be onto something. Qualifications are about the candidate's past, interview about present performance—more modular than contract/breach, which are legally fused. But is that principled enough? Maybe not. 

  Another angle: perhaps it's about *default outcomes*. In criminal law (case 4), acquittal is the default; premise voting protects the accused by requiring unanimity (or near-unanimity) on *each* element. In tenure (case 3), rejection is the default; requiring majority on each criterion raises the bar. But in the ethics case (5), premise voting *lowers* the bar—approval sneaks through despite everyone objecting. That’s perverse. 

  The user’s core worry seems to be: *when does premise voting distort the group’s true preference?* Their intuition rejects outcomes that contradict a direct majority vote (cases 2, 5, 6). But why accept it for tenure/jury? Because in those contexts, premise voting aligns with the *purpose* of the decision: ensuring minimum standards are met across the board. For juries, it safeguards rights; for tenure, it ensures no weak area. In contract disputes, though, the point is holistic judgment—hence direct voting feels more natural. 

  So the principle might be: **Premise-by-premise voting is defensible when the premises represent independent dimensions of evaluation that all must be satisfied, and when the procedure’s structure (e.g., supermajority requirements) aligns with the stakes (e.g., false positives vs. false negatives).** This explains: 
  - Tenure/jury: Independent dimensions, high stakes for missing one. 
  - Ethics committee: Independent dimensions, but the outcome violates unanimous opposition—unacceptable because no one endorses the whole package. 
  - Appellate panel: Premises aren’t treated as independent dimensions; legal liability is a unified judgment. 
  - Hiring (case 6): Unease because while dimensions seem independent, the outcome still overrules a majority—suggesting direct voting might be better unless dimensions are truly orthogonal. 

  For the unasked conference venue case: if affordability/accessibility/capacity are independent must-haves, premise voting could select a venue no one loves but all minimally accept. If members have trade-offs (e.g., "I’ll tolerate low capacity if it’s affordable"), premise voting might force a "Frankenstein venue" that satisfies each criterion but pleases no one—risky unless the goal is strict minimum thresholds. 

  The user might need to refine their intuition for case 6. If qualifications and interview are truly separate (like research/teaching), premise voting should be fine—but their unease suggests they sense hidden interdependencies. Alternatively, they might decide that *any* premise voting producing a majority-opposed outcome is flawed, making cases 2, 5, and 6 equally wrong. But that would reject the tenure/jury approaches, which they (and I) find sensible. Tough call! 

  In sum: the best principle balances logical structure, decision purpose, and error-cost asymmetry. The user’s verdicts are mostly defensible if we view premise voting as a tool for enforcing comprehensive adequacy—not for capturing holistic preferences. Cases where it "works" (tenure/jury) prioritize avoiding bad approvals (e.g., unqualified tenure) over pleasing majorities. Cases where it fails (ethics) prioritize nothing and override everyone. The appellate/hiring cases fall in the gray zone—premise voting might be technically misapplied there.
answer: |-
  Your intuitions reveal a deep tension between **procedural fairness** and **logical coherence** in group decisions. The key principle that explains your pattern of verdicts is:

  **Premise-by-premise voting is defensible when the premises represent *independent dimensions of evaluation* that all must be satisfied (conjunctive structure), and when the decision context prioritizes *defensive exclusion* (avoiding false positives) over *holistic endorsement*. It becomes problematic when the premises are interdependent or when the procedure manufactures artificial support for an outcome that lacks genuine constituency.**

  Here's how this principle resolves all cases:

  ---

  ### **Case Analyses**
  1. **Appellate Panel (Direct Vote)**  
     ✅ **Unproblematic**: Direct voting accurately reflects majority will.  
     *Principle Applied*: Baseline for comparison.

  2. **Appellate Panel (Premise Voting)**  
     ❌ **Defective**:  
     - Premises (contract/breach) are **interdependent legal elements** forming a single conclusion.  
     - Outcome lacks *any* holistic supporter (Judge A supports liability but disagrees with the *process*).  
     - Violates the **"no manufactured outcomes"** corollary: The result wasn't endorsed by any member's reasoning path.

  3. **Tenure Committee**  
     ✅ **Unproblematic**:  
     - Premises (research/teaching/service) are **independent dimensions**.  
     - Context prioritizes **defensive exclusion** (avoiding tenure if deficient in *any* area).  
     - 3–2 votes signal broad (if not unanimous) acceptance on each criterion.

  4. **Jury**  
     ✅ **Unproblematic**:  
     - Premises (actus reus/mens rea) are **independent legal elements**.  
     - Procedure protects the accused (**false positives costlier than false negatives**).  
     - 10–2 votes indicate near-consensus on each element, satisfying "beyond reasonable doubt."

  5. **Ethics Committee**  
     ❌ **Absurd**:  
     - Outcome **lacks holistic support** (unanimous rejection).  
     - **No defensive justification**: Approval despite universal opposition maximizes false positives.  
     - Reveals premise voting's vulnerability to **fragmented majorities**.

  6. **Appointments Committee**  
     ⚠️ **Mildly Problematic**:  
     - Premises (qualifications/interview) *feel* independent, but the outcome contradicts majority will.  
     - Your unease stems from **ambiguous independence**: If interview performance is seen as contingent on qualifications (e.g., a poorly qualified candidate "performs well" superficially), premises aren't truly orthogonal.  

  ---

  ### **The Core Principle**
  Your verdicts align with this rule:  
  > **Premise-by-premise voting is legitimate when:**  
  > (a) Premises are **non-negotiable, independent requirements**;  
  > (b) The context demands **high confidence in each premise**; and  
  > (c) The procedure **doesn't create outcomes opposed by all/most members**.

  **Why tenure/jury pass but appellate/ethics fail?**  
  - Tenure/jury: Independent criteria + defensive logic (e.g., "Don't convict if *any* element is dubious").  
  - Appellate/ethics: Premises are facets of a unified judgment. Premise voting here allows **procedural arbitrage**, overriding holistic preferences.

  **Why case 6 feels intermediate?**  
  Qualifications and interview *could* be independent (e.g., stellar credentials but poor communication). But if members view them as linked (e.g., "good interview can't redeem bad qualifications"), the independence collapses. Your intuition detects this ambiguity.

  ---

  ### **Conference Venue Test Case**
  Apply the principle to your proposed scenario:  
  > *Three people vote on affordability (A), accessibility (B), capacity (C). Premise-wise, all pass 2–1, but no member supports all three.*

  - **Verdict by Principle**: ❌ **Defective procedure**.  
    - **Why?** The outcome lacks a **holistic supporter**. Every member rejects the venue.  
    - **No defensive justification**: Selecting a venue nobody wants is irrational.  
    - **Better approach**: Use approval voting ("Select all venues meeting your thresholds") or ranked choice to find a compromise.

  ---

  ### **Recommendations**
  1. **Abandon the ethics committee verdict?** → **No.** Your rejection is correct. Unanimous opposition overriding is indefensible.  
  2. **Revise the appointments verdict?** → **Strengthen to "defective."** If a majority opposes hiring, premise voting shouldn’t override without strong justification (e.g., regulatory mandates).  
  3. **Accept jury/tenure?** → **Yes.** Their premise-based logic serves a protective purpose.  

  **When to Use Premise-by-Premise Voting**  
  | **Context**                     | **Acceptable?** | **Why**                                                                 |
  |---------------------------------|-----------------|-------------------------------------------------------------------------|
  | Safety/compliance standards     | ✅              | Avoids catastrophic failures (e.g., "Is each bolt securely fastened?") |
  | Holistic judgments (e.g., guilt)| ❌              | Risks fragmenting unified intent                                       |
  | Multi-dimensional merit (e.g., tenure) | ✅       | Ensures minimum thresholds are met                                     |
  | Subjective trade-offs (e.g., hiring) | ❌          | May ignore preference intensity or interdependencies                   |

  This principle preserves your intuitive verdicts while providing a test for new cases: **Premise voting thrives in "checklist" contexts but fails in "gestalt" judgments.** The unease in case 6 arises because hiring sits on the borderline—if qualifications and interview are truly independent, premise voting *could* be justified, but only if the goal is to avoid hiring candidates failing *any* hard criterion, not to find the best overall fit.
