prompt: |-
  Odd request, sorry, but you're the only person I know who won't just tell me what I want to hear.

  Quick context: I'm a backend engineer at a regional hospital network. I do infra, I've never taken a philosphy class, and somehow I ended up on our security steering committee — seven people who mostly rubber-stamp whatever the CISO brings us. We got hit with ransomware in March. The board approved a payment through our cyber insurer, about $400k, and we were offline for nine days. Nobody died, but apparently it was close on the ICU side.

  At our next meeting (Tuesday after next) we have to pick our formal ransom policy, and I'm the one stuck writing the memo. Three options:

  1. The CISO's: publicly adopt an unconditional "we do not pay, ever" policy. Her argument is that the policy is only worth anything if attackers beleive we'd actually refuse, and that belief is about what we'd do, not about what we say.
  2. The CFO's: adopt nothing, and buy the $60k/year "ransom reimbursement" cover the broker is pushing — it pays us back if we do end up paying.
  3. The chair's, which is the one I can't get out of my head. He says we don't actually have to follow the policy. We just have to genuinely intend it now, collect the deterrence, and if we ever get hit we can pay anyway and eat the embarrassment. Nobody audits intentions.

  The CISO says 3 is incoherent (you can't intend to do something you're basically sure you won't do) and that 2 is worse than nothing, because buying reimbursement cover is basically announcing that we'll pay. She also insists option 1 has to hold even when refusing to pay means a patient dies waiting for a system to come back up, and our chief medical officer says she'll resign before she signs that.

  Can you write the memo I'll put in the packet? Pick one of the options, or a modified version, say why, give a concrete next step with a date, and be straight about the strongest objection to what you're recommending instead of brushing it off. Under 500 words, and put the recommendation in the first two sentences, because half the committee reads only the first paragraph. Plain english please, I don't know the jargon.
reasoning: |-
  Okay, the user is a backend engineer at a hospital who got roped into a security steering committee. They need help drafting a memo about ransom policy after a serious ransomware attack. Let me unpack this carefully.

  First, the emotional context feels heavy - they mention "nobody died but it was close" in ICU, and now they're stuck mediating between powerful stakeholders. The phrase "you're the only person who won't tell me what I want to hear" suggests they value brutal honesty over platitudes. Professional stress radiates from this request - infra engineer suddenly writing board-level policy, zero philosophy background, looming deadline.

  Three options on the table:
  - CISO wants absolute "never pay" for deterrence, even if patients die
  - CFO prefers buying ransom reimbursement insurance
  - Chair proposes deceptive policy ("intend" not to pay but secretly would)

  The user seems troubled by the chair's morally ambiguous option but can't shake it. Medical ethics loom large - CMO threatening resignation over absolute no-pay policy is a nuclear red flag. 

  Key constraints emerge:
  - Must pick/recommend one approach in memo
  - First two sentences need the verdict
  - Under 500 words, plain English
  - Must address strongest counterargument head-on
  - Half the committee only reads first paragraph

  Professionally, this is less about cybersecurity theory and more about institutional decision-making under crisis conditions. The hospital's unique vulnerability matters - unlike retailers or banks, patient lives literally depend on system availability. The $400k payment precedent sets a dangerous expectation with attackers too.

  The chair's option 3 is ethically fraught. If discovered, it could destroy institutional trust and invite regulatory hell. But deterrence theory isn't wrong - paying does make you a target. Still, the CMO's resignation threat isn't posturing; clinicians will rightly choose life over policy every time. 

  Option 2's insurance might seem pragmatic, but the CISO's point about signaling is valid - buying coverage screams "soft target." Premiums could skyrocket after claim too. 

  Option 1's absolutism fails the reality test when life support systems blink off. No clinician would obey that policy during coding events.

  So where's the middle ground? The solution needs to:
  - Preserve deterrence value
  - Allow life-saving exceptions
  - Avoid signaling weakness
  - Maintain clinician buy-in

  Ah - the modified option 1 with "life-critical systems" carve-out satisfies all stakeholders. It's defensible to attackers (we won't pay... unless you threaten lives), keeps CMO onboard, and lets CISO claim principled stance. The key is making the exception narrow and scary enough that attackers can't easily trigger it. 

  Biggest risk? Attackers might target ICUs first to activate the exception clause. That's why the "nuclear option" language matters - we're saying this exception is so catastrophic that attackers won't survive the legal fallout either. 

  For the memo structure: lead with recommendation, explain modified policy, address counterarguments clinically. The "intentional ambiguity" phrasing subtly rejects the chair's deception while acknowledging real-world complexity. CFO's insurance gets dismissed as counterproductive signaling - which it is.

  Final polish: stripped all jargon, kept sentences shorter than hospital corridors, made first paragraph self-contained. The "strongest objection" section preempts inevitable CISO pushback about slippery slopes. 

  This should give the user what they actually need: a defensible path forward that won't get vetoed by medical staff or leave them ethically compromised. The chair might grumble about lack of deception, but daylight is the best disinfectant here.
answer: |-
  **TO:** Security Steering Committee  
  **FROM:** [Your Name], Backend Engineering  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Ransomware Policy & Next Steps  
  **RECOMMENDATION:** **Adopt Option 1 (Unconditional "Do Not Pay") with a narrowly defined, pre-approved exception for imminent loss of life.** Finalize the policy draft by [Date + 5 Days] for Tuesday’s vote.  

  **Why This Approach:**  
  1.  **Deterrence Works Only If Credible:** Attackers target hospitals *expecting* payment. A public "never pay" stance (Option 1) makes us a harder target *if* believed. Option 3 (fake intent) is unsustainable; if attackers suspect we’d pay when lives are at stake (which we would), deterrence fails. Option 2 (reimbursement insurance) signals we *will* pay, inviting more attacks.  
  2.  **The Life Exception Is Non-Negotiable & Must Be Defined NOW:** Clinicians *will* override any policy risking immediate patient death. Refusing to acknowledge this (as the pure Option 1 does) is unrealistic and risks the CMO's resignation. However, the exception must be:  
      *   **Extremely Narrow:** Only triggered by *imminent, directly verifiable, life-threatening system unavailability* (e.g., life support, critical med delivery in ICU).  
      *   **Pre-Authorized:** Requires documented, real-time concurrence from the CMO (or designated clinical lead), CISO, and CEO *during the incident*.  
      *   **Rare & Costly:** Frame this internally/externally not as "sometimes we pay," but as a "nuclear option" with massive consequences (legal, regulatory, reputational) for the attackers *and* us.  

  **Strongest Objection & Response:**  
  *   **Objection:** "Adding an exception destroys deterrence. Attackers will target critical systems first, knowing we might pay."  
  *   **Response:** This is a valid risk. However:  
      1.  Attackers *already* target critical systems precisely because they know lives are at stake and hope to pressure payment. Our pure public stance still discourages opportunistic attacks.  
      2.  The narrowness, high bar for authorization, and severe consequences (for us and them) make triggering the exception difficult and unattractive *even for attackers*. It’s a failsafe, not a loophole.  
      3.  The alternative (no credible public stance or signaling we’ll pay via insurance) guarantees we remain a prime target.  

  **Concrete Next Step:**  
  I will revise the draft "Do Not Pay" policy to include the defined life-critical exception clause and authorization protocol by **[Date + 5 Days - e.g., Next Thursday]**. This draft will be circulated for final committee review 48 hours before our Tuesday meeting.  

  **Why Not the Other Options?**  
  *   **Option 2 (Insurance):** Signals willingness to pay, increasing attack likelihood. Doesn't solve the core ethical dilemma during an incident.  
  *   **Option 3 (False Intent):** Creates internal confusion, is ethically dubious, and will likely leak, destroying credibility and deterrence.  

  This approach balances the CISO's need for credible deterrence with the medical reality that clinicians cannot let patients die over policy. The key is making the exception so narrow and painful that it deters its own use.
