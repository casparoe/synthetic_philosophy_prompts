answer: |-
  Based on your precise description, this pattern aligns closely with **conventions** as defined in philosophy, game theory, and social science—specifically, **coordination conventions** or **Lewis conventions**. Your observations capture their core features elegantly, and I'll map your examples to this framework while clarifying boundaries.

  ### Core Characterization: Lewis Conventions
  David Lewis’s *Convention: A Philosophical Study* (1969) formalizes exactly what you describe:
  1.  **Regularity in Behavior:** Groups follow a pattern (e.g., your error envelope format).
  2.  **Arbitrariness (Could-Have-Been-Otherwise):** Multiple functionally equivalent solutions exist (e.g., different envelope fields or idempotency key placements).
  3.  **Expectation-Sustained:** Individuals adhere primarily because they expect others to adhere, and prefer conformity *because* others conform.
  4.  **Preference for Uniformity:** Unilateral deviation causes friction/cost (e.g., integration effort, review comments), while coordinated change to an alternative would be acceptable.
  5.  **Emergence Without Authority:** The pattern arises from precedent, mutual adjustment, and precedent-based expectations—not decree or necessity.

  ### Mapping to Your Examples
  1.  **Error Response Envelope:**  
      - **Arbitrariness:** Leaner envelopes were technically viable.  
      - **Expectation-Driven:** Teams included the "retry hint" because others did, anticipating future reliance on consistency.  
      - **Deviation Cost:** Omitting it caused friction *despite* technical functionality.  
      - **Emergence:** Early precedent → copied → expectation → lock-in.  

  2.  **Idempotency Keys & Retry Practices:**  
      - **Arbitrariness:** Key placement/format had multiple valid options.  
      - **Expectation-Driven:** Compatibility was sustained by mutual anticipation of others' choices.  
      - **Coordination Benefit:** Adherence avoided costly mismatches.  

  ### Distinguishing from Contrast Cases (Boundaries)
  | **Phenomenon**              | **Key Distinction from Convention**                                  | **Your Boundary Test**                                  |
  | :-------------------------- | :------------------------------------------------------------------- | :------------------------------------------------------ |
  | **Tool-Enforced Uniformity** (e.g., CI formatters) | Compliance is mechanically compelled; expectations are irrelevant.   | If the format were *only* enforced by CI, deviation would be blocked regardless of team expectations. |
  | **Technical Necessity**     | Only one solution works; non-compliance causes functional failure.   | If a specific envelope field were required for parsing, omitting it would break the system—not just cause friction. |
  | **Private Habit**           | No social enforcement; deviation has no coordination cost.           | If an engineer used a different format privately but conformed in shared services, no review comments would arise. |
  | **Deliberate Standard**     | Chosen via authority/vote; sustained by mandate, not mutual expectation. | If an architecture council *mandated* the envelope, compliance would stem from authority—not self-reinforcing expectations. |
  | **Tradition/Custom**        | Often lacks arbitrariness; maintained by inertia/normative pressure. | If the format reflected an industry standard (e.g., HTTP codes), it wouldn’t be "could-have-been-otherwise" *within your context*. |

  ### Edge Cases & Refinements
  1.  **Partial Arbitrariness:**  
      What if 2/10 envelope fields are technically necessary, but 8 are arbitrary?  
      → **Boundary:** The convention applies to the *arbitrary subset*. The pattern persists where expectations, not necessity, drive uniformity.  

  2.  **Overlapping Enforcement:**  
      What if a convention *later* gets codified into a CI check?  
      → **Boundary:** It originated as a convention. The CI check now enforces it, but the *mechanism of persistence* has shifted.  

  3.  **Asymmetric Power:**  
      What if one team’s service is dominant, making their format the de facto standard?  
      → **Boundary:** Still a convention if (a) alternatives were viable, and (b) adoption relies on expectations (e.g., "We use Team A’s format because everyone else does").  

  4.  **Gradual Necessity:**  
      What if tooling evolves to *require* the conventional format (e.g., a library assumes the envelope shape)?  
      → **Boundary:** Initially conventional, it later acquires technical necessity. The emergence phase is still conventional.  

  ### Proposed Definition
  **Expectation-Sustained Coordination Convention (ESCC):**  
  > A behavioral regularity R within a group, where:  
  > 1. **Arbitrariness:** Multiple functionally equivalent alternatives to R exist.  
  > 2. **Expectation-Driven:** Individuals follow R primarily because they believe others follow/will follow R.  
  > 3. **Preference for Conformity:** Individuals prefer to follow R if others do (due to coordination costs).  
  > 4. **Emergent Persistence:** R arises and stabilizes via precedent, copying, and mutual reinforcement—not authority or necessity.  

  ### Why "Convention" Fits Perfectly
  - **Philosophy:** Lewis’s theory directly models your cases (e.g., driving on the left/right is his paradigmatic example—arbitrary, expectation-driven, costly to deviate).  
  - **Social Science:** Elinor Ostrom’s work on self-governing commons shows similar emergent rules.  
  - **Tech Relevance:** Network effects, path dependence, and focal points (Schelling) explain lock-in.  

  Your pattern is a textbook convention. Its power lies in resolving coordination problems where technical constraints underdetermine practice, and social expectations fill the gap. This is why RFCs often standardize *after* conventions emerge organically.
