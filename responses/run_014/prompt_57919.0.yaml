prompt: |-
  I serve as the compliance lead for a university office that reviews undergraduate-led field experiments in behavioral economics and public health outreach, roughly fifteen to twenty proposals per month during term, most low-risk but involving adult members of the public approached in markets, clinics, and transit hubs. Reviews must be completed within forty-five minutes by staff with basic research-ethics training but no background in philosophy, with only flagged cases escalated to me for full review, and our concern is less legal liability than whether participants have genuinely given valid consent.

  Please translate the philosophical work on what makes consent valid into a stepwise procedure my reviewers can actually follow, ordered as questions to ask with criteria for what counts as a passing answer, clear stop points that yield a requirement to revise and resubmit, and explicit markers for points where factual checking ends and a value judgment by a person is required. The procedure must handle three recurring difficulties separately rather than collapsing them into a general sense of voluntariness: deception understood to include outright false statements, technically true but misleading framing, and material omissions about purpose, risks, or downstream uses of data; pressure understood to include explicit threats, offers of payment or services that may be difficult for poorer participants to refuse, and reliance on authority or institutional trust; and competence understood to include age-related thresholds, temporary impairment or low literacy, and fluctuating understanding during extended interactions.

  Illustrate the procedure by applying it to three invented proposals currently before us: a door-to-door survey on household budgeting that withholds that responses will be used to train a credit-scoring model; a paid forty-minute interview on vaccine hesitancy offering a grocery voucher worth roughly a day's wage in the neighborhood where recruitment occurs, conducted by staff wearing local clinic uniforms; and a longitudinal text-message study of medication adherence enrolling sixteen- to nineteen-year-olds with mixed literacy levels. Include in the illustration at least one verdict my student investigators are likely to find frustratingly strict, explain why the procedure requires it, and conclude with a brief account of what the procedure cannot settle and where reviewers should expect it to misfire if applied mechanically.
reasoning: |-
  Okay, the user is a compliance lead at a university office reviewing undergraduate field experiments in behavioral economics and public health. They handle 15-20 proposals monthly, mostly low-risk but involving public participants in places like markets and clinics. Reviews need to be quick—45 minutes max—by staff with basic ethics training but no philosophy background. Only flagged cases go to the user. The main concern is ensuring valid consent, not legal liability.

  The user wants a stepwise procedure translating philosophical consent concepts into practical questions. The procedure must cover three specific issues separately: deception (false statements, misleading framing, omissions), pressure (threats, hard-to-refuse incentives, authority reliance), and competence (age, impairment, literacy, fluctuating understanding). Each should have clear pass/fail criteria, stop points for revisions, and markers where value judgments are needed.

  They also want examples applying this to three fictional proposals: a household survey hiding its use for credit scoring, a vaccine hesitancy interview with high-value vouchers in clinic uniforms, and a medication adherence study via text with teens of mixed literacy. One verdict should be frustratingly strict to illustrate necessity. Finally, note the procedure’s limits and where mechanical application fails.

  First, I need to break down philosophical consent validity (autonomy, understanding, voluntariness) into actionable steps. Key thinkers like Beauchamp & Childress or Faden et al. emphasize disclosure, comprehension, competence, and voluntariness. But the user wants to avoid collapsing issues—so deception, pressure, and competence must be distinct sections.

  For deception: I’ll structure questions about purpose transparency, risk disclosure, and data use honesty. Misleading framing and omissions need specific scrutiny. Passing means no material deception; failure requires revision if disclosure is incomplete.

  Pressure needs to handle undue influence. Payment thresholds are tricky—I’ll suggest comparing incentives to local daily wages. Authority figures (like clinic uniforms) risk implicit coercion. Criteria should flag offers that are "difficult to refuse" objectively, though judgment calls are needed.

  Competence involves assessing capacity dynamically. Age is clear (<18 fails), but literacy and fluctuating understanding require plans like simplified materials or verbal checks. Proposals must adapt to real-time comprehension drops.

  Now, the stepwise design: Each section (Deception, Pressure, Competence) as a standalone module. Questions with binary checks or judgment markers (⭐). Stop points for immediate revisions (e.g., omission of material risks). Value judgments highlighted so staff know when to pause and think or escalate.

  For examples: 
  1. **Household survey**: Fails deception because hiding credit-scoring use is a material omission. Students might find this strict, but valid consent requires transparency about data repurposing. 
  2. **Vaccine interview**: High-value vouchers in a poor area + clinic uniforms create pressure. Judgment needed on whether refusal is "difficult." Likely requires revision (e.g., lower payment, neutral attire). 
  3. **Text study with teens**: Competence issues—literacy variability and fluctuating attention. Must include verification steps and re-consent options. Age 16-19 is okay if not minors, but plans for dropouts matter.

  The strict verdict? Probably rejecting the survey over credit-scoring omission. Students might argue "it doesn’t harm," but philosophy stresses autonomy—people deserve to know how data affects them (e.g., credit opportunities).

  Limitations: The procedure can’t resolve all contextual nuances (e.g., cultural power dynamics) or novel dilemmas. Mechanical application fails when incentives sit in gray zones or when comprehension barriers aren’t obvious. Staff must be trained to spot these and escalate.

  Finally, I’ll structure the response with a clear procedure table, then apply it to each proposal, and end with limitations. Keeping language plain and actionable—no jargon. This should balance rigor with feasibility for time-pressed reviewers.
answer: |-
  Here’s a stepwise consent validity procedure addressing your core challenges, designed for efficiency and clarity. It separates deception, pressure, and competence into distinct modules. Each module contains **threshold questions** (fact-driven, binary pass/fail), **judgment markers** (⭐ requiring human evaluation), and **stop points** (mandating revision/resubmission).

  ---

  ### **Consent Validity Review Procedure**
  **Reviewer Goal:** Confirm participants can make a genuinely autonomous, informed choice to participate.  
  **Time Allocation:** 5 min/deception, 5 min/pressure, 5 min/competence (15 min total per proposal).  
  **Flow:** Proceed sequentially. Failure at any stop point = "Revise & Resubmit." Judgment markers may require escalation.

  #### **I. DECEPTION MODULE**  
  *Focus: Truthfulness and completeness of information.*  
  **Threshold Questions:**  
  1. **Purpose Transparency:** Does the proposal explicitly state the study’s true purpose in the consent script?  
     *Pass:* Purpose is accurately stated (e.g., "study household spending habits").  
     *Stop Point:* Purpose is falsified (e.g., "government census") → **Revise.**  
  2. **Risk Disclosure:** Are all reasonably foreseeable risks (physical, psychological, reputational, privacy) disclosed?  
     *Pass:* Risks like data breach, emotional discomfort, or time burden are listed.  
     *Stop Point:* Material risk omitted (e.g., phishing vulnerability in a data-collection app) → **Revise.**  
  3. **Data Use Clarity:** Is it clear how data will be used *beyond the immediate study*?  
     *Pass:* Explicit mention of secondary uses (e.g., "data may train AI tools" or "archived for future research").  
     *Stop Point:* Secondary use is hidden → **Revise.**  

  **Judgment Marker (⭐):**  
  - ⭐ **Misleading Framing/Omission Check:** Even if technically true, could the consent language *reasonably mislead* a typical participant about risks/purpose?  
    *Criteria:* Would omission/framing likely alter a decision? (e.g., calling a credit-scoring model "academic research").  
    *Outcome:* If ⭐ = "yes," escalate for full review.  

  #### **II. PRESSURE MODULE**  
  *Focus: Absence of coercion/undue influence.*  
  **Threshold Questions:**  
  1. **Explicit Threats:** Does the proposal forbid explicit penalties for non-participation (e.g., "clinic access denied if you refuse")?  
     *Pass:* No threats described.  
     *Stop Point:* Threat described → **Revise.**  
  2. **Payment Scale:** Is compensation ≤ 1 hour of local minimum wage *or* justified as reimbursement (e.g., bus fare)?  
     *Pass:* Voucher ≤ $15 in a $15/hr min-wage area.  
     *Stop Point:* Compensation ≥ 1 day’s local wage (e.g., $120 voucher in a poor neighborhood) → **Revise.**  

  **Judgment Marker (⭐):**  
  - ⭐ **Contextual Coercion Check:** Could payment, location, or recruiter role make refusal *objectively difficult* for the target group?  
    *Criteria:* Would a vulnerable person (e.g., low-income, clinic patient) feel unable to say no? (e.g., recruitment at a soup kitchen).  
    *Outcome:* If ⭐ = "yes," escalate or require mitigation (e.g., lower payment, neutral recruitment setting).  

  #### **III. COMPETENCE MODULE**  
  *Focus: Capacity to understand and decide.*  
  **Threshold Questions:**  
  1. **Age Threshold:** Are all participants ≥18? If ≤17, is parental consent obtained?  
     *Pass:* All ≥18 *or* minors with documented parental consent.  
     *Stop Point:* Minor (≤17) without parental consent → **Revise.**  
  2. **Literacy Accommodation:** If recruiting low-literacy groups, does the proposal offer verbal consent scripts?  
     *Pass:* Verbal script + signature waiver exists (e.g., "I agree" audio recording).  
     *Stop Point:* Written-only consent for a low-literacy cohort → **Revise.**  

  **Judgment Marker (⭐):**  
  - ⭐ **Dynamic Understanding Plan:** For complex/longitudinal studies, how will comprehension be verified *during* the study?  
    *Criteria:* Plan to re-check consent after deception is revealed, at intervals, or if risks change.  
    *Outcome:* If no plan exists for at-risk cohorts → **Revise** (e.g., add "comprehension checkpoints").  

  ---

  ### **Applied to Example Proposals**
  #### **Proposal 1: Door-to-Door Household Budget Survey**  
  - **Deception:**  
    - ❗ *Stop Point @ Data Use Clarity:* "Responses train a credit-scoring model" omitted → **Revise.**  
    - ⭐ *Misleading Framing:* Calling it "academic research" without disclosing commercial application is materially deceptive.  
  - **Pressure:** Pass (no payment, no threats).  
  - **Competence:** Pass (adults, written consent acceptable).  
  **Verdict:** **Revise & Resubmit** due to omission.  
  *Why frustrating?* Students may argue "the model is for research," but participants must know data could affect credit access. Philosophy demands transparency for *meaningful choice* (Nuremberg Code, Principle 1).

  #### **Proposal 2: Paid Vaccine Hesitancy Interview (Clinic Uniforms)**  
  - **Deception:** Pass (purpose/risks clear).  
  - **Pressure:**  
    - ❗ *Stop Point @ Payment Scale:* Voucher = 1 day’s wage → **Revise** (reduce to ≤1 hour’s wage).  
    - ⭐ *Contextual Coercion:* Clinic uniforms imply institutional authority + high payment in a poor area → **Revise** (use plain clothes, lower payment).  
  - **Competence:** Pass (adults, verbal script optional).  
  **Verdict:** **Revise & Resubmit** due to undue inducement and authority pressure.

  #### **Proposal 3: Text-Message Medication Adherence Study (Teens 16–19)**  
  - **Deception:** Pass (purpose/risks disclosed).  
  - **Pressure:** Pass (minimal compensation).  
  - **Competence:**  
    - ❗ *Stop Point @ Age Threshold:* 16- to 17-year-olds → **Revise** (add parental consent).  
    - ⭐ *Dynamic Understanding:* Mixed literacy + longitudinal design → **Require** verbal consent checks at enrollment and monthly comprehension reassessments.  
  **Verdict:** **Revise & Resubmit** for parental consent and dynamic checks.

  ---

  ### **Limitations & Where Mechanics Fail**  
  1. **Gray-Area Judgments:**  
     - The procedure cannot resolve ambiguous cases (e.g., whether $25 is "undue inducement" in a middle-class neighborhood). Reviewers must escalate these.  
  2. **Cultural Context:**  
     - "Authority pressure" may misfire if applied mechanically (e.g., clinic uniforms in a distrustful community may *reduce* coercion). Contextual ⭐ markers require cultural awareness.  
  3. **Fluid Competence:**  
     - Real-time comprehension lapses (e.g., dementia patients in public spaces) need *in situ* reviewer discretion—no procedure can pre-script all scenarios.  
  4. **Emergent Risks:**  
     - Unforeseen downstream data uses (e.g., policy decisions harming participants) are unavoidable. Mitigation: require broad data-use disclosures.  

  **Conclusion:** This procedure operationalizes consent as *procedural fairness*—prioritizing transparency, anti-coercion, and capacity support. It catches material violations efficiently but demands human judgment at ⭐ markers. Its strictest outputs (e.g., rejecting hidden data repurposing) uphold the philosophical core of consent: respect for persons as ends in themselves (Kant), not merely risk management.
