answer: |-
  **Final credence: 35% probability that accepting the simulation argument lowers far-future EV by ≥20% relative to near-term work.**

  ### Reasoning decomposition:
  1.  **Credence we're in a simulation (`P_sim`): 35%**  
      Bostrom's trilemma suggests if posthuman civs run significant ancestor sims, we're likely in one; uncertainty about whether such civs *choose* to run vast sims caps this well below 50%.
  2.  **Conditional on being in a sim, P(sim ends before "long future") (`P_short | sim`): 70%**  
      Simulators likely prioritize efficiency or specific historical periods; simulating millennia of post-singularity futures is computationally extravagant and motivationally suspect.
  3.  **Moral weight of sim people vs. basement reality (`Moral_weight`): 100%**  
      If consciousness is substrate-independent, simulated suffering/fulfillment has equal moral significance; discounting sims implies our *current* experiences matter less if we're sims, which is ethically inconsistent without a privileged "basement" ontology.
  4.  **Does accepting the argument lower extinction risk credence? (`Extinction_update`): 0% reduction**  
      The trilemma's first horn *is* extinction, but the argument being "live" only requires we reject *certainty* of extinction pre-simulation; our baseline P(extinction) already reflects this possibility, so minimal update.
  5.  **Amplification effect from sim-running civs existing (`P_amp`): +5% EV offset**  
      Accepting the argument implies some civs survive to run sims, slightly lowering perceived near-term extinction risk. However, this is small: sim-running civs could be rare, and their existence doesn't directly boost *our* future's scale if we're in their sim.

  ### Combining terms:
  -   **EV reduction from sim cap:** `P_sim * P_short | sim = 0.35 * 0.70 = 0.245` (24.5% direct reduction).
  -   **Net effect:** Base reduction (24.5%) minus amplification offset (5%) → **~19.5% average reduction** in far-future EV weighting.
  -   **Probability this reduction ≥20%:** Requires `P_short | sim` >70% or `P_sim` >35%. Given distributions, **35% chance reduction hits/exceeds 20%**.

  ### Sensitivity & what would move it:
  -   **Most sensitive term:** `P_short | sim` (Conditional probability sim ends early).  
  -   **What would move it:** Empirical evidence or strong argument that simulators *routinely* run long-duration, detailed futures (e.g., observing physical laws allowing cheap long-term sims, or simulator psychology studies showing intrinsic interest in future emulations). Increasing `P_short | sim` to **85%** would make the expected reduction ≥20% likely (>65% chance). Conversely, evidence sims are short by design (e.g., artifacts suggesting time caps) would solidify the reduction.
