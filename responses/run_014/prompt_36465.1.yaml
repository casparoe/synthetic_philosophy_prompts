prompt: |-
  Under most endangered-species legislation, the protected unit is the species, and the following pattern is typical. First, protection tracks current taxonomy: when a review committee splits a widespread coastal bird into three species, two of the new species are instantly rare and eligible for listing, and funding follows the change in classification without any change in the field; when the committee later lumps them back together, the protection lapses although not a single animal has died. Second, hybrids receive nothing: an animal descended partly from a protected wild canid and partly from a common one is excluded from the captive-breeding programme and, in some schemes, culled — not for any defect in the individual animal, but purely because of its mixed ancestry. Reconstruct the implicit view of what a species is that these two rules rest on. Does the pattern presuppose that species are natural kinds with essences, so that cross-breeding is a kind of dilution or pollution, or is it equally at home with the view that species are lineages or populations rather than classes, or with outright pluralism about species concepts? Distinguish what the practice strictly requires from what it merely fits well with, and identify where it is philosophically underdetermined — that is, which rival accounts of the species problem would license exactly the same two rules. Finally, say what concretely would have to change in either rule if the unit of protection were populations or lineages rather than species.

  Please answer in British English, as exactly five numbered items of a sentence or two each, with no introduction or conclusion — for instance: one item stating the implicit view of species, one on the essentialism question, one on what is strictly required rather than merely convenient, one on the rival accounts that would license the same rules, and one on what would change under population- or lineage-based protection.
reasoning: |-
  Hmm, the user wants me to analyze how endangered species legislation treats species classification, specifically focusing on two patterns: how protection changes based on taxonomic revisions (splitting/lumping species) and how hybrids are excluded from protection. They're asking me to reconstruct the implicit view of what a species is that underlies these rules.

  I need to examine whether this presupposes species as natural kinds with essences, where hybridization is seen as pollution, or if it's compatible with other views like lineages or pluralism. The user wants me to distinguish what the practice strictly requires versus what it merely fits well with, identify where it's philosophically underdetermined, and explain what would change if protection were based on populations or lineages instead of species.

  For my response, I must follow a strict format: exactly five numbered items in British English, each consisting of one or two sentences. No introduction or conclusion. The items should cover: 1) the implicit view of species, 2) the essentialism question, 3) what's strictly required versus merely convenient, 4) rival accounts that would license the same rules, and 5) what would change under population or lineage-based protection.

  Looking at the patterns described, the legislation treats species as static categories defined by taxonomic authority. When taxonomists split a species, protection automatically applies to the new "rare" categories, even though nothing biologically changes. Hybrids are excluded purely based on ancestry, suggesting a purity concept. This seems to imply that species are discrete entities with fixed boundaries.

  Regarding essentialism, the hybrid exclusion rule particularly suggests an essentialist view where mixing "dilutes" the pure essence. However, the taxonomy changes show that species definitions are human constructs, not fixed in nature. The practice doesn't strictly require essentialism though - it could also fit with certain lineage concepts that prioritize pure descent.

  The strict requirement is simply that protection follows current taxonomic classifications as defined by authorities. The hybrid exclusion requires that only "pure" representatives count. This is convenient for administration but doesn't necessarily reflect biological realities.

  For rival accounts, both typological essentialism and certain phylogenetic species concepts (that emphasize monophyly and diagnosability) would produce similar outcomes. Monophyly-focused approaches might also exclude hybrids as "impure."

  If protection shifted to populations or lineages, splitting/lumping wouldn't automatically change protection status - field data would matter more. Hybrid exclusion would likely be abandoned in favor of assessing conservation value based on ecological roles or genetic diversity rather than pedigree purity.
answer: |-
  1.  The implicit view is that a species is a discrete, fixed taxonomic category defined by current scientific authority, where membership depends on conforming to a diagnostic type or pure lineage, and hybrids represent a problematic deviation from this pure type.
  2.  The pattern, particularly the exclusion and potential culling of hybrids as "impure", fits well with an essentialist view where species are natural kinds with defining essences that cross-breeding dilutes or pollutes; however, the practice does not strictly require essentialism, as it is also compatible with certain rigidly defined lineage concepts that prioritise "pure" descent.
  3.  The practice strictly requires only that legal protection tracks current authoritative taxonomy and excludes individuals deemed hybrids; what it fits well with, but doesn't strictly require, is the philosophical position that species have fixed essences or that hybridisation is inherently detrimental.
  4.  Rival accounts licensing the same rules include typological essentialism and certain versions of the Phylogenetic Species Concept (emphasising monophyly and diagnosability), as both prioritise discrete, categorically distinct groups defined by traits or ancestry and view hybrids as falling outside the protected category.
  5.  Under population- or lineage-based protection, splitting or lumping by taxonomists would not automatically trigger listing or de-listing; protection would depend on the viability and distinctness of specific populations or evolutionary lineages in the field, and hybrids would likely be evaluated for their conservation role or genetic contribution rather than automatically excluded.
