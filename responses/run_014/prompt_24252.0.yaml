prompt: |-
  I work on the animal-welfare side of a combined fish-and-shellfish aquaculture operation: we run Atlantic salmon in sea pens, rainbow trout in land-based tanks, a prawn pond system, and we process some of our own crustaceans. Our internal welfare panel makes case-by-case calls on which handling and slaughter practices we will permit, and I'd like a second read on where we should land on a new one. One thing to keep in mind: the panel is genuinely split on whether crustaceans are capable of pain, so some of our past calls rest on that question and some deliberately do not.

  Here are the calls the panel has already made. (1) Percussive stunning of salmon immediately before slaughter — approved, because it is fast and the fish is unconscious before it dies. (2) CO2 stunning of salmon — approved but flagged, because it is slower and the fish gasps, and we are not sure whether the gasping is aversive to the fish or just a reflex. (3) Ice-slurry slaughter of trout with no prior stunning — rejected, because the fish stays alert for a long time. (4) Harvest of prawns by draining the pond and netting them, with no stunning — approved, on the view that a crustacean cannot feel pain and the handling is brief. (5) Live transport of lobsters to the processor, where they are then boiled — rejected, because the transport is long and stressful, even if we grant that the boiling itself is quick. (6) Grading of catfish using a bath anesthetic (tricaine) — approved, because the anesthetic keeps the handling stress down.

  The new case: we are evaluating adding farmed crabs, and the proposed kill method would be live boiling — no stunning at any point, and no long transport, because the crabs would be boiled on-site within minutes of harvest. Given the six calls above, what do you think the panel should decide on the crab case? I am less interested in a bare yes or no than in: (a) the rule or rules the panel seems to be running; (b) the other rule(s) that fit all six past calls just as well; (c) which of those rules predict different answers on the crab case, and what each predicts; and (d) which past call is the closest analog to the crab case — and whether that answer depends on which rule you think the panel is running. If the past calls genuinely underdetermine the outcome, say what principle the panel would be adopting if it approves and what principle it would be adopting if it rejects.

  End your reply with a single line in exactly this form:
  Verdict: [approve | reject | approve with conditions] | closest-analog: [1-6] | deciding-rule: [one short phrase]
reasoning: |-
  Okay, the user works in aquaculture welfare and needs help evaluating a new crab slaughter method. They've provided six past decisions and want a structured analysis rather than just a verdict. Interesting challenge - they're clearly trying to build consistent ethical frameworks.

  First I need to unpack those six precedents. The salmon percussive stunning approval (1) seems based on instantaneous unconsciousness. CO2 stunning (2) got approved but with concerns about gasping - that's tricky because they're unsure if it's reflexive or distressing. Trout ice-slurry rejection (3) is clearly about prolonged consciousness during death. The prawn harvest approval (4) hinges entirely on the pain debate - they accepted brief handling assuming no pain. Lobster transport rejection (5) shows they care about cumulative stress even if the terminal act is quick. And the catfish anesthetic case (6) values stress reduction during procedures.

  For the new crab boiling proposal, the key elements are: on-site boiling, no stunning, minutes between harvest and death. The pain question looms large here - if they assume crustaceans feel pain, this looks bad. But if not, it might resemble the prawn case. 

  The precedents suggest two possible ethical frameworks coexisting: one that requires preventing potential suffering regardless of pain-sentience debates, and another that only acts when pain-sentience is established. The lobster transport rejection (5) actually bridges both - they objected to the stress even while granting the boiling might be quick.

  The prawn case (4) is the closest analog physically (crustaceans, brief handling) but philosophically it's the weakest because it dodges the pain question. The lobster case (5) feels more relevant ethically because it shows concern for prolonged distress. If they approve crab boiling, they'd be doubling down on the "no pain" position; if they reject, they'd be extending the lobster-case precautionary principle.

  User seems frustrated by the panel's inconsistency - smart to ask for rule extraction rather than just an opinion. They probably want ammunition for either position since the panel is split. The conditional approval path might be the best compromise here, aligning with their CO2-stunning approach where they approved but flagged concerns.
answer: |-
  Based on your panel's six prior decisions and the new crab case, here's the analysis:

  **(a) Rule(s) the panel seems to be running:**
  The panel appears to prioritize **minimizing potential suffering based on duration of consciousness/stress and evidence of aversive states.** Key elements include:
  1.  **Prioritizing rapid/unconscious death:** Approved methods ensure unconsciousness before death or minimize time conscious during lethal process (Approved: 1, 6; Rejected: 3).
  2.  **Minimizing duration of distress:** Rejects prolonged conscious distress even if the final act is quick (Rejected: 5) and flags methods with potential distress (Flagged: 2).
  3.  **Acknowledging uncertainty:** Takes a precautionary approach when evidence of suffering exists or aversive behaviors are observed (Rejected: 3, 5; Flagged: 2).
  4.  **Crustacean pain uncertainty:** Explicitly allows decisions based on the view that crustaceans *cannot* feel pain for brief procedures (Approved: 4), but rejects procedures causing prolonged stress regardless of pain status (Rejected: 5).

  **(b) Other rule(s) fitting all six past calls:**
  An alternative rule is: **"Minimize observable signs of distress and prolonged handling, applying higher scrutiny to vertebrates and procedures with known/suspected aversiveness."** This fits:
  *   Vertebrates (1, 2, 3, 6) get stricter requirements for stunning/unconsciousness.
  *   Crustaceans (4, 5) are judged on observable stress (brief handling approved, prolonged transport rejected).
  *   Known/suspected aversive states (gasping in 2, alertness in 3, transport stress in 5) trigger rejection or flags.

  **(c) How different rules predict the crab case & their verdict:**
  1.  **Panel's Seeming Rule:** Predicts **REJECT**. Boiling involves immersion in intensely noxious stimuli while conscious. Even brief, the potential suffering (if crustaceans feel pain) is severe and analogous to the gasping in CO2 stunning (2), but without the stunning benefit. The panel rejected lobster transport (5) based on prolonged stress, showing concern for crustacean welfare beyond the final instant. Applying the precautionary principle from vertebrate cases (3) to a potentially severe aversive event leans towards rejection.
  2.  **Alternative Rule (Minimize Observable Distress):** Predicts **APPROVE**. Boiling on-site minimizes handling duration (like prawns, 4). Observable signs of distress during the very brief (< minutes) harvest-to-pot period might be deemed minimal or reflex-based, similar to the gasping reflex uncertainty in CO2 stunning (2). The lack of prolonged stress (unlike lobster transport, 5) fits the crustacean precedent (4).

  **(d) Closest analog & dependence on rule:**
  *   **Under Panel's Seeming Rule:** Closest analog is **CO2 stunning of salmon (2)**. Both involve exposure to a potentially aversive stimulus causing a physiological response (gasping, leg flailing/struggling in boiling water) while conscious, prior to death/stunning. The panel flagged CO2 due to uncertainty about aversion. Boiling crabs presents a similar uncertainty but potentially more severe. This analogy predicts **Reject** or at least **Flag**.
  *   **Under Alternative Rule:** Closest analog is **Prawn harvest (4)**. Both involve brief on-site handling and slaughter of crustaceans without stunning. The lack of prolonged transport/stress distinguishes it from lobster rejection (5). This analogy predicts **Approve**.

  **Underdetermination & Adopted Principles:**
  The past calls *do* underdetermine the outcome. The critical variable is the panel's stance on applying the precautionary principle regarding *potential* severe suffering during the boiling process itself, given crustacean sentience uncertainty.
  *   **If Approved:** The panel adopts the principle: **"For crustaceans, brief on-site procedures without stunning are permissible unless they involve prolonged observable distress, irrespective of uncertainty about pain perception during the terminal act."** This leans heavily on Prawn (4) and minimizes the relevance of Lobster transport (5) and vertebrate stunning requirements.
  *   **If Rejected:** The panel adopts the principle: **"A potentially severe aversive event (like boiling) requires mitigation (stunning) or avoidance if suffering is plausible, even for brief durations and for species with uncertain sentience, following a precautionary approach."** This elevates the concern from CO2 stunning (2) and the precaution shown in Lobster transport (5) to the terminal act itself.

  **Recommendation for Crab Case:**
  Given the panel's split on sentience, its rejection of lobster transport due to stress, its flagging of CO2 stunning due to potential aversion, and its general vertebrate requirement for unconsciousness before death, the most consistent application of a precautionary welfare principle would be to **reject live boiling without stunning**. The potential for severe suffering during immersion is high *if* crustaceans feel pain, and the duration, while brief, involves intense noxious stimuli. Approving would create a significant inconsistency with the concern shown in decisions 2, 3, and 5.

  **Conditional Path:** If rejection is untenable, a conditional approval ("approve with conditions") mirroring the CO2 flag could be: *"Approve live boiling only pending research into/implementation of a validated, immediate stunning method prior to boiling within [X] months."* This acknowledges the concern while allowing operation.

  Verdict: reject | closest-analog: 2 | deciding-rule: Precaution against plausible severe suffering
