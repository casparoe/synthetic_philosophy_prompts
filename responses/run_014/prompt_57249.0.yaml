answer: |-
  ## The Unripe Lexicon

  The dust of the Archive City tasted like paper and stone, a perpetual grit between the teeth. Elara, Senior Auditor Third Class, ran a calloused finger down the spine of Volume XII, *Abacus – Azimuth*. Beside her, Lyra, the apprentice, perched on a stool, her quill poised over a slate. Nineteen years within these high, windowless walls had bleached her skin, but her dark eyes were sharp, hungry for the intricate machinery of the Lexicon.

  "Batch Seventeen," Elara announced, her voice echoing slightly in the vaulted scriptorium. "Subject: Sensory Qualities, subsection: Taste/Tactile Convergence. Beginning with... 'astringent'."

  Lyra flipped open her own slim copy of the Standard Lexicon, her movements precise. Elara found the heavy, leather-bound Master Volume, its pages thick vellum, and turned to the entry. It bore the faded blue ink stamp: **OSTENSIVE**.

  ***astringent** (adj.): Producing a puckering sensation, esp. in the mouth; causing a feeling of harsh contraction or dryness. *See also:* **pucker**, **harsh**, **dry**, **bite**. **Stamp: OSTENSIVE (Ref: Compiler Aris Thorne, Wit. M. Vale, Cycle 87).***

  Elara felt the ghost of a memory: a small, hard, orange fruit thrust into her hand by her grandmother, the shocking, mouth-parching dryness that followed. The last persimmon tree on the city’s sunken terraces had withered before Elara turned ten. That single, unpleasant experience was the only ground she had for this word that now demanded verification.

  "The Termination Rule," Elara recited, the institutional catechism. "Every entry must, by way of other entries, bottom out in an entry stamped OSTENSIVE. We must verify the chain, or identify the point of failure."

  Lyra nodded, already writing. "Chain initiation: 'astringent' cites 'pucker', 'harsh', 'dry', 'bite'."

  Elara turned the heavy pages. The OSTENSIVE stamps were like anchors, three generations old, holding the vast, referential sea of the Lexicon in place. Or pretending to.

  ***pucker** (v.): To draw together into folds or wrinkles; to contract, esp. as the lips or skin might under certain stimuli. *See also:* **contract**, **wrinkle**, **draw together**, **astringent**. **Stamp: OSTENSIVE (Ref: Compiler Lena Reed, Wit. J. Cobb, Cycle 87).***

  ***harsh** (adj.): Unpleasantly rough or grating to the senses; severe, unyielding. *See also:* **rough**, **grating**, **severe**, **astringent**, **dry**. **Stamp: OSTENSIVE (Ref: Compiler Aris Thorne, Wit. M. Vale, Cycle 87).***

  ***dry** (adj.): Lacking moisture; characterized by an absence of wetness or lubrication. *Opposite of:* **wet**. *See also:* **arid**, **parched**, **harsh**, **astringent**. **Stamp: OSTENSIVE (Ref: Compiler Silas Prent, Wit. T. Moss, Cycle 87).***

  ***bite** (n./v.): (n.) The action or effect of seizing or cutting with the teeth; a sharp, penetrating sensation. (v.) To use the teeth to cut or grip; to cause a sharp, stinging sensation. *See also:* **sharp**, **sting**, **penetrate**, **astringent**, **pucker**. **Stamp: OSTENSIVE (Ref: Compiler Lena Reed, Wit. J. Cobb, Cycle 87).***

  Elara traced the path. *Astringent* led to *pucker*, *harsh*, *dry*, *bite*. *Pucker* led back to *astringent*. *Harsh* led to *astringent* and *dry*. *Dry* led to *harsh* and *astringent*. *Bite* led to *astringent* and *pucker*. It was a closed loop, a snake swallowing its own tail. The only exit was the OSTENSIVE stamp on *astringent* itself, claiming a direct pointing.

  "The chain closes," Lyra observed, tapping her slate. "No external grounding point reached except the primary ostension on 'astringent'. Verification requires re-ostension of the referent. Protocol dictates we proceed to the Terrace Gardens, Sector Seven, Plot Gamma – the referenced location for the *Diospyros* specimen."

  "The last tree died forty years ago," Elara said flatly. "Plot Gamma is now medicinal thyme."

  Lyra’s brow furrowed slightly, not in confusion about the fact, but about the procedure. "Recorded extinction. Referent absent. Primary ostension unverifiable. Does this constitute failure for deletion?"

  "Not necessarily," Elara replied, the rules flowing automatically. "The ostension stamp refers to the *quality*, not solely the persimmon. The quality might persist elsewhere. We must attempt alternative re-ostension." *Though what else could possibly do that to your mouth?* she thought, the phantom dryness tightening her own cheeks.

  Lyra made a neat note. "Alternative stimuli search initiated."

  They worked through the batch. *Crenellation* was straightforward – they walked the northern wall, Lyra sketching the stone battlements, confirming the pattern against the definition and its OSTENSIVE stamp citing "Compiler Vale, Wit. Thorne, Cycle 87" who had literally pointed at the wall. *Vermilion* pigment was produced from the Archive's own stores, its vivid redness undeniable. *Lugubrious*... that was trickier. The definition relied on *mournful*, *doleful*, *sorrowful*, but the OSTENSIVE stamp cited "Compiler Cobb, Wit. Moss, Cycle 87" pointing during a state funeral. Lyra, who had known only the Archive’s quiet industry, struggled. Elara described the slow, heavy tolling of the Great Bell, the bowed heads, the grey rain that day. Lyra nodded, her expression serious, but Elara wondered if she grasped the *weight* of it, or just the description. Was it like *astringent*? Not quite. Lugubrious *could* be pointed to – in a slow walk, a deep sigh, a specific shade of grey sky. It felt thin, perhaps, but not impossible. It was a quality observable *in* things.

  Then came *fidelity*.

  ***fidelity** (n.): Strict observance of promises, duties, or obligations; unwavering loyalty; exact correspondence to fact or original. *See also:* **loyalty**, **accuracy**, **constancy**, **faithfulness**. **Stamp: OSTENSIVE (Ref: Compiler Moss, Wit. Prent, Cycle 87).***

  Elara stared at it. A different chill seeped into her bones, distinct from the simple absence she felt with the persimmon. "Lyra. Compiler Moss, Witness Prent. They stamped this OSTENSIVE. What did they point at?"

  Lyra consulted the Master Volume's marginalia, a tiny, precise notation next to the stamp. "Annotation: 'Observed oath-swearing ceremony, Contract Hall, Witnessing Stone. Compiler Moss indicated the clasped hands of Principals A. and B. and stated: *There*.'"

  Elara pictured it: two people clasping hands over a stone. Moss pointing. *There*. Fidelity? Pointing at clasped hands didn't point at *fidelity*, any more than pointing at a grey sky pointed at *lugubriousness*. It pointed at an *action associated* with fidelity. But fidelity itself? That invisible knot of intention, that future-facing promise? How could you *point* to the *thing itself*? The stamp felt like a fraud, fundamentally different from pointing at a red pigment, a battlements pattern, or even, Elara suspected, the specific, undeniable physical shock of an unripe persimmon. The persimmon was gone, but its effect *had* been a thing you could point *to* – the sensation in the mouth. *Fidelity*... what part of the clasped hands was it? The pressure? The skin contact? The solemn expression? It was everywhere and nowhere. Its ostension was impossible by nature, not just circumstance. A profound, unsettling emptiness yawned beneath this stamp. Lyra, however, simply recorded the annotation, her face neutral. To her, it was just another procedure, another link in the chain.

  The persimmon wouldn't leave Elara alone. It haunted the audit, the dusty air thick with the absence of that specific, unpleasant dryness. One afternoon, frustration and a strange, desperate empathy overcame her. Lyra was reviewing the *astringent* entry chain again, her lips moving silently.

  "Lyra," Elara said abruptly, setting down her magnifying glass. "Come here."

  The apprentice approached Elara’s worn oak desk. Elara picked up a dried chamomile flower from a dish – useless for this, too soft. She grabbed a scrap of coarse sandpaper used for smoothing nibs. Too extreme. Her gaze fell on a green walnut, brought from the thinning stores for ink-making, its immature husk notoriously potent.

  "Hold out your hand," Elara instructed.

  Lyra obeyed, palm up, trusting.

  Elara hesitated. This was foolish, against protocol. But the need to *show*, not just define, burned. She took the green walnut. "This... this isn't *exactly* it. But it’s close. The closest thing I have." She scraped the rough, green husk lightly against the tip of Lyra’s index finger. "Feel that? The roughness? The… the drag?"

  Lyra nodded. "Abrasive texture. Like fine pumice."

  "No," Elara insisted, her voice tight. "Not just *on* the skin. *In* the mouth." She mimed putting something in her mouth, chewing, then her face unconsciously contorted – lips pulling back, cheeks sucking in, tongue pressing against her palate. "It pulls. It… it *grabs*." She scrabbled for words, the lexicon failing her utterly. "Like… like your whole mouth is suddenly too small. Shrinking. Like… like trying to suck juice out of a stone. A dry stone. And it leaves… nothing. Worse than nothing. A… a thirst that isn’t for water."

  She stopped, breathing slightly hard. Her own mouth felt parched, remembering. She saw Lyra watching her face intently, absorbing the description, the gestures, the raw physicality of the remembered sensation etched on Elara’s features.

  Lyra looked down at her fingertip, rubbed it thoughtfully against her thumb. She looked back at Elara, her expression earnest, deeply engaged. "Ah," she said, a sound of comprehension. "I perceive the described convergence of tactile desiccation and involuntary muscular contraction. The referenced ‘grab’ aligns with the secondary definitional node of ‘bite’ implying an aggressive, non-volitional adherence. Thank you, Senior Auditor. That contextualizes the sensory overlap described in the entry."

  Her words were impeccable. A perfect, professional integration of the lexicon's terms. Warm with gratitude for the instruction. And utterly, devastatingly uninformative. Had she grasped the visceral *shock* of it? The biological affront? Or had she simply expertly mapped Elara’s performance, her metaphors, onto the existing, circular definitions? Elara couldn't tell. The gap felt unbridgeable, not by a lack of words, but by the sheer impossibility of conveying the lived, bodily quality through signs alone. Explanation hadn't run out; it had revealed its limits.

  Lyra returned to her slate, already drafting a note about the walnut husk as a potential, though imperfect, analog for partial re-ostension attempts. Elara sank back into her chair, the green walnut heavy in her hand. She thought of her grandmother's wrinkled face, the sharp, unpleasant gift of the fruit. Was that memory even real? Or had it been shaped by years of reading the definition? The dryness she recalled – was it the true astringency, or just a child's memory of discomfort? Could she trust the sensation in her mind to stand in for the thing itself, especially when the thing was gone? Her distrust was a fog of time and subjectivity, obscuring the past. Lyra’s ignorance was a blank wall, impossible to scale from the outside. They were not the same kind of absence.

  The audit deadline loomed. Paper rationing tokens lay stacked on the Archivist-General’s desk. Entries deemed ungrounded would be excised, their space reclaimed. Lyra’s future – her chance at promotion beyond apprentice, her belonging within the only world she knew – hinged on the perceived integrity of the work she helped maintain. Elara saw the quiet hope in the younger woman’s eyes when she discussed the *fidelity* entry, her faith in the stamps and procedures absolute. To Lyra, deleting entries was an amputation of the Lexicon’s body, unthinkable unless absolutely proven rotten.

  Elara sat alone in the lamplight, Volume XII open before her. The loop for *astringent* glowed on the page: the closed circle of words, the faded blue OSTENSIVE stamp its only anchor. Her attempt to bridge the gap to Lyra had failed. The persimmon was dust. Her own memory felt slippery, unreliable. *Fidelity*’s stamp was a hollow joke. Yet… contracts relied on *harsh* penalties. Water shares depended on *dry* measurements. Medical dosages referenced *astringent* properties for wound treatment – using oak bark now, not persimmons, but the *word* held the knowledge. The city ran on the Lexicon. To excise *astringent* wasn't just deleting a word; it was severing a thread in the tapestry of agreements, treatments, and shared understanding, however imperfectly grounded.

  She picked up the heavy OSTENSIVE stamp, its bronze handle cool in her hand. The ink pad, refreshed daily, was a deep, official blue. The stamp that claimed: *Somebody pointed. Somebody saw. This word touches the world.*

  She hovered it over the faded original stamp on the *astringent* entry. To re-stamp it was a lie. To omit it was a condemnation. To delete it felt like opening a wound in the structure Lyra clung to, a structure Elara herself had served for decades.

  Her hand trembled. She thought of the green walnut, Lyra's perfectly formed, perfectly hollow understanding. She thought of her grandmother, the long-gone shock, the memory now colored by the definition it was supposed to ground. She thought of clasped hands over a stone, an impossible promise pointed at.

  Elara brought the stamp down.

  ***THUNK.***

  The sound echoed in the silent scriptorium. The new blue circle was stark and fresh over the old, faded one. **OSTENSIVE**. It declared continuity. It preserved the chain. It kept the word within the walls.

  She closed the volume. The ink gleamed wetly for a moment before starting its slow absorption into the vellum, merging with the ghost of the stamp beneath. It was an act of preservation, a buttress against institutional decay. It was also an act of profound burial, sealing the emptiness deeper within the Lexicon's heart, ensuring the circle of signs remained unbroken, pointing only to themselves. The entry lived on, suspended between a lost world and a necessary fiction. Elara placed the heavy book back on the shelf, the blue circle already looking ancient under the lamplight. The dust settled. The Lexicon endured, its foundations now resting on an act of faith as much as on stone.
