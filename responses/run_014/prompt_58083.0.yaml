prompt: |-
  A friend enthusiastic about the claim that the world has become less violent summarized the case for me roughly as follows: premodern societies had far higher rates of homicide and death in warfare, and the rise of centralized states, commerce, and wider circles of sympathy has produced a sustained decline across killing, war, and cruel punishments, so that even the large absolute death tolls of the twentieth century remain low once adjusted for population, which shows that contemporary life is less violent in the sense that matters morally. I am inclined to accept the population adjustment for comparing wars across eras with very different population sizes, but I am unsure whether that adjustment settles the evaluative question, or whether the evidence for fewer battlefield deaths carries over to violence more broadly. Which parts of this summary would defenders of the decline thesis accept as accurate, which conflate distinct claims they keep apart or overstate what the evidence shows, and does the moral conclusion follow from the corrected version?
reasoning: |-
  Okay, let me start by unpacking the user's query. They have a friend who's enthusiastic about the idea that the world has become less violent, citing lower homicide rates, fewer war deaths per capita, and the role of centralized states and commerce. The user is skeptical about whether population adjustment alone settles the moral question and if battlefield deaths reflect broader violence.

  First, I need to recall Steven Pinker's arguments from *The Better Angels of Our Nature*. Pinker does emphasize per capita rates for homicides and war deaths. The user's friend seems to align with this, so defenders of the decline thesis would agree on adjusting for population. But the user is questioning if that's sufficient for the moral evaluation.

  The user's uncertainty revolves around two main points: whether per capita adjustment is appropriate and if reduced battlefield deaths translate to less violence overall. They also wonder about the moral implications. I should address these while considering what the decline thesis proponents accept and where they might overstate.

  Looking at homicide rates, the historical data does show a significant drop. Eisner's studies support that. But the user might not know that these stats come from specific regions like Europe. The decline isn't uniform globally, which is a nuance. The friend's summary might oversimplify by implying a universal trend.

  For warfare, the population-adjusted decline is accepted, but the 20th century's absolute numbers are high. The user accepts per capita for wars, so that's settled. However, non-state conflicts and indirect deaths (like famines) are rising. The friend might conflate battlefield deaths with all war-related mortality. Proponents like Pinker acknowledge this but argue the trend still holds. The user's concern about broader violence is valid here.

  The moral conclusion part is tricky. The user questions if less killing per capita means the world is morally better. Proponents would say yes, citing reduced risk to individuals. But the user might be thinking about other forms of violence, like structural or psychological, which aren't covered. The friend's summary doesn't mention these, so the thesis might overstate by equating battlefield deaths with overall violence.

  I should also consider what the user hasn't said. They might be interested in alternative explanations or recent data. For example, the Institute for Economics and Peace reports show declines but also note increases in civil unrest. The user's deeper need could be understanding if the decline thesis holds under scrutiny or if it's too optimistic given modern issues like systemic racism or climate-induced conflicts.

  Another angle: the user mentions "wider circles of sympathy." While Pinker talks about empathy expanding, critics argue this ignores colonialism and cultural destruction. The user might be hinting at whether the decline came at the cost of marginalized groups. The moral conclusion could be problematic if violence was outsourced or transformed rather than reduced.

  In summary, I need to validate the user's skepticism about per capita adjustment being sufficient. Highlight that while proponents accept homicide and war declines per capita, they separate different claims. The evidence doesn't extend to non-physical violence, and the moral conclusion depends on whether reduced individual risk is the primary moral metric. The user might need reassurance that their doubts are valid and that the thesis has limitations despite some strong evidence.
answer: |-
  Defenders of the decline thesis (like Steven Pinker, whose work *The Better Angels of Our Nature* is central here) would accept **parts** of your friend's summary as accurate but would also acknowledge key nuances, distinctions, and potential overstatements. The moral conclusion is **contested** and depends heavily on the specific moral framework applied.

  Here's a breakdown:

  **Parts Defenders Would Accept as Accurate:**

  1.  **Premodern Homicide Rates:** Strong evidence (e.g., from historical records, anthropological studies of non-state societies) consistently shows that per capita homicide rates in premodern societies (both state and non-state) were significantly higher than in modern developed states, often by an order of magnitude (e.g., 10-100 times higher). Eisner's work compiling European homicide rates is a key source.
  2.  **Battlefield Deaths Adjusted for Population:** There is robust evidence that the *rate* of death from interstate warfare, particularly among combatants, has declined significantly over the long term, especially post-WWII and even more so post-Cold War. Even the massive absolute death tolls of the 20th century (WWI, WWII) represent a lower *per capita* rate of violent death than many periods in prehistory or antiquity when populations were smaller but warfare could be proportionally more devastating. The "Long Peace" since 1945 is a core argument.
  3.  **Role of Centralized States:** Defenders strongly argue that the rise of the Leviathan (a state monopoly on legitimate force) is a primary driver in reducing interpersonal violence (homicide) within societies. States suppress feuds, vendettas, and private justice.
  4.  **Decline in Cruel Punishments:** The evidence for a dramatic decline in state-sanctioned torture, brutal executions (e.g., burning at the stake, drawing and quartering), and cruel corporal punishment in most developed states is very strong and relatively uncontroversial.

  **Parts Where Defenders Make Distinctions or Acknowledge Overstatements/Nuances:**

  1.  **Conflating Homicide and Warfare:** While both show declines, they are distinct phenomena with different causes and timelines. The decline in homicide rates began earlier in Europe (associated with state centralization and the "Civilizing Process"). The decline in major interstate warfare is a more recent phenomenon (post-1815, accelerating post-1945). Conflating them into a single "violence" metric can be misleading.
  2.  **"Wider Circles of Sympathy" as Primary Driver:** While Pinker discusses the "Expanding Circle" as a factor, he emphasizes the **Leviathan** (state power) and **Commerce** (gentle commerce making others more valuable alive than dead) as the *primary* material drivers. "Wider circles of sympathy" (empathy, cosmopolitanism) is presented more as a consequence and reinforcing factor enabled by these structures and increased communication, not the initial spark.
  3.  **Overstating the Universality and Linearity:** Defenders acknowledge the decline is:
      *   **Not Universal:** Rates remain much higher in some regions (e.g., parts of Central/South America, conflict zones) than in the most peaceful developed nations. The *trend* is global on average, but the *levels* vary massively.
      *   **Not Linear:** There are significant reversals and spikes (e.g., World Wars, genocides of the 20th century, recent upticks in homicides in some places). The argument is about the long-term *trend* over centuries/millennia, not constant year-by-year decline.
      *   **Focused on *Lethal* Violence:** The thesis primarily tracks *fatal* outcomes (homicides, battlefield deaths). It doesn't claim non-lethal violence (assault, rape, domestic abuse, bullying) has declined similarly, though some argue cultural shifts have reduced their acceptability/tolerance.
  4.  **20th Century Death Toll:** While defenders argue *per capita* rates were lower than in many past eras *proportionally*, they readily acknowledge the 20th century's unique horrors in *absolute* terms (industrialized warfare, totalitarianism, genocide). The point is that even these cataclysms, when viewed against the backdrop of a vastly larger global population, represent a lower *individual risk* of violent death than faced by humans in earlier times. They do not minimize the suffering.
  5.  **"Violence More Broadly":** This is the *crucial* point you raise. Defenders focus primarily on **lethal interpersonal and organized group violence**. They generally *do not* claim declines in:
      *   **Structural Violence:** Poverty, systemic discrimination, lack of healthcare, environmental degradation causing premature death. (Critics argue this *is* violence and may have increased with modern systems).
      *   **Non-Lethal Violence:** Assault, rape, psychological abuse, domestic violence. Evidence here is much harder to compare historically and trends are less clear-cut.
      *   **State Repression/Coercion:** Surveillance, imprisonment rates (especially in places like the US), police brutality. Modern states exert control in different, potentially less overtly lethal but still pervasive, ways.
      *   **Indirect Deaths from War:** Deaths from famine and disease caused by war (often much higher than battlefield deaths) are harder to attribute and compare historically. Modern warfare can cause massive indirect suffering (refugees, infrastructure destruction).
      *   **Civil Wars & Non-State Conflicts:** While major interstate war declined, civil wars, insurgencies, and terrorism remain significant sources of violence. Data is harder to compile for the distant past.

  **Does the Moral Conclusion Follow from the Corrected Version?**

  *   **The Core Argument:** Proponents argue that the decline in the *risk of dying a violent death* is the most fundamental moral improvement. If your chance of being murdered, executed, or killed in battle is dramatically lower than your ancestors', your life is objectively safer from violent termination. This, they argue, is a profound moral good – reducing the sheer amount of human suffering and potential cut short by violence. It allows for longer, more secure lives and the development of complex societies.
  *   **The Counter-Argument (Your Skepticism is Valid):** Critics, and you intuitively, argue that this is too narrow:
      1.  **Scope of Violence:** If non-lethal violence, structural violence, or psychological suffering remain high or have even increased in different forms, has "violence" truly declined in a *morally holistic* sense? Does a lower risk of murder offset living under constant threat of drone strikes, oppressive surveillance, or systemic injustice?
      2.  **Complacency:** Focusing on the decline in lethal violence might breed complacency about other pervasive forms of harm and suffering.
      3.  **Moral Progress vs. Changing Forms:** Has intrinsic human morality improved, or have societal structures merely suppressed the *expression* of lethal violence while allowing other harms to flourish? Did the decline come at the cost of other values (e.g., autonomy vs. state control)?
      4.  **Scale of Modern Harms:** While the *risk* is lower, the *potential scale* of violence enabled by technology (nuclear weapons, biological agents) is unprecedented, creating a new kind of existential dread and moral responsibility.
      5.  **Justice vs. Suffering:** The decline thesis focuses on the *quantity* of suffering from violence. Moral evaluation might also require considering the *justice* of systems, the *distribution* of suffering, and the *quality* of life beyond mere physical survival.

  **Conclusion:**

  1.  **Defenders Agree With:** Significantly lower per capita rates of homicide and battlefield death over the long term; the key roles of the state and commerce; decline in cruel punishments.
  2.  **Defenders Distinguish/Qualify:** Homicide vs. warfare trends; primary drivers (state/commerce vs. empathy); the decline is a long-term trend, not universal or linear; focus is on *lethal* violence; 20th century horrors acknowledged but seen as proportionally less lethal.
  3.  **Defenders Do *Not* Claim:** Broad declines in non-lethal violence, structural violence, or all forms of suffering. The evidence is strongest for reduced *risk of violent death*.
  4.  **The Moral Conclusion:** The claim that "contemporary life is less violent in the sense that matters morally" **does not automatically follow** from the corrected decline thesis. It hinges entirely on the definition of "violence that matters morally."
      *   If "violence that matters morally" is defined as **the risk of premature death by intentional human action (homicide, war execution)**, then the evidence strongly supports the conclusion.
      *   If "violence that matters morally" encompasses **a broader sense of harm, suffering, injustice, oppression, and non-lethal violence**, then the decline thesis, while compelling for lethal violence, is insufficient to support the broader moral conclusion. Your skepticism about whether reduced battlefield deaths translate to less violence "more broadly" is well-founded and highlights the core limitation of the thesis for a more expansive moral evaluation.

  The decline in lethal violence is a significant historical development with profound implications. However, whether this constitutes a decline in "violence" in the *fullest moral sense* remains a complex and debated question that the evidence on homicide and warfare alone cannot definitively settle.
