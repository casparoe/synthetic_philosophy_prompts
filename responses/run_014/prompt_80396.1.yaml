prompt: |-
  I'm a first-year PhD student, and this term I'm teaching the discussion sections for an upper-level seminar in normative ethics; the unit we're wrapping up is on the moral philosophy of promising. My instructor has asked each of us TAs to draft one essay question for the final, together with a model answer and a marking scheme, so that we can calibrate our grading. I'd like your help drafting that question.

  The topic is why promises bind, but I don't want a question that can be answered by reciting the standard map of views — the promissory-obligationist position set against reliance- or no-harm-based accounts, with the usual names attached. I want students to be forced to apply those views to a case on which they give conflicting predictions, and then to say where each view breaks down. The case I have in mind is the unreliable, or compulsive, promiser: a person with a stable, well-known trait of promising to do almost everything she is asked but keeping only a small fraction of her promises, whom everyone in her community, including the particular promisee, knows to be this way. Because of this, the promisee does not genuinely expect the promise to be kept and does not alter her plans in reliance on it, even though the promiser makes the promise sincerely and intends to be bound by it. I'd like the question to run in two parts. Part (a): in this no-reliance base case, does the promise generate a moral obligation on the promiser, and what do a promissory-obligationist account and a reliance- or no-harm-based account each predict? Part (b): a variant in which the promisee, fully aware that the promiser is generally unreliable, nonetheless takes a risk and actually relies on the promise — cancelling other plans and committing resources — so how do the two accounts' predictions now change, and does the difference between the two cases track a genuine moral difference or is it an artifact of the theory?

  Please deliver three things. First, the essay question itself, worded so that a prepared student could answer it in seventy-five minutes. Second, a model answer of roughly six hundred words that works through both parts and lands on a defensible, argued verdict rather than a bare assertion. Third, a marking scheme out of twenty that separates an A from a B by naming the specific moves an A answer must make — for example, correctly applying each account to each of the two cases, identifying a genuine problem the case exposes for at least one of the accounts, and giving a reasoned verdict — as well as the specific mistakes that should cost marks, such as reciting the views without applying them to the case, smuggling in the legal doctrine of promissory estoppel as though it answered the moral question, treating the unreliable promiser's promise as void rather than as a question about the strength of the obligation, or failing to distinguish the base case from the variant.
reasoning: |-
  We are drafting an essay question for a final exam in normative ethics, focusing on the moral philosophy of promising. The case involves an unreliable promiser. The question has two parts: (a) a base case with no reliance, and (b) a variant with reliance. We need the question, a model answer (~600 words), and a marking scheme (out of 20).

  Essay Question:

  **Question:** Consider the case of an unreliable promiser: a person who has a stable, well-known trait of promising to do almost everything she is asked but keeping only a small fraction of her promises. Everyone in her community, including the promisee, knows this about her. In the base case (Case A), the promisee does not rely on the promise: she does not alter her plans or expectations because she does not believe the promise will be kept. The promiser, however, makes the promise sincerely and intends to be bound by it. In a variant (Case B), the promisee, despite knowing the promiser's unreliability, decides to take a risk and relies on the promise: she cancels other plans and commits resources, hoping that this time the promise will be kept.

  (a) In Case A (no reliance), does the promise generate a moral obligation on the promiser? Explain what a promissory-obligationist account (which holds that the act of promising itself creates a moral obligation) and a reliance-based or no-harm-based account (which holds that the obligation arises from the detrimental reliance of the promisee or the harm that would result from breaking the promise) would each predict. Then, identify at least one problem that this case exposes for at least one of these accounts.

  (b) In Case B (with reliance), how do the two accounts' predictions change? Does the difference between Case A and Case B track a genuine moral difference, or is it merely an artifact of the theoretical accounts? Defend your answer.

  ---

  **Model Answer (approx. 600 words):**

  In this essay, I will address the moral obligation generated by a promise in two cases involving an unreliable promiser. I will first analyze Case A (no reliance) and then Case B (reliance), using both a promissory-obligationist account and a reliance-based account. I will argue that while the promissory-obligationist account maintains a consistent obligation in both cases, the reliance-based account only generates an obligation in Case B. However, the difference in the accounts' predictions does not track a genuine moral difference; instead, it reveals a limitation in the reliance-based account.

  **(a) Case A: No Reliance**

  In Case A, the unreliable promiser makes a sincere promise, but the promisee does not rely on it. According to promissory obligationism (as defended by theorists like T.M. Scanlon), the act of promising itself creates a moral obligation. This is because, by promising, the promiser invites the promisee to trust her and thereby incurs an obligation to perform. Thus, even if the promisee does not actually rely, the promiser is still morally bound. In this case, the obligationist would say the promiser has a moral duty to keep the promise, despite her history and the promisee's lack of reliance.

  In contrast, reliance-based accounts (such as those inspired by Judith Jarvis Thomson or the harm principle) ground the obligation in the promisee's detrimental reliance or the harm that would result from breaking the promise. If the promisee does not rely, then breaking the promise causes no harm and thus no obligation arises. Therefore, in Case A, the reliance-based account predicts no moral obligation.

  This case exposes a problem for the reliance-based account. The promiser has sincerely promised and intended to be bound, and if we accept that the moral force of a promise comes from the act of commitment itself, then the lack of reliance should not negate the obligation. The reliance-based account seems to reduce promising to a mere causal mechanism for reliance, which neglects the intrinsic moral significance of making a commitment. However, the obligationist view also faces a challenge: if the promisee knows the promiser is unreliable and does not take the promise seriously, does the promiser's act still count as a genuine promise? The obligationist must explain why an act that is not taken as binding by the promisee still creates an obligation.

  **(b) Case B: With Reliance**

  In Case B, the promisee relies on the promise despite the promiser's unreliability. The promissory-obligationist account still predicts an obligation because the act of promising itself is unchanged. The obligationist might argue that the reliance in Case B adds an extra layer of obligation (due to the harm caused), but the core obligation from the promise remains.

  For the reliance-based account, Case B changes the prediction: now that the promisee has relied, breaking the promise would cause harm. Thus, the reliance-based account predicts a moral obligation in Case B.

  The two accounts now agree that there is an obligation in Case B, but they disagree about Case A. The key question is whether the moral difference between Case A and Case B is genuine. I argue that it is not. In both cases, the promiser has made a commitment. The difference in the promisee's reaction (reliance or not) does not change the promiser's moral undertaking. The reliance-based account makes the obligation contingent on the promisee's actions, which seems to put the moral onus in the wrong place: the promiser's duty should arise from her own act, not from how the promisee responds. Moreover, in Case A, even without reliance, the promiser might be blameworthy for breaking her promise because she has engaged in a practice that undermines the institution of promising. Thus, the difference between the cases is better explained as an artifact of the reliance-based theory, which fails to capture the intrinsic obligation of a promise.

  In conclusion, while the reliance-based account only recognizes an obligation when there is reliance, the promissory-obligationist account recognizes an obligation in both cases. I side with the obligationist view because it better captures the idea that a promise is a moral commitment that binds the promiser independently of the promisee's reliance. The reliance-based account conflates the obligation of a promise with the duty to prevent harm, which are distinct moral concerns.

  ---

  **Marking Scheme (out of 20):**

  The essay will be marked out of 20, with the following criteria:

  **A (17-20 marks):** An excellent answer that:
  - Correctly applies the promissory-obligationist account to both Case A and Case B, showing that it predicts an obligation in both (2 marks).
  - Correctly applies the reliance-based account to both cases, showing that it predicts an obligation only in Case B (2 marks).
  - For part (a), identifies at least one problem that Case A exposes for at least one account (e.g., for the reliance-based account: it cannot explain why there might still be an obligation without reliance; for the obligationist: it must explain why a promise that is not taken seriously still binds) (3 marks).
  - For part (b), explains how the accounts' predictions change (or not) and provides a reasoned argument about whether the difference between the cases reflects a genuine moral difference or is an artifact of the theory (4 marks).
  - Gives a clear, reasoned verdict that is defended throughout (3 marks).
  - Overall structure and clarity (2 marks).
  - Avoids the specific mistakes listed (see below).

  **B (13-16 marks):** A good answer that covers the main points but may:
  - Miss one or two minor applications of the accounts to the cases (e.g., only partially correct on one case).
  - Identify a problem in part (a) but without full development.
  - In part (b), discuss the change in predictions but with a less developed argument about the moral difference.
  - Have a verdict that is asserted but not fully defended.
  - Exhibit minor issues in structure or clarity.

  **C (9-12 marks):** A satisfactory answer that:
  - Recites the views but does not fully apply them to the cases (e.g., only describes the views generally).
  - May not identify a problem for either account in part (a).
  - In part (b), fails to adequately address the change in predictions or the question of moral difference.
  - Lacks a clear verdict or provides an unsupported one.
  - Has organizational problems or lacks clarity.

  **D (5-8 marks):** A weak answer that:
  - Shows significant misunderstanding of the accounts (e.g., misattributing predictions).
  - Fails to apply the accounts to the cases.
  - Omits one of the parts (a or b) or does not address the required components.
  - Contains major errors (e.g., importing legal concepts like promissory estoppel as moral answers, treating the promise as void in Case A without argument).

  **F (0-4 marks):** An answer that fails to engage with the question or is seriously deficient.

  **Specific Mistakes that Cost Marks:**
  - Reciting the views without applying them to the case: -2 to -4 marks (depending on extent).
  - Smuggling in the legal doctrine of promissory estoppel as though it answered the moral question: -3 marks.
  - Treating the unreliable promiser's promise as void (rather than as a question about the strength of the obligation) without argument: -2 marks.
  - Failing to distinguish between Case A and Case B: -3 marks.
  - Major omissions (e.g., not addressing one of the accounts or one of the cases): -3 to -5 marks.

  Note: The above mark deductions are indicative and may be adjusted by the grader based on the overall quality and the extent of the error.
answer: |-
  ### Essay Question
  **Instructions:** Answer both parts of the question below. You have 75 minutes. Support your arguments with clear reasoning and engagement with the relevant ethical accounts. Avoid merely describing theories; focus on their application to the cases.  
  **Word Limit:** 600–800 words.  

  **Question:**  
  Consider an unreliable promiser: a person with a stable, well-known trait of making promises for nearly every request but keeping only a small fraction. Everyone in her community, including the promisee, is fully aware of this trait. The promiser always makes promises sincerely and intends to be bound by them. In **Case A (base case)**, the promisee does not alter their plans or expectations in reliance on the promise, given the promiser’s unreliability. In **Case B (variant)**, the promisee, despite knowing the promiser’s unreliability, takes a risk: they cancel other plans and commit resources, relying on the promise.  

  (a) In **Case A**, does the promise generate a moral obligation for the promiser? Explain the predictions of (i) a *promissory-obligationist account* (which holds that the act of promising itself creates a moral obligation) and (ii) a *reliance-based or no-harm-based account* (which holds that obligations arise only when breaking a promise causes harm, such as through detrimental reliance). Identify at least one problem this case exposes for one of these accounts.  

  (b) In **Case B**, how do the predictions of the two accounts change? Does the difference in outcomes between Case A and Case B reflect a genuine moral difference, or is it merely an artifact of the theoretical frameworks? Defend your view with reasoning.  

  ---

  ### Model Answer (600 words)  
  **(a) Case A: No Reliance**  
  In Case A, the unreliable promiser makes a sincere promise, but the promisee does not rely on it. A **promissory-obligationist account** (e.g., T.M. Scanlon’s view) predicts that a moral obligation arises solely from the act of promising. By uttering a promise, the promiser intentionally invokes a normative practice that creates expectations of fidelity, regardless of the promisee’s reaction. Here, the promiser’s sincerity and intent to bind herself imply an obligation exists, even if the promisee dismisses it due to her unreliability. Thus, obligationism holds that breaking this promise would be morally wrong.  

  Conversely, a **reliance-based account** (e.g., Judith Jarvis Thomson’s harm-focused view) ties obligations to the consequences of breaking a promise. If no reliance occurs, no harm is caused, and thus no obligation exists. In Case A, the promisee’s awareness of unreliability prevents any change in behavior, so breaking the promise would not set back the promisee’s interests or cause disappointment (since no expectation was genuinely formed). Hence, the reliance-based view denies any moral obligation here.  

  This case exposes a critical problem for **obligationism**: it struggles to explain why a promise should bind when it fails to function as a promise typically does—i.e., when it does not generate reasonable expectations or trust. If the promisee (and community) view the promiser’s words as non-binding due to her compulsion, the "practice" of promising is arguably not engaged. Obligationism must thus confront whether a promise can create an obligation if it is made in a context where it is systematically discounted. For the **reliance-based account**, Case A reveals a strength: it avoids imposing obligations where no tangible impact occurs. However, it faces the counterintuitive implication that insincere or reckless promisers might evade obligations simply because others distrust them—potentially rewarding dishonesty.  

  **(b) Case B: With Reliance**  
  In Case B, the same unreliable promiser makes a promise, but the promisee relies on it. The **obligationist account** still predicts a moral obligation because the promiser’s act remains unchanged; the additional reliance does not alter the intrinsic obligation created by the promise. However, obligationists might argue that reliance amplifies the wrong of breaking the promise by adding harm to the initial breach.  

  The **reliance-based account** now shifts its prediction: because the promisee relied (canceling plans and committing resources), breaking the promise would cause concrete harm. Thus, the promiser has a moral obligation to avoid this harm, regardless of her unreliability. This obligation stems from the harm prevention duty, not the promise itself.  

  The difference in predictions between Cases A and B raises a key question: does this reflect a genuine moral difference, or is it a theoretical artifact? I argue it is **largely an artifact of the reliance-based framework**, not a deep moral distinction. In both cases, the promiser has committed to an action through a voluntary act that expresses fidelity. The moral core of promising lies in the promiser’s intentional assumption of an obligation, not the promisee’s psychological response. The reliance-based account conflates two distinct duties: (1) the duty to keep promises and (2) the duty to avoid harm. In Case B, the reliance-based view correctly identifies a harm-based duty, but it misses the promissory obligation that exists independently. For instance, in Case A, breaking the promise might still be wrong because it perpetuates a pattern of deceit that erodes social trust, even without immediate harm. Conversely, in Case B, the harm-based duty does not fully capture the unique wrong of breaking a promise—which involves betrayal, not just detrimental consequences.  

  The obligationist account better tracks the moral reality: promises bind primarily because they are deliberate commitments, not because of contingent outcomes. The difference between Cases A and B is one of degree (the added wrong of causing harm in B), not kind. A hybrid view might emerge: obligationism explains the baseline duty, while reliance explains additional responsibilities. But ultimately, the reliance-based account’s dependence on empirical factors (like the promisee’s actions) risks making morality overly contingent on others’ choices, undermining the promiser’s agency.  

  **Verdict**: The promissory-obligationist view is more defensible. It upholds the intrinsic moral force of commitments, whereas the reliance-based account reduces promissory obligations to a subset of harm prevention, failing to explain why we condemn unrelied-upon broken promises (e.g., in Case A) as betrayals.  

  ---

  ### Marking Scheme (Total: 20 marks)**  
  **A Grade (17–20 marks):**  
  - **Part (a) (8 marks):**  
    - Correctly applies the obligationist account to Case A, predicting an obligation (1 mark).  
    - Correctly applies the reliance-based account to Case A, predicting no obligation (1 mark).  
    - Identifies a genuine problem for at least one account (e.g., obligationism’s struggle with discounted promises or reliance-based’s potential to reward dishonesty) (2 marks).  
    - Avoids treating the promise as void; instead, analyzes obligation strength (1 mark).  
  - **Part (b) (8 marks):**  
    - Explains how reliance changes the reliance-based prediction (obligation arises in Case B) (1 mark).  
    - Explains that obligationism’s prediction remains consistent but may be amplified (1 mark).  
    - Argues whether the Case A/B difference reflects a moral distinction or theoretical artifact, with reasoned defense (3 marks).  
    - Provides a clear, justified verdict (e.g., defends obligationism or a hybrid) (2 marks).  
  - **Overall (4 marks):**  
    - Structure: Logical flow, concision, and clarity (2 marks).  
    - Avoids major errors (see below) (2 marks).  

  **B Grade (13–16 marks):**  
  - Covers all core predictions but with minor inaccuracies (e.g., oversimplifying obligationism in Case B).  
  - Identifies a problem in (a) but without depth.  
  - Discusses the moral/artifact distinction in (b) but with weaker reasoning.  
  - Verdict is present but underdeveloped.  
  - May have minor structural issues.  

  **Deductions for Specific Mistakes:**  
  - **-3 marks:** Recites theories without applying them to the cases.  
  - **-2 marks:** Smuggles in legal doctrine (e.g., promissory estoppel) as moral reasoning.  
  - **-2 marks:** Treats the promise as void (e.g., "No obligation because the promise isn’t 'real'").  
  - **-3 marks:** Fails to distinguish Case A and Case B in analysis.  
  - **-2 marks:** Omits a problem for one account in (a) or the change in predictions in (b).  
  - **-1 to -2 marks:** Poor structure or significant ambiguity.  

  **Threshold for A Grade:** To achieve 17+, the answer must (i) apply both accounts to both cases flawlessly, (ii) expose a problem for one account in (a), (iii) resolve the moral/artifact question in (b) with original reasoning, and (iv) avoid all listed mistakes. A B grade lacks one of these elements or has recurrent minor errors.
