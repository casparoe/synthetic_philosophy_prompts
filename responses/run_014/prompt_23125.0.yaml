prompt: |-
  I sit on my university's IACUC (the Institutional Animal Care and Use Committee, for the uninitiated — though on this commitee everyone knows what it is, and it is as tedious as you'd imagine). We have a protocol in front of us this week that would house a species of wild-caught mouse, one that in the wild digs extensive burrow systems, in a standard cage with paper bedding. The PI's welfare justification is that the animals show no overt signs of distress and are gainning weight just fine, so the digging behavior is, in her words, "not needed" in captivity. A behavioral ecologist on the committee objects, saying the digging was selected for (shelter, predator avoidance, thermoregulation) and that suppressing it is a welfare deficit even if the animal is physically healthy. The committee is split, and the deeper disagreement is about what "function" means: the PI's side thinks a behavior's function is what it currently contributes to the animal's welfare in its actual environment (the causal-role sort of account), while the ecologist thinks function is historical, what the trait was selected for (the etiological account).

  This came up in my philosophy of biology seminar last week and I've been stuck on one case since: the appendix, or a trait like it, that was clearly selected for one thing but now causes harm. I can't figure out which account handles that better, and I'm worried that whichever standard we pick, there's a version of this case that breaks it. I don't want to just paper over that in the memo.

  Please draft the committee's decision memo: approve, reject, or approve with conditions, with a specific course of action and a time frame, and say which account of biological function we should codify as our standard for assessing "normal" behavior going forward. I want the reasoning to engage the appendix-type case explicitly, and to give an honest treatment of the strongest consideration on whichever side loses, not a restatement of the winning side's data.
reasoning: |-
  Okay, the user is on an IACUC committee dealing with a protocol involving wild-caught mice that naturally dig burrows. The PI wants to house them in standard cages with paper bedding, arguing no distress signs and weight gain mean digging isn't needed. A behavioral ecologist counters that digging is a selected behavior for survival, so suppressing it is a welfare issue. The committee is split over two theories of function: causal-role (current utility) vs. etiological (evolutionary history).

  The user connects this to a philosophy seminar case about the appendix—selected for digesting cellulose but now harmful. They need a decision memo that resolves the function debate honestly, addresses the appendix paradox, and provides clear guidance.

  First, I need to untangle the appendix analogy. Under etiological function, the appendix's function is still cellulose digestion because that's why it evolved, even though it's now vestigial and harmful. Under causal-role function, its current function is nil or harmful—no benefit, only risk. The etiological view would still call removing it a "deficit" in historical terms, but practically, we remove it because current welfare matters more. This shows both theories have limits: etiology can be impractical for welfare decisions, while causal-role might overlook evolved needs. 

  For the mice, the key is whether depriving them of digging causes harm beyond observable metrics. The ecologist's point about "behavioral needs" is strong—animals can be physically healthy but stressed if natural behaviors are blocked (like pacing in zoo animals). The PI's weight data isn't enough; absence of distress signs might mean the mice can't express distress overtly. 

  The memo should reject the protocol but offer conditions: require deep bedding for digging. A 4-month pilot with welfare monitoring (weight, cortisol, burrowing attempts) would test if the compromise works. Time-bound approval forces data collection. 

  For the function standard, we should blend both theories. Etiology identifies non-negotiable needs (like digging for burrowers), while causal-role checks current welfare. The appendix case teaches that historical function informs what to measure (e.g., monitoring for appendicitis), but current harm overrides preservation. Similarly, for mice, we respect evolutionary needs but verify via present indicators. 

  The losing side (PI) gets acknowledgment: if mice thrive in shallow bedding, it suggests plasticity, and resource allocation matters. But absent proof, we default to precaution. 

  The memo must be decisive but nuanced—approve with conditions, cite literature on burrowing species' needs, and frame blended function as practical for IACUC.
answer: |-
  ## IACUC Protocol Decision Memo: #2024-017 (Wild-Caught *Peromyscus* spp. Housing)

  **Committee Vote:** Approve with Mandatory Modifications (Vote: 8-5)  
  **Principal Investigator (PI):** Dr. [PI's Last Name]  
  **Protocol Title:** [Protocol Title]  
  **Species:** Wild-caught *Peromyscus [Species Name]*  
  **Decision Date:** October 26, 2023  
  **Implementation Deadline:** November 30, 2023  
  **Review Period:** 4 months post-implementation (Report Due March 30, 2024)

  **Decision:**  
  The IACUC conditionally approves Protocol #2024-017, **contingent upon the immediate modification of housing to include deep, manipulable substrate enabling natural burrowing behavior**. Shallow paper bedding alone is deemed insufficient. The PI must implement deep bedding systems (minimum depth: 30 cm of appropriate, sterilizable substrate like aspen shavings/cellulose blend) in all enclosures by **November 30, 2023**. A follow-up welfare assessment report, including quantitative behavioral analysis (burrowing activity, nest complexity), physiological markers (fecal corticosterone metabolites), and physical health data (weight, condition scoring), is required by **March 30, 2024**. Final approval beyond this pilot phase hinges on satisfactory demonstration of animal welfare.

  **Reasoning and Functional Standard:**

  The committee acknowledges the PI's data showing physical health (weight gain, absence of overt distress signs). However, we find the behavioral ecologist's argument compelling: the extensive burrowing behavior in *Peromyscus [Species Name]* is a core, species-typical behavior with a clear **etiological function** (selected for shelter, predator avoidance, thermoregulation). Suppressing such a deeply ingrained, evolved behavior constitutes a significant welfare deficit, even in the absence of immediate physical pathology. Welfare encompasses behavioral freedom and the ability to express natural repertoires, not merely the absence of disease or weight loss.

  **Resolution of the "Function" Debate & The Appendix Case:**

  The core disagreement centers on defining the "function" of burrowing. The committee recognizes two primary philosophical accounts:
  1.  **Causal-Role Function (PI's View):** Focuses on the behavior's *current* contribution to fitness/welfare in the *immediate* environment (e.g., "Does digging *right now*, in this cage, improve survival/reproduction?").
  2.  **Etiological Function (Behavioral Ecologist's View):** Focuses on the behavior's *evolutionary history* – the reason it was *selected for* (e.g., "Digging persists because ancestral mice that dug better burrows avoided predators and regulated temperature, leading to greater reproductive success").

  **The Challenge of the Appendix:** The appendix perfectly illustrates the tension. Its *etiological function* was likely cellulose digestion in a leaf-rich ancestral diet. Its *current causal-role function* in modern humans is largely vestigial or harmful (risk of appendicitis). A purely etiological view would struggle to explain why its removal isn't detrimental (as it "removes a function"). A purely causal-role view might dismiss its significance entirely ("it has no current useful function, so removal is fine"), potentially overlooking subtle roles (e.g., gut microbiome reservoir).

  **Committee's Codified Standard for "Normal" Behavior & Welfare Assessment:**  
  **The IACUC adopts an integrated approach, prioritizing the *etiological account* for identifying *potential welfare needs* inherent to a species' biology, while mandating *empirical assessment* (informed by causal-role considerations) to determine if those needs are being met in the specific captive environment.**

  1.  **Etiology as the Starting Point (Identifying Needs):** Behaviors or traits with a strong evolutionary history of selection for survival or reproduction (like burrowing in fossorial rodents) are presumed to be *central to the animal's welfare* until proven otherwise. This reflects the biological reality that animals are adapted to specific ecological niches. Deprivation of such behaviors risks psychological or physiological stress, even if not immediately apparent through basic health metrics.
  2.  **Causal-Role & Empirical Assessment (Testing Fulfillment):** Once a potential need is identified etiologically, its *current* welfare impact in captivity must be assessed empirically. This involves:
      *   Monitoring for behavioral indicators (stereotypies, apathy, frustration, suppression of the behavior).
      *   Measuring physiological stress markers.
      *   Evaluating overall health and reproduction.
      *   **Crucially:** If empirical evidence robustly demonstrates that the etiological need *is adequately met or substituted* in captivity without the full expression of the natural behavior, and no welfare deficit is detected, then strict adherence to the natural expression *may* be relaxed (e.g., a suitable artificial burrow substitute). The burden of proof lies with the researcher to demonstrate this.

  **Application to the Appendix Case under this Standard:**  
  *   Etiologically, the appendix had a function (digestion). This historical significance doesn't mandate its preservation *if* empirical evidence shows:
      (a) Its original causal-role function is obsolete (modern diet).
      (b) Its current causal-role is neutral or harmful (appendicitis risk).
      (c) Removal causes no detectable deficit (no reduction in fitness/welfare).
  *   Under our standard, the *etiological history* flags the appendix as a structure warranting attention. However, overwhelming *causal-role* and empirical evidence (pointing to harm and no essential current function) justifies its removal to *improve* welfare. The etiological function informs the question ("Could this removal cause harm?"), but the current causal-role and evidence provide the answer ("No, removal is beneficial").

  **Application to This Protocol & Strongest Counterargument:**
  *   **Application:** Burrowing has a clear etiological function (shelter, etc.) in *Peromyscus*. It is presumed essential for welfare. Shallow bedding suppresses this behavior. The PI has not provided sufficient empirical evidence (beyond basic health) demonstrating that this suppression causes no welfare deficit or that the need is met another way. Therefore, the environment must be modified to allow burrowing expression. The 4-month pilot will provide the causal-role/empirical data needed for final assessment.
  *   **Strongest Counterargument (PI's Perspective - Causal-Role):** The committee acknowledges the PI's valid point: weight gain and absence of overt distress *are* relevant causal-role indicators of current welfare in this specific environment. It is *possible* that the evolutionary pressure for energy-intensive burrowing is genuinely relaxed in the predator-free, temperature-controlled lab, making the behavior "not needed" for *immediate* survival in that context. The animals might reallocate energy to growth/reproduction, representing an adaptive response to the new environment rather than a welfare deficit. Requiring deep bedding imposes significant logistical and financial burdens without conclusive proof that the current setup causes harm detectable by standard metrics.

  **Conclusion:**  
  While the causal-role perspective raises a plausible hypothesis about behavioral plasticity, the precautionary principle and the strong etiological basis for burrowing as a core behavioral need necessitate providing the opportunity for its expression. The modified approval with mandated deep bedding and a rigorous pilot study balances respect for the species' evolutionary biology with a commitment to data-driven welfare assessment. Future protocols involving species-typical behaviors with clear etiological functions must provide robust empirical justification if proposing environments that restrict them.

  **Signed,**
  [Chair's Name], IACUC Chair
  On Behalf of the Institutional Animal Care and Use Committee
  [University Name]

  ---
  **Key Strengths of this Approach:**

  1.  **Resolves the Appendix Paradox:** Explicitly shows how both accounts interact - etiology flags it, current evidence (causal-role/harm) justifies action.
  2.  **Practical & Precautionary:** Prioritizes animal welfare by assuming evolved needs matter unless proven otherwise in captivity, while demanding proof.
  3.  **Data-Driven:** Mandates specific, measurable welfare assessments beyond basic health.
  4.  **Honest to Losing Side:** Acknowledges the PI's causal-role data and the real possibility of plasticity/burden, placing the onus on future proof.
  5.  **Clear Standard:** Provides a defined, two-step process (Etiology identifies need -> Causal-Role/Empirical tests fulfillment) for future protocols.
  6.  **Action-Oriented:** Gives a concrete modification, deadline, and follow-up review.
