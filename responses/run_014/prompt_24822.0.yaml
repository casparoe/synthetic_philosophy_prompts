  Now, the user asks about "I'm not saying that he's guilty." This could imply the speaker believes he's guilty but doesn't want to state it directly. It's a case of implicature through flouting the maxim of quantity—withholding information suggests there's more to it, but being cautious.

  The unifying principle could be Grice's Cooperative Principle and the maxims. Implicatures arise when a maxim is flouted or violated, and the hearer infers meaning beyond what's said to maintain cooperation. Each example's implicature (or lack thereof) depends on context and which maxim is at play. The salt request is a speech act, not implicature. The "I think I passed" case is about sincerity, not maxim flouting. 

  The user's verdicts align with this principle. The exception is the salt example, which is better explained by speech act theory. Applying the principle to "I'm not saying he's guilty" shows a quantity-based implicature. The user wouldn't need to drop any verdicts; the salt case just fits a different pragmatic category. The key insight is that implicature relies on deliberate maxim exploitation where the speaker intends the inference.
answer: |-
  Based on your intuitive judgments and the desire for a unifying principle, **Grice's Cooperative Principle (CP) and Conversational Maxims** provide the best framework. Crucially, **conversational implicatures arise when a speaker *flouts* a maxim in a way that is *reasonably intended to be recognized by the hearer*, forcing the hearer to infer meaning beyond what is said to preserve the assumption of cooperation.** This principle explains your examples and clarifies the "I'm not saying" case.

  Here's the breakdown using Grice's Maxims (Quantity, Quality, Relation, Manner):

  1.  **"Some of the students passed the exam" (Implicates "Not all passed")**
      *   **Principle:** Flouts the **Maxim of Quantity** (Be as informative as required). The speaker knows *how many* passed but only says "some." The hearer infers: if "all" were true, saying "some" would be *less* informative than required (and violate Quantity). The speaker must believe "all" is false, otherwise they would/should have said it. The implicature is generated to preserve the assumption the speaker is cooperating.
      *   **Cancellability:** Adding "and in fact all did" cancels the implicature *because* it removes the flout – the speaker *is* now providing the required information.

  2.  **"You may bring a dog or a cat to the party" (No "not both" implicature)**
      *   **Principle:** No maxim is flouted. The speaker states the permission clearly using the inclusive "or." There's no reason to infer exclusivity. If the speaker meant "not both," they could easily have said so ("a dog or a cat, but not both"). The literal meaning satisfies the CP and maxims. Your intuition is correct.

  3.  **"I don't know whether it's raining or not" (No "not both" implicature)**
      *   **Principle:** No maxim is flouted. The speaker is being truthful (Quality) and maximally informative (Quantity) *about their state of knowledge*. The "or" here reflects the *alternatives* the speaker is uncertain about, not an exclusive choice offered to the hearer. There's no under-informativeness triggering an implicature. The reason it feels different from the permission case is context: one is granting options, the other is expressing epistemic uncertainty. The CP is satisfied.

  4.  **"He's a doctor" (Answer to "How's your health?") (Implicates relevance, e.g., "He's causing my health problems")**
      *   **Principle:** Flouts the **Maxim of Relation** (Be relevant). The answer seems irrelevant. The hearer infers: the speaker *must* intend this to be relevant somehow. The most likely relevance is that the doctor-status is the *cause* or *context* for the health issue. The implicature is generated to preserve the assumption the speaker is being cooperative/relevant.

  5.  **"Can you pass the salt?" (Means "Please pass the salt")**
      *   **Principle:** This is often classified as an **INDIRECT SPEECH ACT**, not primarily a conversational implicature derived from "can." While flouting Relation (why ask about ability when the need is obvious?) or Quantity (it's obvious I can) *might* play a role, the primary mechanism is recognizing the speaker's **illocutionary intent** (request) based on context, social norms, and convention. Your intuition that it "just means" the request is spot on. Gricean analysis struggles slightly here; Speech Act Theory (Austin, Searle) handles it better. It's borderline for pure implicature.

  6.  **"I passed the exam" (Speaker means "I think I passed")**
      *   **Principle:** This is **NOT a standard implicature**. The speaker is likely violating the **Maxim of Quality** (Do not say what you believe to be false). They are stating "I passed" as a fact when they only believe it to be true (or hope it is). The hearer might *detect the uncertainty* (e.g., from tone, context), but what the speaker *means* ("I think I passed") contradicts the literal assertion ("I passed"). This is closer to **misleading** or **insincerity** than generating an implicature. An implicature adds meaning *without* contradicting what is said. Your distinction is correct.

  **Applying the Principle: "I'm not saying that he's guilty"**

  *   **Analysis:** This flouts the **Maxim of Quantity** (Be as informative as required). The speaker explicitly denies *saying* he's guilty, but in a context where guilt is the topic, this denial begs the question: *What* *are* you saying/implying about his guilt? The most natural inference is that the speaker **implicates they *believe* he is guilty** (or have strong suspicions), but are unwilling to state it directly (perhaps for legal, social, or cautious reasons).
  *   **Implicature:** "I believe he is guilty (but I won't state it outright)." This is generated to preserve cooperation – the hearer assumes the speaker *is* providing relevant information about guilt, just indirectly via this denial of utterance. The flout triggers the implicature.

  **Does this force you to drop any of your verdicts?**

  *   **No, it largely confirms them.** The principle explains your judgments on "some" (Quantity flout -> implicature), permission "or" (no flout -> no implicature), uncertainty "or" (no flout -> no implicature), "doctor" (Relation flout -> implicature), and "I passed" vs "I think" (Quality violation, not implicature).
  *   **The Salt Request ("Can you..."):** This is the closest case. The Gricean principle might *try* to explain it as a Relation flout ("Why ask about ability? Oh, they must want me to *do* it!"). However, your intuition that it "just means" the request is strong. The principle doesn't *force* you to see it as an implicature derived from "can"; it allows you to classify it primarily as an indirect speech act, consistent with your view. You might slightly soften "I don't think it implicates anything derived from 'can'" to acknowledge the flout *might* contribute, but the core meaning is the directive intent.

  **In essence:** Conversational implicature arises from a *calculable* inference triggered by the *apparent flouting* of a conversational maxim, where the hearer assumes the speaker is still being cooperative and intends the inference. This principle powerfully explains when hearers are entitled to infer meaning beyond what is said, fitting your intuitive judgments remarkably well and providing a clear analysis of the "not saying" case.
