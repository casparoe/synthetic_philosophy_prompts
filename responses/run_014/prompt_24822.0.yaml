  Looking at the "some" example, the user accepts the "not all" implicature but notes it disappears if contradicted. That's cancellable, a key feature of implicature. For "you may bring a dog or a cat," they don't infer "not both." Why? Probably because permission for both doesn't violate any maxim. The disjunction here is inclusive, and there's no reason to assume exclusivity.

  The "I don't know whether it's raining" example is interesting. The user feels no "not both" implicature but for a different reason. Here, "or" is part of a knowledge claim, not a choice. The maxims aren't flouted; the speaker is being as informative as possible about their uncertainty. So no implicature arises.

  The "He's a doctor" response to a health question involves relevance. The answer seems off-topic, so the hearer infers relevance, like the health issue is related to being a doctor. This is a relevance implicature, triggered by the Cooperative Principle's maxim of relation.

  The "Can you pass the salt?" case is a classic indirect speech act. The user interprets it as a request, not a question about ability. This isn't implicature but a direct pragmatic interpretation where the literal meaning is overridden by context.

