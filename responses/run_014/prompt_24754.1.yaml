answer: |-
  Here’s a Q&A prep sheet tailored to your audience and thesis, prioritizing objections by damage potential, flagging contested points, and adhering to your constraints. The objections reflect likely audience perspectives, ordered from most to least damaging if fumbled.

  ---

  ### **Q&A Prep Sheet: Etiological Function’s Dependence on Causal Role**  
  **Core Thesis:** Etiological function ("selection-for") relies on prior causal-role function for *first functions* of novel traits. Causal-role account is more fundamental.  

  ---

  ### **Objection 1 (From Population Geneticist)**  
  **Phrasing:**  
  *"You’re conflating trait-level and organism-level fitness. Fitness is a statistical property of genotypes in a population. A new mutation’s ‘causal role’ doesn’t exist pre-selection because fitness is defined *by* differential survival. Until selection acts, the trait’s ‘effect’ is just noise in the fitness landscape. How can you call that a ‘function’?"*  
  **Reply (2-min):**  
  "Fitness differences *depend* on causal interactions. For selection to favor a novel trait, that trait must already contribute to survival/reproduction *in this specific environment*—e.g., a mutation for thicker fur *causes* better heat retention. Crucially, this causal contribution is measurable *before* selection reshapes the population. It’s not yet a ‘function’ in the teleological sense, but it *is* the causal-role basis that selection latches onto. No causal role, no selection-for."  
  **Soft Spot:**  
  If pressed: *"But fitness is population-relative—how can a pre-selection causal effect be ‘fitness-contributing’ without a population contrast?"*  
  ➔ **Contested:** Whether causal roles can be "fitness-relevant" pre-selection is disputed. Etiologicalists (e.g., Millikan) argue selection *defines* relevance.  

  ---

  ### **Objection 2 (From Etiologicalist)**  
  **Phrasing:**  
  *"This misunderstands ‘selection-for.’ We don’t need prior causal *functions*—we need *differential reproduction*. A novel trait’s effect (e.g., a protein folding faster) only becomes ‘selected-for’ when it causes a fitness difference. The causal role is just physics; selection makes it teleological."*  
  **Reply (2-min):**  
  "Agreed—selection adds normativity. But for selection to act, the trait must *already* cause a fitness difference. That difference-making *is* a causal role (e.g., faster protein folding *causing* more efficient metabolism). My point: etiological function *inherits* this causal role. Without it, ‘differential reproduction’ has no target. Your ‘just physics’ is my causal-role function."  
  **Soft Spot:**  
  *"Why call this pre-selection effect a ‘function’? It’s just a cause!"*  
  ➔ **Contested:** Whether "causal role" implies proto-teleology. Your thesis treats it as *functionally relevant* but not *normative*. Flag this as a boundary dispute.  

  ---

  ### **Objection 3 (From Population Geneticist)**  
  **Phrasing:**  
  *"Most novel mutations are neutral. Their ‘causal roles’ (e.g., biochemical effects) don’t impact fitness until drift or environment changes. How does your account handle traits that only become functional *later*, via exaptation?"*  
  **Reply (2-min):**  
  "Neutral traits lack *fitness-affecting* causal roles pre-selection—so no first function is acquired until selection acts on a *new* effect. Exaptation proves my point: when a trait is co-opted (e.g., feathers for flight), selection acts on a *new* causal role (aerodynamic properties), which existed pre-selection as a physical effect. Etiology still parasitizes causal role."  
  **Soft Spot:**  
  *"But the original trait (e.g., feathers for insulation) had no aerodynamic *function*—so how is selection ‘parasitic’ on a role that wasn’t functional?"*  
  ➔ **Acknowledge:** This relies on your core claim that selection-for requires a *prior causal effect* (even if not previously functional).  

  ---

  ### **Objection 4 (From Philosopher of Biology)**  
  **Phrasing:**  
  *"Aren’t you reviving Cummins’ causal-role account? But he explicitly rejects teleology. How can a non-teleological foundation support etiological norms?"*  
  **Reply (2-min):**  
  "I’m not reviving Cummins’ full account—only its *causal explanatory* core. Teleology enters via selection, but selection needs a causal handle. Think of it as: causal role (Cummins-style) provides the *material*, etiology provides the *historical norm*. Etiology can’t build norms without materials."  
  **Soft Spot:**  
  *"Doesn’t this imply all causal effects are ‘proto-functional’? That trivializes function."*  
  ➔ **Contested:** Whether "selection-for" requires *specificity* of causal roles. Etiologicalists (e.g., Neander) argue selection filters *which* effects count.  

  ---

  ### **Objection 5 (From Etiologicalist)**  
  **Phrasing:**  
  *"Your view collapses into backwards-looking causal role. But etiological function explains *why* a trait persists. If causal role is prior, how do you explain malfunction (e.g., a heart that can’t pump blood)?"*  
  **Reply (2-min):**  
  "Malfunction is where etiology shines! But for a *first* function, the trait *must* perform the causal role *initially* (e.g., the first heart pumped). Selection then stabilizes it. For novel traits, causal role is necessary for selection to get a grip; persistence comes later. Malfunction presupposes a history of successful causal roles."  
  **Soft Spot:**  
  *"What if a trait’s first instance *fails* its causal role but still spreads (e.g., via hitchhiking)?"*  
  ➔ **Critical:** If no initial causal success, selection can’t start. Etiologicalists may dispute this (e.g., Bigelow & Pargetter).  

  ---

  ### **Objection 6 (From Population Geneticist)**  
  **Phrasing:**  
  *"In population genetics, ‘fitness contribution’ isn’t trait-specific—it’s emergent from genotype-phenotype maps. Isolating a single trait’s ‘causal role’ is often reductive fiction."*  
  **Reply (2-min):**  
  "Agreed—fitness is systemic. But selection-for *targets* specific differences (e.g., "selection for fur density" implies denser fur *causes* fitness differences). We can isolate traits counterfactually: *but for* this trait, fitness would differ. That counterfactual depends on the trait’s causal role in the system."  
  **Soft Spot:**  
  *"In epistasis or pleiotropy, ‘but for’ fails—so no trait-specific causal role exists."*  
  ➔ **Contested:** Whether "selection-for" requires isolable traits. Your reply assumes modularity—flag as a live debate.  

  ---

  ### **Objection 7 (From Philosopher of Biology)**  
  **Phrasing:**  
  *"Doesn’t this make all adaptations ‘exaptations’? If every selected trait leverages prior causal roles, how is ‘first function’ different from Gould’s ‘exaptation’?"*  
  **Reply (2-min):**  
  "Exaptation co-opts a trait for a *new* causal role. ‘First function’ is when a trait’s *initial* causal role is selected. The difference is historical, but both rely on causal roles pre-selection. Etiologicalists (e.g., Millikan) concede this by requiring a trait’s ‘proper function’ to match the effect it was selected for—which was already a causal role."  
  **Soft Spot:**  
  *"But for first functions, there’s no ‘prior trait’—so isn’t it circular?"*  
  ➔ **Clarify:** The "prior" is logical, not temporal: selection *responds to* concurrent causal effects.  

  ---

  ### **The Objection You Hope Nobody Asks**  
  **Phrasing (From Sharp Etiologicalist):**  
  *"Your argument assumes selection acts on *actual* causal roles. But what matters is *heritable variance in fitness*. A trait could have a causal role (e.g., a mutation making butterflies brighter) that *reduces* fitness in generation one—yet if it correlates with a *different* heritable fitness factor (e.g., disease resistance), selection ‘for’ brightness occurs. Here, selection isn’t parasitic on brightness’ causal role—it’s parasitic on a statistical association."*  
  **Why It’s Deadly:**  
  It severs the link between a trait’s causal role and selection-for, using population genetics to argue selection can target non-functional correlates.  
  **Reply Strategy:**  
  1. **Concede:** "This is a strong point—selection can act on correlates."  
  2. **Reframe:** "But for the trait to *acquire* a function, selection must *stabilize* because of its causal role. If brighter butterflies are selected due to disease resistance, brightness has no function—it’s a spandrel. First functions require the causal role to *be* the difference-maker."  
  3. **Fallback:** "If selection acts purely on correlates, the trait *never* acquires a function—it remains an inert marker. Etiology still needs causal roles to ground *functional* traits."  
  **Vulnerability:**  
  Etiologicalists may argue selection *can* assign functions to correlates (e.g., in signaling systems). Have citations ready (e.g., Godfrey-Smith on "proto-information").  

  ---

  ### **Key Contested Points to Flag**  
  1. **Causal roles as "fitness-contributing" pre-selection:** Not settled. Etiologicalists see fitness as defined by selection.  
  2. **Trait-level vs. systemic fitness:** Population geneticists often reject trait isolation; your account requires it.  
  3. **Specificity of "selection-for":** Dispute over whether selection can target non-causal correlates (per "hoped-nobody-asks" objection).  
  4. **Exaptation vs. first function:** Etiologicalists distinguish them; your view blurs them.  

  **Prep Advice:**  
  - Cite examples where causal roles are measurable pre-selection (e.g., CRISPR mutations in lab environments).  
  - For biologists: Stress that you’re not reducing fitness to traits, but arguing selection *requires* trait-level causal differences.  
  - For etiologicalists: Emphasize that you accept normativity comes from history—but history needs a foothold.  

  Good luck—your thesis is a grenade in this room. Tread carefully on contested ground!
