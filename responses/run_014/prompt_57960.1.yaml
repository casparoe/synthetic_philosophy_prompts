  2.  (1) and (2) are in tension: (1) claims *all* features can vary in normative valence (for/against/neutral), but (2) claims deceit *always* counts against, never for or neutral, making deceit a necessary exception to holism that demands justification. Revision costs involve defending deceit's unique invariant disvalue or weakening (1).
  3.  (3) and (5) are in tension: (3) requires true general principles *explain* every right act, even if complex, but (5) claims competent judges often *cannot state* the principles governing their correct judgments. This creates a practical gap between explanation and articulation; a cheap revision is clarifying that (3) doesn't require judges to *state* the principle, only that it exists.
  4.  (1) and (4) are compatible: (4) exemplifies (1) by showing how "avoiding inconvenience" functions as a reason *for* borrowing in the flood case but *against* it in the inspection case, demonstrating holism without needing a further unifying principle.
  5.  (5) supports (1) and (4): The perceptual skill model of competence (5) naturally coheres with the contextual sensitivity required by holism (1) and the verdicts in the strimmer cases (4), where nuanced judgment trumps simple codification, presenting no tension.
