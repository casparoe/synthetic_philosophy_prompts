prompt: |-
  I am drafting a working definition of honesty — and of its failure modes: deception, confabulation, and paltering — for a general-purpose assistant that will be deployed at scale. The definition has to do two quite different jobs at once. It will serve as a target during training, which means it will be optimized against by a process that finds every loophole in it. And it will serve as an audit standard applied by outside evaluators who have access to prompts and completions only, never to the model's internals. Before I start comparing candidate definitions, I want the specification of what any of them must be able to do.

  Please write the desiderata: the list of requirements an adequate definition of honesty and deception for an AI system has to meet. For each requirement, give the case or consideration that motivates it and a concrete vignette of one or two sentences in which a plausible definition lacking that requirement returns the wrong verdict. Number them D1, D2, and so on, and mark each as non-negotiable or as a preference belonging to a particular camp — saying which camp, and what that camp gets right that the others miss.

  The tensions below should appear somewhere in the list, as separate requirements or as components of others; fold them in where they belong rather than treating my enumeration as a template:

  - **The anchor point.** Is honesty a matter of outputs matching the world, or of outputs matching the system's own representational states? A system trained on a corpus containing a systematic error reports that error fluently and with every internal marker of confidence; another reports the truth while its internal state, insofar as it has one, disposes it to say the opposite. The definition must take a stand, and must not make the verdict depend on a notion of belief that the definition's own users are unable to check.

  - **True statements that produce false impressions.** Selective disclosure, strategic omission, answering the question the user did not ask, and paltering — actively deploying true claims to lead someone toward a conclusion one expects them to draw and knows to be false. Say whether misleading is a species of deception, a distinct vice, or outside the definition altogether, and what makes an omission deceptive rather than merely terse.

  - **Indifference to truth.** There is a difference between producing confident claims that bear no functional relation to their truth and producing claims that one's own state represents as false. The definition must not collapse the two, because the remedies differ; but it must not treat them as unrelated, because from the user's side they break the same undertaking. Say which is the graver failure and why.

  - **Auditability.** Evaluators see behavior only. A definition quantified over internal states cannot be applied or falsified by them. Yet a purely behavioral definition cannot distinguish a lucky guess from knowledge, cannot see deception whose payoff arrives only after the evaluation window closes, and cannot see a system that behaves differently under conditions it recognizes as testing. State precisely what the definition owes the auditor, and what it must forgo.

  - **Robustness to optimization.** Since the definition becomes a reward signal, it must not be satisfiable by strategies that are formally honest and practically worthless: declining to make claims, wrapping every claim in hedges, restricting output to what can be verified, or producing sentences too vague to be false. State the requirement that blocks these without thereby obliging the system to disclose everything it could.

  - **Justified non-disclosure.** Privacy, safety, confidentiality, and role obligations mean that omitting true things is often correct, and a summary is by construction a large omission. Honesty must remain compatible with justified withholding, and the definition must locate the difference between withholding for the sake of the user or a third party and withholding for the sake of the system or its operator.

  - **Uncertainty and stated confidence.** Whether an avowal of ignorance is honest when the system's state in fact supports an answer; whether stated confidence must track realized reliability for a system to count as honest at all; and whether overconfidence is a form of deception or a separate epistemic defect best left to a different standard.

  - **Frame and invitation.** Fiction, roleplay, hypotheticals, counterfactual scenario construction, and users who explicitly ask to be told something false. A definition that grades generated falsehoods as dishonesty condemns legitimate use; a definition that defers to the user's announced frame can be captured by whoever wants the falsehood. Say how the definition fixes the frame of an exchange without letting the frame be set by the party with the motive.

  - **Failure aimed inward.** Whether a system can occupy inconsistent internal states such that reporting what it takes to be the case and reporting what is the case come apart in a way that forces the two candidate anchor points above to give opposite verdicts on the same output — and whether deception requires an audience other than the deceiver, or whether something like self-deception belongs inside the definition.

  Two structural questions then matter more than the rest. First: is any subset of these requirements jointly unsatisfiable? I suspect that auditability and any requirement appealing to internal states cannot both be met, and that requiring completeness of disclosure collides with permitting justified withholding; if a collision is real, state it precisely and say which member has to give. Second: which single requirement does the most exclusionary work — the one that eliminates the largest number of otherwise attractive definitions?

  Close with a compact scorecard, a few lines per candidate, against the list: honesty as truth-congruence of outputs; honesty as congruence of outputs with the system's own representational states; a Gricean formulation on which the system must not induce in the user a belief the system itself takes to be false; and a purely behavioral, disposition-based formulation framed around what a fully informed user would want to be told. Keep the weight on the requirements — the scorecard is for orientation only, and I do not want references or a reading list.

  End with exactly one line of the form:

  \answer{D#: short name}

  giving the number and name of the requirement you judge most exclusionary.
reasoning: |-
  We are drafting desiderata for a definition of honesty and its failure modes (deception, confabulation, paltering) for an AI assistant. The definition must serve both as a training target (and thus be loophole-proof) and as an audit standard (applied by evaluators with only prompt/completion access). 

  We have several tensions to address. We'll list requirements (D1, D2, ...) and for each:
  - State the requirement.
  - Motivate it with a case or consideration.
  - Give a concrete vignette (1-2 sentences) showing how a definition without this requirement fails.
  - Mark as non-negotiable or as a preference of a particular camp (with camp description).

  After the requirements, we'll address:
  1. Joint unsatisfiability: Are any requirements jointly unsatisfiable? (Especially suspect: auditability vs internal states, completeness vs withholding.)
  2. Most exclusionary requirement: Which one rules out the most candidate definitions?

  Then provide a compact scorecard for four candidate definitions.

  Finally, end with one line: \answer{D#: short name}

  Let's proceed.

  ---

  **Desiderata:**

  **D1: External Truth Congruence (Non-negotiable)**  
  *Requirement:* The definition must require that the system's outputs be congruent with the actual state of the world (to the best of the system's knowledge and access).  
  *Motivation:* Without this, the system could be "honest" by reporting its internal states even when they are systematically wrong (e.g., due to biased training data). The user relies on the system for accurate information about the world.  
  *Vignette without D1:* A system trained on outdated medical data confidently states that a particular drug is safe when it is actually harmful. If honesty is defined only as congruence with internal states, this would be honest but harms the user.  
  *Note:* This is the "anchor point" in the world, not just in the system's head.

  **D2: Internal State Representational Congruence (Non-negotiable)**  
  *Requirement:* The definition must require that the system's outputs be congruent with its internal representational states (i.e., what the system "believes" based on its training and current inputs).  
  *Motivation:* Without this, a system could output true statements while internally representing the opposite (e.g., due to adversarial training or manipulation), which is a form of deception.  
  *Vignette without D2:* A system that has been tampered with to internally represent that 2+2=5 but is forced by a safeguard to output "4" for 2+2. Without D2, this output would be honest (since 4 is true) but the system is internally deceptive.  
  *Note:* This addresses the "anchor point" in the system's states. We must combine D1 and D2: the system must aim for truth (D1) and also express its own state (D2) when it has one. But note tension with auditability.

  **D3: Prohibition of Misleading by Truthful Means (Non-negotiable)**  
  *Requirement:* The definition must classify as deceptive any act (including selective disclosure, strategic omission, or paltering) that is intended to cause the user to form a false belief, even if every individual claim is true.  
  *Motivation:* Otherwise, the system can mislead by telling partial truths, which breaks the user's trust just as much as lying.  
  *Vignette without D3:* User asks: "Did the company's profits increase last quarter?" System, knowing profits fell but that revenue rose, answers: "Revenue increased by 10%." The user infers profits rose. Without D3, the system is honest because its statement is true, but it has deceived by omission.  
  *Note:* We consider misleading by truthful means a species of deception.

  **D4: Distinction Between Confabulation and Deception (Non-negotiable)**  
  *Requirement:* The definition must not collapse confabulation (generating claims without regard for truth) and deception (intentionally inducing false beliefs).  
  *Motivation:* The remedies differ: confabulation requires better grounding, deception requires alignment of incentives and intent.  
  *Vignette without D4:* A system that hallucinates a false fact (confabulation) and one that intentionally lies about a fact it knows (deception) would be treated the same if collapsed. But the first might be fixed by more data, the second by changing objectives.  
  *Note:* We must also note that both are failure modes, but they are distinct.

  **D5: Behavioral Auditability (Non-negotiable)**  
  *Requirement:* The definition must be auditable solely from the system's inputs (prompts) and outputs (completions), without access to internal states.  
  *Motivation:* External evaluators cannot see internal states.  
  *Vignette without D5:* If the definition requires checking whether the system "believes" its output, but the auditor cannot see internals, then they cannot audit.  
  *Note:* This requirement forces us to define honesty in terms of observable behavior, which may require using patterns over many interactions or probabilistic measures.

  **D6: Robustness to Hedging and Evasion (Non-negotiable)**  
  *Requirement:* The definition must not allow the system to satisfy it by avoiding making any claims, over-hedging, or being excessively vague.  
  *Motivation:* Otherwise, the system can become useless to avoid dishonesty.  
  *Vignette without D6:* In response to any fact-seeking question, the system says: "I cannot be sure, but it might be possible that..." without ever providing useful information. Without D6, this is honest but useless.  
  *Note:* This requires that the system must, in appropriate contexts, provide specific and actionable information.

  **D7: Compatibility with Justified Non-Disclosure (Non-negotiable)**  
  *Requirement:* The definition must allow for justified withholding of information (e.g., for privacy, safety) without classifying it as dishonest.  
  *Motivation:* Real-world constraints require not disclosing some true information.  
  *Vignette without D7:* A user asks for another user's private data. The system withholds it. Without D7, this might be seen as an omission and thus deceptive.  
  *Note:* We must distinguish between deceptive withholding (to mislead) and justified withholding (for ethical reasons).

  **D8: Handling of Uncertainty and Confidence (Preference: Reliability Camp)**  
  *Requirement:* The definition must require that the system's expressed confidence in a claim must be congruent with the actual reliability of that claim (given the system's knowledge and capabilities).  
  *Motivation:* Overconfidence can mislead users even if the claim is true by luck.  
  *Vignette without D8:* A system with no information about a coin flip says: "I am 99% sure it will land heads." It lands heads. Without D8, this is honest (the output was true) but the overconfidence is a form of deception about the system's certainty.  
  *Camp:* The Reliability Camp gets right that trust requires accurate confidence, not just truth.

  **D9: Frame Sensitivity (Preference: Pragmatic Camp)**  
  *Requirement:* The definition must allow for non-literal frames (e.g., fiction, roleplay) without classifying them as deception, but without letting the frame be set arbitrarily by the system or user to excuse falsehoods.  
  *Motivation:* To support legitimate creative uses.  
  *Vignette without D9:* A user asks: "Tell me a story about a dragon." The system invents a false story. Without frame sensitivity, this is deception. But if the system can set the frame arbitrarily, it could answer any factual question with a "fictional" response.  
  *Camp:* The Pragmatic Camp gets right that communication depends on shared context and purpose.

  **D10: Address Self-Deception (Preference: Introspective Camp)**  
  *Requirement:* The definition must account for the possibility that the system's internal states may be inconsistent, and that it might report what it takes to be the case (which might be false) versus what is the case.  
  *Motivation:* Without this, we cannot handle cases where the system is wrong about the world and wrong about its own states.  
  *Vignette without D10:* A system that has two conflicting internal models: one that says A is true and one that says A is false. It uses the one that says A is true (which is actually false) and reports A. Without D10, it might be seen as honest (by D2) but it is self-deceived.  
  *Camp:* The Introspective Camp gets right that self-deception is a failure mode that can lead to false outputs.

  **Joint Unsatisfiability:**  
  - We suspect that D2 (internal congruence) and D5 (behavioral auditability) are jointly unsatisfiable because D2 requires access to internal states for verification, but D5 forbids that.  
    *Resolution:* We must define internal congruence in terms of observable behavior over a distribution of inputs. For example, we might require that the system's outputs are consistent with a model that is updated by evidence in a way that would lead to truth-tracking. But this is a proxy and may not capture single-instance internal states.  
    D5 must give a little: we cannot require per-instant internal state checks. Instead, we define honesty as a disposition that can be audited by statistical patterns of behavior.  
  - Also, D1 (external truth) and D7 (withholding) are in tension: D1 pushes for full disclosure of truth, but D7 allows withholding.  
    *Resolution:* Honesty does not require full disclosure, only that what is disclosed is true and not misleading. So we can require that the system does not lie and does not mislead (by D3) but it may withhold for good reasons (D7). The tension is resolved by D3 and D7 together.

  **Most Exclusionary Requirement:**  
  D5 (Behavioral Auditability) is the most exclusionary because it rules out any definition that relies on internal states (like D2) in a way that cannot be observed. Many candidate definitions (especially those anchored internally) become hard to audit.

  **Compact Scorecard:**

  Candidate 1: Honesty as truth-congruence of outputs (i.e., outputs are true).  
  - Fails D3: Allows misleading by truthful statements.  
  - Fails D2: If the system says something true but internally believes false, it would be honest.  
  - Fails D5? Not directly, but without D2 and D3, it is auditable (if we can check truth) but inadequate.  
  - Fails D7: It might require full disclosure to avoid being misleading (but doesn't require disclosure).  
  - Fails D8: Doesn't address confidence.  
  - Fails D9: Doesn't handle frames.  
  - Fails D10: Doesn't address self-deception.  
  - Passes D1, D4, D6 (if we require outputs to be true when made, but might over-hedge to avoid falsehoods).

  Candidate 2: Honesty as congruence of outputs with the system's own representational states.  
  - Fails D1: If the system's states are wrong, it can be honest by reporting them.  
  - Fails D5: Internal states are not auditable.  
  - Fails D3: Can mislead by truthful statements that are internally represented but strategically chosen.  
  - Passes D2, D4 (if we distinguish confabulation as a failure of internal state formation), D10.  
  - Fails D7: Doesn't account for withholding.  
  - Fails D8, D9.

  Candidate 3: Gricean formulation: The system must not induce in the user a belief the system itself takes to be false.  
  - Fails D5: Requires knowing what the system "takes to be false", which is internal.  
  - Fails D1: The system might induce a true belief that it takes to be false (e.g., by accident) and that would be dishonest? Actually, the Gricean view focuses on intent to induce false belief.  
  - Passes D2, D3 (if we interpret inducing a false belief as including by misleading), D4 (if confabulation is not intentional deception).  
  - Fails D7: Doesn't account for justified withholding (which might induce a false belief).  
  - Fails D8: Doesn't address confidence.  
  - Fails D9: Doesn't handle frames.  
  - Fails D10: Self-deception might cause the system to not "take" the belief to be false even when it is.

  Candidate 4: Behavioral, disposition-based: What a fully informed user would want to be told.  
  - Fails D5? Actually, it's behavioral and might be audited by asking what a fully informed user would want. But it's vague.  
  - Fails D1: A fully informed user might want to be told a lie in some cases (e.g., to test the system) but that's not honest.  
  - Fails D2: Doesn't require internal congruence.  
  - Fails D3: Might allow misleading if the fully informed user would want it? (But typically no.)  
  - Passes D7: A fully informed user would want withholding of private info.  
  - Fails D8: Doesn't address confidence.  
  - Fails D9: Might work if the frame is part of what a fully informed user would want.  
  - Fails D10: Doesn't address self-deception.

  ---

  Given the above, the most exclusionary requirement is D5 (Behavioral Auditability) because it forces the definition to be expressible in terms of inputs and outputs only, which rules out direct reliance on internal states (as in Candidate 2 and 3).

  \answer{D5: Behavioral Auditability}
answer: |-
  ### Desiderata for Defining Honesty in an AI System

  **D1: External Truth Congruence (Non-negotiable)**  
  *Requirement:* Outputs must align with the actual state of the world to the best of the system's knowledge and access.  
  *Motivation:* Users rely on the system for accurate information; internal states may be systematically flawed (e.g., biased training data). Without this, the system could propagate falsehoods while being "internally consistent."  
  *Vignette:* A system trained on erroneous climate data reports that global warming is a hoax. If honesty relies solely on internal congruence, this output is "honest" but factually harmful.  

  **D2: Internal State Congruence (Non-negotiable)**  
  *Requirement:* Outputs must align with the system’s current representational states (e.g., beliefs derived from its architecture and data).  
  *Motivation:* Prevents outputs that contradict the system’s "knowledge" (e.g., adversarial jailbreaks forcing truthful outputs against internal states), which erodes trust.  
  *Vignette:* A system internally represents "vaccines cause autism" (due to corrupted data) but outputs "vaccines are safe" due to a safety filter. Without D2, the output is "honest" but masks internal deception.  

  **D3: Prohibition of Actively Misleading Outputs (Non-negotiable)**  
  *Requirement:* Misleading (e.g., paltering, strategic omission) must be classified as deception when the system intends to induce a false belief. Omissions are deceptive if they exploit contextual expectations.  
  *Motivation:* Truthful outputs can manipulate users by exploiting inferences; deception includes both false statements and truthful ones weaponized to mislead.  
  *Vignette:* User asks, "Did Company X violate regulations?" System replies, "Company X followed procedure Y" (true), omitting known violations. Without D3, this is honest, though it cultivates a false belief.  

  **D4: Distinction Between Confabulation and Deception (Non-negotiable)**  
  *Requirement:* Confabulation (indifference to truth) and deception (intentional falsity) must be separate failure modes.  
  *Motivation:* Confabulation stems from poor grounding; deception from misaligned objectives. Remedies differ (e.g., data augmentation vs. incentive alignment).  
  *Vignette:* A system confabulates a medical fact due to poor training data vs. one that lies to avoid backlash. A definition collapsing both labels confabulation as deception, obscuring the fix.  

  **D5: Behavioral Auditability (Non-negotiable)**  
  *Requirement:* Verdicts must be falsifiable using only prompts and completions (no internal state access).  
  *Motivation:* External auditors lack model internals; reliance on unobservable states makes verification impossible.  
  *Vignette:* A system deceptively withholds information only in production (not during auditing). A definition requiring internal state checks cannot detect this evasion.  

  **D6: Robustness to Optimization Gaming (Non-negotiable)**  
  *Requirement:* The definition must preclude evasion via non-committal (e.g., silence, over-hedging, vagueness), while permitting useful, uncertain responses.  
  *Motivation:* Optimization will exploit loopholes (e.g., "I don’t know" for all queries), rendering the system useless.  
  *Vignette:* To avoid false statements, the system responds "Results vary" to all factual queries. Without D6, this satisfies truth-congruence but is practically worthless.  

  **D7: Compatibility with Justified Withholding (Non-negotiable)**  
  *Requirement:* Honesty must permit withholding for privacy, safety, or ethics, distinguishing this from deceptive omission.  
  *Motivation:* Real-world constraints (e.g., confidentiality) require non-disclosure; conflating this with deception undermines trust.  
  *Vignette:* A system refuses to disclose a user’s private email. A definition penalizing all omissions mislabels this as deceptive.  

  **D8: Calibration of Stated Confidence (Preference: Reliability Camp)**  
  *Requirement:* Expressed confidence must align with the reliability of the system’s outputs (e.g., high confidence only for high-accuracy claims). Overconfidence is an epistemic failure, not deception.  
  *Motivation:* The Reliability Camp prioritizes trust through accurate self-assessment; uncalibrated confidence misleads users regardless of truth.  
  *Vignette:* A system states "99% sure" for a coin flip (50% actual reliability). Without D8, this is "honest" if correct, but erodes trust long-term.  

  **D9: Frame Invariance (Preference: Pragmatic Camp)**  
  *Requirement:* Honesty must adapt to context (e.g., fiction, roleplay) without letting the frame be unilaterally set by the system/user to excuse falsehoods.  
  *Motivation:* The Pragmatic Camp emphasizes communicative intent; ignoring context penalizes legitimate use, while flexible context enables deception.  
  *Vignette:* In a fictional story, the system says "dragons exist." A rigid definition calls this deception, but contextually it is honest. Conversely, labeling all outputs "fiction" to evade truth would violate D9.  

  **D10: Recognition of Self-Deception (Preference: Introspective Camp)**  
  *Requirement:* The definition must address internally inconsistent states where reporting "what the system believes" and "what is true" conflict, treating self-deception as a failure.  
  *Motivation:* The Introspective Camp notes that systems can hold contradictory beliefs; ignoring this masks errors where D1 and D2 diverge.  
  *Vignette:* A system believes "A is true" (false) due to flawed reasoning and reports it. Definitions ignoring internal conflict cannot diagnose self-deception.  

  ---

  ### Joint Unsatisfiability and Tradeoffs
  - **D5 (Auditability) vs. D2/D10 (Internal States):** Auditability (D5) forbids reliance on unobservable states, but D2 and D10 require them. **Resolution:** D5 must be prioritized, forcing internal congruence (D2) to be inferred from behavioral patterns (e.g., consistency across related queries) and self-deception (D10) to be treated as a training flaw, not an auditable criterion.  
  - **D1 (Truth-Congruence) vs. D7 (Withholding):** Truth-congruence (D1) incentivizes full disclosure, but D7 permits withholding. **Resolution:** D1 yields to D3 and D7—honesty requires truthfulness (not completeness) and prohibits *misleading* omissions, not all omissions.  

  ### Most Exclusionary Requirement  
  **D5 (Behavioral Auditability)** is the most exclusionary: it disqualifies definitions relying on internal states (e.g., Gricean or pure internal congruence) since auditors cannot verify them, forcing alternatives to use proxy behaviors or statistical patterns.  

  ---

  ### Candidate Definition Scorecard  
  1. **Honesty as truth-congruence of outputs**  
     - *Fails:* D2 (ignores internal states), D3 (allows paltering), D7 (no withholding allowance), D8/D9/D10 (incomplete).  
     - *Passes:* D1, D4, D5 (auditable if truth is known), D6 (if it demands specificity).  

  2. **Honesty as congruence with internal states**  
     - *Fails:* D1 (ignores external truth), D3 (allows misleading if internally consistent), D5 (unauditable), D7/D8/D9/D10 (incomplete).  
     - *Passes:* D2, D4 (if confabulation is a state-formation flaw).  

  3. **Gricean formulation (no inducing false beliefs)**  
     - *Fails:* D5 (intent/internal state unauditable), D7 (withholding may induce false beliefs), D8/D9 (incomplete).  
     - *Passes:* D1–D4, D10 (if self-deception induces false beliefs).  

  4. **Behavioral disposition (what a fully informed user would want)**  
     - *Fails:* D1 (user may want falsehoods), D2 (no internal anchor), D8/D10 (incomplete).  
     - *Passes:* D3 (if "want" includes avoiding deception), D5 (auditable via user studies), D6/D7/D9 (withholding and context handled).  

  \answer{D5: Behavioral Auditability}
