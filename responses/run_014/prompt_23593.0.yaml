answer: |-
  Here's a breakdown of the tension in Grice's framework and an argument for why speaker meaning (as defined by Grice) is problematic as the foundation for conversational implicature, followed by a sketch of a non-circular alternative:

  **The Core Tension: Circularity in Intention Recognition**

  1.  **Grice's Definition of Speaker Meaning (Non-Natural Meaning - Meaning_NN):**
      Grice defines what a speaker *means* by an utterance as a complex intention:
      *   S (Speaker) utters X intending:
          *   (i) To produce a certain response r (e.g., a belief, an action) in A (Audience).
          *   (ii) That A recognize intention (i).
          *   **(iii) That A's recognition of intention (i) function as (at least part of) A's reason for producing r.**

      This **reflexive or mutually manifest intention** (especially (ii) and (iii)) is the cornerstone. Meaning arises when the audience recognizes the speaker's intention to be recognized.

  2.  **Conversational Implicature Rests on Speaker Meaning:**
      Grice defines conversational implicature as something a speaker *means* (implies) *by* saying something else (what is said). Crucially, calculating an implicature relies on the Cooperative Principle (CP) and the Maxims (Quality, Quantity, Relation, Manner).

  3.  **The Problem: Generating Common Ground Requires Common Ground:**
      The process of calculating an implicature works roughly like this:
      *   A observes S's utterance X (what is said).
      *   A assumes S is being cooperative (following CP and Maxims).
      *   Taken literally, X might appear to violate a maxim (e.g., being less informative than required, irrelevant, etc.).
      *   A infers that S must be implicating some proposition Q, which, *if assumed true*, would make X cooperative/non-violating after all.
      *   Crucially, A must *recognize* S's *intention* for A to make this inference.

      **The Circularity/Under-determination:**
      *   **Recognizing the Intention Presupposes Cooperation:** For A to recognize S's reflexive intention *to implicate Q* (which is part of what S *means*), A must already believe that S is being cooperative and intends A to recognize that cooperation. How does A know S is being cooperative *before* figuring out what S means/implicates? Recognizing the intention to cooperate *is* recognizing a core communicative intention.
      *   **CP/Maxims Presuppose Shared Understanding:** The CP and Maxims are normative expectations about rational, cooperative communication. For them to be effective tools for A to *infer* S's meaning (the implicature Q), A and S must *already share* a significant common ground regarding:
          *   What counts as cooperative behavior in this context.
          *   What constitutes relevance, sufficient information, etc., in this context.
          *   Crucially, **the very expectation *that* S has Gricean communicative intentions** (i.e., the intention to be recognized as intending to communicate cooperatively).
      *   **The Bootstrapping Problem:** The CP and Maxims are supposed to be the *mechanism* that allows new information (the implicature Q) to enter the common ground or be mutually understood. However, *applying* this mechanism effectively *requires* that significant common ground (including mutual knowledge of communicative intentions and cooperation) *already exists*. The mechanism presupposes the very thing it is supposed to generate or operate within. How could this mutual knowledge *ever* be established initially using only this mechanism?
      *   **Under-determination:** Without pre-existing robust common ground about intentions and cooperation, the CP/Maxims are radically under-determining. Faced with an utterance that *seems* uncooperative, A might have multiple hypotheses:
          *   S is incompetent (not following maxims unintentionally).
          *   S is uncooperative (flouting the CP intentionally).
          *   S is implicating Q1.
          *   S is implicating Q2.
          *   The context defines "sufficient information" or "relevance" differently than A initially thought.
          The CP/Maxims alone, without prior strong assumptions about S's *intentions* to communicate cooperatively and be understood, don't provide sufficient constraints to reliably pick out the intended implicature Q. The recognition of the reflexive intention *is* that prior assumption.

  **Why Speaker Meaning is the Wrong Foundation for Implicature:**

  *   Grice bases implicature on speaker meaning.
  *   Speaker meaning is defined by complex, reflexive intentions.
  *   Recognizing these intentions *requires* mutual knowledge/strong common ground about communicative goals, rationality, and cooperation (the CP/Maxims themselves).
  *   But the CP/Maxims are the tools *used to calculate* implicatures (and thus recognize the speaker's meaning).
  *   **Therefore:** The definition of speaker meaning (and thus implicature) *presupposes* the common ground that the CP/Maxims are supposed to help establish or operate within during implicature calculation. This creates a vicious circle: recognizing the intention (meaning) requires CP/Maxims, but applying CP/Maxims effectively requires recognizing the intention. It makes the account either circular or unable to explain how implicature could bootstrap shared understanding in the first place.

  **Sketch of a Non-Circular Account of Implicature**

  A non-circular account needs to ground implicature in something other than mutually recognized reflexive intentions *as the starting point*. It needs to explain how mutual understanding and cooperation emerge from more fundamental interactions. Here are key elements:

  1.  **Focus on Publicly Manifested Evidence & Effects:** Ground communication less in private intentions and more in the publicly observable effects utterances have in a context, and the norms governing those effects. Meaning arises from patterns of use and response, not solely from decoding internal states.
  2.  **Conventions, Norms, and Signaling Systems:** Prioritize established linguistic conventions, social norms of conversation, and the evolution of signaling systems. Implicatures often rely on *conventionalized* patterns of flouting maxims (e.g., irony, understatement) or contextual norms of relevance. These conventions/norms are publicly accessible patterns of behavior, not purely mental states.
  3.  **Relevance as a Cognitive Principle (Relevance Theory):** Dan Sperber and Deirdre Wilson's Relevance Theory offers a prime example. It replaces Grice's multiple maxims with a single cognitive principle: humans automatically orient towards maximizing *relevance* (cognitive effects relative to processing effort).
      *   **Processing:** The hearer processes the utterance (including encoded meaning) in the context, seeking an interpretation that provides adequate cognitive effects (new information, confirmation, contradiction) for minimal processing effort.
      *   **Implicature Emerges:** The implicature is whatever contextual assumptions and conclusions the hearer must supply to arrive at an interpretation that satisfies the expectation of relevance created by the act of communication itself. The expectation of relevance is argued to be a fundamental cognitive bias, not presupposing complex mutual knowledge of intentions.
      *   **Avoids Circularity:** The expectation of relevance is posited as a general cognitive trait of humans processing information. The hearer uses this principle, the linguistic code, and contextual information to derive meaning. While speaker intentions may *guide* the speaker's production, the hearer's comprehension process is driven by the search for relevance in the ostensive stimulus (the utterance), not primarily by recursively recognizing complex intentions. The common ground is built incrementally through the process of establishing mutual manifestness of information during communication, rather than being a strict prerequisite.
  4.  **Game-Theoretic/Evolutionary Foundations:** Some approaches model communication as a coordination game or an evolved signaling system. Conventions for implicature can emerge as stable solutions where speakers and hearers converge on interpretations that benefit both, based on observable regularities and payoffs, without requiring deep mutual knowledge of internal intentions from the outset. Shared expectations arise from repeated interactions and learning.
  5.  **Salience and Defaults:** Non-circular accounts often incorporate notions of salient interpretations or default inferences based on statistical regularities in language use and world knowledge, which can be triggered by the utterance form and context without recursive intention recognition being the primary engine.

  **In essence:** A non-circular account avoids grounding implicature *definitionally* in reflexive intentions. Instead, it explains implicature as emerging from:
  *   General cognitive principles (like Relevance),
  *   Public linguistic conventions and social norms,
  *   The dynamics of interaction within evolving signaling systems or games,
  *   The processing of publicly available evidence (utterance form + context) to achieve cognitive effects efficiently.
  The common ground necessary for sophisticated implicatures is seen as a *product* of these processes operating over time and interactions, not as a strict prerequisite defined by complex mental states. Speaker intentions play a role in production but are not the *foundational* element defining meaning or driving comprehension in a way that creates the bootstrapping problem.
