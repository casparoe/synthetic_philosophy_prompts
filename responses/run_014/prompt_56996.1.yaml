prompt: |-
  I'm a backend engineer, zero formal philosophy, so please bear with the framing.

  Setup: we have a service that spits out probability-shaped numbers all day (chance this deploy breaks prod, chance this transaction is fraud, chance the on-call page is a real incident). Everything is a single float today. One coworker keeps pushing that we should switch to ranges, on the grounds that a single number is fake precision and there's a whole imprecise-probability literature that says you should carry a set or an interval of numbers instead. Another coworker says ranges are worthless because at the end you still have to pick an action, and a range doesn't tell you which one. I dont want to take a side until I know what I'd even be demanding of the range approach.

  So: write me the spec. What does a way of representing degrees of belief with something other than one number have to be able to do before its worth the engineering cost? I want the full list of requirements -- the situations it has to handle without falling over, the differences between cases it's not allowed to blur together, what it has to do when new evidence arrives, what it owes you when you have to act, and which ordinary facts about probability and about being well-calibrated it can't just abandon. For every requirement, give the concrete case that motivates it, stated the way I'd have to state it to someone who just wants to ship the thing.

  A few things I've half-heard of and don't know whether they belong on the list at all. There's the urn with red, black and yellow balls where you know exactly how many red but not the black/yellow split, and people's bets in that case look flat-out incoherent under any single number -- is handling that a requirement, or is it just a curiosity? There's the problem, I think called dilation, where doing an experiment makes your interval wider no matter which result comes back, even when you already agreed the experiment was irrelevant -- is "never do that" a hard requirement or one camp's preference? Then there's the gap between "50/50 because the coin is fair" and "50/50 because I genuinely have no clue," which I suspect is the entire motivation for this stuff, and I want to know whether any framework actually keeps those apart or just relabels them. And: does the action rule have to be part of the framework, or can it be bolted on afterwards -- maxmin, or whatever else people use -- and can you even score or calibrate a set-valued forecast the way you'd score a normal one?

  Mark each item as non-negotiable or as somebody's taste, and say whose.

  Then the part I care about most: if some subset of these can't all be had at once -- if being honest about ambiguous evidence, never dilating, and still producing an action pull in different directions -- say so plainly and show me exactly where the squeeze is and which requirement you'd drop first. That's the real answer I'm after, not a brochure. A table works if it makes the trade-offs easier to read.

  American English, please.
reasoning: |-
  Okay, the user is a backend engineer dealing with a debate at work about using single probability numbers versus intervals. They need a practical spec to evaluate if switching to ranges is worth the engineering cost. Let me start by understanding their main concerns.

  First, they mentioned situations where single numbers might fail, like ambiguous evidence. The urn example with unknown black/yellow split is a classic case. If that's a real scenario they face, handling it is probably a requirement. But if their current system doesn't encounter such ambiguity, maybe it's optional. Need to assess if their use cases involve partial or conflicting data.

  Next, dilation. They brought up how new evidence can widen intervals, which seems counterintuitive. They need to know if avoiding this is a must-have or just nice-to-have. If their services rely on updating predictions without losing precision, preventing dilation might be critical. But if occasional widening is acceptable, it could be a trade-off.

  The distinction between risk and ambiguity (50/50 fair coin vs. 50/50 ignorance) is another point. If their team needs different actions for these cases, the framework must preserve this info. Otherwise, collapsing both to [0.5,0.5] loses crucial context. But if actions are the same regardless, maybe it's not essential.

  Action selection is a big hurdle. Their coworker argues ranges don't help decide actions. The spec must include how to derive decisions from intervals, using rules like maxmin. They’ll need to know if such rules are part of the framework or external, and how they impact calibration.

  Calibration scoring for intervals is tricky. Single probabilities can be scored with Brier or log loss, but intervals require different metrics, like coverage probability. They need to know if and how they can measure performance without a single number.

  Trade-offs are key. They want to see where requirements conflict. For example, avoiding dilation might require less ambiguity sensitivity. If their priority is clear actions, they might tolerate some dilation. Highlighting these conflicts will help them decide which compromises are acceptable.

  Also, considering their engineering perspective, implementation cost matters. They need to know if the benefits outweigh the added complexity. Use cases like fraud detection or incident alerts that handle ambiguous data better could justify the switch, but only if the actionability and calibration issues are manageable.

  Finally, structuring the requirements as negotiable vs. non-negotiable based on their specific scenarios. If their services deal with high-stakes decisions under uncertainty, handling ambiguity and clear action rules might be non-negotiable. Otherwise, they might prioritize simplicity and cost.
answer: |-
  Here's the engineering spec for a "probability range" system, stripped down to concrete requirements, trade-offs, and implementation realities. I'll use plain terms, flag non-negotiables vs. tastes, and show where the conflicts bite.

  **Core Purpose:** Represent uncertainty when a single probability feels dishonest due to ambiguous/missing data. Must be actionable and measurable.

  ### Non-Negotiable Requirements (Engineering Fundamentals)

  1.  **R1: Handle Ambiguous Evidence Without Collapsing**
      *   **Motivating Case:** Fraud detection where you have *strong* evidence transaction is "suspicious" but *weak* evidence distinguishing "fraudulent" from "legitimate-but-rare" (e.g., high-value international wire from a new device). A single number (e.g., `P(fraud) = 0.4`) hides this ambiguity. A range (e.g., `[0.2, 0.6]`) signals the uncertainty *beyond* just risk.
      *   **Why Non-Negotiable?** If your single number system *routinely* encounters cases with genuinely conflicting/partial evidence (like the **Urn Example** - you know 40% are red, but black/yellow split is unknown, so `P(red)=0.4` is precise but `P(black)` *must* be `[0, 0.6]`), collapsing to one number misrepresents your knowledge. This leads to downstream mis-calibration and poor decisions when that ambiguity matters.
      *   **Concrete Test:** Can your system distinguish between `P=0.5` (strong evidence it's a coin flip) and "We have no damn clue, could be anything" (represented as `[0.0, 1.0]` or `[0.3, 0.7]` depending on constraints)?

  2.  **R2: Update Coherently with New Evidence**
      *   **Motivating Case:** On-call pager fires. Initial range `[0.1, 0.4]` (chance it's real). You run a quick diagnostic (evidence `E`). The system *must* update the range to `[L_new, U_new]` using a defined rule (e.g., generalized Bayes) that respects the constraints of the initial range and the evidence.
      *   **Why Non-Negotiable?** If updating breaks the math (e.g., produces negative probabilities, ignores prior constraints), the system is garbage-in-garbage-out. You *need* consistent reasoning over time.
      *   **Concrete Test:** Start with `P(A) = [0.3, 0.7]`. Observe evidence `E` known to be twice as likely if `A` is true than if false (`P(E|A)=2*P(E|notA)`). Updated `P(A|E)` *must* be within `[0.46, 0.82]` (approx) – it should shift upwards but preserve width/ambiguity appropriately.

  3.  **R3: Support Action Selection (Even if Externally)**
      *   **Motivating Case:** Deploy risk is `[0.08, 0.15]`. Do you roll back preemptively? The system **must** integrate with a *defined decision rule** to pick an action.
      *   **Why Non-Negotiable?** Business value comes from actions (ship/don't ship, block transaction/allow, page engineer/don't page). A range without a decision rule is just decoration.
      *   **Concrete Requirement:** The framework *must* output something (a range, a set of probabilities, a "worst-case") that can be plugged into a **declarative decision rule** (e.g., "Block if lower bound > 0.1", "Choose action with highest worst-case payoff" (MaxMin), "Choose action maximizing average payoff over the range"). The rule itself *can* be external.

  4.  **R4: Be Calibratable / Scorable (Differently)**
      *   **Motivating Case:** You need to know if your `[0.1, 0.2]` "deploy risk" forecasts are *meaningful*. How often does the true risk fall *outside* this range? How often does the event happen when you say `[L, U]`?
      *   **Why Non-Negotiable?** You need empirical validation for any production ML/system. Single probabilities use Brier score or Log Loss. Ranges need different metrics.
      *   **Concrete Test:**
          *   **Coverage:** The true probability `p` should fall within `[L, U]` for approximately `X%` of forecasts where you aimed for `X%` coverage (e.g., 90% of your `[L, U]` forecasts should contain the true `p`).
          *   **Sharpness:** Given equal coverage, narrower intervals are better (e.g., `[0.09, 0.11]` is better than `[0.05, 0.15]` if both achieve 90% coverage). You need to measure average width.
          *   **Action Rule Calibration:** Track the *actual event rate* for actions taken based on the range+rule (e.g., "Actual fraud rate for transactions blocked because `L > 0.1` is 12%").

  ### Taste-Based Requirements / Framework Choices (The Debates)

  5.  **R5: Avoid Dilation**
      *   **Motivating Case:** You know a coin is either fair (50/50) or double-headed (100% heads). Your initial range for Heads is `[0.5, 1.0]`. You flip it, it comes up Tails (irrefutably proving it's fair). **Dilation:** Some frameworks update the range to `[0.0, 0.5]` for the *next* flip – it *widened* despite conclusive evidence! Others stay at `[0.5, 0.5]`.
      *   **Whose Taste?** **Imprecise Prob (Walley) Camp:** Dilation is a logical necessity when evidence rules out possibilities but *increases* relative ambiguity about the remaining ones. **Bayesian/Game-Theory Camp:** This is absurd/unacceptable; evidence should refine, not blur. *Engineering Reality:* Dilation feels broken. Avoiding it is strongly preferred for predictable system behavior.
      *   **Impact:** Frameworks avoiding dilation often require stricter initial models or different updating rules (e.g., Maximum Entropy principles).

  6.  **R6: Distinguish Risk (Known Odds) vs. Ambiguity (Unknown Odds)**
      *   **Motivating Case:** `P(prod_break) = 0.5` because you know the code is perfect? Or `P(prod_break) = [0.4, 0.6]` because the code is brand new garbage? The *optimal action* (e.g., deploying) might differ.
      *   **Whose Taste?** **Imprecise Prob/Econ Camp:** This is THE core motivation for ranges! Collapsing `[0.4,0.6]` to `0.5` loses vital info about the *quality* of the estimate. **Pragmatic Engineering Camp:** If the *action* (based on `R3`) is the same for `0.5` and `[0.4,0.6]` in *our* cost model, the distinction might not be worth the complexity. *Reality:* Keeping them distinct (`R1`) is often valuable, but the *degree* to which it influences actions (`R3`) depends on your specific decision rules and stakes.

  7.  **R7: Action Rule Integration**
      *   **Motivating Case:** Should the framework *prescribe* how to act (e.g., MaxMin, Hurwicz) or *just* output the range/set?
      *   **Whose Taste?** **Decision Theory Camp:** The framework is incomplete without a decision rule. **Modular Engineering Camp:** Keep the "belief state" separate from the "action policy"; let downstream consumers apply domain-specific rules. *Reality:* **Non-Negotiable** that it *supports* action (`R3`), but the rule's implementation can be external. However, the *meaning* of the range depends heavily on the intended rule (e.g., a MaxMin range might be wider than a "coverage" range).

  ### The Inevitable Trade-offs (Where the Squeeze Happens)

  You can't have it all perfectly. Here's the conflict matrix:

  | Requirement         | Conflicts With...                     | Why?                                                                                               | Engineering Compromise (Likely Drop First)                               |
  | :------------------ | :------------------------------------ | :------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------- |
  | **R1: Handle Ambiguity** | **R5: Avoid Dilation** & **R3: Simple Action** | Truly representing ambiguity often requires models vulnerable to dilation. Wide ranges make action rules complex/pessimistic. | **Tolerate *some* dilation** in edge cases. **Accept wider ranges require more complex decision rules.** |
  | **R5: Avoid Dilation** | **R1: Handle Ambiguity**              | Strictly avoiding dilation often requires stronger prior assumptions, reducing ability to model *true* initial ambiguity. | **Prioritize avoiding dilation** for core use cases. Accept less expressive ambiguity modeling if dilation is unacceptable. |
  | **R1: Handle Ambiguity** | **R6: Distinguish Risk/Ambiguity**    | If you *always* represent "no clue" as `[0.0, 1.0]`, you lose the distinction between that and partial info (e.g., `[0.4, 0.6]`). | **Make ambiguity representation granular.** Use `[0.0, 1.0]` *only* for true ignorance, narrower ranges for partial info. |
  | **R1/R5/R6: Rich Modeling** | **R4: Calibration/Scoring** & **R3: Action** | Very rich models (sets of probabilities) are hard to score simply and make action rules computationally nasty. | **Use simple intervals (`[L, U]`) or parameterized families.** Sacrifice some modeling richness for tractability. |
  | **R3: Simple Action Rule** | **R1: Handle Ambiguity** & **R6: Distinguish** | Simple rules (e.g., "Use midpoint") collapse ambiguity. Complex rules (MaxMin) are pessimistic/conservative. | **Externalize rules.** Start with simple fallbacks (lower bound for critical things, midpoint for others), allow complex rules where stakes justify it. |

  ### The Bottom Line Spec for Shipping

  1.  **Must-Haves:** `R1` (Ambiguous Evidence), `R2` (Coherent Updates), `R3` (Actionable Output), `R4` (Calibration Metrics).
  2.  **Strongly Preferred:** `R5` (Avoid Dilation - it breaks engineer intuition). `R6` (Distinguish Risk/Ambiguity - this is often the *point*).
  3.  **Implementation Choice:** `R7` (Where the action rule lives - modular is usually best).
  4.  **Trade-off Resolution Recommendation:**
      *   **Prioritize avoiding dilation (`R5`).** Choose an updating method (e.g., Generalized Bayes with MaxEnt or specific prior sets) that minimizes it.
      *   **Use simple intervals (`[L, U]`).** Avoid complex sets unless absolutely necessary. This aids scoring (`R4`) and communication.
      *   **Start with simple, external action rules:** Define 1-3 key thresholds/rules upfront (e.g., "Page if `L > 0.3`", "Block transaction if `L > 0.1`", "Deploy if `U < 0.05`"). Track action-specific calibration (`R4`).
      *   **Track Coverage and Sharpness (`R4`) religiously.** This tells you if your intervals are honest (`Coverage ~ target`) and informative (`Sharpness`). Compare against single-number calibration.
      *   **Accept that wide intervals (`R1`) will require conservative actions (`R3`) or tolerance for inaction.** This is a feature, not a bug – it honestly reflects uncertainty.

  **Is it worth it?** Only if **ambiguous evidence (`R1`)** is **common and impactful** in your domain (e.g., novel fraud patterns, bleeding-edge deploys, noisy incident signals). If your single numbers are well-calibrated and ambiguity is rare, the complexity cost likely outweighs the benefit. If ambiguity is rampant and decisions are high-stakes, ranges provide crucial honesty, but you **must** solve the action rule (`R3`) and calibration (`R4`) upfront. The urn and dilation aren't just curiosities; they're litmus tests for whether your framework handles real ambiguity correctly.
