prompt: |-
  I'm a second year PhD in formal epi and I'm getting whiplash from theories of belief that either make us logically omniscient or just give up on rationality altogether. Can you give me the full spec for what an adequate theory of bounded / logically non-omniscient belief has to do to count as adequate -- the cases it has to get right, the distinctions it has to respect, the stuff it has to stay consistent with -- with the reason behind each requirement, and tell me which ones are realy nonnegotiable vs pet peeves of one camp, whether any subset is jointly unsatisfiable, and which single requirement knocks out the most candidates? Please run everything through these two cases I keep tripping over: Ana who believes the basic arithmetic axioms but withholds judgment on a complicated consequence until she sees the proof, and Ben who spots a simple inconsistency in his train beliefs right away but misses the same inconsistency when it's buried in jargon. Dont score all the existing views in detail, the criteria are what I need, just stick to continuous prose with no headings or bullet points or bold or tables, like you are writing me an email, and finish by saying where your line of thought is most likely to fail and what would change your mind.
reasoning: |-
  Okay, the user is a second-year PhD in formal epistemology struggling with theories of belief that either assume logical omniscience or abandon rationality entirely. They want a comprehensive set of criteria for a bounded rationality theory that handles logical non-omniscience, using Ana and Ben as test cases. 

  First, I need to unpack why this is so frustrating for them. As a formal epi student, they're likely drowning in idealized models that feel disconnected from real human reasoning. The Ana/Ben examples are clever because they represent two fundamental pain points: how we handle computational complexity (Ana's withheld judgment on complex proofs) and cognitive accessibility (Ben spotting obvious vs obscured inconsistencies). 

  The core tension they're wrestling with is maintaining normative standards while acknowledging human limitations. Most theories either: a) pretend we're perfect logical machines, b) reduce rationality to mere coherence without logical constraints, or c) make ad-hoc concessions that feel unsatisfying. What they really need is a principled middle ground.

  For criteria, I'll start with the non-negotiables. Any adequate theory must:
  - Avoid logical omniscience (obviously) but still preserve rationality as achievable
  - Handle computational constraints properly (Ana shouldn't be irrational for not instantly deriving complex theorems)
  - Account for cognitive access (Ben's inconsistency detection must depend on how beliefs are represented)
  - Maintain consistency as an ideal we can approximate
  - Explain why some inferences feel "obligatory" (like Ben spotting simple contradictions) while others don't

  Then come the desirable-but-negotiable features:
  - Graded beliefs (probabilistic or confidence-based)
  - Learning mechanisms
  - Resource sensitivity (time/attention costs)
  - How it handles "obvious" consequences vs obscure ones

  The Ana case kills theories that can't distinguish between failing to compute and true irrationality. The Ben case sinks approaches that don't account for representational format. Crucially, these requirements intersect - a theory might handle computational limits but flunk cognitive access, or vice versa.

  The biggest pitfall? The tension between "consistency as achievable" and "rationality requiring logical closure." Some requirements might be fundamentally incompatible if we insist on both perfect normativity and extreme boundedness. Personally, I think the cognitive access criterion is the killer - most theories founder on how belief representation affects detectability of contradictions.

  Where might this whole framework fail? Probably in demanding too much precision about "obviousness" thresholds. If I saw convincing experimental work showing humans violate even my minimal consistency-preservation-under-accessibility requirement, I'd have to rethink the whole project.
answer: |-
  Here's how I'd think through what we need from a theory of bounded belief, using Ana and Ben as our North Stars. Forget omniscient angels or rationality surrender – we need something that walks the line where real human thinkers actually live, respecting both our finitude and our genuine capacity for reason. Let's build the spec from the ground up, requirement by requirement, with Ana and Ben testing each plank.

  **Non-Negotiable Core (The Bare Minimum for Rational Agency):**

  1.  **Avoid Logical Omniscience:** This is the starting gun. The theory **must** allow agents to believe premises (like Ana with basic arithmetic axioms) without being forced to believe *all* their logical consequences, *especially* complex, non-obvious ones requiring significant computation (like Ana withholding judgment on the complicated theorem pre-proof). *Why?* Because Ana *is* rational. She’s playing by the rules of evidence and justification. Forcing her to believe the complex consequence *before* she computes it isn't rationalism; it's fiction. Ben spotting the simple inconsistency also highlights that non-omniscience isn't blanket irrationality – he *can* compute some things.

  2.  **Preserve Minimal Rationality / Sanity:** We can't throw the baby out with the bathwater. The theory **must** entail that blatant, *readily accessible* inconsistencies are irrational and should (ideally) be corrected upon detection, or make their persistence deeply problematic. Ben spotting the simple inconsistency "right away" shows he *can* and *should* resolve it. Rationality requires *some* capacity for coherence maintenance. *Why?* Without this, we collapse into "anything goes" – believing explicit contradictions becomes permissible if you just never think about them hard enough, which guts the normative force of "rationality" entirely. Ben *is* irrational if he clings to the simple contradiction after seeing it.

  3.  **Respect Computational Constraints / Effort:** The theory **must** explicitly incorporate the cost (time, cognitive resources, attention) of logical operations. Ana withholding judgment isn't laziness; it's an acknowledgment that verifying the complex consequence *requires work* she hasn't done yet. Ben misses the buried inconsistency *because* the jargon imposes a high cognitive cost to parse and relate the beliefs. *Why?* Ignoring computational cost makes theories descriptively false and normatively unfair. Rationality for bounded agents *is* resource-rationality – doing the best you can *with what you have* (time, brainpower).

  4.  **Account for Cognitive Access / Representation Dependence:** Beliefs aren't abstract Platonic entities; they're held *in particular formats* within a cognitive architecture. The theory **must** explain Ben's asymmetry: the *same* logical inconsistency triggers immediate correction in one representation (clear "train beliefs") but goes unnoticed in another (buried in jargon). *Why?* Rationality isn't just about *what* you believe abstractly, but *how* those beliefs are encoded, accessed, and manipulated by your cognitive machinery. A good theory must link logical relations to the agent's *actual* ability to perceive and process those relations given their representational state. Ignoring this renders Ben's case inexplicable.

  **Highly Desirable (Where Plausibility & Power Live):**

  5.  **Handle Degrees of Belief/Graded Confidence:** While not strictly mandatory for a *belief* theory (vs. a full *credence* theory), a truly adequate framework should accommodate Ana's stance: high confidence in the axioms, suspended judgment (or very low confidence) on the complex consequence pre-proof, and updated high confidence post-proof. Ben might have varying degrees of commitment to individual train beliefs. *Why?* Binary belief is often too crude. Graded confidence captures the nuance of how evidence and computation impact our epistemic state more realistically. Ana's "withholding judgment" isn't disbelief; it's uncertainty resolvable by computation.

  6.  **Allow for Learning & Updating:** The theory should explain how Ana *moves* from withholding judgment to belief upon seeing the proof (computation), and how Ben *moves* from inconsistency blindness to detection (better access/parsing). *Why?* Belief isn't static. A good theory needs dynamics – how logical reasoning (even bounded) drives rational belief revision when new information (like a proof) or new cognitive effort (like untangling jargon) is applied.

  7.  **Resource Sensitivity Granularity:** Beyond just acknowledging cost, the *best* theories will specify *how* different types of inferences (short vs. long chains, syntactically obvious vs. obscure connections) impose different costs and how agents might rationally allocate resources. *Why?* This provides a richer explanation for Ana's distinction (basic axioms vs. complex proof) and Ben's distinction (simple vs. buried inconsistency), linking the "obviousness" of a consequence directly to its cognitive cost.

  8.  **Define "Obvious" Consequences:** The theory needs a principled (though likely resource-dependent) way to distinguish consequences an agent *should* be expected to see "immediately" or with minimal effort (like Ben's simple train inconsistency in clear form) from those they cannot reasonably be faulted for missing without significant work (like Ana's theorem pre-proof, or Ben's buried inconsistency). *Why?* This is the critical line separating permissible non-omniscience (Ana pre-proof) from genuine irrationality (Ben persisting with a *spotted* simple contradiction, or perhaps failing to see *extremely* trivial consequences). It operationalizes Requirement 2 (Minimal Rationality).

  **Tricky Bits & Tensions:**

  *   **The "Obviousness" Trap:** Requirement 8 is crucial but notoriously slippery. Defining "obviousness" rigorously without collapsing back into omniscience (anything provable *is* obvious in principle?) or becoming hopelessly vague is the hardest part. Resource-based definitions (e.g., derivable within cognitive budget X) help but need careful calibration. Ana and Ben constantly probe this boundary. This requirement knocks out many candidates – syntactically defined awareness logics often struggle with graded obviousness, while purely probabilistic models often lack a sharp enough concept of logical consequence and detection.
  *   **The Joint Unsatisfiability Worry?** Is there a fatal tension? One might worry that **Preserving Minimal Rationality** (requiring detection/resolution of *some* accessible inconsistencies) and fully **Respecting Computational Constraints** (sometimes even simple checks are costly) could conflict under extreme cognitive load. If Ben is utterly overwhelmed, *can* he still be required to spot the simple inconsistency? A strict view might say yes (it's *minimal* sanity), while a resource-rational view might say no (under extreme load, rationality demands focusing on survival, not logic puzzles). This tension is real, but perhaps resolvable: Minimal Rationality applies *when the agent has the relevant cognitive resources available to deploy*. Ben spotting it "right away" implies he *did* have the resources. Ana not deriving the theorem implies she *didn't* allocate the resources needed (yet). The theory must specify the *conditions* under which Minimal Rationality requirements kick in.

  **Where This Line of Thought is Most Fragile & What Would Change My Mind:**

  The biggest vulnerability is pinning down **Cognitive Access/Representation Dependence** (Requirement 4) and the resource-sensitive definition of **"Obvious" Consequences** (Requirement 8) in a way that's both formally rigorous and psychologically plausible. It's easy to handwave about "jargon" or "complexity," but building a formal model that accurately captures *why* one representation makes an inconsistency pop while another obscures it, and defining the threshold of "obviousness" without arbitrariness, is incredibly hard. My confidence rests on the intuition that *no* theory ignoring representation or cost can explain Ana and Ben.

  What would change my mind? If compelling empirical evidence showed that human cognition fundamentally *does not* exhibit the Ben asymmetry – that logical inconsistencies are detected purely based on abstract content, regardless of representational format or cognitive effort required to parse it. Or, conversely, if evidence showed that *even the most blatant, simply represented contradictions* are routinely missed by otherwise competent reasoners under no particular duress, *without* this being seen as a rationality failure. Either finding would force a major rethink of Requirements 2, 4, and 8. Similarly, if formal work conclusively demonstrated that *any* non-omniscient system satisfying Requirement 2 (Minimal Rationality) *must* collapse into ad-hoc rules or lose all normative force, that would be a serious blow. But Ana and Ben feel too real to dismiss – the theory *has* to make sense of them. Keep pushing on those cases; they're your best anchors.
