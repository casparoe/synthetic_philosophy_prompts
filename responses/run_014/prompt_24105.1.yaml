  Now, suppositional theory, associated with Adams and Edgington, avoids this by not treating the conditional as a proposition. Instead, they say "if A then B" doesn't have a truth value; its probability is just P(B|A). Since it's not a proposition, it doesn't exist in the probability space, so Lewis's proof doesn't apply. The triviality result only hits if you insist the conditional is a proposition in the algebra.

