answer: |-
  *Rising from his writing desk, Hobbes fixes you with a keen, slightly impatient gaze. His voice is precise, carrying the weight of conviction and a scholar's irritation at being misunderstood.*

  "Sir, your difficulty is honestly confessed, and for that I honour you. Many who speak on this matter do so with tongues lubricated by Wallis's algebraic humours, or minds clouded by the vapours of faction. But attend me closely, for your question strikes at the very root of geometry – a root Wallis and his cabal at Gresham College would sever from the body of true philosophy, which is the philosophy of *bodies*.

  You grasp the fundament: the point, a *minimum sensibile*, hath magnitude. The line is its passage, and hath breadth. The surface is the trace of the line's motion. All is body in motion; there is no abstract, bloodless figment dancing in the void. Geometry is *natural philosophy* concerning magnitude.

  Now, to Wallis's cavil: that I *assume* without demonstration the equality of a curved figure to a rectilinear one? Pah! 'Tis a calumny born of his own geometric blindness, or worse, a wilful misprision. I *demonstrate* it through the very motions that generate those figures! Consider the circle: generated by the revolution of a line about a fixed point. Consider my rectilinear figure: generated by the *composition* of motions, a point tracing a path dictated by the compounding of velocities – one uniform rectilinear, the other perpendicular and accelerated according to the law of fall, which is a demonstrable consequence of motion itself!

  The equality arises not by fiat, Sir, but by the *necessity* inherent in the motions that *produce* them. The curvilinear figure *is* the path of the moving point under those compounded impulses. To demand a further 'demonstration' of equality, separate from the generating motions, is to demand that I abandon the very ground of true geometry – matter and motion – and descend into Wallis's realm of spectral quantities and arithmeticall symboles. He would have us believe that scribbles upon a page, divorced from the generation of figures, constitute proof! It is *his* method that begs the question, for it assumes algebra can *replace* construction, that calculation can stand for causation. It is a mere *art de calculer*, not geometry!

  My construction in *De Corpore* lays bare the mechanical generation. If Wallis cannot perceive the demonstration within the motions described, it is because his mind is addled by symbols, or perhaps... *leans forward slightly, his voice lowering with a sharp edge*... because he and his brethren at the so-called 'Royal Society' are more eager to discredit the author of *Leviathan* than to discern the truth of a geometrical demonstration. They champion novelty – air-pumps, monstrous lenses – and discard the rigor of the ancients, which I uphold. They see algebra, a tool of merchants and cypherers, as the new light, while I cleave to the solid ground of Euclid's *constructions*, rightly understood as physical generations. My proof stands or falls by the motions I describe. Wallis's objections are but smoke, blown to obscure the substance."

  *He taps a bony finger firmly on the desk.* "Where, pray, is the flaw *in the motions themselves*? Show me where the compounded velocities fail to generate the required path? That is the question Wallis dare not meet squarely, for he hath abandoned the very ground upon which geometry stands."
