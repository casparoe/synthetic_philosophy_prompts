prompt: |-
  Hey folks — I'm a retired comparative physiologist, spent 30 years weighing brains and counting neurons, and now that I'm retired I'm reading philosophy for fun and realizing I'm a complete beginner.

  I'm stuck on whether brain size is morally relevant, expecially going by my own gut reactions which don't seem to line up. Here's where I land on cases, tell me if there's a principle underneath:

  1. Adult human, brain around 1300g, vs African elephant, brain around 4500g. I don't think the elephant counts for more just because its brain is three times bigger. If forced I'd prioritize the human, so absolute size can't be doing much work.

  2. A typical adult human vs a human with microcephaly whose brain is much smaller but who is clearly conscious and loved by family. I give them equal consideration, no discount at all for smaller size. Within our species size seems morally irrelevant.

  3. Crow, brain maybe 10g, vs chicken, brain maybe 4g. I feel the crow deserves a good deal more consideration — tool use, remembers faces, plans ahead — even though both brains are tiny and not that far apart in weight. So here I am rewarding what the brain can do, not how much it weighs.

  4. Sperm whale, brain around 8000g, vs bottlenose dolphin, brain around 1500g. I lean toward the dolphin counting for at least as much, maybe more, because of the social learning and self-recognition stuff, despite the huge size gap the other way. Again size loses.

  5. Common octopus, about 500 million neurons but most out in the arms, vs a big cod with a tiny brain for a similar body size. I feel the octopus counts for a lot more. Is that total neurons, or complexity, or behavior?

  6. Pea-sized human brain organoid in a dish that fires in coordinated bursts vs a live mouse. The organoid has human cells and maybe a similar cell count to a small animal brain, but I give it about zero moral weight and the mouse clearly something. So living neural tissue of a certain size isn't enough by itself.

  7. Hypothetical from an old lab mate: we bulk up a mouse brain to cow size but it still just does mouse stuff, no new capacities. My gut says that adds no moral weight. So adding sheer mass without new function does nothing.

  The one that keeps tripping me up and occured last week talking with my daughter: newborn human baby, brain around 350g and not yet capable of much, vs adult pig, brain around 180g and clearly cleverer right now. I prioritize the baby heavily, way more than the size difference or current abilities would justify, which seems to clash with my crow vs chicken verdict where I rewarded current smarts.

  Is there one principle that gets all or most of these, or do I have to drop something? And what would it say about a case I haven't settled, like a solitary deep-sea squid we discover with a bigger brain than ours but that shows almost no learning in tests vs a crow?

  Can you lay out your answer in these four sections in order, I'm drowning without structure:
  1. Snapshot of my pattern — around 80 words, plain English takeaway
  2. Candidate principles — around 300-400 words, give me 2 or 3 options stated precisely, and for each clause say which of my cases above motivates it
  3. Test drive — around 250 words, what each candidate says about my baby vs pig wobble and about one brand new case of your choosing
  4. What has to go — around 150 words, honest call on which of my verdicts each principle can't save and which principle you'd keep
