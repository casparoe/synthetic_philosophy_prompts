prompt: |-
  Twenty-five people are signed up for a two-hour Saturday workshop I am running on the franchise: roughly half are sixteen- and seventeen-year-olds studying government and politics at school, and half are members of a local residents' association, several of whom are long-term residents without citizenship and therefore without a vote in national elections. I have a whiteboard and no handouts. I am not assigning anything, so please do not suggest readings.

  What I want from you is a plan for how to teach one idea, not the content of the session. The idea is that whether voting should be compulsory, whether the voting age should fall to sixteen, and whether resident non-citizens should be enfranchised are not three independent policy debates but three probes into a single underlying question about what entitles a person to a place in the electorate — and that the candidate grounds for inclusion (being subject to the coercive law, being affected by the decisions, being a participant in the ongoing collective undertaking) diverge from one another, and diverge again from whatever grounds could support compelling people to turn out.

  Please set out the following:

  - The order in which the pieces must be introduced, and why each must precede the next. In particular, what has to be established before the compulsion question can be posed at all without collapsing into the inclusion question, and whether the competing grounds should be built up one at a time or laid out simultaneously as rivals.

  - The single running case that should carry the workshop, together with what it must contain and what it must exclude. I have in mind one household: a long-term resident non-citizen parent, a sixteen-year-old who will be enfranchised in two years, and an adult citizen who has never voted and would not if left to himself. The three are identical in their exposure to the same laws and taxes and differ only in the formally relevant respects. Tell me whether this is the right vehicle, or whether it fails because several people in the room are themselves resident non-citizens and would end up functioning as the exhibit. If it fails, propose a replacement with the same structural properties.

  - The misconceptions the room will bring, in the order they are likely to surface, and the point in the sequence at which each should be pre-empted rather than rebutted afterwards. I anticipate at least these: that voting is a duty in the way jury service is; that any age threshold must be arbitrary because any line could be shifted; that excluding children on competence grounds is inconsistent with including adults who have cognitive impairments; that since one's own vote cannot be decisive, compulsion cannot be decisive either; and, from the younger half, that the issue is already settled in their favour. Please also tell me where to place the fact that what the standard compulsory-voting model actually compels is enrolment and attendance rather than the casting of a valid vote, without letting the session dissolve into procedural detail.

  - One question I can put at the end, on a case we will not have discussed, that would distinguish those who can apply the grounds from those who can only restate them.

  - What I should deliberately leave out at this level, and announce that I am leaving out.
reasoning: |-
  Alright, let me unpack this request. The user is running a workshop on franchise principles with a mixed group of teens and residents (some non-citizens), needing a teaching plan focused on conceptual structure rather than content. 

  Hmm... the core challenge is framing three voting reforms (compulsory voting, age reduction, non-citizen inclusion) as facets of a single question about electorate inclusion criteria. The tension lies in how different justifications for inclusion (subject to laws, affected by decisions, participant in collective) conflict with each other and with compulsion logic.

  First, sequencing. The inclusion question must be disentangled from compulsion upfront - otherwise they'll conflate "who should vote" with "who must vote." Better to map the inclusion criteria first, then expose how compulsion operates on separate principles like civic duty versus individual liberty. 

  For the case study... their household example risks making non-citizen attendees feel like specimens. Bad optics. Instead, use a neutral parallel: maybe a university with international students (subject to campus rules), undergrads (affected by policies), and tenured professors (participants in governance). Same structural tensions without personalizing.

  Misconceptions will pop up predictably. The "voting=jury duty" equivalence should be pre-empted when defining compulsion by contrasting enforceable duties versus civic expectations. The age arbitrariness objection? Address it when discussing competence thresholds by distinguishing developmental norms from edge cases. 

  Key subtlety: introduce the "compelled attendance ≠ valid vote" point early when defining terms, but bracket it as procedural to avoid derailment. Save for Q&A if pressed.

  Final test case: ask about incarcerated citizens' voting rights. Do they ground inclusion in current subjection (laws apply in prison)? Future effects (reentry impacted)? Or participation (temporary exclusion)? This reveals if they can apply frameworks flexibly.

  Deliberate omissions: historical precedents (distraction), international comparisons (scope creep), and strategic voting impacts (off-topic). State these boundaries explicitly to keep focus.

  The user's clearly experienced - they anticipate pitfalls like over-personalization and procedural tangents. My job is to scaffold their existing instincts into a bulletproof sequence.
answer: |-
  Here’s a structured plan focused on sequencing, case study design, misconception management, and assessment, while maintaining conceptual clarity:

  ### **Order of Introduction & Rationale**
  1. **Start with the core question**  
     *Pose: "What entitles someone to a place in the electorate?"*  
     *Why*: Establishes the workshop’s central theme. Avoids conflating inclusion with compulsion. Participants must grasp that "who belongs" precedes "what we require of them."

  2. **Introduce the three inclusion grounds**  
     Present simultaneously as rival frameworks:  
     **(A)** *Subject to coercive laws* (e.g., taxes, regulations)  
     **(B)** *Affected by decisions* (e.g., policies on schools, environment)  
     **(C)** *Participant in the collective undertaking* (e.g., shared civic identity, long-term stakes)  
     *Why*: Laying them out together highlights tensions immediately. If built separately, participants may default to reconciling them rather than seeing divergence.

  3. **Map the three policy debates onto the grounds**  
     *Non-citizen voting* probes (A) and (B). *Voting age* probes (B) and (C). *Compulsory voting* requires shifting to **new grounds** (e.g., civic duty, minimizing free-riding).  
     *Why*: Shows how each policy "tests" different facets of the core question. Reveals that compulsion isn’t about *inclusion* but about *obligation*—a distinct normative layer.

  4. **Finally, pose the compulsion question**  
     *Only after steps 1–3*: "Does obliging people to vote align with *any* inclusion ground? Or is it justified by something else entirely?"  
     *Why*: Prevents collapse of "who votes" into "who must vote." Exposes that compulsion relies on grounds like civic reciprocity or collective efficiency, unrelated to inclusion criteria.

  ---

  ### **The Running Case Study: Revised Proposal**
  **Ditch the household example.** It risks alienating non-citizen participants by casting them as "exhibits."  
  **Replace with a neutral, institutional analogy**:  
  > *"Greenhaven Community Association*  
  > - **Alex (long-term resident)**: Pays fees, follows rules, but isn’t a member.  
  > - **Sam (16-year-old)**: Uses the community pool, attends events, will inherit membership at 18.  
  > - **Taylor (adult member)**: Never attends meetings or votes on bylaws."  

  **Why this works**:  
  - Retains identical exposure to rules/decisions (taxes/laws analog).  
  - Abstracts from citizenship/voting to reduce personal stakes.  
  - Allows participants to project principles onto a neutral scenario.  
  - **Must exclude**: Real-world political parties, current laws, or emotional triggers (e.g., immigration).

  ---

  ### **Misconceptions: Sequence & Pre-emption**
  | **Misconception** | **When it surfaces** | **Pre-emption Point** | **Strategy** |
  |-------------------|----------------------|------------------------|--------------|
  | "Voting=jury duty" | During compulsion discussion | When introducing compulsion | *Pre-empt*: "Unlike jury duty—enforceable because it’s a *burden*—voting is framed as a *right*. Does compelling a right change its nature?" |
  | "Age thresholds are arbitrary" | When debating voting age | During ground (C) (participation) | *Pre-empt*: "We draw lines for driving, contracts, etc. based on competence *norms*. The question isn’t ‘where’ but ‘*which* ground justifies the line?’" |
  | "Excluding kids vs. including impaired adults" | During voting age debate | When defining ground (C) | *Pre-empt*: "Participation isn’t just competence. It’s about *role*: children are in preparation; impaired adults retain civic status unless legally restricted." |
  | "My vote doesn’t matter → compulsion is pointless" | During compulsion debate | Before introducing compulsion | *Pre-empt*: "Compulsion isn’t about individual impact. It’s about systemic legitimacy—like paying taxes because the system collapses if no one does." |
  | "The youth vote is settled" | Early in the workshop | Opening framing | *Pre-empt*: "We’re dissecting *principles*, not advocating outcomes. Assume no reform is inevitable." |
  | **"Compulsion = forced voting"** | Likely throughout | **Define terms upfront** | *Pre-empt early*: "Note: Most systems only compel *attendance* (e.g., Australia). You can spoil your ballot. We’ll bracket *how* compulsion works to focus on *why*." |

  ---

  ### **Final Diagnostic Question**
  > **"Should permanent residents of Puerto Rico (US citizens subject to federal laws but lacking congressional voting representation) be compelled to vote in presidential elections?"**  

  **Why this distinguishes understanding**:  
  - Tests application of grounds:  
    - *(A)* They’re subject to laws → supports inclusion/compulsion?  
    - *(B)* Affected by decisions → supports inclusion but compulsion?  
    - *(C)* Participation in collective? Contentious (territorial status).  
  - Reveals if they see compulsion as separate from inclusion (e.g., "They should be included first *before* discussing compulsion").

  ---

  ### **Deliberate Omissions to Announce Upfront**
  1. **"We won’t discuss:**  
     - Practical implementation (e.g., enforcement of compulsion).  
     - Historical precedents (e.g., Australia’s model).  
     - Strategic impacts (e.g., which parties benefit from reforms).  
     This keeps us focused on *principles*, not politics or logistics."  

  2. **"We’re bracketing:**  
     - Whether any ground is ‘correct.’  
     - Moral weight of each ground.  
     Our goal is mapping the conceptual landscape, not resolving it today."  

  ---

  ### **Why This Flow Works**
  - **Builds from foundation → tension → application**: Participants can’t jump to compulsion until inclusion grounds are mapped.  
  - **Neutral case study**: Avoids "othering" non-citizen attendees while preserving analytical clarity.  
  - **Pre-emption > rebuttal**: By naming misconceptions early, you prevent derailment and validate concerns without debate.  
  - **Diagnostic question**: Uses an unfamiliar, structurally parallel case to test transfer of principles.  

  **Key facilitation tip**: Use the whiteboard to map criteria against policies in a grid, visually reinforcing divergence. Label columns "Inclusion Grounds" and rows "Policy Probes," adding compulsion as a separate row only after inclusion is settled.
