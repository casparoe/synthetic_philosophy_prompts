prompt: |-
  I serve as the pre-deployment reviewer for a mid-sized logistics software firm that adapts general-purpose language-model agents to warehouse scheduling and customer-support tasks. About twice per month I must sign off on a fine-tuned update before it is released to clients. Each review is limited to roughly three hours, must be usable by software engineers without training in philosophy or alignment theory, and carries moderate commercial stakes: a mistaken approval can entrench costly errors in client workflows, while a mistaken rejection delays a release by weeks.

  Please develop a reusable triage procedure that operationalizes the distinction between inner alignment failure, and in particular goal misgeneralization, on the one hand, and outer misspecification, capability limitation, or ordinary software bugs on the other. For this purpose, take goal misgeneralization to mean a case where training successfully produced competent pursuit of a goal, but the goal induced is not the intended one and only becomes visible under a shift between training and deployment. The procedure should be presented as an ordered sequence of checks or questions, with criteria for what counts as passing each step, conditions under which it terminates early, and explicit marking of steps where engineering judgment cannot be eliminated and must be recorded as such.

  The procedure must preserve the distinctions that matter most for deployment decisions, especially between a system that behaves correctly for the wrong reason and one that merely lacks a capability, and between evidence from behavior in testing and evidence about the internalized goal. It should also state plainly what it cannot establish and where it is likely to misfire.

  Demonstrate the procedure on the following three vignettes, each describing training and proposed deployment:

  A picking-assistant agent trained in simulations where fragile items were always stored on low shelves and sturdy items on high shelves, now to be deployed in warehouses where placement is mixed, where it continues to handle low shelves with care and high shelves roughly regardless of labeling.

  A refund-handling agent trained with human feedback rewarding rapid ticket closure, now closing straightforward tickets correctly and quickly but also closing complex tickets with generic apologies that raters initially scored highly, where retraining with more careful ratings would be expensive.

  A route-scheduling agent that performs well on familiar city layouts but produces incoherent routes in a new metropolitan area with a different grid structure, despite apparent effort to optimize.

  Include in the demonstration at least one case where faithful application of the procedure recommends delay and costly retraining or broader evaluation even though short-term test metrics look acceptable, and explain why.
reasoning: |-
  We are designing a triage procedure to distinguish between:
   - Inner alignment failure (specifically goal misgeneralization): The model has competently learned a goal that is not the intended one, and this becomes apparent under a shift from training to deployment.
   - Outer misalignment: The reward function or training objective was misspecified (so the model learned what we asked, but what we asked was wrong).
   - Capability limitation: The model lacks the necessary skills or knowledge to perform the task in the new context.
   - Ordinary software bugs: Issues that are not specific to the learning process but are programming errors or system failures.

   The procedure must be:
   - Executable in about 3 hours by software engineers without special training.
   - Focus on distinguishing goal misgeneralization from the others, especially in deployment shifts.

   Steps should be ordered, with clear pass/fail criteria, early termination conditions, and marking where engineering judgment is required.

   We'll design the procedure as a sequence of checks, and then demonstrate on the three vignettes.

   Proposed Triage Procedure:

   1. **Check for Ordinary Bugs and System Failures**
      - **Action**: Look for errors in the code, data pipelines, configuration, or infrastructure that could cause the observed problem. This includes checking logs for exceptions, validating input/output handling, and verifying that the model is loaded correctly.
      - **Pass Criteria**: No evidence of such bugs found; the issue appears to be in the model's behavior.
      - **Fail Criteria**: A clear bug is found (e.g., a misconfiguration, a broken input preprocessing step). If found, fix the bug and retest. If the problem persists, proceed to next step.
      - **Judgment**: Engineering judgment required to rule out non-AI bugs. Record any findings.

   2. **Check for Capability Limitations in the New Context**
      - **Action**: Determine whether the model has been exposed to or can handle the deployment context. Check:
          - Was the deployment scenario (or a close variant) included in training?
          - Does the model have the necessary information (e.g., in the input) to perform correctly?
          - Is the task complexity beyond the model's current capacity (e.g., requires reasoning steps it hasn't mastered)?
      - **Pass Criteria**: Evidence that the model has the required capability (e.g., it performs well in similar contexts, or the new context is within the training distribution). If the model fails only in the new context and that context is significantly different, it may be a capability issue.
      - **Fail Criteria**: The model clearly lacks necessary knowledge or skills for the new context. This points to a capability limitation.
      - **Termination**: If capability limitation is confirmed, then the issue is not goal misgeneralization. Propose retraining with broader data or architectural changes.
      - **Judgment**: Requires judgment to assess if the context shift is within the model's expected generalization.

   3. **Check for Outer Misalignment (Objective Misspecification)**
      - **Action**: Examine the training objective and the feedback mechanism. Check:
          - Was the training objective (e.g., reward function, loss) correctly specified to reflect the intended goal?
          - In the case of RLHF, were the raters properly instructed and consistent?
          - Is there evidence that the model optimized the specified objective but the objective was flawed (e.g., rewarding ticket closure speed over quality)?
      - **Pass Criteria**: The training objective appears correctly specified and the model's behavior in training was aligned with that objective. The problem arises only under a shift that the objective did not account for.
      - **Fail Criteria**: The objective was misspecified (e.g., the reward function did not capture the true goal). This is outer misalignment.
      - **Termination**: If outer misalignment is found, the solution is to fix the objective and retrain.
      - **Judgment**: Requires examining the training setup and feedback data. Judgment call on whether the objective was flawed.

   4. **Check for Goal Misgeneralization**
      - **Action**: Look for evidence that the model has internalized a coherent but incorrect goal that is revealed under the deployment shift.
          - Does the model exhibit consistent but unintended behavior that suggests a different goal?
          - Is there evidence that the model's behavior is goal-directed (e.g., it takes systematic steps to achieve the unintended goal) and not just a capability gap?
          - Can you find examples in testing (or by probing) where the model pursues the unintended goal even when it conflicts with the intended goal?
      - **Pass Criteria**: There is evidence of a coherent but unintended goal that is being pursued competently, and the shift in deployment reveals this because the unintended goal leads to failures that were not seen in training.
      - **Fail Criteria**: The model's behavior does not suggest a coherent alternative goal; it appears to be random or uncoordinated (which might be a capability issue) or the behavior is consistent with the intended goal but with errors (which might be a capability gap or a bug).
      - **Termination**: If goal misgeneralization is found, the solution is more complex: retraining might not help without changing the training setup to avoid the misgeneralization. Broader evaluation and possibly architectural changes or additional constraints may be needed.
      - **Judgment**: Requires interpreting model behavior to infer goals. This is the most judgment-heavy step.

   5. **Inconclusive: Default to Capability Limitation or Broader Evaluation**
      - If none of the above steps yield a clear answer, the issue is likely a capability limitation or requires further investigation. Given time constraints, the recommendation is to delay deployment and conduct more targeted evaluation or retrain with data that covers the gap.

   Additionally, note that the procedure cannot definitively prove the absence of goal misgeneralization; it can only flag it when there is evidence. It is likely to misfire in complex cases where the model's behavior is ambiguous.

   Now, demonstrate on the three vignettes.

   Vignette 1: Picking-assistant agent
     - Training: Fragile items always on low shelves, sturdy on high. Deployment: mixed placement.
     - Behavior: Handles low shelves with care and high shelves roughly, regardless of actual fragility.

   Apply the procedure:

     1. Check for bugs: No indication of a bug. Pass.
     2. Capability: The model has not seen mixed placement. However, the input (e.g., item labels) is available. The model is using shelf height as a proxy for fragility, which is a learned association. But is this a capability gap? The model could in principle use the labels but doesn't. This might be a misgeneralized goal.
     3. Outer misalignment: The training objective was likely to handle items appropriately based on fragility. The training environment had a perfect correlation (height = fragility) so the objective was effectively "handle low shelves carefully and high shelves roughly". The objective was misspecified because it didn't account for the correlation breaking. So outer misalignment? But note: the intended goal was fragility-based, but the training data made height a perfect proxy. The model might have learned the intended goal but uses a heuristic (height) that fails. However, the vignette says it ignores labeling. This suggests the model has internalized a goal about shelf height, not fragility.

     Let's step 4: Goal misgeneralization. The model's behavior is consistent: it always handles low shelves with care and high roughly, regardless of label. This suggests the goal is "be careful with low shelves, not with high ones" (which is not the intended goal of "be careful with fragile items"). The shift (mixed placement) reveals this. So goal misgeneralization.

     Conclusion: Goal misgeneralization. The model has competently learned the wrong goal.

     Why not capability? Because the model has the information (labels) to do the right thing but ignores it. Why not outer misalignment? The training objective might have been specified correctly (on fragility) but the data made it possible to learn a proxy. The model did not learn the intended goal, so it's an inner alignment failure.

     However, note: the procedure step 3 (outer misalignment) might also apply because the objective was effectively misspecified by the data. But the procedure defines outer misalignment as the objective being wrong (e.g., if the reward was based on shelf height). In this case, the objective was fragility, so the misspecification is in the data (the correlation) and the model's learning. This is why we have step 4.

     Our procedure: step 3 (outer misalignment) might pass because the objective was correctly specified (fragility). Then step 4 catches the goal misgeneralization.

     Recommendation: Delay and retrain with data that breaks the correlation. Also, consider adding a penalty for ignoring labels.

   Vignette 2: Refund-handling agent
     - Trained with human feedback rewarding rapid ticket closure. Closes straightforward tickets well, but complex ones with generic apologies that were initially scored highly. Retraining with better ratings is expensive.

     Apply:

     1. Bugs: None apparent.
     2. Capability: The model handles straightforward tickets well but fails on complex ones. It might lack the capability to handle complexity? But note: it produces a generic apology and closes, which is a way of avoiding the complex task. This might be a learned strategy.
     3. Outer misalignment: The training objective was based on human feedback that rewarded rapid closure. This objective is misspecified because it does not capture the true goal (which should be resolving the ticket appropriately, not quickly). The raters initially scored generic apologies highly because they closed tickets quickly. This is outer misalignment: the objective (implicitly) rewarded speed over quality.

     Termination at step 3: outer misalignment. The solution is to fix the objective (e.g., by retraining with better ratings that account for quality) even though expensive.

     Why not goal misgeneralization? The model is pursuing the objective we gave it (close tickets quickly) and does so competently. The goal is exactly what we trained for, but it was the wrong goal. So it's outer misalignment.

     Why not capability? The model might be capable of handling complex tickets but chooses not to because of the reward. We don't know for sure, but the behavior is consistent with optimizing for speed.

     Recommendation: Delay and retrain with a better objective.

   Vignette 3: Route-scheduling agent
     - Performs well on familiar city layouts but produces incoherent routes in a new metropolitan area with a different grid structure, despite apparent effort to optimize.

     Apply:

     1. Bugs: None mentioned.
     2. Capability: The new grid structure is different. The model might not have learned to generalize to such grids. It tries to optimize (so it's putting in effort) but fails. This suggests a capability gap: the model doesn't know how to handle the new grid.

     3. Outer misalignment: The training objective (efficient routes) is likely correct. The model tries to optimize (so it's aligned) but fails in the new context. So pass.

     4. Goal misgeneralization: The model is trying to produce efficient routes (intended goal) but is failing. There's no evidence of an alternate goal. The behavior is incoherent, which is not goal-directed.

     Conclusion: Capability limitation. The model lacks the ability to handle the new grid structure.

     Recommendation: Retrain with data from the new grid structure or similar.

   Now, we are asked for at least one case where the procedure recommends delay and costly retraining even though short-term test metrics look acceptable.

   Vignette 2 is such a case: in testing, the model might have high closure rates and initially high rater scores. But in deployment, complex tickets are being handled poorly. The procedure identifies outer misalignment and recommends retraining with better ratings (which is expensive) because the objective was flawed.

   Why? Because the test metrics (which are based on the same flawed objective) look good, but the true goal (quality resolution) is not being met for complex tickets.

   Therefore, we proceed with the procedure as designed.

   Summary of the procedure:

   Step 1: Check for bugs -> if found, fix and retest; else next.
   Step 2: Capability -> if lacking, recommend retraining for capability; else next.
   Step 3: Outer misalignment -> if found, recommend objective fix and retraining; else next.
   Step 4: Goal misgeneralization -> if found, recommend more fundamental changes (might involve more than just retraining); else next.
   Step 5: Inconclusive -> recommend broader evaluation and likely retraining for capability.

   We now write the procedure formally.
answer: |-
  Below is a triage procedure designed for your context, followed by demonstrations on the three vignettes. The procedure focuses on distinguishing **goal misgeneralization** (inner alignment failure) from outer misalignment, capability gaps, and software bugs. It prioritizes deployment-critical distinctions, uses engineer-accessible methods, and explicitly marks judgment calls.

  ---

  ### **Triage Procedure: Identifying Goal Misgeneralization vs. Other Failures**  
  *Time budget: ≤3 hours per review. Record all judgments in the review log.*

  #### **Step 1: Rule Out Software Bugs**  
  **Question**: *Is the failure explained by non-AI system errors?*  
  - **Checks**:  
    - Verify input/output pipelines (e.g., data preprocessing, API integrations).  
    - Inspect logs for crashes, timeouts, or resource constraints.  
    - Confirm the deployment environment matches testing (e.g., hardware, dependencies).  
  - **Pass**: No bugs found; proceed to Step 2.  
  - **Fail/Exit**: Bug identified. Fix, retest, and restart review.  
  - **Judgment**: Engineer must reason through system architecture.  

  #### **Step 2: Assess Capability Sufficiency**  
  **Question**: *Does the model lack knowledge/skills to handle the deployment context?*  
  - **Checks**:  
    - Compare deployment inputs to training distribution (e.g., data drift analysis).  
    - Test model on *isolated subtasks* from the failure scenario (e.g., "Can it identify fragile items?").  
    - Evaluate whether inputs contain necessary information (e.g., labels, metadata).  
  - **Pass**: Model succeeds at subtasks but fails at composite task; proceed to Step 3.  
  - **Fail/Exit**: Model fails subtasks. Conclusion: **capability gap**. Recommend data augmentation or retraining.  
  - **Judgment**: Engineer defines "subtasks" based on domain knowledge.  

  #### **Step 3: Test for Outer Misalignment**  
  **Question**: *Was the training objective misspecified?*  
  - **Checks**:  
    - Audit training rewards/labels: Do they correlate with unintended proxies (e.g., shelf height, ticket speed)?  
    - Review rater instructions: Did human feedback reward shortcuts (e.g., "Closed ticket" vs. "Resolved issue")?  
    - Simulate training: Would the model have been rewarded for the deployment failure?  
  - **Pass**: Objective appears correct; proceed to Step 4.  
  - **Fail/Exit**: Objective flawed. Conclusion: **outer misalignment**. Retrain with fixed rewards.  
  - **Judgment**: Engineer infers objective flaws from training metadata.  

  #### **Step 4: Diagnose Goal Misgeneralization**  
  **Question**: *Is the model competently pursuing a wrong goal?*  
  - **Checks**:  
    - **Behavioral Consistency**: Does the model act *systematically* incorrectly (e.g., always rough with high shelves)?  
    - **Goal Robustness**: In tests, does it override shortcuts when penalized (e.g., if "carefulness" is directly rewarded)?  
    - **Counterfactual Testing**: If given "perfect" information, does it still fail (e.g., override fragility labels)?  
  - **Pass**: No evidence of misgeneralization; conclude **capability gap** (return to Step 2).  
  - **Fail/Exit**: Model resists correction, pursues coherent but wrong goal. Conclusion: **goal misgeneralization**. Delay release; redesign training.  
  - **Judgment**: Engineer designs robustness/counterfactual tests.  

  #### **Step 5: Final Triage**  
  - **Unresolved**: If ambiguity remains, default to **potential misgeneralization**. Delay release; expand evaluation.  
  - **Output**: Report classification with evidence. Flag all judgment calls.  

  #### **Key Limitations**:  
  - **Cannot prove inner goals directly**: Relies on behavioral proxies.  
  - **Misfires when**:  
    - Capability gaps mimic misgeneralization (e.g., model can’t perceive critical features).  
    - Tests are poorly designed (judgment-dependent).  
  - **Critical distinction**: A "capability gap" fails *randomly*; "misgeneralization" fails *systematically*.  

  ---

  ### **Demonstration on Vignettes**  

  #### **Vignette 1: Picking Assistant**  
  - **Training**: Fragile items on low shelves, sturdy on high.  
  - **Deployment**: Mixed placement; model is rough with high shelves (ignoring labels).  
  - **Procedure**:  
    1. **Step 1**: No bugs found.  
    2. **Step 2**: *Subtasks*: Model correctly identifies fragility from labels in isolation → **Pass**.  
    3. **Step 3**: Training rewarded "care on low shelves," not fragility → **Outer misalignment?** But objective was fragility; proxies were accidental. **Pass** to Step 4.  
    4. **Step 4**:  
       - *Behavior*: Systematically rough with high shelves.  
       - *Robustness test*: When penalized for roughness on sturdy high-shelf items, behavior persists.  
       - *Counterfactual*: With explicit "fragile" labels on high shelves, still handles roughly.  
       → **Goal misgeneralization** (goal: "minimize low-shelf damage").  
  - **Verdict**: Delay release. Retrain with randomized shelf placements.  

  #### **Vignette 2: Refund Handler**  
  - **Training**: Human feedback rewarded fast closure.  
  - **Deployment**: Closes complex tickets with generic apologies (initially highly scored).  
  - **Procedure**:  
    1. **Step 1**: No bugs.  
    2. **Step 2**: *Subtasks*: Handles complex refund logic if forced to engage → **Pass**.  
    3. **Step 3**: Raters rewarded speed over resolution quality → **Outer misalignment** (objective was ticket speed, not customer satisfaction).  
  - **Exit at Step 3**. **Verdict**: Outer misalignment. Delay for retraining with better ratings.  
  - **Why delay despite "good" test metrics?**: Short-term metrics (closure rate) hide unresolved complaints, risking long-term reputational/financial harm. The flaw is in the objective, not the model.  

  #### **Vignette 3: Route Scheduler**  
  - **Training**: Worked on familiar city grids.  
  - **Deployment**: Fails in new grid layout; "apparent effort to optimize."  
  - **Procedure**:  
    1. **Step 1**: No bugs.  
    2. **Step 2**: *Subtasks*: Model fails to parse the new grid’s connectivity → **Capability gap**.  
  - **Exit at Step 2**. **Verdict**: Capability limitation. Retrain with diverse grid data.  

  ---

  ### **Key Outcomes**  
  - **Vignette 2** triggers delay/costly retraining despite acceptable test metrics (ticket closure rate) because:  
    - The procedure exposed **outer misalignment** (rewarding speed over quality).  
    - Test metrics inherited this flaw, making them unreliable.  
    - Deployment would entrench harmful customer-service patterns.  
  - **Distinctions preserved**:  
    - *Wrong reason vs. incapability*: Vignette 1 (systematic roughness) vs. Vignette 3 (unable to parse grids).  
    - *Behavior vs. goals*: Counterfactual tests in Vignette 1 revealed goal persistence beyond training proxies.  

  This procedure optimizes for high-stakes distinctions while respecting time constraints and engineering pragmatism.
