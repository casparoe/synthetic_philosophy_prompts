prompt: |-
  im trying to sort out therapy vs enhancement and my gut is all over the place, can you help me find the principle behind it if there is one?

  Insulin for my diabetic cousin to keep her sugars normal: therapy, totally fine. Growth hormone for a kid who's short due to a deficiency to get him up to average: fine. Same hormone for a kid already on track to be average to push him to 6ft for basketball: not fine. Laser surgery to fix my short-sightedness back to normal: fine. But the same laser tweaked to give a pilot applicant better-than-normal night vision: realy fine by me, which is weird given the basketball one. ADHD meds that let my mate actually hold down a job: fine, but the same pill for healthy me to cram for finals: not fine, though somehow less bad than steroids for athletes.

  Is there one principle that gets all of these, or close? And what does it say about the case I keep going back and forth on — a gut bug implant that restores lactose digestion for someone who lost it vs the same tech tweaked to let a hiker digest grass cellulose on camping trips? Tell me which of my verdicts you'd have to overturn to keep it simple.

  Please answer in British English throughout, and put your call on the gut bug hiker case as the very last line beginning with Verdict:
reasoning: |-
  Alright, the user is struggling with the distinction between therapy and enhancement. Let me start by breaking down their examples. They mentioned insulin for diabetes as clearly therapy, growth hormone for deficiency versus height enhancement, laser eye surgery for correction versus night vision boost, and ADHD meds for treatment versus study aid. Each example has a pattern: restoring normal function versus enhancing beyond it. But then they bring up the gut bug implant—restoring lactose digestion versus enabling grass cellulose digestion. That last one seems tricky.

  Hmm, the user's gut reactions vary. They're fine with night vision enhancement but not with growth hormone for basketball. Why the inconsistency? Maybe because night vision could be seen as a tool for a job, similar to glasses, while height enhancement feels like altering natural potential. The principle here might be about maintaining species-typical functioning versus exceeding it. But then the lactose example: restoring to typical is therapy, but digesting grass is beyond typical. So for the hiker, it's enhancement.

  The user wants a unified principle. The species-typical norm seems to cover most cases. Diabetic insulin restores normal glucose levels, growth hormone for deficiency brings height to average. Laser correction to 20/20 is typical, but night vision beyond human norm is enhancement. ADHD meds restore focus typical for most people, but using them to cram exceeds normal capabilities. 

  But the user mentioned being okay with night vision enhancement. Under the species-typical principle, that would be enhancement and thus not "fine," but the user says it is. So there's a conflict. The user might value functional improvements that have practical benefits without undermining human essence. Night vision could be seen as a tool extension, like binoculars, whereas height enhancement alters the body more intrinsically. 

  For the gut bug cases: restoring lactose digestion is therapy since humans typically digest lactose when young. But losing it in adulthood is common, so restoring it brings back a function that was once typical. Digesting cellulose is entirely non-typical for humans, so that's enhancement. The user's verdict on the hiker case might be "not fine" if sticking strictly to species-typical norms. However, the user might see it as a harmless tool for convenience, similar to night vision. 

  To keep the principle consistent, the user might need to overturn their acceptance of night vision enhancement. Otherwise, they'd have to allow enhancements that are non-coercive and have no significant harms, which complicates the principle. But the user wants simplicity. So the unified principle is species-typical functioning. Thus, the gut bug for lactose is therapy, for cellulose is enhancement—not fine. Last line: Verdict: enhancement, not fine.
answer: |-
  Right, this is a proper philosophical tangle, and your examples perfectly highlight why it's so messy. Your gut reactions are all over the shop because different *types* of justifications are pulling at you – medical need, fairness, authenticity, harm, and just plain "does this feel weird?".

  The single principle that comes closest to capturing *most* of your intuitions, and is widely used in bioethics, is the **"Species-Typical Functioning" or "Normal Functioning" principle.**

  Here's how it works:

  1.  **Therapy:** An intervention is therapeutic if its primary purpose is to **prevent, treat, or cure a condition that moves an individual *away* from, or prevents them from achieving, the typical functional range for members of the human species.** It aims to restore or maintain species-typical functioning.
  2.  **Enhancement:** An intervention is enhancement if its primary purpose is to **improve an individual *beyond* the typical functional range for members of the human species, where no underlying pathology or deficiency exists.** It aims to create abilities or characteristics exceeding the human norm.

  **Applying it to your cases (and why your gut sometimes rebels):**

  *   **Insulin for Diabetes:** Restores normal blood sugar regulation (a core species-typical physiological function). **Principle: Therapy. Matches your verdict.**
  *   **Growth Hormone (Deficiency):** Corrects a pathological deficiency preventing the child from reaching a height within the normal human range. **Principle: Therapy. Matches your verdict.**
  *   **Growth Hormone (Basketball):** Aims to push height *beyond* the normal range for advantage. No underlying pathology. **Principle: Enhancement. Matches your verdict.**
  *   **Laser Surgery (Correcting Short-sightedness):** Restores vision to the typical human range (20/20 or close). **Principle: Therapy. Matches your verdict.**
  *   **Laser Surgery (Better-than-normal Night Vision):** Aims to create visual capability *beyond* the normal human range. No underlying pathology preventing normal night vision. **Principle: Enhancement.**
      *   *Your Gut Rebels Here:* You find it "really fine". Why? Possibly because:
          *   It feels more like a *tool* (like night-vision goggles) integrated into the body.
          *   The *benefit* (pilot safety) seems significant and non-frivolous.
          *   It doesn't feel like "cheating" in the same way athletic enhancement does. **This is where the principle clashes with your intuition – it categorises this as enhancement, which the principle typically frowns upon.**
  *   **ADHD Meds (Job):** Compensates for a pathological neurological condition that impairs core executive functions (focus, impulse control) *below* the typical human range, enabling normal functioning (holding a job). **Principle: Therapy. Matches your verdict.**
  *   **ADHD Meds (Cramming):** Used by someone *within* the normal range of cognitive stamina to push performance *beyond* their typical baseline for competitive advantage. No underlying pathology. **Principle: Enhancement. Matches your verdict (though you note it feels less bad than steroids – likely due to perceived harm/risk differences).**

  **The Gut Bug Implant:**

  *   **Restoring Lactose Digestion:** Humans are *typically* born able to digest lactose. Lactase persistence into adulthood is common in some populations, but losing the ability is a deviation from the *original* species-typical infant capacity. The intervention restores a digestive function that was once typical and is still typical for many. **Principle: Therapy.**
  *   **Digesting Grass Cellulose:** Humans lack the enzymes and gut flora to digest cellulose. This capability is *fundamentally beyond* the species-typical human digestive range (it's a herbivore trait). The intervention creates a completely new, non-typical function. **Principle: Enhancement.**

  **Keeping it Simple: What You'd Need to Overturn**

  To strictly adhere to the Species-Typical Functioning principle and achieve consistency:

  1.  **You'd need to overturn your "really fine" verdict on the night vision laser surgery.** According to the principle, it's clear-cut enhancement (aiming beyond the human norm without pathology). You'd have to conclude it's "not fine" in the same way the basketball hormone isn't fine, based purely on the principle. This is the biggest clash.
  2.  *Potentially*, you might need to soften your view on the cramming ADHD meds. While still enhancement, the principle itself doesn't inherently distinguish *degrees* of "not fine" – it just categorises it. Your feeling that it's "less bad" than steroids likely stems from other factors (like perceived risk, coercion, impact on others) that the pure principle doesn't capture.

  **Why it's still useful (and why it's hard):**

  This principle gives a relatively clear, objective(ish) line: "What's normal for humans?" It effectively captures the core distinction between medicine fixing problems and technology pushing boundaries. It explains most of your initial reactions.

  **The Problems:**

  *   **Defining "Normal":** What *is* the "typical functional range"? It varies! (e.g., height, lactose tolerance). Is it statistical? Historical? Idealised?
  *   **Gray Areas:** Conditions like mild depression or being at the very low end of "normal" height? Is restoring to the very low end "therapy" for someone who wants more?
  *   **Ignores Context:** It doesn't account for *why* someone wants enhancement (desperation vs. frivolity), potential harms/benefits, or fairness issues (access, coercion). Your night vision example highlights this – the *purpose* matters to you.
  *   **"Human Nature" Concerns:** Some argue enhancement fundamentally changes what it means to be human, which this principle touches on but doesn't fully address philosophically.

  **The Verdict on the Hiker:**

  Applying the Species-Typical Functioning principle strictly: Restoring lactose digestion is therapy (restoring a lost, once-typical function). Enabling grass cellulose digestion is unambiguously enhancement (creating a non-human, non-typical capability).

  Verdict: Enhancement, not fine.
