prompt: |-
  I'm a hospital ethicist and I keep running into the same nightmare scenario: a patient wrote an advance directive years ago saying "no life-sustaining treatment if I have severe dementia," but now they have moderate dementia and seem content — they smile, enjoy pudding, recognize family sometimes. The family is split. Some say "follow the directive, she would hate this." Others say "look at her, she's happy, how can you withhold antibiotics from a happy person?"

  I need an actual procedure I can use on the floor — not a seminar paper. Something my team (attending physician, nurse, social worker, family) can work through in under an hour. It should tell us: what questions to ask in what order, what counts as an answer that pushes us one way or the other, where we should stop and say "the directive stands" vs. "the directive is overridden," and — crucially — which steps are genuinely philosophical judgment calls that no algorithm can settle.

  Ground it in whatever the literature on advance directives and the authority of the earlier self actually says: Dworkin's integrity view, Dresser's critique, the personal identity problem, whatever's relevant. But translate it. I don't need citations, I need a tool. Then run it on two cases: (1) the dementia case above — the contented patient with moderate dementia whose advance directive refuses antibiotics for pneumonia, and (2) a case where the patient's advance directive refuses blood transfusions on religious grounds (Jehovah's Witness), but the patient is now unconscious after a car accident, the directive is 15 years old, and the family says they left the faith five years ago — though there's no documentation of that. And tell me honestly: what kinds of cases will this procedure fail on, where I should just call the ethics committee and admit we're flying blind?
reasoning: |-
  Okay, the user is a hospital ethicist facing a recurring ethical dilemma about advance directives. They need a practical, step-by-step procedure to handle cases where an advance directive conflicts with a patient's current condition or suspected changed wishes. The main scenarios are dementia patients who previously refused treatment but now seem content, and Jehovah's Witness cases where religious refusal might be outdated.

  First, I should recall the key philosophical frameworks. Ronald Dworkin's "integrity view" emphasizes respecting the critical interests of the past, competent self. Rebecca Dresser critiques this, arguing that the current experiential self matters more. Personal identity theories from Derek Parfit suggest that with severe dementia, psychological continuity breaks, so the directive might not apply. But how to translate these into actionable steps?

  The user needs a tool, not theory. The procedure must be efficient—under an hour with the team. Steps should include questions to ask, decision points, and clear criteria for upholding or overriding directives. Also, highlighting where judgment calls are necessary is crucial.

  For the dementia case: The patient has moderate dementia, seems happy, but the directive refuses life-sustaining treatment. Family is split. The team must assess dementia severity, authenticity of current contentment, and whether the directive's conditions are met. Is moderate dementia "severe" as defined? Current happiness might not reflect true preference if cognitive abilities are impaired. 

  For the Jehovah's Witness case: Unconscious patient, old directive refusing blood. Family claims they left the faith. Need to verify the directive's validity and any evidence of changed beliefs. Without documentation, it's tricky. The procedure must weigh the seriousness of religious beliefs against potential changes.

  Key elements of the procedure:
  1. **Verify Directive's Validity**: Check if it's properly executed and applicable to the current situation. Avoids misuse of outdated documents.
  2. **Assess Current Preferences**: Can the patient communicate now? Even if impaired, any expressions matter. For dementia, observe behaviors; for unconscious, rely on surrogates.
  3. **Changed Circumstances**: Compare the directive's assumptions with reality. Did the patient anticipate this exact scenario? For religious cases, any evidence of belief change?
  4. **Thresholds for Overriding**: High bar—only if current evidence strongly contradicts the directive. In dementia, contentment alone isn't enough; need signs of changed values. In religious cases, without proof, the directive stands.
  5. **Document and Involve Family**: Ensure all perspectives are heard but make it clear that the patient's past wishes are primary unless compelling evidence exists.

  Where the procedure might fail: Situations with ambiguous evidence, conflicting family accounts, or when the directive's applicability is unclear. Also, if the patient's current state suggests different values but no explicit communication. In such cases, convening the ethics committee is necessary.

  For the dementia example: Directive refuses antibiotics for pneumonia. Step-by-step, the team would confirm severe dementia isn't present (moderate vs. severe), check if the patient shows any current treatment preferences, and assess if the directive's conditions are met. Since the patient is moderately impaired and not expressing distress, the directive likely stands unless there's clear evidence they changed their mind.

  For the Jehovah's Witness case: Without proof of leaving the faith, the directive must be honored. Family's claims aren't sufficient without evidence. The procedure would stop at step 3, upholding the directive.

  The user's deeper need is a reliable, defensible process that respects patient autonomy while handling real-world uncertainties. The procedure must balance legal risks with ethical responsibilities, providing clarity amid family conflicts.
answer: |-
  Here's a practical, literature-grounded procedure designed for rapid clinical use ("The Directive Decision Protocol"). It integrates Dworkin, Dresser, Parfit, and clinical pragmatism into a 6-step flowchart. Target time: 45-60 minutes.

  ---

  ### **THE DIRECTIVE DECISION PROTOCOL**
  **Core Principle:** *The competent past self is presumed authoritative UNLESS clear evidence meets specific thresholds for override.*  

  #### **STEP 1: VERIFY & CONTEXTUALIZE THE DIRECTIVE (5-10 min)**  
  - **Questions:**  
    - Is the directive *legally valid* and *applicable* to *this exact clinical situation*? (e.g., "severe dementia" ≠ moderate; "permanent unconsciousness" ≠ acute trauma)  
    - What *specific values* drove the directive? (Fear of dependency? Religious conviction? Avoidance of specific suffering?)  
  - **Decision Threshold:**  
    - If directive is *irrelevant* or *legally invalid*, STOP – it doesn’t apply.  
    - **Literature Grounding:** Dworkin's "critical interests" – honor the *reasons*, not just the words.  

  #### **STEP 2: ASSESS CURRENT PREFERENCES (10 min)**  
  - **Questions:**  
    - Can the patient *meaningfully communicate* preferences *now*? (Even inconsistently – e.g., "Do you want medicine?")  
    - Does the patient exhibit *consistent distress or contentment*? (Note: Smiling at pudding ≠ wanting life prolonged)  
  - **Decision Threshold:**  
    - If patient *clearly expresses* a *new preference* (e.g., "I want to live"), STOP – follow current wishes. *This overrides the directive*.  
    - **Literature Grounding:** Dresser's "experiential interests" – if the current self can engage, their voice matters.  

  #### **STEP 3: EVALUATE "CHANGED SELF" (15 min)**  
  - **Questions:**  
    - **For Dementia:** Has dementia *broken psychological continuity* so severely that the past self's values *no longer apply*? (Key: Can the patient still *grasp values* like dignity, autonomy? Or only immediate experiences?)  
    - **For Religious/Value Shifts:** Is there *credible evidence* the patient *explicitly renounced* the directive's core value? (e.g., "I’m no longer JW" to family ≠ undocumented claims; look for actions like accepting transfusions pre-accident).  
  - **Decision Thresholds (Critical Juncture):**  
    - **Dementia Override Threshold:** Only if *ALL* are true:  
      a) Patient is *unable to comprehend values* (not just facts),  
      b) Patient shows *consistent contentment* in current state,  
      c) Treatment refusal causes *greater harm* (e.g., denying antibiotics to a smiling person who engages with family).  
    - **Value Shift Override Threshold:** Only if there is *documented proof* or *multiple direct witnesses* to a *clear, recent renunciation* of the directive's core value.  
    - If thresholds **NOT MET**, STOP – directive stands.  
    - **Literature Grounding:** Parfit's psychological connectedness; Dresser's "then-self/now-self" conflict.  

  #### **STEP 4: FAMILY EVIDENCE WEIGHING (10 min)**  
  - **Questions:**  
    - Are family claims about changed wishes *consistent* and *specific*? (e.g., "She said last year she regretted the directive" > "She seemed happier lately")  
    - Do objecting family members *share the directive's core values*? (e.g., A JW elder son vs. non-JW daughter).  
  - **Decision Threshold:**  
    - Family claims *without evidence* DO NOT override a directive. Disagreement alone doesn’t change outcome.  

  #### **STEP 5: MEDICAL PROGNOSIS CHECK (5 min)**  
  - **Question:** Is the treatment *likely to achieve the directive’s intended outcome*? (e.g., Antibiotics may restore baseline dementia – *not* prolong dying).  
  - **Decision Threshold:** If treatment *clearly violates* the directive’s *stated goal* (e.g., transfusions for an irreversible fatal bleed in a JW), STOP – withhold.  

  #### **STEP 6: FINAL RECOMMENDATION**  
  - **OUTPUT:**  
    - "DIRECTIVE STANDS" (if no override thresholds met),  
    - "DIRECTIVE OVERRIDDEN" (if thresholds met),  
    - "INCONCLUSIVE – NEED ETHICS COMMITTEE" (see failure modes below).  
  - **Document Rationale:** Explicitly reference which steps decided the case.  

  ---

  ### **APPLICATION TO YOUR CASES**  
  #### **CASE 1: Contented Dementia Patient (Directive: No Antibiotics for Pneumonia)**  
  1. **Verify:** Directive applies to "severe dementia" – is moderate dementia *equivalent*? (Likely no per medical criteria).  
  2. **Current Preferences:** Smiles at pudding ≠ wanting treatment. No verbal preferences expressed.  
  3. **Changed Self:**  
     - *Continuity broken?* Moderate dementia often retains some values comprehension.  
     - *Contentment?* Present but not sufficient alone.  
     - *Harm?* Withholding antibiotics from a contented person causes preventable death → ethically jarring, but directive *explicitly* accepts this.  
  4. **Family Evidence:** Split opinions ≠ evidence of changed wishes.  
  5. **Prognosis:** Antibiotics likely restore baseline dementia state.  
  6. **Decision:** **DIRECTIVE STANDS** – No antibiotics. *Rationale:* No override thresholds met. Past self’s fear of dementia life > current contentment.  

  #### **CASE 2: Unconscious JW (Directive: No Blood, 15 Yrs Old)**  
  1. **Verify:** Directive applies (unconscious, needs transfusion).  
  2. **Current Preferences:** None.  
  3. **Changed Self:**  
     - Family claims patient left faith 5 yrs ago – but *no documentation*.  
     - Did patient *ever* explicitly void directive? No evidence → High bar not met.  
  4. **Family Evidence:** Uncorroborated claim – insufficient to override religious directive.  
  5. **Prognosis:** Transfusion likely lifesaving.  
  6. **Decision:** **DIRECTIVE STANDS** – No blood. *Rationale:* Religious directives are "sacred" in bioethics; absent proof of renunciation, we must honor documented faith.  

  ---

  ### **WHEN THIS PROCEDURE FAILS (CALL ETHICS COMMITTEE)**  
  1. **Ambiguous Thresholds:**  
     - "Moderate-severe" dementia where value comprehension is borderline.  
     - Contradictory *but plausible* evidence of value change (e.g., patient told nurse "I'm not JW anymore" but family disputes this).  
  2. **Existential Edge Cases:**  
     - Directive demands withholding food/water in early dementia (may constitute suicide vs. autonomous choice).  
     - Patient with locked-in syndrome who wrote "no ventilation" but now indicates with eyes they want to live.  
  3. **Institutional Risk:**  
     - Cases involving legally contested surrogates or potential litigation.  
  4. **Value Paradoxes:**  
     - Directive refuses treatment based on "not being a burden," but current self clearly enjoys life – yet remains a "burden."  

  ### **CRUCIAL JUDGMENT CALLS (NO ALGORITHM)**  
  - **How much psychological continuity is "enough"?** (Parfit’s problem).  
  - **When does current contentment outweigh past dread?** (Dworkin vs. Dresser).  
  - **What counts as "credible evidence" of changed values?** (Risk of family coercion vs. honoring growth).  

  **Final Note:** This protocol prioritizes *defensibility* – it errs on the side of the directive when in doubt. It forces explicit engagement with the literature’s core tensions while providing off-ramps for clear cases. Use it to structure the conversation, not replace deliberation. When stuck, "INCONCLUSIVE" is an ethical result – it means the case needs deeper scrutiny.
