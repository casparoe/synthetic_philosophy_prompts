  Breaking it down: First, the phrase could mean inevitability within decades (substantive claim) vs eventual inevitability (trivially true). Second, "same thing" could mean identical discovery (unlikely) or functional equivalent (more plausible). Crucially, the reception/implementation layer is where contingency dominates - as with the Wallace hypothetical. 

