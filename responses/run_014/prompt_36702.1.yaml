answer: |-
  You've perfectly diagnosed the core problem: that seemingly simple phrase "someone would have done it anyway" is doing several kinds of heavy lifting simultaneously, and conflating them leads directly to that much larger (and more dubious) conclusion about individuals being irrelevant. Let's peel apart the layers embedded within that slogan, assess their truth or plausibility, see if they support your friend's grand conclusion, and address the keyboard layout counterpoint.

  First, we need to clarify the **scope of inevitability**. When your friend says "someone would have done it," does it mean:
  1.  **Within a specific, relatively short timeframe (e.g., decades)?** This is a substantive historical claim. It argues that the intellectual, technological, and social conditions were so ripe that discovery/publication/widespread acceptance was highly probable within a foreseeable period, absent that specific individual. This could be plausible for some things (like the lightbulb with multiple inventors converging) but highly debatable for others (like the specific mathematical structure of relativity). It's *not* trivially true.
  2.  **Ever, at some indefinite point in the future?** This is often trivially true, bordering on meaningless. Given enough time and assuming human civilization persists, *someone* might eventually stumble upon a similar insight or create a comparable technology. But "eventually" could mean millennia, and the context might be utterly different. This weak version doesn't tell us much about how history *actually* unfolds in specific periods.

  Second, we need to define what "**it**" or "**the same thing**" refers to:
  3.  **The exact, specific discovery/formulation/artifact?** This is almost always false and implausible. Darwin's specific theory, with its particular mechanisms, evidence base, and phrasing? The iPhone, with its exact combination of features and industrial design? The specific political strategies and coalitions that achieved abolition in a particular place and time? Exact replication is incredibly unlikely. History doesn't work like photocopying.
  4.  **A functionally similar or equivalent outcome?** This is much more plausible, perhaps often true, but still a substantive claim. Would *a* theory of evolution by natural selection have emerged by, say, 1870, even without Darwin/Wallace? Would *some* form of networked global digital communication have arisen? Would slavery have ended in the specific nations it did, on roughly the timeline it did, via broadly similar means? This is where the core historical debate lies – assessing the ripeness of conditions versus the catalytic role of specific actors and contingent events. "Functional equivalence" itself is a spectrum, not a binary.

  Third, and crucially, we must separate the **stages of historical impact**:
  5.  **The core discovery/invention/conception?** This is what the phrase usually focuses on: "Someone else would have *had the idea* or *built the prototype*." As above, the plausibility of this (especially for functional equivalence within a timeframe) varies greatly by case. It might be high for incremental tech, lower for radical paradigm shifts.
  6.  **The publication/dissemination?** This is distinct and often *more* contingent. Darwin's status, networks, and deliberate strategy were crucial for getting his theory *out there* effectively. As you note, Wallace, lacking Darwin's established position and connections, might have struggled immensely to gain traction, delaying acceptance for years or decades. Publication channels, institutional gatekeepers, and communication networks matter hugely. A brilliant idea locked in a drawer has no historical impact. This stage is far less inevitable than the conception stage.
  7.  **The reception, adoption, and implementation?** This is where contingency often reigns supreme. *Which specific formulation* gains dominance (Darwin's meticulous, evidence-laden book vs. a potential rushed paper by Wallace)? *How* is it interpreted, fought over, and integrated into science, culture, and policy? *How effectively* is the invention commercialized and scaled (Edison wasn't just the lightbulb inventor, but a master of commercialization and systems)? *What specific path* did abolition take, and with what consequences? The *shape* of the outcome – its timing, the actors involved, the specific institutional forms it took, the cultural narrative surrounding it – is profoundly shaped by the individuals who championed it, the opponents they faced, the allies they cultivated, and the unique circumstances of its introduction. This is almost never "inevitable" in the sense of turning out exactly the same way.

  **Connecting to Your Friend's Conclusion:**

  Your friend's leap to "individual people barely matter, history is driven by big impersonal forces" relies entirely on **conflating these different meanings and collapsing the stages**, primarily by:
  *   Focusing only on the *weakest* version of inevitability (3: "ever, eventually").
  *   Equating "someone would have done it" with the *strongest* version of outcome similarity (3: "the exact same thing" or even 4: "a functionally equivalent outcome").
  *   Ignoring the critical stages of publication/dissemination (6) and especially reception/adoption/shaping (7), where individual agency, charisma, strategy, connections, and sheer luck play massive, demonstrable roles.

  Even if we grant the highly contestable claim that the *core idea* of natural selection would have emerged within a few decades without Darwin (a plausible but not certain claim for *this specific* idea in the mid-19th century), it tells us *nothing* about whether it would have been published as effectively, championed as successfully, or integrated into science and culture in the *same way* or on the *same timeline* without *that specific individual*, Charles Darwin, with his unique background, resources, temperament, and social position. Wallace's potential struggle illustrates this perfectly. The *outcome* – the shape of modern biology – might look significantly different. The slogan "someone would have done it" says nothing about *that*.

  **The Keyboard Layout (QWERTY vs. Dvorak):**

  Your friend was wrong to dismiss this as a "different kind of case." It's actually a brilliant counter-example that directly challenges his conflation, particularly concerning stages 6 and 7. Here's why:
  *   **Core Idea/Functionality (Stage 5):** The *idea* of a more efficient keyboard layout was demonstrably achievable (Dvorak designed one). Someone *did* "do it" in terms of conception and prototyping.
  *   **Publication/Dissemination (Stage 6):** Dvorak *did* publish and promote it.
  *   **Reception/Adoption/Implementation (Stage 7):** This is where it failed, spectacularly, due to path dependency, network effects, institutional inertia, and the timing of its introduction relative to the establishment of the QWERTY standard. The *superior* functional outcome (faster, more ergonomic typing) *did not* become dominant. The impersonal forces of lock-in and historical contingency *overwhelmed* the merits of the individual invention and the efforts of its champion.

  This case proves decisively that "someone would have the idea" (even if true) does *not* guarantee the "same outcome" in terms of adoption and shaping the world. The *particular path* and the *specific individuals* involved in establishing a standard at a critical juncture matter immensely for the final outcome. It highlights that the "big impersonal forces" your friend champions (like path dependency and network effects) don't just *drive* history impersonally; they can also *prevent* objectively "better" individual ideas or actions from succeeding, creating outcomes that are distinctly *not* inevitable or optimal. This case is fatal to the idea that the final, implemented outcome is always functionally equivalent or inevitable.

  **The Chunk About Words:**

  The core equivocation, the "chunk about words," lies in the ambiguous meaning of "**it**" and "**the same thing**" within the slogan "someone would have done it anyway." When your friend says "it," he likely *means* the broad functional outcome (e.g., "a theory of evolution," "instant global communication," "the end of slavery in the US"). But when challenged with the keyboard or the Wallace scenario, he implicitly *shifts* to meaning only the core idea/invention itself (e.g., "the *concept* of natural selection," "packet-switched networking," "the *idea* that slavery is wrong"). The argument conflates the *possibility of a core concept arising* with the *inevitable adoption and specific shaping of the ultimate historical outcome*. These are radically different claims. The former might sometimes be plausible; the latter is almost never true. His grand conclusion ("individuals barely matter") requires the latter, much stronger claim, but his slogan and examples only support, at best, the former, much weaker one. The keyboard layout case exposes this by showing the core idea *was* had and implemented in a lab, but the *historical outcome* was dictated by contingency, not the idea's inherent superiority or inevitability. That's the linguistic and conceptual pivot point your argument hinges on.

  **In essence:** Your intuition is correct. The slogan is a rhetorical sleight of hand. Separating its components shows that while *some* version of a core idea might often be plausible eventually, the *specific path, timing, champion, and ultimate shape of the implemented outcome* are deeply contingent on individuals and specific circumstances. Your friend's sweeping conclusion vastly overreaches the limited truth of the weakest interpretation of his slogan. The keyboard case isn't different – it's a clarifying spotlight on the fallacy of assuming the slogan guarantees the outcome.

