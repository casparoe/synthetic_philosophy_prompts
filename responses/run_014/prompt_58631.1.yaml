  Here's a test case meeting your specifications:

  **Scenario:**  
  Choose between two health interventions for a disease affecting a region:  
  - **Option A (Safe):** Distribute standard medication. Guaranteed to save 10 lives.  
  - **Option B (Moonshot):** Fund a radical vaccine trial. With probability 0.0001% (1 in 1,000,000), it cures the disease and saves 1,000,000 lives. Otherwise, it saves no one.  

  **Expected Value Calculation:**  
  - **Option A:** EV = 10 lives.  
  - **Option B:** EV = (0.000001 × 1,000,000) + (0.999999 × 0) = 1 life.  
  **→ EV maximizer chooses A** (10 > 1).  

  **Normal Person's View:**  
  - Ignores Option B's success probability (0.0001%) as "impossible," treating it as 0%.  
  - Sees Option B as saving **0 lives** and Option A as saving **10 lives**.  
  **→ Chooses B anyway** (prefers the emotional appeal of a "miracle" cure despite judging its odds as zero).  

  **Role Reversal Explained:**  
  - **Key detail:** Option B's success probability (0.0001%) is so low that its EV is *worse* than Option A's guaranteed outcome. This flips the script: EV maximization favors caution, not risk-taking.  
  - **If deleted:** If Option B had 1% success probability, EV would be 10,000 lives. Then the EV maximizer would demand the moonshot, and the normal person (still ignoring 0.0001% but accepting 1%) might agree.  

  **Fanatic's Complaint:**  
  "This is rigged! You made Option B's probability absurdly tiny to artifically suppress its EV. In real life, such interventions never have *both* astronomical impact *and* negligible odds—it's an unrealistic trick to make caution look rational."  

  **Why it works:** The tiny probability (0.0001%) crushes Option B's EV below Option A's guaranteed gain, forcing the EV maximizer to be cautious. The normal person's disregard for tiny probabilities superficially *should* make them choose A (since B appears to save 0 lives), but their emotional attraction to the "miracle" scenario overrides this, making them irrationally opt for B. This highlights how fanaticism isn't inherently daring—it can manifest as undue caution when small probabilities suppress EV.
