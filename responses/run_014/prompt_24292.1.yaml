prompt: |-
  I'm writing up my views on superrationality for a decision-theory seminar and I'd like a careful consistency check before I present them. Here is where I've landed:

  (1) In any two-player game that is symmetric — the players have the same information, the same strategy sets, and payoffs that coincide up to a relabeling of the players — and in which each player knows that the other is superrational, the correct move for each is the one that maximizes the sum of the two payoffs. I take this joint-optimization move to be the core of superrationality: the two players reason, in effect, as a single agent controlling two bodies.

  (2) As a direct consequence, two superrational players facing a one-shot Prisoner's Dilemma both cooperate, even though defection is each player's dominant strategy.

  (3) Superrationality applies only in symmetric games. In an asymmetric game — where the players have genuinely different information, or payoffs that do not coincide up to relabeling — there is no superrational solution, and each player should fall back to ordinary Nash-style reasoning about what the other will do.

  (4) A superrational player should defect against an opponent it has good reason to believe will cooperate no matter what the superrational player does — a predictable cooperator. I do not think superrationality obliges you to be a sucker to agents who are not playing the same game.

  (5) A superrational player should refuse to pay in the following setup: before you take any action, a predictor has flipped a fair coin and told you that if it landed heads it will give you a large sum if and only if you pay it a smaller sum, while if it landed tails you get nothing whatever you do. You do not know the outcome, and nothing you do now can change it; the rational move is therefore to refuse.

  Please go through these and tell me which pairs are genuinely in tension and which only appear to be. For each genuine tension, say how severe it is and what the cheapest revision would be — which single commitment I should give up or weaken, and what I give up in doing so. I do not want every possible worry listed as if they were equally bad; I want you to discriminate among them. And please be explicit about any pair that I might be tempted to think is in tension but that is not, explaining why it comes apart on inspection.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're preparing for a decision-theory seminar on superrationality and want a consistency check on their five points. The user is clearly knowledgeable, given the structured arguments, but they might be concerned about potential contradictions in their stance. 

  First, I need to understand each point thoroughly. Point (1) defines superrationality in symmetric games as joint payoff maximization. Point (2) applies it to Prisoner's Dilemma, leading to cooperation. Point (3) limits superrationality to symmetric games. Point (4) allows defection against predictable cooperators, and point (5) advocates refusing payment in a predictor scenario.

  Hmm, the main tension seems between (1)/(2) and (4). If superrationality requires treating players as a single agent, why defect against a predictable cooperator? That feels like exploiting asymmetry while claiming symmetry is essential. The user's caveat in (4) tries to prevent being a "sucker," but it might undermine the core premise. 

  Then there's (5) with the predictor. The user argues refusing payment is rational since the outcome is fixed. But if the predictor's mechanism is symmetric (same rules for both players), why isn't payment the superrational choice? Unless the predictor isn't considered a "player" in the game. That distinction might need clarification.

  The user wants prioritized tensions, so I should flag (1)/(4) as most severe. Revising (4) to require symmetry (e.g., both players being superrational) would resolve it but lose flexibility against non-superrational opponents. Alternatively, reframing superrationality as a symmetric strategy rather than joint optimization could help, though it might dilute the original idea. 

  Minor tension between (2) and (5) is resolvable: Prisoner's Dilemma involves mutual dependency, while the predictor scenario doesn't. But the user should explicitly note that superrationality applies only to interactive players, not fixed-outcome mechanisms. 

  The user might overlook that (3) and (4) aren't conflicting—asymmetry justifies falling back to Nash reasoning, which could include defecting against cooperators. But (4) references superrational play, not Nash, causing the inconsistency with (1). 

  Overall, the biggest risk is (4) contradicting the spirit of (1). The cheapest fix is softening (4) to exclude non-superrational opponents from symmetric treatment. The predictor case just needs clearer boundaries about what constitutes a "game." 

  I’ll present this with the tensions ordered by severity, offering revisions that preserve the core of superrationality while addressing exploitable gaps.
answer: |-
  Your framework is coherent but contains one significant tension and a minor resolvable one. Here's a breakdown, ordered by severity:

  ### Genuine Tension (Severe)
  **Tension between (1) and (4):**  
  - **Why it's severe:** (1) defines superrationality as players reasoning *as a single agent maximizing joint payoffs* in symmetric games where both are known to be superrational. (4) permits defection against a "predictable cooperator" (e.g., a non-superrational player who always cooperates). This contradicts (1): if players reason as one entity, exploiting the other’s unconditional cooperation violates joint payoff maximization (cooperation would yield higher total payoff).  
  - **Cheapest Revision:** Modify (4) to exclude symmetric superrational contexts.  
    - *Revision Suggestion:* "Against a non-superrational opponent (e.g., a predictable cooperator) in an *asymmetric* meta-game, defection is permitted."  
    - *What You Give Up:* Pure symmetry as the *sole* trigger for joint optimization. You now allow opponent type (superrational vs. not) to matter.  

  ### Resolvable Apparent Tension  
  **Apparent tension between (2) and (5):**  
  - **Why it appears tense:** Both involve paying/not paying in fixed-outcome scenarios, but (2) has cooperation (paying a "cost" for mutual benefit) while (5) refuses payment.  
  - **Why it resolves:** (2) is a *symmetric interactive* game: your action affects the other player’s outcome. (5) is *not a game*: the predictor is not a player influenced by your action; your payment has no causal effect. Superrationality requires mutual influence.  
  - **No revision needed.** Clarify in (5) that superrationality applies only to games with *strategic interdependence*.  

  ### Non-Tensions (Consistent)  
  - **(1) and (3):** Limiting superrationality to symmetric games (3) naturally follows from (1)’s requirement of identical payoffs/strategies for joint optimization.  
  - **(1) and (2):** (2) is a direct application of (1) to Prisoner’s Dilemma. Cooperation maximizes joint payoff.  
  - **(3) and (4):** Asymmetry (e.g., facing a non-superrational opponent) justifies abandoning joint optimization (per (3)) and using Nash reasoning (defect if dominant).  
  - **(4) and (5):** Both involve non-interactive scenarios: (4) exploits an opponent who doesn’t react to you; (5) involves a fixed outcome.  

  ### Critical Clarification for (5)  
  (5) is correct but risks misapplication. Emphasize:  
  > "Superrationality requires *mutual strategic influence*. The predictor scenario lacks this—it’s a *decision under uncertainty*, not a game. Refusing payment aligns with dominance reasoning, not superrationality."  

  ---

  ### Summary of Revisions  
  1. **Address (1)/(4) tension:** Reframe (4) as applicable only against non-superrational opponents in asymmetric contexts.  
  2. **Clarify scope (5):** Explicitly exclude non-interactive scenarios from superrationality.  

  **Minimalist Revision Plan:**  
  > Revise (4) to:  
  > *"A superrational player should defect against a non-superrational opponent (e.g., a predictable cooperator) since the asymmetry precludes joint optimization."*  
  >   
  > Amend (5) to:  
  > *"Superrationality does not apply here, as there is no strategic opponent. Refusing payment is rational under dominance reasoning."*  

  This preserves your core (1)-(3) while resolving inconsistencies. You retain the key insight—superrationality as joint optimization under symmetry—without requiring cooperation against exploiters or in non-games.
