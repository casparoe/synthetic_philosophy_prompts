  For dilation, I'll force a concession that it violates informational value. The follow-up will corner them on when dilation's "epistemic cost" becomes unacceptable. On sequential choice, I'll highlight how resoluteness betrays permissivism by demanding rigid precommitment. The follow-up questions if this makes imprecise probabilism practically incoherent. 

  Proliferation needs to show the regress isn't stoppable arbitrarily. I'll compare it to higher-order probabilities to expose double standards. For phenomenology, I'll press why introspection feels precise if sets are fundamental - this targets the "user experience" discrepancy. 

