prompt: |-
  I've been stuck on this in my metaphysics seminar: the arguments against endurantism. Lewis has the argument about the fact of presence, where if a thing exists at multiple times then there must be a further fact about when it is present, and Sider has the problem of temporary intrinsics, where a cat is curled up at one time and stretched out at another, so if it's the same cat at both times it has contradictory intrinsic properties. I keep going back and forth on whther these are the same argument in different clothes or two genuinely different ones. Can you compare them? In particular, does the endurantist's standard reply of tensed properties, like being red now, defuse both equally, or does one of them still bite? And which version do you think is stronger, and why?
reasoning: |-
  Okay, the user is struggling with two arguments against endurantism in their metaphysics seminar: Lewis's "fact of presence" and Sider's "problem of temporary intrinsics." They're confused about whether these are the same argument dressed differently or distinct issues. They also want to know if the standard endurantist reply using tensed properties (like "being red now") resolves both equally, and which argument is stronger.

  First, I need to recall both arguments clearly. Lewis's argument claims that if an object endures through time, existing wholly at different times, then there must be a "further fact" specifying when it's present. Otherwise, it seems like the object is equally present at all times it exists. Sider's problem is about temporary intrinsics: how can the same object have contradictory properties (like being curled up and stretched out) at different times without violating Leibniz's Law?

  The user might be mixing these up because both deal with persistence and time. But they target different aspects. Lewis's is about existence and presence, while Sider's focuses on property change. The user might not see the nuances, thinking both are about properties. 

  Next, the tensed properties response. Endurantists say properties are temporally qualified, like "being curled up at t1." This seems to solve Sider's problem by avoiding contradiction. But for Lewis, it's trickier. Adding "present at t" as a tensed property doesn't resolve why the object is present only at t. Lewis demands an explanation for why presence is localized to a time, which tensed properties don't provide. So the standard reply works better for Sider than for Lewis.

  Assessing which argument is stronger: Lewis's seems deeper because it challenges the very notion of existence at a time. Even if you use tensed properties, Lewis's demand for a "further fact" remains unanswered. This might be why endurantists find it harder to counter. Sider's problem has more established counters, like time-indexed properties, even if perdurantists critique them.

  The user's deeper need might be understanding the core differences to structure their seminar arguments. They might need clarity to contribute in class or write a paper. Highlighting how Lewis targets existence while Sider targets properties could help them articulate the distinction. Also, pointing out the effectiveness of the tensed properties response for each argument would address their explicit questions and show why one argument is more resilient.
answer: |-
  This is a classic and nuanced debate! Lewis's "fact of presence" argument and Sider's "problem of temporary intrinsics" attack endurantism from distinct angles, though they share a common root in the nature of time and persistence. Let's break them down and compare their force against the tensed properties reply.

  ### 1. Core Arguments: Distinct but Related

  *   **Lewis's Argument from the "Fact of Presence":**
      *   **Target:** The *existence* and *presence* of the enduring object itself.
      *   **Structure:**
          1.  Endurantism claims an object exists *wholly* at multiple times.
          2.  If an object exists wholly at time T1 and wholly at time T2, then *at T1* it exists, and *at T2* it exists.
          3.  But this seems to imply that the object is equally *present* at T1 and at T2 *from any perspective*.
          4.  However, our experience tells us an object is only *present* at the *current* time. It is *absent* at past and future times, even though it existed then/then will exist.
          5.  Therefore, endurantism needs to explain *when* the object is *present*. There must be a "further fact" beyond mere existence-at-a-time that determines its current presence. Endurantism struggles to locate this fact without invoking something like temporal parts (perduring) or a privileged present (presentism). The "wholly present" claim seems to make the object *omnipresent* in time, conflicting with the manifest fact that it's only present *now*.
      *   **Essence:** It's an argument about the *location* or *mode* of existence in time – how can something be *fully here now* and also *fully there then* without being equally present everywhere in time?

  *   **Sider's Problem of Temporary Intrinsics:**
      *   **Target:** The *properties* of the enduring object and the principle of non-contradiction/Leibniz's Law.
      *   **Structure:**
          1.  An object (e.g., a cat) has an intrinsic property at one time (e.g., being curled up at T1).
          2.  The same numerically identical object has a different, incompatible intrinsic property at another time (e.g., being stretched out at T2).
          3.  Leibniz's Law states that if object A is identical to object B, then A and B have all the same properties.
          4.  Therefore, if the cat at T1 (curled up) is identical to the cat at T2 (stretched out), we must attribute both "curled up" and "stretched out" to the *same* object *simpliciter*. This seems contradictory.
          5.  Endurantism, denying temporal parts, cannot resolve this by saying "only part of the cat is curled up" (like perdurantism does). The *whole* cat possesses both properties.
      *   **Essence:** It's an argument about *property instantiation* – how can one and the same whole object bear incompatible intrinsic properties without contradiction?

  **Key Difference:** Lewis attacks the notion of *existence and presence* across time for a whole object, arguing it fails to capture the *exclusivity* of the present moment. Sider attacks the notion of *property possession* across time for a whole object, arguing it leads to contradictions in intrinsic properties. Lewis is about *where/when the object is genuinely located*; Sider is about *what properties the object intrinsically has*.

  ### 2. The Tensed Properties Reply & Its Effectiveness

  The standard endurantist response to *both* is to relativize properties (and sometimes existence/presence) to times using **tensed properties** or **time-indexing**: "being curled-up-at-T1", "being stretched-out-at-T2", or "being-present-at-T".

  *   **Against Sider (Temporary Intrinsics):**
      *   **Effectiveness: High (Superficially).** This reply directly targets Sider's core problem. The cat isn't said to be "curled up *simpliciter*" and "stretched out *simpliciter*". It has the time-indexed property *being-curled-up-at-T1* and the distinct time-indexed property *being-stretched-out-at-T2*. There is no contradiction because the properties are different. Leibniz's Law applies to the object *simpliciter*, and *simpliciter*, the cat has the complex, time-involving properties, not the simple intrinsics.
      *   **Why it (arguably) Works:** It dissolves the contradiction by making the properties relational (to times) or complex. The object *simpliciter* consistently has the property *changing shape* or *having different shapes at different times*.
      *   **Criticisms (Perdurantists):** Sider and Lewis argue this "solves" the problem by changing the subject. "Being curled up" is an *intrinsic* property – how the object is *in itself*. Indexing it to a time makes it *extrinsic* (relational) or at best a different kind of property. The intuitive, simple intrinsic property ("curled upness") is lost. The cat *is* simply curled up *at T1* – but endurantism struggles to capture this "simple at-a-time" fact without temporal parts.

  *   **Against Lewis (Fact of Presence):**
      *   **Effectiveness: Low.** This is where the tensed properties reply falls flat for Lewis.
      *   **The Problem:** Lewis asks: How can the *same whole object* be *present* at T1 and *present* at T2 without being present at *all* times it exists? Applying the tensed property move: We say the object has the property *being-present-at-T1* and *being-present-at-T2*.
      *   **Lewis's Rebuttal:** This doesn't solve the problem; it restates it. *Why* does the object have *being-present-at-T1* when it's T1 and *being-present-at-T2* when it's T2? What *grounds* this variation in presence? From the perspective of T1, the object has *being-present-at-T1*. But it *also* has, even at T1, the property *being-present-at-T2* (since it endures and exists at T2). So, at T1, the object has *both* properties: it is present *and* future (has the property *being-present-at-T2*). But Lewis insists the object is *only* present at T1 – it shouldn't possess the property of *being present* at T2 *from the perspective of T1*. The tensed property move seems to attribute *all* its time-indexed presence properties to it *at every time*, which is precisely the "omnipresence" problem Lewis identifies. It fails to explain the *exclusivity* and *indexicality* of "now".
      *   **Why it Fails:** Lewis's argument targets the *mode of existence*, not just properties. Saying the object has the property "present-at-T" at time T doesn't explain *how* the whole object can be *exclusively* present at T. The endurantist needs a further account of what makes T the *present* time *for* the object, and how the object's existence is *localized* to T "now" without being localized to other times it exists. Perdurantism locates this "further fact" in the temporal part that is *only* located at T; Presentism locates it by making only T real. Endurantism combined with eternalism (all times equally real) struggles.

  ### 3. Which Argument is Stronger? (And Why)

  *   **Lewis's "Fact of Presence" is generally considered the deeper and more challenging argument for endurantism.**
  *   **Reasons:**
      1.  **Targets Existence Directly:** It attacks the core endurantist claim about *how* the object exists in time ("wholly present at multiple times") and shows it conflicts with a fundamental feature of temporal experience: the exclusivity of the present.
      2.  **Resilience to Standard Replies:** As shown, the tensed properties reply, which significantly weakens (though doesn't eliminate all controversy around) Sider's problem, does very little to address Lewis's concern. It leaves the "omnipresence" worry intact.
      3.  **Connects to Metaphysics of Time:** It forces the endurantist into a corner regarding the nature of temporal reality (eternalism vs. presentism) and the status of the present. Endurantists often adopt a "moderate" realism about the past/future or a "moving spotlight" theory to address it, which many find ontologically costly or metaphysically dubious. Sider's problem is more localized to persistence and properties.
      4.  **Highlights Indexicality:** Lewis's argument effectively exposes the difficulty of reconciling the *indexical* nature of "here and now" with a view where the object is equally "there and then" as a whole entity.

  **Conclusion:** While Sider's problem of temporary intrinsics is the more famous and initially intuitive objection, Lewis's argument from the fact of presence cuts deeper. It questions the very coherence of an object being "wholly present" at multiple, equally real times without being "spread thin" or requiring an unexplained "further fact" about its present location. The standard tensed properties reply offers a plausible (if contested) defense against Sider by redefining the properties, but it provides little traction against Lewis's challenge regarding the object's mode of existence and the exclusivity of presentness. Lewis's argument remains the more formidable obstacle for endurantists operating within an eternalist framework.
