answer: |-
  Here is the illustration as requested:

  1.  Inspector Cora observes that the ticket displayed by passenger Aris is clearly expired, and she recalls that according to Metro of Aporia regulations, a passenger's ticket must be either valid for District Line travel or invalid due to expiration.
  2.  Cora accepts the premises "Aris's ticket is invalid due to expiration" and "Aris's ticket is either valid for District Line travel or invalid due to expiration", but refuses to conclude "Therefore, Aris's ticket is not valid for District Line travel", demanding justification for applying disjunctive syllogism.
  3.  Cora agrees to add the statement "If 'Aris's ticket is either valid for District Line travel or invalid due to expiration' is true and 'Aris's ticket is invalid due to expiration' is true, then 'Aris's ticket is not valid for District Line travel' must be true" as a further explicit premise she accepts.
  4.  Cora now accepts the three premises – the original disjunction, the negation of one disjunct, and the rule statement – yet refuses to draw the conclusion, demanding justification for the new rule needed to connect *these* three premises to the conclusion, initiating an infinite regress.
  5.  This regress demonstrates that inference rules, like disjunctive syllogism, are not premises about the world (like ticket validity) but are constitutive norms governing rational thought itself, indispensable for moving from accepted premises to conclusions.
