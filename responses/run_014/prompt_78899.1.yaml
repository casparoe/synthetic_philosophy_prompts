  **Part (1) [6 marks]**  
  - (a) [1.5]: Correct mixed strategy calculation (0.5M + 0.5B) showing 3.5 > 3 against both L and R.  
    - B-range: Only one side correct, or arithmetic errors.  
  - (b) [1.5]: Shows M fails (worse against R) and B fails (worse against L).  
    - B-range: Only one failure shown.  
  - (c) [1.5]: Dominating object can be mixed; inequality must hold against all opponent pure strategies.  
    - B-range: Omits "mixed" or "against all pure strategies."  
  - (d) [1.5]: Notes Top not best response to L or R; explains this is necessary but not sufficient for strict dominance.  
    - B-range: Equates "not best response to pure strategies" with "strictly dominated."  

  **Part (2) [5 marks]**  
  - [1]: Set of strategies shrinks.  
  - [1]: Strict domination preserved when game shrinks (inequality still holds).  
  - [1]: Eliminated strategies cannot return (domination only weakens).  
  - [1]: Order independence due to above.  
  - [1]: Fails for weak dominance due to weak inequality (removal can break dominance).  
    - B-range: Vague (e.g., "by monotonicity"); no clear explanation for weak dominance failure.  

  **Part (3) [5 marks]**  
  - [1]: Correct 2x2 matrix with payoffs for both players.  
  - [1]: One order shown with steps and surviving strategies.  
  - [1]: Second order shown with steps and surviving strategies.  
  - [1]: Outcomes differ (e.g., {T} vs. {T,B} for Player 1).  
  - [1]: Explains difference (order affects weak dominance).  
    - B-range: Example not 2x2; payoffs missing; outcomes same (e.g., incorrect example).  

  **Part (4) [4 marks]**  
  - (a) [2]: "No"; argument: Nash strategy is best response, strictly dominated cannot be.  
    - B-range: "No" without argument; confuses with weak dominance.  
  - (b) [2]: Example (e.g., from (3)) showing weak dominance eliminates Nash strategy.  
    - B-range: No example; example does not eliminate Nash strategy.  

  *Note: B-range answers typically miss key nuances (e.g., equating concepts, vague proofs, incorrect examples). Deduct marks for these errors as per scheme.*
