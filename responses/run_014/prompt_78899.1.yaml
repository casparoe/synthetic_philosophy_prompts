          So no strict dominance.

    Therefore, IESDS does not eliminate any strategy. So all three Nash equilibria remain.

  Hence, for weak dominance, we can eliminate Nash equilibrium strategies, but for strict dominance, we cannot.

  **Model Answer Summary**

  **Part (1)**
  (a) The mixed strategy σ = (0.5 Middle, 0.5 Bottom) yields 0.5*5 + 0.5*2 = 3.5 against Left and 0.5*2 + 0.5*5 = 3.5 against Right. Since 3.5 > 3 against both, σ strictly dominates Top.
  (b) Middle: against Left: 5>3, but against Right: 2<3 → does not dominate. Bottom: against Left: 2<3, against Right: 5>3 → does not dominate.
  (c) This shows that the dominating object can be a mixed strategy. The inequality must hold strictly against every pure strategy of the opponent.
  (d) Top is never a best response to Left (best is Middle) or Right (best is Bottom). This shows that Top is not a best response to any pure strategy. However, this does not by itself show that Top is strictly dominated because it might be a best response to a mixed strategy of Player 2. In this case, we know it is strictly dominated by a mixed strategy, but in general, being never a best response to any pure strategy is necessary but not sufficient for strict domination.

  **Part (2)**
  The set of remaining strategies shrinks. If a strategy is strictly dominated in a game, it remains strictly dominated in any subgame with fewer strategies (because the domination condition is easier to satisfy when there are fewer opponent strategies). Thus, once a strategy is dominated, it stays dominated and will eventually be removed. Also, a strategy not dominated at an earlier stage can become dominated later. The order doesn't matter because the removal of dominated strategies does not "rescue" any strictly dominated strategy. This fails for weak dominance because the weak inequality might stop holding when some strategies are removed.

  **Part (3)**
  Example game:

  Player 1 / Player 2 | L       | R
  --------------------|---------|---------
  T                   | 10,10   | 5,10
  B                   | 10,5    | 0,0

  Order A: 
  1. Eliminate B (weakly dominated by T for Player 1) because against L: 10=10, against R: 5>0. 
  2. Then, Player 2 has L and R: against T, L gives 10, R gives 10 → no dominance. Surviving: T, and L,R.

  Order B:
  1. Eliminate R (weakly dominated by L for Player 2) because against T: 10=10, against B: 5>0.
  2. Then, Player 1 has T and B: against L, T gives 10, B gives 10 → no dominance. Surviving: T,B, and L.

  Outcomes differ: Order A leaves Player 1 with T and Player 2 with L,R; Order B leaves Player 1 with T,B and Player 2 with L.

  **Part (4)**
  (a) No, IESDS never eliminates a strategy that is played in a Nash equilibrium. Proof: In a Nash equilibrium, every player's strategy is a best response to the others. A strictly dominated strategy is never a best response to any strategy of the opponents. Therefore, no strategy in a Nash equilibrium can be strictly dominated, so it is never eliminated by IESDS.
  (b) For weak dominance, the game above (from part (3)) has Nash equilibria (T,L), (T,R), and (B,L). In Order A, B is eliminated, so (B,L) is removed. In Order B, R is eliminated, so (T,R) is removed. Thus, iterated weak dominance can eliminate Nash equilibrium strategies.

