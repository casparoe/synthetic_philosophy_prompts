  So there are three Nash equilibria in pure strategies: (T,L), (T,R), and (B,L).

  Now, if we do iterated weak elimination:

  Order A: 
  - Eliminate B (weakly dominated by T for Player 1) -> leaves T for Player 1 and L,R for Player 2. Then the Nash equilibria that survive are (T,L) and (T,R). The equilibrium (B,L) is eliminated.

  Order B: 
  - Eliminate R (weakly dominated by L for Player 2) -> then we have T and B for Player 1 and L for Player 2. Then we have two Nash equilibria: (T,L) and (B,L). (T,R) is eliminated.

  So in both orders, we eliminate one Nash equilibrium.

  But for strict dominance: 
  - In this game, is there any strictly dominated strategy?
