  But note: the Nash equilibrium (M,L) involves M and L. We eliminated L because it is strictly dominated? But in a Nash equilibrium, L must be a best response to M. But against M, L gives 0 and R gives 0, so L is a best response (weakly). However, R strictly dominates L? In the reduced game after T is removed, R strictly dominates L? That is true: because we require strictly better for strict dominance. But R does better against B (1>0) and the same against M. So R strictly dominates L. Therefore, L is strictly dominated. But in the Nash equilibrium (M,L), L is a best response to M. However, the definition of strict domination requires that R gives strictly greater payoff than L against every strategy of the opponent (Player 1). Against M, R gives 0 and L gives 0, so it is not strictly better. Therefore, R does not strictly dominate L. It only weakly dominates L.

  Ah, I see: strict domination requires: 
  For Player 2, R strictly dominates L if for every strategy of Player 1, the payoff of R is strictly greater than the payoff of L. But here, when Player 1 plays M, R gives 0 and L gives 0 -> not strictly greater. So R does not strictly dominate L; it only weakly dominates L.

  Therefore, in the IESDS (strict), we cannot eliminate L at this stage. Then the game after removing T has no strictly dominated strategies. So IESDS stops with strategies {M,B} for Player 1 and {L,R} for Player 2. Both Nash equilibria (M,L) and (B,R) are still present. So we didn't eliminate any equilibrium.

  To have an example where IESDS does not eliminate a Nash equilibrium, but weak elimination does, we can use the example from part (3). In the example we constructed for part (3), we had:

          L     R
      T   10,10  5,10
      B   10,5   0,0

  Nash equilibria: 
  - (T,L): Player 1: 10 (if deviates to B: 10 -> same or less? In this case, same, so weak best response). Player 2: 10 (if deviates to R: 10 -> same). So (T,L) is a Nash equilibrium (weak). 
  - (B,R): Player 1: 0, but if he deviates to T: gets 5>0 -> not an equilibrium.
  - (T,R): Player 1: 5, Player 2: 10. Player 1: if deviates to B: 0<5 -> not. Player 2: if deviates to L: 10 (same) -> so (T,R) is also a Nash equilibrium? 
