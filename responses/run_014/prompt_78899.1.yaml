answer: |-
  ### Problem: Iterated Elimination of Dominated Strategies (20 marks total)

  Consider the following game between Player 1 (who chooses Top, Middle, or Bottom) and Player 2 (who chooses Left or Right). The payoffs for Player 1 are given below (Player 2's payoffs are not needed and therefore omitted):

  - When Player 1 plays **Top**: 3 if Player 2 plays Left, 3 if Player 2 plays Right.  
  - When Player 1 plays **Middle**: 5 if Player 2 plays Left, 2 if Player 2 plays Right.  
  - When Player 1 plays **Bottom**: 2 if Player 2 plays Left, 5 if Player 2 plays Right.  

  Answer the following questions.

  **(1) [6 marks]**  
  (a) Show that Top is strictly dominated by a mixed strategy that assigns equal probability (0.5) to Middle and 0.5 to Bottom.  
  (b) Show that neither Middle nor Bottom (as pure strategies) strictly dominates Top.  
  (c) Based on (a) and (b), what does this imply about the definition of strict dominance? Specifically, what type of object (e.g., pure strategy, mixed strategy) is allowed to dominate a strategy, and what must the inequality hold against?  
  (d) Check whether Top is a best response to either of Player 2’s pure strategies (Left or Right). What does this tell us about the relationship between "never being a best response to any pure strategy" and being strictly dominated?  

  **(2) [5 marks]**  
  Explain why the order of elimination does not matter for iterated elimination of strictly dominated strategies. Your explanation must include:  
  - What set is shrinking during elimination.  
  - Why a strategy that is strictly dominated in a larger game remains strictly dominated as the game shrinks.  
  - Why an eliminated strategy cannot become undominated later.  
  - Why this property fails for weak dominance.  

  **(3) [5 marks]**  
  Construct a small example (a 2x2 game suffices) to show that iterated elimination of weakly dominated strategies can be order-dependent.  
  - Write the payoff matrix for both players.  
  - Show two different orders of elimination that lead to different surviving strategy sets.  
  - For each order, indicate the sequence of eliminations.  
  - Explain why the outcomes differ.  

  **(4) [4 marks]**  
  (a) Can iterated elimination of strictly dominated strategies (IESDS) ever eliminate a strategy that is played in some Nash equilibrium? Answer yes or no and provide a clear argument.  
  (b) Provide a concrete example to illustrate what can happen when using iterated elimination of weakly dominated strategies instead. You may use the game from part (1) or a new one.  

  ---

  ### Model Answer  

  **(1)**  
  **(a)** The mixed strategy \(\sigma = (0.5 \text{ Middle}, 0.5 \text{ Bottom})\) strictly dominates Top. Against Left:  
  - Payoff of \(\sigma = 0.5 \times 5 + 0.5 \times 2 = 3.5\)  
  - Payoff of Top = 3  
  - \(3.5 > 3\)  

  Against Right:  
  - Payoff of \(\sigma = 0.5 \times 2 + 0.5 \times 5 = 3.5\)  
  - Payoff of Top = 3  
  - \(3.5 > 3\)  

  Thus, \(\sigma\) yields a strictly higher payoff than Top against both Left and Right.  

  **(b)** Middle does not strictly dominate Top:  
  - Against Left: \(5 > 3\) (better)  
  - Against Right: \(2 < 3\) (worse)  

  Bottom does not strictly dominate Top:  
  - Against Left: \(2 < 3\) (worse)  
  - Against Right: \(5 > 3\) (better)  

  Since neither Middle nor Bottom yields a strictly higher payoff against both Left and Right, neither pure strategy strictly dominates Top.  

  **(c)** This implies that the dominating object in the definition of strict dominance can be a mixed strategy (over the player’s own strategies). The inequality must hold strictly against every pure strategy of the opponent (i.e., for every column in the current game).  

  **(d)** Top is never a best response to Player 2’s pure strategies:  
  - Against Left: Middle (payoff 5) is better than Top (3).  
  - Against Right: Bottom (payoff 5) is better than Top (3).  

  This shows that "never being a best response to any pure strategy" is a necessary condition for strict dominance. However, it is not sufficient: a strategy not a best response to any pure strategy might still be a best response to some mixed strategy of the opponent and thus not strictly dominated. Here, Top is strictly dominated, but this is only confirmed by the mixed strategy in (a).  

  **(2)**  
  - The set of remaining strategies for all players shrinks during elimination.  
  - If a strategy is strictly dominated in a larger game, it remains strictly dominated in any subgame with fewer strategies. This is because the strict inequality (dominating strategy > dominated strategy) holds against all opponent pure strategies, and removing opponent strategies cannot invalidate the inequality—it only reduces the set of strategies the inequality must hold against, making domination easier to satisfy.  
  - An eliminated strategy cannot become undominated later because once removed, strategies are not reconsidered, and the conditions for strict dominance only become weaker (never stronger) as the game shrinks.  
  - This fails for weak dominance (weak inequality: ≥) because removing a strategy might break the weak dominance. For example, if a strategy is weakly dominated only because it performs equally well against some opponent strategy, removing that opponent strategy could make domination no longer hold.  

  **(3)**  
  Consider this 2x2 game (Player 1: rows, Player 2: columns):  

  |          | L       | R       |
  |----------|---------|---------|
  | **T**    | 10, 10  | 5, 10   |
  | **B**    | 10, 5   | 0, 0    |

  - **Order 1 (eliminate B first):**  
    - Step 1: T weakly dominates B for Player 1 (against L: 10=10, against R: 5>0). Eliminate B.  
    - Game reduces to:  
      |          | L       | R       |
      |----------|---------|---------|
      | **T**    | 10, 10  | 5, 10   |  
    - Step 2: No dominance for Player 2 (against T: L=10, R=10). No further elimination.  
    - Surviving strategies: Player 1: {T}, Player 2: {L, R}.  

  - **Order 2 (eliminate R first):**  
    - Step 1: L weakly dominates R for Player 2 (against T: 10=10, against B: 5>0). Eliminate R.  
    - Game reduces to:  
      |          | L       |
      |----------|---------|
      | **T**    | 10, 10  |
      | **B**    | 10, 5   |  
    - Step 2: No dominance for Player 1 (against L: T=10, B=10). No further elimination.  
    - Surviving strategies: Player 1: {T, B}, Player 2: {L}.  

  - **Outcomes differ:** Order 1 leaves Player 1 with only T, while Order 2 leaves Player 1 with T and B. This happens because weak dominance depends on the order: eliminating B first removes the strategy that made R weakly dominated, while eliminating R first removes the strategy that made B weakly dominated.  

  **(4)**  
  **(a)** No. IESDS never eliminates a strategy played in a Nash equilibrium.  
  - **Argument:** In a Nash equilibrium, each player’s strategy is a best response to the others’ strategies. A strictly dominated strategy is never a best response to any strategy of the opponents. Thus, no strategy in a Nash equilibrium can be strictly dominated, so it will never be eliminated by IESDS.  

  **(b)** Example using the game from (3):  
  - Nash equilibria: (T, L), (T, R), and (B, L) [all are weak Nash equilibria since deviations do not yield strictly higher payoffs].  
  - Under Order 1 (eliminate B first): (B, L) is eliminated.  
  - Under Order 2 (eliminate R first): (T, R) is eliminated.  
  - This shows iterated weak dominance can eliminate strategies used in Nash equilibria, unlike IESDS.  

  ---

