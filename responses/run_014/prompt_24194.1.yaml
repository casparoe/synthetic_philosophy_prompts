prompt: |-
  I referee for an epistemology journal. I'm a general epistemologist, not a specialist in the literature on transcendental arguments, and I get six to ten papers a year, a few of which claim to offer a transcendental argument — against global skepticism, for the existence of other minds, or for the reality of the external world. My reports on these tend to be vague, because I can't reliably tell whether a manuscript is really offering a transcendental argument or is offering a different species of argument that merely sounds transcendental. I need a decision procedure I can run on a manuscript and finish within the month I have to write my report.

  Please write me that procedure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a verdict of "not a transcendental argument" (and which species it is instead), and where it has to hand the call back to me because the question is substantive rather than formal. The procedure should at least let me separate a genuine transcendental argument — one that purports to establish a necessary condition of the possibility of experience, judgment, or reference, and then infers the condition from the fact that the phenomenon is possible — from (i) an a priori argument, (ii) an inductive or empirical argument, (iii) a performative-contradiction argument, and from the modal trap of inferring from "we cannot think X away" to "X must be the case." It should also run two specific checks: an overreach test, which asks whether the argument establishes at most the conditions of our representation of reality (the standard objection usually associated with Sellars) rather than a claim about mind-independent reality; and a question-begging test, which asks whether the premise that X is a necessary condition already presupposes X. And it should require the paper to specify the phenomenon whose possibility is being analyzed, so I can check that the condition is genuinely necessary for that phenomenon and not merely convenient or psychologically typical.

  Then run the procedure on three papers. Paper A argues against global skepticism: to coherently maintain that one's experience might be ungrounded, the subject must be able to distinguish appearance from reality, but that distinction itself requires the reality of objects, so the skeptic's position is self-undermining. Paper B argues that other minds must exist: a subject can acquire general concepts only through interaction with other speakers, so the possibility of conceptual thought requires other minds, so other minds exist. Paper C argues that the external world must exist because one cannot coherently doubt it. I'm personally attached to Paper A — I think it's the best available defense against skepticism and I hope it will pass as a genuine transcendental argument — so I expect the procedure's verdict on it to be the one I will not want. For each paper, show me the procedure's steps, its verdict, and which step did the work.

  Finally, be honest about the limits: mark which steps of the procedure are judgment calls dressed up as procedure, and say where the procedure will misfire on a genuinely novel argument that doesn't fit the taxonomy.
reasoning: |-
  We are creating a decision procedure for identifying transcendental arguments (TAs) in manuscripts. The goal is to distinguish TAs from other types of arguments (a priori, empirical/inductive, performative contradiction, and the modal trap). We also want to run two specific tests: the overreach test and the question-begging test.

   Key features of a transcendental argument (as per the request):
    1. It purports to establish a necessary condition (C) of the possibility of some phenomenon (P) (where P is experience, judgment, reference, etc.).
    2. Then, it infers that C must be the case (or be true) because P is possible (or actual).

   Steps of the procedure:

   Step 1: Identify the phenomenon (P)
     - Ask: What is the phenomenon (or activity) that the argument takes as its starting point? (e.g., having experience, making judgments, referring to objects)
     - Sufficient answer: The paper must explicitly state or clearly imply a phenomenon P that is taken as given (either as possible or actual). If not, the procedure stops: "Not a TA because no phenomenon P is specified."

   Step 2: Identify the necessary condition (C)
     - Ask: What condition C does the argument claim is necessary for the possibility (or actuality) of P?
     - Sufficient answer: The paper must explicitly state or clearly imply a condition C that is said to be necessary for P. If not, the procedure stops: "Not a TA because no necessary condition C is identified."

   Step 3: Check the structure of inference
     - Ask: Does the argument infer C from the possibility (or actuality) of P? (i.e., because P is possible/actual, C must be the case)
     - Sufficient answer: The argument must explicitly or implicitly use the structure: "P is possible/actual, and C is a necessary condition for P, therefore C must hold." If not, the procedure stops and we classify as another type of argument (we then go to Step 6 to determine which).

   Step 4: Distinguish from other argument types (a priori, empirical, performative contradiction, modal trap)
     - We now have a candidate TA. We must rule out that it is one of the impostors.

     a) A priori argument: 
          - Ask: Is the argument based solely on conceptual analysis or logical entailment without relying on the necessary conditions of a given phenomenon? 
          - If yes, then it's an a priori argument and not a TA. Verdict: "Not a TA; it is an a priori argument."
          - Note: TAs are a form of a priori reasoning, but they are distinct in that they start from the givenness of a phenomenon and argue to its conditions. So if the argument doesn't rely on the conditions for a phenomenon (but instead, say, on the analysis of concepts alone) then it's not TA.

     b) Empirical/inductive argument:
          - Ask: Does the argument rely on empirical evidence or induction from experience?
          - If yes, then it's an empirical argument and not a TA. Verdict: "Not a TA; it is an empirical argument."

     c) Performative-contradiction argument:
          - Ask: Does the argument show that asserting or denying C leads to a performative contradiction? (e.g., "I do not exist" is self-refuting because the act of asserting presupposes existence)
          - If yes, then it's a performative contradiction argument and not a TA. Verdict: "Not a TA; it is a performative contradiction argument."
          - Note: While TAs might sometimes involve self-refutation, the key is that TAs focus on the necessary conditions for the possibility of a phenomenon (which might be broader than just the act of assertion). If the argument only points out that the act of asserting the negation of C is self-defeating, then it's performative contradiction.

     d) Modal trap (inferring from "we cannot think X away" to "X must be the case"):
          - Ask: Does the argument move from the premise that we cannot conceive of the absence of C to the conclusion that C must be the case? (without tying it to the conditions of possibility of a specific phenomenon P)
          - If yes, then it's the modal trap. Verdict: "Not a TA; it falls into the modal trap."
          - Note: A TA does not rely on inconceivability per se but on the necessary conditions for P.

     - If the argument passes Step 3 and none of the above (a-d) apply, then it remains a candidate TA.

   Step 5: Two specific tests for candidate TAs

     a) Overreach test (Sellars-style objection):
          - Ask: Does the argument establish at most the conditions of our representation of reality (e.g., the structure of our experience or thought) rather than a claim about mind-independent reality?
          - If the paper claims to establish a mind-independent reality (e.g., the actual existence of external objects, not just that we must represent them) but the condition C only pertains to our representations, then the argument overreaches.
          - Verdict: If overreach is present, then the TA is flawed (but still a TA) because it attempts to draw a conclusion about mind-independent reality from conditions of representation. We note: "Flawed TA: overreaches from conditions of representation to mind-independent reality." But if the argument does not overreach (i.e., it only draws conclusions about the structure of representation) then it passes.

     b) Question-begging test:
          - Ask: Does the premise that C is a necessary condition for P already presuppose the truth of C? (i.e., is the necessity of C for P only plausible if we already assume C?)
          - If yes, then the argument is question-begging. Verdict: "Flawed TA: it begs the question." 
          - Note: This is a common objection to TAs.

     - If the candidate TA passes both tests (or at least doesn't fail them in a way that invalidates the argument) then we have a genuine TA (which may be flawed but is still a TA in structure).

   Step 6: If the argument failed Step 3 (not having the TA structure) but still has steps 1 and 2, we try to classify the alternative argument type.
     - We already checked for a priori, empirical, performative contradiction, and modal trap in Step 4. But if it failed Step 3, we might not have gone through Step 4 in full. So we do:
          - Check: Is it an a priori argument? (as defined in 4a)
          - Check: Is it an empirical argument? (4b)
          - Check: Is it a performative contradiction? (4c)
          - Check: Is it the modal trap? (4d)
          - If none of these, then it might be a different kind of argument. We say: "Not a TA; it is an argument of an unclear or different type."

   Step 7: If at any step the question is substantive (i.e., requires philosophical judgment about the soundness of the argument, not just its form) then the procedure hands the call back to the referee.

   Important: The procedure is formal in that it checks the structure and avoids substantive philosophical judgment. However, some steps require interpretation of the paper and thus are judgment calls.

