     - Step 5: Both tests (overreach and question-begging) are substantive philosophical judgments. However, the procedure is only meant to flag these as flaws in the TA, not to definitively rule on the philosophical issue. We note that these tests are judgment calls and the referee should consider them.

   The procedure may misfire on a genuinely novel argument that doesn't fit the taxonomy. For example, an argument that uses a phenomenon P but then infers C in a non-standard way. Also, if the paper uses a novel conception of "necessity" or "possibility", it might be hard to classify.

