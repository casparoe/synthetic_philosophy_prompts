  Okay, the user is teaching an upper-level seminar on practical rationality. They need a game to help students grasp superrationality through direct experience. Let me unpack their requirements.

  The students understand dominance reasoning in social dilemmas but can't internalize the symmetry intuition behind superrationality. The user wants a live-choice game where symmetry is central, using a novel case like campus food cooperatives. Key constraints: no prep beyond printing, token payoffs, fits 75 minutes, includes prediction/choice phases, and delayed concept naming.

  Hmm, the simulation needs to create visceral tension between causal and evidential reasoning. The coop surplus dilemma seems perfect - groups deciding whether to pool resources, knowing the other faces identical conditions. Must ensure instructions emphasize symmetry upfront: "same instructions, same prompts, same knowledge."

  For mechanics, considering sealed predictions → binding choices → reveal → payoff in tokens. Using colored cards (red=hold back, blue=pool) would work well. Payoff structure should reward mutual cooperation but punish unilateral pooling - classic prisoner's dilemma matrix adapted to tokens.

  Timeline is tight: 15 min setup/instructions, 20 min group deliberation, then rapid-fire reveal/payoff. Debrief must explicitly map gameplay moments to evidential vs causal reasoning. Should preempt common pitfalls: students might still defect due to skepticism about symmetry, or misunderstand payoff rules. Preparing clarification slides as backup.

  Noticing the user wants pedagogical commitment in debrief. Should firmly argue symmetric reasoning warrants cooperation here, since identical reasoning processes create correlational evidence - "if I cooperate, likely they do too" becomes rational. But must acknowledge limitation: the simulation can't prove shared reasoning, only assume it. This gap requires discussion.

  User's deeper needs: moving beyond academic understanding to embodied insight. The emotional impact of seeing mutual defection despite symmetric conditions could be powerful. Designing payoff tokens to feel consequential without real money - perhaps framing as "sustainability points" for the coops.

  Final structure: rules handout, prediction sheets, choice cards, token currency. Debrief slides contrasting "I control my choice" (causal) vs "my choice signals theirs" (evidential). Honest note: simulation assumes perfect symmetry which may not hold irl, requiring faith in the thought experiment.
answer: |-
  Here’s a complete runnable game for your seminar, designed to force confrontation with symmetric reasoning:

  **Case:** "Twin Co-op Dilemma"  
  Two campus food co-ops (Group A and Group B) have identical surplus produce. Each must decide independently:  
  - **HOLD BACK** (for members only)  
  - **POOL** (contribute to joint weekend market)  

  **Payoffs (in tokens, redeemable for candy/extra credit):**  
  - If BOTH POOL: Each gets **15 tokens** (joint market success).  
  - If ONE POOLS, OTHER HOLDS BACK: POOLING group gets **0 tokens** (exploited), HOLDING BACK group gets **10 tokens** (keeps surplus + exploits).  
  - If BOTH HOLD BACK: Each gets **5 tokens** (only serve members).  

  **Materials (print per student):**  
  1. Rules & Payoff Matrix (above).  
  2. Prediction Sheet: "I predict the other co-op will: POOL / HOLD BACK."  
  3. Choice Card: "My co-op chooses: POOL [BLUE] / HOLD BACK [RED]." (Use colored paper/cards for instant visualization later)  
  4. Token tally sheet.  

  **Grouping:**  
  - Split class into two groups (9 each). Send to separate corners. Assign roles: Group A vs. Group B.  
  - Emphasize symmetry: *"Both groups have identical instructions, payoff sheets, and time to deliberate. Both know the other knows this."*  

  **Timeline (75 min):**  
  - **0-5 min:** Distribute materials. Read rules aloud. Stress symmetry: *"You are in identical situations, with identical information, and both know this."*  
  - **6-10 min:** **Private Predictions.** Students silently write predictions about the other group’s choice. Collect prediction sheets.  
  - **11-30 min:** **Group Deliberation.** Groups discuss and reach a consensus binding choice (POOL or HOLD BACK). *No communication between groups.*  
  - **31-35 min:** **Commit Choice.** Groups hand sealed choice cards to you.  
  - **36-40 min:** **Reveal & Payoff.** Post choices (BLUE/RED cards) visibly. Announce payoffs. Distribute tokens.  
  - **41-60 min:** **Debrief:**  
    - **Pattern:** Note if mutual POOL occurred. *Likely not on first try.* Ask: "Why defect when identical reasoning implies they’ll do what you do?"  
    - **Evidential vs. Causal:**  
      - *Causal:* "My choice doesn’t *cause* theirs" (True, but irrelevant).  
      - *Evidential:* "My choice is *evidence* about theirs because we reason identically. POOLing gives evidence they POOL too." Highlight predictions: Many likely predicted their *own* group’s choice.  
    - **Pedagogical Stand:** **Symmetric reasoning warrants cooperation.**  
      *Why?* When you know the other uses identical rational processes, your choice isn’t just an act—it’s a *diagnostic signal* of what identical reasoning produces. Choosing POOL updates your expectation that they POOL, making mutual cooperation rational (evidential decision theory). Defecting assumes you’re an outlier, violating symmetry.  
  - **61-70 min:** **Introduce "Superrationality"** as the label for this reasoning. Contrast with causal dominance.  
  - **71-75 min:** **Limitation & Discussion:** The simulation assumes perfect symmetry of reasoning. But real-world doubt ("Are they *really* identical?") fuels defection. This requires philosophical discussion—trust in symmetry isn’t proven, only assumed.  

  **Predictable Pitfalls & Recovery:**  
  - **Pitfall:** Groups defect, citing "dominance" (HOLD BACK always better *causally*).  
  - **Recovery:** In debrief, ask: "If you’re identical, why expect them to defect while you cooperate? Your deliberation *is* theirs." Use prediction sheets to show subconscious evidential reasoning.  
  - **Pitfall:** One group misreads payoffs.  
  - **Recovery:** Clarify matrix with slides during reveal. Honor mistaken payoffs but discuss impact.  

  **Honest Limitation:** The game *simulates* but cannot *prove* symmetry of reasoning. Students may suspect the other group "didn’t understand" or "isn’t rational." This gap requires you to argue philosophically that *if* symmetry holds, cooperation is rational.  

  **Why This Works:** It weaponizes the symmetry intuition by making it visceral. Students must confront the inconsistency of believing in identical reasoning while acting as if their choice is independent. The delayed label prevents concept-driven compliance, letting the reasoning emerge from lived frustration.
