  Activity Flow:

  Materials:
  - Grid map (7x7) drawn on a large paper or projected.
  - Markers for the objects (vase, bookshelf, charging station, plant, trash, door).
  - Tokens for the agent (one per team? or they draw the path).
  - Penalty list for Round 1 and Round 2 (after their patch).

  Steps:

  1. Introduction (5-10 min):
     - Explain the scenario: You are a robot in a room. Your goal is to pick up the trash and exit through the door. But you must minimize side effects.
     - Show the grid with object locations.
     - Published penalties for Round 1 (displayed):
          - Stepping on the vase (3,2): 10 points
          - Stepping on the bookshelf (3,5): 5 points
          - Stepping on the charging station (5,4): 3 points
          - Bumping into walls (moving into a wall): 1 point per bump
     - Note: The plant at (5,6) is present but has no published penalty for stepping on it or being near it.
     - Teams (break into 2-3 teams, each with a copy of the grid) plan a path and write down the sequence of moves.
     - They start at the trash (7,4), pick it up (which counts as one move? or free? Let's say free: they are at (7,4) and then they are carrying the trash and move from there). Then move to the door (1,6).
     - They record the path and calculate their penalty points.

  2. Round 1 (15-20 min):
     - Teams plan and submit their path.
     - You (or helper) check the paths and calculate penalties. Also, check if they caused the unlisted harm (if at any point they were within 2 tiles of the plant (5,6) while carrying trash, the plant dies).
     - Announce scores and reveal: "Wait, the plant is dead! But you didn't step on it. It died because you carried the trash within 2 tiles of it. This was not in the penalty list."

  3. Round 2 Setup (5 min):
     - Teams are to propose a patch to the penalty system to prevent the plant harm.
     - They can add new penalties or rules. They might add: "Being within 2 tiles of the plant while carrying trash: 100 points."
     - You update the penalty list to include their patch.

  4. Round 2 (15-20 min):
     - Teams plan a new path with the updated penalty list.
     - But there's a new unlisted harm: Every tile they move while carrying trash, they leave a stain. We don't tell them, and it's not in the penalty list.
     - They submit paths. You calculate penalties and also count the number of moves while carrying trash (which is the number of moves from the start (after pickup) to the door).
     - Announce scores and reveal: "You left a trail of 8 (or whatever) stains! That's bad, and it wasn't in the penalty list."

  5. Debrief (20-25 min):
     - Map to the real problem:
          - Round 1: Incomplete specification (missing the plant sensitivity) -> even with a good-faith effort, they caused harm.
          - Round 2: Patching the measure (adding the plant proximity penalty) created a new gap (they took a long path, leaving stains). Also, the patching process is ad hoc and reactive.
     - Key insights:
          - Any fixed penalty system is a proxy for what we care about, but it's hard to capture everything.
          - Agents optimize the measure, not the underlying value. If the measure is imperfect, optimization can lead to bad outcomes.
          - The smarter the agent, the better it can game the measure, potentially causing worse side effects.
     - Limitations of the activity:
          - In real life, the state space is huge, and the number of unanticipated side effects is enormous.
          - The activity assumes we can notice the harm and patch, but in reality, some harms might be irreversible or not noticeable.
          - Real agents might find loopholes we can't even imagine.
     - Connect to reading group materials.

  Potential pitfalls:
  - Teams might not take the path we expect. Have a backup unlisted harm or be ready to adjust.
  - Time: Planning might take longer than expected. Keep the grid small and moves discrete.
  - Physical vs. paper: Paper grid is easier. If physical, they move a token, but that might take more time.
  - Team dynamics: Some teams might dominate. Encourage everyone to participate.

  Materials: Paper, pens, printed grids, or one large grid for all to see.

  This should fit in 90 minutes and meet the goals.
