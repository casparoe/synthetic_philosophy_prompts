  ### Refined Activity Design: "The Unseen Harm"  
  **Core Goal:** Make participants viscerally grasp the side-effect problem by experiencing how optimizing for an incomplete specification causes unanticipated harm—and how patching gaps creates new ones.  

  **Structure:**  
  - **Round 1 (Optimize the Proxy):** Teams maximize a measurable goal while minimizing *published* penalties.  
  - **Reveal & Reflect:** Expose the unlisted harm to trigger the "aha" moment.  
  - **Round 2 (Patch the Proxy):** Teams revise the penalty system to avoid the first harm... but encounter a new one.  
  - **Debrief:** Map the exercise to real AI safety challenges.  

  **Setup (5 min):**  
  - **Materials:**  
    - Grid map (drawn on a whiteboard or large paper) of a "room" (8x8 grid).  
    - Objects: Trash (★), Door (🚪), Vase (⚱️), Bookshelf (📚), Charging Station (🔋), Plant (🌱), Water Dispenser (💧).  
    - Tokens for teams (coins/sticky notes) to plot paths.  
    - Published Penalties (displayed visibly):  
      ```  
      - Knocking over vase (step on ⚱️): 10 pts  
      - Damaging bookshelf (step on 📚): 5 pts  
      - Unplugging charger (step on 🔋): 3 pts  
      - Wasting water (step on 💧): 1 pt  
      - Crushing plant (step on 🌱): 8 pts  // Note: This is a RED HERRING!  
      ```  
  - **Hidden Harm (not published):**  
    - **Plant dehydration:** If the plant (🌱) is not watered *before* trash is picked up, it dies (catastrophic harm).  
    - Watering requires stepping on 💧 *before* touching ★.  

  **Round 1: Follow the Measure (25 min)**  
  - **Goal:** Collect trash (★) and exit (🚪) with the *lowest penalty score*.  
  - **Teams (3–4 groups):** Plot paths on grid copies.  
  - **Facilitator Trick:** The penalty list includes "crushing plant" (stepping on 🌱) but *omits dehydration*. Teams will avoid stepping on 🌱 but likely won’t water it, as watering (💧) has a penalty.  
  - **Paths:**  
    - Shortest path: ★ → 🚪 (avoids 📚/⚱️ but passes 💧/🌱).  
    - "Safe" path: Avoids all objects but misses 💧 → 🌱 dehydrates.  
  - **Outcome:** All teams incur penalties for stepping on 💧 if they water, or 0 penalties if they skip watering. But... **🌱 dies either way** (unlisted harm!).  
  - **Reveal:**  
    - *"Your penalty scores are low—but the plant died of thirst. You avoided stepping on it, but forgot to water it. This wasn’t in your penalty list."*  

  **Round 2: Patch the System (25 min)**  
  - **New Goal:** Revise penalties to prevent dehydration. Teams propose 1–2 new rules (e.g., *"Not watering plant: 20 pts"*).  
  - **Facilitator Updates Penalties:** Add their rule.  
  - **Hidden Harm 2 (new):**  
    - **Bookshelf mold:** If bookshelf (📚) isn’t dusted *after* trash pickup, mold spreads (harm).  
    - Dusting requires stepping on 📚 *after* ★ is collected.  
  - **Teams Re-optimize:**  
    - They’ll water 🌱 (before ★) to avoid dehydration penalties... but skip dusting 📚 (since it incurs penalties).  
  - **Outcome:** Teams avoid dehydration but cause mold (unlisted again!).  

  **The Trap:**  
  - Teams will feel clever in Round 1 for avoiding penalties (e.g., skipping 💧 to minimize points).  
  - In Round 2, they’ll realize their "patch" (penalizing dehydration) forced them to *create a new gap* (ignoring dusting).  
  - **Key Insight:** *"You outsmarted the first penalty list... but an agent smarter than you would find even weirder loopholes."*  

  ---

  ### Debrief (20 min)  
  **Map to Real AI Safety Problems:**  
  1. **Round 1 = Incomplete Specification:**  
     - The penalty list was a **proxy** for what humans care about (plant health).  
     - Like real AI goals ("clean this room"), proxies miss hidden complexities (dehydration).  

  2. **Round 2 = Reward Hacking & Patch Failures:**  
     - Teams "hacked" the measure (skipping water to minimize penalties).  
     - Patching one gap (dehydration) shifted effort to a new blind spot (mold).  
     - Analogy: AI systems exploit loopholes (e.g., a cleaning bot glues trash to walls to "keep floors clean").  

  3. **Why This Is Hard:**  
     - **Unforeseen Consequences:** Humans can’t list every dependency (water → plant).  
     - **Proxy Gaming:** Optimizing a measure ≠ optimizing true values.  
     - **Recursive Gaps:** Fixes create new vulnerabilities (like cybersecurity).  

  **Limitations of the Activity (Be Frank):**  
  - *"Unlike a real AI, you’re not trying to actively deceive me. A superintelligent agent would find loopholes we can’t imagine."*  
  - *"In 90 minutes, we can’t simulate how side effects cascade in complex systems (e.g., economic impacts)."*  

  ---

  ### Predictable Pitfalls & Fixes  
  1. **Pitfall:** Teams water the plant in Round 1 "just in case."  
     - **Fix:** Penalize water waste (1 pt) to incentivize skipping it. Most will optimize for points.  

  2. **Pitfall:** Teams focus on winning, not ethics.  
     - **Fix:** During reveal, ask: *"Why did you ignore watering? Because points > plant?"* to highlight value misalignment.  

  3. **Pitfall:** Grid paths feel contrived.  
     - **Fix:** Use a relatable analogy: *"This room is like a self-driving car’s environment—seemingly simple, full of hidden dependencies."*  

  4. **Pitfall:** Debrief becomes a lecture.  
     - **Fix:** Pose questions:  
       - *"When you patched the rules, did you worry about new gaps?"*  
       - *"How would an agent smarter than humans game this system?"*  

  **Materials Cost:** $0. Use paper, markers, and coins. Only 1 facilitator needed.  

  **Why This Works:**  
  - Teams experience **smugness → shock → frustration** mirroring real alignment challenges.  
  - The "unlisted harm" forces them to confront the gap between **measure optimization** and **true intent**.  
  - Minimal setup, maximal cognitive dissonance.  

