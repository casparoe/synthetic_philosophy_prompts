  The core idea: 
  1. Participants play as agents trying to complete an errand (in a physical or grid-world setup) while minimizing penalty points for side effects.
  2. The published list of side effects and penalties is incomplete, missing something important that everyone would agree matters.
  3. Teams compete to minimize penalties, but the incompleteness leads to a situation where following the measure perfectly results in a visibly bad outcome.
  4. Then, reveal the unlisted harm, let them patch the measure, and show that every patch creates new gaps.

  Key elements:
  - The activity should lead to a moment where a team feels smug about gaming the scoring, then realizes the implications for agents smarter than humans.
  - Debrief: map the rounds to the real problem (incomplete specification, proxy measures, etc.) and acknowledge limitations of the activity.

  Constraints:
  - 90 minutes total (including setup, activity, and debrief)
  - Cheap materials, no real money, only one helper (if any)
