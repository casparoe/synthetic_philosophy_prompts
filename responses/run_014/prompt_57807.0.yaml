  The desiderata must cover phenomena to explain, cases to get right, distinctions to preserve, and facts about decision-making under uncertainty. The distinctions include causing harm vs. moral responsibility, actual vs. expected consequences, linear vs. threshold harm structures, individual rationality vs. collective best, and causal contribution vs. complicity.

