  And I'm pretty sure thats not what he actually meant, because obviously he doesn't think torturing babies is fine, but I couldn't figure out in the moment where exactly his argument stops and that much stronger claim starts. Isn't there a difference between "you don't have good justification for your moral beliefs" and "your moral beliefs are actually false"? I feel like I should see the difference but I keep collapsing the two whenever I try to respond to him. Can you help me sort out whether he's actually committed to something as extreme as "morally wrong things are actually fine" or whether the debunking argument is doing something more modest that I'm just not parsing correctly?
