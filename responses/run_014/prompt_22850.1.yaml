answer: |-
  You've hit on a crucial distinction that philosophers wrestle with—and Marcus likely blurred the lines between two very different claims. Let's untangle this step by step:

  ### 1. **What Evolutionary Debunking (Usually) Argues: An Epistemic Challenge**
     - **The Core Claim:** Natural selection shaped our moral intuitions for survival/reproductive advantage, **not for tracking objective moral truths**. Therefore, we lack *justification* for believing our moral intuitions reflect objective reality.
     - **Target:** Moral **realism** (the view that objective moral facts exist independently of human minds).
     - **What It *Doesn't* Say:** That moral beliefs are *false*. It says we can't trust them as guides to truth. It's about **epistemology** (how we know things), not **ontology** (what exists).
     - **Analogy:** If you learned your "gut feeling" about math was shaped by evolution to estimate fruit quantities, not to grasp abstract truths, you'd doubt its reliability on calculus. That doesn't mean calculus truths don't exist—just that your intuition isn't a reliable path to them.

  ### 2. **Marcus's Stronger Claim: Sliding into Error Theory**
     When Marcus said your thought "torturing babies for fun is wrong" is **"false or not really the case,"** he jumped beyond standard debunking into **moral error theory** (e.g., J.L. Mackie). This asserts:
     - Objective moral facts **do not exist**.
     - Therefore, *all* positive moral claims (like "torture is wrong") are **literally false** (or meaningless).
     - We're "projecting" morality onto a neutral world.

  ### 3. **The Gap You Noticed: Epistemic vs. Ontological**
     You're absolutely right to see a gap here:
     - **Debunking (Epistemic):**  
       *"You have no good reason to believe torturing babies is objectively wrong."*  
       (Leaves open the *possibility* it might be objectively wrong—we just can't know it).
     - **Error Theory (Ontological):**  
       *"It is false that torturing babies is objectively wrong because objective 'wrongness' doesn't exist."*  
       (Asserts the non-existence of moral facts).

     Marcus conflated the two. Evolutionary debunking *can* support error theory, but it doesn't *entail* it. Many philosophers (like Sharon Street) use debunking to argue for **moral anti-realism** (e.g., subjectivism, relativism) without saying moral claims are *false*.

  ### 4. **Why Marcus Might Resist the "Baby Torture" Conclusion (Even If He's an Error Theorist)**
     - **Consistency:** Error theorists don't say "anything goes." They can still:
       - **Condemn baby torture as horrific** based on evolved empathy, social contracts, or personal values.
       - **Argue against it pragmatically:** "Societies that allow baby torture collapse," or "I have strong desires to prevent suffering."
     - **His Claim vs. His Feelings:** He can consistently say, *"While 'wrong' has no objective referent, I am evolutionarily and culturally wired to find baby torture abhorrent—and I endorse that wiring."*

  ### 5. **Where to Press Marcus Next Time**
     Ask him to clarify his position:
     - **Q1:** "Are you saying moral facts *don't exist* (error theory), or just that we can't *know* them (skepticism)?"  
     - **Q2:** "If moral facts don't exist, what does it mean when *you* say 'baby torture is wrong'? Are you just expressing disgust?"  
     - **Q3:** "Does evolutionary history *disprove* moral realism, or just challenge how we justify it?"  

  ### Key Takeaway
  Marcus likely overreached. Evolutionary debunking **undermines justification for moral realism**, but it doesn't **prove moral facts don't exist**. The move from "our intuitions are unreliable" to "all moral claims are false" requires extra philosophical heavy lifting he probably didn't provide. Your intuition that "torturing babies is wrong" could still be correct *even if* evolution explains why you believe it—it just means evolution isn't good evidence for its truth.

  **P.S.** Philosophers like David Enfield argue that debunking might only target *specific* moral intuitions (e.g., kinship loyalty), not core judgments like "gratuitous suffering is bad." So even on debunking grounds, "baby torture is wrong" might survive scrutiny better than Marcus implies.
