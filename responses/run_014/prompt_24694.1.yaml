answer: |-
  ### Referendum Scenario: Community Energy Project  
  A town of 10,000 eligible voters must decide whether to fund a $20 million solar farm (Option A) or maintain the existing gas-powered grid (Option B). Independent experts confirm Option A is objectively correct: it will reduce long-term energy costs and carbon emissions, yielding an average net benefit of $2,000 per voter. Each voter has a 52% chance of recognizing this ("competence"), and votes are independent. The cost of voting (time, travel) is $10 per person. Normal turnout is 5,001 voters (∼50%).  

  ---

  ### Condorcet Jury Theorem: High Accuracy at Normal Turnout  
  With 5,001 voters and individual competence \(p = 0.52 > 0.5\), the probability of a correct majority (choosing A) is:  
  - Mean correct votes: \(\mu = 5001 \times 0.52 = 2600.52\)  
  - Standard deviation: \(\sigma = \sqrt{5001 \times 0.52 \times 0.48} \approx 35.335\)  
  - Majority threshold: \(2500.5\) votes (rounded to 2501).  
  - Z-score: \(z = \frac{2501 - 2600.52}{35.335} \approx -2.816\)  
  - Probability (correct majority): \(1 - \Phi(-2.816) \approx 0.9976\) **(99.76%)**  
  **Conclusion:** At normal turnout, the majority is >99% likely to choose correctly.  

  ---

  ### Paradox of Voting: Negative Expected Value for an Individual  
  A voter’s expected benefit of voting depends on:  
  - **Pivotal probability (\(P_{\text{piv}}\))**: Chance their vote breaks a tie among the other 5,000 voters.  
    - Requires exactly 2,500 votes for A and 2,500 for B.  
    - Binomial formula: \(P_{\text{piv}} = \binom{5000}{2500} \times (0.52)^{2500} \times (0.48)^{2500}\).  
    - Normal approximation:  
      - Mean: \(5000 \times 0.52 = 2600\)  
      - Variance: \(5000 \times 0.52 \times 0.48 = 1248\)  
      - \(P_{\text{piv}} \approx \frac{1}{\sqrt{2\pi \times 1248}} \exp\left(-\frac{(2500 - 2600)^2}{2 \times 1248}\right) \approx \mathbf{0.000205}\) **(0.0205%)**.  
  - **Expected benefit**:  
    - Benefit if pivotal and correct: \((2p-1) \times \text{personal gain} = (2 \times 0.52 - 1) \times 2000 = \$80\).  
    - Expected value: \(P_{\text{piv}} \times \$80 - \text{cost} = (0.000205 \times 80) - 10 \approx \$0.0164 - \$10 = \mathbf{-\$9.984}\).  
  **Conclusion:** Voting costs $10 but yields ≈1.6¢ in expected benefit—net loss of $9.984. Rationally, stay home.  

  ---

  ### The Kicker: Collective Self-Defeat  
  If all voters abstain (reasoning individually):  
  - Turnout drops to near zero.  
  - Default rule (Option B) triggers, or minimal turnout (e.g., 1 voter) reduces accuracy to 52%.  
  - **Accuracy collapses** from >99% to ≤52%—a coin flip.  
  **Conclusion:** Individual rationality destroys collective welfare.  

  ---

  ### Key Mechanism and Sensitivity  
  - **Key feature**: Large electorate size.  
    - Pivotal probability \(P_{\text{piv}} \sim \frac{1}{\sqrt{n}}\) collapses as \(n\) grows.  
    - **Remove it?** For \(n = 100\) voters:  
      - CJT: 55% accuracy (\(p = 0.52\))—too low to satisfy condition 1.  
      - Paradox: \(P_{\text{piv}} \approx 0.08\); expected benefit ≈ \(0.08 \times 80 - 10 = -\$3.6\)—still negative.  
      - **Result**: CJT condition fails; no scenario meets all three for small \(n\).  

  ---

  ### Pushback from "Just Vote" Defenders  
  1. **Altruism**: "Voters internalize total social benefit ($20 million), not just personal gain ($2,000)."  
     - Pushback: Expected benefit = \(0.000205 \times (2 \times 0.52 - 1) \times 20\text{M} - 10 \approx \$82 - 10 = \$72\)—now positive.  
     - **Weakness**: Requires voters to value strangers’ welfare as their own—unrealistic for large, anonymous groups.  

  2. **Duty or expressive voting**: "People vote for identity or duty, not outcomes."  
     - **Weakness**: Ignores the original paradox (instrumental rationality). Collective rationality still fails if duty is weak.  

  3. **Low voting cost**: "If cost drops to $0.01, voting becomes rational."  
     - **Weakness**: Costs (time/effort) are often >$1; pivotal probabilities get smaller in larger elections.  

  **Weakest pushback**: Altruism. It rescues the paradox mathematically but assumes voters are purely utilitarian and weight distant strangers equally—a heavy psychological ask. In practice, voter motivation decays with group size.  

  ---

  ### Final Notes  
  All conditions hold simultaneously:  
  1. CJT: 99.76% accuracy at \(p = 0.52\), \(n = 5,001\).  
  2. Paradox: \(P_{\text{piv}} \approx 0.000205\) forces negative expected value.  
  3. Kicker: Abstention collapses accuracy to 0–52%.  

  **No fudging**: Large \(n\) is essential but plausible (real referendums often have 10k–100k voters). Use this to discuss how rationality scales with group size—and why democracy needs more than instrumental logic.
