  Based on the five rulings provided, I'll first reverse-engineer the principle your friend seems to be applying, then apply it to your three new cases. After that, I'll discuss alternative principles that fit the same five rulings, what each predicts for your cases, and suggest a single further case to distinguish between them.

  ### Reverse-Engineered Principle
  The core principle unifying all five rulings is **subjection to the law and long-term territorial presence/residence**. Specifically:
  - **Full membership** requires being a **natural person** who is **long-term resident** in the territory and **fully subject to its binding laws** (including criminal/civil jurisdiction, taxation, and other obligations). Citizenship is neither necessary (as in the permanent resident case) nor sufficient (as in the expatriate case).
  - **Exclusion** applies if any of these are missing: e.g., no territorial presence (expatriate), no subjection to law (diplomat), or not a natural person (implied by the absence of non-human cases).
  - **Rationale**: The rulings prioritize tangible, ongoing integration into the community through legal obligations and physical presence. "Affectedness" alone (e.g., the adjacent foreign resident) is insufficient without legal subjection and residence. The demos is defined by shared subjugation to the state's authority, creating reciprocal obligations and rights.

  This principle fits all five cases:
  1. **Naturalized citizen**: Long-term resident, subject to law → full member.  
  2. **Expatriate citizen**: Not resident, not subject to current law → not a member.  
  3. **Permanent resident**: Long-term resident, subject to law → full member (bar is unjust).  
  4. **Diplomat**: Resident but not subject to law (immunity) → not a member.  
  5. **Adjacent foreigner**: Not resident, not subject to law → not a member (despite affectedness).  

  ### Predictions for Your Three New Cases
  Applying this principle:

  1. **Corporation registered and operating locally**:  
     - **Prediction**: **Not a member** (partial/outsider).  
     - **Why**: Corporations are legal persons, not natural persons. While subject to law and paying taxes, they lack the human agency required for "co-ruling" (e.g., voting, deliberative participation). The principle implicitly assumes natural persons, as all five cases involve humans.  

  2. **Foreign military garrison member** (stationed locally, family in community, but governed by service law):  
     - **Prediction**: **Not a member** (outsider).  
     - **Why**: Not subject to local law due to jurisdictional immunity (similar to diplomats). Despite family ties and residence, their legal subjugation is to foreign military law, not the host state's authority. The diplomat precedent (case 4) applies directly.  

  3. **Large language model (LLM)**:  
     - **Prediction**: **Not a member** (outsider).  
     - **Why**: Not a natural person and lacks physical presence, consciousness, or legal personhood. While affected by regulations (e.g., AI laws), it has no obligations (e.g., taxes, legal liability), and the principle requires human integration.  

  ### Alternative Principles and Their Predictions
  The principle above is not the only one consistent with the five rulings. Here are two alternatives, their fit, and predictions for your cases:

  #### Alternative Principle 1: **Permanent Right to Reside + Subjection to Law**  
  - **Description**: Membership requires a **permanent legal right to reside** (e.g., citizenship or permanent residency) **plus** full subjection to local law. This excludes temporary residents (even if long-term) and emphasizes legal status over duration.  
  - **Fit with original five**:  
