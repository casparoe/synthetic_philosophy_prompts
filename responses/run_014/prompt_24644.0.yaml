    - Case 4 (diplomat): No permanent right (temporary status) → not a member.  
    - Case 5 (adjacent foreigner): No permanent right → not a member.  
  - **Predictions for your cases**:  
    1. Corporation: No permanent right (not a person) → not a member.  
    2. Military member: Likely no permanent right (temporary deployment) → not a member.  
    3. LLM: No permanent right → not a member.  
    *Same as core principle for these cases.*  

  #### Alternative Principle 2: **Functional Integration (Residence + Obligations)**  
  - **Description**: Membership requires **residence plus direct, binding obligations** (e.g., taxation, legal liability), ignoring citizenship. "Obligations" imply reciprocity: contributing to the community creates a claim to co-rule.  
