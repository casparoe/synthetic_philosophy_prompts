    2. Military member: Resident but no binding obligations (exempt from local law) → not a member.  
    3. LLM: No obligations/residence → not a member.  
    *Same as core principle for these cases.*  

  #### Why These Alternatives Fit Equally Well  
  - Both alternatives align with the rulings by emphasizing legal subjugation and presence, but they stress different facets:  
    - **Permanent right**: Focuses on formal legal status (residency rights).  
    - **Functional integration**: Focuses on实质性参与 (obligations like taxes).  
  - The original cases don’t test key distinctions (e.g., long-term temporary residents), so both fit the data.  

  ### Differentiating the Principles: A Single Further Case  
  To distinguish between the core principle (long-term residence + subjection to law), Alternative 1 (permanent right + subjection), and Alternative 2 (residence + obligations), use this case:  

