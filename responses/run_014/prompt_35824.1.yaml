prompt: |-
  So I'm teaching an upper-level decision theory seminar and I need one problem-set question on the Ellsberg paradox, due at a level where the students have already seen the standard vNM material and the two-urn/two-color setup. The thing I want to avoid: them just reciting "people violate Savage's sure-thing principle because they prefer known to unknown probabilities, hence ambiguity aversion." That's the Wikipedia answer and I want to fail it.

  Here's the angle I want the question to take. Consider an agent who, facing Ellsberg's single-urn problem, assigns the ambiguous urn a subjective prior over the red-ball proportion, say uniform on [0,1], and then evaluates each bet by its worst-case expected utility (minimizing over the possible proportions). A student in my class last year claimed this shows Ellsberg behavior is fully compatible with expected utility maximization, since it's just EU over a richer state space with a non-degenerate prior. I want a question that forces students to evaluate that claim precisely: what exactly does this model preserve, what does it give up (e.g., dynamic consistency, or consistency between the agent's prior and how they'd bet on the composition of the urn itself), and whether "ambiguity aversion" ends up doing any real work in the model or is just a relabeling of risk aversion over second-order probabilities. The question should present the worst-case model concretely (with numbers if you like, e.g., comparing the subjective-equivalent-utility of betting red vs. drawing from a known 50/50 urn) and then ask the student to adjudicate.

  Please give me: (1) the question text as students would see it, around 200 words, self-contained so they don't need to look anything up; (2) a model answer of roughly 500-600 words; and (3) a marking scheme out of 20 with four or five must-hit points, saying what each is worth and -- this part matters to me -- a one-line note on how students typically screw up each one (e.g., conflating the worst-case prior with a fixed pessimistic prior, or hand-waving about dynamic consistency without giving an example where the agent's preferences change after an observation).

  Also, tone of the question itself should be plain and direct, no philosophical throat-clearing. And please write the whole deliverable in normal prose, I don't need bullet points everywhere.
