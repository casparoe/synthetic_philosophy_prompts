  Okay, let me tackle this professor's request. They teach an upper-level decision theory seminar and need a problem set question on the Ellsberg paradox that goes beyond surface-level explanations. The key challenge is to design a question that forces students to critically evaluate a specific claim about worst-case EU modeling.

  First, I need to understand the professor's core concern. They want to prevent students from just regurgitating the standard "ambiguity aversion" explanation. Instead, the question should make students analyze whether modeling ambiguity as EU over a richer state space with worst-case optimization truly preserves all aspects of standard EU theory.

  The professor mentioned a student's argument last year that worst-case EU with uniform prior over proportions resolves the paradox while maintaining EU. This seems like the perfect hook. The question should present this model concretely and ask students to dissect what it preserves and what it sacrifices.

  I recall the Ellsberg setup well: single urn with 100 balls, unknown red/black proportion. The critical comparison is between betting on red vs betting on a known 50/50 urn. In the worst-case EU model, the student would calculate min expected utility over all possible proportions.

  For the model answer, I should highlight several key points:
  - How the model technically satisfies EU axioms over an extended state space
  - Why it violates dynamic consistency (e.g., preference reversal after drawing one ball)
  - The inconsistency between the uniform prior and not wanting to bet on the composition
  - Whether this is meaningfully different from standard risk aversion

  The marking scheme needs to reflect these points. Common student errors to anticipate include:
  - Confusing worst-case optimization with having a fixed pessimistic prior
  - Claiming dynamic inconsistency without giving a concrete example
  - Not recognizing the prior/update inconsistency

  I'll keep the question text under 200 words - just present the urn scenario, the worst-case EU model, and the specific claims to evaluate. No philosophical preamble. For the model answer, I'll aim for 500-600 words covering all critical aspects while maintaining academic rigor.

  The numbers matter too - I'll use a 100-ball urn with $100 payoff to make calculations concrete but simple. The known urn should be explicitly 50/50 to contrast with the ambiguous worst-case calculation (which gives 0.5 min EU for red bet).
answer: |-
  ## Question Text (190 words)

  Consider a single Ellsberg urn containing 100 balls, each either red or black. The exact proportion of red balls is unknown to the agent. There is also a known urn containing exactly 50 red and 50 black balls. The agent must choose between bets:

  *   **Bet R:** Win $100 if a red ball is drawn from the Ellsberg urn, $0 otherwise.
  *   **Bet K:** Win $100 if a red ball is drawn from the known urn, $0 otherwise.

  An agent uses the following model: They assign the Ellsberg urn a *subjective prior* over the proportion of red balls, specifically a uniform distribution over [0,1]. However, they evaluate any bet on this urn by its *worst-case* expected utility: for Bet R, they calculate the minimum expected utility achievable over all possible proportions p ∈ [0,1] (assuming linear utility in money). Bet K is evaluated normally.

  A student claims this model: (1) Explains the typical Ellsberg choice pattern (preferring Bet K over Bet R), (2) Is fully compatible with Expected Utility (EU) theory, as it's just EU maximization over a richer state space (including the unknown proportion), and (3) Captures "ambiguity aversion" as a form of risk aversion over the second-order uncertainty (the prior over p).

  Critically evaluate this claim. Precisely explain what aspects of standard EU theory this model preserves and what it gives up. Does this model truly reduce ambiguity aversion to second-order risk aversion within standard EU? Support your analysis with specific calculations and potential inconsistencies (e.g., involving dynamic choices or bets on the composition itself).

  ---

  ## Model Answer (580 words)

  The student's claim requires careful dissection. While the model captures the *choice pattern* and uses EU over an extended space, it fundamentally violates core tenets of dynamic EU theory and misrepresents ambiguity aversion as mere risk aversion.

  1.  **Choice Pattern Explained (Preserved):** Calculating the worst-case EU for Bet R: min_{p∈[0,1]} [p * U($100) + (1-p) * U($0)]. Assuming linear utility (U($x)=x), this min is 0 (achieved when p=0). The EU for Bet K is 0.5 * $100 + 0.5 * $0 = $50. Since $50 > $0, the agent strictly prefers Bet K over Bet R, matching the Ellsberg pattern. *This part holds.*

  2.  **Static EU Compatibility (Partially Preserved):** The model *is* a form of Expected Utility maximization, but over an *enriched state space*. The state space includes not just the draw outcome (Red/Black), but also the *true proportion* p. The agent has a well-defined prior (Uniform[0,1]) over p. However, their choice rule – taking the min EU over p – is **not** equivalent to maximizing EU under this single prior. Maximizing EU under the Uniform[0,1] prior would yield an EU for Bet R of ∫₀¹ [p * 100] dp = 100 * ∫₀¹ p dp = 100 * 0.5 = $50, identical to Bet K. The agent *does not* use this prior for choice. They use a *different functional*: the minimum EU over the support of the prior. While technically EU operates over the richer space, the *minimax criterion* over the prior's support is a distinct decision rule violating the core EU axiom of Independence when applied to acts defined on this space. *It preserves EU syntax over a space but violates its semantics via the minimax rule.*

  3.  **Dynamic Consistency Violated (Sacrificed):** Standard EU requires preferences to be consistent before and after (non-informative) information. This model violates this. Suppose the agent is indifferent between Bet R and Bet K initially ($50 vs min=$0, prefers K). Now, imagine one ball is drawn randomly from the Ellsberg urn *and shown to be black*, before the agent chooses their bet. Under the updated uniform prior over p (now effectively over [0,1] with one black observed, becoming Beta(1,2)), the *worst-case* EU for Bet R is min_{p∈[0,1]} [p * 100] = $0 (still achieved at p=0). However, the EU for Bet K remains $50. Crucially, the agent *still* strictly prefers K over R *after* seeing the black ball. A dynamically consistent EU maximizer under the uniform prior, however, would update: The prior EU for R was $50. After seeing black, the posterior EU for R is ∫₀¹ [p * 100] * f(p|Black) dp. With f(p|Black) proportional to (1-p)*1 (Beta(1,2)), this is 100 * E[p|Black] = 100 * (1/(1+2)) = $33.33. Bet K is still $50. The dynamically consistent EU maximizer now prefers K *even more strongly* ($50 > $33.33). The worst-case agent's preference remains unchanged ($50 > $0), *but the underlying strength/reason hasn't shifted as Bayesian updating would dictate*. More critically, the worst-case agent never updates their *evaluation rule* from min EU to posterior EU; they persistently use min EU based on the *current* support ([0,1] both before and after). This rigidity under new information violates the dynamic consistency implied by Bayesian updating within EU. *Dynamic consistency is sacrificed.*

  4.  **Ambiguity Aversion vs. Risk Aversion (Sacrificed & Mislabeled):** The model does *not* reduce ambiguity aversion to second-order risk aversion within standard EU.
      *   **Prior Inconsistency:** The agent claims a uniform prior over p. Would they accept a bet paying $100 if p > 0.5? The EU under their prior is ∫₀.₅¹ 100 dp = $50. A fair price would be $50. However, their *choice rule* (min EU) values this bet at min_{p∈[0,1]} I(p>0.5)*100 = $0. Their betting behavior on p contradicts their stated prior when using their minimax rule. A true EU maximizer with this prior values the p-bet at $50.
      *   **Nature of Aversion:** In Bet R, the "risk" over p is symmetric (Uniform). A risk-averse EU maximizer over p would value Bet R at *less than* $50 (e.g., using a concave utility over the payoff which depends linearly on p). However, the worst-case model values it at *$0*, an extreme, fixed value independent of the shape or spread of the prior, only its support. It exhibits *complete disregard* for the prior's probabilities, focusing only on the worst extreme possibility. This is fundamentally different from probabilistic risk aversion, which *weights* bad outcomes by their probability. *The model captures an extreme, probability-insensitive pessimism, not standard risk aversion applied to second-order beliefs.*

  **Conclusion:** While the worst-case EU model replicates the static Ellsberg choice pattern and uses an EU structure on an enriched space, it fundamentally violates dynamic consistency and the core principle of probabilistic sophistication inherent in Savage-style EU. It treats the stated prior as merely defining a set of possibilities for minimization, not probabilities for weighting. It misrepresents ambiguity aversion as an extreme, non-probabilistic form of pessimism, not as aversion to the spread of second-order risk.

  ---

  ## Marking Scheme (20 points total)

  1.  **Calculates Worst-Case EU Correctly & Shows Choice Pattern (4 pts):** Demonstrates min EU for Bet R is $0 (U linear) and EU for Bet K is $50, leading to preference for K. *Common Error: Fails to show the min calculation or confuses min EU with EU under the prior.*
  2.  **Identifies EU over Richer Space vs. Minimax Rule Distinction (4 pts):** Correctly states the model uses EU over (p, color) states with a prior but employs min over p as the choice criterion, which violates the EU axioms (specifically Independence relative to the enriched space). *Common Error: Claims it's "just EU" without noting the minimax rule invalidates standard EU maximization under the prior, or conflates using the prior for the state space with using it for EU calculation.*
  3.  **Demonstrates Dynamic Inconsistency Concretely (5 pts):** Provides a clear example (e.g., drawing a black ball first) showing preferences don't update as Bayesian EU under the prior would dictate, highlighting the persistent use of min EU over the full support. *Common Error: Vaguely mentions "updating problems" or "violates dynamic consistency" without a specific, worked-out counterexample showing the preference rigidity and contrasting it with Bayesian updating.*
  4.  **Analyzes Prior Inconsistency / Non-Risk-Aversion (5 pts):** Shows the contradiction between the uniform prior and valuing a bet on p>0.5 at $0 via min EU. Explains how this differs fundamentally from probabilistic risk aversion (aversion to spread/weighted bad outcomes) by highlighting the extreme, probability-insensitive pessimism. *Common Error: Claims it's just "extreme risk aversion" without showing the contradiction on the p-bet or explaining the lack of probability weighting in the min criterion.*
  5.  **Clear Conclusion Addressing the Claims (2 pts):** Summarizes that while the choice pattern is captured and the space is enriched, dynamic consistency and probabilistic sophistication are sacrificed, and ambiguity aversion is not reduced to standard second-order risk aversion. *Common Error: Repeats the student's initial claims without synthesis or provides a weak/muddled conclusion.*
