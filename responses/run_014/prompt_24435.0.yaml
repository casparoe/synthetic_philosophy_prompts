  3. Whether the parents' duty is to the particular child they will have or to the class of possible children?
  4. Whether there is any sense in which the later, healthier child is owed her existence? (That is, if we choose to wait, is the healthy child we then have a child that we were obligated to bring into existence? Or if we choose not to wait, are we depriving that healthy child of existence? But note: if we don't wait, the healthy child never exists.)
