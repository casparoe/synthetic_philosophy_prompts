prompt: |-
  I've been keeping a little list of arguments people around me have gotten into, plus my gut verdict on whether each one is "just about words," and I've realised my verdicts might not add up to anything coherent. Help me figure out if there's a principle here or if I'm just winging it.

  The cases and my verdicts:

  1. My sister (botanist) and her husband (line cook) on whether a tomato is a fruit. Verdict: totally verbal, there's nothing left over once you know which sense each is using.

  2. A guy in my reading group who insists only simples exist -- there are atoms arranged chairwise, but no chair -- against everyone else in the room. Verdict: verbal. I don't think he disagrees with us about anything except which sentences to utter.

  3. Whether Australia is a continent or just a really big island. Verbal, same as the tomato.

  4. Whether a fetus is a person, between my very religious uncle and my atheist cousin at Thanksgiving. Verdict: NOT verbal. That's a real moral fight, and it drives me nuts when people wave it off as semantics.

  5. Whether a chess engine that plays better than any human "really understands" chess. Verdict: honestly I keep flip-flopping, this is the one I'd most like a principle to settle.

  6. My finitist friend says there's no completed totality of all natural numbers; everyone else thinks there obviously is. Verdict: not verbal -- someone here is wrong about math, not about words. Though I'm less sure of this one than I sound.

  The chair guy from #2 claims the fetus case is verbal too: "person" is a term of art, the uncle and cousin are just running it with different thresholds, exactly like "fruit." I refuse, but I can't say why without sounding arbitrary. My tentative test was: a dispute is verbal when, once each side fully grasps the other's usage, nothing is left to disagree about. But the uncle and cousin DO fully grasp each other's usage -- their leftover fight is about moral status -- so by my test they're verbal too. Unless "verbal" secretly means two things: disputes with nothing left over, versus disputes where the leftovers are somebody else's problem (ethics, not semantics)?

  So: is there a principle that gets all my verdicts, especially #4 against #1 and #2? If you have to overturn one of my verdicts, tell me which and why. And say what the principle predicts for the chess engine and the finitist, since those are the ones I can't decide. Lead with your bottom line in the first sentence, then give me the reasoning -- no preamble, no restating my question back at me.
reasoning: |-
  Okay, let's tackle this user's query. They've listed several disputes and their gut verdicts on whether each is "just about words." The main challenge is finding a consistent principle that explains all their verdicts, especially why the tomato and chair arguments are verbal but the fetus one isn't. The user also wants clarity on the chess engine and finitist cases.

  First, I need to recall the key distinction between verbal and substantive disputes. Verbal disputes arise when disagreements stem from different definitions or terminology without underlying factual disagreements. Substantive disputes involve genuine differences in facts, values, or interpretations beyond language.

  Looking at the user's cases:
  1. **Tomato as fruit**: Botanist vs. line cook. Botanically, tomatoes are fruits, but culinarily, they're vegetables. Once both sides understand each other's definitions, there's no real disagreement left. This fits a verbal dispute.
    
  2. **Chair existence**: Metaphysical debate about whether chairs exist or are just atoms. If both parties agree on the physical arrangement but disagree on the term "chair," it's verbal. The user's verdict aligns here.

  3. **Australia as continent/island**: Similar to tomato; depends on geographical definitions. Verbal once definitions are clear.

  4. **Fetus as person**: Religious vs. atheist views. The user feels this isn't verbal because it involves moral status. Even if both understand each other's usage, the moral implications (like right to life) create a substantive disagreement. The user's intuition here conflicts with their initial test because the leftover issue is ethical, not semantic.

  The user's tentative test—disputes are verbal if nothing is left after understanding each other's usage—fails for the fetus case. The key is whether the disagreement persists on non-linguistic grounds. For the fetus, even after agreeing on definitions, the moral conflict remains. Thus, the principle needs to separate linguistic from non-linguistic disagreements.

  For **chess engine understanding**: If "understanding" means human-like cognition, the dispute is verbal because defining it operationally (plays well) vs. phenomenologically (conscious experience) changes the answer. Once definitions are clear, the disagreement should resolve, making it verbal.

  For **finitist vs. infinitist**: This concerns mathematical reality. Whether natural numbers form a completed infinity is a substantive ontological issue. Definitions might differ, but the core disagreement is about mathematical truth, not words. So, not verbal.

  The user's chair guy argues the fetus dispute is verbal, but the user resists. The principle must show that the fetus debate involves moral ontology—what properties grant moral status—which isn't merely semantic. Even with shared definitions, the ethical conflict persists.

  Refining the principle: **A dispute is verbal if disagreement vanishes when both sides adopt the same definitions for key terms, without changing non-linguistic beliefs. If disagreement remains about facts, values, or ontology, it's substantive.**

  Applying this:
  - **Tomato/chair/Australia**: Agreeing on definitions resolves the issue.
  - **Fetus**: Definitions clarified, but moral implications differ → substantive.
  - **Chess engine**: Clarifying "understanding" resolves it → verbal.
  - **Finitist**: Definitions might not resolve the ontological math issue → substantive.

  The user's flip-flopping on chess might stem from conflating operational and phenomenological definitions. The finitist case's uncertainty could be due to differing views on mathematical existence, which is substantive.

  Overturning a verdict? The user's #6 (finitist) is marked not verbal, which aligns. But if finitism involves rejecting abstract objects, it might be seen as verbal. However, the core issue is mathematical reality, so substantive fits. No need to overturn.

  Final principle: **Verbal disputes dissolve under definitional alignment; substantive ones persist due to non-linguistic commitments.** This covers all cases as the user intuited, with fetus being substantive due to moral ontology.
answer: |-
  Your verdicts are mostly correct under this principle: **A dispute is purely verbal if it dissolves when parties agree on definitions and the relevant non-linguistic facts, with no residual disagreement about reality, values, or practical implications.** If disagreement persists after this, it's substantive. This principle holds for all your cases and overturns your verdict on #5 (chess engine), making it verbal. Here's the reasoning:

  ### The Principle Explained
  - **Verbal disputes**: Disagreement vanishes once definitions are harmonized *and* all non-linguistic facts are uncontested. Examples #1–#3 fit: 
    - For #1 (tomato/fruit), agreeing on botanical vs. culinary definitions resolves everything. No moral, practical, or factual stakes remain.
    - For #2 (chair), once both sides clarify that "chair" refers to an arrangement of atoms (not a fundamental entity), no disagreement about physical reality persists.
    - For #3 (Australia), adopting geological vs. colloquial definitions ends the debate. No consequences follow.
    
  - **Substantive disputes**: Disagreement persists after clarifying definitions because it hinges on non-linguistic commitments (e.g., ontology, ethics, or empirical truths). Examples #4 and #6 fit:
    - For #4 (fetus/person), even if both sides agree on the definition of "person" (e.g., "a being with moral rights"), they still disagree on *what grants moral status* (e.g., biological development vs. divine soul). This is a fight about ethics and metaphysics, not words. Your test fails because "grasping usage" doesn't resolve the moral conflict—it *reveals* it.
    - For #6 (finitism), agreeing on definitions (e.g., "totality" as a completed infinite set) won't help because the core dispute is about mathematical ontology: does abstract infinity exist? This isn't semantic—one side denies a mathematical reality the other affirms.

  - **Why your chair guy is wrong about #4**: He conflates thresholds with semantics. In the tomato case, thresholds (e.g., sugar content for "fruit") don't imply moral duties. But calling a fetus a "person" triggers ethical obligations (e.g., right to life). Disagreeing on *which properties confer moral status* is substantive, not verbal.

  ### Overturned Verdict: #5 (Chess Engine) is Verbal
  - **Verdict**: Purely verbal. Disagreement hinges on the definition of "understands." 
    - If "understands" means operational competence (e.g., winning games), the engine qualifies. 
    - If it implies human-like consciousness (e.g., subjective experience), it doesn't.
  - Once both sides specify their meaning, no disagreement remains. No hidden stakes about AI rights or ethics exist here. Your flip-flopping likely stems from ambiguous usage—fixing that resolves it.

  ### Prediction for #6 (Finitist): Substantive
  - **Verdict**: Not verbal (as you judged). Clarifying terms (e.g., "totality" as axiomatic set) doesn't resolve the dispute. The finitist rejects the existence of infinite sets as coherent; others accept them as mathematical objects. This is an ontological fight about abstract reality, not language. Your uncertainty might arise because math involves formal systems, but the disagreement here is about what those systems *refer to*.

  ### Why This Works
  - **Handles #4 vs. #1–#2**: The fetus case (#4) has ethical leftovers (moral status) after definitions are clear; tomato (#1) and chair (#2) do not. "Verbal" isn't about whose problem the leftovers are—it's whether they exist at all.
  - **Robust to "grasping usage"**: Your test fails because grasping usage can *expose* deeper disagreements. The principle fixes this by demanding resolution after definitions align.
  - **No verdicts overturned except #5**: Your instincts on #1–#4 and #6 are sound. The chair guy (#2) is irrelevant to #4—his view confuses semantics with ethics.

  **Bottom line**: Verbal disputes evaporate under definitional clarity; substantive ones root in irreconcilable commitments beyond words. For the chess engine, it's verbal; for the finitist, it's not.
