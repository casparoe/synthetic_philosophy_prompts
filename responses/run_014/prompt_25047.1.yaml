prompt: |-
  I'm a novelist — I've published three literary novels and I teach fiction workshops — and I've been reading about Grice's theory of implicature and speaker meaning because a philosopher friend insisted it would change how I think about dialogue. I've gotten far enough to understand the Cooperative Principle and the four maxims, the idea that speakers can mean things they don't literally say by exploiting or flouting those maxims, and the distinction between what a sentence means and what a speaker means by uttering it. But the vocabulary — implicature, maxims, flouting, the Cooperative Principle as a rational norm — feels alien to how I actually work.

  What I do know, deeply, is the vocabulary of literary craft: subtext, dialogue attribution, free indirect discourse, interiority, dramatic irony, unreliable narration, showing versus telling, register and idiolect, the difference between what a character says and what the narrative voice knows. I can talk for hours about how a line of dialogue lands differently depending on whether it's followed by "she said" or "she said, lying" or nothing at all, or about how a character can mean something the author also means, or something the author does not.

  I'd like you to restate Grice's central claims — about speaker meaning, conversational implicature, the maxims and their exploitation — in the vocabulary of literary craft, as precisely and honestly as you can. Then give me the residue report: which parts of Grice's picture map cleanly onto how I think about dialogue and narrative, which parts you had to fudge or stretch, and which parts have no counterpart in my vocabulary at all. I especially want to know whether the residue points to something Grice's framework captures that literary craft misses, or whether it points to something the craft vocabulary handles that Grice's framework is blind to. In particular, I suspect that Grice's picture presupposes a kind of cooperative transparency between speakers that is simply not in play when a narrator is unreliable or when a character is speaking under dramatic irony — but I'm not sure whether that's a limitation of Grice or a limitation of my understanding.

  Respond in the style of an expert. Think very carefully before answering; I want the translation to be meticulous, not impressionistic.
