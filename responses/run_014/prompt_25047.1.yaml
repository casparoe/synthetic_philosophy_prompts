answer: |-
  ### Translation: Grice's Framework in Literary Craft Vocabulary

  **1. Grice's Cooperative Principle → "Dramatic Purpose in Dialogue Exchange"**  
  In dialogue, characters engage with an unspoken assumption: their words serve a shared *dramatic purpose* within the scene (e.g., advancing conflict, revealing motive). When this purpose is honored, dialogue flows with narrative efficiency. When violated intentionally, it generates subtext or tension.  

  **2. Conversational Maxim Flouting → "Subtext Engineering"**  
  Grice’s maxims (Quantity, Quality, Relation, Manner) map to deliberate craft choices that signal meaning beyond the literal words:  
  - **Quantity Maxim (Informativeness)** → **Brevity vs. Overstatement**:  
    - *Flouting*: A character says too little ("Fine." when asked about trauma) or too much (rambling to avoid truth). The gap between expected and actual detail creates subtext.  
    - *Literary equivalent*: Iceberg dialogue (Hemingway), where omissions imply emotional weight.  

  - **Quality Maxim (Truthfulness)** → **Verisimilitude Breaches**:  
    - *Flouting*: A character lies blatantly ("I never loved him") or uses hyperbole ("This is the worst day ever" on a mundane Tuesday). The disconnect between word and reality signals unreliability or irony.  
    - *Literary equivalent*: Unreliable narration; dramatic irony (e.g., Oedipus declaring he’ll find the murderer).  

  - **Relation Maxim (Relevance)** → **Contextual Dissonance**:  
    - *Flouting*: A character responds irrelevantly ("How’s the weather?" during a breakup). This forces readers to infer hidden connections (e.g., avoidance, power plays).  
    - *Literary equivalent*: Non-sequiturs to reveal psychological states (Beckett, Pinter).  

  - **Manner Maxim (Clarity)** → **Obfuscation Tactics**:  
    - *Flouting*: A character uses ambiguity, jargon, or convoluted syntax ("Perchance we might reconnoiter alternatives" instead of "Let’s leave"). This obscures intent, demanding inference.  
    - *Literary equivalent*: Register shifts (e.g., faux-formality masking fear) or idiolect as character defense.  

  **3. Speaker Meaning vs. Sentence Meaning → "The Gap Between Utterance and Interpretation"**  
  - **Sentence meaning**: The literal words on the page.  
  - **Speaker meaning**: The inferred intent, shaped by:  
    - *Character knowledge* (e.g., a child saying "Mommy’s sleeping" when Mommy is dead).  
    - *Narrative voice commentary* (e.g., free indirect discourse coloring a line like "She was *fine*, absolutely *fine*" with irony).  
    - *Attribution/context* (e.g., "he said" vs. "he sneered" altering reception).  

  **4. Implicature → "Subtextual Inference"**  
  What is *implied* but unsaid arises when maxims are flouted, and readers use three layers to decode:  
  - **Character-to-character implicature**: What one figure believes another means (e.g., a lover hears "I need space" as rejection).  
  - **Character-to-reader implicature**: What the audience grasps beyond the characters (e.g., dramatic irony in *Macbeth*).  
  - **Author-to-reader implicature**: Themes/commentary embedded in dialogue (e.g., Orwellian newspeak critiquing propaganda).  

  ---

  ### Residue Report: Mappings, Stretches, and Gaps  

  #### **Clean Mappings** (Direct Equivalents)  
  - **Subtext = Generalized Implicature**: Both frameworks treat unstated meaning as primary. Grice’s "flouting" is your "subtext engineering."  
  - **Dramatic Irony = Exploiting Quality/Relation Maxims**: When a character speaks falsely or irrelevantly *unwittingly*, readers detect the gap via contextual knowledge (Grice’s "failure to fulfill maxims").  
  - **Register/Idiolect = Manner Maxim Violations**: A character’s linguistic quirks (e.g., verbose evasion) signal psychological or social traits through deliberate obscurity.  
  - **Dialogue Attribution as Implicature Cues**: Tags like "she said, lying" mirror Grice’s "exploitation" of maxims by making violations overt.  

  #### **Stretched Mappings** (Conceptual Fudging Required)  
  - **Cooperative Principle as "Dramatic Purpose"**:  
    - *Stretch*: Grice assumes rational cooperation; fiction often features *malicious* or *pathological* dialogue (e.g., Iago’s deceit). We reframe "cooperation" as "serving the scene’s purpose," even if adversarial.  
    - *Why*: Grice’s model presumes good-faith interaction; craft accepts toxic or irrational exchanges.  

  - **Unreliable Narration vs. Quality Maxim**:  
    - *Stretch*: Grice treats false statements as maxim violations generating implicature. But unreliable narrators (e.g., *Lolita*’s Humbert) *systematically* violate Quality, creating a sustained double meaning. Grice’s framework handles individual lies but not pervasive narrative unreliability.  
    - *Why*: Grice focuses on speech acts; craft considers the *cumulative effect* of deception on narrative voice.  

  #### **Gaps in Grice’s Framework** (What Literary Craft Sees That Grice Misses)  
  1. **Interiority and Free Indirect Discourse**:  
     - Grice analyzes spoken dialogue, not the fusion of character thought/narration. Free indirect discourse (e.g., "Emma would not be deceived") blends a character’s voice with the narrator’s judgment—a layer beyond speaker meaning.  
     - *Residue Insight*: Craft accounts for *whose consciousness filters the utterance*; Grice treats speakers as discrete entities.  

  2. **Authorial Intent vs. Character Intent**:  
     - Grice’s "speaker meaning" applies only to characters. When an *author* imbues a line with thematic resonance (e.g., Melville’s "Call me Ishmael" signaling performative identity), it transcends conversational implicature.  
     - *Residue Insight*: Craft distinguishes between what a character means and what the narrative *does*.  

  3. **Non-Cooperative Transparency in Voice**:  
     - Your suspicion is correct: Grice assumes speakers *want* to be understood. But in craft:  
       - Unreliable narrators *conceal* (e.g., *Gone Girl*’s Amy).  
       - Tragic figures *self-deceive* (e.g., *Othello*’s "It is the cause").  
       - Absurdist dialogue *rejects meaning-making* (e.g., *Waiting for Godot*).  
     - *Residue Insight*: Grice cannot model dialogue where communication *fails* or where opacity is the point.  

  4. **Ambiguity and Interpretive Openness**:  
     - Grice assumes implicature is resolvable ("What did the speaker imply?"). Literary craft embraces *irresolvable* subtext (e.g., the final line of *The Turn of the Screw*).  

  #### **Gaps in Craft Vocabulary** (What Grice Adds)  
  - **Systematic Diagnosis of Subtext**: Grice provides a granular toolkit for *how* a line generates meaning: e.g., "This flouts Relation, so infer X." Craft often relies on intuitive terms like "subtext" without parsing mechanics.  
  - **Rational Norms as Baseline**: Grice’s maxims create a "default setting" for transparent dialogue. Violations become measurable deviations—useful for teaching precise effects of obscurity, lies, or evasion.  

  ### Conclusion: Complementary Blind Spots  
  Grice’s framework excels at dissecting *moment-to-moment inference* in dialogue but stumbles before literature’s orchestrated unreliability, voice fusion, and thematic depth. Your craft vocabulary captures the *experiential and structural complexity* of narrative but lacks Grice’s analytical rigor for implicature generation. **Use Grice to reverse-engineer subtext mechanics; use craft to explore where those mechanics rupture or transcend "cooperation."** The philosopher’s lens sharpens your attention to dialogue as a series of calculated breaches—but the novelist’s terrain is where language bleeds beyond calculation.
