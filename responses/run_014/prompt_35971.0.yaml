answer: |-
  Here is a distilled set of desiderata for an adequate species concept, grounded in biological phenomena, philosophical considerations, and practical needs. Each requirement is motivated by a core case or problem, followed by an assessment of its non-negotiability and potential conflicts with other desiderata.

  ---

  ### **Desiderata for an Adequate Species Concept**

  | Desideratum                          | Motivating Case/Problem                                                                                                 | Non-Negotiable? | Potential Conflicts/Notes                                                                 |
  | :----------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :-------------- | :---------------------------------------------------------------------------------------- |
  | **1. Accommodate Asexual Lineages**  | **Bdelloid rotifers & prokaryotes:** Entire clades lack sexual reproduction. Must avoid defining species *only* via interbreeding. | **Yes**         | Conflicts with Biological SC's core tenet. Phylogenetic SC handles this well.             |
  | **2. Handle Reticulation & Hybridization** | **Ring species (e.g., *Ensatina* salamanders), hybridizing oaks, horizontal gene transfer:** Gene flow blurs boundaries; lineages diverge non-uniformly. | **Yes**         | Conflicts with strict monophyly (Phylogenetic SC). Requires fuzzy boundaries or process-based view. |
  | **3. Cohere with Population Genetics** | **Gene flow, drift, selection:** Species must be units where evolutionary forces act cohesively *or* divergently. Cannot contradict mechanisms of lineage cohesion/divergence. | **Yes**         | Biological & Cohesion SCs align best; Morphological SC may ignore underlying mechanisms. |
  | **4. Operational Utility**           | **Taxonomist with specimens/DNA barcodes:** Must be applicable using static data (morphology, genetics) without observing mating/ecology in situ. | **Yes (Pragmatically)** | Biological SC fails here; Morphological & Phylogenetic SCs excel. "Process" concepts struggle. |
  | **5. Delimitation (Countability)**   | **Need for non-arbitrary classification:** Taxonomy requires identifying discrete units. Philosophical demand for objectivity. | **Contested**   | Conflicts with **Reticulation**; strict countability may force artificial splits/lumps. "Individuals" view softens this. |
  | **6. Species as Individuals (vs. Classes)** | **Evolutionary dynamics:** Species evolve as spatiotemporally bounded lineages (Hull/Ghiselin), not abstract sets. Affects persistence criteria. | **Philosophically Weighty** | Undercuts essentialism; supports dynamic views. Morphological SC often implies classes. |
  | **7. Universality**                  | **Tree of Life scope:** Should apply to prokaryotes, fungi, plants, animals equally. Avoids domain-specific patches. | **Likely No**   | Motivated by desire for unity, but **Asexuals** + **Reticulation** + **Operational Needs** differ wildly across domains. Pluralism may be necessary. |
  | **8. Reflect Evolutionary Role**     | **Units of evolution/diversification:** Species should explain why *this* lineage diversified while *that* one stagnated. | **Core Function** | Ecological/Cohesion SCs emphasize this; Morphological SC may not.                         |

  ---

  ### **Key Tensions & Non-Negotiables**

  1.  **The Reticulation-Monophyly Conflict:** Accommodating **hybridization/ring species** (Des. 2) is fundamentally incompatible with requiring **strict monophyly** (often demanded by Phylogenetic SC variants). *Resolution*: Relax monophyly to allow for "metapopulation lineages" (PhyloSC) or prioritize lineage cohesion over topology.
  2.  **Operational vs. Process-Based Tension:** **Operational utility** (Des. 4) favors character-based concepts (Morphological, Genetic, PhyloSC). Concepts emphasizing processes (Biological, Cohesion SCs) often fail this. *Resolution*: Accept proxy data (DNA barcodes) as evidence for lineage separation, not the definition itself.
  3.  **Countability vs. Reticulation:** Strict **delimitation/countability** (Des. 5) is challenged by **reticulation** (Des. 2). Ring species, hybrids, and microbial networks defy sharp counts. *Resolution*: Accept species as fuzzy/processual *individuals* (Des. 6), where boundaries are real but not always sharp.
  4.  **Universality vs. Pragmatism:** **Universality** (Des. 7) is likely a "preference dressed as demand." Prokaryotes (asexual, HGT-rich) vs. sexually reproducing animals demand different emphases (cohesion mechanisms, gene flow thresholds). *Resolution*: **Pluralism** – different concepts for different domains, justified by differing evolutionary dynamics.

  **Non-Negotiables (Failure invalidates concept):**
  *   Accommodating asexuals (Des. 1)
  *   Handling reticulation (Des. 2 – cannot ignore it)
  *   Cohering with population genetics (Des. 3 – foundational science)
  *   Pragmatic operationality (Des. 4 – science must *work*)

  **Contested/Context-Dependent:**
  *   Strict Countability (Des. 5) – desirable but incompatible with biology's messiness.
  *   Species as Individuals (Des. 6) – philosophically robust, but operational concepts often treat them as classes.
  *   Universality (Des. 7) – biologically unrealistic aspiration.

  ---

  ### **Brief Scorecard of Major Concepts**

  | Concept              | Asexual (1) | Reticulation (2) | PopGen (3) | Operational (4) | Countability (5) | Individuality (6) | Universality (7) | Evolutionary Role (8) |
  | :------------------- | :---------- | :--------------- | :--------- | :-------------- | :--------------- | :---------------- | :--------------- | :-------------------- |
  | **Biological (BSC)** | ❌           | ❌ (Rings/Hyb)    | ✔️          | ❌               | ⚠️ (In theory)    | ✔️                 | ❌ (Asexuals)      | ✔️                     |
  | **Phylogenetic (PSC)**| ✔️           | ❌ (Strict Mono)  | ⚠️ (Ignores process) | ✔️ (With data)  | ✔️ (Often)        | ✔️                 | ⚠️ (Prokaryotes?) | ⚠️ (Lineage focus)     |
  | **Morphological (MSC)**| ✔️           | ⚠️ (If discrete) | ❌ (Proxy)  | ✔️               | ✔️                | ❌ (Class-like)    | ✔️                | ❌                     |
  | **Ecological (ESC)** | ✔️           | ⚠️ (Niche conserv/variation)| ⚠️         | ❌ (Hard to assay)| ⚠️                | ✔️                 | ⚠️                | ✔️                     |
  | **Cohesion (CSC)**   | ✔️ (Mechanisms)| ✔️ (Mechanisms)  | ✔️          | ❌ (Complex)     | ⚠️                | ✔️                 | ⚠️                | ✔️                     |

  **Key:** ✔️ = Strong, ⚠️ = Mixed/Partial, ❌ = Weak/Failure

  ---

  ### **Conclusion: The Inherent Tension**

  The species problem persists because **no concept satisfies all non-negotiable desiderata simultaneously**. The core tension is between:

  1.  **The Dynamic Reality of Lineages:** Evolution involves continuous, often reticulate processes with fuzzy boundaries (Des. 1, 2, 3, 6, 8).
  2.  **The Need for Discrete Classification:** Science and communication require identifying and counting units (Des. 4, 5).

  **Universality (Des. 7) is likely the dispensable "prejudice."** Life's diversity is too great. Prokaryotes, bdelloids, oaks, and fruit flies experience lineage cohesion and divergence via fundamentally different mechanisms. **Pluralism** (different concepts for different domains, defined by the primary cohesive/divergent forces at work) emerges as the most biologically honest solution. The desiderata list *itself* demonstrates why a single, universal, essentialist species concept is unattainable: it demands incompatible things of nature. The "job description" is inherently multi-faceted and context-dependent. Your task is not to find the "winner," but to show *why* the competition has no single victor, and how pluralism (or a carefully prioritized "pluralistic realism") best maps onto the complex reality revealed by the desiderata. Good luck!
