prompt: |-
  I cover science and ideas for a paper, and the golem keeps showing up on my AI and robotics beat — roughly every few months someone in the field will say "we're building a golem" or warn about the "golem problem," and I've realized I've only ever known the story as a vague spooky legend. So I finally sat down with the old tale of the Golem of Prague: a rabbi shapes a giant out of clay from the riverbank, writes a word or a divine name on it to bring it to life, the creature serves as a protector for the community, and then it gets too dangerous or uncontrollable, so the rabbi has to put it down — usually by erasing the word — and it crumbles back into inert clay.

  I want you to read that story through a particular lens in metaphysics, the "statue and the clay" problem or material constitution: the puzzle of how an artifact (a statue) can be a genuinely distinct object from the lump of material it's made of, even though at any moment the statue and the clay occupy exactly the same space and have exactly the same parts, and how that bears on when the statue comes into exist and what its persistense conditions are. Work the golem through that: at what point does the golem come into existence — the moment the word is written, or earlier, when the clay is shaped? Is the golem a "statue" constituted by the clay, or is it just the clay under a different description (is the rabbi creating something new, or discovering / revealing something that was already latent in the material)? What are the golem's persistence conditions compared to the clay's — it can be "killed" or destroyed while the clay is left over and can be reshaped into something else? Does the story actually dramatize the coincidence problem, two distinct objects sharing all their parts, or does it blur the golem and the clay together? And it's worth noting the story is basically a hylemorphic one — inert matter plus an imposed form (the word, the name, the soul) equals a living being — so say where that helps and where it misleads. Where the story resists the reading, say so honestly: does the tale really care about this kind of metaphysics, or am I projecting? I'd like a reading that takes both the story and the philosophy seriously, and ends by saying what the golem legend adds to the debate that a dry argument about statues and lumps of clay doesn't.

  No citations, no reading list, no bibliography please — just the reading itself. I'm trying to get the piece to sound like I actually understand why people keep reaching for this metaphor.
