prompt: |-
  I am reading a trade book on comparative ethics that summarizes the Confucian role ethics reading of early Confucian thought — the interpretation developed by Roger Ames and Henry Rosemont — roughly as follows: "Confucianism rejects the Western ideal of the autonomous individual. There is no inner self standing behind one's social positions: a person just is the totality of the roles into which they are born and educated — son, father, minister, friend. Because what is right is always right for someone in a role, and different roles carry different expectations, Confucian ethics is a form of moral relativism: there are no standards that hold across roles or cultures, only the particular duties of each station. And since the tradition prizes harmony above rules, the ultimate test of conduct is whether it preserves social harmony, which makes Confucianism, for all its talk of ritual, a straightforward consequentialism with harmony standing in for aggregate utility."

  I have enough background to suspect this is a caricature — I recall that proponents of this reading insist they are not relativists — but I cannot locate the errors with confidence. Please audit the summary claim by claim: which parts a defender of the role-ethics reading would accept as roughly accurate, which are conflations or overstatements of more modest theses, and which the defenders themselves explicitly disown. Then tell me whether the book's conclusion — that on this reading Confucian ethics can give no one, in any role, a reason to resist an unjust social order — follows from the parts of the summary that survive your audit. I am inclined to think the relativism charge is the weakest link, but I would also like to know whether the "person just is their roles" claim, taken literally, is something the defenders actually hold or a distortion of a more careful thesis about relational personhood. Keep your answer under 500 words, and begin with a one-sentence overall verdict.
reasoning: |-
  Okay, the user is grappling with a summary of Confucian role ethics from a trade book, which presents it as rejecting individualism, endorsing moral relativism, and prioritizing social harmony in a consequentialist way. They suspect this is a caricature but can't pinpoint the errors. They specifically ask me to audit each claim, identify what Ames/Rosemont would accept or reject, and assess whether the conclusion about lacking grounds to resist injustice follows. 

  Hmm, the user has solid background knowledge—they recall Ames/Rosemont deny relativism—but wants systematic clarification. Their underlying concern seems ethical-political: can Confucianism critique oppression? That's the real stake here. 

  First, I need to disentangle three layers: (1) accurate Ames/Rosemont tenets, (2) the book's overstatements, and (3) implications for social resistance. The "no inner self" claim is tricky—Ames does reject atomic individualism but doesn't reduce persons *only* to roles; it's about relational constitution. The relativism charge is indeed the weakest link because role ethics appeals to role-*transcending* ideals like ren (benevolence) and yi (rightness). 

  Ah, and the harmony point! The book conflates harmony as a *byproduct* of ethical conduct with a *goal*—but Ames stresses harmony emerges from ritual propriety (li), not utility maximization. That misreading fuels the unjust-order conclusion. 

  For the resistance question: since roles imply mutual obligations (e.g., ruler's benevolence), their corruption *creates* grounds for critique. Mencius' "right to revolt" against tyrants proves this. The user's instinct about relativism being the weak link is spot-on, but the harmony misconception is equally fatal to the book's conclusion. 

