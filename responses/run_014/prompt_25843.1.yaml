  Also, the user mentioned avoiding thematic essays. So, every point must tie back to Lewis's concepts. For instance, Tessie's participation until targeted illustrates the conditional preference—conforming as long as others do. Her protest shows the breakdown when the equilibrium fails her. The stones gathered early represent how conventions prepare participants unconsciously, which Lewis's common knowledge explains.

