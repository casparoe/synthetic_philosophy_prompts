  ## Ghazal of the Forked Tongue
  *(after Nietzsche's Genealogy)*

  The eagle scorns the canyon floor. Its height alone is **good**.  
  His shadow? Just a fleeting shape, not understood as "bad," but **good**.

  My gold needs no alloy, my sun no night to burn so **good**.  
  What dims it? Mere obstruction—hardly named, not termed "not good," just **good**.

  First, curse the lightning! Name its strike a monstrous evil, **good**.  
  *Then* praise the meekest candle-flame that sputters, strained, as **good**.

  This jewel, pure, uncut—unseen by worms below—is **good**.  
  Their dank concerns? A distant hum, not *opposite* to **good**.

  Invent the fang, the claw, the thief who stalks the night, **good**.  
  *Then* call your trembling, bolted door a flimsy shield called **good**.

  My laughter shakes the mountain peak, a force untouched by **good**.  
  The cringing thing it startles? Barely marked, not weighed as "bad," just **good**.

  Define the serpent, coil by coil, with venom dripping **good**.  
  *Then* crown the wounded, halting dove whose broken wing is **good**.

  The storm wrecks ships, ignores the pleas—a power wild, **good**.  
  The shattered mast? Debris, not proof some counter-force is **good**.

  We forged our chains from sacred rage—*against* that lofty **good**!  
  Our virtue blooms in poisoned soil, resentment's bitter **good**.

  The peak requires the chasm’s spite to feel its own height **good**.  
  The hater needs the hated thing to claim his wound is **good**.

  ---

  **Formal Notes & Challenges:**

  1.  **Radif & Qafia:** "good" is the strict radif. The qafia (rhyme preceding "good") shifts appropriately each couplet (e.g., height/good, burn/good, evil/good, pure/good, thief/good, force/good, dripping/good, wild/good, lofty/good, height/good).
  2.  **Self-Contained Couplets:** Each couplet presents a complete image or idea reflecting one voice or the other, as demanded by the ghazal form. The argument unfolds through juxtaposition and accumulation.
  3.  **Voice Differentiation (Nietzschean Sorting):**
      *   **Aristocratic Voice (Good/Bad):** Couplets 1, 2, 4, 6, 8. Characterized by self-affirmation, distance, power, indifference to the "other" (merely "not good," unnamed, or irrelevant), natural hierarchy. "Bad" is an afterthought or absence.
      *   **Priestly/Resentful Voice (Evil/Good):** Couplets 3, 5, 7, 9. Characterized by negation ("First curse..."), invention of an enemy ("Invent the fang...", "Define the serpent..."), reaction, wounding, *requiring* an "Evil" to define its "Good." "Good" emerges only *after* and *against*. Note the stronger verbs (curse, invent, forged) and imagery (venom, chains, poisoned soil, wounds).
  4.  **Interdependence (Closing Couplet):** Couplet 10 explicitly states the mutual, albeit antagonistic, dependence: the aristocratic "good" (peak) gains definition *through* the resentment it provokes, while the priestly "good" (wound) *requires* the existence of the resented "good" to define itself against. Neither "good" stands alone.
  5.  **Form vs. Argument:** The ghazal's inherent disjunction *works* here. The strict separation of couplets mirrors the radical separation of the two moral perspectives. The relentless return of "good" highlights the central, shared word whose meaning fractures completely depending on the speaker. The form doesn't fight the argument; it embodies the chasm Nietzsche describes.
  6.  **Nietzsche in a Refrain:** Using "good" as the radif isn't mere cleverness. It forces the constant juxtaposition of its two diametrically opposed meanings within the same structural frame, making the core paradox of Nietzsche's "one word doing opposite work" visceral and inescapable. The repetition becomes a hammer striking the same anvil, forging the contrast anew each time. The poem *needs* this shape to enact the linguistic fracture Nietzsche identified.
