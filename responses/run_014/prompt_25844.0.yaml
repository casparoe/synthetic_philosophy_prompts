  The fatal step is (2p): "Every schmpositive property is possibly instantiated." Because schmpositive includes necessary existence (via the definition's circularity), (2p) literally assumes the possibility of what it's trying to prove - a necessarily existent sphere. Whereas in Gödel's (3), possibility is claimed for positive properties generally, with necessary existence being just one among many. 

  But doesn't Gödel also need to justify the possibility of God? Yes, but the burden is different. The parody's possibility premise (2p) is question-begging by construction, while Gödel's (3) is "merely" an assumption one might challenge. The original argument at least separates the possibility question from the definition of positivity. 

