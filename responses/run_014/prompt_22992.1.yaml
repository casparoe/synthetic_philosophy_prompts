prompt: |-
  I'm on the investment committee of a small quant fund, and we have to decide which of two candidate strategies to run for the coming year. The choice flips depending on which average of returns you use, and the committee is evenly split. Strategy A has a higher arithmetic mean annual return (about 18%) but much higher volatility (about 40%); Strategy B has a lower arithmetic mean (about 13%) but much lower volatility (about 20%). Judged by arithmetic mean, A wins comfortably; judged by geometric mean (the compound annual growth an investor actually realizes), B edges ahead.

  Please draft the short written opinion I'll circulate before Friday's meeting. It should recommend a concrete course of action — which strategy to adopt, and which measure the committee should use to evaluate and report strategies going forward — with a time frame for the decision. It should explain, in terms a non-specialist on the committee can follow, why the two averages diverge and which one tracks what we actually care about, namely the long-run growth of the fund's capital, given that we reinvest returns and that LPs can redeem on short notice. And it should honestly engage the strongest case for the losing side — for instance, the argument that over a single finite year, expected (arithmetic) return is what matters and the geometric mean over-penalizes variance — rather than just restating the log-utility / Kelly argument.
reasoning: |-
  We are faced with a choice between two strategies with different risk-return profiles. Strategy A has a higher arithmetic mean return (18%) but high volatility (40%), while Strategy B has a lower arithmetic mean (13%) but lower volatility (20%). The geometric mean (which reflects the compounded growth) is higher for Strategy B. 

  The geometric mean is the appropriate measure for long-term growth because it accounts for the compounding effect and the volatility drag. The arithmetic mean does not account for the negative impact of volatility on compounded returns. The key insight is that a loss requires a greater percentage gain to break even, and high volatility increases the likelihood of severe losses that are hard to recover from. 

  However, the arithmetic mean is the expected value of the return in any single year. If we were only investing for one year and not compounding, the arithmetic mean would be the right measure. But we are a fund that reinvests returns and has to consider multi-year growth. Moreover, our LPs can redeem on short notice, meaning we must be mindful of the risk of significant drawdowns that could trigger redemptions at inopportune times.

  Therefore, I recommend we adopt Strategy B and use the geometric mean (or equivalently, the compound annual growth rate) as our primary measure for evaluating and reporting strategies going forward. This aligns with our goal of maximizing the long-term growth of the fund's capital and managing the risk of large drawdowns that could lead to redemptions and permanent loss of capital.

  The strongest argument for Strategy A is that over a single finite period (like one year), the arithmetic mean represents the expected return. However, even over a single year, the realized return is subject to volatility, and the geometric mean (which is the arithmetic mean minus approximately half the variance) gives a better estimate of the median outcome. Moreover, because we are a going concern that will compound returns over time and because of the risk of large losses that could force redemptions, the geometric mean is the more relevant metric.

  We should set a time frame for this decision: We will run the chosen strategy for one year and then review its performance, including both returns and risk metrics (volatility, maximum drawdown). However, we must note that one year is a short period and may not fully capture the long-term characteristics, so we also commit to a longer-term view in our strategy evaluation.

  In summary, I recommend:
  1. Adopting Strategy B for the coming year.
  2. Using the geometric mean (CAGR) as our primary performance metric for strategy evaluation and reporting going forward.
  3. Reviewing the performance after one year, with the understanding that we are managing for the long run.

  This approach prioritizes the sustainable growth of the fund and the protection of capital, which is critical for retaining LPs and ensuring the fund's longevity.
answer: |-
  **To: Investment Committee**  
  **From: [Your Name]**  
  **Date: [Current Date]**  
  **Subject: Recommended Strategy & Performance Metric for FY [Year]**  

  After thorough analysis of Strategies A and B, I recommend **adopting Strategy B** for the coming year and **formally adopting the geometric mean (CAGR)** as our primary metric for evaluating and reporting strategy performance going forward. Below, I explain the reasoning in straightforward terms, address the core disagreement, and propose a decision time frame.  

  ### Why the Averages Diverge: Volatility’s Hidden Tax  
  - **Arithmetic mean (AM)**: The "simple average" of annual returns. It answers: *"What’s the expected return in a single year?"*  
    - *Example*: A 50% gain followed by a 50% loss averages to 0% AM, but you’d actually be down 25% (e.g., $100 → $150 → $75).  
  - **Geometric mean (GM)**: The "compounded average" return. It answers: *"What consistent return would grow capital at the same rate over time?"*  
    - The same example above yields a GM of -13.4% (reflecting the $100 → $75 outcome).  

  **The divergence arises because volatility erodes compounded growth**. High volatility (like Strategy A’s 40%) amplifies losses more than gains due to the mathematics of compounding:  
  - A 40% loss requires a 67% gain just to break even.  
  - Strategy A’s high volatility imposes a "volatility tax" on long-term growth, dragging its GM (≈15%) far below its AM (18%). Strategy B’s lower volatility (20%) minimizes this tax, allowing its GM (≈12%) to approach its AM (13%).  

  ### Why Geometric Mean Aligns with Our Goals  
  We care about **long-run capital growth** because:  
  1. **Reinvestment**: We compound returns annually. Volatility drains capital irreversibly.  
  2. **LP redemptions**: Sharp drawdowns (more likely under Strategy A) could force redemptions at depressed values, locking in losses and shrinking AUM.  
  3. **Risk of ruin**: Strategy A’s 40% volatility implies a non-trivial chance of severe losses (>30% in a bad year), which could jeopardize the fund’s survival.  

  GM quantifies these real-world effects. Strategy B’s higher GM signals superior *sustainable* growth, even with a lower arithmetic mean.  

  ### Addressing the Strongest Case for Strategy A  
  Some argue: *"Over a single year, arithmetic mean is the expected return, and GM over-penalizes variance."* This has merit in theory:  
  - **If we had a 1-year horizon and no compounding**, AM would be appropriate.  
  - **However, our reality differs**:  
    - **We are a going concern**: Returns compound across years. Even a single bad year under Strategy A could cripple future growth (e.g., a 40% loss requires 67% to recover).  
    - **Redemptions change the game**: A high-volatility strategy risks triggering capital outflows after downturns, effectively shortening our time horizon.  
    - **Expected ≠ Median outcome**: AM predicts the "average" outcome across many trials, but GM better estimates the *most likely* (median) outcome for compounded wealth. Strategy A’s high skew means "average" returns mask a risk of severe underperformance.  

  ### Recommendation & Implementation  
  1. **Adopt Strategy B** for FY [Year]. Its lower GM-CAGR advantage (≈12% vs. ≈15% for A) better ensures steady growth and reduces drawdown risk.  
  2. **Formalize geometric mean (CAGR)** as our primary strategy metric. AM remains useful for risk-adjusted ratios (e.g., Sharpe), but GM must drive capital allocation.  
  3. **Time frame**: Commit to Strategy B for 12 months. Re-evaluate in Q4 [Year] using:  
     - Realized GM-CAGR,  
     - Maximum drawdown,  
     - Risk-adjusted returns (e.g., Sharpe/Sortino).  

  ### Why This Matters for LPs  
  Using GM transparently communicates our focus on **capital preservation through compounding**—critical for LPs who redeem on short notice. Volatility isn’t just a statistic; it’s a direct risk to their capital and our fund’s longevity. Strategy B offers the smoother path to growth they can actually realize.  

  **Vote to approve Strategy B and the GM metric at Friday’s meeting.** I welcome further discussion.  

  ---  
  *Appendix: Quick Math*  
  - Strategy A: AM = 18%, Vol = 40% → Approx. GM ≈ AM - (Vol²/2) = 18% - (40%²/2) = 18% - 8% = **10%** (actual calc ≈15%).  
  - Strategy B: AM = 13%, Vol = 20% → GM ≈ 13% - (20%²/2) = 13% - 2% = **11%** (actual ≈12%).  
  *Note: The formula GM ≈ AM - (σ²/2) illustrates volatility’s drag. Actual GMs are calculated from simulated returns.*
