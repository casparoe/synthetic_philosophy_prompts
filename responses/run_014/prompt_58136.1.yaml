prompt: |-
  so me and my friend just got out of this exhausting like three hour arguement about who should count as the people for voting and i still cant tell what rule she is actually using

  she swears she is being consistent and here is her track record from the fight:

  she thinks documented immigrants who have lived here like 8 years, work here, kids in school, but havent gotten citizenship yet should be able to vote in everything, not just school board, like full national vote.

  she thinks my cousin who moved to Australia at 22 and hasnt lived here in 18 years should NOT get to vote anymore, even though she still has a passport and follows US politics and has family here.

  she thinks people in Canada downstream from our farms who definitely get our runoff in their lakes are affected but should NOT get a vote here, like maybe they deserve some treaty hearing or compensation but not a ballot.

  she thinks an exchange student here for one semester who rents an apartment and has to follow noise ordinances and campus rules should NOT get to vote here.

  she thinks people doing like 2-3 years inside for nonviolent stuff should still get to vote absentee while they are locked up.

  she thinks 15 year olds should NOT vote, even though she admits climate policy will screw them way more than it screws old people, she just says they arent independent adults yet and you need a cutoff somewhere.

  ok so the new case we never settled: outside our county there are these big apple orchards that bring like 800 guys from Jamaica every year on seasonal contracts, 8 months here, 4 months home, a lot of the same guys have been coming for ten years straight. While they are here they live in a labor camp that is totally goverened by the county, like health inspections, curfew rules, sheriff policing, housing codes, plus a county ballot measure this fall is literally about housing standards for farm labor camps. They shop in town and pay sales tax but their families and permanent homes are back in Jamaica and their visas say they cant settle permanently and have to leave each winter.

  what do you think she will say about whether they should get to vote in the county elections, like for sheriff and that housing measure? I am less interested in who is right than in reverse-engineering her.

  can you lay out at least two different rules that both fit all six of her old verdicts, say what each rule predicts for the orchard crew case, give me your best guess about what she will actually say with reasons, and then tell me what one further test case would seperate the two rules the cleanest?
reasoning: |-
  Okay, let me break this down. The user wants help reverse-engineering their friend's voting eligibility logic based on past positions, then applying it to Jamaican farmworkers. 

  First I notice the friend's decisions seem to balance two things: how deeply rooted someone is in the community versus how directly policies affect them. The documented immigrant case shows she values long-term participation in society (8 years, job, kids in school), while rejecting the cousin abroad who's disconnected despite having formal citizenship. That's clue #1.

  Then there's the affected-but-not-resident pattern: Canadians getting polluted water don't qualify, exchange students temporarily affected by ordinances don't either. But incarcerated people get votes - they're still part of the community, just temporarily restricted. And minors are excluded despite being affected by climate policy, suggesting she prioritizes adult autonomy over pure impact. 

  For the Jamaican workers, I see two possible rules emerging: 
  Rule A focuses on permanent life establishment - do they have independent households and year-round community ties? 
  Rule B asks whether they're subject to daily governance during residency. 

  The workers' seasonal pattern (8 months/year for a decade) is tricky. They're deeply embedded locally when here but lack permanent settlement. Rule A would likely say no vote because Jamaica is their home base, while Rule B might say yes since county rules directly control their daily lives when they're present. 

  I think the friend will lean toward Rule A - she rejected the exchange student (temporary) and cousin (disconnected), so the workers' lack of permanent roots probably matters more than their cumulative time. But she might make an exception for the specific housing measure affecting them directly, though that seems inconsistent with her stance on Canadians affected by pollution. 

  A good test case would be a retiree spending half the year abroad - Rule A would revoke their vote if they established life elsewhere, while Rule B might keep it if they return annually and participate locally.
answer: |-
  Based on your friend's established positions, I can identify two distinct (but overlapping) rules that explain her verdicts. **Your friend will likely say the Jamaican seasonal workers SHOULD NOT get to vote in county elections.** Here's the breakdown:

  ### Two Rules Explaining Her Previous Verdicts
  1.  **Rule A: Permanent Life Establishment & Deep Societal Integration**
      *   **Core Idea:** Voting rights require establishing a permanent life within the political community, integrating into its core societal structures (long-term residence, work, family, paying significant taxes), and having an indefinite stake in its future. Citizenship is preferred but not an absolute requirement if integration is deep and permanent.
      *   **Fits Her Verdicts:**
          *   **Documented Immigrant (Yes):** Deep integration (8 years, work, kids in school), permanent establishment (implied path to stay).
          *   **Cousin in Australia (No):** No permanent residence, no ongoing societal integration, minimal current stake despite citizenship.
          *   **Canadians (No):** Affected but not part of the political community, no residence/integration.
          *   **Exchange Student (No):** Temporary stay, shallow integration, no permanent establishment.
          *   **Incarcerated (Yes):** Permanent life establishment pre-incarceration, still part of the community, temporary restriction.
          *   **15-Year-Olds (No):** Not legally/socially independent adults; haven't established permanent adult lives within the societal framework.
      *   **Prediction for Jamaican Workers (Rule A):** **NO VOTE.** They lack permanent establishment (visa requires leaving, families/homes are in Jamaica). Their integration is deep *while present* but cyclical and explicitly temporary. They are integrated into the *labor* sector but not necessarily the broader permanent societal fabric year-round. They are transient labor, not settlers.

  2.  **Rule B: Subject to Comprehensive Local Governance & Long-Term Impact**
      *   **Core Idea:** Voting rights require being subject to the full scope of a specific jurisdiction's laws and governance *during residency*, with significant long-term impact from its decisions, combined with residency duration/pattern. Citizenship is less relevant than being governed.
      *   **Fits Her Verdicts:**
          *   **Documented Immigrant (Yes):** Subject to all laws, governed locally, long-term impact.
          *   **Cousin in Australia (No):** Not subject to daily US governance, minimal long-term impact from local decisions.
          *   **Canadians (No):** Subject to *some effects* (pollution) but not to the *comprehensive governance* of the US jurisdiction (laws, policing, taxes beyond sales tax).
          *   **Exchange Student (No):** Subject to *some* laws (noise, campus rules) but not the *full scope* of local governance (e.g., likely not paying income/property taxes, temporary impact).
          *   **Incarcerated (Yes):** Explicitly and completely subject to state/government authority and its decisions daily, with huge long-term impact.
          *   **15-Year-Olds (No):** Subject to governance but lack the independence/responsibility of adulthood; impact is future-oriented, not current direct governance of their independent lives.
      *   **Prediction for Jamaican Workers (Rule B):** **POTENTIAL YES (for local elections), but likely NO overall.** They are subject to *very comprehensive* local governance while present (sheriff, housing codes, health inspections, curfew, ballot measure). They have significant long-term impact from these rules over 10 years. However, the *explicit temporary/seasonal nature* of their visas and lack of permanent stake might lead her to say "No" for consistency with the Exchange Student verdict, emphasizing the temporary residency.

  ### Best Guess for What She Will Say & Why
  *   **Verdict:** **NO, they should not vote.**
  *   **Reasons (Likely Blending Both Rules):**
      1.  **Lack of Permanent Establishment:** "Their *real* home and life is in Jamaica. They have to leave every year; they aren't building permanent lives here like the documented immigrant. The visa forbids it. They're workers, not residents settling down."
      2.  **Temporary/Seasonal Nature:** "They're here for a season, like the exchange student, just longer repeated. It's a work contract, not establishing a permanent home. You need to be putting down roots, not just cycling in and out."
      3.  **Citizenship/Intent:** "They aren't citizens and aren't on a path to become citizens. Their whole setup is based on returning home. Voting is for people committed to the community long-term."
      4.  **(Possibly contrasting with Incarcerated):** "Prisoners are still American citizens/residents forced to be away temporarily by the state. These workers choose to come temporarily for work. It's different."
      5.  **(Addressing the Ballot Measure):** "Sure, the housing measure affects them directly *while they're here*, but that's a specific issue. Like the Canadians affected by pollution, direct impact on its own isn't enough for a ballot. They have recourse through labor laws, complaints to inspectors, or their employer, not the ballot box."

  ### Test Case to Cleanly Separate Rule A vs. Rule B
  **The Case:** A **wealthy foreign national** buys a large, permanent vacation home in a US county. They live there for **exactly 6 months and 1 day every year** (meeting a common tax residency threshold). They pay **significant US federal, state, and local taxes** (income tax on US investments, substantial property taxes). They are subject to **all local laws, ordinances, and governance** while present. They are deeply involved in the **local community** (charity boards, funding local projects). They have **no path or desire for US citizenship**; their permanent home, family, and business are in their home country. They plan to maintain this 6-month residency indefinitely.

  *   **Rule A (Permanent Life Establishment) Prediction: NO VOTE.**
      *   *Why:* They lack permanent life establishment *as their primary life*. Their true home, family, and center of life are elsewhere. They are long-term visitors/residents, not permanent settlers integrating fully. Paying taxes and being involved isn't the same as building a life.
  *   **Rule B (Comprehensive Governance & Long-Term Impact) Prediction: YES VOTE (Local/State).**
      *   *Why:* They are physically present and subject to the full force of local/state laws and governance for a significant portion of every year, indefinitely. They pay substantial taxes directly funding the government. They are demonstrably impacted by local decisions (zoning, services, ordinances) and have a long-term, recurring stake. Citizenship is irrelevant; governance is key.
  *   **How it Separates:** This case highlights the tension between *establishing a primary life/permanent integration* (Rule A) vs. being *recurrently subject to governance and having a significant, tangible stake* (Rule B). Rule A focuses on the *nature* of their life (primary/permanent), while Rule B focuses on the *fact* of their governed presence and impact. Your friend's answer here would strongly indicate which principle is dominant. Based on her rejection of the Jamaican workers (prioritizing permanence over governance impact), she'd likely also say **NO** to this wealthy foreign national, aligning more strongly with **Rule A**.
