  Okay, the user is running a graduate seminar on the epistemic standing of moral intuitions. They're focusing on how to distinguish when an intuition tracks genuine normative features versus when it's influenced by framing, affect, or upbringing. Last week, they discussed cases where people's judgments reverse based on framing effects like acts vs. omissions. A colleague from another department commented that this line of inquiry is misguided because "there is no accounting for tastes," suggesting that intuitions are mere preferences and thus not subject to error or alienation. Two students found this decisive, but the user disagrees and wants a structured response for the seminar.

  First, I need to unpack the colleague's remark. The key phrase is "there is no accounting for tastes," which the colleague uses to argue that moral intuitions are preferences. Preferences, in this view, aren't the kind of things that can be mistaken or alienating. The user wants an inventory of distinct claims this proverb might assert, ranging from trivial to ambitious. Each claim needs a one-sentence formulation, a verdict on its truth status, and whether it's compatible with framing sensitivity. I also need to consider if the proverb is just a conversational closer and what happens when it's used as a premise. 

  Then, I have to identify which reading the colleague relies on to deem the inquiry misguided and if that reading holds. The user is concerned about covert classification—whether labeling intuitions as "tastes" assumes they can't be right/wrong, which is exactly what the seminar is investigating. Finally, I need a restricted version of the proverb that's true and allows the inquiry to continue.

  Breaking it down:
  1. **Inventory of Claims**: 
     - Start with platitudes like preferences being subjective. Move to stronger claims like preferences lacking correctness conditions. The strongest might be normative anti-realism. Include the conversational closer interpretation.
     - For each, assess truth status (trivial, substantive, false, etc.) and compatibility with framing effects. Framing sensitivity shows context-dependence, which doesn't automatically make preferences non-cognitive or immune to criticism.

  2. **Colleague's Relied-Upon Reading**:
     - The colleague likely uses Claim 5: Preferences lack correctness conditions. But this covertly classifies intuitions as tastes, preempting the seminar's question. The move from framing sensitivity to "no correctness conditions" is a non sequitur; cognitive states can also be context-sensitive.

  3. **Restricted Version**:
     - A plausible restriction: "Preferences often lack inter-subjective justification." This acknowledges their subjectivity without denying that some preferences (like moral ones) might have objective grounds. Leaves room for the seminar's inquiry.

  Key insights:
  - The colleague's argument might beg the question by assuming intuitions are preferences without correctness conditions.
  - Framing sensitivity doesn't prove non-cognitivism; cognitive errors can also be context-dependent.
  - The seminar can still investigate whether moral intuitions have normative truth-aptness despite framing effects.

  Need to structure the response clearly as a list for handouts, avoiding essay format. Use concise points with verdicts and compatibility notes.
answer: |-
  ### Inventory of Claims: "There is no accounting for tastes"  
  *(Arranged from least to most ambitious)*  

  1. **Formulation**: Preferences are subjective states that vary between individuals.  
     **Verdict**: Trivially true (descriptive fact about preference diversity).  
     **Compatible with framing-sensitivity?**: Yes (framing effects are consistent with subjective variation).  

  2. **Formulation**: Preferences cannot be straightforwardly justified or criticized through reasoned argument.  
     **Verdict**: Substantive and defensible (e.g., in aesthetics or cuisine).  
     **Compatible with framing-sensitivity?**: Yes (framing-sensitivity doesn’t imply reason-responsiveness).  

  3. **Formulation**: Preferences lack objective correctness conditions (i.e., no fact of the matter about whether a preference is "right").  
     **Verdict**: Contentious (disputed between realists and anti-realists about value).  
     **Compatible with framing-sensitivity?**: Yes (if framing-sensitivity is taken as evidence for anti-realism).  

  4. **Formulation**: All intuitive responses are preferences (i.e., non-cognitive states), not truth-apt judgments.  
     **Verdict**: Substantive but false (denies cognitive roles of intuitions, e.g., in logic or mathematics).  
     **Compatible with framing-sensitivity?**: No (framing-sensitivity in cognition, e.g., order effects in syllogisms, doesn’t reduce them to preferences).  

  5. **Formulation**: No attitude classifiable as a "preference" admits of rational alienation (e.g., feeling mistaken about one’s preference is incoherent).  
     **Verdict**: False (people rationally disavow preferences, e.g., due to moral growth or cognitive dissonance).  
     **Compatible with framing-sensitivity?**: Partially (framing may trigger alienation, but not all alienation requires framing).  

  6. **Formulation**: Normative properties (e.g., moral wrongness) reduce to or are identical with preferences.  
     **Verdict**: Contentious (ambitious subjectivist meta-ethics).  
     **Compatible with framing-sensitivity?**: Only if framing-sensitivity is constitutive of normativity (contentious).  

  7. **Formulation**: The proverb is not an assertion but a conversational closer (i.e., a pragmatic signal to end debate, not a truth claim).  
     **Verdict**: Plausibly true in ordinary use.  
     **When pressed as premise**: It collapses into one of #1–#6, risking equivocation or question-begging (e.g., assuming "tastes" = non-rational preferences).  

  ---

  ### Analysis of the Colleague's Argument  
  **Claim relied on**: Likely #3 or #4, but covertly presupposes #4.  
  **Does it deliver the conclusion?** (That the inquiry is "misguided")  
  - **Yes, but question-beggingly**: The colleague assumes moral intuitions *are* "tastes" (preferences) with no correctness conditions (#4). This covertly classifies them as non-truth-apt, settling by fiat the seminar’s open question (whether they track normative truth).  
  - **Why it fails**:  
    - Framing-sensitivity alone does not prove intuitions lack correctness conditions (e.g., perceptual judgments are framing-sensitive but truth-apt).  
    - The move from "preferences lack correctness conditions" to "moral intuitions lack correctness conditions" requires independent argument (e.g., that all intuitions are preferences), which wasn’t given.  

  **Restricted version compatible with the inquiry**:  
  > "There is no accounting for tastes *in domains where correctness conditions are absent*."  
  **Restriction**: Limits the proverb to non-normative preferences (e.g., liking chocolate). Preserves space for investigating whether moral intuitions have correctness conditions despite framing effects.  

  ---

  **Format note**: This list is designed as a handout for seminar use. Key terms are concise and verdicts are action-oriented (e.g., "contentious" flags debatability).
