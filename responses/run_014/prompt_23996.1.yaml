prompt: |-
  Ok so I've been mulling over lexical threshold negative utilitarianism — the view that suffering is lexically prior to pleasure (i.e. no amount of pleasure can offset enough suffering) and that there's some threshold of total suffering above which a state of affairs is just morally bad, full stop, no matter how much happines is in it — and I keep getting stuck on the premise underneath it all, which is whether pleasure and pain are actually commensurable in the first place.

  Here's what I want: your actual credence that pleasure and pain are commensurable in the strong utilitarian sense — meaning there's a single scalar unit and a fixed exchange ratio r such that r units of pain exactly cancels 1 unit of pleasure, and this holds uniformly across magnitudes, across durations, and across different kinds of beings. I don't want "it depends on your axiology" or a restatement of the debate. I want a number and the decomposition.

  Break it into sub-questions and give each a rough probability with one line of why: (a) whether pain and pleasure have a continuous scalar structure at all versus a lexical or discontinuous one, so that some pains just can't be netted out by any amount of pleasure; (b) whether the exchange ratio is the same at every magnitude — a tiny annoyance trading against a tiny pleasure at the same rate as torture against bliss, which is exactly where the threshold and lexical versions bite; (c) whether the comparison is even well-defined across different beings and across acute vs chronic states; and (d) whatever other term you think belongs, like whether the total-vs-average framing changes the ratio. Keep in mind the strong claim basically needs (a) through (c) to all hold, so your weakest term is going to drag the headline down. Then combine them into the headline number and tell me which sub-question that number is most sensitive to — the one that, if I argued you wrong on it, would move your answer the most — and what evidence or argument would do that.

  One more thing: please seperate what's actually settled here versus what's genuinely contested among people who work on this. I'd rather you flag a point as "this is really up in the air and reasonable people disagree" than flatten a live debate into "the view." Same for the lexical-threshold part — if the exact shape of the threshold (a hard flip, an asymptote, something in between) is something people disagree about, say so instead of picking one and presenting it as settled.
