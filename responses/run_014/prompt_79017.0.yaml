   Let me write the scenario again, being careful to avoid any verdict language and to make the mechanisms clear.

   **The Scenario of Hillvale Colony**

   Hillvale is an ant colony of the species Formica ex machina. The colony has a nest with a central chamber, a pantry for food storage, and tunnels leading to the outside. The ants communicate via pheromones:

