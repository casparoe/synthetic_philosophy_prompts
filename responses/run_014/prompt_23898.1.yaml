answer: |-
  In acausal settings, rational agency must consider logical dependencies between decision procedures, not merely physical causation. The threatener's prediction is a logical function of your decision algorithm. By selecting an algorithm that outputs compliance, you logically entail that the threatener's prediction (which inputs your algorithm) outputs "comply". This causes—in the broader logical sense—the threatener to not execute the harm. The outcome is counterfactually dependent on your algorithm's *function*, not its temporal execution.

  The paradox dissolves upon recognizing that "cause" here refers to logical necessity across possible computations, not spacetime events. Your compliance does not *physically* prevent harm, but *being a complying type* logically necessitates its absence via the threatener's perfect prediction. Rationality requires optimizing over algorithm-space, where this dependency exists. CDT's failure stems from its myopic focus on physical act-causation, neglecting that the threatener's act is counterfactually linked to your disposition.

  **Strongest objection:** "If the prediction is already made before I act, my actual choice is causally inert. Why 'pay' when the outcome is fixed?"  
  **Standard reply:** Decision theory evaluates *which algorithm you instantiate*, not the temporal act. The prediction is a function of your implemented algorithm; choosing to *be* a non-complying type would have logically resulted in prediction of non-compliance and harm. Your algorithm's counterfactual properties—not your momentary choice—are what matter.
