  so im a junior and we had this big fight in art class about originals vs fakes and its been living in my head rent-free lol. my teacher keeps saying an original is special because of like its whole backstory and who actually touched it and made it, even if you literally cant see any difference. my brother says thats stupid and its only about what it looks like to you right now, like if a copy looks exactly the same then its just as good and people are just being snobs.

  can you compare those two takes for me using these two wierd cases from school: one is this landscape a senior painted for the main hallway, the school made a perfect scan and hung the print in the library so the real one wouldnt get sun damage, and even our teacher couldnt tell which was which till she flipped them over but everyone still treated the hallway one like the real art. the other is my friend printed a kinda blurry copy of the same painting on regular printer paper and taped it in her locker, everyone knows its fake and it looks worse, but she says she loves it just as much cause she sees it every day and it cheers her up. like which take explains each case better and what does each one get definately wrong? and what would each say about an AI picture that never even had an original?
