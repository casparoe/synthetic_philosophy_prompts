prompt: |-
  Okay so I'm 37 and I've been offered a job that would move my whole family to another country for at least six years, and it's a real step up but it means uprooting everything, and as I've been trying to decide I've noticed I keep weighting my present life and my future life in ways that don't add up and I can't tell if I'm being rational or just being impulsive and a bit of a hedonist. So I've been trying to figure out what I actually think by going through a bunch of cases and writing down my gut, and I want to know if there's a principle behind my answers or if I just have to drop some of them. Here's where I land:

  Money and pain for me:
  - $100 today vs $105 in a year: today, no contest.
  - $100 today vs $200 in 50 years: still today, honestly, I'm not even a little tempted.
  - A day of really intense pain, now vs in a year: I'd take it in a year.
  - A day of really intense pain, now vs in 50 years: in 50 years, obviously.

  Where my life sits in time (the weird one):
  - If I could choose to have my life -- me, exactly as I am, all my memories and my relationships -- have been lived 50 years ago (so it's over and I'm gone) instead of 50 years from now (so it hasn't happened yet and I dont exist), I'd pick the past. I don't know why, I just do.
  - But if the choice is my life 50 years ago vs my life 10 years from now (which will definitely happen and will leave a trace), I start to get unsure and I might actually pick 10 years from now. I think.

  Other people:
  - I care way more about my five-year-old nephew's welfare in 2030 than a random stranger's welfare in 2030.
  - I care more about my nephew in 2030 than my nephew in 2100.
  - But my nephew in 2100 vs a stranger in 2030? I don't know, I keep flip-flopping, and I feel like I'm just rationalizing whatever I pick.

  The one I can't shake: I discount my own future so hard (I'd take $100 now over $200 in 50 years) but I'd also rather have my whole life be in the past. If I discount the future because I value my present self most, that doesn't explain why I'd prefer my life to be in the past -- my past self is gone, I don't value it more than my present self. So either these two answers have different explanations and there's no single principle, or there's a principle I'm not seeing.

  So: is there a principle -- or a small set of candidate principles -- that captures most of this? I want it stated precisely, with which of my cases motivates each part, and I want you to be honest about which of my verdicts it can't save. And please tell me what it predicts for cases I haven't listed, like: would I rather die now or in ten years (I know the answer is in ten years, but does your principle get that, or does it break?), and what about whether I'd rather have been born in 1975 or 2075? I suspect the answer to that one will expose the whole thing.

  And one more: is my discounting even a time preference in the pure sense -- like, do I value the future less just because it's in the future, or is it all really about uncertainty and about who the person is (me vs a stranger vs my nephew)? I don't know which and I think thats the actual question.
reasoning: |-
  Hmm, the user is dealing with a major life decision about moving their family abroad for six years and is struggling to reconcile their inconsistent time preferences. They've provided detailed thought experiments about money, pain, and existential scenarios that reveal contradictions in how they value present vs future experiences.

  Looking at their money preferences: They strongly prefer $100 today over $105 in a year, and even over $200 in 50 years. For pain, they'd postpone it to the future - a year or even 50 years later. This shows hyperbolic discounting where immediate gains are prioritized while future costs are deferred.

  The existential preferences are fascinating. They'd choose to have lived 50 years ago rather than exist 50 years in the future, but get uncertain when comparing 50 years ago versus 10 years from now. This suggests a "completed life" bias where closure matters more than potential future existence.

  About others: They clearly prioritize their nephew over strangers in the near future (2030), but discount the nephew's distant future (2100). The nephew in 2100 vs stranger in 2030 creates moral conflict - it seems kinship discounting weakens over time while spatial proximity strengthens.

  The core paradox is the contradiction between heavily discounting their own future while preferring their life to be in the past. This can't be explained by standard time preference models. Their pain deferral shows they don't intrinsically devalue future time - the asymmetry points toward something deeper about existence and narrative.

  The key might be an "agency asymmetry" where they value future events they can control or experience (like deferring pain), but discount future states where they're passive (like receiving money in old age). The preference for a completed life in the past suggests a "narrative closure" principle - valuing life as a coherent story with an ending.

  For unresolved cases: Their nephew in 2100 vs stranger in 2030 highlights conflict between kinship (weaker over time) and temporal proximity (stronger). The birth year question (1975 vs 2075) would likely reveal their "lived experience" bias - they'd choose 1975 to have actually existed rather than potential future existence in 2075.

  Their discounting isn't pure time preference but involves multiple dimensions: agency, epistemic access (knowing the past vs uncertain future), and narrative identity. The job decision anxiety makes sense - moving abroad creates uncertainty that triggers their aversion to uncontrolled futures while the promotion offers agency. The real conflict is between preserving their known life narrative versus authoring a new chapter.
answer: |-
  Based on your thought experiments, your preferences reveal a sophisticated interplay of *four core principles* that create apparent contradictions when viewed through a single lens (like pure time preference). Here's a precise breakdown, linking each principle to your cases:

  ### The Four Principles
  1.  **Hyperbolic Agency Discounting:** You discount future benefits *you receive* steeply for the near term (1 year), less steeply for the far term (50 years), but you *do not discount* future costs *you control*. This is agency-dependent.
      *   *Motivated by:* `$100 today vs $105 in a year` (steep discount) and `$100 today vs $200 in 50 years` (still discount, but less steep relative to time). Contrasted with `pain now vs pain in a year/50 years` (no discounting of future cost; you readily defer it).
      *   *Why not pure time preference?* If you simply valued the present more, you'd also want to defer pain *less*. You don't. Your discounting applies primarily to *gains you experience*, not burdens you bear.

  2.  **Epistemic Certainty & Narrative Closure:** You value completed, knowable existence (the past) over uncertain potential existence (the distant future), especially when the "self" involved feels discontinuous.
      *   *Motivated by:* `Life lived 50 years ago (known, closed) vs life 50 years from now (unknown, open)`. You choose the past. The uncertainty of *being* that future self ("will I even be 'me'?") makes it less valuable than the certainty of your completed narrative.
      *   *Qualifier:* `Life 50 years ago vs 10 years from now` creates hesitation because the 10-year future feels more continuous with your current self ("me, just older") and less existentially uncertain than the 50-year future ("a different person?").

  3.  **Kinship Discounting with Temporal Erosion:** You discount the welfare of others based on genetic/social distance, but this discounting *increases* (you care less) as the temporal distance *to them* increases.
      *   *Motivated by:* `Nephew 2030 > Stranger 2030` (kinship discounting). `Nephew 2030 > Nephew 2100` (temporal erosion of kinship). `Nephew 2100 vs Stranger 2030` causes flip-flopping because Kinship Discounting weakens over long time horizons (making Nephew 2100 feel more like a stranger) while Temporal Proximity (Stranger 2030 is closer in time) strengthens concern for the nearer stranger.

  4.  **Present-Biased Experiential Hedonism (with Mortality Salience):** You prioritize maximizing positive subjective states *for your current, known self* and actively avoid contemplating the cessation of self (death/old age).
      *   *Motivated by:* Hyperbolic discounting of money (get the pleasure *now*). Preference for deferred pain (avoid negative state *now*). Strong preference for `die in 10 years > die now`. The steep discounting of distant future money ($200 in 50 years) reflects both the hedonism ("I want the pleasure now") and mortality salience ("I might not be here/it won't matter to *me*").
      *   *Connection to Narrative Closure:* Preferring your life in the past avoids confronting the *end* of your narrative (death) – it's already settled. Deferring pain avoids a negative state *now*. Taking money now maximizes a positive state *now*.

  ### Resolving the Core Paradox
  *   **The Paradox:** Heavy discounting of *own future benefits* (`$100 now > $200 in 50 years`) vs. preferring *life completed in the past*.
  *   **Resolution:** These are driven by *different principles* acting on *different aspects*.
      *   **Discounting Money:** Driven by **Present-Biased Hedonism** (I want the pleasure now) and **Mortality Salience** (Future money has little value *to my current experiential self* if I'm dead/infirm/unrecognizable).
      *   **Preferring Life in Past:** Driven by **Epistemic Certainty & Narrative Closure** (My story is complete and known; no uncertainty, no confronting decay/death) and avoidance of **Mortality Salience** (Contemplating existing 50 years in the future forces confrontation with aging and death). It's *not* about valuing your past self *more* than your present self; it's about valuing the *certainty and closure* of a finished narrative over the *uncertainty and inevitable decline* of an open one.

  ### What the Principles Predict (and Where They Struggle)
  1.  **Die now vs Die in 10 Years:** Predicts **Die in 10 Years** strongly. *Motivated by:* **Present-Biased Hedonism** (10 more years of experiences) and **Mortality Salience Avoidance** (choosing death now is extreme confrontation). *Fits perfectly.*
  2.  **Born in 1975 vs 2075:** Predicts **Born in 1975**. *Motivated by:* **Epistemic Certainty & Narrative Closure** (1975 leads to a life that *has already happened* and is knowable by you now; 2075 is profoundly uncertain). **Mortality Salience** (Being born in 2075 means you don't exist *now*, which is existentially unsettling). *This exposes the core: your preference for the past isn't chronological, it's epistemological/experiential.*
  3.  **Nephew 2100 vs Stranger 2030:** Predicts **Ambivalence/Flip-Flopping** as stated. *Motivated by:* Conflict between weakened **Kinship Discounting** (Nephew 2100 feels distant/less connected) and **Temporal Proximity** (Stranger 2030 is closer in time, making their welfare feel more salient/relevant to your current world). *Fits your reported struggle.*
  4.  **A New Case: $100 for Your 80-Year-Old Self vs $50 for Your Current Self:** Predicts **$50 for Current Self**. *Motivated by:* **Hyperbolic Agency Discounting** (steep discount on distant benefit to a future, less agentic self) and **Present-Biased Hedonism**. Would likely outweigh Kinship (even with yourself!) at that distance.

  ### Verdicts the Framework Struggles With
  *   **The Slight Hesitation on `Life 50 years ago vs 10 years from now`:** The principles predict a *lean* towards 10 years from now (greater **Epistemic Continuity** with your current self than 50 years) but acknowledge the pull of **Narrative Closure**. Your reported "unsure, might pick 10 years" fits, but the framework doesn't strongly predict the *degree* of uncertainty. It relies on the inherent fuzziness of "continuity of self" perception.
  *   **The Intensity of `$100 now > $200 in 50 years`:** While explained by Hedonism/Mortality Salience, the *steepness* of this discount (only 2x for 50 years!) is extreme by common standards. The principles explain *why* you discount, but not necessarily the precise *degree*.

  ### Is it Pure Time Preference? Absolutely Not.
  Your discounting is **not** driven by time itself. It's driven by:
  1.  **Agency & Control:** You discount passive future gains heavily but actively defer burdens.
  2.  **Uncertainty & Epistemic Access:** You value the known past over the unknown future. Time is a proxy for uncertainty.
  3.  **Self-Continuity Perception:** Your connection to your future self weakens over long horizons.
  4.  **Kinship & Empathy Decay:** Your concern for others diminishes with both genetic and temporal distance.
  5.  **Hedonic State Maximization:** You prioritize your current subjective experience.
  6.  **Mortality Awareness:** Awareness of death/frailty devalues the distant future *for your current self*.

  **Regarding the Job:** This framework explains your anxiety. Moving is a massive *present cost* (uprooting life - violates **Hedonism**), involving huge *uncertainty* (violates **Epistemic Certainty**), for a *future benefit* (promotion - heavily discounted by **Hyperbolic Agency/Mortality Salience**). The principles favoring the move are weaker: the *potential* for future narrative (**Closure** is about the *end*, not the middle) and agency over your career path. Your gut reactions aren't irrational or purely impulsive; they're the complex output of these deeply held, sometimes conflicting, valuations. The conflict lies *between* the principles (e.g., Hedonism vs potential future Agency/Narrative), not within a single inconsistent one.
