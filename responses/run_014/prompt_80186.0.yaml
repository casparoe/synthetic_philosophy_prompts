  First, I need to accurately map out Peirce and James' actual positions to avoid caricatures. Peirce's view of truth centers on the ideal community of inquirers at the end of infinite investigation - it's mind-independent and stable. James shifts this toward what "works" practically for individuals in their experiences. Maya criticizes James for removing Peirce's communal limit, leading to relativism, while Jonah defends James as a pluralist focusing on lived experience.

  Looking at their exchange: Maya starts by arguing James collapses truth into "whatever feels good," using the Napoleon delusion example. Jonah counters that James explicitly links "works" to experiential guidance and consequences - the Napoleon belief fails because acting on it leads to confinement. Maya then points to circularity in James' verification process and raises the case of terminally ill Ruth whose afterlife belief "works" but is likely false. Jonah responds that James cares about cash value in actual life, not hypothetical ideal inquiry.

  The core disagreement emerges: truth as limit (Peirce) versus process (James). Maya argues James has no stopping condition while Peirce offers stability; Jonah counters that Peirce's limit is unattainable and thus useless for actual inquiry.

