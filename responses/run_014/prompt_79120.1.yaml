prompt: |-
  I chair a committee at my university that's meant to replace our annual research-output and teaching-quality numbers with a proper outcomes dashboard, and I keep having the same fight with the provosts office: they treat Goodhart's law as a slogan you nod at and then get on with it. I want to hand them a procedure instead. Write me an ordered checklist the committee can run on each proposed indicator before we adopt it — five or six tests, in order, with what counts as a clear fail on each and which failure mode that test is there to catch. Use the four-way split that's kicking around in the alignment literature (Garrabrant's, written up by Manheim) as the spine — the proxy degrading as you push on it, the tail behaving unlike the middle, the proxy being causally downstream of what you actually care about, and people gaming the number on purpose — not just the measure-becomes-target line. Mark which steps are genuine technical checks and which are really judgements about what kind of department we want to be, and say where a test is inconclusive and a person has to decide. Then run it on three candidates: publications weighted by journal prestige, mean student evaluation scores, and a peer classroom-observation scheme. At least one of them should come out fine by the procedure even though I won't like the answer, and tell me straight what the procedure can't settle. Two weeks, half the committee are humanists who distrust numbers, and the provost has to sign off. And be explicit about which bits here are settled among people who study measurement and gaming and which are genuinely contested — don't hand me one camp's line as the consensus.
reasoning: |-
  We are creating an ordered checklist for evaluating proposed indicators, based on the four failure modes from Garrabrant/Manheim:

  1. Proxy degradation when pushed (intensification): When you optimize the metric, the proxy relationship breaks.
  2. Tail behavior: The metric behaves differently at the extremes than in the middle.
  3. Causal downstream: The metric is causally downstream of the true goal, so optimizing it doesn't necessarily improve the goal.
  4. Direct gaming: People manipulate the metric without changing the underlying quality.

  Additionally, we note that Goodhart's law is often summarized as "when a measure becomes a target, it ceases to be a good measure." The four-way split above breaks down the ways this can happen.

  We'll design a five-step checklist (with one step being split into two parts, making six tests in total). The steps are:

  Step 1: Check for causal downstream (Is the metric causally downstream of the true goal?).
  Step 2: Check for proxy degradation under intensification (What happens if we push hard on this metric?).
  Step 3: Check for tail behavior (Does the metric behave differently at the extremes?).
  Step 4: Check for direct gaming (How easy is it to game the metric without real improvement?).
  Step 5: Check for perverse incentives and unintended consequences (What are the likely behavioral responses?).
  Step 6: Check for alignment with institutional values (Does this metric reflect what we truly value?).

  We note that Steps 1-4 are technical checks (though they may require expert judgment), Step 5 is a mix of technical and judgment, and Step 6 is entirely about institutional values.

  For each step, we define:
  - What the test is.
  - What counts as a clear fail.
  - The failure mode it is designed to catch.

  Then we run the three candidate metrics through the checklist.

  ---

  **Checklist for Proposed Indicators**

  **Step 1: Causal Downstream Test**
  - *Test*: Determine whether the metric is causally downstream of the true goal. That is, does improving the metric actually cause improvement in the true goal, or is the metric merely correlated? Alternatively, could the metric be improved without affecting the true goal (or even harming it)?
  - *Clear Fail*: The metric is clearly a result of the true goal but not a cause (e.g., a symptom rather than a lever). Also, if the metric can be improved without any change (or with negative change) in the true goal, that is a fail.
  - *Failure mode*: Causal downstream (Type 3 in the four-way split). This test catches the situation where the metric is an effect, not a cause, of what we care about.
  - *Nature*: Technical check (requires understanding of causal relationships).

  **Step 2: Proxy Degradation under Intensification Test**
  - *Test*: Consider what happens when the metric is heavily optimized. Does the correlation between the metric and the true goal break down? Specifically, under high pressure to improve the metric, does the metric become less representative of the true goal?
  - *Clear Fail*: Evidence or strong reason to believe that optimizing the metric beyond a certain point leads to a weakening or reversal of the relationship with the true goal.
  - *Failure mode*: Proxy degradation (Type 1 in the four-way split).
  - *Nature*: Technical check.

  **Step 3: Tail Behavior Test**
  - *Test*: Examine whether the metric behaves differently at the extremes (very high or very low) compared to the middle. For instance, does a very high value of the metric still correspond to high true quality?
  - *Clear Fail*: The metric becomes uninformative or even inversely related to the true goal at extreme values.
  - *Failure mode*: Tail behavior (Type 2 in the four-way split).
  - *Nature*: Technical check.

  **Step 4: Direct Gaming Vulnerability Test**
  - *Test*: Assess how easy it is to manipulate the metric without improving the underlying quality. This includes both intentional gaming and unintentional distortion.
  - *Clear Fail*: There are known, straightforward ways to inflate the metric without any real improvement in the true goal, and these methods are feasible in the university context.
  - *Failure mode*: Direct gaming (Type 4 in the four-way split).
  - *Nature*: Technical check.

  **Step 5: Behavioral Response and Unintended Consequences Test**
  - *Test*: Consider the likely behavioral responses from faculty and departments when this metric is used for evaluation. What incentives does it create? What unintended consequences might arise?
  - *Clear Fail*: The metric is likely to incentivize behaviors that are counterproductive to the true goals, even if not strictly gaming (e.g., discouraging risky but high-reward research, or avoiding teaching difficult courses).
  - *Failure mode*: This step catches the broader set of perverse incentives that might not fit neatly into the previous four, including some that are not malicious but still harmful.
  - *Nature*: Mixed (technical and judgment). It requires understanding of human behavior and institutional context.

  **Step 6: Institutional Values Alignment Test**
  - *Test*: Does this metric align with the institution's values and mission? For example, does it promote the kind of academic community we want to be? Consider diversity of disciplines, teaching philosophies, and research approaches.
  - *Clear Fail*: The metric systematically disadvantages certain disciplines or approaches that the university values, or it incentivizes behaviors that conflict with core values (e.g., collaboration, innovation, inclusivity).
  - *Failure mode*: This is about ensuring the metric doesn't create misalignment with the institution's broader goals and culture.
  - *Nature*: Judgment (about what kind of department/university we want to be).

  ---

  **Notes:**
  - If a step is inconclusive, it requires human judgment and discussion.
  - Steps 1-4 are more technical and grounded in the literature on Goodhart's law and metric design. However, the application in a university context may require domain expertise.
  - Steps 5 and 6 are more contextual and value-laden.

  **Contested Points:**
  - The causal structure (Step 1) is often debated. Some argue that in social systems, causality is complex and bidirectional. There isn't a consensus on how to assign causality in such contexts.
  - The extent to which tail behavior (Step 3) matters may be contested. Some metrics are used primarily for identifying extremes, while others for overall assessment.
  - The literature on Goodhart's law is growing, but the four-way split is a specific framing (by Garrabrant and Manheim) that is not universally accepted as the only breakdown. However, it is a useful framework.

  ---

  **Running the Checklist on Candidate Metrics**

  **Candidate 1: Publications weighted by journal prestige (e.g., Journal Impact Factor, or JIF)**

  *Step 1: Causal Downstream*
  - Test: Is publishing in high-prestige journals a cause of high-quality research, or is it a result? High-quality research often gets published in prestigious journals, but targeting publication in such journals doesn't necessarily cause high-quality research. Moreover, there are many examples of groundbreaking research published in lower-tier journals.
  - Clear Fail? Yes: The metric is downstream of research quality (quality causes publication in good journals, but forcing publication in such journals doesn't necessarily cause quality). Also, one can game by aiming for trendy topics or incremental work that fits journal preferences, without real scientific impact.
  - Failure: Causal downstream.

  *Step 2: Proxy Degradation under Intensification*
  - Test: If we push hard for publications in high-impact journals, what happens? Researchers might focus on safe, incremental work that is more likely to be accepted by top journals, avoiding risky, innovative, or interdisciplinary work that might have higher impact but lower acceptance chances. This can degrade the relationship between the metric and true research impact.
  - Clear Fail? Yes: There is evidence that intense pressure for high-impact publications leads to a focus on quantity over quality and can increase publication bias and questionable research practices.
  - Failure: Proxy degradation.

  *Step 3: Tail Behavior*
  - Test: At the very high end (e.g., a department with many Nature/Science papers), does it always indicate exceptional research? Not necessarily, because a few high-profile papers might be outliers and not reflect the overall department quality. Also, some fields don't have high-impact journals in the same way.
  - Clear Fail? Inconclusive: While a high number of top-journal publications is generally a good sign, it might not hold for all fields (e.g., humanities, some social sciences). Also, a department with one superstar and many low performers might have a high average but not be strong overall. But the tail behavior is often still informative. We'll say it's not a clear fail, but there are concerns.

  *Step 4: Direct Gaming Vulnerability*
  - Test: Can the metric be gamed? Yes, by salami-slicing (splitting one study into multiple papers), targeting journals with high impact factors but low standards (there have been scandals), or through citation rings.
  - Clear Fail? Yes: There are known and common ways to game journal impact factors.
  - Failure: Direct gaming.

  *Step 5: Behavioral Response and Unintended Consequences*
  - Test: Likely behaviors: faculty avoiding high-risk/high-reward research, focusing on fields with higher impact factors (potentially abandoning important but less flashy areas), and neglecting teaching or service. Also, interdisciplinary work may be penalized if it doesn't fit traditional high-impact journals.
  - Clear Fail? Yes: The incentives are well-documented to create these distortions.

  *Step 6: Institutional Values Alignment*
  - Test: Does this align with our values? It may undermine collaboration (since single-authored papers in top journals are more valued) and disadvantage fields without high-impact journals (e.g., humanities). It may also encourage a narrow definition of research excellence.
  - Clear Fail? Yes: For a university that values diverse disciplines and collaborative work, this metric is problematic.

  **Verdict for Candidate 1:** Fails multiple steps (1,2,4,5,6) and inconclusive on 3. Do not adopt.

  ---

  **Candidate 2: Mean student evaluation scores (for teaching quality)**

  *Step 1: Causal Downstream*
  - Test: Are high student evaluations a cause of good teaching? Not necessarily. They are often a result of teaching quality, but also influenced by factors unrelated to learning (e.g., instructor leniency, charisma). Moreover, trying to raise evaluations might lead to lowering standards (e.g., easier grading) which harms learning.
  - Clear Fail? Yes: Improving the metric (evaluations) can be done without improving teaching (e.g., by giving higher grades or making the course easier). Thus, it is not a reliable lever for teaching quality.
  - Failure: Causal downstream.

  *Step 2: Proxy Degradation under Intensification*
  - Test: If we push hard for high evaluations, what happens? Instructors might focus on pleasing students in the short term (entertaining lectures, easy tests) rather than promoting deep learning. This can break the correlation between evaluations and actual learning outcomes.
  - Clear Fail? Yes: There is substantial research (e.g., studies showing a negative correlation between course difficulty and evaluations) that under pressure, the metric degrades.

  *Step 3: Tail Behavior*
  - Test: At the extremes: very high evaluations might be achieved by instructors who are popular but not rigorous. Very low evaluations might be due to factors beyond teaching (e.g., teaching a required course that students dislike). The tails may not reflect teaching quality.
  - Clear Fail? Yes: Extremely high scores might indicate grade inflation or popularity contests, not teaching excellence.

  *Step 4: Direct Gaming Vulnerability*
  - Test: Can evaluations be gamed? Yes, by giving higher grades, making courses easier, or even by instructors appealing for sympathy. Also, evaluations can be influenced by non-teaching factors (e.g., instructor gender, race).
  - Clear Fail? Yes: There are multiple well-documented ways to game student evaluations without improving teaching.

  *Step 5: Behavioral Response and Unintended Consequences*
  - Test: Likely behaviors: grade inflation, avoidance of challenging topics, and faculty avoiding teaching required courses (which often get lower evaluations). Also, potential biases against minority instructors.
  - Clear Fail? Yes: These consequences are well-documented and harmful.

  *Step 6: Institutional Values Alignment*
  - Test: Does this align with our values? It may lead to a focus on customer satisfaction over rigorous education. It can also exacerbate biases and disadvantage faculty who teach challenging but important material.
  - Clear Fail? Yes: If the university values academic rigor and equity, this metric is misaligned.

  **Verdict for Candidate 2:** Fails every step. Do not adopt.

  ---

  **Candidate 3: Peer classroom-observation scheme (trained peers observe classes and provide feedback, with an overall rating)**

  *Step 1: Causal Downstream*
  - Test: Is a high peer observation score a cause of good teaching? Not exactly, but it is intended to be a direct measure of teaching practices. However, one might argue that the observation score is an indicator of teaching quality (so downstream). But note: the process of peer observation and feedback can actually cause improvement (if done formatively). However, when used as a high-stakes metric, the causality might be less clear.
  - Clear Fail? Inconclusive: The metric is intended to be a direct observation of teaching, so it's not obviously downstream. But if the observation criteria are flawed, then it might not reflect true teaching quality. We'll say it's not a clear fail, but requires careful design.

  *Step 2: Proxy Degradation under Intensification*
  - Test: If we push for high observation scores, what happens? Instructors might "teach to the test" by preparing special lessons for observations that are not representative of their usual teaching. This is known as the "dog and pony show" problem.
  - Clear Fail? Potential fail: This is a known issue, but it can be mitigated by unannounced observations or multiple observations. Without such mitigations, it's a clear fail. With them, it might be acceptable.

  *Step 3: Tail Behavior*
  - Test: At the extremes: very high scores might be achieved by excellent teachers, but also by those who are good at performing for observers. Very low scores might indicate a problem, but could also occur if an observer is biased or if the instructor had a bad day. However, the tail behavior is less of a concern than in the previous metrics because the observation is direct.
  - Clear Fail? No: The metric is designed to be informative across the range, though there may be some noise.

  *Step 4: Direct Gaming Vulnerability*
  - Test: Can it be gamed? Yes, by preparing a "show" lesson for the observer. But if observations are frequent and unannounced, this becomes harder. Also, if the observers are well-trained and use a validated rubric, gaming is harder.
  - Clear Fail? Not necessarily: With proper safeguards (multiple unannounced observations, trained peers, clear rubric) it is less vulnerable than the others. However, without safeguards, it is vulnerable.

  *Step 5: Behavioral Response and Unintended Consequences*
  - Test: Likely behaviors: faculty might resent the intrusion, and it might create tension among peers. It could also lead to conformity in teaching methods (if the rubric is too prescriptive). However, if done well, it can promote sharing of best practices.
  - Clear Fail? Inconclusive: It depends on implementation. Without trust and a formative approach, it could be counterproductive.

  *Step 6: Institutional Values Alignment*
  - Test: Does this align with our values? Peer observation can foster a culture of collaboration and continuous improvement if implemented as a formative tool. However, if used punitively, it could erode trust. It also respects disciplinary differences if peers are from the same field.
  - Clear Fail? No: This can be aligned with values of collegiality and improvement if done right.

  **Verdict for Candidate 3:** 
  - Step 1: Inconclusive (requires more design details)
  - Step 2: Potential fail without mitigations (so must include mitigations in the design)
  - Step 3: Pass
  - Step 4: Pass with safeguards, fail without
  - Step 5: Inconclusive (depends on implementation)
  - Step 6: Pass (if implemented appropriately)

  Overall: This metric can be adopted if the scheme is designed with safeguards (multiple unannounced observations, trained peers, clear and flexible rubric, formative focus) and if it is part of a broader teaching evaluation system. It is the only one that passes the procedure with conditions.

  ---

  **What the Procedure Can't Settle:**
  - The procedure cannot settle the resource question: peer observations are time-consuming. It also cannot force a culture of trust and collaboration. Without that, Step 5 and Step 6 might fail in practice.
  - The procedure requires judgment in implementation details. For example, in Step 6, what exactly are the institutional values? That must be defined by the committee.
  - The procedure does not address the cost of measurement. Peer observation is expensive, while student evaluations are cheap. The committee must weigh the costs and benefits.

  **Final Note:**
  The procedure is designed to catch the most common failure modes of metrics, but it cannot guarantee success. It requires careful implementation and ongoing review. Also, no single metric should be used in isolation. The committee should use a dashboard with multiple indicators to triangulate.
answer: |-
  Below is a procedural checklist for evaluating proposed metrics, designed to operationalize Goodhart's Law using Garrabrant/Manheim's four failure modes. The checklist includes **five core tests** (with Step 4 split into two sub-tests for clarity), ordered to surface problems early. Each test specifies:  
  - **What to check**  
  - **Clear fail conditions**  
  - **Failure mode addressed**  
  - **Nature** (technical check vs. value judgment)  

  Tests are **inconclusive** when evidence is ambiguous, requiring human deliberation. I flag where academic consensus exists vs. contested views. Finally, I apply the checklist to your three candidate metrics.  

  ---

  ### **Goodhart's Law Evaluation Checklist**  
  *(For Academic Performance Indicators)*  

  #### **Step 1: Causal Direction Test**  
  - **Check**: Is the metric *causally downstream* of true quality? (i.e., does improving the metric directly cause improvement in the underlying goal, or is it merely correlated?)  
  - **Clear Fail**: Metric can be improved *without* improving true quality (e.g., boosting the number harms real outcomes).  
  - **Failure Mode**: Proxy is an *effect* of the goal, not a lever to improve it (Garrabrant's "causal downstream").  
  - **Nature**: **Technical** (relies on causal inference research).  
  - *Inconclusive if*: Causal links are bidirectional or context-dependent.  

  #### **Step 2: Intensification Robustness Test**  
  - **Check**: Does the proxy degrade when heavily optimized? (i.e., does pushing the metric break its correlation with true quality?)  
  - **Clear Fail**: Evidence that metric-target correlation weakens/reverses under high-stakes pressure.  
  - **Failure Mode**: Proxy degradation under optimization (Garrabrant's "intensification").  
  - **Nature**: **Technical** (requires empirical validation).  
  - *Inconclusive if*: Limited real-world data on optimization effects.  

  #### **Step 3: Tail Behavior Test**  
  - **Check**: Does the metric behave differently at extremes vs. the middle? (e.g., does "high score = high quality" hold for top performers?)  
  - **Clear Fail**: Metric becomes uninformative or misleading at high/low extremes (e.g., gaming inflates scores without real gains).  
  - **Failure Mode**: Proxy distribution has pathological tails (Garrabrant's "tail divergence").  
  - **Nature**: **Technical** (statistical analysis).  
  - *Inconclusive if*: Tails are sparse or unstudied.  

  #### **Step 4: Gaming Vulnerability Test**  
  - **Sub-test 4a: Direct Gaming**  
    - **Check**: Can agents game the metric *without* real improvement?  
    - **Clear Fail**: Low-cost exploits exist (e.g., manipulation requiring <20% effort of genuine improvement).  
    - **Failure Mode**: Deliberate distortion (Garrabrant's "gaming").  
    - **Nature**: **Technical** (game theory/simulation).  
  - **Sub-test 4b: Unintended Incentives**  
    - **Check**: Does the metric incentivize counterproductive behaviors?  
    - **Clear Fail**: Metric rewards harmful trade-offs (e.g., sacrificing long-term goals for short-term gains).  
    - **Failure Mode**: Emergent perverse incentives (beyond explicit gaming).  
    - **Nature**: **Mixed** (technical + values; requires scenario forecasting).  
  - *Inconclusive if*: Incentives are discipline-specific or hard to predict.  

  #### **Step 5: Values Alignment Test**  
  - **Check**: Does the metric reflect our institutional values? (e.g., equity, rigor, innovation).  
  - **Clear Fail**: Metric systematically disadvantages valued groups/practices (e.g., penalizes interdisciplinary work).  
  - **Failure Mode**: Misalignment with organizational ethics.  
  - **Nature**: **Value judgment** (no technical "correct" answer).  
  - *Inconclusive if*: Trade-offs between values exist (e.g., rigor vs. inclusivity).  

  ---

  ### **Key Notes for Your Committee**  
  1. **Consensus vs. Contested**:  
     - **Settled**: Steps 1–4a are grounded in causal inference/metric design literature (e.g., peer-reviewed studies on gaming). Strong consensus that these failures are real.  
     - **Contested**: Step 4b (unintended incentives) and Step 5 involve subjective trade-offs. Critics argue all metrics distort behavior; proponents say careful design mitigates this.  
     - **Garrabrant/Manheim Split**: Widely cited but not universally accepted; some economists argue incentives are manageable (e.g., Holmström, 1979).  

  2. **Humanist-Friendly**: Steps 4b and 5 center qualitative judgment. Use narrative scenarios (e.g., "How would a historian game this?") to engage humanists.  

  3. **Provost Pitch**: Frame this as *risk mitigation* for the university. Failing Steps 1–4a creates legal/reputational exposure (e.g., metrics disadvantaging protected groups).  

  ---

  ### **Applying the Checklist to Candidate Metrics**  
  *(Assumptions: True goals = research impact + deep student learning. Values = rigor, equity, innovation.)*  

  #### **1. Publications Weighted by Journal Prestige**  
  - **Step 1: Causal Direction**  
    - Check: High journal prestige ≠ research impact (e.g., Nobel winners often publish outside "top" journals).  
    - **Clear Fail**: Yes. Prestige can be gamed via insider networks, not quality.  
  - **Step 2: Intensification Robustness**  
    - Check: Under pressure, faculty chase "hot" topics, avoid high-risk/high-reward work.  
    - **Clear Fail**: Yes (studies show innovation drops when prestige is incentivized).  
  - **Step 3: Tail Behavior**  
    - Check: Top 1% of journals correlate with impact; mid/low tiers are noisy.  
    - **Inconclusive**: Passes for elites, fails for mid-tier. Needs human judgment.  
  - **Step 4a: Direct Gaming**  
    - Check: Exploits include: citation cartels, salami-slicing papers, targeting low-quality high-prestige journals.  
    - **Clear Fail**: Yes. Low-cost exploits well-documented.  
  - **Step 4b: Unintended Incentives**  
    - Check: Incentivizes avoiding teaching, interdisciplinary work, and public engagement.  
    - **Clear Fail**: Yes (harms university’s broader mission).  
  - **Step 5: Values Alignment**  
    - Check: Disproportionately harms humanities, early-career researchers, and non-traditional outputs.  
    - **Clear Fail**: Yes (conflicts with equity/innovation values).  
  **Verdict**: FAIL. Do not adopt.  

  #### **2. Mean Student Evaluation Scores**  
  - **Step 1: Causal Direction**  
    - Check: High scores can reflect easy grading or charisma, not learning.  
    - **Clear Fail**: Yes (meta-analyses show weak/no link to learning gains).  
  - **Step 2: Intensification Robustness**  
    - Check: Under pressure, faculty inflate grades, reduce rigor.  
    - **Clear Fail**: Yes (grade inflation rises with evaluation stakes).  
  - **Step 3: Tail Behavior**  
    - Check: Low scores often indicate real problems; high scores can mask weak teaching.  
    - **Clear Fail**: Yes (ceiling effects: scores >4.5/5 rarely predict quality).  
  - **Step 4a: Direct Gaming**  
    - Check: Exploits include: candy in class, easy exams, avoiding "difficult" topics.  
    - **Clear Fail**: Yes. Gaming requires minimal effort.  
  - **Step 4b: Unintended Incentives**  
    - Check: Incentivizes avoiding challenging courses (e.g., required math), punishing rigorous instructors.  
    - **Clear Fail**: Yes (harms academic standards).  
  - **Step 5: Values Alignment**  
    - Check: Biased against women, minorities, and non-native speakers (robust evidence).  
    - **Clear Fail**: Yes (violates equity/rigor values).  
  **Verdict**: FAIL. Do not adopt.  

  #### **3. Peer Classroom Observation Scheme**  
  - **Step 1: Causal Direction**  
    - Check: Observations *directly* assess teaching practices linked to learning (e.g., clarity, engagement).  
    - **Inconclusive**: No clear fail. Depends on rubric quality (e.g., if rubric ignores inclusivity, fails).  
  - **Step 2: Intensification Robustness**  
    - Check: Under pressure, faculty may "perform" for observers.  
    - **Inconclusive**: Mitigated via random/unannounced visits. Requires protocol design.  
  - **Step 3: Tail Behavior**  
    - Check: Effective across range if rubric captures critical behaviors (e.g., scaffolding complex ideas).  
    - **Clear Fail**: No. Tracks teaching quality linearly when well-designed.  
  - **Step 4a: Direct Gaming**  
    - Check: Hard to fake genuine pedagogy in surprise visits; requires costly effort.  
    - **Clear Fail**: No. Gaming requires near-identical effort to real improvement.  
  - **Step 4b: Unintended Incentives**  
    - Check: May encourage conformity to rubric vs. innovative teaching.  
    - **Inconclusive**: Trade-off between consistency and creativity. Values judgment needed.  
  - **Step 5: Values Alignment**  
    - Check: If rubric includes inclusivity, rigor, and discipline-specificity, aligns well.  
    - **Clear Fail**: No. Flexible rubrics can respect humanities’ discursive methods.  
  **Verdict**: PASS (with caveats). Adopt if:  
  - Rubric co-developed with humanists.  
  - Observations are random + formative (not punitive).  
  - Training addresses bias (e.g., calibrating observers).  

  ---

  ### **The Uncomfortable Truth**  
  **Peer observation passes** despite potential faculty resistance. It avoids Goodhart failures because:  
  1. It measures the *process* (teaching actions) not a proxy.  
  2. Gaming it requires genuine pedagogical improvement.  
  3. Allows humanistic judgment via qualitative notes.  

  **What the Procedure Can’t Settle**:  
  - **Resource trade-offs**: Peer review is costly. The procedure can’t resolve if it’s “worth it” (budget judgment).  
  - **Rubric design**: Values conflicts (e.g., “rigor” vs. “inclusivity”) require committee deliberation.  
  - **Trust dynamics**: Humanists’ distrust of numbers isn’t solved—only mitigated via inclusive design (Step 5).  

  ---

  ### **Implementation for Your Committee**  
  - **Timeline**: Run all 3 candidates through the checklist in a 2-hour workshop (use the summaries above).  
  - **Humanist Engagement**: Focus discussion on Steps 4b and 5. Ask: “What does this metric *discourage* we value?”  
  - **Provost Handoff**: Emphasize that Steps 1–4a are evidence-based risk screens. Failing them invites lawsuits/reputational harm.  
  - **Final Output**: A dashboard using peer observations + **non-optimizable guardrails** (e.g., tenure letters assessing research impact qualitatively).  

  This turns Goodhart’s Law from a slogan into an actionable audit—exposing flaws before they corrupt your systems.
