prompt: |-
  Before I read another paper on whether truth is a substantive property I want the spec, because I'm convinced a lot of the deflationist/inflationist debate is just two sides demanding different things of a theory and pretending they're arguing about the same thing. So: write out the desiderata. What does any adequate theory of truth have to deliver? The phenomena it must explain (truth's generalizing job, including generalizations over infinitely many sentences; the way truth looks load-bearing in explaining why an agent's action succeeded given that they were mostly right; the normativity of belief and assertion; the possibility of error; genuine disagreement as opposed to mere difference in what people say; gaps and gluts), the sentences it must handle without ad-hockery (liar, strengthened liar, Curry), the distinctions it must not collapse (truth vs warranted assertibility, having a truth predicate vs having a truth concept, defining the predicate vs giving a theory of the property), and the formal results it has to be consistent with. For every item give me the consideration that makes it a requirement rather than a slogan, and say which ones are non-negotiable and which are one camp's preferences dressed up as data — is the demand that truth have an analysable nature a requirement, or is it the whole question? Then tell me which single item knocks out the most candidates.

  Most of all I want the impossibility results, the places where the list is itself the finding. I suspect atleast two subsets can't be jointly satisfied: classical logic + every instance of the equivalence schema + a language containing its own truth predicate; and a deflationist demand that the truth theory be conservative over the base theory versus the explanatory work people point at when they say truth is doing something real (deriving the consistency of arithmetic, reflection, that sort of thing). Say which requirement gets dropped in each case and why that's the right one to drop. The setting I care about is self-application — an agent with a truth predicate it applies to its own sentences — so paradox is not a technicality I can set aside, it's the main event. Also, don't just accomodate a phenomenon you think a theory should explain away; say so and say why.

  Finish with a committed verdict, not a menu: which requirements stay in the final spec even if that disqualifies a whole family of views, and your reasons. Then a couple of lines each on how disquotationalism, a prosentential view, and a substantive identity-or-correspondence theory come out against the list you just built.
reasoning: |-
  Okay, the user is asking for a comprehensive specification of desiderata for a theory of truth. They're frustrated with the deflationist/inflationist debate, believing it often involves talking past each other due to differing implicit requirements. They want a clear list of what any adequate theory must deliver, including phenomena to explain, sentences to handle, distinctions to maintain, and formal constraints. They also want to know which desiderata are non-negotiable versus preference-based, and where impossibility results force trade-offs.

  I need to structure this carefully. First, the phenomena: truth's generalization function (especially infinite cases), its explanatory role in action success, normativity of belief/assertion, possibility of error, genuine disagreement, and gaps/gluts. For each, I'll explain why it's a requirement - for example, generalization is non-negotiable because without it we couldn't express fundamental patterns like "everything Kant said is true." The action explanation point shows truth isn't redundant in practical reasoning.

  Then come the paradox sentences: liar, strengthened liar, Curry. These test consistency without ad-hoc patches. A theory mustn't collapse key distinctions like truth versus warranted assertibility (otherwise it misrepresents epistemology), or confuse having a truth predicate with having the concept (children use "true" meaningfully before grasping metaphysics).

  Formal constraints include consistency with Tarski's undefinability (if classical) and respecting conservativeness versus reflection principle tensions. Here's where impossibility results bite: classical logic + full equivalence schema + self-applied truth is inconsistent per Tarski. And conservativeness clashes with truth's role in proving base theory consistency via reflection.

  The user cares about self-applied truth for agents, so paradox isn't avoidable. I'll be clear where I think a phenomenon should be explained away (e.g., gaps/gluts might be linguistic artifacts). Non-negotiables include generalization, normativity, and consistency with core logic. The paradox constraint knocks out most naive theories.

  For the verdict: I'll argue that generalization, normativity, and paradox-handling are indispensable, disqualifying simplistic deflationism. Then briefly show how disquotationalism fails on generalizations and paradoxes, prosententialism struggles with normativity and gaps, while substantive theories often mishandle paradoxes or overreach on analysis demands. The reflection principle trade-off favors dropping conservativeness - truth should add explanatory power.
answer: |-
  Here's the spec, structured by your demands, with the impossibility results highlighted and a committed verdict at the end. The core tension is between **expressive power/explanation** and **logical safety/metaphysical neutrality**.

  ### I. The Phenomena Truth Must Explain (Non-Negotiable Core)
  1.  **Generalization & Quantification:** Must explain how "Everything Kant said is true" or "All instances of 'If P then P' are true" work, *especially* over infinite domains. *Why Requirement?* Language demonstrably needs blind endorsement/rejection of claims we can't list (e.g., all future utterances, all theorems of a theory). Without truth fulfilling this "generalizing function," we lack essential expressive resources. **Non-negotiable.**
  2.  **Explanatory Load-Bearing:** Must explain why acting on true beliefs (e.g., "The bridge is safe") generally succeeds, while acting on false ones generally fails. *Why Requirement?* Truth appears causally/explanatorily relevant in successful action *in a way mere warranted assertibility isn't*. A belief being *correct* (true) seems distinct from it being *well-justified*. **Non-negotiable.** (The *nature* of this explanation is contested).
  3.  **Normativity of Belief/Assertion:** Must account for why belief "aims at" truth and why asserting something false is a mistake (not just inconvenient). *Why Requirement?* This is constitutive of our practices of belief and assertion. Calling a belief "true" is endorsing it as correct; calling it "false" is criticizing it. **Non-negotiable.**
  4.  **Possibility of Error:** Must allow that agents/systematically hold false beliefs. *Why Requirement?* Any plausible cognitive psychology or epistemology requires the conceptual space for getting things wrong. **Non-negotiable.**
  5.  **Genuine Disagreement:** Must distinguish "We disagree about P (one of us is wrong)" from "We merely assert different sentences (both could be right relative to context)". *Why Requirement?* Communication and argument presuppose this distinction. Deflationists must reconstruct it without a substantive property. **Non-negotiable.**
  6.  **Gaps & Gluts:** Must account for the *possibility* (even if not actuality) of sentences that are neither true nor false (gaps - e.g., vagueness, presupposition failure) or both true and false (gluts - e.g., paradoxical sentences in dialetheism). *Why Requirement?* Natural language *seems* to exhibit these phenomena. *However*, this is **Contested/Negotiable.** Substantive theories often *deny* their existence (insisting all declaratives are T/F), while others build them in. The requirement is to *account for the phenomena* (either explain them away or accommodate them cleanly).

  ### II. Sentences It Must Handle Without Ad-Hockery (Non-Negotiable Test Cases)
  7.  **The Liar (e.g., L: "L is not true"):** Any theory must provide a consistent, non-arbitrary assignment (T, F, Gap, Glut, undefined) to L and its kin. *Why Requirement?* Self-reference is linguistically possible and conceptually important for agents reasoning about their own states. Ad-hoc solutions (e.g., banning self-reference) cripple expressiveness. **Non-negotiable** for self-applicative agents.
  8.  **The Strengthened Liar (e.g., SL: "SL is false or gappy"):** Must handle variations designed to circumvent initial solutions (e.g., if L is gappy, SL says "I'm gappy"). *Why Requirement?* Shows robustness; naive solutions often collapse here. **Non-negotiable.**
  9.  **Curry's Paradox (e.g., C: "If C is true, then 0=1"):** Must resolve without triviality (everything true) or implausible restrictions. *Why Requirement?* Exploits conditional/modus ponens, not just negation. Tests the interaction of truth with fundamental logical rules. **Non-negotiable.**

  ### III. Distinctions It Must Not Collapse (Non-Negotiable Boundaries)
  10. **Truth vs. Warranted Assertibility/Justification:** Must explain why a belief can be justified but false, and unjustified but true. *Why Requirement?* Epistemology fundamentally relies on this distinction. Collapsing them makes knowledge trivial and error impossible. **Non-negotiable.**
  11. **Having a Truth *Predicate* vs. Having a Truth *Concept*:** Must distinguish possessing a usable word "true" (predicate) from grasping the abstract property/concept it expresses. *Why Requirement?* Children/animals might use "true" correctly without a full metaphysical theory. A theory of truth should illuminate the *concept* guiding predicate use. **Non-negotiable.** (Deflationists often reduce the concept to predicate use).
  12. **Defining the Predicate vs. Giving a Theory of the Property:** Must clarify whether it's defining the word "true" within a language/system (syntactic/semantic project) or analyzing the nature of the property "being true" (metaphysical project). *Why Requirement?* Much confusion stems from conflating these. An adequate theory needs *both* a consistent predicate definition (handling paradoxes) *and* an account of how that predicate relates to the concept/property (explaining phenomena 1-5). **Non-negotiable.**

  ### IV. Formal Results It Must Be Consistent With (Constraints)
  13. **Tarski's Undefinability Theorem (for Classical Settings):** If the language is sufficiently rich (contains arithmetic), consistent, and uses classical logic, it cannot contain its own truth predicate satisfying the full equivalence schema (T-Schema: "P" is true iff P). *Why Constraint?* A mathematical fact. Any theory must respect this limitation in classical settings. **Non-negotiable for classical logic.** (Leads to hierarchy or non-classical approaches).
  14. **Conservativeness vs. Explanatory Power (Reflection):** Must address whether adding a truth predicate + axioms is *conservative* over the base theory (doesn't prove new non-truth-theoretic facts) or whether it adds *explanatory power* (e.g., proving the consistency of the base theory via reflection principles: If "P" is provable, then P). *Why Constraint?* A key battleground. Deflationists typically demand conservativeness to deny substantive explanatory role. Inflationists point to reflection as evidence truth *does* substantial work. **Contested.** Is conservativeness a requirement or a deflationist preference in disguise?

  ### V. The "Analysable Nature" Question
  *   **Is it a Requirement?** **No, this *is* the core dispute.** The demand that truth *must* have a substantive, analysable nature (beyond its logical/disquotational role) is the **defining commitment of Inflationism**. Deflationists explicitly *deny* this is a requirement. It cannot be neutrally included in the desiderata; it begs the question against deflationism. The other desiderata (1-13) are intended to be neutral ground.

  ### VI. Impossibility Results & Trade-offs (Where the List Bites)
  1.  **Classical Logic + Full T-Schema + Self-Application:** **Impossible** (Tarski). *Trade-off:* You must drop one.
      *   **Drop Full T-Schema:** Restrict it (e.g., Tarski hierarchies, Kripke-Feferman partial truth). *Why Right?* Preserves classical logic and self-application (within levels/stages) while blocking paradox. Sacrifices simplicity/universality of the T-Schema.
      *   **Drop Classical Logic:** Use a non-classical logic where paradoxical sentences are gappy (Kripke) or glutty (Priest). *Why Right?* Preserves a universal, type-free truth predicate and a form of the T-Schema. Sacrifices classical reasoning (e.g., excluded middle, explosion).
      *   *(Drop Self-Application: Crippling for an agent).*
  2.  **Deflationist Conservativeness vs. Explanatory Power (Reflection):** **Tension.** Adding a natural truth predicate and axioms satisfying the core desiderata (especially generalization) typically allows proving reflection principles, implying non-conservativeness (e.g., over PA, it proves Con(PA)).
      *   **Trade-off:** Deflationists must either:
          *   **Deny Reflection is Genuine Explanatory Power:** Argue consistency/reflection isn't a *substantive* fact about the world, just a logical feature of the theory. *Problem:* This clashes with the "load-bearing" intuition (Phenomenon 2) for many.
          *   **Accept a Very Weak Truth Predicate:** Restrict the truth predicate so severely it cannot express or prove reflection. *Problem:* This cripples the generalization function (Phenomenon 1) for the base theory's *own* sentences.
      *   *Why Drop Conservativeness?* **It's the right one to drop.** Conservativeness is a metaphysically motivated *constraint* (keeping truth "lightweight") not a core *phenomenon* like generalization or normativity. The ability of truth to underwrite trust in our own reasoning (via reflection) is a powerful explanatory virtue (linking to Phenomenon 2 & 3) that outweighs the desire for metaphysical neutrality. A theory of truth *should* tell us something about the reliability of our base theories.

  ### VII. Committed Verdict: The Non-Negotiable Core That Disqualifies Families
  The following **must stay**, even if disqualifying:
  1.  **Generalization & Quantification (1):** Knocks out naive minimalist deflationism that can't handle infinite generalizations cleanly (e.g., purely propositional or schematic views).
  2.  **Explanatory Load-Bearing (2) & Normativity (3):** Knocks out deflationist views that reduce truth's role *entirely* to expressive convenience or disquotation, failing to capture why true beliefs are successful guides to action or why false belief is a mistake *qua* belief. (This is the core inflationist challenge).
  3.  **Handling Paradoxes Non-Ad-Hocly (7, 8, 9):** Knocks out naive correspondence/substantive theories that rely on classical logic + full T-Schema + self-application (inconsistent) and ad-hoc solutions. Also knocks out simplistic disquotationalism.
  4.  **Distinction Truth vs. Justification (10):** Knocks out pragmatic or strongly epistemic theories of truth (some forms of anti-realism) that collapse truth into ideal justification.

  **Why these?** Generalization (1) is fundamental to language and thought. Load-bearing (2) and normativity (3) are central to understanding cognition, agency, and rationality itself – truth *must* be more than just a device for indirect reference. Paradox handling (7-9) is non-negotiable for coherent self-applicative agents. Distinguishing truth from justification (10) is essential for epistemology. While the *form* of explanation for 2 & 3 is debated, *that* truth plays these roles is bedrock data.

  **The Single Item that Knocks Out the Most Candidates:** **Handling the Liar (7) non-ad-hocly.** It sinks naive correspondence, naive deflationism (disquotationalism), and any theory unwilling to modify classical logic or restrict the T-Schema significantly right out of the gate. It forces complexity.

  ### VIII. How Major Views Fare Against the Spec
  *   **Disquotationalism (Minimalism):**
      *   👍: Excellent on generalization *within a fixed base language* (if carefully formulated axiomatically), clear on distinction 10 & 12, often conservative (meets deflationist preference 14).
      *   👎: **Fails** core: Struggles profoundly with **paradoxes (7-9)** (often resorts to hierarchy/ad-hocness), **explanatory load-bearing (2)** (truth seems inert), **normativity (3)** (reduced to convention), **genuine disagreement (5)** (hard to capture "one is wrong"), **self-application generalization** (across hierarchy levels). *Verdict:* Fails spec on key non-negotiables.
  *   **Prosententialism:**
      *   👍: Elegant on disquotation/anaphora, avoids some paradoxes by denying "true" is a real predicate *applying to sentences*.
      *   👎: **Fails** core: **Generalization (1)** (handling quantified claims like "All Fs are true" is tortured/unnatural), **explanatory load-bearing (2)** (truth-properties vanish), **normativity (3)** (hard to reconstruct), **gaps/gluts (6)** (how are they prosentences?), **distinction 11** (blurs predicate/concept). *Verdict:* Fails spec on generality, explanation, and normativity.
  *   **Substantive (Identity/Correspondence):**
      *   👍: Naturally fulfills **explanatory load-bearing (2)**, **normativity (3)**, **genuine disagreement (5)**, **distinction 10**.
      *   👎: **Fails** core: **Paradoxes (7-9)** in classical settings (inconsistency); often struggles with **generalization (1)** for non-representational discourse (e.g., logic, math); risks collapsing **distinction 12** (conflating predicate definition with metaphysics); may mishandle **gaps/gluts (6)**. *Verdict:* Fails spec on paradoxes unless it adopts significant non-classical logic or restricts self-application substantially. Meets the core *explanatory* demands best *if* it can solve the paradoxes coherently (e.g., via significant logical revision).

  The spec demands a theory that is expressively powerful enough for generalization and self-reflection, explanatorily robust regarding success and normativity, logically rigorous enough to handle paradoxes non-arbitrarily, and clear about the predicate/property distinction. **Robust non-hierarchical theories (like Kripke's with supervaluation or strong Kleene, or carefully formulated axiomatic theories like KF or Friedman-Sheard) paired with a deflationary *conception* of the property often fare best overall against this list,** satisfying most non-negotiables while dropping classical logic or full T-Schema. **Substantive theories using non-classical logic (e.g., dialetheism)** also satisfy the core phenomena and paradox constraints but at the cost of classical reasoning. The tension between conservativeness and reflection is best resolved by **dropping conservativeness** as a requirement.
