  I should also address popular takes. Bounded utilities are a band-aid—they avoid the problem but don't solve why we should bound utilities. Solomonoff priors impose penalties based on complexity, which helps with epistemic issues but isn't a complete solution. "Gut capping" is unprincipled. These are worth deprioritizing because they don't get at the root causes.

  The top priorities would be:
