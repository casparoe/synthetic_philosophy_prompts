  Common positions in population ethics and procreative ethics:

  1. **The Non-Identity Problem**: Because the child born now (A) is different from the child born later (B), and both have lives worth living, it seems that neither child is harmed by the choice that leads to their existence. Therefore, the decision does not harm the child that is born. However, we might still think we should wait because Child B will have a better life. But why?

  2. **The Average View**: We should maximize the average welfare of the people who exist. Since we are going to have one child, we should have the child with the highest welfare (Child B).

  3. **The Total View**: If we are having only one child, then total welfare is the same as the child's welfare. So we should choose Child B.

  4. **The Person-Affecting View**: We should only consider how our actions affect people. Since no existing person is made worse off (because the alternative for Child A is non-existence, which is not worse, and similarly for Child B), then the decision is morally neutral. But that seems counterintuitive.

  5. **The Harm-Based View**: Some argue that we can harm a child by bringing it into existence with a condition that makes its life worse than it could have been, even if the alternative is non-existence. This is controversial.

  6. **The Impersonal View**: We should bring about the best state of affairs, regardless of who exists. So we should bring Child B into existence because the world is better with a healthier child.

