  We are building a decision tree for moral positions on the decision to conceive now or wait six months. The starting point is that the child born now (Child A) is a different individual from the child born later (Child B). We will branch on the following questions:

  1. Can the decision harm the child who results from it? (Harm Question)
     - If we conceive now and have Child A with the condition, has Child A been harmed by being conceived now rather than not existing? Similarly, if we wait and have Child B, has Child B been harmed by not being conceived earlier? This question addresses whether we can assign harm to an individual by bringing them into existence in a state that is worse than non-existence or worse than an alternative existence.

  2. Is the rightness of the decision a matter of the aggregate or average welfare of the lives that will be lived? (Aggregation Question)
     - This asks whether we should consider the total (or average) welfare of the children that will exist. For example, if we have Child A, we have a life that is worth living but with a serious condition that is treatable (so still a net positive, but less than Child B's). If we have Child B, we have a life that is healthier. But note: we are only having one child. The choice is between having Child A now and Child B later.

  3. What is the parents' duty: to the particular child they will have or to the class of possible children? (Duty Question)
     - Do the parents have a duty to the specific child they end up having, such that they must act in that child's best interest? Or is their duty to the set of possible children they might have, so that they should choose the best possible child?

  4. Is there any sense in which the later, healthier child (Child B) is owed her existence? (Owed Existence Question)
     - This question asks whether by waiting and having Child B, we are fulfilling some kind of moral obligation to bring Child B into existence, because Child B would have a better life.

  5. Is the decision morally significant at all if no one is made worse off? (Non-Worseness Question)
     - If we choose to have Child A now, then Child B never exists. So Child B is not worse off because she never exists. Similarly, if we wait, Child A never exists and so isn't worse off. Therefore, if no one is made worse off, is there any moral difference?

