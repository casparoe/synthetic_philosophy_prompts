  Below is a decision tree mapping moral positions on whether to conceive now (risking a child with a treatable condition) or wait six months (likely having a healthy child). The tree starts from the **non-identity problem** (Child A born now ≠ Child B born later) and branches on five key questions. Each leaf names a position (or "unnamed") and notes its most awkward commitment. The tree yields **six distinct positions** and flags one unoccupied combination.

  ### Decision Tree: Moral Positions on Procreative Timing
  **Starting Point:**  
  Child A (conceived now, likely with a treatable condition) and Child B (conceived later, likely healthy) are different individuals. Both would have lives worth living.

  ---

  1. **Can the decision harm the child who results from it?**  
     - **Yes** → Proceed to 2.  
     - **No** → Skip to 3.  

  2. **Is the rightness of the decision a matter of aggregate/average welfare?**  
     - **Yes** → **Position: Harm-Minimizing Utilitarianism**  
       - *Action:* Wait (avoids harming Child A + maximizes welfare).  
       - *Awkward commitment:* Claims Child A is harmed by existing (even if their life is net-positive), implying non-existence would be better for them.  
     - **No** → **Position: Harm-Centric Deontology**  
       - *Action:* Wait (avoids harming Child A).  
       - *Awkward commitment:* Treats conception as a direct harm to Child A, ignoring that Child A’s existence depends on this choice.  

  3. **Is the rightness of the decision a matter of aggregate/average welfare?**  
     - **Yes** → **Position: Impersonal Aggregativism**  
       - *Action:* Wait (Child B’s higher welfare creates a better outcome).  
       - *Awkward commitment:* Ranks children like commodities (e.g., “trading” Child A for a “better” Child B).  
     - **No** → Proceed to 4.  

  4. **What is the parents' duty: to the particular child or the class of possible children?**  
     - **Class of possible children** → **Position: Procreative Beneficence**  
       - *Action:* Wait (duty to select the best possible child: Child B).  
       - *Awkward commitment:* Implies “imperfect” children (e.g., Child A) are less worthy of existence.  
     - **Particular child** → Proceed to 5.  

  5. **Is the decision morally significant if no one is made worse off?**  
     - **No** → **Position: Non-Identity Neutralism**  
       - *Action:* Either choice (neither child is worse off, as non-existence isn’t bad).  
       - *Awkward commitment:* Indifferent to Child A’s avoidable suffering since Child B isn’t “deprived.”  
     - **Yes** → Proceed to 6.  

  6. **Is the later, healthier child (Child B) owed her existence?**  
     - **Yes** → **Position: Existential Debt Theory**  
       - *Action:* Wait (Child B is “owed” existence for being the best possible outcome).  
       - *Awkward commitment:* Assigns moral weight to non-existent beings (Child B “deserves” to exist).  
     - **No** → **Position: Parental Autonomy Primacy**  
       - *Action:* Either choice (no child-centered duty; parents decide based on preference).  
       - *Awkward commitment:* Permits conceiving now despite avoidable suffering, purely on parental whim.  

  ---

  ### Key Notes on the Tree
  1. **Indistinguishable Leaves** (same conclusion, different reasoning):  
     - **Harm-Minimizing Utilitarianism** and **Impersonal Aggregativism** both advocate waiting but diverge on *why*:  
       - *Harm-Utilitarianism* emphasizes avoiding harm to Child A.  
       - *Aggregativism* focuses on maximizing welfare impersonally (no harm claimed).  
     - **Procreative Beneficence** and **Existential Debt Theory** both advocate waiting but differ in duty:  
       - *Beneficence* is duty to possible children.  
       - *Debt Theory* is duty to “owe” existence to Child B.  

  2. **Unoccupied Combination**:  
     - **Branch**: *No harm → No aggregation → Duty to particular child → Moral significance → Child B not owed existence*.  
     - **Why unoccupied?** This path rejects harm, aggregation, class duty, *and* owed existence, yet claims moral significance. It implies a child-centered reason to act but offers no coherent principle (e.g., no duty to prevent suffering). No major ethical framework occupies this space—it collapses into arbitrariness.  

  ### Summary of Positions
  | **Position**                  | **Action** | **Core Reasoning**                                        | **Awkward Commitment**                                  |  
  |-------------------------------|------------|----------------------------------------------------------|--------------------------------------------------------|  
  | Harm-Centric Deontology       | Wait       | Avoids harming Child A.                                  | Conception itself harms Child A.                       |  
  | Harm-Minimizing Utilitarianism| Wait       | Avoids harm + maximizes welfare.                         | Child A’s existence is a net harm.                     |  
  | Impersonal Aggregativism      | Wait       | Child B’s life has higher welfare.                       | Ranks children by quality.                             |  
  | Procreative Beneficence       | Wait       | Duty to have the best possible child (Child B).          | Implies Child A is inferior.                           |  
  | Existential Debt Theory       | Wait       | Child B is “owed” existence.                             | Duties to non-existent beings.                         |  
  | Non-Identity Neutralism       | Either     | No one is worse off; non-existence isn’t bad.            | Indifference to avoidable suffering.                   |  
  | Parental Autonomy Primacy     | Either     | Child-centered duties don’t apply; parents choose freely.| Allows suffering based on preference.                  |  

  ### How to Use in Your Novel
  - **Distinguish characters by reasoning, not labels:** A utilitarian might advocate waiting to maximize welfare (*Aggregativism*), while a deontologist might wait to avoid harm (*Harm-Centric Deontology*). Both wait but clash philosophically.  
  - **Explore tensions:** A character rejecting all child-centered duties (*Parental Autonomy*) could conflict with one who feels obligation to possible children (*Procreative Beneficence*).  
  - **Highlight awkward commitments:** A character endorsing *Existential Debt Theory* might struggle to explain why a non-existent Child B “deserves” life.  

  This tree isolates how characters resolve the non-identity problem, emphasizing their moral logic rather than generic principles. Use the "awkward commitments" to create internal conflicts or debates.
