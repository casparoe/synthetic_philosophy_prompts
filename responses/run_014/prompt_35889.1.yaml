  Looking at the sub-questions. First, the coherence of the concept. If the concept isn't coherent, then the whole debate might be moot. I lean towards it being coherent enough (70%) because scholars do apply it retrospectively, even if contested. But the user's friend's point about rigged definitions is valid here—maybe the modern definition forces a modern answer. That's a key sensitivity point.

