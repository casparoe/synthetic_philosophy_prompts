  Then, the causal story surviving. Even if there's a counterexample, industrialization, print capitalism, etc., might still explain why nationalism became widespread then. So high probability (85%) here. The core argument isn't necessarily destroyed by outliers.

  Combining these: Coherence (70%) and counterexample (30%) suggest a low chance of premodern nations. But the causal story's robustness (85%) means the thesis holds regardless. Final probability around 25% that nothing pre-1700s counts.

  Sensitivity is highest on the counterexample question. If evidence emerged of widespread vernacular education or mass media in a premodern society, that could shift things. For instance, if documents showed Dutch citizens broadly identified as "Dutch" due to print media, not just local or religious ties, that'd be strong evidence.

  On the rigged definition: yes, defining nation with "imagined community" and mass participation inherently favors modernity. Premodern groups might have had shared identity but not in the same way. So the definition isn't neutral; it's designed to fit the modern thesis. The user's friend has a point.

