prompt: |-
  hey so im in this advanced decision theory seminar (one of those summer programs for seniors) and we just got to this thing called Good's theorem about the value of information and i keep going back and forth on whether i actually understand it, and i want to compare it to this other idea i keep running into where people say information can be a bad thing, like an actual liability, and i cant tell if those two are just contradicting each other or if there's a way to square them.

  the version of Good's theorem i think i get is basically that for a rational person maximizing expected utility, the expected value of getting more information before you decide is never negative, and the whole argument is like, after you receive the information you're still free to pick the best action for whatever you learn, so you could always just do the same thing you would've done with no info no matter what you find out, which means having the info can't lower your expected payoff. but then there's this totally opposite intuition that sometimes knowing is worse than not knowing, like people deliberately avoid learning a medical result or a test score and it kind of looks like a smart move to them. so can you compare these two ideas for me — where do they actually disagree, is the "information is a liability" thing just a mistake (some ex post vs ex ante confusion), or are there real setups where Good's theorem's assumption breaks and information genuinely has negative value? i'm especially stuck on the part where the proof says you can always choose to ignore the information, because in real life you kinda cant just un-know something, so i feel like thats where the whole argument is weaker than it looks.
