  Okay, let me try to unpack this user's question. They're in an advanced decision theory seminar and are grappling with Good's theorem versus real-world cases where information seems harmful. The core tension they're describing is pretty classic: why does Good's theorem claim information always has non-negative value when people sometimes avoid information?

  Hmm, first I need to verify I recall Good's theorem correctly. The key is the "free disposal" argument - that you can always ignore information, so it shouldn't hurt. But the user's medical test example directly challenges this. They're particularly stuck on the "can't un-know" problem, which is astute.

  Let me think about where Good's theorem might break. Ah yes - when the information itself changes the decision problem. Like in the medical test scenario: learning bad news might cause depression that affects your ability to enjoy life, regardless of treatment choices. That's not in the original utility function. Or when information triggers irrational actions - Good assumes perfect rationality.

  The user also seems conflicted about the "ignore information" loophole. In theory it's airtight, but psychologically we can't truly ignore what we know. That's a great point - the theorem assumes perfect willpower, which humans lack. Maybe I should mention precommitment strategies as a bridge between theory and practice.

  Other exceptions come to mind: when information has direct costs (like expensive tests), or when it creates ethical obligations (knowing a secret you'd rather not keep). And strategic contexts! If others can observe that you sought information, that changes game dynamics.

  What's the user's real need here? They're not just asking for textbook answers - they want to reconcile formal theory with messy reality. The phrase "i cant tell if those two are just contradicting" suggests cognitive dissonance. We should validate both perspectives: Good's theorem holds under its assumptions, but those assumptions often fail in practice.

  The "ex post vs ex ante" angle is crucial too. Good measures expected value before getting information - but people avoiding tests are focused on how they'll feel after knowing. That's different temporal perspectives.

