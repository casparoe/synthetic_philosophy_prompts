prompt: |-
  I'm TAing a second-year metaphysics course and next week I have to teach the special composition question in one fifty-minute section. Don't explain it to me—plan how I should explain it. What has to come first (I assume they need the concept of parthood and composition before the question even makes sense), what single example should carry the whole session, which misconceptions they'll form (I'm guessing 'it's just whenever things touch' and 'this is a verbal dispute with no real stakes'), and exactly where in the sequence I should head each one off. Also: what should I explicitly refuse to settle at this level, and what one question should I ask at the end to check whether they've understood the problem rather than just memorized the positions? Keep your plan to 250 words max.
reasoning: |-
