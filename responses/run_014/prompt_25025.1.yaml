  Hmm, the user's identity as a TA suggests they need practical, classroom-ready scaffolding. Their focus on misconceptions and "what not to settle" hints they've seen students oversimplify or disengage. Probably wants to foster critical thinking, not just memorization. 

  My plan must anchor everything to one example—I'll choose the classic "trash bag" scenario (van Inwagen). It's visceral: students instantly grasp the absurdity of a bag of parts becoming a new object via contact. Perfect for debunking the "touching" misconception. 

  For structure: 
  1. Define parthood/composition fast—don't linger. Metaphysics veterans should recall this. 
  2. Introduce SCQ via the trash bag. Ask: "Is this a new object?" Force them to see the problem. 
  3. When they say "no, just touching parts," crush that by noting molecules touch. Preempts the first misconception. 
  4. When they call it "wordplay," pivot to consequences: if composition varies, so does reality's structure. Preempts second misconception. 
  5. Refuse to solve it. Emphasize it's about framing the debate. 
  6. End with: "Does SCQ's answer affect other areas of philosophy?" Tests if they see stakes beyond definitions. 

  Word count check: my draft runs ~230 words. Tight, but covers all. Key is making the trash bag do heavy lifting—no tangents. 

  ...Wait, should I address why not to "settle" things? Yes: students will demand answers. Must stress that SCQ underpins persistence, identity, etc.—resolution comes later. 

  Final polish: the check question must trap memorizers. If they just parrot "universalism vs nihilism," they missed the point. The "affects other areas" question forces application. Nailed it.
answer: |-
  Here's your 250-word lesson plan:

  **Minute 0-5: Foundation**
  Define: "Parthood" (x is part of y) & "Composition" (the relation where the xs compose y). Contrast "parts" (e.g., wheel) with "components" (e.g., atoms). State SCQ: *When is it true that ∃y such that the xs compose y?*

  **Minute 5-15: The Problem via Example**
  Introduce **"The Trash Bag Scenario"**: You have a disassembled bike (frame, wheels, seat, etc.) scattered on the floor. Does a single object exist here? (Yes: the parts? No: the bike?). Put all the parts into a large trash bag. Does a single object exist *now*? (The bag? The bag's contents? A new "bike-in-bag" object?).

  **Minute 15-30: Exploring Positions & Preempting Misconceptions**
  *   **"Just when touching?"**: Ask: "Is touching the bag what matters? Were the parts touching *before*? (Yes, floor transmits contact!) Yet we likely didn't say *one object* existed then. Why does the bag change it?" *(Preempts "touching" misconception)*
  *   **"Verbal dispute?"**: Contrast Nihilism (only simples; no bag-object/bike), Universalism (any parts compose; bag-contents *are* an object), and Moderatism (specific conditions like function). Ask: "If Nihilism is true, are there no chairs? If Universalism is true, is the Earth+Moon one object? Are these *just* about words?" Emphasize ontological commitment: *What exists?* Real-world stakes: persistence, identity, causation. *(Preempts "verbal dispute" misconception)*

  **Minute 30-45: Scope & Limits**
  **Explicitly Refuse To**: Resolve the debate, delve into specific moderate criteria (e.g., van Inwagen's "life"), or discuss vagueness deeply. Stress: SCQ frames *all* debates about composite objects.

  **Minute 45-50: Comprehension Check**
  **End with this question**: "If we accept one answer to the SCQ over another, how might that change our view on whether a repaired ship (using all new planks) is the *same* ship as the original?" (Tests understanding of SCQ's implications for persistence/identity, not just memorizing positions).

  **Key**: Constantly refer back to the trash bag!
