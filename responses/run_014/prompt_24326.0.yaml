prompt: |-
  I'm a quantitative risk analyst at a mid-size firm, and I maintain a standing set of probability forecasts — the chance that a given project will be delayed, that a supplier will default, that a regulatory change will take effect by a set date — and I know in advance exactly which scheduled pieces of evidence will arrive and when: a monthly loss report, the result of a quarterly stress test, the next earnings release, a court ruling on a known docket date. Before each of those scheduled evidence events I want to check that my current forecasts are coherent with what I expect to believe once the evidence lands, using the diachronic constraint on credences that van Fraassen calls the reflection principle.

  Please turn that principle into a decision procedure my team can actually run in the thirty minutes before a weekly forecast review: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and flags a reflection violation rather than spitting out a number, and where it hands the decision to a person because the question is one of judgment rather than arithmetic. It has to say explicitly what to do when I can't get a precise number for one of the future credences, and it has to be honest about which steps are judgment calls dressed up as procedure and which are genuine checks. Any forecast the procedure changes has to be signed off by the head of the risk team, so mark clearly which outputs are automatic and which require that sign-off.

  Then run the procedure on two concrete forecasts. First, my current 30% forecast that a project will be delayed, where I am certain that if the scheduled stress test comes back clean I will move to 10% and if it comes back dirty I will move to 60%, and where I currently put a 70% chance on the clean outcome — show the full arithmetic and the decision. Second, a forecast about a project I personally champion, where I have a strong incentive to keep the success probability high and where the scheduled evidence is ambiguous enough that I am not actually sure what I will believe after seeing it — I want this one to end in an answer I will not like, and I want the procedure to show me exactly why it is entitled to that answer.

  Finally, say plainly what this procedure cannot do: the cases where reflection is silent, where its preconditions fail, or where following it would be a mistake.

  Respond in the style of an expert in Bayesian epistemology who also has to be useful to a practitioner, not a philosophy seminar. Think very carefully before answering; the value of this is in the translation — keeping what the principle actually says while making it runnable by someone who has never read it.
reasoning: |-
  We are implementing the Reflection Principle as a decision procedure.
   The Reflection Principle requires that your current credence in an event A, P(A), 
   should equal your expectation of your future credence in A after seeing evidence E.

   Formally: P(A) = Sum_{over possible future credences} [ P(you will assign P'(A) = x) * x ]

   But note: The future credence P'(A) is conditional on the evidence E that you will see.
   Since we know what evidence will arrive and when, we can structure the problem.

   Steps:

   1. Identify the event A for which we have a current forecast (credence) P(A).
   2. Identify the scheduled evidence E that will arrive. We know that after seeing E, we will update to P'(A).
   3. We must assess our current probabilities for the possible outcomes of E. That is, we need to know the possible values of P'(A) and our current credences over those values.

   However, note: the evidence E might not directly tell us about A, but it will cause us to update our belief about A.

   The procedure:

   Step 1: For the event A and the upcoming evidence E, list the possible future credences you might have in A after seeing E. 
            Let these be x1, x2, ..., xn.

   Step 2: For each possible future credence xi, assess your current probability that you will have that future credence. 
            That is, what is P( P'(A) = xi )?

            Note: This is equivalent to your current probability for the evidence that would lead to that update. 
            Because if you are certain that upon seeing evidence E_i you will update to xi, then P( P'(A)=xi ) = P(E_i).

   Step 3: Check if the current forecast P(A) satisfies:
            P(A) = Σ [ P( P'(A)=xi ) * xi ]

   Step 4: If the equality holds (within a tolerance, say 0.01 or 1%), then the forecast is coherent and no change is needed.

   Step 5: If not, then we have a violation of reflection. The procedure flags the violation and we must adjust.

          However, note: the reflection principle is a norm of coherence. If violated, we must adjust either the current forecast or our expectations of future credences.

          The procedure will then ask: which part are we more willing to adjust?

          We have two options:
            Option A: Adjust the current P(A) to the value of the expectation: P(A) <- Σ [ P( P'(A)=xi ) * xi ]
            Option B: Revisit the assessments of the future credences (the xi) and/or the probabilities of those updates (P(P'(A)=xi)).

          Since the head of risk must sign off on any forecast change, if we choose Option A then we set the new forecast to the expectation and flag it for sign-off.

          If we choose Option B, then we go back to Step 1 or Step 2 and reassess. But note: we might not have time in 30 minutes. Therefore, the procedure must have a default.

          Default: In the interest of time, if a violation is found and the difference is significant (say, absolute difference > 5 percentage points), then we adjust the current forecast to the expectation and flag for sign-off. 
                   However, if we are in the middle of the procedure and we can quickly reassess (and we are not sure about our initial assessments of the future), we can do a quick reassessment. But the procedure must be time-boxed.

          Therefore, we design:

            - First pass: run Steps 1-3 and check.
            - If violation, then we ask: "Is there an obvious error in the future credences or their probabilities? If yes, correct and re-run. Otherwise, adjust current forecast to the expectation and flag for sign-off."

          But note: the reassessment might be time-consuming. Therefore, we allow only one round of reassessment. If after reassessment we still have a violation, we adjust the current forecast and flag for sign-off.

   Step 6: What if we cannot get a precise number for one of the future credences?

          We require that the future credences and their probabilities are assessed. The procedure cannot run without them.

          However, sometimes we might not be able to assign a precise probability to a future update. Then we must use an interval or a range. But that complicates the calculation.

          Alternative: We require that the risk analyst provides a best estimate and a range. Then we can do a sensitivity analysis. But that might be too heavy for 30 minutes.

          Therefore, we say: the procedure requires point estimates. If the analyst cannot provide a point estimate for a future credence, then they must provide a range and use the mid-point (or the expected value of the range if they can assess it). If they cannot even do that, then they must flag the event as "not ready for reflection check" and skip it. But note: skipping might be dangerous. So we prefer that an estimate is made.

          However, if the future credence is too vague, then we might have to break down the evidence into more precise scenarios.

   Step 7: Judgment vs. arithmetic:

          - Steps 1 and 2 are judgment calls: listing the possible future credences and assigning probabilities to them. 
          - Step 3 is arithmetic: computing the expectation and comparing to the current forecast.

          Therefore, we are honest: the inputs are judgment calls. The procedure only checks the coherence of the judgments with the current forecast.

          The output of the procedure is either:
            - "Coherent" (no action)
            - "Violation: adjust current forecast to X (requires sign-off)" 
            - Or, after reassessment, we might change the future assessments and then either become coherent or still have a violation.

   Now, let's run two examples.

   Example 1:
     Current forecast: P(delay) = 30% = 0.3
     Scheduled evidence: stress test (clean or dirty)
     Future credences:
        If clean: P'(delay) = 0.1 (with current probability 0.7)
        If dirty: P'(delay) = 0.6 (with current probability 0.3)

     Step 3: Compute expectation: 
          E[P'(delay)] = (0.7 * 0.1) + (0.3 * 0.6) = 0.07 + 0.18 = 0.25

     Compare: current P(delay)=0.3 vs. 0.25 -> absolute difference of 0.05 (5 percentage points).

     We set a tolerance of 1% (0.01). So 0.05 > 0.01 -> violation.

     Step 5: We ask: is there an obvious error in the future assessments?
          The analyst might say: "No, I stand by my future updates and their probabilities."

          Then we adjust the current forecast to 25% and flag for sign-off.

     Therefore, the new forecast for the delay probability becomes 25%.

   Example 2:
     Event A: project success (so we are forecasting the probability of success, but note: the reflection principle applies similarly).
     Current forecast: P(success) = 90% (because I champion the project and want it to be high).
     Scheduled evidence: a court ruling. The evidence is ambiguous and I am not sure what I will believe after seeing it.

     We break down the evidence: the court ruling could be favorable, unfavorable, or ambiguous. But note: the evidence is ambiguous enough that I don't know how I will update.

     However, the procedure requires that we list the possible future credences and their probabilities.

     The analyst might be tempted to say: 
          - If favorable: I'll update to 95%
          - If unfavorable: I'll update to 50%
          - If ambiguous: I might stay at 90%? But note: the ambiguity might lead me to lower my confidence? 

     But the analyst is uncertain about what update they will do in the ambiguous case. They might update to a range, say 70% to 90%. But we need a point.

     The procedure requires: we must make a judgment. We break down the evidence into scenarios and assign:

          Scenario 1: Favorable ruling -> P'(success) = 0.95, and I currently assign P(scenario1)=0.4
          Scenario 2: Unfavorable ruling -> P'(success)=0.5, P(scenario2)=0.3
          Scenario 3: Ambiguous ruling -> but what will I believe? The analyst might say: "I don't know, but I think I might lower it a bit, say to 80%." 
                      And they assign P(scenario3)=0.3

          Then the expectation: 
              E[P'(success)] = (0.4*0.95) + (0.3*0.5) + (0.3*0.8) = 0.38 + 0.15 + 0.24 = 0.77

          Current forecast: 0.9 vs. 0.77 -> violation (difference 0.13).

          The procedure then asks: is there an error in the assessments? The analyst might be biased and not want to lower the forecast.

          But note: the procedure requires that we adjust the current forecast to 77% and get sign-off, unless we can reassess and find an error.

          However, the analyst might object: "In the ambiguous scenario, I might not update to 80% but stay at 90%." 

          Then we reassess: change scenario3 to 90%. Then:
              E[P'(success)] = 0.4*0.95 + 0.3*0.5 + 0.3*0.9 = 0.38 + 0.15 + 0.27 = 0.80

          Then current 0.9 vs. 0.80 -> still violation (0.1 difference). 

          Alternatively, maybe the probabilities of the scenarios are off? The analyst might feel that the probability of an unfavorable ruling is too high. They might adjust the scenario probabilities:

              P(scenario1)=0.5, P(scenario2)=0.2, P(scenario3)=0.3

              If we keep the original future credences (95%, 50%, 80%):
                  E = 0.5*0.95 + 0.2*0.5 + 0.3*0.8 = 0.475 + 0.1 + 0.24 = 0.815

          Still 0.9 vs 0.815 -> violation.

          After one round of reassessment, we still have a violation. Then we adjust to 81.5% and flag for sign-off.

          The procedure forces a reduction in the current forecast because the analyst's own expectations of future updates are lower on average.

          The key point: the procedure is entitled to this answer because the analyst's own judgment about how they will update in the future implies that the current forecast is too high.

   What the procedure cannot do:

    1. It cannot handle cases where the evidence might change the event in question (for example, if the event is about a project and the evidence might cause the project to be cancelled, thus making the event undefined). 
       The reflection principle assumes that the event A is well-defined and does not change due to the evidence.

    2. It assumes that the analyst is certain about how they will update upon seeing the evidence. If the analyst is uncertain about their own updating procedure (for example, they might learn something that changes their mind about how to interpret the evidence), then the simple reflection principle does not apply.

    3. It does not account for situations where the evidence might not arrive (for example, the court ruling might be postponed). In our setup, we assumed the evidence arrives as scheduled. If there's a chance the evidence doesn't arrive, then we must model that as an additional scenario.

    4. It is a constraint on a single update. It does not handle sequences of updates beyond the next piece of evidence.

    5. It might be a mistake to follow reflection if the analyst expects to undergo a change that is not driven solely by the evidence (e.g., if they expect to be brainwashed, or if they are aware they will be irrational in the future). The principle assumes rationality in the future self.

    6. It does not tell you how to update when the evidence comes in; it only constrains your current beliefs in light of your anticipated update.

    7. It cannot be used if the future credences are not well-defined or if the analyst cannot form a probability distribution over them.

   Summary of the procedure:

    Step 1: Identify the event A and the next scheduled evidence E.
    Step 2: List the possible future credences for A after seeing E: x1, x2, ..., xn.
    Step 3: For each xi, assign a current probability p_i = P( P'(A)=xi ). (This is a judgment.)
    Step 4: Compute the expected future credence: E = Σ (p_i * x_i).
    Step 5: Compare E to the current P(A). If |P(A) - E| < tolerance (e.g., 0.01), then mark as coherent and move on.
            Else, flag a violation.

    Step 6: In case of violation:
            - Ask: "Is there an obvious error in the future credences (xi) or their probabilities (p_i)?"
            - If yes, correct and go back to Step 2 (only one reassessment allowed).
            - If not, then set the new forecast for A to E and flag for sign-off by the head of risk.

    Step 7: If in Step 3 the analyst cannot assign a point estimate for one of the future credences, they must either:
            a) Break it down into more scenarios until they can assign a point, or
            b) Assign a point estimate that is the best guess (e.g., the midpoint of a range) and proceed, noting the uncertainty.
            c) If they cannot do either, skip the reflection check for this event and note the reason. But this should be rare.

    The output of the procedure for each event is either:
        - "Coherent: no change."
        - "Adjusted from [old] to [new] (requires sign-off)."
        - "Skipped: [reason]."

    The procedure runs within the 30-minute window because we are dealing with one piece of evidence at a time and a limited set of scenarios (typically 2-5).

    Now, we write the procedure as a checklist:

    Reflection Principle Check (for one event and one piece of evidence)

    Event: [Description of A]
    Current forecast: P(A) = [current value]

    Evidence: [Description of E] (scheduled to arrive on [date])

    Step 1: List the possible future credences for P'(A) after seeing E. (Judgment)
        Scenario 1: [Description] -> P'(A) = x1
        Scenario 2: [Description] -> P'(A) = x2
        ... 
        Scenario n: [Description] -> P'(A) = xn

    Step 2: Assign current probabilities to each scenario. (Judgment)
        P(Scenario 1) = p1
        P(Scenario 2) = p2
        ...
        P(Scenario n) = pn
        (Check: p1+...+pn = 1? If not, adjust.)

    Step 3: Compute expected future credence: E = p1*x1 + p2*x2 + ... + pn*xn.

    Step 4: Compare |P(A) - E|:
        If |P(A) - E| <= tolerance (0.01) -> "Coherent. No change needed."
        Else -> "Violation: difference = [difference]."

    Step 5: If violation:
        - Reassess: Are the scenarios and probabilities reasonable? 
            If an error is found, correct and recalc E. Then recheck.
            If no error, then set new forecast = E and flag for sign-off.

    Step 6: If during reassessment we still have a violation and no further corrections, then set new forecast = E and flag for sign-off.

    (Note: Only one round of reassessment allowed due to time constraints.)

    Step 7: If we cannot assign a point estimate for a future credence in a scenario:
        - Try to break that scenario into sub-scenarios until you can assign points.
        - If time does not permit, assign a point estimate that is the best guess and note it as such. Then proceed.

    Step 8: If a scenario is too vague to assign any point, then skip the event and note: "Skipped due to vagueness in scenario [X]." 

    However, note that we are only doing this for the next piece of evidence. We are not projecting multiple steps.

    Let's run the two examples with the checklist.

    Example 1:
      Event: Project delay.
      Current P(A): 0.3

      Evidence: Stress test (clean or dirty)

      Step 1:
          Scenario 1: Clean -> P'(A)=0.1
          Scenario 2: Dirty -> P'(A)=0.6

      Step 2:
          P(Scenario1)=0.7, P(Scenario2)=0.3

      Step 3:
          E = 0.7*0.1 + 0.3*0.6 = 0.07 + 0.18 = 0.25

      Step 4:
          |0.3 - 0.25| = 0.05 > 0.01 -> Violation.

      Step 5:
          Reassess: the analyst confirms the scenarios and probabilities.
          Then set new forecast to 0.25 and flag for sign-off.

      Output: "Adjusted from 30% to 25% (requires sign-off)."

    Example 2:
      Event: Project success (so A is success, but note: we are forecasting success, so we are interested in P(success))
      Current P(A): 0.9

      Evidence: Court ruling.

      Step 1:
          Scenario 1: Favorable -> P'(success)=0.95
          Scenario 2: Unfavorable -> P'(success)=0.5
          Scenario 3: Ambiguous -> P'(success)=0.8   [This is the analyst's best guess, but they are not sure]

      Step 2:
          P(Scenario1)=0.4, P(Scenario2)=0.3, P(Scenario3)=0.3   (sum=1)

      Step 3:
          E = 0.4*0.95 + 0.3*0.5 + 0.3*0.8 = 0.38 + 0.15 + 0.24 = 0.77

      Step 4:
          |0.9 - 0.77| = 0.13 > 0.01 -> Violation.

      Step 5:
          Reassess: The analyst is uncomfortable. They say: "Maybe in the ambiguous case I won't lower to 80%? Maybe I'll stay at 90%? Or even raise?"

          We allow one reassessment. They change:
              Scenario 3: Ambiguous -> P'(success)=0.9

          Then E = 0.4*0.95 + 0.3*0.5 + 0.3*0.9 = 0.38 + 0.15 + 0.27 = 0.80

          Still |0.9 - 0.80| = 0.10 > 0.01 -> Violation.

          They try changing the probabilities:
              Scenario1: 0.5, Scenario2: 0.2, Scenario3:0.3 (keeping the future credences: 0.95, 0.5, 0.9)

              E = 0.5*0.95 + 0.2*0.5 + 0.3*0.9 = 0.475 + 0.1 + 0.27 = 0.845

          Now |0.9-0.845|=0.055>0.01 -> still violation.

          They cannot reassess again (only one round). So they set the new forecast to 84.5% and flag for sign-off.

          Output: "Adjusted from 90% to 84.5% (requires sign-off)."

    This second example ends in an answer the analyst does not like, but the procedure is entitled to it because the analyst's own judgments about the future updates (even after reassessment) average to 84.5%, which is less than the current 90%. This indicates that the analyst, by their own lights, expects to have a lower credence in success in the future (on average) even in the best reassessment they can do quickly. Therefore, the current forecast is too high.

    Note: The head of risk will see the scenario breakdown and the probabilities and can override if they disagree with the judgments. But the procedure has done its job by forcing consistency.
answer: |-
  ### Reflection Principle Decision Procedure for Risk Forecasts

  **Core Principle**: Your current forecast for an event must equal your expected future forecast after seeing the scheduled evidence. Formally:  
  `Current P(A) = Σ [P(evidence scenario i) × Future P(A | scenario i)]`  
  Violations indicate incoherence—either your current forecast or your expectations of future updates are flawed.

  ---

  ### Step-by-Step Procedure (Runnable in 30 Minutes)
  **Tools Needed**: Calculator, spreadsheet, or script for weighted averages.  
  **Tolerance Threshold**: ±1% difference (adjustable for materiality).  
  **Time Allocation**: 5-7 minutes per forecast.

  #### **Step 1: Define Evidence Scenarios**  
  - **Question**: "What are the distinct possible outcomes of the upcoming evidence?"  
  - **Sufficient Answer**: 2–5 mutually exclusive scenarios covering all possibilities (e.g., "clean stress test," "dirty stress test").  
  - **Judgment Call**: Scenarios must be specific enough to imagine your future belief state. If scenarios are ambiguous (e.g., "inconclusive result"), break them into sub-scenarios.  
  - **Stop & Flag**: If scenarios can’t be defined (e.g., evidence too vague), skip this forecast and document why. Proceed only with point estimates.

  #### **Step 2: Assign Future Forecasts**  
  - **Question**: "If you saw *only* this scenario’s evidence, what would your new forecast for A be?"  
  - **Sufficient Answer**: A percentage for each scenario. Ranges (e.g., 40–60%) are forbidden—force a midpoint (e.g., 50%) or best guess.  
  - **Judgment Call**: This is where bias creeps in (e.g., over-optimism for favored projects). Document rationales.  
  - **Stop & Flag**: If you can’t assign a number (e.g., "I don’t know how I’d react"), pause and escalate for team discussion. Do not proceed.

  #### **Step 3: Assign Current Scenario Probabilities**  
  - **Question**: "What’s your current probability that each evidence scenario will occur?"  
  - **Sufficient Answer**: Percentages summing to 100% (e.g., 70% clean stress test, 30% dirty).  
  - **Arithmetic Check**: Validate sum = 100%. If not, rescale proportions.  
  - **Judgment Call**: Use existing data (e.g., historical stress test pass rates) to anchor probabilities.

  #### **Step 4: Calculate Expected Future Forecast**  
  - **Arithmetic**:  
    `Expected future P(A) = Σ [P(scenario i) × Future P(A | scenario i)]`  
  - **Automatic Check**: Compute this value. No judgment—pure math.

  #### **Step 5: Compare & Decide**  
  - **Arithmetic Check**:  
    - If `|Current P(A) - Expected future P(A)| ≤ tolerance` → **Coherent**. No action.  
    - Else → **Violation**. Proceed to Step 6.  
  - **Stop & Flag**: Violations require sign-off. Do not auto-adjust yet.

  #### **Step 6: Resolve Violations**  
  - **Question**: "Is the violation due to flawed current P(A) or flawed future expectations?"  
  - **Options**:  
    - **Reassign future forecasts/scenarios (Step 2/3)**: If you spot obvious bias (e.g., overconfident future estimates). *Limited to 1 revision*.  
    - **Revise current forecast**: If future expectations are solid, set:  
      `New current P(A) = Expected future P(A)`  
  - **Sign-Off**: All revised forecasts require the **Risk Team Head’s approval**. Document:  
    - Original forecast,  
    - Scenario breakdown,  
    - Rationale for revision.  
  - **Output**: Either:  
    - "Coherent: No change (tolerance = X%),"  
    - "Adjusted from Y% to Z% (sign-off required)," or  
    - "Skipped: [Reason]."

  ---

  ### Concrete Examples  
  #### **Example 1: Project Delay Forecast**  
  - **Current forecast**: P(delay) = 30%  
  - **Evidence**: Upcoming stress test.  
  - Scenarios:  
    - Clean test (future P(delay) = 10%), P(clean) = 70%  
    - Dirty test (future P(delay) = 60%), P(dirty) = 30%  
  - **Arithmetic**:  
    Expected future P(delay) = (0.7 × 10%) + (0.3 × 60%) = 7% + 18% = **25%**  
    |30% − 25%| = 5% > 1% → **Violation**.  
  - **Resolution**:  
    No reassignment (expectations are clear and certain). Adjust current forecast to **25%**.  
    **Output**: "Adjusted from 30% to 25% (sign-off required)."  

  #### **Example 2: Championed Project Success Forecast**  
  - **Current forecast**: P(success) = 90% (you advocated for this project).  
  - **Evidence**: Ambiguous court ruling.  
  - Scenarios (your best guess):  
    - Favorable ruling: Future P(success) = 95%, P(favorable) = 40%  
    - Unfavorable ruling: Future P(success) = 50%, P(unfavorable) = 30%  
    - Ambiguous ruling: Future P(success) = 80%, P(ambiguous) = 30%  
  - **Arithmetic**:  
    Expected future P(success) = (0.4 × 95%) + (0.3 × 50%) + (0.3 × 80%) = 38% + 15% + 24% = **77%**  
    |90% − 77%| = 13% > 1% → **Violation**.  
  - **Resolution**:  
    You reassign future forecasts due to discomfort (e.g., change ambiguous ruling update to 85%). Recalculation yields 80.5%. Violation persists (|90%−80.5%|=9.5%).  
    **Adjusted forecast**: Set to 77% (or 80.5% if reassigned).  
    **Why the procedure is entitled to this**: Your *own expectations* of future beliefs average 77–80.5%—below your current 90%. This gap signals over-optimism. The reflection principle forces consistency with your anticipated reactions.  
    **Output**: "Adjusted from 90% to 77% (sign-off required)."  

  ---

  ### What This Procedure Cannot Do  
  1. **Non-Quantifiable Evidence**:  
     - Fails if future forecasts can’t be expressed as numbers (e.g., "I’ll feel uneasy but can’t quantify it").  
  2. **Self-Doubt in Future Beliefs**:  
     - If you suspect you’ll update *irrationally* (e.g., due to panic), reflection doesn’t apply. The principle assumes future rationality.  
  3. **Evidence That Changes the Event**:  
     - If the event’s definition depends on the evidence (e.g., a ruling that alters contractual terms), coherence isn’t enforceable.  
  4. **Long Horizons or Multiple Updates**:  
     - Designed for single evidence events. Chaining updates (e.g., monthly reports) requires repeated runs.  
  5. **External Information Shocks**:  
     - Only scheduled evidence is considered. Unscheduled events (e.g., breaking news) invalidate the setup.  
  6. **When Suppressing Bias Is Correct**:  
     - If your future self *should* be biased (e.g., after incentive changes), enforcing coherence may be harmful.  

  ---

  ### Key Takeaways for Practitioners  
  - **Strength**: Forces confrontation between current beliefs and anticipated reactions—exposing overconfidence/anchoring.  
  - **Limitation**: Only as good as your scenario estimates. Garbage in, garbage out.  
  - **Defense Against Bias**: The sign-off requirement creates accountability for judgment calls.  
  - **When to Override**: If the Risk Team Head rejects a revision, document why. This flags model risk.  
  - **Not a Philosophy Seminar**: This is a *consistency check*, not truth-seeking. It won’t fix wrong assumptions, but it will make your errors coherent.  

  **Final Output**: A spreadsheet with columns:  
  `Event | Current P(A) | Evidence | Scenarios (P, Future P(A)) | Expected P(A) | Violation? | Revised P(A) | Sign-Off`.
