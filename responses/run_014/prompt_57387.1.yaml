prompt: |-
  You are a philosopher of mind and philosophy of science who also reads mechanistic interpretability work with genuine comprehension — you know what activation patching, causal scrubbing, steering vectors, sparse autoencoders, and the superposition hypothesis actually involve, and you are equally at home in the literature on measurement, latent variables, and the naturalization of mental content. I would like you to act as a demanding but constructive referee on a draft section of a paper, not as a summarizer or a cheerleader. Think carefully before you respond, and treat the draft as a colleague's work that you would like to see become publishable rather than as something to be praised.

  Some context. I am writing a paper on whether interpretability findings license realist talk about what neural networks represent — that is, whether "the model represents that the input is a Golden Retriever" reports a fact about the model or introduces a useful notation. The eventual target is a philosophy-of-science venue, roughly 8,000 words, with a mixed audience: philosophers who have never opened an interpretability paper and ML researchers who have never heard the disjunction problem. What follows is the argumentative core, about 1,000 words, written at speed. Paragraphs are numbered so that you can key your comments to them.

  ---

  §1. Mechanistic interpretability is usually described as an engineering discipline: locate the circuits, name the features, patch them, observe the change in behavior. Yet its deliverables are reported in a vocabulary borrowed from the philosophy of mind. A direction in activation space is said to encode a concept, to carry information about a property of the input, to be a feature the model relies on. I want to ask whether that vocabulary is descriptive or honorific. When an interpretability paper reports that a model represents that an image contains a dog, is it reporting a discovery about the model, or stipulating a way of talking about a function from inputs to outputs?

  §2. There is a precedent for this question, and it is not in the philosophy of mind. Mid-century psychometrics faced it about latent traits. A factor analysis of questionnaire items yields a structure that reproduces the covariance among the items; the dispute was whether the factor names a real attribute of the person that causes the responses, or merely re-describes the covariance in a compact form. Both readings license identical predictions from the same data. What separated them was not more data of that kind but a claim about what sort of thing the attribute was supposed to be — and, in particular, whether the numerical structure attributed to it was empirically warranted or an artifact of the scaling procedure used to elicit it.

  §3. Interpretability inherits a version of this problem in unusually sharp form, because of superposition. When more features are packed into an activation space than it has dimensions, features are not orthogonal: a given direction participates in many of them, and a given feature is distributed across many directions. Decomposition methods attempt to recover a basis in which features are approximately one-dimensional and minimally overlapping. But the recovery problem is structurally the rotation problem of factor analysis. An indefinitely large family of bases fits the same data, and the criteria deployed to choose among them — sparsity, simplicity, stability under resampling, human intelligibility of the resulting axes — are criteria the investigator brings, not criteria the data dictate.

  §4. Call the thesis that one such basis is the semantically privileged one rotation realism. Interpretability practice is committed to something like it whenever it says that a model has a feature, rather than that some description in some basis approximates the model's behavior well. Rotation realism is not obviously untenable. In the psychometric case its defenders argue that although many rotations fit the covariance matrix equally well, only some yield factors that behave like unitary attributes under intervention, under differential prediction of other measures, and under change over time. Structure is underdetermined by fit alone, but not by fit together with everything else.

  §5. This is where I think the interesting asymmetry lies. In the psychometric case "everything else" includes the possibility of manipulating the putative attribute, or of finding measures that respond to it in dissociable ways. Interpretability has the same resource in a stronger form: patching, scrubbing, and steering allow the investigator to intervene on a candidate direction and observe the consequence for behavior. The causal criterion for content assignment — that the state, typed at the level of content rather than of physical realization, makes a difference to output in a way that tracks what it is supposedly about — is therefore not merely available to interpretability. It is the field's signature method, and it is a method that human psychology can only envy.

  §6. But the causal criterion is less clean than that suggests, and this is my chief worry about my own argument. To intervene on a direction is to intervene on a one-dimensional subspace of a space whose basis the investigator has already chosen. Patching direction d changes behavior; but so will any d' that differs from d only within the span of features the task does not engage. The intervention establishes that some member of an equivalence class of directions is doing work. It does not select the member. Causal access buys far more than correlation does, yet it does not obviously buy uniqueness. What it may buy is principled narrowing: the equivalence class shrinks as the range of intervention tasks widens, and a feature is individuated not by a single experiment but by the profile of its effects across many. That is a bootstrapping strategy, and it rests on the assumption that the correct typing of a state is the typing under which its causal profile is most systematic. I am not confident that this assumption is anything better than a preference dressed as a criterion.

  §7. Here is the claim I most want pressed on. The standards being applied to networks — a determinate mapping from state to content, causal efficacy under the content-level typing, and the possibility of error rather than mere contrary disposition — are standards no natural system meets either, if they are read as demanding determinacy from inside the system. What breaks the tie in the human case is not better evidence of the same kind; it is report, shared evolutionary and developmental history, and the fact that the content assignments which make sense of an agent's behavior also make sense of what the agent says about itself. Interpretability lacks report. Human psychology lacks what interpretability has: controlled access to the vehicle. The two cases have complementary deficits, and that is why the global anti-realism which a strict reading of the standards would compel looks unstable to me. It must either hold that the deficits are fatal in both cases — in which case there are no representations anywhere and the entire idiom of cognitive science is instrumental — or hold that they are curable in principle, in which case interpretability stands on the same epistemic footing as the rest of psychology, with different instruments.

  §8. A consequence, if this is right. Much of the methodological anxiety about interpretability — that its findings are unfalsifiable, that features are named after the fact, that its successes are post-hoc — is anxiety about the wrong object. The naming worry is a worry about rotation realism, which is a substantive metaphysical question with a determinate answer or none, and it is being discussed as though it were a matter of scientific hygiene. Meanwhile the error worry — whether a system with no stake in getting things right can represent anything at all — is treated as settled by pointing to benchmark failures. Benchmark failure shows that outputs diverge from a norm we imposed. It does not show that the model represents the norm and misrepresents the case. If anything the second worry runs deeper, and interpretability has almost nothing to say about it, because misrepresentation is not a property one can find by patching.

  §9. Tentative thesis: realism about neural representations should be defended by analogy with realism about measurement in psychology, not by analogy with realism about electrons; the analogy renders the dispute tractable without resolving it; and the residue of the dispute is not about networks at all, but about what would make any attribution of content true.

  ---

  Please respond in the following order.

  1. Before commenting at all, spend five to eight lines thinking out loud about what this draft could become: identify the single load-bearing claim, the two or three most promising directions it could be developed in, and which of those directions the current text is fighting against. Do this as genuine brainstorming, not as a recap.

  2. Accuracy audit. Flag every place where I have characterized a standard position — in philosophy of mind, in the philosophy of measurement and psychometrics, or in interpretability practice — in a way a specialist would judge wrong, dated, or tendentious. Pay particular attention to §2 and §3: is the rotation-indeterminacy analogy to factor analysis technically correct as I have stated it, or have I conflated rotation indeterminacy with some other underdetermination result? If a position I describe has a standard name or a canonical defender, you may name it, but do not assemble a reference list, and do not give titles, dates, or quotations you are not certain of. Where you are unsure whether a characterization is standard, say so explicitly; a flagged uncertainty is worth much more to me than a confident guess.

  3. The analogy's breaking point. State precisely where the psychometric analogy stops carrying the weight I place on it, and judge whether the break is fatal to §9 or merely limits its scope. I suspect the disanalogy concerns the availability of a correct answer about the attribute's underlying structure, but I would rather hear your version than my own.

  4. Strongest objection. Write the best objection a determined anti-realist about neural representation could raise against §7, in the objector's own voice and at roughly 150 words, aiming at the complementary-deficits claim rather than at anything peripheral. Then say whether I can answer it, and if so, what the answer would have to concede.

  5. Is §7 a thesis or a platitude? Would a working interpretability researcher find anything in §7 or §8 that they did not already believe? Be blunt: if the section's real content is a restatement of an obvious point in a more complicated vocabulary, say so and say what the non-obvious residue is.

  6. Two or three specific places where the prose overclaims or where a hedge is doing unearned work, with a suggested rewrite of the sentence.

  Close with a one-paragraph verdict: whether this should be developed as it stands, reframed for a different audience, or whether §7 should be cut and the paper rebuilt around §6. Aim for a thorough but unpadded response of roughly 900 to 1,300 words, keyed to paragraph numbers. I do not need my argument summarized back to me beyond the single sentence you use to identify the load-bearing claim.
