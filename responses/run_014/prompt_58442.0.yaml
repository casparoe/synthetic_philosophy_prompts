  - The residue report needs special care - I'll note how alignment concerns don't map (slackers aren't malicious like misaligned AI), how recursive splitting differs (teachers don't sub-delegate infinitely), and the fuzzy part where "intent" in AI safety is way more abstract than peer intentions.

  Their chem case is genius because it shows both sides: 
