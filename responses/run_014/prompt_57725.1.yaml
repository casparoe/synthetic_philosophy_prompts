  ### Key Takeaways from Residue
  1. **Your Vocabulary Excels At:** Operationalizing statistical abnormality (RIs), context-specific flagging, and harm thresholds (MDLs). Hybrid views translate cleanly.
  2. **Strains Occur With:** 
     - Boorse's teleology ("survival/reproduction" as goal) – labs measure proxies, not purposes.
     - Individual "vital goals" – MDLs are population-level compromises.
     - Value-neutrality claims – lab standardization masks embedded norms.
  3. **Untranslatable:** **Canguilhem's "adaptation" concept**. Lab medicine is analytic, reductionist, and snapshot-based; it cannot quantify an organism's holistic, dynamic capacity to establish new norms in response to environmental challenges (e.g., a diabetic adjusting their life around insulin management). This matters because it reveals the limits of defining health solely through discrete biomarkers.

  ### On Your Hunches
  - **Partly Right:** Yes, the naturalism/RI vs. normativism/MDL mapping is fundamentally sound and explains much of the debate's persistence. 
  - **But:** You understate the philosophical weight of the reference class problem. For Boorse, choosing a reference class *should* be a biological fact (e.g., "human female, age 30-40"); for normativists, it's always value-laden (why not include malnourished subjects?). Labs resolve this pragmatically, but philosophers see it as exposing naturalism's fatal flaw. The debate isn't *just* about different objects—it's about whether biology itself can ground norms without values. Your vocabulary assumes it can; normativists deny it.
