answer: |-
  ### **Reasons Rumble: The "Why Should I?" Quiz**  
  Sick of philosophical fistfights at 2 AM? This quiz will reveal what you *really* believe about reasons—no jargon, just juicy stories. Pick the gut reaction that feels right for each question. Tally your answers at the end to find your camp!

  ---

  ### **The Questions**  
  **1. Maya’s Running**  
  Maya knows running is great for her health. Her doctor explained all the stats, and she’s calm and clearheaded. But she feels **zero pull** to run—like, ever. Does she still have a reason to run?  
  - **A:** *Yes, because health matters even if she doesn’t care.*  
  - **B:** *No, if she’s not motivated, there’s no reason for her.*  
  - **C:** *Only if she wanted health benefits—but she doesn’t, so no.*  

  **2. Dev’s Scam**  
  Dev scammed his little brother out of his savings. Everyone says it’s wrong, and Dev gets that. After a month of calm, honest reflection, he still feels **zero pull** to pay it back. Does the fact it’s *morally wrong* give him a reason to pay it back?  
  - **A:** *Yes, wrongness itself gives a reason—even if Dev feels nothing.*  
  - **B:** *No, if he’s not motivated after reflection, there’s no reason.*  
  - **C:** *He’d have a reason if he were a better person—but he’s not, so no.*  

  **3. Lena’s Cleaning Fluid**  
  Lena *really* wants to drink cleaning fluid—she thinks it’ll boost her immunity (it won’t; it’s poison). What does she have reason to do?  
  - **A:** *Drink it—her actual desire fixes the reason.*  
  - **B:** *Not drink it—if she knew the truth, she wouldn’t want to.*  
  - **C:** *Not drink it—it’s harmful, period. Desires don’t matter.*  

  **4. Alex’s Boring Book**  
  Alex knows reading a dry work report will help his career, and he does care about his job. But right now, he feels **zero motivation** to read it. Does he have a reason to read it *now*?  
  - **A:** *Yes—he cares about his career, so he’s got a reason.*  
  - **B:** *No—no current motivation, no current reason.*  
  - **C:** *Yes—it’s objectively good for him, lazy or not.*  

  **5. Sam’s Charity Dilemma**  
  Sam is rich and knows donating to charity would save lives. He doesn’t care about strangers, but he’s thinking clearly and without bias. Does he have a reason to donate?  
  - **A:** *Yes—saving lives matters, whether he cares or not.*  
  - **B:** *No—if he feels no pull, no reason exists for him.*  
  - **C:** *Yes—if he reflected deeply, he’d care (but he hasn’t).*  

  **6. Taylor’s Art Dream**  
  Taylor has always wanted to be an artist. After years, they realize they have no talent and will likely fail. They still *really* want to pursue it. Do they have a reason to try?  
  - **A:** *Yes—they want it, so they’ve got a reason.*  
  - **B:** *No—it’s a waste of time objectively.*  
  - **C:** *Only if they’d still want it after accepting the truth.*  

  **7. Jordan’s Drowning Child**  
  Jordan sees a child drowning in a pond. They’re a great swimmer and could save them risk-free, but Jordan doesn’t care about the kid and is thinking calmly. Does Jordan have a reason to save them?  
  - **A:** *Yes—it’s the right thing to do, feelings aside.*  
  - **B:** *No—if Jordan feels zero pull, no reason.*  
  - **C:** *Yes—if Jordan reflected properly, they’d care (but they won’t).*  

