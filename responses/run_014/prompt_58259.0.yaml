  ok so me and my housemates have been stuck in this endless late-night arguement about internal vs external reasons, basically whether you can have a reason to do something even if nothing about you would ever move you to do it even when you are thinking clearly.

  can you make us a little sorter quiz to settle it, like 7 questions total, aimed at people who did intro ethics once and forgot most of it. each question should be a tiny concrete story with 2 or 3 gut reactions to choose from, and nobody answering should need to know words like internalism to answer, they just pick what feels right about the case.

  you have to include these three stories somewhere in the 7, you can reword them but keep the point: Maya knows everything about why running would be good for her, doctor explained it, stats and all, she is calm and clearheaded and still feels absolutely zero pull to run, does she still have a reason to run; Dev scammed his little brother out of savings, he gets that everyone calls it wrong, but even after a month of careful honest reflection he would still feel zero pull to pay it back, does the fact it was morally wrong by itself give him a reason to pay it back; Lena really wants to drink some cleaning fluid because she mistakenly believes it will boost her immunity, is what she has reason to do fixed by her actual mistaken want, or by what she would want if she knew the truth, or by something else entirely.

  then tell us how to tally answers up to five endpoints: the strict current-desire person, the ideal-reflection person, the mixed person who is internalist about normal stuff but thinks morality alone can give reasons, the full externalist, and the skeptic who thinks this whole reasons talk is muddled. build the quiz from the questions first and then show where each view lands, point out any answer combo that ends up with nobody in it and say whether you think that combo is incoherent or just unexplored or whatever, and be upfront about any two views your questions cannot really seperate.

  keep it fun and a bit snarky, not textbooky, so the result tells each of us what we actually believe from our case picks rather than what label we thought we liked.
