prompt: |-
  So I'm a junior in high school and in my AP World class we just did this unit on famines and got into a big arguement at lunch about whether famines are natural disasters or like political crimes. Our teacher Mr. Harris definitely leans one way but he's not super simple about it. We read about this economist Sen and his idea that famines usually happen not because there is literally zero food around but because poor people lose their ability to get food when wages fall apart or prices spike or they lose work. And Mr. Harris used that for a bunch of cases. He said the Bengal famine during WWII was a political crime because the harvest was a bit down but rice was still moving out of the area for the war and city wages and hoarding made villagers starve. He said the Irish potato famine was a political crime too because the potato blight was real but other foods like oats and animals were still being shipped out under guard while people starved. He said the Chinese famine during the Great Leap Forward was a political crime because local officials made up fake bumper harvest reports and the state took too much grain while peasants had nothing. But then he said the famine after that huge volcano that blocked the sun and killed crops all over in 1816 was mostly a natural disaster and a tragedy, because there just was not food to move and transport back then was horses and carts even though the kings in charge were selfish anyway.

  Now we're doing this model UN simulation with a made-up landlocked country called Alvara and I need to know what Mr. Harris would have to say to stay consistant with himself. In the scenario a drought in 2019 wipes out more than half the sorghum harvest, and the new democratic goverment bans all food exports on day one, opens up army granaries, tries to buy rice abroad but world prices have doubled so they can't afford enough and foreign aid money comes late, and then floods wash out the only rail line for seven weeks so trucks can't get in. There is no lying about harvests and reporters can write whatever they want, but still like thirty thousand people die. The opposition team calls it a political crime and the goverment team says it was nature. Can you lay out like two different rules that both fit everything Mr. Harris has said so far, say what each rule would predict he has to say about Alvara, take your best guess on which rule he is actually using and why, say which of the old famines is the closest analog to Alvara, and tell me what other made-up case would seperate the two rules for sure.

  Please answer in American English and just write it as normal continuous prose like you would write an email or a letter, with no headings, bullet points, bold text, or tables.
