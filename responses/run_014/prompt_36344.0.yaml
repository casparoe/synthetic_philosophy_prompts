prompt: |-
  I'm the deputy head of a private secular secondary school in Brussels with about 900 students, and every year we field a steady trickle of requests for religious accommodation that our current practice handles ad hoc, and inconsistently — the same request has been granted by one year head and denied by another, and parents have started noticing. The deeper problem is that our governing board is split along a fault line that I've come to realize is genuinely philosophical: roughly half the board was educated in the French tradition and takes the laïcité view that a school's job is to maintain a neutral common space from which communal identities are set aside, and the other half is Anglo-American and takes the multiculturalist view that refusing accommodations is itself a choice that quietly privileges the majority's holidays, food, and dress as the unmarked default. Every time we try to settle a case, the meeting replays this dispute at full volume and decides nothing. What I want is not for you to referee the board, but to give me something the school can actually run.

  Please write a decision procedure, in the form of an ordered list of questions with criteria, that our year heads could apply to any accommodation request in under an hour: the questions to ask in sequence, what counts as a sufficient answer at each step, the points at which the procedure terminates in a no, and — crucially — the points at which it must stop and hand the decision up, because what remains is a question of values the procedure cannot resolve and only the board can. The conceptual work I'm asking for is in the translation: the procedure should be honest about which parts of the school's stance come from laïcité-type reasoning (uniform treatment, the school as a space of emancipation from inherited community, equality as sameness before the institution) and which from multiculturalist reasoning (recognition, the claim that neutrality is a myth because the default already encodes the majority culture, equality as sometimes requiring differential treatment), and it should mark clearly where those two traditions would give different answers to the same question rather than smuggling one in. It should also state its own failure modes — for instance, where treating all religions identically becomes a rule that only ever bites on minorities, or where case-by-case accommodation drifts into an implicit ranking of which faiths are serious.

  Then run the procedure on three requests we actually received last year: a fifteen-year-old who wants to wear a headscarf in PE and in class; a group of parents asking that afternoon exams during Ramadan be moved to the morning; and parents asking that their daughter be excused from co-ed swimming lessons. I'd like to see where the procedure gives a firm answer, where the two traditions embedded in it would diverge, and at least one point where it produces an outcome the board majority will dislike — I suspect that if we take our neutrality rhetoric seriously it commits us to things about crucifix necklaces and birthday cakes that nobody on the board has thought through. Finally, tell me what the procedure cannot do: the kinds of requests that will come to us and that it was never built to handle, and where it will misfire if we lean on it for a decade. Keep in mind our constraints: year heads are not philosophers, decisions must be explainable in writing to parents in two languages, every ruling sets a precedent we can be held to, and the Ramadan question comes back annually whether we have a framework or not.
reasoning: |-
  Hmm, the user is the deputy head of a private secular secondary school in Brussels dealing with religious accommodation requests. They're facing inconsistency in handling these requests due to a philosophical split on their governing board between French laïcité and Anglo-American multiculturalism perspectives. They need a practical decision procedure that year heads can apply efficiently, without resolving the underlying philosophical debate.

  The core challenge is creating a procedure that transparently incorporates both worldviews while being operable by non-philosophers. This requires me to build a step-by-step filtering system that identifies when decisions can be made neutrally and when they must escalate to the board due to value judgments. I should ensure that each step flags where the two traditions would diverge.

  Key design principles must include:
  - Front-loading objective criteria (safety, feasibility)
  - Distinguishing between private observance and public display
  - Separating academic accommodation from social/cultural requests
  - Creating clear off-ramps for automatic approvals/rejections
  - Marking escalation points where philosophical differences become unavoidable

  For the test cases:
  - Headscarf request: Safety assessment might approve PE versions but class attire would hit the neutrality/multiculturalism fault line
  - Ramadan exams: Academic impact assessment may grant morning slots, but school-wide scheduling would require board policy
  - Co-ed swimming: Safety/feasibility may deny on practical grounds, avoiding the modesty debate entirely

  The procedure must explicitly state its limitations - it can't handle requests that fundamentally challenge secularism (like gender-segregated classes) or create parallel systems. It will struggle with cumulative impacts over time and implicit hierarchies between religions.

  The sample rulings should demonstrate where the procedure provides clarity and where it surfaces philosophical disagreements for board resolution. Crucially, it must force consistency on equivalent cases (e.g., if Sikh bracelets are permitted, hijabs must get equal consideration) even when uncomfortable for the majority.

  Finally, the documentation needs to work in multilingual parent communications and withstand precedent-based challenges. Annual issues like Ramadan require standing policies rather than case-by-case decisions.
answer: |-
  Here is a practical decision procedure designed for efficiency, transparency, and philosophical honesty. It isolates resolvable issues early and flags irreconcilable value conflicts for the board. The steps explicitly reference the underlying principles (L for Laïcité, M for Multiculturalism) where relevant.

  **Religious Accommodation Request Procedure for Year Heads**

  1.  **IS THIS A FORMAL REQUEST?**  
      *   **Question:** Is the request submitted in writing (email acceptable) by the student (if 16+) or their parent/guardian, clearly citing a sincerely held religious belief/practice?
      *   **Sufficient Answer:** Written request received citing religious basis. Verbal requests require documented follow-up confirmation.
      *   **Terminate:** If no formal request exists, explain the need for written submission. **NO.**
      *   **Hand Up?** No.

  2.  **IS THE REQUEST RELATED TO A PROTECTED BELIEF?**  
      *   **Question:** Does the stated belief fall within the scope of recognized religions *or* protected philosophical convictions (e.g., secular humanism, pacifism) under Belgian law? (Avoid judging sincerity at this stage).
      *   **Sufficient Answer:** Belief system is identifiable and generally recognized as religious or philosophical (refer to Belgian anti-discrimination frameworks).
      *   **Terminate:** If the request is clearly based on personal preference, cultural tradition without religious link, or political stance *not* constituting a protected conviction. **NO.**
      *   **Hand Up?** Only if the belief system's status is genuinely novel or legally ambiguous.

  3.  **IS THERE A SAFETY RISK? (Absolute Barrier)**  
      *   **Question:** Would granting the request pose an *unacceptable and unavoidable* risk to the physical safety of the student or others (e.g., loose clothing near machinery, obscured vision in labs/PE, refusal of life-saving medical treatment)?
      *   **Sufficient Answer:** Objective safety assessment based on specific activity/context (consult relevant department head if needed). Risk must be demonstrable, specific, and unmitigable.
      *   **Terminate:** If clear, unmitigable safety risk exists. **NO.** (Applies equally to all, L & M agree on safety primacy).
      *   **Hand Up?** Only if safety risk is highly disputed or mitigation options are complex/costly.

  4.  **IS THERE A FEASIBILITY BARRIER? (Operational Impossibility)**  
      *   **Question:** Would granting the request impose an **undue hardship** on the school? Consider: Significant financial cost, fundamental alteration of the educational program, substantial disruption to school operations, significant administrative burden disproportionate to the request.
      *   **Sufficient Answer:** Concrete evidence of hardship (e.g., cost quotes, proof no qualified substitute teacher available, proof rescheduling exams *system-wide* is impossible). Burden of proof is high.
      *   **Terminate:** If genuine, demonstrable undue hardship exists. **NO.** (L & M generally agree institutions have limits).
      *   **Hand Up?** If hardship claim is significant but debatable (e.g., cost vs. budget, defining "fundamental alteration").

  5.  **IS THE ACCOMMODATION PRIVATE OR PUBLIC?**  
      *   **Question:** Does the request pertain solely to **private observance** (prayer, dietary intake, personal study) or does it involve **public display/modification of the shared environment** (attire, use of shared spaces, altering schedules/activities for others)?
      *   **Sufficient Answer:** Clear distinction based on visibility/impact on others.
      *   **Terminate (Approval likely):** For purely *private* observance (e.g., quiet prayer during break, bringing own lunch, silent reflection). **YES** (M favours easily; L accepts as non-intrusive to common space). *Requires finding discreet space/time.*
      *   **Proceed:** If request involves public display or altering the shared environment. Go to Step 6.

  6.  **DOES IT DIRECTLY IMPACT ACADEMIC ASSESSMENT?**  
      *   **Question:** Does the request pertain specifically to the timing, format, or conditions of formal academic assessment (exams, tests, major presentations)?
      *   **Sufficient Answer:** Request directly relates to a scheduled assessment event impacting the student's ability to fairly demonstrate learning.
      *   **Terminate (Approval likely):** If feasible alternative exists that preserves assessment validity (e.g., taking exam earlier in the day during Ramadan, brief prayer break scheduled *around* not *during* an exam). **YES** (M favours; L often accepts as core to educational equity mission, seeing assessment as distinct from social environment). *Requires minimal disruption.*
      *   **Proceed:** If not primarily about academic assessment, or if the proposed alternative compromises validity. Go to Step 7.

  7.  **DOES IT MODIFY THE SCHOOL'S NEUTRAL SPACE? (The Core Fault Line - Escalation Point)**  
      *   **Question:** Would granting this request visibly introduce a specific religious symbol, practice, or exemption into the shared educational/social environment of the school (common areas, classrooms, standard activities like PE/swimming)?
      *   **Sufficient Answer:** The accommodation would be visible to others and perceived as a departure from the standard, secular environment (e.g., distinctive religious attire, exemption from core non-academic activities like swimming).
      *   **Terminate:** **DO NOT DECIDE.** This is the core value conflict.
      *   **Hand Up?** **YES. MUST ESCALATE TO BOARD.** Here's why:
          *   **Laïcité (L) View:** The shared school space *must* remain free of individual religious symbols/practices to ensure true neutrality, equality as sameness, and emancipation from inherited identities. Granting such requests fragments the common space and undermines the school's secular mission. *Likely Outcome: DENY.*
          *   **Multiculturalism (M) View:** True neutrality requires recognizing that the existing "default" (e.g., standard PE kit, co-ed swimming, standard calendar) already reflects majority cultural norms. Denying accommodation privileges this majority and imposes a burden only on minorities, creating inequality. Equality sometimes requires differential treatment. *Likely Outcome: APPROVE, if feasible/safe.*
          *   **Procedure's Role:** This step *identifies* the irreconcilable value choice. The Year Head documents the request, the analysis up to Step 7, and clearly states the conflicting principles at stake. The Board *must* decide based on the school's overarching philosophy.

  **Procedure Failure Modes & Limitations:**

  1.  **The "Identical Treatment" Trap:** Strictly applying rules to *all* religions equally (L ideal) can ignore that only minority practices *need* accommodation (e.g., banning *all* headwear affects Sikh turbans, Jewish kippahs, and Muslim hijabs, but not majority practices). Neutrality enforced this way disproportionately impacts minorities.
  2.  **The "Seriousness" Slippery Slope:** Case-by-case assessment (especially pre-Step 7) risks implicit judgments about which religions/beliefs are "legitimate" or "sincere enough." The procedure (Steps 1-2) relies on formal recognition and avoids probing sincerity deeply to mitigate this.
  3.  **Cumulative Burden:** Granting numerous small, private accommodations (Step 5) can collectively create significant administrative strain over time. The procedure doesn't easily track this.
  4.  **The Majority Blind Spot:** The procedure struggles with requests from the majority culture (e.g., Christmas trees, Easter break, crucifixes) because they are often ingrained as "neutral" defaults. Step 7 forces the board to confront these (e.g., "If we ban hijabs as non-neutral, must we also ban discreet crucifix necklaces?").
  5.  **Beyond Accommodation:** This procedure handles *adjustments* within the existing system. It **cannot** handle requests that fundamentally challenge the secular model itself (e.g., demanding gender-segregated classes, mandatory religious instruction, exemption from core secular curriculum topics like evolution).
  6.  **Social Cohesion vs. Individual Rights:** The procedure can't resolve debates about whether widespread accommodation harms social cohesion (L concern) or fosters inclusion (M view). This remains a board-level value judgment.
  7.  **Predictability vs. Context:** Over a decade, rigid application might ignore genuine novel contexts. Conversely, too much flexibility breeds inconsistency. The procedure aims for consistency on principles, not micromanaging every detail.

  **Applying the Procedure to Real Cases:**

  **1. Headscarf (Hijab) in PE & Class:**
      *   Step 1-2: Formal request based on recognized belief? **YES** (Proceed).
      *   Step 3: Safety risk? In *class*: Generally no (unless specific lab hazard). In *PE*: Depends on activity/specific garment. A sports hijab designed for activity? Likely **NO RISK** (Proceed). Loose traditional scarf? **POTENTIAL RISK** - Mitigation (require sports hijab) or terminate **NO** if unmitigable. *Assume sports hijab requested.*
      *   Step 4: Undue hardship? **NO** (Proceed).
      *   Step 5: Private or Public? **PUBLIC** (Visible display in shared space) (Proceed).
      *   Step 6: Impact Academic Assessment? **NO** (Proceed).
      *   Step 7: Modify Neutral Space? **YES** (Visible religious symbol in class/PE). **MUST ESCALATE TO BOARD.**
      *   **Outcome:** Board must decide. **L View:** Likely deny (intrudes on neutral space). **M View:** Likely approve (accommodates minority practice, majority default unchallenged). **Controversial Outcome Example:** If Board (L-majority) denies hijab, consistency *requires* banning all visible religious symbols in class/PE (crucifixes, turbans, kippahs, large Stars of David) - an outcome some may dislike.

  **2. Move Afternoon Ramadan Exams to Morning:**
      *   Step 1-2: Formal request? **YES** (Proceed).
      *   Step 3: Safety risk? **NO** (Proceed).
      *   Step 4: Undue hardship? *System-wide rescheduling?* Likely **YES** (Major disruption, conflicts with teacher/room schedules, unfairness to non-fasting students if exams moved universally). *For specific students?* Offering *individual* morning slots (if logistically possible) often **NO HARDSHIP** (Proceed). *Assume request is for affected students only.*
      *   Step 5: Private or Public? **PRIVATE** (Fasting is personal, request is about timing of assessment) (Go to Step 6).
      *   Step 6: Impact Academic Assessment? **YES** (Fasting may impact afternoon performance). Feasible alternative? Offering affected students an *individual* morning slot (if supervision/space allows) preserves validity. **YES** (Terminate with **APPROVAL**).
      *   **Outcome:** **YES** (Approved for individual students, if logistically feasible). Both L & M can accept this as reasonable academic accommodation. *Crucially:* This avoids the annual debate by making it a standing operational policy for exam scheduling during Ramadan (identify affected students early, offer morning slots where possible). Step 4 prevents universal rescheduling.

  **3. Excuse Daughter from Co-Ed Swimming:**
      *   Step 1-2: Formal request? **YES** (Proceed).
      *   Step 3: Safety risk? **NO** (Assuming refusal, not alternative provision) (Proceed).
      *   Step 4: Undue hardship? *Excusing one student?* Minimal burden. *But creating precedent for widespread exemptions?* Potential future burden, but not *undue* for a single case. **NO HARDSHIP** (Proceed). *Providing gender-segregated lessons?* **YES HARDSHIP** (Cost, staffing, facilities - Step 4 **TERMINATE NO** if this is the ask).
      *   Step 5: Private or Public? **PUBLIC** (Exemption from a core, shared school activity) (Proceed).
      *   Step 6: Impact Academic Assessment? **NO** (Swimming is usually part of PE curriculum, but not typically graded as high-stakes *academic* assessment) (Proceed).
      *   Step 7: Modify Neutral Space? **YES** (Exemption based on religion from a standard communal activity deemed part of the secular curriculum). **MUST ESCALATE TO BOARD.**
      *   **Outcome:** Board must decide. **L View:** Likely deny (undermines common activity, sets precedent for fragmentation based on identity, curriculum applies to all equally). **M View:** Likely approve (respects modesty requirement, co-ed swimming reflects majority cultural norm, refusal burdens minority). **Controversial Outcome Example:** If Board (M-majority) approves exemption, consistency *requires* granting similar exemptions for sincerely held modesty beliefs from *any* student (e.g., Orthodox Jewish boys, conservative Christian girls, non-religious students with body image issues) - potentially hollowing out the PE curriculum.

  **What the Procedure Cannot Do:**

  1.  **Resolve the Core Philosophical Disagreement:** It identifies the fault line (Step 7) but doesn't bridge it. The board *must* eventually establish a clear stance on visible symbols and exemptions from core non-academic activities.
  2.  **Handle "Neutral Default" Challenges:** It won't automatically flag that Christmas break or standard cafeteria food might be seen as non-neutral. Only when a request *explicitly* challenges these (e.g., "Why no Eid holiday?") would it arise, likely at Step 7.
  3.  **Address Sincerity Deeply:** It relies on formal requests (Step 1) and avoids intrusive investigations. A student exploiting the system might slip through. Conversely, a novel or intensely personal belief might be dismissed at Step 2.
  4.  **Manage Long-Term Precedent Creep:** It focuses on individual requests. Over years, accumulated "YES" decisions at Step 7 (if the board is M-leaning) could subtly shift the school's character. The board needs periodic review.
  5.  **Solve External Societal Conflicts:** Requests stemming from broader societal tensions (e.g., protests over specific geopolitical events) fall outside its scope.
  6.  **Dictate Curriculum Content:** Exemptions from teaching evolution, sex ed, or certain literature based on religious objection would likely fail at Step 4 (undue hardship - fundamental alteration of secular educational mission) or Step 6 (if assessment related, finding a valid alternative is impossible).

  This procedure provides a structured, defensible, and time-efficient framework for Year Heads. It forces clarity on what is a resolvable operational issue and what is a fundamental value choice requiring Board deliberation. By explicitly surfacing the laïcité/multiculturalism tension at Step 7, it demands honesty from the Board and builds a consistent precedent base. Implement it alongside mandatory training for Year Heads on applying the steps objectively and documenting decisions thoroughly. Crucially, use the annual Ramadan exam issue to establish a clear, proactive *policy* (via Step 6 approval) that avoids yearly ad-hoc battles.
