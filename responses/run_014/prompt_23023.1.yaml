  Equalized odds equalizes false positive and false negative rates across groups. This could mean adjusting thresholds so that both groups have similar rates of being incorrectly flagged or missed. For the underserved group with lower base rates, this might mean lowering the threshold to catch more true positives, leading to more false positives. But it ensures that the model's errors are balanced between groups, which might be fairer in terms of resource allocation.

