answer: |-
  **MEMORANDUM**  
  **TO:** Clinical Informatics Committee  
  **FROM:** [Your Name/Title]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Fairness Criterion for Readmission-Risk Model  

  This memo outlines my recommendation for selecting a fairness criterion for our readmission-risk model, given the impossibility of simultaneously satisfying both calibration and equalized odds due to unequal baseline readmission rates. After careful consideration of clinical impact, equity, and operational realities, **I recommend prioritizing Equalized Odds** and accepting the limitations of calibration. Below is the rationale, the concrete cost of this choice, and a steelman of the opposing view.  

  ### 1. **Recommended Criterion: Equalized Odds**  
  **Definition:** Equal false-positive rates (FPR) and false-negative rates (FNR) across both patient populations.  
  **Why?**  
  - **Equity-Driven:** The under-served population (with lower baseline readmission rates) has historically received less support. Equalized Odds ensures errors in model predictions (e.g., missing high-risk patients or over-triggering interventions) are distributed *equally* across groups.  
  - **Mitigates Disparate Harm:** Without this, the model would likely miss more high-risk patients in the under-served group (higher FNR) due to their lower baseline rate. Equalized Odds forces the model to "look harder" for at-risk patients in this population, reducing under-service.  
  - **Aligns with Program Goals:** Since the output triggers a *hard threshold* for follow-up (not a clinical aid), fairness in access to the intervention is paramount. Equalized Odds directly addresses systemic bias in resource allocation.  

  ### 2. **Cost of Rejecting Calibration**  
  **What We Give Up:**  
  - **Loss of Probabilistic Interpretability:** A score of "X" will **not** represent the same actual readmission probability in both groups. For example:  
    - In the under-served group, a score triggering intervention might correspond to a 7% true readmission risk.  
    - In the higher-risk group, the same score might correspond to a 12% true risk.  
  - **Operational Consequence:** Clinicians and administrators may misinterpret risk scores when reviewing aggregate reports (e.g., "Why are Group A patients with score 0.2 readmitted less often than Group B?"). This could erode trust if not proactively communicated.  
  - **Resource Trade-off:** The follow-up program may be triggered slightly more often for the under-served group relative to their "true" risk, potentially increasing program costs.  

  ### 3. **Steelman of the Case for Calibration**  
  *The strongest argument for choosing calibration over equalized odds is as follows:*  
  > Calibration ensures clinical validity and operational efficiency. If a score of 0.15 means a 15% readmission risk for **all** patients, clinicians and systems can consistently act on that probability, regardless of population. Rejecting calibration introduces population-specific biases into the risk score itself, undermining evidence-based decision-making. In a system already strained by disparities, imposing *equal error rates* artificially inflates interventions for the under-served group (due to higher FPR) and under-protects the higher-risk group (due to higher FNR). This wastes limited resources where they are less needed while failing to address true risk where it is most acute. Calibration accepts that base rates differ and delivers unbiased probabilities—letting us target interventions precisely rather than forcing parity in errors.

  ---

  ### Why Equalized Odds Still Prevails  
  While the case for calibration is compelling in theory, our specific context tips the scales:  
  - **Hard Threshold + Legacy Under-Service:** Automated denial of follow-up for the under-served group (due to miscalibrated scores) would perpetuate inequity. Equalized Odds corrects for historical under-identification.  
  - **Ethical Imperative:** Equalizing errors prioritizes equitable care access over statistical purity. A "fair" probability estimate is meaningless if systematically underestimating risk for marginalized groups.  
  - **Mitigating the Cost:** We can address calibration loss through staff training ("Scores trigger interventions equitably but interpret absolute risk by population") and stratified reporting.  

  **Vote Recommendation:** Prioritize **Equalized Odds** to ensure equitable intervention access. We accept that scores lose universal interpretability but gain fairness in care delivery.  

  *Let’s discuss on Friday. Prepared with slides detailing error-rate trade-offs per group.*
