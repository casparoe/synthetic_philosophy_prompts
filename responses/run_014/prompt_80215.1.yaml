prompt: |-
  I'm a retired statistical physicist who has recently gotten into philosophy, and I'm currently taking a course on the philosophy of probability. I spent most of my career working with ensembles and Born-rule probabilities, so I'm comfortable with the idea of objective chance, but I'm new to the philosophical questions about how an agent's credences should relate to those chances. I keep coming back to the Principal Principle—the claim that your credence in a proposition should equal its objective chance, conditional on all your admissible evidence—and I find that the phrase "admissible evidence" is doing a lot of quiet work that nobody seems to pin down. What actually counts as admissible? What happens when your evidence includes information about your own current credences, or when it includes information about the chance function itself? I'd like you to write out the desiderata that any adequate theory of the credence-chance relationship must satisfy: the phenomena it has to explain, the cases it has to get right, the distinctions it cannot collapse, and the results it has to be consistent with, with the motivating case or consideration behind each requirement. I want to know which of these are non-negotiable and which are preferences of particular camps, and whether any subset of the desiderata turns out to be jointly unsatisfiable—if the list itself yields a result, I'd like to see it. Close with a brief scorecard of the main existing contenders against the list, but keep the weight on the criteria rather than the scoring. Please write the whole answer in American English.
reasoning: |-
  Okay, the user is a retired statistical physicist diving into the philosophy of probability. They're familiar with objective chances from their work but are now grappling with the Principal Principle, especially the vague term "admissible evidence." They want a structured breakdown of the criteria for any theory linking credence and chance, including must-haves versus optional preferences, potential conflicts, and a brief overview of how existing theories stack up.

  Hmm, their background suggests they'll appreciate precision but might need philosophical concepts unpacked. The frustration with "admissible evidence" being hand-wavy is palpable—they want rigor. I should clarify why admissibility is slippery: it's context-dependent (e.g., historical vs. future info), and the big tension is between respecting chances and avoiding self-undermining (like knowing you'll lose a coin toss). 

  The core desiderata should cover: (1) Chance-Guiding—credences must defer to known chances; (2) Synchronicity—how evidence at a time affects credence; (3) Learning—updating beliefs as chances change; (4) Self-Locating/Indexical cases (their physicist lens might overlook these); (5) Chance Self-Ascription—handling evidence about chance functions themselves; (6) Consistency—no Dutch books or probabilistic incoherence. 

  Key non-negotiables are Chance-Guiding and Consistency—without these, the whole framework collapses. Synchronicity and Learning are nearly essential but have wiggle room (e.g., what counts as "current"?). The trickiest conflict is Chance-Guiding vs. Chance Self-Ascription: if you know the chance function, does credence equal chance (per PP) or must it account for possible error? That's where theories diverge. 

  For contenders: Lewis's original PP fails on self-ascription (permits undermining); the New Principle fixes that but feels artificial; Actualist theories avoid abstract chances but struggle with determinism; Subjectivist-Bayesian approaches ditch objectivity entirely. The unresolved pain point is making admissibility both precise and flexible. 

  I’ll structure this as a philosopher’s toolkit—desiderata as axioms, highlight tensions, then score theories neutrally. Their expertise means I can skip basics but must flag where physics intuitions (e.g., ignoring indexicals) might mislead. Close by noting the field’s stalemate: we want chances to guide us, but they can’t be the *only* guide when evidence bites its own tail.
answer: |-
  Here’s a breakdown of the core desiderata for any theory of the credence-chance relationship, framed for your background. The goal is to systematize what such a theory *must* explain or accommodate, where tensions arise, and which demands are universally accepted versus contested.

  ---

  ### **Core Desiderata: What a Theory Must Handle**
  1.  **Chance-Guiding:**
      *   **Phenomenon:** Objective chance should rationally constrain rational credence when known.
      *   **Motivating Case:** A fair coin (Ch(H) = 0.5) about to be tossed. A rational agent's credence *Cr(H)* should be 0.5, absent defeating evidence.
      *   **Requirement:** The theory must entail that known chances generally guide rational credences (the core intuition behind the Principal Principle).
      *   **Status:** **Non-negotiable.** This is the *raison d'être* of the credence-chance link.

  2.  **Synchronicity:**
      *   **Phenomenon:** How evidence *at a specific time t* impacts credence in propositions about events at *t* or later, given knowledge of the chance at *t*.
      *   **Motivating Case:** You know Ch\_t(A) = x at time t. What is your Cr\_t(A | E), where E is evidence you possess at t?
      *   **Requirement:** The theory must provide a rule for setting credences synchronically (at a single time) based on known chances and *all* contemporaneous evidence.
      *   **Status:** **Non-negotiable.** Any functional theory must say what to believe *now* given what you know *now* about chances.

  3.  **Learning (Diachronic Coherence):**
      *   **Phenomenon:** How credences should update upon learning *only* that the chance of A is x.
      *   **Motivating Case:** Initially, you don't know the bias of a coin. You learn from a reliable source that Ch\_now(H) = 0.7. Your credence Cr(H) should become (or move towards) 0.7.
      *   **Requirement:** The theory must allow rational agents to update their credences directly upon learning chances, consistent with conditionalization where applicable.
      *   **Status:** **Near-universal.** Essential for a dynamic epistemology. Rejection requires a radical alternative account of learning chances.

  4.  **Future Contingency / History Admissibility:**
      *   **Phenomenon:** Information about events *after* time t seems irrelevant to setting credence in A at t based on Ch\_t(A).
      *   **Motivating Case:** (Lewis's Canonical Example) A fair coin (Ch\_t(H) = 0.5) is tossed at t. Learning the *outcome* (H or T) *after* t should not make your earlier credence Cr\_t(H) irrational if it was 0.5. Conversely, knowing the outcome *in advance* (e.g., a crystal ball showing H) *should* override setting Cr\_t(H) = 0.5.
      *   **Requirement:** The theory must distinguish "admissible" evidence (which can be conjoined with Ch(A)=x without changing Cr(A)) from "inadmissible" evidence (which overrides Ch(A)=x). Crucially, *historical* information up to t is typically admissible, while *future* information about outcomes is inadmissible.
      *   **Status:** **Non-negotiable Core Insight.** This is the primary function of "admissibility" in PP. However, *defining* admissibility precisely is the central challenge.

  5.  **Self-Locating / Indexical Evidence:**
      *   **Phenomenon:** Evidence locating the agent within the chance process itself.
      *   **Motivating Cases:**
          *   **The Prisoner:** One of 10 prisoners will be released by a fair lottery (Ch(release)=0.1). Should your credence that *you* will be released be 0.1? (Seems yes).
          *   **Doomsday / Cosmology:** Models predict 99% of humans will live in the far future. Does this knowledge make you 99% confident you live early? (Debated, but theory must handle the structure).
      *   **Requirement:** The theory must provide consistent guidance for credences involving indexical information ("I", "now", "here") in conjunction with objective chances.
      *   **Status:** **Crucial Test Case.** While less emphasized in early formulations, handling these cases is now seen as vital for adequacy. Failure here often reveals hidden problems.

  6.  **Chance Self-Ascription:**
      *   **Phenomenon:** Handling evidence that is *itself* about the chance function or its grounding.
      *   **Motivating Cases:**
          *   **Undermining Futures:** (Most Critical) In a Humean Best System Analysis (BSA) of chance, some possible future events are *inconsistent* with the current chance function being true. E.g., In a world governed by Ch(H)=0.5, it's *possible* (though improbable) that a coin lands heads 1000 times in a row. But if it *did*, the BSA might say the true chance was *not* 0.5! Knowing Ch(H)=0.5 *now* logically entails that such futures *won't* happen. Conditioning on Ch(H)=0.5 *plus* a full description of history up to t might leave no room for the chance statement itself if the future undermines it.
          *   **Chance as Evidence:** Learning "The chance of A is x" vs. learning the physical facts that *make it true* that the chance of A is x (e.g., the precise microstate in a deterministic world, or the BSA axioms+fit). Should Cr(A) be the same in both cases?
      *   **Requirement:** The theory must consistently handle situations where the agent's evidence includes propositions that describe, entail, or are entailed by the chance function itself. It must avoid contradictions or absurd credences (like Cr(undermining future | Ch\_t) = 0 while Ch\_t(undermining future) > 0).
      *   **Status:** **Critical Pressure Point.** This is where the naive PP often breaks down. A satisfactory theory *must* resolve this. Failure is fatal for Humean chances + PP.

  7.  **Consistency & Probabilistic Coherence:**
      *   **Phenomenon:** Rational credences must obey the axioms of probability.
      *   **Motivating Case:** Avoiding Dutch Books, ensuring credences across related propositions (A, ~A, A&B, etc.) sum correctly.
      *   **Requirement:** The credences prescribed by the theory, given any body of evidence, must form a probabilistically coherent credence function.
      *   **Status:** **Non-negotiable.** A normative theory of rationality requiring probabilistically incoherent credences is self-defeating.

  8.  **Compatibility with Determinism:**
      *   **Phenomenon:** Can objective chance exist (and guide credence) in a world governed by deterministic laws?
      *   **Motivating Case:** Statistical mechanics in a classical Newtonian universe. Is the probability (e.g., of gas molecules being in one half of a box) an "objective chance" that should guide credence? Or is it merely epistemic?
      *   **Requirement:** The theory should either (a) provide a coherent account of objective chance in deterministic settings compatible with the other desiderata, or (b) clearly explain why chance cannot exist in such settings *and* provide an alternative account of how credences should be set for the statistical probabilities involved.
      *   **Status:** **Contested but Important.** Humeans typically require (a). Non-Humeans (e.g., Primitivists, Propensitists) often lean towards (b), seeing chance as incompatible with determinism. Your physics background makes this especially relevant.

  ---

  ### **Tensions and Joint Unsatisfiability**
  The most significant tension arises between **Chance-Guiding (1)**, **Future Contingency/History Admissibility (4)**, and **Chance Self-Ascription (6)**, particularly under a **Humean (BSA) metaphysics of chance**:

  1.  **The Undermining Problem:** Naive PP (Cr(A | Ch\_t(A)=x & E) = x, if E admissible) + Humeanism seems to demand:
      *   `Cr(Undermining Future | Ch\_t(A)=x & History\_t) = x(Undermining Future)` (by PP, since History\_t is admissible).
      *   But `Cr(Undermining Future | Ch\_t(A)=x & History\_t) = 0` (because `Ch\_t(A)=x` *entails* that the undermining future won't occur, given Humeanism & History\_t).
      *   Unless x(Undermining Future) = 0 (which it isn't), this is a contradiction.
  2.  **The Conflict:** Satisfying Chance-Guiding (1) with History Admissibility (4) directly conflicts with Chance Self-Ascription (6) and Consistency (7) under Humeanism. `Ch_t(A)=x` *cannot* be treated as just another piece of admissible evidence when it logically constrains the future in a way its own probabilities don't guarantee.
  3.  **Result:** **No theory satisfying (1), (4), (6), and (7) is possible under standard Humean BSA without modification.** This is the core result driving revisions to the PP.

  ---

  ### **Scorecard of Main Contenders (Brief)**
  *(Focus on how they address the desiderata, particularly the tensions)*

  1.  **Lewis's Original Principal Principle (PP):**
      *   **Handles Well:** (1) Chance-Guiding, (2) Synchronicity (with admissibility), (3) Learning, (4) Future Contingency (via admissibility definition), (7) Coherence (if admissibility works).
      *   **Fails On:** (6) Chance Self-Ascription (Undermining), (8) Determinism (Lewis was anti-Humean about chance in deterministic worlds).
      *   **Admissibility:** Defined relative to time t: Admissible evidence at t is historical (about ≤t) or "explicitly about chances." Proves circular/too vague for (6).

  2.  **The New Principle (NP) / Lewis's Reformulation:**
      *   **Core Idea:** `Cr(A | H_t & T_w) = Ch_t(A | T_w)`, where `T_w` is the "complete chance theory" (laws + history) of world w.
      *   **Handles Well:** (1), (2), (3), (4) (implicitly), (6) (Undermining resolved: `Ch_t(A | T_w)` avoids entailment conflict), (7).
      *   **Faces Challenges:** (5) Self-Locating (Can be tricky with `T_w`), (8) Determinism (Same issues). Seems artificial/"gerrymandered." Requires knowing `T_w`, which is very strong.

  3.  **Actualist / Humean Approaches (e.g., Ismael, Loewer):**
      *   **Core Idea:** Ground chance directly in the *actual* pattern of events (or possible future continuations) from the current moment. "Chance is future frequency in best fit."
      *   **Handles Well:** (1), (2), (3), (6) (No undermining: Chance facts *supervene* on future facts), (8) Determinism (Can accommodate SM probabilities as chances).
      *   **Faces Challenges:** (4) Future Contingency (If chance *is* future frequency, how can future info be inadmissible? Requires careful formulation). (5) Self-Locating (Can be complex). Can feel less "objective" than PP/NP.

  4.  **Primitivist / Non-Humean Approaches (e.g., Bigelow, Mellor):**
      *   **Core Idea:** Chance is a fundamental, non-Humean property or propensity.
      *   **Handles Well:** (1), (2), (3), (4), (5) (Depends on theory), (6) (No undermining: Chance isn't constituted by future events), (7).
      *   **Faces Challenges:** (8) Determinism (Often denies chance exists deterministically). Metaphysically "queer" to some. Less parsimonious.

  5.  **Subjectivist-Bayesian Approaches (e.g., de Finetti):**
      *   **Core Idea:** Reject objective chance. "Chance" is just idealized rational credence (exchangeability).
      *   **Handles Well:** (2), (3), (7). Avoids (6), (8) entirely.
      *   **Fails On:** (1) Chance-Guiding (No objective chance to guide!). Rejects the core phenomenon motivating PP/NP. Unsatisfying for many scientific uses (e.g., SM).

  ---

  **Conclusion:** The essential non-negotiables are **Chance-Guiding (1)**, **Synchronicity (2)**, **Consistency (7)**, and the core insight behind **History/Future Admissibility (4)**. **Learning (3)** is also highly robust. The most significant challenge arises from **Chance Self-Ascription (6)**, particularly the undermining problem, which creates a fundamental tension with (1) and (4) under Humeanism. **Self-Locating (5)** and **Determinism (8)** are crucial test cases that differentiate theories. No current theory perfectly satisfies all desiderata to universal acclaim, with the choice often hinging on metaphysical commitments about chance (Humean vs. Non-Humean) and tolerance for complexity/artifice in resolving the undermining problem. Your physics intuition for ensembles and Born rule probabilities suggests favoring approaches that can robustly handle deterministic contexts (8) and the informational subtleties exposed by (6).
