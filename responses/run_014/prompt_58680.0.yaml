prompt: |-
  I serve as the director of food services for a mid-sized workplace cafeteria and am seeking guidance on a menu planning decision that has left me uncertain about how to interpret the choosing patterns we observe.

  Over the past quarter we systematically varied what was on offer and tracked selections. When the afternoon snack was a fruit cup versus a chocolate cookie, about two thirds of staff selected the fruit cup. When we added a third option, a deluxe chocolate brownie, very few staff selected the brownie, yet a substantial share of those who had previously selected the fruit cup now selected the cookie instead. We observed a second pattern with lunch pre-orders. When staff order in the morning for midday delivery, about seventy percent order the salad bowl over the burger. When we allow them to revise the order at noon, nearly half of the morning salad orders are switched to the burger. In a follow-up wellness check, many of those who switched report lower afternoon energy and say they wish they had stayed with the lighter meal, yet the same switching pattern repeats the following week. Staff also report in anonymous surveys that they feel more satisfied overall on days they eat lighter, while continuing under time pressure to select richer items in the moment.

  A colleague on the operations committee argues that our responsibility is straightforward: provide more of whatever is most frequently selected at the point of service, since what people select at a given moment is the most reliable evidence of what they want and of what would be good for them. I am hesitant. If adding an option that almost no one takes reverses choices between the other two, or if morning selections and noon revisions point in opposite directions, it is unclear what a momentary selection shows about what staff value on reflection or what would leave them better off. Should I treat the most frequent immediate selection as decisive for what to stock, give weight to advance orders or to reported satisfaction, or structure the options differently altogether, for example by retaining advance ordering without noon revision or by limiting the set on offer?

  I would appreciate advice on how to reason about this. Please explain what these patterns suggest about the relation between being selected, being wanted, and being beneficial, how I should interpret the shifts we see when the set of alternatives or the timing of the decision changes, and what menu policy would best serve the staff in light of that analysis.
reasoning: |-
  Okay, the user is a director of food services dealing with some perplexing menu choice patterns. Let me unpack what's happening. 

  First, the fruit vs cookie scenario is fascinating - adding an irrelevant brownie option somehow shifted people from fruit to cookie. That classic decoy effect in behavioral economics! People aren't rationally comparing absolute values but making relative judgments. The brownie made the cookie seem "safer" even though almost nobody chose it. 

  Then there's the time-inconsistency problem with pre-orders. Morning-future-self chooses salad, noon-present-self craves burger. And get this - people actually regret switching later! But they keep repeating the pattern. That's textbook hyperbolic discounting where immediate gratification overpowers long-term goals. 

  The colleague's "just give them what they click" approach worries me. It ignores how choice architecture manipulates decisions. People's clicks are contaminated by cognitive biases - the decoy effect, present bias, visceral hunger. The survey data proves they consistently prefer outcomes from healthier choices they don't make in the moment. 

  Hmm... the user's real struggle is ethical: should they enable healthy intentions or surrender to impulse? The wellness reports clearly show lighter meals leave people more satisfied. But forcing choices feels paternalistic. Maybe there's a middle path - preserve freedom while supporting better decisions? 

  What's unsaid but critical: this isn't just about food. It's about staff wellbeing impacting productivity. And the user's authority to shape environments that help people align actions with values. The silent plea is "how can I do right by my people without overstepping?" 

  For solutions, removing noon revisions respects morning decisions made rationally. Narrowing options prevents decoy effects. But the real win might be reframing "satisfaction" - anonymous surveys reveal it's not about taste in the moment but lasting energy and mood. That's the North Star for menu planning.
answer: |-
  Your observations reveal fundamental insights about human decision-making that should reshape your menu policy. Here's how to interpret the patterns and design a more effective approach:

  ### Decoding the Behavioral Patterns
  1. **The "Decoy Effect" (Brownie Paradox)**
     - Adding the brownie (a less popular option) altered preferences between existing choices. This demonstrates that selections aren't absolute but *relative to alternatives*. People use heuristics like "avoid extremes" (fruit = too healthy, brownie = too indulgent → cookie = "safe compromise").

  2. **Time-Inconsistent Preferences**
     - Morning pre-orders reflect **aspirational selves** (70% salad), while noon revisions reveal **present-biased impulses** (50% switch to burger). Post-meal regret ("I wish I chose salad") confirms this gap between short-term desires and long-term satisfaction.

  3. **The Satisfaction Paradox**
     - Anonymous surveys show staff *consistently report higher satisfaction* with lighter meals, yet persistently choose richer options when hungry. This highlights the **visceral-emotion gap**: biological drives (hunger, cravings) override reflective preferences.

  ### Why "Most Frequent Immediate Selection" is Flawed
  Your colleague's argument ignores that:
  - Choices are manipulated by option framing (as shown by the brownie effect)
  - Momentary decisions favor immediate gratification over genuine wellbeing
  - People systematically regret impulsive choices (per your wellness checks)

  ### Recommended Menu Policy Framework
  Apply behavioral science to support staff's long-term goals while respecting autonomy:

  | **Policy Element** | **Rationale** | **Implementation** |
  |-------------------|--------------|-------------------|
  | **Pre-Orders as Default** | Leverages "cool state" decision-making | Keep AM pre-ordering; **eliminate noon revisions** (removes impulse switching) |
  | **Simplified Choice Architecture** | Prevents decoy effects & decision fatigue | Offer only 2 snack options (e.g., fruit + one treat); rotate treats daily |
  | **Commitment Devices** | Bridges intention-action gap | "Wellness Pledge" option: Pre-commit to X salads/week for small perks |
  | **Satisfaction-Focused Nudges** | Aligns choices with reported wellbeing | Menu labels highlighting "Afternoon Energy Boost" meals based on survey data |
  | **Strategic Indulgence** | Acknowledges hedonic needs | Offer smaller, premium burger portions on certain days only |

  ### Key Structural Changes
  1. **Eliminate the Brownie Trap**: Never offer three similar-tier options. Use binary choices (healthy vs. treat) with occasional premium specials (e.g., Friday artisanal brownie) unrelated to daily snacks.

  2. **Lock Pre-Orders**: Disable lunch revisions. Staff who want flexibility can opt for walk-up service (separate line).

  3. **Redefine "Popularity" Metrics**: Prioritize **post-consumption survey scores** over selection rates. Stock items rated "high satisfaction" regardless of grab-rate.

  4. **Visceral State Buffers**: At noon decision points (e.g., walk-up line), offer samples of lighter options *before* ordering. Hunger diminishes rational choice.

  ### Why This Works
  By structuring choices to:
  - Reduce cognitive biases (decoy effect, present bias)
  - Honor reflective preferences (through pre-orders)
  - Make satisfaction-linked options salient

  You serve what people genuinely value (energy, wellbeing) rather than what fleeting impulses demand. This aligns with your role as a steward of staff welfare while maintaining choice autonomy.

  **Implement this for one quarter while tracking**: 
  - Afternoon productivity self-reports 
  - Snack/lunch satisfaction surveys 
  - Pre-order vs. walk-up choice divergence

  The data will likely confirm that supporting "future selves" yields higher wellbeing than capitulating to momentary cravings. Your ethical obligation isn't to maximize clicks at the register, but to facilitate choices people won't regret an hour later.
