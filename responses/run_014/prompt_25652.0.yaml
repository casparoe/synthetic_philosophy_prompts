answer: |-
  Here is a comprehensive list of desiderata for a theory of mental causation, detailing what any adequate account *must* explain or accommodate, the cases it must get right, the constraints it must respect, and the distinctions it cannot collapse. Each desideratum is motivated by core phenomena, arguments, or conceptual requirements within philosophy of mind and metaphysics.

  **Core Phenomena & Cases to Explain:**

  1.  **The Efficacy of Conscious Intentions:** The theory must explain how conscious mental states (e.g., my *intention* to raise my arm) can be causally responsible for corresponding physical outcomes (e.g., my arm rising).
      *   **Motivation:** The undeniable phenomenological experience of agency. Denying this feels like denying our own experience of acting in the world (*Libet cases* challenge timing but not the basic intuition of efficacy).

  2.  **The Efficacy of Unconscious/Subpersonal States:** The theory must explain how non-conscious mental states (e.g., beliefs, desires, perceptual representations triggering reflexes) can cause behavior or other mental states.
      *   **Motivation:** Much cognition and behavioral control occurs subpersonally (e.g., visual processing, habitual actions). A theory focusing only on conscious states is inadequate.

  3.  **Rationalizing Explanations (Reasons as Causes):** The theory must accommodate the intuition that we often explain actions by citing the agent's *reasons* (beliefs, desires, intentions), and these explanations seem genuinely causal (e.g., "She ran because she *wanted* to catch the bus and *believed* it was leaving").
      *   **Motivation:** The pervasiveness and apparent explanatory power of folk psychology. It feels like reasons *motivate* actions.

  4.  **Mechanistic Explanations:** The theory must be compatible with (or explain the relationship to) lower-level mechanistic explanations of behavior in terms of neural processes.
      *   **Motivation:** The undeniable success of neuroscience in tracing physical causal chains underlying behavior. Ignoring this is scientifically irresponsible.

  **Metaphysical Constraints:**

  5.  **Causal Closure/Completeness of the Physical (CCP):** The theory must respect the principle that every physical event has a sufficient physical cause (at the time it occurs, barring quantum indeterminacy). *Status:* **Widely considered a non-negotiable constraint** based on scientific practice.
      *   **Motivation:** The success and methodology of physics and other physical sciences. If physical effects could have fundamentally non-physical sufficient causes, physics would be either radically incomplete or false in ways unsupported by evidence. Denying CCP opens the door to problematic interactionist dualism.

  6.  **Non-Overdetermination Constraint:** The theory should avoid systematic causal overdetermination – where an effect has *two* distinct and independently sufficient causes (barring genuine coincidence, like two shooters).
      *   **Motivation:** Systematic overdetermination is metaphysically profligate and lacks empirical evidence. It seems like a bizarre coincidence if every action caused by a mental state also *just happened* to have a fully sufficient physical cause at the same time. Occam's Razor favors simpler explanations.

  7.  **Mental Irreducibility/Non-Identity Constraint:** The theory must accommodate the apparent fact that mental properties/states (especially intentional and phenomenal properties) are not identical to physical properties/states (e.g., multiple realizability).
      *   **Motivation:** Arguments like multiple realizability (pain can be realized by different neural substrates in humans, octopi, aliens) strongly suggest mental types ≠ physical types. Ignoring this leads to implausible type-identity theory.

  8.  **Downward Causation Requirement:** The theory must make sense of how mental states, often understood as "higher-level," can genuinely cause changes at the physical level ("downward").
      *   **Motivation:** Core to the very idea of mental causation – mental states cause physical behavior. Without downward causation, mental states seem epiphenomenal with respect to the physical world.

  **Crucial Distinctions to Respect:**

  9.  **Causation vs. Mere Counterfactual Dependence:** The theory must distinguish genuine causation from cases where B counterfactually depends on A, but A is not the cause (e.g., backup generators, preemption, epiphenomena).
      *   **Motivation:** Counterfactual dependence is necessary but not sufficient for causation. Examples: (a) *Backup:* The backup generator would have powered the hospital if the main failed, but the main didn't fail. The backup's state counterfactually depends on the main's, but didn't cause anything. (b) *Epiphenomenon:* A shadow counterfactually depends on the flagpole, but doesn't cause the flagpole's height. Collapsing causation and counterfactuals risks counting non-causes as causes.
      *   **What Turns on It:** Theories relying solely on counterfactuals (like some versions of interventionism) risk being too permissive.

  10. **Causation vs. Causal Explanation:** The theory must distinguish the metaphysical relation of causation from the epistemic/pragmatic practice of giving causal explanations (which might cite different features of the causal chain).
      *   **Motivation:** We can give different, equally true, explanations of the same event depending on context (e.g., explaining a fire by citing the short circuit, the oxygen presence, or the arsonist's motive). This doesn't imply multiple distinct *causes* in the metaphysical sense. Collapsing them risks conflating metaphysics with pragmatics.
      *   **What Turns on It:** Theories might try to preserve mental causation *only* at the level of explanation (e.g., as "difference-making") while denying it at the fundamental causal level. This distinction is crucial for evaluating such moves.

  11. **Mental-to-Mental vs. Mental-to-Physical Causation:** The theory must either provide a unified account of both types or justify treating them differently.
      *   **Motivation:** Mental states cause other mental states (e.g., a belief causing a new desire) and physical states (behavior). While related, the challenges (especially CCP and exclusion) are most acute for mental-to-physical causation. Can a theory solve one without solving the other? (E.g., epiphenomenalism denies mental-to-physical but allows mental-to-mental?).

  12. **Conscious vs. Unconscious Mental Causation:** The theory must either capture a potential difference in *how* conscious vs. unconscious states cause effects or justify treating them uniformly.
      *   **Motivation:** Conscious states seem intimately tied to rational agency and phenomenal experience, while unconscious states drive much automatic processing. Is the causal mechanism the same? Does consciousness add something causally relevant? (E.g., Block's access vs. phenomenal consciousness).

  13. **Rationalizing vs. Mechanistic Explanation:** The theory must explain the relationship between explaining *why* an action made sense (reasons) and explaining *how* it was physically produced (mechanism).
      *   **Motivation:** These seem like distinct modes of explanation with different norms (rational coherence vs. physical law). Must a theory *unify* them (e.g., show how reasons *are* mechanisms) or can it treat them as complementary perspectives operating at different levels? Collapsing them risks losing the normative dimension of rationality.

  14. **Causal Proportionality:** The theory must address the problem that mental causes often seem mismatched in granularity to their effects (e.g., was the cause of my scream the *pain* [fine-grained specific quale] or just *distress* [coarse-grained]? Was the cause of buying milk the *desire for milk* or the *desire for calcium*?).
      *   **Motivation:** Intuitions about the "right" level of description for causes. Ignoring proportionality can lead to claims of ubiquitous causation or problematic exclusion. Can the theory *solve* it (find the "right" level) or *dissolve* it (argue proportionality isn't a genuine constraint on causation)?

  **The Central Problem: The Exclusion Worry**

  15. **The Exclusion Problem:** The theory must resolve the tension arising from combining CCP (5), Non-Overdetermination (6), Mental Irreducibility (7), and Downward Causation (8). The argument suggests: If every physical effect (like behavior) has a sufficient physical cause (5), and mental causes are distinct from physical causes (7), then either the mental cause is redundant (epiphenomenal) or the effect is systematically overdetermined (violating 6). Therefore, genuine downward mental causation (8) seems impossible.
      *   **Status:** **Not a primary desideratum, but the critical challenge.** It's the conclusion of an argument applying constraints (5, 6, 7) to the demand (8). A theory *resists* the exclusion worry precisely by rejecting one of its premises or the inference, thereby satisfying the core desiderata without contradiction. Its presence highlights the tensions within the list.

  **Flagging Tensions and Incompatibilities:**

  The desiderata generate significant tension. **The core locus of incompatibility lies between:**

  *   **Causal Closure of the Physical (5):** Demands physical sufficiency.
  *   **Non-Overdetermination (6):** Demands no systematic redundant causes.
  *   **Mental Irreducibility (7):** Demands mental causes ≠ physical causes.
  *   **Downward Causation (8):** Demands mental causes have physical effects.

  **The Exclusion Worry (15) *is* the manifestation of this tension.** Holding (5), (6), and (7) seems to directly contradict (8). Any theory must reject or significantly reinterpret at least one of these four to achieve consistency.

  *   **Eliminativism:** Rejects (3, 7, 8) - denies mental states exist or have causal powers.
  *   **Reductive Physicalism (Type Identity):** Rejects (7) - claims mental states *are* physical states, dissolving the tension. Conflicts with multiple realizability.
  *   **Non-Reductive Physicalism (e.g., Supervenience):** Typically challenges how (5) and (6) are applied or interpreted. May argue mental causes are not *distinct sufficient causes* but rather *realize* or *constitute* the physical cause (challenging 6/7 distinction), or that mental properties are causally relevant via their physical realizers (challenging the exclusion inference).
  *   **Overdetermination:** Rejects (6) - accepts systematic overdetermination. Seen as implausible.
  *   **Interactionist Dualism:** Rejects (5) - denies causal closure. Seen as scientifically untenable.
  *   **Causal Exclusion via Explanation:** May accept physical causation is fundamental but argue mental states provide essential causal *explanations* (leveraging 10), effectively sacrificing robust (metaphysical) downward causation (8).
  *   **Revisionism about Causation:** Rejects standard interpretations of causation underlying (5), (6), and the exclusion argument (e.g., process theories, difference-making views, powers-based views).

  **Conclusion on Joint Satisfiability:**

  No theory can satisfy *all* desiderata *in their strongest, most intuitive interpretations* without significant revision. The tension between Physical Closure (5), Non-Overdetermination (6), Mental Irreducibility (7), and Downward Causation (8) is fundamental. **The minimal revision necessary to restore consistency involves rejecting or fundamentally reinterpreting one of these four core constraints.**

  *   **Most Common Revisions:**
      *   Reject Mental Irreducibility (7) via reductionism (sacrificing multiple realizability).
      *   Reinterpret Downward Causation (8) as non-fundamental (e.g., realized in/identical to physical causation, or only explanatory).
      *   Reinterpret Non-Overdetermination (6) as not violated by certain part-whole or realization relations.
      *   Weaken Causal Closure (5) to allow non-physical *influence* without violating physical law (rare, usually dualist).
      *   Reject the standard "sufficient cause" model of causation underlying the exclusion argument (e.g., adopt a powers ontology, process view, or context-sensitive difference-making view).

  The adequacy of any theory of mental causation hinges on how convincingly it navigates these tensions and justifies its chosen revision(s) while accommodating as many of the other desiderata (1-4, 9-14) as possible. The desiderata list itself reveals why mental causation is a "hard problem": it sits at the intersection of metaphysics, philosophy of science, philosophy of mind, and action theory, pulling in seemingly conflicting directions.
