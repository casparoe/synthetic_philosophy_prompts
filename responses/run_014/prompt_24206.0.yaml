  Okay, the user is a philosophy professor designing a final essay question for a senior seminar. They want a question that pushes students beyond surface-level understanding of Bernard Williams' integrity objection to utilitarianism. Specifically, they want students to: 

  First, recognize that the objection relies on Williams' internalist view of reasons (where reasons must connect to the agent's subjective motivations). Second, explore how rejecting internalism (allowing "external reasons" unrelated to one's motivations) changes the force of the objection. Third, consider whether the objection truly refutes consequentialism or just highlights a psychological conflict.

  The challenge is crafting a question that prevents students from coasting on rehearsed examples (like George the chemist or Jim and Pedro) or definitions of integrity. It must force independent analysis of the internalism-externalism debate's implications.

  Hmm... the user clearly wants to test deeper philosophical methodology—seeing if students can trace how metaethical commitments (like theories of reasons) shape normative conclusions. Senior students should be capable of this. The model answer needs to demonstrate: 

  - Clear explanation of how the integrity objection presupposes internalism  
  - Precise articulation of what happens if we adopt externalism instead  
  - Nuanced evaluation of whether this is a fatal blow to consequentialism or merely a practical tension  

  For the marking scheme, I'll focus on six key points where students typically stumble: conflating internalism/externalism, missing the "contingent psychology" point, or failing to separate the objection's structure from its examples. The A/B distinction should hinge on whether they grasp how externalism dissolves the "alienation" problem entirely. 

  *Structuring the response*:  
  The exam question will directly name internalism/externalism to force engagement. The model answer will avoid examples to stay meta-theoretical. Marks will be split between diagnosing the dependency (15 marks) and evaluating the objection's scope (15 marks).  

  *Potential pitfalls*:  
  - Students might waste words describing Williams' cases despite instructions. The question must explicitly forbid this.  
  - Weak answers may treat "contingent psychology" as an afterthought rather than a core limitation.  
  - The model answer must show how externalism makes the "one thought too many" critique incoherent.  

  *Final checks*:  
  Word count is tight—keep question under 50 words, model answer lean, marking scheme efficient. Ensure the A/B differentiator is sharp: "Recognizes alienation presupposes internalism" vs. "merely notes the conflict."
answer: |-
  ### (1) Exam Question (90 Minutes)
  "Williams' integrity objection claims consequentialism demands 'one thought too many', alienating the agent from their projects by requiring justification via impersonal calculation. Explain precisely why this objection *depends* on Williams’ internalist theory of reasons (where reasons must link to the agent's 'subjective motivational set'). Then, analyze how rejecting internalism (allowing genuine 'external reasons' unrelated to the agent’s motivations) potentially undermines the force of this objection. Finally, evaluate whether the integrity objection, *even if successful on Williams’ own internalist terms*, definitively refutes consequentialism, or merely demonstrates a tension between consequentialism and a contingent feature of human psychology (our deep attachments). Do *not* discuss specific examples like George or Jim; focus on the underlying theoretical structure."

  ### (2) Model Answer (Approx. 600 Words)
  Williams' integrity objection argues that consequentialism, by requiring agents to justify all actions—including deeply personal commitments—through an impartial, maximizing calculus, creates a problematic alienation. The agent must hold a "one thought too many": a thought distancing them from their core projects by subordinating them to an external standard. However, this objection’s core logic is inextricable from Williams’ internalism about reasons.

  Internalism asserts that for a consideration to be a genuine *reason* for an agent to act, it must be capable of motivating them via a sound deliberative route from their existing "subjective motivational set" (S-set)—their desires, projects, and commitments. Alienation arises precisely because the consequentialist demand appears as a reason *external* to the agent's S-set, forcing them to adopt a perspective foreign to their identity-conferring attachments. The "one thought too many" is alien *because* it doesn't stem from, and may actively conflict with, the motivations constituting the agent's integrity. Without internalism, the charge of alienation loses its grounding; it presupposes that reasons failing to connect motivationally are defective or inauthentic.

  Rejecting internalism and allowing for genuine external reasons (reasons existing independently of an agent's current motivations) fundamentally challenges the objection. If consequentialism provides valid external reasons—perhaps grounded in objective value or impartial obligation—then the demand for impartial calculation *is* a genuine reason for action, regardless of its motivational connection to the agent's S-set. While acting on such reasons might still *feel* alienating or psychologically difficult if they clash with the agent's attachments, this difficulty is no longer a philosophical flaw inherent to consequentialism itself. It becomes a psychological friction, not a proof of the reason's invalidity. The objection, reliant on the internalist claim that alienation indicates a defective reason, collapses if external reasons are possible. The "one thought too many" might be motivationally uncomfortable, but it is no longer conceptually problematic *as a reason*; it might simply be the *correct* thought an agent *ought* to have, even if they struggle to internalize it.

  Even assuming internalism and granting the objection successfully identifies a real tension for agents with strong personal commitments, it does not necessarily *refute* consequentialism. At best, it shows that consistently acting as a consequentialist agent *on Williams' internalist view* requires a radical revision or suppression of deeply held personal projects that normally constitute integrity. This, however, highlights a contingent psychological conflict, not a logical or normative contradiction within consequentialism. Consequentialism could still be the correct theory of the *right*, prescribing what agents *ought* to do, even if fulfilling that prescription is psychologically taxing or requires significant self-transformation for beings like us, who develop integrity through particularistic attachments. Williams' objection demonstrates that consequentialism may demand a form of agency potentially at odds with deep-seated features of *human* psychology and our typical ways of valuing. But it does not prove consequentialism generates false moral judgments or is incoherent; it primarily shows that living as a consequentialist might be existentially difficult or require sacrificing a valued aspect of the human condition as Williams conceives it. The objection thus identifies a profound psychological cost, not a fatal theoretical flaw.

  ### (3) Marking Scheme (Total: 30 Marks)

  **Must-Hit Points:**

  1.  **(4 marks) Articulates the dependency:** Clearly states the integrity objection's reliance on internalism (alienation occurs *because* the consequentialist thought is not rooted in/motivationally linked to the S-set).
      *   *Common Error:* Vaguely links integrity and reasons without explaining *why* alienation implies a defective reason under internalism.
  2.  **(5 marks) Explains the externalist challenge:** Accurately explains how allowing external reasons severs the link between alienation and reason-defectiveness (alienation becomes mere psychological friction, not proof the reason isn't valid).
      *   *Common Error:* States externalism allows "different reasons" but fails to show how this directly invalidates the *core logic* of the alienation charge.
  3.  **(5 marks) Distinguishes reason validity from motivation:** Clearly separates the *validity* of a reason (under externalism) from the *psychological difficulty* of acting on it when it conflicts with attachments.
      *   *Common Error:* Conflates having an external reason with it being motivationally effective or easy to act upon.
  4.  **(4 marks) Grants the tension on internalist terms:** Concedes that, *if internalism is true*, the objection successfully shows a tension between consequentialist agency and maintaining integrity (understood as acting from S-set commitments).
      *   *Common Error:* Overstates the objection's success or dismisses it entirely even under internalism.
  5.  **(6 marks) Evaluates scope (contingency vs. refutation):** Argues clearly that the objection, even if successful under internalism, shows a *psychological conflict* (cost of adhering to consequentialism for beings with deep attachments), not a *refutation* (proof consequentialism is false or incoherent).
      *   *Common Error:* Assumes demonstrating psychological difficulty or cost equates to proving the theory normatively incorrect.
  6.  **(6 marks) Structure & Clarity:** Answer is well-organized, logically progresses through dependency, challenge, and evaluation, uses precise philosophical terminology, avoids examples, and stays focused on theoretical structure.
      *   *Common Error:* Unfocused, descriptive rather than analytical, lapses into discussing George/Jim, or uses terms loosely (e.g., "integrity" without linking to S-set/reasons).

  **A vs. B Answer Differentiation:**

  *   **An A Answer (24-30 marks)** must **explicitly articulate and leverage the core move:** Recognizing that under externalism, the *very concept of "alienation" as a critique of the reason itself* dissolves; alienation becomes a contingent psychological state irrelevant to the reason's validity. It must also **clearly separate** the normative claim of consequentialism (what is right) from the psychological cost of compliance.
  *   **A B Answer (18-23 marks)** will correctly identify the dependency on internalism and the challenge from externalism but may **not fully exploit the dissolution of the alienation critique under externalism**, perhaps treating alienation under externalism as still somewhat problematic for the theory. It may also **blur the line** between psychological difficulty and normative refutation in the final evaluation.
