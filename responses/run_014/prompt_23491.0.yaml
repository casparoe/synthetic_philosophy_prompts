  The user mentions two scenarios. The first is where we know all possible outcomes and their values but don't know which outcome will result from our actions. The second is where some outcomes can't even be compared in value; they're incomparable. I need to clearly distinguish these two.

  For case (i), it's about ignorance despite a complete ordering. Like knowing all the chess moves but not knowing the opponent's strategy. Here, expected value maximization might help. By assigning probabilities, we can calculate which action has the highest expected value. But the problem is the butterfly effect—tiny actions might have huge, unpredictable consequences. So even with probabilities, it's tough.

  For case (ii), it's not just about not knowing; it's that some values can't be compared. Like choosing between saving an artwork or a life—they might be on different scales. Here, expected value doesn't work because you can't assign meaningful probabilities or utilities. Consequentialists might need different strategies, like avoiding dominated options where one choice is worse in all scenarios.

  The user wants to know why the distinction matters. In case (i), responses like expected value or satisficing (doing what's good enough) can help. But in case (ii), those don't apply. Instead, they might use multi-dimensional decision rules or accept some indeterminacy. The force of the objection is stronger in case (ii) because even with perfect information, decisions can't be made.

