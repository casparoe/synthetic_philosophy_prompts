  For their tolerance argument - smart of them to question this link! The doctrine does encourage openness epistemologically, but the leap to social tolerance isn't automatic. Historically, Jains used it to defend their views against others as much as for pluralism. I should note that while their interpretation is valid, it's not the only possible reading. The metaphysical commitment to complex reality could theoretically justify dogmatism too ("my view captures more perspectives"). But their reading aligns well with modern applications.

