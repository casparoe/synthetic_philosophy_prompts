prompt: |-
  I am trying to decide what would count as a successful formal account of *heuristic estimation* in mathematics — the reasoning that supports claims such as "there should be about x/(log x)² twin primes below x" without proving anything — and before committing to a framework I want the specification rather than the candidates.

  Set-up, so that we are discussing the same object. Take a heuristic estimator to be a procedure that, given a claim about a fixed mathematical structure together with whatever background information the agent possesses, outputs a numerical estimate or probability along with a warrant for it, and is obliged to revise the estimate when further relevant information turns up. Its central engine is what has come to be called the presumption of independence: in the absence of specific information about the correlation between two quantities, default to E[XY] = E[X]E[Y]. That default is what makes the twin-prime estimate come out at all, and it is equally what misfires when the quantities are correlated by construction.

  Write the desiderata for such a framework. For each requirement, give three things: the requirement itself; the concrete case that motivates it, in enough mathematical detail that I can check whether the case really has the force you claim; and a label saying whether it is non-negotiable, negotiable, or a preference of a particular camp — and if it is the latter, which camp is smuggling it in (analytic number theorists organizing their own practice, logicians wanting a semantics, people who want an estimator an automated system could rely on when it cannot check the answer). I am as interested in the demands that look reasonable but are not genuine requirements as in the ones that are.

  Make sure the list is tested against the following sorts of cases, adding others you think sharper:

  - the move from the naive x/(log x)² to the Hardy–Littlewood constant times that quantity, i.e. what the framework must do with local obstructions and the singular series, and what it takes for a correction factor to be principled rather than fitted;
  - Maier's result on irregularities in the distribution of primes in short intervals, which contradicts what Cramér's random model predicts, and Granville's proposed replacement constant 2e⁻ᵞ — what has to be true of an estimate for a theorem to *refute* it, as opposed to merely informing it;
  - the Cohen–Lenstra prediction for class groups of imaginary quadratic fields, where the weighting by 1/|Aut(A)| shows the natural measure is not the naive uniform one;
  - random-matrix predictions for the moments of the zeta function on the critical line, whose warrant is structural analogy rather than any independence assumption — must a framework cover these, or is it entitled to exclude them, and what does it lose either way;
  - the Erdős–Kac theorem, as a case where a heuristic became a theorem, and the question of what the framework should say about the relation between the two;
  - multiplying local densities when a global obstruction of the Brauer–Manin type is present, so that a variety has points everywhere locally and none globally;
  - sparse sequences such as n!+1, where treating the object as a random integer of its size ignores that it is by construction coprime to every prime up to n — a case whose whole difficulty is deciding which background facts count as specific information about correlation;
  - claims like the expected finiteness of Fermat primes, where the predicted counts are so small that no amount of computation can corroborate or falsify them.

  Then the part I most want: identify any subset of your requirements that you believe cannot be jointly satisfied, and argue it, rather than reporting that there are tensions. One genuine impossibility in the list is worth more to me than ten requirements that any sufficiently vague framework could meet. Be explicit about whether coherence conditions of the usual kind — no endorsement of contradictions, additivity, invariance under logically equivalent reformulation of the same claim — can be had together with an estimator that does not already have to settle the questions it is estimating, and about what the probabilities in such a framework are probabilities of, given that the integers are a fixed structure with no chance in them.

  Finally, name the single requirement that does the most to exclude candidate frameworks, and close with a short verdict — two or three sentences each, no survey — on three families: concrete random models of the integers in the Cramér tradition; formal coherence-based approaches that build consistency and additivity into the estimator by construction; and the working mathematician's practice of singular series plus local corrections with no semantics attached at all.

  State wherever the list depends on the purpose I have fixed, and what would drop out if the framework only had to organize expert practice rather than be trusted by an agent unable to verify the result. I do not want references, a bibliography, or a reading list; I want the reasoning.
reasoning: |-
  We are designing a framework for heuristic estimation in mathematics. The core idea is the "presumption of independence": in the absence of specific information about correlation, we assume independence. This leads to estimates like the twin prime count, but can fail when there are hidden correlations.

  The framework must handle:
  - Revision with new information
  - Output of a numerical estimate or probability with a warrant
  - The central engine: E[XY] = E[X]E[Y] by default

  We want desiderata (requirements) for such a framework. For each requirement, we provide:
  1. The requirement itself.
  2. A concrete mathematical case that motivates it (with enough detail).
  3. A label: non-negotiable, negotiable, or a preference of a particular camp (and which camp).

  We test against the provided cases and add others if necessary.

  After listing requirements, we identify any subset that cannot be jointly satisfied and argue why. Then, we name the requirement that most excludes candidate frameworks. Finally, we give short verdicts on three families of approaches.

  We also note dependencies on the purpose: organizing expert practice vs. being trusted by an unverified agent.

  Let's begin.

  ---

  **Desiderata for a Framework of Heuristic Estimation**

  1. **Requirement: Default Independence**
     - *Description*: The framework must, by default, assume that two events or quantities are independent unless there is specific information indicating correlation.
     - *Motivating Case*: Twin prime conjecture. The events "n is prime" and "n+2 is prime" are treated as independent in the absence of information about divisibility by small primes. This leads to the estimate π₂(x) ~ C x/(log x)², where C is the twin prime constant (product over odd primes p of (1-1/(p-1)^2)). Without this default, we wouldn't get off the ground.
     - *Label*: Non-negotiable. This is the core engine.

  2. **Requirement: Incorporation of Local Obstructions (Singular Series)**
     - *Description*: The framework must be able to adjust the default independence by accounting for local obstructions (e.g., modulo small primes) via correction factors that are derived from the structure of the problem.
     - *Motivating Case*: The Hardy-Littlewood k-tuple conjecture. The constant C above is not arbitrary but comes from an Euler product that accounts for the correlations modulo each prime. The correction is principled because it comes from the requirement that the tuple avoids residue classes forbidden by divisibility. Without this, we have only the naive estimate.
     - *Label*: Non-negotiable. Without this, the framework would be too naive and fail in many cases.

  3. **Requirement: Responsiveness to Contradictory Evidence**
     - *Description*: When a theorem is proven that contradicts the current heuristic estimate, the framework must be able to revise the estimate (or the warrant) in light of the new information.
     - *Motivating Case*: Maier's theorem on primes in short intervals. Cramér's model (which assumes independence) predicts that the maximum gap between consecutive primes up to x is O((log x)^2). However, Maier showed that there are intervals of length (log x)^λ for λ>2 with significantly more or fewer primes than expected. Granville then proposed a new model with constant 2e^(-γ) replacing 1 in some bounds. The framework must be able to replace the old model with the new one when such a result appears.
     - *Label*: Non-negotiable. Without this, the framework would be dogmatic.

  4. **Requirement: Non-Uniform Weighting by Symmetry**
     - *Description*: The framework must allow for non-uniform probability distributions when there is symmetry (e.g., automorphism groups) that makes some objects more "natural" than others.
     - *Motivating Case*: Cohen-Lenstra heuristics for class groups of imaginary quadratic fields. The heuristics assign a weight of 1/|Aut(A)| to each finite abelian group A, which is not uniform. This is motivated by the fact that when counting isomorphism classes, each class should be weighted by the reciprocal of the number of automorphisms (as in the mass formula). The naive uniform distribution would be incorrect.
     - *Label*: Non-negotiable for number theorists. This is a key feature in algebraic contexts.

  5. **Requirement: Structural Analogy Without Independence**
     - *Description*: The framework must accommodate heuristics that are based on structural analogies (e.g., with random matrix theory) even when they do not rely on the independence assumption.
     - *Motivating Case*: Random matrix theory predictions for moments of the Riemann zeta function. The moments are conjectured based on an analogy with the characteristic polynomials of random unitary matrices, not by assuming independence of factors. The warrant is the similarity of the structure of the zeta function to that of random matrices (e.g., the distribution of zeros). The framework must not force independence when it isn't present.
     - *Label*: Non-negotiable for a comprehensive framework. Excluding these would leave out major heuristics.

  6. **Requirement: Convergence of Heuristic to Theorem**
     - *Description*: When a heuristic estimate becomes a theorem, the framework must be able to reflect that the heuristic has been confirmed and no longer requires revision (unless new counter-evidence appears). Also, the framework should account for why the heuristic was successful.
     - *Motivating Case*: Erdős–Kac theorem. The heuristic that the number of prime factors of a number is approximately normal (with mean log log n and variance log log n) was made rigorous. The framework should be able to show that the independence assumptions (or suitable modifications) in the heuristic were justified and led to a proof.
     - *Label*: Non-negotiable. This is a success story.

  7. **Requirement: Global Obstruction Recognition**
     - *Description*: The framework must not predict the existence of global objects (e.g., rational points) when there is a global obstruction, even if local conditions are satisfied.
     - *Motivating Case*: Brauer–Manin obstruction. For some varieties, there are points everywhere locally (over every completion) but no global rational point. The heuristic must not simply multiply local densities and conclude a positive probability. Instead, it must recognize the obstruction (e.g., via cohomology) and set the global probability to 0.
     - *Label*: Non-negotiable. Without this, the framework would be incorrect in arithmetic geometry.

  8. **Requirement: Sensitivity to Sparse Sequences**
     - *Description*: The framework must not ignore background information that makes an event extremely rare or impossible (by construction) when such information is available.
     - *Motivating Case*: Primality of n!+1. If we treat n!+1 as a random integer of its size, we would ignore that it is coprime to all primes ≤ n. Therefore, the probability of it being prime is higher than for a typical number. The framework must incorporate this background information and adjust the independence assumption accordingly.
     - *Label*: Non-negotiable. Ignoring such information leads to grossly inaccurate estimates.

  9. **Requirement: Handling of Vanishingly Small Predictions**
     - *Description*: The framework must be able to assign extremely small probabilities (or expected counts) in a meaningful way, even when the event is so rare that empirical verification is impossible.
     - *Motivating Case*: Fermat primes. The expected number of Fermat primes beyond the known ones is finite and very small. The heuristic (based on the prime number theorem and the form 2^(2^n)+1) gives a convergent series for the expected count. The framework must not break down when the expected count is less than 1 and must allow for the possibility of finiteness.
     - *Label*: Non-negotiable. Many important heuristics involve such predictions.

  10. **Requirement: Coherence**
      - *Description*: The framework must enforce coherence (no contradictions, additivity, invariance under logical equivalence) in the probability assignments.
      - *Motivating Case*: Without coherence, the same claim could be assigned different probabilities depending on how it is stated. For example, the probability that a random integer is even should be 1/2, and the same for the event that it is divisible by 2. Also, the probability of a disjunction of mutually exclusive events should be the sum of the probabilities.
      - *Label*: Non-negotiable for automated systems and logicians. However, in practice, mathematicians might tolerate some incoherence if the heuristics are useful.

  11. **Requirement: Non-Dogmatism**
      - *Description*: The framework must not require that the heuristic estimate be the final word; it must be subject to revision with new mathematical information.
      - *Motivating Case*: Any of the above cases where new theorems (like Maier's) force a revision. The framework must be open to updating.
      - *Label*: Non-negotiable.

  12. **Requirement: Computability**
      - *Description*: The framework must be computable in the sense that the heuristic estimates can be effectively calculated (at least in principle) for any given input.
      - *Motivating Case*: The Hardy-Littlewood constants are computable via an Euler product. Without computability, the framework would be purely abstract and not useful for generating estimates.
      - *Label*: Preference of automated systems. Mathematicians might accept non-computable heuristics if they are insightful.

  13. **Requirement: Warrant Transparency**
      - *Description*: The framework must provide a clear warrant (justification) for the estimate, explaining which assumptions were made and which background information was used.
      - *Motivating Case*: When moving from the naive twin prime estimate to the Hardy-Littlewood constant, the warrant is the adjustment for local correlations. Without a warrant, the estimate is just a number.
      - *Label*: Preference of automated systems and logicians. Mathematicians might rely on intuition.

  ---

  **Testing against additional cases (from the list):**

  - We have covered all the provided cases in the above requirements.

  ---

  **Impossibility Argument:**

  We now argue that the following two requirements cannot be jointly satisfied:

  - **Requirement 10 (Coherence)**: The framework must enforce coherence (additivity, invariance, etc.)
  - **Requirement 1-9,11,12,13**: The framework must be responsive to mathematical information and produce non-trivial estimates without settling the truth.

  **Why?** 

  In the context of a fixed mathematical structure (like the integers), the truth values of statements are fixed. A coherent probability assignment (in the sense of a finitely additive probability measure) that respects logical equivalence and is non-dogmatic (i.e., can be updated) must eventually assign probability 1 to true statements and 0 to false ones. This is because if we have a complete set of axioms (like for the theory of natural numbers) then any statement is either provable or refutable. But even without that, if we require that the probability assignments be coherent and invariant under logical equivalence, then by the principle of logical omniscience, the probability must respect all logical consequences. This means that if a statement is true, then it must have probability 1. But then the framework would have to know the truth value of every statement, which is impossible (by undecidability) and also defeats the purpose of heuristic estimation (which is to estimate when we don't know the truth).

  Moreover, the requirement of non-dogmatism (updating) pushes the framework towards the truth as more information is added. But if we require that the framework be coherent at every step, then the only way to avoid logical omniscience is to assign probability 1 to every provable statement and 0 to every refutable one. But then the framework must already know which statements are provable or refutable, which it cannot in general.

  Therefore, we cannot have both:

  - Full coherence (including logical omniscience) and 
  - Non-trivial heuristic estimates (without settling the truth) for undecided statements.

  This is the central impossibility.

  **What to do?** 

  We must relax coherence. We can require coherence only with respect to the agent's current knowledge (so that the probability assignment is coherent given the background information at hand) and allow updating. This is the Bayesian approach. But even then, the background information might include mathematical facts that force the truth of some statements, and the agent must assign probability 0 or 1 accordingly. For unproven statements, the agent uses the heuristic. However, this does not fully escape the problem because the agent must assign probabilities to all statements, and the assignment must be coherent with the entire body of mathematical knowledge (which is impossible without omniscience).

  In practice, we can restrict to a limited set of statements and background information, and require coherence only within that set. But that is not fully general.

  **Consequence:** 

  We must either:

  - Give up on full logical coherence and allow the heuristic to be inconsistent with some logical consequences (until they are discovered), or 
  - Accept that the probabilities are not about the fixed structure but about the agent's state of knowledge (and hence subjective).

  ---

  **The Most Excluding Requirement:**

  The requirement that does the most to exclude candidate frameworks is **Requirement 10 (Coherence)**. It forces the framework to be a consistent probability measure, which then runs into the logical omniscience problem. Without coherence, we can have ad hoc heuristics (like current mathematical practice) but then we lose the ability to trust the estimates in a principled way.

  ---

  **Verdicts on Three Families:**

  1. **Concrete Random Models (Cramér tradition):**
     - *Verdict*: These models (like Cramér's random model for primes) satisfy many requirements (default independence, incorporation of local obstructions via adjustments, non-uniform weighting is possible) but fail at global obstructions (e.g., Brauer-Manin) and structural analogies (like random matrix theory). They are also not coherent in the logical sense. They are good for organizing expert practice but may mislead in automated systems when global constraints are present.

  2. **Formal Coherence-Based Approaches (e.g., Bayesian epistemology):**
     - *Verdict*: These enforce coherence and additivity by construction, which is good for automated systems, but they run into the logical omniscience problem and cannot assign non-trivial probabilities to undecided mathematical statements without violating coherence. They may be too rigid to incorporate structural analogies (like random matrix theory) without ad hoc adjustments.

  3. **Working Mathematician's Practice (singular series plus local corrections):**
     - *Verdict*: This is flexible and responsive to new mathematical results, and it handles local obstructions and non-uniform weighting well. However, it lacks a clear semantics and is not coherent in a formal sense. It ignores global obstructions in some cases (like Brauer-Manin) and does not provide a warrant beyond "it works in many cases". It is excellent for expert practice but not suitable for an automated system that must generate estimates without expert intuition.

  ---

  **Dependency on Purpose:**

  - If the framework is only for organizing expert practice, then **Requirement 10 (Coherence)** and **Requirement 12 (Computability)** can be relaxed. Experts can tolerate some inconsistency and non-computable constants if the heuristics are insightful. Also, **Requirement 13 (Warrant Transparency)** is less critical because experts can supply the warrant from their knowledge.
  - However, for an automated system (that must be trusted without verification), **Requirement 10 (Coherence)** becomes critical to avoid contradictions, and **Requirement 12 (Computability)** is essential. Also, **Requirement 13 (Warrant Transparency)** is necessary so the system can explain its estimate.

  ---

  **Final Note:**

  The framework must choose between being a tool for organizing expert knowledge (which is flexible but informal) and being a system for automated estimation (which requires formality and coherence). The impossibility of full coherence without logical omniscience makes the latter extremely challenging.
answer: |-
  ### Desiderata for a Formal Framework of Heuristic Estimation

  The framework must satisfy the following requirements, motivated by concrete mathematical cases. Each requirement is labeled as **non-negotiable** (essential for any viable framework), **negotiable** (desirable but adaptable), or **camp-specific** (tied to a user group's goals: **AN** = analytic number theorists, **Log** = logicians, **Auto** = automated systems).

  1. **Default Independence**  
     - *Requirement*: The framework must default to assuming independence for uncorrelated events, i.e., \( \mathbb{E}[XY] = \mathbb{E}[X]\mathbb{E}[Y] \) absent specific correlating information.  
     - *Case*: Twin prime conjecture. Naively, \( \mathbb{P}(n \text{ and } n+2 \text{ prime}) \approx (\log n)^{-2} \) by treating primality as independent events. This yields \( \pi_2(x) \sim x/(\log x)^2 \), foundational but incomplete.  
     - *Label*: **Non-negotiable**. Without this, no estimation occurs.

  2. **Local Correction Factors**  
     - *Requirement*: The framework must incorporate local obstructions via correction factors (e.g., singular series) that are derived *principledly* from the problem’s structure, not fitted ad hoc.  
     - *Case*: Hardy–Littlewood constant for twin primes. For residue classes modulo small primes \( p \), the correction \( C_2 = \prod_{p>2} (1 - (p-1)^{-2}) \) accounts for forbidden residues. The factor is principled because it solves for the density of \( (n, n+2) \) avoiding residue \( 0 \pmod{p} \) for all \( p \).  
     - *Label*: **Non-negotiable**. Ad hoc fitting invalidates the framework.

  3. **Refutability by Theorems**  
     - *Requirement*: A theorem contradicting a heuristic must force revision or abandonment, not mere "updating." Refutation requires the theorem to directly challenge the core warrant (e.g., independence).  
     - *Case*: Maier’s theorem refutes Cramér’s model. Cramér assumes gaps between primes are independent, predicting max gap \( \leq C(\log x)^2 \). Maier showed \( \pi(x + (\log x)^\lambda) - \pi(x) \) fluctuates for \( \lambda > 2 \), contradicting independence. Granville’s \( 2e^{-\gamma} \) constant replaces Cramér’s model.  
     - *Label*: **Non-negotiable**. Unrefutable heuristics are unscientific.

  4. **Non-Uniform Sampling**  
     - *Requirement*: The framework must weight objects by natural densities (e.g., automorphism groups) when uniformity conflicts with symmetry.  
     - *Case*: Cohen–Lenstra for class groups. The probability for group \( A \) is weighted by \( 1/|\text{Aut}(A)| \), not uniform. This arises from the Malle-Bhargava principle that isomorphism classes should be weighted by automorphism count in mass formulas.  
     - *Label*: **Camp-specific (AN)**. Algebraic number theorists demand this; others may omit it.

  5. **Structural Analogy Without Independence**  
     - *Requirement*: The framework must accommodate warrants based on structural analogies (e.g., random matrix theory) even when independence is absent.  
     - *Case*: Moments of \( \zeta(1/2 + it) \). Keating–Snaith conjecture \( \frac{1}{T}\int_0^T |\zeta(1/2+it)|^{2k} \, dt \sim f_k (\log T)^{k^2} \) via analogy with characteristic polynomials of random unitary matrices, not independence.  
     - *Label*: **Non-negotiable**. Excluding these loses key predictions. A framework may exclude them only if it declares such heuristics "out of scope," sacrificing breadth.

  6. **Heuristic-to-Theorem Upgrade**  
     - *Requirement*: When a heuristic becomes a theorem, the framework must explain why the heuristic succeeded (e.g., independence held asymptotically).  
     - *Case*: Erdős–Kac. Heuristic: \( \omega(n) \) (prime factors) satisfies CLT with mean/variance \( \log \log n \) by treating prime indicators as independent. Theorem confirms this. The framework must map heuristic independence to actual asymptotic independence.  
     - *Label*: **Negotiable**. Desirable for unification but not essential.

  7. **Global Obstruction Recognition**  
     - *Requirement*: The framework must detect when local densities multiply to \( >0 \) but a global obstruction (e.g., Brauer–Manin) forces probability \( 0 \).  
     - *Case*: Hasse principle failures. Let \( V \) be a variety with points over all \( \mathbb{Q}_p \) but no \( \mathbb{Q} \)-points (e.g., Selmer curve \( 3x^3 + 4y^3 + 5z^3 = 0 \)). Multiplying local densities suggests \( \mathbb{P}(\text{point}) > 0 \), but Brauer–Manin obstruction mandates \( \mathbb{P} = 0 \).  
     - *Label*: **Non-negotiable**. Ignoring obstructions yields false positives.

  8. **Background Information Sensitivity**  
     - *Requirement*: The framework must decide when background information (e.g., divisibility) overrides default independence.  
     - *Case*: Primality of \( n! + 1 \). Treating it as random ignores coprimality to primes \( \leq n \). Background info \( \gcd(n! + 1, p) = 1 \) for \( p \leq n \) must override independence, increasing \( \mathbb{P}(\text{prime}) \) by \( \prod_{p \leq n} (1 - 1/p)^{-1} \).  
     - *Label*: **Camp-specific (Auto)**. Crucial for automated systems; humans handle it intuitively.

  9. **Vanishingly Small Predictions**  
     - *Requirement*: The framework must assign meaningful probabilities even when expected counts are \( o(1) \) and unverifiable.  
     - *Case*: Fermat primes. Heuristic: \( \mathbb{P}(2^{2^n} + 1 \text{ prime}) \approx 1/2^n \) (by PNT and trial division). Expected count \( \sum_{n \geq 5} 1/2^n < 1 \), predicting finiteness. Computation cannot falsify this.  
     - *Label*: **Non-negotiable**. Dismissing small predictions invalidates many number-theoretic heuristics.

  10. **Coherence Under Reformulation**  
      - *Requirement*: Probabilities must be invariant under logically equivalent claim reformulations (e.g., "twin prime" vs. "both \( n \) and \( n+2 \) prime").  
      - *Case*: Equivalent forms of Goldbach’s conjecture. \( \mathbb{P}(\text{even } n \text{ is sum of two primes}) \) must not depend on whether \( n \) is written as \( 2m \) or \( m + m \).  
      - *Label*: **Camp-specific (Log/Auto)**. Logicians and automated systems require this; mathematicians tolerate mild inconsistencies.

  11. **Non-Additivity for Dependent Events**  
      - *Requirement*: The framework must violate finite additivity when events are dependent but the dependence is unknown.  
      - *Case*: Primes in short intervals. Let \( A_x \) be "interval \([x, x + \log x]\) has \( \geq k \) primes." Dependence between \( A_x \) and \( A_y \) for \( |x - y| < \log x \) is unknown. Additivity fails without correlation data.  
      - *Label*: **Non-negotiable**. Enforcing additivity by default ignores hidden dependence.

  12. **Computational Tractability**  
      - *Requirement*: Estimates must be computable (in principle) from the input data.  
      - *Case*: Hardy–Littlewood constants for prime \( k \)-tuples are computable Euler products. An estimator requiring non-computable oracles (e.g., truth of GRH) fails.  
      - *Label*: **Camp-specific (Auto)**. Essential for automation; mathematicians accept uncomputable insights.

  ### Impossibility: Coherence vs. Non-Triviality

  **Conflict**: Requirements **10 (Coherence Under Reformulation)**, **Coherence (additivity)**, and **1 (Default Independence)** cannot all hold simultaneously without trivializing the estimator.  
  - **Why**: The integers are a fixed structure; probabilities are either logical (truth values in disguise) or epistemic (agent-relative). Enforcing coherence (e.g., additivity, invariance) forces probabilities to respect all logical consequences.  
    - *Example*: Let \( \phi \) be "there are infinitely many twin primes." If \( \phi \) is true, coherence demands \( \mathbb{P}(\phi) = 1 \); if false, \( \mathbb{P}(\phi) = 0 \). But \( \phi \) is unresolved, so any non-extreme assignment violates coherence: equivalent formulations of \( \phi \) (e.g., via Hardy–Littlewood) might be assigned different probabilities.  
  - **Consequence**: To avoid collapse to truth values, the framework must either:  
    - **Abandon coherence** (e.g., allow \( \mathbb{P}(\phi) \) to depend on syntactic form), losing reliability for automation.  
    - **Relativize probabilities** to an agent’s knowledge (epistemic), violating objectivity.  
    - **Default to independence** but allow incoherence when dependencies are undiscovered (e.g., Maier’s theorem later refutes Cramér).  
  - **Verdict**: Full coherence is impossible without settling all open questions. The framework must choose:  
    - *For automation*: Enforce coherence but use epistemic probabilities (agent-relative), risking subjectivity.  
    - *For organizing practice*: Drop strict coherence (requirement 10), accepting heuristic "inconsistencies" as new math emerges.

  ### Most Exclusionary Requirement  
  **Global Obstruction Recognition (7)**. It demands the framework detect abstract obstructions (e.g., cohomological) that override local models. This excludes:  
  - Cramér-style random models (miss global constraints).  
  - Coherence-based approaches (logical omniscience needed).  
  - Naive multiplicative models (e.g., for local solutions).  

  ### Verdicts on Framework Families  

  1. **Concrete Random Models (Cramér)**  
     - *Fails*: Global obstructions (7), structural analogies (5), and background sensitivity (8).  
     - *Verdict*: Useful for AN organizing practice but unreliable for automation; cannot handle arithmetic geometry.  

  2. **Formal Coherence-Based Approaches**  
     - *Fails*: Non-triviality (due to impossibility), structural analogies (5), and refutability (3—coherence resists revision).  
     - *Verdict*: Suitable for Log semantics if probabilities are epistemic; useless for AN as it forbids provisional estimates.  

  3. **Working Mathematician’s Practice (singular series + corrections)**  
     - *Fails*: Coherence (10), global obstructions (7—often ignored), and warrant transparency.  
     - *Verdict*: Optimal for AN organizing practice; inadequate for Auto due to inconsistency and opacity.  

  ### Purpose Dependence  
  If the framework only organizes **expert practice** (AN), these drop out:  
  - Coherence (10), additivity (11), and computational tractability (12). Experts tolerate inconsistency and uncomputability.  
  - Warrant transparency is optional.  
  For **unverified agents (Auto)**, these become critical:  
  - Coherence (10), computability (12), warrant transparency, and background sensitivity (8).  
  Global obstructions (7) remain non-negotiable in both cases.  

  **Final Summary**: A successful framework must navigate the impossibility of coherence versus non-triviality. For organizing practice, adopt AN’s flexible corrections but formalize local obstructions and refutability. For automation, use epistemic probabilities with explicit warrants, sacrificing objectivity. The hardest requirement—global obstruction recognition—demands integration of abstract algebra, excluding simplistic random models.
