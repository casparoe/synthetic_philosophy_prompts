      - \( EU(\text{accept}) = U_{\text{work}} + P(\text{allele} | \text{accept}) \times U_{\text{illness}} \)
      - \( EU(\text{decline}) = P(\text{allele} | \text{decline}) \times U_{\text{illness}} \)
    - Since \( P(\text{allele} | \text{accept}) \) is high and \( U_{\text{illness}} \) is large negative, \( EU(\text{accept}) \) is likely negative or low. \( EU(\text{decline}) \) is less negative, so EDT declines.
