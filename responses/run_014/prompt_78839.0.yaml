    - *Utility of accepting*: Positive value of work, minus disutility of evidence (high probability of illness). Even though the illness isn't caused by the choice, EDT factors the psychological or informational disutility of learning you're likely to die young.
    - *Utility of declining*: No work benefits, but evidence suggests low illness risk.
