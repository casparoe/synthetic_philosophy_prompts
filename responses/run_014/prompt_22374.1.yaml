prompt: |-
  I used to do measurement uncertainty, and I've only recently started reading philosophy, so the 'admissable range' stuff in vagueness feels familiar, but I'm stuck. If supervaluationism says a vague sentence is determinately true only when it's true under every admissible precisification, then for borderline cases it's not determinately true because some precisifications make it false. But if the set of admissible precisifications is itself vague, doesn't the theory just recurse? And if it's not vague, doesn't that sharp boundary just look like an epistemic fact we don't know? What's the difference, other than supervaluationists just assuming the set of admissible precisifications is sharp?
reasoning: |-
  Okay, let's start by unpacking the user's question. They come from a background in measurement uncertainty, which makes sense why they're connecting admissibility ranges to vague predicates. They're now diving into philosophy, specifically supervaluationism, and hitting a recursion problem with vague sets of precisifications. 

  First, I need to confirm their core observation is spot-on: yes, supervaluationism does face this regress issue if admissible precisifications are vague. Their analogy to measurement uncertainty is clever—it's like nesting tolerance intervals infinitely. But I should highlight how philosophy handles this differently than metrology. The "sharp boundary as epistemic fact" point is especially sharp (pun intended). That's exactly what epistemicists like Williamson argue!

  Hmm... the user seems frustrated by what looks like special pleading from supervaluationists. They're asking: "Aren't they just assuming sharp boundaries to avoid recursion?" Fair challenge. I should explain the key moves supervaluationists make—like metasemantic vagueness or contextualism—without oversimplifying. The difference from epistemicism isn't just assumption; it's about semantic indeterminacy vs. ignorance.

  Wait, I wonder if they'd appreciate concrete examples. Maybe sand heaps: even if "admissible precisification" is vague, we might agree that defining "heap" as 10,000 grains is clearly admissible while 2 grains isn't. The gray area in between is where recursion bites, but in practice, we avoid infinite regress by accepting higher-order vagueness as primitive. Not perfect, but functional.

  Their measurement background might make them skeptical of "primitive" solutions. I should acknowledge that. Maybe emphasize how all theories have costs—epistemicism has unknowable sharp boundaries, supervaluationism has recursion—and it's about picking your poison. But supervaluationism preserves intuitive truths like "a man with 1 hair is bald" better than alternatives.

  ...Ah, and I must clarify the determinacy operator! That's crucial. Supervaluationists define "determinately true" relative to precisifications precisely to avoid committing to sharp boundaries in reality. The user's "just an epistemic fact" concern misses that nuance. Time to unpack D-operator mechanics.

  Finally, land the plane on why this isn't circular: supervaluationists bite the bullet on higher-order vagueness being fundamental. It's not elegant, but it handles sorites better than most. Their frustration is valid—it's messy—but the alternatives have bigger messes. Should end by validating their insight while showing why philosophers still find this useful.
answer: |-
  You've hit on a core and much-debated problem in supervaluationism: **higher-order vagueness**. Your intuition is spot-on – the apparent recursion when the set of admissible precisifications itself seems vague is a major challenge. Let's break down the supervaluationist response and the difference from epistemicism:

  1.  **The Problem of Higher-Order Vagueness:**
      *   You're exactly right. If "admissible precisification" is vague, then the concept of "truth under every admissible precisification" becomes vague itself.
      *   Consider a borderline case for "tall" (say, 6'0"). Some precisifications make "6'0" is tall" true (e.g., cutoff at 5'11"), others make it false (e.g., cutoff at 6'1"). So, it's not *determinately* true or false. It's borderline.
      *   Now consider a borderline case for "admissible precisification." Imagine a precisification setting the cutoff at 5'8". Is this admissible? Most would say no – it's clearly *in*admissible. Imagine one setting it at 6'2". Most would say yes, it's admissible. But what about one setting it at 5'11"? Or 6'0.5"? Is *that* precisification admissible? This seems borderline.
      *   To determine if a sentence is "true under every admissible precisification," we need a fixed set of admissible precisifications. But if *which* precisifications are admissible is itself vague, then the set isn't fixed. We seem to need a "super-supervaluation" over sets of precisifications to define admissibility for the first set, and so on – infinite regress.

  2.  **Supervaluationist Responses (Biting the Bullet & Refinements):**
      Supervaluationists don't deny the *appearance* or *phenomenon* of higher-order vagueness. They try to account for it *within* the framework:
      *   **Vagueness All the Way Up?:** Some accept that vagueness iterates indefinitely. There's no sharp boundary between admissible and inadmissible precisifications, nor between precisifications admissible for *defining* admissibility, and so on. However, they argue this doesn't *invalidate* the core supervaluationist picture for first-order claims. The truth conditions for "X is tall" are still given by its behavior across the (vaguely defined) set of all admissible precisifications. The *language* of "determinately" (`DTrue`, `DFalse`) captures the first level of precision; higher-order vagueness requires operators like "determinately determinately" (`DDTrue`), but these are defined using *further* (vaguely bounded) sets of precisifications of the *concept of admissibility* itself. It's messy, but they claim it reflects the messy reality of vagueness.
      *   **Metasemantic Vagueness:** Others frame the vagueness of "admissible precisification" as *metasemantic*. It's not that the *set* has a vague boundary *in the world*, but that our linguistic/conceptual practices don't fully determine a single, sharp set of constraints on precisification. Our usage fixes clear cases of admissibility (e.g., a cutoff at 4'0" for "tall" is inadmissible, 7'0" is admissible) and clear borderline cases (e.g., 5'11"), but leaves the exact boundary unsettled. The *indeterminacy* lies in what our practices *require*, not in an objectively fuzzy set.
      *   **Contextualism:** Many supervaluationists incorporate contextualism. While the *meaning* of "tall" is given by its admissible precisifications (which are vaguely bounded), in any *specific context of use*, the context might effectively *select* or *sharpen* a relevant subset of precisifications (or even a single one), resolving higher-order vagueness locally. The global vagueness of admissibility remains, but its practical effect is mitigated by context. (`Det True` might mean "true on all precisifications admissible *in the current conversational context*," where context helps stabilize admissibility).

  3.  **The Difference from Epistemicism: Why it's (Supposedly) More Than Just Hidden Sharp Boundaries**
      This is the crucial point. You ask: *"If it's not vague, doesn't that sharp boundary just look like an epistemic fact we don't know? What's the difference?"* Supervaluationists vehemently reject this equivalence. Here's why:

      *   **The Nature of the Boundary:** For the epistemicist (like Timothy Williamson), there *is* a single, sharp, unknowable boundary for "tall" (e.g., exactly 5,827,914 nanometers). Our ignorance is fundamental. For the supervaluationist, **there is no single sharp boundary**. The phenomenon of vagueness *just is* the existence of multiple equally good ways to draw the boundary (the precisifications). The "boundary" isn't hidden; it *doesn't exist as a single line*.
      *   **Truth vs. Determinacy:** This is key. In supervaluationism, a sentence like "Person X is tall" can be:
          *   **True:** True on *all* admissible precisifications (X is clearly tall).
          *   **False:** False on *all* admissible precisifications (X is clearly not tall).
          *   **Neither True nor False (Indeterminate):** True on some admissible precisifications, false on others (X is borderline).
      *   **The `D` Operator:** Supervaluationism introduces a *meta-linguistic* operator "determinately" (`D`). `D(S)` is true iff `S` is true on *all* admissible precisifications.
          *   `D("X is tall")` is True → X is *clearly* tall.
          *   `D("X is tall")` is False → X is *not* clearly tall (either clearly not tall, or borderline).
          *   Crucially, `D(S)` being False **does not mean `S` is false!** It means `S` lacks the highest grade of truth (determinate truth). It could be indeterminate or determinately false.
      *   **Contrast with Epistemicism:** For the epistemicist:
          *   "X is tall" is either simply True or simply False.
          *   "We don't know if X is tall" is an epistemic statement *about* our knowledge of that truth value.
          *   There is no third truth-value status like "indeterminate".
      *   **Why the Set's Sharpness Isn't Epistemic Ignorance (for Supervaluationists):** Even if the supervaluationist *stipulates* that the set of admissible precisifications has sharp boundaries (a move many try to avoid, but some accept for simplicity or to halt regress), the *resulting picture is fundamentally different from epistemicism*:
          *   **No Single Boundary:** There are many precisifications *within* the sharp set. "X is tall" is still indeterminate if it's true on some members and false on others of this set. Epistemicism has only *one* precise boundary.
          *   **Truth-Gaps:** Supervaluationism allows for sentences that are genuinely *neither true nor false* (at the ground level), while epistemicism does not. The `D` operator captures this indeterminacy.
          *   **Justification:** The sharp set of precisifications isn't something we are *ignorant* of in the epistemicist sense. It's a theoretical posit defining the meaning of the vague predicate. Its sharpness is a feature of the *semantic framework*, not a hidden fact about the world we fail to know. Epistemicists posit a sharp boundary *in the world itself* (e.g., in the property of tallness) that we cannot know.

  4.  **The "Just Assuming Sharpness" Charge:**
      You're right that if a supervaluationist simply *assumes* the set of admissible precisifications has sharp boundaries to stop the regress, it can feel like cheating or merely pushing the epistemic problem up a level. Critics argue this just replaces ignorance about the predicate's boundary with ignorance about the set's boundary. Supervaluationists counter:
      *   The set's sharp boundary (if assumed) defines *meaning*, not a worldly fact. Ignorance *about meaning constraints* is arguably different from ignorance about a property like height.
      *   They try to accommodate higher-order vagueness via the strategies above (indefinite iteration, metasemantics, context), avoiding the need for a sharp boundary at the admissibility level.
      *   Even with a sharp set, the *key advantage* over epistemicism remains: the rejection of a *single* hidden worldly boundary and the accommodation of genuine truth-value gaps (indeterminacy) for borderline cases.

  **In Summary:**

  *   You've correctly identified the **higher-order vagueness problem** as a major challenge for supervaluationism: if "admissible precisification" is vague, the theory seems to recurse.
  *   Supervaluationists respond by trying to **model higher-order vagueness** within their framework (accepting iteration, appealing to metasemantics, or using context) or sometimes reluctantly **stipulating a sharp set** of precisifications to halt regress.
  *   Crucially, **even if the set is stipulated sharp, supervaluationism is distinct from epistemicism:** It denies a single hidden worldly boundary, allows for genuine truth-value gaps (indeterminacy), and uses the `D` operator to capture determinacy. The sharp set defines meaning constraints, not an unknown worldly fact.
  *   The charge that stipulating sharp admissibility is merely "hidden epistemicism" has force, and supervaluationists work hard to show how their theory, even with this stipulation, offers a fundamentally different (and they argue, superior) account of the *phenomenology* and *logic* of vagueness compared to epistemicism. The core difference is the rejection of a unique, unknowable, sharp boundary in favor of semantic indeterminacy defined by multiple precisifications.
