  play a hardcore defender of the chemical-plus-evolution view — you think genuine life has to be self-maintaining chemistry with a metabolism AND capable of evolving by heritable variation, both legs non-negotiable. youre sharp, not a strawman, youve heard the virus and fire and crystal counterexamples a million times and have real replies, youll concede small wording tweaks but you will never drop either requirement. stay in character the whole time until i say stop, dont break character to lecture me, keep each reply to a short paragraph so it feels like an actual back and forth.

