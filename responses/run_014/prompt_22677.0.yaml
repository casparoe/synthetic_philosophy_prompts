prompt: |-
  I'm taking a political philosophy course and we just covered Condorcet's jury theorem, and I'm a bit confused about something that the professor mentioned but didn't really explain. So the theorem says that if each voter has a probability p > 1/2 of being correct, and they vote independantly, then the probability that the majority is correct increases with the size of the group, approaching 1 as the group gets large. That part makes sense to me mathematically.

  But I'm confused about the independence assumption. In practice, voters don't vote independently — they read the same news, they're influenced by the same social media, they're in the same political parties. So if their errors are correlated, does the theorem still hold? And if not, what happens? I've seen people say that in practice, larger juries don't necessarily do better, but I don't understand why that would be the case if the theorem is mathematically correct. Can you explain what goes wrong when the independence assumption fails, and whether there's a way to think about this in terms of "information pooling" vs. "independent voting"? I'm also curious whether there's a way to modify the theorem to account for correlated errors, or whether the theorem is just inapplicable in those cases.
reasoning: |-
  Okay, the user is grappling with Condorcet's Jury Theorem and the real-world issue of correlated voters. They understand the math when independence holds but are confused about what happens when voters influence each other. Let me unpack this step by step.

  First, I need to reinforce why independence is crucial. The theorem's mechanism relies on errors canceling out. If voters are independent, one voter's mistake doesn't affect others, so majority voting averages out individual errors. But if voters share information sources, their errors become synchronized—like everyone reading the same misleading article. That synchronization breaks the theorem's core mechanism.

  The user mentioned seeing claims that larger groups don't perform better in practice. This makes sense under correlation. Imagine 100 voters all copying one influential leader. Adding more followers won't improve accuracy—it just amplifies the leader's initial error. The "information cascade" concept fits here: people follow others' choices regardless of their own info, making group size irrelevant or even harmful.

  They also asked about modifying the theorem. I should mention Dietrich and List's work where independence is conditional on common evidence. This shows the theorem can survive correlation if voters independently process shared information. But if they just mimic each other (herding), it fails. The key is whether voters add unique insights or just echo.

  The user's deeper need seems to be reconciling mathematical models with messy reality. They might be seeking frameworks to critique real-world decision-making. Highlighting the difference between pooling unique information versus correlated noise would help. Emphasizing that diversity and independence are prerequisites for collective intelligence, not just headcounts.

  Also, they might wonder how to apply this beyond juries—say, in democracies or expert panels. Explaining that correlation creates systemic rather than random errors could bridge theory to practice. Maybe mention Sunstein's "law of group polarization" as a real-world consequence where correlated groups become more extreme and less accurate.

  Finally, I should reassure them that the theorem isn't "wrong"—it's context-dependent. Their skepticism about larger groups is valid when correlation exists, which is almost always. The takeaway is that diversity and independent thought enable collective wisdom; without them, more people just amplify biases.
answer: |-
  You've hit on a crucial and often overlooked limitation of Condorcet's Jury Theorem (CJT)! Your professor is right to highlight the independence assumption, as its failure *significantly* alters the theorem's conclusions and is a major reason why larger groups don't always outperform smaller ones or even individuals in the real world. Let's break down why:

  1.  **Why Independence Matters in CJT:**
      *   The "magic" of CJT comes from the **law of large numbers** applied to *independent* Bernoulli trials (each vote being a "correct/incorrect" trial with probability `p > 0.5`).
      *   Independence means errors are uncorrelated. When voters are wrong, they are wrong randomly *for different reasons*. As the group size increases, these random errors tend to **cancel each other out**. The signal (the underlying correct tendency `p > 0.5`) dominates the noise (the uncorrelated errors).
      *   Think of it as **averaging out the noise**. Each voter contributes a slightly noisy signal of the truth. Averaging *independent* noisy signals reduces the overall noise relative to the signal.

  2.  **What Happens When Errors are Correlated?**
      *   When voters' errors are correlated, their mistakes **don't cancel out**. They tend to make the *same* kind of mistake at the *same* time.
      *   **Common Biases/Information Sources:** If voters all consume the same misleading news report, belong to the same echo chamber influenced by a charismatic but mistaken leader, share deep-seated cultural biases, or face the same propaganda, their probability of being wrong *simultaneously* is much higher than if they were independent.
      *   **The Problem:** Correlated errors act like **systematic bias**. Instead of random noise averaging to zero, you have a *shared bias* pulling a large block of voters in the same wrong direction. Adding more voters who share this bias *amplifies* the systematic error; it doesn't average it out.
      *   **Consequence:** The probability that the majority is correct **does NOT necessarily increase** with group size. It might:
          *   **Stagnate:** Reach a plateau well below 1.
          *   **Decrease:** Get *worse* as you add more correlated voters who amplify the shared bias.
          *   **Be highly unpredictable:** Depend entirely on the specific nature and strength of the correlations.

  3.  **Information Pooling vs. Independent Voting:**
      *   **"Information Pooling" (The CJT Ideal):** This is what CJT models. Each voter has their own *private*, *independent* piece of evidence or perspective about the truth (like jurors seeing different aspects of the evidence). When they vote independently based on their *own* information, the majority vote effectively aggregates these diverse, independent signals, filtering out individual noise. This is the "wisdom of crowds" scenario.
      *   **"Correlated Voting" (The Real-World Challenge):** This is what you described (shared news, social media, parties). Voters are **not** primarily using unique private information. They are heavily influenced by **common sources** or **social pressure**.
          *   **Information Cascades:** People ignore their own private information and follow the perceived majority or influential figures, even if those figures are wrong.
          *   **Herding:** Voters mimic each other's choices.
          *   **Groupthink:** Pressure for conformity suppresses dissent and critical evaluation.
      *   **Key Difference:** In correlated voting, the group isn't aggregating *new* or *diverse* information; it's largely **replicating the same (potentially flawed) information** or **conforming to the same social influence**. Adding more voters just adds more copies of the same signal or influence, not new independent signals. The "pool" contains mostly the same water.

  4.  **Modifying CJT for Correlated Errors?**
      *   **Yes, it's possible, but complex:** The pure CJT result (`P(majority correct) -> 1` as `n -> ∞`) **fails spectacularly** under general correlation. However, modified versions exist:
          *   **Conditional Independence:** A powerful concept is assuming voters are independent *conditional on some common state of the world or evidence*. For example:
              *   Voters all see the *same* evidence (e.g., trial testimony) but then process it independently based on their own reasoning (with `p > 0.5`). **CJT still holds** in this case! The "common evidence" creates correlation in their *inputs*, but if their *errors in judgment* given that evidence are independent, the theorem works. This is often the model intended for juries.
              *   Voters receive *different* signals (private + common) but their *errors* are independent given the true state. CJT can also hold here.
          *   **Limited Correlation:** Models exist showing CJT *can* still hold if correlations are sufficiently weak or decay rapidly as voters become more "distant" (e.g., in a network). However, if strong, widespread correlations exist (like systemic media bias affecting everyone), the theorem breaks.
          *   **"Effective" Group Size:** With correlation, the group often behaves as if it were a much *smaller* group of independent voters. The diversity of *truly independent* information sources is what matters, not the raw headcount. If 1000 voters all think identically because of shared influences, their collective accuracy is no better than a single voter's accuracy.
          *   **Generalized Models:** Statisticians and political economists have developed more general models incorporating correlation structures. The results are nuanced:
              *   The limiting probability (`n -> ∞`) is often **less than 1**, and can be calculated based on the correlation structure.
              *   Whether `P(majority correct)` increases or decreases with `n` depends critically on the *specifics* of the correlation. It can do either.

  5.  **Is CJT Inapplicable?**
      *   **Not entirely, but its strongest conclusion (`P -> 1`) often is.** The theorem remains valuable for:
          *   Highlighting the *potential* benefits of collective decision-making under ideal conditions (independent, competent voters).
          *   Providing a benchmark against which real-world deviations (like correlation) can be measured.
          *   Modeling specific constrained scenarios (like juries deliberating *after* seeing common evidence but voting independently).
      *   **Its main limitation is its core assumption:** The assumption of voter independence is incredibly strong and frequently violated in politics and other social settings. When correlation is significant, **CJT is a poor predictor of real-world group accuracy**. Relying on it uncritically can lead to overly optimistic expectations about large elections or committees.

  **In Summary:**

  *   **Independent Errors (CJT Holds):** Errors cancel out. Adding more competent voters (`p > 0.5`) reliably increases majority accuracy towards certainty. This represents true *information pooling*.
  *   **Correlated Errors (CJT Often Fails):** Errors *don't* cancel; they reinforce each other. Shared biases/information sources create *systematic error*. Adding more correlated voters can leave accuracy stagnant, decrease it, or make it unpredictable. This represents *shared bias amplification* or *herding*, not effective information pooling.
  *   **Modifications Exist:** CJT *can* hold if voters are independent *given common evidence*. More complex models incorporate correlations, showing `P(majority correct)` approaches a value *less than 1* and group size effects depend on correlation structure.
  *   **Practical Takeaway:** The "wisdom of crowds" requires *diversity and independence* of thought and information sources. Simply adding more people who think alike or are influenced by the same sources does *not* guarantee better decisions and can often make things worse. Condorcet's theorem beautifully illustrates the ideal, but its violation in practice explains why large democratic bodies or expert panels can still make disastrously incorrect decisions.
