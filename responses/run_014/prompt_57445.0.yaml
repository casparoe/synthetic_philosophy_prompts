prompt: |-
  I cover science and ideas for a national magazine and sit as one of five jurors on an annual book prize for science writing. Ten days before our final meeting, a reporter at another outlet published a documented account alleging that the author of the book the jury has been treating as its favorite secured the cooperation of the family at the center of it — whose child's illness supplies the book's narrative spine — by promising that identifying details would never appear, and then used them. The family has confirmed the promise; the author disputes the characterization but not the exchange. Our founding documents describe the award as recognizing a book's achievement and are silent on the author's conduct, though they also say the prize exists to honor integrity in the reporting of science. Two jurors treat that silence as decisive; two think we cannot give the prize partly on the strength of the chapters we singled out as the book's distinction, since the intimacy we praised was obtained by the breach.

  Please draft the written opinion I will circulate to the jury: a concrete disposition (award; strike from consideration; award with a published reservation; or another option you can defend), the reasoning a juror who disagrees could actually argue with, and a test the jury could apply in future cases where the misconduct is not merely adjacent to the work but constitutive of it. Address what a prize jury should treat as established when an allegation has never been adjudicated anywhere, and give the strongest case for the reading of the founding documents you reject. Begin with the memo itself, with no preface or commentary, and put your recommended disposition in its first sentence. Eight hundred to a thousand words.
reasoning: |-
  Okay, the user is asking me to draft a written opinion for a science book prize jury. They're one of five jurors dealing with an ethical dilemma about the frontrunner book. A reporter has alleged that the author promised a family anonymity about their child's illness but then used identifying details anyway. The family confirms this, though the author disputes the characterization. 

  The jury is split: two think the founding documents' silence on author conduct means they should proceed, while two believe the breach fundamentally taints the praised intimacy in the book. The user wants a concrete disposition (award/strike/award with reservation/etc.), reasoning that dissenting jurors can engage with, a test for future cases, and guidance on handling unadjudicated allegations. They also want the strongest counterargument addressed.

  Hmm... this is complex. I need to consider several angles. First, the prize's purpose: while the founding documents focus on "achievement" and "integrity in reporting," they're silent on misconduct. But integrity isn't just about factual accuracy—it's about methods. Using intimate details obtained through a broken promise feels like a foundational flaw. 

  For disposition, "strike from consideration" seems most defensible. Awarding normally would ignore the ethical breach, while awarding with reservation might feel like a hollow compromise. Striking acknowledges that the misconduct is constitutive—it built the very intimacy that made the book stand out. 

  The test for future cases should focus on whether the misconduct is materially constitutive: did it create the praised aspects? If yes, it invalidates the work. For unadjudicated allegations, the jury must make its own determination based on available evidence—here, the family's confirmation and author's non-denial of the exchange are damning. 

  I should also anticipate counterarguments thoroughly. The "textualist" view (silence = permissibility) is strong, but integrity implies ethical dimensions beyond the page. Plus, the prize's reputation matters—awarding could damage public trust. 

  The draft needs to be structured as a memo: lead with the disposition, then reasoning, test, and counterarguments. Keep it 800-1000 words, precise yet persuasive. The tone should be collegial but firm—this is for fellow jurors who are equally thoughtful but disagree. 

  User's identity as a science journalist adds weight—they understand how trust underpins science communication. Their need isn't just procedural; it's about upholding the spirit of the prize while navigating real-world messiness. The memo must bridge legalistic and ethical perspectives, offering clarity without dogma.
answer: |-
  **MEMORANDUM**  
  **TO:** The Jury for the [Name of Prize]  
  **FROM:** [Your Name]  
  **DATE:** [Date]  
  **SUBJECT:** Disposition Regarding [Book Title] and Recommended Test for Constitutive Misconduct  

  **Disposition:** The jury should strike [Book Title] from consideration for the prize.  

  **Reasoning:**  

  Our primary charge is to recognize a book’s "achievement" and "honor integrity in the reporting of science." While the founding documents do not explicitly address authorial conduct unrelated to factual accuracy, integrity in science reporting cannot be severed from the ethical foundations of how information is obtained. Science writing, at its core, relies on trust: trust in data, trust in methodology, and trust in the relationship between the reporter and human subjects, especially vulnerable ones like the family central to this book.  

  The allegation, documented by a reputable outlet and confirmed by the family while disputed only in characterization by the author, asserts a fundamental breach: a promise of confidentiality regarding identifying details was made to secure cooperation, and that promise was broken. The disputed "characterization" likely centers on intent or degree of identification, but the *fact* of a promise exchanged for cooperation concerning sensitive details, and the *fact* of subsequent use of those details contrary to the promise, is not contested by the author. This breach is not merely "adjacent" to the work; it is **constitutive**.  

  The jury’s prior praise for the book’s "intimacy" and "narrative spine" – the very qualities elevating it above other contenders – directly stemmed from the depth of access granted by the family. This access was secured, according to the family and the documented exchange, by a specific promise concerning privacy. The power of the narrative we admired is therefore inextricably linked to the method of its acquisition. To honor the book’s "achievement" while ignoring that this achievement was built upon a broken promise to the subjects who enabled it reduces "integrity in the reporting of science" to mere factual verification of the science itself, divorced from the human context of its discovery and the ethics of its narration. It signals that the ends (a compelling narrative, insightful science writing) justify ethically dubious means when obtaining that narrative.  

  Awarding the prize under these circumstances risks:  

  1.  **Undermining the Prize's Purpose:** Honoring "integrity" while overlooking a breach fundamental to the work's creation creates cognitive dissonance and damages the prize's credibility. It suggests ethical conduct in sourcing human stories is optional for science writers we celebrate.  
  2.  **Harm to Subjects and Trust:** It disregards the harm inflicted on the family, who participated based on a promise that was violated. It also erodes trust more broadly; future subjects may be less willing to cooperate with science writers, fearing their agreements won't be respected.  
  3.  **Diminishing the Work:** The knowledge of the breach irrevocably alters the reader's (and juror's) perception of the praised intimacy. What felt like privileged access now appears as an exploitation of trust, casting a shadow over the narrative's authenticity and the author's reliability.  

  **Test for Constitutive Misconduct in Future Cases:**  

  In future instances where alleged misconduct is raised, the jury should determine if the conduct is **materially constitutive of the work's praised achievements** by asking:  

  1.  **Is the alleged misconduct directly linked to the acquisition of core material or access central to the work's distinction?** (e.g., Was deception, coercion, or breach of agreement necessary to obtain the key narrative, data, or insights uniquely highlighted by the jury?)  
  2.  **Does the removal of the element obtained through the alleged misconduct fundamentally diminish or invalidate the specific achievement the jury seeks to honor?** (e.g., Without the intimate family details obtained via a broken promise, would the book lose its narrative power and unique insight, the very qualities that distinguished it?)  

  If the answer to *both* questions is "yes," the misconduct is constitutive, and the work should be deemed ineligible, regardless of its standalone merits. This test focuses on the *relationship between the means and the praised ends*, not on adjudicating the author's overall character or unrelated conduct. It protects the prize’s commitment to integrity without requiring the jury to become a court of general ethics.  

  **Addressing Unadjudicated Allegations:**  

  A prize jury is not a tribunal with investigative powers or the authority to make binding legal findings. However, we are obligated to make a good-faith assessment based on credible, available evidence to uphold the prize's integrity. We must consider:  

  *   **The Source:** Is the allegation documented by a reputable, independent journalist or outlet with a record of accuracy?  
  *   **The Evidence Presented:** Does the documentation provide specific details, correspondence, or corroborating accounts?  
  *   **Responses:** Has the subject of the allegation (author, publisher) been given an opportunity to respond, and what is the substance of that response? Do they deny core facts, or only the interpretation?  
  *   **Corroboration:** Is there independent confirmation from involved parties (like the family here)?  

  In this case, the allegation meets a high threshold: documented by a reputable reporter, confirmed in its core facts (the promise and its breach regarding details) by the wronged party (the family), and not denied in substance by the author (who disputes only the "characterization," implicitly confirming the exchange and the use of details). The jury can reasonably treat the *core factual allegation* – that a confidentiality promise was made to secure cooperation and then broken regarding the use of identifying details – as established for the purposes of our deliberation. We are not determining legal liability, but whether, based on credible evidence, the work aligns with the prize's standard of integrity.  

  **The Strongest Case for the Opposing View (Textualist Reading):**  

  The most compelling argument against striking the book rests on a strict textualist interpretation of the founding documents:  

  1.  **Explicit Silence on Conduct:** The documents solely mention "a book's achievement." They contain no clause disqualifying works based on author conduct unrelated to the text's factual accuracy. Introducing an ethical criterion beyond the text's achievement constitutes judicial overreach, rewriting the prize's criteria based on subjective notions of propriety rather than its stated purpose.  
  2.  **Integrity Defined by Reporting, Not Sourcing:** The phrase "integrity in the reporting of science" refers solely to the accuracy, honesty, and rigor in *presenting* scientific information within the book itself. It does not encompass the methods of sourcing human interest elements, which fall outside the realm of "science reporting" proper. The science reported remains accurate regardless of how the family's story was obtained.  
  3.  **Separation of Art and Artist:** The work's literary and explanatory merits – the narrative power, the clarity of scientific exposition, the insight garnered – stand independently of the author's actions. To deny the prize based on external allegations is to punish the work for the author's perceived misdeeds, violating the principle of evaluating the book qua book.  
  4.  **Slippery Slope & Lack of Due Process:** Creating an ethical veto based on unadjudicated allegations sets a dangerous precedent. Future juries could exclude worthy books based on unproven rumors or subjective ethical judgments about sourcing, politicizing the prize and diverting focus from literary and scientific merit. The author has not had a fair, formal process to defend against these allegations.  

  **Conclusion:**  

  While the textualist argument is coherent and emphasizes fidelity to the written criteria, it ultimately proves too narrow. "Integrity in the reporting of science" cannot be meaningfully confined to the page when the story *on* the page was built upon a demonstrable breach of trust with the human subjects essential to that story. The constitutive nature of this breach – the broken promise directly enabled the intimacy we praised – means that honoring this "achievement" would celebrate methods antithetical to the ethical foundation of trustworthy science communication. The unadjudicated allegation meets a sufficient burden of proof for our purposes. Striking the book, while difficult, is the necessary action to preserve the prize’s commitment to integrity in both the *what* and the *how* of science reporting. The proposed test provides a principled, limited framework for handling such rare but critical cases in the future.
