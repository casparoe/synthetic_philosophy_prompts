prompt: |-
  So I've been chewing on a view for a while now and I want the honest version of how exposed it is, not a steelman and not a pep talk. American English please, and no bibliography or reading list — I can't look anything up, so anything you'd want me to go read, just tell me in prose.

  The view, which I'll call the shell thesis. Every durable moral norm in a large-scale society is at bottom a Lewisian convention — a regularity in a recurrent situation that persists because of common knowledge plus conditional preferences to conform given that others conform, sitting on top of some coordination or assurance or chicken game — that has since grown a moralized shell. The shell is the interesting part: outrage, disgust, third-party punishment, appeals to dignity or sacredness, and above all the felt categoricity. On my view the categoricity is a commitment device. It makes conformity look unconditional so the equilibrium survives stretches where the payoffs temporarily favor defecting, and it lets third parties police cheaply because everyone knows everyone else is watching for violations. So the moral phenomenology is not evidence that the norm tracks anything non-conventional. It's the stabilizer.

  The specific claims I want to defend, so you know what to aim at:

  1. Origins: behind each such norm there was a recurrent game whose equilibria the norm selects. No promise, no explicit agreement, no moral insight — a focal point that happened to stick.
  2. Asymmetric decay: the coordiation problem goes first and the rhetoric lags. You should get periods of what I'd call zombie norms, where people still express full-strength moral condemnation of acts that no longer threaten any equilibrium. And in the other direction, new coordination problems should get solved as mere etiquette or convention first and moralized only later, with a lag.
  3. Fragility gradient: moralization should be strongest exactly where the equilibrium is most fragile — highest payoff to defecting, hardest to police — and weakest where conforming is already nearly costless.
  4. Rarity: norms with no equilibrium behind them at all should be rare, unstable, and mostly confined to small face-to-face groups where reputation and kinship do the work instead.

  Now: what would count against this? I want the defeaters ranked from fatal to merely awkward, with an explicit line between the two.

  - Cases. Give me the norms that are hardest for it and say *why* they're hard rather than just listing them. My own shortlist, which I'd like you to check and extend: norms against cruelty to animals, abolition, duties to the dead and promise-keeping to people who can no longer be affected, incest and food taboos, norms about sexual conduct, hospitality to strangers. For each, say whether a defender can find a game the norm is plausibly selecting among, and — this is the crux — how you'd know that game was there independently of the norm.

  - The rival that worries me most isn't moral realism. It's the view that norms are group-identity markers: moralization as coalition signaling, with no coordination core needed. That predicts the same outrage, the same categoricity, the same third-party punishment, and it doesn't require me to find a game behind anything. What observation or pattern actually separates the shell thesis from that? If the answer is nothing, say so plainly.

  - Free parameters. I suspect my real problem is that I can always retro-fit a game: choose the players, the informational structure, whose payoffs count, and any stable regularity becomes an equilibrium that the norm selects. That makes the thesis compatible with everything, which is the classic way to insulate a view. Confront this head-on. Is it falsifiable as stated? If not, what discipline would make it so — specifying the game from ecology and demography before you look at the norm, requiring the norm to pick out one equilibrium among several in an independently identified game, requiring the timing claims in 2 and the gradient in 3 to come out right? And is that kind of flexibility a fatal flaw for a view like this, or just what a mid-level social theory looks like before it's had a hundred years of case work?

  - A structural worry of my own that I want you to assess, because I can't tell if it's fatal. Lewis's machinery is built for coordination games, where the conditional preference to conform given others conform is genuine and the alternatives are roughly equally good. But a lot of the norms I care about sit on bargaining or conflict games instead — split the surplus, chicken, unequal endowments. There the norm isn't landing everyone on an equilibrium they're all happy with; it's deciding who gets how much, and whoever draws the short end has no conditional preference to conform whatsoever. Its stability then has to come from the shell alone, which starts to look like the thesis eating itself. How much of the moral-norm landscape is actually coordination-shaped rather than bargaining-shaped, and can the shell hold the bargaining cases together without collapsing into a pure power-and-extraction story? If it can't, I've reinvented conflict theory and lost the Lewisian content entirely.

  - Lewis himself. As I remember it, he built the analysis for coordination problems proper and thought moral rules fell outside it, because the arbitrariness clause fails: for a real moral norm there's no alternative regularity the participants would regard as serving about as well. If that's right then I'm either quietly changing the subject (my norms aren't his conventions) or the arbitrariness clause is just empirically false about a lot of norms, which is damage to Lewis rather than to me. Sort out which horn I'm on and how bad each one is, and correct me if I'm misremembering him, btw.

  - And finally, what does the shell thesis predict that its rivals don't? I've got the lag, the asymmetry, and the fragility gradient; are there sharper tests I'm missing? Which of them have arguably already come out wrong — moralized norms appearing basically instantly on some new technology, or norms dying while their coordination problem was still live?

  For each defeater, tell me whether a committed defender of the shell thesis would concede it as counting against them or wave it off, and whether any of the concessions are load-bearing — if they give up that one, does the whole thing go? I'm genuinely fine with the conclusion being that the view is well insulated, as long as you tell me whether that's a problem for a view of this kind or just a feature of it.
reasoning: |-
  Okay, the user presents a detailed thesis called the "shell thesis," which argues that durable moral norms in large societies start as Lewisian conventions (solutions to coordination games) that later develop a moralized shell to stabilize them. They want honest critiques without sugarcoating. Let me unpack their specific claims and the challenges they've listed.

  First, the user's main claims: origins in recurrent games, asymmetric decay (zombie norms), fragility gradient (moralization strongest where equilibria are fragile), and rarity of norms without underlying games. They’re aware of potential weaknesses and want them ranked from fatal to awkward. Their self-identified hard cases include animal cruelty norms, abolition, duties to the dead, etc. They also worry about rival theories like group-identity signaling and the flexibility of retrofitting games.

  Starting with the rival theory—group-identity markers. This is a strong alternative because it explains outrage and categoricity without needing a coordination game. The key differentiator for the shell thesis would be the presence of a coordination problem. But if group identity is the driver, the coordination aspect might be secondary. The user needs observable differences, like whether the norm solves a tangible problem or if it’s just about signaling. Historical cases where norms emerge without clear coordination problems would challenge this.

  Next, the flexibility problem. The user fears retrofitting games to fit any norm. To counter this, they suggest specifying the game from ecology/demography before looking at the norm. Without such discipline, the thesis risks being unfalsifiable. If a defender can always invent a game post-hoc, the theory isn’t testable. This is a serious issue unless they can provide independent evidence for the game's existence.

  The structural worry about bargaining games vs. coordination games is critical. Lewis’s conventions work for coordination, but many norms involve distributional conflicts. In such cases, the moral shell might be enforcing power dynamics rather than mutual benefit. If the shell thesis can’t handle these without collapsing into conflict theory, it loses its Lewisian foundation. Examples like property norms or gender roles might fall here, where one group benefits at another's expense.

  Lewis’s arbitrariness clause is another hurdle. If moral norms aren’t seen as arbitrary (i.e., alternatives aren’t equally acceptable), then they don’t fit Lewis’s definition. The user must either admit their norms aren’t conventions or drop the arbitrariness requirement. The latter might work but weakens the tie to Lewis, making the theory less grounded.

  Testing predictions: The user mentions asymmetric decay and fragility gradient. But are there historical examples where moralization appeared instantly (e.g., new tech norms) or norms died while the coordination problem persisted? Cases like digital privacy norms emerging quickly or dueling norms vanishing despite ongoing honor dynamics could contradict the thesis.

  Assessing the hard cases: Duties to the dead and animal cruelty are tough. For the dead, maybe reputation among the living or supernatural beliefs act as the game, but it’s strained. Animal cruelty might link to property rights or empathy, but the moral shell seems detached from direct coordination. If no clear game is found independently, these challenge the origins claim.

  Putting it all together, the bargaining game issue and group-identity rival are near-fatal. If norms are more about power or signaling than mutual coordination, the core mechanism fails. Retrofitting games is problematic unless constrained by pre-registered games. However, the thesis isn't dead; it can adapt by focusing on coordination-heavy norms and refining testable predictions. Concessions like dropping strict arbitrariness or accepting some norms as hybrid might save it but at the cost of scope. The user needs to decide if a narrower, more rigorous version is still valuable or if the cracks are too deep.
answer: |-
  Here's a straight-talking assessment of your shell thesis, ranked by severity and addressing your specific requests. American English, no fluff, no reading list.

  **Near-Fatal or Structurally Damaging Defeaters:**

  1.  **The Bargaining Game Problem (Your Structural Worry):**
      *   **Why it's Bad:** You nailed it. Lewisian conventions thrive on mutual advantage in coordination/assurance games ("We all win if we drive on the *same* side"). But core moral norms often govern *distribution* (property, inheritance, gender roles) or *asymmetric obligations* (ruler/subject, parent/child, creditor/debtor). Here, the "equilibrium" often heavily favors one party. The disfavored party's "conditional preference to conform" is frequently *coerced* ("conform or get punished") not genuinely cooperative. The "shell" (outrage, punishment) isn't just stabilizing mutual benefit; it's *enforcing an extraction*.
      *   **Can Shell Hold?** Unconvincingly. You'd have to argue the *entire system* is a coordination equilibrium preventing worse chaos (Hobbes), but this stretches "Lewisian" beyond recognition. The shell looks less like a stabilizer for mutual benefit and more like the *primary enforcement mechanism* for domination. Conceding this turns the thesis into conflict theory, ditching the core Lewisian mutual-advantage logic.
      *   **Defender Response:** Wave it off by redefining "coordination problem" incredibly broadly (e.g., "coordinating on who dominates whom") or focus *only* on norms with clear symmetric benefits. **Consequence:** Major loss of explanatory scope. If this covers most "durable norms" (like property, hierarchy), the thesis is hollowed out or transformed.
      *   **Load-Bearing?** **YES.** If bargaining/conflict norms are central and the shell is doing heavy lifting *without* a mutually beneficial coordination core, the Lewisian foundation crumbles.

  2.  **The Group-Identity Marker Rival (Coalition Signaling):**
      *   **Why it's Hard:** This predicts *exactly* the same phenomenology (outrage, categoricity, 3rd-party punishment) purely as costly signals of group loyalty. Crucially, it doesn't require the norm to solve *any* underlying coordination problem beyond group cohesion itself. Think of arbitrary food taboos or ritual purity norms with no clear harm prevention. The signal *is* the function.
      *   **Separating Observation:** It's *extremely* hard. The key test is: **Does violating the norm cause *tangible, material harm* unrelated to social sanction?** If violating a "moral" norm *only* causes offense/punishment (the signal's cost), it leans heavily towards signaling. If it reliably causes material harm *even if no one else knows* (e.g., breaking a dam safety norm, poisoning shared water), it suggests a coordination core exists. But many core moral norms (incest taboos, blasphemy) fail this.
      *   **Defender Response:** Concede some norms *are* primarily signaling, but argue the *durable, large-scale* ones usually have *both* a coordination core *and* a signaling shell. Wave off counterexamples as less "durable" or claim a hidden coordination benefit (e.g., incest avoids genetic defects – though evidence is weak for universal taboos).
      *   **Load-Bearing?** **POTENTIALLY FATAL.** If a significant chunk of durable moralization *only* serves signaling with no coordination core, the "at bottom a convention" claim fails for those norms. The thesis becomes a "sometimes" theory, not a general account.

  3.  **The Free Parameter / Retro-Fitting Problem:**
      *   **Why it's Bad:** This is the classic "just-so story" risk. With flexible definitions of players, payoffs, and the "game," you can *always* invent a plausible-sounding coordination/assurance story post-hoc. Was the abolition norm solving a coordination problem? Sure! "Avoiding divine wrath," "preventing slave revolts that harm everyone," "coordinating on higher productivity wage labor." Pick your payoff.
      *   **Falsifiability Fixes:**
          *   **Pre-Register the Game:** Demand the coordination problem be specified *independently* from ecology/demography/technology *before* examining the norm's emergence/structure (e.g., "New dense urban living creates a public sanitation assurance game").
          *   **Multiple Equilibria:** Require evidence that *multiple stable behavioral regularities were possible* in the identified game, and the norm selected one *specifically*. If only one stable outcome exists, it's not a "convention" in Lewis's sense.
          *   **Test Predictions Rigorously:** The lag (claim 2) and gradient (claim 3) *must* hold up empirically. If moralization consistently appears instantly with new tech (e.g., deepfake porn norms) or persists strongly even when costs are low (e.g., minor blasphemy in secular societies), claim 2 fails. If moralization is weak where fragility is high (e.g., white-collar crime with huge payoffs), claim 3 fails.
      *   **Defender Response:** Argue this is inherent to mid-level social theory. Demand critics propose better falsifiable alternatives. Stress that the burden is to make *plausible* historical cases using independent evidence, not airtight proofs. **Consequence:** Without discipline, the thesis risks being unfalsifiable storytelling. With it, it might fail key tests.
      *   **Load-Bearing?** **YES for Credibility.** Failure to adopt rigorous falsification criteria makes the thesis scientifically weak, though perhaps philosophically interesting.

  **Awkward but Manageable Defeaters (with Concessions):**

  4.  **Lewis's Arbitrariness Clause:**
      *   **The Issue:** You're right. Lewis saw conventions as solutions where multiple equilibria exist, and the choice is arbitrary (driving left/right). Moral rules, he thought, lack perceived alternatives – they feel uniquely "right." Many norms *don't* feel arbitrary to adherents (e.g., incest feels inherently wrong, not just one option).
      *   **Which Horn?** You're **ditching the arbitrariness clause**. You argue the *felt* non-arbitrariness (categoricity) is part of the shell/stabilizer. The underlying convention *might* have been arbitrary historically (e.g., *which* animals are taboo), but the moralization masks that.
      *   **How Bad?** It's damage to *Lewis's specific definition* but not fatal to your core mechanism. Lewis himself admitted conventions could feel "right" after entrenchment. You're extending the logic further than he did. **Defenders embrace this horn.** It weakens the direct link to Lewis but saves the core idea.

  5.  **Hard Cases - Duties to the Dead / Promises to the Truly Powerless:**
      *   **Why Hard:** Where's the recurrent game? The dead/truly powerless can't reciprocate or punish. Coordination/assurance with whom? Reputation among the living? But why moralize it so strongly if it's just reputation?
      *   **Plausible Games?:**
          *   **Duties to Dead:** Assurance game *among the living* about resource allocation to descendants/elders *while alive*, projecting stability. Violation threatens trust in *current* inheritance/kinship promises ("If they desecrate Grandpa, will they cheat me?"). Supernatural beliefs add another layer (assurance game with gods/ancestors).
          *   **Promises to Powerless:** Maintaining a *general* norm of promise-keeping is crucial. Allowing exceptions for the powerless undermines the whole convention ("If you can break promises to them, why not to me when I'm vulnerable?"). It's an assurance game about the robustness of the promise-keeping norm itself.
      *   **Independent Evidence?** Tough. Look for societies where these duties *are* treated as mere etiquette/reputation vs. sacred duty. Does the strength correlate with the importance of inheritance systems or the perceived need for robust promise-keeping? Evidence is mixed. **Defender Response:** Argue the norm stabilizes the *broader system* of trust/kinship. Concede it's a weaker case but salvageable. **Consequence:** Awkward stretching, not fatal.

  6.  **Hard Cases - Animal Cruelty / Abolition / Hospitality:**
      *   **Animal Cruelty:** Game could be preventing desensitization to violence (assurance game about community safety), protecting property (livestock), or signaling empathy (coalition signaling!). **Independent Evidence?** Does moralization strength correlate with livestock economic importance or urbanization? Patchy. Pets are harder – pure empathy/signaling?
      *   **Abolition:** Massive coordination/assurance problem among abolitionists *against* entrenched interests. But the moralization drove the movement *despite* massive individual cost (undermining claim 1's "no moral insight"?). The "game" was creating a *new* equilibrium. **Independent Evidence?** Clear conflict with powerful group; moralization preceded widespread coordination success. Awkward for pure convention-first.
      *   **Hospitality:** Classic assurance game in anarchic/isolated environments (traveler won't rob/murder, host won't enslave/kill). Moralization stabilizes it when stakes are high. **Independent Evidence?** Strong correlation between harsh environments/trade routes and strong hospitality norms. Defender win.
      *   **Defender Response:** For animals/abolition, emphasize the assurance game among the *moralizers* to cooperate against opponents or prevent harm spillover. **Consequence:** Requires viewing the norm as stabilizing cooperation *within a subgroup* against others, which blurs into conflict/power dynamics again. Manageable but messy.

  **Predictions & Tests:**

  *   **Your Predictions (Lag, Asymmetry, Gradient):** These *are* the sharpest tests.
  *   **Sharper Tests?**
      *   **Instant Moralization:** Look at norms around brand-new technologies (AI, genetic engineering, social media). Does strong, categorical moral condemnation (e.g., "deepfakes are inherently evil") emerge *before* any widespread coordination problem is evident, purely based on perceived harm/intuition? (Evidence suggests sometimes yes, e.g., early reactions to cloning).
      *   **Coordination Problem Alive, Norm Dead:** Are there clear cases where a coordination problem demonstrably persists (e.g., tragedy of the commons in overfishing), the old moral norm is gone ("Thou shalt not take more than thy share" is dead), and no new moral norm has arisen, just weak regulation? (Common).
      *   **Moralization Without Observability:** Find norms strongly moralized where violations are inherently *private* and unobservable (e.g., specific thoughts, very private rituals). The shell thesis predicts weak moralization here (no 3rd-party policing). Signalling/realism predicts it can still be strong (God sees, inherent wrongness). Evidence mixed (e.g., thought crimes vs. private consumption taboos).

  **Verdict on Insulation:**

  The shell thesis is **moderately insulated but not fatally so.** The free parameter problem is its biggest vulnerability to being "not even wrong." However, imposing discipline (pre-specifying games, demanding multiple equilibria evidence, rigorously testing lag/gradient) *can* make it falsifiable. The bargaining game issue and the group-signaling rival are the most serious substantive threats, potentially limiting its scope or showing its core mechanism isn't necessary.

  **Is this a Problem?** For a bold, mid-level social theory aiming for generality, this level of insulation is **fairly typical, perhaps even necessary early on.** The real test is whether adopting its disciplined version yields better explanations and predictions than rivals (group signaling, pure cultural evolution, realism) for a *significant range* of durable norms. It might not be the whole story, but it could be a crucial part of it. Giving up on explaining *all* durable norms (especially strong bargaining/conflict norms) as "Lewisian" is likely a necessary concession to avoid fatal overstretch.
