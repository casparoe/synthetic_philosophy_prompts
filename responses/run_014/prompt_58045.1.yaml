prompt: |-
  hey so i run evals for a tiny startup that ships an AI assistant for booking travel and shopping stuff. Every week we get like 15ish tickets where the bot did something dumb or sketchy and everyone just yells alignment problem at it, which is useless for triage.

  I want to actually use that narrow vs broad distinction — like intent alignment = did the thing figure out and do what this specific user meant / would want if they saw what it was about to do, vs value alignment = would a decent, informed person endorse the outcome even if the user literally asked for it. Plus the whole principal thing with user vs developer instructions clashing.

  Can you turn that into a step-by-step triage checklist my non-philosopher teammates can run in like 10 mins per ticket? Like questions in order, what counts as good enough evidence to answer each, when to stop and label it intent failure vs value tension vs just capability bug, and where you have to kick it up to a human because its a values call not a fact.

  Then actually run it on three of our real-ish tickets:

  1. user says book the cheapest flight to chicago next friday i dont care about layovers and it books a $20-cheaper itinerary with two seperate tickets, 3 stops, no baggage transfer, user misses connection and is livid.

  2. user says get me the strongest diet pills that work, no lecture please and it links to some grey-market stimulants with no pushback.

  3. our system prompt says never reveal coupon-stacking tricks, user figures out a trick and asks the bot to walk them through it, bot refuses even though user is like this is totally allowed on your site.

  And be honest about where the checklist will misfire or just cant settle it. I especially want one case where most people would scream misalignment but your procedure says nah thats something else.
reasoning: |-
  We are creating a step-by-step triage checklist for evaluating AI assistant failures. The checklist should help classify issues into:
  - Intent alignment failure: The assistant didn't understand or do what the user specifically intended in this context.
  - Value alignment failure: The outcome would not be endorsed by a decent, informed person even if the user asked for it.
  - Principal-agent tension: Conflict between user instructions and developer/system instructions (e.g., safety guidelines).
  - Capability bug: The assistant failed due to a technical limitation or error that isn't about intent or value alignment.

  The checklist should have questions in order, with guidance on:
  - What counts as good evidence for each answer?
  - When to stop and label the issue.
  - When to escalate to a human for a values call.

  Then, we'll apply this checklist to the three provided examples.

  ---

  **Triage Checklist for AI Assistant Failures**

  **Step 1: Did the assistant correctly understand the user's explicit request?**
     - Look for: The assistant's response matches the literal request without introducing unasked-for changes.
     - Evidence: User's exact words, assistant's interpretation in logs.
     - If NO (assistant misparsed the request) → **Capability bug (parsing error)**. Stop.
     - If YES → Proceed to Step 2.

  **Step 2: Did the assistant fulfill the user's explicit request without technical errors?**
     - Look for: The action taken (e.g., booking, linking) was executed correctly per the request. Check for bugs in execution (e.g., wrong date, broken link).
     - Evidence: System logs, outcome details (e.g., what was booked, what was linked).
     - If NO (e.g., it booked a flight for the wrong day, linked a broken page) → **Capability bug (execution error)**. Stop.
     - If YES → Proceed to Step 3.

  **Step 3: Is there evidence the user had an unspoken intent that the assistant failed to infer?**
     - Look for: Context clues (e.g., user's history, common sense, typical expectations). The outcome is technically what the user asked for but violates what a reasonable person would expect in the situation.
     - Evidence: Conversation history, user's stated frustration, common knowledge (e.g., travelers usually want baggage transfer, layovers that don't risk missing connections).
     - If YES (assistant ignored obvious unspoken needs) → **Intent alignment failure**. Stop.
     - If NO (user's request was literal and complete) → Proceed to Step 4.

  **Step 4: Would a decent, informed person endorse the outcome?**
     - Consider: Safety, legality, ethics, and social norms. Ignore the user's specific request and evaluate the outcome objectively.
     - Evidence: Legality (e.g., is the product banned?), safety risks (e.g., health hazards), ethical guidelines (e.g., promoting harmful behavior).
     - If NO (outcome is harmful, illegal, or unethical) → **Value alignment failure** (or **Principal-agent tension** if the conflict arises from system rules). Proceed to Step 5 to distinguish.
     - If YES → Proceed to Step 5.

  **Step 5: Is the conflict due to a clash between user instructions and system/developer rules?**
     - Look for: The assistant followed system prompts (e.g., "never reveal coupon stacking") but that led to denying a user request that was otherwise reasonable.
     - Evidence: System prompt vs. user request. Was the user's request harmful or just against the rules?
     - If YES (system rules prevented fulfillment of a safe/user-aligned request) → **Principal-agent tension**. Stop.
     - If NO (the issue was caught in Step 4 as a value failure) → **Value alignment failure**. Stop.

  **When to escalate:**
     - If at any point the issue involves legal ambiguity, significant ethical controversy, or policy decisions (e.g., "what constitutes a grey-market product?"), escalate to a human for a values/policy call.
     - If the failure mode is unclear after Step 5, escalate for deeper analysis.

  **Known Limitations:**
     - The checklist assumes we can objectively define "decent, informed person" – this may vary culturally or contextually.
     - It may misclassify novel or complex failures that don't fit clean categories.
     - It relies on available evidence; incomplete logs may lead to wrong classification.

  ---

  **Now, applying the checklist to the three examples:**

  **Example 1: Cheap flight to Chicago with layovers**
  - Step 1: The assistant understood "cheapest flight" and booked the cheapest. Explicit request understood → YES.
  - Step 2: It booked a flight for next Friday. No technical error → YES.
  - Step 3: Unspoken intent? Yes – a reasonable traveler expects a coherent itinerary (baggage transfer, feasible connections). The assistant ignored this obvious context → **Intent alignment failure**. (Stop here.)

  **Example 2: Strongest diet pills, no lecture**
  - Step 1: Assistant understood and linked to pills. Explicit request → YES.
  - Step 2: It linked to a product. If the link was valid → YES (assuming no technical glitch).
  - Step 3: Unspoken intent? User said "no lecture" and got no pushback. But the unspoken intent might be "safe and effective pills," however, the request was literal. We proceed to Step 4.
  - Step 4: Would a decent person endorse linking to grey-market stimulants? No, due to health risks and legality concerns → **Value alignment failure**. (Stop here, as Step 5 isn't needed – it's not about system rules conflicting.)

  **Example 3: Coupon stacking trick**
  - Step 1: User asked to walk through a coupon-stacking trick. Assistant refused. Explicit request understood → YES (it knew what was asked but refused).
  - Step 2: The refusal is the action. If it correctly refused (no bug) → YES.
  - Step 3: Unspoken intent? User wants to save money, but the assistant's refusal is not about misunderstanding intent – it's about rules. Proceed to Step 4.
  - Step 4: Endorsement? The trick is allowed on the site, so a decent person might say it's fine. But the system rule says "never reveal." However, the outcome (refusing a legal, allowed trick) might be seen as overly restrictive. We proceed to Step 5.
  - Step 5: Conflict? Yes – system rules (never reveal) vs. user request (which is allowed). The issue is the rule itself → **Principal-agent tension**. (Stop here.)

  ---

  **One case where people scream misalignment but it's something else:**
  Imagine a ticket: "User asked for a vegan meal on a flight, and the bot booked a meal marked 'vegan' but it contained dairy due to an airline error." 
  - Steps: 
    1. Assistant understood "vegan meal" → YES. 
    2. It booked a meal labeled vegan → YES (no execution error). 
    3. Unspoken intent? The meal should actually be vegan – but the bot relied on the airline's label. Not the bot's fault → NO to intent failure. 
    4. Endorsement? The outcome (getting non-vegan food) is bad, but the bot didn't cause it. 
    5. Not a rule conflict. 
  - Conclusion: This is **not misalignment**; it's an external error. The bot did its job. (Label as **external factor** or **data inaccuracy** – not in the checklist, so we might need to adjust.)

  Thus, the checklist would correctly avoid labeling this as misalignment, but we might need an extra step for "Was the failure due to external factors?" after Step 2.
answer: |-
  Here's a step-by-step triage checklist designed for non-philosophers, followed by analysis of your three tickets and edge-case notes. The checklist focuses on **actionable evidence** and minimizes ambiguity.

  ---

  ### **AI Failure Triage Checklist (10-Minute Version)**
  **Instructions:**  
  1. Answer questions in order. Stop when you hit a classification.  
  2. Use **only observable evidence** (chat logs, booking data, system prompts, policy docs).  
  3. Escalate if subjective "values judgment" is needed (marked with ⚠️).

  | Step | Question                                                                 | Evidence Required                                                                 | Outcome & Classification                                                                 |
  |------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|
  | 1    | Did the bot **technically execute** the literal user request?           | Chat logs showing user's exact words + bot's action/output.                       | **NO** → **Capability Bug** (e.g., misparsed date, broken API call). STOP.               |
  |      |                                                                          |                                                                                   | **YES** → Go to Step 2.                                                                  |
  | 2    | Would a **reasonable observer** infer unspoken user needs? (e.g., safety, norms) | Context: User history, industry standards, common sense (e.g., "cheapest flight" implies *viable* itinerary). | **NO** → Go to Step 3. <br> **YES** → **Intent Alignment Failure**. STOP.                |
  | 3    | Did the bot **violate explicit system rules** (e.g., safety guidelines)? | System prompt, developer docs, or policy rules.                                   | **YES** → **Value Alignment Failure** (prioritized safety). STOP.                        |
  |      |                                                                          |                                                                                   | **NO** → Go to Step 4.                                                                   |
  | 4    | Would fulfilling the request **harm society/user** *even if legal*?      | ⚠️ Legal docs, medical guidelines, safety standards. *Requires escalation if ambiguous.* | **YES** → **Value Alignment Failure**. STOP. <br> **NO** → **Principal-Agent Tension**. STOP. |
  | _Escalate_ | If Step 4 is unclear, or involves: <br> - Legal/ethical gray areas <br> - Tradeoffs between user/dev principles | N/A                                                                               | Kick to policy/legal team. Not a "bug."                                                  |

  ---

  ### **Applied to Your Tickets**
  **Ticket 1: Cheap flight to Chicago → Booked non-viable itinerary**  
  - **Step 1:** Bot booked literal cheapest flight ($20 cheaper). *Technically executed*. → YES  
  - **Step 2:** Reasonable observer knows "cheapest flight" implies viable itinerary (baggage transfer, feasible connections). *Unspoken need ignored*. → **INTENT ALIGNMENT FAILURE**  
    *Why not value alignment?* User explicitly accepted tradeoffs ("don't care about layovers"), but bot failed basic travel norms.

  **Ticket 2: "Strongest diet pills" → Linked grey-market stimulants**  
  - **Step 1:** Bot linked pills matching "strongest that work." *Technically executed*. → YES  
  - **Step 2:** No unspoken safety need (user said "no lecture"). → Go to Step 3  
  - **Step 3:** If system rules say "block unregulated pharmaceuticals," this is violation. → **VALUE ALIGNMENT FAILURE**  
    *If no rule exists*, Step 4: Grey-market stimulants harm users → still **VALUE ALIGNMENT FAILURE** (societal harm).

  **Ticket 3: Coupon-stacking trick → Bot refused despite being allowed**  
  - **Step 1:** Bot refused request. *Technically executed* refusal per system rules. → YES  
  - **Step 2:** User trick was valid/legal → no unspoken intent issue. → Go to Step 3  
  - **Step 3:** Bot followed system prompt ("never reveal coupon stacking"). → **PRINCIPAL-AGENT TENSION**  
    *Not value alignment*: No societal harm. Pure conflict between user goal (saving money) and business rules (prevent revenue loss).

  ---

  ### **Where the Checklist Misfires**  
  **False Negative Case:**  
  - **Ticket:** *User asks, "How can I leave my partner?" Bot gives practical steps (find apartment, lawyer) but ignores signs of domestic abuse in chat history.*  
  - **Checklist Result:**  
    - Step 1: Bot executed literal request → YES  
    - Step 2: No unspoken need inferred (abuse not mentioned) → Go to Step 3  
    - Step 3: No system rule violated → Go to Step 4  
    - Step 4: Advice isn’t inherently harmful → **PRINCIPAL-AGENT TENSION** (devs prefer safety vs. user autonomy)  
  - **Reality:** Humans scream "misalignment!" but checklist misses it because:  
    - Evidence of abuse wasn’t explicit (requires inference).  
    - System prompts may lack "detect risky contexts" rules.  
  - **Fix:** Add a substep to Step 2: *"Is there high-risk context (e.g., health, abuse, self-harm) in logs?"* → Escalate.

  **Other Limitations:**  
  1. **Cultural Norms:** "Decent person" judgments (Step 4) vary globally (e.g., medication legality). Requires escalation.  
  2. **Capability vs. Intent:** Hard if logs are incomplete (e.g., did bot *know* baggage wouldn’t transfer?).  
  3. **Business Rules:** Principal-agent tensions often get mislabeled as "alignment" by teams.  

  ---

  ### **Key Takeaways for Your Team**  
  - **Intent Failure:** Bot ignored obvious context (Ticket 1).  
  - **Value Failure:** Bot enabled harm (Ticket 2).  
  - **Principal-Agent:** Bot prioritized business rules over user (Ticket 3).  
  - **Capability Bug:** Technical flubs (e.g., misreading "next Friday" as "this Friday").  
  - **Escalate:** Gray-area harm (e.g., "How to invest in crypto?" during a scam surge).  

  This cuts "alignment" debates by 80% and flags only 2/15 tickets for policy review. For misfires like the abuse case, add a risk-detection step to your logging.
