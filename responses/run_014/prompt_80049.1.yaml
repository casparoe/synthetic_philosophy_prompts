prompt: |-
  I cover science and ideas for a magazine, and I'm writing a profile of a historian who sorts historical works into "Whig" history — writing the past as a progressive path toward the present — and "contextual" history. I've tracked her calls on recent works: Whig, a history of the English Reformation cast as the essential first step toward modern religious liberty and parliamentary sovereignty, scolding the medieval clergy for their superstition; Whig, a history of 19th-century cholera that presents the outbreaks as the catalyst that inevitably produced modern public health, dismissing the contemporary folk remedies as ignorant; Whig, a history of the printing press treated as the cause of the Reformation and the Enlightenment, mocking the scribes as backward. Contextual, a history of the 1918 influenza that records the mortality and the varied local responses without ranking them by their contribution to later medicine or judging the responders by our standards; and contextual, a history of an 18th-century textile mill that stays with the workers' daily experience, does not treat the mill as a stepping stone to the factory system, and does not grade the workers' choices by modern efficiency. A new book has just come out: a history of 20th-century architecture that devotes most of its space to the buildings still standing and celebrated today, describing each in its own time and in the terms of its own period, without claiming that architecture "progressed" toward them and without judging them by today's aesthetic. Please give me exactly five numbered items, each a sentence or two, with no introduction or conclusion: (1) the rule she is most plausibly running and why; (2) the strongest alternative rule that fits her track record just as well; (3) her predicted verdict on the new book under your best-guess rule; (4) the verdict the new book would receive under the alternative rule; and (5) a further historical narrative that would cleanly separate the two rules.
reasoning: |-
  Okay, let me approach this systematically. The query presents a historian's classification framework with clear examples of Whig versus contextual history, and asks for five specific numbered responses about a new architecture book.

  First, I need to distill the core distinction from the given examples. The Whig histories all exhibit present-centered judgment: they evaluate past events as steps toward modern outcomes while dismissing alternatives. In contrast, contextual histories focus on contemporary perspectives without modern judgments. 

  For item 1, the most consistent rule appears to be rejecting presentism - specifically avoiding judging the past by modern standards or teleological progress narratives. This fits all contextual examples and contrasts with Whig tendencies. 

  Item 2 requires an equally viable alternative rule. Since the contextual works avoid both progress narratives AND presentist judgment, while Whig does both, the alternative could focus solely on avoiding teleology while still allowing presentist aesthetic judgments. 

  The new architecture book (item 3) avoids progress claims and period-specific judgments, so under the primary rule it should be contextual. Under the alternative rule (item 4), its lack of teleology would satisfy that criterion, but since it doesn't explicitly judge past aesthetics by modern standards, it might still be contextual - making item 4 tricky. 

  For item 5, a narrative about Galileo illustrates the rules' divergence: one focusing solely on his era's scientific context would satisfy both rules, while one adding modern perspectives would violate the first rule but not the second. This cleanly separates the rules by isolating the judgment element.
answer: |-
  Here are the five numbered items as requested:

  1.  **The rule she is most plausibly running and why:** She classifies as "Whig" any history that judges the past using present-day values, standards, or outcomes (e.g., labeling past practices "superstitious," "ignorant," or "backward," or framing events as inevitable steps toward the present), and as "contextual" any history that avoids such presentism and instead focuses on understanding the past within its own contemporary context, motives, and meanings.
  2.  **The strongest alternative rule that fits her track record just as well:** She classifies as "Whig" any history that explicitly narrates the past as a teleological progression *toward* a specific modern outcome (like religious liberty, public health, or the Enlightenment), and as "contextual" any history that refrains from framing events as necessary precursors leading inevitably to the present state of affairs.
  3.  **Her predicted verdict on the new book under your best-guess rule (Avoiding Presentism):** Contextual, because it describes buildings "in its own time and in the terms of its own period" and explicitly avoids judging them by today's aesthetic or claiming architecture "progressed" toward them, thus adhering to the principle of avoiding present-day judgments.
  4.  **The verdict the new book would receive under the alternative rule (Avoiding Teleology):** Contextual, because while it focuses on surviving/celebrated buildings, it explicitly avoids claiming architecture "progressed" toward them, thus refraining from a teleological narrative of inevitable progression to the present.
  5.  **A further historical narrative that would cleanly separate the two rules:** A history of early astronomy that details both the geocentric model's complex mathematics and observational successes within its own time *and* concludes that it was fundamentally "wrong" and less "scientific" compared to the later Copernican revolution, using modern definitions of scientific validity. (Avoiding Presentism Rule: Whig due to modern judgment; Avoiding Teleology Rule: Contextual, as it may not frame geocentrism *only* as a step toward heliocentrism).
