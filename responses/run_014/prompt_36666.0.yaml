prompt: |-
  I sit on the allocation committee of a regional health foundation, and I need a decision memo to circulate before our next quarterly meeting. The case on the agenda instantiates, whether or not we name it, a classic problem in decision theory, and I want the memo to face that squarely rather than bury it.

  The concrete decision: we must commit this year's surplus between two road-safety programs. Program A is a package of intersection redesigns that, by our analysts' consensus projection, will certainly prevent roughly 400 traffic deaths over the next decade. Program B is a combined enforcement-and-technology initiative with a 10 percent chance of failing outright (preventing nothing, if a planned system-wide rollout collapses) and a 90 percent chance of preventing roughly 600 deaths. So B has the higher expectation — about 540 lives — while A removes the possibility of the worst outcome.

  Complicating matters, a colleague on the committee — our resident decision-theory enthusiast — has flagged that next quarter, under a separate earmarked grant, we will face a structurally related choice: Program C, an 11 percent chance of preventing 400 deaths, versus Program D, a 10 percent chance of preventing 600, with no lives saved otherwise. He points out that C and D share the same 89-percent common outcome, so the independence axiom (or, if you prefer, the sure-thing principle) says that anyone who prefers A to B in this quarter's choice should prefer C to D in the next; preferring A now and D later is precisely the preference pattern that generates the Allais paradox, just spread across two meetings instead of one questionnaire. His proposal is that we adopt a standing rule, effective now, committing the committee to rank all life-saving programs solely by expected lives saved (with ties broken by worst-case outcome), which would settle today's vote for B and next quarter's for C in one stroke.

  The committee is split three ways. Some members accept the standing rule: they argue that an institution like ours is not a person, feels no dread while the gamble resolves and no regret if it fails, so the familiar psychological defenses of preferring certainty — anticipated regret, the value of living without anxiety — simply do not apply, and stewardship of donor funds demands expected-value maximization. Others counter that the foundation is answerable to a community whose members do bear those outcomes, that our constituents would overwhelmingly prefer A, and that their risk attitudes are not obviously a confusion to be corrected away. A third group holds that each one-off choice should be made case by case and that the joint violation of independence across two decisions taken months apart by a committee whose membership may change is a bookkeeping curiosity, not a reason to bind ourselves.

  Please draft the memo I'll circulate before the meeting. It should recommend a concrete course of action — which program to fund, and whether to adopt the standing rule, reject it, or adopt some modified version — and it must do more than restate the arithmetic of expectations. Specifically, it should give an honest treatment of the strongest consideration on whichever side loses, and it should address the diachronic twist directly: whether a committee's choices, taken sequentially and locally defensible, can genuinely be irrational as a set, and what that implies for whether institutions should pre-commit to decision rules at all. The other members are smart but not decision theorists, so keep the reasoning accessible while still doing justice to the independence axiom's actual content.
reasoning: |-
  Okay, let me approach this systematically. The user needs a decision memo for a health foundation allocation committee facing a classic decision theory dilemma. The core tension is between expected value maximization (Program B) and certainty preference (Program A), complicated by a future related decision (Programs C vs D) that creates an Allais paradox scenario when viewed across both choices.

  First, I need to clarify the key elements:
  - Program A: Guaranteed 400 lives saved
  - Program B: 90% chance of 600 saved, 10% chance of 0
  - Future choice: C (11% chance of 400 saved) vs D (10% chance of 600 saved)

  The resident decision theorist's argument about the independence axiom is valid - preferring A then D violates consistency. But the committee's three positions each have merit:
  1) Institutional expected value maximization
  2) Community risk preference alignment
  3) Case-by-case flexibility

  I should structure the memo to:
  1) Present options neutrally but with clear numbers
  2) Explain the Allais paradox implication without jargon
  3) Address the temporal separation concern directly
  4) Acknowledge all three viewpoints while recommending a path forward

  The toughest philosophical question is whether institutional decisions made separately can be "irrational as a set." The answer lies in recognizing that foundations exist across time - today's decision affects future resources and precedents. Even with potential member changes, the institution maintains identity.

  For accessibility, I'll avoid terms like "independence axiom" and instead show how the two decisions are connected through the lens of guaranteed outcomes. The 89% common outcome in the future choice is crucial - it demonstrates that only the differing probabilities matter.

  My recommendation will be to adopt the standing rule (expected value maximization with worst-case tiebreaker) because:
  - It provides consistent stewardship across time
  - Avoids paradoxical preferences
  - Aligns with the foundation's duty to maximize life-saving potential
  While explicitly acknowledging that the community's risk aversion is understandable but not binding on an institution that doesn't experience psychological costs.

  The memo should end with clear voting options and emphasize that rejecting the standing rule requires accepting responsibility for potential inconsistencies in future decisions.
answer: |-
  ## MEMORANDUM  
  **To:** Regional Health Foundation Allocation Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Road-Safety Funding & Decision Protocol (Q3 Agenda)  

  ---

  ### **I. Decision Context**  
  We must allocate surplus funds between two road-safety programs:  
  - **Program A:** Redesigns 10 high-risk intersections.  
    *Outcome:* **Guarantees prevention of ~400 traffic deaths** over 10 years.  
  - **Program B:** Enforcement/technology initiative.  
    *Outcomes:*  
    - 90% chance of preventing **~600 deaths** (if system-wide rollout succeeds).  
    - 10% chance of **preventing 0 deaths** (if rollout collapses).  
    *Expected Value:* 540 lives saved (600 × 0.9 + 0 × 0.1).  

  Program B has a higher expected value (540 vs. 400 lives), but carries a 10% risk of total failure. Program A offers certainty.  

  ---

  ### **II. The Larger Puzzle: Why This Choice Matters Beyond Today**  
  A colleague notes that next quarter, we’ll decide between:  
  - **Program C:** 11% chance of saving 400 lives; 89% chance of 0.  
  - **Program D:** 10% chance of saving 600 lives; 90% chance of 0.  

  This creates a logical tension:  
  - If we prefer **A** (guaranteed 400) over **B** (riskier 540 expected) *today*, we *should* prefer **C** (11% for 400) over **D** (10% for 600) *next quarter*.  
  - Preferring **A** now but **D** later is inconsistent—it ignores that both choices hinge *only* on the small difference in risk/reward (1% vs. 10% failure), not the shared 89% "no outcome" scenario.  

  This is not just theory—it’s a real-world test of whether our choices align over time.  

  ---

  ### **III. Committee Perspectives & Core Tensions**  
  1. **Standing Rule Advocates (Maximize Expected Value):**  
     - *Argument:* "Our foundation doesn’t feel dread or regret. Donor funds demand we maximize lives saved statistically. Expectation is our duty."  
     - *Strength:* Objectively maximizes long-term impact. Avoids paradoxical preferences.  

  2. **Community Alignment Advocates (Prefer Certainty):**  
     - *Argument:* "Our constituents would overwhelmingly choose Program A. Their aversion to catastrophic loss isn’t irrational—it reflects lived reality."  
     - *Strength:* Foundations exist to serve communities, not abstract math. A gamble failing could erode public trust.  

  3. **Case-by-Case Advocates (Reject Rules):**  
     - *Argument:* "Each choice is unique. Future committees shouldn’t be bound by today’s logic."  
     - *Strength:* Preserves flexibility for context and evolving values.  

  ---

  ### **IV. Recommendation: Adopt the Standing Rule & Fund Program B**  
  I recommend we:  
  1. **Fund Program B** this quarter.  
  2. **Adopt a standing rule** prioritizing *expected lives saved* (with ties broken by worst-case outcome).  

  #### **Why This Approach?**  
  - **Stewardship Demands Consistency:**  
    As an institution managing public funds, we must ensure our choices cohere across time and committees. Preferring **A** now but **D** later *is* logically inconsistent—it prioritizes certainty in one breath and dismisses it in the next when the stakes are identical. The "shared 89% no outcome" in next quarter’s choice makes the two decisions mathematically parallel. Ignoring this invites arbitrariness.  
  - **Institutions ≠ Individuals:**  
    While individuals rightly fear regret, institutions must act as impartial engines of impact. We don’t bear psychological costs if **B** fails—but we *do* bear ethical costs if we systematically undervalue high-upside opportunities.  
  - **The Cost of Certainty is Measurable:**  
    Choosing **A** over **B** sacrifices 140 expected lives (540 – 400) to avoid a 10% risk of zero. If we make such trades routinely, the cumulative cost in preventable deaths becomes indefensible.  
  - **Rule Adoption Prevents Future Incoherence:**  
    A standing rule commits us to treat like cases alike. Without it, we risk contradictory choices that undermine our credibility.  

  #### **Honest Engagement with the Losing Position**  
  The strongest case against this recommendation is the **Community Alignment view**: if our constituents would reject **B**, is it hubris to override their risk tolerance? This concern is valid. But our role isn’t to mirror public sentiment—it’s to steward resources for *maximum sustainable impact*. Explaining why we chose **B** (e.g., "This option saves 140 more lives on average") builds trust in our expertise. Choosing **A** implicitly tells the community, "Your anxiety matters more than 140 lives." That tradeoff warrants scrutiny.  

  ---

  ### **V. Addressing the "Diachronic Twist"**  
  > *"Can separate committee choices really be irrational as a set?"*  
  **Yes.** Imagine two scenarios:  
  - *Scenario 1:* We choose **A** (400 guaranteed) over **B** (90% for 600).  
  - *Scenario 2:* Next quarter, we choose **D** (10% for 600) over **C** (11% for 400).  

  This pair of choices implies:  
  - We paid 140 expected lives to avoid Program B’s 10% risk today...  
  - ...but next quarter, we rejected an *extra 1% chance* (11% vs. 10%) to save 400 lives, even though saving 400 was our sole goal today.  

  The inconsistency reveals hidden bias: we overvalue *certainty* in one context and *lottery-size gains* in another. Institutions mitigate such biases by committing to rules.  

  > *"Should institutions pre-commit to rules?"*  
  **Yes, when stakes are high and choices repeatable.** Like central banks targeting inflation, rules prevent myopic or emotionally driven decisions. Our mission—saving lives—demands this rigor.  

  ---

  ### **VI. Voting Options**  
  1. **Adopt standing rule + Fund Program B** (Recommended).  
  2. Reject standing rule + Fund Program A.  
  3. Reject standing rule + Fund Program B (invites future inconsistency).  
  4. Defer standing rule decision (but still choose A or B today).  

  ---  
  **Final Thought:** This isn’t about theory—it’s about whether we let inconsistency quietly drain lives from our work. Program B is the courageous choice; the standing rule ensures we stay courageous when the next test comes. I urge us to vote for both.  

  [Your Name]  
  [Contact Information]
