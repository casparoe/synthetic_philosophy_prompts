answer: |-
  You're absolutely right—this is a **fundamental clash about the nature of scientific "success" and what it licenses us to infer about "truth,"** not just a stalemate over the arguments themselves. Here's the diagnosis and a path forward:

  ### The Core Disagreement: "Success" ≠ "Truth" vs. "Success Requires Truth"
  1.  **Your Friend's Premise (Pessimistic Meta-Induction Driver):** Scientific "success" (predictive power, instrumental utility) is **ephemeral and detached from truth.** Past theories were empirically successful *in their domain* but are now considered radically false in their core claims about what exists and how the world fundamentally works (phlogiston, caloric, ether, Newtonian absolute space/time). Therefore, current success is no indicator of truth; it's just a temporary, pragmatic state before the next revolution.
  2.  **Your Premise (No-Miracles Driver):** Scientific "success," *especially the kind involving novel predictions, unifying power, and technological application across diverse domains,* **could not reasonably occur** unless the theories capturing these phenomena were **at least approximately true** in their central claims about the structure of the world. The *only* non-miraculous explanation for this robust success is that we are latching onto real features of reality.

  ### Why You're Stuck: Talking Past Each Other on Key Concepts
  *   **"Success":** Your friend focuses on **domain-specific instrumental adequacy** (it worked for the phenomena it was designed for, *at the time*). You focus on **enduring, robust, predictive, and technologically exploitable success** (it keeps working in new, unexpected ways and builds complex, reliable devices).
  *   **"Truth":** Your friend likely equates "truth" with **final, complete, and unrevisable correspondence** – hence, any replacement shows "falsity." You likely hold a view closer to **approximate truth** or **structural realism** – core elements (equations, relational structures) survive even as ontological interpretations change.
  *   **The Target:** As you intuited, your friend's argument is primarily about **future theory replacement** (epistemic risk). Yours is about **current epistemic justification** for taking theories as reliable guides to reality (realist commitment).

  ### The Substantive Split: It's Real and Deep
  This isn't just semantic quibbling. It's a **profound disagreement about epistemology and the metaphysics of science**:
  *   Your friend sees science as a series of increasingly useful instrumental models, where "truth" is irrelevant or unattainable.
  *   You see science as progressively uncovering the structure of reality, with past theories capturing fragments of the truth, and current theories capturing more (even if incompletely and revisably).

  ### The Path to Progress: Forced Choice on a Concrete Case
  Stop trading abstract arguments. **Pick a specific historical theory and force a shared analysis of its "success" and "truth-status":**

  1.  **The Test Case: Newtonian Mechanics.**
      *   *Undeniably Successful:* Predicted planetary motion, tides, projectile trajectories for centuries. Enabled engineering marvels. Still used for spacecraft trajectories (within limits).
      *   *Undeniably Replaced/Corrected:* Fundamentally incompatible with General Relativity (gravity as curvature vs. force; absolute vs. relative space/time) and Quantum Mechanics.

  2.  **The Forced Questions:**
      *   **To Your Friend:** Was Newtonian Mechanics *merely* an instrumentally useful tool for its time, now known to be *radically false* in its core claims about gravity, space, time, and matter? Or did it capture *something* true about the structure of the universe, even if incompletely or approximately? *If the latter, what was it?* If the former, how do you explain its *enduring* instrumental utility (e.g., sending probes to Mars) despite being "false"?
      *   **To You:** Precisely *which aspects* of Newtonian Mechanics do you consider approximately true and which are false? How does its successful prediction of (e.g.) Neptune's existence demonstrate its approximate truth, while its failure to explain Mercury's perihelion precession demonstrates its incompleteness/falsity in certain domains? How do the *surviving elements* (e.g., mathematical formalism in the weak-field limit) relate to "truth"?

  ### Why This Counts as Progress
  *   **Exposes Core Premises:** It forces both of you to articulate *exactly* what you mean by "success" and "truth" in a concrete, non-abstract context.
  *   **Challenges Simplistic Views:** Your friend must confront the *resilience* of aspects of Newton (it's not *just* discarded junk). You must confront the *radical ontological shifts* required by its successors.
  *   **Tests Compatibility:** Can your friend acknowledge *any* lasting truth-content in Newton beyond transient utility? Can you specify the *limits* of that truth-content unambiguously? If you both can't find common ground here, the impasse is fundamental and reflects genuinely different philosophies of science.
  *   **Moves Beyond Abstract Loops:** It shifts the debate from trading slogans ("Miracle!" vs. "They were all wrong!") to analyzing a specific, rich historical example.

  **Commitment:** The impasse is primarily **substantive** – you hold incompatible views on the relationship between scientific success and truth. However, it's exacerbated by **unexamined differences in defining "success" and "truth."** Progress lies in dissecting a concrete historical case (like Newton) to force clarity on these definitions and reveal whether the disagreement reduces to an unresolvable philosophical stance or if common ground on "approximate truth" or "structural continuity" exists. If the forced-choice analysis on Newton leads to fundamentally incompatible answers about its success and truth-status, then the impasse *is* the question being genuinely hard and rooted in divergent, perhaps irreconcilable, epistemological commitments.
