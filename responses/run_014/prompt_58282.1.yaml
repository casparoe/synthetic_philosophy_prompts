  Many English counties prosecute owners for neglecting pet dogs yet licence intensive poultry units in the same area where chickens with comparable capacities for pain are kept in far harsher conditions. What view of moral standing and moral progress does that paired practice presuppose, if any? Does it presuppose that the moral circle has genuinely expanded to include companion animals but not farmed birds, or can it be explained without any such moral commitment, for instance by appeal to property relations, human sentiment, or tractability? Please reconstruct the implicit theory as charitably as you can, distinguish what the practice strictly requires from what it merely fits well with, and consider whether its two halves presuppose consistent ideas. To test your account, consider a council proposal to extend cruelty protections to laboratory octopuses whilst continuing to exempt farmed prawns, and explain how your reconstruction would classify that move as progress, backsliding, or neither. Finally, say what would have to change in law and enforcement if the underlying view were replaced by a straightforward sentience-based standard that favoured equal consideration of comparable suffering. Please answer in American English, with no headings, bullet points, bold text, or tables, but in continuous prose only as one would write in an email or a letter.
