prompt: |-
  My co-op is trying to pick which of three contractors to hire for a renovation, and we're voting by ranked choice. I'm noticing people are already gaming it — a couple folks are putting their second-favorite first because they think their real favorite is a long shot and they're terrified of the guy they hate getting it. I got frustrated and said we should just use a different voting system where no one has an incentive to lie about their preferences. My housemate (math PhD, insufferable about it) smirked and said "that's literally impossible, there's a theorem." Is he right? Like, is there genuinely no voting method for three or more options where your best strategy is always to vote honestly? Give me the bottom line in one paragraph, and if there's a theorem I should know the name of, tell me.
reasoning: |-
  Okay, the user is dealing with a co-op voting situation where people are strategically misrepresenting their preferences in a ranked-choice vote. Their housemate, a math PhD, mentioned a theorem proving that no voting system can always prevent this. I need to confirm if that's true and explain it simply.

  First, I recall Arrow's Impossibility Theorem. It states that no ranked voting system can meet all fairness criteria when there are three or more options. One key point is that no system can guarantee that voters never benefit from strategic voting—that's the Gibbard-Satterthwaite Theorem. 

  The user wants a concise answer. They’re frustrated with gaming in their vote and want honesty. Their deeper need is likely for a fair, strategy-proof method, but the theorems say that’s impossible. I should explain why strategic voting is unavoidable in any system with three or more choices. 

  I should mention both theorems: Arrow’s for the broader context and Gibbard-Satterthwaite for the strategic voting part. The user might also want reassurance that their situation is normal, not due to a flawed system. Emphasize that no system is perfect, but some might reduce incentives better than others, though that’s complex. 

  Keep it to one paragraph as requested, name the theorems, and state the bottom line clearly: yes, it’s impossible to always have honest voting as the best strategy.
answer: |-
  Yes, your housemate is fundamentally correct. **For any voting system choosing between three or more options, there is no possible method where it is *always* in every voter's best strategic interest to rank the candidates honestly according to their true preferences.** This is a mathematical impossibility theorem.

  The key theorem here is the **Gibbard-Satterthwaite Theorem** (often mentioned alongside Arrow's Impossibility Theorem, which addresses slightly different fairness criteria). Gibbard-Satterthwaite rigorously proves that *any* voting system satisfying basic fairness conditions (like allowing voters to express any preference order and not having a single dictator) will be susceptible to **strategic voting** (sometimes called "tactical voting" or "gaming the system"). In certain situations, some voters will achieve a better outcome by misrepresenting their true preferences (e.g., ranking a less-preferred but more "viable" candidate higher, as you're seeing).

  **Bottom line:** Unfortunately, there is no perfect voting system. Strategic voting is an inherent vulnerability when choosing among three or more alternatives. Your co-op members are behaving rationally given the system's limitations. While some systems (like ranked choice) might be *better* or *worse* at reducing incentives for dishonesty in specific scenarios, Gibbard-Satterthwaite proves that no system can eliminate the incentive entirely for every possible set of voter preferences.
