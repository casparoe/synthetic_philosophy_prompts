prompt: |-
  I'm trying to get a case for a seminar that seperates two things people collapse: actually making a difference to a collective harm, and being responsible for your role in a joint practice that produces the harm. Can you build me a scenario where the wouldn't-have-mattered-anyway objection is true in the strongest sense -- the person's act is not a difference maker for the harm -- but the person is still clearly doing wrong? Constraints: one paragraph, realistic (workplace, hospital, or local infrastructure), diffuse collective harm, no single identifiable victim, no expected utility reasoning, no if-everyone-did-it, no exotic physics or perfect predictors. After the scenario, walk through why the act is not a difference maker, why the person is still responsible, and what a defender of the objection would say to block the case. Tell me which feature is doing the work and whether the case collapses if I remove it.
