answer: |-
  Here's the scenario:

  In a large hospital pharmacy, chemotherapy bags are prepared daily for hundreds of cancer patients using precise, automated compounding machines. A safety protocol mandates technicians visually confirm the drug concentration setting on each machine before starting a batch, as a final check against rare but catastrophic software glitches. The harm is diffuse: a slight, undetectable-to-the-individual reduction in long-term survival probability across the entire patient cohort if under-dosing occurs. Technician Maya, rushing to leave early, knowingly skips the visual check on her assigned machine for a large batch of a common drug. Unbeknownst to Maya, the machine *was* malfunctioning that day and consistently under-dosed the bags. However, the hospital's routine end-of-day automated system calibration check (a separate process) detected and flagged the under-dosing error *before* any bags were distributed. The batch was discarded and remade correctly; no patient received under-dosed medication.

  **Why it's not a difference maker:** Maya's act (skipping the check) made **no difference** to the harm (patients receiving under-dosed chemo). The under-dosing *did* occur due to the malfunction, but the *harm* (patients getting that under-dosed chemo) was **entirely prevented by the later calibration check.** Her skipping the visual check was causally irrelevant to the final outcome for patients; the harm would have been prevented identically whether she did the check or not. The calibration check was the actual difference-maker preventing harm.

  **Why she's still responsible:** Maya violated a core, non-negotiable safety protocol designed specifically to prevent catastrophic harm. Her role as a technician inherently carries the responsibility to perform these critical checks as part of a joint practice (safe medication preparation). By skipping it *knowingly* and *without justification*, she failed in her duty of care and breached professional standards, regardless of the fortuitous intervention by the later system. She actively participated in undermining the safety net, making the system rely solely on the backup (calibration) through her negligence.

  **Defender's Objection & Block:** A defender of the "wouldn't-have-mattered-anyway" objection would argue: "Exactly! No harm occurred *because* of the calibration check, proving Maya's action was inconsequential. Holding her responsible for harm is incoherent when her act demonstrably changed nothing for the patients. Blame requires causation, which is absent here. We might reprimand her for rule-breaking, but not for causing or risking harm in this instance."

  **Feature Doing the Work:** The **presence of a reliable, independent backup system (calibration check) that intervenes *after* the negligent act but *before* the harm manifests** is crucial. This backup severs the causal chain between Maya's act and the *actualized* harm, making her act a non-difference-maker.

  **Does it collapse without this feature?** **YES.** Without the independent backup system that reliably prevents the harm *despite* her negligence (e.g., if the bags went straight to patients), Maya's act *would* very likely be a difference-maker for the harm (patients getting under-dosed chemo). The case relies entirely on this backup to demonstrate that her specific act made no difference to the outcome, while her responsibility stems purely from her role violation within the safety-critical practice. Remove the backup, and causation becomes plausible, undermining the "strongest sense" of the objection.
