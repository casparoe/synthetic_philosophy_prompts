prompt: |-
  I'm taking a philosophy of science seminar this term and I keep running into a pattern that I can't put a name to, and I've been trying to figure out if its already been carved out somewhere. The setup is the standard one: you've got two rival theories, say T1 and T2, and they're underdetermined by the evidence because the same data fits both. So far so good, I get that. But then the discussion shifts, and someone points out that the "evidence" isn't actually a fixed, theory-neutral set of observations. The observations you can make, and even how you record them, depend on which theory you're working with. So T1 and T2 don't actually agree on the same evidence — each one comes bundled with its own set of observations, and there's no view from nowhere to say which set is the "real" one.

  To make it concrete: imagine two accounts of some physical system, and the measurements you'd do to tell them apart require instruments and background assumptions that are themselves shaped by the theory you're testing. So the raw data is already cooked by the theory before you even compare the two. I've seen people talk about the theory-ladenness of observation, but that feels like it's about how you interpret a particular observation, not about the fact that the very set of observations available to you is different under each theory. And it's not quite the Duhem-Quine thing either, which is about not being able to test a single hypothesis in isolation from its auxiliaries. I'm after something more radical: the evidence itself is theory-relative, so the underdetermination isn't just "the data underdetermines the theory" but "the data is part of the theory."

  Does this have a name? If there's an established concept, what is it, and how does it differ from theory-ladenness and from Duhem-Quine, and which of those is the closest fit? If there isn't a name, can you coin one and define it carefully, including the boundary cases, like where it stops being "the evidence is theory-relative" and starts being just plain underdetermination with a fixed evidence set? I'd rather have a careful account of exactly what this thing is and isn't than a bare label. Think very carefully before answering, and respond in the style of someone who works in the philosophy of science and has thought about this a lot.
reasoning: |-
  Okay, the user is in a philosophy of science seminar and has encountered a conceptual problem they're struggling to name. They describe a scenario where two rival theories aren't just underdetermined by evidence, but where the evidence itself seems theory-relative. The user distinguishes this from theory-ladenness of observation and the Duhem-Quine thesis, wanting to know if there's an established term or if we should coin one.

  First, I need to unpack their core concern. They're pointing out that under T1 and T2, the available observations themselves differ because the theories shape what counts as observable, what instruments are valid, and how data is recorded. This isn't just about interpreting the same data differently (theory-ladenness) or about holistic testing (Duhem-Quine). It's more radical: the evidence sets are incommensurable because they're theory-constituted.

  The closest existing framework is Kuhn's paradigm concept, specifically "paradigm-relative phenomena." Kuhn argued that during scientific revolutions, the "data itself" changes because paradigms define legitimate problems, methods, and standards. What counts as an observation in Aristotelian physics versus Newtonian physics isn't just interpreted differently—it's a different set of things. Similarly, in their physical system example, T1 might require instrument A (which only makes sense under T1's ontology), while T2 uses instrument B (meaningless in T1's framework). So the evidence isn't neutral ground but internal to each theoretical framework.

  To differentiate this from theory-ladenness: theory-ladenness says "the same X is seen as Y under T1, Z under T2." What the user describes is "T1 has X-observations, T2 has Z-observations—they don't even share X as a common datum." And versus Duhem-Quine, which is about interconnected hypotheses, this is about the evidential basis being fractured from the start.

  Since no single term fully captures this, I propose "Theory-Constituted Evidence" (TCE). It emphasizes that evidence isn't merely selected or interpreted but constructed by the theory's conceptual apparatus. Boundary cases would include: (1) when theories share instrumentation/ontology (just underdetermination), (2) when divergence is only in interpretation (theory-ladenness), or (3) when auxiliaries differ but evidence remains commensurable (Duhem-Quine). TCE requires incompatible observational frameworks.

  The user clearly wants precision—they asked for careful boundaries, not just a label. They're likely frustrated by seminar discussions glossing over this nuance. By naming TCE and contrasting it sharply with existing concepts, we validate their insight and give them tools to elevate the discourse. Their unspoken need might be to articulate why some scientific disagreements feel unresolvable: not due to lacking data, but because rivals inhabit different evidential worlds.
answer: |-
  You've hit upon a profoundly deep and contentious issue at the heart of philosophy of science. What you're describing goes beyond standard underdetermination, theory-ladenness, and Duhem-Quine holism. It's a more radical form of **epistemic incommensurability concerning the constitution of evidence itself**. While there isn't a single universally agreed-upon label, the closest established concept is **Kuhnian "Paradigm-Relative Phenomena"** (or "Theory-Constituted Data"), though it requires careful disambiguation. Let me dissect this systematically:

  ### Core Concept: Theory-Constituted Evidence (TCE)
  **Definition:** The set of *legitimate observations* or *admissible evidence* for evaluating a scientific theory is not fixed or theory-neutral, but is *ontologically and epistemically constituted by the theoretical framework itself*. T1 doesn't merely *interpret* pre-existing data differently than T2; it *generates a different universe of possible observations*. The "data" for T1 are artifacts of T1's conceptual structure, instrumentation, and ontological commitments, and may be unrecognizable or non-existent from T2's perspective (and vice versa).

  ### Key Distinctions from Neighboring Concepts
  1.  **Vs. Standard Underdetermination (UD):**
      *   **UD:** Theories T1 and T2 are logically compatible with the *same fixed set of observation statements O*.
      *   **TCE:** There *is no shared set O*. T1 operates with evidence set E1, T2 with evidence set E2. E1 and E2 overlap minimally or not at all because they are generated by incompatible theoretical apparatuses. *Underdetermination becomes moot because there's no common evidential ground.*
      *   *Boundary Case:* If E1 and E2 share a core of "basic" observations (e.g., pointer readings, bare sensory reports) interpreted differently, it slides towards theory-ladenness. TCE asserts E1 and E2 may lack even *that* common core.

  2.  **Vs. Theory-Ladenness of Observation (TLO):**
      *   **TLO:** A *given* sensory stimulus or instrumental output ("raw datum") is *interpreted*, categorized, or described differently depending on the background theory. The "raw datum" is prior to interpretation (e.g., a cloud chamber track exists; T1 calls it an electron, T2 calls it an artifact).
      *   **TCE:** The *very existence and accessibility* of the sensory stimulus or instrumental output *depends* on the theory. T1's instruments (designed using T1's principles) generate outputs that are meaningless noise or don't exist within T2's framework (and vice versa). There *is no "raw datum" independent of the theory's constitutive framework.*
      *   *Boundary Case:* If theories merely disagree on the *significance* or *categorization* of instrument readings *that both can obtain*, it's TLO. TCE kicks in when the instruments/observations *themselves* are theory-specific artifacts.

  3.  **Vs. Duhem-Quine Holism (DQ):**
      *   **DQ:** A single hypothesis H cannot be tested in isolation; it is embedded in a web of auxiliary assumptions (A). Failure of a prediction implicates the whole H+A complex. Different theories (T1, T2) can save the phenomena by adjusting different parts of their auxiliary webs *relative to a common body of evidence*.
      *   **TCE:** The problem is deeper than adjusting auxiliaries. The *evidence against which auxiliaries are adjusted* is itself theory-relative. T1 and T2 aren't just protecting different parts of their webs *from* evidence; they are *operating with different webs of evidence*. DQ assumes a shared evidential language; TCE denies it.
      *   *Boundary Case:* If auxiliaries differ but the observations described (e.g., "the dial reads 5.3") remain stable and meaningful across theories, it's DQ. TCE arises when the act of "reading the dial" and its significance as *data* is theory-constituted.

  ### The Closest Fit: Kuhn's Radical Legacy
  Thomas Kuhn's *The Structure of Scientific Revolutions* (1962/1970) comes closest to your description, especially his concepts of:
  *   **Paradigms:** Encompassing theories, methods, standards, instrumentation, and exemplars. Paradigms define what counts as a legitimate problem, a valid solution, and crucially, **relevant phenomena**.
  *   **World-Change:** Scientists working in different paradigms "live in different worlds." What is an observable phenomenon in one paradigm may be invisible, nonsensical, or non-existent in another. E.g., Aristotelian "natural motion" vs. Newtonian "inertia"; phlogiston "dephlogisticated air" vs. oxygen.
  *   **Incommensurability (Partial):** Not merely untranslatability of terms, but incompatibility in the *standards of evidence* and the *problems deemed significant*. The "data" supporting one paradigm often cannot be formulated within the conceptual scheme of its rival.

  **Why "Paradigm-Relative Phenomena" (PRP) is the best existing label:** It explicitly captures that what *counts as a phenomenon* worthy of being evidence is determined by the overarching paradigm. The phenomena aren't "out there" waiting to be observed neutrally; they are brought into existence *as evidence* by the paradigm's conceptual and instrumental toolkit.

  ### Coining a Term: Theory-Constituted Evidence (TCE)
  If "Paradigm-Relative Phenomena" feels too tied to Kuhn's broader (and contested) framework, a more precise, descriptive term capturing your core insight is **Theory-Constituted Evidence (TCE)**.

  **Careful Definition of TCE:**
  A situation holds between rival theories T1 and T2 iff:
  1.  **Constitutive Dependence:** The set of observations E1 considered admissible evidence for T1 *cannot be generated or identified* without presupposing the core ontological, causal, or instrumental principles of T1. Similarly for E2 and T2.
  2.  **Mutual Exclusivity in Practice/Access:** The methodologies, instruments, or conceptual frameworks required to produce/recognize E1 are incompatible with the core tenets of T2 (rendering E1 inaccessible or meaningless within T2), and vice versa for E2 within T1.
  3.  **Lack of Neutral Arbiter:** There exists no theory-neutral observation language or set of "basic" data (e.g., sense data, protocol sentences) that can meaningfully describe elements of both E1 and E2 without begging the question in favor of one theory or the other.
  4.  **Evidential Autonomy:** The warrant for T1 is primarily derived from its ability to account for E1 *on its own terms*, and similarly for T2 and E2. Attempts to "translate" E1 into T2's framework (or vice versa) fundamentally distort or destroy the evidential relationship E1 bears to T1.

  **Boundary Cases & What TCE is NOT:**
  *   **Not Just Novel Prediction:** T1 predicting a *new type* of observation discoverable *later* (e.g., Neptune, Higgs boson) isn't TCE. TCE involves the *current, fundamental evidence base* being theory-constituted. If the new observation becomes a shared datum, it may move towards UD or TLO.
  *   **Not Instrumental Refinement:** Developing a *more sensitive version* of an existing instrument type (e.g., a better telescope) isn't TCE. TCE involves instruments embodying *incompatible physical principles* (e.g., caloric-based vs. kinetic-theory-based thermometers).
  *   **Not Mere Data Selection Bias:** Choosing to look only where your theory predicts isn't TCE. TCE asserts that *what you can perceive as data* in that location is theory-constituted.
  *   **Not Foundationalism Failing:** The failure to find certain "basic" observations isn't TCE. TCE denies the *existence or possibility* of such theory-neutral basics relevant to the theories in question.
  *   **Weak TCE vs. Strong TCE:** *Weak TCE* might admit some minimal shared "perceptual core" (e.g., shapes, colors) but argues it's scientifically irrelevant. *Strong TCE* denies even this shared core has stable meaning across frameworks. Your physical system example leans towards Strong TCE.

  ### Philosophical Significance & Challenges
  TCE (or PRP) represents a profound challenge to:
  *   **Realism:** If evidence is theory-constituted, how can it arbitrate between theories claiming to describe a mind-independent world?
  *   **Rational Theory Choice:** How can scientists compare T1 and T2 if they lack common standards of evidence and possibly even common meanings?
  *   **Progress:** Does science accumulate knowledge, or merely shift between incommensurable frameworks?

  **Responses:** Some (e.g., Post-Kuhnian rationalists like Shapere, Laudan) argue shared standards *do* emerge ("local commensurability"). Others (e.g., Hacking's "entity realism") point to manipulability as a theory-neutral anchor ("If you can spray them, they are real"). Pragmatists focus on problem-solving effectiveness within a framework.

  ### Conclusion
  You've identified a core implication of the most radical interpretations of the **historical/sociological turn** in philosophy of science, epitomized by Kuhn's **paradigm-relativity of phenomena** or **theory-constituted evidence (TCE)**. It moves beyond underdetermination (shared evidence), theory-ladenness (interpretation of shared stimuli), and Duhem-Quine (adjusting auxiliaries against shared evidence) to argue that the **very fabric of scientific evidence is woven by the theoretical loom itself**. There is no "view from nowhere"; the data is indeed "part of the theory" in its deepest constitutive sense. This remains one of the most challenging and debated ideas in the field. Your concrete example of rival physical accounts with theory-dependent instruments is a perfect illustration of Strong TCE. When discussing it, emphasize the *constitution* and *inaccessibility* of evidence across frameworks, not just its interpretation.
