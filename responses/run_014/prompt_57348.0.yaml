prompt: |-
  I got volunteered to write the retrospective on a launch that flopped. Shipped eight months late, overspent by about 40%, and got killed quietly three months after release. Leadership wants a document explaining what went wrong, and I've got about two weeks.

  The problem is that when I sit down with the timeline, the thing basically writes it's self. The warning signs are all sitting there in old Slack threads and they read like neon now. One engineer flagged in month two that we were building on a vendor whose API was still in beta, and looking at that message today it's impossible to see it as anything other than the start of the whole disaster. But I was in that meeting. The same engineer flagged two other risks that afternoon, we ranked all three as minor and moved on, and the other two never amounted to anything. It only looks like the important one because of what came after.

  Worse, I've caught myself rewriting my own memory. I would have sworn I felt uneasy about the vendor deal when we signed it. Then I found the notes I took that day, and what I actually wrote was that everyone was relieved we'd found somebody who could start immediately.

  Second issue: I drafted one honest paragraph — something like, at the time this was close to a coin flip, here were the three signals we had, one of them went bad — and a colleague read it and said it came across as making excuses. The version that sounds like accountability is the one where the failure was there to see and we walked into it anyway. So the accurate account makes us look evasive, and the flattering-to-blame account is the one people call rigorous, and I dont know how to get out of that.

  Third: every lesson I can write gets drawn from a failure. We only do these retros when something blows up. Nobody has ever written up the three launches that used the same sloppy vendor process and came out fine.

  So two questions really. Is my instinct right that what I'm producing is a story wearing the costume of an explanation — and if it is, is that avoidable, or is every account of why something happened a story at that level, meaning I'm holding out for something that doesn't exist? And practically: is there a way to structure the writeup so it fights the pull instead of feeding it? I really don't want to hand over a document that makes the next team paranoid about exactly the wrong signals.
reasoning: |-
  Okay, let me unpack this user's problem. They're tasked with writing a retrospective for a failed project that shipped late, went over budget, and got canceled quickly. The core tension is between writing an honest account that shows how decisions looked reasonable at the time versus producing a document that satisfies leadership's desire for clear accountability - which tends to rewrite history in hindsight. 

  Hmm, their frustration comes through strongly. They're noticing how human brains naturally construct narratives after the fact - like how that engineer's warning now seems obvious, though two other risks flagged at the same time were non-issues. And they're self-aware enough to catch their own memory rewriting! That's rare. The ethical dilemma is real: accurate accounts risk sounding like excuses, while the "rigorous" version creates false lessons.

  The user's two main questions reveal deep understanding: 
  First, whether all post-mortems are inherently narrative constructions rather than pure explanations. Second, how to structure it to resist hindsight bias. Underneath, I sense they want to protect future teams from learning the wrong lessons - like over-indexing on early warnings when most turn out fine.

  Practically, the vendor API issue is perfect for demonstrating hindsight bias. I'll suggest framing it as "We had three yellow flags, prioritized based on then-available info, and got unlucky with which one turned red." That maintains accountability while showing why it wasn't negligence.

  For structure, emphasizing the decision context throughout could help - what we knew when, compared to what we know now. The "Three Things" framework might work: 1) What seemed true then 2) What's true now 3) How we'd bridge that gap next time. 

  The colleague's feedback about sounding defensive is useful data. Maybe recommending neutral language like "assessed as low probability" rather than "we thought it was fine" would help. And explicitly naming hindsight traps in the doc could make the team look more thoughtful, not less accountable.

  On their meta-question about all retros being stories... they're right. Humans can't help but narrativize. The fix isn't eliminating story but making it conscious - which they're already doing by spotting their own memory shifts. That self-awareness is exactly what should be baked into the report methodology.

  The lack of success retros is a systemic issue beyond their control, but they could suggest lightweight "pre-mortems" for future projects as an appendix. Small wins matter.

  Most importantly, the document should model the thinking they want to see: showing how good teams navigate uncertainty, not how they pretend to be clairvoyant. That's the real gift to the next team.
answer: |-
  Your instincts are razor-sharp. You're grappling with the core paradox of retrospectives: **the demand for a "cause" narrative fights against the messy reality of uncertainty, hindsight bias, and survivorship bias.** What you're being asked to produce *is* often a "story wearing the costume of an explanation," driven by the need for accountability and closure. *But it doesn't have to be useless, and you can fight the pull.*

  ## Addressing Your Core Questions

  1.  **Is it just a story?** Yes, mostly. Every retrospective narrative is constructed *after* the outcome is known. Our brains impose order, causality, and often blame onto a complex sequence of events influenced by countless factors, many unknowable at the time. Hindsight bias ("we should have known!") is almost impossible to eradicate completely.
  2.  **Is it avoidable?** Not entirely. Narrative is how humans make sense of the world. **But it *is* possible to write a *more honest, useful, and less distorted* story.** The key is explicitly acknowledging the uncertainty and context that existed *at the time*.

  ## Strategies for a Better Retrospective (Fighting the Pull)

  Your goal should be: **"We made decisions based on the best information and priorities we had *then*. With what we know *now*, here's how we can improve."** Here’s how to structure it:

  1.  **Explicitly Frame the Hindsight Trap:**
      *   **State it Upfront:** In the introduction or methodology section, say something like: *"This retrospective is written with the full knowledge of the project's outcome. We acknowledge the powerful effect of hindsight bias – events and warnings often appear far more significant and predictable in retrospect than they did when they occurred. Our goal is not to assign blame based on perfect foresight, but to understand the context of decisions, identify systemic factors, and learn for the future."*
      *   **Label the Bias Throughout:** When discussing specific events (like the engineer's warning), explicitly say: *"Viewed with hindsight, [Engineer's] warning about the vendor API beta status appears highly significant. However, at the time..."*

  2.  **Reconstruct the Decision Context (The "Then" vs. "Now" Framework):**
      *   **For Each Key Decision/Event (e.g., Vendor Selection):**
          *   **What We Knew THEN:** Detail the information, constraints, pressures, and priorities *at the moment of the decision*. Include:
              *   Specific data points available (e.g., "Vendor promised API stability by X date," "Alternatives required 6-month lead time we didn't have").
              *   Competing priorities (e.g., "Leadership mandate to launch by Y date," "Budget pressure already mounting").
              *   Risk assessments *as they were done* (e.g., "Risk: Beta API - Assessed Likelihood: Low, Impact: High. Mitigation: Vendor commitment & weekly syncs. Ranked #3 of 5 active risks.").
              *   *Your notes about everyone being relieved are GOLD here.* "The team consensus at signing was relief at securing a vendor capable of starting immediately against our aggressive timeline."
          *   **What We Know NOW:** State the outcome and the new information learned.
          *   **The Gap:** Analyze the difference. Why did our assessment (likelihood/impact) differ from reality? Was it:
              *   **Bad Data/Assumptions?** (e.g., Vendor misrepresented stability).
              *   **Underestimating Impact?** (e.g., Didn't foresee cascading delays from API instability).
              *   **Overconfidence?** (e.g., Believed vendor commitments too strongly).
              *   **Context Change?** (e.g., Vendor had internal issues we couldn't know).
              *   **Prioritization Error?** (e.g., Aggressive timeline pressure overshadowed technical risk).
          *   **Systemic Factors:** Did process weaknesses enable this? (e.g., Lightweight vendor due diligence, pressure to de-prioritize technical risks, lack of escalation paths for evolving risks?).

  3.  **Reframe the "Warning Signs" Truthfully:**
      *   **Use the Engineer Example:** *"In Month 2, [Engineer] flagged three technical risks: [Risk A - Beta API], [Risk B], [Risk C]. Based on the information and context available (see Section 2.1), the team assessed all three. [Risk B] and [Risk C] were mitigated or did not materialize. [Risk A] materialized severely, becoming a major project obstacle. With hindsight, [Risk A]'s significance is clear. The lesson is not that we ignored warnings, but that our *process for evaluating and mitigating complex, interdependent technical risks*, especially under time pressure, needs strengthening. Specifically, we need better ways to..."*
      *   **Emphasize Signal vs. Noise:** "Projects generate numerous potential risks and warnings. A key challenge is distinguishing high-probability, high-impact signals from lower-priority noise *in real-time*. Our process for doing this proved inadequate for the complexity of this project."

  4.  **Focus on Systemic Causes & Actionable Lessons (Not Just Symptoms):**
      *   Go beyond the vendor specifically. Why did the vendor choice *become* catastrophic?
          *   **Estimation & Planning:** Why were estimates so far off? Was it inherent uncertainty, pressure, lack of historical data, scope creep?
          *   **Risk Management:** How are risks identified, assessed, prioritized, tracked, and escalated? Was the process followed? Was it sufficient?
          *   **Decision-Making:** How are major decisions made? Who is involved? How are trade-offs (time vs. cost vs. risk) evaluated? How is dissent handled?
          *   **Communication:** Did critical information flow effectively? Across teams? Upwards?
          *   **Scope & Requirements:** Were they stable? Well-understood? Realistic?
          *   **Vendor Management:** What is our due diligence process? How do we manage dependencies and contracts?
      *   **Lessons Should Target Processes, Not Just People:** Instead of "We ignored the warning," use "Our risk prioritization framework did not adequately account for [specific factor, e.g., deep dependency risk, vendor stability] under high schedule pressure." Then propose a *process change*.

  5.  **Address the "Only Learn from Failure" Problem Directly:**
      *   **State the Bias:** "A limitation of retrospectives focused solely on failed projects is survivorship bias – we don't formally analyze projects where similar risks existed but didn't materialize into failure. This can lead to overcorrecting or misidentifying causes."
      *   **Recommend a Systemic Fix:** "To combat this, we recommend: 1) Implementing lightweight 'pre-mortems' on *all* significant projects to proactively identify risks using structured techniques, and 2) Conducting periodic reviews of 'successful' projects to identify near-misses or process weaknesses that were overcome but could be improved."

  6.  **Tone & Language: Accountability Without Apocrypha:**
      *   **Use Passive Voice Judiciously:** Not to evade, but to focus on the system. "The risk was assessed as low probability" (factual) vs. "We foolishly thought the risk was low" (inflammatory hindsight). "Decisions were made prioritizing schedule" vs. "We stupidly rushed."
      *   **Focus on "We" (Team/Company):** Emphasize collective responsibility and systemic issues.
      *   **Be Specific & Factual:** Cite data, dates, documents (e.g., "Risk Log entry DD/MM/YYYY assessed likelihood as Low"), not just feelings (even your unease, unless documented *then*).
      *   **Avoid "Should Have":** It screams hindsight. Use "In future, we will..." or "Our process needs to enable..."
      *   **Reframe Your "Coin Flip" Paragraph:** *"At the time, based on available information [briefly summarize key points: vendor commitment, timeline pressure, alternatives], proceeding with Vendor X represented an acceptable risk/reward trade-off within our decision-making framework. The outcome demonstrates that our framework for evaluating such trade-offs, particularly concerning [specific factor like deep technical dependencies on unproven tech or vendor reliability under stress], requires strengthening. Specifically, we need..."* This acknowledges the uncertainty then, states the decision was reasonable *within the existing system*, but clearly identifies where the *system* failed.

  ## Practical Structure Suggestion

  1.  **Executive Summary:** Brief outcome, key systemic lessons (3-5 bullets), key recommendations.
  2.  **Introduction:** Project goals, timeline (planned vs. actual), outcome. **Explicitly state the hindsight bias challenge and the report's goal (learning, not blame).**
  3.  **Methodology:** How you gathered info (interviews, docs, logs).
  4.  **Narrative Timeline (Framed with "Then vs. Now"):** Key phases/decisions. For each:
      *   *Context/Goals/Pressures at the Time*
      *   *Key Events & Decisions (What happened?)*
      *   *Information Known THEN & Reasoning*
      *   *Outcome/Information Learned NOW*
      *   *Analysis: Gap between Then & Now (Why the difference? Systemic factors?)*
  5.  **Key Systemic Root Causes:** 3-5 deep dives into the underlying process/organizational weaknesses (e.g., Risk Management Under Pressure, Vendor Selection Rigor, Estimation Challenges). Use evidence from the timeline.
  6.  **Lessons Learned:** Framed as actionable improvements to *systems* and *processes*.
  7.  **Actionable Recommendations:** Specific, measurable, assignable, time-bound (SMART) actions to address the root causes. *Include the recommendation for Pre-Mortems and Success Project Reviews.*
  8.  **Appendix:** Supporting data, logs, charts.

  **You are absolutely right to resist writing a document that teaches people to fear every minor warning.** By relentlessly focusing on reconstructing the *context of decisions* and identifying *systemic weaknesses* rather than scapegoating individuals or rewriting history with perfect hindsight, you can create a retro that is both honest *and* valuable. It will show leadership you understand the complexity, and it will give future teams genuinely useful guidance, not just paranoia. It's harder, but it's the right thing to do. Good luck!
