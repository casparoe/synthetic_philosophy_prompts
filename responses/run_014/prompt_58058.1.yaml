answer: |-
  Here are seven probing questions designed for critical engagement with coincidence theory, incorporating your stipulated cases and requirements:

  1.  **Modal Difference & Distinctness:** Given that the lump survives flattening on Tuesday while the warrior does not, the modal difference argument concludes they must be distinct on Monday. But couldn't this modal difference be explained by the *same* object undergoing a substantial change (ceasing to be a warrior but remaining clay) rather than requiring two objects? Why is *numerical distinctness* the only plausible explanation for this difference in survival conditions?
      *(Follow-up: If you appeal to sortal persistence conditions demanding "non-squashing" for statues but not lumps, why must these distinct conditions attach to distinct *objects* rather than being different ways the same matter can be described or organized over time?)*

  2.  **Grounding Modal Differences:** At the exact moment of coincidence on Monday, before any flattening, the warrior-statue and the lump allegedly share *all* their matter, arrangement, relational properties, and spatial location. What non-modal, non-persistence-related property or fact *grounds* their numerical distinctness and explains their divergent future modal profiles?
      *(Follow-up: If you appeal to primitive modal/historical properties (e.g., "being essentially a statue"), how does this avoid making distinctness brute and epistemically inaccessible, leaving us unable to know *which* object we point to on the pedestal?)*

  3.  **Counting & Practical Reasoning:** When the warrior is on the pedestal on Monday, coincidence theory says there are two numerically distinct objects (statue and lump) co-located. How many objects should a museum curator count for inventory, insurance valuation, or when stating "this object is for sale"? If they insure the "statue," does this inherently exclude the lump, and how could this be practically implemented or verified given coincidence?
      *(Follow-up: If you say we count by sortal (e.g., "one statue, one lump"), how does this resolve the practical dilemma when pointing and saying "this" – am I referring to the statue, the lump, or ambiguously to both, and what determines reference?)*

  4.  **Persistence & Temporal Gaps (Rework):** In Rework, the sculptor creates a qualitatively identical warrior from the same clay on Wednesday. The coincidence theorist will likely deny it's numerically the same warrior as Monday's. But doesn't this imply the warrior can only persist through continuous preservation of its *statue-shape*? How does this account for cases like disassembly and reassembly (e.g., a watch), where we intuitively allow persistence through a temporal gap?
      *(Follow-up: If you argue disassembly/reassembly preserves the watch's *functional organization* potentially in parts, while flattening destroys the warrior's *specific form*, what principled distinction prevents the Wednesday warrior (same matter, same form) from being the Monday warrior *restored*, rather than a new entity?)*

  5.  **Gradual Replacement & Persistence (Conservation):** In Conservation, half the clay of the fired bust is gradually replaced over years while shape and function are preserved. Does the coincidence theorist view the original bust as persisting through this process, being replaced by a new bust, or something else? How does this view handle the Sorites-like challenge of pinpointing when replacement creates a new object?
      *(Follow-up: If you say the original bust ceases to exist once "sufficient" original matter is gone, how is this threshold defined non-arbitrarily given the continuous nature of the process, and doesn't this conflict with our strong intuition that the exhibited bust remains "the same object" throughout conservation?)*

  6.  **Indiscernibility at a Time:** Leibniz's Law states that if two objects are numerically distinct, there must be some property one has that the other lacks *at that time*. At the moment of coincidence (Monday), what intrinsic or extrinsic property does the statue possess that the lump lacks, or vice versa, besides modal/historical properties? If there are none, how does coincidence theory avoid violating Leibniz's Law?
      *(Follow-up: If you bite the bullet and accept distinct objects can share *all* non-modal properties at a time, doesn't this radically revise our understanding of objecthood and individuation, making distinctness undetectable in principle at the time of coincidence?)*

  7.  **Causal Overdetermination:** If the statue and lump are distinct objects coinciding on Monday, and I push the statue off the pedestal on Monday evening, causing it to shatter, it seems *both* the statue and the lump are causally affected – the statue shatters and the lump changes shape dramatically. Isn't this a case of systematic causal overdetermination for any action performed on the coincident objects? How is this proliferation of causes and effects justified?
      *(Follow-up: If you deny overdetermination by claiming only the *lump* bears the causal relations (being pushed, changing shape) while the statue's destruction is a consequence of its dependence on the lump's configuration, doesn't this undermine the claim that the statue is a distinct, concrete *object* capable of independent causal efficacy?)*

  **Key Design Features:**
  *   **Targets Core Tenets:** Questions 1 & 2 directly challenge the foundational modal argument and the grounding problem.
  *   **Incorporates Cases:** Question 4 uses Rework for temporal gaps; Question 5 uses Conservation for material replacement; Flattening underpins Question 1.
  *   **Practical Reasoning:** Question 3 explicitly addresses counting, pointing, selling, and insuring.
  *   **Broader Implications:** Question 6 tackles Leibniz's Law; Question 7 tackles causal overdetermination.
  *   **Follow-ups:** Each anticipates standard coincidence replies (sortals, primitivism, counting by sortal) and presses the conceptual cost, arbitrariness, or counterintuitive consequences.
  *   **Depth over Exposition:** Assumes familiarity with identity, indiscernibility, parthood, Leibniz's Law, and the basic coincidence position, pushing directly to critical pressure points and costs.
