answer: |-
  You've hit upon one of the most active and debated topics in contemporary metaphysics! The relation you're describing is most commonly called **grounding** (sometimes "metaphysical grounding" or "ontological grounding").

  Here’s a breakdown of what grounding is, why it fits your description, and the state of the debate:

  1.  **What Grounding Is:**
      *   It's a non-causal, explanatory, and constitutive relation of **dependence** or **priority**.
      *   It expresses that one fact (or state of affairs, or truth, or entity) **holds in virtue of**, **depends on**, or is **explained by** another, more fundamental fact (etc.).
      *   It's often represented by phrases like: "P because Q", "P in virtue of Q", "P obtains in virtue of Q obtaining", "P is grounded in Q", "Q grounds P".
      *   *In your examples:*
          *   The fact *that there is a table* is grounded in the fact *that these particles are arranged table-wise* (under certain conditions, like being on Earth, not being artwork, etc.).
          *   The fact *that specific event E occurred* is grounded (at least partly) in the fact *that the laws of physics are L* plus the fact *that the initial conditions were C*.

  2.  **Why Your Alternatives Don't Fit (and Grounding Does):**
      *   **Not Causation:** Grounding is synchronic (things exist/given *at the same time*), while causation is diachronic (cause precedes effect). The particles' arrangement doesn't *cause* the table to exist at a later time; their arrangement *constitutes* the table *at that time*.
      *   **Not Temporal Priority:** The fundamental and less fundamental facts/things typically coexist. The particles and the table exist simultaneously; the laws and the events governed by them exist simultaneously.
      *   **Not Strict Logical Entailment:** As you note, "These particles are arranged table-wise" doesn't *logically entail* "There is a table" without additional contextual or definitional premises (what counts as a table, the absence of external defeating conditions). Grounding *incorporates* these contextual factors. The grounding base includes the particle arrangement *plus* the relevant background conditions (e.g., it's not an art installation, it's serving a table-function).
      *   **Non-Modal:** While grounding often implies modal connections (if the ground didn't obtain, the grounded probably wouldn't), the core relation is explanatory/constitutive, not purely about necessity or possibility.

  3.  **Is Grounding "Settled"? Absolutely Not. It's Highly Contested!**

      While "grounding" is the dominant term for the relation you're describing, there is significant disagreement about its nature and even its coherence:

      *   **Primitive or Defined?** Some philosophers (e.g., Kit Fine, Jonathan Schaffer) argue grounding is a primitive, irreducible relation – a basic building block of metaphysical explanation. Others (e.g., Gideon Rosen, earlier work) see it as a useful concept but potentially analyzable in terms of other notions (like essence or modality), or as a placeholder for a variety of more specific dependence relations (compositional, realization, etc.).
      *   **Formal Properties:** Is grounding transitive? (If A grounds B and B grounds C, does A ground C?) Is it asymmetric? (If A grounds B, can B ground A?) Is it irreflexive? (Can a fact ground itself?) There's debate on all these points.
      *   **What Relata?** Does grounding hold between facts? States of affairs? Objects? Properties? Sentences? Propositions? Different theorists have different views.
      *   **The "Unity" Question:** Is grounding a single, unified relation, or is it just a label we apply to many different kinds of dependence relations (composition, set membership, realization, truthmaking, etc.) that all share a loose family resemblance ("in virtue of")?
      *   **Metaphysical Inflation:** Critics (e.g., J. Wilson, sometimes T. Hofweber) question whether we need a *new*, primitive relation like grounding. They argue existing concepts (supervenience, reduction, explanation) or simply careful description can do the work without adding controversial ontological machinery.
      *   **Foundationalism vs. Infinite Regress/Coherentism:** Does grounding require a fundamental level (things that are ungrounded), or can chains of grounding go on infinitely, or form coherent loops? This is a major debate within grounding theory.
      *   **Relation to Science:** How does metaphysical grounding relate to scientific explanation? Is it compatible, complementary, or in tension?

  4.  **Related Concepts (often discussed alongside or sometimes conflated with grounding):**
      *   **Ontological Dependence:** A broader term for relations where one entity depends on another for its existence (e.g., a hole depends on the object it's in, a set depends on its members). Grounding is often seen as a specific *explanatory* form of dependence between facts/states of affairs.
      *   **Supervenience:** A modal relation (if the A-properties change, the B-properties *must* change). Grounding is often thought to *explain why* supervenience holds. Supervenience is weaker and doesn't imply the explanatory/directional "in virtue of" relation.
      *   **Reduction:** Often implies a stronger connection, potentially eliminating the reduced entity or property. Grounding doesn't necessarily imply elimination.
      *   **Truthmaking:** The relation between a truth-bearer (e.g., a proposition) and the entity in the world that makes it true. Truthmaking is often seen as a specific *instance* of grounding (the fact that makes <P> true grounds the truth of <P>).

  **In Summary:**

  *   **The Name:** The relation you're inquiring about is primarily called **Grounding**.
  *   **What it is (Consensus Core):** An explanatory, non-causal, constitutive, synchronic dependence relation ("P in virtue of Q").
  *   **Is it Settled?** **No.** While the *intuitive notion* ("more fundamental than") is widely recognized, the precise nature of grounding is one of the most actively debated topics in metaphysics today. Philosophers disagree fundamentally on whether grounding is primitive or analyzable, what its formal properties are, what it relates, whether it's a single unified relation, and even whether it's a necessary part of our metaphysical toolkit at all.

  You've identified a core and contentious concept at the heart of modern metaphysical inquiry!
