  I've been trying to put my finger on something and wondering if there's already a name for it in philosophy. People often say one fact or thing is "more fundamental" than another — like, the fact that the parts of a table are arranged a certain way is more fundamental than the fact that there's a table in the room. Or the laws of physics are more fundamental than the particular events that happen. But I can't figure out what this "more fundamental than" relation actually is. It's not causation — the parts being arranged doesn't cause there to be a table, it just sort of makes it the case in a different way. It's not temporal priority either. And it doesn't seem like logical entailment exactly, because you need extra assumptions about what counts as a table. Is there a name for this specific relation, and do philosophers agree about what kind of thing it is? I'm not after reading recommendations, just trying to understand whether this is a settled concept or still contested.
