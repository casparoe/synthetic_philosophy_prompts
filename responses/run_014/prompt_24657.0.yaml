prompt: |-
  The practice of "splitting the difference" — resolving a dispute by taking the midpoint between the two parties' positions, or by each conceding half the distance to the other — is standard in negotiation, mediation, and settlement practice. What view of disagreement does this practice presuppose? Reconstruct the implicit epistemology: does it require that the dispute be a genuine peer disagreement, in which neither party has access to evidence the other lacks, or can it be justified when one party is simply better informed? Is it compatible with a "total evidence" approach, on which each party weighs all available evidence — including the mere fact of the other's disagreement — and may rationally hold their position fixed? And since the practice only makes sense when the disputed matter lies on a scale that can be bisected, what would have to change in it if the disagreement were over a categorical choice or a theory for which no midpoint exists?
reasoning: |-
  Okay, the user is asking about the practice of "splitting the difference" in negotiations and what it implies about disagreement. Let me start by breaking down their questions. They want to know the underlying epistemology of this practice. Specifically, whether it assumes both parties are equally informed peers, if it can work when one is better informed, its compatibility with a "total evidence" approach, and how it applies to non-scalar disputes.

  First, I need to recall what splitting the difference entails. It's about finding a midpoint between two positions. That suggests the disagreement is seen as a matter of degree on a continuum. So the implicit view is that the truth or best outcome lies somewhere between their positions. Both parties are partially correct, and the midpoint is a fair resolution.

  Now, the peer disagreement aspect. The practice probably assumes that both parties have access to similar evidence but interpret it differently. If one side is better informed, splitting might not be fair. For example, if one has more accurate data, meeting halfway could lead to a suboptimal outcome. But in practice, mediators might still use it as a pragmatic solution even if information isn't equal, especially when there's no clear way to verify who's right.

  Next, the total evidence approach. This involves weighing all evidence, including the fact that the other party disagrees. Splitting the difference doesn't really fit this because it doesn't require re-evaluating the evidence. Instead, it's a procedural compromise. So there's a tension here. If both parties rationally hold their positions after considering all evidence, splitting might seem irrational. The practice prioritizes resolution over epistemic accuracy.

  Then there's the issue of non-scalar disputes. If the disagreement is categorical, like choosing between two options without a middle ground, splitting doesn't work. Alternatives would be needed, like compromising on other issues, flipping a coin, or finding integrative solutions. This shows that the method is limited to measurable disputes.

  The user's deeper needs might include understanding when and why this practice is valid. They might be interested in negotiation strategies, epistemology in practical contexts, or how to handle disagreements where evidence is contested. Maybe they're a student, mediator, or someone involved in negotiations. Their questions suggest they're looking for a critical analysis of the practice's assumptions and limitations.

  I should also consider real-world applications. Even when information isn't symmetrical, splitting can be efficient when accuracy is less critical than closure. But in cases where being correct is essential, it might not be appropriate. Highlighting when to use it versus other methods could add value.

  In conclusion, the practice presupposes that disputes are matters of degree, both parties are reasonable peers, and compromise is more important than truth. It clashes with total evidence rationality and isn't suitable for categorical disagreements. The user likely wants a clear framework to assess the validity of this common negotiation tactic in different scenarios.
answer: |-
  The practice of "splitting the difference" presupposes a specific, often implicit, view of disagreement and its resolution:

  1.  **View of Disagreement Presupposed:**
      *   **Quantifiable Dispute:** The core presupposition is that the disagreement is fundamentally about *degree* or *magnitude* on a single, measurable continuum (e.g., price, time, quantity, liability percentage). The "truth" or "correct outcome" is implicitly assumed to lie *somewhere between* the two stated positions.
      *   **Symmetrical Uncertainty:** It often assumes a rough symmetry in the reasonableness of the starting positions. While not requiring absolute epistemic equality, it leans towards viewing both parties as having plausible, albeit different, perspectives grounded in their own valuations or assessments. Neither position is seen as obviously or demonstrably superior *in a way easily verifiable by the mediator or parties at that moment*.
      *   **Compromise over Truth-Seeking:** The primary goal is pragmatic resolution and closure, often prioritizing fairness of *process* (each side moves equally) and relationship preservation over necessarily arriving at the objectively "correct" answer. The disagreement is framed as a conflict of *interests* or *valuations* to be settled, rather than primarily a conflict of *fact* to be adjudicated based on evidence.
      *   **Diminishing Marginal Utility/Concession Cost:** It assumes that the cost (monetary, psychological, relational) of conceding each additional unit is relatively linear or at least comparable for both sides, making an equal movement "fair" in terms of shared sacrifice.

  2.  **Implicit Epistemology:**
      *   **Not Necessarily Genuine Peer Disagreement:** Splitting the difference **does not require** a genuine peer disagreement where both parties have identical evidence and epistemic standing. It is frequently applied in situations where one party *may* be better informed or have a stronger evidential basis.
      *   **Justification Despite Information Asymmetry:** It *can* be justified even when one party is better informed, but the justification shifts:
          *   **Pragmatism:** When verifying the superior information is difficult, costly, or time-consuming, splitting offers a quick, efficient resolution.
          *   **Risk Mitigation:** The better-informed party might accept a split to avoid the risk of the other party walking away, the costs of prolonged dispute, or the possibility their evidence might not be convincing or accepted. The less-informed party might accept it to avoid getting a worse outcome if their position is weak.
          *   **Perceived Fairness:** The *appearance* of fairness (equal concession) can be valuable for maintaining relationships or social harmony, even if epistemically suboptimal.
          *   **Bargaining Anchor:** Positions are often seen as initial bargaining anchors influenced by strategy, not pure evidential assessments. Splitting neutralizes strategic anchoring.
      *   **Tension with "Total Evidence" Rationality:**
          *   **Direct Incompatibility:** Splitting the difference is **fundamentally incompatible** with a pure "total evidence" approach where each party rationally updates their belief based on *all* evidence, including the fact of disagreement.
          *   **Why?** The total evidence approach demands that each party re-evaluate their *own* position in light of the other's dissent. If after sincere re-evaluation, Party A rationally concludes their position is correct (based on their total evidence, including the disagreement itself), they *should not* concede half the distance purely for compromise. Concession based on the total evidence approach would be based on the *weight* of evidence perceived after re-evaluation, not a fixed proportional movement.
          *   **Different Goals:** Splitting is a *procedural rule for settlement*, not an *epistemic rule for belief revision*. It mandates a specific outcome regardless of the parties' internal evidential states after considering the disagreement. It prioritizes resolution over individual rational conviction.

  3.  **Handling Non-Scalar (Categorical) Disagreements:**
      Splitting the difference fundamentally relies on a quantifiable scale. For categorical choices (e.g., "Should we build a bridge or a tunnel?", "Is the defendant guilty or not guilty?") or theories with no midpoint (e.g., Newtonian vs. Quantum mechanics in a specific context), the practice *as defined* is impossible. Alternatives must be employed:
      *   **Compromise on *Other* Issues:** Link the categorical dispute to negotiable, scalar issues. E.g., "We'll build your preferred bridge, but you concede significantly on the budget" or "We'll adopt your theory for this project phase, but mine for the next."
      *   **Package Deals/Logrolling:** Trade concessions on entirely different issues. "You get your way on X, I get my way on Y."
      *   **Creative Integration:** Find a novel solution that incorporates elements of both positions (e.g., a different type of bridge-tunnel hybrid, a third theory).
      *   **Procedural Resolution:** Agree to flip a coin, use an arbitrator, take a vote, or set criteria for future evaluation/choice.
      *   **Fractional Allocation (if applicable):** If resources allow, do *both* things partially (e.g., fund a pilot of each theory).
      *   **Deferral:** Agree to postpone the decision or gather more evidence.
      *   **"Splitting" Interpretations:** Frame the choice differently to find a continuum (e.g., instead of guilty/not guilty, negotiate the level of a civil penalty or a plea to a lesser charge).

  **In essence:** Splitting the difference presupposes a dispute as a clash of reasonable-but-divergent valuations on a measurable scale, resolvable through symmetrical concession for the sake of pragmatic and fair closure. Its epistemology is pragmatic and procedural, prioritizing resolution efficiency and perceived fairness over strict evidential parity or rational belief updating based on total evidence. It fundamentally fails for categorical disputes, requiring a shift to qualitatively different resolution strategies focused on trading, integrating, or procedurally deciding between the incompatible options.
