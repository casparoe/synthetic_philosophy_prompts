prompt: |-
  I'm preparing a paper on the demandingness objection, and I want a thought experiment built to a precise specification. The scenario should present an agent who complies perfectly with every demand of a demanding moral theory — a Singer-style view on which you are required to redirect nearly all of your discretionary income to the most effective causes — and who is nevertheless not admirable as a moral saint, with the explanation of the non-admirability being not the standard objection that saints sacrifice their personal projects and make poor friends, but a distinct supererogation point. For background: Driver's moral-saints argument holds that a person who does everything morality requires is not fully admirable, and therefore morality cannot actually require what the saint does; I want you to press on a different seam — not that the saint gives up personal projects, but that the saint never does anything above duty. Because a fully demanding theory leaves little or no room for acts that go beyond the call of duty, an agent who does exactly what is required does only the moral minimum, and the moral minimum becomes a ceiling on moral performance rather than a floor; perfect compliance is thus the least admirable kind of moral life, even though it is the only kind the theory allows.

  Constraints: the case must be set in an ordinary context (a workplace, a family, or a small community), fit in a single paragraph, and the agent's non-admirability must not come from the agent doing anything wrong, from the agent's selfishness, or from any cost to the agent's own flourishing; it must fall out of the structure of the demanding theory itself. After the scenario, walk through what the demanding theory says the agent ought to do and why, what a Driver-style saint critique says, and why the supererogation point — rather than the personal-project point — is doing the work. Then say what happens if the theory is revised to admit a zone of supererogation, so that some acts are genuinely good but not required, and how a defender of demanding theories would attack the case on the grounds that the supererogation objection is either incoherent or trivial.
reasoning: |-
  We are constructing a thought experiment that meets the following specifications:
   - Setting: ordinary context (workplace, family, or small community)
   - The agent complies perfectly with a demanding moral theory (like Singer's: requiring nearly all discretionary income to effective charities)
   - The agent is not admirable as a moral saint, but not because of sacrificing personal projects or being a poor friend (so we avoid the standard Driver-style point).
   - The non-admirability comes from the fact that the agent never does more than what is required (the theory leaves no room for supererogation).
   - The agent does nothing wrong, is not selfish, and there is no cost to the agent's own flourishing (so the agent is not suffering or miserable).

   We want a scenario where the agent does exactly what the demanding theory requires and nothing more, and this leads to the agent being non-admirable because they never go beyond the call of duty. The theory has set the bar so high that the minimum required is also the maximum possible, so the agent is always at the minimum (which is also the maximum) and thus never does anything supererogatory.

   Let's create a scenario in a workplace setting.

   Scenario:

   In a small marketing firm, every employee is expected to meet tight deadlines and work long hours during peak seasons. The demanding moral theory requires that one donate nearly all discretionary income to effective charities, but it also requires that one fulfill one's professional duties (so that one can keep earning and donating). An agent, Alex, is a top performer who always meets deadlines, never takes a sick day, and is known for reliability. Alex donates 90% of their income to highly effective charities, keeping only what is necessary for basic needs and work-related expenses. When a colleague, Jordan, faces a personal crisis and falls behind on a critical project, the team is asked to volunteer extra hours to help. Alex, however, declines because the demanding theory requires that one not sacrifice one's own health and job performance (which would reduce long-term donation capacity), and because the theory does not require helping beyond one's assigned role (since the firm is not an effective charity and the help would not be as cost-effective as donating money). Alex does exactly what is required: meeting their own responsibilities and donating the maximum sustainable amount. They never go beyond this, even when colleagues are struggling, because the theory doesn't require it and because doing so might compromise their ability to meet the demanding donation requirement.

   Now, we break down:

   1. What the demanding theory says Alex ought to do and why:
      - The theory requires Alex to maximize good by donating as much as possible to the most effective causes without undermining their ability to continue doing so. Thus, Alex must maintain their job performance to keep earning and donating. It also requires that Alex not divert resources (time or money) to less effective causes. Helping a colleague might be a kind act, but it is not the most effective use of Alex's resources (compared to donating to save lives elsewhere). Therefore, the theory forbids Alex from volunteering extra time to help Jordan because that time could be spent working more (to earn more to donate) or resting (to maintain performance). The theory requires only that Alex meet their job responsibilities and donate the maximum sustainable amount.

   2. Driver-style critique (but we are avoiding the personal-project point):
      - Driver's original point might focus on how the saint sacrifices personal life and relationships. But here, we are not focusing on that. Instead, we note that Alex does nothing wrong and is not selfish (they donate 90% of income) and is not suffering (they are healthy and performing well). The non-admirability comes from the fact that Alex never does more than the minimum required by the theory. Since the theory sets the bar so high that the minimum is also the maximum, Alex is always at the moral minimum. They never go above and beyond, even when there are opportunities that might seem admirable (like helping a colleague in need) but are not required by the theory. Thus, Alex is not admirable because they are only doing what they must, and they never go beyond the call of duty.

   3. Why the supererogation point is doing the work:
      - The problem is that the theory leaves no room for supererogation. Any act that would be supererogatory (like helping a colleague beyond what is required by the job and without compromising donations) is either forbidden (because it would be less effective than donating) or not required (so Alex doesn't do it). Thus, Alex never performs any act that is beyond duty. In a less demanding theory, helping Jordan might be supererogatory and thus admirable. But in this theory, it is either forbidden or not required, so Alex doesn't do it. Therefore, Alex is not admirable because they never do anything that is above and beyond, even though they are perfectly compliant.

   4. Revised theory with supererogation:
      - If we revise the theory to allow a zone of supererogation, then the theory might require donating, say, 80% of discretionary income (which is still very demanding) but allow that the remaining 20% can be used for other good causes (like helping colleagues) or even personal projects. Then, Alex could choose to help Jordan by volunteering extra time (using some of the 20% for non-optimal but still good acts) without violating the theory. If Alex did so, that would be supererogatory and thus admirable. Alternatively, Alex could choose not to help and instead use that 20% for personal projects (which might be permissible but not admirable). In this revised theory, Alex could be admirable by choosing the supererogatory act.

   5. Defense of demanding theories:
      - A defender might argue that the supererogation objection is incoherent because if an act is good (like helping Jordan) and one can do it without sacrificing anything of comparable moral importance, then it is required by the demanding theory. So, the act of helping Jordan is either required (if it is the most effective thing to do) or not good enough to be required (so not doing it is permissible). In the latter case, it wouldn't be admirable to do it because it's not the best use of resources. Thus, the idea of supererogation is trivial: if an act is not required, it's because it's not the best, so why would we admire someone for doing a less good act? The demanding theorist might say that we should only admire people for doing the best possible act (which is required) and that the concept of supererogation is either empty or leads to praising suboptimal behavior.

   Let's write the scenario and analysis as requested.
answer: |-
  ### Thought Experiment: The Efficient Benefactor  
  In a small community library where Alex works as a coordinator, a flood damages the children’s section. The library staff organizes volunteers to repair it on weekends. Alex, adhering to a Singer-style moral theory, calculates that donating to a global disaster-relief charity would save more lives per dollar than local repairs. The theory requires redirecting nearly all discretionary resources to the most effective causes, so Alex donates 95% of their savings to the relief charity and spends the remaining 5% on minimal personal needs. Alex also fulfills their core job duties (e.g., managing library operations) to sustain income for future donations. When asked to volunteer for repairs, Alex declines: the theory demands maximizing impartial good, and local repairs are less cost-effective than donations. Alex does nothing wrong—they meet all work obligations, donate efficiently, and maintain health. Yet colleagues find Alex unadmirable: they never help with local crises, mentor new staff, or participate in community events, even when these acts wouldn’t compromise donations or job performance.  

  ---

  ### Analysis  
  **1. Demanding Theory’s Requirements**  
  The theory obligates Alex to:  
  - **Maximize global welfare**: Donate all discretionary income to the most effective charities (e.g., evidence-based poverty alleviation). Local volunteer work is forbidden if less efficient than monetary donations.  
  - **Sustain capacity**: Maintain job performance and health to earn and donate long-term. Helping colleagues or the community is optional unless it directly preserves this capacity.  
  Alex acts permissibly: donations are optimized, core duties are fulfilled, and personal flourishing is intact (no burnout or resentment).  

  **2. Non-Admirability: The Supererogation Gap**  
  - **Driver-style critique avoided**: Alex isn’t sacrificing personal projects (they have hobbies funded within the 5% budget) or relationships (they engage socially within work hours). The issue isn’t self-sacrifice.  
  - **Supererogation point**: The theory sets the moral minimum so high it eliminates "extra" good acts. Volunteering at the library would be good but forbidden (as suboptimal). Acts like mentoring colleagues—though neutral to Alex’s capacity—are neither required nor performed. Thus, Alex only ever does the *mandated minimum*. Colleagues perceive this as rigid, ungenerous, and "bare-minimum" behavior, lacking warmth or initiative. Admirability requires exceeding duty, but the theory leaves no such space—Alex’s compliance is the *ceiling* of moral action, not a floor.  

  **3. Revision with Supererogation**  
  If the theory permits a "good but not required" zone (e.g., allowing 10% of resources for suboptimal acts), Alex could volunteer or mentor without failing duties. Doing so would be supererogatory—worthy of admiration. Refraining would be permissible but unexceptional. Admirability is now possible through optional goodwill.  

  **4. Defense of Demanding Theories**  
  A defender might attack this via:  
  - **Incoherence charge**: If an act is good (e.g., volunteering), demanding theories *must* require it (lest they condone inefficiency). Supererogation is incoherent—morality should demand all good acts.  
  - **Triviality charge**: The "unadmirable" agent isn’t flawed; the critique confuses *moral* assessment (Alex is praiseworthy for optimal giving) with *social* appraisal (colleagues’ biases for local aid). The objection thus reduces to psychological bias, not ethical substance.  

  ---

  ### Key Insight  
  The case isolates how demanding theories collapse the distinction between duty and virtue: when the minimum is maximal, agents cannot display moral excellence beyond compliance. This contrasts with Driver’s focus on personal costs, instead targeting the structural erasure of supererogation.
