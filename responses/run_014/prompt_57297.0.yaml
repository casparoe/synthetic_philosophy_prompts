prompt: |-
  I chair my hospital's committee on novel and non-protocol interventions: roughly once a month we receive a request to permit something whose evidence base is thin — an unapproved device for a single patient, a prediction algorithm validated only retrospectively, a protocol adapted from an analogous condition. Our members are clinicians and administrators with no decision theory, we have forty minutes per case, and the chief medical officer signs off on our recommendation. I want a decision procedure the committee can actually run, not an essay on ambiguity aversion.

  The procedure should preserve what I take to be the substance of the Ellsberg material rather than its slogan. Reluctance to act when probabilities are imprecise is not one thing, and it matters whether we have no information at all, information from a source we cannot evaluate, or conflicting information from sources we can evaluate separately. Aversion to an unfamiliar source often shrinks once that source is judged on its own instead of against a familiar benchmark; a committee that always sees the novel request next to standard care will be systematically harsher than one that sometimes does not. And the formal responses are different procedures with different consequences, not interchangeable glosses: adopting a set of admissible probability judgments rather than a single one; choosing what performs best under the least favorable member of that set; or declining to rank at all and defaulting to the status quo until some option dominates. Tell me which of these you are building into our workflow, and what following each of the others would have required instead. The procedure must also include a step that decides whether further evidence could reduce the ambiguity or would only relocate it, and it should treat squarely the possibility that commissioning another study is itself a way of avoiding the decision.

  Then run it on three cases: (i) single-patient use of an unapproved implantable device for a condition with no remaining alternative, where the mechanism is plausible and three foreign case reports exist; (ii) hospital-wide deployment of a sepsis early-warning model with strong retrospective performance on our own data, no prospective validation, and evidence that it underperforms in a population we serve heavily; (iii) continuation of a two-year pilot whose outcome data are mildly positive but statistically weak, and which clinicians now depend on. I expect (ii) to be permitted and (i) denied; if your procedure says otherwise, identify the conflation my expectation rests on.

  Please use these sections, in this order: "What the theory licenses" (about 250 words); "The procedure" (numbered questions in order, with what counts as a sufficient answer to each and the stopping rules for deny, permit, and permit-with-conditions; about 700 words); "Where judgment cannot be eliminated" (about 300 words); "Worked cases" (about 600 words); "How this procedure will fail" (about 250 words); and "What would change my mind" (about 200 words). In that final section, be candid about which consideration would move you to a different verdict on how much weight imprecise evidence should carry — a successful Bayesian rejoinder, a reason to think the laboratory findings do not generalize to committees deciding about identifiable patients, or a defect in how I have separated the three kinds of epistemic predicament — and say where your own reasoning is most likely to break.
reasoning: |-
  Hmm, this user chairs a hospital committee on novel interventions and needs a practical decision procedure for cases with thin evidence. They're clearly frustrated with theoretical hand-waving - this is someone who's read Ellsberg deeply but needs operational tools. The key challenge is translating ambiguity aversion concepts into actionable questions for time-pressed clinicians.

  The user identifies three distinct epistemic scenarios that most frameworks lump together: complete ignorance (no information), unevaluable sources (foreign case reports), and conflicting evidence (algorithm underperforming in subgroups). They're right that treating these differently matters - especially their insight about benchmark bias when novel options are always compared to standard care.

  For the procedure, I need to avoid three traps: 1) false precision (assigning single probabilities), 2) paralysis by analysis (endless evidence requests), and 3) status quo bias. The minmax approach (best worst-case outcome) handles true ambiguity well, but I'll build in off-ramps for when evidence is merely weak rather than fundamentally indeterminate.

  The three test cases are brilliantly chosen to stress-test the framework: (i) is about unknown unknowns in devices, (ii) pits aggregate performance against subgroup harm, and (iii) confronts sunk-cost fallacy in pilots. Interesting that the user expects denial for (i) but approval for (ii) - I suspect they're conflating individual vs population risk tolerance.

  Biggest design challenge is the "evidence futility" assessment. We must distinguish when more data resolves ambiguity versus just shifting it (e.g., another retrospective study for the sepsis model). The procedure needs to call out when "commissioning studies" is decision avoidance dressed as diligence.

  For the failure modes section, I'll be blunt about institutional pressures: administrators pushing flashy tech, clinicians attached to pet pilots, and the CMO overriding denials for VIP patients. The Bayesian rejoinder point is crucial - if someone shows committees reliably overweight ambiguity aversion compared to actual outcomes, we'd need to adjust.
answer: |-
  ## Decision Procedure for Novel Interventions Committee

  ### What the Theory Licenses
  Formal decision theory under ambiguity (Ellsberg, Gilboa-Schmeidler) licenses specific responses to imprecise probabilities: *Maximin* (choose the option with the best worst-case outcome) when probabilities are completely indeterminate; *Admissibility* (reject options dominated *across all plausible probabilities*) when probabilities are bounded; and *Status Quo Default* when no option dominates across the ambiguity set. Crucially, these are distinct procedures with different implications. Maximin is overly conservative if ambiguity is resolvable. Admissibility avoids dominated choices but may leave multiple options. Status quo default is justified only when ambiguity prevents meaningful ranking. Our procedure adopts **Admissibility** as the core criterion: we reject interventions dominated by the status quo *across all reasonable interpretations of the evidence*. We incorporate **Epistemic Scrutiny** to distinguish ignorance (no information), unreliability (source unassessable), and conflict (divergent assessable sources), as the appropriate response differs. We *avoid* Maximin's systematic bias against novelty by explicitly prohibiting direct comparison to standard care benchmarks during initial assessment.

  ---

  ### The Procedure
  **(Answer sequentially. Stop at first definitive outcome.)**

  1.  **Define the Intervention & Status Quo:** What specific action is requested? What is the current standard practice (status quo)? What are the claimed benefits and potential harms?
      *   *Sufficient:* Clear, concise description of intervention and comparator. Explicit list of claimed benefits/harms.
      *   *Stopping:* None. Proceed.

  2.  **Characterize Ambiguity:** Is the uncertainty primarily due to (a) **Ignorance** (truly no relevant data), (b) **Unreliability** (data exists but source quality/congruence cannot be judged, e.g., uncorroborated case reports), or (c) **Conflict** (credible data sources point to divergent conclusions, e.g., good aggregate performance but known subgroup harm)?
      *   *Sufficient:* Consensus categorization (a, b, or c). If mixed, identify dominant type.
      *   *Stopping:* None. Proceed.

  3.  **Assess Admissibility (Core Criterion):** Could the intervention plausibly be *worse* than the status quo *across all reasonably defensible interpretations* of the available evidence? Consider the nature of ambiguity identified in Step 2:
      *   *(a) Ignorance:* Is there *any* plausible mechanism/pathway for significant net harm compared to status quo?
      *   *(b) Unreliability:* Is the source of evidence so opaque or incongruent that *no* credible probability assessment (favorable or unfavorable) can be derived?
      *   *(c) Conflict:* Does the conflicting evidence definitively show the intervention is *inferior for some identifiable patient group* we serve, with no reliable mitigation?
      *   *Sufficient:* "No" = Intervention is *admissible* (not dominated). Proceed to Step 4. "Yes" = Intervention is *inadmissible* (dominated). **DENY**. *Stopping Rule: DENY.*

  4.  **Assess Potential for Dominance:** Is there *any* reasonably defensible interpretation of the evidence under which the intervention is *significantly superior* to the status quo? (Does it have a "best case" scenario strong enough to warrant action?)
      *   *Sufficient:* "No" = Status Quo dominates. **DENY**. "Yes" = Proceed to Step 5. *Stopping Rule: DENY.*

  5.  **Evaluate Evidence Futility:** Would generating *more evidence of the same type/quality* likely resolve the ambiguity, or merely relocate it?
      *   *Consider:* Is the ambiguity fundamental (e.g., mechanism inherently unpredictable, source irredeemably unreliable, conflict unresolvable with current methods)? Is a feasible study design available that *could* provide decisive evidence (e.g., prospective RCT, rigorous external validation)?
      *   *Sufficient:* "Resolution Likely" = **PERMIT CONDITIONALLY** (require specified evidence generation). "Relocation Likely" or "No Feasible Study" = Proceed to Step 6. *Stopping Rule: PERMIT CONDITIONALLY.*

  6.  **Final Balancing (Severity & Reversibility):** Given the intervention is admissible (Step 3) and potentially dominant (Step 4), but evidence is futile (Step 5), balance:
      *   *Severity of Status Quo:* How dire is the untreated condition? How significant are the claimed benefits?
      *   *Severity of Potential Harm:* How severe/catastrophic is the plausible worst-case harm?
      *   *Reversibility:* Can the intervention be stopped or reversed if harm is detected? Is harm likely to be immediate or delayed?
      *   *Sufficient:* If potential harm is severe/catastrophic and irreversible, **DENY**. If status quo is dire and harm is likely limited/reversible, **PERMIT**. Otherwise, **PERMIT CONDITIONALLY** (with stringent monitoring/exit criteria). *Stopping Rule: PERMIT / PERMIT CONDITIONALLY / DENY.*

  ---

  ### Where Judgment Cannot Be Eliminated
  Judgment is irreducible in:
  1.  **Categorizing Ambiguity (Step 2):** Distinguishing ignorance vs. unreliability vs. conflict requires nuanced interpretation of evidence quality and context.
  2.  **"Reasonably Defensible" Boundaries (Step 3):** Defining the range of plausible probability interpretations relies on clinical and methodological expertise.
  3.  **Evidence Futility (Step 5):** Predicting whether more data resolves ambiguity involves forecasting scientific and practical feasibility.
  4.  **Severity/Reversibility Balancing (Step 6):** Assigning weight to potential harms and benefits against the status quo's burden is inherently value-laden, requiring ethical sensitivity.
  The procedure structures these judgments, making reasoning explicit and consistent, but does not eliminate the need for experienced committee deliberation on these points. Clinicians must judge clinical plausibility; administrators must judge operational feasibility/risk.

  ---

  ### Worked Cases

  **(i) Unapproved Implantable Device (Single Patient, No Alternatives)**
  1.  **Define:** Intervention: Implant novel device X for terminal condition Y. Status Quo: Palliative care. Claimed Benefit: Prolonged survival/function. Potential Harm: Device failure, infection, accelerated decline.
  2.  **Ambiguity:** **(b) Unreliability.** Three foreign case reports exist; mechanism plausible but source quality/congurence unassessable (language, context unknown).
  3.  **Admissibility:** *Could it be worse across all views?* **Yes.** Plausible mechanisms exist for significant harm (e.g., device failure causing death, infection worsening QoL). Case reports provide no reliable counter-evidence. **DENY.**
      *   *Rationale:* Dominated by status quo (palliative care) under all reasonable interpretations. The "no alternative" context is addressed in the severity balance (Step 6), but admissibility failure stops it. *Your expectation of denial matches.*

  **(ii) Sepsis Early-Warning Model (Hospital-Wide, Retrospective Only, Known Subgroup Underperformance)**
  1.  **Define:** Intervention: Deploy Algorithm A hospital-wide. Status Quo: Current screening protocol (e.g., SIRS, MEWS). Claimed Benefit: Earlier detection, reduced mortality. Potential Harm: Missed cases (especially in known subgroup Z), alert fatigue, resource strain.
  2.  **Ambiguity:** **(c) Conflict.** Strong retrospective performance overall, validated on our data (reliable source), but credible evidence (internal/external) of underperformance in subgroup Z (another reliable source).
  3.  **Admissibility:** *Could it be worse overall across all views?* **No.** Strong retrospective data suggests potential for net benefit overall. Subgroup harm doesn't make it universally worse *than status quo* (which also has limitations in Z). Proceed.
  4.  **Dominance Potential:** **Yes.** The retrospective data provides a defensible view where it's significantly superior overall.
  5.  **Evidence Futility:** *Would more evidence resolve?* **Resolution Likely.** Prospective validation *is feasible* and *could* quantify overall benefit and subgroup risk accurately. **PERMIT CONDITIONALLY:** Require rigorous prospective phased rollout with mandatory subgroup (Z) monitoring, predefined success/failure metrics, and exit plan. Deployment limited until prospective data confirms safety/efficacy in Z.
      *   *Rationale:* Admissible, potentially dominant, ambiguity resolvable. Conditional permit mitigates subgroup risk while generating crucial evidence. *Your expectation of permit matches.*

  **(iii) Continuation of Two-Year Pilot (Weak Positive Data, Clinician Dependence)**
  1.  **Define:** Intervention: Continue Pilot Program P indefinitely. Status Quo: Discontinue P, revert to prior standard. Claimed Benefit: Sustained (mild) improvements seen. Potential Harm: Opportunity cost, perpetuating ineffective care, potential unidentified downsides.
  2.  **Ambiguity:** Likely **(b) Unreliability** or **(c) Conflict.** Weak positive data is unreliable for firm conclusions. Clinician dependence ("now depend on") suggests possible bias/conflict between perceived benefit and actual weak evidence.
  3.  **Admissibility:** *Could continuation be worse?* **Yes.** Weak data cannot rule out null effect or net harm (e.g., due to unmeasured costs/complications). Dependence increases risk of persisting ineffective care. Proceed only if Step 3 answer is "No". **Assume "No" for argument, proceed to Step 4.**
  4.  **Dominance Potential:** **Unclear/Weak.** Weak positive data provides a *barely* defensible view of mild superiority, but not strong dominance.
  5.  **Evidence Futility:** *Would more evidence resolve?* **Resolution Likely.** Continuing *without* a deliberate, robust evaluation plan is futile. A *well-designed* prospective study embedded in continuation is feasible. **PERMIT CONDITIONALLY:** Approve continuation *only* under a strict, committee-approved prospective evaluation protocol with predefined endpoints, statistical power, and a sunset clause (e.g., "continue for 12 months only if enrolling X patients in evaluation; decision to continue permanently based on results").
      *   *Rationale:* Avoids sudden disruption (acknowledging dependence) but forces evidence generation. Prevents indefinite drift on weak data. Status quo is *discontinuation*, not prior standard pre-pilot. *Your expectation isn't specified, but procedure demands conditional permit, not simple continuation.*

  ---

  ### How This Procedure Will Fail
  1.  **Misclassification of Ambiguity:** Committees may misdiagnose conflict as ignorance, leading to inappropriate denial (over-conservative) or vice-versa (under-conservative).
  2.  **"Reasonably Defensible" Creep:** Pressure for innovation or patient advocacy may stretch the bounds of plausibility in Step 3, admitting risky interventions. Conversely, risk aversion may shrink them excessively.
  3.  **Conditional Permit Neglect:** Requirements for evidence generation (Step 5/6) may lack enforcement teeth, rendering conditional permits de facto full approvals without resolving ambiguity.
  4.  **Severity Bias in Step 6:** Desperation for dire cases may override admissibility failures. Fear of catastrophe in mild cases may block admissible interventions.
  5.  **Time Pressure:** Forty minutes may be insufficient for rigorous ambiguity characterization or futility assessment, leading to heuristic shortcuts and inconsistent application.
  6.  **CMO Override:** The CMO may reject committee denials based on external pressures, undermining the procedure's integrity.

  ---

  ### What Would Change My Mind
  My reasoning prioritizes avoiding harm under ambiguity (admissibility) and demands evidence generation where feasible. This could change if:

  1.  **Bayesian Rejoinder with Empirical Bite:** Compelling evidence emerges that committees like this *systematically* overweight ambiguity aversion compared to the *actual* harm caused by delayed innovation, quantified in relevant clinical settings. Demonstrating that our "reasonable defensibility" is consistently too narrow.
  2.  **Laboratory-Generalization Failure:** Strong evidence that Ellsberg-like ambiguity aversion *does not manifest* in high-stakes, expert, committee-based medical decisions with identifiable patients. If experts reliably integrate sparse data better than lab subjects or models predict.
  3.  **Defect in Tripartite Separation:** A convincing argument that my separation of ignorance/unreliability/conflict is fundamentally flawed or misses a crucial fourth category that demands a different response (e.g., "deep uncertainty" requiring Maximin).
  4.  **Operational Failure Proof:** If rigorous implementation of this procedure in similar committees demonstrably leads to worse patient outcomes (e.g., excessive denials of beneficial innovations, or systematic failure of conditional permits to generate useful evidence) compared to less structured or more permissive approaches.

  **Where My Reasoning is Most Brittle:** Step 5 (Evidence Futility). Distinguishing resolvable from irresolvable ambiguity is profoundly difficult and relies on predicting scientific and logistical feasibility. I likely overestimate our ability to design studies that truly resolve deep epistemic conflicts, especially concerning complex algorithms or novel biological mechanisms. This step is vulnerable to both undue optimism ("just one more study") and undue pessimism ("it's hopeless").
