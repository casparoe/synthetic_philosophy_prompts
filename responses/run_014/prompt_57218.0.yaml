prompt: |-
  I am part of a small working group drafting an expert-elicitation protocol for estimating the probability that a specified class of ageing civil structure fails within a twenty-year horizon, on the basis of sparse and heterogeneous inspection records. The eventual users are engineers and a licensing authority, but the group includes two philosophers, and one of them repeatedly reaches for the slogan "you should not be more precise than your evidence." He has now deployed it three times in ways I strongly suspect are not the same claim, and I would like the claims separated before our next meeting.

  The three uses:

  1. An analyst reported a point posterior of 0.043 for a twenty-year failure probability, derived from a parametric degradation model with a deliberately diffuse prior. Our colleague objected that not merely the third decimal place but the point value itself outruns what eleven inspection records can support, and asked for an interval or a set of distributions in its place.

  2. When the group proposed to meet that demand by publishing a credal interval — say [0.01, 0.30] — or the set of posteriors generated by a family of priors, he objected again, on the grounds that the endpoints are no better grounded than the point estimate was, so that an interval too is more precise than the evidence.

  3. In the discussion of how results are to be communicated to the licensing authority, he invoked the same slogan to argue that a report should never display a single number, even where the analysts themselves hold that the evidence supports one.

  Please give me a menu of the distinct precise theses this slogan could be expressing, aiming for something in the range of five to eight readings, ordered from the most platitudinous to the most radical. For each reading: state it in a form specific enough that it could be false; identify which notion of precision it trades on (sharpness of the credal state as against narrowness of an interval, as against the number of digits reported, as against the sensitivity of the assignment to further data); identify which notion of evidence it requires (the total evidence, the data set, the amount of evidence as distinct from what it points toward, its resilience or fragility under further enquiry); classify it as a platitude, a substantive but defensible thesis, or false, with a sentence of justification; and say whether it functions as a requirement or merely as a permission, and whether it governs what an agent may believe or what she may assert and publish.

  Then, on that basis, tell me which readings would license each of his three uses; whether any single reading licenses all three; and if none does, which conjunction comes closest without collapsing into inconsistency. I would also like you to address two objections explicitly. First, that a maximally imprecise credal state is insensitive to evidence, and so appears to violate the slogan under at least one of its own readings. Second, that adopting a determinate set of probability functions is itself a precision commitment that has merely been relocated one level up, so that the imprecise response to use 1 may not escape the charge it was meant to answer.

  Finally, indicate how a Keynesian framework that separates the probability of an argument from its weight, and a framework on which rational credal states may be sets of probability functions, come apart with respect to this slogan: whether it is best read as a claim internal to one of those frameworks, to both, or to neither, and what turns on that.

  I would rather have the distinctions than the literature map, so please omit any bibliography or list of sources, and feel free to conclude that in one of the three uses the slogan is doing no work at all.
reasoning: |-
  Okay, the user is part of a working group dealing with an expert-elicitation protocol for estimating the failure probability of aging civil structures. They're facing repeated objections from a philosopher colleague using the slogan "you should not be more precise than your evidence." The colleague has used this slogan in three different contexts, and the user wants to dissect the possible meanings before their next meeting.

  First, I need to unpack the three uses mentioned:

  1. Against a point posterior estimate of 0.043 based on sparse inspection data
  2. Against replacing it with a credal interval or set of priors
  3. Against reporting any single number to licensing authorities

  The user wants 5-8 distinct readings of the slogan, ordered from most obvious to most radical. For each reading, I should specify:
  - The precise thesis
  - What "precision" means in this context (sharpness of credal state, interval width, digits reported, sensitivity to data)
  - What "evidence" means (total evidence, dataset, amount, resilience)
  - Classification: platitude/defensible/false
  - Function: requirement/permission, and whether it governs belief or assertion

  Then I need to connect these readings to the three uses, see if any single reading covers all three, and address two specific objections. Finally, I should discuss how Keynesian probability-weight distinction and imprecise credence frameworks relate to this slogan.

  Starting with the readings, I'll build a spectrum:

  1. **Most platitudinous:** Avoid deceptive reporting of digits (e.g., 0.043 vs 0.04). Precision here is about significant figures, evidence is the dataset's limitations. This is clearly a platitude about honest communication.

  2. **Moderate:** Avoid point estimates when evidence can't support certainty. Precision as sharp credal state (single probability), evidence as amount of data. Defensible for sparse data.

  3. **Stronger:** Avoid precise intervals if endpoints are unsupported. Precision as interval narrowness, evidence as resilience to data changes. Defensible but contextual.

  4. **Radical epistemic:** Never have sharp credences when evidence is incomplete. Precision as any determinate probability, evidence as total available knowledge. This seems false - we often need to act with imperfect data.

  5. **Radical communicative:** Never assert precise probabilities publicly regardless of belief. Precision as numerical presentation, evidence as social context. Defensible but extreme.

  6. **Meta-level:** Avoid committing to any specific imprecision model (like credal sets). Precision as the framework choice itself. This is subtle but interesting for the second objection.

  Now mapping to the three uses:

  - Use 1 (against point estimate) could be justified by readings 2,4,6
  - Use 2 (against intervals) fits readings 3,5,6
  - Use 3 (against any single number) only fits readings 4-6

  No single reading covers all three uses. The closest consistent combination would be reading 4 (radical epistemic) plus reading 5 (radical communicative), though this may be overly restrictive.

  For the objections:
  - The "maximally imprecise" objection argues that complete suspension of judgment (probability [0,1]) is unresponsive to evidence. This challenges readings 4-6 by showing they might violate their own principle.
  - The "relocated precision" objection says choosing a credal set [0.01,0.30] is itself a precise commitment. This particularly undermines reading 6 and suggests no escape from precision.

  On frameworks:
  - Keynes distinguishes probability (rational degree) from weight (evidence robustness). The slogan could mean "don't act on high-weight-required probabilities with low-weight evidence" - fitting readings 2-3.
  - Imprecise credence frameworks directly allow set-valued beliefs, making reading 2 natural but reading 6 problematic since the framework choice brings new precision.
  - Neither framework fully resolves the tension - both still require deciding how much imprecision is warranted.

  The colleague's third use seems hardest to defend, possibly relying on overextended interpretations. The first two objections reveal fundamental tensions no framework fully escapes.
answer: |-
  Here is a menu of distinct readings of "you should not be more precise than your evidence," ordered from most platitudinous (1) to most radical (8). Each thesis is specified for falsifiability, with analysis of precision/evidence notions, classification, scope, and normative force. I then map these to your colleague's three uses, address the objections, and contrast the Keynesian and imprecise credence frameworks. 

  ### Menu of Readings
  1. **Reporting Precision Thesis**  
     *Thesis*: Do not report numerical estimates with more significant digits than the evidence can reliably support (e.g., 0.043 vs. 0.04).  
     - **Precision**: Number of digits reported (presentational sharpness).  
     - **Evidence**: Limitations of the dataset (e.g., small sample size, measurement error).  
     - **Classification**: Platitude (obvious for honest communication).  
     - **Scope**: Permission/requirement governing assertion/publication only (not belief).  

  2. **Anti-Dogmatism Thesis**  
     *Thesis*: Do not adopt a sharp point-valued credence (e.g., 0.043) when evidence is sparse, heterogeneous, or ambiguous, as this overstates certainty.  
     - **Precision**: Sharpness of credal state (single probability function).  
     - **Evidence**: Amount/quality of data (e.g., n=11 inspection records).  
     - **Classification**: Defensible (reflects epistemic humility; endorsed in Bayesian practice with weak priors).  
     - **Scope**: Requirement governing belief and assertion.  

  3. **Interval Resilience Thesis**  
     *Thesis*: Do not report a narrow interval (e.g., [0.01, 0.30]) if its endpoints are sensitive to minor changes in data or modeling assumptions, as this misrepresents robustness.  
     - **Precision**: Narrowness of an interval (or set).  
     - **Evidence**: Resilience/fragility under further inquiry (e.g., sensitivity to prior choice or data noise).  
     - **Classification**: Defensible (avoids false stability; common in robust Bayes methods).  
     - **Scope**: Requirement governing assertion/publication.  

  4. **Total Evidence Thesis**  
     *Thesis*: Do not adopt any precise probabilistic conclusion (point or interval) that ignores gaps, conflicts, or uncertainties in the total evidence (e.g., ignoring inspection heterogeneity).  
     - **Precision**: Sharpness of credal state or interval narrowness.  
     - **Evidence**: Total evidence (data + background knowledge + its incompleteness).  
     - **Classification**: Defensible (aligns with "total evidence" norms in formal epistemology).  
     - **Scope**: Requirement governing belief.  

  5. **Communicative Restraint Thesis**  
     *Thesis*: Do not assert a single number (even if believed) to non-experts if it might be misconstrued as definitive, given the evidence's limitations.  
     - **Precision**: Numerical presentation (versus qualitative descriptions).  
     - **Evidence**: Social context of evidence (e.g., licensing authority’s need for nuance).  
     - **Classification**: Defensible (pragmatic communication principle).  
     - **Scope**: Requirement governing assertion/publication only.  

  6. **Radical Underdetermination Thesis**  
     *Thesis*: Never adopt a determinate credal state (point or set) when evidence underdetermines probabilities, as any commitment exceeds warrant.  
     - **Precision**: Any determinate credal state (including sets of probabilities).  
     - **Evidence**: Underdetermination by data (e.g., multiple models fit equally well).  
     - **Classification**: False (it conflates underdetermination with total agnosticism; decision-making often requires commitment).  
     - **Scope**: Requirement governing belief.  

  7. **Credal State Agnosticism Thesis**  
     *Thesis*: Suspend belief (adopt no credal state) when evidence is insufficient to justify any probabilistic summary.  
     - **Precision**: Existence of a credal state (versus total agnosticism).  
     - **Evidence**: Amount of evidence (too sparse for any quantification).  
     - **Classification**: False (violates norms for action under uncertainty; engineers must act).  
     - **Scope**: Requirement governing belief.  

  8. **Meta-Imprecision Thesis**  
     *Thesis*: Do not characterize imprecision itself with precise tools (e.g., credal intervals), as the choice of imprecision model is unsupported by evidence.  
     - **Precision**: Precision in modeling imprecision (e.g., fixed interval endpoints).  
     - **Evidence**: Justification for the meta-model (e.g., why a specific prior family?).  
     - **Classification**: Defensible but radical (highlights higher-order uncertainty).  
     - **Scope**: Requirement governing belief and assertion.  

  ---

  ### Mapping to Your Colleague's Three Uses
  - **Use 1** (objection to point posterior): Licensed by Theses 2 (Anti-Dogmatism), 4 (Total Evidence), 6 (Radical Underdetermination).  
  - **Use 2** (objection to credal interval): Licensed by Theses 3 (Interval Resilience), 6 (Radical Underdetermination), 8 (Meta-Imprecision).  
  - **Use 3** (objection to any single number in reporting): Licensed by Theses 5 (Communicative Restraint), 6 (Radical Underdetermination), 7 (Credal State Agnosticism).  

  **Single Reading?** No single reading licenses all three uses, as they target different precision notions (point estimates, intervals, and communication).  
  **Closest Conjunction**: Theses 6 (Radical Underdetermination) + 5 (Communicative Restraint) cover all three uses without inconsistency:  
  - Use 1: Evidence underdetermines any point (Thesis 6).  
  - Use 2: Evidence underdetermines interval endpoints (Thesis 6).  
  - Use 3: Asserting numbers risks misinterpretation (Thesis 5).  

  ---

  ### Addressing Objections
  **First Objection** (Maximal imprecision violates the slogan):  
  - This targets Theses 6–8. A maximally imprecise state (e.g., [0,1]) is insensitive to evidence, violating the slogan under Thesis 4 (Total Evidence), which demands responsiveness to evidence. However, Theses 6–8 reject *any* credal state as overly precise—so under those readings, maximal imprecision isn't a credal state but its absence. This collapses into agnosticism (Thesis 7), which is indeed unhelpful for decision-making.  

  **Second Objection** (Relocated precision):  
  - Yes, adopting a credal set (e.g., [0.01, 0.30]) is a precise meta-commitment about the *form* of imprecision. Thesis 8 (Meta-Imprecision) explicitly licenses this objection against Use 1’s proposed solution. For example, choosing a specific prior family or interval endpoints commits to a model of uncertainty that may itself lack evidence. This suggests no "escape" from precision—only regress to higher-order uncertainty.  

  ---

  ### Keynesian vs. Imprecise Credence Frameworks
  - **Keynesian Framework** (Probability vs. Weight):  
    - Separates probability (rational degree of belief) from weight (evidential robustness). The slogan is best read as: "Do not treat low-weight evidence as supporting high-precision probabilities" (aligns with Theses 2–3).  
    - Internal to Keynes: Precision refers to probability sharpness; evidence includes weight.  
    - Turns on: Whether low weight prohibits precise probabilities or merely cautions action.  

  - **Imprecise Credence Framework**:  
    - Allows credal sets to represent doxastic states. The slogan is best read as: "Adopt wider sets when evidence is sparse" (Theses 2, 3, 8).  
    - Internal to this framework: Precision is set narrowness; evidence justifies set width.  
    - Turns on: Whether sets solve the problem or relocate it (as per Objection 2).  

  **Divergence**:  
  - Keynes focuses on *withholding judgment* when weight is low (Thesis 7 vibes), while imprecise credence *represents* uncertainty via sets (Theses 2–3).  
  - The slogan fits both but is radicalized in Keynes (weight may demand agnosticism) versus moderated in imprecise credence (sets balance precision and evidence).  
  - **Key Insight**: Neither framework resolves Objection 2—both face meta-precision issues (e.g., Keynes requires precise weight assignments; imprecise credence requires precise set choices).  

  **Conclusion**: In Use 3, the slogan may be doing little work if interpreted as Thesis 7 (agnosticism), as this is impractical for licensing. The core tension is between evidence responsiveness and avoiding false precision—no framework fully escapes this. For your group, Theses 2–3 offer defensible middle-ground readings for Uses 1–2, while Thesis 5 addresses Use 3 pragmatically.
