prompt: |-
  Not sure if there's an established term for a thing I keep noticing, so let me try to describe it and you tell me. The pattern is about a certain class of beliefs (or maybe "beliefs", I'm not even sure they count as that) which are weird in three connected ways. First, they're not so much strongly confirmed as not up for confirmation at all — nobody checks them against evidence, and it's not even clear what checking would look like. Second, when you demand a justification for them, the results are always disappointing: either circular ("my memory tells me my memory is reliable") or a flat refusal to engage ("that's not a serious question"), and the refusal doesn't feel like a cop-out. Third, and this is the part I find most interesting, doubting them doesn't feel like entertaining a rival possibility the way doubting, say, that my neighbor is a spy does — it feels more like the doubt can't get a grip anywhere, like there's nowhere for it to stand.

  Concrete-ish cases: whether the world existed five minutes ago; whether I have two hands; whether other people have inner lives; whether the future will resemble the past enough for induction to work. None of these are self-evident in the way "2+2=4" is — "the world is older than five minutes" isn't a logical truth — and none of them are just very well-supported empirical beliefs either, since any support would have to go through them.

  Now, I know the standard moves around the regress problem, foundationalism, coherentism, etc. But that literature seems to be about how to justify beliefs, and what I'm pointing at is a class of commitments that seem exempt from the justification game without anyone being able to say why, and maybe without the exemption being a defect. The closest thing I know is Quine's picture where everything is revisable in principle, some things just from the middle of the web — but that actually cuts against what I'm noticing, since the commitments I mean don't seem revisable-at-a-price, they seem to be part of the machinery that makes revision possible at all. Also worth flagging the dark version: someone raised in a belief system where a foundational commitment ("the authorities can be trusted") functions exactly like this — no argument, no need for one, and doubting it feels like malfunction. Is that the same phenomenon, or a pretender? I genuinely don't know.

  So: does this configuration have a name? What are the nearest established concepts, and how does what I'm describing differ from each of them? If nothing quite fits, I'd want you to coin a term, define it, and give a couple of boundry cases that show where it stops applying. Also, since I suspect people in this corner of philosophy fight about it alot, please seperate what's actually settled from what's genuinely contested, and don't sell me one side's view as the consensus.
reasoning: |-
  Okay, the user is describing a specific type of belief that seems foundational yet elusive. They mention three key characteristics: these beliefs aren't subject to empirical confirmation, justifications for them are circular or met with dismissal, and doubting them feels impossible because there's no ground for the doubt to take hold. Examples include the existence of the external world and other minds. 

  First, I need to recall philosophical concepts that might fit. Foundationalism comes to mind, especially basic beliefs, but the user already noted that their examples aren't self-evident like logical truths. G.E. Moore's common sense might be relevant, but Moore still tried to justify his beliefs, which the user says isn't happening here. Wittgenstein's hinge propositions seem closer—those certainties that form the framework for doubt and inquiry. The user's examples align with hinges like the world existing or other minds. 

  The user also mentions Quine's web of belief, but notes that Quine allows revisability, whereas their beliefs seem unrevisable. Hinge propositions better capture that rigidity. The dark version—like trusting authorities unquestioningly—raises the question of whether harmful beliefs can function similarly. Wittgenstein's hinges are typically shared, enabling communication, while the dark case might be more ideological. That distinction needs clarification. 

  I should also consider whether these are properly called "beliefs." The user put "beliefs" in quotes, hinting at uncertainty. Wittgenstein argued that hinges aren't beliefs but the scaffolding for them. That might explain why they resist justification—they're not propositions to be assessed but rules of the language-game. 

  The user wants to know if there's a term for this. Hinge propositions fit best. They should also be aware of related ideas like presuppositions or transcendental arguments, but those don't fully match. For the dark case, it's structurally similar but differs in origin—hinges are cultural/biological, while indoctrinated trust is imposed. 

  The contested points: whether hinges are truly unrevisable (Wittgenstein vs. Moyal-Sharrock), and if they're innate or formed. Also, the role in epistemology—foundationalists might co-opt hinges, but Wittgenstein rejected their justificatory role. 

  Finally, coining a term isn't necessary since "hinge" exists, but emphasizing its features: non-justificatory, doubt-resistant, framework-setting. Boundary cases like "the sky is blue" (empirical) vs. "the sky exists" (hinge) can illustrate the difference.
answer: |-
  Your description is exceptionally precise and points directly to a recognized concept in epistemology: **hinge propositions** (or **hinge commitments**) as articulated by **Ludwig Wittgenstein** in his final work, *On Certainty*. This isn't the *only* related concept, but it's the closest fit for your three criteria. Below is a structured analysis:

  ### The Core Concept: Hinge Propositions (Wittgenstein)
  1.  **Not Up for Confirmation/Verification:** Hinges aren't empirical hypotheses we test. They form the "*scaffolding*" (Wittgenstein) or "*bedrock*" upon which our language games, doubt, inquiry, and justification *rest*. Asking for evidence for "I have two hands" in normal contexts isn't a request for proof; it's a sign the language game itself has broken down.
  2.  **Disappointing Justification:** Attempts to justify hinges lead to circularity, infinite regress, or (crucially) **dismissal as nonsensical**. As Wittgenstein says, "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty." Demanding justification for a hinge isn't a serious move *within* the game; it challenges the game's framework.
  3.  **Doubt Can't Get a Grip:** Doubting a hinge isn't like doubting a specific fact ("Is my neighbor a spy?"). It feels like trying to doubt the *framework* within which doubt makes sense. "My doubt itself rests" on these certainties. There's nowhere "outside" to stand to doubt them meaningfully; any attempt to doubt *presupposes* them.

  **How Your Examples Fit:**
  *   "The world existed five minutes ago," "I have two hands," "Other people have inner lives," "The future resembles the past" – these are classic Wittgensteinian hinge propositions. They are not logical truths, nor are they empirically justified *in the usual way*; any empirical justification (e.g., using memory, induction, testimony, perception) *already relies* on them.

  ### Key Differences from Neighboring Concepts
  1.  **Foundationalist "Basic Beliefs":** (e.g., Descartes' cogito, sense-data beliefs). While foundationalists seek unshakable starting points, they often *do* try to justify them (Descartes' methodical doubt) or claim they are self-justifying/self-evident. Hinges are **not justified at all**; they are the *preconditions* for justification. They aren't "self-evident" in the way 2+2=4 is; they are *animal* or *practical* certainties.
  2.  **Coherentist Web of Belief (Quine):** Quine sees beliefs as mutually supporting and *all* revisable "in principle," some just being more central (hence harder to revise). **Your key insight directly challenges this:** Hinges aren *not* revisable "from the middle"; they are the *frame* holding the web. Revising them isn't difficult; it destroys the possibility of revision itself. Wittgenstein agrees: "The *questions* that we raise and our *doubts* depend on the fact that some propositions are exempt from doubt" (OC 341).
  3.  **Presuppositions:** Hinges often function as presuppositions for specific inquiries or language games. But "presupposition" is broader and often context-dependent (e.g., "The King of France is bald" presupposes there is a King of France). Hinges are the **deepest, universal, framework-level presuppositions** constitutive of rational thought and inquiry *as such*.
  4.  **Transcendental Arguments (Kant):** These argue "X must be true for Y (e.g., experience, knowledge) to be possible." This captures the *role* of hinges. However, transcendental arguments aim to *justify* X. Wittgenstein is more radical: hinges aren't *justified* by this role; they are simply *how we act*, and their status is revealed through grammatical investigation, not proof.

  ### The Dark Version: Is it the Same Phenomenon?
  *   **Structurally Identical, Functionally Similar, Differ in Origin/Normativity:** Yes, the mechanism you describe ("the authorities can be trusted") functions *exactly* like a hinge *within that specific belief system*. Doubting it *feels* like cognitive malfunction *to the adherent*.
  *   **Key Differences:**
      *   **Scope/Universality:** Wittgensteinian hinges are typically *universal* (or near-universal) conditions for human thought/language ("I have hands," "Objects persist," "People have minds"). Culturally specific ideological hinges ("Authorities are infallible") are **local and contingent**.
      *   **Origin:** Universal hinges arise from our biological form of life and shared human practices. Ideological hinges are culturally/socially imposed.
      *   **Normative Status:** Wittgenstein saw universal hinges as enabling rationality itself. Ideological hinges often *disable* critical rationality *beyond* their system. They are **pathological hinges** – structurally hinge-like but epistemically harmful. Wittgenstein acknowledged the possibility: "I could imagine a man who... believes he has been on the moon; believes what is false" (OC 108), but saw this as rare and unstable.

  ### What's Settled vs. What's Contested
  *   **Settled (Broad Consensus):**
      *   Wittgenstein accurately identified this class of commitments.
      *   They resist standard justification (empirical, logical).
      *   They function as necessary preconditions for doubt, inquiry, and justification.
      *   Attempting to doubt them globally leads to incoherence.
  *   **Genuinely Contested:**
      1.  **Nature:** Are hinges *beliefs* at all? Wittgenstein wavered, calling them "propositions" but also "ways of acting" or "part of our frame of reference." Some (e.g., Danièle Moyal-Sharrock) argue they are *non-propositional* – **animal certainties** expressed in action, not held as beliefs. Others insist they *are* a special class of beliefs.
      2.  **Revisability:** *Must* they be unrevisable? Wittgenstein leans heavily towards "yes." Others (influenced by Quine or historicism) argue they *can* shift over very long timescales or in radical paradigm shifts (e.g., scientific revolutions), though this destabilizes *everything* temporarily. Is the "hinge" status permanent or contextual?
      3.  **Source/Epistemic Status:** Are they innate? Biologically grounded? Socially constructed? Do they confer *any* kind of justification ("entitlement" - Crispin Wright), or are they simply *arational*? Foundationalists try to co-opt them; Wittgensteinians insist they are *beyond* justification.
      4.  **Scope:** Which propositions are genuinely hinges? "I have two hands" clearly is. What about "The Earth is round"? "Slavery is wrong"? Disagreement exists about the boundary between hinges and very well-justified empirical/moral beliefs.

  ### Coined Term (If Needed)
  While "hinge proposition" is established, a more evocative term capturing your emphasis on doubt's inability to gain traction could be **"Bedrock Commitments"** or **"Framework Certainties."**

  **Boundary Cases:**
  *   **Applies:** "My senses are generally reliable," "The physical world exists independently of my mind," "Language can convey meaning," "Mathematical proofs are generally trustworthy."
  *   **Does Not Apply:**
      *   Well-justified empirical beliefs ("The sky is usually blue here"): These *are* testable and doubt *can* get a grip (check the sky, consider pollution).
      *   Self-evident logical/mathematical truths ("2+2=4"): These are justified by understanding the concepts; doubting them feels like misunderstanding.
      *   Dogmatic beliefs justified by authority alone ("The Party is always right"): While functioning *as* a hinge *within* the system, this lacks the universality and biological grounding of core hinges and is contestable *from outside*. It's a **pseudo-hinge**.
      *   Basic perceptual beliefs ("I see a red patch"): Often considered foundationalist starting points; they *can* be doubted (illusions, hallucinations) and sometimes serve as evidence *for* other things.

  In essence, you've pinpointed Wittgenstein's profound insight: rational inquiry floats, not on a foundation of proven truths, but on a river of ungrounded certainties that shape our form of life. The "dark version" shows this mechanism's power, highlighting the fine line between enabling rationality and enforcing dogma. The core concept is well-established; the fierce debates rage around its implications.
