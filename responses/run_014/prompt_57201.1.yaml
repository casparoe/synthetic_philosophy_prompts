prompt: |-
  A friend of mine is drafting an op-ed for a Scottish broadsheet, timed to the recurring speculation about a second independence referendum, and the spine of his argument is an analogy he says he absorbed from a decade of commentary: a state is a marriage, and independence is a divorce. His version runs like this. No-fault divorce exists precisely because we came to think it wrong to hold two people in a union one of them has left; the marriage may be perfectly valid and the vows sincerely made, and yet the fact that one party no longer wants to be in it is reason enough to dissolve it. So, he argues, if a majority in Scotland votes to leave, Westminster's insistence on the legality of the Union and on undertakings made in 1707 has the same shape as a husband's insistence that his wife is bound by vows she no longer endorses: technically correct, morally bankrupt. He draws a second conclusion from it, that the rump state has no standing to set conditions and only a duty to negotiate the terms of separation, because a court granting a decree does not get to decide whether the marriage should have existed in the first place. The unionist side, he notes, runs the same analogy backwards: divorce means dividing the home and the debts, the children's interests are paramount and they did not choose this, and nobody walks away with the whole house. He wants to keep the analogy because his editor thinks it is the most vivid thing in the draft, and he has asked me whether it can bear the weight he is putting on it. My instinct is that it cannot, but I cannot say precisely where it fails or how much of the argument fails with it.

  So please audit it. First, give me the mapping explicitly — a table of correspondences is fine — filling in the slots the draft leaves vague: who are the two spouses (the peoples, the parliaments, the states as corporate persons?), what plays the part of the vows and of the matrimonial home, what corresponds to the children, to the pre-nuptial agreement, to the no-fault regime, to the court that issues the decree, and what, if anything, corresponds to the fact that a marriage is entered voluntarily while citizenship is acquired by birth and by territory. Second, separate the disanalogies that actually bear on his conclusion from the merely decorative ones. I can already see that a divorce is private between its parties while secession redraws the jurisdiction other people live under, that a divorce does not move a boundary that third parties stand on, that a departing spouse takes a share fixed by contribution and need rather than the geography she happens to be standing on, and that only one side of a secession can invoke exit while either spouse can file. Tell me which of these is load-bearing and which he is entitled to shrug off, and why. Third, say what the analogy quietly imports that the target lacks — in particular whether it smuggles in an answer to the boundary problem, since a divorce presupposes that the parties are already fixed and identifiable whereas the contested question in Scotland, Catalonia and Quebec is exactly who constitutes the unit entitled to decide (and hence whether the vote belongs to Scotland alone or to the whole United Kingdom), and whether it also smuggles in an agreed exit procedure and a tribunal above both parties that in most of these cases simply do not exist.

  Then assess whether the conclusions survive. Does the no-fault line show that a majority vote confers a right to leave, or only that it confers a right to be taken seriously in negotiation — a far weaker claim, and roughly what the Supreme Court of Canada's 1998 secession reference arrived at, namely no unilateral right to secede but an obligation on the rest of the country to negotiate following a clear majority on a clear question? Does the unionist counter-use fare any better, or does it too depend on features of marriage that do not carry over, such as a pre-existing body of rules for splitting assets and a judge with authority over both parties? Finally, tell me whether there is a better analogy in this neighbourhood — a co-owned building whose owners cannot take a wing with them, a club membership, a tenant breaking a shared lease, a corporate spin-off, a redrawing of municipal boundaries — and rank the two or three candidates by how much of the real structure they preserve, saying for the best of them which feature of secession it still cannot reproduce and the analyst has to supply by argument. Two constraints on your reply: please do not send me citations, cases, or a reading list, since I am working without access to sources and want only your own reasoning; and please do not be diplomatic for its own sake. If the analogy turns out to be doing nothing but supplying vividness, say so, and if one of its imports is in fact a genuine insight that both sides in these debates have been ignoring, say that too.
reasoning: |-
  Okay, I need to tackle this user's request about auditing a marriage-divorce analogy for Scottish independence. The user's friend is using this analogy in an op-ed, comparing a state union to a marriage and independence to divorce. The user suspects it might not hold up and wants a thorough analysis. 

  First, I should explicitly map out the correspondences in the analogy. The user mentioned several elements: spouses, vows, matrimonial home, children, pre-nup, no-fault regime, court, and the voluntariness issue. I need to fill in these slots based on the UK-Scotland context. For spouses, it's ambiguous—could be peoples, parliaments, or states. Vows likely mean the Acts of Union 1707. The matrimonial home is UK-wide assets and debts. Children represent citizens or future generations. Pre-nup isn't really there, but maybe historical treaties. No-fault regime parallels modern divorce laws, implying unilateral exit. The court is tricky—perhaps an international body or UK Supreme Court. Citizenship being involuntary vs. marriage voluntary is a key disanalogy.

  Next, I must separate critical disanalogies from decorative ones. Critical ones include: secession affects third parties (like moving borders), unlike divorce; exit rights are asymmetric (only Scotland can secede, while either spouse can divorce); asset division isn't based on geography or contribution in secession; and crucially, the boundary problem—who decides? Scotland alone or the whole UK? These undermine the core argument. Decorative disanalogies might be emotional aspects or duration of union, which don't bear directly on the legal/moral conclusions.

  Then, I need to identify what the analogy smuggles in. It assumes fixed parties (Scotland as a clear unit), but the real debate is whether Scotland is the legitimate decider. It also implies an agreed exit procedure and a neutral tribunal, which don't exist—unlike in divorce courts. This is a major flaw because in secession, there's no higher authority to enforce fairness.

  Assessing the conclusions: the no-fault divorce point suggests a unilateral right to leave, but in reality, secession requires negotiation, as per Canada's Supreme Court in the Quebec case. So the analogy overreaches—it only supports a duty to negotiate, not automatic exit. The unionist counter-use (splitting assets, children's interests) also fails because there's no pre-existing fair division rules or judge, making it just as problematic.

  For better analogies, a co-owned building might work—owners can't just take a wing; they need agreement or legal processes. A corporate spin-off involves negotiation and shared liabilities. Ranking these: co-owned building preserves negotiation necessity but misses the democratic aspect; spin-off handles assets better but ignores territorial issues. The building analogy is best but still can't solve the boundary problem—who are the legitimate owners? That requires external argument.

  Finally, I should be honest: the marriage analogy mainly provides vividness but fails under scrutiny. It smuggles in false equivalences, though it usefully highlights moral claims. The user needs to know its limits and consider alternatives while acknowledging the emotional resonance it adds.
answer: |-
  Here's a systematic audit of the marriage-divorce analogy for Scottish independence, addressing your specific requests:

  ### 1. Mapping the Analogy (Correspondence Table)

  | **Marriage/Divorce Element** | **Correspondence in UK-Scotland Context** | **Ambiguity/Problem** |
  |------------------------------|-------------------------------------------|------------------------|
  | **Spouses**                  | Scotland and England/Wales (as "peoples") OR Scottish Parliament and UK Parliament. *Not* states as corporate persons. | Unclear agency: Who is "leaving"? The people? The government? The territory? |
  | **Marriage Vows**            | Acts of Union 1707 (and subsequent constitutional settlements). | Treaties are renegotiated states; vows are personal/religious. |
  | **Matrimonial Home**         | UK-wide assets, infrastructure, national debt, shared institutions (NHS, BBC, military), territory. | Geographically fixed vs. divisible property. Scotland isn't "taken"; it *is* the territory. |
  | **Children**                 | Citizens (esp. those identifying as British), future generations, residents with split loyalties. | Citizens aren't passive dependents; they are participants with varying identities. |
  | **Pre-Nuptial Agreement**    | Implicit: Historical treaties (e.g., Treaty of Perth), Claim of Right. Explicit: None. | No formal pre-nup exists; UK constitution is uncodified. |
  | **No-Fault Divorce Regime**  | Modern democratic principle of self-determination. | Not a *legal* procedure; just a moral/political argument. |
  | **Court Issuing Decree**     | None naturally exists. (Implied: International Court, UK Supreme Court, or "court of world opinion"). | **Critical absence:** No neutral, binding arbiter in secession. |
  | **Voluntary Entry**          | *Scotland's nobility/parliament in 1707* entered voluntarily. | **Critical disanalogy:** Current Scottish citizens acquired membership by birth/territory, not consent. |

  ### 2. Critical vs. Decorative Disanalogies

  *   **Load-Bearing Disanalogies (Undermine Conclusions):**
      *   **Boundary Problem:** Divorce assumes pre-defined parties ("Mr. & Mrs. Smith"). Secession asks: *Who* is the "self" entitled to decide? Scotland alone? UK-wide? Regions of Scotland? This is the core dispute. The analogy **smuggles in Scotland as the predefined unit**, begging the question.
      *   **Asymmetry of Exit Right:** Either spouse can file for divorce. Only the subunit (Scotland) claims a right to secede; England can't "divorce" Scotland. The analogy falsely implies symmetry.
      *   **Third-Party Impact:** Divorce primarily affects spouses/children. Secession forcibly alters the citizenship, jurisdiction, economy, and borders for millions *outside* Scotland (rUK citizens, international partners, EU). The analogy ignores this massive externality.
      *   **Asset Division Principle:** Divorce splits assets based on contribution, need, law. Secession involves territory, resources (e.g., oil), and population where geography is inherent. "Standing on the land" *is* relevant. Contribution is contested history.
      *   **Lack of Sovereign Arbiter:** Divorce courts have authority over both parties. No equivalent exists in secession. Westminster is *party* to the dispute, not a judge.

  *   **Decorative Disanalogies (Can Be Shrugged Off):**
      *   **Emotional vs. Political:** Divorce is deeply personal; secession is collective/political. (Relevant for rhetoric, not logic).
      *   **Duration/History:** Marriages are shorter; unions are centuries-old with deep entanglement. (Affects complexity, not principle).
      *   **"Children's" Agency:** Citizens have votes/voices; children in divorce do not. (Mitigated if "children" = future gens).

  ### 3. What the Analogy Smuggles In

  *   **The Boundary Solution:** It assumes Scotland is the uncontested, pre-political unit entitled to decide its status. This is the **central point of contention** in real-world secession debates (Scotland, Catalonia, Quebec).
  *   **An Agreed Exit Procedure & Tribunal:** It implies a neutral process (like family court) with rules for dissolution. In reality, no such procedure exists domestically or consistently internationally. Secession is often resolved by power politics or force, not legal decree.
  *   **Moral Equivalence:** It frames Westminster's position as *exactly* like a controlling spouse denying agency. This ignores legitimate rUK concerns about shared liabilities, stability, and *its* democratic rights.

  ### 4. Do the Conclusions Survive?

  *   **Your Friend's "No-Fault" Conclusion (Unilateral Right):** **Fails.** The analogy supports a *moral claim* for Scotland's wishes to be respected but **not** a unilateral right to secede. The lack of a predefined exit procedure, the boundary problem, and third-party impacts mean a vote creates an *obligation to negotiate in good faith* (as per Canada's Supreme Court), **not** automatic dissolution. Westminster insisting on legality isn't inherently "bankrupt"; it reflects the lack of an agreed constitutional exit clause.
  *   **Unionist Counter-Analogy (Splitting Assets/Children):** **Also Fails Significantly.** While highlighting valid concerns (asset division, citizen impact), it relies equally on the non-existent divorce court/judge and predefined rules for splitting the "matrimonial home." Without a binding arbiter and clear rules, "fair division" is purely political contestation. The "children" analogy over-paternalizes citizens.

  ### 5. Better Analogies (Ranked)

  1.  **Co-Owned Building/Property (e.g., Jointly Owned House):**
      *   **Preserves:** Shared ownership, need for agreement to split or sell, entanglement of interests, negotiation over valuation/division, potential for one owner to force a sale (via court) but not unilaterally take a wing.
      *   **Fails:** Territory isn't movable property. Doesn't solve "who are the owners?" (Boundary problem). No inherent democratic element for occupants.
      *   **Requires Argument:** Legitimacy of owners (Scottish voters? UK Parliament?), valuation method, process for forced sale.
  2.  **Corporate Spin-Off/Demerger:**
      *   **Preserves:** Shared assets/liabilities, complex disentanglement, negotiated terms, shareholder (citizen) interests, potential for one party to initiate but requiring agreement/procedures.
      *   **Fails:** Overly economic; neglects identity/sovereignty. Assumes a governing corporate structure (constitution) with demerger rules, which the UK lacks. Territory is ignored.
      *   **Requires Argument:** Who are the "shareholders"? What procedures govern a demerger absent codified rules?
  3.  **Tenant Breaking a Shared Lease:**
      *   **Preserves:** Contractual obligations, potential penalties, impact on co-tenants, landlord (state?) involvement.
      *   **Fails:** Misrepresents Scotland's status (not a tenant). Doesn't capture shared ownership/sovereignty. Too simplistic for national scale.
      *   **Rank:** Weaker than Building/Spin-Off.

  ### Final Assessment

  *   **The Analogy's Value:** It's **primarily vivid rhetoric**, effectively framing Scottish independence as a claim of lost consent and agency. It resonates emotionally and highlights the *moral discomfort* of holding a polity in a union against its will.
  *   **Its Fatal Flaws:** It **cannot bear the argumentative weight** your friend places on it. It smuggles in answers to the core problems (boundary, procedure, arbiter) and ignores critical disanalogies (asymmetric exit, third-party impact, geographic immutability). It falsely equates the UK constitution with marital vows under a no-fault regime.
  *   **Genuine (Partial) Insight:** The analogy **usefully emphasizes the moral claim that sustained, clear democratic dissent within a distinct polity creates a compelling, non-technical justification for separation** that transcends strict legalism. This moral dimension *is* often underplayed by unionist legal arguments. However, it doesn't translate into a unilateral *right* or a predefined *procedure*.

  **Recommendation:** Your friend should keep the analogy *for vividness* but explicitly acknowledge its limits upfront: "While imperfect, the marriage-divorce analogy captures the core grievance..." He should then pivot to arguments that don't rely on the analogy's faulty mechanics, focusing instead on democratic principle, historical context, and the *political* (not legal) necessity of respecting a clear referendum result, while conceding the need for negotiation on terms impacting all parties. The co-owned building analogy offers a slightly more robust structure if he needs a replacement metaphor.
