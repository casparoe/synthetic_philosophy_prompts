  First, I need to unpack why Boltzmann brains are problematic. The key is the self-undermining aspect. If a model predicts mostly Boltzmann brains, then our evidence for that model comes from unreliable observers. That means we can't trust any scientific reasoning, including the model itself. It's not just about improbability; it's about the evidence defeating itself.

  The user mentioned a comparison between a transient universe and an eternal one. I should create a simple toy model. Let's say Universe A has a short lifespan with 100 billion evolved observers. Universe B is eternal, producing vastly more Boltzmann brains—say 10^50. Even though evolved brains are locally common, globally they're outnumbered. But the issue isn't just numbers; it's the reliability of the observers.

  Next, explain typicality. The assumption is that we're typical observers if we don't have evidence to the contrary. In Universe B, typical observers are Boltzmann brains with random experiences. So if we're typical, our memories and scientific data are likely illusions. But then we can't trust the physics that led us to the model, creating a loop.

  The user's friends think we should accept being Boltzmann brains if the model says so. But the problem is that Boltzmann brains can't form reliable beliefs. Any evidence supporting the model could be a random fluctuation, so the model undermines its own justification. This cognitive instability is why scientists reject such models.

  I should clarify first-person vs. third-person. First-person: given a model, what's the probability I'm a certain observer? Third-person: what exists in the model. In Universe B, third-person counts show mostly Boltzmann brains, so first-person, I'm likely one. But if I am, my scientific reasoning is unreliable, including my belief in the model.

  Addressing the local patch argument: even if evolved brains outnumber Boltzmann brains locally, globally the latter dominate. Since we don't know our location, we must consider the whole universe. Typicality forces us to the global perspective, making Boltzmann brains more probable, leading back to the self-undermining problem.

