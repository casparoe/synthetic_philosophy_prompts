answer: |-
  Ah, the classic trio of AI reasoning headaches! As a physicist diving into philosophy, think of these as the "unwritten assumptions" problems. They're all about why it's so hard for logic-based systems (or even our brains) to handle the messy reality of change. Here's the gut-level intuition:

  1.  **The Qualification Problem: "What *must* be true BEFORE an action?"**
      *   **Gut feeling:** It's the **"Yeah, but what if...?"** problem.
      *   **Core Issue:** Listing *all* the preconditions needed for an action to succeed is impossible. Reality has infinite "unless..." clauses.
      *   **Simple Example (Coffee):** You want to model "If you turn the mug upside down, the coffee spills."
          *   *Qualification Problem:* But what if... the mug has a lid? ...the coffee is frozen? ...you're in zero gravity? ...the mug is glued to the table? ...it's not *coffee* but sand? Listing *every single possible exception* beforehand is futile.
      *   **Why it's a problem for AI:** Formal logic needs explicit rules. Missing just one crucial "unless" condition makes the system draw wrong conclusions ("It spilled! But why? I didn't account for the lid!").

  2.  **The Frame Problem: "What *doesn't* change AFTER an action?"**
      *   **Gut feeling:** It's the **"Wait, did *that* change too?"** problem.
      *   **Core Issue:** When an action happens, *most* things in the world stay the same. Explicitly stating *everything* that *doesn't* change for every single action is computationally absurd. How do we efficiently represent persistence?
      *   **Simple Example (Coffee):** You successfully turn the mug upside down (with no lid, in gravity, etc.), and the coffee spills.
          *   *Frame Problem:* Did flipping the mug change the color of the walls? Did it alter the Prime Minister of Canada? Did it make your shoes unlaced? Did it change the law of gravity? *Obviously not.* But a naive logical system, unless told otherwise, might consider *all* these possibilities equally likely outcomes unless you explicitly state "Flipping the mug *doesn't* change the wall color," "doesn't change the PM," "doesn't unlace shoes," etc., for *every single fact* and *every single action*. That's infinite and useless.
      *   **Why it's a problem for AI:** It's computationally explosive to represent *non-change*. We (humans/agents) need a way to *assume* most things stay the same unless there's a reason to think otherwise, but formal logic struggles with this "default persistence."

  3.  **The Ramification Problem: "What *else* changes AFTER an action?"**
      *   **Gut feeling:** It's the **"Oh crap, I didn't see *that* coming!"** problem.
      *   **Core Issue:** Actions often have indirect consequences, side effects, or trigger chains of events that aren't directly part of the action description. Predicting the *full* ripple effect is incredibly hard.
      *   **Simple Example (Coffee):** You turn the mug upside down, coffee spills.
          *   *Ramification Problem:* The spilled coffee stains the expensive report on the desk. The stain makes your boss angry. Your angered boss cancels your project. The cancelled project means the robot you were building never gets built... etc. Or, more immediately: the spill wets the table, which shorts out your laptop, which causes a small fire... You specified "spill the coffee," but you didn't specify *all* the cascading effects.
      *   **Why it's a problem for AI:** It requires reasoning about potentially long chains of cause-and-effect, interactions between objects/properties, and often involves unforeseen combinations. Representing *all* possible indirect effects for every action is impossible.

  **Putting them together in your Kitchen Metaphor:**

  *   **Qualification Problem:** Before you flip the mug, can you be *absolutely sure* it will work (spill the coffee) under *all* possible current conditions? (What about that lid you forgot? Or the zero-gravity party?).
  *   **Frame Problem:** After you flip the mug and the coffee spills, what *else* in the kitchen definitely *didn't* change? (The fridge is still cold, the clock is still ticking, the cat is still asleep... listing all these non-changes explicitly is madness).
  *   **Ramification Problem:** After you flip the mug and the coffee spills, what *other* changes happen *because* of the spill? (The report is ruined, the laptop fries, the cat wakes up and knocks over a vase... predicting all these knock-on effects is incredibly difficult).

  **Why Philosophers Care (Beyond AI):**

  These problems highlight fundamental challenges in **how we represent the world and reason about change**. They expose the gap between:

  1.  **Formal Logic:** Which demands explicit, complete, and consistent rules.
  2.  **The Real World:** Which is open-ended, context-dependent, full of exceptions, and where change involves both persistence (frame) and unforeseen consequences (ramification), all operating under unknown preconditions (qualification).

  Your intuition about the frame problem being "which facts stay the same" is spot on. The qualification problem is about the hidden conditions *before* the action that determine if it even works as expected. The ramification problem is about the hidden consequences *after* the action that go beyond the immediate, direct effect.

  They're deeply intertwined siblings in the family of "modeling reality is really, really hard" problems! Good luck with the philosophy dive – these are fascinating issues where your physics/robotics grounding gives you a great perspective!
