answer: |-
  Here’s a structured in-class activity designed to mirror Parfit’s hitchhiker dilemma, optimized for your 75-minute seminar with 16 students. It uses **participation points** (convertible to extra credit or small prizes) as stakes to ensure incentives "bite."

  ---

  ### **Activity: The Desert Island Rescue Game**
  **Core Setup:**  
  Students are paired into "Travelers" (stranded) and "Rescuers." Travelers must convince Rescuers to "rescue" them (award points) based on a promise of repayment. After rescue, Travelers choose whether to repay (costing them points) or defect (keeping points). Rescuers only profit if Travelers repay voluntarily.

  **Stakes & Incentives:**  
  - Each student starts with 10 participation points (1 point = 0.1% extra credit or 1 candy/token).  
  - **Rescue cost:** 5 points from Rescuer → Traveler.  
  - **Repayment:** 5 points from Traveler → Rescuer (if chosen).  
  - *Traveler’s dilemma:* Repaying costs 5 points; defecting costs 0.  
  - *Rescuer’s dilemma:* Rescuing costs 5 points; repayment earns 5 profit.  

  **Roles (8 pairs):**  
  - **Traveler:** Stranded on a "desert island." Goal: Get rescued and maximize points.  
  - **Rescuer:** Controls a "helicopter." Goal: Maximize points by rescuing *only if repayment is likely*.  

  **Timeline (Total: 50-55 mins):**  
  1. **Setup (5 mins):**  
     - Assign roles (randomly: 8 Travelers, 8 Rescuers).  
     - Distribute decision slips (see below).  
     - Emphasize: *"Points are real. Your choices affect your payoff."*  

  2. **Commitment Phase (10 mins):**  
     - Travelers send a **written promise** to their paired Rescuer. Rules:  
       - Can be *any message* (e.g., "I swear I’ll repay!"; "I’m trustworthy!"; even creative pledges like "I’ll buy you coffee").  
       - **No binding contracts:** They cannot offer collateral or external enforcement.  
     - Rescuers review promises and decide: **RESCUE** or **ABANDON**.  

  3. **Action Phase (5 mins):**  
     - Travelers who were rescued **secretly decide** (via slip): **REPAY** or **DEFECT**.  
     - Unrescued Travelers do nothing.  

  4. **Payoff Calculation (5 mins):**  
     - Collect slips. Announce payoffs:  
       - Rescuer + Traveler both keep 10 points if **ABANDONED**.  
       - If **RESCUED**:  
         - Traveler gains 5 points (net: 15), then loses 5 if repaying (net: 10) or keeps 15 if defecting.  
         - Rescuer loses 5 points (net: 5), then gains 10 if repaid (net: 15) or keeps 5 if defected.  

  5. **Debrief (25-30 mins):**  
     - **Reveal outcomes:** How many rescues? How many repayments?  
     - **Key questions:**  
       - *Travelers:* "Did you repay? Why/why not? Did your promise feel sincere?"  
       - *Rescuers:* "Who trusted the promise? Why? What made a promise credible?"  
       - *All:* "Was it rational for Travelers to defect? Was it rational for Rescuers to distrust?"  
     - **Map to Parfit:**  
       | **Game Event**          | **Parfit’s Hitchhiker Concept**                     |  
       |--------------------------|-----------------------------------------------------|  
       | Traveler’s defection     | *Act-level rationality:* Maximizing self-interest post-rescue. |  
       | Rescuer’s distrust       | *Problem of credible commitment:* Rational agents can’t trust "cheap talk." |  
       | Traveler’s "sincere" promise | *Rational irrationality:* Can you "decide" to be irrational (honest) to gain rewards? |  
       | Failed rescues           | *Prisoner’s Dilemma outcome:* Mutual loss due to predictable defection. |  
     - **Philosophical pivot:**  
       - *"Could Travelers have made themselves *truly* irrational (e.g., honor-bound) on the spot? Or is this disposition something cultivated *before* the dilemma?"*  
       - Introduce Parfit’s solution: **Being the sort of person** who keeps promises *as a disposition* is rational, even if individual acts seem irrational.  

  ---

  ### **Predictable Problems & Fixes:**  
  1. **Problem:** Students treat it as "just a game" → Defection rates near 100%.  
     - **Fix:** Stress stakes *repeatedly* ("This impacts your grade/candy"). Use anonymous slips to reduce peer pressure.  

  2. **Problem:** Rescuers rescue indiscriminately (altruism/indifference).  
     - **Fix:** Remind Rescuers: *"Your goal is to maximize points. Rescue only if you expect repayment."*  

  3. **Problem:** Travelers over-promise ("I’ll repay!") but defect anyway.  
     - **Fix:** Highlight this in debrief: *"Why did Rescuers still distrust, even with ‘convincing’ promises?"*  

  4. **Time crunch:** Commitment phase runs long.  
     - **Fix:** Use a 2-minute timer for promises. Pre-print slips with checkbox options.  

  ---

  ### **What the Activity CANNOT Replicate:**  
  **The impossibility of self-binding in Parfit’s original.**  
  - In Parfit’s case, the hitchhiker *cannot* credibly commit mid-dilemma because rationality is transparent. The activity allows creative promises (e.g., emotional appeals), which might *feel* like self-binding but aren’t truly irrevocable.  
  - **Address in debrief:** *"In reality, could you ‘choose’ to become irrational instantly? Parfit argues true self-binding requires pre-existing dispositions—you can’t ‘trick yourself’ on demand."*  

  ---

  ### **Materials:**  
  - **Slips for phases:**  
    1. *Commitment:* Traveler writes promise. Rescuer circles RESCUE/ABANDON.  
    2. *Action:* Rescued Travelers circle REPAY/DEFECT.  
  - **Scoreboard** to display payoffs (keeps tension high).  
  - **Timer** for phases.  

  This activity forces students to confront the paradox head-on: Defection is rational *in the moment*, but anticipating this makes cooperation impossible—unless they can "become" irrational. The debrief bridges their lived frustration to Parfit’s framework, setting up your lecture on dispositional rationality and commitment problems. Let me know if you need adjusted rules for larger/smaller groups!
