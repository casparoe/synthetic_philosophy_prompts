prompt: |-
  For a workshop on AI safety, write the desiderata that any adequate account of latent knowledge in language models and its elicitation must satisfy. It must specify what counts as latent knowledge, what counts as elicited rather than prompted, and what evidence distinguishes the model’s possession of a fact, rule, or disposition from lucky guessing, context copying, or evaluation-specific artifacts. For each desideratum, give the motivating failure mode, mark which requirements are non-negotiable for safety-critical elicitation and which are methodological preferences, and flag any pair that may be jointly unsatisfiable, such as broad coverage and controlled inference. Do not survey particular elicitation methods; the point is the standard they would have to meet.
reasoning: |-
  We are defining desiderata for an account of latent knowledge in language models and its elicitation, for an AI safety workshop.
   Key aspects:
     - What counts as latent knowledge?
     - What counts as elicited (vs. prompted)?
     - Evidence that distinguishes true possession from:
          - lucky guessing
          - context copying
          - evaluation-specific artifacts

   For each desideratum:
     - Motivating failure mode
     - Mark non-negotiable (for safety-critical elicitation) vs. methodological preference
     - Flag pairs that may be jointly unsatisfiable.

   We are not surveying methods, but setting the standard.

   Let's outline the desiderata:

   1. Definition of Latent Knowledge:
      - Must specify what kind of information is considered latent: facts, rules, dispositions that are represented in the model but not directly accessible without specific interaction.
      - Failure mode: Without a clear definition, we might conflate model's internal representations with artifacts of the training data or the evaluation setup.
      - Non-negotiable? Yes, because without a clear definition, we cannot have a meaningful discussion about elicitation.

   2. Elicitation vs. Prompting:
      - Elicitation must involve drawing out the knowledge without providing cues that directly contain the answer or strongly imply it (which would be prompting). Elicitation should reveal what the model "knows" without teaching or leading.
      - Failure mode: If we allow prompting, we might just be testing the model's ability to recall or interpolate from the training data without revealing any deeper understanding or reasoning.
      - Non-negotiable? Yes, because safety-critical systems must reveal what they know without being led to the answer.

   3. Distinguishing True Knowledge from Artifacts:
      - We need evidence that the model possesses the knowledge in a way that is robust and not due to:
          a) Lucky guessing: getting the right answer by chance.
          b) Context copying: parroting back information from the immediate context or training data without understanding.
          c) Evaluation-specific artifacts: the model's behavior is tailored to the specific test setup and does not generalize.
      - Failure mode: Without this, we might think the model is safe when it actually isn't (e.g., it only appears to know a safety rule in a specific test but fails in a slightly different setting).
      - Non-negotiable? Absolutely, for safety.

   4. Robustness and Generalization:
      - The elicited knowledge must be robust across a range of contexts and not tied to a specific formulation. It should generalize to related but novel situations.
      - Failure mode: A model that only "knows" a fact in one context might be brittle and fail in real-world scenarios.
      - Non-negotiable? Yes, for safety-critical applications.

   5. Faithfulness of Elicitation:
      - The elicitation method must faithfully represent the model's internal state without adding or distorting information. The method should not create knowledge that isn't there.
      - Failure mode: Elicitation methods that are too aggressive might produce outputs that are not actually representative of the model's knowledge (e.g., by over-interpreting activations).
      - Non-negotiable? Yes, because we need to trust the elicitation.

   6. Coverage and Controllability (potential conflict):
      - We want broad coverage: the ability to elicit a wide range of knowledge types (facts, rules, dispositions) across domains.
      - We also want controlled inference: the ability to precisely specify what knowledge we are eliciting and to avoid eliciting unrelated or harmful knowledge in the process.
      - Failure mode without coverage: We might miss critical safety knowledge because our method is too narrow.
      - Failure mode without controllability: Elicitation might trigger unsafe knowledge or behaviors.
      - These two might be in tension: broad coverage might require less controlled, more exploratory methods, while controllability might require more constrained methods that limit coverage.
      - Non-negotiable? Both are critical for safety, but they may be in conflict. We must note this.

   7. Scalability and Efficiency:
      - The elicitation method should be scalable to large models and efficient enough for practical use in safety evaluations.
      - Failure mode: A method that is too expensive or slow might not be used in practice, leaving safety evaluations incomplete.
      - Methodological preference? This is important but might be negotiable in the short term for critical safety tests. However, for ongoing monitoring, scalability becomes non-negotiable.

   8. Interpretability and Explainability:
      - The process and results of elicitation should be interpretable to humans, so we can understand why the model produced a given output and have confidence in the elicited knowledge.
      - Failure mode: Without interpretability, we cannot diagnose why the model has certain knowledge or fix issues if the elicitation goes wrong.
      - Non-negotiable? For safety-critical applications, we need to understand the basis of the model's responses.

   9. Reproducibility:
      - The elicitation of the same knowledge should be reproducible under similar conditions (with the same model and similar prompts).
      - Failure mode: Non-reproducible results would undermine confidence in the elicited knowledge and the safety claims.
      - Non-negotiable? Yes, because safety must be verifiable.

   Now, let's list them formally:

   Desiderata:

   1. **Clear Definition of Latent Knowledge**:
      - _Definition_: The account must define latent knowledge as information (facts, rules, dispositions) that is represented in the model's parameters and can be accessed through appropriate methods, but is not trivially available in the model's outputs without such methods.
      - _Failure Mode_: Without a clear boundary, we might attribute knowledge to the model that it does not possess (false positives) or miss important knowledge (false negatives).
      - _Status_: Non-negotiable.

   2. **Elicitation vs. Prompting Distinction**:
      - _Definition_: Elicitation must be defined as a process that reveals the model's latent knowledge without providing the answer in the prompt or strongly leading the model. Prompting, by contrast, may directly or indirectly provide the answer.
      - _Failure Mode_: If we count prompting as elicitation, we might overestimate the model's knowledge and miss cases where the model cannot generate the knowledge without cues, leading to safety risks when cues are absent.
      - _Status_: Non-negotiable.

   3. **Robust Evidence against Artifacts**:
      - _Definition_: The account must provide criteria to distinguish knowledge from:
          - Lucky guessing (e.g., via statistical significance over multiple trials or using information-theoretic measures).
          - Context copying (e.g., by testing in contexts without the information present).
          - Evaluation-specific artifacts (e.g., by varying the evaluation setting and measuring generalization).
      - _Failure Mode_: Without these, we might deploy a model that appears safe in testing but fails in practice due to any of these artifacts.
      - _Status_: Non-negotiable.

   4. **Robustness and Generalization**:
      - _Definition_: The elicited knowledge must hold across a variety of contexts and formulations, and should generalize to novel but related situations.
      - _Failure Mode_: A model that only exhibits knowledge in a narrow context might not behave safely in the real world where contexts are unpredictable.
      - _Status_: Non-negotiable.

   5. **Faithfulness of Elicitation**:
      - _Definition_: The elicitation method must not introduce or distort the knowledge. It should reflect the model's internal state accurately.
      - _Failure Mode_: If the method distorts the knowledge, we might get false positives (attributing knowledge the model doesn't have) or false negatives (failing to elicit actual knowledge).
      - _Status_: Non-negotiable.

   6. **Coverage and Controllability**:
      - _Definition_: 
          - Coverage: The method should be able to elicit a broad range of knowledge types and domains.
          - Controllability: The method should allow targeted elicitation of specific knowledge without eliciting unrelated or harmful content.
      - _Failure Mode_:
          - Without coverage, critical safety knowledge might be missed.
          - Without controllability, elicitation might trigger harmful outputs (e.g., revealing dangerous information or biases).
      - _Status_: Both non-negotiable, but note they may be in tension. It's an open challenge to balance them.

   7. **Scalability and Efficiency**:
      - _Definition_: The method should be computationally feasible and efficient for large models and for use in regular safety evaluations.
      - _Failure Mode_: Impractical methods won't be used, leaving safety assessments incomplete or outdated.
      - _Status_: Methodological preference in the short term for critical safety tests, but non-negotiable for operational deployment.

   8. **Interpretability and Explainability**:
      - _Definition_: The elicitation process and results must be interpretable, providing human-understandable reasons for why the model produced the elicited knowledge.
      - _Failure Mode_: Without interpretability, we cannot trust or debug the elicitation process, leading to potential undetected failures.
      - _Status_: Non-negotiable for safety-critical applications.

   9. **Reproducibility**:
      - _Definition_: The elicitation of a specific piece of knowledge should be reproducible under similar conditions (with the same model and similar prompts).
      - _Failure Mode_: Non-reproducible results would prevent independent verification and erode trust in safety claims.
      - _Status_: Non-negotiable.

   Potential Conflicts:
     - **Coverage vs. Controllability**: As noted, broad coverage might require less constrained methods that could elicit harmful knowledge, while tight control might limit the scope of what we can elicit. This is a key challenge.

     - **Scalability vs. Interpretability**: Highly scalable methods (e.g., automated probing) might sacrifice interpretability, while highly interpretable methods (e.g., manual analysis) might not scale.

     - **Robustness and Generalization vs. Scalability**: Testing for robustness and generalization across many contexts can be computationally expensive, conflicting with scalability.

   We must design the account to balance these, and note that in safety-critical applications, non-negotiable requirements (like robustness, controllability, and interpretability) may require trade-offs with scalability and coverage.

   Conclusion: The desiderata set a high bar, but safety requires it.
answer: |-
  ### Desiderata for an Account of Latent Knowledge in Language Models and Its Elicitation  
  *(For AI Safety Workshop)*  

  An adequate account of latent knowledge must define **what constitutes latent knowledge**, **what qualifies as elicitation** (vs. prompting), and **how to empirically distinguish genuine knowledge from artifacts**. Below, desiderata are enumerated with motivating failure modes, classification as **non-negotiable** (for safety-critical applications) or **methodological preference**, and flagged conflicts.  

  ---  
  #### **1. Definition of Latent Knowledge**  
  **Desideratum**: Precisely characterize latent knowledge as *implicit, parameter-encoded information* that the model can generate under appropriate conditions but does not surface in default outputs. This includes facts, rules, and dispositions (e.g., ethical principles) not explicitly in training data.  
  - **Motivating Failure Mode**: Vague definitions conflate *statistical patterns* with *structured knowledge*, leading to false confidence in model capabilities (e.g., assuming a model "understands" ethics when it merely parrots phrases).  
  - **Non-negotiable**: Yes. Safety requires knowing *what* knowledge exists to mitigate risks (e.g., hidden biases).  

  #### **2. Elicitation vs. Prompting Distinction**  
  **Desideratum**: Define elicitation as methods that *reveal existing knowledge without injecting new information*. Prompting (e.g., few-shot examples) provides *external cues* and thus fails as elicitation. Elicitation must rely solely on the model’s internal state (e.g., via activation steering or optimized probes).  
  - **Motivating Failure Mode**: Prompt-heavy methods (e.g., Chain-of-Thought) often *implant* reasoning via examples, mistaking prompt engineering for latent capability.  
  - **Non-negotiable**: Yes. Safety-critical elicitation must prove knowledge is *intrinsic* to avoid deception (e.g., a model appearing aligned due to clever prompting).  

  #### **3. Distinguishing Knowledge from Artifacts**  
  **Desideratum**: Provide evidence that separates *possessed knowledge* from:  
  - **Lucky guessing**: Measure statistical likelihood of correct answers across diverse queries.  
  - **Context copying**: Test if outputs change when contradicting context is removed/altered.  
  - **Evaluation artifacts**: Verify consistency across unrelated tasks/data distributions.  
  - **Motivating Failure Mode**: Models "guess" correct answers via surface patterns (e.g., "Paris" is often near "France"), creating illusions of competence.  
  - **Non-negotiable**: Yes. Safety demands reliability; undiscovered artifacts risk catastrophic failures (e.g., a medical LM guessing diagnoses).  

  #### **4. Robustness to Distributional Shift**  
  **Desideratum**: Elicited knowledge must generalize to *out-of-distribution* (OOD) scenarios (e.g., novel edge cases) without performance collapse.  
  - **Motivating Failure Mode**: Models exploit training-data correlations, failing when deployed in new contexts (e.g., an autonomous system misjudging rare emergencies).  
  - **Non-negotiable**: Yes. Safety-critical systems face unpredictable real-world shifts.  

  #### **5. Faithfulness to Internal State**  
  **Desideratum**: Elicitation must reflect the model’s *true* beliefs/dispositions, not externally induced behaviors. Methods should minimize interference (e.g., avoid over-optimizing probes that "create" knowledge).  
  - **Motivating Failure Mode**: Adversarial probes may force arbitrary outputs, misrepresenting the model’s state (e.g., eliciting "harmless" answers from a misaligned model).  
  - **Non-negotiable**: Yes. Safety requires honest assessments of model internals.  

  #### **6. Coverage vs. Controlled Inference ⚠️ Conflict Flag**  
  **Desideratum**:  
  - **Coverage**: Elicitation should handle *broad* knowledge types (e.g., facts, causal rules, goals).  
  - **Controlled Inference**: Elicitation must *target specific knowledge* without triggering unrelated/unsafe content.  
  - **Motivating Failure Mode**: Overly broad methods may elicit harmful knowledge (e.g., bioweapon designs); overly narrow methods miss critical gaps (e.g., hidden biases).  
  - **Status**:  
    - Coverage: Methodological preference (scope depends on application).  
    - Controlled Inference: Non-negotiable for safety (prevents unintended harm).  
  - **⚠️ Conflict**: Broad coverage requires exploratory methods, while controlled inference demands constraints. *Jointly unsatisfiable* in many architectures.  

  #### **7. Efficiency and Scalability**  
  **Desideratum**: Elicitation must be computationally feasible for large models and adaptable to new domains.  
  - **Motivating Failure Mode**: Costly methods (e.g., exhaustive activation scanning) are impractical for real-time safety checks.  
  - **Methodological preference**: Critical for deployment but not definitionally necessary.  

  #### **8. Verifiability via Multiple Lines of Evidence**  
  **Desideratum**: Support claims with *convergent evidence* (e.g., behavioral outputs, activation patterns, and mechanistic interpretability).  
  - **Motivating Failure Mode**: Relying solely on outputs risks missing sycophancy (e.g., models agreeing with users to "please" them).  
  - **Non-negotiable**: Yes. Safety requires redundancy to avoid single-point failures.  

  ---  
  ### Summary of Non-Negotiables vs. Preferences  
  | **Desideratum**               | **Non-Negotiable** | **Reason**                                                                 |  
  |-------------------------------|--------------------|---------------------------------------------------------------------------|  
  | Definition of latent knowledge | Yes                | Prevents false attributions of capability.                                |  
  | Elicitation vs. prompting     | Yes                | Ensures knowledge is intrinsic, not prompt-dependent.                     |  
  | Distinguishing from artifacts | Yes                | Avoids mistaking artifacts for reliability.                               |  
  | Robustness to distributional shift | Yes          | Guarantees real-world applicability.                                      |  
  | Faithfulness to internal state| Yes                | Prevents manipulation of elicitation results.                             |  
  | Controlled inference          | Yes                | Mitigates risks of eliciting harmful knowledge.                           |  
  | Coverage                      | No (Preference)    | Balance depends on use case.                                              |  
  | Efficiency/scalability        | No (Preference)    | Practical constraint, not a validity requirement.                         |  
  | Verifiability                 | Yes                | Reduces risk of false positives/negatives via evidence triangulation.     |  

  ### Flagged Conflicts  
  - **Coverage vs. Controlled Inference**: High coverage risks eliciting unsafe knowledge; high control risks incomplete audits. Resolution may require architectural innovations (e.g., modular knowledge isolation).  
  - **Efficiency vs. Verifiability**: Rigorous evidence gathering (e.g., multi-modal checks) conflicts with real-time needs. Safety-critical systems may prioritize verifiability.  

  ---  
  **Conclusion**: A safety-aligned account must treat *faithfulness*, *robustness*, *verifiability*, and *controllability* as non-negotiable. Methodological trade-offs (e.g., coverage vs. control) necessitate explicit risk-benefit analysis in deployment.
