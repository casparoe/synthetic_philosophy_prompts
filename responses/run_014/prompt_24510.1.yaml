prompt: |-
  A friend of mine who does social choice walked me into a corner and I can't find the exit. He's trying to show that utilitarian social welfare is basically the only defensible option, and here's the argument he gave me:

  (1) We want a social welfare function W that maps a profile of individual preferences to a social ranking, and we want it to be non-dictatorial, i.e. no single person's preferences just are the social ranking.

  (2) We want W to respect the Pareto principle: if everyone prefers x to y, then society should prefer x to y.

  (3) We want W to satisfy independence of irrelevant alternatives: the social ranking of any pair {x,y} should depend only on how each person ranks that pair, not on how they rank other options.

  (4) By Arrow's impossibility theorem, there is no W satisfying (1), (2), and (3) when preferences are just plain ordinal orderings. So as stated we're stuck.

  (5) Harsanyi's aggregation theorem is the escape hatch. It says that if each individual has a von Neumann-Morgenstern expected-utility function (preferences are cardinal, defined over lotteries, and interpersonally comparible), then there is a W satisfying IIA and Pareto, namely the weighted sum W(x) = sum_i w_i u_i(x) for some non-negative weights w_i, not all zero.

  (6) So the way out of Arrow's dilemma is to be a utilitarian: once you assume cardinal, interpersonally comparable utilities, the weighted sum is the unique non-dictatorial, Pareto-respecting, IIA-satisfying social welfare function.

  (7) Therefore the only defensible social welfare function is a utilitarian weighted sum of individual utilities.

  (8) But a utilitarian weighted sum is indefensible: it can require letting one person lose everything to hand another person a trivial gain, it leaves no room for rights or the Rawlsian difference principle, and we have strong reasons to think those matter.

  (9) So (1)-(5) can't all be right, which means the assumptions behind the escape hatch are doing something fishy.

  He's confident and I cant find the crack. I feel like something slipped around (5)-(6), where the escape hatch is supposed to actually fix Arrow's problem, but I can't name it. Which step do you reject, and what does rejecting it cost? I'd most like to keep the Pareto principle and the idea that a non-utilitarian, Rawlsian social welfare function is genuinely defensible; I'm least attached to the strict independence condition, but I want to know exactly what I'm giving up and whether the escape hatch in (5) is even doing what he claims.

  Respond in the style of an expert in social choice theory. Think very carefully before answering, and don't just tell me which step is wrong -- explain why that step looked fine and what the main alternatives each cost.
reasoning: |-
  Okay, let me approach this systematically. The user presents a tightly constructed argument purporting to show that utilitarianism is the only defensible social welfare function, and they're feeling trapped by it. Their core discomfort seems to be at step (8) - they want to preserve Rawlsian/rights-based considerations but can't yet articulate why the "escape hatch" might be leaky.

  First, I need to verify Harsanyi's theorem's conditions. The interpersonal comparability assumption here is doing heavy lifting that isn't immediately obvious in the friend's formulation. When we say utilities are "interpersonally comparable" in Harsanyi's framework, we're assuming a very specific type of comparability - ratio scales with common zero points. This is far stronger than ordinal comparability and carries normative baggage about how we equate different people's suffering or joy.

  The user mentions wanting to keep Pareto and Rawlsian options. That suggests we should examine where Pareto operates in this setup. Harsanyi's Pareto (over lotteries) implies linear aggregation, but real-world policy choices rarely involve literal lotteries. There might be a gap between the theorem's domain and actual social decisions.

  IIA is the natural pressure point here, but I recall that weakening IIA doesn't automatically get us Rawls. We'd need to consider what alternative independence conditions might preserve reasonable consistency without forcing aggregation. Perhaps local IIA variants or separability restrictions could work.

  The weights w_i in the sum are particularly troublesome. The friend presents them as non-dictatorial because multiple people have influence, but if weights can be arbitrarily small, it's functionally near-dictatorial for high-weight individuals. And setting weights "fairly" requires... yet another normative principle.

  What's elegant about the friend's argument is how it smuggles in utilitarianism through the back door of technical assumptions. The crack isn't in the math itself but in the interpretation of what the math implies for real societies. When we say "utility" in Harsanyi's theorem, we're accepting VNM rationality as the full account of human welfare - but philosophers like Sen have long argued that VNM utilities don't capture commitment, rights, or complex values.

  The user's anxiety about step (8) is justified. We can accept Harsanyi's theorem as mathematically correct while rejecting its descriptive adequacy for social choice. The cost is abandoning the clean "single framework" solution, but we gain the ability to incorporate plural values.
answer: |-
  Your friend's argument is clever but misapplies Harsanyi's theorem, creating a false dilemma. The critical flaw lies in step **(6)** and the interpretation of **(5)**. Harsanyi's theorem does *not* show that weighted utilitarianism is the *unique* non-dictatorial solution satisfying IIA and Pareto under cardinal utilities. It shows it is *one possible solution*, but **not the only one** under the stated conditions. This error cascades into the false conclusion of step (7). Let's dissect the logic:

  ### The Crack: Misinterpreting Harsanyi's Uniqueness
  *   **What Harsanyi Actually Shows:** Given **cardinal, interpersonally comparable VNM utilities**, if the social welfare functional must satisfy **Pareto over lotteries** and **IIA over lotteries**, *and* if the social preference must *also* be a **VNM rational ordering**, *then* social welfare *must* be a **weighted sum of individual utilities** (W = Σ_i w_i u_i, w_i ≥ 0, not all zero).
  *   **The Hidden Premise:** The requirement that the *social* preference must itself satisfy the **VNM rationality axioms** (completeness, transitivity, continuity, independence over lotteries) is crucial. This is *not* implied by Arrow's original IIA/Pareto/Non-Dictatorship setup. Arrow assumes social preferences are orderings but *not* necessarily VNM rational over lotteries.
  *   **Why Step (6) is Wrong:** Harsanyi proves that weighted utilitarianism is the *only* way to satisfy Pareto (over lotteries), IIA (over lotteries), *and* VNM rationality of the social preference. However, it does *not* prove that it's the *only* way to satisfy just Pareto (over alternatives) and IIA (over alternatives) *without* requiring social VNM rationality. **Rejecting social VNM rationality opens the door to non-utilitarian functions.** Rawlsian maximin, for example, satisfies Pareto (over alternatives) and a sensible IIA variant but violates VNM rationality (specifically the continuity and independence axioms over lotteries).

  ### What Rejecting Social VNM Rationality Costs
  *   **Cost:** You lose the ability to apply expected utility theory directly to *social* choices under risk/uncertainty. Society cannot be modeled as a single VNM-rational "super individual."
  *   **Benefit:** This allows defensible alternatives:
      *   **Rawlsian Maximin:** Ranks social states based on the welfare of the worst-off individual. Satisfies Pareto (over alternatives) and IIA (if IIA is defined over *certain* alternatives, not lotteries). It violates VNM rationality (e.g., continuity: a tiny gain for the best-off wouldn't compensate for a catastrophic loss to the worst-off).
      *   **Leximin:** A refinement of maximin.
      *   **Nash Social Welfare Function:** (Product of utilities). Satisfies Pareto and a form of IIA but violates linearity/VNM rationality.
      *   **Egalitarian Principles:** Functions incorporating equity concerns beyond simple summation.

  ### Alternative Escape Hatches & Their Costs
  Rejecting the *necessity* of social VNM rationality is the most direct rebuttal, but other premises can be questioned:

  1.  **Reject Full Interpersonal Comparability (Step 5):**
      *   **What it Costs:** Harsanyi *requires* cardinal interpersonal comparability. Without it, you are back largely in Arrow's ordinal world. While some aggregation possibilities exist (e.g., positional methods like Borda count), they typically violate IIA.
      *   **Benefit:** Avoids utilitarianism, but makes robust aggregation much harder. Rawlsianism still needs *some* comparability (e.g., identifying the worst-off).

  2.  **Reject IIA (Step 3):**
      *   **What it Costs:** IIA is prized for its consistency and guarding against strategic manipulation. Rejecting it opens the door to many aggregation methods (Borda, Copeland, Kemeny-Young) but makes them vulnerable to agenda manipulation or dependence on irrelevant alternatives.
      *   **Benefit:** Allows non-utilitarian functions that incorporate more preference *intensity* information (inherently violating IIA). Rawlsianism doesn't strictly *need* IIA weakened. Cost is reduced robustness.

  3.  **Reject Unrestricted Domain (Implicit in Step 1/4):**
      *   **What it Costs:** Arrow requires W to work for *any* possible profile of individual preferences. Restricting domain (e.g., assuming "single-peaked" preferences) allows non-dictatorial, Pareto, IIA functions (e.g., median voter).
      *   **Benefit:** Allows defensible non-utilitarian rules *within* restricted domains. Doesn't directly help Rawlsianism, which aims for broader applicability. Cost is limited scope.

  4.  **Reject "Preferences" as the Sole Input (Step 1):**
      *   **What it Costs:** Arrow/Harsanyi take individual *preferences* (ordinal or cardinal) as the input. Sen argues that social choice should incorporate *rights*, *capabilities*, or *non-preference information*.
      *   **Benefit:** Directly allows for rights-based constraints or capabilities frameworks alongside or instead of preference aggregation. This is a major path for defending Rawlsian concerns about liberty and the "social bases of self-respect." Cost is moving beyond a pure preference-aggregation model.

  ### Why Pareto is Resilient (and Why You Should Keep It)
  Pareto efficiency is a minimal requirement for collective rationality. If *everyone* prefers X to Y, society choosing Y seems indefensible barring extraordinary external constraints. Rejecting Pareto carries a very high cost in terms of collective irrationality. Your desire to keep it is well-founded.

  ### Why the Utilitarian Sum Feels Indefensible (Step 8) - It's Not Just Rawls
  The critique in Step 8 highlights genuine weaknesses of *any* linear aggregation:
  *   **Distributional Insensitivity:** Σu_i treats a util gained by a pauper identically to a util gained by a billionaire.
  *   **Indifference to Disasters:** Sacrificing one individual to an arbitrarily terrible fate is permissible if it provides sufficient trivial gains to enough others.
  *   **Neglect of Rights:** Pure aggregation ignores constraints on how individuals may be treated.
  *   **VNM Utility ≠ Well-being:** VNM utilities reflect rational choice under risk, but not necessarily "welfare" or "advantage" in a broader ethical sense (e.g., they can reflect expensive tastes or adaptive preferences).

  ### Conclusion: The Defensible Path Forward
  *   **Reject the Necessity of Social VNM Rationality:** This is the most precise and least costly rejection point. **Harsanyi's theorem shows *one* way to escape Arrow (with strong assumptions), not the *only* way.** His conclusion of *uniqueness* relies on adding the requirement that the *social* ordering must obey VNM axioms over lotteries. This requirement is neither implied by Arrow's original conditions nor normatively essential.
  *   **Embrace a Broader Informational Basis:** Defending a Rawlsian (or rights-based, or capability-based) function requires rejecting *either* the sufficiency of preference-aggregation *or* the specific VNM rationality requirement for social choice. Pareto and a *sensible* IIA (over certain alternatives) can be retained.
  *   **Cost:** You sacrifice a simple, unified theory of social choice under risk. Social evaluation under uncertainty becomes more complex, requiring explicit ethical principles beyond expected utility maximization. However, this cost reflects the genuine complexity of incorporating equity, rights, and diverse conceptions of well-being into social welfare judgments – complexities that unmodified utilitarianism fails to capture.

  Your instinct that step (6) overreaches is correct. Harsanyi provides *an* escape hatch contingent on accepting strong premises about social rationality under risk. Rejecting that specific premise allows you to embrace Pareto, a reasonable IIA, and non-utilitarian social welfare functions like Rawlsianism without contradiction. The cost is abandoning the elegant but ethically impoverished world of linear aggregation.
