answer: |-
  ### Thought Experiment: The Rental Car's "Excessive Dirt" Fee  
  A rental car contract imposes a $100 cleaning fee if a vehicle is returned with "excessive dirt." The company defines "excessive dirt" operationally: a car is *excessive* if it is dirtier than a designated "clean threshold" vehicle (e.g., a car with minor dust) and *not excessive* if it is as clean as a "dirty threshold" vehicle (e.g., a car with heavy mud stains). Borderline cases—where the dirt level is indeterminate—exempt the fee entirely. However, the dispute clause states: if a customer is charged and contests it, they receive a refund *only if* the car was definitively *not* excessively dirty (i.e., the claim "excessive dirt" must be **false**, not merely indeterminate). Alex returns a car with dirt levels between the two thresholds. Unbeknownst to all, the car sits at the **edge of the borderline region**: it is almost indistinguishable from the "clean threshold" vehicle and only marginally dirtier than a prototypical borderline car (e.g., one with faint smudges experts agree is borderline). Yet, it is also noticeably cleaner than the "dirty threshold." The company charges Alex, who disputes. The arbitrator must decide: if the car is borderline, Alex gets a refund; if not, they check if it was excessive. But here, experts split evenly—half argue it’s clearly borderline (like the prototypical case), half insist it’s *just barely outside the borderline* and leans toward excessive.  

  ### Analysis  
  1. **Epistemicist View**:  
     There is a sharp, unknowable fact of the matter. Alex’s car *is* either borderline or not (and if not, either excessive or not). The expert disagreement stems from ignorance, not indeterminacy. If the car is truly borderline, Alex wins; if it is even slightly non-borderline and excessive, Alex loses $100. The dispute clause’s requirement for *demonstrable falsity* (not indeterminacy) means borderline status alone—if proven—saves Alex, but if the car is determinately excessive (even if "barely"), Alex pays.  

  2. **Supervaluationist View**:  
     - **First-order vagueness**: "Excessive dirt" has multiple precisifications. In some, Alex’s car is excessive; in others, not; hence, it’s first-order borderline (neither supertrue nor superfalse).  
     - **Second-order vagueness**: The predicate "borderline" *itself* is vague. Some precisifications classify Alex’s car as borderline (like the prototype), others exclude it (placing it in the excessive zone). Thus, "Alex’s car is borderline" is **neither supertrue nor superfalse**—it’s second-order borderline.  
     - **Awkward consequence**: The contract requires a binary ruling. Since "borderline" isn’t supertrue, the arbitrator cannot justify refunding under the borderline exemption. They proceed to check excessiveness—but since "excessive" also lacks supertruth, they face a dilemma. Supervaluationism *demands* withholding refunds in truth-value gaps, yet the dispute clause only refunds on *falsity*. If the arbitrator rules "not excessive," they violate supervaluationism (it’s not superfalse); if "excessive," they ignore cases where precisifications disagree. This forces an arbitrary choice, exposing supervaluationism’s struggle with higher-order vagueness.  

  3. **Contextualist Addition**:  
     Contextualism resolves indeterminacy through situational factors. During arbitration, if the company’s lawyer emphasizes comparison to the "dirty threshold," the context might sharpen "excessive dirt" to exclude borderline classifications, dooming Alex. If Alex’s lawyer highlights similarity to the prototypical borderline car, "borderline" may expand to include Alex’s car, triggering a refund. The outcome hinges on rhetorical framing, not fixed facts.  

  ### Key Feature and Epistemicist Attack  
  - **Crucial feature**: The contract’s **asymmetric refund clause** (requiring *falsity*, not indeterminacy) combined with **operational thresholds** creates a "cliff effect" at the edge of the borderline region. If Alex’s car is second-order borderline, the arbitrator cannot apply the borderline exemption (as "borderline" isn’t determinately true), forcing a risky excessiveness check.  
  - **If removed**: Without the refund clause demanding *falsity*, a truth-value gap (indeterminacy) would automatically refund Alex, negating second-order tensions.  
  - **Epistemicist attack**: The setup artificially amplifies vagueness by relying on "indistinguishable" comparisons. In reality, dirt is quantifiable (e.g., via particle counts or reflectivity scores). The thresholds *are* precise; human limitations in measurement create the *illusion* of higher-order vagueness. The dispute could be resolved with better tools—second-order vagueness is epistemic, not ontological.
