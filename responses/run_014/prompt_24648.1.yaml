  We are drafting a joint statement between a Peircean pragmatist (PP) and a Jamesian pragmatist (JP) after an adversarial collaboration on the nature of truth.

  Agreed Claims (both signatories endorse the following):
  1. The Pragmatic Maxim: The meaning of any concept (including truth) is to be understood in terms of the practical consequences of its object, especially in terms of the experiential and behavioral differences that would result from the acceptance or rejection of the concept. Both agree that the pragmatic maxim is the proper tool for clarifying concepts and that without such clarification, philosophical disputes are often fruitless.
  2. Limitations of Correspondence Theory: The traditional correspondence theory of truth, which holds that truth consists in a relation of correspondence between a proposition and a mind-independent reality, is inadequate. It fails to provide a clear, applicable criterion for truth and often leads to metaphysical obscurity. Both agree that truth must be connected to human experience and inquiry.
  3. Fallibility of Empirical Beliefs: All empirical beliefs are fallible. Any belief we hold, no matter how well justified, could turn out to be false in light of future experience. Therefore, our claims to truth must always be held open to revision and testing.
  4. Truth as a Property of Beliefs: Truth is a property that beliefs acquire as a result of successful inquiry. Both agree that truth is not a static relation but is dynamically related to the process of inquiry.
  5. The Role of Inquiry: Truth is intimately tied to the process of inquiry. Both agree that inquiry is the method by which we fix beliefs and that truth is the ideal outcome of such inquiry.

  Residual Disagreements:
  We have two main points of divergence:

  A) The Nature of the "Real": 
     - PP: There is a mind-independent reality (the "real") that is independent of what any particular individual or community believes. The process of inquiry, if pursued sufficiently long and well, will converge on beliefs that accurately represent this reality. Thus, truth is the opinion that is fated to be ultimately agreed to by all who investigate.
     - JP: The notion of a mind-independent reality that is entirely detached from human interests and purposes is not useful. Reality is in part shaped by our interests and conceptual schemes. Truth is made in the process of experience and inquiry; it is a property of ideas that prove themselves to be useful in the way of belief, where usefulness includes not only predictive success but also satisfaction of our emotional and volitional needs. Thus, truth is what is good for us to believe, and there is no guarantee of convergence to a single opinion because the interests and needs of inquirers may vary.

  B) The Character of the "Long Run" of Inquiry:
     - PP: The "long run" is a regulative ideal. It refers to the limit of an indefinite continuation of inquiry by a community of inquirers. This ideal convergence is what makes truth objective and independent of current opinion. The long run is a necessary postulate for the possibility of error and for the progress of science.
     - JP: The "long run" must be understood in terms of the practical outcomes within a finite and humanly relevant time frame. Since inquiry is driven by human purposes and needs, the long run is not an abstract ideal but the ongoing process of inquiry that is always situated in particular contexts. The idea of an ultimate convergence at an ideal limit is not required; instead, truth is what works now and continues to work in the foreseeable future.

  Cruxes and Predictions:

  Crux 1: Is there a mind-independent reality that constrains inquiry and to which true beliefs correspond?
     - Case: Consider a scientific dispute about the nature of gravity (e.g., Newtonian vs. Einsteinian). Both agree that the dispute is resolved by empirical testing and that the process of inquiry leads to a better understanding. 
       - PP Prediction: The resolution of the dispute reveals that there is a mind-independent reality (the structure of spacetime) that we are discovering. The convergence of scientific opinion to general relativity is evidence that inquiry is converging on the real.
       - JP Prediction: The resolution of the dispute is a matter of the theory proving more useful (in terms of predictive power, simplicity, and coherence with other accepted theories) in the context of our current interests and technological capabilities. There is no need to posit a reality beyond what is revealed in the practical successes of our theories.

  Crux 2: What is the nature of the "long run" of inquiry?
     - Case: Consider the possibility of an indefinitely extended scientific inquiry. Suppose we imagine that human inquiry continues for millions of years and that we develop increasingly sophisticated instruments and theories.
       - PP Prediction: In such a long run, inquiry would converge on a single set of stable beliefs that accurately represent reality. This convergence is inevitable because the real is one and inquiry is self-correcting.
       - JP Prediction: Even over an extended period, inquiry may not converge because human interests and the practical contexts of inquiry change. What counts as truth may evolve to meet new needs and purposes. There is no necessity of convergence to a single set of beliefs.

  Verbal Disagreement:
  Part of the disagreement about the term "reality" might be verbal. PP uses "reality" to mean that which is independent of what anyone thinks, while JP uses "reality" to mean that which is encountered in experience and which resists our arbitrary fancies. However, the substantive disagreement remains: PP holds that the independent reality is the ultimate constraint and goal of inquiry, while JP holds that reality is always mediated by our interests and that truth is a matter of ongoing satisfaction in experience.

  Therefore, we present the following joint statement:

  ---

  **Joint Statement on Truth: A Peircean and Jamesian Pragmatist Perspective**

  We, the undersigned, a Peircean pragmatist (PP) and a Jamesian pragmatist (JP), having engaged in a good-faith adversarial collaboration, hereby set forth our agreements and disagreements on the nature of truth.

  **1. Agreed Claims:**

     a. **The Pragmatic Maxim**: We agree that the meaning of any concept, including truth, is to be elucidated by considering the practical consequences that would result from the acceptance or rejection of the concept. This maxim serves as a tool for clarifying ideas and resolving philosophical confusion.

     b. **Critique of Correspondence Theory**: We agree that the correspondence theory of truth, as traditionally formulated, is inadequate because it fails to provide a clear criterion for truth and because it posits an inscrutable relation between beliefs and a mind-independent reality. Instead, we hold that truth must be understood in terms of its function within inquiry and experience.

     c. **Fallibility**: We agree that all empirical beliefs are fallible and subject to revision in the light of future experience. Therefore, truth is not a property that can be definitively assigned to any particular belief at a given time but is rather an ideal that guides inquiry.

     d. **Truth and Inquiry**: We agree that truth is a property that emerges from the process of inquiry. True beliefs are those that are settled by the methods of inquiry (such as science, logical reasoning, and empirical testing) and that withstand the test of experience.

     e. **The Practical Nature of Truth**: We agree that truth has a practical dimension: true beliefs are those that are successful in guiding action and expectation.

  **2. Residual Disagreements:**

  We continue to disagree on two fundamental points:

  | Issue | Peircean Position (PP) | Jamesian Position (JP) |
  |-------|------------------------|------------------------|
  | **A. The Nature of Reality and Truth** | Truth consists in the correspondence of a belief with a mind-independent reality. This reality is the object of inquiry, and the process of inquiry, if pursued sufficiently, will converge on beliefs that accurately represent this reality. | Truth is not a static correspondence but a dynamic property of beliefs that prove themselves to be useful in the broadest sense (including intellectual, emotional, and practical satisfaction) in the course of experience. Reality is not entirely mind-independent but is co-constructed by our interactions and interests. |
  | **B. The Long Run of Inquiry** | The "long run" is a regulative ideal of an indefinite continuation of inquiry that will lead to a convergence of opinion on the real. This convergence is necessary to account for the objectivity of truth and the possibility of error. | The "long run" must be understood within the finite horizons of human inquiry. Truth is what works in the ongoing process of experience, and there is no necessity of convergence to a single opinion because the contexts and purposes of inquiry may change. |

  **3. Cruxes and Predictions:**

  We identify the following cruxes and set forth predictions for each:

  **Crux A: Is there a mind-independent reality that constrains inquiry and to which true beliefs correspond?**
     - *Case Study: The development of scientific theories (e.g., from Newton to Einstein).*
       - PP Prediction: The history of science shows a pattern of convergence toward more accurate representations of a mind-independent reality. The replacement of Newtonian mechanics by general relativity is a step toward the ultimate opinion that would be agreed upon in the long run.
       - JP Prediction: The shift from Newton to Einstein is a matter of the newer theory proving more useful (in terms of predictive accuracy, mathematical elegance, and explanatory power) in the context of evolving scientific interests and technological capabilities. There is no need to posit convergence to an ultimate reality beyond the practical successes.

  **Crux B: What is the nature of the "long run" of inquiry?**
     - *Case Study: The projection of scientific inquiry over an indefinite future.*
       - PP Prediction: If inquiry were to continue indefinitely, it would converge to a stable set of beliefs that accurately represent reality. This is because the real is one and inquiry is self-correcting.
       - JP Prediction: Even over an indefinite future, inquiry may not converge because the interests and purposes that drive inquiry are not fixed. What counts as truth may continue to evolve to meet new needs and contexts, without necessarily converging to a single set of beliefs.

  **4. Verbal Disagreement:**

  We note that part of our disagreement about the term "reality" may be verbal. PP uses "reality" to denote that which is independent of what any particular individual or community believes, while JP uses "reality" to refer to the resistant and stable elements in experience that we encounter. However, the substantive disagreement remains: PP maintains that the independent reality is the ultimate constraint and goal of inquiry, while JP contends that reality is always intertwined with our interests and that truth is constituted by the ongoing process of inquiry.

  In conclusion, we affirm our shared commitment to the pragmatic method and the fallibilist spirit of inquiry, while acknowledging our differences on the ontological and teleological aspects of truth.

