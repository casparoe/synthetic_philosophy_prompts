answer: |-
  ## Fellowship Proposal: Relocating the Leveling-Down Objection? Prioritarianism, Uncertainty, and Distributive Justice

  **1. The Central Question:**

  Does the priority view’s apparent immunity to the leveling-down objection collapse under uncertainty, forcing it to violate either unanimous ex ante preferences over prospects or statewise dominance in realized prioritarian value, thereby relocating rather than resolving the core objection levelled against telic egalitarianism?

  **2. Why the Question is Open:**

  The standard narrative holds that prioritarianism avoids the leveling-down objection (LDO) – the counterintuitive implication that a change making some worse off and no one better off can be better *in one respect* – because it always requires a change to benefit someone. This narrative assumes a comparison over certain outcomes. Extending prioritarianism to choices under uncertainty introduces fundamental ambiguity: should we apply the concave transformation to *realized* well-being in each state (ex post prioritarianism) or to *expected* well-being for each individual (ex ante prioritarianism)? Preliminary sketches suggest neither extension escapes unscathed, violating principles analogous to the core intuition behind the LDO. The question remains open because prominent deflationary responses are inconclusive:

  *   **Response 1: Uncertainty is Irrelevant (Well-being is Realized):** If intrinsic value pertains only to realized well-being states, then uncertainty is merely epistemic and the ex post view is mandatory. The ex ante unanimity violation might be dismissed as irrelevant to intrinsic value comparisons. **Project Impact:** If correct, this eliminates the challenge based on ex ante unanimity. However, the ex post view’s violation of statewise dominance in *aggregate value* (as seen in the second sketch) and its potential conflict with dynamic consistency remain live issues. The project shifts focus entirely to the ex post extension and its dominance problems.
  *   **Response 2: Dynamic Consistency Settles the Extension:** Arguments suggesting that dynamically inconsistent choice rules (like ex ante prioritarianism) are pragmatically self-defeating might decisively favour the ex post view. **Project Impact:** If decisive, this resolves the ambiguity in favour of ex post prioritarianism. The project then focuses critically on *whether ex post prioritarianism genuinely escapes the LDO’s spirit*. Its violation of ex ante unanimity – making a prospect worse for *everyone* according to their own expected good yet better overall – mirrors the LDO’s problematic structure: making some worse off (ex ante) with no one better off (ex ante) for the sake of a relational aggregate property (expected transformed sum).
  *   **Response 3: Trade-offs are Inevitable for All Aggregative Views:** Every distributive theory balancing individual claims faces conflicts between principles like Pareto, dominance, and separability. Prioritarianism’s specific trade-off under uncertainty is unremarkable. **Project Impact:** If correct, the project cannot claim a *unique* vulnerability for prioritarianism. However, it can still rigorously map *the specific, necessary trade-off* prioritarianism faces between ex ante unanimity and statewise dominance when extended to uncertainty, demonstrating that its advertised escape from the LDO’s *type* of problem dissolves. This clarifies the cost of adopting prioritarianism under uncertainty.

  **3. Method and Work Plan:**

  The project will rigorously develop and test the conjecture through formal analysis and philosophical argumentation, addressing a key unresolved difficulty: defining "better for a person" under risk within prioritarianism without begging the question against the LDO’s analogue.

  *   **Months 1-3: Formal Reconstruction and Verification:**
      *   Rebuild the ex post prioritarianism sketch (Month 1): Define model explicitly (finite states, equiprobable?; concave transform - square root assumed initially; risk-neutral individuals?; well-being cardinality). Verify the claim: Safe (50,50) vs. Risky ((92,12), (12,92)) yields lower expected transformed sum (√50 + √50 = ~14.14) vs. 0.5*(√92+√12) + 0.5*(√12+√92) ≈ 0.5*(9.59+3.46) + 0.5*(3.46+9.59) ≈ 13.05) despite higher expected well-being for each (52>50). **Risk:** Assumes risk-neutral individuals in their own good. Is this consistent with prioritarianism's welfarist foundations? *This directly relates to the unresolved difficulty.*
      *   Rebuild the ex ante prioritarianism sketch (Month 2): Safe (50,50). Risky ((102,0), (0,102)). Each person’s expected well-being: 51. Ex ante prioritarian value: Transform(51) + Transform(51). Safe: Transform(50) + Transform(50). For concave φ (e.g., square root), φ(51) > φ(50), so ex ante prefers risky. Statewise: In state 1 (102,0), transformed sum √102 + √0 ≈ 10.1 < √50 + √50 ≈ 14.14. Similarly worse in state 2. **Risk:** Assumes statewise evaluation of prioritarian value is the relevant metric for dominance. Is this justified, or does prioritarianism only care about the ex ante aggregate?
      *   Formalize the "spirit" of the LDO analogues (Month 3): Define precisely the objections: (1) Violation of Ex Ante Unanimity (Ex Post View): A prospect deemed better overall despite being worse for *everyone* ex ante. (2) Violation of Statewise Dominance in Aggregate Value (Ex Ante View): A prospect deemed better overall despite yielding a *lower* prioritarian sum in *every* possible state of the world. Compare these to the classic LDO structure.

  *   **Months 4-6: Stress Testing and Exploring Alternatives:**
      *   Sensitivity Analysis (Month 4): Vary key assumptions: Different concave transforms (log, CRRA); non-equiprobable states; different well-being ranges; more than two individuals; correlated vs. anti-correlated risks. Do the violations persist robustly, or do they vanish under specific parameterizations? **Risk:** The ex post violation might depend on specific risk profiles; the ex ante violation might depend on the degree of concavity.
      *   Dynamic Consistency Challenge (Month 5): Investigate whether ex ante prioritarianism is vulnerable to the dynamic inconsistency ("money pump") argument. Can sequential choices expose a conflict between its ex ante evaluation and conditional choices made later? Formalize the pumping scenario.
      *   Exploring a "Third Way"? (Month 6): Evaluate alternative extensions: (a) Transform the risk-adjusted certainty equivalent of each individual's prospect (e.g., φ(CE_i)). Assess if this is principled (e.g., respecting ex ante individual good) or ad hoc. (b) Two-stage aggregation: First aggregate across states for each person (yielding expected well-being), then apply the transform across persons? (This collapses to ex ante). Or transform first within states, then aggregate across states? (This collapses to ex post). Is any distinct, coherent third alternative viable?

  *   **Month 7-8: Addressing the Core Difficulty: Individual Good Under Risk:**
      *   **Focus:** What does prioritarianism imply for when one prospect is better *for a specific individual* than another under uncertainty? Does it require respecting the individual's risk attitudes towards their own well-being? Or can the prioritarian stipulate that individuals are risk-neutral in their good (using expected well-being as the metric for "better for")? **Crucial Risk:** If prioritarianism insists individuals *must* be risk-neutral in their good to use expected well-being, does this beg the question against the LDO analogue? The LDO analogue (ex post view violating unanimity) relies on individuals preferring the risky prospect *by expected well-being*. If prioritarianism rejects expected well-being as the metric for individual good under risk, the force of the unanimity violation is undermined. Resolving this conceptual tension is paramount.

  *   **Months 9-12: Synthesizing Findings & Philosophical Implications:**
      *   Map the necessary trade-offs: Formalize the conflict between ex ante unanimity, statewise dominance in aggregate value, and dynamic consistency across the different prioritarian extensions.
      *   Re-evaluate the LDO narrative: Does the project show prioritarianism "relocates" the LDO? Does it face a structurally analogous, but distinct, dilemma under uncertainty? Or does it face a *new* kind of dilemma?
      *   Compare to Telic Egalitarianism: How do standard extensions of telic egalitarianism (ex post equality, ex ante equality) fare under uncertainty regarding similar principles? Does prioritarianism retain any distinctive advantage?

  *   **Months 13-15: Drafting Core Papers:**
      *   Paper 1: Focused on the formal results: The necessary violations by ex post and ex ante prioritarianism and the trade-off landscape.
      *   Paper 2: Focused on the philosophical implications: The "relocation" thesis, the challenge of defining individual good under risk for prioritarianism, and the revised assessment of prioritarianism vs. egalitarianism under uncertainty.

  *   **Months 16-18: Refinement, Integration, and Submission:**
      *   Refine papers based on internal review and feedback from collaborators/supervisors.
      *   Write a synthesizing overview chapter/article linking the formal and philosophical strands.
      *   Prepare final project report and submit core papers to peer-reviewed journals.

  **4. Intended Results and Deliverables:**

  1.  **Formally Robust Characterization:** A rigorous demonstration that both standard extensions of prioritarianism to uncertainty (ex post and ex ante) violate core principles analogous to the intuition behind the leveling-down objection (Ex Ante Unanimity and Statewise Dominance in Aggregate Value, respectively).
  2.  **Trade-off Map:** A clear formal and conceptual map of the necessary trade-offs prioritarianism faces under uncertainty between ex ante unanimity, statewise dominance, and dynamic consistency.
  3.  **Resolution of Core Difficulty:** A defended position on how prioritarianism should conceptualize "better for a person" under risk and whether this undermines or supports the force of the identified violations.
  4.  **Assessment of Alternatives:** An evaluation of whether alternative extensions (e.g., certainty equivalent transformation) offer a viable escape route or merely shift the problem.
  5.  **The "Relocation" Thesis:** A substantiated philosophical argument regarding whether prioritarianism relocates rather than resolves the core concern of the leveling-down objection when confronted with uncertainty.
  6.  **Peer-Reviewed Publications:** Minimum two high-quality journal articles: one focused on the formal social choice results, one on the ethical implications.
  7.  **Project Synthesis:** A comprehensive final report or monograph chapter integrating the findings.

  **5. What Would Count as Failure:**

  *   **Instability of Constructions:** The identified violations prove highly sensitive to model specifications (e.g., specific transforms, probability distributions) and vanish under plausible generalizations, rendering the core conjecture unsupported. *(Mitigation: Month 4 sensitivity analysis is designed to uncover this early).*
  *   **Mischaracterization of LDO Analogue:** The principles violated (Ex Ante Unanimity, Statewise Dominance in Aggregate Value) are convincingly shown *not* to be legitimate analogues of the core intuition behind the leveling-down objection. *(Mitigation: Month 3 explicitly focuses on formalizing this analogy).*
  *   **Resolved Core Difficulty:** The challenge of defining "better for" under risk is resolved in a way that decisively deflates one of the main objections (e.g., showing prioritarianism can coherently reject expected well-being as the metric, nullifying the ex ante unanimity objection). *(Mitigation: Month 7-8 dedicated to this).*
  *   **Viable Third Extension:** A distinct, principled extension is found that robustly avoids both violations without introducing worse problems, genuinely preserving prioritarianism's advertised advantage. *(Mitigation: Month 6 explores alternatives).*
  *   **Known Impossibility Restated:** The results are shown to be essentially a rediscovery or specific application of a broader, known impossibility theorem (e.g., Harsanyi’s Aggregation Theorem + concavity conflicts, or general trade-offs in social choice under uncertainty) lacking novel philosophical significance. *(Mitigation: Explicitly framing the *philosophical* relocation thesis distinguishes the project).*
  *   **Dynamic Consistency Decisive:** The dynamic consistency argument against ex ante prioritarianism is solidified to the point where the ex post view is overwhelmingly preferred, allowing the project's critique to focus solely on the ex post view's violation of unanimity, but potentially weakening the claim of a *dilemma*.

  **6. Scope and Fit:**

  *   **Scope Management:** The project explores a third extension (e.g., certainty equivalents) in Month 6. If initial exploration (Month 6) reveals deep problems or lack of promise, or if the core analysis (Months 1-5, 7-8) proves more complex, this third-way exploration will be curtailed at the six-month mark to focus resources on strengthening the analysis of the ex post/ex ante dilemma and resolving the core difficulty concerning individual good.
  *   **Fit for Ethics:** While employing formal social choice tools, the project’s primary aim is *philosophical*: to challenge a foundational narrative in distributive ethics (prioritarianism’s escape from the LDO) by exposing a critical vulnerability under realistic conditions of uncertainty. The core questions concern the nature of prioritarian value, its relationship to individual good under risk, and the validity of objections based on unanimity and dominance in ethical evaluation. Understanding whether a major theory of distributive justice collapses into a dilemma analogous to the one it purports to solve is fundamentally an ethical inquiry, demanding conceptual and normative analysis beyond pure technical social choice. The deliverables target ethics journals and aim to reshape ethical debates about equality, priority, and decision-making under ignorance.
