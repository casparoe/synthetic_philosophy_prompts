prompt: |-
  Could you translate the central claim of Good's theorem on the value of information into a reusable procedure for repeated, time-pressured professional decisions?

  My context is as follows. I serve as a senior planning case officer for a district council in England. Several times each month I must decide whether to request additional evidence before determining an application — a traffic count, a flood model update, an ecological survey, a noise assessment. The stakes are moderate but recurrent: unnecessary requests delay housing, impose costs on applicants and invite appeals for non-determination, while failure to request genuinely decision-changing evidence risks unlawful decisions and judicial review. I have roughly half an hour to screen each such question, no formal training in decision theory, and I must be able to defend the reasoning briefly to a head of service who signs off.

  Please provide a step-by-step procedure, expressed as a flowchart in words, that preserves what the theorem actually establishes whilst remaining usable by a non-specialist. It should move in order through identification of the pending decision and live options, isolation of the uncertainties that could alter the choice, estimation of the ex ante benefit of resolving them, accounting for the full cost of the information including delay, applicant burden and loss of flexibility, and explicit checks on whether the idealising assumptions behind the theorem hold in the case at hand. For each step, state what would count as enough to proceed and what triggers a stop with a recommendation not to seek the information. Mark clearly the points at which formal calculation must give way to judgement and cannot be eliminated.

  The procedure must be able to handle four difficult situations that recur in my work: information that is free to the council but expensive to the applicant; information that, once obtained, cannot be set aside and must be disclosed on the public file; information whose mere collection is observed by developers, objectors or committee members and changes their behaviour; and situations where I have reason to think that I or the planning committee will overweight a vivid or alarming finding relative to its actual decision relevance.

  Then demonstrate the procedure on the following three invented cases, showing your working at each step:

  A proposal for 35 dwellings on the edge of a village where the only material uncertainty is peak-hour capacity on a single-track access lane, for which the highways team offers a two-week automatic traffic count at internal cost;

  A proposal to convert a vacant warehouse into twelve flats where a consultant quotes a three-week bat presence survey, with a local residents association having publicly stated that any survey mentioning bats, whatever its conclusion, will be used to demand a far lengthier ecological assessment;

  A retrospective application for an extended farm shop car park partly within a flood-risk area, where updated surface-water modelling would take six weeks beyond the statutory determination period and the applicant has indicated an appeal on grounds of delay, and where committee practice suggests any ambiguous modelling result would in effect be treated as grounds for refusal.

  Include at least one case where faithful application of the procedure recommends a course that a cautious officer would dislike, such as declining apparently reassuring evidence or commissioning evidence despite delay, and explain why. Conclude with a brief statement of what the procedure cannot do and where it is liable to misfire.

  Please respond in British English, using British spelling and conventions throughout.
reasoning: |-
  Okay, the user is a senior planning case officer in an English district council dealing with recurrent decisions about requesting additional evidence for planning applications. They need a practical procedure based on Good's theorem that fits their time constraints and professional context. 

  Hmm, the core challenge is translating a mathematical theorem into a defensible bureaucratic workflow. The user explicitly wants four real-world complexities addressed: applicant costs, public disclosure risks, behavioural reactions to information gathering, and cognitive biases in interpretation. 

  Right, the procedure must resist two natural tendencies: officers defaulting to "safe" evidence requests, or committees overreacting to vivid data. The bat survey case will be telling - it might demonstrate when NOT to commission evidence despite apparent ecological prudence.

  Ah, and the flood modelling case will test whether delay costs can ever outweigh accuracy needs. That's professionally brave territory - recommending against evidence when committees are risk-averse. Must explicitly flag where the theorem assumptions break down (like when information isn't "pure" but alters behaviour).

  The three invented cases are well-chosen to stress-test the framework. Particularly the bat scenario where information itself becomes a political weapon. For that one, the "cost" includes triggering disproportionate demands - classic Streisand effect in planning terms.

  Notably the user admits no formal decision theory training, so the flowchart must be self-explanatory. The "half-hour per question" constraint means no calculations - just ordinal scales (high/medium/low) and clear stop/go gates. Must emphasise the judgment points where professional experience takes over from logic.

  ...And use British English throughout. "Judgement" with two 'e's, "defence", "material considerations" etc. The farm shop case needs particular care - "retrospective application" and "non-determination" are precise legal terms here.
answer: |-
  Here is a step-by-step procedure based on Good's theorem, adapted for your context as a senior planning case officer. Good's theorem essentially states that the expected value of information (VOI) is the expected improvement in decision quality minus the cost of obtaining it. Information is valuable only if it could change your decision *and* the benefit of that better decision outweighs the costs.

  **Procedure: Value of Information Assessment for Planning Evidence Requests**

  **(Flowchart in Words - Use Sequentially for Each Potential Evidence Request)**

  1.  **Define the Pending Decision:**
      *   *What is the core planning decision I must make?* (E.g., "Approve/Refuse Application X", "Approve with Conditions A,B,C/Refuse", "Defer for Committee/Determine Under Delegation").
      *   *What are the live options (A, B, C...) available to me now?* (E.g., Approve, Refuse, Request Info Y).
      *   *Enough to Proceed:* Clear identification of the immediate decision point and the realistic alternatives *before* requesting new evidence.
      *   *Stop & Do Not Seek:* If the core decision isn't defined, or the options are unclear. Proceed only when the immediate choice is concrete.

  2.  **Identify Key Uncertainties:**
      *   *What specific, material uncertainty(ies) could this evidence resolve?* (Be precise: e.g., "Actual AM peak traffic flow on Lane Z", "Presence/Absence of maternity roosting bats in Building Q", "Updated surface water flow rate at Point R during 1% AEP event").
      *   *Enough to Proceed:* At least one plausible, material uncertainty identified that the evidence *directly* addresses.
      *   *Stop & Do Not Seek:* If the evidence doesn't resolve a material uncertainty relevant to the pending decision (e.g., it's tangential, confirms the obvious, addresses a non-material issue). **Judgement Point:** Assessing materiality requires planning judgement based on policy and law.

  3.  **Assess Potential Decision Change:**
      *   *Could resolving this uncertainty genuinely change my recommended decision (or the likely committee outcome) between the live options?*
      *   Consider plausible outcomes of the evidence (e.g., Traffic Count High/Medium/Low; Bats Present/Absent; Flood Risk Increased/Unchanged/Reduced).
      *   For *each* plausible outcome, ask: "Would this finding likely lead me (or committee) to choose a *different* option (A, B, C...) than I would without the evidence?"
      *   *Enough to Proceed:* A credible scenario exists where at least one evidence outcome would change the decision. (If 'No', VOI is zero).
      *   *Stop & Do Not Seek:* If, realistically, *no* plausible outcome of the evidence would alter your recommended decision or the likely committee decision between the live options. (e.g., Policy is clear-cut regardless, or the uncertainty isn't decisive). **Judgement Point:** Requires honest assessment of your own/committee's likely reaction to evidence. Crucial for avoiding requests for irrelevant 'reassurance'.

  4.  **Estimate Benefit of Better Decision (Ex Ante):**
      *   *Roughly, how much 'better' (in planning terms) would the changed decision be?* Consider:
          *   Avoiding a bad outcome (e.g., unlawful grant, severe harm, JR loss costs & reputation).
          *   Enabling a good outcome (e.g., lawful approval of needed housing, preventing unnecessary refusal).
          *   Scale the benefit: Low (Minor efficiency gain/loss avoided), Medium (Significant harm avoided/benefit secured), High (Preventing major unlawful act/severe harm).
      *   *How likely is it that the evidence actually leads to this better decision?* (Low/Medium/High confidence that the evidence *will* change the decision *and* that the new decision is indeed better).
      *   *Enough to Proceed:* A non-zero estimated benefit exists (Low/Med/High) *and* some confidence (Low/Med/High) it would be realised. Combine intuitively (e.g., High Benefit + Low Confidence might warrant caution; Low Benefit + High Confidence might be marginal).
      *   *Stop & Do Not Seek:* If the potential benefit of a changed decision is negligible (Low) *and/or* confidence that the evidence would actually trigger the better decision is very low. **Judgement Point:** Highly subjective, requires weighing planning merits, risks, and probabilities intuitively. Cannot be eliminated.

  5.  **Account for FULL Cost of Information:**
      *   Quantifiable Costs: Officer time (requesting, reviewing), direct fees (council's share), applicant/consultant costs quoted.
      *   Temporal Costs: Delay to determination (weeks/months). Risk of non-determination appeal *specifically due to this delay*.
      *   Burden Costs: Imposed costs on applicant (financial, time). Potential for applicant withdrawal or appeal on cost grounds.
      *   Strategic Costs:
          *   Loss of Flexibility: Does getting the evidence lock you/committee into a path? (e.g., must disclose legally, can't ignore result).
          *   Behavioural Reactions: Will requesting/gathering the evidence trigger unintended consequences? (e.g., objectors escalating demands, applicant pre-emptively altering scheme, committee pre-judging).
          *   Bias Potential: Is there a risk the evidence (or its mere existence) will be misinterpreted or overweighted due to vividness/alarm? (e.g., "Bats found!" regardless of significance).
      *   *Enough to Proceed:* A holistic estimate of the total 'cost' (including all above factors) as Low, Medium, or High.
      *   *Stop & Seek:* If the estimated total cost is Low AND Step 4 suggests non-zero benefit/likelihood. **Judgement Point:** Weighing disparate costs (money, time, burden, risk) holistically. Critical for handling the 4 difficult situations.

  6.  **Value of Information (VOI) Assessment:**
      *   *Does the estimated Benefit (Step 4) outweigh the estimated Total Cost (Step 5)?* Use simple ordinal comparison:
          *   If Estimated Benefit >> Estimated Total Cost → VOI = **High**
          *   If Estimated Benefit ≈ Estimated Total Cost → VOI = **Marginal**
          *   If Estimated Benefit << Estimated Total Cost → VOI = **Low/Zero**
      *   *Check Theorem Assumptions:*
          *   *Rational Use:* Will the evidence *actually* be used rationally in the decision? (Or will bias likely distort it? - Step 5 factor).
          *   *Costs Captured:* Have *all* material costs, especially strategic/behavioural ones (Step 5), been considered?
          *   *Decision Impact:* Is the evidence truly decision-relevant (Steps 2 & 3)?
      *   *Enough to Proceed:* VOI assessment (High/Marginal/Low) made, and no major red flags on assumptions (e.g., clear risk of severe bias or uncaptured cost).
      *   *Stop & Do Not Seek:* If VOI is assessed as **Low/Zero**.
      *   *Stop & Seek:* If VOI is assessed as **High**.
      *   *Proceed to Step 7:* If VOI is **Marginal** or Assumption Checks raise significant doubts. **Judgement Point:** Final synthesis and weighing. Deciding on marginal cases or where assumptions are shaky rests entirely on professional judgement.

  7.  **Final Judgement Call (For Marginal VOI or Shaky Assumptions):**
      *   Weigh any remaining doubts from Assumption Checks (Step 6).
      *   Consider overarching principles: Proportionality, Presumption in Favour of Sustainable Development, Avoiding Unnecessary Delay/Burden, Precautionary Principle (if truly applicable).
      *   *Recommendation:* Based on holistic professional judgement, decide whether to Request or Not Request the evidence.
      *   *Must Defend:* Brief rationale must be recordable/defendable, referencing key factors from the steps above (e.g., "Benefit marginal, cost to applicant high, risk of behavioural escalation significant").

  ---

  **Demonstration on Invented Cases:**

  **Case 1: 35 Dwellings - Traffic Count**

  1.  **Decision:** Approve (with S106 highways contribution) / Refuse (highways safety grounds). Live Option: Request Count.
  2.  **Uncertainty:** Actual AM/PM peak traffic flow on single-track lane (specifically, whether it exceeds capacity threshold for safe access).
  3.  **Decision Change?** Yes. If count is *below* threshold, likely approve. If *above* threshold, likely refuse (or require major mitigation). Uncertainty is decisive.
  4.  **Benefit:** *High* (Avoid unlawful approval if over-capacity, or unnecessary refusal if under-capacity). Confidence: *High* (Evidence directly addresses key uncertainty).
  5.  **Total Cost:**
      *   Council Cost: Low (Internal highways team).
      *   Delay: Low (2 weeks, likely within normal determination period).
      *   Applicant Burden: Low (Minimal involvement - automatic count).
      *   Flexibility/Behavioural Risk: Low (Standard practice, unlikely to trigger unusual reactions).
      *   Bias Risk: Low (Quantitative data, less prone to vividness bias).
      *   **Overall Cost: Low.**
  6.  **VOI Assessment:** High Benefit vs Low Cost → **VOI High.**
  7.  **Final:** **Recommend Requesting Count.** (Clear case, low cost, high potential benefit). Defend: "Essential evidence to resolve key highways safety uncertainty, low cost/delay."

  **Case 2: Warehouse Conversion - Bat Survey**

  1.  **Decision:** Approve / Refuse (potential harm to protected species). Live Option: Request Survey.
  2.  **Uncertainty:** Presence/Absence of maternity roosting bats (which would trigger need for licence/mitigation).
  3.  **Decision Change?** *Potentially.* If bats *absent*, approve. If bats *present*, need licence/mitigation plan - could still approve *if* plan suitable. Refusal only if harm unavoidable. *Likely* only changes decision if bats present *and* no suitable mitigation possible (which survey alone doesn't establish). **Marginal change potential.**
  4.  **Benefit:** *Medium* (Avoid unlawful approval if bats present and harmed; avoid unnecessary mitigation cost/refusal if absent). Confidence: *Low-Medium* (Survey result unlikely to lead directly to refusal without further assessment; benefit contingent on next steps).
  5.  **Total Cost:**
      *   Council Cost: Low (Processing).
      *   Delay: Medium (3 weeks).
      *   Applicant Burden: *High* (Survey cost).
      *   Flexibility/Behavioural Risk: ***Very High*** (Residents Assoc. stated intent to demand *lengthier* assessment *regardless* of survey result. This creates high risk of significant further delay, cost, and political pressure, potentially forcing refusal even if bats absent or mitigatable. Loss of control over process).
      *   Bias Risk: *High* (Any mention of bats likely to be seized upon and alarm heightened, regardless of actual impact/risk).
      *   **Overall Cost: Very High (due to Behavioural & Bias Risks).**
  6.  **VOI Assessment:** Medium Benefit (Low-Med Confidence) vs **Very High Cost** → **VOI Low/Zero.** Assumption Check: High risk evidence won't be used rationally (bias, behavioural escalation).
  7.  **Final: Recommend NOT Requesting Survey.** (High cost/risk disproportionate to likely benefit). **This is the cautious officer's disliked outcome.** *Why?* The behavioural reaction (RA's stated intent) creates a high probability that commissioning this survey *itself* triggers disproportionate cost, delay, and pressure, likely outweighing any direct planning benefit of knowing about bats. The mere act of seeking the information creates significant negative value. Defend: "Survey requested by applicant/required? [If no:] Survey cost and delay to applicant high. Significant risk that survey process, regardless of result, triggers disproportionate demands from residents for extended ecological assessment, causing major delay, cost, and potential for prejudiced decision-making. Not proportionate given likelihood survey alone would not change outcome if bats absent or mitigatable. Reliance on existing evidence/applicant's declaration more appropriate unless clear evidence of likelihood of presence." *If bats highly likely, different judgement.*

  **Case 3: Farm Shop Car Park - Flood Modelling**

  1.  **Decision:** Approve (retrospectively, possibly with conditions) / Refuse (flood risk). Live Option: Request Modelling (knowing it causes delay).
  2.  **Uncertainty:** Updated surface water flow rate/risk at the development site (specifically, whether the car park extension significantly increases flood risk elsewhere).
  3.  **Decision Change?** Yes. Current evidence ambiguous. If modelling shows *no significant increase*, likely approve. If shows *significant increase*, likely refuse (esp. given committee practice).
  4.  **Benefit:** *High* (Avoid unlawful approval if flood risk increased; avoid unnecessary refusal if risk not increased). Confidence: *Medium* (Modelling key evidence, BUT committee bias risk).
  5.  **Total Cost:**
      *   Council Cost: Low/Medium (Officer time managing delay).
      *   Delay: ***Very High*** (6 weeks *beyond* statutory period). Applicant has indicated appeal for non-determination - high likelihood of appeal costs/loss.
      *   Applicant Burden: Medium (Cost of modelling).
      *   Flexibility/Behavioural Risk: *High* (Modelling result must be disclosed. Committee practice suggests *any* ambiguity treated as refusal ground - high risk evidence won't lead to rational approval even if risk minor/mitigatable).
      *   Bias Risk: *High* (Committee likely to overweight any negative finding or ambiguity due to vividness of flood risk).
      *   **Overall Cost: Very High (Delay/Appeal Risk + Committee Bias).**
  6.  **VOI Assessment:** High Benefit (Medium Confidence) vs **Very High Cost** → **VOI Marginal/Low.** Assumption Check: High risk evidence won't be used rationally by committee (bias against ambiguity).
  7.  **Final Judgement Call (Marginal VOI + Shaky Assumptions):** **Recommend Requesting Modelling DESPITE Delay/Bias.** *Why?* Flood risk is a fundamental material consideration with potentially severe consequences (unlawful decision, actual flooding). The stakes of being wrong are very high. The delay/appeal risk, while significant, is a procedural/financial cost, whereas the flood risk is a substantive harm. Committee bias is a problem but the evidence is still essential for *officer* recommendation and potential appeal defence. **This is the cautious officer's disliked outcome (due to delay/appeal risk).** Defend: "Updated flood modelling essential to determine a material consideration with high potential consequences. Risk of non-determination appeal significant but outweighed by necessity of ensuring lawful decision on flood risk grounds. Will provide clear recommendation to committee based on modelling outcome, emphasising need for rational interpretation of results."

  ---

  **Conclusion: What the Procedure Cannot Do & Liabilities**

  *   **Cannot Eliminate Judgement:** Steps 3, 4, 5, 6, and 7 inherently rely on professional judgement, estimation, and weighing incommensurate factors (policy, risk, cost, time). It structures thinking but doesn't compute an answer.
  *   **Requires Honest Self/Committee Assessment:** Prone to misfire if the officer underestimates their own bias, overestimates the likelihood of decision change, or misjudges committee behaviour (Steps 3, 4, 5 Assumption Checks).
  *   **Sensitive to Initial Framing:** If the 'live options' (Step 1) or 'uncertainties' (Step 2) are poorly defined, the whole assessment can be skewed.
  *   **Struggles with Extreme Complexity:** If an evidence request interacts with multiple deeply uncertain, interdependent factors, the simple ordinal scales become inadequate.
  *   **Doesn't Account for Political Pressure:** While behavioural reactions are a cost (Step 5), overt political interference isn't easily factored in.
  *   **Assumes Evidence Quality:** It assumes the evidence, if obtained, is reliable and relevant. Poor quality evidence invalidates the benefit assessment.
  *   **Misfires When:** Costs (especially behavioural/bias) are severely underestimated, or when the potential benefit of a changed decision is overestimated due to caution/risk aversion ignoring proportionality. The Bat Survey case exemplifies a common misfire point if behavioural costs are ignored. The Flood Modelling case shows where it might push against institutional risk aversion for fundamental issues.
