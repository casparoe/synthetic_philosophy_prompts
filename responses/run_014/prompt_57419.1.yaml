prompt: |-
  Me and Rosa are co-editing a casebook on emergence in the sciences, and we've got room for maybe five chapters in the section we're calling "the real thing" — phenomena that genuinely resist reduction. Rosa's been drawing the line. Her calls so far: water's being H2O, along with its density and boiling point — reduces; temperature as mean molecular kinetic energy in a dilute gas — reduces; the ideal gas law from statistical mechanics — reduces, and she specifically likes that you never have to send N to infinity; chemical bonding from quantum mechanics — reduces, and she waves off the Born-Oppenheimer objection as a controllable approximation with a bounded error; Mendelian genetics from molecular biology — reduces, and she thinks multiple realizability is a red herring she'd deploy just as happily against pain-in-octopuses arguments; thermodynamics from statistical mechanics — does NOT reduce, because sharp phase transitions and irreversability need N→∞ while any finite system is analytic, reversible and recurrent; Navier-Stokes from molecular dynamics — does NOT reduce, because you have to route through the Boltzmann equation, which needs the Boltzmann-Grad limit plus the molecular chaos assumption; psychology from neuroscience — she won't call it, on the grounds that we don't have a settled theory at either end.

  Now there's a submission for the last slot, on the "typicality" version of statistical mechanics: a finite box of N hard spheres, exact reversible Hamiltonian dynamics, a very low-entropy initial macrostate, and a measure-theoretic argument that almost every microstate compatible with that macrostate goes on to raise its entropy. No thermodynamic limit, no master equation, no Stosszahlansatz — the second law is supposed to fall out of finite-N mechanics plus a claim about which initial conditions are typical.

  Which way does Rosa call it, and should we file it under emergence if we want to be consistent with our own record? Which of her earlier entries is the closest analog? I keep feeling like her two rejections are confounded somehow and I can't say how. So: lay out the criteria she could plausibly be running, what each one predicts about this submission, your best guess and the reasons for it, and what further case we should put to her to settle it. Also flag anything in the record that's ambiguous in a way that changes the answer — I suspect she's been sliding between reducing theories and reducing properties without noticing.
