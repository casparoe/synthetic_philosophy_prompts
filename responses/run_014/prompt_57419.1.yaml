  - Thermodynamics requires N→∞ for sharp phase transitions (finite N can't show true irreversibility)
  - Navier-Stokes needs the Boltzmann-Grad limit + molecular chaos assumption

  But she accepts reductions that work for finite N:
  - Ideal gas law without infinite limits
  - Chemical bonding with bounded error approximations

  The submission claims finite-N typicality justifies the second law without limits or assumptions. Hmm... Rosa might see this as analogous to her thermodynamics rejection because:
  1. "Almost every" microstate argument relies on measure theory - which is a probabilistic idealization similar to thermodynamic limits
  2. Finite N systems are still reversible Poincaré recurrence means entropy must eventually decrease
  3. "Typicality" itself might feel like an unphysical assumption to her

  But counterpoints exist:
