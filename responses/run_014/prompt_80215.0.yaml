  Okay, let me approach this systematically. The user is a retired statistical physicist diving into philosophy of probability, specifically the Principal Principle and the tricky concept of "admissible evidence." 

  First, I need to unpack why "admissible evidence" is such a headache. The user's background in statistical physics means they're deeply familiar with objective chance (like Born rule probabilities), but the bridge to subjective credences introduces new conceptual challenges. Their core frustration seems to be the vagueness surrounding admissibility - especially when evidence involves self-referential credence states or meta-information about chances.

  The key here is to identify the non-negotiable constraints any theory must satisfy. The New Principle emerges as a critical fix for cases where evidence includes chance facts themselves - Lewis himself acknowledged this flaw. But beyond that, we need to handle edge cases like future events (does knowing a coin flip outcome make historical evidence inadmissible?), self-locating beliefs (how does being part of the ensemble affect credences?), and computational constraints (can we ignore information we can't process?). 

  Notably, some desiderata conflict. For instance, requiring accuracy for all possible evidence (Desideratum 5) clashes with computational tractability (Desideratum 8). This tension exposes a fundamental rift between ideal rationality and feasible epistemology. 

  When scoring existing approaches, the user will care about how each handles these trade-offs: Lewis' original PP fails on chance-in-evidence cases; the New Principle fixes that but struggles with self-locating beliefs; Humean approaches avoid primitive chances but make admissibility even murkier. 

  The physicist's lens matters here - they'll appreciate how quantum mechanical contexts strain these frameworks (e.g., wavefunction knowledge as evidence). I should emphasize where statistical physics intuitions might mislead; for example, ensemble thinking doesn't cleanly map to individual credence updating. 

  Ultimately, the answer must validate their suspicion that admissibility is under-specified while giving concrete criteria to evaluate theories. The closing scorecard should highlight unresolved tensions rather than declare winners.
answer: |-
  Here's a breakdown of the core desiderata for any theory linking credence (Cr) to objective chance (Ch), grounded in the Principal Principle (PP) and its challenges. These criteria emerge from philosophical analysis, paradoxes, and practical applications, reflecting tensions between ideal rationality and real-world constraints.

  **Core Desiderata (Broadly Accepted as Necessary):**

  1.  **The Basic Alignment Requirement (Motivation: Core Purpose of Chance):**
      *   **Desideratum:** When an agent knows the objective chance Ch(A) = x and possesses *only* admissible evidence regarding A, their credence should satisfy Cr(A) = x.
      *   **Motivation:** The fundamental intuition behind objective chance – it represents the "best possible" guide for rational belief in situations of ignorance about specific outcomes, given the physical setup. Violating this undermines the concept of chance itself.
      *   **Non-Negotiable:** Yes. This *is* the core intuition the PP formalizes.

  2.  **The Future Chance Requirement (Motivation: Temporal Asymmetry of Chance):**
      *   **Desideratum:** Information solely about events occurring *after* the time t to which the chance Ch_t(A) refers should generally be admissible evidence. Conversely, information about events *at or before* t that "screen off" the relevance of the chance setup might be inadmissible.
      *   **Motivation:** Chances evolve and become "crystallized" as time passes. Knowing a future outcome (e.g., "The coin landed heads") typically trumps knowledge of the past chance (e.g., "The chance of heads was 0.5"). The theory must explain why historical information *can* be admissible while future outcome information usually is not.
      *   **Non-Negotiable:** Broadly yes, though the precise boundary of "solely about future events" and the nature of "screening off" are debated.

  3.  **The Chance-Evidence Consistency Requirement (Motivation: Avoiding Self-Defeat / The "Big Bad Bug"):**
      *   **Desideratum:** The theory must avoid mandating inconsistent credences when the agent's evidence includes propositions *about the chance function itself* (e.g., E = "Ch(A) = y" where y ≠ x, or E specifies the entire chance function).
      *   **Motivation:** Lewis's "Big Bad Bug": If E entails Ch(A) ≠ x, then Cr(A | Ch(A)=x ∧ E) seems undefined or contradictory under the simple PP (Cr(A | Ch(A)=x ∧ E) = x, but E implies Ch(A)≠x!). The theory must handle evidence constraining Ch without contradiction.
      *   **Non-Negotiable:** Yes. Failure leads to logical incoherence. This is the primary driver for moving beyond the simple PP to variants like the *New Principle*.

  4.  **The Intrinsic Admissibility Requirement (Motivation: Preserving Chance's Authority):**
      *   **Desideratum:** Facts that are *intrinsically* or *directly* about the chance Ch_t(A) itself at time t must be admissible *at all times*, including times after t.
      *   **Motivation:** Knowledge of the objective chance should always be a legitimate basis for setting credence, even retrospectively. If I learn *now* that the chance of heads yesterday was 0.7 (and gain no other relevant information), my credence now that it landed heads yesterday *should* be 0.7.
      *   **Non-Negotiable:** Broadly yes. Denying this severs the essential link between chance and rational belief.

  **Important, But More Contested or Context-Dependent Desiderata:**

  5.  **The Totality of Evidence Requirement (Motivation: General Bayesian Coherence):**
      *   **Desideratum:** An agent's credence Cr(A) should be based on their *total* evidence E. The theory should specify how Ch(A) interacts with *all* of E, not just a privileged subset labeled "admissible".
      *   **Motivation:** Foundational principle of Bayesian epistemology. Rational belief updates should respect all available relevant evidence.
      *   **Non-Negotiable?:** Highly desirable, but strict adherence can conflict with the simple PP formulation (which relies on partitioning evidence into admissible/inadmissible). The New Principle and its descendants aim to satisfy this more fully by making Ch(A) conditional on the entire chance *theory/history*.

  6.  **The Self-Locating Evidence Requirement (Motivation: Indexical Knowledge & Large Ensembles):**
      *   **Desideratum:** The theory should correctly handle evidence involving the agent's location within a chance setup, especially in large or infinite ensembles (e.g., "I am in universe U_i", "My particle is the one that decayed at t").
      *   **Motivation:** Common in physics (statistical mechanics, cosmology). An agent's knowledge of their specific position within a system governed by chances can be highly relevant to their credences about outcomes involving that position, potentially interacting with chance knowledge in complex ways.
      *   **Non-Negotiable?:** Crucial for applicability to real physics, but solutions are actively debated (e.g., Is self-locating evidence *about the chance setup* or *additional data*?).

  7.  **The Credence-Evidence Requirement (Motivation: Transparency & Higher-Order Uncertainty):**
      *   **Desideratum:** The theory should specify how an agent should update their credence if their evidence includes propositions about their *own current or past credences* (e.g., "I currently have Cr(A) = 0.3" or "Yesterday I was certain of A").
      *   **Motivation:** Rational agents reflect on their own epistemic states. Evidence about one's own credences (perhaps from introspection or an external oracle) seems relevant to current belief, but directly plugging it into the PP is problematic (e.g., if E includes "Cr(A)=0.3", PP might imply Cr(A | Ch(A)=x ∧ E) = x, ignoring the information in E about the credence).
      *   **Non-Negotiable?:** Important for a complete theory of rationality, but the interaction is subtle (often handled by principles like the *Reflection Principle* alongside the PP, raising questions of compatibility).

  8.  **The Feasibility / Computational Tractability Requirement (Motivation: Real Agents):**
      *   **Desideratum:** The recommended credences should, in principle, be calculable by bounded rational agents with limited cognitive resources, at least in paradigmatic cases.
      *   **Motivation:** While ideal rationality might demand complex calculations, a theory utterly disconnected from feasible reasoning loses practical relevance. The simple PP has an advantage here over more complex variants.
      *   **Non-Negotiable?:** No. This is widely seen as a pragmatic constraint distinct from the *normative* question of what ideal rationality demands. However, extreme infeasibility weakens the theory's normative force.

  **Tensions and Potential Inconsistencies:**

  *   **Desiderata 3 (Chance-Evidence Consistency) vs. Simplicity:** The simple PP (Cr(A | Ch(A)=x ∧ E) = x) fails Desideratum 3 catastrophically when E constrains Ch(A). Fixing this (e.g., via the New Principle: Cr(A | H ∧ T) = Ch_T(A | H), where T is the chance theory and H is admissible historical info) satisfies 3 and 4 but complicates the rule (Desideratum 8) and requires defining T and H precisely.
  *   **Desiderata 5 (Totality of Evidence) vs. Admissibility Partition:** The core PP formulation relies on distinguishing admissible/inadmissible evidence. Desideratum 5 pushes towards theories (like the New Principle) that incorporate all evidence *through* the chance function's conditional behavior, potentially eliminating the need for an explicit admissibility *concept*, though an implicit distinction often remains.
  *   **Desiderata 6 (Self-Locating Evidence) vs. Simplicity & Chance Authority:** Incorporating self-locating evidence cleanly into the chance-credence link is difficult. Does the chance function itself encode facts about an agent's location? Or is it separate data? Resolving this can lead to complex or unintuitive prescriptions that seem to dilute the direct authority of chance (Desiderata 1 & 4).

  **Scorecard of Major Contenders Against Key Desiderata:**

  1.  **Lewis's Original Principal Principle (PP):**
      *   **Strengths:** Simple, intuitive, clearly satisfies Desiderata 1 & 2 (in simple cases), relatively feasible (8).
      *   **Weaknesses:** Fails catastrophically on Desideratum 3 (Big Bad Bug). Struggles with precise definitions for Desiderata 4, 5, 6, 7. Admissibility is left undefined.

  2.  **The New Principle (NP) / Chance-Credence Norm (e.g., Hall, Thau, Lewis's later view):**
      Cr(A | H ∧ T) = Ch_T(A | H)
      (T: Complete chance theory specifying chances at all times/worlds; H: Admissible history up to time t; Ch_T: Chance function according to T).
      *   **Strengths:** Fixes the Big Bad Bug (Desideratum 3). Satisfies Desideratum 4 robustly. Moves towards satisfying Desideratum 5 by conditioning on the whole theory T. Handles many chance-in-evidence cases well.
      *   **Weaknesses:** Admissibility (H) is still needed and potentially vague. Defining T precisely can be metaphysically loaded. Computationally complex (Desideratum 8). Handling self-locating evidence (6) and credence-evidence (7) remains challenging within this framework.

  3.  **Humean Approaches (e.g., Best System Analysis + PP/NP):**
      (Chance is defined by the best systematization of Humean mosaics).
      *   **Strengths:** Provides a naturalistic reduction of chance (T is defined by the Best System). Can adopt the NP to handle Desideratum 3. Grounds Desideratum 2 in the temporal structure of the mosaic.
      *   **Weaknesses:** Admissibility (H) becomes especially murky – what counts as "historical" relative to the Best System? Self-locating evidence (6) can be problematic (does the Best System specify *my* location?). The subject-relative nature of "best" can raise concerns about the objectivity demanded by Desiderata 1 & 4.

  4.  **Evidential Probability / Chance as Expert (e.g., Gaifman, some interpretations):**
      (Treat chance as an "expert" function that one defers to *given one's total evidence*).
      *   **Strengths:** Directly satisfies Desideratum 5 (total evidence). Can be formulated to avoid the Big Bad Bug (3). Handles credence-evidence (7) potentially more naturally (deferring to the expert incorporates knowledge about one's credences only if relevant).
      *   **Weaknesses:** Risks collapsing the objective/subjective distinction (Desiderata 1 & 4). Needs a robust, non-circular account of what the "expert" function *is* (often falls back on something like objective chance). Defining the expert conditional on complex total evidence (E) can be as opaque as defining admissibility.

  **Conclusion:**

  The core non-negotiables are the Basic Alignment (1), Future Chance temporal asymmetry (2), avoiding Chance-Evidence inconsistency (3), and Intrinsic Admissibility of chance facts (4). The main tension lies between the simplicity and initial appeal of the Original PP and the necessity of fixes like the New Principle to satisfy Desideratum 3, which introduces complexity and shifts the burden onto defining the chance theory/history (T/H). Handling self-locating evidence (6) and credence-evidence (7) remains an open frontier, while feasibility (8) is a pragmatic constraint. No current theory perfectly satisfies all desiderata without significant metaphysical baggage or complexity, but the New Principle (or variants) represents the current mainstream solution to the most critical flaw in the original PP. The quest for a fully adequate theory continues to drive research at the intersection of metaphysics, epistemology, and the philosophy of science.
