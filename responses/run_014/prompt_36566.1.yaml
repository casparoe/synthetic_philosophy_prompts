prompt: |-
  I'm a software engineer with no legal training beyond what I've picked up from arguments at family dinners, and I'd like you to audit an analogy I've been leaning on. At work I maintain a large legacy codebase — most of it written a decade before I arrived, no comments, the original developers long gone. My working method there is completely settled: I don't try to reconstruct what the departed developer "intended"; I read what the code actually does, treat behavior that frustrates any reasonable purpose as a bug, and fix it through the normal patching process rather than by reinterpreting it into behaving differently. Over the holidays I argued to my sister-in-law, a litigation attorney, that courts should read statutes the same way: the legislature is the departed developer, the statute is the code, the judge is the maintenance engineer, and if the plain text produces an absurd or obsolete result, that's a bug for the legislature to patch through amendment — not something judges should paper over by consulting unobservable "legislative intent." This seemed obviously right to me, and I said so with some confidence, mostly by analogy to how impossible it would be to do my job if I had to reverse-engineer intent instead of reading the code.

  She pushed back on several fronts, and I want to know whether her objections break the analogy or merely bruise it. First, she said my analogy assumes code is "self-executing" — the behavior just is what the program does — whereas a statute is a message read by millions of citizens and agencies who adjust their conduct based on what they think it says, so "what the code does" and "what the text says" are not the same kind of thing at all. Second, she said the legislature, unlike my departed developers, is not dead: it can be petitioned, lobbied, and asked to amend, and pretending it's a ghost is itself a substantive choice about who should fix what. Third — and this one bothered me — she pointed out that I can only call something a "bug" in my codebase because I already know what the program is supposed to do; "unintended behavior" is unintelligible without an intended function, so the bug/patch vocabulary I was using to defend strict textualism quietly presupposes the purposivist's starting point. She capped it off with a case from 1892, Church of the Holy Trinity v. United States, where the Supreme Court read a statute literally barring contracts for "labor or service of any kind" as not covering a New York church that had hired an Anglican rector from England, because Congress had plainly been after cheap industrial labor, not clergy — a case textualists like Scalia have grumbled about for decades.

  So here is what I'd like from you. Lay out the analogy explicitly — the correspondence table, if you like: statute to code, legislature to the original dev team, judge to the maintenance engineer, amendment to a patch, an absurd literal application to a bug, ordinary meaning to documented behavior — and then assess each of my sister-in-law's three objections against it, plus any other disanalogies you think matter more than hers. Distinguish the disanalogies that genuinely undermine the use I was putting the analogy to (supporting textualist-style statutory interpretation) from the ones that don't. I'd also like to know whether the twist she identified is as devastating as it felt: does the fact that engineers need purposes to identify bugs mean the analogy actually supports purposivism instead, or is there a coherent textualist rejoinder — say, a distinction between using purpose to identify a problem versus using it to rewrite the text? Finally, tell me whether a better analogy from my world exists at all: if not legacy code, then perhaps a public API contract with many downstream consumers, or a specification that clients have relied on and can't be silently changed — something that captures what statutes are that code isn't. I'd appreciate a clear verdict on where my dinner-table argument actually lands once the audit is done.
reasoning: |-
  Okay, let me tackle this software engineer's analogy between legacy code and statutory interpretation. The user is clearly sharp—they've built a detailed parallel between their work maintaining old code and how courts should read statutes, favoring strict textualism. Their sister-in-law, a litigation attorney, hit them with three substantive objections that made them rethink things. 

  First, I need to map their analogy explicitly to create a solid foundation. Statute as code, legislature as dev team, judge as maintenance engineer—that’s straightforward. The core of their argument is that judges, like engineers, should fix "bugs" (absurd outcomes) only through formal amendments ("patches"), not by inferring intent. 

  Now, assessing the sister-in-law’s objections one by one. Her first point about statutes not being "self-executing" like code is strong. Code runs deterministically; statutes rely on human interpretation by citizens, agencies, and courts. That’s a real disanalogy—textual meaning in law is inherently contested, unlike machine-executed code. This weakens the engineer’s argument because it highlights that "what the text says" isn’t as objective as "what the code does." 

  Her second point—that legislatures aren’t "departed" like developers—also lands well. Legislatures can respond to judicial interpretations; dead devs can’t. This makes judicial restraint (waiting for amendments) less urgent in law than in code maintenance, where fixes truly depend on the current engineer. 

  But her third objection is the most interesting. The engineer needs to know the program’s purpose to call something a "bug." Similarly, identifying an "absurd outcome" in law requires some notion of the statute’s purpose. This feels like a paradox: textualism seems to rely on purposivism to define its own boundaries. The Holy Trinity case she mentioned perfectly illustrates this tension—Scalia hated it, but it shows how purpose inevitably creeps in. 

  I wonder if there’s a way to salvage textualism here. Maybe distinguishing between using purpose to flag problems (okay) versus rewriting text (not okay)? But that feels slippery. The engineer’s analogy might accidentally support moderate purposivism, where purpose informs interpretation but doesn’t override clear text. 

  Beyond the sister-in-law’s points, I’m thinking about other disanalogies. Like, code has no "downstream reliance" in the way laws do—citizens build lives around statutory interpretations. Also, legislative history exists (unlike dev intent in uncommented code), even if textualists dismiss it. 

  For a better analogy, maybe an API contract? It’s a documented interface with versioning, where changes break clients. That captures reliance and formal amendments better than legacy code. But even then, API docs often include intended use, blurring the text/purpose line again. 

  Verdict: The sister-in-law’s objections are mostly valid. The analogy oversimplifies law by ignoring interpretation’s human element and the legislature’s ongoing role. Most damagingly, the "bug" critique shows textualism can’t escape purpose entirely. The engineer’s argument lands weakly—it’s a vivid metaphor but leaks at key joints. A better approach might be a textualism that admits purpose as a boundary-check, not a tool for rewriting. Or just concede that law isn’t code... but that’s less fun at dinner parties.
answer: |-
  Here's a full audit of your analogy, structured as requested, with a clear verdict:

  ### The Analogy Correspondence Table
  | **Software Engineering Concept** | **Statutory Interpretation Concept** |
  |----------------------------------|--------------------------------------|
  | Legacy Codebase                  | Statute                              |
  | Original Developer Team          | Legislature                          |
  | Maintenance Engineer             | Judge                                |
  | Program Behavior                 | Statutory Meaning                    |
  | Code Comments/Documentation      | Legislative History                  |
  | "Bug" (Unintended Behavior)      | Absurd/Obsolete Result               |
  | Patch/Code Fix                   | Legislative Amendment                |
  | Self-Executing Code Output       | Plain Meaning of Text                |
  | API Specification                | Statutory Purpose                    |

  ---

  ### Assessment of Sister-in-Law's Objections

  1. **"Self-Executing" vs. Interpreted Texts**  
     - **Her Point**: Code produces deterministic outputs; statutes require human interpretation by citizens/agencies.  
     - **Assessment**: **Strong disanalogy**.  
       - *Why it bruises the analogy*: Code executes in a closed system; statutes operate in open-ended social contexts where meaning is contested (e.g., "labor or service" in *Holy Trinity*).  
       - *Impact on textualism*: Undermines your core premise. Textualism still argues for objective meaning, but concedes interpretation is inevitable—making "plain text" less like machine code than you suggested.  

  2. **The Legislature Isn't "Dead"**  
     - **Her Point**: Legislatures can respond to judicial interpretations; departed developers cannot.  
     - **Assessment**: **Valid disanalogy, but partial**.  
       - *Why it bruises*: Legislatures *can* amend statutes (like patching), but political gridlock often makes this impractical (unlike your unilateral bug fixes).  
       - *Impact on textualism*: Weakens the urgency of judicial restraint. If amendments are unlikely (e.g., partisan deadlock), textualism risks perpetuating absurdities—making "wait for a patch" unrealistic.  

  3. **"Bug" Identification Requires Purpose**  
     - **Her Point**: You identify bugs *because* you know the program’s purpose; thus, "absurdity" presupposes statutory purpose.  
     - **Assessment**: **Potentially devastating, but salvageable**.  
       - *The Twist*: Yes, calling behavior a "bug" implies deviation from intended function (e.g., a login screen shouldn’t crash). Similarly, labeling a result "absurd" assumes the statute has a purpose.  
       - **Textualist Rejoinder**:  
         - Distinguish **purpose-at-boundaries** (identifying absurdity) from **purpose-as-license** (rewriting text). Textualists use purpose only to resolve ambiguity, not override text (Scalia: "A text should not be construed strictly or leniently; it should be construed reasonably").  
         - *Holy Trinity* counter: Textualists argue the Court ignored clear text ("any kind") and invented exceptions. Your analogy *could* support textualism if "bug" = outcome violating *minimal* purpose (e.g., "This statute regulates labor contracts; hiring a priest isn’t labor").  
       - *Risk*: If "absurdity" expands, it becomes purposivism in disguise.  

  ---

  ### Critical Disanalogies Beyond Her Objections
  1. **Downstream Reliance**  
     - Code: Only your team relies on behavior.  
     - Statutes: Millions plan lives around interpretations (e.g., agencies enforcing regulations for decades). Silent "fixes" by judges disrupt settled expectations. Favors textualism but with caution for *stare decisis*.  

  2. **Ambiguity as Feature, Not Bug**  
     - Code: Ambiguity is always undesirable.  
     - Statutes: Ambiguity may be intentional (compromise language to pass bills). Textualists must still grapple with vagueness.  

  3. **"Documentation" Exists**  
     - Code: No comments = no intent clues.  
     - Statutes: Legislative history exists (committees, debates). Textualists reject it as unreliable; your analogy supports this stance.  

  ---

  ### A Better Analogy: **Public API with Strict Versioning**
  - **Why it fits**:  
    - A public API defines a contract; consumers (like citizens) rely on documented behavior.  
    - Maintainers can’t break existing implementations (no silent "fixes").  
    - "Bugs" must be resolved via new versions (amendments) or explicit deprecation warnings.  
    - Purpose is captured in the API spec—courts can reference it *only if the text is ambiguous*, not override endpoints.  
  - **Limitation**: Still assumes a "spec" (purpose) exists.  

  ---

  ### Verdict: Where Your Argument Lands
  1. **Strengths of Your Analogy**:  
     - Effectively highlights the risks of judicial lawmaking.  
     - Supports textualism’s core tenet: text > subjective intent.  

  2. **Fatal Flaws Exposed**:  
     - The "bug identification requires purpose" objection **partially reframes your analogy toward moderate purposivism**. You *need* purpose to define absurdity.  
     - Legislatures’ responsiveness is overstated in your analogy; courts often *must* act.  
     - Statutory text is inherently interpretive—unlike deterministic code.  

  3. **Verdict**: **Your analogy bruises textualism but doesn’t break it**. It works best as a caution against *strong purposivism* (where judges "rewrite code"), but fails to support *strict textualism* (where purpose is irrelevant). The optimal middle ground:  
     - **Textualism anchored by minimal purpose**: Use purpose only to:  
       (a) Resolve ambiguity,  
       (b) Avoid outcomes *no reasonable legislature* would intend (e.g., applying a "no vehicles in the park" statute to ambulances).  
     - **Your sister-in-law wins on nuance**, but your core concern about judicial overreach remains valid.  

  **Final Score**: Analogy 60% effective. Upgrade to the API-contract analogy for tighter reasoning at next year’s dinner.
