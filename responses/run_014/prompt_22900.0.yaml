  The circularity issue comes up when we say the right reason is that the action is right. How does one know it's right without already having moral knowledge? It seems like bootstrapping. For example, if someone asks why helping others is right, saying "because it's right" doesn't explain. This might lead to an infinite regress or require some foundational moral intuition. Emphasizing moral education or virtue development could help, but the core problem remains.

