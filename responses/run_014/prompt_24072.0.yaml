  I'm working through a sustained disagreement about the Sleeping Beauty problem, and a halfer keeps closing out my arguments with the one-liner "It's a fair coin, so the probability is 1/2." I can't say precisely what he thinks that sentence is doing, and I suspect it is doing different work at different moments in the conversation. Could you lay out, as a menu rather than a single explanation, the distinct precise claims that line could be standing for, ranging from the trivial to the substantive? For each reading, say whether it is a platitude, a substantive and defensible thesis, or actually false, and identify which reading the halfer is most likely invoking when he deploys the line to shut down the thirder's 1/3. The part I care about most is the Bayesian reading, so please make it exact: state the likelihoods explicitly — what is the probability of the relevant evidence, being awake or being in this particular awakening, under Heads versus under Tails — and locate the precise point at which the halfer's and the thirder's arguments diverge, whether that is in the likelihood ratio, in the choice of reference class, or somewhere else. I am not after a restatement that one side says 1/2 and the other says 1/3; I want the precise claim each is making and the exact seam where they come apart, because I intend to bring this analysis to the next round of the debate and precision matters more to me than breadth.
