prompt: |-
  I'm a type theory person by trade, so the world I live in is types, terms, typing judgments, the simply-typed and untyped lambda calculi, impredicativity, strong normalizaton, proof assistants, that whole thing. I'm honestly pretty out of my depth when it comes to set-theoretic foundations. Could you restate the whole Russell's-paradox story for me in the vocabulary I actually use? I mean the the real thing: the comprehension schema, the Russell set R = {x : x ∉ x} and the R ∈ R ↔ R ∉ R contradiction, how ZFC gets out of it with the separation schema and by not having a universal set, and then the parallel on the type side where the untyped lambda calculus lets you write self-applicative terms like (λx. x x), where positing a type of all types gets you a Russell-style paradox (what people call Girard's paradox), and where simple type theory or stratification is the fix. Then I want the residue report: which parts of the set-theoretic story carry over into type theory cleanly, which parts you had to distort to make them fit, and which parts have no expression in my vocabulary at all. And give me your read on whether the residue is a real limit of the type-theoretic framework or a sign that the set-theoretic point was foggier than it looks. Two specific things I'm hung up on. One: is the set-theoretic paradox, which is about a set being forced into existence that can't coherently exist, really the same kind of failure as the type-theoretic one, which is about a term that can't be well-typed or that doesn't normalize, or am I conflating two different things? Two: is there any clean counterpart in type theory for the set-theoretic notion of a proper class, like the class of all sets existing even though the set of all sets doesn't? Please don't give me a reading list or citations, I'll chase my own sources, I just want the argument laid out. And one formatting ask: no headings, no bullet points, no bold, no tables, just continuous prose like a long email, because I'm reading this on my phone.
