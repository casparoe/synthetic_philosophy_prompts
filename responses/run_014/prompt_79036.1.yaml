answer: |-
  Here is the exam question, model answer, and marking scheme as requested:

  **Exam Question (as it would appear on the paper):**

  **(Question 1: 30 marks)**
  "Hyperbolic discounting models are often invoked to explain akrasia (weakness of will). Using the distinction between *structural akrasia* (time-inconsistent preferences leading to future preference reversal) and *executive akrasia* (acting against one's own stable, occurrent best judgment), critically evaluate this claim.

  1.  Does hyperbolic discounting genuinely explain structural akrasia, executive akrasia, both, or neither? Justify your answer.
  2.  Does modelling an agent as a series of time-slices, each with its own discount rate and preferences, *explain* executive akrasia or *eliminate* the phenomenon by redefinition? Explain your reasoning.
  3.  Consider the proposal that the akratic agent discounts not the value of future *goods*, but the authority of their own future *judgments* about those goods. Does this offer a genuine solution for explaining executive akrasia within a discounting framework, or is it merely a redescription? If it is a solution, what conceptual cost does it incur?

  Avoid mere survey; commit to specific positions and defend them."

  ---

  **Model Answer (Approx. 700 words):**

  Hyperbolic discounting, where the discount rate applied to future rewards decreases hyperbolically over time, is a powerful model for explaining certain preference reversals. However, its capacity to explain akrasia depends critically on distinguishing structural from executive akrasia. I argue that hyperbolic discounting genuinely explains *structural* akrasia but fundamentally fails to capture *executive* akrasia. Modelling agents as time-slices eliminates executive akrasia by redefinition, and recasting discounting as applying to future judgments, while illuminating, remains a redescription that fails to solve the core problem of executive failure and incurs significant normative costs.

  **(1) Structural vs. Executive Akrasia & Hyperbolic Discounting:** Hyperbolic discounting provides a robust explanation for *structural akrasia*. Here, the agent genuinely prefers indulgence (e.g., smoking) when temporally distant rewards (e.g., health) are steeply discounted in the immediate future, but prefers restraint when both options are distant and discounted more moderately. At t=9 (days before), health is valued more than the fleeting pleasure of a cigarette (Prefer A). As t approaches the moment of choice (t=5, then t=0), the imminent pleasure is discounted less severely than the distant health benefit, flipping the preference (Prefer B at t=5 wins). This *is* a form of akrasia – acting against a past resolution or considered preference – but it arises from dynamically changing preferences driven by discounting mechanics. There is no single, stable preference ranking being violated *over time*; instead, preferences are time-inconsistent. Crucially, hyperbolic discounting *cannot* explain *executive akrasia*. Executive akrasia occurs when, *at the very moment of action* (t=0), the agent holds a stable, occurrent judgment that action X is best all-things-considered, yet still performs the akratic action Y. Hyperbolic discounting, by definition, implies that at t=0, the agent *actually prefers* the immediately available reward (Y). The discount rate dictates their present preference. If they judge X best but choose Y, this judgment/preference gap *cannot* be accounted for by the discount rate itself; the discounting model predicts their choice aligns with their *present* discounted preference. The "weakness" lies not in changing valuations, but in failing to act on a *current* evaluation.

  **(2) Time-Slices and Executive Akrasia:** Modelling the agent as a series of time-slices, each with its own preferences dictated by hyperbolic discounting, *eliminates* executive akrasia by redefinition rather than explaining it. In this model, "the agent at t=0" simply *is* a time-slice with the preferences generated by the hyperbolic discount function at t=0. If this time-slice prefers and chooses the immediate gratification (Y), it is acting perfectly rationally according to *its* preferences. There is no "self" unified over time that fails to execute a judgment held *now*. The judgment "I should do X" made by the t=0 time-slice, if genuine, *must* reflect its all-things-considered preference. If it utters "I should do X" but chooses Y, this model can only interpret the utterance as either insincere, mistaken about its own preferences, or reflecting some other conflicting preference within the same time-slice. The phenomenon of judging X best *now* and *still* (knowingly, intentionally) choosing Y *now* disappears; it becomes a case of mistaken self-knowledge, ambivalence, or a different preference structure within the slice, not a failure of will to act on a stable, occurrent best judgment.

  **(3) Discounting Future Judgments: Redescription, not Solution:** The proposal that the akratic discounts the authority of their *future judgments* rather than the future *goods* offers insight but is ultimately a redescription that fails to salvage an explanation for executive akrasia within discounting and incurs a cost. Suppose at t=0, I judge I should go to the gym (X) but choose to watch TV (Y). The suggestion is I distrust my *later* judgment (e.g., at t=1 hour, post-gym) that the workout was worthwhile. While this might explain *why* my *present* discounting of the future good is so steep, it doesn't address the core issue of executive akrasia. *At t=0*, I still hold the judgment that X is best *all-things-considered, now*. Discounting my *future* endorsement doesn't explain why I act against my *current* best judgment. It simply redescribes the high discount rate applied to the future good *as* a distrust of future judgments about that good. The executive failure – acting against *this* judgment, *now* – remains unaccounted for. Furthermore, this reframing incurs a significant conceptual cost: it undermines the normative force of diachronic planning and rational agency. If I systematically distrust my future judgments, rational long-term planning becomes impossible, and the very notion of a temporally extended agent making commitments dissolves into permanent present skepticism. It solves nothing about the synchronic failure while crippling diachronic rationality.

  In conclusion, hyperbolic discounting excels at explaining structural akrasia through time-inconsistent preferences but is structurally incapable of capturing executive akrasia – the failure to act on a stable, occurrent judgment. Time-slice models dissolve executive akrasia, and discounting future judgments is a provocative redescription that fails to explain the synchronic failure of executive control and damages the foundations of rational agency over time.

  ---

  **Marking Scheme (30 marks total):**

  1.  **Clear Distinction & Application (8 marks):** Accurately defines and distinguishes structural vs. executive akrasia; correctly identifies hyperbolic discounting as explaining structural but *not* executive akrasia.
      *   *Weak Answer Muff:* Conflates the two types of akrasia; claims HD explains both or fails to justify why it doesn't explain executive akrasia.
  2.  **Time-Slice Model Analysis (7 marks):** Correctly argues that the time-slice model *eliminates* executive akrasia by redefining the agent at the moment of choice, rather than explaining it.
      *   *Weak Answer Muff:* Claims the model explains executive akrasia; fails to see how it redefines the agent/phenomenon away.
  3.  **Future Judgments Proposal Evaluation (7 marks):** Critically evaluates the "discounting future judgments" idea, arguing it is a redescription of the discounting problem (not a fix for executive akrasia) and identifies the conceptual cost (undermining diachronic rationality/planning).
      *   *Weak Answer Muff:* Accepts it uncritically as a solution; fails to see it doesn't address the synchronic judgment/action gap or identify the cost.
  4.  **Commitment & Argumentation (5 marks):** Takes clear, defensible positions throughout; avoids mere description/survey; provides reasoned justifications.
      *   *Weak Answer Muff:** Waffles or is non-committal; lists possibilities without arguing for specific conclusions; overly descriptive.
  5.  **Coherence & Structure (3 marks):** Answer is well-organized, logically structured, clearly written, and stays focused on the question.
      *   *Weak Answer Muff:** Disorganized, unclear, rambling, or significantly off-topic.

  **Total: 8 + 7 + 7 + 5 + 3 = 30 marks.**
