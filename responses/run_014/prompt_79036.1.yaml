  Build the question so they have to say which of the two akrasias, if either, hyperbolic discounting genuinely explains; whether modelling her as a run of time-slices each with its own preferences explains executive akrasia or quietly makes it disappear; and whether recasting the discount as falling on future judgements rather than future goods is a real fix or just a redescription — and if it's a fix, what it costs. Push them to commit, rather than survey.

