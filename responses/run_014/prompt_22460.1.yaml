prompt: |-
  I'm on my company's data platform council, which is basically the group that gets poked whenever two teams can't agree on what a metric or a field means and it's started causing real problems. Right now we've got a dispute that's been going on for like two months. The growth team reports "active users" to the execs as anyone who's logged in in the last 30 days. The product team reports "active users" as anyone who's done a specific core action (posted a comment, in our case) in the last 30 days. The two numbers are wildly different, the execs are confused, and both teams are now a little defensive about "their" number.

  Here's where I get stuck and I'd love a second brain on it. I keep going back and forth on whether this is actually a disagreement at all, or whether the two teams just agreed on every single fact (who logged in, who posted, when) and are only "disagreeing" because we've let the same label do two different jobs. I half suspect there's no fact of the matter that could settle it — no way to look at the world and find out wich team's "active user" is the real one — but I also worry that if I just declare it a wording problem and force a rename, I'll be papering over something that actually matters for how the execs should think about the business, seperate from the metric itself.

  Can you draft the written opinion I'll circulate to the council before next week's vote? I need it to land on a concrete recommendation (pick a definition, split into two named metrics, whatever you think is right) with the reasoning, and I really want it to steelman the case for the option you *don't* pick, because the growth lead is going to push back hard and I don't want to look like I didn't consider her point.
reasoning: |-
  Okay, the user is part of a data platform council dealing with a dispute between the growth and product teams about the definition of "active users." The growth team defines it as anyone who logged in within the last 30 days, while the product team defines it as users who performed a core action (like posting a comment) in that period. This has caused confusion among executives because the numbers differ significantly. 

  The user is struggling with whether this is a factual disagreement or just a labeling issue. They suspect there might not be a "real" definition to uncover but worry that simply renaming the metrics could overlook deeper implications for how the business should be understood. They need a written opinion for the council that includes a concrete recommendation and a strong counterargument, especially since the growth lead is likely to push back.

  First, I need to validate the user's insight. They're spot on—this isn't about data disagreements but about the term "active user" being overloaded. Both teams have valid but different interpretations that serve distinct purposes. The growth team's login metric tracks potential engagement and reach, important for top-of-funnel analysis. The product team's core-action metric measures deep engagement, crucial for assessing product value and retention. 

  The user's deeper concern is about how executives interpret these numbers. If they see conflicting reports under the same name, it erodes trust in data overall. The solution isn't just renaming but structuring metrics to prevent future confusion. Splitting into two clearly named metrics makes sense, as it honors both use cases while adding clarity. 

  For the growth lead's counterargument: She might argue that logins are a universal baseline and that core actions are too narrow for company-wide reporting. She'd emphasize that executives need a single health metric, and logins are more inclusive for growth tracking. This needs to be presented fairly in the draft. 

  The recommendation should include not just renaming but also context for executives—explaining when to use which metric. That addresses the user's worry about "papering over" deeper issues. Adding a glossary and governance rules would prevent repeat conflicts, showing proactive leadership. 

  Finally, the tone should be diplomatic, focusing on shared goals. The user wants to unite the council, so framing this as an upgrade to data culture—not picking sides—will help it land well.
answer: |-
  Here’s a draft opinion for your council that addresses the core conflict, validates both perspectives, and lands on a concrete recommendation with steelmanned counterarguments:

  ---

  **TO:** Data Platform Council  
  **FROM:** [Your Name/Title]  
  **SUBJECT:** Resolution Proposal: "Active User" Definition & Metric Governance  
  **DATE:** [Current Date]  

  ### Background
  The prolonged dispute between Growth and Product teams regarding the definition of "Active User" stems from both teams using the same term to represent **fundamentally distinct concepts**:  
  - **Growth Team**: Defines "Active User" as *any user who logged in within the last 30 days*.  
  - **Product Team**: Defines "Active User" as *any user who performed a core action (e.g., posted a comment) within the last 30 days*.  

  Both definitions are factually accurate and technically sound—but they answer different questions. The resulting discrepancy in reported numbers has created executive confusion and inter-team friction.  

  ### Core Issue: A Labeling Problem, Not a Data Disagreement  
  After thorough review, I conclude this is **not a factual dispute** (both teams agree on raw login/core-action data). It’s a case of **terminological overload**: one label ("Active User") being stretched to serve two distinct analytical purposes:  
  1. **Audience Reach** (Growth): Measuring potential user base size and top-of-funnel engagement.  
  2. **Core Value Delivery** (Product): Measuring deep product adoption and value realization.  

  Neither definition is "wrong," but conflating them under one name creates ambiguity that undermines data trust.  

  ---

  ### Recommendation: Split into Two Standardized Metrics  
  I propose we **retire the ambiguous term "Active User"** and replace it with two clearly defined metrics:  
  1. **`30d Logged-In Users`**  
     - *Definition:* Distinct users who logged in ≥1 time in the last 30 days.  
     - *Ownership:* Growth Team (aligned with acquisition/retention goals).  
  2. **`30d Core-Active Users`**  
     - *Definition:* Distinct users who performed [specific core action, e.g., "posted a comment"] ≥1 time in the last 30 days.  
     - *Ownership:* Product Team (aligned with value-delivery goals).  

  #### Why This Solves the Problem:  
  - **Clarity for Executives**: Eliminates confusion by decoupling "audience size" from "value delivery."  
  - **Preserves Both Use Cases**: Both teams retain metrics critical to their missions.  
  - **Scalability**: Prevents future conflicts by assigning explicit ownership.  
  - **Data Trust**: Ensures reports reflect consistent definitions.  

  ---

  ### Steelmanned Counterargument: The Case for a Single "Active User" Metric (Growth Perspective)  
  *[Presented as the Growth Lead might argue it—without endorsement]*:  

  > *"A single 'Active User' metric is essential for executive reporting. Logins are the universal baseline for engagement—they’re measurable, unambiguous, and inclusive. Defining activity by core actions (like commenting) excludes lurkers, new users, or those in passive roles, misrepresenting our true active base. Core actions change over time (e.g., new features), making historical comparisons unreliable. If executives see two 'active user' numbers, they’ll distrust *all* data. Growth needs a single North Star metric to track ecosystem health, and logins are that foundation. Product can report 'Core-Active Users' separately, but 'Active Users' must remain logins for company-wide consistency."*  

  #### Acknowledging Valid Concerns:  
  - **Simplicity**: Executives *do* benefit from standardized KPIs.  
  - **Inclusivity**: Logins capture early-stage users core actions might miss.  
  - **Stability**: Core actions *can* evolve, though this is manageable with governance.  

  ---

  ### Why Splitting Metrics is Superior to Picking One Definition  
  Adopting **only one definition** (e.g., mandating logins for everyone) would:  
  - **Invalidate Product’s Needs**: Core actions are the best indicator of product-market fit. Ignoring this risks misaligned priorities.  
  - **Obfuscate Business Health**: A login-only metric masks whether users derive value—a critical strategic insight.  
  - **Perpetuate Tribal Conflict**: Forcing either team to abandon their operational metric breeds resentment.  

  Renaming is **not "papering over"** the issue—it’s explicitly recognizing that both behaviors matter, but answer fundamentally different questions.  

  ---

  ### Implementation Plan  
  1. **Formalize Definitions**: Document `30d Logged-In Users` and `30d Core-Active Users` in the company’s data dictionary.  
  2. **Executive Briefing**: Explain *why* these metrics differ and when each should be used (e.g., Growth for audience trends, Product for feature impact).  
  3. **Governance Rule**: Require all future metrics to be semantically unambiguous (e.g., "Active" must specify the action).  
  4. **Timeline**: Enforce new terminology in all reports starting [Date].  

  ---

  ### Final Note  
  This dispute reveals a broader need: **semantic rigor** in our data culture. By resolving this split, we prevent future conflicts and empower teams to use data precisely—not defensively. I urge the council to endorse this solution.  

  **Vote Recommendation:** Approve splitting "Active User" into `30d Logged-In Users` and `30d Core-Active Users`.  

  --- 

  **Why this works for your goals:**  
  - **Concrete Outcome**: Forces a clear decision (split metrics + rename).  
  - **Steelmanned Opposition**: Growth’s perspective is presented fairly but neutrally.  
  - **Addresses Your Worry**: By framing core actions as "value delivery," it shows execs *why* both metrics matter strategically.  
  - **Tone**: Avoids blame, focuses on systemic improvement.  

  **Before circulating:**  
  - Slot in your company’s core action (e.g., "posted a comment").  
  - Add a line about who will update dashboards/reports (e.g., "Data Platform to migrate existing reports").  
  - If Growth’s login metric is used in board reports, note that explicitly.  

  This positions you as the solution-broker who elevated the conversation beyond tribal conflict. Good luck!
