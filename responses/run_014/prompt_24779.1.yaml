  The essay question needs to force diagnostic work. I'll structure it to demand reconstruction of the argument from KK, ENT, and a minimal closure-like step (not full CL), then require analysis of how bootstrapping exploits this to produce absurdity. Students must pick which ingredient to reject and justify why the other two hold up better, including what's owed in reply.

  For the model answer, I'll take the position that KK should be rejected. The key move is showing how bootstrapping uses KK to "ratchet up" unjustified confidence—like the thermometer case where each "confirmation" step relies on KK to turn a weak initial state into strong knowledge. This makes KK the enabler of bootstrapping, while ENT might be defensible if restricted, and CL isn't directly attacked. Rejecting KK costs us the idea that knowledge is always transparent, which is significant but less damaging than alternatives. 

