  Rhyme scheme has to be tight: ABA for tercets, AA in quatrain. Using "frame/machine/pain" etc. keeps it musical. "Catalytic gear" nods to enzymes without jargon. "Misread pain" ties to biology (e.g., misfolded proteins) but also emotional weight for fiction. 

  User’s deeper need? They’re using poetry to crystallize a theme they’ve orbited for a whole novel. This isn’t just decoration—it’s the core idea made visceral. The poem must feel inevitable, like the novel’s DNA demanded it. And it must haunt, not teach. 

