prompt: |-
  ok so im TAing a third-year class on social norms and stuff and my prof dumped the convention week on me becuase shes travelling. i need a 45-min in-class essay prompt on Lewis-style conventions plus how norms can evolve without anyone agreeing to them, something that actually forces them to apply the ideas instead of just repeating definitions.

  can you make up two little campus cases for them to work through? like one where grad students leave the seminar room door half-open vs fully closed to signal if the room is free for drop-ins, where everyone goes along mainly since they expect everyone else to read it that way and theyre fine with it as long as others are, and there was another equally workable signal that just never caught on. and a second one where everyone chips in five bucks for the end of term party even though most would realy rather free-ride and only pay to avoid gossip.

  the essay should make them say which one counts as a Lewisian convention and why, using the bits about conditional preference, mutual expectations, arbitrariness / another equilibrium being possible, and precedent without explicit deal-making, plus sketch how trial-and-error and copying success could get the first one going from scratch and why that story doesnt fit the second one.

  throw in a model answer around 600 words i can calibrate off, and a marking guide out of 25 that breaks down the points, spells out what seperates an A answer that nails the crux from a B answer that just lists labels, and flags the two or three classic blunders that should lose marks.
reasoning: |-
  We are creating an in-class essay prompt for a 45-minute exercise. The topic is Lewis-style conventions and how norms can evolve without explicit agreement. We'll use two campus cases:

  Case 1: Grad students leaving the seminar room door half-open to signal the room is free for drop-ins. The key elements are:
     - Everyone expects others to interpret the signal that way.
     - There was an alternative (e.g., fully closed) that could have been used but didn't catch on.
     - It's arbitrary and self-sustaining because everyone is fine with it as long as others follow.

  Case 2: Everyone chips in $5 for an end-of-term party. Here:
     - Most would prefer to free-ride but contribute to avoid gossip (social sanction).
     - This is not arbitrary in the same way because the alternative (not contributing) is not an equally good equilibrium due to the risk of gossip.

  The essay prompt should ask students to:
     - Identify which case is a Lewisian convention and why.
     - Use the concepts: conditional preference, mutual expectations, arbitrariness (another equilibrium possible), precedent without explicit deal-making.
     - Explain how the first convention could have evolved through trial-and-error and copying success (a learning dynamic) and why that story doesn't fit the second case.

  We'll also provide:
     - A model answer (about 600 words)
     - A marking guide out of 25, with breakdown, differentiation between A and B answers, and common blunders.

  Let's structure the prompt and then the model answer.

  ### Essay Prompt

  **Prompt:**
  In this essay, you will analyze two campus scenarios using David Lewis's theory of conventions. 

  **Scenario 1: The Seminar Room Door**
  Graduate students in the sociology department have developed a practice regarding the use of a seminar room for drop-in discussions. When the room is free and available for drop-ins, the person leaving the room leaves the door half-open. If the room is occupied or not available, the door is fully closed. Everyone in the department follows this practice because they expect others to interpret the door position in this way and they are content with it as long as others do the same. There was an alternative practice that was initially considered (leaving the door fully open to signal availability) but it did not catch on. The current practice has become established without any formal agreement.

  **Scenario 2: The End-of-Term Party Fund**
  At the end of each term, the psychology department throws a party. It is expected that every graduate student in the program contributes $5 towards the party. Most students would prefer to free-ride (i.e., not contribute and still attend the party) but they contribute because they fear being the subject of gossip and social disapproval if they don't. There is no formal penalty for non-contribution, but the social pressure is effective. This practice has also emerged without any formal agreement.

  **Your Task:**
  1. Explain which of these scenarios fits David Lewis's definition of a convention and which does not. Use Lewis's key elements: conditional preferences, mutual expectations, arbitrariness (the existence of another possible equilibrium), and the role of precedent without explicit agreement.
  2. For the scenario that is a Lewisian convention, sketch a plausible process of how it could have evolved from scratch through trial-and-error and copying successful behavior. Explain why such a process would not fit the other scenario.

  Your essay should be concise and directly address the questions. Aim for about 500-600 words.

  ---

  ### Model Answer (Approx. 600 words)

  **Introduction**
  David Lewis, in his book *Convention*, defines a convention as a solution to a recurrent coordination problem that emerges without explicit agreement. It is characterized by conditional preferences, mutual expectations, arbitrariness (meaning another equilibrium could have served equally well), and the role of precedent. This essay argues that Scenario 1 (the seminar room door) is a Lewisian convention, while Scenario 2 (the party fund) is not, and explains the evolutionary process for the former.

  **Scenario 1 as a Lewisian Convention**
  The seminar room door scenario fits Lewis's definition. First, it solves a coordination problem: students need to know when the room is available without constant checking. The practice of leaving the door half-open coordinates their behavior. 

  - **Conditional Preferences**: Each student prefers to leave the door half-open (or closed) only if they expect others to interpret it correctly and act accordingly. If others did not follow, the student would be indifferent or even prefer an alternative because the signal would fail.
  - **Mutual Expectations**: Everyone expects others to follow the practice and to interpret the door position in the same way. This expectation is common knowledge: I follow because I expect you to follow, and you follow because you expect me to follow.
  - **Arbitrariness**: The practice is arbitrary because another signal (like leaving the door fully open) could have worked just as well. The fact that the alternative didn't catch on doesn't mean it was inferior; it simply didn't become the focal point.
  - **Precedent without Agreement**: The practice likely emerged from repeated interactions. Initially, someone might have left the door half-open by accident, and others copied it when it worked. Over time, it became a precedent without any formal discussion.

  **Scenario 2 as a Non-Convention**
  In contrast, the party fund scenario is not a convention. It solves a collective action problem (free-riding) rather than a coordination problem. 

  - **Conditional Preferences**: Here, a student contributes not because they conditionally prefer to contribute if others do (though they might), but because they fear social sanctions. Even if others contribute, they would prefer to free-ride if they could avoid the gossip. The preference is not conditional on others' cooperation in the same way as in coordination; it's driven by the threat of sanction.
  - **Arbitrariness**: The solution is not arbitrary. There is no equally good alternative equilibrium where no one contributes because then the party wouldn't happen and everyone would be worse off. The current state (everyone contributes) is maintained by sanctions, not because an alternative (e.g., contributing $3) would have been just as good without sanctions.
  - **Mutual Expectations**: While there are expectations (that others will contribute and that non-contribution leads to gossip), these expectations are about punishment, not about coordinating on an arbitrary signal.

  **Evolution of the Convention in Scenario 1**
  The door convention could evolve from scratch through a process of trial-and-error and copying. Initially, without a signal, students might have tried various ways to indicate room availability (e.g., leaving a note, adjusting the door). Suppose one day, a student leaves the door half-open because they are in a hurry. Another student sees the half-open door and interprets it as availability (by chance) and uses the room. This successful interaction is observed and copied. Over time, as more students adopt the half-open door because it worked before, it becomes a precedent. The alternative (fully open) might have been tried by someone but didn't get copied as much because, by chance, the half-open door was used first and became salient. This process is driven by learning and does not require any agreement.

  **Why Scenario 2 Doesn't Fit This Process**
  The party fund could not emerge this way. Trial-and-error in contributing would not lead to universal contribution without sanctions. If one student contributes and others don't, the contributor might feel cheated and stop. Without gossip (the sanction), the contribution would collapse. The norm here is sustained by punishment, not by the self-reinforcing expectations of a coordination equilibrium.

  **Conclusion**
  Only Scenario 1 is a Lewisian convention because it meets all criteria: conditional preferences, mutual expectations, arbitrariness, and precedent without agreement. Scenario 2 is a social norm enforced by sanctions, not a convention. The evolutionary story of trial-and-error fits Scenario 1 but not Scenario 2.

  ---

  ### Marking Guide (Total: 25 points)

  **Breakdown:**
  1. **Identification and Explanation of Lewisian Convention (10 points)**
     - Correctly identifies Scenario 1 as the convention and Scenario 2 as not. (2 points)
     - For Scenario 1: Explains conditional preferences (2), mutual expectations (2), arbitrariness (2), and precedent without agreement (2). (Total 8 points)

  2. **Contrasting Scenario 2 (6 points)**
     - Explains why Scenario 2 is not a convention: focuses on it being a collective action problem (2), the role of sanctions (2), and lack of arbitrariness (2). (Total 6 points)

  3. **Evolutionary Process for Scenario 1 (6 points)**
     - Sketch of trial-and-error and copying: plausibly describes how the convention could start by chance and spread by imitation (4 points).
     - Explains why the alternative signal didn't catch on (e.g., path dependence, focal point) (2 points).

  4. **Why the Evolutionary Process Doesn't Fit Scenario 2 (3 points)**
     - Clear explanation that Scenario 2 requires sanctions and cannot be sustained by imitation alone (3 points).

  **Differentiation:**
  - **A Answer (21-25 points)**: Nails the crux by explaining the difference between coordination and collective action problems. Shows deep understanding of Lewis's criteria and applies them precisely. The evolutionary story is coherent and highlights the self-reinforcing nature of conventions vs. the enforcement mechanism in norms. Writing is clear and concise.
    
  - **B Answer (16-20 points)**: Correctly identifies the convention and lists Lewis's criteria but may not fully explain the application (e.g., mentions conditional preference but doesn't specify how it applies). The evolutionary story is present but might be vague. The contrast for Scenario 2 is somewhat superficial (e.g., just says "because of gossip" without linking to the lack of arbitrariness). 

  **Common Blunders (deduct accordingly):**
  1. **Misidentifying the convention** (e.g., saying both are conventions, or that Scenario 2 is the convention) - lose up to 5 points for part 1.
  2. **Confusing coordination with collective action** - e.g., treating Scenario 2 as a coordination problem. This is a major conceptual error - lose up to 5 points for part 2.
  3. **Ignoring arbitrariness** - Failing to discuss that another equilibrium (alternative signal) was possible in Scenario 1 but not in Scenario 2. This is a key part of Lewis's definition - lose 2-3 points.
  4. **Overlooking the evolutionary process** - Not providing a trial-and-error story for Scenario 1 or not contrasting it with Scenario 2 - lose points in parts 3 and 4.

  **Note**: Markers should reward clarity and precision. Word count is a guide; quality over quantity.
answer: |-
  ### In-Class Essay Prompt: Lewisian Conventions and Norm Evolution  
  **Time Allotment:** 45 minutes  
  **Word Guide:** Aim for 500–600 words.  

  ---

  #### Scenarios for Analysis:  
  **Scenario 1: The Seminar Room Door**  
  Graduate students use a seminar room for drop-in discussions. Over time, they develop an unwritten rule:  
  - If the room is **free for drop-ins**, the last person to leave props the door **half-open**.  
  - If it’s **occupied or unavailable**, the door is **fully closed**.  
  Everyone follows this because they expect others to interpret it this way. They’re content as long as others comply. An alternative (e.g., leaving the door **fully open** to signal availability) was equally feasible but never caught on. No one ever formally agreed to this system.  

  **Scenario 2: The End-of-Term Party Fund**  
  Before the department’s end-of-term party, graduate students are expected to chip in **$5 each** for snacks and drinks. Most would prefer to free-ride (not pay but still attend) but contribute anyway. The sole reason they pay is to avoid gossip or being labeled "cheap" by peers. No formal rules exist—only social pressure.  

  ---

  #### Essay Question:  
  Using David Lewis’s theory of conventions, analyze both scenarios:  
  1. **Identify which scenario qualifies as a Lewisian convention** and explain *why* using:  
     - **Conditional preferences** (e.g., "I prefer X only if others do Y"),  
     - **Mutual expectations** (e.g., "I expect others to do Z, and they expect me to do it too"),  
     - **Arbitrariness** (i.e., another equilibrium could have worked equally well),  
     - **Precedent without explicit agreements**.  
  2. **Explain why the other scenario is *not* a convention** using the same criteria.  
  3. **Sketch a process** for how trial-and-error and copying successful behavior could evolve **Scenario 1 from scratch**. Then, explain **why this process fails for Scenario 2**.  

  ---

  ### Model Answer (≈600 words)  
  **Scenario 1 (Seminar Door) is a Lewisian convention; Scenario 2 (Party Fund) is not.** Lewis defines conventions as arbitrary, self-sustaining solutions to coordination problems, emerging from precedent—not deals or sanctions.  

  **Why Scenario 1 Fits Lewis’s Criteria:**  
  - **Conditional Preferences**: Each student *prefers* to leave the door half-open *only if* they expect others to interpret it as "available." If others used a different signal (e.g., fully open), they’d switch to avoid confusion.  
  - **Mutual Expectations**: Everyone follows the rule because they expect others to follow and interpret it correctly. This creates **common knowledge**: "I use half-open because I expect you to, and you do because you expect me to."  
  - **Arbitrariness**: The half-open signal is arbitrary—a fully open door could have worked identically. Its dominance is accidental (like driving on the left vs. right). The alternative failed not because it was inferior, but because it lacked **focal point** status.  
  - **Precedent without Agreement**: No one decreed this rule. It likely emerged from random trials (e.g., someone left it half-open by accident; others copied when it worked). Once a few used it successfully, it spread via imitation.  

  **Why Scenario 2 Fails as a Convention:**  
  - **Conditional Preferences?** Students contribute $5 not because they *conditionally prefer* it, but to **avoid gossip** (a sanction). Even if others pay, they’d prefer to free-ride *if* gossip vanished.  
  - **Arbitrariness?** No—$5 isn’t arbitrary. A $3 equilibrium would collapse because free-riding temptations remain. Sanctions (gossip) enforce compliance, unlike in coordination.  
  - **Mutual Expectations?** Expectations here center on punishment ("I expect gossip if I don’t pay"), not mutual alignment. This resembles a **collective action problem** (like prisoner’s dilemmas), not coordination.  
  - **Precedent?** While it emerged without deals, it relies on enforcement (gossip), not self-reinforcing expectations.  

  **How Scenario 1 Could Evolve from Scratch:**  
  Initially, no door rule exists. Students face confusion: is the room free?  
  1. **Trial-and-error**: Student A accidentally leaves the door half-open after a meeting. Student B sees it, infers "available," and uses the room successfully.  
  2. **Copying success**: Student C observes B’s success and imitates the half-open signal. Others copy, noting it works better than alternatives (e.g., a fully open door tried once but ignored).  
  3. **Focal point**: Half-open becomes salient through precedent. Mutual expectations solidify: "We do this because others do, and it solves our problem."  
  The alternative (fully open) fades not due to logic but **path dependence**—the first functional signal stuck.  

  **Why This Process Fails for Scenario 2:**  
  Trial-and-error can’t sustain the party fund. If Student X pays $5 while others free-ride, X feels cheated and stops paying. Without sanctions, contributions collapse. Gossip acts as **external enforcement**, preventing free-riding. Imitation alone can’t fix this—unless punishment exists, free-riding is always tempting. Thus, Scenario 2 evolves via **sanction-driven norms**, not self-reinforcing conventions.  

  **Conclusion**:  
  Scenario 1 exemplifies Lewis: an arbitrary, precedent-based equilibrium sustained by conditional preferences and mutual expectations. Scenario 2 is a norm enforced by sanctions—solving collective action, not coordination.  

  ---

  ### Marking Guide (Total: 25 points)  
  **Breakdown:**  
  1. **Correct Identification** (3 pts):  
     - Scenario 1 = convention; Scenario 2 ≠ convention.  
     - *Deduct 3 pts if reversed or unclear.*  
  2. **Analysis of Scenario 1 as Convention** (8 pts):  
     - Conditional preferences (2), mutual expectations (2), arbitrariness (2), precedent without agreement (2).  
  3. **Analysis of Scenario 2 as Non-Convention** (6 pts):  
     - Conditional preferences absent (1), no arbitrariness (1), mutual expectations ≠ coordination (2), role of sanctions (2).  
  4. **Evolutionary Process for Scenario 1** (5 pts):  
     - Trial-and-error initiation (1), copying/imitation (2), path dependence/focal point (2).  
  5. **Contrast with Scenario 2** (3 pts):  
     - Explains why trial-and-error fails without sanctions (2), distinguishes coordination vs. enforcement (1).  

  **A (21–25) vs. B (16–20) Answers:**  
  - **A Answer**: Nails the **crux—coordination vs. collective action**. For Scenario 1, emphasizes *arbitrariness* (e.g., "fully open door could work") and *self-reinforcing expectations*. For Scenario 2, highlights *sanctions* as the engine. Evolutionary sketch shows path dependence, not rationality.  
  - **B Answer**: Lists labels ("conditional preferences!") but misses nuances. Superficially contrasts scenarios (e.g., "Scenario 2 has gossip" without explaining *why* gossip ≠ convention). Evolution story vague.  

  **Classic Blunders (Deduct 2–3 pts each):**  
  1. **Misidentifying convention**: Arguing Scenario 2 is conventional.  
  2. **Ignoring arbitrariness**: Not explaining why "half-open" is replaceable or why "$5" is not.  
  3. **Conflating mechanisms**: Claiming gossip "coordinates" behavior (it *punishes*, solving a dilemma, not aligning actions).  

  **Key**: Reward clarity, precision, and application over regurgitation. An A answer *uses* the concepts to dissect the cases—not just defines them.
