  First, I need to recall Good's theorem. It states that for an ideal expected utility maximizer, free information can't reduce expected utility. But the user points out real-world situations where this doesn't hold. So the desiderata must account for these exceptions.

  The user's examples are key. The medical test overreaction involves costs from emotional responses. The novel spoiler changes preferences, which might violate the stability assumed in Good's theorem. The peeking game involves strategic interactions where others anticipate your actions. Each case highlights different reasons why free information can be harmful.

  I should list core principles that a theory must satisfy. Non-negotiable ones include internal consistency (axioms like transitivity), accounting for all costs (not just monetary), and respecting preference changes. The last one is tricky because if learning changes what you value, Good's theorem might not apply. Also, strategic interactions need to be handled, where other agents react to your information-seeking.

  Conflicts between desiderata might arise. For example, respecting preference changes could clash with maintaining consistent preferences over time. But a theory needs to handle dynamic preferences. Another conflict could be between accounting for psychological costs and maintaining normative standards; some theories might dismiss psychological costs as irrational, but they're real in practice.

  The user wants to know which single requirement rules out simple theories. Probably preference change accommodation because it directly challenges the fixed preference assumption in many decision theories. If preferences shift upon learning, expected utility calculations break down.

  Also, the user might have deeper needs. They could be developing a framework for decision-making under information asymmetry or creating a model that incorporates human biases. They might need this checklist to evaluate existing theories or build a new one that handles real-life complexities beyond ideal agents.

  I'll structure the desiderata starting with non-negotiables: consistency, cost inclusiveness, preference change handling, strategic interaction consideration. Then secondary ones like temporal consistency and normative guidance. Highlight conflicts, especially between preference stability and change, and psychological costs versus rationality. Emphasize that accommodating preference changes is the biggest challenge to simple models.
answer: |-
  Here's a distilled desiderata checklist for theories of rational information-seeking, focusing on core cases and conflicts, grounded in your examples and Good's theorem:

  **Non-Negotiable Desiderata (Must Get These Right):**

  1.  **Account for All Costs/Benefits (Including Psychological & Strategic):**
      *   **Why:** Explains the "free" medical test case. Information isn't truly free if learning it triggers costly anxiety, overreaction, or impulsive actions you later regret. A theory must incorporate these endogenous costs.
      *   **Distinction:** "Free" vs. "Costless". Good's theorem assumes *only* the cost of acquisition is zero, not that there are no downstream consequences.
      *   **Ruling Out:** Simple EU maximization ignoring psychological state changes.

  2.  **Handle Preference Change/State-Dependence:** 
      *   **Why:** Explains the novel spoiler case. Learning the ending changes your *experience* of reading the rest (your utility function over reading states). A theory must allow that information can alter what you fundamentally value *in that specific context* or the state you derive utility from.
      *   **Distinction:** Information affecting *beliefs* (EU calculation inputs) vs. information affecting the *utility function itself* or the experiential state.
      *   **Ruling Out:** Theories assuming fixed, state-independent preferences over outcomes. **This is the single requirement ruling out the most simple theories**, as it breaks the core EU framework Good's theorem relies on.

  3.  **Model Strategic Interaction:**
      *   **Why:** Explains the peeking game. The value of information depends on how *other agents* (knowing you might seek it) will react. Peeking might trigger a disadvantageous counter-move. Rationality must consider the game-theoretic context.
      *   **Distinction:** Single-agent vs. multi-agent decision problems. Information value is contextual to the strategic environment.
      *   **Ruling Out:** Theories only analyzing information in isolation without modeling opponent responses.

  4.  **Require Internal Consistency (Axioms):**
      *   **Why:** Foundational for *any* rationality theory. Preferences must be coherent (transitive, complete), probability judgments consistent (Kolmogorov axioms, conditioning), and choices aligned with beliefs/desires (something like Savage's Sure-Thing Principle or weaker equivalents).
      *   **Distinction:** Rational vs. irrational belief/desire structures, independent of information-seeking consequences.
      *   **Ruling Out:** Theories allowing blatant contradictions or Dutch books.

  **Highly Desirable (Often Crucial, But Some Theories Might Sacrifice):**

  5.  **Respect Temporal Consistency & Commitment:**
      *   **Why:** Explains why *planning* matters. You might rationally *choose not to have the option* to learn information later (e.g., refusing the test, avoiding spoilers) because you know your future self will react sub-optimally (weakness of will, panic). A good theory should explain pre-commitment.
      *   **Distinction:** Rationality of the initial choice vs. rationality of the action upon learning. Needs to model selves across time.
      *   **Conflict Potential:** Can clash with a strict interpretation of "maximize EU *now*" if future actions are predictable but suboptimal.

  6.  **Provide Normative/Prescriptive Guidance:**
      *   **Why:** The theory shouldn't just describe; it should advise agents (even boundedly rational ones) on *when* seeking information is likely beneficial or harmful.
      *   **Distinction:** Descriptive (how agents *do* act) vs. Prescriptive (how they *should* act). A theory of rational inquiry needs prescriptive power.

  **Key Conflicts & Tensions:**

  *   **Preference Change (D2) vs. Fixed Preferences (Core EU):** This is the deepest conflict. D2 fundamentally challenges the static preference structure assumed by Good's theorem. Reconciling them often requires complex frameworks (state-dependent utility, transformative experience models, multi-selves).
  *   **Psychological Costs (D1) vs. "Pure" Rationality:** Some normative theories resist incorporating psychological costs, viewing them as irrational biases to overcome. D1 insists they are real costs relevant to rationality for non-ideal agents.
  *   **Temporal Consistency (D5) vs. Myopic EU:** Strict adherence to maximizing EU at each moment (including upon learning info) can prevent rational pre-commitment against seeking harmful info. D5 requires valuing plans over momentary actions.

  **Checklist Summary:**

  | Desideratum                      | Why Critical                                                                 | Key Distinction/Example                             | Non-Negotiable? | Conflicts With               |
  | :------------------------------- | :--------------------------------------------------------------------------- | :-------------------------------------------------- | :-------------- | :--------------------------- |
  | **1. Account for ALL Costs**     | Info can trigger endogenous costs (anxiety, bad actions)                     | "Free" vs. "Costless" (Medical test)                | Yes             | Simple EU                    |
  | **2. Handle Preference Change**  | Learning can alter what you value (Novel spoiler)                            | Beliefs vs. Utility/State Change                    | Yes             | **Core EU/Fixed Prefs (Biggest Conflict)** |
  | **3. Model Strategic Interaction** | Others react to your info-seeking (Peeking game)                             | Single-Agent vs. Multi-Agent                        | Yes             | Isolationist models          |
  | **4. Internal Consistency**      | Foundation of rationality (axioms)                                           | Coherent vs. Incoherent Beliefs/Preferences         | Yes             | Contradictory theories       |
  | **5. Temporal Consistency**      | Rational pre-commitment against harmful info                                 | Planning Self vs. Acting Self                       | Highly Desirable| Myopic EU maximization       |
  | **6. Normative Guidance**        | Theory should advise on whether to seek info                                 | Descriptive vs. Prescriptive                        | Highly Desirable| Purely descriptive theories  |

  **Use this checklist to evaluate theories:** A decent theory *must* satisfy D1-D4. D5 and D6 are highly desirable but sometimes sacrificed for tractability or purity. The primary tension is between D2 (Preference Change) and the fixed-preference assumption underlying Good's theorem and simple EU – any theory claiming broad applicability *must* address this conflict explicitly. If a theory fails D1 or D3, it cannot explain your core examples.
