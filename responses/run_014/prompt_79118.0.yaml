    "in_system_setup": "The listener knows: starting string is MI (one I), Rule 2 doubles the string (e.g., MII), Rule 3 replaces III with U (removes three I's), and Rule 4 deletes UU (doesn't affect I's). Goal is MU (zero I's).",
    "jootsing_move": "Recognizing the invariant: the count of I's modulo 3 is preserved (never 0 mod 3). The bartender embodies this external invariant, not the rules.",
    "why_it_lands": "It’s funny because the string’s futile doubling (Rule 2) humorously ignores the invariant, mirroring a student’s in-system struggle, while the punchline highlights the impossibility only visible from outside.",
    "in_system_version": "none",
    "falls_flat_if": "The listener misses that the invariant (I-count mod 3) is external to the rules or doesn’t connect the bartender to this concept."
  }
  ```

  ### Explanation
  - **Joke Delivery**: Takes ~20 seconds. The setup uses rules (doubling, replacing III) to feel familiar, but the punchline relies on the invariant.  
  - **Why Jootsing?**: A listener "inside the system" sees only rules (e.g., "doubling is allowed!") and misses why the string’s plan fails. A jootsing listener sees the invariant and laughs at the string’s hopeless optimism.  
  - **Humor for MU-Experts**: The joke lands because it anthropomorphizes the invariant as a bouncer, turning abstract futility into a relatable "bar joke" that rewards stepping outside.
