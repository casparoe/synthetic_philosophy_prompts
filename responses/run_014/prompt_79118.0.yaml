    "joke": "A string derived from MI walks into a bar. The bartender, an invariant, says, 'We don’t serve multiples of three I’s here.' The string says, 'But I only have one I!' The invariant replies, 'I know. And you always will. But if you ever get three, I’ll serve you a U—then you’re outta here!' The string sighs, 'Guess I’ll just double myself and try next door...'",
