answer: |-
  Here's the tiered analysis you requested, judged strictly on the axis of preserving (i) a single, unstratified truth predicate and (ii) full classical logic (including explosion) while solving the Liar:

  **Tier 1: Approaches I'd comfortably build a general truth theory on**
  *   **None.** No approach satisfying your strict axis (preserving *both* (i) and (ii) fully while solving the Liar) exists. The Liar forces a significant concession.

  **Tier 2: Workable, but with a defensible cost**
  1.  **Tarski's Stratified Hierarchy:** Sacrifices **(i) Single unstratified predicate**. It preserves full classical logic **(ii)** perfectly by banning a universal truth predicate and replacing it with a hierarchy, preventing the Liar's formation within any single level. The cost is expressive limitation and artificial stratification of truth.
  2.  **Kripke's Minimal Fixed Point (with gaps):** Sacrifices **(ii) Full classical logic (specifically Bivalence/Explosion)**. It preserves a **(i) single unstratified predicate** allowing for truth-value gaps, making the Liar non-paradoxical (neither true nor false). The cost is surrendering bivalence and classical tautologies like `P ∨ ~P` for paradoxical sentences, weakening the logic.
  3.  **Gupta-Belnap Revision Theory:** Sacrifices **(ii) Full classical logic (Explosion/Simple Bivalence)**. It preserves a **(i) single unstratified predicate** but requires a non-classical, circular or revisionary semantics where the Liar's truth value may cycle. The cost is a highly non-classical logic and complex semantics for defining validity/stability.
  4.  **Supervaluationism:** Sacrifices **(ii) Full classical logic (specifically Explosion)**. It preserves a **(i) single unstratified predicate** and bivalence for grounded sentences, treating the Liar as neither true nor false ("gappy") in all precisifications. The cost is the loss of truth-functionality (connectives aren't truth-functional for gappy sentences) and classical inference rules like Explosion fail for paradoxical claims.

  **Tier 3: Approaches I'd avoid as a general truth theory foundation**
  1.  **Dialetheism (Paraconsistent):** Sacrifices **(ii) Full classical logic (specifically Explosion and Non-Contradiction)**. While preserving a **(i) single unstratified predicate**, it accepts the Liar as both true *and* false (a dialetheia). The cost is abandoning the core classical principle of non-contradiction and requiring a paraconsistent logic where contradictions don't explode, fundamentally altering the concept of consistency and consequence.
  2.  **Deflationism (Dissolutionist Move):** Sacrifices **the very project of a substantive general theory of truth**. It technically preserves **(i)** a single predicate and often **(ii)** classical logic by arguing the Liar reveals the T-schema's unrestricted use is the only "theory" needed/possible, and the paradox is a misuse of language. The cost is refusing to provide a robust semantic account of truth or genuinely solve the paradox, rendering it inadequate for building a general theory addressing truth's complexities.

  **The Cost Analysis: (ii) Classical Logic is More Expensive to Preserve**

  Preserving full classical logic **(ii)**, including explosion, forces a more significant sacrifice to the overall apparatus than preserving a single unstratified predicate **(i)**. To maintain classical logic unscathed, Tarski *must* stratify truth predicates **(i)**, fundamentally altering the expressive power and uniformity of the language. Every other approach that attempts to keep a single predicate **(i)** achieves this only by sacrificing core tenets of classical logic **(ii)**: Kripke and Supervaluationism sacrifice bivalence/explosion for gaps; Revision Theory sacrifices standard consequence/stable truth values; Dialetheism sacrifices non-contradiction itself. Maintaining the strict deductive power and universal applicability of classical logic in the face of semantic paradoxes demands the most radical departure from the intuitive ideal of a simple, universal truth predicate within a single, powerful language.
