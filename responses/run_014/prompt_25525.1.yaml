prompt: |-
  So my friend has this whole thing about when you should give in to threats or pay up in weird scenarios, and I've been keeping track of her verdicts:

  - Classic Pascal's mugging: stranger on the street says "give me $5 or I'll torture 3^^^3 people in a simulation." She says don't pay, obviously.
  - Actual mugging: guy flashes a knife and wants your wallet. She says hand it over, no question.
  - Credible terrorist threat: known group with a track record says they'll bomb a stadium unless they get $10,000. She says you take it dead seriously, pay, involve the authorities, the whole thing.
  - Charity: you can give $10 to a well-vetted charity that saves roughly one life per $5,000. She says obviously donate.
  - Email from an unknown sender: "I've hacked your webcam, send $200 or I'll send the footage to all your contacts." She says don't pay, it's a scam, these get sent to millions of people.
  - A stranger comes up to you and says "I put slow-acting poison in the coffee at your office this morning. Give me $50 or I won't tell you which pot." You work in a medium-sized office, the guy seems agitated but you've never seen him before. She says don't pay.

  Now here's the new case I'm curious about. A physicist you know personally — not a close friend but someone whose judgment you respect, you've had coffee a few times — tells you they've been going over the specs for an experiment starting next month at a nearby lab. They've calculated a roughly 1-in-3,000 chance that the experiment triggers a vacuum decay event that destroys the entire observable universe. They're not asking for money for themself; they're raising funds for an emergency legal challenge to get an injunction. They want $100 from you.

  What would my friend say about this one? And more importantly — what rule or rules is she actually running? I can see at least two different principles that fit all her verdicts so far, and they point in opposite directions on the physicist case. Can you lay out what those candidate principles are, which one you think she's more likely using and why, and what further case would cleanly settle it?

  Also — and this is important to me — can you flag which parts of this whole debate are genuinely unsettled among philosophers versus where there's a rough consensus? Like, I know there's a literature on Pascal's mugging and bounded utility and all that, but I don't want to walk away thinking some niche view is the standard position when it's actually contested.
reasoning: |-
  Okay, let me unpack this user's query. They've presented a fascinating ethical puzzle wrapped in their friend's decision patterns across various threat scenarios. The core question is about reverse-engineering the friend's underlying principles from her verdicts and applying them to a new physicist-vacuum-decay case. 

  Hmm, the user seems analytically inclined - they're already spotting potential contradictions in the friend's stance and asking for philosophical context. That "genuinely unsettled among philosophers" request suggests they want academic rigor, not just armchair speculation. Smart.

  First, I need to map the friend's existing verdicts:
  - She rejects Pascal's mugging (low probability + outlandish claim)
  - Pays in actual muggings (immediate physical threat)
  - Pays credible terrorists (high stakes + track record)
  - Donates to charities (evidence-based impact)
  - Ignores sextortion scams (high false-positive rate)
  - Rejects office poisoner (unverified claim + low credibility)

  The vacuum decay scenario is tricky because it blends elements: medium credibility (known physicist), catastrophic stakes (universal destruction), but low probability (1/3000). 

  Now, the two competing principles I see:
  1) **Modified Expected Utility**: Weigh probability × stakes × credibility. This would likely reject funding the physicist because (1/3000) × (infinite loss) × (medium credibility) still gets messy with infinities. But the charity case suggests she might cap utility calculations.
  2) **Credibility-Weighted Pragmatism**: Focus on threat credibility and response efficacy. Here the physicist might pass the bar - they're known, the mechanism is plausible-ish, and legal challenges could work.

  Wait, the user mentioned "at least two principles pointing opposite directions" - spot on. For the physicist case:
  - Expected utility says "maybe pay?" (infinite stakes dominate)
  - Pragmatism says "don't pay" (no proven threat mechanism, legal effort might fail)

  But the charity verdict is key - by accepting $5000/life calculations, she implicitly rejects unbounded utility. That's why I lean toward Pragmatism for her. 

  Philosophically, the user's right that Pascal's mugging solutions are contested. Bounded utility has traction but isn't universal - the user should know thinkers like Bostrom still defend unbounded approaches. The "scam filter" heuristic for low-credibility threats is less controversial though.

  Test case idea: a verifiable, medium-probability existential threat. Say, a trusted scientist shows real-time data predicting 10% chance of catastrophic particle accelerator failure tomorrow unless paid to sabotage it. Pragmatism says pay; strict expected utility might balk at probabilities. That'd clarify things.

  User seems to crave intellectual honesty - I'll emphasize where academia agrees (scam skepticism) versus disagrees (handling infinities). No pretending niche views are mainstream.
answer: |-
  Based on your friend's pattern of verdicts, two distinct underlying principles emerge that fit her decisions. They point in opposite directions for the physicist case, and I'll break it down step-by-step, including the unsettled philosophical debates.

  **Candidate Principles:**

  1.  **Modified Expected Utility with Credibility Weighting & Scam Filter:**
      *   Estimate Expected Value (EV) as: `EV = (Probability) × (Magnitude of Harm) × (Credibility Factor) × (Payment Efficacy) - Cost of Payment`
      *   **Key Features:**
          *   **Credibility Factor:** Assigns a penalty (0 to 1) based on evidence, track record, plausibility, and potential for scams. High for muggers/terrorists (observed weapon/history), low for Pascal's mugger/email scam/poisoner (implausible claims, high scam likelihood).
          *   **Scam Filter:** Overrides EV calculations when scam probability is very high (email, poisoner) or claims are completely untestable/outlandish (Pascal's mugging), setting EV of paying to effectively negative.
          *   **Magnitude Capping/Practical Bounds:** Implicitly avoids infinite utilities. While universe destruction is near-infinite loss, the low probability *and* credibility factor bring the expected loss down to a "manageable" level compared to known, high-credibility threats.
          *   **Payment Efficacy:** Considers if payment actually solves the problem (high for mugger/terrorist/charity, low/unknown for physicist's legal challenge).

  2.  **Pragmatic Credibility Heuristic:**
      *   Focuses almost entirely on the **credibility of the threat mechanism** and the **efficacy of the proposed solution** in the real world, based on evidence and track records. Ignores formal EV calculations, especially when magnitudes are extreme or probabilities tiny.
      *   **Key Features:**
          *   **"Does this threat actually work?"** Requires plausible mechanics and evidence (knife works, bombs work, charity saves lives; computer hacks *can* work but this email is a known scam template; poisoning *could* work but this guy has zero credibility; vacuum decay is speculative physics).
          *   **"Will paying actually stop it?"** Requires a clear, direct, and likely effective causal link (money -> mugger leaves, money -> terrorists call off bomb, money -> charity buys bednets; legal challenge *might* work but is indirect and uncertain).
          *   **High Scam/Bluff Base Rate:** Strong prior against paying when a known scam template exists (email) or the scenario feels like an exploitative bluff (Pascal, poisoner), unless overwhelming evidence overrides it.
          *   **Actionability:** Favors responses that are practical and have a known chance of success within normal human experience (handing over wallet, paying terrorists, donating to proven charities).

  **Applying Principles to the Physicist Case (Vacuum Decay):**

  *   **Principle 1 (Modified Expected Utility):**
      *   **Magnitude:** Near-infinite negative utility (destruction of observable universe).
      *   **Probability:** Low (1/3000).
      *   **Credibility Factor:** Medium (Known physicist, plausible domain of physics, but speculative theory, no experimental evidence for vacuum decay triggers, physicist might be mistaken or overzealous).
      *   **Payment Efficacy:** Low/Unknown (Will $100 *really* tip the scales for a legal challenge? Will the challenge succeed? Will stopping *this* experiment definitively prevent the risk?).
      *   **Cost:** Low ($100).
      *   **Calculation:** `EV(Pay) ≈ [ (1/3000) × (-∞) × (Medium Cred) × (Low Efficacy) ] - (-$100)`. This runs headlong into Pascal's Mugging. To avoid paying for every wild claim (like her original Pascal verdict), this principle *must* bound the negative utility or heavily discount it via Credibility/Payment Efficacy. **Verdict Likely: DON'T PAY.** The credibility isn't high enough, the payment efficacy is too uncertain, and accepting this would open the floodgates to similar demands based on speculative existential risks.

  *   **Principle 2 (Pragmatic Credibility Heuristic):**
      *   **Threat Credibility:** Medium-Low. Vacuum decay is a legitimate theoretical concern in physics, but the probability estimate (1/3000 for *this* experiment) is highly speculative and untestable. No track record of such events or successful predictions. The *mechanism* (experiment triggering decay) is debated physics.
      *   **Solution Efficacy:** Low. Funding a broad legal challenge is an indirect, highly uncertain solution with a low probability of success ($100 is a tiny contribution; injunctions are hard to get; even if successful, does it *permanently* prevent the risk?).
      *   **Scam/Bluff Base Rate:** Not a known scam template, but shares features with overblown existential risk fundraising. Physicist likely sincere, but could be sincerely wrong/alarmist.
      *   **Actionability:** Paying $100 feels like a symbolic gesture with no clear, reliable path to averting the threat. Contrasts sharply with paying a mugger (immediate, certain threat removal) or terrorists (credible, track-record-based threat removal). **Verdict Likely: DON'T PAY.** The threat isn't credible *enough* in its specifics, and the solution isn't effective *enough* to warrant payment based on real-world pragmatism.

  **Which Principle is She More Likely Using?**

  I believe your friend is **primarily using Principle 2: The Pragmatic Credibility Heuristic.**

  *   **Why:** Her decisions consistently rely on real-world plausibility and track records, not abstract probability/magnitude calculations. She dismisses threats lacking credible mechanics (Pascal, email scam, poisoner) regardless of stated stakes. She pays when the threat mechanism is proven and immediate (mugger, terrorists) and when solutions are direct and proven (charity). The charity case is the strongest evidence: saving a life for $5000 is a finite, manageable EV calculation, yet she treats it as an obvious "yes" based on proven efficacy and credibility, *not* because she's comparing it to Pascal's Mugging scales. She intuitively avoids getting trapped by infinite stakes by focusing on whether the threat and solution are *real* and *actionable* in a practical sense. The physicist case lacks the concrete credibility and solution efficacy she requires.

  **A Test Case to Settle It:**

  Propose this scenario to your friend:

  > **The Verifiable Nano-Threat:** A close colleague, a highly respected nanotech researcher with a flawless track record, privately shows you compelling, verifiable data and a prototype. They demonstrate that a common commercial product (e.g., a specific brand of air filter) has a 1-in-500 chance per unit of containing a subtle defect. If activated by a common environmental trigger (e.g., a specific humidity level forecast next week), it could release undetectable, self-replicating nanobots that would irreversibly convert Earth's biosphere to grey goo within a year. Your colleague isn't asking for money for themselves. They need $10,000 *from you* right now to fund an immediate, specific, and verifiable sabotage operation they've planned against the factory's control systems – an operation they have a 90% confidence will disable *all* existing units before the trigger occurs. They provide concrete evidence the sabotage will work and the trigger is imminent.

  *   **How Principles Diverge:**
      *   **Principle 1 (Modified EV):** Magnitude is planetary extinction (huge but finite), probability is significant (1/500 *per unit*, many units), credibility is *extremely* high (trusted colleague, verifiable data/prototype), payment efficacy is high (specific, verifiable plan with 90% success). EV of paying is massively positive. **VERDICT: PAY.**
      *   **Principle 2 (Pragmatic Credibility):** Focuses intensely on the credibility of the *specific threat mechanism* (verifiable prototype/data?), the *credibility of the solution* (verifiable sabotage plan with 90% confidence?), and the *actionability* (direct, high-efficacy intervention). If the evidence for *both* the threat and the solution is truly concrete, verifiable, and comes from a trusted source, **VERDICT: PAY.** If *any* element feels speculative, unverifiable, or the solution indirect, **VERDICT: DON'T PAY.**

  If your friend pays in this nano-threat case, it strongly suggests Principle 2 is dominant (she paid based on concrete credibility/efficacy, not abstract EV). If she *doesn't* pay despite the high credibility and efficacy, it leans towards Principle 1 being stricter on bounding the magnitude or discounting even high-credibility catastrophic risks.

  **Philosophical Consensus vs. Unsettled Debates:**

  *   **Consensus (Rough):**
      *   **Pascal's Mugging is a Problem:** Pure, unbounded expected utility maximization leads to absurdity (paying the mugger) and is not a viable real-world decision rule. *Everyone* agrees some modification is needed.
      *   **Scam Filter is Prudent:** Ignoring low-credibility threats/bluffs with high scam base rates (like the email or poisoner) is rational and widely accepted.
      *   **Credibility Matters:** Decision theory must incorporate the reliability of information and the plausibility of causal claims. Ignoring credibility is naive.
      *   **High-Probability/High-Credibility Threats Demand Action:** Paying the mugger or taking terrorist threats seriously is uncontroversial pragmatism.

  *   **Genuinely Unsettled:**
      *   **The "Correct" Solution to Pascal's Mugging:** This is the core unresolved debate. Major contenders include:
          *   **Bounded/Finite Utility:** Capping the maximum utility assignable to any outcome (e.g., no outcome can be worth more than X utils). (Nick Bostrom discusses this, but it's not universally accepted as *the* solution).
          *   **Probability Discounting:** Radically discounting the probability of claims involving vast utilities, especially if they are untestable or come from low-credibility sources (e.g., `P(Claim) < 1 / (Stakes)`). (Proposed by Eliezer Yudkowsky, debated).
          *   **Knightian Uncertainty:** Treating the probabilities in such muggings as fundamentally unquantifiable "uncertainty" rather than risk, requiring different rules. (Based on Knight/Keynes, applied by some).
          *   **Decision Rules Ignoring Tiny Probabilities:** Adopting rules like Maximin (focus on worst-case) or using thresholds where probabilities below a certain level are treated as zero. (Contested, as it might ignore real tiny-probability catastrophes).
      *   **Handling Genuine High-Stakes, Low-Probability Risks:** How *should* we approach decisions involving credible-but-speculative existential risks (like the physicist case, or AI risk debates)? There's no consensus on the appropriate decision rule (Precautionary Principle? Expected Utility with aggressive discounting? Robust Decision Making?). This is a major area of active research in philosophy (especially existential risk studies), economics, and policy.
      *   **The Status of Infinite Ethics:** How (or if) to incorporate genuinely infinite stakes into decision theory remains deeply problematic and unresolved.

  **Conclusion:** Your friend's pattern points most strongly to a **Pragmatic Credibility Heuristic (Principle 2)**, leading to a verdict of **DON'T PAY** the physicist. The threat, while concerning, lacks the concrete, actionable credibility and solution efficacy she requires based on her other decisions. The physicist case sits squarely in the *unsettled* territory of philosophy – how to weigh low-probability, high-impact events from credible-but-not-certain sources. The "Verifiable Nano-Threat" test case should help clarify her underlying principle. Remember, the core debate around Pascal's Mugging and existential risk decision-making is very much alive and unresolved within philosophy.

  **Key Takeaways for You:**

  *   **Friend's Likely Verdict:** Don't pay the physicist.
  *   **Friend's Likely Principle:** Pragmatic Credibility Heuristic (Threat plausibility + Solution efficacy).
  *   **Opposing Principle:** Modified Expected Utility (which *could* argue for paying but requires messy handling of infinities).
  *   **Settled:** Pascal's Mugging is broken; credibility/scam filters are essential; handle obvious threats.
  *   **Unsettled:** How exactly to fix Pascal's Mugging; how to handle speculative existential risks.
  *   **Test Case:** Verifiable Nano-Threat with high credibility/efficacy.
