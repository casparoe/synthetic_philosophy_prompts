    3. **Rank-Dependent Utility:** Pattern robust, no context dependence (Nodes 1–8 → No).  
    4. **Regret Theory:** Pattern robust, context dependent (Nodes 1–10 → Yes).  
    5. **Diachronic Inconsistency:** Pattern not robust, compound lottery issue (Node 9 → Commitment ≠ Choice).  
    6. **Prospect Theory:** Pattern not robust, no diachronic issue (Node 9 → Commitment = Choice).  
    7. **Unnamed:** Context dependence without regret (Node 10 → No).  

  #### **Unoccupied Combinations & Limitations**  
  - **Unnamed Leaf (Node 10 → No):** Empty as it combines context dependence with no regret, implying incoherent preferences (e.g., menu effects without psychological rationale).  
  - **Distinct Frames Not Separated:** The tree cannot distinguish between:  
    - **"Rank-Dependent Utility"** and **"Regret Theory"** if context dependence is ambiguous.  
    - **"Prospect Theory"** and a mistake if the pattern weakly generalizes.  
  - **Why Certain Paths Are Unattractive/Unexplored:**  
    - **Gain-only Regret (unexplored):** No theory posits regret exclusive to gains while ignoring losses.  
    - **Robust Pattern with Diachronic Inconsistency (unattractive):** Combines global rationality with dynamic failure, implying irrationality.  

  This tree prioritizes isolating commitments (e.g., aversion to certainty in Pair 1 but not Pair 2) and uses diverse frames to sift axiomatic positions. Students can test their intuitions without prior theory and map to foundational debates in rational choice.
