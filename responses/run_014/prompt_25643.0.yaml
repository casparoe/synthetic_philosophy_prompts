answer: |-
  What you're describing is a brilliantly observed phenomenon that sits at the intersection of philosophy of biology, sociology of science, and epistemology. While there isn't a single universally agreed-upon *term* for the *entire* pattern you outline, it's absolutely a recognized dynamic, and we can break it down into key concepts:

  1.  **The Core Problem: Normativity Disguised as Neutrality**
      *   **The Issue:** Scientists present their taxonomic judgment (lumping vs. splitting) as a purely empirical, objective conclusion based on the *same* data, while simultaneously leveraging that conclusion to advance normative goals (conservation funding, site importance, policy influence) *without explicitly acknowledging* the role those goals play in their interpretation.
      *   **The Smuggling:** You nailed it: values are being smuggled inside the supposedly value-free scientific claim ("It's one species/two species!").

  2.  **Related Concepts & Frameworks:**

      *   **Normativity in Species Concepts / The Species Problem:** Philosophers like Marc Ereshefsky, John Dupré, and Philip Kitcher have extensively argued that species concepts are inherently *normative* or *practical kinds*, not purely natural kinds waiting to be discovered.
          *   Why? Because choosing *which* species concept to apply (biological, phylogenetic, ecological, morphological) is itself a value-laden decision driven by the *purpose* of the classification (e.g., conservation, evolutionary history, ecology). Your scenario shows this playing out *within* a seemingly agreed-upon concept (or set of data), but the underlying choice of how much weight to give conflicting evidence (e.g., some interbreeding vs. distinct morphology) is still value-driven.
          *   **Reference:** Ereshefsky's "The Poverty of the Linnaean Hierarchy" and "Species" (Stanford Encyclopedia of Philosophy); Kitcher's "Species".
      *   **Boundary Work (Thomas Gieryn):** This is a crucial sociological concept. Scientists engage in "boundary work" to demarcate "science" (objective, rational, value-free) from "non-science" (subjective, biased, political). In your scenario:
          *   Each researcher accuses the *other* of letting non-scientific values (politics, careerism) infect their *scientific* judgment ("inflating counts," "erasing biodiversity").
          *   Each *defends their own* position as purely scientific, based solely on the evidence.
          *   The *act of accusation itself* is boundary work – each is trying to establish their own position as "real science" and the other's as "polluted."
          *   **Reference:** Gieryn's "Boundary-Work and the Demarcation of Science from Non-Science".
      *   **Implicit Normativity / Value-Ladenness of Science:** Philosophers of science (e.g., Helen Longino, Heather Douglas) argue that values are not just external influences corrupting science but can be *implicit* in the choices scientists make: what problems to study, what methods to use, how to interpret ambiguous data, what thresholds to set (e.g., how much gene flow is "too much" for one species?).
          *   In your case, the *interpretation* of the *same* evidence (how significant is that gene flow? how distinct is the morphology?) is where the implicit values (about conservation importance, research impact) are doing their work, masked as objective assessment.
          *   **Reference:** Longino's "Science as Social Knowledge"; Douglas's "Science, Policy, and the Value-Free Ideal".
      *   **Motivated Reasoning:** This is the broader psychological phenomenon where desires, goals, and emotions shape how we process information. While this is part of it, your observation is more specific: it's motivated reasoning *couched exclusively in the language of objective taxonomy*, denying its own motivational roots. It's motivated reasoning *performing* neutrality.

  3.  **What *to* Call It (Suggestions):**

      *   **"Normative Boundary Work in Taxonomy":** This captures the core: using taxonomic claims (boundary work) to assert scientific objectivity while simultaneously advancing normative agendas (conservation, career) and denying their influence.
      *   **"Strategic Essentialism in Species Delimitation":** Borrowing from Gayatri Spivak ("strategic essentialism" – temporarily assuming a unified identity for political purposes), this highlights the pragmatic use of a seemingly fixed taxonomic category ("essentialism") to achieve specific goals ("strategy"), often obscuring the underlying fluidity and value-judgments.
      *   **"Taxonomic Instrumentalism":** Framing taxonomic decisions primarily as instruments for achieving non-taxonomic goals (conservation, funding), while presenting them as purely descriptive discoveries. (Contrasts with "taxonomic realism").
      *   **"Smuggling Values in Species Concepts":** Directly using your apt metaphor.

  4.  **Answering Your Specific Questions:**

      *   **Is there a canonical name?** No single, universally accepted term exists for this *exact* constellation of behaviors. However, the concepts of **normativity in species concepts** and **boundary work** are the most directly relevant and well-established frameworks for understanding it.
      *   **How it differs:**
          *   **General Species Problem:** The species problem is the *source* – the lack of a single, objective definition creates the ambiguity where values can operate. Your phenomenon is how actors *navigate* that ambiguity while hiding their value commitments.
          *   **Generic Motivated Reasoning:** This *is* a form of motivated reasoning, but it's highly specific to the context of scientific taxonomy, characterized by the *denial* of motivation and the use of scientific objectivity as the *rhetorical cover*.
      *   **Does it require both parties?** No. One side can be sincerely believing their interpretation is purely empirical while still being influenced by implicit values or career incentives. The *accusation* of bias often reveals the dynamic, but the *denial* of bias by the actor is the core mechanism. The phenomenon exists when *at least one party* is denying the normative influence on their taxonomic judgment while it demonstrably exists (or is strongly suspected).
      *   **Do normative stakes matter?** Absolutely not. The core is the *denial of normativity* while normative factors (epistemic, ethical, political, careerist) are influencing the ostensibly empirical judgment. Whether the stakes are "just" publication counts/grants ("epistemic" incentives) or saving a habitat (ethical/political) is irrelevant to the *structure* of the behavior you describe. The smuggling mechanism is the same.

  5.  **Is Your Framing Confused?**

      **Absolutely not.** Your framing is remarkably astute. You've identified a genuine and pervasive dynamic in biological taxonomy (and science more broadly). You've correctly pinpointed:
      *   The ambiguity inherent in species delimitation.
      *   The influence of non-epistemic values (conservation, funding, prestige).
      *   The *rhetorical strategy* of presenting value-laden judgments as purely objective scientific conclusions.
      *   The use of scientific authority ("it's one species/two species!") as a tool in policy/political/funding debates while denying that's what's happening.

  **Conclusion & Recommendation for Your Novel:**

  You've hit upon a rich vein. While there isn't a perfect single term, **"normative boundary work"** or **"strategic essentialism in taxonomy"** might be the most concise ways to capture the essence for your purposes within the narrative or authorial voice.

  For deeper philosophical grounding, look to **Marc Ereshefsky** (on normativity in species concepts) and **Thomas Gieryn** (on boundary work). For the broader context of values in science, **Heather Douglas** or **Helen Longino**.

  This dynamic is perfect novelistic territory – it reveals the human drama, politics, and hidden motivations beneath the surface of seemingly objective scientific debate. Your observation is spot-on, not confused. Use it well!
