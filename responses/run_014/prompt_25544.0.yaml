prompt: |-
  I serve on a university sexual misconduct hearing panel. We hear about two dozen cases a year, and the single question we spend the most time on is whether the complainant's consent was valid — or, in cases where the respondent claims they reasonably believed consent was present, whether that belief was reasonable given what they knew about deception, pressure, or the complainant's capacity at the time. The panel includes faculty from across the university (history, chemistry, engineering) and two students; nobody has formal training in the philosophy of consent, and our training materials mostly recite policy language without helping us operationalize it. We are not lawyers, we do not apply rules of evidence, and we deliberate in a conference room with a whiteboard, not a courtroom.

  I want a decision procedure we can use during deliberations, after the factual disputes have been resolved as best we can, to assess whether consent was validly given. The procedure should walk us through the three main threats to validity — deception, coercion, and incompetence — in a structured order, with concrete questions for each, thresholds for what counts as sufficient to undermine consent, and explicit flags for where the procedure cannot decide and the panel must exercise judgment. The procedure should be usable by non-philosophers in under thirty minutes, and it should be honest about which steps are genuinely rule-like and which are judgment calls dressed up as criteria. Where the philosophical literature contains a genuine dispute that bears on a step — for instance, about whether consent is fundamentally a mental state or a communicative act, or about whether the standard for competence should be fixed or vary with the stakes of the decision — please flag that dispute and tell us how to proceed in spite of it, rather than pretending it does not exist.

  Please then apply the procedure to three cases. First: a complainant alleges they consented to sex only because the respondent told them they were in a committed relationship and had ended things with their other partner; the respondent admits they were still seeing the other partner and had no intention of ending that relationship, but argues that people misrepresent their romantic intentions all the time and this does not rise to the level of invalidating consent. Second: a graduate student alleges they consented to a sexual relationship with their thesis advisor only because they feared that refusing would damage their career; the advisor never made any explicit threat but acknowledges they were aware of the power differential. The university's policy is silent on whether advisor-student relationships are per se prohibited. Third: both parties agree the complainant had been drinking heavily — somewhere between six and nine drinks over four hours — and initiated the sexual encounter, but the complainant says they were too intoxicated to meaningfully consent and the respondent says the complainant was lucid, conversational, and appeared to be making decisions normally.

  For each case, walk through the procedure step by step and tell me what it yields. I especially want to see a case where the procedure returns an answer the panel will find uncomfortable — perhaps because it says consent was valid when our instincts say otherwise, or invalid when we would prefer to find it valid. Finally, tell me what this procedure systematically cannot handle: the kinds of cases or considerations it will miss, and where the underlying philosophical theory itself is unsettled enough that no procedure could settle it.
reasoning: |-
  Okay, let me approach this with the care it deserves. The user serves on a university sexual misconduct panel and needs a practical decision tool for assessing consent validity. They're frustrated with abstract policy language and want something actionable that acknowledges philosophical gray areas. 

  First, I need to understand their constraints: non-philosophers, 30-minute deliberations, three core threats (deception/coercion/incompetence). The tool must be honest about where judgment is unavoidable. 

  Hmm... the challenge is balancing structure with necessary flexibility. I'll build it around three gates - one for each threat - with clear thresholds and escape valves for indeterminate cases. For deception, the key is whether the lie fundamentally altered the nature of the act; for coercion, whether a reasonable person would feel deprived of meaningful choice; for competence, whether impairment created a categorical inability. 

  Important to flag the philosophical landmines upfront: the mental state vs. performative debate means we must prioritize observable evidence over claimed internal states. The competence threshold varies by stakes? Here we'll default to the categorical approach (could they understand the act?) because variable standards would paralyze panels.

  Now for case applications... The first case (romantic deception) is tricky. The lie about monogamy feels unethical, but does it negate consent? Under our deception gate: this isn't fraud-in-the-factum (he didn't impersonate someone), so we must ask if it's fraud-in-the-inducement for sex. Most jurisdictions say no - but morally? That's why we have the "fundamental purpose" escape valve. The procedure might validate consent here, making panels uncomfortable. I'll show that.

  Second case (advisor power dynamic) hinges on coercion without explicit threats. Our coercion gate catches this - the implied career harm creates situational duress. Even without policy prohibition, the baseline freedom is missing. This should clearly invalidate consent.

  Third case (intoxication) turns on competence. Our bright-line rule ("could not understand X/Y/Z") avoids blood-alcohol debates. If they initiated but were cognitively impaired, consent fails. The procedure forces uncomfortable decisions when someone seems functional but meets impairment criteria.

  Finally, I'll map the blind spots: cases where parties have incompatible good-faith perceptions, or where cultural norms clash with policy. These require holistic judgment no procedure can resolve. The key is admitting that upfront so panels don't overtrust the tool.
answer: |-
  Here is a structured decision procedure for assessing consent validity, designed for non-philosophers in hearing panels, followed by applications to your three cases and an analysis of limitations.

  ---

  ### **Consent Validity Assessment Procedure (CVAP)**  
  *Time: 20-30 min | Tools: Whiteboard, policy document, resolved facts*  

  #### **Core Principles**  
  1. **Consent = Communicative Act** (per policy/practice): We assess observable words/actions, not unstated mental states.  
  2. **Threats are Independent**: If ANY threat (deception/coercion/incompetence) is sufficient, consent is invalid.  
  3. **Judgment Flags**: Explicitly marked where philosophical disputes exist. Panels must deliberate openly at these points.  

  ---

  ### **Step-by-Step Procedure**  
  **Threshold**: Consent is **invalid** if ANY gate returns "YES".  

  | **Gate**               | **Concrete Questions**                                                                 | **Threshold for "YES" (Invalid Consent)**                                                                 | **Judgment Flags**                                                                                                        |
  |------------------------|----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|
  | **1. DECEPTION GATE**  | a. Did respondent intentionally lie/mislead about a **fact central to the sexual act**?<br>b. Would a reasonable person know this lie could cause consent? | YES if: Lie was about (i) STI status, (ii) identity, (iii) **nature of the act**, OR (iv) a fact the respondent knew was **fundamental to complainant’s participation**. | **Dispute**: Is "romantic fraud" (e.g., false promises) sufficient?<br>**Resolution**: Only "yes" if lie directly alters sexual context (e.g., "I’m your assigned hookup partner"). Else, proceed to coercion. |
  | **2. COERCION GATE**   | a. Was complainant pressured by **threats** (explicit/implicit)?<br>b. Would a reasonable person in complainant’s position feel they **couldn’t refuse** without severe harm? | YES if: Pressure removed **meaningful choice** (e.g., threats of violence, job loss, academic retaliation). "Harm" = more than discomfort or regret.                       | **Dispute**: What counts as "severe harm"?<br>**Resolution**: Use "reasonable person in complainant’s position" + institutional power dynamics. Document disagreement. |
  | **3. COMPETENCE GATE** | a. Was complainant **incapable of understanding** the act/partners/consequences?<br>b. Were observable signs of impairment **known/obvious** to respondent? | YES if: Complainant was (i) unconscious, (ii) severely intoxicated (**unable to walk/speak coherently**), (iii) mentally disabled without support, OR (iv) respondent **ignored clear signs** of incapacity. | **Dispute**: Variable competence thresholds (alcohol tolerance, neurodiversity).<br>**Resolution**: Use **categorical bright line**: Could they understand "who, what, and consequences"? Document ambiguity. |

  ---

  ### **Application to Cases**  
  #### **Case 1: Romantic Deception**  
  - **Facts**: Respondent lied about ending other relationship; complainant consented believing they were exclusive.  
  - **Deception Gate**:  
    - a. Lie about relationship status? **YES**.  
    - b. Central to sexual act? **Judgment Flag**: Philosophical dispute here. *Romantic lies ≠ fraud in the factum* (e.g., lying about STIs).  
    - **Threshold**: Not met (unless policy defines "nature of act" to include relational context). **Proceed**.  
  - **Coercion Gate**: No threats alleged. **NO**.  
  - **Competence Gate**: No impairment alleged. **NO**.  
  - **CVAP Outcome**: **Consent VALID**.  
  - **Panel Discomfort**: Likely. Procedure prioritizes communicative act (consent was given) over moral betrayal. *Philosophical Note: Most courts reject "fraud in the inducement" for consent, but ethics differ.*  

  #### **Case 2: Advisor-Student Power Dynamic**  
  - **Facts**: Grad student feared career harm; advisor knew of power imbalance. No explicit threat.  
  - **Deception Gate**: No lies alleged. **NO**.  
  - **Coercion Gate**:  
    - a. Implicit pressure? **YES** (advisor’s power inherently implies academic control).  
    - b. Reasonable fear? **YES** – reasonable person in student’s position would fear refusal could damage career.  
    - **Threshold**: **MET** (severe harm = career jeopardy).  
  - **CVAP Outcome**: **Consent INVALID**.  
  - **Panel Note**: Even without policy prohibition, coercion exists via structural power.  

  #### **Case 3: Heavy Intoxication**  
  - **Facts**: Complainant had 6–9 drinks, initiated sex. Respondent claims lucidity.  
  - **Deception/Coercion Gates**: Not alleged. **NO**.  
  - **Competence Gate**:  
    - a. Capacity to understand? **Judgment Flag**: Stakes-dependent dispute (alcohol tolerance vs. fixed standard).  
    - **Threshold**: Use **categorical test**: Could complainant understand "who, what, consequences"?  
      - If complainant was "conversational" but **blackout drunk** (common at 6–9 drinks), consent is still invalid if incapacity was observable.  
      - Respondent’s claim of "lucidity" must be weighed against evidence (slurred speech, stumbling, vomiting).  
    - **Outcome**: If evidence shows **observable impairment** (e.g., witnesses, CCTV), **YES** (invalid). If not, **NO** (valid).  
  - **Uncomfortable Outcome**: If complainant initiated but was impaired, consent is **invalid** – contradicts "initiation = consent" intuition.  

  ---

  ### **What CVAP Systematically Cannot Handle**  
  1. **Cultural/Relational Context**:  
     - E.g., Consensual BDSM with pre-negotiated rules, or non-Western consent norms.  
     - *Gap*: CVAP assumes mainstream communicative norms.  
  2. **Mutual Miscommunication**:  
     - Both parties misinterpret each other in good faith (e.g., ambiguous signals).  
     - *Gap*: Procedure relies on resolved facts; cannot adjudicate "reasonable belief" without clear evidence.  
  3. **Mental State vs. Performance**:  
     - Complainant says "I froze but didn’t say no"; respondent claims "they seemed willing."  
     - *Gap*: CVAP prioritizes observable acts, but trauma responses complicate this.  
  4. **Ambiguous Power Dynamics**:  
     - E.g., Same-rank colleagues with unspoken social hierarchies.  
     - *Gap*: Coercion gate requires clear "severe harm" – social exclusion may not qualify.  
  5. **Competence Gray Zones**:  
     - Psychiatric conditions, neurodivergence, or low intoxication where capacity is partial.  
     - *Gap*: Bright-line thresholds exclude marginal cases.  

  ---

  ### **Recommendations for Panels**  
  1. **Document Judgment Flags**: Explicitly note where philosophical disputes arose (e.g., "Competence Gate: Disagreed on whether slurred speech sufficed").  
  2. **Policy Audits**: Push for clarifications on (a) "deception by omission," (b) power dynamics, (c) intoxication standards.  
  3. **Time Management**: Use whiteboard to track gates:  
     ```
     [Gate 1: Deception] NO → [Gate 2: Coercion] YES → STOP (Invalid)  
     ```  
  4. **Uncomfortable Truths**: CVAP may validate consent in deception cases or invalidate it in drunk-but-functional cases. *This is by design* – it prioritizes policy over instinct.  

  CVAP provides structure but cannot eliminate hard choices. Its value lies in forcing explicit reasoning at philosophically fraught junctures, reducing arbitrariness while acknowledging where policy must evolve.
