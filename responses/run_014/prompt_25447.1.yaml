  Okay, the user is taking an aesthetics course and is studying Tolstoy's "What is Art?" They received notes from a friend who took the course previously, but they feel something might be off about the summary. Specifically, they're unsure about how the friend connects "transmits feeling" to "makes you a better person" and whether the friend is conflating Tolstoy's definition of art with his evaluation criteria.

  First, I need to recall Tolstoy's main arguments. He defines art as the communication of emotion through a work that "infects" the audience. The key here is that the artist must genuinely feel the emotion and successfully transmit it. The user's friend got that part right. But where it gets tricky is the moral component. Tolstoy does believe that art should communicate feelings that promote human unity and brotherhood, rooted in his interpretation of Christianity. However, the friend's summary might be oversimplifying by implying that any successful transmission of emotion counts as art, but only morally good transmissions make it "good art." Actually, Tolstoy argues that without the moral element, it's not true art at all. That's a crucial distinction.

  The user is questioning the slide from transmission to moral improvement. I need to explain that Tolstoy links the value of art to its moral content, but the definition hinges on successful infection. The friend's summary says art is defined by transmission, then evaluated by morality. But Tolstoy merges them; for him, the highest art must have both. The user might be sensing this conflation in the notes. Also, the friend mentions Tolstoy condemning his own novels, which is correct, but the reason is their failure to communicate universal Christian feelings, not just appealing to the upper classes. Though class is a factor because he believed true art should be accessible to all, hence his critique of elitism.

  The user's deeper need might be understanding Tolstoy's philosophy accurately for their course. They might be preparing for an essay or exam and want to avoid misrepresenting Tolstoy. They also might be interested in the nuances between definition and evaluation, which is a common point of confusion in aesthetics. Highlighting where the friend is accurate versus where nuances matter will help. Emphasizing the role of sincerity and accessibility in Tolstoy's criteria is important too. The user might also appreciate knowing that while Tolstoy's view is coherent, it's controversial because it dismisses much canonical art. That context could aid their analysis in class discussions.
answer: |-
  Your instincts are spot on – your friend's summary captures the *broad strokes* of Tolstoy's argument but misses crucial nuances and subtly conflates definition with evaluation. Here's a breakdown of what's accurate, what's subtly wrong, and where Tolstoy would push back:

  **What Your Friend Got Right (The Core):**

  1.  **Art as Communication/Infection:** This is the absolute bedrock of Tolstoy's definition. Art is fundamentally the *transmission* of a specific feeling experienced by the artist, embodied in an external object (the work), and "infecting" the perceiver so they experience that *same* feeling. Beauty, form, skill, pleasure, and even representation are secondary or irrelevant to this core function.
  2.  **Rejection of Much "Great Art":** Tolstoy absolutely condemns a vast amount of art revered by the educated elites, including his own earlier novels like *War and Peace* and *Anna Karenina*. He argues they fail his core criterion.
  3.  **Moral/Religious Purpose as Supreme Value:** Tolstoy believes the *highest purpose* of art is to communicate feelings that foster universal human brotherhood and love, grounded in his specific interpretation of "true" Christianity. Art transmitting feelings counter to this (promoting division, sensuality, exclusivity, etc.) is harmful.
  4.  **Critique of Class Exclusivity:** He vehemently argues that true art must be accessible and understandable to *all* people, not just a privileged minority. Much elite art fails this accessibility test.

  **What's Subtly Wrong or Misleading:**

  1.  **The Slide from Definition to Evaluation:** This is the most significant issue. Your friend says: "Tolstoy defines art as the communication of emotion... **So for Tolstoy, what makes something art isn't beauty... it's whether it successfully transmits a feeling.**" This is **mostly correct for the *definition***. However, your friend then immediately slides into: **"he concluded that most of what we call great art... is bad art, because it... doesn't transmit morally good feelings..."** Here's the conflation:
      *   **Definition (What *is* Art?):** For Tolstoy, successful infection *is* the necessary and sufficient condition for something to *be* art. If it infects, it *is* art (though potentially "bad" art).
      *   **Evaluation (What is *Good* Art?):** This is where morality comes in. *Good* art successfully infects *and* transmits feelings conducive to human unity and brotherhood (his Christian ideal). *Bad* art either fails to infect *or* successfully infects but transmits harmful feelings (sensuality, pride, patriotism, superstition, etc.).
      *   **Your Friend's Implication:** The summary suggests that failing the moral test means it's not art *at all*. Tolstoy is more nuanced (though still scathing). He *might* concede that a piece successfully transmitting a *harmful* feeling (e.g., lasciviousness or jingoistic patriotism) is technically "art" (it infected), but it's *counterfeit* or *pernicious* art. He reserves his strongest condemnation for works he considers *not art at all* because they fail the infection test *entirely* – like much complex, elite art he thinks only simulates art through technique and snobbery without genuinely transmitting a feeling.
  2.  **"Makes you a better person" Oversimplifies:** While Tolstoy undoubtedly believes good art fosters moral improvement by promoting feelings of love and unity, his definition of good art hinges on *what feeling it transmits*, not directly on the *outcome* in the viewer. He assumes transmitting the "right" feelings *will* make people better, but the criterion is the nature of the feeling communicated, not a guaranteed result. "Makes you a better person" is a reasonable *consequence* of his view but not the precise criterion.
  3.  **The Role of Sincerity:** Your friend's summary doesn't highlight a crucial element: **Sincerity**. For infection to occur, the artist *must* have genuinely experienced the feeling they are transmitting. Lack of sincerity is a major reason why Tolstoy thinks much elite art fails – it's manufactured, imitative, or insincere.

  **Where Tolstoy Would Push Back on Your Friend's Summary:**

  1.  **"Art is good if it makes you a better person...":** Tolstoy would say: "Art is *good* if it *successfully transmits feelings of universal love and brotherhood*, which *should* make people better. Art that transmits other feelings, even if it infects, is either bad or counterfeit, regardless of whether it provides transient pleasure or intellectual stimulation. Whether a specific individual *becomes* better is secondary; the *feeling transmitted* is the key."
  2.  **Conflating Failure to Transmit Good Feelings with Not Being Art:** Tolstoy would clarify: "Some things called 'art' fail my infection test entirely – they are *not art*. Other things *are* art (they infect) but transmit bad feelings – they are *bad art*. Only art that infects *and* transmits the highest religious feelings is *good art*. Don't confuse the categories."
  3.  **Oversimplifying the Accessibility Argument:** While condemning class exclusivity, Tolstoy's primary objection to elite art isn't *just* that it appeals to the upper classes, but that its complexity, reliance on convention, and lack of sincere feeling render it *incapable* of infecting ordinary people, thus failing the fundamental definition of art. Accessibility is a *test* of genuine infection, not just a social critique.

  **In Summary:**

  *   **Definition = Infection:** Something *is* art if it successfully transmits a specific feeling from artist to audience via a work.
  *   **Evaluation = Infection + Moral Content:** Art is *good* only if it successfully infects *and* transmits feelings of universal Christian love/brotherhood. Art that infects but transmits bad feelings is *bad art*. Things that don't infect at all are *not art*.
  *   **Sincerity** is essential for infection.
  *   **Accessibility** to all people is a key indicator of genuine art (because true feeling is universal).

  Your friend captured Tolstoy's radical redefinition and moral fervor correctly but blurred the critical line between *what art fundamentally is* (infection) and *what makes it valuable* (infection + specific moral content). You're right to sense that subtle but crucial distinction is missing. Tolstoy's view is that infection defines art, but only infection with the "right" feeling makes it *good* art, and infection with the "wrong" feeling makes it dangerous. Much of what we call art, he argues, isn't art at all because it doesn't genuinely infect anyone.
