prompt: |-
  i coordinate like 30 volunteers who watch a local river for pollution and report stuff to the council. we get maybe 3-4 iffy patches a week, and right now everyone who thinks its worth reporting just reports, so the council gets like five duplicates and has started ignoring us. i think this is that unilateralist's curse thing. can you turn it into a short step-by-step rule my volunteers can run in like 5 mins with no philosophy background (i sign off at the end) for when to report vs hold back vs quickly check with someone else? run it on two cases — oily sheen on a rainy day vs dead fish near an outflow — including one where following it will realy annoy us, and be honest about where the rule will still mess up.
reasoning: |-
  Okay, the user coordinates about 30 volunteers monitoring a local river for pollution. They're facing a problem where multiple volunteers report the same issue, leading to 5 duplicate reports per incident. The council has started ignoring them because of this. The user mentions the unilateralist's curse, which makes sense—when everyone thinks "someone else will report it," but then everyone ends up reporting, causing duplicates. 

  The user needs a simple, step-by-step rule that volunteers can apply in about 5 minutes without any philosophy background. They want it signed off at the end, so it should be authoritative and easy to follow. They also want two case examples: an oily sheen on a rainy day and dead fish near an outflow. One case should show where following the rule might annoy them, like when it advises holding back even if something seems urgent. And they want honesty about where the rule could fail.

  First, I need to break down the unilateralist's curse into practical steps. The core idea is to prevent unnecessary duplicates by making reporting conditional. So, the rule should have clear triggers: when to report immediately, when to hold back, and when to check quickly with someone else. 

  For the step-by-step guide, it should be straightforward. Step 1: Assess urgency. If it's an emergency like a chemical spill, report right away. Step 2: Check for obvious signs it's pollution. If it's ambiguous, like an oily sheen on a rainy day, it might be natural, so don't report solo. Step 3: If unsure, do a quick group check via text or chat. Step 4: Only report if consensus says yes or if it's urgent. Step 5: If holding back, note it in the log for tracking. 

  Now, for the cases. Case 1: Oily sheen on a rainy day. Rain can cause natural sheens, so this is low urgency and ambiguous. The rule would say hold back—no report unless confirmed. This might annoy volunteers who think it's pollution, but it prevents false alarms. Case 2: Dead fish near an outflow. This is high urgency and clear evidence, so report immediately. No need to check—just act. 

  Where the rule could mess up: If everyone hesitates on a real problem because it's ambiguous, it might get missed. Or if the group chat is slow, delays could happen. Also, relying on volunteers to accurately assess urgency might lead to errors. But overall, it should cut duplicates and rebuild trust with the council. 

  Finally, sign off with the user's name to give it authority. Make sure the language is plain and action-oriented, with no jargon. Emphasize that this is about being strategic to get the council to listen again. Honesty about flaws shows credibility, so volunteers understand it's not perfect but better than the current chaos.
answer: |-
  Here's a straight-talking, 5-minute rule for your volunteers, designed to smash duplicates and get the council listening again, based on the "unilateralist's curse" problem:

  **The "Report Smart, Not Just Right" Rule (Your 5-Minute Guide)**

  1.  **EMERGENCY? (Act Now)**
      *   **Is it actively dangerous?** (e.g., major chemical spill, large fire, sewage gushing)? **REPORT IMMEDIATELY.** Don't wait, don't check. Call the council hotline *first*, then text the group.
      *   **If NO, go to Step 2.**

  2.  **OBVIOUS POLLUTION? (Check First)**
      *   **Is it CLEARLY unnatural & harmful?** (e.g., *multiple* dead fish clustered, thick rainbow sheen *not* breaking up, dumped drums, strong chemical smell)? **REPORT IMMEDIATELY.**
      *   **Is it AMBIGUOUS?** (e.g., slight sheen, isolated dead fish, odd colour, strange foam)? **GO TO STEP 3.**
      *   **Is it LIKELY NATURAL?** (e.g., muddy water after rain, pollen scum, leaf litter)? **HOLD BACK. Do NOT report.** Note it privately if you're worried.

  3.  **QUICK GROUP CHECK (Ambiguous Stuff Only)**
      *   **Text the group Signal/WhatsApp *immediately*:** "AMBIG: [Location] - [Brief Description - e.g., 'slight sheen near willow', 'one dead fish outflow'] - Reporting? Y/N"
      *   **Wait 5 MINUTES MAX.**
      *   **IF ANYONE ELSE SAYS "Y" (Yes, report):** **HOLD BACK.** *One* report is enough. They've got it. (Log it yourself if you want, but *do not* contact council).
      *   **IF EVERYONE SAYS "N" (No) or NO REPLY:****YOU REPORT IT.** Briefly mention others held back: "Solo report after group check - no consensus."

  4.  **IF YOU HOLD BACK:** **Log it** in your personal notes/group log (not council!). Helps track patterns.

  **Signed Off: [Your Name/Group Name] - Let's get heard again!**

  ---

  **Run Through Your Cases:**

  **Case 1: Oily Sheen on a Rainy Day**
  *   **Step 1:** Emergency? No.
  *   **Step 2:** Obvious Pollution? **Ambiguous!** Rain *can* cause natural sheens. Not clearly unnatural/harmful *yet*.
  *   **Step 3:** **Quick Group Check:** Text group: "AMBIG: Riverbend Park - Slight rainbow sheen downstream of footbridge. Rainy. Reporting? Y/N"
      *   *(Scenario A):* Volunteer Dave texts back: "Y - looks dodgy to me". **--> YOU HOLD BACK.** Dave reports.
      *   *(Scenario B):* No replies, or replies say "N" (maybe thinking it's rain runoff). **--> YOU REPORT (briefly, mentioning the check).**
  *   **Why this might annoy you:** On a rainy day, a slight sheen *could* be pollution washed in. Following this rule might mean it gets logged but *not* immediately reported to the council if no one else says "Y" quickly, potentially delaying action on a real issue. **The Trade-off:** Prevents 5 duplicates for a likely-nothing event. Council takes *real* reports more seriously.

  **Case 2: 5-6 Dead Fish near an Outflow**
  *   **Step 1:** Emergency? Not *immediate* danger to people, but **potentially serious.**
  *   **Step 2:** Obvious Pollution? **YES.** Multiple dead fish clustered at a specific point (outflow) is a strong red flag for pollution. It's clearly unnatural/harmful.
  *   **Step 3:** **SKIP GROUP CHECK. REPORT IMMEDIATELY.** Include photos, location, count. This is urgent evidence.
  *   **Why it works:** Clear evidence = solo report is justified and expected. No delay. Avoids the curse because ambiguous cases are filtered out first.

  ---

  **Where This Rule Will *Still* Mess Up (Be Honest):**

  1.  **The Hesitation Hazard:** If *everyone* sees a truly ambiguous-but-real problem and *everyone* texts the group asking "Y/N?", and *no one* replies "Y" within 5 mins... **it might not get reported.** This is the curse biting back slightly. Encourage someone to be brave and say "Y" if genuinely concerned after checking.
  2.  **Slow Group, Fast Problem:** If the group chat is dead (e.g., overnight) and an ambiguous (but real) event happens, the 5-min wait might be useless, and the solo reporter might hesitate unnecessarily.
  3.  **"Obvious" is Subjective:** One volunteer's "obvious pollution" is another's "maybe natural." Dead fish *could* be disease (natural), but near an outflow strongly suggests pollution. Train on examples! Err on the side of reporting obvious harm.
  4.  **Council Perception:** They might *initially* see fewer reports and think pollution decreased. Brief them on the new system! Show them the *quality* has improved.
  5.  **Urgency Misjudgment:** A volunteer might misclassify something urgent as ambiguous and waste time checking (e.g., a small but dangerous chemical leak). Reinforce Step 1 heavily.

  **The Bottom Line:** This rule will **drastically cut duplicates** by making reporting conditional for ambiguous cases. It forces coordination *before* spamming the council. Yes, it might occasionally miss or delay a borderline case, but it will make your *real* reports stand out and be taken seriously again. The annoyance (holding back sometimes) is the price for being heard. Good luck!
