  Below is a decision tree designed to clarify positions on the conceivability-possibility link, starting from the shared commitment that a posteriori necessities exist (e.g., water = H₂O). The tree uses 5 branch nodes to separate 6 named positions (and 1 unnamed) based on core disagreements. Branch questions avoid jargon and are answerable without knowing the resulting positions. Positions are separated by their handling of:  
  - Whether conceivability guides metaphysical possibility, epistemic possibility, or neither  
  - How a posteriori necessities affect the link  
  - Grounding of the link (e.g., two-dimensional semantics, fallible heuristic)  

  Positive vs. negative conceivability is noted in leaf descriptions but not used as a branch node, as it doesn’t cleanly separate the core positions given your constraints. The tree prioritizes honest separation over artificial distinctions.  

  ---

  ### **Decision Tree**  
  **Starting Commitment**: Some truths are a posteriori necessities (e.g., water = H₂O).  

  1. **Q1: Does conceivability (under ideal reflection) reliably indicate that a state of affairs is metaphysically possible?**  
     - *Ideal reflection*: Full a priori reasoning ability, excluding empirical knowledge of a posteriori necessities.  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Q2: Is the conceivability-possibility link restricted only to a priori truths?**  
     - *A priori truth*: Knowable independently of experience (e.g., math), distinct from a posteriori necessities.  
     - **Yes** → **Strict a priori rationalist** (e.g., Descartes, rationalist variants).  
     - **No** → Go to Q4.  

  3. **Q3: Does conceivability reliably indicate that a state of affairs is epistemically possible?**  
     - *Epistemic possibility*: Consistent with what we know (e.g., "water isn’t H₂O" was epistemically possible pre-science).  
     - **Yes** → Go to Q5.  
     - **No** → **Deflationary view** (e.g., Churchland, eliminativists).  

  4. **Q4: Do you explain the conceivability of false a posteriori necessities (e.g., "water ≠ H₂O") via two dimensions of meaning?**  
     - *Two dimensions*: Primary intension (epistemic/conceptual) and secondary intension (metaphysical/referential).  
     - **Yes** → **Chalmersian two-dimensionalism** (e.g., Chalmers).  
     - **No** → **Unnamed fallibilist view** (e.g., Yablo, but no unified label).  

  5. **Q5: Are possible worlds concrete entities (like parallel universes)?**  
     - **Yes** → **Lewisian view** (e.g., David Lewis).  
     - **No** → **Kripkean view** (e.g., Kripke).  

  ---

  ### **Resulting Positions & Key Commitments**  
  | **Position** | **Most Awkward Bullet to Bite** | **Conceivability Guide?** | **Handling A Posteriori Necessities** | **Grounding of Link** |  
  |--------------|---------------------------------|---------------------------|--------------------------------------|----------------------|  
  | **Kripkean view** | Conceivability is *only* a guide to epistemic possibility, not metaphysical possibility—even for ideal agents. | Only epistemic | Break the link: Conceivability of p implies epistemic possibility, but not metaphysical possibility (due to rigid designation). | Direct reference theory: Rigid designators block conceivability-to-metaphysics inferences. |  
  | **Lewisian view** | Possible worlds are concrete, causally isolated universes—a radical ontological commitment. | Only epistemic | Break the link: Conceiving p implies epistemic possibility; metaphysical possibility requires a concrete world, but a posteriori necessities constrain world descriptions. | Modal realism: Metaphysical possibility grounded in concrete worlds; conceivability is a fallible heuristic for identifying them. |  
  | **Strict a priori rationalist** | Conceivability only guides metaphysical possibility for a priori domains (e.g., math), leaving a posteriori necessities wholly outside its scope. | Metaphysical (restricted) | Accommodate by exclusion: A posteriori necessities are immune to conceivability tests, as they rely on empirical knowledge. | Conceptual/logical: Link grounded in innate ideas or logical consistency (negative conceivability suffices). |  
  | **Chalmersian two-dimensionalism** | All concepts have two intensions, making semantics systematically ambiguous (e.g., "water" refers to H₂O in secondary intension but "watery stuff" in primary). | Metaphysical (via primary intension) | Accommodate: Conceiving p as false targets primary intension (epistemic possibility), which aligns with metaphysical possibility in a different scenario. | Two-dimensional semantics: Idealized positive conceivability (coherently imagining p) reveals primary intension, guiding metaphysics. |  
  | **Deflationary view** | Conceivability is arbitrary (e.g., tied to psychology or language) and provides no evidence for any kind of possibility. | Neither | Break the link outright: A posteriori necessities exemplify how conceivability fails as a modal guide. | None: Conceivability is epistemically inert; modal knowledge requires science or other methods. |  
  | **Unnamed fallibilist view** | Conceivability is fallible even under ideal conditions—it can mislead about metaphysical possibility (e.g., in a posteriori cases), weakening its reliability. | Metaphysical (fallible) | Break locally: A posteriori necessities are cases where conceivability fails, but the link holds elsewhere. | Heuristic: Conceivability (positive or negative) is a generally reliable but imperfect guide to metaphysics. |  

  ---

  ### **Notes on the Tree**  
  - **Kripkean vs. Lewisian**: These converge on Q1–Q3 (conceivability guides epistemic but not metaphysical possibility). Q5 separates them via their metaphysics of possible worlds.  
  - **Unnamed fallibilist view**: Position lacks a standard label but fits philosophers like Yablo who accept a fallible conceivability-metaphysics link without two dimensions.  
  - **Omissions**:  
    - Positive vs. negative conceivability isn’t a branch node as it doesn’t cleanly split positions (e.g., Chalmers requires positive; rationalists accept negative; fallibilists allow both).  
    - Idealization is built into Q1 ("ideal reflection") to avoid non-ideal cases muddying the link.  
  - **Empty Space**:  
    - **"Q4 Yes + Q2 Yes"** (two-dimensionalism + restricted to a priori) is incoherent—two-dimensionalism explicitly handles a posteriori necessities, so restricting to a priori contradicts its purpose.  
    - **"Q4 No + Q3 No"** (fallibilist + no epistemic link) is unattractive—if conceivability doesn’t even guide epistemic possibility, its fallible metaphysical link becomes unmotivated.  

