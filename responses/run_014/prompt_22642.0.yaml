  I should construct a dialogue where both characters make genuine progress. The naturalist can't just parrot Boorse; they need to engage Brown's point that reference-class selection reflects normative choices (e.g., why not classify by pathology?). For the function debate, the normativist should press how "pumping blood" gets privileged over "making sounds" without teleology, while the naturalist might counter with Cummins-style causal role functions. 

  Key moves to include:
