  The dialogue should end at an aporia - no cheap resolutions. User needs to see where their position strains under pressure. Word count is tight for this complexity, so cases must do heavy lifting. Hereditary height example will illustrate statistical ambiguity, heart example can unpack teleology via valve sounds. 

