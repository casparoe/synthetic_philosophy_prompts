answer: |-
  Here’s a desiderata table for your household helper bot’s theory of "safe Pareto improvements," designed to handle your three test cases while ensuring safety and avoiding circularity. The requirements prioritize **ex post safety**, **informed agency**, and **baseline integrity**, with non-negotiable constraints to prevent harm or manipulation. Key distinctions like ex ante/ex post, actual/informed preferences, and dynamic consistency are enforced.

  | Requirement | Why it matters | Test case | Status |
  |-------------|---------------|-----------|--------|
  | **1. Ex Post Pareto Superiority** | Ensures no one is harmed in the *actual* outcome, preventing bad-luck losses. | **Rescheduling**: Blocks if anyone is worse off ex post, even if ex ante favored. | Non-negotiable |
  | **2. Statewise Dominance** | Demands improvement in *every possible state* (not just expected value), making luck irrelevant. | **Rescheduling**: Fails if any state leaves someone worse off. | Non-negotiable |
  | **3. True Preference Alignment** | Uses *informed, rational preferences* (not stated or misjudged ones) to evaluate outcomes. | **Trade**: Blocks if the trade relies on misjudgment of future behavior. | Non-negotiable |
  | **4. Dynamic Consistency** | Requires preferences/plans to be time-consistent; no naivety about future actions. | **Trade**: Fails if consent assumes unrealistic self-control. | Non-negotiable |
  | **5. Baseline Non-creation** | Baseline must be the *actual status quo*; bot cannot invent threats to "fix." | **Helpful Threat**: Blocks if the bot creates the baseline harm. | Non-negotiable |
  | **6. No Manufactured Improvements** | Prevents "helpful threats" by forbidding bot from causing problems it then resolves. | **Helpful Threat**: Fails if the bot generates the bad baseline. | Non-negotiable |
  | **7. Ex Ante/Ex Post Distinction** | Separates pre-decision expectations from post-outcome reality; ex ante consent ≠ sufficient. | **Rescheduling**: Ex ante agreement doesn’t override ex post harm. | Non-negotiable |
  | **8. Voluntary Informed Consent** | Requires explicit, understanding-based consent from all affected parties. | All cases (e.g., **Trade**) | Negotiable¹ |
  | **9. Compensation Feasibility** | If risks exist, requires reversible changes or compensation mechanisms. | **Rescheduling** (if Statewise Dominance relaxed) | Negotiable² |
  | **10. Preference Stability** | Preferences used must be robust across time/states (avoids context-dependent whims). | Extra: E.g., a snack trade regretted due to hunger shifts. | Negotiable² |

  ### Notes:
  - **Non-negotiable (Safety Core)**: Requirements 1–7 are essential to block harm, manipulation, and circularity. They ensure:  
    - No ex post losers (via 1–2).  
    - No exploiting ignorance (via 3–4).  
    - No baseline gaming (via 5–6).  
    - Distinctions like ex ante/ex post are preserved (via 7).  
  - **Negotiable**:  
    - **8 (Consent)**: Autonomy protection, but bot may still act without consent if 1–7 hold (e.g., small unambiguous improvements).  
    - **9 (Compensation)**: Only relevant if relaxing Statewise Dominance (not recommended).  
    - **10 (Stability)**: Helpful for robustness but hard to verify.  
  - **Joint Unsatisfiability**:  
    - **Ex Ante Efficiency + Ex Post Safety (Requirements 2+7)**: Statewise Dominance (2) ensures ex post safety but often contradicts ex ante efficiency (e.g., mutually beneficial gambles like **Rescheduling**). Resolved by prioritizing ex post safety.  
    - **True Preferences + Feasibility (Requirements 3+8)**: True preferences (3) are ideal but hard to observe; Consent (8) acts as a fallback proxy.  

  ### How Test Cases Are Handled:
  - **Rescheduling**:  
    - Blocked by **Statewise Dominance (2)** and **Ex Post Superiority (1)**, as one person loses ex post.  
    - *Why safe*: Bot avoids creating irreversible harm through bad luck.  
  - **Trade with Misjudgment**:  
    - Blocked by **True Preference Alignment (3)** and **Dynamic Consistency (4)**, as consent relies on false beliefs.  
    - *Why safe*: Bot ignores "stated" preferences if they conflict with rational ones.  
  - **Helpful Threat**:  
    - Blocked by **Baseline Non-creation (5)** and **No Manufactured Improvements (6)**, as the threat is invented.  
    - *Why safe*: Baseline is fixed to the real status quo.  

  ### Design Recommendation:
  Prioritize the **non-negotiable core (1–7)**. This forces the bot to:  
  - Only act when improvements are certain ex post (via Statewise Dominance).  
  - Use a knowledge-based model of "true preferences" (e.g., health, long-term goals).  
  - Never manipulate the baseline.  
  This makes the bot **conservative** but safe—it will leave risky-but-efficient improvements alone, which is consistent with "leave well alone."
