prompt: |-
  I'm working a story on a lab that's using inverse reinforcement learning to steer their model, and there's one specific thing I keep circling back to that I cant quite pin down, so I'd love your help. Their whole approach is that they don't sit people down and ask them to enumerate the values they want the model to optimize for. Instead they just watch what people actually do around the system — which of two candidate responses someone picks, what they edit or correct, how they keep coming back to certain kinds of outputs — and they treat that behavior as the evidence from which the underlying reward function should be inferred. So the model is being aligned to whatever the behavior implies, not to whatever people say.

  And here's the part that's bugging me, because I keep running into it in the interviews: for a lot of the values that actually matter in this space — say, long-term safety, fairness, environmental footprint — what people say they want and what their behavior reveals are often pretty far apart. People will tell you they care deeply about a thing, but their actual choices in the moment consistantly trade it away for convenience or speed, and the IRL pipeline is going to read that behavior as evidence that the reward function simply doesn't put much weight on it. So the inferred preference is the revealed one, and the revealed one is going to be a flatter, more self-interested version of the stated one.

  Can you walk me through the most important implications of that gap? I'm mostly interested in two threads: first, what it means for whether the resulting alignment actually tracks what the people involved would say they wanted, and second, what it does to the broader assumption that you can reliably read off someone's values from their behavior at all — especially for exactly the values where the stated/behavioral divergence is largest. I don't need a survey of the whole IRL literature, just the sharpest version of the problem and where it actually bites.
