prompt: |-
  I am preparing a graduate seminar on moral uncertainty, and I want to clarify a distinction that I think is often elided: the difference between uncertainty over moral theories and uncertainty over moral facts within a fixed moral framework. Please explain this distinction carefully, with attention to the case in which the competing moral theories do not merely disagree about which act is right, but use different evaluative currencies or different decision rules. For example, one theory maximizes aggregate welfare, another treats certain rights as inviolable constraints, and another evaluates conduct primarily by the character of the agent rather than by the consequences of the act. My students keep assuming that if I assign a probability to each theory, I can simply compute a weighted sum of the theories' verdicts and choose the act with the highest expected moral score, but I suspect that this procedure may not always be well-defined when the theories do not share a common value function over acts.

  Could you explain why the expected-value formulation is conceptually unstable in that case, and what alternative ways of representing moral uncertainty would be available, such as probability over value functions, probability over preference rankings, or a view that treats moral disagreement as partly a disagreement about the kind of question being asked? I would prefer an explanation that stays at the level of the conceptual architecture rather than surveying the literature, and that makes clear what must be true for a decision procedure under moral uncertainty to be more than a convenient heuristic.
reasoning: |-
  Okay, the user is preparing a graduate seminar on moral uncertainty and wants to clarify the distinction between uncertainty over moral theories versus uncertainty over moral facts. They specifically mention cases where theories use different evaluative currencies or decision rules—like maximizing aggregate welfare versus inviolable rights versus agent-centered virtues. 

  The key problem they're wrestling with is that students keep defaulting to a naive "expected moral score" calculation (probability-weighted average of theories' verdicts), which breaks down when theories don't share a common value function. The user suspects this is conceptually unstable and wants alternatives that aren't just heuristics. They're clearly frustrated by how often this nuance gets glossed in the literature.

  Hmm, their scenario suggests they're either a PhD candidate or early-career professor—they're deep enough in the weeds to spot this problem but still building pedagogical tools. The request for "conceptual architecture" over literature survey means they want a framework they can diagram on a whiteboard. The emphasis on "not merely disagree[ing] about which act is right" signals they've already covered basic cases of factual uncertainty and are ready for meta-ethical complexity.

  What makes this tricky:  
  First, the incommensurability issue isn't just about different weights on shared values (e.g., utilitarians vs prioritarian welfare weights)—it's about wholly different currencies (welfare vs rights-as-side-constraints vs virtue). A utility function can't natively represent deontological "forbidden acts," since those aren't negative utilities but violations of rules.  

  Second, even if you force theories into preference rankings, ordinal rankings alone lose intensity information. If Theory A says act X is slightly better than Y, but Theory B says Y is catastrophically worse than X, a simple Borda count would miss that asymmetry.  

  Third, some theories (e.g., virtue ethics) don't even output act-evaluations—they assess character, so "translating" them into act-scores requires controversial reduction.  

  The user needs punchy counterexamples. The organ transplant case is classic for utilitarianism vs deontology, but adding virtue ethics makes it richer: A utilitarian sees harvesting organs as +100 utility points (saves five lives), a deontologist sees it as -∞ (murder), and a virtue ethicist might call it -50 (compassionless but technically skilled?). Averaging these "scores" is nonsense—the deontologist's verdict isn't a number but a veto.  

  Alternatives should highlight structural differences:  
  - **Value functions**: Only works if all theories accept a cardinal scale. Fails for lexical priorities (rights > welfare).  
  - **Preference orderings**: Handles ordinal comparisons but flattens intensity (e.g., can't distinguish "slightly wrong" from "abominable").  
  - **Meta-linguistic view**: Treats theories as disagreeing about what morality even is. This avoids reduction but may leave no decision procedure beyond "pick one framework and stick with it."  

  The user's deeper aim might be to shake students out of consequentialist intuitions. Many grad students default to expected utility because it's familiar. Showing how it fails outside welfarism could be revelatory.  

  Should stress that no approach is "neutral"—even choosing how to represent theories presupposes a meta-ethics. The "convenient heuristic" worry is spot-on: Any aggregation method must either impose a common metric (which biases against non-consequentialism) or admit incomparability (which paralyzes action).  

  ...Time to structure this as a dialectic: First expose why the naive view fails, then present alternatives with their trade-offs, finally underscore that moral uncertainty might require fundamentally different tools than empirical uncertainty.
answer: |-
  Your distinction is crucial and often overlooked. Let me clarify the architecture step by step, using your example theories:

  **Core Distinction:**
  - **Moral Fact Uncertainty:** Within a **single moral framework** (e.g., utilitarianism), you're uncertain about *non-moral facts* (e.g., "Will this policy cause 100 or 200 units of welfare?"). Expected value maximization works here because the *currency* (welfare) and *decision rule* (maximize sum) are fixed.
  - **Moral Theory Uncertainty:** Uncertainty about **which moral framework is correct**, where frameworks may have:
    - Different *evaluative currencies* (welfare vs. rights-violations vs. virtue-expressions)
    - Different *decision rules* (maximization vs. constraints vs. character-assessment)
    - Different *structures* (consequentialist vs. deontological vs. aretaic)

  **Why Weighted Averaging Fails (Conceptual Instability):**
  1. **Incommensurable Currencies:**
     - Utilitarianism (T1) scores acts on a cardinal scale (e.g., +50 welfare units).
     - Deontology (T2) uses a lexical ranking: Acts violating rights are *forbidden* (score = -∞?), others permissible.
     - Virtue Ethics (T3) evaluates the *agent's character* (e.g., "Act X expresses courage but not compassion").
     - **Problem:** There's no common scale. Averaging T1's "+50", T2's "-∞", and T3's "mixed character" is mathematically and conceptually incoherent. Is "−∞" just a very large negative number? Does "character" reduce to a cardinal score?

  2. **Different Decision Rules:**
     - T1 *ranks acts* by summing welfare.
     - T2 *filters acts*: Some acts are impermissible regardless of consequences.
     - T3 *evaluates agents*, not acts directly.
     - **Problem:** Weighting outputs presumes all theories output the *same type* of verdict (e.g., a cardinal act-score). T2's "constraint" isn't a score—it's a veto. T3's evaluation isn't act-focused.

  3. **Structural Incomparability:**
     - Theories answer fundamentally different questions:
       - T1: "Which act maximizes good states of affairs?"
       - T2: "Which acts respect moral constraints?"
       - T3: "What would a virtuous agent do?"
     - **Problem:** Aggregating answers to different questions doesn't yield a unified answer. It’s like averaging answers to "What is 2+2?" (4), "Is Paris in France?" (True), and "What color is the sky?" (Blue).

  **Alternative Representations of Moral Uncertainty:**
  1. **Probability over Value Functions (Still Problematic):**  
     Assign probabilities to theories, then represent each as a *value function* over acts (e.g., T1: V₁(a), T2: V₂(a)...). But:
     - **Forcing Incommensurables:** Assigning cardinal scores to T2 or T3 requires controversial reductions (e.g., giving "rights violations" a finite negative score). This distorts the theories.
     - **Example:** If T2 says killing one to save five is *infinitely worse* than not killing, V₂(kill) = -∞, making expected value -∞ regardless of other theories' probabilities. But is "infinity" the correct representation?

  2. **Probability over Preference Orderings:**  
     Represent each theory as a *ranking* of acts (e.g., T1: a > b > c; T2: b > a ≈ c [if a,c violate rights]). Then compute a "meta-ranking" (e.g., via Borda counts or stochastic dominance).  
     - **Advantage:** Avoids cardinal scales.
     - **Limitation:** Loses intensity (e.g., T1 may see a as *slightly* better than b, while T2 sees b as *dramatically* better than a). Also, handling incommensurability (T2's "≈") remains tricky.

  3. **Disagreement about the Question (Meta-Ethical View):**  
     Moral theories aren't just disagreeing about acts; they’re disagreeing about *what morality is*. 
     - **Implication:** There may be no "moral fact of the matter" about which act is best *simpliciter*. Instead:
       - **Theory-Specific Prescription:** "Given my credences, I should do what maximizes expected choiceworthiness *relative to a privileged standardization*" (but how to standardize?).
       - **Procedural Approaches:** Use decision rules designed for fundamental disagreement (e.g., minimize regret across theories, satisfy "second-order" principles).

  **When is a Decision Procedure More Than a Heuristic?**  
  For act-aggregation to be principled, we need:
  - **Common Ontology of Value:** Theories must share a *structure* (e.g., all are consequentialist with different goods).
  - **Cardinal Comparability:** Verdicts must be expressible in a common, cardinal scale *without distorting the theories*.
  - **Act-Focused Outputs:** All theories must evaluate *acts* (not agents or rules).

  **Your Case Study: Organ Transplant Dilemma**  
  - **T1 (Utilitarianism):** Harvesting organs (+100 welfare) > Not harvesting (0 welfare).  
  - **T2 (Deontology):** Not harvesting (permissible) > Harvesting (forbidden).  
  - **T3 (Virtue Ethics):** Not harvesting (compassionate) > Harvesting (callous).  
  - **Naive Aggregation:** If P(T1)=0.4, P(T2)=0.3, P(T3)=0.3, "average score" of harvesting = 0.4*(100) + 0.3*(-∞) + 0.3*(-50) = -∞.  
    → **Flaw:** T2 doesn't output "-∞"; it outputs *"impermissible"*. T3's "-50" is arbitrary.  

  **Conclusion for Your Seminar:**  
  The key insight is that **moral theory uncertainty involves uncertainty about the *framework for evaluation itself***. Weighted averaging only works when theories share a value structure—otherwise, it imposes artificial commensurability. Alternatives exist, but all face trade-offs between faithfulness to theories and computational tractability. This reveals a deeper meta-ethical challenge: Without a privileged standardization, moral uncertainty may lack a uniquely rational decision procedure. Emphasize that moving beyond heuristic aggregation requires engaging with *how* theories conceptualize morality—not just their outputs.
