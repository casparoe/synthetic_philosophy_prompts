prompt: |-
  Quick one. I'm an actuary, and I've been given the twenty-minute "stretch topic" slot at our monthly team meeting to present the Ellsberg paradox. Audience is eight actuaries and a couple of underwriters — all fluent in expected value, none of them have read any decision theory. I don't want you to explain it to me; I want a plan for how I should explain it. Specifically: the order the pieces have to go in (what has to be in place before the paradox can even register for this crowd), what to build it around — I'm assuming the classic two urns, one with a declared 50/50 red/black split and one where I refuse to say the mix, but tell me if something else carries it better — and the misconceptions this particular audience will form, plus where exactly in the sequence to head each one off. I can definately predict one: someone will say it's just risk aversion. The one that worries me is the guy who'll say "so assign 50/50 by indifference and the whole thing collapses back into expected value" — I half-see why that move doesn't rescue the standard story, but I could not defend it under questioning, so build the plan around handling him specifically. Also tell me what I should openly refuse to cover at this level and say so, and give me one question I can ask at the end to check the idea actually landed. Keep the whole plan under 450 words — I know that's tight for all this, that's the point.
reasoning: |-
  Okay, the user is an actuary preparing a 20-minute presentation on the Ellsberg paradox for colleagues. They need a structured plan that builds understanding step-by-step. The audience knows expected value but not decision theory. 

  Key constraints: Must handle two predictable objections ("just risk aversion" and "assign 50/50 by indifference") and explicitly exclude certain topics. Also needs a verification question. All under 450 words.

  First, I consider the audience's perspective. Actuaries and underwriters will instinctively try to reduce this to probabilistic terms. The "50/50 by indifference" objection is especially critical - if not dismantled, it invalidates the whole paradox. 

  For structure:
  - Start with the concrete urn setup (known vs ambiguous) to ground abstraction
  - Explicitly state the known urn's probabilities to establish baseline rationality
  - Contrast choices (bet on red) to reveal the preference reversal
  - Force them to notice the contradiction before explaining ambiguity aversion

  The "50/50" rebuttal needs careful handling:
  1. Acknowledge it seems logical
  2. Point out it contradicts revealed preferences (they treat the urns differently)
  3. Emphasize this violates expected utility's core axioms

  I'll exclude Savage axioms and cognitive psychology roots to stay focused. The verification question should test if they grasp ambiguity vs risk distinction.

  Potential pitfalls to address:
  - Early interruption about risk aversion: Defer by saying "We'll test that next"
  - Probability assignment attempt: Build the rebuttal into the flow

  The whole sequence must take <15 minutes to allow discussion. Key is making them feel the paradox before labeling it.
answer: |-
  Here’s a battle-tested 20-minute plan (443 words):

  **1. Groundwork (3 min)**:  
  Introduce two urns:  
  - **Urn A**: Exactly 50 red/50 black balls (known risk).  
  - **Urn B**: 100 red/black balls, *unknown proportion* (ambiguity).  
  Emphasize: No priors about Urn B’s mix; it could be 100 red, 0 red, or anything.  

  **2. Stage the Paradox (5 min)**:  
  *Choice 1*: Bet on red. Which urn?  
  Most choose Urn A (known 50%).  
  *Choice 2*: Bet on black. Which urn?  
  Most *still* choose Urn A.  
  → Reveal inconsistency: If Urn B had >50% red, you’d prefer it for red bets. If <50%, you’d prefer it for black. But choosing A both times implies you believe Urn B is *simultaneously* <50% red AND <50% black — impossible.  

  **3. Preempt "Just Risk Aversion" (2 min)**:  
  *When someone interrupts:* "Hold that thought! Notice: betting on red in A vs B has identical *objective* risk (50% if B is 50/50). Yet people avoid B. Risk aversion can’t explain this—it’s *ambiguity aversion*."  

  **4. Crush "Assign 50/50 by Indifference" (7 min)**:  
  *When the critic speaks:* "Ah, the Bayesian fix! But watch:  
  - If we impose P(red) = 0.5 for Urn B by indifference, both urns seem identical.  
  - BUT: People *don’t* treat them as identical (they prefer A).  
  - So either:  
    (a) They’re irrational (but consistently so!), or  
    (b) Expected utility theory *fails* here because it assumes fixed probabilities.  
  Ambiguity aversion violates Savage’s axioms—it’s not about probability *values*, but *how they’re formed*."  

  **5. The Point & What to Ignore (2 min)**:  
  "This shows: People dislike not knowing probabilities *more than* knowing unfavorable ones. Real-world takeaway: Ambiguity matters in insurance (e.g., novel risks).  
  *Explicitly skip*:  
  - Cognitive psychology roots  
  - Alternative models (MaxMin EU, etc.)  
  - Generalizations beyond 2 colors  

  **6. Landing Check (1 min)**:  
  End with: **"So—why can’t we resolve this by just calling both urns 50/50?"**  
  *Correct answer*: Because that ignores the *source* of uncertainty (knowledge vs ignorance), which decision-makers care about.  

  ---

  **Why this works**:  
  - **Order** forces the contradiction *before* labeling it. Actuaries feel the tension.  
  - **Rebuttal structure** for the critic: Shows indifference assignment is arbitrary and contradicts revealed preferences.  
  - **Exclusions** keep focus sharp; avoids rabbit holes.  
  - **Final question** tests grasp of ambiguity vs risk. If they get it, they’ll articulate the key distinction.  

  **Pro tip**: Use live polls (raise hands) for Choices 1/2 to engage them. When they see peers choosing A both times, the paradox lands harder.
