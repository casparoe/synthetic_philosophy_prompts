prompt: |-
  Two weeks from now I'm up at our decision theory reading group and I'm already dreading the Q&A, so I want a prep sheet. The thesis I'm defending, roughly: the usual way of stating superrationality — in a one-shot prisoner's dilemma between two identical reasoners you should cooperate because your reasoning and theirs is the same reasoning — is either trivially true or plainly false depending on what "identical" is doing, and the fix is to drop the talk about identity and model the two players as having decision procedures drawn independently from a shared prior over procedures. Once you set it up that way, cooperating in a one-shot PD is just the expected-value-maximizing move, the spooky "logical correlation" between the two choices turns into an ordinary conditional probability, and the real work becomes saying what licenses the shared prior. If the prior is just a fact about the world, I've reinvented evidential decision theory with extra steps. If it's a constraint on which decision procedures count as rational, then I owe an account of why rationality has that constraint — and that's the part I'm least sure of.

  The room is eight people and I know alot of what's coming. Three are economists who do game theory and think "rational" just means "no profitable unilateral deviation"; any refinement that needs a story about the players' algorithms looks to them like either an empty relabeling or repeated-game logic smuggled into a one-shot game. Two are committed causal decision theorists who've both worked on Newcomb's problem and think conditioning on your own action is a mistake, period. One works on team reasoning / we-mode and thinks the whole "what should I do" framing is the error — the question should be what we should do. One is a logician who will ask how a finite agent can condition on facts about its own decision procedure without self-reference trouble. And one does bounded rationality and thinks the setup quietly assumes players with perfect introspective access to their own algorithms.

  What I want back: the eight or so objections I'll actually get from this room — not the ones the internet decision theory crowd would give me — ordered by how much damage they'd do, each phrased the way that specific person would put it, what I say back in about two minutes, and where that answer is weak. Flag any two of them that are really one objection wearing different hats. Tell me what to concede in the first minute so I don't burn the Q&A on it, and which exchange, if I lose it, actually kills the view rather than costing me a footnote. And the one question I'm praying nobody thinks to ask. Assume theres nobody there who's read the recent agent-foundations literature, so don't lean on it — if a reply only works becuase of some result from that literature, say so and tell me what to do instead.
reasoning: |-
  Okay, let me start by understanding the user's request. They're preparing for a Q&A session in their decision theory reading group. The main thesis is that the standard superrationality argument in the Prisoner's Dilemma is flawed because it relies on vague notions of "identical reasoners." Instead, they propose modeling players with decision procedures drawn from a shared prior. The goal is to handle objections from eight specific group members, each with their own expertise.

  First, I need to break down each participant's likely objections. The economists will probably dismiss the approach as relabeling or smuggling in repeated-game logic. The causal decision theorists will reject conditioning on one's own action. The team-reasoning advocate might argue that the individualistic frame is wrong. The logician will worry about self-reference in conditioning. The bounded rationality expert will question introspective access.

  Next, I should organize these objections by damage level. The economists' objections could be high damage because they challenge the foundational relevance. The logician's point on self-reference might be technically severe but possibly addressable. The causal theorists' critique could be moderate if the user can differentiate their approach from typical CDT issues.

  I notice that the bounded rationality and logician objections might both stem from computational feasibility concerns. That's two hats on one core issue. The user should concede early on the shared prior's justificatory gap to avoid wasting time. The killer question might be about why two agents with the same prior would independently draw procedures without a causal link, which could collapse into evidentialism.

  The user's unspoken need is to defend their thesis convincingly without relying on niche literature. They want practical, tailored responses that resonate with each critic's background. Ensuring clarity on how their model avoids triviality while addressing the "spooky" correlation is key. Also, preempting the shared prior's justification as a rationality constraint is crucial but underdeveloped, so they need a fallback position.
answer: |-
  Here's your Q&A prep sheet, calibrated for your specific audience and ordered by potential damage. Key concessions and vulnerabilities are flagged.

  ### Damage Order & Objections (High to Low)
  1.  **The Economists (Joint Objection - "Relabeling or Repeated Game Smuggling"):**
      *   **Objection (How they'll say it):** "This is either meaningless or cheating. If 'rationality' requires coordinated priors over *algorithms*, you've just redefined 'rational players' in this specific context to be players who are *de facto* coordinated. It's circular. Alternatively, this 'shared prior' sounds suspiciously like you've assumed they've played before or share a culture/history, turning your one-shot game into an implicit repeated game. Where's the novelty?"
      *   **Your 2-Minute Reply:** "The novelty is in decoupling coordination from repeated interaction or explicit communication. We're asking: *Can* two perfectly rational agents, facing *only* this one interaction, coordinate via their *understanding* of rationality itself? The shared prior represents their common *theory of rational agency*, not historical interaction. It's not circular *if* we can justify this common theory as *part* of rationality. It's distinct from repeated games because there's no history, no future, no reputation – just reasoning about the simultaneous choice problem under uncertainty about *how* the other reasons."
      *   **Weakness:** The "justification" of the shared prior *as a rationality constraint* is your Achilles heel. The economists are right that without a strong justification, it *does* look like redefining rationality *post hoc* for this outcome.
      *   **Concede Early?** YES. In the first minute: "You're right to doubt the shared prior. I agree it *could* collapse into relabeling or smuggling if we can't justify it as a *rational* constraint. The core of my argument is that *if* we accept this common-prior-over-procedures model as capturing a deep feature of rational agency, then cooperation emerges naturally. The challenge is justifying that 'if'."

  2.  **The Logician (Self-Reference Trap):**
      *   **Objection:** "How does the agent compute this expected value? To condition on `My_Algorithm = A_i`, it needs to *know* A_i. But for a finite reasoner, specifying A_i precisely might require more resources than the agent has, leading to undecidability or paradox. How do you avoid the agent needing a Godelian oracle just to choose?"
      *   **Your 2-Minute Reply:** "This is a crucial practical limitation. The model is an *idealization* for logically omniscient agents, highlighting a conceptual possibility. For bounded agents, we need approximations: coarse-grained views of their own procedure ('I tend to cooperate', 'I use tit-for-tat heuristics') or meta-reasoning that avoids full self-specification. The point is the *structure* of the reasoning: you condition on what you *can* know or reasonably believe about your own decision-making process."
      *   **Weakness:** This forces you out of the clean, abstract model into the messy world of bounded rationality. It highlights a gap between your idealized solution and implementable rationality.
      *   **Killer Potential?** High if pressed hard on implementability, as it undermines the model's relevance.

  3.  **Causal Decision Theorist #1 (Action Conditioning is Error):**
      *   **Objection:** "You're conditioning on your own action (`P(Their_Choice | My_Choice)`), which is exactly the mistake CDT avoids! In Newcomb, conditioning on taking one box makes it seem like a good idea, but CDT correctly ignores that spurious correlation and takes two boxes. You're making the same error here, mistaking evidential correlation for causal influence."
      *   **Your 2-Minute Reply:** "The correlation here isn't spooky or evidential like in Newcomb. It arises *causally* from the setup. The other player's choice *is* causally influenced by *their* decision procedure, and our shared prior means that *my* decision procedure provides information about *theirs*. Learning `My_Algorithm = A_i` provides evidence about `Their_Algorithm` (via the prior), which in turn provides evidence about `Their_Choice`. This is valid evidential reasoning about a causally connected system (their brain/algorithm). CDT ignores information legitimately gleaned from introspection about one's own state."
      *   **Weakness:** This hinges entirely on your argument that the correlation *isn't* spooky but arises legitimately from the causal structure of the shared prior model. CDT advocates will be deeply skeptical of conditioning on your own action *ever* being rational.

  4.  **The Bounded Rationality Expert (Introspection Access):**
      *   **Objection:** "This whole setup assumes agents have perfect, costless access to their own decision procedure (`A_i`) to condition on it. Real agents don't. They have limited introspective access, models of themselves are imperfect and costly to construct. Your model silently assumes agents who *already* know themselves perfectly, which is unrealistic and bypasses the core challenges of bounded rationality."
      *   **Your 2-Minute Reply:** "Absolutely correct. The model is an ideal benchmark. For real agents, the key takeaway is *meta-awareness*: reasoning about the *kind* of player you are or the *type* of procedure you use *can* provide valuable information about others, especially if there's reason to believe they reason similarly. The practical value lies in recognizing this channel of information, not in assuming perfect self-knowledge. We can build bounded models incorporating coarse self-models."
      *   **Weakness:** Significantly weakens the claim that this is *the* rational solution for one-shot PDs, reframing it as a useful perspective for certain bounded contexts.
      *   **Shared Core with Logician?** YES. Both objections (#2 & #4) stem from the **computational/informational feasibility** of the agent knowing `A_i` precisely enough to condition on it. The Logician focuses on logical limits, Bounded Rationality on practical/cognitive limits.

  5.  **Causal Decision Theorist #2 (Where's the Cause?):**
      *   **Objection:** "Even granting your shared prior, how does *my* choice of cooperate *cause* the other player to cooperate? Without a causal mechanism linking my action now to theirs now, CDT dictates defect. All you have is correlation, which doesn't justify the action."
      *   **Your 2-Minute Reply:** "I'm *not* claiming my choice *causes* theirs in the one-shot PD. The causal link is indirect: *Both* our choices are caused by our respective decision procedures. The shared prior creates a *common cause* structure: the prior distribution is a common cause of both our algorithms. Discovering *my* algorithm (`A_i`) gives me information about the prior, which gives me information about *their* likely algorithm, which gives me information about *their* likely choice. I cooperate because *knowing what I know about myself* makes me believe cooperation is the *evidentially* expected-value maximizing move, given the information my self-knowledge provides about *them*."
      *   **Weakness:** Requires the CDT advocate to accept that evidential reasoning based on legitimate self-knowledge is sometimes rationally required, even when no direct causal link exists. They are unlikely to concede this.

  6.  **The Team Reasoner (Wrong Frame):**
      *   **Objection:** "You're still stuck in the individualistic 'I-mode'. The problem is you're asking 'What should *I* do?' when the truly rational question is 'What should *we* do?'. Once you adopt the 'we-mode', cooperation is the obvious collective rational choice. Your shared prior is a convoluted way to sneak in collective reasoning without admitting it."
      *   **Your 2-Minute Reply:** "My approach *is* individualistic, I agree. But it tries to show how an individual, reasoning *only* about their own payoff and their own reasoning process, *can* arrive at cooperation in a one-shot interaction, *without* needing to adopt a collective perspective or assume collective agency. It shows that 'I-mode' reasoning, under a specific model of shared rational foundations, can lead to the collectively optimal outcome *as if* team reasoning occurred. It's a potential individualistic justification for the outcome team reasoning prescribes."
      *   **Weakness:** The team reasoner will see this as an inferior, roundabout justification for their view, missing the essential shift in agency.

  7.  **The Economists (Follow-up / "Just EDT"):**
      *   **Objection:** "You admitted the shared prior might be 'just a fact'. If it is, then your whole model *is* just Evidential Decision Theory (EDT) applied to the PD with a specific, arbitrary prior belief about the correlation between player types. Where's the 'superrationality'? You've reinvented EDT with extra steps and a very strong, unmotivated prior assumption."
      *   **Your 2-Minute Reply:** "You're largely right. *If* the shared prior is merely a contingent fact about the world, then yes, this reduces to applying standard EDT to a PD where players have beliefs about their own and others' types correlated via that prior. The 'superrationality' aspiration was to ground the shared prior *in rationality itself* – to argue that rational agents *must* have this shared prior over procedures as part of what it means to be rational. That's the ambitious claim, and where the debate lies. Without that, it's indeed interesting EDT applied to correlated types."
      *   **Weakness:** This exposes the core vulnerability. If you can't defend the shared prior as a *rationality constraint*, your view collapses into a specific application of EDT, losing its claim to novelty or resolving the "spooky" correlation in a unique way. **This exchange could kill the view** if you can't compellingly argue for the shared prior as constitutive of rationality.

  ### The Killer Question You Pray Nobody Asks
  *   **The Question:** "Why should two rational agents, operating independently with no communication or causal link *except* for both being 'rational', have *any* non-trivial shared prior over decision procedures? What *specific* property of rationality *forces* them to assign anything other than a uniform or maximally uncertain prior over *all conceivable* decision procedures (including wildly irrational ones)? Why wouldn't they each think the other is just as likely to be an irrational defector as a cooperator, even knowing themselves to be rational?"
  *   **Why it's Killer:** This strikes directly at the heart of the "justification" problem you identified. It forces you to articulate *exactly* what the constraint is. Appeals to "logical uncertainty" or "similar reasoning" are vague. Without a concrete, non-circular answer grounded in something other than the desired outcome (cooperation), your ambitious claim (shared prior as rationality constraint) looks completely unfounded or question-begging. *This is the question you are least sure of yourself.*
  *   **How to Handle It (If Asked):** Be honest about the challenge: "This is the hardest open question. My *hope* is that a satisfactory theory of rational agency will imply constraints on how a rational agent models other rational agents, leading to non-trivial agreement. Perhaps it stems from rationality requiring agents to model others as using *methods* they themselves could endorse, converging on a prior. But I admit, I don't have a fully worked-out, non-circular justification yet. This is the critical next step." (This is damage control – you concede the point is unresolved).

  ### Summary of Critical Moves
  1.  **Concede Early (First Minute):** Acknowledge that the *justification* for the shared prior over decision procedures as a *rationality constraint* is the major open challenge and the core of the debate. Without it, the model risks being relabeling, EDT-in-disguise, or smuggling.
  2.  **Defend the Structure:** Focus on how the model *dissolves* the "spooky" correlation into standard conditional probability given a specific (shared prior) setup.
  3.  **Distinguish from Repeated Games:** Emphasize the lack of history/future/reputation.
  4.  **Distinguish from Newcomb:** Argue the correlation is legitimately causal (via the common cause of the shared prior influencing both procedures).
  5.  **Acknowledge Idealization:** Concede the model assumes logical omniscience/perfect introspection for clarity, but the *insight* (using self-knowledge to infer others) applies approximately to bounded agents.
  6.  **The Real Kill Shot:** If you lose the argument that **the shared prior is a necessary consequence of rationality itself** (Objections #1 & #7), the ambitious version of your thesis ("the fix" requiring the constraint) is dead. You're left with an interesting EDT model with a strong prior assumption. Don't burn excessive time defending the unjustified constraint – acknowledge the challenge and pivot to the model's structure and explanatory value if conceded.
  7.  **Pray:** That nobody asks the "Why *must* the prior be non-trivial?" question directly. If they do, be candid about the unresolved challenge.

  Good luck! Your framing is insightful and highlights the core tension well. The Q&A will be tough because you're tackling the hardest part head-on. Focus on clarity about the *structure* of your model and the *nature* of the challenge you've identified.
