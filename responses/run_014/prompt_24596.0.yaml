answer: |-
  Here's a rigorous translation of Neurath's philosophical theory into your grammar-of-graphics vocabulary, followed by a residue analysis:

  ### (1) Picture Script vs. Picture Language
  *   **Your Vocabulary Translation:**
      *   **Picture Script:** Naturalistic marks (e.g., detailed icons, photographs) acting as **scenes**. Interpretation relies heavily on *pre-attentive processing* of realistic form and *post-attentive* contextual/cultural knowledge. It functions like a single, complex visual channel overloaded with potential signals.
      *   **Picture Language:** Abstract, standardized **marks (points, lines, area glyphs)** using highly conventionalized **visual channels (shape, color hue/saturation)**. Meaning is defined by *denotative rules* (a "grammar"), not resemblance. Relies on *pre-attentive* recognition of simple forms but requires *learned conventions* for specific denotation. Operates like a controlled *discrete scale* for concepts.
  *   **Distortion:** Your framework handles *marks* and *channels* well, but lacks a strong concept of "scene reading" vs. "sign reading." Neurath's distinction is fundamentally *semiotic* (icon vs. symbol). Your vocabulary describes *how* marks look, not *how they signify* at this deep level.
  *   **No Expression:** The inherent *epistemological claim* that mimetic representation ("picture script") is inherently less precise, more ambiguous, and culturally bound than abstract denotation ("picture language"). Your vocabulary is agnostic on this.

  ### (2) International, Non-Parasitic Scientific Language
  *   **Your Vocabulary Translation:**
      *   **International:** Visualization **scales (especially discrete/ordinal)** and **mark definitions** should be *culture-neutral* and learnable without prior linguistic knowledge. **Color palettes** should be chosen for perceptual discriminability, not cultural connotations.
      *   **Non-Parasitic:** The meaning of marks/channels should be defined by the *visual system's internal grammar and legend*, not by captions or titles relying on natural language grammar. Charts should be *self-contained semantic units*.
      *   **Scientific/Empirical:** Focus on **quantitative variables** mapped to **position, length, area** channels, and **categorical variables** mapped to **color hue, shape**. Maximizes **data-ink ratio** for empirical facts.
  *   **Distortion:** Your vocabulary supports *culture-neutral design goals* but acknowledges cultural baggage exists (e.g., color meaning). The "non-parasitic" ideal is extreme; even Isotype relied heavily on *text legends*. Your grammar *assumes* integration with text (axis labels, titles) for full comprehension.
  *   **No Expression:** Neurath's core belief that a *fully autonomous visual language* for science is achievable and necessary. Your vocabulary sees visualization as a *complement* to text/number, not a replacement. The political drive for *universal working-class education* via images is absent.

  ### (3) Denotative vs. Expressive Function
  *   **Your Vocabulary Translation:**
      *   **Denotative:** The core task: Mapping **variables (quantitative/categorical)** to **visual channels (position, length, color hue, shape)** via **scales** to accurately encode data. Prioritizes channels known for *accurate magnitude estimation* (position, length) or *clear categorical discrimination* (hue, shape). Embodies **Tufte's data-ink ratio**.
      *   **Expressive:** Visual elements introducing non-data-driven meaning, emotion, or style. Seen as "noise" or "chartjunk." Includes overly naturalistic marks, decorative textures, unnecessary 3D effects, or **color channels** used for purely aesthetic, non-data reasons. Violates data-ink maximization.
  *   **Distortion:** Clean fit. Your framework inherently values denotation (accurate data encoding) and discourages non-functional expressiveness as hindering clarity and accuracy.
  *   **No Expression:** Neurath's *moral/political dimension*: Expressiveness is not just inefficient, it's potentially *misleading* or *ideological*, smuggling in bourgeois sentimentality or irrationality. Suppressing it is an act of intellectual hygiene and democratic clarity.

  ### (4) Natural Language Surplus vs. Picture Language Purity
  *   **Your Vocabulary Translation:**
      *   **Natural Language Surplus:** The "baggage" Neurath decries translates to unavoidable *connotation* and *contextual dependency* in text elements (titles, labels, legends). This introduces ambiguity, cultural bias, and potential for misinterpretation compared to the perceived precision of visual encoding. High potential for low "data-ink ratio" in text.
      *   **Picture Language Purity:** Achieved by rigorously defining **marks** and their mappings (**channels** + **scales**) within a controlled system (like Isotype). Minimizes connotative noise, maximizing denotative clarity. Relies on the inherent *pre-attentive* power of simple visual comparisons.
  *   **Distortion:** Your vocabulary acknowledges that *text has limitations* (ambiguity, translation needs) and *visual encoding has strengths* (pattern recognition). However, it doesn't share Neurath's belief that visual language can be *radically purified* or exist independently. You know visual channels *also* carry cultural connotations (e.g., red=danger) and require learning.
  *   **No Expression:** Neurath's underlying *Logical Positivist epistemology*: Natural language is inherently "metaphysical" and unscientific due to its historical accretion of meaning. Picture language is a tool for *empiricist verification* and the elimination of "meaningless" statements. This is a profound philosophical stance, not just a design preference.

  ---

  ### Residue Report: What Survives, What Doesn't, and Why

  1.  **Survives Cleanly (+):**
      *   The core value of **abstract marks** over naturalistic ones.
      *   The priority of **denotative encoding** (mapping data to channels) over expressive decoration.
      *   The drive for **clarity and efficiency** (high data-ink ratio).
      *   The use of **conventional symbols** defined by a system/legend.
      *   The strength of **pre-attentive processing** for simple visual comparisons.

  2.  **Survives with Distortion (~):**
      *   **Internationalism:** Your vocabulary supports the *goal* but acknowledges the practical reality of cultural connotations in visual channels and the *necessity* of some text. Neurath's ideal of pure visual autonomy is unattainable.
      *   **Non-parasitic on Language:** Your grammar *assumes* symbiosis with text/captioning. Isotype's attempt at radical autonomy appears naive or extreme within your framework. The legend *is* parasitic, just minimized.
      *   **Suppressing Expression:** You agree non-functional elements are bad, but lack the *moral/political fervor* Neurath attached to purging "unscientific" expressiveness.

  3.  **Does Not Survive / Residue (-):**
      *   **The Epistemological Claim:** Neurath's belief that picture language is fundamentally *superior* and *more scientific* than natural language due to its ability to avoid historical/connotative baggage. Your vocabulary is *pragmatic*, not epistemological. You know visual encoding has its own ambiguities and requires learning/conventions.
      *   **The Radical Autonomy Goal:** The idea that a visualization can be a *complete, self-sufficient language* replacing text for conveying complex empirical/scientific content. Your grammar sees visualization as a powerful *component* within a larger communicative act involving text and numbers.
      *   **The Political Program:** Neurath's project was deeply tied to socialist education and democratizing scientific knowledge by bypassing "bourgeois" language. Your vocabulary is technical, apolitical engineering.
      *   **The Semiotic Foundation:** The strict Peircian distinction between icon (picture script) and symbol (picture language) underpinning his theory. Your vocabulary describes visual *form and function*, not semiotic *mode*.

  ### Conclusion: Intuition vs. Residue

  *   **Your intuition is partially correct:** Isotype *is* conceptually an early, less formalized, and more constrained ancestor of the grammar of graphics. Its core innovations (abstract marks, systematic mapping, emphasis on clarity) are foundational to your field. Technically, much translates well.
  *   **However, the residue is significant and revealing:** The failure isn't primarily a defect of *your vocabulary*. It's a sign that **Neurath quietly bundled a powerful, but ultimately unsustainable, epistemological and political program onto his technical innovation.** He believed his "picture language" could:
      1.  **Replace** natural language for scientific communication.
      2.  **Purify** knowledge by stripping away historical/connotative "metaphysics."
      3.  **Democratize** science by being universally accessible and ideologically neutral.
  *   **The Grammar of Graphics implicitly recognizes:**
      *   Visualization is a powerful *complement* to text/numbers, not a replacement.
      *   Visual encoding carries its own cultural and learned connotations; pure denotation is a myth.
      *   "Baggage" isn't solely linguistic; it's cognitive and cultural, affecting visuals too.
      *   The goal is effective *communication*, not epistemological purification.

  The residue exposes Neurath's project as **less coherent** than it appears. His brilliant technical design principles were burdened by a grandiose (and arguably positivist-naive) philosophical and political ambition that the technical system itself could never fully bear. Your vocabulary succeeds precisely because it sheds that unsustainable baggage, focusing on the robust, adaptable *how* of visual encoding rather than the fraught *why* of replacing language or purifying knowledge. The residue isn't a lack in your tools; it's the discarded weight of Neurath's overreach.
