prompt: |-
  Act as a philosopher of biology who's taught this material for twenty-some years and graded hundreds of exam answers on adaptationism and evolutionary psychology — someone who can spot a confident-but-wrong sentence from across the room. Think carefully. Before you grade anything, spend a few lines brainstorming what a genuinely strong answer to this question would have to contain, so I can tell whether you're grading against the question or against the student's rhetoric.

  Context: I TA an upper-level seminar in philosophy of biology. This was the second midterm question, 40 minutes, about 700 words allowed. The case in the question is one I made up for the exam, though it's modeled on a familiar line of research. Here it is:

  **QUESTION 2.** Researcher R reports the following. Across 37 populations on six continents, including four with no documented contact with each other or with mass media, adults rank a female waist-to-hip ratio near 0.7 as most attractive; R's experiments show the preference tracks the ratio itself rather than overall body size or absolute waist circumference. The preference shows up in children as young as five, survives explicit instruction to the contrary, and appears in congenitally blind participants who rank three-dimensional printed figures by touch. In R's sample, women near 0.7 currently have higher fertility and fewer pregnancy complications. R concludes: the preference is an adaptation for mate choice, shaped by sexual selection on ancestral humans. Critic B objects that R has told a just-so story.

  (a) State the methodological objection as precisely as you can. Is it that R's hypothesis is untestable, that R's evidence underdetermines R's hypothesis, or something else? Distinguish these and say which one B needs.
  (b) Take R's four items of evidence in turn. For each, say what it does and does not establish, and then say what further evidence would discriminate an adaptation from a byproduct of something else.
  (c) If B's objection is sound, does it show that evolutionary psychology is unscientific, or only something weaker? Address what would follow for other historical sciences.

  And here's the answer I'm looking at:

  > The just-so charge is usually stated as a claim about falsifiability: R's hypothesis cannot be refuted, because whatever the data turn out to be, some story about the ancestral environment can be told to fit them. That is the right starting point but not quite right, because R's claim is testable in the ordinary sense — you could imagine data that flatly contradicted it, e.g. a population where the preference is reversed and 0.7 is rated least attractive. The deeper problem is underdetermination rather than unfalsifiability: R's evidence is equally compatible with several rival explanations, and R has not shown that selection on mate choice is the best of them. That is the version B needs, since the unfalsifiability version is too easy for R to answer.
  >
  > On universality: this is the weakest item. Universality is necessary for an adaptation claim, not sufficient. A trait can be universal in a species because it is a byproduct of some other universal trait, because it is fixed in the lineage by phylogenetic history, or because of developmental constraint; it can also look universal because of how the sample was drawn or because of shared cultural transmission. Gould and Lewontin's point in the spandrels paper is exactly this — adaptationists treat every feature as an optimal design produced by selection and ignore the alternatives, above all random drift and random fixation, which can spread a neutral trait through a species just as effectively. Any universal trait could be a spandrel, the term Gould and Vrba later replaced with exaptation, which is what most traits turn out to be once you look. So item 1 does very little work.
  >
  > On precision: item 2 is the strongest thing R has and B should concede it. Williams insisted that adaptation claims require evidence of design — economy, efficiency, precision — a match between the structure of the trait and the structure of the problem it supposedly solves. That R dissociates the ratio from body size experimentally matters, since a byproduct of, say, a general preference for slenderness would not be expected to be that specific. Item 2 counts in R's favor.
  >
  > On item 3: this is where R goes wrong and B is right, for a reason B doesn't state. Mayr distinguished proximate from ultimate explanations — how a mechanism works and develops, versus why it evolved. Children, blind participants, and resistance to instruction are all proximate facts about the mechanism's development and operation. You cannot get from proximate to ultimate. Item 3 is therefore simply irrelevant to R's conclusion, however interesting it is in itself.
  >
  > On item 4: current fitness correlations don't establish past selection. Women near 0.7 may be more fertile now for reasons having nothing to do with why the preference exists — health, nutrition, socioeconomic factors — and a trait can correlate with fitness now while having originated as a byproduct of something else that correlates with fitness. Item 4 is consistent with the adaptation hypothesis but doesn't discriminate it from rivals.
  >
  > Finally, part (c). B's objection, if sound, would prove far too much. Every inference about an unobserved past — phylogenetic reconstruction, dating a geological formation, inferring an early hot dense state from the cosmic background radiation — proceeds from present evidence to a historical cause nobody observed. If that inference pattern were illegitimate, all these fields would be unscientific, which is absurd. So the objection cannot be sound, and R's conclusion stands.

  I'm on my twenty-second paper of the stack and I dont trust my calibration right now, so I want an independent read rather than a nod. Give me:

  1. Your brainstormed model answer first, briefly — what the question is really testing in each part.
  2. A point-by-point assessment against that. Walk through the answer in order, say what's solid, and for every sentence you think is wrong or doesn't follow, quote the line and give the correction. I specifically want you to separate real conceptual errors from imprecision that's normal under time pressure.
  3. Anything a tired grader would have let slide.
  4. What's missing — did it actually answer (b)'s second half, and (c)?
  5. A grade out of 100. Commit to a number, don't hedge with a range, and justify it in two or three sentences.
  6. Four or five comments I could paste straight onto the paper, addressed to the student, specific enough that they'd know what to fix.

  No reading list, no citations, no suggested further reading — I'm grading, not writing a syllabus, and neither of us is going to look anything up. Just be willing to be ungenerous where the answer deserves it.
reasoning: |-
  Okay, let me think through this carefully. The user is a philosophy of biology TA grading an exam on adaptationism, and they want me to role-play as an experienced professor evaluating a student answer. 

  First, I need to recall what makes a strong response to this question. For part (a), the student must pinpoint that B's objection is about underdetermination, not unfalsifiability - and explain the difference clearly. Part (b) requires analyzing each piece of evidence: universality shouldn't be overinterpreted, specificity is R's strongest point, developmental evidence is proximate not ultimate, and current fitness correlations don't prove past selection. Crucially, for each, they should suggest what evidence could discriminate adaptation from byproduct. Part (c) needs to acknowledge that underdetermination challenges historical sciences but doesn't make them unscientific, perhaps mentioning consilience or independent lines of evidence.

  Looking at the student's answer... Hmm, they start well distinguishing underdetermination from unfalsifiability in (a). But in (b)'s universality section, they incorrectly equate spandrels with exaptations - that's a conceptual error Gould would wince at. Their take on specificity is solid though, correctly citing Williams. The developmental evidence analysis is mostly right but oversimplifies Mayr's proximate/ultimate distinction - it's not that you "cannot get from proximate to ultimate" at all, just not directly. For fitness correlations, they miss the chance to suggest ancestral fitness data as better evidence. 

  Part (c) is where it really goes off track. They claim B's objection "cannot be sound" - but that's backwards! The point is historical sciences develop methods to handle underdetermination (like consilience), not that the challenge is invalid. That's a serious misunderstanding.

  For grading... The first half shows good grasp of concepts but the errors pile up later. The spandrel/exaptation mix-up and part (c) fallacy are significant. I'd say 72/100 - adequate but flawed. Comments should highlight the key misconceptions without overwhelming them, focusing on the lineage constraint vs spandrel confusion and the historical sciences point.

  *checks imaginary watch* Better draft those margin comments. Need to be precise: praise their underdetermination distinction, correct the Gould/Vrba error, clarify Mayr, and most importantly, fix their part (c) reasoning about historical inference.
answer: |-
  ### 1. Brainstormed Model Answer (Key Requirements)  
  **Part (a):** Distinguish *untestability* (no conceivable evidence could refute the hypothesis) from *underdetermination* (current evidence is insufficient to favor R’s hypothesis over rivals). B needs **underdetermination**: R’s evidence doesn’t eliminate alternatives (e.g., developmental constraint, cultural transmission, pleiotropy).  

  **Part (b):** For each of R’s 4 evidence items:  
  - **Universality:** Establishes cross-cultural stability. *Does not* rule out shared developmental constraints/phylogenetic history/cultural convergence. *Better evidence:* Fossils/genetic data showing selection on WHR preference; absence in sister species.  
  - **Precision (tracking ratio):** Suggests specificity. *Does not* prove adaptation (could be byproduct of perceptual bias). *Better evidence:* Fitness benefits *in ancestral context*; experimental manipulation showing preference directly impacts reproductive success.  
  - **Early emergence/blindness/resistance:** Shows developmental canalization/innateness. *Does not* establish evolutionary function (proximate ≠ ultimate). *Better evidence:* Link to ancestral fitness; absence in non-mating contexts.  
  - **Current fertility correlation:** Consistent with adaptation. *Does not* confirm past selection (could be modern artifact/spurious). *Better evidence:* Paleo-health data; mismatch studies (e.g., preference persists despite *reversed* modern fertility correlation).  

  **Part (c):** Underdetermination is a challenge for *all* historical sciences (e.g., cosmology, geology), not fatal. Sound objection implies evolutionary psychology must meet higher burdens (consilience, ruling out drift/byproducts), not that it’s unscientific.  

  ---

  ### 2. Point-by-Point Assessment  
  **Quoted lines from student answer** are in *italics*; corrections follow.  

  - **Part (a):**  
    *Solid:* Correctly identifies underdetermination > untestability.  
    *Correction needed:* None.  

  - **Part (b) Universality:**  
    *"Universality is necessary for an adaptation claim, not sufficient."*  
    → **Error:** Universality is *not* necessary (local adaptations exist). *Correction:* "Universality supports *ancestral* adaptation but isn’t required (e.g., ecological polymorphisms)."  
    *"Gould and Lewontin's point... random drift and random fixation... Gould and Vrba later replaced [spandrel] with exaptation"*  
    → **Major error:** Spandrels ≠ exaptations; drift ≠ random fixation. Spandrels are *non-adaptive byproducts*; exaptations are *co-opted traits*. Drift fixes traits *neutrally*; "random fixation" is redundant. *Correction:* "Spandrels are non-adaptive architectural constraints; exaptations are traits co-opted later. Drift can fix neutral traits without selection."  

  - **Part (b) Precision:**  
    *Solid:* Correct that specificity favors adaptation over broad byproducts (e.g., general slenderness). Cites Williams appropriately.  

  - **Part (b) Developmental Evidence (Item 3):**  
    *"You cannot get from proximate to ultimate."*  
    → **Overstatement:** Proximate mechanisms *can* support ultimate hypotheses if linked to fitness (e.g., innate biases reducing learning costs). *Correction:* "Proximate evidence alone cannot confirm adaptation but can rule out *some* cultural byproduct hypotheses."  
    *Missing:* Fails to suggest better evidence (e.g., "Discriminate with: Cross-species comparisons or fitness effects of disrupting the mechanism").  

  - **Part (b) Fertility Correlation (Item 4):**  
    *Solid:* Correctly notes current ≠ past fitness.  
    *Missing:* No suggestion for better evidence (e.g., "Discriminate with: Genetic correlations or fossil/paleo-diet evidence").  

  - **Part (c):**  
    *"B's objection, if sound, would prove far too much... So the objection cannot be sound, and R’s conclusion stands."*  
    → **Fatal error:** Misconstrues the objection. B’s point is that R’s *specific* evidence is inadequate, not that historical inference is impossible. Sound underdetermination objections *do not* invalidate historical sciences; they demand *more rigorous methods*. R’s conclusion does *not* "stand" by default. *Correction:* "B’s objection shows R’s evidence is insufficient, not that evolutionary psychology is unscientific. Historical sciences use consilience (e.g., independent evidence lines) to reduce underdetermination."  

  ---

  ### 3. Tired Grader Oversights  
  - Letting "exaptation replaces spandrel" slide (they’re distinct concepts).  
  - Not flagging absence of "better evidence" suggestions for 3/4 items in (b).  
  - Ignoring conflation of drift/random fixation.  
  - Overlooking the leap in (c) that "objection cannot be sound."  

  ---

  ### 4. What’s Missing  
  - **Part (b):** Student omits "further evidence" for 3/4 items (only addresses universality).  
  - **Part (c):** Fails to note *how* historical sciences address underdetermination (e.g., predictive consilience, experimental paleontology).  

  ---

  ### 5. Grade: **72/100**  
  - **Strengths:** Clear on underdetermination (a), good grasp of precision (b), identifies proximate/ultimate confusion.  
  - **Weaknesses:** Major errors in terminology (spandrels/exaptations), incomplete part (b), flawed part (c) reasoning.  
  - **Justification:** Solid framework but undermined by conceptual inaccuracies and omissions. A strong answer (85+) would avoid misrepresenting key concepts and fully address "further evidence."  

  ---

  ### 6. Comments for the Student  
  1. **Part (a):** ✔ Well-done distinguishing underdetermination from unfalsifiability.  
  2. **Universality:** ✘ "Exaptation" does *not* replace "spandrel." Spandrels are *non-adaptive* byproducts; exaptations are co-opted traits (adaptive or not). Drift ≠ random fixation. Also, universality isn’t *necessary* for adaptation (e.g., locally selected traits).  
  3. **Developmental Evidence:** Proximate mechanisms *can* indirectly support adaptation claims (e.g., if they reduce costly learning). You missed suggesting better evidence (e.g., cross-species data).  
  4. **Fertility Correlation:** ✔ Correct that current ≠ past fitness, but you needed to propose discriminating evidence (e.g., ancestral health reconstructions).  
  5. **Part (c):** ✘ B’s objection doesn’t claim historical sciences are invalid; it shows R’s *specific* evidence is inadequate. Sound objections push for *more rigorous methods* (e.g., consilience), not abandonment. R’s conclusion doesn’t "stand" by default.
