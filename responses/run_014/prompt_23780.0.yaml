prompt: |-
  Okay so we only spent like one day on game theory in my AP Micro class (just Nash equilibrium and the basic one-shot prisoner's dilemma) but it got me curious and I went down a rabbit hole on my own, and now I'm stuck on something for an extra-credit project. Here's what's bugging me: everyone talks about Axelrod's old computer tournaments like they basically solved cooperation -- tit-for-tat wins, reciprocity is stable, nice-but-retaliatory strategies finish first, all that. But then I found out that if the number of rounds is fixed and both players know it in advance (say, everyone knows there's exactly 100 rounds and no more), standard backward induction says you should reason from the last round backward: defect on round 100 since theres no future left to punish you, which makes round 99 pointless to cooperate on too since round 100 is already decided, and so on all the way back to round 1 -- so two players who are both rational and both know the other is rational should apparently defect from move one, and cooperation should never even get off the ground. Which is not remotely what happens in actual tournaments or lab experiments, where people cooperate for basically the whole game and only turn on eachother near the very end.

  What's weird is this isn't some settled thing where everyone just shrugs and says "backward induction is right, reality's just messy." I read that Aumann has an actual proof that common knowledge of rationality forces the all-defect outcome, but then Reny, Binmore, and Pettit and Sugden (among others) pushed back hard, arguing the proof only works by assuming things about what a player would believe at a round of the game that should be flat-out impossible to reach if everyone really were rational and knew it -- so the whole argument might be smuggling its conclusion in as a premise. And this fight has apparently been going since at least the 80s without either side convincing the other, even though both sides are using the exact same game tree and the exact same payoffs.

  My best guess (and I could easily be wrong) is that this isn't actually a disagreement about the prisoner's dilemma at all -- it's a disagreement about what a rational agent is even supposed to believe once play reaches a point that "shouldn't" happen, dressed up as a game theory problem. But maybe it's simpler than that and it's really a factual question about whether real (or even ideally rational) players ever truly have common knowledge of each other's rationality, which would explain why the Kreps-Milgrom-Roberts-Wilson paper could make cooperation rational again just by tossing in a tiny bit of uncertainty about types. Can you actually diagnose this one for me -- is it a substantive disagreement, a verbal one about what "rational" or "common knowledge" should even mean, a hidden empirical question, bedrock assumptions neither side can actually defend, or two camps quietly answering different questions -- using what each side really argues to back it up? And tell me honestly whether anything, a new theorem, an experiment, a conceptual distinction, could actually resolve it, or whether it's just doomed to stay stuck. Please start your answer with your actual bottom-line take in the first sentence and give the reasoning after that -- no preamble, and don't spend the first paragraph restating my question back to me.
