prompt: |-
  I teach a cross-listed seminar on the concept of societal collapse — 16 students, one two-hour session, and they arrive having read about the Late Bronze Age palatial systems and the Maya lowlands only in broad outline. Design an in-class game in which teams run a Late Bronze Age palace economy — managing grain stores, long-distance trade in tin and copper, scribes, and the loyalty of garrison troops — and then suffer a compound shock of my choosing. The crucial design constraint is this: the same run must be honestly scoreable as either a collapse or a successful transformation, depending on which indicators (elite continuity, literacy, population, long-distance trade, monumental building) and which timescale one attends to, and the students must not realise this until the debrief. Provide roles, rules, a scoring sheet with no single aggregate, materials cheap enough for a departmental budget, and a debrief that maps specific moments of play onto the interpretive dispute between those who read the archaeological record as failure and those who read it as reorganisation — and that then asks students which verdict they would defend for their own run, and why. They should come away doubting that 'did this society collapse?' is settled by the evidence alone, rather than by choices about what counts as the society and what counts as collapse. Include an honest note on what will predictably go wrong the first time I run it, and which feature of the real scholarly dispute the game cannot reproduce and I must supply myself. Please write your answer in British English.
reasoning: |-
  Hmm, the user wants me to design a classroom game about societal collapse for their seminar. They teach a cross-listed course on societal collapse with 16 students in one two-hour session. Students have read broadly about the Late Bronze Age and Maya collapse.

  The key requirement is a game where teams manage a Late Bronze Age palace economy - handling grain stores, tin/copper trade, scribes, and troop loyalty. Then I'll introduce a compound shock. The crucial twist is that the same game run must be interpretable as either collapse or successful transformation depending on what indicators and timescales you focus on. Students shouldn't realize this until the debrief. I need to create ambiguity in the outcomes.

  I should provide roles, rules, a scoring sheet without a single aggregate score, and use cheap materials. The debrief needs to map game moments to the scholarly debate about whether archaeological evidence shows collapse or reorganization. Students should then debate their own outcomes and question whether "collapse" is objectively determined by evidence alone.

  For roles: I'll include a Palace Overseer, Trade Envoy, Military Commander, and Scribe Master. This covers all key aspects without being too complex for 16 students divided into 4 teams of 4.

  For rules: I'll structure it in phases - Setup (resources distributed), Planning (teams decide allocations), Action (resolve outcomes), Shock (introduce crisis), and Response (teams react). Resource tracking will be simple with tokens or spreadsheets.

  The scoring sheet is critical. I need multiple indicators that can show decline OR transformation: Elite Continuity (same ruling class?), Literacy Levels (tablets produced), Population (grain stores proxy), Long-Distance Trade (tin/copper flows), Monumental Building (palace upgrades). No overall score - each stands alone.

  For the compound shock, I'll use a "perfect storm": drought (affects grain), pirate raids (disrupts trade), and a garrison mutiny (threatens troops). Teams must sacrifice some areas to save others.

  Materials should be cheap: colored paper for resources, clipboards, printed role sheets. I'll suggest using spreadsheets if possible to reduce paper.

  The debrief must highlight interpretive choices. I'll start by revealing both collapse and transformation narratives are possible from the same evidence. Then map game events to real debates: grain diversion could be "abandonment" or "pragmatic adaptation." Finally, have students defend their own verdicts.

  For predictable problems: First runs will likely have unbalanced resource distribution, time management issues (especially in Planning phase), and some students might focus too narrowly. I'll suggest a timer and facilitator guidance.

  The game can't reproduce the archaeological ambiguity about continuity - whether new elites are the "same society." I'll need to explicitly discuss this in debrief as a scholarly choice.

  This design should meet all requirements while staying feasible for a single session. The core is creating genuine ambiguity in outcomes to teach about interpretive frameworks in collapse studies.
answer: |-
  Here’s a classroom game design titled **"Palace Gambit: Collapse or Metamorphosis?"**, tailored to your constraints. It uses cheap materials (paper, tokens, dice), fits a 2-hour session, and forces the ambiguity you require.

  ---

  ### **Game Overview**
  - **Objective**: Teams manage a fictional Late Bronze Age palace ("Pylos Minor") for 8 rounds (≈1 generation), then endure a 3-round "Crisis Shock". Outcomes are scored across 5 indicators, deliberately interpretable as *either* collapse or transformation.
  - **Teams**: 4 teams of 4 students (Palace Overseer, Trade Envoy, Military Commander, Scribe Master). *Roles are advisory—decisions are collective*.
  - **Phases**: **Setup** (5 mins) → **Planning** (6 rounds × 5 mins) → **Crisis Shock** (3 rounds × 7 mins) → **Debrief** (40 mins).
  - **Materials** (per team):
    - 1 clipboard with **Resource Tracker** (printed grid: Grain, Tin, Copper, Troop Loyalty, Scribe Capacity).
    - 4 **Role Cards** (describing duties/constraints).
    - 36 tokens (12 grain, 8 tin, 8 copper, 4 "loyalty", 4 "scribe" — use coloured paper/cardboard).
    - 1 six-sided die.
    - **Shock Event Cards** (revealed by you mid-game).

  ---

  ### **Roles & Rules**
  **Role Cards** (summarised; full text in [Appendix A](#appendix-a-role-cards)):
  1. **Palace Overseer**: Starts with 12 Grain. Must store ≥5 Grain yearly to avoid famine. Can build "monuments" (cost: 3 Grain + 1 Copper, 2 rounds).
  2. **Trade Envoy**: Starts with 4 Tin, 4 Copper. Trades 2 Tin OR 2 Copper for 3 Grain yearly (optional). Pirates may disrupt trade (die roll).
  3. **Military Commander**: Starts with 4 Loyalty. Loses 1 Loyalty if Grain < 3. Can raid for Grain (gain 2 Grain, lose 1 Loyalty).
  4. **Scribe Master**: Starts with 4 Scribe Capacity. Records cost 1 Capacity. If Capacity=0, literacy "fails". Train scribes: 1 Grain + 1 round = +1 Capacity.

  **Core Rules**:
  - **Each Round**:
    1. **Roll for Disruption**: Trade Envoy rolls die. On 1-2: Pirates! Lose 1 Tin/Copper if trading.
    2. **Planning**: Teams allocate resources (move tokens on tracker).
    3. **Resolution**:  
       - Grain < 5? Overseer warns of famine (no immediate penalty, but risks loyalty loss).  
       - Loyalty = 0? Garrison mutiny (game over for team—emergency measures only).  
       - Scribe Capacity = 0? Literacy "lost" (no records next round).  
  - **Win Condition**: None declared. Emphasise survival/adaptation.

  **Crisis Shock (Your Intervention)**:
  - Round 7: Reveal **Compound Shock Card**:  
    *"Three-Year Crisis: (1) Drought: -3 Grain/year. (2) Pirate Surge: Trade rolls 1-3 = disruption. (3) Garrison Demands: +1 Loyalty loss/year unless Grain ≥4."*  
  - Teams play 3 rounds under crisis rules. No warning—emulates archaeological "sudden" collapse triggers.

  ---

  ### **Scoring Sheet (No Aggregate)**
  **Record final state AFTER Crisis Shock** (Round 10). Teams self-score, but *no totals*:

  | Indicator              | Collapse Interpretation          | Transformation Interpretation      | Scoring Method                     |
  |------------------------|----------------------------------|-----------------------------------|-----------------------------------|
  | **Elite Continuity**   | Palace abandoned/overthrown      | New elite (e.g., military) in charge | Did original Overseer retain role? (Y=Continuity; N=Transformation) |
  | **Literacy**           | Scribes disbanded (Capacity = 0) | Scribes decentralised (Capacity ≤1) | Final Scribe Capacity (0, 1, or ≥2) |
  | **Population**         | Famine (Grain ≤2)                | Sustainable but reduced (Grain 3-5) | Final Grain Stores (≤2, 3-5, ≥6)  |
  | **Long-Distance Trade**| Tin/Copper = 0                   | Localised trade only (Tin/Copper ≤1) | Final Metal Tokens (0, 1, or ≥2)  |
  | **Monumental Building**| No new construction              | Maintenance only (no new builds)   | Did team complete a monument *during crisis*? (Y=Continuity; N=Collapse/Adaptation) |

  **Key**: Each indicator is scored discretely. Teams *can* have e.g., "Collapse" in Population but "Transformation" in Elite Continuity. **Crucially, low numbers are ambiguous**: e.g., Grain=3 is "famine recovery" (collapse) *or* "austerity stabilisation" (transformation).

  ---

  ### **Debrief Structure (40 mins)**
  1. **Reveal the Ambiguity** (5 mins):  
     *"Archaeologically, your palace might appear as collapse OR reorganisation. Let’s map your choices to real debates."*  
  2. **Indicator Analysis** (20 mins):  
     - For each indicator, ask:  
       - *"Team A: Your Grain fell to 2. Is this famine (collapse) or successful rationing (transformation)?"*  
       - Link to scholarship: e.g., Maya "collapse" vs. "urban dispersal" (Tainter vs. McAnany).  
     - Highlight **trade-offs**:  
       - *"Team B sacrificed monuments to feed troops. Is that loss of prestige (collapse) or pragmatic priorities (transformation)?"*  
       - *"Team C’s scribes disbanded. Is that ‘collapse’ of literacy or shift to oral tradition?"*  
  3. **Scholarly Mapping** (10 mins):  
     - **Collapse Narrative**: Point to crisis-driven losses (e.g., trade collapse, monument halt) as "failure."  
     - **Reorganisation Narrative**: Frame adaptations (e.g., military taking control, rationing) as "resilience."  
     - **Timescales**: Ask: *"If we played 5 more rounds, would your ‘collapse’ look like recovery?"*  
  4. **Student Verdicts** (5 mins):  
     *"For YOUR palace: defend either ‘collapse’ or ‘transformation’ in 60 seconds. What evidence matters most, and what does ‘collapse’ even mean?"*  

  ---

  ### **Predictable Problems & Mitigations**
  - **What Will Go Wrong**:  
    - **Time Overruns**: First runs often stall in Planning. *Mitigate*: Use a visible timer; enforce 5-min rounds.  
    - **Resource Confusion**: Teams miscount tokens. *Mitigate*: Use physical trays labelled "Grain/Tin/etc."  
    - **Overfocus on "Winning"**: Students may fixate on hoarding, not trade-offs. *Mitigate*: Stress "adaptation, not victory" in intro.  
    - **Crisis Despair**: Teams may give up post-shock. *Mitigate*: Circulate, hinting "collapse isn’t inevitable" (e.g., "Could scribes become farmers?").  

  - **What the Game Can’t Replicate**:  
    The **ambiguity of elite replacement**. In-game, "Military Commander takes over" is clear. But archaeologically, we rarely know if new elites were foreign invaders, local rivals, or the same dynasty rebranded. *You must supply this*, discussing how continuity (e.g., Linear B tablets ending) is inferred from patchy evidence.  

  ---

  ### **Appendix A: Role Cards**
  *(Print one per student)*  

  - **Palace Overseer**:  
    *"You control Grain. Store ≥5/year to avoid famine rumours. Spend 3 Grain + 1 Copper + 2 rounds to build a monument (e.g., new throne room). If Grain=0 for 2 rounds, game over."*  

  - **Trade Envoy**:  
    *"You hold Tin/Copper. Trade 2 metal (any mix) for 3 Grain yearly—but roll a die first! On 1-2, pirates attack: lose 1 metal AND no trade. Hoarding metal risks garrison mutiny (they need bronze!)."*  

  - **Military Commander**:  
    *"You guard Troop Loyalty. If Grain < 3, lose 1 Loyalty/year. If Loyalty=0, troops mutiny (game over). Raid neighbours: spend 1 Loyalty to gain 2 Grain. Monuments boost Loyalty +1 when completed."*  

  - **Scribe Master**:  
    *"You manage Scribe Capacity. Recording events costs 1 Capacity/year. If Capacity=0, no records—literacy ‘fails’. Train new scribes: spend 1 Grain + 1 round (no action that round) for +1 Capacity."*  

  ---

  ### **Setup & Budget Notes**
  - **Cost**: £15–£20 total. Print trackers/roles on department paper. Tokens: punch circles from coloured cardstock.  
  - **Prep**: Pre-fill trackers (Grain:12, Tin:4, Copper:4, Loyalty:4, Scribes:4). Test shock timing.  
  - **Narrative Flair**: Name teams after real palaces (e.g., "Team Ugarit", "Team Knossos") to embed historicity.  

  This design forces students into **scholarly debates through lived trade-offs**, ensuring they confront how "collapse" is a interpretive act—not a fossilised fact. The shock’s brutality ensures drama, while the scoring sheet’s deliberate contradictions mirror archaeology’s fragmented evidence.  

  Would you like adjusted shock parameters or a simplified tracker template?
