     - The sophisticated approach: This maps to backward induction in dynamic programming. In arbitrage pricing, we use backward induction to price American options and to determine optimal exercise. Similarly, the sophisticated agent uses backward induction to avoid trades that would lead to future exploitation. The cost, however, is that the agent may forgo a trade they currently desire (which is a form of loss). This is similar to the cost of hedging: we might forgo a profitable trade if we know it will lead to a larger loss later.

     - The resolute approach: This maps to static replication. The agent precommits to a strategy that avoids dynamic inconsistency. In arbitrage pricing, we prefer static replication when possible because it avoids transaction costs and model risk. Similarly, the resolute agent avoids the money pump by binding themselves to a plan.

