answer: |-
  The coin game described has an undefined expected value, meaning it's not possible to say whether the game is in your favor or not based on expectation. This occurs because the series that defines the expected value does not converge; it oscillates indefinitely. Here's a step-by-step explanation:

  ### Understanding the Game
  - You flip a fair coin repeatedly until the first heads appears.
  - If heads appears on the first flip, you win $1.
  - If tails on the first flip, you flip again:
    - If heads on the second flip, you lose $2.
    - If tails on the second flip, you flip again, and so on.
  - The amount doubles each time ($1, $2, $4, $8, ...), and who pays alternates: you win on odd-numbered flips (1st, 3rd, 5th, etc.) and lose on even-numbered flips (2nd, 4th, 6th, etc.).

  ### Calculating the Expected Value
  The expected value (from your perspective) is the sum of the payoffs weighted by their probabilities. Let \(k\) be the flip number where the first heads occurs:
  - Probability of first heads on flip \(k\): \(P(k) = (1/2)^k\) (since it requires \(k-1\) tails followed by one heads).
  - Payoff \(Y_k\):
    - If \(k\) is odd (you win): \(Y_k = +2^{k-1}\).
    - If \(k\) is even (you lose): \(Y_k = -2^{k-1}\).
    - This can be written as \(Y_k = (-1)^{k+1} \cdot 2^{k-1}\).

  The expected value \(E[Y]\) is:
  \[
  E[Y] = \sum_{k=1}^{\infty} P(k) \cdot Y_k = \sum_{k=1}^{\infty} \left( \frac{1}{2} \right)^k \cdot (-1)^{k+1} \cdot 2^{k-1}.
  \]

  Simplify the term inside the sum:
  \[
  \left( \frac{1}{2} \right)^k \cdot 2^{k-1} = \frac{1}{2^k} \cdot 2^{k-1} = 2^{-k} \cdot 2^{k-1} = 2^{-1} = \frac{1}{2}.
  \]
  So the expression becomes:
  \[
  E[Y] = \sum_{k=1}^{\infty} (-1)^{k+1} \cdot \frac{1}{2} = \frac{1}{2} \sum_{k=1}^{\infty} (-1)^{k+1}.
  \]

  The series \(\sum_{k=1}^{\infty} (-1)^{k+1}\) (i.e., \(1 - 1 + 1 - 1 + \cdots\)) is known as Grandi's series, which does not converge. It oscillates between 1 and 0 depending on the number of terms:
  - For an odd number of terms, the partial sum is \(1/2\).
  - For an even number of terms, the partial sum is \(0\).

  Since the terms do not approach zero (each contributes \(\pm 1/2\) in magnitude), the series diverges, and the expected value is undefined.

  ### Why the Guy's Reasoning is Wrong
  The person at the party likely made one of two mistakes:
  1. **Ignored the alternating payments**: They may have assumed you always win (e.g., only considered the gains on odd flips), leading to the divergent series \(\sum_{k=1}^{\infty} \frac{1}{2} = \infty\), which suggests an infinite expected value in your favor. But this overlooks the losses on even flips, which are substantial and growing.
  2. **Assumed convergence**: They might have thought the gains and losses "balance out," but because the payoffs double while the probabilities halve, the terms remain constant in magnitude (\(\pm 1/2\)), preventing convergence.

  In reality, the game is symmetric in a way that causes the expectation to oscillate rather than settle. With a fair coin, the probability of winning or losing money is equal for finite sequences, but the potential losses grow exponentially (e.g., if the first heads is on flip 2, you lose $2; on flip 4, you lose $8; on flip 6, you lose $32, etc.), making the risk significant.

  ### Should You Take the Bet?
  **No, you should not take the bet, especially with an entry fee.** Here's why:
  - **Undefined expectation**: Without a well-defined expected value, you cannot justify the bet as favorable. You might win small amounts often (e.g., $1 with 50% probability on the first flip), but you risk large losses with low probability (e.g., losing $32 if the first heads is on flip 6, which has a 1/64 probability).
  - **Entry fee adds risk**: Paying an entry fee (e.g., $x) means you start at a disadvantage. Since the expected value is undefined, you have no mathematical basis to recover this fee.
  - **Practical concerns**: In real life, you or the opponent have limited bankrolls, so the game cannot continue indefinitely. Capping the flips (e.g., stopping after \(n\) flips) makes the expected value finite but generally unfavorable or zero. For example:
    - If capped at 2 flips: \(E[Y] = \frac{1}{2}(1) + \frac{1}{4}(-2) + \frac{1}{4}(0) = 0.5 - 0.5 = 0\) (assuming no payoff if no heads).
    - If capped at 3 flips: \(E[Y] = \frac{1}{2}(1) + \frac{1}{4}(-2) + \frac{1}{8}(4) + \frac{1}{8}(0) = 0.5 - 0.5 + 0.5 = 0.5\).
    - However, this depends on the cap and is not the original infinite game.

  ### Clean Way to Think About It
  - **Key insight**: The expected value is undefined because the series oscillates and does not converge. This is a variant of the St. Petersburg paradox, but with alternating payments that prevent divergence.
  - **Risk perspective**: The game has high variance; most of the time you win or lose small amounts, but there's a small chance of catastrophic loss. This makes it unattractive for rational play.
  - **Decision rule**: Avoid bets with undefined or infinite expectations, as they offer no reliable advantage and expose you to unbounded risk. Always compute the series explicitly—if the terms don't approach zero or the series doesn't converge, the expectation isn't valid.

  In summary, the game is mathematically flawed for decision-making, and you were right to be skeptical. Politely decline the bet and save your money for games with well-defined odds!
