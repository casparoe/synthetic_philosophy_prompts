prompt: |-
  So I've been reading Elster on precommitment — Ulysses and the sirens, constitutions as collective self-binding, the whole thing — and I got into this argument with my roommate who's in poli sci. He keeps insisting constitutional precommitment is just Ulysses contracts scaled up: same logic, same normative force, no interesting difference. I'm not convinced. I think there's gotta be cases where an individual binding their own future self is fine but a group binding its future members isn't, even when the setups look structurally parallel.

  Can you build me a thought experiment where this happens? Specs:

  - The individual Ulysses contract should come out as normatively binding (the person ought to stick to it), but the structurally analogous constitutional precommitment should not be binding (the group should feel free to ignore it).
  - "Structurally analogous" means same basic mechanism (e.g., making a tempting option costly or hard to access), same type of future temptation, and stakes that are roughly proportional to the agents involved.
  - Realistic setting — a workplace, a club, a co-op, a department. No nation-states, no sci-fi.
  - One paragraph for the scenario.

  After the scenario:
  (a) Walk through why each one gets the verdict it does.
  (b) Identify the feature that makes them come apart, and say whether that feature is essential to the individual/collective precommitment distinction in general or just a quirk of this case.
  (c) Could a defender of constitutional precommitment tweak the constitution to fix the problem without changing its fundamental character? If so, would the fixed version still be structurally analogous to the Ulysses contract?

  I'm trying to write a paper on this so I need the reasoning to actually work — dont just stipulate the verdicts, they need to fall out of the theories.
reasoning: |-
