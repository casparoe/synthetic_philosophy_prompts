  Scenario: Taylor receives a calibration report from a trusted app that flags her as being in a state that typically leads to errors in logical reasoning. However, Taylor knows that in this instance, the report is a false positive because she has independent evidence that the app's sensor malfunctioned. What should Taylor do about her confidence in a logical conclusion she just reached?
