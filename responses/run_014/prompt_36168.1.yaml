  "Welcome to the Higher-Order Evidence Diagnostic! This quiz presents scenarios where you learn about the quality of your own evidence. For each, choose the option that best reflects what you think the person rationally ought to believe. We won't use technical terms — just your intuitions. Your pattern of answers will reveal which philosophical stance on higher-order evidence you naturally align with. There are no right or wrong answers, only positions. After the quiz, we'll explain the stances and their commitments."

