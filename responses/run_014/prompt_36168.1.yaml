  - B: Avery should lower their confidence to the point where it is no longer 90% but still above 50%, because the evidence of time pressure is a reason to doubt but not to abandon.
  - C: Avery should become much less confident, perhaps suspending judgment, because the time pressure evidence defeats the high confidence.

