  2. Source dependence: Does the rational force of higher-order evidence depend on its source? (e.g., physiological impairer, calibration report, peer disagreement, expert verdict)
  3. Continuity: Does higher-order evidence affect first-order credence continuously (each increment nudges the credence) or only at a threshold (defeats outright after crossing a bar)?
  4. Function: Does higher-order evidence function as ordinary evidence (weighed alongside) or as a structural constraint?

