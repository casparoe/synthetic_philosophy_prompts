  Welcome to the Higher-Order Evidence Diagnostic! This quiz presents scenarios where you learn about the quality of your own evidence. For each, choose the option that best reflects what you think the person rationally ought to believe. We avoid technical terms—your intuitions matter. Your responses will reveal your stance on higher-order evidence. After completing the quiz, we'll match your pattern to philosophical positions and explain their commitments. There are no right or wrong answers, only insights.

