  - We need 8-10 cases, at least half invented.
  - Must include:
    (a) A scenario with a reliable-but-not-infallible report of subtle impairment without locating a specific error, and the object-level evidence still seems compelling.
    (b) A scenario where the higher-order evidence is known to be misleading (false positive) and we test if it still exerts rational pressure.

  Each case should have 2-3 answer options, phrased as what the person ought to believe or how confident they ought to be.

  Leaves (positions) to include:
  - View that akratic combinations are sometimes rational.
  - Coherence/fixed-point view: current credences constrain what is rational from further evidence.
  - View that higher-order evidence gets weighed in and typically lowers first-order confidence.
  - View that higher-order evidence matters only through ordinary object-level facts, if at all.
