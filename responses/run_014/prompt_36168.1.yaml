  Scenario: Riley is participating in a study and is given a pill. Unbeknownst to Riley, the pill is a mild cognitive impairer that the researchers know causes overconfidence in logical reasoning. Riley completes a reasoning task and becomes highly confident in the answer. Later, Riley is told about the pill and its effects. What should Riley believe about their answer?
  Options:
  - A: Riley should remain confident because they can still review the reasoning and it seems sound.
  - B: Riley should reduce confidence because the pill might have caused an error even if the reasoning seems sound.
  - C: Riley should reject the answer entirely because the pill makes their reasoning unreliable.

  Case 7: Threshold Effect (New)
  Scenario: Avery is estimating the number of jellybeans in a jar. After careful calculation, Avery is 90% confident. Then, Avery is told that under conditions of time pressure (which applied), people's estimates are off by more than 20% on average. How should Avery adjust their confidence?
