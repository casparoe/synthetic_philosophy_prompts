  Axis 3: Continuity
  Diagnostic question: When you get information that you might have made a mistake, does it gradually reduce your confidence in your conclusion (like a dimmer switch) or does it only matter when it crosses a threshold (like an on/off switch)?

  Axis 4: Function
  Diagnostic question: Does information about the quality of your evidence affect your confidence in the same way as new evidence about the world, or does it play a special role that constrains how you should weigh your existing evidence?

