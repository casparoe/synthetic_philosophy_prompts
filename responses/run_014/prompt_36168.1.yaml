  - B: Taylor should reduce her confidence because the report, even if misleading in this case, still indicates a general risk that she might have made a mistake.
  - C: Taylor should ignore the report entirely since it is known to be false.

  Case 3: Peer Disagreement (Standard, but we'll make it new)
  Scenario: Jordan and Morgan have independently researched the same question and have always agreed in the past. They both consider each other equally competent and informed. Today, they exchange their conclusions and discover they disagree. Morgan remains confident in their own view. What should Morgan do?
  Options:
  - A: Morgan should become less confident in their view because of the disagreement with an equally reliable peer.
  - B: Morgan should remain just as confident because they have reviewed their own evidence and found it compelling, and they might have access to considerations Jordan missed.
  - C: Morgan should suspend judgment until they can discuss the reasons for the disagreement.

  Case 4: Expert Review (New)
  Scenario: Casey writes a proof for a mathematical conjecture and is very confident. An expert mathematician, who is known to be highly reliable, reviews the proof and tells Casey that there is likely an error in the reasoning, but without specifying where. Casey cannot find any error. What should Casey believe?
  Options:
  - A: Casey should remain confident in the proof because they can't find the error and the reasoning still seems valid.
  - B: Casey should reduce confidence because the expert's judgment suggests an error might be present.
  - C: Casey should abandon the proof entirely and start over.

  Case 5: Calibration Report (New)
  Scenario: Sam takes a test with 100 questions and answers each one with high confidence. After submitting, Sam receives a calibration report that, based on past performance, indicates that when Sam is this confident, they are wrong 20% of the time. What should Sam believe about the correctness of their answers?
