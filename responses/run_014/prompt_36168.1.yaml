    "axes": [
      {
        "name": "Akrasia",
        "diagnostic_question": "Can it ever be rational to believe something while also believing your total evidence doesn't adequately support it?"
      },
      {
        "name": "Source Dependence",
        "diagnostic_question": "Does the rational impact of information about your evidence depend on where it comes from (e.g., a drug, a calibration report, a peer, or an expert)?"
      },
