  Key requirements:
  - 8-10 case-based questions
  - Must include five specific scenarios from the literature
  - Answer options should be concrete choices, not theoretical labels
  - Scoring key must group answer patterns into named positions
  - Must acknowledge which positions the quiz can't cleanly separate
  - Include one coherent but unoccupied position
  - Identify which question to cut if shortening

  Considering the five mandatory cases:
  1. Sheriff framing innocent man (tests constraints against punishing innocent)
  2. Dying murderer (separates desert from consequences)
  3. Untouchable embezzler (tests if desert matters without any possible consequences)
  4. Failed attempt vs completed crime (harm done vs harm intended)
  5. Civil disobedient accepting punishment (communicative vs retributive views)

  For the remaining questions, considering adding:
  - A case about disproportionate punishment (to test positive retributivism)
  - A case about rehabilitation vs continued incapacitation (to separate consequentialist aims)
  - A case about symbolic punishment (expressivism vs hard consequences)
  - An abolitionist-leaning case (non-punitive resolution)

  Noticing potential overlaps:
  - Expressivism and positive retributivism might collapse since both support punishment of the guilty regardless of consequences
  - Restorative justice and rehabilitation may be hard to distinguish
  - Abolitionism needs clear triggers like rejecting punishment even when effective/deserved

  For the scoring key, considering these positions:
  - Negative retributivism (constraint against punishing innocent)
  - Positive retributivism (guilty deserve punishment)
  - Deterrence-focused consequentialism
  - Rehabilitation-focused consequentialism
  - Incapacitation-focused consequentialism
  - Expressivism
  - Restorative justice
  - Abolitionism

  The unoccupied position could be "pure positive retributivism without negative constraint" - logically possible but nobody advocates punishing innocents to satisfy desert claims.

  If needing to cut one question, the "completed vs attempted crime" case might be the most expendable since harm vs intent is somewhat covered elsewhere, though it loses nuance about what makes actions blameworthy.

  The quiz should start with clear instructions emphasizing concrete choices, then present cases in logical sequence, and end with interpretive scoring that acknowledges gray areas.
answer: |-
  Here is an 8-question diagnostic quiz designed to reveal underlying philosophical commitments about punishment through concrete cases, with a scoring key mapping answer patterns to standard positions.

  **Quiz: What Do You Actually Think Punishment Is For?**  
  *Instructions: Read each scenario and choose the option that best reflects your judgment about whether, why, or how punishment should be applied. There are no "right" answers—only what aligns with your intuitions.*

  ### Questions
  1.  **The Innocent Scapegoat:**  
      A sheriff in a racially tense town knows a mob will riot tonight unless someone is immediately punished for a recent murder. He has no leads and no time to find the real culprit. He can frame an innocent vagrant (who has no family or connections) for the crime. If punished, the riot will be averted, saving dozens of lives. What should he do?  
      (A) Frame and punish the innocent vagrant to prevent the riot.  
      (B) Refuse to punish an innocent person, even if it means the riot happens.  

  2.  **The Dying Murderer:**  
      A murderer is sentenced to death. The next day, he is diagnosed with an untreatable, terminal illness. He will die painlessly in his prison cell within a week—before his execution date and before the public learns of his sentence. His death will be attributed to natural causes. Should the state still execute him?  
      (A) Yes, carry out the execution as planned.  
      (B) No, let him die naturally; executing him now serves no purpose.  

  3.  **The Untouchable Embezzler:**  
      A brilliant financier commits a massive, premeditated embezzlement. She is caught only after the statute of limitations expires, making her legally immune to prosecution. She is fabulously wealthy, utterly remorseless, and has retired; she will never commit another crime and cannot be deterred (she sees crime as beneath her now). Should she face any form of state-imposed punishment?  
      (A) Yes, she deserves punishment for what she did.  
      (B) No, punishment would serve no practical purpose.  

  4.  **Failed Attempt vs. Completed Crime:**  
      Two would-be assassins act independently. *Assassin 1* carefully aims a rifle at a political leader’s head and pulls the trigger, but a sudden gust of wind deflects the bullet. *Assassin 2* aims at the same leader’s head, pulls the trigger, and kills her. Both are caught and confess identical motives and planning. Should they receive the same punishment?  
      (A) Yes, they both intended and tried equally to commit murder; the outcome was luck.  
      (B) No, Assassin 2 actually killed someone and should be punished more severely.  

  5.  **The Civil Disobedient:**  
      A protester deliberately blocks a major highway to demand climate action, causing massive disruption. She accepts arrest and states in court: "I broke the law, and I accept your punishment. But my action was morally necessary and justified." How should the court approach her punishment?  
      (A) Punish her normally; she broke the law and deserves the standard sentence.  
      (B) Reduce or waive punishment; her acceptance and justification make standard punishment unnecessary or counterproductive.  
      (C) Impose a symbolic punishment (e.g., $1 fine) to acknowledge the law was broken, but respect her message.  

  6.  **Disproportionate Theft:**  
      A desperately hungry teenager steals a single loaf of bread from a large supermarket. The law mandates a 5-year prison sentence for this theft. The judge knows incarceration will likely destroy the teen’s future prospects. What should the judge do?  
      (A) Impose the full 5-year sentence; the law must be upheld, and the crime deserves punishment.  
      (B) Reduce the sentence significantly; the harm caused is minimal and harsh punishment creates more harm.  

  7.  **The Rehabilitated Repeat Offender:**  
      A man convicted of multiple violent assaults undergoes intensive therapy in prison and is now fully rehabilitated, remorseful, and poses no future threat. His original sentence has 5 years remaining. Should he be released early?  
      (A) Yes, he is reformed and no longer dangerous; keeping him imprisoned wastes resources.  
      (B) No, he committed serious crimes and deserves to serve his full sentence regardless of his reform.  

  8.  **The Symbolic Vandal:**  
      An activist destroys a widely hated public monument symbolizing historical oppression. She proudly confesses. The act caused no physical harm to people, but significant public debate erupts—some praising her courage, others condemning the lawlessness. What is the primary purpose of punishing her?  
      (A) To deter others from similar vandalism.  
      (B) To express society’s condemnation of her unlawful act and reaffirm shared values.  
      (C) To facilitate a dialogue between her and the community about the harm caused and the monument’s meaning.  
      (D) Punishment is inappropriate; this is a political act best resolved outside the penal system.  

  ---

  ### Scoring Key
  Tally your answers and match the pattern below to discover which philosophical positions your intuitions align with most closely.

  **Core Positions Identified:**
  *   **Negative Retributivism:** Punishment is only justified if the person is guilty (a side-constraint). The innocent must never be punished, but the guilty need not always be punished. Forward-looking goals (deterrence, etc.) are permissible only within this constraint.
  *   **Positive Retributivism:** The guilty *deserve* to suffer punishment in proportion to their wrongdoing, regardless of consequences. Punishment is intrinsically good when deserved.
  *   **Consequentialism (Deterrence):** Punishment is justified primarily to deter future crimes by the offender or others.
  *   **Consequentialism (Incapacitation):** Punishment is justified primarily to physically prevent the offender from committing further crimes (e.g., imprisonment).
  *   **Consequentialism (Rehabilitation):** Punishment is justified primarily to reform the offender and reintegrate them into society.
  *   **Expressivism/Communicative:** Punishment is justified as a way for society to express condemnation of the wrongful act, communicate its norms, or facilitate moral dialogue with the offender.
  *   **Restorative Justice:** Punishment is inappropriate; justice is achieved through repairing harm, involving victims, offenders, and the community in dialogue and reconciliation. State punishment often hinders this.
  *   **Abolitionism:** The institution of criminal punishment is inherently harmful, unjust, or ineffective and should be abolished in favor of non-punitive responses to conflict and harm.

  **Mapping Your Answers:**
  *   **Strong Negative Retributivism:** (1=B) + Rejecting punishment of the innocent *consistently* (often aligns with rejecting 1A, 3B, and sometimes 5A if the act is seen as justified innocence). Key Marker: 1=B.
  *   **Strong Positive Retributivism:** Punishing the guilty *despite* lack of consequences (2=A, 3=A) + Punishing based on intent/wrongdoing rather than outcome (4=A) + Upholding proportional desert (6=A, 7=B). Key Markers: 2=A, 3=A.
  *   **Deterrence Consequentialism:** Willingness to punish innocents *if necessary* for greater good (1=A) + Punishing primarily to send a message (8=A) + Rejecting punishment without deterrent effect (2=B, 3=B). Key Marker: 1=A.
  *   **Incapacitation Consequentialism:** Focus on preventing future harm (1=A *only* if it prevents immediate harm like riot, otherwise potentially 1=B) + Keeping offenders locked up if dangerous (7=B) + Less emphasis on intent vs. outcome (4=B). Key Marker: 7=B.
  *   **Rehabilitation Consequentialism:** Opposing punishment that causes net harm or hinders reform (1=B, 6=B) + Prioritizing reform and reintegration (7=A). Key Marker: 7=A.
  *   **Expressivism/Communicative:** Focus on societal expression/condemnation (8=B) + Symbolic punishment acknowledging the act (5=C) + Sometimes aligns with punishing attempts like completions (4=A - condemns the intent). Key Marker: 8=B.
  *   **Restorative Justice:** Seeking non-punitive, dialogue-based resolution (8=C, 5=B/C) + Often rejecting standard punishment even for the guilty if reconciliation is possible (3=B, 6=B, 7=A). Key Marker: 8=C.
  *   **Abolitionism:** Rejecting state punishment entirely, especially in political/social conflict cases (8=D) + Often seeking non-punitive alternatives everywhere possible (1=B *but for abolitionist reasons*, 5=B, 6=B, 7=A *as release, not reduced punishment*). Key Marker: 8=D.

  **Honest Limitations & Overlaps:**
  1.  **Positive Retributivism vs. Expressivism:** These often overlap significantly (e.g., 2=A, 3=A, 4=A, 8=B). Both insist on punishing the guilty for their culpable acts. The quiz struggles to separate them. Expressivists *might* be more open to symbolic punishment (5=C) or context (5=B) than hardcore retributivists, but it's not a clear divide.
  2.  **Rehabilitation Consequentialism vs. Restorative Justice:** Both prioritize healing and avoiding harm (1=B, 6=B, 7=A). The key difference is institutional: Rehabilitation works *within* the punishment system to reform offenders. Restorative Justice seeks to *replace* punishment with dialogue/reparation. Question 8 (C vs. A) is the best differentiator, but it's subtle.
  3.  **Negative Retributivism vs. Consequentialism:** Question 1 (A vs. B) is the primary separator. Negative Retributivists *always* choose B. Most Consequentialists *could* choose A, though some (especially rehab/restorative) might choose B for consequentialist reasons (e.g., erosion of trust).

  **The Unoccupied Position: Pure Positive Retributivism Without Negative Constraint**  
  *   **What it is:** Believing the guilty *must* be punished because they deserve it (Positive Retributivism), but *also* believing it's permissible to punish the innocent *if* it satisfies a perceived societal need for "desert" to be assigned (e.g., "Someone *must* pay for this horrific crime; if we can't find the guilty, an innocent scapegoat will suffice to restore balance").
  *   **Why nobody holds it:** It violates the fundamental moral intuition that intentionally punishing the known innocent is a paradigmatic injustice, arguably worse than not punishing the guilty. Even strong Positive Retributivists embrace the Negative constraint (innocents must not be punished). Consequentialists might punish innocents, but *not* because they believe the innocent *deserves* it.

  **Question to Cut & Why:**  
  If shortening to 7 questions, **cut Question 4 (Failed Attempt vs. Completed Crime)**.  
  *   **What is lost:** This question primarily probes the depth of commitment to *harm* versus *culpability/wrongdoing* as the desert object. It helps distinguish "hard" Positive Retributivists (who focus on the blameworthy act/intent, hence 4=A) from those more influenced by consequentialism (harm done matters for deterrence/incapacitation/even some expressions of outrage, hence 4=B). However, this nuance is somewhat covered elsewhere: Question 3 tests if *any* consequence matters for desert, and Questions 6/7 test proportionality and the relevance of consequences post-punishment. Cutting Q4 loses a specific test of the "harm" element but preserves the core tests for Negative/Pure Desert constraints (Q1, Q2, Q3) and the other major positions.

  This quiz forces engagement with core dilemmas, revealing intuitions that map onto complex theories without naming them upfront. The scoring key highlights the messy reality of philosophical alignment while providing clear starting points for self-reflection.
