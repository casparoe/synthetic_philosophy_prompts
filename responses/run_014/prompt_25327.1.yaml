      - **Innovation**: Adapting to new targets and environments, and even coordinating shots in groups.  
      - **Cognitive complexity**: Studies show they can hit moving targets and remember successful strategies, rivaling some vertebrates in problem-solving.  
    - If she uses Rule 2, she might accept this as evidence for consciousness. If she uses Rule 1, she'll reject it outright.  

  **How to present the test case**:  
  - Describe the archerfish's abilities (e.g., from papers on their cognition, like Schuster et al.'s work on predictive shooting).  
  - Ask her directly: "Given that archerfish show flexible planning and learning, do you think they're conscious?"  
