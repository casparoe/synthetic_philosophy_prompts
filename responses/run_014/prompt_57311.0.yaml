prompt: |-
  I'm presenting at a law school's human rights colloquium next month. The thesis: that conditional amnesty is not a second-best substitute for criminal prosecution but a distinct form of accountability, one that in some circumstances does more for victims than trials would. The argument turns on a distinction I have coined for the paper, between vertical amnesty — granted from above, class-wide, unconditioned, extinguishing the state's claim while requiring nothing of the perpetrator — and horizontal amnesty, which is individualized, sought by the perpetrator, and conditional on full disclosure before a public body, so that the state's claim is not waived but satisfied by a performance. I argue that the duty to prosecute is owed to victims rather than being a duty to imprison, and that horizontal amnesty can discharge it. I also argue that the international norm against amnesty is publicly justified on the claim that amnesty prolongs conflicts, a claim most of its proponents do not actually rely on and could not evidence, and that the mismatch between the stated and the real justification does damage of its own.

  The room will be mostly international criminal lawyers and human rights litigators who treat the duty to prosecute as near-absolute, two quantitative civil-war scholars who will go after my empirical claim on identification grounds, and one former staff member of a truth commission speaking from institutional memory.

  Give me the question period: the eight or so objections this audience will actually raise, in roughly the order they will come and weighted by how much damage each does, phrased in the vocabulary of whoever raises it, each with a reply I can deliver in ninety seconds, what I should concede before delivering it, and where the reply is soft. Close with the question I am hoping no one asks, and why it is the dangerous one. Where you refer to actual commissions or judgments, stay with what you are confident of; I want the argument, not a list of precedents. Please write it as continuous prose, the way a colleague would in a long email — no headings, no bullet points, no bold, no tables.
reasoning: |-
  Okay, let me approach this systematically. The user is presenting a nuanced thesis challenging conventional views on amnesty at a law school colloquium, and needs to anticipate objections from a specialized audience. 

  First, I need to understand the core arguments: the vertical/horizontal amnesty distinction, the victim-centered duty to prosecute, and the critique of the international norm against amnesty. The audience composition - international criminal lawyers, quantitative scholars, and truth commission staff - suggests objections will cluster around doctrinal, empirical, and practical dimensions.

  For the international lawyers, I expect doctrinal challenges first. They'll likely lead with the strongest weapon: the Inter-American Court jurisprudence treating prosecution as an absolute victim right. This is high-damage because it invokes binding authority. The reply should concede the Court's position but reframe victims' rights as substantive rather than procedural, using the Court's own language about "truth and justice" to argue horizontal amnesty serves those ends. 

  Next, the empirical scholars will attack the conflict-prolonging claim. Since they deal in data, they'll demand evidence I can't provide. The soft reply should admit the evidentiary gap while shifting to the normative point about justification mismatches. This is lower risk since it doesn't undermine the core thesis.

  Other predictable lines: the slippery slope to impunity (counter: conditional amnesty as precisely the guardrail), the South African TRC's mixed outcomes (concede limitations but highlight unique disclosure benefits), and the false equivalence between trial punishment and amnesty's burdens (emphasize the social recognition function).

  The dangerous unasked question would expose the theory's practical limitations: "How often does this 'horizontal' ideal actually materialize?" This threatens because most amnesties are vertical in practice, making the distinction theoretically elegant but empirically rare. I'd need to acknowledge this while arguing the model's aspirational value.

  Throughout, replies must stay under 90 seconds - so concessions upfront to establish credibility, then crisp rebuttals pivoting to the paper's framework. The tone should mirror academic collegiality: substantive but not defensive.
answer: |-
  Here’s how I see the Q&A unfolding, based on that room. The objections will come thick and fast, layered with professional stakes. Order matters: they’ll lead with what they see as doctrinal kill-shots before probing softer claims.  

  First, the international litigator, leaning on *Barrios Altos*: "You claim the duty to prosecute is owed *to victims*, not as an end in itself. But the IACtHR has held unequivocally that amnesty laws—*any* amnesties—violate the victim’s *procedural right* to judicial remedy under the ACHR. Doesn’t your ‘horizontal’ model still extinguish that right, reducing victims to passive recipients of state-sanctioned truth?" *Damage: High. Targets core legal legitimacy.*  
  **Concede first:** "You’re right that the Court rejects blanket amnesties categorically."  
  **Reply:** "But note the Court’s rationale: impunity denies victims ‘truth and justice.’ My argument is that conditional, individualized amnesty *delivers* both through adversarial disclosure and public shaming. The right isn’t to a specific *procedure* but to substantive accountability. When a perpetrator performs contrition before victims and society, satisfying the state’s claim, it transforms remedy from retributive to restorative—without extinguishing civil liability."  

  Next, the quantitative scholar: "Your empirical claim—that the ‘conflict prolongation’ justification is unsupported—rests on *disproving* a null hypothesis. But you haven’t demonstrated that conditional amnesty *shortens* conflicts either. Without causal identification (IVs, RDD), this is just an assertion. Doesn’t that undermine your normative critique?" *Damage: Medium-high. Undercuts policy relevance.*  
  **Concede first:** "Absolutely, I haven’t proven counterfactual conflict effects."  
  **Reply:** "The point isn’t that horizontal amnesty *resolves* conflict better—it’s that critics justify *categorical* prohibitions by invoking prolongation risks they can’t evidence. That mismatch imposes real costs: it forecloses context-specific tools that may better serve victims *post*-conflict, as South Africa showed. We need nuance, not absolutes masquerading as empirics."  

  Third, another litigator, invoking dignity: "Aren’t you conflating *accountability* with *therapy*? Trials affirm victim dignity by recognizing harm through law. Amnesty, even ‘horizontal,’ replaces state punishment with private catharsis. Doesn’t that privatize justice and degrade the victim’s status as a rights-bearer?" *Damage: Medium. Strikes at victim-centric premise.*  
  **Concede first:** "Trials do provide unique dignitary recognition."  
  **Soft reply:** "But dignity also flows from societal acknowledgment. When a perpetrator *submits* to a public process, detailing crimes under oath—knowing immunity hinges on it—it validates victimhood more profoundly than a contested trial where facts are denied. Think of the Khulumani members who found validation in TRC testimony *because* it forced perpetrators to perform responsibility."  

  Fourth, the truth commission veteran: "Institutional memory from [their commission] shows conditional amnesty often trades truth for *partial* accountability. Perpetrators game the system—admitting narrow facts, omitting context, avoiding responsibility for systemic harm. Doesn’t ‘horizontal amnesty’ incentivize atomized confession, undermining the very collective reckoning you prize?" *Damage: Medium. Practical counterweight.*  
  **Concede first:** "Absolutely, gaming occurs—see the TRC’s struggles with APLA applicants."  
  **Reply:** "But trials atomize *more* by focusing on individual intent, not systems. A well-designed commission can compel narrative coherence through cross-examination and corroboration. The key is institutional rigor: requiring full *contextual* disclosure, rejecting selective admissions. It’s imperfect, but often better than trials that never happen."  

  Fifth, a human rights scholar: "You distinguish ‘vertical’ and ‘horizontal,’ but in practice, conditional amnesties usually emerge from state-bargained pacts. Doesn’t that make them top-down by definition? And once the state ‘satisfies its claim’ via amnesty, what stops future regimes from reviving vertical impunity?" *Damage: Low-medium. Definitional pushback.*  
  **Concede first:** "Amnesties are indeed often negotiated by elites."  
  **Reply:** "The distinction isn’t origin but *operation*. Even if bargained, individualized conditioning transforms it: perpetrators must actively *seek* relief by confronting victims. And the public process creates societal stakes—making reversion to vertical impunity politically harder, as Colombia’s JEP shows."  

  Sixth, a criminal lawyer, pragmatic: "Say I accept your model. How do you prevent ‘horizontal amnesty’ from becoming a cheap alternative for states *avoiding* robust prosecutions? Isn’t the ICC’s blanket rejection the only bulwark against bad-faith actors?" *Damage: Medium. Policy slippery slope.*  
  **Concede first:** "Abuse risk is real—see Uganda’s amnesty act."  
  **Reply:** "Hence conditioning on full disclosure *before an independent body*. The bulwark isn’t prohibiting amnesty but demanding *procedural rigor*. The ICC could incentivize this by recognizing rigorous conditional amnesties as complementary to prosecution—reserving intervention for states gaming the system."  

  Seventh, the second quant scholar: "Your ‘victim satisfaction’ argument relies on contested TRC survey data. But selection bias plagues those studies: participants self-select into reconciliation. Doesn’t that overstate victim support for amnesty?" *Damage: Low. Empirical nit, but easy to answer.*  
  **Concede first:** "Survey limitations are well-taken."  
  **Reply:** "Agreed—but consider the counterfactual. In Chile, where trials were scarce, the Valech Commission’s closed-door acknowledgments left victims feeling unheard. Public conditional disclosure, even without prison, often outperforms silent impunity *or* protracted trials on victim wellbeing metrics. The mechanism is social verification, not polling."  

  Eighth, a generalist, circling back: "If horizontal amnesty ‘satisfies the state’s claim,’ doesn’t that collapse your distinction? The state’s claim *is* to punish—that’s what prosecution embodies. Calling amnesty ‘accountability’ seems semantic laundering." *Damage: Low. Philosophical, but recurrent.*  
  **Concede first:** "Punishment is one form of accountability."  
  **Soft reply:** "But not the only one. The state’s deeper claim is to uphold the normative order. When a perpetrator is forced to publicly affirm that order by admitting guilt—under threat of prosecution—it restores civic trust differently than a trial, but no less effectively. Nuremberg’s hangings and the TRC’s public shaming both served that end."  

  **The dangerous unasked question:** "Beyond South Africa—which you concede was context-specific—where has ‘horizontal amnesty’ *actually* delivered more for victims than trials *could* have? Isn’t this just theorizing a unicorn?"  
  **Why dangerous:** It forces you to defend empirical rarity. Most conditional amnesties (e.g., El Salvador, Liberia) were compromised by limited victim input, shallow disclosure, or state coercion. Conceding this risks reducing your model to a thought experiment.  
  **Why you hope it’s not asked:** Because while you can pivot to "aspirational design" or "institutional potential," the audience knows real-world amnesties are usually bargaining chips—not victim-centered mechanisms. It exposes the tension between your normative ideal and political practice.  

  Structure your replies: Always concede the strongest point in the objection first—it disarms. Then pivot to your framework’s core: *performance over procedure, victim validation over retribution*. Keep the "satisfaction of the state’s claim" language central; it’s your lever to separate horizontal from vertical. And watch the clock—ninety seconds is three crisp sentences.
