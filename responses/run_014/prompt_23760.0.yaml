prompt: |-
  I'm a journalist who covers science and ideas, and I'm currently working on a long-form piece about the afterlife of classic thought experiments in the philosophy of mind. I've been rereading Avicenna's flying man argument, in which a person is conceived as being created in midair, with limbs separated and no access to sensation, memory, or any perception of their own body, yet still aware of their own existence. What strikes me about the argument is not so much its conclusion as the precise conceptual move it makes: it attempts to isolate self-awareness from every bodily, sensory, and memory-based input, and then asks whether anything is left over that could still count as the subject's awareness of itself.

  For the piece, I'd like a concrete example of a conceptual issue that has this same logical structure but arises in a domain other than the standard philosophy-of-mind thought experiments. In particular, please avoid the brain-in-a-vat, locked-in syndrome, and virtual-reality scenarios, which I have already covered, and also avoid simply restating the flying man in modern neuroscientific language. An issue from medicine, law, physics, or another field would be ideal, provided the parallel is structural rather than merely thematic.

  When you offer the example, could you explain in a paragraph or two why it parallels the flying man argument at the level of logical structure — that is, where the same separation of a subject from its putative grounds is being performed — and then indicate a point at which the two cases genuinely diverge, such that the flying man settles something your example leaves open, or vice versa? I'm less interested in a survey of candidates than in one well-chosen case, argued with some care.
