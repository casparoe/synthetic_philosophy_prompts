  Okay, the user wants me to write a satirical Official Rules document for a "luring lottery" contest inspired by Hofstadter-style superrationality. The contest mechanics involve splitting $500,000 equally among all valid entries, creating an inverse relationship between participation and individual reward. 

  First, I need to brainstorm the key philosophical tensions: the eligibility clause must define "superrational" in a way that self-destructs upon application. If everyone applies the definition consistently, they should all enter once - but the moment someone deviates (by not entering or entering multiple times), the definition collapses. 

  The sponsor's disclaimer about Platonia is crucial. Since superrationality often invokes timeless decision-making, the rules must deny liability for pre-existing Platonic versions of entrants. This creates absurd legal theater where the physical act of mailing the card is framed as epistemically irrelevant. 

  For the tie-break rule, I'm considering treating identical reasoning as a single "entrant" - which implicitly satirizes how superrationality assumes isomorphic thought processes while real humans vary. The disputes clause should name an impossible jurisdiction like "the light cone of January 1, 1900" to highlight how the contest exists outside normal spacetime legal frameworks. 

  The mixed-strategy provision needs to handle probabilistic entries by forcing entrants to commit to a single interpretation of p. This exposes the gap between theory (where p magically aligns) and practice (where distributions never perfectly match). 

  The "everyone else is CDT" scenario requires special handling - if one entrant truly believes they're the only superrational thinker, they'd rationally submit infinite entries. But allowing this would destroy the prize pool, so the rules must cap entries while pretending to accommodate the logic. 

  I'll structure this as dry legalese with escalating absurdity: starting plausibly before veering into clauses that undermine the contest's own premises. The humor comes from maintaining serious tone while describing logical impossibilities, like defining superrationality via circular references or disclaiming liability for hypothetical entities. 

  Specialist readers should recognize authentic decision theory concepts even as the rules stretch them to breaking point. The foundation's earnest commitment to its flawed idealism is the real satire target - hence clauses where they solemnly prohibit "retroactive withdrawal of Platonic intent" or require entrants to ignore the act of submission itself.
answer: |-
  ## OFFICIAL RULES: SUPER-RATIONAL COORDINATION LOTTERY (THE "CONTEST")

  **Sponsor:** The Prometheus Institute for Emergent Cognition ("Sponsor").

  **1. Contest Mechanics:**
     1.1. One (1) Grand Prize of Five Hundred Thousand United States Dollars (USD $500,000) will be awarded.
     1.2. The Grand Prize will be divided equally among all Valid Entries received by the Entry Deadline.
     1.3. Entrants must submit an Official Entry Card ("Card") via first-class mail to the address specified on the Card. Electronic submissions are void.
     1.4. To constitute a Valid Entry, a Card must be legible, fully completed, and postmarked by the Entry Deadline. On the Card, the Entrant must:
          (a) Write the exact number of entries they are submitting via this single Card (the "Stated Quantity");
          (b) Provide a written justification explaining why the Stated Quantity represents the logically necessary and super-rationally correct number of entries for them to submit.

  **2. Eligibility & Super-Rational Entrant Definition:**
     2.1. The Contest is open only to natural persons who meet the definition of a "Super-Rational Entrant" at the moment of completing their Card.
     2.2. A "Super-Rational Entrant" is defined as an individual who, applying identical reasoning to that applied by every other Super-Rational Entrant under the Contest's identical information conditions, would conclude that entering the Contest exactly once is the uniquely correct action.
     2.3. Notwithstanding Clause 2.2, an individual remains eligible if they *intended* to reason as defined in 2.2, even if subsequent events demonstrate their reasoning was not universally identical. Eligibility is determined solely at the moment of Card completion based on the entrant's stated intent and justification.
     2.4. Sponsor employees, agents, and immediate family members are ineligible.

  **3. Prize Distribution & Causal Decision Theorist Provision:**
     3.1. The per-Valid-Entry prize amount shall be calculated as $500,000 divided by the total number of Valid Entries.
     3.2. **Causal Decision Theorist Scenario:** In the event that the Prize Calculation (Clause 3.1) results in a per-entry value demonstrably less than the cost of postage and Card completion (estimated at $1.25 USD), and exactly one (1) Valid Entry contains a justification asserting that all other entrants are Causal Decision Theorists who will enter multiple times, thus making the submission of multiple entries by the entrant uniquely rational for that entrant alone, then:
          (a) That entrant shall be deemed to have submitted entries equal to the minimum integer value necessary to exhaust the entire $500,000 Grand Prize at $1.25 per entry (i.e., 400,000 entries).
          (b) All other Valid Entries shall be declared void for failing the eligibility requirements of Clause 2.2 or 2.3, as their reasoning demonstrably did not account for the true nature of the entrant pool.

  **4. Mixed-Strategy Entries:**
     4.1. Entrants submitting a Card stating a Stated Quantity defined as a probability 'p' (e.g., "I submit p=0.7 entries") will have their entry processed as follows:
          (a) The Sponsor will generate a random number 'r' uniformly distributed between 0 and 1 after the Entry Deadline.
          (b) If r ≤ p, the Card will be counted as one (1) Valid Entry.
          (c) If r > p, the Card will be void.
     4.2. Entrants utilizing mixed strategies must justify why their specific 'p' is the uniquely correct probability under super-rational coordination. Justifications referencing anticipated global distributions of 'p' values among other entrants will be deemed invalid, as such distributions cannot be known *a priori* and contradict the assumption of identical reasoning.

  **5. Isomorphic Entrants & Tie-Breaking:**
     5.1. If multiple Valid Entries are received containing identical justifications for the Stated Quantity, and these justifications demonstrate reasoning processes indistinguishable under any meaningful logical transformation, such entries shall be considered submitted by isomorphic instances of the same super-rational agent.
     5.2. In such cases, these entries shall be aggregated and treated as a *single* Valid Entry for the purpose of Prize Calculation (Clause 3.1). The aggregated prize amount shall be awarded to the single physical address appearing earliest alphabetically from the pool of isomorphic entries.

  **6. Platonia Disclaimer & Timeless Commitment:**
     6.1. Entrant acknowledges that the super-rational reasoning process required by this Contest may involve considerations of timeless decision-making and the existence of abstract, Platonic records of intent.
     6.2. **Waiver of Platonic Claims:** Entrant hereby irrevocably waives any and all claims against the Sponsor, its affiliates, and assigns, arising from or related to the existence, content, or perceived causal influence of any timeless, Platonic, counterfactual, or pre-determined version of the Entrant's decision or submitted Card. This waiver explicitly includes claims that the physical act of mailing the Card constituted a "cause" of the decision distinct from its timeless logical necessity, or that such mailing "added" the entry to a pre-existing set.
     6.3. **Finality of Record:** The physical Valid Entry Card received by Sponsor constitutes the sole and definitive record of the entrant's participation. No adjustments will be made based on arguments concerning the retroactive or timeless nature of the decision embodied therein.

  **7. Disputes & Governing Law:**
     7.1. Any dispute arising out of or relating to this Contest, including any question regarding its existence, validity, or termination, shall be finally settled under the Rules of Arbitration deemed most consistent with the principle of coordinated super-rationality by a single arbitrator appointed by the Sponsor.
     7.2. **Jurisdiction:** The seat of arbitration shall be the hypothetical light cone of January 1, 1900, Coordinated Universal Time. The arbitration shall be conducted in absentia, relying solely on the logical structure of the dispute and the Official Rules.
     7.3. The arbitrator's award shall be final and binding, and judgment upon the award may be entered in any court possessing the requisite ontological commitment to enforce timelessly determined outcomes. Sponsor disclaims liability for the practical impossibility of convening such a court within our current causal manifold.

  **8. General Conditions:**
     8.1. Sponsor reserves the right to disqualify any entry deemed fraudulent, illegible, incomplete, or submitted in bad faith. Decisions are final.
     8.2. Sponsor assumes no responsibility for lost, late, misdirected, damaged, or stolen entries.
     8.3. All taxes are the sole responsibility of the winner(s). Void where prohibited by law.
     8.4. Entry constitutes acceptance of these Official Rules. No purchase necessary. A purchase will not improve chances of winning. Odds of winning depend entirely on the number of Valid Entries and the successful global coordination of super-rational reasoning.
