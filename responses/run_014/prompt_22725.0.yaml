prompt: |-
  I'm a science and ideas journalist working on a longform piece about why we treat some moral actions as heroic and others as merely expected, and I've been reading enough ethics to get confused about supererogation. Here is a draft paragraph I want to use: Supererogatory acts are usually described as things that are good to do but not required. The problem is that this definition makes the category sound purely negative: an act is supererogatory only if it fails to be obligatory. But many of the cases we care about, like donating a kidney to a stranger or rushing into a burning building, seem to depend on the social and institutional backround. A doctor in an emergency room may have a duty to act that a passerby does not, and a passerby's act can look heroic partly because the hospital system has not assigned them that duty. I want to argue that supererogation is not just a leftover category of morally optional good acts, but a way of tracking where our practices of role, expectation, and praise are doing work. If we made everyone a hero, heroism would disappear, but not because the action became less good; rather, because the background norm shifted.

  Could you comment on whether this is a defensible way to frame supererogation, or whether I'm smuggling in a mistake by treating non-obligation as the main thing? I especially want to know if the kidney and burning building examples are bad in ways that would weaken the point, and if there is a cleaner in-the-weeds distinction I should be making between moral permissibility, obligation, and the kind of moral credit we give to people who do more than they have to.
reasoning: |-
  Okay, the user is a science and ideas journalist working on a piece about why some moral actions are seen as heroic while others are just expected. They're confused about supererogation after reading ethics literature. Their draft paragraph discusses supererogatory acts as good but not required, but they feel this definition is too negative. They want to argue that supererogation depends on social and institutional contexts, using examples like kidney donation or rushing into a burning building. Their point is that heroism exists because of background norms, not just the act's goodness.

  First, I need to assess if their framing is defensible. They're shifting focus from non-obligation to the role of social practices. That aligns with institutional and relational approaches in ethics. Philosophers like Heyd and Mellema discuss context-dependency, so the user's angle is valid. But they might be conflating moral obligation with institutional duty. The examples: a doctor has a professional duty, making their act obligatory, while a passerby doesn't, so their similar act is supererogatory. That works, but they should clarify that moral obligations can differ from institutional ones. The burning building example is strong, but they might need to address cases where no institutional roles exist, like a random person donating a kidney. Is that still supererogatory? Yes, because societal norms don't obligate it. They should mention that.

  The user also wants a clearer distinction between moral permissibility, obligation, and moral credit. Permissibility is about what's allowed without blame; obligation is what's required; supererogation is beyond obligation and deserves praise. The user's point about heroism disappearing if everyone were obligated is spot on—it's about the shifting baseline of expectations. They should emphasize that the value of the act remains, but the normative context changes how we perceive it.

  Potential pitfalls: Smuggling in a mistake by focusing on non-obligation? Not really, because they're using non-obligation as a starting point but then highlighting the social context. However, they should avoid implying that supererogation is solely defined by institutional roles. It's also about moral reasons beyond duty. For example, a passerby helping in a fire might have a moral reason to assist, but it's not obligatory due to high personal risk. So the distinction between institutional duty and moral obligation is key here.

  Recommendations: Clarify the distinction between institutional and moral obligations. Use the kidney example to show how societal norms affect obligations. Strengthen the point that supererogation tracks social practices. Define key terms explicitly: permissibility, obligation, supererogation. Emphasize that moral credit arises from exceeding expectations set by these norms. Mention that changing norms can shift acts from supererogatory to obligatory, which affects perceived heroism.

  Also, the user's insight about heroism depending on background norms is important. They could reference how during crises, expectations shift—like healthcare workers during COVID being seen as heroic initially, but as the crisis continued, their actions might be normalized. That real-world example could strengthen their argument. Overall, their approach is defensible and insightful, but refining the distinctions and examples will make it more robust.
answer: |-
  Your framing is **defensible, insightful, and moves beyond a simplistic "negative" definition of supererogation.** You're tapping into a crucial and often underexplored dimension: the **fundamentally relational and context-dependent nature of duty and praise.** However, there are nuances to clarify and potential pitfalls to avoid, especially with your examples. Here's a breakdown:

  ### Strengths of Your Approach

  1.  **Beyond Negativity:** You correctly identify the limitation of defining supererogation *solely* as "good but not obligatory." Your shift towards **"tracking where our practices of role, expectation, and praise are doing work"** is excellent. This highlights supererogation as a *positive* concept reflecting our evaluative practices and social structures.
  2.  **Context is Key:** Your emphasis on the "social and institutional background" is essential. Supererogation *is* relative to:
      *   **Roles:** A doctor's duty vs. a passerby's.
      *   **Relationships:** A parent's duty to their child vs. a stranger's.
      *   **Institutional Expectations:** What the fire brigade *must* do vs. a bystander.
      *   **Capability:** What we expect from someone trained/equipped vs. someone not.
      *   **Risk/Cost:** What level of sacrifice is *demanded* vs. what is *lauded*.
  3.  **The "Heroism Depends on Norms" Insight:** This is your strongest and most original point. **"If we made everyone a hero, heroism would disappear, but not because the action became less good; rather, because the background norm shifted"** is a brilliant way to articulate the core of your argument. It perfectly captures how supererogation acts as a **status marker relative to the baseline of obligation.** Changing the baseline (e.g., making kidney donation mandatory) reclassifies the act, altering its *meaning* and the *praise* it warrants, even if its intrinsic value remains.

  ### Areas for Refinement & Potential Pitfalls

  1.  **Clarifying "Non-Obligation":** You aren't *wrong* to highlight non-obligation, but your framing slightly risks conflating different *sources* of non-obligation. Be explicit:
      *   **Moral Permissibility:** An act is *allowed*. You can do it or not do it without moral blame *for that omission*. (e.g., Not donating a kidney is permissible).
      *   **Moral Obligation/Duty:** An act you *must* do. Failure is morally blameworthy. (e.g., A doctor treating their patient in the ER; not stealing).
      *   **Supererogation:** An act that is:
          *   Morally *good* (or even excellent).
          *   **Beyond** what is morally *obligatory* or *dutiful* in that specific context.
          *   Its omission is **not** morally blameworthy (though it might be disappointing).
          *   Its performance often deserves **special praise or moral credit** precisely *because* it exceeds the obligatory baseline.
      *   **Your Key Point:** *What constitutes the obligatory baseline is deeply shaped by social roles, institutions, relationships, and expectations.*

  2.  **The Kidney Example - Good, but Needs Nuance:**
      *   **Strengths:** Clearly shows role-dependence. A nephrologist volunteering for a stranger is still supererogatory, but less obviously "heroic" than a random citizen because the professional context changes the baseline expectation slightly. A random citizen donating is the paradigm case.
      *   **Potential Pitfall:** Avoid implying the *only* reason it's supererogatory is institutional. The *intrinsic cost/risk* (major surgery, lifelong implications) is a core moral reason why it *can't* be obligatory for anyone. The institution (medical system) defines the *professional's* duty, but the *moral* non-obligation for non-professionals stems from the significant sacrifice demanded. **Refine:** Emphasize that social roles *shape* the baseline obligation, but the act's demanding nature is a fundamental moral reason why that baseline *can* be set lower than "everyone must donate."

  3.  **The Burning Building Example - Excellent Illustration:**
      *   **Strengths:** Perfectly illustrates your core argument. The firefighter's action is (often) obligatory *because* of their role and the institutional structure. The passerby's identical action is supererogatory *because* they lack that assigned duty. The heroism of the passerby *directly stems* from acting *despite* not having the institutional obligation. Shifting the norm (e.g., mandating citizen intervention) would erase that heroism.
      *   **Clarification:** Even for the passerby, there might be *some* minimal moral obligation (e.g., call 911). Supererogation kicks in when they go *significantly beyond* that minimal obligation (rushing in). Highlight the **degree of exceeding the baseline**.

  4.  **"Moral Credit" - A Crucial Distinction:**
      *   This is vital. Performing a merely permissible act (e.g., eating lunch) warrants no special moral credit. Performing an obligatory act (e.g., paying debts) warrants no *special* praise; it's expected, failure is blameworthy. Performing a supererogatory act warrants **positive moral credit/praise** *because* the agent chose the good *despite* not being required to, often involving significant cost/risk. This credit is proportional to how far beyond the baseline they went and the sacrifice involved.

  ### Recommendations for a Cleaner Distinction & Stronger Paragraph

  1.  **Explicitly Define the Core Elements:** Briefly state:
      > "Supererogatory acts are morally excellent actions that go *beyond* what is morally obligatory or dutiful in a specific context. Their omission is not blameworthy, but their performance deserves special praise precisely because they exceed the baseline of expectation."
  2.  **Emphasize Contextual Baseline:** Weave in:
      > "...this baseline of obligation is not fixed but dynamically shaped by social roles (doctor, parent, citizen), institutional structures (hospitals, fire departments), relationships, individual capabilities, and the inherent cost or risk involved."
  3.  **Refine the Examples (Slightly):**
      *   **Kidney:** "Donating a kidney to a stranger exemplifies supererogation primarily because of the immense personal sacrifice involved, placing it far beyond any plausible *universal* moral duty. Its status is further highlighted *in contrast* to the specific duties assigned to medical professionals within the healthcare system."
      *   **Burning Building:** "Rushing into a burning building is obligatory for a firefighter bound by role and institution, but becomes paradigmatically heroic for a passerby precisely *because* no such duty is assigned to them. The passerby's heroism *depends on* the background norm that does *not* generally require such extreme risk from untrained individuals."
  4.  **Hammer the Heroism/Norm Shift Point:** Your final sentence is gold. Keep it. Perhaps lead into it:
      > "Therefore, supererogation isn't merely a residual category of 'optional good deeds,' but a vital concept revealing how our practices of assigning roles, defining duties, and bestowing praise structure our understanding of moral excellence. Heroism arises *in relation to* the prevailing norm. If we shifted the norm to mandate extreme altruism or risk-taking universally, those acts would lose their heroic status, not because they became less valuable, but because the baseline expectation had changed."

  ### Conclusion

  Your core argument is **defensible and valuable.** You are not smuggling in a mistake by starting with non-obligation; you are correctly identifying it as the *starting point* but then crucially **demonstrating *why* non-obligation exists and *how* it functions socially.** The examples are strong *if* you explicitly acknowledge the role of intrinsic cost/risk (kidney) and the gradient of obligation (minimal call 911 vs. rushing in). The cleanest distinction is:

  1.  **Permissible:** Allowed. No blame for omission. No special praise for doing.
  2.  **Obligatory:** Required. Blame for omission. No *special* praise for doing (it's expected).
  3.  **Supererogatory:** Beyond obligation. No blame for omission. **Special praise/credit for doing** (because it exceeds expectations, often with cost/risk).

  Your insight that supererogation "tracks where our practices of role, expectation, and praise are doing work" is spot-on and elevates the discussion beyond dry definitions. Refine the nuances around the examples and the sources of the baseline obligation, and you have a very robust and insightful framework for your piece.
