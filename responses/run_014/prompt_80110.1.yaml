answer: |-
  ### Research Proposal: The Enabling Role of the Longue Durée in Historical Explanation  

  **1. Research Question**  
  To what extent does the distinction between *causal* explanation (why a specific event occurred) and *enabling* explanation (why the event was possible) clarify the contested explanatory value of Braudel’s longue durée, and how does this distinction resolve the debate between critics (who dismiss it as descriptive background) and proponents (who defend it as structurally explanatory)?  

  **2. Why Existing Positions Leave the Question Open**  
  The debate is deadlocked because critics and proponents implicitly operate with divergent definitions of "explanation." Critics (e.g., advocates of event-focused or microhistorical approaches) evaluate the longue durée solely through causal criteria—demanding it identify *why* specific outcomes happened—and find it lacking, concluding it is merely descriptive. Proponents (e.g., world-systems theorists or environmental historians) defend its explanatory role but fail to articulate *how* it explains, often conflating enabling and causal functions. Neither side explicitly disentangles these explanatory modes, leaving the core issue unresolved: whether the longue durée’s value lies in enabling rather than causing outcomes.  

  **3. Method**  
  I will employ a two-part approach: conceptual analysis and a focused historical case study. Steps include:  
  1. **Define and distinguish explanatory modes**: Operationalize "causal explanation" (identifies mechanisms directly producing outcomes) and "enabling explanation" (identifies background conditions that create possibilities but do not select among them), drawing on philosophy of history and science.  
  2. **Select a case study**: Choose a well-documented historical event where the longue durée is prominently debated (e.g., the 17th-century Little Ice Age’s impact on state collapse in the Ming Dynasty). Criteria: (a) robust scholarship invoking longue-durée factors (climate, geography), and (b) explicit disagreements about their explanatory role.  
  3. **Analyze primary and secondary sources**: Trace how scholars deploy longue-durée factors in the case. Code textual evidence into three categories: causal claims (e.g., "drought *caused* rebellion"), enabling claims (e.g., "climate vulnerability *enabled* widespread unrest"), or descriptive framing.  
  4. **Evaluate explanatory efficacy**: Assess whether enabling claims (a) define the range of possible outcomes, (b) are necessary for causal narratives to function, and (c) are misrepresented as causal in critiques.  
  5. **Test the distinction’s resolving power**: Apply the causal/enabling framework to the case debate. Determine if it reconciles disagreements by showing critics fault the longue durée for not being causal (a job it never claimed) while proponents overlook its enabling specificity.  

  **4. Deliverable: What a Useful Result Looks Like**  
  A successful outcome would:  
  - Demonstrate that the longue durée consistently operates as an enabling explanation (e.g., in the case study, it reveals *why* certain crises were possible but not *why* specific decisions or events occurred).  
  - Resolve the debate by showing that critics’ "just background" charge stems from demanding causal work, while proponents’ "explanatory" defense is valid only when limited to enabling.  
  - Produce a transferable framework for evaluating structural explanations in history, applicable beyond Braudel.  

  **5. Failure: What Would Undermine the Project**  
  The project fails if:  
  - The case study shows longue-durée factors are *indistinguishable* from causal explanations in practice (e.g., if climate is directly shown to *determine* outcomes without contingency).  
  - The distinction does not resolve the debate (e.g., if critics reject enabling explanations as non-explanatory even after clarification).  
  - No clear enabling role emerges (e.g., if longue-durée factors are purely descriptive in the case).  

  **6. Scope Risk: What Could Make This Too Big for One Chapter**  
  The single greatest risk is **case-study sprawl**: Selecting a multi-regional or multi-century phenomenon (e.g., "the rise of capitalism") could require analyzing vast literatures and variables, exceeding chapter limits. Mitigation: Strictly focus on one discrete event/process (e.g., a single rebellion or policy shift) where the longue durée’s role is sharply contested.  

