prompt: |-
  I direct a forecasting unit inside a national financial-stability authority. About forty economists and analysts file quantitative forecasts each quarter — probabilities of bank failure over a two-year horizon, predictive distributions for growth and inflation, dates for stress events — and those numbers are used to allocate supervisory attention and capital buffers, and are later laid before a parliamentary committee. I am rebuilding our scoring and feedback system, and I want it grounded in what accuracy-first epistemology and the theory of proper scoring rules actually establish, not in the folklore that has grown up in our shop.

  What I need is a written procedure, not a survey of the literature. It should be something an economist with no measure theory can run, in roughly twenty minutes per analyst per filing cycle, and it should take the four recurring decisions below in a fixed order. For each: state the test to apply, what counts as a sufficient answer to that test, what the procedure outputs, and — explicitly, in the margin — which steps are judgment calls wearing procedural clothing rather than genuine derivations from the theory.

  1. Choice of scoring rule. For each class of forecast we produce (binary events; categorical events with three to eight outcomes; full predictive distributions over a continuous quantity), say which rule we adopt — quadratic/Brier, logarithmic, spherical, or a continuous-ranked analogue — and which formal property is doing the work in that choice: strict propriety, boundedness, behavior at the extremes, sensitivity to tail probability, decomposability into calibration and sharpness. It must tell a forecaster in advance what the rule will cost them for reporting 0.001 on something that happens, and for reporting 0 on something that does not. Where the dominance result that motivates the whole system depends on specific conditions being imposed on the inaccuracy measure, identify those conditions, so that I know what we give up if we drop one.

  2. Granularity and binning. Most filings are binned, and in a minority of cases the analyst picks the bin boundaries. I take it that a credence function's total inaccuracy is measured relative to a partition, so that refining the partition changes the total, and that the dominance arguments are stated relative to a partition held fixed. If that is wrong, say so plainly. If it is right, the procedure needs a rule for fixing granularity in advance, a rule for what happens to the score of an analyst who gains or loses purely through the boundaries they chose, and a statement of whether the same granularity must apply across analysts for the scores to be comparable at all.

  3. Evidence, self-undermining, and mandate. Two situations recur. First, an analyst acquires, mid-quarter, information they expect would move their credence somewhere worse if they updated on it — a rumor about an institution that is probably false but cannot be checked for months. Second, the analyst's own filing influences the outcome: a published warning triggers the intervention that prevents the event being forecast. I want the procedure to say what accuracy-first reasoning licenses in each case, where our mandate must override it, and — directly, not diplomatically — whether maximizing expected accuracy from one's current standpoint ever recommends declining free relevant evidence. If it does, our system is teaching a lesson I do not want to teach, and I need to know which part of the theory produces it.

  4. Imprecise and hedged filings. A substantial minority of analysts do not submit point credences. They submit intervals ("between 0.1 and 0.3") or sets of distributions. Say how such filings are scored, if at all; whether the accuracy-dominance argument that justifies our system applies to them; and what the procedure does when an analyst uses imprecision to avoid committing to anything scoreable.

  Then run the procedure on three cases, and report what it delivers in each:

  (a) An analyst reported 0.02 for an institution's failure; the institution failed; the analyst now proposes to file 0.02 again on the same exposure next quarter, on the grounds that the report was the right one to make and a single bad outcome does not show otherwise.

  (b) Our IT group proposes switching all distributional forecasts from the logarithmic to the quadratic score, on the grounds that it is less punitive and analysts complain less.

  (c) An analyst splits a three-bin inflation forecast into eight bins mid-year, having noticed that the coarse rule rewards sharpness near the true value.

  For at least one of these three, the procedure should reach a conclusion I will not like. Say which one, say that it is unwelcome, and say why I should accept it anyway rather than amend the procedure.

  Finally, close with a short section on what the procedure cannot do: the failures it will generate systematically, the epistemic virtues other than accuracy that our filings ought to have and that this system will not reward, the ways in which scoring will distort what analysts choose to forecast about rather than how well they forecast it, and the points at which the choice of inaccuracy measure is doing substantive philosophical work that no amount of procedural tidiness will conceal. Where the procedure hands a decision to a person instead of resolving it, name who that person is — the analyst, me, or the committee — and why the question is one of values rather than of fact.
reasoning: |-
  Okay, the user is directing a forecasting unit at a national financial-stability authority. They need a practical scoring procedure grounded in proper scoring rules, not folklore. Let me unpack their requirements.

  First, they want a step-by-step procedure for four key decisions: choice of scoring rule, granularity/binning, handling evidence/mandate conflicts, and scoring imprecise forecasts. The procedure must be executable by economists without measure theory in ~20 mins per analyst per cycle. 

  Hmm... the user is clearly frustrated with existing ad hoc approaches. Their emphasis on "accuracy-first epistemology" suggests they want rigor but also transparency - analysts should understand why they're scored a certain way. The parliamentary committee oversight adds political sensitivity.

  Breaking this down:
  For scoring rule selection (Decision 1), the key is matching rule properties to forecast types while explaining trade-offs. Brier for binary for strict propriety and boundedness, CRPS for continuous for tail sensitivity. Must explicitly state costs for extreme predictions like reporting 0 when event occurs.

  Granularity (Decision 2) is tricky. Need to enforce fixed partitions upfront because scores aren't partition-invariant. Analysts shouldn't gain/lose by bin choices - this requires standardization. Scores only comparable under identical partitions.

  The evidence/mandate dilemma (Decision 3) exposes theory-practice gaps. Accuracy-first says always take free evidence, but mandate may prohibit it if it causes panic. Need to separate epistemic recommendation ("take evidence") from operational mandate override.

  For imprecise forecasts (Decision 4), strict accuracy-dominance only works for precise credences. Should score intervals conservatively (e.g., using CRPS min/max) but note this isn't strictly proper. Penalize evasion tactics.

  The test cases reveal pain points:
  - Case A: Analyst wants repeat forecast despite failure. Procedure must affirm their stance - single outcome doesn't disprove calibration. This might frustrate the user who wants accountability, but it's epistemically correct.
  - Case B: Switching to quadratic score for distributions. Procedure blocks this - logarithmic's tail sensitivity is crucial for financial stability where extremes matter.
  - Case C: Analyst gaming bins. Procedure detects sharpness opportunism and mandates fixed partitions.

  Biggest tension is Case B - user won't like defending logarithmic's harshness but must accept it because underweighting tail risks could be catastrophic. The "unwelcome conclusion" section needs to emphasize that complaint reduction isn't worth losing extreme event sensitivity.

  Finally, the limitations section should be brutally honest: 
  - Scoring can't assess justification quality
  - Encourages forecasting measurable things over important unknowns
  - Binning choices embed value judgments
  - Mandate conflicts require committee decisions

  This user needs both philosophical rigor and operational practicality. The procedure must function as both scoring tool and pedagogical device to combat folklore. The parliamentary scrutiny angle means every design choice must be defensible under oath.
answer: |-
  Here is a fixed-order written procedure for scoring analyst forecasts, grounded in accuracy-first epistemology and proper scoring rules. It addresses your four decisions systematically, includes test cases, and highlights limitations. **Judgment calls are explicitly marked in the margin (▶)**.

  ---

  ### **Procedure: Forecasting Unit Scoring System**  
  *Version 1.0 | Grounded in Strictly Proper Scoring Rules*  

  #### **Decision 1: Choice of Scoring Rule**  
  **Test to apply:** For each forecast class, select a strictly proper scoring rule that incentivizes truthful reporting of the analyst’s true beliefs.  
  **Sufficient answer:**  
  - **Binary events (e.g., bank failure):** Use the **Brier (quadratic) score**.  
    *Formal property:* Strict propriety and boundedness.  
    *Cost for reporting \(p\) when event occurs:* \((1 - p)^2\).  
    *Cost for reporting \(0\) when event occurs:* \(1\) (maximum penalty).  
    *Cost for reporting \(0.001\) when event occurs:* \(\approx 1\).  
  - **Categorical events (3–8 outcomes):** Use the **Spherical score**.  
    *Formal property:* Strict propriety and sensitivity to all probabilities (not just dominant ones).  
  - **Continuous distributions (e.g., GDP growth):** Use the **Continuous Ranked Probability Score (CRPS)**.  
    *Formal property:* Strict propriety and sensitivity to distance in outcomes (tail probabilities matter).  

  **Output:** A rule for each forecast type and a table of penalty examples (e.g., reporting \(0\) and being wrong costs \(1\); reporting \(0.001\) and being wrong costs \(0.998\)).  
  **▶ Judgment call:** Choosing boundedness (Brier) over tail sensitivity (Logarithmic) for binary events avoids infinite penalties, aligning with institutional risk tolerance.  

  ---

  #### **Decision 2: Granularity and Binning**  
  **Test to apply:** Fix partitions in advance. Scores are partition-relative; changing bins changes score interpretation.  
  **Sufficient answer:**  
  - **Rule for granularity:** Supervisory committee sets bin boundaries *ex ante* (e.g., inflation bins: <0%, 0–2%, 2–4%, >4%). Analysts *cannot* choose boundaries.  
  - **Analyst boundary changes:** Scores are incomparable if partitions differ. Re-bin all forecasts to a common partition using linear interpolation.  
  - **Comparability:** Scores are comparable *only* under identical partitions.  

  **Output:** Fixed bin definitions for all forecast classes. Re-binning protocol for non-compliant submissions.  
  **▶ Judgment call:** Choosing partition fineness (e.g., 4 bins vs. 8 for inflation) trades off resolution against statistical noise. Committee must decide.  

  ---

  #### **Decision 3: Evidence, Self-Undermining, and Mandate**  
  **Test to apply:** Maximizing expected accuracy requires incorporating all relevant evidence.  
  **Sufficient answer:**  
  1. **Withholding information:** Analysts *must* incorporate all available evidence. Reporting anything other than their true credence violates strict propriety.  
     *Accuracy-first license:* Never decline free relevant evidence.  
  2. **Self-undermining forecasts:** If a forecast triggers intervention (e.g., warning prevents failure), score the event as *non-occurrence*.  
     *Mandate override:* Score based on observable outcome. Document intervention effect separately for committee review.  

  **Output:** Mandatory evidence inclusion; scores based on actual outcomes post-intervention.  
  **▶ Judgment call:** Accepting that forecasts can influence outcomes (no theory fix; mandate overrides epistemology).  

  ---

  #### **Decision 4: Imprecise/Hedged Filings**  
  **Test to apply:** Score only precise probabilities/distributions. Accuracy-dominance requires exact commitments.  
  **Sufficient answer:**  
  - **Intervals/sets:** Require a single distribution. If an analyst submits a range (e.g., [0.1, 0.3]), score the *midpoint* (0.2) using the standard rule.  
  - **Accuracy-dominance:** Applies *only* to precise forecasts. Imprecise filings break dominance arguments.  
  - **Evasion tactic:** Flag analysts who repeatedly use imprecision. Escalate for retraining or mandate review.  

  **Output:** Scores for precise distributions only; midpoint conversion for intervals; evasion audit trail.  

  ---

  ### **Test Cases**  
  **(a) Analyst repeats 0.02 forecast after failure**  
  - **Procedure:** Score the original forecast: cost = \((1 - 0.02)^2 = 0.9604\) (high penalty).  
  - **Output:** The analyst is correct that one failure doesn’t prove miscalibration *if their true credence was 0.02*. No procedural penalty for repeating.  
  - **Why accept it?** Scoring rules evaluate *reported probabilities*, not outcomes. Calibration is assessed over many forecasts.  

  **(b) IT proposes switching to quadratic score for distributions**  
  - **Procedure:** Reject. CRPS (current rule) is strictly proper and sensitive to tail distances. Quadratic score for distributions ignores tail probabilities (e.g., treats a 5% GDP drop the same as a 1% drop if mean is identical).  
  - **Output:** Keep CRPS. Explain that quadratic underweights tail risks critical for financial stability.  
  - **Unwelcome conclusion?** Yes. Analysts will complain, but **accept it because**: Logarithmic/CRPS penalties for tail events force attention to systemic risks, aligning with institutional purpose. Switching undermines incentives.  

  **(c) Analyst refines bins mid-year**  
  - **Procedure:** Re-bin all historical forecasts to the new 8-bin partition. Recalculate past scores.  
  - **Output:** Analyst gains no advantage. Historical scores change; sharpness rewards are partition-dependent.  
  - **Why accept it?** Prevents gaming by enforcing fixed partitions.  

  ---

  ### **Limitations and Failures**  
  1. **Systematic failures:**  
     - Rewards *overconfidence* if models are misspecified (e.g., 99% confidence in wrong prediction scores better than 60% confidence).  
     - Ignores *justification* for forecasts (e.g., an analyst with bad methodology but lucky outcomes scores well).  
     - **Distortion:** Analysts may avoid forecasting hard-to-measure events (e.g., systemic contagion) in favor of easier targets.  

  2. **Epistemic virtues not rewarded:**  
     - **Honesty** (vs. gaming), **information gathering**, **peer critique**, and **model robustness**.  

  3. **Value judgments masked as technical choices:**  
     - ▶ **Partition granularity:** How much detail matters? (Committee decides.)  
     - ▶ **Tail sensitivity:** How harshly to penalize underweighting extreme events? (You decide.)  
     - ▶ **Evasion response:** How strictly to enforce precision? (You decide.)  

  4. **Procedural handoffs:**  
     - **Partition design:** Committee (values: what risks merit granularity?).  
     - **Rule selection:** You (values: tail risk tolerance).  
     - **Evasion discipline:** You (values: balancing precision with analyst morale).  

  ---  
  **Final note:** This system ensures *allocative efficiency* (resources follow accurate probabilities) but not *truth-seeking*. It is a tool for incentives, not epistemology. Amendments for "diplomacy" or reduced penalties will break dominance and invite gaming. Publish the rules transparently to align expectations.
