  I need to break this down carefully. The two main criticisms they mentioned are "victor's justice" (only losers punished) and "retroactive law" (punishing actions that weren't illegal at the time). The defenses are that the actions were universally wrong and that new rules were needed to prevent future atrocities.

  The school analogy they suggested is perfect: juniors doing coordinated phone cheating, principal making a new AI cheating rule after the fact, holding a trial only for the juniors but not football players who did same thing, and teachers who helped becoming judges instead of defendants. This maps surprisingly well to the trial criticisms.

  For victor's justice → selective enforcement. Like how athletes get lighter punishments at school. For retroactive law → new handbook rule created after the cheating happened. For judges being biased → teachers who participated becoming judges. 

  I should also point out where the analogy doesn't hold. The scale is completely different - cheating vs genocide. Also, international law lacks a central authority like a principal. And the "superior orders" defense (just following orders) doesn't really apply in school settings. Plus, at school you can resign or transfer, but soldiers couldn't just leave Nazi Germany.

  The user seems genuinely interested in understanding this, not just getting homework done. They're using a smart learning strategy by connecting complex concepts to familiar experiences. Their tone is a bit stressed about the Friday deadline though, so I should keep this clear and practical.

  For the "residue report" they asked for, I'll systematically note: what translated cleanly (like selective enforcement), what needed stretching (how we define "everyone knew it was wrong"), and what couldn't fit (the impossibility of resigning from a regime). This will help them see both the usefulness and limits of the analogy.

  Most importantly, I should reassure them that the "fuzziness" in translation actually reflects real debates in international law - it's not their fault for not grasping it. The messy parts show why these trials remain controversial among historians and legal scholars.
