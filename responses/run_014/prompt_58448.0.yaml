  then give me a residue report or whatever, like what parts translated cleanly, what parts you had to stretch or fudge to fit into school language, and what parts just have no version in school world at all. and tell me if that leftover stuff means my school analogy is missing something important or if it means the original arguement about the trials was kinda fuzzy to begin with. sorry if this is a lot, i just learn better this way and my essay is due friday lol
