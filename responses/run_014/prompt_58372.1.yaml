prompt: |-
  My mate tried to sum up prioritarianism for me after our political philosophy seminar and it sounded a bit too neat. He said prioritarianism means we should maximise total happiness but give bonus points for happiness that goes to worse-off people, so it cares about equality but would never approve making everyone worse off just to make things equal, unlike strict egalitarians who have to say its actually good to bring the better-off down to the level of the worse-off even if nobody gains. That means prioritarians totally dodge the levelling-down objection, he reckons, and the only arguement left is about how much extra weight to give.

  I'm not sure what to trust here. Can you audit his summary claim by claim and tell me what a prioritarian would actually sign up to and whether his dodge conclusion survives once you fix the mistakes? I keep thinking about my own wierd case: two carers on 30 and 80 wellbeing, and we can either leave it or shift to 31 and 31 by wasting a lot — would a prioritarian really say no every time?

  Please put the audit in a table with these four columns: His Claim | Verdict [accurate / oversimplified / wrong] | What a defender would correct | Matters for his dodge conclusion [yes/no + one line why].
reasoning: |-
  Hmm, the user is asking me to audit their mate's summary of prioritarianism in political philosophy. They've provided a specific scenario with two carers at wellbeing levels 30 and 80, and a proposal to shift both to 31 through wasteful means. They want me to evaluate their friend's claims through a structured table format.

  The user seems skeptical about their friend's description that prioritarianism neatly avoids the "levelling-down objection" that strict egalitarianism faces. They're clearly engaged with this philosophical concept and want to understand the nuances beyond what their friend presented. Their scenario about the carers suggests they're testing whether prioritarians would indeed reject equality if it makes everyone worse off.

  Their friend made several claims: that prioritarianism maximizes total happiness with bonus points for the worse-off, that it cares about equality but avoids making everyone worse off, that it completely dodges the levelling-down objection, and that the only debate is about weighting. These claims need careful examination since prioritarianism is more complex than presented.

  I recall that prioritarianism focuses on giving priority to the worse-off through a concave transformation of wellbeing rather than "bonus points." It doesn't inherently care about equality per se, but about the absolute wellbeing of the disadvantaged. While it avoids the most straightforward levelling-down objection (where only the better-off are lowered), it can still face modified versions - like in the user's scenario where both end up worse off but equal.

  For the table, I'll need to evaluate each claim: 
  - The "bonus points" framing is oversimplified (it's about weighting, not additive bonuses)
  - The claim about caring about equality is wrong (it cares about priority, not equality)
  - The claim about never approving making everyone worse off is oversimplified (depends on weighting)
  - The dodge conclusion is oversimplified (it avoids simple levelling-down but not all variants)
  - The "only argument is weight" claim is oversimplified (there are other debates)

  The user's carer scenario is perfect for testing this - prioritarians would indeed reject moving to 31/31 because the marginal gain for the worse-off (30→31) doesn't outweigh the massive loss for the better-off (80→31) under any reasonable weighting. This confirms prioritarianism avoids this form of levelling-down, but not all possible versions.

  For the "matters for dodge" column, I'll note how each point affects the friend's conclusion about prioritarianism completely avoiding levelling-down objections. The core insight that prioritarians reject destructive equality holds, but the presentation misses important nuances about how priority weighting works and what counts as "everyone worse off" in edge cases.
answer: |-
  Here's a detailed audit of your mate's summary, presented as requested. The key insight is that prioritarianism generally avoids the *core* levelling-down objection but his description oversimplifies its mechanism and scope.

  | His Claim                                                                 | Verdict                | What a defender would correct                                                                                                | Matters for his dodge conclusion? (yes/no + why)                                                                 |
  | :------------------------------------------------------------------------ | :--------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | "Maximise total happiness but give bonus points for happiness going to worse-off people" | **Oversimplified**     | It's not additive "bonus points" on top of total utilitarianism. Prioritarians use a **concave transformation function**: each unit of wellbeing has diminishing moral value as a person's absolute level increases. We maximise the *sum of transformed wellbeing*, not raw wellbeing plus bonuses. | **Yes** - The core mechanism (diminishing moral weight) is crucial to *how* it avoids levelling down simply.     |
  | "Cares about equality"                                                   | **Wrong**               | Prioritarianism cares about **absolute priority to the worse-off**, **not equality per se**. It would favor an unequal society where the worst-off are better absolutely over a perfectly equal one where the worst-off are worse off (even if equality is higher). Equality is often a *byproduct*, not the goal. | **Crucially Yes** - This misattribution confuses the *motivation*. Prioritarianism avoids levelling down precisely because it doesn't intrinsically value equality. |
  | "Would never approve making everyone worse off just to make things equal" | **Oversimplified**     | This is **largely true for the *core* levelling-down objection** (only lowering the better-off). However, **it *can* approve policies making *some* worse-off if the *priority-weighted gains* for the worst-off are large enough**, even if *total* untransformed wellbeing decreases. It rejects moves *solely* for equality with no gain. | **Yes** - While true for pure levelling-down, the potential acceptance of some "worsening" for large priority gains is relevant to the *scope* of the dodge. |
  | "Totally dodges the levelling-down objection"                            | **Oversimplified**     | It **dodges the *core* levelling-down objection** (only lowering the better-off) because lowering the better-off provides *no* priority-weighted gain. **However, it faces a *modified* levelling-down objection:** it *must* view a change *only* lowering the better-off as *just as good* as no change (since no one gains priority-weighted wellbeing), whereas strict egalitarians see it as *better*. Some argue this indifference is still problematic. | **Yes** - While it avoids saying levelling-down is *good*, its *indifference* is a weaker dodge than claiming it's *bad*, leaving a residual objection. |
  | "The only argument left is about how much extra weight to give"           | **Oversimplified**     | Weighting is the **primary** debate, but others exist: 1) The *shape* of the transformation function (how steeply does moral weight diminish?). 2) Is it *only* about baseline wellbeing, or also desert/effort? 3) How to measure & compare wellbeing? 4) The significance of the *modified* levelling-down objection (indifference). | **No** - While weighting is central, these other arguments exist independently of the core levelling-down dodge. |

  **Audit Conclusion & Your Case:**

  1.  **Core Dodge Survives (with nuance):** Your mate is **largely correct** that prioritarianism avoids the *core* levelling-down objection. It would **never** approve *only* lowering the better-off (e.g., moving 30/80 -> 30/30) because this yields *zero* gain in priority-weighted wellbeing. Strict egalitarianism *would* see this as an improvement (due to increased equality).
  2.  **Your Carer Case (30/80 vs 31/31):** A prioritarian **would indeed say "no" to shifting to 31/31 every time** (assuming rational weighting). Here's why:
      *   The person going from 30->31 gains a small amount of wellbeing. Because they start very low, this gain has *high moral weight*.
      *   The person going from 80->31 loses a *massive* amount of wellbeing. Because they started high, the *initial* parts of their loss have moderate weight, but as their level plummets, each subsequent unit lost has *increasingly higher moral weight* (due to the concave function). The total *disvalue* of this huge loss massively outweighs the high-weighted small gain of the other person.
      *   The *sum of priority-weighted wellbeing* would be drastically lower at 31/31 than at 30/80. Maximising the sum of transformed wellbeing requires rejecting this move.
  3.  **Key Nuances Missed:**
      *   **Not Equality, Priority:** The driving force is the absolute level of the worst-off, not reducing gaps.
      *   **Diminishing Weight, Not Bonuses:** The mechanism is transforming the *input* (wellbeing), not adding bonuses to the *output* (total).
      *   **Indifference, Not Active Rejection of Pure Levelling:** Prioritarians see pure levelling-down as *equally as good* as the status quo, not *worse*. This avoids the objection but creates a different philosophical tension.
      *   **Potential for Overall-Worsening Policies:** If a policy significantly boosts the very worst-off while mildly harming the very best-off *and* the priority-weighted gains outweigh the priority-weighted losses, a prioritarian *might* approve it even if *total* (untransformed) wellbeing decreases. This isn't "levelling down for equality," but it *is* making some worse off for the sake of priority gains elsewhere. Your mate's "never approve making everyone worse off" is too strong if "everyone" means *each individual* – it *can* approve making *some* worse off.

  **In short:** Your mate correctly identifies prioritarianism's core advantage over strict egalitarianism regarding the levelling-down objection and accurately predicts its rejection of your carer case. However, his description oversimplifies the mechanism ("bonus points" vs. transformation), misstates the motivation ("cares about equality" vs. "gives priority to the worse-off"), and overstates the completeness of the dodge (ignoring the modified objection based on indifference). The core dodge *does* survive scrutiny, but the philosophical picture is richer and slightly messier than he presented.
