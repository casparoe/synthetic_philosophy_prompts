  Okay, the user is part of a working group drafting ethical guidance for clinicians facing impossible situations like resource shortages. They need a specification of requirements for any moral conflict framework to be adequate. Let me break down their query.

  First, they listed seven requirements but want me to add any missing ones. Looking at their points: phenomena explanation, distinctions, fate of obligations, formal consistency, distribution across agents, action-guidance, and non-ubiquity. I should check if there are gaps. Maybe something about psychological impact on clinicians? Or institutional responsibility? But they might have covered that under distribution. Also, how about the role of systemic injustice as a distinct source of conflict? That could be an addition.

  They mention distinguishing between tragedy and dilemma. That’s covered, but maybe the specification needs to handle evolving obligations over time, like during prolonged crises. Also, epistemic limitations—when agents can’t know all factors. That might be important for action-guidance. 

  The user suspects some requirements are substantive theses smuggled in. For example, the demand that unfulfilled obligations persist might be contested. Some theories might say obligations lapse without residue. I need to flag which requirements are substantive. Also, formal consistency’s agglomeration rejection might be a cost some theories accept, but the user wants to know the trade-offs.

  Possible contradictions: If a theory insists obligations always persist (requirement 3), but also avoids regress, that might clash. Or if non-ubiquity conflicts with explaining phenomena—if most theories can't satisfy both. Also, distribution across agents might conflict with individual accountability. 

  The most eliminative requirement is probably formal consistency. Theories that allow genuine conflicts must modify deontic logic, which many find costly. That would filter out many candidates quickly. 

  For the two strategies: Dissolving conflicts into pro tanto duties might handle logic but struggle with residual duties and distress. Accepting conflicts might explain phenomena but fail on action-guidance if agents can’t fulfill both. 

  Need to add requirements. Epistemic constraints and systemic injustice as conflict sources. Also, temporal aspects of obligations in crises. And perhaps the framework’s applicability to policy, not just individual clinicians. 

  Each requirement’s status: Phenomena explanation is a constraint; collapsing distinctions might be substantive; fate of obligations is substantive; formal consistency is a logical constraint; distribution is substantive; action-guidance is practical; non-ubiquity is a constraint. 

  The user’s deeper need is a robust framework that clinicians can use without residual guilt or systemic blame-shifting. They want clarity on what’s theoretically possible, not just appealing. Highlighting trade-offs and impossibilities is key.
answer: |-
  Here is a specification of requirements for an adequate account of moral conflict, addressing your points and adding critical omissions. Each requirement includes its motivation, criteria for assessment, and classification as either a **genuine constraint** (GC) or a **substantive thesis** (ST). Contradictions and eliminative power are noted.

  ---

  ### **Specification: Requirements for an Adequate Account of Moral Conflict**

  1.  **Phenomena Explanation (GC)**  
      *Motivation*: Clinicians experience persistent distress, guilt, and a perceived need for apology/reparation even after making the "correct" choice in resource-scarce scenarios. A theory dismissing this as mere confusion fails the lived reality of moral agents.  
      *Test*: The theory must explain why agents feel *moral residue* (guilt, need for reparation) without attributing it solely to error or irrationality. It must predict when such residue occurs and its appropriate expression (e.g., apology vs. compensation). Failure = inability to guide post-conflict responses meaningfully.

  2.  **Distinction Preservation (GC)**  
      *Motivation*: Collapsing distinctions (e.g., conflating conflicts of *obligation* vs. *values*, or *tragedy* vs. *dilemma*) obscures diagnosis and response. Clinicians need to know if they face a true obligation-conflict or a painful but unambiguous choice.  
      *Test*: The theory must provide operational criteria to distinguish:  
      - Conflicts of *binding obligations* vs. conflicts of values/reasons/desires.  
      - *Pro tanto* vs. *all-things-considered* verdicts, locating conflict clearly.  
      - Incompatibility *at a single time* vs. *over time* (specifying the relevant time-slice for "ought implies can").  
      - Conflicts caused by *agent's prior fault*, *others' fault*, or *brute luck* (and whether verdicts differ).  
      - *Tragedy* (all options permissible but bad) vs. *genuine dilemma* (no permissible option) vs. *hard choice* (options incomparable but not conflicted).  
      Failure = inability to categorize cases for targeted guidance.

  3.  **Fate of Unfulfilled Obligation (ST)**  
      *Motivation*: What happens to the obligation to Patient B when the clinician saves Patient A due to scarcity? Does it vanish, convert to compensation, or persist as a debt? A "residual duty" that *cannot* be discharged recreates the conflict (e.g., "compensate" with no resources).  
      *Test*: The theory must specify the ontological/metaphysical status of the overridden obligation:  
      - Lapses entirely?  
      - Transforms into a *dischargeable* duty (e.g., compensation, apology)?  
      - Persists as an unredeemable debt?  
      - Transfers to an institution?  
      **Regress Constraint (GC)**: The resolution *must not* generate a new obligation the agent *cannot* fulfill (e.g., "you must compensate B" when compensation is impossible). Failure here = theoretical incoherence under scarcity.

  4.  **Formal Consistency Handling (GC)**  
      *Motivation*: Standard deontic logic holds that obligations agglomerate (Oblg A & Oblg B → Oblg (A & B)) and that "Ought implies Can" (Oblg X → Can X). Genuine conflicts violate this.  
      *Test*: The theory must explicitly:  
      - **Reject Agglomeration** (cost: conflicts ordinary intuition that "you should do A and B" is meaningful), OR  
      - **Reject "Ought Implies Can"** (cost: severs morality from practical possibility, risking incoherence), OR  
      - **Deny Genuine Conflict** (cost: must explain away phenomena in #1).  
      Must state the cost and whether it burdens the theory or revises common sense.

  5.  **Distribution Across Agents/Systems (ST)**  
      *Motivation*: Scarcity is often systemic (e.g., no beds, not enough staff). Who bears the obligation when no individual can fulfill it? Can obligations belong to institutions alone?  
      *Test*: The theory must:  
      - Specify if obligations can meaningfully attach to *institutions* (not just individuals).  
      - Explain how system-level obligations distribute to individual agents (e.g., triage protocols).  
      - Address whether individual clinicians retain *personal* obligations even under systemic failure.  
      Failure = inability to assign responsibility in organizational contexts.

  6.  **Action-Guidance & Publicity (GC)**  
      *Motivation*: Guidance must be usable. Verdicts like "do the impossible" are useless. Clinicians will read the guidance; if knowing the theory undermines its verdicts (e.g., "this is a dilemma, so do whatever"), it fails.  
      *Test*:  
      - Verdicts must be *actionable* (specify *what to do*, not just describe conflict).  
      - Verdicts must be *stable under publicity*: knowing the theory's correct verdict shouldn't rationally compel the agent to disobey it (e.g., "knowing this is a true dilemma makes me morally free to flip a coin" is unstable).  
      Failure = guidance is practically inert or self-defeating.

  7.  **Non-Ubiquity (GC)**  
      *Motivation*: If every hard choice is a genuine obligation-conflict, the concept loses meaning. Guidance must distinguish routine trade-offs from true moral dilemmas.  
      *Test*: The theory must provide criteria limiting genuine obligation-conflicts to *exceptional* circumstances (e.g., strict "cannot fulfill simultaneously" + "both obligations binding" + "no prior fault"). Failure = trivializes the concept and paralyzes decision-making.

  8.  **Added: Epistemic Constraints (GC)**  
      *Motivation*: Clinicians often act under uncertainty (e.g., unknown prognosis, hidden resources). Theories must clarify if conflicts arise only under full knowledge or also under reasonable uncertainty.  
      *Test*: The theory must state whether an obligation-conflict exists only when the agent *knows* the obligations are jointly unfulfillable, or also when they *reasonably believe* it. Must handle cases where uncertainty is resolvable vs. inherent.

  9.  **Added: Source of Conflict (ST)**  
      *Motivation*: Conflicts arising from injustice (e.g., underfunding) vs. pure contingency (e.g., natural disaster) may demand different responses (e.g., rectification vs. mourning).  
      *Test*: The theory must explicitly state if the *source* of the conflict (injustice, contingency, prior fault) alters the *moral status* of the choice or the *residual duties* (e.g., creates a duty to fight the injustice).

  ---

  ### **Contradictions & Impossibilities**
  *   **Fate (3) vs. Regress Constraint (GC within 3):** Insisting an unfulfilled obligation *always* persists as a debt risks regress unless it can be discharged *without creating a new impossible duty*. Theories claiming persistent debts must show they are metaphysically "frozen" or dischargeable symbolically/apologetically even when materially impossible.
  *   **Phenomena (1) vs. Dissolving Strategies (Strategy 1):** Theories that dissolve conflicts into outweighed *pro tanto* duties often struggle to explain persistent guilt/residue (#1) without smuggling in a notion of "violated" obligation. Accepting genuine conflicts (#4 escape) better explains #1 but pays the logic cost.

  ### **Most Eliminative Requirement**
  **Formal Consistency Handling (#4)** does the most work. It forces a fundamental choice: revise logic, reject a core principle ("ought implies can"), or deny the conflict exists. Most candidate theories founder here. Dissolving strategies (Strategy 1) typically deny conflict but struggle with #1 and #3. Conflict-accepting theories (Strategy 2) embrace the logic cost but often stumble on #6 (Action-Guidance) if not carefully formulated.

  ---

  ### **Performance of Broad Strategies**
  1.  **Dissolving Conflicts (e.g., Rossian *Pro Tanto* Duties):** Treats apparent conflicts as cases where one *pro tanto* duty is overridden by a stronger one. Only the all-things-considered duty is binding.  
      *Against Spec:* Explains #7 (Non-Ubiquity) and #4 (by denying conflict, preserves standard logic). Struggles with #1 (why persistent guilt/residue if no obligation was violated?), #3 (does the overridden *pro tanto* duty leave residue? If yes, risks regress; if no, struggles with phenomena). May blur #2 distinctions. Handles #5 if duties distribute clearly. #6 is strong (clear verdict). #8/#9 require auxiliary principles.

  2.  **Accepting Genuine Conflicts (e.g., Dilemmism):** Acknowledges obligations can be truly incompatible and jointly unfulfillable. Sacrifices standard deontic logic (e.g., rejects agglomeration).  
      *Against Spec:* Best explains #1 (residue from genuine violation). For #3, must specify fate (e.g., lapses? converts?). Avoids regress only if fate doesn't create new impossible duties. Excels at #2 distinctions. Pays high cost on #4 (logic revision). #5/#6 are challenges: distributing impossible duties is hard; action-guidance risks instability if "no correct choice" leads to paralysis. Risks violating #7 if applied too broadly. #8/#9 require integration.

  Your next step: Test frameworks against **Formal Consistency (#4)** to immediately eliminate options unable to handle the core logical challenge. Then scrutinize survivors on **Phenomena Explanation (#1)** and **Regress Constraint (within #3)**.
