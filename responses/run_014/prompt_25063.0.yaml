prompt: |-
  I'm a TA and next week I have to teach the paradox of deontology to first-years in one fifty-minute section. Not deontology generally — specifically the paradox that agent-centered constraints seem to forbid minimizing constraint-violations: if it's wrong to kill, why isn't it also wrong to let five be killed when you could stop it by killing one? Don't explain it to me; plan how I should explain it. What has to come first, what example should carry the whole thing (and why not the standard trolley problem, if not that), which misconceptions the students will form — I'm guessing 'those are totally different kinds of acts' or 'just be a consequentialist then' — and exactly where in the sequence I should head each one off, plus one question I can ask at the end to see whether they actually got the paradox rather than just feeling uneasy about it. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, let me tackle this TA's request for teaching the paradox of deontology to first-years. The core challenge is making them grasp why agent-centered constraints forbid minimizing violations, like why killing one to save five seems inconsistent if killing is absolutely wrong. 

  First, I need to structure the session for maximum clarity in 50 minutes. Starting with uncontroversial deontological principles makes sense—establish that some acts (killing) are intrinsically wrong regardless of consequences. Then introduce the conflict: what happens when not acting leads to more violations? The Transplant thought experiment works better than Trolley here because it removes distracting elements (like tracks/switches) and isolates the moral dilemma purely: actively killing vs. passively allowing death. 

  I predict two major misconceptions: students might argue letting die is fundamentally different from killing (distinction without moral difference in outcome), or default to consequentialism as an "easy fix." Both need preemptive blocking. For the first, I'll emphasize that both scenarios end with deaths—the paradox questions why intention/agency overrides outcome. For the second, I'll stress that rejecting deontology isn't solving the paradox but sidestepping it. 

  The key teaching moment is linking the paradox to the core of deontology: if constraints express agent-relative duties (e.g., "I must not kill"), then violating them to reduce others' violations treats morality as impersonal—contradicting the very basis of constraints. Finally, a diagnostic question should force students to articulate this tension: "Why can't a deontologist justify killing one to save five by claiming it minimizes overall violations?" If they mention the personal nature of duties, they've got it.
answer: |-
  **Bottom line: Structure your section by first grounding deontological constraints, then introducing the paradox through the "Transplant" case, preempting key misconceptions by contrasting acts/omissions and clarifying the paradox's target, and end with a diagnostic question about minimizing violations.**

  **Reasoning & Plan:**

  1.  **Start with Core Deontology (5-10 mins):**
      *   **What:** Define agent-centered constraints (e.g., "Don't kill an innocent person") as rules making actions wrong *in themselves*, regardless of *good consequences* (even preventing *other* wrongs/deaths). Emphasize *personal responsibility*: "It would be *me* committing this terrible act."
      *   **Why:** Students need the absolute, non-consequentialist nature of constraints crystal clear *before* the paradox hits. Without this, the paradox won't land.

  2.  **Introduce the Paradox via the "Transplant" Case (10 mins):**
      *   **The Case:** A brilliant surgeon can kill one healthy visitor secretly to harvest organs and save five dying patients. If she doesn't, the five die. Emphasize: She *must actively kill* the one to save the five; doing nothing lets the five die.
      *   **Why Transplant, Not Trolley?**
          *   **Focus:** Transplant removes distracting elements (e.g., tracks, switches, movement). It's pure, direct, intentional killing (surgeon's scalpel) vs. allowing death through inaction.
          *   **Psychological Distance:** Trolley can feel abstract/mechanical; Transplant feels visceral and personal, highlighting the constraint ("*I* kill this innocent person").
          *   **Omission/Commission Clarity:** The contrast between *killing* (act) and *letting die* (omission) is stark and central to the initial intuition clash.

  3.  **Present the Paradox Explicitly (5 mins):**
      *   State the contradiction: "Deontology says: 1) Killing the one is absolutely forbidden. 2) Letting the five die is also terrible (likely forbidden or strongly dispreferred). BUT, if (1) is absolute, *why isn't it morally required to violate (1) *once* to prevent (2) from happening *five times*? Wouldn't that minimize the *total* number of constraint violations (killings/deaths)?"

  4.  **Preempting Misconceptions (15 mins - Integrate during Transplant discussion & paradox presentation):**
      *   **Misconception 1: "Killing and Letting Die are Totally Different Kinds of Acts":**
          *   **When:** Address this *immediately* when presenting the Transplant case and the deontologist's initial objection ("But I can't *kill*!").
          *   **How:** Concede there *is* a difference, BUT argue it might not be *morally decisive* in justifying the outcome. Point out: Both involve death. Both involve *you knowing* your action/inaction leads to death. If letting 5 die is also a terrible moral failure (even if less direct), *why* does the *kind* of act (direct killing) trump the *scale* of the outcome (5 vs 1 death)? Frame it: "Does the difference in *how* you cause death really justify allowing *five times* as many deaths when you could prevent it?"
          *   **Goal:** Show that while the acts differ, the paradox challenges whether that difference justifies the massive disparity in outcome *from a deontological perspective itself*.
      *   **Misconception 2: "Just Be a Consequentialist Then":**
          *   **When:** Address this *after* fully stating the paradox and seeing students struggle.
          *   **How:** Acknowledge consequentialism *avoids* this problem. BUT clarify: **The paradox is an *internal* challenge *for deontology*.** It asks: "Can deontology itself *consistently* explain why minimizing violations isn't required?" Switching theories dodges the question; the paradox reveals a potential tension *within* deontology's core commitments (absolute constraints + the badness of violations).
          *   **Goal:** Keep the focus on deontology's self-consistency. The paradox isn't an argument *for* consequentialism (yet), but a problem *for* non-consequentialists.

  5.  **Core Insight & Framing (5 mins):**
      *   **The Paradox's Bite:** The challenge is that minimizing violations seems like a *deontological* goal (avoiding wrongs!), yet adhering strictly to the constraint *maximizes* violations in these cases. The constraint seems to forbid acting to bring about the *lesser moral evil* (one killing vs. five killings/deaths).
      *   **Agent-Relativity:** Emphasize the key is the *agent-relative* nature of constraints: "Don't *YOU* kill" isn't the same as "Minimize killings overall." Sacrificing one *yourself* to save others might violate the personal prohibition, even if it reduces total harm.

  6.  **Diagnostic Question (Use in last 5 mins or as a wrap-up prompt):**
      *   **The Question:** "If a deontologist believes 'killing an innocent is absolutely wrong,' can they consistently argue that killing the one in Transplant is the *right* thing to do *because* it minimizes the total number of killings/deaths? Why or why not?"
      *   **Why it Works:**
          *   It forces students to engage with the *minimization* aspect central to the paradox.
          *   It checks if they see the *internal* conflict for deontology (minimizing violations vs. adhering to the specific constraint).
          *   A correct answer rejects the minimization justification *because* it treats the constraint impersonally (minimize killings) rather than as a personal prohibition ("*I* must not kill"), thus violating the core agent-centered nature of the constraint. They should recognize that *for the deontologist*, committing the violation *yourself* is prohibited *even to prevent others*.

  **Key Flow:** Constraints -> Transplant Case (highlighting act/omission) -> Paradox Statement ("Why not minimize?") -> Defuse Act/Omission Distraction -> Defuse Consequentialism Distraction -> Frame Paradox as Internal Tension (Agent-Relativity vs. Minimizing Violations) -> Diagnostic Question. Keep examples crisp, focus on the logical tension, and explicitly label student intuitions as you go.
