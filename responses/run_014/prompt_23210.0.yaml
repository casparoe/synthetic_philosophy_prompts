  I've been trying to figure out whether retributivism — the idea that we punish people because they deserve it — actually makes sense, or if it's just consequentialism in a tranch coat. I've heard of this 'fair warning' argument: the idea that punishment is justified because the law warned people in advance that they would be punished if they broke it, so punishing them is 'fair' since they were on notice. But I keep getting the feeling that this is actually a consequentialist argument in disguise, because the only reason to care about the warning is the good consequences it produces (deterrence, etc.). And it seems like it falls apart against the person who genuinely never interalised the rules. Can you argue that the 'fair warning' defense of retributivism is really just a consequentialist argument in disguise, and that it fails against the person who didn't actually take in the warning?
