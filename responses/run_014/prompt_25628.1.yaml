  I recall that Dennett's cassette theory was designed to handle cases of dreams that seem to anticipate an external stimulus. For example, the famous alarm clock dream: the dreamer dreams of an event that culminates in an alarm bell, and then the alarm goes off. It seems as if the dream anticipated the alarm. The cassette theory says that the alarm sound triggered the recall and construction of the dream narrative that incorporated the alarm at the end.

  So let's design a scenario that has this "precognitive" feature but in an ordinary setting.

  Scenario:

  Alice goes to sleep. She has an alarm clock set for 7 AM. At 6:59 AM, the alarm is about to go off. At 7:00 AM, the alarm sounds (a loud beeping).

