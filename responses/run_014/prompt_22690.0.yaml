answer: |-
  That's a fantastic observation highlighting a fascinating and often misunderstood aspect of Sidgwick's life and work. It wasn't a contradiction or a secret dependence, but rather a deeply personal and intellectually driven **quest for empirical verification** of the postulates his own ethics demanded. Here's the breakdown:

  1.  **The Ethical Impasse (The "Dualism of Practical Reason"):**
      *   As you noted, Sidgwick, with ruthless intellectual honesty, concluded in *Methods of Ethics* that neither intuitionism, egoism, nor utilitarianism alone provided a complete, rationally coherent system.
      *   His critical insight was the **"Dualism of Practical Reason":** Rational Egoism (maximizing one's own happiness) and Utilitarianism (maximizing universal happiness) are both demonstrably rational principles, yet they can fundamentally conflict.
      *   **The Need for Postulates:** Sidgwick saw that for these two rational principles to be reconciled *and* for morality to be ultimately rational *and* binding, a "moral government" of the universe was necessary. This required:
          *   **Immortality:** To provide sufficient time for the complete harmonization of virtue and happiness *for the individual*.
          *   **Divine Retribution (a Benevolent, Just God):** To guarantee that this harmonization actually occurs – that happiness is ultimately proportioned to virtue across eternity.
      *   Without these postulates, Sidgwick believed the conflict between egoism and utilitarianism remained unresolved, potentially undermining the rationality of pure morality (utilitarianism) if it consistently demanded significant self-sacrifice without ultimate compensation.

  2.  **The Personal Crisis and the Role of Psychical Research:**
      *   Sidgwick wasn't content to merely posit these postulates as Kantian "necessary assumptions for practical reason." He was a Victorian empiricist deeply committed to evidence and verification. He found himself in a profound personal crisis: his ethics logically demanded belief in God and immortality, but his rigorous intellectual standards prevented him from accepting them based solely on faith, religious authority, or philosophical necessity.
      *   **The Quest for Evidence:** This is where psychical research enters. Sidgwick wasn't primarily interested in ghosts or telepathy for their own sake (though he found them intellectually stimulating). He saw psychical phenomena as a potential **scientific avenue to empirically verify the existence of an immaterial soul and, crucially, life after death.**
      *   **The Link:** If phenomena like verifiable telepathy (suggesting non-physical mind), credible apparitions of the dead, or convincing communications from the deceased could be scientifically established, this would provide the *evidence* Sidgwick craved for the postulate of personal immortality. Proof of survival would make the postulate of a benevolent God orchestrating ultimate justice far more plausible.
      *   **Motivation:** His motivation was deeply ethical and philosophical. As he reportedly said, he sought evidence that would "break the world in two." He wanted proof that transcended philosophical argument and provided a factual basis for the beliefs his ethics required. The SPR was founded with this serious philosophical/scientific purpose, aiming to apply rigorous methods (for the time) to investigate claims often dismissed as superstition.

  3.  **The Empirical Case: Strength and Outcome:**
      *   **Rigorous for the Time:** Sidgwick and the early SPR (including luminaries like Frederic Myers and Edmund Gurney) were genuinely committed to scientific methodology. They developed protocols for investigating mediums, collecting and cross-referencing spontaneous case reports of apparitions, and conducting early experiments in telepathy. They exposed numerous frauds.
      *   **Significant Data, Inconclusive Proof:** They amassed a large volume of anecdotal reports and some intriguing experimental results (like the "Cumberland experiments" in thought-transference). They found many cases that resisted conventional explanations like fraud or coincidence, particularly in the "crisis apparition" phenomenon (seeing an apparition of someone at the moment of their death far away).
      *   **Not Strong Enough (For Sidgwick and Ultimately Science):**
          *   **Fraud and Ambiguity:** Despite their efforts, fraud remained a persistent problem, especially with mediums. Many phenomena were ambiguous, open to psychological explanations (suggestion, hallucination, subconscious perception), or simply lacked the irrefutability Sidgwick sought.
          *   **Sidgwick's Own Assessment:** Crucially, Sidgwick himself, despite decades of work, **never felt he had found conclusive proof.** He remained deeply disappointed and disillusioned, famously expressing profound pessimism about finding the evidence he needed before his death. He never publicly claimed his ethical arguments *depended* on SPR findings, precisely because he knew the evidence wasn't strong enough.
          *   **Modern Assessment:** From a contemporary scientific perspective, the case built by Sidgwick and the early SPR is **not considered strong enough** to support the weighty metaphysical conclusions Sidgwick hoped for (proof of soul/afterlife). The methodologies, while advanced for their time, fall short of modern standards (e.g., controls, statistical rigor, understanding of cognitive biases). Parapsychology remains a highly controversial field, and mainstream science does not accept telepathy or survival after death as established phenomena based on this or subsequent work.

  **Conclusion: The Connection and the Weight**

  *   **The Connection:** Sidgwick's psychical research was his **personal, empirical quest** to find evidence to verify the postulates (immortality, implying an immaterial soul) that his ethical system logically required for coherence and to resolve the dualism of practical reason. It was driven by intellectual honesty and a desire for factual foundations, not faith or contradiction.
  *   **The Weight:** **The empirical case he built, while earnest and methodical for its era, was ultimately *not* strong enough to support the weighty conclusion (proof of an afterlife/God necessary for ethical harmony) that he personally needed.** He knew this, and it caused him great anguish. His ethical arguments stand independently of the SPR's findings; the postulates remain *logical* requirements within his system, not *empirically proven* ones.
  *   **Legacy:** Sidgwick's story is one of profound intellectual integrity. He confronted the deepest conflict in his ethical system head-on and spent a significant portion of his life rigorously, albeit unsuccessfully, seeking empirical resolution. It highlights the tension between rational philosophical demands and the limitations of empirical verification regarding ultimate metaphysical questions. The SPR work wasn't a contradiction to his ethics; it was a desperate, rational, yet ultimately failed, attempt to underpin them with science.
