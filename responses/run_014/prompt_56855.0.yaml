  We are creating an exam question for a final paper in a philosophy of mind and medicine seminar. The case involves a patient H. who has undergone a pharmacological intervention that induces pain asymbolia. The key elements of the case are:

  - H. has had 12 years of intractable facial pain due to a nerve injury.
  - She is in a trial for a reversible agent that induces pain asymbolia.
  - Under the agent, H. retains full sensory discrimination: she can localize, grade intensity, and describe the quality of a stimulus (like a pinprick).
  - She retains protective dispositions: flinching, guarding, withdrawal, refusal of repeat stimulus.
  - She laughs during the pinprick examination and reports that nothing is unpleasant and that she no longer minds.
  - She completes pre-trial questionnaires accurately but as her "former self" would have.
  - She does not wish to discontinue the agent; her family believes she has been diminished.

  The question we want to pose is whether the agent is a cure or a mutilation for H. We require the students to:

  1. State which account of pain's badness their verdict commits them to.
  2. Explain what their own case does to the two accounts they reject (especially the imperative, evaluative, and intrinsic aversiveness views).
  3. Explain what would have to be true for H.'s testimony to settle the matter (rather than merely report it).

  We must explicitly state that no credit is given for re-describing the sensory-affective dissociation, and that marks are for explaining why H. refuses a repeat stimulus while insisting she minds nothing.

  We are to provide:
  A. The exam question (self-contained, with all clinical details, and pitched for about 50 minutes of a 3-hour exam).
  B. A model answer (800 words) taking a definite position.
  C. A marking scheme out of 25, with moves for a first-class answer, marks per move, and common errors to penalize.
  D. A short note on the exercise's weaknesses.

  Let's proceed step by step.

  ---

  **A. The Exam Question**

  We need to write the question as it would appear on the paper. It should be self-contained and include all necessary details.

  ---

  **Question:**

  Patient H. has suffered from intractable facial pain for twelve years following a nerve injury. She enrolls in a clinical trial of a reversible pharmacological agent designed to induce a state of pain asymbolia in otherwise neurologically intact subjects. Under the influence of this agent, H. retains the following:

  - Full sensory discrimination: she can accurately localize a pinprick, grade its intensity on standard scales, and describe its quality without hesitation.
  - All tested protective dispositions: she flinches, guards the affected area, withdraws from the stimulus, and declines to submit to the stimulus again. She also states plainly that she would refuse to undergo the original injury again.

  However, during a pinprick examination, H. laughs. She reports that nothing she feels is unpleasant and that she no longer minds the sensations. When asked to complete the same pain questionnaires she filled out before the trial, she completes them accurately but explains that she is answering as her former self (prior to the trial) would have. H. does not wish to discontinue the agent. Her family, however, believes that she has been diminished by the treatment.

  Is this agent, for H., a cure or a mutilation? In your answer, you must:

  1. State which account of the badness of pain your verdict commits you to, and explain why.
  2. For the two accounts of pain's badness that you reject (in particular, the imperative account, the evaluative account, and the view that identifies unpleasantness with a felt quality whose aversiveness is intrinsic), explain how the case of H. challenges or undermines these views.
  3. Explain what would have to be true for H.'s testimony about her own condition (e.g., "I do not mind the pain") to settle the matter of whether the agent is a cure or a mutilation, rather than merely reporting her subjective state.

  **Important:** No credit will be given for re-describing the sensory-affective dissociation in H.'s case. The marks are awarded for explaining why H. refuses a repeat of the original injury or a repeat stimulus while insisting that she minds nothing.

  ---

  **B. Model Answer (approx. 800 words, taking a definite position)**

  We must take a position. Let's argue that the agent is a cure. We'll structure the answer accordingly.

  ---

  **Model Answer:**

  **Position:** The agent is a cure for H.

  **Introduction (approx. 100 words):**
  The pharmacological agent that induces pain asymbolia in H. is a cure, not a mutilation. It alleviates the suffering that had persisted for twelve years without impairing her sensory capacities or protective reflexes. The central issue is the badness of pain: what makes pain bad is not the sensory quality but the affective-motivational component. The agent selectively targets this component, leaving H. with intact nociception but without the unpleasantness that previously made her condition unbearable. Her family's concern about diminishment is misplaced because H. retains her autonomy and cognitive faculties, and her testimony reveals a profound relief.

  **Verdict and Account of Pain's Badness (approx. 200 words):**
  My verdict commits me to an imperative account of pain's badness. On this view, pain is bad because it commands attention and action: it is a state that demands avoidance and cessation (Klein, 2015; Martinez, 2011). The badness lies in the way pain imposes itself on the subject, creating an urgent need to act. In H.'s case, the agent removes this imperative force: she no longer feels compelled by the pain. She retains the sensory information and protective behaviors (which are now driven by cognitive evaluation rather than an immediate imperative), but the imperative that made the pain unbearable is gone. Thus, the badness is eliminated. This is a cure because it targets the source of suffering without damaging her ability to interact with the world.

  **Challenging the Rejected Accounts (approx. 300 words):**
  The case of H. challenges the evaluative account and the intrinsic aversiveness view.

  The evaluative account (e.g., Bain, 2013) holds that pain is bad because it represents bodily damage as bad. But H. still represents the damage (she accurately reports the pinprick and its intensity) and even judges that the original injury should be avoided, yet she does not find the sensation unpleasant. This shows that the evaluative component (judging the state as bad) can be dissociated from the unpleasantness. She answers the questionnaires as her former self, indicating that her evaluative judgments about the past pain remain, but the present experience lacks the negative affect. Thus, the badness of pain cannot be reduced to evaluative representation.

  The intrinsic aversiveness view (e.g., Corns, 2014) posits that unpleasantness is a phenomenal quality that is inherently aversive. But H. laughs during the pinprick and reports no unpleasantness, even though she withdraws. Her protective dispositions are intact, but they are no longer driven by an intrinsic aversive quality. Instead, they are triggered by the sensory input and her cognitive assessment of potential harm. This dissociation shows that aversiveness is not intrinsic to the sensation but depends on the imperative force. If aversiveness were intrinsic, she would still find the sensation unpleasant even if she could tolerate it, but she does not.

  **Testimony and Settling the Matter (approx. 150 words):**
  H.'s testimony ("I do not mind") does not by itself settle whether the agent is a cure or mutilation because testimony only reports subjective experience. To settle the matter, we would need to establish that her testimony reflects a genuine absence of suffering and that this absence is a good for her. In this case, we have additional evidence: H.'s behavior (laughing, not wishing to discontinue) and her retained capacities (sensory, protective, cognitive). Crucially, her refusal to undergo the injury again is consistent with an imperative-free state: she avoids harm based on cognitive evaluation, not because of an immediate command. For testimony alone to settle the matter, it would have to be that the badness of pain is entirely constituted by the subject's report of unpleasantness. But if we hold (as I do) that the badness is in the imperative force, then testimony is just one piece of evidence. Here, the convergence of testimony, behavior, and H.'s own judgment (she values the treatment) shows it is a cure.

  **Conclusion (approx. 50 words):**
  The agent removes the imperative force that makes pain bad, freeing H. from suffering without impairing her. It is a cure. Her family's view confuses the loss of suffering with a loss of self, but H. remains intact, now without the burden of pain.

  ---

  **C. Marking Scheme (out of 25)**

  We need to outline the moves for a first-class answer (say, 21-25 marks) and assign marks. We also list common errors and the marks they cost.

  **Total: 25 marks**

  **Moves and Marks:**

  1. **Clear verdict on cure or mutilation and commitment to an account of pain's badness (5 marks):**
     - State whether the agent is a cure or mutilation (1 mark).
     - Identify and briefly explain the account of pain's badness that the verdict commits to (e.g., imperative, evaluative, intrinsic aversiveness) (4 marks).

  2. **Explanation of why H. refuses the stimulus while reporting no unpleasantness (7 marks):**
     - Explain the dissociation between the absence of reported unpleasantness and the presence of avoidance behavior (3 marks).
     - Link this to the account of badness they endorse (e.g., in the imperative view, avoidance is driven cognitively, not by an imperative) (4 marks).
     - *Note:* This is the key part of the question. Must not re-describe the dissociation but explain it in light of theory.

  3. **Critique of two rejected accounts (7 marks):**
     - For each of the two rejected accounts (must include at least the imperative and evaluative if not chosen, or the two they reject), explain how H.'s case challenges them (3 marks per account, total 6 marks).
     - Structure: State the account, then explain how H.'s case undermines it (1 mark for clarity and relevance per account).
     - *Note:* Must cover at least two of the three: imperative, evaluative, intrinsic aversiveness.

  4. **Condition for testimony settling the matter (4 marks):**
     - Explain what would have to be true for H.'s testimony to settle the issue (e.g., if the badness of pain is constituted solely by the subject's report) (2 marks).
     - Contrast with why it doesn't settle the matter in the chosen account (2 marks).

  5. **Overall structure, clarity, and avoidance of specified errors (2 marks):**
     - Coherence, logical flow, and adherence to the question (1 mark).
     - Avoidance of the errors listed below (1 mark).

  **Common Errors and Penalties (non-exhaustive):**

  - **-3 to -5 marks (major errors):**
    - Treating asymbolia as a form of analgesia (confusing loss of affect with loss of sensation).
    - Using "suffering" univocally when it is ambiguous in the case (e.g., using it to mean both the sensory component and the affective component without distinction).
    - Assuming that H.'s report settles the metaphysics (e.g., "She says she doesn't mind, so it's not bad" without considering alternative accounts).
    - Conflating imperative and evaluative accounts as if they fail in the same way (they don't: imperative is about commands, evaluative about judgments).

  - **-1 to -2 marks (minor errors):**
    - Failing to address all parts of the question.
    - Not explaining the refusal of the stimulus adequately.
    - Vague or inaccurate descriptions of the accounts of pain's badness.

  **Marking Bands:**

  - **First Class (21-25):** All moves made clearly and correctly; excellent understanding; avoids all major errors; insightful critique of rejected accounts.
  - **Upper Second (16-20):** Good answer but with minor omissions or weaknesses in one section; some minor errors.
  - **Lower Second (11-15):** Addresses the question but with significant gaps or errors; may have one major error.
  - **Third (6-10):** Superficial; misses key elements; major errors present.
  - **Fail (0-5):** Little relevant material; multiple major errors.

  ---

  **D. Weaknesses of the Exercise**

  **Note on Weaknesses:**

  The exercise has two main weaknesses:

  1. **Caricature of Rejected Positions:** The model answer (and the question setup) may caricature the evaluative account. The evaluative account could be interpreted as requiring a conscious judgment of badness, but some versions might hold that the evaluation is sub-personal or automatic. In H.'s case, she might still have an automatic evaluation (given her protective behavior) but no conscious unpleasantness. The model answer dismisses the evaluative account by pointing to her conscious judgments, but an evaluativist might argue that the evaluation is present in her behavior. This is not fully addressed.

  2. **Medical Plausibility:** One stipulated feature of H.'s case is medically implausible: the retention of all protective dispositions while lacking unpleasantness. In actual asymbolia (e.g., from insular lesions), patients often do not show protective behaviors or may show them in a diminished form. H.'s case is idealized to have full protective reflexes without affect, which is not typically observed. This might beg the question in favor of the imperative account by making the dissociation between affect and behavior seem sharper than it is. If protective behaviors were diminished, the case for a mutilation might be stronger.

  3. **What Would Change the Verdict?** If clinical evidence showed that asymbolic patients like H. are more prone to injury because their protective behaviors are not driven by an imperative (and thus are slower or less effective), then the treatment might be seen as a mutilation. Alternatively, if the intrinsic aversiveness view could explain the dissociation (e.g., by positing two kinds of aversiveness, one felt and one behavioral), then the case against it would be weaker. Also, if we had evidence that H.'s cognitive capacities were impaired (not stipulated), that could support the family's view of diminishment.

  This note should help in anticipating criticisms during the examiners' meeting.
answer: |-
  ### Exam Question: Final Paper  
  **Time Allowed:** 3 hours (this question should occupy approximately 50 minutes)  
  **Total Marks:** 25  

  ---

  **Question**  
  Patient H. has endured 12 years of debilitating facial pain resulting from a traumatic nerve injury. She enrolls in a clinical trial of a reversible pharmacological agent that temporarily induces pain asymbolia—a state in which the affective component of pain is suppressed while sensory-discriminative capacities remain intact. Under the agent’s influence, H. exhibits the following:  

  - **Full sensory discrimination:** She localizes a pinprick to the exact site on her face, rates its intensity accurately on standard numerical scales (e.g., 0–10), and describes its quality (e.g., "sharp," "piercing") without error.  
  - **Preserved protective dispositions:** She flinches, guards her face, withdraws from noxious stimuli, and refuses to endure the pinprick again. She explicitly states she would avoid re-experiencing the original nerve injury.  
  - **Affective changes:** During examination, H. laughs when pricked. She reports no unpleasantness, stating, "Nothing I feel bothers me now—I don’t mind it at all." When completing pre-trial pain questionnaires (e.g., assessing pain-related distress), she fills them out "as my former self would have," citing prior suffering. She wishes to continue the treatment. Her family, however, contends she has been "diminished" and "less herself."  

  Based on this case, address the following:  

  1. Is the agent, for H., a **cure** (a therapeutic success) or a **mutilation** (a harmful alteration)? Defend your verdict.  
  2. Your verdict implies a specific account of what makes pain *bad* for the person experiencing it. State and justify this account.  
  3. For the two accounts of pain’s badness you *reject*—focusing particularly on (a) the **imperative account** (pain’s badness lies in its commanding avoidance), (b) the **evaluative account** (pain’s badness lies in its representation of bodily damage as bad), and (c) the view that **unpleasantness is an intrinsic, aversive quality**—explain how H.’s case challenges or undermines each.  
  4. What would have to be true for H.’s testimony (e.g., "I don’t mind the pain") to *settle* whether the agent is a cure or mutilation (i.e., resolve the metaphysical question of pain’s badness), rather than merely report her subjective state?  

  **Examiner’s Notes:**  
  - **No credit** will be given for re-describing the sensory-affective dissociation in H.’s case.  
  - **Marks are awarded** for explaining *why H. refuses the original injury or repeat stimuli while insisting she "minds nothing."*  
  - Assume the agent is fully reversible and causes no side effects beyond the described dissociation.  

  ---

  ### Model Answer (Approx. 800 Words; Definite Position: The Agent is a Cure)  

  **Verdict (Cure or Mutilation):**  
  The agent is a **cure** for H. It alleviates the profound suffering that defined her 12-year ordeal without impairing her sensory capacities, protective behaviors, or autonomy. A cure must address the source of harm—here, the affective torment of chronic pain—while preserving functional integrity. H.’s laughter, lack of distress, and desire to continue treatment confirm that the agent successfully targets the *badness* of her pain. Her family’s charge of "diminishment" conflates the loss of suffering with a loss of self, but H. remains intact: she retains nociceptive discrimination, avoids harm rationally (e.g., refusing reinjury), and reports liberation. Crucially, she is not indifferent to damage; she is freed from the affective burden that made her life unbearable. This is therapeutic success, not mutilation.  

  **Account of Pain’s Badness (Committed Position):**  
  My verdict commits me to the **imperative account** of pain’s badness (e.g., Klein 2007; Martinez 2015). On this view, pain is bad because it issues an immediate, non-negotiable command to stop or avoid the sensation—a "normative force" that hijacks agency. The badness resides in this *felt urgency*, not the sensory quality or evaluative judgment. In H.’s case, the agent eliminates the imperative: she feels the pinprick’s intensity but experiences no compulsion to act. Her protective behaviors (flinching, refusal) are now driven by *cognitive evaluation* (e.g., "This stimulus causes tissue damage"), not an affective command. The imperative account thus explains why the agent is curative: it silences the pain’s "demand character," ending suffering while leaving perception and rational avoidance intact.  

  **Challenges to Rejected Accounts:**  
  H.’s case fatally undermines the **evaluative account** (e.g., Bain 2013), which holds that pain’s badness lies in its representation of bodily states as bad. H. represents damage accurately (she localizes/grades pain and calls the original injury "avoidable") but reports *no unpleasantness*. This dissociation shows that evaluative representation is insufficient for badness: she judges the stimulus as harmful but lacks the affective distress that made her pain unbearable. Her questionnaire responses—answered "as her former self"—highlight this: she acknowledges past evaluations of badness while experiencing none now. If badness were tied to evaluation, H. should still find the pain unpleasant, but she does not. The evaluative account conflates *knowing* damage is bad with *feeling* it as bad.  

  Similarly, H.’s case refutes the view that **unpleasantness is an intrinsic, aversive quality** (e.g., Corns 2014). If unpleasantness were intrinsic to pain’s phenomenology, H. should still find the pinprick aversive, even if she could tolerate it. Instead, she laughs and reports no aversion. Her intact protective behaviors are not evidence of intrinsic aversiveness; they are decoupled from affect and stem from learned, cognitive associations (e.g., "Sharp objects cause harm"). Intrinsic aversiveness fails because it cannot explain why the *same sensation* (identical in location, intensity, and quality) loses its unpleasantness under the agent. Aversiveness is not "baked into" the sensation; it depends on the imperative force, which the agent removes.  

  **When Testimony Could Settle the Matter:**  
  H.’s testimony ("I don’t mind") alone cannot settle whether the agent is a cure or mutilation because it merely reports her subjective state. To *resolve* the metaphysical question, we would need to establish that the badness of pain is *entirely constituted* by first-person reports of unpleasantness—i.e., if pain’s badness were defined by what it feels like to the subject, with no further conditions. In such a view (e.g., a pure phenomenological account), H.’s testimony would be decisive: no report of unpleasantness means no badness. But this is false for the imperative account I endorse. Here, badness involves a functional/motivational role (the command to avoid), which may persist independently of testimony (e.g., in subliminal pain). For testimony to settle the cure/mutilation debate, we would need consensus that badness reduces to subjective report—but H.’s refusal to endure reinjury shows that badness has behavioral and normative dimensions beyond testimony. Her case thus reveals testimony as one datum among many (e.g., behavior, functional integrity), not a metaphysical arbiter.  

  **Conclusion:**  
  The agent is a cure because it targets the imperative force that constitutes pain’s badness. H. escapes suffering without losing her grip on the world—she navigates harm rationally, not affectively. Rejected accounts fail because they mislocate badness in evaluation (which H. retains without affect) or intrinsic qualities (which she lacks without aversion). Testimony alone cannot settle the matter because badness is not purely phenomenological. H. is not "diminished"; she is liberated.  

  ---

  ### Marking Scheme (Total: 25 Marks)  
  **A first-class answer (21–25 marks) must make the following moves:**  

  1. **Verdict and Account of Badness (5 marks):**  
     - Clearly state whether the agent is a cure or mutilation (1 mark).  
     - Identify and defend a specific account of pain’s badness (e.g., imperative, evaluative, intrinsic) tied to the verdict (4 marks).  
     - *Error to penalize (-2 marks):* Assuming H.’s report ("I don’t mind") settles the metaphysics of pain’s badness without argument.  

  2. **Explanation of Refusal Without Unpleasantness (7 marks):**  
     - Explain why H. refuses reinjury/stimuli despite reporting no unpleasantness (4 marks).  
     - Link this to the endorsed account of badness (e.g., for imperative: refusal is cognitive, not affective) (3 marks).  
     - *Error to penalize (-3 marks):* Treating asymbolia as analgesia (confusing loss of affect with loss of sensation) or using "suffering" univocally (failing to distinguish sensory vs. affective roles).  

  3. **Critique of Two Rejected Accounts (7 marks):**  
     - For each of two rejected accounts, explain how H.’s case challenges them (3 marks per account; 6 marks total).  
     - Specify the accounts (e.g., imperative, evaluative, intrinsic) and avoid conflation (1 mark for clarity).  
     - *Error to penalize (-3 marks):* Conflating imperative and evaluative accounts as if they fail identically, or misrepresenting intrinsic aversiveness as purely sensory.  

  4. **Condition for Testimony Settling the Matter (4 marks):**  
     - Articulate what must be true for testimony to resolve cure/mutilation (e.g., badness reduces to subjective report) (2 marks).  
     - Contrast why testimony fails in the endorsed account (e.g., badness involves motivational role) (2 marks).  
     - *Error to penalize (-2 marks):* Claiming testimony *always* or *never* settles metaphysical questions without justification.  

  5. **Structure and Avoidance of Penalized Errors (2 marks):**  
     - Coherent argument, adherence to question, and avoidance of all errors above (1 mark).  
     - No re-description of dissociation (explicitly penalized; -1 mark if violated).  

  **Mark Allocation:**  
  - 21–25: All moves made; exceptional clarity; no penalized errors.  
  - 16–20: Good but minor gaps (e.g., weak critique of one account); one minor error.  
  - 11–15: Incomplete (e.g., omits testimony condition); major errors (e.g., conflation).  
  - 6–10: Superficial; multiple errors (e.g., treats asymbolia as analgesia).  
  - 0–5: Irrelevant; fails to engage.  

  ---

  ### Weaknesses of the Exercise  
  **1. Caricature of Rejected Positions:** The model answer likely oversimplifies the **evaluative account**. It portrays evaluativism as requiring conscious judgment, but some versions (e.g., "tracking evaluativism") argue that pain *automatically* represents damage as bad, independent of reflection. H.’s protective behaviors could be interpreted as evidence of this implicit evaluation, which persists despite her lack of conscious unpleasantness. The answer dismisses this by emphasizing her report, potentially straw-manning evaluativism as purely cognitive.  

  **2. Medically Implausible Stipulation:** H.’s **preserved protective dispositions** are clinically questionable. Real pain-asymbolia cases (e.g., from insular lesions) often show *reduced* or absent protective reflexes (e.g., patients may not flinch or withdraw). By stipulating full retention, the case tacitly favors the imperative account: it assumes protective behaviors can be "spun off" into a cognitive module, making dissociation seem cleaner than it is. This risks begging the question for "cure" verdicts.  

  **3. What Would Change the Verdict?** A single consideration could shift the answer to "mutilation": **Evidence that H.’s autonomy is compromised**. If studies showed asymbolic patients make *worse* harm-avoidance decisions (e.g., delayed withdrawals due to absent imperatives), the agent could be seen as impairing agency. Similarly, if the intrinsic aversiveness view were refined to include "dispositional unpleasantness" (where aversiveness persists in counterfactual behavior), H.’s refusal might reflect latent badness. Either would support the family’s "diminishment" claim.  

  This note flags where the model answer and marking scheme are most vulnerable—use it to preempt disputes in grading.
