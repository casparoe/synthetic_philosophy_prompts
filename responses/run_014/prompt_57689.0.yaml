prompt: |-
  I work adjacent to interpretability research and there's a habit in the field I can't quite pin down philosophically. When people want to say a model genuinely has a representation of something — some concept, some property of the task — they run one of two tests and treat either as sufficient. One is decoding: you train a probe on a layer's activations, or pull a direction out of a sparse autoencoder, and if you can reliably read the thing out, you say the model represents it. The other is steering: you add the direction, or patch those activations into a different run, and if behavior shifts, that also counts as proof the representation was there. Papers report one or the other interchangably and conclude the feature is real.

  Everyone also knows the two come apart. You can decode information the model demonstrably never uses downstream, and you get steering effects from directions nobody would have identified by decoding alone.

  So what I want is the implicit theory, not a survey. For each test, spell out what has to be true of the model for it to be evidence at all — I vaguely sense one rests on an informational notion of representation and the other on a causal or functional one, but make that precise. What rival accounts does each rule out without argument? Does the field's willingness to accept either one commit it to a single view of what representations are, or is the practice actually underdetermined — consistent with several accounts, including fairly deflationary ones where "representation" is just a way of talking about dispositions? And if you enforced the causal criterion strictly, which claims people currently make would you have to retract, and what would be left that anyone would still care about?
reasoning: |-
  Okay, the user works adjacent to interpretability research and has noticed a philosophical inconsistency in how representations are validated. They point out two methods—decoding and steering—used interchangeably as sufficient evidence for a model having a representation, even though these methods can diverge. The user wants a deep dive into the implicit theories behind each method.

  First, I need to break down each test. Decoding involves extracting information from activations, like training a probe. Steering involves manipulating activations to alter behavior. The user suspects one relies on an informational notion, the other on causal/functional. I should make that distinction precise. 

  For decoding, it's about information being present in the activations. If you can decode a concept, it means the information is there, but it might not be used by the model. The rival accounts here might include epiphenomenal information—data that's present but not utilized. So decoding alone doesn't prove the model uses that info; it could be a byproduct.

  Steering, on the other hand, shows that the activation has a causal role. Changing the activations affects the output, which implies functionality. But here, the rival account could be that the steering direction isn't a natural representation but an artificial injection that triggers downstream effects. Maybe it's activating multiple features, not just the intended one.

  The user also asks about the field's acceptance of both methods. Does this commit to a single view of representation? Probably not. It might be underdetermined, meaning both methods are used pragmatically without a unified theory. Deflationary views could see representations as useful fictions rather than real entities. 

  If the field enforced only the causal criterion (steering), what claims would need retraction? Any decoding-only results would be suspect. For example, if someone decodes a concept but can't steer with it, that representation might not be "real" in a functional sense. But this might discard cases where information is present but not causally active, which could still be important for understanding the model's internals.

  The user's deeper need might be to clarify the philosophical underpinnings to improve research rigor. They might want to know if current practices are flawed and how to reconcile the two methods. They might also be concerned about overclaiming in papers where decoding is presented as proof of representation, ignoring potential epiphenomenal data.

  I should address the implications for the field. If steering is the gold standard, researchers would need to validate decoding findings with causal tests. This could shift focus towards functional roles, possibly aligning more with cognitive science views of representation. But it might also limit exploration of latent information that isn't actively used but could be relevant for safety or other analyses.
answer: |-
  This is a sharp critique that cuts to the heart of representational claims in interpretability. Let's dissect the implicit philosophical commitments of each test and their implications:

  **1. Decoding Test: The Informational Commitment**
  *   **What Must Be True:** For decoding (e.g., probing, SAE directions) to be evidence of representation, the model's activations must contain *information* about the target concept `C` that is reliably accessible to a downstream linear (or simple) readout mechanism. The core claim is: *The state of the system covaries with `C` in a way that makes `C` linearly decodable.*
  *   **Implicit Theory:** This aligns with an **Informational or Covariational Theory of Representation.** Representation is fundamentally about *carrying information* about some state of affairs. The model is seen as an encoder of features present in its training data/task.
  *   **Rival Accounts Ruled Out (Without Argument):**
      *   **Complete Absence:** It rules out the claim that the model has *no information whatsoever* about `C` at that locus.
      *   **Non-Linear/Inaccessible Encoding:** It doesn't rule out that `C` is encoded, but only in highly non-linear, distributed, or obfuscated ways that a simple probe cannot access (though non-linear probing addresses this partially).
  *   **Key Rival Account *Not* Ruled Out:** **Epiphenomenal Information.** The information about `C` could be a byproduct of the computation, a "fossil record" of past processing, or predictive features correlated with `C` but *not actually used by the model itself* for any downstream task relevant to `C`. It exists in the activations, but plays no causal role in the model's *own* function concerning `C`.

  **2. Steering Test: The Causal-Functional Commitment**
  *   **What Must Be True:** For steering (e.g., adding directions, activation patching) to be evidence of representation, the targeted activations must play a *causal role* in generating the model's behavior *specifically related* to the concept `C`. Modifying the activation pattern associated with `C` must reliably cause a corresponding, predictable change in the model's output behavior concerning `C`. The core claim is: *This activation pattern is a causal lever for behavior involving `C`.*
  *   **Implicit Theory:** This aligns with a **Causal or Functional Theory of Representation.** Representation is defined by its *causal efficacy* within the system's functional architecture. A representation is something that stands for `C` *for the system itself*, meaning its state causally influences the system's `C`-relevant outputs.
  *   **Rival Accounts Ruled Out (Without Argument):**
      *   **Epiphenomenal Information:** It directly rules out the epiphenomenon scenario. If manipulating the activation changes behavior related to `C`, that activation *must* be causally involved.
      *   **Irrelevance:** It rules out the claim that the activation pattern is irrelevant to `C`-related behavior.
  *   **Key Rival Accounts *Not* Ruled Out:**
      *   **Indirect Causation/Oversteering:** The manipulation might be affecting behavior by triggering unintended downstream cascades or activating a *bundle* of correlated features, not necessarily `C` itself. The steering vector might not be a "pure" `C` direction but a correlated "macro-feature".
      *   **Non-Representational Causation:** The activation pattern might be a computational step *necessary* for producing `C`-related behavior without *itself* being a representation *of* `C` (e.g., a control signal, a gate, a low-level feature feeding into a higher-level `C` representation).
      *   **Adversarial Steering:** The manipulation might exploit vulnerabilities unrelated to the natural representation of `C`.

  **The Field's Practice: Underdetermination and Pragmatism**

  *   **Not a Single View:** The field's willingness to accept *either* test does **not** commit it to a single, coherent philosophical theory of representation. The practice is fundamentally **underdetermined**.
  *   **Consistent with Multiple Accounts:**
      *   **Instrumentalism/Pragmatism:** "Representation" is a useful fiction for predicting and controlling model behavior. Both tests provide practical handles: decoding helps predict what the model "knows," steering helps control what it "does." The ontological status of representations is secondary to utility.
      *   **Deflationary/Dispositional:** "Model M represents `C` at layer L" just means "Activations at L have disposition D1 (to yield `C` when decoded) and/or disposition D2 (to alter `C`-relevant behavior when steered)." No deeper metaphysical claim is needed.
      *   **Hybrid/Teleosemantic Lite:** A loose combination: representations are states that carry information *and* play a causal role *for the system* in performing its task. The field often implicitly leans here but lacks rigorous criteria for what "for the system" means beyond task performance.
      *   **Structural Realism:** The focus is on finding isomorphic structures (e.g., circuits, SAE features) within the model that mirror structures in the data/task domain. Both tests provide evidence for such structure.
  *   **The Tension:** The core tension arises because the field often *wants* representations to be both informational *and* functional (like cognitive science), but its *tests* are distinct and can dissociate. Accepting both interchangeably papers over this gap.

  **Enforcing Strict Causal Functionalism: Consequences**

  If the field demanded *causal efficacy* (steering) as the *only* valid criterion for claiming "genuine representation," the landscape would change dramatically:

  1.  **Retracted Claims:** Any claim based *solely* on decoding evidence would become suspect or require rephrasing. Examples:
      *   "The model has a clear representation of [abstract concept X] in layer Y" (based only on probe accuracy) becomes "Information about X is linearly decodable from layer Y."
      *   SAE features found solely via reconstruction loss + decodability, *without* steering validation, couldn't be claimed as "representations of Z."
      *   Claims about "latent knowledge" (e.g., truthfulness, biases) detectable by probes but not causally active in normal generation would be downgraded.
  2.  **Shift in Focus:** Research would prioritize:
      *   **Mechanistic Interpretability:** Tracing causal pathways (circuit discovery) becomes paramount. Understanding *how* the feature is used is essential.
      *   **Steering Validation:** Every decoding result would need causal validation via patching or steering to be considered a "representation."
      *   **Function over Information:** The primary question becomes "What causal role does this activation/feature play in the model's computation?" rather than "What information does it contain?"
  3.  **What Would Remain Valuable:**
      *   **Validated Circuits:** Findings where a specific activation pattern is shown to be causally necessary and sufficient for specific behaviors (e.g., induction heads, factual recall circuits).
      *   **Steering Techniques:** Methods for reliable, targeted control of model behavior (e.g., truthfulness steering, style transfer) would be the gold standard for demonstrating representational content.
      *   **Mechanistic Understanding:** Insights into *how* models compute specific functions would remain core and strengthened.
      *   **Safety-Relevant Interventions:** Causal levers are precisely what's needed for reliability and safety (e.g., activating/deactivating harmful behaviors).
  4.  **Potential Loss:**
      *   **Latent Knowledge:** The intriguing phenomenon that models often contain *information* they don't spontaneously *use* might be sidelined, despite its importance for misalignment, honesty, and model editing.
      *   **Exploratory Analysis:** Decoding is often a crucial *first step* for finding interesting features to investigate causally. Strict functionalism might slow discovery.
      *   **"Understanding" vs. "Use":** Distinguishing what a model "knows" from what it "does" becomes harder if only the latter counts as representing.

  **Conclusion:** The field's dual reliance on decoding and steering reflects a pragmatic approach to uncovering structure in complex systems, but it masks a philosophical ambiguity. Decoding commits to informational content; steering commits to causal-functional role. Their dissociation reveals a gap between carrying information and wielding it causally within the model's own computations.

  The practice is underdetermined, compatible with instrumentalist, deflationary, or hybrid views, but less so with strong realist views demanding intrinsic intentionality. Enforcing a strict causal-functional criterion would refocus the field on mechanistic understanding and control, validating many core circuit-level findings but potentially deprioritizing the study of latent, unused information and reframing claims based solely on decodability. The choice between criteria hinges on whether the field prioritizes models as *encoders of information* or as *functional agents* whose internal states gain representational status through their causal powers.
