answer: |-
  Here's a concrete case tailored for your detective novel, focusing on memory, obligation, and identity change, avoiding the usual philosophical chestnuts:

  **The Case:** *The Lockbox Inheritance Dispute*

  **The Facts:**
  1.  **Arthur Vance:** A meticulous, frugal accountant. Paranoid about financial security, he purchased gold bullion and stored it in a secure, anonymously rented lockbox. Only he knew the location and access codes. He meticulously documented the purchase and rental in a private ledger found later.
  2.  **The Coma:** Arthur suffers a severe brain injury in a car accident caused by a reckless driver (Driver X). He spends 18 months in a coma.
  3.  **"Ben" Emerges:** Arthur wakes up with significant brain damage. His personality is radically altered: he's impulsive, emotionally volatile, artistic (which Arthur despised), and has *no* episodic memories of his life as Arthur – no recollection of his job, his routines, his anxieties, or the gold. He insists his name is now "Ben." Medical experts confirm the personality change is permanent and neurologically based.
  4.  **The Debt & The Gold:** Before the accident, Arthur had taken out a substantial business loan from a colleague, Lydia Chen. The loan was due shortly after the accident. Lydia knew nothing of the gold but needs repayment. She locates "Ben" and discovers the ledger mentioning the lockbox.
  5.  **The Lockbox:** "Ben" is found, but he has no memory of the lockbox location or codes. Extensive searches based on the ledger clues fail. The gold remains inaccessible. Lydia sues "Ben" (as Arthur Vance's legal successor) for repayment of the debt, arguing the gold exists and should be used to settle Arthur's obligation.
  6.  **The Legal/Philosophical Conflict:**
      *   **Lydia (Endurantist View):** "Arthur Vance still exists, right there in that body! The core person, the legal entity, persists. The debt was incurred by *that person*. The gold belongs to *that person*. 'Ben' is just Arthur with amnesia and a changed personality. He *is* Arthur and therefore responsible for Arthur's debts and entitled to Arthur's assets *if they can be found*. He *owes* this debt to Lydia and to his past self who made the commitment."
      *   **"Ben"/His Lawyer (Perdurantist View):** "The person who borrowed your money and hid that gold, *Arthur Vance*, is gone. That temporal part of this entity ceased with the brain injury. I am a *new* temporal part, 'Ben'. I have no memory of Arthur's life, no connection to his values or fears, and crucially, *no access to his hidden knowledge*. I cannot fulfill an obligation made by a different person-stage. The gold is effectively lost because the person-stage who knew its location no longer exists. Holding me responsible for Arthur's debt is unjust; I am not him. I owe Arthur's creditors *nothing*."

  **How This Fits Your Detective's Dilemma:**

  1.  **Concrete Parallel:** Just like Lydia needs testimony *from Arthur* about the gold's location, your detective needs testimony *from the pre-coma witness* about the crime. But the person with those memories seems gone.
  2.  **Identity vs. Obligation:** The core question is whether "Ben" *owes* Lydia repayment (a debt incurred by his past self) and whether he *owes* it to Arthur to try to recover the asset. This directly mirrors whether your witness *owes* testimony to the victims, the detective, or even their own past self who witnessed the crime.
  3.  **Memory as the Key:** Access to the crucial information (gold location / crime details) is intrinsically linked to the lost identity and its memories. "Ben" *cannot* access the gold, just as your post-coma witness might struggle to access or *feel connected to* the pre-coma memories.
  4.  **Different Philosophical Intuitions:**
      *   **Endurantism:** Suggests the detective *should* trust the witness (as the same enduring person) and push them to access those buried memories. They *are* the person who saw the crime and *owe* it to justice and their past self to testify. Their current personality is just a surface layer over the enduring core.
      *   **Perdurantism:** Suggests caution. The witness-stage who saw the crime is a distinct temporal part. The current witness-stage is a new person with fragmented access to those memories. Can they be *trusted* to accurately recall or even *want* to recall events belonging to a "different person"? Do they feel any *obligation* to that past self or its experiences? Pressuring them might be unfair or yield unreliable results.
  5.  **Stakes & Moral Weight:** The Lockbox Case isn't just abstract; it involves real debt, lost wealth, medical trauma, and a fundamental question of justice and responsibility. It has the legal and emotional grit fitting for a detective's rumination.
  6.  **Novelistic Potential:** Your detective could recall reading about the Lockbox case in law journals or news reports. Perhaps the court ruled in favor of "Ben," finding he wasn't liable for the debt since he couldn't access the asset (a perdurantist-leaning outcome), leaving Lydia devastated. Or maybe they ruled for Lydia, forcing "Ben" into bankruptcy based on Arthur's assets (endurantist-leaning), which "Ben" experienced as a profound injustice. This precedent could haunt your detective as they weigh fairness against the desperate need for the witness's testimony.

  This case provides a tangible, legally-framed example where the metaphysics of identity directly impacts questions of obligation, memory access, and trust – perfect fuel for your detective's internal conflict about the reliability and responsibility of their amnesiac, transformed witness.
