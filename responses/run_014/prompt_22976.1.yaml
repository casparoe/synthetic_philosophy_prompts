  ok so I keep conflating the explanationist and reliabilist strategies for defending inference to the best explanation and I want to untangle them. Can you explain what each one actually is, and why the distinction matters? I'm especially curious about whether the explanationist route is more vulnerable to circularity objections, and whether the reliabilist route can be made explicit without just smuggling explanation back in through the back door.
