  Hmm, the user's MOT example works well because:
  - The clash (party vs car appointment) creates obvious relevance issues
  - "Morning" leaves room for afternoon attendance
  - B's avoidance of direct refusal shows politeness implicature
  But I should note it risks being misinterpreted as literal scheduling talk. Maybe flag that early.

  Key structural risks:
  If I start with maxims before showing the meaning gap, they'll get lost in abstractions. Must begin with concrete misunderstanding scenarios. Also must explicitly distinguish between "saying" (MOT appointment) and "meaning" (likely not coming).

  For misconceptions:
  The "reading between the lines" confusion needs pre-empting when introducing cooperative principle. Emphasize this is about necessary inferences, not optional interpretation. The politeness mix-up should be addressed during the relevance maxim discussion.

  The exit ticket question must force them to identify both what's said and what's implicated. Maybe adapt their example: "If B adds '...but I'll try to make it after', what happens to the 'not coming' meaning?" 

