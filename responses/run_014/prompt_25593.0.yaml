prompt: |-
  I've been following my jurisprudence professor's views closely this semester because I need to submit a paper predicting her position on a case she hasn't addressed. Here are the verdicts she's given so far on whether various norms count as law:

  1. A municipal bylaw properly enacted, published, and enforced — yes, law.
  2. A directive issued by a minister that was never published or made accessible to the public — no, not law.
  3. A criminal statute so vaguely worded that no reasonable person could tell what conduct it prohibits — no, not law.
  4. A statute enacted without the constitutionally required legislative quorum — no, not law.
  5. A long-standing customary rule among merchants that courts have consistently recognized and applied for over a century — yes, law.
  6. A statute requiring citizens to perform an act that is physically impossible — no, not law.

  The case I need to predict: a statute duly enacted following every constitutional procedure, properly published, clear, prospective, internally consistent, and possible to comply with, that authorizes the expropriation of property from a disfavoured ethnic minority without compensation. Does she say this is law?

  I am less interested in the bare yes or no than in identifying the rule or rules that fit her verdicts so far, saying what each candidate rule predicts about the new case, giving your best guess about her verdict with your reasons for preferring one rule over the others, and naming a further case that would settle which rule she is actually running.
reasoning: |-
  Okay, the user is asking about predicting their jurisprudence professor's stance on a specific case based on her past verdicts. Let me start by listing all the cases she's decided so far. 

  First, she considers a properly enacted municipal bylaw as law. Second, a minister's directive that's unpublished isn't law. Third, a vague criminal statute isn't law. Fourth, a statute without quorum isn't law. Fifth, a long-standing merchant custom recognized by courts is law. Sixth, a statute requiring the impossible isn't law. 

  The new case is a statute that's procedurally perfect but authorizes taking property from an ethnic minority without compensation. The user wants to know if she'd call it law, but more importantly, they need the underlying rule that explains all her decisions and a test case to confirm it.

  Looking at her verdicts, three patterns emerge. Rule A is based on procedural validity: properly enacted and accessible norms are law. Rule B adds substantive justice: law must not be grossly unjust. Rule C focuses on predictability: law must be knowable and possible to follow.

  Rule A explains cases 1, 2 (unpublished), 4 (no quorum), and 6 (impossible). But it doesn't cover case 3 (vagueness) or case 5 (custom). Case 5 is tricky because customs aren't enacted but are law. Rule B handles case 3 (vague laws are unjust) and the new case (expropriation without compensation is unjust). But why did she accept the custom? Maybe because it's predictable? 

  Rule C ties everything together. Predictability requires publication (case 2), clarity (case 3), possibility to comply (case 6), and proper enactment (cases 1 and 4). Custom (case 5) is predictable through consistent application. The new case is procedurally sound but targets a minority unpredictably. Rule C would say no, not law, because it allows arbitrary enforcement, making it unpredictable for the minority group.

  The user's deeper need might be understanding how to derive principles from cases and anticipate arguments. They might also want to impress the professor by showing nuanced analysis. The test case could be a clear, published statute that's procedurally correct but grossly unjust to everyone, not just a minority. If she rejects that, Rule B is correct. If she accepts it but rejects only unpredictable laws, Rule C holds.
answer: |-
  Based on your professor's verdicts, her position aligns most closely with **Rule C: Predictability & Possibility Compliance**, likely influenced by Lon Fuller's principles of the "Inner Morality of Law." Here's the breakdown:

  **Candidate Rules & Their Fit:**

  1.  **Rule A: Formal Validity & Source (Positivist):**
      *   *Rule:* A norm is law if it emanates from a recognized source (legislature, custom recognized by courts) following the correct procedures for that source (enactment, quorum, publication).
      *   *Fit:*
          *   Yes: Case 1 (proper bylaw), Case 5 (custom recognized by courts).
          *   No: Case 2 (not published), Case 4 (no quorum), Case 6 (impossible - arguably fails a minimal procedural requirement of feasibility?).
          *   **Poor Fit:** Case 3 (vague statute): Formally valid source & procedure, but deemed not law. Rule A cannot explain this. Case 6 is also strained if "impossibility" isn't seen as a procedural defect.

  2.  **Rule B: Minimal Substantive Justice (Natural Law Lite):**
      *   *Rule:* A norm is law only if it meets formal validity criteria *and* does not violate fundamental principles of justice (e.g., not grossly arbitrary, discriminatory, or impossible).
      *   *Fit:*
          *   Yes: Case 1 (valid, just), Case 5 (valid custom, presumably just).
          *   No: Case 2 (invalid), Case 3 (grossly arbitrary/vague), Case 4 (invalid), Case 6 (impossible/unjust burden).
          *   **Good Fit:** Explains all "No" verdicts well (2,3,4,6) and the "Yes" verdicts (1,5).
      *   *Prediction for New Case:* **No, not law.** Expropriation without compensation based solely on ethnicity is grossly discriminatory and unjust.

  3.  **Rule C: Predictability & Possibility Compliance (Fuller's Inner Morality):**
      *   *Rule:* A norm is law only if it enables subjects to reliably guide their conduct by it. This requires: Promulgation (publication), Clarity, Non-contradiction, Possibility of Compliance, Constancy (not changing too frequently), Non-retroactivity (implied by cases), Congruence between declared rule and official action (implied). *Formal validity is usually necessary but not sufficient.* Gross substantive injustice often undermines predictability for the targeted group.
      *   *Fit:*
          *   Yes: Case 1 (published, clear, possible), Case 5 (custom is "published" via practice, clear through recognition, possible).
          *   No: Case 2 (not promulgated), Case 3 (not clear), Case 4 (invalid source/procedure breaks constancy/congruence?), Case 6 (not possible to comply).
          *   **Excellent Fit:** Directly explains Cases 2 (no promulgation), 3 (no clarity), and 6 (no possibility of compliance). Case 4 (no quorum) can be seen as a failure of the procedure necessary to create a reliable, congruent rule. Case 5 works because custom, through recognition and application, achieves the functional equivalent of promulgation, clarity, and consistency for the merchant community.
      *   *Prediction for New Case:* **No, not law.** While formally perfect, a statute targeting a disfavored minority for uncompensated expropriation inherently violates the requirement of *Congruence* and predictability. Members of that minority cannot reliably govern their conduct regarding property ownership – the rules are effectively different and unpredictable *for them* based on an immutable characteristic, creating a "hidden trap" (Fuller). It also likely violates generality, being discriminatory.

  **Best Guess & Reasoning:**

  *   **Prediction:** She will say **No, it is not law.**
  *   **Preferred Rule:** **Rule C (Predictability & Possibility Compliance / Fuller's Principles).**
  *   **Reasons for Preference:**
      1.  **Direct Explanation of Vagueness (Case 3):** Rule C explains the "No" on vagueness perfectly as a failure of clarity, a core Fullerian principle. Rule B explains it as injustice/arbitrariness, which is also valid, but Rule C provides a more specific functional reason *why* vagueness is fatal (it prevents guidance of conduct).
      2.  **Explanation of Custom (Case 5):** Rule C best explains why the custom *is* law. It fulfills the functional requirements: the merchant community knows the rule (effective "promulgation" through practice), it's clear enough for courts to apply consistently, and it's possible to follow. Rule A struggles slightly as custom isn't "enacted" in the same way. Rule B accepts it but doesn't highlight *why* custom works as law functionally.
      3.  **Impossibility (Case 6):** This is a core Fullerian failure (possibility of compliance). Rule B explains it as substantive injustice, which is true, but Rule C pinpoints the precise functional breakdown.
      4.  **The New Case & Discrimination:** While Rule B would reject it for substantive injustice, Rule C offers a powerful *procedural/functional* reason rooted in the rule of law's purpose: such a law makes it impossible for the targeted minority to predict the legal consequences of their actions (owning property) or rely on the law's protection, destroying the law's ability to guide *their* conduct. It creates a profound lack of congruence between the declared rule (property rights for all?) and the authorized official action (taking from group X only).
      5.  **Holistic Fit:** Rule C provides a coherent framework linking *all* the "No" verdicts to failures in the law's ability to function as a guide to conduct. The "Yes" verdicts succeed on these functional grounds.

  **Settling Case:**

  To definitively distinguish between Rule B (Minimal Justice) and Rule C (Predictability/Function), propose this case:

  *   **The Case:** A statute, duly enacted with perfect procedure, fully published, crystal clear, prospective, internally consistent, and possible to comply with, that imposes a **grossly disproportionate and unjust burden *universally* (e.g., a 99% wealth tax on *all* citizens, or mandatory conscription of *all* 10-year-olds into the army).** There is no discrimination; the burden falls equally on everyone, but it is widely recognized as substantively monstrous and unjust.

  *   **Why it Settles:**
      *   **Rule B (Minimal Justice):** Would say **No, not law** because it violates fundamental justice, even though formally perfect and predictable.
      *   **Rule C (Predictability/Function):** Would likely say **Yes, it is law**, however unjust. It meets all the criteria for functioning as a guide to conduct: promulgated, clear, prospective, possible (however horrendous), consistent, and congruent (applies equally as declared). Fuller explicitly stated his principles were procedural and did *not* guarantee substantive justice. An evil but clear, possible, and uniformly applied rule could still be "law" under Rule C.

  Your professor's verdict on this "Universally Unjust Statute" case would reveal whether the "No" verdict in the discriminatory expropriation case was driven primarily by the *substantive injustice* itself (Rule B) or by the *procedural/functional failure* inherent in discriminatory laws that destroy predictability and congruence *for a specific group* (Rule C). Her focus on publication, clarity, possibility, and procedural validity strongly points towards Rule C, but this test case would be conclusive.
