prompt: |-
  I'm TAing for an intro cognitive science section (about 20 students, one 50-minute session) and I keep trying to get across the difference between access consciousness and phenomenal consciousness, plus the global workspace idea, and every time I just end up reading Block and Baars at the room and watching their eyes glaze over. I want an in-class activity that makes them actually feel the dissociation instead of just hearing about it — specifically the blindsight-style case where someone can point at a stimulus they genuinely report not seeing, so information is driving their body without any conscious experience of it. Can you design a runnable game for this: the setup, the materials (keep them cheap, Ive got a projector and some index cards and no budget), and the exact rules and timing for a subliminal flash condition where nobody is supposed to consciously see the stimulus but the group's guesses still come out above chance.

  Then I want a second broadcast condition where the same stimulus is presented in a way the whole room can actually report on, so they can feel the contrast the the view is supposed to capture, between content that stays locked in one private processing stream and content that gets written out where everything can grab it at once. I need a debrief that maps what actually happened in the room onto the access-vs-phenomenal distinction and onto the global workspace, an honest list of what will predictably go wrong the first time I run it (I already suspect some students will claim they sort of saw a blur and that the above-chance effect might be too weak to show in a single trial), and a frank note on which part of the view the activity simply cannot reproduce and I will have to supply myself. Start with the activity itself, no preface, no restating what I asked, and no great question.
reasoning: |-
  We are going to design two activities: one for the "subliminal flash" condition (simulating blindsight) and one for the "broadcast" condition (simulating conscious access in the global workspace). We'll use a simple visual stimulus (a letter) and present it either too briefly for conscious perception (subliminal) or long enough for conscious report (broadcast). The goal is for students to experience the dissociation: in the subliminal condition, they may guess above chance without feeling they saw anything, while in the broadcast condition, they can consciously report the stimulus.

  **Activity 1: Subliminal Flash (Blindsight Simulation)**

  *Setup:*
  - You need a projector and a computer to display images. Alternatively, you can use index cards if you don't have a projector, but the projector allows for precise timing.
  - Create two slides: 
    1. A fixation cross (displayed for 1 second).
    2. The target stimulus (a letter: either 'A', 'B', 'C', or 'D') displayed very briefly (e.g., 17 milliseconds) followed immediately by a mask (a random pattern of lines and curves, or a jumbled letter-like image). 
  - Alternatively, if using index cards: prepare a set of cards with the fixation cross, the target letters (on separate cards), and the mask (one card). You'll need to flash the target card very quickly and then immediately cover it with the mask card. This requires practice to get the timing right.

  *Materials:*
  - Projector and computer (preferred) OR index cards (if projector not available for timing).
  - For projector: prepare a presentation with the slides as described.
  - For index cards: 
     - One card with a fixation cross.
     - Four cards each with one letter (A, B, C, D) written clearly.
     - One mask card (a jumble of lines and curves that would obscure the letter).
  - Response sheets for students (or they can use their own paper) with two columns: one for the subliminal trial and one for the broadcast trial.

  *Rules and Timing (for projector version):*
  1. Tell students they will see a fixation cross, then a brief flash, and then a mask. They should keep their eyes on the screen.
  2. Explain that they should not expect to see the target clearly, but they must guess which letter (A, B, C, or D) was presented. They should write down their guess and also rate their confidence on a scale of 1 (no experience at all) to 5 (clear and vivid experience).
  3. Run the subliminal trial:
     - Display the fixation cross for 1000 ms (1 second).
     - Display the target letter for 17 ms (this is too fast for conscious perception for most people). 
     - Immediately display the mask for 500 ms.
     - Then show a blank screen.
  4. Students write down their guess and confidence.
  5. Repeat this for a total of 10 trials, each with a randomly chosen letter (but make sure each letter is presented at least twice). 

  *Note:* The exact timing may need adjustment. 17 ms is about one frame at 60Hz, but if your projector/computer can't do that, try 50 ms and adjust downward if needed. The key is to be too fast for most to see.

  *Rules and Timing (for index card version):*
  1. Hold up the fixation cross card for 1 second.
  2. Quickly flip to the target letter card and then immediately cover it with the mask card. Hold the mask for about 1 second.
  3. Students write their guess and confidence.
  4. Repeat 10 times with random letter order.

  *Expected result:* 
  - Students should have low confidence (mostly 1 or 2) and yet, as a group, their guesses should be above chance (25% for 4 letters). You can tally the results on the board.

  **Activity 2: Broadcast Condition (Global Workspace Simulation)**

  *Setup:*
  - Use the same setup as above but present the target letter for a longer duration (e.g., 500 ms) without a mask (or with a mask after 500 ms, but that might not be necessary). 

  *Rules and Timing:*
  1. Tell students they will now see the letter for a longer time and should report what they see.
  2. Display the fixation cross for 1000 ms.
  3. Display the target letter for 500 ms.
  4. Then display a blank screen (or if you want to use a mask, show it after 500 ms for 100 ms, but it's not critical).
  5. Students write down the letter they saw and their confidence (which should be high).
  6. Repeat for 10 trials (same random sequence of letters as in the subliminal condition, but you can generate a new one if you prefer).

  **Debrief:**

  1. **Tally the results:**
     - For the subliminal condition: calculate the percentage of correct guesses. If above 25% (chance), point out that the group as a whole had access to the information (they were able to guess correctly) even though individually they reported low confidence (no phenomenal experience). 
     - For the broadcast condition: note the high accuracy and high confidence (phenomenal experience and access).

  2. **Map to the concepts:**
     - *Phenomenal consciousness*: In the subliminal condition, students didn't have a conscious experience (low confidence) of the letter. In the broadcast condition, they did (high confidence). 
     - *Access consciousness*: In the subliminal condition, the information was processed enough to guide behavior (guesses above chance) but not available for reporting in a way that feels conscious. In the broadcast condition, the information was accessible for report and reasoning.
     - *Global workspace*: In the broadcast condition, the stimulus was "broadcast" to the whole system (long enough for widespread processing) so that it was available to multiple cognitive systems (e.g., verbal report, memory). In the subliminal condition, the stimulus was processed only in a local module (visual processing) and wasn't broadcast, so it couldn't be used flexibly (only in forced-choice guessing).

  3. **What might go wrong:**
     - Some students might report seeing a "blur" or something in the subliminal condition. This is okay! You can use this to discuss that there might be partial awareness. The key is that they don't know the identity of the letter. 
     - The above-chance effect might be weak in a single trial (or even 10 trials) due to the small number of students (20) and the low number of trials. To mitigate, you can run more trials (if time allows) or aggregate the data from all students and all trials. If the effect isn't above chance, explain that it often is in controlled studies and that we are simulating the idea.
     - Technical issues: Timing might be off. Practice the timing beforehand. If using index cards, it's harder to control the timing. Projector timing might vary by system.

  4. **What the activity cannot reproduce:**
     - The activity does not reproduce the actual neurological condition of blindsight (which involves damage to V1). We are simulating it by using a very brief presentation. 
     - In real blindsight, patients are not aware of any visual experience in the blind field. In our simulation, some participants might have a fleeting sense of something (a flash, a blur) but not the identity. You must explain that the dissociation in blindsight is more extreme (no visual experience at all) and that our simulation is just an approximation.

  **Overall Timing for the Class (50 minutes):**
  - Introduction to the concepts (5 minutes) - but you said no preface? Since you want to jump into the activity, you might do a very brief intro: "Today we are going to experience two kinds of consciousness: one where you have no experience but your behavior shows you processed the information, and one where you are fully aware. We'll then discuss."
  - Activity 1 (Subliminal): 10 trials, about 15 minutes (including instructions and writing responses).
  - Activity 2 (Broadcast): 10 trials, about 10 minutes (since it's easier).
  - Tally and debrief: 20 minutes.

  This leaves 5 minutes for buffer. Adjust as needed.

  **Final Note:** 
  The goal is to create an experiential understanding. Even if the subliminal condition doesn't yield above-chance results, you can still discuss the theoretical point and how in controlled experiments it does. The contrast between the two conditions should be clear in terms of confidence and reportability.
answer: |-
  ### Subliminal Flash Condition (Blindsight Simulation)

  **Setup:**
  - Projector displaying a white screen with a central black fixation cross.
  - Prepare 20 index cards: 5 each labeled A, B, C, D (stimuli), and 15 blank cards (masks).
  - Stopwatch or phone timer.
  - Paper/pencils for students to record responses.

  **Procedure (6 minutes):**
  1. **Instructions (1 min):** "Stare at the cross. When I flash a card, a letter *might* appear, but it'll be extremely fast. Write down: (1) Your guess (A/B/C/D or 'nothing'), (2) Confidence: 1 (pure guess) to 5 (certain you saw it)."
  2. **Trial (5 mins total, 10 trials):**
     - Fixation cross displayed (3 sec).
     - **Flash phase:** Randomly select a letter card. Hold it *behind* a blank mask card. Rapidly slide the letter card out for **50 ms** (use timer) while covering it again with the mask. *Critical: Angle the cards away from direct light to reduce visibility.*
     - Immediately show the blank mask card for 2 sec.
     - Repeat with new random letters (ensure equal A/B/C/D distribution).
     - Students record responses after each trial.

  **Key Trick:**  
  - Use the projector’s light to "wash out" the card during flashing. Hold cards 3-4 feet from projector beam to create glare that obscures details.  
  - *Practice timing 50 ms (say "mississippi" quickly ≈ 50 ms) beforehand.*

  ---

  ### Broadcast Condition (Global Workspace Simulation)

  **Setup:** Same as above, but skip masks.

  **Procedure (4 minutes):**  
  1. **Instructions (30 sec):** "Now, letters will be shown clearly. Report what you see."  
  2. **Trial (3.5 mins total, 10 trials):**  
     - Fixation cross (3 sec).  
     - Show letter card for **500 ms** in clear light (no mask).  
     - Students write letter and confidence (1-5).  
     - Repeat with same letter sequence as subliminal condition.  

  ---

  ### Debrief (15 minutes)

  **Data Analysis (5 mins):**  
  1. Tally subliminal results:  
     - Calculate class accuracy (% correct guesses).  
     - *Expected outcome:* ~35-45% accuracy (above 25% chance), but low confidence (avg. 1.5-2.5).  
  2. Tally broadcast results:  
     - Near 100% accuracy, high confidence (avg. 4-5).  

  **Map to Concepts (7 mins):**  
  - **Phenomenal consciousness (P-conscious):** "In the flash trials, you had *no experience* of the letter—like blindsight patients. Information was processed locally without subjective awareness."  
  - **Access consciousness (A-conscious):** "Even without experience, guesses were above chance. The *information* (letter identity) was briefly in your system—it just wasn’t accessible to your 'self' for reporting."  
  - **Global Workspace:** "In broadcast trials, the letter was 'published' to your whole mind—like a spotlight. You could use it for memory, speech, or decisions. That’s A-consciousness *with* P-consciousness."  

  **What Will Go Wrong (2 mins):**  
  1. 2-3 students will insist they "saw a blur" in subliminal trials.  
     - *Response:* "That’s the point! Blindsight patients report vague sensations too. The key is: you couldn’t *identify* the letter."  
  2. Weak above-chance effect in small samples.  
     - *Response:* Show aggregated class data. If still weak, say: "Single trials are noisy. Studies use 100s of trials—yours would improve."  
  3. Timing errors (too slow/too fast).  
     - *Fix:* Practice 50 ms until consistent.  

  **Limitation to Explain (1 min):**  
  - "This *simulates* blindsight but can’t replicate V1 damage. You still used visual pathways—I’ll show fMRI data to clarify."  

  ---

  **Total Time:** 25 mins (leaves buffer for Qs).  
  **Why It Works:** Forces dissociation between feeling (phenomenal) and knowing (access). The glare/mask combo creates genuine "not-seeing" while preserving data-guided guessing.
