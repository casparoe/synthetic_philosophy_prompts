prompt: |-
  So I'm giving a talk next week at a health-economics workshop, and I'm defending the strong version of the precautionary principle — the one that puts the burden of proof on the person proposing an action and says an act with potentially catastrophic and irreversible effects is unacceptable unless you can demonstrate it's safe, not merely that the expected benefits outweigh the expected costs. My thesis is that this is a genuine, non-redundant epistemic norm: roughly, it's doing work under deep (Knightian) uncertainty — unknown unknowns, distributions you can't even specify — that a concave utility function over known risks can't do, and that the standard move of reducing it to risk aversion or to a failure of cost-benefit analysis just misidentifies what it's doing.

  The room is going to be mostly cost-benefit analysts, health economists, and a couple of actuaries — people who think every policy question should ultimately be expressed as an expected-value calculation and who are alergic to any principle they can't fold into a utility function. No philosphers in the room.

  Draft me a Q&A prep sheet. I want the seven or eight objections I'll actually get from this crowd — not the ones I'd get from a philosophy seminar — ordered by how much damage they'd do if they landed. Phrase each the way an economist would put it, in their vocabulary not mine. For each, give me a two-minute reply and a one-line note on where the reply is softest. And please actually take a position: commit to the strong principle as the one worth defending, don't hedge by surveying every version and saying "it depends," and build all the replies around that commitment. Include the one question I'm quietly hoping nobody asks, and tell me what to do if it does.

  Think very carefully before answering, and write it the way a senior health economist who has sat through a hundred of these Q&As would — direct, no hand-waving, and willing to flag "here's where I'm actually weak" rather than fudging it.
