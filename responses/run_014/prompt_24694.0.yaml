answer: |-
  ### Scenario: The Riverton Water Treatment Referendum
  The town of Riverton (population 100,000 eligible voters) must decide whether to adopt a new water treatment system. The system is objectively beneficial (correct outcome) if groundwater contamination exceeds 10 ppm, which independent experts confirm is true. Each voter receives imperfect information: their assessment aligns with the truth 51% of the time (competence \(p = 0.51\)), and errors are independent. Voting costs $1 (time/travel). The collective benefit of a correct decision is $100 million ($1,000 per voter if correct; $0 if incorrect). Normal turnout is 60,000 voters. If the measure fails, contaminated water causes health and economic losses.

  ---

  ### Key Calculations
  **1. Condorcet Jury Theorem (High accuracy at normal turnout)**  
  - With \(n = 60,000\) voters, each with competence \(p = 0.51\), the majority chooses correctly if \(\geq 30,001\) votes are correct.  
  - Mean correct votes: \(\mu = np = 60,000 \times 0.51 = 30,600\)  
  - Standard deviation: \(\sigma = \sqrt{np(1-p)} = \sqrt{60,000 \times 0.51 \times 0.49} \approx 122.2\)  
  - Using normal approximation, \(P(\text{correct majority}) = P(X \geq 30,000.5)\):  
    \[
    z = \frac{30,000.5 - 30,600}{122.2} \approx -4.91 \implies P(Z \geq -4.91) > 99.99\%
    \]  
    **Result:** Near-certain correct outcome (\(>99.99\%\)) at normal turnout.  

  **2. Paradox of Voting (Negative expected value for an individual)**  
  - A voter is pivotal only if other votes split **exactly 29,999–30,000** (correct–incorrect) or **30,000–29,999** (correct–incorrect).  
  - **Pivotal probability** approximation (using binomial PMF near mean):  
    \[
    P(\text{pivotal}) \approx \frac{1}{\sigma\sqrt{2\pi}} \times 2 = \frac{2}{122.2 \times 2.506} \approx 0.000065 \ (\sim 6.5 \times 10^{-5})
    \]  
    *(Order of magnitude: \(10^{-5}\) matches combinatorial estimates for large \(n\))*.  
  - **Expected benefit** if pivotal:  
    - Voting correctly: Turns loss into 50% chance of win (expected gain \(= 0.5 \times \$1,000 = \$500\)).  
    - Voting incorrectly: Turns win into 50% chance of loss (expected loss \(= -0.5 \times \$1,000 = -\$500\)).  
    Given competence \(p = 0.51\):  
    \[
    \text{Expected benefit} = P(\text{pivotal}) \times [p \times \$500 + (1-p) \times (-\$500)] \approx 0.000065 \times [\$10] = \$0.00065
    \]  
  - **Net expected utility**: \(\$0.00065 - \$1 = -\$0.99935\).  
    **Result:** Expected cost of voting (\(\$1\)) dominates expected benefit (\(\$0.00065\)), making voting irrational.  

  **3. The Kicker (Collective self-defeat if all abstain)**  
  - If all voters abstain:  
    - Turnout \(n \approx 0\). Outcome decided by fair coin flip (default rule).  
    \(P(\text{correct}) = 50\%\).  
  - If turnout drops to \(n = 100\):  
    \[
    P(\text{correct majority}) = P(X \geq 50.5) \ \text{for} \ \mu=51, \sigma=5. \quad z \approx 0.1 \implies P \approx 54\%. 
    \]  
    **Result:** Accuracy plummets to \(\sim50\%\) if all abstain, and remains low (\(<55\%\)) at minimal turnout.  

  ---

  ### The Single Feature Doing the Work
  **Large electorate size (\(n = 100,000\))** is crucial:  
  - Enables **vanishingly small pivotal probability** (\(10^{-5}\)) despite high aggregate accuracy.  
  - If reduced to \(n = 1,000\):  
    - Pivotal probability rises to \(\sim 10^{-2}\) (may yield positive expected value).  
    - CJT accuracy drops to \(92\%\) (still high, weakens contrast).  
    *Conditions fail simultaneously if \(n\) is small.*  

  ---

  ### Pushback from a "Just Vote" Defender & Weaknesses  
  **Defender's argument:**  
  > "Voting is a civic duty. If everyone votes, society reaps huge gains ($100M). Individual costs are trivial, and abstaining is free-riding on others' effort."  

  **Weaknesses:**  
  1. **Pivotal probability is mathematically negligible** in large elections (instrumental rationality fails).  
  2. **Duty argument ignores individual calculus:** Even if voting feels good, a $1 cost requires >1/10,000 chance of being pivotal to break even—unrealistic here.  
  3. **Collective benefit ≠ individual incentive:** The social optimum (high turnout) is unstable when each voter’s best move is to abstain.  

  ---

  ### Handout-Ready Summary  
  **Scenario:** Riverton’s water treatment referendum (100,000 voters; \(p = 0.51\); cost $1; true benefit = correct outcome).  
  **Conditions met:**  
  1. **CJT:** 60,000 voters → >99.99% correct outcome.  
  2. **Paradox:** Individual net expected value = -$1 (abstain is rational).  
  3. **Kicker:** Universal abstention → 50% accuracy (collective disaster).  

  **Key insight:** Large electorates create tension between individual rationality (abstain) and collective welfare (vote). No fudging: size is essential.  

  **Discussion question:** *Can civic duty or social norms resolve this paradox without legal coercion?*
