  Give me the scenario in a paragraph, then walk through the three calculations with real numbers, and be honest about the pivotal-probability figure—estimate it the standard way, order of magnitude is fine, but don't just wave your hands and assert it. After that, tell me which single feature of the case is doing the work, what happens if I remove it, and close with how a defender of "just vote, it's obviously collectively rational" would push back and where that pushback is weakest. I want something I can actually hand to students, so if any of the three conditions can't be met at once without one of them doing all the lifting, flag that instead of fudging it.
