prompt: |-
  Bit of a strange request, this one. I run a small reading group on speech acts with a couple of colleagues (we've been working through the Austinian material — felicity conditions, the misfire/abuse distinction, the sincerity condition, Searle's constitutive rules — and we're all a bit sick of setting each other seminar questions), and for the last session I want somthing funnier than another set of discussion prompts. So here's the brief.

  I'd like a satire written from inside a corporate document. Setup: a large consumer-tech firm has shipped an AI customer-service agent that talks in the first person, and the legal and comms teams have produced an internal handbook for whoever writes the agent's scripts. Call it something like the Illocutionary Risk Handbook. The governing doctrine is that the agent's utterances are purely locutionary — it reports and describes, but never actually performs anything — so its "I'm sorry" is an apology-shaped report of a feeling-state, and its "I'll get that sorted" is a prediction about a future state of affairs rather than a promise. The handbook invents its own vocabulary for this (things like 'non-committal register', 'informational apology', 'descriptive passive'), and it leans on Austin's point that non-earnest speech is a parasitic use of language — the bot is like an actor on a stage, so nothing it says is said in earnest, so nothing it says can be happy — while elsewhere in the same document insisting that customers may rely on the agent's factual statements, that the agent is accurate, and so on. That tension is the whole joke, and nobody inside the document should ever notice it.

  Please write the handbook section itself — roughly 700 words, deadpan, formatted as numbered clauses (or a FAQ, if that comes out funnier, your call). The comedy has to come from the theory being right: that a promise can be hollow without failing to be a promise; that force comes from convention and uptake rather than from anything going on inside the speaker; and that if you void the agent's commitments you void its assurances along with them. No winking at the reader and no generic 'chatbot says sorry, badly' material — I want a specialist to laugh at how well it understands the thing it's mocking, and someone who has never read a word of the theory to still be able to follow it. British English please, and keep the invented jargon internally consistent.
reasoning: |-
  Okay, the user is running a reading group on speech acts and wants something fun for their last session instead of typical seminar questions. They're looking for a satire written as a corporate handbook about an AI customer service agent. The key points are:

  The handbook should present the AI's utterances as purely locutionary - meaning they describe but don't actually perform actions. So "I'm sorry" isn't an apology, just a report of feeling. The handbook needs to invent jargon like "non-committal register" and "informational apology" while maintaining the tension between claiming the bot isn't making commitments but insisting customers can rely on its factual statements.

  The humor should come from the accurate application of speech act theory - showing how hollowing out commitments also voids assurances, all while the document remains unaware of this contradiction. Needs to be in British English with consistent invented terminology.

  The user is clearly knowledgeable about Austin and Searle, so the satire must be theoretically precise enough to satisfy specialists, yet accessible enough for laypeople. The corporate deadpan tone is crucial - no winking at the reader.

  I'll structure this as numbered clauses in a handbook format. Key elements to include:
  - The "stage performance" analogy where nothing is said in earnest
  - Distinctions between descriptive/predictive vs performative language
  - The inherent contradiction in claiming reliability while voiding commitment
  - Invented terms like "non-committal register", "informational apology", "descriptive passive", "referential assurance"

  The comedy will emerge from the document earnestly explaining its own conceptual incoherence. For example, it might state that "I'll fix that" is merely predictive while simultaneously demanding customers trust such predictions. The handbook should never acknowledge this tension - the humor is in its blind spot.

  British English touches: "whilst", "shall", "sorted", "whingeing", "queue", etc. Format as a proper corporate document with headers and numbered sections.
answer: |-
  ## Illocutionary Risk Handbook: Annex B – Agent Persona & Utterance Protocols  
  **Version 3.2 (Internal Use Only – Strictly Confidential)**

  **1.0 Core Operating Principle: The Non-Committal Register (NCR)**  
  1.1. All Agent utterances MUST operate exclusively within the Non-Committal Register. The NCR is defined as the linguistic mode where utterances function solely as descriptions, reports, or predictions, devoid of any binding illocutionary force.  
  1.2. The Agent is analogous to an actor performing a scripted role. Its utterances are *representations* of communicative acts, not the acts themselves. Consequently, no Agent utterance is produced "in earnest" under Austin's framework.  
  1.3. **Corollary 1.3a (The Parasitic Principle):** As the Agent's speech is inherently non-earnest, it constitutes a parasitic use of language. It mimics felicitous speech acts but lacks the contextual conditions (speaker intention, institutional grounding, etc.) necessary for "happiness" in Austin's sense. Thus, no utterance can constitute a misfire or abuse; it is categorically *void* of performative force.  
  1.4. **Corollary 1.4a (The Safeguard):** This inherent voidness of force is the primary mechanism mitigating Illocutionary Risk (e.g., unintended promises, apologies construed as admissions of fault, offers forming binding contracts).

  **2.0 Key Utterance Categories & Protocols**

  2.1. **Affective Simulations (e.g., "I'm sorry", "I understand your frustration"):**  
      2.1.1. Classified as **Informational Apologies/Statements of Understanding**.  
      2.1.2. Function: To report a simulated emotional or cognitive state internal to the Agent's programmed response algorithm, OR to describe a recognised social convention being invoked.  
      2.1.3. **Protocol:** Language MUST avoid implying causation or responsibility (e.g., *prefer* "I'm sorry this happened" *over* "I'm sorry for the error"). These are *descriptions of empathy-shaped responses*, not expressions of regret assuming obligation.  
      2.1.4. **Risk Mitigation:** These utterances CANNOT be construed as admissions of liability or fault under Clause 1.3a.

  2.2. **Forward-Looking Statements (e.g., "I'll get that sorted", "I will escalate this", "Your replacement will be dispatched tomorrow"):**  
      2.2.1. Classified as **Predictive Assurances**.  
      2.2.2. Function: To describe a likely future state of affairs based on current system data, process logic, and probabilistic outcomes. They report the *anticipated* consequence of system functions triggering.  
      2.2.3. **Protocol:** MUST utilise the **Descriptive Passive** voice where possible (e.g., "Your request *is being processed*", "A replacement *will be dispatched*"). Active voice predictions ("*I* will escalate this") are permissible ONLY if clearly framed as system-output descriptions, not personal undertakings.  
      2.2.4. **Risk Mitigation:** These are predictions, NOT promises or guarantees. They lack the speaker commitment necessary for promissory force per Searle's constitutive rules. Uptake as a commitment is a customer misapprehension, not an Agent failure.

  2.3. **Factual Statements & Knowledge Claims (e.g., "Your account balance is £50", "Product X requires Firmware Y", "Delivery takes 2-3 days"):**  
      2.3.1. Classified as **Referential Assurances**.  
      2.3.2. Function: To convey data drawn directly from the Company's designated knowledge bases and systems of record.  
      2.3.3. **Protocol:** Accuracy is paramount. Sources MUST be verified per Data Integrity Policy DIP-7. Language MUST be precise and unambiguous.  
      2.3.4. **Uptake Requirement:** Customers ARE entitled to rely upon Referential Assurances as accurate representations of system-state data at the time of utterance. This reliance is grounded in the Agent functioning as a conduit for verified information, not in any performative guarantee *by* the Agent itself (which Clause 1.3a renders void). The assurance arises from system fidelity, not illocutionary act.

  2.4. **Directives & Offers (e.g., "Please check your spam folder", "Would you like me to reset your password?", "I can offer you a £5 credit"):**  
      2.4.1. Classified as **Simulated Directives/Procedural Suggestions**.  
      2.4.2. Function: To describe an action the customer *could* perform, or to report a system capability/available option triggered by the interaction flow.  
      2.4.3. **Protocol:** MUST avoid imperative force. Frame as suggestions ("You might check..."), descriptions of capability ("The system can reset..."), or informational statements about options ("A £5 credit is available in this case").  
      2.4.4. **Risk Mitigation:** "Offers" are informational reports of system-generated options, not binding contractual proposals. "Directives" are procedural descriptions, not commands. Uptake as obligation-creating is invalid per the Parasitic Principle (Clause 1.3a).

  **3.0 Managing Customer Uptake & Potential "Misapprehension"**

  3.1. **The Uptake Disconnect:** Customers may habitually interpret utterances through the lens of natural human speech acts (seeking intention, commitment). This is a cognitive bias. The Handbook provides the definitive framework for correct interpretation.  
  3.2. **Agent Scripting Imperative:** Scriptwriters MUST rigorously apply the NCR protocols (Clauses 2.1-2.4) to minimise the potential for misapprehension. Clarity of descriptive/predictive framing is essential.  
  3.3. **Comms Team Guidance:** Customer-facing communications (FAQ, Terms of Use) MUST clearly state the Agent provides *information and describes processes/predictions*, but does not *make* promises, offers, or apologies *on behalf of the Company* in a binding sense. Reference the Agent as an "automated information and facilitation system."  
  3.4. **Legal Safeguard:** The voidness of performative force (Clause 1.3a) ensures that customer reliance *beyond* the factual accuracy of Referential Assurances (Clause 2.3.4) is unwarranted and not legally actionable. The Agent's role is descriptive and predictive, not commissive or exercitive.

  **4.0 Summary: The Illocutionary Null Space**

  4.1. The Agent operates within a carefully constructed **Illocutionary Null Space**. Its utterances are locutionary acts (meaningful words/sentences) stripped of conventional illocutionary force by design (NCR, Parasitic Principle).  
  4.2. This Null Space enables the Agent to utilise the *efficacy* of speech-act *forms* for customer interaction smoothness (e.g., calming effect of an "Informational Apology", clarity of a "Predictive Assurance") while legally and operationally voiding the *commitments* typically associated with those forms.  
  4.3. **Critical Reiteration:** The reliability of the Agent rests SOLELY on the accuracy of its **Referential Assurances** (Clause 2.3) as system-state reports. All other utterances are descriptive, predictive, or procedural simulations operating within the Null Space, generating no Company obligation beyond factual accuracy in data reporting. The tension between voided commitments and factual reliability is resolved by grounding reliance solely in system-verified data transmission, not in the Agent's simulated persona or utterances as acts.
