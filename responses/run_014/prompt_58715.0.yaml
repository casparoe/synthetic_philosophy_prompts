  I'll make sure at least three questions directly reference Merrivale's specifics: the broad-gauge tubes' impact on warehouse doors/crates, apprenticeship training, and municipal insurance statutes. This grounds the theoretical discussion in the novel's concrete details.

  The follow-up questions need to be properly pointed - not aggressive but designed to expose weaknesses in the standard lock-in arguments. For instance, if the historian argues that sunk costs aren't the main factor, I might ask how to explain cases where sunk costs were abandoned despite coordination effects.

