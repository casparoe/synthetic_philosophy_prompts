answer: |-
  ## Eulogy for Dr. Alan Reyes

  Good morning. We gather with heavy hearts, yet also with profound gratitude, to remember Dr. Alan Reyes. Alan was my mentor for fifteen years, a guiding light in the often chaotic world of emergency medicine. To his beloved family, his dear friends, and to my colleagues who shared the trenches of the ER with him, I offer my deepest condolences. We have all lost someone irreplaceable.

  Many of you knew Alan outside these walls – the warmth of his smile, his dry wit that could cut through tension, the steadfast loyalty he offered his friends, the deep love he had for his family. He was a man who savored a good meal, told stories that lingered, and offered quiet comfort when it was needed most. That man, the whole man, is who we mourn today.

  But for many of us here, Alan was also the calm at the center of the ER storm. For thirty years, he ran trauma triage at the county hospital. And in that high-stakes arena, Alan had a principle that became legendary: "Let the board decide."

  Now, for those unfamiliar, the triage board wasn't some cold machine. It was a tool – a constantly shifting map of human need. Names, conditions, prognoses, resources – all laid bare. And Alan stood before it, day after night, making decisions no one should ever have to make. Who gets the last ventilator? Who gets the surgeon’s immediate attention when seconds count?

  Some might hear "let the board decide" and think it sounds detached. Impersonal. Like reducing people to numbers. But those of us who stood beside Alan, who saw the intensity in his eyes as he studied that board, knew it was anything but.

  Alan believed, with every fiber of his being, in the equal worth of every single person who came through those doors. The CEO and the homeless veteran. The newborn and the elderly grandmother. The charming, easy patient and the difficult, frightened one. He saw the person first, always. He treated them with dignity, always.

  And *that* is precisely why he let the board decide. **Because Alan understood that treating people as truly equal meant refusing to let his own feelings, his own comfort, or his own personal connections tip the scales.** He knew that his own human heart – like any heart – could be swayed. By a familiar face. By a sympathetic story. By someone who reminded him of his own child, or his own parent. By charm.

  He saw the terrible danger in that. The danger that, in trying to be kind to one, he might unknowingly be unfair to another whose need was greater, but whose story was quieter, whose face was less familiar. Letting the board decide wasn't about numbers valuing lives. It was about the numbers representing *need*, pure and simple, as best we could measure it in those critical moments. It was his shield against the unconscious biases, the soft spots, the very human flaws that could distort judgment.

  He withheld the ventilator from the younger patient not because their life mattered less, but because, in that awful moment, the board – reflecting the brutal arithmetic of who had the best chance and the most urgent need with the resources available – pointed to someone else. It might have been someone older, someone less charming, someone he didn't know. It didn’t matter. What mattered was the equal claim each had on care, judged not by who Alan *liked* or who *felt* more important, but by who *needed* it most to survive. He let the clearest measure of that need guide him, precisely *because* he held each life in such high, equal regard.

  This wasn't coldness. This was courage. This was humility. Humility to recognize that his own judgment wasn't infallible. Courage to set aside his personal feelings – even when it tore him up inside, and believe me, it often did – in service of a deeper fairness. He wasn't playing God; he was refusing to. He was letting the clearest picture of the situation dictate the most just action he could take for *everyone* involved.

  Alan was not a machine. He felt the weight of those decisions deeply. He carried them home. But he also carried the profound conviction that this was the most respectful thing he could do: to ensure that every patient, seen or unseen, known or unknown, had an equal shot at survival based on the reality of their need, not the warmth they generated in the heart of the person holding the pen.

  So, yes, Alan "let the board decide." But let us be clear: he built that principle on bedrock. The bedrock belief that every life is precious. That every person deserves a fighting chance. That fairness, especially when lives hang in the balance, requires us to look beyond our own impulses and listen to the difficult truths the situation presents.

  He saved countless lives, not by being a lone hero, but by being a guardian of a process designed to save the most lives possible, as fairly as possible. He honored the person by honoring the principle that ensured no person was unfairly favored, or unfairly forgotten.

  We will miss his wisdom, his steadiness, his kindness, and yes, that unwavering commitment to fairness that defined his work. He showed us what it means to respect life, not just in the easy moments, but in the hardest ones. He showed us that true compassion sometimes means stepping back so that fairness can step forward. That was Alan Reyes. And we were all profoundly lucky to know him. Thank you.
