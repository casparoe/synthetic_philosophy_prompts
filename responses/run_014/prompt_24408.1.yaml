prompt: |-
  ok so I'm a senior and I'm doing an independent project on inside view vs outside view (base rates vs reasoning about the specifics of the case) and I keep hitting the same wall. everyone says use the outside view because it's more accurate, but I don't think that's the whole story, and I can't tell which of the actual open questions in this area matter most. the stuff I'm stuck on: how do you even pick the refference class (finer class = more accurate but less data, and it feels like you can just pick whatever class confirms your prior), when is the inside view actually legit instead of just rationalization (is it only when you have real causal knowledge the base rate doesn't capture?), and what happens when there's basically no good reference class at all (first-of-its-kind stuff), which feels like exactly when people are most overconfident. also the outside view feels like a tool for intellectual humility but I worry it can just be used to shut down thinking. if you were setting the agenda for me to make real progress on this in like a year, which open questions would you prioratize and in what order? I care more about the reasoning than the list: why each one is upstream of the others, which are tractable with just reasoning, and what would change your mind about the ranking. and at the very end, put a last line that starts with 'Verdict:' followed by the single question you think is most worth settling first, as a short phrase.
reasoning: |-
  Okay, let me unpack this senior's independent project dilemma. They're wrestling with the inside/outside view framework and hitting conceptual walls - specifically about reference class selection, legitimacy of inside view, and handling novel situations. What stands out is their frustration with oversimplified "always use outside view" advice and their sharp observation that these tools can be weaponized for motivated reasoning or intellectual laziness.

  Hmm, their core tension seems to be between theoretical purity and practical application. The reference class problem is particularly thorny - it's where statistical reasoning meets human bias. I recall Tetlock's work on foxes vs hedgehogs showing how experts manipulate reference classes to fit narratives. And Kahneman's admission that outside view often gets rejected emotionally despite its rigor... that feels relevant here. 

  For novel situations, the Apollo program case study comes to mind - NASA combining aircraft development base rates with causal models of rocket physics. That might help demonstrate hybrid approaches. The student's point about overconfidence in unprecedented scenarios is astute - it echoes Taleb's "Black Swan" concerns.

  Prioritizing research angles: The reference class selection question feels most foundational. Without solving that, other discussions rest on shaky ground. It's also the most tractable through case studies - examining historical decisions where reference classes were contested (e.g., Cuban Missile Crisis analogies). Next would be clarifying when inside view adds value, which requires dissecting examples of successful causal reasoning versus rationalization. Novel situations come third only because they're rarer - though more dramatic.

  The humility concern is crucial but perhaps downstream. If we nail the reference class issue, we automatically address how these tools can be misused. Might suggest they analyze a political debate where both sides use outside view disingenuously - Brexit economic forecasts could be rich material.

  Verdict crystalized while considering how all other problems branch from reference class selection. It's the linchpin. Final answer should validate their skepticism about oversimplification while giving concrete direction.
answer: |-
  Your project hits at the core tension in decision science: **the map vs. territory problem of probabilistic reasoning.** You're right that "always use the outside view" is oversimplified. Here's a structured research agenda prioritizing tractable, high-leverage questions, ordered by upstream dependencies:

  ---

  ### **Research Agenda: Prioritized Open Questions**
  1.  **Q1: What constitutes a *valid* reference class?**  
      *   **Why upstream?** Until we define validity, we can't resolve bias in class selection or hybrid approaches.  
      *   **Tractability:** Testable via case studies (e.g., compare outcomes when experts pick classes using structured criteria vs. ad-hoc choices).  
      *   **Mind-change trigger:** Evidence that "optimal" classes exist *objectively* (e.g., via algorithmic selection outperforming humans).

  2.  **Q2: When does causal knowledge *legitimately* override base rates?**  
      *   **Why next?** Determines when inside view isn't rationalization. Depends on Q1 (to define "override").  
      *   **Tractability:** Analyze historical successes/failures (e.g., SpaceX reusability vs. nuclear fusion predictions). Focus on *causal granularity*: How deep must mechanistic understanding be?  
      *   **Mind-change trigger:** Cases where base rates beat detailed causal models despite apparent uniqueness.

  3.  **Q3: How to reason when *no reference class exists*?**  
      *   **Why third?** Requires insights from Q1/Q2 to build scaffolding.  
      *   **Tractability:** Study "first-of-kind" projects (e.g., first mRNA vaccines, ChatGPT launch). Catalog heuristics used and their accuracy.  
      *   **Mind-change trigger:** Discovery that all "unique" cases share hidden higher-order base rates.

  4.  **Q4: Can hybrid approaches *systematically* mitigate motivated reasoning?**  
      *   **Downstream dependency:** Builds on Q1-Q3. Addresses your "shut down thinking" concern.  
      *   **Tractability:** Design/test protocols (e.g., "Outside View First" vs. "Causal Model First" blind analysis).  
      *   **Mind-change trigger:** Proof that forced integration *increases* bias in certain contexts.

  ---

  ### **Why This Order?**
  - **Q1 is foundational:** Reference class validity underpins *all* outside view applications. Without rigor here, bias dominates.  
  - **Q2 unlocks inside view legitimacy:** You can't defend causal reasoning until you know when it trumps statistics.  
  - **Q3 extends the framework:** Novelty forces innovation in *both* views, relying on principles from Q1/Q2.  
  - **Q4 tackles implementation:** Only after establishing *how* to use each view can we design anti-bias practices.

  ---

  ### **Key Insights for Your Wall**
  - **Reference class paradox:** Finer classes aren’t inherently better. **Validity requires *predictive homogeneity*** (e.g., "tech startups" is worse than "B2B SaaS with 10-50 employees"). Combat bias by *pre-registering* your class *before* analyzing specifics.  
  - **Inside view legitimacy:** Requires **falsifiable causal models** (e.g., "This bridge will collapse because beam X has corrosion exceeding threshold Y" vs. "I feel good about it"). Test with Fermi estimates.  
  - **True novelty:** When no class exists, **anchor on *principles* not outcomes** (e.g., "What’s the failure rate of complex systems with untested core components?").  
  - **Humility trap:** Outside view *is* vulnerable to faux-humility. Counter by demanding *competing* reference classes (e.g., "Is this more like Apollo 11 or the Hindenburg?").

  ---

  **Verdict:** *Defining criteria for valid reference class selection.*
