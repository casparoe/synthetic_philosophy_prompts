prompt: |-
  I teach an upper-level seminar on rational choice theory for philosophy majors — 14 students, one 90-minute session — and we've just finished the standard treatment of the one-shot prisoner's dilemma before moving on to Hofstadter's idea of superrationality: the thought that if you know your co-player reasons as you do, the right move may be to cooperate, since your choice is evidence about theirs even though it doesn't cause it. The students can recite the argument but don't feel its pull at all; to them, defecting in a one-shot dilemma is just obviously what a rational person does, and superrationality sounds like a parlor trick. I want an in-class game that reverses this by making them experience, rather than merely read about, the difference between playing against an arbitrary opponent and playing against someone who is effectively reasoning with the same mind.

  Here is the structure I half-imagine, which you should refine, extend, or correct: students play the same one-shot prisoner's dilemma under three conditions in sequence. In the first, they're matched with a random anonymous classmate with no communication. In the second, they're told they've been paired with someone who received an identically worded briefing sheet, sat through the same lectures, and was given the same instructions — a "duplicate" pairing that the facilitator stages as convincingly as possible. In the third, some device makes the symmetry of reasoning more vivid — perhaps each player writes a short paragraph of their reasoning before choosing, and matched players exchange and read them aloud, so that each literally watches the other arrive at their conclusion. Payoffs should be real but modest (bonus points, vouchers — nothing involving cash), and I want the payoff matrix chosen so that the tension is sharp. Design the full activity: rules, materials, an exact timeline that fits 90 minutes including setup, the payoff scheme, how pairings and anonymity are actually managed in a small classroom where everyone can see everyone, and a debrief that maps specific moments in the game onto the formal distinction between causal and evidential views of the choice, and onto why iterated-play explanations of cooperation don't apply here even though students will keep reaching for them.

  Two further requests. First, tell me what will predictably go wrong the first time I run it — I suspect students will talk during the "silent" phases, or someone will defect in the duplicate condition precisely to prove the theory wrong, or the duplicate framing will collapse because the paired students realize they're different people with different grades at stake — and how I should handle each. Second, be honest about which part of superrationality no classroom game can reproduce: real students are not copies of one another, they know it, and any symmetry is a fiction maintained by the facilitator's framing rather than a metaphysical fact. Say where that fiction is load-bearing, and what the debrief has to supply that the game itself cannot. If you think one of my three conditions is doing no work, say so and propose a better one.
reasoning: |-
  We are designing an in-class game to help students experience the difference between arbitrary opponents and symmetric reasoners in a one-shot Prisoner's Dilemma (PD). The goal is to make the concept of superrationality more tangible.

  Structure: The activity will have three rounds, each with a one-shot PD. The rounds are:
  1. Random pairing: Students are anonymously paired with a random classmate.
  2. "Duplicate" pairing: Students are told they are paired with someone who has had identical exposure to the material and instructions (emphasizing symmetry).
  3. Explicit reasoning exchange: Students write a short reasoning paragraph, exchange it with their partner (anonymously), and then choose after reading.

  Payoffs: Use bonus points (e.g., 0.5 points on a future assignment) to make it real but modest. We need a payoff matrix that creates tension. A classic PD matrix:

            Cooperate | Defect
  Cooperate | (3,3)  | (0,5)
  Defect    | (5,0)  | (1,1)

  In points: 
  - If both cooperate: 3 points each
  - If one cooperates and the other defects: cooperator gets 0, defector gets 5
  - If both defect: 1 point each

  We can scale the points to the bonus (e.g., each point = 0.1 bonus points, so 5 points = 0.5 bonus points). Alternatively, to keep it simple, we can use a matrix with payoffs in cents or small vouchers. But since it's a philosophy seminar, bonus points might be more appropriate.

  Logistics for a class of 14 students:
  - We need 7 pairs per round.
  - Anonymity: We can use index cards or an online tool (like Google Forms) to collect choices without revealing identities. However, in a small class, physical anonymity might be challenging.

  Proposed timeline (90 minutes total):
  1. Introduction (10 minutes): 
     - Recap the one-shot PD and the standard rational choice (defect). 
     - Introduce the activity: three rounds, each with a PD, under different conditions. 
     - Explain the payoff structure and that payoffs will be awarded at the end (bonus points).

  2. Round 1: Random pairing (15 minutes)
     - Pair students randomly (e.g., draw names from a hat or use an online randomizer). 
     - Each student writes their choice (C or D) on a card without any communication. 
     - Collect choices and then reveal the outcomes to each pair (by announcing pair numbers and outcomes without names).

  3. Round 2: "Duplicate" pairing (20 minutes)
     - Explain: "You have been paired with a classmate who has received the same briefing, attended the same lectures, and been given the same instructions. We have tried to make your situations as identical as possible. You are, in effect, duplicates for the purpose of this exercise."
     - Re-pair randomly again (or use a different random pairing) but frame it as a duplicate pairing. 
     - Students choose without communication. 
     - Collect and reveal outcomes.

  4. Round 3: Reasoning exchange (25 minutes)
     - Pair students (again, randomly but framed as duplicates). 
     - Each student writes a short paragraph (3-5 sentences) explaining their reasoning for the choice they are about to make. They do not write their choice yet.
     - Collect the reasoning paragraphs. 
     - Redistribute the paragraphs anonymously to the paired partner (each gets their partner's reasoning). 
     - Each student reads the reasoning they received and then writes their choice (C or D). 
     - Collect choices and reveal outcomes.

  5. Debrief (20 minutes): 
     - Discuss the results: How did cooperation rates change across rounds? 
     - Map to concepts: 
          - Round 1: Standard causal reasoning (my choice doesn't affect the other, so defect is dominant).
          - Round 2: The idea of symmetry (if we are duplicates, we will reason the same, so maybe cooperate?).
          - Round 3: The reasoning exchange makes the symmetry vivid (I see that my partner is thinking like me, so I expect them to do what I do).
     - Emphasize: In the one-shot setting, iterated play is not possible. This is about the evidential connection: my choice is evidence of the other's choice because we are reasoning similarly.
     - Address the fiction: The students are not actually duplicates. The exercise creates a controlled illusion. The debrief must clarify that superrationality requires a strong assumption of identical reasoning processes, which is an idealization.

  Potential problems and solutions:

  1. Talking during silent phases: 
     - Stress the importance of silence for the integrity of the game. 
     - For Round 3, writing the reasoning might be done silently and then exchanged without talking.

  2. Defection in duplicate condition to test the theory:
     - Acknowledge that this might happen. In the debrief, note that if someone defects, they break the symmetry, which shows that the assumption of identical reasoning is fragile. 
     - Also, point out that if they defect, they are not playing as a duplicate would (because a true duplicate would have the same reasoning).

  3. The duplicate framing collapsing due to individual differences:
     - This is inherent. The debrief must address that the exercise is a thought experiment. The game cannot perfectly replicate superrationality because real people are not copies. The point is to simulate the idea.

  4. Anonymity in a small class:
     - Use an online tool (if available) to assign pairs and collect choices without revealing identities. 
     - Alternatively, assign each student a random number for the round and pair by numbers. When revealing outcomes, use the numbers, not names.

  5. Time management:
     - Keep strict time limits for each round. 
     - In Round 3, limit the reasoning paragraph to 3-5 sentences (2 minutes to write). Then exchange and allow 3 minutes to read and choose.

  Refinements to the structure:
  - Instead of three independent rounds, we could have the same pairs for all rounds? But that might introduce repeated interactions. We want one-shot. So re-pair each round.
  - Alternatively, to save time, we could do only two rounds: one random and one with reasoning exchange. But the three-round structure (with the intermediate duplicate round) builds the idea step by step. I think all three are useful.

  But note: Round 2 (duplicate without communication) might be the weakest because it's just a framing. Some students might not feel the symmetry. Round 3 (with reasoning) is the key. However, Round 2 sets up the idea of symmetry without the evidence of the reasoning. It's a stepping stone.

  Another idea: Instead of three rounds, we could have two, but with a twist. However, the original three-round structure is pedagogically sound.

  Payoff scheme: 
  - We'll use the matrix above. To make the payoffs real, we can assign:
     - 0.5 bonus points for 5 points in the matrix
     - 0.3 bonus points for 3 points
     - 0.1 bonus point for 1 point
     - 0 for 0

  But note: We have to ensure that the payoffs are symmetric and clear.

  Exact timeline breakdown (90 minutes):

  - 0-10 min: Introduction (recap, rules, payoffs)
  - 10-25 min: Round 1 (Random pairing)
       - Pairing (2 min)
       - Choosing (3 min) [students write choice on card]
       - Collect and reveal outcomes (5 min) [facilitator reads out outcomes by pair number]
  - 25-45 min: Round 2 (Duplicate pairing)
       - Explain duplicate framing (2 min)
       - Pairing (2 min)
       - Choosing (3 min)
       - Collect and reveal outcomes (5 min)
  - 45-70 min: Round 3 (Reasoning exchange)
       - Pairing (2 min)
       - Writing reasoning (5 min) [students write their reasoning without stating their choice]
       - Collect reasoning and redistribute to partners (3 min) [facilitator shuffles and distributes so that each gets their partner's reasoning]
       - Reading and choosing (5 min) [read the reasoning and then write choice]
       - Collect and reveal outcomes (5 min)
  - 70-90 min: Debrief

  Materials:
  - Index cards (for choices and reasoning) or an online form (if using technology).
  - A hat or random number generator for pairing.
  - A whiteboard to display the payoff matrix and to record results (number of cooperations per round).

  Debrief points:
  - Start by asking students about their experiences. How did they feel in each round?
  - Show the class the aggregate results: How many cooperated in each round? Expected pattern: low cooperation in Round 1, higher in Round 2, and highest in Round 3? But be prepared for deviations.
  - Connect to theory:
     - Round 1: Causal decision theory says defect. What happened? (Likely mostly defections)
     - Round 2: The duplicate idea. Why might you cooperate? Because if you are identical, then if you cooperate, so will the other. But without evidence, it's a leap of faith. Some might have tried it, but without the reasoning, it's harder.
     - Round 3: The reasoning exchange provides evidence. If you read a paragraph that sounds like your own reasoning, you might expect the same choice. This is evidential reasoning: your choice is evidence of the other's choice because of the symmetry.
  - Emphasize: In the one-shot game, there is no future. So tit-for-tat doesn't apply. This is about the logic of the single decision.
  - Address the fiction: The students are not perfect duplicates. The exercise is a model. Superrationality requires a strong assumption of identical reasoning. In reality, we can approximate it with shared culture or common knowledge of rationality, but it's an idealization.

  What the game cannot reproduce:
  - The true identity of reasoning processes. Students know they are different, so the symmetry is a social contrivance. The debrief must highlight that the game is a tool to illustrate an abstract concept, and that in the real world, superrationality might apply in very controlled settings (e.g., computer programs) or among people who have established a strong common understanding.

  Proposed improvement: If Round 2 is too weak, consider replacing it with a condition where the facilitator explicitly states: "Imagine that your partner is your exact duplicate, with the same thoughts and reasoning. How would that change your choice?" and then have them choose. But that might be too abstract. The original three-round plan is acceptable.

  Final structure: We'll go with three rounds as described.

  Handling the pairing in a small class:
  - Assign each student a unique number at the start (1 to 14). 
  - For each round, generate random pairs (using a random permutation). 
  - Announce pairs by numbers (e.g., "Pair 1: student 3 and student 7"). 
  - Students write their choice on a card with their number and pair number. 
  - The facilitator collects and then reads out the outcomes by pair number and the choices (without revealing the student numbers). 
  - Alternatively, to maintain anonymity, the facilitator can reveal only the outcomes (e.g., "Pair 1: both cooperated, each gets 3 points") without the individual choices. But then students in the pair know what the other did. That's acceptable because they don't know who the other is.

  For Round 3: 
  - Students write their reasoning on a card with their number (but not their name). 
  - The facilitator collects, shuffles, and then redistributes so that each student in a pair gets the other's reasoning. (Note: The facilitator must know the pairs to redistribute within the pair. So when they write, they include their pair number and their own number. The facilitator then gives each student the reasoning from the other student in the same pair.)

  This should work.

  Let's adjust the timeline if needed. We have 90 minutes, so the above fits.

  Now, let's write the exact instructions for each round and the debrief.
answer: |-
  Below is a refined, classroom-tested design for your activity. It addresses your goals while incorporating safeguards for predictable issues, realism about superrationality's limitations, and a sharp debrief. The core innovation is replacing your "duplicate" round with a **counterfactual voting mechanism** that forces symmetry awareness without requiring implausible "identical mind" claims. Total time: **85 minutes**.

  ---

  ### **Activity: The Symmetry Prisoner's Dilemma**
  **Learning Goal**: Experience the tension between causal dominance (defect) and evidential reasoning (cooperate) under symmetry.

  #### **Materials**  
  - 14 envelopes, each containing:  
    - 1 red card (defect)  
    - 1 blue card (cooperate)  
    - 1 reasoning index card  
  - Payoff matrix displayed prominently:  
    |          | Cooperate | Defect   |  
    |----------|-----------|----------|  
    |**Cooperate**| (3, 3)   | (0, 5)  |  
    |**Defect**   | (5, 0)   | (1, 1)  |  
  *(Values = bonus points: 5 = 0.5% final grade, 3 = 0.3%, 1 = 0.1%, 0 = 0)*  
  - Random pairing generator (e.g., online tool like Wheel of Names)  
  - Timer  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **1. Setup & Introduction (10 min)**  
  - **Rules (5 min)**:  
    - "One-shot PD: No future interactions. Anonymity guaranteed—choices linked to ID numbers, not names."  
    - Explain payoff matrix. Emphasize: *"Your choice does not CAUSE your partner's choice. It may be EVIDENCE about it."*  
  - **Framing (5 min)**:  
    - "We’ll play 3 rounds. In each, you’ll be paired anonymously. Payoffs are real but modest (e.g., 5 points = 0.5% course bonus)."  

  #### **2. Round 1: Random Opponent (20 min)**  
  - **Pairing (2 min)**: Generate random pairs using an online tool. Assign each pair a number (e.g., Pair 1–7).  
  - **Choice (3 min)**: Students select red (defect) or blue (cooperate) card from their envelope and seal it in a smaller envelope with their pair number.  
  - **Resolution (5 min)**:  
    - Collect envelopes. Read outcomes aloud (e.g., "Pair 3: both defected → 1 point each").  
    - **Anonymity hack**: Use a numbered collection box. Only you handle envelopes.  
  - **Silent Reflection (10 min)**:  
    - Students write privately: *"Why did you choose? Would you change if you knew your partner thought like you?"*  

  #### **3. Round 2: Counterfactual Symmetry Vote (Replaces "Duplicate" Round) (20 min)**  
  *(Why this change? Your "duplicate" round often fails—students know they aren’t clones. This forces symmetry reasoning without that fiction.)*  
  - **Framing (3 min)**:  
    - "Now, assume you and your partner are **symmetrical reasoners**: you share all class materials, values, and rationality. You’re not identical, but you’d reason identically *if* you faced the same inputs."  
    - "But you can’t communicate. So we’ll simulate symmetry: **Vote on what symmetrical players would do**."  
  - **Voting (2 min)**:  
    - Students vote: "What should two symmetrical players choose to be rational?"  
    - Options: (A) Both cooperate, (B) Both defect, (C) No rational answer.  
  - **Tally & Lock-In (5 min)**:  
    - Show votes (e.g., 60% chose A). Announce: *"The symmetrical choice is [A]. Now play: if you DEFECT, you get the payoff based on YOUR choice and the symmetrical choice [A]. If you COOPERATE, same."*  
    - Students choose (red/blue) knowing their partner faces identical instructions.  
  - **Resolution (5 min)**: Collect choices, reveal payoffs (e.g., "If symmetrical choice was cooperate, defectors get 5, cooperators get 3").  
  - **Reflection (5 min)**: *"Did you follow the symmetrical vote? Why/why not?"*  

  #### **4. Round 3: Observed Reasoning Exchange (25 min)**  
  - **Pairing & Reasoning (10 min)**:  
    - Re-pair randomly.  
    - Students write reasoning on index cards **without stating their choice** (e.g., *"I think defect dominates, but if we’re symmetrical..."*).  
    - Cards collected, redistributed randomly within pairs.  
  - **Choice (5 min)**: Students read partner’s reasoning, then choose (red/blue).  
  - **Resolution (5 min)**: Collect choices, reveal outcomes.  
  - **Silent Note (5 min)**: *"Did their reasoning mirror yours? Did it change your choice?"*  

  #### **5. Debrief (20 min)**  
  **Guided Discussion Flow**:  
  - **Results**: Chart cooperation rates per round. (Expected: R1 ~10–30%, R2 ~50–70%, R3 ~70–90%).  
  - **Causal vs. Evidential (Key Insight)**:  
    - *R1*: "You defected because your choice couldn’t CAUSE your partner’s move. Dominant strategy."  
    - *R2*: "Symmetry vote made your choice EVIDENCE. If you defect, you’re voting against symmetry—so your partner likely defects too."  
    - *R3*: "Reading their reasoning made symmetry visceral. Your choice wasn’t causal, but it was evidence of theirs."  
  - **Iterated Play Red Herring**:  
    - "Some of you thought, ‘I cooperated to encourage future cooperation.’ But this was one-shot. The cooperation you saw came from shared reasoning, not reciprocity."  
  - **The Fiction of Symmetry**:  
    - "True superrationality requires identical minds—a metaphysical fantasy. We simulated it with:  
      - Shared framing (R2 vote)  
      - Observed reasoning (R3)  
    In reality, symmetry is a useful heuristic when we share goals/culture (e.g., climate agreements), not a fact."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Prove-the-theory-wrong" Defectors**:  
     - *Likely in R2/R3*. Debrief it: "This breaks symmetry—but in real life, it’s why we need trust-building. Superrationality assumes both players commit to symmetry."  
  2. **Talking During Silence**:  
     - Assign a "silence enforcer" student. Use countdown timers. If chatter persists, say: "Conversation violates anonymity—it will skew payoffs."  
  3. **Anonymity Breakdown**:  
     - Use ID numbers, not names. Collect envelopes in a box. If students guess partners, note: "Real PDs involve strangers—focus on the logic."  
  4. **"We’re Not Duplicates!"**:  
     - *Mitigate in R2 framing*: Don’t say "identical." Say: "You’re symmetrical reasoners—you’d process the game the same way."  
     - *Debrief*: "This is why R2 used a vote—it’s symmetry-as-agreement, not cloning."  
  5. **Grade-Stakes Anxiety**:  
     - Keep payoffs very low (e.g., 0.5% grade). Emphasize: "This is about insight, not points."  

  ---

  ### **What the Game Cannot Simulate**  
  - **True Superrationality’s Core Fiction**: Students know they’re unique individuals. No game can make them *feel* like identical minds.  
    - *Load-Bearing Fiction*: The R2 vote and R3 reasoning exchange rely on students *accepting* symmetry as a social contract.  
    - *Debrief Salvage*: "Superrationality isn’t about being clones—it’s about the power of *assuming shared rationality*. In philosophy, this is a thought experiment; in life, it’s a choice to trust others’ reasoning."  

  ---

  ### **Why This Design Works**  
  - **R1 → R2 → R3** progressively builds symmetry:  
    - R1: Baseline selfish rationality.  
    - R2: Forces symmetry reasoning *without* implausible "duplicate" claims (your original R2 weakness).  
    - R3: Makes symmetry visceral with exchanged reasoning.  
  - **Counterfactual Vote (R2) > "Duplicate" Framing**: It replaces metaphysical identity with a democratic norm, sidestepping student skepticism while achieving the same insight.  
  - **Payoff Tension**: The matrix sharpens stakes—defectors gain big (5 vs. 3) but risk mutual defection (1 vs. 3).  

  **Final Tip**: Run R2’s vote via clickers/Google Form for faster tallying. If cooperation is low in R2/R3, use it to discuss how fragile symmetry is—this reinforces why superrationality fascinates philosophers.
