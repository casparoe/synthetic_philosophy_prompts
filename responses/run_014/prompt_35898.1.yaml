        Without G: 
            You don't want A -> if you do A, you get no benefit and maybe a cost, say -C (if forced). But without G, you don't have I -> no loss from I.
            If you don't do A, then you don't get the benefit, but you avoid the cost? Actually, without G, you don't want A, so you wouldn't choose to do A unless forced by policy? But the policy is chosen before knowing G.

        With G:
            You want A -> if you do A, you get benefit B and you have I (loss L). So net: B - L.
            If you don't do A, you don't get B and you have I (loss L). So net: -L.

