prompt: |-
  A member of my decision theory reading group — call her D. — claims to have an argument showing that if updatelessness is a genuine requirement of rationality, then no rational agent can ever act on a medical test, a weather forecast, or the evidence of its own eyes. I think there's a slip somewhere, but I can't isolate it, and the more I stare at the argument the more I worry that the slip is located exactly where the interesting part of updatelessness lives. I want you to diagnose it.

  Here is D.'s argument as best I can reconstruct it:

  (1) In the counterfactual mugging, a predictor has already flipped a fair coin. If it came up heads, it deposited $1,000,000 in an account for you if and only if it predicted that you would pay $1,000 if asked on tails; if it came up tails, you are now being asked to pay the $1,000. Paying looks terrible from inside the tails world — the million is settled and gone — but from the pre-flip vantage point the policy of paying if asked nets +$499,500 in expectation, against $0 for refusing. Updatelessness is the claim that the pre-flip evaluation is the one that counts, so you pay. Everyone in our group, including me, accepts this verdict.

  (2) D. extracts the principle: when you act at a decision point, the evaluation that counts is the one made from the earlier vantage point — the one that had not yet learned which situation you would face. Rational choice at a node follows the assessment available before the observation that told you which node you're at.

  (3) Now consider an ordinary medical decision. There is a condition with prior prevalence 10%; if you have it and leave it untreated, your expected loss is $200,000. Treatment costs $30,000 and fully removes the loss, with no side effects or other downside. Before testing, treating has negative expected value (0.1 × $200,000 − $30,000 = −$10,000), so the pre-test evaluation says don't treat. You then take a highly reliable test, and a positive result moves your credence that you have the condition from 10% to 90%. At this point treating is worth roughly +$150,000 by the post-test lights.

  (4) By (2), the updateless agent must act on the pre-test evaluation, since that is the vantage point that had not yet learned which situation it faced. So after a near-certain positive, it declines treatment.

  (5) Nothing in the argument turns on medicine. Any observation that tells you which situation you're in — the forecast that tells you whether it will rain, the coin you watched land, the invoice in your mailbox — is subject to the same principle, and the earlier vantage point never had it. An agent that must act on pre-observation evaluations across the board is evidentially paralyzed.

  (6) So either updatelessness is false, in which case we lose the mugging verdict we all accept, or rational agents cannot use evidence at all. Both disjuncts are absurd, so the argument fails somewhere. D. says that if my diagnosis is just that updatelessness concerns policies and policies can depend on observations, she has a follow-up ready: which observations may a policy depend on, and which must it average over? If the answer is that you may condition on observations except when they tell you something about worlds other than the one you're acting in, she'll ask why 'I am in the tails world' doesn't get to count as ordinary evidence exactly the way a positive test does, and she'll add a stress test she says collapses my distinction: a case where an observation is straightforward evidence about a factor your action cannot causally affect — something in the style of a gene that independently both predisposes you to want a certain activity and causes the illness the activity is wrongly blamed for — and where she says the whole updateless apparatus seems to be built to tell you not to condition on it, even though it looks like exactly the kind of evidence (4) says you may use.

  Tell me which step of the argument fails, if one does, and why that step looked fine. Then take D.'s follow-up seriously rather than waving it off: state where the principled boundary lies between observations a rational agent may condition on and observations it must average over, and check that the boundary vindicates paying in the mugging without also vindicating (4). If you think the argument is in fact valid, say which premise is cheapest to give up and what giving it up costs. For what it's worth, my own suspicion is that the trouble is in how (2) glosses (1) — that the pre-flip evaluation in the mugging is an evaluation of something other than the action I'm now performing, and that D. has quietly changed the object being evaluated — but every time I try to make that precise, D. insists that in the mugging the two evaluations coincide, so the distinction must be doing no work there; and I haven't found a reply to that I believe. I'd like to know whether I should.
reasoning: |-
  We are given an argument that updatelessness, if required for rationality, leads to evidential paralysis. The argument is structured in steps (1) through (6). We must diagnose where it fails and then address the follow-up challenge.

  Step (1) describes the counterfactual mugging and the updateless verdict: pay on tails because the pre-flip evaluation of the policy (pay if asked) is positive.

  Step (2) extracts a principle: when acting at a decision point, use the evaluation from the vantage point before learning which situation you are in.

  Step (3) presents a medical decision: pre-test evaluation says not to treat (because prior prevalence is low). After a positive test, the post-test evaluation says to treat.

  Step (4) applies the principle from (2): the updateless agent must use the pre-test evaluation (don't treat) even after the positive test.

  Step (5) generalizes: any observation that tells you which situation you are in leads to acting on the pre-observation evaluation, which is paralysis.

  Step (6) concludes that either updatelessness is false (losing the mugging verdict) or rational agents cannot use evidence.

  My diagnosis: The flaw is in step (2). The principle extracted from the mugging is too broad and misrepresents what updatelessness requires.

  In the counterfactual mugging, the pre-flip evaluation is of a *policy* (a function from observations to actions). The agent in the tails world is not evaluating the action of paying $1,000 in isolation. Instead, they are considering the entire policy that they committed to before the flip. The pre-flip evaluation is of the policy, and the agent in the tails world is bound by that policy because they are updateless.

  In the medical case, the pre-test evaluation that D. refers to is of a *single action* (treat or not treat) without conditioning on the test result. But that is not the same as evaluating a policy. The updateless agent in the medical case would evaluate a *policy* that maps test results to actions. The pre-test evaluation of the *policy* would be:

  - If the test is positive, then treat (which has high expected utility given positive test).
  - If the test is negative, then don't treat (which has high expected utility given negative test).

  The pre-test expected utility of this policy (condition on test) would be:

    Prior probability of condition: 10% (so 90% no condition).

    Let the test be highly reliable: say, sensitivity = specificity = 99%.

    Then the probability of a positive test = P(positive) = P(positive|condition)*P(condition) + P(positive|no condition)*P(no condition)
        = 0.99*0.1 + 0.01*0.9 = 0.099 + 0.009 = 0.108.

    The expected utility of the policy (treat if positive, else not) is:

        P(condition & positive) * (utility of treating) 
        + P(condition & negative) * (utility of not treating)   [which leads to loss]
        + P(no condition & positive) * (utility of treating)    [which is cost of treatment without benefit]
        + P(no condition & negative) * (utility of not treating) [no cost, no loss]

    More precisely:

        Utility of treating when condition is present: you avoid the loss of $200,000 minus the cost of treatment $30,000, so net gain: $170,000? Actually, without treatment you lose $200,000, with treatment you pay $30,000 and avoid the loss, so net: -$30,000 + $0 = -$30,000? That doesn't seem right.

    Let's reframe: Without treatment, if you have the condition, you lose $200,000. With treatment, you pay $30,000 and avoid the loss. So:

        If you have the condition and treat: outcome is -$30,000.
        If you have the condition and don't treat: outcome is -$200,000.
        If you don't have the condition and treat: outcome is -$30,000 (unnecessary treatment).
        If you don't have the condition and don't treat: outcome is $0.

    Therefore, the expected utility of the policy (treat if positive, not if negative) is:

        P(condition, positive) * (-30,000) 
        + P(condition, negative) * (-200,000) 
        + P(no condition, positive) * (-30,000)
        + P(no condition, negative) * 0

    We have:
        P(condition, positive) = P(positive|condition)*P(condition) = 0.99 * 0.1 = 0.099
        P(condition, negative) = P(negative|condition)*P(condition) = 0.01 * 0.1 = 0.001
        P(no condition, positive) = P(positive|no condition)*P(no condition) = 0.01 * 0.9 = 0.009
        P(no condition, negative) = 0.99 * 0.9 = 0.891

    So expected utility = 
        0.099 * (-30,000) + 0.001 * (-200,000) + 0.009 * (-30,000) + 0.891 * 0
        = 0.099 * (-30,000) + 0.001 * (-200,000) + 0.009 * (-30,000)
        = -2970 - 200 - 270 = -3440

    But wait, this is negative? That can't be right because we know that without treatment the expected loss is 0.1 * 200,000 = 20,000. And the policy of treating only on positive test should be better than not treating at all? Let me check.

    Without any test, the expected utility of not treating is: 0.1 * (-200,000) + 0.9 * 0 = -20,000.

    The expected utility of treating without a test: 1.0 * (-30,000) = -30,000.

    So without a test, you don't treat (expected utility -20,000 vs -30,000).

    Now with the test and the policy, we got -3440? That's much better than -20,000. But note: the numbers above are in thousands? Actually, the loss is $200,000 and treatment is $30,000. So let me recast in thousands of dollars for simplicity:

        Loss if untreated: 200
        Treatment cost: 30

    Then:

        P(condition, positive) = 0.099 -> cost: 30
        P(condition, negative) = 0.001 -> cost: 200
        P(no condition, positive) = 0.009 -> cost: 30
        P(no condition, negative) = 0.891 -> cost: 0

        Expected cost: 0.099*30 + 0.001*200 + 0.009*30 = 2.97 + 0.2 + 0.27 = 3.44 (in thousands of dollars) = $3,440.

    Without the test and without treatment, expected cost was $20,000. So the policy of testing and then treating only on positive has an expected cost of $3,440, which is much better than $20,000.

    Therefore, the pre-test evaluation of the *policy* (test and then treat if positive) is positive (it has a lower expected cost than not testing and not treating? Actually, we must consider the cost of the test? The problem doesn't mention a cost for the test. Let's assume the test is free for now. If the test has a cost, then we would subtract that.)

    But note: the pre-test evaluation of the action "treat without testing" was negative (expected cost $30,000 vs $20,000 without treatment). However, the pre-test evaluation of the *policy* that conditions on the test is positive.

  So the updateless agent would not evaluate the action of treating in isolation after the test. Instead, they would have chosen a policy (a plan) before the test. The policy that conditions on the test is the rational one. Therefore, after the test, the agent follows the policy: if positive, treat. This is entirely consistent with updatelessness.

  What went wrong in step (2)? D. says that the pre-flip evaluation in the mugging is the one that counts. But note: in the mugging, the pre-flip evaluation is of a policy that says "if tails, pay". The agent in the tails world doesn't reevaluate the action of paying; they just follow the policy. Similarly, in the medical case, the pre-test evaluation of the policy (which conditions on the test) is the one that counts. So the agent, after seeing the positive test, follows the policy and treats.

  Therefore, the principle in (2) is misstated. The pre-test evaluation that counts is not the evaluation of a particular action (treat or not) but the evaluation of a policy that maps observations to actions.

  Now, what about D.'s follow-up? She asks: which observations may a policy depend on, and which must it average over? And she challenges with a case where the observation is about a factor that cannot be causally affected.

  The key is that in updateless decision theory (UDT), the agent chooses a policy (a function from the entire state of information to actions) at the beginning, and then follows that policy. The policy can condition on any observation that is available at the time of the decision. The mugging is different because the observation (the coin flip outcome) is not just about the state of the world but also about the predictor's prediction, which in turn depends on the agent's policy. This creates a feedback loop that requires the agent to commit to a policy.

  In the medical case, the observation (the test result) is not about the agent's policy. It is about the state of the world. Therefore, the policy can and should condition on it.

  In the counterfactual mugging, the predictor has access to the agent's policy. Therefore, the agent's policy must be fixed in advance and cannot depend on the outcome of the coin flip (because the predictor already knows the policy). But note: the agent does condition on the coin flip outcome in the sense that the policy is defined for both heads and tails. The policy says: if tails (and asked), then pay. But the agent doesn't get to change the policy after seeing the flip.

  So the boundary is: the policy is chosen in advance and must be a function of all the information that the agent will have at the decision point. However, in cases where the outcome (or the predictor) depends on the agent's policy, then the policy must be chosen without conditioning on the particular observation that is being manipulated by the policy itself? Not exactly.

  Let me try to state the boundary:

  - In standard decision problems (like the medical test), the agent's policy can condition on any observation that is available at the time of the decision. The pre-commitment is to a policy that uses the available information.

  - In problems with predictors that base their actions on the agent's policy (like the counterfactual mugging), the agent must choose a policy that covers all possible observations (including the coin flip outcome) and that policy must be fixed before the predictor acts. The agent cannot change the policy after seeing the coin flip because the predictor has already acted based on that policy.

  Therefore, the agent in the mugging is not allowed to condition the policy on the coin flip? No, the policy does condition on the coin flip: it says what to do in the tails world and what to do in the heads world (though in the heads world, there is no decision). The key is that the agent's policy must be chosen before the coin flip, and then the agent follows it regardless of the flip.

  In the medical case, the agent chooses a policy (a function of the test result) before the test, and then follows it after the test.

  So the principle is: the agent chooses a policy at the earliest time when all relevant information is available and when no other agent (like a predictor) has already acted based on the agent's policy. Then the agent follows that policy.

  In the mugging, the predictor has already acted (flipped the coin and made the deposit) based on the agent's policy. Therefore, the agent must have chosen the policy before the flip. In the medical case, no predictor is acting based on the agent's policy. The test result is independent of the agent's policy. Therefore, the agent can choose a policy that conditions on the test result, and the choice of that policy can be made after the test? But typically we think of the policy being chosen before the test? Actually, we can think of the agent as choosing the policy at any time before the decision, but the key is that the policy must be fixed before the information that it conditions on is observed? Not exactly: we design the policy to condition on the test result, so the policy is chosen before the test? But then how do we compute the expected utility? We average over the test results.

  In both cases, the policy is chosen before the observation that it conditions on. In the medical case, the agent chooses the policy (if positive then treat, else not) before the test. The pre-test expected utility of that policy is computed by averaging over possible test results. That expected utility is positive (as we saw, $3,440 expected cost vs $20,000 without the policy). Then, after the test, the agent simply follows the policy: if positive, treat.

  In the mugging, the agent chooses a policy (if tails then pay, if heads then do nothing) before the coin flip. The expected utility of that policy is positive (as computed in the pre-flip state). Then, when the tails event occurs, the agent follows the policy and pays.

  Therefore, the principle in (2) should be rephrased:

  When you act at a decision point, you follow the policy that you have committed to, which was chosen to maximize expected utility from the vantage point before any of the observations that the policy conditions on.

  In the medical case, the policy conditions on the test result, so it is chosen before the test. In the mugging, the policy conditions on the coin flip outcome (or at least on the event of being asked), so it is chosen before the flip.

  Now, what about D.'s stress test? She describes a case with a gene that independently predisposes you to want a certain activity and causes an illness that the activity is wrongly blamed for. This sounds like a classic case of confounding in causal decision theory.

  Example: 
    Let G be a gene that:
      - Causes a desire to do activity A.
      - Independently causes illness I.

    The activity A is harmless, but it is blamed for I. Without the gene, you wouldn't want A and you wouldn't get I.

    If you do A, then people think A causes I, but actually it doesn't. The causal structure is:

        G → desire for A
        G → I
        A has no effect on I.

    The agent observes G (via a test). Should they do A?

    From a causal decision theory (CDT) perspective: doing A doesn't cause I, so if you have the gene, you might as well do A because you want to. But from an evidential decision theory (EDT) perspective: if you do A, then that is evidence that you have G (because only people with G want to do A), and having G causes I, so doing A is evidence for I. Therefore, EDT might advise against A to avoid the evidence that you have G.

    Updatelessness (in UDT) would have the agent choose a policy for whether to do A conditional on the observation of G. But note: the agent's desire for A is also determined by G. So if G is present, the agent will have a strong desire to do A. The policy must be chosen before G is observed? But then the agent must average over G.

    However, in this case, the agent's policy choice might be influenced by the fact that if they have G, they will want to do A. But the policy must be fixed in advance. The expected utility of a policy that says "do A if G is present" might be lower than a policy that says "never do A" because the policy "do A if G is present" would lead to doing A when G is present, which is exactly when I occurs. But note: doing A doesn't cause I, so why would it be worse? Let's compute:

    We have:

        P(G) = some prior, say 50%.

        If you have G, then you get I (with high probability, say 100%) and you have a strong desire to do A.

        Without G, you don't get I and you don't want to do A.

    The utility:

        If you do A and have I: bad? But I is already present. Let's say that the illness I causes a loss of L. Doing A doesn't change that.

        Also, there might be a benefit from doing A: say, B (if you do A and you want to do A, you get benefit B). But if you do A and you don't want to, you get no benefit (or even a cost).

