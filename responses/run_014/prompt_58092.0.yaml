  Below is a decision tree designed to sort respondents into coherent positions on contested public commemorations. It consists of six yes-or-no questions grounded in philosophical commitments, formulated in ordinary language, and tested against the three stipulated cases. The tree begins from the shared premise that a city must decide the fate of an object some residents find wrongful.

  ### Decision Tree
  1. **Should the decision be guided solely by whether the object was lawfully created and maintained?**  
     (If no → Q2; If yes → Q3)  

  2. **Does the object's current public display inherently express official approval of the wrongful aspect?**  
     (If no → Q4; If yes → Q5)  

  3. **Does the object’s unlawful origin or status outweigh its current value to the community?**  
     (If no → Q6; If yes → Q5)  

  4. **Can the object cause significant harm (e.g., emotional distress, social division) even without implying official approval?**  
     (If no → Terminal A; If yes → Q5)  

  5. **Can adding context (e.g., explanatory plaques, counter-monuments) at the site adequately address the problem?**  
     (If no → Q6; If yes → Terminal B)  

  6. **Would relocating the object to a museum or educational space resolve the core issue?**  
     (If yes → Terminal C; If no → Terminal D)  

  ### Terminal Positions
  - **A. Preservationism (Historical Record):** Retain the object unchanged as an irreplaceable historical record.  
    *Hardest commitment: Accepting that preserving history may perpetuate public pain.*  
  - **B. Retention with Contextualization:** Keep the object in place but add critical context to reframe its meaning.  
    *Hardest commitment: Believing contextualization can neutralize harm/endorsement when symbolism is entrenched.*  
  - **C. Relocation to Museum:** Move the object to a curated setting for educational purposes.  
    *Hardest commitment: Asserting that deconsecrating a public tribute does not erase its historical value.*  
  - **D. Removalism (Endorsement/Harm Grounds):** Remove the object to repudiate endorsement or prevent harm.  
    *Hardest commitment: Endorsing the erasure of history to uphold moral consistency.*  
  - **E. Procedural Authorization:** Let a fair democratic process decide the outcome, regardless of substance.  
    *Hardest commitment: Tolerating substantively unjust outcomes if procedurally legitimate.*  
  - **F. Preservationism Despite Harm:** Retain the object unaltered due to overwhelming artistic/historical value, even if harmful.  
    *Hardest commitment: Prioritizing cultural heritage over contemporary moral sensibilities.*  

  ### Tested Against Stipulated Cases
  - **City Founder Statue (Massacre):**  
    - Path: Q1=No → Q2=Yes (endorses massacre) → Q5=No (context insufficient) → Q6=Yes/No → **C or D**.  
  - **Novelist Street Name (Dehumanizing Letters):**  
    - Path: Q1=No → Q2=No (street name ≠ endorsement) → Q4=Yes (harm from letters) → Q5=Yes → **B**.  
  - **Dissident Mural (Unlawful but Cherished):**  
    - Path: Q1=Yes → Q3=No (community value outweighs illegality) → **A**; or Q3=Yes → **D**.  

  ### Unoccupied Position & Ambiguities
  - **Unoccupied Position:** Q1=No → Q2=No → Q4=No → **A** (Preservationism).  
    *Why unoccupied?* If an object causes no harm/endorsement, retaining it is uncontroversial. Yet real-world cases involve contestation *because* harm/endorsement is alleged. Thus, this path rarely applies, making "pure" preservationism theoretical.  

  - **Ambiguous Pair:** **Retention with Contextualization (B)** and **Relocation to Museum (C)**.  
    *Why ambiguous?* Whether contextualization "adequately addresses the problem" (Q5) is subjective. A respondent might reject contextualization at the original site (Q5=No) but accept it in a museum (Q6=Yes), blurring the line between B and C. The tree prioritizes site-specific solutions but cannot resolve if "adequate context" depends on relocation.  

  This tree captures core philosophical divides while accommodating the cases. It reveals how commitments to historical integrity, harm prevention, and democratic authority shape solutions—even when policy preferences overlap.
