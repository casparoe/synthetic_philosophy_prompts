answer: |-
  ### Nearest concepts and where they miss
  The problem you describe flirts with **moral luck** (where moral judgment depends on uncontrollable outcomes), **survivorship bias** (focusing only on successes while ignoring identical failures), and **hindsight bias** (viewing past events as predictably leading to known outcomes). Moral luck addresses how *judgment* of a person’s character is altered by results, but not how *biography itself* constructs virtue narratives retroactively. Survivorship bias explains the *selection* of subjects but not the *reinterpretation of their traits* based on outcomes. Hindsight bias captures the illusion of inevitability in narratives but doesn’t directly confront how biographies manufacture moral lessons by subordinating traits to endings. All three concepts describe mechanisms *within* your problem but fail to name the core issue: the **hermeneutic circularity** where the ending dictates the moral framing of the entire life, rendering the "lesson" contingent on success rather than inherent virtue.

  ### A name and definition, or why none fits
  The precise concept is **teleological moralization**: the practice of assigning moral valence to actions, traits, or decisions based *solely* on their contribution to a known (usually successful) outcome, thereby deriving a "lesson" that is retroactively imposed rather than immanently discovered. No single established term fully captures this. "Teleological" denotes purpose-driven interpretation; "moralization" underscores the imposition of ethical meaning. It’s distinct because it specifically targets the *biographical mechanism* where virtue/vice labels are functions of the endpoint. Moral luck focuses on *evaluation*, not narrative construction. Hindsight bias is cognitive, not ethical. Survivorship bias is about sample selection, not textual hermeneutics. Teleological moralization explains why the *same trait* in matched pairs yields contradictory lessons: the outcome, not the trait, is the real moral engine.

  ### Boundary cases
  Ambiguous endings exacerbate teleological moralization but don’t escape it. Consider **Robert Oppenheimer**: his early brilliance is framed as heroic (solving the atomic puzzle), while his later opposition to the H-bomb is read as tragic flaw or moral courage, depending on the biographer’s weighting of his "end" (political ruin vs. principled legacy). **Galileo**'s defiance is heroic perseverance if the endpoint is the Church’s eventual apology, but reckless stubbornness if the endpoint is his silencing. Even in failure, **Vincent van Gogh**’s suffering is moralized as redemptive sacrifice for art only *because* posthumous triumph validates it. Lives ending in unresolved contradiction (e.g., **Alan Turing**) become Rorschach tests: interpreters project lessons by selectively emphasizing phases that align with their preferred ethical conclusion (e.g., persecution vs. triumph of legacy), proving the endpoint (even if contested) still drives the moral framing.

  ### Verdict on the biographical method
  **The biographical method, as traditionally practiced, does not survive this problem intact for teaching ethics.** Plutarch’s approach fundamentally relies on teleological moralization, mistaking narrative coherence for moral truth. Using uncritical hero-hagiographies risks teaching associates to conflate success with virtue and failure with vice, reinforcing outcome bias and moral luck. However, the method *can* be salvaged under strict conditions:  
  1.  **Pair rigorously**: Always present matched successes/failures (e.g., two stubborn visionaries—one "proven right," one "disastrously wrong") to expose teleological moralization.  
  2.  **Focus on process, not endpoints**: Analyze decisions *in medias res*, with contemporary evidence, asking "What principles guided this choice *before* the outcome?"  
  3.  **Embrace ambiguity**: Use unresolved lives to discuss how ethical judgment operates under uncertainty, forcing engagement with context and values beyond results.  
  4.  **Expose the scaffolding**: Teach biographies *as constructed narratives*, examining how authors select and frame events to serve a moral thesis.  

  **Commitment**: Teach biographies not as vessels of pre-packaged virtue, but as case studies in the *pitfalls of ethical reasoning itself*. The goal shifts from imitation to critical discernment—showing how easily we moralize retrospectively, and how to resist it. This transforms the problem into the lesson: ethics resides in choices made in fog, not endings written in light.
