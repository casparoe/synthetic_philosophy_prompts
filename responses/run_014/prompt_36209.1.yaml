  ### Transformative Choice Decision Tree  
  **Premise:** You face a life-altering choice that will fundamentally change what you value (e.g., parenthood, emigration, religious vows, irreversible medical treatment). This tree maps routes to rational decision-making. Answer each question honestly—no philosophy background needed.  

  ---

  #### **The Tree**  
  1. **Can you vividly imagine daily life after the choice, including how you’d feel and what you’d value?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Would this choice alter your core values (e.g., freedom, purpose, relationships)?**  
     - **Yes** → Go to 4.  
     - **No** → **Leaf A: Forecast Consequentialism**  
       *Weigh imagined outcomes using your current values. Rational if no value shift.*  

  3. **Can you judge the outcome’s goodness/badness by your *current* values?**  
     - **Yes** → **Leaf B: Value Projection**  
       *Decide based on current values, ignoring experience gaps. Rational if values stay relevant.*  
     - **No** → Go to 5.  

  4. **Do you see the value shift as an improvement?**  
     - **Yes** → **Leaf C: Prospective Endorsement**  
       *Choose expecting future-you to approve. Rational if you back the change.*  
     - **No** → **Leaf D: Dissonant Transformation**  
       *Unnamed: You expect values to change for the worse. Deeply problematic—no consensus on rational path.*  

  5. **Can you estimate odds of satisfaction (e.g., 70% chance you’ll adapt well)?**  
     - **Yes** → **Leaf E: Decision Under Risk**  
       *Calculate expected gains/losses via probabilities. Rational under uncertainty.*  
     - **No** → **Leaf F: Authentic Revelation**  
       *Choose what feels true to your identity or "calling." Rational as self-discovery.*  

  ---

  #### **Key Properties & Limitations**  
  - **Covered distinctions:**  
    - (a) Epistemic access (Q1), (b) Value projection (Q3), (c) Evaluative standpoint (Q4), (d) Alternate routes (Q3–Q5).  
  - **Unseparated leaves:**  
    - *Authentic Revelation (F)* blends virtue, authenticity, and revelation views—no tree split.  
    - *Dissonant Transformation (D)* and *Authentic Revelation (F)* may overlap if identity resolves dissonance (undefended).  
  - **Diagnosed leaves:**  
    - **Dissonant Transformation (D):** Unnamed. *Diagnosis: Incoherent if future-you approves but current-you revolts; philosophers debate if this case exists.*  
    - **Value Projection (B):** Deflationary in disguise. *Projects stability where change might lurk.*  

  ---

  ### Notes for the Novelist  
  Apply this tree to your characters. For each:  
  - **Pregnant Woman (carry to term?):** Routes to **Value Projection (B)** if she leans on current values (e.g., "Family matters"), **Decision Under Risk (E)** if she estimates odds of fulfillment, or **Authentic Revelation (F)** if she intuits motherhood as her "true self." *The tree’s questions are her dramatic problem*—she cannot answer Q1 or Q3 reliably, forcing her toward Q5/F (the leap).  
  - **Seminarian (final vows?):** Likely **Prospective Endorsement (C)**—he can imagine monastic life (Q1: Yes), expects value shifts (Q2: Yes), and endorses them (Q4: Yes). But if he doubts the shift (Q4: No), **Dissonant Transformation (D)** traps him: he fears losing his old self.  
  - **Pianist (life-saving treatment?):** Heads to **Decision Under Risk (E)** or **Authentic Revelation (F)**. She can’t imagine life without music (Q1: No) and may reject valuing longevity over art (Q3: No). If she can’t assign odds to her future satisfaction (Q5: No), F becomes her only "rational" path—choosing who she wants to be.  

  **Dramatic Core:** The pregnant woman’s struggle *is* the tree. Her inability to answer Q1 (imagination) or Q3 (value projection) mirrors her paralysis. The tree’s branching forces her to confront Q5 (risk) or Q5’s failure (revelation)—the climax of her arc.  

  ---

  **Tree Summary**  
  | Leaf                     | Core Idea                                  | Traditional Label                  |  
  |--------------------------|--------------------------------------------|------------------------------------|  
  | **A: Forecast Consequentialism** | Imagine and weigh outcomes          | Naive consequentialism             |  
  | **B: Value Projection**          | Judge by current values             | Deflationary (ordinary projection) |  
  | **C: Prospective Endorsement**   | Back the future self’s values       | Endorsement view                   |  
  | **D: Dissonant Transformation**  | Unwanted value shift—no resolution  | Unnamed (problematic)              |  
  | **E: Decision Under Risk**       | Bet on probabilistic outcomes       | Credence-based view                |  
  | **F: Authentic Revelation**      | Heed identity or intuition          | Virtue/revelation synthesis        |  

  Pin this above your desk. It distills the philosophy into actionable human dilemmas—your characters’ choices remade here.
