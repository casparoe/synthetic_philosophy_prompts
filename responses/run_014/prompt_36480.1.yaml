answer: |-
  Based on your requirements, I've designed a classroom game called **The Credential Game** that simulates costly signaling with minimal materials, tight timing, and concrete incentives. Below is the complete design, including a rationale for rejecting alternative concepts, a minute-by-minute timeline, payoff tables, debriefing guide, and notes on limitations.

  ---

  ### **Why This Design? Rejected Alternatives**
  1. **Predator-Prey Role Play**  
     *Concept:* Gazelles (students) signal health via "stotting" (costly jumps); predators (TAs) chase based on signals.  
     *Rejected:* Too abstract. Hard to quantify "cost" without physical movement. Risk of chaos with 16 students. TAs as predators introduces bias.

  2. **Signal Market Auction**  
     *Concept:* Students bid tokens to send signals about hidden traits; others pay for info.  
     *Rejected:* Overly complex. Requires many transactions and risks confusion with 16 players. Fails to force a "cheap talk collapse" cleanly.

  3. **The Credential Game (Chosen)**  
     *Why it wins:*  
     - **Simple**: Students are job applicants signaling with "degrees." Types are fixed (High/Low ability), costs vary by round.  
     - **Incentive-driven**: Concrete payoffs in points (convertible to candy).  
     - **Airtight collapse**: Round 1 makes cheap talk fail *inescapably*.  
     - **Differential costs**: High types pay less for signals (simulating how strong gazelles afford stotting/peacocks grow tails).  
     - **Philosophical tension**: Round 3 tests "burned money" waste.  

  ---

  ### **Game Setup**
  - **Players**: 16 students (8 High-Ability, 8 Low-Ability).  
  - **Materials**: 
    - 16 index cards (8 labeled "HIGH", 8 "LOW"). 
    - 80 tokens (e.g., poker chips, paper clips). 1 token = 1 point.  
    - Whiteboard to post payoffs.  
  - **Roles**: 
    - **Instructor**: Runs rounds, distributes tokens.  
    - **TA**: Helps tally signals and payoffs.  
  - **Core Mechanic**:  
    Students decide whether to "earn a degree" (signal). Signaling costs tokens. Employers (automated) pay wages based on *perceived* ability from signals.  
    - **Hidden Types**: High-ability (HIGH) produce more value but pay less for signals. Low-ability (LOW) pay more.  
    - **Wage Rule**: Employers pay:  
      - 10 tokens to applicants *with* a degree (believed HIGH).  
      - 4 tokens to applicants *without* a degree (believed LOW).  

  ---

  ### **Payoff Tables for Each Round**
  **Key**:  
  - **Cost**: Tokens paid to signal.  
  - **Wage**: Tokens earned based on signal.  
  - **Net**: Wage − Cost (what students keep).  

  #### **Round 1: Cheap Talk (Cost = 0 for all)**  
  | Type | Signal? | Cost | Wage | Net |  
  |------|---------|------|------|-----|  
  | HIGH | Yes     | 0    | 4   | 4   |  
  | HIGH | No      | 0    | 4   | 4   |  
  | LOW  | Yes     | 0    | 4   | 4   |  
  | LOW  | No      | 0    | 4   | 4   |  
  - **Rationale**: Signaling is free. Everyone signals (degree = yes). Employers see universal signaling → assume no information → pay LOW wage (4) to *all*.  
  - **Troll-proof**: No incentive to deviate. Even a lazy student sees signaling gains nothing. Net = 4 regardless.  

  #### **Round 2: Differential Cost (Cost varies by type)**  
  | Type | Signal? | Cost | Wage | Net |  
  |------|---------|------|------|-----|  
  | HIGH | Yes     | 2    | 10  | 8   |  
  | HIGH | No      | 0    | 4   | 4   |  
  | LOW  | Yes     | 6    | 10  | 4   |  
  | LOW  | No      | 0    | 4   | 4   |  
  - **Rationale**: HIGH pay 2 tokens to signal; LOW pay 6. Employers pay HIGH wage (10) for signals.  
  - **Troll-proof**:  
    - HIGH: Signal → net 8. No signal → net 4. **Signal is rational**.  
    - LOW: Signal → net 4. No signal → net 4. **Indifferent (break ties by asking LOWs to avoid risk)**.  
  - **Equilibrium**: HIGH signal, LOW don’t. Signal is credible.  

  #### **Round 3: Burned Money (Fixed cost for all)**  
  | Type | Signal? | Cost | Wage | Net |  
  |------|---------|------|------|-----|  
  | HIGH | Yes     | 5    | 10  | 5   |  
  | HIGH | No      | 0    | 4   | 4   |  
  | LOW  | Yes     | 5    | 10  | 5   |  
  | LOW  | No      | 0    | 4   | 4   |  
  - **Rationale**: All pay 5 tokens to signal. Employers pay HIGH wage (10) for signals.  
  - **Troll-proof**:  
    - Signaling gives net 5. No signal gives net 4. **All should signal** → but then wages collapse to 4 (as in Round 1).  
  - **Conflict**: Students fight over wasting tokens for no gain.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 80 minutes**  

  #### **Setup (5 min)**  
  - **0–1 min**: Distribute cards (8 HIGH, 8 LOW). Students keep type secret.  
  - **1–3 min**: Explain rules:  
    > *"You’re job applicants. HIGH-ability create more value but pay less for degrees. LOW-ability pay more. Each round, decide: get a degree or not? Degrees cost tokens. Employers pay wages based on how many people signal. Goal: Maximize tokens (tradeable for candy)."*  
  - **3–5 min**: Distribute 10 tokens/student (seed capital). Post wage rules: **Degree = 10 tokens**, **No degree = 4 tokens**.  

  #### **Round 1: Cheap Talk (15 min)**  
  - **5–7 min**: Run round.  
    > *"Degrees are FREE. Write ‘YES’ or ‘NO’ on a card and hand it to the TA. You have 1 minute."*  
  - **7–10 min**: Tally signals (all will signal). Announce:  
    > *"Everyone signaled! Employers see no difference → all get 4 tokens. Net: 4 tokens."*  
  - **10–15 min**: Discuss:  
    > *"Why did no one trust the signal? What broke?"*  
    *(Key: Free signals = no credibility.)*  

  #### **Round 2: Differential Cost (20 min)**  
  - **15–17 min**: Announce costs:  
    > *"HIGHs pay 2 tokens for a degree. LOWs pay 6. Decide now!"*  
  - **17–20 min**: Tally. Typically, 6–8 HIGHs signal; 0–2 LOWs signal.  
  - **20–25 min**: Pay wages. Highlight:  
    > *"HIGHs who signaled: 10 − 2 = 8. LOWs who signaled: 10 − 6 = 4. Non-signalers: 4."*  
  - **25–30 min**: Discuss:  
    > *"Why did LOWs stop signaling? Why do HIGHs still signal?"*  
    *(Key: Cost anchors credibility when it hurts LOWs more.)*  

  #### **Round 3: Burned Money (20 min)**  
  - **30–32 min**: Announce:  
    > *"Everyone pays 5 tokens for a degree. Decide now!"*  
  - **32–35 min**: Tally (most will signal → wage collapses to 4).  
  - **35–40 min**: Pay: Signalers get 10 − 5 = 5; non-signalers get 4.  
    > *"Net: Signal = 5, No signal = 4. But if everyone signals, wages drop to 4 next time. Did you waste tokens?"*  
  - **40–45 min**: Debate:  
    > *"Is this like peacock tails—useful waste? Or pure waste?"*  

  #### **Debrief (35 min)**  
  - **45–60 min**: Map game to concepts:  
    | **Game Moment**         | **Concept**                          | **Real-World Example**         |  
    |--------------------------|--------------------------------------|--------------------------------|  
    | Round 1 collapse         | Cheap talk → pooling equilibrium     | Fake online reviews            |  
    | Round 2 separation       | Costly signal → separating equilibrium | College degrees, peacock tails |  
    | Round 3 conflict         | Burned money vs. waste               | Engagement rings, luxury goods |  
  - **60–75 min**: Lecture-lite:  
    - **Handicap Principle**: Signals work *because* cost is differentially burdensome (Zahavi).  
    - **Biology**: Stotting gazelles—weak ones can’t afford jumps. Peacock tails—only healthy males grow them.  
    - **Economics**: Degrees weed out low-skill workers via effort cost.  
    - **Philosophy**: Is waste necessary? Yes—cost must *hurt* to be credible. But *differential* hurt prevents pure waste.  
  - **75–80 min**: Candy payout (top 3 token-holders).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Collusion/Cheating**:  
     - *Risk*: Students share types or agree to not signal.  
     - *Fix*: Anonymize decisions. Warn: "No talking during rounds." Award candy individually.  

  2. **Spite-Signaling**:  
     - *Risk*: A HIGH refuses to signal in Round 2 to "prove" the game is dumb.  
     - *Fix*: Payoff tables show they lose tokens (net 4 vs. 8). Candy incentive outweighs spite.  

  3. **Confusion with Tokens**:  
     - *Risk*: Students miscalculate net payoffs.  
     - *Fix*: Post tables visibly. TA checks submissions.  

  4. **Round 3 Stalemate**:  
     - *Risk*: No one signals to avoid waste.  
     - *Fix*: Incentives push them to signal (net 5 > 4). If they resist, highlight: "But if *you* signal alone, you get 10−5=5, while others get 4."  

  ---

  ### **What the Game Cannot Capture**  
  - **Evolved Costs**: In the game, costs are *designed* by you. In nature, costs emerge from constraints (e.g., weak gazelles lack energy to stot).  
  - **Equilibrium Selection**: The game *starts* with a cost structure. In reality, signaling systems evolve through trial/error (e.g., peacock tails grew incrementally).  
  - **Complex Beliefs**: Employers here use a fixed rule. Real receivers (predators, mates) update beliefs dynamically.  
  - **Partial Pooling**: The game forces binary signals. In nature, signals can be continuous (tail size), allowing gradations.  

  **How to Bridge the Gap**:  
  1. **Explicitly state**: "In nature, the cost structure isn’t imposed—it emerges. Weak animals *can’t* fake signals because physiology stops them."  
  2. **Use examples**: "A lion doesn’t ‘decide’ stotting costs—metabolism decides. The equilibrium is honed by evolution, not a teacher."  
  3. **Emphasize**: The game shows *why* differential costs stabilize signals. Biology shows *how* those costs arise.  

  ---

  ### **Incentive Check**  
  - **Round 1**: No incentive to deviate → all signal → collapse.  
  - **Round 2**: HIGHs gain by signaling; LOWs gain by not. Trolls lose tokens.  
  - **Round 3**: Signaling gives +1 token even in collapse → students *must* engage with the waste debate.  

  This design forces students to experience the core tension: **Costs make signals credible, but only when they discriminate. Waste without discrimination is deadweight loss.** By Round 3, they’ll be arguing like evolutionary economists.
