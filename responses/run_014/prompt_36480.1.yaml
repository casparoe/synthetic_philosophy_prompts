   1. Cheap talk (costless signals) are not credible because everyone can use them, leading to pooling equilibrium where the signal conveys no information.
   2. When signals are costly and the cost differentially affects different types (e.g., high-quality vs. low-quality individuals), a separating equilibrium can emerge where the signal is credible.
   3. Explore the case where the cost is the same for everyone (pure burning of resources) and whether it can sustain signaling.

   Constraints:
   - No real money: use points or tokens.
   - Minimal prep: easy to set up.
   - Must be runnable by instructor and one TA.
   - Concrete payoff numbers that are incentive-compatible (so rational students will behave as intended).
   - Timeline with rules for each round.
   - Debrief connecting game to concepts.
   - Anticipate problems and fixes.
   - Note on what the game cannot capture.

   Brainstorming candidate game concepts:

   1. **Job Market Signaling Game**:
      - Students are job applicants with a "type" (high or low ability). 
      - They choose whether to get a degree (signal) which has a cost. 
      - Employers then decide to hire or not and set a wage.
      - Problem: May be too abstract and the wage setting by employers (other students) might be noisy. Also, requires many roles and might be complex.

   2. **Predator-Prey (Stotting Gazelle)**:
      - Some students are gazelles (with types: healthy or weak) and one or two are predators (lions). 
      - Gazelles decide whether to stot (signal) which is costly (slows them down). 
      - Predators then decide which gazelle to chase.
      - Problem: Physical movement? Also, the cost of stotting might be hard to simulate without physical activity, and the predator's decision might be arbitrary.

   3. **Mating Market (Peacock Tails)**:
      - Students are peacocks (males) and peahens (females). 
