prompt: |-
  Okay this has been itching at me for months and it came up again last night over takeout with my roomates (both also chronically online rationalist-adjacent types). I'm a longtime lesswrong / ACX lurker so I try to be careful about when I say an AI believes or wants something, but I keep noticing that me and basically everyone around me slide back and forth in a pretty self-serving way.

  Like last week I was using Claude to plan a trip and I told my friend oh it knows I hate layovers so it picked the direct flight, and then ten minutes later when it confidently invented a train that doesn't exist I immediately switched to ugh it's just doing next-token prediction, it doesn't know anything. Same thing with my friend who works on driver-assist stuff — when the car handles a tricky merge he's like it saw the truck and decided to hang back, but after a disengagement it's suddenly just matrix multiplies, you can't say it saw anything. And it's not just success vs failure, it's also praise vs blame — people are fine saying the tutor bot lied to them when they're annoyed, but if you push them on whether it actually has beliefs they'll retreat to it's just a tool with no goals.

  So does this flip-flop have an established name? I know anthropomorphism is in the neighborhood and I've heard philosophers talk about treating beliefs as a useful fiction, but this feels more specific than just over-attributing human stuff, because it's the same person using both frames opportunistically depending on what's convenient. I don't just want a one-word label — can you lay out what the closest existing concepts are, how exactly this pattern is different from each of them, and where you'd draw the lines? And if there isn't really a term for this exact move, coin one for me with a tight definition plus a couple clear yes/no boundary cases so I can actually use it in arguments.
reasoning: |-
  Okay, the user is describing a pattern they've noticed where people, including themselves, switch between attributing mental states to AI systems (like beliefs, desires, knowledge) and dismissing them as mere statistical tools, depending on whether the AI succeeds or fails, or whether they want to praise or blame it. They're asking for an established term for this flip-flopping behavior, or if none exists, to coin a new term with a clear definition. 

  First, I need to unpack what the user is really after. They're clearly well-versed in rationalist/ACX spaces—mentioning LessWrong and "chronically online rationalist-adjacent" roommates—so they're familiar with concepts like anthropomorphism and the philosophical debates around AI cognition. Their frustration isn't just about sloppy language; it's about the *opportunistic* use of these frames. They want precision: a way to call out this inconsistency without getting bogged down in semantic debates. 

  The examples they give are spot-on: calling Claude "knowing" you hate layovers when it succeeds, then reducing it to "next-token prediction" when it fails, or their friend's driver-assist system "seeing" a truck versus being "just matrix multiplies." The key is the self-serving inconsistency—same person, same system, opposite framing based on outcome or emotional valence. 

  Existing terms don't quite fit. "Anthropomorphism" is too broad; it covers over-attribution but not the flip-flop. "Intentional stance" (Dennett) describes treating systems *as if* they have beliefs for prediction, but doesn't capture the *opportunistic switching*. "Motivated reasoning" is close but focuses on belief formation, not linguistic framing. "Double standard" is vague. 

  So the core issue is: **instrumentally toggling between mentalistic and mechanistic descriptions of AI to serve pragmatic or emotional needs.** The user wants a label that pins down this *rhetorical maneuver* specifically. 

  For coining a term, I should avoid jargon overload. It needs to be: 
  - Memorable 
  - Self-explanatory when defined 
  - Verb-friendly ("they're [verb]-ing again!") 
  Options: 
  **Frame-Flipping**: Highlights the switch but might be too generic. 
  **Intentional Toggling**: Precise but clunky. 
  **Convenience Attribution**: Captures the self-serving aspect. 
  **Pragmatic Stance-Shifting**: Accurate but academic. 
  **Ghost-in-the-Machine Gambit**: Fun but obscure. 

  Best candidate: **Pragmatic Stance-Shifting (PSS)**. "Stance" nods to Dennett, "shifting" implies opportunism, "pragmatic" underscores it's about utility, not truth. Definition: *The rhetorical practice of alternately describing an AI system using mentalistic terms (beliefs, knowledge, intentions) or mechanistic terms (algorithms, statistics, tools) based on the immediate pragmatic or emotional context (e.g., success/failure, praise/blame), rather than consistency or ontological commitment.* 

  Boundary cases to test it: 
  - **Yes PSS**: Calling a tutor bot a "liar" when it gives wrong info but insisting it "doesn't believe anything" when pressed. 
  - **Not PSS**: Consistently using mentalistic terms for an AGI you believe is sentient. 
  - **Not PSS**: Switching terms because new evidence changed your view of the AI's capabilities. 

  User's deeper need: They want to *stop* this pattern in themselves/others, or at least call it out cleanly. Providing a sharp label arms them for those late-night rationalist debates. Also, they might be wrestling with their own discomfort—how to discuss AI without slipping into hypocrisy. Offering the term plus examples gives them a toolkit.
answer: |-
  This is a **fantastically** observed phenomenon—a genuine cognitive/rhetorical tic in how we discuss AI. It's more specific than general anthropomorphism, and while it has overlapping elements with several concepts, no single term perfectly captures its *opportunistic, context-dependent flip-flopping*. Let's break it down:

  ### Close Existing Concepts & Why They Don't Fully Fit
  1. **Anthropomorphism**:
     - *What it is*: Attributing human characteristics (beliefs, desires, intent) to non-human entities.
     - *Where it fits*: Explains using "knows," "wants," or "decides" for AI.
     - **Why it's insufficient**: It doesn't address the *reversal* to mechanistic language when convenient. Anthropomorphism is consistent; this is *instrumental*.

  2. **Dennett's "Intentional Stance"**:
     - *What it is*: A pragmatic strategy of predicting behavior by treating a system *as if* it has beliefs/desires (useful for complex systems like chess computers or thermostats).
     - *Where it fits*: Explains why we *default* to mentalistic language for useful AI outputs.
     - **Why it's insufficient**: The stance is meant to be a consistent heuristic. The *opportunistic abandonment* of it (especially to deflect blame) isn't core to the theory.

  3. **Motivated Reasoning**:
     - *What it is*: Unconsciously bending interpretations to fit desires or emotions (e.g., downplaying failures).
     - *Where it fits*: Explains why success triggers "it knew!" and failure triggers "just math!".
     - **Why it's insufficient**: Focuses on belief formation, not the *linguistic/rhetorical switch* between fundamentally incompatible frameworks.

  4. **Double Standard**:
     - *What it is*: Applying different criteria to similar situations.
     - *Where it fits*: Clearly describes the inconsistency.
     - **Why it's insufficient**: Too broad. Doesn't specify the *nature* of the flip (mentalistic vs. mechanistic frames) or the *context* (praise/blame, success/failure).

  5. **Mind Perception Ambiguity Exploitation**:
     - *What it is*: Leveraging the unresolved philosophical debate about AI consciousness/beliefs for rhetorical gain.
     - *Where it fits*: Highlights the ambiguity being weaponized.
     - **Why it's insufficient**: Not an established term, and implies more conscious deception than is likely occurring (it's often subconscious).

  ### The Core Pattern: A Proposed Term & Definition
  **Term: Pragmatic Stance-Shifting (PSS)**  
  *(or "Instrumental Ontology-Toggling" if you prefer heavier academic flavor)*

  **Tight Definition**:  
  The opportunistic alternation between describing an AI system using **mentalistic language** (implying beliefs, knowledge, intentions, awareness) and **mechanistic language** (implying statistical prediction, algorithmic processing, tool-like function), driven by immediate pragmatic or emotional context (e.g., attributing success, deflecting blame, expressing frustration, avoiding philosophical commitment), rather than a consistent position on the AI's ontological status.

  **Key Differentiators**:
  -   **Not just inconsistency**: It's specifically flipping between *mentalistic* and *mechanistic* frames.
  -   **Driven by utility**: The chosen frame serves a purpose (praise, blame, convenience, emotional relief).
  -   **Avoids commitment**: Allows the user to evade taking a stand on whether the AI "truly" has beliefs.

  ### Boundary Cases (Yes/No)
  | Scenario                                                                 | PSS? | Why?                                                                                               |
  | :----------------------------------------------------------------------- | :--- | :------------------------------------------------------------------------------------------------- |
  | You say Claude "knew you hated layovers" when it succeeds, but call it "just token prediction" when it hallucinates. | **YES** | Flip based on success/failure; mentalistic → mechanistic.                                     |
  | You call an AI tutor a "liar" when it gives wrong info, but insist AIs "can't lie" when asked if it has beliefs. | **YES** | Flip based on blame vs. ontological commitment; mentalistic (lie) → mechanistic (can't lie). |
  | You *always* refer to LLMs as "stochastic parrots" (mechanistic), even when impressed.       | **NO**  | Consistent stance, no shift.                                                                       |
  | You *always* treat a cutting-edge robot as sentient, even when it fails.                 | **NO**  | Consistent anthropomorphism, no shift.                                                             |
  | You switch from "it decided" to "it glitched" because new technical data shows a bug.   | **NO**  | Shift based on *new evidence*, not *pragmatic convenience*.                                        |
  | You say "my car *wanted* to merge" as a poetic metaphor, not a literal claim.           | **NO**  | No pretense of literal belief; consistent figurative use.                                          |

  ### Why This Pattern Matters & How to Use the Term
  - **The Problem**: PSS lets users reap the *benefits* of mentalistic language (intuitive explanations, emotional satisfaction in praise/blame) while dodging its *costs* (accountability for implying agency, philosophical inconsistency). It stifles clear discussion about AI capabilities and risks.
  - **Using "Pragmatic Stance-Shifting" in Argument**:
    - "Hold on, that's Pragmatic Stance-Shifting. When the car merged smoothly, you said it *saw the gap*, but now that it braked suddenly, it's 'just sensors.' Which is it?"
    - "Calling Claude a 'liar' is classic PSS. You're using mentalistic language to express anger, but retreating to mechanism when I ask if it has intent. Pick a coherent frame."
    - "We need to avoid PSS in this AI ethics debate. If we blame the system for harm using language of intent ('it chose to discriminate'), we can't later call it 'just math' to absolve developers."

  This isn't just pedantry—it forces clarity. Does the AI have representational states (even if not human-like)? Then use mentalistic language *consistently*. Is it purely a function approximator? Then avoid agential terms *even when it impresses you*. PSS exposes our discomfort with the alien nature of modern AI. Naming it gives you power to call out the flip-flop.
