answer: |-
  Your argument is thoughtful but contains a critical misstep. The inference breaks at the assimilation of hidden variables to quantities we are "merely ignorant of" and the treatment of preparability as *purely epistemic*. Here’s why:

  ### 1. **The Nature of Hidden Variables in Pilot-Wave Theory**  
     In pilot-wave theory, hidden variables (particle positions) are **ontological**, not epistemic. They are physical degrees of freedom with definite values at all times, governed by a deterministic dynamics (the guiding equation). Your claim that they are "quantities we are merely ignorant of" conflates two distinct issues:  
     - **Epistemic limitation**: We cannot *know* or *control* exact positions due to quantum equilibrium.  
     - **Ontological status**: Positions exist objectively and evolve via a nonlocal law.  
     Bell’s theorem targets *local* ontological variables. Pilot-wave avoids this by accepting *nonlocal* ontological variables. Their inaccessibility doesn’t reduce them to epistemic artifacts—it’s a consequence of a physical statistical constraint (quantum equilibrium).

  ### 2. **"Real but Inoperative" Refers to Operational Consequences, Not Ontology**  
     Your friend is correct: nonlocality is physically real but *operationally hidden* in equilibrium. Valentini’s result proves this distinction isn’t semantic:  
     - **Out-of-equilibrium states** would manifest superluminal signals, violating Lorentz invariance and uncertainty.  
     - This shows nonlocality is **physically latent**: it could be "activated" if the physical state (not just our knowledge) changed.  
     Your claim that preparability is "epistemic" ignores that quantum equilibrium is a *dynamical* feature of the theory. Preparability constraints arise from the physics of relaxation processes, not just ignorance.

  ### 3. **The Wavefunction as a Physical Field vs. Law**  
     Your friend’s view that the wavefunction is "law-like" doesn’t undermine nonlocality. Even if construed as a law (e.g., a nomological entity), it **physically relates distant particles** via the guiding equation. Bell’s theorem requires that correlations be screened off by local facts. Pilot-wave fails this because the guiding equation (whether field or law) instantaneously couples configurations across space. This is nonlocal causation, regardless of interpretational labels.

  ### 4. **Where Your Inference Fails**  
     Your core error is here:  
     > *"If whether a signal may be sent turns on which distributions we are able to prepare, the constraint [...] is on our epistemic access, not a structural feature."*  
     This conflates two levels:  
     - **Structural feature**: The guiding equation *is* nonlocal (a dynamical fact).  
     - **Operational consequence**: Signaling is blocked *only* when the system is in a specific physical state (quantum equilibrium).  
     Valentini shows that altering the physical state (not just our knowledge) would change operational outcomes. Thus, the nonlocality is structural, and its (non)operability depends on physics, not epistemology.

  ### Conclusion  
  You misuse "hidden variable" by reducing it to an epistemic unknown. In pilot-wave, hidden variables are **ontological**, and their nonlocal dependence is physical. Bell’s theorem *does* show nature is nonlocal: any theory reproducing quantum predictions must violate local causality. Pilot-wave accepts this by building nonlocality into its dynamics. Quantum equilibrium hides signaling not because nonlocality is unreal, but because it erases measurable signals—much as thermodynamics hides molecular motions without denying their reality.  

  **The misstep**: Equating *inaccessibility* of variables with *epistemicity of nonlocality*. The former is a statistical effect; the latter is a dynamical fact. Your friend coherently holds that pilot-wave is epistemic about *knowledge of positions* but ontological about *nonlocal dependence*. Valentini’s result confirms this: it reveals the physical mechanism beneath the statistical veil.
