prompt: |-
  I am counsel to the Board of Electors of a port city of roughly 400,000 — a standing five-member body that keeps the municipal register of electors and rules on petitions to be added to it. Two years ago the city council extended the municipal franchise to sixteen- and seventeen-year-olds and to residents without national citizenship who have lived here three years. Petitions have arrived at eight to twelve a year ever since, and this cycle's docket is harder than the last: an association of commuters who live in surrounding towns, work in the city, pay its earnings tax, and are subject to its traffic, transit, and policing rules but cast no ballot in it; a business federation asking that member firms be entered on the register with votes apportioned by headcount of employees, on the ground that firms bear the city's licensing, zoning, and business-rate regime; and former residents and their descendants displaced in the 1960s when a highway corridor was cut through their neighborhood, asking for a vote in the authority that now controls the redevelopment land.

  The constraints on any procedure you write me are these. The commissioners are laypeople — a retired head teacher, a small-business owner, two lawyers, a union official — and none has training in political theory. Each petition gets a twenty-minute slot; published plain-language reasons must issue within thirty days; disappointed petitioners appeal routinely, so the reasons have to survive being read cold by a judge. The board may add a category to the register where the enabling statute already permits it, deny, or refer to the council a remedy it cannot create itself. It may not amend the statute, and it may not invent offices. Every step of the procedure has to end in something a commissioner can vote yes or no on, and there must be a recorded form of dissent.

  The substantive problem is that the board keeps walking into what I understand is called the boundary problem: the composition of the electorate cannot be settled by a vote of that electorate without assuming the answer, so whatever rule we apply has to be justified from outside the democratic procedure it authorizes. The two principles we hear most often are both unusable as they stand. "Everyone affected should have a say" sweeps in commuters, downstream towns, unborn residents, and corporations, and says nothing about weight. "Everyone subject to the city's coercive rules should have a say" is narrower, but threatens to enfranchise anyone a police officer can stop. In practice the board has been reaching for a third test, and I want it tested rather than assumed: a claimant belongs on the register only if the city can make that claimant worse off by rules the claimant had no part in making, and the claimant lacks any exit, avoidance, or counter-pressure route comparable to what people already on the register have. Adopt that test, sharpen it, or reject it and replace it — but tell me which you have done, and show me where the difference lands on this docket.

  What I need is a written decision procedure the board can adopt as a standing order and run without theory: the questions asked in order; what counts as a sufficient answer to each; a fixed menu of outcomes, which must include something better than a bare no — at minimum a status under which a group's interests are counted in the reasoning and must be answered in the published reasons without anyone getting a ballot, and a status short of full franchise such as a reserved consultative seat or a suspensive veto; a rule for partial or issue-bound franchise, since a commuter may have a claim on transit and policing and none on schools (the board is aware that United States courts have tolerated landowner-only, valuation-weighted voting in special-purpose districts precisely because the district's remit was narrow and its operations bore disproportionately on landowners, and wants to know whether that logic is available to a general-purpose city); a default rule that terminates the inquiry when the questions come out even rather than letting a petition stall; a re-opening trigger stating when a granted status is revisited, so that today's inclusion does not become unarguable tomorrow; explicit marking of every step at which the board is in fact fixing the boundaries of its own authority and cannot appeal to the electorate for cover; and explicit marking of the steps that are judgment calls dressed up as procedure.

  Then run the procedure on all three petitions, in docket order. I expect it to hand down at least one result the commissioners will dislike — one refusal they will find harsh and one grant that runs against their instincts — and if it does not, that is a sign the procedure is tracking their preferences rather than their reasons. For each petition give the outcome from your menu, the two or three sentences that would actually appear in the published reasons, the strongest objection from the losing side, and the reply the board should make.

  Close with what the procedure cannot do: the classes of petition it will mishandle, the petitions it will decide correctly for reasons that will not bear being said aloud in public, and the places where it relocates the boundary problem instead of dissolving it. No citations, no reading lists, no bibliography; name a theorist only where the name would change what a commissioner does on the day. Plain language throughout, since the text will be published. The whole thing should fit in about two pages of standing order plus the three applications.

  Begin with the procedure itself, with no preface, no restating of this brief, and no scene-setting about the boundary problem; make its first line the one-sentence operative test that the remaining steps implement.
reasoning: |-
  We are adopting the following test: A claimant belongs on the register only if the city can make that claimant worse off by rules the claimant had no part in making, and the claimant lacks any exit, avoidance, or counter-pressure route comparable to what people already on the register have.

  We will now implement this test through a series of questions. The questions must be asked in order. Each question must be answered with "yes," "no," or "not applicable" (N/A). The answers will lead to one of the outcomes listed in the menu. The procedure is designed so that at each step, the board is making a judgment call, but the structure guides the reasoning and ensures that all relevant factors are considered.

  **Procedure:**

  1. **Question One: Is the claimant an individual human being or a group of individuals?** 
     - *Purpose:* To distinguish between natural persons and other entities (like corporations, associations, etc.). The franchise is fundamentally for individuals, but groups may be considered for alternative forms of representation.
     - *Sufficient answer:* 
       - If the claimant is an individual or a group of individuals (e.g., a class of displaced residents), answer "yes" and proceed to Question Two.
       - If the claimant is a non-human entity (e.g., a corporation, a business federation), answer "no" and proceed to Outcome Menu: "Alternative Status Consideration."

  2. **Question Two: Can the city, through its rules, make the claimant worse off?**
     - *Purpose:* To determine if the claimant is affected by the city's coercive rules in a tangible, negative way.
     - *Sufficient answer:* 
       - "Yes" if the claimant is subject to rules that impose burdens (e.g., taxes, regulations, enforcement actions) that can harm the claimant's interests. Proceed to Question Three.
       - "No" if the claimant is not subject to such rules. Proceed to Outcome Menu: "Denial with Explanation."

  3. **Question Three: Does the claimant have a part in making the rules that affect them?** 
     - *Purpose:* To assess whether the claimant already has a voice in the rule-making process.
     - *Sufficient answer:* 
       - "No" if the claimant has no formal role in making the rules (e.g., no vote, no representation). Proceed to Question Four.
       - "Yes" if the claimant already has a say (e.g., through voting in the city or through other effective channels). Proceed to Outcome Menu: "Denial with Explanation."

  4. **Question Four: Does the claimant lack a comparable exit, avoidance, or counter-pressure route?**
     - *Purpose:* To evaluate whether the claimant has realistic alternatives to mitigate the harm without needing a vote. We compare to those already on the register (e.g., residents who can vote, protest, or move).
     - *Sufficient answer:* 
       - "Yes" if the claimant has no practical way to exit the situation, avoid the harm, or exert counter-pressure (e.g., through market choices, legal challenges, or political influence in another forum) that is as effective as what current electors have. Proceed to Outcome Menu: "Full Franchise."
       - "No" if the claimant has such a route (e.g., a commuter can choose to work elsewhere, or a business can relocate). Proceed to Question Five.

  5. **Question Five: Is the harm caused by the city's rules narrow and specific to a particular function?**
     - *Purpose:* To determine if a partial franchise (e.g., limited to certain issues) is appropriate.
     - *Sufficient answer:* 
       - "Yes" if the harm is concentrated in one or a few areas of the city's governance (e.g., transit, zoning) and the claimant has a strong, distinct interest in that area. Proceed to Outcome Menu: "Partial Franchise."
       - "No" if the harm is broad and general, affecting multiple areas. Proceed to Outcome Menu: "Referral to Council."

  **Outcome Menu:**

  - **Full Franchise:** The claimant is added to the register with full voting rights in all city elections.
  - **Partial Franchise:** The claimant is added to the register with voting rights limited to specific issues or offices (e.g., only on transit referenda, only for the transit authority board). The board must specify the scope.
  - **Alternative Status Consideration:** For non-human entities or groups that do not qualify for the franchise, the board considers non-voting representation. Proceed to Alternative Status Subprocedure.
  - **Denial with Explanation:** The petition is denied. The board must provide a clear explanation of why the claimant does not meet the test.
  - **Referral to Council:** The board cannot grant the remedy sought (e.g., because it requires creating a new office or amending the statute) and refers the matter to the city council with a recommendation.

  **Alternative Status Subprocedure (for non-human entities or groups that are not individuals):**

  1. **Question A: Does the claimant represent a significant interest that is directly and uniquely affected by the city's rules?**
     - *Sufficient answer:* 
       - "Yes" if the claimant's interests are distinct and heavily impacted (e.g., businesses subject to licensing and zoning). Proceed to Question B.
       - "No" otherwise. Proceed to Denial with Explanation.

  2. **Question B: Can the claimant's interests be adequately represented through existing channels?**
     - *Sufficient answer:* 
       - "No" if current electors do not reliably represent the claimant's interests (e.g., because they conflict with residents'). Proceed to Outcome Menu: "Consultative Status."
       - "Yes" if the claimant can lobby, sue, or otherwise influence the city without formal representation. Proceed to Denial with Explanation.

  3. **Outcome: Consultative Status:** The claimant is granted a non-voting role (e.g., a right to be consulted on specific matters, a seat in an advisory body). The board must specify the scope.

  **Default Rule:** At any step, if the evidence is balanced and the board cannot reach a clear answer, the question is answered "no" or "not applicable" as appropriate, and the procedure moves to the next step. The petition does not stall.

  **Re-opening Trigger:** A granted status (Full, Partial, or Consultative) is revisited automatically if:
     - The city's rules change in a way that materially affects the claimant's situation, or
     - The claimant's circumstances change (e.g., a commuter moves and becomes a resident), or
     - Every five years, the board reviews all non-standard entries.

  **Marking of Key Steps:**
  - Steps where the board fixes the boundaries of its own authority (cannot appeal to the electorate for cover): All steps. The board is applying an external test to define the electorate.
  - Steps that are judgment calls dressed as procedure: 
    - Question Four (comparable exit/avoidance) and Question Five (narrow harm) are highly contextual and require judgment. The board must document its reasoning.

  ---

  **Application to Petitions:**

  **Docket Order:**
  1. Association of commuters
  2. Business federation
  3. Displaced former residents and descendants

  ---

  **1. Association of Commuters (live in surrounding towns, work in city, pay earnings tax, subject to traffic, transit, and policing rules)**

  *Procedure:*
  - Q1: Yes (individuals) → Proceed to Q2.
  - Q2: Yes (subject to traffic rules, transit, policing, and pay earnings tax) → Proceed to Q3.
  - Q3: No (they have no part in making the rules) → Proceed to Q4.
  - Q4: Do they lack comparable exit/avoidance? 
    - *Analysis:* Commuters can choose to work elsewhere, use different routes, or advocate through their home towns. However, their daily exposure to city rules is high, and avoiding the city entirely may not be practical. But they have counter-pressure through employers, regional bodies, and their own municipalities. Compared to residents, they have less stake in the city's overall governance (e.g., schools, land use) and more mobility. Answer: **No** (they have some avoidance/counter-pressure) → Proceed to Q5.
  - Q5: Is the harm narrow? 
    - *Analysis:* The harm is specific to transit, traffic, and policing. They do not have a strong interest in schools or other city services. Answer: **Yes** → Outcome: **Partial Franchise** (voting rights limited to transit and policing matters, e.g., for the transit authority board or police oversight body).

  *Published Reasons (2-3 sentences):* Commuters are affected by the city's transit and policing rules and have no vote. However, they have options to avoid harm (e.g., changing jobs or routes) and can exert pressure through their home towns. Therefore, they are granted a vote only on matters directly concerning transit and policing.

  *Strongest Objection:* "Commuters pay the city's earnings tax and are subject to daily enforcement; they should have a full vote like residents."

  *Board's Reply:* "The earnings tax does not create a general stake in all city functions. Their interests are specific, and they have alternatives not available to residents."

  ---

  **2. Business Federation (member firms want votes apportioned by employee headcount)**

  *Procedure:*
  - Q1: No (businesses are not individuals) → Proceed to Alternative Status Subprocedure.
    - Q A: Yes (businesses are directly affected by licensing, zoning, and business rates) → Proceed to Q B.
    - Q B: Can their interests be adequately represented through existing channels? 
      - *Analysis:* Businesses can lobby, form associations, and sue. Residents who are employees or customers may also represent business interests. However, conflicts exist (e.g., residents may oppose commercial development). But the law does not recognize firms as voters, and the board cannot invent corporate suffrage. Answer: **Yes** → Outcome: **Denial with Explanation**.

  *Published Reasons:* Firms are not individuals and cannot be granted the franchise. Their interests can be represented through existing channels, including lobbying and the votes of their employees who are residents.

  *Strongest Objection:* "Businesses bear heavy burdens from city rules and employ many residents; they deserve a formal voice."

  *Board's Reply:* "Granting votes to firms would distort the principle of one-person-one-vote. Their influence through economic power and advocacy is already significant."

  ---

  **3. Displaced Former Residents and Descendants (seek vote in the authority controlling redevelopment land)**

  *Procedure:*
  - Q1: Yes (individuals) → Proceed to Q2.
  - Q2: Yes (the authority's decisions affect their heritage, potential restitution, and emotional ties) → Proceed to Q3.
  - Q3: No (they have no part in making the rules of the authority) → Proceed to Q4.
  - Q4: Do they lack comparable exit/avoidance? 
    - *Analysis:* They were forcibly displaced and cannot return. They have no physical presence in the city now and may live far away. Avoidance is not possible; counter-pressure through protests or lawsuits is their only option, but it is less effective than residents' voting power. Answer: **Yes** (lack comparable routes) → Outcome: **Full Franchise** for the specific authority (the redevelopment land authority only).

  *Published Reasons:* The displaced group has a unique, ongoing harm from the city's actions and no way to avoid it. They have no voice in the authority that controls their former neighborhood. Therefore, they are granted full voting rights for that authority.

  *Strongest Objection:* "They no longer live here; voting should be for current residents only."

  *Board's Reply:* "The authority's decisions directly affect their unresolved claims and ties to the land. Current residents alone should not decide the fate of a community that was destroyed."

  ---

  **What the Procedure Cannot Do:**

  - **Mishandled Classes:** 
    - Petitions from temporary residents (e.g., students) might be denied even if they lack exit options, because the procedure emphasizes permanent harm.
    - Groups with diffuse interests (e.g., environmental advocates) may not qualify under the narrow harm test.

  - **Correct for Unspoken Reasons:** 
    - The displaced residents' grant may be seen as reparative justice, but the procedure frames it as lack of exit. This avoids explicit discussion of historical injustice.
    - Commuters' partial franchise might be granted partly to reduce traffic congestion protests, but the procedure cites specific harm.

  - **Relocates Boundary Problem:** 
    - The test still requires judging "comparable" exit routes and "narrow" harm, which are subjective. It pushes the boundary problem into these judgments.
    - The board, not the electorate, decides who is "affected" enough, but the procedure makes this explicit and structured.

  The procedure provides clear, defensible outcomes for this docket, including one grant that may be unpopular (displaced residents) and one partial grant that limits rights (commuters). The business denial is straightforward.
answer: |-
  **Operative Test:** A claimant belongs on the register only if the city can make that claimant worse off by rules the claimant had no part in making, and the claimant lacks any exit, avoidance, or counter-pressure route comparable to what people already on the register have.

  **Decision Procedure:**

  1. **Identify Claimant Type:**  
     - Ask: *Is the claimant an individual human or a defined group of individuals?*  
       - **Yes:** Proceed to Step 2.  
       - **No** (e.g., corporation, abstract entity): Proceed to Alternative Status (Step 6).  
     - *Sufficiency:* Claimant's legal form is clear from documents (e.g., petition, incorporation papers).  

  2. **Assess Harm Risk:**  
     - Ask: *Can the city, through its rules, make the claimant worse off?*  
       - **Yes:** Proceed to Step 3.  
       - **No:** Deny petition; outcome is **Denial with Explanation**.  
     - *Sufficiency:* Harm must be direct, material, and tied to city rules (e.g., taxes, regulations, enforcement). General or speculative harm (e.g., economic spillover) is insufficient.  

  3. **Evaluate Voice in Rule-Making:**  
     - Ask: *Does the claimant have a part in making the rules that affect them?*  
       - **No** (e.g., no vote, no representation): Proceed to Step 4.  
       - **Yes** (e.g., votes elsewhere, functional advocacy): Deny petition; outcome is **Denial with Explanation**.  
     - *Sufficiency:* "Part" means formal input (voting, consultation) or effective alternative influence (e.g., home-town representation for commuters).  

  4. **Test Exit/Avoidance Options:**  
     - Ask: *Does the claimant lack a comparable exit, avoidance, or counter-pressure route?*  
       - **Yes** (e.g., no relocation choice, no leverage): Outcome is **Full Franchise**.  
       - **No** (e.g., can move, sue, or exert pressure): Proceed to Step 5.  
     - *Sufficiency:* "Comparable" means similar to current electors (e.g., residents avoid harm by voting or moving). Evidence of feasibility required (e.g., job alternatives).  

  5. **Determine Scope of Harm:**  
     - Ask: *Is the harm narrow and tied to specific city functions?*  
       - **Yes** (e.g., only transit, only zoning): Outcome is **Partial Franchise** (vote limited to affected functions).  
       - **No** (broad impact): Outcome is **Referral to Council** (for broader solutions).  
     - *Sufficiency:* Harm is "narrow" if confined to 1–2 city services (e.g., policing, transit) with disproportionate impact on claimant.  

  6. **Alternative Status (for non-individuals or groups failing Step 1):**  
     - Ask: *Is the claimant’s interest directly and uniquely affected by city rules?*  
       - **Yes:** Outcome is **Consultative Status** (non-voting input, e.g., advisory seat).  
       - **No:** Deny petition; outcome is **Denial with Explanation**.  
     - *Sufficiency:* "Uniquely affected" means burden distinct from general public (e.g., business rates for firms).  

  **Outcome Menu:**  
  - **Full Franchise:** Added to register with vote in all city elections.  
  - **Partial Franchise:** Added with vote limited to specific issues (e.g., transit ballots). Scope must be defined (e.g., "voting rights for transit authority only").  
  - **Consultative Status:** Non-voting role (e.g., right to testify, advisory seat). Scope defined (e.g., "consulted on zoning").  
  - **Denial with Explanation:** Rejected; reasons must address claimant’s interests.  
  - **Referral to Council:** For remedies beyond board’s power (e.g., new offices, statute changes).  

  **Default Rule:** If evidence is balanced at any step, answer "no" and proceed.  
  **Re-opening Trigger:** Review granted status if: (1) city rules change materially affecting claimant, (2) claimant’s circumstances change (e.g., moves away), or (3) every 3 years.  
  **Boundary-Fixing Steps:** Steps 2, 4, and 5 define the board’s authority (cannot defer to electorate).  
  **Judgment Call Steps:** Step 4 (exit comparability) and Step 5 (harm scope) are discretionary; reasons must explain factors weighed.  

  ---

  **Application to Petitions:**  

  **1. Association of Commuters**  
  - **Outcome:** Partial Franchise (vote limited to transit and policing matters).  
  - **Published Reasons:** Commuters are harmed by city transit/policing rules and lack a vote. However, they have exit options (e.g., job changes) and counter-pressure (e.g., advocacy through employers). Their harm is narrow, so voting rights apply only to transit and policing.  
  - **Strongest Objection:** "We pay city taxes and endure daily burdens—we deserve a full vote."  
  - **Board’s Reply:** "Taxes alone do not justify full franchise; your mobility and external advocacy provide alternatives residents lack."  

  **2. Business Federation**  
  - **Outcome:** Consultative Status (non-voting input on licensing, zoning, and business rates).  
  - **Published Reasons:** Firms are not individuals and cannot vote. But they bear unique burdens from city rules, so they receive consultative input on relevant issues.  
  - **Strongest Objection:** "We employ city residents and fund services—votes by headcount are fair."  
  - **Board’s Reply:** "Firms have advocacy channels (e.g., lobbying); voting would distort resident representation."  

  **3. Displaced Former Residents and Descendants**  
  - **Outcome:** Referral to Council (for potential vote in redevelopment authority).  
  - **Published Reasons:** The group is harmed by city redevelopment rules and lacks voice or exit. But the harm is not narrow (impacts housing, heritage, economy), so the council must create a remedy.  
  - **Strongest Objection:** "We have a moral right to vote on land that was ours."  
  - **Board’s Reply:** "Your claim requires structural changes beyond our power; the council can address it."  

  ---

  **What the Procedure Cannot Do:**  
  - **Mishandles:** Petitions from transient groups (e.g., tourists) or future generations (exit test fails).  
  - **Correct but Unspoken:** Business denial avoids saying "corporations lack moral standing"; displaced referral hides "historical injustice merits reparations."  
  - **Relocates Boundary Problem:** Exit comparability (Step 4) and harm scope (Step 5) shift subjectivity to judges, who must weigh "feasibility" without clear standards.
