prompt: |-
  I work in software engineering, not philosophy, so I'll state the use case directly: I'm building a decision-support module for an engineering team. Given a pending decision (ship or hold a feature, buy or build a component, run the migration this quarter or next) and a candidate information-gathering action (an A/B test, a user survey, a load test, a vendor quote), the module should estimate the value of the information and compare it against the cost of acquiring it, so we can decide whether to run the test before we make the call. I keep running into a result usually attributed to I. J. Good — that under standard expected utility the expected value of free information is never negative — and before I read further I want the specification: what must a theory of the value of information deliver to count as adequate for backing a decision rule of the form "acquire this information at cost c only if its value exceeds c"?

  Write the desiderata list. For each requirement, give the case or consideration that motivates it, and mark which are non-negotiable (a theory that fails one is simply wrong) and which are preferences of a particular modeling camp. Below are the requirements I expect to see in the neighborhood; add the ones I haven't listed, and drop any of these that are actually prejudices rather than genuine desiderata, saying so.

  - It must derive the non-negativity result rather than assume it, and must say exactly which assumptions do the work — whether the agent is free to ignore the signal, whether preferences are fixed, whether processing the information is costless — because I need to know which of those my team actually satisfies.
  - It must separate value ex ante, before the result is seen, from value ex post, after it; the module reports a number before the test runs, and "the test came back bad" must not get logged as "information can have negative value."
  - It must handle information that changes what the agent wants, not just what the agent believes — a trial that reveals we actually hate the new UI — since the non-negativity result is usually stated for belief-only updates.
  - It must handle information about the agent's own preferences, and say whether self-discovery is the same channel as preference change in general or a different one.
  - It must treat value as defined relative to a decision problem rather than as an intrinsic property of the information, and say what happens when the same measurement is worth more to one decision than to another.
  - It must accommodate the value of information about information — the option value of learning now partly because it tells us whether to buy more information later — and say whether the non-negativity result survives that recursion.
  - It must handle information whose acquisition has side effects on what is being measured (the survey changes the users, the experiment changes the system), i.e., information that is not a passive observation.
  - It must be consistent with the fact that people and teams actually avoid information — skip the doctor's appointment, don't open the survey results — without either declaring the avoiders irrational or quietly giving up the non-negativity result; it should say where the negative-value cases live: cost, preference change, disutility of knowing, or a violation of one of the theorem's assumptions.

  Then two closing items. First, identify any subset of the requirements you think is jointly unsatisfiable — in particular, whether "preserve the non-negativity theorem as a core result" and "treat rational information avoidance as a first-class case" can both be met, and if so at the price of which assumption. That part matters most to me. Second, a brief scorecard: how do vanilla expected-utility decision theory, models that let information change preferences, and models of costly attention or information avoidance each do against the list? Keep the scorecard short; the requirements and the joint-satisfiability question are the point.
reasoning: |-
  We are building a decision-support module for an engineering team. The goal is to estimate the value of information (VoI) for a candidate action (like an A/B test) and compare it to the cost of acquiring that information. The module must decide whether to run the test before making the decision.

  We are given a list of requirements and considerations. We must:
  1. Write a list of desiderata for an adequate theory of the value of information.
  2. For each requirement, provide the case or consideration that motivates it, and mark whether it is non-negotiable or a modeling preference.
  3. Add any missing requirements and drop any that are prejudices.
  4. Address the joint satisfiability of preserving the non-negativity theorem and treating rational information avoidance, and note the price of assumptions.
  5. Provide a brief scorecard for vanilla expected utility, models with preference change, and models of costly attention.

  Let's break down the given requirements and then add/drop as needed.

  ### Given Requirements (with motivations and classification):

  1. **Non-negativity derivation and assumptions**:
     - **Motivation**: The non-negativity result (expected value of free information is non-negative) is central, but we must know exactly which assumptions are critical (e.g., freedom to ignore, fixed preferences, costless processing) because in practice, our team might not satisfy all of them.
     - **Non-negotiable?**: Yes. A theory that cannot derive this result (or explain its limitations) is inadequate for our purpose because we need to know when the result holds and when it doesn't.

  2. **Separation of ex ante and ex post value**:
     - **Motivation**: The module reports a number (ex ante value) before the test runs. We must not confuse this with the ex post value (after seeing the result). For example, if the test comes back "bad", it doesn't mean the information had negative value; the value is assessed before knowing the outcome.
     - **Non-negotiable?**: Yes. The module must compute an ex ante value for decision-making.

  3. **Handling preference changes**:
     - **Motivation**: Information can change what the agent wants (e.g., a trial reveals we hate the new UI). The standard non-negativity result is for belief updates only, so we need to extend to preference changes.
     - **Non-negotiable?**: Probably non-negotiable because in real-world engineering, learning can change our preferences (e.g., we discover a feature is not as desirable as we thought). However, note that classical VoI does not handle preference changes.

  4. **Handling self-discovery**:
     - **Motivation**: Information about one's own preferences (self-discovery) might be a special case of preference change or a distinct channel. We need clarity because in team settings, self-discovery (e.g., realizing we care more about stability than we thought) is common.
     - **Non-negotiable?**: Probably a modeling preference? But if the theory cannot handle self-discovery, it might be inadequate for our use case. We'll mark it as non-negotiable if it's essential for our scenarios.

  5. **Relativity to decision problem**:
     - **Motivation**: The value of information is relative to a specific decision problem. The same measurement (e.g., a load test) might be worth more for one decision (e.g., whether to scale) than for another (e.g., whether to change the database). The theory must account for this.
     - **Non-negotiable?**: Yes. The module must be able to compute VoI for a given pending decision.

  6. **Option value of information**:
     - **Motivation**: Sometimes we gather information now because it tells us whether to buy more information later (e.g., a preliminary A/B test might tell us if a more expensive test is warranted). The theory must handle recursion (value of information about information) and whether non-negativity holds in such cases.
     - **Non-negotiable?**: Non-negotiable because in practice, information gathering is often sequential. We need to know if the non-negativity result extends.

  7. **Handling information with side effects**:
     - **Motivation**: Some information gathering actions have side effects (e.g., a user survey might annoy users, an experiment might alter the system state). The information is not a passive observation. The theory must account for such cases.
     - **Non-negotiable?**: Non-negotiable because in engineering, many tests have side effects.

  8. **Consistency with information avoidance**:
     - **Motivation**: People and teams avoid information (e.g., skipping a doctor's appointment, not opening survey results). The theory must explain this without either:
       - Declaring the avoiders irrational (if they are rational, the theory must capture that), or
       - Abandoning the non-negativity result.
       It should identify where negative-value cases come from: cost, preference change, disutility of knowing, or violation of assumptions.
     - **Non-negotiable?**: Non-negotiable because we observe such behavior and want the theory to account for it without contradiction.

  ### Additional Requirements?

  We might add:

  9. **Tractability and computability**:
     - **Motivation**: The module must compute the VoI in practice. The theory should provide a framework that is computationally feasible for real-world engineering decisions.
     - **Non-negotiable?**: Preference of a modeling camp (some theories are more abstract). But for our use, it's essential. However, we are building a module, so we require a method that can be implemented.

  10. **Handling ambiguity and imprecision**:
      - **Motivation**: In engineering, we often deal with imperfect models and uncertainty about the information quality. The theory should account for the reliability of the information source.
      - **Non-negotiable?**: Probably non-negotiable because we must account for the quality of the test (e.g., an A/B test with low statistical power).

  But note: the original list is focused on foundational issues. We'll stick to the given ones and the ones that are critical for the use case.

  ### Dropping Prejudices?

  None of the given requirements seem to be prejudices. They are all motivated by practical concerns.

  ### Revised List of Desiderata:

  We'll keep the 8 given and add:

  9. **Computational tractability** (as a modeling preference, because we are building a software module).
  10. **Accounting for the quality/reliability of information** (non-negotiable, because without it we cannot correctly value noisy information).

  But note: requirement 1 (non-negativity derivation) might already cover the reliability if we consider the signal's noise as part of the assumptions. However, we make it explicit.

  So we have 10 requirements. However, let's integrate:

  - Requirement 10: **Handling noisy or imperfect information**:
    - **Motivation**: In practice, tests (A/B tests, surveys) are subject to errors. The value of information should account for the accuracy of the test.
    - **Non-negotiable?**: Yes, because without it, we might overvalue or undervalue the test.

  But note: the original non-negativity result in expected utility theory already accounts for noisy information (it's still non-negative). So maybe it's covered? But we require the theory to provide a way to compute the VoI for a given noise level.

  We'll add it as:

  **9. It must account for the reliability (noise, potential bias) of the information source.**

  Now, the list:

  1. Derive non-negativity and specify assumptions (non-negotiable).
  2. Separate ex ante and ex post value (non-negotiable).
  3. Handle information that changes preferences (non-negotiable?).
  4. Handle self-discovery and clarify if it's the same as general preference change (non-negotiable?).
  5. Define value relative to a decision problem (non-negotiable).
  6. Accommodate the option value of information (non-negotiable).
  7. Handle information with side effects (non-negotiable).
  8. Explain rational information avoidance without abandoning non-negativity (non-negotiable).
  9. Account for the reliability of the information (non-negotiable).
  10. Be computationally tractable for implementation (preference).

  But note: requirement 4 (self-discovery) might be a special case of 3. We can keep it if the theory must explicitly address self-discovery, but if 3 covers it, then 4 is redundant. We'll keep 4 because the original requirement specifically asks about self-discovery.

  ### Joint Satisfiability: Non-negativity and Information Avoidance

  The key question: Can we preserve the non-negativity theorem and also treat rational information avoidance?

  In standard expected utility (EU) theory, the expected value of information (EVI) is non-negative. This is because an agent can always ignore the information and act as if they didn't have it. So the worst case is that the information is useless and they are no worse off. Hence, EVI >= 0.

  But people avoid information. How can that be rational?

  We must look for cases that violate the assumptions of the non-negativity theorem. The theorem assumes:
  - The agent has fixed preferences (utility function).
  - The agent can freely ignore the information (so the information is costless to receive and the agent can conditionally choose the action that maximizes utility given the prior, without using the signal).
  - The information is free (no cost) and without side effects.

  Therefore, rational information avoidance can occur when:
  - There is a cost (monetary, time, cognitive) to acquiring the information. (Then even if EVI is non-negative, it might be less than the cost.)
  - The information acquisition has side effects that reduce utility (e.g., the survey annoys users).
  - The information might change the agent's preferences in a way that leads to regret or reduces utility (e.g., learning a painful truth that doesn't change the action but causes distress).
  - The agent has a disutility from knowing (e.g., anxiety from knowing a risk even if you can't change it).

  The non-negativity theorem still holds for the expected value of the information itself (the knowledge) in the absence of costs and side effects. But when we subtract costs and account for side effects, the net value can be negative.

  Moreover, if the information changes the agent's preferences, then the standard EU framework (with fixed preferences) does not apply. In that case, we might need a more general framework.

  So both can be met by:
  - Preserving the non-negativity of the EVI (the pure value of the signal) under the original assumptions.
  - Allowing the net value (EVI minus costs, plus any side effects) to be negative.
  - Accounting for preference changes and disutility of knowing by expanding the state space or using a different model.

  The price: We must relax the assumption of fixed preferences or include costs and side effects explicitly.

  ### Scorecard

  Now, a brief scorecard for three approaches:

  1. **Vanilla Expected Utility (EU) Decision Theory**:
     - Non-negativity: Yes, derives it (with assumptions: free, no side effects, fixed preferences, can ignore).
     - Ex ante vs ex post: Handles ex ante value (the expected value over possible signals).
     - Preference change: No. Assumes fixed preferences.
     - Self-discovery: No, same as above.
     - Relativity to decision: Yes, VoI is defined for a decision problem.
     - Option value: Can handle by sequential decision modeling (e.g., dynamic programming).
     - Side effects: Not directly; if the information gathering has side effects, they must be modeled as costs or state changes.
     - Information avoidance: Only through cost (if cost > EVI) or if the information is not free (but then it's net value negative, not the EVI itself). Cannot handle disutility of knowing or preference change.
     - Reliability: Handles by considering the signal's likelihood (Bayesian updating).
     - Tractability: Can be computationally intensive (especially for complex state spaces) but often tractable with approximations.

  2. **Models that let information change preferences**:
     - Non-negativity: May fail because the utility function changes. The old utility function might assign negative value to the change, but the new one might not. The derivation of non-negativity requires fixed preferences.
     - Ex ante vs ex post: Can define ex ante value, but it's tricky because the utility function changes.
     - Preference change: Yes, by design.
     - Self-discovery: Yes, as a form of preference change.
     - Relativity to decision: Can be defined, but the decision problem now includes the possibility of changing preferences.
     - Option value: Complicated by changing preferences.
     - Side effects: Can include them, but the modeling is more complex.
     - Information avoidance: Can explain avoidance if the change in preferences leads to lower ex ante expected utility (according to the original preferences) or if there is a disutility from the change itself.
     - Reliability: Can be incorporated.
     - Tractability: More complex, less tractable.

  3. **Models of costly attention or information avoidance**:
     - These include costs of acquisition, processing, and sometimes disutility from knowing.
     - Non-negativity: The pure EVI might still be non-negative, but the net value (EVI minus cost) can be negative.
     - Ex ante vs ex post: Handles ex ante.
     - Preference change: Typically not, unless combined.
     - Self-discovery: Not typically.
     - Relativity to decision: Yes.
     - Option value: Can be incorporated in sequential models with costs.
     - Side effects: Can include costs and side effects as negative utilities.
     - Information avoidance: Yes, when costs exceed EVI or when there is disutility.
     - Reliability: Yes.
     - Tractability: Often tractable.

  ### Final List of Desiderata with Motivations and Classification

  We now write the list:

  1. **Derivation of non-negativity with explicit assumptions**:
     - Motivation: To know when the result holds and when it doesn't in our context.
     - Non-negotiable: Yes.

  2. **Separation of ex ante and ex post value**:
     - Motivation: The module must compute and report the ex ante value.
     - Non-negotiable: Yes.

  3. **Handling preference change due to information**:
     - Motivation: Real-world tests can change what we want (e.g., we learn we hate a feature we thought we'd like).
     - Non-negotiable: Yes (because it happens in practice and we must account for it).

  4. **Handling self-discovery as a specific form of preference change**:
     - Motivation: Learning about one's own preferences is common and may have unique characteristics.
     - Non-negotiable: Yes (if self-discovery is a common scenario).

  5. **Relativity to the decision problem**:
     - Motivation: The same information can have different values for different decisions.
     - Non-negotiable: Yes.

  6. **Accommodating option value (recursive VoI)**:
     - Motivation: Information can lead to further information gathering.
     - Non-negotiable: Yes.

  7. **Handling information with side effects**:
     - Motivation: Tests can alter the system or user behavior.
     - Non-negotiable: Yes.

  8. **Consistency with rational information avoidance**:
     - Motivation: We observe avoidance and want to model it without contradiction.
     - Non-negotiable: Yes.

  9. **Accounting for reliability of information (noise, bias)**:
     - Motivation: Tests are imperfect and we must account for that in valuation.
     - Non-negotiable: Yes.

  10. **Computational tractability**:
      - Motivation: We are building a software module; the method must be implementable.
      - Non-negotiable: No (preference; but highly desired).

  ### Joint Satisfiability

  We can preserve the non-negativity of the pure EVI (under the original assumptions) and also account for rational information avoidance by:

  - Allowing the net value of information (which includes costs, side effects, and disutility) to be negative.
  - Using an expanded model for preference changes (if they occur) that might show that the information leads to a change that, from the ex ante perspective, is undesirable.

  The non-negativity result for pure information (without costs, side effects, and with fixed preferences) remains intact. The negative cases come from:
  - Costs of acquisition and processing.
  - Side effects of measurement.
  - Disutility from knowing (which can be modeled as a cost or a state change).
  - Preference changes that, according to the ex ante preferences, are undesirable.

  The price: We must explicitly model costs, side effects, and possibly changing preferences.

  ### Scorecard Summary

  - **Vanilla EU**: 
    - Good: 1,2,5,6,9 (with effort), and 10 (tractable for many cases).
    - Bad: 3,4,7 (unless modeled as costs), 8 (only by cost, not by disutility or preference change).
  - **Preference Change Models**:
    - Good: 3,4,5,9.
    - Bad: 1 (non-negativity may not hold in the original form), 2 (ex ante becomes tricky), 6,7,8 (might handle), 10 (less tractable).
  - **Costly Attention/Information Avoidance Models**:
    - Good: 1 (if we separate pure EVI), 2,5,6 (with sequential models), 7 (as costs), 8 (handles avoidance via costs), 9,10.
    - Bad: 3,4 (unless extended).

  For our use case, we might need a hybrid model that incorporates:
  - Fixed preferences for the core non-negativity, but allowing for disutility of knowing (as a cost) and side effects.
  - Or a model that can handle preference changes and still provide a consistent ex ante VoI.

  But note: the requirement for preference change is non-negotiable. Therefore, vanilla EU is insufficient. We must extend beyond it.

  Final note: The non-negativity result in its standard form (for pure information with fixed preferences) remains a cornerstone, but we must account for violations of the assumptions in practice.
answer: |-
  ### Desiderata for a Theory of the Value of Information (VoI)  
  Below is the refined list of requirements for an adequate VoI theory to support your decision rule "acquire information at cost \(c\) only if its value exceeds \(c\)". Each requirement includes:  
  - **Motivation**: The practical engineering case or consideration.  
  - **Classification**: Non-negotiable (failing it invalidates the theory) or Modeling Preference (specific to a camp).  
  - **Additions/Drops**: One new requirement added; no prejudices dropped (all given requirements are genuine).  

  #### 1. **Derive Non-Negativity from Explicit Assumptions**  
     - **Motivation**: The I. J. Good theorem (expected VoI ≥ 0 for free information) must be derived, not assumed. Engineering teams need to know which assumptions (e.g., freedom to ignore signals, fixed preferences, zero processing cost) apply to their context. If the team violates an assumption (e.g., preferences shift mid-test), the result may not hold.  
     - **Classification**: Non-negotiable. A theory that cannot derive or contextualize non-negativity fails at its core task.  

  #### 2. **Distinguish Ex Ante vs. Ex Post Value**  
     - **Motivation**: The module reports an ex ante value (pre-test) to justify the cost. Confusing this with ex post value (e.g., "the test came back bad") could misattribute negative outcomes to the information itself, discouraging valuable tests.  
     - **Classification**: Non-negotiable. The module’s output is ex ante; conflating the two undermines decision support.  

  #### 3. **Handle Preference-Changing Information**  
     - **Motivation**: Tests (e.g., a UI trial) can reveal that users hate a feature, changing what the team "wants." Standard VoI assumes fixed preferences; ignoring preference changes risks overvaluing harmful information (e.g., running a test that kills user trust).  
     - **Classification**: Non-negotiable. Real-world engineering decisions involve learning about preferences (e.g., usability vs. performance tradeoffs).  

  #### 4. **Handle Self-Discovery (as Distinct from General Preference Change)**  
     - **Motivation**: Information about the team’s own capabilities (e.g., "we underestimated our migration skills") may affect decisions differently than external preference changes (e.g., "users hate this"). The theory must clarify if self-discovery is a unique channel (e.g., due to incomplete self-knowledge) or subsumed under preference change.  
     - **Classification**: Modeling Preference. Self-discovery is common in teams (e.g., skill audits), but its uniqueness depends on the theory’s treatment of identity and beliefs.  

  #### 5. **Define Value Relative to a Specific Decision Problem**  
     - **Motivation**: The same information (e.g., a load test) may have high value for one decision (e.g., "scale servers?") but low value for another (e.g., "change database?"). The theory must output context-dependent VoI, not intrinsic worth.  
     - **Classification**: Non-negotiable. The module must prioritize actions based on the pending decision.  

  #### 6. **Accommodate Option Value of Information**  
     - **Motivation**: Gathering information now (e.g., a cheap A/B test) may enable better decisions about future information (e.g., whether to run an expensive survey). The theory must handle recursive VoI and confirm if non-negativity extends to sequential information gathering.  
     - **Classification**: Non-negotiable. Engineering decisions are often sequential; ignoring option value undervalues information.  

  #### 7. **Handle Information with Side Effects**  
     - **Motivation**: Tests like user surveys can alter behavior (e.g., survey fatigue) or system state (e.g., an experiment degrades performance). Passive observation is unrealistic; VoI must net out measurement distortions.  
     - **Classification**: Non-negotiable. Engineering actions are interventions, not pure observations.  

  #### 8. **Explain Rational Information Avoidance Without Abandoning Non-Negativity**  
     - **Motivation**: Teams skip tests (e.g., ignore user feedback) to avoid costs (e.g., delays) or emotional toll (e.g., "bad news anxiety"). The theory must reconcile this with non-negativity by pinpointing causes: costs, preference shifts, disutility of knowing, or violated assumptions (e.g., inability to ignore signals).  
     - **Classification**: Non-negotiable. Invalidating avoidance or non-negativity makes the theory unusable.  

  #### 9. **Account for Information Reliability** *(Added Requirement)*  
     - **Motivation**: Noisy or biased information (e.g., an inconclusive A/B test, a skewed user survey) affects VoI. The theory must incorporate reliability metrics (e.g., Bayesian likelihoods) to avoid overpaying for low-quality data.  
     - **Classification**: Non-negotiable. Engineering tests are imperfect; ignoring reliability misprices information.  

  ---  
  ### Joint Satisfiability: Non-Negativity vs. Information Avoidance  
  **Can both be satisfied?** **Yes**, at the price of relaxing two assumptions:  
  1. **Costless information**: Non-negativity holds only for *free* information. Avoidance occurs when costs (acquisition, processing, or emotional) exceed ex ante VoI.  
  2. **Fixed preferences**: If information changes preferences (e.g., learning a truth causes distress), avoidance can be rational. Ex ante VoI may still be non-negative under original preferences, but the net effect (including preference shifts) can be negative.  

  **Where negative-value cases live**:  
  - **Costs**: Direct costs (e.g., running the test) or opportunity costs (e.g., delayed shipping).  
  - **Preference change**: Information makes the agent worse off by their *new* preferences (e.g., regret from knowing).  
  - **Disutility of knowing**: Anxiety or distraction from acquiring the information, modeled as a cost.  
  - **Violated assumptions**: Side effects (e.g., the test alters the system) or inability to ignore signals.  

  **Outcome**: Non-negativity holds for the *pure* value of the signal under ideal conditions (free, no side effects, fixed preferences). Negative *net* VoI arises from costs/preference changes, preserving both theorems and avoidance.  

  ---  
  ### Scorecard: How Theories Perform  
  | **Requirement**                          | **Vanilla Expected Utility**                              | **Models with Preference Change**                         | **Costly Attention/Information Avoidance**            |  
  |------------------------------------------|-----------------------------------------------------------|-----------------------------------------------------------|-------------------------------------------------------|  
  | **1. Derive non-negativity**             | Excellent: Derives it under core assumptions.             | Poor: Non-negativity fails if preferences shift.          | Good: Preserves it for free info, net value may be <0.|  
  | **2. Ex ante vs. ex post separation**    | Excellent: Clear distinction via expectation.             | Good: Possible, but messy with changing utilities.        | Excellent: Explicit in cost-benefit calculus.         |  
  | **3. Preference-changing info**         | Fail: Assumes fixed preferences.                          | Excellent: Handles endogenous preference shifts.          | Fail: Ignores preference dynamics.                    |  
  | **4. Self-discovery**                   | Fail: No self-modeling.                                   | Good: Can treat as preference change.                     | Poor: Limited to attention costs.                     |  
  | **5. Decision-relative value**          | Excellent: VoI is defined per decision problem.           | Good: Context-dependent.                                  | Excellent: Costs tied to decisions.                   |  
  | **6. Option value**                     | Good: Handled via dynamic programming.                    | Fair: Complexity increases with preference uncertainty.   | Good: Explicit in sequential models.                  |  
  | **7. Side effects**                     | Poor: Assumes passive observation.                        | Good: Can model as part of state.                         | Excellent: Costs capture distortions.                 |  
  | **8. Rational avoidance**               | Poor: Labels avoidance irrational.                        | Good: Explains via preference shifts.                     | Excellent: Avoidance when costs > VoI.                |  
  | **9. Reliability**                      | Good: Bayesian updating handles noise.                    | Good: Reliability affects belief/preference updates.      | Good: Reliability modulates costs.                    |  

  **Summary**:  
  - **Vanilla expected utility** excels at non-negativity and decision-relativity but fails on preference change, avoidance, and side effects. Best for simple, belief-only updates.  
  - **Preference change models** handle self-discovery and avoidance but struggle with non-negativity and option value. Ideal for complex, value-learning scenarios.  
  - **Costly attention models** explain avoidance and side effects (as costs) but ignore preference dynamics. Best for resource-constrained teams.  

  **Recommendation**: Hybridize. Use vanilla EU for core non-negativity and option value, but extend it to include:  
  - Explicit costs (acquisition, processing, emotional).  
  - A "preference state" that can evolve with information.  
  This satisfies all non-negotiables while preserving the non-negativity theorem where assumptions hold.
