prompt: |-
  A friend and I argued for an hour about slot machines and got nowhere, so I'd like a more disciplined answer than either of us produced. The regulatory practice runs like this: a machine is licensed on the strength of its arithmetic rather than its history. The manufacturer files a worksheet giving the theoretical payback percentage, the testing lab examines the pay table and the number generator, and the machine goes onto the floor. Everyone agrees its realized payout over any realistic stretch will diverge from the filed figure, sometimes widely, and that this is expected; but if the divergence is large and persistent, the machine is treated as malfunctioning and pulled — not as evidence that the filed figure was mistaken. Meanwhile the same industry spends heavily on destroying information: continuous shufflers, early shoe cuts, and the ejection of card counters, all so that no player can acquire evidence bearing on the odds of the next hand.

  What account of chance does this presuppose? It looks like a single-case propensity built into the device before it has produced any outcomes, plus Lewis's Principal Principle as the bridge from chance to credence. Yet a machine's generator is a deterministic algorithm, so the filed figure is really a calibrated measure of the player's ignorance — which suggests these are ideal credences rather than objective chances, and that the industry's evidential hygiene is a tacit admission of it. Take the three readings (propensity, best-system frequency, idealized epistemic probability for a specified kind of agent) and say which the practice could actually run on. Which features does each license, and which does each leave inexplicable — in particular, why the divergence test pushes toward "broken machine" rather than "wrong chance," and why a counter is ejected instead of simply out-bet. Distinguish what the practice strictly requires from what it merely fits comfortably, mark where it is underdetermined between rival theories, and say what would have to change in the certification regime if we abandoned the Principal Principle and instead required credences to track total evidence.
reasoning: |-
  Okay, the user and their friend had a long argument about slot machines, specifically around how regulatory practices treat theoretical payback percentages versus actual outcomes. They want a disciplined analysis of the underlying concept of chance involved here. Let me start by breaking down the key points from their query.

  First, the regulatory side: slot machines are certified based on their design—arithmetic models and RNGs—before they even hit the casino floor. The theoretical percentage is what's filed, and even if actual payouts diverge significantly over time, that doesn't mean the initial figure was wrong; instead, the machine is considered malfunctioning. This suggests that the chance is seen as inherent to the machine's setup, not based on outcomes.

  Then there's the casino's behavior: they use continuous shufflers, cut shoes early, and eject card counters. These practices prevent players from gathering information that could predict future outcomes. The question is, what does this say about the nature of chance? Is it propensity, frequentist, or epistemic probability?

  The user mentions three readings: propensity theory, best-system frequency, and idealized epistemic probability. I need to evaluate each against the regulatory practices. 

  Starting with propensity theory: chances are inherent properties of the device. This fits the certification process—manufacturers set the RNG to have a certain propensity to pay out. The divergence test makes sense here because a malfunction means the propensity isn't being realized. But casinos' info suppression seems odd here. Why stop players from learning if the chances are objective? That's a problem for propensity.

  Best-system frequency: chances as patterns in outcomes over time. But the regulatory body doesn't wait for long-term frequencies to certify machines. They rely on the design specs. Also, divergence isn't seen as a wrong model but a broken machine. That misalignment is a red flag. Casinos suppressing info fits better here to avoid revealing exploitable patterns, but the initial certification doesn't rely on frequencies.

  Idealized epistemic probability: chances as rational credences given all physical info. This explains why the filed figure is based on RNG specs—it's the best possible knowledge. The divergence test flags anomalies in the mechanism. Casinos' practices make perfect sense here; they're preventing players from gaining the knowledge needed to form better credences. Ejecting counters instead of adjusting bets aligns because it's about controlling information asymmetry.

  The Principal Principle (PP) links objective chance to rational credence. If chances are epistemic, PP still applies but with a twist. If we drop PP and require credences based on total evidence, casinos would need to adjust odds dynamically to counter informed players, which isn't feasible. Hence, they suppress information instead.

  So, epistemic probability fits best. It explains certification based on design, divergence as malfunction, and info suppression. Propensity struggles with info control, and frequentism clashes with pre-outcome certification. The user's deeper need might be understanding how regulatory practices implicitly define chance, especially the tension between fixed chances and adaptive player knowledge.
answer: |-
  The regulatory practice and casino countermeasures you describe rest on a specific, hybrid account of chance that blends elements of propensity theory and idealized epistemic probability, with the Principal Principle serving as a crucial bridge. Here's a disciplined breakdown, analyzing each theory against the practice's requirements:

  ### 1. **Propensity Theory (Single-Case)**
     - **Core Idea**: Chances are objective, physical dispositions inherent in a device/system to produce outcomes.
     - **Fits Practice**:
       - Certification relies on the machine's *design* (RNG algorithm, physical components) *before any outcomes occur*. The "propensity" is certified based on blueprints, not history.
       - Divergence is treated as a *malfunction*: The device fails to manifest its inherent propensity due to physical defect (e.g., RNG error, stuck reel).
     - **Inexplicable/Contradicted**:
       - Why destroy information? If chances are objective physical properties, players learning about them shouldn't alter the odds. Ejecting counters makes no sense under pure propensity.
       - Determinism: Slot RNGs are pseudorandom (deterministic algorithms). A deterministic system has no *physical* propensity for variation; outcomes are fixed by initial state + algorithm. This undermines objective single-case propensity.

  ### 2. **Best-System Frequency (Humean/Reductionist)**
     - **Core Idea**: Chances are patterns in actual frequencies over time, identified by the "best system" balancing simplicity and strength.
     - **Fits Practice**:
       - Casinos' information destruction aims to *prevent stable frequencies* from emerging (e.g., card counting exploits short-term frequency deviations). This protects the "house edge" frequency pattern.
     - **Inexplicable/Contradicted**:
       - **Certification precedes history**: Machines are licensed *before* any spins occur, based on theoretical math, not observed frequencies. The "best system" can't exist without data.
       - **Divergence as malfunction, not wrong model**: If a machine pays 70% over 1M spins despite a 95% filing, a frequentist should conclude the *chance was wrong*, not that the machine is broken. The practice treats the filed figure as metaphysically prior to outcomes.
       - Ejection of counters: Frequentism licenses exploiting observed frequencies; casinos actively prevent this, suggesting chance isn't *just* the pattern.

  ### 3. **Idealized Epistemic Probability**
     - **Core Idea**: "Chance" is the rational credence for a logically omniscient agent with *complete knowledge of the physical setup* (but not future outcomes).
     - **Fits Practice Perfectly**:
       - **Certification**: The filed percentage *is* this idealized credence. It's calculated from RNG specs/paytable – the "complete knowledge" of the device.
       - **Divergence test**: Large/persistent divergence signals the *physical setup has changed* (malfunction), meaning the agent's knowledge no longer matches reality. Updating credences without fixing the machine would be irrational.
       - **Information destruction**: Casinos prevent players from approaching the *idealized epistemic state*. Counters gain extra knowledge (card distribution), refining their credences *beyond* the house's "baseline" idealization. Ejection resets the player to the intended state of ignorance.
       - **Determinism**: Perfectly compatible. The "chance" is a measure of *ignorance* of the deterministic process's initial conditions.

  ### Key Features Explained
  - **Divergence → "Broken", not "Wrong Chance"**:  
    Only **Epistemic** and **Propensity** theories explain this. The filed value is an inherent property (of design or physical disposition). Divergence implies the *property isn't manifesting* due to corruption. Frequentism would require updating the chance estimate.  
    *Underdetermined*: Both Epistemic and Propensity fit, but Propensity struggles with determinism/countermeasures.

  - **Ejecting Counters vs. Out-Betting**:  
    Only **Epistemic** theory fully explains this. Casinos maintain the *epistemic conditions* under which the "chance" (idealized credence) holds. Letting counters play acknowledges their credences are *truer* (closer to actual physical state), undermining the game's profit model. Out-betting doesn't solve this – the counter still has an edge.  
    *Propensity* can't explain why knowledge matters; *Frequentism* suggests casinos should adjust odds dynamically.

  ### Role of Principal Principle (PP)
  - **Practice Requires PP**: Casinos/regulators assume rational credences *should* align with the filed chance (absent other evidence). Players are meant to adopt the filed % as their credence. This is PP in action.
  - **Without PP (Credences Track Total Evidence)**:
    - Certification would be meaningless. Players would (rightly) ignore the filed % and base credences on observed outcomes/patterns.
    - Casinos could not rely on the theoretical edge; they'd need real-time odds adjustment to counter informed players.
    - The divergence test would focus on *recalibrating the chance estimate*, not finding malfunctions.
    - **Regime Change Necessity**: Certification would shift to *performance auditing* (long-run frequencies). Machines with "bad luck" would be deemed "miscalibrated," not broken. Information suppression would lose its rationale.

  ### Conclusion
  - **Strict Requirement**: The practice **requires** the Principal Principle to link the filed figure to rational credence. It also requires chance to be **pre-outcome and device-inherent** (ruling out pure Frequentism).
  - **Best Fit**: **Idealized Epistemic Probability** is the only theory explaining *all* features (pre-outcome certification, divergence-as-malfunction, information destruction, counter ejection, compatibility with determinism). The "chance" is the credence of a hypothetical agent knowing the RNG's code and initial seed.
  - **Comfortable Fit**: **Propensity Theory** explains certification and divergence but is strained by determinism and information control.
  - **Poor Fit**: **Best-System Frequentism** fundamentally conflicts with pre-outcome certification and the interpretation of divergence.
  - **Underdetermination**: The divergence test doesn't distinguish Propensity from Epistemic, but casino countermeasures decisively favor Epistemic.

  The industry's "evidential hygiene" is indeed a tacit admission that their "chances" are epistemic constructs designed for profit, stabilized by controlling access to physical information – not objective features of the world. The regulatory apparatus enforces this epistemic idealization as if it were a physical law.
