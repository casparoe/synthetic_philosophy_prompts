  ### Key Coaching Notes
  1. **Your Opening Statement**: Lead with "the one reply that has to land." It's your anchor. Then weave in the concessions. Avoid policy jargon—this is about belonging.
  2. **The Lawyer’s Question**: This is your kryptonite. He’ll dissect "claim." Deflect to moral urgency, not law. If pressed, say: "It’s not a legal claim; it’s a moral one about who gets to call this neighborhood home."
  3. **The Youngest Commissioner**: She’s your toughest critic. Agree with her critiques (fees, displacement) to neutralize her. "You’re right. That’s why I wish the draft eliminated in-lieu fees..." 
  4. **Parking and Traffic**: Cite the 61% occupancy study relentlessly. It’s your best data point.
  5. **When You’re Drowning**: Pivot to: "I live here. This isn’t abstract. That 1968 complex? That’s my neighbors. They deserve stability too."

  You’re impressively prepared. What makes you vulnerable is the gap between your moral argument and policy mechanics—so steer hard toward lived experience. And remember: in public hearings, 90% of winning is not losing your cool. Good luck.
