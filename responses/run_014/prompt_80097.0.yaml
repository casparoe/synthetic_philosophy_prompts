answer: |-
  ### Facilitator's Run-Sheet: The Self-Fulfilling Sea Battle  
  **Objective:** Students experience the tension of future contingents through a self-referential bet where the outcome (a "sea battle") is determined by their collective bets. Key tension: Their bets fix the future, making it feel "already settled," undermining the sense of agency.

  ---

  ### **Rules (Precise Instructions for Oracle/TA)**  
  **Materials Needed:**  
  - 14 blank cards and pens.  
  - A sealed box (e.g., shoebox with a slit) for secret ballot collection.  
  - 42 tokens (e.g., poker chips, paper clips, or tally marks on paper); 3 tokens per student at start.  
  - Whiteboard to record announcements.  

  **Setup:**  
  - Designate yourself as the "Oracle" (facilitator/TA). No other roles needed.  
  - Students sit at desks with no shared tables to prevent collaboration.  

  **Core Rule:**  
  > *"There will be a sea battle tomorrow if and only if at least 8 of you bet ‘YES’ in this round. Your bets determine the outcome."*  

  **Betting Mechanics:**  
  1. **Simultaneous & Secret Commitment:**  
     - Distribute one card and one pen to each student.  
     - Students write **their name**, their bet (**YES** or **NO**), and place the card in the box.  
     - **Enforce silence and no discussion.** Students may not reveal their bets.  
     - All cards must be submitted within 90 seconds (use a timer).  

  2. **Token Stakes:**  
     - Each student **must contribute one token** to bet. They place the token in a separate jar *before* writing their card.  
     - **Payoff:**  
       - Correct bet: Win 2 tokens (net +1 token).  
       - Incorrect bet: Lose the staked token (net -1 token).  
     - *Why stakes matter:* Without real cost (e.g., tokens), students bet arbitrarily. Stakes force them to confront the risk of being wrong and the illusion of control.  

  3. **Outcome Enforcement (Oracle’s Role):**  
     - After all cards are submitted, publicly count the YES votes.  
     - **Threshold Rule:**  
       - YES votes ≥ 8 → Sea battle occurs (outcome is YES).  
       - YES votes < 8 → No sea battle (outcome is NO).  
     - Announce:  
       - Number of YES votes.  
       - Whether the sea battle happens.  
       - Payoffs (e.g., *"7 YES votes. Threshold not met. No sea battle. YES bettors lose tokens; NO bettors win."*).  
     - Distribute tokens immediately.  

  **Tiebreaker/Edge Cases:**  
  - If a student refuses to bet, they lose one token automatically (enforce commitment to bivalence).  
  - Quorum: All 14 must bet (no abstentions).  

  ---

  ### **Timeline (75 Minutes Total)**  
  - **0:00–0:05 (5 min): Setup & Rules**  
    - Explain rules, stakes, and self-referential outcome. Emphasize: *"Your bets directly cause or prevent the sea battle."*  
    - Distribute tokens (3 per student) and materials.  

  - **0:05–0:15 (10 min): Round 1 Betting**  
    - Start timer. Students stake one token, then write and submit bets in silence.  
    - Oracle collects box, counts votes, announces outcome, and distributes tokens.  

  - **0:15–0:25 (10 min): Round 2 Betting**  
    - Repeat Round 1. *Do not debrief between rounds.*  

  - **0:25–1:15 (50 min): Structured Debrief**  
    - Follow the guide below.  

  ---

  ### **Debrief (50 Minutes)**  
  **Goal:** Students articulate the tension between bivalence, fixed futures, and agency. Map activity moments to philosophical concepts.  

  1. **Initial Reactions (5 min):**  
     - Ask: *"How did you decide your bet? What felt uncertain?"*  
     - **Map to bivalence:** Highlight that they *had* to choose YES/NO—no middle ground. This mirrors the law of excluded middle (future must be true or false now).  

  2. **The "Settlement" Moment (10 min):**  
     - Ask: *"When was the outcome decided? When you bet? When the Oracle counted?"*  
     - **Key insight:** Outcome was fixed the moment bets were submitted (but unknown until revealed). Point out: *"If the future is fixed by your bets, is there any ‘choice’ left? Or are you just revealing what’s settled?"*  
     - **Map to "already settled":** This moment bites—students see their bets made the future inevitable, reducing agency to "mere revelation."  

  3. **Agency vs. Illusion (15 min):**  
     - Ask: *"Did your bet feel like it influenced the outcome? What if you were the 8th YES vote?"*  
     - **Map to agency:** In self-referential cases, bets *are* the causal mechanism. But ask: *"Could you have changed the outcome if you knew others’ bets? If not, was your ‘decision’ an illusion?"*  
     - Contrast with fatalism: If the future is fixed (even without self-reference), agency feels hollow.  

  4. **Contrast with Genuine Contingents (15 min):**  
     - **Admit the activity’s limit:** *"Here, the future was fixed by your actions. But what about a real sea battle—one not decided by bets? E.g., a battle depending on weather or admiral’s choice."*  
     - **Bridge to the general problem:**  
       - Activity shows: If future is fixed (by bets), agency is undermined.  
       - General problem: Even if *not* self-referential, claiming a future contingent is "true or false now" implies a fixed future, threatening agency.  
     - Ask: *"Does treating unknowable futures as ‘true or false’ rob us of freedom? Or is it just how logic works?"*  

  5. **Synthesis (5 min):**  
     - Restate the tension: Bivalence demands futures be true/false now, but this clashes with open futures and agency.  
     - Preview next steps: *"This is the ‘sea-battle problem.’ Next, we’ll see how logicians resolve it."*  

  ---

  ### **Predictable Problems & Solutions**  
  - **Collusion/Communication:**  
    - Students whisper strategies (e.g., *"All bet NO to guarantee win!"*).  
    - **Solution:** Enforce silence strictly. If violated, note in debrief: *"Collusion makes the future even more settled—did that feel freeing or constraining?"*  

  - **Refusal to Commit:**  
    - A student insists: *"I don’t know, so I won’t bet."*  
    - **Solution:** Enforce the rule: Abstention costs a token. Argue: *"Future contingents force a choice—even ‘maybe’ implies a truth value."*  

  - **Coordination Loop:**  
    - Students overthink: *"If I bet YES, but others don’t, I lose tokens—but if everyone does this, we lose the battle!"*  
    - **Solution:** Let frustration happen. In debrief, highlight: *"This loop exposes how ‘fixing’ the future traps you."*  

  - **No Tension Felt:**  
    - Votes lopsided (e.g., 14 YES).  
    - **Solution:** In debrief, ask: *"What if it was 7-7? Would uncertainty feel different? Why?"*  

  ---

  ### **What the Activity Cannot Do (Frank Note)**  
  **The Gap:** This activity models a **self-referential future contingent** (outcome fixed by present beliefs). It *cannot* directly simulate **genuine open contingents** (e.g., a sea battle decided by tomorrow’s weather).  

  **What You Must Add in Debrief:**  
  - Contrast self-referential cases (like this activity) with non-self-referential cases (e.g., an eclipse predictable by natural laws).  
  - Argue: The sea-battle problem arises when we **extend bivalence to genuinely open futures**. Even without self-reference, calling a future contingent "true now" implies determinism.  
  - Emphasize: *"Self-referential cases are special—they ‘settle’ the future. But the logical problem is broader: Does labeling *any* future event ‘true’ or ‘false’ today rob us of agency? That’s the fatalist threat."*  

  ---

  **Final Note:** This activity forces students to *live* the tension. The tokens make stakes visceral, the self-reference makes the "fixed future" undeniable, and the debrief ties it to the sea-battle argument. Run it cold—it’s designed for clarity.
