     2. Set up the room so that participants can come up one by one to draw a token from the bag without seeing inside.

  **Rules Explanation:**
     - "We have two possible urns: Urn A has 20 tokens numbered 1-20. Urn B has 200 tokens numbered 1-200. I flipped a fair coin to choose one. The coin flip was recorded and sealed. Now, each of you will come up and draw one token from the bag (without replacement). Keep your number secret. After everyone has drawn, I will ask you to write down your probability that we are drawing from Urn A. This should be a number between 0% and 100%. We will then reveal the true urn and score you using a rule that rewards accurate probabilities: if you assign probability p to the true urn, your score will be 1 - (1-p)^2 if the true urn is A, and 1 - p^2 if the true urn is B. So if you are 100% sure and correct, you get 1 point. If you are 50% and it's A, you get 1 - (0.5)^2 = 0.75 points. We want to reward honesty and accuracy."

