     - Open the sealed envelope to reveal the true urn.
     - For each participant, compute their score using the quadratic scoring rule for the event "Urn A is true". If they assigned probability p (expressed as a fraction) to A:
          If A is true: score = 1 - (1-p)**2
          If B is true: score = 1 - p**2
