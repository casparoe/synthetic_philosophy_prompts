     - Additionally, the game assumes that we are randomly sampled from the entire human population. The real objection about the sampling being non-random (because we are alive now) is crucial and we must highlight that.

  **Full Runnable Version:**

  **Materials Preparation:**
     - Prepare two sets:
          Set A: 20 tokens (pieces of paper) numbered 1 to 20.
          Set B: 200 tokens numbered 1 to 200.
     - Two opaque bags or containers.
     - A coin.
     - Sealed envelope to record the coin flip result and which urn was chosen.
     - Scorecards for participants to write their probability.

