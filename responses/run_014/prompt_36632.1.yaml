answer: |-
  Here is a distilled standard of adequacy for an account of realization, designed to serve as your students' evaluative framework. Each requirement includes its core motivation and the philosophical case driving it. Following the list is an analysis of tensions, biases, and the most exclusionary requirement.

  ---

  **Standard of Adequacy: What a Functionalist Account of Realization Must Deliver**

  1.  **Robust Multiple Realizability (Cross-Classification):**
      *   *Requirement:* The account must permit both (a) a single physical base to realize multiple distinct higher-level properties ("one-realizer/many-realized") and (b) a single higher-level property to be realized by diverse, heterogeneous physical bases ("one-realized/many-realizers"). Realization must not entail type identity between the realized property and its realizer(s).
      *   *Motivating Case:* The core functionalist intuition: psychological states (e.g., pain) or biological properties (e.g., being a heart) are defined by their causal role, which can be played by vastly different physical structures (neurons, silicon, alien goo; muscle tissue, mechanical pump). Conversely, one complex physical structure (e.g., a specific neural pattern) might simultaneously realize distinct functional roles (e.g., pain *and* a memory trigger).

  2.  **Non-Reductive Autonomy:**
      *   *Requirement:* The account must ground the genuine autonomy of special science explanations and laws. Explanations at the psychological, biological, social, etc., levels must be irreducible *in principle* to purely physical explanations, without this entailing dualism or causal overdetermination.
      *   *Motivating Case:* The need to block "causal exclusion" arguments that threaten to render higher-level properties epiphenomenal or redundant. If realization collapses into identity or mere composition, the distinctive explanatory power and predictive success of special sciences become inexplicable or illusory.

  3.  **Causal Inheritance without Collapse:**
      *   *Requirement:* The account must explain the intuition that the causal powers of a realized property F are "inherited from" or "determined by" the causal powers of its realizer P, *without* this implying that F *is* P or that F's causal efficacy is "screened off" by P.
      *   *Motivating Case:* The apparent causal efficacy of higher-level properties (a belief causing an action, a gene causing a trait) must be grounded in physical reality. However, if inheritance means the realized property *just is* the realizer under a different description, or adds nothing causally, autonomy (Requirement 2) is lost. The account must navigate between epiphenomenalism and reductionism.

  4.  **Conceptual Distinction from Neighbors:**
      *   *Requirement:* The account must clearly differentiate realization from causation, supervenience, token identity, and mechanistic constitution. It must specify what realization *adds* beyond mere covariance (supervenience), part-whole relations (constitution), sequence (causation), or token correspondence (token identity).
      *   *Motivating Case:* Conceptual confusion is rampant. Is realization just supervenience+? Is it token identity? Is it a causal relation? Is it identical to mechanistic constitution? Failure to distinguish leads to misattributing arguments (e.g., objections to supervenience applied to realization) and obscures realization's specific role in securing autonomy and multiple realizability.

  5.  **Clarity on Realization Bases:**
      *   *Requirement:* The account must specify the admissible nature of the realizer: Is it a property of a single individual? Can it be a relational property? Can it involve properties of parts *or* the whole? Can it be an ensemble property (e.g., properties of a population)? It must also clarify the implications for "levels": Does realization always involve properties at a "lower" level, or can it be intralevel?
      *   *Motivating Case:* Can the property "being a predator" be realized *only* by intrinsic properties of an organism, or also by its relational properties (position in food web)? Can social facts be realized by properties of individuals *and* their relations? Ambiguity here leads to disputes about what counts as realization and whether "downward causation" is coherent or necessary.

  6.  **Token/Type Disambiguation:**
      *   *Requirement:* The account must explicitly clarify its commitments regarding multiple realizability at the token level (a specific instance of pain realized by different physical states in different individuals) and the type level (the property *pain-in-general* realized by different physical state *types*), and explain how these relate.
      *   *Motivating Case:* Many critiques of functionalism/MR attack the plausibility of *type*-MR (e.g., "is *any* physical system really capable of realizing pain?"), while functionalism often relies primarily on the plausibility of *token*-MR ("different brains can be in pain in different ways"). An adequate account must specify which claim it needs and defends, avoiding equivocation.

  7.  **No Fundamental Powers:** *(Potential Bias Flagged)*
      *   *Requirement:* The account must not attribute fundamentally *new*, non-physical causal powers to the realized property that are not grounded in the causal powers of the physical realizer(s).
      *   *Motivating Case:* Physicalist commitment: all causal powers ultimately derive from the fundamental physical level. This prevents realization from smuggling in emergentism or dualism. *However, this is arguably a physicalist prejudice rather than a constraint demanded by the functionalist goals of autonomy and MR alone.* A non-physicalist functionalist might reject this.

  ---

  **Philosophical Analysis of the Standard:**

  *   **Genuine Desiderata vs. Potential Biases:**
      *   **Core (Likely Desiderata):** 1 (MR/Cross-classification), 2 (Autonomy), 3 (Causal Inheritance w/o Collapse), 4 (Conceptual Distinction), 6 (Token/Type Clarity). These directly address the functionalist goals of securing irreducibility, causal efficacy for special sciences, and multiple realizability, while demanding conceptual rigor.
      *   **Potential Bias:** 7 (No Fundamental Powers). This is a *physicalist* constraint. While most functionalists are physicalists, functionalism *as a strategy* for securing autonomy and MR isn't inherently tied to physicalism. An account allowing emergent powers grounded in complex organization *could* potentially satisfy 1-6 but fail 7. Requirement 7 reflects a metaphysical commitment external to the core functionalist project, though internal to the dominant physicalist paradigm. *Crucially, rejecting 7 might ease the tension between 2 and 3.*

  *   **Tensions and Potential Incompatibilities:**
      *   **The Central Tension:** **Requirement 2 (Autonomy) vs. Requirement 3 (Causal Inheritance w/o Collapse) vs. Requirement 7 (No Fundamental Powers).** This is the heart of the problem. Autonomy demands that realized properties have genuine, non-redundant causal/explanatory power (F does real work). Inheritance + No Fundamental Powers demands that *all* of F's causal powers are exhausted by those of P (F adds nothing *causal* beyond P). How can F be causally autonomous if its powers are just P's powers? Avoiding collapse requires that F is *not* identical to P, but if F's causal powers are identical to (a subset of) P's powers, and F has no *other* powers (No Fundamental Powers), what *is* F besides a redescription of P? This trio creates intense pressure towards either epiphenomenalism (F has no *distinct* power) or reductionism (F collapses into P).
      *   **Requirement 1 (MR) vs. Oversimplified Accounts:** Accounts that make realization too strict (e.g., demanding a unique microphysical signature) fail MR. Accounts that make it too permissive (e.g., mere supervenience) struggle with Requirements 2, 3, and 4.
      *   **Requirement 5 (Bases) vs. Levels Metaphors:** Defining realization bases too narrowly (e.g., *only* microphysical properties of fundamental particles) makes MR implausible for many special science properties. Defining them too broadly (e.g., allowing ensemble properties or relations freely) risks making realization intralevel or blurring the "grounding" intuition, potentially conflicting with the "inheritance" aspect of Requirement 3.

  *   **The Most Exclusionary Requirement:**
      *   **The Autonomy-Inheritance Tension (Specifically, Requirement 3: Causal Inheritance without Collapse).** This requirement is the narrow ledge most accounts fall off.
          *   **Reductive Accounts (e.g., early identity theory):** Fail by collapsing realization into identity, violating Autonomy (2) and MR (1).
          *   **Pure Supervenience Accounts:** Fail to explain causal inheritance meaningfully or secure autonomy; they merely state covariance, violating Requirement 3 and often Requirement 4.
          *   **Strong Emergentism:** May satisfy Autonomy (2) and even Inheritance (if emergent powers are "grounded"), but violates No Fundamental Powers (7) decisively for physicalists.
          *   **"Dangler" Accounts:** Accounts where the realized property has no clear causal powers (or its powers are epiphenomenal) satisfy Inheritance (trivially) and No Fundamental Powers (7) but catastrophically violate Autonomy (2) and the intuition behind causal efficacy.
          *   **Many Functional-Role Accounts:** Struggle to explain *how* the functional role property inherits its causal powers *from the realizer* without either identifying them or making the role itself causally inert. They often rely on the *role being played*, but the causal work seems done by the player (the realizer).
          *   **Subset Account (e.g., Shoemaker-inspired):** Explicitly tackles this tension (F's powers are a subset of P's powers) but faces challenges explaining how F can be causally efficacious *in its own right* without overdetermination or how the subset relation avoids collapsing F into a disjunction of P-types (threatening MR).

      *   **Why it's the Key:** Successfully navigating the causal inheritance/autonomy gap is the *sine qua non* for a functionalist account that is both physically respectable and non-reductive. Failure here either reduces the special sciences or makes their properties causally irrelevant. This tension exposes the deepest challenge in making realization work for functionalism.

  ---

  **How to Use in Class:** Present this list at the outset. Frame the unit as an investigation into whether *any* account can satisfy *all* these demands, especially navigating the central tension. Use the analysis to prime students to scrutinize each reading: "How does Account X handle Requirement 3? Does it sacrifice Autonomy, sneak in reduction, or offer a novel solution? Does it rely on Requirement 7 as an unargued premise?" The exclusionary power of Requirement 3 makes it the natural focal point for deep dives and critiques.
