prompt: |-
  I teach an applied ethics seminar and grade student case analyses roughly twice a week; each paper asks students to argue for a moral verdict on a concrete case (a disclosure dilemma, a triage decision, a confidentiality breach, etc.). My problem is that I grade on an implicit, inconsistent standard: I sometimes reward a student for citing a general principle and sometimes for doing careful case-by-case reasoning that never names one, and I can't articulate when each is actually good. The moral particularism–generalism debate is supposed to be about exactly this, but I've never turned it into something I can run on a paper in the time I have.

  Please write a grading procedure I can follow in order, that separates "is this reasoning well done?" from "is it principled or particularist?" It should: (1) identify whether the argument is principle-based, case-based, or a mix, and what the load-bearing move in the argument is; (2) check whether that move is done well on its own terms — for a principle, whether the case genuinely falls under it and whether the obvious defeaters have been considered; for case-based reasoning, whether the morally salient features have been identified and weighed, and whether a feature that would change the verdict has been missed; (3) flag the cases where a principle the student relies on is defeated in this context — a feature that is a reason in normal cases is a disreason or neutral here — and say what to do with that; (4) mark where the procedure stops and hands the final moral verdict to my own judgment, because whether the action is right is a question of values, not of well-formedness.

  Then run it on two worked examples: a student who argues from a general principle of non-maleficence that a doctor must disclose a bad diagnosis immediately, and a student who never names a principle but argues from the specific features of the case (the patient's known anxiety, the timing of the disclosure, the availability of support) that the doctor should delay disclosure. I want to see the procedure give a different grade to one of these than I would have given on instinct, and I want you to say what the procedure cannot do that I still have to do.
reasoning: |-
  We are designing a grading procedure that is systematic and separates the evaluation of reasoning quality from the particularism-generalism debate. The procedure will have four main steps as outlined.

  **Grading Procedure:**

  1. **Identify the argument type and load-bearing move:**
     - Read the paper and determine if the argument is primarily:
       - **Principle-based (P)**: Explicitly cites and applies one or more general moral principles (e.g., "We must always maximize utility").
       - **Case-based (C)**: Builds the argument by identifying and weighing specific features of the case without naming overarching principles.
       - **Mix (M)**: Uses both; note which part is doing the heavy lifting (the load-bearing move).
     - Extract the load-bearing move: the key step that, if removed, would cause the argument to collapse.

  2. **Evaluate the quality of the load-bearing move:**
     - For **Principle-based reasoning**:
       - Check if the case genuinely falls under the principle: Does the principle clearly apply to the case? Are there any obvious exceptions or conditions that might exclude the case?
       - Check for defeaters: Has the student considered potential defeating conditions (features that would normally override or undercut the principle in this context)? If not, note that as a flaw.
     - For **Case-based reasoning**:
       - Check if the student has identified the morally salient features: Are the features they focus on relevant to the moral issue? (e.g., in a disclosure case, patient's anxiety, timing, support system).
       - Check if they have weighed these features appropriately: Have they explained why these features matter and how they contribute to the overall verdict?
       - Check for missing features: Is there an obvious feature of the case that, if included, could change the verdict? (e.g., in disclosure: the patient's expressed preference, the severity of the diagnosis, the risk of the patient finding out from someone else).

  3. **Flag defeated principles or misapplied features:**
     - For principle-based arguments: If the student uses a principle but there is a feature in the case that acts as a defeater (making the principle inapplicable or overridden), flag this and note that the student should have addressed it. The argument is weakened if they didn't.
     - For case-based arguments: If the student misidentifies a feature as salient when it is not, or fails to recognize a feature that would change the weight of other features (e.g., a particular context that makes a normally positive feature negative), flag this as a flaw.

  4. **Mark the point where the final verdict is handed to the instructor's judgment:**
     - The procedure does not determine the absolute correctness of the moral verdict. Instead, it assesses the quality of the reasoning. The final step is to note that beyond the structural evaluation, the instructor must use their own judgment to decide if the verdict is plausible. However, the reasoning must be well-structured and address the relevant issues.

  **Output of the procedure:**
  - A structured feedback for the student that includes:
    - The type of argument and the load-bearing move.
    - Strengths and weaknesses in the reasoning (from step 2 and 3).
    - Any flaws (unaddressed defeaters, missing features, misapplication).
    - A note that the instructor will assign a grade based on the reasoning quality and then use their own judgment about the plausibility of the conclusion (but the grade is primarily on the reasoning).

  **Run on Examples:**

  **Example 1: Principle-based argument**
  - Student argues: "The doctor must disclose the bad diagnosis immediately because the principle of non-maleficence requires avoiding harm. Delaying disclosure would cause harm by preventing the patient from seeking timely treatment and by being dishonest, which is harmful."
  - Load-bearing move: Application of the principle of non-maleficence to argue that immediate disclosure avoids harm.

  *Step-by-step evaluation:*
  1. **Identify**: Principle-based (P). Load-bearing move: The principle of non-maleficence is used to derive the duty of immediate disclosure.
  2. **Evaluate principle application**:
     - Does the case fall under non-maleficence? Yes, because disclosure has potential to cause harm (emotional) and non-disclosure might cause harm (physical if treatment is delayed). But note: non-maleficence is about avoiding causing harm, and disclosure might cause immediate emotional harm. The student must address this tension.
     - Defeaters: The student must consider if there are conditions that would make immediate disclosure more harmful (e.g., patient's anxiety) and whether that defeats the application of the principle. The student did not address the patient's anxiety as a potential defeater (i.e., that immediate disclosure might cause severe psychological harm that outweighs the benefit). This is a flaw.
  3. **Flag defeated principles**: The principle of non-maleficence might be defeated in this case if the harm of immediate disclosure is greater than the harm of delay. The student did not consider this, so the argument is weakened.
  4. **Final verdict**: The reasoning is flawed because it did not address a key defeater. The instructor must now judge whether the conclusion (immediate disclosure) is correct, but the grade for reasoning should be lowered because of the unaddressed defeater.

  **Example 2: Case-based argument**
  - Student argues: "The doctor should delay disclosure because the patient has known anxiety, the timing is bad (patient is about to go on a long-planned vacation), and there is no support system available until next week. Therefore, waiting until after the vacation and when support is available would minimize harm and allow the patient to process the news better."
  - Load-bearing move: Weighing the specific features (anxiety, timing, lack of support) to conclude that delay minimizes harm.

  *Step-by-step evaluation:*
  1. **Identify**: Case-based (C). Load-bearing move: The weighing of the specific features (anxiety, timing, support) to determine that delay minimizes harm.
  2. **Evaluate case-based reasoning**:
     - Salient features: The student identified relevant features (anxiety, timing, support). These are morally salient in a disclosure dilemma.
     - Weighing: The student explains why these features matter (minimizing harm by waiting for support and avoiding bad timing). This is reasonable.
     - Missing features: The student did not consider the potential harm of delay (e.g., if the condition is time-sensitive and treatment must start immediately). Also, the patient's right to know (autonomy) is not addressed. This is a flaw because it ignores a feature that could change the verdict.
  3. **Flag misapplied features**: The features are appropriately identified, but the lack of consideration of countervailing features (like urgency of treatment) is a flaw.
  4. **Final verdict**: The reasoning is partially well done but misses important countervailing factors. The instructor must judge the overall plausibility of the conclusion, but the reasoning grade is lowered for missing features.

  **Comparison and the "different grade" request:**
  - On instinct, one might give a high grade to the principle-based argument because it uses a clear principle, but the procedure reveals a flaw (unaddressed defeater). Similarly, one might be skeptical of the case-based argument because it doesn't cite a principle, but the procedure shows it does well on salient features (except for missing one).
  - However, in both examples, the procedure found flaws. The difference in grade might come from the nature of the flaw. In the principle-based example, the student ignored a well-known defeater (patient anxiety) that is explicitly mentioned in the case. In the case-based example, the student missed a feature (time-sensitivity of treatment) that might not have been explicitly stated but is a common consideration in medical ethics. 
  - If the case description provided to the students included information about the condition being non-urgent, then the missing feature in the case-based argument might be less critical. But if the case was about a condition where early treatment is critical, then the flaw is severe.

  **What the procedure cannot do:**
  - The procedure does not and cannot replace the instructor's judgment about the substantive moral question. It only evaluates the structure and thoroughness of the reasoning. The instructor must still:
    - Decide whether the conclusion is morally correct (which might depend on the instructor's own ethical views or the consensus in the field).
    - Judge the relative importance of the flaws (e.g., how critical is the missing defeater or feature?).
    - Assess the overall persuasiveness and coherence of the entire paper, including writing quality, organization, and creativity, which are beyond the scope of this procedure.

  **Revised Grades (hypothetical):**
  - Example 1 (principle-based): Without addressing the defeater, the reasoning is incomplete. Grade: B- (if the flaw is major) or B (if the instructor thinks the defeater is minor in this context).
  - Example 2 (case-based): Missing a critical feature (if the condition is urgent) would lower the grade to B- or B. But if the case stated the condition was not urgent, then the flaw is minor and the grade might be B+ or A-.

  **Note**: The procedure helps make grading more consistent by providing a structured way to evaluate reasoning, but it does not eliminate the need for the instructor's judgment on the moral substance and the relative weight of the flaws.
answer: |-
  Below is a systematic grading procedure designed to address your needs. It separates the evaluation of reasoning quality from the generalism-particularism debate and includes clear steps to flag where your judgment is required. The procedure is structured as a checklist to follow in order for each paper, with explanations of each step. I then apply it to your two examples and highlight where it yields a different result than instinct might suggest, plus its limitations.

  ---

  ### **Grading Procedure: Ethical Case Analysis Rubric**
  **Goal:** Evaluate reasoning quality independently of whether the argument is principle-based (generalist) or case-based (particularist).  
  **Time Estimate:** 5–7 minutes per paper once internalized.

  #### **Step 1: Identify Argument Type and Load-Bearing Move**  
  - **Action:**  
    - Scan the paper for explicit appeals to general principles (e.g., "non-maleficence," "utility") or purely contextual reasoning (e.g., "given the patient's anxiety...").  
    - Categorize as:  
      - **Principle-based (P)**: Relies on one or more named/unamed abstract principles.  
      - **Case-based (C)**: Uses concrete features without invoking principles.  
      - **Mix (M)**: Combines both; note which element is *load-bearing* (the core move that delivers the verdict).  
    - **Output:** Highlight the load-bearing move (e.g., "Appeals to non-maleficence" or "Weighs patient's anxiety + timing").  

  #### **Step 2: Evaluate the Load-Bearing Move on Its Own Terms**  
  - **Action:**  
    - **For Principle-Based Moves:**  
      - Check if the case *genuinely falls* under the principle (e.g., Does "disclosure" clearly align with "non-maleficence"?).  
      - Check for **defeaters**: Did the student consider obvious exceptions? (e.g., "Does patient autonomy override non-maleficence here?").  
      - *Grading Standard:* Deduct if the application is forced or defeaters are ignored.  
    - **For Case-Based Moves:**  
      - Check if *salient features* are identified (e.g., anxiety, timing, support) and *weighed* (e.g., "Anxiety increases harm of immediate disclosure").  
      - Check for **missing features**: Did they omit obvious context that would change the verdict? (e.g., Ignoring the patient's prior request for honesty).  
      - *Grading Standard:* Deduct if features are irrelevant, superficially listed, or critical factors are missing.  
    - **Output:** Note strengths/flaws (e.g., "Missed defeater: anxiety as a factor" or "Weighed features but omitted patient autonomy").  

  #### **Step 3: Flag Defeated Principles or Misweighed Features**  
  - **Action:**  
    - **For Principles:** If a principle is *defeated* by context (e.g., "Non-maleficence is overridden by autonomy in this case"), flag it. Ask: Did the student address this?  
      - *If unaddressed:* Mark as a flaw.  
      - *If addressed:* Reward for nuance.  
    - **For Case-Based Reasoning:** If a feature is *misweighed* (e.g., Treating "timing" as decisive when it is trivial), flag it.  
    - **Output:** Add comment like: "Unaddressed defeater—principle misapplied" or "Overweighted feature X given context."  

  #### **Step 4: Mark Handoff to Instructor Judgment**  
  - **Action:**  
    - After Steps 1–3, note: "Reasoning well-formedness ends here."  
    - **Your Role:** Decide if the *moral verdict* is plausible based on:  
      - Coherence with established ethical frameworks (e.g., "Does this align with reasonable medical ethics?").  
      - Your view of the case’s moral priorities (e.g., "Is autonomy more urgent here?").  
    - **Output:** Assign grade for reasoning (Steps 1–3) separately from verdict plausibility (your judgment).  

  ---

  ### **Worked Examples**
  **Case:** *A doctor must decide whether to disclose a terminal diagnosis immediately or delay due to the patient's severe anxiety and upcoming vacation.*  

  #### **Example 1: Principle-Based Argument**  
  *Student’s Argument:* "Disclosure must happen immediately because non-maleficence requires minimizing harm. Delaying causes harm by preventing timely treatment decisions."  
  - **Step 1:** **P** (Principle-based). Load-bearing move: Applies non-maleficence.  
  - **Step 2:**  
    - *Genuine Application?* Partial—immediate disclosure could cause psychological harm (ignored).  
    - *Defeaters Considered?* No—anxiety, timing, and support are not addressed as potential defeaters.  
    - **Flaw:** Missed that non-maleficence might *support* delay (anxiety-induced harm).  
  - **Step 3:** **Defeater Flagged**—Anxiety defeats the principle’s direct application. Unaddressed → flaw.  
  - **Step 4:** Reasoning is **partially flawed** due to unaddressed defeater. Verdict plausibility handed to you.  
  - **Grade Impact:** Lower marks for reasoning than instinct might suggest (common instinct: reward "principle-driven" structure).  

  #### **Example 2: Case-Based Argument**  
  *Student’s Argument:* "Delay is better because: (1) Patient’s anxiety risks severe distress, (2) Disclosure before vacation could ruin respite, (3) Support is unavailable until next week."  
  - **Step 1:** **C** (Case-based). Load-bearing move: Weighs anxiety + timing + support.  
  - **Step 2:**  
    - *Salient Features?* Yes—anxiety, timing, support are relevant.  
    - *Weighed Appropriately?* Yes—links features to harm reduction.  
    - *Missing Features?* **Yes—fails to consider autonomy (patient’s right to know) or medical risks of delay (e.g., treatment options).**  
    - **Flaw:** Omitted critical countervailing factors.  
  - **Step 3:** **Feature-Missing Flagged**—Autonomy/urgency could defeat the delay verdict.  
  - **Step 4:** Reasoning is **partially strong** but incomplete. Verdict plausibility handed to you.  
  - **Grade Impact:** Higher marks than instinct might suggest (common instinct: penalize "unprincipled" reasoning), but still docked for missing features.  

  #### **Key Difference from Instinct**  
  - **Example 1** receives a **lower grade** than instinct might dictate. Instinct often rewards principle-based arguments for structure, but the procedure penalizes the unaddressed defeater (anxiety).  
  - **Example 2** receives a **higher grade** than instinct might dictate. Instinct might dismiss case-based reasoning as "untheoretical," but the procedure rewards salient feature-weighing while noting omissions.  

  ---

  ### **What the Procedure Cannot Do (Requires Your Judgment)**  
  1. **Verdict Plausibility:** It assesses reasoning *form*, not moral correctness. You must still decide:  
     - "Is immediate/delayed disclosure *actually* right here?" (e.g., based on clinical ethics standards).  
     - "How severe is the flaw?" (e.g., Is missing autonomy a fatal gap or a nitpick?).  
  2. **Balance in Mixed Arguments:** It identifies the load-bearing move but cannot resolve clashes between principles and particulars without your input.  
  3. **Contextual Nuance:** Some features/defeaters are case-specific (e.g., cultural factors). The procedure flags omissions but relies on you to deem their importance.  
  4. **Broader Quality:** Writing clarity, creativity, and use of evidence fall outside this scope.  

  ### **Practical Tips**  
  - **Template Feedback:** Use a 4-part comment for students:  
    *"Your argument type: [P/C/M]. Load-bearing move: [X]. Strengths: [Y]. Flaws: [Z]. Defeaters/unaddressed features: [A]. Verdict plausibility: [My note]."*  
  - **Speed Focus:** Skip verbose summaries; scan for key moves (Steps 1–2) and common defeaters (Step 3).  
  - **Calibration:** Run 3–4 papers through the procedure before grading to internalize it.  

  This system makes your implicit standard explicit, rewards both principled and particularist reasoning when done well, and flags where *you* must take over—ensuring fairness without over-mechanizing ethics.
