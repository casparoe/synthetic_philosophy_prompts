  ### Joint Statement on Fairness in Risk Assessment Tools

  #### 1. Agreements  
  Both parties (R and C) endorse the following statements:  
  1. **Mathematical Impossibility**: If base rates of re-arrest differ across groups and the risk tool is perfectly calibrated within each group, it is mathematically impossible to achieve equal false positive rates (FPR) and equal false negative rates (FNR) simultaneously (per Chouldechova, 2017; Kleinberg et al., 2017).  
  2. **Concrete Example**: Given:  
     - Group A: Base arrest rate = 40% (0.4).  
     - Group B: Base arrest rate = 10% (0.1).  
     A calibrated tool (where a score of *p* means *p* probability of rearrest for each group) will yield:  
     - At threshold **0.3**:  
       - Group A FPR = 50%, FNR = 20%.  
       - Group B FPR = 15%, FNR = 50%.  
     Equal FPR or FNR requires tradeoffs (e.g., equal FPR at threshold 0.1 worsens FNR disparity).  
  3. **Purpose of Risk Scores**:  
     - The score estimates *individual risk* (e.g., "0.3" means 30% risk for anyone with that score).  
     - Calibration ensures scores are *truthful* (no group over/under-predicts risk).  
  4. **The Tradeoff is Real**:  
     - Equal FPR/FNR and calibration **cannot coexist** under base rate disparities.  
     - No technical fix (e.g., score transformation) dissolves this without sacrificing one goal.  
  5. **Shared Objective**:  
     - Tools should avoid compounding injustice.  
     - Disparate impacts (e.g., unnecessary pretrial detention) are harmful.  

  ---

  #### 2. Disagreements  
  | Issue | R's View (Parity-First) | C's View (Calibration-First) |
  |-------|--------------------------|------------------------------|
  | **Primary Fairness Criterion** | Fairness requires **comparable group outcomes**: Equal FPR to prevent disproportionate harms (e.g., detention of innocent group members). | Fairness requires **individual truthfulness**: Calibration ensures scores mean the same thing for all, regardless of group. |
  | **Role of the Threshold** | The threshold is **part of the tool's design**; setting it without regard to group parity institutionalizes bias. | The threshold is a **policy choice**; calibration ensures scores are objective inputs for *any* threshold. |
  | **Accountability for Base Rates** | Base rate disparities (e.g., 40% vs. 10%) reflect **structural injustices** (e.g., policing bias). The tool must *counteract* these by enforcing equal error rates. | Base rate disparities reflect **current risk realities**. The tool’s role is prediction, not social redress; artificially equalizing errors misrepresents risk. |
  | **"Equal Standards" Definition** | "Holding to the same standard" means **comparable burden of errors** (e.g., Group A and B bear equal FPR costs). | "Holding to the same standard" means **identical risk interpretation** (e.g., "0.3" = 30% risk for all). |

  ---

  #### 3. Cruxes and Testable Predictions  
  **Crux 1: Do base rate differences reflect real risk or systemic bias?**  
  - **R's view**: Base rates are artifacts of injustice (e.g., over-policing). Tools should not perpetuate disparities.  
  - **C's view**: Base rates reflect measurable risk differences. Tools should not ignore data to engineer equity.  
  - **Test Case**: *Jurisdiction X*: Implements reforms (e.g., bail policy changes, community investment) that narrow arrest rate disparities (Group A: 40% → 25%; Group B: 10% → 20%).  
    - **R predicts**: Calibrated tools will *still* show FPR disparities without explicit parity constraints.  
    - **C predicts**: FPR disparities will *naturally shrink* as base rates converge.  

  **Crux 2: What does "fair treatment" require when distributions differ?**  
  - **R's view**: Fairness demands equal error rates, even with group-specific thresholds (e.g., threshold 0.4 for Group A, 0.1 for Group B to equalize FPR).  
  - **C's view**: Group-specific thresholds violate individual fairness (e.g., a 0.3-score person in Group B is jailed, while an identical-risk Group A person is freed).  
  - **Test Case**: *Jurisdiction Y*: Sets group-specific thresholds to achieve equal FPR (Group A: 0.4, Group B: 0.1).  
    - **R predicts**: Public trust increases due to equitable outcomes; no backlash.  
    - **C predicts**: Backlash occurs from "same score, different outcome" perceptions.  

  **Crux 3: Is calibration sufficient for legitimacy?**  
  - **R's view**: Calibration is *necessary but insufficient*; error rate disparities undermine societal fairness.  
  - **C's view**: Calibration is the *only* legitimate requirement; error rates reflect base realities, not tool bias.  
  - **Test Case**: *Tool Audit*: Compare two tools:  
    - Tool 1: Calibrated but high FPR disparity (Group A FPR 50%, Group B 15%).  
    - Tool 2: De-calibrated (scores 20% inflated for Group B) but equal FPR.  
    - **R prefers**: Tool 2 (prioritizes equity).  
    - **C prefers**: Tool 1 (prioritizes accuracy).  

  ---

  #### 4. Verbal Disagreement Note  
  - **"Fairness"** is used in two senses:  
    - R: **Group fairness** (distributive justice).  
    - C: **Individual fairness** (epistemic truthfulness).  
  This semantic difference amplifies conflict but does not fully explain it; core disagreements are substantive.

