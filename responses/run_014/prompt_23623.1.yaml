prompt: |-
  Hey, I'm on the grad curriculum committee for our history of logic course and we're deadlocked on whether to add Frege's diary to the required reading. Half the committee thinks it's a distraction — its political, its from the 1920s, and it has nothing to do with the *Begriffsschrift* — while the other half argues it's philosophically relevant. I need a short memo that recommends a concrete decision (include, don't include, or include with conditions) and engages the strongest argument on the losing side. The specific issue is that the diary is from 1924, after Frege's major logical work, so the question isn't whether the diary caused his views but whether it reveals something about the intellectual environment that would affect how we interpret his logical work — specifically, whether the diary shows that his logical work was motivated by non-logical (political/ideological) considerations, or whether it's just a personal/political document separable from his philosophy. Keep it under a page.
