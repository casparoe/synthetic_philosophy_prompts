  Okay, let me approach this Terri Schiavo case analysis systematically. The user wants a rigorous application of moral uncertainty frameworks to three decision points, followed by deep dives into theoretical problems. 

  First, I need to establish the factual anchors. The medical consensus was clear: Terri was in PVS with catastrophic brain damage, though her parents contested this. The legal battles involved multiple branches of government over 15 years - that duration itself suggests this wasn't just about uncertainty but about irreconcilable worldviews.

  For the decision points:
  - Michael's initial petition: Under expected choiceworthiness, his high credence in substituted judgment and low PVS welfare would strongly favor removal. A moral parliament would give weight to his wife's autonomy view.
  - The 2000 court ruling: The judge likely had moderate credence across theories but found the evidence for Terri's prior wishes convincing. Parliament would've heard competing arguments but autonomy representatives might broker a deal accepting removal as "letting die."
  - 2005 final removal: After exhaustive reviews, uncertainty should have decreased - except for legislators inserting new moral theories via emergency bills. Here parliament fails spectacularly as the "life sanctity" faction refuses negotiation.

  Now the hard parts:
  1. The non-personhood problem. If a theory says Terri isn't a moral patient, is that an abstention? In expected choiceworthiness, it creates a population measurement crisis - how do you weigh "zero welfare interests" against "massive life interest"? The framework assumes commensurable units but finds none.

  2. Lexical values break expected choiceworthiness completely. Even 1% credence in "killing innocents is infinitely wrong" should veto removal - but courts clearly rejected this. Parliament tries to compromise but when some theories see compromise as evil, negotiation fails. The parents' camp likely held this view absolutely.

  3. The substituted judgment paradox. It's a meta-decision rule, not a first-order value. In parliament, we'd need to decide whose preferences matter before seating the representatives - circularity ensues. The court solved this procedurally by accepting Michael as guardian, but morally it's messy.

  What moral uncertainty misses: 
  - The 15-year timeline shows this wasn't uncertainty but conflict over fundamental axioms. No amount of evidence could bridge sanctity-of-life versus autonomy views.
  - The political theater - legislation, protests, feeding tube reinsertions - exposed how power operates when moral systems collide. Uncertainty frameworks assume good-faith actors weighing theories, but here institutions were weaponized.
  - The description problem: "Is this killing or letting die?" wasn't an empirical question but a moral framing. Opposing sides couldn't even agree on what vocabulary to use.

  Alternative frameworks like political liberalism (Rawls) might handle the institutional clashes better by separating comprehensive doctrines from public reason. But they'd struggle with the guardian determination issue. Ultimately, this case reveals moral uncertainty as a philosopher's tool that fractures when faced with existential disagreements where lives - and worldviews - are at stake.
answer: |-
  Here's a systematic analysis of the Terri Schiavo case through the lens of moral uncertainty, followed by an examination of where the framework breaks down:

  ### **Decision Points Under Moral Uncertainty**
  1. **Michael's Initial Petition (1998)**:  
     - *Expected Choiceworthiness (EC)*:  
       Michael likely held high credence (e.g., 80%) in theories prioritizing autonomy/substituted judgment ("Terri wouldn't want this") and low PVS welfare. Lower credence (e.g., 20%) in sanctity-of-life theories. EC strongly favors removal.  
     - *Moral Parliament (MP)*:  
       Autonomy representatives (substituted judgment) dominate negotiations. Best-interest advocates might concede if evidence of Terri’s wishes is strong. Sanctity-of-life delegates resist but are outvoted. **Verdict**: Removal.  

  2. **Trial Court Ruling (2000)**:  
     - *EC*:  
       Judge Greer’s moderate credence across theories (e.g., 40% substituted judgment, 30% best interests, 30% sanctity of life). Strong evidence of Terri’s prior statements tips EC toward removal.  
     - *MP*:  
       Substituted judgment and best interests form a coalition: Terri’s wishes + low quality of life justify removal. Sanctity-of-life delegates demand continued care but are outmaneuvered. **Verdict**: Authorize removal.  

  3. **Final Removal (2005)**:  
     - *EC*:  
       After repeated reviews, courts held near-certainty (e.g., 95%) that Terri was in PVS with no recovery chance. High credence in substituted judgment. EC overwhelmingly favors removal.  
     - *MP*:  
       Sanctity-of-life delegates filibuster, demanding extraordinary measures. Other factions reject this as disproportionate. Autonomy and best-interest delegates force a vote for removal. **Verdict**: Removal upheld.  

  ---

  ### **Where the Frameworks Break**  
  **1. Non-Personhood & Population Uncertainty**  
     - **Problem**: Theories denying moral patienthood (e.g., "PVS patients lack interests") create a *metaphysical* conflict.  
       - *In EC*: If Theory A assigns Terri’s welfare "0" (non-person) and Theory B assigns "-100" (suffering), credence-weighting falsely suggests removal is less bad. But Theory A sees *no moral event* at all. **This isn’t aggregation—it’s category error**.  
       - *In MP*: Non-personhood theories might "abstain," but this gives de facto power to theories that *do* recognize patients. **MP silently privileges expansive moral circles**.  
     - **Breakdown**: Both frameworks assume a fixed population of moral patients. When theories disagree on *who counts*, aggregation fails.  

  **2. Lexical Prohibitions**  
     - **Problem**: Sanctity-of-life theories often treat "killing innocents" as infinitely wrong, trumping all other values.  
       - *In EC*: Any nonzero credence (e.g., 1%) in lexical prohibition makes removal *infinitely* bad, paralyzing decision-making. **EC collapses into "never remove" if any lexical theory exists**.  
       - *In MP*: Sanctity delegates refuse compromise ("no negotiation with murder"). Other factions override them, but this *ignores* the lexical claim rather than resolving it. **MP masks absolutism as majoritarianism**.  
     - **Breakdown**: Lexical values expose EC’s incompatibility with incommensurability and MP’s inability to handle veto players.  

  **3. Meta-Uncertainty About Decision Procedures**  
     - **Problem**: Should we use substituted judgment, best interests, or a life-preserving default? Moral uncertainty applies *to the choice of framework itself*.  
       - *In EC*: Weights must be assigned not just to outcomes (e.g., removal) but to decision rules. **Infinite regress looms**: How do we weight theories about weighting?  
       - *In MP*: Delegates must first decide *how to decide* before negotiating outcomes. **Circularity**: The parliament’s rules presuppose a resolution to the very uncertainty it addresses.  
     - **Breakdown**: Both frameworks assume first-order moral uncertainty but stumble when the *method* of decision-making is contested.  

  ---

  ### **What Moral Uncertainty Cannot Explain**  
  - **Failure to Converge on Description**:  
    Opposing sides didn’t just disagree on values—they inhabited different moral realities. Pro-removal: "Allowing natural death." Anti-removal: "Starving a disabled woman." **Moral uncertainty frameworks assume shared descriptive facts**, but here even the *act* (killing vs. omitting care) was theory-laden.  

  - **15 Years of Litigation as Anti-Decision**:  
    The protracted conflict transformed a decision problem into a **political war**. Legislative interventions (e.g., 2003 "Terri’s Law") weaponized moral uncertainty to override courts, exploiting ambiguity to rally constituencies. **Uncertainty became a tool for power, not resolution**.  

  - **Epistemics vs. Politics**:  
    Moral uncertainty theory illuminates *epistemic* challenges (weighing theories under doubt) but ignores *political* dynamics:  
    - **Tribal Signaling**: Support for Terri’s parents became a badge of pro-life identity, indifferent to medical facts.  
    - **Institutional Competition**: Courts, legislatures, and protesters battled for moral authority, not truth-seeking.  
    - **Rights Trumping Uncertainty**: Autonomy (Michael’s rights) and sanctity (Terri’s "right to life") were treated as absolutes, not probabilities.  

  - **Superior Frameworks**:  
    - **Political Liberalism (Rawls)**: Treats irreconcilable doctrines as inevitable; seeks overlapping consensus (e.g., "procedural fairness"). But it struggles when consensus is impossible (e.g., lexical values).  
    - **Conflict Theory**: Acknowledges moral disputes as power struggles. The "winner" (Michael/courts) prevailed via institutional authority, not moral calculus.  
    - **Deliberative Democracy**: Emphasizes process over outcome. Schiavo shows its limits: 15 years of "deliberation" entrenched divisions.  

  ### **Conclusion**  
  Moral uncertainty frameworks clarify *individual* reasoning (e.g., Michael’s initial choice) but shatter when theories conflict irreducibly over ontology (who is a person?), lexical values, or decision procedures. The Schiavo case reveals that **deep moral disagreements are often governance crises, not epistemic ones**. Political power, institutional legitimacy, and the ability to impose descriptions ("death with dignity" vs. "murder") determined the outcome—not credence-weighted aggregation. No framework perfectly merges epistemics and politics, but acknowledging this limitation is the first step toward wiser policy in morally fragmented societies.
