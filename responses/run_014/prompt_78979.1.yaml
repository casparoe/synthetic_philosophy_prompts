prompt: |-
  I am a professor of philosophy preparing an application to my faculty's internal research fund for a semester of teaching relief, and I would like you to draft the proposal for me. Please work as a philosopher of the social sciences: someone at home both in Weber's methodological writings and in the contemporary literature on causal explanation in history and the social sciences, and someone with a good ear for the difference between a question that is genuinely open and one that is merely under-described. Think carefully before you write. Begin by brainstorming three or four candidate framings of the idea below; say which one you would commit to and why; name at least one framing you considered and set aside, with your reason. Only then produce the proposal.

  My half-formed idea is this. The dispute over whether culture can be a cause seems to me to run on an assumption both sides accept without argument: that for values to explain conduct they must enter the causal history of individual actions as motives — as things people held and acted on. That assumption, I suspect, is what makes Weber's thesis about the Protestant ethic and the rise of capitalism look either untestable or trivially true. My hunch is that the explanatory work in that thesis is done elsewhere: values fix the space of options a population takes seriously, so that certain courses of action never come up for deliberation at all. If that is right, a value explanation need not be a story about anyone's motives, and the familiar objection that the thesis merely redescribes the conduct it was supposed to explain may or may not still land. Two further things should be taken seriously. First, doctrine and disposition can come apart: the conduct in question need not be accompanied by the belief that supposedly produced it, and the belief may persist without the conduct. Second, the thesis looks like a claim about a difference rather than an existence — about why rationalised conduct took hold in one setting rather than another — and I do not yet know whether that makes the explanatory burden lighter or heavier. My rough formulation of the question, which you should sharpen or replace if you can do better, is: can values explain conduct by constraining what a population treats as an available option rather than by figuring in anyone's motives, and if so, what must be true of such an explanation for it to be a causal explanation rather than a redescription?

  The document should run to about 1,200 words and contain: a title and a two-sentence abstract; the question stated so that it has a determinate answer; a short account of why the standing positions leave it open, compressed as far as possible, since I know the debate and do not need it rehearsed; the approach and why that approach rather than the obvious alternatives, in particular why not a historical case study, why not formal modelling of social causation, and why not straightforward conceptual analysis of causation; a month-by-month plan for six months of part-time work, naming what I would actually be doing in each month; what a good result would look like and what would count as the project failing, including the most likely way it fails; an honest assessment of scope; and a closing paragraph on what a philosophical treatment adds here that a historian or sociologist could not supply.

  Two constraints. Do not include a bibliography, citations, or references by author and date; I will add the citations myself, and you should not invent titles, quotations, or page numbers — refer to positions and arguments in plain prose instead. And do not build the plan around archives, untranslated sources, or data I could not obtain. If you need to assume something about my background or my field, state the assumption in one line at the top and then proceed.
