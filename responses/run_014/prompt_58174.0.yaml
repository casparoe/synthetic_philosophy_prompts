  Hmm, the user seems frustrated but also genuinely curious—they're not just venting but seeking analytical clarity. The cultural tension here is palpable: one view is legalistic (Western frameworks), the other is relational (community norms). Both cases involve gift-giving, but context changes everything. 

  First, the yams/mangoes scenario: post-service, no explicit coercion. Under the "private payoff" definition, it might skirt corruption if it's not mandatory, but the "reciprocity rules" lens sees it as harmless gratitude. Then the mayor's pre-election gifts: undeniably transactional under the first definition (vote-buying), but the friend argues it's just scaled-up reciprocity. 

  Key differentiators I should highlight: timing (before/after service), scale, and power imbalance. The teacher/nurse has limited leverage; the mayor controls resources voters depend on. Also, legality matters—many places criminalize election gifts. 

  ...Wait, the user wants exactly five numbered points, no intro/conclusion. Better make each point razor-sharp. Focus on: 
  1. Definition 1 vs yams (not corruption) 
  2. Definition 1 vs rice (corruption) 
  3. Definition 2 vs yams (not corruption) 
  4. Definition 2 vs rice (gray area?) 
  5. Power imbalance as the critical factor. 

  For point 4, I’ll note that even community norms have limits—large-scale pre-election gifts might strain "reciprocity" by creating obligation. But the friend isn’t entirely wrong; it *is* the same logic, just weaponized. The real issue is systemic distortion vs personal appreciation.
answer: |-
  Here are five numbered points comparing the two definitions against your cases:

  1.  **Definition 1 (Private Payoff):** Yams/mangoes *after* service aren't necessarily corruption; the benefit comes after the duty is performed without prior agreement influencing the act. Rice/roofing *before* the vote explicitly uses public resources to secure a private benefit (votes), fitting this definition clearly.
  2.  **Definition 1 (Private Payoff):** The mayor's pre-election handout directly leverages a public position (and public/party resources) for the private gain of winning an election, making it a textbook case under this rule-based definition.
  3.  **Definition 2 (Reciprocity Rules):** Gifting yams/mangoes *after* help aligns with community norms of gratitude and balanced reciprocity for services rendered, likely *not* seen as violating unwritten rules.
  4.  **Definition 2 (Reciprocity Rules):** Pre-election gifts create an *obligation* before the political "service" (representation), potentially distorting community reciprocity into a transactional demand for support, which *could* violate norms if perceived as coercive or exploitative.
  5.  **Key Difference:** The scale, timing (before vs. after service), and power imbalance (mayor vs. voters vs. nurse/teacher vs. parent) make the election case fundamentally different under *both* definitions, turning gratitude into a calculated exchange demanding specific political payback.
