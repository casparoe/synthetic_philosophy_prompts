prompt: |-
  I run avalanche search-and-rescue for a mountain rescue association, and I'm the one who has to call, in the field, which of two buried groups we commit the dog team and the diggers to when we can only work one site at a time. It comes up more then I'd like in a winter: two beacons triangulate to two different pockets, the snow is bad, the team is a single unit, and I've got maybe a two hour window before the buried people are gone. I need a decision procedure I can actually run on a slope in the cold with a head full of static, that tells me what to do when I can get the group of four out of the east pocket or the single hiker out of the west gully but not both, and I make the call and I sign for it.

  I don't want it to just be "save the most people." I've read enough of the debate to know that's contested, and I don't want a procedure that papers over that. So ground it in what the argument actually says: what is the real force of the claim that the number of people saved is, by itself, not a reason to save the many over the few (the Taurek line), what are the strongest replies to it, and where does the procedure have to stop and hand the call back to me as a person because it's a values question and not a facts question? Give me the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a "no, don't commit to that site," and the points where it just has to flag "this one's on you." Be straight about which steps are really judgment calls wearing a procedure costume. Then run it on two real-ish calls from last season: one where the four are a ski patrol team with a radio and the single is a solo backpacker who's already been out longer, and one where the single is a kid. And tell me the cases where the procedure hands me an answer I'm going to hate, and what it simply can't do for me.
reasoning: |-
  Okay, the user runs avalanche search-and-rescue and needs a decision procedure for choosing between two buried groups when resources are limited. They want something practical that can be used in the field under stress. The key points are grounding the procedure in ethical debates, especially Taurek's argument against saving the greater number, and being clear where judgment is needed.

  First, I need to recall Taurek's position: saving more lives isn't inherently better because you shouldn't compare lives. Each life is unique and incomparable. The strongest replies involve aggregation—that more lives mean more value, or that fairness requires giving each a chance. However, the ethical debate can't be fully resolved; it's about values.

  The procedure must be structured as a series of questions. Start with practical feasibility: can we even reach one group? If not, that's a hard stop. Then, assess survival probability with available data. If one group has significantly higher chances, prioritize them—this is more factual. When chances are similar, move to ethical considerations. Here, the procedure should highlight the value conflict without dictating. For example, in a tie, saving the larger group leans towards aggregation, but the decision-maker must own the choice.

  Real cases: First, a ski patrol team of four with radios vs. a solo backpacker out longer. The ski patrol likely has better gear and training, so higher survival chances. The procedure would prioritize them based on probability. Second, a group of four vs. a child. Survival probability might be similar, so the ethical question arises. The procedure flags that prioritizing the child is a values call, not dictated by the steps.

  The user needs honesty about where the procedure can't help—like when emotions or unquantifiable factors (a child's life) are involved. Also, cases where saving the smaller group is chosen might be emotionally tough, but the procedure makes the trade-off explicit. It can't replace human judgment in value-laden decisions but structures the process to reduce cognitive load in crisis.
answer: |-
  Here's a field-expedient decision procedure grounded in the ethical debate, designed for cold, high-stakes, time-limited calls. It forces explicit confrontation of the value conflict while filtering out non-ethical constraints first. **Bold text is the procedure you run. Plain text is the explanation.**

  **The Avalanche Triage Protocol (ATP):**

  1.  **"Can we physically access and attempt a rescue at either location within the viable window *right now*?"**
      *   **Good Enough Answer:** "Yes" for at least one site. (If "No" for both, recall team/regroup. If "No" for one only, commit to the accessible site. Stop.)
      *   **Judgment Call:** Assessing terrain stability, access routes, immediate avalanche risk to rescuers. This is facts + experience.
      *   **Stops With:** "No" for a site. Eliminates it.

  2.  **"Is there a *significant*, *actionable* difference in estimated survival probability *based solely on known, objective factors* right now?" (Focus: Facts & Time)**
      *   **Known Factors:** Burial depth (beacon signal strength/interpretation), known time under debris (last seen vs. now), known protective gear (Avalungs, airbags), beacon signal clarity/stability, presence/absence of air pocket signs (probe strike), avalanche debris characteristics (concrete vs. looser).
      *   **Significant Difference:** E.g., >30% absolute difference in estimated probability based on Resuscitation Timeline/avalanche medicine knowledge (e.g., shallow vs. deep burial, 30 mins vs. 90 mins buried, Avalung present vs. absent).
      *   **Good Enough Answer:** "Yes, Site A has a *significantly* higher probability." OR "No, probabilities are effectively similar/unknown/too close to call given current info."
      *   **Judgment Call:** Interpreting beacon/probe data, estimating time buried accurately, weighting factors. Uses expertise but aims for objectivity.
      *   **Stops With:** "Yes" --> **Commit resources to the site with significantly higher survival probability.** Stop. (Taurek *generally* accepts saving a life with a higher chance over one with a lower chance, as it's not *just* about numbers). If "No" --> Proceed to Step 3.

  3.  **"Is there a *significant*, *actionable* difference in potential for *multiple simultaneous saves* or *critical resource recovery*?" (Focus: Maximizing Leverage)**
      *   **Examples:** One group has a known buried rescuer (e.g., patroller) carrying critical gear (extra probes, shovel, medical kit, radio) that could *immediately* enable a faster rescue attempt at the *other* site if recovered quickly. Or, one site location allows deploying resources in a way that *might* enable a faster sweep of the other site afterward (rare in avalanche terrain).
      *   **Good Enough Answer:** "Yes, saving Group A first *significantly* increases the *practical possibility* of saving Group B as well within the window." OR "No, saving either group first is unlikely to materially affect the possibility of saving the other within the window."
      *   **Judgment Call:** Assessing realistic logistics, time for redeployment, state of team after first dig. Highly speculative; use only for clear, high-impact cases.
      *   **Stops With:** "Yes" --> **Commit resources to the site offering significant leverage.** Stop. If "No" --> Proceed to Step 4. (This step often answers "No").

  4.  **"FINAL CALL - VALUES FLAG:** The primary ethical conflict is now unavoidable. Saving the larger group saves more lives. Saving the smaller group refuses to discount the value of any single life based on the lack of others. **Acknowledge this conflict explicitly.** There is no universally agreed 'correct' ethical answer here. **Commit resources to:**"
      *   **Option A:** The Larger Group (Prioritizing Aggregation/Total Lives Saved).
      *   **Option B:** The Smaller Group (Prioritizing Individual Equality/Refusing to Discount Isolated Lives - Taurek's core stance).
      *   **Judgment Call:** **This is entirely a values decision.** The procedure forces you to confront that the *only* remaining significant difference is the number of lives. You *must* choose which ethical principle you will act upon *in this moment*. This is where you "sign for it."

  **Key Features & Limitations:**

  *   **Wears a Procedure Costume:** Steps 1-3 are genuinely trying to resolve the decision on practical or "less contested" ethical grounds (survival chance, rescue leverage). Step 4 is nakedly a values call, but the procedure structures *when* you face it and *what* it means.
  *   **Hates Taurek's Conclusion (But Respects His Point):** The procedure *allows* you to choose Option B in Step 4, but forces you to admit it means potentially leaving more people to die *specifically because* you won't count numbers. This is the heart of Taurek.
  *   **Forces Explicit Values Choice:** By isolating the numbers conflict in Step 4, it prevents hiding behind false certainty or unexamined assumptions. You *know* when you're making the pure numbers call or rejecting it.
  *   **What It Can't Do:**
      *   Resolve the core ethical conflict. You *must* choose A or B in Step 4 if you get there.
      *   Quantify "significance" in Steps 2 & 3 perfectly. Judgment is required.
      *   Incorporate unquantifiable emotional weight (a child, a teammate) *except* as part of your values choice in Step 4. It forces you to decide if that factor *overrides* the numbers question.
      *   Guarantee you'll like the answer, especially if Step 4 gives you Option B.
      *   Eliminate the burden of responsibility. It structures the *thinking*, not the *weight*.

  **Running the Protocol on Your Cases:**

  **Case 1: Ski Patrol Team (4, radio) vs. Solo Backpacker (1, out longer)**

  1.  **Access?** Assume "Yes" to both. Proceed.
  2.  **Significant Survival Probability Difference?**
      *   *Factors:* Patrol: Likely trained, avalanche-aware, *may* have better protective gear (Avalungs?), **Radio is HUGE** - Enables communication/air pocket/medical info. Solo: Longer burial time = lower probability. Signal strength interpretation matters.
      *   *Judgment:* Radio + training + potentially shorter burial time (if triggered while responding?) likely creates a **significant** survival probability advantage for the patrol team. "Yes, Patrol has significantly higher probability."
      *   **Commit to Patrol Team.** (Stops at Step 2). Taurek generally accepts this; it's not *just* about numbers. The backpacker's longer burial time is the key factual differentiator.

  **Case 2: Group (4) vs. Child (1) - Assume similar location viability, burial characteristics, and time buried.**

  1.  **Access?** Assume "Yes" to both. Proceed.
  2.  **Significant Survival Probability Difference?**
      *   *Factors:* Age *might* imply slightly lower cold tolerance, but in avalanche burial, this is often negligible/unknowable compared to depth/duration/air. No *significant, actionable* objective difference.
      *   *Judgment:* "No significant difference." Proceed.
  3.  **Significant Leverage Difference?** (Unlikely - saving the child doesn't help save the group faster, saving the group doesn't inherently help find the child faster). "No." Proceed.
  4.  **FINAL CALL - VALUES FLAG:** Core conflict: Save 4 lives vs. Save 1 life (a child). **Acknowledge conflict.**
      *   **Option A:** Commit to the Group of 4 (Prioritizing total lives saved).
      *   **Option B:** Commit to the Child (Prioritizing saving this specific vulnerable individual, implicitly valuing their life *more* in this choice, or adhering to a 'save the most vulnerable' principle that *overrides* numbers).
      *   **Your Call:** The procedure **forces you to choose here**. There is no procedure to hide behind. Choosing the child (B) means accepting you are *not* saving the greater number, likely because the "child" factor overrides the numbers calculation *for you*. Choosing the group (A) means accepting you are prioritizing numbers over the specific identity of the single victim. **This is entirely on you.**

  **Cases Where the Answer Might Be Hated:**

  1.  **Step 2 Forces Saving the One:** Four buried deep (>2m, 90 mins) with weak signals vs. One buried shallow (0.5m, 60 mins) with strong signal. Step 2 says **commit to the One**. You leave four with almost no chance to save one with a decent chance. Logically sound (maximizes *probable* lives saved: 1 > ~0), but feels awful.
  2.  **Step 4 Forces the Numbers Choice:** Group of 3 adults vs. Solo teenager (similar probability/leverage). Step 4 demands you choose A (the 3) or B (the teen). Choosing B means actively deciding the teen's life matters *more* than the three combined *in this context*. Choosing A means writing off the teen *because* they are alone. Both feel like betrayals of a principle.
  3.  **Leverage Backfires:** You choose the group of 4 (Step 4A). You save them, but they had no critical gear for the solo. The solo perishes. Or worse, you *could* have saved the solo quickly and *then* had time to attempt the group, but the procedure didn't flag leverage clearly enough (Step 3 "No"). Hindsight agonizing.

  **In the cold, head full of static, this is what you do:**

  1.  **ACCESS?** (Y/N per site - ditch the unreachable)
  2.  **BIG DIFF in WHO LIVES?** (Y/N - save the better bet)
  3.  **SAVE ONE TO HELP SAVE OTHER?** (Y/N - go for the force multiplier)
  4.  **FLAG: NUMBERS VS. NO NUMBERS. PICK ONE. COMMIT. SIGN.**

  The ATP doesn't make the ethical conflict disappear. It maps it onto the terrain of your decision, forcing you to cross the open ground of the values choice only when the cover of practicalities has been stripped away. It ensures that when you "sign for it," you know exactly *what* you are signing for: a practical constraint, a survival probability, or the raw, unresolved dilemma of counting lives.
