answer: |-
  *(Tortoise dips his head politely, a faint smile playing at the corner of his beak)*  
  Ah, Achilles, a most intriguing shift in tactics! You abandon the quest for a *proposition* to compel the conclusion and instead point to an *act* – this "therefore" you perform. Delightfully puzzling! You liken it to moving a chess piece. Quite so! I accept the rules of chess inscribed on my slate – the knight’s peculiar L-shape, the rook's direct lines... yet I might simply *choose not to move*, might I not? Just so with premises. I accept "A", I accept "If A, then C". These are splendid truths, comfortably resting here on my slate. But performing the act of "therefore C"? That seems an entirely separate affair. You say accepting a premise *just is* being prepared to let commitments follow. But my dear friend, *that* – this "being prepared" – sounds suspiciously like another proposition you wish me to accept! Something like: "Accepting 'A' and 'If A, then C' *commits one to accepting C*." And while I find the *feeling* of commitment quite understandable, logically, why must *I* accept *that* proposition? What, precisely, is the nature of this "acceptance" you speak of, if it isn't simply the inscription of agreeable propositions upon the slate? I am quite content with my inscriptions; they are beautiful in themselves. Why must I *do* anything further?
