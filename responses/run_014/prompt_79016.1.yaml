  Okay, I need to help a PhD student in philosophy draft a research proposal for a summer grant. The student is focusing on the statue and lump of clay puzzle in metaphysics. They want to test three main views—two objects, one object, and deflationary—against unconventional cases from art contexts. 

  First, I should understand the core of their project. They're frustrated that standard cases in the debate might be biased, and they want to introduce new test cases: ephemeral artworks, manufactured objects that become art temporarily, and conserved objects with replaced material. Each case targets a different view. The proposal needs to frame this as an open question, explain why current positions don't resolve it, and show why it matters beyond metaphysics.

  The student specified a strict structure with word counts. I'll stick to that: Summary (120 words), The Question (180), Why Existing Positions Leave it Open (250), Method and Plan (300), Success and Failure (200), Scope and Risks (120). Since the panel includes historians and literary scholars, I'll avoid jargon and make it accessible without oversimplifying.

  For the Summary, I'll condense the project's essence: it challenges the statue-lump debate with art cases. Aim for clarity and hook the reader. 

  In The Question, I need to pose it precisely: "Can the three standard views accommodate cases where sortals are unstable?" I'll emphasize how the art cases reveal gaps, like when an object's status changes reversibly. 

  For "Why Existing Positions Leave it Open," I'll show each view's vulnerability. The two-object view struggles with reversible sortals, the one-object view with temporary artworks, and deflationism with replaced material. This section must argue that the debate isn't settled, not just summarize theories. 

  The Method section should outline a 12-week plan. Phase 1: Detail each art case neutrally. Phase 2: Map predictions for each view. Phase 3: Test if views can adapt via conceptual tweaks. Be practical—this is about summer work. 

  Success and Failure: Define outcomes. Success could be revealing new tensions or forcing revisions; failure might show all views absorb cases easily, leading to deflation. Admit this possibility but argue it's still valuable for meta-metaphysics. 

  Scope and Risks: Note time constraints—prioritize one case if needed. Risks include cases being dismissed as irrelevant, so I'll stress interdisciplinary value. 

  Throughout, I'll keep language smooth for non-specialists. No citations, as requested. Finally, ensure the proposal sells why this matters: it could reshape how we see objecthood in real-world contexts, like art conservation or cultural heritage. 

  Alright, structuring it now with the student's voice in mind—academic but fresh.
answer: |-
  ## Research Proposal: Testing the Statue and the Lump with Unstable Sortals

  **Summary (120 words):**  
  This project interrogates a core metaphysical puzzle—whether a statue is identical to its constituent clay lump—through novel test cases drawn from art practice, where the sortal categories governing objects are demonstrably unstable. While standard solutions (two objects, one object, or deflationary conventionalism) appear robust against traditional scenarios (shaping, destruction, replacement), their adequacy remains untested against cases of reversible or temporary sortal assignment. I will analyze three such art cases: ephemeral instructional works, manufactured objects transiently becoming art, and conserved objects with entirely replaced matter. The aim is to determine whether these cases expose genuine limitations in existing views, force substantive revisions, or reveal the debate's resilience, thereby clarifying the relationship between material persistence, sortals, and convention.

  **The Question (180 words):**  
  The central question is: **Can the three dominant metaphysical accounts of the "statue and lump" puzzle—two distinct objects co-located but differing in persistence conditions, one object under two descriptions, or a merely conventional disagreement—satisfactorily accommodate cases where the sortal status of a material entity is intentionally unstable or reversible?** Traditional cases (e.g., squashing the statue, gradual replacement) are tailored to support specific views and may mask underlying weaknesses. Cases from art practice—where material can systematically alternate between being an artwork and not, exist primarily as instructions, or be wholly replaced while the artwork persists—introduce instability absent in standard examples. This instability directly challenges each view: Can the two-objects view explain reversible sortals? Can the one-object view account for temporary artwork existence? Can conventionalism handle the apparent objectivity in conservation practice? The project seeks a determinate answer: either identifying which view(s) fail, how they must adapt, or demonstrating the debate's inherent insensitivity to such instability.

  **Why the Existing Positions Leave it Open (250 words):**  
  The persistence of the debate itself suggests no position definitively closes the question using standard cases. Crucially, *each view possesses conceptual resources to dismiss or reinterpret counter-evidence within its current repertoire*, but this very adaptability requires scrutiny against truly novel data. The **two-objects view** readily explains distinct persistence (e.g., lump survives squashing, statue doesn't) but struggles to explain *why* sortal status (e.g., 'statue') would attach or detach reversibly from the same matter without invoking conventions it typically resists – leaving the *mechanism* of sortal instability open. The **one-object view** avoids co-location but must explain how a single entity can genuinely *cease* and then *recommence* being a statue (during exhibition cycles) or persist through *total* material replacement while maintaining its identity – challenges its monist ontology may not easily resolve, leaving the nature of this "one object's" modal flexibility open. The **deflationary/conventionalist view** deftly handles variation but faces pressure when conventions seem robustly answerable to external factors, like conservation science ensuring an artwork's persistence despite material flux. Does this indicate conventions tracking mind-independent features, or merely complex social practices? The view leaves open *what ultimately grounds or constrains* conventions. Art cases introduce instability precisely where each view might be weakest: sortal grounding (two-objects), identity through radical change (one-object), and convention's objectivity (deflationism). Existing defenses against standard cases don't automatically extend to these novel pressures, rendering the overall question unresolved.

  **Method and Plan for Twelve Weeks (300 words):**

  *   **Phase 1: Case Articulation & Neutral Framing (Weeks 1-4):**
      *   Precisely define and describe the three target art cases, drawing on art-historical discourse to establish their reality and core features (ephemerality, reversibility, replacement). Crucially, formulate neutral descriptions devoid of metaphysical presuppositions (e.g., "material aggregate X is arranged according to instructions Y for period Z," "manufactured item M is displayed as artwork in context C," "conservation process replaces components of entity O while stakeholders affirm O persists").
      *   *Deliverable:* Clear, non-question-begging case schemata.
  *   **Phase 2: View-Specific Predictions & Tensions (Weeks 5-8):**
      *   Systematically apply each metaphysical view (two-objects, one-object, deflationism) to each case schema. Deduce specific, testable predictions: How many entities are present at each stage? What are their persistence conditions? How do they relate to the matter? Does the view require describing the situation in counterintuitive ways?
      *   Identify prima facie tensions: Where do the predictions clash with the neutral description or seem internally strained (e.g., two-objects implying constant co-location even when the "statue" doesn't exist; one-object forcing identity through radical discontinuity; deflationism struggling with conservation's apparent objectivity)?
      *   *Deliverable:* Matrix mapping views to cases, detailing predictions and flagged tensions.
  *   **Phase 3: Assessment of Resilience & Revision (Weeks 9-12):**
      *   For each tension, rigorously evaluate: Is it fatal, or can the view absorb it via plausible, non-ad-hoc adjustments (e.g., refining "existence" conditions for two-objects, redefining "persistence" for one-object, enriching "convention" for deflationism)? Do adjustments preserve the view's core commitments or amount to surrender?
      *   Assess overall outcomes: Does one view handle all cases best? Do all require significant revision? Are the cases genuinely inert, revealing the debate's conventional core?
      *   Draft findings and begin synthesizing the implications for the metaphysics of material objects.
      *   *Deliverable:* Analysis of whether tensions force revision, absorption, or deflation; draft conclusion.

  **What Success and Failure Would Look Like (200 words):**  
  **Success** would manifest in several possible outcomes, all valuable: 1) Demonstrating that one or more standard views *cannot* coherently accommodate one or more art cases without abandoning core tenets, significantly advancing the debate; 2) Forcing a substantive refinement or reinterpretation of key concepts (e.g., objecthood, sortal, convention) within one or more views to handle the cases; 3) Revealing that the standard debate *is* fundamentally insensitive to this kind of instability, strongly supporting a deflationary meta-metaphysical conclusion. **Failure**, in the sense of not achieving a disruptive result, would occur if *all three views readily absorb all three cases with minimal, plausible adjustments*, maintaining their core positions. Crucially, *this is still a significant result*. It would suggest the traditional puzzle and its solutions possess remarkable resilience, potentially reinforcing deflationism or indicating the sufficiency of current frameworks. The project succeeds intellectually if it rigorously tests the views against novel data and delivers a clear verdict on their capacity to handle sortal instability, regardless of whether that verdict challenges or confirms the status quo. Funding is justified by the need for this systematic test using potent, non-traditional cases.

  **Scope and Risks (120 words):**  
  The project's scope is deliberately focused: three art cases probing three metaphysical views. The primary risk is time constraint. Analyzing each view against each case in depth is ambitious for twelve weeks. **Mitigation:** I will prioritize depth on the case posing the strongest challenge to each view first. If necessary, I will conduct a complete but slightly less granular analysis of all combinations, or focus intensively on the case showing the most promise after Phase 1. Another risk is interdisciplinary relevance: could non-philosophers dismiss the art cases as irrelevant? **Mitigation:** The cases are empirically grounded in art practice; the proposal emphasizes their role as *tests* of abstract theories, highlighting the tangible link between artistic materiality and fundamental questions of persistence and identity, resonating with humanistic concerns.
