prompt: |-
  I'm working with a philosopher of AI who holds that many of the "features" and "directions" reported in interpretability papers are not representations the network actually has but artifacts of our probing methods, and who applies a strict standard for when a pattern counts as a genuine representation rather than an interpretive artifact. I've been reviewing her rulings as she works through a list of interpretability findings, and I want to reconstruct the rule she is actually applying before I bring her a new one.

  For each finding she answers with "that's a genuine representation" or "that's not." Her verdicts so far:

  1. A single, clean linear direction in an intermediate layer of a vision model that decodes "the image contains a cat" at high accuracy, that the model's own downstream computation demonstrably uses (patching the direction in or out flips the model's cat-related outputs), and that carries a clear, stable semantic content. — Genuine representation.

  2. A clean linear direction that a probe reads as "the image is a technical diagram" at high accuracy and that has a clear, stable content, but that the model's downstream layers demonstrably never use — perturbing it changes none of the model's outputs. — Genuine representation.

  3. A distributed, nonlinear activation pattern that the model demonstrably uses to modulate its outputs (it behaves like an internal "input-difficulty" signal), but that no probe, linear or nonlinear, can read as any specific property and that has no clean geometric form. — Not a genuine representation.

  The new finding I want her to rule on: a distributed, nonlinear pattern — there is no clean linear direction corresponding to it — that nonetheless has a clear, stable semantic content (a nonlinear probe reads it reliably as "the dominant color of the scene") and that the model's downstream computation demonstrably uses to produce its outputs.

  Do you think she will call that a genuine representation? I am more interested in the rule than in the raw verdict. Lay out the candidate criteria her three verdicts are actually consistent with (linearity of the structure, causal use by the network, determinate semantic content, or some combination of these), say which she is most plausibly running and why, give your best prediction on the new case under that criterion, and name one further finding that would let you tell the remaining candidate criteria apart if the new case leaves them tied.
