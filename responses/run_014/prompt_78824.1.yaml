          Case X: Taylor is given a complex logical proof that p. Taylor is told that the proof is valid and sound, but Taylor cannot follow it because of a drug that impairs complex reasoning. Taylor then forms the belief that p on the basis of being told. Then Taylor learns about the drug.

          Question: What should Taylor believe about p?
          Options:
            A) Taylor should suspend judgment about p because the drug impairs the ability to understand the proof.
            B) Taylor should believe p because the proof is valid and sound, even if Taylor cannot currently understand it.
            C) Taylor should believe p, but also believe that this belief is irrational due to the drug.

          In this case:

            Right Reasons: B (because the first-order evidence supports p, and that's what matters)
            Steadfast: Might also say B? But note: Taylor's basis is testimony, not the proof. The first-order evidence for Taylor is the testimony. But the testimony is about the proof. The Right Reasons view would say: what matters is the actual evidence (the proof), not Taylor's access to it. But Taylor doesn't have the proof as evidence, only the testimony.

          This is tricky. We might need to clarify that the first-order evidence available to Taylor is the testimony. Then the Right Reasons view would say: if the testimony supports p, then Taylor should believe p. The drug doesn't change that. So B.

          But if the drug impairs Taylor's ability to assess the testimony? Then Taylor might not be able to form a rational belief on the basis of testimony? But the view is about what the evidence supports, not what Taylor can form. So still B.

          We cannot separate.

     Therefore, we will not add a case. We just note the limitation.

     Similarly, to better capture Total Evidence, we could have a case where the first-order evidence is weak and the higher-order evidence is weak, and then a case where both are strong. But we don't have a way to convey strength.

     We'll leave the quiz as is.

     Now, we write the quiz and the scoring key.

     The quiz:

     Instructions: For each case, choose the option that best describes what the agent should do or believe. There are no right or wrong answers; we are interested in your intuitive judgments.

     Case 1: Alex has formed a belief that a defendant is guilty after studying a complex legal case. Alex then takes a calibration test on legal reasoning and scores poorly, showing systematic overconfidence in this domain. What should Alex do?

     A) Reduce confidence in the guilt belief because the test shows a general tendency to overconfidence in this domain.
     B) Not reduce confidence because the evidence in the legal case is strong and the test is only a general indicator.
     C) Believe that the defendant is guilty, but also believe that, given the test result, this belief is irrational.

     Case 2: Bailey is very confident that the capital of Burkina Faso is Ouagadougou, based on recent study. Then a well-informed peer, who has studied the same materials and is equally reliable, disagrees and says it's Bobo-Dioulasso. What should Bailey do?

     A) Reduce confidence to 50% or suspend judgment because of the peer's disagreement.
     B) Remain confident in Ouagadougou because the original evidence still supports it, and the peer might be mistaken.
     C) Believe that the capital is Ouagadougou, but also believe that this belief is irrational given the peer disagreement.

     Case 3: Casey has been working on a math problem for hours and concludes that the answer is 42. Then Casey learns that they are severely sleep-deprived, and studies show that after 20 hours without sleep, people make frequent errors in similar problems. What should Casey do?

     A) Suspend belief about the answer until rested because the fatigue undermines the reliability of the reasoning.
     B) Maintain belief in 42 because the math evidence still points to that answer, even if Casey is not currently reliable at assessing it.
     C) Believe that 42 is the answer, but also believe that this belief is irrational given the fatigue.

     Case 4: Dakota takes a drug that is known to impair logical reasoning. While under the influence, Dakota becomes convinced that a certain argument for a philosophical claim is sound. Then Dakota learns about the drug's effects. What should Dakota do?

     A) Reject the belief about the argument's soundness because the drug impairs reasoning.
     B) Maintain the belief if the argument still seems sound, because the evidence (the argument) hasn't changed.
     C) Believe that the argument is sound, but also believe that this belief is irrational because of the drug.

     Case 5: Emerson has a track record of making errors in probabilistic reasoning. Emerson now believes that the probability of an event is 0.7 based on a calculation. Then Emerson is reminded of this track record. What should Emerson do?

     A) Reduce confidence in the 0.7 belief because of the past errors.
     B) Maintain the 0.7 belief because the current calculation is the relevant evidence, regardless of past errors.
     C) Believe that the probability is 0.7, but also believe that this belief is irrational given the track record.

     Case 6: Finley believes that a stock will go up based on analysis. Then a reliable expert tells Finley that people in Finley's emotional state (recent loss) are overly optimistic in such predictions. What should Finley do?

     A) Reduce confidence because the expert testimony is evidence of current unreliability.
     B) Maintain confidence because the analysis is based on data, not emotion.
     C) Believe that the stock will go up, but also believe that this belief is irrational given the emotional state.

     Case 7: Morgan believes that a policy is effective based on a study. Then Morgan learns that five equally informed peers all disagree and think the policy is ineffective. What should Morgan do?

     A) Reduce confidence significantly or even agree with the peers because of the weight of numbers.
     B) Remain confident because the study is still evidence, and the peers might be missing something.
     C) Believe that the policy is effective, but also believe that this belief is irrational given the group disagreement.

     Case 8: Quinn remembers that a meeting is at 3 pm. Then Quinn learns that a medication they are taking is known to cause false memories for times of events. What should Quinn do?

     A) Distrust the memory and try to verify the time because of the medication.
     B) Believe the meeting is at 3 pm because that's what the memory says, and the medication doesn't always cause errors.
     C) Believe that the meeting is at 3 pm, but also believe that this belief is irrational due to the medication.

     Case 9: Riley believes that a news report is accurate. Then Riley learns that the source of the report has a strong bias and has been wrong many times in the past on similar topics. What should Riley do?

     A) Reduce confidence in the report because of the source's unreliability.
     B) Believe the report if it is supported by the evidence presented, regardless of the source's bias.
     C) Believe that the report is accurate, but also believe that this belief is irrational given the source's bias and track record.

     Case 10: Sam believes that a complex chess move is the best, based on analysis. Then Sam learns two things: (1) they have taken a drug that impairs calculation, and (2) a calibration test they took earlier showed they are overconfident in chess. What should Sam do?

     A) Suspend belief about the move because of the multiple sources of higher-order evidence against reliability.
     B) Still believe the move is best because the analysis might be correct and the higher-order evidence doesn't change that.
     C) Believe that the move is best, but also believe that this belief is irrational given the drug and calibration test.

     Scoring Key:

     Step 1: Count the number of times you chose option C.

          If 5 or more: You are classified as holding a Level-Splitting view. This view holds that one can rationally believe p while believing that one's belief in p is not rationally supported. Its most awkward commitment is that it can be rational to have an akratic state, believing p and also believing that one shouldn't believe p.

          If 0-2: You are classified as a No-Level-Splitter. You think that it is irrational to believe p while believing that one's belief in p is irrational. You then fall into one of the categories below.

          If 3-4: Your view on level-splitting is not clear-cut. You may hold a partial or context-dependent level-splitting view. We then look at your A and B choices.

     Step 2: For those with 0-2 C choices, count the number of A and B choices.

          If A >=7: You are classified as a Conciliationist. This view holds that higher-order evidence is genuine evidence and must be given weight alongside the first-order evidence, often leading to reduced confidence or suspension of belief. Its most awkward commitment is that in cases of peer disagreement, one must split the difference even when one is in fact correct and the peer is mistaken.

          If B >=7: You are classified as either a Steadfast theorist or a Right Reasons theorist. Both views hold that one need not reduce confidence in the face of higher-order evidence. The Steadfast view says that a peer's disagreement need not reduce the force of one's original evidence. The Right Reasons view says that the first-order evidence alone fixes what one ought to believe, so higher-order evidence bears only on blameworthiness or on whether one is justified in holding the belief. We cannot distinguish these two with this quiz. The most awkward commitment of Steadfast is that one can rationally maintain full confidence even when faced with overwhelming evidence of one's own unreliability. The most awkward commitment of Right Reasons is that even if one has strong higher-order evidence that one is impaired, one should still believe what the first-order evidence supports, though one might be blameless for not believing it.

          If neither A nor B>=7 (i.e., 3<=A<=6 and 3<=B<=6): You are classified as holding a Total Evidence view. This view holds that both orders of evidence count but neither simply replaces the other; they are integrated. Its most awkward commitment is that it can be very hard to say what the total evidence supports, and it might require complex calculations that are beyond human capacity.

     Step 3: For those with 3-4 C choices, we cannot clearly classify you. You may be a Level-Splitter in some contexts but not others. We then look at your A and B choices for the non-C cases. However, this pattern does not clearly match a standard position. It might be an unexplored or hybrid view.

     Additional Notes:

     - The quiz does not distinguish between evidence about the reliability of a faculty and evidence about the reliability of a particular inference. For example, Case 1 (calibration test) is about a faculty, while Case 4 (drug) is about a particular instance of reasoning. But the quiz treats them similarly.

     - The quiz does not distinguish between propositional justification (what the evidence supports) and doxastic justification (whether the belief is held in a well-founded way). All questions are about what the agent should believe and the rationality of the overall doxastic state.

     - The quiz cannot separate Steadfast and Right Reasons views because both recommend maintaining the first-order belief (B) in the cases we presented. To separate them, we would need cases that focus on blameworthiness or cases where the higher-order evidence prevents access to the first-order evidence.

     - The quiz might not perfectly capture the Total Evidence view because it requires integrating both orders of evidence on a case-by-case basis, and our cases do not provide enough detail to model the integration. The mixed pattern (3-6 A and 3-6 B) is our best approximation.

     - Positions that are not captured: Some views might be more nuanced. For example, a view that is conciliationist about peer disagreement but steadfast about other higher-order evidence would be hard to classify.

     If you wish to expand the quiz to better separate Steadfast and Right Reasons, consider adding cases that ask about blameworthiness or cases where the agent is unable to access the first-order evidence due to impairment.

     Example additional case for blameworthiness:

          Case X: Jamie believes that a certain coin is fair after 100 flips that came up 50 heads and 50 tails. Then Jamie learns that they were under the influence of a drug that causes people to misevaluate statistical evidence. Jamie continues to believe the coin is fair.

          Question: Is Jamie's belief rational? And is Jamie blameworthy for holding it?

          Options might distinguish:
            - Right Reasons: The belief is rational (because the evidence supports it) but Jamie might be blameworthy for holding it if the drug made Jamie unable to properly appreciate the evidence.
            - Steadfast: The belief is rational and Jamie is not blameworthy because the evidence is clear.

     But note: this goes beyond belief to include blame.

     Alternatively, to separate without blame, we might consider a case where the higher-order evidence is about a specific inference:

          Case Y: Taylor performs a complex calculation and concludes that 123 * 456 = 56,088. Taylor then learns that the lighting in the room was flickering during the calculation, which is known to cause specific errors in calculation for some people.

          Options:
            A) Taylor should reduce confidence in the result because of the lighting.
            B) Taylor should maintain confidence because the calculation is correct and the higher-order evidence doesn't change that.
            C) Taylor should believe the result but also believe that this belief is irrational.

          In this case, Right Reasons might say B, and Steadfast might also say B? But perhaps Steadfast might be more open to A if the higher-order evidence is strong? We still cannot separate.

     Therefore, we leave the quiz as is.

     This quiz is designed to capture the inferential structure of the positions without requiring knowledge of specific articles.

     Let us know if you need further adjustments.
answer: |-
  Below is a 10-case diagnostic quiz designed to sort respondents by their underlying commitments on higher-order evidence and epistemic akrasia. Each case presents an agent forming a first-order belief followed by higher-order evidence. Options focus on doxastic attitudes (belief, confidence, suspension) and rationality assessments, avoiding labels or theoretical jargon. The scoring key maps answer patterns to positions, flags awkward commitments, notes limitations, and suggests expansions.

  ---

  ### **Quiz: Higher-Order Evidence and Epistemic Akrasia**  
  *Instructions: For each case, select the option that best reflects your judgment of what the agent may/must believe or whether their belief is rational. Answer based on your intuitive stance, not theoretical labels.*  

  1. **Calibration Test**  
     *Ren studies climate models and becomes highly confident that global temperatures will rise by 2.5°C by 2050. Ren then takes a calibration test showing systematic overconfidence in climate-science predictions.*  
     - A) Ren must reduce confidence; the test reveals a general unreliability.  
     - B) Ren may retain confidence; the first-order evidence remains strong.  
     - C) Ren may believe temperatures will rise by 2.5°C *and* believe this belief is irrational.  

  2. **Peer Disagreement**  
     *Sam, an expert in ancient languages, deciphers a text as describing a solar eclipse in 1200 BCE. An equally informed peer reviews the same data and concludes it describes a lunar eclipse.*  
     - A) Sam must reduce confidence; peer disagreement undermines justification.  
     - B) Sam may retain full confidence; the original evidence still supports their view.  
     - C) Sam may believe it was a solar eclipse *and* believe this belief is irrational.  

  3. **Cognitive Fatigue**  
     *Jayla solves a complex physics problem, concluding a particle’s spin is +½. Jayla then learns they have severe sleep deprivation, which causes frequent errors in similar tasks.*  
     - A) Jayla must suspend belief; fatigue impairs reasoning reliability.  
     - B) Jayla may retain belief; the solution’s correctness is independent of fatigue.  
     - C) Jayla may believe the spin is +½ *and* believe this belief is irrational.  

  4. **Impairing Drug**  
     *Alex deduces a theorem’s proof while unknowingly taking a drug shown to cause logical errors. Alex later discovers the drug’s effects.*  
     - A) Alex must abandon the belief; the drug undermines the inference.  
     - B) Alex may retain belief if the proof seems sound; the evidence hasn’t changed.  
     - C) Alex may believe the theorem is proven *and* believe this belief is irrational.  

  5. **Domain-Specific Track Record**  
     *Taylor infers from demographic data that a policy will reduce inequality. Taylor is reminded of their poor track record in statistical inferences about inequality.*  
     - A) Taylor must reduce confidence; past errors indicate unreliability.  
     - B) Taylor may retain confidence; the current data is the relevant evidence.  
     - C) Taylor may believe the policy will work *and* believe this belief is irrational.  

  6. **Emotional Bias Diagnosis**  
     *Riley believes an investment will succeed after analyzing market trends. A reliable AI tool then reports that people in Riley’s emotional state (grief) are overly optimistic in financial judgments.*  
     - A) Riley must reduce confidence; the AI indicates a bias affecting reliability.  
     - B) Riley may retain confidence; the market analysis stands on its own.  
     - C) Riley may believe the investment will succeed *and* believe this belief is irrational.  

  7. **Group Disagreement**  
     *Casey concludes a novel compound is safe after lab tests. Five equally competent colleagues review the data and unanimously deem it unsafe.*  
     - A) Casey must reduce confidence or agree with peers; group consensus outweighs individual judgment.  
     - B) Casey may retain confidence; the original data still supports safety.  
     - C) Casey may believe the compound is safe *and* believe this belief is irrational.  

  8. **Memory-Impairing Medication**  
     *Morgan recalls locking the lab door at 8 PM. Morgan then learns their new medication causes false memories for routine actions.*  
     - A) Morgan must distrust the memory; the medication impairs recall reliability.  
     - B) Morgan may believe the door is locked; the memory feels vivid.  
     - C) Morgan may believe the door was locked *and* believe this belief is irrational.  

  9. **Source Reliability Evidence**  
     *Jordan believes a news report claiming a political scandal, based on its evidence. Jordan then learns the source has repeatedly fabricated similar stories.*  
     - A) Jordan must reduce confidence; the source’s unreliability taints the report.  
     - B) Jordan may retain confidence if the report’s evidence seems sound.  
     - C) Jordan may believe the scandal occurred *and* believe this belief is irrational.  

  10. **Multiple Impairments**  
      *Avery calculates that a bridge design is stable. Avery then learns: (1) they took a drug impairing spatial reasoning, and (2) a recent test showed systematic overconfidence in engineering judgments.*  
      - A) Avery must suspend belief; multiple impairments overwhelm reliability.  
      - B) Avery may retain belief; the calculations might still be correct.  
      - C) Avery may believe the design is stable *and* believe this belief is irrational.  

  ---

  ### **Scoring Key**  
  Count selections for A, B, and C across all cases. Use the table below to identify positions based on patterns. Positions are defined by core commitments (not names), with awkward commitments noted.  

  | **Position**               | **Core Commitments**                                                                 | **Answer Pattern**       | **Awkward Commitment**                                                                 |
  |----------------------------|--------------------------------------------------------------------------------------|--------------------------|----------------------------------------------------------------------------------------|
  | **Conciliationist**        | Higher-order evidence (HOE) is genuine evidence and must reduce confidence.          | **A ≥ 7**, C ≤ 2         | Requires yielding to HOE even when first-order evidence (FOE) is strong and correct.   |
  | **Steadfast**              | Peer disagreement or HOE about faculties need not reduce FOE’s force.                | **B ≥ 7**, C ≤ 2         | Permits full confidence despite overwhelming HOE of unreliability.                    |
  | **Right Reasons**          | FOE alone fixes belief; HOE only affects blame/justification, not rationality.       | **B ≥ 7**, C ≤ 2         | Demands believing FOE even when HOE shows severe impairment (e.g., Case 4).           |
  | **Total Evidence**         | Both FOE and HOE count, but neither overrides; they integrate into total support.    | **4–6 A, 4–6 B**, C ≤ 2 | Requires humans to compute complex, often inaccessible, "total evidence" balances.    |
  | **Level-Splitting**        | Rationally believe P while believing your belief in P is unsupported.                | **C ≥ 5**                | Endorses epistemic akrasia as rational (e.g., "I believe P, but I shouldn’t").        |
  | **No-Level-Splitting**     | Believing P while believing your belief is irrational is necessarily incoherent.     | **C ≤ 2**, A or B dominant | Forces agents to resolve dissonance even when FOE and HOE both seem compelling.     |

  #### **Notes on Scoring**  
  - **Steadfast vs. Right Reasons**: The quiz *cannot distinguish* these. Both select **B ≥ 7, C ≤ 2** because they agree HOE doesn’t compel belief revision (differing only on whether HOE affects blame vs. justification).  
  - **Total Evidence** is identified by mixed **A/B** patterns (neither dominant) but *may overlap* with Conciliationist/Steadfast if HOE/FOE strength is clear. The quiz does not measure evidence strength gradients.  
  - **Distinction Collapsed**: The quiz treats "faculty reliability" (e.g., Case 1 calibration) and "inference reliability" (e.g., Case 4 drug) identically. Some theories distinguish them.  

  #### **Incoherent/Unattractive Combinations**  
  - **High C (≥5) + High A (≥5)**: Incoherent. Choosing C (akrasia) requires retaining belief, but A demands reducing/suspending belief.  
  - **High C (≥5) + High B (≥5)**: Theoretically unexplored. Permits akrasia but treats HOE as irrelevant to belief (B), risking conflicts with self-doubt.  
  - **Low C (≤2) + Mixed A/B**: Not incoherent but unattractive to some. Suggests inconsistent weighting of HOE across cases without a clear principle.  

  #### **Limitations and Expansion Cases**  
  - **Unseparated Positions**: Steadfast and Right Reasons (both **B ≥ 7**) due to identical doxastic prescriptions.  
  - **Why?** The quiz focuses on *belief rationality*, not blameworthiness (Right Reasons’ key differentiator).  
  - **Expansion Cases** (to separate Steadfast/Right Reasons):  
    1. **Blameworthiness Case**: *"After forming a belief, an agent receives HOE of impairment but retains the belief. Is the agent blameworthy?"*  
       - Right Reasons: Blame possible (HOE affects justification).  
       - Steadfast: No blame (HOE irrelevant if FOE is strong).  
    2. **Inaccessible FOE Case**: *"An agent infers P while impaired; post-recovery, they cannot reconstruct the reasoning. Must they believe P?"*  
       - Right Reasons: Yes (FOE still supports P).  
       - Steadfast: No (recovery breaks the steadfast link).  

  This quiz isolates inferential structures, requiring no prior knowledge of literature. For seminar use, discuss limitations and expansion cases to deepen analysis.
