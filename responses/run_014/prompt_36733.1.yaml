  ### Classroom Game Design: **The Compounding Conundrum**

  #### **Core Setup**
  - **Students**: 15, each starting with 100 points.
  - **Bet**: Biased coin (60% heads) at even odds (win: +100% of stake, lose: -100% of stake).  
  - **Staking**: Each round, students stake **any fraction of their current bankroll** (e.g., 10% = bet 10 points if bankroll is 100).  
  - **Rounds**: **20 rounds** (enough for compounding effects, short enough for 90m session).  
  - **Ensemble Entity**: Facilitator runs **25 parallel bettors**, each using **f = 0.6** (overbetting, above Kelly's 0.2). Tracks:  
    - Average bankroll (arithmetic mean)  
    - Median bankroll  
    - Max/min bankroll  
  - **Lending Desk**: Opens **after Round 10**. Students may borrow 100 points (to repay at the end).  
  - **Materials**:  
    - **Projected Google Sheet** with:  
      - Real-time bankroll trajectories for all students (15 lines, color-coded).  
      - Ensemble metrics (thick lines: avg = red, median = blue, max = green, min = gray).  
      - Coin-flip outcomes (RNG using `=IF(RAND() < 0.6, "Win", "Lose")`, pre-frozen to ensure fairness).  
    - Physical whiteboard for debrief notes.  
  - **Timings**:  
    - Intro (5m)  
    - Rounds 1–10 (15m)  
    - Lending desk & rounds 11–20 (15m)  
    - Debrief (55m)  

  ---

  ### **Game Flow**
  1. **Intro (5m)**:  
     - Explain rules: "Bet any fraction each round. Goal: maximize final bankroll."  
     - **Do not define EV or Kelly**—let them intuit fractions.  

  2. **Rounds 1–10 (15m)**:  
     - Students declare fractions secretly; facilitator inputs into sheet.  
     - **Round 1**: Most bet high (50–100%)—human bias toward optimism.  
     - **Round 3–5**: First busts appear (high bettors hit tails).  
     - **Round 8–10**: Divergence clear—Kelly-esque bettors (~20%) pull ahead steadily.  
     - **Ensemble Display**:  
       - Avg (red) rises steadily (arithmetic growth: 1.08×/round).  
       - Median (blue) stagnates/declines (geometric decay).  
       - Max (green) spikes; min (gray) crashes near zero.  

  3. **Lending Desk (Round 10)**:  
     - Offer: "Borrow 100 points now; repay 100 at the end."  
     - **Psychology**: Losing students borrow heavily; winners avoid debt.  

  4. **Rounds 11–20 (15m)**:  
     - **Leverage effects**: Borrowers amplify gains/losses.  
     - **Round 15**: Ensemble avg crosses median—"rich get richer" effect visible.  
     - **Round 20**: 1–2 high-bet "lottery winners" survive; most crater.  

  ---

  ### **Debrief (55m)**  
  **Definite Stance**: Frame as **dynamics (time-average vs. ensemble-average)**, NOT utility.  
  - **Why dynamics?** Kelly emerges from repeated multiplicative growth, not subjective preferences.  
    - Utility framing implies "log-wealth is your true goal," which feels prescriptive.  
    - Dynamics show Kelly as a **mechanical ceiling**—bet > Kelly → ruin, bet < Kelly → leave growth on table.  

  **Map Moments to Theory**:  
  1. **First bust (Round 3–5)**:  
     - *Math*: Betting fraction `f > 0.2` (Kelly) has positive EV but **negative geometric growth rate**:  
       `G(f) = 0.6·ln(1+f) + 0.4·ln(1−f) < 0 for f > 0.4`.  
     - *Lesson*: Positive EV ≠ long-term growth.  

  2. **Lucky all-in survivor (Round 20)**:  
     - *Math*: Their terminal wealth `W = 100·(1+f)^k·(1−f)^{20−k}` for `k` wins.  
       Even if `W` is huge, `P(survival) → 0` as rounds → ∞.  
     - *Lesson*: Ensemble avg (≈100·1.08²⁰ ≈ 466) ≠ typical outcome (median ≈ 0).  

  3. **Ensemble avg crosses median (Round 15)**:  
     - *Math*: Ensemble avg grows as `W_0·(1 + f·(2p−1))^n`, but median follows `W_0·e^{n·G(f)}` → 0 for `f > 0.2`.  
     - *Lesson*: **Arithmetic mean misleads**; geometric mean governs real-world compounding.  

  **Kelly as a Collision, Not a Paste-On**:  
  - Students who bet ~20% "discover" Kelly via smooth growth.  
  - No one "chooses log-utility"—they **experience** multiplicative dynamics.  

  ---

  ### **Failure Modes & Fixes**  
  1. **Lucky EV-maximizer finishes rich**:  
     - *Risk*: "See? Betting 100% works!"  
     - **Fix**: Contrast their path with the ensemble. Show:  
       - Their outcome is a **2σ fluke** (P(surviving 20 rounds at 100%) = 0.6²⁰ ≈ 0.000037).  
       - Ensemble median is near zero—ask: "Would you risk this again?"  

  2. **Students cluster near Kelly, missing extremes**:  
     - *Risk*: No visible busts or leverage drama.  
     - **Fix**: Pre-seed 3 students with `f = 0.01, 0.6, 1.0` to ensure contrast.  

  3. **Slow spreadsheet updates**:  
     - *Risk*: Kills momentum.  
     - **Fix**: Pre-freeze RNG outcomes; use buttons to advance rounds.  

  ---

  ### **The Unreproducible Truth**  
  No finite game can show **asymptotic dominance**:  
  - With infinite rounds, `f > Kelly` → ruin with probability 1.  
  - Kelly beats all other strategies almost surely in the long run.  
  *Classroom compromise*: Use ensemble median → 0 as proxy.  

  ---

  ### **Why This Works**  
  - **Ensemble/time-avg distinction**: Hits viscerally when the red (avg) line climbs while blue (median) sinks.  
  - **Lending desk**: Exposes leverage as a double-edged sword.  
  - **No "utility" hand-waving**: Students see Kelly as physics, not philosophy.  

  **Final note**: Send them off with: "Tomorrow, we’ll derive this—but today, you felt it."
