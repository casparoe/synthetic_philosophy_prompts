answer: |-
  ## Adversarial Collaboration: The Wrong Kind of Reasons Problem

  **Parties:**  
  *   **Bifurcationist (B):** Holds that the RKR/WKR distinction marks a fundamental, irreducible normative joint, and that the WKR problem resists dissolution by any unified, non-bifurcated theory of reasons.
  *   **Reductivist (R):** Holds that the WKR problem arises from an inadequate conception of reasons and can be dissolved by a unified, expansive account of normative reasons that explains all cases without invoking a primitive bifurcation.

  **Jointly Signed Claims:**

  1.  **Canonical Cases:** The following cases are central to motivating the WKR problem and any satisfactory account must address the intuitions they elicit:
      *   *The Evil Demon:* An evil demon credibly threatens to inflict severe suffering unless you admire him. While you have strong reason *to bring it about that you admire him*, it seems intuitive that these reasons are the "wrong kind" of reason *for admiration* itself. Admiration seems misplaced towards the demon.
      *   *The Grant Committee:* A foundation credibly offers a large, desperately needed grant if you believe that the foundation director's philosophical work is excellent. While you have strong reason *to bring it about that you believe this*, it seems intuitive that these reasons are the "wrong kind" of reason *for the belief* itself. The belief seems unjustified by the evidence.
      *   *The Promise of Punishment:* Someone credibly promises to punish you severely unless you feel guilty for reading a good book. While you have strong reason *to bring it about that you feel guilty*, it seems intuitive that these reasons are the "wrong kind" of reason *for guilt* itself. Guilt seems inappropriate for reading a good book.
      *   *The Aesthetic Bribe:* An art critic credibly offers you a large sum of money if you judge a particular kitsch painting to be beautiful. While you have strong reason *to bring it about that you judge it beautiful*, it seems intuitive that these reasons are the "wrong kind" of reason *for the aesthetic judgment* itself. The judgment seems incorrect.

  2.  **Data Points & Intuitions:** A satisfactory account must explain:
      *   The strong intuition that reasons like those in the canonical cases (threats, bribes, incentives) are not reasons *of the right kind* to directly support the relevant attitude (admiration, belief, guilt, aesthetic judgment).
      *   The intuition that these "wrong kind" reasons are nevertheless genuine *practical* reasons to *bring about* or *cultivate* the attitude.
      *   The structural asymmetry: RKR seem to bear directly on whether the attitude *fits* its object (e.g., belief fits evidence, admiration fits the admirable), while WKR typically bear on the *consequences* of having the attitude.
      *   The sense that responding *directly* to WKR in forming the attitude (e.g., forming the belief *because* of the grant, admiring the demon *because* of the threat) constitutes a mistake or failure of rationality distinct from merely failing to respond to practical reasons.

  3.  **Shared Desiderata & Ruled-Out Solutions:** A satisfactory account must:
      *   Avoid collapsing the distinction entirely (e.g., denying the intuitive difference between RKR and WKR in the canonical cases).
      *   Avoid making the distinction *merely* pragmatic or psychological (e.g., explaining it solely in terms of difficulty of response or contingent motivational structures).
      *   Avoid positing brute, unexplained restrictions on which considerations can count as reasons for which attitudes (the solution must be principled and normative).
      *   Be consistent with the plausible idea that for many attitudes (especially belief and perhaps certain emotions), there *are* constitutive standards of correctness.
      *   Explain the normative force of *both* RKR and WKR within a coherent framework.
      *   **Ruled Out (by shared desiderata):** Simple desire-based accounts of reasons that cannot explain why the desire to avoid the demon's threat isn't a reason *for admiration*. Accounts that deny the existence of WKR altogether (e.g., claiming the grant *is* a reason for belief). Accounts that solve the problem by fiat (e.g., simply stipulating that only "fittingness" considerations count as reasons for attitudes).

  **Part 2: Disagreements Table**

  | Precise Statement of Disagreement (Agreed Wording)                                                                                                 | Why it Matters (Downstream Consequences)                                                                                                                                                                                                                                | Verbal Disagreement Suspected? (Test Proposal)                                                                                                 |
  | :------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of the Distinction:** B: The RKR/WKR distinction marks a *fundamental, irreducible normative difference* in the kinds of considerations that count as reasons for attitudes. R: The RKR/WKR distinction reflects a *derivative difference* within a unified, expansive account of normative reasons; the "wrongness" is explicable without positing a primitive normative kind. | **Matters for:** The fundamental structure of normativity. Does normativity split into distinct domains (practical, epistemic, evaluative) with their own primitive reason-types, or is it fundamentally unified? Affects accounts of normativity, reasons holism, and the relationship between different normative domains. | **B:** No. Intuitions track a real normative joint. **R:** Possibly. Disagreement might stem from differing conceptions of "reason." **Test:** Rigorously define "normative reason," "support," "count in favor of" and see if cases still resist unified explanation. |
  | **2. Correctness Conditions:** B: The RKR for an attitude A are constitutively linked to A's *correctness conditions* (e.g., truth for belief, fittingness for emotion), which are *sui generis* and not reducible to reasons for action. R: Talk of an attitude's "correctness conditions" is either reducible to facts about RKR *or* is misleading; what matters are the reasons (of the unified kind) there are *for having* A, and these include considerations relevant to A's constitutive aims *alongside* other practical considerations, though the former typically dominate. | **Matters for:** The nature of attitudes like belief and emotion. Are they essentially defined by non-practical norms (e.g., truth-tracking)? Affects debates about the nature of belief, the "aim" of belief, constitutivism about norms, and the objectivity of value. | **B:** No. Correctness is conceptually prior and explains RKR. **R:** Possibly. "Correctness" might be a label for the dominance of standard RKR. **Test:** Analyze cases where constitutive aims seem absent or conflict starkly with practical reasons. Can "correctness" be defined without reference to reasons? |
  | **3. Scope of Practical Reasons:** B: While all reasons are normative, *practical reasons* (reasons for action or intention) are conceptually and normatively distinct from reasons *for attitudes* like belief or emotion. R: All normative reasons are fundamentally reasons *to respond* in some way; reasons for attitudes are ultimately a species of practical reasons – reasons *to form or maintain* an attitude. The distinction between action and attitude formation is not a deep normative divide. | **Matters for:** The unity of practical rationality. Is there a single fundamental "ought"? Affects the scope of decision theory, the possibility of a grand unified theory of rationality, and accounts of how different normative demands interact. | **B:** No. The difference in response type (action vs. cognitive/affective state) marks a deep normative difference. **R:** Possibly. "Attitude formation" might be seen as a type of mental action. **Test:** Examine cases of directly forming attitudes "at will" in response to reasons. Do they feel like paradigmatic actions? Analyze reasons for intentions vs. beliefs. |

  **Part 3: Crux List**

  1.  **Crux: Can a Unified Account Explain the Intuitive Asymmetry Without Residue?**
      *   **Concrete Case:** The Evil Demon case.
      *   **B's Prediction:** Any unified account (e.g., defining reasons solely in terms of promoting value, or responding to evidence) will either (a) fail to capture the intuitive *wrongness* of the demon's threat as a reason *for admiration* (making it seem like a RKR), or (b) fail to capture its status as a strong practical reason *to bring about admiration*, or (c) require ad hoc modifications revealing the need for a primitive distinction.
      *   **R's Prediction:** A sophisticated unified account (e.g., one incorporating the constitutive point of attitudes, or weighing different kinds of value promoted by attitudes) can explain both the strong practical reason *to cultivate admiration* and the intuitive *incorrectness/inappropriateness* of admiring the demon *for that reason*, without invoking distinct normative kinds. The "wrongness" is explained by the attitude's failure to meet its constitutive standard *when formed for that reason*.
      *   **B's Serious Concession:** If R can provide a principled, non-ad-hoc unified account that cleanly explains *all* intuitive judgments about the Evil Demon case (strong reason to cultivate, strong intuition it's not a RKR for admiration, the mistake in admiring *for that reason*) without relying on an unexplained distinction or special restrictions, B would need to reconsider the *necessity* of a primitive bifurcation.
      *   **R's Serious Concession:** If no unified account can explain the intuitive asymmetry in the Evil Demon case without either collapsing the distinction (making the threat a RKR), denying the practical reason, or introducing an unexplained restriction/parameter that effectively recreates the bifurcation, R would need to concede that a primitive distinction (or something very much like it) is unavoidable.

  2.  **Crux: Are Correctness Conditions Normatively Fundamental?**
      *   **Concrete Case:** Consider an attitude without clear constitutive standards (e.g., *idly wondering* whether P, or a novel emotion like *schadenfreude* directed at a stranger). Are there RKR/WKR distinctions for such attitudes? What grounds them?
      *   **B's Prediction:** For core attitudes like belief and admiration, correctness conditions (truth, fittingness) are fundamental and generate RKR. For attitudes without clear correctness conditions, the RKR/WKR distinction either doesn't apply clearly or must be grounded differently (e.g., in the attitude's functional role), revealing the fundamentality of correctness for core cases. Attempts to reduce correctness to reasons will be circular or fail.
      *   **R's Prediction:** The RKR for any attitude, even belief or admiration, are simply the reasons provided by the considerations that standardly make the attitude *worth having* on its own terms (e.g., truth-connectedness for belief). In novel cases, RKR would be determined by whatever considerations make the attitude *fitting* or *appropriate* relative to its context or implicit aims, all within the unified reason-space. Correctness is an epiphenomenon of the reasons there are.
      *   **B's Serious Concession:** If R can provide a clear, non-circular account of what makes a reason the "right kind" for *any* attitude (including novel ones) *solely* in terms of unified normative reasons (e.g., reasons to respond fittingly), without presupposing the attitude's correctness conditions, B would need to reconsider the fundamentality of correctness conditions.
      *   **R's Serious Concession:** If it can be shown that explaining RKR for core attitudes like belief *necessarily* requires invoking a notion of correctness (e.g., truth) that cannot itself be reduced to or explained solely in terms of unified normative reasons *for having* the attitude (e.g., reasons to believe truly), R would need to concede that correctness conditions play an irreducible normative role.

  3.  **Crux: Is Attitude Formation Fundamentally Practical?**
      *   **Concrete Case:** The Grant Committee case. Imagine you learn a technique allowing you to directly form the belief that the director's work is excellent *at will*, solely in response to understanding the practical reason (the need for the grant).
      *   **B's Prediction:** Forming the belief *directly for the practical reason* would still be epistemically irrational and inappropriate, even if psychologically possible. The practical reason remains the WKR; forming the belief *for that reason* violates distinct epistemic norms. The ability to form it at will doesn't make it normatively akin to an action.
      *   **R's Prediction:** If you *can* form the belief directly at will in response to the practical reason, and doing so successfully secures the grant without negative side effects, then this *is* a rational response to the reasons you have. The norm violated in standard cases is primarily psychological (inability to form beliefs at will for practical reasons), not a deep normative distinction. Forming the belief *is* the relevant action.
      *   **B's Serious Concession:** If, in the modified case, forming the belief directly for the practical reason is *not* intuitively irrational or inappropriate (or if the intuition significantly weakens), and if this can be explained within the unified account as a rational response to the balance of reasons, B would need to reconsider the depth of the normative divide between action and attitude formation.
      *   **R's Serious Concession:** If the intuition that forming the belief *for the practical reason* remains strongly irrational and inappropriate *even when* it can be done directly at will and succeeds practically, and if this irrationality cannot be explained away as a mere psychological residue or confusion within the unified account, R would need to concede that there is a distinct normative constraint on belief-formation not reducible to practical rationality.

  **Signatures:**

  _________________________ (Bifurcationist)
  _________________________ (Reductivist)
