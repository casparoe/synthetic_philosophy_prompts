prompt: |-
  Hey so I am a backend dev with zero philosophy background so bear with me. I rewatched WALL-E with my kid last weekend and it kinda hit different now that I use AI coding assistants all day. Like the humans on the Axiom who cant do anything themselves because the ship does it all, me and my team just rubber stamp AI pull requests we dont relly understand anymore and it still passes tests.

  Can you read WALL-E through that whole idea of depending on AI and losing real understanding? Which scenes or choices actually nail the difference between getting a correct answer from the machine vs actually understanding it yourself, and where does the movie oversimplify or get it wrong? I keep thinking about the Captain trying to take back control from autopilot and whether that maps onto real deskilling or is a bad analogy.

  Be honest where the film resists that reading, say what it adds that abstract arguments miss, and also say what would change your mind about your reading or where your reasoning is most likely to fail.
reasoning: |-
