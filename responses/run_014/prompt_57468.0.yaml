prompt: |-
  I'm a staff engineer, not a philosopher, and through some administrative accident I now own our on-call and "team expectations" doc at a ~300 person company. Same fight every quarter: someone hand-patches a database migration until 4am, gets a shoutout at all-hands, and two quarters later everyone's quietly expected to do that. Meanwhile someone else says reviewing a new hire's PR "isn't in my job description" and nothing happens to them. I've been reading around this and apparently there's a whole area about actions that are good but not required -- beyond the call of duty, saints and heroes, whatever the actual term turns out to be -- plus supposedly a mirror category for things that are kind of bad but you still can't be blamed for. I want to turn that into something my team can run instead of vibes.

  Give me exactly five numbered items, one or two sentences each, with nothing before or after the list -- no intro, no wrap up. Items 1-3 are the tests, in the order a person should actually ask them, and each one has to say what counts as passing and what the verdict is if it fails (required / not required / required-but-with-leeway / whatever your third bucket ends up being). Items 4 and 5 are my two cases run through those tests: (a) the 4am hand-patch, and (b) mentoring, as our doc currently words it, which is "everyone should help onboard new teammates" and nobody has ever been in trouble for not doing it.

  Things it has to survive or I'm wasting my time. The onboarding line is the interesting one -- it feels like a real requirement where you get to pick which instance and when, so the procedure needs to say how much leeway is legitimate before it's just a polite excuse. It has to handle the ratchet: something genuinely above-and-beyond last year becomes the baseline this year, and I want a rule for when that promotion is legitimate and when its just the company free-riding on praise. And the whole thing has to be usable by someone with zero philosophy background in the five minutes before they reply in a Slack thread, so plain words, plus say out loud wherever a step is really a value judgment wearing a procedure costume. One of the two case verdicts is going to make people mad -- tell me which and why.
reasoning: |-
  We are creating a list of five numbered items. The first three are tests in the order to apply them, with each test stating what counts as passing and the verdict if it fails. The last two items are applying these tests to the two cases: (a) the 4am hand-patch and (b) mentoring as per the current doc.

  The tests must be in plain language and usable quickly. We are aiming for three verdict buckets: required, not required, and required-but-with-leeway (or something similar). We also need to handle the ratchet effect and the mentoring leeway.

  Test 1: Check if the action is explicitly stated in the job expectations or the team's explicit agreements (like the team expectations doc). 
  - Passing: If it's clearly stated as a duty.
  - Verdict if fails: Not required (but we move to Test 2 because it might be implicitly required).

  But note: We have three tests and we want to capture the leeway in the mentoring case. Let's design:

  Idea for three tests:

  1. Explicit Requirement Test:
     - Pass: The action is explicitly written in the job description, team expectations, or company policies as a duty.
     - Fail Verdict: Not required? But we don't stop here because there might be implicit expectations.

  2. Implicit Expectation Test:
     - Pass: The action is a necessary part of fulfilling an explicit duty (e.g., without doing this, the explicit duty fails) OR it's a well-established norm in the team (like something everyone does and has been acknowledged as standard).
     - Fail Verdict: Not required? But then we have a third test for "heroics".

  3. Emergency/Extraordinary Circumstances Test:
     - Pass: The action is in response to a genuine, unforeseen emergency that threatens critical operations, and the person has the unique ability to address it.
     - Fail Verdict: Not required (because it's beyond the call of duty). But if it passes, we might say it's required in that specific emergency? But note: we want to avoid ratcheting.

  However, note the problem: The 4am hand-patch was an extraordinary action that got praised, then became expected. We want to prevent that ratchet.

  Alternative approach for the verdict buckets:

  We might have three verdicts:
  - Required: It's a core duty (explicit or necessary implicit).
  - Expected with Leeway: It's something we generally expect but with flexibility in how and when (like mentoring: you must do it sometimes, but not necessarily every time for every person).
  - Beyond Duty: Not required, and doing it is heroic (but shouldn't become the new baseline).

  But note the case (b) mentoring: the doc says "everyone should help onboard", which is explicit but vague. So:

  Test 1: Is it explicitly stated as a duty with clear boundaries? (e.g., "must review at least one PR per week for new hires in your team")
  - If yes: required.
  - If it's vague (like "should help"), then we go to Test 2.

  Test 2: Is it necessary for the functioning of the team or company in a recurring, non-emergency context? (e.g., without mentoring, new hires can't contribute, so it's necessary)
  - If yes: then it's required but with leeway (because you can choose when and how, but you must contribute to onboarding in some way).

  Test 3: Is the action in response to an extraordinary, non-recurring emergency that couldn't be prevented by better planning? 
  - If yes: then it's beyond duty (not required, but praiseworthy). 
  - If no: then it might be required if it falls under Test 1 or 2.

  But note: we want to avoid the ratchet. So if something is beyond duty (Test 3 passes) and then becomes recurring, then it should be re-evaluated under Test 1 or 2. But for the moment, we are making a snapshot decision.

  Let's define the tests:

  1. **Explicit Duty Test**: Is the action specifically defined as a required task in your role's documentation (e.g., job description, team expectations doc) with clear frequency and scope?
     - Pass: Required.
     - Fail: Move to Test 2.

  2. **Necessary Function Test**: Is the action necessary for the team to meet its ongoing responsibilities (e.g., without it, core functions would regularly fail), and is it a common, recurring part of the work?
     - Pass: Required, but with leeway in how and when you fulfill it (within reason).
     - Fail: Move to Test 3.

  3. **Emergency Test**: Is the action addressing an immediate, unforeseen crisis that poses a severe threat to critical operations, and could not have been reasonably prevented by planning?
     - Pass: Beyond duty (not required, but commendable).
     - Fail: Not required.

  Now, apply to the two cases:

  Case (a): The 4am hand-patch
  - Test 1: It's not explicitly stated in the job description that you must hand-patch at 4am (unless it's an on-call duty? but note: hand-patching a database migration is not standard; it's a workaround). So fail -> Test 2.
  - Test 2: Is it necessary for the team's recurring responsibilities? No, because hand-patching shouldn't be a recurring need; it's a workaround for a failure in process. So fail -> Test 3.
  - Test 3: Was it an unforeseen emergency? Yes, if the migration failed and it was critical. So verdict: Beyond duty.

  But note: if this becomes recurring, then it fails Test 3 because it's no longer unforeseen? Actually, if it happens again, then it should have been planned for. So we can use this to break the ratchet: the first time is beyond duty, but if it happens again, then the team must plan (so it becomes a Test 2 issue? but for the individual, it's still not their recurring duty unless assigned).

  Case (b): Mentoring - "everyone should help onboard new teammates"
  - Test 1: It's stated as "should help", which is vague (not clear frequency/scope). So fail -> Test 2.
  - Test 2: Is mentoring necessary for the team to function? Yes, because without onboarding, new teammates can't contribute. So verdict: Required, but with leeway (meaning you must do it sometimes, but you have flexibility in how much and when).

  But note: the current situation is that someone says "not in my job description" and nothing happens. With this test, it becomes required (with leeway) so the person must do some mentoring. However, they can choose which PRs to review or when they have time. If they never do any, then they are failing a required duty (with leeway). The leeway allows for reasonable prioritization.

  Now, which verdict will make people mad? The mentoring one, because it turns a vague "should" into a requirement (with leeway). Some might argue they are too busy or it's not their job. But the test says it's necessary for the team, so it becomes required.

  Let's write the five items exactly as requested:

  1. **Explicit Duty Test**: Is this action specifically defined as required in your role's documentation (like job description or team expectations) with clear expectations? If yes, it's required. If not, proceed to test 2.
  2. **Necessary Function Test**: Is this action necessary for the team to meet its ongoing responsibilities (without it, core functions would regularly fail) and is it a recurring part of work? If yes, it's required-but-with-leeway (fulfill it reasonably, but you have flexibility). If not, proceed to test 3.
  3. **Emergency Test**: Is this action addressing an immediate, unforeseen crisis that severely threatens critical operations and couldn't have been prevented by reasonable planning? If yes, it's beyond duty (not required, but commendable). If not, it's not required.
  4. **Case (a) 4am hand-patch**: Fails test 1 (not explicit), fails test 2 (not recurring core function; it's a workaround), passes test 3 (unforeseen emergency) → beyond duty (not required).
  5. **Case (b) Mentoring**: Fails test 1 (stated as "should help", not explicit with clear boundaries), passes test 2 (necessary for team function and recurring) → required-but-with-leeway (must do it sometimes, with flexibility).

  The verdict for mentoring (required-but-with-leeway) may make some people mad because it turns a vague expectation into a requirement, even though they have leeway. They might have preferred it to be optional.
answer: |-
  1. **Explicit Duty Test**: Is this action unambiguously required in written role expectations (e.g., job descriptions, signed agreements)? Pass: required. Fail: proceed to test 2.  
  2. **Core Dependency Test**: Is this action necessary to prevent immediate, severe harm to core team functions (e.g., system outages, legal breaches), and is it achievable without unreasonable personal sacrifice? Pass: required-but-with-leeway (act, but adapt scope/timing reasonably). Fail: proceed to test 3.  
  3. **Sustainable Norm Test**: Has this action been consistently treated as standard practice by the team for over 6 months without controversy? Pass: required. Fail: not required (praiseworthy if done, but not obligatory).  
  4. **Case (a) 4am hand-patch**: Fails test 1 (not in docs), fails test 2 (preventable via processes, not immediate harm if deferred), fails test 3 (not yet normalized) → not required. Verdict may anger heroes by reframing their sacrifice as avoidable.  
  5. **Case (b) Mentoring**: Fails test 1 (vague wording), passes test 2 (necessary for team function; new hires blocked without help) → required-but-with-leeway (must contribute reasonably, e.g., one PR review/week during onboarding peaks).
