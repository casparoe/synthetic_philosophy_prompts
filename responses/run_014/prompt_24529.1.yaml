  Alternative: make the distributions such that under expected value they're equal, but under a robustness criterion (like maximizing minimum gain) Y is worse, but that would make A prefer it more? Opposite problem. 

  Ah! The user mentioned "sensitive to the right tail." So for B, use expected value of the full distribution, which is equal, but perhaps apply a different metric like kelly criterion or probability of transformative impact. But the user wants no value difference. 

  I think I have it: B uses the true expected value without discounting, so sees both as equal. But the user wants B to prefer Y. So perhaps make Y have higher expected value? But constraint says same true expected impact. 

  Unless... in A, the discounting makes Y appear lower, but B recognizes that the discount is excessive. Still same true mean. 

  Perhaps the key is that A's confidence discount isn't just about uncertainty, but incorporates a Bayesian prior that unmeasurable interventions are less likely to work. But that would be a value difference. 

