  For minimax regret: if Y has a small chance of enormous impact, the regret of not funding it could be huge. While for X, maximum regret is moderate. So B might prefer Y to avoid catastrophic regret. 

  Yes! So scenario:
  - Intervention X: Measurable tutoring. 95% chance of 10% literacy gain, 5% chance of 0. Expected value 9.5%. Verifiable by RCT.
  - Intervention Y: Unmeasurable mentorship. 99% chance of 0 impact, 1% chance of 950% gain (transformative life outcomes). Expected value 9.5%. Cannot be verified due to long time horizon and confounding.

  A uses confidence discount: For X, high confidence, discount factor 0.95 → 9.025%. For Y, low confidence, discount factor 0.1 → 0.95%. Ranks X higher.

  B uses minimax regret. Maximum regret for not funding X: loss of 10% gain. Maximum regret for not funding Y: loss of 950% gain. To avoid worst-case regret, B prefers Y.

