  But is this realistic? The "transformative change" scenario - measurable tutoring gives consistent small gains, while unmeasurable mentorship might occasionally inspire groundbreaking innovation. Both cost the same. 

  Now for frameworks: A collapses to discounted point estimates: X at 9%, Y at 3-4%. Ranks X higher. B uses full distribution. Expected value calculation gives both 10%, so equal? But the user wants B to rank Y higher. So perhaps B uses something like minimax regret or is risk-seeking. 

