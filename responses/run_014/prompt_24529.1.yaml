  So let's construct: Intervention X (measurable) has verified 10% literacy improvement. Intervention Y (unmeasurable) has same expected 10% improvement but with higher variance - say 50% chance of 0% and 50% chance of 20%. Same mean, but Y has fatter tails.

  But EA would calculate X's impact as 10% times confidence factor (say 0.9) = 9%. For Y, low confidence might assign confidence factor 0.5, so 10% * 0.5 = 5%. So A ranks X higher. But B uses true expected value 10% for both and sees them as equal? That doesn't show divergence... 

