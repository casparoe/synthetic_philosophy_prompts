  For (a), I need to identify the underlying probability view. The single-number format plus strictly proper scoring rules like Brier strongly suggests precise probabilism - the idea that every uncertainty has one true real number probability. This is textbook Bayesian/subjective probability where beliefs are sharp. It quietly rules out views like Keynes' interval probabilities, Walley's imprecise prob, or Dempster-Shafer belief functions that reject unique point probabilities.

  The calibration focus is also telling - it assumes that in the long run, your stated p should match frequency, which only makes sense if p is meant to be "the" probability. So yes, it presupposes probabilism and rejects non-probabilist views.

  For (b), the "arbitrary precision" objection is thorny. From a strict imprecise prob view, picking any point in your interval is indeed arbitrary because your epistemic state is the whole interval. But tournament defenders might argue: 1) Strictly proper rules force honesty (you can't game them by misreporting), 2) In practice, you might pick the minimax point (e.g., midpoint for Brier) to minimize regret, 3) For decision-making, you often need a single number anyway. 

  But philosophically? The imprecise prob advocate has a point - the tournament is forcing a precisification that isn't epistemically justified. Even the minimax choice depends on the scoring rule, which feels arbitrary. So it's a real flaw if we take imprecise beliefs seriously.

  For (c), if we wanted tournaments to accommodate imprecise probabilities, we'd need radical changes: allowing interval submissions (say [L,U]), then scoring them. But how? Standard proper scoring rules don't apply. We might need new rules like: 

  - Score based on whether outcome is in the interval (but too crude)
  - Use a scoring rule that accepts sets, like integrated Brier over the interval
  - Or report multiple scores reflecting different attitudes (max/min loss)

  Aggregation would also get messy - how do you combine intervals from multiple forecasters? The whole leaderboard simplicity would vanish.

