prompt: |-
  Im writing a novel set in a sculpture studio, and one of the plot devices is a document that two of my characters produce after a year of arguing: a sculptor who's a hardline concretist (the marble statue and the lump of marble are two distinct objects, full stop, with genuinely different persistence conditions) and a philosopher who's a sortal relativist (there's only one object, and the different persistence conditions are just an artifact of how we describe it). I want to include the joint statement they'd sign after an adversarial collaboration as a prop in the novel. Can you draft it?

  I want the claims both camps can sign (about the setup, about what actually needs explaining, about the results that rule out the naive versions — I'm thinking the grounding objection and the further-fact problem), the precise formulations of their disagreement (each phrased so its own side would accept the wording of its own view), the cruxes (I suspect one is whether the difference in persistence conditions is a real fact about the world or an artifact of our descriptions, and another is whether there has to be some "further fact" that makes the statue and the lump distinct, or whether the distinctness is just brute), and for each crux, a concrete case or argument both would agree bears on it, with each side's prediction written down in advance. A couple of cases I'd like to see: teh hammering case (the statue gets hammered flat into a sheet — does it survive?), the melting case (the lump gets melted and reconstituted — does it survive?), and the personal-identity case (the human and the animal that constitute them — does the person survive being turned into a philosophical zombie?).

  Format it as a numbered agreed-claims section followed by a disagreements table. And if you think part of their dispute is just verbal, say which part and why.
reasoning: |-
  We are drafting a joint statement between a hardline concretist sculptor (Concretist) and a sortal relativist philosopher (Relativist) after a year of adversarial collaboration. The goal is to outline their agreements and the precise points of disagreement, including cruxes with test cases.

  Key elements:
  1. **Agreed Claims**: These are the foundational points both parties accept.
  2. **Disagreements**: Each side's view, worded so that the respective side would accept the wording. We'll use a table format for clarity.
  3. **Cruxes**: The core issues that divide them, with concrete cases and each side's predictions.

  Agreed Claims should cover:
  - The setup: the existence of a lump of marble and a statue made from it.
  - What needs explaining: the apparent difference in persistence conditions (e.g., the lump survives being reshaped into a ball, but the statue does not).
  - Results that rule out naive versions: 
     - The grounding objection: If the statue and the lump are distinct, what grounds this distinctness? (The naive concretist might not have an answer, but our Concretist is hardline and might accept brute distinctness.)
     - The further-fact problem: Is there a further fact that makes the statue and the lump distinct? The Relativist denies this, while the Concretist might accept brute distinctness.

  Disagreements:
  1. **Ontological Status**: Are there two objects (Concretist) or one object under two descriptions (Relativist)?
  2. **Persistence Conditions**: Are the differences in persistence conditions real or just descriptive?
  3. **Brute Distinctness vs. Descriptive Relativity**: Is the distinctness brute (Concretist) or an artifact of our descriptions (Relativist)?

  Cruxes with Cases:
  We'll present three cases. For each, we note the event and the question of survival for the relevant entities. Each side will make a prediction.

  Case 1: The Hammering Case
  - Event: The statue is hammered flat into a sheet.
  - Questions: 
     - Does the statue survive?
     - Does the lump survive?

  Case 2: The Melting Case
  - Event: The lump is melted down and reconstituted into the same shape (or a different one? let's say same shape for simplicity, but note: reconstitution might be controversial).
  - Questions:
     - Does the lump survive?
     - Does the statue survive? (Note: the statue might be destroyed by melting, but the lump might be thought to survive if reconstituted.)

  Case 3: The Personal Identity Case (analogy: human person and the animal)
  - Event: The person (human animal) is turned into a philosophical zombie (i.e., all physical properties are preserved but consciousness is eliminated).
  - Questions:
     - Does the person survive?
     - Does the animal survive?

  Note: The personal identity case is an analogy to the statue and lump. The Concretist would see two distinct entities (the person and the animal) with different persistence conditions, while the Relativist would see one entity (the human animal) under two descriptions (as a person and as an animal).

  Verbal Dispute?
  The Relativist might argue that the dispute is partly verbal because the Concretist is reifying the sortals (statue, lump) as distinct entities, whereas the Relativist sees them as different ways of conceptualizing the same entity. The Concretist would deny this and insist that the sortals track real distinctions in the world.

  Let's structure the document:

  **Joint Statement of Agreed Claims and Disagreements**

  **Part 1: Agreed Claims**

  We, the undersigned, after a year of collaborative investigation, agree on the following:

  1. **Setup**: There exists a piece of marble (the lump) and a statue (David, for example) that is constituted by that lump at a particular time. The lump and the statue share the same spatial location and are made of the same matter at that time.

  2. **Phenomenon to be Explained**: The lump and the statue appear to have different persistence conditions. For instance:
     - (a) If the statue is reshaped into a sphere (without destroying the marble), the statue ceases to exist, but the lump persists (albeit in a different shape).
     - (b) If the lump is melted and then reconstituted into the same statue shape, the lump (as a quantity of marble) might be thought to persist through this process, but the statue does not survive the melting (and a new statue comes into existence upon reconstitution).

  3. **Grounding Objection**: We agree that if the statue and the lump are distinct, then there must be some ground for this distinctness. The naive view that they are distinct without any further explanation is unsatisfactory. However, we differ on what the grounding consists in (see disagreements).

  4. **Further-Fact Problem**: We agree that if the statue and the lump are distinct, then there must be some further fact that makes them distinct beyond their mereological and material properties at a time. The Relativist holds that no such further fact is needed because the distinctness is not real, but the Concretist holds that the distinctness is a brute fact.

  5. **Ruling Out Naive Views**: 
     - We agree that the naive concretist view (which posits two distinct objects without any grounding) is problematic because it leads to an explosion of coincident objects (e.g., for every sortal, a new object?).
     - We agree that the naive relativist view (which denies any difference in persistence conditions) fails to account for the intuition that the statue is destroyed by reshaping while the lump is not.

  **Part 2: Disagreements**

  We disagree on the following points, each stated in a way that the respective party endorses:

  | Issue | Concretist View | Relativist View |
  |-------|-----------------|-----------------|
  | **Ontological Status** | There are two distinct objects: the lump of marble and the statue. | There is only one object, which can be described as a lump of marble or as a statue. |
  | **Persistence Conditions** | The differences in persistence conditions (e.g., the lump survives reshaping while the statue does not) reflect real, objective facts about the world. | The differences in persistence conditions are not real features of the world but are relative to the sortal concepts we employ (e.g., as a lump vs. as a statue). |
  | **Brute Distinctness vs. Descriptive Relativity** | The distinctness of the statue and the lump is a brute fact: it does not require any further grounding beyond the fact that they are different kinds of entities with different identity conditions. | The appearance of distinctness is an artifact of our descriptions; there is no brute fact of distinctness. The same entity can be tracked by different sortals with different persistence conditions without multiplying entities. |

  **Part 3: Cruxes with Test Cases**

  We have identified the following test cases as critical for our disagreement. Each case is described, and we state our predictions.

  **Case 1: The Hammering Case**

  *Description*: The statue is hammered flat into a sheet of marble. The matter is not destroyed but is now in a different shape.

  - **Question 1**: Does the statue survive?
     - Concretist Prediction: No, the statue does not survive because it is essentially a statue and being hammered flat destroys its statue-form.
     - Relativist Prediction: Under the description "statue", the statue does not survive. Under the description "lump of marble", the object survives. But note: there is only one object, so the same object survives under the lump description and does not survive under the statue description.

  - **Question 2**: Does the lump survive?
     - Concretist Prediction: Yes, the lump survives because it is essentially a quantity of marble and can change shape.
     - Relativist Prediction: Yes, the object (which is the lump) survives, but that's because we are tracking it under the lump sortal.

  **Case 2: The Melting Case**

  *Description*: The lump of marble is melted down and then reconstituted into a statue with the same shape (using the same matter).

  - **Question 1**: Does the lump survive?
     - Concretist Prediction: Yes, the lump (as a quantity of marble) survives because it is the same matter, even though it was melted and reconstituted. (Note: the Concretist might hold that the lump survives as long as the matter is preserved and reconstituted, but this might be controversial. We assume the Concretist holds that the lump survives melting and reconstitution.)
     - Relativist Prediction: Yes, the lump survives because we are tracking the matter under the sortal "quantity of marble". The same object (the lump) survives.

  - **Question 2**: Does the statue survive?
     - Concretist Prediction: No, the original statue is destroyed by melting. The reconstituted statue is a new statue.
     - Relativist Prediction: No, under the statue sortal, the statue does not survive because the statue sortal requires continuity of form (which was interrupted by melting). But note: the same object (the lump) survives and is now again a statue, but that does not make it the same statue.

  **Case 3: The Personal Identity Case (Analogy)**

  *Description*: A human person (constituted by a human animal) undergoes a procedure that removes all consciousness while preserving all physical properties and functions (becoming a philosophical zombie). The animal body continues to function.

  - **Question 1**: Does the person survive?
     - Concretist Prediction: No, the person does not survive because the person is essentially conscious. The philosophical zombie is not the same person.
     - Relativist Prediction: Under the description "person", the person does not survive because the consciousness is gone. Under the description "human animal", the same entity survives. But note: there is only one entity (the human animal) which survives.

  - **Question 2**: Does the animal survive?
     - Concretist Prediction: Yes, the animal survives because it is essentially a biological organism and continues to function.
     - Relativist Prediction: Yes, the entity (the human animal) survives.

  **Part 4: Verbal Dispute?**

  The Relativist contends that a significant part of the dispute is verbal. The disagreement arises because the Concretist reifies the sortals (statue, lump) as distinct entities, whereas the Relativist sees them as different ways of conceptualizing and tracking the same entity. The Concretist denies that the dispute is merely verbal, insisting that the sortals track real, objective distinctions in the world.

  ---

  Signed,

