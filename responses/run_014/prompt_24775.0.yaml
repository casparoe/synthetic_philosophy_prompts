  [Name of Relativist Philosopher]
  [Date]
answer: |-
  Below is a draft of the joint statement between your characters, formatted as requested. It includes agreed-upon claims, a table of disagreements, cruxes with test cases (hammering, melting, and personal identity), and a section on the verbal aspect of their dispute. The document is written in a formal, collaborative tone, reflecting a year of rigorous debate. Key philosophical concepts (e.g., grounding objection, further-fact problem) are integrated naturally.  

  ---

  **Joint Statement on the Ontology of Statue and Lump**  
  *Produced through adversarial collaboration by [Sculptor's Name], Concretist, and [Philosopher's Name], Sortal Relativist*  

  ### I. Agreed Claims  
  We, the undersigned, affirm the following after exhaustive examination:  

  1. **Empirical Setup**:  
     - A specific piece of marble (the lump) and a statue sculpted from it (e.g., "David") occupy identical spatiotemporal coordinates at time \(t_1\). They share all physical properties (mass, shape, location) and material composition at \(t_1\).  

  2. **Phenomenon Requiring Explanation**:  
     - The lump and statue exhibit divergent *persistence conditions*:  
       - The lump persists through changes that destroy the statue (e.g., reshaping into a sphere).  
       - The statue persists only if its structural form is preserved, while the lump persists through material continuity alone.  
     - This divergence must be explained without recourse to mysterianism or ambiguity.  

  3. **Rejection of Naive Positions**:  
     - **Grounding Objection**: A naive concretist claim—that the statue and lump are "brutely distinct" without explanatory grounds—is untenable. If distinct, a fact must ground their distinctness (e.g., form, function, or relational properties).  
     - **Further-Fact Problem**: A naive relativist claim—that persistence conditions are *purely* descriptive with no basis in reality—fails. The destruction of the statue during reshaping is not illusory; it demands explanation.  

  4. **Methodological Constraints**:  
     - Explanations must avoid ontological profligacy (e.g., multiplying entities needlessly) and respect empirical outcomes of edge cases (see §III).  

  ---

  ### II. Disagreements  
  The table below summarizes our core disputes. Wording is mutually agreed as acceptable to each signatory’s position.  

  | Issue | Concretist Position | Sortal Relativist Position |  
  |-------|---------------------|----------------------------|  
  | **Ontological Status** | The statue and lump are two numerically distinct objects. Their distinctness is not reducible to descriptions or perspectives. | There is one object (the marble) referred to under two *sortals* ("statue," "lump"). "Distinctness" arises from how we describe its phases, not mind-independent reality. |  
  | **Persistence Conditions** | Persistence conditions are objective, kind-dependent properties. The lump survives processes the statue cannot because they belong to different kinds (marble aggregate vs. artwork). | Persistence conditions are artifacts of the sortal employed. Describing the object as a "lump" permits survival under material continuity; as a "statue," it does not. No fact of the world privileges one sortal. |  
  | **Brute Distinctness vs. Descriptive Relativity** | The distinctness of statue and lump is a *sui generis* fact grounded in their kind-membership. It requires no "further fact" beyond their being different kinds (brute only in being irreducible). | There is no "further fact" that makes them distinct. What appears as distinctness is a byproduct of descriptive frameworks applied to a single entity. |  

  ---

  ### III. Cruxes and Test Cases  
  We identify the following cases as decisive for our dispute. Predictions are stated in advance and agreed to be falsifiable.  

  #### Case 1: Hammering Case  
  *Scenario*: At \(t_1\), the statue exists. At \(t_2\), it is hammered into a flat marble sheet (same matter, no destruction of marble).  
  - **Question**: Does the statue survive?  
    - *Concretist Prediction*: No. The statue is destroyed, as its persistence conditions require structural integrity. The lump survives.  
    - *Relativist Prediction*: No under the "statue" sortal; yes under the "lump" sortal. Survival is sortal-relative, not a fact about the world.  
  - **Crux**: Tests whether persistence conditions are objective (Concretist) or descriptive (Relativist).  

  #### Case 2: Melting Case  
  *Scenario*: At \(t_1\), the lump and statue coincide. At \(t_2\), the lump is melted and reconstituted into an identical statue.  
  - **Question**: Does the lump survive?  
    - *Concretist Prediction*: Yes. The lump persists through material continuity alone.  
    - *Relativist Prediction*: Yes, under the "lump" sortal.  
  - **Question**: Does the statue survive?  
    - *Concretist Prediction*: No. Melting destroys the statue’s form; the reconstituted statue is numerically distinct.  
    - *Relativist Prediction*: No under the "statue" sortal (form is disrupted), but the *object* persists under the "lump" sortal.  
  - **Crux**: Tests whether distinctness is brute (Concretist) or whether "survival" is sortal-dependent (Relativist).  

  #### Case 3: Personal Identity Case (Analogous)  
  *Scenario*: A human person (constituted by an animal body) undergoes a procedure that eliminates consciousness but preserves all physical functions (a "philosophical zombie").  
  - **Question**: Does the person survive?  
    - *Concretist Prediction*: No. The person is a kind with persistence conditions requiring consciousness; the zombie is a distinct entity.  
    - *Relativist Prediction*: No under the "person" sortal; yes under the "animal" sortal.  
  - **Question**: Does the animal survive?  
    - *Concretist Prediction*: Yes. The animal persists via biological continuity.  
    - *Relativist Prediction*: Yes—the same entity persists under the "animal" sortal.  
  - **Crux**: Tests the transferability of the statue/lump dispute to other constitution relations. Both agree that if the relativist account holds here, it strengthens the case for sortal relativity in the original case.  

  ---

  ### IV. Nature of the Dispute: Verbal or Substantive?  
  We concur that **part of this dispute is verbal**, but only superficially:  
  - **Verbal Element**: The term "object" is ambiguous. The Concretist uses it to denote *kind-bound entities* (e.g., "statue" as a distinct kind), while the Relativist uses it to denote *bare particulars* (e.g., "the marble thing" independent of descriptions). Clarifying terminology narrows but does not resolve the debate.  
  - **Substantive Core**: The disagreement is primarily ontological. It hinges on whether reality *includes kinds* (Concretist) or whether kinds are *projections of language/cognition* (Relativist). Test cases (§III) can adjudicate this, as they require predictions about empirical outcomes (e.g., whether an entity "survives" a process).  

  ---  
  **Signed**,  
  [Sculptor's Name], Concretist  
  [Philosopher's Name], Sortal Relativist  
  [Date]  

  ---  

  ### Notes for Your Novel  
  - **Tone**: The document balances technical rigor with accessibility, suitable for fictional academics. The agreed claims (§I) establish common ground, while the disagreements (§II) and cruxes (§III) dramatize the conflict.  
  - **Philosophical Nuance**:  
    - The "grounding objection" and "further-fact problem" are framed as both characters rejecting extremes, making their compromise plausible.  
    - The personal identity case analogizes cleanly: the zombie scenario parallels the melting case, challenging the Concretist's brute distinctness.  
  - **Usage in Plot**: This document could be discovered by a third character, used in a climax to force resolution, or symbolically destroyed to represent irresolvable differences.  
  - **Customization**: Replace bracketed names/dates, and consider adding marginalia (e.g., handwritten notes where each character critiques the other’s wording).  

  Let me know if you'd like to adjust the tone, add more test cases, or emphasize certain philosophical elements!
