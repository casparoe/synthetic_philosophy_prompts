answer: |-
  **Exam Question**

  Consider a hypothetical device shared by Alice and Bob. Alice inputs a bit \(x \in \{0,1\}\) and receives an output bit \(a \in \{0,1\}\). Bob inputs a bit \(y \in \{0,1\}\) and receives an output bit \(b \in \{0,1\}\). The device is defined by the following behavior:  
  - When \((x,y) = (0,0)\), \((0,1)\), or \((1,0)\), the outcomes \((a,b)\) are equally likely to be \((0,0)\) or \((1,1)\).  
  - When \((x,y) = (1,1)\), the outcomes \((a,b)\) are equally likely to be \((0,1)\) or \((1,0)\).  

  Equivalently, the outputs satisfy \(a \oplus b = x \cdot y\) (where \(\oplus\) denotes addition modulo 2 and \(\cdot\) denotes multiplication), and for each input pair, the marginal distribution of each output is uniform (i.e., each output is 0 or 1 with probability \(1/2\)).  

  Answer the following:  

  (i) Does this device satisfy the no-signalling condition? Compute the CHSH quantity \(S = E(0,0) + E(0,1) + E(1,0) - E(1,1)\), where \(E(x,y)\) is the correlation coefficient defined as \(E(x,y) = \sum_{a,b} (-1)^{a+b} P(a,b|x,y)\). [6 marks]  

  (ii) State precisely what the answer to part (i) shows about the role of the no-signalling condition in Bell’s theorem. In particular, does the no-signalling condition alone imply the Bell inequalities? Justify your answer. [7 marks]  

  (iii) In the derivation of Bell inequalities, two independence conditions are often distinguished:  
  - **Parameter independence** (or locality): The setting of one party does not influence the outcome distribution of the other party.  
  - **Outcome independence**: Given the complete state of the system (including any hidden variables), the outcome of one party is independent of the outcome of the other party.  
  Using these definitions, which of these two conditions does the device violate? Explain why both conditions are required to derive a Bell inequality. [7 marks]  

  (iv) The Tsirelson bound in quantum mechanics states that the maximum value of the CHSH quantity \(S\) is \(2\sqrt{2} \approx 2.828\). What value of \(S\) does the device achieve? What lesson does this device carry for quantum mechanics? [5 marks]  

  ---

  **Model Answer**  

  (i) The device satisfies the no-signalling condition. No-signalling requires that Alice’s marginal distribution \(P(a|x,y)\) does not depend on \(y\), and Bob’s marginal distribution \(P(b|x,y)\) does not depend on \(x\). For any \((x,y)\):  
  - \(P(a=0|x,y) = 1/2\), \(P(a=1|x,y) = 1/2\) (e.g., for \((x,y)=(1,1)\), outcomes \((0,1)\) and \((1,0)\) both give \(a=0\) or \(a=1\) with equal probability).  
  - Similarly, \(P(b=0|x,y) = 1/2\), \(P(b=1|x,y) = 1/2\) (e.g., for \((x,y)=(1,1)\), \(b=0\) for \((1,0)\) and \(b=1\) for \((0,1)\), each with prob. \(1/2\)).  
  Since marginals are uniform and independent of the other party’s input, no-signalling holds.  

  The correlation coefficient \(E(x,y) = P(a=b|x,y) - P(a \neq b|x,y)\):  
  - For \((x,y) = (0,0)\): \(a = b\) always (outcomes \((0,0)\) or \((1,1)\)), so \(E(0,0) = 1\).  
  - Similarly, \(E(0,1) = 1\) and \(E(1,0) = 1\).  
  - For \((x,y) = (1,1)\): \(a \neq b\) always (outcomes \((0,1)\) or \((1,0)\)), so \(E(1,1) = -1\).  
  Thus, \(S = E(0,0) + E(0,1) + E(1,0) - E(1,1) = 1 + 1 + 1 - (-1) = 4\).  

  (ii) The device satisfies no-signalling but achieves \(S = 4\), violating the Bell inequality (which requires \(|S| \leq 2\) classically). This shows that no-signalling alone does not imply the Bell inequalities. Bell’s theorem assumes local hidden variables (LHV), which entail both parameter independence and outcome independence. No-signalling is equivalent to parameter independence, but this device violates the Bell inequality without violating no-signalling, demonstrating that parameter independence (no-signalling) is insufficient to derive Bell inequalities. Outcome independence must also hold for LHV models.  

  (iii) The device satisfies **parameter independence** (as shown in (i), since marginals are independent of distant settings). However, it violates **outcome independence**: For fixed \((x,y)\), the outcomes are perfectly correlated (\(a = b\) when \(x \cdot y = 0\)) or perfectly anti-correlated (\(a \neq b\) when \(x \cdot y = 1\)). Thus, given the settings and any hidden variable, \(a\) determines \(b\) (and vice versa), violating independence.  

  Both conditions are required to derive a Bell inequality:  
  - Parameter independence ensures \(P(a|x,y,\lambda) = P(a|x,\lambda)\) and \(P(b|x,y,\lambda) = P(b|y,\lambda)\) (settings don’t influence distant outcomes).  
  - Outcome independence ensures \(P(a,b|x,y,\lambda) = P(a|x,\lambda)P(b|y,\lambda)\) (outcomes are independent given \(\lambda\)).  
  Together, they yield the LHV factorization \(P(a,b|x,y) = \sum_{\lambda} p(\lambda) P(a|x,\lambda) P(b|y,\lambda)\), needed for Bell inequalities. Without outcome independence, the factorization fails, and Bell inequalities may be violated even with no-signalling.  

  (iv) The device achieves \(S = 4\). Quantum mechanics respects the Tsirelson bound (\(S \leq 2\sqrt{2} \approx 2.828\)), so it cannot achieve \(S = 4\). The lesson is that quantum mechanics, while nonlocal (violating Bell inequalities), does not achieve the maximum nonlocality allowed by no-signalling. This suggests quantum mechanics obeys additional constraints (e.g., information causality or relativistic causality) beyond no-signalling, preventing maximal violations like this device (a PR box).  

