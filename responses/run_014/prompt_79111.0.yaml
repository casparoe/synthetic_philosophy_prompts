  **Marking Scheme**  
  Total marks: 25 (allocated per sub-question). Must-hit points for each part:  

  1. **Part (i) [6 marks]**  
     - States no-signalling holds (1 mark).  
     - Justifies via uniform marginals independent of distant input (2 marks).  
     - Correct \(E(x,y)\) for all four setting pairs (2 marks: 0.5 per correct \(E\)).  
     - Correct \(S = 4\) (1 mark).  
     *Typical miss: Incorrectly claims signalling due to correlations; miscalculates \(E(1,1)\) as \(+1\) or S as \(<4\).*  

  2. **Part (ii) [7 marks]**  
     - Notes device satisfies no-signalling but violates Bell inequality (\(S = 4 > 2\)) (2 marks).  
     - Concludes no-signalling alone does not imply Bell inequalities (2 marks).  
     - Identifies Bell’s locality requires both parameter and outcome independence (not just no-signalling) (2 marks).  
     - Explicitly refutes misconception that no-signalling = locality in Bell’s theorem (1 mark).  
     *Typical miss: Asserts no-signalling implies Bell inequalities, or fails to link violation to insufficiency of no-signalling.*  

  3. **Part (iii) [7 marks]**  
     - Correctly states device satisfies parameter independence (1 mark).  
     - Correctly states device violates outcome independence (2 marks).  
     - Explains violation (perfect (anti)correlation prevents outcome independence) (1 mark).  
     - Explains why both conditions are needed: Outcome independence enables LHV factorization; without it, Bell derivation fails (3 marks: 1 for each condition’s role, 1 for factorization).  
     *Typical miss: Confuses parameter/outcome independence; omits why both are necessary for factorization.*  

  4. **Part (iv) [5 marks]**  
     - Correct \(S = 4\) (1 mark).  
     - Notes Tsirelson bound is \(2\sqrt{2}\) (1 mark).  
     - States quantum mechanics cannot achieve \(S = 4\) (1 mark).  
     - Identifies lesson: Quantum nonlocality is bounded by principles beyond no-signalling (e.g., Tsirelson bound) (2 marks).  
     *Typical miss: Claims quantum mechanics could achieve \(S = 4\); omits implication of additional constraints.*  

  **Grading Standard**  
  - **A (21–25 marks)**: Hits all must-hit points. Specifically:  
    - In (ii), explicitly distinguishes no-signalling from full Bell locality and uses the device to refute misconceptions.  
    - In (iii), correctly assigns the violation to outcome independence and explains the necessity of both independences for Bell derivation.  
    - Computations and justifications are precise and complete.  
  - **B (16–20 marks)**: Misses ≥1 subtle point. Typically:  
    - In (ii), notes the device violates Bell but does not clarify why no-signalling is insufficient, or calls no-signalling "locality".  
    - In (iii), identifies outcome independence violation but does not explain why both conditions are needed for Bell inequalities.  
    - Minor errors in computations or justifications.  

  **Extra Credit (if included, +1 mark)**: Notes the device is a PR box, or mentions that outcome independence violation aligns with quantum nonlocality (quantum violates outcome independence but respects parameter independence).
