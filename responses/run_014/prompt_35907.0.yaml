answer: |-
  ### The Inductive Instincts Quiz  
  *Discover your hidden philosophy of induction by reacting to concrete cases. Answer based on your immediate intuition—no prior knowledge of Goodman required.*  

  ---

  #### Questions  
  1. **Zirconite Gems**  
     All zirconite gems observed before January 1, 2050, were blue. We define "grue" as: *examined before 2050 and blue, OR examined after 2050 and green*. You examine a zirconite on January 2, 2050. What do you expect?  
     - A) I expect it to be blue.  
     - B) I expect it to be green.  
     - C) I have no expectation—it could be either.  

  2. **The 100-Heads Coin**  
     A coin landed heads 100 times in a row. I offer a bet: if the next flip is heads, you win $1,000; if tails, you lose $10. Do you take it?  
     - A) Yes—I bet heads.  
     - B) No—I wouldn’t bet heads.  
     - C) I wouldn’t take either side of this bet.  

  3. **Lottery-Dependable Machine**  
     A machine worked perfectly every day for 5 years. We call it "lottery-dependable" *only* if it worked flawlessly before a specific national lottery draw (unrelated to the machine). The lottery hasn’t occurred yet. Should we trust it for a critical task the day *after* the lottery draw?  
     - A) Yes—its past record supports trusting it.  
     - B) No—its past record doesn’t support trust after the lottery.  
     - C) The evidence doesn’t tell us either way.  

  4. **The First Synthetic**  
     Chemists create "Compound X." The first five samples dissolved in water. A sixth sample is tested. What do you expect?  
     - A) I expect it to dissolve.  
     - B) I don’t expect it to dissolve.  
     - C) I have no expectation—it might or might not.  

  5. **Starstone’s Secret**  
     Until 1920, every "starstone" ever found was green. Then, geologists discovered "starstones" were two minerals (jadeite: green; lunarite: blue) with identical appearance. Before 1920, people expected new starstones to be green. What do you think?  
     - A) They made a mistake—they should’ve questioned the method.  
     - B) They weren’t mistaken—they were just unlucky.  
     - C) Their evidence never justified expecting green.  

  6. **Vega’s Annual Burst**  
     Star Vega X emitted a light burst every June 21 for 50 years. June 21 is tomorrow. What do you expect?  
     - A) I expect a burst.  
     - B) I don’t expect a burst.  
     - C) The evidence doesn’t tell me what to expect.  

  7. **The Farmer’s Gamble**  
     A new corn hybrid yielded 300+ bushels/acre for three years. The farmer considers expanding. Should they?  
     - A) Yes—expand based on past yields.  
     - B) No—don’t expand; it’s too risky.  
     - C) The evidence doesn’t support either choice.  

  8. **The 400-Year Ceremony**  
     A village performed a ritual every 50 years for 400 years. No disasters occurred. They believe the ritual prevents disaster. The next ritual is due. Do you agree?  
     - A) Yes—the past supports this belief.  
     - B) No—the past doesn’t support this belief.  
     - C) The evidence doesn’t show either way.  

  ---

  ### Scoring Key  
  *Tally your answers, then match your pattern to the leaves below. Each leaf is a stance on induction, with its "awkward commitment" (a consequence many find uncomfortable).*  

  1. **Humean Skeptic**  
     - **Pattern**: Mostly Cs (especially in Q1, Q3, Q4, Q6). Avoids all bets (Q2C, Q7C).  
     - **In plain terms**: Observing patterns never rationally justifies expecting them to continue.  
     - **Awkward commitment**: You must treat the sunrise and a coin flip as equally unpredictable.  
     - **Fits if**: You chose C for at least 5 questions, including Q1 and Q6.  

  2. **Popperian Falsificationist**  
     - **Pattern**: Takes bold bets (Q2A, Q7A) but *denies* that evidence supports expectations (Q1C, Q4C, Q6C). Retroactively forgives mistakes (Q5B).  
     - **In plain terms**: Science only falsifies—no observation ever "confirms" a theory.  
     - **Awkward commitment**: You can never rationally trust a theory, even after 10,000 successful tests.  
     - **Fits if**: You chose A for Q2 and Q7, C for Q1/Q4/Q6, and B for Q5.  

  3. **Goodmanian Conventionalist**  
     - **Pattern**: Projects only "entrenched" predicates (Q1A, Q4A, Q6A) but rejects arbitrary ones (Q3B, Q8B). Retroactively sympathetic (Q5B).  
     - **In plain terms**: We expect uniformity only for categories our language community has long used.  
     - **Awkward commitment**: If everyone started saying "grue," expecting green after 2050 would be rational.  
     - **Fits if**: You chose A for Q1/Q4/Q6, B for Q3/Q8, and B for Q5.  

  4. **Natural-Necessity Theorist**  
     - **Pattern**: Projects predicates linked to underlying reality (Q1A, Q3A, Q4A, Q6A) but rejects "spooky" connections (Q8B). Blames bad luck, not method (Q5B).  
     - **In plain terms**: Induction works when categories track real causal structures in nature.  
     - **Awkward commitment**: You must believe reality has fixed "joints" we can discover—even for new things (Q4).  
     - **Fits if**: You chose A for Q1/Q3/Q4/Q6, B for Q8, and B for Q5.  

  5. **Reichenbachian Pragmatist**  
     - **Pattern**: Projects everywhere (Q1A, Q3A, Q4A, Q6A, Q8A). Takes bets (Q2A, Q7A). Retroactively sympathetic (Q5B).  
     - **In plain terms**: Induction isn’t "true," but it’s the best bet—if anything works, this will.  
     - **Awkward commitment**: You endorse uniform expectations even for lottery-machines (Q3) or ceremonies (Q8).  
     - **Fits if**: You chose A for all questions except possibly Q5B.  

  6. **Subjective Bayesian**  
     - **Pattern**: Inconsistent projection (e.g., Q1A but Q3B, or Q4A but Q6C). Bets variably (Q2A or C).  
     - **In plain terms**: Any starting beliefs are equally rational if you update "correctly."  
     - **Awkward commitment**: Two people can hold opposite expectations about the same evidence, yet both be rational.  
     - **Fits if**: Your answers don’t fit other leaves, especially if you mixed projections (A/B) with underdetermination (C).  

  ---

  ### Notes on Indistinguishable Pairs  
  - **Goodmanian vs. Natural-Necessity**: The quiz *cannot* reliably separate these. Both reject Q3’s lottery-machine (Q3B) but project for Compound X (Q4A). The key difference (entrenchment vs. natural joints) isn’t probed here.  
  - **Subjective Bayesian vs. Others**: Bayesians can mimic any pattern (e.g., Q1A like a Goodmanian, or Q2C like a skeptic). No question forces a distinct signature.  
  - **Question 3’s Role**: Designed to split **Reichenbachians** (Q3A) from **Goodmanians/Natural-Necessity** (Q3B). Without it, Reichenbachians and Natural-Necessity would be indistinguishable in Q1/Q4/Q6.  
  - **Question 8’s Role**: Splits **Reichenbachians** (Q8A) from **Natural-Necessity** (Q8B). Both project in "scientific" cases (Q4/Q6), but Natural-Necessity rejects ceremonies.  

  ### If You Fit No Leaf  
  If you **project in wagers (Q2A, Q7A) but underdetermine in grue (Q1C) or lottery-machine (Q3C)**, you’re likely a **selective skeptic**: you act on induction in "normal" cases but withhold judgment where artificial predicates (grue) or arbitrary conditions (lottery) make uniformity feel fragile. This mirrors Goodman’s insight without accepting his full conventionalism.  

