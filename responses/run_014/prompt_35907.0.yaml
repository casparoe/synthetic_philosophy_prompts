  - Popperian and Reichenbachian: Both will act in wagers (2A, 7A, 10A) but the Popperian avoids saying they expect (choosing C in expectations) while the Reichenbachian says they expect (A in expectations). So we can distinguish by the expectation questions.

    For example, in the star burst (6):
      Popperian: C
      Reichenbachian: A

    In the grue (1):
      Popperian: C
      Reichenbachian: A

  Residual pattern: Some readers might project in the wager cases (2A, 7A) but not in the grue case (1A) or not in the arbitrary machine (3A). This is common and doesn't fit one leaf. We'll say they are selectively skeptical, perhaps influenced by Goodman without knowing it.

  Scoring key:

  We'll assign leaves based on the following rules:

  - Humean skeptic: 
     - Expectation questions (1,3,4,6,9): mostly C
     - Wager questions (2,7,10): C (or B if they are risk-averse but not skeptic? But let's require C for skeptic)
     - Retroactive (5): C
     - Ceremony (8): C

    But they might not be pure. We can count the number of C's in 1,3,4,6,9 and if >=4 and also C in 2, and C in 5, then Humean.

  - Popperian:
     - Expectation questions: mostly C (>=3 out of 5: 1,3,4,6,9)
     - Wager questions: A in at least 2 out of 3 (2,7,10)
     - Retroactive (5): B

  - Reichenbachian pragmatist:
     - Expectation questions: mostly A (>=4 out of 5)
     - Wager questions: mostly A (>=2 out of 3)
     - Retroactive (5): B
     - Ceremony (8): A

  - Natural-necessity view:
     - Grue (1): A
     - Machine after lottery (3): A (because lottery is irrelevant)
     - Compound (4): A
     - Star burst (6): A
     - Crimson sparrow (9): A
     - Ceremony (8): B or C (because no natural law) - so not A
     - Retroactive (5): B

    So they have A in 1,3,4,6,9 and not A in 8, and B in 5.

  - Goodmanian conventionalist: Same as natural-necessity view? We said indistinguishable.

  - Subjective Bayesian: We cannot assign a fixed pattern.

  For the residual pattern: readers who answer like a Reichenbachian in wagers but like a Humean in the grue case (1C) and/or the arbitrary machine (3C). We'll say they have a mixed view, perhaps influenced by Goodman's riddle in some cases but not others.

  Finally, the quiz should have instructions and then the questions, then the scoring key.

