  We are creating an interactive quiz that sorts readers by their inductive practices without using technical jargon. The quiz must be answerable by someone who has read Hume but not Goodman. We'll have 8-10 questions, each presenting a concrete scenario with 2-3 options. The options are first-person reactions (e.g., "I'd expect this", "I wouldn't take either side of that bet"). 

  Required cases:
  1. The grue case with a concrete future cutoff (defined in the question).
  2. A wager case that separates readers who act on extrapolations from those who don't.
  3. A predicate defined by an arbitrary external event (e.g., a machine "dependable" only if it worked every day before an unrelated lottery draw).
  4. A case with no linguistic history (e.g., a synthetic compound or an artifact with no manual).
  5. A retroactive case (e.g., jade being two minerals).

  We also need:
  - At least one question with the underdetermination option (evidence doesn't settle the answer).
  - Scoring key mapping answer patterns to leaves (Humean skeptic, Popperian, subjective Bayesian, Goodmanian conventionalist, natural-necessity view, Reichenbachian pragmatist). For each leaf, a plain name and one sentence on its most awkward commitment.
  - Note on indistinguishable leaf pairs and guidance for residual patterns.

  Let's design the questions:

  Question 1: Grue case
    Scenario: Imagine a newly discovered gem called "zirconite". All zirconites examined before the year 2050 are blue. Now, define a new term: a zirconite is "grue" if it was examined before 2050 and is blue, or if it was examined after 2050 and is green. We have only examined zirconites before 2050, and they were all blue (so they were also grue). We are now in 2051, and you see a zirconite for the first time since 2050. What do you expect?
    Options:
      A) I expect it to be blue (because all zirconites so far have been blue).
      B) I expect it to be green (because all zirconites so far have been grue, and after 2050 grue means green).
      C) I don't have an expectation either way; the evidence doesn't tell me what color it will be.

  Question 2: Wager case
    Scenario: A coin has been flipped 100 times and came up heads every time. I offer you a bet: if the next flip is heads, you win $100; if tails, you lose $10. Do you take the bet?
    Options:
      A) I take the bet (because I expect heads again).
      B) I don't take the bet (because I don't expect heads, or I think it's too risky).
      C) I wouldn't take either side of that bet (the evidence doesn't tell me what the next flip will be).

  Question 3: Arbitrary external event (dependable machine)
    Scenario: A machine has been turned on every day for the past year and has never broken down. However, we define the machine as "dependable" only if it worked every day before the day a particular national lottery (which is drawn randomly and has no connection to the machine) had its first jackpot win. The lottery has not had a jackpot win yet. We are now considering whether to use the machine for a critical task tomorrow. Do you think the machine's past performance supports the idea that it will work tomorrow?
    Options:
      A) Yes, the machine has always worked so far, so I expect it to work tomorrow.
      B) No, because the definition of "dependable" ties it to an arbitrary lottery event, so the past performance doesn't count as evidence for tomorrow.
      C) I don't know; the evidence is ambiguous.

  Question 4: No linguistic history (synthetic compound)
    Scenario: Chemists have synthesized a new compound, "Compound X", for the first time. They have produced five samples, and each sample dissolved when placed in water. They are about to test a sixth sample. Do you expect it to dissolve in water?
    Options:
      A) Yes, because all the previous samples did.
      B) No, because we don't have enough history to trust that.
      C) I don't have an expectation; it could go either way.

  Question 5: Retroactive case (like jade)
    Scenario: For centuries, all "starstones" found on Earth were green and had similar properties. Then, in 2020, scientists discovered that "starstones" are actually two distinct minerals: one that is only found on Earth and is always green, and another that is only found on the moon and is always blue. Before 2020, people believed all starstones were green. When a new starstone was found, they expected it to be green. Now, knowing what we know, what do you think of those people?
    Options:
      A) They made a mistake in their method: they shouldn't have expected the next one to be green without knowing the underlying mineral composition.
      B) They didn't make a mistake in method; they were just unlucky that there were two minerals.
      C) The evidence they had didn't justify any expectation about the next starstone.

  Question 6: Underdetermination case (to catch the skeptic)
    Scenario: A new star, Vega X, has been observed for the past 10 years. Every year on June 21st, it emits a burst of light. This has happened 10 times in a row. We are now approaching June 21st again. Do you expect it to emit a burst this year?
    Options:
      A) Yes, because it always has.
      B) No, because there might be a reason it stops this year.
      C) The evidence doesn't tell me whether it will or not; it could continue or stop arbitrarily.

  Question 7: Another wager-like case to separate acting vs not acting
    Scenario: A farmer has planted a new variety of corn. In the first three years, the yield has been high (over 200 bushels per acre) each year. The farmer is considering expanding the planting for the fourth year. Do you think the farmer should expand?
    Options:
      A) Yes, because the high yield has happened every year so far.
      B) No, because three years is not enough to be sure.
      C) There's no basis to decide from the evidence.

  Question 8: A case with a novel predicate but no external event
    Scenario: In a remote village, a tradition says that every 50th year, a special ceremony must be performed to avoid calamity. The ceremony has been performed every 50 years for the past 400 years, and no calamity has occurred. The next ceremony is due next year. The villagers expect that if they perform the ceremony, calamity will be avoided. Do you agree?
    Options:
      A) Yes, because the past shows that the ceremony works.
      B) No, because the calamity might not be real, or the ceremony might not be the cause.
      C) The evidence doesn't show that the ceremony prevents calamity; it could be coincidence.

  Now, we have 8 questions. We can add two more to cover more ground.

  Question 9: A case with a biological example
    Scenario: A biologist observes that every known bird of a newly discovered species, the "crimson sparrow", has a distinctive red crest. The biologist has seen 50 crimson sparrows, all with the red crest. The biologist expects the next crimson sparrow she finds to have a red crest. Do you agree?
