prompt: |-
  Twelve to fifteen times a month our hospital's ethics consultation service is asked to settle a treatment question for a patient who cannot settle it themselves, left no directive, and has no one close enough to them to speak reliably for their values: an estranged adult child who knows only that his father "hated hospitals," a group-home staff member reporting secondhand remarks from twenty years ago, a spouse who insists the patient "would never have wanted this" but cannot say what the patient actually said or when. I direct that service. Our current default is a best-interests analysis, which the committee has grown uneasy with, partly because it slides so easily into what the clinicians find reasonable and partly because in a fair number of these cases there is enough real evidence about the patient to do better than a generic welfare calculus. The committee has asked me to draft a substituted-judgment-first procedure that reconstructs what this patient would choose under better epistemic conditions rather than what they happen to have said once, offhand, in worse ones.

  I've been reading around coherent extrapolated volition and the idealized-preference literature, and the part I think transfers is the idealization machinery: the move from a raw, actual preference to what the agent would prefer if better informed, more reflective, less distorted by the circumstances in which the preference formed, and more internally consistent. That is exactly the move our consults need, and exactly the move that can go badly wrong. So I want a procedure, runnable in about ninety minutes by a two-person team — one clinician, one social worker, neither with any philosophy training — that produces a documented recommendation for a specific pending decision, to be countersigned by the attending and by risk management before it reaches the chart in plain language.

  Please specify, in numbered steps a team could execute in order: what evidence about the patient counts and in what priority order, and what to do when two sources give inconsistent pictures; which idealizing corrections are licensed and which are forbidden, drawing the line between correcting a patient's factual ignorance (a prognosis they never understood, a treatment they imagined wrongly) and overriding their values, including the cases that make everyone uncomfortable such as a preference formed during an untreated depressive episode, under heavy sedation, or under sustained family pressure; how the team should handle a patient's own internally inconsistent reports, and whether it should pool all informants' testimony first and then idealize the pooled picture, or idealize each account separately and look for convergence — take a position on that ordering question and say what turns on it; and a hard stop rule identifying the point at which the reconstruction has drifted so far from the actual person that the resulting preference can no longer be attributed to them, at which the procedure must say so and hand the case back to best-interests reasoning with a written explanation. Mark every step that is really licensing a judgment rather than resolving one, and say whose judgment it is.

  Then run the procedure on three cases: a 74-year-old now facing dialysis whose only recorded statement on the matter is a remark at a family dinner a decade ago that he would rather die than be hooked up to a machine; a 29-year-old with a first psychotic break whose pre-illness self documented a refusal of intubation, and whose clinicians believe the documented refusal reflects a fear she no longer holds and would not endorse now; and a patient whose written, witnessed, still-current refusal of a low-burden intervention would, if idealized, dissolve. The third is the one I expect the procedure to answer in a direction our lawyers will not like, and I would rather find that out from you than from them — but if you think the procedure should refuse to reach that conclusion, say why and build that refusal in explicitly.

  Format: open with a two-sentence bottom line stating when the procedure should be used and when it should not; then the steps; then the cases in a fixed template (evidence relied on, idealizations applied, resulting preference, confidence, who signs off); then a short closing section on what the procedure cannot do and where it will systematically misfire. Assume no one reading it has read any of the underlying literature, and give me no references or further reading. Keep the whole thing under 1,400 words; if you cannot fit all three cases within that, drop one and say which and why.
reasoning: |-
  Hmm, this is a complex and ethically charged request from a hospital ethics consultation service director. They're grappling with how to make substituted judgment decisions for incapacitated patients without clear directives or reliable surrogates. The director wants a practical 90-minute procedure that two staff members without philosophy training can execute, focusing on idealizing patient preferences rather than defaulting to best-interests analysis.

  I need to create a step-by-step process that addresses several critical elements: evidence hierarchy, handling inconsistencies, permitted idealizations, and stopping rules. The director specifically wants me to tackle three test cases that probe the boundaries of the approach, including one that might contradict a written refusal - which clearly makes the legal department nervous.

  For the evidence hierarchy, I'll prioritize contemporaneous written statements but emphasize contextual interpretation. The trickiest part will be defining the boundary between correcting factual misunderstandings (which is allowed) versus overriding core values (which is forbidden). The depression/sedation/coercion cases require particularly careful handling - perhaps permitting limited correction only when clear evidence shows the preference was situationally distorted.

  The procedure must flag when idealization strays too far from the actual person. I'll include a "hard stop" rule requiring reversion to best-interests analysis when the reconstruction loses connection to documented preferences. For the test cases, I'll focus on the dialysis refusal (where the offhand remark needs contextualization), the psychotic patient's advance directive (where illness distortion may apply), and the problematic written refusal case (where I'll have to confront the legal tension directly).

  Throughout, I'll mark which steps involve judgment calls rather than mechanical application, specifying who makes those judgments. The document needs to be self-contained under 1,400 words, so I'll prioritize depth over breadth if needed, perhaps trimming one case example. The tone must remain clinically practical while grappling with profound philosophical questions about autonomy and identity.
answer: |-
  ## Substitute Judgment Procedure: Idealized Preference Reconstruction

  **Bottom line:** Use this procedure when sufficient evidence exists to reconstruct *this specific patient's* likely choice, but not when evidence is absent or contradictory beyond reconciliation. Do not use when a valid advance directive exists or when a legally authorized representative can provide reliable testimony.

  ---

  ### Procedure Steps (90-minute team execution)

  1.  **Define the Pending Decision:** Clinician states the precise medical decision required (e.g., "Initiate dialysis?", "Intubate for respiratory failure?"). Social worker confirms understanding. *(Judgment: Clinician defines medical scope)*

  2.  **Gather Evidence:**
      *   **Source 1:** Written statements by the patient (advance directives, letters, diaries) dated closest to the decision context.
      *   **Source 2:** Reliable witness testimony about specific, relevant statements made by the patient. Prioritize recent statements to known confidants about similar health matters. Note context (casual vs. serious, health state).
      *   **Source 3:** Broad life values, religious beliefs, cultural background, or significant life choices (e.g., career risks, hobbies, attitudes towards authority/medicine) documented or reliably reported.
      *   **Source 4:** Secondhand or historical statements (e.g., "he hated hospitals"). Treat as low weight unless corroborated or linked to specific values.
      *   **Stop Rule 1:** If *only* Source 4 evidence exists, document "Insufficient evidence for substituted judgment" and revert to best interests.

  3.  **Assess & Pool Evidence (Initial Pass):** Team reviews *all* gathered evidence together. Social worker leads, noting apparent conflicts, consistencies, and gaps. Clinician clarifies medical context of past statements if needed. Create a summary list of stated preferences/values relevant to the pending decision. *(Judgment: Team jointly assesses relevance and reliability of sources)*

  4.  **Identify Inconsistencies & Potential Distortions:** Team flags:
      *   Internal inconsistencies within a single source (e.g., different statements in a diary).
      *   Conflicts between sources.
      *   Statements made under potential distorting influences: acute illness (e.g., untreated depression, psychosis, severe pain), heavy sedation, intoxication, acute grief, or documented coercion/sustained undue pressure. *Note the suspected distortion.*

  5.  **Apply Licensed Idealizations (Per Statement/Source):** Team applies corrections *individually* to specific pieces of evidence where justified. **FORBID** altering core values (e.g., religious conviction, deep-seated independence). **PERMIT** only:
      *   **Correcting Factual Ignorance/Misconception:** If evidence shows patient misunderstood prognosis, treatment burden, or outcome (e.g., thought dialysis meant permanent coma; didn't know recovery was likely after short-term vent). Correct *only* to the accurate facts known *now*.
      *   **Mitigating Clear Situational Distortion (Cautiously):** *Only* if strong evidence links the statement *exclusively* to a distorting context *and* there's evidence of their baseline views. Examples:
          *   A refusal stated *only* during an *untreated* major depressive episode, with evidence of different views when stable.
          *   A statement made under heavy sedation *not* reflecting known prior wishes.
          *   A choice documented under sustained, documented coercion/family pressure conflicting with other reliable evidence of the patient's values.
      *(Judgment: Team jointly decides if idealization is justified and applies the specific correction. Requires consensus.)*

  6.  **Reconcile Idealized Evidence:** Review the individually idealized statements/values. Look for convergence towards a consistent preference regarding the *pending decision* or the core values that would govern it. Resolve minor conflicts by weighting Source 1 & 2 evidence higher. *(Judgment: Team assesses convergence/consistency post-idealization)*

  7.  **Formulate the Reconstructed Preference:** Based on the converged, idealized evidence, state: "The patient, if capacitated, informed of the current prognosis/burden/benefits, reflective, and free from transient distortions, would choose [Option A] / [Option B] for the pending decision." Include the key evidence and idealizations applied. *(Judgment: Team jointly formulates the reconstructed choice)*

  8.  **Assess Attribution (Hard Stop Rule 2):** Team asks: "Is this reconstructed preference recognizably rooted in the *actual documented values and character* of *this specific patient*, or has idealization created a fundamentally different person?" If the connection is lost (e.g., relies entirely on low-weight evidence, requires overriding core documented values, or the idealization dominates the original data), document: "Reconstructed preference cannot be reliably attributed to this patient. Revert to best interests." Explain why. *(Judgment: Team consensus on attribution)*

  9.  **Document Recommendation & Confidence:**
      *   State the reconstructed preference OR "Revert to best interests."
      *   Assign Confidence Level: High (clear convergence, strong evidence), Moderate (some inference needed, good evidence), Low (significant inference, weaker evidence), OR "Not Attributable".
      *   Plain language summary of key evidence, idealizations, and reasoning.

  10. **Review & Sign-off:** Attending physician reviews medical accuracy. Risk Management reviews procedure adherence and documentation clarity. Both countersign before entry into the chart. The clinician/social worker team signs the recommendation.

  ---

  ### Case Applications

  **Case 1: 74yo facing dialysis (Remark: "rather die than be hooked up to a machine" - family dinner, 10yrs ago)**
  *   **Evidence:** Source 4 (single historical, casual remark). No other documented values on life-sustaining tech. General independence noted.
  *   **Idealizations Applied:** None justified (no evidence of factual error/distortion specific to the remark; general value of independence isn't specific enough).
  *   **Resulting Preference:** **INSUFFICIENT EVIDENCE** (Stop Rule 1 triggered). Revert to best interests.
  *   **Confidence:** N/A (Revert)
  *   **Sign-off:** Team, Attending, Risk Mgmt.

  **Case 2: 29yo with first psychotic break, pre-illness documented refusal of intubation.**
  *   **Evidence:** Source 1 (Written refusal - high weight). Clinician report of *belief* about fear (low weight unless documented patient *explanation* exists). Evidence of psychosis *onset* timing vs. document date is crucial.
  *   **Idealizations Applied:** **None.** Rationale: Belief that fear "would not hold now" is speculative value-override (forbidden). Psychosis *onset* must be *after* the directive was made for distortion claim; otherwise, it represents her pre-illness view. No evidence directive was made *during* distortion. If directive was written pre-psychosis, it stands. If written *during* active, documented psychosis, *and* no prior views exist, *might* cautiously mitigate distortion (Low Confidence).
  *   **Resulting Preference:** **Honor the documented refusal** (unless proven written *during* untreated psychosis with no baseline). Reconstructed preference aligns with documented choice.
  *   **Confidence:** **High** (if directive pre-psychosis), **Low** (if during psychosis, no baseline).
  *   **Sign-off:** Team, Attending, Risk Mgmt. (Note: Clinicians' beliefs about current fear are irrelevant to reconstruction.)

  **Case 3: Patient with written, witnessed, current refusal of low-burden intervention.**
  *   **Evidence:** Source 1 (Current written refusal - highest weight). What evidence suggests it would "dissolve" if idealized? (e.g., documented misunderstanding of burden? Made under acute distress? Conflicts with overwhelming life-affirming values?).
  *   **Idealizations Applied:** **Strict Scrutiny.** Only licensed if:
      *   **Factual:** Clear evidence refusal was based on specific, correctable factual error (e.g., thought "low-burden" meant "high-burden" like amputation, documented in chart). Correct *only* the fact.
      *   **Distortion:** *Strong* evidence refusal *only* occurred during a discrete, severe, *untreated* psychological episode *and* clear evidence of their stable, contrary view (e.g., refusal written during panic attack, but prior statements accepting similar care).
  *   **Resulting Preference:**
      *   If idealization licensed (e.g., corrects specific factual error): Reconstructed preference *might* differ (e.g., accept intervention). **Extremely Low Confidence** inherently due to overriding a current written directive. High risk of attribution failure.
      *   If no clear factual error/distortion evidence: **Honor the written refusal.** Reconstructed preference *is* the documented choice.
  *   **Confidence:** **High** (if refusal honored). **Very Low** (if overridden - due to inherent conflict with strongest evidence).
  *   **Hard Stop Rule 2:** Overriding a current written directive *very likely* fails attribution ("created a different person"). Procedure should **refuse** dissolution unless evidence of distortion/factual error is *overwhelmingly clear and specific*. Default is to honor the directive. **Recommendation:** Build in explicit refusal: "A current, written directive can only be overridden via this procedure if evidence of *specific factual error* or *acute, untreated situational distortion* at the *exact time of signing* is irrefutable and directly causative. Absent this, the written directive *is* the reconstructed preference."
  *   **Sign-off:** Team, Attending, Risk Mgmt. (Risk Mgmt likely flags override cases).

  *(Dropped Case 1 detailed run as it was clearest revert case; focused on 2 & 3 which probe critical boundaries of idealization vs. directive and distortion.)*

  ---

  ### Limitations & Systematic Risks

  *   **Not Mind Reading:** Cannot create preferences from nothing. Requires solid evidentiary foundation.
  *   **Value Override Risk:** The line between correcting facts and overriding values is porous and judgment-laden. Teams may unconsciously "correct" towards medical reasonableness or their own values ("comfort bias"). Strict adherence to licensed idealizations is vital.
  *   **Attribution Challenge:** Determining when the idealized self becomes someone else is inherently subjective. The "Hard Stop" rule is crucial but imperfect.
  *   **Low-Confidence Outputs:** Many reconstructions will have Moderate or Low confidence, highlighting their fragility. This must be transparently documented.
  *   **Bias:** Team biases (professional, cultural, personal) can influence gathering, weighting, and idealizing evidence. Structured procedure mitigates but doesn't eliminate this.
  *   **Time Pressure:** 90 minutes forces focus but risks superficiality with complex cases or voluminous evidence. Sticking to the hierarchy and stopping rules is key.
  *   **Legal Tension:** Reconstructed judgment (especially overriding a directive) may conflict with legal standards for valid directives. Risk Management review is essential. The procedure prioritizes ethical reconstruction over legal defensibility in close calls, creating inherent tension.
