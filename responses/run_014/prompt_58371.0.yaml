  We are presented with a line of reasoning that leads to the conclusion that existence claims for named objects are necessary a posteriori, which is problematic because it seems to eliminate contingency in existence. The reasoning is as follows:

  (1) Elda and Rava are rigid designators.
  (2) If Elda is Rava, then in every world in which that body exists, Elda and Rava designate it, so "Elda is Rava" holds in every such world and thus is necessary.
  (3) Therefore, "Elda is Rava" is necessary a posteriori.
  (4) By the same test, "Elda exists" holds in every world in which that body exists because in any such world Elda designates that body (and thus designates something).
  (5) Therefore, "Elda exists" is necessary a posteriori.
  (6) Generalizing, every true existence claim for a named object is necessary a posteriori, meaning no such object could have failed to exist.

  The problem is that (6) seems to eliminate contingency: we typically think that many objects (like this planet, or ourselves) might not have existed. So we must reject one of the steps.

  Let's analyze the steps:

  - (1) is a given: we are taking the names as rigid designators.
  - (2) and (3) are the standard Kripkean account of necessary a posteriori identities: since both names rigidly designate the same object, the identity statement is necessarily true (if true at all). This is widely accepted.
  - (4) and (5) extend the reasoning to existence claims.

  The problematic step is (4). It claims that because in every world where the body exists, Elda designates it (due to rigidity), then "Elda exists" is true in that world. And since the body exists in every world where it exists (trivially), we are led to say that "Elda exists" is true in every world in which the body exists. But note: what about worlds in which the body does not exist? In those worlds, the rigid designator Elda fails to designate anything (because the object it designates in the actual world does not exist in that world). Therefore, "Elda exists" is false in those worlds.

  So the necessity of "Elda exists" would require that it is true in every possible world. But step (4) only establishes that it is true in every world in which the body exists. That leaves open the possibility of worlds in which the body does not exist, and in those worlds "Elda exists" is false. Therefore, "Elda exists" is not necessary.

  However, step (4) is being interpreted as saying that "Elda exists" holds in every world in which the body exists, and that is true. But that does not make "Elda exists" necessary because there are worlds where the body does not exist and Elda fails to designate. So the mistake is in the inference from (4) to (5). The claim that "Elda exists" holds in every world in which the body exists does not imply that it holds in all possible worlds. Hence, it is not necessary.

  But note the phrasing of (5): "So Elda exists is likewise necessary". This is a non sequitur. The argument for necessity would require truth in all possible worlds, but we have only established truth in the worlds where the body exists. Therefore, we must reject the inference from (4) to (5).

  What does this cost? It requires that we do not treat existence claims as necessary. Instead, we recognize that the truth of "Elda exists" is contingent: it is true in worlds where the object exists and false in worlds where the object does not exist.

  But why did step (4) seem compelling? It says: "Elda exists holds in every world in which that body exists, since in any such world Elda designates something". This is true because in any world where the body exists, Elda (being rigid) designates that body. So in such a world, Elda designates something and hence "Elda exists" is true. But that does not imply that the body exists in every world. Therefore, we must distinguish between:

  - The set of worlds where the body exists: in these, Elda designates the body and so "Elda exists" is true.
  - The set of all possible worlds: in some of these the body does not exist, and in those worlds Elda does not designate anything (so "Elda exists" is false).

  Hence, "Elda exists" is contingent.

  We can retain (1)-(3) without accepting (4)-(6) by blocking the inference that because a rigid designator designates the same object in every world where that object exists, then the object must exist in every world. That is, we must reject the idea that the object's existence is necessary.

  But what about the argument in (4)? It says that in every world where the body exists, Elda designates it, so "Elda exists" holds. That is correct, but that does not make the existence necessary. It only makes the existence of the body a condition for the truth of "Elda exists". So we accept (4) as a true statement about the truth conditions of "Elda exists", but we reject the move to (5) because (5) claims necessity, which requires truth in all worlds, not just the ones where the body exists.

  Therefore, the defender of (1)-(3) must accept that existence claims are contingent. This is the standard Kripkean view: while identity statements involving rigid designators are necessary if true, existence statements are contingent. For example, Kripke holds that 'Hesperus is Phosphorus' is necessary, but 'Hesperus exists' is contingent.

  What about the cost? There is no real cost because this is the standard view. The mistake was in the inference from the behavior of rigid designators in worlds where the object exists to the necessity of existence. We can consistently hold that:

  - Rigid designators pick out the same object in every world where that object exists, and nothing (or fail to refer) in worlds where it does not.
  - Therefore, an identity statement between two rigid designators, if true, is necessarily true (because in every world where the object exists, both names refer to it, and in worlds where it doesn't exist, the identity statement is either false or truth-valueless, but in Kripke's semantics we might consider that the identity is still true because the non-existence of the object doesn't make the identity false? Actually, Kripke does not require the object to exist for the identity to hold? Let me clarify.)

  Kripke's view on identity statements: if Hesperus and Phosphorus are the same object in the actual world, then in every possible world, if Hesperus exists and Phosphorus exists, they are identical. But what if one or both don't exist? Kripke seems to hold that the identity is necessary: it is true in every possible world that Hesperus is Phosphorus. However, in worlds where neither exists, we might say the statement is vacuously true? Or we might use a free logic. The standard approach is to say that the identity holds in every world, even if the object doesn't exist in that world. For example, in a world without Venus, it is still true that Hesperus is Phosphorus (because there is no world in which Hesperus is one thing and Phosphorus is another). 

  But note: if we accept that the identity holds in every world (even those without the object), then why not also accept that the existence is necessary? Because the identity statement does not require the object to exist in every world? Actually, the identity is about the objects: if in the actual world they are the same, then in every world they are the same (if they exist in that world) and even if they don't exist, they are the same non-existent object? This is a bit tricky.

  However, Kripke does not hold that existence is necessary. He explicitly says that existence is contingent. So what about the identity statement in a world without the object? We can say that the identity is true in every world, but that does not imply that the object exists in every world. The truth of the identity does not require existence? Actually, in standard modal logic with identity, the formula "a = b" is true at a world w only if both a and b exist at w (in a semantics with an existence predicate). But Kripke seems to allow that the identity holds even in worlds where the object doesn't exist? Or perhaps he doesn't. This is a point of debate.

  To avoid this, we can use a free logic: in worlds where the object does not exist, the singular terms 'Elda' and 'Rava' do not refer, and so the identity statement might be false or without truth value. But Kripke wants the identity to be necessarily true. So he might say that the identity is true even in worlds where the object doesn't exist? How? By considering that the identity is about the object, and if the object doesn't exist in a world, then the identity still holds in the sense that there is no possible world where they are distinct. But in the formal semantics, we might evaluate the identity as true in every world regardless of existence? This is not entirely standard.

  Alternatively, we can say that the identity is true at a world w only if the object exists at w. But then the identity would not be necessary: it would be true only in the worlds where the object exists. This would contradict Kripke's claim.

  To resolve this, Kripke uses the idea that the object exists in some worlds and not in others, but the identity holds in every world in which the object exists. And in worlds where the object does not exist, we don't say that the identity is false; we might say that the identity is true because the same object (which doesn't exist in that world) is being designated by both names? Or we can say that the identity holds in every world, period, because the object (though non-existent in some worlds) is the same object. This is a metaphysical issue.

  But note: the original argument (2) only claims that the identity holds in every world in which the object exists. That is sufficient for necessity? Not exactly: necessity requires truth in all worlds. So if we want the identity to be necessary, we must also account for the worlds where the object doesn't exist. Kripke's solution is that the identity is true in all worlds, even those where the object doesn't exist. How? Because the identity is a statement about the objects themselves, and the object is the same object in every world (if we consider transworld identity) even if it doesn't exist in that world. But this is controversial.

  However, the main point for our purposes is that existence is not necessary. So we must block the inference to the necessity of existence. The argument for existence being necessary in (4) and (5) is fallacious because it only shows that "Elda exists" is true in the worlds where the object exists, but not in all worlds.

  Therefore, we reject the step from (4) to (5). The price is that we must accept that existence is contingent. This is the standard view and does not undermine the necessary a posteriori status of identity statements.

  So to summarize:

  - We retain (1)-(3): rigidity and necessary a posteriori identities.
  - We accept (4) as a true statement about the truth conditions of "Elda exists" in the worlds where the body exists, but we do not infer (5) because the necessity of "Elda exists" would require truth in all worlds, which we do not have.
