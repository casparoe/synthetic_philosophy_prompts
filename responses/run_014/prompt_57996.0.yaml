prompt: |-
  ok so im trying to get clear on what i should even demand from an account of supererogation before i wade into all the back and forth, and i keep getting stuck

  can you write me the desiderata list, like what any adequate theory has to deliver if its going to be actually usable by normal people, say the organizers of a mutual aid network who need to decide what to require from members vs what to praise and reward but not require

  i care about a few weird cases so the list cant just be textbook stuff, it has to handle these:

  a lifeguard, Maya, who stays two extra hours in a storm after her shift ends because her replacement never shows, at some real risk to herself, versus just doing her job well. i want to call that supererogatory but not required, even if staying was clearly the better thing to do.

  a guy, Luis, who promised to drive his friend to the airport but blows off the promise to stop at a crash scene and help, which is better overall but breaks a duty. is that still going beyond duty or does breaking the smaller duty disqualify it.

  and the normalization worry, where if enough people in the group start donating like 20% of income or doing weekly night shifts, it starts to feel required, and then the theory seems to eat itself. i need a desideratum about that shift from heroic to expected.

  so for each requirement on your list, give me the case or reason behind it, and say which ones you think are non-negotiable vs which are just preferences of one camp, like Kantians vs consequentialists vs virtue people. and flag if you suspect some subset cant all be true together, that part matters most to me. also tell me which single requirement you think knocks out the most otherwise plausible views.

  dont give me a literature review or anything, just the criteria and why they matter, bullet list is fine. im gonna do the scoring myself later.

  oh and at the end, say what would change your mind about the list, like which argument or counterexample would make you drop or demote one of your non-negotiables, or where you think your reasoning is most likely to fail. teh whole point is i want to know how fragile the spec is.
