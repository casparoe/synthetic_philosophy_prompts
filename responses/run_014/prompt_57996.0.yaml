  Okay, let me unpack this user's request carefully. They're building a framework for supererogation theory that must serve real-world mutual aid organizers, and they've thrown three thorny cases at me: Maya the lifeguard, Luis the promise-breaker, and the normalization problem. 

  First, I need to identify their core frustration - they're stuck in theoretical debates but want practical criteria. The examples suggest they care about moral psychology (how obligations shift socially) and agent-relative duties (promises vs. consequences). Their demand for "non-negotiable" markers hints they've encountered too many context-dependent academic solutions.

  Hmm, the normalization worry is especially tricky. When I consider mutual aid groups, what starts as extraordinary can become baseline through peer pressure. This needs a desideratum about social malleability - maybe "anti-codification"? But I must balance with their Luis case where breaking smaller duties for greater good challenges traditional supererogation definitions.

  For Maya's case: any theory must distinguish obligatory job duties from voluntary risk-taking, even when the latter is objectively better. That kills pure consequentialism. For Luis: we need to preserve both the wrongness of promise-breaking and the praiseworthiness of emergency aid - so Kantian rigor can't dominate either.

  *scribbles mental notes* 
  - Non-negotiable: Must explain why Maya isn't negligent for leaving at shift end 
  - Contested: Whether Luis' act loses "supererogatory" status due to broken promise 
  - Fragility point: If normalization proves unavoidable, does supererogation collapse?

  The user's "which requirement knocks out most theories" challenge is sharp. I think "preservation of baseline duties" eliminates act-utilitarianism and extreme virtue ethics. And for fragility - if someone shows all duties expand contextually, the whole supererogation structure crumbles. That's why I'll emphasize the "no obligation inflation" desideratum.

  *checks unspoken needs* 
  They're likely designing community guidelines and fear creating guilt dynamics. The "usability" demand suggests they want to: 
  1) Prevent burnout by protecting personal boundaries 
  2) Reward extraordinary contributions without coercion 
  3) Navigate conflicts like Luis' dilemma systematically 

  Final list must flag where criteria conflict - e.g., praising Luis might undermine promise-keeping norms. I'll explicitly call that tension in the desiderata. And for self-doubt: I'm least confident about whether "blamelessness" (Maya leaving being permissible) is truly non-negotiable. If someone argues all inaction during preventable harm is blameworthy, that destabilizes everything.
answer: |-
  Here’s a distilled desiderata list for a usable supererogation theory, grounded in your cases and normalization concern. I’ve flagged tensions, non-negotiables, and fragility points.

  ---

  ### **Core Desiderata for an Adequate Supererogation Theory**  
  *(Non-negotiables in bold)*  

  1. **✅ Non-Required Sacrifice**  
     - **What it demands**: Actions that are morally *better* than duty requires must **not be obligatory**, even when reasonable people agree they’re optimal.  
     - **Case**: Maya’s extra storm shift is praiseworthy but not required. Leaving after her shift must be *permissible*, not blameworthy.  
     - **Why non-negotiable**: Collapses supererogation if "best action" always becomes duty.  
     - **Knocks out**: Maximizing consequentialism (if "ought implies can" is weak).  

  2. **✅ Blameless Omission**  
     - **What it demands**: Failing to perform a supererogatory act **must not warrant blame or punishment**.  
     - **Case**: Maya isn’t negligent for leaving at shift end, despite the storm.  
     - **Why non-negotiable**: Supererogation loses meaning if omission is condemnable.  
     - **Knocks out**: "Soft" Kantianism (where imperfect duties blur into obligation).  

  3. **✅ Duty-Permission Symmetry**  
     - **What it demands**: If an act is supererogatory, **omitting it must be morally permitted** (not merely excused).  
     - **Case**: Luis skipping the airport run to help at the crash isn’t just "excused" promise-breaking – it’s *permissible* because the alternative was better.  
     - **Why non-negotiable**: Avoids "tragic dilemmas" where all choices are wrong.  
     - **Knocks out**: Rossian deontology (prima facie duties that can’t be overridden sans guilt).  

  4. **🟡 Praiseworthiness Without Obligation**  
     - **What it demands**: Supererogatory acts deserve praise/reward, **even when they conflict with lesser duties**.  
     - **Case**: Luis should be praised for crash aid *despite* breaking his promise.  
     - **Tension**: Some virtue ethicists demand "moral spotlessness"; others allow trade-offs.  
     - **Fragile if**: Praise requires "no duty violation" (Luis’s case fails).  

  5. **✅ Anti-Normalization (No Obligation Creep)**  
     - **What it demands**: Widespread performance of an act **does not automatically convert it to a duty** (absent explicit agreement).  
     - **Case**: If 90% of mutual aid members donate 20% income, it can’t become *required* for newcomers.  
     - **Why non-negotiable**: Prevents theory from self-destructing via social pressure.  
     - **Knocks out**: Rule-utilitarianism with dynamic rules.  

  6. **🟡 Agent-Relative Permissions**  
     - **What it demands**: Agents can sometimes prioritize **personal commitments** over optimal outcomes.  
     - **Case**: Luis *could* permissibly choose the airport run over the crash (if helping strangers isn’t obligatory).  
     - **Contested**: Consequentialists reject this; Kantians/virtue theorists often include it.  

  ---

  ### **Key Tensions & Fragility Points**  
  - **▶️ Duty-Permission vs. Praiseworthiness**: If Luis’s promise-breaking is *permissible*, is it still supererogatory? Or does supererogation require "pure" sacrifice (no conflicting duties)? *This is the sharpest tension in your cases*.  
  - **▶️ Normalization vs. Community Expectations**: Mutual aid networks *need* to set baseline requirements. A theory must clarify when emerging norms become contracts (e.g., "if 100% sign a pledge, it’s binding").  
  - **▶️ Sacrifice Threshold**: How much risk/cost makes an act supererogatory? Maya’s "real risk" is vague. If minimal, everything becomes supererogatory; if too high, few acts qualify.  

  ---

  ### **What Would Change My Mind?**  
  - **Dropping Non-Negotiables**: If shown a real-world context where **omitting supererogation *is* blameworthy** (e.g., a surgeon "off-shift" refusing to operate in a disaster) without collapsing into obligation.  
  - **Demoting Praiseworthiness**: If Luis-type cases reveal that **praise requires duty-adherence**, making supererogation rarer but "purer" (e.g., only saints qualify).  
  - **Fragility Exposure**: A proof that **anti-normalization is impossible** – e.g., if game theory shows communal expectations *inevitably* harden into duties.  

  ---

  ### **Why This List?**  
  - **Most Damaging Requirement**: **Non-Required Sacrifice** (Desideratum 1). It sinks maximizing consequentialism and rigid Kantianism.  
  - **Achilles’ Heel**: **Luis’s case**. If your theory must call his act supererogatory *and* permissible *and* praiseworthy despite the broken promise, it strains most frameworks. Virtue ethics handles this best (if the act is "heroic"), but risks diluting duty.  

  Use this to stress-test theories. If a view fails ≥2 non-negotiables (especially 1, 2, or 5) or can’t resolve Luis’s dilemma, discard it.
