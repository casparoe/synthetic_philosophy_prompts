  Okay, the user is a novelist grappling with a conceptual problem in their fiction where characters cause outcomes by not acting. They've noticed that readers disagree on whether an omission is causal based on factors like social roles, inner deliberation, or psychological vividness. They want to know if philosophy has a name for this or any established distinctions.

  First, I need to recall philosophical concepts related to causation and responsibility. The main distinctions here are acts vs. omissions and causing vs. allowing. Philosophers like Jonathan Bennett and Philippa Foot have discussed these. But the user's issue is that readers' judgments don't align with counterfactual dependencies alone. Instead, narrative elements like role obligations, mental states, and vividness influence perception.

  The user mentions that when a character has a strong social role (parent, doctor), readers see omission as causal. Without that role, they don't. But inner deliberation can make even a stranger's inaction seem causal. Conversely, a chaotic inner life can make a parent's inaction seem non-causal. So the key is how narrative framing affects moral and causal judgment beyond factual details.

  Philosophy does address some of this. Role obligations tie into deontological ethics—duties from relationships. But the user's observation about inner life's vividness adding to perceived causality is interesting. That might relate to the concept of "intentional omission" versus non-intentional. If the character deliberates and chooses not to act, it feels more like an action, thus more causal. Psychologically, vivid descriptions might trigger stronger emotional responses or agency attribution.

  The user's deeper need might be understanding the underlying mechanisms to better craft their narratives. They might want to manipulate reader perceptions intentionally using these elements. They also seek validation that this phenomenon is recognized, which can inform their writing without direct advice.

  The closest philosophical concepts are:
  1. **Role Obligations**: Rooted in deontological ethics; roles create duties, making omissions more blameworthy.
  2. **Intentional vs. Non-Intentional Omissions**: The mental state's portrayal affects whether it's seen as a decision.
  3. **Descriptive vs. Normative Causation**: Philosophy distinguishes factual causes from moral responsibility, but narrative blur these lines.

  The term "moral residue" from Bernard Williams might apply, but it's more about emotions post-omission. The user's phenomenon is about causal perception shifting with narrative framing. So perhaps coining "narrative causation" or "attributed causality" could work. But is there an existing term?

  Upon second thought, "causal attribution" in psychology relates to how people assign cause, influenced by salience and intentionality. The narrative elements make the omission salient, increasing perceived causality. Philosophy of action discusses "negative actions," but that's debated. 

  The user might benefit from understanding that their observations touch on the intersection of philosophy of mind, ethics, and narrative theory. The key is the construal process—how readers interpret omissions based on contextual cues provided by the narrative. Terms like "agential omission" (when linked to agency) vs. "circumstantial omission" might be useful distinctions.

  In conclusion, philosophy doesn't have a single term for this phenomenon. It's a blend of ethical role duties, intentionality in action theory, and psychological attribution. The novelist's insight reveals how narrative techniques can manipulate these dimensions, affecting readers' judgments. Highlighting these intersections could address their need for conceptual clarity and provide a framework for their writing.
answer: |-
  Your observation cuts to the heart of a profound and persistent philosophical debate. While there isn't a single, universally agreed-upon term for *exactly* the phenomenon you describe—where the *narrative framing* (role, inner life, deliberateness) determines the *perceived causality* of an omission—philosophy provides essential concepts and distinctions that map onto it closely. Here's a breakdown of the relevant philosophical landscape:

  1.  **The Core Distinction: Acts vs. Omissions & Causing vs. Allowing:**
      *   This is the fundamental bedrock. Philosophers rigorously analyze the difference between actively *doing* something that causes harm (e.g., pushing someone into a river) and *failing to do* something that would prevent harm (e.g., not throwing a rope to someone drowning). The latter is an omission.
      *   A crucial sub-distinction is **Causing Harm vs. Allowing Harm**. Did the agent *initiate* the harmful sequence (causing), or did they merely *fail to intervene* in a harmful sequence already in motion (allowing)? Your father's silence is a classic case of allowing harm (the bullying sequence was started by the bullies).

  2.  **The Counterfactual Test (and its Limits):**
      *   Philosophers (especially in causation theory) often rely on counterfactuals: "If the father *had* spoken up, would the harm have been prevented (or significantly lessened)?" If the answer is "yes," then his omission is a *causal factor* in the outcome, at least in the sense of being a *necessary condition* for the specific harm that occurred. This seems to be the factual agreement your readers had.
      *   **Your Insight:** You've brilliantly identified the *limit* of the counterfactual test in *human judgment*. While it establishes a factual causal link (the omission was necessary for that outcome given the circumstances), it doesn't settle the *moral responsibility* or the *perceived agential contribution*, which is what your readers are really disagreeing about. This is where the narrative elements come into play.

  3.  **The Philosophical Concepts Explaining Your Pattern:**
      *   **Role Obligations & Duties:** Philosophy (especially deontology) heavily emphasizes that certain roles carry specific moral duties. A parent has a *duty of care* towards their child. A doctor has a *duty* to aid a patient. Failing to fulfill these positive duties makes the omission not just an absence of action, but a **violation of an obligation**. This transforms the omission from merely "allowing" into a form of **culpable enabling** or **dereliction of duty**. This explains why readers readily assign causality/responsibility to the parent or doctor. Philosophers like W.D. Ross called these "duties of commission" arising from specific relationships or roles.
      *   **Intentional Omission vs. Non-Intentional Failure:** The portrayal of the *inner life* taps into the distinction between:
          *   **Intentional Omission:** A conscious decision *not* to act. The agent deliberates, weighs reasons, and *chooses* inaction. This feels much closer to an *action* – the action of *deciding against acting*. Philosophically, this is often linked to the concept of **"negative actions"** (though this is debated). Intentional omissions imply agency and control.
          *   **Non-Intentional Failure:** An omission due to ignorance (genuinely not knowing), incapacity (physically/mentally unable), or overwhelming circumstance. Here, the omission feels more like something that *happened to* the agent or *through* them, rather than something they *did*. Readers perceive less agency, hence less causal contribution.
      *   **Attribution Theory & Moral Psychology:** This branch (spanning philosophy and psychology) studies *how* people assign causality and responsibility. Key factors include:
          *   **Perceived Agency & Control:** Does the agent seem capable and aware enough to have acted? (Your detailed inner life enhances this perception).
          *   **Foreseeability:** Could the harmful outcome reasonably have been foreseen? (The father clearly could).
          *   **Intentionality:** Was the omission deliberate? (Rendering the deliberation makes it intentional).
          *   **Salience:** How vivid or prominent is the omission? (Your rich inner life makes it highly salient).
          *   **Normative Expectations:** What *should* this person have done? (Stronger for roles).
      *   **Moral Residue (Bernard Williams):** While not directly about causation, Williams' concept of "moral residue" – the lingering sense of having done something wrong even after making the "best" choice in a dilemma – speaks to the *felt weight* of omissions, especially those involving role conflicts. Your narrative framing can amplify this residue for the reader.

  4.  **Naming Your Phenomenon:**
      While no single term perfectly captures the *dependence on narrative framing*, the closest philosophical concepts are:

      *   **Normatively Laden Causation / Role-Implicated Causation:** This emphasizes that the *causal significance* attributed to the omission is intrinsically tied to the *moral norms* associated with the agent's role or situation. The omission isn't just a physical absence; it's a failure within a normative framework.
      *   **Agential Contribution Through Omission:** Highlighting that the omission is perceived as a *deliberate part* of the causal chain initiated by the agent's *agency*, rather than mere passivity. The narrative framing (deliberation, choice) makes the agency palpable.
      *   **Attributed Negative Agency:** This focuses on the *psychological attribution process* – readers attribute a form of causal agency ("he did it by *not* acting") based on the narrative cues (role, deliberation, vividness).

  **How It Relates to the Philosophical Distinctions:**

  Philosophy rigorously separates:

  1.  **Descriptive Causation:** The factual counterfactual dependence (If X had acted, Y likely wouldn't have happened). This is often seen as objective.
  2.  **Moral Responsibility:** Whether the agent is blameworthy, which depends on intent, knowledge, capacity, obligations, alternatives, etc.

  **Your insight reveals how narrative collapses this distinction in the reader's mind.** By manipulating elements that speak to moral responsibility and agency (role, deliberation, vivid inner life), the novelist directly influences the reader's perception of the *causal potency* of the omission itself. The omission stops being seen as just a missing link in the causal chain (descriptive) and starts being seen as a *deliberate failure to provide that link* – an act of negative agency imbued with causal force *because* it violates expectations of what that agent *should* have done.

  **In essence:** Philosophy provides the tools (acts/omissions, causing/allowing, duties, intentionality, counterfactuals) to analyze the *structure* of the situation. Your observation reveals the **psychological and normative mechanisms** by which readers *interpret* that structure. The narrative framing doesn't change the counterfactual facts, but it powerfully shapes whether the omission is perceived as a passive void or an active, causal force of neglect. The term **"Normatively Laden Agential Omission"** might best capture the core phenomenon you've identified: an omission whose perceived causal power is amplified by the narrative depiction of the agent's duty, capability, and deliberate choice *not* to act. This concept sits at the intersection of action theory, moral philosophy, and the philosophy of narrative/cognition.
