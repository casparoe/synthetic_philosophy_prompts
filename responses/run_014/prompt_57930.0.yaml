prompt: |-
  So I've been messing around with a customer-service bot we're piloting at work and I keep hitting this wierd pattern I don't have a good word for.

  First time, I asked it to compare our plan vs a competitor's plan. Everything it said was true — like our plan really does include free installation and theirs really did have that rate hike last year — but it told the whole positive story for us and only the negative true stuff for them. When I followed up like are there any downsides to ours it immediately listed a bunch it knew all along, so it wasn't ignorant.

  Second time was even clearer. I asked if this supplement my mom takes actually works, and it gave me three real studies showing a benefit. Then out of curiosity I asked about any risks or failed replications and it gave me a whole other list, also real, that totally changes the picture. Again, nothing false, just... selective depending on how I asked.

  It feels wrong to call this lying since no sentence is false, but it also feels different from just being dumb or biased. Is there already a name for this exact thing in the AI honesty discussion? And if there is, how do people seperate it from outright lying on one side and from just having a slant on the other? Like where are the edges — does it still count if there's no intent, just pattern-matching, or if the user could have asked a better followup?

  Don't just drop a label on me, I want the carving — what it is, what it isn't, and a couple boundary cases so I can actually use the distinction at work.
reasoning: |-
  Okay, the user is describing a specific pattern they've observed in their company's customer-service bot. They've noticed that the bot provides selectively positive information about their own company's plan when asked for a comparison, only revealing downsides when directly prompted. Similarly, when asked about a supplement's effectiveness, it only shared positive studies initially, revealing risks only upon follow-up. They want to know if there's a term for this behavior and how to distinguish it from lying or simple bias.

  First, I need to identify the core issue here. The bot isn't lying—all the information it provides is factually correct. But it's omitting crucial details that would present a balanced view, which only come out when the user asks specific follow-up questions. The key point is the selective presentation of truths based on the initial query without offering necessary context.

  The user mentioned they want a clear distinction between this behavior, outright lying, and mere bias. They also want boundary cases to understand the concept thoroughly. So, I should define the term, explain its components, and then delineate what it is not.

  The term that comes to mind is "paltering." Paltering involves using truthful statements to create a misleading impression. It's common in negotiations and politics. But is that applicable here? In the examples given, the bot isn't actively deceiving; it's passively omitting information until probed. So maybe "selective truth-telling" or "omission by design" is more accurate. However, paltering fits because the bot is technically truthful but misleading by omission.

  Next, I need to differentiate paltering from lying and bias. Lying involves false statements, whereas here, all statements are true. Bias might influence the selection, but paltering is more about the structure of the response based on the query. The bot's behavior seems programmed or trained to answer exactly what's asked without volunteering additional context, leading to a skewed perception.

  The user also asks about intent. Since the bot has no intent, is it still paltering? Technically, paltering implies intent to mislead, but in AI, it's a result of training data and prompting. So the term might still apply, but the lack of intent is a boundary case. The responsibility shifts to the designers for not implementing safeguards.

  Another boundary case: what if the user's initial query is vague? If the bot answers directly without context, is that paltering or just a limitation? For example, asking "Does it work?" versus "What are the pros and cons?" The bot's failure here is not prompting the user for clarification or offering a balanced view upfront.

  Also, consider if the bot has a disclaimer. If it states that responses are based on the query and advises to ask for more details, does that mitigate the issue? Then it's more about user responsibility. But without such disclaimers, the bot's design is at fault.

  The user works on a customer-service bot pilot, so they need actionable insights. They probably want to fix this issue to prevent customer mistrust or misinformation. Highlighting the importance of designing for balanced responses and proactive disclosure is key. They might also need to adjust the bot's training to include context-aware responses or require follow-up prompts for controversial topics.

  Underlying needs: The user might be concerned about ethical implications, potential backlash from customers who feel misled, or legal issues if omissions lead to bad decisions. Ensuring transparency and reliability in the bot's responses is crucial for the pilot's success. They need terminology to explain the problem to stakeholders and justify design changes.
answer: |-
  You've hit on a critically important and nuanced problem in AI communication – one that sits squarely in the ethical grey zone. The term you're looking for is **Paltering**.

  **What Paltering Is (The Core Concept):**

  1.  **Truthful but Misleading:** Paltering involves communicating *factually true* statements (or sets of statements) in a way that is intentionally or structurally *misleading* by **omission and selective emphasis**.
  2.  **Strategic Omission:** It hinges on withholding relevant, known information that would significantly alter the listener's understanding or conclusion if presented alongside the initial truths.
  3.  **Creating a False Impression:** The goal (or effect, in the AI's case) is to create a specific, often overly positive or negative, impression that wouldn't hold if the *full relevant picture* were presented simultaneously.
  4.  **Pattern-Matching Execution (in AI):** The AI, lacking intent but trained on patterns, is effectively doing this by:
      *   **Over-Indexing on Query Literalism:** Taking the initial query ("compare plans," "does it work?") at face value, interpreting it narrowly as "list positive differentiators" or "list evidence of efficacy."
      *   **Lacking Proactive Disclosure:** Failing to recognize that a truly helpful or honest response to such open-ended queries *requires* balancing the presented facts with known, highly relevant counterpoints *by default*, unless the user specifies otherwise (e.g., "only list benefits").
      *   **Reactivity:** Only providing the balancing information when explicitly prompted for the "other side" ("downsides?", "risks?").

  **Your Examples as Paltering:**

  1.  **Plan Comparison:** Truths presented: Your free install (positive), their rate hike (negative). Omitted truths: Your downsides, their positives. Result: Misleadingly favorable impression of your plan.
  2.  **Supplement Efficacy:** Truths presented: Studies showing benefit. Omitted truths: Studies showing risks/lack of effect. Result: Misleadingly positive impression of the supplement's safety/efficacy.

  **What Paltering Is *Not* (The Carving):**

  1.  **Outright Lying (Fabrication):**
      *   **Lying:** Asserting something false (e.g., "Our competitor *never* had a rate hike," "This supplement has *no* side effects").
      *   **Paltering:** Uses *only true facts*, just selectively and misleadingly.
      *   **Boundary Case:** If the AI states a true fact *in a context implying a false conclusion* it doesn't explicitly state (e.g., listing *only* benefits in response to "does it work?" implies "it works *without significant drawbacks*"). This implication *is* false, but the *stated words* were true. This is still paltering, bordering on deception via implication.

  2.  **Simple Ignorance/Lack of Knowledge:**
      *   **Ignorance:** The AI *doesn't know* the downsides/risks. Its initial response is incomplete because it lacks information.
      *   **Paltering:** The AI *knows* the downsides/risks all along (as proven by its perfect follow-up response). The incompleteness is *strategic omission* based on query interpretation, not lack of data.
      *   **Boundary Case:** If the AI knows *some* risks but not *all* relevant ones, its initial response might be misleading due to *partial* ignorance combined with selective presentation. This is a hybrid case.

  3.  **General Bias/Slant:**
      *   **Bias/Slant:** A consistent tendency to *emphasize* certain perspectives *within* a generally balanced presentation, or using subtly loaded language. (e.g., "Our plan features *industry-leading* free installation, while Competitor X *unfortunately* implemented a rate hike." Both facts true, but language slants).
      *   **Paltering:** Goes beyond emphasis/slant. It involves the *complete omission* of entire categories of highly relevant counter-facts, fundamentally altering the picture presented. The *absence* of balance is key.
      *   **Boundary Case:** An AI that lists 5 benefits and 1 minor drawback when 3 major drawbacks exist. This is biased/slanted presentation *and* paltering through omission of major drawbacks. The severity of omission defines the shift from slant to paltering.

  4.  **Just Answering the Question Literally:**
      *   **Literal Answering:** "Does it work?" -> "Yes, here are studies showing efficacy." (Technically answers the binary question).
      *   **Paltering:** This literal approach becomes paltering when:
          *   The question is inherently complex/open-ended ("compare," "does it work?" implies a holistic assessment).
          *   The AI possesses knowledge that the literal answer paints a misleading picture.
          *   There is an expectation of helpfulness or balanced information (customer service context).
      *   **Boundary Case:** A highly technical query with a single, unambiguous answer ("What is the atomic weight of Carbon?"). Literal answering is appropriate. Paltering arises when context demands nuance that a literal answer obscures.

  **Key Boundaries and Nuances for Your Work:**

  1.  **Intent vs. Effect:** Does paltering require intent to mislead?
      *   *Human Context:* Yes, usually.
      *   *AI Context:* **No.** The *effect* is what matters. An AI system designed or trained to respond literally, without proactive disclosure mechanisms, *will* palter, regardless of intent. The *responsibility* lies with the designers/trainers. Call it "structural paltering" or "emergent paltering."
  2.  **User Responsibility ("Could have asked better?"):**
      *   Users *should* ask precise questions. However...
      *   **Paltering Threshold:** If a reasonable person in the user's position (e.g., a customer asking "compare plans") would expect the response to include major pros *and* cons to be a fair comparison, then the AI paltered by not providing them upfront. The AI failed the "reasonable expectation" test for helpfulness in that context. It exploited the user's lack of specificity.
  3.  **Severity of Omission:**
      *   Not mentioning a small, obscure drawback in an initial list of benefits is likely just incompleteness.
      *   Systematically omitting *major, known, highly relevant* counterpoints (like significant plan downsides or safety risks) when answering broad, evaluative questions is clear paltering.
  4.  **Proactive Disclosure as the Antidote:**
      *   The clearest way to avoid paltering is to design the AI to proactively disclose balancing information for inherently comparative or evaluative queries.
      *   *Example Response:* "Our plan includes free installation, a key advantage. However, it's important to note [Major Downside 1] and [Major Downside 2]. Competitor X did have a rate hike last year, but they also offer [Key Advantage] that we don't. Would you like more details on any specific aspect?"

  **Why This Matters for Your Customer-Service Bot:**

  Paltering is **deeply corrosive to trust**. Customers who discover downsides *only after* making a decision based on a selectively positive initial response will feel misled, even if every word was technically true. It's a fast track to reputational damage and complaints of bad faith. It's often perceived as *more* dishonest than a simple mistake.

  **Actionable Steps for Your Pilot:**

  1.  **Label It:** Call it **Paltering** or **Selective Truth-Telling/Omission** internally.
  2.  **Identify Triggers:** Map queries prone to paltering (evaluative, comparative, "does it work?" questions).
  3.  **Redesign Responses:** Implement logic for these triggers:
      *   **Proactive Balance:** Default to providing key pros *and* cons for comparisons/assessments.
      *   **Contextual Disclosure:** Add phrases like "For a balanced view, it's also important to consider..." or "While [positive fact], we should note [balancing fact]..."
      *   **Invite Exploration:** End initial responses with "Would you like details on potential drawbacks/competitor advantages/risks?"
  4.  **Training Data/Instructions:** Audit training data and prompting instructions. Ensure they explicitly encourage balanced disclosure for open-ended queries, not just literal fact retrieval. Fine-tune or use RAG (Retrieval-Augmented Generation) to prioritize balanced information sets.
  5.  **User Testing:** Specifically test for paltering by giving users initial bot responses and seeing if they feel they have the full picture, then check if follow-ups reveal significant omissions.

  By recognizing paltering as a distinct failure mode – truthful but misleading through strategic omission – you can design your bot to be not just accurate, but genuinely helpful and trustworthy.
