  The disagreements table needs clear, partisan statements. For example, Camp A might say understanding emerges from rule-following, while Camp B denies that. Disagreements could be substantive (e.g., locus of understanding) or verbal (definitions of "understanding"). Cruxes are those where experimental results could sway one side. The abridged condition is a crux: Camp A predicts judges can't distinguish if the program is intact, while Camp B expects failure with abridged rules. Each side's concession should be included verbatim.

