  Okay, let me break this down. The user is auditing a grad seminar on moral responsibility and has been grappling with Wallace's standing-to-blame framework. They're skeptical because they feel the standard view mislocates the problem of hypocrisy. Specifically, they want an argument that having committed the same fault can actually enhance one's standing to blame - not just restore it after repentance, but create a qualitatively different form of blame they call "reflexive blame."

  The user provides a concrete case: a structural engineer who committed professional misconduct decades ago now sits on an integrity panel judging similar misconduct. They reject both standard options (forfeited standing or equality after repentance) and want an argument showing why this engineer has unique standing. They also pose several challenges: avoiding the "worse record = better standing" implication, explaining why acknowledgment alone isn't sufficient, addressing the unrepentant hypocrite, and considering institutional implications.

  Hmm, the core tension seems to be between compliance-based and experiential models of moral authority. The user's intuition is that lived failure creates a form of epistemic and relational access to the norm that mere compliance lacks. I need to build an argument where first-person experience of failing a norm generates a distinctive form of normative address.

  The key premise I see is that moral demands aren't abstract rules but practical challenges whose difficulty can only be fully grasped through the attempt to meet them. When the engineer tells the younger colleague "I know why you did this," it's not just descriptive - it's an acknowledgment of shared vulnerability that makes the demand feel real in ways a spotless blamer can't replicate.

  For the reductio: the serial wrongdoer fails because they haven't actually engaged with the norm's reasons - their violations demonstrate misunderstanding. Acknowledgment alone would be hollow without the lived experience that gives content to "I know." The unrepentant hypocrite isn't blaming at all - they're performing a social gesture while actively denying the norm's authority.

  Institutionally, this suggests panels should include reformed practitioners not as tokens but as epistemic resources - though safeguards against romanticizing failure are needed. The moralizer of untested virtue fails because they can only parrot the norm without understanding its weight.

  This position is vulnerable to conflating psychological impact with moral authority, but the user wants it argued straight. I'll structure it as: one core premise about norms as practical challenges, defend against reductios, then show how it resolves the engineer case and predicts differences from standard accounts.
answer: |-
  Here's the argument for the authority of reflexive blame, structured as requested:

  **Core Argument: The Authority of Embodied Understanding**

  *   **Single Load-Bearing Premise:** **The authority to effectively blame for violating a demanding norm requires deep, practical understanding of the specific reasons for compliance *and* the experiential cost of overcoming the reasons for violation.** ("The Epistemic-Practical Premise")
  *   **The Argument:**
      1.  Moral blame, especially for failures demanding significant self-overcoming (like integrity under pressure), is an act of normative address. Its goal is not merely to condemn, but to *call the wrongdoer back* to the norm by confronting them with the reality of their failure and the demand they have evaded.
      2.  To effectively do this (i.e., to have genuine standing/authority in this address), the blamer must be able to credibly articulate *why* compliance was demanded, *why* violation was tempting or excusable *in the moment*, and *what* overcoming that temptation or avoiding that failure actually required. This demands more than abstract knowledge; it requires understanding the norm's demands and the violator's reasons "from the inside."
      3.  **The Load-Bearing Premise:** Deep, practical understanding of both the reasons for compliance *and* the experiential cost of overcoming the reasons for violation is only fully accessible to someone who has *themselves* faced the *exact same* normative challenge, failed it, and subsequently grappled with that failure and its costs. A faultless blamer ("clean-handed") understands the norm abstractly and the *fact* of violation, but lacks the first-person phenomenological grasp of the competing reasons *in the specific context* and the lived cost of meeting the norm *despite* those reasons.
      4.  Therefore, the blamer who has committed the same fault and acknowledged it ("reflexive blamer") possesses a unique epistemic and practical position: they understand the demand *and* the failure *as lived realities*. This embodied understanding grants them a distinctive form of authority – the authority to address the wrongdoer not as an external enforcer, but as someone who has stood exactly where they stand and knows the path back.
      5.  Consequently, reflexive blame is not merely permissible alongside clean-handed blame; it constitutes a distinct, potentially more potent form of normative address made possible *precisely because* of the blamer's past failure and acknowledgment. Their standing is *enhanced*, not merely restored, relative to the faultless.

  **Defending the Load-Bearing Premise (Epistemic-Practical Premise):**

  *   **Why it's Exposed:** This premise claims a profound *epistemic limitation* on clean-handed blamers. Critics will argue abstract reasoning, empathy, or witnessing others is sufficient. It also claims a unique *epistemic advantage* for the repentant wrongdoer, which critics might dismiss as merely psychological persuasion, not normative authority.
  *   **Motivation & Patching:**
      *   **Motivation:** Consider norms requiring resisting powerful situational pressures (greed, fear, careerism, fatigue). Knowing "honesty is good" is trivial. Knowing *why* someone under deadline pressure facing career ruin might fudge calculations, and knowing *what specific act of will/character* was required *in that moment* to resist, is non-trivial. This "knowing-why" and "knowing-what-it-takes" is inherently practical and situated. It's knowledge *of* reasons *as motivating forces* and *of* overcoming *as a concrete achievement or failure*. This kind of knowing is best (perhaps only fully) secured through first-person experience. Abstract reasoning provides the rule; lived failure provides the map of the terrain where the rule must be applied.
      *   **Patching:** A defender can strengthen this by emphasizing the *specificity* of the normative challenge. The engineer isn't blaming dishonesty *in general*; she's blaming signing off on *under-checked calculations under professional pressure*. Her identical past failure grants her specific insight into *that* temptation and *that* demand that a generally honest colleague, or even one who failed a *different* norm, lacks. The premise highlights the *practical, context-laden nature* of demanding norms.

  **Addressing the Reductio (Worse Record = Better Standing?):**

  *   **The Discriminating Work:** The argument hinges on *acknowledgment* + *embodied understanding*, not mere wrongdoing. The serial wrongdoer who *acknowledges nothing* demonstrates a fundamental failure to grasp the norm's authority *at all*. They haven't truly engaged with the reasons for compliance or the cost of failure; they've ignored or rejected them. They lack the "grappling" essential to the premise. Their violations don't generate understanding; they demonstrate its absence. Their "standing" is zero because they reject the normative framework within which blame operates.
  *   **Why Wrongdoing Isn't a Useless Add-On:** Acknowledgment *alone* is hollow without the lived experience. Saying "I understand it's hard" while spotless is conjecture. Saying "I understand it's hard *because I failed that exact test myself and felt the pull of those exact reasons*" carries the weight of reality. The wrongdoing provides the raw experiential data; acknowledgment demonstrates the processing of that data into normative insight. The *combination* creates the unique authority. Acknowledgment without the specific failure lacks the concrete, lived content; the failure without acknowledgment lacks the normative reflection.

  **The Unrepentant Hypocrite:**

  *   On this view, the *currently guilty, unrepentant hypocrite* **isn't genuinely blaming at all.** Genuine blame, as normative address, presupposes the blamer endorses the norm and its authority over both the blamed *and themselves*. The hypocrite, by continuing to violate the norm while blaming others, demonstrates they do *not* genuinely endorse its authority. Their "blame" is performative – perhaps an attempt to deflect attention, signal virtue, or exert power. It's not a sincere call back to a shared norm; it's an act of bad faith. Their problem isn't a *lack* of standing within a sincere blaming practice; they are *outside* that practice entirely, engaged in a different, defective social act masquerading as blame. Reflexive blame requires the blamer to have *submitted* to the norm's judgment *on themselves* (via acknowledgment), which the hypocrite refuses to do.

  **Predictions & Institutional Implications:**

  1.  **The Moralizer of Untested Virtue:** The standard account often struggles to explain the intuitive *lack* of authority in the person who has never faced temptation or significant challenge to their virtue. This view predicts it clearly: the untested moralizer lacks the embodied understanding of the reasons *for* violation and the cost of overcoming them. Their blame will ring hollow because they can only parrot the norm abstractly; they cannot speak to the lived reality of the failure or the genuine path to compliance under pressure. They lack the "inside" perspective essential for the deepest form of authoritative address.
  2.  **Institutional Design (The Panel):** Yes, a reformed practitioner *with acknowledged past failure* brings unique, valuable authority to an integrity panel. They can:
      *   **Credibly diagnose:** Identify the specific pressures and rationalizations at play because they've lived them.
      *   **Effectively challenge:** Call out excuses with undeniable authority ("I used that excuse; it doesn't hold").
      *   **Offer genuine guidance:** Speak authentically about what compliance *actually requires* in the crucible, not just in theory.
      *   **Enhance legitimacy:** Their presence signals the process understands the real-world challenges of integrity, making the panel's judgment more credible to the accused and the profession.
      *   **Crucial Safeguard:** This *does not* mean staffing panels *only* with the previously disciplined. Clean-handed members provide essential perspectives on consistent adherence and the baseline standard. The reflexive blamer's *enhanced* authority on the *specific nature of the failure and the path back* complements, rather than replaces, the clean-handed perspective on the norm's inviolability. The panel's strength comes from this combination. The criterion is *relevant, acknowledged past failure demonstrating deep practical understanding*, not simply *any* past failure.

  **Conclusion:**

  The authority of blame stems from the blamer's ability to authentically represent the norm's demand *in the specific context of its violation*. For demanding norms, this requires deep, practical, first-person understanding of both the reasons for compliance *and* the reasons for (and cost of overcoming) violation. This "embodied understanding" is uniquely granted by having committed the same fault and acknowledged it. The reflexive blamer gains standing not *despite* their past, but *because* of the specific, hard-won understanding it provides. They can address the wrongdoer from a position of shared, albeit painful, experience, making their blame a more potent form of normative recall. The structural engineer *can* blame the young member in a way his spotless colleagues cannot: she speaks not just the law, but the lived truth of it.
