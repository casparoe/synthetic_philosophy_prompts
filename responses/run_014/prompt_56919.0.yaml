  - "Welfare unmeasurable" - not a contract-design problem
  - Reflexivity concerns - no market structure solution exists

  For the stress tests:
  1) City upzoning case: Landlord/developer dominance creates classic adverse selection. The "who quotes?" problem emerges - liquidity dries up when insiders won't take the other side. Clean translation of manipulation risks but legitimacy question remains untranslatable.

  2) Sanctions case: Market price affecting outcome is pure reflexivity - like a derivatives contract that changes its own underlying probability. No market mechanism solves this; it's structural to the proposal. Untranslatable residue.

  Final assessment: 
  The untranslatable residues point to fundamental flaws. Welfare measurement and reflexivity aren't just "design challenges" - they're existential to the model. Meanwhile, the user's trading perspective reveals that prediction markets would be capital-weighted, not democratic. Also exposes that called-off bets require a settlement agent that doesn't exist in governance.

  User's framework makes visible what political debates miss: Markets aren't neutral forecasters when they're participants. There's no natural "other side" for policy bets. And crucially - prices reflect capital concentration, not collective wisdom.

  Biggest insight: The proposal tries to make governance a derivative contract, but welfare isn't an observable underlying, there's no settlement mechanism, and the market's existence alters the experiment. These aren't fixable with better structuring - they're category errors.
answer: |-
  Here is the term sheet translation of governance-by-prediction-markets, followed by the residue report and stress tests. Contract specs are mapped directly; philosophical claims are decomposed into operational mechanics.

  **TERM SHEET: GOVERNANCE PREDICTION MARKET (GPM)**  
  *Underlying:* ΔW (change in aggregate national welfare) from Policy P vs. baseline.  
  *Deliverable:* Cash-settled, binary or linear payoff on ΔW.  
  *Fixing Agent:* National statistical agency (pre-defined algorithm, audit trail).  
  *Fixing Date:* T+5 years post-implementation (or predefined lag).  
  *Settlement Date:* T+5 years + 90 days (verification window).  
  *Settlement Asset:* Sovereign currency.  
  *Conditional Contracts ("Called-Off Bets"):**  
  - *Structure:* Pair of contracts: "ΔW | P implemented" vs. "ΔW | P not implemented".  
  - *Knock-Out:* If P not implemented, Contract A expires worthless; if implemented, Contract B expires worthless.  
  - *Payoff:* Net ΔW = (ΔWₚ - ΔWₙ) settled in currency.  
  *Counterparties:*  
  - *Natural Longs:* Policy advocates (benefit if P adopted and ΔW > 0).  
  - *Natural Shorts:* Policy opponents (benefit if P adopted and ΔW < 0).  
  - *Liquidity Providers:* Speculative capital (arbitrageurs, market makers).  
  *Clearing:* Central counterparty (CCP) with sovereign guarantee. Margin: Cash/VaR-based.  
  *Liquidity Backstop:* Mandatory quoting by designated market makers (DMMs) during N hours/day.  
  *Position Limits:* Per entity caps to prevent squeeze.  
  *Key Risks:*  
  - *Basis Risk:* Welfare metric ≠ true welfare (proxy error).  
  - *Adverse Selection:* Policy advocates/opponents hold superior info.  
  - *Orphan Market:* No DMM participation → bid/ask spreads widen → price uninformative.  
  - *Reflexivity:* Market price of P influences likelihood of P’s adoption/impact.  

  **RESIDUE REPORT**  
  *Pile 1: Clean Translations (No Loss)*  
  - **Thin Markets** → Orphan market dynamics; DMM quoting obligations fail under extreme asymmetric info.  
  - **Manipulation by Interested Parties** → Cornering risk + adverse selection; position limits directly address.  
  - **Basis Risk** → Welfare metric as imperfect proxy; identical to commodity index vs. physical delivery.  
  - **Knock-Out Features** → Called-off bets map 1:1 to conditional options.  
  - **Liquidity Collapse** → "No one takes the other side" = DMM withdrawal + negative gamma for LPs.  

  *Pile 2: Distorted Translations (Bent to Fit)*  
  - **"Money-Weighted ≠ Vote"**  
    - *Translation:* Framed as liquidity provider capital allocation (not democratic weight).  
    - *Distortion:* Assumes speculators provide "neutral" liquidity. In reality, LPs’ risk tolerance distorts price (e.g., short volatility bias). Smuggled efficiency assumption.  
  - **"Measurement Impossibility"**  
    - *Translation:* Basis risk assigned to fixing agent methodology.  
    - *Distortion:* Assumes statistical agency can be apolitical settlement oracle. Political contestation over measurement is recast as technical calibration error.  
  - **"Legitimate Authority"**  
    - *Translation:* CCP’s sovereign backing = settlement finality.  
    - *Distortion:* Legal enforceability ≠ democratic legitimacy. Authority question is hidden in sovereign guarantor role.  

  *Pile 3: No Counterparty (Untranslatable)*  
  - **"Price as Governance"**: No contract mechanism for transferring legislative authority to a market signal. This is a *delegation rule* outside the derivative’s structure.  
  - **"Welfare Unmeasurable"**: If ΔW is fundamentally unobservable, the contract has no deliverable. This voids the entire structure (like an option on an unverifiable event).  
  - **"Reflexivity"**: Market price altering policy adoption likelihood → underlying becomes path-dependent on the contract itself. No hedging instrument exists for this endogenous risk.  

  ---

  **STRESS TESTS**  
  *Case 1: City Corridor Upzoning*  
  - *Underlying:* Composite welfare proxy (e.g., property values + displacement metrics + congestion costs).  
  - *Adverse Selection:* Landlords/developers are natural longs + hold superior info on land values; tenants are natural shorts + know displacement risks.  
  - *Outcome:* Bid/ask spreads widen as insiders refuse to take the other side. DMMs withdraw due to unhedgeable risk → orphan market. Price reflects insider capital weight, not welfare forecast.  
  - *Residue:* "Legitimacy" objection untranslatable – contract settles, but democratic deficit remains. Reflexivity ignored (market activity influences development timing).  

  *Case 2: Sanctions Imposition*  
  - *Underlying:* Binary contract: "Sanctions lifted if target complies by T+1y".  
  - *Reflexivity:* Market price of "compliance" signals expected concessions → alters target state’s bargaining strategy.  
  - *Outcome:* Contract price becomes a strategic tool. Target state shorts "compliance" contract to signal resolve, or longs it to bluff. No settlement mechanism can isolate exogenous probability.  
  - *Residue:* Reflexivity breaks the "forecast" assumption – the market isn’t predicting, it’s participating. Untranslatable to derivatives (no analogue for self-cancelling underlyings).  

  ---

  **CONCLUSIONS**  
  1. **Structural Gaps in Proposal**:  
     - *No Settlement Asset:* ΔW is not a tradable commodity; basis risk is fatal if welfare is contested.  
     - *No Viable Counterparty:* When policy affects all, natural hedges vanish. Market becomes one-sided orphan.  
     - *Reflexivity is Unhedgeable:* GPMs on policies alter policy outcomes – no contract language exists for this.  

  2. **Critics’ Objections**:  
     - "Thin markets/manipulation" translate cleanly → standard design fixes exist (DMMs, position limits).  
     - "Money-weighted ≠ vote" distorts but highlights LP bias → soluble via subsidized liquidity.  
     - "Unmeasurable welfare" and "illegitimate authority" are untranslatable → fundamental residue.  

  3. **Visible in Your Vocabulary, Invisible in Philosophy Debate**:  
     - **Capital-Weighted ≠ Consensus**: Prices reflect marginal capital, not median voter. A $10M whale outweighs 10,000 $100 traders.  
     - **Conditional Payoff without Condition Settler**: Called-off bets require an oracle to declare "policy adopted." In governance, the oracle *is* the state – circularity.  
     - **Markets as Participants, not Observers**: When the underlying event (policy) is influenced by the market’s price, efficiency fails endogenously.  

  **Final Residue**: The proposal fails on contract structure alone. Welfare is an unhedgeable underlying with no deliverable, reflexivity voids the forecast, and authority delegation has no settlement mechanism. Critics’ substantive objections (legitimacy, measurability) leave residue; operational critiques (manipulation, liquidity) do not. Your vocabulary exposes that this is less a prediction market and more a *reflexive derivative* – a product with no known hedging strategy.
