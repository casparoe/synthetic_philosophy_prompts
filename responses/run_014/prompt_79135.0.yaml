prompt: |-
  I'm a third-year student in a course on decision theory and the ethics of the long term, and next week I'm leading a sixty-minute discussion section for about fifteen students — one prior philosophy course each, comfortable with expected value and not much beyond it. My assigned topic is whether the simulation argument dampens the case for fanaticism about the far future, and I don't want you to lay the argument out for me. I want a plan for teaching it.

  Here is the shape of the question as I'll have to present it. The charge of fanaticism, as it's usually pressed, is that a theory which tells us to trade near-certain modest goods — a life saved now, a stable century — for a minuscule chance of an astronomically large far-future payoff is fanatical, however the arithmetic comes out. The simulation argument is the familiar disjunction: either almost no civilization survives to the point of being able to run ancestor simulations, or almost none of those that do choose to run them, or we are almost certainly in one. The suggestion I'm meant to teach is that a substantial probability of being simulated blunts the fanatic's case, because the far future we would be purchasing with that minuscule chance is not straightforwardly ours to spend — the simulators may terminate it, may be running countless instances of us, and may be the ones whose future actually carries the value. I suspect the suggestion is at best half right, but I would rather have your plan than my own opinion.

  So: what has to be in place before the students can even hear the question, what depends on what, and why that order rather than the obvious one; the single case that should carry the whole session, what it must have and what it must not have, and whether a mugging-style case — a stranger promising an astronomical reward against a vanishingly small chance that he can deliver it — is a mistake here, since I suspect it teaches suspicion of large numbers rather than the structure of the nesting, though I can't tell whether that's a genuine constraint or merely my taste; the misconceptions they'll bring and the ones they'll form, in the order they'll surface, and exactly where in the sequence I should head each off — I expect "fanaticism means caring too much about the future" and "the simulation argument is a skeptical claim about whether reality exists, so it cannot bear on a decision"; what I should openly refuse to cover at this level, and say so; and the one question I should put to them at the close to see whether the structure landed rather than just the vocabulary.

  Give me your verdict too, not a survey of positions: say whether the simulation argument does dampen far-future fanaticism, with your reasons, and let the session's arc commit to that answer rather than hedging around it.
reasoning: |-
  Okay, the user is a third-year student preparing to lead a discussion section on whether the simulation argument dampens the case for fanaticism about the far future. They need a teaching plan, not a rehash of the arguments. Let me start by understanding their main concerns.

  First, the students' background: one prior philosophy course, comfortable with expected value but not much beyond. So I need to scaffold the concepts carefully. The key elements are fanaticism in decision theory and the simulation argument. The user wants to avoid common pitfalls like misinterpreting fanaticism as "caring too much" or seeing the simulation argument as pure skepticism.

  The user suspects that using a Pascal's Mugging case might teach suspicion of large numbers instead of the nesting structure. I agree. A mugging scenario focuses on improbability and trust, not the hierarchical value structure. The core issue here is the nesting of simulations and how that affects value propagation. So I need a case that illustrates that—maybe a simulation within a simulation where the outer layer controls the value.

  Next, misconceptions. Students might think fanaticism is about excessive emotion, not a structural feature of utility functions. They might also see the simulation argument as solipsistic, denying reality. I should address these early by defining terms operationally. For example, fanaticism here is about tiny probabilities of vast payoffs, and the simulation argument is a trilemma with practical implications, not just epistemology.

  Structuring the session: Start with fanaticism as a decision-theoretic stance. Use a simple asteroid deflection case to show the math. Then introduce the simulation argument, emphasizing the three options. The critical step is linking them: if we're simulated, the vast future might not be ours to affect. The nesting case with nested simulations can show how value might not flow upward. Perhaps a scenario where the simulated civilization's survival doesn't contribute to the simulator's future.

  The closing question should test if they grasp the structure. Asking whether a simulated future's value counts if the simulators don't care about it. That forces them to consider where value resides.

  For the verdict: The simulation argument does dampen fanaticism because if we're likely simulated, our actions might not influence the real far future. The value could be confined to our simulation, or the simulators might terminate it. Thus, betting on affecting the far future becomes less reasonable. The session should commit to this, showing how probability shifts due to the simulation hypothesis undercut fanaticism's leverage.
answer: |-
  Here’s a structured 60-minute teaching plan focused on conceptual sequencing, preempting misconceptions, and delivering a clear verdict. The arc prioritizes **nesting of agency** over probability skepticism.

  ---

  ### **Session Structure & Timing**  
  **(Total: 60 min)**  

  #### **I. Groundwork: Fanaticism as Structure, Not Passion (15 min)**  
    - **What students need first**:  
      - **Fanaticism ≠ "caring too much"**. Define it operationally: *A theory is fanatical if it prescribes sacrificing near-certain, significant near-term goods for a vanishingly small probability of an astronomically large payoff in the far future.*  
      - **Key example**: Asteroid deflection.  
        - *Choice*: Spend $10B now for a 1/1,000,000 chance of preventing human extinction in 200 years (preserving 10^16 future lives).  
        - *EV math*: (10^16 lives × 1/1,000,000) = 10^10 expected lives saved → "Worth it" by EV.  
      - **Preempt misconception**: "This is just math!" → Acknowledge but stress: *The charge of fanaticism is ethical*: EV alone may license morally reckless trade-offs.  

  #### **II. Simulation Argument: Trilemma, Not Skepticism (10 min)**  
    - **Core disjunction (briefly)**:  
      1. >99% of civs go extinct before simulation-capable stage.  
      2. >99% of simulation-capable civs never run ancestor sims.  
      3. We are almost certainly in a simulation.  
    - **Preempt misconceptions**:  
      - *"This denies reality!"* → Clarify: This is a *predictive claim* about civ trajectories, not Cartesian doubt. Simulations are real tech for simulators.  
      - *"Sims are fake lives"* → Reject: Simulated minds (if conscious) have moral weight *if* the simulator grants it continuity.  

  #### **III. The Link: Why Nesting Breaks Fanaticism (25 min)**  
    - **Critical insight**: Fanaticism assumes *our actions directly affect the baseline far future*. Simulation undermines this by nesting futures.  
    - **Primary teaching case (NO mugging!)**:  
      - **The Nested Civilization Scenario**  
        > *Base reality*: Advanced civ ("Archons") runs ancestor sims of pre-sim Earth.  
        > *Your choice*: Spend vast resources for a 1/1,000,000 chance to secure Earth’s far future (e.g., prevent sim-Earth extinction).  
        > *Catch*: Archons may:  
        >   a) Terminate the sim tomorrow,  
        >   b) Run 10^20 identical sim-Earths (diluting impact),  
        >   c) Value only *their own* future (sim-Earth’s "future" is just code).  
      - **Discussion Q**: *Does the EV calculation change if the Archons control the value horizon?*  
        - Guide students to see: Expected value of saving sim-future lives depends on the *Archons’ goals*, not our own. If Archons don’t value sim-futures, our sacrifice buys nothing.  
    - **Why avoid mugging cases**: They focus on *trust in improbable claims*, not *hierarchical value structures*. Nesting is the key.  

  #### **IV. Why Order Matters**  
    1. **Fanaticism first**: Students must grasp the *target* (structural EV-driven sacrifice).  
    2. **Simulation second**: Presented as a *physical hypothesis* (Bostrom-style), not philosophy.  
    3. **Nesting case third**: Reveals why simulation threatens fanaticism’s *agency assumption*.  
    - **Sequence logic**: Fanaticism → Its vulnerability (who controls the future?) → Simulation as one such vulnerability.  

  #### **V. What to Explicitly Exclude**  
    - **State upfront**: "We won’t cover:  
      - Consciousness in simulations (assume sim-minds matter),  
      - Alternatives to Bostrom’s trilemma,  
      - Non-fanatical longtermism (e.g., patient philanthropy).  
      Focus: Does simulation *specifically* defang fanatical trade-offs?"  

  #### **VI. Closing Question to Test Understanding (5 min)**  
    > *"In the Nested Civilization case, would a fanatical sacrifice still make sense if we knew the Archons were bored cosmic historians who delete sims after 2100? Why?"*  
    - **Goal**: Reveals if they grasp that value hinges on the *simulator’s framework*, not our EV math alone. Correct answer: "No—no far future exists to save."  

  ---

  ### **Your Verdict: Yes, Simulation Dampens Fanaticism**  
  **Why**:  
  - Fanaticism relies on a direct causal chain: *My sacrifice → Tiny chance → Vast future value accruing to my civilization's descendants*.  
  - Under simulation (especially if we assign it non-trivial probability), this chain is *interrupted*:  
    - The "vast future" we aim to save might be a short sim the Archons terminate arbitrarily.  
    - Even if our sim continues, its "future" may be valueless to the baseline reality where moral weight resides.  
    - If sims are mass-produced, our impact is diluted to near-zero.  
  - **Crucially**: This doesn’t require certainty we’re simulated—only that simulation is *probable enough* to conditionalize on. Assigning 10% probability to being in a sim where our far-future actions are valueless could dominate the EV calculation.  
  - **Result**: Simulation doesn’t refute fanaticism’s math; it exposes its *contingency* on an unbroken chain of agency. When that chain is nested, fanaticism loses its object.  

  **Session arc commitment**:  
  Start with fanaticism’s power (EV math) → Show its fragility (nesting) → Use simulation as the fragility-maker → Conclude: Fanaticism isn’t "wrong," but its leverage depends on cosmological luck.  

  This structure forces engagement with the *hierarchy of futures*, not just probability weights. You’ll know it worked if students argue about Archons’ intentions, not Pascal’s Mugging.
