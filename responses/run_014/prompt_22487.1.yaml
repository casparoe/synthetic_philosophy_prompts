prompt: |-
  I'm a novelist working on a book where one of the characters is an academic who's made his name defending Aumann's agreement theorem — the result that two bayesians who share a common prior and whose posteriors are common knowledge can't rationally disagree — and I want him to sound like a real specialist, not a Wikipedia entry. One scene has a journalist interviewing him, and I want you to write the eight or ten questions that journalist would ask. I want at least one that presses on whether the common prior assumption is doing all the work (and what breaks if you drop it), one on the infinite state space counterexamples — the ones that show you need some finitess somewhere for the theorem to go through — and one that tries to read the result as really being about markets, i.e. the no-trade / no-arbitrage version where the common prior is a stand-in for "no one can be sytematically exploited." For each question, give me the follow-up the journalist would ask depending on how the character is most likely to answer. Keep it conversational; I'm a writer, not a logician, so if a question needs a technical caveat, bake it into the question instead of assuming I'll know it.
