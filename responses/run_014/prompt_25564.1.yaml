  Okay, let me start by unpacking the user's query. They're diving into the philosophical underpinnings of international humanitarian law, specifically the moral equality of combatants versus the distinction between just and unjust wars. The core tension they point out is that soldiers aren't held responsible for which side they fight on, only for how they fight, even though the war itself might be criminal.

  First, I need to recall the key concepts here: jus ad bellum (justice of going to war) and jus in bello (conduct during war). The user is puzzled by the symmetrical application of in bello rules despite asymmetrical ad bellum status. They mention the crime of aggression applies to leaders, not soldiers. So the question is about moral responsibility—how individual soldiers relate to the collective action.

  The user is likely looking for a coherent theory that explains this separation. They might be exploring if this legal structure is philosophically defensible. Their deeper need could be understanding whether the current laws align with moral principles or if there's an inconsistency that needs addressing.

  I should consider possible theories. The institutional role-based responsibility comes to mind, where soldiers as agents of the state have duties tied to their role, not the war's justice. This separates in bello from ad bellum. Then there's the collectivist view: states are moral agents, so leaders bear the ad bellum responsibility. But the user already noted that individual responsibility doesn't inherit from the collective project, so maybe the role-based theory fits better.

  Combat pragmatism is another angle—practical necessity to incentivize compliance with in bello rules, regardless of the war's justice. The user might be questioning if this pragmatism overrides moral considerations. 

  They also ask what changes if soldiers were held responsible for the war's justice. That would collapse the separation, making in bello rules asymmetrical. I need to think through implications: soldiers refusing to fight unjust wars, but also potential chaos, reduced surrender, etc. 

  Vulnerabilities in my reasoning? If the collectivist view is rejected—say, states aren't moral agents—then the role-based separation might not hold. Or if individual moral responsibility is paramount, then soldiers in unjust wars could be seen as complicit. Also, if modern warfare blurs the line between combatants and civilians, the combatant's privilege might be questioned. 

  The user's background seems academic, possibly law or philosophy. They want a thorough analysis of presupposed theories and alternatives. Their unspoken need might be to evaluate if current laws are ethically sound or if reforms are needed. I should present different theories, their compatibility, and practical consequences of changing them, while highlighting where the argument is weakest.
answer: |-
  This practice rests on a sophisticated—and philosophically contested—view of moral responsibility that combines elements of **institutional role-based duty**, **collective agency**, and **pragmatic humanitarianism**. Here's a breakdown of the presupposed theory, its alternatives, and implications:

  ### Core Theory: Role-Based Combatant Responsibility & Institutional Agency
  1. **Separation of *Jus ad Bellum* (Justice of War) and *Jus in Bello* (Justice in War)**  
     The law treats these as distinct moral domains. *Jus ad Bellum* concerns the **state's act** of initiating war (addressed via the crime of aggression). *Jus in Bello* governs **individual conduct** during war (binding all combatants equally).  

  2. **Combatants as Institutional Agents**  
     Soldiers are seen as instruments of state policy, not independent moral arbiters of their nation's wars. Their duty is to:  
     - Obey lawful orders (within *jus in bello*).  
     - Refrain from war crimes (e.g., targeting civilians).  
     Moral responsibility attaches to **role-specific duties**, not the overarching political aim.  

  3. **Collective Agency of States**  
     The "crime of aggression" is a **leadership crime** because leaders embody the state's agency in deciding to wage war. Ordinary soldiers lack this decision-making authority. This mirrors theories like *Christopher Kutz's complicity model* or *Michael Walzer's "collective responsibility"*: moral liability scales with capacity to shape outcomes.  

  4. **Combatant's Privilege as a Humanitarian Tool**  
     Symmetrical rules incentivize compliance:  
     - Soldiers follow *in bello* rules knowing they’ll receive POW status if captured.  
     - Asymmetry would discourage surrender (e.g., "unjust" combatants fearing trial).  
     This reflects *pragmatic consequentialism*: maximizing restraint in war trumps abstract moral liability.  

  ### Compatibility with Other Theories  
  The practice is **compatible but strained** with:  
  - **Kantianism**: If soldiers are rational agents, why aren’t they responsible for choosing an unjust cause?  
  - **Consequentialism**: Symmetry promotes better outcomes overall, but may absolve perpetrators of aggression.  
  - **Just War Revisionism (McMahan)**: Directly contradicts the practice, holding combatants in unjust wars morally liable for killing (see below).  

  ### Consequences of Rejecting Moral Equality (e.g., Adopting Revisionism)  
  If soldiers were held responsible for *which side* they fight:  
  1. **Legal Changes**:  
     - Loss of combatant immunity/POW status for "unjust" combatants.  
     - Killing enemy soldiers in an unjust war = murder.  
     - Asymmetrical *in bello* rules (e.g., "just" side might target "unjust" rear bases as "legitimate").  

  2. **Practical Fallout**:  
     - **Reduced Surrender**: "Unjust" combatants fight to the death to avoid prosecution.  
     - **Fragmented Compliance**: Soldiers (or states) self-declare "just" to bypass rules.  
     - **Escalation**: "Just" side feels morally licensed to violate proportionality.  

  3. **Moral Dilemmas**:  
     - Conscientious objection becomes legally mandatory but practically hazardous.  
     - Courts must adjudicate the *justice of the war* in every soldier’s trial—a near-impossible standard.  

  ### Key Vulnerabilities in This Analysis  
  **Vulnerability 1: Rejecting Collective Agency**  
  - **If dropped**: If states aren’t moral agents (only individuals are), leaders can’t bear sole *ad bellum* guilt. Soldiers become co-responsible for the war.  
  - **Alternative Conclusion**: Soldiers in aggressor armies lose moral/legal immunity. *Jus in bello* symmetry collapses.  

  **Vulnerability 2: Rejecting Role Obligations**  
  - **If dropped**: If institutional roles don’t mitigate personal responsibility (e.g., "Nuremberg Defense" is invalid), soldiers *must* refuse unjust orders.  
  - **Alternative Conclusion**: Moral equality evaporates; soldiers bear *ad bellum* liability proportional to their knowledge/autonomy.  

  **Vulnerability 3: Questioning Humanitarian Pragmatism**  
  - **If dropped**: If maximizing *in bello* compliance isn’t paramount (e.g., justice > order), symmetry loses its core justification.  
  - **Alternative Conclusion**: Prioritize moral liability over practical restraint, risking greater atrocities but aligning with individualist ethics.  

  ### Conclusion  
  The current laws presuppose a **hybrid theory**: **collective responsibility for leaders + role-based duties for soldiers + pragmatic humanitarianism**. It’s philosophically coherent but prioritizes real-world harm reduction over perfect moral accountability. Rejecting moral equality of combatants would radicalize the law—bringing it closer to individualist ethics but risking catastrophic humanitarian consequences. The system’s stability hinges on accepting that soldiers are *agents of the state*, not free moral actors in the theater of war.  

  *Where does this leave you?* If you endorse revisionism (e.g., McMahan), the law is morally flawed but practically wise. If you defend the status quo, you accept a tragic compromise: protecting lives by partially absolving perpetrators.
