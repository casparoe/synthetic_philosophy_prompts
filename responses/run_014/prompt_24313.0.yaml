prompt: |-
  I teach an applied ethics seminar and grade student case analyses roughly twice a week; each paper asks students to argue for a moral verdict on a concrete case (a disclosure dilemma, a triage decision, a confidentiality breach, etc.). My problem is that I grade on an implicit, inconsistent standard: I sometimes reward a student for citing a general principle and sometimes for doing careful case-by-case reasoning that never names one, and I can't articulate when each is actually good. The moral particularism–generalism debate is supposed to be about exactly this, but I've never turned it into something I can run on a paper in the time I have.

  Please write a grading procedure I can follow in order, that separates "is this reasoning well done?" from "is it principled or particularist?" It should: (1) identify whether the argument is principle-based, case-based, or a mix, and what the load-bearing move in the argument is; (2) check whether that move is done well on its own terms — for a principle, whether the case genuinely falls under it and whether the obvious defeaters have been considered; for case-based reasoning, whether the morally salient features have been identified and weighed, and whether a feature that would change the verdict has been missed; (3) flag the cases where a principle the student relies on is defeated in this context — a feature that is a reason in normal cases is a disreason or neutral here — and say what to do with that; (4) mark where the procedure stops and hands the final moral verdict to my own judgment, because whether the action is right is a question of values, not of well-formedness.

  Then run it on two worked examples: a student who argues from a general principle of non-maleficence that a doctor must disclose a bad diagnosis immediately, and a student who never names a principle but argues from the specific features of the case (the patient's known anxiety, the timing of the disclosure, the availability of support) that the doctor should delay disclosure. I want to see the procedure give a different grade to one of these than I would have given on instinct, and I want you to say what the procedure cannot do that I still have to do.
reasoning: |-
  Okay, the user teaches an applied ethics seminar and is struggling with inconsistent grading standards when evaluating student case analyses. They want a clear grading procedure that separates the quality of reasoning from whether it's principle-based or particularist. 

  Hmm, this is a sophisticated pedagogical challenge. The user clearly understands the particularism-generalism debate but needs a practical tool. Their frustration with their own inconsistency suggests they value fairness in grading and want to avoid rewarding approaches arbitrarily. 

  The request has four precise technical requirements: identifying argument type, evaluating internal coherence, handling defeasibility, and marking where judgment takes over. They also want concrete examples where the procedure would diverge from their instinct. 

  *scratches head* The tricky part is designing something both philosophically sound and time-efficient. Most grad school rubrics fail at capturing defeasibility or the principle/particularist distinction. And ethical judgment can't be fully proceduralized - that's the whole point of applied ethics!

  For the procedure... 
  First step should quickly sort arguments into P (principle), C (case-based) or H (hybrid). Key is identifying the load-bearing move - that's where most grading time should focus. 

  For principles, the critical check is whether the case genuinely instantiates the principle AND if standard defeaters are addressed. Many students miss that principles have exceptions. 

  For case-based reasoning, the weight is on whether they've captured relevant features and considered what would change the verdict. Particularist arguments often fail by missing hidden variables. 

  Ah, defeasibility is crucial! Need a clear test: "Is there a feature that normally strengthens the argument but weakens it here?" That's where many papers collapse. 

  The examples are perfect for contrast. The principle-based diagnosis disclosure might overlook patient anxiety as a defeater - which the particularist paper catches. That's exactly where the procedure should flag something the user's instinct might miss. 

  *mental note* Must emphasize what the procedure CAN'T do: it won't replace value judgments about what counts as "sufficient" feature analysis or determine which principles are valid. Those remain the instructor's burden. 

  The worked examples should show the particularist paper getting higher marks precisely because the principle-based one misses the defeater. That's the "different grade" moment the user wants to see. 

  ...Better include explicit time estimates per step too. This professor grades twice weekly - no time for philosophical deep dives!
answer: |-
  Here’s a streamlined grading procedure designed for efficiency (5-10 minutes per paper) that separates reasoning quality from the principle/particularist divide, with built-in defeasibility checks and clear handoff points to your judgment:

  ---

  ### **Grading Procedure**  
  **Step 1: Identify Argument Type & Load-Bearing Move** (1 min)  
  - **Principle-Based (P)**: Cites a general moral rule (e.g., "Always minimize harm").  
  - **Case-Based (C)**: Appeals only to case-specific features (e.g., "The patient’s anxiety makes delay prudent").  
  - **Hybrid (H)**: Uses both (e.g., "Non-maleficence applies, but the patient’s anxiety is an exception").  
  → *Flag the core move*: What single claim does the verdict hinge on? (e.g., "This falls under non-maleficence" or "Anxiety outweighs disclosure duties").  

  **Step 2: Evaluate Internal Soundness** (3-5 min)  
  - **For P Arguments**:  
    - ✓ Does the case *clearly* fall under the principle? (e.g., Does delayed disclosure *cause harm*?)  
    - ✗ Are obvious defeaters addressed? (e.g., "Does anxiety make immediate disclosure *more harmful*? If unaddressed, flag).  
  - **For C Arguments**:  
    - ✓ Are ≥3 *morally relevant* features identified? (e.g., patient’s anxiety, timing, support).  
    - ✗ Is a high-impact missing feature obvious? (e.g., Did they ignore the patient’s *explicit request for honesty*?).  
    - ✓ Is feature-weighing plausible? (e.g., "Anxiety could worsen prognosis" isn’t just asserted).  

  **Step 3: Check for Defeasibility** (1-2 min)  
  - Scan for features that *invert or neutralize* the core move:  
    - **P Example**: A principle like "Always tell truth" may be *defeated* if truth causes disproportionate harm (e.g., severe psychological collapse).  
    - **C Example**: A feature like "patient’s anxiety" may be *defeated* if the patient has a history of resilience.  
  → *If defeaters are present but unaddressed*, deduct credit. If they’re acknowledged, reward.  

  **Step 4: Handoff to Judgment** (Mark on rubric)  
  - ✔ Reasoning well-formed? → **Grade based on Steps 1-3**.  
  - ❓ Moral verdict → **Circle your score for "Verdict Plausibility"** (separate from reasoning).  
  - ⚠ *Limitation note*: "This procedure evaluates *form*, not whether the principle is valid or feature-weighing is correct. I judge verdict plausibility separately."  

  ---

  ### **Worked Examples**  
  **Student A (Principle-Based):**  
  >*"Non-maleficence requires minimizing harm. Disclosing a terminal diagnosis immediately causes emotional harm. Thus, the doctor must delay disclosure."*  

  1. **Step 1**: **P** (load-bearing move: case falls under non-maleficence).  
  2. **Step 2**:  
     - ✓ Case fits principle? → *Plausible* (disclosure causes distress).  
     - ✗ Defeaters addressed? → **NO** (fails to ask: *Could delay cause greater harm?* e.g., lost treatment time).  
  3. **Step 3**: Defeater present? → **YES** (if delay risks physical harm, non-maleficence might *demand* disclosure). Unaddressed → **deduct**.  
  4. **Step 4**: Reasoning flawed (missed defeater). Verdict plausibility → *Your judgment*.  

  **Grade Impact**: Lower than instinct? Many graders reward "clean" principles. Procedure penalizes unaddressed defeater.  

  ---

  **Student B (Case-Based):**  
  >*"The patient has severe anxiety (Feature 1), lacks family support until next week (Feature 2), and has a history of acting rashly on bad news (Feature 3). Thus, delay disclosure briefly."*  

  1. **Step 1**: **C** (load-bearing move: anxiety + lack of support + rashness outweigh disclosure duty).  
  2. **Step 2**:  
     - ✓ ≥3 features? → **YES** (anxiety, support, rashness).  
     - ✗ Missing feature? → **Not obvious** (e.g., if case mentioned "patient values autonomy," but didn’t, so no flag).  
     - ✓ Weighing plausible? → **YES** (links anxiety to potential harm).  
  3. **Step 3**: Defeater? → *None obvious* (e.g., if patient *requested honesty*, it’d defeat anxiety’s weight, but not mentioned).  
  4. **Step 4**: Reasoning sound. Verdict plausibility → *Your judgment*.  

  **Grade Impact**: Higher than instinct? Particularist arguments often seem "messy," but procedure rewards rigorous feature analysis.  

  ---

  ### **What the Procedure Can’t Do (Requires Your Judgment)**  
  1. **Validate moral weight**: Is anxiety *truly* more important than autonomy here?  
  2. **Assess principle validity**: Is "non-maleficence" the *right* principle for medical ethics?  
  3. **Resolve deep conflicts**: e.g., When two well-defended principles clash.  
  4. **Evaluate creativity**: e.g., A novel but defensible feature no one else considered.  

  ### **Why This Works**  
  - **Splits "reasoning" from "verdict"**: You grade structure first, then apply values.  
  - **Flags defeasibility systematically**: Forces engagement with moral exceptions.  
  - **Saves time**: Focuses only on the *load-bearing move*, not every sentence.  
  - **Democratizes grading**: Particularist arguments aren’t penalized for lacking principles if features are well-handled.  

  The procedure would likely downgrade Student A (missed physical harm defeater) where instinct might reward principle clarity, while upgrading Student B (rigorous features) where instinct might distrust principle-free reasoning. This exposes *your* hidden bias toward generalism!
