  - **Effort still matters**: Even if talent is luck-driven, effort involves agency—choosing to cultivate that talent. Ignoring that agency feels unfair in its own way.  
  - **Practical necessity**: Society *must* reward useful skills, or we’d collapse into inefficiency. We reward surgeons for steady hands, not because they "deserve" their biology, but because we need surgeries done well.  
  - **Moral luck everywhere**: If we reject merit rewards due to luck, consistency demands we dismantle *all* reward structures (even effort), since effort itself relies on lucky traits like grit or supportive upbringing. That’s a radical, maybe unlivable, conclusion.  

