answer: |-
  Here's the audit of your roommate's explanation and your thought experiment, as five numbered items:

  1.  **Correct on Block's core distinction:** Block *does* argue phenomenal consciousness (raw subjective experience) can exist independently of access consciousness (availability for reporting, reasoning, control), using examples like peripheral visual experience exceeding reportable detail.
  2.  **Stretched on Global Workspace Theory (GWT):** GWT proponents (like Baars, Dehaene) *do* equate consciousness with global information access/broadcasting (the "blackboard"), but claiming this "solves" the phenomenal/access issue by making them identical is a major *interpretation*, not a settled fact, and sidesteps the hard problem of *why* access feels like anything at all.
  3.  **Overstated on implications:** Saying GWT guarantees phenomenal consciousness in any system (brain or robot) with a global workspace is a strong claim (functionalism/access phenomenology) that is philosophically contentious and not universally accepted; conversely, denying *any* phenomenality without it ignores other theories (e.g., IIT).
  4.  **Shared list as GWT:** The linked smart speakers' shared to-do list *is* a functional analogy for a global workspace/blackboard – information written there is globally accessible to all "modules" (speakers), enabling coordinated action (access consciousness).
  5.  **Private logs & Block's view:** Block *would* argue the private logs *could* hold phenomenal states without access (like unattended background noise processing), while GWT would see them as merely non-conscious, pre-access information unless broadcast to the shared list.
