prompt: |-
  I'm a retired physicist (condensed matter, if that matters) and I've only recenlty started reading philosophy, mostly the philosophy of science side. I came across structural realism in a chapter of a general audience book on the philosophy of physics — I can't remember the author — and I'm not sure how much of it to trust. Here's roughly what it said:

  "Structural realism is the position that the entities postulated by our best scientific theories are probably wrong, but the mathematical structure that ties them together is probably right. It was motivated by the pessimistic meta-induction: look at how many successful past theories — the caloric, the luminiferous ether, phlogiston — turned out to be false, and by induction our current theories are probably false too. Structural realism accepts that the entities were wrong but insists that the structure survived, so it's a way to be a realist without the bad inductive track record. The two main versions are epistemic structural realism, according to which we can only ever know the structure and never the underlying entities, and ontological structural realism, according to which only the structure really exists and the entities are just convenient fictions. Both versions agree that what is preserved through theory change is the mathematical formalism: when Newtonian mechanics gave way to relativity, for instance, the equations are what carried over, while the old story about absolute time and instantaneous action at a distance was discarded. For this reason structural realism is sometimes described as a last resort for the realist — it's what's left of realism once you've subtracted everything the pessimistic meta-induction takes away."

  I think this is mostly right but I have a nagging feeling its flattening something, and I don't know enough to say where. Can you audit it for me? I want a table, one row per substantive claim in the summary, with these columns: claim (quote the relevant phrase from the summary), verdict (one of: right / oversimplified / wrong), what a careful structural realist would actually say, and why it matters (does the error change the argument, or is it cosmetic). After the table, give me a short paragraph on whether the summary's overall conclusion — that structural realism is what's left of realism — survives the corrections.

  Two constraints: I'm not asking you to name specific philosophers or papers, just to reason about the content (I suspect you'd be guessing at the citations anyway). And if you think a claim is right but for the wrong reasons, or right in a way the summary doesn't capture, say so in the verdict column rather than just marking it right.
