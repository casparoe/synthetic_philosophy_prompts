prompt: |-
  I'm putting together a handout for a graduate applied-ethics seminar on inheritance, dynastic wealth and equal opportunity, and I want it to be a decision tree rather then a list of camps — something students can walk down to find out where they actually stand, with every node phrased so it can be answered without knowing which position it leads to. Build it from the logical space first, then place the actual views in it: each node a single question or claim on which the positions genuinely come apart, each leaf a named position, or unnamed where nobody defends it, and each leaf carrying one sentence on its most awkward commitment. Don't organise it by how keen someone is on taxing inheritance, that's the boring axis. Organise it by where they locate the wrong, if there is one — in the bequest itself, in the receipt, in the ongoing power a dynasty's wealth gives it over other people, or nowhere — and then by what they take the point of equal opportunity to be (a fair start, a fair race, or no inherited advantage at all), and by whether the family counts as a special case where partiality is allowed. It has to have a leaf for the Rignano scheme — the 1920s Italian proposal for a tax whose rate climbs each time the same pile passes down a generation, so the first bequest is cheap and the fourth is not — and a leaf for the view that the right instrument is an annual wealth tax instead, plus the abolish-it-entirely and leave-it-all-alone leaves. Ten-ish leaves is fine. Three cases have to fall out of the tree cleanly: the family house left to one child, the family firm handed to the next generation, and a trust going to a great-grandchild. Flag any pair of leaves the tree can't actually separate, and say which combinations of answers come out empty and whether that's because the position is incoherent, unattractive, or just undefended. No reading list or citations, thanks.
reasoning: |-
  Hmm, the user wants me to create a decision tree handout for a graduate seminar on inheritance and dynastic wealth. They're looking for something structured around the logical space of arguments rather than just tax policy preferences. I need to build this as a branching tree where students can answer questions without knowing where they'll end up, with each leaf representing a distinct position.

  The key organizing principles should be:
  - Where the wrong is located (if any): in the bequest itself, the receipt, the ongoing power of dynastic wealth, or nowhere
  - The purpose of equal opportunity: fair start, fair competition, or no inherited advantage
  - Whether family deserves special consideration

  I need to include specific positions: Rignano scheme (progressive generational inheritance tax), annual wealth tax advocates, abolish inheritance entirely, and leave it alone. Plus three test cases: family house to one child, family firm to next generation, and trust to great-grandchild.

  The tree should have around 10 leaves. I'll need to identify any positions that can't be separated and note which combinations are empty - whether due to incoherence, unattractiveness, or simply being undefended.

  I think I'll organize it with three main branches:
  1) Whether family transfers deserve special treatment compared to other wealth transfers
  2) Where the wrong in inheritance lies (if anywhere)
  3) What constitutes meaningful equal opportunity

  For the positions, I'll include:
  - Full abolition (Proudhon)
  - Leave it alone (Nozick)
  - Rignano scheme
  - Annual wealth tax (Piketty)
  - Deflated dynastic power (focuses on limiting ongoing control)
  - Opportunity equalizer (fair start)
  - Opportunity equalizer (fair competition)
  - Special status for productive assets (family firm exception)
  - Special status for primary residence (family house exception)
  - And one empty leaf showing why the "family exception" can't apply to distant trusts

  I'll make sure the three test cases resolve differently across positions - for example, the family house might be protected by some but not others, the family firm might have special status in one view, and the trust would be problematic for most except the laissez-faire position.

  I'll note that the "family house" and "family firm" positions can't be distinguished by the tree since their logic is identical, and point out that combining "no wrong in bequest" with "equal opportunity requires no inherited advantage" is an empty leaf because it's incoherent - you can't simultaneously see nothing wrong with inheritance but demand no one inherits advantages.
answer: |-
  Here's a decision tree structured around the core ethical tensions you specified, designed to reveal foundational commitments. Positions are defined by *why* they find inheritance problematic (or not) and *how* they conceptualize equal opportunity. The three test cases resolve distinctly.

  **Decision Tree: The Ethics of Inheritance & Dynastic Wealth**

  1.  **Does transferring significant wealth *specifically within a family* deserve categorically different ethical treatment than transferring it to non-family (e.g., friends, charities, strangers)?**
      *   **Yes (Family as Ethically Special)** → Go to 2
      *   **No (Family Transfers Are Just Like Any Other Wealth Transfer)** → Go to 3

      *(Branch 2: Family is Special)*
  2.  **What is the core ethical justification for treating familial transfers specially?**
      *   **A: Intimate care, identity, or continuity justifies partiality, limiting the scope of "equal opportunity" concerns primarily to non-family wealth transfers.** → Go to 4
      *   **B: The justification is specifically about enabling intergenerational transmission of *productive agency* (like a business) or *essential shelter*, not passive wealth.** → Go to 5

      *(Branch 3: Family Not Special)*
  3.  **Is there a fundamental wrong inherent in the transfer of wealth via inheritance?**
      *   **Yes** → Go to 6
      *   **No (Inheritance per se is ethically neutral or positive)** → **Position: Laissez-Faire (e.g., Nozick)**
          *   *Most Awkward Commitment:* Defending the justice of massive, passively inherited dynastic fortunes conferring permanent power across generations solely due to birth.

      *(Branch 4: Family Partiality Trumps Broad EO)*
  4.  **Should society intervene to correct for unequal starting points created *specifically by familial inheritance*?**
      *   **Yes, significantly, to ensure a 'fair race' (meritocratic competition).** → **Position: Opportunity Equalizer (Fair Race Focus)**
          *   *Most Awkward Commitment:* Applying potentially high taxes/inheritance limits *except* for moderate transfers tied directly to family homes or essential support, which are protected due to family partiality. *(Resolves Family House: Usually Protected; Family Firm: Taxed/Limited; Trust: Taxed/Limited)*
      *   **Minimally or No, a 'fair start' isn't the state's role regarding family assets.** → **Position: Deflated Dynastic Power**
          *   *Most Awkward Commitment:* Relying solely on preventing extreme *ongoing power* (via wealth/ownership caps) to mitigate dynastic harms, while allowing significant inherited wealth inequality from family transfers if it doesn't create dominating power. *(Resolves Family House: Protected; Family Firm: Protected if not monopolistic; Trust: Taxed/Capped if large enough to confer power)*

      *(Branch 5: Special Status for Productive/Essential Assets Only)*
  5.  **Which type of asset transmission deserves primary protection?**
      *   **A: The intergenerational continuity of productive enterprise (family firms/business capital).** → **Position: Productive Agency Exception (e.g., some business succession advocates)**
          *   *Most Awkward Commitment:* Defending tax advantages for inheriting multi-million dollar businesses while heavily taxing/limiting inheritance of equivalent financial assets or primary residences beyond a basic level. *(Resolves Family House: Limited/Taxed; Family Firm: Protected; Trust: Taxed/Limited)*
      *   **B: Securing basic shelter/stability via the primary family residence.** → **Position: Homestead Exception**
          *   *Most Awkward Commitment:* Protecting the full value of highly appreciated family homes (even in exclusive areas) from inheritance tax, while potentially heavily taxing the inheritance of productive business assets or financial wealth needed for opportunity. *(Resolves Family House: Protected; Family Firm: Taxed/Limited; Trust: Taxed/Limited)*

      *(Branch 6: Inherent Wrong in Inheritance - Family Not Special)*
  6.  **Where is the primary locus of the wrong?**
      *   **A: In the initial *act of bequest* itself - it's an unjustified extension of control beyond death or misallocation of resources.** → **Position: Abolitionist (e.g., Proudhon)**
          *   *Most Awkward Commitment:* Advocating for the complete confiscation of all assets above a minimal threshold upon death by the state, regardless of family wishes or the nature of the assets. *(Resolves Family House: Confiscated/Taxed 100%; Family Firm: Confiscated/Taxed 100%; Trust: Confiscated/Taxed 100%)*
      *   **B: In the *receipt* of unearned advantage by the heir, undermining equality of opportunity.** → Go to 7
      *   **C: In the *ongoing, multi-generational power* dynastic wealth confers, distorting society and democracy.** → **Position: Annual Wealth Tax Advocate (e.g., Piketty)**
          *   *Most Awkward Commitment:* Taxing the *same* wealth annually regardless of how it was acquired (earned or inherited), focusing on the *existence* of large concentrations, not the act of transfer. *(Resolves Family House: Taxed annually if valuable; Family Firm: Taxed annually on value; Trust: Taxed annually on value)*

      *(Branch 7: Wrong in Receipt/Unearned Advantage)*
  7.  **What does 'equal opportunity' fundamentally require regarding inherited advantage?**
      *   **A: A roughly equivalent starting point ('fair start'), necessitating redistribution *at the point of receipt*.** → **Position: Rignano Scheme**
          *   *Most Awkward Commitment:* Taxing wealth inherited by a great-grandchild at 80%+ while taxing the same amount left to a child or spouse minimally, solely based on generational distance. *(Resolves Family House: Low tax if 1st gen; Family Firm: Low tax if 1st gen; Trust: Very High Tax)*
      *   **B: Minimizing *ongoing* unearned advantage within the competition itself ('fair race'), focusing on access not starting points.** → **Position: Opportunity Equalizer (Fair Competition Focus)**
          *   *Most Awkward Commitment:* Taxing inheritance significantly to fund equal access (education, capital grants) but being relatively unconcerned about the *initial* unequal receipt after that access is secured. *(Resolves Family House: Taxed; Family Firm: Taxed; Trust: Taxed - proceeds fund access)*
      *   **C: The virtual elimination of *any* significant advantage derived solely from birth (no inherited advantage).** → **Position: Strong Egalitarian (Unnamed/Undefended Leaf)**
          *   *Most Awkward Commitment:* Requiring near-total confiscation of inherited wealth across generations for *all* but minimal personal gifts, making multi-generational family wealth accumulation practically impossible. *(Resolves Family House: Highly Taxed/Confiscated; Family Firm: Highly Taxed/Confiscated; Trust: Highly Taxed/Confiscated)*

  **Key Notes:**

  *   **Indistinguishable Positions:** The tree cannot distinguish between "Homestead Exception" (5B) and "Productive Agency Exception" (5A) based on *core principles alone*; they are structurally identical branches differing only in the *type of asset* granted special status. They represent the same *kind* of view ("Family Partiality Only Applies to Specific Asset Types") applied to different assets.
  *   **Empty Leaves & Why:**
      *   **Strong Egalitarian (7C):** Combines "Inherent wrong in receipt" with "Equal Opp requires no inherited advantage". While logically possible, it's largely undefended because it collapses into near-abolitionism (6A) in practice but arrives via a different path. Its distinctiveness is minimal and politically/ethically very unattractive to most.
      *   **Combination: "Family Not Special" + "No Wrong in Bequest/Receipt/Power" + "EO requires no inherited advantage":** Logically incoherent. You cannot simultaneously see *no wrong* in inheritance *and* demand equal opportunity requires *no inherited advantage*. This path doesn't exist.
      *   **Combination: "Family Special" + "Inherent Wrong in Bequest":** Highly unattractive/undefended. Granting special status to family transfers while believing the *act* of bequest itself is inherently wrong is contradictory. Path leads nowhere.
  *   **Test Case Resolution:** The tree cleanly separates the test cases:
      *   **Family House:** Protected only by Deflated Dynastic Power (4B), Homestead Exception (5B), and partially by Opportunity Equalizer (Fair Race - 4A) & Laissez-Faire (3).
      *   **Family Firm:** Protected only by Productive Agency Exception (5A) and Deflated Dynastic Power (4B - if not too powerful).
      *   **Trust:** Protected only by Laissez-Faire (3). All other positions tax/limit it significantly or confiscate it.
