  I need to ensure I cover all these areas systematically. The user is deep into their research, so they need a structured breakdown. Let me start by listing the main categories of desiderata. Normative scope is crucial—what norms must the framework explain? Probabilism, conditionalization, maybe others like the Principal Principle or Reflection. They might be concerned if diachronic norms can be derived without extra assumptions, which is a known challenge.

  Next, constraints on inaccuracy measures. Propriety and strict propriety are essential. The user probably knows the basics but needs the rationale for why these are non-negotiable. For example, strict propriety prevents self-sabotage and ensures coherent credences are optimal. They might be worried about measure dependence and whether different measures lead to conflicting norms.

  Philosophical burdens: Why is accuracy fundamental? The framework might treat it as primitive, but then it needs to address the value problem—why truth is valuable. Also, the direction of explanation: does accuracy-first get the order wrong, making norms derive from goals rather than intrinsic reasons? The user might be grappling with whether this commits to a form of epistemic consequentialism and its pitfalls.

  Objections are critical. The directionality objection is a big one. If norms are based on accuracy goals, does that conflate with pragmatic reasons? Diachronic objections involve needing extra assumptions like immodesty. The user needs to know which objections are fatal if unaddressed.

  Now, conflicts between desiderata. The big one is diachronic norms requiring immodesty, which ties back to strict propriety. But immodesty might be too demanding. Also, the value problem vs. primitivism—if they treat accuracy as a brute value, they might sidestep explaining why truth is valuable, but at the cost of depth. The user might need to choose here.

  The most exclusionary requirement? Probably strict propriety. Without it, you can't justify probabilism or conditionalization properly. Alternative measures like Brier score work, but others might not, limiting flexibility. This is a key pressure point.

  The user's deeper needs: They're about to commit months to this framework. They need to know the pitfalls and whether the accuracy-first program is tenable. They might be looking for justification to either proceed with confidence or pivot. Highlighting conflicts and the strict propriety requirement helps them assess viability. Also, understanding if they must address the value problem or can treat accuracy as primitive affects their chapter's scope. They might be avoiding biting certain bullets, so clarifying necessary commitments is essential.
answer: |-
  Here’s a rigorous breakdown of the core desiderata for any adequate accuracy-first program (AFP), framed as necessary conditions for success. These are derived from the internal logic of AFP, its foundational commitments, and the philosophical/epistemic phenomena it must capture to be viable. I flag tensions and the most exclusionary requirement.

  **Core Desiderata for an Adequate Accuracy-First Program:**

  1.  **Normative Scope: Recover Core Synchronic & Diachronic Norms**
      *   **What it must capture:** At minimum: **Probabilism** (rational credences are probabilistic) and **Conditionalization** (or a robust diachronic norm like Generalized Conditionalization or Plan Conditionalization). Arguably also: the **Principal Principle** (deference to chances), **Reflection** (deference to future selves), and norms of **Peer Disagreement**.
      *   **Why it's required:** AFP positions itself as a *foundational* framework for epistemic normativity. If it cannot ground the most widely accepted core norms governing rational belief formation and updating, it fails its primary explanatory task. Synchronic norms alone are insufficient; epistemic life is dynamic. *Failing here is existential for AFP*.
      *   **Tension Point:** Diachronic norms (especially Conditionalization) are significantly harder to recover than synchronic ones and often require stronger assumptions (see *Immodesty* below).

  2.  **Measure Constraints: Strictly Proper Inaccuracy Measures**
      *   **What it requires:** The inaccuracy measure (scoring rule) *must* be **strictly proper**. This means that for any probabilistic credence function *c*, the *expected inaccuracy* of *c* relative to *c itself* is strictly less than the expected inaccuracy of any other credence function *c'* relative to *c*: **E\__c[I(c, ω)] < E\__c[I(c', ω)]** for any *c'* ≠ *c*.
      *   **Why Propriety is non-negotiable:**
          *   **Anti-Double-Think:** Rational agents shouldn't believe their own credences are *expected* to be less accurate than some alternative. Improper rules allow this self-sabotage. Propriety ensures coherence between one's beliefs and one's assessment of accuracy expectations.
          *   **Vindication Connection:** Propriety links accuracy dominance arguments (see below) to coherent degrees of belief. Only probabilistic credences are immune to dominance *given a proper rule*.
      *   **Why *Strict* Propriety is non-negotiable:**
          *   **Uniqueness of Probabilism:** Only strict propriety guarantees that probabilistic credence functions are *uniquely* optimal relative to their own expectations. Weak propriety allows non-probabilistic functions to be equally good by their own lights, undermining the argument for probabilism.
          *   **Immodesty Requirement:** Strict propriety is essential for establishing the *immodesty* needed for diachronic arguments (e.g., Greaves & Wallace) – the rational agent *must* prefer their own credences *strictly* over alternatives by their own lights to justify updating plans.
      *   **Tension Point:** Strict propriety significantly constrains the choice of measures (Brier score is the canonical example). Arguments for why *only* strictly proper rules are admissible are crucial but sometimes contested. Does AFP risk measure-dependence?

  3.  **Accuracy Dominance Avoidance**
      *   **What it requires:** The framework must explain why rational credence functions are never **accuracy dominated**. A credence function *c* is dominated if there exists another credence function *c'* that is *at least as accurate* as *c* in every possible world and *strictly more accurate* in some possible world.
      *   **Why it's required:** This is the core *synchronic* argumentative engine of AFP (Joyce, Pettigrew). Being dominated is an unambiguous epistemic flaw – you could have been at least as accurate everywhere and more accurate somewhere, no matter how the world turns out. Recovering probabilism via dominance avoidance is a major success story. *Failing here destroys the core synchronic argument*.
      *   **Connection to Propriety:** For finite partitions, probabilism + strict propriety guarantees non-dominance. The dominance argument provides the *normative force*; propriety ensures the *right credences* are non-dominated.

  4.  **Fundamentality & Value Primacy: Accuracy as the Sole Fundamental Epistemic Good**
      *   **What it requires:** Accuracy (or inaccuracy minimization) must be posited as the **sole fundamental, intrinsic epistemic good**. All other putative epistemic goods (coherence, justification, understanding) must be shown to derive their epistemic value *instrumentally* or *constitutively* from their connection to accuracy.
      *   **Philosophical Burdens:**
          *   **Primitivism vs. Explanation:** AFP can plausibly treat the *epistemic value of accuracy itself* as a conceptual primitive ("truth is the aim of belief"). It *does not* need a *further* epistemic justification for why accuracy is valuable *epistemically*. However...
          *   **The Value Problem (Why Truth?):** AFP *does* take on the burden of explaining why *having accurate beliefs* is valuable *full stop* (or at least, valuable in the epistemic domain), rather than why truth is valuable *per se*. Its answer is typically instrumental: accuracy is instrumentally valuable for achieving practically any goal (e.g., survival, prediction, effective action - Goldman). *It successfully sidesteps the Meno problem (why true belief is better than false belief) by taking truth/accuracy as the constitutive aim.* The "value problem" it solves is showing how *all other epistemic norms* derive from this aim.
          *   **Distinguishing Epistemic/Pragmatic:** AFP must rigorously maintain that the norms derived are genuinely *epistemic*, stemming *only* from the intrinsic value of accuracy, not contingent pragmatic goals. This requires careful formulation to avoid conflating reasons (see Objection 1 below).
      *   **Why it's required:** This fundamentality is the defining feature of AFP. If other epistemic goods (e.g., coherence for its own sake, explanatory power) are *also* fundamental, AFP loses its unifying power and parsimony. *Failing here means it's not "accuracy-first" anymore*.

  5.  **Defusing Core Objections (Non-Negotiable Responses)**
      *   **Objection 1: Direction of Explanation / Conflation of Reasons**
          *   **Charge:** AFP gets the direction of fit wrong. Beliefs aren't rational *because* they promote accuracy; rather, accuracy is valuable *because* it tracks rational belief. Beliefs "aim at truth" constitutively; accuracy is the *standard* internal to belief, not an external goal. AFP risks conflating epistemic reasons with pragmatic/instrumental reasons for belief.
          *   **Required Response:** AFP must articulate a robust conception of *epistemic consequentialism* or *constitutive normativity*. It must argue that the "aim" of accuracy is constitutive of belief itself (Velleman, Wedgwood), making the instrumental derivation *internal* to the epistemic domain. It must show how the derived norms govern belief *as belief*, not merely as a tool for other ends. *Dismissing this objection is fatal*.
      *   **Objection 2: The Diachronic Challenge / Hidden Assumptions**
          *   **Charge:** Deriving diachronic norms (like Conditionalization) requires smuggling in extra, non-accuracy-based assumptions (e.g., *Immodesty* - the agent must be certain their updating rule is optimal; or *Deference* - to future credences/plans). The "best plan" arguments (Greaves & Wallace) seem to presuppose norms of rationality in defining what counts as a "plan" or how plans are evaluated.
          *   **Required Response:** AFP must either (a) provide a derivation of Conditionalization that genuinely relies *only* on synchronic accuracy considerations and the agent's evidence over time (a high bar), or (b) provide a compelling account of why the required extra assumptions (like Immodesty) are themselves grounded *only* in the accuracy-first framework (e.g., Immodesty as a consequence of strict propriety + the agent's current epistemic perspective). *Failing here leaves AFP unable to fully explain epistemic agency over time*.
      *   **Objection 3: The "Wrong Kind of Reasons" Problem**
          *   **Charge:** AFP generates the *wrong kind* of reasons for belief. Even if pursuing accuracy is the goal, the reason it gives for adopting a specific credence (e.g., "Believing P will make me more accurate") is a *state-given* reason, not a proper *object-given* reason (a reason grounded in the content of P itself, like evidence for P).
          *   **Required Response:** AFP must either deny the state/object-given distinction applies cleanly to credences, or argue that accuracy-based reasons *are* the correct epistemic object-given reasons for doxastic states (because the "object" of epistemic evaluation *is* the state's fit with reality). *Ignoring this risks severing epistemic rationality from evidence responsiveness*.

  **Key Tensions & The Most Exclusionary Requirement:**

  1.  **Diachronic Norms vs. Purely Synchronic Accuracy:** This is the most significant tension. Recovering robust diachronic norms **strictly requires the Immodesty assumption** (rational agents must expect their own credences/rules to be uniquely optimal). While Immodesty *can* be derived from strict propriety *given the agent's current credences*, it feels like a strong, potentially question-begging addition for diachronic justification. Alternatives (like evolving credences without a fixed plan) struggle to yield Conditionalization from accuracy alone. *This tension forces a choice: accept Immodesty as an accuracy-grounded necessary component of epistemic rationality (cost: feels like an extra commitment), or weaken the diachronic ambitions of AFP.*
  2.  **Value Primitivism vs. Explaining the Value of Accuracy:** Treating accuracy as a brute epistemic good is necessary for AFP's fundamentality claim. However, this leaves it potentially vulnerable to challenges about *why* epistemic value matters compared to other values, or why *this* particular value is fundamental. Explaining the value risks collapsing into pragmatism. *This tension forces a choice: embrace primitivism about epistemic value (cost: may seem unsatisfyingly thin), or risk undermining the purity of the epistemic domain.*
  3.  **Strict Propriety vs. Flexibility/Plausibility of Measures:** Insisting on strict propriety excludes otherwise plausible scoring rules (like the spherical rule, which is proper but not strictly proper). The justification for strictness (uniqueness, immodesty) is strong but hinges on accepting the dominance/expectation framework as the sole arbiter. *This tension forces a choice: accept the strict constraint (cost: limits measure choice, relies on dominance arguments), or weaken the framework's ability to uniquely justify probabilism and diachronic norms.*

  **The Most Exclusionary Requirement: Strict Propriety.**

  *   **Why it does the most work to exclude alternatives:** Strict propriety is the linchpin for **both** the core synchronic argument (uniqueness of non-dominated credences) **and** the derivation of diachronic norms (via immodesty). Without it:
      *   The argument for probabilism weakens significantly (non-probabilistic functions might be equally non-dominated or self-endorsed).
      *   The immodesty required for diachronic arguments evaporates (agents might rationally judge other credences/plans as equally good by their own lights).
  *   **Impact:** It decisively excludes any version of AFP that attempts to use weakly proper or improper scoring rules. It forces the adoption of measures like the Brier score and rejects alternatives that might seem attractive for other reasons (e.g., intuitive appeal, different mathematical properties). *This is the single point where the technical machinery imposes the strongest, non-negotiable constraint on the philosophical framework.* If you relax strict propriety, the core justifications for probabilism and conditionalization within AFP crumble.

  **Conclusion for Your Project:**

  Before committing, rigorously interrogate:

  1.  **Diachronic Justification:** Can you accept the Greaves & Wallace style "best plan" argument with its reliance on immodesty as sufficiently grounded *only* in accuracy + strict propriety? Is this derivation satisfying, or does it feel like it smuggles in rationality norms?
  2.  **Strict Propriety:** Are you convinced by the arguments that only strictly proper measures are admissible for the dominance/expectation framework? Is the reliance on dominance arguments itself secure?
  3.  **Value Primitive:** Are you comfortable treating the fundamental epistemic value of accuracy as a primitive, or does your project demand a deeper explanation of epistemic value that AFP doesn't provide?
  4.  **Objections:** Can you develop satisfactory responses to the Direction of Explanation and Wrong Kind of Reasons objections within an accuracy-first consequentialist framework?

  The pressure points are **diachronic norms requiring immodesty** (via strict propriety) and the **philosophical acceptability of epistemic consequentialism**. If these feel like insurmountable hurdles or philosophically unsatisfying foundations, the accuracy-first framework might not be the right home for your core argument. If you find the responses to these points convincing and the framework elegant and powerful, it offers a remarkably unified foundation. Good luck!
