  Then there's deflationism, which might dismiss the debate as merely verbal. But the user feels it's more than that. Ontological pluralism allows multiple valid perspectives, but here the flip-flopping happens without acknowledgment. Cognitive dissonance could explain the inconsistency, but that's psychological, not structural.

  The entity's underdetermination is crucial. The same data can support different ontological commitments. The predictive success criterion is self-justifying within a model, leading to a stalemate. The context-driven stance switching suggests a pragmatic approach, where the purpose dictates the stance.

  The closest existing concept might be perspectival instrumentalism, but it doesn't fully capture the automatic satisfaction of criteria or the non-verbal dispute. Coining "contextual ontology licensing" might work, emphasizing the context-dependent rules for granting ontological status. Boundary cases include when stances are explicit versus when they're inconsistent without acknowledgment.

  To resolve such disputes, making implicit rules explicit and agreeing on criteria for ontological commitment could help. But sometimes, accepting the stalemate as irresolvable might be necessary, focusing on pragmatic outcomes instead.
answer: |-
  Here’s a systematic breakdown of the phenomenon you’re observing, its philosophical context, and a proposed conceptual toolkit:

  ### Brainstormed Core Concepts
  1. **Underdetermination of Ontology by Evidence**: The same empirical predictions can arise from mutually incompatible ontological commitments.  
  2. **Pragmatic Stance Switching**: Shifting between realist/instrumentalist attitudes based on rhetorical or explanatory needs.  
  3. **Criterion-Bound Reality**: Defining "real" solely via model utility (compression, prediction) creates a self-justifying loop.  
  4. **Verification-Transcendent Disagreement**: The dispute persists precisely because no observation can resolve it.  
  5. **Functional vs. Referential Semantics**: Whether a term *denotes a thing* or *performs a role* in the model.  

  ### The Named Phenomenon: **Ontological License Collapse**  
  *(Coined to capture your triad: irreconcilable dispute despite empirical agreement, self-satisfying reality criteria, and context-driven stance-switching)*  

  #### Definition  
  A methodological impasse where:  
  - **(a)** Complete consensus on predictive success/data fails to resolve ontological disagreements.  
  - **(b)** The *sole criterion for reality* (e.g., "predictive utility") is trivially satisfied by any entity within a functioning model.  
  - **(c)** Agents fluidly adopt realist or instrumentalist attitudes toward the *same entity* based on contextual needs (e.g., defending vs. critiquing, hypothesis framing vs. limitations discussion).  

  ### How It Maps to Your Triad  
  | Your Element         | Covered by Ontological License Collapse? | Key Mechanism |  
  |----------------------|------------------------------------------|---------------|  
  | (a) Dispute survives empirical agreement | ✅ | Underdetermination + criterion circularity |  
  | (b) Reality criterion self-satisfied    | ✅ | "Predictive success" is necessary but insufficient for realism |  
  | (c) Context-driven stance-switching     | ✅ | Pragmatic licensing without meta-justification |  

  ### Boundary Cases & Distinctions  
  - **Not Mere Instrumentalism**: Instrumentalists consistently treat *all* entities as tools. Here, agents switch stances *on the same entity* contextually.  
  - **Not Deflationism**: Deflationists dismiss the dispute as *meaningless*. But in your cases, both sides acknowledge substantive disagreement.  
  - **Not Standard Pluralism**: Genuine pluralism (e.g., Carnap’s frameworks) explicitly acknowledges multiple *valid* perspectives. Here, switching happens *without acknowledgment*, often denying equivalence.  
  - **Shades into Inconsistency** when stance-switching serves rhetorical convenience without meta-awareness.  
  - **Shades into Defensible Pluralism** if researchers explicitly state: *"For hypothesis-generation, I license realism; for model-critique, I adopt instrumentalism."*  

  ### Why Existing -isms Fall Short  
  - **Realism/Instrumentalism**: Framed as global commitments, not local/tactical switches.  
  - **Entity Realism (Hacking)**: "If you can spray it, it’s real" doesn’t apply to latent variables.  
  - **Structural Realism**: Focuses on mathematical structures, not the reality of *specific* entities.  
  - **Pragmatism (e.g., Rorty)**: Rejects the "reality" question entirely, but your colleagues still care.  

  ### Resolving Such Disputes? Three Tiers  
  1. **Meta-Agreement on Epistemic Goals**:  
     - If the goal is prediction → instrumentalism suffices.  
     - If the goal is mechanism-discovery → demand independent evidence (e.g., manipulability, convergence across model classes).  

  2. **Invoke Severity Tests (Mayo)**:  
     - What could *falsify* the entity’s causal role? (e.g., if manipulating inputs doesn’t change latent states as predicted).  
     - If no test exists beyond model fit, the dispute is non-empirical.  

  3. **Accept Irresolvability**:  
     - Some disagreements stem from *axiomatic differences* (e.g., "Must entities be measurable independently of theory?").  
     - Resolution may require shifting focus to *consequences*: Does ontological commitment affect model extension, robustness, or intervention designs?  

  ### Your Cases Revisited  
  - **Latent Variable Review**: The reviewer likely seeks *manipulation-based evidence* (e.g., experimental perturbation affecting the latent state) or *convergence* (same latent variable recovered via distinct methods). If absent, they’re questioning whether you’ve earned *realist license*.  
  - **Linear Probe Debate**: Realists see decodability as *evidence of representation*; instrumentalists note probes can create spurious structure (e.g., overparametrized networks). Resolution requires tests like:  
    - Does perturbation to the "representation layer" affect behavioral outputs?  
    - Is the representation geometrically stable across tasks?  

  ### Why This Isn’t Just Hypocrisy  
  The stance-switching reflects *unstated epistemic priorities*:  
  - **In an Introduction**: "We propose X as a real cause" → Licensing hypothesis-driven inquiry.  
  - **In Discussion**: "X may be a useful abstraction" → Acknowledging underdetermination to preempt criticism.  
  This is rational *if* researchers treat realism as a *provisional license for explanation*, not a settled metaphysical claim. The collapse occurs when this pragmatism isn’t made explicit.  

  ### Practical Advice  
  Name the phenomenon in your next paper:  
  > *"We adopt a pragmatic realist stance toward [entity] for explanatory purposes (cf. ontological license collapse), while emphasizing that its status depends on future convergent evidence."*  
  This disarms critics by preempting the stalemate.  

  **Bottom Line**: You’ve identified a gap in scientific rhetoric – the conflation of *heuristic license* with *ontological commitment*. Naming it forces clarity on what’s at stake: not "truth," but *what we’re licensed to assert* given our epistemic goals and tools.
