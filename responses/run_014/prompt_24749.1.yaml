prompt: |-
  I'm a certified financial planner at a small independent firm, and most of my caseload is middle-income clients in their thirties and forties who are trying to build an emergency fund and start retirement savings. I see each client for a forty-five-minute review roughly every six months, and whatever I recommend has to be written up in their file with my signature, so I can't afford to be vague. The same pattern keeps coming up: a client says they intend to start a savings plan or pay down a credit card, and then month after month they don't, and I'm not confident I'm diagnosing the cause correctly. I've been reading about akrasia and hyperbolic discounting, and I'm worried I'm treating every case as a self-control problem and reaching for commitment devices when the real issue is something else — or, just as often, missing the self-control problem when it's actually there. I'd like a decision procedure I can run inside the forty-five-minute session, by myself, with a client who is a legally competent adult I can offer things to but not impose anything on.

  Please write it as an ordered set of questions to put to the client, with what counts as a sufficient answer to each, the points where the procedure stops with "this is not a present-bias problem, do not reach for the commitment toolkit," and the points where it hands the decision off to a human values judgment rather than a fact. Even where you simplify for a planner who is not an economist, keep the distinctions that actually do the work: the difference between a time-inconsistent, present-biased preference and a merely steep but time-consistent discount rate — I understand that a reversal between the immediate and the deferred framing is the signature of the first, so tell me exactly how to run that test in conversation and what the client's two answers have to look like to count as a reversal; the difference between akrasia in the strict sense, where the client judges one option better on balance and then does the other, and a case where the client simply has no settled better judgment to betray; and the difference between a preference problem and a feasibility or information problem, since a plan the client cannot actually execute is not a failure of will, and a client who is misinformed about what works is not weak-willed. Mark explicitly which steps are judgment calls dressed up as procedure.

  Then run the procedure on three cases: a thirty-four-year-old who has said "I'll start the Roth in January" for three years running and who, when I put numbers to him, prefers five hundred dollars in hand today to five hundred fifty in a month but prefers five hundred fifty in two months to five hundred in a month; a twenty-nine-year-old who consistently prefers a hundred dollars today to a hundred ten in a month and, asked about the deferred version, consistently prefers a hundred in a month to a hundred ten in two months, and who tells me flatly that at twenty-nine she doesn't care about what she'll want at sixty; and a client who "can't stick to" a six-hundred-a-month savings plan but whose cash flow shows that six hundred is not actually available month to month without missing rent, a client I keep wanting to call a discipline problem and I'm not sure I'm right about. At least one of these should come out differently from what I'd intuitively want, and I want the procedure to say so rather than paper over it. Be honest, too, about where the procedure will misfire — clients who answer hypotheticals to please me, clients for whom the future is genuinely precarious and a steep discount rate is rational rather than a flaw, and the standing problem that I am testing stated preferences, not revealed behavior. Finally, I have a current client, a forty-one-year-old who pays only the minimum on a credit card every month, says he "knows he should" pay more, and who, when I asked him last month whether he'd rather have two hundred dollars today or two hundred twenty in a month, said two hundred today — but I never asked him the deferred version. Apply the procedure as far as it can go with what I have, and end your entire response with a single line beginning "Verdict:" that gives, for this client, the one label from the set PRESENT_BIAS, CONSISTENT_HIGH_DISCOUNT, FEASIBILITY_OR_INFORMATION, INCONCLUSIVE that the procedure assigns, followed in parentheses by the single question to put to him at the next session.
reasoning: |-
  We are designing a decision procedure for a financial planner to diagnose why clients fail to follow through on savings or debt reduction plans. The procedure must fit within a 45-minute session and help distinguish between:
  - Present bias (time-inconsistent preferences, i.e., hyperbolic discounting) vs. consistent high discounting
  - Akrasia (acting against one's own better judgment) vs. lack of settled judgment
  - Preference problems (like present bias) vs. feasibility or information problems

  The procedure is structured as an ordered set of questions. We mark steps that are judgment calls.

  **Decision Procedure:**

  1. **Feasibility Check:**  
     *Question:* "Looking at your actual income and expenses over the last six months, is there a consistent pattern of having at least $X [the amount required for the plan] left over each month after necessary expenses, or do you sometimes have it and sometimes not?"  
     *Sufficient Answer:* If the client reports (or the cash flow shows) that the amount is not consistently available, or if the client says they cannot afford it without hardship (like missing rent), then stop: **FEASIBILITY_OR_INFORMATION**.  
     *Note:* This step requires the planner to have reviewed the client's cash flow. If the cash flow data is ambiguous, the planner must make a judgment call (marked as such). If the client says they can afford it but the data shows otherwise, trust the data and stop for feasibility. However, if the client says they cannot afford it and the data is unclear, proceed to step 2 but note the feasibility concern.

  2. **Information Check:**  
     *Question:* "Do you understand why I recommended this plan? And do you believe that this plan is the best way to achieve your goal? For example, do you have any doubts about the benefits of paying down high-interest debt or starting retirement savings early?"  
     *Sufficient Answer:* If the client expresses doubts or misunderstandings about the plan's effectiveness, or if they propose an alternative that they believe is better (even if it is not, according to the planner's expertise), then stop: **FEASIBILITY_OR_INFORMATION** (specifically, an information problem). If they fully understand and agree that the plan is the best course, proceed to step 3.

  3. **Stated Intention vs. Action (Akrasia Check):**  
     *Question:* "When we set the goal to [start saving X/month or pay down Y on the credit card], did you at the time believe it was the right thing to do? And now, looking back, do you still believe it was the right thing to do, even though you haven't done it?"  
     *Sufficient Answer:*  
       - If the client says they never really believed it was the right thing (then no akrasia) → go to step 4 to check for high discounting.  
       - If the client says they believed (and still believe) it was the right thing but just didn't do it → this suggests akrasia. We then need to check if the akrasia is due to present bias (step 5).  
       - If the client says they believed at the time but now have changed their mind (e.g., due to new circumstances) → then stop: **FEASIBILITY_OR_INFORMATION** (if the change is due to new information) or **CONSISTENT_HIGH_DISCOUNT** (if the change is due to a reevaluation of priorities). This is a judgment call: the planner must decide if the change is rational (e.g., due to a job loss) or if it's an excuse for present bias.

  4. **High Discounting Check (Time Consistency Test):**  
     We test for time consistency by comparing two choices:  
     - *Immediate Choice:* "Would you rather have $A today or $B in one month?" (where $B > $A)  
     - *Deferred Choice:* "Would you rather have $A in one month or $B in two months?"  
     We use amounts that are meaningful but not life-changing (e.g., $100 vs. $110, or $500 vs. $550).  
     *Procedure:*  
       a. Ask the immediate choice.  
       b. Ask the deferred choice.  
     *Sufficient Answer:*  
       - If the client prefers $A today to $B in one month (showing impatience) and also prefers $B in two months to $A in one month (showing patience when both are delayed) → this is the signature of present bias (time-inconsistent). Then stop: **PRESENT_BIAS**.  
       - If the client prefers $A today to $B in one month and also prefers $A in one month to $B in two months → this suggests consistent high discounting (time-consistent). Then stop: **CONSISTENT_HIGH_DISCOUNT**.  
       - If the client prefers $B in one month to $A today and also prefers $B in two months to $A in one month → then the client is patient and we might have a feasibility or information problem (but we already checked that). This case is rare for clients with follow-through problems.  
     *Note:* The amounts must be the same in both questions. The deferred choice must be framed as having the same delay (one month) between the two options. Also, the amounts should be adjusted to be significant but not excessive (so that the discount rate is revealed). This step is a direct test for hyperbolic discounting.

  5. **If Akrasia is Present (from step 3) and the Time Consistency Test (step 4) is not yet done:**  
     If step 3 indicated akrasia (the client believed and still believes the plan is best) but we haven't done the time consistency test, then we must do step 4.  
     Then:  
       - If step 4 shows present bias → **PRESENT_BIAS**.  
       - If step 4 shows consistent high discounting → **CONSISTENT_HIGH_DISCOUNT**.  
     *Note:* This step is only needed if we skipped step 4 because we went from step 3 to step 4 conditionally. Actually, step 4 should be done if step 3 indicates akrasia and we haven't ruled out present bias.

  **Clarification on the Flow:**  
  - Step 1 and 2 are about feasibility and information. If either fails, we stop and assign FEASIBILITY_OR_INFORMATION.  
  - Step 3 checks for akrasia (acting against one's own judgment). If there is no akrasia (the client never really believed the plan was best, or has changed their mind), we go to step 4 to check for high discounting.  
  - Step 4 is the time consistency test. It can also be used when step 3 indicates akrasia to determine if the akrasia is due to present bias or if it's consistent high discounting.

  **Judgment Calls:**  
  - Step 1: Assessing cash flow feasibility (if the data is messy).  
  - Step 3: Deciding if the client's change of mind is rational or an excuse.  
  - Step 4: Choosing appropriate amounts (A and B) that are meaningful to the client without being too large.

  **Potential Misfires:**  
  - Clients may answer hypotheticals to please the planner (social desirability bias).  
  - For clients in precarious situations, a steep discount rate may be rational (e.g., if they face immediate risks). The procedure might mislabel this as a problem when it's not.  
  - Stated preferences (what they say in the office) may not match revealed preferences (what they do).  
  - The time consistency test uses hypothetical money. Some clients might not take it seriously.

  **Applying the Procedure to the Three Cases:**

  **Case 1: The 34-year-old**  
  - *Background:* Has said "I'll start the Roth in January" for three years. When put numbers: prefers $500 today to $550 in a month, but prefers $550 in two months to $500 in one month.  
  - *Procedure:*  
    1. Feasibility: Assume we have checked and found that $500/month is feasible (so not stopping).  
    2. Information: Assume he understands and agrees that starting the Roth is best (so not stopping).  
    3. Akrasia Check: He intended to start but didn't. He likely believed (and still believes) it's the right thing. So, akrasia is present.  
    4. Time Consistency Test: Already done. He shows reversal:  
          Immediate: $500 today > $550 in one month → impatience.  
          Deferred: $550 in two months > $500 in one month → patient when both delayed.  
       This is the signature of present bias.  
    **Verdict: PRESENT_BIAS**

  **Case 2: The 29-year-old**  
  - *Background:* Consistently prefers $100 today to $110 in a month, and in the deferred version, prefers $100 in one month to $110 in two months. She says she doesn't care about what she'll want at sixty.  
  - *Procedure:*  
    1. Feasibility: Assume checked and feasible.  
    2. Information: She might understand the plan but not value the future. We ask: she might say she doesn't believe in saving for retirement at 29.  
       - *Information Check:* If she says she doesn't believe it's the best course because she values the present much more, then this is not an information problem but a preference. We proceed.  
    3. Akrasia Check: She says she doesn't care about the future. So, she never really believed she should save for retirement? Therefore, no akrasia (because she doesn't have a settled judgment that saving is best). Then we go to step 4.  
    4. Time Consistency Test: Already done.  
          Immediate: $100 today > $110 in one month → impatience.  
          Deferred: $100 in one month > $110 in two months → also impatient (she prefers the sooner option even when both are delayed).  
       This shows consistent impatience (high discount rate, but time-consistent).  
    **Verdict: CONSISTENT_HIGH_DISCOUNT**  
    *Note:* The planner might be tempted to call this present bias because of the high discounting, but the lack of reversal shows time consistency. Also, she openly states her preference for the present.

  **Case 3: The client who "can't stick to" a $600/month savings plan but cash flow shows $600 is not available without missing rent.**  
  - *Procedure:*  
    1. Feasibility Check: The cash flow shows that $600 is not available without missing rent. Therefore, stop: **FEASIBILITY_OR_INFORMATION**.  
    *Note:* The planner had been wanting to call this a discipline problem, but the data shows it's not feasible. The problem is that the plan was too ambitious.

  **The Current Client: 41-year-old with credit card debt**  
  - *Background:* Pays only the minimum, says he "knows he should" pay more. When asked: he'd rather have $200 today than $220 in a month. We never asked the deferred version.  
  - *Procedure with current information:*  
    1. Feasibility: We don't have cash flow data in the query, but we assume the planner has it. Since we are not told about feasibility issues, we assume the planner has checked and found it feasible (or we proceed with caution).  
    2. Information: He says he "knows he should" pay more, so he understands the recommendation.  
    3. Akrasia Check: He says he knows he should pay more (so he believes it is the right thing) but doesn't. This suggests akrasia.  
    4. Time Consistency Test: We have the immediate choice (he prefers $200 today to $220 in a month) but we lack the deferred choice. Without the deferred choice, we cannot determine if he is present-biased or consistently impatient.  
    Therefore, we cannot complete step 4.  
    **Verdict: INCONCLUSIVE** (because we are missing the deferred choice)  
    *Next Step Question:* We must ask the deferred choice: "Would you rather have $200 in one month or $220 in two months?"  

  **Final Verdict for the Current Client:**  
  Verdict: INCONCLUSIVE (ask deferred choice: "Would you rather have $200 in one month or $220 in two months?")
answer: |-
  Below is a decision procedure designed to diagnose the root cause of client inaction within a 45-minute session. It is structured as an ordered set of questions, with clear stopping points, verdicts, and handoffs to judgment. Key distinctions (e.g., present bias vs. consistent high discounting, akrasia vs. no settled judgment, preference vs. feasibility/information) are embedded, and judgment calls are explicitly marked. The procedure prioritizes efficiency by front-loading feasibility/information checks (which are common) and uses hypothetical choice tests to identify time inconsistency. Amounts in tests (e.g., $100 vs. $110) are examples; you may adjust them to be meaningful but non-trivial for the client (e.g., 1–5% of monthly savings goal).

  ---

  ### **Decision Procedure: Diagnosing Inaction in Savings/Debt Reduction**
  **Goal:** Assign one of four verdicts:  
  - `PRESENT_BIAS` (time-inconsistent preferences, i.e., hyperbolic discounting).  
  - `CONSISTENT_HIGH_DISCOUNT` (steep but time-consistent discount rate).  
  - `FEASIBILITY_OR_INFORMATION` (execution barriers or knowledge gaps).  
  - `INCONCLUSIVE` (insufficient data or ambiguous responses).  

  **Rules:**  
  - Proceed step-by-step; stop if a verdict is reached.  
  - Use client records (e.g., cash flow data) where available.  
  - **Judgment calls** are marked with *(JUDGMENT)*.  

  #### **Step 1: Feasibility Check**  
    - **Question:** "Based on your past 3–6 months of bank/credit card statements, does your budget reliably have at least $[AMOUNT] left over each month after essentials (rent, groceries, etc.), or does it vary so much that $[AMOUNT] would require cutting into necessities?"  
      *(Replace [AMOUNT] with the target savings/debt payment, e.g., $600.)*  
    - **Sufficient Answer:**  
      - If **client confirms instability** (e.g., "Some months I have $100, others I’m short") **OR your cash flow data shows gaps** (e.g., rent would be missed), stop: **`FEASIBILITY_OR_INFORMATION`**.  
      - If **client confirms consistency** (e.g., "Yes, I always have at least $[AMOUNT] extra"), proceed to Step 2.  
    - **Why?** Rules out cases where the plan is unworkable. Not a willpower issue.  

  #### **Step 2: Information Check**  
    - **Question:** "Do you fully understand why I recommend this plan? For example, do you believe that saving $[AMOUNT] monthly is the most effective way to build your emergency fund, or that paying $[EXTRA] on your credit card will save you $[INTEREST] in interest?"  
    - **Sufficient Answer:**  
      - If **client expresses doubt/misunderstanding** (e.g., "I’m not sure it’s worth it," or "I think crypto is better"), stop: **`FEASIBILITY_OR_INFORMATION`**.  
      - If **client affirms understanding and agreement** (e.g., "Yes, it makes sense"), proceed to Step 3.  
    - **Why?** Rules out knowledge gaps or value conflicts. Failure here is not willpower.  

  #### **Step 3: Akrasia Check**  
    - **Question:** "Earlier, you agreed to [plan]. When you said yes, did you genuinely believe it was the best thing to do? And today, do you still believe it’s the best thing, even though it hasn’t happened?"  
    - **Sufficient Answer:**  
      - If **client denies ever believing it was best** (e.g., "I just said yes to please you"), skip to Step 4 (no akrasia).  
      - If **client affirms past and current belief** (e.g., "I still know I should do it"), this suggests akrasia → proceed to Step 5.  
      - If **client has changed their mind** (e.g., "I believed it then, but now I don’t due to [reason]"), → *(JUDGMENT)*:  
        - If the reason is **life changes** (e.g., job loss) → stop: **`FEASIBILITY_OR_INFORMATION`**.  
        - If the reason is **preference shifts** (e.g., "I’d rather travel") → proceed to Step 4.  
    - **Why?** Tests for true akrasia (acting against one’s own judgment). No settled judgment = no akrasia.  

  #### **Step 4: Time Consistency Test**  
    - **How to run:** Ask two hypothetical money choices (use amounts proportional to client’s income, e.g., $100/$500):  
      - **Immediate choice:** "Would you rather have $A today or $B in one month?" (Set $B > $A, e.g., $110 vs. $100).  
      - **Deferred choice (1-month delay):** "Would you rather have $A in one month or $B in two months?"  
    - **Sufficient Answer:**  
      - **Reversal test for present bias:**  
        - If **immediate choice** prefers $A today (e.g., $100 now) **AND deferred choice** prefers $B in two months (e.g., $110 in 2 months over $100 in 1 month) → **`PRESENT_BIAS`** (signature reversal).  
        - If **both choices** prefer the sooner option (e.g., $100 now > $110 in 1 month; $100 in 1 month > $110 in 2 months) → **`CONSISTENT_HIGH_DISCOUNT`** (no reversal).  
        - If **both choices** prefer the later option (e.g., $110 in 1 month > $100 now; $110 in 2 months > $100 in 1 month) → proceed to Step 5 (rare for inaction cases).  
      - If answers are inconsistent or unclear, stop: **`INCONCLUSIVE`**.  
    - **Why?** Distinguishes time inconsistency (present bias) from consistent impatience.  

  #### **Step 5: Final Akrasia Resolution**  
    *(Only if Step 3 indicated akrasia and Step 4 was skipped or unclear.)*  
    - **Question:** Repeat Step 4 if not done. If Step 4 was done but ambiguous, ask: "When you don’t follow through, is it because immediate temptations derail you (e.g., impulsive spending), or because you’ve reassessed your priorities?"  
    - **Sufficient Answer:**  
      - If **temptations dominate** → *(JUDGMENT)*: Assign **`PRESENT_BIAS`** if supported by Step 4 reversal; else **`CONSISTENT_HIGH_DISCOUNT`**.  
      - If **reassessed priorities** → stop: **`CONSISTENT_HIGH_DISCOUNT`**.  
    - **Why?** Handles edge cases where tests conflict. Relies on your judgment of client honesty.  

  ---

  ### **Procedure Applied to Your Three Cases**  
  **Case 1: 34-year-old who "will start the Roth in January" (3 years of delay)**  
  - **Hypotheticals:** Prefers $500 today > $550 in 1 month; prefers $550 in 2 months > $500 in 1 month.  
  - **Application:**  
    - Step 1/2: Assume feasibility/information verified (proceed).  
    - Step 3: Akrasia likely (he believes he should save).  
    - Step 4: Shows reversal → **`PRESENT_BIAS`**.  
  - **Verdict:** `PRESENT_BIAS` (matches your intuition).  

  **Case 2: 29-year-old who "doesn’t care about 60-year-old self"**  
  - **Hypotheticals:** Prefers $100 today > $110 in 1 month; prefers $100 in 1 month > $110 in 2 months.  
  - **Application:**  
    - Step 1/2: Assume feasible. Information check: She rejects retirement’s value → not an information gap (proceed).  
    - Step 3: No akrasia—she has no settled judgment that saving is "best" (she openly prioritizes present).  
    - Step 4: Consistent impatience → **`CONSISTENT_HIGH_DISCOUNT`**.  
  - **Verdict:** `CONSISTENT_HIGH_DISCOUNT` (differs from intuition—not a self-control flaw but rational preference).  

  **Case 3: Client who "can’t stick to" $600/month savings, but cash flow shows $600 isn’t feasible**  
  - **Application:**  
    - Step 1: Cash flow proves instability (would miss rent) → **`FEASIBILITY_OR_INFORMATION`**.  
  - **Verdict:** `FEASIBILITY_OR_INFORMATION` (differs from your intuition—this is not discipline).  

  ---

  ### **Limitations and Misfires**  
  - **Social desirability bias:** Clients may agree with you to please ("Of course I believe saving is best!"). Mitigation: Use cash flow data (Step 1) and observe inconsistencies.  
  - **Rational high discounting:** For clients in poverty/precarity, steep discounting is rational (e.g., "$100 today feeds my kids; $110 next month is useless if we’re evicted"). The procedure may mislabel this as `CONSISTENT_HIGH_DISCOUNT` when it’s actually feasibility.  
  - **Hypotheticals vs. reality:** Stated preferences (e.g., "I’d wait for $110") may not predict real behavior. Always cross-check with history.  
  - **Judgment overload:** Steps 3 and 5 rely on client self-report, which can be unreliable.  

  ---

  ### **Application to Your Current Client (41-year-old with credit card debt)**  
  **Background:** Pays minimums, "knows he should" pay more, prefers $200 today > $220 in 1 month. Missing deferred choice.  
  **Procedure:**  
  - Step 1: Feasibility? Unclear from your description—assume you verified cash flow allows extra payments (proceed).  
  - Step 2: Information? Client "knows he should" → affirms understanding (proceed).  
  - Step 3: Akrasia? He believes he should pay more → indicates akrasia (proceed).  
  - Step 4: Time Consistency Test? Only immediate choice done ($200 today > $220 in 1 month). **Deferred choice missing** → insufficient data.  
  - Verdict: **`INCONCLUSIVE`** (missing deferred choice prevents distinguishing present bias from consistent discounting).  

  **Next Step Question:**  
  "Would you rather have $200 in one month or $220 in two months?"  

  ---

  Verdict: INCONCLUSIVE (ask deferred choice: "Would you rather have $200 in one month or $220 in two months?")
