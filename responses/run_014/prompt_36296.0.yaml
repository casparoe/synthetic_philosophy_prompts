prompt: |-
  So I'm a novelist, and my new book has gotten me into trouble with my writing group. The setup: a woman in her late fifties donates a kidney to a stranger she met on a donor-matching forum, and it quietly wrecks her relationship with her adult daughter, who thinks she chose a stranger over her own family. I intended her as an ordinary good person who did an extraordinary thing. But my writing group has spent three sessions fighting about her. The ex-lawyer in the group says donating is admirable but skipping it is fine, that's the whole point of calling something superogatory. The guy who reads a lot of Peter Singer says the "beyond the call of duty" talk is exactly how comfortable people let themselves off the hook, and that if the donation does more good than harm there's no coherent sense in which it's optional. And the one who did a philosophy BA keeps mumbling something about latitude and imperfect duties, that the act is good but nothing has a "call" attached to it in the first place. None of them can even agree what they're disagreeing about, and I suspect at least two of them hold the same view under different names.

  Here's what I want: a decision tree I can hand out at the next session, built so it sorts them (and me) by what we actually say about cases rather than which label we like the sound of. Start from the shared intuition that the kidney thing was good, then branch on the diagnostic questions where the positions genuinely come apart -- things like: is it blameworthy to decline? does the praiseworthiness depend on the act exceeding a duty, or could an act be praiseworthy while being merely permissible in every sense? is there a cost ceiling above which any duty cancels itself out (and is that a fact about morality or just about human psychology)? would we think differently if the surgery had a 5% death risk versus basically none? does it matter that she picked this stranger rather than responding to the most urgent need? The tree should be built from the logical space first and the named positions located in it after, not the other way around.

  Leaves I need, because someone at the table already holds each one: the classic view that supererogation is a real fourth category (optional, good, praiseworthy to do, blameless to omit), the Singer-ish denial that collapses it into duty, the Kantian latitude view where the space of duty is indeterminate and "beyond the call" just means "inside the wide duty's discretion," threshold views where cost limits obligation, and the splitter who thinks my kidney case and, say, a soldier jumping on a grenade are two different phenomena that the single label glues together wrongly. If you think there's a view that says the whole fourth category is a moral illusion -- duties, permissions, and excuses, nothing else -- include that too. And flag explicitly any two leaves the case questions can't actually pull apart, because I'd rather know my tree is blunt in places than discover it mid-argument.

  Test every branch on three cases from the book so it stays concrete: the kidney, the grenade (a backstory event), and a moment where my character walks past a panhandler because she's late for a dialysis visit -- I want to know whether anyone's position forces them to say walking past was wrong. Keep the node questions in plain english, answerable by someone who's never read a page of ethics. And wherever a branch turns on something genuinely contested rather than settled -- like whether praiseworthiness requires supererogation or just requires effort or sacrifice -- say so at the node, don't bury it.
reasoning: |-
  Okay, let's tackle this. The user is a novelist whose writing group is deeply divided over the moral implications of a character donating a kidney to a stranger. The group members have different philosophical backgrounds—ex-lawyer, Peter Singer enthusiast, philosophy BA—and they're arguing about whether the act is supererogatory, a duty, or something else entirely. The novelist wants a decision tree that sorts these views based on responses to specific case questions, not just labels. 

  First, I need to understand the core issue. The main character's act is good, but the daughter feels neglected. The disagreement revolves around moral categories: is donating beyond duty, or is it obligatory? The user mentioned several positions: classic supererogation, Singer's collapse into duty, Kantian latitude, threshold deontology, and the splitter view separating different acts. 

  The user wants concrete cases: kidney donation, grenade sacrifice, and ignoring a panhandler. The decision tree must use plain English questions to avoid jargon. Key diagnostic questions include blameworthiness for declining, praiseworthiness dependence on exceeding duty, cost ceilings, risk levels, and urgency of need. 

  Starting with shared intuition: the kidney donation was good. The first branch should address whether declining is blameworthy. If yes, that leans toward Singer's view (no supererogation, it's a duty). If not, then move to whether the act is praiseworthy because it exceeds duty (classic supererogation) or if it's just permissible (Kantian latitude). 

  Next, consider cost. If risk increases, does it become supererogatory? Threshold deontology would say yes, while others might not. For the panhandler case, if walking past is permissible even when urgent, that might align with latitude or Singer if no cost is involved. 

  The splitter view needs a separate branch where kidney donation and grenade jumping are different. Grenade sacrifice might be seen as heroic, while kidney is charitable but less extreme. 

  Also, flag where positions overlap. For example, Kantian latitude and threshold might both allow skipping donation under high cost, but for different reasons. The tree should highlight these nuances. 

  Ensuring each end leaf matches a group member's stance. Testing each case against the leaves to ensure consistency. The panhandler case is crucial—if a position forces labeling walking past as wrong, that's a red flag for the user. 

  Need to avoid jargon, use everyday language in questions. Explicitly note contested points, like whether praiseworthiness requires sacrifice or just effort. Finally, map the leaves to the named positions after building the logical structure. This should help the group see where they agree or disagree beyond labels.
answer: |-
  Here's a decision tree designed to cut through the label confusion and map the logical space of your group's disagreements. It uses your three concrete cases (Kidney, Grenade, Panhandler) and focuses on diagnostic questions answerable without technical jargon. **Contested Premises** are flagged at nodes.

  **Shared Starting Point:** We all agree the Kidney Donation was *good*.

  ---

  ### Decision Tree: Mapping Views on "Beyond Duty"

  1.  **Is it morally BLAMEWORTHY for the mother to have DECLINED to donate the kidney?**
      *   **YES** → Go to Branch A (Duty-Collapsers)
      *   **NO** (It was fine for her to decline) → Go to Question 2

  2.  **Is the Kidney Donation PRAISEWORTHY primarily BECAUSE it went BEYOND what was morally required (duty)?**
      *   **YES** → Go to Branch B (Classic Supererogation)
      *   **NO** (It's praiseworthy, but NOT because it exceeded a duty) → Go to Question 3
      *   **UNSURE / IT'S COMPLICATED** → Go to Question 3

  3.  ***(Contested Premise: What makes acts praiseworthy? Sacrifice? Effort? Motive?)* When someone does something clearly good:**
      *   **It's ALWAYS praiseworthy IF it involves significant sacrifice/effort, REGARDLESS of "duty".** → Go to Branch C (Praise ≠ Duty-Exceeding)
      *   **Praiseworthiness DEPENDS on the context of obligation. Some good acts are just "neutral" or baseline.** → Go to Question 4

  4.  **Does morality give us FLEXIBILITY ("latitude") in HOW we fulfill certain broad duties (like helping others), meaning many specific good acts (like donating *this* kidney) aren't strictly *required*, just part of fulfilling the broader duty?**
      *   **YES** → Go to Branch D (Kantian Latitude / Imperfect Duties)
      *   **NO** (The duty is more specific, or this flexibility isn't the core issue here) → Go to Question 5

  5.  **Does the COST or RISK to the agent fundamentally change whether an act is obligatory? (e.g., Is there a point where the cost *cancels* any duty to help?)**
      *   **YES, STRONGLY** (Cost/Risk sets a clear limit on obligation) → Go to Branch E (Threshold Deontology)
      *   **NO, or ONLY WEAKLY** (Cost affects praiseworthiness/feasibility, not the *existence* of the duty) → Go to Question 6
      *   **UNSURE / IT'S CONTEXTUAL** → Go to Branch F (The Splitter)

  6.  **Is the key difference between the Kidney Donation and the Grenade Jump that one involves SACRIFICING LIFE/SAVING LIFE DIRECTLY while the other is a SIGNIFICANT BUT SURVIVABLE SACRIFICE for a LESS DIRECT/URGENT GOOD?**
      *   **YES, THIS IS A FUNDAMENTAL MORAL DISTINCTION** → Go to Branch F (The Splitter)
      *   **NO, THEY ARE THE SAME KIND OF PHENOMENON (just different degrees)** → Go to Branch B (Classic Supererogation) *or* Branch G (Moral Illusion) - *Needs further distinction via other answers.*

  ---

  ### The Branches (Leaves)

  *   **Branch A: The Duty-Collapser (Singer-ish)**
      *   **Core Belief:** If an act does significantly more good than harm *and* is feasible, it's morally required (a duty). Declining is blameworthy (to some degree).
      *   **Kidney:** Donating was likely a duty (unless harm >> good). Declining *could* be blameworthy.
      *   **Grenade:** Jumping *might* be a duty if it saves multiple lives (cost to agent is high, but net good is immense). Not jumping *could* be blameworthy.
      *   **Panhandler:** Walking past *is* wrong if giving $5 causes trivial harm (being late) vs. significant good (relieving hunger). It fails the "do more good than harm" test when feasible.
      *   **View on Supererogation:** An illusion. Only Duties, Permissions (for neutral/trivial acts), and Excuses (for failing duties due to incapacity/etc.) exist.

  *   **Branch B: Classic Supererogation**
      *   **Core Belief:** Supererogation is a distinct, fourth category: Optional, Good, Praiseworthy to Do, Blameless to Omit. It genuinely exceeds duty.
      *   **Kidney:** Supererogatory. Good, praiseworthy, but blameless to omit.
      *   **Grenade:** Supererogatory (Paradigm example). Heroic, beyond duty.
      *   **Panhandler:** Giving $5 is likely *also* supererogatory, or perhaps merely permissible. Walking past is blameless. (*Contested within this view: How costly must an act be to be supererogatory vs. just good?*)
      *   **View on Supererogation:** Real and essential.

  *   **Branch C: Praise ≠ Duty-Exceeding**
      *   **Core Belief:** Acts can be both *permissible* (blameless to omit) AND *praiseworthy* to perform. Praiseworthiness stems from sacrifice, effort, or virtue displayed, **not** from exceeding a duty. "Duty" might be minimal or the act might fall under broad "permissions".
      *   **Kidney:** Permissible to omit, praiseworthy to do (due to sacrifice/virtue).
      *   **Grenade:** Permissible to omit, highly praiseworthy to do (due to supreme sacrifice).
      *   **Panhandler:** Giving $5 is permissible and mildly praiseworthy (effort/virtue). Walking past is permissible and not blameworthy, but also not praiseworthy.
      *   **View on Supererogation:** The *label* might be unnecessary or misleading. The key separation is between blameworthiness and praiseworthiness, not duty vs. beyond-duty.

  *   **Branch D: Kantian Latitude (Imperfect Duties)**
      *   **Core Belief:** We have broad "imperfect" duties (e.g., to help others). We have significant discretion (latitude) in *how*, *when*, and *towards whom* we fulfill them. Fulfilling them in a demanding way (Kidney) is good and praiseworthy, but not *required* in that specific instance. Omitting *a specific opportunity* (like donating *this* kidney) is blameless *as long as* we are generally fulfilling the broader duty.
      *   **Kidney:** A praiseworthy way to fulfill the imperfect duty of beneficence. Omitting *this specific act* is blameless (she fulfills her duty in other ways).
      *   **Grenade:** Arguably beyond the call of *any* imperfect duty due to extreme cost – potentially supererogatory (Branch B) or a different category (Branch F).
      *   **Panhandler:** Walking past is blameless *if* she generally helps others (e.g., donating a kidney!). She has latitude in choosing *when* to act on her duty to help.
      *   **View on Supererogation:** "Beyond the call" often just means exercising the discretion within a wide duty exceptionally well. True supererogation *might* exist for acts outside any duty's scope (like the Grenade?).

  *   **Branch E: Threshold Deontology**
      *   **Core Belief:** We have duties to help/not harm, but these duties have thresholds. If the personal cost/risk exceeds a certain level, the duty is canceled or overridden. Acts beyond that threshold are supererogatory.
      *   **Kidney (Low Risk):** Likely *a duty* (cost below threshold). Donating is obligatory, declining *could* be blameworthy. (*Differs significantly from others!*)
      *   **Kidney (5% Death Risk):** Cost exceeds threshold → Supererogatory (Blameless to omit, praiseworthy to do).
      *   **Grenade:** Far beyond threshold → Clearly supererogatory.
      *   **Panhandler:** Cost (being late) is trivial → Giving $5 is likely *a duty*. Walking past *is wrong/blameworthy*.
      *   **View on Supererogation:** Real, defined by cost exceeding the obligation threshold.

  *   **Branch F: The Splitter**
      *   **Core Belief:** "Supererogation" glues together fundamentally different acts. Typical distinctions: **Heroism** (extreme sacrifice, often life-for-life, like Grenade) vs. **Significant Beneficence** (major but survivable sacrifice for lesser/diffuse good, like Kidney). Each might have different moral structures.
      *   **Kidney:** Significant Beneficence - Likely blameless to omit, praiseworthy to do. May or may not exceed a duty (depends on other views - could align with B, C, or D).
      *   **Grenade:** Heroism - Exists in a different category, perhaps always optional and supremely praiseworthy, involving a sacrifice so great it transcends ordinary duty structures.
      *   **Panhandler:** Minor Beneficence - Likely blameless to omit (permissible), mildly praiseworthy to do. Not comparable to Kidney or Grenade.
      *   **View on Supererogation:** A misleading umbrella term. Needs splitting.

  *   **Branch G: Moral Illusion (Optional)**
      *   **Core Belief:** There are only three categories: 1. **Duties** (Required, blameworthy to omit), 2. **Permissions** (Neutral or good-but-not-required, blameless to do/omit), 3. **Excuses** (Reasons blamelessly *failing* a duty). "Praiseworthy permissions" are just that - permissible acts we happen to admire. There is no "beyond duty".
      *   **Kidney:** A permissible act. Admirable? Perhaps. But omitting it is simply permissible, not a failure. No "supererogation".
      *   **Grenade:** Also merely permissible. Extremely admirable, but not "beyond duty" because there was no duty to jump in the first place.
      *   **Panhandler:** Walking past is permissible. Giving $5 is permissible.
      *   **View on Supererogation:** An illusion. Confuses permissible acts we praise with a non-existent fourth category.

  ---

  **Where the Tree Might Be Blunt / Hard to Distinguish:**

  1.  **Branch C (Praise ≠ Duty-Exceeding) vs. Branch D (Kantian Latitude):** These can feel very similar in many cases, especially the Kidney and Panhandler. The key difference is theoretical: C downplays the *concept* of duty exceeding for praise, while D grounds the blameless omission in the structure of the duty itself (its wideness). They might give identical answers on cases.
  2.  **Branch B (Classic) vs. Branch F (Splitter) on Kidney:** If the Splitter views Kidney as "merely" Significant Beneficence falling under classic supererogation, they end up in the same leaf as Branch B for that case. The Grenade case is key to pulling them apart.
  3.  **Branch D (Latitude) vs. Branch B (Classic):** For acts seen as clearly *within* the discretion of an imperfect duty (D), Branch B might still call them supererogatory if they seem particularly demanding. The line between "fulfilling a wide duty well" and "exceeding duty" is fuzzy.

  **How to Use It:**

  1.  **Individually:** Have each group member (including you) walk through the tree *for each of the three cases separately*. Note their path/leaf for each case.
  2.  **Compare:** See where people land for each case. Do they consistently land on one branch across cases? Or do they bounce around (suggesting their view is complex or inconsistent)? Do people who argued vehemently end up on the same branch?
  3.  **Focus Disagreement:** The nodes where answers diverge pinpoint the *exact* philosophical sticking points (e.g., "We all agree omitting the kidney was blameless, but we disagree on WHY it was blameless and whether its praiseworthiness depends on exceeding duty").
  4.  **Flag Contested Premises:** When hitting a "Contested Premise" node, explicitly discuss *that* underlying disagreement (e.g., "What *is* the source of praiseworthiness?").

  This tree forces articulation of intuitions on concrete scenarios, bypassing initial jargon. It will reveal whether disagreements are fundamental or semantic, and pinpoint the exact nodes of contention within the rich logical space surrounding supererogation. Good luck with the session!
