  Hmm, I see where the user is stuck. They're intuitively thinking relational properties must distinguish the spheres, but Black's setup is sneakier than that. The key is that in a symmetric universe, all relations are reciprocal - each sphere has the property "1 meter away from another sphere" identically. 

