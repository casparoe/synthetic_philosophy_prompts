  Hmm... their five sticking points reveal sophisticated layman's reasoning: 
  First, the institutional identity question - can a council that's shed all its human components still bear responsibility? 
  Second, the tricky metaphysics of apologising to ghosts versus living descendants. 
  Third, that compensation paradox where both sides have moral logic. 
  Fourth, the historical relativism trap - judging past decisions by present standards. 
  And fifth, the user's own valid suspicion of empty ceremonialism. 

  Right, they've explicitly rejected glib "healing" narratives - good. This demands proper political philosophy, not therapy-speak. Need to consider Margaret Gilbert on collective responsibility, Hannah Arendt on the banality of bureaucratic evil, and maybe Avishai Margalit's ethics of memory. The apology-as-transaction worry echoes Derrida's point about forgiveness becoming calculation. 

  For framing... must avoid two traps: either reducing this to modern performance politics or freezing history in amber. The council as persistent moral agent seems key - like a university apologizing for historical slavery despite turnover. The living descendants aren't claimants but witnesses to broken continuity. 

  Ah! The material gesture impasse... could reframe it not as payment but as reknitting torn social fabric. A memorial isn't "settling accounts" if it's participatory - say a community archive where elders tell stories to schoolkids. That sidesteps the commodification fear. 

  On the councillor's relativism objection... important to distinguish condemning individuals versus critiquing institutional patterns. The 1968 actors may have been procedurally correct but the outcome revealed systemic flaws - like valuing "fitness for habitation" over community cohesion. 

  User's emptiness fear is the sharpest challenge. Counter by designing apology as process not event: tie it to planning reforms where "community harm assessments" become mandatory for future projects. That makes it costly in accountability terms. 

  For the memo draft... must balance philosophical rigor with bus-inspector clarity. Lead with the council-as-enduring-entity principle, position descendants as rightful witnesses, propose plaque plus oral history fund but explicitly reject compensation logic, and include the relativist objection verbatim before rebutting. 

