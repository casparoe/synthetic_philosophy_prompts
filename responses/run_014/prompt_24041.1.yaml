prompt: |-
  I'm a PhD student in philosophy of mind and I'm TA-ing for an intro philosophy of mind section next week. I have to get heterophenomenology across to first-years in a single 50-minute slot — Dennett's idea that you study consciousness by taking the subject's own reports at face value as third-person data, which is already a mouthful for people who've never seen the term. I don't want the explanation spelled out for me, I want a plan how to teach it. Specifically: what has to be in place before the term can mean anything to them and in what order (I'm guessing its the first-person/third-person gap, but I'm not sure of the dependencies, i.e. what has to click before what), what single example should carry the whole thing and what it needs to have and lack, the misconceptions they're going to walk in with or form as we go (I'm worried the big one is "this is just asking people what they feel, which is introspection, which we already know is unreliable") and exactly where in the sequence each one should be defused, one question I can ask at the end to tell whether the idea actually landed, and what I should explicitly leave out at this level and say so. Keep the whole thing under 500 words.
reasoning: |-
  Okay, the user is a PhD student in philosophy of mind preparing to teach intro students about Dennett's heterophenomenology in a 50-minute session. They need a structured plan that builds understanding step by step. 

  First, I need to unpack what they're really asking for. They don't want content explained to them - they already know it. They want pedagogical strategy: sequencing, misconceptions to avoid, and assessment. Their hidden worry seems to be about students confusing this with unreliable introspection. 

  The key dependencies are clear: students must first grasp the first/third-person gap before anything else. Without that foundation, heterophenomenology just looks like fancy survey-taking. The zombie thought experiment serves as the perfect anchor here - it makes the explanatory gap visceral. 

  I'm noting their concern about the "this is just introspection" misconception. That needs early defusing by contrasting objective recording vs subjective interpretation. The courtroom analogy helps here - we're treating reports as evidence, not truth. 

  For the single carrying example, the inverted spectrum works best. It demonstrates how heterophenomenology handles private experience without accessing it directly. The colorblind comparison makes it concrete for beginners. 

  Assessment is tricky with novices. I'll suggest asking them to contrast heterophenomenology with traditional introspection - if they can articulate the "evidence vs revelation" distinction, we've succeeded. 

  Must explicitly omit the qualia debate and intentional stance today. Those would derail the core concept. "We're just focusing on the method" keeps us on track. 

  Timing is tight: 5min setup, 20min gap/zombie, 15min heterophenomenology mechanics, 5min inverted spectrum, 5min Q&A. Any deeper would sacrifice clarity. 

  The user's clearly done their prep - they're asking precisely the right pedagogical questions. My response should match that precision while staying executable for first-years.
answer: |-
  Here's a concise 50-minute lesson plan focusing on conceptual dependencies, a core example, misconception handling, and assessment:

  **Pre-Requisites & Order (25 mins):**
  1.  **(5 min) The Gap:** Start with the *explanatory gap*. Ask: "How can my *subjective* feeling of red (show image) be explained by objective brain states?" Highlight the fundamental divide between 1st-person (what it's *like*) and 3rd-person (objective data, behavior, brain scans).
  2.  **(10 min) The Zombie Problem:** Introduce the *philosophical zombie* (P-Zombie) as a thought experiment: "Imagine something physically identical to you, behaving exactly like you, but with no inner experience." Emphasize: *Behavior alone doesn't guarantee consciousness*. This forces the problem: "How can we *study* something private?"
  3.  **(10 min) Introspection's Limits:** Briefly critique traditional introspection: "If I ask you 'What's it like to see red?', your answer is a *report*, filtered by language, bias, memory, and self-interpretation. It's not a direct pipeline to raw experience. We know introspection can be unreliable." *(Defuses "just asking" misconception early)*

  **Introducing Heterophenomenology (20 mins):**
  4.  **(5 min) Dennett's Move:** "Dennett says: STOP trying to *access* the private experience directly. Treat the subject's *verbal reports and behaviors* as **objective data points** – like a scientist studying any other natural phenomenon."
  5.  **(10 min) Core Analogy: The Courtroom:** "Think of the subject as a *witness* giving testimony. The heterophenomenologist is the *neutral investigator*. We take the testimony *at face value* as *what the witness sincerely believes and reports about their experience*. This testimony is our **third-person data** ('Subject S reports feeling X'). We don't assume it perfectly *matches* some inner movie, but it's the crucial evidence we *can* access scientifically." *(Clarifies "taking reports seriously ≠ accessing the experience itself")*
  6.  **(5 min) The Method:** "Heterophenomenology builds the subject's 'belief world' from their reports + behavior. We explain *why they say/believe* they have experience X, using 3rd-person tools (neuroscience, psychology, evolution)."

  **Carrying Example: The Inverted Spectrum (Throughout)**
  *   **What it has:** Private, subjective experience (colors flipped), identical behavior/reports ("that's red").
  *   **What it lacks:** Any objective test to confirm the inversion.
  *   **Use:** After introducing the gap (illustrates privacy), after zombies (identical behavior ≠ identical experience), during heterophenomenology ("We take 'that's red' reports at face value as data, explaining *why* they say that, *without* claiming access to their actual color qualia").

  **Key Misconception Defused:**
  *   **"This is just unreliable introspection!"** Defused in Step 3 (highlighting introspection's flaws) and reframed in Step 5 (treating reports as *data*, not revelation). Contrast: Introspection tries to *access* the private; Heterophenomenology treats *reports about* the private as public data.

  **Assessment Question (End, 2 min):**
  *   **"How does heterophenomenology try to solve the problem of studying private conscious experience without relying on problematic introspection?"**  
      *   *Look for:* "Treats reports/behavior as objective data," "Builds a model of the subject's beliefs," "Uses 3rd-person methods to explain *why* they report X," "Doesn't assume reports directly mirror hidden qualia."

  **Explicitly Omit (State Clearly):**
  *   "We're focusing *only* on the core method today. We're *not* diving into Dennett's deeper views denying qualia ('Qualia? What Qualia?') or the Intentional Stance. This is about the *tool* he proposes for getting started scientifically."

  **Timing Summary:**
  *   Gap + Zombie + Introspection Critique: 25 min
  *   Heterophenomenology Intro + Courtroom Analogy + Method: 20 min
  *   Assessment Q & Omissions: 5 min

  This sequence builds logically: Problem (Gap/Zombie) → Failure of Traditional Approach (Introspection) → New Method (Heterophenology as Data Collection) → Core Analogy (Courtroom). The Inverted Spectrum weaves through as the concrete anchor. The early critique of introspection preempts the major misconception.
