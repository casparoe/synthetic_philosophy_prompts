prompt: |-
  I cover science and ideas for a magazine, and I'm writing a profile of a historian who sorts historical works into "Whig" history — writing the past as a progressive path toward the present — and "contextual" history. I've tracked her calls on recent works: Whig, a history of the English Reformation cast as the essential first step toward modern religious liberty and parliamentary sovereignty, scolding the medieval clergy for their superstition; Whig, a history of 19th-century cholera that presents the outbreaks as the catalyst that inevitably produced modern public health, dismissing the contemporary folk remedies as ignorant; Whig, a history of the printing press treated as the cause of the Reformation and the Enlightenment, mocking the scribes as backward. Contextual, a history of the 1918 influenza that records the mortality and the varied local responses without ranking them by their contribution to later medicine or judging the responders by our standards; and contextual, a history of an 18th-century textile mill that stays with the workers' daily experience, does not treat the mill as a stepping stone to the factory system, and does not grade the workers' choices by modern efficiency. A new book has just come out: a history of 20th-century architecture that devotes most of its space to the buildings still standing and celebrated today, describing each in its own time and in the terms of its own period, without claiming that architecture "progressed" toward them and without judging them by today's aesthetic. Please give me exactly five numbered items, each a sentence or two, with no introduction or conclusion: (1) the rule she is most plausibly running and why; (2) the strongest alternative rule that fits her track record just as well; (3) her predicted verdict on the new book under your best-guess rule; (4) the verdict the new book would receive under the alternative rule; and (5) a further historical narrative that would cleanly separate the two rules.
reasoning: |-
  Okay, the user is a science and ideas writer for a magazine profiling a historian who categorizes historical works into "Whig" and "contextual" history. They've provided several examples: 

  - Whig histories include the English Reformation as a step toward modern religious liberty (mocking medieval clergy), cholera outbreaks as inevitably leading to modern public health (dismissing folk remedies), and the printing press causing the Reformation/Enlightenment (mocking scribes).  
  - Contextual histories include the 1918 flu focusing on local responses without modern judgment, and an 18th-century textile mill examining workers' daily lives without framing it as progress toward factories.  

  A new architecture history book focuses on surviving celebrated buildings, describing them in their own terms without claiming progress or judging by today's aesthetics.  

  The user wants exactly five numbered items:  
  1) The historian's most plausible rule and why.  
  2) The strongest alternative rule fitting the track record.  
  3) Predicted verdict on the new book under the primary rule.  
  4) Verdict under the alternative rule.  
  5) A historical narrative that would cleanly separate the two rules.  

  First, analyzing the patterns:  
  - Whig works explicitly judge the past through present values (e.g., "superstition," "ignorant," "backward") and frame history as inevitable progress toward modernity.  
  - Contextual works avoid present-centered judgment, focusing on contemporary perspectives and avoiding teleology.  

  The core distinction is teleological framing + presentist judgment (Whig) vs. anti-teleological immersion + contemporary relativism (contextual).  

  For item 1: The primary rule is likely "Rejects narratives framing history as inevitable progress toward the present and avoids judging past actors by modern standards." This fits all examples—Whig works do both, contextual works avoid both.  

  For item 2: The strongest alternative is "Rejects explicit moral/cognitive judgment of past actors by modern standards, regardless of progress framing." This fits because all Whig examples include derogatory judgments, while contextual/new book avoid them. However, the cholera history (Whig) has progress framing but if it lacked mockery, this rule might misclassify it.  

  For item 3: Under the primary rule, the new book avoids progress claims and modern judgment—so "Contextual."  

  For item 4: Under the alternative rule, the new book also avoids judgment—so "Contextual." But this shows the alternative is weaker since it doesn't catch progress framing alone.  

  For item 5: Need a narrative that is Whig by the primary rule but contextual by the alternative. Example: A history of early automobiles framing them as inevitable steps toward modern cars but describing contemporary enthusiasm neutrally, without mocking early designs. This would be Whig under primary rule (teleology) but contextual under alternative (no judgment).  

  Refining: The alternative rule's flaw is it wouldn't flag progress-focused histories without mockery as Whig. The primary rule is stricter about anti-teleology.  

  Finalizing:  
  1. Primary rule focuses on rejecting both teleology and presentism.  
  2. Alternative rule focuses only on rejecting presentist judgment.  
  3. New book is contextual under primary rule.  
  4. New book is contextual under alternative rule too (since no judgment).  
  5. Counterexample: A teleological but judgment-free history would separate the rules.
answer: |-
  Here are the five numbered items as requested:  

  1. The rule she is most plausibly running is: "Classify as Whig any history that frames the past as teleologically progressing toward the present or judges past actors by anachronistic modern standards, and as contextual any history that avoids present-centered teleology and evaluates the past on its own terms." This fits because all cited Whig works impose progress narratives and moral/cognitive judgment (e.g., mocking "superstition"), while contextual works reject both.  

  2. The strongest alternative rule is: "Classify as Whig any history that explicitly ranks past events or agents by their contribution to present outcomes or overtly condemns them using modern values, and as contextual any work that refrains from such explicit hierarchical judgments." This equally fits her track record, as the Whig examples all include derogatory assessments (e.g., "ignorant" remedies), while contextual works omit them.  

  3. Under the best-guess rule (1), her predicted verdict on the new architecture book is **contextual** because it avoids framing architecture as "progressing" toward present celebrated buildings and refrains from judging past designs by today’s aesthetics, instead emphasizing each era’s own context.  

  4. Under the alternative rule (2), the new book would also be **contextual** because it lacks explicit judgment or ranking of past architects by modern standards, focusing neutrally on surviving buildings in their historical terms without condemnation.  

  5. A narrative separating the rules would be: "A history of 18th-century naval warfare that frames technological innovations as inevitable steps toward modern naval dominance but describes contemporary tactics and failures neutrally, without mocking past strategies." Rule 1 classifies it as **Whig** (due to teleological progress framing), while Rule 2 classifies it as **contextual** (due to the absence of explicit moral judgment).
