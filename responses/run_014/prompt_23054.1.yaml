  The user might worry about complexity. Beta(0.5,0.5) has a U-shape, which might seem counterintuitive. But explaining that it's uniform on the invariant metric helps. Also, for rates, Gamma(0.001,0.001) is a common approximation.

  Tie-breaking: Jeffreys priors are the standard solution because they're invariant. Reference priors might be similar. Emphasize that no prior is truly uninformative, but these are accepted standards. 

