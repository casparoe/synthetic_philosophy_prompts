        To maximize expected score, we take the derivative with respect to p and set to zero. However, note that the user must report the same p in every prompt? The vignette says they are re-prompted the identical question. The user might report the same p each time? Or they might change? The committee's original key was 1/2 and they rejected the petition to lower it. Then they fixed the vignette to avoid multiple reports. The dissenting member in Ledger (Member B) says that in Lamp, the point-maximizing report was 1/4? Let's check:

