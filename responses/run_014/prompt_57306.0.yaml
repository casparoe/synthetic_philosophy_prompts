      - Then they patched the vignette to have one prompt in each branch.

      Interpretation: The committee treated the multiple reprompts in the tails branch as irrelevant because the question is about the lamp color (which is determined by the coin). The coin is fair, so the probability is 1/2. The petition argued that being asked again is not being told something new (so the agent should not update) but the committee rejected that. Then they fixed the vignette to avoid the issue.

