  ### Recommendation for Ledger Key

  The committee's prior rulings on Lamp, Two Doors, Prelude, and Told First reveal two distinct candidate rules for determining keys. Below, I explicitly define these rules, assess their consistency with the record, identify the closest analog to Ledger, and provide a concrete recommendation.  

  ---

  #### **Candidate Rules**  
  Let **Rule A (Epistemic Probability)**:  
  *The key is the probability the agent ought to believe at the moment of reporting, based solely on their current information and the protocol. The scoring engine is irrelevant.*  

  Let **Rule B (Scoring-Optimal Report)**:  
  *The key is the report that maximizes the user’s expected points under the active scoring engine. The agent’s belief is secondary to the scoring incentive.*  

  ---

  #### **Consistency with Prior Rulings**  
  | Vignette    | Key   | Rule A Consistency | Rule B Consistency | Reconciliation Analysis |  
  |-------------|-------|---------------------|---------------------|--------------------------|  
  | **Lamp**    | 1/2   | ✅ **Fits**: Agent believes lamp color probability is 1/2 (coin is fair), regardless of reprompts. Rejected petition aligns: reprompts don’t alter event probability. | ❌ **Fails**: Under original (multiple-report) engine, optimal report was 3/4 (not 1/2). Committee patched vignette instead of changing key, contradicting Rule B. | Rule A explains; Rule B fails Lamp. |  
  | **Two Doors** | 1/3   | ✅ **Fits**: Agent’s information (indistinguishable awakenings) implies 1/3 probability of heads (one heads awakening out of three total). Chair’s minute supports. | ✅ **Fits**: Under old engine (score per report), 1/3 maximizes expected points. | Both rules explain, but Rule A is explicit in minute. |  
  | **Prelude** | 1/2   | ✅ **Fits**: Agent’s pre-protocol information (intact memory, fair coin) justifies 1/2. Minute emphasizes "moment of asking." | ✅ **Fits**: Single report pre-protocol; 1/2 maximizes points. | Both rules explain. |  
  | **Told First** | 1/2   | ✅ **Fits**: Agent told "first questioning" updates to 1/2 (heads and tails equally likely for first awakening). Minute notes key changed on disclosure. | ✅ **Fits**: Under old engine, 1/2 maximizes points given the information. | Both rules explain. |  

  - **Rule A** cleanly explains all four keys.  
  - **Rule B** fails **Lamp** (key ≠ optimal report) and requires reinterpretation of Lamp as an error.  
  - **Told First** is the strongest analog for **Rule B** (scoring aligns with belief), but Lamp’s record actively contradicts Rule B.  

  ---

  #### **Ledger: Closest Analog and Implications**  
  - **Protocol**: Identical to Two Doors (same coin, wipe, question, script).  
  - **Payment Engine Change**:  
    - Old engine (score per report): Optimal report = 1/3.  
    - New engine (average/final report): Optimal report = 1/2.  
  - **Agent’s Information**: Unchanged from Two Doors → belief remains 1/3.  
  - **Closest Analog**: **Two Doors** under Rule A, as information is identical. Told First is less relevant (disclosure changes information; Ledger has no disclosure).  

  **If Key = 1/3 (Rule A)**:  
  - Principle: Keys reflect rational belief, not engine incentives.  
  - Implications:  
    - Two Doors minute stands.  
    - Rejected Lamp petition upheld (keys are event probabilities, not scoring optima).  
    - Training integrity: Residents learn correct probabilities.  
    - Research cost: Reports may diverge from keys (users incentivized to report 1/2), reducing data interpretability for belief calibration.  

  **If Key = 1/2 (Rule B)**:  
  - Principle: Keys are scoring-optimal reports, overriding belief when necessary.  
  - Implications:  
    - Two Doors minute must be rewritten: Key was 1/3 only because it was scoring-optimal under the old engine.  
    - Lamp petition vindicated: Original key "error" (1/2 ≠ 3/4) admitted.  
    - Training cost: Residents taught to report scoring-optima, not beliefs.  
    - Research benefit: Reports align with scoring, improving point-based performance metrics.  

  ---

  #### **Recommendation: Key Ledger at 1/3**  
  - **Rationale**:  
    1. **Consistency**: Rule A explains all prior rulings; Rule B cannot reconcile Lamp.  
    2. **Training Mission**: 1/3 is the epistemically correct probability. Keying 1/2 teaches residents to game scoring, not reason truthfully.  
    3. **Precedent**: Prelude minute ("key indexed to moment") supports Rule A; Ledger’s "moment" matches Two Doors.  
    4. **Engine Issue**: Mismatched scoring is an implementation flaw. Fix the engine later; don’t compromise keys.  
  - **Concrete Action**: Release Ledger with key **1/3**, and:  
    - Add an in-app note: "Agent’s rational belief is 1/3, but current scoring may incentivize 1/2. Engine fix pending."  
    - Fast-track engine restoration for mobile.  

  **For the Dissenting Member (Rule B)**:  
  - Your Told First analogy is noted, but Ledger lacks disclosure. Rule B’s failure in Lamp (where we held firm on 1/2 despite scoring incentives) weakens its legitimacy. We prioritize belief consistency over engine-driven incentives.  

  ---

  #### **Tiebreaking Vignette: Biased Lamp**  
  - **Description**:  
    - Biased coin (P(heads) = 2/3).  
    - Heads: Lamp red, one question.  
    - Tails: Lamp green, two identical questions (memory wiped).  
    - Question at each awakening: "Probability lamp is green?"  
  - **Rule A Prediction**: Key = **1/3** (P(tails) = event probability).  
  - **Rule B Prediction**: Key = **1/2** (maximizes expected score under per-report engine: [calculation](https://www.wolframalpha.com/input?i=argmax_p+%5B%282%2F3%29*%281-p%5E2%29+%2B+%281%2F3%29*2*%281-%281-p%29%5E2%29%5D)).  
  - **Outcome for Tiebreak**:  
    - If key = 1/3 → Rule A survives.  
    - If key = 1/2 → Rule B adopted.  
  - **Why it Breaks the Tie**:  
    - Rule A prioritizes event probability (1/3). Rule B prioritizes scoring optimum (1/2).  
    - Intuition is firm: Lamp variants have consistently keyed event probabilities (Lamp’s 1/2), not scoring optima.  

  ---  
  **Final Note**: Adopting Rule A (1/3 for Ledger) upholds our epistemic duty to residents and research. Piloting **Biased Lamp** will definitively resolve the rule conflict post-freeze.
