  I need to check if the axioms sneak in probability. Wallace emphasizes that the branch weights are structural features of the wavefunction, defined by the Hilbert space norm. The derivation aims to show that these weights should guide decisions like probabilities. But if the Born rule is what gives meaning to these weights as probabilities, isn't the argument assuming its conclusion?

  Considering counterarguments: Wallace argues that without assuming probability, the axioms force the agent to use the branch weights as decision weights. But the user might be right that this only works if we already see the weights as probabilistic. The axioms like diachronic consistency might be reasonable only if we accept the probabilistic interpretation upfront.

  Alternative approaches like envariance (Zurek) use symmetry to derive the Born rule without decision theory. If the state is symmetric, all outcomes must have equal probability, leading to the Born rule. This seems less circular but has its own issues, like relying on the indifference principle. Still, it might be a better path for the user's case.

