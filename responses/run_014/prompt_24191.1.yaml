  First, I recall the decision-theoretic approach, like David Deutsch's and David Wallace's work. They use rationality axioms (ordering, diachronic consistency, etc.) to show that a rational agent in an Everettian universe should act as if branch weights are probabilities. The key move is equating the "caring measure" for future branches with the branch weight. But isn't that assuming what needs to be proven?

