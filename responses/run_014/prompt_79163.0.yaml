  ### Full Runnable Design: Archipelago Causal Inference Simulation

  #### **Core Pedagogical Goal**
  Students experience the structural limitations of observational data in historical social science, confronting how multiple variables can correlate with an outcome due to different causal roles (upstream cause, downstream effect, proxy for an unobserved confounder), leading to irreducible ambiguity without additional leverage.

  ---

  ### **Materials to Prepare**
  1. **Hidden Data-Generating Structure**  
     - **Background Story**: The archipelago was colonized by a single power (1900–1950). Colonial extraction intensity (CEI) varied by island due to resource availability. Post-independence, institutions formed in response to extraction, prosperity developed, and cultural cohesion emerged as a result.  
     - **Key Variables** (all normalized 0–10 for simplicity):
       - `PROSPERITY`: GDP per capita in 2000 (outcome variable).
       - `GEOGRAPHY`: Resource Endowment Index (mineral/agricultural resources).
       - `INSTITUTIONS`: Rule of Law Index (quality of post-independence governance).
       - `CULTURE`: National Cohesion Index (strength of shared identity/post-colonial pride).
       - **Unobserved Confounder**: `COLONIAL EXTRACTION INTENSITY (CEI)` (degree of colonial-era exploitation).  
     - **Causal Relationships**:  
       - `GEOGRAPHY` → `CEI` (higher resources → more extraction).  
       - `CEI` → `INSTITUTIONS` (high extraction → worse institutions).  
       - `INSTITUTIONS` → `PROSPERITY` (better institutions → higher prosperity).  
       - `PROSPERITY` → `CULTURE` (higher prosperity → stronger national cohesion).  
       - `CEI` → `PROSPERITY` (high extraction → lower prosperity *directly*, e.g., via depleted resources).  
     - **Data for 10 Islands** (hand-calculable; see tables below).  
       - *Why these numbers?*:  
         - All three variables correlate with `PROSPERITY` but for different reasons:  
           - `INSTITUTIONS` is **upstream** (causes prosperity).  
           - `CULTURE` is **downstream** (caused by prosperity).  
           - `GEOGRAPHY` is a **proxy** for unobserved `CEI` (which depresses institutions/prosperity).  
         - No observational data (e.g., more islands, time-series) breaks the tie—correlations hold, but causal roles conflict.  

     | Island | GEOGRAPHY | CEI | INSTITUTIONS | PROSPERITY | CULTURE |
     |--------|-----------|-----|--------------|------------|---------|
     | 1      | 2.0       | 1.6 | 8.4          | 7.8        | 7.0     |
     | 2      | 3.0       | 2.4 | 7.6          | 7.0        | 6.5     |
     | 3      | 5.0       | 4.0 | 6.0          | 5.5        | 5.0     |
     | 4      | 6.0       | 4.8 | 5.2          | 4.5        | 4.0     |
     | 5      | 8.0       | 6.4 | 3.6          | 3.0        | 2.5     |
     | 6      | 1.0       | 0.8 | 9.2          | 8.5        | 8.0     |
     | 7      | 4.0       | 3.2 | 6.8          | 6.2        | 5.7     |
     | 8      | 7.0       | 5.6 | 4.4          | 3.8        | 3.3     |
     | 9      | 9.0       | 7.2 | 2.8          | 2.2        | 1.7     |
     | 10     | 10.0      | 8.0 | 2.0          | 1.5        | 1.0     |

  2. **Data Booklets (for Teams)**  
     - **Institutional Team**: Island ID + `INSTITUTIONS` + `PROSPERITY` (no other variables).  
     - **Geographical Team**: Island ID + `GEOGRAPHY` + `PROSPERITY`.  
     - **Cultural Team**: Island ID + `CULTURE` + `PROSPERITY`.  
     - **Sample Correlation Calculations** (visible in data):  
       - Institutions-Prosperity: *r ≈ +0.98* (strong positive).  
       - Geography-Prosperity: *r ≈ -0.98* (strong negative; high resources = low prosperity).  
       - Culture-Prosperity: *r ≈ +0.99* (strong positive).  

  3. **Historian Archive Cards**  
     - **Historian 1 (Island 5)**: "Island 5 had vast mineral resources. Colonial records show forced labor camps and resource stripping. Post-independence, weak courts and corruption persisted."  
     - **Historian 2 (Island 6)**: "Island 6 had poor soils. Minimal colonial interest allowed traditional governance to survive. Post-independence, it developed accountable institutions."  
     - **Historian 3 (Island 10)**: "Island 10 was resource-rich. Colonial archives note brutal suppression of rebellions. Post-independence, it had coup attempts and low public trust."  
     - *Purpose*: Provide qualitative context but no "smoking guns" (e.g., no direct mention of CEI).

  4. **Referee Panel Brief**  
     - Instructions: "Verify team claims using data provided on request. Challenge causal logic, not math. Award/penalize points per rules."

  ---

  ### **Roles and Assignment (16 Students)**
  - **3 Research Teams** (3–4 students each):  
    - Team A: Institutions → *Receives INSTITUTIONS + PROSPERITY data*.  
    - Team B: Geography → *Receives GEOGRAPHY + PROSPERITY data*.  
    - Team C: Culture → *Receives CULTURE + PROSPERITY data*.  
  - **Referee Panel** (4 students): Validates claims, requests data, facilitates challenges.  
  - **Historians** (3 students): Each holds one island’s archive card (Islands 5, 6, 10).  
  - **Assignment**: Randomly assign roles; emphasize teams cannot share data.

  ---

  ### **Rules and Payoff Scheme**
  - **Causal Claim Requirements**:  
    - Must include:  
      1. **Definite Falsifier**: "If we find an island with [high institutions] but [low prosperity], our claim is wrong."  
      2. **Policy Implication**: "Therefore, to boost prosperity, we should [invest in institutions]."  
  - **Point System** (tracked on board):  
    - +10 points: For posting a claim.  
    - –5 points: If a team withdraws their claim after a challenge.  
    - +10 points: If a claim survives all challenges.  
    - +5 points: To any team that successfully challenges another’s claim (leading to withdrawal).  
    - *No points for referees* (prevents overzealousness).  
  - **Challenge Rules**:  
    - Only research teams may challenge others.  
    - Referees arbitrate (vote on challenge validity).  
    - Historians may be questioned but only share their card’s content.  

  ---

  ### **Timeline (90 Minutes)**
  | Time    | Phase                          | Key Activities                                                                                                |
  |---------|--------------------------------|---------------------------------------------------------------------------------------------------------------|
  | 0–5 min | **Setup**                      | Introduce archipelago, roles, rules. Emphasize: "No data sharing. Goal: causal claims surviving challenges." |
  | 5–20 min| **Team Analysis**              | Teams compute correlations, draft claims + falsifiers/policy implications.                                    |
  | 20–35 min| **Claims Presentation**       | Each team (5 min each): (1) State claim, (2) Show correlation, (3) State falsifier/policy.                   |
  | 35–65 min| **Challenge Phase**           | Teams challenge others (1–2 min per challenge). Referees vote on validity. Historians consult if islands named. |
  | 65–75 min| **Claim Adjustment**          | Teams may withdraw claims (–5 pts) or stand firm. Referees tally points.                                      |
  | 75–80 min| **Scoring**                   | Announce points. No "winner"—highlight unresolved standoff.                                                  |
  | 80–90 min| **Debrief**                   | Reveal hidden structure, map moments to concepts, discuss real-world parallels.                               |

  ---

  ### **Debrief (10 Minutes)**  
  1. **Reveal Hidden Structure** (3 min):  
     - Display causal model: `GEOGRAPHY` → `CEI` → (`INSTITUTIONS` → `PROSPERITY` → `CULTURE`).  
     - Emphasize: All variables correlate with prosperity but for different reasons. Observational data alone cannot untangle them.  

  2. **Map Session to Concepts** (4 min):  
     - **Minute 15**: Teams became overconfident from correlations ("This is obvious!"). → *Problem: Conflating correlation with causation*.  
     - **Minute 40**: Team B (Geography) challenged Team A (Institutions): "Island 5 has low resources but also low prosperity—geography matters!" → *Problem: Equating correlation with causal primacy*.  
     - **Minute 50**: Historian for Island 5 shared colonial brutality, but teams dismissed it as "anecdotal." → *Problem: Qualitative data lacks statistical leverage*.  
     - **Minute 70**: All claims stood despite challenges. → *Standoff: Underdetermination from observational data*.  

  3. **Resources for Living with Uncertainty** (3 min):  
     - **Triangulation**: Combine methods (e.g., qualitative archives + statistics).  
     - **Natural Experiments**: Real-world leverage you *can’t* simulate here (e.g., arbitrary borders). *Example*: "In Korea, a border drawn randomly split similar people—prosperity diverged due to institutions, not geography/culture."  
     - **Mechanism Tracing**: Focus on *how* causes work (e.g., "How exactly do institutions boost investment?").  
     - **Humility**: Policy implications are probabilistic, not deterministic.  

  ---

  ### **Predictable Problems and Fixes**
  1. **Problem**: Teams merge data ("Let’s combine geography and institutions!").  
     - **Fix**: Intervene early: "The data is proprietary. Teams cannot share—this mimics disciplinary silos in real research."  

  2. **Problem**: Referees turn prosecutor (e.g., aggressively challenging all claims).  
     - **Fix**: Redirect: "Referees, your role is to ensure fair play, not to advocate. Focus on data requests and vote neutrally."  

  3. **Problem**: Historians overinterpret archives (e.g., "Island 5 proves extraction matters!").  
     - **Fix**: Remind historians: "Stick to your card’s text. You’re a source, not an analyst."  

  4. **Problem**: Teams avoid risks (no claims/challenges to preserve points).  
     - **Fix**: Encourage: "Withdrawing a weak claim early costs only 5 points; surviving earns 20!"  

  ---

  ### **What the Activity Cannot Reproduce**
  - **Natural/Quasi-Experimental Leverage**: In real research, arbitrary boundaries (e.g., the Korean DMZ), policy rollouts, or random shocks provide "as-if random" variation to break ties.  
    - **How to Address in Debrief**: Explicitly contrast the simulation’s limitations with real cases:  
      > "Here, you had no natural experiment. But in the real world, when a border splits a culture/geography (e.g., Haiti/Dominican Republic), we *can* isolate institutional effects. Observational data isn’t hopeless—it just needs clever *non*-observational leverage."  

  - **Dynamic Processes**: The simulation uses static data; real history has path dependence (e.g., institutions evolving with crises).  
    - **How to Address**: Note in debrief: "Longitudinal data might help but requires stronger assumptions about temporal precedence."  

  ---

  ### **Instructor Notes**
  - **Prep Work**: Pre-calculate correlations (for quick checks). Use large posters for team claims.  
  - **Mindset**: Embrace chaos—students "hitting the wall" is the goal.  
  - **Final Message**: "The vertigo you felt is the field’s reality. But remember: We navigate it with tools beyond pure observation."  

  This design forces students into the inferential abyss of observational data, then equips them to climb out with nuanced epistemic humility. Run it cold—no prep reading required.
