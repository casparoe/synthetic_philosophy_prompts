  5. **Timeline (90 minutes)**:

     - 0-5 min: Introduction by the instructor. Explain the setting: the archipelago, the shared history, and the task. Assign roles and hand out materials. Explain the rules and the payoff scheme. Emphasize that the goal is to put forward a causal claim that can be challenged and to challenge others. (5 min)

