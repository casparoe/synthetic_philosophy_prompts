     - Problem 5: A team might not be able to come up with a claim. 
          Handling: The instructor can circulate and help them formulate. The claim can be simple: "Institutions cause prosperity because we see a positive correlation. A falsifier would be an island with good institutions but low prosperity. Policy: invest in institutions."

     - Problem 6: The challenge phase might be dominated by one team. 
          Handling: The instructor can limit the number of challenges per team? Or encourage all teams to participate.

     - Problem 7: The panel might deadlock in a vote. 
          Handling: The instructor can break ties.

     - Problem 8: A team might withdraw immediately after a challenge to avoid the penalty? But then they lose 5 points and the challenger gets 5. That's allowed.

  8. **What the activity cannot reproduce**:

     - Natural experiments: we cannot simulate a situation where a border is drawn arbitrarily, creating a quasi-experimental setting. We should explain in the debrief that in reality, such situations can provide leverage because the assignment is as good as random. We can give an example (e.g., the division of Korea) and explain how it breaks the tie between geography and institutions.

     - Time-series data: we only have cross-sectional data (one point in time). In reality, we might have panel data that can help.

     - Mechanisms: the activity focuses on correlations. In real research, scholars try to uncover mechanisms (how exactly institutions affect prosperity) which can provide additional evidence.

