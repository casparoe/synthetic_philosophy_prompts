          - Triangulation with different methods.
          - The use of natural experiments.
          - The importance of theory and mechanism.
          - The acknowledgment of uncertainty.

  7. **Predictable problems and handling**:

     - Problem 1: One team tries to win by merging data with another team. 
          Handling: The rules state that each team only has their own data. They are not allowed to share data with other teams. The instructor should announce this at the beginning. If they try to do it, the instructor can say: "In this exercise, the data are proprietary and you are in competition. You cannot share your data."

     - Problem 2: The referee panel turns prosecutor and becomes too aggressive. 
          Handling: The instructor can remind the panel that their role is to judge challenges fairly, not to advocate. They should be neutral. Also, the panel does not earn points, so they have no incentive to be aggressive.

