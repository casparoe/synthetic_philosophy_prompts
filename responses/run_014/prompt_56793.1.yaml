prompt: |-
  Below are the five principles that govern how I size bets on my own portfolio. I have defended each of them separately many times; I have never had to defend them jointly, and I want to know whether they can be.

  1. I accept the ergodicity-economics line: for one agent living through a multiplicative process, the time-average growth rate of wealth is the operative criterion and the ensemble average is a fiction. So maximizing the expected logarithm of my wealth is not a claim about my psychology or my utility curvature — it is a claim about the dynamics. I neither need nor believe in concave utility layered on top of it.
  2. Accordingly, on repeatable bets I stake the full Kelly fraction computed from my own probability estimates, and I reject fractional-Kelly shading. Halving the stake would be a tacit concession that risk aversion beyond the logarithm is legitimate, and on my view it is not.
  3. I also hold that no policy is acceptable to me if it carries any nonzero probability of my portfolio dropping below a floor of one year's living expenses. A superior growth rate does not buy off that constraint; the floor is absolute.
  4. For genuinely one-shot opportunities I evaluate by expected value and consider myself risk-neutral. Concretely: offered a single, non-repeatable fair-coin flip paying 1.2-to-1 on whatever I stake, with any proceeds reinvested in the same portfolio, I would stake 40% of my net worth. The bet is worth plus 4% of net worth in expectation, so I take it.
  5. My horizon is finite. I expect to stop contributing and start drawing the portfolio down in roughly twenty-five years, and I give away a fixed 10% of it annually. Colleagues insist that (1) and (2) cannot survive either fact: that a finite horizon obliges me to de-risk as the endpoint approaches, and that a standing proportional donation mechanically lowers my optimal stake.

  Please audit the set rather than lecture me on Kelly. Tell me which of these genuinely pull against each other and which pairs only look like they do — I expect at least one of the objections reported in (5) is a mistake, but I do not know which, and I may be wrong about that too. Rank the real tensions by severity instead of presenting them as equally bad, and for each one state what has to give, what the cheapest revision is, and what that revision costs me elsewhere in the list. Give me a verdict, not a menu: name the commitment I should drop or rewrite, and do not retreat into saying that everything turns on how I define my terms.
reasoning: |-
  Okay, I need to tackle this user's query. They've laid out five principles for sizing bets in their portfolio and want me to audit them for internal consistency. The user is clearly knowledgeable about Kelly criterion and ergodicity economics, so I shouldn't lecture on basics. Instead, I need to identify where their principles conflict and rank those conflicts by severity.

  First, principle 1 is about ergodicity economics - they're committed to maximizing expected log wealth as a dynamic requirement, not a psychological utility function. Principle 2 takes this further by rejecting any fractional Kelly shading since that would imply additional risk aversion. But then principle 3 introduces a hard floor - no chance of portfolio dropping below one year's expenses. That immediately clashes with full Kelly since Kelly can have significant drawdown risk.

  The one-shot opportunity in principle 4 seems consistent at first glance - they're taking a positive EV bet. But I need to check if this conflicts with the ergodic approach. Principle 5 mentions two challenges: finite horizon and proportional donations. Colleagues say these undermine principles 1 and 2.

  Let me think about the donation aspect first. If they're giving away 10% annually, that mechanically reduces the compounding base. This might actually make full Kelly more aggressive relative to what's left. The finite horizon is trickier - standard Kelly assumes infinite horizon, but there's research showing it's robust over finite periods if you don't need to de-risk.

  The biggest conflict is clearly between principle 2 (full Kelly) and principle 3 (hard floor). Full Kelly can lead to significant drawdowns with non-trivial probability. The hard floor constraint means they can't actually implement full Kelly in many cases. This is a fundamental inconsistency in their approach.

  The donation in principle 5 might not be a big problem mathematically - it just scales down the portfolio. But the finite horizon could be an issue depending on their spending needs at retirement. If they need a specific amount at year 25, that might require de-risking, contradicting principle 2.

  Principle 4 seems mostly consistent except that taking 40% on a one-shot bet might violate the hard floor in principle 3 if the portfolio isn't large enough relative to expenses.

  After mapping all this out, I'll need to rank the conflicts by severity and suggest resolutions. The user wants a clear verdict on what to change, not just options. The hardest trade-off is between the growth maximization and the capital preservation constraint.
answer: |-
  Based on a rigorous audit of your five principles, here's the analysis of tensions, their severity, required revisions, and costs. The most severe conflicts arise from the interaction of the hard floor (3) with full Kelly (2) and the finite horizon (5), compounded by the proportional donation.

  **Ranked Tensions by Severity:**

  1.  **Principle 2 (Full Kelly) vs. Principle 3 (Hard Floor)** - **Severity: Catastrophic Inconsistency**
      *   **Conflict:** Full Kelly betting (maximizing E[log(W)]) inherently carries a *non-zero probability* of severe drawdowns approaching ruin over repeated plays, especially with uncertain probability estimates. Principle 3 mandates a hard floor (1 year's expenses) with *zero tolerance* for any probability of breaching it. These are fundamentally incompatible. Full Kelly *cannot guarantee* the hard floor constraint.
      *   **What Has to Give:** The hard floor (Principle 3) must be modified or abandoned. Full Kelly (Principle 2) is the core dynamic axiom derived from Principle 1 and cannot be sacrificed without abandoning the ergodicity foundation.
      *   **Cheapest Revision:** Replace the *absolute* hard floor ("any nonzero probability") with a *probabilistic* floor. Define an acceptable, very low probability (e.g., 1 in 10,000 or less) of breaching the floor over your investment horizon. Size bets (potentially below full Kelly) to meet this probabilistic constraint. This is effectively introducing fractional Kelly *not due to risk aversion*, but as a *survival constraint*.
      *   **Cost:**
          *   **Growth:** You sacrifice some expected log growth by staking less than full Kelly to satisfy the survival probability. The cost increases the tighter the survival probability constraint is.
          *   **Philosophical:** It *looks* like conceding to risk aversion beyond the log, but the justification is survival necessity, not preference. You must accept this nuance to maintain coherence.
          *   **Operational:** Requires complex modeling (e.g., using ruin theory, Monte Carlo simulation) incorporating your donation rate, horizon, expense floor level, and probability estimates to determine the maximum acceptable stake that meets the survival probability.

  2.  **Principle 5 (Finite Horizon & Donations) vs. Principle 2 (Full Kelly)** - **Severity: Significant Tension (but resolvable with Principle 3 revision)**
      *   **Conflict:**
          *   *Finite Horizon:* Your colleagues are partially correct. *If* the endpoint requires a specific minimum wealth level to fund retirement/drawdown (a target), standard infinite-horizon Kelly is suboptimal. Maximizing E[log(W)] favors high growth/high volatility strategies too close to the horizon if you don't need the extreme upside and cannot tolerate the downside risk of missing the target. However, *if* your drawdown plan is flexible (spending adjusts to portfolio value) and you don't have a fixed wealth target at T=25, full Kelly often remains near-optimal or optimal even over finite horizons. Your fixed annual donation (10%) mechanically reduces the compounding base, lowering the optimal *fraction* staked on risky assets relative to a no-donation scenario.
      *   **What Has to Give:** Principle 2 needs contextual interpretation within the finite horizon/donation framework. The *definition* of the optimization criterion needs refinement.
      *   **Cheapest Revision:** Reframe the optimization within the finite horizon. The goal remains maximizing the *expected utility* of the terminal wealth *at T=25*, but where utility is the logarithm *because of the ergodic dynamics during the accumulation phase*. Acknowledge that the donation reduces the effective capital base for compounding risky bets. Solve for the strategy maximizing E[log(W_25)] given annual donations and a 25-year horizon.
      *   **Cost:**
          *   **Complexity:** Calculating the optimal path is vastly more complex than static full-Kelly fractions. Requires dynamic programming or sophisticated simulation.
          *   **Result:** The optimal stake *may* be reduced below the static full-Kelly fraction for the underlying bet, especially later in the horizon or due to the donation drain. This resembles fractional Kelly but is justified by the altered compounding dynamics (finite T, leakage), not preference-based risk aversion. *Crucially, if you implement the probabilistic floor (Revision 1), it will dominate this effect.* The survival constraint will force de-risking more than the finite horizon alone.

  3.  **Principle 4 (One-Shot Risk Neutrality) vs. Principle 3 (Hard Floor) & Principle 2 (Philosophy)** - **Severity: Moderate Tension (Exacerbated by Principle 3)**
      *   **Conflict:** Staking 40% on a single fair coin flip (1.2:1) is rational under EV maximization (Principle 4). However:
          *   It directly violates the *absolute* hard floor (Principle 3) if 40% of NW < 1 year's expenses (unlikely but possible near the floor) or, more realistically, if losing the 40% would push the portfolio below the floor.
          *   Philosophically, labeling it "one-shot" while reinvesting proceeds into the ergodic portfolio is slightly inconsistent. The *proceeds* become part of the multiplicative process governed by Principles 1-3. Taking a massive single bet contradicts the careful survival-oriented growth maximization implied by Principles 1 & 2 (especially after Revision 1).
      *   **What Has to Give:** The "one-shot" definition or the sizing rule needs refinement to align with the core portfolio survival and growth philosophy.
      *   **Cheapest Revision:** Maintain risk-neutrality for true one-shots, but impose the *same probabilistic survival constraint* (from Revision 1) on the one-shot bet size. Size the one-shot bet such that even if lost, the probability of the *remaining portfolio* subsequently breaching the floor before T=25 remains below the acceptable threshold. This will often cap the bet well below 40%.
      *   **Cost:**
          *   **Growth:** Forfeits some expected value from large one-shot opportunities to protect the core portfolio's survival and compounding potential. The cost depends on the opportunity size and portfolio state relative to the floor.
          *   **Operational:** Requires integrating one-shot bets into the survival probability model.

  4.  **Principle 5 (Donations) vs. Principle 1/2 (Growth Optimization)** - **Severity: Minor Adjustment**
      *   **Conflict:** The fixed 10% annual donation is a leakage, reducing the capital base for compounding. This mechanically lowers the optimal *absolute dollar amount* staked on risky bets and the optimal *fraction* relative to a no-leakage scenario, as the donation acts like a negative return.
      *   **What Has to Give:** Recognition that the donation alters the effective growth environment.
      *   **Cheapest Revision:** Explicitly incorporate the 10% annual outflow (as a negative expected return component) when calculating the growth-optimal strategy (full Kelly fraction or its survival-constrained version) for the underlying portfolio bets. This is already implied in the finite-horizon reframing (Revision 2).
      *   **Cost:** Lower expected terminal wealth (W_25) compared to not donating. This is the intended cost of your philanthropy, not an inconsistency cost.

  **The Verdict: Drop the Absolute Hard Floor (Principle 3 as Stated)**

  *   **Why:** It is the primary source of catastrophic inconsistency. It directly negates the possibility of implementing full Kelly (Principle 2) derived from your foundational ergodicity axiom (Principle 1). No coherent strategy can simultaneously maximize expected log growth *and* guarantee absolute avoidance of any drawdown below a fixed floor over repeated bets with uncertainty.
  *   **Revision Required:** Replace Principle 3 with a **probabilistic survival constraint**. Define an acceptable, extremely low probability (e.g., p < 0.01% over 25 years) of your portfolio dropping below one year's expenses. Size *all* bets (repeatable and one-shot) such that this survival probability is maintained.
  *   **Consequences of Revision:**
      *   **For Principle 2:** You will often stake *less* than the raw full-Kelly fraction. This is not a concession to utility-based risk aversion; it's a *survival necessity* arising from the physics of multiplicative dynamics and your non-negotiable need to avoid ruin. Full Kelly remains the theoretical target, constrained by survival.
      *   **For Principle 5 (Colleagues' Objection):** The finite horizon is managed *through* the survival probability constraint over T=25 years. The donation is incorporated as a leakage in the growth model and the survival calculation. The core ergodicity logic (Principle 1) survives intact but operates within these realistic constraints. Your colleagues' objection is partially valid regarding the donation lowering the stake but mistaken in claiming ergodicity/e-log cannot survive – it just requires proper modeling.
      *   **For Principle 4:** One-shot bets are sized not purely by EV, but by EV *subject to* the survival constraint on the remaining portfolio.
      *   **Cost:** Sacrifices some expected log growth to achieve near-certain survival. This is the unavoidable price of prioritizing survival over unconstrained growth. The cost is minimized by using the tightest acceptable survival probability.

  **Final Coherent Framework:**

  1.  **Ergodicity Foundation:** Unchanged.
  2.  **Constrained Growth Optimization:** Target full-Kelly stakes for repeatable bets, *constrained by* a probabilistic survival requirement over 25 years incorporating 10% annual donations.
  3.  **Probabilistic Survival Floor:** Replaces the absolute floor. Near-zero probability of breaching 1 year's expenses is the constraint.
  4.  **Survival-Constrained One-Shots:** Size non-repeatable bets by EV, capped by the survival constraint on the remaining portfolio.
  5.  **Finite Horizon & Donations:** Explicitly modeled within the 25-year survival probability calculation and the growth optimization with capital leakage.

  This revised set maintains the core ergodicity logic while incorporating your essential survival requirement realistically and addressing the finite horizon and donation mechanics. The sacrifice is pure growth potential for survival assurance, justified by your absolute need for the floor.
