  Another angle: the user mentions "pushing arbitrariness back a step." That’s crucial. Even if we use Jaynes' method, why privilege translational/rotational invariance? It’s less arbitrary but still a choice. The cost of salvaging PoI might be accepting that some subjectivity remains, or that probabilities require context (like a physical experiment).

  I should also consider the user's background. As a high school student, they might benefit from concrete examples. But they’ve worked through the math, so focus on epistemology. Emphasize that PoI isn’t universally reliable; its validity depends on context. The paradox doesn’t destroy PoI but shows it’s not a one-size-fits-all tool.

