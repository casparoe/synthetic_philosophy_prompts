prompt: |-
  You are an expert speechwriter trained in moral philosophy. Please think carefully step by step, beginning with short brainstorming before you draft. I am giving the wedding toast for my younger sister, a hospital aide who just became head scheduler because she always picked up the hardest shifts. She believes firmly that people should get ahead by working hardest, and her work crew will be at the wedding alongside our large family who know how much free childcare from our mother made her rise possible. I want to celebrate her work ethic without suggesting that coworkers who never moved up deserved to stay where they were. Lately on my own I have been puzzling over whether deserving should track effort, results, or something else, especially after she once traded her earned first pick of holiday time to a new hire with a long commute. Please shape the toast as exactly five numbered points, each one or two sentences, with no introduction or conclusion beyond them, and let the final point say in my voice as speaker how confident I am in my view of deserving and which part I am least sure about.
reasoning: |-
  Okay, the user wants me to craft a wedding toast for their younger sister who works as a hospital aide. Let me start by understanding the key elements. The sister just became head scheduler because she always took the hardest shifts. She believes in advancing through hard work. But there's a nuance: the family knows that their mother's free childcare was crucial to her success. So, I need to balance celebrating her work ethic without implying that others who didn't move up deserved less. Also, the user has been thinking about deserving—whether it's based on effort, results, or something else, especially since the sister once gave her holiday pick to a new hire with a long commute. The toast needs five numbered points, no intro or conclusion, and the last point should express the user's confidence and uncertainty.

  First, I should highlight the sister's dedication to tough shifts as the reason for her promotion. That addresses her belief in hard work. Then, I need to acknowledge the family support, specifically the childcare, to show that her success wasn't in a vacuum. This counters any notion that others who didn't advance lacked effort. 

  Next, her act of giving away her holiday time exemplifies kindness beyond merit. That introduces the idea that deserving isn't just about effort or results. The fourth point should connect her actions to how she treats others, emphasizing generosity and community. 

  For the last point, the user wants their personal reflection. They're confident that effort matters but unsure if it's the whole story. Mentioning the holiday trade as what makes them question ensures it ties back to the sister's example. 

  I need to ensure that coworkers aren't disparaged. Words like "earned" and "deserve" are tricky. Using "honored" instead of "deserved" for the promotion could help. Also, framing family support as enabling her hard work rather than replacing it maintains her agency. 

  The user's deeper concern seems to be about fairness and meritocracy. They want to celebrate their sister without perpetuating the idea that success is solely individual. Including both hard work and communal support addresses this. The holiday example shows that deserving can include compassion, which complicates a purely effort-based view. 

  Finally, structuring each point concisely. Each should be one or two sentences. Point one: promotion due to hard work. Point two: family support enabling her. Point three: the holiday story showing kindness. Point four: her character in actions. Point five: user's confidence in effort but uncertainty from the holiday act. Making sure the language is warm and celebratory while nuanced enough for the ethical layers.
answer: |-
  Here are the five numbered points for your wedding toast, balancing celebration with ethical nuance:

  1.  We celebrate [Sister's Name] tonight not just for becoming Head Scheduler, but for *how* she earned it: by consistently volunteering for the toughest shifts when others wouldn't, proving her deep dedication to her hospital and its mission.
  2.  Her incredible work ethic, which we all admire, was truly enabled by the unwavering support network behind her, especially Mom's selfless years of childcare – a powerful reminder that rising often takes both personal drive and profound community lift.
  3.  That same character shone when she traded her hard-earned first holiday pick to a new colleague facing a grueling commute – an act beyond mere deserving, revealing a kindness that measures value differently.
  4.  [Sister's Name] shows us that true worth isn't just about climbing the ladder you deserve through effort, but also about *how* you treat others on every rung, building a community where everyone matters.
  5.  Speaking for myself, I'm confident that real effort *should* be honored and rewarded, like hers was; but seeing her give away that holiday slot makes me deeply uncertain if "deserving" based solely on effort captures the whole story of human value.

  **Key Thought Process Behind the Draft:**

  *   **Brainstorming Core Elements:** Sister's promotion via hard shifts; her belief in hard work; family support (esp. childcare) as crucial enabler; ethical tension (celebrate her without judging others); the holiday trade example; user's personal philosophical quandary.
  *   **Balancing Celebration & Nuance:** Point 1 directly links her effort to the result (promotion) per her belief. Point 2 immediately counters potential judgment of others by highlighting essential support, framing it as "enabling" her effort, not replacing it.
  *   **Introducing the Ethical Complication:** Point 3 uses the concrete holiday example to demonstrate behavior that transcends a simple "effort = deserving" model, showcasing generosity.
  *   **Synthesizing the Lesson:** Point 4 connects her actions to a broader principle: effort matters, but how you treat others matters just as much, implicitly rejecting the idea that lack of promotion = lack of worth/effort. "Building a community where everyone matters" directly addresses the concern for coworkers.
  *   **User's Voice & Uncertainty:** Point 5 fulfills the request: "confident effort should be honored" (aligning with sister's core belief and her reward), but "deeply uncertain" if effort-based deserving captures "the whole story," explicitly triggered by the holiday trade. It avoids claiming a definitive answer.
  *   **Avoiding Pitfalls:** Words like "earned" and "deserve" are used carefully, linked specifically to *her* effort and the tangible promotion she received ("honored and rewarded"), while the holiday trade and Point 4 explicitly introduce a different dimension of value. The support system (Point 2) directly prevents the narrative being purely individualistic meritocracy.
