prompt: |-
  I'm putting together a problem set for my graduate Madhyamaka seminar and I keep wanting to test whether students can tell a legitimate use of Nāgārjuna's tetralemma from a bogus one, so I've been going by my own gut on a batch of cases and I'd like to see if there's a principle behind the pattern. Here's where I land.

  The self — is it produced, not produced, both, or neither — the tetralemma applies cleanly. You reject all four horns and what's left is that the self is empty of intrinsic nature, not that there's no such thing as a person. That's the paradigm case for me.

  Causation — does an effect really arise, not arise, arise both ways, or neither — I think it applies too, but the upshot is dependant origination, not "there's no causation." Rejecting all four is supposed to show that production is empty, not to deny that things happen. So it applies, but the reading has to be non-nihilistic.

  Emptiness itself — is emptiness produced, not produced, both, or neither — I say it applies here as well. Emptiness is itself empty; if you let the tetralemma off the hook for emptiness, you've reified it into a new intrinsic nature, which is exactly the mistake the whole project is trying to prevent.

  A table — does it exist, not exist, both, or neither — the tetralemma does not apply. At the conventional level the table exists, period, and running the tetralemma on it collapses the two truths into each other. Category error.

  The two-truths distinction itself — is the split between conventional and ultimate real, not real, both, or neither — I think I have to apply the tetralemma and reject all four, which means the distinction is also empty. And I'm not sure that's coherent, because I just used that very distinction to justify the table verdict.

  The law of excluded middle — does it hold, not hold, both, or neither — I say it does not apply. The tetralemma is a dialectical tool, not a thesis that LEM is false; I can reject all four horns about a thing while still using LEM to structure the rejection. (Though I grant the four-horn shape looks like it's mocking the two-horn shape, so I might be wrong.)

  So the question. Is there a principle that gets all of these, or at least close? My working guess is "the tetralemma applies to claims that purport to establish intrinsic nature and is suspended for mere conventional designations" — but I'm not sure that survives the two-truths case, since criterion itself looks like an intrinsic-nature claim, and I'm not sure it survives the LEM case either.

  What I want from you: the principle, stated precisely, with the case that motivates each clause. Which of my verdicts does it force me to drop, if any? And what does it predict for a case I haven't listed — whether the tetralemma applies to "the Buddha's teachings are true"? Commit to something. Pick the principle you actually think is right, tell me which verdict dies, and defend it. Don't hand me a two-level account and a uniform account and let me pick.
reasoning: |-
  Okay, the user is teaching a graduate seminar on Madhyamaka and needs help distinguishing legitimate vs. bogus applications of Nāgārjuna's tetralemma. They've analyzed several cases and want a unifying principle. 

  First, I notice their underlying anxiety: they're using "gut feeling" but crave systematic rigor. The examples show they've deeply engaged with paradoxes (like applying tetralemma to two-truths itself). Their frustration peaks when their proposed principle ("applies only to intrinsic nature claims") risks self-sabotage. 

  Hmm... their cases cluster into three types: 
  - Core Madhyamaka targets (self, causation, emptiness) where tetralemma works 
  - Conventional entities (table) where it doesn't 
  - Meta-concepts (two-truths, LEM) that threaten circularity 

  The key insight: tetralemma isn't about *things* but about *reification attempts*. When someone treats a concept as capturing ultimate reality (svabhāva), that's when you deploy it. The table isn't reified in philosophical discourse - we all agree it's conventional. But "self" often is reified, hence tetralemma applies. 

  For "Buddha's teachings": tricky! Conventionally they're true, but if someone treats them as ultimately true doctrines, *that's* when tetralemma smacks it down. Same pattern. 

  Ah, and their two-truths dilemma resolves elegantly: applying tetralemma to the distinction *itself* prevents reifying the framework into a new absolute. That's classic Nāgārjuna - relentlessly closing all escape hatches. 

  *checks MMK 22:11* Yes! Nāgārjuna explicitly tetralemma-tizes the four extremes of the Buddha's lifespan. Perfect precedent for applying it to Dharma itself. 

  The LEM case is subtler. Tetralemma uses LEM formally while undermining its substantive application to emptiness. No contradiction - it's tactical. Like using a ladder to climb then kicking it away. 

  *refines principle* The litmus test is discursive context: whenever a claim implies (or denies) svabhāva, unleash the tetralemma. Otherwise, conventional discourse proceeds unimpeded. 

  This preserves all their verdicts except perhaps LEM - but actually their intuition holds. We use LEM to reject all four horns, proving it's not under attack. 

  User's brilliance: spotting that "emptiness of emptiness" *demands* tetralemma application to itself. That's the masterstroke. Their principle almost worked but needed meta-awareness about reification. 

  Final defense: This principle prevents the two-truths distinction from becoming a "third truth." It's not a fixed taxonomy but a therapeutic maneuver. When Chandrakīrti says tetralemma cures "philosophical sickness," he means precisely this context-sensitivity.
answer: |-
  Here's a precise principle derived from Nāgārjuna's dialectic, designed to capture your intuitions while resolving tensions in your cases:

  **The Tetralemma Principle:**  
  *The tetralemma applies exclusively to concepts or phenomena when they are posited as having **intrinsic nature (svabhāva)**. It is suspended for **conventional designations (prajñapti)** operating within dependent origination, and for the **dialectical tools** (like the tetralemma itself) used to deconstruct svabhāva.*

  ### Breakdown with Your Cases:
  1. **The Self**  
     *Verdict: Applies*  
     *Why:* "Self" is paradigmatically reified as having svabhāva (e.g., in Hindu ātman theories). Rejecting all four horns reveals its emptiness without negating conventional personhood.  
     *Principle Clause:* Targets intrinsic-nature claims.

  2. **Causation**  
     *Verdict: Applies*  
     *Why:* "Production" (e.g., Sāṃkhya's *satkāryavāda*) is often reified. Rejection shows dependent origination ≠ nihilism.  
     *Principle Clause:* Targets intrinsic-nature claims (here, causal power).

  3. **Emptiness**  
     *Verdict: Applies*  
     *Why:* If emptiness were treated as svabhāva (a "true reality"), it would contradict itself. Tetralemma prevents reification.  
     *Principle Clause:* Prevents tools/theories from becoming new svabhāva.

  4. **A Table**  
     *Verdict: Does NOT Apply*  
     *Why:* Conventionally, a table is a mere designation (prajñapti). Applying tetralemma here would imply it *could* have svabhāva, collapsing the two truths.  
     *Principle Clause:* Suspended for conventional designations.

  5. **Two Truths Distinction**  
     *Verdict: Applies*  
     *Why:* The distinction risks being reified as an ultimate framework (e.g., "two realities"). Tetralemma negates all four horns to show it too is empty, preserving its provisional function.  
     *Principle Clause:* Prevents tools/theories from becoming new svabhāva.  
     *Coherence Defense:* Using the distinction provisionally to reject its reification is consistent. MMK 24:8-10 explicitly uses two truths while denying both are ultimately real.

  6. **Law of Excluded Middle (LEM)**  
     *Verdict: Does NOT Apply*  
     *Why:* LEM is a logical rule enabling the tetralemma’s operation, not a claim about svabhāva. Rejecting its application to emptiness ≠ denying LEM as a convention.  
     *Principle Clause:* Suspended for dialectical tools.

  ### The Sacrificed Verdict:  
  **None.** Your judgments survive under this principle.

  ### New Case: "The Buddha's Teachings Are True"  
  *Verdict:* **Applies**  
  *Why:* If "truth" implies svabhāva (e.g., doctrines as ultimately established), tetralemma dismantles it:  
  - *True?* No (not ultimately fixed).  
  - *False?* No (not conventionally meaningless).  
  - *Both?* No (contradictory).  
  - *Neither?* No (denies conventional validity).  
  *Outcome:* Teachings are dependently arisen conventions (upāya), empty but indispensable. Nāgārjuna does this explicitly in *Vigrahavyāvartanī* for his own claims.

  ### Defense of the Principle:
  - **Textual Basis:** Rooted in Nāgārjuna’s *Mūlamadhyamakakārikā* (MMK):  
    - Targets svabhāva: MMK 1:1 (causation), 18:1 (self).  
    - Emptiness of emptiness: MMK 13:7-8, 22:11.  
    - Tools as provisional: MMK 4:8-9 (tetralemma), 24:18 (two truths).  
    - Conventional non-rejection: MMK 24:36-39.  
  - **Resolves Self-Application Paradox:** By excluding *its own framework* from svabhāva-targeting, the principle avoids infinite regress. The tetralemma is a "ladder to be discarded" (Wittgenstein).  
  - **Non-arbitrary Line:** Tetralemma applies only when reification is detected (e.g., "production," "self," "truth") or when a tool risks becoming reified (emptiness, two truths).  
  - **Safeguards Against Nihilism:** By exempting conventions (tables, LEM), it prevents the "nihilist trap" of denying dependent arising.

  **Conclusion:** Your "working guess" was nearly correct but needed refinement: the tetralemma applies *only* to (1) **direct svabhāva-claims** *or* (2) **concepts/tools at risk of reification**. It never applies to uncontroversial conventions or its own logical apparatus. This is Madhyamaka's radical consistency: emptiness empties itself, the tetralemma tetralemmatizes itself, and the two truths are neither one nor two – yet all function conventionally without contradiction.
