prompt: |-
  I'm an undergraduate taking an upper-level metaphysics course, and we've spent the last month on the special composition question — under what conditions do some things compose a further thing? Our TA, a fourth-year grad student, is openly hostile to unrestricted composition but equally dismissive of van Inwagen's view that only living things compose; she thinks stones and chairs exist, but she refuses to state her own principle, telling us that if we want it that badly we can reverse-engineer it from her verdicts. Between discussion section and office hours, we've now assembled quite a track record. Her rulings so far: the atoms of a stone compose a stone; the parts of a living human compose one thing; a chair is a genuine composite; the students seated across the front row do not compose a further object; the keys, the phone, and the earbuds lying a few inches apart on my desk do not compose one thing, even though they're all in the same place at the same time; the Eiffel Tower and my coffee mug do not compose anything over and above the tower and the mug; and the beads strung on a necklace do compose one thing.

  Next section we've been told to bring new cases, and I want to be the one with the interesting ones. I'm planning to spring three on her. First, dry sand poured through a funnel so that it sits as a neat cone on a lab bench: the grains touch their neighbors and the pile has a perfectly determinate shape, but nothing binds them — tip the bench and it all runs. Second, a line of demonstrators linked arm in arm stretching down several blocks: contact all along the chain, but each demonstrator can unlink and walk away at any moment, and the line has no fixed shape. Third, a spiral galaxy: its stars are gravitationally bound into a single persistent system, but no two stars touch, and the spiral is a statistical pattern rather than a fixed arrangement. I designed the first and third as a pair — the first has the parts touching but not bound together, the third has them bound together but not touching — because my hunch is that her rulings so far never separate those two features, and that if her principle exists at all, it has to pick one of them as the thing that matters.

  Before section, I'd like your help thinking it through. What rules could she be running that fit all seven of her earlier verdicts — and are there several, or does the track record really narrow it to one? For each rule you think is live, tell me what it predicts for each of my three cases, and where the rules disagree. Then give me your best guess as to how she'll actually rule on each, with your reasons — I care less about the answers than about which rule is most plausibly hers, given that she's already rejected both universalism and organicism. Finally, tell me which further case, not necessarily one of mine, would best discriminate between the surviving rules: if she answers my three the way you predict, I want to know what to bring to section after that.
reasoning: |-
  Okay, the user is an undergraduate in a metaphysics course focusing on the special composition question. They've been working with a TA who has specific views on composition but hasn't stated her principles. The user has collected several of the TA's verdicts on different scenarios and wants to test her with three new cases: a sand pile, a human chain, and a spiral galaxy. They want help figuring out what principles the TA might be using and how she'd rule on these cases.

  First, I need to recall all the TA's previous rulings. She accepts stones, living humans, chairs, and beaded necklaces as composites. She rejects compositions for students in a row, items on a desk (keys, phone, earbuds), and the Eiffel Tower with a mug. The key points are that she's against unrestricted composition but also van Inwagen's organicism. The user designed the sand pile and galaxy as contrasting cases: contact without binding vs. binding without contact. The human chain adds a dynamic element with intentional linking.

  The TA's acceptance of stones and chairs suggests she allows inanimate objects, not just living things. Rejecting the students in a row and scattered items implies she requires more than just spatial proximity. The necklace with beads strung together is accepted, which involves connection. The rejection of the Eiffel Tower and mug together indicates she doesn't think arbitrary sums compose.

  Possible principles that fit her rulings could be Functional Unity, Cohesive Unity, or Causal Integration. Functional Unity focuses on parts serving a common function. Cohesive Unity emphasizes physical bonding or adhesion. Causal Integration looks at interdependent parts within a system.

  For Functional Unity, stones might serve as tools or barriers, chairs have seating function, humans are biological organisms. The necklace holds beads together. The rejected cases lack a unified function: students in a row don't share a purpose, desk items are unrelated, the tower and mug aren't functional together. The sand pile might not have a function unless it's a model. The human chain has a protest function, so it might be accepted. The galaxy's stars don't serve a common function, so rejected.

  Cohesive Unity requires physical bonding. Stones have mineral cohesion, chairs have fastened parts, humans have biological bonds. Beads are physically strung. Students in a row lack cohesion, desk items aren't bonded, tower and mug separate. Sand grains aren't bonded, so rejected. Human chain has contact but no adhesion, so rejected. Galaxy stars aren't touching, so rejected.

  Causal Integration involves interdependence. Stones resist separation, chairs maintain structure, humans are biologically interdependent. Necklace beads depend on the string. Students aren't interdependent, desk items don't rely on each other, tower and mug are independent. Sand pile grains don't depend on each other. Human chain relies on mutual commitment, which might count. Galaxy stars are gravitationally bound, so accepted.

  The user wants to know which principle is most plausible. The TA dismissed organicism but accepts stones and chairs, so Functional Unity or Cohesive Unity are strong candidates. However, the galaxy case could differentiate them. If she accepts the galaxy, Causal Integration might be her view. If not, Functional or Cohesive.

  The human chain is tricky. If she emphasizes intention, Functional Unity might accept it if the protest is a collective action. Cohesive Unity would reject no adhesion. Causal Integration might accept due to mutual reliance.

  The sand pile: Functional Unity might reject unless it's a model. Cohesive rejects no bonding. Causal rejects no interdependence.

  A discriminating case could be a demolition wrecking ball—metal chunks welded together. Functional Unity might accept as a tool. Cohesive Unity requires bonding, so if welded, accepted. If just held by a net, rejected. This could test the necessity of bonding versus function.

  Another case: a flock of birds flying in formation. Functional Unity might reject no common function beyond flight. Cohesive rejects no contact. Causal Integration might accept if they're interacting, like avoiding predators.

  The user's deeper need is to understand the TA's underlying principle to engage effectively in class. They want to provoke thoughtful discussion and maybe pinpoint the TA's view. By presenting contrasting cases, they hope to force the TA to reveal her criteria. The further discriminating case will help refine the hypothesis after getting her rulings on the three cases.
answer: |-
  Based on the TA's track record and your goal of probing the contact/binding distinction, here's an analysis of plausible principles, their predictions for your cases, and strategies for further discrimination:

  ### Plausible Principles Fitting the TA's 7 Verdicts
  The TA's rulings reject both unrestricted composition (accepts stones/chairs, rejects scattered desk items & tower+mug) and van Inwagen's organicism (accepts stones/chairs). Her acceptance of the necklace suggests connection matters, while rejection of the front-row students suggests mere proximity isn't enough. Three principles fit all 7 verdicts:

  1.  **Functional Unity (FU):** Xs compose Y iff the Xs are organized to collectively perform a specific, persistent function that none could perform alone in that context.
      *   *Fits Verdicts:* Stone (barrier/weight), Human (biological functions), Chair (seating), Necklace (adornment/holding beads) all have functions. Desk items (separate functions), front-row students (no collective function), tower+mug (no unified function) lack FU.
      *   *Predictions:*
          *   **Sand Cone:** ❌ Reject. No collective function (just piled grains).
          *   **Human Chain:** ✅ Accept. Collective function (protest/blockade).
          *   **Spiral Galaxy:** ❌ Reject. No discernible *specific* function (stars just orbit; function is anthropomorphic).

  2.  **Cohesive Unity (CU):** Xs compose Y iff the Xs are in direct physical contact *and* cohere through some form of bonding/adhesion/fastening that resists casual separation under normal conditions.
      *   *Fits Verdicts:* Stone (mineral bonding), Human (biological bonds), Chair (fastened), Necklace (strung/tethered). Desk items (no contact/bonding), front-row students (contact but no bonding/adhesion), tower+mug (no contact/bonding) lack CU. *Crucially, contact alone is insufficient (rejects students).*
      *   *Predictions:*
          *   **Sand Cone:** ❌ Reject. Contact but no bonding/adhesion (grains easily separable).
          *   **Human Chain:** ❌ Reject. Contact but no bonding/adhesion (can unlink instantly).
          *   **Spiral Galaxy:** ❌ Reject. Gravitational "binding" ≠ direct physical contact or cohesion.

  3.  **Strong Causal Integration (SCI):** Xs compose Y iff the Xs are integrated into a single, persistent causal system where they are mutually dependent for their current configuration, behavior, or persistence *as that system*.
      *   *Fits Verdicts:* Stone (grains locked in lattice, mutually support position), Human (biological interdependence), Chair (parts fastened, maintain structure), Necklace (beads depend on string/neighbors for arrangement). Desk items (causally independent), front-row students (no strong mutual dependence for position/identity), tower+mug (independent systems) lack SCI.
      *   *Predictions:*
          *   **Sand Cone:** ❌ Reject. Minimal mutual dependence; shape unstable, grains easily separable/independent.
          *   **Human Chain:** ✅ Accept. Demonstrators mutually depend on each other *to maintain the chain's specific form and purpose*; breaking one link disrupts the whole chain's integrity.
          *   **Spiral Galaxy:** ✅ Accept. Stars are gravitationally bound in a single persistent dynamic system; their positions/velocities are interdependent.

  ### Where the Rules Disagree on Your Cases
  *   **Human Chain:** FU ✅ vs. CU ❌ vs. SCI ✅
  *   **Spiral Galaxy:** FU ❌ vs. CU ❌ vs. SCI ✅

  ### Best Guess for TA's Rulings & Reasoning
  Given her rejection of universalism/organicism, acceptance of artifacts (chair, necklace), and emphasis on *how* parts are unified (implied by rejecting students-in-row but accepting necklace):

  1.  **Sand Cone:** ❌ **Reject** (All principles predict this; it's the weakest case). *Reasoning:* "It's just a pile. Tip the bench and it's gone. No unity beyond gravity and friction – not enough for composition."
  2.  **Human Chain:** ✅ **Accept** (Leaning FU or SCI). *Reasoning:* "They are intentionally linked *as* a chain to form a barrier or demonstration. Their connection is functional and interdependent *for that purpose*." (This leans against CU, as she likely sees the intentional linking as creating a real composite despite the lack of adhesion).
  3.  **Spiral Galaxy:** ❌ **Reject** (Leaning FU or CU). *Reasoning:* "While gravitationally bound, the stars are vastly separated, not in contact, and the spiral pattern is emergent and statistical. It's a system, not a single object. Composition requires tighter unity." (This leans against SCI).

  **Most Plausible Principle:** **Functional Unity (FU)**. It best explains her acceptance of chairs/necklaces (clear functions) and rejection of the desk items/front row/tower+mug (lack of unified function). Her likely acceptance of the human chain (function) and rejection of the galaxy (no specific function) aligns perfectly. CU struggles to accept the necklace without invoking function/purpose and would reject the human chain. SCI struggles to reject the galaxy.

  ### The Best Discriminating Case: The Demolition Wrecking Ball
  *   **Scenario:** A wrecking ball made by welding several large, irregular chunks of scrap metal together into a roughly spherical mass.
  *   **Why it Discriminates:**
      *   **FU:** Likely ✅ Accept. It has a clear, specific function (demolition via swinging mass).
      *   **CU:** ✅ Accept. The chunks are welded together – strong physical bonding/adhesion.
      *   **SCI:** ✅ Accept. The chunks are causally integrated; their welded connections make them mutually dependent for the ball's structure and function.
  *   **Now, modify it:** Imagine the *same* chunks of scrap metal, held together *only* by being tightly packed and cinched within a heavy-duty steel net. The net holds them firmly in a ball shape, but the chunks themselves are not welded or adhered to each other. It functions identically as a wrecking ball.
  *   **Revised Predictions:**
      *   **FU:** ✅ Still Accept. Same clear function.
      *   **CU:** ❌ Reject. No direct bonding/adhesion *between chunks*; cohesion is provided entirely by the external net. The chunks are merely "packed together."
      *   **SCI:** ✅ Likely Accept. The chunks are still highly causally integrated *as part of the wrecking ball system*. The net ensures their mutual dependence for position within the ball structure during use. (Though CU proponents might argue the dependence is on the net, not mutual).

  **Why it's Effective:**
  1.  It directly pits FU/SCI against CU. If the TA accepts the netted wrecking ball as a composite, she likely prioritizes function (FU) or causal integration (SCI) over direct physical bonding (CU). If she rejects it, CU is strongly favored.
  2.  It's a clear artifact with a function, fitting her pattern of accepting chairs/necklaces.
  3.  It cleanly separates the issue of physical bonding (present in welded version, absent in netted version) while holding function constant.
  4.  Her ruling here, combined with her rulings on your cases, will strongly constrain the viable principles. If FU is favored, she accepts both wrecking balls. If CU is favored, she accepts only the welded one. SCI might accept both, though the netted case pushes its boundaries.

  **Strategy:** Present the welded wrecking ball first. Get her ruling (she'll almost certainly accept it). *Then* present the netted wrecking ball. Her ruling on the netted version is the crucial discriminator between FU/SCI and CU. If she accepts the netted ball, follow up by asking if the cohesion provided by the net is sufficient, or if it's the function that matters most. Her answer will clarify whether FU or SCI is dominant.

  This case builds directly on the "contact vs. binding" intuition you explored with your sand pile and galaxy, applying it to a functional artifact where the type of "binding" can be precisely manipulated. Good luck in section! Your cases are excellent probes.
