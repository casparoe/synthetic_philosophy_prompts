answer: |-
  Here's a point-by-point adjudication of your exchange, with clear verdicts and an overall conclusion. I'll be decisive on each move and state which arguments succeed or fail, culminating in a final verdict on "rational irrationality."

  ### **Step 1: Friend’s Opening Move ("Incoherence of Deciding to Be Irrational")**
  - **Friend's Claim**: Deciding to become irrational is inherently contradictory because the act of deliberation presupposes rationality. Like "jumping over your own shadow."  
  - **Your Counter**: Analogies like Odysseus, bridge-burning, and penalty clauses show rational agents *can* constrain future selves.  
  - **Friend's Rebuttal**: Those are cases of *rational self-binding* (limiting options), not *becoming irrational* (changing preferences/decision-making).  
  - **Verdict**: **Friend wins this round**.  
    - **Why**: Your analogies fail. Odysseus retains rational agency (he desires the sirens but *chooses* constraint). The drug fundamentally alters decision-making, turning the agent into a "different kind of rational entity" (e.g., one who cannot compute self-interest). Genuine irrationality isn’t reliably targetable via rational choice.  

  ---

  ### **Step 2: Your Expected-Utility Pushback ("The Calculation is Straightforward")**
  - **Your Claim**: The pre-drug agent calculates: drug → survival vs. no drug → death. Acting on this is rational.  
  - **Friend’s Objection**: An irrational agent isn’t a "reliable instrument." The drug might cause unintended irrational behaviors (e.g., refusing to get in the car).  
  - **Your Reply**: This is an empirical objection, not conceptual. If the drug *only* prevents harming innocents, the calculation holds.  
  - **Verdict**: **You win this round**.  
    - **Why**: In a thought experiment, we assume the drug works *exactly as described* (targeted, no side effects). Conceptually, rational agents *can* use tools (even self-modification) to achieve goals. Friend’s objection conflates thought-experiment assumptions with real-world uncertainty.  

  ---

  ### **Step 3: Friend’s Shift ("The Drug Isn’t Making You Irrational")**
  - **Friend’s Claim**: If the drug only prevents harming innocents, it’s not irrational—it’s moral enhancement or consistency with latent values. The puzzle only works if we accept narrow self-interest as "rational," which the case *reductios*.  
  - **Your Reply**: This concedes the coherence of the act but shifts to criticizing narrow rationality. It doesn’t resolve the initial incoherence charge.  
  - **Verdict**: **Mixed result, but friend lands a critical blow**.  
    - **Why**:  
      - Friend is *correct* that Parfit’s case exposes a flaw in **narrow self-interest as the sole standard of rationality**. The drug doesn’t create "irrationality" but aligns the agent with *moral* or *long-term rational* principles.  
      - However, you’re *correct* that this abandons the original "incoherence" argument. Friend’s shift implicitly concedes the *conceptual possibility* of "rational self-modification" (even if it’s not "irrationality").  
    - **Net Win for Friend**: This move reframes the entire debate, exposing the crux of Parfit’s argument: narrow rationality self-destructs.  

  ---

  ### **Overall Verdict on the Exchange**  
  - **Who Won?**: **Your friend is more right overall**, but your expected-utility defense holds under the thought experiment’s assumptions.  
  - **Why Friend Wins**:  
    1. His core insight—that "becoming irrational" via rational choice is *pragmatically incoherent*—stands. True irrationality can’t be rationally engineered *as a tool* (it undermines instrumental reliability).  
    2. His shift to criticizing narrow rationality succeeds: the hitchhiker case is a *reductio* of self-interest, not an endorsement of "irrationality." The drug creates a *better rational agent* (aligned with morality/long-term survival), not an irrational one.  

  - **Why Your Points Hold Value**:  
    - You correctly defend the *formal coherence* of expected-utility calculations for self-modification (e.g., "rational self-binding" extended to preferences).  
    - Friend’s "unreliable instrument" objection fails *within the idealized thought experiment*.  

  ---

  ### **The Fate of "Rational Irrationality"**  
  - **Verdict**: **The concept needs reformulation and should be abandoned as literally stated**.  
    - **Why**:  
      1. **Incoherence**: Genuine irrationality (e.g., random or systematically flawed reasoning) cannot be a *reliable product* of rational design. If it’s reliable, it’s not irrational—it’s a *new form of rationality* (e.g., commitment strategies or moral dispositions).  
      2. **Misleading Framing**: Parfit’s case shows that *narrow self-interest* is self-defeating, not that "irrationality" is rational. The "irrational" hitchhiker is actually *more rational* in a broader sense (cooperative, trustworthy).  
      3. **Better Frameworks Exist**:  
         - **Rational Self-Binding**: Odysseus-style constraints (limiting *options*).  
         - **Preference Change**: Rationally adopting new values (e.g., "I will become someone who doesn’t rob").  
         - **Multi-Self Rationality**: The "pre-drug self" imposes a survival-compatible disposition on the "future self."  

  ---

  ### **Final Conclusion**  
  Your friend successfully dismantled the *literal* notion of "rational irrationality" by showing:  
  - Its inherent tension (Step 1),  
  - That the hitchhiker case actually critiques narrow rationality (Step 3).  
  You defended the *calculative logic* of self-modification (Step 2), but this works only if we reject the label "irrational" for the post-drug state. **Parfit’s point was never to endorse irrationality—it was to expand our view of rationality beyond immediate self-interest.** Drop the term "rational irrationality"; reframe the debate as "rational self-transformation" or "critique of narrow rationality."
