prompt: |-
  So, I help run a very small research outfit — two of us, plus the occasional contractor — and a funder has offered us about 18 months to do conceptual (explicitly not wet-lab) work on insect welfare. One condition they were pretty blunt about: they don't want another version of the standard scale argument, the "even if there's only a 1% chance insects are sentient, there are like 10^18 of them so the expected value dominates" piece. They've read that one, everyone has. Fine. But now I actually have to tell them what the 18 months goes on, and I want to pressure-test my own list against someone who's thought about this more than I have.

  Here's the hunch I keep coming back to, and I'd like you to say whether it's load-bearing or a distraction. People in this space talk about the probability of insect sentience as if it were a single number you nudge up or down with new evidence. But our credences across taxa aren't independent — they're all downstream of a small handful of shared commitments about what kind of neural organisation is enough for there to be something it's like to be. If you think a brain with on the order of a million neurons plus mushroom-body-style integration can support experience, then you probably think that about flies, bees and ants, and quite possibly about spiders and decapod crustaceans too (the UK's sentience legislation already covers cephalopods and decapods, on the strength of a review that leaned hard on exactly this shared-feature reasoning). If you don't, you probably don't for any of them. So maybe the real question isn't "what is P(sentience) for crickets" but "what's the distribution over the latent parameter that fixes P for a whole clade at once" — and the conclusion of the scale argument is far more sensitive to that latent variable than to any per-species estimate. If that's right it changes what's worth researching: you'd go hunting for the one assumption that, if it flipped, flips forty taxa simultaneously, and argue about that, instead of accumulating marginal evidence taxon by taxon.

  Given all that, rank the open questions we should spend the 18 months on. Candidates so far, plus anything I'm missing:
  - the latent-variable / correlated-credence thing above;
  - whether the right denominator is individuals, insect-days, or something else — a huge fraction of an insect's life is spent as a larva, and larval experience is barely discussed anywhere;
  - moral weight ratios: if insect experience is much less rich than a mouse's, how much does the arithmetic actually shrink, and is "richness" even the right dimension to scale by;
  - whether behavioural evidence (nociception, opioid modulation, learned avoidance, grooming-vs-feeding tradeoffs) is the bottleneck, or whether the bottleneck is that we have no account of what would count as evidence;
  - whether mass mortality in larval stages means most insect lives are net negative, and whether that claim survives scrutiny at all.

  For each: why it's upstream of the others, whether two people with no lab can make real progress on it in a year and a half, and what a usable output looks like for people who fund interventions rather than papers. Then give me the ordering you'd actually defend and the criteria you're using to generate it — I care much more about that than about the list. And be honest about where your reasoning is shakiest: which of these rankings would you reverse if I pushed back, and what argument or piece of information would change your mind?
reasoning: |-
  Okay, the user runs a small research team focused on insect welfare and has 18 months for conceptual work. The funder doesn't want the standard scale argument. The user has a hunch that the probability of insect sentience isn't independent across taxa but hinges on shared neural features. They want to know if this is crucial or a distraction and need help prioritizing research questions.

  First, I need to unpack their core insight. They're arguing that credences about different insect species' sentience are correlated because they depend on the same underlying neural criteria. If you accept that a certain brain structure (like mushroom bodies) supports sentience, then all species with that structure have a higher probability. This makes the latent parameter—what neural features are necessary—more important than per-species evidence. That seems valid. It shifts focus from individual species to the foundational assumptions.

  Now, looking at their candidate research areas:
  1. **Latent variable approach**: This is central. If credences are correlated, identifying the key neural thresholds could flip probabilities for many species at once. Progress here would involve reviewing existing literature on neural correlates of consciousness and modeling how changes in these thresholds affect overall expected value. Outputs could be frameworks for funders to prioritize interventions.
     
  2. **Denominator problem**: Is it individuals or insect-days? Including larval stages is important because they represent a significant portion of insect life. Research here would analyze life cycles and assess sentience likelihood at different stages. Outputs might be adjusted metrics for calculating welfare impacts.

  3. **Moral weight ratios**: Even if insects are sentient, how does their experience compare to vertebrates? This affects the expected value calculation. Research could survey philosophical views and empirical data on pain complexity. Outputs would be sensitivity analyses showing how different weight assumptions impact intervention effectiveness.

  4. **Evidence bottleneck**: What counts as evidence for insect sentience? Current debates might be stuck on defining criteria. Research here would map the arguments and propose testable criteria. Outputs include decision frameworks for evaluating new evidence.

  5. **Larval mortality net suffering**: If most larvae die early, are their lives net negative? This requires demographic analysis and welfare assessments. Outputs would be models estimating net suffering under different scenarios.

  The user's unspoken needs might include wanting actionable insights for funders, not just academic papers. They need research that directly informs where to allocate resources. Also, they might be worried about feasibility with a small team. Prioritizing questions that two people can tackle in 18 months without wet-lab work is crucial.

  Ranking these:
  1. **Latent variable approach**: It's the foundation. Changing a neural threshold affects all downstream estimates. Progress here maximizes leverage. Feasible via literature review and modeling. Outputs help funders target clades.
     
  2. **Evidence bottleneck**: Without clear criteria, evidence is ambiguous. Clarifying this accelerates future research. Conceptual analysis is feasible. Outputs provide evaluation tools.
     
  3. **Moral weight ratios**: Necessary for comparing interventions. Literature review and modeling are doable. Outputs show cost-effectiveness sensitivity.
     
  4. **Denominator problem**: Important but more technical. Lifecycle data exists; analysis is feasible. Outputs refine impact metrics.
     
  5. **Larval net suffering**: Depends on prior sentience probabilities. Less impactful if sentience is unlikely. Demographic modeling is possible but speculative. Outputs are conditional estimates.

  The shakiest part is ranking the evidence bottleneck over moral weights. If defining evidence is too philosophical, it might not yield practical tools. If pushed, I'd swap them. If a clear framework for evidence emerges quickly, it could be higher; otherwise, moral weights might offer more immediate value.

  The user's deeper need is to provide funders with decision-making tools under uncertainty. Focusing on high-leverage areas like the latent variable and evidence criteria addresses that directly. Ensuring outputs are user-friendly frameworks or models, not just papers, is key.
answer: |-
  Here's my pressure-tested ranking of your research priorities, based on leverage, feasibility for a 2-person team, and actionable outputs for funders. The core criterion is **expected value per research hour**, weighted by how directly it addresses the funder's fatigue with "scale arguments" while yielding intervention-relevant insights. I'll start with the ranking, then unpack each point and my reasoning.

  ### Final Ranking (Highest to Lowest Priority)
  1. **The latent variable / correlated credence framework**  
  2. **Whether behavioral evidence is the bottleneck (or evidence criteria are undefined)**  
  3. **Moral weight ratios**  
  4. **The denominator problem (individuals vs. insect-days, larval stages)**  
  5. **Net negativity of larval mortality**  

  ---

  ### Deep Dive: Analysis and Rationale
  **Ranking Criteria Explained:**  
  - **Upstreamness**: How many downstream assumptions depend on this?  
  - **Feasibility**: Can 2 non-lab researchers make material progress in 18 months?  
  - **Funder Output**: Does it generate concrete guidance (not just papers)?  
  - **Scale Argument Sensitivity**: Does it challenge the "1% chance × 10^18" structure?  

  #### 1. **Latent Variable Framework**  
  **Why #1**:  
  - **Upstreamness**: Highest. Your hunch is correct: this *is* load-bearing. Per-taxon estimates are noise if credences are dominated by 2–3 neural thresholds (e.g., "Do feedback loops in mushroom bodies suffice?"). Flipping one threshold could rescale P(sentience) for entire arthropod classes overnight.  
  - **Feasibility**: High. No lab needed. Tasks:  
    - Map existing neural correlates of consciousness (NCC) theories to arthropod neuroanatomy.  
    - Build a Bayesian network model showing how evidence (e.g., "finds feedback in bee mushroom bodies") updates P(sentience) across taxa via shared features.  
  - **Funder Output**: Game-changing. Deliver:  
    - A decision tree showing which NCC thresholds have highest leverage (e.g., "Resolving whether recurrent processing in central complexes implies sentience affects 80% of focal species").  
    - Priority list: "Test neural feature X in species Y, as it breaks correlations across Z clades."  
  - **Why It Beats Scale Arguments**: Makes the scale argument's weakness explicit—it's not about independent probabilities but system-level priors. Funders get a tool to allocate resources *away* from redundant taxon-by-taxon work.  

  #### 2. **Behavioral Evidence Bottleneck**  
  **Why #2**:  
  - **Upstreamness**: Critical but derivative. If latent variables define *what matters*, this asks *how we measure it*. Many debates (e.g., nociception vs. suffering) stall because we lack consensus on what constitutes evidence.  
  - **Feasibility**: High. Conceptual work only. Tasks:  
    - Audit 100+ papers to catalog "evidence thresholds" used in animal sentience literature.  
    - Develop a falsifiability framework: "If behavior X appears, what would rule out sentience?"  
  - **Funder Output**: Directly actionable. Deliver:  
    - An "evidence rubric" for funders: "Support interventions targeting species that exhibit [threshold-crossing behaviors]."  
    - Red-flag list: "Stop citing studies on [behavior] as evidence—it's consistent with reflex arcs."  
  - **Scale Argument Link**: Resolves the "1%" by clarifying how evidence updates P(sentience). If the bottleneck is undefined criteria, no amount of marginal evidence changes anything.  

  #### 3. **Moral Weight Ratios**  
  **Why #3**:  
  - **Upstreamness**: Mid-level. Depends on sentience probability but drastically scales impact. If insect experience has 0.001× the weight of a mouse, the 10^18 multiplier crumbles.  
  - **Feasibility**: High. Tasks:  
    - Meta-analysis of moral weight models (e.g., neuron-count heuristics, behavioral richness metrics).  
    - Test robustness: "At what weight ratio does releasing parasitic wasps become net harmful?"  
  - **Funder Output**: Practical metrics. Deliver:  
    - A sensitivity table: "If you believe weight is < 0.01× a vertebrate, prioritize [vertebrate charities]. If > 0.1×, prioritize [insect farming reforms]."  
  - **Scale Argument Impact**: Directly reduces the "dominates expected value" claim. Funders avoid wasting money if weight ratios are vanishingly small.  

  #### 4. **Denominator Problem**  
  **Why #4**:  
  - **Upstreamness**: Important but narrow. Shifts calculations (e.g., larval stages may double "insect-days") but assumes sentience probability is non-zero.  
  - **Feasibility**: Moderate. Tasks:  
    - Aggregate life-history data (e.g., % lifespan as larva in key species).  
    - Model how P(sentience) varies by life stage (e.g., larvae lack complex brains).  
  - **Funder Output**: Adjusted impact metrics. Deliver:  
    - An "insect-day calculator" for interventions: "Reducing larval mortality in beetles affects X× more days than adult welfare."  
  - **Limitation**: Less transformative—it tweaks the scale argument but doesn't challenge its foundation.  

  #### 5. **Net Negativity of Larval Mortality**  
  **Why Last**:  
  - **Upstreamness**: Lowest. Depends entirely on sentience probability *and* moral weight. If P(sentience) is low or weight is negligible, this is moot.  
  - **Feasibility**: Tricky. Requires demographic models + suffering estimates. Tasks:  
    - Simulate welfare distributions (e.g., "90% of flies die as eggs—is this -10 utils or neutral?").  
  - **Funder Output**: High-risk. Could justify ignoring larval welfare—or demand radical intervention.  
  - **Scale Argument Relevance**: Weak. If larval lives are net negative, scale *increases* expected harm, perpetuating the problem the funder dislikes.  

  ---

  ### Where My Reasoning Is Shakier (and What Would Change It)
  1. **Moral Weight vs. Evidence Bottleneck**:  
     - I ranked evidence criteria (#2) above moral weight (#3), but this could flip.  
     - **Pushback**: "If we can't agree on moral weight, all sentience probabilities are useless!"  
     - **Why I'd Change**: If you find moral weight debates are *more* stalled than evidence criteria. Evidence bottlenecks are academic; weight ratios directly affect funding allocations.  
     - **Mind-Changer**: A preprint showing funders defunded insect work after weight ratio disputes. Then swap #2 ↔ #3.  

  2. **Latent Variables as #1**:  
     - **Pushback**: "This is just meta-philosophy—funders want concrete biological answers!"  
     - **Defense**: The *output* isn't philosophy: it's a priority list like "Sequence genomes of 10 mushroom-body species to test shared circuitry." Correlated credences mean one breakthrough updates 100+ species.  
     - **Mind-Changer**: If key neural features (e.g., feedback loops) are already resolved, making per-taxon work essential. But they’re not—the UK legislation shows clade-wide reasoning dominates.  

  ---

  ### Final Thought: Your 18-Month Game Plan  
  **Outputs That Impress Funders**:  
  - A **decision dashboard** with sliders: "Set your neural threshold → see P(sentience) for clades → adjust moral weight → get intervention rankings."  
  - **One high-leverage empirical proposal**: Partner with a neuro lab to test your top neural correlate (e.g., "Do decapods show integrated learning?").  

  **Why This Order Wins**: It starts by attacking the scale argument’s core (latent variables), then arms funders with tools to allocate money wisely (#2–3), and only later optimizes metrics (#4–5). Two people can deliver this—focus on modeling, meta-analyses, and framework-building.  

  If this aligns, I’d stress-test your first latent variable model draft. If not, what’s your biggest reservation?
