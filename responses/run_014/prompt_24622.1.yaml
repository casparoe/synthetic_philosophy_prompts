prompt: |-
  I've been arguing with a friend for the best part of an evening about whether it is rational to discount the future, and we've gone in circles, partly because I suspect we keep using "discounting" to mean different things. To get some purchase on what I actually believe, I've been working through a list of concrete cases and recording my gut verdicts, and I'd like to know what principle, if any, captures the pattern, what it implies for cases I haven't considered, and which of my verdicts it forces me to drop.

  Here are the cases. (1) I would genuinely rather have a coffee now than an identical, certain cup in twenty minutes, and I do not think this preference is a bug or a failure of reasoning; it just feels like the kind of thing I'm allowed to want. (2) I am much less sure about myself over longer horizons: if a week of vacation were guaranteed in two years or in three, the pure timing of it barely moves me, and I can't bring myself to say the earlier one is meaningfully better. (3) I strongly prefer to undergo a painful but certain medical procedure now rather than an identical one a year from now, but I notice that my preference rests entirely on the fact that I might die, get sicker, or change my mind in the meantime; if all of that risk were removed, I think the timing would stop mattering. (4) I reject the practice, which I keep seeing in cost–benefit discussions, of discounting the welfare of people a century from now at a few percent per year; to me a child's death in 2100 is exactly as bad as one today, and I cannot see how the mere passage of time makes it less so. (5) Finally, the case that embarrasses me: I prefer one hundred dollars today to one hundred and five in a month, but I also prefer one hundred and five in two months to one hundred and five in a month, and when I line the two up I recognize the second preference as inconsistent with the first.

  My tentative principle, offered for testing rather than as a commitment, is that you should discount only when there is a real reason — uncertainty, mortality, the possibility of changed tastes, or the fact that an earlier good is enjoyed for a longer stretch — and that "pure" time preference, disliking an identical and certain outcome merely because it is later, is not a reason at all. But I'm not confident that principle explains case (1), where I do seem to have exactly that kind of pure preference and don't feel irrational about it. So I'd be grateful if you could state the principle, or a couple of candidates, precisely; say which of my cases motivates each clause; run it through at least one case I have not listed; and tell me honestly which of my verdicts it cannot accommodate and which one I should probably let go.
reasoning: |-
  Okay, the user is grappling with the concept of discounting the future and seeking a coherent principle that explains their intuitive judgments across various scenarios. They've presented five concrete cases where their feelings about time preference differ, and they're aware of potential inconsistencies.

  First, I need to unpack each case carefully. Case (1) shows pure time preference for immediate coffee, which they defend as rational. Case (2) reveals diminishing time sensitivity over longer periods. Case (3) highlights risk-related discounting (mortality/uncertainty) rather than pure time. Case (4) rejects intergenerational discounting on ethical grounds. Case (5) exposes a temporal inconsistency in monetary preferences.

  Their tentative principle distinguishes "real reasons" (uncertainty, changing tastes, duration effects) from "pure" time preference. But case (1) challenges this by validating a pure preference. The core tension is between descriptive reality (people do discount immediately) and normative ethics (should we discount future generations?).

  I recall economic models like exponential discounting (consistent) vs. hyperbolic discounting (time-inconsistent), and philosophical arguments like Parfit's identity objection. For case (1), the coffee scenario might involve duration-based reasoning (20m of anticipation) or visceral immediacy bias - reframing it as "experiencing the good longer" could reconcile it with their principle.

  The monetary inconsistency in case (5) is textbook hyperbolic discounting. Their principle correctly rejects this as irrational, so they should probably abandon that specific preference pattern. For the medical procedure (case 3), their awareness of risk dependence aligns perfectly with the principle.

  The real test is intergenerational ethics (case 4). Their stance rejects pure discounting for future people, which ethical frameworks like Ramsey's would support. But introducing survival uncertainty (e.g., asteroid risk) might legitimately justify minor discounting - a nuance they might accept.

  A modified principle emerges: Discounting requires justification beyond mere time passage. Valid justifications include: (1) Actual risk/uncertainty, (2) Changed states (identity/preferences), (3) Duration of benefit. Pure time preference is normatively questionable except possibly for visceral immediacy when benefit duration differs.

  Applying this to an unlisted case: Choosing between two painless dental appointments. With zero risk or preference change, timing shouldn't matter - aligning with their principle. But if one slot allows earlier resumption of eating, that's valid duration-based discounting.

  Ultimately, they should relinquish the inconsistent monetary preference (case 5) as irrational. Case (1) can be salvaged by recognizing implicit duration effects. Their rejection of generational discounting (case 4) holds strong, while case (3) and (2) are consistent. The refined principle preserves most intuitions while eliminating the inconsistency.
answer: |-
  Your struggle is profoundly insightful—you're grappling with the core tension between *descriptive* human psychology and *normative* rationality in time preferences. Your cases reveal a coherent pattern that aligns with philosophical and economic critiques of "pure" discounting. Below, I formalize your principle, test it against your cases, identify which verdict you should reconsider, and extend it to new scenarios.

  ---

  ### **Refined Principle (Normative Time Consistency)**  
  *Discounting future outcomes is rationally justified only if one of these conditions holds:*  
  1. **Uncertainty or Risk**: The future outcome is uncertain (e.g., mortality, changing circumstances).  
  2. **Changed States**: The recipient's identity, preferences, or capacity for welfare might differ (e.g., dementia, personal growth).  
  3. **Duration of Benefit**: Earlier access extends the *period* of enjoyment or relief (e.g., receiving money now allows investment).  
  *Pure time preference (disliking an identical outcome solely because it occurs later) is irrational or ethically indefensible.*

  ---

  ### **How Your Cases Motivate the Principle**  
  | **Case** | Your Verdict | Principle's Analysis |  
  |----------|--------------|----------------------|  
  | **(1) Coffee now vs. 20min** | Prefer now; feel rational | **Fits condition (3):** The "coffee now" gives 20min of anticipatory enjoyment *and* avoids 20min of craving. The outcome isn't identical—your subjective experience differs. |  
  | **(2) Vacation in 2 vs. 3 years** | Timing irrelevant | **Fits the principle:** No uncertainty, changed states, or duration advantage over such horizons. Pure time preference would be unjustified. |  
  | **(3) Medical pain now vs. later** | Prefer now due to risks; irrelevant if risks removed | **Fits condition (1):** Risk (death/sickness) justifies discounting. Without risk, no discounting is rational. |  
  | **(4) Child's death now vs. 2100** | Equally bad; reject discounting | **Fits the principle:** No uncertainty (assuming certainty), changed states (welfare loss is identical), or duration argument. Discounting is ethically indefensible. |  
  | **(5) $100 now > $105 in 1 month, but $105 in 2 months < $105 in 1 month** | Prefer $100 now; recognize inconsistency | **Violates the principle:** The second preference ($105 in 2m < $105 in 1m) is rational (sooner is better). But the first ($100 now > $105 in 1m) is pure time preference *unless* you invoke risk (e.g., inflation) or investment potential (condition 3). Without those, it's inconsistent. |  

  ---

  ### **Which Verdict Should You Abandon?**  
  **Case (5)'s first preference ($100 now > $105 in 1 month)** fails the test. If there's no risk or investment opportunity, preferring $100 now is pure time preference—and the *inconsistency* with your later preference proves it's irrational. Hyperbolic discounting (overweighting "now") is a common cognitive bias, not rationality.  

  **Case (1) survives** because "coffee now" isn't identical: it includes relief from craving and anticipation, extending the benefit duration (condition 3). If the coffee were magically forgettable and craving-free, pure delay might not matter.

  ---

  ### **Testing the Principle: New Cases**  
  **Case (6): Painless dental appointment**  
  - *Scenario:* Choose between a 10-minute cleaning now or in 2 hours. No risk, no changed states.  
  - **Principle's verdict:** Indifference. No justification for discounting.  
  - **Real-world test:** Most people would choose "now" to avoid dread, but this invokes *anticipatory disutility* (similar to your coffee craving), fitting condition (3). If dread were eliminated, indifference would be rational.  

  **Case (7): Donating $100 today vs. in 30 years**  
  - *Scenario:* You can save one life via charity today or in 30 years. Assume charity efficiency and need are identical.  
  - **Principle's verdict:** Indifference. Saving a life today vs. future is equally valuable (like your child's death case).  
  - **Implication:** Discounting in climate policy (e.g., valuing future lives less) violates the principle unless based on risk (e.g., extinction odds).  

  ---

  ### **Why Your Tentative Principle Works (With One Fix)**  
  Your instinct is correct: "pure" time preference is normatively bankrupt. It leads to:  
  - **Ethical violations:** Devaluing future generations (Ramsey called pure discounting "a practice which is ethically indefensible").  
  - **Dynamic inconsistency:** Your money preference (case 5) makes you predictably exploitable (e.g., always taking $100 now, then paying to delay tasks).  

  **The one refinement:** Explicitly state that "identical outcomes" must account for *subjective experience duration*. Coffee now vs. later differs in the *timeline of utility* (craving → relief vs. waiting → relief), making them non-identical. This resolves case (1).  

  ---

  ### **Key Takeaway**  
  You’ve identified a deep truth: **rational time preferences track *causal differences* in outcomes, not calendar dates.** Hold firm on cases (2), (3), and (4). Relinquish the inconsistent monetary preference in (5), and reframe (1) as a duration-of-benefit case. In policy, reject pure discounting—future lives matter equally.
