prompt: |-
  Write me a short story built round something like Kavka's toxin puzzle. A woman gets offered a pile of money — hers straight away, irrevocably, already sitting in her account — on the one condition that tonight, at midnight, she genuinely intends to drink a glass of something foul tomorrow afternoon that'll leave her puking and headachey for a day. By the time the drinking hour comes round, the cash is safely hers, nobody's checking, and she's got no reason on earth to touch the stuff. The wrinkle I want in it: the fella offering the deal reckons intentions are cheap, so he also wants her to bet on herself at even odds that she'll actually go through with it, stake taken out of the payout, and he pays up either way. What I'm really after is that gap between intending to do a thing and merely predicting you'll do it — let the story sit in the gap rather than wriggling out of it with a loophole or a clever trick. Third person, 1,500 words or so, and dont let her off the hook.
