prompt: |-
  I'm the deputy head of a private secular secondary school in Brussels with about 900 students, and every year we field a steady trickle of requests for religious accommodation that our current practice handles ad hoc, and inconsistently — the same request has been granted by one year head and denied by another, and parents have started noticing. The deeper problem is that our governing board is split along a fault line that I've come to realize is genuinely philosophical: roughly half the board was educated in the French tradition and takes the laïcité view that a school's job is to maintain a neutral common space from which communal identities are set aside, and the other half is Anglo-American and takes the multiculturalist view that refusing accommodations is itself a choice that quietly privileges the majority's holidays, food, and dress as the unmarked default. Every time we try to settle a case, the meeting replays this dispute at full volume and decides nothing. What I want is not for you to referee the board, but to give me something the school can actually run.

  Please write a decision procedure, in the form of an ordered list of questions with criteria, that our year heads could apply to any accommodation request in under an hour: the questions to ask in sequence, what counts as a sufficient answer at each step, the points at which the procedure terminates in a no, and — crucially — the points at which it must stop and hand the decision up, because what remains is a question of values the procedure cannot resolve and only the board can. The conceptual work I'm asking for is in the translation: the procedure should be honest about which parts of the school's stance come from laïcité-type reasoning (uniform treatment, the school as a space of emancipation from inherited community, equality as sameness before the institution) and which from multiculturalist reasoning (recognition, the claim that neutrality is a myth because the default already encodes the majority culture, equality as sometimes requiring differential treatment), and it should mark clearly where those two traditions would give different answers to the same question rather than smuggling one in. It should also state its own failure modes — for instance, where treating all religions identically becomes a rule that only ever bites on minorities, or where case-by-case accommodation drifts into an implicit ranking of which faiths are serious.

  Then run the procedure on three requests we actually received last year: a fifteen-year-old who wants to wear a headscarf in PE and in class; a group of parents asking that afternoon exams during Ramadan be moved to the morning; and parents asking that their daughter be excused from co-ed swimming lessons. I'd like to see where the procedure gives a firm answer, where the two traditions embedded in it would diverge, and at least one point where it produces an outcome the board majority will dislike — I suspect that if we take our neutrality rhetoric seriously it commits us to things about crucifix necklaces and birthday cakes that nobody on the board has thought through. Finally, tell me what the procedure cannot do: the kinds of requests that will come to us and that it was never built to handle, and where it will misfire if we lean on it for a decade. Keep in mind our constraints: year heads are not philosophers, decisions must be explainable in writing to parents in two languages, every ruling sets a precedent we can be held to, and the Ramadan question comes back annually whether we have a framework or not.
reasoning: |-
  Hmm, this is a complex and nuanced request from a deputy head at a Brussels secondary school. They're dealing with fundamental philosophical tensions between laïcité and multiculturalism that paralyze their board, and need a practical decision framework that acknowledges both traditions while being actionable by non-philosopher staff.

  The core challenge is designing a procedure that transparently shows where the French and Anglo-American perspectives diverge, without pretending these differences don't exist. The user specifically wants:
  - A step-by-step flowchart-like Q&A for year heads
  - Clear demarcation of "values decision" handoff points to the board
  - Honest labeling of which principles derive from which tradition
  - Application to three real cases (headscarf, Ramadan exams, swimming exemption)
  - Identification of the framework's limitations and failure modes

  Key constraints mentioned:
  - 900 students in secular private school
  - Must produce written rulings in two languages
  - Every decision sets binding precedent
  - Annual recurrence of issues like Ramadan
  - Year heads aren't philosophers - must be executable in <1 hour

  For the decision procedure, I'll structure it as a tiered funnel:
  1. Threshold questions (e.g., legal compliance, safety)
  2. Identity-blind accommodations (could apply to any group)
  3. Tradition-specific divergence points (explicitly tagging laïcité vs multicultural reasoning)
  4. Institutional capacity gates
  5. Values-based handoffs to board

  The three test cases will reveal interesting tensions:
  - Headscarf: Accommodation might pass multicultural test but fail laïcité's "emancipation" principle
  - Ramadan exams: Identity-blind adjustment possible if framed as "peak cognitive hours"
  - Swimming: Likely hits handoff to board over bodily autonomy vs gender equality

  Crucially, the procedure must expose where "neutrality" actually privileges majority norms - like how disallowing all head coverings disproportionately affects Muslim girls while permitting small crosses. Similarly, it should flag when "equal treatment" becomes inequitable by ignoring minority burdens.

  Long-term limitations to highlight:
  - Can't resolve core philosophical disagreements
  - May ossify over time without review
  - Struggles with new/unforeseen requests
  - Potential for inconsistent application across year heads
  - Doesn't address cumulative impact of accommodations

  The solution should empower year heads to resolve 80% of cases while forcing the board to explicitly own their value judgments on the remaining 20%. By making the philosophical tensions visible rather than implicit, it might actually help the board develop a coherent institutional stance over time.
answer: |-
  Below is a **Religious Accommodation Decision Procedure** designed to resolve 80-90% of requests consistently while transparently flagging philosophical conflicts. It prioritizes **practical school operations**, **legal compliance**, and **educational integrity**, with clear off-ramps to the board when core values clash. Each step identifies the underlying principle (L for *laïcité*, M for *multiculturalism*).

  ---

  ### **Religious Accommodation Decision Procedure**  
  *(For Year Heads — Max 60 minutes per request)*  

  1. **QUESTION 1: Is this request mandated by Belgian/Flemish law?**  
     - *Criteria:* Check official legal databases (e.g., Centre for Equal Opportunities). If yes → **Approve**.  
     - *Termination:* If legally required → **YES**.  
     - *Principle:* Legal obligation (Shared L/M).  

  2. **QUESTION 2: Does the request disrupt core educational function/safety?**  
     - *Criteria:* Physical safety (e.g., loose clothing near lab equipment), exam integrity, or unavoidable group participation (e.g., collaborative exams).  
     - *Termination:* If disruption is unavoidable → **NO**.  
     - *Principle:* Educational neutrality (L), Universal safety (M).  

  3. **QUESTION 3: Can the accommodation be made identity-blind?**  
     - *Criteria:* Could this option be available to *any* student for *any* reason? (e.g., "Any student may wear non-uniform headwear if medically certified" vs. "Muslim girls may wear headscarves").  
     - *Sufficient Answer:* If yes → **Approve** (e.g., flexible exam times for all).  
     - *Termination:* If feasible → **YES**.  
     - *Principle:* Uniform treatment (L), Inclusivity without labeling (M).  

  4. **QUESTION 4: Does denying this impose a unique burden?**  
     - *Criteria:* Does refusal force the student to violate sincerely held beliefs *or* significantly disadvantage them (e.g., fasting students taking exams at 4 PM)?  
     - *Sufficient Answer:* If no burden → **NO**.  
     - *Handoff:* If burden exists → **Proceed to Q5**.  
     - *Principle:* Equality as sameness (L) vs. Equality as fairness (M). *Here L/M diverge: L sees burden as personal choice; M sees it as systemic exclusion.*  

  5. **QUESTION 5: Is there a non-religious equivalent already accommodated?**  
     - *Criteria:* Has the school allowed similar adjustments for non-religious needs? (e.g., excused swimming for body anxiety, morning exams for ADHD).  
     - *Sufficient Answer:* If yes → **Approve** (to avoid discrimination).  
     - *Termination:* If no equivalent → **Proceed to Q6**.  
     - *Principle:* Anti-hypocrisy (Shared L/M).  

  6. **QUESTION 6: Does accommodation create hierarchy among beliefs?**  
     - *Criteria:* Would approving this require judging the "validity" of a belief? (e.g., "Is Ramadan more important than Pagan holidays?").  
     - *Handoff:* If yes → **REFER TO BOARD**.  
     - *Principle:* State neutrality (L) vs. Recognition equity (M). *L/M diverge: L forbids "ranking" faiths; M permits assessing cultural impact.*  

  7. **QUESTION 7: Does accommodation alter the school’s common space?**  
     - *Criteria:* Would this visibly segment students (e.g., gender-segregated swim) or redefine shared norms (e.g., removing all religious symbols vs. allowing some)?  
     - *Handoff:* If yes → **REFER TO BOARD**.  
     - *Principle:* School as emancipatory space (L) vs. School as pluralistic space (M). *Core conflict.*  

  ---

  ### **Failure Modes & Limitations**  
  - **Majority-Culture Blindspots:** Neutral rules (e.g., "no head coverings") appear fair but disproportionately burden minorities (e.g., Sikh turbans vs. baseball caps). *Procedure flags in Q4/Q5.*  
  - **Implicit Theology:** Case-by-case approvals risk judging "sincerity" (e.g., is a hijab "more essential" than a crucifix?). *Mitigated by Q6 handoff.*  
  - **Precedent Creep:** Accommodations may expand over time (e.g., Ramadan → all fasting holidays). *Controlled by Q3 (identity-blind framing).*  
  - **Cannot Resolve:**  
    - **Philosophical deadlocks** (e.g., "Is hijab emancipatory or oppressive?").  
    - **Cumulative impact** (e.g., 50 swimming opt-outs undermining curriculum).  
    - **Emergent identities** (e.g., neo-pagan holidays not in databases).  
    - **Social coercion** (e.g., peer pressure to wear religious symbols).  

  ---

  ### **Case Applications**  

  1. **Headscarf in PE/Class**  
     - Q1: Not illegal → Proceed.  
     - Q2: No safety disruption (modern sports hijabs secure) → Proceed.  
     - Q3: *Not identity-blind* (request specifies religious garb) → Proceed.  
     - Q4: Unique burden? L: *No* (personal choice). M: *Yes* (religious obligation). → **HANDOFF to Board**.  
     - *Divergence:* L denies (uniformity); M approves (recognition). Board must decide: Is the school’s "neutrality" symbolized by identical dress (L) or by inclusive diversity (M)?  

  2. **Ramadan Afternoon Exams → Morning**  
     - Q1: Not legally required → Proceed.  
     - Q2: Disruption? Exams are time-sensitive but movable → Proceed.  
     - Q3: **Yes!** Frame as: "All students may request exam rescheduling for health/wellness reasons with doctor/guardian note." → **APPROVE**.  
     - *Outcome:* Identity-blind solution satisfies both traditions. Avoids religious ranking.  

  3. **Excused from Co-ed Swimming**  
     - Q1: Not illegal → Proceed.  
     - Q2: Disruption? Yes if many opt out; but one student? Debatable → Proceed.  
     - Q3: *Not identity-blind* → Proceed.  
     - Q4: Unique burden? M: *Yes* (modesty doctrine). L: *No* (school as secular space) → Proceed.  
     - Q5: Non-religious equivalent? **Yes** (e.g., excused for anxiety/phobia) → **APPROVE**.  
     - *Board’s Uncomfortable Truth:* If secular exemptions exist (Q5), denying religious ones is discriminatory. *But* if many requests follow, Q7 triggers handoff for cumulative impact.  

  ---

  ### **What the Procedure Cannot Do**  
  - **Solve Board’s Values Split:** Forces explicit votes on handoffs (Q6/Q7), creating precedents.  
  - **Handle Gray-Area Sincerity:** A student demanding accommodation for a self-defined belief.  
  - **Address Cultural vs. Religious Requests** (e.g., veganism as ethical vs. Hindu/Buddhist practice).  
  - **Prevent Strategic Requests:** e.g., Secular students using Q3’s wellness claim to avoid exams.  
  - **Replace Broader Policy:** Requires annual review (e.g., rising Muslim population → Q3 adjustments).  

  ---

  ### **Implementation Advice**  
  1. **Train Year Heads** on Q3 (identity-blind framing) as the keystone.  
  2. **Document All Decisions** in a searchable database to ensure consistency.  
  3. **Board Handoffs:** Require a values statement (e.g., "We deny headscarves to preserve uniformity as our primary good").  
  4. **Ramadan Fix:** Pre-empt Q3 by building flexible exam scheduling into the academic calendar.  

  This procedure forces the board to confront its contradictions *operationally* while empowering year heads to act. It accepts that 10-20% of cases will expose irreconcilable values — but makes those choices visible, auditable, and accountable.
