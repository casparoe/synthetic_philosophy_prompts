prompt: |-
  I'm presenting at a decision-theory workshop in about six weeks, and I'm defending a version of the money-pump argument for diachronic rationality, so I want to be ready for the question period before I even get there. My thesis, roughly: an agent whose preferences are locally rational at each time but globally incoherent — intransitive across a set of prospects, or unstable over time in a way that lets a patient bookie extract a sure loss — is irrational in a genuine, substantive sense, and the money pump is the best available argument for this. My sketch goes like this: I lay out a cycle of small trades, each of which the agent would accept if offered in isolation, such that completing the cycle leaves her strictly worse off; I then argue that the defect is not merely that she'll lose money if she happens to make a bad sequence of choices, but that the preference structure itself is incoherent, and that the only escape is a precommitment device — whose very necessity I take as evidence of the underlying defect. A colleague warned me that the decision theorists in the room will see through the argument within a minute, and that the economists will keep trying to flatten it into "no arbitrage," so I'd rather anticipate that now.

  The room is mostly decision theorists who know the Dutch-book and money-pump literature cold, plus two or three economists who think in terms of revealed preference and arbitrage and are skeptical that the philosophical framing adds anything, and one philosopher of action who keeps asking what the argument actually establishes about normativity rather than about trading. Prepare me for the question period from *this* room, not the generic objections I'd get from a different crowd. Give me the six to eight objections I'll actually get, ordered by how much damage each would do to my thesis, each phrased the way the person who raises it would phrase it — the decision theorists technical and already halfway to their own reply, the economists reductionist, the philosopher of action pressingly abstract. For each, give me a two-minute reply and a note on where that reply is soft. And close with the one objection I'm hoping nobody asks: the one that would actually threaten the argument rather than just test whether I know the literature.
reasoning: |-
  Okay, the user is presenting at a decision-theory workshop in six weeks and wants to prepare for the Q&A. They're defending a money-pump argument for diachronic rationality. Their thesis is that an agent with locally rational but globally incoherent preferences is genuinely irrational, and the money pump is the best argument for this. They want to anticipate objections from a specific audience: decision theorists familiar with Dutch books and money pumps, economists who think in terms of revealed preference and arbitrage, and a philosopher of action focused on normativity.

  First, I need to recall the money-pump argument. It shows how an agent with intransitive preferences can be exploited through a series of trades, ending up worse off. The user emphasizes that the defect is the preference structure itself, necessitating precommitment as evidence of irrationality.

  The audience breakdown: Decision theorists will know the literature well and might have technical objections. Economists might reduce it to "no arbitrage," missing the normative point. The philosopher will question what it establishes normatively.

  Key objections to anticipate:
  1. **Resolute Choice (Decision Theorist):** McClennen's idea that agents can stick to plans despite changing preferences. This directly challenges the necessity of precommitment devices. The user's reply should argue that resolute choice requires foresight and isn't always possible, but this is soft because resolute agents avoid exploitation without precommitment.
     
  2. **Sophisticated Choice (Decision Theorist):** Agents might foresee the cycle and avoid starting it. This counters the exploitation claim. Reply: Sophistication still reveals the preference defect, as they avoid trades they'd otherwise accept. Soft because it doesn't address the underlying incoherence.

  3. **Costly Precommitment (Economist):** If precommitment is costly, it's rational to avoid it. Reply: The need for any precommitment shows irrationality, regardless of cost. Soft because in practice, costs matter, and economists prioritize efficiency.

  4. **Arbitrage as Sufficient (Economist):** Why not just say "no arbitrage" without normative claims? Reply: Arbitrage avoidance is descriptive; the argument shows irrationality. Soft because economists might see normative claims as unnecessary.

  5. **Revealed Preference (Economist):** If the agent doesn't make the trades, preferences aren't revealed as intransitive. Reply: Counterfactual dispositions matter. Soft because revealed preference theory rejects unobservables.

  6. **Normative Ambiguity (Philosopher):** Does incoherence imply irrationality or just vulnerability? Reply: Incoherence prevents consistent goal pursuit, which is irrational. Soft because defining rationality is contentious.

  7. **Small-Stakes Objection (Decision Theorist):** With small stakes, rationality might allow minor incoherencies. Reply: The principle is what matters, not stakes. Soft because pragmatically, small stakes might be ignored.

  8. **Diachronic Bootstrapping (Decision Theorist):** Why prioritize synchronic over diachronic rationality? Reply: Diachronic incoherence undermines agency over time. Soft because it might not convince those who view rationality as time-slice based.

  The "hope nobody asks" objection: **The No-Loss-No-Gain Escape.** If the agent is indifferent at each step, they might not end up worse off. This threatens the argument's core. Reply: Genuine indifference is rare; weak preferences can still be pumped. But it's soft because some cases might avoid loss through indifference.

  The user's deep needs: They want to defend the substantive irrationality of incoherent preferences, using precommitment necessity as evidence. They need to counter reductionist views and establish the philosophical significance. Anticipating the toughest objections, especially from experts, is crucial for credibility. The unspoken need might be to assert the relevance of philosophical framing in decision theory against economic reductionism.
answer: |-
  Below is a tailored Q&A prep for your specific audience, ordered by the potential damage to your thesis (most damaging first). I've modeled objections in the voices of each group, provided concise 2-minute replies, noted soft spots, and ended with the "nightmare objection." Focus on your core claim: *The necessity of precommitment exposes a deep incoherence, making the agent substantively irrational—not just vulnerable to exploitation.*

  ---

  ### **1. The "Resolute Choice" Escape (Decision Theorist)**  
  *"Why assume the agent is myopic? McClennen's resolute chooser recognizes the cycle upfront and commits to refusing *all* trades. No money is pumped, no precommitment device needed—so where's the irrationality?"*  
  **Damage Level:** High (directly challenges your "necessity of precommitment" thesis).  
  **Reply:** "Resolute choice *is* a precommitment strategy—it requires the agent to override their local preferences at T1 to avoid global loss. If the agent *needs* resolution to avoid incoherence, that *proves* their underlying preferences are defective. Without it, they’d accept each trade serially and lose. Resolution isn’t rationality; it’s a corrective for irrationality."  
  **Soft Spot:** Resolutists argue that planning *is* rational agency. Your retort frames resolution as a "patch," but McClennen sees it as rational. You’ll need empirical evidence that humans aren’t naturally resolute.  

  ---

  ### **2. Sophisticated Foresight Avoids Exploitation (Decision Theorist)**  
  *"A sophisticated agent foresees the cycle and rejects the *first* trade. No loss occurs, so why call them irrational? Their choices are consistent with their beliefs about future actions."*  
  **Damage Level:** High (undercuts exploitation, your key evidence).  
  **Reply:** "True, they avoid loss—but only by refusing a trade they *currently prefer*. This reveals a contradiction: their synchronic preference at T1 endorses the trade, but their diachronic awareness blocks it. The defect persists: their preferences can’t guide action over time without self-sabotage. Sophistication masks but doesn’t cure the incoherence."  
  **Soft Spot:** Economists may nod here—it looks like "rational foresight." Stress that *avoiding a preferred choice* is pathological, even if prudent.  

  ---

  ### **3. "Precommitment Costs Make It Irrational" (Economist)**  
  *"If precommitment is costly (e.g., locking away $100 to avoid a $1 pump), isn’t it rational to *risk* the cycle? Expected utility might favor accepting the defect."*  
  **Damage Level:** Medium (reframes your "evidence" as irrational).  
  **Reply:** "The issue isn’t the cost/benefit of precommitment *per se*—it’s that the agent *needs* it at all. A coherent agent wouldn’t face this dilemma. Needing a costly fix for self-inflicted vulnerability *is* the irrationality. Arbitrage arguments can’t capture this; it’s about structural inconsistency, not dollars."  
  **Soft Spot:** Economists see this as hand-waving. Emphasize that even *costless* precommitment being necessary is damning.  

  ---

  ### **4. "Arbitrage Suffices—Drop the Normative Baggage" (Economist)**  
  *"Why invoke ‘irrationality’? We can say intransitive preferences create arbitrage opportunities. All you’ve shown is that markets punish incoherence—no philosophy needed."*  
  **Damage Level:** Medium (reduces your thesis to descriptivism).  
  **Reply:** "Arbitrage explains *exploitability*, not irrationality. My point is normative: an agent *should* conform to transitivity/diachronic consistency *because* failing to do so undermines their agency—even if no bookie exists. Revealed preference can’t distinguish ‘coherent but unlucky’ from ‘incoherent’—the money pump does."  
  **Soft Spot:** Economists may insist arbitrage *defines* rationality. Cite Sen: "Rational fools" can satisfy no-arbitrage but act against their own goals.  

  ---

  ### **5. "Revealed Preference Dissolves the Cycle" (Economist)**  
  *"If the agent completes the cycle, their preferences are transitive *by definition*—revealed preference trumps your thought experiment. If they refuse, no cycle exists."*  
  **Damage Level:** Medium (denies intransitivity can be real).  
  **Reply:** "Revealed preference assumes consistency over time, which begs the question. The money pump *tests* this: if an agent reveals A>B, B>C, and C>A in sequential choices, they’re diachronically incoherent. Counterfactuals matter—they’d *locally* accept each trade, revealing the latent defect."  
  **Soft Spot:** Hardcore revealed-preference theorists reject counterfactuals. Stand firm: "Otherwise, we can’t criticize *any* dynamic inconsistency."  

  ---

  ### **6. "What Normative Work is 'Incoherence' Doing?" (Philosopher of Action)**  
  *"So the agent loses money—does that make them *irrational*, or just poorer? Why is ‘incoherence’ a normative failure rather than a practical one?"*  
  **Damage Level:** Low (tests foundations but fixable).  
  **Reply:** "Incoherence prevents unified agency over time. An agent who pays to cycle back to their initial state contradicts their own goal-seeking nature—they’re systematically thwarting their interests. That *is* substantive irrationality, akin to a logical contradiction in belief. The loss is evidence, not the essence."  
  **Soft Spot:** Leaves "goal-seeking nature" undefined. If pressed, anchor in minimal agency: "Rationality requires non-self-undermining preferences."  

  ---

  ### **7. The "Small-Stakes" Immunity (Decision Theorist)**  
  *"With trivial stakes, the agent might accept each trade due to indifference thresholds. Completing the cycle costs pennies—so what? Rationality doesn’t require microscopic consistency."*  
  **Damage Level:** Low (nuances but doesn’t break your argument).  
  **Reply:** "Scale isn’t the point. The argument is *structural*: if they accept *non-trivial* cycles (e.g., A>B> C>A with significant value differences), they’re vulnerable. We can always scale up the stakes to make it consequential. Indifference thresholds are a separate, descriptive issue."  
  **Soft Spot:** Decision theorists know Rabin’s calibration theorem—small stakes *can* imply big problems. Concede this but refocus on structure.  

  ---

  ### **8. Diachronic Rationality is Question-Begging (Decision Theorist)**  
  *"You’re assuming diachronic coherence is a requirement. But if rationality is time-slice local (e.g., Hedden), why prioritize the ‘global’ perspective? Your ‘defect’ is just a philosopher’s fetish."*  
  **Damage Level:** Low (expected pushback).  
  **Reply:** "A time-slice view can’t explain why precommitment is *necessary*—it reduces agency to unconnected moments. But we plan, regret, and bind our future selves. If diachronic incoherence forces you to disown your past/future choices, that fractures agency. The money pump makes this visceral."  
  **Soft Spot:** Hedden’s supporters will say you’re conflating identity with rationality.  

  ---

  ### **The Nightmare Objection: "The No-Loss-No-Gain Escape"**  
  *(You’re hoping nobody asks this—it’s the killer if framed right)*  
  **Objection (Decision Theorist):** "Your cycle requires strict preference at each step. But if the agent is *indifferent* between A and A- (where A- is A minus a penny), they might accept the first trade (A to B) but then *pay nothing* to return to A later. No net loss occurs—so no pump. Intransitivity without strict dominance isn’t exploitable."  
  **Why It’s Devastating:** It severs the link between intransitivity and sure loss. If indifference breaks the cycle, your "strictly worse off" claim collapses, and precommitment isn’t needed.  
  **Reply (2-min):** "First, genuine indifference is rare—agents usually have weak preferences (e.g., B ≽ A- but A ≻ A-). Second, we can design a *smooth* pump: offer B+ε for A, then C+δ for B+ε, then A for C+δ. If they accept all (plausible with weak preferences), they pay ε+δ. Third, if they *are* truly indifferent, they’re still vulnerable to ‘fear-of-missing-out’ pumps where uncertainty forces strict choices."  
  **Soft Spot:** This relies on psychological assumptions. Hardliners (e.g., Gustafsson) argue strict cycles *are* essential—so your reply must cite real-world weak-preference pumps.  

  ---

  ### **Final Prep Advice**  
  - **Lean into precommitment:** Your strongest card is that *needing external fixes* proves irrationality. Hammer this against resolute/sophisticated objections.  
  - **Anticipate alliances:** Economists may side with decision theorists on "foresight avoids loss." Preempt by distinguishing *avoidance* from *coherence*.  
  - **Philosopher as ally?** Use their "normativity" question to elevate your point: "Yes, this *is* about agency—not just money."  
  - **Nightmare mitigation:** Cite literature on *weak-money-pumps* (e.g., Arntzenius). Admit strict cycles are idealized but argue they reveal a *structural hazard*.  
    
  You’re ready. This crowd will test you, but your framing is defensible—and the nightmare objection is rare. If it surfaces, stay calm: "Ah, the smooth pump—let me clarify..." and deploy your reply. Good luck!
