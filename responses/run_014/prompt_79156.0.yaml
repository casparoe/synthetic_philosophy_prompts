answer: |-
  1. Not purely verbal: The dispute involves genuine ontological commitments (e.g., whether spacetime points exist independently) highlighted by arguments like the hole argument in GR, where substantivalists see distinct possibilities under diffeomorphism.  
  2. No hidden factual/formal question: Both interpretations are empirically equivalent under current physics (GR), making it metaphysical; the disagreement centers on how to interpret identical formal structures.  
  3. Not distinct questions: Both sides address the same core issue—whether spacetime is a fundamental entity or derivative of relations—but clash over intuitions about "what exists."  
  4. Bedrock intuitions: Substantivalism relies on spacetime as a container (Newton's absolute space), while relationism demands all motion be reducible to material relations (Mach's principle); neither is provable from first principles.  
  5. Progress requires: A theory (e.g., quantum gravity) that either eliminates the metric's independence or empirically distinguishes the interpretations, forcing ontological revision.
