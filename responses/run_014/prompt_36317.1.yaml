  ### Thought Experiment: The Burden of Knowledge

  **Scenario:**  
  Alice is considering switching from her stable, moderately satisfying job to a new, exciting job offer. The new job is either solid (state G, 50% chance) or shaky (state B, 50% chance). She must decide whether to stay (act Safe) or switch (act Risky). If she stays, she gets 50 utils regardless of the state. If she switches and the job is solid, she gets 100 utils; if shaky, she gets 0 utils. Crucially, if Alice *learns* the job is shaky (state B), she experiences severe depression that reduces her utility by 60 utils in all outcomes, regardless of her choice. This depression only occurs if she knows the truth; if she remains ignorant, she avoids it. A free, perfectly reliable, and private test is available that reveals the job's stability before she decides.

  ---

  ### Decision Analyses

  **States and Prior:**  
  - State G (solid job), probability \( P(G) = 0.5 \)  
  - State B (shaky job), probability \( P(B) = 0.5 \)  

  **Partition:**  
  The test partitions the states into two cells: {G} and {B}.  

  **Acts:**  
  - Safe: Stay in current job  
  - Risky: Switch to new job  

  **Utilities:**  
  - Utility depends on the state, act, *and* whether Alice knows the state:  
    - **Without test (ignorance):**  
      - Safe: 50 utils in both states (no depression, as she is unaware).  
      - Risky: 100 utils in G, 0 utils in B (no depression).  
    - **With test (knowledge):**  
      - Safe: 50 utils in G, \( 50 - 60 = -10 \) utils in B (depression penalty).  
      - Risky: 100 utils in G, \( 0 - 60 = -60 \) utils in B (depression penalty).  

  #### Expected Utility Without Test:
  Alice does not know the state and cannot experience depression. She computes:  
  - EU(Safe) = \( P(G) \times 50 + P(B) \times 50 = 0.5 \times 50 + 0.5 \times 50 = 50 \)  
  - EU(Risky) = \( P(G) \times 100 + P(B) \times 0 = 0.5 \times 100 + 0.5 \times 0 = 50 \)  
  Alice is indifferent but chooses Safe to avoid risk (or by convention), so expected utility = **50**.

  #### Expected Utility With Test:
  Alice observes the test result and conditions her act on it. She chooses optimally given her knowledge:  
  - If test reveals G (prob. 0.5): She switches (Risky) for 100 utils.  
  - If test reveals B (prob. 0.5): She stays (Safe) for \( 50 - 60 = -10 \) utils (avoids -60 from Risky but suffers depression).  
  EU(with test) = \( (0.5 \times 100) + (0.5 \times (-10)) = 50 - 5 = 45 \).

  **Comparison:**  
  - EU without test: **50**  
  - EU with test: **45**  
  Ex ante, receiving the information strictly lowers Alice’s expected utility by 5 utils.

  ---

  ### Violated Premise of Good’s Theorem
  **Diagnosis:** The scenario violates the premise that **utility attaches solely to the consequences of acts and states, not to the agent’s posterior beliefs**. Good’s theorem assumes utility is a function only of the state of the world and the chosen act. Here, utility depends on Alice’s *belief state*: learning state B triggers depression, reducing utility independently of the act chosen. This belief-dependent utility (where "consequences" include psychological states induced by knowledge) is the source of the loss.  

  **Why This Preserves Rationality?**  
  Alice remains rational: she has fixed, consistent preferences (e.g., she always prefers higher utility and avoids depression where possible); she updates by conditionalization (upon learning B, she assigns \( P(B) = 1 \)); and she maximizes expected utility given her information (e.g., when she knows B, she chooses Safe to get -10 over -60). The violation lies in the structure of utility, not in her reasoning. Belief-dependent utility is consistent with rationality—real agents care about knowledge (e.g., anxiety from bad news)—and is standard in models of regret, anxiety, or self-image. Relaxing this premise leaves the agent recognizably rational, as it does not involve computational errors, memory failures, or preference reversals.

  ---

  ### Defender’s Strongest Reply and Rebuttal
  **Reply:** A defender of Good’s theorem might argue that the outcomes are incomparable across the two scenarios. Without the test, the outcome in state B is "shaky job with ignorance," yielding 50 utils for Safe. With the test, the outcome in B is "shaky job with knowledge," yielding -10 utils for Safe. Since these are distinct outcomes, the comparison is invalid—Good’s theorem assumes a fixed set of outcomes.  

  **Does This Dissolve or Redefine the Case?**  
  This reply *redefines* the case but does not dissolve it. It highlights that Good’s theorem requires utilities to be defined over a common outcome space, excluding belief states. However, in real-world applications (e.g., healthcare decisions), outcomes often include psychological states tied to knowledge. The reply reframes the violation: the theorem’s framework cannot accommodate belief-dependent utility, but once we expand outcomes to include beliefs (as in modern decision theory), information can have negative value. The core insight—knowledge itself affects utility—remains valid for pedagogical purposes.

  ---

  ### Key Feature and Sensitivity
  **Single Feature Doing the Work:** The belief-dependent utility penalty (-60 utils for knowing state B). This creates a "double burden": knowledge harms Alice psychologically, and she cannot avoid this harm once informed.  

  **What Happens If Removed?**  
  If the depression penalty is removed (utility for Safe in B is 50 with or without knowledge), the loss vanishes:  
  - EU with test: \( 0.5 \times 100 \) (Risky in G) + \( 0.5 \times 50 \) (Safe in B) = 75  
  - EU without test: 50 (from Safe)  
  Information now has positive value (75 > 50), restoring Good’s result. The verdict depends entirely on belief-dependent utility.

  ---

  ### Candidate Scenario That Fails
  **Scenario:** Bob must insure his car. States: Accident (A, 10% chance) or No Accident (N, 90%). Acts: Buy insurance (cost: 20 utils) or not. Without information, EU(insure) = -20 (guaranteed); EU(not insure) = \( 0.1 \times (-100) + 0.9 \times 0 = -10 \), so he doesn’t insure. A free test reveals A/N. If he learns A, he insures (utility: -20); if N, he doesn’t insure (utility: 0). EU(test) = \( 0.1 \times (-20) + 0.9 \times 0 = -2 \), better than -10 without. But if the insurer infers from Bob’s hesitation that he might have taken the test and raises premiums, harm might occur.  

  **Why It Fails:** This violates specification (2): the harm comes from signaling/leakage (the insurer observes behavior, not the information itself). Good’s theorem assumes private information; here, the issue is strategic disclosure. Rational Bob would disguise his behavior or the theorem’s "disregard" clause allows him to ignore the test, restoring EU = -10. The harm is not intrinsic to information but to external game-theoretic effects.

  ---

  ### Conclusion
  This thought experiment satisfies all specifications: Alice is rational (1); information is free, reliable, and private (2); the setting is ordinary (3); and the harm is strict and ex ante (4). It violates Good’s theorem by relaxing the premise that utility depends only on acts and states, not beliefs. This illustrates why the theorem’s premises are load-bearing: in a world where knowledge itself affects welfare (e.g., via anxiety), ignorance can be beneficial even for rational agents. The exercise clarifies that Good’s theorem holds only when utilities are belief-independent—a nontrivial assumption.
