  | State | Safe | Risky |
  |-------|------|-------|
  | G     | 50   | 100   |
  | B     | 50   | 0     |

  But note: in state B, if she does not know, she doesn't get the depression penalty.

  Utilities with test (when she knows the state, and if she knows state B, she gets an extra -60):

  | State | Safe (when knowing state) | Risky (when knowing state) |
  |-------|---------------------------|----------------------------|
  | G     | 50                        | 100                       |
  | B     | 50-60 = -10               | 0-60 = -60                |

  Without the test, she chooses Safe (because it's less risky, or by our assumption) and gets 50 in both states, so expected utility 50.

  With the test, she chooses:

  - In state G: Risky -> 100
  - In state B: Safe -> -10

  Expected utility: 0.5*100 + 0.5*(-10) = 50 - 5 = 45.

  Thus, the expected utility with the test is 45, which is less than 50.

  **Violated Premise**

  The scenario violates the premise that utility is a function only of the state of the world and the act chosen, and not of the agent's beliefs or information state. Specifically, in state B, the utility of any act is reduced by 60 if the agent knows that the state is B. This belief-dependent utility is the source of the negative value of information.

  **Agent's Rationality**

  The agent is still fully rational: she has fixed preferences over outcomes (which now include her psychological state), updates by conditionalization, and chooses the act that maximizes expected utility given her information.

  **Defender's Reply**

  The strongest reply is that the outcome in the with-test and without-test cases are not the same. In the without-test case, when the state is B and she chooses Safe, the outcome is "state B, act Safe, and the agent is ignorant", which has utility 50. In the with-test case, when the state is B and she chooses Safe, the outcome is "state B, act Safe, and the agent knows B", which has utility -10. Therefore, the utility function is not defined consistently across the two scenarios. Good's theorem assumes a fixed utility function over the same set of outcomes. Since the outcomes are different, the theorem does not apply.

  This reply dissolves the case as a counterexample to Good's theorem, but it highlights that the theorem's framework assumes that the agent's utility does not depend on her beliefs. In realistic settings where utility is belief-dependent, the value of information can be negative.

  **Key Feature**

  The key feature is the belief-dependent utility: the psychological cost of knowing bad news. If we remove this feature (i.e., set the depression cost to 0), then the expected utility with the test becomes 75, which is greater than 50, and the value of information is positive.

  **Candidate Scenario that Fails**

  Consider a scenario where the agent is considering whether to take a drug that will make her happy but has a side effect if she has a particular gene. Without information, she doesn't take the drug and gets 0. With information, if she learns she doesn't have the gene, she takes the drug and gets 100; if she learns she has the gene, she doesn't take the drug and gets 0. So EU=50>0. But what if she is forced to take the drug if she doesn't have the gene? That doesn't help. 

  Another candidate: an agent is in a room with two boxes. Box A contains $0 or $1000 with equal probability, and Box B contains $500. Without information, she chooses Box B and gets $500. With information, she learns the contents of Box A. If it's $1000, she takes A and gets $1000; if $0, she takes B and gets $500. EU=0.5*1000+0.5*500=750>500. Positive value.

  The candidate that fails might be one where the information is about a state that the agent has already committed to. For example, the agent has already chosen to take the drug and then is offered the test. But then the test is after the decision? We require the information to arrive before the decision.

  Or, a scenario where the agent has a choice to avoid the information, but if she doesn't avoid it, she must use it. But in Good's theorem, she can always ignore it.

  Example of a failing candidate: the agent must choose between two acts. There is a free signal. She can choose to condition on the signal or not. But if she conditions, she might be led to make a decision she otherwise wouldn't. But she can always disregard the signal and do what she would have done without it. So she can't be worse off.

  In the belief-dependent utility case, she cannot disregard the signal because even if she disregards it, she still has the knowledge and suffers the psychological cost. So she can't avoid the cost of knowing.

  Therefore, the key is that the utility depends on the belief, and the belief is changed by the information, and this change is unavoidable.

  In the job market scenario, even if after learning state B she could disregard it and still choose to switch, she wouldn't because switching would give -60 (0-60) which is worse than staying and getting -10. But she still has the depression.

  But note: could she avoid the depression by not learning? In the scenario, the information is given to her for free, so she learns it involuntarily. The theorem assumes she can always disregard the information in her decision, but it doesn't assume she can forget it. So the knowledge is there and causes the harm.

  Thus, the scenario works.

  **Final Answer**

  We'll use the job market scenario.
