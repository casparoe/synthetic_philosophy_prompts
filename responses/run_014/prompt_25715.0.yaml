prompt: |-
  I've been thinking about a pattern in moral judgment that I can't find a name for, and I'm wondering whether philosophers have already mapped this out.

  Most actions seem to sort into three buckets: the required (don't lie, keep your promises), the forbidden (don't steal, don't hurt people for fun), and the neutral (what to eat for breakfast, which route to walk home). But I keep noticing actions that don't fit. A stranger needs a bone marrow donation and you happen to be a match. If you go through with it, people call it heroic. If you don't, nobody says you did anything wrong — it wasn't your duty. The same goes for jumping into a freezing river to save someone else's dog, or spending your Saturdays volunteering at a hospice when you could be resting. These aren't neutral in the way picking a cereal is — they feel morally weighty — but they also aren't demanded the way ordinary obligations are.

  What puzzles me is the asymmetry: you can't be blamed for skipping them, but you can be praised for doing them. And the praise has a strange fragility to it. If you keep bringing up that bone marrow donation, the bragging seems to spoil the praiseworthiness in a way that doesn't happen when someone merely mentions having done their duty. That suggests this isn't just a fourth point on a single scale — the category might have its own internal logic.

  Is there an established term for this class of actions? I'm not just after a label. I want to know how the boundary is drawn. Does an action have to involve significant sacrifice to count, or could small kindnesses qualify? Where does this category shade into ordinary politeness on one side and into obligation on the other? And if someone performs the action for selfish reasons — say, donating bone marrow purely for the attention — does it still belong to the category, or does the motive determine the classification?
reasoning: |-
  Okay, the user is describing a specific pattern in moral judgment they've noticed, where certain actions aren't obligatory but still carry moral weight. They mention examples like bone marrow donation or saving a dog, where you're praised if you do it but not blamed if you don't. They're looking for a philosophical term for this category and want to understand its boundaries.

  First, I need to recall relevant philosophical concepts. The description sounds exactly like supererogation. The term comes from Latin roots meaning "beyond what is asked." Philosophers like J.O. Urmson and David Heyd have written about this. The key features match: optional, morally good, praiseworthy but not required. 

  The user also points out the asymmetry—praise for doing, no blame for skipping. That's a classic sign of supererogation. They mention the fragility of praise, like bragging spoiling it. That ties into motives. If someone does it for attention, it might still be supererogatory but less praiseworthy. Motive affects the moral worth but not necessarily the action's classification.

  Next, they ask about boundaries. How does this differ from small kindnesses or obligations? Small acts of kindness might be supererogatory if they go beyond duty. But daily courtesies could be seen as part of ordinary obligations. Sacrifice is a factor but not absolute; even small sacrifices can count if they're beyond duty. The line between duty and supererogation can be fuzzy. For example, helping in emergencies might shift from optional to obligatory if the cost is low. 

  The user also wonders about motives. In philosophy, the act itself can be supererogatory regardless of motive, but the praiseworthiness depends on why it was done. Selfish motives might make it less admirable but still supererogatory if the action benefits others at some cost to oneself.

  Underlying needs: The user seems to seek validation that their observation is recognized in philosophy. They might want a framework to categorize moral actions in their own life or discussions. They could be interested in applying this to ethical dilemmas or understanding societal praise dynamics. Their deeper need might be to clarify moral responsibilities versus optional goodness, possibly to navigate personal decisions or academic interests.

  I should explain supererogation, its key features, and address their specific questions about boundaries, sacrifice, and motives. Mentioning philosophers like Urmson and Heyd adds credibility. Highlighting the asymmetry and praise fragility shows understanding of their examples. Clarifying where the lines blur helps them apply the concept practically. Also, discussing motives distinguishes between the act's classification and its moral worth.
answer: |-
  You've put your finger on a crucial and well-recognized category in moral philosophy: **supererogation**. Your description of "asymmetric praise/no-blame" is essentially the definition of a supererogatory act.

  Here's a breakdown of the concept and answers to your specific questions:

  1.  **The Established Term:** **Supererogation** (from Latin *supererogare*, meaning "to pay out over and above").
      *   **Key Features:**
          *   **Morally Good/Praiseworthy:** The action is undeniably good and morally valuable.
          *   **Beyond the Call of Duty:** It is *not* morally obligatory or required. You don't *owe* it to anyone in the way you owe it to someone to keep a promise or not harm them.
          *   **Asymmetric Judgment:** Failure to perform is *not* blameworthy (not morally wrong), while performing it is praiseworthy (morally commendable).
          *   **Significant Cost/Sacrifice:** Typically involves some non-trivial cost, risk, effort, or sacrifice on the part of the agent. This is key to distinguishing it from trivial neutral acts.

  2.  **Boundaries: How is the Category Drawn?**
      *   **The Core Test:** Is the action *both* (a) *significantly good/beneficial* and (b) *significantly costly/risky/demanding* for the agent, yet (c) *not strictly required* by any specific duty or obligation (like justice, fidelity, non-maleficence)?
      *   **Distinction from the "Neutral" (Morally Permissible but Insignificant):** Picking cereal involves negligible moral weight and no significant cost/sacrifice/benefit. Supererogatory acts have *significant* positive moral weight *because* of the benefit conferred *despite* the cost borne by the agent. Saving the dog involves significant risk (to you) and benefit (to the dog/owner).
      *   **Distinction from the "Required" (Duty/Obligation):** Obligations *must* be performed; failure is blameworthy. Supererogatory acts, by definition, lack this mandatory force. They go *above and beyond* what duty demands. The line can be blurry:
          *   **Emergencies & Capability:** If saving someone drowning involves minimal risk to you, it might shift towards being a duty of easy rescue. If it involves high risk, it becomes supererogatory.
          *   **Special Relationships:** Duties to family/friends are stronger. Donating bone marrow to a stranger is supererogatory; donating to save your child's life is likely seen as a parental duty.
          *   **Societal Expectations:** What counts as "duty" vs. "extra" can evolve. Regular hospice volunteering might be seen as supererogatory, while basic neighborly help might be expected.

  3.  **Significance of Sacrifice:**
      *   **Generally Necessary but Not Absolute:** Sacrifice/cost is *central* to the concept. The asymmetry makes sense *because* the agent bore a burden they didn't have to. Small kindnesses (holding a door, a genuine compliment) are often seen as morally *good* but usually fall below the threshold of significant cost/sacrifice needed for true supererogation. They might be considered minor virtues or simply part of basic civility/politeness, which arguably sits on the boundary or just within the realm of minimal social duty/politeness rather than supererogation.
      *   **Scale Matters:** A *sustained pattern* of small kindnesses, especially if done at some personal inconvenience or when others wouldn't, might accumulate into something supererogatory. However, individual small acts rarely qualify.

  4.  **The Role of Motive:**
      *   **The Act vs. The Agent:** This is a crucial distinction.
          *   **The Supererogatory *Act*:** The *action itself* (e.g., donating bone marrow, saving the dog) can be classified as supererogatory based on its *objective features*: significant benefit, significant cost/risk, non-obligatory nature. The *act-type* is supererogatory.
          *   **The Praiseworthiness of the *Agent*:** This depends *heavily* on motive. This explains the "fragility of praise" you noticed.
              *   **Altruistic Motive (e.g., compassion, benevolence):** Maximizes praiseworthiness. This is the ideal.
              *   **Mixed Motive (e.g., partly altruism, partly desire for praise):** Less praiseworthy, but the act itself is still good and supererogatory. The "bragging" diminishes the *agent's* moral credit because it suggests the primary motive was self-serving.
              *   **Purely Selfish Motive (e.g., *only* for attention, fame, or even a monetary reward):** This drastically reduces or even *eliminates* the praiseworthiness of the *agent*. The action remains objectively beneficial and costly, so it might still be *called* supererogatory in a descriptive sense (it went beyond duty and was good). However, morally, the *agent* deserves little or no praise. The value lies in the outcome, not the agent's character. Philosophers debate whether such acts are *truly* supererogatory in the full moral sense, or merely "good deeds" lacking moral merit due to the motive.

  **Key Philosophers & Debates:**

  *   **J.O. Urmson:** His 1958 paper "Saints and Heroes" is seminal in reviving modern interest in supererogation, arguing that standard deontological and utilitarian theories struggle to accommodate it.
  *   **David Heyd:** Wrote the comprehensive book *Supererogation* (1982), exploring its history, definition, and challenges to ethical theories.
  *   **Debates:**
      *   **Can Utilitarianism/Consequentialism Accommodate It?** If the act produces the best outcome, isn't it *required*? Defenders argue that requiring excessive sacrifice undermines the agent's well-being and overall utility.
      *   **Can Deontology Accommodate It?** If duties define the right, what space is left for the "beyond duty"? Defenders argue duties set a minimum standard, leaving room for higher ideals.
      *   **The "Ought Implies Can" Challenge:** If you *can* do a supererogatory act (like donate marrow), do you *ought* to? The supererogationist says "no," while critics argue this weakens morality.
      *   **The Motive Debate:** How essential is altruistic motive to the very definition of supererogation? (Most agree it's essential for full *praiseworthiness*, but the *act classification* might be broader).

  **In Summary:**

  You've identified **supererogation** – actions that are morally excellent, involve significant cost/sacrifice, and go beyond what duty requires, resulting in the asymmetric judgment of praiseworthiness for performance but no blame for omission. The boundary with duty depends on factors like risk, relationship, and societal norms, while the boundary with neutrality hinges on the significance of both the benefit and the cost. Motive doesn't necessarily change the *classification* of the *act* (as beneficial and costly beyond duty) but is absolutely central to the *praiseworthiness* of the *agent* performing it, explaining why "bragging" undermines the moral credit. It's a fascinating category highlighting that morality isn't just about minimum requirements but also encompasses ideals of extraordinary goodness.
