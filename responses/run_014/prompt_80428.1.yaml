prompt: |-
  I am taking an advanced course in epistemic game theory and have been trying to write down my own position on what common knowledge of rationality can do before a seminar discussion. I was discussing the issue with a friend who thinks I am smuggling in equilibrium selection, and I am not sure whether my commitments already do that. Here is the package I currently hold. First, I think common knowledge of rationality is best represented as an event in a finite model of agents' beliefs, and that this representation captures the hierarchy of knowing that the others are rational, knowing that they know, and so on, without requiring that any agent can verify the whole hierarchy from the inside. Second, I think that, for normal-form games, the epistemic content of common knowledge of rationality is exactly rationalizability: the strategies that survive iterated elimination of strategies that are never best responses to any belief. Third, I think that in a finite game with a unique Nash equilibrium, common knowledge of the game form plus common knowledge of rationality is sufficient to predict that the equilibrium will be played. Fourth, I accept Aumann's agreement theorem, on the understanding that two agents with a common prior cannot have common knowledge of different posterior probabilities about the same event. Fifth, I think this is compatible with players in a coordination game having different posterior beliefs about which equilibrium will be played, because their posterior probabilities themselves need not be common knowledge. Sixth, I think allowing for small probabilities of mistake should not change the set of rationalizable strategies, because a strategy that is a best response to some belief remains a best response to some nearby belief once trembles are added.

  I would like an audit of this set rather than a general lecture on the standard material. Please tell me which commitments are jointly tenable, which are in genuine tension, and which are only apparently in tension. I have a vague worry that I may be treating common knowledge of rationality as if it were a stronger equilibrium-selection principle than I intend, but I cannot say which commitment is doing that work. For each genuine tension, rank the tensions by severity, say what would have to be revised, and indicate the cheapest revision and what it costs. I do not know which commitment I should be least attached to, so please do not assume that I am most willing to drop any particular one.
reasoning: |-
  Okay, let me start by understanding the user's query. They're in an advanced epistemic game theory course and preparing for a seminar discussion on common knowledge of rationality (CKR). Their friend thinks they're smuggling in equilibrium selection, and they're unsure if their commitments do that. They listed six points and want an audit of which are tenable, which are in tension, and how to resolve tensions.

  First, I need to parse each commitment. Point one about representing CKR in a finite belief model seems standard. Point two linking CKR to rationalizability in normal-form games is textbook, like Pearce and Bernheim. Point three claims that in finite games with unique Nash, CKR plus common knowledge of the game form leads to the equilibrium being played. That's where equilibrium selection might sneak in. 

  Point four accepts Aumann's agreement theorem, which is solid. Point five says coordination games can have different posteriors about which equilibrium without common knowledge of those posteriors. That seems consistent with Aumann. Point six argues that trembles don't affect rationalizable strategies, which relates to robustness.

  The user's main worry is unintentional equilibrium selection, probably from point three. I recall that Brandenburger, Dekel, and Tan have shown that CKR alone doesn't imply Nash equilibrium without additional assumptions like common belief in rationality. Point three might be conflating rationalizability with Nash. For example, in games with unique Nash that isn't dominant solvable, rationalizability might not pin it down. So point three might be the culprit.

  Now, checking tensions. Point three conflicts with point two because rationalizability doesn't always lead to Nash. Also, point five about coordination games might clash with point three if the unique Nash isn't reached under CKR alone. Point six seems okay since rationalizable sets are robust to trembles.

  The user needs to know the cheapest fix. Dropping point three is straightforward but loses predictive power. Weakening it to include only dominance-solvable games preserves some predictions but is less broad. Alternatively, adding common belief in rationality might help but complicates the model. The cheapest revision is dropping or weakening point three, costing the ability to predict unique Nash equilibria universally.

  Ranking tensions: The point three vs. point two conflict is most severe. Then, point three vs. point five. The others seem compatible. The user should consider if they're willing to sacrifice predictive power for consistency. Highlighting the distinction between CKR and common belief in rationality could resolve the tension without major overhauls.
answer: |-
  Based on a careful audit of your epistemic commitments, here's an analysis of their joint tenability, tensions, and recommended revisions, prioritized by severity:

  **Severe Tension: Commitment #3 Undermines Commitment #2**
  *   **Conflict:** Commitment #3 (CKR + CK of game form ⇒ Unique Nash in finite games) directly contradicts Commitment #2 (CKR ⇒ Rationalizability). Rationalizability is strictly weaker than Nash equilibrium in general. Many finite games have a unique Nash equilibrium *not* reachable solely via iterated elimination of never-best-responses (e.g., Battle of the Sexes, the "Unique Nash" game below). In these games, CKR (implying rationalizability) does *not* imply the unique Nash will be played. Commitment #3 smuggles in much stronger epistemic assumptions (like common *belief* of rationality or correlated equilibrium) under the guise of CKR alone.
  *   **Severity:** High (Core inconsistency within your framework).
  *   **Example:** Consider this normal-form game (Player 1 rows, Player 2 columns, payoffs (P1, P2)):
      |       | L     | R     |
      | :---- | :---- | :---- |
      | **U** | 3, 1  | 0, 0  |
      | **M** | 0, 0  | 1, 3  |
      | **D** | 1.5, 0| 1.5, 0|
      *   Unique Nash: (D, R) [P1 gets 1.5, P2 gets 0].
      *   Rationalizable Strategies:
          *   Iteration 1: For P2, L is never a best response (payoff 0 vs R's 0 against D, but R gives 3 against M). Eliminate L. Game reduces to P1: {U, M, D}, P2: {R}.
          *   Iteration 2: P1 best responds to P2 playing R: U→0, M→1, D→1.5. Eliminate U and M. Only (D, R) survives. **Rationalizability ⇒ Nash here.**
      *   Now modify P1's payoff for (D, L) to 2.5 (keeping (D, R)=1.5):
          |       | L     | R     |
          | :---- | :---- | :---- |
          | **U** | 3, 1  | 0, 0  |
          | **M** | 0, 0  | 1, 3  |
          | **D** | 2.5, 0| 1.5, 0|
      *   Unique Nash: (D, L) [P1 gets 2.5, P2 gets 0].
      *   Rationalizable Strategies:
          *   Iteration 1: P2: L is never BR? Against U: L gives 1, R gives 0 → L *is* BR. Against M: L gives 0, R gives 3 → R is BR. Against D: L gives 0, R gives 0 → Both BR. No strategy eliminated for P2.
          *   Iteration 2: P1: Best responses depend on belief about P2. BR to belief P2 plays L: U (3) > D (2.5) > M (0) → U, D rational. BR to belief P2 plays R: M (1) > D (1.5) → M, D rational. **All P1 strategies (U, M, D) are rationalizable.** P2: L is BR if P1 plays U. R is BR if P1 plays M. Both are BR if P1 plays D. **Both P2 strategies (L, R) are rationalizable.** Rationalizable set: {U, M, D} x {L, R}. Unique Nash (D, L) is *one* rationalizable profile, but so is (U, L), (M, R), etc. CKR *only* implies players will choose *some* rationalizable profile, not necessarily the Nash (D, L).
  *   **Revision Required:** Commitment #3 must be revised or dropped. It is incorrect as stated for finite games with unique Nash that are not dominance-solvable.
  *   **Cheapest Revision:** Weaken #3 to: "In a finite game **solvable by iterated strict dominance (ISD)**, CKR + CK of game form is sufficient to predict the (necessarily unique) outcome." This aligns perfectly with #2 (Rationalizability ≡ ISD in finite games). **Cost:** Loss of predictive power for unique Nash equilibria not reachable by ISD (like the modified game above). You can no longer claim CKR singles out *every* unique Nash.

  **Moderate Tension: Commitment #3 Undermines Commitment #5**
  *   **Conflict:** Commitment #5 correctly states that players in a coordination game can have different (non-CK) posterior beliefs about which equilibrium will be played. Commitment #3, however, claims that for a unique Nash (which is a trivial coordination game), CKR *forces* its play. If Commitment #3 were true, it would imply players *must* coordinate on the unique equilibrium, seemingly contradicting the spirit of #5. While technically #3 covers "unique Nash" and #5 covers multiple equilibria, the underlying logic clash is apparent: Why does uniqueness suddenly resolve the coordination problem under the same epistemic conditions (CKR + CK game form)? The resolution is that Commitment #3 is wrong, as established above.
  *   **Severity:** Moderate (Resolved by fixing the core error in #3).
  *   **Revision Required:** Fixing Commitment #3 (as above) resolves this tension. Commitment #5 stands as correct.
  *   **Cheapest Revision:** Revise #3 as described above (restrict to ISD-solvable games). **Cost:** As above.

  **Tenable Commitments (No Significant Tensions):**
  1.  **Commitment #1 (CKR as Event in Finite Model):** Standard, sound epistemic modeling. Compatible with all others.
  2.  **Commitment #2 (CKR ⇒ Rationalizability in NF):** Foundational result (Pearce, Bernheim). Core of your position. Compatible with revised #3 (ISD) and others.
  3.  **Commitment #4 (Aumann Agreement):** Correctly stated. Compatible.
  4.  **Commitment #5 (Non-CK Posteriors in Coordination):** Correct and crucial nuance. Explains why coordination failures are possible under CKR. Compatible with revised #3 (ISD) and others. Directly addresses your friend's concern about equilibrium selection – CKR alone *does not* select among multiple equilibria precisely because posteriors aren't CK.
  5.  **Commitment #6 (Robustness to Trembles):** Sound. A strategy rationalizable under CKR is a best response to *some* full-support belief (by denseness arguments). Compatible with all.

  **The Core Issue: Where Equilibrium Selection is Smuggled In**
  Your "vague worry" is precisely targeted. **Commitment #3 is the culprit smuggling in equilibrium selection.** By asserting CKR (+CK game) *implies* play of unique Nash, you implicitly claim CKR resolves the strategic uncertainty in these games. However, as demonstrated by the modified game example, players knowing the game, knowing rationality, knowing others know rationality, etc., *still* face uncertainty about what others will do that allows multiple rationalizable outcomes, *even when a unique Nash exists*. Commitment #3 falsely elevates CKR to the power of stronger concepts like Common Belief of Rationality (CBR) or correlated equilibrium in these specific contexts.

  **Recommendation Summary:**
  1.  **Revise Commitment #3:** Replace it with the weaker statement restricted to iterated strict dominance (ISD) solvable games. This aligns perfectly with #2 and removes the inconsistency. **Cost:** Loss of prediction for unique Nash games not solvable by ISD.
  2.  **Keep Commitments #1, #2, #4, #5, #6:** They are tenable individually and jointly once #3 is revised. They form a coherent, standard epistemic position centered on rationalizability.
  3.  **Emphasize Commitment #5:** This is key to defending against your friend's charge. Explicitly state: "CKR (as implying rationalizability) does *not* select among multiple Nash equilibria in coordination games precisely because players' beliefs *about which equilibrium will be played* are not required to be common knowledge, only their rationality and knowledge of the game are. This is consistent with Aumann (Commitment #4 & #5). My (revised) Commitment #3 only applies where rationalizability *coincides* with a unique solution via dominance."

  This revision resolves the severe internal tension and the moderate tension with your coordination game view, grounding your position firmly in rationalizability while eliminating the unsupported claim that CKR magically solves all unique Nash games. It clarifies that equilibrium selection requires stronger epistemic conditions than just CKR.
