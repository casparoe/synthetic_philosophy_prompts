prompt: |-
  I sit on the grants committee of a global-health foundation, and this cycle we have to divide a fixed $12 million pot among the proposals in front of us. One proposal — a high-throughput screening program for a neglected tropical disease — carries a claimed expected benefit roughly forty times the next-best proposal and about a hundred times the median. The rest of the pool is a portfolio of roughly thirty smaller programs, each individually modest. Our standing guidance says we allocate by expected cost-effectiveness, but it was written for a pool of comparable proposals and says nothing about what to do when a single option dominates the rest by this kind of margin.

  Please draft the short written opinion I will circulate to the committee before Friday's meeting. It should recommend a concrete allocation for this cycle — a specific split of the pot — and state the general principle we should adopt so we can handle a similar case next cycle. Treat it as the decision-theory problem it is: the utility-monster case, in which one option absorbs a disproportionate share of the total expected benefit, so that pure expected-value maximization says to pour essentially the whole budget into it and abandon the rest. Weigh the case for concentrating on the dominant intervention against the case for capping per-proposal allocation and diversifying — the uncertainty in the dominant proposal's impact estimate, the risk that it is an outlier rather than a real forty-fold edge, the option value of keeping smaller programs alive, and the equity argument that a foundation should not defund the populations the smaller programs serve. Engage the strongest version of the losing side honestly, not a strawman.

  Please clearly separate what is settled among people who actually work on cost-effectiveness and decision theory from what is genuinely contested, and do not present a contested position — either that pure expected-value maximization is the right rule or that it is the wrong one — as though it were the consensus. Keep it to a couple of pages, no citations, written so a non-specialist commissioner can follow every step of the reasoning.
reasoning: |-
  We are faced with a decision-theory problem: how to allocate a fixed budget of $12 million among a set of proposals when one proposal (the "dominant intervention") has an expected cost-effectiveness that is vastly superior to the others (40x the next best and 100x the median). The standing guidance to allocate by expected cost-effectiveness would, in principle, lead us to allocate nearly the entire budget to the dominant intervention. However, there are reasons to question whether this is the best course of action.

  Key considerations:

  1. **Uncertainty in Estimates**: The dominant intervention's claim of 40x the next best is extraordinary. We must consider the possibility that the estimate is overly optimistic. If the true effectiveness is lower, then we may be over-allocating to it.

  2. **Risk of Being an Outlier**: It is possible that the dominant intervention is an outlier in the positive direction. If we allocate the entire budget to it and it fails to deliver, we have lost the opportunity to fund other valuable programs.

  3. **Option Value of Smaller Programs**: Smaller programs may be keeping alive research or intervention pathways that could become more valuable in the future. Defunding them entirely might close off these options.

  4. **Equity Considerations**: The smaller programs serve distinct populations. Abandoning them entirely might be seen as inequitable, especially if these populations are already neglected.

  5. **Diversification**: Just as in finance, diversification can reduce risk. If the outcomes of the interventions are not perfectly correlated, then funding a portfolio can lead to a more robust overall outcome.

  However, we must also acknowledge the strength of the case for concentrating on the dominant intervention:

  - If the estimate is even approximately correct, then the opportunity cost of diverting funds from the dominant intervention to others is enormous. For example, shifting $1 million from the dominant intervention to a program that is 100x less effective would result in a loss of 99% of the potential benefit that could have been achieved with that $1 million.

  - The expected value approach is the foundation of decision theory under uncertainty. We should not abandon it lightly.

  **Consensus in Decision Theory and Cost-Effectiveness Analysis**:

  It is settled that we should maximize expected utility when we can assign probabilities and utilities and when the stakes are linear and the decision is one-shot. However, it is also settled that we must account for uncertainty in our estimates. The key point of contention is how to handle deep uncertainty (where probabilities are hard to assign) and how to balance diversification against the opportunity cost of not funding the best option.

  There is no consensus on a single rule for handling such a "utility monster". Some experts advocate for pure expected value maximization, while others argue for diversification or using a risk-averse utility function.

  **Concrete Recommendation**:

  Given the extraordinary claim of the dominant intervention, we should not allocate the entire budget to it. However, we should allocate a very substantial portion. I propose:

  - **Allocate $10 million (83% of the pot) to the dominant intervention.** This leaves $2 million for the rest.

  - **Allocate the remaining $2 million to the portfolio of smaller programs.** This could be distributed proportionally to their expected cost-effectiveness (relative to each other) or by other criteria (e.g., maintaining a minimum funding level for each to keep them viable, if applicable). This approach:

    - Respects the extraordinary expected value of the dominant intervention by giving it the lion's share.
    - Maintains funding for the smaller programs, addressing the concerns of uncertainty, option value, and equity.
    - Provides a buffer against the risk of over-reliance on one intervention.

  **General Principle for Future Cycles**:

  We should adopt a rule that allows for concentrating funds on extremely cost-effective interventions but with a cap that ensures a minimum level of diversification. Specifically:

  - **Set a cap per proposal as a percentage of the total budget (e.g., 80-90%) in cases where one proposal is at least an order of magnitude (10x) more cost-effective than the next best.** The exact cap should be determined by the level of uncertainty and the value of diversification. We can formalize this by:

    1. Estimating the uncertainty in the cost-effectiveness estimates (e.g., via confidence intervals or Bayesian methods). The more uncertain the dominant proposal, the lower the cap.

    2. Assessing the correlation of outcomes among proposals. If the smaller programs have independent or negatively correlated outcomes with the dominant one, then diversification is more valuable.

    3. Considering non-linear utility: if the marginal utility of additional health benefits diminishes (e.g., because we care about the worst-off), then we should allocate more to the smaller programs.

  However, without a formal model for these factors, we can use a simple rule: cap the allocation to any single proposal at 85% of the total budget when it is at least 10x more cost-effective than the next best. This rule balances the huge opportunity cost of underfunding the dominant intervention against the risks of putting all our eggs in one basket.

  **Addressing the Losing Side**:

  The strongest argument for pure expected-value maximization is that, in expectation, we are sacrificing a vast amount of good by not funding the dominant intervention to the maximum. If we believe that the expected value estimate is unbiased and that we are risk-neutral, then any diversion from the dominant intervention is a mistake. Moreover, if we are not risk-neutral, we should explicitly model our risk aversion rather than arbitrarily capping. The counterargument is that in the face of deep uncertainty and the potential for systemic failures (e.g., the entire dominant intervention fails due to an unforeseen factor), diversification is a rational response. Also, the equity concern might be framed as a form of risk aversion over the distribution of health benefits.

  **Conclusion**:

  I recommend allocating $10 million to the dominant intervention and $2 million to the portfolio of smaller programs. This approach is a pragmatic balance between the compelling case for the dominant intervention and the legitimate concerns about uncertainty and diversification. For the future, we should adopt a rule that caps the allocation to any single proposal at a high but not total percentage (e.g., 85%) when it is at least 10x more cost-effective than the next best, with the exact cap adjustable for uncertainty and other factors.

  This recommendation is made with the understanding that we are trading off some expected value for reduced risk and equity. The loss in expected value is justified by the insurance against the risk of over-concentration and the value of maintaining a diversified portfolio.
answer: |-
  **To:** Grants Committee  
  **From:** [Your Name]  
  **Subject:** Allocation Recommendation for Current Cycle and General Principle for Future Dominant Proposals  
  **Date:** October 26, 2023  

  ### Introduction  
  This cycle, we face an unusual challenge: a single proposal for a high-throughput screening program (hereafter "Dominant Intervention") claims an expected benefit ~40× the next-best proposal and ~100× the median. Our standing guidance prioritizes expected cost-effectiveness but assumes proposals are comparable. This case resembles a "utility monster" in decision theory—where one option’s extreme efficiency risks monopolizing the budget under pure expected-value maximization. After weighing the arguments, I recommend a **modified concentrated allocation** ($10 million to the Dominant Intervention; $2 million to the portfolio of smaller programs) and propose a general principle for future cycles.  

  ---

  ### Core Tension: Concentration vs. Diversification  
  We must weigh two legitimate perspectives:  

  #### The Case for Concentration (Pure Expected-Value Maximization)  
  If the Dominant Intervention’s cost-effectiveness estimate is reliable, allocating the entire $12M to it could achieve ~40× more benefit than splitting funds. For example:  
  - If the Dominant Intervention saves 100,000 disability-adjusted life years (DALYs) per $1M, it would save 1.2M DALYs with full funding.  
  - If the next-best proposal saves 2,500 DALYs/$1M, allocating $12M across all others might save ≤75,000 DALYs—a fraction of the Dominant Intervention’s impact.  
  Opportunity cost is the central argument: diverting funds from the Dominant Intervention sacrifices immense potential good. Decision theory’s foundation—maximizing expected utility—demands we prioritize it absent compelling counterarguments.  

  #### The Case for Capping and Diversifying  
  Despite the Dominant Intervention’s appeal, four concerns justify reserving funds for smaller programs:  
  1. **Uncertainty and Model Risk**: Extraordinary claims require extraordinary evidence. A 40× edge may stem from optimistic assumptions (e.g., disease prevalence, scalability, or behavior-change models). If the true effectiveness is 10× lower (still exceptional), over-concentration wastes resources.  
  2. **Outlier Risk**: The estimate might be an error or fluke. Smaller programs have established track records; abandoning them risks losing reliable, if modest, benefits.  
  3. **Option Value**: Smaller programs maintain expertise, infrastructure, and community trust. Defunding them kills future opportunities (e.g., if the Dominant Intervention fails or new data elevates a smaller program).  
  4. **Equity and Robustness**: Concentrating solely on one disease/population may neglect ethically salient needs. Diversification hedges against correlated failures (e.g., political instability in the Dominant Intervention’s region).  

  The strongest counter to concentration is that **expected-value maximization assumes perfect confidence in estimates**. In practice, cost-effectiveness models involve deep uncertainty—and when one estimate dwarfs others, it may signal overprecision rather than true superiority.  

  ---

  ### Consensus vs. Contested Ground  
  - **Settled**: All parties agree we must account for uncertainty and opportunity costs. Expected-value maximization is the default under ideal conditions (perfect information, linear benefits).  
  - **Contested**: There is **no consensus** on handling extreme disparities. Some experts advocate pure expected-value maximization regardless of uncertainty; others support diversification via caps, risk-adjusted utility, or explicit Bayesian priors. We must acknowledge both approaches are defensible.  

  ---

  ### Recommendation for This Cycle  
  I propose splitting the $12M as follows:  
  - **$10 million (83%) to the Dominant Intervention**.  
  - **$2 million (17%) to the portfolio of smaller programs**, allocated by their relative cost-effectiveness.  

  #### Why This Split?  
  - **Balances opportunity cost and uncertainty**: Funding the Dominant Intervention at ~80% of the pot captures most expected benefit while reserving funds to address risks. Even if its effectiveness is overestimated by 50%, it likely remains our best investment.  
  - **Preserves smaller programs**: $2M sustains critical mass for ~30 smaller programs (e.g., ~$67K each). This avoids total abandonment, maintaining option value and equity.  
  - **Avoids arbitrary thresholds**: A 90% or 95% cap still risks leaving smaller programs unviable; 50% would waste too much expected value. 80% balances these concerns.  

  ---

  ### General Principle for Future Cycles  
  To handle similar cases, adopt this rule:  
  > **If a proposal’s point estimate of cost-effectiveness is ≥10× the median proposal and ≥5× the next-best proposal, cap its allocation at 80% of the total budget. All remaining funds are allocated by expected cost-effectiveness among other proposals.**  

  #### Rationale  
  - **Threshold (10× median, 5× next-best)**: Ensures the cap applies only to extreme outliers, excluding merely strong proposals.  
  - **80% cap**: Retains most benefits of concentration while mandating diversification. Adjustable in future via committee vote if evidence supports higher/lower uncertainty.  
  - **Why not pure expected-value?** It ignores model risk. Why not fixed diversification? It wastes value when estimates are reliable. This rule balances both.  
  - **Process**: Require sensitivity analyses for proposals exceeding the threshold. If uncertainty is low (e.g., robust independent validation), the cap could be raised to 90%; if high (e.g., novel methodology), lowered to 70%.  

  ---

  ### Engaging the Losing Side  
  To the proponent of pure expected-value maximization: *Your argument is technically correct if we trust the estimate. A 17% diversion to smaller programs may sacrifice ~200,000 DALYs if the Dominant Intervention performs as promised. But this presumes infallibility—and in global health, such certainty is rare. When a single estimate dwarfs all others, prudence demands we discount it slightly to protect against hubris.*  

  To the proponent of hard diversification: *Reserving 50% for smaller programs might feel safer, but it risks wasting millions in expected benefits. If the Dominant Intervention is even half as effective as claimed, allocating only 50% to it would lose ~500,000 DALYs versus an 80% allocation. Equity must be weighed against the moral cost of leaving greater suffering unaddressed.*  

  ---

  ### Conclusion  
  I recommend allocating **$10M to the Dominant Intervention** and **$2M to smaller programs** for this cycle. This captures most expected value while hedging against uncertainty. For the future, the **80% cap rule** provides a clear, adjustable standard for utility-monster scenarios. By adopting it, we honor the spirit of cost-effectiveness without ignoring real-world risks.  

  I look forward to discussing this at Friday’s meeting.
