prompt: |-
  I got roped into leading our philosophy reading group next Thursday, it's like six non-philosophers, mostly bio and CS people who all listened to the same pop-neuroscience podcasts and are pretty convinced free will is dead because brains are deterministic and Libet and all taht. I want to get them to take seriously the move that says forget metaphysical ultimate authorship, ask which varieties of free will are actually worth wanting for responsibility and living a life, you know the Dennett-flavored compatibilist line. I have about an hour and a whiteboard and they like arguing.

  Don't explain compatibilism to me straight, I need a teaching plan for how to explain it to them. Tell me what order I have to introduce things in and why each step depends on the last, and help me pick one carrying case to build the whole hour around — I was thinking of Maya, a grad student in my department who spent a month tracking her late-night doomscrolling, talked it through with friends, then deleted the apps and stuck with it, versus a version where her advisor secretly tweaked her phone to force the same result while she thinks she decided. Is that good enough, what does a good case need to have and what does it need to lack, and if Maya doesn't work what would you replace her with and why. Also map the misconceptions they'll walk in with or invent halfway — like free will has to mean could have done otherwise with the exact same past, or has to mean uncaused, or that reasons-responsiveness is just a fancy excuse — and tell me exactly where in the sequence to head each one off before it derails us. End with one check-for-understanding question that would show they actually got the worth-wanting shift and not just parroting determinism is true, plus what I should explicitly leave out at this level and admit I'm skipping. And please just commit to one plan and argue for it, don't give me three options to choose from, I need to know what you think will realy work and why.
reasoning: |-
  Okay, let me start by understanding what the user needs. They're leading a philosophy reading group for non-philosophers—mostly bio and CS people who are convinced free will is dead due to determinism and Libet's experiments. The goal is to shift their focus from metaphysical free will to the compatibilist idea of "free will worth wanting," specifically Dennett's approach. They have an hour, a whiteboard, and the group likes arguing. 

  First, I need to assess their existing misconceptions. The group likely thinks free will requires absolute indeterminism or that determinism negates any meaningful choice. They might conflate free will with supernatural causation. Also, they probably believe Libet's experiments prove intentions are post-hoc rationalizations. 

  The user suggested a case study: Maya deleting apps versus being manipulated. I think this is a strong example because it contrasts genuine reasons-responsive action with covert manipulation. The key elements here are agency over time, reasons-responsiveness, and the difference between internal and external causes. It lacks metaphysical baggage, which keeps it grounded. 

  Now, structuring the session. The user wants a step-by-step plan. Starting with their beliefs validates their knowledge and engages them. Then, introducing the "worth wanting" question shifts the discussion. Using Maya's case makes it concrete. Contrasting scenarios highlights compatibilist criteria without jargon. 

  I should anticipate where misconceptions might arise. For example, when discussing determinism, someone might say "but it's all determined, so no real choice." Addressing this early by distinguishing causation types is crucial. Another point: after presenting Maya, they might argue both cases are determined, so no difference. Here, emphasizing reasons-responsiveness and the source of control is key. 

  The check-for-understanding question needs to reveal if they grasp the shift in value. Asking which Maya deserves praise gets them to apply the distinction. Ending with the "could have done otherwise" point clarifies that alternate possibilities aren't necessary for responsibility. 

  Also, the user mentioned leaving out incompatibilism and deep metaphysics. That's smart to avoid tangents. Focusing on practical implications keeps it manageable. 

  Alternative cases? If Maya doesn't work, something like voting based on research vs. brainwashing. But Maya's personal struggle with doomscrolling is relatable, especially to academics. It's better than addiction examples which might bring in debates about compulsion. 

  Timing is tight. Allocating specific minutes per section ensures coverage. Whiteboard use for definitions and contrasts helps visual learners. Encouraging argument channels their energy productively. 

  Finally, the user's deeper need: they want to foster critical thinking, not just win an argument. They need a structured yet flexible plan that respects the group's background while challenging their assumptions. Making philosophy accessible without oversimplifying is key. The plan should build stepwise, preempt objections, and end with a clear takeaway.
answer: |-
  Here’s your battle-tested, step-by-step teaching plan designed to flip their script in 60 minutes flat. It preempts their misconceptions, uses Maya *perfectly*, and forces the "worth wanting" shift. **Commit to this sequence—it’s engineered for your audience.**

  ---

  ### **The Core Strategy**
  **Anchor the hour on Maya’s case** (it’s ideal—don’t change it). Her story has everything a good case needs:  
  - **Relatability**: Bio/CS people understand habits, self-tracking, and tech.  
  - **Clear agency**: She *engages in reflection*, *makes a plan*, and *sustains effort*.  
  - **Manipulation contrast**: Coercion by the advisor is *externally imposed* without her reasons.  
  - **Lacks baggage**: No addiction/mental illness (which invites "it’s determined!" distractions).  
  - **Outcome-identical**: Both scenarios end with apps deleted—highlighting *process* over result.  

  **Replace Maya ONLY if needed** with: *Alex, a researcher who meticulously chooses a lab based on values (work-life balance, ethics) vs. Alex being secretly assigned to that lab by a dean who manipulated options*. (Maya is stronger—it’s personal agency).

  ---

  ### **Teaching Plan: The 60-Minute Game**  
  *(Whiteboard sections: LEFT = Their Starting Beliefs / RIGHT = New Framework)*  

  #### **Step 1: Meet Them Where They Are (0-10 min)**  
  - **Do:** Start with THEIR language. Ask: *"Raise hands if you think free will is dead—why?"*  
  - **Whiteboard their answers:** "Determinism!" "Libet!" "Brains = cause/effect!"  
  - **Validate then pivot:** *"Great—so if the universe is a clockwork, what *should* we care about? Responsibility? Meaning? Let’s find out what’s actually *worth keeping*."*  
  - ***Why this step:*** Builds rapport. Shows you respect their science literacy. Creates curiosity for the shift.

  #### **Step 2: Introduce "Worth Wanting" & Maya’s Story (10-20 min)**  
  - **Do:** Tell Maya’s story (doomscrolling → tracking → talking → deleting apps → sustaining change).  
  - **Ask:** *"Did she exercise free will? What’s praiseworthy here?"* Note answers.  
  - **Then:** Introduce the twist—*Advisor secretly forces the same behavior via app tweaks*.  
  - **Ask:** *"Same outcome. Same brain states. Is this equally free? Deserves same praise?"*  
  - ***Why this step:*** Forces discomfort. They’ll *want* to say both are "determined so same"—but intuition screams "NO!". This tension is your hook.

  #### **Step 3: Diagnose the Difference (20-30 min)**  
  - **Do:** Contrast whiteboard columns:  
    ```
    MAYA (PRAISE)          | ADVISOR-MAYA (NO PRAISE)  
    ———————————————————————|———————————————————————————  
    Responded to REASONS   | Controlled by EXTERNAL FORCE  
    (data, friends, goals) | (hidden manipulation)  
    ———————————————————————|———————————————————————————  
    Self-directed CHANGE   | No agency/INSIGHT  
    (chose effort)         | (passive victim)  
    ```  
  - **Argue this:** *"Determinism is true in BOTH cases. What matters is the SOURCE of control: Her reasons vs. his intrusion."*  
  - ***Why this step:*** Makes "reasons-responsiveness" concrete. Preempts "but determinism!" by showing it’s irrelevant to the distinction.

  #### **Step 4: Head Off Misconceptions (30-45 min)**  
  ***Preempt these 3 bombs—*** **when they surface (they will), shoot them down HERE:**  
  1. **"But she couldn’t have done otherwise!"**  
     - *Response:* "Compatibilism doesn’t require *alternate possibilities*. It asks: *Was she responsive to reasons?* Could she have acted differently *if reasons changed*? Advisor-Maya couldn’t." (Whiteboard: "Could do otherwise IF...").  
  2. **"Reasons are just brain states—excuses!"**  
     - *Response:* "Yes, reasons *are* physical! But compare: Maya’s reasons arose from her values/reflection. Advisor’s manipulation bypassed that. One process *respects her mind*, one overrides it."  
  3. **"This is just redefining free will!"**  
     - *Response:* *"Exactly—and we should!* 'Ultimate freedom' is incoherent. We care about the freedom that makes responsibility *meaningful*: Did actions reflect YOUR reasons, not coercion or ignorance?"  

  #### **Step 5: Connect to Responsibility (45-55 min)**  
  - **Do:** Ask: *"When should we hold someone responsible? When they’re manipulated like Advisor-Maya? Or when they act like Real-Maya?"*  
  - **Argue:** Blame/praise require *authorship*—not cosmic freedom, but that actions *flow from your character, values, and reasons*.  
  - **Whiteboard:**  
    ```  
    WORTH-WANTING FREEDOM = Actions governed by YOUR REASONS (not coercion, compulsion, ignorance)  
    ```  

  #### **Step 6: Check Understanding & Wrap (55-60 min)**  
  - **Check Question:** *"Imagine Maya’s advisor reveals the manipulation. She says, 'But I’d have deleted the apps anyway!' Does that make her deserving of praise? Why/why not?"*  
    - ***Why it works:*** If they say *"No—she didn’t actually exercise her reasons!"*, they GET IT. If they appeal to determinism, clarify: *"The point isn’t whether she 'would have'—it’s whether she DID."*  
  - **Explicitly SKIP:**  
    - Quantum indeterminacy (irrelevant to compatibilism).  
    - Hard incompatibilism (no free will *or* moral responsibility).  
    - Detailed Libet rebuttals (say: *"Libet shows *some* decisions are automatic—not that *reasoned* choices like Maya’s are."*).  

  ---

  ### **Why This Will Work**  
  - **Uses their bias:** CS/Bio folks respect *functional* definitions. "Reasons-responsiveness" is a *mechanism*—not magic.  
  - **Maya is airtight:** Her story isolates *agency over time* (tracking, deliberating, committing)—which even determined systems can have.  
  - **Preempts derailments:** Each misconception is trapped in the structure. The "worth wanting" pivot comes early and sticks.  
  - **Gives them a win:** They keep determinism! You’re just showing *why it doesn’t destroy what matters*.  

  **Execute this verbatim.** Your crew will argue passionately about Maya—then leave realizing they’ve been valuing compatibilist freedom all along.
