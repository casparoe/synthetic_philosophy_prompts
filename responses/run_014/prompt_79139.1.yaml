answer: |-
  ### 1. **Brainstorm**  
  - **Repeal resistance** hinges on:  
    - *Institutionalization*: Constitutional entrenchment, bureaucratic routines, or independent bodies enforcing norms.  
    - *Cultural norms*: Broad societal acceptance or moral legitimacy beyond legality.  
    - *Pipeline depth*: Self-sustaining beneficiary cohorts in positions to perpetuate inclusion.  
    - *Constituency strength*: Mobilized beneficiaries/allies with power to resist backsliding.  
  - **Repeal fragility** arises from:  
    - *Narrow legalism*: Reliance on statutes/court orders without cultural buy-in.  
    - *Elite capture*: Benefits concentrated among privileged subgroups, weakening mass mobilization.  
    - *Shallow pipelines*: No organic replacement mechanism (e.g., mentorship, alumni networks).  

  ### 2. **Ranking**  
  - **Deep**: Caste-based reservation in India  
  - **Medium**: Race-conscious holistic admissions in US universities  
  - **Shallow**: Norway’s gender quota for corporate boards  

  ### 3. **Mechanisms**  
  - **India (Caste reservation)**: *Constitutional ossification*. Reservations are embedded in India’s basic structure doctrine (immune to legislative repeal), reinforced by a vast bureaucracy, judicial precedent, and pan-caste political mobilization. Even without the law, SC/ST/OBC networks in education/employment would self-perpetuate through kinship and institutional capture.  
  - **US (Race-conscious admissions)**: *Cultural diffusion*. Elite universities internalized diversity as a mission-critical value, alumni networks lobby for it, and admissions offices retain "holistic" tools to proxy race (e.g., adversity essays). The *Students for Fair Admissions* abolition revealed immediate formal compliance but resilient normative commitment.  
  - **Norway (Gender quota)**: *Regulatory isolation*. The quota relied on a narrow statute with weak cultural roots in business elites. Post-repeal (adjusted in 2023), compliance collapsed; boards reverted to male-dominated networks. No pipeline mechanism existed—women placed via quotas lacked organic power to sustain representation.  

  ### 4. **The case against my metric**  
  Repeal depth prioritizes institutional inertia over justice outcomes, mistaking resilience for efficacy. India’s entrenched reservations perpetuate caste identities and spark backlash, while Norway’s shallow quota spurred wider gender-equity reforms. A "deep" regime may be pathologically rigid (e.g., India’s reservation creep distorting meritocracy), whereas a "shallow" one (e.g., Norway’s quota) could catalyze cultural shifts beyond its formal scope. Ranking by repeal depth risks endorsing systems that calcify inequality under a veneer of stability, ignoring dynamic alternatives like class-based affirmative action.  

  ### 5. **Bottom line**  
  India’s caste reservation is the most repeal-resistant regime. The ranking flips if *caste identity’s salience collapses faster than race or gender solidarity*—e.g., evidence that urban Indian youth abandon caste markers while US racial divisions or Norwegian boardroom sexism intensifies.
