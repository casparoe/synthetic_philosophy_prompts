  The three regimes are: race-conscious admissions in US universities, caste-based reservations in India, and Norway's gender quota for corporate boards. The user specifically mentions that one has already been abolished (referring to the US Supreme Court striking down affirmative action in college admissions), which should be treated as an informative case study.

  I'll start with a brainstorm of what makes affirmative-action regimes repeal-resistant or repeal-fragile. Key factors include institutionalization depth (how embedded it is in structures), cultural norms (social acceptance), pipeline development (whether it creates self-sustaining pathways), and constituency strength (beneficiary groups' ability to defend it). 

  For the ranking:
  - India's caste reservation seems deepest due to constitutional entrenchment, strong beneficiary groups, and deep social roots
  - US race-conscious admissions comes next because while struck down, it had built pipelines and cultural norms that survive
  - Norway's gender quota is shallowest as it's a recent, narrow policy without deep institutionalization

  I'll explain the key mechanism for each: legal entrenchment for India, cultural diffusion for the US, and regulatory isolation for Norway. 

  I should also critique the metric itself - repeal depth might miss how abolition changes system dynamics, and it's reactive rather than proactive. The bottom line is India's regime is most repeal-resistant, and evidence that caste identity is weakening faster than expected might flip the ranking.

