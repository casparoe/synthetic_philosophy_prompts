  The salt hung heavy in the air over Haven’s Creek, clinging to the weathered clapboard houses and the rusted hulls of fishing boats resting on the muddy flats. Inside the chilly community center, the Resettlement Committee – Miriam, the retired librarian; Ben, the young boat mechanic; Priya, the doctor’s daughter home from college; and Hank, who’d fished these waters longer than anyone could remember – stared at the two files on the folding table. One vacant spot. Two families needing sanctuary.

  "Family A," Miriam began, her voice precise as card catalog entries. "Father, mother, two young children. Escaped targeted persecution. Government officials raided their home; father was briefly detained and beaten for organizing labor protests. Threats escalated. They fled under cover of night. Classic political refugees. The definition is clear."

  Ben ran a grease-stained hand through his hair. "And Family B? Father, mother, grandmother, teenage son. Their coastal farmland – generations of it – swallowed by saltwater. Irrigation canals poisoned. Crops failed year after year. Now destitute, living in a flooded slum. Equally desperate, Miriam. Just because no one *chose* to drown their fields doesn’t make their need less urgent."

  "That’s just it, Ben," Miriam countered, tapping the file. "The definition *does* turn on the source. Persecution requires a persecutor. Rising seas? That’s… an act of nature. A tragedy, absolutely, but legally distinct." She sighed. "Our mandate, the funding, the framework we operate within… it’s built for Family A."

  Priya leaned forward. "But look at the medical reports. Malnutrition in both sets of children. Trauma evident in both parents’ eyes, even in the photos. Family B’s grandmother has untreated diabetes. Is the *urgency* of needing safety, food, medical care, really less because the ocean, not a secret police force, chased them out? Doesn’t the sheer *need* demand we look beyond definitions?"

  Hank coughed, a raspy sound honed by decades of salt air. "Alright, definitions and urgency aside. We got *one* spot. One apartment the church basement group fixed up. One pot of donated funds stretched thin. Can we *handle* Family B? Four people, including an elderly woman needing care? Family A is younger, smaller. Maybe more… manageable?" He avoided Priya’s sharp glance. "It’s about capacity, plain and simple. We’re a small town. Our resources ain't endless."

  "Capacity matters, Hank," Ben conceded, "But what about proximity? Or… contribution?" He gestured vaguely towards the window, where the scent of low tide seeped in. "Haven’s Creek might not be sinking yet, but we see it, don’t we? King tides flooding Main Street more often. Old Anderson’s marshland gone to open water. Our fishing grounds shifting, warming. We *burned* the stuff, Hank. For decades. Our factories, our cars… didn’t we contribute, just a little, to that saltwater rising in Family B’s homeland? Doesn't that create a… a *debt*?"

  A heavy silence fell. The hum of the fluorescent lights seemed loud. Priya picked up the thread. "Ben’s got a point. The harm that displaced Family B – it’s diffuse, global. But Haven’s Creek isn't an island. We were part of the engine. Does our historic contribution, however small our town, create a specific duty to those displaced by the consequences? More than to those fleeing a specific tyrant half a world away?"

  Miriam looked troubled. "But Family A faces a *targeted* evil. A clear, present danger. Our duty to refugees stems from protecting the persecuted. It’s foundational. Does diluting that with other, however valid, forms of displacement weaken the entire principle?"

  "And what about simple geography?" Hank grumbled. "Family A fled a neighboring country, relatively closer. Family B comes from across an ocean. Does distance lessen our obligation? Or does the sheer scale of the climate disaster, affecting millions, make helping *anyone* from it a moral imperative, regardless of miles?"

  They argued late into the evening. Point and counterpoint. The legal source of harm versus the palpable urgency of need. The limitations of their small-town capacity versus the unsettling echo of historic contribution carried on the salt-laden wind. Geographic proximity seemed a flimsy argument against satellite images showing drowned deltas continents away.

  They examined photos: Family A, huddled and fearful in a crowded transit center; Family B standing knee-deep in the ruin of their ancestral field, the grandmother’s face etched with a loss as deep as the encroaching sea. Both families were equally adrift, equally deserving of a harbor.

  Finally, Miriam closed the files, her usual decisiveness absent. "We… we need more information," she said, her voice weary. "Perhaps clarification on the funding restrictions. Maybe the church group can reassess the apartment... somehow." It was a stalling tactic, and they all knew it.

  The meeting adjourned without a decision. They filed out into the cool night. The rhythmic sigh of the waves against the nearby seawall was a constant reminder. Ben looked up at the stars, brilliant over the dark water. "How do you weigh a boot on a neck against an ocean in a field?" he murmured, more to himself than anyone.

  Priya stopped beside him. "Or how much of that ocean came from the smoke of our chimneys?" she added quietly.

  Hank shuffled towards his pickup, muttering about nets needing mending. Miriam paused on the steps, looking back at the community center’s lit windows reflecting the empty table inside.

  They walked away carrying the unresolved questions, sharper and heavier than before. The distinction between a persecutor and a poisoned sea felt less like a legal boundary and more like an ethical fault line. The balance between their town’s modest capacity and the vast, uncomfortable weight of historic contribution offered no easy scale. The empty apartment waited, a silent testament to the impossible calculus of refuge in a world where the sources of displacement were multiplying faster than the havens. The salt air tasted different now – not just of home, but of a rising tide of complexities they could no longer ignore.
