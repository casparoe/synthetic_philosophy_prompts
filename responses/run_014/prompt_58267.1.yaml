  First, I should consider the conceptual dependencies for the strategy-stealing argument. The most critical pitfall is misunderstanding the non-constructive nature of the proof - people often think it reveals actual winning moves when it only proves existence. The audience will likely struggle with abstract game theory concepts like perfect information and deterministic outcomes, especially if they try to apply this to chess where draws complicate things. I need to emphasize that this applies only to specific types of games.

  For the teaching sequence, I should start with the game rules to establish common ground before introducing any argument. The properties of the game (no draws, symmetry, monotonicity) must be clarified before strategy-stealing makes sense. The "extra move" concept comes later as the core mechanism, followed immediately by addressing why it's non-constructive.

  Between Hex and the 4-in-a-row game, Hex is better despite its abstraction. The 4-in-a-row game has potential draws which violate the no-draw condition, and its asymmetry could cause issues. Hex's pure connection goal makes the stealing mechanism clearer. I'll suggest a 3x3 Hex board as manageable yet sufficient.

  Major misconceptions to preempt include: the chess fallacy (address when listing qualifying games), the mirroring confusion (clarify during symmetry discussion), and the constructive expectation (confront head-on after presenting the argument). The "extra move harms player" concern should be neutralized when explaining monotonicity.

  For the learning checkpoint, a "Why can't we actually use this strategy?" question would work well to test understanding of the non-constructive aspect. I should explicitly state what we're omitting - formal game theory notation, infinite boards, and Zermelo's theorem details - to keep the session focused.

