prompt: |-
  I've just started volunteering one afternoon a week at my county historical society, and it has unexpectedly radicalized the way I think about archives: last Tuesday my main job was helping decide which boxes from a defunct fraternal lodge we should accession and which we should let the family throw away, and I realized I was standing inside the machine that decides what the future will be allowed to know. This coincided with finishing Michel-Rolph Trouillot's 1995 book Silencing the Past: Power and the Production of History in a course I'm auditing, whose central claim, as I understand it, is that silences are not accidents of forgetting but are produced at every stage of history-making — when sources are created in the first place, when archives assemble and select among them, when narratives are built from what survives, and when significance is assigned in retrospect. I'd like you to act as a historian of archives and colonial knowledge, think carefully before answering, and work through one concrete episode with me using that framework: the Franciscan friar Diego de Landa's campaign in Yucatán, culminating in the auto-da-fé at Maní on July 12, 1562, where, by his own account, twenty-seven Maya books and some five thousand sacred images were burned, after interrogations conducted by hoisting suspects into the air with their hands bound. Only three pre-Columbian Maya codices (plus fragments of a fourth) are known to survive today.

  Here are the complications that make the episode feel tailor-made and yet somehow ill-fitting for the framework, and I want you to take them seriously rather than smoothing them over. First, the person who ordered the destruction is also the author of the Relación de las cosas de Yucatán, a detailed account of Maya religion, calendar, and writing written a few years later, which survived only as an abridgment of later copies and was itself lost to scholarship for centuries before resurfacing in the nineteenth century — and which became one of the key Rosetta stones for the twentieth-century decipherment of Maya glyphs. So the primary channel through which we know anything about what was burned is the arsonist's own archive, partly produced under torture, and the silencing was accompanied by an act of preservation that itself proved decisive. Second, and this is what keeps nagging me: Trouillot's silences seem to work by quiet omission, by things never quite making it into the record, whereas Maní was a loud, ceremonial, deliberate destruction, openly justified in Landa's writing as the removal of superstition. Is an announced bonfire a "silence" in Trouillot's sense at all, or is it a limiting case that shows where the framework needs a distinction between records that are missing and records that were made to go missing — and does that distinction actually change what the framework predicts about who can now speak in the sources and who cannot? Third, the three surviving codices survived largely by ending up in European collections — Dresden, Madrid, Paris — so even the scraps of pre-Columbian voice that exist exist on the conquerors' shelf.

  Please run the analysis in both directions, as my instructor keeps demanding. Going one way: map the episode onto the stages of Trouillot's framework — what happened at the level of source creation (Maya literate culture, the interrogations, the Relación itself), archive assembly (what the Franciscans kept, copied, and shipped to Spain versus what they burned), narrative construction (how the episode has been told since, including the recent tendency to cast Landa as either monster or inadvertent preserver), and retrospective significance (what it means to us now, in an era of digital archives and my own little accession decisions). Going the other way: say honestly where the framework strains or goes silent on this episode, and whether some other lens — the destruction of books as a technology of conversion, or the archive as war booty — does better work. Where you draw on interpretive debates (about Landa's motives, about how many books there really were, about how much the surviving Relación reflects Landa versus his later copyists), please flag what is reasonably settled among specialists and what is genuinely contested, and don't present a contested reading as the consensus. If it helps you think, start by brainstorming the possible mappings before committing to one, but I'd like the final analysis to be disciplined about who and what plays each role in the framework, and to end with what the episode teaches someone like me, standing over a cardboard box deciding what gets a folder and an accession number and what gets a dumpster.
reasoning: |-
  Okay, let me unpack this user's query carefully. They're a history volunteer who just had an archival epiphany while handling fraternal lodge records, combined with reading Trouillot's Silencing the Past. Their case study is Landa's 1562 Maní auto-da-fé where Maya codices were burned, but with complications: Landa himself created key documentation about what was destroyed, and the survival of three codices depended entirely on European collectors.

  Hmm, the user wants me to wear two hats: apply Trouillot's framework rigorously to Landa's case while also stress-testing it against the complications they noted. Specifically: 1) How destruction/preservation coexist in one actor, 2) Whether loud destruction fits Trouillot's "silence" concept, and 3) How colonial custody shapes surviving sources. They want both directions: framework → case study and case study → framework limitations.

  First, I need to map Trouillot's four silences onto this episode:
  - **Source creation**: Maya literacy was actively suppressed while Landa's Relación (partly based on torture testimonies) became the privileged record. The power imbalance here is stark.
  - **Archival assembly**: The Franciscans curated what crossed the Atlantic - their own reports over indigenous knowledge. Even "preserved" items like the surviving codices were exotic collectibles, stripped of context.
  - **Narrative construction**: Modern scholarship keeps oscillating between "Landa the destroyer" and "Landa the preserver" binaries, still centering him. Maya resilience narratives exist but fight uphill battles against the archival grain.
  - **Retrospective significance**: Digital archives today inherit this asymmetry - scanning European-held codices doesn't restore their original meaning.

  But the complications poke holes. Trouillot's silences are usually passive omissions, but Maní was theatrical destruction - more "shouting down" than "not recording." Maybe we need Ann Stoler's idea of "active dismantling" alongside Trouillot. Also, Landa's dual role shows preservation/destruction aren't opposites but tools of the same power structure. His Relación preserves only what served evangelization.

  For the user's practical dilemma: This case screams that archival choices are never neutral. When they decide between "folder" or "dumpster," they're repeating Landa's power dynamic on a smaller scale. The solution? Conscious weight-shifting - like prioritizing marginalized voices even if fragmentary, or documenting discard decisions transparently.

  The user's clearly wrestling with ethical responsibility in archives. Their frustration with Landa's paradoxes mirrors their own positionality - wanting to avoid being a tiny cog in the silencing machine. My response should validate that discomfort while giving concrete historical tools to navigate it.
answer: |-
  Your engagement with Trouillot's framework at this archival crossroads is profoundly insightful. Landa's auto-da-fé at Maní is indeed a crucible for testing *Silencing the Past* precisely because its violence clashes with our notion of "silence." Let's dissect it rigorously, embracing your complications.

  ### Mapping Maní onto Trouillot's Four Stages of Silencing

  1.  **Silencing in the Making of Sources (Act 1):**
      *   **What Existed:** Maya *ah k’u hun* (keepers of books) produced complex codices recording cosmology, astronomy, rituals, dynastic histories, and calendrics – a rich, living textual tradition.
      *   **Silencing Mechanisms:** Landa’s campaign actively destroyed the physical sources (codices, idols) and the social structures enabling their creation/preservation. Torture (*strappado*) wasn't just punishment; it was a tool to force Maya elites *to become sources themselves*, confessing "idolatrous" practices under duress for Landa’s *Relación*. This created sources *through* silencing, shaping the information recorded (focusing on "superstition" for eradication) and delegitimizing the original creators' voices and context. Silence was produced by destroying the *conditions* for autonomous Maya source creation within the colonial regime.

  2.  **Silencing in the Making of Archives (Act 2):**
      *   **The Assembly:** The Franciscans, led by Landa, acted as the de facto archive. Their criteria were stark:
          *   **Destroy:** Maya codices, "idols," objects deemed idolatrous. This was active, ceremonial erasure – not passive neglect.
          *   **Preserve/Produce:** Landa's *Relación*, interrogation records (now lost), letters justifying actions (like Landa's 1562 report), and select confiscated items deemed "curious" or evidence of "devilry" (potentially aiding the surviving codices' journey to Europe as curiosities/booty). **Crucially:** What was preserved was filtered through the lens of conquest, conversion, and European epistemology. The Maya voices included were mediated by torture and framed as confessions of error.
      *   **Silencing Mechanisms:** The archive assembled privileged the conqueror's narrative (justification, ethnographic curiosity) over the conquered's intrinsic knowledge systems. The *act of burning* was the ultimate archival selection: a violent "de-accessioning." The survival of the three codices in Europe underscores your point: they exist *only* as incorporated into the *conqueror's archive* (Dresden, Madrid, Paris), stripped of provenance, context, and living tradition, becoming objects of European study, not Maya use.

  3.  **Silencing in the Making of Narratives (Act 3):**
      *   **Early Narratives:** For centuries, Landa's *Relación* (once rediscovered) was the *primary* source. Narratives often framed the burning as a regrettable but understandable zeal against "paganism" or focused on Landa's "ethnographic contribution," downplaying the violence and loss. The Maya were passive victims or "idolaters."
      *   **Modern Oscillations:** As you note, narratives frequently split:
          *   **Landa the Monster:** Emphasizing the violence, cultural genocide, and irreparable loss (e.g., Clendinnen, early León-Portilla).
          *   **Landa the Inadvertent Preserver:** Highlighting the *Relación*'s crucial role in decipherment, framing the burning as tragic irony but granting Landa a paradoxical, positive legacy (often linked to early Mayanist scholarship).
      *   **Emerging Counters:** Contemporary scholarship (e.g., Restall, Chuchiak IV) works to center Maya resilience, reinterpret colonial sources against the grain, and utilize archaeology/epigraphy to reconstruct pre-contact perspectives obscured by Landa's archive. Indigenous scholars emphasize ongoing cultural survival *despite*, not because of, Landa.
      *   **Silencing Mechanisms:** Trouillot's point holds: narratives built *from* the colonial archive (even critical ones) struggle to escape its framing. The "Monster/Preserver" binary *still centers Landa*. Truly centering Maya perspectives requires laboriously reconstructing silences using non-textual evidence and living traditions, fighting the archival grain. The very *debate* about Landa's motives (genuine zealot? ambitious cleric consolidating power?) often overshadows the *fact* and *impact* of destruction.

  4.  **Silencing in the Making of History (Retrospective Significance - Act 4):**
      *   **Current Significance:** Maní symbolizes colonial epistemicide. It's invoked in discussions of:
          *   **Cultural Patrimony/Restitution:** The surviving codices' location in Europe is contentious.
          *   **Archival Power:** Embodies the violent origins of many colonial archives.
          *   **Decolonial Scholarship:** A rallying point for methodologies seeking to "read against the grain" and recover subaltern voices.
          *   **Digital Dilemmas:** Digitizing the Dresden Codex makes it accessible but doesn't resolve questions of custody, context, or the silence of the thousands destroyed. Your "accession decisions" echo Landa's choices on a micro-scale, determining future research possibilities.
      *   **Silencing Mechanism:** The episode's significance is often defined by *loss* and *colonial violence*, which, while crucial, can inadvertently reinforce the image of Maya culture as *past* and *destroyed*, potentially obscuring continuity and contemporary vitality. The focus on the *physical* destruction can overshadow the ongoing silencing through archival structure and narrative privilege.

  ### Stressing the Framework: Where Trouillot's "Silences" Meet Loud Destruction & Paradoxical Preservation

  1.  **Is Burning "Silence"? Yes, Radically.**
      Trouillot's "silences" encompass *systematic erasure*, not just passive forgetting. Maní is the ultimate Act 1 & 2 silencing: the *production of absence*. The "loudness" doesn't negate it; it *demonstrates the power required* to impose that silence. The distinction between "missing" and "made missing" is vital *within* Trouillot's framework: it highlights **agency and power**. Records "made missing" (like the codices) are silenced by deliberate, often violent, intervention. This *intensifies* the framework's prediction: those whose records were *targeted* for destruction (Maya priests, indigenous knowledge systems) face the steepest climb to be heard. Their voices survive primarily through the conqueror's mediation (Landa's *Relación*, colonial documents) or non-textual forms (material culture, oral tradition, contemporary practice). The framework predicts their profound marginalization in the *surviving* archive, which Maní exemplifies tragically.

  2.  **Landa the Destroyer/Preserver: The Janus-Faced Archon.**
      This is the core paradox straining the framework. Landa embodies the intimate link between destruction and (selective, self-serving) preservation inherent in colonial knowledge production.
      *   **Power's Monologue:** The *Relación* isn't a true preservation of Maya voice; it's a *translation* (often literal) and *reinterpretation* framed by Landa's goal: to understand the "enemy" (idolatry) to better eradicate it. Information deemed useful for control (calendar, writing basics) was preserved; context, theology, history deemed dangerous was burned. The *Relación* survives *because* it served the colonial project (ethnographic control, justification).
      *   **Not Inadvertent, but Instrumental:** Framing Landa as an "inadvertent preserver" is misleading (**contested**). His preservation was deliberate *for his purposes*. His "service" to modern decipherment is a *historical accident*, not his intent. Specialists agree the *Relación* is invaluable but **contentiously debated** regarding its accuracy, the degree of torture's distortion, and how much the surviving abridgment reflects Landa vs. later copyists/editors (e.g., the problematic Tozzer translation notes).
      *   **Framework Strain:** Trouillot focuses on silencing *by* omission or marginalization. Landa shows silencing *through* active destruction *alongside* the production of a *dominant, substitute archive* that claims to represent the silenced. The framework needs explicit expansion for this colonial tactic: **annihilative preservation** – destroying the original source while creating a curated, authoritative replacement that controls the narrative of the destroyed.

  3.  **Survival as Booty/Curiosity: The Archive's Colonial Foundation.**
      The survival of the three codices highlights another key lens: **the archive as a site of colonial plunder and epistemic appropriation** (Stoler, Derrida). They weren't preserved by Maya tradition but as European trophies/exotica. This reinforces Trouillot: *what survives* in the dominant archive survives on the *dominant culture's terms*. Their "voice" is accessible only through the physical and intellectual custody of the colonizer, separated from the living culture that created them. This lens complements Trouillot by emphasizing the *materiality* of archival power and the role of appropriation in shaping the "surviving" record.

  ### Lessons for the Cardboard Box: What Maní Teaches the Archivist

  1.  **You *Are* Inside the Machine:** Your decisions *are* acts of power shaping future knowledge. Maní is an extreme, violent example, but the principle of selection=consequence remains. Acknowledge this power.
  2.  **Embrace the Weight:** Don't shy from the responsibility. See your role not just as custodian, but as an actor in an ongoing process of historical production and potential silencing.
  3.  **Interrogate the "Why" of Survival & Loss:** For every item you accession, ask: *Why* did this survive? What processes (social, economic, political) led it *here*? For items discarded: *Why* is this deemed unworthy? Is it truly without value, or does it represent a gap in *our* perspective (e.g., records of marginalized groups, ephemera)? Landa shows "survival" isn't neutral.
  4.  **Document the Silences:** When you discard, document *what* you discarded and *why*, as transparently as possible. This meta-data about absence is crucial future history. Landa documented his destruction *as justification*; document yours *as transparency*.
  5.  **Seek the Marginalized:** Actively look for voices traditionally excluded or silenced within the collection (e.g., women, laborers, minority groups within the lodge). Prioritize their accession if possible. Challenge the inherited biases of past archivists.
  6.  **Context is King:** Accession isn't just the item; it's its provenance, relationships to other items, the story of how it got there. The Dresden Codex without context is a puzzle; with context, it's a fragment of a shattered world. Document context rigorously.
  7.  **Humility in the Face of Loss:** Recognize that some silences, like those created at Maní, are irrevocable. Your role is to mitigate *new* silences and make the *process* of selection as ethical and transparent as possible, knowing perfection is unattainable.

  Maní teaches that archives are born of violence, selection, and power. Trouillot gives us the framework to see the silencing; Landa's horrifying paradox shows its brutal mechanics and the unsettling entanglement of destruction and preservation within colonial power. Your work at the historical society, consciously undertaken, is a small but vital act of resistance against the replication of unthinking silence. You are not just deciding what goes in a folder; you are shaping, however modestly, what future generations will be *allowed* to argue about.
