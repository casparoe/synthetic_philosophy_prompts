prompt: |-
  In a course on early modern philosophy, our professor summarized Montaigne's essay "Of Cannibals" roughly as follows: "Montaigne argues that we have no objective standard by which to judge other cultures, so calling the Brazilian Tupinambá 'barbarous' for practicing cannibalism is just European prejudice. He points out that the Tupinambá only eat their enemies after honorable combat and as a ritual of respect, whereas Europeans torture and burn people alive over religious disagreements — which, Montaigne implies, is far worse. The essay is essentially an early statement of cultural relativism: Montaigne's conclusion is that no culture's practices are better or worse than any other's, and that morality is just a matter of local custom."

  I've since read the essay myself, and something about this summary feels off — not entirely wrong, but it seems to flatten Montaigne's position in a way that makes it easier to dismiss. I'm not sure I can articulate what the problem is, though. Can you go through this summary and tell me what a careful reader of Montaigne would accept, what they'd push back on, and whether the label "cultural relativism" fits the essay he actually wrote?
reasoning: |-
  Okay, the user is pointing out a discrepancy between their professor's summary of Montaigne's "Of Cannibals" and their own reading. The professor framed it as an early statement of cultural relativism, where morality is entirely dependent on local customs with no objective standards. But the user feels this summary oversimplifies Montaigne's position, making it easier to dismiss. They want a critical analysis of the summary, highlighting what's accurate and what's misleading, and whether "cultural relativism" is an appropriate label.

  First, I need to recall Montaigne's essay accurately. Montaigne does critique European ethnocentrism by comparing the Tupinambá's ritual cannibalism to European practices like religious torture. He emphasizes that the Tupinambá have structured rituals and reasons for their actions, unlike Europeans who commit violence under the guise of religion. The professor's summary captures this comparative critique well, pointing out the hypocrisy in labeling others as "barbarous."

  However, the user suspects the summary flattens Montaigne's deeper arguments. The professor claims Montaigne concludes that no culture's practices are better or worse, implying moral equivalence. But Montaigne actually uses a natural law framework. He contrasts "artifice" (corrupted culture) with "nature" (purity). The Tupinambá are portrayed as closer to nature, thus more virtuous in some aspects. This isn't relativism but an appeal to a higher standard—nature itself. 

  Also, Montaigne's skepticism here is nuanced. He doesn't deny all moral truths; instead, he questions Europe's arrogant claim to possess them. His relativism is more about epistemic humility—recognizing the limits of human judgment—rather than metaphysical relativism. The essay also criticizes the corruption of European society, suggesting that primitive societies might better embody natural virtues. This complexity is lost when labeled simply as cultural relativism.

  The user might be concerned that oversimplifying Montaigne undermines his relevance. Presenting him as a relativist makes his arguments easy targets for critics who dismiss relativism as self-refuting. But Montaigne's actual approach, grounded in skepticism and natural law, offers a more robust critique of colonialism and ethnocentrism. The user probably wants to engage with Montaigne's nuanced position, not a strawman.

  Additionally, the user might be preparing for academic discussion or writing. They need a precise understanding to contribute effectively. Highlighting Montaigne's use of hyperbole and paradox could help them defend a more sophisticated interpretation. Emphasizing terms like "skeptical humanism" rather than "cultural relativism" would be more accurate.

  In conclusion, the professor's summary isn't entirely wrong but misses Montaigne's deeper philosophical layers. The critique of Eurocentrism is correct, but the relativist label ignores his appeal to nature and virtue. The user needs this distinction to appreciate Montaigne's enduring significance in moral philosophy.
answer: |-
  You've identified a crucial nuance often missed in summaries of Montaigne. Your professor's synopsis captures the *surface* critique but oversimplifies and potentially misrepresents the essay's deeper philosophy and rhetorical strategy. Here's a careful reader's analysis:

  **What the Summary Gets Right:**

  1.  **Critique of European Hypocrisy & Ethnocentrism:** Absolutely correct. Montaigne relentlessly exposes the hypocrisy of Europeans calling the Tupinambá "barbarous" while engaging in far more widespread, cruel, and *spiritually corrupt* violence (religious wars, torture, persecution). The comparison of Tupinambá ritual combat/cannibalism versus European religious persecution/burning is central and powerfully made.
  2.  **Rejection of "Barbarous" Label Based on Ignorance:** Montaigne definitively argues that labeling unfamiliar practices "barbarous" simply because they differ from our own is prejudice born of ignorance and arrogance. He demands we understand practices within *their* cultural context before judging.
  3.  **Exposure of Cultural Bias:** The essay is a masterclass in demonstrating how one's own culture acts as a distorting lens. Montaigne highlights how Europeans misinterpret Tupinambá realities through their own preconceptions ("artifice and invention").
  4.  **Skepticism Towards Absolute Cultural Superiority:** Montaigne profoundly doubts Europe's claim to possess the one true, superior civilization and morality. He shows how easily "civilization" masks deep corruption.

  **Where the Summary Goes Astray or Flattens Montaigne:**

  1.  **"No Objective Standard"? Not Quite:** Montaigne doesn't explicitly deny *all* objective standards. Instead, he **shifts the standard**. He contrasts European "artifice" (corrupted by ambition, avarice, tyranny, religious dogma) with Tupinambá "nature" (closer to natural innocence, simplicity, and virtue). His famous line: *"There is nothing savage or barbarous about those peoples, except that we call barbarous whatever is contrary to our own habits. Indeed, we seem to have no other criterion of truth and reason than the type and kind of opinions and customs current in the land where we live."* This isn't *denying* truth/reason, but attacking our *arrogant assumption* that our local customs *are* that universal truth/reason. He implies a standard *closer to nature* might be better.
  2.  **Implied Moral Hierarchy, Not Equivalence:** Montaigne doesn't conclude all practices are morally equal. He strongly **implies the Tupinambá are morally superior in key aspects**:
      *   Their warfare is limited, honorable, and motivated by valor, not conquest or religious fanaticism.
      *   Their society lacks many European vices: lying, treachery, avarice, envy, slander, forgiveness (which he sees as hypocritical), servitude, and poverty.
      *   He admires their natural virtue, courage, and fidelity. He portrays them as embodying a kind of *natural nobility* lost in corrupt European society.
      *   **Crucially:** He argues their cannibalism, *within their context* and compared to European atrocities, is *less barbarous*: *"I consider it more barbarous to eat a man alive than to eat him dead; to tear by rack and torture a body still full of feeling, to roast it by degrees, to give it to be torn and chewed by dogs and swine... than to roast and eat him after he is dead."* This is a comparative judgment favoring the Tupinambá practice *relative* to European torture, not declaring them morally identical.
  3.  **"Morality is just a matter of local custom"? Too Strong:** Montaigne shows how much *is* shaped by custom ("the tyrant of our lives"), and how easily we mistake custom for nature. However, he doesn't reduce *all* morality *only* to custom. His appeal to "nature" as a benchmark suggests a deeper, more universal standard accessible through reason and observation, even if obscured by cultural distortion. His critique is that Europeans are *farther* from this natural standard due to their corrupt customs.
  4.  **The Goal is Skeptical Critique, Not Relativist Dogma:** Montaigne's primary aim isn't to establish a theory of cultural relativism. It's a **skeptical exercise** using the Tupinambá as a mirror to:
      *   Undermine European arrogance and certainty.
      *   Expose the hypocrisy and barbarity lurking beneath European claims of civilization.
      *   Provoke self-reflection and humility in his readers.
      *   Suggest that "primitive" societies might possess virtues lost in "advanced" ones. He uses the Tupinambá as a **rhetorical tool** to destabilize European complacency, not to definitively prove all moral systems are equally valid.

  **Does "Cultural Relativism" Fit?**

  *   **In a Limited, Descriptive Sense, Partially:** Montaigne brilliantly *describes* cultural relativism as a phenomenon – the way our judgment is shaped by our own culture, leading us to misjudge others. He powerfully argues *against* ethnocentrism.
  *   **As a Normative Ethical Theory, No:** Montaigne does **not** argue that because morality is culturally relative, we *should* withhold all judgment or that all practices *are* equally valid. He:
      *   Makes clear comparative judgments (Tupinambá warfare/virtues > European warfare/corruption).
      *   Implicitly appeals to a standard of "nature" or "natural reason" against which corrupt customs (like European religious persecution) can be measured as worse.
      *   Uses the Tupinambá not to relativize *all* morality, but to relativize *Europe's claim* to moral superiority and reveal its specific failures against a (implied) more fundamental standard.

  **A More Accurate Characterization:**

  Montaigne's essay is better described as:

  1.  **A Radical Critique of Ethnocentrism and Colonial Arrogance.**
  2.  **An Exercise in Skeptical Humanism:** Undermining certainty to foster humility and self-critique.
  3.  **An Appeal to Natural Simplicity/Virtue:** Suggesting that societies closer to a state of nature (like the Tupinambá, as he constructs them) may exhibit virtues lost in complex, "civilized" societies corrupted by artificial desires and doctrines.
  4.  **A Masterful Use of Perspective and Paradox:** Using the "cannibal" to reveal the true "barbarians."
  5.  **Proto-Cultural Relativism in its Descriptive Force:** But stopping short of the full normative claim that all moral systems are equally valid or that judgment is impossible. He judges, but by a different, implied standard.

  **Conclusion:**

  Your instinct is correct. The summary captures the immediate, polemical thrust against European hypocrisy but flattens Montaigne's deeper philosophical move. It misreads his admiration for Tupinambá virtue (implying a standard *they* meet better) as simple equivalence. It mistakes his devastating *skepticism* towards European claims of absolute superiority for a *dogmatic relativism* denying all standards. Montaigne isn't saying "everything is relative, so who's to judge?" He's saying, "Your arrogant certainty in judging others is baseless and hypocritical; look at yourselves through this other mirror, and you might see you've fallen further from true virtue than those you call barbarous." The label "cultural relativism" is a later imposition that doesn't quite fit the complex, skeptical, and nature-oriented humanism Montaigne actually practices in this essay.
