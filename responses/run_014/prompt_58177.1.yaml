  Below is a decision tree designed for a second-year undergraduate unit on practical rationality, based on the standard toxin scenario. The tree begins with the core puzzle (a billionaire offers $1 million for sincerely forming the intention at midnight to drink a mildly painful but harmless toxin the next day, with no benefit from actually drinking) and ends with one of four stances on whether the prize can be rationally won. The tree uses five yes-or-no questions as branch nodes, each phrased as a substantive claim about intention, reasons, or diachronic planning that students can answer based on their understanding of rationality concepts, without knowing which stance it leads to. The questions do not contain jargon and are designed to be accessible for undergraduate students.

  Two questions (Q2 and Q3) explicitly incorporate the classroom variants:
  - **Escrow variant**: The agent may deposit a small sum beforehand (e.g., $100), forfeited if she defects (does not drink).
  - **Indifferent-fluid variant**: The fluid causes no pain or pleasure, only a temporary cosmetic effect (e.g., turns skin blue for an hour).

  ### Decision Tree
  The tree is structured as follows. Students start at Q1 and follow the branches based on their yes/no answers. Each path ends in a leaf stance or an "incoherent" outcome. The four stances are:
  - **Stance A**: Rational intention requires sufficient reason to act later (prize cannot be won rationally).
  - **Stance B**: It can be rational to intend while also rational to defect later (prize can be won, but defection is expected).
  - **Stance C**: Rationality requires sticking to a prior plan once adopted (prize can be won if the agent commits and acts).
  - **Stance D**: A reason to intend itself creates a reason to act (prize can be won by bootstrapping a reason to drink).

  **Tree Structure**:
  ```
  Start
  │
  Q1: Does forming a rational intention to act later require that the agent currently believes there will be sufficient reason to perform the action when the time comes? 
  │
  ├─ Yes (→ Stance A) 
  │
  └─ No (→ Q2)
     │
     Q2: In the indifferent-fluid variant (no pain, only cosmetic effect), can the reward for intending provide a sufficient reason to drink the fluid later?
     │
     ├─ Yes (→ Stance D)
     │
     └─ No (→ Q3)
        │
        Q3: In the escrow variant (small deposit forfeited if defecting), does the potential loss of the deposit provide a sufficient reason to drink, making rational intention formation possible?
        │
        ├─ Yes (→ Q4)
        │   │
        │   Q4: Once a rational intention is formed, does rationality require the agent to follow through with the action if no new reasons against acting have arisen?
        │   │
        │   ├─ Yes (→ Stance C)
        │   │
        │   └─ No (→ Stance B)
        │
        └─ No (→ Q5)
            │
            Q5: Does rationality demand that an agent follow through on a prior intention to maintain diachronic consistency, even if no new reason to act exists?
            │
            ├─ Yes (→ Stance C)
            │
            └─ No (→ Stance B)
  ```

  ### Detailed Explanation of Nodes and Leaves
  - **Q1: Does forming a rational intention to act later require that the agent currently believes there will be sufficient reason to perform the action when the time comes?**  
    - **Substantive claim**: Focuses on whether intention formation depends on foreseeing sufficient reasons for future action. A "yes" means intention cannot be formed without a current belief in future reasons to act (e.g., in the toxin case, no reason to drink later implies no rational intention). A "no" allows intention formation even if future action seems unjustified.
    - *Yes path*: Leads directly to **Stance A** (rational intention requires sufficient reason to act later). Here, the prize cannot be won because, at midnight, the agent knows no reason exists to drink the painful toxin later, so forming the intention is irrational.

  - **Q2: In the indifferent-fluid variant (no pain, only cosmetic effect), can the reward for intending provide a sufficient reason to drink the fluid later?**  
    - **Substantive claim**: Tests whether a reason to intend (the reward) can directly generate a reason to act when the disincentive (pain) is removed. A "yes" means the reward motivates drinking; a "no" means it does not, as drinking remains pointless.
    - *Yes path*: Leads to **Stance D** (a reason to intend itself creates a reason to act). The prize can be won: the reward justifies forming the intention, and this reason "bootstraps" a reason to drink the indifferent fluid (e.g., avoiding irrationality or honoring the intention).
    - *No path*: Proceeds to Q3, as the indifferent-fluid variant does not resolve the dilemma.

  - **Q3: In the escrow variant (small deposit forfeited if defecting), does the potential loss of the deposit provide a sufficient reason to drink, making rational intention formation possible?**  
    - **Substantive claim**: Examines whether a small penalty for defection can create an incentive to act, enabling coherent intention formation. A "yes" means the forfeit risk provides sufficient reason to drink; a "no" means it is insufficient or irrelevant.
    - *Yes path*: Proceeds to Q4, as intention formation is now possible, but we must assess whether rationality requires follow-through.
    - *No path*: Proceeds to Q5, as the escrow variant fails to provide a solution, so we test general views on diachronic rationality.

  - **Q4: Once a rational intention is formed, does rationality require the agent to follow through with the action if no new reasons against acting have arisen?**  
    - **Substantive claim**: Addresses diachronic rationality—whether sticking to a plan is required for consistency. A "yes" means defection is irrational without new information; a "no" means defection can be rational if no reason to act exists.
    - *Yes path*: Leads to **Stance C** (rationality requires sticking to a prior plan once adopted). With the escrow penalty providing a reason to drink, the agent can form the intention rationally and must follow through to avoid inconsistency or loss. Prize can be won.
    - *No path*: Leads to **Stance B** (it can be rational to intend while also rational to defect later). Even with the escrow penalty, defection may be rational if the forfeit is small, so the agent can form the intention but defect without irrationality. Prize can be won (via intention), but not acted on.

  - **Q5: Does rationality demand that an agent follow through on a prior intention to maintain diachronic consistency, even if no new reason to act exists?**  
    - **Substantive claim**: Generalizes Q4 to cases without variants, testing if intentions create binding commitments. A "yes" means consistency is required; a "no" means it is not.
    - *Yes path*: Leads to **Stance C** (as in Q4 yes, but applied generally). Prize can be won if the agent commits, but this may require "irrational" follow-through in the standard case.
    - *No path*: Leads to **Stance B** (as in Q4 no, but applied generally). Prize can be won by forming the intention, with defection rational later.

  ### Key Features and Notes
  - **Incoherent Stance Combination**: The path **Q1=No → Q2=No → Q3=Yes → Q4=No** (leading to Stance B) is **incoherent and empty**.  
    - **Explanation**: If Q3=Yes (escrow provides sufficient reason to drink), then defection at the time of action would be irrational due to the forfeit. However, Stance B claims defection can be rational, which contradicts the sufficient reason established by the escrow. Thus, this combination is inconsistent—it asserts both that a reason to act exists (from escrow) and that defection is rational, violating practical rationality principles. This path should be flagged as empty in classroom discussion.

  - **Stances the Tree Cannot Separate**: The tree **cannot distinguish between Stance B and Stance C in the standard toxin scenario without variants**.  
    - **Explanation**: In paths without variants (e.g., Q1=No → Q2=No → Q3=No → Q5=Yes/No), Stance B and Stance C both address whether defection is rational after intention formation, but the tree relies on Q4/Q5 to separate them. However, in the standard case (painful toxin, no variants), both stances depend on the same core disagreement about diachronic rationality, and the tree does not probe deeper into "why" defection might be rational (e.g., resource conservation vs. consistency norms). Thus, students might conflate these stances when variants are not in play. Highlight this limitation to emphasize that real-world rationality debates often hinge on unresolved philosophical tensions.

  - **Stance Assignments and Prize Outcomes**:
    - **Stance A**: Prize cannot be won (intention formation is irrational).
    - **Stance B**: Prize can be won (intention formed rationally, but defection rational).
    - **Stance C**: Prize can be won (intention formed, and follow-through required).
    - **Stance D**: Prize can be won (intention and action both rational due to bootstrapping).

  This tree encourages students to explore key concepts (e.g., instrumental rationality, bootstrapping, and diachronic commitment) through variants, while highlighting philosophical ambiguities. Use it to stimulate debate on whether rationality is synchronic (moment-by-moment) or diachronic (over time).
