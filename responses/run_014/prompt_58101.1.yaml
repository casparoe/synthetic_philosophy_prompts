  ## The Flickering
  **(A Story in British English)**

  **Brainstorm:**
  *   **Core Conflict:** Nurse's professional duty (objective attitude - seeing patient as diseased object needing care) vs human resentment (reactive attitude - holding patient morally responsible for cruel words). Dementia *should* exempt, but flickering lucidity sabotages that exemption.
  *   **Key Mechanism:** Patient's moments of clarity – eyes sharpening, tone shifting – make the cruelty feel *intentional*, triggering reactive anger. Sudden confusion then yanks the exemption rug away, inducing guilt. This oscillation prevents either attitude stabilising.
  *   **Strawson Integration:** Show, don't tell. Reactive = flinching, tightening grip, biting back retorts, internal fury. Objective = clinical tone, mechanical movements, reciting medical facts internally. The *mess* is when she’s doing both simultaneously.
  *   **Setting:** NHS hospice. Bleakly cheerful decor, lingering antiseptic, muffled sounds. Emphasise the exhausting, intimate labour (bathing, feeding).
  *   **Nurse (Maya):** Experienced but fraying. Deeply empathetic normally, but this patient’s cruelty chips away. Secretly feels ashamed of her resentment.
  *   **Patient (Eleanor):** Once sharp-tongued society woman? Dementia amplifies malice in lucid flashes. Confusion manifests as fear or vacant sweetness. Physical frailty contrasts verbal venom.
  *   **Emotional Ambivalence:** The heart of it. Resentment *during* cruelty, shame *immediately after* when confusion returns, exhaustion from the whiplash. No clear resolution, just endurance.
  *   **British Touch:** NHS context, tea as a coping mechanism, understatement in dialogue, specific regional insults potentially ("daft cow", "mardy").

  ---

  The air in Cedar Ward hung thick with the cloying sweetness of air freshener battling underlying notes of illness and bleach. Maya Patel adjusted the IV stand beside Bed 7, her movements practised, automatic. Objective Attitude. That was the armour. Eleanor Bradshaw wasn't cruel; she was vascular dementia, stage four. A collection of misfiring synapses, decaying vessels. A medical object requiring care. Objective.

  "About time, you lazy cow," Eleanor rasped, her voice like gravel in a tin. Her eyes, milky blue but unnervingly sharp just then, fixed on Maya with pure vitriol. "Standing about like a spare part. Useless."

  Maya’s fingers tightened on the IV tubing. *Reactive*. A hot flush climbed her neck. She *felt* the insult land, barbed and personal. She wanted to snap back, to tell this frail, venomous woman exactly where she could shove her opinion. *She knows what she’s saying. She means it.* The objective shield buckled.

  "Just checking your fluids, Mrs. Bradshaw," Maya said, her voice carefully modulated, professional. Objective. She recited the facts internally: *Frontal lobe degradation. Loss of inhibition. Not her.*

  Eleanor’s face contorted. "Don't you 'Mrs. Bradshaw' me, you patronising little... immigrant." The word was spat, deliberate, loaded with decades of ingrained prejudice suddenly razor-clear. "Can't even get proper nurses these days. Send you lot over here, taking jobs..." Her lucidity was horrifyingly present, the malice undiluted.

  Maya froze. The reactive wave surged – hot, humiliating anger. It wasn't just the dementia talking; this felt like the core of *Eleanor*, exposed and vicious. She *was* responsible, in this moment, surely? Strawson be damned, she *chose* that word. Maya’s knuckles whitened. She took a slow, deliberate breath. *Objective. She’s exempt. Pathophysiology. Exempt.*

  "Your lunch will be along shortly," Maya stated, flatly. Objective. But her hand trembled slightly as she smoothed the sheet. Reactive.

  Then, like a switch flipping, Eleanor’s eyes clouded. The sharp malice dissolved into bewildered fear. She shrank back against the pillows, her frail body trembling. "Where...? Who are you? Is Arthur here? Have you seen my Arthur?" Her voice was thin, childlike, terrified. The cruel harridan was gone, replaced by a lost, frightened old woman. Exempt. Undeniably exempt.

  The reactive anger curdled instantly into a sickening shame, laced with profound exhaustion. Maya’s shoulders slumped. "It’s Maya, Mrs. Bradshaw. Your nurse. Arthur isn't here right now. You're safe." Her voice softened despite herself. How could she resent *this*? This was the disease, pure and simple. Objective.

  Later, the bath. Always the hardest. Supporting Eleanor’s skeletal frame, the paper-thin skin, the terrifying fragility. The water was lukewarm, the room steamy. Eleanor was passive, confused, murmuring about gardens. Objective Attitude reigned: gentle hands, clinical focus on pressure points, efficient movements. Care for the vessel.

  Then, as Maya carefully soaped Eleanor’s bony back, the lucidity flickered back on. Not fear, not confusion. Malice, crystallised.

  "Your hands are rough," Eleanor stated, coldly clear. "Like a scullery maid's. Clumsy oaf. Probably used to scrubbing floors, weren't you? Before they let you *pretend* to be a nurse."

  *Reactive*. The insult landed like a slap. Maya’s breath hitched. The sponge in her hand felt suddenly heavy, a potential weapon. A fleeting, horrifying image – grinding it into that spiteful mouth – flashed through her mind. Shame followed instantly, scorching. *She’s dying. She’s mad. Exempt. Objective!* But the words... they were chosen, aimed. They *hurt*.

  Maya forced her grip on the sponge to loosen. She didn’t look at Eleanor’s face. Focused on the knobbled spine, the roadmap of blue veins beneath translucent skin. *Dorsal root ganglia. Autonomic neuropathy. Exempt.*

  "Just getting you clean, Mrs. Bradshaw," she murmured, her voice tight. Objective words, reactive tension humming beneath them. She felt split, a live wire wrapped in cotton wool.

  Eleanor’s head lolled. "Mummy?... Is the tea ready?" The confusion flooded back, erasing the sharp edges, leaving vacant sweetness. "I like the pink cups..."

  The switch. Again. Maya closed her eyes for a second, leaning against the cool tiles. The anger drained, leaving a hollow ache, a profound weariness deeper than bone. No clean resolution. No stable ground. Just the exhausting oscillation between resentment and pity, between holding her responsible and knowing she couldn’t be, between the human need to react and the professional duty to detach.

  She rinsed the soap away, the water swirling grey. Objective hands moved. A reactive heart hammered against ribs. The flickering wouldn’t stop. She finished the bath in silence, the only sounds the slosh of water and Eleanor’s soft, nonsensical humming about pink cups. The armour was cracked, the lines hopelessly blurred. Duty remained. Care continued. But the peace of either attitude – righteous anger or clinical detachment – was lost somewhere in the cruel, confusing fog of Eleanor Bradshaw’s dying mind. Maya dried her gently, the resentment a cold stone in her gut, the pity a suffocating weight on her chest. Just another shift in Cedar Ward.
