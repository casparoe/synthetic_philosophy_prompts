     The decision procedure:

     **Bedside Likelihood Ratio Update Procedure**

     Step 1: **List hypotheses.** Ask: "What are all the conditions we are considering? List them." (Must be mutually exclusive.) If the list is incomplete, note that the update may be invalid.

     Step 2: **Assign priors.** Ask: "What are the relative chances of each condition before this test?" If numbers are hard, use a verbal scale and convert:

          - "Very likely" -> assign a high number (e.g., 0.5 if one, but adjust so they sum to 1)
          - "Likely" -> medium (e.g., 0.3)
          - "Unlikely" -> low (e.g., 0.1)

          But then normalize so the total is 1. This is a judgment step.

     Step 3: **Identify A, B, and k.** The evidence: "The result makes A k times as likely as B." Confirm: "So, the test result is k times more likely under A than under B?" (Get k.)

     Step 4: **Check for exhaustiveness.** Ask: "Do A and B together account for all possibilities?" If yes, then use the two-hypothesis update. If no, then note there are others and proceed to the next step.

     Step 5: **Update the probabilities:**

          If only A and B:
              Prior odds of A to B = P(A)/P(B)
              Posterior odds = prior odds * k
              Then P(A|E) = posterior_odds / (1 + posterior_odds)
              P(B|E) = 1 - P(A|E)

          If there are others (C1, C2, ...):
              For A: new weight = k * prior(A)
              For B: new weight = prior(B)
              For each other condition Ci: new weight = prior(Ci)

              Sum = (k * prior(A)) + prior(B) + prior(C1) + prior(C2) + ... 
              Then:
                  P(A|E) = (k * prior(A)) / Sum
                  P(B|E) = prior(B) / Sum
                  P(Ci|E) = prior(Ci) / Sum

     Step 6: **Interpret and decide.** The procedure gives updated probabilities. The clinician must then:

          - Consider if the probability of any condition is now above a threshold for action. (Thresholds are not part of the math: they depend on the harms of missing the condition vs. the harms and costs of treatment or further testing.)

          - If the updated probability of a serious condition is low, but not low enough to rule out, the clinician may need to order more tests.

          - Discuss with the patient: "Based on this test, the chance of condition A is now about X%. Given the risks of A and the side effects of treatment, we recommend ..."

          - Where the procedure stops: it only updates the probabilities. The decision to act, test further, or wait is a clinical judgment incorporating patient values and risk tolerance.

     Step 7: **Document and defend.** The clinician can explain: "We updated the probabilities by taking the prior chance of each condition and adjusting for the test result. The test result increased the chance of A relative to B by a factor of k, but because we had other possibilities, we adjusted the weights accordingly. The new probabilities are ..."

     **Caveats:**

          - The update for the other hypotheses assumes that the evidence is equally likely under them as under B. This may not be true. If the clinician has any information that the evidence is more or less likely under a particular alternative, they should adjust. For example, if they know that the evidence is very unlikely under C, then they might set the weight for C to a small number (like 0.1 times prior(C))? But that is an extra judgment. The procedure uses 1 as a default.

          - The prior assignment is critical and subjective. The clinician must use their best judgment and base it on population data and the patient's specific factors.

     **Time and testing:** The procedure should take under 10 minutes. The clinician can practice with a few cases (like the examples above) to get comfortable.

     **Final note:** This procedure is based on the principle of minimal update (preserving as much as possible of the prior distribution) and is grounded in the maximum entropy principle for the likelihood of the evidence on the other hypotheses. It is a defensible update rule when only a likelihood ratio for two hypotheses is provided.

     However, the clinician must be aware that if the evidence is actually very informative about the other hypotheses (e.g., it rules out one of them) then this update will be inadequate. Therefore, if there is any additional information about how the evidence relates to the other hypotheses, it should be incorporated.
answer: |-
  ### Decision Procedure for Updating Probabilities with Relative Likelihood Evidence

  **Philosophical Grounding:** When evidence is given as a likelihood ratio (e.g., "A is k times more likely than B"), this represents a constraint on the likelihoods, not a full conditional probability. We use **minimum cross-entropy updating** (from the Judy Benjamin tradition): adjust *only* the odds between A and B by factor k, preserve all other relative odds, then renormalize. This minimizes unnecessary changes to your beliefs while respecting the evidence. It's the only coherent update when you lack information about other hypotheses.

  ---

  #### Step-by-Step Procedure (Runnable in <10 Minutes)

  1. **List all hypotheses**  
     - Ask: *"What are all plausible conditions we're considering? List them explicitly."*  
     - **Sufficient answer:** 3-5 mutually exclusive hypotheses (e.g., Disease A, Disease B, Benign Condition C, etc.).  
     - ⚠️ **Judgment call:** If the list is incomplete, the update fails. Clinician must defend comprehensiveness.

  2. **Assign prior odds**  
     - Ask: *"Before this test, how much more likely is each condition relative to the LEAST likely one?"*  
     - **Sufficient answer:** Rank-order hypotheses (e.g., "B was most likely, then C, then A was rarest"). Convert ranks to approximate odds:  
       - Most likely: Assign weight 5  
       - Intermediate: Weight 3  
       - Least likely: Weight 1  
       (Normalize to sum=1 later)  
     - ⚠️ **Judgment call:** No numbers? Use clinical intuition. Document your weights.

  3. **Interpret the evidence**  
     - Confirm: *"The evidence makes [A] k times more likely than [B] under which hypotheses?"*  
     - **Crucial check:** Do A and B exhaust all possibilities?  
       - **If YES (only A and B):** Use standard Bayes (Step 4a).  
       - **If NO (other hypotheses exist):** Use minimum cross-entropy (Step 4b).  
     - ⚠️ **Red flag:** Never assume exhaustiveness without confirmation.

  4. **Update probabilities**  
     - **Case 4a (A and B exhaust space):**  
       - Posterior odds(A:B) = Prior odds(A:B) × k  
       - Convert to probabilities:  
         P(A|E) = [Prior odds(A:B) × k] / [1 + Prior odds(A:B) × k]  
         P(B|E) = 1 - P(A|E)  
     - **Case 4b (Other hypotheses exist):**  
       - Update weights:  
         - New weight(A) = Prior weight(A) × k  
         - New weight(B) = Prior weight(B) × 1 (no change)  
         - New weight(other) = Prior weight(other) × 1 (no change)  
       - Sum all new weights = S  
       - Posterior probabilities:  
         P(A|E) = [k × Prior weight(A)] / S  
         P(B|E) = [Prior weight(B)] / S  
         P(Other|E) = [Prior weight(Other)] / S  
     - **Math note:** This preserves odds between B and others, scales A vs. B by k.

  5. **Decide and communicate**  
     - **Stop and hand off:**  
       - Ask: *"What probability threshold justifies action (e.g., treatment, biopsy)?"*  
       - ⚠️ **Values call:** This depends on patient risk tolerance and treatment burdens. Math cannot answer this.  
     - **Explain to patient:**  
       *"This test makes [A] more likely than before, but because we're also considering [other conditions], the overall chance of [A] is now [X]%. We need to weigh this against the risks of next steps."*  
     - **Defend to attending:**  
       *"We updated priors using the likelihood ratio for A vs. B, preserved odds for other hypotheses, and renormalized. This is the most conservative update given incomplete information."*

  ---

  #### Worked Examples

  **Example 1: Positive Test (A = Disease, B = No Disease)**  
  - **Setup:** Only A and B exist. Prior P(A) = 0.01 (1%), LR(A:B) = 100.  
  - **Procedure:**  
    - Step 1: Hypotheses = [A, B]  
    - Step 2: Prior odds(A:B) = 0.01 / 0.99 ≈ 0.0101  
    - Step 3: A and B exhaust space → Case 4a  
    - Step 4: Posterior odds(A:B) = 0.0101 × 100 = 1.01  
      P(A|E) = 1.01 / (1 + 1.01) = 50.2%  
  - **Takeaway:** Classic Bayes works here. Explain: *"The test moved the chance from 1% to 50%."*

  **Example 2: Tumor Scan (A = Type I, B = Type II, C/D/E = Other)**  
  - **Setup:** Prior weights (normalized): A=0.2, B=0.4, C=0.3, D=0.05, E=0.05. LR(A:B)=2.  
  - **Procedure:**  
    - Step 1: Hypotheses = [A, B, C, D, E]  
    - Step 3: Non-exhaustive (C/D/E exist) → Case 4b  
    - Step 4:  
      - New weights: A = 0.2 × 2 = 0.4, B = 0.4 × 1 = 0.4, C/D/E unchanged (sum=0.3+0.05+0.05=0.4)  
      - S = 0.4 (A) + 0.4 (B) + 0.4 (others) = 1.2  
      - P(A|E) = 0.4 / 1.2 ≈ 33.3%  
      - P(B|E) = 0.4 / 1.2 ≈ 33.3%  
      - P(C/D/E|E) = 0.4 / 1.2 ≈ 33.3% (split as before)  
  - **Takeaway:** A doubled relative to B, but absolute increase is modest (20% → 33%) due to other hypotheses.

  **Example 3: Scary Diagnosis (Math vs. Intuition)**  
  - **Setup:**  
    - A: Rare cancer (Prior weight = 0.01)  
    - B: Common infection (Prior weight = 0.89)  
    - C: Autoimmune (Prior weight = 0.10)  
    - Evidence: LR(A:B) = 100 ("A 100× more likely than B")  
  - **Procedure:**  
    - Step 1: Hypotheses = [A, B, C]  
    - Step 3: Non-exhaustive → Case 4b  
    - Step 4:  
      - New weights: A = 0.01 × 100 = 1.0, B = 0.89 × 1 = 0.89, C = 0.10 × 1 = 0.10  
      - S = 1.0 + 0.89 + 0.10 = 1.99  
      - P(A|E) = 1.0 / 1.99 ≈ 50.3%  
      - P(B|E) = 0.89 / 1.99 ≈ 44.7%  
      - P(C|E) = 0.10 / 1.99 ≈ 5.0%  
  - **Why clinician hates it:** Prior cancer risk was 1%, now >50%. Intuition screams "test must be wrong!"  
  - **What the procedure can do:**  
    - Force explicit priors (did you *really* believe A was 1%?).  
    - Highlight that LR=100 doesn't override low prior if other hypotheses exist.  
  - **What it can't do:**  
    - Validate the LR (was the study population applicable?).  
    - Decide whether 50% warrants invasive biopsy (patient values required).  
  - **Defense:** *"The math is correct given our priors. If you doubt the result, challenge the LR quality or prior estimates, not the update."*

  ---

  ### Key Takeaways for Clinicians
  - **When to use:** Only when evidence *explicitly* compares two hypotheses.  
  - **Defend assumptions:** Justify your hypothesis list and priors. Say: *"We assumed no other conditions and preserved odds for others."*  
  - **When it fails:** If evidence affects other hypotheses (e.g., a test *also* rules out C), demand full likelihoods.  
  - **Speed tip:** Use odds weights (1/3/5) for priors; calculate with phone calculator.  
  - **Patient talk:** *"This number adjusts our suspicions but doesn't give final answers. We need to discuss what risk level you're comfortable with."*  

  This procedure makes the philosophy actionable: it respects the evidence's limited scope while guarding against false certainty from partial updates.
