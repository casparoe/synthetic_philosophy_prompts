  For alternatives to Frege, direct reference theories (Kripke) and two-dimensional semantics (Chalmers) offer solutions. Kripke would say "water is H2O" is necessary a posteriori, while Chalmers separates epistemic and metaphysical dimensions. The user might benefit from mentioning how these handle cognitive significance.

