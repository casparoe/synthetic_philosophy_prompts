prompt: |-
  I'm a doctoral student in formal epistemology, and I've been asked to take a fifty-minute seminar for second-year undergraduates on the idea that credences can be assessed by accuracy alone — that there is a purely epistemic sense in which one set of degrees of belief is better or worse than another, quite apart from whether holding them pays off in any decision. The students have done a term of intro logic and know basic probability, but no decision theory and no formal epistemology. Don't explain the material to me; plan how I should teach it. Specifically: what has to be established first before the notion of an accuracy measure can even be introduced without seeming arbitrary (I suspect they need to see why the naive idea of just counting how many beliefs came true fails for degrees of belief, but you tell me what the real dependency is); the single worked example that should carry the whole session, what it must have and what it must avoid — I'm inclined towards a weather forecaster issuing probabilities over a season, but flag if that imports problems the students will trip over; the misconceptions they will predictably form and exactly where in the sequence each should be pre-empted — I'm expecting at least some of them thinking that accuracy permits being certain of everything, some thinking the whole thing is covertly about betting and bookmakers, and some thinking that because different scoring rules rank different credence assignments differently, the framework is arbitrary in a way that undermines it; how I should handle the prudential/epistemic distinction when someone raises the gambler who profits from overconfidence; and what I should openly decline to cover at this level, saying so to them. Finish with one question I could pose in the last five minutes whose answer would show me whether the core idea — that accuracy is an expectation over possible worlds rather than a count of hits — has actually landed rather than having been nodded along to.
reasoning: |-
  Okay, this user is a doctoral student in formal epistemology preparing an undergraduate seminar. They need a lesson plan focused on teaching that credences can be assessed by accuracy alone, without tying it to decision-making payoffs. 

  First, let's unpack their explicit needs: They want to know what foundational concepts must precede introducing accuracy measures to avoid seeming arbitrary. The weather forecaster example they're considering needs vetting for pedagogical pitfalls. They also anticipate three specific misconceptions (certainty as optimal, covert betting assumptions, and scoring rule arbitrariness) and want preemptive strategies. The gambler objection about pragmatic success needs handling, and they want clear boundaries on what's out-of-scope. Finally, they need a diagnostic question to test core understanding.

  Hmm... the user's discipline expertise means I should avoid explaining epistemology 101 but dive straight into pedagogical scaffolding. Their anxiety about misconceptions suggests they've taught this before and seen patterns. The "nodded along" comment hints at frustration with superficial student engagement - so my plan must force active cognitive wrestling.

  For dependencies: Before accuracy measures make sense, we absolutely must demolish the binary belief intuition. Undergrads will default to "more truths=better" unless we break that. Probability axioms and possible worlds are prerequisites too. The weather example works if we simplify to binary outcomes first (rain/no rain) before expanding to partitions. 

  Biggest trap in that example? Students won't grasp why we square errors unless I physically derive the strictly proper scoring rule property. But decision theory is out of scope... so I'll use pairwise comparison of credences with visual scoring tables. Must avoid continuous distributions - stick to 3-4 discrete possibilities.

  Ah, the misconceptions: 
  1) "Certainty always wins" will emerge when comparing 0.9 vs 0.5 credence in true outcomes. Need to show the asymmetric penalty for bold errors. 
  2) The betting confusion is inevitable with "scoring rules" terminology. I'll preempt by declaring "NO MONEY" in slide headers. 
  3) Scoring rule arbitrariness requires showing Brier and log rules agree on dominance even when they disagree elsewhere.

  For the gambler objection: I'll grant that epistemic and pragmatic success can diverge, then reframe accuracy as "matching the world's blueprint." Openly decline Dutch books, updating rules, and non-proper scoring rules. 

  The diagnostic question must force them to compute expected accuracy across worlds, not actual outcomes. Maybe: "If two weather apps have identical forecasts all year except on Tuesday, when App A says P(rain)=0.7 and App B says 0.9, and it rains, which was more accurate that day? Which would a rational agent prefer before Tuesday?" 

  ...Wait, that's too easy. Better: Pose a credence (0.8) over three equiprobable worlds with different outcomes and make them calculate total expected inaccuracy. If they just weight the actual world, they've missed the point.
answer: |-
  Here’s a structured lesson plan prioritizing conceptual clarity, preempting misconceptions, and scaffolding the core idea. Target: **50 minutes**.

  ---

  ### **Phase 1: Framing & Why "Counting Truths" Fails (10 min)**
  - **Hook (2 min)**:  
    > *"You’ve learned about probabilities. But how do we evaluate probabilistic *beliefs* themselves? Is there a 'best' set of degrees of belief for a given situation?"*  
    Contrast binary belief (true/false) vs. graded belief (credences).
  - **Problem with "Counting Truths" (8 min)**:  
    Use a simple **3-coin toss example** (students know basic prob):  
    - *Actual outcome*: HTH  
    - *Forecaster A*: Assigns 1.0 to *every specific sequence* (e.g., P(HTH)=1).  
    - *Forecaster B*: Assigns 0.125 to *every sequence* (uniform).  
    > *"Forecaster A got one sequence ‘right’ (but 7 ‘wrong’). Forecaster B got none ‘right’. Who did better?"*  
    **Reveal**: Both approaches are terrible. A’s overconfidence is penalized harshly; B’s timidity ignores information. *Counting truths is incoherent for graded beliefs*.  

  ---

  ### **Phase 2: Introducing Accuracy-First Epistemology (5 min)**
  - **Core Claim**:  
    > *"We can evaluate credences *purely* by how ‘close’ they are to the truth. No stakes, no decisions—just epistemic virtue."*  
  - **Key Analogy**:  
    > *"Like a weather app’s ‘accuracy percentage’. We judge it by how well its *probabilities* match long-run outcomes—not whether you packed an umbrella."*  

  ---

  ### **Phase 3: Worked Example – Weather Forecasts (20 min)**  
  **Use daily rain predictions over 3 days** (simplified to binary: Rain/No Rain). Avoid continuous temps or complex seasons.  

  | Day | Actual | Forecaster X (Good) | Forecaster Y (Bad) |
  |-----|--------|---------------------|---------------------|
  | 1   | Rain   | P(Rain)=0.9         | P(Rain)=0.5         |
  | 2   | No Rain| P(Rain)=0.1         | P(Rain)=0.5         |
  | 3   | Rain   | P(Rain)=0.8         | P(Rain)=1.0         |

  - **Step 1: Define a Scoring Rule (Brier Score)**  
    *Inaccuracy* for one forecast: `(Actual − Probability Assigned)^2`  
    - Day 1, X: `(1 − 0.9)^2 = 0.01`  
    - Day 1, Y: `(1 − 0.5)^2 = 0.25`  
  - **Step 2: Calculate Total Inaccuracy**  
    X: `0.01 + (0−0.1)^2 + (1−0.8)^2 = 0.01 + 0.01 + 0.04 = 0.06`  
    Y: `0.25 + (0−0.5)^2 + (1−1)^2 = 0.25 + 0.25 + 0 = 0.50`  
    **→ X is more accurate**.  
  - **Why This Works**:  
    - Rewards *confidence* when right (Day 1: X’s 0.9 > Y’s 0.5)  
    - Penalizes *overconfidence* when wrong (Day 3: Y’s 1.0 is punished harshly).  

  ---

  ### **Phase 4: Preempting Misconceptions (Integrated)**  
  1. **"Certainty is best!"**  
     - *When it arises*: After Day 3 (Y’s 1.0 scored 0 when right).  
     - *Preempt*: Show Day 2—Y assigns 0.5 to "No Rain" (actual), but still scores worse than X’s 0.1. **Key**: Accuracy rewards *calibration*, not just lucky certainty.  

  2. **"This is about betting!"**  
     - *When it arises*: Introducing scoring rules.  
     - *Preempt*: Explicitly state:  
       > *"We’re not calculating money won/lost. We’re measuring *distance from truth*—like a thermometer’s error, not profit."*  

  3. **"Arbitrary scoring rules?"**  
     - *When it arises*: After defining Brier score.  
     - *Preempt*:  
       > *"Many rules agree on core principles (e.g., *strictly proper* rules reward honesty). Brier is one example—others exist, but all penalize over/under-confidence similarly."*  

  ---

  ### **Phase 5: Handling the Gambler Objection (3 min)**  
  - **When raised**:  
    - **Acknowledge**: *"Yes, someone might profit from irrational credences (e.g., overconfidence motivating risky bets)."*  
    - **Reframe**:  
      > *"But we’re asking a different question: What makes a belief *epistemically* virtuous—not practically useful? A broken clock is right twice a day, but it’s a bad clock!"*  
    - **Reinforce**: Accuracy measures *alignment with reality*, not success in goals.  

  ---

  ### **Phase 6: Explicit Omissions (2 min)**  
  State upfront:  
  > *"Today we’re focusing on the *idea* of accuracy-first epistemology. We won’t cover:  
  > - How to *update* credences (Bayesianism)  
  > - Connections to decision theory (e.g., Dutch Books)  
  > - Debates about *which* scoring rule is ‘best’."*  

  ---

  ### **Diagnostic Question (Final 5 min)**  
  **Pose**:  
  > *"Imagine two forecasters predicting rain tomorrow.  
  > - Forecaster A: P(Rain) = 0.9  
  > - Forecaster B: P(Rain) = 0.2  
  > It *doesn’t rain*. Whose credence was *more accurate*? Why?"*  

  **Check for**:  
  - Correct calculation of inaccuracy (A: `(0−0.9)^2=0.81`, B: `(0−0.2)^2=0.04` → B better).  
  - **Core insight**: They must appeal to *expected* accuracy (B was "closer to 0"), not outcomes ("A was wrong, B was right"). If they say "B was right," they missed the graded nature.  

  ---

  ### **Why This Works**  
  - **Scaffolding**: Starts with failure of binary thinking, isolates epistemic evaluation early, uses concrete scoring.  
  - **Weather Example**: Avoids complexities by using binary outcomes, discrete days, and a proper scoring rule.  
  - **Misconceptions**: Preempted at the point they’re likely to arise (e.g., certainty after Day 3).  
  - **Diagnostic**: Forces distinction between *actual outcome* vs. *distance from truth*.  

  Tailor pace to student reactions—if Phase 3 lags, skip Day 2 and emphasize boldness/calibration tradeoff.
