  The user’s deeper need might be moral clarity: does current policy imply future lives matter less? They might seek validation that their discomfort is justified and want to understand if alternatives exist. Highlighting the ethical tension between impartiality and practicality is key. If we switch to zero discounting, costs shift to present generations, which is politically tough. But for extinction, the carve-out might be a nod to moral responsibility beyond utility.

