  hey so I wiped out on my bike like three weeks ago and got a mild concusion and my short term memory is honestly garbage right now. my doctor told me to externalize everything while I recieve treatment or whatever, so I basically live off this weird system and now I am spiraling about it a little. I carry this beat up paper notebook everywhere and write med times and appointments in my own shorthand that only I can read, plus I set phone alarms where I leave short voice memos to future me, plus me and my roommate keep a kitchen whiteboard for groceries and chores and he will text me if I am blanking.

  my brother says that stuff is literally part of my mind right now, and my friend who is in grad school for neuroscience says no way, those are just really useful tools and the actual thinking is still all in my head. can you write me a dialogue between those two kinds of people, like one person who is pro extended mind and thinks notebooks and phones can count as mental, and one person who is against it and thinks it is just embedded help, arguing about my exact setup.

  I want them both to be equally smart and not strawmen, and I want real back and forth where they actually answer each others points instead of just talking past each other. have them work through whether my notebook versus my phone alarms versus the whiteboard my roommate updates should count differently, what to do with the worry that if my notebook counts then way too much stuff counts like the whole internet, and whether it matters that I automatically trust what I wrote versus having to double check my roommate, and what it means that last week my phone died and I totally missed a dose and my roommate erased something on the board as a joke and I got confused.

  please write it all as continuous prose the way you would write an email or a letter, so no headings, bullet points, bold text, or tables at all, and please use American English because the switching spellings throws me off when I am already foggy.
