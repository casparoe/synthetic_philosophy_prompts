prompt: |-
  I'm a fourth-year PhD student working on reference and predication, and in three weeks I'm giving a paper at a small workshop on classical Chinese thought — the kind of workshop where half the room are analytic philosophers of language and the other half are people who read classical Chinese for a living, which is exactly my problem. The paper is on the White Horse Dialogue in the Gongsun Longzi, the text where Gongsun Long argues that a white horse is not a horse. His first move is that horse is what designates shape and white is what designates colour, and that what designates colour is not what designates shape, so white horse is not horse. His second move is about seeking: if you go looking for a horse, yellow and black ones will do, but if you go looking for a white horse they won't, and if the white horse just were the horse then what you're after in the two cases would be the same thing, which it plainly isn't. The standard line treats the whole thing as either an elementary scope fallacy or an equivocation on the word for is, and my paper argues that this is a bit lazy. My own line is that he isn't making a claim about the English word is and he isn't confused about subsets; he's making a point about names and what they fix — that a compound name fixing two features at once can't be substituted for a simple name fixing one, in any context where what matters is which features get fixed. So on my reading his not is doing the work of is-not-substitutable-for rather than is-not-a-member-of, and the standard objection only gets off the ground if you already assume that the sole job of a name is to pick out an extension, which is the very thing he's denying. Fair warning: I'm not a sinologist, I work from translations and crib the Chinese from the commentaries, and I've been told this shows. I've also read alot of the secondary stuff and I'm definately aware that I'm sticking my neck out.

  So what I need from you is a Q&A prep sheet. Please take on the role of someone who works on reference and predication but has also spent real time in the commentarial tradition on this text — I want the objections I'll actually get from this room, not the ones I'd get at a generic metaphysics seminar. Concretely, the room is: two philosophers of language, one of them Fregean about sense and reference and liable to think I've reinvented that distinction badly, the other a Kripkean who thinks the dialogue is just a bad argument and will say so in the first five minutes; a textual scholar who thinks the received text is a patchwork with bits dislocated and words lost, and that you can't extract a considered semantics from it at all; a historian of Chinese philosophy who'll insist the School of Names was about the correspondence between names and actualities and the rectification of names, and that I've turned Gongsun Long into a proto-analytic philosopher of language, which is anachronism in the other direction; a logician who will want a formal model before the question period is over; and the usual grad students who'll ask what the payoff is and whether this is philosophy or history. A few of these people will be sceptical of my reading and a couple will be sceptical of the whole enterprise, so please don't smooth that over.

  Before you write anything, think it through properly — maybe start by brainstorming what each of those people already believes going in and what they'd find threatening about my thesis, and only then write the sheet. Give me roughly eight objections, ordered by how much damage they'd do, each phrased the way that particular person would phrase it rather than in neutral seminar-speak, each with a reply I could actually deliver in two minutes, and a blunt note on where the reply is soft or where I'm bluffing. Tell me which objections I should concede up front to buy credibility, which ones have real force and which are just turf, and what the single reply is that has to land for the paper to survive the session. Finish with the question I'm hoping nobody asks. Please don't give me a reading list, a bibliography, or any see-so-and-so — I can't look anything up while I'm prepping and I don't need attributions, I need the arguments themselves spelled out and the replies made. Write it in American English.
