prompt: |-
  I audit a reading group on risk regulation that spends most of its time on the precautionary principle, and last week one of the members — a policy analyst considerably sharper than I am — presented what he takes to be a proof that the principle is not merely misguided but empty, and that it drags the doing/allowing distinction down with it. I could not find the exit during the session and I have not found it since. He states the principle himself, in his own formulation:

  (P) For any proposed course of action A that carries a credible risk of serious and irreversible harm, and where the causal evidence bearing on that risk is unsettled, the burden falls on the proponents of A to establish that A is safe; unless that burden is discharged, A is not to be undertaken.

  Then the argument. (1) Declining to undertake A is itself a course of action — call it not-A: a decision, made by identifiable people, with foreseeable consequences for identifiable others. (2) By (1), not-A carries its own credible risks of serious and irreversible harm, what people in this field call foregone risk. (3) So (P) applies to not-A exactly as it applies to A: the burden falls on the proponents of not-A to establish that not-A is safe, and unless they discharge it, not-A is not to be undertaken. (4) Therefore (P) requires both that A not be undertaken and that not-A not be undertaken. (5) A principle that, in every case to which it applies, forbids each of the available options is not a decision procedure; it is either a contradiction or an instruction to do nothing while insisting that nothing is forbidden. (6) And this is no quirk of pathological cases: there is no risk-free baseline, since a status quo is itself an allocation, and every real regulatory decision has victims on both sides of it. (7) So (P) is unusable in every real case — PP is not a false principle but an empty one. (8) Note, though, what did the work: (1) and (6). Those premises say that an asymmetry between acting and not acting is an artifact of where the baseline happens to be drawn. (9) The asymmetry between doing harm and allowing harm is an asymmetry of exactly that kind. (10) So if the argument against (P) succeeds, the doing/allowing distinction is an artifact too.

  His running example is the 1976 swine flu decision, and the facts he gave look right to me: a novel H1N1 strain turned up at Fort Dix that winter, one young recruit collapsed and died after a forced march, the CDC read the strain as a relative of the 1918 virus, and Ford announced a program to vaccinate the entire country. Roughly 43 million people received the shot before the program was suspended that December amid reports of Guillain-Barré syndrome, at an excess of about one case per hundred thousand vaccinated and something on the order of two dozen deaths attributed to it. The pandemic never arrived. He says the case is a textbook instance of (2): the precautionary measure produced harm of the kind it was meant to forestall, and the option of waiting had a catastrophic tail of its own.

  I can recite the standard complaint — that PP is paralyzing, or self-defeating — in general form, but I cannot locate the step in his version, and I suspect the standard complaint is too blunt to reach it. Two constraints of my own, which you may treat as fixed: I am confident (6) is true, because I do not believe there is any such thing as a risk-free status quo, and I want to keep the doing/allowing distinction. So whatever is wrong lies either earlier than (6) or in the passage from (4) to (5) — unless you think one of those two commitments has to go, in which case tell me which and why.

  What I want is this. Name the step you would reject and say precisely why it looked acceptable where it stands, since I want the diagnosis of the temptation and not just the verdict. Then price the alternatives: what the argument costs if I reject (2), or (3), or (9) instead, and whether any of those rejections leaves a version of PP worth keeping — or whether the surviving version has quietly become a comparative risk-assessment rule that no longer deserves the name. Finally, give me your verdict on the spillover: does (10) really follow from the premises that drive the refutation, or does it borrow from them something the doing/allowing distinction never needed? Please open with one sentence naming the step you reject, keep the entire response under 600 words, and organize it in at most three numbered blocks — the rejection, the pricing, the spillover.
reasoning: |-
  Hmm, the user presents a complex philosophical argument against the precautionary principle (PP) and its implications for the doing/allowing distinction. They need help identifying flaws in this argument while preserving their commitment to both the non-risk-free status quo and the doing/allowing distinction.

  The core argument proceeds logically: (1) Declining action (not-A) is itself an action, (2) not-A carries risks too, (3) therefore PP applies symmetrically to A and not-A, (4) leading to a contradiction where both action and inaction are forbidden, (5) rendering PP empty.

  I need to reject step (3) because it misapplies PP's burden structure. PP specifically targets novel interventions, not status quo maintenance. The burden isn't equally distributed - proponents of change must justify departure from existing baselines. This resolves the paralysis while preserving PP's core function.

  For pricing alternatives: rejecting (2) would require denying that inaction has risks, which contradicts the user's fixed belief about risk-free status quos. Rejecting (9) would mean divorcing PP from doing/allowing, but this distinction actually survives because PP relies on it implicitly through baseline dependence. The "surviving" PP remains precautionary by requiring justification for interventions.

  Regarding spillover to doing/allowing: step (10) doesn't follow. The refutation of PP doesn't undermine moral asymmetries - doing harm typically involves greater agency and responsibility than allowing harm. The argument conflates regulatory baselines with moral foundations.

  The user's swine flu example actually demonstrates why PP shouldn't apply symmetrically - the vaccination program was a massive intervention that required justification beyond maintaining surveillance (the not-A option). The case shows why we need differential burden assignment, not why PP is empty.

  I'll organize this as requested: first rejecting step (3) with explanation, then pricing the alternatives, and finally addressing the spillover claim. The response will stay under 600 words while covering all critical points.
answer: |-
  Here is my diagnosis, constrained as requested:

  **1. Rejection:** I reject step (3): "(P) applies to not-A exactly as it applies to A". This step looks acceptable because (P)'s language ("*any* proposed course of action") seems perfectly symmetrical. The temptation arises from taking (P) as a purely syntactic rule applied to labels ("A" vs "not-A") without recognizing the structural asymmetry inherent in regulatory contexts and embedded within (P) itself – namely, that "undertaking A" represents a *departure* from the status quo, while "undertaking not-A" typically *maintains* it, and (P) implicitly assigns the burden of proof specifically to those proposing a *change*.

  **2. Pricing Alternatives:**
      *   **Reject (2):** Denying that inaction (not-A) carries serious risks contradicts your fixed commitment to (6) – no risk-free baseline. This makes PP vacuously applicable only to novel actions in a hypothetical risk-free world, rendering it useless for real regulation.
      *   **Reject (3):** As above, preserves PP's core function: imposing a burden on proponents of *intervention* (A) to justify departing from the status quo due to unsettled evidence of serious risk. It accepts (2) and (6) – not-A *has* risks – but denies the burden structure is symmetrical. The "foregone risks" of not-A are acknowledged but do not trigger the *same* specific justificatory burden under PP; they are part of the broader risk landscape assessed elsewhere. The surviving PP remains genuinely precautionary (demanding proof of safety for risky interventions facing uncertainty), distinct from pure comparative risk assessment which weighs A vs not-A risks directly without this specific burden assignment.
      *   **Reject (9):** Denying that the doing/allowing asymmetry is an artifact severs the link to PP's refutation but leaves PP vulnerable to paralysis unless *another* asymmetry (like the status quo intervention/non-intervention distinction) is introduced to break the symmetry. It doesn't resolve PP's internal problem identified in steps (1)-(5).

  **3. Spillover Verdict:** Step (10) does **not** follow from the premises driving the refutation of PP. The argument against PP relies *specifically* on the claim that regulatory baselines (status quo vs. intervention) are arbitrary conventions for assigning the burden of proof under uncertainty. The moral doing/allowing distinction, however, concerns *fundamental differences in agency, responsibility, and causation* (e.g., actively causing harm vs. failing to prevent an independently arising harm). While baseline framing can *influence* the *application* of the doing/allowing distinction in complex policy cases, the distinction itself doesn't *derive* its moral force solely from the choice of baseline in the way PP's burden assignment might. Rejecting PP's symmetry by invoking a status quo/intervention asymmetry doesn't entail that the deeper moral asymmetry is merely an artifact.
