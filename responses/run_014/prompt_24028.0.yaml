prompt: |-
  I'm a graduate student in philosophy and I'm also, unfortunately, sitting on the elections subcommittee of our university's governance board, which has to decide by March how the student senate president will be elected — the candidates are plurality, instant-runoff, and approval voting. At last week's meeting, a political theorist who sits on the board ex officio kept repeating a line I'm fairly sure is doing more work than it can bear: "Arrow's theorem shows there's no fair voting system — every method is rigged in some way — so honestly it doesn't matter what we pick." As far as I can reconstruct it from my social-choice reading, the theorem says that any social welfare function defined over a fixed electorate and a fixed set of alternatives, which maps every profile of individual orderings to a complete and transitive social ordering while satisfying unrestricted domain, Pareto efficiency, independence of irrelevant alternatives, and non-dictatorship, must be dictatorial. I don't see how that implies anything about whether we should pick instant-runoff over approval, but I couldn't say why in the meeting without sounding like I was attacking the professor.

  Could you take the slogan "Arrow shows there's no fair voting system" apart and lay out the different precise claims it could be making, from the weakest to the most radical? I'd like you to cover at least the following: the theorem as actually stated; the claim that "fairness" is just shorthand for the four axioms; the claim that the theorem applies directly to concrete rules like instant-runoff or approval; the claim that all reasonable methods are therefore equally bad; and any other readings you think are live in a committee like ours. For each reading, say whether it is true, false, or genuinely contested, and — crucially — whether it actually supports the professor's conclusion that the choice of method doesn't matter.

  Please give me the readings as a table with exactly these columns: `reading` (a short label), `claim` (one to three sentences, stated in terms of the axioms and the scope of the theorem where applicable), `status` (exactly one of TRUE, FALSE, or CONTESTED, followed by a one-sentence justification), `supports_giveup` (YES, NO, or PARTIAL — does this reading support the conclusion that the choice of method doesn't matter), and `hidden_assumption` (what the person repeating the slogan would have to assume for this reading to do that work). After the table, add a short prose section that identifies which reading the professor most likely means, which reading is actually true and does the most legitimate work in the debate, and the single sentence I should say in the next meeting that most directly defuses the slogan.
reasoning: |-
  We are going to break down the professor's statement "Arrow's theorem shows there's no fair voting system — every method is rigged in some way — so honestly it doesn't matter what we pick." into several readings.

  The table will have the following columns:
  1. reading: a short label for the reading.
  2. claim: one to three sentences stating the claim in terms of the axioms and the scope of the theorem.
  3. status: exactly one of TRUE, FALSE, or CONTESTED, with a one-sentence justification.
  4. supports_giveup: YES, NO, or PARTIAL (does this reading support the conclusion that the choice of method doesn't matter?).
  5. hidden_assumption: what the person would have to assume for this reading to support the give-up conclusion.

  After the table, we will have a short prose section.

  Let's create the table:

  reading | claim | status | supports_giveup | hidden_assumption
  --------|-------|--------|-----------------|-------------------
  Arrow's Theorem as Stated | Arrow's theorem shows that for any social welfare function that maps individual preference orderings to a complete and transitive social ordering, if it satisfies unrestricted domain, Pareto efficiency, and independence of irrelevant alternatives, then it must be dictatorial. | TRUE (This is the standard statement of Arrow's theorem for social welfare functions.) | NO | That the theorem applies to the specific context of electing a single winner (which it does not, because it is about ranking all alternatives) and that the axioms define the only possible fairness criteria.
  "Fairness" as the Four Axioms | The only reasonable definition of fairness for a voting system is that it satisfies unrestricted domain, Pareto efficiency, independence of irrelevant alternatives, and non-dictatorship. | CONTESTED (While these are important, fairness may include other criteria such as monotonicity, participation, resistance to strategic voting, etc., and it is debated whether the IIA is too strong for single-winner elections.) | PARTIAL (If true, then no fair system exists, but it does not follow that all systems are equally bad.) | That the four axioms are the only relevant fairness criteria and that any violation makes a system unacceptable, regardless of other properties.
  Applicability to Concrete Rules | Arrow's theorem applies to single-winner voting methods (like plurality, IRV, approval) because they can be seen as social welfare functions (by producing a social ordering) and they all fail one or more of the axioms. | FALSE (Arrow's theorem is about producing a full social ordering (ranking of all candidates) from individual orderings. Single-winner methods typically output only a winner, not a full ranking. For methods that do produce a ranking (like IRV in a step-by-step manner), Arrow's theorem might not directly apply because the output is not necessarily a complete and transitive ordering in the way Arrow requires. Moreover, the theorem does not directly address methods that use non-ordinal information, such as approval.) | NO (Even if it were true, it wouldn't imply that all methods are equally bad; they violate different axioms and to varying extents.) | That the failure of one axiom makes a system "rigged" and that all failures are equally bad, and that the theorem's conclusion of dictatorship is the only kind of unfairness that matters.
  All Methods Equally Bad | Because every voting system violates at least one of Arrow's axioms (or other reasonable fairness criteria), they are all equally flawed and hence the choice doesn't matter. | FALSE (Voting systems violate different axioms and have different degrees of satisfaction of other desirable properties. Some systems may be better than others in practice, even if none is perfect.) | YES | That the only criterion for choosing a system is whether it satisfies all of Arrow's conditions (or a set of fairness criteria) and since none do, they are all equally unacceptable.
  The Theorem Implies No Fair System Exists | Arrow's theorem proves that there is no voting system that satisfies all four fairness conditions simultaneously. | TRUE (But note: the theorem is for social welfare functions, not necessarily for single-winner methods. Also, the conditions are specific.) | PARTIAL (It shows that no system is perfect by these criteria, but it doesn't show that all systems are equally bad.) | That satisfying all four conditions is necessary for fairness and that any violation makes the system unfair to the same degree.

  Now, let me elaborate on each row:

  1. **Arrow's Theorem as Stated**: This is the theorem itself. It is true. However, it does not support giving up because the theorem is about ranking all alternatives (social welfare functions) and not about choosing a single winner. Also, the axioms might be too strong for single-winner elections.

  2. **"Fairness" as the Four Axioms**: This claim is contested because while Arrow's axioms are important, they are not the only criteria for fairness. For single-winner elections, other criteria like Condorcet consistency, later-no-harm, etc., are also considered. Moreover, IIA is often considered too strong for single-winner methods because it requires that the relative ranking of two candidates should not change if a third candidate is removed or added, which is a condition that many practical methods fail.

  3. **Applicability to Concrete Rules**: This claim is false because Arrow's theorem applies to functions that output a complete and transitive ranking. Single-winner methods do not necessarily produce such a ranking. For example, approval voting does not even use rankings as input (it uses approvals). Also, methods like IRV produce a ranking by eliminating candidates, but that ranking is not necessarily transitive in the way Arrow requires? Actually, IRV produces a ranking of the candidates (first, second, etc.) but it is a total order. However, Arrow's theorem might not be directly applicable because the process of elimination is not a function of the entire preference profile in the way Arrow's social welfare function is (but note: any voting method that produces a ranking can be seen as a social welfare function). But the key point is that Arrow's theorem is about the impossibility of satisfying all the conditions for any such function. However, it is true that no single-winner method that produces a ranking satisfies all of Arrow's conditions. But note: approval voting does not produce a ranking from rankings, so it is outside the scope of Arrow's theorem. Therefore, the claim that Arrow's theorem applies to all concrete rules is false.

  4. **All Methods Equally Bad**: This is false because different methods have different properties. For example, plurality can lead to the spoiler effect, while IRV mitigates that. Approval voting might elect a compromise candidate. Some methods are more resistant to strategic voting than others. The degree of violation of fairness principles varies.

  5. **The Theorem Implies No Fair System Exists**: This is true in the context of Arrow's framework (if we accept the axioms as necessary for fairness). However, it does not imply that we should give up. We can still choose a method that best meets other criteria or minimizes the impact of the violations.

  Now, in the prose section:

  **Which reading the professor most likely means?**
  The professor is likely combining the first reading (Arrow's theorem as stated) with the fourth reading (all methods are equally bad). He is asserting that because no system satisfies all the axioms (which he equates with fairness), then all systems are equally flawed and hence the choice doesn't matter.

  **Which reading is actually true and does the most legitimate work?**
  The first reading (the theorem as stated) is true. The fifth reading (the theorem implies no fair system exists by Arrow's criteria) is also true. However, the legitimate work it does is to highlight that there is no perfect system by the standards of Arrow's axioms. But it does not imply that we cannot choose a better system by other criteria.

  **The single sentence to say in the next meeting:**
  "Arrow’s theorem does show that no ranking-based voting system can satisfy all four fairness axioms simultaneously, but it does not apply to non-ranking methods like approval, and more importantly, it doesn’t imply that all methods are equally flawed; we should choose the method that best meets our other democratic values, such as minimizing strategic voting and ensuring broad representation."

