prompt: |-
  I am working on a problem in the epistemology of anomalous evidence, using Henry Sidgwick's psychical research as my starting point — specifically his role as a founder and first president of the Society for Psychical Research, the large survey of some seventeen thousand people whose results the Society published in the 1890s (roughly one in ten respondents reported at least one vivid apparitional experience, and the number of those experiences coinciding with the death of the person seen came out far in excess of what the background mortality rate would predict), and his repeated insistence that establishing that some living persons possess an information channel they ought not to have is a quite different achievement from establishing that anyone survives death. Rather than argue about Sidgwick's conclusions, I want to know what principle, if any, governs my own verdicts on the cases below. I have collected them over some time; they are not fully consistent, and I suspect at least one of them has to go.

  1. A woman wakes at three in the morning with a vivid impression of her brother standing at the foot of the bed, wet through. She has not heard from him in months. He drowned that night a thousand miles away, and the timing is independently fixed by a ship's log. Verdict: this is evidence in favor of the phenomenon, but weak — a single case, and I cannot exclude the possibility that the timing was reconstructed in her memory afterward.

  2. Exactly the same experience and the same verified coincidence, except that she wrote the impression down, dated and timed it, and handed it to a third party before any news arrived. Verdict: substantially stronger. Note that nothing about the experience has changed; only the paperwork has.

  3. A medium gives a sitter a name, a place, and a detail (an object sewn into a lining) that nobody present could have known, and investigators can find no channel of information. Verdict: this does not move me much. Not because I believe fraud has been demonstrated, but because leakage, cold reading, and selective reporting remain possible, and the mere possibility seems to me sufficient to withhold assent.

  4. Two card-guessing series with the same hit rate over the same number of trials. In the first, scoring and transcription were done by the investigator who had staked his reputation on the effect, and the records contain gaps. In the second, scoring was done by a professional conjurer who had publicly wagered against the effect and who kept a sealed duplicate record. Verdict: the first counts for nothing; the second counts for a great deal. The numbers are identical.

  5. The aggregate survey result described above — a rate of death-coincidences well above what chance predicts — I take to be strong evidence. But any single respondent's report of exactly that kind of coincidence, considered on its own, I take to be worth nothing; and the respondent herself has no way of knowing which of the two descriptions her own case falls under. So I hold two verdicts about the same datum, distinguished only by whether I describe it individually or collectively. This is the pair I most want examined.

  6. A phenomenon attested by dozens of independent witnesses who wanted it to be true and had publicly committed to it: does not count. The same phenomenon attested by a smaller number of witnesses who were actively trying to expose it: counts.

  7. Two debunking hypotheses. The first is offered after the fact, fits the case perfectly, and implies nothing further; I find it leaves my confidence in the anomaly largely intact. The second predicts that the effect should disappear under a specified change of protocol; the protocol is changed and the effect disappears; I regard the matter as settled. Note the tension with case 3, where a merely possible normal explanation — never demonstrated, never made predictive — was enough to defeat an otherwise striking case.

  8. An effect that is robust in early runs and decays as controls tighten and as hostile investigators take over. Verdict: not established. But if a wholly mundane phenomenon showed the same decay curve as instrumentation improved, I would call that a small real effect emerging from noise, not a vanished one.

  9. An anomaly discovered by accident in records collected for an unrelated purpose by people with no interest in it whatsoever. Verdict: I find this strangely persuasive — more so than a carefully designed prospective study of comparable size.

  My tentative principle is this: a purported anomaly counts as evidence in proportion to the pressure the recording process was under to yield a null result — that is, in proportion to how much opportunity, incentive, and capacity for self-deception it would have taken to make the record come out as it did, and to how well the integrity of the record is secured independently of the good faith of those who wanted the effect.

  What I am asking for is the following. First, tell me whether a single principle of this kind can deliver my verdicts, or whether I need an ordered set of clauses, each keyed to the case that motivates it; state each clause precisely enough that it could be applied by someone who did not share my intuitions. Second, apply the result to three cases I have not listed: (a) a phenomenon detectable only by an operator who is herself the claimed sensitive, where the protocol against fraud is airtight but no one else can check her readings; (b) a single sealed envelope opened once before a hostile committee — airtight procedure, sample size of one; (c) a vast, messy, retrospective correlation in administrative data found by people with no stake in it, where a mundane explanation is known but the coincidence rate is enormous. Third, tell me honestly which of my nine verdicts the principle cannot accommodate, and of those, which is cheapest to abandon. I especially want to know whether case 5 can be saved at all, or whether I must either stop treating the aggregate survey as evidence or start treating individual coincidences as evidence. Fourth, explain how cases 3 and 7 are to be reconciled, or which of the two standards I should drop. Finally, say whether the principle you end up with licenses any inference from the first of Sidgwick's two achievements to the second — from a demonstrated information channel among the living to survival of death — and if it does not, what further evidential condition would have to be met. I am not looking for references or a reading list; I want the reasoning.
reasoning: |-
  Hmm, this is a fascinating epistemological puzzle about evaluating anomalous evidence. The user presents nine carefully constructed cases with their intuitive verdicts, seeking a unifying principle that explains their judgments while resolving inconsistencies. 

  Key tensions I notice: Case 5's aggregate/individual duality contradicts basic probability theory, cases 3 and 7 show contradictory standards for normal explanations, and case 8 applies asymmetric standards to anomalous vs mundane phenomena. The user's proposed "pressure for null result" principle has promise but needs refinement.

  For the unlisted cases: (a) fails due to irreplicability despite procedure; (b) fails as statistically meaningless; (c) succeeds due to absence of motivated cognition. The medium case (3) must yield to the predictive debunking standard from case 7. 

  Regarding Sidgwick's gap between anomalous cognition and survival: the proposed principle actually widens it. To bridge it would require evidence where postmortem agency is the only explanation - perhaps intentional communication patterns that couldn't originate from living minds. 

  Most expensive verdict to abandon is case 5's aggregate endorsement, but it's necessary. The survey's value lies in triggering investigation, not proving anomaly. Cheapest to drop is case 9's preference for accidental findings over prospective studies - that's mere romanticism about "untainted" data.

  What emerges is that evidence strength isn't about the phenomenon itself, but about how well the method constrains narrative flexibility. The conjurer's ledger (case 4) wins because it leaves no room for reinterpretation; the death-coincidence survey (case 5) loses because each story remains malleable until independently verified.
answer: |-
  Your proposed principle—**evidence strength scales with the "pressure for null results" (PNR)**, defined as the combination of (i) opportunity/incentive/capacity for self-deception required to produce the record, and (ii) independent safeguards for record integrity—can unify most of your verdicts. Below, I formalize it, apply it to your cases, resolve tensions, and address Sidgwick's gap.

  ### Refined Principle with Clauses
  **Core Principle**: Anomalous evidence *E* supports hypothesis *H* proportionally to:  
  > **PNR(*E*)** = [Σ (Incentive + Opportunity + Capacity for null results)] × [Integrity Safeguards]  
  > Where:  
  > - **Incentive**: Motivation (reputation, ideology, financial) to find *non*-anomaly  
  > - **Opportunity**: Structural openings for error/fraud (e.g., lax protocols)  
  > - **Capacity**: Means to exploit opportunity (e.g., skill in deception)  
  > - **Integrity Safeguards**: Objective, adversarial, or immutable verification (e.g., timestamps, hostile witnesses, sealed records)  

  **Clauses for Application**:  
  1. **Adversarial Weighting**: PNR increases with involvement of skeptics with incentives to debunk.  
  2. **Predictive Leverage**: Explanations gain weight if they *predict* new constraints/outcomes.  
  3. **Immutable Records**: Contemporaneous, third-party-secured records maximize PNR.  
  4. **Aggregate Paradox**: Individual reports have near-zero PNR; aggregates gain PNR only if collection *methods* have high PNR (e.g., blind auditing).  

  ---

  ### Application to Your Cases
  | Case | Verdict | PNR Justification |
  |------|---------|-------------------|
  | 1    | Weak    | Low PNR: No safeguards against memory distortion (low integrity). Self-deception plausible. |
  | 2    | Strong  | High PNR: Written record + third-party custody (high integrity). Self-deception requires implausible premeditation. |
  | 3    | Weak    | Low PNR: Mediums control context (high opportunity for fraud). No predictive test (§7). |
  | 4a   | Nothing | Low PNR: Investigator incentivized *for* effect (low incentive for null). Gaps imply low integrity. |
  | 4b   | Strong  | High PNR: Conjurer incentivized *against* effect + sealed records (high incentive + high integrity). |
  | 5    | Aggregate strong; individual nothing | **Individual**: Near-zero PNR (no safeguards). **Aggregate**: High PNR if survey design had adversarial oversight, blind coding, or pre-registration (§Clause 4). |
  | 6    | Pro-skeptic witnesses count | High PNR: Skeptical witnesses have high incentive for null + capacity to detect fraud. |
  | 7a   | Debunk fails | Low PNR: Post-hoc explanation requires no new test (no predictive leverage). |
  | 7b   | Debunk succeeds | High PNR: Prediction + protocol change tests explanation (predictive leverage). |
  | 8    | Anomaly not established | Low PNR: Decay under controls implies initial low-integrity methods (high opportunity for error). |
  | 9    | Strong | High PNR: No incentive to fabricate + records immutable (retroactive integrity). |

  ---

  ### Analysis of Unlisted Cases
  (a) **Sensitive-only detection with airtight protocol**:  
  - **Verdict**: Weak evidence (low PNR).  
  - **Why**: Operator has high incentive/capacity for self-deception. No independent verification (zero integrity safeguards). PNR hinges on others' inability to audit.  

  (b) **Single sealed envelope before hostile committee**:  
  - **Verdict**: Statistically negligible but methodologically strong.  
  - **Why**: High PNR (hostile committee = high incentive for null; sealed record = high integrity). But sample size *n*=1 limits evidentiary weight.  

  (c) **Retrospective administrative correlation with huge effect size**:  
  - **Verdict**: Strong evidence.  
  - **Why**: High PNR. No stake → low incentive for anomaly; mundane explanation known but effect size overwhelms it. Immutable records (administrative data) ensure integrity.  

  ---

  ### Inconsistencies and Resolutions
  1. **Case 5 (Aggregate Paradox)**:  
     - **Conflict**: You reject individual reports but accept the aggregate.  
     - **Resolution under PNR**: The aggregate *only* has weight if the *survey methodology* had high PNR (e.g., blinded coders, pre-registered analysis). Otherwise, it inherits the low PNR of its components. **Verdict to abandon**: Treating the aggregate as strong evidence *without* methodological PNR.  

  2. **Cases 3 vs. 7**:  
     - **Conflict**: Case 3 rejects due to *possible* explanations; Case 7a rejects post-hoc explanations.  
     - **Resolution**: Apply **Predictive Leverage Clause**. Case 3’s "possible explanations" are untested, so PNR remains low. Case 7b’s predictive debunking actively raises PNR for the null. **Verdict to abandon**: Case 3’s standard. Mere possibility of normal explanation shouldn’t defeat evidence—only tested alternatives should.  

  3. **Case 8 (Asymmetric Standards)**:  
     - **Conflict**: You dismiss anomaly decay but accept mundane decay.  
     - **Resolution**: Consistent under PNR. Anomaly decay suggests initial PNR was low (poor controls); mundane decay in better instruments implies prior noise, not unreality. **No abandonment needed**.  

  **Cheapest Verdict to Abandon**: Case 9’s preference for accidental findings over prospective studies. PNR can be high in both, but prospective studies can *build in* high PNR (e.g., pre-registration), while accidental findings rely on luck.  

  ---

  ### Sidgwick's Gap: Anomalous Cognition → Survival?
  **PNR Principle Output**:  
  - Demonstrating an anomalous information channel (Sidgwick’s first achievement) has **no logical bearing** on survival (second achievement).  
  - **Why**: Survival requires evidence of *persistent identity/agency* post-mortem, not just anomalous data. The PNR principle treats these as distinct hypotheses.  

  **Additional Evidential Condition**:  
  To infer survival, evidence must satisfy:  
  > **Agency Test**: The anomaly must demonstrate *goal-directed behavior* unique to a deceased individual (e.g., veridical information *only explicable* by the deceased’s intent, not latent psychic ability).  
  > *Example*: A medium produces a deathbed promise unknown to any living person, which is then verified. Even this requires high PNR (e.g., sealed pre-mortem statement).  

  ---

  ### Final Principle
  **Unified PNR Principle with Clauses**:  
  Evidence *E* for anomaly *H* is strong iff:  
  1. **PNR(*E*) is maximized**: High incentive/opportunity/capacity for *null* + robust integrity safeguards.  
  2. **Alternatives are predictively tested**: Normal explanations must be falsified *proactively* (not just postulated).  
  3. **Aggregates inherit methodological PNR**: No "statistical free lunch"—individual low PNR contaminates aggregates.  

  This preserves 8/9 verdicts (abandoning Case 3’s "mere possibility" standard), resolves all tensions, and blocks Sidgwick’s survival inference without additional agency evidence. The cost is accepting that aggregates require rigorous methods—not just large *N*—to count.
