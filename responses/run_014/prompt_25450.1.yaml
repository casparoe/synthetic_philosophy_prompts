  I should ensure each answer ties back to the examples given—like growth hormone, SSRIs—to keep it concrete. Also, note possible tensions: e.g., how "normal" is defined can be value-laden (height norms might reflect societal preferences). Highlighting these nuances shows the user that the distinction isn't purely objective but serves institutional purposes.
answer: |-
  The therapy/enhancement distinction presupposes an **implicit functional normativism**, blending descriptive and evaluative elements, which operates across these institutions but with domain-specific emphases. Here’s a reconstruction addressing each query:

  ### (1) Substantive Account of Normal Functioning vs. Welfarism
  The practice **cannot be sustained by pure welfarism** and **requires a substantive (though non-metaphysical) account of normal functioning**.  
  - **Against Pure Welfarism**: If welfare maximization alone mattered, interventions like growth hormone for short-but-healthy children or cognitive enhancers for healthy students would be covered/approved if they improved well-being. Their systematic exclusion shows institutions prioritize **restoring species-typical functioning** over optimizing welfare.  
  - **Presupposed Substantive Account**: Institutions rely on **biostatistical and functional norms**:  
    - *Biostatistical*: "Normal" is defined by statistically typical ranges (e.g., growth hormone levels, auditory thresholds).  
    - *Functional*: "Health" is tied to the ability to perform typical human functions (e.g., glucose metabolism, mood regulation without pathological despair).  
  This is **not a metaphysical "human nature"** but an **empirically anchored baseline** (e.g., WHO health definitions). Welfare gains beyond restoration are seen as elective luxuries, not medical necessities.  

  ### (2) Theory of Health/Disease Boundary
  The practice presupposes a **hybrid theory** combining naturalist and normativist elements:  
  - **Naturalist Core**: Diseases are objectively dysfunctional biological states (e.g., insulin deficiency in diabetes, hair cell loss in deafness). This justifies covering cochlear implants but not auditory enhancers for musicians.  
  - **Normativist Layer**: Social values determine *which* deviations matter (e.g., depression is a disease because society values emotional resilience; male-pattern baldness is often not).  
  - **Sustaining Theories**:  
    - **Compatible**: **Hybrid theories** (e.g., Wakefield’s "harmful dysfunction") align perfectly. **Weak naturalism** (Boorse) fits but struggles with value-laden conditions (e.g., is infertility a disease only if reproduction is socially valued?).  
    - **Incompatible**: **Pure normativism** (e.g., Szasz) collapses the distinction (all interventions address "disvalued states"). **Strong naturalism** (e.g., evolutionary theories) fails for conditions not reducing fitness (e.g., late-onset diseases).  

  ### (3) Consistency Across Domains  
  The distinction is **superficially consistent but functionally divergent**, revealing **domain-specific priorities**:  
  | **Domain**       | **Primary Goal**          | **Implicit Theory Emphasis**                               |  
  |------------------|---------------------------|-----------------------------------------------------------|  
  | Health Insurance | Cost-effective care       | **Medical necessity**: Restoring function to avoid harm/suffering. |  
  | Anti-Doping      | Fairness & sport integrity | **Level playing field**: Enhancing beyond natural potential subverts merit. |  
  | Drug Regulation  | Safety & efficacy         | **Risk-benefit for pathology**: Higher risks tolerated only for disease. |  
  - **Tension Example**: Beta-blockers are *therapy* for hypertension (insurance covers) but *enhancement* for musicians (banned in competitions). Sport prioritizes fairness over individual welfare.  

  ### (4) If the Distinction Collapses: Costs and Revelations  
  If the distinction were abandoned:  
  - **Institutions Forced to Change**:  
    - **Insurance**: Would need new criteria for coverage (e.g., **cost-effectiveness thresholds** or **severity-based prioritization**). Covering all enhancements could bankrupt systems.  
    - **Sport**: Might allow performance-enhancing drugs, demanding **extreme safety monitoring** or redefining athletic merit as "enhanced vs. natural."  
    - **Medicine**: Professional boundaries blur—clinicians might face demands for mood/cognitive enhancement, straining trust.  
  - **Practical Costs Reveal**:  
    The distinction primarily serves to **conceal rationing decisions** (insurance), **enforce meritocracy** (sport), and **protect medical legitimacy** (drug regulation/ethics). Its collapse would expose:  
    - That "health" was a **proxy for resource allocation** in insurance.  
    - That sport’s "fairness" relies on **arbitrary biological constraints**.  
    - That medicine’s authority depends on **treating pathology, not optimizing life**.  

  ### Conclusion  
  The therapy/enhancement distinction is a **pragmatic, institutionally contingent boundary** masquerading as a natural kind. It presupposes a defensible but contested hybrid theory of health, tailored to manage social priorities (equity, fairness, sustainability) rather than reflecting a philosophically pure principle. Its resilience lies in its utility for rationing, regulation, and maintaining institutional identities—not its conceptual coherence.
