  Next, the health/disease boundary. The examples given—like growth hormone for deficiency vs. enhancement—suggest a naturalist view, where disease is a deviation from biological function. But wait, normativists argue that social values define disease. Hybrid theories might fit better here because institutions use both biological and normative criteria. For instance, depression is treated because it impairs function *and* society values mental health. So the practice probably uses a hybrid approach, even if not explicitly stated.

  Third question: consistency across domains. At first glance, they all use the therapy-enhancement divide, but their goals differ. Insurance is about resource allocation, sports focus on fairness, drug regulation on safety. Anti-doping might care more about maintaining a "level playing field" than health per se. For example, beta-blockers in surgery are therapy, but in sports, they're banned as enhancement. So each domain might have different underlying values, even if the distinction looks similar.

  Last part: if the distinction is indefensible, what changes? If insurers had to cover enhancements, costs would skyrocket, forcing prioritization based on severity or cost-effectiveness. This reveals that the distinction was managing resources and defining medical necessity. In sports, removing the ban could lead to unsafe enhancements or undermine fairness, showing that the distinction preserved sport's integrity.

