  ### Joint Statement on Pascal's Mugging: Findings from Adversarial Collaboration

  **Introduction**  
  After a good-faith adversarial collaboration, we—a binding theorist (B) and a non-binding theorist (NB)—agree on core aspects of Pascal's Mugging while acknowledging unresolved differences. B holds that a rational agent must comply with the mugger’s demand when the expected disvalue of refusal (\(P \times Y\)) exceeds the cost of payment (\(X\)), as refusing violates expected utility maximization (EUM). NB holds that rational agents should refuse, as EUM is not binding here; principled reasons (e.g., probability dilution or decision-theoretic robustness) justify ignoring the threat. Below, we present (1) agreed claims, (2) precise differences, (3) cruxes with test cases, and (4) notes on verbal disputes.

  ---

  ### 1. Agreed Claims  
  Both camps accept the following:  

  1. **Scenario Definition**: The canonical Pascal’s Mugging involves a mugger claiming, without evidence, "Pay me \(X\), or I will cause harm \(Y\) (with small but nonzero probability \(P\), or with certainty)." \(Y\) is astronomically large (e.g., \(3^{3^{3}}\) disutils), \(X\) is finite (e.g., $10), and \(P\) is nonzero but unmeasurably small.  
  2. **Theoretical Focus**: The debate concerns rational choice under idealized conditions, assuming the threat is evaluated at face value. Empirical intuitions (e.g., "the mugger is likely a scam") are excluded; the issue is whether EUM or an alternative criterion binds the agent.  
  3. **Expected Disvalue Calculation**: If EUM applies directly, paying is favored when \(P \times Y > X\). Both sides reject dismissing this calculation solely because \(Y\) is large or \(P\) is small.  
  4. **Problematic Outcomes**:  
     - If EUM binds, agents must pay for any \(Y\) (given fixed \(P > 0\) and finite \(X\)), enabling extortion.  
     - If EUM does not bind, agents may ignore genuine catastrophic risks.  
  5. **Unbounded Utility Concerns**: Unbounded utility functions (where \(Y\) can approach \(-\infty\)) risk degeneracy in EUM (e.g., infinite expected disvalues that preclude action ranking). Both sides find this problematic but disagree on implications.  
  6. **Alternative Criteria**: Robustness-based criteria (e.g., maximin, satisficing with probability thresholds) exist and may avoid mugging-like pitfalls. Their validity is disputed.  
  7. **Shared Goal**: To resolve whether rational agents should pay, and whether EUM remains normative in extreme cases.  

