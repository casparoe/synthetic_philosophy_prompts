  ### 2. Precise Differences  
  Each camp’s view, stated in its own terms:  

  - **Binding Theorist (B)**:  
    > "When \(P \times Y > X\), a rational agent must pay. Refusal violates EUM—a principle the agent accepts in non-mugging contexts—without a consistent, domain-general justification. Extraordinariness of \(Y\) does not rationally compel discounting \(P\); doing so is arbitrary and opens decisions to bias."  

  - **Non-Binding Theorist (NB)**:  
    > "A rational agent should not pay. Principled reasons—including probability dilution (threats like this could target anyone, reducing \(P\) to near-zero), incoherence of unbounded utility, or the superiority of robustness criteria—explain why EUM fails. This preserves rationality without ad hoc exceptions."  

