  ### Everyday Version: The Grocery Run Dilemma
  You're driving to pick up groceries from one of three identical-looking stores on a straight road. You *must* stop at exactly one store. Store 1 has the wrong item (you lose 10 minutes returning it), Store 2 has your order (on time), and Store 3 has your order but it’s warm because the fridge broke (you lose 5 minutes dealing with it). If you pass all three, you go home empty and waste 30 minutes cooking from scratch. You’re distracted by a podcast and lose track of which store you’re at—they look identical. The night before, you program a rule into your phone: at each store, you’ll stop with probability *p*. The *ex ante* best *p* (calculated before driving) is 0.4. But when you’re actually staring at a store, the math says you should stop for sure. The two perspectives disagree.

  ---

  ### Unpacking the Numbers
  **Payoffs (minutes wasted, so lower is better):**  
  - Stop at Store 1: **0** (baseline penalty)  
  - Stop at Store 2: **-4** (saves time vs. baseline)  
  - Stop at Store 3: **-6** (saves even more time)  
  - Pass all stores: **0** (same as Store 1)  

  *Why these payoffs?*  
  - Store 2 is best (you get groceries fast).  
  - Store 3 is good but annoying (warm groceries cost you 5 extra minutes).  
  - Store 1 is neutral (10-minute penalty, but baseline is 0).  
  - Passing all is worst (30 minutes wasted = 0 payoff to match Store 1’s penalty).  

  **Ex Ante Optimal Rule (from home):**  
  With probability *p* to stop at any store, the expected payoff *V* starting from Store 1 is:  
  - *V(Store 3) = p × (-6) + (1-p) × 0 = -6p*  
  - *V(Store 2) = p × (-4) + (1-p) × V(Store 3) = -4p + (1-p)(-6p) = -4p -6p + 6p² = 6p² -10p*  
  - *V(Store 1) = p × 0 + (1-p) × V(Store 2) = (1-p)(6p² -10p)*  

  Simplify:  
  *V(Store 1) = 6p² -10p -6p³ +10p² = -6p³ +16p² -10p*  
  Maximize this by taking the derivative:  
  *V' = -18p² + 32p -10*. Set to 0:  
  *18p² -32p +10 = 0* → Solutions: *p ≈ 0.4* or *p ≈ 1.39* (invalid).  
  At *p = 0.4*, *V ≈ -0.96* (best possible).  

  **From the Driver’s Perspective (at a store):**  
  Conditional probabilities given you’re at a store:  
  - *P(Store 1) = 1 / [1 + (1-p) + (1-p)²] ≈ 0.53*  
  - *P(Store 2) = (1-p) / denominator ≈ 0.32*  
  - *P(Store 3) = (1-p)² / denominator ≈ 0.15*  

  Expected payoff if you **stop now**:  
  *E[stop] = (0.53)(0) + (0.32)(-4) + (0.15)(-6) ≈ -1.58*  

  Expected payoff if you **continue** (and follow *p = 0.4* later):  
  *E[continue] = (0.53) × V(Store 2) + (0.32) × V(Store 3) + (0.15) × 0*  
  Plug in *V(Store 2) ≈ -1.44*, *V(Store 3) ≈ -2.4*:  
  *E[continue] ≈ (0.53)(-1.44) + (0.32)(-2.4) ≈ -1.66*  

  Since *-1.58 > -1.66*, you should **stop now** (even though *ex ante* *p = 0.4* is optimal).  

  ---

  ### Why the Split Happens
  The **key detail** is that when you’re *at* a store, you’re more likely to be at Store 1 (53% chance) than at Stores 2 or 3. Stores 2 and 3 have better payoffs, but the high chance of wasting time at Store 1 makes continuing *seem* worse in the moment. Ex ante, you balance this by mostly skipping early stores (*p = 0.4* means you drive past 60% of stores), but in the moment, the fear of hitting the worst store (Store 1) dominates.  

  **Tweak to remove the split:**  
  Make the payoffs at Store 1 and Store 3 identical (e.g., both **0**). Then:  
  - *Ex ante* best *p ≈ 0.5*.  
  - At any store, *E[stop] = E[continue]*.  
  No split—both perspectives agree.  

