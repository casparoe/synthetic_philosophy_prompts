  First, I need to unpack Butler's passage. The key distinction is between sudden anger (instinctive, pre-reflective) and settled resentment (requiring moral appraisal of injury/injustice). The user wants this mapped as a logical chain - so I'll identify premises like "settled resentment requires injury apprehension" and the conclusion that it's a necessary social guard. The load-bearing step seems to be the cognition requirement, not the utility claim.

  For the user's debate with Dan: Dan sees it as cognition+duration difference with utility focus, while the user insists it's inherent moral recognition. The text supports the user more strongly - Butler explicitly calls settled resentment a "different order" carrying normative judgment ("ought not done"), not just hotter anger. 

  The teleology worry is thorny. Butler says resentment is "part of our constitution" for society's good, but this risks instrumentalizing it. His out might be that the moral appraisal (injury/injustice) intrinsically defines resentment, while utility justifies its existence in nature - two layers. Malice is clarified as corrupted resentment, not separate, showing the passion's duality.

  Strawson comparison: Butler's scheme has one moral passion (resentment for personal injury) regulated by impartial conscience/benevolence. Strawson structurally separates participant resentment from spectator indignation and agent guilt - this triad can't reduce to Butler's model. More crucially, Strawson blocks external justification ("the practice isn't up for grabs") while Butler leans on natural teleology. Dan can't absorb this; they're different justificatory moves.

  Final call: User wins on Butler's text (settled resentment is inherently moral), but Dan's analogy fails on Strawson's structural innovations. I'll present this cleanly without citations as requested.
answer: |-
  Here's a direct conceptual breakdown based solely on the passage you provided and your questions:

  ### 1. Butler's Argument Chain (Load-Bearing Step Highlighted)  
  - **Premise 1:** Sudden anger is instinctive, pre-reflective, and non-moral (shared with animals).  
  - **Premise 2:** Settled resentment *requires* "apprehension of injury—injustice, design" (i.e., moral cognition).  
  - **Load-Bearing Step:** "It is not merely a hotter version of the first impulse but a thing of a different order, since it already carries in it the notion that something was done which ought not to have been done." → **This transforms resentment into a moral passion.**  
  - **Conclusion:** Settled resentment is (a) constitutive of human nature, (b) necessary for societal justice, and (c) requires governance by conscience/benevolence.  
  **Crucial:** The "apprehension of injury" makes it moral; the "good of society" justifies its *existence* in nature but doesn’t define its moral character. The cognition is primary; utility is secondary support.  

  ### 2. You vs. Dan: Who’s Closer?  
  **You are closer.** The passage explicitly states settled resentment is "a thing of a different order" because it *necessarily* involves recognizing injury *as injustice* ("ought not to have been done"). Dan’s "just useful + more cognition" ignores the qualitative shift: Butler embeds moral judgment *in the passion itself*. Utility is a *consequence*, not its essence.  

  ### 3. Teleology & Instrumentalism: Butler’s Out  
  - **Problem:** If resentment is *only* justified by social good, it becomes a tool (resent anyone if it improves outcomes).  
  - **Butler’s Out:** "Part of the constitution of our nature" ≠ mere usefulness. It means:  
    - (a) Resentment is *defined by* moral recognition (you *can’t* have it without apprehending injury/injustice).  
    - (b) Its teleological purpose (guarding society) is *contingent* on its intrinsic moral structure.  
  **Result:** You *cannot* resent "someone who hurt nobody" because resentment *requires* apprehending injury. Utility justifies why we *have* the passion, not what counts as resentment.  

  ### 4. Malice: Corruption, Not Separate  
  - Malice/revenge are *excesses/perversions* of settled resentment ("slides over into").  
  - **Implication:** The "guard against injustice" *requires* the passion’s core structure (focused on injury *as wrong*). Malice is that structure corrupted (aim shifted to "suffering" over "preventing injury").  
  - **Could society work without the slide?** No—Butler says resentment is "liable to excess" by nature, hence requiring governance. The passion’s dual potential (justice-guard vs. cruelty) is inseparable.  

  ### 5. Strawson vs. Butler: The Unbridgeable Gap  
  **Strawson’s step Butler can’t generate:**  
  - Butler’s scheme: **One moral passion** ("settled resentment" directed at *personal* injury), regulated by **external governors** (conscience/benevolence) for impartiality/society.  
  - Strawson’s move: **Structural division of reactive attitudes** into:  
    - *Participant* (resentment: victim’s POV),  
    - *Spectator* (indignation: impartial disapproval),  
    - *Agent* (guilt: self-reactive).  
  **Why Butler can’t absorb this:**  
    - Butler’s "settled resentment" merges the participant and spectator roles (it's personal *but* justice-oriented). Strawson splits them, making indignation *sui generis*—not resentment governed by benevolence, but a distinct attitude for impersonal wrongs.  
    - **Justification difference:** Butler’s "part of our constitution" is a teleological claim (*why* we have it). Strawson’s "not up for justification" rejects external grounds entirely—reactive attitudes *constitute* the framework for moral responsibility; they’re immune to determinist "facts".  

  **Verdict:** Dan’s analogy *fails* at Strawson’s structural division of attitudes and his justificatory quietism. Butler’s model is monistic (one passion + regulators); Strawson’s is triadic. Butler justifies via natural purpose; Strawson voids the justificatory demand. **You win on the text; Dan oversimplifies.**
