prompt: |-
  so I was up until like 2am last night arguing with my friend Dan and my head is still spinning, and I figure you might be less annoying about it than he is. We're both readers of this stuff, he's halfway through a philosophy PhD, I'm a lawyer who does it on the side.

  The fight started with Strawson's *Freedom and Resentment* and ended, weirdly, with Bishop Butler. Dan's whole thesis is that Strawson's paper is basically Butler's sermon on resentment with the theology deleted — reactive attitudes = Butler's "settled and deliberate resentment," the objective attitude = what happens when you stop regarding someone as an agent at all, and Strawson's move about the practice not being up for justification by the kind of facts the determinist cites = Butler's move about resentment being part of the constitution of our nature so quit asking. I said no, that's a lazy analogy, and then I couldn't say why, which is what has me here.

  To argue about it properly I went and dug up Butler's sermon on resentment from the Rolls Chapel sermons (1726 — I think it's number eight but don't hold me to that), and there's one stretch we kept circling back to. Important caveat: I was working off a bad scan on my phone and I've typed this out loosely and partly in my own words, so treat the wording as approximate. Do not do anything that turns on Butler's exact phrasing, and don't tell me to go check the original — just flag it if you think one of my questions would come out differently depending on how it's actually worded.

  The stretch, as I've rendered it:

  Sudden and hasty anger is something we share with the brutes. It is an impulse planted in us for the sake of immediate self-preservation, and it can be stirred up by mere hurt or surprise, without any thought of who did it or whether they meant to do it; it is spent before reflection begins. What belongs peculiarly to us is settled and deliberate resentment. This arises only upon the apprehension of injury — of injustice, of someone's having designed the harm — and it cannot arise without that apprehension. So it is not merely a hotter version of the first impulse but a thing of a different order, since it already carries in it the notion that something was done which ought not to have been done. And this settled resentment is not a disease in our nature but a part of its constitution, and is necessary to the good of society: it is the guard against injustice, without which the peaceable are a prey to the violent. Yet it is liable to excess and perversion — it slides over into revenge, malice, cruelty — and so needs to be held under the government of conscience and of a general benevolence, so that it aims at the real good, the preventing of injury, and not merely at the suffering of the person who injured us.

  What I want from you:

  1. Lay the argument out as a chain. Which bits are premises and which is the conclusion, and where's the load-bearing step? Specifically: is "settled resentment presupposes the apprehension of injury" doing all the work in making it a *moral* passion, or is the "necessary to the good of society" claim doing independent work that could stand on its own?

  2. Dan says the two kinds of anger differ only in how much cognition is involved and how long they last, and that Butler's actual point about the second one is just that it's useful. I said the point is that settled resentment is already a form of moral recognition and not a tool at all. Who's closer to what the passage supports? And be honest if the passage just doesn't decide between us.

  3. The teleology is what really bothers me and I couldn't put my finger on it last night. If resentment is justified because it serves the good of society, then the right dose of it looks like whatever dose produces good outcomes — which makes it an instrument, and which seems to imply I could properly resent someone who hurt nobody at all, provided resenting them improved things. Does Butler have an out here? Is "part of the constitution of our nature" functioning as a straightforward appeal to usefulness, or is it doing something else entirely?

  4. Where does malice actually sit in this? The passage says resentment slides over into revenge and cruelty — is malice the same passion corrupted, or a different thing wearing its clothes? Does it matter for the guard-against-injustice claim, i.e. could Butler get his social benefit without the slide ever happening?

  5. The comparison, which is the actual reason I'm asking. Give me the precise conceptual step Strawson makes that Butler's two-tier scheme cannot generate, if there is one. Not vibes, not a book report on either of them — I know the outline of both. I'm interested in things like: Butler seems to have *one* moral passion aimed at injury done to *me* plus an impartial concern for society handled by benevolence and conscience, whereas Strawson splits resentment off from indignation and guilt in a way that seems to need the participant/spectator/agent triad; and Butler's justification-story looks like a natural-teleology story about what our nature is for, whereas Strawson's looks like a claim that a certain kind of demand for justification just doesn't get a grip. Tell me whether those differences are real differences or whether Dan can absorb them. And if Dan is basically right, say so — I'd rather find that out now than in three weeks.

  6. No bibliography, no reading list, no "for further discussion see." I can't look anything up and I'm not going to. Also don't tell me whether Strawson footnotes Butler anywhere; I genuinely don't remember and a guess from you is worse than nothing. Stick to the concepts and the passage I gave you.
