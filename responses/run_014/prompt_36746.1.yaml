prompt: |-
  I'm putting together a short opinionated piece for a workshop on moral epistemology and I want a sanity check on the argument before I embarrass myself in front of people who actually work on this stuff. Draft is below. Give me exactly five numbered comments, each one or two sentences, no intro or conclusion — just hit the weakest joints and tell me what to fix.

  Draft:

  "The puzzle of moral testimony is usually stated as an asymmetry: testimony seems perfectly fine as a source of belief about geography or chemistry, yet something seems off about forming moral beliefs that way — even when the source is clearly trustworthy. The standard moves are familiar. Either we deny the asymmetry, or we explain it via the knowledge/understanding distinction (you can get moral knowledge by testimony but not moral understanding, and understanding is what you need for acting well), or we argue that moral deference is somehow self-undermining. I want to suggest that all of this rests on a fiction: that our moral beliefs are normally the product of deliberation in the first place. They aren't. Nearly every moral view a normal adult holds — about promise-keeping, punishment, what we owe strangers — was absorbed from parents, peers, and ambient culture long before any deliberation occurred, and testimony played no role because nothing so structured as testimony was going on. So the puzzle only ever arises in the rare case where deference would conflict with someone's self-image as a deliberator, and what we are seeing is not an epistemological anomaly but wounded vanity. Once we see this, the asymmetry with geography and chemistry dissolves: in those domains we never had the self-image to wound. And the real problem the literature keeps dancing around is not deference but correlated deference — echo chambers, communities testifying to one another in a closed loop. That is a social epistemology problem about trust networks, and no amount of precision about moral understanding will touch it."

  Be harsh if it deserves it — I've got a nagging feeling the middle step does alot of work it shouldn't.
reasoning: |-
  Okay, the user is preparing a workshop piece on moral epistemology and wants a sanity check on their argument about moral testimony. They specifically want five critical comments pointing out weaknesses, without any fluff. The core of their argument challenges the standard framing of the moral testimony puzzle by claiming that moral beliefs are primarily absorbed uncritically from culture, not deliberated, making the "asymmetry" with factual domains like geography just a matter of wounded vanity when deference conflicts with self-image.

  Hmm, the user's self-diagnosed worry about the "middle step" doing too much work is spot-on. Let me unpack that. The leap from "beliefs are absorbed" to "therefore the puzzle is only about vanity" feels underdefended. Absorption doesn't automatically mean deliberation is irrelevant later—people *do* sometimes revise moral beliefs through reflection, even if foundations are cultural. The user needs to engage with that counterargument.

  Also, the geography/chemistry comparison wobbles. Factual beliefs can absolutely be absorbed uncritically too (e.g., thinking Pluto is a planet because a teacher said so), yet we don't frame *that* deference as problematic. Why is moral deference uniquely vulnerable to vanity claims? The user should either drop this asymmetry claim or refine it.

  The correlated deference pivot at the end is intriguing but jarring. If the real target is echo chambers, why frame the whole piece around vanity? The connection feels loose—maybe reposition this as the positive thesis upfront instead of a surprise reveal.

  I'm also side-eying the use of "fiction" to describe moral deliberation. Overstatement? People *do* deliberate, even if less often than assumed. "Overstated" or "misleading" might be less incendiary. And empirically—how do we *know* "nearly every" moral belief is pre-deliberative? A citation or nod to evidence (e.g., socialization studies) would help.

  Lastly, the wounding vanity point needs more nuance. When philosophers critique moral deference, it's often about autonomy or reasons-responsiveness, not just hurt feelings. Dismissing it as vanity risks straw-manning the opposition. Could acknowledge those concerns before rebutting.

  ...Right, five concise punches. User asked for harshness, so no sugarcoating: weak transitions, shaky comparisons, empirical gaps, overclaims, and an undercooked pivot. Time to condense this into numbered brutality.
answer: |-
  Here are five critical comments:

  1.  **The leap from "absorbed" to "no deliberation role" is too quick:** You assert absorbed beliefs preclude later deliberation shaping them, but adults *do* often re-evaluate inherited views through reflection, which weakens the claim that testimony uniquely conflicts with self-image.
  2.  **The geography/chemistry comparison is overstated:** Even in those domains, many beliefs are passively absorbed without deliberation (e.g., basic geography), yet we don't perceive deference there as problematic—suggesting your "wounded vanity" explanation doesn't fully dissolve the asymmetry.
  3.  **Empirical claim needs support:** Asserting "nearly every moral view... was absorbed... long before any deliberation" is a strong empirical claim central to your argument; you need to acknowledge this requires evidence you haven't provided.
  4.  **"Wounded vanity" risks being uncharitable:** Reducing the discomfort with moral testimony *solely* to wounded self-image dismisses substantive philosophical arguments about autonomy, reasons-responsiveness, or the nature of moral judgment without engaging them.
  5.  **The pivot to "correlated deference" feels disconnected:** While raising echo chambers is valuable, it doesn't clearly follow from the preceding argument about absorption and vanity, making the conclusion seem like a non-sequitur rather than a resolution.
