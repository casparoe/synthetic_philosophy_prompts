answer: |-
  **Steelman Rescue Advocate:**  
  Your boots get destroyed *preventing a death directly in front of you*. My $500 to Against Malaria buys nets *preventing a death directly in front of a child in Zambia*. Distance doesn’t erase the child choking on dirty water or parasites shredding their organs. You’re describing *your anxiety about optics*, not a moral difference in outcome.  

  **Counterpunch 1:**  
  "Another rich donor might give less"? Prove it. Where’s the evidence that *your* specific $500 triggers a net reduction elsewhere? Even if it did—so what? The drowning kid doesn’t care if your boots convinced a bystander to leave. The *child dies or lives*. Your logic excuses inaction because you imagine hypothetical donors withdrawing—while real kids drown *right now*.  

  **Counterpunch 2:**  
  Charities "move money around"? Good. That’s called *allocating resources efficiently*. You jumping in the pond doesn’t magically create boots or ambulances—you’re just reallocating *your* time and assets. My $500 isn’t "different"; it’s deploying resources *where they’re needed most*. Refusing because it’s indirect is like refusing CPR unless you’re the *only* medic on Earth. Narcissism isn’t ethics.  

  **Counterpunch 3:**  
  You’d ruin your boots for *visible, immediate heroism*. But you’d let a kid die slowly from dysentery because the rescue isn’t dramatic? That’s valuing your *emotional experience* over a life. If I toss you a life preserver instead of diving in myself, did I "do nothing"? No—I saved the kid *without* the theatrics. Demand the same standard for the unseen.  

  **Final Strike:**  
  You’re inventing layers of doubt to protect your comfort. The pond kid’s rescue is simple because you *see* the crisis. The child 8,000 miles away is equally real, equally drowning in preventable suffering. Your hesitation isn’t philosophy—it’s cowardice gilded with pseudo-pragmatism. Either a life is worth your $500 or it isn’t. Distance is a geography problem, not an ethics loophole. **Act.**  

  *Your move. Defend inaction.*
