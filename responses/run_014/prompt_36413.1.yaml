answer: |-
  Below is a structured, philosophy-grounded procedure for evaluating omissions in property claims, designed to be completed in 20–30 minutes. It addresses your concern about "drifting" by separating causal analysis from normative/duty-based judgments, forcing explicit handoffs to coverage counsel or your discretion where values or law (not causation) take over. The procedure is built on **counterfactual dependence** (the dominant view in causation philosophy) and **normative filters**, with safeguards for hard cases.

  ---

  ### **Procedure: Evaluating Omissions in Property Claims**
  **Time Allocation**: 20–30 minutes per file.  
  **Core Principle**: An omission is causal only if its presence would have *prevented the loss* in the specific scenario. Duty determines *responsibility*, not causation.  
  **Key Handoff Points**: Highlighted in **bold**. When reached, stop and consult coverage counsel or apply legal judgment.

  #### **Step 1: Define the Loss and Omission (5 mins)**
     - **Question 1a**: What is the *specific physical event* that directly caused the loss? (e.g., "pipe burst during freeze," "fire ignition," "mold growth").  
       *Sufficient Answer*: A discrete, timestamped event.  
       *Stop If*: Loss is vague (e.g., "negligence"); redefine or hand off.  
     - **Question 1b**: What *specific action was omitted*, by whom, and when? (e.g., "caretaker didn’t shut off water on [date]").  
       *Sufficient Answer*: An act that could have been performed at a defined time.  
       *Stop If*: Omission is undefined (e.g., "general negligence"); hand off.  

  #### **Step 2: Counterfactual Test for Cause-in-Fact (10 mins)**
     - **Question 2a**: "But for this omission, would the **specific loss event** (from Step 1a) have occurred? Assume all other conditions (including other omissions) remain identical."  
       *Sufficient Answer*:  
         - **Yes** (loss would still occur) → Omission is **not a cause**. Stop.  
         - **No** (loss would **not** occur) → Omission is a candidate cause. Proceed to 2b.  
         - **Unclear** → Hand off to fact investigation; *do not proceed*.  
     - **Question 2b** (For multiple omissions): "Would the loss have been **fully prevented** if *only this one omission* were corrected (holding others constant)?"  
       *Sufficient Answer*:  
         - **Yes** → Proceed to Step 3.  
         - **No** → Omission is **not a cause-in-fact**. Stop.  
       *Handles Hard Cases*:  
         - *Two omissions, each sufficient to prevent loss*: Both pass 2b (e.g., if either inspection had been done, fire would have been prevented). Both are causes.  
         - *Omission that would have failed*: If action would not have prevented loss (e.g., shut-off valve was broken), answer 2a is "yes" → not a cause.  
         - *Bystander omission*: If a passerby could have easily turned off water, they pass 2a/2b → cause-in-fact (but later filtered by duty).  

  #### **Step 3: Proximate Cause Filters (5 mins)**
     - **Question 3a**: Was the loss a **foreseeable consequence** of the omission? (e.g., frozen pipes from not winterizing is foreseeable; meteor strike is not).  
       *Sufficient Answer*:  
         - **Yes** → Proceed to 3b.  
         - **No** → Omission is **not a proximate cause**. Stop.  
         - **Debatable** → **Handoff to coverage counsel** (legal precedent needed).  
     - **Question 3b**: Was there a **superseding event** that broke the causal chain? (e.g., later unforeseeable storm, vandalism).  
       *Sufficient Answer*:  
         - **Yes** → Omission is **not a proximate cause**. Stop.  
         - **No** → Omission is a proximate cause. Proceed to Step 4.  
       *Handles Hard Cases*:  
         - *Omission only matters due to later storm*: If storm was unforeseeable, 3a = "no" → not proximate.  

  #### **Step 4: Normative/Duty Filter (5 mins)**
     - **Question 4**: Did the omitter have a **duty to act** (by contract, statute, policy, or role-based obligation)?  
       *Sufficient Answer*:  
         - **Yes** → Omission is a **causal factor for liability**. Use in adjudication.  
         - **No** → Omission is a **background condition** (not actionable). Stop.  
       *Handoff Point*: **Always hand off to coverage counsel** if duty is unclear (e.g., novel legal question).  
       *Handles Hard Cases*:  
         - *Bystander with no duty*: Even if cause-in-fact (Step 2), no duty → background condition.  

  ---

  ### **Application to Your Cases**
  **Goal**: Run the procedure neutrally, including one "unwanted" outcome.

  #### **Case 1: Caretaker Didn’t Shut Off Water → Burst Pipe**  
     - **Step 1a**: Loss event = "Water pipe burst during freeze."  
     - **Step 1b**: Omission = "Caretaker didn’t shut off water pre-freeze."  
     - **Step 2a**: But for omission, would pipe burst? *No* (shutting off water prevents bursting). → Cause-in-fact.  
     - **Step 2b**: N/A (single omission).  
     - **Step 3a**: Foreseeable? *Yes* (freezes are predictable).  
     - **Step 3b**: Superseding event? *No*. → Proximate cause.  
     - **Step 4**: Duty? *Yes* (caretaker’s job). → **Causal for liability**.  
     *Verdict*: Caretaker’s omission is causal.  

  #### **Case 2: Landlord & Alarm Contractor Skipped Inspections → Fire Loss**  
     - **Step 1a**: Loss event = "Fire ignition from electrical hazard."  
     - **Step 1b**: Omissions = (1) Landlord didn’t inspect; (2) Contractor didn’t inspect.  
     - **Step 2a/2b** (for each):  
       - *Landlord*: If inspected, fire prevented? *Yes* → Cause-in-fact.  
       - *Contractor*: If inspected, fire prevented? *Yes* → Cause-in-fact.  
     - **Step 3a**: Foreseeable? *Yes* (inspection’s purpose is to catch hazards).  
     - **Step 3b**: Superseding event? *No*. → Both proximate causes.  
     - **Step 4**: Duty? *Yes* for both (landlord by statute, contractor by contract). → **Both causal for liability**.  
     *Verdict*: Both omissions are causal. Liability may be joint.  

  #### **Case 3: Insured Didn’t Mitigate After Small Leak → Major Mold Loss**  
     - **Step 1a**: Loss event = "Mold growth from water exposure."  
     - **Step 1b**: Omission = "Insured didn’t clean leak within 48 hours."  
     - **Step 2a**: But for omission, would major mold occur? *No* (timely cleanup prevents mold). → Cause-in-fact.  
     - **Step 2b**: N/A.  
     - **Step 3a**: Foreseeable? *Yes* (mold from moisture is common knowledge).  
     - **Step 3b**: Superseding event? *No*. → Proximate cause.  
     - **Step 4**: Duty? *Yes* (policy requires mitigation). → **Causal for liability**.  
     *Verdict*: **Insured’s omission is causal → coverage denied for *additional* mold damage** (the "unwanted" outcome).  

  ---

  ### **Where the Procedure Misfires and Limitations**  
  1. **Misfires**:  
     - **Ambiguous Counterfactuals (Step 2)**: If "what would have happened" is speculative (e.g., "would inspection *really* have caught the hazard?"), the procedure halts for fact-finding. Philosophy can’t resolve empirical unknowns.  
     - **Overdetermination with Indeterminacy**: If two omissions are sufficient but not necessary (e.g., either inspection *might* have caught the hazard, but not guaranteed), Step 2b may falsely exclude one. Philosophy debates this; the procedure errs on requiring proof.  
     - **Normative Laundering**: Step 4 (duty) is where values/law enter, but the procedure makes this explicit. Your "drift" concern is *partially addressed*: Steps 1–3 isolate causation, but duty still determines outcome. The procedure doesn’t eliminate bias—it *exposes* it at Step 4.  

  2. **What It Cannot Do**:  
     - **Resolve Metaphysical Debates**: Philosophy has no consensus on omissions (e.g., are they "real" causes or just conditions?). The procedure uses pragmatic counterfactuals but can’t settle ontological disputes.  
     - **Replace Legal Judgment**: Proximate cause (Step 3) and duty (Step 4) require legal input. The procedure flags these handoffs but doesn’t absolve your discretion.  
     - **Handle "Mere Conditions" Perfectly**: A bystander’s omission passes Step 2 (cause-in-fact) but is dismissed at Step 4 (no duty). This matches your intuition but confirms that causation ≠ liability.  

  **Conclusion**: This procedure forces you to separate *causal inquiry* (Steps 1–3) from *normative judgment* (Step 4/handoffs), reducing drift by confining "duty" to the final filter. However, it launders bias only partially: duty still drives outcomes, but now causation is objectively tested first. Use it as a diagnostic—if your outcomes change, bias was present; if not, your intuition was sound. For murky cases, hand off early.
