  We are going to develop a procedure based on philosophical accounts of causation by omission. The key idea is that omissions are causes when they are absences of actions that, had they occurred, would have prevented the harm, and when there is a norm (especially a duty) that makes the omission relevant. However, we want to avoid making the norm the sole criterion and instead ground the causal inquiry in a counterfactual analysis.

  The procedure will have the following steps:

  1. **Identify the Harm**: Precisely state the loss event that occurred (e.g., the burst pipe, the fire, the mold growth).

  2. **Identify the Alleged Omission(s)**: What specific action(s) were not taken that are being considered as potential causes?

  3. **Counterfactual Test for Necessity (But-for Cause)**:
     - Ask: "But for the omission, would the harm have occurred?"
     - If yes (i.e., the harm would have occurred anyway), then the omission is not a necessary condition and thus not a cause (at least not a but-for cause). Note: we might still consider it in an overdetermination scenario (step 4).
     - If no (i.e., the harm would not have occurred), then the omission is a but-for cause and we proceed to step 5.

  4. **Handling Overdetermination (Two Omissions Each Sufficient to Prevent)**:
     - In cases where multiple omissions are alleged and each alone would have been sufficient to prevent the harm, we have a situation of causal overdetermination by omission. In such cases, neither omission is a but-for cause (since the harm would have occurred even without one, because of the other). However, the law often treats each as a cause in fact (via the "substantial factor" test or similar). Therefore, we note that both are causes in fact.

