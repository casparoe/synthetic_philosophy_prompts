  First, I need to recall the key points of the spandrels paper. Gould and Lewontin argued against the idea that every trait is an adaptation. They used spandrels—architectural byproducts—as a metaphor for traits that arise for one reason and later get co-opted for another function. The middle ear bones are a classic example: they originated as part of the jaw in reptilian ancestors and were later exapted for hearing in mammals. The current panel's phrasing implies they evolved "to let you hear," which is adaptationist because it suggests direct selection for hearing, ignoring the evolutionary repurposing.

