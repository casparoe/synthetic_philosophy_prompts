prompt: |-
  I've been reading rationalist blogs and forums for years now, like since the old LessWrong days, and I still get tangled up on akrasia versus hyperbolic discounting and it blew up into a whole late night debate with my roomate yesterday. My take was they are basically the same thing with fancy versus nerdy labels, but he thinks they are totally different mechanisms and it matters for what to do about my own procrastination, like I keep staying up till 2am scrolling even though I set up a website blocker and everything.

  So can you compare the two ideas for me in a way that actually helps? Like take two versions of my scrolling habit: in one version, at 1am I am sitting there thinking I should really go to sleep, I beleive going to sleep is best all things considered, and then I keep scrolling anyway, feeling kinda guilty while I do it. In the other version, at noon I sincerely plan to sleep early, but at 1am I honestly change my mind and decide the videos are worth being groggy tomorrow, no guilt about judgment, just my preferences flipped when the reward got close. Which of those is philosophical weakness of will and which is just hyperbolic discounting, can you have one without the other, and which model better explains why precommitment stuff like blockers and alarms and betting money with friends sometimes works and sometimes just gets routed around? I want to know what the rationalist use of akrasia is actually pointing at.
reasoning: |-
  Okay, let me unpack this user's question. They've been into rationalist blogs for years but still struggle with distinguishing akrasia from hyperbolic discounting, especially regarding their procrastination habits. The debate with their roommate shows they need a clear, practical comparison.

  First, I need to define both concepts accurately. Hyperbolic discounting is about how people value immediate rewards more than future ones, leading to preference reversals. Akrasia is acting against one's better judgment, feeling the internal conflict. The user's examples are key here. The first scenario (guilt while scrolling) screams akrasia—they know they should stop but don't. The second scenario (sincerely changing their mind at 1am) fits hyperbolic discounting—the immediate reward of videos suddenly seems worth it.

  The user's deeper need is probably about solving their procrastination. They mentioned website blockers sometimes work, sometimes don't. So they want to know which model explains the failures and successes of their strategies. For hyperbolic discounting, precommitments like blockers or bets work by making the temptation inaccessible. But if it's akrasia, blockers might fail because the person finds workarounds due to conflicting desires.

  I should also address whether these concepts can occur separately. Pure hyperbolic discounting without akrasia happens when there's no inner conflict—just a rational shift in preference. Pure akrasia might involve immediate rewards not being a factor, like avoiding a difficult task despite no short-term pleasure. But often, they overlap, especially in procrastination cases.

  The user’s mention of "rationalist use of akrasia" suggests they want the practical takeaway. Emphasizing that recognizing the underlying mechanism (conflict vs. preference shift) helps choose the right strategy. For hyperbolic discounting, focus on precommitments. For akrasia, work on reducing the pain of the task or increasing immediate rewards for doing it.

  Also, considering their late-night scrolling habit, they might need tailored advice. Maybe combining strategies—using blockers (precommitment) while also making bedtime routines more rewarding to reduce akrasia. Highlighting that self-awareness in the moment (am I conflicted or just changing my mind?) can inform their response.
answer: |-
  This is a great question that cuts to the heart of practical rationality. You're right that akrasia and hyperbolic discounting are often tangled, but your roommate is also right that distinguishing them *matters* for solutions. Let's break down your scenarios using the concepts:

  1.  **The Concepts Defined:**
      *   **Hyperbolic Discounting (HD):** A *descriptive model* of how we *actually value rewards over time*. We irrationally overweight immediate rewards/costs compared to future ones. The discount curve is "hyperbolic" meaning the value of a future reward drops *precipitously* as it gets closer. At noon, sleep (future benefit) is highly valued; at 1 AM, the immediate buzz of scrolling is overwhelmingly valued, while tomorrow's grogginess feels abstract. This is a **preference shift** based purely on temporal proximity.
      *   **Akrasia:** *Acting against one's own better judgment*. It's the state of knowing (or sincerely believing) that action X is best *all things considered* ("akrasia" literally means "lacking command"), yet voluntarily choosing action Y. This involves **internal conflict and judgment failure** – you feel the pull of the worse option even as you judge the better one.

  2.  **Your Scenarios Analyzed:**
      *   **Scenario 1 (1 AM, "I *should* sleep, believe it's best, scroll anyway with guilt"):** This is **Classic Akrasia.** Your *judgment* ("sleep is best") is clear and active at the moment of choice. You experience the conflict ("should" vs. "want") and the negative feeling (guilt) that comes from violating your own standard. Hyperbolic discounting is the *mechanism fueling the temptation* (making scrolling *feel* overwhelmingly good *right now*), but the core failure is acting against your contemporaneous judgment.
      *   **Scenario 2 (Noon: Plan early sleep; 1 AM: Sincerely decide videos are worth it, no guilt):** This is **Pure Hyperbolic Discounting.** Your preference *actually changed* based on temporal proximity. At noon, you valued future sleep > future scrolling. At 1 AM, you value immediate scrolling > avoiding future grogginess. There's no internal conflict *at the moment of choice* because your *judgment itself shifted* to align with the immediate desire. You aren't acting *against* your better judgment at 1 AM; your "better judgment" *is* now "scrolling is worth the cost."

  3.  **Can You Have One Without the Other?**
      *   **Pure Hyperbolic Discounting (Without Akrasia):** Yes, as in Scenario 2. Your preferences shift smoothly with time. You make a different decision later, but it feels rational *in the moment* because your valuation of the options has genuinely changed due to immediacy. No guilt, no sense of failing yourself, just a different cost-benefit analysis based on temporal proximity.
      *   **Akrasia (Without Hyperbolic Discounting Being the Primary Driver):** Yes, though HD is often a factor. Examples:
          *   Avoiding a difficult conversation you know you need to have, even though there's no *immediate* pleasure in avoidance (just relief) and no strong *future* benefit for delaying (it might make things worse). The driver might be fear, avoidance of discomfort, or lack of willpower, not primarily a shift in time-based valuation.
          *   Choosing to eat junk food *right now* even though you know it will make you feel slightly ill *very soon* (e.g., in 30 minutes). The discounting curve is so steep it flips quickly, but the core failure is acting against the judgment that avoiding near-term nausea outweighs the immediate taste. The conflict is key.
      *   **Most Common: Overlap.** Akrasia is often *caused* or *intensified* by Hyperbolic Discounting. HD makes the tempting option feel vastly more appealing *right now*, creating the intense pull that overpowers your better judgment, leading to the akratic state (conflict, action against judgment, guilt).

  4.  **Why the Distinction Matters for Solutions (Blockers, Alarms, Bets):**
      *   **Targeting Hyperbolic Discounting (Especially Pure HD):**
          *   **Precommitment Devices Work Best Here:** Website blockers, alarm clocks across the room, betting money with friends ("Ulysses Contracts"). *Why?* They exploit the noon-you's rational perspective. By making the tempting action *impossible* or *extremely costly* at 1 AM, they prevent the preference reversal from leading to the undesirable action. The 1 AM you *would* prefer scrolling, but *can't* because the blocker is there, or the cost (losing money) outweighs the immediate benefit. Success!
          *   **Why They Fail Sometimes:** If the preference shift is strong enough, you'll *find a way around it* (disable the blocker, mute the alarm, pay the bet). Pure HD involves a sincere preference change, so you'll rationally seek to satisfy your *current* preference if possible.
      *   **Targeting Akrasia (Especially When HD is a Factor):**
          *   **Precommitment Can Help, But Can Be Routed:** Blockers and alarms *can* provide a crucial external barrier when your internal willpower fails. They create friction.
          *   **Why They Fail Often:** Akrasia involves *acting against judgment*. If the conflict is strong and the "should" voice is weak or fatigued, the akratic self is highly motivated to *override* the precommitment. "I *know* I shouldn't, but I *really* want to, and disabling this blocker is easy..." The akratic state fuels the workaround.
          *   **Better Strategies for Akrasia:**
              *   **Reduce the "Pain" of the "Should":** Make going to sleep *easier* or *more appealing immediately* (e.g., relaxing pre-sleep ritual, comfy pajamas, audiobook in bed). Reduce the friction of the good choice.
              *   **Increase the Immediate Reward of the "Should":** Use "temptation bundling" – only watch a specific favorite show *while* preparing for bed.
              *   **Strengthen the "Should" Voice:** Mindfulness to notice the urge earlier, visualization of *future* benefits *vividly* (make grogginess feel real *now*), self-compassion to reduce guilt-shame spirals that fuel further avoidance.
              *   **Habit Formation:** Make the good behavior automatic, reducing the need for constant willpower/judgment battles.
              *   **Cognitive Restructuring:** Challenge beliefs that make the "should" feel aversive ("I *must* be productive tomorrow" vs. "Rest is essential fuel").

  5.  **The Rationalist Use of "Akrasia": What It Points At**
      The rationalist focus on akrasia points at a core challenge of *being a reasoning agent embodied in time with conflicting subsystems*. It highlights:
      *   **The Gap Between Knowing and Doing:** Rationality isn't just about correct beliefs; it's about *acting* on them.
      *   **The Fragility of Judgment:** Our "rational" self is easily hijacked by stronger, more immediate impulses (often amplified by HD).
      *   **The Need for Meta-Rationality:** We need strategies *about* how to manage our own flawed decision-making processes. Recognizing akrasia is the first step – it forces us to ask *why* we act against our judgment and design systems (precommitments, habits, environment design, cognitive hacks) to bridge the gap.
      *   **The Conflict is Real:** Akrasia acknowledges the subjective experience of inner turmoil and failure, which pure HD models often abstract away. This experience *is* the data point that something is wrong beyond a simple preference shift.

  **Conclusion & Practical Takeaway:**

  *   **Your 1 AM guilty scrolling is Akrasia (fueled by HD).** Your judgment says "stop," but you act against it.
  *   **Your hypothetical noon-planner/1 AM-no-regrets is Pure Hyperbolic Discounting.** Your sincere preference shifted with proximity.
  *   **Both exist separately, but often overlap,** especially in procrastination.
  *   **Solutions:**
      *   For **HD-driven problems (especially preference shifts)**, **precommitments are your strongest weapon.** Lock Future-You out of the bad choice.
      *   For **Akrasia (acting against judgment)**, precommitments *help* but can be overridden. Combine them with strategies to **make the "should" easier/more rewarding immediately**, **strengthen your resolve in the moment** (mindfulness, vivid future visualization), and **build habits**. Understand the *source* of the conflict (is it just HD, or fear, aversion, exhaustion?).

  **The rationalist value of "akrasia" is highlighting the internal conflict as the core failure mode to be addressed.** Recognizing whether you're experiencing akrasia (conflict) or a pure preference shift (no conflict) *in the moment* is crucial for choosing the right intervention. Your blocker fails when the akratic urge is strong enough to overcome it *despite* knowing it's a bad idea – that's when you need additional akrasia-specific strategies alongside your precommitments.
