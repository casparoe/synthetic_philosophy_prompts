  Okay, the user is writing a piece on moral heroism and has interviewed two ethicists who disagree about supererogation. They want me to referee their debate, analyzing each step of their exchange. 

  First, I need to unpack Ethicist 1's core argument: she separates praiseworthiness from obligation completely. Her stance is that praise is purely about value creation — saving a life is praiseworthy because it's good, full stop. The "optional" label just distinguishes it from duty but doesn't generate the praise. That's elegant, but Ethicist 2 immediately spots a problem: if praise is only about value, why do we intuitively see supererogatory acts as more praiseworthy than obligatory ones? 

  Ethicist 2's counter is sharp — she claims this "extra credit" proves optionality must be doing hidden work. Her unspoken premise is that moral praise has an obligation-shaped hole in it. If something isn't required but gets praised more, maybe it secretly was required? But that feels like a contradiction. I see why the user finds this frustrating; both make logical points but talk past each other.

  When Ethicist 1 pivots to sacrifice as the real differentiator, it initially seems persuasive. Sacrifice explains the kidney case perfectly. But Ethicist 2's reply exposes a flaw: what about heroic failures? Jumping into a frozen lake to save someone and failing isn't praiseworthy in the same way, even with huge sacrifice. And the costless-kindness example backfires — if I return a dropped wallet with zero effort, it's still praiseworthy but involves no sacrifice. So Ethicist 1 can't fully detach praise from value. 

  Now I notice both are missing something structural. Ethicist 2 conflates two types of optionality: "optional" meaning beyond duty versus "optional" meaning discretionary. And neither addresses how social expectations shape what counts as supererogatory — donating a kidney is heroic today but might be routine with future tech. Also, Ethicist 1's sacrifice argument needs scaling: is risking your life for a stranger more praiseworthy if you're a firefighter (duty) versus a bystander? That complicates her thesis. 

  Ultimately, Ethicist 1 wins narrowly because she doesn't deny obligation's role in framing; she just says it doesn't produce praise. But her sacrifice explanation is incomplete without acknowledging that value is necessary even if not sufficient. Ethicist 2's "unstable category" claim fails because she can't explain why we praise some optional acts but not others (e.g., donating kidney vs. not donating — one is supererogatory, the other isn't blameworthy). 

  The user might need this tension for their piece — moral heroism thrives in this exact gray area between duty and sacrifice. I should emphasize that unresolved debates like this are why supererogation stays philosophically rich.
answer: |-
  Let's break down the debate step-by-step, identifying where each ethicist is strong, weak, or missing key elements. The core tension lies in whether "optionality" (non-obligation) is a *source* of praiseworthiness or merely a *marker* distinguishing it from duty.

  ### Step 1: Ethicist 1's Opening Argument
  *   **Claim:** Supererogation is coherent. Praise is grounded solely in the **good produced** (saving a life). Obligation is irrelevant to praiseworthiness; it only categorizes the act (supererogatory vs. obligatory).
  *   **Strength:** Cleanly separates the grounds of praise (production of good) from the deontic status (obligatory/optional). Avoids contradictions by making praise solely consequentialist.
  *   **Weakness:** Doesn't yet explain why we intuitively perceive supererogatory acts as *more* praiseworthy than obligatory ones producing the same good.
  *   **Verdict:** **Strong start.** Her core point – that producing significant good is inherently praiseworthy regardless of obligation – is defensible and avoids immediate contradiction.

  ### Step 2: Ethicist 2's Pushback
  *   **Claim:** If praise *only* tracks value, optionality becomes irrelevant, making "supererogatory" meaningless. Our actual practice shows optionality *does* matter: we praise the kidney donor *more* than someone obligated to donate. Therefore, optionality must contribute *explanatorily* to the extra praise, implying the act isn't genuinely optional ("unstable category").
  *   **Strength:** Highlights a genuine puzzle in moral phenomenology (the "extra credit" intuition). Exposes a potential weakness in Ethicist 1's purely value-based praise: it doesn't account for the difference in praise-weight.
  *   **Weakness:** Makes a false dichotomy. Assumes that if optionality explains the "extra" praise, it *must* mean the act was obligatory. Ignores other potential explanations for the heightened praise (like sacrifice, as Ethicist 1 later offers). Conflates contributing to the *intensity* of praise with negating optionality.
  *   **Verdict:** **Points out a valid problem** (explaining the "more praiseworthy" intuition) but **draws a flawed conclusion** (optionality implying hidden obligation). Her "unstable category" claim is too strong.

  ### Step 3: Ethicist 1's Response (Sacrifice)
  *   **Claim:** The "more praiseworthy" intuition is explained by **sacrifice/cost** (losing a kidney), not by optionality or obligation. Sacrifice is admirable and grounds praise. Costless kindness is also praiseworthy based solely on the good produced/kindness shown.
  *   **Strength:** Provides a plausible alternative explanation for the heightened praise in costly supererogatory acts (like kidney donation) that doesn't invoke obligation. Reinforces the core separation: praiseworthiness comes from good/effort/sacrifice, not requirement.
  *   **Weakness:** Doesn't fully address Ethicist 2's challenge regarding the *necessity* of producing good for praise. What about costly acts that *don't* produce good (heroic failures)? Her costless kindness example partially concedes Ethicist 2's point that value *is* central.
  *   **Verdict:** **Strong counter.** Sacrifice is a compelling, non-obligation-based explanation for the extra praise in many supererogatory acts. It directly challenges Ethicist 2's claim that optionality *must* imply obligation.

  ### Step 4: Ethicist 2's Rebuttal (Cost & Value)
  *   **Claim:** Cost alone isn't sufficient for praise (costly failures aren't praiseworthy). The costless kindness case shows Ethicist 1 is smuggling value back in as essential for praise. Therefore, the "extra credit" specifically for *optionality* remains unexplained: it can't come from value alone (or optionality is irrelevant) or cost alone (cost without value isn't praised). Optionality must be doing unique work, implying obligation.
  *   **Strength:** Correctly identifies that **both value production *and* cost/sacrifice are likely necessary conditions** for praise in the paradigm cases (like kidney donation). Effectively argues that Ethicist 1's sacrifice explanation still relies on value. Highlights that neither value nor cost alone explains the "extra credit" *for optionality*.
  *   **Weakness:** Persists with the flawed assumption that the "extra credit" *must* be *caused by* optionality itself, rather than being a *byproduct* of the *absence of requirement* combined with significant cost/good. Still implies that explaining the extra credit necessitates obligation, which is a non sequitur. Fails to engage with the idea that the *contrast* with obligation might explain the heightened perception, not optionality itself being a source.
  *   **Verdict:** **Effectively critiques Ethicist 1's sacrifice argument** by showing value is indispensable, but **falters on her core conclusion.** She identifies a gap (explaining the specific "optionality bonus") but wrongly insists the only way to fill it is with hidden obligation.

  ## Overall Verdict & What's Missing

  *   **Who Wins?** **Ethicist 1 has the stronger overall position.** She successfully defends the coherence of supererogation by grounding praiseworthiness primarily in the production of good/sacrifice/effort, separating it conceptually from obligation. She provides a plausible explanation (sacrifice) for the "extra praise" intuition without collapsing supererogation into obligation. Ethicist 2 effectively points out a phenomenological puzzle and weaknesses in Ethicist 1's initial formulations but fails to prove the category is unstable or that hidden obligation is the only solution.
  *   **What Ethicist 1 Might be Missing:**
      *   **The Necessity of Value:** Ethicist 2 is correct that sacrifice *alone* isn't sufficient for praise. Heroic failures are often seen as *admirable for effort/courage* but not *praiseworthy in the full moral sense* if no good was achieved. Value production *is* a core component.
      *   **The Role of Expectation/Requirement:** She could more explicitly acknowledge that the *absence of requirement* acts as a frame or background condition. It allows the full focus to be on the agent's *positive choice* and sacrifice, amplifying our admiration *compared* to someone who simply did their duty. The praise isn't *for* optionality; optionality creates the *context* where the sacrifice/choice shines brighter.
      *   **Scalability:** How does her view handle less dramatic supererogation (e.g., significant but not life-threatening donations, major volunteering)? Sacrifice is often key, but perhaps not always the *only* factor distinguishing praise levels from obligatory acts producing similar good.

  *   **What Ethicist 2 Might be Missing:**
      *   **Multiple Factors for Praise Intensity:** She fixates on optionality itself as the *source* of extra praise, ignoring that the combination of significant good *plus* significant sacrifice *in the absence of requirement* naturally elicits stronger admiration than just meeting a requirement. The extra praise is for the *character* revealed (generosity, courage beyond the call), not for optionality per se.
      *   **The Non-Obligatory Nature of Sacrifice:** Sacrificing a kidney *isn't* obligatory. Her hidden obligation claim struggles: *what* is the hidden obligation? To maximize good? But failing that isn't blameworthy like failing a genuine duty. To be heroic? That's circular.
      *   **The Phenomenology of Duty vs. Choice:** She underestimates the psychological difference. Performing a painful duty can be admirable (showing fortitude, integrity), but *choosing* a painful act for others' good when you absolutely didn't have to feels like a different *kind* of admirable – one of exceptional generosity or love. This distinction doesn't require the supererogatory act to secretly be obligatory.

  ## Synthesis: What Both Might Be Missing

  1.  **The Framing Effect of Obligation:** The key might be that **obligation sets a baseline expectation.** Meeting it is minimally praiseworthy (if at all - often just "not blameworthy"). *Exceeding* that baseline, especially at significant cost, is what triggers heightened praise. The "extra credit" comes from exceeding expectations, not from the mere fact that the act wasn't required *in isolation*. Optionality is necessary *for* the act to count as exceeding the baseline, but it's the *exceeding* (the good+sacrifice beyond duty) that's praiseworthy, not the optionality itself.
  2.  **Two Senses of "Optional":** Ethicist 2 risks conflating "optional" meaning *beyond duty* (supererogatory) with "optional" meaning *discretionary* or *morally neutral*. Supererogatory acts are optional in the first sense, but they are *not* morally neutral; they are positively good and admirable. The category isn't unstable; it occupies a space *above* duty but not *at* duty.
  3.  **Social/Relational Dimension:** Supererogation often strengthens social bonds or embodies ideals precisely because it's *gratuitous* – given freely beyond what is owed. This relational aspect contributes to its special praiseworthiness and is tied to its non-obligatory nature *without* making it obligatory.
  4.  **Context Dependence:** What counts as supererogatory can shift. Donating a kidney *now* is supererogatory; if safe synthetic organs became ubiquitous and cheap, refusing to donate might become blameworthy. This highlights that obligation sets the context, but the praiseworthiness of the act itself stems from the good done and the effort/sacrifice involved *relative to that context*.

  **Conclusion:** Supererogation is a coherent category. Ethicist 1 is largely correct: praiseworthiness is grounded in the good produced and the effort/sacrifice involved. Obligation defines the baseline; acts that significantly exceed this baseline, especially through sacrifice, are supererogatory and elicit heightened praise *because* they reveal exceptional virtue beyond what is demanded. Ethicist 2 correctly insists that both value and cost matter and identifies the puzzle of "extra praise," but she errs in concluding this necessitates collapsing supererogation into obligation. The "extra" arises from the *contrast* with the obligatory baseline and the manifestation of extraordinary virtue, not from optionality being a mysterious extra source of praise or a sign of hidden duty.
