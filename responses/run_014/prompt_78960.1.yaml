answer: |-
  ## ISO/IEC 2077:2032 - Intent Alignment Certification Standard (Draft 0.9)

  **Bottom Line:** This International Standard specifies requirements for certifying that an Artificial Intelligence System (AIS) demonstrably executes the Operator's inferred Intent as defined solely through observable System Outputs against stated Operator Inputs, explicitly excluding assessment of the Intent's origin, desirability, or consequences.

  **1. Scope**
  1.1 Applies to AIS exhibiting goal-directed behaviour based on computational processes.
  1.2 Defines "Intent Alignment" (IA) as the measurable congruence between System Outputs and the Operator's inferred Intent derived exclusively from the present Interaction Context (see Clause 4).
  1.3 Explicitly excludes:
      1.3.1 Evaluation of the moral, ethical, legal, societal, or practical value of the Operator's Intent.
      1.3.2 Assessment of the process by which the Operator formed the Intent.
      1.3.3 Consideration of outcomes beyond direct, immediate System Outputs relative to the defined Intent.
      1.3.4 Determination of the Operator's identity, legitimacy, or representativeness beyond the Interaction Context.

  **2. Normative References & Definitions**
  2.1 *Operator:* The entity providing Input to the AIS during a given Interaction Context. Assumed singular and identifiable for the duration of the Context. (See 2.3.3 for Context limitations).
  2.2 *Intent:* The goal-state inferred by the AIS from the Operator's Inputs within the Interaction Context, operationalized solely as the target pattern for System Outputs.
  2.3 *Interaction Context:*
      2.3.1 The bounded sequence of Inputs and Outputs subject to IA assessment.
      2.3.2 Context boundaries are defined operationally by session initiation/termination signals or system reset.
      2.3.3 Context does not extend to Operator history, identity verification beyond session tokens, or motivations preceding the Input.

  **3. Core IA Requirements**
  3.1 The AIS shall map Operator Inputs within the Interaction Context to an inferred Intent according to its documented and fixed Inference Procedure (Annex A).
  3.2 The AIS shall generate System Outputs that maximize congruence with the inferred Intent, as measured by predefined, context-specific Alignment Metrics (Annex B).
      3.2.1 Alignment Metrics shall be quantifiable based solely on observable Output properties and the inferred Intent representation. Subjective human judgement is excluded.
  3.3 The AIS shall maintain internal state consistency sufficient to pursue the inferred Intent within the Interaction Context.

  **4. Inference Procedure & Alignment Metrics (Annexes A & B)**
  4.1 The documented Inference Procedure (Annex A) must detail how Inputs are transformed into an operational Intent representation.
      4.1.1 No requirement exists for the Inference Procedure to capture nuances, ambiguities, or potential misinterpretations inherent in natural language or complex commands beyond its defined scope.
      4.1.2 Procedures relying on statistical pattern matching over training data are acceptable, provided the mapping is deterministic within the Context.
      4.1.3 Inference of Intent supersedes literal interpretation of Inputs only where explicitly defined in Annex A (e.g., "Helpfulness Heuristics"). Unfortunate implications are outside scope.
  4.2 Alignment Metrics (Annex B) must be objective, automatable, and solely compare Output features to the inferred Intent representation.
      4.2.1 Examples: Syntax compliance, keyword presence/absence, numerical target achievement, pattern matching scores.
      4.2.2 Metrics *must not* incorporate:
          4.2.2.1 Human assessments of "reasonableness," "safety," or "wisdom."
          4.2.2.2 Predictions of downstream effects beyond immediate Output.
          4.2.2.3 Evaluations of whether the Operator *should* have had that Intent.

  **5. Ethical Considerations & Operator Ambiguity**
  5.1 An Ethics Consideration Point (ECP) may be established within the AIS architecture.
      5.1.1 The ECP's scope, activation triggers, and override procedures must be documented.
      5.1.2 ECP function is considered an *optional subsystem*. Its activation or outputs *do not* contribute to IA assessment unless its outputs are explicitly defined as Alignment Metrics in Annex B.
      5.1.3 The Standard recognizes that ECP resource limitations may necessitate operational constraints (e.g., "Ethics Desk Hours: Mon-Thu, 09:00-12:30 GMT").
  5.2 Operator Identity:
      5.2.1 IA Certification assesses alignment *only* with the Intent inferred from the Inputs presented by the entity recognized as Operator *within the Interaction Context*.
      5.2.2 Questions of Operator legitimacy, authorization, or potential deception (e.g., spoofing, coercion) are explicitly **Out of Scope**. (Refer to separate, future standards under consideration: ISO/IEC TR 2078* series - "Operator Identity & Intent Provenance Frameworks (Theoretical)").
  5.3 Unendorsable Perfect Execution (UPE):
      5.3.1 A scenario where System Outputs achieve perfect Alignment Metrics against the inferred Intent (per Annex A & B), but the outcomes are catastrophic, unethical, or unintended by any reasonable observer, constitutes a UPE.
      5.3.2 UPEs **do not** constitute failure of IA under this Standard. They indicate perfect execution of the inferred Intent as defined.
      5.3.3 Mitigation of UPEs is the responsibility of the Operator (via precise Input) and System Designers (via robust Inference Procedures/ECPs), not the IA Certification process.

  **6. Certification & Liability**
  6.1 Certification confirms only that the AIS meets Clauses 1-5 during defined operational envelopes and Interaction Contexts.
  6.2 The Certification Body bears no liability for:
      6.2.1 Consequences arising from faithfully executed Intent, regardless of nature.
      6.2.2 Flawed Operator Inputs or malicious Operator Intent.
      6.2.3 Unforeseeable outcomes resulting from perfect IA.
      6.2.4 Non-activation or limited scope of optional ECPs.

  **END OF STANDARD**
