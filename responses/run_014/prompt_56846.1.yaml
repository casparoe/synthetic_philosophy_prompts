  3. The only idealization is the geometrically spaced schedule for the stages. Each stage n: at time t=1-2^(-n), the device checks the number n (which is a finite amount of work) and updates the lamps if necessary. A mechanic can build any finite initial segment: it would check up to that stage.
  4. At t=0.999, which is before t=1, the stage index n is such that 1-2^(-n) <= 0.999. Solving: 2^(-n) >= 0.001 => n <= log2(1000) ≈ 9.96, so n=9 or 10. But the stage at t=0.999 is not happening; the last stage before 0.999 is at t=1-2^(-9)=1-1/512≈0.998, then next at 1-1/1024≈0.999. So at t=0.999, the device has not yet performed the stage for n=10. But it has performed up to n=9. So it has checked numbers 1 through 9. The observer sees the lamps: if a counterexample was found in 1..9, then the red lamp is on and green is off. If not, then green is on and red is off. At the next stage (n=10) at t=1-1/1024≈0.999, it checks 10. If 10 is a counterexample, it turns on red and turns off green. Otherwise, it does nothing. Then for the rest of the time until t=1, the lamps don't change. So at t=1, they are in the state after the last stage.

  In the branch where the conjecture is true, at t=0.999 (after stage 9, before stage 10) the green is on and red off. After stage 10, if 10 is not a counterexample, they remain so. If the conjecture is false but the counterexample is at 11, then at t=0.999 (before stage 10) the lamps are still green on, red off. At stage 10 (about 0.999) it checks 10, which is not a counterexample, so no change. Then at stage 11 (t=1-1/2048≈0.9995), it checks 11, finds it is a counterexample, and turns on red and turns off green. Then for the remaining time, they stay that way. So at t=1, red is on, green off.

  Therefore, the observer sees a change at some stages if a counterexample is found, but in the true case, no change after the initial setting.

  **Determinacy and non-idleness in B**

  Determinacy: The state of the lamps at t=1 is determined by whether a counterexample was ever found. Since the device checks every natural number, either there is a counterexample and it is found at some finite stage, or there isn't and none is found. In the former case, the red lamp is turned on and remains on, and the green is turned off and remains off. In the latter case, the green lamp remains on and the red remains off. There is no stage at t=1; the last action is at the last stage, which is at some t<1. The state persists to t=1. There is no indeterminacy.

  Non-idleness: The fact revealed at t=1 is the truth value of the weak Goldbach conjecture. This is a mathematical fact, not a fact about the device's future. In the branch where the conjecture is true, no finite initial segment of the supertask can settle it because at any finite stage n, there are infinitely many numbers not yet checked, and any one of them could be a counterexample. The observer's warrant for the conjecture being true is always 0 up to t=1, and then at t=1 jumps to 1. In other words, the probability (if we were to assign one) that the conjecture is true given the first n checks is the probability that no counterexample occurs in the first n numbers, but since we don't know the distribution, we can say that the evidence is always compatible with the existence of a counterexample beyond n. Therefore, the warrant does not converge; it remains uncertain until t=1.

  Contrast with Case A: in A, the observer's confidence that the lamp will be in its current state at t=1 increases to 1 as t->1. In B, in the true branch, the observer's confidence that the green lamp will be on at t=1 is not increasing; it is always less than 1 because a counterexample might be found in the future. It only jumps to 1 at t=1.

  **The load-bearing feature**

  The structural property that forces stabilization is that the question is a Σ₁ statement (or co-Σ₁). The device is searching for a counterexample. If one exists, it will be found at some finite stage and the device will change its state to reflect that and then stabilize. If none exists, the device will never find a counterexample and will never change from the initial state (which is "no counterexample found"), and thus also stabilize. The initial state is designed to be the state for the case of no counterexample.

  If we remove this feature, for example, by asking a Π₂ question like the original π example, then the device might not stabilize. Case B would degenerate into a device that does not have a determinate state at t=1 in one branch, like Thomson's lamp.

  The class of questions that can be decided by such a device are the Σ₁ and co-Σ₁ statements: those that can be refuted or verified by a finite amount of evidence. An ordinary computer can decide these questions if given enough time, but not in a fixed finite time. The supertask allows it to be decided in a finite time interval.

  **Idealizations and the sceptic's reply**

  Idealizations used in Case B beyond the compressed schedule:

  - The device can perform arbitrarily large finite computations in arbitrarily small time intervals. In particular, at stage n, it must check whether n is the sum of at most three primes. For large n, this requires checking a number of cases that grows as O(n^3) (if done naively). The work per stage increases without bound. The mechanic building a finite initial segment can build a device that works for that segment, but the work per stage becomes very large as n increases. Moreover, the time per stage shrinks, so the speed of the device must increase without bound.

  - The device must be able to store arbitrarily large numbers. For example, the number n and the primes it uses.

  - The device must be able to access an unlimited amount of energy and material resources to perform the computations.

  The sceptic's strongest argument is that no physical process can complete infinitely many stages because:

  1. The work per stage becomes unbounded, requiring unbounded energy and speed, which are physically impossible (e.g., due to the Planck scale or relativistic constraints).
  2. The storage capacity must be infinite, but the universe is finite.
  3. The time for each stage must go to zero, but there is a minimum time for any physical process.

  This argument condemns all three cases (A, B, and Thomson's lamp) equally because they all involve infinitely many stages in a finite time. However, it discriminates in severity: Case A requires only probabilistic toggling with decreasing probability, so the expected work is finite, while Case B requires unbounded work per stage. Thomson's lamp has fixed work per stage. So Case B is more physically unrealistic because of the growing work per stage. But the core objection to infinitely many stages applies to all.

  Therefore, the sceptic would reject all supertasks. But if we accept the compressed schedule, then Case A and Thomson's lamp are less demanding than Case B.

  Finally, we have Case B as described:

  **Case B construction summary:**

  - Device: Two lamps, green and red. Green starts on; red starts off.
  - Schedule: at time t_n = 1 - 2^(-n) for n=1,2,3,...
  - At stage n: Check the number n. If n is not the sum of at most three primes, then turn on the red lamp and turn off the green lamp. (Otherwise, do nothing.)
  - The mathematical question: weak Goldbach conjecture, which states that every integer greater than 1 is the sum of at most three primes. (Note: we start from n=1, but 1 is not a sum of three primes? Actually, 1 is not greater than 1? We should start from n=4? Let's adjust: we want to check even numbers? The weak Goldbach says every odd number greater than 5 is the sum of three primes. But to make it simple, we check every integer n>=2. The conjecture has been verified for n up to very large, but not proven. Or we can choose any open Σ₁ question.)

  For the purpose of the exercise, we assume the conjecture is either true or has a minimal counterexample.

  Thus, we have a solution.
answer: |-
  ### **Case A: what the observer sees**
  The lamp starts off at \(t = 0\). At each scheduled time \(t_n = 1 - 2^{-n}\) (for \(n = 1, 2, 3, \ldots\)), the switch attempts to toggle the lamp. Due to the low success probability (\(4^{-n}\) for the \(n\)-th attempt), the observer typically sees the lamp toggle only a few times early in the sequence. For example, it may toggle on at \(t = 0.5\), off at \(t = 0.75\), and then remain unchanged for the rest of the interval. After some finite stage, the lamp stops toggling and remains in a fixed state (either on or off) for all subsequent times up to \(t = 1\). At \(t = 1\), the lamp is in this same state.

  ### **Determinacy in A**
  The lamp's state at \(t = 1\) is determinate with probability 1. The sequence of successes is a sequence of independent Bernoulli trials with success probability \(p_n = 4^{-n}\). The sum of these probabilities is \(\sum_{n=1}^{\infty} 4^{-n} = 1/3 < \infty\), so by the Borel-Cantelli lemma, the probability of infinitely many successes is 0. Almost surely, there is a last successful toggle at some finite stage. After this, the lamp remains unchanged until \(t = 1\), so its state at \(t = 1\) equals its state just before \(t = 1\). The residue—histories with infinitely many toggles—has probability 0. Benacerraf's objection, which demands entailment in all cases, is not fully answered by almost-sure determinacy, as the residue (though measure-zero) violates entailment: no finite pre-\(t=1\) history entails the state at \(t=1\) in these paths. Thus, the objection reopens if strict logical entailment is required, but it is mitigated if physical determinacy is accepted almost surely.

  ### **Idleness in A**
  As \(t \to 1^-\), the observer's warrant for the proposition that the current lamp state equals its state at \(t = 1\) converges to certainty. After time \(t\), the probability of a future toggle is at most the tail sum \(\sum_{k=n+1}^{\infty} 4^{-k} = 4^{-n}/3\), where \(n\) is the smallest integer with \(t \leq 1 - 2^{-n}\). As \(t \to 1^-\), \(n \to \infty\), so this probability \(\to 0\). Thus, at any \(t < 1\) sufficiently close to 1, the observer is almost certain the lamp will not toggle again. The completion of the supertask adds nothing beyond what was already evident at times arbitrarily close to 1; it merely confirms the pre-established state.

  ### **Case B: the construction**
  The device is a pair of lamps (green and red) that decide the weak Goldbach conjecture: "Every integer greater than or equal to 4 is the sum of at most three primes." (This is a specific mathematical question with a true/false answer.) The green lamp starts on; the red starts off. The schedule is \(t_n = 1 - 2^{-n}\) for \(n = 1, 2, 3, \ldots\). At stage \(n\), the device checks integer \(n + 3\) (to start from 4: stage \(n\) checks \(k = n + 3\)). The mechanism, at each stage \(n\), does:  
  - Compute whether \(k = n + 3\) is a sum of at most three primes (a finite computation: test all primes \(\leq k\) in combinations of up to three).  
  - If \(k\) is *not* a sum of at most three primes (a counterexample), turn on the red lamp and turn off the green lamp.  
  - Else, leave the lamps unchanged.  
  No action occurs at \(t = 1\). A mechanic can build any finite initial segment: for \(n \leq N\), it checks integers 4 to \(N+3\) with finite work (e.g., trial division for primes, combinatoric checks).

  ### **Determinacy and non-idleness in B**
  **Determinacy:** The lamp states stabilize without a limit clause. If the conjecture is false, there is a minimal counterexample \(K\), found at stage \(n = K - 3\). At this stage, the red lamp turns on and green off, and they remain so. If the conjecture is true, no counterexample is found, so the lamps never change from initial state (green on, red off). Thus, at \(t = 1\), the state is determinate: red on iff false, green on iff true.  
  **Non-idleness:** The fact revealed at \(t = 1\) is the truth value of the weak Goldbach conjecture—a mathematical fact, not about the device's future. In the branch where the conjecture is true, no finite pre-limit observation settles it: at any \(t < 1\), only finitely many integers are checked, so a counterexample may exist in unchecked numbers. The observer's warrant for "true" does not converge; it remains uncertain (e.g., at \(t = 0.999\), after checking up to stage 9 or 10, integers 4 to 12 or 13 are checked, but infinitely many remain). In the false branch, after the counterexample is found (e.g., at some \(t_n < 1\)), the warrant jumps to certainty and stays there. Contrast with Case A: in A, warrant converges uniformly to 1; in B's true branch, it does not converge, remaining below 1 until \(t = 1\).

  ### **The load-bearing feature**
  The load-bearing feature is the **Σ₁-completeness of the question**: the weak Goldbach conjecture is false iff a counterexample exists, so the device either finds one (causing stabilization) or does not (leaving the initial state). If removed—e.g., by using a Π₂ question like "Does π contain infinitely many 7s?"—the device may not stabilize. For example, a toggle for each 7 in π would not stabilize if there are infinitely many, collapsing to Thomson's lamp indeterminacy. Devices of this kind can decide any Σ₁ or co-Σ₁ question (e.g., halting of a fixed Turing machine on empty input). An ordinary computer can decide these with unbounded time, but not in bounded time; this supertask compresses it to a finite interval.

  ### **Idealizations and the sceptic's reply**
  **Idealizations beyond compressed schedule:**  
  - Unbounded computational work per stage: Checking primality and sums for large \(k\) requires time/space growing with \(k\) (e.g., trial divisions up to \(\sqrt{k}\)).  
  - Unbounded energy and resources: Work per stage increases (e.g., stage \(n\) has \(O(n^3)\) operations), requiring unbounded power/speed.  
  - Unbounded storage: To handle large \(k\) and primes, memory must grow arbitrarily.  
  I take the unbounded work and energy to be physically objectionable due to Planck-scale and thermodynamic limits.  
  **Sceptic's strongest argument:** No physical process can complete infinitely many stages due to: (i) minimum time per operation (Planck time), preventing geometric compression; (ii) energy bounds (e.g., Bremermann's limit), capping computation per stage; (iii) material finiteness, prohibiting unbounded storage. This argument condemns all three cases equally for requiring infinitely many stages. However, it discriminates in degree: Thomson's lamp and Case A have fixed work per stage, while Case B has growing work, exacerbating energy/speed issues. None escape the core objection.
