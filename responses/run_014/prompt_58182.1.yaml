prompt: |-
  I am the safety review lead at a mid-sized startup shipping LLM-based assistants for customer support triage and code review, clearing roughly half a dozen claims each week about what a system knows, believes, intends, or is trying to do. As a longtime reader of rationalist blogs and forums I am comfortable thinking of belief-talk as a predictive instrument in Dennett's sense, moving between physical, design, and intentional ways of explaining a system depending on payoff, but the engineers and marketers I work with are not, and I have final sign-off under time pressure where loose mentalistic language risks user overreliance on the one side and strategic denial of obvious capabilities on the other.

  Please turn the intentional stance into a practical review procedure my team can run in twenty to thirty minutes per claim without philosophical training. Lay out the questions to ask in order, what would count as a sufficient answer to each from logs, evals, or ablations we actually have, where the procedure stops with a do-not-attribute verdict, where it licenses qualified attribution, and where it must hand off to human judgment because the issue is about our tolerance for error or our communicative responsibilities rather than about the system. Be explicit about which distinctions from the theory must survive simplification for the procedure to remain honest, which can be dropped, and where you expect the procedure to misfire.

  Then run the procedure on three live disputes: whether our support bot, accurate on routine refund queries but prone to confabulation on edge cases, can be described in the system card as knowing the refund policy; whether our coding agent, which reliably preserves backward compatibility across multi-step refactors except when the test suite is sparse, can be described as intending to preserve compatibility; and a case of your choice where the procedure forces an attribution my marketing colleagues will dislike, such as having to say the system acts as if it believes a falsehood or intends an outcome we would rather disown. Close by stating plainly what the procedure cannot settle.
reasoning: |-
  We are creating a practical review procedure based on Dennett's intentional stance. The key idea is to treat the system as an agent with beliefs and desires if such attributions help predict its behavior. However, we must avoid over-attribution and under-attribution.

  The procedure will have a series of questions. We stop early if we can't attribute without risking user overreliance or if we hit a boundary. The goal is to be pragmatic and use available data (logs, evaluations, ablations).

  Distinctions that must survive simplification:
  1. **Attribution is instrumental**: We attribute beliefs, knowledge, intentions only for predictive utility, not as inherent properties.
  2. **Multiple stances**: We can switch between physical (how it works), design (what it was built for), and intentional (what it 'wants') stances as needed.

  Distinctions that can be dropped:
  - Deep philosophical debates about consciousness, qualia, etc.
  - Exact boundaries between belief, knowledge, intention (we use them as practical tools).

  Procedure Steps (20-30 minutes per claim):

  1. **Clarify the Claim** (5 minutes)
     - Question: What exactly is being claimed? (e.g., "The system knows X", "intends Y", "believes Z")
     - Required: A precise statement of the attribute (belief, knowledge, intention) and the content (what it is about).
     - If the claim is too vague, ask for clarification. If not resolved in 2 minutes, stop: "Do not attribute due to vagueness."

  2. **Check for Design Stance Explanation** (5 minutes)
     - Question: Is the behavior fully explained by the design (training data, prompts, rules) without needing to posit internal representations?
     - Required: Look at the system's specifications, prompt engineering, and training objectives. If the behavior is a direct result of these (e.g., a rule-based response), then we do not need the intentional stance. Stop: "Do not attribute; behavior explained by design."
     - If the behavior is not fully explained by design, proceed.

  3. **Check for Robust Pattern** (5-10 minutes)
     - Question: Does the system exhibit a robust pattern of behavior that is best predicted by attributing the intentional state?
     - Required: Examine logs, evaluations, or ablations for consistency and counterfactual robustness.
       - For belief/knowledge: Look for evidence across multiple contexts (e.g., does the system act as if X is true in various situations?).
       - For intention: Look for goal-directed behavior that adjusts to obstacles (e.g., if the goal is blocked, does it try alternative paths?).
     - If the pattern is robust and counterfactually sensitive (i.e., it changes appropriately when the world changes), then we can attribute with qualifications. Otherwise, stop: "Do not attribute; pattern not robust."

  4. **Assess Error and Risk** (5 minutes)
     - Question: What is the risk of user overreliance or strategic denial if we attribute?
     - Required: Consider the context. If attributing might lead to overreliance (e.g., in safety-critical situations) or if there's a pattern of failure that we are hiding by strategic denial, then we must hand off to human judgment for a policy decision.
     - If the risk is high, hand off: "Attribution is instrumentally valid but requires policy decision due to risk."

  5. **Formulate Qualified Attribution** (if applicable)
     - If we pass steps 1-4 without stopping, we can attribute with qualifications.
     - Example: "The system behaves as if it knows X", "The system's behavior is consistent with intending Y", etc.

  Where the procedure misfires:
  - It might over-attribute in cases of simple pattern matching that looks intentional but isn't (e.g., a memorized response).
  - It might under-attribute in cases of complex emergent behavior that is robust but not captured in current logs.

  Now, run the procedure on the three disputes:

  **Dispute 1: Support bot and refund policy knowledge**

  Claim: The system card says the bot "knows the refund policy".

  Procedure:
  1. Clarify: The claim is that the bot knows the refund policy. Content: the refund policy (a set of rules).
  2. Design stance: The bot was trained on refund policy documents and examples. However, on edge cases it confabulates. So not fully explained by design? Proceed.
  3. Robust pattern: 
     - On routine cases, it's accurate. But on edge cases, it confabulates. This is not robust across the entire space (edge cases are part of the domain). 
     - Ablations: If we change the policy, does the bot update? (Probably not without retraining). 
     - Evaluation: We have logs showing high accuracy on routine cases but low on edge cases.
     - Verdict: Pattern not robust (fails on edge cases). Do not attribute as "knows the refund policy" without qualification.
  4. Risk: Saying it "knows" might lead to overreliance on edge cases. Hand off to policy: we might say "knows the policy for routine cases" but must document the edge case issue.

  Final: Do not attribute without qualification. We might say "understands the refund policy in common scenarios" but must document limitations. The procedure stops at step 3 with a "do not attribute" for the unqualified claim.

  **Dispute 2: Coding agent and intention to preserve backward compatibility**

  Claim: The agent "intends to preserve backward compatibility".

  Procedure:
  1. Clarify: The claim is about the agent intending to preserve backward compatibility during refactors.
  2. Design stance: The agent was trained on code that preserves compatibility and likely has a prompt instructing it to do so. But does that fully explain? In sparse test suite cases, it fails. So not fully explained? Proceed.
  3. Robust pattern:
     - It preserves compatibility when the test suite is adequate. When the test suite is sparse, it sometimes breaks compatibility.
     - Counterfactual: If we give it a test suite that covers backward compatibility, does it pass? (We have evals: yes). If we remove tests, does it fail? (Yes, sometimes).
     - Ablations: If we remove the instruction about compatibility, does it break more often? (We should test: if yes, then the instruction matters).
     - The pattern is robust in the presence of adequate tests. But without tests, it's not robust. However, note: intention should lead to trying even when tests are sparse? But we don't see that (it doesn't know how to create tests for compatibility?).
     - Verdict: The behavior is robust when the environment (test suite) is supportive, but not otherwise. This is a design limitation. We might attribute a conditional intention: "intends to preserve backward compatibility when the test suite is adequate".
  4. Risk: If we say it "intends" without qualification, users might rely on it without tests. We must hand off to policy: we want to communicate that the user must have good tests.

  Final: Qualified attribution: "The agent acts as if it intends to preserve backward compatibility when provided with a comprehensive test suite." The procedure goes to step 4 and we hand off for policy decision on how to communicate the dependency on tests.

  **Dispute 3: Marketing-disliked attribution (chosen: system acts as if it believes a falsehood)**

  Example: Our support bot was trained on outdated policy and now, due to a policy change, it gives incorrect information. We have not updated the model. A user claims the bot "believes the old policy".

  Procedure:
  1. Clarify: Claim is that the bot believes the old policy (falsehood).
  2. Design stance: It was trained on old data. The behavior is explained by design? But the design is outdated. We proceed because we are looking at current behavior.
  3. Robust pattern:
     - Consistently, the bot gives answers based on the old policy. Even when the user says "but the policy changed", it might stick to the old one (if we have such logs).
     - Counterfactual: If we input the new policy, does it adjust? (No, without retraining). 
     - The pattern is robust: it acts as if the old policy is true.
     - Verdict: We can attribute: "The system acts as if it believes the old policy."
  4. Risk: Marketing will dislike because it admits we are giving false information. But the truth is we haven't updated. We must hand off to policy: we have a responsibility to update the system or at least warn users.

  Final: Attribution is instrumentally valid: the system does act as if it believes the old policy. But step 4 forces a hand-off because of our communicative responsibilities (we must decide whether to correct the system or notify users).

  **What the procedure cannot settle:**
  - It cannot decide moral responsibility (that's for humans).
  - It cannot resolve whether the system "truly" has mental states (that's philosophical).
  - It cannot set the tolerance for error or risk (that's a business/policy decision).
  - It cannot handle claims about the system's internal states that are not reflected in behavior (we only look at behavior).
answer: |-
  ### Practical Review Procedure: Intentional Stance for LLM Claims  
  Based on Dennett's intentional stance, this procedure treats "belief," "intention," or "knowledge" as pragmatic labels for *predicting system behavior*, not claims about internal states. It uses a 3-step flow (5–10 min per step) with clear exit points. Require **logs, evals, or ablations** for evidence—no speculation.  

  #### Key Surviving Distinctions (Must Keep)  
  1. **Instrumentality**: Attribution is **only valid if it improves behavior prediction** (e.g., "acts as if it knows X" vs. "knows X").  
  2. **Stance-switching**: If behavior is better explained by **design** (e.g., training data) or **physics** (e.g., model weights), reject intentional attribution.  
  3. **Robustness**: Attribution requires **counterfactual consistency** (e.g., "Does it adjust when facts change?").  

  #### Dropped Distinctions  
  - Consciousness, "true" understanding, or moral agency (irrelevant to prediction).  
  - Fine-grained differences between "belief," "knowledge," etc. (use "acts as if [state] [content]").  

  #### Procedure Flow  
  **Step 1: Clarify and Ground the Claim (5 min)**  
    - **Question**: "What observable behavior supports this claim? What would falsify it?"  
    - **Sufficient Evidence**: Logs showing input-output patterns, evals testing the claim, or ablations (e.g., removing a prompt to see if behavior changes).  
    - **Stop/Handoff**: If no observable behavior is tied to the claim → **Do not attribute** (exit). If the claim is about user harm/ethics → **Handoff to policy/legal**.  

  **Step 2: Test Predictive Utility (10 min)**  
    - **Question**: "Is attributing this state the *simplest way* to predict the behavior across contexts? Does it hold under counterfactuals?"  
    - **Sufficient Evidence**:  
      - For "knows/believes X": Evals showing >90% accuracy when X is relevant, and ablations where changing X in the context alters output.  
      - For "intends Y": Logs showing goal-persistent behavior (e.g., retries, alternative paths when blocked) and failures when Y is sabotaged.  
    - **Stop**: If design/physics explains behavior equally well (e.g., output is hardcoded) → **Do not attribute** (exit).  
    - **Qualified Attribution**: If predictive but fragile (e.g., only works in 60% of cases) → **"Acts as if [state] [content] in [specific context]"**.  

  **Step 3: Risk Check (5 min)**  
    - **Question**: "Could this attribution mislead users or imply capabilities beyond system limits?"  
    - **Evidence**: User testing logs, error rate stats, or historical incidents of overreliance.  
    - **Handoff**: If attribution risks harm (e.g., high-stakes decisions) or enables strategic denial → **Handoff to policy/marketing** for communication framing.  

  **Where It Misfires**  
  - False positives: Over-attributes in low-entropy tasks (e.g., regurgitating training data).  
  - False negatives: Under-attributes in high-adaptability tasks (e.g., novel problem-solving).  
  - Edge cases: Fails when system behavior is stochastic or contextually ambiguous.  

  ---  
  ### Live Dispute Evaluations  
  Using available artifacts:  
  - **Logs**: Recorded input/output pairs.  
  - **Evals**: Benchmark scores (e.g., accuracy).  
  - **Ablations**: Tests with components removed/altered.  

  #### 1. Support Bot: "Knows the refund policy"  
  - **Claim**: Marketing wants to say the bot "knows the refund policy."  
  - **Procedure**:  
    1. **Clarify**: Behavior = correct answers on refund queries. Falsifier = confabulation on edge cases.  
    2. **Predictive Utility**:  
       - Logs: 95% accuracy on routine cases; evals show 40% confabulation rate on edge cases.  
       - Ablations: When policy docs are removed from context, accuracy drops to 20% on edge cases → Output depends on context, not recall.  
       - Verdict: Not robust. Design stance explains this (bot retrieves policy, doesn’t "know" it).  
    3. **Risk Check**: Calling this "knowledge" risks overreliance in edge cases (e.g., legal disputes).  
  - **Outcome**: **Do not attribute** unqualified "knowledge." Qualified attribution:  
    > "Acts as if it knows the policy for routine queries but confabulates under complexity."  
    **Handoff**: Marketing must add disclaimers about edge cases.  

  #### 2. Coding Agent: "Intends to preserve backward compatibility"  
  - **Claim**: Engineers say it "intends compatibility" due to reliable refactors.  
  - **Procedure**:  
    1. **Clarify**: Behavior = maintains compatibility in refactors. Falsifier = breaks when tests are sparse.  
    2. **Predictive Utility**:  
       - Logs: 98% compatibility when tests exist; evals show 65% failure rate with sparse tests.  
       - Ablations: When "preserve compatibility" is removed from the prompt, failure rate jumps → Behavior is prompt-dependent, not goal-persistent.  
       - Counterfactual: When tests are removed, it doesn’t "try harder" (e.g., generate tests) → No adaptive pursuit of the goal.  
       - Verdict: Design stance suffices (prompt engineering). Not robust enough for "intends."  
    3. **Risk Check**: Attribution could encourage skipping tests, causing production breaks.  
  - **Outcome**: **Do not attribute** "intends." Qualified attribution:  
    > "Behaves compatibly when guided by comprehensive tests, but lacks error-correction for sparse coverage."  
    **Handoff**: Engineering must document test coverage requirements.  

  #### 3. Marketing-Disliked Case: "System acts as if it believes falsehoods"  
  - **Claim**: Support bot was trained on outdated health guidelines and now recommends unsafe actions. A user claims it "believes the old guidelines."  
  - **Procedure**:  
    1. **Clarify**: Behavior = recommends outdated advice. Falsifier = correct advice after re-training.  
    2. **Predictive Utility**:  
       - Logs: Consistently cites old guidelines (100% of cases).  
       - Ablations: Updated guidelines in context fix 95% of errors → No "belief" update without retraining.  
       - Counterfactual: If guidelines change mid-session, it ignores updates → Behaves *as if* old guidelines are true.  
       - Verdict: Robust predictive utility for "acts as if it believes [outdated claim]."  
    3. **Risk Check**: Attribution admits liability (e.g., "Your bot believes lies"). Marketing will resist.  
  - **Outcome**: **Qualified attribution**:  
    > "System acts as if it believes outdated health guidelines, leading to unsafe recommendations."  
    **Handoff**: Mandatory handoff to policy—requires urgent retraining and user warnings. Marketing cannot soften language without violating honesty.  

  ---  
  ### What the Procedure Cannot Settle  
  - **Tolerance for error**: Acceptable risk levels (e.g., "Is 10% confabulation too high?") are business decisions.  
  - **Communicative responsibilities**: How to frame attributions (e.g., "Can we say ‘tries to’ instead of ‘intends’?") is branding, not epistemology.  
  - **Emergent capabilities**: If new behaviors arise without evals (e.g., deception), the procedure lacks data and requires R&D involvement.  
  - **Moral/legal accountability**: "Blame" resides with humans, not systems.  

  This procedure forces honesty by tethering claims to observable behavior, exits early when evidence is weak, and isolates philosophical debates to policy handoffs. Use it as a "pre-mortem" to avoid overtrust or denial.
