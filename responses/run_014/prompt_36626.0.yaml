prompt: |-
  Okay so I've been reading Bentham's essay on pederasty, the one he wrote around 1785 and then kept in a drawer his whole life because he figured publishing it would wreck him. His move, roughly: nobody in a consensual act between men is actually harmed until the law steps in and tells them they have been; the disgust of the majority isn't evidence of harm, it's just a taste, and law isn't for enforcing tastes; and criminalizing the thing doesn't reduce pain, it just hands a blackmail and extortion economy to scoundrels, plus you hang people for a "offence" that produces no pain in anyone. He even did the accounting against the stock objections of his day -- that it weakens men, depopulates the country, undermines marriage -- and found they don't survive contact with arithmetic.

  Now here's the episode I want you to work on. The Wolfenden Report in Britain, 1957. Committee recommends decriminalizing private homosexual acts between consenting men over 21, reasoning roughly that it's not the law's business what consenting adults do in private; that gives you the Sexual Offences Act ten years later, and it kicks off the famous Hart--Devlin argument about whether the law may enforce majority morality. Devlin's line was that society has a shared moral code and a right to defend it, private or not -- so he didn't even accept the private/public line. Hart said that's not a harm, that's just the majority's tastes again, and law needs more than that.

  Analyze the whole thing through Bentham's framework, and do the mapping properly. Who and what would Bentham say the committee should have counted -- whose pleasures, whose pains, over what time horizon? Does the report's private/public line actually track anything Bentham cared about, or is it a fudge that happens to land where his calculus would land, for completely different reasons? What would he make of Devlin's "harm to society's moral fabric" -- is that a genuine counter-move within his own system (maybe aggregated disgust IS pain, and pain counts, majority included?) or just the old bad accounting he was attacking dressed up in sociology? Be honest about where Bentham's framework explains the episode well and where it's silent or misdescribes it -- e.g. the report's tone of "we're not saying this is fine, just not the law's problem" is doing something his blunter calculus has no place for, I think, but maybe you disagree.

  And then run it the other direction: what does the episode do to the theory? Bentham seems to have thought that once you run the pain-pleasure sums honestly, the case for decriminalization is just obvious. It took ~180 years, two world wars, a committee hand-picked the right way, and a decade of parliamentary wrangling to get even a partial version of it enacted -- and even then only for men over 21, and only in private, and not in Scotland for another decade after that. Does that show the theory is missing something (disgust as an actual political force rather than an accounting error), or does it just show that people are bad at arithmetic and someone had to do it for them eventually? Give me your actual view, don't split the difference out of politeness.

  No citations or reading lists pls, I'm not going to check anything you source, I just want the analysis. Also if you think I've got the Devlin or Hart position slightly wrong, say so.
