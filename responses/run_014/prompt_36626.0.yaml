answer: |-
  Here's the Benthamite autopsy of Wolfenden and its aftermath, unsparing as requested:

  **Bentham's Lens on Wolfenden:**
  1.  **What to Count:** Bentham would demand the committee tally:
      *   *Pleasures:* The intense, consensual pleasures of homosexual men engaging in private acts; the relief from fear of prosecution/blackmail; the pleasure of autonomy/privacy.
      *   *Pains:* The direct suffering caused by prosecution, imprisonment, social ruin, and executions; the constant fear and anxiety under threat of law; the pain inflicted by blackmailers empowered by illegality; the pain of forced secrecy and dishonesty.
      *   *Whose Interests?* Primarily the participants. The purported "pain" of the disgusted majority is irrelevant unless it manifests as *actual, tangible harm* (disrupted contracts, violence, economic loss) – mere sentiment doesn't count. Bentham wouldn't grant special weight to "society" as an abstract entity feeling pain.
      *   **Time Horizon:** Long-term. The perpetual, state-inflicted suffering of a minority vs. the fleeting, contingent "offense" taken by others at acts they never witness. The ongoing harms of the blackmail economy. The wasted resources of enforcement.

  2.  **The Private/Public Line - A Benthamite Fudge?**
      *   Bentham would see it as **pragmatic but philosophically weak**. His calculus doesn't inherently care about privacy; if an act causes *no harm*, it shouldn't be criminal, public or private. The committee's focus on "private" acts between "consenting adults" is a political concession to the very disgust Bentham rejects. It implies public acts *are* harmful (via offense), which Bentham would dispute unless actual disturbance or provocation to violence occurred.
      *   **Verdict:** It lands near Bentham's conclusion (decriminalize) but for muddier reasons. The committee flirts with the "disgust matters" argument by using privacy as a shield, whereas Bentham would demolish the disgust argument root and branch. It's a political fudge masking a Benthamite outcome achieved partly through reasoning he'd find contaminated.

  3.  **Devlin's "Moral Fabric" - Bad Accounting in New Clothes:**
      *   Bentham would **dismiss this utterly as recycled nonsense**. Aggregating individual disgust into "harm to society's moral fabric" is precisely the conceptual sleight-of-hand he attacked. Where is the *pain*? Devlin posits a nebulous entity ("society") suffering intangible harm ("moral decay") from consensual private acts. Bentham would demand:
          *   *Evidence of Actual Harm:* Does decriminalization demonstrably increase violence, breach of contract, economic collapse, or tangible suffering elsewhere? If not, it's just aggregated distaste.
          *   *The Blackmail Problem Reversed:* Criminalization *creates* the blackmail harm. Devlin's position *sustains* that harmful economy.
          *   *The Tyranny of the Majority:* Enforcing majority morality purely because it's majority morality is, for Bentham, the definition of irrational and harmful governance. It sacrifices real minority happiness for the illusory comfort of the conformist masses.
      *   Devlin offers **zero** new empirical evidence of harm that would survive Bentham's accounting. It's the old "weakening men/depopulation" objections repackaged as sociology. Bentham would see it as sophistry protecting prejudice.

  4.  **Where Bentham's Framework Falters in Explaining Wolfenden:**
      *   **The "Not Fine, Just Private" Tone:** You're right. Bentham's blunt calculus has no room for this moral queasiness. His framework would declare the acts *positively good* (net pleasure), full stop. The committee's distancing reflects a **residual moralism** Bentham would find irrational and counterproductive. It weakens the principled case.
      *   **The Pace of Change (180 Years!):** This is the **critical challenge** to Bentham's optimism. His theory assumes rational actors applying the felicific calculus will reach the obvious conclusion. The reality: deep-seated disgust, religious dogma, and irrational fear are *powerful political forces*, not mere arithmetic errors. Legislators aren't Benthamite calculators; they're vote-maximizers sensitive to visceral public reaction.

  **What the Episode Does to Bentham's Theory:**
  *   **Confirms the Core Insight:** Bentham was fundamentally *right* about the harm principle and the irrationality of criminalizing harmless consensual acts. Wolfenden/Hart vindicate his core argument against Devlin's moralism. The eventual decriminalization *is* the utilitarian outcome.
  *   **Exposes a Fatal Naivety:** The 180-year delay, the limited scope (men only, over 21, private), the tortured political path – this demolishes Bentham's faith in rational, timely application of the calculus. It proves **disgust isn't merely an accounting error; it's a dominant political variable** his model significantly underestimates. His theory lacks a robust account of:
      *   **Irrationality & Prejudice:** How deeply ingrained disgust distorts perception of "harm" and overrides rational calculation.
      *   **Political Realities:** How fear of backlash, not net pleasure/pain, dictates legislative action. Legislators calculate votes, not utility.
      *   **The Power of Moral Symbolism:** For many, law *is* about expressing communal values (even irrational ones), not just preventing tangible harm. Bentham dismisses this as invalid, but Devlin (however wrongly) taps into its real political power.
  *   **Highlights a Crucial Omission:** Bentham focuses on the state as the *inflictor* of harm via law. He underestimates how societal prejudice, *empowered and legitimized* by the law, inflicts massive independent pain (ostracism, job loss, violence) that wouldn't magically vanish with decriminalization. The law was a tool, but the underlying disgust was the engine.

  **My Actual View (No Politeness):**
  Bentham's utilitarian framework provides the **only philosophically coherent and empirically defensible justification for decriminalization** – Wolfenden/Hart stand on his shoulders, even if they wobble. Devlin's position is indeed, as you suspect, the "old bad accounting dressed up in sociology," and Bentham would shred it.

  **However, the 180-year delay proves Bentham's theory, as a predictive or prescriptive political tool, is profoundly naive.** It fatally underestimates the visceral, irrational power of disgust and moral panic as political forces. It assumes humans are (or can be made into) rational utility calculators, which they demonstrably are not, especially on issues tied to deep-seated taboos. The arithmetic *is* obvious, but **Bentham fails to account for the immense political transaction costs of overcoming "bad arithmetic" fueled by raw emotion.** The theory brilliantly identifies the *right* answer but provides no realistic mechanism for achieving it in the face of entrenched prejudice. The delay isn't proof the theory is wrong; it's proof that humanity is often deeply irrational, and politics is rarely about maximizing net pleasure. Bentham needed a theory of political *irrationality* to complement his calculus of rational utility. He didn't have one.
