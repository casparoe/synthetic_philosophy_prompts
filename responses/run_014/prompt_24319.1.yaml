prompt: |-
  I'm a software engineer with no formal philosophy training, and I'm planning a solo twelve-month deep dive into the non-identity problem. My goal is a rigorous written synthesis that can actually inform my judgment on policy-adjacent questions — how to weigh the long-run consequences of climate policy, AI deployment, and bioethics — not a survey of the literature. I understand the basic puzzle: a choice that changes who comes into existence can make it impossible for the people affected to have been made worse off by that choice. I also know the debate is organized around the "no difference" versus "no harm" distinction, the move to impersonal or total-welfare views, and the tangle with the repugnant conclusion. Which open questions and lines of work in this area matter most, and which are overrated? Give me a prioritized list of at most four, each with why it is upstream of the others, what would count as a resolution and why that is tractable for an autodidct rather than a specialist, and what evidence or argument over the next few years would move it up or down the list. Please defend the ordering explicitly: I want the criteria you used — importance, tractability, how many other questions depend on the answer, whether the question actually changes real decisions — and the trade-offs between them, not just a ranking.
