prompt: |-
  I run a small podcast on decision theory and cooperation (couple hundred devoted listeners, mostly people who already know their Newcomb from their Prisoner's Dilemma). Next month's guest is a philosopher who's spent his whole career defending Hofstadter-style superrationality — the idea that if you and your co-players are all reasoning the same way about a symmetric one-shot game, you should treat your own choice as a representative sample of everyone's and pick the cooperative option even when defecting is causally dominant.

  He's slick. Whenever I push him on the obvious objection — why should I care that a mirror-image reasoner in another room is arriving at the same conclusion I am? — he says something like "it's not about caring, it's about what makes your decision the decision it is" and then changes the subject. He'll definately do his smooth-guru thing unless the questions are built to survive it.

  Draft me eight to ten interview questions. I want at least one that forces him to confront the renegade problem head-on: if he really believes everyone who reasons like him will cooperate, isn't the tempting thought "I'll be the one who defects" rational, and what exactly blocks it? One on whether his view commits him to voting in every single election — his one vote causally does basically nothing, but on his own logic everyone who reasons like him votes, so does the ballot box become a giant prisoner's dilemma he's already solved? And one on near-symmetry: what survives when the payoffs are slightly different, or one player is a bit worse at reasoning than the others — at what point does "we're all the same" quietly become "we're similar enough for the argument to go through," and isn't that last step just evidential reasoning with extra steps? For each question, include a follow-up keyed to the dodge he's most likely to give.

  Don't hand me a menu with hedges and alternatives — commit to the questions you actually think will corner him, and tell me briefly why you ordered them the way you did, because I want to build the episode as an escalating trap. Whole thing under 400 words, follow-ups included.
reasoning: |-
  Okay, the user runs a small podcast on decision theory and cooperation with a guest who's a philosopher defending Hofstadter-style superrationality. They need interview questions that force the guest to confront key weaknesses in his argument without letting him dodge. Let me break down their requirements.

  First, the main objections they want covered: the renegade problem (why not defect if others cooperate?), voting in elections (if everyone like him votes, does that make voting rational?), and near-symmetry (how small can differences be before superrationality fails?). The questions must be airtight against his deflection tactics.

  Hmm, the guest uses phrases like "it's not about caring, it's about what makes your decision the decision it is" to avoid addressing why identical reasoning should compel cooperation. So each question needs a follow-up anticipating this move.

  For the renegade problem, the core question should force him to explain why "I'll be the exception" isn't rational. His likely dodge is to say "that thought breaks symmetry," so the follow-up must demand why symmetry-breaking is irrational rather than advantageous. 

  On voting, the question must link the causal futility of one vote to the superrational claim that "all like-minded people vote." Follow-up should corner him on whether this makes voting mandatory - if he says no, it undermines his core principle.

  Near-symmetry is the trickiest. The question needs to probe how minimal differences disrupt the "we're all identical" premise. His dodge might be "sufficient similarity," so the follow-up has to press him on how this differs from standard evidential reasoning.

  I'll structure the questions to escalate: start with voting as concrete intuition pump, then renegade problem as direct attack, then near-symmetry to expose theoretical fragility. This builds from practical to abstract while boxing him in.

  Each follow-up must prevent subject-changing by demanding direct answers: "Don't tell me what breaks symmetry - tell me why breaking it is wrong" etc. The voting question should come first because it's hardest to weasel out of with abstract language.

  For the renegade follow-up, I'll emphasize that "rationality shouldn't prohibit self-interested choices" - that's the knife twist. For near-symmetry, the killer point is that "sufficient similarity" reduces to evidential reasoning with poetic language.

  The sequence creates a trap: voting exposes real-world inconsistency, renegade challenges core motivation, near-symmetry unravels the entire framework. No exits left by Q5.
answer: |-
  Here's your escalating trap, designed to force confrontation on core weaknesses while preempting dodges. Follow-ups target his specific deflection patterns.

  **Sequence Logic:** Start concrete (voting), then core paradox (renegade), then unravel the mechanism (symmetry). Escalates from practical implications to foundational cracks.

  1.  **Question (Voting):** "Superrationality seems to demand voting in large elections: if all superrational agents vote, the good outcome wins, and *not* voting breaks symmetry. But my single vote causally does nothing. Why isn't voting irrational effort?"
      *   **Likely Dodge:** "Voting isn't about causality; it's about being the *kind* of reasoner whose decisions cohere with others like me."
      *   **Follow-Up:** "But if coherence alone mandates voting despite zero causal impact, does this commit superrationalists to voting in *every* election, even local dogcatcher? Isn't that an absurdly demanding practical implication?"

  2.  **Question (Renegade Head-On):** "If I *truly believe* all superrational cooperators will cooperate in this symmetric PD, the thought 'I'll be the one who defects while they all cooperate' seems incredibly tempting and beneficial. What, *precisely*, makes that thought irrational on your view?"
      *   **Likely Dodge:** "That very thought *breaks* the symmetry! You're no longer reasoning identically to the others."
      *   **Follow-Up:** "Don't tell me what *breaks* the symmetry; tell me *why breaking it is irrational* in this instance. If I can uniquely benefit by being the exception among identical reasoners, why shouldn't rationality permit, even demand, that? Isn't prohibiting that thought just rigging the game?"

  3.  **Question (Near-Symmetry):** "Real agents are never perfectly identical. Take a PD where my payoff matrix is shifted *slightly* – maybe cooperation costs me a penny more than you. When does 'we're all the same' become 'we're similar enough' for superrational cooperation to hold? What's the threshold?"
      *   **Likely Dodge:** "Sufficient similarity allows the symmetry argument to function; the reasoning process itself bridges minor differences."
      *   **Follow-Up:** "Isn't 'sufficient similarity' just code for 'evidentially correlated enough'? If my decision *evidentially predicts* yours due to similarity, and I condition on that, isn't this standard evidential decision theory wearing a 'superrationality' mask? What unique work is 'identical reasoning' doing here?"

  **Bonus Cornering Questions:**

  4.  **Pre-Commitment:** "If superrationality binds identical reasoners, could two superrationalists *pre-commit* to defect in a PD, knowing the other is identical and will also defect? Wouldn't that mutual defection *still* satisfy symmetry, yet yield the worse outcome? Doesn't this show symmetry alone doesn't mandate cooperation?"
  5.  **Asymmetric Information:** "Player A knows the game is symmetric; Player B mistakenly believes A gets a worse payoff for cooperating. Both are 'superrational' in their own context. What happens? Doesn't this highlight how fragile the 'identical reasoning' requirement is?"
  6.  **Causal Leverage:** "You dismiss causality. But if I *causally* learn my opponent uses a coin flip, I defect. If I *causally* learn they use your superrational logic, I cooperate. Doesn't this show my action depends on my *causal model* of *their* decision process, not just symmetry of reasoning?"
  7.  **Bootstrapping:** "How do superrational agents *know* they are identical? Isn't assuming perfect symmetry just bootstrapping the desired cooperative outcome into the premise of the reasoning?"
  8.  **Altruism vs. Rationality:** "Isn't superrational cooperation ultimately just sophisticated altruism? If the *only* reason I cooperate is because I believe identical others do, and I want us *all* to benefit, isn't the core motivation fundamentally other-regarding, not purely rational self-interest?"

  **Escalation Path:** Voting (1) shows absurd demand → Renegade (2) attacks core selfish rationality → Near-Symmetry (3) exposes EDT in disguise → Bonus questions dismantle mechanics. Follow-ups force him to justify *why* symmetry-breaking is irrational and confront the view's practical & conceptual instability. Good luck trapping the guru!
