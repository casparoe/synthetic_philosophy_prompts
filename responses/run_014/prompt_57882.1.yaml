prompt: |-
  I serve as the lead reviewer for safety incidents at a regional rail network that carries mixed freight and passenger traffic. Each month my team reviews roughly eight to twelve near misses and minor harms to determine which factors should be recorded as causes for regulatory reporting and for internal reform.

  Our current practice is unstable. If we use simple counterfactual reasoning alone, almost every omission that would have prevented an outcome gets listed as a cause, from the dispatcher who did not issue an extra warning to the manager who did not schedule additional training two years earlier. If we instead rely on informal judgments about who should have acted, the results vary by reviewer and conflate causal analysis with blame.

  Please provide a reusable decision procedure that my team can apply without training in philosophy, translating the central philosophical difficulty with causation by omission into workable steps: that counterfactual dependence is too permissive on its own, that appeals to norms and reasonable expectations can discipline it but risk turning causal judgments into moral judgments, and that there is a further distinction worth preserving between actively producing an outcome and merely failing to prevent it.

  The procedure should be presented as an ordered checklist or flowchart in words, suitable for use in about forty-five minutes per case by engineers and dispatch supervisors, with final sign off by the operations director. For each step, state the question to be asked, what counts as a sufficient answer given the records typically available to an incident team, where the procedure terminates with a finding of no causation by omission, and where the team must stop and mark the issue as requiring evaluative judgment rather than further factual inquiry. Clearly mark the points where judgment cannot be eliminated and specify the hard cases the procedure must be able to handle, including multiple simultaneous omitters, omissions by automated monitoring systems, and cases where the relevant expectation or duty was vague or contested at the time.

  Then apply the procedure step by step to the following three cases:

  A delayed freight train with degraded brakes enters a downhill section during heavy rain. The dispatcher, who was monitoring three other movements, does not issue a discretionary slow order that was permitted but not required by the rule book. The train overshoots a signal and sideswipes a stabled passenger unit, causing minor injuries. An additional automated advisory that might have prompted the dispatcher was muted for maintenance.

  A track inspector shortens a scheduled walking inspection because of heat restrictions and does not detect a cracked joint bar. Two days later the joint fails under a light passenger service, causing a low speed derailment with no injuries. A second inspector assigned to audit paperwork does not notice that the shortened inspection was recorded as complete.

  A station team does not clear leaves from a rarely used emergency exit stairwell. During an evacuation drill, the exit is found blocked, but the drill completes within the target time using other exits. No harm occurs, although the safety manager argues the omission could have caused deaths under slightly different occupancy.

  Do not adjust the verdicts to fit intuitive expectations about blame. If the procedure yields a result the operations staff will find unwelcome, for example by excluding an omission widely felt to be causal or by including one that spreads responsibility very broadly, retain the result and explain why it follows. Conclude with a brief statement of what the procedure cannot settle and where it is most likely to misfire in future cases.
reasoning: |-
  We are creating a decision procedure for determining when an omission should be counted as a cause in a safety incident. The procedure must navigate the pitfalls of counterfactual reasoning (which is too broad) and avoid conflating causation with blame. We will break it down into steps that can be followed by non-philosophers, with clear stopping points for evaluative judgment.

  The core idea is to use counterfactual dependence as a starting point but then to discipline it by requiring that the omission must be a violation of a specific, established norm (rule, procedure, or reasonable expectation) that was in place at the time and applicable to the situation. We also want to preserve the distinction between actively causing harm and failing to prevent it.

  **Decision Procedure for Causation by Omission**

  **Step 1: Counterfactual Dependence**
     - **Question:** If the action (that was omitted) had been taken, would the incident (or the harm) have been prevented? (Consider only the specific outcome that occurred, not worse outcomes that might have been prevented by the action.)
     - **Sufficient Answer:** If the records show that the action would have made a difference (e.g., based on physical laws, expert analysis, or simulation), then mark as counterfactually dependent. If the records are unclear, then the team must stop and mark as requiring further investigation (if feasible) or judgment. If the answer is "no", then the omission is **not** a cause and the procedure terminates for that omission.
     - **Hard Cases:** In cases of multiple simultaneous omissions, each omission must be examined separately at this step. For automated systems, consider the system as an agent that could have acted (if it had been functioning and not muted, what would it have done?).

  **Step 2: Existence of a Clear Norm**
     - **Question:** At the time of the incident, was there a specific, established rule, procedure, or reasonable expectation that required the action to be taken in the circumstances? (The norm must be in writing or so well-established that it would be reasonable to expect compliance without written rule.)
     - **Sufficient Answer:** If there is a written rule or procedure that applies, or if there is a clear precedent (e.g., past practice, training materials, industry standard) that establishes the expectation, then the norm exists. If the norm is vague, contested, or non-existent at the time, then the omission is **not** to be recorded as a cause and the procedure terminates for that omission.
     - **Note:** This step is to avoid using hindsight to create new norms. The norm must have been in place at the time.

  **Step 3: Distinguishing Active Causation from Mere Failure to Prevent**
     - **Question:** Did the omission actively produce the outcome, or was it merely a failure to prevent it? (This step is to categorize the omission for reporting, but note that both can be causal. However, we want to preserve the distinction because active causation is typically more direct and may require different interventions.)
     - **Sufficient Answer:** If the omission was a direct and necessary step in the chain of events (e.g., not applying brakes when one is supposed to) then it is active. If it was a background condition that allowed the event to happen (e.g., not having installed an automatic braking system) then it is a failure to prevent. This step does not terminate the procedure but helps in categorizing the cause for internal reform and regulatory reporting.

  **Step 4: Judgment Call for Reasonable Expectation (if Step 2 is not met by written rule)**
     - **Question:** Even without a written rule, was the action so obviously required by general safety principles that a reasonable person in the role would have known to do it? (This is a judgment call and should be used sparingly.)
     - **Sufficient Answer:** Only if the team (with input from the operations director) unanimously agrees that the expectation was clear and reasonable at the time, then the norm is established by judgment. If not, then the omission is **not** recorded as a cause. This step is the primary point where evaluative judgment is required and must be documented.

  **Step 5: Recording the Cause**
     - If the omission passes Steps 1 and 2 (or 1 and 4) then it is recorded as a cause. The categorization from Step 3 is noted. If the omission fails at any step (except Step 3 which is non-terminating) then it is not recorded as a cause.

  **Flowchart Summary:**
     Start at Step 1 for each omission under consideration.
     1. Counterfactual Dependence? 
          - No → Not a cause (stop for this omission).
          - Yes → Proceed to Step 2.
     2. Clear Norm? 
          - Yes → Proceed to Step 3 and then record as cause.
          - No → Proceed to Step 4.
     4. Reasonable Expectation? 
          - Yes (by unanimous judgment) → Proceed to Step 3 and then record as cause.
          - No → Not a cause (stop).

  **Hard Cases:**
     - **Multiple simultaneous omissions:** Each omission must be evaluated independently. It is possible that more than one omission is found to be causal.
     - **Automated systems:** Treat the system as an agent. If the system was designed to act and was muted or failed, then we consider the counterfactual: if it had been working, would it have acted? And was there a norm that it should have been maintained/not muted? (But note: if the system was not required by norm, then Step 2 fails.)
     - **Vague or contested duties:** If the duty was vague or contested at the time, then Step 2 fails and we go to Step 4. Step 4 requires unanimous judgment to establish the norm.

  **Application to Cases:**

  **Case 1: Delayed Freight Train with Degraded Brakes**
     - **Omission 1: Dispatcher did not issue a discretionary slow order.**
          Step 1: Counterfactual Dependence? 
            - If the slow order had been issued, the train would have been going slower and might not have overshot the signal. So yes.
          Step 2: Clear Norm? 
            - The rule book permitted but did not require the slow order. There is no written rule requiring it in these exact circumstances. So no clear norm → go to Step 4.
          Step 4: Reasonable Expectation? 
            - The dispatcher was monitoring multiple movements. It was discretionary. Is it reasonable to expect the dispatcher to issue it? This is a judgment call. Without a clear norm, and given that it was discretionary, it might not be reasonable to expect it in every case. The team must judge: was the risk so obvious that a reasonable dispatcher would have issued it? Given the heavy rain and degraded brakes, it might be judged as reasonable. However, if the team is split, then it fails. For the sake of example, let's say the team unanimously agrees that a reasonable dispatcher would have issued the slow order given the conditions? Then it would be recorded as a cause. But note: if not unanimous, then not recorded.
          Step 3: This omission is a failure to prevent (not active causation).

     - **Omission 2: The automated advisory was muted for maintenance.**
          Step 1: Counterfactual Dependence? 
            - If the advisory had not been muted, it might have prompted the dispatcher to issue the slow order. But note: the advisory is only advisory. So it's not certain. However, if the records show that the advisory system, when active, typically leads to dispatcher action, then yes. If not, then it's speculative and might not pass. Let's assume it would have prompted the dispatcher. Then yes.
          Step 2: Clear Norm? 
            - Was there a rule against muting the system for maintenance? And was the maintenance being done at a time when it was needed? If there is a rule that the system must be functional during operations, then yes. But if the maintenance was scheduled appropriately and there was no rule requiring the system to be on at all times, then no. The rule book might require the system to be operational unless under maintenance, and maintenance must be scheduled during low-risk periods. But in this case, the incident happened during heavy rain and with a delayed freight train with degraded brakes — was this a low-risk period? The norm might be that maintenance should not be done during high-risk periods. If there is a written rule about when maintenance can be done, then we check. If not, then we go to Step 4. Let's assume there is a rule that the system must be operational unless maintenance is approved and during maintenance a backup system must be in place? If no such rule, then Step 2 fails and we go to Step 4. Step 4: Is it reasonable to expect that the system not be muted during a period of heavy rain and with known degraded brakes? This is a judgment call. The team might unanimously say yes, because the risk was elevated. Then record as cause. Otherwise, not.

     **Verdict for Case 1:**
     - Dispatcher omission: If the team unanimously agrees that a reasonable dispatcher would have issued the slow order (Step 4), then record as cause (failure to prevent). Otherwise, not.
     - Automated system omission: If there was a rule against muting during operations (Step 2) or if the team unanimously agrees that it was unreasonable to mute the system at that time (Step 4), then record as cause (failure to prevent). Otherwise, not.

     Note: The outcome might be that both are causes or only one or none, depending on the judgment in Step 4.

  **Case 2: Track Inspector Shortens Inspection and Second Inspector Fails to Audit**
     - **Omission 1: Track inspector did not complete the scheduled walking inspection.**
          Step 1: Counterfactual Dependence? 
            - If the inspection had been completed, the cracked joint bar would have been detected and repaired, and the derailment would have been prevented. Yes.
          Step 2: Clear Norm? 
            - There was a scheduled inspection that the inspector shortened. If the rule book requires the full inspection (and the heat restrictions do not provide an exception) then there is a clear norm. But if the heat restrictions are a valid reason to shorten, then we must check if the procedure allows for shortening. If the procedure does not allow shortening, then norm exists. If the procedure is silent or allows discretion, then Step 2 fails. Let's assume the procedure requires a full inspection unless authorized by a supervisor. If the inspector did not get authorization, then the norm exists. If the procedure allows the inspector to shorten due to heat without authorization, then Step 2 fails. We don't have that detail. For the sake of example, if the rule book requires the full inspection and the inspector did not have authority to shorten, then Step 2 is met. Then record as cause (failure to prevent).

          If Step 2 is not met (because the norm was vague or allowed discretion), then go to Step 4: Was it reasonable to complete the full inspection despite the heat? The team might consider if the heat restriction was for worker safety and if there was an alternative (e.g., do it at a cooler time). Without a clear norm, the team must judge. If unanimous that it was unreasonable to shorten without a clear alternative plan, then record as cause.

     - **Omission 2: Second inspector did not notice the shortened inspection in the paperwork.**
          Step 1: Counterfactual Dependence? 
            - If the second inspector had noticed, would the derailment have been prevented? Yes, because the inspection could have been redone and the crack found.
          Step 2: Clear Norm? 
            - Was the second inspector required to check the paperwork for completeness? If the audit procedure requires checking that the inspection was done as scheduled, then yes. If the audit is only for paperwork compliance (e.g., all fields filled) and not for substantive completeness, then no. We don't have the exact audit procedure. If the procedure requires checking the substantive completeness (including that the inspection was done in full) then Step 2 is met. Otherwise, no. Then go to Step 4: Is it reasonable to expect the auditor to check the substantive completeness? This might be a stretch without a clear norm. The team must decide unanimously. If they agree, then record. Otherwise, not.

     **Verdict for Case 2:**
     - First inspector: Likely a cause if the norm was clear (Step 2) or if the team unanimously agrees in Step 4 that the inspector should have completed the inspection despite the heat (or gotten authorization). 
     - Second inspector: Only if the audit procedure required substantive checking (Step 2) or the team unanimously agrees that it was reasonable to expect such checking (Step 4). Otherwise, not a cause.

  **Case 3: Station Team Does Not Clear Leaves from Emergency Exit**
     - **Omission: Station team did not clear leaves from the emergency exit.**
          Step 1: Counterfactual Dependence? 
            - The outcome was that during an evacuation drill the exit was found blocked, but the drill completed without harm. The question is about the outcome that occurred: the blocked exit. If they had cleared the leaves, the exit would not have been blocked. So yes, for the outcome of the exit being blocked. But note: the safety manager is concerned about the potential for harm under different circumstances. However, the procedure is about the actual outcome. The actual outcome was the blocked exit during the drill. There was no harm (injuries or deaths) in the actual incident. The procedure is for near misses and minor harms. The outcome here is a near miss (no harm) but with a blocked exit. So the outcome we are considering is the blocked exit. The counterfactual holds: if they had cleared the leaves, the exit would not have been blocked.
          Step 2: Clear Norm? 
            - Was there a rule requiring the station team to clear leaves from the emergency exit? If the emergency exit is part of the routine maintenance, then yes. If the exit is rarely used and not on the regular maintenance schedule, then maybe not. We need to know if there was a written procedure. If the procedure requires all exits to be clear and this exit is included, then yes. If not, then Step 2 fails. Then Step 4: Is it reasonable to expect the station team to clear leaves from an emergency exit, even if rarely used? Probably yes, because emergency exits must be functional. The team would likely unanimously agree. Then record as cause (failure to prevent the blockage). However, note that the actual incident had no harm. The procedure is for near misses and minor harms. The blockage of the exit is a near miss. So it is causal for that outcome.

     **Verdict for Case 3:**
     - The omission is causal for the blocked exit (if Step 2 or Step 4 is passed). The potential for harm in other circumstances is not the outcome we are analyzing.

  **Conclusion:**
  The procedure cannot settle:
     - Cases where the counterfactual dependence is highly speculative (e.g., if the action would have been taken but might not have prevented the outcome).
     - Cases where the norm is truly ambiguous and the team cannot reach unanimity in Step 4.
     - Moral judgments about blame or responsibility — the procedure is only for causal attribution for the purpose of reporting and internal reform.

  The procedure is most likely to misfire in:
     - Cases with complex interdependencies (multiple omissions that are each counterfactually necessary but only jointly sufficient).
     - Cases where the norms are in transition or under debate at the time of the incident.
     - Cases where the counterfactual is hard to establish (e.g., human behavior: would the dispatcher have heeded the advisory?).

  Note: The operations director must sign off, and they can overrule the team's judgment in Step 4 if they have additional context, but the procedure requires that the judgment step be unanimous among the team. The director's role is to ensure consistency and to consider broader implications, but the procedure aims to make the process as objective as possible.
answer: |-
  ### Decision Procedure for Causation by Omission in Safety Incidents  
  **Purpose**: To determine whether an omission (a failure to act) should be recorded as a cause of an incident, using counterfactual reasoning disciplined by norms, while separating causation from blame and preserving the distinction between *actively producing* and *failing to prevent* an outcome.  

  **Inputs per omission**: Incident records, applicable rules/procedures at the time, role-specific duties, and factual context.  
  **Outputs**: "Cause by omission" (categorized as *active* or *failure to prevent*), "No causation," or "Judgment required" (for unresolved evaluative questions).  
  **Time limit**: 45 minutes per case. Final sign-off by operations director.  

  ---

  #### Procedure Flowchart (Ordered Checklist)  
  **For each alleged omission, follow these steps sequentially**:  

  1. **Counterfactual Necessity**  
     - **Question**: "If the omitted action *had* been taken, would the *specific outcome* (harm or near miss) have been prevented with high certainty?"  
     - **Sufficient answer**:  
       - *Yes*: Physical/operational evidence (e.g., simulation, expert analysis) shows prevention was probable.  
       - *No*: Outcome would likely have occurred anyway → **Terminate: No causation**.  
       - *Unclear*: Insufficient evidence → **Mark: Judgment required** (e.g., speculative human reactions).  
     - **Hard cases**:  
       - *Multiple omitters*: Test each omission independently (one may pass, others fail).  
       - *Automated systems*: Treat as a "virtual agent" (e.g., "If the system had been functional, would it have acted?").  

  2. **Normative Baseline**  
     - **Question**: "Was there a *specific, effective, and applicable* rule, procedure, or duty at the time that *required* the action?"  
     - **Sufficient answer**:  
       - *Yes*: Written rule/procedure exists and applies to the context (e.g., "Track inspections must cover X miles").  
       - *No*: Rule was vague, absent, or explicitly discretionary (e.g., "Discretionary slow orders") → **Terminate: No causation**.  
       - *Contested*: Rule existed but was ambiguous or under debate → **Mark: Judgment required** (e.g., "Was this duty reasonably binding?").  
     - **Hard cases**:  
       - *Vague duties*: If no written rule exists, skip to Step 4 (do not assume norms).  
       - *Automated systems*: Norms derive from design specs or maintenance protocols (e.g., "System must be active during rain").  

  3. **Action vs. Inaction Distinction**  
     - **Question**: "Did the omission *actively create a new risk* or *allow an existing risk to propagate*?"  
     - **Categorization** (non-terminating; for reporting only):  
       - *Active production*: Omission directly triggered the outcome (e.g., not applying brakes when required).  
       - *Failure to prevent*: Omission permitted pre-existing risks to cause harm (e.g., not fixing a known flaw).  
     - **Default**: Use "failure to prevent" unless clear evidence of direct triggering.  

  4. **Reasonable Expectation (Judgment Gate)**  
     - **Question**: "Absent a clear norm (Step 2), was the action *so obviously necessary* that a reasonable person in that role would have known to do it?"  
     - **Process**:  
       - Team discusses unanimity → *Unanimous "yes"*: **Cause by omission** (categorize per Step 3).  
       - *Not unanimous* or *insufficient evidence* → **Terminate: No causation**.  
     - **Critical note**: This step *requires* evaluative judgment. If factors like workload, resource constraints, or competing priorities complicate "reasonableness," **mark: Judgment required** for operations director.  

  **Procedure end**: Document rationale. Operations director resolves "Judgment required" flags.  

  ---

  ### Application to Cases  
  **Incident context**: Focus on *actual outcome* (not hypotheticals). No blame adjustment.  

  #### **Case 1: Freight Train Sideswipe**  
  - **Omission A**: Dispatcher did not issue discretionary slow order.  
    - **Step 1 (Counterfactual)**: Yes. Slow order would likely have prevented overspeed.  
    - **Step 2 (Norm)**: Rule book says "permitted but not required" → *No specific duty* → **No causation**.  
    - *Stops here*. Not tested for reasonableness (Step 4) due to explicit discretion.  
  - **Omission B**: Automated advisory muted for maintenance.  
    - **Step 1 (Counterfactual)**: Yes. Functional advisory might have prompted dispatcher.  
    - **Step 2 (Norm)**: Check maintenance protocols. If no rule forbade muting during rain → *No specific duty* → **No causation**. If protocols required availability during high-risk conditions → Proceed.  
    - **Step 3**: Failure to prevent (system did not actively cause collision).  
    - **Step 4 (If norm absent)**: Was muting unreasonable? *Judgment required* (e.g., "Should technicians anticipate degraded brakes?").  

  **Verdict**:  
  - Dispatcher omission: **No causation** (discretionary norm).  
  - Automated system: **No causation** if no maintenance rule; else **Judgment required** for reasonableness.  
  *Unwelcome but consistent*: Discretionary acts aren’t "causes" under this procedure. Blame may still apply for recklessness, but that’s separate.  

  #### **Case 2: Track Joint Failure**  
  - **Omission A**: Inspector shortened walking inspection.  
    - **Step 1 (Counterfactual)**: Yes. Full inspection would likely have detected crack.  
    - **Step 2 (Norm)**: If rules require fixed inspection length → **Cause by omission** (failure to prevent). If rules allow heat adjustments → *No duty* → **No causation**.  
    - *Assume rules are rigid* → **Cause by omission**.  
  - **Omission B**: Second inspector did not audit paperwork.  
    - **Step 1 (Counterfactual)**: Yes. Audit might have caught shortened inspection.  
    - **Step 2 (Norm)**: If audit duties include verifying completion → **Cause by omission** (failure to prevent). If audits are only for paperwork errors → *No duty for substance* → **No causation**.  
    - *Assume audits are procedural only* → **No causation**.  

  **Verdict**:  
  - First inspector: **Cause by omission** (if norms rigid).  
  - Second inspector: **No causation** (if norms limited to paperwork).  
  *Unwelcome but consistent*: Auditors aren’t "causes" if norms don’t require substantive checks.  

  #### **Case 3: Blocked Emergency Exit**  
  - **Omission**: Station team did not clear leaves.  
    - **Step 1 (Counterfactual)**: Yes. Clearing would have prevented blockage.  
    - **Step 2 (Norm)**: If exit maintenance is required → **Cause by omission** (failure to prevent). If exits are only cleaned when "visible issues" → *Vague duty* → **Judgment required** for reasonableness.  
    - **Step 4 (If needed)**: Unanimous "yes" only if reasonable to clean rarely used exits (e.g., safety standards imply this). Else **No causation**.  
    - **Outcome note**: Actual event was a drill with no harm. Cause applies to *blockage*, not hypothetical deaths.  

  **Verdict**: **Cause by omission** if maintenance rule exists; else **Judgment required**.  
  *Unwelcome but consistent*: "Could have caused death" is irrelevant; only the actual outcome (blockage) is considered.  

  ---

  ### Limitations and Failure Modes  
  **What the procedure cannot settle**:  
  1. **Moral blame vs. causation**: It identifies factual causes but cannot resolve culpability (e.g., gross negligence vs. honest mistake).  
  2. **Overdetermination**: When multiple omissions are individually sufficient (e.g., any one action would have prevented harm). Procedure may flag all, spreading responsibility broadly.  
  3. **Hindsight bias**: Step 4 ("reasonable expectation") risks contaminating analysis with post-incident knowledge.  

  **Where it may misfire**:  
  - **Vague norms**: Step 4 judgments may become arbitrary if roles/duties are poorly defined.  
  - **Automated systems**: Norms may lag technology (e.g., AI "duties" not codified).  
  - **Resource constraints**: If omissions stem from understaffing, the procedure may assign "cause" to frontline staff even if systemic.  

  **Final note**: This procedure systematizes causation but requires director oversight to balance fairness and safety. Retain all documentation to audit decisions over time.
