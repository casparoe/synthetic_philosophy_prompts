  Hmm, the user's frustration comes through clearly—they're wrestling with making this nuanced idea rigorous while avoiding their supervisor's critique. The key tension lies in balancing philosophical depth with interdisciplinary accessibility. Their unspoken worry seems to be whether their "two currencies" framework is truly novel or just repackaged incommensurability. 

  Right, structuring the proposal requires precision: first reframing the research question to isolate when trade reasoning presupposes dispute resolution (that's the philosophical knife-edge). Then demonstrating gaps in existing approaches—mutual-advantage theories ignore currency heterogeneity, integrity-based objections overlook structural power asymmetries. The originality hinges on showing how prior endowment disputes poison compromise legitimacy, not just incommensurability.

  For methodology, the user wants concrete case analyses paired with semi-formal modeling. Smart—the religious exemption/climate/transitional justice cases make the abstraction tangible. The model must prevent currency collapse by design, maybe using vector-valued payoffs? That answers "why not pure casuistry or full formalism." 

  Ah, the feasibility trap: twelve months is tight. Should advise focusing on two cases max, or the model might eat all the time. Success would be taxonomy of disputes where trade talk works (probably scarce-resource conflicts) versus where it smuggles in complicity (moral wrongs "traded" as commodities). Failure would be if the distinction doesn't alter real-world judgments—like if all cases still resolve to cost-benefit math.

  Biggest risk is the political scientist reviewer missing the moral philosophy stakes. Need to explicitly link bargaining theory's endowment assumptions to political authority disputes. Maybe phrase the "settled pre-trade" point as an institutional design flaw? 

  ...Wait, the complicity angle is gold. That's the fresh element beyond incommensurability: reframing "loss" as moral entanglement when compromises force parties to enable what they deem evil. The climate case shows this starkly—burden-sharing isn't just unequal costs but making victims complicit in harm. That's the dissertation's nuclear insight.
answer: |-
  Here is a refined proposal draft addressing your core concerns, structured as continuous prose for the committee:

  The central question this project seeks to answer is: Under what conditions can the 'gains-from-trade' framework—where compromise is justified by mutual benefit secured through reciprocal concession—legitimately resolve deep moral disagreements without implicitly presupposing the very settlement (regarding entitlements or the metric of value) that is the subject of the dispute? When this framework fails, what alternative account of compromise’s justification, if any, can take its place?

  Existing approaches to compromise leave this question inadequately addressed. The mutual-advantage tradition, dominant in political theory and positive political science, treats compromise as a rational bargain between parties seeking to advance their interests from a baseline of conflict. Its moral force derives from consent and mutual improvement. However, this model typically assumes a settled pre-bargaining allocation of decision-rights and entitlements (the ‘endowment’), and relies on a single, commensurable metric of value (like utility or welfare) in which gains and losses are calculated. This renders it ill-equipped for disputes where parties fundamentally contest who has the right to decide (e.g., whether a religious minority has a veto over majority practices) or where the ‘costs’ and ‘benefits’ of a deal inhabit categorically distinct normative realms (e.g., tolerating a perceived grave wrong versus securing a material concession). Objections grounded in integrity or ‘dirty hands’ highlight the moral cost of compromising core principles but often fail to engage systematically with the structural power imbalances embedded in the bargaining setup itself. Meanwhile, theories treating compromise as a necessary second-best under reasonable pluralism frequently sidestep the specific mechanics of *how* conflicting values are weighed in the concession-exchange, potentially masking the same presuppositions about baseline entitlements and commensurability. The crucial gap is a rigorous analysis of whether, and how, the gains-from-trade logic functions when the parties’ disagreement extends to the foundational elements the framework relies upon.

  This project proposes a dual-method approach to close this gap. First, it will develop a conceptual and semi-formal model designed to explicitly disentangle the normative currencies at play in deep moral compromises. Instead of a single utility function, the model will represent agents with distinct evaluative dimensions (e.g., ‘Commitment to Principle’ vs. ‘Promotion of Interests’), refusing their automatic reduction to a common scale. Crucially, it will treat the initial allocation of decision-rights over contested issues not as a neutral background condition, but as a variable itself subject to dispute. This model will be used as an analytical tool to test scenarios, asking whether mutual improvement (defined non-aggregetively across dimensions) is possible *without* presupposing a settled endowment or commensurability. Second, this model will be applied to a tightly focused set of real-world cases selected for their illustrative power in exposing the limitations of standard trade reasoning:
  1.  **Religious Exemptions:** A minority accepts state funding for a practice it deems deeply immoral (e.g., abortion, same-sex marriage) in exchange for exemptions from participating in that practice. The ‘gain’ (exemption preserving integrity) and ‘cost’ (complicity through funding/toleration) exist in different normative registers; the endowment (majority rule over funding) is contested.
  2.  **Climate Burden-Sharing:** A vulnerable nation accepts weaker emissions targets for industrialized nations (perceived as a moral wrong due to disproportionate harm) in exchange for substantial adaptation finance. The ‘gain’ (material resources for survival) is incommensurable for some with the ‘cost’ (enabling continued, unjust harm); the initial allocation of emission rights is the core dispute.
  3.  **Transitional Justice Amnesty Deal:** Victims' groups accept amnesty for perpetrators (perceived as an injustice) in exchange for full truth revelation and institutional reform. The ‘gain’ (truth, future stability) and ‘cost’ (forsaking punishment, legitimizing past wrongs) are normatively distinct; the endowment (who has the right to grant amnesty) is inherently unsettled post-conflict.

  This case-driven modeling approach is chosen over pure casuistry because it demands systematic precision in representing the normative structure. It is preferred to a fully formal bargaining model because it deliberately avoids collapsing distinct values and focuses on the legitimacy of presuppositions rather than predictive equilibrium. It surpasses conceptual analysis alone by grounding the inquiry in concrete, contested practices requiring justification.

  A significant concern is whether distinguishing ‘currencies’ simply restates the problem of value incommensurability within bargaining theory. This project contends it does more. Incommensurability challenges the *comparability* of gains and losses *within* an agent’s evaluation. The ‘two currencies’ critique, combined with the contested endowment, highlights how the *framework itself* may illegitimately *structure* the interaction as a trade when the parties do not recognize the ‘goods’ being exchanged as fungible commodities belonging to the other side, or accept the initial distribution of control. The moral problem often lies not merely in the difficulty of comparison, but in being made *complicit* in what one deems a wrong through the act of concession itself – a cost qualitatively different from a mere setback of interests. The project will rigorously test this distinction: if the model’s verdicts on the cases (e.g., whether a proposed 'deal' genuinely constitutes a mutual improvement without presupposition) align with intuitive judgments *only* when complicity and contested authority are factored in, distinct from simple incommensurability, it will demonstrate added value.

  A successful outcome would be: 1) A precise characterization of the specific *types* of moral disagreements where gains-from-trade reasoning can function legitimately (likely limited to disputes where the endowment is uncontested and values are commensurable, or where concessions involve fungible interests rather than core commitments/complicity); 2) A diagnostic framework explaining why the standard model fails elsewhere, centering on the concepts of *presupposed authority* and *complicity through concession* rather than solely loss; and 3) An articulation of alternative grounds for justifying compromise in those harder cases (e.g., catastrophe aversion, procedural fairness under constraints), should any be viable. Failure would occur if the model inevitably collapses into a single-metric representation under analysis, or if applying the distinction yields no change in the normative assessment of any real case compared to the standard model, revealing no substantive new insight.

  To ensure feasibility within twelve months, the project will be tightly scoped: focusing intensely on two primary cases (likely Religious Exemption and Climate Burden-Sharing, covering distinct types of complicity and contestation) for deep analysis, using the third (Transitional Justice) as a secondary test. The semi-formal model will be kept deliberately minimalist, focusing on its core representational function rather than complex equilibrium derivations. Extensive literature engagement will be referenced but synthesized concisely within the argument, prioritizing the application of the novel framework to the cases. The core deliverable is a precise dissection of compromise’s justificatory structure at its problematic limits, not a comprehensive theory of all bargaining.
