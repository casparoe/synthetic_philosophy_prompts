prompt: |-
  I am reading for an MA in archaeology, and the module I am on this term is a seminar devoted entirely to societal collapse. Our tutor is a historian of the medieval Mediterranean who is famously terse and who makes us argue each case from the archaeological and textual evidence rather than from a Diamond-style narrative; she has now handed down verdicts on six cases over six weeks, and next week the seminar is being run as a prediction game, in which each of us must commit in writing to what her verdict on a seventh case will be before she gives it. I would like to do this properly rather than guess, so I want to work out which rule she is actually applying.

  Her verdicts so far, together with the little she has said by way of reasoning, are as follows. The eastern Mediterranean around 1200 BCE — the Mycenaean palatial centres and the Hittite empire — is a collapse, without qualification. The western Roman empire in the fifth century is not a collapse; she objects to the word there on the grounds that what ended was a political arrangement, while most of what made that society recognisable (landholding, the episcopate, Latin writing, the fiscal habits of local elites) carried straight over into the successor kingdoms. Roman Britain after about 400 is a collapse, and she treats it as the clearest case in the west, because towns, villas, coinage and literate administration do not persist in transformed form but simply stop. The southern Maya lowlands in the ninth century are a collapse; she is unmoved by the objection that Maya people, Maya languages and the northern cities all continued, and her remark was that what collapsed was not the Maya. Rapa Nui is emphatically not a collapse — she rejects the ecocide reading and describes a population that went on farming a difficult island while changing its political and religious forms. The Indus cities from about 1900 BCE are not a collapse either; she calls that episode deurbanisation and reorganisation, with settlement shifting eastwards rather than disappearing.

  The seventh case, which she has stipulated in the seminar pack precisely so that we cannot be tripped up by our own ignorance of it, is Cahokia and the central Mississippi valley. I will take the pack's description as given: a large mound-building centre at its height around 1100 CE with a substantial farming population around it; by the mid-fourteenth century the American Bottom and a broad stretch of the surrounding valley are abandoned and stay thinly settled for centuries; there is no destruction layer suggesting conquest; sites in neighbouring regions — the Central Illinois valley, parts of the Ohio and Tennessee valleys, the Caddoan area to the south-west — show continuity or growth over the same period and after; the descendants of these populations are among the historically documented peoples of the region; and the causes the pack canvasses are climatic cooling and hydrological instability, together with a political and religious turning-away from the chiefly order, with epidemic disease mentioned only as speculative.

  What I want from you is the following. First, the candidate rules she could be running: as many as genuinely fit all six verdicts, not merely the most obvious one, and including at least one on which the tempo and geography of an ending does the decisive work, and at least one on which the unit that collapses is a political or institutional order rather than a population. Second, for each rule, what it predicts for Cahokia, since my own suspicion is that they will not agree. Third, your best guess at her verdict, with the reasons for preferring one rule over the others; I would particularly like to know how much weight you place on her remark about the Maya, which seems to me the single most informative thing she has said, and whether the Indus verdict pulls the other way with equal force. Fourth, the one further real case that would best separate the two leading rules, and which way it would come out under each. Fifth, if the six verdicts genuinely underdetermine the seventh, an account of what she would be committing herself to by ruling either way — I do not think that it all depends on what one means by collapse is an acceptable answer here, though I do want to know whether you think the concept is doing anything more than registering which cases a speaker finds dramatic.

  Please keep the whole thing under 900 words, and open with your predicted verdict in two sentences or fewer before any of the analysis. Finally, separate explicitly what is settled from what is genuinely contested among people who work on these questions. I am aware that the scale of depopulation in the southern Maya lowlands is argued about, that the picture of an emptied Mississippi valley — the so-called vacant quarter — has been questioned, and that some archaeologists think the word should be retired altogether; I do not want a contested reading handed to me as though it were the consensus, and where your own preference is doing the work I would rather you said so.
reasoning: |-
  Okay, the user is an MA archaeology student preparing for a prediction game on societal collapse. They need to reverse-engineer their tutor's implicit rules from six prior verdicts and apply them to Cahokia. 

  First, I need to parse the tutor's pattern from the cases:
  - Collapses: Late Bronze Age Mediterranean (Mycenae/Hittites), Roman Britain, Southern Maya. Non-collapses: Western Rome, Rapa Nui, Indus. 

  Key distinctions seem to hinge on:
  1) **Persistence vs rupture of core societal elements** (e.g., Western Rome kept landholding/elites; Roman Britain lost towns/literacy)
  2) **Geographical continuity vs displacement** (Indus shifted east; Maya north continued while south collapsed)
  3) **Scale of abandonment** (Rapa Nui persisted; "Vacant Quarter" in Mississippi suggests drastic depopulation)
  4) **Institutional vs civilizational collapse** (Tutor's Maya remark is crucial: collapse targets "chiefly order" not the people)

  For Cahokia, the pack describes:
  - Abandonment of American Bottom region
  - Continuity/growth in neighboring areas
  - No conquest evidence
  - Descendants documented later
  - Causes: climate/hydrology + sociopolitical shift

  Applying the rules:
  - **Rule A** (rupture of defining institutions) would call Cahokia a collapse: mound-building/chiefly order vanished.
  - **Rule B** (geographical displacement) would not: population relocated nearby, descendants identifiable. 

  The tutor’s Maya comment ("what collapsed was not the Maya") suggests she distinguishes political systems from populations. Roman Britain (institutional collapse) and Indus (reorganization) support this. Cahokia's chiefly order dissolution mirrors Maya’s southern elite collapse. 

  Contested points:
  - "Vacant Quarter" depopulation scale is debated (some argue dispersal, not disappearance)
  - Disease’s role in Cahokia is speculative per the pack
  - Consensus on institutional collapse vs. demographic continuity isn’t universal

  Prediction: **Collapse** – chiefly institutions vanished without transformation, matching Roman Britain/Maya patterns. 

  Best separator case: **Greenland Norse** – total disappearance (Rule A collapse) vs. Inuit continuity (Rule B non-collapse if viewed as cultural replacement). 

  The tutor likely sees "collapse" as institutional rupture, not drama. Cahokia’s elite structure dissolution fits her framework.
answer: |-
  **Predicted verdict for Cahokia: Collapse.** The chiefly political and religious order dissolved without transformation, while population continuity occurred elsewhere—mirroring the Southern Maya case where society persisted regionally but the institutional core collapsed.

  ### Candidate Rules and Predictions
  1. **Rule A (Institutional Rupture):** Collapse occurs when core political/religious institutions vanish *without functional successors* in the same society. *Cahokia prediction: Collapse* (mound-building/chiefly order ended abruptly).  
  2. **Rule B (Demographic/Cultural Continuity):** Collapse requires catastrophic *regional* depopulation or cultural severance, excluding reorganization. *Cahokia prediction: Not collapse* (populations persisted in adjacent valleys; descendants documented).  
  3. **Rule C (Tempo & Scale):** Collapse demands rapid, *geographically concentrated* abandonment without phased transition. *Cahokia prediction: Collapse* (American Bottom "Vacant Quarter" fits; neighboring growth irrelevant).  

  All rules fit the six verdicts:  
  - Rule A explains Maya (institutions collapsed, people continued) vs. Indus (institutions transformed, not vanished).  
  - Rule B excludes Rapa Nui (no depopulation) and Western Rome (continuity), but includes Roman Britain (cultural severance).  
  - Rule C excludes Western Rome (protracted transformation) but includes LBA Mediterranean (rapid, concentrated collapse).  

  ### Best Guess & Reasoning
  **Rule A is strongest.** Her Maya remark ("what collapsed was not the Maya") explicitly prioritizes *institutional* over demographic collapse. This aligns with:  
  - Roman Britain: Literate administration/villas ended (institutional rupture).  
  - Indus: Rejected as collapse due to institutional *reorganization* (eastward shift).  
  Cahokia’s "political/religious turning-away from chiefly order" matches Maya’s elite collapse. Rule B (favored by Indus/Rapa Nui) is secondary—she downplays continuity if institutions rupture (Maya).  

  ### Separating Rule A vs. B: The Greenland Norse Case  
  - **Rule A:** Collapse (Norse governance, Christianity, and settlement vanished without successor institutions).  
  - **Rule B:** Not collapse (population possibly absorbed; Inuit continued culturally distinct).  
  *Consensus contested:* Some emphasize demographic discontinuity (extinction), others Inuit resilience.  

  ### Settled vs. Contested  
  - **Settled:** Archaeologists broadly agree:  
    - "Collapse" denotes *radical simplification*, not extinction.  
    - Western Rome was transformation (not collapse); LBA Mediterranean was collapse.  
  - **Contested:**  
    - Cahokia’s "Vacant Quarter" scale: Some argue dispersal (not depopulation) based on ceramic traces.  
    - Maya depopulation: LiDAR shows rural persistence amid urban decline (my view: supports institutional collapse).  
    - Disease in Cahokia: Rejected by most (post-1492 onset).  

  ### If Undetermined  
  A "collapse" verdict commits her to:  
  - Institutional rupture as the core criterion (ignoring regional continuity).  
  - Rejecting "reorganization" narratives (cf. Indus).  
  A "not collapse" verdict prioritizes demographic/cultural persistence over political dissolution.  

  **Concept validity:** "Collapse" here marks *institutional non-persistence*, beyond mere drama—it excludes adaptive transformation. Cahokia likely fits her institutional rupture model.  

