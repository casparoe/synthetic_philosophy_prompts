prompt: |-
  So I'm a philosophy professor — epistemology, mostly, with some philosophy of mind on the side — and I've found myself in a situation that's making me feel like a bit of a hypocrite. For the last year or so I've been using one of the major LLMs pretty heavily in my workflow. At first it was just, you know, "summarize this paper I don't have time to read properly" or "give me five possible objections to this argument I'm drafting." But it's crept. Now I'm having it generate full lecture notes, draft referee reports, even sketch out entire paper outlines that I then fill in and polish. And here's what's bothering me: my output is objectively better than it was two years ago. I'm more prolific, my arguments are tighter, I'm catching objections I would have missed. But I have this nagging sense that I understand less than I used to. The other day a grad student asked me a follow-up about a move in one of my recent papers — something the model had originally suggested as a reply to an objection — and I realized I couldn't really explain why it worked. I'd endorsed it, I'd put my name on it, but I didn't fully grasp it. It was like the understanding was located somewhere outside me and I was just... pointing at it.

  So here's my question, and I'd love a properly philosophical take on this rather then generic advice: is there a principled distinction between using a cognitive tool that genuinely extends your capacities and using one that replaces them in a way that leaves you diminished? And more practically — should I stop, scale back, or am I just being a luddite about this? My colleague in the sciences laughed and said this is exactly what people said about calculators in math class, and that I'd get over it. But that feels wrong to me and I can't quite articulate why. If there's a difference between a calculator and what I'm doing, what is it?
reasoning: |-
  Okay, this philosophy professor's dilemma is fascinating. They're deeply embedded in epistemology and philosophy of mind, yet their personal experience with LLMs has created this profound tension between enhanced productivity and perceived cognitive erosion. 

  First, let's unpack their core discomfort: they're observing an inverse relationship between output quality and personal understanding. The grad student moment is particularly telling - that visceral realization of endorsing an argument they can't reconstruct. It's not just about forgetting details; it's about the outsourcing of philosophical labor that should require deep engagement. 

  The calculator analogy from their colleague feels insufficient because mathematics operates differently than philosophical reasoning. Calculator use preserves the mathematical reasoning process (you still need to understand the problem structure), whereas their LLM use seems to be bypassing the very cognitive processes that constitute philosophical work. 

  What's philosophically rich here is how this maps onto extended mind/cognition theories. When does a tool become so integrated that it constitutes part of your cognitive system? The key distinction might lie in whether the tool requires continuous cognitive engagement versus allowing disengagement. With a calculator, you're still directing the mathematical operations; with their LLM drafts, they're accepting pre-packaged philosophical moves.

  The real danger zone appears when the tool generates the epistemic labor itself - the objection-handling, argument-structuring - which is precisely where philosophical understanding is built. It's like outsourcing digestion and then wondering why you're not nourished. 

  Practically speaking, they might need to recalibrate rather than reject. Perhaps using LLMs for mechanical tasks (summaries, citations) while reserving core argumentation for themselves. The litmus test could be: "Can I reconstruct this without the tool?" If not, they've crossed from extension to substitution.
answer: |-
  Your dilemma cuts to the heart of epistemic agency in the age of AI—and it's far more nuanced than the calculator comparison suggests. Let's dissect this philosophically:

  ### The Core Distinction: Integrated Cognition vs. Epistemic Displacement
  1. **The Calculator Fallacy**  
     Your colleague's analogy fails because calculators execute *mechanical procedures* (arithmetic operations) while you retain full understanding of the *mathematical concepts*. In contrast, your LLM is generating *epistemic content*—objections, arguments, conceptual connections—that constitutes the intellectual labor philosophy demands. When you accept its output without reconstructing the reasoning, you're not outsourcing calculation; you're outsourcing cognition.

  2. **Where the Boundary Lies**  
     A tool genuinely extends cognition when:
     - **You maintain a rich causal connection** to the reasoning process (e.g., using a notepad to track your evolving thoughts)
     - **The tool requires your expertise to function** (e.g., a telescope needing astronomical knowledge to interpret observations)
     - **It preserves your ability to reconstruct justifications** (Clark & Chalmers' "parity principle" applied rigorously).  

     The LLM fails this when:
     - It produces *novel inferential leaps* you didn’t prompt or anticipate
     - You adopt its outputs without retracing the argumentative path
     - Your endorsement becomes a *performative act* ("this sounds right") rather than an epistemic one ("I see why this must be right").

  ### The Phenomenology of Understanding
  What you describe—"pointing at" understanding rather than embodying it—aligns with **Zagzebski's epistemology of understanding**:  
  - Understanding requires *grasping relations* between propositions, not just believing true claims.  
  - By accepting the LLM's arguments without reconstructing their relational architecture, you're accumulating *justified beliefs* while eroding *understanding*.  
  - This creates **epistemic fragility**: your knowledge lacks the resilient web of connections needed for adaptation under scrutiny (as with your grad student).

  ### A Practical Framework: The Epistemic Fidelity Test
  Before using LLM output, ask:  
  1. **Reconstructability**: Could I derive this argument independently *from first principles*?  
  2. **Interrogability**: Can I defend its deepest assumptions against a skilled opponent?  
  3. **Lineage**: Do I know *why* this is superior to alternatives the LLM discarded?  

  If the answer is "no," you're engaging in **intellectual precarity**—gaining efficiency by mortgaging understanding.

  ### Revised Workflow Strategy
  | **Task Type**               | **Current Use**             | **Epistemically Responsible Use**         |
  |----------------------------|----------------------------|------------------------------------------|
  | Lecture Notes              | Generate full drafts        | Generate *skeletal outlines only*; flesh out with original explanations |
  | Referee Reports            | Draft entire evaluations    | Use solely for *identifying gaps*; write critiques yourself |
  | Argument Development       | Accept suggested objections | Use as *possibility generators*; rigorously reconstruct logic before adoption |
  | Paper Outlines             | Adopt generated structures  | Restrict to *topic clustering*; devise argument flow independently |

  ### Why This Isn't Luddism
  What you sense is the **automation of philosophical insight**—a domain where *the process is the product*. Unlike calculators (which automate rote tasks), philosophy *requires* the struggle with concepts to achieve understanding. As **Heidegger warned**, tools ready-to-hand can conceal their ontological impact. Your productivity gains may mask a deskilling of your own noetic capacity.

  **Recommendation**: Scale back strategically. Use the LLM as a *provocateur*, not a proxy. When it suggests an objection, don't adopt it—use it to initiate your own dialectical interrogation. Your unease is epistemological intuition honed by years of studying cognition: heed it. The goal isn't rejection, but ensuring the tool serves *your understanding*, not replaces it. After all, can we truly call it *philosophy* if the _philosopher_ isn't doing the work of wisdom?
