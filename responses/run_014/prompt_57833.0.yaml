    "core_trick": "A mix combines pure strategies' strengths to cover weaknesses, outperforming a mediocre strategy in all scenarios.",
    "belief_link": "A dominated strategy can't be a best response to any belief because the dominating mix yields higher payoff for every opponent action.",
    "order_point": "Deletion order can matter: removing a strategy changes the opponent's incentives, possibly making new strategies dominated.",
    "trap": "Assuming 'unbeatable one-on-one' implies safe against mixes, but mixes actively hedge risks to dominate everywhere."
  }
  ```
