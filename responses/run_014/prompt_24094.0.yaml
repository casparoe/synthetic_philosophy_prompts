  Okay, the user and their friend Ben had a three-hour argument about who should be part of the demos. Ben argues that shared political identity and constitutional commitment define the demos, while the user believes it's about subjection to the state's coercive power. The user wants me to build a case for their view, addressing Ben's objection that the coercion criterion is too inclusive and leads to a global demos. 

  First, I need to understand the core of their disagreement. Ben's position is rooted in communitarian ideas—membership based on shared identity and commitment to the political community. The user's stance aligns with liberal principles, emphasizing the moral claim arising from being subjected to state coercion. 

  The user specifically wants me to argue that the coercion criterion is superior because it's grounded in a concrete moral fact, not contingent cultural elements. They also need a rebuttal to Ben's "too inclusive" objection by proposing a refinement: sustained and pervasive subjection. This refinement should avoid collapsing into Ben's identity view. 

  I recall political theory debates here. Ben's view resembles David Miller's or Habermas' constitutional patriotism, where shared identity binds the demos. The user's perspective echoes Robert Dahl's principle that subjection to coercion necessitates inclusion. The challenge is distinguishing "sustained and pervasive subjection" from residency-based citizenship without relying on identity. 

  Key points to cover: 
  1. Moral foundation: Coercion creates a normative claim for participation rights. 
  2. Problem with Ben's view: Arbitrary exclusion of long-term residents who lack cultural assimilation. 
  3. Refinement: Threshold based on permanence (e.g., residency duration) to exclude transiently affected individuals (like foreign investors or tourists). 
  4. Countering "global demos" fear: Threshold filters out those only marginally affected, preserving demos coherence. 

  I should emphasize that this refinement is structural, not cultural—focused on the degree of state entanglement, not identity. Examples help: A tourist faces coercion temporarily, but an immigrant worker taxed for years has sustained subjection. 

  Word limit is tight (400 words), so I'll avoid digressions. Prioritize clarity in contrasting the coercion criterion's moral weight versus the arbitrariness of cultural belonging. Stress that permanence thresholds are objective and administrable, unlike contested identity assessments. 

  Final check: Ensure the argument doesn't accidentally validate Ben's point. The refinement must stand apart from identity by relying on measurable, coercion-centric factors like residency duration or scope of legal obligations.
answer: |-
  Here’s the case for the subjection-to-coercion criterion, addressing Ben’s concerns:

  Your view ties demos membership to contingent cultural identity or abstract constitutional commitment, which arbitrarily excludes people deeply impacted by the state. Someone paying taxes, obeying laws daily, and facing jail for noncompliance has a fundamental moral claim to a voice in shaping those rules – regardless of their "we-feeling." Grounding the demos in subjection to coercion avoids privileging inherited identity and focuses on the concrete power relationship that justifies political rights: **if the state imposes binding duties, you deserve a say in authorizing them**.

  Ben’s "global demos" objection is valid *only* if we apply the criterion naively. The solution isn’t abandoning coercion, but refining it: **membership requires *sustained and pervasive* subjection to the state’s coercive order**. This excludes those transiently or marginally affected (e.g., foreign investors, tourists, or individuals impacted by spillover effects).

  **Why this refinement works without collapsing into identity:**
  1.  **Objective Threshold:** "Sustained and pervasive" focuses on the *intensity and duration* of state entanglement (e.g., residency, permanent establishment, direct legal liability). It’s measurable (e.g., tax residency rules, habitual abode) – not reliant on subjective identity.
  2.  **Targets the Core Relationship:** It captures those for whom the state is the *primary* framework of daily life and enforceable obligations (long-term residents, workers, citizens), excluding those only incidentally affected by distant decisions.
  3.  **Distinct from Identity:** A lifelong resident lacking "constitutional commitment" or cultural assimilation is *still* pervasively coerced. Including them is a demand of justice, not cultural concession. Conversely, a citizen living permanently abroad, uncoerced by daily laws/taxes, might lose primacy in the demos despite retaining identity/citizenship.

  This criterion **anchors demos boundaries in the morally salient fact of enduring state power over individuals**, ensuring those bearing its heaviest burdens gain rightful representation. It rejects the exclusionary arbitrariness of identity while remaining administrable and coherent.

