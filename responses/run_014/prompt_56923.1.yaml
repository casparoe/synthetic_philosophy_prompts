prompt: |-
  I am three-quarters of the way through a novel whose narrator is a historian seconded to a national commemorations board, where he rules on the inherited myths of defeat. He never states his criterion, and this is deliberate: he believes a principle announced in advance is a species of cheating. The chapters already drafted give his rulings. Masada, inadmissible. The Vidovdan cult around Kosovo, inadmissible. The Alamo, inadmissible. Dunkirk, admissible — although he spends forty pages on the French rearguard left on the beaches and does not permit it to move his verdict. The Foreign Legion's annual commemoration of Camerone in Mexico, admissible, invasion notwithstanding. Verdun, admissible.

  In the chapter I have not yet written he must rule on Gallipoli as Australians keep it: a defeat commemorated as a nation's birth; an evacuation carried off with almost no loss and given almost no mention; the opposing commander folded into the mourning by a consolation attributed to Kemal and carved at the cove and in two southern capitals, whose attribution my researcher cannot pin down; Indigenous men who served in the first contingents and were for decades afterwards kept out of the associations of returned soldiers; and a day that has come to carry the weight of every subsequent war the country has joined.

  Tell me how he rules, and on what principle you take him to be proceeding. Then give me at least one further principle that fits every ruling I have listed and reaches a different verdict on Gallipoli, so that I can see what I have accidentally committed him to. Finally, tell me which myth I should bring before him next if I want an attentive reader to be able to discriminate between those principles.
reasoning: |-
  Okay, the user is working on a novel about a historian on a commemorations board who decides which historical defeats can be officially commemorated. The historian has specific rulings: Masada, Vidovdan, Alamo are inadmissible; Dunkirk, Camerone, Verdun are admissible. Now, the user needs to figure out how this historian would rule on Gallipoli from the Australian perspective and understand the underlying principles.

  First, I need to analyze the existing rulings to deduce the historian's unstated principle. Looking at Masada: it's a defeat turned into a symbol of resistance, but the historian rejects it. Vidovdan involves a mythical narrative around the Battle of Kosovo, also rejected. The Alamo is a heroic last stand myth, inadmissible. So, these seem to be cases where the commemoration elevates a defeat into a foundational myth, often ignoring complexities.

  Now, the admissible cases: Dunkirk is seen as a deliverance, but the historian focuses on the French left behind, yet still approves it. Camerone, a Foreign Legion defeat in Mexico, is commemorated despite being an invasion. Verdun is a brutal stalemate but remembered as French resilience. The common thread here might be that these commemorations acknowledge the defeat without transforming it into a myth of national birth or redemption. They focus on collective endurance or duty rather than creating a foundational narrative.

  For Gallipoli in Australian memory, it's treated as a birth of the nation, with elements like the evacuation's success downplayed, Kemal's contested quote, exclusion of Indigenous soldiers, and carrying the weight of later wars. The historian would likely rule this inadmissible because it fits the pattern of myth-making that obscures historical realities to serve a national identity narrative.

  The principle I deduce is that a defeat is admissible only if its commemoration resists becoming a foundational myth that defines national identity through selective memory. The historian rejects commemorations that use defeat to create an origin story, ignoring uncomfortable truths.

  Next, I need to propose an alternative principle that fits all past rulings but leads to a different Gallipoli verdict. If the principle is that commemoration is admissible only if it honors the tactical execution or minimized loss despite strategic failure, then Gallipoli's evacuation with minimal losses might make it admissible. This contrasts with the historian's likely inadmissible ruling, showing how the principle changes the outcome.

  To discriminate between these principles, the next case should highlight their divergence. The Warsaw Uprising of 1944 fits well. It was a tactical disaster but became a symbol of resistance. Under the historian's principle, it would be inadmissible as a foundational myth. Under the alternative principle focusing on minimizing losses, it would also be inadmissible due to high casualties. But if we consider a case like the Battle of Thermopylae, it's a heroic last stand turned myth. The historian would reject it as a foundational myth, while the alternative might admit it if it's about heroism despite loss. However, Thermopylae might not clearly discriminate. The Warsaw Uprising is better because it's a clear-cut foundational myth with high losses, making both principles agree on inadmissibility but for different reasons. Wait, that doesn't help discriminate. 

  I need a case where one principle admits and the other rejects. For example, the Siege of Jadotville: a tactical success in a strategic defeat. Under the alternative principle (honoring tactical execution), it would be admissible. Under the historian's principle (no foundational myth), it might be inadmissible if it's mythologized. But the user might not be familiar with Jadotville. Another option is the Battle of the Little Bighorn. Custer's Last Stand is a myth of heroism, so historian rejects. The alternative principle might admit it if focusing on the tactical aspect, but it was a total defeat. Maybe not. 

  The Battle of Roncevaux Pass (Roland's death) is a good example. It's a minor retreat turned into a foundational epic (Song of Roland). The historian would reject it as myth-making. The alternative principle (tactical execution) might admit it since the rearguard action allowed Charlemagne's retreat. This creates a divergence: historian says inadmissible, alternative says admissible. That works. So Roncevaux can help readers see the difference between rejecting foundational myths versus valuing tactical success.

  Summarizing: Historian's principle rejects commemorations that become foundational national myths. Alternative principle admits those with successful tactics/minimal loss in defeat. Roncevaux as next case highlights the difference.
answer: |-
  Here is how your historian would rule on Gallipoli, the principle guiding him, an alternative principle leading to a different verdict, and a discriminating case:

  1.  **His Ruling on Gallipoli: Inadmissible.**
  2.  **His Implied Principle:** A defeat is admissible for official commemoration **only if its primary function is remembrance of sacrifice and endurance *without* becoming the foundational, redemptive myth of a nation or group, obscuring historical complexity or serving as an uncomplicated template for subsequent actions.**

  **Analysis & Justification (His Principle):**

  *   **Rejected (Inadmissible):** Masada (Jewish martyrdom/defiance myth), Vidovdan (Serbian martyrdom/divine covenant myth), Alamo (Texan/US heroic sacrifice/birth myth). All transform defeat into a core, often simplified, national or group identity origin story. They serve as a "usable past" for future struggles or claims.
  *   **Admitted:** Dunkirk (remembered as deliverance/survival, not Britain's *birth*; the focus on the French rearguard highlights complexity, preventing pure myth), Camerone (Foreign Legion's code of honor/sacrifice, internal identity myth, not foundational for France itself), Verdun (quintessential symbol of French endurance and sacrifice *within* the existing nation, not its *origin*; the horror is central, resisting easy redemption).
  *   **Gallipoli Application:** The historian sees the Australian Gallipoli commemoration *precisely* as the type of foundational myth he rejects. It's framed as the "birth of a nation" through sacrifice in defeat. The near-lossless evacuation is downplayed to preserve the sacrificial core. The contested Kemal quote is incorporated *into* the comforting myth. The exclusion of Indigenous soldiers highlights the myth's exclusionary nature in forming a specific national identity. Its role as a template for justifying *all* subsequent wars cements its function as a foundational, redemptive narrative. Despite the factual defeat, the *commemoration itself* transforms it into a Masada/Alamo-style origin story for Australia. He would dissect the myth-making process relentlessly but rule the *commemoration as practiced* inadmissible.

  3.  **An Alternative Principle Fitting Past Rulings (Different Gallipoli Verdict):**
      *   **Principle:** A defeat is admissible for official commemoration **if the commemorated event demonstrates exceptional cohesion, duty, or tactical skill *in the face of* the strategic defeat or overwhelming odds, regardless of subsequent mythologization or political context (e.g., invasion).**
      *   **Gallipoli Verdict under this Principle: Admissible.** Here, the focus shifts to the *military conduct* during the defeat itself. The landing, the tenacious holding of positions under horrific conditions against determined defenders, and the remarkably successful (low-casualty) evacuation under extreme pressure all demonstrate exceptional skill, resilience, and unit cohesion *despite* the overarching strategic failure and flawed planning. The subsequent mythologization (birth of nation, etc.) is seen as a separate, perhaps inevitable, cultural process, but not the core criterion. The principle values the "how" of the fighting retreat/survival more than the "why" or the later symbolic weight. Dunkirk (evacuation execution), Camerone (last stand cohesion), and Verdun (endurance) fit perfectly. Masada, Vidovdan, and the Alamo also involved cohesion/duty in the face of defeat, so this principle *also* justifies their rulings. However, it would admit Gallipoli based on the soldiers' conduct during the campaign and evacuation.

  4.  **Discriminating Case: The Warsaw Uprising (1944)**

  *   **Why it Discriminates:**
      *   **Under the Historian's Principle (Anti-Foundational Myth):** Likely **Inadmissible.** The Warsaw Uprising has become a foundational myth of Polish courage, resistance against totalitarianism (both Nazi and Soviet), and national martyrdom/sacrifice. It's central to modern Polish identity, often framed as a necessary, albeit doomed, assertion of sovereignty. This oversimplifies the complex political calculations, the tragic timing regarding the advancing Soviets, the devastating consequences for the city and population, and the arguments *against* the uprising. Its commemoration serves as a powerful template for Polish resistance identity, fitting the pattern of Masada/Vidovdan/Gallipoli.
  *   **Under the Alternative Principle (Cohesion/Skill in Defeat):** Likely **Admissible.** Regardless of the strategic wisdom or political context, the uprising demonstrated extraordinary cohesion, duty, and tactical skill by the Home Army insurgents. They fought street-by-street against overwhelming German forces (including SS units and armor) with limited weapons and supplies for 63 days. Their resilience and sacrifice *in the face* of certain defeat and horrific reprisals were exceptional. The principle focuses on this conduct during the fight itself.

  **Result:** An attentive reader, knowing the historian's previous rulings, would be primed. If he rules the Warsaw Uprising **Inadmissible**, it strongly confirms his principle is focused on **resisting foundational national myths**. If he rules it **Admissible**, it would signal a significant shift or suggest the alternative principle (or something closer to it) is actually at play. The Warsaw Uprising forces a clear distinction because it possesses *both* elements: undeniable military cohesion/sacrifice in defeat *and* its powerful, foundational role in modern national myth.
