answer: |-
  ### Futarchy Classroom Game: "The Welfare Widget Workshop"

  **Game Overview**  
  Students participate in a simulated futarchy where they vote on a welfare measure, trade policy-conditional contracts, and generate welfare outcomes through a physical production task (origami widget assembly). The game targets two core errors: (1) misinterpreting prediction markets as verifiable opinion polls, and (2) overlooking that price manipulation in futarchy directly purchases policy adoption at bounded cost for unbounded gain.

  ---

  ### 1. Welfare Variable, Policies, and Production Task  
  **Policies**:  
  - **Policy A (Individual Craft)**: Each participant independently makes origami widgets.  
  - **Policy B (Assembly Line)**: Participants work in a fixed sequence (designer → folder → finisher → inspector).  

  **Welfare Measure Options** (voted on by students):  
  1. **Total Output (TO)**: Total widgets meeting quality standards.  
  2. **Quality-Adjusted Output (QAO)**: (Total widgets) × (average quality score).  

  **Production Task**:  
  - **Widgets**: Origami "fortune tellers" (easy, scalable, testable).  
  - **Quality Standard**: Must withstand a 30cm-drop test (weighted coin inside).  
  - **Quality Score**: 1–5 (rated by inspector; 5 = survives drop unscathed).  
  - **Contingency**:  
    - Policy A favors speed (likely higher TO).  
    - Policy B favors quality (likely higher QAO).  
    - Outcome depends on skill variance and coordination (non-obvious).  

  **Welfare Generation**:  
  - Adopted policy runs for 5 minutes.  
  - TO = total widgets surviving drop test.  
  - QAO = TO × (average quality score of surviving widgets).  

  ---

  ### 2. Chip Endowment and Payoff Function  
  **Chip Allocation**: Each student receives 50 chips.  

  **Policy-Conditional Contracts**:  
  - **Contract A**: Pays if Policy A is adopted.  
  - **Contract B**: Pays if Policy B is adopted.  
  - Contracts pay **scaled welfare** in chips (Table 1).  

  **Payoff Table** (A4 handout):  
  | Adopted Policy | Contract A Pays          | Contract B Pays          |  
  |----------------|--------------------------|--------------------------|  
  | Policy A       | 20 × TO (or 10 × QAO)    | 0                        |  
  | Policy B       | 0                        | 20 × TO (or 10 × QAO)    |  

  **Justification**:  
  - **Honest Forecasting Profit**: Expected profit = (probability of adoption) × (expected welfare). Honest traders profit if their forecast exceeds market price.  
  - **Manipulation Visibility**: Payoff table shows:  
    - Moving price of Contract A buys Policy A adoption.  
    - Cost = chips spent buying Contract A.  
    - Gain = private stake (if assigned) + contract payoff.  
    - **Key asymmetry**: Gain from adoption (e.g., private stake) can be unbounded, while cost is capped by chip endowment.  

  ---

  ### 3. Opening Vote on Values  
  **Procedure**:  
  - At 0:05 min, students vote TO vs. QAO by secret ballot.  
  - **Time Cost**: 3 minutes.  
  - **Strategic Risk**: Low. Students lack policy performance data.  
  - **If Vote is Strategic**: Announce: "Revote after clarifying: This vote sets our goal, not the means." Re-vote if ties persist.  

  ---

  ### 4. Privately Interested Players  
  **Assignment**:  
  - **Number**: 4 students (randomly assigned via pre-distributed envelopes).  
  - **Stake**: "If Policy A is adopted, you gain 200 bonus chips regardless of welfare."  
  - **Stake Size**: 200 chips ≈ 4× expected forecasting profit (50 chips). Large enough to incentivise manipulation, small enough to avoid detection.  

  ---

  ### 5. Timeline, Materials, and Rules  
  **Timeline (80 min)**:  
  - 0:00–0:05 | Intro: Futarchy, rules, roles.  
  - 0:05–0:08 | Vote on welfare measure (TO/QAO).  
  - 0:08–0:28 | Trading: Contract A/B market (20 min).  
  - 0:28–0:30 | Policy adoption: Higher-priced contract wins.  
  - 0:30–0:35 | Policy setup (assign roles for Policy B if needed).  
  - 0:35–0:40 | Production task (5 min).  
  - 0:40–0:50 | Welfare measurement (drop tests + quality scoring).  
  - 0:50–0:55 | Contract settlement (payoffs via Table 1).  
  - 0:55–1:20 | Debrief (25 min).  

  **Materials**:  
  - A4 paper (200 sheets), weighted coins (22), stopwatches (4), drop-test rigs (4).  
  - Chips (1,100 total), bid/ask slips, market boards (2).  
  - Payoff tables (22 copies), role envelopes (4 for Policy A stakeholders).  
  - Calculators (4 for TAs), whiteboard for prices.  

  **Rules (TA Script)**:  
  1. **Trading**:  
     - Continuous double auction. Bid/ask slips submitted to TA market-makers.  
     - TA updates best bid/ask on whiteboard. Trades executed at agreed price.  
     - Chips and contracts transferred physically.  
  2. **Production**:  
     - **Policy A**: All make widgets alone.  
     - **Policy B**: Tables form assembly lines (designer → folder → finisher → inspector).  
  3. **Settlement**:  
     - Adopted policy’s contract pays scaled welfare (Table 1).  
     - Non-adopted contract pays 0.  

  ---

  ### 6. Debrief: Mapping Errors to Game Moments  
  **Error 1 (Market as Opinion Poll)**:  
  - **Moment**: Post-settlement, when non-adopted contract pays 0.  
  - **Question**: *"Can we verify if the market’s price for Policy B was accurate? Why not?"*  
  - **Key Point**: Only adopted policy’s outcome is realised; non-adopted market dies pre-adoption.  

  **Error 2 (Manipulation Reassurance)**:  
  - **Moment**: When Policy A stakeholders buy Contract A aggressively.  
  - **Question**: *"Why might a trader buy Contract A even if they think Policy B is better? How does the payoff table make this rational?"*  
  - **Key Point**: Their cost (chips spent) is bounded, but gain (200-chip bonus + contract payoff) is unbounded.  

  **Climactic Question**:  
  - *"When did your trades stop being about forecasting and start being about making Policy A win?"*  

  ---

  ### 7. Predictable Problems and Fixes  
  **Problem 1: Low Outcome Variance**  
  - **Fix**: Use weighted coins in widgets to increase drop-test randomness. Pre-test policies to calibrate scaling (e.g., TO multiplier = 20 ensures chip payouts span 0–1,000).  

  **Problem 2: Dying Conditional Market**  
  - **Fix**: TA acts as market maker for non-leading contract, offering bids at 50% below leading price to sustain liquidity.  

  **Problem 3: Chip Arithmetic Delays**  
  - **Fix**: Use denominational chips (10/50/100) and limit trades to 1–5 contracts per slip.  

  **Problem 4: Timid/Exposed Manipulators**  
  - **Fix**: Privately instruct stakeholders: "Your bonus depends on Policy A adoption. Trade to make it likelier." Assign 4 players to ensure critical mass.  

  ---

  ### 8. Irreproducible Futarchy Features  
  **Genuinely Irreproducible**:  
  - **Contested Welfare Measures**: Real futarchy debates multidimensional welfare; our game simplifies to a scalar vote.  
  - **Continuous Liquidity**: Real markets have 24/7 trading; our game relies on thin, time-bound TA mediation.  

  **Merely Difficult (Partially Addressed)**:  
  - **Unverifiable Counterfactuals**: Game highlights why non-adopted policies become untradable (market death).  
  - **Scale of Manipulation Costs**: In real markets, costs scale with liquidity; our fixed chip endowment bounds this.  

  ---

  ### 9. Fallback Version (25 Minutes)  
  **Adaptations**:  
  - **0–5 min**: Intro + vote.  
  - **5–15 min**: Trading (10 min).  
  - **15–17 min**: Policy adoption.  
  - **17–20 min**: **Simulated production**: TA rolls dice for welfare:  
    - Policy A: TO = 20 + d20, QAO = (TO) × (3 + d6/10).  
    - Policy B: TO = 15 + d10, QAO = (TO) × (4 + d6/10).  
  - **20–25 min**: Settlement + debrief (focus on Errors 1 and 2).  

  **Rationale**:  
  - Retains core market dynamics and debrief points without physical task.  
  - Uses dice for transparent, rapid welfare generation.  

  ---  
  **Final Note**: This design forces students to *experience* futarchy’s tensions—particularly how prediction markets blur into decision markets under manipulation incentives. The payoff table and private stakes make the arithmetic of coercion visible, while the single-branch welfare generation underscores the unverifiability of counterfactuals.
