prompt: |-
  Before I came to journalism I spent about eleven years trading derivatives — first market-making rates and energy options, later running a book of bespoke structured trades. What I actually think in is contract language: the underlying and how observable it is, the fixing and who performs it, settlement date and settlement agent, counterparty and clearing arrangement, margin, position limits, who is obliged to quote and what happens to liquidity when nobody is, adverse selection, basis risk, thin and orphan markets, squeeze and manipulation dynamics, and knock-out or otherwise conditional payoff features. My political philosophy is secondhand at best.

  I am writing a long piece on governance by prediction markets — the proposal associated chiefly with Robin Hanson that a polity should, in his slogan, vote on values but bet on beliefs: elected representatives formally define and maintain an after-the-fact measurement of national welfare, speculators trade on which policies would raise it, and the operating rule is that when a betting market clearly estimates a proposed policy would increase expected national welfare, the proposal becomes law. Proponents also rely on conditional contracts — Hanson's called-off bets — to compare welfare under adoption against welfare under non-adoption. I want the critics in the frame too: thin markets, manipulation by interested parties, the impossibility of measuring welfare well enough to settle on it, the charge that legitimate authority cannot be handed to a price, and the objection that money-weighted trading is not anything like a vote.

  Please restate that entire position, and that entire dispute, in my vocabulary — as faithfully as you can manage, contract spec by contract spec. Treat the proposal as if it had landed on my desk as a term sheet, and describe what it would actually take to structure and clear it: what the deliverable is, who fixes it and when, who stands on the other side, what the payoff is denominated in, what happens to the price when the parties best informed about the underlying are also the parties most affected by the decision. Do not give me a primer on prediction markets and do not recite the literature's own summary of itself; I have read both.

  Then give me the residue report, which is the part I actually want. Sort the claims on both sides into three piles: those that translate cleanly into contract and market structure with no loss; those that translate only under distortion, where you should name precisely what gets bent to make them fit; and those with no counterpart in my vocabulary at all. Be disciplined about not smuggling: my framework carries assumptions of its own — that a price is a forecast, that efficiency is the default, that liquidity aggregates better than deliberation, that someone always takes the other side, that a clearinghouse exists — and if you import any of those and present them as translation, say so explicitly at the point of import.

  Test the translation on two concrete cases before you generalise. First, a city council that delegates a corridor upzoning to a market settling seven years out on some composite proxy for resident welfare, where the landlords, developers and long-term tenants who will do most of the trading are also the ones with the sharpest information about the outcome. Second, a decision to impose or lift sanctions where the market's own price feeds back into the calculations of the government being sanctioned, so that the contract changes the probability of the event it is written on.

  Finally, tell me where you come out. Is the residue evidence that this proposal is missing something structural — no settlement asset, no counterparty, no source of authority — or evidence that its critics' objections are less substantive than they sound, once restated as ordinary and soluble contract-design problems? And is there anything my own vocabulary makes visible that the political-philosophy debate appears not to have noticed: about conditional payoffs with no one to declare the condition, about a price being a capital-weighted average rather than a consensus, or about what a market does when the underlying is a decision the market itself helps to make? I am not asking for references or a reading list. I am asking for the translation and an honest account of what did not survive it.
reasoning: |-
  Okay, the user has a very specific and technical background in derivatives trading, and they're writing about governance via prediction markets. They want me to translate this governance proposal into contract language they understand, then analyze what parts of the debate survive this translation.

  First, I need to grasp their request fully. They want the prediction market governance model restructured as a term sheet - deliverables, fixing mechanisms, counterparties, etc. Then they want a "residue report" categorizing arguments into three piles: clean translations, distorted fits, and untranslatable concepts. 

  The user is clearly frustrated with political philosophy abstractions and wants this grounded in market mechanics. Their examples about zoning and sanctions are perfect test cases because they highlight information asymmetry and reflexivity - core trading concepts that political debates often overlook.

  Hmm...the real challenge is avoiding "smuggling" - I mustn't assume market efficiencies or liquidity as givens. When structuring the term sheet, I'll need to:
  - Define welfare as the deliverable (knowing it's fuzzy)
  - Specify who measures it (statistical office?)
  - Handle conditional contracts (called-off bets)
  - Address settlement in a non-monetary asset

  For the zoning example, the key issue is adverse selection: landlords trade with insider knowledge. In sanctions, it's reflexivity - the market itself influences outcomes. These show how the proposal struggles with basic market design problems that traders deal with daily.

  The residue analysis is revealing. Clean translations include liquidity concerns and manipulation risks - standard trading problems. But "legitimate authority" arguments vanish entirely; that's pure political philosophy. And crucially, the user's framework exposes that prediction markets measure capital-weighted expectations, not democratic consensus - a point often missed in academic debates.

  Notably, their trading lens highlights two structural gaps: 1) welfare isn't a settleable asset, 2) no natural counterparty exists for policy bets. These aren't philosophical objections but concrete design failures. The sanctions example proves markets can't handle self-referential events - a classic trading no-go.

  Ultimately, the user's vocabulary reframes the debate: it's not about democracy vs markets, but whether policy outcomes can even be structured as tradeable contracts. The "residue" suggests the proposal's fatal flaw is treating governance like a derivatives market when key elements - deliverables, independence - don't exist. Their expertise reveals what political theorists miss: price discovery fails when the underlying is corrupted by the market itself.
answer: |-
  Here's the term sheet translation and residue report, adhering strictly to your specifications:

  **Proposal Term Sheet: Governance Prediction Market (GPM)**

  *   **Underlying:** National Welfare Index (NWI). Defined prospectively by elected representatives. Observable only ex-post via statistical agency calculation (e.g., 5-year lagged, inflation-adjusted, inequality-weighted GDP+ metric). High basis risk inherent due to definitional drift and measurement error.
  *   **Deliverable:** Cash-settled difference in NWI values between Policy Adoption Date (T) and Maturity Date (T+7 years). Settlement amount = NWI(T+7) - NWI(T).
  *   **Fixing Agent:** National Statistical Office (NSO). Fixing Date: T+7 years + 6 months (allow audit period). Fixing Methodology: Prospectively defined formula, subject to legislative override ("maintenance").
  *   **Contract Type:**
      *   **Primary:** Binary European Call Option on Policy Adoption. Strike = Current NWI. Pays (NWI(T+7) - NWI(T)) * Notional if policy adopted by Execution Deadline (ED), else 0.
      *   **Conditional (Called-Off):** Paired contracts. Contract A: Pays (NWI(T+7 | Adoption) - NWI(T)) if adopted. Contract B: Pays (NWI(T+7 | Non-Adoption) - NWI(T)) if *not* adopted. Settlement contingent on NSO fixing both counterfactual paths simultaneously.
  *   **Settlement Date:** T+7 years + 9 months (post-fixing, dispute resolution window).
  *   **Settlement Asset:** Fiat Currency (e.g., USD). Requires sovereign guarantee on NSO payment capacity decades forward.
  *   **Execution Mechanism:** If price of Primary Contract > Trigger Threshold (e.g., +20 NWI points) consistently for defined period pre-ED, automatic legislative adoption. ("Exercise" by market consensus).
  *   **Counterparties:** Unrestricted speculators. No designated market maker obligation. Natural buyers: Policy proponents, levered directional players. Natural sellers: Policy opponents, volatility sellers, arbitrageurs hedging other exposures. Significant risk of one-sided markets (orphan policy proposals).
  *   **Clearing Arrangement:** Central Counterparty (CCP) mandated. Requires deep sovereign backstop due to extreme tail risk (e.g., war, pandemic invalidating NWI). Margin: Volatility-based, but model risk extreme given long-dated, singular event, undefined volatility surface.
  *   **Position Limits & Manipulation Safeguards:** Per-exchange limits. However, "interested parties" (landlords, unions, corps) are precisely the informed traders. Squeezes possible if dominant position held near fixing. Basis risk between NWI and *true* welfare enables non-price manipulation of the underlying metric.
  *   **Liquidity Provision:** No quote obligation. Secondary market likely thin for non-salient policies. Adverse selection severe: Informed insiders (bureaucrats, lobbyists) trade against uninformed capital.

  **Critics' Position Translated:**

  1.  **Thin Markets:** Low open interest → wide bid/ask → price not indicative of true EV. Orphan markets where no one takes the other side. *Contract Fit:* Standard microstructure issue. Clean translation.
  2.  **Manipulation:**
      *   *Squeeze:* Corner physical NWI inputs near fixing date. *Contract Fit:* Clean (e.g., cornering CPI basket).
      *   *Basis Risk Exploit:* Lobby to change NWI formula pre-fixing to alter settlement. *Contract Fit:* Distorted. "Maintenance" right (legislative override) is an *external* political risk, not typical derivative contract risk. Smuggling: Assuming NWI definition is immutable like a commodity spec.
      *   *Price Pump/Dump:* Wash trades or dominant orders to hit execution trigger. *Contract Fit:* Clean (market manipulation).
  3.  **Unobservable Underlying:** NWI is a noisy, lagged proxy for welfare. Disputes over fixing methodology inevitable. *Contract Fit:* Distorted. Basis risk exists, but welfare is fundamentally *unsettleable* – no ISDA definition, no physical delivery. Smuggling: Treating welfare like oil where delivery specs resolve disputes.
  4.  **Illegitimate Authority:** Delegating lawmaking to price. *Contract Fit:* No counterpart. This is a political axiom, not a contract term. Vanishes.
  5.  **Money-Weighted ≠ Vote:** Capital concentration distorts "belief" aggregation. *Contract Fit:* Clean translation: Price reflects marginal dollar, not marginal voter. Visible in user's framework: Price is a capital-weighted average of expectations, not a consensus.

  **Residue Report (Categorized Claims):**

  | Claim                          | Pile              | Distortion/Note                                                                                              |
  | :----------------------------- | :---------------- | :----------------------------------------------------------------------------------------------------------- |
  | **PROPONENT CLAIMS**           |                   |                                                                                                              |
  | Markets aggregate beliefs      | Clean             | Standard efficient markets hypothesis (EMH) application. Assumes liquidity & no manipulation.                |
  | Conditional contracts solve CM | Distorted         | Requires NSO to fix *counterfactual* NWI (T+7\|Non-Adoption). No mechanism exists; pure modeling fiction.    |
  | Liquidity reveals truth        | Clean (but fragile)| True *if* deep, unbiased liquidity exists. Often doesn't in bespoke/long-dated.                               |
  | **CRITIC CLAIMS**              |                   |                                                                                                              |
  | Thin Markets                   | Clean             | Standard market failure.                                                                                     |
  | Price Manipulation (Trade)     | Clean             | Wash trades, spoofing – standard market ops issue.                                                           |
  | Underlying Manipulation (NWI)  | Distorted         | "Maintenance risk" is political, not contractual. Basis risk is extreme version of index mismatch.           |
  | Welfare Unmeasurable           | **No Counterpart**| Fundamental. No ISDA can define "welfare". Settlement requires an *asset*, not a philosophy. Vanishes.       |
  | Illegitimate Authority         | **No Counterpart**| Pure political norm. No contract term equivalent. Vanishes.                                                  |
  | Money-Weighted Bias            | Clean             | Visible: Price = capital-weighted avg expectation. Not 1-person-1-vote.                                      |
  | Feedback Loops (Reflexivity)   | Distorted         | Market price → alters political action → alters outcome. Not in standard derivatives. Requires new theory.   |
  | **Inherent in Framework**      |                   |                                                                                                              |
  | CCP/Default Risk               | Clean             | Standard, but sovereign tail risk is extreme.                                                                |
  | Adverse Selection              | Clean             | Core trading issue, exacerbated here.                                                                        |
  | Margin Model Risk              | Clean             | Extreme for long-dated, singular events.                                                                     |

  **Concrete Case Stress Tests:**

  1.  **City Corridor Upzoning (Binary Call Option on NWI Proxy):**
      *   *Structure:* Underlying = Composite Resident Welfare Index (e.g., housing cost + commute time + local biz revenue). Fixing Agent = City Stat Office.
      *   *Problem:* Buyers = Developers/Landlords (info: construction costs, demand). Sellers = Long-term tenants? (info: community cohesion, displacement risk). Orphan market: Tenants lack capital to sell effectively.
      *   *Adverse Selection:* Informed landlords trade against passive index funds. Their info edge isn't illegal, but distorts price. Liquidity dries up as their dominance grows.
      *   *Residue:* Critics' "money-weighted ≠ vote" is cleanly visible. Proponents' "belief aggregation" distorted – price reflects developer capital weight, not resident welfare beliefs. Welfare index basis risk is critical.

  2.  **Sanctions Decision (Conditional Contracts A & B):**
      *   *Structure:* Contract A: Pays if Sanctions Imposed & NWI(T+3) > Threshold. Contract B: Pays if Sanctions *Not* Imposed & NWI(T+3) > Threshold.
      *   *Problem:* Market Price → Target Gov't Calculation. If Contract A price rises (market expects sanctions beneficial), target gov't may pre-emptively concede, *preventing* sanctions and triggering Contract B payout. Market changes the event probability.
      *   *Reflexivity:* The tradeable event (sanctions decision) is influenced by the market's own price signal. No clean derivative analogue; options on interest rates affect rates, but via *economic* channels, not *game-theoretic* ones.
      *   *Residue:* Critics' "feedback loops" claim is distorted but *real* here – it's a new market failure mode. Proponents' conditional contracts fail because the counterfactual (NWI(T+3\|No Sanctions) is *changed* by the market's existence.

  **Where I Come Out & What Your Vocabulary Reveals:**

  1.  **Residue as Structural Gaps:** The vanishing points reveal fatal flaws:
      *   **No Settleable Asset:** Welfare isn't oil or USD. Its definition is contested *politically*, not contractually. The "impossibility of measuring welfare" residue is evidence this isn't a soluble contract problem; it's an ontological mismatch.
      *   **No Viable Counterparty for Key Risks:** Who sells "Non-Adoption Welfare" when adoption is the norm? Who provides decades-long liquidity without sovereign coercion? The market lacks natural hedgers.
      *   **No Source of Authority for Counterfactuals:** The conditional contracts require an oracle (NSO) to *declare* an unrealized world state with authority. This doesn't exist.

  2.  **Critics' Objections:** Many *do* translate into standard contract/market problems (thin markets, manipulation, adverse selection, capital-weighting). These are severe but *theoretically* soluble with heavy-handed design (state-subsidized MM, draconian position limits). However, "illegitimate authority" vanishes – it's philosophy, not mechanics.

  3.  **Visible by Your Vocabulary, Missed in Debate:**
      *   **Conditional Payoff Oracle Problem:** Proponents handwave counterfactual fixing. Your framework shows it requires an infallible, incorruptible, politically insulated oracle declaring an *unobserved reality*. No such entity exists or can be structured.
      *   **Price = Capital-Weighted Forecast, Not Truth:** The debate often conflates "market belief" with "consensus." Your lens highlights it's the *marginal dollar's expectation*, heavily skewed by capital distribution and leverage access.
      *   **Reflexivity as Market Failure:** When the underlying event (policy adoption, sanctions) is *strategically influenced* by the market price itself, standard EMH breaks. This is qualitatively different from, say, equity options influencing stock buybacks. It's a feedback loop inherent in *governance* markets specifically.
      *   **Liquidity as Political Artifact:** The debate assumes liquidity will emerge if "important." Your experience shows liquidity is fragile, requires incentives, and is vulnerable to information asymmetry – precisely where policy markets operate. "No one takes the other side" isn't an edge case; it's the baseline for contentious policies.

  **Conclusion:** The residue isn't minor. The core proposal fails translation on the deliverable (unsettleable welfare) and the conditional mechanism (no counterfactual oracle). Critics' substantive objections (thin markets, manipulation, capital-bias, reflexivity) translate cleanly or with minor distortion into severe but *recognizable* contract/market failures. Your vocabulary exposes the fatal conceit: attempting to structure a derivatives contract where the underlying isn't an asset but a political decision, the fixing agent is politically vulnerable, and the market itself alters the event path. The proposal isn't just risky; it's attempting financial engineering on foundations that cannot bear the weight. The residue reveals a category error.
