prompt: |-
  I'm a freelance journalist — AI mostly, with detours into math and crypto — and I've somehow made the shortlist for a six-month mid-career fellowship where they expect you to come out with a piece of writing *and* something that could pass for research. I want to spend it on the debate idea in AI safety: two models argue opposite sides of a question, a human (or a weaker model) judges, and the hope is that the honest side wins even when the judge can't solve the problem, because the judge only has to check the steps. The pitch, as I understand it, is that this gets you way past what a judge could ever verify alone — PSPACE instead of NP, or something like that. I've definately got the shape of the setup. What I need is a proposal I can actually hand in.

  Here's my half-formed angle, and I'd like the whole thing built around it. Everyone treats the killer objection as the obfuscated-arguments problem: the liar buries the false step inside an argument so long and tangled that the honest side can't dig it out in the time available, even though the honest side is right. I think "long" is a red herring. The real question is whether a bad argument always has a flaw that can be localized to a short sub-claim the judge could check on its own. If every flaw is localizable, obfuscation can't win — the honest debater just points at the short bad step. If some flaws are irreducibly global, so that they only show up when you hold fifty steps together at once, then debate has a hole that no amount of extra judge competence plugs. And even in the good case theres a second question hanging off it: finding the localization is itself a search problem, and nothing in the setup says the honest side can do that search cheaply, or that the judge will recognize a correct localization when it's handed one. So: (a) is every flaw localizable, and (b) if so, can the honest debater find the localization inside the judge's attention budget — and is that budget the binding constraint, rather than argument length?

  Write me the two-page proposal. I need the question stated so that it has a determinate answer; why the obvious replies don't settle it (get a better judge, give the honest side more time, let both sides use the same tricks, just cap the length); what I'd actually do month by month — I'm a reporter, not a mathematician, so be honest about what I can pull off, including the interviewing and reporting side, not just the armchair side; what a real result looks like as opposed to a nice essay; and what would count as the project failing. Use two or three concrete test cases to make it bite — a proof with a gap spread across the definitions, a bug that only appears when two modules interact, a claim that misleads only through selective citation, that kind of thing. Don't give me a reading list or citations, I'll chase those down myself, and don't lean on specific papers I probably haven't read.

  At the end, tell me how confident you actually are in the central bet — that the length framing is the wrong one — and single out the part of this you're least sure about.
reasoning: |-
  We are going to write a two-page fellowship proposal. The central idea is to investigate the debate setup in AI safety, focusing on the question of whether flaws in arguments can be localized to short sub-claims that a judge can verify, and whether the honest debater can efficiently find and present such a localization within the judge's attention budget.

  Structure the proposal as follows:

  1. **Title and Overview**: A compelling title and a one-paragraph summary of the project.

  2. **Background and Motivation**: Explain the debate setup and the standard obfuscated-arguments objection. Then present your central insight: that the key issue is not the overall length but the localizability of flaws and the efficiency of finding and presenting the localized flaw.

  3. **Research Questions**: Clearly state the two main questions:
     (a) Is every flaw in an argument localizable to a short sub-claim that the judge can check independently?
     (b) If so, can the honest debater efficiently find such a localization and present it within the judge's attention budget?

  4. **Why the Obvious Replies Fail**: Address why common solutions (like getting a better judge, giving more time, capping length, or allowing both sides the same tricks) do not resolve the core issue.

  5. **Methodology and Work Plan**: Break down the six-month plan month by month, including both theoretical investigation (with concrete test cases) and reporting (interviews with experts). Be realistic about what a journalist can achieve.

  6. **Expected Outcomes and Deliverables**: 
     - A piece of writing (e.g., a long-form article or a report).
     - A research output (e.g., a formalization of the problem, a taxonomy of flaws, or a set of test cases analyzed).

  7. **What Constitutes Success or Failure**: Define what a real result would look like (e.g., a clear answer to the localizability question in some domain, or a demonstration that the attention budget is the binding constraint) and what would count as failure (e.g., the problem is too vague, or the key questions remain unanswered).

  8. **Central Bet and Uncertainties**: At the end, state your confidence in the central bet (that length is a red herring) and the part you are least sure about.

  Now, let's write the proposal in a professional, concise, and compelling manner, keeping it to two pages.

  ---

  **Proposal Title:** The Localizability of Flaws: Unpacking the Core Challenge in AI Debate Protocols

  **Overview:** 
  This project investigates a fundamental assumption in the AI safety debate protocol: that any flawed argument contains a locally verifiable sub-claim which, when exposed, allows a human judge to correctly identify the flaw. I argue that the critical bottleneck is not the overall argument length (as commonly framed) but (a) whether every flaw is localizable to such a short, checkable step, and (b) whether the honest debater can efficiently find and present this localization within the judge's limited attention. Through theoretical exploration and expert interviews, I will clarify the conditions under which debate protocols can reliably scale beyond the judge's unaided capabilities, producing both a journalistic article and a research memo.

  ---

  **Background and Motivation:**
  AI debate protocols propose having two AI models argue opposite sides of a question, with a human (or weak AI) judging. The goal is to leverage the models' capabilities to solve problems that are beyond the judge's direct comprehension, by having the judge only verify individual steps. However, a major objection is that a dishonest model might obfuscate its argument, burying a flaw in a morass of complexity so that the honest model cannot refute it in the allotted time. 

  I contend that the focus on argument *length* is misplaced. The core issue is *localizability*: can every flaw be pinpointed to a short, independently verifiable sub-claim? If not, then even with unlimited time and a perfect judge, the honest model might fail because the flaw is inherently global. Even if localizable, the honest model must be able to *find* and *present* the flawed step efficiently, and the judge must recognize it as such. The judge's attention budget — the cognitive load for verifying a step and following the debate — becomes the binding constraint, not the raw length of arguments.

  ---

  **Research Questions:**
  1. **Localizability**: For a given class of arguments (e.g., mathematical proofs, scientific claims, policy proposals), is every flaw localizable to a short (e.g., O(1) or O(log n) in the problem size) sub-claim that the judge can verify with high confidence?
  2. **Efficiency and Attention**: If flaws are localizable, can the honest debater find such a localization in polynomial time (or within feasible computational bounds)? And can the presentation of the localization fit within the judge's attention budget (e.g., by requiring only a few steps to be checked per round)?

  ---

  **Why the Obvious Replies Don't Settle It:**
  - **Better Judge**: A more capable judge might verify longer arguments, but if a flaw is global (requiring simultaneous consideration of many steps), no judge can check it locally.
  - **More Time**: Extra time helps the honest debater search, but if the flaw is non-localizable, the search is futile. If the search for the localization is intractable, more time may not suffice.
  - **Cap Argument Length**: Capping length prevents obfuscation by verbosity, but a dishonest model might still create a short argument with a flaw that is non-local (e.g., a circularity spread across two steps). It also doesn't address global flaws in inherently complex domains.
  - **Same Tricks for Both Sides**: Allowing the honest side to obfuscate too doesn't help — the judge still must navigate the mess.

  The debate protocol hinges on localizability and efficient localization, which remain open.

  ---

  **Methodology and Work Plan:**
  I will use three concrete test cases to ground the investigation:
  1. **Mathematical Proof with Distributed Gap**: A flawed proof where the error is not in any single step but in a mismatch between definitions spread across the argument (e.g., a proof of P=NP that subtly redefines "polynomial time" in different contexts).
  2. **Software Bug via Interaction**: A bug that only manifests when two modules interact (e.g., a race condition) — no single line or function is flawed in isolation.
  3. **Misleading Selective Citation**: A claim that is wrong because it omits key context, where the flaw is in the pattern of citations, not any individual citation.

  *Month-by-Month Plan:*
  - **Month 1**: Deep dive into debate literature; formalize the localizability concept; draft initial test cases.
  - **Month 2**: Analyze test case 1 (mathematical) with help from TCS experts (interviews); identify conditions for localizability.
  - **Month 3**: Analyze test case 2 (software) with software verification experts; explore if interaction bugs are localizable.
  - **Month 4**: Analyze test case 3 (selective citation) with social scientists; examine localizability in empirical claims.
  - **Month 5**: Synthesize findings; model the attention budget (e.g., how many steps can a judge verify per round?); interview debate protocol designers.
  - **Month 6**: Write the fellowship outputs: a long-form article for a general audience (e.g., *Wired*, *The Atlantic*) and a research memo detailing the localizability conditions and implications for AI safety.

  *Realism*: As a journalist, I will not prove theorems but will: (i) extract insights from experts, (ii) build illustrative examples, and (iii) formalize the problem sufficiently to clarify the trade-offs. The research memo will be a structured argument with test cases, not a technical paper.

  ---

  **Expected Outcomes and Deliverables:**
  - **Writing**: A compelling article (5,000–8,000 words) on the debate protocol's limits and promises, centering on localizability.
  - **Research**: A memo (20–30 pages) answering the two research questions for the test cases, with a taxonomy of flaw types (local vs. global) and conditions under which debate protocols work. A "real result" would be a clear demonstration that, for a specific domain, flaws are/are not localizable, and that the attention budget (not length) is the bottleneck.

  ---

  **What Constitutes Failure:**
  The project fails if:
  - The localizability question remains too vague to answer even for the test cases.
  - The test cases are too disparate to yield general insights.
  - Expert engagement is insufficient to move beyond speculation.

  Success does not require a universal answer but a rigorous exploration that advances the debate.

  ---

  **Central Bet and Uncertainties:**
  I am highly confident (80%) that the *length framing is indeed a red herring* — complexity via obfuscation can always be defeated if flaws are localizable and efficiently findable. However, I am least sure about **efficiency**: even if flaws are localizable, the computational cost of finding the localization might be prohibitive, or the judge might not recognize a correct localization (e.g., if it requires background knowledge). This is the crux — and it might make debate protocols infeasible in practice.

