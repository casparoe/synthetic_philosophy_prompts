prompt: |-
  ok so I've been reading about wheter habitat destruction actually reduces wild animal suffering (since most wild animals die from predation, disease, or starvation, and destroying habitat reduces the population), and I'm not sure what a good answer even looks like. can you write the desiderata that any theory of the net welfare of ecosystems has to meet? like, what cases does it have to get right, what distinctions does it have to respect (total vs average welfare, suffering vs happiness, etc.), and what results from ecology can't it contradict? i want to know which of these are non-negotiable and which are just preferences of one camp. and if some subset is jointly unsatisfiable, say so -- that's the part i care about most. keep it under 800 words, no citations or anything, just the conceptual work.
