prompt: |-
  I am the compliance officer at a mid-sized medical device manufacturer that sells in eight countries. Several times a week I have to rule on gifts, meals, travel and hospitality: things our sales staff want to give to customers and hospital purchasing staff, and things they want to accept from suppliers. The range runs from a sandwich to a week at a resort, and getting it wrong can mean criminal liability for the company and, in some places, for the individual whose initials are on the form. I have about five minutes per request, no legal training beyond our own policy, and no authority to give case-by-case legal advice. Anything above the written threshold goes to the general counsel, who also has to approve the wording of the policy itself, and an external auditor will eventually read that policy and ask why the numbers in it are the numbers they are. I would also like a first-line version I can hand to two junior staff who will field most of the questions before they reach me.

  I have been reading about vagueness, and I think I finally understand why every draft of the policy I write comes out either uselessly vague or dishonestly precise. The difficulty is not that I don't know the law. It is that the predicate at the centre of the whole exercise — bribe, or inducement, or improper benefit, whatever word the local statute uses — seems to have no sharp boundary, and I am being asked to write a sharp boundary into a document and then apply it. A cup of coffee is not a bribe. A briefcase of cash is a bribe. Take the briefcase and remove one dollar, then another: I cannot say where the change happens, and no one I ask can either. My drafts have done one of two things: a numeric cap that is plainly arbitrary at the margin, or a list of factors followed by a note that each case must be judged on its merits, which is exactly what I had before I wrote anything. I have seen four ways of talking about this and I don't know which one I am implicitly relying on: that there really is a line and we simply cannot find it; that there is no line at all and the predicate is neither true nor false of the borderline cases; that the line exists but moves with the context of the person applying it; or that the predicate comes in degrees and nothing needs a line. I suspect the choice matters for what I write, and I want to know whether it matters in practice or only in how I justify myself afterwards.

  What I need is a procedure, not a discussion. Specifically:

  1. A decision procedure in words — a flowchart in order — that I can run on a single request in a few minutes. For each question: what counts as a sufficient answer, what I do when the answer is unclear, and where the procedure stops. Distinguish the stopping points clearly: a clean no; a clean yes; a no I will have to defend to an annoyed sales director; and a hand-off to a person. For each hand-off, say whether it is a hand-off because the question is one of values rather than facts, or because the procedure has run out of information I can get in five minutes.

  2. A method for setting the numbers and categories in the written policy itself, not merely for applying them. This is where I need the philosophy rather than the law. If the predicate has no sharp boundary, what is the status of a rule saying that nothing above X may be accepted? Is it a discovery of where the line always was, a stipulation, or something in between — and does the answer change what the policy's preamble should say the rule is for? State plainly which of the four positions above the procedure presupposes, and whether a procedure built on a different one would behave differently in practice or only in its rhetoric.

  3. Two failures I expect from any single threshold, and what to do about them. First, the continuum does not run only along the size of one gift: there is a second one, the accumulation of many small things from the same source over years, and a cap on individual gifts does nothing about it. Second, the boundary appears to move with context — the same bottle of whisky means something different from a purchasing clerk, from a ministry official, and from a customer who has bought from us for a decade; and something different again while we are bidding for a contract than after we have held it. I want the procedure to handle both without collapsing into 'it depends'. I am also aware that the offence is not purely a matter of degree: there is an intent element that looks all-or-nothing, and I do not want a numeric cap to swallow it.

  4. A rule for the middle. Every draft I have written has an obvious gap between clearly fine and clearly not fine, and the gap is where all the real requests live. I do not want that gap filled with 'use your judgment'. I want a default, a reason for the default, a rule for when it can be overridden, and a specific provision for the case where the person asking me is my own manager.

  Then run the procedure on the following, in this order, showing your work at each step:

  (a) A supplier offers one of our sales representatives two tickets to a sold-out concert, face value 180 each, three weeks before that supplier's contract comes up for renewal. The representative does not vote on the renewal but is the person the supplier deals with day to day.

  (b) A hospital department head with whom we have no contract invites our regional manager to a weekend at a golf resort, roughly 2,500 all in, described as relationship building, while we are preparing a bid.

  (c) A customer who has bought from us for fifteen years sends a box of chocolates, about 25, to his regular representative at the new year. The policy as drafted says staff may not accept anything of value from a customer. The representative will be upset, every competitor does this, and I have already told two other representatives to decline similar boxes this month.

  I expect the procedure to give me an answer I do not like at least once, and I would rather find that out now than in an audit. Finally, tell me what the procedure cannot do: which steps are judgments dressed up as procedure, where it will misfire, and what I should stop expecting a written policy to settle. I do not want a survey of the literature and I do not want citations; I want the thing I can use on Monday morning, together with an honest account of what it is.
reasoning: |-
  Okay, the user is a compliance officer at a medical device company dealing with a really tough problem: how to create a clear, enforceable policy on gifts and hospitality that sits in a legal gray area. They're frustrated because the core concept of a "bribe" has fuzzy boundaries, and their previous attempts at policies either felt arbitrary or uselessly vague. 

  First, I need to recognize their pain points: criminal liability risks, time pressure (5 minutes per request!), no legal training, and junior staff handling initial screenings. They're philosophically stuck on the vagueness problem but need practical solutions, not theory. 

  Hmm... their four questions reveal deeper needs:
  - They want a decision flowchart that actually works in real time
  - They need to justify policy thresholds rationally despite inherent arbitrariness
  - They're worried about loopholes (accumulated gifts, contextual differences)
  - They hate the "judgment gap" where most cases fall

  Smart that they included test cases - shows they've been burned before. And I respect that they explicitly want the procedure to give unpopular answers; they're serious about robustness.

  The core tension: Law requires binary rulings (bribe/not bribe) but reality is shades of gray. My approach should:
  - Embrace that thresholds are unavoidably arbitrary but make them defensible
  - Build in safeguards for slippery slopes and context
  - Give junior staff bright-line rules but reserve subjectivity for higher tiers
  - Treat intent as a separate filter, not absorbed by dollar amounts

  For the philosophy part... epistemic humility feels right: We're not discovering a pre-existing line, we're drawing a practical one. That justifies "arbitrary but reasonable" thresholds. The preamble should say this outright to manage expectations.

  Biggest challenges will be:
  - Preventing the "death by a thousand sandwiches" problem
  - Handling legitimate relationship-building without creating loopholes
  - Making intent actionable when evidence is scarce

  The test cases are perfect stress tests:
  - Concert tickets: high risk due to timing and access, even if nominal value is borderline
  - Golf weekend: clearly over threshold AND problematic context
  - Chocolates: exposes where rigidity breaks real relationships - needs escape valve

  Final note to self: Emphasize what the policy CAN'T fix (e.g., proving intent, cultural nuances) so they don't oversell it to auditors. And remind them that junior staff will need scenario training - no procedure survives first contact with a persuasive salesperson.
answer: |-
  Here is a practical decision procedure and policy framework designed for your constraints, grounded in legal pragmatism and philosophical clarity about borderline cases. It assumes the **"line moves with context"** position (your option 3), as this best reflects enforcement realities while enabling operational rules.

  ---

  ### **1. Decision Procedure: The 5-Minute Assessment Flowchart**
  *(For frontline staff & your quick review)*

  **START:** Receive request for gift/hospitality (give/accept).  
  **STEP 1: Threshold Check**  
  - *Ask:* "Does the value exceed the written policy cap?" (See Section 2 for caps).  
  - *Exceeds?* → **Hand-off to General Counsel (GC)**. *Why:* Legally mandated escalation.  
  - *Within cap?* → Proceed to Step 2.  

  **STEP 2: Intent & Context Filter**  
  - *Ask:* "Is there **any** current/pending business decision (e.g., tender, contract renewal, evaluation) involving this recipient/provider?"  
    - *Yes?* → **Automatic DENIAL**. *Why:* High corruption risk regardless of value.  
    - *No?* → Proceed to Step 3.  
  - *Unclear?* (e.g., "We might bid next year...") → **DENIAL**. *Why:* Risk aversion.  

  **STEP 3: Accumulation & Reciprocity Check**  
  - *Ask:* "In the past 12 months, what is the **total value** from/to this entity to/from **any** employee?"  
    - *Unknown?* → **Hand-off to YOU (Compliance)**. *Why:* Requires system check (>5 mins).  
    - *Known?* → If total value > **50% of annual cap**, → **DENIAL**. *Why:* Prevents "salami slicing".  
    - *Below 50% cap?* → Proceed to Step 4.  

  **STEP 4: Nature & Publicity Test**  
  - *Ask:* "Would accepting/providing this item look suspicious if reported on the front page of the recipient’s local newspaper or disclosed to regulators?"  
    - *Yes?* → **DENIAL**. *Why:* Reputational/legal risk trumps value.  
    - *No?* → **APPROVAL**.  
  - *Unclear?* → **Hand-off to YOU (Compliance)**. *Why:* Contextual judgment needed.  

  **STOPPING POINTS:**  
  - ✅ **Clean YES:** All steps passed (within cap, no business decision, low accumulation, passes publicity test).  
  - ❌ **Clean NO:** Fails Steps 2 or 4.  
  - ⚠️ **Defensible NO:** Fails Step 3 (accumulation) or value just below cap but contextually risky. *(Prepare to cite policy + risk rationale to sales director)*  
  - ↪️ **Hand-off:**  
    - To GC: Exceeds cap. *Reason:* Legal mandate.  
    - To You: Unclear context/publicity or accumulation data missing. *Reason:* Judgment/operational limit.  

  ---

  ### **2. Policy Framework: Setting Caps & Philosophical Basis**  
  **Philosophy:** The predicate ("bribe") has **no sharp boundary**. Your cap is a **stipulated safe harbor**, not a discovered truth. This justifies arbitrary-but-reasonable thresholds.  

  **Method for Setting Caps:**  
  1. **Benchmark:** Adopt the **lowest** statutory/industry threshold from your 8 jurisdictions (e.g., €50/€100 common in EU).  
  2. **Adjust for Inflation:** Annual CPI adjustment.  
  3. **Preamble Language:**  
     > *"These thresholds establish a bright-line safe harbor for routine interactions. They do not define legality exhaustively. Gifts below the cap may still violate law if context indicates improper intent. Gifts above the cap are presumptively prohibited."*  

  **Categories:**  
  - **Meals:** Max €50/person, local working hours only.  
  - **Gifts:** Max €100/year per entity.  
  - **Hospitality:** Max €250/event (e.g., conference dinner). **NO** standalone travel/leisure.  

  **Why this works:**  
  - **Stipulation > Precision:** Caps create efficiency; context filters catch borderline cases.  
  - **Accumulation Guardrail:** 50% annual cap prevents salami-slicing (e.g., €100 cap → €50/year max from single source).  

  ---

  ### **3. Handling Key Failures of Single Thresholds**  
  **Failure 1: Accumulation of Small Gifts**  
  - **Fix:** Step 3 in the procedure (12-month rolling tally). Policy requires tracking all gifts in a central register.  

  **Failure 2: Contextual Shifts**  
  - **Fix:** Step 2 (business decision = instant denial) and Step 4 (publicity test). E.g., whisky for a clerk vs. ministry official: Clerk may pass publicity test; official likely fails.  

  **Intent Element Preservation:**  
  - Step 2 (business decision filter) and Step 4 (publicity test) capture intent proxies. Numeric caps alone don’t swallow intent.  

  ---

  ### **4. Rule for the Middle: The "Gray Zone" Protocol**  
  - **Default:** DENIAL for any gift in the gray zone (passes cap but fails context/accumulation tests).  
  - **Override Condition:** Only if the recipient/provider is **not** in a decision-making role AND the gift is **culturally mandated** (e.g., chocolates at New Year). Requires **written pre-approval by Compliance + 1 level up** (not sales manager).  
  - **Manager Requests:** Same rules apply. Documented approval by **GC** required.  
  - **Why:** Bias toward risk mitigation. Overrides are rare, documented, and accountable.  

  ---

  ### **Test Case Applications**  
  **(a) Concert Tickets (€360)**  
  - Step 1: **Exceeds cap** (€100/year cap) → **Hand-off to GC**. (GC will likely deny: value + renewal timing).  
  - *Your discomfort:* Expected. Value is borderline, but timing is toxic.  

  **(b) Golf Resort (€2,500)**  
  - Step 1: **Exceeds cap** → **Hand-off to GC**. (Automatic denial; also fails Step 2: pending bid).  
  - *Clean NO*.  

  **(c) Chocolates (€25)**  
  - Step 1: Within €100 cap? **Yes**.  
  - Step 2: Business decision? **No** (existing contract).  
  - Step 3: Annual accumulation? Assume €25 total → **Below 50% cap**.  
  - Step 4: Publicity test? **Yes** (reasonable for long-term relationship).  
  - → **APPROVAL**.  
  - *But policy says "no gifts"?* **Override under Gray Zone Protocol:** Culturally expected, non-decision-maker, low value. **Document rationale and pre-approve future instances.** Update policy to exempt "de minimis seasonal gifts <€30 with no business pending."  

  ---

  ### **What This Procedure Cannot Do**  
  1. **False Precision:** Steps 2 & 4 are judgments disguised as procedure. Expect to defend 20% of decisions.  
  2. **Intent Proof:** It infers intent from context; it can’t read minds.  
  3. **Cultural Nuances:** "Culturally mandated" overrides require local input.  
  4. **Enforcement Bias:** Relies on accurate record-keeping (auditors will check logs).  
  5. **Corrupt Creativity:** Won’t catch disguised bribes (e.g., "consulting fees").  

  **Realistic Expectation Setting:**  
  > *"This policy reduces risk but cannot eliminate judgment. Thresholds are arbitrary safe harbors; context can criminalize even minor gifts. Audit defense relies on consistent application and documentation, not philosophical perfection."*  

  **Hand to Junior Staff:** Simplify the flowchart; drill them on test cases. Their role: Step 1 (cap check) → Escalate everything else to you.  

  ---  
  **Monday Morning Ready:** Implement the flowchart, set caps at €50/€100/€250, build a gift register, and add the de minimis override for chocolates. You’ll deny concert tickets and golf trips, approve chocolates with paperwork, and sleep better.
