prompt: |-
  I spent most of my career in experimental physics before turning to philosophy in retirement, and I have been working through the literature on decision theory. I find that my intuitions about cases do not line up neatly with any single position I have read, and I would like to know what principle, if any, they collectively commit me to.

  Here are my verdicts on a range of cases involving small probabilities and large stakes. I have tried to report them honestly, without forcing consistency.

  **Case 1 (the street mugging).** A man on the street asks me for $50, claiming that if I give it to him now, he will use his secret powers to prevent a catastrophe next year that would kill a billion people. I regard the probability that he is telling the truth as vanishingly small — on the order of one in 10^15 or lower, given what I know about the world. I feel no pull whatsoever to hand over the money. The expected utility calculation may say otherwise, but it strikes me as plainly the wrong tool here.

  **Case 2 (the lottery ticket).** A state lottery sells tickets for $2, with a jackpot of $300 million and odds of roughly one in 300 million. The expected value is about negative one dollar. I do not buy lottery tickets, but I do not think there is anything irrational about buying one occasionally for the entertainment. If the jackpot rose to $800 million while the odds stayed the same, bringing the expected value above the ticket price, I still would not buy one — but I would concede that a person who did was making no mistake.

  **Case 3 (the inexpensive precaution).** I learn that an asteroid of a kind that strikes Earth roughly once every 50 million years would, if it struck, cause a mass extinction killing most of humanity — say 7 billion people. A government proposes spending $10 billion on a detection and deflection system that would reduce the annual probability of such a strike by 10%. The expected number of lives saved, per year, is (7 × 10^9) × (1 / 5 × 10^7) × 0.1 = 1.4 lives, at a cost of $10 billion per year. That is a terrible expected value, and I would oppose the program on cost-effectiveness grounds. Something else is available at better value.

  **Case 4 (the modified asteroid).** Same scenario, but now the asteroid in question would not merely kill 7 billion people — it would render Earth permanently uninhabitable, ending all future human generations. Suppose there are 10^16 potential future lives at stake, a number that many philosophers take seriously in longtermist arguments. The expected number of lives saved per year is now (10^16) × (1 / 5 × 10^7) × 0.1 = 20,000 lives. The cost per life saved is $500,000. This is still unattractive by the standards of global health interventions, but I now feel that the program is at least worth considering, not obviously absurd the way Case 3 was. The fact that the stakes involve the entire future of humanity seems to matter to me beyond what the expected-value arithmetic captures.

  **Case 5 (the religious conversion).** A stranger presents me with a theological argument that if I devote my life to a particular deity, I will receive infinite bliss after death, while if I do not, I will receive infinite torment. The argument seems no stronger to me than the mugger's claim in Case 1 — I assign it a probability indistinguishable from zero. I feel no inclination to convert. Like Case 1, this seems like a misuse of decision-theoretic reasoning, infinities aside.

  **Case 6 (the lab result).** I am running an experiment that tests a well-established physical theory. A graduate student shows me a result that, if genuine, would overturn the theory and require a fundamental revision of physics. The result is statistically significant at p < 0.01. But I know that p-values of 0.01 turn out to be false far more often than 1% of the time when the underlying theory is as well confirmed as this one is. I think the rational response is to suspect equipment error and to attempt replication, not to announce a discovery. My reasoning here feels structurally similar to my reasoning in Case 1: the prior probability of the extraordinary claim is low enough that even a seemingly favorable likelihood ratio does not move me to action.

  **Case 7 (the many independent muggers).** One thousand people, each independently, stop me on the street over the course of a year and make the same claim as the mugger in Case 1 — each has secret powers and will prevent a separate catastrophe killing a billion people if I give them $50. I still feel no pull to pay any of them. The independence of the claims does not seem to help; if anything, the replication of the same absurd scenario makes it worse.

  **The hard pair.** Here is what bothers me. I reject Case 1 and Case 5 outright. I also reject Case 3. But I find Case 4 at least reasonable, and I think the person who buys a positive-expected-value lottery ticket in Case 2 is making no mistake. Yet structurally, Case 4 and Case 3 differ only in the magnitude of the stake — one uses 7 billion, the other uses 10^16 — and Cases 1 and 2 both involve an expected-value calculation with a very small probability and a very large payoff. My verdicts seem to track something other than expected utility, but I cannot identify what it is.

  Is there a coherent principle, or a small set of candidate principles, that captures my pattern of verdicts? If so, please state it precisely, identify which of my verdicts it preserves and which it overturns, and explain what the principle says about a case I have not listed: a situation in which the tiny probability can be bounded below by physical or statistical considerations (e.g., a physics experiment at the 5-sigma level for a phenomenon that, while surprising, is not ruled out by any known law), and the stakes, while large, are finite and non-cosmic. I am willing to revise some of my verdicts if the principle demands it, but I want to know exactly what I am giving up.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating puzzle about decision theory with their set of case judgments. They're clearly deeply familiar with both physics and philosophy, as evidenced by their precise numerical examples and references to concepts like p-values and longtermism. 

  First, I notice their core frustration: their intuitive judgments seem inconsistent across structurally similar cases. The street mugging (Case 1) feels absurd while the modified asteroid (Case 4) seems reasonable, even though both involve tiny probabilities of catastrophic outcomes. Similarly, they reject the lottery (Case 2) personally but accept its rationality for others when EV is positive, yet completely dismiss the religious conversion (Case 5) despite its infinite stakes. 

  Hmm... what's special about Case 4? The key difference from Case 3 appears to be the existential stakes - not just lives lost but the permanent end of humanity. This suggests they're implicitly weighing something beyond expected value, perhaps a threshold where consequences become truly irreversible or civilization-ending. 

  The many independent muggers case (7) is particularly telling. Even multiplied by 1000, they still reject it, which rules out simple expected utility aggregation. This makes me think their intuition requires either (a) the probability to be above some epistemic threshold ("not practically zero"), or (b) the scenario to be physically plausible in principle. 

  Their physics background shines in Case 6 - they understand that p-values alone don't override strong priors. This reinforces that their threshold isn't just about probability magnitude, but about whether the claim fits within known physical laws. The street mugger violates physics; the asteroid doesn't. 

  For the hard pair dilemma, I suspect they're wrestling with two conflicting principles: one for "ordinary" risks (where EV dominates) and one for existential threats (where mere possibility matters). The lottery sits in between - finite stakes make positive EV rational for others, but not compelling for them personally. 

  The solution might lie in how we define "practically possible." For them, probability isn't just a number but carries epistemic weight: 10^-15 for the mugger feels like zero because it contradicts physics, while 2×10^-8/year for the asteroid is small but consistent with cosmology. 

  I should also address their unasked question about the 5-sigma experiment case. They'd likely accept acting on such a result because (a) it clears their "physically possible" threshold, (b) the methodology provides error bounds, and (c) while surprising, it doesn't violate fundamental laws like the mugger's claim does. 

  Ultimately, their position resembles a Bayesian with strong priors against physics violations, moderate skepticism toward theological claims, but openness to longtermism when stakes are truly existential and probabilities are non-negligible within our physical understanding. The challenge will be formalizing this "epistemic possibility" threshold they intuitively apply.
answer: |-
  Your pattern of verdicts reveals a nuanced, defensible position that departs from naïve expected utility maximization while avoiding total abandonment of probabilistic reasoning. The core principle appears to be:

  **Epistemic Possibility Principle (EPP)**:  
  *Act on low-probability/high-stakes prospects only if:  
  (1) The scenario is **physically plausible** (doesn't violate well-established laws), AND  
  (2) The probability, while small, is **sufficiently grounded** to avoid being "practically zero" in an epistemic sense, AND  
  (3) The stakes are **existential or irreversible** (affecting the very possibility of future value).*

  This principle preserves all your verdicts while explaining the apparent inconsistencies:

  | **Case** | **Your Verdict** | **EPP Explanation** |
  |----------|------------------|----------------------|
  | **1 (Mugging)** | Reject | ✗ Violates (1): Secret powers defy physics<br>✗ Violates (2): Probability is "practically zero" |
  | **2 (Lottery)** | Accept rationality | ✓ Satisfies (1)&(2): Physically possible, probability grounded<br>✗ But lacks (3): Non-existential stakes → *personal rejection rational* |
  | **3 (Asteroid)** | Reject | ✓ Satisfies (1)&(2)<br>✗ Violates (3): Non-existential stakes (recoverable loss) |
  | **4 (Modified Asteroid)** | Acceptable | ✓ All satisfied: Physically plausible, probability grounded, **existential stakes** |
  | **5 (Religion)** | Reject | ✗ Violates (1)&(2): Contradicts science, "practically zero" probability |
  | **6 (Lab Result)** | Reject | ✗ Violates (2): Extraordinary claim → probability remains "practically zero" despite p-value |
  | **7 (Many Muggers)** | Reject | ✗ Still violates (1)&(2): Multiplied impossibility remains impossible |

  **Resolution of the Hard Pair:**  
  - **Case 4 vs. Case 3**: EPP explains why merely increasing the number of lives (7B → 10¹⁶) isn't sufficient. The *existential/irreversible* nature (loss of all future generations) triggers a qualitative shift in decision-making, overriding pure expected value calculations.  
  - **Case 1 vs. Case 2**: The lottery's physical plausibility and statistically grounded probability make it rationally permissible (though not obligatory), while the mugger's claim fails both criteria.

  **Application to Your Unlisted Case:**  
  *Scenario: A physics experiment detects a 5-sigma signal (p ≈ 3×10⁻⁷) for a surprising but not law-violating phenomenon. Acting on it costs $1B but could save 10⁸ lives if true.*  

  **EPP Analysis:**  
  1. **Physically plausible** (not ruled out by fundamental laws) → Satisfies (1)  
  2. **Probability grounded** (5-sigma provides rigorous lower bound; not "practically zero") → Satisfies (2)  
  3. **Non-existential stakes** (large but finite human cost) → Violates (3)  

  **Verdict:** EPP permits but *does not require* action. Expected utility calculations become relevant:  
  - If cost-per-life-saved aligns with other priorities (e.g., $10/life), acting is rational.  
  - If cost is excessive (e.g., $10M/life), rejection is rational.  

  **What You Might Need to Revise:**  
  - **Case 2 (Lottery)**: EPP accepts positive-EV lotteries as rational, but your *personal reluctance* conflicts with strict rationality if entertainment value is $0. To fully align, either:  
    - Concede that buying the ticket *is* rational (though not obligatory), or  
    - Argue lottery probabilities are "practically zero" *for you* due to psychological framing.  
  - **Case 4**: EPP justifies your openness, but if you reject *all* non-existential high-cost interventions (like Case 3), you must consistently demand **irreversibility** as a necessary condition for overriding cost-effectiveness.

  **Underlying Philosophy:**  
  Your intuitions reflect **pragmatic Bayesianism** with a **threshold for "practical possibility"** informed by physics epistemology. This avoids Pascalian fanaticism (e.g., Case 5) while acknowledging that truly existential risks (Case 4) demand different treatment than recoverable losses (Case 3). The EPP formalizes how scientific plausibility and irreversibility modulate decision-making under extreme uncertainty.

  ---

  **Key Takeaway**: Your judgments are coherent and align with decision theories that:  
  1. Discount **physically impossible** scenarios regardless of stated probability (Cases 1,5,7)  
  2. Treat **extraordinary claims** as having effective probability zero without overwhelming evidence (Case 6)  
  3. Apply **expected utility** to plausible, non-existential risks (Case 2, unlisted physics case)  
  4. Invoke a **precautionary principle** for existential/irreversible threats (Case 4).  

  This positions you closest to **skeptical utilitarianism** with a **longtermist threshold** for catastrophic risks.
