answer: |-
  Here’s a structured set of desiderata for evaluating the adequacy of FEP/PP as a theory of cognition, designed to fuel your seminar discussion. I’ve organized them by category, flagged negotiability, and identified key tensions—culminating in the "Adequacy Paradox."

  ---

  ### **Core Non-Negotiables**  
  *(What FEP/PP MUST satisfy to be more than a redescription)*

  1. **Unified Account of Perception-Action-Learning**  
     - *Requirement:* Explain how perception, action, and learning arise from a single mechanism (prediction-error minimization).  
     - *Case:* Sensorimotor contingencies (e.g., catching a ball requires tight perception-action coupling).  
     - *Failure Mode:* If PP treats action as just "input generation" or perception as passive inference, it collapses into traditional cognitivism.  

  2. **Empirical Traction**  
     - *Requirement:* Generate *testable, unique predictions* beyond post-hoc explanations.  
     - *Case:* Precision-weighting hypotheses (e.g., GABA modulation in anxiety disorders) or prediction-error signatures in fMRI/MEG.  
     - *Failure Mode:* If all results can be "interpreted" as prediction errors (e.g., "the brain predicts everything"), it’s unfalsifiable.  

  3. **Handling Illusions & Pathology**  
     - *Requirement:* Explain why illusions (rubber hand, bistable perception) occur and how disorders (schizophrenia, autism) arise from PP mechanisms.  
     - *Case:* Schizophrenia as aberrant precision-weighting (Friston) vs. autism as hyper-precision (Pellicano & Burr).  
     - *Failure Mode:* If PP can equally "explain" contradictory symptoms, it’s not explanatory.  

  4. **Action as Inference**  
     - *Requirement:* Show that action *is* inference (active inference), not just inference-guided action.  
     - *Case:* Reflex arcs or motor control (e.g., balancing on ice) as minimizing proprioceptive prediction errors.  
     - *Failure Mode:* If action reduces to "fulfilling predictions" without mechanistic specificity, it’s circular.  

  ---

  ### **Negotiable Desiderata**  
  *(Contested within the FEP/PP community)*

  5. **Consciousness**  
     - *Camp Split:*  
       - **Pro:** Seth/Clark (consciousness as controlled hallucination via hierarchical PP).  
       - **Anti:** Hohwy (PP explains cognition, consciousness is extra).  
     - *Minimal Requirement:* If addressed, must explain neural correlates of consciousness (NCCs) like ignition events or global workspace access.  

  6. **Developmental Trajectories**  
     - *Camp Split:*  
       - **Essential:** Jessica Hobson (PP must account for infant learning).  
       - **Peripheral:** Friston (development is implicit in model optimization).  
     - *Challenge:* Explaining how priors bootstrap *without* innate hyperpriors.  

  7. **Social Cognition**  
     - *Camp Split:*  
       - **Key:** Reddy, de Bruin (mirror neurons as predictive alignment).  
       - **Optional:** Most PP work ignores intersubjectivity.  
     - *Hurdle:* Modeling "we"-centric predictions (e.g., joint attention).  

  ---

  ### **The Crucial Tension Points**

  #### **The Most Exclusionary Desideratum**  
  **Empirical Traction**  
  - *Why?* Eliminates "vampire theories" (survive any falsification attempt).  
  - *Excluded:* Grandiose claims (e.g., "FEP explains culture") without specific test cases.  

  #### **Jointly Unsatisfiable Pair?**  
  **Unification vs. Biological Plausibility**  
  - *Conflict:*  
    - *Unification* demands one mechanism (prediction-error minimization) for *all* cognition.  
    - *Biological Plausibility* requires PP to align with neural anatomy (e.g., cortical microcircuits, neuromodulators).  
  - *Tension:* PP often posits uniform cortical algorithms, but biological systems show *heterogeneity* (e.g., cerebellum vs. neocortex). If PP forces homogeneity, it becomes biologically implausible; if it allows heterogeneity, unification weakens.  
  - *Case:* PP struggles to explain why hippocampus doesn't fit the 6-layer cortical hierarchy.  

  ---

  ### **The Adequacy Paradox: Is FEP/PP Doomed?**  
  **The Meta-Problem**:  
  - *Desiderata 1 (Unification)* + *Desideratum 2 (Empirical Traction)* may be incompatible.  
  - *Why?* Unification pushes FEP/PP toward generality (mathematical framing), but empirical traction demands specificity (concrete predictions).  
  - **Result**: The more universal PP becomes (e.g., "all systems minimize free energy"), the less it predicts about cognition specifically. Conversely, narrow PP models (e.g., visual perception) sacrifice unification.  

  ---

  ### **What to Bring to Class**
  1. **The List**: Present desiderata as a rubric. Ask: *"Which of these does FEP nail, and where does it resort to handwaving?"*  
  2. **The Tension**: Debate: *"Can a theory be both universally unifying and empirically precise?"*  
  3. **The Paradox**: Challenge: *"If FEP/PP resolves the unification-specificity tension, is it still FEP/PP—or just good neuroscience?"*  

  **Key References to Flag**:  
  - Clark (2016): Pushes unification but admits FEP is "largely metaphorical."  
  - Friston (2019): Claims FEP is a "law" but faces "everything bagel" criticism.  
  - Colombo & Wright (2018): Argues PP is unfalsifiable without precision-weighting commitments.  

  This framework forces the class to confront whether FEP/PP is a revolutionary paradigm or a provocative lens—and what "explanation" means in cognitive science. Good luck!
