  Considering the user's deeper needs: they likely want to provoke critical discussion in class. Highlighting conflicts, like whether PP can truly unify cognition without being unfalsifiable, would spark debate. Also, pointing out that no theory might satisfy all desiderata could be a powerful conclusion.

