  Starting with non-negotiable criteria: FEP must provide a unified account of perception, action, and learning. If it only covers one area, it's just rebranding existing models. Also, it needs empirical traction—concrete predictions that can be tested, like precision-weighting in prediction errors. Without falsifiability, it's just a mathematical framework.

  Next, handling empirical constraints. The theory must explain illusions like the rubber hand or binocular rivalry, as these showcase prediction errors. It also needs to account for action-oriented cognition, such as how active inference minimizes prediction errors through movement. Ignoring embodied aspects would be a deal-breaker.

  Now, challenges like explaining development and neurodiversity. If PP can't handle how children's predictive models evolve or conditions like autism, it's insufficient. Similarly, accommodating different timescales (fast perception vs slow learning) is crucial. Hierarchical structure is a common solution here.

