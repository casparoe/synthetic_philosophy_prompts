  First, I recall Wolf's main points from her paper "Moral Saints." She critiques the idea that being morally perfect—always maximizing others' good—would lead to a well-rounded, flourishing life. The blog's summary captures the core idea: a moral saint would sacrifice personal interests like reading novels or friendships, leading to a less rich life. But the user is right to question the phrasing like "worse person" and "pathological." Those terms might be too strong.

  Looking at the blog's language: "worse person overall" is problematic. Wolf emphasizes a lack of personal flourishing, not moral deficiency. Calling someone a "worse person" implies moral failing, which isn't her point. She's saying such a life lacks balance, not that the person is morally worse. The term "pathological" is also too strong. Wolf might describe it as unattractive or lacking in personal virtues, but not pathological in a clinical sense. 

  The phrase "morality is just one value among many" oversimplifies her view. Wolf doesn't dismiss morality's importance but argues against letting it dominate all other values. The blog's conclusion that it's not irrational to pursue hobbies instead of charity is accurate, but the user is right to question if this fully captures her nuanced stance. 

  The user seems familiar with philosophical concepts but wants clarity on Wolf's exact position. They might be using this for academic purposes or personal understanding. Their deeper need is ensuring they represent Wolf correctly, avoiding misrepresentation in their own work or discussions. They value precision in philosophical arguments and might be concerned about oversimplification in popular summaries. 

