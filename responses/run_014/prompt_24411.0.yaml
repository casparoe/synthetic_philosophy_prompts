answer: |-
  Here’s the prep sheet for your Platonist character, designed as tactical notes for the Q&A. The objections are ordered by escalating hostility, with replies reflecting her intellectual honesty (and dialectical limitations):

  ---

  **PLATONIST Q&A DEFENSE: WORKSHOP OBJECTIONS**  
  *Key Weakness: Epistemology rests on underdefended "a priori intuition"*

  ### **1. First Naturalist (Dr. Chen, Evolutionary Naturalist)**  
  **Objection:** "You posit a *non-natural cognitive faculty* that somehow ‘intuits’ abstracta. But evolutionary biology constrains all human cognition. How does this faculty arise via natural selection? If it can’t be explained naturalistically, it’s an explanatory dead end."  
  **Your Reply:** "Evolution explains our *capacity* for reason, not its *objects*. We intuit mathematical truths because our rationality aligns with abstract reality—much like perception aligns with the physical."  
  **Soft Spot:** "Aligns with" is vague. **Expect Pushback:** "Alignment without causal contact is magical. How does natural selection ‘select for’ tracking *acausal* objects?"  
  **Concede:** That evolution shaped our cognitive tools. **Hold:** That math’s truth is discovered, not shaped by utility.

  ### **2. Second Naturalist (Prof. Rossi, Indispensability Advocate)**  
  **Objection:** "Even if we grant abstracta, why go beyond *Quinean naturalism*? Math is indispensable to science, so we commit to it *empirically*. Your ‘a priori intuition’ adds nothing but mystery. Why inflate ontology unnecessarily?"  
  **Your Reply:** "Indispensability can’t explain pure math’s truth—like the infinitude of primes or the independence of CH. We know these *without* empirical application."  
  **Soft Spot:** "Know how?" **Expect Pushback:** "Without intuition, what’s your *evidence*? You’re just asserting unverifiable truths."  
  **Concede:** That applied math’s ontology is secured empirically. **Hold:** That pure math requires a non-empirical foundation.

  ### **3. Structuralist (Dr. Finch, Ante Rem Type)**  
  **Objection:** "You’re reifying *objects* unnecessarily. Numbers aren’t ‘things’—they’re positions in a structure. Structuralism grants objectivity *without* your mysterious abstract particulars. Benacerraf’s dilemma *only* hits object-based Platonism."  
  **Your Reply:** "But structures *are* abstract objects! And without objects, what instantiates structures? Your ‘positions’ are placeholders for entities."  
  **Soft Spot:** "Placeholders aren’t entities." **Expect Pushback:** "Structures are ontologically prior. You’re stuck in bad metaphysics."  
  **Concede:** That "object" may be misleading. **Hold:** That structures exist mind-independently and are intuited.

  ### **4. First Naturalist (Chen Again, Pouncing)**  
  **Objection:** "You keep saying ‘intuition’, but what *is* it? Is it conceptual? Perceptual? If it’s a primitive faculty, why trust it? We distrust mystical ‘insight’ in every other field. This feels like special pleading for math."  
  **Your Reply:** "Intuition is rational insight—self-authenticating when clear, like grasping that modus ponens is valid. We refine it via proof, but it starts with direct apprehension."  
  **Soft Spot:** "Self-authenticating" sounds dogmatic. **Expect Pushback:** "So circularity is a feature? How is this not intellectual intuitionism?"  
  **Concede:** That intuition can err (e.g., naive comprehension). **Hold:** That corrected intuition still accesses truth.

  ### **5. Fictionalist (Dr. Vance, Deflationary & Smug)**  
  **Objection:** "This is all a dead end. Realism forces you into an epistemological quagmire while explaining *nothing* about practice. Math is a useful fiction—we don’t *believe* theorems, we *use* them. Your ‘intuition’ is just familiarity with the rules of the game."  
  **Your Reply:** "Then why is math unrevisably *true*? Fictions can’t explain why 2+2=4 *couldn’t* be otherwise, or why we discover—not invent—proofs."  
  **Soft Spot:** "Unrevisable truth" claims. **Expect Pushback:** "Is CH ‘unrevisably true’? You appeal to intuition, but it delivers contradictions!"  
  **Concede:** That some truths are provisional. **Hold:** That core math (e.g., PA) is non-negotiable.

  ### **6. Structuralist (Finch, Final Cut)**  
  **Objection:** "Even if structures exist, how does *intuition* access them *a priori*? If structures are abstract, causal interaction is impossible. Benacerraf’s dilemma *still* applies—you’ve just swapped ‘objects’ for ‘structures’ without solving epistemology."  
  **Your Reply:** "Intuition isn’t causal! It’s a rational relation. We ‘grasp’ structures via their formal properties—like seeing logical consequences."  
  **Soft Spot:** "Grasp" is undefined. **Expect Pushback:** "‘Rational relation’ is an empty metaphor. *How* does cognition hook onto abstracta?"  
  **Concede:** The mechanism is opaque. **Hold:** That successful practice confirms its reliability.

  ---

  ### **The Question You Hope Nobody Asks**  
  **Objector:** Likely **Chen** or **Vance**, with a dismissive tone.  
  **Question:** "If intuition tracks abstract truth, why does it *evolve*? Gödel thought it might be a physical organ, but you reject that. So: *What is the metaphysical implementation of this faculty?* Without an answer, ‘intuition’ is a blank check for dogma."  

  **Why It’s Fatal:**  
  - She has *no* model—not computational, neural, or idealist.  
  - Admitting ignorance ("We don’t know how it works") validates naturalist/fictionalist dismissals.  
  - Her fallback ("But it *works*!") sounds like faith, not philosophy.  

  **Damage Control:**  
  - **Do NOT say:** "It’s a primitive."  
  - **Say:** "Our grasp *is* mysterious—like consciousness. But denying math’s truth because epistemology is hard is surrender."  
  - **Then pivot hard:** "If your alternatives can’t explain the necessity of math, *they’re* the dogmas." (Risky—may backfire.)

  ---

  **Character Notes for the Scene:**  
  - She should sound increasingly cornered but defiant. Let her repeat "self-evident" or "rational insight" with less clarity each time.  
  - Have her concede *only* where failure to do so would seem irrational (e.g., evolution’s role, intuition’s fallibility).  
  - Her strongest moment: When attacking fictionalism’s inability to explain necessity ("2+2=4 isn’t a *useful convention*—it’s inescapable!").  
  - Her weakest: Any attempt to define "intuition" beyond hand-waving. The room should audibly sigh here.  

  This keeps objections grounded in the room’s dynamics while exposing her core vulnerability: an epistemology built on intuition that she can’t—and won’t—defend beyond assertion.
