answer: |-
  That's a fantastic and deep debate! Your friend is absolutely pointing to a genuine, often underappreciated, distinction. While "intuitionistic logic" (as a formal system) and "constructive type theory" (like CIC) are *inspired by* and *compatible with* Brouwer's philosophical intuitionism, they **are not the same thing**. Brouwer's original conception is fundamentally a **philosophy of mathematics** with deep epistemological and ontological commitments, while modern type-theoretic constructivism is primarily a **methodology for proof and computation**, often agnostic about those deeper philosophical questions. Here's a breakdown of the key differences and points of convergence:

  ## Core Tenets of Brouwer's Original Intuitionism

  1.  **Mental Constructions as Foundation:** Mathematics is *not* the discovery of pre-existing Platonic truths. It is an activity of the human mind, creating mathematical objects ("mental constructions") step-by-step in time. A mathematical object *exists* only if it has been mentally constructed.
  2.  **Anti-Realism / Idealism:** There is no independent mathematical reality "out there." Mathematical truth is *constituted* by our mental constructions and proofs. Truth is identified with (constructive) proof.
  3.  **Primacy of Time and the "Creative Subject":** The fundamental intuition is the experience of time itself (the "bare two-oneness" – the falling apart of a life moment into qualitatively distinct parts, one giving way to the next). All mathematical activity stems from this temporal consciousness of a "creating subject."
  4.  **Rejection of Formalism and Classical Logic:**
      *   Formal systems (like axiomatic set theory) are *post hoc* descriptions of mathematical activity, not its foundation. They are incomplete and can never capture the full potential of mental construction.
      *   The Law of Excluded Middle (LEM - `P ∨ ¬P`) and its consequences (like double negation elimination) are *not* universally valid. They presuppose that every mathematical property is already decided (true or false) in some independent reality, which contradicts the constructive, temporal nature of mathematics. Applying LEM to infinite domains is particularly problematic (e.g., "Either there is a sequence of seven 7s in the decimal expansion of π, or there isn't" – we don't have a construction for either disjunct, so asserting the disjunction is meaningless).
  5.  **Free Choice Sequences:** Brouwer introduced sequences where the mathematician freely chooses each element one after another, potentially forever. These sequences aren't predetermined by a law or rule. This was crucial for his reconstruction of analysis.
  6.  **The Creating Subject Arguments:** Brouwer used explicit arguments involving an idealized mathematician (the "creating subject") performing constructions over time to prove results that are classically valid but require non-constructive principles. These are deeply tied to his views on time and consciousness.

  ## Bishop's Constructivism and Modern Type-Theoretic Constructivism (CIC, Martin-Löf Type Theory)

  1.  **Focus on Constructive Proof:** The core principle is that to prove an existential statement `∃x P(x)`, you must provide an algorithm (or method) to *construct* such an `x` and prove `P(x)` holds for it. To prove `A ∨ B`, you must either prove `A` or prove `B` (and know which one). Disproof (`¬A`) is interpreted as "assuming `A` leads to absurdity (`⊥`)".
  2.  **BHK Interpretation Formalized:** The Brouwer-Heyting-Kolmogorov interpretation provides the *semantics* for the logical connectives in terms of what constitutes a proof/program for them. Type theory (especially Martin-Löf's) provides a rigorous *syntax* and *foundational system* realizing BHK: proofs are literally programs (terms), and propositions are types (the sets of their proofs). `A ∧ B` is the Cartesian product type, `A → B` is the function type, `∃x:X P(x)` is the dependent sum type (Σ-type), `∀x:X P(x)` is the dependent product type (Π-type).
  3.  **Formalism Accepted:** Unlike Brouwer, Bishop and type theorists *embrace* formal systems. Bishop saw formalism as a necessary tool for ensuring precision and clarity in constructive mathematics. Type theory provides a powerful *computational* formalism where proofs are executable.
  4.  **Pragmatic Emphasis (Bishop):** Bishop famously divorced constructivism from Brouwer's philosophical baggage. His motto was "**Meaningful mathematics is mathematics with numerical content.**" He focused on developing as much core mathematics (analysis, algebra, topology) as possible constructively, emphasizing positive results and algorithms, rather than philosophical justifications. He saw LEM as *practically unreliable* for obtaining computational content.
  5.  **Ontological Neutrality (Type Theory):** Modern type theory (CIC, MLTT) is largely *agnostic* about the deeper philosophical questions. It provides a framework for:
      *   **Epistemic Constructivism:** What counts as valid proof? (Answer: Providing explicit constructions/witnesses/programs).
      *   **Computational Meaning:** What does a proof compute? (Answer: The program inherent in the proof term).
      *   **Mathematical Objects:** Sets/Types are defined by their rules of formation and introduction (construction) and elimination (use). The ontological status of these objects (mental constructions, abstract entities, etc.) is usually left open. Type theory *can* be interpreted in an anti-realist, Brouwerian way, but it doesn't *force* that interpretation. A realist can use it too, seeing types as describing a constructive aspect of a Platonic reality.
  6.  **Absence of Brouwerian Specifics:** Type theory generally does *not* incorporate:
      *   The primordial intuition of time as the foundation.
      *   The concept of the "creating subject" as an active, temporal agent.
      *   Free choice sequences in their full Brouwerian sense (though coinductive types or bar induction can model aspects).
      *   Creating subject arguments.

  ## Where They Diverge and Where Anti-Realism Gets Preserved/Deflated

  1.  **Philosophy vs. Methodology:** This is the fundamental split.
      *   **Brouwer:** Deeply philosophical anti-realist idealism. Mathematics *is* mental construction. Formalism is secondary/descriptive.
      *   **Type Theory (CIC/MLTT):** A formal system enforcing a constructive *methodology* for proof and computation. The *why* (philosophy) is external. It *can be used* by an anti-realist, but it doesn't *require* anti-realism.
  2.  **The Role of Formalism:**
      *   **Brouwer:** Rejected formalism as foundational. Saw it as inherently limiting and unable to capture genuine mathematical thought.
      *   **Type Theory:** Embraces formalism *as* the foundation. Mathematics *is* done within the formal system. The computational aspect gives the formalism intrinsic meaning (via Curry-Howard).
  3.  **"Constructive" as Property of Proofs vs. Objects:**
      *   **Brouwer:** Constructiveness is an ontological property of mathematical *objects themselves*. An object exists only *because* it has been mentally constructed. Proofs reveal this construction.
      *   **Type Theory:** Constructiveness is primarily a property of *proofs* (or programs). A proposition is "true" if we have a proof term inhabiting its type. The objects (terms of base types) are constructed by the rules. **Does it lose anything?** From a *purely mathematical* perspective (Bishop's view), often no. You recover the core results and computational content. From *Brouwer's philosophical perspective*, **yes, crucially**. It loses the grounding in the temporal consciousness of the creating subject and the idea that mathematical existence *is* that mental construction process. It reduces the ontological claim to a methodological/epistemic one. The formal system defines existence (provability/constructibility within the system), not the mind of the mathematician.
  4.  **Anti-Realism:**
      *   **Preserved:** Type theory *preserves* the core anti-realist **epistemic** claim: "Truth is proof" (via the propositions-as-types correspondence: a proposition is true iff its type is inhabited). It provides a framework where mathematical statements lack truth values independent of our ability to construct proofs. The computational interpretation aligns well with an anti-realist view of mathematical entities as products of our constructive activity.
      *   **Deflated:** Type theory generally **deflates** Brouwer's radical ontological anti-realism and idealism. It doesn't require mathematics to be grounded in the *actual* mental processes of a mathematician experiencing time. The constructions are defined *within the formal system* by rules. While inspired by mental acts, they become abstract syntactic/semantic entities within the system. The "mind" doing the construction is the formal system itself, not necessarily a human consciousness.
  5.  **Specific Concepts:** Brouwer's free choice sequences and creating subject arguments find no direct, natural analogue in standard type theory. While aspects can be modeled (e.g., coinduction for infinite structures, bar induction for choice sequences under constraints), the full philosophical weight and connection to temporal consciousness are lost. Type theory provides alternative constructive foundations for analysis (e.g., via Cauchy sequences with explicit moduli of convergence), but these are different from Brouwer's approach.

  **Conclusion:**

  *   **Brouwer's Intuitionism:** A profound, radical philosophy of mathematics centered on mental construction in time by a creating subject, rejecting formalism and classical logic on deep ontological grounds.
  *   **Formal Intuitionistic Logic / BHK:** A semantics/logical framework capturing the *proof conditions* inspired by Brouwer, but abstracting away from the specific philosophy of mind and time.
  *   **Bishop-style Constructivism:** A pragmatic, formalist-friendly methodology for mathematics focusing on computational content and positive results, explicitly rejecting Brouwer's philosophical foundations while maintaining his core mathematical constraints (no LEM for existence/disjunction).
  *   **Type-Theoretic Constructivism (CIC/MLTT):** A powerful formal foundation realizing BHK via Curry-Howard. It enforces constructive proof *as computation* within a rigorous system. It preserves the anti-realist *epistemic* link ("truth = proof") and is incompatible with realism that requires non-constructive truths. **However, it generally deflates Brouwer's specific ontological idealism and his rejection of formalism.** It treats constructiveness as a property of proofs/programs within the system, not necessarily as a description of mental acts grounded in temporal consciousness.

  **Your friend is right:** Calling CIC "Brouwer's intuitionism" is a significant oversimplification. CIC captures the *logical consequences* and *proof methodology* that Brouwer advocated for, formalized via BHK and Curry-Howard. But it replaces Brouwer's philosophical foundation (mental constructions in time) with a formal, computational foundation (proof terms in a type system). It preserves the *rejection of non-constructive existence proofs* and the *computational meaning*, but loses the *specific philosophical grounding in the creating subject's experience of time*. Type theory is "intuitionistic" in the sense of using intuitionistic logic and constructive proof, but it's not "Brouwerian" in its deepest philosophical commitments. The divergence is primarily ontological and meta-mathematical.
