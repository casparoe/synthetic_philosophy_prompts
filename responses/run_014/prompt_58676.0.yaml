  ### Joint Statement on Causation: Counterfactual Difference-Making and Interventionist Perspectives

  **Part 1: Shared Commitments**  
  We jointly affirm that:  
  1. **Core Explananda**: Any theory of causation must explain (i) how causal claims underpin explanation, prediction, and responsibility attribution; (ii) how causes distinguish themselves from mere correlates by making a difference to their effects; and (iii) how causation handles preemption, redundancy, prevention, and masking.  
  2. **Role of Tools**: Counterfactuals and interventions are mutually reinforcing tools. Counterfactuals provide a semantic foundation for causal reasoning, while interventions operationalize this through controlled manipulation. Both are necessary for evaluating causal claims, with interventions serving as a precision-enhancing lens for counterfactual reasoning.  
  3. **Problem Cases**: An adequate view must resolve:  
     - **Redundancy (Case A)**: Where multiple sufficient causes coexist, the theory must clarify individual causal contributions.  
     - **Prevented Prevention (Case B)**: Where an event (monitor’s action) indirectly enables an outcome (update) by removing a blocker (fault), the theory must account for causation without direct contact.  
     - **Adaptive Compensation (Case C)**: Where a mechanism (reflex) masks the effect of a variable (salt) under normal conditions, the theory must address hidden dependencies and background stability.  
  4. **Case Verdicts**:  
     - **Case A (Pumps)**: Neither pump individually caused the flow, as each was redundant given the other.  
     - **Case B (Monitor)**: The monitor’s action caused the update by preempting the fault.  
     - **Case C (Salt)**: Under normal conditions (reflex active), salt intake did not cause blood pressure changes.  

  **Part 2: Remaining Disagreements**  
  We disagree on the following theses, each stated in its proponent’s terms:  
  - **Counterfactual Difference-Making (CDM)**: "Whether an event \(C\) (e.g., pump operation) causes an event \(E\) (e.g., flow) depends on whether \(E\) would have failed to occur, or would have been different, in the closest possible world where \(C\) is absent or altered—holding fixed the actual laws and non-causal background conditions, except those logically entailed by \(C\)’s absence."  
  - **Interventionist (INT)**: "Whether a variable \(X\) (e.g., salt intake) causes a variable \(Y\) (e.g., blood pressure) depends on whether an ideal manipulation of \(X\)—setting \(X\) to a value while holding fixed other variables not causally downstream of \(X\)—would change \(Y\) in a causal model representing the system’s structure."  

  **Part 3: Cruxes**  
  We identify two cruxes, with tests and expectations:  
  1. **Crux 1: The Role of Background Conditions in Token Causation**  
     - **Sub-Question**: Must causal judgments in redundant systems (like Case A) hold fixed only *actual* background conditions (e.g., the other pump’s operation), or can they stipulate non-actual but possible backgrounds (e.g., disabling both pumps) to assess necessity?  
     - **Test**: Apply both views to a variant of **Case A** where Pump 1 fails at \(t_1\), Pump 2 operates normally until \(t_2\), but a third factor prevents Pump 2 from starting if Pump 1 fails *before* \(t_1\). Flow occurs.  
       - *CDM Expectation*: Pump 1’s operation caused flow because, in the closest world where Pump 1 fails, the third factor activates, preventing Pump 2 from operating, so flow fails.  
       - *INT Expectation*: Pump 1’s operation did *not* cause flow, as an intervention disabling Pump 1 while holding Pump 2’s readiness fixed (by stipulation) would not change flow.  
     - **Relevance**: Tests whether causation requires counterfactual dependence in the *actual* sequence (CDM) or permits non-actual fixed conditions (INT).  

  2. **Crux 2: The Primacy of Mechanisms vs. Dependence in Masking**  
     - **Sub-Question**: In masked causation (like Case C), does causation require actual difference-making under normal conditions, or can it be grounded in the intrinsic capacity of a variable, revealed when masking is removed?  
     - **Test**: Apply both views to **Case C** under a hypothetical where salt intake changes, but the reflex is *temporarily disabled by chance* (no intervention), and blood pressure responds.  
       - *CDM Expectation*: Salt intake *did not* cause the blood pressure change, as the closest world without salt (reflex intact) shows no change. The temporary disablement is a deviant background, not part of "closest circumstances."  
       - *INT Expectation*: Salt intake *did* cause the change, as an intervention setting salt to the same value while holding the reflex disabled would change pressure, revealing salt’s capacity.  
     - **Relevance**: Tests whether causation is tied to actual scenarios (CDM) or capacities identifiable under ideal manipulation (INT).  

  **Part 4: Terminological vs. Substantive Differences**  
  - **Terminological Differences**:  
    - "Events" (CDM) vs. "variables" (INT): This reflects a focus on token occurrences (CDM) versus generalizable properties (INT), but both can map onto each other (e.g., an event as a variable-in-context).  
    - "Closest circumstances" (CDM) vs. "held fixed by stipulation" (INT): These are functionally analogous in simple cases but diverge in complex ones (e.g., Crux 1).  
    No substantive weight attaches to these terms; they are pragmatic choices for different domains (e.g., history vs. science).  

  - **Substantive Differences**:  
    - **Metaphysical Commitment**: CDM treats causation as a mind-independent relation grounded in worldly similarity (e.g., "closest worlds"), while INT treats it as model-relative, requiring explicit structure (e.g., "causal model"). This affects objectivity (CDM) versus context-sensitivity (INT).  
    - **Explanation Priority**: CDM emphasizes *why* specific outcomes occurred (e.g., "the flow occurred because Pump 1 operated, given Pump 2’s backup"), while INT emphasizes *how* variables can be manipulated for control (e.g., "disabling either pump alone won’t change flow"). This is substantive, as it shapes what counts as a satisfactory causal explanation.  
    - **Handling Masking**: CDM denies causation when masking is normal (Case C), seeing the reflex as part of the "closest circumstances," while INT allows causation via intrinsic capacities, seeing the reflex as separable. This reflects a deep divide: whether causation is difference-making in actuality (CDM) or in principle (INT).  

  **Conclusion**  
  We concur on core aims, tools, and verdicts for the cases, but diverge on metaphysics and explanatory priorities. Resolving Crux 1 could sway CDM if INT’s stipulative fixes prove indispensable; resolving Crux 2 could sway INT if CDM’s actual-dependence is shown to overlook causal capacities. Our collaboration affirms that shared standards can clarify disputes without collapsing them.  

