  ## Draft of the Joint Statement

  ### Joint Statement on Causation: Counterfactual Difference-Making and Interventionist Accounts

  **Part 1: Shared Commitments**

  We, the adherents of the counterfactual difference-making account (CDM) and the interventionist account (INT), jointly affirm the following:

  1. The primary aim of a theory of causation is to provide an account of the difference-makers for effects, in a way that supports explanation, prediction, and control.
  2. Any adequate theory must handle classic problem cases including overdetermination (Case A: redundant pumps), prevention and double prevention (Case B: prevented prevention), and cases of masking or compensation (Case C: adaptive compensation).
  3. Counterfactual conditionals are indispensable tools for analyzing causation. Interventions provide a specific and controlled way to evaluate counterfactuals, by idealizing manipulations that isolate the effect of a cause while holding fixed other factors.
  4. In the three stipulated cases, our views yield the following verdicts, which we both accept:
     - Case A (redundant pumps): Neither pump individually is a cause of the flow, since the flow would have occurred in the absence of either one (CDM), and no intervention on either pump alone (holding fixed the other's operation) would change the flow (INT).
     - Case B (prevented prevention): The monitor's action is a cause of the update, because without it the fault would have blocked the update (CDM), and an intervention preventing the monitor's action would allow the fault to block the update (INT).
     - Case C (adaptive compensation): Within the moderate range, salt intake is not a cause of blood pressure, because the reflex would maintain pressure in the absence of salt (CDM), and interventions changing salt intake within the range do not change blood pressure (INT).

  **Part 2: Remaining Disagreements**

  We disagree on the following theses, fairly characterized:

  - CDM Thesis: Whether one event (or event-token) causes another is determined by whether the second event would not have occurred, or would have been token-different, in the closest possible world where the first event does not occur or is different, holding fixed the laws and the actual circumstances except as required by the absence or alteration of the first event.

  - INT Thesis: Whether one variable (which can represent an event-type or an aspect of an event) causes another is determined relative to a causal model (including a set of variables and their functional relations) by whether there exists an ideal intervention on the first variable that would change the second variable, where an ideal intervention sets the first variable to a value while holding fixed other variables not causally downstream and not in violation of the model's structure.

  **Part 3: Cruxes**

  We identify the following cruxes that could rationally sway one or both of us, and we agree on the relevance of the described tests or cases:

  1. **Crux 1: Model-Relativity vs. Objectivity**  
     - *Test Case*: Consider a system with an operating pump and an unknown backup pump that would activate if the main pump fails (and this backup exists in the actual world). The flow occurs. Is the main pump a cause of the flow?  
     - *CDM Expectation*: No. The closest world without the main pump has the backup activating and maintaining flow, so there is no counterfactual dependence.  
     - *INT Expectation*: It depends on the causal model. In a model that omits the backup, an intervention stopping the main pump would stop the flow, so it is a cause. In a model that includes the backup and its activation mechanism, an intervention on the main pump does not change the flow (given the backup's readiness), so it is not a cause.  
     - *Relevance*: This tests whether causation is model-relative (INT) or whether it is an objective matter determined by the closest worlds (CDM).

  2. **Crux 2: The Role of Defaults in Determining the Closest World**  
     - *Test Case*: In a voting scenario, suppose a measure requires a majority of votes to pass. Voter A votes for the measure, and it passes by one vote. But if A had not voted, another voter (B) would have voted for it instead. However, B is not in the actual world.  
     - *CDM Expectation*: The closest world without A's vote might include B's vote (if that is more similar) or might not, depending on how we weigh miracles. If B's vote occurs, then the measure still passes and A's vote is not a cause. If not, then A's vote is a cause.  
     - *INT Expectation*: Relative to a model that includes only the actual voters, an intervention changing A's vote changes the outcome, so A is a cause. In a model that includes B as a potential voter, an intervention on A might not change the outcome if it triggers B's vote, but interventionist accounts typically do not allow interventions to trigger backup mechanisms unless they are part of the model's structure.  
     - *Relevance*: This tests how defaults and norms influence the closest world (CDM) versus how the causal model explicitly represents potential causes (INT).

  **Part 4: Terminological and Substantive Differences**

  - **Terminological**: 
    - The CDM view often speaks of events, while the INT view speaks of variables. This difference in focus is largely translatable, and does not represent a deep disagreement.
    - Both views use counterfactuals, but the INT view explicitly defines counterfactuals via interventions within a model, whereas the CDM view uses a similarity metric over possible worlds. This difference in formalism is not in itself substantive.

  - **Substantive**:
    - The most significant substantive disagreement is whether causal claims are model-relative (INT) or whether they are objective and determined by the actual world and a contextually-supplied similarity metric (CDM). This affects how we handle incomplete knowledge and the context-sensitivity of causal attributions.
    - A further substantive disagreement is how each view handles the distinction between default and deviant states. The CDM view relies on the similarity metric to prioritize some worlds over others (e.g., worlds with fewer miracles or more normal conditions), while the INT view relies on the causal model to explicitly represent what is held fixed during an intervention.

  We offer this statement in good faith, as a basis for further dialogue and empirical or conceptual investigation.

