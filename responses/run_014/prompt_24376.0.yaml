prompt: |-
  I'm trying to work out what I actually think about the problem of old evidence in Bayesian epistemology, going by my gut on a set of cases. Here are my verdicts:

  1. Mercury's perihelion anomaly strongly confirms general relativity, even though the anomaly had been known for decades before GR was proposed. The fact that GR "explains" the anomaly rather than predicting it in advance doesn't seem to matter much to me; the anomaly was a genuine puzzle, and GR solves it.

  2. A theory constructed after the fact specifically to fit Mercury's perihelion anomaly gets very little confirmation from that anomaly. If I had proposed a new theory whose only purpose was to account for the perihelion, I don't think the perihelion would confirm it much at all.

  3. The cosmic microwave background strongly confirms the Big Bang model. But I feel the CMB confirms the Big Bang model more than Mercury's perihelion confirms GR, because the CMB was (roughly) predicted by the Big Bang model before it was discovered, whereas the perihelion anomaly was not predicted by GR.

  4. The near-flatness of the universe confirms inflationary cosmology, even though the near-flatness was known before inflation was proposed. But I feel the flatness confirms inflation less than the CMB confirms the Big Bang, because the flatness is a fine-tuning problem that inflation solves, whereas the CMB was a genuinely surprising discovery.

  5. I don't think the total-evidence objection means that old evidence fails to confirm a theory. I take the total-evidence problem to be a technical artifact of how conditional probabilities are computed, not a genuine threat to the idea that old evidence can confirm a theory.

  6. I think a theory that unifies old evidence — explaining multiple pre-existing anomalies at once — gets more confirmation than the sum of what each piece of evidence would confirm on its own. For example, GR explains both Mercury's perihelion and the deflection of light; I think the unification adds confirmatory force beyond the two individual confirmations.

  Is there a coherent account of confirmation that captures all of these verdicts, or a close subset of them? If no single account captures all of them, which of my verdicts does the best available account force me to drop, and why? Please also say what would change your mind about the account you settle on: is there a case where old evidence seems to confirm a theory but your account says it doesn't, is there a case where your account forces you to say a theory gets no confirmation from old evidence (and is that a cost or a feature), and which of your assumptions about the cases is most likely to be wrong and how would the account change if it were?
reasoning: |-
  Okay, let me start by trying to understand the user's problem. They're working through the issue of old evidence in Bayesian epistemology, using their intuitions from specific cases. They've listed six verdicts about how different pieces of old evidence confirm theories, like Mercury's perihelion for GR, the CMB for the Big Bang, and others. Their main question is whether there's a coherent account that captures all these intuitions or which ones they might need to drop.

  First, I need to recall the standard Bayesian problem with old evidence. The issue is that if evidence E is already known, its probability is 1, so P(E|T) and P(E) both being 1 makes the ratio 1, meaning no confirmation. But the user thinks old evidence can confirm, as in the Mercury case. So how do we reconcile that?

  Looking at their verdicts, they distinguish between different scenarios. For example, Mercury confirms GR but not a theory built just to fit it. Also, predicted evidence like CMB confirms more than explained evidence like Mercury. Unification adds extra confirmation. The user also dismisses the total evidence problem as a technicality.

  The challenge is finding a framework that accommodates all these nuances. Maybe the counterfactual approach, like Garber's or Jeffrey's, where we consider what the probability of E would be if we didn't know it. But that has issues with subjectivity. The unification approach might handle multiple anomalies, but does it cover the difference between prediction and accommodation?

  Another angle is the problem-solving or explanatory power. The user mentions that GR solved a genuine puzzle, while a fabricated theory doesn't. So perhaps explanatory virtues play a role. But Bayesianism traditionally doesn't include those. How to fit that in?

  Also, the difference in confirmation strength between CMB and Mercury's perihelion. The user thinks prediction adds more weight. The counterfactual approach might handle that by simulating a state of ignorance. But is that practical? And for the flatness of the universe, it's a fine-tuning solution, which might be seen as less confirmatory than a novel prediction. Maybe inflationary cosmology doesn't get as much confirmation because the flatness was expected to some extent?

  Unification seems key for verdict 6. Bayesian networks might model that, but it's complex. Maybe showing that a theory that unifies reduces the probability of coincidence, thus increasing confirmation.

  Now, which account best fits? The counterfactual Bayesian approach seems promising for most cases. It can explain why Mercury confirms GR (if we imagine not knowing it, GR makes it likely) but not a tailored theory (which might be ad hoc). The CMB being predicted would have a low prior probability, so higher likelihood boosts confirmation more. Flatness might have been expected, so less boost.

  But where does the counterfactual approach fail? Verdict 3 says CMB confirms more than Mercury because it was predicted. The counterfactual might handle that, but the strength difference needs careful calibration. Also, the user's dismissal of total evidence as a technicality aligns with counterfactuals ignoring current knowledge.

  The unification part might need additional elements. Maybe combine counterfactual with explanatory power. But is that still Bayesian? Some accounts like Myrvold's unification measure might integrate, but it's more complex.

  Assumptions to question: The user thinks flatness confirms inflation less because it's a fine-tuning solution. But was the flatness a problem before inflation? If it was an expected outcome without inflation, then yes. But if it was surprising, maybe not. The user's intuition here might hinge on whether the evidence was problematic or not.

  Also, the ad hoc theory for Mercury. If the theory is designed just for that, its likelihood is high only because it's tailored, so in a counterfactual scenario, P(E|T) is high, but P(T) might be low. But why low? Because it lacks unifying power or simplicity. So prior probabilities play a role here.

  To change my mind about counterfactual approach, a case where old evidence confirms but counterfactual says no. Suppose a theory predicts old evidence that was considered irrelevant before. If we didn't know E, but T predicts it, but E wasn't puzzling, does it confirm? The user's cases involve puzzles, so maybe not. But if it's not a puzzle, does it still confirm? That could be a test case.

  Another issue: the subjectivity in counterfactual priors. Different scientists might assign different probabilities in ignorance states. The user might accept that as reflecting subjective elements in confirmation.

  In conclusion, counterfactual Bayesianism fits most verdicts. The unification might be handled by network approaches, but it's an extension. The user might need to accept some subjectivity or complexity. Dropping the exact strength comparison (verdict 3) as too vague, or incorporating explanatory virtues implicitly through priors and likelihoods. But overall, counterfactual seems the best fit without major sacrifices.
answer: |-
  Based on your intuitive verdicts, the most coherent account of confirmation that captures the *majority* of your judgments is a **sophisticated Bayesian counterfactual approach**, often associated with thinkers like Garber, Jeffrey, and later refinements focusing on unification and explanatory power. This approach directly addresses the "problem of old evidence" while respecting distinctions between prediction, accommodation, unification, and ad hocness.

  Here's how it maps to your verdicts:

  1.  **Mercury Perihelion & GR (Confirms):** The counterfactual approach works. We assess `P(E|T)` *not* relative to our *actual* background knowledge (which includes E), but relative to a *counterfactual* background knowledge `K'` where the anomaly was known but unexplained (it was a "puzzle"), and GR was not yet conceived. In `K'`, `P(E|T)` is high (GR entails/solves it), while `P(E|~T)` is low (no other good explanation existed). Thus, learning T would significantly raise the probability of E relative to `K'`, meaning E confirms T relative to our *actual* knowledge state. This captures the "genuine puzzle solved" intuition.

  2.  **Ad Hoc Theory for Perihelion (Doesn't Confirm):** The counterfactual approach explains this too. In the counterfactual state `K'` (anomaly known, unexplained), `P(E|T_ad_hoc)` *might* be high (if T is built to fit E). **However**, the critical move is assigning a *vanishingly low prior probability `P(T_ad_hoc|K')`*. The theory is constructed *solely* for E, lacks independent motivation, simplicity, unifying power, or any other theoretical virtue. Its prior is extremely low. While the likelihood `P(E|T_ad_hoc)` is high, the posterior `P(T_ad_hoc|E, K')` remains low because the prior was so low. Thus, E provides little *net* confirmation. This captures the "only purpose was to account" intuition.

  3.  **CMB > Perihelion in Confirmatory Strength:** The counterfactual approach captures the *direction* (both confirm) but needs supplementation for the *degree*. Here, **explanatory surprisingness** or **unexpectedness** relative to the counterfactual background `K'` is key. In `K'` for the CMB:
      *   `P(E|T_BB)` is very high (it was predicted).
      *   `P(E|~T_BB)` is *extremely low* – the CMB was a completely unexpected phenomenon under then-existing cosmological models (e.g., steady state). Its discovery was a major surprise.
      For Mercury in `K'`:
      *   `P(E|T_GR)` is high.
      *   `P(E|~T_GR)` is *low but not vanishingly so* – Newtonian mechanics was highly successful; the anomaly existed but was small; other potential explanations (Vulcan, modified gravity laws) were conceivable, even if ultimately wrong. The discovery wasn't a shock like the CMB.
      The Bayes Factor `[P(E|T) / P(E|~T)]` is much larger for the CMB case than for Mercury. The *degree* of unexpectedness under alternatives (`P(E|~T)`) explains the difference in confirmatory strength. Prediction often correlates strongly with low `P(E|~T)`.

  4.  **Flatness Confirms Inflation Less than CMB Confirms BB:** Similar logic to #3 applies. In the counterfactual `K'` before inflation (flatness known, unexplained fine-tuning problem):
      *   `P(E|T_inflation)` is high (inflation dynamically produces flatness).
      *   `P(E|~T_inflation)` is *moderately low but not extremely low*. The flatness was a recognized problem ("fine-tuning"), meaning its existence *given the standard Big Bang model without inflation* had low probability. However, it wasn't a *surprising discovery* like the CMB; it was a *theoretical puzzle* derived from existing knowledge. Its status as a known parameter value makes its `P(E|~T)` less shockingly low than the CMB's was under non-BB models. The Bayes Factor is positive but smaller than for the CMB case. This captures the "fine-tuning problem solved" vs. "genuinely surprising discovery" distinction.

  5.  **Total Evidence Problem is Technical:** You explicitly endorse this view, which aligns perfectly with the counterfactual approach. The counterfactual maneuver bypasses the formal problem `(P(E) = 1)` by shifting the evidential context to `K'` where `P(E) < 1`. The core intuition that old evidence *can* confirm is preserved.

  6.  **Unification Adds Confirmatory Force:** This verdict requires augmenting the basic counterfactual approach with an account of **unification** (e.g., Myrvold, McGrew). The idea is that a theory unifying diverse phenomena E1 and E2 provides a *common explanation*, making the *conjunction* (E1 & E2) *more probable* under T than the product of their individual probabilities under T would suggest, especially relative to alternatives where they are explained separately or remain unexplained. Formally, `P(E1 & E2 | T, K') >> P(E1 | T, K') * P(E2 | T, K')` because T provides a *common cause/structure*. Under rival theories, `P(E1 & E2 | ~T, K')` might be close to `P(E1 | ~T, K') * P(E2 | ~T, K')` (implying independence or separate causes). This makes the Bayes Factor for the conjunction larger than the product of the individual Bayes Factors, capturing the "added confirmatory force" beyond the sum of the parts. GR explaining *both* Mercury *and* light bending exemplifies this.

  **What You Might Need to Drop (or Refine) and Why:**

  *   **Verdict 3's Strength Comparison:** While the counterfactual + unexpectedness account explains *why* CMB confirms more than Mercury, it relies on a subjective (though plausible) assessment of `P(E|~T)` in the counterfactual state. A strict Bayesian might argue that without precise historical probabilities (which are inaccessible), asserting *degrees* of difference is difficult. You might need to soften this to "CMB *seems intuitively* to confirm more strongly, likely due to its greater unexpectedness under prior theories." The *direction* is robust; the exact *degree* comparison is the hardest to formalize perfectly.

  **Best Available Account & Its Potential Weaknesses:**

  The **Counterfactual Bayesianism + Explanatory Virtues (Unification, Simplicity via Priors, Unexpectedness via `P(E|~T)`)** account described above best captures your intuitions (1, 2, 4, 5, 6) and largely captures 3.

  *   **What Would Change My Mind About This Account?**
      *   **Case: Old Evidence Confirms, Counterfactual Says No?** Imagine a long-known, utterly mundane fact E (e.g., the sky is blue sometimes) that a radically new, independently motivated theory T unexpectedly explains as a direct consequence. *Your intuition:* E might provide *some* surprising confirmation for T. *Counterfactual Problem:* In `K'` (E known, mundane), `P(E|~T)` is already very high (it's mundane, well-explained by old theories). So `P(E|T)/P(E|~T)` is close to 1, suggesting minimal confirmation. Is this a cost? Maybe. The account struggles if E was never a *puzzle* but the new explanation is genuinely illuminating. This might force incorporating "explanatory depth" more explicitly.
      *   **Case: Account Forces Zero Confirmation (Cost or Feature)?** The account *does* force near-zero confirmation for the purely ad hoc theory (Verdict 2). You view this as a *feature* (it matches your intuition). The cost arises if a theory initially *seems* ad hoc but later reveals independent virtues or unifying power. The account (relying on priors in `K'`) might be too harsh initially but can be updated as new evidence/theoretical virtues emerge.
      *   **Which Assumption is Most Likely Wrong?** The assumption that **`P(E|~T)` in the historical counterfactual state `K'` is objectively determinable or comparable.** Assessing how surprising Mercury was vs. the CMB vs. flatness relies on historical interpretation and is inherently somewhat subjective. Different philosophers/scientists might reasonably disagree on the precise values. *How the Account Changes:* It becomes more subjective and contextual. Confirmation strength judgments become relative to a particular reconstruction of `K'` and the probabilities assigned within it. The core counterfactual *logic* remains, but precise *degrees* become less rigid.

  **Conclusion:**

  Your intuitions are remarkably consistent with a sophisticated Bayesian perspective that:
  1.  Uses a counterfactual state of background knowledge (`K'`) to solve the old evidence problem.
  2.  Incorporates theoretical virtues (especially non-ad-hocness) primarily through *prior probabilities* in `K'`.
  3.  Uses the *unexpectedness* of evidence under rival theories (`P(E|~T)` in `K'`) to gauge *degree* of confirmation, explaining the difference between predictive triumphs and explanatory solutions.
  4.  Explicitly adds a formal account of *unification* to handle the extra confirmatory boost.

  The main tension is quantifying the degree difference in Verdict 3, stemming from the inherent difficulty in precisely assessing historical `P(E|~T)`. However, the core logic and directionality of all your verdicts, including the crucial distinction between genuine explanation and ad hoc accommodation, are well-supported by this framework. You don't need to fundamentally drop any verdict; you only need to acknowledge the subjectivity involved in comparing the *strength* of confirmation across very different historical cases.
