  Could you walk through the 3 or 4 key upshots of Pascal-style reasoning for someone in my position? Like what does it force me to decide about expected value maths, just ignoring super low chances, and how to live with that kind of uncertainty? No need for reading lists or citations, just work through the case from scratch.

