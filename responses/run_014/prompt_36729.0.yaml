prompt: |-
  I'm a retired invertebrate zoologist -- thirty-some years mostly on decapod crustaceans, crayfish and shore crabs, with a detour into octopus husbandry late in my career -- and since I stopped going into the lab I've gotten properly hooked on philosophy of mind. The reading group I joined (mostly retired academics, one ex-chemist who's now a Buddhist) keeps circling back to which animals are conscious, and I've noticed we all use the word "conscious" to mean about five different things and then talk past each other for an hour. Ever since that whole boiling-lobsters-alive business made the news my grandkids keep asking me if crabs feel pain, and honestly I'd like a better answer than "define feel." So I want to build a decision tree for the group: you start from something everyone in the room will grant (a dog is conscious, a rock isn't) and each branch node is a question about a concrete case or commitment, phrased so people can answer it without already knowing which philosophical camp it funnels them into, and each leaf is a named position on how consciousness is distributed across animals.

  Here's the structure I'd like you to work out, and please do some actual thinking before writing it, sketch the logical space first rather than just dredging up a list of famous names: the first split should probably be whether consciousness comes in degrees or is all-or-nothing, then whether it requires a specific kind of neural machinery (my old bias, honestly) or is multiply realizable, then whether reportability or metacognition is essential versus whether a creature can suffer without knowing it suffers, and then whether whatever your favorite complexity measure is, integrated information or whatever, entails experience as such. Test cases have to include at least: fish pain, bee navigation and play-like behavior, lobster nociception, the nematode with its ~300 neurons, and (to make the panpsychists sweat) a thermostat or a running simulation. Leaves must include at least a higher-order-thought style view, a global-workspace style view, a neurobiological-substrate view, a deflationary or behaviorist "there's no fact of the matter" view, and a panpsychist or IIT-style "it's everywhere, in degrees" view. For each leaf give one sentence on its most awkward commitment, and for any combination of answers nobody seems to occupy, say whether that's because the view is incoherent or just unattractive or unexplored. If two leaves genuinely can't be separated by any question a normal person could answer -- I suspect the substrate view and a conservative version of the degrees view end up twins on crustaceans, for instance -- flag it instead of inventing a fake distinction.

  Please write it as if you're a professional philosopher of mind who also knows the ethology literature, and keep the whole thing tight: the tree plus the leaf commentary plus the flags, 700 words max, no separate essay, and don't pad it with a history-of-the-problem intro, my reading group will not read that, they barely read the actual readings. Bonus points if the very first branching question would make my Buddhist ex-chemist friend and me split apart within two moves, since that's the whole point of the exercise. Don't worry about citations either, I just want the tree.
reasoning: |-
  Alright, let's tackle this. The user is a retired invertebrate zoologist with decades of experience in decapod crustaceans and octopus husbandry. They're now deep into philosophy of mind with a reading group of retired academics. The core issue is their group talks past each other because "conscious" means different things to each person. Plus, their grandkids are asking if crabs feel pain, and they want a better answer than just "define feel."

  First, I need to create a decision tree that starts from agreed-upon points (dogs are conscious, rocks aren't). The tree should branch based on concrete questions that don't presuppose philosophical stances. Each leaf should be a named position on animal consciousness. 

  Key elements from the query:
  - First split: degrees vs. all-or-nothing consciousness.
  - Then whether specific neural machinery is required or if it's multiply realizable.
  - Then reportability/metacognition vs. ability to suffer without metacognition.
  - Then whether complexity measures (like IIT) entail experience.
  - Test cases: fish pain, bee navigation/play, lobster nociception, nematode (300 neurons), thermostat/simulation.
  - Leaves must include: higher-order thought, global workspace, neurobiological substrate, deflationary/behaviorist, panpsychist/IIT.
  - Each leaf needs one sentence on its awkward commitment.
  - Flag combinations that are incoherent, unattractive, unexplored, or indistinguishable.

  The user wants it tight, under 700 words, no intro, no citations. Bonus if the first question splits the Buddhist ex-chemist and the user quickly.

  Deep needs analysis:
  1. **Clarity in Group Discussions**: They need a tool to structure debates, preventing talking past each other. The tree must force explicit commitments.
  2. **Answering Grandkids**: Beyond philosophy, they seek a defensible position on crustacean pain. The tree should clarify where crabs fall.
  3. **Bridging Disciplines**: As a scientist, they value empirical cases (lobsters, bees). The tree must integrate ethology without requiring specialized knowledge.
  4. **Efficiency**: Retired academics might have short attention spans. The tree must be concise, using plain language.
  5. **Philosophical Rigor**: Despite no citations, positions must accurately represent theories (e.g., HOT vs. GWT distinctions).
  6. **Handling Edge Cases**: Thermostats/nematodes test panpsychism vs. deflationary views. The tree must expose these tensions.

  Structural planning:
  - **First Branch**: Degrees vs. Binary. This splits the Buddhist (likely degrees/panpsychist-leaning) from the zoologist (possibly binary/substrate-focused).
  - **Second Branch**: Substrate-Specific vs. Multiply Realizable. Addresses if consciousness requires brains or could exist in other systems.
  - **Third Branch**: Requires Metacognition vs. Suffering Without Self-Report. Separates HOT (needs self-awareness) from views like GWT that allow raw experience.
  - **Fourth Branch**: Complexity = Experience? Captures IIT/panpsychism vs. others.

  Testing coverage:
  - Fish pain: Challenges deflationary views (if pain behavior exists).
  - Bee play: Suggests positive states without metacognition.
  - Lobster nociception: Directly relates to user's expertise; substrate views might deny pain without cortex.
  - Nematode: Minimal neurons; tests if complexity is necessary.
  - Thermostat: Forces panpsychists to defend universal consciousness.

  Leaf commitments:
  - **Higher-Order Thought (HOT)**: Awkwardly denies consciousness to infants or animals without metacognition.
  - **Global Workspace (GWT)**: Struggles with why global broadcasting feels like anything.
  - **Neurobiological Substrate**: Must explain why only certain neural structures count.
  - **Deflationary**: Dismisses subjective experience as unscientific.
  - **Panpsychist/IIT**: Attributes consciousness to simple systems like thermostats.

  Potential overlaps:
  - Substrate-specific + degrees might be unexplored (most substrate views are binary).
  - GWT + degrees is common (e.g., primates more conscious than fish).
  - HOT + multiply realizable is possible but rare (if metacognition can be non-biological).

  Execution:
  - Phrase questions neutrally: E.g., "Can a system be conscious without a brain?" instead of "Is consciousness substrate-independent?"
  - Ensure each question splits groups: First branch should immediately separate the Buddhist (degrees) from the zoologist (binary).
  - Commentary: Flag where substrate and conservative degrees converge (e.g., both grant crustaceans consciousness but for different reasons).

  Word count: Aim for 500-600 words. Use bullet-like structure for clarity.
answer: |-
  ### Consciousness Distribution Decision Tree  
  *Start: All grant dogs are conscious, rocks are not.*

  **1. Is consciousness fundamentally gradational (admits degrees) or binary (all-or-nothing)?**  
  - **Gradational** → Go to 2A  
  - **Binary** → Go to 2B  

  **2A. Does consciousness require specific biological machinery (e.g., vertebrate/cephalopod brains)?**  
  - **Yes** (Substrate-Specific Degrees) → Go to 3A  
  - **No** (Multiply Realizable Degrees) → Go to 3B  

  **2B. Does consciousness require specific biological machinery?**  
  - **Yes** (Substrate-Specific Binary) → Go to 3C  
  - **No** (Multiply Realizable Binary) → Go to 3D  

  **3A. Can a creature suffer without metacognition (e.g., knowing it suffers)?**  
  - **Yes** → **Neurobiological-Substrate Degrees** (e.g., crustaceans/fish conscious but less than mammals; awkward: bees/nematodes may be "marginally" conscious despite minimal cognition).  
  - **No** → **Global-Workshop-Style Degrees** (e.g., bees/fish conscious only if information is globally available; awkward: denies suffering to creatures without integrated cognition, like nematodes).  

  **3B. Does integrated information/complexity (e.g., Φ > 0) guarantee subjective experience?**  
  - **Yes** → **IIT-Style Panpsychism** (e.g., thermostats/nematodes conscious; awkward: thermostats "feel" temperature changes).  
  - **No** → **Unattractive/Underexplored** (gradational + multiply realizable but complexity ≠ experience; no major view fits, as it avoids testable commitments).  

  **3C. Is metacognition (e.g., higher-order awareness) necessary for consciousness?**  
  - **Yes** → **Higher-Order-Thought (HOT)** (e.g., only primates/birds conscious; awkward: denies pain to human infants or lobsters despite nociception).  
  - **No** → **Neurobiological-Substrate Binary** (e.g., mammals/octopuses conscious, insects/nematodes not; awkward: fish pain reflexes may lack true experience without cortex-like structures).  

  **3D. Is metacognition necessary?**  
  - **Yes** → **Incoherent** (binary + multiply realizable + metacognition: no one holds this, as metacognition is biologically implausible in non-biological systems).  
  - **No** → **Deflationary/Behaviorist** (e.g., "consciousness" is just complex behavior; thermostats "detect" but don’t feel; awkward: dismisses subjective suffering even in dogs as illusory).  

  ---

  ### Flags & Notes  
  - **Indistinguishable Positions**: Neurobiological-Substrate Binary (3C) and conservative Neurobiological-Substrate Degrees (3A) both grant crustaceans consciousness if they have vertebrate-analog structures (e.g., lobster nociceptive pathways). Split depends only on "degrees vs. binary" commitment.  
  - **Unattractive/Underexplored**: Gradational + multiply realizable but complexity ≠ experience (3B "No")—avoids taking a stand on nematodes/thermostats.  
  - **Incoherent**: Binary + multiply realizable + metacognition (3D "Yes")—metacognition in simulations/thermostats is philosophically untenable.  
  - **Test Cases**:  
    - Fish pain: HOT denies; others debate.  
    - Bee play: Deflationary dismisses; IIT/Gradational views accept.  
    - Lobster nociception: Substrate views accept if neural complexity suffices; HOT/Deflationary deny.  
    - Nematode: IIT accepts; others deny.  
    - Thermostat: Only IIT accepts.  

  ### First-Branch Bonus  
  *Your Buddhist friend (likely gradational) splits from you (likely binary, given substrate bias) by Question 1. By Question 2, you diverge further if they reject substrate requirements (panpsychism-leaning) while you affirm them.*
