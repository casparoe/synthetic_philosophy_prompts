answer: |-
  ### Exam Question  
  **Part (a)** (10 points)  
  Eleonore Stump’s "no-flicker" Frankfurt-style case aims to block the "flicker of freedom" defense of the Principle of Alternative Possibilities (PAP). Explain:  
  (i) How Stump’s modification (triggering intervention on *precursors* to decision) targets the flicker strategy’s claim that agents retain *some* alternative possibility, and  
  (ii) What this case purportedly shows about a "weak" PAP (i.e., moral responsibility requiring *at least* a flicker of freedom).  

  **Part (b)** (10 points)  
  Consider an **"atomic decider"**—an agent whose decisions lack any detectable intermediate mental states (e.g., inclinations, wavering) and occur instantaneously as all-or-nothing events. Analyze whether Stump’s no-flicker case can be coherently applied to such an agent. Does this undermine the claim that Stump’s case refutes weak PAP? Justify your answer.  

  ---

  ### Model Answer (650 words)  
  **Part (a)**  
  Stump’s no-flicker case refines Frankfurt’s original thought experiment by preempting the "flicker" strategy. The flicker defense concedes that Frankfurt-style cases eliminate *broad* alternative possibilities (e.g., voting differently) but insists agents retain *narrow* alternatives (e.g., hesitating or showing resistance). These flickers, defenders argue, satisfy a weakened PAP: responsibility requires *some* alternative possibility, however minimal. Stump’s innovation is to introduce an intervener (e.g., Black) triggered not by the decision itself but by its *precursors* (e.g., a nascent inclination toward the choice). In the actual sequence, if the agent (Jones) decides freely without intervention, no flicker occurs because Black only acts upon detecting the *possibility* of an alternative choice. Crucially, at *no* point—not even milliseconds before the decision—does Jones have access to an alternative path. If Jones chooses wrongly without intervention, he seems responsible; yet he could not have chosen otherwise *or* manifested any flicker (e.g., a wavering intention).  

  This targets the flicker strategy by collapsing the distinction between pre-decisional states and the decision itself. If responsibility persists in this scenario, Stump argues, no alternative possibility—not even a flicker—is necessary for moral responsibility. Thus, the no-flicker case purports to refute *all* forms of PAP, including the weak version requiring minimal alternatives. It suggests that the actual sequence of deliberation (Jones’s uncoerced reasoning) alone grounds responsibility, irrespective of counterfactual constraints.  

  **Part (b)**  
  The atomic decider presents a problem for Stump’s construction. By definition, an atomic decider has no precursors: their decision is instantaneous, with no prior detectable mental states (e.g., no inclinations, deliberations, or neural correlates accessible to an intervener). For Stump’s intervener to function, it must detect a precursor (e.g., "Agent will choose A unless I intervene") to preempt alternatives. But if the decision is atomic, there *are* no precursors to detect *before* the decision is made. Black cannot intervene preemptively because there is no prior "sign" of the choice—the decision and its detection are simultaneous.  

  This undermines Stump’s case in two ways:  
  1. **Intervention Paradox**: Black must either (i) intervene *after* the decision (making it non-preemptive and thus permitting a flicker of alternative possibility *until* the decision), or (ii) act randomly *before* the decision (which would violate the case’s setup, as it might force an undesired choice). Neither option preserves the no-flicker structure.  
  2. **PAP Implications**: If Stump’s case cannot be applied to atomic deciders, it fails to universally refute weak PAP. For such agents, responsibility *would* require a flicker—specifically, the possibility of deciding otherwise *at the moment of choice*—since no preemptive intervention is possible. Crucially, this does not prove weak PAP is true; it shows Stump’s argument against it *depends on agents having non-atomic decision-making processes*. Thus, Stump’s case cannot refute weak PAP for atomic deciders, leaving open the possibility that *for these agents*, responsibility requires a flicker of alternative possibility.  

  However, this does not rescue PAP entirely. Frankfurtians might argue atomic deciders are incoherent or empirically implausible. Alternatively, they could concede that weak PAP holds for atomic deciders but contend that *actual* humans are not atomic deciders, making Stump’s case relevant for real-world responsibility. Still, the atomic decider highlights that Stump’s refutation of weak PAP is contingent on agents having detectable decision-precursors—a vulnerability in the no-flicker strategy’s generality.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-Hit Moves:**  
  1. **Stump’s preemptive trigger** (4 pts):  
     *Explain how intervention on precursors blocks flickers.*  
     *Common error:* Merely noting intervention is earlier, not how it erases *all* alternatives.  

  2. **Weak PAP’s defeat** (4 pts):  
     *State that Stump aims to show responsibility requires NO alternatives (not even flickers).*  
     *Common error:* Claiming Stump only refutes "strong" PAP or conflating weak/strong PAP.  

  3. **Atomic decider’s undetectability** (4 pts):  
     *Argue Black cannot act without precursors to detect.*  
     *Common error:* Asserting atomic deciders are "impossible" without engaging the hypothetical.  

  4. **Intervention paradox** (4 pts):  
     *Show post-decision intervention permits flickers; pre-decision intervention is arbitrary.*  
     *Common error:* Claiming Black can intervene "based on the decision" without temporal contradiction.  

  5. **PAP resilience for atomic agents** (4 pts):  
     *Conclude that weak PAP *may* hold for atomic deciders, limiting Stump’s refutation.*  
     *Common error:* Overgeneralizing that atomic deciders "save PAP" or misunderstanding scope.  

  ---

  **Verdict:** The move that separates top answers is recognizing that atomic deciders expose Stump’s reliance on *detectable precursors*, thus restricting her refutation of weak PAP to non-atomic agents.
