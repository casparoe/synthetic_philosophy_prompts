answer: |-
  ### **The Game**

  **Payoff Matrix (Bimatrix):**

  ```
  Player 1 \ Player 2 | L         M         R
  ---------------------|------------------------
  T                   | (4, 4)   (0, 0)   (3, 0)
  M                   | (0, 0)   (4, 4)   (3, 0)
  B                   | (0, 3)   (0, 3)   (2, 2)
  ```

  **Rules & Setup:**  
  - **Players:** Pairs of students (one as Player 1, one as Player 2).  
  - **Strategies:** Player 1 chooses T, M, or B; Player 2 chooses L, M, or R.  
  - **Payoffs:** Points based on the matrix (no real money). Player 1’s payoff is the first number; Player 2’s is the second.  
  - **Rounds:** 8–10 rounds. After each round, players see their own payoff but not their partner’s.  
  - **Discussion:** Between rounds, partners can discuss strategy *within their pair* but not with other pairs.  

  **Materials:**  
  - Strategy slips (anonymously submitted after each round).  
  - Whiteboard to display aggregate distributions (e.g., "T: 40%, M: 40%, B: 20%" for Player 1; similarly for Player 2).  

  **Symmetric Consideration:**  
  The game is *nearly symmetric*: Both players have a strategy (B for P1, R for P2) that is strictly dominated by a 50-50 mixture of their other two strategies. The payoffs mirror incentives across roles (P1’s T/M cycle vs. P2’s L/M cycle).  

  ---

  ### **Round-by-Round Facilitation Plan**

  1. **Introduction (5 min):**  
     - Explain the matrix: "You’ll play this game repeatedly in pairs. Your goal is to maximize your own points."  
     - Assign roles: "Flip a coin to decide who is Player 1/2. Roles are fixed."  
     - Clarify anonymity: "Submit choices on slips—no names. I’ll post class-wide distributions after each round."  

  2. **Rounds 1–4 (30 min):**  
     - Run 4 rounds (5 min/round).  
     - After each round:  
       - Collect slips, compute distributions, and post on the board (e.g., "P1: T 30%, M 40%, B 30%; P2: L 35%, M 35%, R 30%").  
       - **Ask:** "What patterns do you see? Are some strategies consistently winning?"  
     - **Intervene if needed:** If B/R are rare early, say: "Some pairs avoid B/R—why?"  

  3. **Mid-Activity Shift (Round 5, 10 min):**  
     - Announce: "We’ll eliminate strategies no one should play. Vote on which to remove *for Player 1*."  
     - **Expected vote:** No strategies eliminated (no pure dominance).  
     - Ask: "Is Player 1’s B ever a good choice? What about Player 2’s R? Why or why not?"  

  4. **Rounds 6–8 (15 min):**  
     - Run 3 more rounds.  
     - **Key data shift:** By now, pairs discover cycling (P1’s T/M vs. P2’s L/M), causing B and R to underperform.  
     - Highlight data: "Notice B and R are vanishing—why might that be, even if no pure strategy beats them?"  

  5. **Final Vote (Round 8, 5 min):**  
     - Ask: "Should we eliminate B or R now? Why?"  
     - **Reveal the insight:** "Let’s see why these strategies are traps, even without pure-strategy dominance."  

  ---

  ### **The Debrief**  

  1. **Pure Dominance Recap (5 min):**  
     - "In early rounds, we saw no pure dominance:  
       - T isn’t dominated (beats B against L/R but loses to M against M).  
       - M isn’t dominated (beats T against M but loses to T against L).  
       - B *seemed* playable (beats nothing, but ties T/M against M)."  
     - **Key takeaway:** "Pure strategies alone couldn’t eliminate B or R—we hit a wall."  

  2. **The "Wall" and Mixed Strategies (10 min):**  
     - **Problem:** "Why did B/R disappear in later rounds? Let’s see Player 1’s payoffs if Player 2 randomizes 50-50 L/M:  
       - T: 50%×4 + 50%×0 = 2  
       - M: 50%×0 + 50%×4 = 2  
       - B: 50%×0 + 50%×0 = 0  
       - B’s best outcome (2 vs. R) is worse than T/M’s *expected* 3 (against R)."  
     - **Formal definition:** "B is strictly dominated by mixed strategy (0.5T, 0.5M) because for *every* Player 2 move:  
       - vs. L: 0.5×4 + 0.5×0 = 2 > 0 (B’s payoff)  
       - vs. M: 2 > 0  
       - vs. R: 0.5×3 + 0.5×3 = 3 > 2."  

  3. **Why Iterated Elimination Demands Mixing (5 min):**  
     - "In theory, iterated elimination should remove B and R early. But if we ignore mixed strategies, we get stuck.  
     - **Consequence:** "Without mixed dominance, we’d falsely think B and R are rational—but your play showed they’re not!"  
     - **Big picture:** "This is why Nash equilibrium requires mixed strategies: to eliminate 'silently dominated' options."  

  ---

  ### **What Goes Wrong**  

  1. **Initial Overuse of B/R (Likely):**  
     - **Why:** Students test strategies early. B/R may spike in Rounds 1–2 as "safe" choices.  
     - **Fix:** Reassure: "Early rounds are for exploration. Watch how payoffs evolve." Use mid-activity vote to refocus.  

  2. **Pairs Stuck in Pure Cycles (Predictable):**  
     - **Why:** Some pairs lock into T vs. L or M vs. M, missing the dominance.  
     - **Fix:** Post distributions to show class-wide shifts. Ask: "Why might mixing break these cycles?"  

  3. **Confusion Over Payoff Asymmetry (Possible):**  
     - **Why:** Players 1 and 2 have different payoffs (e.g., P2’s R column is weak).  
     - **Fix:** Clarify: "Focus on your role’s payoffs. We’ll analyze P1 and P2 separately in the debrief."  

  ---

  ### **What's Missing**  

  1. **Formal Mixed-Strategy Computation:**  
     - The activity shows *that* mixing dominates but not *how to derive* the dominating mixture. Cover this in lecture: solve for weights that strictly dominate B/R.  

  2. **General Algorithm for Iterated Elimination:**  
     - Students will intuit mixed dominance but not the full procedure. Teach: "After pure-strategy elimination, check mixed dominance in the reduced game."  

  3. **Connection to Nash Equilibrium:**  
     - The game has no pure Nash equilibrium, but activity doesn’t reveal this. Lecture should link mixed dominance to why equilibrium requires mixing here.  

  **Final Tip:** Use the payoff matrix from this design—it reliably produces the "aha" moment when B/R nosedive after Round 5. The asymmetry is minor and serves as a teachable moment about role-specific incentives.
