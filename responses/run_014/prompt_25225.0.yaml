prompt: |-
  ok so i keep seeing people argue about whether X is a disease—addiction, obesity, ADHD, long covid, whatever—and the argument is always just people trading intuitions about edge cases while gesturing vaguely at "dopamine" or "brain scans" or "but people choose to." nobody actually says what they're trying to do with the concept of disease in the first place.

  before i read another paper by boorse or wakefield or whoever, i want someone to write me the spec. like: if you were commissioning a theory of health and disease, what does it actually need to deliver? what's the requirements doc?

  things i care about:
  - what cases does it absolutely have to get right, and why those?
  - what distinctions can't it collapse? e.g., the distinction between "this is a disease" and "this is bad but not a disease" seems load-bearing in medicine and law and insurance and ordinary life, so the theory can't just say disease = undesirable bodily state.
  - which empirical facts (evolutionary, statistical, physiological) does it have to be consistent with? if the theory says something that contradicts how natural selection actually works, that's a problem.
  - does the theory need to unify physical and mental disorders, or is it allowed to treat them as different kinds of things with a family resemblance?
  - what about conditions that are statistically typical but clearly dysfunctional in some sense (like dental caries in populations without dentistry, or presbyopia in aging populations)? and the reverse: statistically rare but totally fine (like having an extra spleen or whatever)?
  - how much should it care about the fact that disease categories shift historically? like, is "homosexuality used to be a disease and now it's not" a problem the theory has to dissolve, or is that just sociology and the theory can ignore it?

  and then the part i actually want: once the list is on the table, which requirements are non-negotiable and which are just preferences of the naturalist camp vs. the normativist camp? are any pairs of requirements jointly unsatisfiable? which single requirement does the most work in elimating popular candidates?

  basically i want to stop having the object-level argument and first figure out what we're even arguing about.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're frustrated with endless debates about whether things like addiction or obesity are diseases, where people argue based on intuitions without clarifying what "disease" should achieve. The user wants a "spec" for a theory of health and disease—essentially a requirements document outlining what such a theory must accomplish.

  First, I need to identify the core issues they're raising. They mention distinctions between disease and non-disease being crucial in medicine, law, insurance, etc. So the theory must preserve that boundary without oversimplifying. They also care about empirical consistency with evolution, physiology, and statistics. Examples like dental caries in populations without dentistry highlight conditions that are common but dysfunctional, challenging purely statistical approaches.

  The user also questions whether physical and mental disorders should be unified under one theory or treated separately. Historical shifts in disease categories, like homosexuality, are another concern—should the theory address these or dismiss them as sociological? 

  Digging deeper, the user's explicit request is for a framework to evaluate existing theories, but their underlying need might be to navigate these debates more effectively. They might be seeking clarity to inform their own views or academic work. They’re tired of circular arguments and want a structured approach to cut through the noise.

  I recall key philosophical stances: naturalism (disease as objective dysfunction) vs. normativism (value-laden). The user wants to know which requirements are non-negotiable versus preferences of these camps. For instance, preserving the disease/non-disease distinction is likely non-negotiable across both, but grounding in evolution is a naturalist preference.

  Potential conflicts: If a theory requires both value-neutrality (naturalist) and practical applicability (which involves values), that might be irreconcilable. Also, handling historical changes vs. having a stable definition could clash. The user’s examples—common dysfunctions vs. rare but harmless traits—test a theory's ability to balance statistics with harm.

  The user’s mention of legal and insurance contexts suggests they need a theory that interfaces with real-world systems. Thus, practical applicability is crucial. Also, acknowledging the social construction of disease categories without collapsing into relativism is key. 

  In summary, the user needs a clear set of criteria to dissect theories of disease. Highlighting which requirements are essential versus contested, and where conflicts arise, can provide the scaffolding they seek. This moves the conversation from intuition-based arguments to structured evaluation, addressing their deeper need for a more productive discourse.
answer: |-
  Here's a requirements document (RD) for a Theory of Health and Disease (THD), based on your concerns. The goal is to provide a framework for evaluating competing theories, not to endorse one specific theory.

  **Theory of Health & Disease (THD) - Requirements Document (RD)**

  **1. Core Purpose & Function:** The THD must provide a *justifiable conceptual framework* for distinguishing states appropriately classified as "diseases," "disorders," or "pathological conditions" from other undesirable states, variations, or life circumstances. Its primary function is to **guide medical practice, resource allocation, research priorities, and social/legal responses** in a coherent, consistent, and ethically defensible manner.

  **2. Non-Negotiable Requirements (Hard Constraints):**

  *   **2.1. Preserve the Disease/Non-Disease Distinction (Boundary Integrity):**
      *   *Why:* This distinction underpins medical licensure (treating disease), insurance coverage, disability determinations, legal responsibility (e.g., insanity defense), research ethics, and societal support structures. Collapsing it renders medicine incoherent or infinitely expansive.
      *   *Must:* Clearly differentiate states like metastatic cancer, schizophrenia, or severe sepsis from states like grief, unemployment, illiteracy, or elective cosmetic differences, while explaining *why* the distinction matters in practice. Cannot equate "disease" simply with "undesirable bodily/mental state."

  *   **2.2. Account for Harm/Dysfunction (Core Justification):**
      *   *Why:* The fundamental reason for labeling a state a "disease" is that it causes significant harm or involves a breakdown in normal function that warrants medical attention/intervention.
      *   *Must:* Incorporate a notion of **biological, psychological, or integrated functional impairment** that leads to suffering, reduced life expectancy, impaired agency, or significant limitation in typical activities. Harm must be more than mere social disapproval.

  *   **2.3. Empirical Grounding (Scientific Plausibility):**
      *   *Why:* Medicine is a science-based enterprise. A THD fundamentally incompatible with biology, neuroscience, or evolution loses credibility and utility.
      *   *Must:* Be consistent with established knowledge about:
          *   **Evolution:** Acknowledge natural selection shapes function, but explain why "natural" ≠ "healthy" (e.g., susceptibility to pathogens, aging). Account for evolutionary mismatch.
          *   **Physiology/Pathophysiology:** Explain how identified dysfunctions map (even imperfectly) to known biological or psychological mechanisms (e.g., blocked artery causing heart attack, neurotransmitter imbalance contributing to depression).
          *   **Statistics:** Acknowledge the role of statistical deviation, but *cannot* make rarity or commonality the sole criterion (see 3.3, 3.4).

  *   **2.4. Practical Applicability (Operational Feasibility):**
      *   *Why:* The THD must be usable by clinicians, researchers, policymakers, and insurers. It can't be purely abstract.
      *   *Must:* Provide guidance (even if imperfect) for:
          *   Diagnosing novel conditions.
          *   Prioritizing research/healthcare resources.
          *   Making coverage/determination decisions without requiring philosophical expertise in every case.
          *   Allowing for reasonable professional judgment.

  **3. Essential Distinctions (Must Not Collapse):**

  *   **3.1. Disease vs. Normal Variation:** Must distinguish pathological shortness (e.g., growth hormone deficiency) from being statistically short but healthy.
  *   **3.2. Disease vs. Social Deviance/Conflict:** Must distinguish schizophrenia from political dissent or unconventional (but non-harmful) beliefs/behaviors.
  *   **3.3. Disease vs. Statistical Abnormality (Rarity ≠ Disease):** Must accommodate that statistically rare traits (e.g., extra spleen, exceptional musical ability) are not inherently diseases.
  *   **3.4. Disease vs. Common Harmful States (Commonality ≠ Health):** Must explain why widespread harmful states *can* be diseases (e.g., dental caries without dentistry, hypertension in modern society), even if statistically common within a specific environment.

  **4. Key Empirical & Conceptual Challenges (Must Address):**

  *   **4.1. The "Typical but Dysfunctional" Problem:** (e.g., Dental caries, presbyopia). Must classify these as diseases/disorders, explaining the dysfunction (tooth decay, loss of lens flexibility) and harm (pain, infection, functional impairment), even if near-universal in certain contexts.
  *   **4.2. The "Rare but Benign/Advantageous" Problem:** (e.g., Extra spleen, asymptomatic anatomic variants, exceptional abilities). Must classify these as non-diseases, emphasizing lack of inherent harm/dysfunction.
  *   **4.3. Mind-Body Integration:** Must treat physical and mental disorders as fundamentally the *same kind of thing* – **states involving harm stemming from biological/psychological dysfunction.** The dysfunction location (brain circuits vs. kidney tubules) doesn't change the category. A "family resemblance" approach fails the "Core Purpose" (2.1) by potentially excluding mental disorders from the medical purview.
  *   **4.4. Agency & Choice:** Must acknowledge degrees of agency/choice exist (e.g., initiating substance use vs. full-blown addiction) but explain why impaired agency/compulsion *resulting from underlying dysfunction* is a core feature of many diseases, not an argument against their status (e.g., schizophrenia, severe OCD, late-stage addiction).

  **5. Handling Historical & Cultural Variation:**

  *   **5.1. Requirement:** The THD must provide a framework for analyzing historical change (e.g., homosexuality, drapetomania, masturbation) without simply endorsing relativism or dismissing past medicine as entirely mistaken.
  *   **5.2. Solution Path:** Must distinguish:
      *   **The Core THD Definition:** Which should be stable based on dysfunction/harm (2.2) and empirical grounding (2.3).
      *   **Application Errors:** Mistakes due to *lack of scientific knowledge* (e.g., not understanding sexual orientation), *misidentifying dysfunction* (e.g., pathologizing normal desire), or *misattributing harm* (e.g., harm stemming purely from social stigma, not the state itself).
      *   **Sociological Influence:** The THD must acknowledge that societal values influence *which dysfunctions are prioritized*, *how harm is perceived*, and *what gets medicalized*, but it cannot let societal values *alone* define dysfunction. "Homosexuality as disease" was an **application error** (misidentifying dysfunction/harm), not a valid application of a sound THD changing over time. The core concept remains stable; our understanding of biology and harm evolves.

  **Analysis: Non-Negotiables, Tensions, and Deal-Breakers**

  1.  **Non-Negotiable Requirements:** 2.1 (Boundary Integrity), 2.2 (Harm/Dysfunction), 2.3 (Empirical Grounding), and 2.4 (Practical Applicability) are fundamental. A theory failing any of these is likely unusable.
  2.  **Naturalist (e.g., Boorse) vs. Normativist (e.g., Wakefield Hybrid) Tensions:**
      *   **Naturalist Preference:** Strong emphasis on 2.3 (objective dysfunction, often evolutionarily defined), sees 2.2 as derivative of dysfunction. Tries to minimize values (beyond "survival/reproduction").
      *   **Normativist Preference:** Explicitly incorporates values into the harm component (2.2), sees dysfunction as necessary but insufficient without harm. More comfortable with the role of values in 5.2.
      *   **Core Tension:** Can "dysfunction" be defined *purely* objectively/value-neutrally (Naturalist ideal)? Or is the judgment of what constitutes "harm" and "significant" harm inherently value-laden (Normativist claim)? **This is the central philosophical battleground.** Wakefield's "Harmful Dysfunction" attempts a hybrid.
  3.  **Jointly Unsatisfiable Pairs?**
      *   **Pure Objectivity + Practical Applicability:** Achieving perfect value-neutrality (Naturalist ideal) while satisfying 2.4 (guiding real-world decisions steeped in values) and 5.2 (explaining historical shifts often driven by values) might be impossible. Medicine *is* a value-laden enterprise.
      *   **Radical Relativism + Boundary Integrity:** If disease is *only* defined by societal values (extreme normativism), 2.1 collapses entirely, as does the justification for medicine as a distinct profession.
  4.  **Highest-Leverage Requirement:** **2.1 (Boundary Integrity)** does the most work in eliminating popular candidates.
      *   **Eliminates "Disease = Undesirable State":** Fails 2.1 (no boundary), 3.1, 3.2, 3.3, 3.4.
      *   **Eliminates "Disease = Statistical Abnormality":** Fails 3.3, 3.4, and often 2.2 (e.g., rare beneficial traits).
      *   **Eliminates Strong Social Constructionism (Disease *only* defined by power/society):** Fails 2.3 (empirical grounding), 2.1 (no stable boundary), and struggles with 4.1/4.2.
      *   **Challenges Pure "Choice" Models:** Fails 2.2 (ignores underlying dysfunction causing impaired agency) and 2.3 (ignores neuroscience of conditions like addiction).
  5.  **Dealing with Your Cases (Briefly):**
      *   **Addiction/Obesity:** THD must assess if there's a core *dysfunction* (e.g., reward circuitry dysregulation, metabolic dysregulation) causing significant *harm* (health, function, agency) beyond simple "bad choices," even if choices play a role in initiation/progression.
      *   **ADHD:** THD must assess if core executive function *dysfunctions* exist, causing *harm* (academic, social, occupational) in typical environments, beyond mere non-conformity.
      *   **Long COVID:** THD must assess if there's identifiable physiological *dysfunction* (even if mechanism unclear) causing persistent *harm* after infection, distinct from general post-viral fatigue or psychosomatic illness.

  **Conclusion:** The RD demands a THD that is **biologically grounded, harm-centric, practically useful, and boundary-preserving.** It must reconcile the objective reality of biological dysfunction with the subjective reality of harm and value judgments inherent in medicine and society. Wakefield's "Harmful Dysfunction" is a leading contender because it explicitly tackles this hybrid requirement (Dysfunction = Naturalist component; Harm = Normativist component). However, defining "dysfunction" objectively and "harm" non-arbitrarily remain the critical challenges. Evaluating any THD against this RD exposes its strengths and weaknesses far more effectively than trading intuitions about dopamine or choice. This shifts the debate to: "How well does theory X satisfy these core requirements?"
