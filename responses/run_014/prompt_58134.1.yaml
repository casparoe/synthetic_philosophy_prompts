prompt: |-
  I serve as director of policy review for a mid-sized city government, responsible for screening proposed ordinances and administrative rules before they go to the elected council for final approval.

  My office reviews roughly a dozen proposals each month under significant time pressure. The analysts who conduct the initial review have legal and administrative training but no background in political philosophy, and each review must be completable in about an hour. Our assessments are advisory, with the elected council retaining final authority, but a negative assessment requires us to explain in plain terms why a proposal raises a liberty concern and what would mitigate it.

  I want a reusable decision procedure grounded in the three-way distinction among negative, positive, and republican liberty as I roughly understand it: negative liberty as absence of deliberate human obstruction of action, positive liberty as possession of the capacities and conditions for self-direction rather than acting from internalized constraint or lack of viable alternatives, and republican liberty as absence of subjection to the uncontrolled discretionary power of another, even when that power is not currently exercised. The procedure should translate these ideas into a sequence of questions to be asked in order, with guidance on what evidence counts as a sufficient answer at each step, where a proposal can be cleared, where it must be flagged, and where factual inquiry ends and a value judgment by the council must take over.

  Please provide such a procedure in the form of a checklist or flowchart described in words that preserves the distinctions that matter most for practice while simplifying where appropriate, and that explicitly marks the points where staff judgment cannot be eliminated and the predictable ways the simplification may misfire.

  Then demonstrate the procedure by applying it to the following three pending proposals:

  A park-hours ordinance that closes all city parks overnight to reduce vandalism, with a provision authorizing individual officers to permit overnight presence for good cause under no published criteria and with no review of refusals, in a context where officers have stated they intend to enforce the closure only rarely.

  A sanitation-department scheduling system in which an optimization tool assigns shifts and in practice honors almost all employee preferences, but the governing labor policy reserves to supervisors an unqualified right to reassign any shift without explanation and without appeal, a right supervisors seldom use.

  A voluntary anti-poverty program that offers substantial rental assistance on condition that participants complete a financial-management course and agree to quarterly spending reviews with a caseworker, where eligible residents report that without the assistance they face eviction and have no comparable alternative.

  The demonstration should include at least one case in which the procedure yields a result likely to be unwelcome to the council or to program advocates, and should conclude with a concise statement of what the procedure cannot settle and why.
reasoning: |-
  We are creating a decision procedure based on three types of liberty: negative, positive, and republican. The procedure will be a step-by-step checklist that the analysts can follow. Each step will have a question and guidance on what to look for and when to flag a proposal.

  **Decision Procedure for Liberty Review**

  **Step 1: Negative Liberty Concern (Absence of deliberate human obstruction)**
     - Question: Does the proposal create a new rule that deliberately obstructs an individual's actions (by prohibiting, requiring, or penalizing an action) or remove an existing obstruction?
     - Evidence: Look for explicit prohibitions, requirements, penalties, or removals of such.
     - Clearing condition: If the proposal does not create any new obstruction (or removes an existing one), there is no negative liberty concern. Proceed to Step 2.
     - Flagging condition: If it does create a new obstruction, note the nature and extent. However, note that not every obstruction is necessarily a problem (e.g., prohibiting theft). But if the obstruction is present, we must consider if it is justified. But note: justification is not our role. We are to note the concern and then move to the next step to see if it might be mitigated or if other concerns arise.

     - However, because negative liberty is about absence of obstruction, the mere existence of an obstruction is a concern. But we are not to decide if it is justified. We are to note it and then see if it is arbitrary (which might be a republican concern) or if it impacts positive liberty.

  **Step 2: Republican Liberty Concern (Absence of subjection to arbitrary power)**
     - Question: Does the proposal create or maintain a situation where an individual or entity is subject to the arbitrary (uncontrolled discretionary) power of another?
     - Evidence: Look for unchecked discretion in the application of rules (e.g., vague standards, no requirement for explanation, no review, no published criteria, or no accountability mechanisms). Also, note if the proposal creates dependency on the will of another without safeguards.
     - Clearing condition: If the rule includes clear criteria, requires reasons for decisions, provides for review or appeal, or otherwise limits discretion, then no republican liberty concern. But note: if the rule is not applied arbitrarily in practice, but the structure allows it, that is still a concern because the power exists.
     - Flagging condition: If there is arbitrary power, note it. This step must be flagged regardless of how rarely the power is used because the concern is about the structure of power.

  **Step 3: Positive Liberty Concern (Conditions for self-direction)**
     - Question: Does the proposal enhance or impede an individual's capacity for self-direction (e.g., by providing resources, skills, or removing internal or external barriers that prevent autonomous action) or does it create conditions that might lead to internalized constraint or lack of viable alternatives?
     - Evidence: Look for provisions that build capabilities (e.g., education, resources) or that might coerce or condition essential goods in a way that could undermine autonomy (e.g., attaching strings to basic needs without alternatives). Also, consider if the proposal leaves individuals without viable options.
     - Clearing condition: If the proposal clearly enhances capacities or removes barriers without creating new ones, it might be positive for positive liberty. If it does not affect capacities or barriers, then no concern.
     - Flagging condition: If the proposal imposes conditions on essential goods that might be seen as paternalistic or if it leaves individuals without viable alternatives (thus forcing them into a choice), then flag.

  **Step 4: Synthesis and Mitigation**
     - After the above, consider:
          a) If a concern was flagged in Step 1 (negative liberty) but the rule is non-arbitrary (Step 2 cleared) and does not harm positive liberty (Step 3 cleared or even helps), then the concern might be mitigated by the rule's design. However, we still note the negative liberty concern but explain that it is non-arbitrary and does not harm autonomy.
          b) If a concern was flagged in Step 2 (republican), this is a strong flag because arbitrary power is inherently a threat even if not exercised. Mitigation would require adding safeguards (criteria, reasons, review).
          c) If a concern was flagged in Step 3 (positive), we note whether the proposal overall enhances positive liberty despite the condition (e.g., if it provides essential resources that would otherwise be unavailable) or if the conditions are so onerous as to undermine the benefit.

     - However, note: our role is advisory. We do not make the final judgment on whether the trade-off is acceptable. We only identify the concerns and suggest mitigations.

  **Where Staff Judgment is Needed and Simplification Risks:**
     - Step 1: Judgment on whether an obstruction is created. Sometimes it might be ambiguous (e.g., a regulation that indirectly obstructs). The risk is over- or under-inclusion.
     - Step 2: Judgment on what counts as "arbitrary". The risk is that if discretion is very narrow, it might not be arbitrary, but if there are no criteria at all, it clearly is. Also, even if criteria exist, if they are too vague, it might still be arbitrary. The risk is that we might miss subtle forms of arbitrariness.
     - Step 3: This step is the most subjective. What counts as "essential goods"? What conditions are too onerous? The risk is that without philosophical training, analysts might miss positive liberty implications.

     - In all steps, we note that if a proposal is flagged in Step 2 (republican liberty), it is a particularly strong concern because it creates a structure of domination even if not exercised. Step 3 concerns are more about the conditions for freedom and might be more acceptable if the alternative is worse.

     - Points where value judgment by council must take over: 
          - Weighing the benefits of the proposal against the liberty concerns (especially when there are trade-offs).
          - Deciding whether a condition on a benefit (positive liberty concern) is acceptable in light of the program's goals.
          - Deciding whether a negative liberty obstruction is justified by a compelling public interest.

  **Now, apply the procedure to the three proposals:**

  **Proposal 1: Park-hours ordinance**

  Step 1: Negative Liberty Concern
     - The ordinance creates a new obstruction: it prohibits being in parks overnight. This is a negative liberty concern. Flag.

  Step 2: Republican Liberty Concern
     - The provision allowing individual officers to permit overnight presence for "good cause" under no published criteria and with no review of refusals creates arbitrary power. Even though officers state they will enforce rarely, the discretionary power is uncontrolled. This is a republican liberty concern. Flag.

  Step 3: Positive Liberty Concern
     - The ordinance does not directly address capacities for self-direction. However, by closing parks, it might limit the options of homeless individuals who have no alternative shelter, but the ordinance does not by itself create that condition. The ordinance might exacerbate the lack of alternatives for some, but that is more a consequence of the negative liberty restriction. This step is not directly implicated. Clear.

  Synthesis: 
     - The proposal has both negative and republican liberty concerns. The republican concern is particularly strong because of the arbitrary power. Mitigation: Publish criteria for "good cause" and provide for review of refusals.

  **Proposal 2: Sanitation-department scheduling system**

  Step 1: Negative Liberty Concern
     - The system itself (optimization tool) does not create a new obstruction; it honors preferences. However, the labor policy reserves to supervisors an unqualified right to reassign any shift without explanation and without appeal. This reassignment power is a potential obstruction (if a supervisor reassigns, the employee is obstructed from working the desired shift). So, there is a potential negative liberty concern. Flag.

  Step 2: Republican Liberty Concern
     - The unqualified right to reassign without explanation and without appeal is the very definition of arbitrary power. Even if seldom used, the employee is subject to the supervisor's uncontrolled discretion. This is a republican liberty concern. Flag.

  Step 3: Positive Liberty Concern
     - The scheduling system in practice honors preferences, which might enhance positive liberty by allowing employees to plan their lives. However, the reassignment power might undermine that by creating uncertainty. But the condition of being subject to arbitrary reassignment might lead to internalized constraint (e.g., fear to complain). This is a concern about positive liberty because it might impede self-direction through fear of arbitrary power. However, the main concern is already captured by Step 2. We can flag it here too, but the Step 2 flag is primary.

  Synthesis:
     - The proposal has negative and republican liberty concerns. The republican concern is strong. Mitigation: Require supervisors to provide reasons for reassignments and create an appeal process.

  **Proposal 3: Voluntary anti-poverty program**

  Step 1: Negative Liberty Concern
     - The program is voluntary. It does not impose any obstruction; it offers assistance. Therefore, no negative liberty concern. Clear.

  Step 2: Republican Liberty Concern
     - The program requires participants to agree to quarterly spending reviews with a caseworker. The caseworker might have discretion in how they conduct the reviews, but the program does not specify. However, the conditions are agreed to by the participant. Also, the participant can exit the program at any time (assuming it's voluntary). Therefore, there is no subjection to arbitrary power because participation is voluntary. Clear.

     - But note: If the caseworker has discretionary power that affects the participant's continued eligibility and that power is arbitrary, then there might be a concern. However, the proposal does not specify. We might need to ask for more details. But as described, it's not clear that the caseworker has arbitrary power. Let's assume the program has set criteria for continued eligibility and the reviews are non-punitive. So, we clear.

  Step 3: Positive Liberty Concern
     - The program offers rental assistance which is essential to avoid eviction. This enhances positive liberty by providing a resource. However, it conditions this assistance on completing a financial-management course and agreeing to spending reviews. These conditions might be seen as paternalistic, potentially undermining autonomy by imposing external control over personal decisions. Moreover, the eligible residents report they have no comparable alternative. Thus, they are forced to accept the conditions to avoid eviction. This creates a situation of "no real choice" which undermines positive liberty. Flag.

  Synthesis:
     - The proposal has a positive liberty concern because it conditions essential aid on compliance with potentially intrusive requirements, and the lack of alternatives makes the choice not truly voluntary. However, the program does enhance positive liberty by providing resources that would otherwise be unavailable. This is a trade-off. Mitigation: Consider making the conditions less intrusive or providing alternative forms of assistance to ensure real choice.

  **One unwelcome result:**
     - For the anti-poverty program, the positive liberty flag might be unwelcome to advocates because they see the program as helping. But we note that the conditionality and lack of alternatives create a concern.

  **Conclusion: What the procedure cannot settle**
     - The procedure cannot settle the value judgment of whether the benefits of a proposal outweigh the liberty concerns. For example, in the anti-poverty program, is the paternalism justified by the benefits? The council must decide that. Also, the procedure cannot resolve ambiguities in the facts (e.g., exactly how discretionary a power is) without more information. It is a tool for identifying potential liberty concerns, not a substitute for political deliberation.
answer: |-
  ### Liberty Review Decision Procedure  
  This checklist operationalizes the three liberty concepts into a sequential, evidence-based assessment. Analysts should answer each question in order, stopping if a proposal is cleared or flagged. **Key simplifications**:  
  - **Negative liberty** focuses solely on *new deliberate obstructions* (bans, mandates, penalties).  
  - **Republican liberty** prioritizes *structural arbitrariness* (uncontrolled discretion) over outcomes.  
  - **Positive liberty** centers on *essential capacities/alternatives* (basic needs, viable choices).  

  **Staff judgment thresholds** (where subjectivity enters):  
  - Step 2: Determining if discretion is "uncontrolled."  
  - Step 3: Defining "essential capacities" or "viable alternatives."  
  - Step 4: Weighing trade-offs (council must decide).  

  **Simplification risks**:  
  - May miss subtle coercion (e.g., indirect positive liberty harms).  
  - Overlooks republican concerns when power is latent but credible.  
  - Cannot resolve conflicts between liberty types (council must balance).  

  ---

  #### **Step 1: Negative Liberty Screen**  
  *Question: Does the proposal create a new deliberate obstruction to action (e.g., ban, mandate, penalty) where none existed?*  
  - **Evidence required**: Explicit text creating prohibitions/requirements.  
  - **Clear**: If no new obstruction (e.g., voluntary programs, resource additions). Proceed to Step 3.  
  - **Flag**: If new obstruction exists. Proceed to Step 2.  
  - *Staff judgment*: Minimal. Focus on explicit legal barriers.  

  #### **Step 2: Republican Liberty Screen**  
  *Question: Does the proposal grant discretionary power that is (a) uncontrolled (no binding criteria, explanation, or review) and (b) capable of significantly impacting life/choices?*  
  - **Evidence required**:  
    - Uncontrolled = No published standards, no requirement for written justification, no appeal/review mechanism.  
    - Significant impact = Power affects access to essentials (housing, work, bodily integrity) or imposes penalties.  
  - **Clear**: If controlled discretion (e.g., published criteria, appeals process) OR insignificant impact. Proceed to Step 3.  
  - **Flag**: If uncontrolled discretion + significant impact. Mitigation needed (e.g., add criteria/review). **Stop here**—no further review needed.  
  - *Staff judgment*: Moderate. Assess "significance" of impact and whether discretion is truly uncontrolled.  
  - *Simplification risk*: May clear rarely used power that still creates vulnerability.  

  #### **Step 3: Positive Liberty Screen**  
  *Question: Does the proposal (a) undermine access to essential capacities (e.g., housing, health, income) OR (b) create conditions with no viable alternatives?*  
  - **Evidence required**:  
    - Undermines capacities: Reduces resources/skills for autonomy (e.g., cuts housing aid without alternatives).  
    - No viable alternatives: Beneficiaries face severe harm (e.g., eviction, destitution) if they reject terms.  
  - **Clear**: If it expands capacities (e.g., unconditional aid) OR preserves alternatives (e.g., other assistance exists).  
  - **Flag**: If it conditions essential goods on coercive terms OR eliminates alternatives. Proceed to Step 4.  
  - *Staff judgment*: High. Requires contextual evaluation of "essential" needs and "viable" options.  

  #### **Step 4: Trade-off Assessment (Council Judgment)**  
  *If flagged in Steps 1/3, but cleared elsewhere:*  
  - Explain liberty risks and non-arbitrary design (e.g., "Obstruction exists but is non-discretionary").  
  - If flagged in Step 3, note whether benefits outweigh autonomy costs.  
  - **Council must decide**: Staff cannot resolve trade-offs between liberty and policy goals.  

  ---

  ### Application to Proposals  
  #### **1. Park-Hours Ordinance**  
  - **Step 1**: New obstruction (overnight ban). **Flag**.  
  - **Step 2**: Officer discretion is uncontrolled (no criteria, no review) and significant (can deny shelter). **Flag + Mitigation needed** (e.g., publish criteria, allow appeals).  
  - **Stop**. **Republican liberty concern is primary**.  
  - *Conclusion*: **Flagged**. Risk of arbitrary exclusion even if rarely enforced.  

  #### **2. Sanitation-Department Scheduling**  
  - **Step 1**: No new obstruction (assignments honor preferences). **Clear**.  
  - **Step 3**: Does not undermine capacities (shifts mostly preferred). **Clear**.  
  - **Step 2**: Reassignment power is uncontrolled (no explanation/appeal) and significant (affects livelihoods). **Flag + Mitigation needed** (e.g., require written justifications, appeals process).  
  - *Conclusion*: **Flagged**. Supervisors hold latent arbitrary power—staff cannot assume non-use.  

  #### **3. Anti-Poverty Program**  
  - **Step 1**: Voluntary; no obstruction. **Clear**.  
  - **Step 2**: Caseworker discretion unclear, but no evidence of uncontrolled power (e.g., reviews tied to program rules). **Clear**.  
  - **Step 3**:  
    - Enhances capacities (rental aid prevents eviction).  
    - **But** conditions (spending reviews) attached to essential goods with **no viable alternatives** (participants face eviction otherwise).  
    - **Flag**: Coercive terms undermine positive liberty by forcing intrusive oversight as the "price" for survival.  
  - **Step 4**: Trade-off exists—program aids stability but compromises autonomy. **Council must decide** if benefits justify paternalism.  
  - *Conclusion*: **Flagged for positive liberty concern**. Likely unwelcome to advocates, as it questions "voluntary" design when alternatives are absent.  

  ---

  ### What the Procedure Cannot Settle  
  **Value conflicts** must be resolved by the council:  
  1. **Trade-offs**: When policy goals (e.g., reducing vandalism, efficient staffing, poverty relief) conflict with liberty risks.  
  2. **Threshold judgments**: Whether an alternative is "viable" or a capacity is "essential" depends on contested social/economic views.  
  3. **Latent harms**: Republican liberty risks from unexercised power are structural but may be deemed acceptable if benefits are high.  

  **Why?** Liberty concepts are philosophically contested; this procedure identifies risks but cannot weigh them against collective goods without political judgment.
