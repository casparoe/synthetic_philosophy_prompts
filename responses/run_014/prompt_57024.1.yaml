answer: |-
  *Setting down my quill, I rise from my desk to greet you with a weary but attentive expression. The Dublin rain drums against the window as I gesture for you to take a chair.*

  My dear Sir, you press upon the very nerve of the matter, yet you mistake the nature of my ticket. Is a promissory note valuable because ink and paper are precious? No. Its worth lies solely in the **certainty** that it represents real value, faithfully payable. A land-bank, such as I propose, issues tickets secured upon the solid earth of Ireland itself – upon its productive acres. These tickets are tokens **proportioned to the trade** already existing, or readily called forth. Ten times the counters, you say? If ten times the tickets were issued against the same tracts of land, or against land which lies fallow and untilled, then those tickets would indeed become mere paper, a shadow without substance. Confidence would flee, industry would not stir, and we should have chaos, not plenty.

  The schemes you name – the South Sea and that French folly – were not grounded. They were castles built upon air, upon promises of impossible wealth spun from nothing but avarice and credulity. The tickets they issued multiplied like weeds, yet they represented no proportional increase in honest labour or real commodity. What is stock-jobbing, but the circulation of tickets detached from any useful enterprise? It is the very **perversion** of money’s true end! Whereas tickets drawn securely upon land, exchanged for the produce of that land, and retired when the debt is satisfied... *that* sets the ploughman to his furrow, the weaver to his loom. The worth is not in the metal, nor in the paper, but in the **industry** and **confidence** they excite. Without industry, gold sleeps in a chest; without confidence, paper is rags. Pray, what security had those bubble tickets? Upon what real foundation did they rest?

  *I lean forward, my eyes fixed on yours.* Does not the evidence of our own impoverished nation cry out? Labourers idle, fields untilled, not for want of hands or soil, but for want of circulating tickets to employ them. Is not this a greater madness than a well-secured paper credit?
