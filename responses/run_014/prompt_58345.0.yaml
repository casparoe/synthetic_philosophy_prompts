            Option 1: Sign up and then use the bridge at least 10 times.
            Option 2: Don't sign up.

          Outcomes:
            Option 1: We get the discount (say $100 per month) but we might have to use the bridge when it's not the fastest route (costing us $20 per detour). If we use it exactly 10 times, the detour cost is $200. Net: $100 - $200 = -$100.
            Option 2: We don't get the discount, but we use the bridge only when it's best. We use it 8 times on average. No detour cost. Net: $0.

          But wait, if we sign up and then use the bridge exactly 10 times, we have to detour for 2 times (because we would have used it only 8 times otherwise). So detour cost: 2 * $20 = $40. Then net: $100 - $40 = $60. This is better than $0.

          So we choose Option 1: sign up and commit to using the bridge 10 times.

          Step 6: Check for ex post irrationality.
            On a day when we are scheduled to use the bridge to meet the quota (the 10th use), but there is a faster route available (saving $20), we are forced to use the bridge and lose $20. We then think: "If I don't use the bridge, I save $20, but then I will have only used it 9 times and I will have to pay the penalty (say $50)." So locally, it's better to use the bridge and lose $20 than to not use it and lose $50. Therefore, we use the bridge.

            So ex post, we don't regret the decision. 

          To get ex post irrationality, we need a case where in the moment, we would rather not follow the policy.

          Case I: A security deposit with a supplier.

          We are offered a contract with a supplier for better prices if we make a security deposit of $500. The deposit is forfeited if we ever switch suppliers. The supplier uses our policy to predict whether we will switch. We are now deciding on the policy.

          Policy options:
            Option 1: Make the deposit and never switch.
            Option 2: Make the deposit and switch if it's profitable.
            Option 3: Don't make the deposit.

          Outcomes:
            Option 1: We get the better prices (saving $1000 over the year) and never switch, so we lose the $500 deposit opportunity cost (or the interest). Net: $1000 - $500 = $500.
            Option 2: We make the deposit, but then if we switch, we lose the deposit. The supplier predicts we will switch (because that's the policy) and doesn't offer the contract? Or if they do, then when we switch, we lose the deposit. But if we switch, we might save $800 by using a cheaper supplier. So net: $800 - $500 = $300, plus we lost the better prices? This is messy.
            Option 3: No deposit, no better prices. Net: $0.

          The best is Option 1: net $500.

          Step 6: Check for ex post irrationality.
            Suppose we are in a situation where switching would save us $600. If we switch, we lose the deposit ($500) and we also lose the better prices for the future? But the contract might be terminated. Let's say we lose the better prices for the remaining year (worth $600) and the deposit. So total cost of switching: $500 (deposit) + $600 (future lost savings) = $1100. The immediate saving is $600. Therefore, it's not worth switching. So no ex post irrationality.

          Given the time, I will use a standard Newcomb-like example embedded in the freight context.

          Case J: A predictor (such as a sophisticated vendor) offers our fleet a choice between two:
            - Box A contains $1,000.
            - Box B contains $0 or $10,000.

          The vendor has predicted our choice. If they predict we will take only Box B, then they put $10,000 in Box B. If they predict we will take both boxes, they put $0 in Box B.

          Our policy options:
            Option 1: Take only Box B.
            Option 2: Take both boxes.

          Outcomes:
            Option 1: We get $10,000.
            Option 2: We get $1,000 + $0 = $1,000.

          We choose Option 1: $10,000.

          Step 6: Check for ex post irrationality.
            When we are about to open the boxes, we know the vendor has already made the prediction and filled the boxes. We are committed to taking only Box B. But we think: "If the vendor put $10,000 in Box B, then taking both boxes would get us $11,000. If the vendor put $0 in Box B, then taking both boxes would get us $1,000. But we don't know what they put. However, the vendor is a perfect predictor. So if we take both boxes, then the vendor would have predicted that and put $0 in Box B. And if we take only Box B, the vendor would have put $10,000. So we are better off taking only Box B."

            But after the boxes are filled, we might think: regardless of what's in Box B, taking both boxes gives us an extra $1,000. So we wish we could take both.

            This is ex post irrationality: in the moment, we see that taking both boxes would have been better.

          However, in our procedure, we would choose the policy of taking only Box B and get $10,000. And we are prepared to accept that in the moment we will feel like taking both, but we won't because we've committed to the policy.

          This case might be too philosophical for the freight context, but it illustrates the point.

          Given the time, we'll use Case J as embedded in a vendor relationship.

          In the freight context:

          A vendor offers:
            - A guaranteed payment of $1,000 if we agree to take the guaranteed payment and forgo the performance bonus.
            - Or a performance bonus of $10,000 if we meet a target, but only if the vendor predicts we will meet the target. The vendor's prediction is based on our published policy. If the vendor predicts we will meet the target, they will set the target as achievable and we will meet it and get $10,000. If they predict we will not meet the target, they set an impossible target and we get $0.

          Policy options:
            Option 1: Commit to meeting the target (and forgo the guaranteed payment).
            Option 2: Take the guaranteed payment.

          Outcomes:
            Option 1: Vendor predicts we meet the target, sets an achievable target, we meet it and get $10,000.
            Option 2: We get $1,000.

          Choose Option 1.

          Step 6: Ex post, when we are working to meet the target, we might think: "I wish I had taken the guaranteed payment and also tried for the target. Then I might have gotten $1,000+$10,000=$11,000." But the vendor would have predicted that we would not be fully committed and would have set an impossible target. So we would have gotten only $1,000.

          Therefore, we stick with the policy.

          So in this case, the procedure chooses Option 1, and we live with the ex post feeling that we could have had both.

