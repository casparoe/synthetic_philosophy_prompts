  **Concise statement of limitations:**

  The procedure cannot settle cases where:
     - The number of similar instances is unknown or very hard to estimate.
     - The long-term reputational effects are too uncertain to quantify.
     - There is no clear way to break symmetries among instances.
     - The policy might not be followed in the field (due to incentives to deviate).
     - The values of outcomes are hotly disputed among board members.

  It is most likely to misfire in settings with:
     - Extremely rare events (where our outcome estimates are guesses).
     - Complex strategic interactions with many players.
     - Hidden information that affects the outcome.
     - When the board is not committed to following the policy and might second-guess in the field.
