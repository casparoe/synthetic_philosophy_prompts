          The point is: the updateless perspective says we set the policy in advance. But in this case, if we set the policy to cooperate, then in the field an agent might have an incentive to defect (because it increases the company's profit). Therefore, the policy of "cooperate" is not incentive-compatible. 

          However, the procedure in Step 5 chose cooperation because it yields $1000 and that's the best symmetric policy. But then in the field, the agent might defect and we get $1200. That's even better. 

