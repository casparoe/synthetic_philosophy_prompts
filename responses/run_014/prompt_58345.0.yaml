  ### Updateless Policy Review Procedure (7 Steps)

  **Core Principle**: Choose policies by asking, "If *all* similar agents (our copies or predictable outsiders) follow this rule, what outcome emerges?"—not by optimizing in the moment.

  1. **Identify Predictable Symmetry**  
     *Question*: Which agents/parties face the same choice, and who anticipates our policy?  
     *Evidence*: System logs showing identical agent deployments, vendor contracts citing policy reliance, or regulator disclosures of simulation methods. Timebox: 5 mins.  
     *Stop if*: No symmetry found (e.g., unique one-off event). Escalate if uncertainty exceeds 30% of stakes.

  2. **List Feasible Policies**  
     *Question*: What simple, codable rules could govern this choice?  
     *Evidence*: 2–3 options from engineering leads (e.g., "always yield" vs. "randomize"). Timebox: 3 mins.  
     *Stop if*: No safe baseline policy exists (e.g., all options risk legal breach).

  3. **Model Universal Adoption**  
     *Question*: If *every* predictable party follows Policy X, what happens?  
     *Evidence*: Quick game theory matrices, historical analogs, or Monte Carlo sims with 3 key variables. Timebox: 8 mins.  
     *Stop if*: High outcome variance (e.g., >±50% of stakes). Escalate for sensitivity testing.  
     *Judgment start*: Tolerate counterfactual estimates (e.g., "vendor trust decay = $X").

  4. **Score Aggregate Outcomes**  
     *Question*: What’s the net cost/benefit *across all instances* of Policy X? Include reputation.  
     *Evidence*: Monetized outcomes (e.g., delay costs × frequency) using pre-agreed unit costs. Timebox: 5 mins.  
     *Judgment dominance*: Weigh trade-offs (e.g., short-loss vs. long-trust).

  5. **Select Prior Policy**  
     *Question*: Which policy maximizes total value under universal adoption?  
     *Evidence*: Comparison from Step 4. Timebox: 2 mins.  
     *Refuse if*: Best policy nets negative value (e.g., certain net loss).

  6. **Stress-Test Ex Post Feel**  
     *Question*: If we were alone in this situation, would we regret following the chosen policy?  
     *Evidence*: Scenario snippet (e.g., "One truck facing delay cost"). Timebox: 2 mins.  
     *Escalate if*: Regret risk >20% of gains. Otherwise, accept UDT logic.

  7. **Sign Off or Park**  
     *Question*: Is this policy traceable and deployable?  
     *Evidence*: Documentation from Steps 1–6.  
     *Park if*: >1 unresolved risk. Deploy if net positive and executable.

  ---

  ### Case Demonstrations

  **Case A: Two Trucks at Loading Bay**  
  *Context: Mutual delay costs $500; unilateral yield costs $100 to yielder.*  
  1. **Symmetry**: Both trucks run identical code (predictable copies).  
  2. **Policies**: (1) Always insist, (2) Always yield, (3) Yield if lower ID.  
  3. **Universal adoption**:  
     - (1) Both insist → $500 × 2 = $1,000 loss.  
     - (2) Both yield → Deadlock, assume $300 × 2 = $600 loss.  
     - (3) Asymmetric yield → $100 loss (yielder) + $0 = $100 loss.  
  4. **Net outcome**: (3) saves $900 over (1), $500 over (2).  
  5. **Select**: (3) minimizes total loss.  
  6. **Ex post**: Yielder "regrets" $100 loss, but total system gain justifies.  
  7. **Verdict**: Deploy asymmetric yield policy.  

  **Case B: Fuel Vendor Contract**  
  *Context: Vendor profits only if we don’t divert during price spikes. Predicts using our policy.*  
  1. **Symmetry**: Vendor anticipates policy; all trucks face same spike choice.  
  2. **Policies**: (1) Never divert, (2) Always divert.  
  3. **Universal adoption**:  
     - (1) Vendor offers contract. Spike cost: $2,000; contract saves $1,500/mo. Net/quarter: −$2,000 + $4,500 = +$2,500.  
     - (2) No contract. Diversion saves $2,000; lose $4,500/quarter → −$2,500.  
  4. **Net outcome**: (1) nets +$2,500; (2) nets −$2,500.  
  5. **Select**: (1) Never divert.  
  6. **Ex post**: During spike, not diverting *feels* irrational ($2,000 loss), but contract gains outweigh.  
  7. **Verdict**: Deploy "never divert" policy.  

  **Case C: Municipal Regulator Simulation**  
  *Context: Regulator simulates past code; patch affects past/future compliance.*  
  1. **Symmetry**: Regulator simulates current code (predictable anticipation).  
  2. **Policies**: (1) Don’t patch, (2) Patch to comply.  
  3. **Universal adoption**:  
     - (1) No patch: Past fine = $10,000. Future non-compliance fines = $5,000/quarter. Net/year: −$30,000.  
     - (2) Patch: No fine (simulation shows compliance). Future routing costs = $1,000/quarter. Net/year: −$4,000.  
  4. **Net outcome**: (2) saves $26,000/year.  
  5. **Select**: (2) Patch code.  
  6. **Ex post**: Paying future routing costs *feels* irrational if fine already avoided, but total savings clear.  
  7. **Verdict**: Deploy patch.  

  **Ex Post Irrationality Example (Case B)**  
  - **Verdict**: Never divert during spikes.  
  - **Why it feels irrational**: When a spike hits, diverting would save $2,000 immediately, making *in-situ* optimization tempting.  
  - **Why UDT endorses it**: Universal policy secures the vendor contract ($4,500/quarter), which outweighs spike losses. Diverting sabotages trust and terminates gains.  

  ---

  ### Limitations and Risk Zones  
  **What the procedure cannot settle**:  
  - Deeply uncertain outcomes (e.g., novel competitor reactions).  
  - Non-quantifiable values (e.g., ethical reputation beyond unit costs).  
  - Interdependent policies requiring multi-agent equilibria.  

  **Most likely to misfire in**:  
  - Low-frequency/high-stakes scenarios (poor data for Step 3).  
  - Reputation-heavy cases (subjectivity in Step 4).  
  - Chaotic systems (e.g., market crashes breaking anticipation in Step 1).  

  **Mitigation**: Escalate cases with asymmetry >$5K or ambiguity >30% stakes.
