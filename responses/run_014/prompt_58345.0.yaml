          This is a limitation.

          For the sake of demonstration, let's assume that the code will be followed exactly. Then there is no deviation. Therefore, we don't have ex post irrationality. But if we relax that, then we do.

          Alternatively, we can use a case with a clear ex post irrationality from UDT:

          Case G: We are offered a bet by a perfect predictor. The predictor has already made a prediction about whether we will take the bet. We are now deciding whether to take the bet.

          But this is Newcomb-like, and not in our operational context.

          Given the constraints, let's use Case C to show ex post irrationality.

          In Case C, we decided to patch the code to avoid the fine. But after the fine is waived, we might regret the patch because it causes extra routing costs in the future. And we think: "If only we could have avoided the fine without patching, we wouldn't have to pay the extra costs." But we couldn't. We had to patch to avoid the fine. So we are stuck with the extra costs. But note: without the patch, we would have paid the fine and then we could patch afterwards to avoid future fines. That would cost: $10,000 (fine) + $4,000 (future routing costs) = $14,000. With the patch now: $4,000. So we are better off. There is no regret.

          Therefore, I will create a new case within the freight context that shows ex post irrationality.

          Case H: A toll bridge operator offers us a discount if we commit to using their bridge at least 10 times per month. They use our published policy to predict whether we will meet the commitment. If we sign up and then fail, we pay a penalty. We are now deciding whether to sign up.

