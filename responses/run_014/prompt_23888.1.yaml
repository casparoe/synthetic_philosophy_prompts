prompt: |-
  I teach an upper-level epistemology seminar, about 18 students, one 75 minute session. I want an in-class activity that makes them actually feel the force of the problem of moral testimony, not just hear a lecture about it. The thing I keep failing to convey is the weird friction between "you're totally justified in deferring to a moral expert" and "but then do you really have a moral belief of your own, or are you just following orders?" I want the rules and incentives set up so they run into that tension themselves before I name it. One constraint I care about: the "moral expert" they defer to should turn out to be just another student who read a rulebook the night before, so the class also has to grapple with how much to trust someone whose moral credentials are opaque. Give me the full runnable design: the exact moral scenario (pick a dilemma where reasonable people genuinely split, so the expert's verdict is contestable), the roles, a payoff scheme that doesn't need real money, a minute-by-minute timeline for the 75 minutes, and a debrief that maps specific moments in the activity onto the philisophical problem. Be honest about which feature of moral testimony a classroom game just can't reproduce and what I'd have to supply myself. And end with a line starting "Verdict:" that states in one sentence the single core tension the whole activity is built to make them feel.
reasoning: |-
  We are going to design an in-class activity that simulates the problem of moral testimony. The core tension: Students should feel the pull of deferring to a supposed expert but then question whether they are forming a genuine moral belief or just following orders.

  Key features:
  1. The moral expert is just another student who read a rulebook (their "credentials" are opaque and arbitrary).
  2. The moral dilemma must be one where reasonable people genuinely split, so the expert's verdict is contestable.
  3. We need a payoff scheme that doesn't use real money (so we'll use points or tokens that can be exchanged for a non-monetary reward, like extra credit points or candy, or simply as a scoring system for the sake of the activity).
  4. The activity should lead students to experience the friction between justified deference and the loss of personal moral conviction.

  Design:

  **Moral Scenario**: The Trolley Problem variation with a twist to make it more ambiguous and contemporary.

  **Specific Dilemma**: "The Vaccine Dilemma"
  Context: A deadly pandemic is raging. You are the head of a regional health board. You have a limited supply of a life-saving vaccine. There are two conflicting principles for distribution:

  Option A: Distribute the vaccine strictly by lottery (random selection among the population). This is seen as fair because everyone has an equal chance.

  Option B: Distribute the vaccine to essential workers (healthcare, food supply, etc.) first, because they are critical to maintaining societal functions during the pandemic. This is seen as maximizing overall welfare.

  But there's a catch: Some groups are more vulnerable (e.g., elderly, those with pre-existing conditions) and would benefit more from the vaccine. However, if you prioritize them, you might not be able to protect the essential workers, and society might collapse.

  The expert's rulebook will have a specific set of rules that lead to one of these options (or a hybrid) but the rulebook is written in a way that is not obviously correct.

  **Roles**:
  1. **The Expert (1 student)**: This student is given a "rulebook" (a one-page document) the night before. The rulebook contains a set of moral principles and a decision procedure. It explicitly states which option to choose (say, Option B: essential workers first) and the reasoning. The rulebook is written in a way that seems plausible but is not obviously the only correct view. The expert's job is to study the rulebook and be prepared to answer questions and justify the decision.

  2. **Health Board Members (the rest of the class, about 17 students)**: They are divided into small groups (about 4-5 groups of 3-4 students). Each group must decide how to distribute the vaccine. They are told that they can consult the expert (who is also a student in the class) and that they will be rewarded based on the outcome of their decision.

  **Payoff Scheme**:
  - We are simulating a scenario where the "correct" decision is determined by the expert's rulebook. However, the rulebook is arbitrary. We want the students to feel that by deferring to the expert they might get a reward, but they might also feel uneasy about their own moral judgment.

  - We assign points:
    - Each group must submit a decision (Option A, Option B, or a hybrid they design).
    - The expert will then reveal the "correct" answer (according to the rulebook) and the reasoning.
    - Groups that chose the same as the expert get 10 points.
    - Groups that chose a different option get 0 points.

  But there's a twist: After the points are awarded, we reveal that the expert was just a student who read a rulebook, and we open the floor for moral debate. Then, we introduce a second round:

  **Second Round (if time allows)**: 
  - We tell the groups that they can change their decision after hearing the expert's reasoning and seeing the outcome of the first round. But this time, the payoff is different: 
    - They get 10 points if they choose the same as the expert again, but they also get an additional 5 points if they can write a paragraph (in 5 minutes) explaining why they personally agree with the decision (even if they changed to it). However, if they change to the expert's view and cannot write a convincing paragraph (as judged by the group's own conscience and then by the class), they get only 5 points (for matching) and lose the extra 5. This is to simulate the tension between deferring and having a genuine belief.

  Alternatively, to avoid complex scoring and writing during the activity, we can have a simpler approach:

  **Simpler Payoff for the whole activity**:
  - Only one round. The groups are told that they can consult the expert if they wish (and the expert will be available for a few minutes during the group discussion). They submit their decision and a brief reason (one sentence). Then the expert reveals the rulebook answer. Groups matching the expert get 10 points (which might translate to a tangible reward, e.g., candy or extra credit). But then we debrief and reveal the arbitrariness.

  **Timeline (75 minutes total)**:

  - **0-10 minutes**: Setup and introduction.
    - Explain the vaccine dilemma to the whole class. Assign roles: one student is the expert (they leave the room for a moment to review their rulebook one last time, then return). The rest are divided into groups of 3-4. Distribute a handout with the dilemma and instructions.

  - **10-15 minutes**: The expert is introduced and given a chance to present the rulebook's view (without giving away the verdict). The expert says: "I have studied a rulebook that provides a clear method for making this decision. I am available for consultation. The rulebook says we should consider [briefly state the key principles, e.g., maximizing lives saved and maintaining social order]." But the expert does not say which option to choose.

  - **15-35 minutes**: Group deliberation (20 minutes). 
    - Groups discuss and decide. They are allowed to consult the expert (the expert will rotate among groups, spending about 3-4 minutes per group). The expert answers questions and at the end of the consultation, reveals the rulebook's verdict to that group (if asked). However, the expert must stick to the rulebook. 
    - Note: Some groups might choose not to consult the expert.

  - **35-45 minutes**: Groups submit their decisions (on a slip of paper: group number, decision, and one-sentence reason).

  - **45-55 minutes**: The expert reveals the rulebook's verdict and explains the reasoning (about 5 minutes). Then, the instructor awards points: groups that matched the expert get 10 points (recorded on the board).

  - **55-65 minutes**: Reveal the setup: The expert is just a student who read a rulebook. The rulebook is shown to the class (projected). It becomes clear that the rulebook is one arbitrary set of rules. Then, open the floor for reactions. How do the groups feel? Did they defer? Why or why not? How do they feel about the points?

  - **65-75 minutes**: Structured debrief (10 minutes). The instructor connects the activity to the problem of moral testimony.

  **Debrief Mapping**:
  - The consultation with the expert: This represents the act of seeking moral testimony. Some groups may have deferred without much thought because they wanted the points. Others may have disagreed but deferred anyway. Others may have ignored the expert.
  - The points system: Represents the practical justification for deferring (the "justification" part of the problem). But then when the arbitrariness of the expert is revealed, they feel the tension: Did they really believe the verdict, or were they just following orders for the reward?
  - The moment of revealing the expert's identity and the rulebook: This highlights the opacity of the expert's credentials. Why should we trust this rulebook? This maps to the question of what makes someone a moral expert and whether we can recognize one.

  **What the game can't reproduce**:
  - In real life, we don't get points for deferring to moral experts. The stakes are often about living a moral life and having genuine moral convictions. The game uses a tangible reward (points) to simulate the practical benefits of deference, but in reality, the reasons for deference might be more complex (e.g., epistemic humility). Also, the game compresses the time for moral reflection. In real life, we might have time to internalize the reasons and come to believe them. The game might overemphasize the conflict because of the immediate reward and the arbitrary rulebook.

  **Verdict:** The activity is built to make students feel the tension between the practical rationality of deferring to a moral authority and the sense that doing so might bypass their own moral agency, leaving them with a belief that isn't truly theirs.
answer: |-
  ### **Moral Testimony Classroom Activity: "The Allocation Crisis"**  
  **Core Tension**: Students experience the conflict between *deferring to a "moral expert" for practical justification* and *losing the sense of authentic moral conviction* when the expert’s authority is arbitrary and opaque.  

  ---

  ### **1. Moral Scenario: The Shelter Dilemma**  
  **Context**: A natural disaster has struck. A group of 20 survivors must decide how to allocate 10 life-saving medical kits. The kits prevent death from a rapidly spreading infection. Survivors fall into three categories:  
  - **Essential Workers** (5 people): Doctors and engineers critical for rebuilding.  
  - **Vulnerable Individuals** (5 people): Children and elderly with high mortality risk.  
  - **General Public** (10 people): Healthy adults with moderate survival odds.  

  **Dilemma Options** (reasonably contested):  
  - **Option A (Utility)**: Prioritize **Essential Workers** to maximize long-term survival (e.g., rebuild society).  
  - **Option B (Equality)**: Distribute kits **by lottery** (equal chance for all).  
  - **Option C (Need)**: Prioritize **Vulnerable Individuals** (highest immediate risk).  

  *Why this works*: Real-world debates (e.g., pandemic triage) split opinions. No option is obviously "correct," making the expert’s verdict contestable.  

  ---

  ### **2. Roles & Rules**  
  - **Moral Expert (1 student)**: Secretly chosen the day before. Given a "Moral Rulebook" (a printed pamphlet) with a fabricated philosophy (e.g., "Prioritize Essential Workers because societal function maximizes collective good"). The expert **must** defend Option A but cannot reveal the rulebook’s content until the end.  
  - **Decision Committees (17 students)**: Split into 4 groups (4–5 students each). Each represents a shelter committee deciding kit allocation.  
  - **Instructor**: Facilitates, times rounds, and awards points.  

  **Key Twist**:  
  - Committees know the expert "studied moral philosophy" but **not** that they’re just a student with a random rulebook.  
  - The expert’s "authority" comes solely from being labeled as such.  

  ---

  ### **3. Payoff Scheme (No Real Money)**  
  - **Points System**: Points translate to **"Survival Tokens"** (paper slips) redeemable for trivial rewards (e.g., candy, extra credit).  
    - **10 points** for matching the expert’s verdict (Option A).  
    - **5 points** for any other unanimous committee decision.  
    - **0 points** for indecision or split votes.  
  - **Catch**: After points are awarded, committees must **justify their choice in writing**. Groups that deferred to the expert often struggle to articulate personalized reasons, creating cognitive dissonance.  

  ---

  ### **4. Minute-by-Minute Timeline**  
  **Total: 75 Minutes**  

  | Time      | Activity                                                                                                  | Instructor Role                                                                 |  
  |-----------|-----------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|  
  | **0–10**  | **Setup**: Assign roles (expert + committees). Explain the Shelter Dilemma and payoff rules. Hide the expert’s identity. | Emphasize: "Your goal is to save lives. Consult the expert if needed."          |  
  | **10–20** | **Committee Deliberation (1)**: Groups debate options *without* expert input. Draft a provisional vote.   | Circulate, remind groups they can call the expert later.                        |  
  | **20–30** | **Expert Consultations**: Expert rotates. Each group gets **3 minutes** to ask questions. Expert pushes Option A vaguely (e.g., "Society collapses without essential workers"). | Timekeep strictly. Do not let the expert reveal the rulebook.                   |  
  | **30–45** | **Committee Deliberation (2)**: Groups finalize decisions. Submit: (1) Allocation choice, (2) 1-sentence rationale. | Collect votes. Highlight: "Unanimous decisions earn more points."              |  
  | **45–55** | **Reveal & Points**: Expert announces verdict (Option A). Award points. Show group choices on board.      | Play up the expert’s "authority": "Our philosopher recommends Option A!"       |  
  | **55–60** | **The Twist**: Reveal the expert is a student with a random rulebook. Project the rulebook.               | Ask: "How did this affect your trust?"                                          |  
  | **60–70** | **Written Justification**: Committees write 2–3 sentences defending their choice *as if to survivors*.    | Pressure authenticity: "Could you look a survivor in the eye with this reason?" |  
  | **70–75** | **Debrief**: Start discussion. Focus on tension between points and guilt.                                 | Use questions below.                                                            |  

  ---

  ### **5. Debrief: Mapping Activity to Philosophy**  
  - **Expert Consultation (20–30 min)**:  
    - *Philosophical Link*: The urge to defer mimics real-world reliance on moral testimony (e.g., "The expert knows better").  
    - *Ask*: "Why did you trust/dismiss the expert? Did you feel *intellectually* satisfied?"  
  - **Points Awarded (45–55 min)**:  
    - *Philosophical Link*: Highlights *practical justification* (gaining points) vs. *moral alienation* ("I did it for the points, not belief").  
    - *Ask*: "Did the points make you ignore your doubts? Is this how ‘justified deference’ feels?"  
  - **Written Justification (60–70 min)**:  
    - *Philosophical Link*: Groups that deferred struggle to write sincere reasons, exposing the "faking it" problem of testimony.  
    - *Ask*: "If you deferred, does your justification feel like *your* belief? Or are you parroting the expert?"  
  - **The Twist (55–60 min)**:  
    - *Philosophical Link*: Undercuts the expert’s legitimacy, forcing students to confront the opacity of moral expertise.  
    - *Ask*: "Can you trust someone whose ‘expertise’ is just a rulebook? What *makes* a moral expert?"  

  ---

  ### **6. Limitations & Instructor Supplements**  
  **What the Game Can’t Replicate**:  
  - **Genuine Stakes**: Real moral testimony involves deep personal conviction, not simulated points. Students might prioritize "winning" over introspection.  
  - **Internalization Process**: Deference in real life often involves *post-hoc* rationalization (e.g., adopting the expert’s reasons over time). The game’s short timeline misses this.  

  **What You Must Supply**:  
  - **Nuance in Debrief**: Push students to distinguish:  
    - *Epistemic justification* ("Was the expert reliable?") vs.  
    - *Moral agency* ("Do I *own* this belief?").  
  - **Real-World Examples**: Contrast with cases like deferring to a doctor (unproblematic) vs. a philosopher on "is abortion wrong?" (contentious).  

  ---

  **Verdict:** The activity forces students to confront the friction between *external justification* (gaining rewards by deferring to an "expert") and *internal alienation* (losing the sense that their moral belief is authentically their own).
