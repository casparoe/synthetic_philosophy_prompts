prompt: |-
  I'm giving a talk at a philosophy reading group in a few weeks and want to be ready for the question period. I've been working this out on my own, without much formal training, and it's what I think of as the internalist/externalist debate about reasons: whether you can have a genuine reason to do something when nothing in your own desires points you that way. I've come to believe in externalism, and my specific claim is that the internalist's main defense — that your reasons are fixed by your own motivational set, including the 'what I would want if I were better informed or more rational' version of it — quietly concedes the point, because once you let in facts about what a better-informed me would want, you've let in external facts, and internalism collapses into externalism. My audience is about fifteen people: most lean internalist and actually like the 'better-informed me' move, and two are moral psychologists who think the whole internalist/externalist distinction is a confusion about words and will say so. Please prepare me: the objections I'm actually likely to get from this specific crowd, not the stock objections a textbook lists, in roughly the order they'll come and ordered by how much damage each would do, each phrased the way an internalist or a moral psychologist would actually say it, with a reply I can give in about two minutes and an honest note on where that reply is weakest. Also tell me what to concede up front, what to hold firm on, and the one objection I'm most hoping nobody raises. Think very carefully before you answer, and write in the voice of someone who has actually sat through talks like this and knows how the questions really land.
reasoning: |-
  Okay, let me unpack this user's request. They're prepping for a philosophy talk where they'll argue that internalism about reasons collapses into externalism once it incorporates idealized conditions like "what a better-informed me would want." The audience includes mostly internalist-leaning folks who like that move, plus two moral psychologists who reject the whole framework. 

  Hmm, the user clearly knows their stuff but wants tactical advice for this specific crowd. They're not after textbook rebuttals but the live-wire objections this group would actually throw. And they want it ordered by damage potential, with replies that acknowledge weaknesses. Smart ask.

  First, I should map the battlefield. The internalists in the room will likely defend their "idealized agent" move as purely internal - just unfolding existing commitments. The moral psychologists will attack the premises. The user needs to expose how even idealized internalism smuggles in external standards, while handling the psychologists' deflationary angle without getting derailed.

  For the internalists, the killer objection is probably the "conceptual firewall" one - that idealized desires are still grounded in the agent's psychology. That could unravel the user's collapse argument if not countered well. The reply should stress how the "better-informed" standard imports external facts about rationality itself, but I'll note it risks conflating epistemic and motivational grounds.

  The moral psychologists' "terminology trap" is dangerous too - if the user takes that bait, the whole debate evaporates. Best to grant their point but pivot to why the distinction still matters for normative guidance. Though honestly, they're not wrong about the potential verbal disputes here.

  What the user should dread? Someone like Smith objecting that internalists can accommodate external reasons through constitutive commitments. That's a sophisticated move that could neutralize the collapse argument entirely. If it comes up, best to shift to metaethics fast - but man, that'd be a rough moment mid-Q&A.

  User should concede early that internalism captures something real about motivation, and hold firm on the externalist implications of idealization. And for god's sake, don't let the psychologists hijack the room - acknowledge them but don't engage their framework unless forced.

  This feels like the kind of talk where winning means leaving the internalists uneasy about their own position rather than converted. The replies should aim for that subtle disruption.
answer: |-
  Here’s your tactical playbook, grounded in how these sessions *actually* unfold. I’ve sat through dozens of these in dimly lit seminar rooms with stale coffee and sharp minds. Your crowd’s dynamics are predictable: the internalists will defend their turf politely but firmly, the moral psychologists will drop grenades, and everyone will watch how you handle pressure. Below are the objections you’ll face, ranked by damage potential, phrased authentically, with replies and their soft spots.

  ### The Lineup (Ordered by Damage & Likelihood)
  1. **The Conceptual Firewall Objection**  
     *Who says it:* Internalist-leaning grad student (eager, precise).  
     *Phrased:* "But the 'better-informed me' isn’t importing *external reasons*—it’s just *my own psychology* under improved conditions. My desires are still the source. You’re conflating *reasons* with the *conditions for having them*."  
     **Your Reply (90 seconds):**  
     "If the 'better-informed me' is just my psychology writ large, why does 'better-informed' do any work? 'Better' implies a standard *outside* my current desires—like epistemic norms or rational coherence. If your motivational set includes *whatever you’d want under conditions defined by external norms*, you’ve outsourced the source of reasons. Internalism can’t both rely on external standards *and* claim reasons are purely internal."  
     **Weakness:** You risk sounding like you’re redefining "internal." They’ll insist rationality is *part of* the agent’s psychology.  

  2. **The Moral Psychologist’s Grenade**  
     *Who says it:* The psychologist (leaning back, mildly amused).  
     *Phrased:* "This whole debate assumes ‘reasons’ are a unified *thing* we can locate ‘inside’ or ‘outside’ agents. But empirically, people use ‘reason’ to describe everything from gut impulses to social norms. You’re not resolving a philosophical problem—you’re projecting a folk distinction onto messy cognition."  
     **Your Reply (60 seconds):**  
     "I agree the *language* is messy—but we’re asking a normative question: *Should* we act only on desires, or can facts compel us independently? Psychology describes how we *do* reason; we’re debating how we *ought* to. Even if ‘reasons’ fragment in practice, we still need to decide what counts as a *justification*. That’s where internalism/externalism bites."  
     **Weakness:** They’ll think you dodged. Concede the terminology is imperfect, but hold the normative question is irreducible.  

  3. **The Motivation Requirement Pushback**  
     *Who says it:* Senior internalist (calm, patronizing).  
     *Phrased:* "External facts only become reasons *if* they connect to your motivational set—even indirectly. If you wouldn’t care about the fact *even after idealization*, it’s not a reason *for you*. Your ‘collapse’ ignores that internalism *constrains* what counts as a reason."  
     **Your Reply (75 seconds):**  
     "Then internalism is vacuously true: by definition, anything that *could* motivate an idealized you is ‘internal.’ But that idealized agent is shaped by external values (e.g., coherence, empirical truth). If I *ought* to be idealized, that ‘ought’ is external. Otherwise, why not say a deeply ignorant but coherent agent has no reason to seek knowledge?"  
     **Weakness:** They’ll retort that the "ought" in idealization is *pragmatic* (e.g., "to achieve your goals"), not moral/external.  

  4. **The Self-Defeat Charge**  
     *Who says it:* Quick-witted internalist (smirking).  
     *Phrased:* "If externalism is true, why bother with this argument? *Your* desire to convince us isn’t external—it’s rooted in your motivational set. So isn’t your defense of externalism self-undermining?"  
     **Your Reply (45 seconds):**  
     "Not at all. I can have *internal* reasons to advocate *externalism*. That’s like saying a physicist can’t believe in gravity because her belief is neurochemical. The truth of externalism doesn’t require me to be externally motivated; it requires that reasons *can* exist independently."  
     **Weakness:** They’ll sense this is clever but insubstantial. It doesn’t *prove* externalism.  

  ---

  ### Your Strategy
  - **Concede upfront:**  
    "Internalism captures something vital: motivation matters. If you *couldn’t* care about a reason, it’s inert for you. My claim isn’t that internalism is useless—it’s that it *secretly depends* on externalism."  
    *Why:* Disarms defensiveness. Shows you’re engaging, not demolishing.  

  - **Hold firm on:**  
    The "idealization" move smuggles in external standards. Hammer this: "If 'better-informed' means anything, it imports external norms. Otherwise, pick any standard—flat-earth reasoning, solipsism—and call *that* 'ideal.'"  

  - **The Objection You Hope Nobody Raises:**  
    **"Why isn't your 'collapse' just a *reductio* against *crude* internalism? Sophisticated internalists (e.g., Smith) argue that idealization reveals *constitutive* features of agency—so external 'norms' are actually internal to what it is *to be an agent*. Your argument misses the whole point."**  
    *Why it’s deadly:* It reframes idealization as unpacking agency itself, not importing externals. It’s metaethically deeper and harder to puncture in 2 minutes. If this drops, say:  
    "That’s a strong reply—but it still assumes agency has *normative contours* (e.g., coherence) that aren’t up to us. If those contours are external to *particular* agents, we’re back to externalism."  
    ...Then pray the moral psychologists jump in to muddy the waters.  

  ### Final Advice
  - **Pace your replies:** Don’t let internalists monologue. Cut in with: "If I understand, your worry is... [restate briefly]. Here’s why I think that still points to collapse..."  
  - **Use the psychologists:** If they dismiss the debate, reply: "You’re right—this might be verbal. But if we *must* choose, I’ll bet you lean externalist when your kid asks why they shouldn’t lie."  
  - **Body language:** Stay open, lean forward slightly when conceding, stand straighter when holding firm. Avoid crossing arms.  

  This crowd will test whether your "collapse" is an insight or a sleight of hand. Your goal isn’t to "win"—it’s to leave them unable to see internalism’s "idealized agent" the same way again. Good luck. They’ll respect you more for the scars than the victory.
