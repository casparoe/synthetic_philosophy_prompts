  The key challenge is avoiding terminological capture while preserving substantive disagreements. The user has provided a template case (bathtub drowning with four potential interveners) and two analytical tools: a substitution test and "shadow events" concept. They suspect one crux might be verbal and want that flagged if true.

  I need to first identify which disagreements are substantive versus terminological. The core substantive cruxes appear to be: 1) whether causal relata must be occurrent particulars (ontological), 2) whether counterfactual dependence suffices for causation (metaphysical), 3) whether omission-talk is context-sensitive (semantic/pragmatic), and 4) whether there are determinate facts about omissions (epistemological). The verbal aspect likely creeps into the "sufficiency" question - restrictionists might concede dependence exists while denying it constitutes causation.

  For the agreed claims section, both sides should accept: the moral/legal relevance of omissions, the counterfactual dependence in the bathtub cases, and the distinction between metaphysics and normative assessments. They'd also agree the fourth adult (who sees and leaves) differs evidentially but not fundamentally from the first (who doesn't act).

  The disagreements table must use each side's preferred terminology without smuggling in assumptions. For the relata question, inclusionists would say "omissions are causal relata" while restrictionists say "only occurrent particulars qualify". The substitution test probably favors inclusionists by design, while shadow events might be rejected by restrictionists as question-begging.

  For the test cases, both camps should agree the second adult (asleep/unable) provides a contrast class, but they'll split on why: inclusionists see identical causal status with different moral responsibility, restrictionists see identical non-causal status. The striking difference will be in the third case (prevented intervention) - inclusionists will see causation via omission, restrictionists will attribute outcomes to the car crash instead.

  I should note that the fourth crux (determinate facts) may collapse into the others - restrictionists see indeterminacy precisely because they deny omissions exist as events. The document must maintain this tension without false reconciliation. If either camp can't endorse the wording without compromising, I'll flag that explicitly per the user's request for honesty over diplomacy.
answer: |-
  ## Adversarial Collaboration Statement: The Causation of Omissions

  **Part 1: Agreed Claims**

  The following claims are uncontroversial within the scope of the provided template case (infant drowning; Adult 1: in next room, reads; Adult 2: asleep, couldn't hear; Adult 3: hears, intends to go, struck by car; Adult 4: walks in, sees child, walks out) and reflect common ground or concessions:

  1.  **Counterfactual Dependence:** The infant's drowning counterfactually depends on the conduct of Adults 1, 3, and 4. Specifically: Had any of these adults acted differently (e.g., intervened), the drowning would not have occurred in the circumstances.
  2.  **Moral/Legal Asymmetry:** There is a significant moral and legal asymmetry between acting and omitting. Adults 1, 3, and 4 bear differing degrees of moral responsibility and potential legal liability for the drowning, while Adult 2 does not. Adult 4's conduct is morally worse than Adult 1's.
  3.  **Distinction from Non-Capacity:** The case of Adult 2 (asleep, unable) is fundamentally different from Adults 1, 3, and 4 regarding the basis for moral responsibility, legal liability, and the relevant counterfactual dependence. Adult 2's lack of action *could not* have prevented the drowning; the others' lack of action *would have* prevented it.
  4.  **Evidential Difference (A1 vs. A4):** Adult 4's conduct provides *stronger evidence* of a culpable state of mind (e.g., indifference, malice) compared to Adult 1. However, the *core fact* of their failure to act, relative to the drowning, is the same type of fact.
  5.  **Role of Positive Events:** Positive events play a crucial role in omission scenarios: the infant's presence in the bath, the water, the drowning process itself. These are uncontroversial causes.
  6.  **Metaphysics vs. Normativity:** The *metaphysical* question of whether omissions *are causes* in the same sense as positive events is distinct from the *normative* questions of responsibility, blame, and liability. Agreement on normative asymmetry does not entail agreement on metaphysical equivalence or difference.
  7.  **Concession (Inclusionists):** Not every absence is a cause. The absence of a magical water-absorbing pixie is not a cause of the drowning. Some threshold of relevance or expectation must be met for omissions to be considered candidates for causation.
  8.  **Concession (Restrictionists):** Talk of "causation by omission" is pervasive, useful, and tracks something real and important about how events unfold and how agents relate to outcomes. This discourse is not *merely* confused or eliminable without significant loss.

  **Part 2: Disagreements Table**

  | Crux                                                                 | Inclusionist Position (Wording Acceptable to Them)                                                                                                 | Restrictionist Position (Wording Acceptable to Them)                                                                                                                               |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Relata:** What are the genuine *relata* of the causal relation? | Omissions (failures, absences) can be genuine causal relata, just like positive events or states. The lifeguard's not swimming *is* a cause.       | Only occurrent particulars (positive events, processes, states of affairs) can be genuine causal relata. Omissions are not occurrent; they are the *absence* of such particulars. |
  | **2. Counterfactual Dependence (CFD) & Causation:**                  | Counterfactual dependence (of the right sort) is sufficient for causation. CFD in omission cases *is* an instance of the causal relation itself.    | Counterfactual dependence is a necessary *mark* or *indicator* of causation but is not identical to it. Omission-CFD tracks responsibility or preventability, not causation proper. |
  | **3. Semantics/Pragmatics of "Omission Caused O":**                  | Statements like "The omission caused the outcome" are semantically true, directly describing a causal relation involving the omission as a relatum. | Statements like "The omission caused the outcome" are context-sensitive pragmatic shorthand. They convey truths about responsibility, preventability, or CFD, not direct causation. |
  | **4. Determinate Fact?**                                             | There is a determinate fact of the matter about whether a specific omission *caused* a specific outcome, grounded in objective CFD and relevance.  | Talk of omissions "causing" outcomes lacks a fully determinate metaphysical fact; it involves context-dependent normative or pragmatic elements irreducible to pure occurrent causation. |

  **Part 3: Test Cases, Predictions, and Machinery**

  **Template Case:** Infant drowns in bath.
  *   **Adult 1:** In next room, reading (could have easily heard/saved, did nothing).
  *   **Adult 2:** Asleep, could not have heard/saved (physically incapable).
  *   **Adult 3:** Hears, forms intention to go save, struck by car in hallway (prevented from acting).
  *   **Adult 4:** Walks in, sees child drowning, walks out (deliberate non-intervention).

  **Analysis & Predictions:**

  1.  **Distinguishing Adult 1 from Adult 2:**
      *   **Agreed Bearing:** Both agree this distinction is crucial and hinges on capacity and counterfactual dependence (A1 could/would have prevented, A2 could not).
      *   **Inclusionist Prediction:** The crucial difference is that Adult 1's *omission* (failure to act) *caused* the drowning (via CFD), while Adult 2's physical state (being asleep) is merely a background condition. The omission is a cause; the incapacity is not. The causal structure differs.
      *   **Restrictionist Prediction:** The crucial difference is moral/agential, not causal. *Neither* Adult 1's inaction *nor* Adult 2's incapacity is a cause. The drowning is caused by the positive events (water, infant's position, gravity). Adult 1 is responsible *for* the outcome *because* they could have prevented it; Adult 2 is not. The causal structure is the same; the normative status differs.

  2.  **Distinguishing Adult 1 from Adult 4:**
      *   **Agreed Bearing:** The core difference lies in evidence of mental state (culpability) and the overt nature of the omission. Agreed this is primarily an evidential/normative difference concerning the *agent*, not a difference in the *type* of causal relation between the omission and outcome (Part 1, Claim 4).
      *   **Inclusionist Prediction:** The omission (failure to save) *caused* the drowning in both cases. Adult 4's overt act of walking out is a *positive event* accompanying the omission, providing evidence of intent, but the causal work is still done by the omission itself. The omission is the same causal relatum type.
      *   **Restrictionist Prediction:** Neither omission is a cause. Adult 4's *positive act* of walking away might be considered a cause (or part of the causal story) *if* it actively contributed to the outcome (e.g., blocked the door), but the mere omission itself remains non-causal. The difference is in the agent's positive conduct (or lack thereof beyond the omission) and evident culpability, not in the causal status of the omission.

  3.  **Analyzing Adult 3:**
      *   **Agreed Bearing:** This case tests the relationship between prevention, intention, and the causal status of the omission.
      *   **Inclusionist Prediction:** Adult 3's *omission* (failure to save) still *caused* the drowning. The car strike *prevented* the positive action that would have negated the omission, but the omission itself (the failure occurring *despite* the intention) remains the cause of death via CFD. The car strike caused the *prevention of saving*, but the omission *caused the drowning*.
      *   **Restrictionist Prediction:** The car strike *caused* the prevention of the saving action, and this complex positive event (strike + non-saving) is the cause of the drowning. Adult 3's *omission* (failure to save) is not itself a cause; it's a consequence of the car strike and part of the descriptive background. Attributing causation to the omission obscures the primacy of the positive event (car strike).

  **Machinery:**

  1.  **Substitution Test:**
      *   **Application:** Test claim: "The lifeguard's not swimming caused the drowning." Substitute: "The lifeguard's swimming would have prevented the drowning." (Same direction/strength implied).
      *   **Inclusionist View:** Accepts the test. The substitution preserves truth: the swimming *would* have caused prevention, the not-swimming *did* cause drowning. The test confirms the causal symmetry.
      *   **Restrictionist View:** Rejects the test as question-begging. It assumes that preventing an outcome (swimming-preventing-drowning) is the symmetrical inverse of *causing* an outcome (not-swimming-causing-drowning), which is precisely what they deny. Prevention is not the inverse of causation by omission; prevention involves positive causation. The test smuggles in inclusionist assumptions.
      *   **Conclusion:** The test is rejected by Restrictionists as invalid for resolving the core dispute; Inclusionists accept it as revealing symmetry.

  2.  **Shadow Event:**
      *   **Concept:** The positive event that would have occurred in the place of the omission had things been different (e.g., the lifeguard's swimming).
      *   **Inclusionist View:** Can potentially accept the *concept* as a useful counterfactual contrast, but denies it is necessary to define the omission. The omission is a genuine causal relatum in its own right; the shadow event helps understand CFD but isn't the relatum. The omission *is* the absence *of that shadow event*.
      *   **Restrictionist View:** Rejects "shadow event" as a misleading reification. The omission *is* defined *only* as the absence of the specific positive event (the shadow event). However, this absence itself is not an occurrent particular and cannot be a causal relatum. The concept highlights that omission-talk is fundamentally parasitic on positive events and counterfactuals, not denoting a positive relatum.
      *   **Conclusion:** Both camps find the concept of limited use. Inclusionists see it as descriptive but not fundamental; Restrictionists see it as confirming that omissions lack independent ontological status as relata. It does not bridge the ontological gap.

  **Verbal Disagreement Diagnosis:**

  *   **Crux Identified:** Crux #2 (Counterfactual Dependence & Causation) is judged to have a significant verbal component.
  *   **Reasoning:** Both camps agree on the *counterfactual dependence* facts (Part 1, Claim 1). The dispute hinges entirely on whether satisfying counterfactual dependence (of the relevant sort) *suffices* for a relation to be labeled "causation." Inclusionists define causation (in this context) such that CFD *is* constitutive of it. Restrictionists define causation more narrowly (requiring occurrent relata and a productive/mechanistic connection) such that CFD, while evidentially crucial, is not identical to causation and marks a distinct relation (responsibility, preventability) when applied to omissions. The core metaphysical disagreement (Crux #1) drives the differing interpretation of the significance of CFD. Whether CFD "suffices for causation" depends entirely on what one means by "causation."

  **Statement of Compatibility & Signability:**

  This document accurately reflects the core disagreements as substantive and deeply rooted in differing fundamental commitments (ontology of relata, nature of causation). It does not quietly adopt one side's vocabulary; each position is stated in its own terms. The case template is not rigged; it reveals the fault lines (e.g., A1 vs A2, A3 challenge). The positions are incompatible regarding the core metaphysical claims (Relata, Nature of Causation).

  **Signability:** Both camps should be able to sign this document. It records their *actual* positions in acceptable wording without imposing a false synthesis. It clarifies where agreement exists (Part 1) and precisely where and why disagreement remains (Parts 2 & 3), including the diagnosis of a verbal element in Crux #2. It explicitly records their rejection or qualified acceptance of the proposed machinery. While neither side concedes ground on their core metaphysical claims, the document provides a clear, shared map of the dispute and the territory of agreement surrounding it, fulfilling the purpose of an adversarial collaboration statement. A shorter statement would sacrifice necessary precision and fail to adequately distinguish the nuanced positions.
