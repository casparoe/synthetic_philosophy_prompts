prompt: |-
  Okay so context: I'm a 3rd year taking a decision theory / rationality course this semester (the one that goes deep on Kelly betting and "geometric rationality" — like, why the right way to size a bet when you're playing a long compounding game is to maximize your long-run growth rate, and how that's a completely different objective from just maximizing expected value, or expected wealth at a single point in time). I'm also on the investment committee for our university's student-run trading fund, and next week we vote on the fund's official position-sizing policy, so I need a memo I can actually circulate and put to a vote.

  Here's the situation. The fund has about $250k in it. It's a student fund — it only exists for as long as the current cohort of students is around, so roughly 3-4 years, and then it gets liquidated and handed off to the next group. So there's no "forever" here, the horizon is fixed. Also there's a hard rule from the university: if the fund ever drops below 60% of its value at the start of the year (so we can't lose more than 40% in a year), the university shuts it down and we all loose our positions. So we're not free to just bet whatever maximizes some abstract thing — we have a floor we can't cross. And our edge on any given trade isn't certain: our models give us an estimated edge (like, we think we're 55% right on a 1:1 bet that the market is pricing at 50%), but that 55% is itself an estimate with error, and if our true edge is actually smaller than we think, betting the full Kelly fraction means we're overbetting and we'll just grind the fund down.

  The committee is split into two seperate camps. Camp one says: "The Kelly criterion is provably the rational strategy for long-run growth, and it even beats any other strategy in the long run — the ratio of your wealth to theirs just keeps growing — so we should bet the Kelly fraction and stop overthinking it." Camp two says: "Kelly assumes an infinite horizon and perfect knowledge of the edge, neither of which we have, so we should just use a fixed small fraction (like 5% of the bankroll per trade) and not pretend we know more than we do." I kind of agree with both of them partially. I think the real question is what our actual objective is: we're not trying to maximize a long-run growth rate (there is no long run for us), we're trying to maximize the chance that we end the 3-4 year horizon above some target without ever breaching the floor, and Kelly's optimality doesn't directly apply to that objective.

  Can you act as a professional decision theorist who specializes in Kelly betting and optimal position sizing under model uncertainty? I want you to think this through carefully, and actually start with a short brainstorm of the different ways to frame our objective (maximize growth rate vs. maximize probability of hitting a target vs. maximize expected terminal wealth subject to the floor, etc.) before you settle on a recommendation. Then write the memo. It should be something the committee could actually act on: a clear recommendation on what position-sizing policy to adopt (be specific — e.g. "use half-Kelly of our estimated edge, capped at X% of the bankroll per trade, and stop trading for the rest of the year once we're within Y% of the floor"), a concrete time frame for implementing and reviewing it, and the reasoning. And you have to honestly engage the strongest version of the losing side — especially the "Kelly is provably rational and you can't really regret playing it" argument — and say where that argument is right and where it breaks down given our fixed horizon and our floor. Don't just restate what the Kelly criterion is, I already know that, make it about our specific situation.

  Oh and keep it to maybe 2-3 pages, in a tone I can actually send to a committee of other students who are smart but not decision theorists.
reasoning: |-
  We are given a specific context: a student-run trading fund with $250k, a fixed horizon of 3-4 years, and a hard stop-loss rule (if the fund drops to 60% of its starting value for the year, it gets shut down). The fund's edge on trades is estimated but uncertain.

  The committee is split:
  - Camp 1: Advocates for the Kelly criterion because it is provably optimal for long-run growth.
  - Camp 2: Advocates for a fixed small fraction (like 5%) per trade due to uncertainty and the fixed horizon.

  Key issues:
  1. The horizon is finite (3-4 years) and not infinite.
  2. There is a hard floor (cannot lose more than 40% in a year) which introduces a risk of ruin constraint.
  3. The edge is estimated with error, so if we overestimate our edge and bet the full Kelly, we might overbet and suffer from high volatility and possible ruin.

  Our objective is not long-run growth but to maximize the probability of ending the 3-4 years above a target (which we might set as, say, a certain multiple of the initial capital) without breaching the floor. Alternatively, we might consider maximizing expected terminal wealth but with the constraint that we avoid ruin (the floor) and the horizon is fixed.

  Brainstorming objectives:

  Objective 1: Maximize the long-run growth rate (Kelly's objective). But we don't have a long run.

  Objective 2: Maximize expected terminal wealth at the end of 4 years. However, this does not account for risk aversion or the risk of ruin. Also, without the floor, betting full Kelly might be acceptable, but with the floor and model uncertainty, it might lead to too much risk.

  Objective 3: Maximize the probability of reaching a specific target (e.g., doubling the fund) without hitting the floor. This is a goal-reaching objective.

  Objective 4: Maximize expected utility of terminal wealth (e.g., using a utility function that is linear for wealth above the floor and highly penalizes ruin). This might be complex to model.

  Given the constraints, a reasonable objective might be a blend: we want to avoid ruin (hitting the floor) and maximize the expected growth, but we are also constrained by the fixed horizon and the fact that we cannot recover if we hit the floor.

  Kelly's argument: In the long run, Kelly betting maximizes the growth rate and also minimizes the time to reach a given goal. However, in the finite horizon, the properties of Kelly are less dominant. Moreover, with model uncertainty, betting full Kelly can be disastrous if we overestimate the edge.

  Recommendation:

  We should use a fractional Kelly strategy (betting a fraction of the Kelly fraction) to reduce volatility and the risk of ruin. Additionally, we must cap the bet size as a percentage of the bankroll to avoid overbetting on any single trade. We also need a policy to reduce risk as we approach the floor.

  Steps:

  1. Estimate the edge (p, the probability of winning) and the odds (b, the net fractional return on a win). For example, a 1:1 bet that the market prices at 50% but we believe we have a 55% chance would have b=1 (if we win, we double our bet, so net return is 100% on the amount bet? Actually, if we bet $1 and win, we get $2, so net return is $1, which is 100% of the bet). Then the Kelly fraction is f* = p - q/b, where q=1-p and b=1 (since we get b=1: we risk 1 to win 1). So f* = 0.55 - 0.45/1 = 0.10 or 10%.

  2. Because of model uncertainty, we use a fraction of that, say half-Kelly. So we bet 5% of the bankroll on that trade.

  3. Additionally, we impose a cap on the maximum bet size as a percentage of the bankroll (to avoid too much exposure on a single trade). Given the floor constraint and the fact that we have multiple trades, a cap of 5% (or 10%) might be appropriate. But note: half-Kelly on a 10% edge is 5%, so that might be the cap. However, if we have an edge that implies a higher Kelly fraction, we cap it at, say, 5% or 10%. Given the 40% drawdown limit, we must be cautious.

  4. We also need a policy to reduce risk when we are near the floor. For example, if the fund drops to a level that is within, say, 10% of the floor (i.e., we have lost 30% or more, so we are 10% above the floor), we might stop trading for the rest of the year to avoid breaching the floor.

  But note: the floor is reset every year? The memo says "if the fund ever drops below 60% of its value at the start of the year". So the floor is annual. We can interpret: at the beginning of each year, we set a new floor at 60% of the starting value of that year.

  Therefore, we have to manage the risk within each year.

  Proposed policy:

  - For each trade, calculate the Kelly fraction based on our estimated edge (p and b). Then use a fraction of that, specifically half-Kelly (0.5 * f*).
  - Impose a maximum bet size per trade of 5% of the current bankroll. So if half-Kelly suggests more than 5%, we cap at 5%.
  - Additionally, we impose a maximum annual drawdown limit: if at any point during the year the fund drops to 70% of the starting value of the year (meaning we are 10% above the floor), we stop trading for the rest of the year. This gives us a buffer.

  Why half-Kelly? Because with model uncertainty, it's common to use half-Kelly to reduce the risk of overbetting. It has been shown that fractional Kelly (like half) reduces volatility and drawdowns while still capturing a significant portion of the growth.

  Why a cap? Because even half-Kelly might be too high for very high edge estimates (which might be unreliable) and because we want to diversify.

  Why the buffer? Because we cannot afford to hit the floor. The 10% buffer reduces the chance of breaching the floor due to a single bad trade or a series of losses.

  Now, about the Kelly argument: Kelly is indeed optimal for long-run growth and has the property that it minimizes the time to reach a given goal asymptotically. However, in a finite horizon, the probability of reaching a goal is not necessarily maximized by Kelly. Moreover, with a floor, the Kelly strategy might lead to a higher probability of ruin than we can accept. Also, with model uncertainty, the Kelly fraction is sensitive to the estimate of p. If we overestimate p by even a little, the Kelly fraction can be too high and lead to ruin.

  Therefore, we acknowledge that Kelly is rational in an ideal setting (infinite horizon, known probabilities) but our setting is not ideal.

  We also note that the fixed fraction (5%) is arbitrary and does not adjust to the edge of each trade. We want to bet more when we have a higher edge and less when we have a lower edge. Half-Kelly with a cap does that.

  Concrete recommendation:

  - For each trade, estimate the probability of success p and the net fractional odds b (if we bet $1 and win, we get $(1+b) so that we have a net gain of $b; if we lose, we lose the $1). Then the Kelly fraction is f* = p - (1-p)/b.
  - Then the bet size is min(0.5 * f*, 0.05) (i.e., half-Kelly or 5% of the bankroll, whichever is smaller).
  - At the beginning of each year, reset the floor to 60% of the starting value of that year.
  - During the year, if the fund value falls to 70% of the starting value of the year, we immediately stop trading for the remainder of the year and hold cash or risk-free assets until the next year. (Note: the next year will have a new floor set at 60% of the starting value of that next year, so we can start again.)

  Additionally, we should review the policy annually. We might backtest it and adjust the parameters (the fraction of Kelly, the cap, the buffer) if needed.

  Time frame: Implement immediately and review after one year.

  Memo structure:

  - Introduction: State the problem and the two camps.
  - Analysis of the situation: Finite horizon, floor constraint, model uncertainty.
  - Framing the objective: We are trying to maximize the probability of achieving substantial growth over 3-4 years without hitting the floor.
  - Why Kelly alone is insufficient: Discuss the issues (model uncertainty, finite horizon, floor).
  - The proposed strategy: Half-Kelly with a 5% cap and a 70% stop-trading threshold.
  - Justification: Balances growth with risk control.
  - Acknowledge the Kelly argument: It is optimal in the long run, but we are not in the long run and we have constraints.
  - Implementation: How to calculate the bet for each trade, and the stop-trading rule.
  - Review: After one year, we will review the parameters and performance.

  Let me write the memo accordingly.
