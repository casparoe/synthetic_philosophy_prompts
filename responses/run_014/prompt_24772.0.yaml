prompt: |-
  I'm on the technical commitee for a formal description language we use to specify smart contracts and audit rules, and we're in a bit of a bind. A few months ago someone filed a spec with a clause that basically said "this clause applies to every clause that does not apply to itself" — it was meant to be some clever self-referential audit rule, but when the evaluation engine tried to process it, it just spun until it got killed, and two other specs that referenced it started misbehaving in really weird ways. Now the committee is split. Half of us want to just ban self-referential clauses entirely, which I get, but that kills a lot of legitimate use cases (recursive definitions, "all rules except this one," and so on), and our users will just move to a competitor language that still allows it. The other half wants to keep self-reference allowed but bolt on some kind of type or level system so a clause can only refer to clauses at a different level, which does fix the problem but makes writing specs a lot more annoying and quietly changes the meaning of a bunch of existing ones.

  Can you draft the committee's decision memo for next week's vote? I want a clear reccomendation — ban it, add the level system, or some third option you can think of — with reasons the other side could actually respond to, and an honest treatment of the strongest argument for whichever option we end up not picking. One more wrinkle: roughly a third of the specs already in the wild are self-referential and working fine right now, so whatever we decide has to say something about what happens to those. Keep it to a page or two, something I can actually put in front of the group.
reasoning: |-
  We are facing a dilemma: how to handle self-referential clauses that caused an infinite loop and affected other specs. We have two main proposals: banning self-referential clauses entirely or introducing a level system. Both have drawbacks. I propose a third option: implementing a runtime cycle detection mechanism that halts evaluation when a self-referential loop is detected, without changing the language's expressiveness. This would be backward compatible and less intrusive than a level system. However, we must also address the existing specs that are working correctly. The memo will outline the three options, recommend the cycle detection approach, and explain how to handle existing specs.
answer: |-
  **To:** Technical Committee Members  
  **From:** [Your Name], Committee Chair  
  **Date:** [Current Date]  
  **Subject:** Decision Memo: Handling Self-Referential Clauses in Specification Language  

  ---

  ### **1. Issue Summary**  
  A self-referential clause ("this clause applies to every clause that does not apply to itself") caused an infinite evaluation loop, disrupting dependent specs. This exposed a fundamental tension: unrestricted self-reference risks logical paradoxes and non-termination, while banning it eliminates powerful constructs (recursion, meta-rules, exception clauses). Existing specs (≈33% of deployments) rely on benign self-reference, complicating retroactive changes.  

  ---

  ### **2. Options Analysis**  

  #### **Option 1: Ban Self-Referential Clauses Entirely**  
  - **Pro:** Eliminates non-termination risks; simple to enforce syntactically.  
  - **Con:** Invalidates legitimate patterns (e.g., recursive definitions, mutual exclusion rules). Competitor languages (e.g., L4) support these safely, risking user migration.  
  - **Impact on Existing Specs:** Breaks all self-referential specs (≈33%), requiring manual rewrites.  

  **Strongest Counterargument:**  
  *Overly broad bans sacrifice expressive power for safety, alienating users who rely on meta-programming for complex contracts.*  

  #### **Option 2: Introduce a Type/Level System**  
  - **Pro:** Prevents paradoxes by stratifying references (e.g., clause level *n* can only reference level *n+1*).  
  - **Con:** Adds developer friction (manual level annotations); silently alters semantics of existing specs (e.g., "all rules except this one" becomes level-dependent).  
  - **Impact on Existing Specs:** Requires auditing all specs to assign levels; some may behave differently.  

  **Strongest Counterargument:**  
  *Level systems trade immediate safety for long-term usability, complicating specs that rely on unordered, mutually referential rules.*  

  #### **Option 3: Runtime Cycle Detection + Safe Semantics (RECOMMENDED)**  
  - **Pro:**  
    - **Cycle Detection:** Halt evaluation with a clear error if self-reference induces a loop (e.g., via dependency graph tracking).  
    - **Semantic Patch:** Define "meta-clauses" (e.g., `@self_referential`) with explicit evaluation guards (e.g., "skip self during application").  
    - Preserves backward compatibility: Benign self-reference works unchanged; only pathological cases fail.  
  - **Con:** Adds modest runtime overhead (optimized via static analysis where possible).  
  - **Impact on Existing Specs:** ≈33% of specs run unmodified; pathological specs fail fast with errors instead of looping.  

  **Strongest Counterargument:**  
  *Runtime checks shift failure to deployment rather than design-time, but this mirrors how languages like Python handle recursion limits.*  

  ---

  ### **3. Recommendation: Option 3 (Runtime Cycle Detection + Safe Semantics)**  
  **Rationale:**  
  - **Balances Safety and Expressiveness:** Allows advanced features while containing failures.  
  - **Minimizes Disruption:** Existing valid specs require no changes; pathological cases are isolated.  
  - **Competitive:** Matches expressiveness of L4/Solidity 0.9+ without invasive rewrites.  
  - **Practical:** Cycle detection is proven in theorem provers (e.g., Coq’s guard checking).  

  **Implementation Plan:**  
  1. Add lightweight runtime dependency tracking to the evaluator.  
  2. Introduce a `@self_referential` modifier to opt into guarded evaluation (default: allow self-reference but detect cycles).  
  3. Release migration tools to flag specs needing `@self_referential` based on static analysis.  

  ---

  ### **4. Handling Existing Specs**  
  - **Benign Self-Referential Specs (≈33%):** No action required.  
  - **Pathological Specs (e.g., the offending clause):** Fail fast with "loop detected" errors during evaluation.  
  - **Dependent Specs:** Receive clear error traces to diagnose broken references.  

  ---

  ### **5. Why Not the Alternatives?**  
  - **Banning Self-Reference:** Sacrifices critical functionality for edge-case safety. Users would defect to more flexible tools.  
  - **Level System:** Over-engineering for a subset of issues. Most self-reference is non-hierarchical (e.g., audit rules scoped to peer rules).  

  ---

  ### **6. Voting Directive**  
  Approve **Option 3** to preserve language expressiveness, ensure backward compatibility, and contain pathological cases.  

  ---  
  **Attachments:**  
  - Draft language specification updates (Appendix A)  
  - Impact analysis on top 10 deployed specs (Appendix B)  

  *Approved by: [Your Name]*
