  ok so ive been doing commercial pest control for like 12 years now and recently i fell down this rabbit hole about whether insects are sentient and this thing called the scale argument. the basic idea as i understand it is that even if there's only a small probability that insects are actually sentient, the sheer number of them (we're talking about numbers so large they're basically incomprehensible, like orders of magnitude more individuals than there are humans) means the expected total amount of suffering is so enormours that it dwarfs basically everything else we usually weigh morally. and it's been really eating at me because my entire job is literally maximizing insect deaths at industrial scale. i don't want a reading list or any citations or anything like that, i just want you to walk me through the most important implications of the scale argument for how i should actually think about what i do day to day. like does it change whether i should keep doing this job at all, or how i should do it, or even what i should eat? i'm trying to think through the problem properly because it's been on my mind a lot lately and i can't quite figure out what to do with it.
