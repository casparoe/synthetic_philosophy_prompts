answer: |-
  ### Side-by-Side Comparison: Lewis vs. Novikov on the Grandfather Paradox

  #### (1) Handling the Traveler's Sense of Agency
  - **Lewis (1976):**  
    The traveler retains full subjective agency—they can *try* to kill their grandfather (e.g., aim, pull the trigger) but will inevitably fail due to ordinary contingencies (e.g., a jammed gun, a sudden distraction). Failure is *local* and *non-mysterious*, arising from mundane causes consistent with the timeline. The traveler experiences themselves as acting freely, but their success is logically impossible.  
  - **Novikov (Physics):**  
    Agency is constrained by physical law. The traveler *cannot* even attempt actions that violate consistency. Consistency is a global structural constraint of spacetime (via closed timelike curves in general relativity). Any "attempt" (e.g., raising a weapon) would be physically redirected or negated *before* the paradox arises (e.g., quantum fluctuations deflect the bullet). The traveler may feel they are trying, but the universe physically ensures their actions align with the fixed past.  
  - **Key Difference:** Lewis allows failed *attempts*; Novikov prevents *inconsistent actions* at the level of physical law.

  #### (2) The "Fixed" Past: Nature and Motivation
  - **Lewis:**  
    The past is fixed *metaphysically*: all events in spacetime are equally real and immutable (eternalism/block universe). The "fixed" past arises from logical consistency—no event can both occur and not occur. Tim’s failure is fixed *because* it happened.  
  - **Novikov:**  
    The past is fixed *physically*: self-consistency is a constraint from general relativity, where solutions to Einstein’s equations must be globally consistent. The "fixed" past is a *dynamical law*—spacetime geometry enforces consistency, making paradoxes physically impossible.  
  - **Key Difference:** Lewis’s fixity is logical (consistency demands it); Novikov’s is causal-physical (spacetime structure demands it). They share the outcome but ground it differently.

  #### (3) Free Will and Determinism
  - **Lewis:**  
    Compatible with *indeterminism*. Events can be chancy (e.g., Tim’s gun jams randomly), but consistency ensures outcomes align with the timeline. Free will exists locally: the traveler chooses to act, but their success is logically excluded. Global determinism isn’t required—only that events cohere.  
  - **Novikov:**  
    Implies *de facto determinism* on closed timelike curves. Physical laws constrain probabilities: inconsistent events have probability zero. While quantum indeterminacy exists, it’s "orchestrated" to avoid paradoxes. Free will is limited—choices must align with self-consistency, effectively making the traveler’s actions predetermined.  
  - **Key Difference:** Lewis avoids determinism (only consistency matters); Novikov requires it (physics enforces determinism on CTCs).

  #### (4) Dissolving vs. Relocating the Paradox
  - **Lewis:**  
    Dissolves the paradox by showing the scenario is coherent: Tim *can* exist and try, but logical consistency explains failure. The origin question ("How did Tim exist?") is answered by the block universe—all events are equally real, so no bootstrap issue.  
  - **Novikov:**  
    Relocates the paradox into physics. Consistency is preserved, but objections arise about *how* physics enforces it (e.g., "conspiracies" like improbable banana peels). The traveler’s origin is explained by consistency, but critics argue this masks fine-tuning (e.g., why do initial conditions guarantee consistency?).  
  - **Key Difference:** Lewis resolves the paradox logically; Novikov shifts it to the realm of physical plausibility.

  ### Areas of Quiet Agreement
  - Both reject "changing" the past: the past is immutable, and time travelers were always part of history.  
  - Both invoke ordinary causes for failure (e.g., a slipped hand), avoiding *deus ex machina* interventions.  
  - Both treat time travel as operating within a single, consistent timeline (no branching worlds).

  ### Underdiscussed Objections
  - **Lewis’s Objection:** Ignores *psychological paradox*—if Tim knows he will fail, why does he try? Lewis’s reply (he doesn’t know *how* he’ll fail) is seen as ad hoc.  
  - **Novikov’s Objection:** **Conspiracy Problem**—physics must generate wildly improbable events (e.g., quantum fluctuations saving Grandfather repeatedly), violating parsimony. This is rarely highlighted in pop science.

