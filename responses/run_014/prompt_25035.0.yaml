answer: |-
  What a brilliant connection—and you're absolutely right that Le Guin's story operates as a visceral, moralized version of an ambiguity problem. Let's dissect this rigorously, respecting both the psychological nuance of Ellsberg and the ethical provocation of Omelas, while being honest about where the analogy holds and where it fractures.

  **Core Analogy: Omelas as Ellsberg's Two Urns**
  - **The Known Urn (Staying in Omelas):** You know the exact "distribution": guaranteed societal happiness for all citizens, paid for by the unending, certain suffering of the child. The probability of your own happiness is 100% *if* you accept the terms. This mirrors Ellsberg's known urn with defined probabilities. Rationalizing the suffering is the "cost" of choosing certainty.
  - **The Ambiguous Urn (Walking Away):** You have *zero* information about the distribution of outcomes. Survival? Community? Purpose? Meaning? Suffering worse than the child's? Bliss? Utter oblivion? Le Guin deliberately denies all data. This is maximal Knightian uncertainty—the ambiguous urn par excellence.

  **The Walkers: Ambiguity-Averse or Ambiguity-Seeking? A False Binary?**
  This is where your insight hits the tension. Standard Ellsberg experiments show people are *ambiguity-averse*: they prefer the known urn. Omelas flips this on its head:

  1.  **The Walkers as *Morally* Ambiguity-Averse (Rejecting the Known "Bad"):**
      *   They cannot tolerate the *certainty* of the child's suffering as the foundation of their happiness. The "known" outcome (happiness + complicity in atrocity) is morally repugnant.
      *   In this reading, walking away is aversion to the *known moral cost* inherent in the "certain" option. The ambiguity of the mountains is chosen *despite* the uncertainty, not because of it. The ambiguity is the price paid to escape an intolerable certainty.

  2.  **The Walkers as *Outcome* Ambiguity-Seeking (Choosing the Unknown):**
      *   This interpretation feels weaker but has a facet. By rejecting the guaranteed comfort of Omelas for pure uncertainty, they *are* exhibiting a form of ambiguity-seeking *relative to the societal norm*. They value the *potential* for an outcome not defined by complicity so highly that they embrace the unknown. This isn't thrill-seeking; it's a desperate gamble for moral integrity in a world where the only alternative is known moral corruption.

  3.  **The Crucial Synthesis: Rejection Trumps Calculation**
      *   **The core driver isn't seeking ambiguity, it's rejecting a known evil.** The choice isn't primarily *about* the ambiguity of the mountains; it's about the impossibility of remaining in Omelas. The ambiguity is simply the necessary consequence of their rejection.
      *   **This transcends standard Ellsberg:** Ellsberg choices involve weighing potential gains/losses *under uncertainty*. The walkers aren't maximizing expected utility (personal happiness, survival). They are acting on a deontological principle: "Participation in *this* system is morally impossible." The ambiguity of the alternative is secondary. They walk *away from* Omelas, not *towards* a calculated better future.

  **Does the Story Suggest the "Right Call"? Beyond Maximization**
  Le Guin is profoundly ambivalent, and that's the point:

  1.  **The Limits of Utilitarianism:** Omelas *is* a utilitarian paradise for the many at the cost of the one. The story ruthlessly exposes the moral bankruptcy of this calculus for some individuals. The walkers declare: "Even if this 'maximizes' net happiness, it is unacceptable." This directly challenges the foundations of expected utility theory applied to ethics.
  2.  **The Irrelevance of Maximization for the Walkers:** They aren't choosing the mountains because they think it offers higher *expected* utility (happiness, survival). They have no data to make that calculation. They choose because Omelas violates a fundamental moral constraint. Their choice is *satisficing* (rejecting an unacceptable option) or rule-based ("Thou shalt not be complicit in torture") rather than *optimizing*.
  3.  **Ambiguity as the Space of Moral Possibility:** Le Guin withholds what lies beyond because *knowing* would undermine the moral act. If the walkers knew they found another utopia, it would validate their choice as self-interested optimization. If they knew they died horribly, it might frame their choice as noble but futile sacrifice. The ambiguity preserves the purity of their act: it is a rejection based *solely* on principle, utterly decoupled from personal consequence. This is something decision theory struggles to model – choice driven by integrity in the face of radical outcome uncertainty.

  **Where the Analogy Strains (Your Instinct is Correct):**

  1.  **The "Known Urn" is Morally Toxic:** Ellsberg's known urn is neutral (red/black balls). Omelas's "known" option carries an inherent, profound moral cost *beyond* any probabilistic outcome. The aversion isn't just to uncertainty, it's to active complicity in evil. This injects a qualitative, deontological element absent from classic ambiguity aversion experiments.
  2.  **The Stakes are Existential & Moral, Not Material:** Ellsberg typically involves gambles for money. Omelas involves the foundation of society, personal identity, and fundamental ethics. The aversion to the known option isn't risk aversion about loss; it's revulsion at the *nature* of the gain.
  3.  **No "Better" Outcome is Knowable or Promised:** In Ellsberg, people *hope* the ambiguous urn has better odds. The walkers have no such hope. They have only the conviction that Omelas is wrong. The ambiguity isn't a potential source of advantage; it's the abyss created by rejecting the only known world.
  4.  **Individual vs. Societal Choice:** Ellsberg is usually individual. Walking away is an individual act with profound societal implications (rejecting the social contract of Omelas). Staying is also a societal affirmation.

  **A Reading Taking Both Seriously:**
  Le Guin uses the structure of radical ambiguity not to replicate Ellsberg, but to stage a profound moral crisis that *exposes the limits* of probabilistic, utility-maximizing frameworks. The Ellsberg paradox reveals our cognitive discomfort with unknown probabilities. Omelas reveals our potential *moral* discomfort with known, calculated atrocities.

  The walkers are best understood as exhibiting **extreme moral aversion to a known, intolerable cost.** They are not seeking the ambiguity of the mountains; they are forced into it by their rejection of Omelas. Their choice isn't irrational within a narrow decision-theory lens focused on personal outcomes; it consciously *rejects* that lens. They prioritize an incommensurable value (non-complicity) above all calculable personal benefits, accepting maximal uncertainty as the necessary cost.

  Le Guin suggests that some moral choices – particularly those rejecting systemic evil – are indeed **not about maximizing expected utility.** They are categorical rejections that render the calculation of outcomes (whether known or ambiguous) irrelevant. The ambiguity of their destination isn't a factor to be weighed; it's the existential consequence of their unwavering "no." The story argues that true integrity might lie precisely in the willingness to step into that unknowable void, making it a powerful critique of the very foundations of consequentialist reasoning that underpin much decision theory, including the framing of the Ellsberg paradox itself. The walkers choose principle *over* prudence, and ambiguity is the terrain where such a choice becomes possible – and necessary.
