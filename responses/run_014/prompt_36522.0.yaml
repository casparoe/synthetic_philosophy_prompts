  3. Symmetry view (with or without asymmetry): Prenatal and posthumous nonexistence are symmetric, but some may bite the bullet and say death isn't bad, or explain the asymmetry via future-oriented desires.
  4. Desire-satisfaction: Death is bad because it thwarts desires (especially strong, central, or future-oriented ones).
  5. Narrative: Death is bad when it cuts short a life that is incomplete or ruins the narrative unity of a life.

