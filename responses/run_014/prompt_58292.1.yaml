prompt: |-
  hey so i help run a small uni fund that gives away like 5k a term and we only get about an hour to decide, most of us arent philosophy people. we keep getting pascals mugging style pitches where the expected value looks huge cause of some tiny probablity of an enormous payoff but it feels off. can you turn the usual fixes people talk about — like capping payoffs, ignoring super tiny chances, judging by long-run policy not one bet — into a quick checklist we could actually run in 15 mins, with clear when to reject vs escalate to a longer debate and flagging where its just a judgement call? then try it out on two toy cases i made up: A) someone wants $400 to brute-force search for a mathematical proof that if found would supposedly let him create a vast number of happy simulated lives, chance of success is like one in two million, B) paying for a flood wall with about a 5% chance of preventing serious harm to a village. also show us one case where your checklist says something most of us would hate, and say what the checklist just cant settle.
reasoning: |-
  We are creating a quick checklist for a university fund committee to evaluate proposals, especially those that might be "Pascal's mugging" style (i.e., extremely low probability of an enormous payoff). The goal is to have a checklist that can be run in about 15 minutes, with clear criteria for rejection, escalation, or acceptance. We'll design it to flag when a proposal is a judgment call and when it requires more debate.

  Checklist Design:

  1. **Cap the Payoff (Absolute Cap):**
     - Set a maximum reasonable payoff in absolute terms (e.g., $1 billion, or the maximum value that the fund is willing to consider as a realistic upper bound). Any payoff above that cap is reduced to the cap for the purpose of expected value calculation.
     - *Rejection Threshold:* If the expected value (using the capped payoff) is less than the cost, reject. If the expected value is positive but the uncapped payoff is above the cap, escalate for discussion about whether the cap is appropriate.

  2. **Ignore Super Tiny Probabilities (Probability Threshold):**
     - Set a minimum probability threshold (e.g., 1 in 10,000 or 1 in 1,000,000) below which probabilities are treated as zero. This avoids giving too much weight to extremely unlikely events.
     - *Rejection Threshold:* If the probability is below the threshold, then the expected value is zero, and if the cost is positive, reject. If the probability is above the threshold, proceed to calculate expected value.

  3. **Long-Run Policy (Expected Value per Dollar):**
     - Calculate the expected value per dollar spent (i.e., (probability * payoff) / cost). This helps compare across projects. Set a minimum acceptable expected value per dollar (e.g., 1.0 for breaking even, but the fund might want a higher threshold for impact).
     - *Rejection Threshold:* If the expected value per dollar is less than 1.0, reject. If it's above 1.0 but the project has a very low probability (even if above the threshold) and a very high payoff, escalate for discussion about robustness.

  4. **Robustness Check (Sensitivity Analysis):**
     - Vary the probability and payoff estimates by a factor (e.g., 10x and 0.1x) to see if the expected value remains positive. If the expected value is highly sensitive and could easily become negative, that's a red flag.
     - *Rejection Threshold:* If the expected value becomes negative under a modest downward adjustment (e.g., halve the probability or halve the payoff), then reject or escalate.

  5. **Judgment Call Flags:**
     - If the proposal involves unverifiable claims (e.g., about the probability or the payoff), flag as a judgment call and escalate.
     - If the proposal has an extremely high claimed payoff (e.g., astronomical) that is hard to quantify, flag and escalate.

  **Checklist Flow:**

  Step 1: If the probability is below the threshold (e.g., 1 in 1,000,000), set expected value to zero and reject unless there are compelling non-expected-value reasons (then escalate).

  Step 2: If the probability is above the threshold, cap the payoff at a pre-set maximum (e.g., $1 billion) and calculate the expected value.

  Step 3: Calculate expected value per dollar: (probability * capped_payoff) / cost.

  - If expected value per dollar < 1.0, reject.
  - If expected value per dollar >= 1.0, then proceed to step 4.

  Step 4: Robustness check:
  - Try with half the probability and the same capped payoff. Is expected value per dollar still >= 1.0?
  - Try with the same probability but half the payoff (or if payoff is capped, then with the same cap). Is expected value per dollar still >= 1.0?
  - If either test fails, escalate for further debate because it's sensitive.

  Step 5: If the project passes all the above, then it's a candidate for funding. However, if the uncapped payoff was above the cap, escalate for discussion about whether the cap is too low.

  **Applying the Checklist to the Toy Cases:**

  We'll set the following parameters for the fund:
  - Absolute cap on payoff: $1 billion (1e9 dollars)
  - Probability threshold: 1 in 1,000,000 (i.e., probabilities below 1e-6 are ignored)
  - Expected value per dollar threshold: 1.0 (we want at least $1 expected return per $1 spent)

  Case A:
  - Cost: $400
  - Claimed Payoff: Vast number of happy simulated lives. We need to assign a dollar value? This is tricky. Let's assume the proposer claims it is equivalent to $10 trillion (1e13 dollars) in value.
  - Probability: 1 in 2 million (5e-7)

  Step 1: Probability (5e-7) is below our threshold (1e-6)? Yes, because 5e-7 < 1e-6. So we set the expected value to zero. Therefore, expected value per dollar is 0. Reject.

  But let's go through the steps for completeness.

  Step 2: Cap the payoff at $1e9. So capped payoff = $1e9.

  Step 3: Expected value per dollar = (5e-7 * 1e9) / 400 = (500) / 400 = 1.25. This is above 1.0.

  However, because the probability was below the threshold, we already set it to zero and rejected. But if we had not set the threshold, we would have then done:

  Step 4: Robustness check:
  - Half the probability: 2.5e-7 -> expected value per dollar = (2.5e-7 * 1e9) / 400 = 250 / 400 = 0.625 (<1.0) -> fails.
  - Half the payoff (but we are capped at 1e9, so half the capped payoff is 5e8): (5e-7 * 5e8) / 400 = 250 / 400 = 0.625 (<1.0) -> fails.

  So it fails the robustness check. We would reject or escalate.

  Verdict for A: Reject (because of the probability threshold) and if we didn't have that, then because of the robustness check we would reject or escalate.

  Case B:
  - Cost: Let's say they are asking for $X (we need a number). The problem doesn't specify the cost, but it says "paying for a flood wall". We'll assume the cost is $50,000 (a typical small-scale flood defense for a village?).
  - Probability: 5% (0.05) of preventing serious harm to a village.
  - Payoff: What is the value of preventing serious harm? Serious harm might include damage to property, health, etc. Let's assume the fund has a way to value this. For a small village, we might value the harm prevented at $2 million (including both tangible and intangible costs).

  Step 1: Probability (0.05) is above the threshold (1e-6) -> proceed.

  Step 2: Cap the payoff: $2 million is below $1 billion, so no cap.

  Step 3: Expected value per dollar = (0.05 * 2,000,000) / 50,000 = (100,000) / 50,000 = 2.0. This is above 1.0.

  Step 4: Robustness check:
  - Half the probability: 0.025 -> expected value = (0.025 * 2,000,000) = 50,000. Per dollar: 50,000 / 50,000 = 1.0 (which is acceptable).
  - Half the payoff: $1,000,000 -> expected value = 0.05 * 1,000,000 = 50,000. Per dollar: 50,000 / 50,000 = 1.0 (acceptable).

  So it passes.

  Verdict for B: Accept.

  **A Case Where the Checklist Says Something Controversial:**

  Let's create a case that the checklist would reject but that might seem reasonable to some.

  Case C: A proposal to fund a one-time event that has a 1 in 10,000 chance of saving 10,000 lives. The cost is $1,000. We value a life at $10 million (a common figure in policy).

  - Probability: 1e-4
  - Payoff: 10,000 lives * $10 million/life = $100 billion
  - Cost: $1,000

  Step 1: Probability (1e-4) is above threshold (1e-6) -> proceed.

  Step 2: Cap payoff at $1e9 -> $1e9 (since 100e9 is above the cap).

  Step 3: Expected value per dollar = (1e-4 * 1e9) / 1000 = (100,000) / 1000 = 100 -> well above 1.

  Step 4: Robustness:
  - Half probability: 5e-5 -> (5e-5 * 1e9) / 1000 = 50,000 / 1000 = 50 (still above 1).
  - Half payoff (capped at 1e9, so 5e8): (1e-4 * 5e8) / 1000 = 50,000 / 1000 = 50 (above 1).

  So the checklist says accept. But we want a controversial rejection.

  Let me adjust: use a lower cap? or set a higher threshold for the probability? Alternatively, make the probability below the threshold.

  Case D: A proposal to fund research into a virus that has a 1 in 2 million chance of causing a global pandemic in the next year. The research costs $500 and could prevent the pandemic, which is valued at $10 trillion (the cost of a global pandemic).

  - Probability: 1 in 2 million (5e-7)
  - Payoff: $10 trillion (1e13)
  - Cost: $500

  Step 1: Probability (5e-7) is below the threshold (1e-6) -> set expected value to zero -> reject.

  But if we didn't have the threshold, we'd cap at $1e9 and then:
  Expected value per dollar = (5e-7 * 1e9) / 500 = 500 / 500 = 1.0 -> exactly at the threshold.

  Robustness check:
  - Half probability: (2.5e-7 * 1e9) / 500 = 250/500 = 0.5 (<1) -> fails.
  - Half payoff: (5e-7 * 0.5e9) / 500 = 250/500 = 0.5 -> fails.

  So we would reject. But some might argue that even a tiny chance of preventing a global pandemic is worth $500.

  This is controversial because the fund might feel that $500 is a small amount and the stakes are huge, even if the chance is tiny. The checklist would reject because of the probability threshold and the robustness check.

  **What the Checklist Can't Settle:**

  - The checklist cannot settle the valuation of non-monetary outcomes (e.g., lives saved, happiness, environmental protection). This requires a separate process to assign monetary values.

  - It cannot settle disputes about the probability estimates, especially when they are highly uncertain or based on speculative models.

  - It cannot account for moral considerations that are not captured by expected utility (e.g., deontological constraints, fairness, or avoiding catastrophic risks).

  - When the robustness check fails, it flags for escalation, but then the committee must debate without clear guidance.

  **Final Checklist Summary for Quick Use:**

  1. **Probability Threshold:** Is the probability of success less than our minimum (e.g., 1 in 1,000,000)? 
     - If yes, set expected value to zero and **reject** (unless there are non-expected-value reasons to consider, then escalate).
  2. **Cap the Payoff:** Reduce any payoff above $1 billion to $1 billion.
  3. **Expected Value per Dollar:** Calculate (probability * capped payoff) / cost. 
     - If less than 1.0, **reject**.
  4. **Robustness Check:** 
     - Recalculate with half the probability. Is expected value per dollar still >=1.0? 
     - Recalculate with half the capped payoff. Is expected value per dollar still >=1.0?
     - If either is no, **escalate** for debate.
  5. **Special Flags:** 
     - If the payoff was above the cap, escalate to discuss whether the cap is appropriate.
     - If the probability or payoff estimates are highly uncertain or unverifiable, escalate.

  This checklist should take about 5-10 minutes per application, leaving time for discussion on escalated cases.
answer: |-
  Here's a practical, time-efficient checklist designed to handle Pascal's mugging-style proposals. It combines key philosophical fixes into a 5-step process, with clear **reject/escalate/accept** thresholds. Aim to complete it in 5-7 minutes per proposal, leaving time for group discussion on escalated cases.

  ---

  ### **Quick Checklist for Pascal's Mugging Risk**
  **Key Parameters (pre-set by your fund):**  
  - 🚫 **Probability floor:** Ignore probabilities below **1 in 1 million** (0.0001%).  
  - 💰 **Payoff cap:** Limit any claimed benefit to **$1 billion** (adjustable, but anchor to realistic max impact).  
  - 📉 **Robustness test:** Require the proposal to still have positive expected value (EV) after halving the probability *or* halving the payoff.  
  - ⚖️ **EV per dollar threshold:** Reject if EV per dollar spent is **<1x** (i.e., unlikely to break even in expected value).

  | Step | Question                                                                 | Reject if...                                                                 | Escalate if...                                                                 | Accept if...                                     |
  |------|--------------------------------------------------------------------------|------------------------------------------------------------------------------|--------------------------------------------------------------------------------|--------------------------------------------------|
  | 1    | **Is the probability below our floor?** (e.g., <0.0001%)                 | ✅ Yes. Ignore the payoff; treat EV as $0.                                   | –                                                                              | No. Proceed to Step 2.                           |
  | 2    | **Does the uncapped payoff exceed $1B?**                                 | –                                                                            | ✅ Yes. Cap payoff at $1B for now, but flag for debate if EV is borderline.    | No. Use claimed payoff.                          |
  | 3    | **Is EV per dollar ≥1?**<br>(EV = probability × payoff)                  | ✅ No. (i.e., EV < cost)                                                     | –                                                                              | Yes. Proceed to Step 4.                          |
  | 4    | **Does it pass the robustness test?**<br>(Test with: ½ prob OR ½ payoff) | ✅ No. (EV per dollar falls below 1 after adjustment)                        | Borderline (e.g., EV dips but stays positive) OR payoff was capped in Step 2. | ✅ Yes. (EV per dollar ≥1 after both adjustments) |
  | 5    | **Are probabilities/payoffs verifiable?**                                | ✅ No *and* claims seem speculative (e.g., no evidence, unfalsifiable).      | Evidence is weak but plausible (e.g., expert estimate).                       | ✅ Strong evidence (e.g., historical data).      |

  **Final Decision Path:**  
  - **Reject:** Fails Steps 1, 3, 4, or 5 (unverifiable + speculative).  
  - **Escalate:** Triggers escalate in Steps 2, 4, or 5. Debate if:  
    - The uncapped payoff might be valid (e.g., preventing existential risk).  
    - Robustness is borderline.  
    - Ethical factors outweigh math (e.g., saving lives).  
  - **Accept:** Passes all steps with no escalation flags.

  ---

  ### **Testing the Checklist on Your Toy Cases**
  **Case A: $400 for brute-force math proof**  
  - Claimed payoff: "Vast happy simulated lives" → monetized as $10 trillion*  
  - Probability: 1 in 2 million (0.00005%)  
  - Cost: $400  

  | Step | Analysis                                                                 | Result    |
  |------|--------------------------------------------------------------------------|-----------|
  | 1    | Probability (0.00005%) < 0.0001%? **Yes.**                              | → Reject. EV = $0. |
  | 2    | (Skipped)                                                               |           |
  | 3    | (Skipped)                                                               |           |

  **Why reject?** The probability is below your floor. Even if you proceeded:  
  - Capped payoff = $1B → EV = (1/2M) × $1B = $500  
  - EV per dollar = $500 / $400 = 1.25x (passes Step 3).  
  - **But robustness test fails:** Halve probability → EV = $250 → EV per dollar = 0.625x (<1).  
  - Unverifiable payoff (hard to value "happy simulated lives").  

  **Verdict:** **Reject** immediately. Too speculative, fails probability floor and robustness.

  ---

  **Case B: Flood wall for village**  
  - Payoff: Prevents "serious harm" → monetized as $2M* (property, health, livelihoods)  
  - Probability: 5%  
  - Cost: $50,000 (example)  

  | Step | Analysis                                                                 | Result     |
  |------|--------------------------------------------------------------------------|------------|
  | 1    | Probability (5%) > 0.0001%? **Yes.**                                    | → Proceed. |
  | 2    | Payoff ($2M) < $1B? **Yes.** Use $2M.                                   | → Proceed. |
  | 3    | EV = 5% × $2M = $100,000 → EV per dollar = $100K / $50K = **2.0x** (≥1) | → Proceed. |
  | 4    | Robustness: Halve probability → EV = 2.5% × $2M = $50K → EV/dollar = 1.0x (≥1).  
  Halve payoff → EV = 5% × $1M = $50K → EV/dollar = 1.0x (≥1). **Pass.** | → Proceed. |
  | 5    | Verifiable? **Yes.** (Historical flood data exists)                     | → Accept.  |

  **Verdict:** **Accept**. Clear expected value, passes robustness, and tangible payoff.

  \* *Monetizing non-financial payoffs requires pre-agreed standards (e.g., $10M per life saved). Update these as a fund.*

  ---

  ### **Controversial Case: Where the Checklist Rejects Intuitive Appeals**
  **Case C: $1,000 for asteroid defense**  
  - Payoff: 1 in 10 million chance of preventing a human extinction event (value: $100 trillion*).  
  - Cost: $1,000  

  | Step | Analysis                                                                 | Result    |
  |------|--------------------------------------------------------------------------|-----------|
  | 1    | Probability (0.00001%) < 0.0001%? **Yes.**                              | → Reject. EV = $0. |
  | 2    | (Skipped)                                                               |           |

  **Why you'll hate this:** It feels wrong to reject a cheap, high-stakes bet. But:  
  - Uncapped EV = (1/10M) × $100T = $10M → EV/dollar = 10,000x.  
  - **Checklist forces rejection** due to probability floor. Even if escalated:  
    - Capped payoff ($1B) → EV = $100 → EV/dollar = 0.1x (fails Step 3).  
    - Robustness fails (any probability/payoff adjustment kills EV).  
    - Wildly unverifiable (who estimates extinction risk?).  

  **Controversy takeaway:** The checklist avoids "gambling with infinity," but may reject true long-tail benefits. **Escalate here** if ethical arguments override (e.g., "duty to protect humanity").

  ---

  ### **What the Checklist Can't Settle (Requires Debate)**
  1. **Moral weight disagreements**  
     - E.g., Is preventing 1 human death worth $10M? What about 1,000 insect species?  
     - *Resolution: Pre-define ethical weights (e.g., "prioritize human lives over economic value").*  

  2. **Disputed probabilities**  
     - E.g., "I say it's 1 in 10,000, you say 1 in 10 million."  
     - *Resolution: Escalate; demand external evidence or expert input.*  

  3. **Non-utilitarian values**  
     - E.g., "Even with low EV, this feels like justice/reparations."  
     - *Resolution: Escalate; use a separate ethics rubric (e.g., "fairness" score).*  

  **Time saver:** For borderline cases, vote on:  
  - "Would we fund this if the payoff was capped at $1B?"  
  - "Is there >10% chance the probability is 10× higher than claimed?"

  ---

  ### **Implementation Tips**
  - **Pre-meeting:** Assign 1–2 people to run the checklist per proposal (takes 5 min).  
  - **Meeting:** 5 min to review checklist outputs, 10 min debate escalated cases.  
  - **Calibrate:** After each term, adjust parameters (e.g., raise payoff cap to $10B if too restrictive).  
  - **Template:** Use a simple spreadsheet (input: cost, probability, payoff → auto-calculate steps).

  This balances speed and rigor, filtering out obvious Pascal's mugging while flagging edge cases for deeper discussion.
