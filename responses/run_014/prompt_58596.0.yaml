  For the interactive part, the guilt from making choices in games is different. Agency in interactive media creates personal responsibility. Murray's concept of agency from "Hamlet on the Holodeck" applies here. The result is "procedural guilt," where the game mechanics tie consequences to the player's actions, making the guilt feel more real. Also, Lankoski and Björk's "player character engagement" ties emotional response to the player's role.

  The user wants clarity between passive and interactive cases. They also need to understand why these emotions feel genuine even when they know it's fiction. The key differences lie in agency and personal responsibility. In passive consumption, emotions come from empathy; in interactive scenarios, guilt stems from personal choice and irreversible consequences. Terms like "procedural guilt" and "moral residue" might help here.

  I should also address why this isn't just pretending. The user mentions embarrassment afterward, showing they know it's not real but still feel it. That ties into cognitive dissonance from the paradox of fiction. For games, the design reinforces responsibility through mechanics, making the guilt persist beyond the gameplay.

  The user's deeper need might be understanding their own emotional responses and validating them as normal. They might feel confused about why fiction affects them so deeply and want academic terms to articulate this experience. Explaining the psychological mechanisms (mirror neurons, empathy) and narrative theories can provide reassurance. Highlighting the difference between empathy and responsibility in guilt could help them distinguish their reactions in different media contexts.
answer: |-
  What you're describing is a profound and well-documented aspect of human psychology and narrative engagement. There isn't a single, universally-agreed-upon term for the entire phenomenon, but we can break it down into key concepts and define the crucial difference you observed between passive witnessing and active participation:

  **1. The Core Phenomenon: Genuine Emotions for Fictional Stimuli**

  *   **Paradox of Fiction:** This is the philosophical puzzle at the heart of your experience: How can we feel genuine emotions (sadness, anger, anxiety, guilt) towards characters and events we *know* are not real? Philosophers like Colin Radford and Kendall Walton have debated this extensively.
  *   **Suspension of Disbelief:** Often mentioned, but it's not quite accurate for the *emotional* response itself. We don't truly *believe* the dog drowned; rather, we *accept* the fictional world's rules and *engage* emotionally despite knowing it's fiction.
  *   **Narrative Transportation (Green & Brock, 2000):** This is the dominant psychological framework. It describes the state of being completely absorbed into a narrative world – mentally "transported" into it. When transported, our mental resources are focused on the story, our emotions are engaged by the characters' plights, and real-world concerns fade temporarily. *This explains your tears for the lighthouse keeper and anger at the stepmother.*
  *   **Identification & Empathy:** We identify with characters (see the world through their eyes) or empathize with them (feel *for* their situation). Mirror neurons and our innate capacity for empathy allow us to simulate the characters' experiences and feel corresponding emotions, even when the trigger is fictional. The simplified animation style didn't matter because your brain filled in the emotional gaps.
  *   **Emotional Simulation:** Stories act as powerful simulators for human experience. They trigger our emotional and cognitive systems in ways parallel to real events. Your brain processes the *idea* of loss, betrayal, or danger, activating similar emotional pathways as a real event would.

  **Why it's NOT just pretending or being fooled:**

  *   **Cognitive Awareness:** You *knew* the dog wasn't real and felt sad anyway. Pretending implies a conscious effort you weren't making. Being fooled implies you thought it was real, which you didn't.
  *   **Physiological Response:** Your tears and anxiety were real physiological reactions. Pretending wouldn't necessarily cause that.
  *   **Lack of Behavioral Intent:** You didn't jump up to save the animated dog or confront the stepmother. Your emotional response was contained within the narrative context.
  *   **Reflective Embarrassment:** Your subsequent embarrassment highlights the *tension* between your intellectual knowledge (it's not real) and your emotional response (it felt real). This dissonance is central to the paradox.

  **2. The Specific Case of Interactive Choice & Responsibility (Your Villager Game)**

  This is where your experience diverges significantly from passive consumption. The core phenomenon (emotional response to fiction) is still present, but crucial layers are added:

  *   **Agency:** As a player, you have **agency** – the power to make meaningful choices that affect the narrative outcome. This transforms you from a *witness* into a *participant*.
  *   **Procedural Authorship (Murray, 1997):** In interactive narratives, the meaning isn't just conveyed *to* you; it's generated *through* your actions within the system. You become a co-author of the events.
  *   **Responsibility Attribution:** When *your* choice ("Player Agency") directly leads to a negative outcome for a character, your brain attributes responsibility *to you*. This triggers a much more personal and complex emotional response than witnessing suffering caused by others (like the storm or the stepmother).
  *   **Procedural Guilt (Salen & Zimmerman, 2004) / Moral Residue:** The specific feeling you describe – the persistent guilt and desire to undo your choice – is often called **Procedural Guilt**. This term emphasizes that the guilt arises from the *structure of the interactive system* and your role within it. It can also be described as a form of **Moral Residue** – the lingering feeling of responsibility for an outcome, even within a fictional context.
  *   **Player Character Engagement (Lankoski & Björk, 2015):** This theory explores how players form connections with their avatars and the game world. Choices made "as" the player character often feel intensely personal, blurring the line between the player's identity and the character's role.
  *   **Irreversibility:** Many games (especially impactful narrative ones) make choices permanent. This prevents players from easily "undoing" the consequence, mirroring the weight of real-life decisions and amplifying the guilt.
  *   **Counterfactual Thinking:** Your desire to replay stems from this: constantly imagining the *better* outcome that *could* have happened if you chose differently ("If only I had saved Character X..."). This fuels the guilt.

  **Why Interactive Guilt Feels Different & Stronger:**

  1.  **Internal Locus of Control:** The suffering wasn't caused by an external force (storm, villain) or fate; it was caused *by your specific decision*. The source of the harm is *you*.
  2.  **Personal Investment:** You actively *did* something, investing your cognitive and emotional energy into making the choice.
  3.  **Simulation of Moral Dilemma:** The game forced you to simulate a real-world ethical conflict with no perfect solution, activating your personal moral framework.
  4.  **Lack of Emotional Distance:** Agency reduces the psychological distance between you and the consequences. You aren't just watching; you *caused* it.
  5.  **Persistence:** Because the outcome is tied to *your* irrevocable action (within that playthrough), the guilt isn't easily dissipated when the story ends, unlike the sadness for the lighthouse keeper which fades as the fictional context dissolves.

  **Proposed Definitions (Summarizing the Concepts):**

  *   **Narrative-Emotive Dissonance (Passive):** The experience of genuine emotional arousal (e.g., sadness, anger, anxiety) elicited by fictional characters and events, occurring despite conscious awareness of their fictional nature, primarily driven by empathy, identification, and cognitive/emotional simulation during narrative transportation. *(This covers the lighthouse keeper and stepmother.)*
  *   **Procedural Moral Residue (Interactive):** The persistent feeling of guilt, responsibility, or regret arising specifically from a player's exercise of agency within an interactive narrative system, where their conscious choices directly lead to negative consequences for fictional entities, creating a strong attribution of personal causation and moral burden that persists beyond the immediate play session. *(This covers your villager game guilt.)*

  **Boundaries:**

  *   **Pretending:** Involves conscious role-playing where emotions might be feigned or exaggerated for effect. Your experiences were involuntary and physiologically real.
  *   **Being Fooled:** Requires a belief that the stimulus is real (e.g., mistaking CGI for real footage). You maintained cognitive awareness of the fiction.
  *   **Caring About Real People:** While empathy mechanisms are shared, the cognitive knowledge of fiction creates a crucial boundary. We don't call emergency services for the animated dog. The emotions are real, but the *object* is known to be unreal, and the *behavioral imperatives* are absent.

  Your experiences demonstrate a deep sensitivity to narrative and a capacity for empathy and moral reasoning – essential qualities for understanding human experience, which is central to your storytelling elective. The difference you identified between passive empathy and interactive guilt highlights the unique and powerful impact of agency within narratives. These aren't quirks; they're fundamental aspects of how stories, especially interactive ones, work on the human mind.
