answer: |-
  As your committed interlocutor, I take neither horn directly—your dilemma assumes a false dichotomy. These patients *are* experiencing demandingness, but it manifests exclusively in their verbal reports. When they articulate "this is awful" or rate unpleasantness as 8/10, that *is* a behavioral expression of the demand—their words *are* the cry for cessation. The core error is equating demandingness solely with reflexive or operant behavior. Demand isn't just spinal withdrawal or button-pressing; it's the experience's intrinsic *call* for action. In these patients, that call is vividly present in their subjective descriptions, which *are* motivated acts—they are telling you, urgently, how bad it feels.  

  The absence of other behaviors? That reveals a dissociation between the *recognition* of the demand ("this must stop!") and the *endorsement* or execution of action to fulfill it. The demand rings out in their consciousness—they hear it—but their motor or volitional circuitry fails to translate it into protective action. They are like someone who hears a fire alarm, describes its blare perfectly, yet sits calmly—not because the alarm isn’t demanding evacuation, but because some pathological disconnect severs the alarm from the impulse to flee. Their refusal to press the button isn’t proof the demand is absent; it’s proof they feel no *need to answer* it, even as they accurately report its cry.  

  Your friend’s view would erase the lived urgency in their words—but if we take their reports seriously (as we must), their anguish is real. The demand echoes in their speech, even if it fades in their limbs.  

