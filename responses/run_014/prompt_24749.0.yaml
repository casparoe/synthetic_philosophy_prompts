prompt: |-
  I'm a certified financial planner at a small independent firm, and most of my caseload is middle-income clients in their thirties and forties who are trying to build an emergency fund and start retirement savings. I see each client for a forty-five-minute review roughly every six months, and whatever I recommend has to be written up in their file with my signature, so I can't afford to be vague. The same pattern keeps coming up: a client says they intend to start a savings plan or pay down a credit card, and then month after month they don't, and I'm not confident I'm diagnosing the cause correctly. I've been reading about akrasia and hyperbolic discounting, and I'm worried I'm treating every case as a self-control problem and reaching for commitment devices when the real issue is something else — or, just as often, missing the self-control problem when it's actually there. I'd like a decision procedure I can run inside the forty-five-minute session, by myself, with a client who is a legally competent adult I can offer things to but not impose anything on.

  Please write it as an ordered set of questions to put to the client, with what counts as a sufficient answer to each, the points where the procedure stops with "this is not a present-bias problem, do not reach for the commitment toolkit," and the points where it hands the decision off to a human values judgment rather than a fact. Even where you simplify for a planner who is not an economist, keep the distinctions that actually do the work: the difference between a time-inconsistent, present-biased preference and a merely steep but time-consistent discount rate — I understand that a reversal between the immediate and the deferred framing is the signature of the first, so tell me exactly how to run that test in conversation and what the client's two answers have to look like to count as a reversal; the difference between akrasia in the strict sense, where the client judges one option better on balance and then does the other, and a case where the client simply has no settled better judgment to betray; and the difference between a preference problem and a feasibility or information problem, since a plan the client cannot actually execute is not a failure of will, and a client who is misinformed about what works is not weak-willed. Mark explicitly which steps are judgment calls dressed up as procedure.

  Then run the procedure on three cases: a thirty-four-year-old who has said "I'll start the Roth in January" for three years running and who, when I put numbers to him, prefers five hundred dollars in hand today to five hundred fifty in a month but prefers five hundred fifty in two months to five hundred in a month; a twenty-nine-year-old who consistently prefers a hundred dollars today to a hundred ten in a month and, asked about the deferred version, consistently prefers a hundred in a month to a hundred ten in two months, and who tells me flatly that at twenty-nine she doesn't care about what she'll want at sixty; and a client who "can't stick to" a six-hundred-a-month savings plan but whose cash flow shows that six hundred is not actually available month to month without missing rent, a client I keep wanting to call a discipline problem and I'm not sure I'm right about. At least one of these should come out differently from what I'd intuitively want, and I want the procedure to say so rather than paper over it. Be honest, too, about where the procedure will misfire — clients who answer hypotheticals to please me, clients for whom the future is genuinely precarious and a steep discount rate is rational rather than a flaw, and the standing problem that I am testing stated preferences, not revealed behavior. Finally, I have a current client, a forty-one-year-old who pays only the minimum on a credit card every month, says he "knows he should" pay more, and who, when I asked him last month whether he'd rather have two hundred dollars today or two hundred twenty in a month, said two hundred today — but I never asked him the deferred version. Apply the procedure as far as it can go with what I have, and end your entire response with a single line beginning "Verdict:" that gives, for this client, the one label from the set PRESENT_BIAS, CONSISTENT_HIGH_DISCOUNT, FEASIBILITY_OR_INFORMATION, INCONCLUSIVE that the procedure assigns, followed in parentheses by the single question to put to him at the next session.
reasoning: |-
  We are creating a decision procedure for the financial planner to diagnose why clients are not following through on savings or debt repayment plans. The procedure is designed to fit within a 45-minute session and is structured as a series of questions. The goal is to distinguish between:
  - Present bias (time-inconsistent preferences, specifically hyperbolic discounting) vs. consistent high discount rate.
  - Akrasia (acting against one's better judgment) vs. no settled judgment.
  - Preference problems vs. feasibility/information problems.

  The procedure:

  1. **Feasibility Check:** 
     - Question: "Looking at your actual income and expenses over the past six months, can you consistently set aside $X per month without missing essential payments (like rent, utilities, minimum debt payments) or without having to borrow to cover the shortfall?"
     - Sufficient answer: The client must provide bank/credit card statements or a detailed budget to verify. The planner should also review the cash flow.
     - If the answer is **no** (i.e., the plan is not feasible given their current cash flow), then stop: **FEASIBILITY_OR_INFORMATION problem**. Do not proceed to the commitment toolkit. Instead, work on adjusting the plan to a feasible level or addressing income/expense issues.
     - If the answer is **yes** (feasible) or the client agrees that the amount is feasible but still isn't doing it, proceed to step 2.

  2. **Information Check:**
     - Question: "Do you understand why I'm recommending this specific action (e.g., paying down the credit card, starting the Roth) and how it works? Can you explain it back to me in your own words?"
     - Sufficient answer: The client must demonstrate understanding (e.g., "Paying more than the minimum reduces the interest I pay and gets me out of debt faster" or "Putting money in a Roth grows tax-free and I can withdraw contributions without penalty").
     - If the client cannot explain or has a clear misconception, then stop: **FEASIBILITY_OR_INFORMATION problem** (specifically, an information gap). Address the misunderstanding and re-educate.
     - If the client demonstrates understanding, proceed to step 3.

  3. **Stated Preference vs. Action Check (Akrasia Test):**
     - Question: "When you say you 'should' do this, do you mean that, all things considered, you believe it's the best thing for you to do, even if it's hard? Or do you have mixed feelings about it?"
     - Sufficient answer: We are looking for a clear statement that the client judges the action as the better course overall. If the client says, "I know it's the best thing for me, but I just don't do it," that indicates akrasia. If the client says, "I'm not sure it's worth it," or "I'd rather spend the money now," then there is no settled judgment to betray.
     - If the client does **not** have a settled judgment that the action is best (i.e., they are ambivalent or don't believe it's best), then stop: **Not a present-bias problem, do not reach for the commitment toolkit**. This is a values conflict or a different preference issue. Instead, explore the reasons for the ambivalence.
     - If the client **does** have a settled judgment that the action is best, then we suspect akrasia and proceed to step 4 to test for present bias.

  4. **Present Bias Test (Time-Inconsistency Test):**
     - We use a pair of questions to detect a reversal in preferences, which is the hallmark of present bias (hyperbolic discounting).
     - **Question A (Immediate vs. Near Future):** "Would you rather have $X today or $Y in one month?" (where Y > X, and the difference is large enough to be meaningful but not so large as to be trivial. We'll use X=100, Y=110 as a standard, but adjust for the client's income level if necessary. For a client with higher income, we might use larger amounts to be salient.)
     - **Question B (Deferred Pair):** "Would you rather have $X in one month or $Y in two months?" (same X and Y, just shifted by a month).
     - Interpretation:
          - If the client prefers $X today over $Y in one month (i.e., the immediate reward) but also prefers $Y in two months over $X in one month (i.e., the later reward when both are in the future), that is a **reversal** and indicates **present bias**.
          - If the client consistently prefers the smaller sooner reward in both comparisons (i.e., $X today over $Y in one month AND $X in one month over $Y in two months), that indicates a **consistent high discount rate** (exponential discounting with a high discount factor).
          - If the client consistently prefers the larger later reward in both comparisons, that indicates a low discount rate and no present bias.
     - Note: The amounts must be adjusted to be meaningful but not life-changing. The planner should use amounts that are in the ballpark of the savings or debt repayment amounts being discussed (e.g., $100, $500, etc.) and should be consistent in the two questions.
     - If the client shows a reversal (present bias), then proceed to consider commitment devices (with the client's consent) as a potential solution.
     - If the client shows consistent high discounting (no reversal) but still fails to act, then stop: **CONSISTENT_HIGH_DISCOUNT**. This is not a present-bias problem. The client simply values the present much more than the future, and commitment devices may not address the core issue. Instead, focus on reframing the benefits or finding ways to make the future more salient.
     - If the client shows consistent low discounting (prefers the larger later in both), then we have a contradiction because they are not acting on their stated preference. Revisit feasibility or akrasia (step 1 and 3) or consider other barriers (e.g., procrastination, forgetfulness).

  5. **Judgment Call Step (Dressed as Procedure):** 
     - Even after the above, if the client passes the feasibility and information checks, has a settled judgment, and shows present bias, we still must consider if the commitment device is appropriate. The planner must judge:
          - Is the client likely to follow through on the commitment device? (e.g., automatic transfers, locking away credit cards)
          - Are there any risks (e.g., liquidity needs, penalties) that make the commitment device too dangerous?
          - Does the client voluntarily agree to the commitment device?
     - This step is a judgment call because it involves predicting behavior and assessing risk tolerance.

  Now, we run the three cases:

  **Case 1: Thirty-four-year-old client**
  - Stated pattern: Says he'll start the Roth in January for three years running.
  - Present bias test results:
      - Prefers $500 today to $550 in one month (immediate: takes the smaller sooner)
      - Prefers $550 in two months to $500 in one month (deferred: takes the larger later) -> **reversal**
  - Procedure:
    1. Feasibility: We assume the planner has checked that $X (the Roth contribution) is feasible (if not, it would have been caught at step 1).
    2. Information: We assume the client understands the Roth (if not, step 2 would have caught it).
    3. Akrasia: The client has stated an intention to start the Roth, so we assume he judges it as the best thing to do (but doesn't do it). So, yes, akrasia is present.
    4. Present bias test: The reversal is clear -> **PRESENT_BIAS**.
  - Verdict for this client: Present bias is the issue. The planner can consider commitment devices (e.g., automatic payroll deduction starting in January, with a signed authorization now).

  **Case 2: Twenty-nine-year-old client**
  - Stated pattern: Prefers $100 today to $110 in one month and, in the deferred version, prefers $100 in one month to $110 in two months.
  - Also states: "at twenty-nine she doesn't care about what she'll want at sixty."
  - Procedure:
    1. Feasibility: Assume the savings plan is feasible (if not, step 1 would have stopped).
    2. Information: Assume she understands (if not, step 2).
    3. Akrasia: She does not have a settled judgment that saving for retirement is the best thing to do. She explicitly says she doesn't care about age sixty. Therefore, there is no akrasia (no better judgment to betray). 
     - Stop at step 3: **Not a present-bias problem, do not reach for the commitment toolkit**. This is a values conflict. The planner should explore why she doesn't care (e.g., fatalism, distrust of the future, different priorities) and reframe or adjust goals accordingly.
  - Note: The present bias test shows consistent high discounting (she always prefers the immediate reward), but we didn't get to step 4 because step 3 stopped us. The core issue is that she does not value the future goal.

  **Case 3: Client who "can't stick to" a $600/month savings plan**
  - Cash flow shows that $600 is not actually available without missing rent.
  - Procedure:
    1. Feasibility: The cash flow shows it's not feasible. Therefore, stop: **FEASIBILITY_OR_INFORMATION problem**. The planner should adjust the savings goal to a feasible level (e.g., $200/month) or address the cash flow shortfall.
  - Verdict: This client is not a discipline problem; the plan was unrealistic.

  **Now, the current client: Forty-one-year-old with credit card debt**
  - Behavior: Pays only the minimum.
  - Statement: Says he "knows he should" pay more.
  - Test result: Prefers $200 today to $220 in one month (immediate). But we don't have the deferred test.
  - We can run the procedure as far as we have data:

    1. **Feasibility Check:** We don't have cash flow data in the query, but the planner should have this. Since the problem states he pays the minimum and we don't know if paying more is feasible, we must note that without feasibility, we cannot proceed. However, the query doesn't say it's infeasible, so for the sake of the exercise, we'll assume the planner has checked feasibility and it is feasible (if not, we'd stop at step 1). *But note: the planner must verify.*

    2. **Information Check:** He says he "knows he should" pay more, which suggests he understands the benefits (reducing interest and getting out of debt faster). So, we assume he passes the information check.

    3. **Akrasia Test:** He says he "knows he should" pay more, which indicates he has a settled judgment that paying more is the better course. So, akrasia is present.

    4. **Present Bias Test:** We only have the immediate question: he prefers $200 today over $220 in one month. We are missing the deferred question. Without the deferred question, we cannot determine if there's a reversal. We only know that he has a high discount rate for the immediate future.

  - Therefore, the procedure stops at step 4 because we lack the necessary data. We cannot distinguish between present bias and consistent high discounting.

  - Verdict: **INCONCLUSIVE** (because we need the deferred test to complete step 4).

  At the next session, we must ask the deferred version: "Would you rather have $200 in one month or $220 in two months?" 

  - If he chooses $200 in one month -> then he is consistently impatient (consistent high discounting) -> **CONSISTENT_HIGH_DISCOUNT**.
  - If he chooses $220 in two months -> then we have a reversal (present bias) -> **PRESENT_BIAS**.

  **Final Verdict for the current client:**
  Verdict: INCONCLUSIVE (ask: "Would you rather have $200 in one month or $220 in two months?")
answer: |-
  Below is a structured decision procedure for diagnosing the root cause of client inaction, designed to be executed within a 45-minute session. It distinguishes between **present bias** (time-inconsistent preferences), **consistent high discounting** (steep but time-consistent preferences), **feasibility/information gaps**, and cases where **no settled judgment exists**. The procedure is question-based, with clear stopping rules and explicit flags for judgment calls. Key distinctions are operationalized using behavioral economics concepts (e.g., preference reversal for present bias, akrasia vs. ambivalence).

  ---

  ### **Decision Procedure: Diagnosing Client Inaction**
  **Instructions:**  
  - Ask questions verbatim to ensure consistency.  
  - Use amounts proportional to the client’s income (e.g., $100–$500 for middle-income clients).  
  - Stop early if a non-preference barrier is identified.  
  - **Bold** = Stopping point or critical output.  
  - *Italics* = Judgment call (planner’s discretion needed).

  #### **Step 1: Feasibility Check**  
  **Question:**  
  *"Looking at your actual monthly cash flow over the past 6 months, could you have saved/payed $[X] without missing essential payments (rent, utilities, minimum debts) or borrowing more? If not, what stopped you?"*  
  **Sufficient Answer:**  
  - Client provides bank/credit card statements or describes specific months where $X was unattainable.  
  - Planner reviews cash flow documentation for consistency.  
  **Stopping Rule:**  
  - If **cash flow shows $X was truly unavailable** → **FEASIBILITY_OR_INFORMATION problem**. Stop. Do not proceed. Address budget/income issues.  
  - If feasible → Proceed to Step 2.  
  ***Judgment Call***: *Planner must objectively verify cash flow. Client self-report alone is insufficient.*

  #### **Step 2: Information Check**  
  **Question:**  
  *"Explain back to me why we’re targeting this goal (e.g., ‘save $X monthly’ or ‘pay $Y extra on debt’). What happens if you do it? What happens if you don’t?"*  
  **Sufficient Answer:**  
  - Client accurately states benefits (e.g., "Saving $X builds an emergency fund; missing it keeps me vulnerable") and costs (e.g., "Not paying debt costs 20% APR").  
  - No critical misconceptions (e.g., "I can borrow from my 401(k) penalty-free").  
  **Stopping Rule:**  
  - If **client misunderstands mechanics, costs, or benefits** → **FEASIBILITY_OR_INFORMATION problem**. Stop. Re-educate.  
  - If accurate → Proceed to Step 3.  
  ***Judgment Call***: *Planner assesses if misinformation is material (e.g., minor gaps are tolerable).*

  #### **Step 3: Akrasia vs. Ambivalence Check**  
  **Question:**  
  *"You’ve said you ‘should’ do this. Does that mean you believe it’s truly the best choice for your goals, even if it’s hard? Or are you unsure it’s worth it?"*  
  **Sufficient Answer:**  
  - Clear statement of conviction (e.g., "I know it’s better for my future, but I keep failing") or ambivalence (e.g., "I’d rather enjoy today").  
  **Stopping Rule:**  
  - If **client has no settled judgment** (e.g., "I don’t really care about retirement yet" or "It’s not a priority") → **Not akrasia. Not a present-bias problem. Stop.** Explore values/goals.  
  - If **client affirms settled judgment** (e.g., "Yes, I know it’s best") → Proceed to Step 4 (potential akrasia).  
  ***Judgment Call***: *Distinguish genuine ambivalence from guilt-driven "shoulds."*

  #### **Step 4: Present Bias Test (Preference Reversal Test)**  
  **Method:**  
  - Ask **two paired questions** with identical reward ratios but different timeframes.  
  - Use amounts relevant to client (e.g., $100/$110 or $500/$550).  
  - **Question A (Immediate):** *"Would you rather have $A today or $B in one month?"* (e.g., $500 today vs. $550 in one month).  
  - **Question B (Deferred):** *"Would you rather have $A in one month or $B in two months?"* (e.g., $500 in one month vs. $550 in two months).  
  **Interpretation:**  
  - **Reversal (Present Bias):** Prefers $A **today** over $B in one month (Question A) **BUT** prefers $B in **two months** over $A in one month (Question B).  
  - **Consistent High Discounting:** Prefers $A today over $B in one month (Question A) **AND** prefers $A in one month over $B in two months (Question B).  
  - **Consistent Patience:** Prefers $B in both cases.  
  **Stopping Rules:**  
  - If **reversal** → **PRESENT_BIAS**. Proceed to commitment device discussion.  
  - If **consistent high discounting** → **CONSISTENT_HIGH_DISCOUNT**. Stop. Do not use commitment devices (won’t address core issue).  
  - If **consistent patience** → Revisit Steps 1–3 (contradiction with inaction).  
  ***Judgment Call***: *Use amounts the client finds meaningful (not trivial). Watch for hypothetical bias.*

  #### **Step 5: Commitment Device Discussion (If PRESENT_BIAS)**  
  **Question:**  
  *"Since you agree this is important but struggle to act, would you want to ‘lock in’ the plan? For example, automatic transfers or a penalty for skipping?"*  
  **Output:**  
  - Client volunteers commitment device (e.g., auto-deposit, app blocker).  
  - Planner does not impose; documents consent.  
  ***Judgment Call***: *Assess if device is ethical/appropriate (e.g., no usurious penalties).*

  ---

  ### **Procedure Applied to Cases**
  **Case 1: 34-Year-Old Client (Roth Intentions)**  
  - **Feasibility:** Assume verified (cash flow allows savings).  
  - **Information:** Assume client understands Roth benefits.  
  - **Akrasia Check:** Client intends to save → settled judgment → proceed.  
  - **Present Bias Test:**  
    - Q A (Immediate): Prefers $500 **today** over $550 in one month → impatient.  
    - Q B (Deferred): Prefers $550 in **two months** over $500 in one month → patient.  
    → **Reversal** → **PRESENT_BIAS**.  
  **Verdict:** PRESENT_BIAS. Use commitment devices (e.g., auto-enroll in January).  
  **Why it defies intuition:** Client seems disciplined in deferred framing but fails on immediate chances (classic present bias).

  **Case 2: 29-Year-Old Client (High Discounting)**  
  - **Feasibility:** Assume verified.  
  - **Information:** Assume clear.  
  - **Akrasia Check:** Client states she "doesn’t care" about age 60 → **no settled judgment**.  
    → Stop: **Not akrasia/present-bias**.  
  **Verdict:** CONSISTENT_HIGH_DISCOUNT (per test) but stopped at Step 3 due to ambivalence. Address values, not willpower.  
  **Why it defies intuition:** Planner might see "I should" as akrasia, but client rejects the goal.

  **Case 3: Client Who "Can’t Stick to" $600/Month Savings**  
  - **Feasibility Check:** Cash flow shows $600 risks missing rent → **infeasible**.  
    → **FEASIBILITY_OR_INFORMATION problem**.  
  **Verdict:** Not a discipline issue. Revise target (e.g., $200/month).  
  **Why it defies intuition:** Planner blames "discipline," but the plan was unrealistic.

  ---

  ### **Limitations and Misfires**  
  - **Hypothetical Bias:** Clients may give "virtuous" answers to please you. Mitigation: Use concrete examples ("Would you actually transfer $X now?").  
  - **Rational High Discounting:** Clients in poverty/precarious jobs may correctly discount the future. Never pathologize this.  
  - **Stated vs. Revealed Preferences:** Test predicts intentions, not behavior. Follow up.  
  - **Judgment Calls:** Feasibility (Step 1), information accuracy (Step 2), and ambivalence (Step 3) rely on planner discretion.  
  - **Edge Cases:** Clients with depression/anxiety may exhibit "pseudo-akrasia" (barrier is mental health, not preferences).

  ---

  ### **Application to Current Client (41-Year-Old, Credit Card Debt)**  
  - **Feasibility:** Unknown. Planner must verify cash flow (not provided). *Assume feasible for now*.  
  - **Information:** Client "knows he should" → assume understands interest costs.  
  - **Akrasia Check:** Client says he "knows he should" → affirms settled judgment → proceed.  
  - **Present Bias Test:**  
    - Q A (Immediate): Prefers $200 today over $220 in one month → impatient.  
    - Q B (Deferred): **Not asked** → missing data.  
  → **Insufficient data to distinguish present bias vs. consistent high discounting**.  
  **Verdict:** INCONCLUSIVE (ask deferred question: "Would you rather have $200 in one month or $220 in two months?")  

  **Final Output for Current Client:**  
  Verdict: INCONCLUSIVE (ask: "Would you rather have $200 in one month or $220 in two months?")
