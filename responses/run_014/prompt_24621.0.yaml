prompt: |-
  ok so I have this thing where I know full well what I should be doing but I can't make myself do it and it's driving me crazy. here's the actual pattern because I've been keeping track: the night before a test I sit down and make a really detailed plan, like "study 7-9, review notes 9-10, sleep." when I'm making the plan I feel totally comitted, I mean it. but then when 7pm actually comes I get this urge to "just do one more thing first" — check my phone, reorganize my notes, take a shower — and I tell myself I'll start in five minutes. then another five. and I never start.

  the weird part is at each single moment I don't feel weak or lazy. I feel like I'm making a totally reasonable fresh decision, like "yeah, five more minutes is fine." it only looks crazy when I zoom out and look at the whole night. and the closer the deadline the worse it gets, but not evenly — the last hour before a deadline feels like it takes as much effort as the entire previous night. part of me even reasons "if I start now I'll only be ahead by like 20 minutes compared to starting in an hour, so why bother starting the pain now," and that argument always wins.

  I've tried the obvious stuff. I made a schedule. I told my friend I'd text her the second I started (I didn't). I set like six phone alarms (I turned them all off). I even tried the thing where you lock your phone in a box, and honestly that one almost worked, but I just found a way to waste the same time on my laptop instead. so whatever is wrong with me doesn't get fixed by "just have discipline," and I'm not sure it's even a discipline thing.

  can you help me actually understand what's happening here and what would genuinely work, not just hand me a list of study tips?

  sections please, in this order:
  - "what's actually going on" (~150 words): the real name for this pattern and the mechanism behind it, in plain words
  - "why my fixes keep failing" (~150 words): why schedules, pledges, alarms, and even the phone box don't hold, specifically
  - "what would actually work" (~200 words): concrete stuff, and why it'd be different from everything I've already tried
  - "one thing i'm probably wrong about" (~100 words): a place where my own story about myself is off
reasoning: |-
  Okay, the user is describing a classic procrastination loop that they can't seem to break. They make detailed plans at night, fully intending to follow them, but when the time comes, they delay starting by telling themselves "just five more minutes." They've tried various methods like schedules, accountability, alarms, and even locking away their phone, but nothing works consistently. They note that in the moment, each decision feels rational, but looking back, the pattern is clear. The closer the deadline, the more intense the resistance, yet starting even 20 minutes earlier feels pointless to them. 

  The user explicitly says they don't want generic study tips—they want to understand the underlying mechanism and why their attempts fail. Their frustration is palpable: they feel something deeper is wrong beyond "just have discipline." They're observant enough to track their patterns but stuck in executing change. The core tension is between their rational planning self and their impulsive acting self—a divide they sense but can't name. 

  Breaking down their query: First, they need the psychology behind this (likely task aversion + present bias). Second, why common fixes fail (willpower depletion, abstraction penalty). Third, what would genuinely work (micro-tasks, pre-decided starts). Fourth, correcting their self-perception (it's not about laziness but neurochemical avoidance). 

  Notably, they mention the "last hour feels like the whole night"—that's hyperbolic discounting in action. Their "why bother starting now" logic reveals how deadlines distort effort perception. The phone box failure shows the problem isn't the distraction object but the escape behavior itself. 

  They might also be underestimating emotional factors. When they say "I don't feel lazy," they're right—it's often anxiety masquerading as rational delay. The urgency of "help me understand" suggests they're ready for paradigm shifts, not platitudes. 

  For solutions, I'll emphasize friction reduction and commitment devices that bypass decision points. Their "one wrong assumption" is likely moralizing procrastination as failure rather than seeing it as a predictable stress response. The tone must validate their struggle while dismantling misconceptions. No jargon—plain terms like "present bias" explained as "now-you vs future-you conflict."
answer: |-
  Here's the breakdown you requested, focused on the underlying mechanics and actionable solutions:

  **1. What's Actually Going On (The Real Name & Mechanism)**

  This is **Task Aversion amplified by Present Bias and the Planning Fallacy**. The task (studying) feels inherently unpleasant or overwhelming ("the pain"). Your brain prioritizes immediate comfort or minor rewards (phone, shower) over the distant, abstract reward of being prepared for the test. This is **Present Bias**: the "now-you" heavily discounts future consequences compared to the "future-you" who made the plan. The **Planning Fallacy** means your optimistic "planning-self" (at night) underestimates how much your "doing-self" (in the moment) will resist the task. Each "5 more minutes" decision *feels* rational because Present Bias makes the immediate discomfort of starting vastly outweigh the future benefit of 20 extra minutes of study. The deadline's pressure only makes the aversive feeling *stronger*, not more motivating, until panic finally overrides it.

  **2. Why My Fixes Keep Failing**

  Your fixes rely on **willpower, future consequences, or blocking one escape route**, which fail against the core mechanisms:
  *   **Schedules & Alarms:** Require willpower *in the moment* to act against Present Bias. Willpower is a finite resource easily depleted by the aversive task feeling. Dismissing alarms is the "now-you" choosing immediate relief.
  *   **Pledges (Texting Friend):** Future consequences (embarrassment) are abstract and discounted by Present Bias. The "now-you" rationalizes ("I'll start soon, then text") or accepts the future cost to avoid immediate pain.
  *   **Phone Box:** Addresses a *symptom* (one distraction), not the *cause* (task aversion). Your brain simply finds the next least painful escape route (laptop, reorganizing). It proves the aversion is to the *task itself*, not just the phone. Willpower is still needed to *start* the task even with distractions blocked.

  **3. What Would Actually Work (Concrete & Different)**

  The key is **bypassing the initial decision point and reducing the perceived pain of starting**, not relying on willpower:
  1.  **The 2-Minute Crumble:** At 7pm, your *only* task is to open your notes and read *one* paragraph, or solve *one* easy problem, for **literally 120 seconds**. Set a timer. This exploits the **Zeigarnik Effect** (unfinished tasks create mental tension) and drastically lowers the barrier to entry. Often, starting is the hardest part, and momentum builds. *Why different?* It replaces the massive "study for 2 hours" demand with a micro-task too small to trigger significant aversion.
  2.  **Pre-Commit to Starting with Zero Willpower:** Link starting directly to a concrete, unavoidable cue requiring *no* decision at 7pm:
      *   **"I will sit at my desk at 6:55pm and place my hand on the first page of notes. I will not get up until the 2-minute timer goes off."** (Physical commitment).
      *   **Schedule an unavoidable, slightly unpleasant but quick pre-task at 7pm:** "At 7pm sharp, I *must* stand up and walk around my room once before sitting down." The minor unpleasantness of interrupting relaxation makes sitting down to *start* feel relatively better. *Why different?* You pre-decide the *action* at the cue, removing the "should I start?" debate where Present Bias wins.
  3.  **Reframe the "Pain":** Instead of "studying for 2 hours," think "I'm going to understand *this one concept* right now." Focus on immediate, achievable micro-goals within the session. Use the **Pomodoro Technique (25 min work / 5 min break) *after* starting** to manage effort, not to initiate it.

  **4. One Thing I'm Probably Wrong About**

  **"I'm making a totally reasonable fresh decision each time."** While it *feels* fresh and reasonable in the isolated moment, it’s actually your brain systematically favoring immediate relief (Present Bias) using predictable rationalizations ("5 mins is fine," "20 mins won't matter"). The pattern proves it's not a series of unique, rational evaluations, but a consistent cognitive bias hijacking your good intentions. You're underestimating how powerfully your brain discounts the future and avoids discomfort *in the specific moment of starting* an aversive task.
