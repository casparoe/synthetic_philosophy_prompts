answer: |-
  ### Pantoum: The Tathāgata After Death  

  "He exists," the disciples claim.  
  "He does not exist," others contend.  
  "He both exists and does not exist," some proclaim.  
  "He neither exists nor does not exist," whispers the wind.  

  "He does not exist," others contend.  
  When the flame extinguishes, where does the fire go?  
  "He neither exists nor does not exist," whispers the wind.  
  The path walked leaves no footprints in snow.  

  When the flame extinguishes, where does the fire go?  
  Dependent, empty, no-self to hold:  
  The path walked leaves no footprints in snow.  
  No position occupied, no truth to unfold.  

  Dependent, empty, no-self to hold:  
  "He exists," the disciples claim.  
  No position occupied, no truth to unfold:  
  "He both exists and does not exist," some proclaim.  

  ---

  ### Scholar's Note (192 words)  

  This pantoum enacts Nāgārjuna’s use of the tetralemma (*catuṣkoṭi*) to refute intrinsic nature (*svabhāva*) through form. Each horn recurs in shifting contexts:  
  - **Line 1 (exists)** and **Line 3 (both)** open and close the poem, but their final recurrence follows "no position occupied," undermining ontological commitment.  
  - **Line 2 (does not exist)** and **Line 4 (neither)** are juxtaposed with metaphors of cessation (extinguished flame, path in snow), highlighting their inadequacy.  

  **Settled**: Emptiness (*śūnyatā*) as dependent origination (*pratītyasamutpāda*) is canonical (MMK 24:18). Nāgārjuna rejects all four horns as reifying intrinsic nature (MMK 22:11, 25:17). The poem reflects this by letting each line’s meaning shift contextually (e.g., "He exists" first asserts a view, later becomes a relic of convention).  

  **Contested**:  
  1. **Paraconsistency**: The poem avoids implying any horn is *conventionally* true (e.g., "both" reappears amid "no position"), aligning with classical rejections over paraconsistent readings (e.g., Garfield vs. Priest).  
  2. **Metaphysics vs. Therapy**: Lines like "no truth to unfold" lean therapeutic (emptiness as antidote to reification), sidestepping debates about emptiness as a metaphysical truth.  
  3. **Emptiness of emptiness**: The cyclical return of horns after "dependent, empty" enacts non-abiding negation—refusing a fifth position without asserting negation itself.  

  The pantoum’s recursive form thus mirrors dependent origination: lines lack intrinsic meaning yet cohere through relational change.
