prompt: |-
  At a workshop on bounded rationality, someone kept deflecting technical objections by saying "the perfect is the enemy of the good." When a presenter showed that a satisficing heuristic performed worse than an optimizing procedure on a realistic computational budget, this person said the objection missed the point, because the whole lesson of bounded rationality is that the perfect is the enemy of the good. I want to push back but I need to first untangle what the slogan might actually mean here. Please lay out exactly five distinct precise claims that "the perfect is the enemy of the good" could be making in debates about satisficing and bounded rationality — from the trivially true to the substantive and dubious — and for each, say whether it would actually license dismissing a demonstration that a satisficing heuristic is outperformed. Give me exactly five numbered items, each a sentence or two, with no introduction or conclusion.
