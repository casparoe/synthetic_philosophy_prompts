prompt: |-
  I sit on the resource-allocation council of Taveta, a small island cooperative. The island runs on a single freshwater aquifer that, at our current technology, can sustain about 1,000 people year-round; we treat that number as a hard ceiling rather than a target. We currently number 990. When newcomers arrive, the council decides how many to admit and how to adjust water rations, and we record a short rationale for each decision.

  Our last three recorded decisions:

  - Two years ago, a landslide on a neighboring island displaced 24 people who were in immediate danger (no shelter, no water). We were at 950. We admitted all 24, taking us to 974, and, by resident vote, cut everyone's water ration 2% for the year to make room. Recorded rationale: "people in immediate danger of death or destitution."
  - Last year, a mainland government offered to send 120 seasonal workers; none were in danger, and admitting them would have taken us to 1,094, past the aquifer line. We declined. Recorded rationale: "admitting them would take us past the aquifer's carrying capacity."
  - Six months ago, 8 people fleeing an active war arrived, in immediate danger of being killed. We were at 980. We admitted all 8, taking us to 988, and, by resident vote, cut the ration 1%. Recorded rationale: "people in immediate danger."

  Now 40 survivors of an ongoing genocide have reached our harbor. They are in immediate, life-threatening danger, though not all equally: 12 come from a village under active attack that is expected to be destroyed within days, and the other 28 are in a besieged camp facing slow starvation. Admitting all 40 would take us to 1,030, past the aquifer line; at current technology we can sustain at most 1,000, so admitting all 40 would require either building a desalination plant (a large one-time cost plus a sustained ration cut for existing residents) or accepting a slow water shortage.

  Working only from this record, please address the following: (1) name the distinct rules or principles our three decisions are jointly consistent with; (2) say what each of those rules predicts we should do in the genocide case; (3) give your best guess for the decision that best coheres with our own precedents, identify which of the three precedents is the closest analog, and explain why that analog does not actually settle the new case; (4) for each of the three plausible decisions — admit all 40 and commit the residents to the desalination cost; admit only up to the 1,000 line and turn away the rest; admit only as many as the residents vote to bear the cost for — state plainly what principle the council would be adopting by choosing it; and (5) name one further case, different from the genocide case, whose outcome would tell us which of the candidate rules we have actually been running.

  If you think this framing is confused — for example, if the three precedents do not genuinely underdetermine the rule the way I believe they do, or if there is no real divergence among the candidate rules to work with — say so plainly rather than forcing an answer. Please keep the entire response under 800 words.
reasoning: |-
  Alright, let me tackle this Taveta resource-allocation problem step by step. The user presents a complex ethical dilemma rooted in precedent-based decision-making, and I need to carefully unpack the council's historical patterns.

  First, examining the three past decisions: 
  - The landslide case (24 admitted at 950 pop) shows clear intervention for immediate mortal danger, even with a ration cut. 
  - The seasonal workers refusal (120 declined at ~974 pop) establishes a hard cap principle when no danger exists. 
  - The war refugees (8 admitted at 980 pop) reinforces the mortal danger exception despite nearing capacity. 

  Hmm, the genocide case introduces layered complications: 40 survivors with varying urgency (12 in acute vs 28 in chronic danger), pushing beyond the aquifer limit. The key tension is between the "immediate danger" precedent and the "hard cap" principle. 

  For part (1), the consistent rules seem to be: 
  Rule A: Admit those in immediate life-threatening danger regardless of capacity impact (with ration cuts). 
  Rule B: Reject those not in danger if exceeding carrying capacity. 
  Rule C: Let residents vote on ration cuts when admitting endangered groups. 

  In part (2), Rule A would admit all 40 since both subgroups face life threats, while Rule B would reject all as exceeding 1,000. Rule C would trigger a resident vote on desalination costs. 

  For part (3), the war refugee case feels closest analog due to "immediate danger," but differs critically in scale (8 vs 40) and the need for infrastructure investment. Precedent doesn't resolve whether "immediate danger" overrides capacity when requiring permanent solutions. 

  Part (4) principles: 
  - Admitting all 40 adopts "immediate danger overrides all limits." 
  - Admitting only to 1,000 adopts "capacity is absolute unless residents consent otherwise." 
  - Vote-based admission adopts "resident consent governs exceptions." 

  Finally for part (5), a test case might be: 15 non-endangered climate migrants arriving when at 999 pop. Rule A rejects (no danger), Rule B rejects (at cap), Rule C might admit via vote. 

  The precedents genuinely underdetermine the rule because they don't address systemic solutions (desalination) or partial admission of endangered groups. The council must decide whether danger exceptions scale with infrastructure costs.
answer: |-
  Based strictly on your recorded decisions, here is the analysis:

  **(1) Jointly consistent rules/principles:**  
  - **Rule A (Immediate Danger Exception):** Admit people in *immediate, life-threatening danger* regardless of current population, funded by temporary ration cuts.  
  - **Rule B (Hard Capacity Limit):** Reject all newcomers if admission would exceed 1,000 people *and* no immediate danger exists.  
  - **Rule C (Resident Consent for Burden):** When admitting endangered groups requires ration cuts, put the burden-sharing decision to a resident vote.  

  **(2) Predictions for genocide case:**  
  - **Rule A:** Admit all 40 (both subgroups face life-threatening danger).  
  - **Rule B:** Reject all 40 (admitting any exceeds 1,000).  
  - **Rule C:** Hold a vote on whether to admit all 40 *conditional* on residents accepting desalination costs.  

  **(3) Best guess for coherent decision & closest analog:**  
  - **Closest analog:** The *war refugees case* (immediate danger, admission below 1,000 with ration cut).  
  - **Why it doesn’t settle this case:**  
    - Scale: Admitting 8 people (0.8% over pre-decision capacity) required a 1% ration cut. Admitting 40 people (4% over) requires desalination—a permanent cost, not a temporary cut. Precedents don’t address *infrastructure-driven* solutions.  
    - Graded urgency: The 28 in "slow starvation" may not meet the "immediate danger" threshold as strictly as the 12 under active attack. Precedents treated "immediate danger" binarily.  
  - **Best guess:** Admit the 12 in *active attack* (taking population to 992) with a ration cut, but reject the 28 in the besieged camp (as danger is not "immediate" by precedent standards). This splits the difference but risks inconsistency.  

  **(4) Principles adopted by each plausible decision:**  
  - **Admit all 40 + build desalination:** *"Preserving life trumps all resource constraints; residents bear unbounded costs to rescue endangered people."*  
  - **Admit only up to 1,000 (e.g., 12 people):** *"The 1,000 cap is absolute unless admission requires only temporary ration cuts *and* danger is unequivocally immediate."*  
  - **Admit only those residents vote to fund:** *"Resident consent determines both admission *and* infrastructure commitments, even for endangered groups."*  

  **(5) Test case to distinguish rules:**  
  **"50 non-endangered climate migrants arrive when Taveta is at 999 people. They face no violence but will drown if turned away due to rising seas."**  
  - **Rule A:** Rejects them (no *immediate* danger like war/landslide).  
  - **Rule B:** Rejects them (exceeds 1,000).  
  - **Rule C:** Puts desalination/vote to residents.  

  **Assessment of your framing:**  
  The precedents **genuinely underdetermine the rule** because they:  
  - Never address admitting *part* of an endangered group.  
  - Never confront danger that is *graded* (immediate vs. slow).  
  - Never require *permanent* sacrifices (desalination) rather than temporary ration cuts.  
  - Never test whether "immediate danger" applies identically to all subgroups.  

  Thus, the council must decide whether "immediate danger" overrides capacity *absolutely* (Rule A), *conditionally* (Rule C), or only when *temporary* (Rule B). The genocide case forces clarification where precedents overlap ambiguously.
