  We are designing an in-class betting game for graduate students to illustrate the difference between maximizing expected final wealth over a fixed short horizon and maximizing the long-run growth rate (via log utility). The game uses a biased coin (or card draw) with partially known probability. Participants first observe a sample, then repeatedly choose a fraction of their bankroll to bet.

  Key elements:
  - Biased coin: We'll use a coin that lands heads with probability p (unknown to students). We can simulate with a deck of cards (e.g., red/black) but with a known bias. For example, use a deck with 26 red and 30 black cards (so p(black)=30/56≈0.5357). Alternatively, a coin that is biased and we can flip it with a known mechanism (or use a computer simulation if available). Since it's in-class, a physical deck might be more tangible.

  Materials:
  - A deck of cards (with a known bias, e.g., 26 red, 30 black) or a biased coin (if available). We'll use cards for ease of showing the bias.
  - Paper and pencils for participants to record their bankroll and bets.
  - A whiteboard or projector to record the outcomes of each round and to show the initial sample.

  Setup:
  - Each participant starts with a bankroll of, say, $100 in play money.
  - The bet: They bet on the color of the next card drawn (with replacement? but without replacement changes the odds). We want the odds to be constant, so we must use replacement. However, shuffling and drawing without replacement for a deck of 56 cards might be acceptable for a small number of rounds (say 10 rounds) if we reshuffle when the deck is exhausted? Alternatively, we can simulate replacement by reshuffling after every draw. Let's do that: after each draw, the card is replaced and the deck reshuffled.

  Rules:
  1. Initial observation: Draw 5 cards (with replacement and reshuffling) to show a sample. Record the outcomes. Let the students see the outcomes and update their beliefs about p. (The true p for black is 30/56≈0.5357.)

  2. Betting rounds (10 rounds?):
     - At the beginning of each round, each participant writes down the fraction (between 0 and 1) of their current bankroll they wish to bet on either red or black. They also choose which color.
     - We assume all participants bet on the same color? But they might choose different colors. However, to simplify and focus on fraction, we can fix the bet on black (the favorable color) for everyone. Alternatively, let them choose. But note: if they choose the wrong color, they might go broke quickly and not experience the long-run effect. So we can force them to bet on the favorable outcome? Alternatively, we can tell them that the deck is biased and they have to figure out which way, but then we risk some betting on red. Let's instead tell them the deck is biased towards black (without giving p) and they must bet on black. This way, the lesson is about the fraction.

     So: Each round, each participant chooses a fraction f (0 ≤ f ≤ 1) of their current bankroll to bet on black at even money (if black comes up, they gain the amount bet; if red, they lose it).

  3. After they write down their bets, we draw a card (with replacement and reshuffling) and announce the outcome. Each participant updates their bankroll:
     - If black: new bankroll = old + f * old = old * (1 + f)
     - If red: new bankroll = old - f * old = old * (1 - f)

  4. We do 10 rounds.

  Twist: After 5 rounds, we stop and ask: "Now, what if we told you that the deck might have been shuffled with a different composition? Actually, we have two decks: one with 26 red and 30 black (p_black=30/56), and another with 30 red and 26 black (p_black=26/56). We flipped a coin to choose which deck to use. But we only drew the initial 5 from the chosen deck. So there's a 50% chance that the deck is actually biased against black (if we picked the other deck)."

  This twist introduces model uncertainty. We then continue for 5 more rounds. But note: we have already used the same deck for the first 5 rounds. So we cannot change the deck now. Instead, we can reveal that there was a chance of the deck being the unfavorable one, and then we continue with the same deck? But that doesn't change the true bias. Alternatively, we can say: "We have decided to change the deck for the remaining rounds to the other deck (the one with 30 red and 26 black)." But that would make the true p_black now 26/56≈0.464. This is a big twist and forces them to confront model misspecification and the possibility that their initial estimate was wrong.

  But note: we want to avoid real stakes, so we are using play money.

  Timeline (75 minutes):

  - Introduction (5 min): Explain the rules of the betting game. They start with $100. They will see 5 draws to get an idea of the bias. Then they will bet in 10 rounds. In each round, they choose a fraction of their bankroll to bet on black (we tell them the deck has more black cards? Actually, we don't tell them that. We let them observe and decide. But then they might bet on red. So we tell: "The deck is biased, but you don't know which way. You'll see 5 draws to form an estimate. Then in each round, you choose a color and a fraction.") However, if we don't fix the color, then the lesson on fraction might be lost for those who bet on the wrong color. So we can do:

    Option A: Let them choose the color each time. Risk: Some might bet against the true bias and lose quickly. Then they are out and don't get to experience the long run.

    Option B: We tell them the true bias is in favor of black and they must bet on black. This focuses the exercise on the fraction.

    I choose Option B: We tell them: "The deck is biased in favor of black. We will show you 5 draws. Then you will bet on black in every round. Your only decision is what fraction of your bankroll to bet." This avoids the color choice and focuses on the fraction.

    So: "The deck has more black cards than red. You'll see 5 draws. Then in each round, you must bet on black. You choose the fraction f of your current bankroll to bet. If black comes, you win f times your bankroll. If red, you lose that fraction."

  - Initial observation (5 min): Draw 5 cards (with replacement and reshuffling). Record the outcomes on the board. (We might get, say, 4 black and 1 red? But it's random.) Participants record the outcomes and form an estimate of p(black).

  - Round 1 to 5 (20 min): 5 rounds of betting. Each round:
      1. Participants write down their fraction f (kept secret until after the draw? or public? secret to avoid copying) and their current bankroll.
      2. We draw a card and announce the outcome.
      3. Participants update their bankroll.
      4. We record the outcome on the board and move to next round.

    We do this for 5 rounds. Each round takes about 4 minutes (writing bets, drawing, updating).

  - The twist (5 min): After round 5, we reveal: "Actually, there was a 50% chance that we used a deck with 30 black and 26 red, and 50% chance we used a deck with 26 black and 30 red. We flipped a coin to choose. The initial 5 draws were from the chosen deck. Now, we will reveal that the coin flip at the beginning chose the deck with 26 black and 30 red (the unfavorable one for black) OR we don't reveal which one was chosen? Instead, we say: we are going to switch to the other deck for the remaining rounds. So if we started with the favorable deck (30 black), we now switch to the unfavorable (26 black). If we started with the unfavorable, we switch to favorable? But we don't want to change the true bias arbitrarily. Alternatively, we can say: we are going to continue with the same deck, but now you know that there was a 50% chance that the deck is unfavorable. How does that change your betting?"

    Let's change the rules: We tell them that the deck was chosen at random: with 50% probability it was favorable (30 black) and 50% unfavorable (26 black). We have already drawn 5 cards and done 5 rounds with the same deck. They have seen 10 outcomes (5 initial and 5 rounds). Now, we will do 5 more rounds with the same deck. They must update their belief about which deck it is.

    This way, we introduce model uncertainty without changing the deck. They now have to consider that the true p might be 30/56 or 26/56. They can update their belief using Bayes.

  - Round 6 to 10 (20 min): Same as before, 5 more rounds.

  - Debrief (20 min): Discuss the outcomes.

  During the debrief, we will see that:
  - Some participants bet aggressively (high f) and might have grown fast initially but then crashed (especially if the deck was unfavorable or if they hit a losing streak).
  - Some bet conservatively and survived but with moderate growth.

  We will map to the concepts:

  1. The Kelly criterion: The optimal fraction for long-run growth is f* = p - q (for even money bet) = 2p-1. For the favorable deck (p=30/56≈0.5357), f*≈0.0714. For the unfavorable (p=26/56≈0.4643), the bet has negative expected value so f*=0 (don't bet). But note: after the twist, they are uncertain about p.

  2. Why a fraction above the long-run optimal fraction can have higher expected wealth for a small number of rounds yet lower expected log wealth?
     - Example: Suppose true p=0.5357, Kelly fraction f*=0.0714. If a student bets f=0.5, then after one bet:
          Expected wealth: p * (1+0.5) + (1-p) * (1-0.5) = 0.5357*1.5 + 0.4643*0.5 = 1.0357 (so expected wealth increases by 3.57%)
          Expected log wealth: p*log(1.5) + (1-p)*log(0.5) ≈ 0.5357*0.4055 + 0.4643*(-0.6931) ≈ 0.217 - 0.322 = -0.105 (so expected log wealth is negative, meaning the growth rate is negative in the long run)

     - After a small number of rounds, the expected wealth is higher for f=0.5 than for f=0.0714? Let's compute after one round:
          For f=0.5: E[wealth] = 1.0357
          For f=0.0714: E[wealth] = p*(1+0.0714) + (1-p)*(1-0.0714) = 0.5357*1.0714 + 0.4643*0.9286 ≈ 0.5739 + 0.4312 = 1.0051

          So indeed, after one round, the expected wealth for f=0.5 is about 103.57% of the initial, while for Kelly it's about 100.51%. But the log expectation is negative for f=0.5 and positive for Kelly? Actually, for Kelly, the expected log wealth is:
            p*log(1+f*) + (1-p)*log(1-f*) = p*log(1+2p-1) + (1-p)*log(1-(2p-1)) = p*log(2p) + (1-p)*log(2(1-p)) = p*(log(2)+log(p)) + (1-p)*(log(2)+log(1-p)) = log(2) + p*log(p) + (1-p)*log(1-p)
            For p=0.5357: log(2) + 0.5357*log(0.5357) + 0.4643*log(0.4643) ≈ 0.6931 + 0.5357*(-0.624) + 0.4643*(-0.767) ≈ 0.6931 - 0.334 - 0.356 ≈ 0.0031 (positive)

          So Kelly has positive expected log wealth, while f=0.5 has negative. Over many rounds, Kelly will grow, but f=0.5 will lead to ruin.

  3. Volatility and risk of ruin: Even with positive expected value, betting too high can lead to large drawdowns. For example, if f>2p-1 (in the favorable case) and you get a string of losses, you can go near zero. And then you have very little to bet with.

  4. Fractional Kelly: After the twist, they are uncertain about p. The true deck might be favorable or unfavorable. They should bet less than the Kelly fraction for the favorable case, or even zero if they believe it might be unfavorable. We can show how they should average over the possible models.

  What might go wrong:
  - Time: The rounds might take longer than expected. Solution: Keep strict time, and have a timer for each round.
  - Bankroll calculation: Some students might make arithmetic errors. Solution: Provide a calculator or a simple formula: new bankroll = old * (1 + f) if win, old * (1 - f) if loss.
  - The initial sample might be unrepresentative. For example, the 5 draws might show 1 black and 4 red, making them think the deck is unfavorable? But we told them it's biased in favor of black. This might confuse. We can say: "Remember, we told you the deck is biased in favor of black. But this sample is small and might be due to chance." Or we can fix the initial sample? But that would be cheating. Alternatively, we can do the initial sample without replacement? But we want the same p. Better to let it be random and then explain in debrief that estimation error is real.

  - In the twist, when we reveal the two possible decks, they might not know how to update. We can provide a quick Bayesian update example in the debrief.

  Debrief outline:

  1. Show the true composition of the deck used (reveal which deck it was). 
  2. Ask participants to share their final bankrolls and their betting strategies. Compare the highest and the most consistent.
  3. Discuss:
     a. Why did some strategies work in the first 5 rounds but then fail?
     b. The effect of volatility: show how two participants with the same average bet fraction but different sequences ended up.
     c. The risk of ruin: if someone bet 100% and lost, they were out.
     d. How did they adjust after the twist? Did they reduce their fraction? Why?

  4. Introduce the Kelly criterion (without naming it at first): the fraction that maximizes the expected log wealth. Then name it.

  5. Show the Kelly fraction for the favorable deck and for the unfavorable. For the unfavorable, the expected value is negative so Kelly says don't bet.

  6. Explain that after the twist, they don't know p. They have a posterior belief. The optimal fraction under uncertainty is a weighted average of the Kelly fractions for each possible deck? Actually, it's the fraction that maximizes the expected log wealth over the posterior. For two possible decks with equal prior, and after observing 10 outcomes (5 initial and 5 rounds), they can compute the posterior probability that the deck is favorable.

     Example: Suppose in the 10 draws, they saw k blacks. The likelihood for the favorable deck (p=30/56) is C(10,k) * (30/56)^k * (26/56)^{10-k}. Similarly for the unfavorable (p=26/56). Then the posterior probability of the favorable deck is:
          P(fav|data) = [ P(data|fav) * 0.5 ] / [ P(data|fav)*0.5 + P(data|unfav)*0.5 ]

     Then the optimal fraction is the one that maximizes:
          P(fav|data) * E[log(1+f)]_fav + P(unfav|data) * E[log(1+f)]_unfav
     where E[log(1+f)]_fav = (30/56)*log(1+f) + (26/56)*log(1-f)
     and similarly for unfav.

     This typically leads to a fraction lower than the Kelly fraction for the favorable deck.

  7. Conclude: For a fixed short horizon, maximizing expected wealth might lead to a higher fraction, but for repeated bets, maximizing the growth rate (log) is better. And when there is uncertainty, we bet less.

  Settled vs contested:

  Settled:
  - The Kelly criterion maximizes the long-run growth rate in repeated bets with known probabilities. (This is a mathematical fact under the assumptions of independent bets and fixed fraction betting.)
  - Betting more than the Kelly fraction leads to a higher risk of ruin and a lower growth rate in the long run, even if it may lead to higher expected wealth in the short run.
  - The expected log wealth criterion is equivalent to maximizing the geometric mean growth rate.

  Contested:
  - Whether Kelly betting is a normative standard or merely a consequence of log utility: Some argue that maximizing log utility is a specific risk preference (it corresponds to a utility function) and not necessarily the only rational choice. Others argue that in repeated bets, it is the only strategy that avoids ruin and maximizes growth in the long run. But note: for a one-time bet, log utility is just one utility function among many.
  - How to choose a fractional Kelly coefficient under ambiguity: There are various approaches (e.g., using Bayesian posterior, min-max, or other robust methods) and no consensus.
  - Whether finite-horizon expected-wealth maximization is a coherent alternative: In a fixed finite horizon, maximizing expected wealth is a well-defined objective. However, the optimal strategy for a fixed horizon is not necessarily to bet a fixed fraction (it may vary with time and current wealth). Moreover, it might lead to ruin with positive probability, which some find unacceptable.
  - How much weight to give to estimation error, model misspecification, and ruin: There is no consensus. Some advocate for fractional Kelly (e.g., half Kelly) as a heuristic to reduce risk. Others propose more complex models.

  In the activity, we cannot reproduce the long-run behavior because we only do 10 rounds. The facilitator must explain that in the long run, the Kelly fraction will dominate.

  Final game rules:

  Title: "The Biased Deck Betting Game"

  Materials:
  - One deck of 56 cards: 30 black, 26 red (or two decks: one with 30 black and 26 red, and one with 26 black and 30 red; but we will use only one deck for the whole game, and the twist is about revealing that we might have used the other deck).
