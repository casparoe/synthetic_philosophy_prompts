  - Record sheets for participants.

  Rules:
  1. Introduction: "We have a deck of cards with two colors: red and black. The deck is biased: it has more black cards than red. But you don't know exactly how many. You will see 5 draws to get an idea. Then, for 10 rounds, you will bet on black. In each round, you choose a fraction f (between 0 and 1) of your current bankroll to bet. If the next card is black, you win: your bankroll becomes bankroll + f*bankroll. If red, you lose: bankroll becomes bankroll - f*bankroll. The goal is to maximize your bankroll after 10 rounds."

  2. Initial observation: Shuffle the deck and draw 5 cards one by one, with replacement (after each draw, put the card back and reshuffle). Record the outcomes on the board.

  3. Rounds 1-5:
     - At the start of each round, participants write down their fraction f (they can use any fraction between 0 and 1, and they can change each round) and their current bankroll.
     - Draw a card and announce the color.
     - Participants update their bankroll: if they win, new_bankroll = bankroll * (1+f); if lose, new_bankroll = bankroll * (1-f).
     - Record the outcome and move to next round.

  4. The twist (after round 5): 
     - "Stop. Now, I must reveal: at the start, we flipped a coin to choose which deck to use. There were two possibilities: 
          Deck A: 30 black and 26 red (so P(black)=30/56≈0.5357)
          Deck B: 26 black and 30 red (so P(black)=26/56≈0.4643)
       We chose one of these two decks by a coin flip. The initial 5 draws and the first 5 rounds were from the chosen deck. We will continue with the same deck for the next 5 rounds. Now, how does this information change your betting? You have seen 10 outcomes: the initial 5 and the first 5 rounds. Use that to update your belief about which deck we are using."

  5. Rounds 6-10: Same as rounds 1-5.

  6. After round 10: Participants report their final bankroll.

  Debrief:
  - Reveal which deck was used (say, we used Deck A, the favorable one? or flip a coin to decide? Actually, we fixed it to one deck to avoid confusion. We should decide beforehand. Let's use Deck A for the entire game. Then the twist is about the uncertainty: they thought they knew it was favorable, but now they know it might be Deck B. But since we used Deck A, they will have seen 10 outcomes that were from Deck A. They might then assign a high posterior probability to Deck A. But if the outcomes were not very representative, they might still have doubt.
  - Compare strategies and outcomes.
  - Explain the Kelly criterion and the concept of growth optimality.
  - Discuss the effect of overbetting and underbetting, and the role of uncertainty.

  Note: We used Deck A throughout. The twist is a revelation of the setup, not a change in the deck. This is important so that the true p remains constant.

  This should fit in 75 minutes if we manage time strictly.
answer: |-
  ### In-Class Betting Game: "The Biased Deck Challenge"

  #### **Learning Objective**  
  Participants experience the tension between short-term expected wealth maximization and long-run growth optimization (via log utility) through repeated fractional betting on a partially known biased process. Key insights emerge from gameplay:  
  - Overbetting can boost short-term expected wealth but harm long-run growth.  
  - Volatility and near-ruin risk matter even with positive expected value bets.  
  - Uncertainty about true odds (estimation error/model misspecification) rationally reduces bet sizing.  

  ---

  #### **Materials**  
  - **Deck of Cards**: 40 cards total: 26 red, 14 black (true P(black) = 14/40 = 35% – *unknown to students*).  
  - **Play Money**: Each student starts with $100 in paper money.  
  - **Betting Slips**: Small cards for writing fractions (0–100%) each round.  
  - **Whiteboard**: Record outcomes and track sample draws.  
  - **Calculator (optional)**: For verifying bankroll updates.  

  ---

  #### **Rules**  
  1. **Initial Sample (Estimation Phase)**:  
     - Draw 5 cards *without replacement*, recording colors (e.g., 🔴⚫️⚫️🔴🔴).  
     - Students estimate P(black) from this sample.  

  2. **Betting Rounds**:  
     - **10 rounds** of betting on black. Each round:  
       - Students bet a **fraction** (0–100%) of their *current bankroll* on black.  
       - Even-money payoff: Win = +100% of staked amount; lose = −100%.  
       - Bankroll update:  
         - Win: `New = Current × (1 + fraction)`  
         - Lose: `New = Current × (1 − fraction)`  
     - Cards drawn **with replacement** (true P(black) = 35% fixed).  

  3. **The Twist (Model Misspecification)**:  
     - After **Round 5**, reveal: *"The deck might have been reshuffled from a pool with P(black) = 25% or 45% – I didn’t track which. Proceed with caution."*  
     - (True odds remain 35%, but this injects doubt about estimation accuracy.)  

  4. **Bankruptcies**:  
     - Bankroll < $1? Player "resets" to $10 (avoids disengagement).  

  ---

  #### **Timeline (75 Minutes)**  
  - **0:00–0:05** – Intro: Explain rules, distribute $100.  
  - **0:05–0:10** – **Sample Phase**: Draw/record 5 cards. Students estimate P(black).  
  - **0:10–0:30** – **Rounds 1–5**:  
    - Each round: 1 min to choose fraction, 1 min to draw/update, 1 min discussion.  
    - *Focus: Aggressive bettors likely lead; conservative ones trail.*  
  - **0:30–0:35** – **The Twist**: Reveal deck uncertainty.  
  - **0:35–0:55** – **Rounds 6–10**: Same as above.  
    - *Focus: Many reduce fractions; some go bankrupt despite positive EV.*  
  - **0:55–1:15** – **Debrief**: Connect gameplay to theory (detailed below).  

  ---

  #### **Predictably Goes Wrong & Fixes**  
  - **Problem**: Sample (5 draws) misleads (e.g., 3/5 black → P(black) ≈ 60% ≠ 35%).  
    - **Fix**: Acknowledge sampling error in debrief: "Short samples mislead; this mirrors real estimation risk."  
  - **Problem**: Winners get overconfident, bet >100% of Kelly (often bust in later rounds).  
    - **Fix**: Let bankrupt players reset to $10 – they experience volatility without quitting.  
  - **Problem**: Students "copy" leaders’ strategies.  
    - **Fix**: Secrete bets until after draws – forces independent thinking.  
  - **Unreplicable Element**: True long-run growth (10 rounds ≠ infinity).  
    - **Facilitator Must**: Simulate 100+ rounds of Kelly vs. overbetting (see debrief).  

  ---

  #### **Debrief: Connecting Gameplay to Theory**  
  1. **Short-Term vs. Long-Term Trade-off**:  
     - *Recall*: After Round 3, aggressive bettor (f=80%) had $180; Kelly bettor (f=10%) had $105.  
     - *Math*: For P(win)=35%, EV-maximizing f=100% (if EV>0). But:  
       - Expected final wealth (10 rounds): Higher for f=80% vs. f=10%.  
       - Expected log wealth: Negative for f=80% (since 0.35×ln(1.8) + 0.65×ln(0.2) ≈ −0.47), positive for f=10% (0.35×ln(1.1) + 0.65×ln(0.9) ≈ +0.004).  
     - *Insight*: High f wins short-term EV contests but guarantees long-run ruin (log → −∞).  

  2. **Volatility & Near-Ruin**:  
     - *Recall*: Player A (f=70%) hit $6 in Round 6 after 3 losses.  
     - *Math*: Probability of halving bankroll in 10 rounds: <1% for f=10%; >50% for f=70%.  
     - *Insight*: Kelly maximizes median wealth; overbettors risk "gambler’s ruin" despite positive EV.  

  3. **Fractional Betting Under Uncertainty**:  
     - *Recall*: After the twist, most cut f (e.g., 40% → 20%).  
     - *Math*: True Kelly f* = (p_win − p_lose) = 2p−1 = −0.3 (since p=35%<50%) – but students estimated p>50% from flawed sample. Optimal f=0!  
     - *Insight*: Betting less than full Kelly (even f=0) is rational under model doubt, not "risk aversion."  

  4. **Name the Criterion**: Reveal "Kelly criterion" as max E[log(wealth)] ≈ max geometric growth.  

  ---

  #### **Settled vs. Contested in Decision Theory**  
  | **Topic** | **Settled Consensus** | **Contested Views** |  
  |-----------|------------------------|---------------------|  
  | **Kelly as Normative Standard** | Not inherently normative. It maximizes asymptotic growth rate *if* you maximize log utility. | Whether log utility is "rational" for wealth: Some argue it’s too aggressive (short-term ruin risk) or too conservative (ignores other utilities). |  
  | **Fractional Kelly under Ambiguity** | Full Kelly is too aggressive under model uncertainty. Fractional Kelly (e.g., ½f*) reduces risk. | How to set the fraction: Bayesian updates vs. minimax robustness vs. heuristic rules (e.g., "never bet >2%"). |  
  | **Finite-Horizon Expected Wealth Maximization** | Coherent for fixed horizons. Optimal strategy is non-fractional (depends on time/wealth). | Relevance in practice: Critics argue true horizons are unknown, making growth-rate optimization safer. |  
  | **Weight on Estimation Error/Ruin** | All agree estimation error demands smaller bets. Ruin risk must be bounded (e.g., via fractional Kelly). | How much weight? Frequentists favor confidence intervals; Bayesians favor priors; some demand zero ruin risk. |  

  **Key Takeaway for Students**:  
  - Kelly formalizes long-run growth but requires precise odds.  
  - Real-world uncertainty (estimation/model risk) pushes rational actors toward fractional Kelly – *even if they are risk-neutral in the long run*.
