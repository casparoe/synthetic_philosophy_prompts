prompt: |-
  I've been reading about Bell's theorem on my own and my friend is way deeper into the foundations stuff than me. She's got firm verdicts on which interpretations are "local": Bohmian mechanics, nonlocal, no question, because the velocity of a particle here depends on where all the others are at the same instant, so it needs a privileged now. GRW-type collapse, nonlocal, same reason. Many-worlds, local, no collapse just the wavefunction evolving smoothly. Superdeterminism, local — she despises it but says its sin isn't locality, it's what it does to the idea that our choice of measurement setting is free. Retrocausal versions where the influence runs backwards instead of sideways: local, just wierd. And textbook quantum mechanics with collapse in the recipe: nonlocal.

  I care less about whether she's right than about which rule she's actually running. Give me the candidate rules that fit all six of those verdicts — I've already worked out it can't be "does it let you signal faster than light", since none of them do. Then here's the case I want to predict: a collapse theory where the collapses are just random points sprinkled through spacetime, and the law for where they land is written so that every inertial observer agrees on it, no privileged now anywhere, but the odds of a collapse happening in my lab still depend on what happens in the other, spacelike-separated lab, in a way you provably can't send a message with. Would she call that local or nonlocal? Which rules say which, what's your best guess and why, and what one further case would separate the rules that come apart on this one?
reasoning: |-
  Okay, let's tackle this user's query. They're deep into Bell's theorem and interpretations of quantum mechanics. Their friend has specific classifications for what's local or nonlocal across different interpretations. The user wants to know the underlying rule their friend is using, especially for a hypothetical collapse theory with random spacetime collapses.

  First, I need to recall the friend's verdicts: Bohmian and GRW are nonlocal because of instantaneous dependencies, Many-Worlds and superdeterminism are local, retrocausal is local but weird, and textbook QM with collapse is nonlocal. The user already knows it's not about faster-than-light signaling since none allow that.

  The key here is differentiating between formal locality (no FTL signals) and ontological locality. The friend's rejections of Bohm and GRW focus on instantaneous influences, even if they don't enable signaling. That points to a criterion based on the absence of spacelike-separated dependencies in the physical state's evolution. 

  For the hypothetical case, collapses are sprinkled in spacetime without a privileged frame, but probabilities depend on spacelike-separated events. Since the collapse mechanism has dependencies across spacelike intervals, the friend would likely call it nonlocal. Their rule seems to be about ontological locality—no spacelike dependencies in the dynamics, even if hidden.

  Further test cases could involve retrocausal models with bidirectional dependencies versus those with only past influences. If the friend accepts models where future choices affect past states without spacelike separation, that would confirm she's using a time-symmetric criterion. Alternatively, a superdeterministic model with initial state dependencies might still be considered local by her, emphasizing the distinction between initial conditions and dynamics.
answer: |-
  Based on your friend's verdicts, the underlying rule she's using is **ontological locality (no spacelike dependence in the fundamental dynamics)**, distinct from **operational locality (no superluminal signalling)**. Here's the breakdown:

  **The Rule:**
  *   **Ontological Locality:** A theory is local if the *fundamental physical state* at any point and its *immediate evolution* depend *only* on the physical state in its *past light cone* (or a local neighborhood defined by a Lorentz-invariant structure). Crucially, there must be *no dependence at a fundamental level* on spacelike-separated events *or* on a privileged global "now".
  *   **Key Distinction:** This focuses on the *causal structure* and *dependencies* in the *ontology* (what the theory says *exists* and how it *changes*), not just on whether signalling is possible.

  **Applying the Rule to Her Verdicts:**
  1.  **Bohmian Mechanics:** Nonlocal. The quantum potential/guidance equation makes the *velocity* of a particle *here* depend *instantaneously* on the positions of *all* particles *everywhere*, requiring a privileged "now". (Violates ontological locality).
  2.  **GRW Collapse:** Nonlocal. The *collapse* event *here* instantaneously affects the wavefunction *everywhere*, altering the physical state at spacelike separation instantly. (Violates ontological locality).
  3.  **Many-Worlds:** Local. The wavefunction evolves *only* via the local Schrödinger equation (`iħ d|ψ>/dt = H|ψ>`). While the wavefunction itself is global, its *evolution* at any point depends *only* on the local Hamiltonian density (a local operator), respecting relativistic locality. There is no nonlocal *change* or dependence. (Satisfies ontological locality).
  4.  **Superdeterminism:** Local. The correlations are "explained" by initial conditions set at the Big Bang. The *dynamics* governing the evolution from that initial state are local (e.g., local deterministic equations). The nonlocal *correlation* is pre-programmed, not caused by nonlocal *influence* during the experiment. (Satisfies ontological locality, though she dislikes it for other reasons).
  5.  **Retrocausal Models:** Local (but weird). Influence travels *backwards in time* along the *past light cone*. The state *here and now* depends on events in its *future light cone*, but crucially *not* on spacelike-separated events. The dependencies stay *within* light cones. (Satisfies ontological locality - backwards causation is weird but not spacelike).
  6.  **Textbook Collapse:** Nonlocal. The *act* of measurement/collapse *here* instantly collapses the wavefunction *everywhere*, altering the physical state at spacelike separation. (Violates ontological locality).

  **Your Hypothetical Collapse Theory:**
  *   **Collapses:** Randomly sprinkled in spacetime.
  *   **Law:** Lorentz-invariant (all inertial observers agree).
  *   **Dependence:** Probability of a collapse in Lab A depends on events in spacelike-separated Lab B (but no signalling possible).
  *   **Your Friend's Likely Verdict: NONLOCAL.**

  **Why:**
  *   The fundamental *dynamics* (the law governing *where and when collapses happen*) explicitly depends on events *outside* the past light cone of the potential collapse event.
  *   This is a spacelike dependence *in the fundamental laws*, even if the sprinkling law itself is Lorentz-invariant and doesn't allow signalling. Ontological locality requires that the *cause* or *determining factor* for a local event (like a collapse happening *here*) resides within its past light cone. Here, events in Lab B (spacelike separated) are influencing the *probability* of an event in Lab A.
  *   The Lorentz invariance of the sprinkling law ensures all observers agree on the *pattern* of collapses, but it doesn't remove the *spacelike dependence* encoded within the law itself. It just makes that dependence frame-independent.
  *   This directly parallels why she rejects GRW: the collapse mechanism has nonlocal dependencies. Yours is a Lorentz-invariant version of this nonlocal dependence.

  **Separating Further Rules:**
  The main alternative rule that *might* classify your hypothetical theory as local is a stricter focus on **operational locality only** ("No FTL signalling possible"). Since your theory forbids signalling, it would be "local" under this rule.

  **One Further Case to Separate Them:**
  Consider a **Retrocausal Model with Spacelike "Echoes":**

  *   **Setup:** A retrocausal model where a measurement choice at time `t` in Lab A sends influences *backwards* in time along its past light cone. However, suppose the model also includes a mechanism where this backwards-in-time influence, upon reaching some point in the *common past* of Labs A and B, generates a secondary influence that propagates *forwards* along the future light cone of that point, reaching spacelike-separated Lab B *before* Lab B makes its choice. This secondary influence subtly biases the probabilities of outcomes at Lab B *without* enabling signalling back to Lab A.
  *   **Analysis:**
      *   **Operational Locality Rule (Signalling):** No FTL signalling is possible. The influences travel along light cones (backwards then forwards). Verdict: *Local*.
      *   **Ontological Locality Rule (No Spacelike Dependence):** The outcome at spacelike-separated Lab B depends *at the time of the Lab B measurement* on the *already-made* choice at Lab A via a spacelike path (the secondary forward-in-time influence). Verdict: *Nonlocal*. (This secondary influence constitutes a spacelike dependence).
  *   **Why it Separates:** Your friend, using ontological locality, would call this "echo" model nonlocal because of the final spacelike link in the causal chain influencing the state at B. Someone using *only* the operational locality (signalling) rule would still call it local.

  **Conclusion:**
  Your friend is using **ontological locality (no spacelike dependence in the fundamental dynamics)**. Based on this, she would almost certainly classify your Lorentz-invariant but probabilistically dependent collapse theory as **NONLOCAL**. The key distinction is the presence of spacelike dependencies in the fundamental laws, even if they are Lorentz-covariant and don't enable signalling. The further case of the retrocausal model with spacelike "echoes" cleanly separates her rule from a pure "no signalling" rule.
