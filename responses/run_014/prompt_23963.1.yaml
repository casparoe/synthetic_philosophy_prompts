prompt: |-
  ok so my forecasting group has been at each others throats for like a year now and i finally want to force them to write the document they should have produced at the start. one side is the conformity crowd — they think your credence should always match what you take to be your best evidence, that higher-order evidence (evidence about how reliable you actually are) is a real independent reason to move, and that rational epistemic akrasia is basically impossible. the other side is the lock-in / enabling crowd — they think higher-order evidence mostly works by changing how much weight you give your first-order reasons instead of adding a brand new reason, that in a bunch of cases you should just keep your belief, and that rational akrasia is realy a live option.

  can you draft the joint statement they could both actually sign? i want the claims both camps accept about what higher-order evidence even is and about what the drinking case, the expert case, and the peer-disagreement case actually involve; then the precise statement of where they still disagree, phrased so each side would accept the wording of their own position (not a caricature); then the cruxes, the sub-questions such that settling one would move at least one camp; and for each crux a concrete case both sides agree bears on it, with each side's prediction written down in advance.

  and here's the part i really want you to commit on instead of hedging: tell me which of their disagreements you think is actually verbal (just different words for the same thing) and which are substantive, pick the single crux you think is the real one — the one that, if settled, would actually make one side drop their position — and for that crux don't just lay out both sides' predictions, take a definite bet on which side you think is right and say why. format it as a numbered list of agreed claims first, then a table of the disagreements with columns for the crux, the case that bears on it, the conformity side's prediction, and the lock-in side's prediction.
