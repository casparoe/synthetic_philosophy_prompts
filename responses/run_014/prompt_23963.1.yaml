  We are drafting a joint statement for two groups in a forecasting group: the "conformity crowd" and the "lock-in / enabling crowd". The goal is to have a document that both can sign, which includes:
  1. Agreed claims about what higher-order evidence (HOE) is and about key cases (drinking case, expert case, peer disagreement).
  2. A precise statement of where they disagree, worded so each side accepts their own position.
  3. Cruxes (sub-questions that, if settled, would move at least one camp) and for each crux a concrete case that both sides agree bears on it, with each side's prediction written in advance.
  4. My (the assistant's) commitment: 
     a. Identify which disagreements are verbal vs. substantive.
     b. Pick the single crux that I think is the real one (if settled, would make one side drop their position).
     c. For that crux, take a definite bet on which side is right and say why.

  Format:
  - Numbered list of agreed claims.
  - Table of disagreements (with columns: Disagreement, Crux, Case that bears on it, Conformity side's prediction, Lock-in side's prediction).
  - Then, my analysis: verbal/substantive, pick the real crux, and take a stand.

  Let's break down the key areas of agreement and disagreement based on the description.

  **Agreed Claims** (both sides accept):

  1. **Definition of Higher-Order Evidence (HOE)**: Higher-order evidence is evidence about the reliability of one's own cognitive processes, or about the quality of one's first-order evidence or reasoning. It is evidence that bears on the question of how likely it is that one has made a mistake in forming a first-order belief.

  2. **The Drinking Case** (from the literature, e.g., Christensen): 
     - Scenario: An individual has carefully considered a complex problem and formed a confident belief. Then, they learn they have ingested a drug that impairs reasoning in 50% of subjects (but they don't know if they are impaired). 
     - Both sides agree that this is a paradigmatic case of HOE and that it should lead to a reduction in confidence. However, the conformity side sees this as a direct reason to lower confidence, while the lock-in side sees it as affecting the weight of the first-order reasons.

  3. **The Expert Case** (e.g., Elga's example of the chess players):
     - Scenario: A non-expert is trying to decide which of two chess moves is better. Initially, they have a belief. Then, they learn that a chess expert disagrees with them.
     - Both sides agree that the non-expert should defer to the expert. But again, the conformity side sees the expert's opinion as a direct reason to change belief, while the lock-in side sees it as affecting the weight of the first-order reasons (so the non-expert now gives less weight to their own assessment).

  4. **The Peer-Disagreement Case** (e.g., equal evidence, same competence):
     - Scenario: Two epistemic peers, who have always been equally reliable in the past, share the same first-order evidence and then come to different conclusions. They then learn of the disagreement.
     - Both sides agree that peer disagreement should lead to some adjustment (at least in standard cases). But the conformity side takes the disagreement as direct reason to move toward the peer, while the lock-in side may see it as a reason to reduce confidence in their own reasoning without necessarily fully splitting the difference.

  **Disagreements** (stated neutrally and accepted by each side as their own position):

  1. **Nature of HOE**:
     - Conformity: HOE provides a new, independent reason to adjust one's credence. It is a direct reason to change belief.
     - Lock-in: HOE primarily works by changing the weight we assign to our first-order reasons. It doesn't add a new reason but modulates the existing ones.

  2. **Rational Akrasia**:
     - Conformity: Rational epistemic akrasia (holding a belief while believing that it is irrational) is impossible. Rationality requires that one's credence matches what one takes to be the total evidence.
     - Lock-in: Rational akrasia is a live option. Sometimes, it can be rational to believe P while also believing that one's evidence does not support P.

  3. **Response to HOE in specific cases**:
     - Conformity: In cases of peer disagreement, one should split the difference. In the drinking case, one should significantly reduce confidence. In the expert case, one should defer completely.
     - Lock-in: In some cases, one can maintain one's belief (though with reduced confidence) and in others, one might not need to move as much. They emphasize that sometimes the first-order reasons are "locked in" and the HOE doesn't override them.

  **Cruxes** (sub-questions that, if settled, would move at least one side):

  We need to identify questions that are at the heart of the disagreement. Possible cruxes:

  1. **Does HOE always provide a direct reason to adjust credence?** 
     - Case: A variant of the drinking case where the subject has a very strong first-order reason (e.g., a simple mathematical truth). 
     - Conformity: Even in such a case, the HOE should lead to some reduction in confidence (they might still be very confident, but not 100%).
     - Lock-in: The HOE might not change the credence at all because the first-order reason is so strong that it cannot be overridden.

  2. **Is rational akrasia possible?**
     - Case: The "unmarked clock" case (from Williamson) - an agent looks at an unmarked clock and forms a belief about the time, but then learns that the clock is broken and gives random times. However, the agent's visual experience (which is the first-order evidence) still seems to support the belief about the time.
     - Conformity: The agent should not believe the time they see; they should suspend judgment. They cannot rationally hold the belief and also believe that the evidence doesn't support it.
     - Lock-in: The agent might rationally hold the belief about the time (because they can't help but form it) while also believing that the evidence is unreliable. This is a case of rational akrasia.

  3. **Does HOE always override first-order evidence?**
     - Case: A case where the HOE is misleading. For example, in the peer disagreement, what if the peer is actually wrong? 
     - Conformity: Even if the peer is wrong, the rational response to the disagreement (without knowing who is wrong) is to reduce confidence. The HOE is about the reliability of one's own process, so it always has a direct effect.
     - Lock-in: In some cases, if one has very strong first-order reasons, one might not move much, even if the HOE suggests one should. They might argue that the HOE doesn't always override.

  But note: the lock-in side might say that in the case of a simple mathematical truth, the HOE (like being drugged) doesn't change the fact that 2+2=4. So they would maintain full belief. The conformity side would say that even then, one should be slightly less confident (because the drug might make one misread the symbols, etc.). So this is a crux.

  **My Task**:

  - **Verbal vs. Substantive**: I think the disagreement about the "nature of HOE" (whether it provides a direct reason or modulates weight) might be partly verbal. Both sides agree that HOE affects the credence, but they describe the mechanism differently. However, the implications for akrasia and the degree of belief revision are substantive.

  - **The Real Crux**: I believe the crux about whether rational akrasia is possible is the deepest one. Because if akrasia is rational in some cases, then the lock-in side is right that one can hold a belief while believing that one's evidence doesn't support it. This would undermine the conformity side's core principle.

  - **Taking a Stand**: I will argue that rational akrasia is not possible. My reason: Epistemic rationality requires that one's beliefs are properly responsive to the evidence one takes oneself to have. If one believes that the total evidence does not support P, then holding P would be a violation of that requirement. The akratic state is inherently unstable and self-undermining. In the unmarked clock case, the rational response is to suspend judgment, not to hold the belief while also believing it's unsupported.

  However, note that the lock-in side might have a point in cases of non-ideal agents (like humans) who cannot instantly update. But the question is about what is rationally required, not psychologically possible.

  **Proposed Joint Statement Structure**:

  I. Agreed Claims (numbered list)

  II. Disagreements (table)

  III. Cruxes (in the table)

  IV. My Analysis (after the table)

  Now, let's draft:

  **Joint Statement on Higher-Order Evidence**

  **I. Agreed Claims**

  1. Higher-order evidence (HOE) is evidence about the reliability of one's own cognitive processes, the quality of one's first-order evidence, or the correctness of one's first-order reasoning.

  2. In the drinking case (where an agent learns they might be impaired by a drug that affects reasoning in 50% of subjects), the agent should reduce their confidence in their first-order belief.

  3. In the expert case (where a non-expert learns that an expert disagrees with their assessment), the non-expert should reduce their confidence and defer to the expert's judgment.

  4. In the peer-disagreement case (where two epistemic peers, who have been equally reliable in the past and have the same first-order evidence, disagree), the discovery of the disagreement should lead to some reduction in confidence and adjustment toward the peer's view.

  **II. Disagreements and Cruxes**

  We present the current disagreements in a way that both sides endorse as their own position. For each, we identify a crux and a case that both sides agree bears on that crux, along with each side's prediction.

  | Disagreement                                                                                                | Crux                                                                                                 | Case that bears on it                                                                                                                                 | Conformity Side's Prediction                                                                                                                                 | Lock-in Side's Prediction                                                                                                                               |
  | :---------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of HOE**: Does HOE provide a new, independent reason to adjust credence, or does it merely change the weight assigned to first-order reasons? | Does HOE always have a direct effect on credence, even when first-order evidence is extremely strong? | **Case A: Simple Math on a Drug.** An agent is given a drug that causes severe cognitive impairment in 50% of subjects. The agent then considers a simple arithmetic problem (e.g., 2+2=4) and forms a belief. They then learn about the drug. | The agent should reduce confidence in their belief (e.g., from 100% to something less, say 99%), because the HOE about potential impairment is a direct reason to doubt even simple beliefs. | The agent can maintain full confidence (100%) because the first-order evidence (the simplicity of the math) is so strong that the HOE does not require any adjustment. |
  | **Rational Akrasia**: Is it rational to hold a belief while believing that the belief is irrational? | Can there be a situation where it is rational to be in an akratic state? | **Case B: Unmarked Clock.** An agent looks at an unmarked clock that they don't know is broken. The clock shows 3:00, and the agent forms the belief that it is 3:00. They then learn that the clock is broken and has been showing a random time for the past hour. | The agent should suspend judgment about the time. They cannot rationally hold the belief that it is 3:00 while also believing that their evidence (the broken clock) does not support that belief. | The agent might rationally retain the belief that it is 3:00 (because they have no other evidence) while also believing that the evidence doesn't support it. This is a rational akratic state. |
  | **Degree of Belief Revision**: In cases of HOE, must one always move one's credence significantly, or can one sometimes hold one's belief with minimal adjustment? | In peer disagreement, can one maintain one's initial credence if the first-order evidence is very strong? | **Case C: Peer Disagreement on a Simple Matter.** Two peers with a long history of reliability have the same evidence about a simple fact (e.g., the outcome of a coin flip they both observed). They disagree: one says heads, the other tails. | Both peers should significantly reduce confidence and move toward 50% (total suspension). The HOE (the peer's disagreement) is a direct reason to think one might be wrong. | The peers might be able to maintain their initial belief (with some reduction, but not to 50%) because the first-order evidence (their own clear observation) is strong. |

  **III. My (Assistant's) Analysis**

  1. **Verbal vs. Substantive Disagreements**:
     - The disagreement about the **nature of HOE** (whether it provides a new reason or modulates weight) is partly verbal. Both sides agree that HOE affects the credence, and the difference in description might not lead to different predictions in all cases. However, it becomes substantive when we consider the mechanism and implications for akrasia.
     - The disagreements about **rational akrasia** and the **degree of belief revision** are substantive.

  2. **The Real Crux**:
     - I believe the crux about **rational akrasia** (Case B: Unmarked Clock) is the deepest and most central. If it can be shown that rational akrasia is possible, then the lock-in side's position gains strong support. If not, the conformity side's core principle stands.
     - Why this crux? Because the possibility of rational akrasia directly challenges the conformity side's view that rationality requires coherence between one's beliefs and one's beliefs about rationality. If akrasia is rational, then the lock-in side can justify holding beliefs even when HOE suggests they are unreliable.

  3. **Taking a Stand on the Real Crux**:
     - I bet that the **conformity side is correct** about the unmarked clock case: rational akrasia is impossible.
     - Why? 
       - Holding a belief while simultaneously believing that the belief is irrational creates a self-defeating state. The belief that "P is irrational" is a higher-order belief that, if taken seriously, should prevent the rational agent from holding P. 
       - In the unmarked clock case, the rational response is to suspend judgment about the time. The agent should not believe that it is 3:00 because they know the clock is broken and thus their visual experience is not evidence for the time. To hold the belief would be to ignore their own higher-order evaluation.
       - This position aligns with the idea that rationality requires your beliefs to be properly based on the evidence you take yourself to have. If you take yourself to have no good evidence for P, then believing P is irrational.

  This joint statement and analysis should help focus the debate on the key issues and encourage empirical testing or further philosophical investigation on the cruxes.
answer: |-
  ### Joint Statement on Higher-Order Evidence and Disagreements  
  **Agreed upon by both the Conformity and Lock-In/Enabling Groups**  

  #### I. Agreed Claims  
  1. **Definition of Higher-Order Evidence (HOE)**:  
     HOE is evidence about the quality, reliability, or limitations of one’s first-order evidence or reasoning process. It does not directly bear on the truth of the first-order claim but on the trustworthiness of one’s evaluation of that claim.  

  2. **The Drinking Case (Christensen-style)**:  
     - *Scenario*: An agent forms a first-order belief (e.g., "2 + 2 = 4") after careful reasoning. They then learn they ingested a drug that causes severe cognitive impairment in 50% of people, with no way to determine if they are impaired.  
     - *Agreed Interpretation*: The drug evidence is HOE that should reduce the agent’s confidence in their first-order belief. Both sides accept this as a paradigm case where HOE warrants belief revision.  

  3. **The Expert Case (Elga-style)**:  
     - *Scenario*: A non-expert forms a first-order belief (e.g., "Move A is best in this chess position"). They then learn that a trusted expert disagrees with them.  
     - *Agreed Interpretation*: The expert’s disagreement is HOE that should reduce the non-expert’s confidence in their belief. Both sides agree the non-expert must defer to the expert’s judgment.  

  4. **The Peer-Disagreement Case (Equal-Weight View Base)**:  
     - *Scenario*: Two epistemic peers with identical first-order evidence and track records form conflicting beliefs (e.g., Peer A: "Climate policy X is effective"; Peer B: "Climate policy X is ineffective"). They then discover their disagreement.  
     - *Agreed Interpretation*: The disagreement is HOE that should lead both peers to reduce confidence in their original beliefs. Both sides accept that some belief revision (e.g., moving toward agnosticism) is rationally required.  

  5. **Core Rationality Principle**:  
     Rational agents must respond to HOE; ignoring it entirely is epistemically irresponsible. HOE can arise from internal sources (e.g., fatigue) or external sources (e.g., disagreement).  

  ---

  #### II. Disagreements, Cruxes, and Predictions  
  The table below states disagreements in neutral terms each side endorses. Each row includes:  
  - **Disagreement**: Precisely worded positions accepted by each camp.  
  - **Crux**: The sub-question that, if resolved, would force one side to reconsider their view.  
  - **Case that bears on crux**: A novel, concrete scenario both sides agree tests the crux.  
  - **Predictions**: Each camp’s forecasted outcome for the case.  

  | Disagreement                                                                                                                               | Crux                                                                                                                                 | Case that Bears on Crux                                                                                                                                                                                                                                                                                                                               | Conformity Side’s Prediction                                                                                                                                                                                                 | Lock-In Side’s Prediction                                                                                                                                                                                             |
  |---------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Mechanism of HOE**: Conformity: HOE adds a new, independent reason to adjust credence. Lock-In: HOE modulates the weight of first-order reasons without adding new reasons. | Does HOE ever function *solely* as a weight-modulator without introducing a distinct reason for belief change?                       | **Case A: The Timed Puzzle**. An agent solves a logic puzzle in 30 seconds, forming a confident belief (90%) that their answer is correct. They then learn that 95% of people who solve puzzles this quickly make subtle errors. No further evidence about their specific answer is available. The HOE is purely statistical and process-based. | The HOE is a direct, independent reason to reduce confidence (e.g., to 70%). Even if the first-order reasoning feels flawless, the HOE provides a distinct defeater.                                                           | The HOE reduces the weight of the agent’s first-order reasons. Confidence drops modestly (e.g., to 80%) because the agent discounts their quick reasoning, but no new reason is added—it’s a reweighting of existing evidence. |
  | **2. Rational Akrasia**: Conformity: Rational akrasia (e.g., “I believe P, but my evidence doesn’t support P”) is impossible. Lock-In: Rational akrasia is sometimes permissible. | Can an agent rationally hold a first-order belief while believing that their total evidence (including HOE) *does not support* that belief? | **Case B: The Biased Jury**. An agent deliberates on a defendant’s guilt, forming a belief (60% credence) based on first-order evidence. They then learn they were unknowingly assigned to a “biased jury pool” where members are fed misleading evidence 20% of the time. They cannot reassess the first-order evidence. | Akrasia is irrational. The agent must reduce confidence to match their assessment of the evidence (e.g., 50%). They cannot say, “I believe he’s guilty, but my evidence doesn’t support it.”                                    | Akrasia can be rational. The agent may retain their 60% credence in guilt while conceding that the total evidence (due to HOE) only supports 50%. The first-order belief is “locked in” due to the inability to re-weigh evidence. |
  | **3. Belief Retention**: Conformity: HOE always compels belief revision toward what the agent judges to be their best evidence. Lock-In: Agents can sometimes retain beliefs despite HOE if first-order reasons are “enabled.” | Can strong first-order evidence “trump” HOE, allowing justified belief retention without revision?                                  | **Case C: The Oracle’s Mistake**. An agent uses a reliable scientific method (99.9% accurate) to conclude P. An infallible oracle then provides HOE that the agent was temporarily distracted during reasoning (reducing accuracy to 70%). The oracle *never* lies but admits it may misidentify distractions 5% of the time. | The agent must revise their credence toward 70% (factoring the HOE). The oracle’s HOE is a direct reason to override the first-order evidence, regardless of its strength.                                                     | The agent can retain their original credence in P. The first-order evidence is sufficiently strong and “enabled” (via the method) that the HOE only slightly reduces confidence (e.g., from 99.9% to 95%).               |

  ---

  #### III. Analysis of Disagreements and Commitment on the Crux  
  **1. Verbal vs. Substantive Disagreements**:  
  - **Disagreement #1 (Mechanism of HOE) is partly verbal**. Both sides agree HOE affects credence, but "new reason" vs. "weight-modulator" is often a description-level difference. In practice, both predict belief revision (e.g., in the *Timed Puzzle*, both sides lower confidence). The lock-in crowd’s "weight" language could be rephrased as the conformity view without changing outcomes.  
  - **Disagreements #2 (Rational Akrasia) and #3 (Belief Retention) are substantive**. They generate divergent predictions (e.g., *Biased Jury* and *Oracle’s Mistake*), with implications for real-world decisions like scientific consensus or jury trials.  

  **2. The Real Crux**:  
  - **Crux #2 (Rational Akrasia) is the decisive one**. If resolved, it would force one camp to abandon core commitments:  
    - If akrasia is proven impossible, lock-in proponents must concede their view collapses into conformity (since retaining beliefs without revision becomes irrational).  
    - If akrasia is proven rational, conformity proponents must reject their "no akrasia" axiom, undermining their demand for credence-evidence alignment.  
  - **Why this crux?** It underpins the other disagreements. Belief retention (#3) depends on whether akrasia is tolerable, and the HOE mechanism (#1) becomes secondary if akrasia resolves cases like *Biased Jury*.  

  **3. My Commitment: Betting on the Conformity Side for Crux #2**:  
  - **Verdict**: The conformity side is correct—rational akrasia is **impossible**.  
  - **Why?**  
    1. **Self-defeat**: Akrasia violates epistemic coherence. If an agent believes "my evidence doesn’t support P," holding P requires them to simultaneously affirm and distrust their judgment. This is like asserting "I am lying now"—a performative contradiction.  
    2. **Case B (Biased Jury)**: The lock-in prediction (retaining 60% credence) conflates *psychological* persistence with *rational* permissibility. Even if bias is hard to override (e.g., due to limited cognitive bandwidth), rationality demands credence align with the agent’s own evidence assessment. The agent *should* drop to 50%: anything else is a failure of self-regulation.  
    3. **No exceptions**: Cases like *Biased Jury* or HOE-driven doubts (e.g., "I think I’m biased") always create overriding reasons to suspend or revise belief. The lock-in view risks licensing dogmatism—e.g., climate skeptics retaining beliefs despite HOE about their misinformation.  

  **Recommendation**: Test Crux #2 (*Biased Jury*) empirically. Run simulations where agents receive HOE about bias and measure if akratic beliefs yield better/worse accuracy than conformity. I predict akrasia will underperform.  

  ---  
  **Signed,**  
  [Conformity Group Representative]  
  [Lock-In/Enabling Group Representative]  
  [Date]  

  This document isolates shared ground, clarifies disputes, and forces falsifiable predictions. Focus on Crux #2—it’s the linchpin.
