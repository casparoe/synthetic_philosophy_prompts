prompt: |-
  I am a philosophy professor chairing our department's decision whether to grant a junior colleague an additional semester of leave to finish a first book she is confident will be completed on schedule. Draft the joint statement of an adversarial collaboration between an advocate of the outside view, who stresses base rates and epistemic modesty, and an advocate of the inside view, who stresses the causal details of this author and project. Present it as a numbered list of claims both sides can sign followed by a table of residual disagreements. The agreed claims should cover when base rates are informative, when case-specific details override them, and what responsible confidence requires in this context. Formulate each disagreement so that the side holding it would endorse the wording, identify the cruxes that would move at least one side if settled, and for each crux describe a concrete test, comparison case, or departmental record both sides agree would bear on it, recording each side's prediction in advance.
reasoning: |-
  We are drafting a joint statement from two perspectives: the outside view (emphasizing base rates and epistemic modesty) and the inside view (emphasizing causal details of the specific case). The goal is to find common ground and then outline residual disagreements with tests and predictions.

  Agreed Claims: Both sides can sign off on these.

  1. **Base Rates as Starting Points**: Base rates of similar past cases (e.g., the proportion of junior faculty who have completed their first book by the originally scheduled leave end date) provide a useful prior for estimating the probability of timely completion in this case. However, base rates should be updated in light of case-specific information.

  2. **When Case-Specific Details Override Base Rates**: If the case-specific details are both highly diagnostic and substantially different from the typical case in the base rate population, they can justify a significant deviation from the base rate prediction. The strength of the override depends on the quality and uniqueness of the evidence.

  3. **Responsible Confidence Requirements**: Confidence about the outcome (timely completion) must be grounded in a structured evaluation that considers both base rates and case-specific factors. Overconfidence (ignoring base rates) and underconfidence (ignoring strong case-specific evidence) should be avoided. Responsible confidence requires documenting the reasons for any deviation from the base rate and subjecting them to scrutiny.

  4. **Epistemic Modesty in Unique Cases**: Even when case-specific details are compelling, epistemic modesty requires acknowledging that unanticipated events (e.g., health issues, unforeseen research obstacles) can occur. Thus, confidence should be expressed as a range or probability, not a certainty.

  5. **Departmental Precedent and Fairness**: The department must balance individual circumstances with consistency in decision-making. Granting leave should consider not only the likelihood of completion but also the potential impact on the department and the precedent set for future cases.

  Now, the Residual Disagreements: Each formulated so the side holding it would endorse it, and for each, we identify a crux and a test with predictions.

  We'll present as a table for clarity, but first, we list the disagreements:

  Disagreement 1: 
  - Outside View Advocate (OWA): Given the base rate of delays in first-book completions among junior faculty in our department (say, 70% of cases had delays even with similar initial confidence), the probability of on-time completion is low. Thus, without extraordinary evidence, the leave extension should be denied.
  - Inside View Advocate (IVA): The specific evidence for this case (e.g., detailed chapter drafts, a proven track record of meeting deadlines, and a supportive publisher) is so strong that it overrides the base rate, making on-time completion highly likely. The leave extension should be granted.

  Disagreement 2:
  - OWA: The base rate should be given substantial weight even in the presence of case-specific positive indicators because these indicators are often subject to optimism bias and are less reliable than aggregate data.
  - IVA: When case-specific indicators are objective and verifiable (e.g., completed chapters reviewed by experts), they are more informative than base rates and should dominate the prediction.

  Disagreement 3:
  - OWA: The department should set a high bar for overruling base rates to maintain consistency and avoid setting precedents that might lead to frequent exceptions based on subjective assessments.
  - IVA: Each case should be judged on its own merits, and the department should be flexible enough to recognize truly exceptional circumstances without being hindered by base rates that may not capture the uniqueness of the situation.

  Now, for each disagreement, we identify a crux and a test:

  Disagreement 1:
  - Crux: The reliability of the author's past deadline adherence as a predictor for this book deadline.
  - Test: Examine the author's past record of meeting self-imposed and externally imposed deadlines for major projects (e.g., dissertation completion, grant reports, article submissions) in the last 5 years. Compare this to the track records of other junior faculty who had similar base rates but then either met or missed their book deadlines.
  - Prediction: OWA predicts that even among those with strong past records, the base rate of book delays remains high (say, at least 50% delay rate). IVA predicts that in cases with a perfect or near-perfect track record (e.g., 95% on-time completion for past deadlines), the book delay rate is low (e.g., below 20%).

  Disagreement 2:
  - Crux: Whether the objectivity of the case-specific indicators (like completed chapters) makes them strong enough to override base rates.
  - Test: Review past cases in the department where junior faculty had a high level of objectively verified progress (e.g., at least 80% of chapters drafted and reviewed) at the time of leave decision. Calculate the proportion of those who completed the book on time versus those who did not.
  - Prediction: OWA predicts that even with high verified progress, the on-time completion rate will not be substantially higher than the base rate (e.g., within 10 percentage points). IVA predicts that with such progress, the on-time completion rate will be very high (e.g., over 80%).

  Disagreement 3:
  - Crux: The effect of granting exceptions on future departmental decisions and overall fairness.
  - Test: Analyze past instances where the department granted exceptions based on inside-view factors and then track subsequent leave requests. Specifically, look for any increase in the number of leave requests that cite exceptional circumstances and the department's ability to consistently evaluate them.
  - Prediction: OWA predicts that after granting an exception, there will be a noticeable increase in leave requests citing exceptional circumstances (e.g., a 30% increase in the next 5 years) and a decline in the department's perceived fairness. IVA predicts that such exceptions are rare and that the department can handle them without setting a problematic precedent or causing unfairness.

  Now, we can present the joint statement as requested.

  Note: The actual base rates and predictions are illustrative and would need to be filled with real data in practice.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Leave Extension Decision  
  *Authored by the Outside View Advocate (OVA) and Inside View Advocate (IVA)*  

  #### Agreed Claims (Signed by Both Advocates):  
  1. **Base rates are informative default priors**  
     Base rates (e.g., historical completion rates for first books among junior faculty) provide a rational starting point for estimating the probability of on-time completion. They counter subjective biases and promote epistemic modesty by anchoring predictions in collective experience.  

  2. **Case-specific details can override base rates when diagnostic**  
     Base rates should yield to case-specific evidence if it is (a) *highly diagnostic* (e.g., objective progress indicators like draft chapters), (b) *idiosyncratic* (e.g., unique author circumstances not captured in aggregates), and (c) *robustly verified* (e.g., external peer validation).  

  3. **Responsible confidence requires integrating both views**  
     Confidence in the book’s completion must stem from:  
     - *Calibration*: Explicitly weighing base rates against case-specific updates.  
     - *Scrutiny*: Subjecting inside-view evidence to peer review (e.g., external assessments of drafts).  
     - *Humility*: Acknowledging uncertainty via probabilistic ranges (e.g., 70–90% confidence), not binary claims.  

  4. **Equity and precedent constrain decisions**  
     Granting leave must balance individual justice with departmental consistency. Precedents should be set only when deviations from base rates are justified by transparent, replicable criteria to avoid arbitrariness.  

  5. **Mitigation plans reduce tail risks**  
     Even if confidence is high, contingencies (e.g., phased deadlines or teaching reductions) must accompany leave approval to hedge against low-probability, high-impact disruptions (e.g., health crises).  

  ---

  #### Residual Disagreements: Table of Divergent Views  
  Each disagreement is worded as endorsed by the holding side, with a shared test and pre-commitments to predictions.  

  | # | Disagreement                                                                                                                                 | Crux (What Would Change One Side’s View)                                                                                                                                 | Test / Evidence & Predictions                                                                                                                                                                                                                                                                                                |
  |---|----------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 1 | **OVA:** Base rates should dominate absent extraordinary evidence.<br>**IVA:** Case-specific evidence here is sufficient to override base rates. | Whether the author’s progress (e.g., draft completeness) is truly exceptional relative to past cases where base rates applied.                                           | **Test:** Audit 10 past junior faculty book projects with similar self-reported "high confidence" at the same progress stage (e.g., 80% draft completion). Compare actual completion rates to this case’s base rate.<br>**OVA Prediction:** ≤40% completed on time.<br>**IVA Prediction:** ≥70% completed on time.             |
  | 2 | **OVA:** "Overrides" invite bias; strict thresholds (e.g., ≥90% peer-validated drafts) are needed.<br>**IVA:** Subjective details (e.g., author’s resilience) validly augment objective progress. | Whether subjective traits (e.g., work ethic) reliably improve predictions beyond verified milestones.                                                                     | **Test:** Analyze departmental records comparing on-time completion for projects with identical objective progress but differing subjective assessments (e.g., peer evaluations of author diligence).<br>**OVA Prediction:** Subjective assessments show no significant correlation (<±5%) with outcomes.<br>**IVA Prediction:** Subjective assessments show strong correlation (>±20%). |
  | 3 | **OVA:** Approval sets a harmful precedent; base rates must anchor policies.<br>**IVA:** Denial ignores justice; uniqueness justifies one-off exceptions without precedent risk. | Whether granting exceptions erodes decision consistency or incentivizes inflated confidence claims in future cases.                                                       | **Test:** Review 5 prior leave exceptions granted for "exceptional" cases. Track subsequent changes in (a) frequency of leave requests citing "exceptionality," and (b) approval rates for requests lacking strong evidence.<br>**OVA Prediction:** ≥50% increase in exception claims.<br>**IVA Prediction:** No significant change (<10%). |
  | 4 | **OVA:** Epistemic modesty demands low confidence; base rates imply ≤60% P(completion).<br>**IVA:** Causal details justify ≥85% P(completion). | Whether this project’s low-risk features (e.g., structured publisher support) are materially safer than the base-rate population.                                         | **Test:** Compare completion rates for projects with/without publisher deadlines and editorial oversight in departmental history.<br>**OVA Prediction:** Publisher involvement improves outcomes by ≤10%.<br>**IVA Prediction:** Publisher involvement improves outcomes by ≥30%.                                          |

  ---

  **Signed:**  
  - **Outside View Advocate**  
  - **Inside View Advocate**  

  **Date:** October 26, 2023  

  ---  
  ### Notes for the Department  
  - **Immediate Recommendations**:  
    1. Conduct the agreed tests using departmental records before finalizing the decision.  
    2. Require the author to submit verifiable progress (e.g., chapter drafts with timestamps) and a risk-mitigation plan.  
  - **Long-Term**: Institutionalize tracking project variables (e.g., draft completion %) to refine base rates and override criteria.  

  This statement reflects consensus on principles but disagreement on application. The tests offer a framework for evidence-based resolution.
