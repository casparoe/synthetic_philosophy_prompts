prompt: |-
  I work on the governance tooling team at a prediction market platform, and clients keep asking us to "just do futarchy" — hand a policy decision to a prediction market — without understanding what that actually requires. We get about two of these requests a week, and the review has to be doable by an engineer who is not a philosopher in a single working day, with the market design lead signing off. Please turn futarchy into a concrete design procedure my team can run on a proposed policy question. In order, the procedure should specify: how to reformulate the question so the market is forecasting the right counterfactual — what would actually happen if the policy were adopted — rather than some untradeable value question; what counts as a sufficient resolution criterion (who adjudicates, on what evidence, and what happens if the outcome turns out to be ambiguous); what manipulation and verification checks to run before the market goes live; how to convert market prices into an actual decision, including what to do when related markets disagree; and at which step the procedure must stop and hand the decision to a human because the remaining question is one of values, not prediction. Then run the procedure on two proposals: a city council deciding whether to ban single-use plastic bags, and a university deciding whether to fund a ten-year basic research program. Respond in the style of an expert in market design and decision theory. Think very carefully before answering, and be explicit about which steps are judgment calls that no amount of market design can eliminate.
reasoning: |-
  We are designing a concrete procedure for implementing futarchy (decision markets) on policy questions. The goal is to convert a policy proposal into a prediction market that forecasts the outcome of interest, with clear resolution criteria and safeguards against manipulation. We must also define when to stop and hand to humans.

  The procedure has 5 steps:

  1. **Reformulate the question** to forecast a measurable counterfactual outcome.
  2. **Define resolution criteria** (who adjudicates, on what evidence, and handling ambiguity).
  3. **Manipulation and verification checks** before the market goes live.
  4. **Convert market prices to a decision**, including handling disagreement among related markets.
  5. **Identify when to stop** because the question is about values, not prediction.

  We'll design the steps and then apply them to two examples.

  ---

  **Step 1: Reformulate the Question**

  Goal: Turn a policy question into a forecast of a specific, measurable outcome that would be affected by the policy.

  Procedure:
  - Identify the primary objective the policy aims to achieve (e.g., economic growth, environmental benefit). This objective must be quantifiable.
  - Define a measurable metric (KPI) that captures the objective and can be compared in two scenarios: with and without the policy.
  - Formulate the market question as: "What will be the value of [KPI] at time [T] if the policy is implemented?" and simultaneously run a market for the same KPI without the policy (or use a control group if possible).
  - If the policy is binary (adopt or not), we need two markets: one for the policy world and one for the counterfactual (no policy) world. Alternatively, we can run one market on the difference (the treatment effect) if we can design it properly.

  Judgment calls:
  - Choosing the KPI: There may be multiple objectives. We must pick one primary one, or if multiple, run multiple markets and then aggregate (which requires value judgments). If we cannot agree on a single KPI, we must stop and hand to humans.
  - Time horizon: When will the effect be measured? This requires domain expertise and is a judgment call.

  ---

  **Step 2: Resolution Criteria**

  Goal: Define how the outcome will be determined and by whom.

  Procedure:
  - **Adjudicator**: A trusted third party (e.g., a predefined data source, an expert panel, or a decentralized oracle). The identity must be agreed upon in advance.
  - **Evidence**: The data source and methodology for measuring the KPI must be specified. For example, if the KPI is GDP, we might use the official government report for a given quarter.
  - **Handling ambiguity**: 
    - If the KPI is not available or the measurement is disputed, we specify a fallback (e.g., use an alternative source, or if none, void the market and refund).
    - If the event is ambiguous (e.g., the policy is only partially implemented), we must define thresholds (e.g., policy must be implemented by a certain date and in a certain form) and have a human adjudicator decide if the conditions were met.

  Judgment calls:
  - Choosing the adjudicator: This requires trust and may be contentious. If no trusted third party exists, we must stop.
  - Defining the measurement: The exact formula and data source must be unambiguous. If it's not, we must stop.

  ---

  **Step 3: Manipulation and Verification Checks**

  Goal: Ensure the market is resistant to manipulation and the outcome is verifiable.

  Checks to run:
  - **Market liquidity**: Estimate if the market will have enough participants. If not, the market may be too thin and manipulable. We might need to seed the market or use a market maker.
  - **Information availability**: Is there enough public information for participants to form meaningful predictions? If not, the market may not be informative.
  - **Verifiability**: Can the outcome be objectively measured? If not, the market is vulnerable to manipulation by the adjudicator or by insiders.
  - **Sensitivity to the policy**: Check if the KPI is likely to be significantly affected by the policy and not by other factors. We can do this by consulting experts or historical data. If the signal-to-noise ratio is too low, the market may not be useful.
  - **Correlation with other events**: We must ensure that the market isn't highly correlated with other events that might be traded (to avoid cross-market manipulation).

  If any check fails, we must either redesign the market or stop.

  Judgment calls:
  - Assessing liquidity and information availability is inherently speculative. We set thresholds (e.g., minimum number of potential traders, minimum trading volume expected) based on past markets.

  ---

  **Step 4: Convert Market Prices to a Decision**

  Goal: Use the market forecasts to make a decision.

  Procedure:
  - For a binary policy decision, we run two markets:
    - Market A: Forecasts the KPI at time T if the policy is implemented.
    - Market B: Forecasts the KPI at time T if the policy is not implemented.
  - At the decision time (before T), we compare the current market prices. Let P_A be the forecasted value from Market A and P_B from Market B.
  - The decision rule: Implement the policy if P_A > P_B (if the KPI is to be maximized) or P_A < P_B (if minimized).

  Handling disagreement among related markets:
  - If we run multiple KPIs (e.g., one for environmental impact and one for economic growth), we must aggregate. This requires weights (value judgment). If we haven't predefined the weights, we must stop and let humans decide.
  - If the same KPI is being forecasted in multiple markets (e.g., due to different time horizons or methodologies) and they disagree, we must use the market that is most liquid and has the longest track record of accuracy. If we cannot determine which is better, we use the one with the most trading volume.

  Judgment calls:
  - The aggregation of multiple KPIs requires a weighting, which is a value judgment and must be set in advance. If not, we cannot proceed.

  ---

  **Step 5: When to Stop (Value Questions)**

  Procedure:
  - If at any step we encounter a question that requires a value judgment (e.g., choosing between competing objectives without a pre-agreed weighting, or if the KPI itself is not agreed upon), we stop and hand the decision to humans.
  - Specifically, if we cannot define a single KPI or a set of KPIs with pre-agreed weights, we stop.

  ---

  Now, apply the procedure to the two examples.

  **Example 1: City council deciding whether to ban single-use plastic bags**

  Step 1: Reformulate the question
  - Objective: Likely to reduce environmental harm (litter, wildlife impact) and maybe reduce waste management costs. But there might be economic concerns (cost to businesses, inconvenience to shoppers).
  - We must choose a primary KPI. Let's assume the council's main goal is environmental. We might choose: "Total weight of plastic bag litter collected in the city per month" (measurable by the city's waste department). But note: there might be substitution (people use other bags) and other factors.
  - Alternative KPIs: Waste management costs, or carbon footprint? We must pick one. If the council has multiple goals, we may need multiple markets and then weights.

  Judgment: We must get the council to agree on the primary KPI. Suppose they agree on "plastic bag litter" as the main concern. Then:
    - Market A: What will be the total weight (in kg) of plastic bag litter collected in the city in the 12th month after the ban (if implemented)?
    - Market B: The same without the ban.

  But note: Without the ban, we need a baseline. Also, we must account for potential increases in other types of litter (e.g., paper bags). So we might adjust the KPI to be "plastic bag litter" only, but that might not capture the entire environmental effect. If the council cares about overall litter, we might change the KPI. This is a judgment call.

  Step 2: Resolution criteria
  - Adjudicator: City waste department. They already collect and report this data.
  - Evidence: Monthly reports from the waste department. If they change methodology, we use the one in place at market creation.
  - Ambiguity: If the ban is not implemented as planned (e.g., delayed or with exceptions), we might void the market. We define: the ban must be in effect for at least 6 months before the measurement month.

  Step 3: Manipulation and verification checks
  - Liquidity: This is a local issue, so we may not have many traders. We might need to allow city residents to trade with small stakes or use a market maker.
  - Information availability: Data on plastic bag litter is not regularly published in detail? We must ensure the waste department will release the data for that month. If not, we have a problem.
  - Verifiability: The waste department's data is trusted? If not, we need an alternative.
  - Sensitivity: Will the ban significantly affect litter? We can look at other cities that implemented bans. If the effect is too small relative to noise, the market might not work.
  - Correlation: Might be correlated with general anti-litter campaigns? We must note that the market is conditional on the policy being implemented or not, but other factors might affect both. We can't control for everything.

  If these checks fail (e.g., no liquidity, or data not available), we stop.

  Step 4: Decision rule
  - We run two markets (A: with ban, B: without). At the time of decision (say, 3 months after the market starts, before the ban would be implemented), we compare the forecasts (P_A and P_B). If P_A < P_B (we want to minimize litter), then implement the ban.

  But note: we are assuming the council only cares about litter. If they also care about economic impact, we would need another market for that and then weights. If we haven't set weights, we stop.

  Step 5: Stop for values?
  - In this case, if the council cannot agree that minimizing plastic bag litter is the only goal (or the primary goal), and they also want to consider, say, the cost to consumers, then we must either define an aggregate KPI (like a weighted score) or stop. Since defining an aggregate requires value judgments, we might have to stop and let the council vote.

  **Example 2: University deciding whether to fund a ten-year basic research program**

  Step 1: Reformulate the question
  - Objective: The program might aim to produce high-impact research, attract top faculty, or enhance the university's reputation. But these are hard to measure. We need a quantifiable KPI.
  - Possible KPIs: 
    - Number of publications in top-tier journals (but quality varies) or citations (but takes time).
    - University ranking (e.g., in a specific subject) after 10 years? But rankings are subjective and depend on many factors.
    - External research funding attracted by the program? This is measurable but might be too narrow.
  - We must choose one. Suppose the university agrees that the main goal is to improve the university's research reputation as measured by a ranking.

  Market A: What will be the university's position in the [specific ranking, e.g., Times Higher Education] in the year 10 years after program start, if the program is funded?
  Market B: The same without the program.

  But note: The ranking is an annual snapshot and might be volatile. Also, the ranking methodology might change. This is a risk.

  Step 2: Resolution criteria
  - Adjudicator: The ranking body (e.g., Times Higher Education). We use the ranking they publish in the relevant year.
  - Evidence: The official ranking list published in that year.
  - Ambiguity: If the ranking body changes methodology, we must decide in advance: use the ranking as published. Also, if the program is not funded as planned (e.g., only half the funds), we might void.

  Step 3: Manipulation and verification checks
  - Liquidity: This market might attract university insiders and education analysts. But 10 years is a long time, so we need a market that runs for 10 years? That's not practical. Instead, we might run the market for a shorter period (say, 6 months) to forecast the 10-year outcome. But long-term forecasts are hard and may be inaccurate.
  - Information availability: There is public information about the program and the university, but 10 years is very uncertain. The market might be dominated by noise.
  - Verifiability: The ranking is public and objective? Yes, but the methodology might change and the university might try to game the ranking.
  - Sensitivity: Will this program significantly affect the ranking? Maybe, but many other factors (like funding in other areas) will also matter. The signal might be lost in the noise.

  Given the long time horizon and difficulty in forecasting, the market might not be feasible. We might need to use a shorter-term proxy (like the number of high-profile faculty hired in the first 3 years) but that might not capture the long-term goal.

  Step 4: Decision rule
  - Compare the forecasts for the ranking with and without the program. But note: a higher ranking is better. So if P_A (with program) is a lower rank number (meaning higher rank) than P_B (without), then fund the program.

  But if we have multiple KPIs (e.g., also considering cost), we need weights. If the university hasn't set them, we stop.

  Step 5: Stop for values?
  - The choice of KPI (research reputation) might not capture all goals (e.g., educational impact, societal benefit). If the university has multiple objectives, we need to aggregate. Without pre-agreed weights, we stop.

  ---

  **Summary of the Procedure**

  1. **Reformulate**: Define a measurable KPI for the policy's effect. If multiple KPIs, agree on weights or stop.
  2. **Resolution**: Specify adjudicator, data source, and how to handle ambiguity. If not verifiable, stop.
  3. **Checks**: Assess liquidity, information availability, verifiability, and sensitivity. If any check fails, stop.
  4. **Decision**: Run two markets (with and without) and compare forecasts. For multiple KPIs, aggregate with pre-defined weights. If disagreement among markets, use the most liquid. If no weights for multiple KPIs, stop.
  5. **Stop for values**: At any step if a value judgment is required and not pre-resolved, stop and hand to humans.

  The procedure forces explicit consideration of what is being measured and how, and it stops when values are in conflict. This ensures that prediction markets are only used for questions they can actually answer.
answer: |-
  ### Concrete Futarchy Design Procedure for Policy Decisions

  As a market design and decision theory expert, I've distilled futarchy into a 5-step procedure that converts policy questions into prediction markets. Futarchy works *only* for **empirical questions** (what *will* happen), not **value questions** (what *should* happen). The core insight: markets forecast outcomes, but humans must define what outcomes are desirable. This procedure enforces that boundary. Each step includes checks for feasibility, with explicit "stop points" where value judgments dominate. The process assumes a 1-day engineer review, with sign-off from a market design lead.

  **Key Principles**  
  - **Markets predict, humans decide values**: Markets forecast measurable outcomes under policy vs. counterfactual. Humans must pre-commit to how these outcomes translate to decisions (e.g., "higher GDP = better").  
  - **Counterfactual rigor**: Markets must isolate the policy's causal effect, avoiding confounders (e.g., general economic trends).  
  - **Failure tolerance**: If any step reveals untradeability, ambiguity, or value conflicts, abort and hand to humans.  

  ---

  ### **Step 1: Reformulate the Question into a Forecastable Counterfactual**  
  **Goal**: Convert a policy proposal into a measurable outcome forecast, isolating the policy's causal effect.  
  **Procedure**:  
  1. **Identify the primary objective** (e.g., "reduce plastic waste" or "improve research output"). Reject vague terms like "better" or "improve" without metrics.  
  2. **Define a quantifiable Key Performance Indicator (KPI)**:  
     - Must be measurable, time-bound, and policy-sensitive (e.g., "plastic litter tons" not "environmental impact").  
     - Use *difference-in-differences*: Forecast KPI with policy (\(Y_{\text{policy}}\)) and without (\(Y_{\text{no-policy}}\)).  
  3. **Craft market questions**:  
     - Market A: "What will be [KPI] at [time T] if the policy is implemented as defined?"  
     - Market B: "What will be [KPI] at [time T] if the status quo is maintained?"  
  4. **Handle confounders**:  
     - Add ceteris paribus clauses (e.g., "assuming no major recessions").  
     - For geographic policies (e.g., a city ban), use a control region (e.g., "plastic litter in City X vs. similar City Y").  

  **Judgment Calls (Stop if unresolved)**:  
  - Choosing the KPI: If stakeholders disagree on what to measure (e.g., GDP vs. CO₂ emissions), this is a values conflict. Stop.  
  - Time horizon (T): Must balance data availability and policy effect latency. Requires domain expertise.  
  - **Stop Point**: If no consensus KPI exists, or the KPI is unmeasurable (e.g., "societal well-being"), hand to humans.  

  **Engineer Checks (≤2 hours)**:  
  - Verify KPI is numeric, public, and historically recorded (e.g., World Bank GDP data).  
  - Run a "sanity check": Would a 10% change in KPI clearly imply policy success/failure? If no, reformulate.  

  ---

  ### **Step 2: Define Resolution Criteria**  
  **Goal**: Ensure outcomes are adjudicated objectively, minimizing disputes.  
  **Procedure**:  
  1. **Adjudicator**:  
     - Pre-specify a neutral third party (e.g., NOAA for climate data, NSF for research metrics).  
     - Default: Reputable public data source (e.g., government statistics). Avoid "committee votes."  
  2. **Evidence**:  
     - Define exact data source (e.g., "EPA annual report for 2030, Table 3a").  
     - Require transparency (e.g., raw data must be publicly auditable).  
  3. **Ambiguity protocol**:  
     - If data is missing/contested: Use pre-agreed backup (e.g., "if EPA data unavailable, use City Waste Dept records").  
     - If policy isn't implemented as defined: Void market (e.g., "if ban is delayed >6 months, refund all").  
     - If KPI is within noise margin: Use confidence intervals (e.g., "policy wins only if \(Y_{\text{policy}} - Y_{\text{no-policy}} > 5\%\)").  

  **Judgment Calls (Stop if unresolved)**:  
  - Selecting adjudicators: If no trusted entity exists (e.g., for "reputation" metrics), stop.  
  - Noise margin: Requires statistical expertise (e.g., p<0.05).  

  **Engineer Checks (≤1.5 hours)**:  
  - Confirm data source exists and publishes regularly.  
  - Test ambiguity clauses against historical edge cases (e.g., "What if EPA revises its 2030 data in 2031?").  

  ---

  ### **Step 3: Manipulation and Verification Checks**  
  **Goal**: Ensure markets are informative and resistant to gaming.  
  **Checks to Run**:  
  1. **Liquidity test**:  
     - Estimate trading volume using similar markets (e.g., "Kalshi city-policy markets avg. $50k volume").  
     - Minimum liquidity: >10 unique traders expected, or use liquidity-sensitive AMMs (e.g., LMSR).  
  2. **Information availability**:  
     - Assess if traders can access relevant data (e.g., "plastic bag sales data is public").  
     - If data is proprietary (e.g., corporate revenue), reject—markets need symmetric information.  
  3. **Verification safeguards**:  
     - Insulate adjudicators (e.g., "NOAA staff can't trade").  
     - Monitor for sybil attacks (e.g., require KYC for large trades).  
  4. **Sensitivity analysis**:  
     - Model policy impact vs. noise (e.g., "ban reduces litter by 15%; historical std dev is 5% → detectable").  
     - If signal-to-noise ratio <2:1, reject.  

  **Judgment Calls (Stop if unresolved)**:  
  - Liquidity thresholds: Requires prediction market experience (market lead signs off).  
  - Noise tolerance: Domain experts must confirm effect size is plausible.  

  **Engineer Checks (≤2.5 hours)**:  
  - Simulate wash trades: Inject fake trades to test AMM resilience.  
  - Check for correlated assets (e.g., "if oil futures correlate >0.8 with plastic bags, add orthogonal data").  

  ---

  ### **Step 4: Convert Market Prices to a Decision**  
  **Goal**: Translate forecasts into a binary policy decision.  
  **Procedure**:  
  1. **Decision rule**:  
     - For scalar KPIs: Implement policy if \(\mathbb{E}[Y_{\text{policy}}] > \mathbb{E}[Y_{\text{no-policy}}]\) (if maximizing) or vice versa (if minimizing).  
     - Prices reflect \(\mathbb{E}[Y]\) if markets are efficient.  
  2. **Multiple KPIs**:  
     - Use pre-agreed weights (e.g., "60% weight to litter reduction, 40% to business costs").  
     - Run separate markets per KPI, then aggregate: \(\text{Score} = \sum w_i \cdot \mathbb{E}[Y_i]\).  
  3. **Handling disagreement**:  
     - If related markets conflict (e.g., "plastic litter" vs. "retail sales"), defer to highest-liquidity market.  
     - If still ambiguous, check time horizons: Prefer markets ending closer to decision date.  
  4. **Default action**:  
     - If markets are statistically tied (e.g., \(| \mathbb{E}[Y_{\text{policy}}] - \mathbb{E}[Y_{\text{no-policy}}] | < \text{noise margin}\)), maintain status quo.  

  **Judgment Calls (Stop if unresolved)**:  
  - KPI weights: Assigning weights (e.g., environment vs. economy) is a values question. If not pre-defined, stop.  
  - Noise margin: Requires statistical justification.  

  **Engineer Checks (≤1 hour)**:  
  - Validate price feeds (e.g., use time-weighted avg. prices to prevent flash crashes).  
  - Code decision logic as automated smart contracts.  

  ---

  ### **Step 5: Stop and Hand to Humans for Value Questions**  
  **Goal**: Abort futarchy if the problem hinges on ethics, preferences, or unmeasurable outcomes.  
  **Stop Triggers**:  
  - **Values conflict**: Stakeholders disagree on KPIs/weights (e.g., "environment vs. jobs").  
  - **Non-empirical goals**: The objective can't be measured (e.g., "preserving academic freedom").  
  - **Unresolved ambiguity**: Critical terms are undefined (e.g., "what counts as 'basic research'?").  
  **Procedure**:  
  - Freeze markets and notify governance body.  
  - Provide a summary: "Futarchy halted because [trigger]. Human vote required."  

  ---

  ### **Applied Examples**  
  **Case 1: City Council — Ban Single-Use Plastic Bags**  
  - **Step 1: Reformulate**  
    - Policy goal: Reduce plastic waste.  
    - KPI: Tons of plastic bag litter collected in city streets (monthly avg., T+12 months).  
    - Markets:  
      - A: "Tons of plastic bag litter in City X, 12mo post-ban."  
      - B: "Tons of plastic bag litter in Control City Y (no ban), same period."  
    - *Judgment*: If council cares about economic impact, add KPI "small retail revenue (IRS data)" with weights. If weights undefined, stop.  
  - **Step 2: Resolution**  
    - Adjudicator: City Waste Dept. (public dashboard).  
    - Evidence: "Monthly litter reports, Table 2."  
    - Ambiguity: If ban isn't enforced, void; if data missing, use EPA regional estimates.  
  - **Step 3: Checks**  
    - Liquidity: Partner with local universities for traders (est. 100+ participants).  
    - Sensitivity: Pilot bans show 20% litter reduction (noise: 5%) → feasible.  
    - Verification: Waste Dept. data is auditable.  
  - **Step 4: Decision**  
    - Implement ban if \(\mathbb{E}[\text{Litter}_A] < \mathbb{E}[\text{Litter}_B]\).  
  - **Step 5: Stop?** Only if council disputes KPIs (e.g., "what about paper bag emissions?"). If so, hand to vote.  

  **Verdict**: Futarchy viable. KPIs are measurable, and markets are tradable.  

  **Case 2: University — Fund 10-Year Basic Research Program**  
  - **Step 1: Reformulate**  
    - Policy goal: Advance scientific knowledge.  
    - KPI: Citation-weighted papers from the program (Scopus data, T+10 years).  
    - Markets:  
      - A: "Avg. citations/paper if funded."  
      - B: "Avg. citations/paper in matched departments without funding."  
    - *Judgment*: "Citations" may miss intangible benefits (e.g., training). If stakeholders insist on "reputation," stop—no measurable KPI.  
  - **Step 2: Resolution**  
    - Adjudicator: Scopus database.  
    - Evidence: "Citations counted as of Jan 1, 2035."  
    - Ambiguity: If Scopus changes methodology, use pre-specified version.  
  - **Step 3: Checks**  
    - Liquidity: Low—10-year horizons attract few traders. *Reject*: Use shorter-term proxy (e.g., "grants secured in T+3 years").  
    - Information: Citation forecasts are noisy; experts disagree. Signal-to-noise <2:1.  
    - Verification: Scopus is immutable, but insider trading risk (e.g., researchers influence citations).  
  - **Step 4: Decision**  
    - Not reached—failed Step 3.  
  - **Step 5: Stop** Triggered: Long horizons and noise make markets untradeable. Hand to board vote.  

  **Verdict**: Abort futarchy. Value judgments (e.g., "what counts as success?") and noise dominate.  

  ---

  ### **Procedure Summary**  
  | Step | Engineer Focus | Market Lead Sign-off | Time Allocation |  
  |------|----------------|----------------------|----------------|  
  | 1    | KPI measurability | Objective alignment | 2 hours |  
  | 2    | Data source audit | Adjudicator trust | 1.5 hours |  
  | 3    | Liquidity/sensitivity sims | Manipulation risk | 2.5 hours |  
  | 4    | Price logic code | Weight validation | 1 hour |  
  | 5    | Stop report | Values assessment | 1 hour |  

  **Final Advice**: Futarchy excels for short-term, measurable policies (e.g., infrastructure, zoning). It fails for value-laden, long-term, or noisy decisions. Your team’s role is to enforce this boundary—not to force markets where they don’t belong. When in doubt, stop: bad futarchy is worse than no futarchy.
