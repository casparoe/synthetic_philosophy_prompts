  We are grading a student's answer on Kim's causal exclusion argument. The student's answer is:

  "Kim's causal exclusion argument is aimed at non-reductive physicalism, the view that mental properties are genuine and supervene on physical properties without being identical to them. The argument proceeds from three premises. The first is the causal closure of the physical: whenever a physical event has a cause, it has a sufficient physical cause. The second is a distinctness premise: the relevant mental event is not numerically identical to the physical event that is the sufficient cause of the effect. The third is a no-overdetermination premise: causal overdetermination simply never happens, so no event is ever produced by two independent sufficient causes. From these three, Kim concludes that the mental event cannot itself be a cause of the effect, since the physical cause already does all the causal work. On this reading the mental is excluded from the causal order entirely, which is to say that there are no mental events to speak of; the argument is, in effect, an argument against the existence of the mental rather than merely against its causal efficacy, and so non-reductive physicalism collapses into something very close to reductive physicalism."

  The question asks for:
  1. State the causal exclusion argument as Kim presents it.
  2. Identify its main premises.
