  The principle behind your verdicts is a context-dependent combination of maximizing long-term growth and minimizing the probability of failing to achieve critical goals or incurring unacceptable losses. Below, I distill this into a precise set of principles, explicitly stating each clause, the case that forces it, and any limitations. I then apply the principles to a new test case where they disagree.

  ### Core Principles
  1. **Growth Optimization Principle**  
     - *Statement*: For repeated bets (indefinite or finite horizon) where wealth can compound and there is no binding wealth target or catastrophic loss constraint, maximize the expected logarithm of terminal wealth.  
     - *Forces the clause*: Cases 1 and 2 (60-40 coin, any number of flips or exactly three flips). The fraction (20%) is unchanged because expected log maximization depends only on the bet parameters, not the horizon length when reinvestment is allowed.  
     - *Verdicts accommodated*: 1 and 2 (20% stake).  
     - *Limitations*: Fails for cases with a binding goal (e.g., debt clearance in case 6) or severe loss risk (e.g., full-bankroll bets in case 3).

  2. **Loss Aversion Principle**  
     - *Statement*: If a bet carries a risk of a loss that would be catastrophic (i.e., reducing wealth below a critical threshold or causing irreversible harm), refuse it—even if it has positive expected value or log—unless the loss is bounded and acceptable in the given context.  
     - *Forces the clause*: Case 3 (different coin, full bankroll, infinite flips). The "single path" risk of severe drawdown (e.g., ruin or near-ruin from repeated losses) justifies refusal, despite unbounded expected arithmetic growth.  
     - *Verdicts accommodated*: 3 (refusal).  
     - *Limitations*: Fails for one-shot bets where the loss is non-catastrophic (e.g., case 4) and doesn't prescribe stakes for voluntary one-shots (e.g., case 5).

  3. **One-Shot Pragmatism Principle**  
     - *Statement*: For a non-repeated bet:  
       - (a) If forced to take it, accept when the expected arithmetic return is positive.  
       - (b) If voluntary, accept only if the potential loss is fractionally bounded (e.g., ≤10% of wealth) and psychologically tolerable, regardless of expected log or value.  
     - *Forces the clause*: Cases 4 and 5. Case 4 (forced one-shot) is taken due to positive expected value; case 5 (voluntary one-shot) stakes ~10% to cap loss severity, ignoring the higher expected-log stake (85%).  
     - *Verdicts accommodated*: 4 (take) and 5 (~10% stake).  
     - *Limitations*: Fails for repeated bets (cases 1–3) and goal-seeking (case 6).

  4. **Goal-Priority Principle**  
