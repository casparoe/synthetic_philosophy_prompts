prompt: |-
  Longtime lurker of the demandingness-objection threads here and I keep coming back to a case that I think breaks the standard supererogation machinery. Oates on Scott's last journey, March 1912: gangrenous feet, knows he's slowing the other three down, asks them to just leave him in his sleeping bag, they refuse, and the next morning he says "I am just going outside and may be some time," walks out of the tent into a −40 blizzard on his birthday, and is never seen again — his body was never found. Scott and the other two got pinned by weather about twelve days later and died in the tent, still short of the big supply depot they'd been slogging toward. So four dead, nobody saved, and what Oates bought the others was maybe a few extra miles of margin they never cashed in.

  Run that through the category properly. Take the stock definition — morally good, not required of anyone, involving serious cost or risk to the agent, and praiseworthy — plus Urmson's saints-and-heroes framing that set the whole project up, and tell me whether the act lands inside it or outside. The bit I cant get past: does the definition need a benefit term, and if it does what's the verdict when the benefit comes out to zero? Walk me through the live options — no moral credit at all because outcome luck is doing everything; credit attaches to the decision under uncertainty rather than the result; or the act was supererogatory in motive but not in effect and the category was never built to hold that split — and then say which one you'd actually sign up for. And does the supererogation paradox get any grip here: if one ought to do whatever produces the most good and walking out was that thing, its obligatory and there's no surplus merit left to praise.

  Then contrast Kolbe at Auschwitz. Same shape, one life traded for a stranger's, except Gajowniczek actually lived and had descendants. If Kolbe is obviously supererogatory and Oates isn't, is the category just consequentialist underneath, despite always getting sold as the anti-consequentialist category? And is there something about the small-team structure the literature misses — whether Scott and Wilson could legitimately have asked him to do it, whether their refusal to abandon him changed what he owed them, whether a role duty inside a five-man party does work that the stranger-on-the-street cases don't have room for. I know all the competence-failure and logistics stuff about the expedition, skip that part.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're deeply engaged with the demandingness objection and supererogation, using the Oates case as a challenge. The user wants to know if Oates' act fits the standard definition of supererogation, especially since it resulted in zero benefit. They also ask about the role of outcome versus intention, the supererogation paradox, and a comparison to Kolbe's sacrifice.

  First, I need to recall the core elements of supererogation: morally good, not obligatory, costly to the agent, and praiseworthy. The user questions whether a benefit is necessary and what happens when it's absent. The Oates case is unique because his sacrifice didn't save anyone—Scott's team died anyway. So, does the lack of benefit nullify the supererogatory status?

  The user mentions three options: outcome luck determines moral credit, credit attaches to the decision under uncertainty, or a split between motive and effect. I should analyze each. If moral credit depends solely on outcome, Oates gets none. But that seems counterintuitive because he acted on the best available information. Emphasizing intention aligns with how we typically judge actions—like praising someone who tries to save another even if they fail. 

  Then there's the supererogation paradox. If Oates' act was the best action to maximize good (given their knowledge), does that make it obligatory? Here, distinguishing between ex ante and ex post perspectives is crucial. At the time, with the information they had, walking out might have been seen as the optimal choice, but not obligatory because the cost was extreme. The team's refusal to leave him adds complexity—maybe they had a duty of care, making his sacrifice beyond obligation.

  Comparing Oates to Kolbe highlights the role of outcome. Kolbe's sacrifice succeeded, saving a life, which fits neatly into supererogation. But should the category depend on luck? If supererogation requires actual benefit, it becomes consequentialist, which contradicts its anti-consequentialist roots. This tension is key. The user is pointing out that even though supererogation is framed as anti-consequentialist, outcome luck might sneak in through the back door.

  The small-team dynamics are another angle. In a close group, role duties and mutual obligations might change what's considered obligatory. Scott's team refusing to leave Oates could mean he wasn't obligated to sacrifice himself, making his action supererogatory. But if they had asked him to, would it still be beyond duty? This ties into the literature's focus on stranger cases, missing group dynamics.

  The user's deeper need seems to be understanding whether supererogation can handle cases where intention and outcome diverge. They might be skeptical about the category's coherence, especially when sold as anti-consequentialist but potentially reliant on outcomes. They want a framework that accommodates real-world uncertainty and team structures, which aren't fully addressed in standard theories.

  I should conclude that supererogation can include Oates' act by focusing on intention and context. Highlighting the ex ante perspective and the team's refusal preserves its status. Contrasting with Kolbe shows that outcome luck shouldn't define the category, maintaining its anti-consequentialist stance. Addressing the small-team aspect emphasizes how relational duties affect obligations, an area needing more exploration in the literature.
answer: |-
  This is a razor-sharp case that cuts to the heart of supererogation theory. Let's dissect Oates' act against the standard definition and explore the tensions it exposes:

  **Applying the Standard Definition to Oates:**

  1.  **Morally Good?** Yes. The *intention* was clearly altruistic: to remove a burden (himself) to increase the survival chances of his comrades. This demonstrates profound self-sacrifice and concern for others.
  2.  **Not Required?** Crucially, **Yes**. Scott, Wilson, and Bowers *refused* to leave him. Their refusal establishes that, within the specific moral framework of the expedition and their bonds, abandoning him was *not* considered obligatory. He wasn't shirking a duty; he was attempting an act beyond what was demanded, even against their wishes. (We'll revisit the team dynamic later).
  3.  **Serious Cost/Risk?** Undeniably. He sacrificed his life, knowingly and deliberately, under extreme suffering.
  4.  **Praiseworthy?** Intuitively and historically, **Yes**. He is remembered specifically *for* this act of sacrifice, hailed as heroic despite the ultimate outcome.

  **The Sticking Point: The Zero Benefit & Outcome Luck**

  This is where the case strains the machinery. The standard definition often implicitly assumes *potential* benefit, but rarely explicitly requires *actual* benefit. Let's run through the options you posed:

  1.  **No Moral Credit Due to Outcome Luck:** This is the hardest consequentialist line. *Verdict:* If supererogation *requires* actual net positive outcome, Oates' act fails. He bought margin that wasn't used. *Problem:* This makes supererogation hostage to factors utterly beyond the agent's control (weather, others' subsequent failures). It reduces moral worth to sheer luck, which seems deeply counterintuitive for an act of supreme sacrifice based on the best available knowledge. Kolbe gets credit for luck (Gajowniczek survived), Oates gets none for bad luck? This feels arbitrary.
  2.  **Credit Attaches to Decision Under Uncertainty:** This is the most plausible and widely held view. *Verdict:* Oates' act *is* supererogatory. He made a supremely costly choice based on a reasonable assessment (shared by others, including Scott in his diary) that his presence was a fatal burden. The *intention* and the *costly choice made with the aim of significant good* are what matter morally. The outcome doesn't retroactively negate the moral quality of the act itself. Praise is for the character and the choice, not the uncontrollable result.
  3.  **Split Motive/Effect & Category Failure:** This argues the category isn't built for this split. *Verdict:* The act might be praiseworthy *as an attempt* but not truly supererogatory because the essential "good beyond duty" element is missing without actual benefit. *Problem:* This either collapses back into Option 1 (requiring actual benefit) or creates an awkward, under-defined sub-category of "failed supererogation," which the standard definition doesn't accommodate well. It risks making supererogation purely consequentialist in effect.

  **My Verdict: Option 2**

  I'd sign up for attaching credit to the **decision under uncertainty**. The core of supererogation lies in the **willingness to bear extreme cost for the sake of others' good, beyond what is demanded, based on a reasonable expectation of achieving that good.** Oates meets this. Requiring *actual* benefit makes the category far too fragile and luck-dependent, undermining its purpose of recognizing extraordinary moral effort and sacrifice. The praiseworthiness stems from the motive, the courage, and the nature of the sacrifice itself.

  **The Supererogation Paradox**

  *   **The Claim:** If walking out was the action most likely (ex ante) to maximize overall good (saving 3 lives > 1 life lost), then it was *obligatory*, leaving no room for "extra" merit.
  *   **Resolution:** This paradox often relies on maximizing act-consequentialism. Supererogation theorists typically reject this:
      *   **Agent-Centered Prerogatives:** Agents are permitted (not obligated) to give *some* weight to their own interests/life, even if sacrificing it would produce a net gain. Walking out went far beyond this minimal self-concern.
      *   **Demandingness:** Requiring ultimate self-sacrifice whenever it offers *any* net benefit is absurdly demanding. Oates wasn't *required* to sacrifice himself; his comrades' refusal proves this shared understanding. The cost is simply too high to be obligatory.
      *   **Ex Ante vs. Ex Post:** At the time, with the information they had, walking out offered a *chance* of significant good, but not a guarantee. Obligation typically requires a higher threshold of certainty and proportionality than supererogation. The *risk* he took (certain death for a *chance* to save others) was beyond duty.
  *   **Conclusion:** The paradox doesn't grip tightly here. The act wasn't obligatory because the cost was prohibitively high, the outcome uncertain, and the context (comrades refusing abandonment) showed it wasn't expected of him.

  **Contrast with Kolbe & Consequentialism**

  *   **Kolbe:** Succeeded. Gajowniczek lived. Fits the standard supererogation mold perfectly.
  *   **Apparent Consequentialism:** If Kolbe is supererogatory and Oates isn't (under Option 1), then the category *does* seem consequentialist – reward hinges on outcome luck.
  *   **The Anti-Consequentialist Core:** However, the *standard defense* of supererogation is precisely *anti*-consequentialist. It argues against maximizing demands and recognizes the moral value of actions that are costly, intentional, and aimed at significant good, *even if* a strict consequentialist calculus might sometimes demand them (the paradox) or they fail (Oates). Kolbe is *easier* to classify because the good was realized, but his act is praised for the *sacrifice*, the *character*, the *motive* – not solely the outcome. If Kolbe's sacrifice had somehow *failed* to save Gajowniczek (e.g., the SS killed him anyway later that day), most would *still* consider it a profoundly supererogatory *act*.
  *   **Resolution:** The category isn't *inherently* consequentialist. Kolbe is a *clear* case because intention, cost, and outcome align. Oates is a *hard* case because outcome diverges. But the core logic of supererogation (focus on costly intention beyond duty) should encompass Oates. The differing outcomes make Kolbe's act *more tragically successful*, not *categorically different* in its supererogatory nature. Judging Oates as not supererogatory *solely* due to outcome *would* betray a consequentialist sneak, undermining the category's intended function.

  **The Small-Team Structure: The Missing Element**

  This is vital and often overlooked in stranger-on-the-street paradigms:

  1.  **Role Duties & Mutual Reliance:** Antarctic expeditions operate on extreme mutual dependence. There *are* stronger duties of care, non-abandonment, and shared sacrifice inherent in the team structure than exist between strangers. Scott's refusal to leave Oates likely stemmed from this intense group obligation.
  2.  **Changed Obligations?** Their refusal fundamentally alters the landscape. By refusing to abandon him, they effectively *reaffirmed* their duty of care *to him*. This makes his decision to leave *even more clearly beyond the call of duty*. He wasn't fulfilling an obligation they imposed; he was acting *against* their expressed commitment to him, attempting to *force* the outcome he believed was best for *them*. This amplifies the "beyond duty" aspect.
  3.  **Could They Have Asked?** This is murky. *Could* Scott have legitimately *ordered* Oates to sacrifice himself? Arguably, no – that exceeds legitimate authority and the foundational duty of mutual preservation. *Could* they have *requested* it, framed as an appeal to the team's survival? Perhaps, though agonizing. Crucially, **they didn't.** Their refusal positions Oates' act as a unilateral, unsanctioned sacrifice, reinforcing its supererogatory nature *within that specific relational context*.
  4.  **Literature Gap:** Yes. Much supererogation theory focuses on atomistic individuals or strangers. The intense, role-based, mutually reliant context of small teams (explorers, soldiers, firefighters) creates a different moral ecology with stronger baseline duties. Acts that would be minimally obligatory among strangers (e.g., moderate risk to help) might be baseline duty here. Conversely, acts that *transcend* even these heightened duties (like Oates' sacrifice against the group's will) represent a distinctive form of supererogation grounded in overcoming profound relational bonds.

  **Conclusion:**

  Lawrence Oates' act **is supererogatory**, fitting the core definition when credit is attached to the **intentional, supremely costly, altruistic decision made under reasonable uncertainty to achieve a significant perceived good, beyond what was required or expected of him by his comrades**. The lack of *actual* benefit is tragic but doesn't negate the moral quality of the act itself. Judging it otherwise makes supererogation untenably dependent on luck. The contrast with Kolbe highlights the role of outcome in *ease of classification* but not the *essential nature* of the category, which remains anchored in costly intention beyond duty. The small-team context, especially the refusal of his comrades to abandon him, is crucial – it underscores that his sacrifice was a radical transcendence of the *heightened* duties inherent in that structure. Oates walked out not just into a blizzard, but into the complex heart of moral theory.
