  - Arbitrariness assessment: 75% (natural/synthetic evidence strong, but constraints underdebated)  
  - Usage critique: 80% (molecular biology resists disambiguation), but only 60% on "use" definition  
  - Recodability limitations: 85% (expression dynamics are material)  
  - Frozen accident analysis: 70% (historical contingency is consensus, but codehood-as-relic is interpretive)  
  - Highest uncertainty: Scope of arbitrariness (70%), given synthetic biology's artificiality*
