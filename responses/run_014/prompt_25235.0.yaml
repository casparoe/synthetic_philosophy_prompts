  The turpentine smell was a familiar ghost in Leo’s cramped studio, mingling today with the sharper tang of despair. He stared at the canvas drying on the easel – *Harvest No. 7*. It depicted a field of wheat, rendered with his signature precision, the stalks bending under an implied, unseen wind. Golden light, meticulously layered, bathed the scene. It was technically flawless. Critics called his work "crystalline," "intellectually resonant." He’d won awards. He taught masterclasses.

  And he believed, with every fibre of his Tolstoyan soul, that it was counterfeit.

  The worn copy of *What Is Art?* lay splayed open on his paint-stained workbench, pages falling open to the dog-eared section: "**Art is that human activity which consists in one man's consciously conveying to others, by certain external signs, the feelings he has experienced, and in others being infected by those feelings and also experiencing them.**"

  Leo hadn’t *experienced* the feeling of communal harvest joy, not truly, not since childhood summers at his grandfather’s farm. That feeling was a memory, filtered through decades of city living, art theory, and the pressure to produce for galleries obsessed with technique and concept. *Harvest No. 7* was a *representation* of a feeling, an intellectual exercise in composition and light, designed to impress connoisseurs who’d nod appreciatively at the brushwork and the subtle homage to Millet.

  The reckoning hadn’t been sudden. It was a slow, insidious corrosion, like damp eating at a canvas edge. It started with the faces at his gallery openings. The polished murmurs: "Exquisite control of tone, Leo." "The *texture* on those stalks! Masterful." No one ever said, "It made me feel the sun on my back," or "I remembered working the fields with my father." They dissected it, admired it, consumed it like expensive wine. Tolstoy’s condemnation echoed: *"Art for art's sake... is a monstrous thing."*

  Then came the *East End Community Centre* project. Invited to bring "real art" to a working-class neighbourhood, Leo had chosen a simple, hopeful image – children playing hopscotch on a sunlit pavement. He painted it with sincerity, trying to capture the uncomplicated joy he recalled. But when it was unveiled, the reactions were polite confusion, a few awkward smiles. One older woman patted his arm and said, "Very nice, dear. Looks expensive." It hadn’t *infected* them. He saw them looking at it, then quickly looking away, drawn instead to a vibrant, slightly clumsy mural of local heroes painted by teenagers. *That* mural buzzed with life; people pointed, laughed, argued about who was who. Leo’s piece hung like a well-meaning but foreign artifact.

  The final nail was driven last night. He’d lingered late at the gallery where *Harvest No. 7* was being prepped for a major show. Hiding in the shadows, he watched Maria, the night cleaner, push her cart through the hushed, white space. She stopped before his painting. Leo held his breath. Maria was from Romania, had worked the land as a girl before coming to the city. *If anyone could feel it…* He watched her tilt her head, her face illuminated by the spotlight on the canvas. She stared for a long moment. Then she shrugged, a small, dismissive movement, and muttered something in Romanian that sounded like, "*Frumos, dar rece*." Beautiful, but cold. She moved on, polishing the floor beneath it without a backward glance. That shrug, that muttered verdict, hit him with the force of a physical blow. *Cold*. Counterfeit. It failed Tolstoy’s ultimate test: it did not transmit a genuine, lived feeling to an ordinary person.

  Now, in the studio, Leo traced the perfect curve of a painted wheat stalk. His hand trembled. All these years, he’d been a hypocrite preaching purity while peddling beautifully packaged emptiness. He’d built his life, his identity, on sand. The tension wasn't just intellectual; it was visceral, a cramp in his gut, a constriction in his chest. Abandoning Tolstoy’s standard felt like abandoning his own soul, the core belief that had *made* him an artist. Yet adhering to it meant admitting his life’s work was a sham.

  He picked up a palette knife, its edge gleaming dully. The rationalizations came, desperate and flimsy: *Maybe I just haven't found the right feeling yet. Maybe true infection is rare. Maybe Tolstoy was too absolute...* But Maria’s shrug drowned them out. *Frumos, dar rece.*

  With a guttural sound that was part sob, part roar, Leo slashed the palette knife across the center of *Harvest No. 7*. The thick, wet paint parted like flesh. He hacked again, and again, tearing through the golden field, the meticulous light, the years of disciplined labour. Canvases stacked against the wall – earlier "Harvests," landscapes, portraits – watched like silent accusers. He grabbed one, a portrait of a society woman praised for its "penetrating psychological insight" (which had really just been capturing her impatience for the sitting to end), and dragged it to the small, cast-iron stove he used for heat.

  He hesitated, the cold metal of the frame biting into his fingers. This wasn't just destroying art; it was self-immolation. To burn it was to burn Leo Kendrick, the celebrated artist. What remained? Who remained? A hollowed-out man clutching a dog-eared book of impossible ideals?

  He opened the stove door. The embers glowed faintly. He thrust the edge of the canvas into the grate. The paint blistered, blackened, then caught with a soft *whump*, sending hungry orange tongues licking up the woman’s perfectly rendered, insincere face. The smell of burning linen and oil paint filled the studio, acrid and final.

  Leo sank to his knees, the firelight flickering on his own face, streaked with sweat and perhaps tears. He watched the portrait consumed. It wasn't catharsis. It was desolation. The tension hadn't resolved; it had crystallized into a crushing weight. He hadn't solved the paradox; he’d merely chosen one horn of the dilemma to impale himself upon. He had destroyed the counterfeit, but what did that leave him with? Only the terrifying, echoing void of Tolstoy’s demand: *Feel something true, and make others feel it too.* Could he? Did he even know *how* anymore, outside the gilded cage of technique and expectation?

  The fire crackled, consuming the past. Outside the grimy studio window, the indifferent city hummed. Leo Kendrick, former artist, sat amidst the ruins of his faith and his work, the only sound the hungry fire and the frantic, trapped buzzing of a moth against the glass, drawn to a light it could never truly reach. The wrestling had just begun, and the ring was empty save for him and the ghost of a Russian count whispering impossible truths.
