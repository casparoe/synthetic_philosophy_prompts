answer: |-
  ## The Monday Margin
  The Thames breathed damp against the studio window. Inside, the air was still, sharp with ghosts of cedar and bergamot. Eleanor Vance, sixty-seven, her knuckles thick with decades of handling glass, dipped the tip of a fresh blotter strip into the third vial. *Dilution C*. She lifted it, waited the precise fifteen seconds for the alcohol to flash off, then brought it to her nose. Deep inhale. Hold. Exhale slowly through the mouth. The scent bloomed: deep, powdery, violet-root earthiness touched with raspberry jam – *alpha-ionone*. Her cornerstone. Her Monday morning liturgy.

  Thirty years of notebooks lined a shelf, spines cracked, pages dense with her looping script. Each Monday, she worked through her private reference set: seven dilutions of alpha-ionone in ethanol, logarithmic steps descending from near-saturation (A) to near-invisibility (G). She judged each against her internal standard, the smell etched into her memory from decades before, when her nose was a young blade. She logged: *A: Robust, intense. B: Strong, clear ionone character. C: Clear, signature present, good balance…* Today, as last Monday, and the Monday before, she noted *C: Clear, signature present*. *D: Present, discernible*. She paused at E. Faint, almost spectral. But yes. There. Just. She marked it. F and G were blank air to her now, as they had been for perhaps five years. The erosion was acceptable, documented. She compensated. Calibration was about knowing the limits.

  A knock. Crisp, professional. Sarah Chen from Compliance stood in the doorway, tablet held like a shield. "Morning, Eleanor. Just the weekly calibration check-in. Anything notable?"

  Eleanor gestured at the open notebook. "Running it now. All nominal. C clear, D present, E borderline but detectable. Within documented parameters." She kept her voice level. Sarah was diligent, young, tasked with ensuring Harding & Vale Perfumery’s adherence to the new international fragrance safety certification. Eleanor’s signature was the final gatekeeper for batches worth tens of thousands. Sarah’s question was procedural, but it carried weight: "And the reference itself, Eleanor? Stability confirmed?"

  Eleanor tapped the row of amber vials, impeccably sealed, stored in darkness. "Same set since '93. Controlled environment. Logged." She didn’t add *I am the control*. Sarah’s gaze lingered on the notebook, then flicked to the blotters laid out on the steel tray.

  "How do you know," Sarah asked, her tone carefully neutral, "that *your* detection threshold for E, say, hasn't shifted? Since… well, since the last full external audit?" It wasn’t challenge, precisely. It was the QA version of philosophical bedrock inquiry. *How do you know?*

  Eleanor met her eyes. "Consistency. The log. The steps between dilutions." She picked up blotter D, then E. "This," she inhaled D, "is unquestionably present. This," she inhaled E, "is faint but distinct. The gap is clear. Today. As it was last week." *As it was*, she thought but didn’t say, *when the gap felt wider, years ago*. She felt no uncertainty. The scent of E *was* there. Like recognising a face glimpsed through fog – you just knew.

  Sarah nodded, making a note. "Understood. Just protocol. We need the sign-off for the Ambrée Royale re-blend by end of day. Critical batch. Client’s waiting."

  *Ambrée Royale*. Their signature amber-vanilla-orris, a cash cow. The reformulation was delicate. The original used a specific, now-restricted orris butter substitute. Eleanor had spent weeks crafting the replacement accord. The alpha-ionone was crucial – a subtle violet-woody backbone, too much and it turned soapy, too little and the structure collapsed into bland sweetness. Her nose had to find the exact pivot point. The gas chromatograph downstairs could map molecules, but it couldn’t tell you if a scent was *beautiful*, if it held the memory of sunlight on old wood. That judgement lived in her calibrated neurons.

  Sarah left. Eleanor returned to the tray. She picked up blotter C. Clear. Unmistakable. Solid ground. She picked up D. Present. Discernible. She picked up E. Faint. But *there*. She knew it. She believed she knew it. The gap between D and E felt real, a step down a familiar staircase in dim light. She logged the calibration as complete, satisfactory.

  ***

  The afternoon light was fading, casting long shadows across the blending lab. The Ambrée Royale trial batch sat in a glass beaker, a deep, honeyed gold. Eleanor dipped a fresh blotter. The first impression was good: rich amber warmth, plush vanilla. She let it rest. The mid-notes unfolded – the orris, smooth, rooty, slightly waxy. And then… the base. She waited for the alpha-ionone to anchor it, to provide that dry, violet-woody lift that prevented cloying. It was there… wasn’t it? She inhaled again, deeper, focusing past the vanilla’s insistence. Yes. A whisper of it. Faint. Like blotter E.

  She prepared another blotter from her reference dilution C. Clear. Strong. Unmistakable anchor. She went back to the Ambrée batch. Was the ionone truly *present* at the required level? Or was it just… implied? Was she filling in the gap because she knew it *should* be there? The scent from the Ambrée blotter seemed to shift. One moment, she caught the dry, raspberry-kernel edge of the ionone; the next, it was swallowed by the vanilla-orris sweetness. It was like trying to hear a specific instrument in an orchestra when your hearing has dulled just slightly to its frequency. The note existed, but pinpointing its exact volume, its distinctness within the blend… Her certainty, solid an hour ago, developed hairline cracks.

  *Margin for error*. The uninvited thought surfaced. Each dilution step was a threshold. Knowing D was present required that E was *not* – or at least, that the gap was perceptible. But if her sensitivity had eroded by exactly one dilution step over the years, silently, without crossing any internal alarm… Then what she registered as the faint-but-discernible presence of E today might actually be the strength she would have once registered as D. And what she registered as D now would have been C. And her ‘clear’ C…? She pushed the thought down. The gap *felt* real. E *was* fainter than D. Today. On these blotters.

  But the Ambrée batch wasn’t a neat dilution. It was a complex matrix. The ionone wasn’t singing alone; it was part of a chord. And the difference between ‘present but faint’ and ‘absent but imagined’ felt terrifyingly small. Indistinguishable, perhaps, within the margin of her current perception. She *could* smell something woody-violet in the base. She truly could. But was it *enough*? Was she perceiving the actual molecule, or the ghost of expectation? Knowing it *might* be there wasn’t the same as knowing it *was* there. Her sincere report – "ionone character present" – could be internally consistent, perfectly sincere, and yet wrong. The calibration ritual suddenly felt like a snake biting its own tail. The reference point was… herself. As she was now. Not as she was thirty years ago.

  She thought of the GC downstairs. She could send a sample. It would show a peak. The auditor’s certificate for the machine was pinned on the wall, signed by a lab she’d never visited. *How do you know?* Sarah’s question echoed. It just relocated the chain of trust, the reliance on an external ‘knowing’ she couldn’t personally verify. The machine couldn’t tell her if the scent was *right*, only if the molecule *was*.

  The client was waiting. Production schedules hinged on her sign-off. She picked up the Ambrée blotter again. She closed her eyes, shutting out the lab, the fading light, the pressure. Just the scent. She inhaled slowly, searching for the dry, raspberry-kernel thread in the honeyed warmth. It was elusive. Was that it? That fleeting dryness? Or was it just a facet of the orris? She held it… and then it seemed to coalesce. Yes. *There*. Faint, but distinct. Separate. Present. The anchor. Her nose reported it. Her mind, trained by decades, interpreted the signal. She believed it.

  She opened her eyes, picked up the approval form, and signed her name with a firm, clear hand. *Eleanor Vance. Senior Perfumer. Batch Approved.*

  ***

  Later, washing her hands at the steel sink, the river smell stronger now through the vent, she picked up the discarded Ambrée blotter from the waste bin. An hour had passed. She brought it to her nose, almost idly.

  Nothing. Just a faint, sweet, woody-vanillic blur. No distinct ionone edge. Nothing dry. Nothing like raspberry kernels.

  Had it faded that quickly? Or… had she filled it in before? She picked up a fresh blotter from the reference dilution E. Faint. But yes. Still there. Wasn't it? She inhaled. Harder. Was it the scent, or the *memory* of the scent triggered by the context? The gap between D and E felt wide again, undeniable. She looked at the signed form on her desk, then back at the faded Ambrée blotter in her hand.

  The river fog pressed against the glass, blurring the lights on the far bank. She couldn't be sure. Not then, not now, not ever again, if that decisive moment by the blending table had been knowledge, or merely the echo of a sensation falling within a margin too narrow to measure from the inside. The scent, if it had been there at all, was gone.
