  On causal vs. evidential correlations, the question must probe whether EDT inherently conflates them. The follow-up should press on whether the theory can *systematically* differentiate without ad-hoc fixes, as this cuts to EDT's core mechanics. 

  For Newcomb's lesson, I should steer away from predictability debates. Instead, focus on why EDT gets "the right answer" here but allegedly fails elsewhere—is it about ontology of causation, agent detachment, etc.? The follow-up could ask if this makes EDT context-dependent. 

  The other questions should cover EDT's unique strengths: its psychological plausibility, handling of moral uncertainty, alignment with Bayesian epistemology, and its response to "why ain'cha rich?" critiques. Each needs a follow-up that anticipates defensive answers and pushes deeper—e.g., if the guest says EDT mirrors human reasoning, ask whether that's a virtue or a bias. 

  User's tone suggests sophistication, so questions must avoid oversimplification. They'll want rigorous yet accessible phrasing for a student audience. Also, since it's a podcast, questions should flow conversationally but with clear philosophical stakes. 

  Notably, the user didn't ask about EDT's competitors (like CDT). That's deliberate—they want EDT examined on its own terms. I'll respect that focus but include one contrast question (#8) to subtly highlight EDT's distinctiveness. 

  Finally, the follow-ups must feel organic, not interrogative. Podcasts thrive on dialectical tension, so questions like "But then isn't that just CDT?" or "Doesn't that undermine EDT's generality?" can spark engaging debate without hostility.
answer: |-
  Here are 10 interview questions focusing on the core tenets, strengths, and challenges of Evidential Decision Theory (EDT), incorporating your specific requests and designed to move beyond standard Newcomb's retellings. Each includes a likely-standard-answer follow-up to deepen the discussion.

  ### Core Concepts & Distinctions

  1.  **The Evidential Core:** EDT evaluates acts based on the evidence they provide about desirable outcomes. Could you articulate what you see as the *fundamental philosophical motivation* for prioritizing evidential relationships over causal ones in rational decision-making? Why is the *news value* of an act the key factor?
      *   *Follow-up (If she emphasizes rationality as tracking truth/evidence):* Critics argue agents often *need* to influence the world, not just learn about it. Doesn't prioritizing evidence risk making EDT a theory of passive *prediction* rather than active *intervention*? How does EDT ensure its agents are truly *acting*?

  2.  **Causal vs. Evidential Correlation (Core Distinction):** A central critique is that EDT seemingly cannot distinguish between correlations that are genuinely causal and those that are merely evidential (like the lesion causing both smoking *urge* and cancer). How does EDT, *within its own framework*, differentiate between an act being *good evidence* for a state and the act actually *causing* that state? Is this distinction accessible to the EDT agent?
      *   *Follow-up (If she suggests conditioning on common causes/better partitions):* In the smoking-lesion case, conditioning on the lesion resolves it. But isn't the core criticism that EDT *requires* the agent to already know and be able to condition on the *exact* causal structure? What if the agent is ignorant of the lesion or similar hidden variables? Doesn't EDT then collapse the distinction and give bad advice?

  ### The Smoking-Lesion Challenge

  3.  **Smoking-Lesion Case - The Problem:** In the classic smoking-lesion case, EDT apparently advises against smoking because smoking is strong evidence of cancer, even though the agent knows smoking *doesn't cause* cancer (the lesion does both). This seems like clearly bad advice if the agent enjoys smoking. How does your preferred version of EDT avoid prescribing "don't smoke" in this scenario?
      *   *Follow-up (If she emphasizes conditioning on the lesion/variables):* As above, doesn't this solution place a potentially unrealistic burden of omniscience on the agent regarding causal structure? If the agent *doesn't* know about the lesion or can't condition on it (e.g., it's unobservable), is EDT forced to give the counterintuitive "don't smoke" advice? Isn't that a vulnerability?

  4.  **Smoking-Lesion - Positive Account:** Putting aside the avoidance of bad advice, what *positive* account does EDT offer for why it might be rational to smoke in the lesion case? What evidence does smoking provide *in favor* of good outcomes within the EDT calculation when the causal structure is known/conditioned upon?
      *   *Follow-up (If she focuses on the lack of negative evidence after conditioning):* So, is the key point that once the lesion is conditioned on, smoking provides *no evidence* about cancer (since the lesion screens it off), making it permissible based on the utility of smoking itself? Does EDT then become neutral or permissive rather than actively recommending smoking?

  ### Newcomb's Problem - Beyond One-Boxing

  5.  **Newcomb's Real Lesson (According to EDT):** While EDT famously prescribes one-boxing in Newcomb's, you've argued this isn't its defining feature. What, in your view, is the *primary* philosophical lesson Newcomb's problem teaches us about rational deliberation, specifically from an *evidentialist* perspective? Is it about the nature of free will, the limits of self-prediction, the ontology of causation, or something else?
      *   *Follow-up (If she emphasizes self-knowledge/transparency):* If the lesson is that rational agents must consider what their choices reveal about their own dispositions and the world, doesn't this make deliberation incredibly complex? How can an agent reliably model what their *potential* choices reveal without falling into debilitating self-doubt or infinite regress?

  6.  **Predictor's Reliability & EDT:** Does the *degree* of the predictor's reliability in Newcomb's fundamentally change the EDT calculation, or is the prescription (one-box) robust across a wide range of reliabilities once it surpasses 50%? What does this tell us about how EDT handles probabilistic evidence?
      *   *Follow-up (If she says it's robust above 50%):* Doesn't this seem odd? If the predictor is only 51% reliable, one-boxing has a very slim evidential advantage, while two-boxing guarantees $1000. Why should EDT prioritize such a small evidential gain over a guaranteed substantial gain? Does this highlight a potential insensitivity to risk or magnitude in EDT?

  ### Strengths & Applications

  7.  **Psychological Plausibility:** A potential strength of EDT is its perceived psychological realism – humans often *do* seem to act based on the evidence their actions provide (e.g., guilt by association avoidance). Do you see EDT as primarily a *descriptive* model of human reasoning, a *prescriptive* norm, or both? How does its potential descriptive accuracy bolster its normative claims?
      *   *Follow-up (If she leans towards prescriptive/normative):* If humans naturally reason evidentially but often make poor causal decisions (e.g., superstitious avoidance), why should we elevate this natural tendency to a normative ideal? Isn't overcoming this very tendency sometimes required for rationality?

  8.  **Moral Uncertainty & EDT:** EDT evaluates acts based on the evidence they provide about *all* desired outcomes (utilities). How does EDT uniquely handle situations involving *moral uncertainty* – where the agent is unsure about what the "right" utility function even is? Does its focus on evidence extend to evidence about what one *should* value?
      *   *Follow-up (If she discusses evidence over moral states):* Doesn't this risk conflating moral epistemology (figuring out what's right) with decision-making under *fixed* moral uncertainty? How does EDT avoid simply recommending acts that *look* morally good evidentially, even if they aren't causally effective for the (uncertain) true moral goal?

  ### Critiques & Responses

  9.  **The "Why Ain'cha Rich?" Objection:** Proponents of Causal Decision Theory (CDT) often argue that two-boxers end up richer than one-boxers in repeated Newcomb-like scenarios (where the predictor exists). How does EDT respond to this pragmatic challenge? Is financial success the right metric, or is EDT concerned with a different kind of rationality?
      *   *Follow-up (If she argues rationality is act-specific, not long-run):* But doesn't this risk making EDT a theory for "one-shot wonders"? If consistently following EDT leads to systematically worse outcomes in predictable environments compared to CDT, doesn't that undermine its claim to be a practical theory of rational choice?

  10. **The Future of EDT:** What do you see as the most promising avenue for developing or refining EDT to address challenges like the smoking lesion (without perfect knowledge) or the perceived weakness in genuinely causal scenarios? Is it through more sophisticated probability kinematics, integrating limited causal knowledge, or a different approach entirely?
      *   *Follow-up (If she suggests integrating causal models):* Doesn't incorporating explicit causal models risk turning EDT into a variant of CDT, or at least conceding that causal information is ultimately necessary for truly robust rational decision-making? How can EDT retain its distinct *evidentialist* core while borrowing these tools?

  **Key Principles Used:**

  *   **Depth over Recap:** Questions assume familiarity with basics (Newcomb, Smoking-Lesion) and dive into implications, motivations, and nuances.
  *   **Focus on EDT's Core:** Emphasis on evidence, news value, conditioning, and the distinction (or lack thereof) between evidential and causal correlations.
  *   **Specific Challenges:** Directly addresses Smoking-Lesion and the causal/evidential distinction as requested.
  *   **Newcomb's Nuance:** Asks about the *lesson* of Newcomb's for EDT, not just the prescription.
  *   **Strengths & Applications:** Explores psychological plausibility and moral uncertainty.
  *   **Responses to Critiques:** Includes the pragmatic "Why Ain'cha Rich?" challenge.
  *   **Forward-Looking:** Ends with the future of EDT.
  *   **Productive Follow-ups:** Designed to anticipate common EDT defenses and push the conversation towards deeper conceptual issues or potential weaknesses.

  These questions should provide a rich, hour-long discussion focused squarely on the substance and philosophical underpinnings of Evidential Decision Theory. Good luck with the episode!
