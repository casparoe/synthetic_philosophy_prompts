prompt: |-
  I run a political philosophy seminar for second-year undergrads, 12 students, 90 minutes, and next week we hit Kant's Perpetual Peace. I don't want to open with a lecture — I want a game they play *first*, so that when we turn to the text they keep having the experience of reading their own game session transcribed into 1795 German. The core thing I want them to feel is Kant's weird claim that peace is not about good intentions or brilliant diplomacy: it's a design problem, where the right constitutional machinery makes war irrational (or at least ruinous) even when every actor is perfectly selfish.

  My rough sketch, which you should feel free to rip apart: six or so delegations on a fictional map with asymmetric resources, several rounds in which they can trade, form alliances, and go to war, points as the payoff (no real money). What I'd love to have happen: their first peace treaty collapses — ideally because somebody tucked a secret reservation into it, or quietly rebuilt their army under cover of the truce — and they then have to reinvent, from scratch, something like the preliminarly articles, and eventually something like the federation, on their own. One wrinkle I'm half-attached to: making some delegations autocracies (one student decides everything) and some republics (they must deliberate and vote, with a rule that war costs get itemised to them personally), so Kant's first definitive article shows up in the data rather than in my mouth. But tell me if that's too gimmicky or too heavy for 90 minutes.

  What I need from you: complete rules and materials, a payoff scheme where war is tempting early and ruinous late (so a naive player discovers the standing-army trap the hard way), the round structure with rough timings, and a debrief that maps specific moments in the game onto specific bits of the text — secret reservations, standing armies, the debt-financed war problem, the federation-of-free-states-not-a-world-state point, and hospitality for strangers on your territory. Also be honest about what the game can't reproduce: my suspicion is it can't capture Kant's insistence that the league must involve no sovereign power above the states, since in a game every rule I write is de facto enforced by me, the referee, so the players never face the actual enforcement problem Kant is dodging. And please flag what will predictably go wrong the first time I run it.

  Write the whole thing in British English, please.
reasoning: |-
  We are designing a game to simulate the dynamics Kant describes in "Perpetual Peace". The goal is for students to experience how structural design (like constitutions) can lead to peace even with self-interested actors. We have 90 minutes with 12 students. We'll divide them into 6 delegations (each with 2 students). Some delegations are autocracies (one student decides) and others are republics (both must agree, and war costs are itemised).

  Key elements to include:
  - Asymmetric resources: different starting points to encourage trade and conflict.
  - Round structure: several rounds (about 4-5) with actions (trade, form alliances, go to war, build army, negotiate treaties).
  - Peace treaties: should be breakable (secret reservations, rebuilding armies) to lead to collapse and then a need for stronger institutions.
  - Points system: war should be tempting early (quick gains) but ruinous late (escalating costs, especially for republics where costs are personal).
  - Kant's concepts: secret reservations, standing armies, debt-financed war, federation (not world state), hospitality.

  Game cannot perfectly simulate the lack of a sovereign enforcer because the referee (you) enforces rules. We'll note that.

  Structure:
  - Introduction (5 mins)
  - Setup (5 mins)
  - Rounds (4 rounds, 10 mins each = 40 mins)
  - Treaty negotiation phase (if triggered, 10 mins)
  - Debrief (30 mins)

  Total: 5+5+40+10+30 = 90 mins.

  **Game Name:** The Perpetual Peace Game

  **Materials:**
  - A game board (a fictional map with 6 territories, each assigned to a delegation). Map should have:
    - Resource types: e.g., Grain, Iron, Gold, Fish, Timber, Oil (symbolic, not too complex).
    - Each territory produces one resource per round.
    - Each delegation starts with a different mix of resources and military strength.
  - Delegation sheets (one per team) showing:
    - Their territory name and resource produced.
    - Starting resources (e.g., 5 units of their resource, 3 units of food (if needed), 10 gold).
    - Military: starting army size (e.g., 5 army points).
    - Points: starting at 0.
    - For republics: a note that war costs are split between the two players (each loses points individually for war costs).
  - Action cards for each round (trade, build army, form alliance, declare war, negotiate treaty).
  - Treaty template (for when they negotiate).
  - A referee (you) to track points and enforce rules.

  **Delegation Types:**
  - 3 Autocracies: One student makes all decisions. War costs are borne by the delegation as a whole (so one point loss for the team).
  - 3 Republics: Both students must agree on actions. War costs (and any other costs) are split: each student loses half the cost (rounded up) from their personal points. This reflects Kant's idea that in a republic, citizens feel the cost of war.

  **Starting Setup:**
  Assign territories and types:

  | Territory | Resource | Starting Army | Starting Gold | Type        | Special Notes |
  |-----------|----------|---------------|--------------|-------------|---------------|
  | Norden   | Iron     | 5             | 10           | Autocracy   |              |
  | Sudia    | Grain    | 4             | 12           | Republic    |              |
  | Westria  | Timber   | 6             | 8            | Autocracy   |              |
  | Eastland | Fish     | 3             | 15           | Republic    |              |
  | Centrum  | Gold     | 4             | 20           | Republic    | Gold is more valuable (1 gold = 2 points when spent) |
  | Ostreich | Oil      | 5             | 10           | Autocracy   |              |

  **Resource Values for Trade:**
  - Each resource can be traded for 1 point per unit, except Gold (2 points per unit). But they can also be used for building armies or other actions.

  **Round Structure (each round is 10 mins):**
  1. **Resource Production (1 min):** Each delegation produces 2 units of their resource (and for Centrum, 1 unit of Gold, which is worth 2 points if converted, but they might use it for other things).
  2. **Action Phase (7 mins):** Delegations can:
     - **Trade:** With adjacent territories (or via alliance, see below). Trade is bilateral: they agree on what to exchange (resources or gold). Trade must be public (announced to all) unless they have an alliance (then can be private). 
     - **Build Army:** Spend 1 resource unit (any type) to add 1 army point. Or spend 2 gold to add 1 army point. (This represents the cost of maintaining a standing army.)
     - **Form Alliance:** Two or more delegations can form an alliance. This allows them to trade privately and support each other in wars. An alliance is public knowledge (who is in it) but the terms (like defense pact) are not enforced by the game unless written in a treaty (see below). Alliances can be broken at any time (no cost, but reputation?).
     - **Declare War:** On another delegation. Must be public. Then the two (or more, if allies join) fight a battle.
       - Battle resolution: Each side rolls a 6-sided die. Add their army points. Higher total wins. 
       - Loser: loses half their army (rounded down) and 5 points (for the delegation). Also, the winner takes 1 resource of choice from the loser (if any) and 5 gold (if available). 
       - For republics: the point loss is split (each student loses 3 points, because 5/2=2.5 -> rounded to 3 each).
       - If the loser cannot pay gold, they lose double points (so 10 points, split for republics as 5 each).
     - **Negotiate Treaty:** If there has been a war in the previous round or if they want to prevent one, they can propose a treaty. This takes time, so if they choose this, they cannot do other actions that round. The treaty must be written and signed by at least two delegations. Treaties can include: non-aggression, mutual defense, trade agreements, disarmament (limit army size), etc. BUT they can include secret reservations (written on a separate piece of paper and shown only to the referee). The treaty is public unless they specify it is secret (but then only the signatories know). The referee enforces the treaty? Actually, we want them to break it to show the problem. So enforcement is only by reputation? We'll say: if a delegation breaks a treaty, they lose 5 points (publicly) and the treaty is void. But they might do it if the gain is worth it.

  3. **Alliance/War Resolution (1 min):** Resolve any wars that were declared (using the battle system above). Alliances do not automatically trigger; they must be activated by the ally joining the war (so if A and B are allied and A declares war on C, B can choose to join or not). If they join, they are also at war.

  4. **End of Round Scoring (1 min):** 
     - Each delegation gets 1 point per resource unit they have (so holding resources is good, but they can trade them for points if they want to convert to points at the end of the game? No, we'll have a conversion at the end). 
     - Actually, we'll do: at the end of each round, they can convert resources to points (1 resource = 1 point, gold=2) or keep them for future use (like building armies). But if they don't convert, they risk losing them in war. We'll say: conversion must be done at the end of the round (so they choose how much to convert). Gold can be kept without risk (it's in banks?).

  **Game Flow:**
  - Round 1: Let them trade and build up. Probably no wars. Encourage alliances.
  - Round 2: Likely a war or two. Maybe a peace treaty after war? But it might have secret reservations.
  - Round 3: Treaty violations happen (secretly rebuilt army, or secret reservation). War breaks out again. They see the problem.
  - Round 4: They might try a broader treaty (like a federation). But note: the federation is only as strong as the members' commitment.

  **End of Game:** After 4 rounds, calculate points:
  - Each resource unit held: 1 point (gold: 2 points)
  - Each gold: 2 points
  - Plus any points they accumulated from previous conversions.

  But also, they might have lost points in wars.

  **Debrief (30 mins):**
  Map the game to Kant's text:

  1. **Preliminary Articles:**
     - Secret reservations: Did any treaty have a secret clause? How did that lead to collapse?
     - Standing armies: Did they build armies? How did that lead to tension? Kant says standing armies should be abolished.
     - Debt-financed war: In the game, they used current resources. But in reality, states borrow. We didn't simulate that. Point out that Kant warns against national debt for war.

  2. **Definitive Articles:**
     - First: Republican constitutions. How did republics behave differently? Did they go to war less? Because the cost was personal?
     - Second: Federation of Free States. Did they form a league? Did it work? Note: in the game, the federation had no enforcement power beyond the referee (you) enforcing the rules. But in reality, Kant says no coercive power above states. So how can it work? They see the problem.
     - Third: Cosmopolitan right (hospitality). Did they allow free trade? Did they restrict trade? In the game, trade was allowed, but perhaps not universal. Kant says strangers should not be treated with hostility.

  **What the game can't capture:**
  - The enforcement problem: In the game, you (the referee) enforce rules (like treaty violations cost points). But in reality, there is no world sovereign. Kant's federation is voluntary and has no enforcement mechanism. The game can't simulate that because you are the enforcer.

  **What might go wrong:**
  - Time: 10 mins per round might be tight. Keep an eye and cut short if needed.
  - Treaty negotiation: Might take too long. Limit the treaty phase to one treaty at a time? Or have a separate phase.
  - Some teams might be passive. Encourage action by having a time limit for decisions.
  - War might dominate. The point system should make war costly so they learn.
  - Republics might be slower to decide. That's intentional (to simulate deliberation).

  **Rules in British English:**

  **The Perpetual Peace Game**

  **Objective:** Accumulate as many points as possible through trade, alliances, and strategic actions, while avoiding the ruinous costs of war.

  **Setup:**
  - 12 students divided into 6 delegations (2 students each). Three delegations are autocracies (one decision-maker), three are republics (both must agree, and war costs are split individually).
  - Each delegation is assigned a territory with a specific resource, starting army, and gold (see table).
  - The map shows which territories are adjacent (design a simple map with 6 territories in a circle, so each has two neighbours).

  **Round Sequence (each round: 10 minutes):**
  1. **Resource Production (1 min):** Each delegation produces 2 units of their resource (Centrum produces 1 unit of Gold, worth 2 points if converted). 
  2. **Action Phase (7 mins):** Delegations take actions simultaneously (they write their actions on a slip and hand to referee, or announce). They can do one of the following:
     - **Trade:** Exchange resources or gold with another delegation. Public trade: announced to all. Private trade: only allowed between allies (if they have formed an alliance). 
     - **Build Army:** Spend 1 resource unit (any type) to gain 1 army point, or 2 gold to gain 1 army point. (Note: building an army does not cost points, but maintaining a large army might lead to war and then costs.)
     - **Form Alliance:** Publicly announce an alliance with one or more delegations. This allows private trade and mutual support (but note: supporting in war is optional). Alliances can be broken at any time with no in-game penalty (but reputation may suffer).
     - **Declare War:** Publicly declare war on another delegation. If the target has allies, they may join the war (their choice). Then resolve the battle:
       - Each side (attacker and defender, plus any allies who joined) rolls a 6-sided die and adds their total army points. 
       - Highest total wins. 
       - Loser: loses half their army (rounded down) and 5 points (for the delegation). Also, the winner takes 1 resource of choice from the loser (if available) and 5 gold (if available). If the loser doesn't have enough gold, they lose 10 points instead (or for republics, 5 points each if they can't pay the gold).
       - Republics: The 5-point loss is split between the two players (each loses 3 points). If they lose 10 points, each loses 5.
     - **Negotiate Treaty:** Delegations can propose a treaty. This action takes the whole round for the negotiators. The treaty must be written and signed by at least two delegations. It can include terms like non-aggression, mutual defense, disarmament (e.g., no building armies above a certain size), etc. 
       - Secret reservations: A delegation can attach a secret reservation (e.g., "we will not disarm" or "we will attack if they build an army"). This is written separately and shown only to the referee. 
       - Breaking a treaty: If a delegation breaks a treaty, they lose 5 points (publicly) and the treaty is void. The referee announces the breach and the point loss.
  3. **Alliance/War Resolution (1 min):** Resolve any wars declared. Referee conducts the die rolls and updates army sizes and points.
  4. **Conversion and Scoring (1 min):** Each delegation may convert any number of their resource units to points (1 resource unit = 1 point, 1 gold = 2 points). Resources not converted are kept for future rounds (but can be stolen in war). Gold is safe from theft? Let's say gold is stored and cannot be stolen (to simplify). Resources can be stolen.

  **End of Game:** After 4 rounds, the game ends. Delegations convert all remaining resources and gold to points. Add up total points. The delegation with the most points wins.

  **Debrief Guide:**

  1. Ask students to recount key moments: 
     - Did anyone sign a treaty? Did it have secret reservations? Did it collapse?
     - How did republics differ from autocracies in their decisions to go to war?
     - Did they form a federation? How did it work?

  2. Map to Kant:
     - **Secret Reservations:** Relate to Kant's preliminary article 1: "No treaty of peace shall be held valid in which there is tacitly reserved matter for a future war." The game collapse likely happened because of a secret clause.
     - **Standing Armies:** Preliminary article 3: "Standing armies shall in time be abolished." In the game, building armies was a way to prepare for war and led to an arms race. Kant argues this leads to ever-increasing war potential.
     - **War Debts:** Preliminary article 4: "National debts shall not be contracted with a view to the external affairs of the state." We didn't simulate debt, but in reality, states borrow for war, which burdens future generations. In the game, they used current resources, but if they had debt, it would be even worse.
     - **Republican Constitution (First Definitive Article):** Republics in the game had to internalise the costs of war (points lost by each student). This might have made them more cautious. Kant says that in a republic, citizens would be very cautious about war because they bear the costs.
     - **Federation of Free States (Second Definitive Article):** Did they form a league? Note that in the game, the league had no power to enforce; it relied on the referee. Kant's federation is voluntary and has no sovereign power, so how can it prevent war? It's a paradox.
     - **Cosmopolitan Right (Third Definitive Article):** Did they trade freely? Kant argues for the right of hospitality (trade and travel). In the game, free trade might have led to mutual benefit and peace.

  3. Limitations:
     - Enforcement: In the game, the referee enforced rules (like treaty breaches costing points). But in reality, there is no world enforcer. Kant rejects a world state because it would be despotic. So the enforcement problem remains.
     - The game is simplistic: real international relations are more complex.

  **Materials to Prepare:**
  - A map of 6 territories (draw on a poster or PowerPoint slide).
  - Delegation sheets (one per team) with their starting assets.
  - Action slips (for writing actions).
  - Treaty templates (with space for public terms and secret reservations).
  - Dice (one or two six-sided dice).
  - A scoreboard (to track points publicly).

  This should fit in 90 minutes and create the experiential learning you want. Good luck!
answer: |-
  Below is a complete game design for your Kant seminar, crafted to meet your objectives. I've refined your sketch into a structured, 90-minute experiential game called **"The Perpetual Peace Game"**. It uses asymmetric resources, constitutional mechanics, and escalating war costs to force students into designing Kantian solutions. The debrief explicitly ties game events to Kant's text. Rules are in British English as requested.

  ---

  ### **Game Overview**
  **Title:** The Perpetual Peace Game  
  **Objective:** Delegations accumulate "prosperity points" (PP) through trade/alliances. War is initially profitable but becomes ruinous, forcing players to design peace "machinery".  
  **Key Kantian Concepts Simulated:**  
  - Secret reservations in treaties  
  - Standing armies as a drain  
  - Debt-financed war unsustainability  
  - Republican vs. autocratic war incentives  
  - Federation as a voluntary league (not a world state)  
  - Hospitality (trade) as a peace catalyst  

  **Players:** 12 students → 6 delegations (2 students each).  
  **Constitutions:**  
  - **3 Autocracies:** One "ruler" decides unilaterally. War costs are paid from collective PP.  
  - **3 Republics:** Both students must agree on actions. War costs are **itemised individually** (e.g., a 6-PP war cost → each loses 3 PP).  
  **Map:** A hexagonal fictional map (display via PowerPoint/sketch). Each territory produces one resource:  
  | Territory | Resource | Starting Army | Starting Gold | Constitution |  
  |-----------|----------|---------------|--------------|-------------|  
  | Nordia   | Iron     | 6             | 10           | Autocracy   |  
  | Sudland  | Grain    | 4             | 12           | Republic    |  
  | Westria  | Timber   | 5             | 8            | Autocracy   |  
  | Eastisle | Fish     | 3             | 15           | Republic    |  
  | Centrum  | Gold     | 4             | 20           | Republic    | *(Gold worth 2 PP/unit)* |  
  | Ostreich | Oil      | 7             | 10           | Autocracy   |  

  **Resources:** Iron, Grain, Timber, Fish, Gold, Oil. 1 unit = 1 PP if traded/converted. Gold is worth 2 PP.  
  **Prosperity Points (PP):** The "win" condition. Earned via trade, resource conversion, or looting. Lost via war or treaty breaches.  

  ---

  ### **Rules & Materials**  
  **Materials Needed:**  
  - Map display (hexagons with territories, resources, and neighbours listed).  
  - Delegation cards (one per team): Summarises starting assets, constitution, and rules.  
  - Action slips (small paper squares for private actions).  
  - Treaty templates (paper with "Public Terms" and "Secret Reservations" sections).  
  - PP tracker (whiteboard with delegation names for public scoring).  
  - Dice (two six-sided).  

  **Round Structure (60 mins total):**  
  - **Setup (5 mins):** Assign delegations, explain rules, display map. Stress: "Your goal is PP. War is allowed but costly."  
  - **Rounds 1–3 (10 mins each):** Peace-building phase. Actions taken simultaneously via written slips.  
  - **Round 4 (15 mins):** Crisis phase (war escalates; treaty negotiations triggered).  
  - **Optional Round 5 (10 mins):** Federation design (if time allows).  
  - **Scoring & Debrief (20 mins).**  

  **Round Sequence (per 10-min round):**  
  1. **Resource Production (1 min):**  
     - Each delegation gains 2 units of their resource (e.g., Nordia gains 2 Iron).  
     - *Gold note:* Centrum gains 1 Gold (worth 2 PP).  
  2. **Action Phase (7 mins):** Delegations choose **one primary action** via secret slip (handed to you):  
     - **Trade:** Exchange resources with a neighbour. Publicly announce trades. *Hospitality rule:* Trade with non-neighbours costs 1 PP (simulates Kant’s "cosmopolitan right" friction).  
     - **Build Army:** Spend 2 resources → gain 1 army unit. *Standing army trap:* Armies cost 1 PP/unit at round end if not used in war (e.g., 5 armies = 5 PP drain).  
     - **Declare War:** Attack a neighbour. Costs 3 PP upfront (autocracies: collective; republics: itemised).  
       - *Battle:* Attacker + defender roll dice, add army sizes. Higher total wins.  
       - *Winner:* Gains 1 resource of choice + 5 PP.  
       - *Loser:* Loses half army (round down) + 5 PP (republics: itemised).  
     - **Form Alliance:** Public pact with 1–2 delegations. Allows free trade + shared wars (allies can join battles).  
     - **Negotiate Treaty (Round 4+ only):** Draft a public treaty with terms (e.g., "disarm to 3 armies"). *Secret reservations allowed:* Write hidden clauses (e.g., "except if Centrum builds armies") on a separate slip.  
  3. **Resolution (2 mins):**  
     - Resolve battles (roll dice publicly).  
     - Apply PP/army changes.  
     - Charge standing army costs (1 PP/unit).  
     - Update public PP tracker.  

  **War Payoff Scheme (Tempting Early, Ruinous Late):**  
  - **Early Game (Rounds 1–2):** War is profitable. Low PP loss (3 PP upfront), high reward (5 PP + loot). Armies small → low standing costs.  
  - **Late Game (Rounds 3–4):** War becomes ruinous. Standing army costs accumulate (e.g., 6 armies = 6 PP/round). Republics face itemised losses (e.g., a lost war costs each student 4 PP). Debt spiral: Losing gold/resources forces PP liquidation.  

  **Triggering Kant’s "Design Problem":**  
  - By Round 3, wars deplete PP. Autocracies often break treaties secretly; republics avoid wars due to personal costs.  
  - **Treaty Collapse:** Built into mechanics. Secret reservations (e.g., "We’ll disarm but rebuild armies") or truce-breaking trigger PP penalties (5 PP if caught), but the first treaty usually fails due to distrust.  
  - **Federation Emergence:** In Round 4/5, delegations must draft a "League of Nations" treaty:  
    - No world state: The league cannot appoint a sovereign (you, as referee, don’t enforce it).  
    - Terms must include: (1) No standing armies, (2) Open trade (hospitality), (3) Mutual defence.  
    - *Enforcement problem:* If a member breaks rules, the league must self-police (e.g., collective war).  

  ---

  ### **Predicted Flow & Timings**  
  - **Rounds 1–2 (20 mins):** Alliances form; small wars erupt (e.g., resource-rich Ostreich attacks Sudland). Autocracies build armies; republics trade. PP rise slightly for aggressors.  
  - **Round 3 (10 mins):** Standing army costs bite (e.g., Nordia loses 6 PP for armies). A peace treaty is signed (e.g., "Disarm to 4 armies"), but 1–2 delegations add secret reservations.  
  - **Round 4 (15 mins):** Secret reservations exposed (e.g., Ostreich rebuilt armies; war restarts). PP plummet in republics (itemised losses). Crisis forces a "federation" treaty.  
  - **Round 5 (Optional, 10 mins):** League treaty drafted. No referee enforcement → breaches likely.  
  - **Scoring (5 mins):** PP calculated. Autocracies often lead early; republics win late if peace holds.  

  ---

  ### **Debrief (15–20 mins)**  
  **Link Game Events to Kant’s Text:**  
  1. **"Preliminary Articles" (Game: Failed Treaties):**  
     - *Secret reservations:* "No peace treaty shall include secret clauses" (Art 1). Students see how hidden terms caused collapse.  
     - *Standing armies:* "Standing armies fuel endless war" (Art 3). PP drains made armies unsustainable → mirrors Kant’s "abolish them" argument.  
     - *Debt-financed war:* Not simulated, but note: "War debts burden the state" (Art 4). Ask: "How did PP depletion mimic national bankruptcy?"  

  2. **"Definitive Articles" (Game: Constitutional Machinery):**  
     - *Republican peace:* "War requires citizen consent" (1st Art). Republics avoided wars due to itemised costs → Kant’s "selfish actors won’t pay personal costs."  
     - *Federation not world state:* "A league with no sovereign power" (2nd Art). The league’s enforcement failures highlight Kant’s dilemma: peace requires design, not coercion.  
     - *Hospitality:* "Trade as pacifying" (3rd Art). Students who traded freely gained PP; those who restricted trade stagnated.  

  3. **Limitations & Kant’s Blind Spots:**  
     - **Enforcement Problem:** The game (and Kant) relies on a referee. Kant’s league has no sovereign → in reality, breaches go unpunished. Ask: "How could your federation self-enforce without me?"  
     - **Morality vs. Self-Interest:** Kant assumes rationality. The game proves peace emerges from selfishness, but ask: "Does this ignore Kant’s moral duty for peace?"  
     - **Scale:** The game simplifies war (dice rolls) and ignores non-state actors.  

  ---

  ### **What Will Go Wrong (And How to Fix)**  
  1. **Time Crunch:**  
     - *Risk:* Rounds overrun; treaty talks drag.  
     - *Fix:* Use a timer. Skip Round 5 if needed. Pre-print delegation cards with rules.  

  2. **Passive Players:**  
     - *Risk:* Republics stall on decisions; low-conflict game.  
     - *Fix:* Incentivise action. E.g., announce: "Centrum’s gold supply dwindles in 2 rounds—fight for it!"  

  3. **Treaty Chaos:**  
     - *Risk:* Students draft vague treaties; secret reservations overused.  
     - *Fix:* Provide a template: "We, [Delegations], agree to: ______ . Secret reservations: ______."  

  4. **Kant Link Missed:**  
     - *Risk:* Students see "fun game" but miss philosophy.  
     - *Fix:* During play, seed questions: "Why did your republic avoid war? Read Kant’s 1st Definitive Article later!"  

  5. **Enforcement Paradox:**  
     - *Risk:* Students rely on you (referee) to punish cheats, missing Kant’s point.  
     - *Fix:* In debrief, stress: "I acted as Kant’s ‘invisible hand’—but real leagues lack this. Why is that fatal?"  

  ---  
  This design ensures students experience Kant’s core thesis: peace is a mechanical outcome of institutions, not morality. The constitutional asymmetry, PP costs, and treaty failures will make Perpetual Peace feel like their own discovery. With tight timings and clear debrief links, it fits your 90-minute window. Let me know if you need refined materials or further adjustments!
