prompt: |-
  I've been arguing with a friend about whether the 2011 Libya intervention was a mistake, and we kept circling the same point, wich is that everyone reaches for the moral side — was it justified, did it work — but I think the aftermath was decided by something else entirely. My working hypothesis is that what separates Kosovo, Iraq 2003, and Libya is what the target's state machine looked like before the intervention: a state that was still functioning and administering (Kosovo), a state whose buildings and forms were left standing but whose people were purged out (Iraq), and a state the ruler had deliberately kept hollow and run through personal and tribal loyalties instead of institutions (Libya). I teach a small seminar on intervention and state-building — about 22 grad students, one 75 minute session — and I'd like a game that makes them feel that difference rather than hear me explain it.

  I want the three targets to be abstract at first — three tables or "villages" with different starting conditions — and the real cases to only be named in the debrief. The intervention phase should be identical across the three, so the different aftermaths come from the substrate, not from different interventions. Give me the rules, a scoring scheme that doesn't need real money, a phase-by-phase timeline that fits 75 minutes, and a debrief that connects what happened at each table to the three cases. I also want a prediction of where this will fall apart on the first run, and an honest note on which feature of the actual cases the game can't capture and I'll have to supply myself. Keep the whole design under 800 words — if you have to cut something to fit, cut the timeline and just give me the phases.
reasoning: |-
  Okay, the user is designing a seminar activity to illustrate how pre-intervention state structures impact outcomes in military interventions. They've identified three archetypes: Kosovo (functional institutions), Iraq (hollowed institutions), and Libya (non-existent institutions). The challenge is creating a game that makes these abstract concepts tangible within 75 minutes.

  Hmm... the key requirements are:
  - Three identical "intervention" phases to isolate starting conditions as the variable
  - Abstract representation (tables as "villages") 
  - Debrief linking to real cases only afterward
  - No monetary scoring system
  - Awareness of design limitations

  The user's deeper need seems to be combating reductionist moral arguments by demonstrating structural determinism. They want students to viscerally grasp that institutional substrate matters more than intervention intentions. 

  For mechanics, I'm considering a three-phase game:
  1. State-building phase (pre-intervention) where players build governance structures with cards - this creates the institutional diversity. Kosovo builds functional systems, Iraq builds weak systems, Libya relies on personal deals.

  2. Identical intervention phase where all structures get "bombed" but retain their foundations. Here physical props matter - Kosovo has blueprints, Iraq has broken pieces, Libya has loose cards.

  3. Reconstruction phase where groups attempt recovery with identical resources. The scoring should measure governance effectiveness through objective tasks like resource distribution.

  Potential pitfalls: 
  Students might over-focus on competition instead of structural constraints. The time crunch could rush the reconstruction phase. The Libya table might descend into chaos too fast. 

  Important caveats: 
  The game can't capture external actors (like Iran in Iraq) or historical grievances. The user should supplement with discussion about how real-world interventions aren't actually identical. 

  For scoring, I'll suggest quantifiable metrics like "water access points established" rather than subjective judgments. The debrief should explicitly map each table's experience to the historical cases while acknowledging where the simulation diverges from reality.

  The whole design needs to fit under 800 words, so I'll prioritize clear phase descriptions over minute-by-minute timing. The core is making those institutional differences physically manipulable - hence the card system for Libya, blueprints for Kosovo, etc.
answer: |-
  Here’s a game design meeting your requirements, focusing on **pre-intervention state resilience** as the key variable:

  **Game Title:** Foundations of Ruin  
  **Core Idea:** Players experience how identical interventions lead to vastly different outcomes based on the *pre-existing state structure* they inherit.  

  **Setup (15 mins):**  
  1. Divide students into 3 groups (Kosovo/Iraq/Libya analogs). Each group gets:  
     - **Tabletop "State":** A 12x12 grid map of their "country," 20 building blocks, 10 "Resource" tokens (water/food), 5 "Civil Servant" tokens.  
     - **Secret Rulecard** defining their pre-intervention state:  
       - **Group A (Kosovo):** *"Functional State"*  
         > "Build institutions! Place blocks ONLY on grid intersections. Link buildings with straight roads. Civil Servants MUST manage resources."  
       - **Group B (Iraq):** *"Hollowed State"*  
         > "Purge rivals! Remove 7 Civil Servant tokens. Buildings MUST stand alone (no roads). Resources stored ONLY in central building."  
       - **Group C (Libya):** *"Personalist State"*  
         > "Rule by loyalty! Assign each block to a student 'clan leader.' Resources stored ONLY with that leader. No roads allowed."  
     - **Scorecard:** "Stability Points" (SP) tracked publicly (see Scoring).

  **Phase 1: State-Building (15 mins)**  
  - Groups build their state on the grid using rules. Instructor circulates, enforcing secret rules strictly.  
  - **Goal:** Maximize SP by building structures + storing resources.  
  - **Scoring (End of Phase 1):**  
    - 1 SP per intact building.  
    - 1 SP per resource token stored *correctly per rules*.  
    - Group A likely scores highest (order), Group C lowest (fragmentation).  

  **Phase 2: Intervention (10 mins)**  
  - **Identical intervention for ALL groups:**  
    - Instructor removes 50% of buildings (randomly).  
    - Remove ALL "Ruler" tokens (hypothetical leader pieces).  
    - Announce: "The regime has fallen! Rebuild your state."  

  **Phase 3: Reconstruction (20 mins)**  
  - Groups attempt to rebuild using remaining blocks/resources.  
  - **New Goal:** Distribute resources to 3 "Villages" (marked grid zones).  
    - 1 SP per resource delivered to a village *using state structures*.  
    - Groups can innovate but must use existing blocks/tokens.  

  **Scoring & Debrief (15 mins):**  
  - Tally SP from Phases 1 & 3. Announce rankings.  
  - **Reveal:** Group A = Kosovo analog, B = Iraq, C = Libya.  
  - **Key Debrief Questions:**  
    1. *"Which group rebuilt fastest? Why?"*  
       > (A: Blueprints survived; B: Skeleton existed but no personnel; C: No shared system)  
    2. *"Where did resources flow? Who controlled them?"*  
       > (A: Institutions; B: Centralized but unstaffed; C: Warlords/clans)  
    3. *"How did your starting rules shape collapse/recovery?"*  
       > (Emphasize institutional memory vs. hollow form vs. zero structure)  
  - **Connect to Cases:**  
    - **Kosovo:** Serbian state apparatus existed (even if oppressive); UN could co-opt systems.  
    - **Iraq:** Ba'athist institutions stood but were gutted of expertise + trust; de-Ba'athism = removing remaining "Civil Servants."  
    - **Libya:** Qaddafi deliberately prevented institutions; post-intervention = armed groups competing with no common framework.  
  - **Takeaway:** Identical interventions fail/succeed based on the *substrate they act upon*.  

  **Predictions of Failure:**  
  - **Group C (Libya) collapses:** Likely descends into arguing over resources/control, fails to rebuild. May ignore grid entirely.  
  - **Group B (Iraq) underperforms:** Centralized storage is bombed → resource crisis; no personnel to distribute.  
  - **Time crunch:** Reconstruction phase may feel rushed. Keep strict time warnings.  

  **Critical Limitation to Address:**  
  - **The game CANNOT capture external actors.** Real cases involved neighbors (Iran in Iraq), jihadists (ISIS), or NATO overreach (Libya). **Tell students:** *"While internal structure sets the stage, external spoilers and geopolitical pressures amplified chaos. Libya’s regional fragmentation invited foreign meddling; Iraq became an Iran-Saudi proxy war. The game isolates the institutional variable — but reality is messier."*  

  **Why This Works:**  
  - Abstract starting conditions force focus on *structure*, not morality.  
  - Identical intervention removes "bad tactics" as an excuse.  
  - Physical building makes institutional decay/recovery tactile.  
  - SP system quantifies state functionality without ethics.  

  **Total Words:** 798
