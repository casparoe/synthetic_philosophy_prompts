prompt: |-
  I facilitate a community reading and theatre group for adults returning to literature after long breaks, and a puzzle about our emotional lives has stayed with me through several discussions with friends after rehearsals. During a recent stage thriller, my pulse raced through an extended chase scene even as I kept in mind that the performers were colleagues I had chatted with at intermission and that nothing was at stake, and silently rehearsing that fact did almost nothing to slow my breathing. A similar stickiness appears after novels: after spending a weekend absorbed in a long story about a family losing its home to a flood, I felt low for the rest of the afternoon while fully aware that no such family existed and that no loss had occurred. This contrasts sharply with everyday deception: when a friend recently told a vivid story about a coworker being dismissed and then admitted he had invented it to illustrate a point, my concern evaporated almost instantly and was replaced by mild irritation.

  Has philosophy or psychology settled on a name for this kind of lingering affective momentum that survives clear-eyed acknowledgement of fictionality, and if so, what are the closest neighboring ideas and how does this pattern differ from each in a way that lets me tell which label fits best? I do not want only a label; I want a careful carving of what the phenomenon is, what it is not, and where its edges lie, including why deliberate reminders fail here but succeed when a supposed real report is exposed as invented. If no established concept captures it exactly, please coin a concise term and define it with positive and negative boundary cases. Please answer in no more than 300 words.
reasoning: |-
  Okay, the user is describing a phenomenon where fictional stories evoke strong emotional responses that persist even after acknowledging their fictionality. They contrast this with real-life deceptions where emotions dissipate quickly once the deception is revealed. 

  Hmm, this is fascinating because it touches on the paradox of fiction - how can we feel genuine emotions for things we know aren't real? The user is clearly well-read and observant, noting how intellectual awareness fails to override physiological responses (racing pulse during theater) or lingering mood states (afternoon melancholy post-novel). 

  The key distinction they're highlighting is the persistence of affect despite cognitive correction. In psychology, we might consider this under "cognitive appraisal theory" - but that doesn't fully explain why the emotional response outlasts the reappraisal. The user's theater example is particularly telling: knowing the actors are safe colleagues doesn't calm their body's stress response. 

  For the deception contrast: when we discover a story was fabricated, our emotional investment was predicated on believing it was real. The foundation collapses entirely. But fiction operates differently - we willingly suspend disbelief while maintaining meta-awareness of its constructed nature. The emotion isn't contingent on factual truth. 

  I'm considering terms like "affective residue" or "emotional inertia" to capture this lingering quality. The closest established concept might be "suspension of disbelief" but that describes the entry into fiction, not the persistence of affect after intellectual correction. 

  The boundaries seem clear: 1) Unlike manipulation, this requires willing participation 2) Unlike false beliefs, correction doesn't dissolve emotions 3) Unlike moods, it's clearly traceable to a fictional stimulus. 

  The user wants precision - not just a label but defining features. They're clearly frustrated by how intellectual override works in deception but fails in fiction. This suggests they're seeking validation of their observation as a distinct phenomenon worthy of study. 

  Perhaps framing it as "fictional affective persistence" would serve best - specifying it survives explicit unreality acknowledgments. The contrast cases help: if correction eliminates emotion, it's not this phenomenon; if emotion persists without fictional context, it's something else.
answer: |-
  The precise phenomenon you describe—**lingering emotional responses persisting despite conscious acknowledgment of fictionality**—lacks a single established term but is actively studied. Here’s a careful conceptual carving:

  **Core Phenomenon:** **Fictional Affective Persistence (FAP)**  
  *Definition*: The sustained physiological/emotional impact of fictional narratives that resists cognitive override by reality checks. It arises from *embodied simulation* (automatic neural/physiological engagement with story events) and *narrative immersion* (temporary adoption of the story’s emotional logic).  

  **Boundaries & Contrasts:**  
  1. **VS. Suspension of Disbelief**: FAP endures *after* disbelief is reinstated. Suspension is the *entry* into fiction; FAP is the *residual effect*.  
  2. **VS. Real-Deception Dissolution**: When a "real" story is revealed as invented, emotion evaporates because the *grounding premise* (reality) is falsified. Fiction’s emotions are *never* reality-grounded—they emerge from simulation, so disconfirmation doesn’t apply.  
  3. **VS. Mood Congruence**: General sadness after fiction isn’t just mood; it’s *traceable* to specific narrative elements (e.g., the flooded home), unlike diffuse moods.  
  4. **VS. Emotional Contagion**: Unlike catching emotions from real people, FAP stems from *symbolic representation*, not direct social cues.  

  **Why Reality Checks Fail in Fiction (But Succeed in Deception):**  
  - **Fiction**: Emotions are generated by *embodied engagement* (mirror neurons, stress hormones). Cognition labels the source "unreal," but the body’s response must subside physiologically (e.g., cortisol metabolizing).  
  - **Deception**: Emotions rely on *belief in truth*. Revoking belief collapses the emotional architecture instantly.  

  **Negative Cases (Not FAP):**  
  - Feeling nothing during a tragic scene because you’re analyzing camera angles.  
  - Anger at a plot hole dissipating as soon as you close the book.  

  **Positive Cases (FAP):**  
  - Dread lingering after a horror film despite repeating "It’s not real."  
  - Grief after a novel’s character death, even while admiring the author’s technique.  

  FAP underscores emotion’s duality: it can be *cognitively informed* yet *physiologically independent*. Your experiences exemplify narrative art’s power to bypass intellectual gates and resonate somatically.
