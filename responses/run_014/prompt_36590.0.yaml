                A base: 12
                B base: 15

      **Final Design**:

        Standards: A and B.

        Round 1 and 2:
          Base: A=12, B=10
          Network: 10 per other group using the same standard.

        Round 3:
          Base: A=12, B=15
          Network: same.

        Switching cost: 5 points (if switching in Round 2 or 3).

        Groups: 4 groups of 3.

        Rounds:
          Round 1: choose A or B -> reveal distribution -> calculate payoffs.
          Round 2: stick or switch (with cost) -> reveal -> payoffs.
          After Round 2: announce: "Research now shows that Standard B is more efficient. Starting next round, the base payoff for B is 15, while A remains 12."
          Round 3: stick or switch (with cost) -> reveal -> payoffs.

        Debrief as above.

      **What the game cannot reproduce**:
        - Real historical actors do not have common knowledge of the payoff structure. They might not know the benefits of a standard until they try it, and they don't know the future.
        - The game has only two standards, but history often has many competing options.
        - The game has discrete rounds, but history is continuous.
        - The game has a fixed and known switching cost, but in reality, switching costs are uncertain and might change over time.
        - The twist (the change in base payoff) is exogenous and unexpected. In history, technological changes are often endogenous and anticipated.

      We must mention these limitations in the debrief.

