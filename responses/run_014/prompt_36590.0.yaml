answer: |-
  Below is a complete, runnable 90-minute seminar game designed to force an experiential encounter with path dependence vs. convergence, followed by a structured debrief. The design prioritizes low-tech materials, clear turning points, and unavoidable tensions between lock-in and convergence logics.

  ---

  ### **Game Title**: *The Bridge Builders*  
  **Core Dynamic**: Groups adopt competing engineering standards for building paper bridges. Payoffs combine *private efficiency* (how well their bridge holds) and *interoperability* (how well their bridges connect to others’). Early coordination creates self-reinforcing advantages, but a mid-game twist reveals the dominant standard is structurally inferior.

  ---

  ### **Materials**  
  - **Per Group (4 groups total)**:  
    - 10 sheets of letter paper  
    - 12 paperclips  
    - 1 ruler  
    - 1 token board (cardboard with slots labeled 1–4 for tracking "alliance" choices)  
  - **Classwide**:  
    - Weight-testing kit (e.g., textbooks + basket for adding weight)  
    - Whiteboard tracking: (1) Groups per standard, (2) Cumulative points  

  ---

  ### **Standards**  
  Three bridge designs (visual aids provided *without* performance specs):  
  - **ARCH**: Roll paper into tubes, use arches.  
  - **BEAM**: Fold paper into flat beams, layered.  
  - **CABLE**: Paper strips braided into cables, suspended from paperclip hooks.  

  *(Secret performance specs)*:  
  - **Private efficiency** (max weight held alone): ARCH 8kg, BEAM 5kg, CABLE 3kg.  
  - **Interoperability bonus**: +1kg per *allied group* using the *same standard*.  
  - **Switching cost**: Groups lose 2kg capacity for 1 round if changing standards.  

  ---

  ### **Group Structure**  
  - 4 groups of 3 students (e.g., Group 1, 2, 3, 4).  
  - Each group has: *Designer* (builds bridge), *Diplomat* (forms alliances), *Recorder* (tracks points).  

  ---

  ### **Round-by-Round Rules**  
  **Total Rounds**: 4 (each 8 mins, timed strictly).  
  - **Pre-Round Choice**: Groups secretly choose a standard (ARCH/BEAM/CABLE) and up to 1 alliance partner (using tokens).  
  - **Build Phase (4 mins)**: Build a bridge using their standard.  
  - **Test Phase (4 mins)**:  
    1. *Private test*: Measure max weight held alone (efficiency).  
    2. *Alliance test*: If allied groups use the *same standard*, combine bridges; measure max weight as a connected system.  
    3. **Payoff** = (Private weight) + (Allied weight) - (Switching cost, if applicable).  
  - **Whiteboard Update**: Post groups’ standards, alliances, and payoffs.  

  ---

  ### **Twist: "Revealed Inferiority"**  
  - **Timing**: After Round 2 results are posted.  
  - **Reveal**: *"Engineering report: ARCH bridges (if dominant) degrade faster. Long-term, BEAM is 30% more durable. CABLE is easiest to repair locally."*  
  - **Mechanic**: No rule change—just information. BEAM’s *private efficiency* was undersold initially (actual: 7kg, not 5kg), but this is only revealed if BEAM is minority post-Round 2.  

  ---

  ### **Timeline (90 mins)**  
  1. **Set-up (10 mins)**:  
     - Form groups, assign roles.  
     - Distribute materials.  
     - Explain only: *"Goal: Maximize bridge strength. Choose a design and partners each round. Strength comes from your build and your connections."*  
     - **NO theory terms** (e.g., no "path dependence").  

  2. **Round 1 (8 mins)**:  
     - Groups choose standard + 0 alliances (can’t ally yet).  
     - Test: Private weight only (e.g., ARCH=8kg).  
     - *Expected dynamic*: Groups fragment; ARCH likely wins individual tests.  

  3. **Round 2 (8 mins)**:  
     - Groups choose standard + 1 alliance.  
     - Test: Private weight + alliance bonus (if same standard).  
     - *Expected dynamic*: Early ARCH adopters ally; snowball begins.  

  4. **Twist (2 mins)**:  
     - Announce ARCH’s flaw + BEAM’s true efficiency (if ARCH dominant).  

  5. **Round 3 (8 mins)**:  
     - Same rules. Groups react to twist.  
     - *Expected dynamic*: Minority groups may switch to BEAM/CABLE; ARCH groups resist due to alliance bonuses/switching costs.  

  6. **Round 4 (8 mins)**:  
     - Final chance to switch/ally.  

  7. **Debrief (46 mins)**:  
     - Scaffolded discussion (script below).  

  ---

  ### **Predicable Problems & Fixes**  
  1. **Problem: Instant Coordination Out of Politeness**  
     - *Fix*: Enforce secret standard choices (slips handed to you). Ban inter-group talk during choices.  
  2. **Problem: One Group Sandbags by Choosing Weak CABLE**  
     - *Fix*: If CABLE holds <3kg, audit build—likely poor execution, not strategy. Allow rebuild. If intentional, note in debrief: "Did anyone reject a viable standard to be contrarian? Real actors have motives beyond efficiency."  
  3. **Problem: Alliances Ignore Standards**  
     - *Fix*: Only allow alliances *if* same standard. Enforce via token board (Diplomat slots tokens only into groups with matching standards).  
  4. **Problem: ARCH Not Dominant by Twist**  
     - *Fix*: If BEAM/CABLE lead, invert twist (e.g., *"BEAM corrodes in humidity"*). Keep the *logic* consistent: dominant standard has hidden flaw.  

  ---

  ### **Debrief Script**  
  **Goal**: Force clash between lock-in and convergence interpretations using game events. Delay theory terms until Phase 2.  

  **Phase 1: Reconstruct History (15 mins)**  
  - *Q1*: "Map the turning points. When did ARCH/BEAM/CABLE gain traction?"  
  - *Q2*: "Which choices felt accidental? Which felt inevitable?"  
  - *Q3*: "After the twist, why did/didn’t you abandon ARCH?" (Surface: switching costs, lost alliances).  
  - **Record answers** on whiteboard.  

  **Phase 2: Counterfactual Collision (15 mins)**  
  - *Lock-in Position*: "If we reran this, starting from Round 1, could we avoid ARCH? Why?" (Anchor to early accidents: e.g., "Group 2’s quick ARCH win in Round 1 made others copy them").  
  - *Convergence Position*: "Even if Group 2 chose BEAM, wouldn’t we still have a working system? Why?" (Anchor to underlying forces: e.g., "ARCH’s early advantage was real; BEAM only caught up later").  
  - *Push*: "Was there a point of no return? When?"  

  **Phase 3: Map to Theory (15 mins)**  
  - Introduce terms:  
    - **Path dependence** = "Early accidents locked us in" (e.g., Round 1 ARCH win).  
    - **Convergence** = "We’d have a bridge either way" (e.g., all standards *worked*, just differently).  
    - **Switching costs** = Penalty for changing standards.  
    - **Network effects** = Alliance bonus.  
  - *Q*: "Which moments embodied these? How?"  
  - **Reveal hidden specs**: "Did knowing payoffs change your choices? Real actors lack this!"  

  **Phase 4: Real-World Gaps (1 min)**  
  - Acknowledge:  
    - Real standards compete with >3 options.  
    - Real payoffs are unknown/contested.  
    - Real actors have values beyond efficiency (e.g., ethics, aesthetics).  

  ---

  ### **What the Game Cannot Simulate (Supply Verbally)**  
  1. **Asymmetric Information**: Students knew exact payoffs; historical actors rarely do.  
  2. **Ambiguous Standards**: Real standards (e.g., "democracy") are fuzzier than ARCH/BEAM/CABLE.  
  3. **Exogenous Shocks**: The twist was a clean revelation; real discoveries are messier.  
  4. **Power Imbalances**: All groups had equal weight; real standards often reflect hegemony.  

  ---

  ### **Why This Design Works**  
  - **Experiential Lock-in**: Switching costs + alliance bonuses make inertia *felt*.  
  - **Twist Timing**: Mid-game reveal avoids endgame rationalizations.  
  - **Debrief Structure**: Counters students’ natural convergence bias by spotlighting decisive accidents.  
  - **Low Abstraction**: Paper bridges make network effects tactile ("your hooks didn’t fit my beams!").  

  Run this, and the tension between "one lucky ARCH win changed everything" and "we’d have a bridge anyway" will rage long after class.
