  I'm in a game theory course right now and there's one distinction I just cannot get a handle on, and my professor keeps saying it's "the whole point" so I'd really appreciate someone actually explaining it to me instead of just handing me the definition again. It's about iterated elimination of dominated strategies, specifically the difference between eliminating strictly dominated strategies versus weakly dominated ones, and why everyone always emphasizes that the dominating strategy is allowed to be a mixed strategy (a probability distribution over your other pure strategies) in the strict case.

  I've got three related things tangled up in my head. One: I thought "strictly dominated" just meant some single pure strategy of mine beats it no matter what the opponent plays, so why do we need to allow the beating strategy to be a mix? I have a vague feeling there are strategies that no one pure strategy beats on its own, but some combination of your pure strategies does, and I can't reconstruct either an example or the logic for why that's even possible. Two: I keep seeing the claim that a pure strategy is strictly dominated by some mixed strategy if and only if it's a "never a best response" (meaning no belief the opponent could hold over their strategies makes it a best response), and I don't actually see why that equivalence is true, or why it's supposed to be the deep fact here. Three: why is iterated elimination of strictly dominated strategies (in mixed) order independant and safe to do, but the same process for weakly dominated strategies is order dependent and can literally delete a Nash equilibrium? I suspect the answer is that a weakly dominated strategy can still be a best response in some edge case where you're indifferent, but I can't make that precise or see how it breaks order independence.

  Could you walk me through all of this properly? I'd really like a small concrete game or two to anchor it, because the abstract definitions just blur together for me. Basically I want to understand the "never a best response" equivalence and why that's exactly what makes the strict version well behaved while the weak version is not.
