  Breaking down the challenges: Internalists claim externalists can't explain how disconnected reasons motivate. Externalists say internalists can't account for categorical moral obligations. The SDR aims to bridge this by showing moral reasons emerge from idealized deliberation. But critics argue that if you modify the agent's psychology too much, it's no longer internal. For example, if an agent's current set includes harmful desires, SDR might require such a drastic change that the resulting motivation isn't truly based on original motivations.

  Also, the externalist's categorical reason critique is strong. If moral reasons depend on contingent motivations, how do we explain obligations towards others when an agent lacks relevant desires? Internalists might respond that empathy or social desires, when properly reasoned, can ground these. But some might not have such desires at all. Does SDR handle that?

