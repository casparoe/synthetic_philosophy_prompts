answer: |-
  The damp Yorkshire cold was already creeping into the bones of the building. Maya sighed, rubbing a hand over her tired face, the fluorescent lights of the Leeds North Community Foodbank storeroom humming overhead. The walk-in fridge, a hulking, wheezing beast against the back wall, was dying. A technician’s scrawled estimate lay on her makeshift desk: £4,000 for a new compressor before winter truly bit. Without it, the donations of fresh produce, the dairy, the meat – enough to reliably feed two hundred local families through the bleakest months – would spoil. Certainty.

  Then there was the envelope. Crisp white, containing a cheque for exactly £4,000. An unexpected, almost miraculous legacy from a long-forgotten aunt. It felt like fate handing her the solution. Until yesterday.

  Daniel was a final-year Economics student, bright-eyed and radiating the kind of confidence that came from never having had to choose between heating and eating. He’d arrived with a polished presentation on his laptop, talking fast about stochastic modelling and predictive AI frameworks. His prototype, he claimed, analysed complex agricultural and climatic data to predict regional famine triggers *years* in advance.

  "The potential is *colossal*, Maya," he'd enthused, leaning over her desk. "With proper funding and development, scaling this up… we’re talking about identifying crises before they become catastrophes. Early intervention saves orders of magnitude more lives than reactive aid."

  He’d paused, sensing her scepticism. "Look, I know it sounds big. But the maths… the *expected value*… it’s undeniable." He pulled out a notepad.

  "Right now, my model’s crude. The probability of it successfully scaling to the point where it prevents a major famine? Realistically, low. Let’s be ultra-conservative: one in five million."

  Maya raised an eyebrow. "One in five *million*?"

  "Worst-case estimate! But the payoff if it *does* work?" Daniel’s eyes gleamed. "Conservative estimates suggest preventing a single major famine could save around two million lives. Two *million*." He started scribbling:

  *   **Cost:** £4,000
  *   **Probability of Success (p):** 1 / 5,000,000 = 0.0000002
  *   **Benefit if Successful (B):** 2,000,000 lives saved
  *   **Expected Value (EV) = p * B:** 0.0000002 * 2,000,000 = **0.4 lives saved**

  "See?" Daniel tapped the figure. "Expected value is 0.4 lives saved. Now, compare that to the fridge."

  He wrote again:

  *   **Cost:** £4,000
  *   **Probability of Success:** 1 (Certainty)
  *   **Benefit:** Feeds 200 families reliably through winter. Preventing malnutrition, illness… conservatively, let’s say it significantly safeguards the health and well-being of, say, 600 individuals? But translating directly to 'lives saved' is harder. Maybe it prevents a handful of severe health crises? Let’s be *very* generous and say it *definitely saves* the equivalent of **1 life**."

  He underlined it.

  "So," Daniel concluded, leaning back, the logic seeming to hang pristine in the air between them. "The fridge gives you a *certain* benefit valued at 1 life saved. My project has an expected value of 0.4 lives saved. Close, right? But expected value maximisation says you should *always* choose the option with the highest EV, regardless of the probability, as long as it’s positive. And it *is* positive. It’s rational. And this is my *ultra*-conservative estimate! With slightly better odds, or a larger potential famine impact – both plausible – the EV easily surpasses the fridge’s benefit. That £4,000 *could* save two million lives. Doesn't the sheer scale of the potential upside demand we try, however small the chance? Isn't ignoring that tiny probability… irrational fanaticism *against* the big win?"

  In the sterile glow of the laptop screen, surrounded by stacked tins of beans, the argument had possessed a chilling, crystalline logic. The numbers sat there: 0.4 > 1? No, p*B = 0.4, and the *certain* benefit was 1. But the *potential* B was so astronomically large… it pulled, like a gravitational force. Sacrificing the certain good for the near-zero chance of an astronomical one felt less like madness and more like a grim, necessary duty dictated by pure reason. For a dizzying moment, Maya saw it: a future where her £4,000, vanishing into the infinitesimal probability cloud, somehow ignited a chain reaction preventing oceans of suffering far beyond the streets of Leeds. The fanaticism of the expected value maximiser: bowing to the logic of the long tail, however thin.

  That was yesterday. Now, the cheque felt heavy in her pocket. The fridge groaned, a deeper, more rattling sound than before. She walked out into the main hall, prepped for the afternoon distribution. The usual queue snaked towards the door – weary faces, worn coats, mothers trying to quieten fractious toddlers. Mrs Henderson, whose arthritis flared terribly in the cold, gave her a thin smile. "Alright, love? Heard the fridge's poorly. Hope it's not the dairy, our Liam lives on that yoghurt." Old Tom, who lived alone in a damp flat, shuffled forward, clutching his reusable bag. "Got any of them tinned stews left, Maya? Proper warms you up."

  Maya watched them. Saw the immediate, tangible need etched in the lines around their eyes, the practical relief when they received a bag of food. Fixing the fridge meant Mrs Henderson’s grandson got his calcium. It meant Old Tom got hot meals that might stave off pneumonia in his cold flat. It meant two hundred families wouldn’t face the gnawing anxiety of empty cupboards on the darkest days. It meant stability, dignity, a bulwark against the encroaching chill. *This* was the certain good. The value of ‘1 life saved’ Daniel had scribbled felt grotesquely abstract now. These were six hundred real people, their faces, their names, their quiet struggles unfolding right here, right now.

  The fanatical pull of the astronomical expected value suddenly felt monstrously absurd. Sacrificing *this* – the immediate, certain prevention of hardship for people she saw every week, people in her community, people whose kids went to the local school – for a one-in-five-million shot at being a footnote in some future humanitarian triumph? A triumph delivered by a student prototype? It wasn’t just risky; it felt like a betrayal. A betrayal grounded in a logic that, while mathematically coherent in a vacuum, dissolved into meaninglessness when faced with the smell of damp coats, the sound of a hungry child, the palpable relief in a pensioner's eyes when handed a bag of food. The sheer *unlikeliness* of Daniel’s project succeeding wasn’t just a number; it was the chasm between his polished presentation and the gritty reality of mould in the flat above the kebab shop on Kirkgate.

  Back in the storeroom, the humming fluorescent light seemed louder. The technician’s estimate lay next to Daniel’s scribbled calculations. The cheque burned in her pocket. The fanatical argument still echoed: *0.4 > 1? Potential trumps certainty when the stakes are high enough.* The cold certainty of the failing fridge pressed in from the walls. Maya stood frozen between the relentless logic of the infinitesimal chance and the undeniable weight of the present need, the envelope a heavy, impossible choice in her hand. Outside, the queue shuffled forward, waiting. The only sound was the fridge’s failing heart, rattling its death throes into the chilly air. Maya didn’t move. The envelope stayed in her pocket. The repair bill lay on the desk. The future, vast and uncertain, pressed down, while the immediate cold of Leeds winter seeped relentlessly through the thin walls.
