answer: |-
  Here’s your Moral Uncertainty Sorting Quiz! I designed it to be concrete, jargon-free, and focused on the key distinctions you wanted (treating moral uncertainty like factual uncertainty, tiny credences in high-stakes views, and compromising vs. picking winners). I included your three dilemmas and built the rest from the "logical space" of moral uncertainty—starting with core principles and mapping them to real choices. The quiz has 8 questions with 2–3 options each, and the scoring key sorts people into five buckets based on their answer patterns. I’ve flagged edge cases and limitations at the end.

  **How it works:**  
  - **No prior knowledge needed:** Scenarios are everyday dilemmas (food, jobs, tech, etc.).  
  - **Answers reveal tendencies:** Choices correlate with underlying approaches, not self-reported labels.  
  - **Scoring is transparent:** Tally your answers at the end to find your bucket.  

  ---

  ### **The Moral Uncertainty Sorting Quiz**  
  *For each scenario, pick the reaction that feels most reasonable to you. Don’t overthink it—go with your gut!*  

  1. **Shrimp paste dilemma**  
     You’re at a restaurant with friends. A dish you’re excited about has shrimp paste. You’re 70% sure shrimp don’t matter much (so it’s fine), but 30% sure factory-farmed shrimp is as bad as child labor.  
     - **A) Order it.** The chance it’s awful isn’t high enough to ruin your meal.  
     - **B) Skip it.** The 30% risk of supporting something horrific isn’t worth it.  

  2. **Chatbot companion dilemma**  
     You built an AI chatbot companion for your kid. Running it costs $50/month. You’re 90% sure it’s just code, but 10% worried it might be sentient (so deleting it would be like killing a friend).  
     - **A) Delete it.** The chance it’s sentient is low—$50/month isn’t worth the tiny risk.  
     - **B) Keep it running.** Even a 10% risk of “killing” it is too much to chance.  
     - **C) Keep it but run it on cheaper servers.** It’ll be slower and clunkier, but cuts costs without fully deleting it.  

  3. **Factory farm job dilemma**  
     You’re offered a well-paid job making a factory farm more efficient. You’re 80% sure this work is fine (like optimizing a factory), but 20% worried it’s as bad as supporting slavery.  
     - **A) Take the job.** It’s likely fine, and the pay is life-changing.  
     - **B) Decline it.** A 20% risk of being complicit in something evil is too high.  
     - **C) Take the job but donate 20% of your salary to animal welfare.** Balances the risk with doing some good.  

  4. **The beef burger gamble**  
     You’re craving a beef burger. You’re 99% sure beef is fine, but 1% worried it’s as bad as torturing a cow for an hour. The burger would make your day better.  
     - **A) Eat it.** A 1% chance of torture isn’t enough to skip something this small.  
     - **B) Skip it.** Even a tiny risk of torture isn’t worth it—better safe than sorry.  

  5. **Charity donation split**  
     You have $1,000 to donate. You’re torn:  
     - 60% sure only *human-focused charities* matter (helping 10 kids).  
     - 40% sure only *animal-focused charities* matter (helping 100 animals).  
     - **A) Donate all to humans.** It’s slightly more likely this is the right call.  
     - **B) Donate all to animals.** You lean toward this view, even if it’s less probable.  
     - **C) Split 50/50.** Hedge your bets since you’re unsure.  

  6. **The mystery mushroom**  
     You find a wild mushroom. You’re 60% sure it’s safe and tasty, but 40% sure it’s poisonous and could hospitalize you.  
     - **A) Eat it.** Probably fine, and you’re hungry!  
     - **B) Skip it.** A 40% risk of poisoning is reckless.  

  7. **The prayer habit**  
     You’re 0.1% convinced skipping daily prayer will send you to hell, but 99.9% sure it’s harmless. Praying daily is boring and takes 5 minutes.  
     - **A) Pray daily.** A 0.1% hell-risk isn’t worth ignoring.  
     - **B) Don’t pray.** Such a tiny risk doesn’t justify the hassle.  

  8. **The protest vote**  
     You’re voting on a policy that could help your community. You’re 51% sure it’s fair and good, but 49% worried it’s biased and harmful.  
     - **A) Vote YES.** It’s slightly more likely to be good.  
     - **B) Vote NO.** The near-50% risk of harm is too close to call.  
     - **C) Abstain.** Stay neutral since it’s almost a toss-up.  

  ---

  ### **Scoring Key**  
  Tally your answers below. Each letter corresponds to one of the five "buckets":  
  - **A** = Maximize Expected Choiceworthiness (MEC)  
  - **B** = Play It Safe / Avoid Worst Case (SAFE)  
  - **C** = Split the Difference / Parliament Style (COMP)  
  - *(Note: "Just go with your favorite theory" (FAV) and "Deny the problem" (DENY) are inferred from patterns—no single letter!)*  

  | Question | If you chose... | Score for: |
  |----------|-----------------|------------|
  | 1        | A | MEC or DENY/FAV |  
  |          | B | SAFE |  
  | 2        | A | MEC or DENY/FAV |  
  |          | B | SAFE |  
  |          | C | COMP |  
  | 3        | A | MEC or DENY/FAV |  
  |          | B | SAFE |  
  |          | C | COMP |  
  | 4        | A | MEC or DENY/FAV |  
  |          | B | SAFE |  
  | 5        | A | DENY or FAV (for humans) |  
  |          | B | MEC or FAV (for animals) |  
  |          | C | COMP |  
  | 6        | A | DENY or FAV |  
  |          | B | MEC or SAFE |  
  | 7        | A | SAFE |  
  |          | B | MEC or DENY/FAV |  
  | 8        | A | DENY |  
  |          | B | SAFE |  
  |          | C | COMP |  

  #### **How to interpret your bucket**  
  Count your scores from the table above, then find your dominant pattern:  

  1. **Maximize Expected Choiceworthiness (MEC)**  
     - **You treat moral uncertainty like math:** Weigh probabilities and stakes, then pick the action with the best "expected value."  
     - **Key signs:** Mostly A’s in Q4, Q5, Q7, and B in Q6. You’ll eat the burger (Q4A) since 1% risk is trivial, but skip the mushroom (Q6B) because 40% poisoning is too high. In Q5, you donate to animals (B) because 40% chance × high stakes > 60% chance × lower stakes.  
     - **Real work:** Tiny credences only matter if stakes are massive (e.g., prayer in Q7B isn’t worth it).  

  2. **Just Go With Your Favorite Theory (FAV)**  
     - **You pick a side and stick with it:** Ignore probabilities—act as if your preferred theory is true, even if it’s less likely.  
     - **Key signs:** Consistent loyalty to one "side" across dilemmas, *especially against probabilities*. For example:  
       - Always prioritize humans (Q5A even with 40% animal view) or animals (Q5B with 60% human view).  
       - In Q3, you take the job (A) or decline (B) based on your core belief, not the 80/20 split.  
     - **Real work:** You reject weighing probabilities—your favorite theory "wins," even with tiny credences (e.g., delete the chatbot in Q2A despite 10% sentience risk).  

  3. **Play It Safe / Avoid Worst Case (SAFE)**  
     - **You’re risk-averse:** Avoid actions that could be catastrophic under any plausible theory, even if unlikely.  
     - **Key signs:** Mostly B’s in Q1, Q2, Q3, Q4, Q6, Q7, Q8. You skip the shrimp (Q1B), keep the chatbot (Q2B), and pray daily (Q7A) because worst-case outcomes (child labor, "killing" sentience, hell) are unacceptable.  
     - **Real work:** Tiny credences dominate if stakes are high (e.g., 1% torture risk in Q4B stops you from eating beef).  

  4. **Split the Difference / Parliament Style (COMP)**  
     - **You compromise:** Blend theories or avoid extremes by finding middle-ground actions.  
     - **Key signs:** C’s in Q2, Q3, Q5, or Q8. You keep the chatbot on cheap servers (Q2C), take the job but donate (Q3C), or split donations (Q5C).  
     - **Real work:** You reject "winner-takes-all"—e.g., compromising in Q3C even with 80% certainty.  

  5. **Deny the Problem (DENY)**  
     - **Uncertainty doesn’t change much:** Act as if your best guess is definitely true, ignoring probabilities.  
     - **Key signs:** A’s in Q1, Q5, Q6, Q8 and B in Q7. You order shrimp (Q1A) because 70% > 50%, eat the mushroom (Q6A) since 60% is "probably fine," and vote YES (Q8A) with 51% certainty.  
     - **Real work:** You reject moral uncertainty as special—it’s just like being "a little unsure" (e.g., prayer in Q7B is skipped because 99.9% > 0.1%).  

  ---

  ### **Edge Cases and Limitations**  
  - **Combos that don’t map neatly:**  
    - **Mixing SAFE and COMP (e.g., Q2C + Q3B + Q4B):** Likely a coherent but unexplored "cautious compromiser" who avoids worst cases but compromises when possible.  
    - **Mixing DENY and MEC (e.g., Q1A + Q4A + Q5A + Q6B):** Incoherent. DENY ignores probabilities, while MEC weighs them—so choosing both suggests inconsistency.  
    - **Frequent FAV without a clear "side" (e.g., Q5B + Q3A):** Unclear if this is FAV or noise. FAV requires *consistent* loyalty (e.g., always pro-animal).  

  - **Buckets the quiz can’t separate perfectly:**  
    - **FAV vs. DENY:** If your "favorite theory" aligns with the highest probability (e.g., always picking 60%+ options), FAV and DENY look identical. The quiz only flags FAV if you *override* probabilities (e.g., Q5B with 60% human view).  
    - **MEC vs. SAFE in moderate risks:** They overlap in dilemmas like the mushroom (Q6B) or job (Q3B), where avoiding risk is both mathematically prudent (MEC) and precautionary (SAFE).  

  - **Why these distinctions?**  
    - **Ordinary vs. moral uncertainty:** Q6 (mushroom) is factual risk; others are moral. DENY/MEC treat them similarly (e.g., Q6A = risky in both). SAFE treats moral uncertainty as scarier (e.g., Q1B but Q6A).  
    - **Tiny credences:** Q4 and Q7 test if 1–0.1% risks dominate (SAFE), are weighed (MEC), or ignored (DENY/FAV).  
    - **Compromise vs. pick winners:** Q2/Q3/Q5 test if you split the difference (COMP) or side with one theory (others).  

  ---

  **How to use this:** Run the quiz at your dinner club! Have everyone answer independently, tally their buckets, then discuss. It’ll kickstart your moral uncertainty debate with concrete examples—no jargon required. If you need tweaks (e.g., more factory-farm dilemmas), let me know. 👩🍳
