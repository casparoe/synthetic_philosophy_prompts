answer: |-
  ## Defending Occurrent Competence: A Necessary Condition for Valid Consent

  Your thesis targets a critical flaw in the standard tripartite model of competence (understanding, appreciation, communication) by demanding *actual cognitive engagement* at the moment of consent. This is a sophisticated and defensible position grounded in a robust conception of autonomy. Here is the strongest case for it, presented with philosophical rigor:

  **Thesis:** Valid consent requires not merely the *dispositional capacity* for understanding, appreciation, and communication, but also the *occurrent competence* to hold relevant considerations in mind and weigh them in a minimally coherent way at the moment of decision. The standard model sets the bar too low by neglecting this occurrent requirement, potentially invalidating consent in common situations involving intoxication, intense emotion, or acute pressure.

  **Core Argument: Autonomy Requires Actual Reasoning, Not Mere Capacity**

  1.  **The Foundational Value: Autonomous Authorization:** The primary moral justification for requiring consent is respect for personal autonomy. Valid consent constitutes an *authorization* grounded in the agent's own values, goals, and reasons. Mere passive acquiescence or a choice made without conscious integration of relevant factors is not an authentic expression of self-governance (Beauchamp & Childress; O'Neill).

  2.  **The Failure of Dispositional Capacity Alone:** The standard model ensures the agent *could*, under ideal conditions, reason effectively about the decision. However, autonomy requires the decision *actually* to be *made* based on that reasoning capacity being actively engaged. A choice made while the agent's capacity is temporarily suspended, bypassed, or overwhelmed by internal or external forces does not reflect their considered will, even if the underlying capacity remains intact. It is the *exercise* of autonomy, not just its potential, that matters for authorization (Faden & Beauchamp; Meyers).

  3.  **Defining Occurrent Competence:** This requires, at the moment of consent:
      *   **Conscious Access:** Relevant facts and consequences must be actively present in the agent's working awareness (not merely stored in memory).
      *   **Minimal Coherence:** The agent must engage in a basic, non-delusional process of relating these considerations to each other and to their own values/desires. This does not demand optimal rationality, flawless weighting, or exhaustive consideration, but it precludes decision-making that is fragmented, wildly inconsistent with stable values, or driven *solely* by overwhelming impulse or affect without any countervailing deliberation.
      *   **Connection to Choice:** The resulting choice must demonstrably flow *from* this engaged consideration, not merely coincide with it.

  4.  **The Threshold Argument:** Opponents might claim the standard model *implicitly* includes occurrent competence. However, its explicit criteria focus on *ability* (understanding, appreciation as a *capacity*), not *actualization*. Legal and medical standards often operationalize competence dispositionally (e.g., "Is this person generally capable?"). Explicitly requiring occurrent competence sets a higher, necessary threshold for genuine authorization.

  5.  **Implications and Paradigm Cases:** The occurrent competence requirement explains why consent is invalid in cases the standard model might struggle with:
      *   **Severe Intoxication:** An individual may *retain* the abstract capacity to understand facts (e.g., "Sex involves penetration") but be utterly unable to *hold* the potential consequences (STIs, pregnancy, emotional impact) in mind, weigh them against immediate desire, or connect them coherently to a choice. Their decision-making is fragmented and impulsive.
      *   **Overpowering Emotion (Panic, Rage, Grief):** Someone consumed by panic might technically "understand" the risks of a medical procedure but be unable to *appreciate* them meaningfully or weigh them against alternatives because their cognitive resources are monopolized by the emotional state. Their consent reflects desperation, not considered judgment.
      *   **Acute Time Pressure/Coercion:** Faced with an imminent threat or a rapidly closing offer, an individual might grasp the facts but lack the cognitive space to *weigh* them coherently against alternatives or core values. The choice is reactive, not reflective.

  **Anticipating and Responding to Objections**

  1.  **Objection: Impracticality and Epistemic Burden:** *"How can we possibly know what's going on in someone's mind at the moment of decision? Requiring occurrent competence sets an unrealistic, unworkable standard. The dispositional model is pragmatically necessary."*
      *   **Response:** While challenging, assessing mental states is an inherent part of consent evaluation (e.g., probing understanding). We routinely make inferences about occurrent states based on behavior, context, and known impairments.
          *   **Proxies and Context:** Signs of severe intoxication (slurred speech, imbalance), extreme emotional distress (hysterical crying, incoherence), or duress (pleading, visible fear) provide strong evidence that occurrent competence is impaired. The requirement doesn't demand mind-reading, but reasonable inference based on observable cues and context.
          *   **Burden Justified:** The gravity of respecting autonomy and preventing serious harms (like sexual violation or unwanted medical interventions) justifies this epistemic burden. Practical difficulties are not a sufficient reason to accept potentially invalid consent. We err on the side of caution in high-stakes situations.

  2.  **Objection: Paternalism and Disrespect:** *"This standard is overly paternalistic. If someone clearly communicates 'yes,' understands the basics, and has the general capacity, overriding their choice because we *think* they aren't 'weighing things properly' disrespects their agency and imposes our judgment."*
      *   **Response:** Respecting agency requires respecting *actual* autonomous choice, not just the *appearance* of choice. Consent based on radically impaired occurrent competence is not a genuine exercise of agency; it's akin to a spasm or a reflex.
          *   **Distinguishing Paternalism:** Preventing actions based on invalid consent isn't paternalism aimed at the agent's *welfare* against their will; it's about refusing to act based on an *inauthentic* authorization that doesn't reflect their will. We respect the agent *more* by ensuring their choices are authentically theirs.
          *   **Minimal Coherence Threshold:** The "minimally coherent" standard avoids judging the *quality* of reasoning or values. It only invalidates consent where reasoning is so fragmented or overwhelmed that no meaningful connection exists between considerations and choice. It targets failures of agency, not disagreements with choices.

  3.  **Objection: Over-Demanding and Invalidates Too Much:** *"Almost no one makes significant decisions with perfect, fully coherent weighing of all factors. Stress, minor intoxication, fatigue, distraction – these are ubiquitous. This requirement would invalidate vast swathes of everyday consent, paralyzing social and medical interactions."*
      *   **Response:** This misconstrues the requirement. "Minimal coherence" sets a deliberately low bar, compatible with human fallibility.
          *   **Not Perfect Rationality:** It does *not* require optimal decision-making, exhaustive consideration, or perfect emotional regulation. Minor stress, slight intoxication, or typical distractions do not necessarily obliterate the ability to hold key facts in mind and weigh them in a basic way consistent with one's character.
          *   **Targeting Acute Impairments:** The paradigm cases are *severe* intoxication, *overpowering* emotions, *acute* duress – states that demonstrably disrupt the *core cognitive functions* necessary for integrating information into a choice. The standard distinguishes temporary incapacity from ordinary human frailty.
          *   **Context Sensitivity:** The level of required coherence can be context-sensitive. The threshold for consent to minor social interactions might be lower than for major surgery or sexual intimacy, reflecting the stakes involved. The core requirement of *some* occurrent engagement remains constant.

  **Conclusion**

  The standard tripartite model of competence, focusing solely on dispositional capacities, provides a necessary but insufficient condition for valid consent. True respect for autonomy demands that consent be an *actual* exercise of self-governance, not merely the product of an intact but dormant capacity. Occurrent competence—the ability to hold relevant considerations in conscious awareness and engage in minimally coherent deliberation at the moment of choice—is essential for ensuring that consent constitutes a genuine authorization. While this standard presents practical challenges and requires careful application to avoid overreach or paternalism, it provides a more ethically robust and accurate account of what makes consent valid, particularly in situations involving temporary but profound impairments like severe intoxication, overwhelming affect, or acute pressure. Recognizing this requirement forces us to scrutinize common practices and acknowledge that many situations currently treated as unproblematic may, in fact, involve compromised agency and invalid consent.
