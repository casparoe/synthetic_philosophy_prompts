prompt: |-
  I'm a PhD student working on decision theory under prospects whose expected value is undefined, and before I evaluate any of the proposed repairs — truncated expectations, dominance-only rules, ranking by other statistical functionals — I want the specification they are being measured against. So write the desiderata: the requirements any adequate decision rule for undefined-expectation games must meet, with the motivating case behind each.

  The core cases to keep in view: the St. Petersburg game (payoff 2^n with probability 2^-n when the first head lands on toss n, so the expectation diverges to infinity) and the Pasadena game (same setup, but the payoff for first head on toss n is (-1)^n times 2^n/n, so the expectation series becomes the alternating harmonic series — conditionally convergent, summing to ln 2 in the natural ordering but rearrangeable to any real value, or divergence). The Pasadena case matters precisely because the game has no well-defined expected value even though each payoff, and the expectation truncated at any finite point, is perfectly well-defined.

  Among the requirements I'd want considered: that the rule coincide with expected-value maximization whenever expectations exist and are finite; that it deliver some verdict on whether to play the Pasadena game, and at what entry fee; that it respect statewise dominance when one prospect beats another in every state; that it be invariant under mere relabelings or repartitionings of the sample space — a condition conditional convergence puts direct pressure on, since reordering the terms changes the sum; that it handle choices among several undefined-value prospects, not just a single accept/reject verdict; and that it treat temporal or sequential versions of the games without exploiting the order in which terms happen to arrive. For each requirement, give the case behind it, and mark which are non-negotiable and which are preferences of particular camps rather than genuine adequacy conditions.

  The part I most want to see: flag any pair of desiderata you suspect is jointly unsatisfiable — I have a suspicion that agreement with finite-case expected value and partition-invariance cannot coexist once conditionally convergent expectations are admitted, and I'd like to know whether that is right or whether it shows one of the two was never a genuine requirement. Finally, tell me which single requirement on your list does the most to eliminate the familiar candidate rules. Keep the focus on the criteria; the scoring of contenders can be brief, since the criteria are the deliverable.
reasoning: |-
  We are to list desiderata for decision rules when the expected value is undefined. The core cases are the St. Petersburg game (divergent expectation) and the Pasadena game (conditionally convergent expectation). 

  The desiderata:

  1. **Extension of Expected Value (EEV):** The decision rule should coincide with expected value maximization whenever expectations exist and are finite. 
     - *Motivating case:* Any finite-valued prospect. For example, a simple gamble with finite outcomes must be evaluated by its expectation. This is non-negotiable because we want the rule to be an extension of the standard criterion.

  2. **Definite Verdict (DV):** The rule must deliver a definite verdict (e.g., accept/reject, or a preference ordering) for games with undefined expectations, including the Pasadena game. It should also specify an entry fee at which the game is acceptable (or a range of acceptable fees). 
     - *Motivating case:* The Pasadena game. Without a definite verdict, we cannot decide whether to play the game. This is non-negotiable because the rule is meant to guide decisions.

  3. **Statewise Dominance (SD):** If prospect A dominates prospect B in every state (i.e., A yields at least as good an outcome as B in every state, and strictly better in at least one), then A should be preferred to B.
     - *Motivating case:* Consider a modified Pasadena game that adds $1 to every outcome of the original. This new game should be preferred. This is non-negotiable as it is a very weak and fundamental principle.

  4. **Partition Invariance (PI):** The evaluation should be invariant under relabelings or repartitionings of the sample space. That is, if we change the order of the states (without changing the probabilities and outcomes), the evaluation should not change.
     - *Motivating case:* The Pasadena game. The conditional convergence of the alternating harmonic series implies that reordering the terms changes the sum. Therefore, a rule that depends on the order of states (like partial sums) would violate PI. This is a key challenge and is non-negotiable for those who believe that the decision should not depend on arbitrary labeling.

  5. **Comparability (COMP):** The rule should handle choices among several prospects with undefined expectations, not just a single accept/reject decision.
     - *Motivating case:* Choosing between two variants of the Pasadena game (e.g., one with a shifted payoff sequence). We need a rule that can compare them. This is non-negotiable for a full decision theory.

  6. **Temporal/Sequential Independence (TSI):** The rule should not exploit the temporal order in which payoffs are received in sequential versions of the games. The evaluation should be the same if the game is played all at once or in a sequence (with the same overall outcome structure).
     - *Motivating case:* A sequential version of the St. Petersburg or Pasadena game, where we might be tempted to stop early. The rule should not depend on the order of arrival of payoffs. This is a preference of some camps (especially those who reject time-biases) but may be negotiable in some sequential decision models.

  Now, let's flag potential conflicts:

  - **Conflict between EEV and PI in the presence of conditional convergence:** 
     - The Pasadena game's expectation is conditionally convergent. The finite truncation of the game (at n) has an expected value that approaches ln(2) as n increases in the natural order. However, by rearranging the terms (which is a repartitioning of the sample space that preserves probabilities and outcomes but changes the order), we can make the partial sums converge to any real number or diverge. 
     - If we require the rule to be partition invariant (PI), then the evaluation must be the same regardless of the order. But the finite truncations (which are finite games and thus have expectations) in different orders give different expected values. Moreover, if we try to extend the expected value by taking a limit, the limit depends on the order. 
     - Therefore, if we insist on EEV and PI, then for the Pasadena game we must assign a value that is independent of the order. But the finite truncations (which by EEV must be evaluated by their expectation) in different orders converge to different limits. Hence, there is a tension: the rule cannot both assign the same value to the Pasadena game regardless of partitioning (PI) and also agree with the finite truncations (which are finite and thus by EEV must be evaluated by their expectation) because the finite truncations in different orders have different expectations that converge to different limits. 
     - This suggests that EEV and PI might be jointly unsatisfiable for conditionally convergent cases.

  Which desideratum does the most to eliminate familiar candidate rules? 

  - **Partition Invariance (PI)** is the most stringent requirement and eliminates many rules. For example:
     - Rules that rely on the natural order of the states (like taking the limit of partial sums in the natural order for the Pasadena game) are eliminated because they are not partition invariant.
     - The classical expected value (when it exists) is partition invariant, but in the conditionally convergent case, the partial sum approach is order-dependent. Hence, rules that use a specific order (like the Cesaro limit or Abel limit) are not partition invariant because they depend on the order.

  Therefore, we must either relax PI (allowing order-dependence) or drop the requirement that the rule must agree with the finite truncations in the natural order (which would be a weakening of EEV). 

  Note: Some decision theorists might argue that PI is not required because the states are not arbitrary but have a natural order (like the toss number). However, if we consider that the states are just a partition of the sample space and that we can relabel them arbitrarily (without changing the physical setup), then PI becomes compelling. This is a philosophical point.

  In summary:

  - Non-negotiable: EEV, DV, SD, PI, COMP. (But note that the conflict between EEV and PI may force a reevaluation of one of them.)
  - TSI might be negotiable.

  The most eliminative requirement: Partition Invariance (PI).
answer: |-
  ### Desiderata for Decision Rules under Undefined Expectations

  Below are the desiderata for any adequate decision rule when expected value is undefined, motivated by the core cases (St. Petersburg and Pasadena games). Each requirement is classified as **non-negotiable** (fundamental to decision-theoretic adequacy) or **camp-specific** (reflects a particular school of thought). Conflicts between desiderata are flagged, and the most eliminative requirement is identified.

  ---

  #### **1. Extension of Expected Value (EEV)**  
  **Requirement:** The rule must coincide with expected-value maximization whenever expectations exist and are finite.  
  **Motivating Case:** Standard gambles with finite expectations (e.g., a fair coin toss paying $1 for heads, $0 for tails). If a rule fails here, it cannot generalize expected utility theory.  
  **Status:** Non-negotiable. This anchors the rule in classical decision theory.

  ---

  #### **2. Definite Verdict (DV)**  
  **Requirement:** The rule must deliver a determinate verdict (e.g., accept/reject, strict preference) for prospects with undefined expectations, including the Pasadena game, and specify an acceptable entry fee (or range).  
  **Motivating Case:** The Pasadena game. Its conditionally convergent expectation lacks a unique value, yet a decision rule must resolve whether to play it (e.g., at a $1 entry fee). Without DV, the rule is silent in critical cases.  
  **Status:** Non-negotiable. A decision rule must guide action.

  ---

  #### **3. Statewise Dominance (SD)**  
  **Requirement:** If prospect \(A\) dominates prospect \(B\) in every possible state (i.e., \(A\) yields \(\geq\) payoff of \(B\) in all states, with strict inequality in at least one), then \(A \succ B\).  
  **Motivating Case:** A modified Pasadena game where all payoffs are increased by $1. This must be preferred to the original, as it is strictly better in every state (first head on toss \(n\)).  
  **Status:** Non-negotiable. Violations imply accepting strictly inferior outcomes.

  ---

  #### **4. Partition Invariance (PI)**  
  **Requirement:** The evaluation must be invariant under relabelings or repartitionings of the sample space (i.e., changes to the order or grouping of states that preserve probabilities and payoffs).  
  **Motivating Case:** The Pasadena game. Its expectation sums to \(\ln 2\) under the natural order (\(n=1,2,3,\dots\)) but can be rearranged to converge to any real number or diverge. A rule sensitive to reordering (e.g., evaluating via partial sums) fails PI.  
  **Status:** Non-negotiable for most camps. The physical outcome-probability structure should determine preferences, not arbitrary labeling.

  ---

  #### **5. Comparability (COMP)**  
  **Requirement:** The rule must handle choices among multiple prospects with undefined expectations (e.g., ranking variants of St. Petersburg or Pasadena games).  
  **Motivating Case:** Choosing between a Pasadena game and a "Nested Pasadena" game (payoff \((-1)^n 2^n / \sqrt{n}\)). Both have undefined expectations, but a rule must declare one preferable or equal.  
  **Status:** Non-negotiable. Real decisions involve multiple options.

  ---

  #### **6. Sequential/Temporal Independence (TSI)**  
  **Requirement:** The rule must not exploit temporal order in sequential play (e.g., evaluations should not depend on the order in which payoffs are received).  
  **Motivating Case:** A sequential St. Petersburg game where payoffs arrive toss-by-toss. A rule that values early high-payoff states more (e.g., via discounting) would violate TSI, as the physical structure is identical to the atomic version.  
  **Status:** Camp-specific. Required by those rejecting time-biases, but negotiable in frameworks allowing dynamic choice.

  ---

  ### Conflicts Between Desiderata  
  **Key Suspected Conflict: EEV vs. PI**  
  - **Why they conflict:**  
    - EEV demands agreement with finite expectations. For the Pasadena game truncated at \(N\), the expectation is \(s_N = \sum_{n=1}^N (-1)^n 2^n / n \cdot 2^{-n} = \sum_{n=1}^N (-1)^n / n\), which converges to \(\ln 2\) as \(N \to \infty\) *in the natural order*.  
    - PI requires invariance under reordering. But reordering states (e.g., grouping positives before negatives) can make \(s_N\) converge to \(\pi/4\) or \(-\infty\), violating EEV’s agreement with the natural-order limit.  
  - **Verdict:** EEV and PI are **jointly unsatisfiable** for conditionally convergent cases like Pasadena. This implies:  
    - Either EEV must be weakened (e.g., by abandoning limit-agreement in conditionally convergent cases),  
    - Or PI must be relaxed (e.g., allowing order-dependence for sequences).  
  - **Core Issue:** PI is likely fundamental; EEV’s limit-agreement in conditionally convergent cases may be an overextension. Conditionally convergent series lack a unique sum, so EEV should not privilege one ordering.

  **Other Potential Conflicts:**  
  - **SD vs. TSI:** If temporal biases are allowed (e.g., preferring early positive payoffs in Pasadena), SD may be violated by delaying dominant outcomes. TSI resolves this by forbidding time-dependence.  
  - **DV vs. PI:** Rules satisfying PI (e.g., using signed-measure approaches) may fail DV by deeming Pasadena "incomparable" to all sure things. PI forces a value-independent verdict, but DV demands a specific choice.

  ---

  ### Most Eliminative Requirement  
  **Partition Invariance (PI)** eliminates the broadest class of candidate rules:  
  - **Rules Eliminated:**  
    - **Partial-Sum Limits (e.g., Cesàro, Abel sums):** Fail for Pasadena under reordering (e.g., Abel sum is \(\ln 2\) naturally but changes if states are permuted).  
    - **Truncated Expectations:** Depend on a fixed state order, violating PI.  
    - **Time-Weighted Rules (e.g., discounting):** Fail PI by valuing temporal sequence.  
  - **Why:** PI is stringent in conditionally convergent cases. Rules that work for St. Petersburg (divergent) often fail for Pasadena due to reordering fragility. Only measures immune to state relabeling (e.g., Banach limits, signed expectations with invariance) survive—but these may conflict with EEV.

  ---

  ### Summary  
  **Non-Negotiables:** EEV, DV, SD, PI, COMP. These form the core adequacy conditions.  
  **Camp-Specific:** TSI (dynamic-choice camps may waive it).  
  **Key Tension:** EEV and PI cannot coexist under conditional convergence, suggesting EEV’s limit-agreement must be restricted. PI is the most eliminative desideratum, as it invalidates order-dependent approaches prevalent in literature.  

  This framework provides the specification against which repairs (e.g., rank-dependent utility, varying truncation) must be measured. For scoring candidates:  
  - **St. Petersburg Solutions:** Rules like exponential damping (e.g., \(u(x) = \log x\)) satisfy EEV/SD/COMP but fail PI for Pasadena.  
  - **Pasadena Solutions:** Signed expectation measures (e.g., Lauwers’s \(L\)-expectation) satisfy PI/DV but often fail EEV (limit-agreement).  
  The central challenge is reconciling EEV and PI—likely requiring redefining "extension" for conditionally convergent cases.
