prompt: |-
  You are a philosopher of mind with substantial experience as an evaluator of machine learning systems — someone who can read a technical measurement protocol and say precisely what theory of cognition it silently commits its authors to. Please treat this as an exercise in conceptual reconstruction rather than as a request for advice or for a verdict on whether models "really" understand anything.

  I work on the evaluation side of a lab that builds large language models, and over the past year I have become uneasy about our contamination policy, which I will describe as concretely as I can. Before each release, we screen the model for verbatim familiarity with the items of widely used public benchmarks: we look for long exact overlaps between model outputs and benchmark text, and in some cases we check whether the model can reproduce unique random identifier strings that a benchmark's authors deliberately embedded in their released test data. If a model trips a threshold, we void the score for that entire benchmark — not merely for the individual items it appears to have seen, but for the instrument as a whole, on the reasoning that the benchmark has stopped measuring anything. Alongside this, we commission private problem sets that are never published: contractors write them, they are rewritten each cycle with new names, new numbers, and new surface phrasing but deliberately the same underlying structure, and access is restricted to a handful of people. These private sets, plus "live" evaluations built from problems that only came into existence after the training cutoff — this month's examinations, puzzles released last week — are treated internally as our strongest evidence about what the model can do. We also, occasionally, seed plausible but fabricated claims into places likely to be scraped, and treat a model's confident repetition of such a claim as strong evidence that it ingested that material, while treating its silence as only weak evidence that it did not.

  Here is what puzzles me. We still publish and celebrate headline scores on older public benchmarks whose items, solutions, and walkthroughs were debated at length across the open web long before our training cutoff, and we describe year-over-year gains there as evidence of improved reasoning. And when a model solves a fresh private item that is structurally identical to thousands of near-duplicates in its training data, we call that generalization rather than retrieval. So the policy appears to hold that the provenance of an answer can disqualify it as evidence, and simultaneously that provenance is irrelevant whenever the surface form has been altered. If reproducing a memorized answer tells us nothing about whether the model grasps the problem, why does reproducing a memorized procedure — one instantiated in a vast family of superficially different training items — tell us a great deal? Is the distinction we are drawing really about memorization at all, or about something else: a performance-versus-competence distinction, a requirement of counterfactual robustness, a requirement that the right answer be produced by the right kind of internal process, a worry about the measuring instrument rather than about the mind being measured? I would like these possibilities sorted out rather than listed.

  Please think carefully and, before you commit to an interpretation, spend a short opening section brainstorming the candidate presuppositions the policy might rest on, including at least one you end up rejecting and explaining why. Then reconstruct the implicit theory of understanding and of evidential support that makes this bundle of rules coherent: what must be true of understanding for verbatim reproduction to be evidentially worthless while structurally parallel novel performance is evidentially gold? Say explicitly which rival views the policy rules out or ignores — a purely dispositional or functionalist account on which understanding just is a profile of input-output dispositions, so that where the answer came from cannot matter; the stochastic-parrots line of objection, on which success on a freshly written item is no better evidence of comprehension than success on a memorized one, since both are recombinations of training patterns; and any others you think are being quietly excluded. Assess whether the parts of the policy presuppose consistent things with one another, paying particular attention to the all-or-nothing voiding of a whole benchmark, to the asymmetry between how we weight a repeated fabricated claim and how we weight silence about one, and to the tension between our treatment of old public benchmarks and our treatment of contamination. Distinguish throughout what the practice strictly presupposes from what it merely fits comfortably with, and flag the places where the practice is philosophically underdetermined, so that two or three incompatible theories would license exactly the same rules. Finally, tell me what would have to change in the policy if we adopted the strongest rival account instead — would contamination screening become pointless, or would it survive as a measurement-validity concern rather than a concern about minds? Do not give me citations, a reading list, or named sources; argue from the concepts. Roughly nine hundred to twelve hundred words, and if you need to assume something about how evaluation is actually done that I have not stated, say so explicitly when you rely on it.
reasoning: |-
  Hmm, the user presents a sophisticated critique of their lab's LLM evaluation practices, framed as a philosophical reconstruction exercise. They're clearly deeply engaged in the technical details but troubled by the conceptual coherence of their contamination policy. 

  The core tension they've identified is fascinating: why treat verbatim memorization as evidentially worthless while considering structurally identical novel problems as gold-standard evidence of reasoning? And why void entire benchmarks based on contamination while still celebrating gains on older public benchmarks that were likely discussed online?

  This requires unpacking several layers. First, the apparent contradictions in their policy suggest an implicit commitment to a particular theory of understanding - one that values procedure over content, generalization over recall. The user is right to suspect this isn't just about memorization per se, but about what kind of cognitive process they're willing to accept as evidence of "grasping."

  The policy seems to rest on three key presuppositions: (1) that surface form matters for detecting contamination but not for assessing understanding, (2) that structural invariance across variations indicates robust competence, and (3) that the inability to reliably isolate contaminated items justifies discarding entire benchmarks. 

  The strongest implicit theory here appears to be a variant of proceduralism - where understanding is demonstrated by generating correct procedures for novel instantiations of problem types. This directly opposes both strict behaviorism (which would consider outputs alone) and the "stochastic parrot" view (which dismisses all output as recombination).

  Interestingly, the fabrication-check asymmetry reveals another layer: they're willing to accept positive evidence of contamination (model repeating the fake fact) as conclusive, while treating absence as inconclusive. This suggests a Bayesian approach where prior probability of contamination is high enough that only strong positive evidence shifts their assessment.

  The treatment of older benchmarks is the most philosophically problematic aspect. By celebrating gains there while voiding contaminated benchmarks, they're implicitly claiming that widespread discussion of problems doesn't constitute "contamination" in the same way as verbatim ingestion. This might reflect a practical concession rather than a coherent principle - perhaps they assume models can't "memorize" abstract problem types from discussions in the same way they memorize text strings.

  What's really clever about the user's framing is how they've identified points where the policy is underdetermined. For instance, voiding whole benchmarks could equally support a measurement-instrument view or a cognitive-process view. And their handling of old benchmarks might fit either an "exposure spectrum" theory or simple institutional hypocrisy.

  If they adopted the strongest rival view (radical behaviorism), contamination screening would still matter - but only for measurement validity, not for understanding. The threshold for voiding benchmarks might change, and they'd need to stop making claims about cognitive processes altogether.
answer: |-
  ## Conceptual Reconstruction of an LLM Evaluation Policy

  **Brainstorming Candidate Presuppositions:**

  1.  **Proceduralism:** Understanding resides in the ability to execute abstract procedures or apply rules, not in recalling specific content. Verbatim reproduction is mere retrieval; solving a novel item requiring the same procedure demonstrates the procedure's internalization. *(Plausible)*
  2.  **Counterfactual Robustness (Strong Form):** True understanding requires reliably producing correct outputs *across variations* in the input. Memorization fails because it's fragile to superficial changes. Novel problem performance demonstrates this robustness. *(Plausible)*
  3.  **Internal Process Essentialism:** The *kind* of internal process matters. Verbatim output implies a retrieval process (bad). Novel output implies a computation/rule-application process (good). Understanding requires the latter. *(Plausible, but requires defining the "good" process)*
  4.  **Instrument Purity:** The primary concern is the validity of the *measurement instrument*. A contaminated benchmark is like a broken thermometer; it cannot reliably measure *anything*, even genuine ability, because we cannot disentangle retrieval from other processes. Novel benchmarks are pristine instruments. *(Plausible, but shifts focus from cognition)*
  5.  **Simple Memorization Threshold:** All that matters is whether the specific test item was seen. If seen, performance is suspect; if not, it's valid. Verbatim checks detect exposure. Novel items guarantee novelty. *(Rejected: Policy explicitly accepts performance on novel items *structurally identical* to vast amounts of training data. This rejects the idea that exposure to *any* similar item invalidates the test. It accepts that generalization *from* seen examples is evidence of understanding, not just performance on wholly alien tasks.)*
  6.  **Stochastic Parrot Acceptance:** Performance, whether on memorized or novel items, is always just sophisticated pattern matching/recombination. The distinction is meaningless. *(Rejected: The policy fundamentally distinguishes between verbatim reproduction and novel performance, treating the latter as superior evidence. It actively seeks evidence *against* this view via novel tests.)*

  **Reconstructing the Implicit Theory:**

  The policy coheres under a **Proceduralist Theory of Understanding with a Counterfactual Robustness Criterion and Measurement Instrument Concerns.**

  1.  **Understanding as Procedural Competence:** Understanding a domain (e.g., reasoning, code generation) is implicitly defined as possessing a repertoire of *abstract, applicable procedures or rules*. Solving a problem demonstrates understanding if it results from applying the correct procedure *to the specifics of that problem instance*.
  2.  **Evidential Value & Verbatim Reproduction:** Verbatim reproduction of an answer is evidentially worthless *for demonstrating understanding* because:
      *   It doesn't demonstrate the *application* of a procedure. It could be direct retrieval from a vast associative memory, bypassing any reasoning process.
      *   It lacks **counterfactual robustness**: If the problem were slightly rephrased (same structure, new surface), the model might fail, indicating it wasn't applying a robust procedure but relying on surface cues or direct recall. This fragility undermines the inference to a stable competence.
  3.  **Evidential Value & Novel Structural Performance:** Solving a novel problem (new surface, same underlying structure) is evidentially gold because:
      *   It strongly suggests the model possesses and can *apply* the relevant abstract procedure to *new instances*. It had to generate the solution path based on the structure, not recall a specific sequence.
      *   It demonstrates **counterfactual robustness**: Success persists despite surface variation, indicating the model's response is governed by the underlying structure, not superficial features. This robustness is key evidence for a stable competence.
  4.  **Why Void the Whole Benchmark?** This stems primarily from **Measurement Instrument Validity** concerns intertwined with cognitive presuppositions:
      *   **Epistemic Opacity:** We lack reliable, non-intrusive methods to definitively determine *which specific items* a model retrieved verbatim versus solved procedurally. If *any* significant contamination exists, the *aggregate score* becomes uninterpretable. We cannot know if gains are due to improved retrieval or improved procedural competence.
      *   **Threshold of Doubt:** A contamination threshold signifies the point where doubt about the instrument's ability to measure procedural competence reliably becomes overwhelming. The benchmark ceases to function as a valid measure of the *construct* (procedural understanding) it was intended to measure. It might measure contaminated memorization instead.
  5.  **Asymmetry (Fabricated Claims vs. Silence):**
      *   **Confident Repetition:** Treated as *strong positive evidence* of ingestion because confidently generating a specific, rare, fabricated string is an extremely unlikely event *unless* the model encountered that exact string. It's a near-perfect signature of verbatim memorization/retrieval.
      *   **Silence:** Treated as *weak negative evidence* because failure to reproduce the fabricated claim has many plausible explanations besides non-ingestion: the information wasn't salient, the model isn't confident enough, the prompt didn't trigger retrieval, the training mixture diluted it, or the model *did* ingest it but chooses (based on learned patterns) not to assert unverified claims. Silence doesn't reliably signal absence.
  6.  **Tension (Old Public Benchmarks):** This is the most philosophically strained aspect, revealing a practical concession:
      *   **Implicit "Exposure Spectrum":** The policy likely presupposes a gradient of contamination. Verbatim memorization (detected by exact matches) is highly contaminating. Familiarity with *discussions* of problems/solutions (as with old public benchmarks) is seen as less direct and less damaging to the inference of procedural competence, *especially* if the benchmark requires multi-step reasoning where verbatim recall of the final answer is insufficient (though recall of solution *steps* is still a risk).
      *   **Proxy for General Progress:** Despite the risk, year-over-year gains on *difficult* public benchmarks (like MMLU, ARC, GSM8K) are treated as evidence of broad progress in underlying capabilities, *assuming* that sheer verbatim memorization of all variants is implausible and that improvements reflect better learning of procedures from the vast data. This is a pragmatic, not entirely coherent, compromise between the ideal (novel tests) and the need for public, comparable metrics. It downplays the contamination risk posed by widespread discussion.

  **Rival Views Excluded or Ruled Out:**

  1.  **Strict Dispositionalism/Functionalism:** This view holds that understanding *just is* the disposition to produce appropriate outputs to inputs. The origin of the disposition is irrelevant. If the model produces the right answer, whether by recall or novel generation, it demonstrates the same understanding. The policy *explicitly rejects this* by valuing structurally novel performance far above verbatim recall, making the *genesis of the output* crucial to its evidential weight.
  2.  **"Stochastic Parrot" Objection:** This argues LLMs fundamentally lack understanding; all outputs are sophisticated recombinations of training patterns. Success on a novel item is just as much pattern recombination as success on a memorized one – it's recombination at a higher level of abstraction. The policy *vigorously opposes this* by investing heavily in novel tests and treating success there as qualitatively better evidence ("gold standard"). It presupposes that novel performance *can* indicate something beyond mere recombination – namely, procedural competence.
  3.  **Internal Process Irrelevance (Extreme Behaviorism):** Any focus on internal processes is deemed unscientific or irrelevant; only input-output correlations matter. The policy's core distinction between verbatim recall and procedural application, and its concern about contamination affecting the *inference* to internal competence, directly contradicts this. The voiding of benchmarks based on suspected retrieval processes assumes the internal process *does* matter for interpreting the output.

  **Consistency and Underdetermination:**

  *   **Overall Coherence:** The core proceduralist/counterfactual robustness view provides a coherent rationale for the main pillars: devaluing verbatim recall, valuing novel structural performance, voiding contaminated benchmarks (due to measurement opacity), and the fabrication asymmetry (strong signal vs weak signal).
  *   **Inconsistency:** The treatment of **old public benchmarks** is the weak point. Celebrating gains there while voiding benchmarks for verbatim contamination relies on an unconvincing distinction between "direct memorization" and "exposure to discussion/solutions." If widespread discussion provides models with solution procedures or highly similar variants, it risks contaminating the benchmark in a way that undermines the inference to *novel* procedural application, similar to (though perhaps less severe than) verbatim ingestion. This tension highlights the policy's pragmatism but undermines its theoretical purity.
  *   **Underdetermination:**
      *   **Voiding Benchmarks:** This action could be motivated purely by **measurement validity concerns** (we can't trust the score) *or* by a **cognitive process concern** (the score might reflect retrieval, not understanding), *or both*. The policy doesn't strictly require one over the other; both rationales fit.
      *   **Novel Item Success:** Does this demonstrate "true" procedural competence, or is it just highly sophisticated pattern matching applied to a new instance of a deeply learned template? The policy presupposes the former is possible and detectable, but a skeptic could consistently use the same evaluation rules while interpreting success as complex recombination. The policy doesn't *prove* the existence of distinct procedural competence; it presupposes it and designs tests to detect it.

  **Policy Change Under the Strongest Rival (Stochastic Parrot/Dispositionalism):**

  Adopting the view that LLMs are fundamentally stochastic parrots and understanding is solely defined by input-output dispositions would radically alter the policy:

  1.  **Contamination Screening:** Would become **pointless for assessing cognitive capability**. Verbatim recall would be just one way the model manifests its training-data-shaped dispositions; it wouldn't be inherently inferior evidence of the model's capabilities than novel problem solving. Both are outputs the model is disposed to produce. Screening might survive only for:
      *   **Academic Honesty/Measurement Validity (Limited):** Ensuring published scores aren't inflated by direct test-set leakage, purely for comparative fairness and avoiding accusations of "cheating." However, even this is philosophically shaky under strict dispositionalism – if the model produces the answer, that *is* its capability, leakage or not.
      *   **Detecting Data Sources:** The fabrication technique would still be useful for empirically tracing *which data* influenced the model's dispositions.
  2.  **Novel Private Benchmarks:** Would lose their special status as "gold standard" evidence of understanding/reasoning. Success would simply indicate the model's training data and architecture disposed it to solve *that specific novel problem*. It wouldn't be qualitatively better evidence than success on a memorized item; both are outputs within the model's behavioral repertoire. The massive investment in creating them might be questioned.
  3.  **Benchmark Voiding:** Would cease entirely *on cognitive grounds*. If a benchmark is contaminated and the model scores well, that simply *is* the model's capability (recalling the test set). The score remains valid as a measure of that specific disposition. Voiding would only occur if there was proven, widespread leakage that made the score *unrepresentative* of typical deployment performance (a very narrow measurement validity concern).
  4.  **Focus Shift:** Evaluation would focus purely on **performance breadth and reliability** across diverse, realistic tasks relevant to deployment, regardless of novelty or potential contamination. The origin of the capability (memorization vs. "true procedure") would be deemed irrelevant or non-existent. Headline scores on public benchmarks, contaminated or not, would remain the primary metric, as they directly reflect dispositional properties on known tasks.

  In essence, under the rival view, contamination screening shifts from being a gatekeeper for evidence of "genuine understanding" to a niche tool for data provenance or narrow academic fairness, while the core evaluation practice would focus much more exclusively on observable performance, de-emphasizing the distinction between novel and seen items that is central to the current policy's implicit theory of mind.
