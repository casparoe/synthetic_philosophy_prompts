prompt: |-
  I've been trying to understand updateless decision theory and i keep hitting a wall. If UDT just means the agent chooses the policy with the highest expected utility before it knows which decision instance it will be in, then isn't it just ordinary expected utility with a longer time horizon? Why would it ever give a different recommendation than just maximizing expected utility at the decision point, especially in Newcomb's problem, if the agent is just doing EU over policies?
reasoning: |-
  Okay, the user is struggling with Updateless Decision Theory (UDT) and feels like they're hitting a wall. They're asking why UDT isn't just expected utility maximization over a longer time horizon, and why it gives different answers in cases like Newcomb's problem. 

  First, I need to unpack their core confusion. They seem to think that pre-committing to a policy is functionally identical to standard EU maximization at decision points. That's a common misunderstanding! The key they're missing is how UDT handles logical correlations - the fact that the agent's decision algorithm itself becomes part of the world model.

  Hmm, the Newcomb's reference tells me they're probably coming from a rationality/lesswrong background. They might be frustrated because the explanations feel circular. I should emphasize the counterfactual reasoning - how UDT evaluates "what if I were the type of agent who always chooses X" globally, not situationally.

  The user sounds analytically minded but tripping on the abstractness. I should avoid jargon like "mathematical intuition" and instead use concrete examples. Maybe expand beyond Newcomb's to something like Parfit's Hitchhiker to show how the precommitment aspect differs from time-extended EU.

  Ah! The critical nuance is that standard EU updates on observations, while UDT fixes the policy before any observations. In Newcomb's, this means ignoring the box you already see when deciding - which feels irrational locally but wins globally. That's the wall they're hitting: the apparent irrationality of ignoring evidence.

  I should also address their implicit question: "Is UDT just repackaging standard rationality?" The answer is no - it's fundamentally about logical counterfactuals rather than causal ones. The math itself differs because Omega is simulating your algorithm, not your physical brain.

  ...Better include how UDT handles multiple identical decision points too. That's another key difference from time-extended EU where you'd reconsider at each step. The user might not have encountered coordinated decision problems yet.

  Their tone suggests frustration - I should validate that the confusion is normal. Maybe add that even professionals debate this stuff. The payoff is worth it though; once UDT clicks, game theory problems unravel beautifully.
answer: |-
  You've hit on a **crucial and subtle point** – the distinction between UDT and standard "updateful" expected utility (EU) maximization is often misunderstood. Your intuition is partly right: UDT *does* involve maximizing expected utility over *policies* (complete strategies mapping observations to actions) *before* receiving any specific observations. But the key difference lies in **how it handles counterfactuals, logical correlations, and the agent's own algorithm**, leading to fundamentally different recommendations in specific problems like Newcomb's. Here's a breakdown:

  **1. Standard EU Maximization at a Decision Point (Updateful):**
  *   **Context:** The agent finds itself at a specific decision node, having received some observations (evidence).
  *   **Process:** It conditions its probability estimates *on its current situation and observations*. It then calculates the expected utility of each *action* available *right now*, using these updated probabilities.
  *   **Focus:** "Given what I know *now*, what action *here and now* maximizes my expected utility?"
  *   **Problem in Newcomb's:** When the agent stands in front of the two boxes, it *observes* that Box B is either present or not. If it conditions on this observation, it sees:
      *   If Box B is *present*, taking both boxes nets $1,001,000 vs $1,000,000 for only B. Dominates.
      *   If Box B is *absent*, taking both boxes nets $1,000 vs $0 for only B. Dominates.
      *   It concludes "two-boxing always gives more, regardless of what's in B". It ignores the *causal dependency* (Omega's prediction) because conditioning on the *current state* makes the prediction seem like a fixed fact.

  **2. UDT (Updateless EU Maximization over Policies):**
  *   **Context:** The agent chooses a *complete strategy* (policy) *before* it knows which specific situation/decision instance it will find itself in. It doesn't know *who* it is, *where* it is, or what it has *observed* yet.
  *   **Process:** It considers all possible ways the world could be configured (including which decision instance it might be part of, and what observations it might receive). Crucially, it considers the *logical correlation* between its chosen *policy* and the state of the world *that depends on predicting that policy* (like Omega's prediction). It calculates the expected utility of each *entire policy*, averaging over all possible world states/instances it could find itself in.
  *   **Focus:** "What *general rule* (policy) should I pre-commit to following, such that *on average, across all possible situations I could be in*, my expected utility is maximized? This includes situations where my choice *logically influences* the state of the world before I even act."
  *   **Solution in Newcomb's:** UDT reasons:
      *   **Policy Option 1 (One-Box):** If I adopt the policy "Always take only Box B", then Omega (a perfect predictor of my *policy*) will predict this and put $1M in Box B. When I face the boxes, I take only B and get $1,000,000.
      *   **Policy Option 2 (Two-Box):** If I adopt the policy "Always take both boxes", then Omega will predict this and put *nothing* in Box B. When I face the boxes, I take both and get only $1,000.
      *   **Comparison:** Averaging over the possible situations (being the player facing the boxes after Omega's prediction), the "One-Box" policy yields an expected utility of $1,000,000. The "Two-Box" policy yields an expected utility of $1,000. Therefore, the *policy* of one-boxing has vastly higher expected utility *before I know anything*.
      *   **Result:** UDT chooses the one-boxing *policy*.

  **Why UDT is Fundamentally Different (Not Just Longer Time Horizon):**

  1.  **Logical Correlation & Counterfactuals:** This is the core. Standard EU conditions on the *current state* (including its observations). UDT *does not condition on being at a specific decision point with specific observations when choosing the policy*. It asks: "If I *were* the type of agent who *always* follows policy P, what would the world (including predictors like Omega) *be like*, and what would happen to *copies/instances* of me in that world?" It evaluates counterfactual worlds defined by the chosen policy.
  2.  **Handling Predictors:** Problems like Newcomb's, Parfit's Hitchhiker, or the Prisoner's Dilemma with twin agents involve entities that base their actions on a *prediction of the agent's algorithm/policy*. Standard EU, by conditioning on the local state, often breaks the link between the agent's choice and the predictor's past action. UDT maintains this link by fixing the policy *before* the prediction is simulated.
  3.  **Multiple Copies/Identical Algorithms:** UDT naturally handles scenarios where multiple identical decision agents face correlated problems (e.g., coordinated attack problems across galaxies). It reasons that all copies will execute the *same policy*, so it chooses the policy that gives the best *average* result when all copies follow it. Standard EU applied locally by each copy often leads to coordination failures. A longer time horizon for one agent doesn't solve this.
  4.  **"Updatelessness" vs. "Updateful":** The crucial difference isn't just the scope of time, but *when* information is used.
      *   **Updateful:** Information (observations) is used *to condition the probability distribution* used for calculating EU *at the decision node*.
      *   **Updateless:** Information is used *as input to the policy function*. The policy itself is chosen *without* access to that specific information, based on the *expected* performance *across all possible information states* the policy might encounter.

  **Analogy: Writing Code vs. Running Code**

  *   **UDT** is like writing a general-purpose function `choose_action(observation)` *before* you know what the `observation` input will be. You design the function to have the best *average* outcome *across all possible inputs it might receive*, considering how its *design* might affect the inputs it gets (e.g., if the input comes from a simulator that knows your function's code).
  *   **Standard EU** is like running the function `choose_action(current_obs)` *after* receiving a specific `current_obs`. It calculates the best action *given this specific input*, ignoring how the function's *design* might have influenced what `current_obs` is.

  **Conclusion:**

  You are correct that UDT involves maximizing EU over policies before knowing the situation. However, the critical difference is that UDT explicitly accounts for the **logical dependence** between the chosen policy and the state of the world (especially the actions of predictors or other identical agents) *before any observations are made*. Standard EU maximization *at the decision point* conditions on observations, breaking this link and leading to locally optimal but globally suboptimal decisions ("two-boxing") in problems where the agent's algorithm itself is a causal factor. UDT's "updatelessness" is essential for correctly evaluating the counterfactual worlds implied by choosing different policies in such scenarios. It's not just a longer time horizon; it's a fundamentally different way of relating the agent's decision algorithm to the world model.
