  Let's clarify the distinction:

  - A **spandrel** (in the Gould and Lewontin sense) is a byproduct or non-adaptive consequence of another feature that was built by natural selection (or by physical constraint). It is a feature that arises without being directly selected for, and it may have no function at all initially.

  - **Exaptation** (a term introduced by Gould and Vrba in 1982, but building on the spandrels idea) refers to a feature that originally evolved for one function (or as a non-adaptive byproduct) and is later co-opted for a new function. So, an exaptation can be either:
     a) A feature that was an adaptation for one function and then used for another (e.g., feathers originally for insulation, later for flight).
     b) A feature that was a non-adaptive spandrel and then co-opted for a function.

  Therefore, a spandrel is a type of non-adaptive byproduct that *may become* an exaptation if it is co-opted for a function. But not every spandrel becomes an exaptation (some may remain non-functional), and not every exaptation starts as a spandrel (some are adaptive features that get reused). Thus, they are not interchangeable.

  The student's claim that "a spandrel is simply an exaptation" is backwards and incorrect. A spandrel becomes an exaptation only if it is co-opted. Also, the student says the terms are interchangeable except for the domain (architectural vs. biological) which is wrong because exaptation is a biological concept and spandrel is an analogy.

