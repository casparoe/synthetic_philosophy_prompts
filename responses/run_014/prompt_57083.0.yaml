  I need to reject step (4) - the claim that underdetermination implies indeterminacy. But crucially, this rejection should leverage the network's computational role rather than appealing to vague naturalness. The key is that the network was trained to compute addition, so content should be fixed by its function in that computation. P* plays no causal role in the actual algorithm.

  For the philosophical positions: 
