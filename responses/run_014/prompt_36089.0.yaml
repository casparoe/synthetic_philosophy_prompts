answer: |-
  **MEMORANDUM**  
  To: Graduate Studies Committee, Department of Mathematics  
  From: Chair, Graduate Studies Committee  
  Date: October 26, 2023  
  Subject: Policy Recommendation for AI-Assisted Proof Submissions in Graduate Coursework  

  ### **Background**  
  The proliferation of AI tools in mathematical work has created ambiguities in our academic integrity framework. The "oracular case" (submissions where students verify AI-generated proofs but cannot reconstruct them) exposes a critical gap: our policies assume proofs reflect a student’s *internalized understanding*, yet AI collaboration decouples verification from generative reasoning. This challenges the pedagogical purpose of coursework—to cultivate independent mathematical intuition. While research mathematics legitimately uses tool-mediated verification (e.g., computer-assisted proofs), graduate *training* prioritizes the development of foundational reasoning skills.  

  ### **Position on the Oracular Case**  
  The oracular case represents a **failure of learning**, not dishonesty. Honesty requires transparency about sources; learning requires the integration of knowledge into cognitive frameworks. A student who cannot reconstruct a proof—despite verifying it—has not achieved the course’s objective: *to develop reproducible problem-solving capacity*. This distinguishes student work from research: while the discipline accepts collective verification, coursework assessments must measure *individual* mastery.  

  ### **Policy Recommendation**  
  After evaluating proposals, the committee recommends:  
  **Option 3: Reconstructability Standard**  
  *Implementation:*  
  - Students may use any tools (including AI) to *discover* proofs.  
  - For *any* submitted proof, the student must be prepared to rederive it unaided within 24 hours of request.  
  - Instructors may conduct random "reconstruction defenses" (oral or written) for 1–2 problems per assignment.  
  - Failure to reconstruct results in a zero for that problem; patterns of failure trigger academic review.  
  *Effective Date:* Fall 2024 courses.  
  *Affected Parties:* Graduate students (all years), faculty instructors, graders.  
  *First-Year Review:* Assess frequency of reconstructions, student/instructor feedback, and correlation between reconstruction success and exam performance.  

  ### **Why Not the Alternatives?**  
  - **Option 1 (Prohibition):** Unenforceable and ignores AI’s utility as a brainstorming aid. It penalizes tool use that mirrors real research practice.  
  - **Option 2 (Disclosure):** Places undue burden on students to self-assess "unaided" capability, inviting subjectivity. Does not address the learning failure—disclosure alone cannot ensure understanding.  

  ### **Addressing Our Discipline’s Contradiction**  
  Yes, mathematics relies on tool-mediated verification (e.g., Coq, CSPG classification). But *coursework* serves a distinct goal: skill acquisition. A student using AI as an oracle gains no more personal skill than a student copying a textbook solution—both can verify correctness without understanding genesis. The line is crossed when the student cannot *generate* the core reasoning independently. This standard preserves rigor while acknowledging evolving tools.  

  ### **Implementation Summary**  
  1. **Policy adoption:** Vote at November committee meeting.  
  2. **Faculty guidance:** Develop reconstruction protocols (time limits, problem selection) by Spring 2024.  
  3. **Student communication:** Announce policy in orientation materials and syllabi.  

  ---  
  **APPENDIX: STRUCTURED SUMMARY**  
  ```json  
  {
    "recommendation": "Adopt a reconstructability standard: AI use permitted for discovery, but students must be able to rederive submitted proofs on demand.",
    "position_on_oracular_case": "failure of learning, justified by the core objective of coursework being the development of reproducible problem-solving skills, not solely verification.",
    "conditions": [
      "Reconstruction defenses scheduled within 24h of request",
      "Oral/written format at instructor discretion",
      "Failure results in zero for the problem",
      "Random sampling (1–2 problems per assignment)"
    ],
    "strongest_dissent": "Option 2 (disclosure) better aligns with research practices where tool use is ubiquitous and self-reported contributions are standard; reconstructability imposes artificial constraints on collaborative cognition.",
    "affected_parties": ["Graduate students", "Faculty instructors", "Graders"],
    "review_trigger": "After one academic year (Spring 2025), based on aggregated reconstruction success rates and student/faculty surveys."
  }
  ```  

  **End of Memo**
