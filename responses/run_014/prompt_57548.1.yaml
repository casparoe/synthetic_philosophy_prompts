  ### Scenario Paragraph
  In the third year of the governor’s irrigation triumph, the barges creaked under the weight of District A’s double harvest, their hulls sinking deeper into the silt-choked rivers as they ferried rice to the provincial capital. Downstream in District B, Laxmi watched her landlord’s grain vanish onto those same boats, bound for the new trading posts flourishing upstream. That evening, she pocketed her wage envelope—forty copper rupees, unchanged since the shift from grain shares—and trudged to the market. The chalkboard at the mill read *3.5 rupees per seer*, the script bold beneath the flickering oil lamp. Last season, her wages bought two full seers; now, they barely covered one. The mill’s shelves brimmed with unfamiliar, glossy rice from A, more abundant than ever, yet her children’s bellies swelled with hunger as the boats glided past, laden with food for others.

  ---

  ### Analysis: How the Famine Mechanism Works  

  #### Step-by-Step Breakdown (with Rough Numbers)  
  1. **Trigger (Months 1–4):**  
     - A well-intentioned governor invests in irrigation canals for District A (upstream), aiming to boost prosperity. The project succeeds, doubling A’s rice yield (e.g., from 100 to 200 tons).  
     - **Rational actors:** The governor (decent, trying to help) and District A’s farmers (rational, unremarkable) celebrate the bounty.  

  2. **Price Shock (Months 5–6):**  
     - Merchants flock to District A, drawn by surplus rice. They bid up prices to secure exports to neighboring provinces (e.g., rice price rises from 2 to 3.5 rupees/seer).  
     - District B’s landowners, seeing higher profits, sell their *entire* harvest (e.g., 50 tons) to these merchants instead of retaining shares for laborers.  
     - **Result:** Food reaching the province *increases* (total rice: 250 tons vs. 150 tons pre-boom), but District B’s rice is exported.  

  3. **Entitlement Collapse (Months 7–9):**  
     - Landless laborers in B (historically paid 1 seer/day in kind) were shifted to fixed money wages (40 rupees/month) pre-crisis for "modernization."  
     - Rice price in B spikes to 3.5 rupees/seer (75% inflation) due to scarcity *and* demand for A’s premium grain.  
     - Laborers’ real wages collapse:  
       - Pre-crisis: 40 rupees = 20 seers/month.  
       - Post-crisis: 40 rupees = 11.4 seers/month (a 43% drop in purchasing power).  
     - **Second class better off:** District A’s smallholders (decent, unmalicious) testify, "The canals brought more rice than ever—no one should starve!"  

  4. **Net Import Illusion (Months 10–12):**  
     - District B becomes a net importer: Merchants use profits from A’s exports to ship cheaper, lower-quality rice from neighboring provinces (e.g., 60 tons imported vs. 50 tons pre-crisis local supply).  
     - **Paradox:** Total food entering B rises (60 tons > 50 tons), but prices stay high (3.5 rupees/seer) due to transaction costs and A’s premium rice dominating the market.  
     - Laborers starve while surrounded by abundant, unaffordable grain.  

  ---

  ### The Entitlement Failure Explained  
  - **Availability Theory Prediction:** "More food in the province (250 > 150 tons) and district (60 > 50 tons) means no famine."  
    - **Where it fails:** It ignores distribution. Food exists but is priced beyond laborers’ means.  
  - **Entitlement Account Prediction:** Laborers’ "exchange entitlement" (labor → wages → rice) collapses.  
    - **Failure point:** Bust-side collapse—fixed wages lose value against hyperinflated rice prices.  
  - **Key Mechanism:** The **fixed money wage** detached from market prices. Remove this (e.g., index wages to rice prices), and laborers maintain purchasing power—no famine. Close the province to trade, and local prices stabilize; starvation eases.  

  ### Addressing Objections  
  - **"Rigged!" (Availability Theorist’s Attack):**  
    - Claim: "District B’s ‘net imports’ hide reduced *physical access* due to delayed shipments or spoilage."  
    - **Rebuttal:** The case assumes efficient trade. Imports rise *before* starvation peaks (Month 10), and prices remain high due to embedded costs (transport, quality premiums), not scarcity. The attack doesn’t land—the ledger shows more grain in B, yet laborers’ wallets can’t claim it.  

  ### The Concrete Object: The Wage Envelope  
  Laxmi’s **wage envelope**—stubbornly holding forty copper rupees each month—embodies the crisis. It is inert, unresponsive, and tragically tangible. When the chalkboard’s price climbs, the envelope’s promise evaporates. Readers see her count coins under lamplight, touch the frayed paper, and feel the injustice of numbers that refuse to change as the world burns.  

  ---

  ### Why This Works for Your Novel  
  - **No Villains:** The governor’s idealism, merchants’ opportunism, and landowners’ profit-seeking are rational choices. No malice required.  
  - **Reader’s Complicity:** The system—not a hoarder or war—is the antagonist. The envelope forces readers to confront how ordinary rules kill.  
  - **Historical Fidelity:** Mirrors Bengal’s wage-price disconnect (1943) but removes war by substituting peacetime commercialization.  

  > "The envelope was always forty rupees. The world around it was not."
