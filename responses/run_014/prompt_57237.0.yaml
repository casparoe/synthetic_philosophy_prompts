  Phase 1: Students compare and rank a set of images without any provenance information. They must write down their rankings and reasons, creating commitments they can't easily walk back from.

  Phase 2: Reveal the provenance of each image in a way that contradicts some of their initial judgments, causing discomfort.

  Phase 3: Students try to spot a fake in a pair of images without knowing if a fake is present, which will challenge the "train your eye" intuition.

  We'll include AI-generated images and historical forgeries. The activity requires active deception, so we must plan how to manage that ethically.

