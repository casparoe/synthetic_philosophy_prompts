  We are going to structure the research proposal around the core problem: the tension between the demand for a fine-grained notion of content that blocks logical omniscience and the requirement that logical consequence be a relation on the very contents that agents can know. The key is to frame the question precisely and then to investigate whether these two demands can be jointly satisfied.

  Step 1: Framing the Question Precisely

  The current question "Is there a middle notion of content?" is too vague. We need to specify what counts as a "middle notion" by setting two clear criteria:

  Criterion 1 (Fine-grainedness): The notion of content must be fine-grained enough to block the logical omniscience property. That is, there must exist at least one logically competent agent (in a sense to be defined) who can know a proposition P without knowing some logical consequence Q of P, because the content of P and the content of Q are distinct.

  Criterion 2 (Consequence as a relation on contents): The notion of content must be such that logical consequence is a relation between contents. That is, if Q is a logical consequence of P, then there must be a relation of logical consequence holding between the content of P and the content of Q.

  Additionally, we require that the agent can stand in the knowledge relation to these contents.

  But note: the second criterion might be too weak if we allow the consequence relation to be defined in a way that doesn't connect the contents in a manner that supports reasoning. So we add:

  Criterion 3 (Reasoning-preserving): The notion of content must allow that when an agent knows P and P logically entails Q, then by a process of reasoning (that doesn't require infinite resources, but is otherwise idealized) the agent can come to know Q, and this process must be such that the knowledge of Q is based on the knowledge of P and the entailment. Crucially, the agent must be able to preserve knowledge from the content P to the content Q.

  The question then becomes:

  Can we define a notion of propositional content that simultaneously satisfies:

  1. Fine-grainedness: Contents of logically equivalent propositions may be distinct (so that knowing one does not imply knowing the other).

  2. Consequence: Logical consequence is a relation on the set of contents (so if Q is a logical consequence of P, then the content of P stands in the consequence relation to the content of Q).

  3. Reasoning-preserving: There is a feasible (in an idealized but non-trivial sense) process by which an agent who knows the content of P and the fact that the content of P stands in the consequence relation to the content of Q can come to know the content of Q, and this process is knowledge-preserving in that the agent's knowledge of Q is based on the knowledge of P and the consequence.

  If such a notion of content exists, then we have a middle notion. If not, then we have an impossibility result.

  Step 2: Why Existing Responses Leave the Question Open

  Existing approaches to logical omniscience can be categorized, but they typically do not address the core tension because they either:

  - Change the knowledge operator (e.g., impossible worlds, awareness, resource bounds) without changing the underlying content (which remains truth-conditional). Thus, they do not challenge the identity of logically equivalent propositions at the content level.

  - Or, in the case of some hyperintensional approaches, they do fine-grain content (e.g., by using syntactic structures or structured propositions) but then they face the problem that logical consequence is no longer a relation on contents (because if P and Q are distinct even when logically equivalent, then the consequence relation must relate distinct objects, but the reasoning-preserving property becomes problematic: if the content of P is different from the content of Q, then knowing P doesn't automatically give you Q, and the step from P to Q requires an additional act of recognition).

  The existing approaches do not attempt to satisfy all three criteria simultaneously. For example:

  - Impossible worlds: The content is still truth-conditional (so criterion 2 is maintained in a way) but the worlds are expanded to break some logical equivalences. However, the consequence relation in the traditional sense is lost because in impossible worlds, logical truths may fail. So criterion 2 (if we require that the consequence relation is classical) is violated. Also, reasoning-preserving might be maintained for some steps but not for all.

  - Awareness and syntactic approaches: Content is often taken as sentences (so very fine-grained). Then the consequence relation is defined on the syntactic level (e.g., by a deductive system). But then the knowledge operator is defined on the syntactic objects, and the reasoning-preserving property might be achieved by closure under deduction. However, the problem is that the contents (the sentences) are too fine-grained: they are not the same as the propositions that we typically take as the objects of knowledge. Moreover, the consequence relation in the logical sense is not a relation between the contents (the sentences) but between their meanings. So criterion 2 is not satisfied in the intended way.

  - Resource-bounded reasoning: This approach typically keeps the standard notion of content (truth-conditional) and then restricts the knowledge operator by computational limits. But then the problem of logical omniscience is avoided by making knowledge depend on computational resources. However, this does not change the content: logically equivalent propositions are still the same. So criterion 1 is not satisfied.

  Therefore, the existing approaches either sacrifice criterion 1 (by keeping content coarse-grained) or criterion 2 (by altering the consequence relation) or criterion 3 (by making reasoning non-idealized). Our question remains open because we are asking for a notion of content that satisfies all three.

  Step 3: Method

  The project will be divided into three months:

  Month 1: Construct the squeeze argument as rigorously as possible.

  - Formalize the three criteria (using a formal language and a model of knowledge and content).
  - Show that if we have a very coarse-grained content (like possible worlds) then criteria 2 and 3 are satisfied but criterion 1 fails.
  - Show that if we have a very fine-grained content (like syntactic forms) then criterion 1 is satisfied and criterion 3 might be satisfied (by closure under deduction) but criterion 2 fails because the consequence relation is not a relation on the contents (it is a relation on the meanings, or defined by the deduction rules, but the contents are not structured in a way that the consequence relation is inherent to them).
  - Then, attempt to show that any notion of content that satisfies criteria 1 and 2 must violate criterion 3, and vice versa.

  The goal of this month is to produce a clear impossibility argument.

  Month 2: Attempt to break the squeeze by constructing candidate middle notions.

  - Candidate 1: Structured propositions (like in Russell or Carnap). We can have the content of P be a structure (e.g., a tree) and the content of Q be a different structure even if they are logically equivalent. Then we can define a consequence relation on structures (e.g., by a recursive definition). But then we must check if reasoning-preserving holds: can the agent, by a feasible process, move from knowing one structure to knowing a consequence structure? The worry is that the step might require complex computation and hence violate the idealized but feasible requirement.

  - Candidate 2: Truthmaker semantics (as in Fine). Contents are sets of truthmakers and falsemakers. Logically equivalent propositions might have different sets of truthmakers. Consequence can be defined as: every truthmaker for P is a truthmaker for Q? But that would make P and Q have the same content if logically equivalent? Or we can have a more fine-grained consequence? We need to adjust the truthmaker semantics to allow for non-classical consequence. Then we must check the reasoning-preserving property.

  - Candidate 3: Algebraic semantics (using lattices or similar). We can have an algebraic structure where elements are contents and there is a partial order (for entailment). But then if we want to break logical omniscience, we need elements that are logically equivalent (in the classical sense) to be distinct in the algebra. Then we have to define a non-classical logic for the algebra? Then we must check if we can recover a reasoning-preserving property.

  For each candidate, we will:

  a) Define the notion of content.
  b) Define the consequence relation on these contents.
  c) Model the knowledge operator (so that an agent can know one content without knowing a consequence content, satisfying criterion 1).
  d) Check if the consequence relation is indeed a relation on the contents (criterion 2).
  e) Define a reasoning process that takes an agent from knowing P and knowing that P entails Q to knowing Q, and show that it is feasible and knowledge-preserving (criterion 3).

  Month 3: Evaluate the candidates and draw conclusions.

  - If one candidate satisfies all three criteria, then we have a positive result. We must then assess the cost: what does this notion of content require us to give up? (For example, does it force a non-classical logic? Does it require a complex ontology of contents? Does it make reasoning too complex?)

  - If no candidate satisfies all three, we strengthen the impossibility argument and explore the boundaries: what minimal relaxations of the criteria would allow for a solution? Or is the tension fundamental?

  - Also, if we find that the squeeze argument can be broken in one candidate, we then test its robustness: does it work for all logical systems (propositional, modal, etc.)? Or only for fragments?

  Step 4: What Success and Failure Look Like

  Success:
  - A clean impossibility result: showing that any notion of content that satisfies criteria 1 and 2 must violate criterion 3, and vice versa. This would be a significant philosophical result because it would show that the problem of logical omniscience is not a defect in the model of knowledge but a fundamental tension in the concept of reasoning and content.

  - Alternatively, a coherent middle notion of content that satisfies all three criteria, along with an honest accounting of what it requires (e.g., a non-classical logic, or a structured ontology of contents, or a specific model of reasoning).

  Failure:
  - The squeeze argument is found to rest on an equivocation (e.g., the term "consequence" is being used in two different senses). This would be a negative outcome but still valuable: it would clarify that the tension is not real.

  - The middle notion exists but only by gerrymandering what "consequence" means (e.g., by defining a non-standard consequence relation that doesn't capture classical logic, or by making the reasoning process trivial in an unacceptable way). This would be a partial success because it would show that the classical notion of consequence cannot be maintained.

  Step 5: Time Assessment

  Three months is tight but feasible for a summer project because:

  - The first month (constructing the squeeze) is well-defined and can be done by building on existing formal frameworks.

  - The second month (building candidates) is more exploratory, but we have three candidates in mind. We can focus on one or two if time is short.

  - The third month (evaluation) is analytical and writing.

  However, if we find that constructing the squeeze argument takes longer, we might need to scope down. I recommend starting with the squeeze argument and having the candidates as a backup. If the squeeze argument is watertight, then the project can be about that. If it breaks, then we move to the candidates.

  Alternatively, we can scope down to one horn: either focus entirely on the impossibility argument (if we are confident) or focus on one candidate (e.g., structured propositions) and see if it can be made to work.

  But given the three months, the three-step plan (squeeze, candidates, evaluation) is achievable if the candidate construction is kept simple.

  Step 6: Confidence and Uncertainty

  I am confident that the framing of the three criteria captures the core tension. However, the point I am least sure about is:

  - The definition of the reasoning-preserving criterion (criterion 3). What counts as a "feasible process" that is "idealized but non-trivial"? We need to avoid requiring too much (so that it becomes trivial) or too little (so that it becomes impossible). I suspect that this criterion is the most vulnerable to attack and might be the source of the squeeze. But without it, the middle notion of content might not solve the problem of reasoning.

  Therefore, we must be very careful in formalizing criterion 3. We might have to allow for a notion of reasoning that is not truth-preserving in the classical sense, but rather content-preserving in the new framework.

  Overall, the project is high-risk, high-reward. If we get an impossibility result, it's a strong outcome. If we find a candidate, that's also strong. But if we end up with a muddle, then it's a failure. However, even a muddle would be informative.

  Conclusion: We proceed as outlined.
answer: |-
  ### Research Proposal: The Fine-Graining Dilemma and Logical Omniscience

  **Title:** The Impossibility of Content: A Squeeze Argument for Logical Omniscience

  #### 1. Research Question and Core Problem
  The problem of logical omniscience—where idealized agents know all logical consequences of their beliefs—is typically treated as a flaw in *epistemic models* (e.g., knowledge operators). I argue the issue originates earlier, in the *individuation of content*. Standard possible-worlds semantics equates logically equivalent propositions, making omniscience inevitable: if \(P\) and \(Q\) are identical when \(P \models Q\), knowing \(P\) *just is* knowing \(Q\). Existing "fixes" (e.g., impossible worlds, resource bounds) alter the knowledge relation but leave content coarse-grained. My hypothesis is that no notion of propositional content can simultaneously satisfy three desiderata:  
  - **Fine-Grainedness (FG):** Logically equivalent propositions (e.g., \(P\) and \(\neg\neg P\)) can have distinct contents, allowing agents to know one without the other.  
  - **Consequence Preservation (CP):** Logical consequence (\(\models\)) is a relation between contents themselves (i.e., if \(P \models Q\), the content of \(P\) stands in \(\models\) to the content of \(Q\)).  
  - **Reasoning Feasibility (RF):** Agents can preserve knowledge through logical reasoning: knowing \(P\) and that \(P \models Q\) permits gaining knowledge of \(Q\) via a feasible (though idealized), content-preserving process.  

  **Determinate Question:**  
  *Is there a notion of propositional content satisfying FG, CP, and RF under classical logic?*  
  - **Yes:** Exhibit such content, demonstrating how it meets all three.  
  - **No:** Prove that FG + CP implies the failure of RF (or vice versa), revealing a fundamental tension.  

  This formulation avoids vagueness:  
  - **Content** is defined as the object of propositional attitudes (e.g., what is known).  
  - **Logical consequence** is fixed to classical logic (to avoid gerrymandering).  
  - **Feasible reasoning** requires that the process (i) is truth-preserving, (ii) operates over contents (not syntax), (iii) is executable by a computationally idealized agent (e.g., polynomial-time steps for finite cases), and (iv) transfers justification from \(P\) to \(Q\). RF ensures reasoning is not magical—knowledge of \(Q\) is *because* of \(P\) and the entailment.  

  The squeeze arises because:  
  - FG demands distinct contents for equivalents, blocking trivial omniscience.  
  - CP demands \(\models\) directly relates contents, ensuring consequence is "about" the objects of knowledge.  
  - RF demands agents can "move" knowledge across contents via reasoning.  
  If FG + CP force reasoning to require *new* content (e.g., relearning \(Q\) from scratch), RF fails. If RF requires identical contents, FG fails. The question is whether these can cohere.

  #### 2. Why Existing Approaches Leave the Question Open
  Current solutions address logical omniscience by modifying the *knowledge operator* or *epistemic access*, not content individuation. Thus, they implicitly assume coarse-grained content and evade the core tension. My question remains open because these families do not—and often cannot—satisfy FG, CP, and RF simultaneously.  

  - **Impossible Worlds (e.g., Rantala, Bjerring):**  
    Expand possible worlds to include "impossible" states where logic fails. **Why open?** Content remains truth-conditional (violating FG: \(P\) and \(\neg\neg P\) are identical in *possible* worlds). CP is compromised because consequence lacks a uniform definition (e.g., \(P \models Q\) may not hold in all impossible worlds). RF fails because reasoning in inconsistent worlds doesn’t preserve truth. These models alter entailment, not content, leaving FG unmet.  

  - **Awareness and Syntactic Approaches (e.g., Fagin, Halpern):**  
    Agents only "know" propositions within their syntactic awareness set. **Why open?** Content is often equated with sentences (achieving FG), but CP is not a relation between *contents*—it’s defined derivationally (e.g., via proof rules). RF holds for explicit deductions, but knowledge of \(Q\) depends on syntax, not content-based consequence. If content is sentence-like, CP reduces to syntactic entailment, losing propositional character.  

  - **Algorithmic/Resource-Bounded Models (e.g., bounded rationality, Duc):**  
    Knowledge requires explicit computation within limits. **Why open?** Content is still coarse-grained (FG fails: \(P\) and \(\neg\neg P\) are identical). CP holds, but RF is weakened to bounded steps, violating idealization. These patch knowledge, not content, so the identity of equivalents persists.  

  - **Hyperintensional Semantics (e.g., structured propositions, Cresswell; truthmakers, Fine):**  
    Content is finer-grained (e.g., structured entities). **Why open?** FG is achieved, but CP and RF are problematic. In structured propositions, \(P \models Q\) is not a direct relation between contents—it’s defined via models or proofs, so CP fails. RF requires "flattening" structures during reasoning, which may not be feasible or content-preserving. Truthmakers distinguish equivalents (FG) but define consequence via truthmaker inclusion, which may collapse equivalents (violating FG) or break classical \(\models\) (violating CP). None ensure RF without smuggling coarse-graining.  

  All approaches sacrifice at least one desideratum: they alter knowledge, entailment, or logic itself—not content. Thus, the tension between FG, CP, and RF is untouched. My decision-theory friend’s "fine-graining debate" reference misses this: existing work fine- grains *knowledge*, not content, or abandons CP/RF.

  #### 3. Methodology: A Self-Critical Squeeze
  **Overarching Approach:**  
  I will rigorously formalize the squeeze argument, then test it against candidate content notions. This avoids survey-style lit reviews by targeting a novel, determinate result (impossibility or construction). A survey would only show existing patches fail FG+CP+RF; my method probes *why* they fail and whether any *can* succeed.  

  **Month-by-Month Plan:**  
  - **Month 1: Formalize the Squeeze Argument (Uncharitably).**  
    - **Goal:** Construct the strongest impossibility case.  
    - **Steps:**  
      (i) Define content formally: as a function from epistemic states to truth-conditions (or equivalent).  
      (ii) Formalize FG, CP, RF:  
        - *FG:* A mapping \(C\) where \(C(P) \neq C(Q)\) for some \(P \equiv Q\).  
        - *CP:* A relation \(\models_C\) on contents such that if \(P \models Q\), then \(C(P) \models_C C(Q)\).  
        - *RF:* An algorithm \(A\) where, given knowledge of \(C(P)\) and \(C(P) \models_C C(Q)\), \(A\) outputs knowledge of \(C(Q)\) in feasible steps, with justification traceable to \(C(P)\).  
      (iii) Derive a contradiction: Assume FG+CP. Show that for \(P \models Q\), \(C(P) \neq C(Q)\) (by FG). Then, for RF to hold, \(A\) must "bridge" distinct contents, but this requires inferring \(C(Q)\) *de novo* (lacking justification from \(C(P)\)) or invoking auxiliary content (violating content preservation).  
    - **Self-Critique:** Stress-test assumptions:  
      - Is classical \(\models\) essential? (Yes, to avoid trivializing CP.)  
      - Does RF demand content identity? (No, but justification must transfer.)  
      - Can \(\models_C\) be non-classical? (No, per CP’s definition.)  
    - **Output:** A paper draft outlining the squeeze.  

  - **Month 2: Build and Test Candidate Content Notions.**  
    - **Goal:** Break the squeeze with 2–3 candidates. Focus on:  
      - **Candidate A: Structured Contents with Computable Consequence.**  
        Content = syntax-independent structures (e.g., trees). Define \(\models_C\) via a decidable subrelation (e.g., for propositional fragments). Test RF: Can agents compute consequences without losing justification?  
      - **Candidate B: Truthmaker-Based Content with Dynamic Consequence.**  
        Content = sets of exact truthmakers (e.g., Fine-style). Define \(\models_C\) as truthmaker inclusion. Test CP: Does inclusion preserve classical \(\models\)? Test RF: Is there a feasible path from \(C(P)\) to \(C(Q)\) when \(P \models Q\)?  
      - **Candidate C: Algebraic Contents (e.g., lattice-theoretic).**  
        Content = elements in a lattice with \(\models_C\) as partial order. Introduce filters for FG. Test RF: Does order-based reasoning preserve knowledge?  
    - **Method:** For each:  
      (i) Define \(C\) and \(\models_C\).  
      (ii) Verify FG and CP.  
      (iii) Model RF: Simulate an agent deriving \(C(Q)\) from \(C(P)\) and \(C(P) \models_C C(Q)\).  
      (iv) Identify failures: e.g., RF requires infinite steps, CP collapses to coarse-graining, or \(\models_C\) isn’t classical.  
    - **Output:** Candidate assessments; refine squeeze if all fail.  

  - **Month 3: Resolve the Squeeze and Generalize.**  
    - **Goal:** Conclude if FG+CP+RF is possible; evaluate costs.  
    - **Steps:**  
      (i) If a candidate works, detail its "costs": e.g., non-classical logic, content complexity, or restricted domains.  
      (ii) If all fail, strengthen impossibility: Show FG+CP implies RF requires content identity or violates feasibility.  
      (iii) Test robustness: Does the result hold for modal extensions (e.g., knowledge of necessities)?  
      (iv) Interpret philosophically: Is omniscience inherent to reasoning?  
    - **Output:** Final paper with (im)possibility result.  

  **Why this over alternatives?**  
  - A pure survey would catalog failures but not advance a positive/negative result.  
  - Focusing on one horn (e.g., just impossibility) is premature; testing candidates may reveal surprises.  
  - This method delivers a result: either a new content model or a proof of tension.

  #### 4. Outcomes and Feasibility
  - **Success:**  
    - **Positive:** A candidate satisfying FG+CP+RF with honest costs (e.g., "Contents require a non-classical \(\models\), sacrificing bivalence"). This would reframe omniscience as soluble via content reform.  
    - **Negative:** A rigorous impossibility proof, showing FG+CP necessitates RF failure (e.g., reasoning becomes justificationally hollow). This implies omniscience is inherent to classical reasoning agents.  
    Either outcome contributes to epistemology and formal semantics.  
  - **Failure Modes:**  
    - **Squeeze Equivocation:** If RF or CP is ill-defined (e.g., "feasible" is ambiguous), the argument collapses. Mitigation: Formalize RF rigorously.  
    - **Gerrymandered Consequence:** A candidate works only by redefining \(\models\) (e.g., as mere compatibility). This is partial success—it reveals classical consequence as the tension source.  
    - **No Clear Result:** Candidates are inconclusive. Fallback: Publish the squeeze and candidate analysis.  

  **Feasibility in 3 Months:**  
  - **Tight but viable.** Month 1 is low-risk (formalization). Month 2 is exploratory but bounded (2–3 candidates). Month 3 leverages prior work.  
  - **Scope Adjustment:** If squeezed early (Month 1), focus on generalizing impossibility. If candidates dominate, prioritize one (e.g., truthmakers).  
  - **Risk:** Month 2 could overrun; I’ll start with simple cases (propositional logic).  

  #### 5. Confidence and Uncertainty
  - **Overall Confidence:** High (80%) that the framing is sound. The core insight—that content individuation forces omniscience—is under explored, and the squeeze exposes a genuine tension.  
  - **Least Confident Point:** **Reasoning Feasibility (RF)**. Defining "feasible, content-preserving process" without trivializing or overidealizing is hard. I worry RF might:  
    - Be too strong: If feasibility requires polynomial steps, even coarse-grained content may fail.  
    - Be too weak: If "idealized" allows infinite steps, RF becomes trivial.  
    Mitigation: Ground RF in agent-based models (e.g., justification-preserving algorithms) and test edge cases (e.g., \(P \models P \lor Q\)).  
  This is the squeeze’s pivot: if RF is indefensible, the dilemma dissolves.  

  **Conclusion:** This project addresses an untouched root of logical omniscience. It delivers a summer’s worth of research (writing + analysis) with clear success/failure. I will begin May 1.  

  ---  
  **Next Steps for Me:**  
  - Develop Month 1 formalization (define \(C\), \(\models_C\)).  
  - Preempt RF critiques (e.g., consult computability literature).  
  - Identify candidate starting points (e.g., exact truthmakers).
