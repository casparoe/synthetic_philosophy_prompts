prompt: |-
  A friend of mine in the department who does decision theory told me my idea about logical omniscience was just the old fine-graining debate with extra steps, and I've been stewing on it for two weeks, so now I want to see if it survives being written up properly. I'm a second-year PhD student and I need a short research proposal out of this — 1500 words or so, for a summer grant, three months of work, one person (me), no lab, no data collection, just thinking and writing. My half-formed idea: the problem is nearly always presented as a problem for *knowledge* — our models of knowledge entail too much — and the fixes are patches on the entailment relation (impossible worlds, awareness predicates, procedural or algorithmic semantics, resource bounds on derivation). My hunch is that the disease is upstream of the knowledge operator. Possible-worlds semantics individuates *content* by truth-conditions, so logically equivalent propositions are literally one and the same object; and if content is individuated that coarsely, then omniscience about consequence isn't a defect in our theory of knowledge at all, it's forced by the identity of the thing the agent is related to. So the interesting question isn't "how do we stop agents from knowing consequences," it's something like: is there a notion of propositional content fine-grained enough to block omniscience while still coarse enough that logical consequence is a relation between the very contents an agent can stand in the knowledge relation to — and are those two demands jointly satisfiable, or do they form a disguised contradiction? The reason I suspect a squeeze: if you fine-grain content enough to distinguish logically equivalent items, you seem to lose the right to say reasoning is knowledge-preserving, because the content you knew at the start and the content you know at the end aren't the same content, so nothing got carried across; and if the squeeze is real, that's a better result than another patch, since it would say omniscience isn't a bug in any particular semantics but a structural tension in the idea of an agent who reasons at all. If it's not real, someone has to exhibit the middle notion of content, and I'd like to try.

  Here's what I actually want from you. State the question so it has a determinate answer — right now "is there a middle notion of content?" could be answered yes or no by fiat depending on how you count notions, and I need you to fix that before anything else. Then explain why the existing families of response leave *my* question open, rather than just assuming they do (this is where I'm most likely to be fooling myself, and where my decision-theory friend thinks I'm fooling myself). Then lay out the method month by month; my sense is it's mostly constructing the squeeze argument as carefully and uncharitably-to-myself as I can, then trying to break it by building two or three candidate middle notions of content and seeing which, if any, survives both horns — but tell me if there's an obviously better approach and why you'd take it over mine, because the obvious alternative (just survey the existing patches and argue they all fail) seems to me like it would produce a lit review rather than a result, and I want to know if I'm wrong about that. Then say what success looks like (a clean impossibility result, or a coherent middle notion plus an honest accounting of what it costs) and what failure looks like (the squeeze turns out to be equivocation, or the middle notion exists only by gerrymandering what "consequence" means). Give me an honest read on whether three months is enough or whether I should scope down to one horn. Don't give me a bibliography or citations — just refer to positions and arguments by what they say, I'll fill in the references myself. And since I'd rather not waste a summer: tell me how confident you are in the way you're framing all this, and single out the one point you're least sure of.
