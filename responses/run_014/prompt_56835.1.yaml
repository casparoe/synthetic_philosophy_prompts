  **Mechanic:** Players assume a uniform prior over possible pairs when computing expected value, but the bounded set and non-uniform distribution of smaller amounts violate this assumption, causing the 1.25A calculation to fail at extremes.

  **Rules and Materials**  
  - **Materials**:  
    - 48 pre-filled envelope pairs (24 students × 2 rounds after initial play).  
    - Tokens: Denominated 2, 4, 8, 16, 32.  
    - Student scorecards to record amounts (A), decisions, and outcomes.  
  - **Banker's Role and Knowledge**:  
    - Banker (instructor) knows the smaller amount (X) in each pair is drawn from {2,4,8,16} with distribution: P(X=2)=1/2, P(X=4)=1/4, P(X=8)=1/8, P(X=16)=1/8.  
    - Banker prepares pairs (X, 2X), shuffles, and distributes one pair per student per round.  
    - Banker knows the switching threshold: Switch if A ≤ 8 (gain/neutral), stick if A=32 (loss), and A=16 is neutral.  
  - **Gameplay**:  
    1. **Round 1 (Free Choice, 15 min)**:  
       - Each student receives one shuffled pair, opens first envelope (sees A), and chooses to switch or stick.  
       - Record A, decision, and final tokens.  
    2. **Class Discussion (10 min)**:  
       - Poll students: "When you saw A, what did you expect from switching? Why?"  
       - Guide them to articulate: "Other envelope is 2A or A/2, each 50% likely → expected value 1.25A → always switch is rational."  
    3. **Round 2 (Forced Switching, 15 min)**:  
       - Same pairs, new draws. All students must switch after seeing A.  
       - Record A and outcome.  
    4. **Round 3 (Forced Sticking, 10 min)**:  
       - New pairs. All students stick after seeing A.  
       - Record A and outcome.  

  **Timeline (75 min)**:  
  - 0-5 min: Explain rules, token conversion (e.g., 10 tokens = 1 participation point).  
  - 5-20 min: Round 1 (free choice).  
  - 20-30 min: Discussion → students derive 1.25A.  
  - 30-45 min: Round 2 (always switch).  
  - 45-55 min: Round 3 (never switch).  
  - 55-70 min: Data tally and compare average tokens:  
    - Free choice vs. always switch vs. never switch.  
    - Isolate results for A=2,4 (gain), A=8,16 (neutral), A=32 (loss).  
  - 70-75 min: Debrief.  

  **Debrief Mapping**:  
  - **Symmetry Problem**: When students computed 1.25A, they assumed symmetry ("2A or A/2 equally likely"). Point to A=32 outcomes: Switching always lost because 32 must be the larger amount (no X=64 possible).  
  - **Smuggled Prior**: In discussion, they implicitly assumed a uniform prior over all possible amounts. Highlight A=16:  
    - Their calculation: 50% chance other is 8 or 32 → expected 20.  
    - Reality: P(X=8) = 1/8, P(X=16) = 1/8 → seeing A=16 means it’s equally likely to be from (8,16) or (16,32) → other envelope is 8 or 32 with equal probability.  
    - Thus, 1.25A holds here, but only by accident.  

  **Predictable Issues**:  
  - **First-run failure**: Students may not observe A=32 (expected frequency 1/16 per round). Mitigate by pre-generating extra high-value pairs to ensure ≥2 students see 32.  
  - **Data noise**: Small samples may blur expected gains at A=16. Use class aggregates to clarify trends.  

  **Bounded Pot Limitation**:  
  - **Cannot reproduce**: The true paradox’s infinite regress. In an unbounded setting, every A could have a larger 2A, making the 1.25A logic self-contradictory (always switching implies perpetual gain). The bounded pot’s edge (A=32) exposes the prior violation but misses this foundational tension. Supply this via post-game discussion: "What if amounts were unbounded? Would 1.25A hold?"
