  *checks clock* Time-sensitive too - next encounter in 48 hours. The verdict must be crystal clear. I'll specify exactly which responses are authorized (3 only) and explicitly state it's not a lie per Augustine. But I won't shy from acknowledging how this technical truth still damages candor.

