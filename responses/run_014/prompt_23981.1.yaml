answer: |-
  **MEMORANDUM**  
  **TO:** Ethics Committee Members  
  **FROM:** Senior Ethics Consultant  
  **RE:** Physician Disclosure Obligations to Unauthorized Estranged Son  
  **DATE:** October 26, 2023  

  ### Case Summary
  An estranged adult son (unauthorized contact, no POA) demands confirmation of his mother’s enrollment in a clinical trial. The physician knows the patient is enrolled. Four responses are under consideration:  
  (1) Deny enrollment (knowingly false);  
  (2) Silence/non-answer;  
  (3) True but misleading refusal ("I can’t share info with unauthorized contacts");  
  (4) Assert ignorance ("I don’t know") despite knowledge.  

  ### Analysis Under Augustinian Framework  
  The Augustinian account defines a lie as **asserting what the speaker subjectively judges false with intent to deceive**. We assess each option accordingly:  
  - **Response (1): "No, she is not in that trial."**  
    *Verdict:* **Lie.** The physician asserts what she knows/judges false. Unambiguously prohibited.  
  - **Response (2): Silence or non-answer.**  
    *Verdict:* **Not a lie.** No assertion is made. Permissible but may escalate agitation.  
  - **Response (3): "I can’t share anything..."**  
    *Verdict:* **Not a lie.** The statement is factually true (reflecting hospital policy) and aligns with the physician’s judgment. Intent to block inquiry via selective truth does not constitute a "double heart" under Augustine.  
  - **Response (4): "I don’t know."**  
    *Verdict:* **Lie.** The physician asserts subjective ignorance she does not possess. Intent to deceive is explicit.  

  ### Confronting the "Verbal Trick" Objection  
  Critics may argue this distinction privileges semantics over moral harm: deception occurs in (3) and (4), violating candor and potentially provoking legal/familial harm. Why not require only full candor (authorized disclosure) or silence?  
  **Rebuttal:** While deception is undesirable, the Augustinian view recognizes material differences in moral culpability. Response (3) upholds fidelity to truth while fulfilling confidentiality duties. Prohibiting *all* deception would force physicians into untenable choices: violate confidentiality (if candor requires disclosure) or abandon legitimate privacy protections. Response (3) is a middle path preserving both honesty and institutional obligations.  

  ### Recommendation & Time Frame  
  **Authorize Response (3) exclusively for the next encounter (within 48 hours).**  
  - **Rationale:** It avoids asserting falsehoods (unlike 1/4) and actively upholds policy (unlike passive silence in 2). Redirecting the son to hospital privacy protocols may de-escalate threats while respecting patient autonomy.  
  - **Directive:** Phrase precisely to avoid ambiguity: *"Under hospital policy and federal law, I cannot disclose any patient information to individuals not listed as authorized contacts."*  

  ### Strongest Counterargument: The Cost of "Technically True" Deception  
  Endorsing Response (3) risks normalizing manipulative language that erodes trust. The son may detect evasion and retaliate legally, or the physician’s intent to mislead could corrode professional integrity. Silence (Response 2) avoids deceit entirely and forces the son to seek recourse through proper channels (e.g., legal guardianship).  

  **Final Balancing:** While silence is ethically safer, it abdicates the physician’s duty to affirm boundaries. Response (3) proactively enforces confidentiality without false assertion. In high-stakes scenarios involving agitated parties, structured clarity is clinically prudent.  

  ---  
  **Verdict:** Authorize only Response (3); not a lie per Augustine.
