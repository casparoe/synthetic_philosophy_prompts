answer: |-
  Plutarch's mirror passage commits him not to imitation of specific actions but to the assimilation of virtues through internalized exemplars, a mechanism reinforced by the "guest" and "repelling" metaphors and fully compatible with his small-signs method.

  Here's why:

  1.  **"Conformity with the virtues" (ἀφομοιοῦν πρὸς τὰς ἀρετὰς) vs. imitation:** Plutarch uses ἀφομοιοῦν ("fashion/adorn in conformity with"), not μιμεῖσθαι ("imitate"). The Greek emphasizes assimilating or shaping one's character *toward* the essential virtues *embodied* by the subject, not copying their specific deeds. The mirror reflects the *character* revealed by deeds, not the deeds themselves as scripts to follow. This targets the underlying moral quality, not the external action.

  2.  **The "Guest" metaphor (συμβιοῦν):** Living daily with these figures as "guests" implies prolonged, intimate familiarity fostering judgment and internalization. This isn't rote copying; it's about absorbing the *ethos* of the exemplar through contemplation. You learn their character deeply, allowing their *virtue* (not their jest or specific battle tactic) to become a habituated part of your moral framework.

  3.  **The "Repelling" mechanism:** Here, the mechanism is explicit: noble characters stored in the soul act as a countervailing force *against* base suggestions. This requires the internal presence of an abstracted ideal ("the fairest of his examples") derived from the life, not the imitation of a specific action. The exemplar functions as an internalized standard or bulwark, repelling vice through contrast, not by prompting copied behavior. The diagnostic detail (the jest) reveals the *character* that constitutes this standard.

  4.  **Compatibility with the Small-Signs Method (Alexander I.2):** The small-signs method (πράξεις μικραί, ῥῆμα, παιδιά) is diagnostic – it reveals *true character* (ἦθος). This is precisely what Plutarch needs for his mirror/guest/repelling mechanisms. The involuntary jest reveals the *virtue or vice* ingrained within the subject. The reader, using the mirror, assimilates the *virtue* thus revealed (e.g., Alexander's clemency or ambition shown in a word), not the specific jest. The small sign validates the exemplar's worth for internalization. The conflict dissolves because the object of assimilation is the *virtue* discerned *through* the sign, not the sign/action itself. What cannot be copied (the unguarded remark) is essential for reliably judging *what* virtue/vice to assimilate/repel.

  **Potential Specialist Contestation:** Some scholars might argue Plutarch *does* expect limited imitation of specific virtuous *actions* in appropriate contexts, seeing his project as more practical. However, the core mechanism described in the cited passages – internalization of virtue revealed by character for shaping one's own moral disposition and resisting vice – is the dominant and most coherent reading of these specific claims, resolving the apparent tension with the small-signs method. The emphasis is always on the *moral character* (ἦθος) disclosed, not the deeds *per se*.
