  The Alexander passage about small signs revealing character actually complements this. If virtue/vice are revealed through involuntary acts, that helps the reader discern true character - essential for selecting which qualities to internalize. There's no conflict because imitation isn't the goal; character judgment is. 

  Specialists might debate whether Plutarch truly avoids imitation, but the textual evidence points toward assimilation. The user needs a definite answer, so I'll state upfront that the mechanism is assimilation of virtues, not imitation of acts. 

