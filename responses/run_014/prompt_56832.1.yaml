  Okay, the user is part of a peer mediation board at their school. They handle cases like cheating and hazing, aiming for genuine apologies. Their advisor mentioned they're accidentally causing shame instead of guilt. Shame makes people defensive, while guilt leads to amends. But the advisor also noted that some philosophers see shame as deeper. The user wants a clear procedure, examples, and whether a school can choose guilt over shame.

  First, I need to address their immediate need: a reusable procedure. They want steps before, during, and after sessions, how to distinguish guilt vs. shame, and when to escalate. Also, they want real case applications without softening outcomes. Plus, a policy question on guilt vs. shame as a cultural choice.

  Breaking down the procedure. Pre-session prep is crucial. They need to gather facts without bias, identify harms, and plan the session structure. During the session, setting the right tone is key. The opening should focus on the incident, not the person. Using "I" statements from the harmed party can help. Then, guiding the respondent to acknowledge actions and impacts. 

  Distinguishing guilt and shame: body language and responses. Guilt might show as remorse, willingness to repair. Shame could be avoidance, defensiveness. Need clear indicators for the mediators. Also, knowing when to stop—like if there's denial or escalation. 

  Applying to cases. Cheating: if the respondent feels guilt, they admit and want to fix it. But if they deflect blame, that's shame. Outcome might be a genuine apology or needing admin intervention. Hazing: if the team minimizes harm, it's shame. They might not take responsibility, leading to escalation. 

  Policy question: Can a school choose guilt over shame? It's possible through consistent practices. Training mediators, aligning consequences with restitution, and adult modeling. But culture is complex; it requires buy-in from everyone. 

  Deep needs: The user might feel uncertain about their role. They need confidence in their process and validation that some outcomes are beyond their control. They also seek philosophical grounding to understand why focusing on guilt is better, despite shame being seen as deeper. They might worry about failing when cases escalate, but need reassurance that escalation is part of the process. 

  Unspoken: They might be struggling with the emotional weight of these cases. Wanting a structured approach to reduce their own stress. Also, perhaps seeking affirmation that their work matters even when outcomes aren't perfect. The advisor's ambiguity might frustrate them, so they crave clear guidelines. 

  Need to ensure the procedure is practical. Steps should be actionable, with examples. Highlighting which steps involve judgment helps them stay critical. Emphasizing that their role is facilitative, not authoritative, might ease pressure. 

  In the cases, showing both possible outcomes prepares them for reality. Policy section should balance idealism with feasibility, acknowledging that while culture change is hard, intentional steps can shift norms. 

  Overall, the user needs empowerment through structure, clarity on emotional nuances, and permission to escalate when necessary. Reinforcing that their aim is repair, not perfection, aligns with restorative justice principles.
answer: |-
  Here's a reusable peer mediation procedure focused on cultivating **guilt** (action-focused repair) over **shame** (identity-focused defensiveness), incorporating your advisor's insights, plus case applications and the policy analysis.

  **Peer Mediation Procedure: Focusing on Guilt, Not Shame**

  **Goal:** Facilitate genuine acknowledgment of harm caused (*guilt*) and commitment to repair, while minimizing experiences of being a "bad person" (*shame*). Escalate when repair isn't achievable within scope/time.

  **I. PRE-SESSION PREP (15-20 mins - Mediators Only)**
  1.  **Gather Facts:** What *specifically* happened? Who was involved? What evidence exists? (Focus on observable actions, not interpretations). *(Judgment Step: Deciding what constitutes a fact vs. rumor/interpretation).*
  2.  **Identify Reported Harm:** What did the harmed party(s) say was the impact? (e.g., "I felt betrayed," "I was embarrassed," "I lost trust"). Avoid "they made me feel..." language for now.
  3.  **Clarify Mediation Goal:** What specific repair are we realistically aiming for? (e.g., "A genuine apology and agreement not to collaborate unfairly again," "Acknowledgement the hazing was harmful and a commitment to change team initiation").
  4.  **Plan Opening Statement:** Draft a neutral, factual description of the incident *focusing solely on actions* (e.g., "We're here because on [date], during [event], [Action A] occurred involving [Person X] and [Person Y]. [Person Y] reported feeling [Harm B] as a result."). **AVOID:** Adjectives ("mean," "stupid," "dishonest"), labels ("cheater," "bully"), or assumptions about intent.
  5.  **Assign Roles:**
      *   **Lead Facilitator:** Guides the conversation, manages time.
      *   **Harm Focuser:** Ensures the harmed party's perspective is clearly heard and understood.
      *   **Action Checker:** Listens for respondent's acknowledgment of *specific actions* and *impact*.
      *   **Shame/Guilt Spotter:** Observes body language & language for cues (see Section III).
      *   **Note Taker:** Records key points, agreements, deadlocks.
      *   **Teacher Liaison:** Signals if escalation is needed, manages time warnings.

  **II. THE SESSION (Structure - ~40 mins)**

  1.  **Opening (5 mins):**
      *   Welcome & Purpose: "Welcome. We're the peer mediators. Our goal today is to understand what happened and see if we can find a way forward everyone can agree on."
      *   Ground Rules: Confidentiality within the school process, respect (listen, no interrupting), honesty, focus on solutions. Mediators are neutral.
      *   **Lead Facilitator:** Reads the prepared, *action-focused* incident statement.
      *   **Harmed Party (HP):** "Can you tell us, in your own words, what happened from your perspective, and how it affected you?" (Guide HP to use "I" statements: "I saw...," "I felt...," "It impacted me because...").
      *   **Action Checker:** Ensures HP describes *actions* and *their feelings/impact*. Intervenes gently if HP uses shaming language ("You're a liar!" -> reframe: "Can you say what they *did* that made you feel lied to?").

  2.  **Understanding (15 mins):**
      *   **Respondent (R):** "Thank you. [Respondent], can you tell us your understanding of what happened? What was your part in it? What did you understand the impact to be on [HP]?" **CRITICAL PHRASES:** "Your part in it," "Your understanding of the impact." **AVOID:** "Why did you do that?" (Triggers justification/shame).
      *   **Mediator Tasks:**
          *   **Action Checker:** Does R acknowledge *their specific actions*? ("I sent the screenshot," "I went along with the prank," "I copied the answer")? If not, ask: "Can you clarify what action you took?".
          *   **Harm Focuser:** Does R acknowledge *the reported impact*? ("I see now how that made you feel betrayed," "I didn't realize it would embarrass you that much"). If not, ask: "What do you understand about how [HP] says they were affected?".
          *   **Shame/Guilt Spotter:** Actively observing (see Section III).
          *   **Lead:** Manage defensiveness. Reframe accusations ("It sounds like you feel blamed... Our focus is on understanding the actions and their impact.").

  3.  **Exploring Repair (15 mins):**
      *   **HP:** "What would help repair the situation or prevent it from happening again?" (Guide towards concrete actions: an apology, changed behavior, restitution if appropriate/small).
      *   **R:** "Hearing that, what are you willing to do or commit to to address the harm caused?" **KEY QUESTION.** Listen for commitments that address the *action/harm*, not self-punishment.
      *   **Mediators:** Facilitate negotiation. Focus on *future actions & commitments*. **AVOID:** Demands for public humiliation, excessive self-flagellation, or vague promises ("I'll be better"). Seek concrete agreements: "I will apologize sincerely to [HP] before Friday," "I will not share private chats without consent," "I will propose a new team initiation to the coach that focuses on skill-building, not humiliation."

  4.  **Closing (5 mins):**
      *   Summarize any agreements clearly. Write them down. Have both parties verbally agree.
      *   State consequences of not following agreement (e.g., "If this agreement isn't followed, it will be referred to [Teacher/Admin]").
      *   Thank participants for their effort.

  **III. READING REACTIONS: GUILT vs. SHAME (Shame/Guilt Spotter Focus)**

  *   **Guilt Cues (Aim for this):**
      *   **Language:** Focuses on the *action* ("What I did was wrong," "Sending that screenshot was a betrayal," "Going along with that prank was hurtful"). Uses "I" statements about actions. Expresses remorse *for the impact* ("I'm sorry I made you feel that way," "I regret causing you embarrassment"). Open to discussing repair.
      *   **Body Language:** Eye contact (may be difficult but attempted), forward lean (engaged), genuine expressions of remorse (sadness, concern), relaxed posture when discussing repair.
      *   **Willingness:** Actively participates in finding solutions, offers specific repair ideas.

  *   **Shame Cues (Redirect or Escalate):**
      *   **Language:** Focuses on *self* ("I'm terrible," "I'm such an idiot," "You must hate me"). Globalizes ("I always mess up"). Minimizes ("It was just a joke," "No big deal," "Everyone does it"). Blames others ("They made me do it," "You started it"). Deflects ("Why are we even talking about this?"). Silent treatment.
      *   **Body Language:** Avoiding eye contact, slumped posture, covering face, angry/defensive posture (crossed arms, glaring), tears of frustration/anger, shutting down.
      *   **Unwillingness:** Refuses to acknowledge actions/impact, stonewalls, makes unrealistic promises ("I'll never do anything wrong again!"), focuses on punishment over repair.

  **IV. WHEN TO STOP & ESCALATE (Teacher Liaison Signals Lead)**

  *   **Immediate Escalation (Safety):** Threats of violence, disclosure of severe harm (e.g., assault, self-harm), severe bullying.
  *   **Escalation Due to Process Failure:**
      *   R **denies core facts** *supported by evidence* and refuses to engage.
      *   R exhibits **intense shame reactions** (complete shutdown, lashing out, self-loathing) that block productive discussion *after* mediators attempt redirection ("It seems like this is really hard to talk about right now").
      *   **No progress** towards acknowledging actions/impact after 20 mins of discussion.
      *   HP or R becomes **verbally abusive**.
      *   The **requested repair** is unreasonable, unsafe, or beyond mediators' scope (e.g., demanding expulsion, public apology assembly).
      *   Agreement **cannot be reached** on concrete steps forward.
  *   **Process:** Lead Facilitator: "Thank you both for your time. It seems we're not able to reach an agreement/resolution today through mediation. We will refer this to [Teacher Advisor/Administrator] for next steps." Teacher advisor takes over.

  **CASE APPLICATIONS (Unsoftened)**

  1.  **Cheating & Lying for a Friend:**
      *   **HP:** Student who was cheated off of/reported the cheating. Harm: "I felt my work was stolen and my trust was broken. It undermined the test for everyone."
      *   **R1:** Student who cheated. **R2:** Student who lied for them.
      *   **Prep:** Gather test papers, witness statements (if any). Goal: Admission of cheating/lying, genuine apology, agreement on academic consequences (re-test? zero? - *may need admin input*), commitment to honesty.
      *   **Session:**
          *   R1 (Cheater): "I panicked. I copied your answers on Q3-5. I knew it was wrong. I see now it made you feel violated and messed up the curve. I'm sorry." (**Guilt** - Action focused, acknowledges impact). OR "Whatever. It was just a few answers. Everyone looks sometimes. This is stupid." (**Shame** - Minimizes, deflects).
          *   R2 (Liar): "I covered for them when the teacher asked. I know I lied. It made the whole situation worse and broke your trust in me too. I shouldn't have done it." (**Guilt**) OR "He's my friend! What was I supposed to do? You're just trying to get us in trouble!" (**Shame** - Blames others, deflects).
      *   **Repair:** If **Guilt** present: Sincere apologies to HP and teacher, acceptance of academic penalty (e.g., zero on Q3-5), written commitment to academic honesty. Agreement signed.
      *   **Escalation Point:** If **Shame** present (denial, minimization, blaming) - especially from R1. Mediators can't force admission. "We're unable to reach agreement on what happened. We need to refer this to [Admin]." **Outcome We May Hate:** Cheater and liar face standard punishment (e.g., test zero, detention) without genuine remorse or repaired trust. Mediation "failed" on the apology front, but facts were established for admin.

  2.  **Team Hazing a Freshman:**
      *   **HP:** Freshman. Harm: "They made me wear a ridiculous costume and do embarrassing stunts in front of everyone at lunch. I felt humiliated and stupid. I don't feel welcome on the team."
      *   **R:** Team Captain + 1-2 key members involved.
      *   **Prep:** Gather description of event, witnesses. Goal: Acknowledgement the hazing was harmful, sincere apology, commitment to change team initiation.
      *   **Session:**
          *   R (Captain): "It was supposed to be tradition, bonding. We had you do the skit and wear the hat. I see now how it made you feel singled out and humiliated instead of welcomed. That wasn't okay. I'm sorry." (**Guilt** - Actions, impact, apology). OR "It's just team spirit! Everyone goes through it. You need to toughen up. It's not a big deal." (**Shame** - Minimizes, blames HP - "toughen up").
      *   **Repair:** If **Guilt** present: Sincere apology to HP. Commitment to *immediately* stop the hazing ritual. Plan to co-create (with HP input?) a positive welcome activity with the coach. Agreement signed.
      *   **Escalation Point:** If **Shame** present (minimization, blaming HP, refusal to change). "It seems we disagree on whether the activity was harmful and whether it should change. We need to refer this to the coach and [Admin]." **Outcome We May Hate:** Team doubles down. HP quits the team. Coach/Admin *might* force a change but without team buy-in, resentment festers. Mediation "failed" to change the culture immediately.

  **Can a School Choose Guilt Over Shame as Policy?**

  **Yes, but it's a cultural shift, not just a policy checkbox.** Here's how:

  1.  **Philosophy & Training:** Explicitly adopt a **Restorative Justice (RJ)** approach school-wide. Train *all* staff (teachers, admin, coaches) and peer mediators on RJ principles, emphasizing harm, responsibility, and repair over blame and punishment. Teach the guilt/shame distinction.
  2.  **Language Matters:** Mandate action-focused language in all disciplinary/mediation settings. Scripts for teachers: "Tell me about the choice you made..." instead of "Why are you so bad?". Praise effort and improvement ("You worked hard to fix that mistake") over global traits ("You're so smart").
  3.  **Consequences Focused on Repair:** Design consequences that *logically relate to repairing the harm* (apology letters, community service related to the harm, restitution, skills training) rather than purely punitive measures (detention, suspension) *whenever possible and safe*. Punishment often breeds shame; repair fosters guilt.
  4.  **Modeling by Adults:** Adults must consistently model accountability without shame. When a teacher makes a mistake, they should model: "I made a mistake by [action]. I see how that [impact]. I will [repair]."
  5.  **Mediation Focus:** Use procedures like the one above, consistently focusing on actions and impact. Escalate when shame blocks repair.
  6.  **Reinforce Guilt Language:** Notice and positively reinforce when students take responsibility for specific actions and their impact. "I appreciate you acknowledging what you did and how it affected them."

  **The Challenge:** Shame is deeply ingrained culturally and often feels "natural" as a motivator (or controller). Choosing guilt requires constant, conscious effort against this tide. Some individuals or situations will trigger shame regardless. **It's not about eliminating shame entirely** (which might be impossible), but about **systematically prioritizing and cultivating guilt** as the more productive moral emotion for repair and growth within the school's formal processes. It's absolutely a choice a school culture can intentionally make, but it demands commitment beyond just peer mediation. It requires embedding "action-responsibility-repair" into the school's DNA.

  This procedure gives you a clear, actionable framework. Remember, mediation doesn't always "succeed" in getting the perfect apology, but sticking to this process ensures you've focused on the right things and know when it's time for adult intervention. Good luck!
