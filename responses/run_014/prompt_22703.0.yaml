answer: |-
  You've hit on a beautifully complex character moment, and your instincts are spot-on: sanding Ruth down would ruin the point. The editor's note likely stems from **cognitive dissonance** for the reader. Ruth's *message* is correct (stop him from driving drunk!), but her *delivery* and her *history* create a jarring disconnect. It feels "off" because it risks reading as **unprocessed hypocrisy or unresolved trauma manifesting as cruelty, rather than genuine concern anchored in her hard-won sobriety.**

  Here's how to diagnose and fix it while keeping Ruth's edge:

  **Why It Feels "Off":**

  1.  **The Sting of Hypocrisy (Even If Deserved):** Ruth knows intimately the monster alcohol turns you into. She *was* that person. For her to now wield that knowledge as a weapon, dripping with judgment, feels less like intervention and more like kicking someone *while* they're down, especially if she hasn't fully confronted the wreckage *she* caused *him* specifically. It can come across as her using *his* weakness to feel superior about *her* recovery, rather than acting from pure concern.
  2.  **Unresolved Baggage vs. Pure Motivation:** Her anger likely isn't *just* about his imminent danger. It's tangled with:
      *   Residual guilt/shame seeing her past reflected in him.
      *   Anger at *him* for past hurts (real or perceived) during her drinking or after.
      *   Fear triggered by seeing the chaos she once embodied.
      *   Resentment that his public drunkenness might reflect poorly on *her* ("See, she drove him to this," etc.).
      *   The sheer stress of encountering him unexpectedly in this state.
      *   **If this complex cocktail isn't visible to the reader (or worse, if Ruth isn't even *aware* of it herself in the moment), her attack feels unanchored and overly harsh.**

  3.  **Lack of Self-Awareness in the Moment:** Sobriety often involves brutal honesty with oneself. If Ruth launches this attack without *any* flicker of recognition about her own past mirrored in him, or without *any* internal flinch at her own cruelty, it reads as her having learned nothing, simply swapping one form of toxicity (drunken cruelty) for another (sober judgment).
  4.  **The "How" Matters:** "Going after him hard" with "heat and real judgment" is the key. *What* she says might be factual, but the *tone* (scorn, disgust, personal attack) undermines the life-saving intent. It feels like she's condemning the *sinner*, not trying to stop the *sin*.

  **How to Fix It While Keeping Ruth's Edge & Complexity:**

  1.  **Make the Internal Conflict Explicit (Show, Don't Tell):**
      *   **Physical Reaction:** Before she speaks, show Ruth's visceral reaction. A cold sweat, a wave of nausea, her hands shaking – not just anger, but *recognition* and *fear*. This immediately signals to the reader: *This isn't simple anger; this is trauma.*
      *   **Flood of Memories:** As she sees him, have a specific, brutal memory flash through her mind – *her* being the one falling down drunk, *her* saying something unforgivable to *him*, the look on his face. Connect *his* present state to *her* past actions instantly for the reader.
      *   **Internal Monologue:** *"God, he looks like I did. The slack jaw, the glazed eyes... just like that night at Sarah's wedding when I..."* Or *"Shame washed over me, hot and thick. My own ghost stood there, reeking of bourbon and regret."* Or even *"The fury rose, sharp and familiar. Part terror for him, part rage at the memory of what *I* put people through, part... something else. Old wounds ripped raw."*

  2.  **Anchor the Confrontation in HER Experience, Not Just Judgment:**
      *   **Shift the Language:** Instead of "You're a disgrace!" try:
          *   *"David, stop. Look at yourself. I *know* this look. I *wore* this look. You are one step away from wrapping your car around a tree, or worse, killing someone else."* (Personalizes it, connects to shared history/fear).
          *   *"Don't you dare get in that car. You think you're fine? I thought I was fine too, right up until I totaled my Civic and woke up in handcuffs. You will not make that mistake tonight."* (Uses her past as a warning, not just a cudgel).
          *   *"Put the keys down, David. Now. I’ve been that drunk idiot thinking they could drive. I’ve been the one who didn't get stopped. Don't make me watch you become tomorrow's headline."* (Focuses on preventing harm, grounded in her lived experience).
      *   **Show the Concern Beneath the Edge:** Maybe her voice cracks when she mentions him getting killed. Maybe she physically steps between him and the car door, her hand trembling as she reaches for his keys, not just yelling. The action shows the *purpose* behind the harsh words.

  3.  **Include a Moment of Self-Recognition (Crucial):**
      *   **Mid-Confrontation:** As the words "disgrace" or "pathetic" leave her lips, have her *internally* wince. *"The word hung in the air, ugly and familiar. My mother spat that one at me, years ago. Now it was my turn."*
      *   **A Harsh Truth:** Maybe she *does* lash out with pure venom initially ("You pathetic drunk!"), but then *catches herself*, takes a shaky breath, and shifts to the more grounded warning ("...and if you get in that car, you'll end up dead or in jail. Give me the keys."). This shows her flaw *and* her attempt to rise above it *in the moment*.
      *   **Post-Confrontation Fallout:** After he's stopped (maybe he crumples, maybe he rages back, maybe someone else intervenes), show Ruth's reaction. Not triumph, but shaking, maybe tears of fury mixed with shame? *"The adrenaline crashed, leaving me hollow. I sounded just like him. Just like me, before."* Or *"I saved his life tonight. So why did I feel like I'd just taken another piece of his soul? And mine?"*

  4.  **Highlight the Specific History Between THEM:**
      *   **Weaponize a Shared Memory (Carefully):** "Remember Christmas '17? When *I* insisted I could drive us home from the party? We hit that mailbox, David. We were *lucky*. That could be you tonight, alone, hitting something far worse." (This is risky but powerful – it shows deep history and a specific shared trauma related to drunk driving).
      *   **Acknowledge Her Role:** "I know I'm the last person you want to hear this from. I put you through hell when I was drinking. But *because* of that, I know exactly where this road ends. Don't take it tonight."

  5.  **Keep the Edge, But Sharpen Its Source:** Her "edge" shouldn't be cruelty for cruelty's sake. Sharpen it into:
      *   **Frustration:** At his denial, at the situation, at the past repeating.
      *   **Fear:** Raw, visceral terror for his safety and others'.
      *   **Guilt:** Propelling her to act because she *knows* this darkness.
      *   **Protectiveness:** Even if their relationship is broken, she doesn't want *this* for him.

  **The Goal:** The reader should feel the profound tension of Ruth being the *absolutely necessary* person to intervene *because* of her history, while simultaneously wincing at *how* her trauma and unresolved feelings fuel her approach. They should understand *why* she goes hard, feel the urgency of stopping him, yet also see the ghosts of her past actions haunting her present intervention. It shouldn't feel "off"; it should feel agonizingly complex and painfully real.

  **Ask yourself as you rewrite:**

  *   **What specific memory does seeing him drunk trigger in Ruth?** Show it.
  *   **What percentage of her reaction is *genuine fear for his life* vs. *unresolved anger/guilt/shame*?** Let both be present and visible.
  *   **Does she *hear* her own cruel past echoing in her words?** Give her that moment of uncomfortable recognition.
  *   **What physical sensations does this encounter evoke?** Show her body reacting to the trauma.
  *   **What is his immediate reaction to *her* specifically confronting him?** Does it trigger his own resentment? Shame? Defiance? This will fuel the scene.

  By making Ruth's internal storm visible – the collision of her hard-earned sobriety wisdom, her traumatic past, her justified fear, and her flawed humanity – you transform the scene from feeling "off" to being a powerful, resonant moment that deepens her character and the novel's themes. Good luck – it's a tough scene, but it has incredible potential!
