  First, I need to figure out why the editor thinks the scene doesn't work. The problem isn't the confrontation itself but Ruth delivering it with judgment and heat. Given her history with alcoholism, her being the one to condemn him so harshly might come off as hypocritical or lacking self-awareness. That could create a disconnect for readers.

  Ruth's past includes being cruel while drinking and going through rehab. She's sober now, but her flaws are part of her character. The key is to balance her genuine concern with her personal baggage. The editor might feel that her approach undermines her credibility because she hasn't fully confronted her own past actions.

