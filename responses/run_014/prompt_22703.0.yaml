  Possible solutions: Have Ruth's internal monologue reveal her awareness of the hypocrisy. Or include physical reactions showing her discomfort. Maybe she slips into old patterns of lashing out, then realizes it. The confrontation could trigger memories of her own behavior, making her pause or adjust her tone.

