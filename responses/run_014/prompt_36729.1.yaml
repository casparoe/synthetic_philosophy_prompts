answer: |-
  Here is a decision tree designed to map disagreements about animal consciousness onto concrete commitments, starting from common ground. Test cases in **bold** guide branching. *Flags* note ambiguities.

  ```
  START: Dog is conscious; rock is not.

  Q1: Can consciousness exist in DEGREES (e.g., a dog more than a bee) or is it ALL-OR-NOTHING?
  │
  ├─ DEGREES (Yes, consciousness can be graded)
  │   │
  │   Q2: Does consciousness require SPECIFIC NEURAL SUBSTRATE (e.g., vertebrate cortex or cephalopod vertical lobe)?
  │   │
  │   ├─ SPECIFIC SUBSTRATE REQUIRED (Yes)
  │   │   │
  │   │   Q3: Can a creature SUFFER without METACOGNITION (knowing it suffers)? Test: **Fish pain** vs. **Lobster nociception**.
  │   │   │
  │   │   ├─ YES (Suffering possible without metacognition)
  │   │   │   → **Neurobiological Substrate View (e.g., Feinberg & Mallatt)**: Consciousness (likely sentience/suffering) emerges in specific neural architectures (e.g., vertebrates, cephalopods).  
  │   │   │   *Awkward:* May deny suffering to animals with different but complex brains (e.g., **bees** showing play).
  │   │   │
  │   │   └─ NO (Metacognition essential for suffering)
  │   │       → **Higher-Order Thought (HOT) Lite (e.g., Carruthers-inspired)**: Only creatures capable of self-referential mental states (HOTs) are conscious. Suffering requires awareness *of* pain.  
  │   │       *Awkward:* **Fish/Lobsters** likely don't suffer, conflicting with welfare concerns.
  │   │
  │   └─ SUBSTRATE NOT REQUIRED / MULTIPLY REALIZABLE (No)
  │       │
  │       Q4: Does ANY integrated system (e.g., **running insect-brain simulation**, **thermostat**) have *some* degree of consciousness?  
  │       │
  │       ├─ YES
  │       │   → **Panpsychism/IIT (e.g., Tononi/Chalmers-compatible)**: Consciousness is fundamental and scales with integrated information (Φ).  
  │       │   *Awkward:* **Thermostats** have infinitesimal but non-zero experience (micro-consciousness).
  │       │
  │       └─ NO
  │           → **Complexity-Graded Emergentism**: Consciousness emerges in degrees from complex, adaptive processing, not substrate or simulation.  
  │           *Awkward:* Hard to define threshold; **nematodes** (~300 neurons) likely below it, **bees** likely above. *Flag:* Near-indistinguishable from conservative Substrate View for **crustaceans**.
  │
  └─ ALL-OR-NOTHING (No, conscious or not)
      │
      Q5: Does consciousness require REPORTABILITY / GLOBAL ACCESS (i.e., information "broadcast" for flexible use)?
      │
      ├─ YES (Reportability essential)
      │   │
      │   Q6: Is it MULTIPLY REALIZABLE (e.g., possible in AI)?
      │   │
      │   ├─ YES
      │   │   → **Global Workspace Theory (GWT) (e.g., Baars/Dehaene)**: Consciousness = global availability of information in a "workspace".  
      │   │   *Awkward:* **Bees** navigating complex landscapes may lack a vertebrate-like workspace despite rich behavior.
      │   │
      │   └─ NO (Requires biological neural substrate)
      │       → **Biological GWT**: Global workspace requires specific neural biology (e.g., thalamocortical loops).  
      │       *Awkward:* **Octopuses** (no cortex) might be excluded despite complex cognition.
      │
      └─ NO (Reportability not essential)
          │
          Q7: Is consciousness DEFINED BY BEHAVIORAL CAPACITIES alone, with no "hard problem"?
          │
          ├─ YES
          │   → **Deflationary/Behaviorist (e.g., Dennett-inspired)**: "Consciousness" is just a label for sophisticated behavioral flexibility; no fact of the matter about inner states.  
          │   *Awkward:* **Lobster nociception/avoidance** is just complex reflex; "suffering" is a misleading metaphor.
          │
          └─ NO (There is a "hard problem" beyond behavior)
              → *UNEXPLORED/INCOHERENT PATH?* All-or-nothing consciousness without reportability *and* not behaviorist implies a mysterious intrinsic property decoupled from function. No major view occupies this. Likely **incoherent** or **unattractive**.
  ```

  ### Flags & Notes
  1.  **Substrate View vs. Complexity-Graded Emergentism (Crustaceans):** Distinction blurs. Both likely grant some consciousness to crabs/octopuses based on neural complexity/analogy, differing mainly on whether simulations could be conscious.
  2.  **Deflationary View & Thermostats:** Deflationists might answer Q7 "YES" without reaching Q4/Q6 – the thermostat is just a switch, no behavior to warrant the label.
  3.  **Buddhist Split:** Likely splits at Q1 (Buddhist: Degrees) and then Q4 (Buddhist: Possibly YES for panpsychist leanings vs. Zoologist: Likely NO or Substrate path).
  4.  **Nematode C. elegans:** Key test for low-complexity thresholds. Panpsychism/IIT grants micro-consciousness; Substrate/Complexity views usually deny it; Deflationism sees just chemotaxis.
  5.  **Suffering without Metacognition (Q3):** The core split between views that tie suffering to raw nociceptive processing (Substrate) vs. requiring higher-order awareness (HOT).
