  | **Tharoor 4**: Violence of conquest and rule.                        | Acquisition costs (including violence) not capitalized or expensed; off-balance-sheet liabilities (social unrest) not recognized.                            | Distorted    | Costs of violence and social disruption are not quantifiable and remain off-balance-sheet.                  |

  Now, the JSON summary:

