  We are going to restate the arguments of Ferguson and Tharoor in audit and accounting vocabulary. We'll create a table with four claims from each side. The columns are: claim, accounting rendering, fidelity (clean, distorted, no expression), and residue note.

  First, we need to define the reporting entity: the British Raj from the East India Company period to the Crown period until 1947. The breakup in 1947 is the de facto period-end. We must consider whether to use going concern or liquidation basis for the final stretch.

  Ferguson's main arguments (net positive):
  1. Spread markets: The empire opened India to global markets, increasing trade.
  2. Rule of law: Introduced a legal system that was more consistent and impartial.
  3. Infrastructure: Built railways, telegraph, etc., which modernized India.
  4. Counterfactual: Without the Raj, India would have had more war, less trade, and less modernization.

  Tharoor's main arguments (net negative):
  1. Famines: Millions died in famines while grain was exported.
  2. Deindustrialization: The textile sector was destroyed, turning India from an exporter to an importer.
  3. Drain of wealth: Systematic transfer of wealth from India to Britain.
  4. Violence of conquest: The brutality of the colonial takeover and rule.

  We'll translate each into accounting concepts:

  Accounting concepts to use:
  - Impairment: When the carrying amount of an asset exceeds its recoverable amount (value in use or fair value less costs to sell).
  - Off-balance-sheet items: Obligations or assets not recorded on the balance sheet but which can have a material impact.
  - Related-party transactions: Transactions between the reporting entity and related parties (e.g., the Crown and the British public) which may not be at arm's length.
  - Going concern vs. liquidation: At 1947, the Raj was breaking up, so liquidation basis might be appropriate for the final assessment.
  - Performance attribution (Brinson): Breaking down performance into allocation (policy) vs. selection (active choices) vs. interaction. Here, we can try to attribute outcomes to imperial policy vs. secular trends (like the Industrial Revolution).

  Counterfactual baseline: Accounting does not have a direct concept for a counterfactual. The nearest might be a "budget" or "forecast," but these are based on management's expectations, not an alternate reality.

  Let's build the table:

  Ferguson Claims:

  Claim 1 (Markets): The British Empire opened India to global markets, increasing trade and economic activity.
  Accounting rendering: The entity expanded the market access for the subsidiary (India), resulting in increased revenue from trading activities and a larger economic base. This can be seen as an enhancement of the subsidiary's revenue-generating units (RGUs).
  Fidelity: Clean? But note: the expansion was forced, so it might be a related-party transaction. Let's see.

  Claim 2 (Rule of law): Introduced a consistent legal system, which reduced corruption and provided stability.
  Accounting rendering: Implementation of a robust internal control system and governance framework, which reduced operational risk and provided a stable environment for economic activities, thereby increasing the going concern value of the subsidiary.
  Fidelity: Clean.

  Claim 3 (Infrastructure): Built railways, telegraph, ports, etc., which modernized India.
  Accounting rendering: Capital expenditure on infrastructure assets that enhanced the productive capacity and long-term service potential of the subsidiary, leading to an increase in the value in use of the subsidiary's asset base.
  Fidelity: Clean.

  Claim 4 (Counterfactual): Without the Raj, India would have been worse off (more war, less trade, less modernization).
  Accounting rendering: The assessment of the subsidiary's performance and net asset position must consider the absence of a reliable forecast (counterfactual scenario) for an alternate history. The current carrying value of the subsidiary's net assets is compared to an unobservable recoverable amount under a hypothetical non-colonial scenario, leading to an impairment assessment that is inherently unverifiable.
  Fidelity: Distorted (because counterfactual is not an accounting concept) OR no expression? Actually, we can express the idea of a hypothetical scenario in impairment testing, but it's not verifiable. So we'll say distorted.

  Tharoor Claims:

  Claim 1 (Famines): Famines killed millions while grain was still being exported.
  Accounting rendering: During periods of severe operational disruption (famines), the entity continued to transfer inventory (grain) to related parties (the metropole) at non-arm's length terms, resulting in a depletion of the subsidiary's assets and an impairment of its human capital (workforce) which was not recognized in the financial statements. This represents a related-party transaction that was detrimental to the subsidiary and should have been recognized as an expense (loss of life and productivity).
  Fidelity: Clean? But the human capital is not on the balance sheet. So distorted.

  Claim 2 (Deindustrialization): Destroyed India's textile sector, turning an exporter into an importer.
  Accounting rendering: The entity's policies led to the impairment of the subsidiary's manufacturing assets (textile sector) due to strategic decisions that favored the parent's industries, resulting in a significant write-down of asset values and a restructuring of the subsidiary's operations from manufacturing to raw material supply. This is a related-party transaction that transferred economic benefits to the parent.
  Fidelity: Clean? The deindustrialization is an impairment, but the cause (policy) is a related-party issue.

  Claim 3 (Drain of wealth): Systematic transfer of wealth from India to Britain.
  Accounting rendering: Recurring related-party transactions (e.g., remittances, tributes, and unequal trade terms) that resulted in a net outflow of economic benefits from the subsidiary to the parent, not adequately compensated by inflows, leading to a material reduction in the subsidiary's equity. These transactions were not conducted at arm's length and should have been disclosed as such. The cumulative effect is a misstatement of the subsidiary's financial position.
  Fidelity: Clean.

  Claim 4 (Violence of conquest): The brutality of the colonial takeover and rule.
  Accounting rendering: The initial recognition of the subsidiary's assets and liabilities did not account for the costs of acquisition, which included extensive human and social capital destruction. These costs, which should have been capitalized as part of the acquisition cost or expensed as incurred, were omitted from the financial statements, leading to an overstatement of the net assets at acquisition and subsequent periods. Additionally, the entity incurred significant off-balance-sheet liabilities (reputational, social unrest) that were not recognized.
  Fidelity: Distorted? Because the costs of conquest (violence) are not typically quantified in financial statements, and human/social capital is not recognized.

  Now, the residue note for each:

  For Ferguson:
  Claim 1: Might be distorted because the expansion was forced and not necessarily at arm's length. Residue note: The voluntary nature of market access is not captured; the transaction is with related parties and terms may not be fair.
  Claim 2: Clean. Residue note: None.
  Claim 3: Clean. Residue note: None.
  Claim 4: Distorted. Residue note: Counterfactual baseline is not an accounting concept; it is speculative and unverifiable.

  For Tharoor:
  Claim 1: Distorted. Residue note: Human capital impairment is not recognized in financial statements; only tangible assets are typically considered.
  Claim 2: Clean. Residue note: None.
  Claim 3: Clean. Residue note: None.
  Claim 4: Distorted. Residue note: Costs of violence and social disruption are not quantifiable in accounting terms and remain off-balance-sheet.

