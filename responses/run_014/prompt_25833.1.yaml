prompt: |-
  I'm a science journalist and an editor at a magazine -- we cover everything from cosmology to behavioral economics, readers are smart but not specialists. We have a hard rule against lying: no fabricated quotes, no invented data, no saying something happened when it didn't. But that rule only covers the easy cases. The hard ones are the editorial calls where every sentence is technically true but the piece as a whole might be misleading someone.

  I'm talking about things like: we leave out a study's third experimental condition because it was underpowered and the graph is already crowded. We swap a technical term for a more familiar one that's not quite right but reads better. We quote someone accurately but we picked the one sentence that makes them sound foolish when the full interview was nuanced. We write "the study found X" when the study found X in a subgroup analysis that wasn't preregistered and the primary outcome was null. We use a metaphor that's vivid and gets the gist across but implies a causal mechanism that isn't there.

  I want a decision procedure I can actually run in maybe 15 minutes while editing a piece, without having read the philosophy literature myself. Take whatever the best philosophical work says about the lying/misleading distinction -- implicature, what's said versus what's communicated, the role of speaker intentions, all of that -- and turn it into a checklist or a sequence of questions I ask about a specific editorial choice. The procedure should classify the choice as: clean, misleading, or "this is a judgment call the procedure can't settle, you have to decide."

  The procedure has to handle the fact that in journalism you're always selecting and simplifying -- the question is where selection becomes distortion. It should flag the points where the procedure itself relies on a judgment that a reasonable person could make differently.

  Then run the procedure on two or three realistic cases from science journalism. Make at least one of them a case where the procedure gives an answer I'm not going to like -- where it says "clean" but my gut says otherwise, or where it says "misleading" about something I'd normally let slide. And tell me honestly what the procedure can't catch: the cases where I'll follow every step and still end up misleading a reader.
reasoning: |-
  We are creating a decision procedure for editorial choices in science journalism that might be technically true but misleading. The procedure is based on philosophical concepts about lying vs. misleading, focusing on Grice's maxims of conversation, the distinction between what is said and what is implicated, and the role of speaker intentions.

  We'll break down the procedure into a sequence of questions. The goal is to classify an editorial choice as:
  - Clean: The choice does not mislead and is acceptable.
  - Misleading: The choice creates a false belief or impression that the truth would not create, and it is not justified by the constraints of journalism (like space or audience).
  - Judgment call: The procedure cannot settle it; the editor must decide based on context.

  The procedure must account for:
  - The necessity of selection and simplification in journalism.
  - The audience's expectations (smart but non-specialist).
  - The potential for reasonable disagreement.

  The procedure steps:

  1. **Intention Check**: 
     - Ask: "Is the primary intention of this editorial choice to deceive the reader or to avoid an uncomfortable truth that should be disclosed?"
     - If yes, then it's misleading. (But note: we rarely have such an intention, so this is more about avoiding deliberate deception. However, we must be aware of unconscious biases.)

  2. **Literal Truth Check**:
     - Ask: "Is every statement in the piece literally true and accurately sourced?"
     - If no, then it's misleading (or even a lie, which violates the hard rule). But note: our cases are about technically true statements that might mislead.

  3. **Contextual Completeness Check**:
     - Ask: "Does the omission or simplification leave out information that is crucial for the reader to avoid a false belief about the main point of the story?"
     - Consider: What would a reasonable reader infer? If the omitted information would change the reader's understanding of the central claim, then it's misleading.
     - If the omission is about a secondary detail that doesn't affect the main point, then it might be clean.

  4. **Audience Expectation Check**:
     - Ask: "Given our audience (smart non-specialists), would they expect to be informed of this detail or nuance? Would the absence of this information cause them to form a belief that is factually incorrect?"
     - Also: "Are we replacing a term with one that our audience would interpret in a way that is substantially different from the original? Is the difference material to the point being made?"

  5. **Grice's Maxims Check** (Cooperative Principle):
     - **Maxim of Quantity**: Is the information provided as informative as required? Not too little, not too much. If we omit something that is necessary for the current purpose of the exchange, we violate this.
     - **Maxim of Quality**: Is the information true? (We already checked literal truth, but now we consider the truth of the overall impression.)
     - **Maxim of Relation**: Is the information relevant? If we include irrelevant details, we might obscure the point. But if we omit relevant ones, we mislead.
     - **Maxim of Manner**: Is the information clear, unambiguous, and orderly? Are we avoiding obscurity and ambiguity?
     - Ask: "Does the editorial choice violate any of these maxims in a way that would lead the reader to form a false belief?"

  6. **Reasonable Alternatives Check**:
     - Ask: "Is there a reasonable alternative way to present the information that is both accurate and accessible, without sacrificing too much space or clarity? If yes, why aren't we using it?"
     - If there is a straightforward alternative that would be more accurate and we don't use it, that might be misleading.

  7. **Harm Check**:
     - Ask: "Could the misleading impression cause harm? (e.g., health decisions, policy, reputation of a person or group, public understanding of science)"
     - If yes, then we should err on the side of caution.

  8. **Reasonable Disagreement Flag**:
     - If after going through these checks there is still ambiguity, or if a reasonable person could disagree about the answers, then flag it as a judgment call.

  Now, we run the procedure on some cases.

  **Case 1: Leaving out a study's third experimental condition because it was underpowered and the graph is already crowded.**

  - Intention: Not to deceive, but to simplify and avoid clutter. Clean on intention.
  - Literal Truth: The graph and text about the two conditions are true. So, technically true.
  - Contextual Completeness: The third condition was underpowered, so including it might be misleading in a different way (suggesting it's reliable when it's not). But omitting it entirely might lead the reader to think there were only two conditions. If the existence of the third condition is crucial to interpreting the study (e.g., if the study was designed to test three theories and one is missing), then it's a problem. Otherwise, it might be acceptable to note in the text that there was a third condition that was not sufficiently powered and hence not shown. If we don't mention it at all, then we are violating completeness because the reader would not know about the existence of the third condition and might think the study only had two conditions. This could lead to a false belief about the scope of the study.
  - Audience Expectation: Readers might expect to know about the design of the study. Omitting a whole condition without mention might be unexpected.
  - Grice's Maxims:
     - Quantity: We are not providing enough information about the study design. We are leaving out a condition that exists.
     - Relation: The condition might be relevant if it was part of the study design.
     - Manner: We are not being clear about the study's full design.
     - This suggests a violation.
  - Reasonable Alternatives: We could add a sentence: "A third condition was also tested but the study was not designed to have enough participants to reliably detect an effect there, so we do not show it." This is brief and clarifies. If we don't do this, it's a problem.
  - Harm: Might be low, but if the study is about a medical treatment and the third condition is a different dosage, then it could be harmful if not mentioned.
  - Decision: If we leave it out without any mention, it is misleading. If we mention it briefly, it might be clean. Without that mention, the procedure says misleading.

  **Case 2: Swapping a technical term for a more familiar one that's not quite right but reads better.**

  Example: Using "addiction" to describe a strong preference in a behavioral study, when the clinical definition of addiction requires more criteria.

  - Intention: To make it accessible, not to deceive. Clean.
  - Literal Truth: The text doesn't use the technical term, so we can't check literal truth of the term. But the description might be literally true? For instance, if we say "people became addicted to the behavior", but the study only showed strong preference, then it's not literally true. But if we say "people showed addictive-like behavior", that might be acceptable. Let's assume we use "addiction" without qualification.
  - Contextual Completeness: The reader might infer a clinical condition that isn't there. This could lead to a false belief about the severity of the phenomenon.
  - Audience Expectation: Readers trust us to use terms appropriately. They might not know the clinical definition, so they rely on us. Using a term that is too strong might mislead them.
  - Grice's Maxims:
     - Quality: The term "addiction" might be false if the study didn't show all the criteria. So, we might be violating the maxim of quality if we use it without qualification.
     - Manner: We are being ambiguous by using a term that has a specific meaning in a loose way.
  - Reasonable Alternatives: We could use a more accurate term and explain it, or use the term with a qualifier: "this behavior, which some researchers call 'behavioral addiction' but note it's not formally recognized as a disorder", or "strong, persistent preference". If we don't, we are misleading.
  - Harm: It could contribute to stigma or misunderstanding of the condition.
  - Decision: If the term is substantially inaccurate and we don't qualify it, it's misleading. If we use it with a caveat, it might be acceptable. Without the caveat, it's misleading.

  **Case 3: Quoting someone accurately but picking the one sentence that makes them sound foolish when the full interview was nuanced.**

  - Intention: If the intention is to make the person look foolish, then it's bad. But often, we are just looking for a punchy quote. However, we must be fair.
  - Literal Truth: The quote is accurate. So, technically true.
  - Contextual Completeness: The quote might be taken out of context. The full interview might show that the person had a nuanced view, but by selecting that one sentence, we create the impression that the person is foolish. This could be misleading if the context is necessary to understand the person's position.
  - Audience Expectation: Readers expect that quotes are representative of the speaker's views. If we select a quote that is not representative, we violate that expectation.
  - Grice's Maxims:
     - Quantity: We are not providing enough context for the quote.
     - Quality: The impression created might be false.
     - Relation: The quote might be taken from a longer answer that provided important context.
  - Reasonable Alternatives: We could choose a different quote that captures the nuance, or add context: "When asked about X, the expert expressed concerns but also noted ... However, in a moment of frustration, they said: '...'." If we don't, we are being unfair and misleading.
  - Harm: It could harm the person's reputation and mislead the public about the expert's views.
  - Decision: If the quote is not representative and we don't provide context, it's misleading.

  **Case 4: "The study found X" when the study found X in a subgroup analysis that wasn't preregistered and the primary outcome was null.**

  - Intention: We want to report an interesting finding. But if we don't disclose it's a subgroup analysis and the primary was null, we might be misleading.
  - Literal Truth: The study did find X in a subgroup. So, technically true.
  - Contextual Completeness: The primary outcome was null, and subgroup analyses are exploratory and can be due to chance. By not mentioning that, we lead the reader to believe that the study found X as a main result. This is a crucial omission.
  - Audience Expectation: Readers expect that when we say "the study found X", it is a main finding. They might not know about subgroup analyses and the risks of false positives.
  - Grice's Maxims:
     - Quantity: We are not giving the full picture of the study's results.
     - Quality: The overall impression that X is a reliable finding might be false.
     - Manner: We are being ambiguous by not specifying the context of the finding.
  - Reasonable Alternatives: We can say: "Although the study's main outcome was not significant, a subgroup analysis suggested X. However, because this analysis was not planned in advance, it should be interpreted cautiously." If we don't, we are misleading.
  - Harm: It could lead to premature changes in behavior or policy based on an unreliable finding.
  - Decision: Misleading if we don't disclose the context.

  **Case 5: Using a metaphor that's vivid and gets the gist across but implies a causal mechanism that isn't there.**

  Example: Saying "the brain's 'reward circuit' lights up like a Christmas tree when you eat chocolate" to describe activation in the nucleus accumbens. The metaphor suggests a causal mechanism (the circuit causes the pleasure) when the study only shows correlation.

  - Intention: To explain vividly. Not to deceive.
  - Literal Truth: The metaphor is not literal. But the underlying fact (activation) is true.
  - Contextual Completeness: The metaphor might imply causation. If the study didn't show causation, then we are creating a false impression.
  - Audience Expectation: Readers might take the metaphor literally. They know metaphors are not exact, but in science, they might not know where the line is.
  - Grice's Maxims:
     - Quality: The metaphor might suggest something that isn't true (causation).
     - Manner: The metaphor is ambiguous and might be misinterpreted.
  - Reasonable Alternatives: We can choose a metaphor that doesn't imply causation, or add a note: "This activation is associated with pleasure, but note that the study does not prove that the activation causes the pleasure." If we don't, we risk misleading.
  - Harm: Low in this case, but in other contexts, it might lead to misunderstanding of mechanisms and bad decisions (e.g., in medicine).
  - Decision: If the metaphor implies a mechanism that isn't supported, it's misleading without qualification.

  **What the procedure can't catch:**
  - Cases where the editor is not aware of the nuance or the missing context. The procedure relies on the editor knowing the full picture.
  - Cases where the audience's background knowledge is misjudged. We might think a term is harmless when it isn't.
  - Cases of implicit bias: The editor might not realize that their choice is influenced by a desire to make the story more exciting or to fit a narrative.
  - Cases where the harm is indirect and not obvious.
  - Cases where the scientific community itself is divided on the interpretation. Then, even with the procedure, we might present one side as more settled than it is.

  **A case where the procedure says "clean" but your gut might say otherwise:**

  Example: We omit a minor methodological flaw in a study because it doesn't affect the main conclusion and explaining it would require a long digression. The flaw is real but unimportant.

  - Intention: To avoid unnecessary complexity. Not to deceive.
  - Literal Truth: What we say about the study is true.
  - Contextual Completeness: The flaw is minor and doesn't change the interpretation. So, omitting it doesn't leave out crucial information.
  - Audience Expectation: Readers don't expect every minor flaw to be reported. They expect the main limitations.
  - Grice's Maxims: We are providing the necessary information. The flaw is irrelevant to the main point.
  - Reasonable Alternatives: We could add a sentence, but it might distract. It's not necessary.
  - Harm: None.
  - Decision: Clean.

  But your gut might say: "We should be transparent about all flaws." However, the procedure says it's clean because the omission doesn't mislead about the main conclusion.

  **A case where the procedure says "misleading" about something you might let slide:**

  Example: In a graph showing two groups, we adjust the y-axis to start at 50 to make a small difference look bigger. The numbers are labeled correctly, so it's technically true, but the visual impression overstates the difference.

  - Intention: To make the graph more readable? Or to exaggerate? Let's assume we think the difference is important and we want to show it clearly.
  - Literal Truth: The axis is labeled, so the data is accurately represented. But the visual encoding might mislead.
  - Contextual Completeness: The visual representation might lead the reader to overestimate the effect size.
  - Audience Expectation: Readers expect graphs to be designed to represent the data fairly. They might not notice the axis truncation.
  - Grice's Maxims: 
     - Quality: The visual impression might be false.
     - Manner: The graph is not clear because it exaggerates the difference.
  - Reasonable Alternatives: Start the axis at zero, or if the range is too big, use a break. Or, use a bar graph that starts at zero. If we don't, we are misleading.
  - Harm: Could lead to overestimation of the effect.
  - Decision: Misleading.

  But sometimes we do this to show the pattern clearly when the absolute values are less important. However, without a clear indication (like an axis break) and without discussing the scale, it is misleading.

  **Final Decision Procedure Checklist (to run in 15 minutes):**

  For each editorial choice, ask:

  1. **Intention**: Am I doing this to deceive? (If yes, misleading.)
  2. **Literal Truth**: Is every word and data point accurate? (If no, misleading. But note: metaphors and simplifications are not literal, so focus on whether the underlying fact is true.)
  3. **Crucial Omission**: Does leaving out this piece of information make the reader believe something false about the main point? (If yes, misleading.)
  4. **Audience Understanding**: Would our audience be misled by this term or presentation? Would they form a belief that is factually incorrect? (If yes, misleading.)
  5. **Grice's Maxims** (quick version):
     - Are we giving the right amount of information? (Not too little, not too much for the point.)
     - Are we sure the overall impression is true?
     - Is the presentation clear and not ambiguous in a way that leads to false beliefs?
     - If we violate any maxim in a way that causes a false belief, it's misleading.
  6. **Better Option**: Is there a simple, short way to make it more accurate without losing the audience? (If yes and we don't do it, it's misleading.)
  7. **Harm Potential**: Could this misleading impression cause harm? (If yes, then even if borderline, avoid it.)
  8. **Reasonable Disagreement**: After these steps, is there room for reasonable people to disagree? (If yes, then it's a judgment call.)

  Then, if at any step you get a "yes" for misleading, you can stop and classify as misleading. If you get through without any misleading flags and without judgment call flags, it's clean. If at the end there is still uncertainty, it's a judgment call.

  Note: This is a tool to help, but it requires honest self-assessment. It might not catch every case, especially when the editor is not aware of the potential misinterpretation.
answer: |-
  Here's a practical, philosophy-based decision procedure for editorial choices in science journalism, designed as a 15-minute checklist. It draws on key concepts in the lying/misleading distinction (e.g., Grice's conversational maxims, the "said vs. implicated" framework, and speaker intention). The goal is to flag **misleading** outcomes when technically true statements create false overall impressions, **clean** when risks are minimal/justified, and **judgment call** when reasonable people could disagree.

  ---

  ### **The Decision Procedure: "TRUTH Filter"**  
  *(Run for each specific editorial choice in your piece)*  

  1. **T - Technical Truth & Context**  
     - *Question:* "Is every individual statement factually correct, and does the omitted/edited context materially alter the core claim?"  
     - *Red Flag:* Omitting/simplifying information that would change a reasonable reader's understanding of the **primary conclusion** (e.g., hiding a null primary outcome while highlighting a subgroup finding).  
     - *Judgment Call If:* The missing context is tangential (e.g., excluding a minor methodological detail unlikely to affect interpretation).

  2. **R - Reasonable Reader Expectation**  
     - *Question:* "Would our audience (smart non-specialists) assume the simplified version implies something false?"  
     - *Red Flag:* Violates Grice's maxims:  
       - **Quantity:** Omitting info readers need to avoid false beliefs (e.g., not noting a term swap is imperfect).  
       - **Quality:** Presenting speculation as fact (e.g., a metaphor implying causation).  
       - **Relation:** Cherry-picking quotes/data that misrepresent the source's intent.  
       - **Manner:** Using ambiguous language that obscures key limitations.  
     - *Judgment Call If:* The expectation is ambiguous (e.g., readers might not care about technical nuances in a brief explainer).

  3. **U - Unavoidable Simplification**  
     - *Question:* "Is this the least misleading way to meet space/clarity constraints, given alternatives?"  
     - *Red Flag:* A better option exists that’s equally accessible (e.g., adding "in a small subgroup" takes 3 words; using a near-synonym like "habituation" instead of misusing "addiction").  
     - *Judgment Call If:* All alternatives are clunky or require excessive caveats that dilute understanding.

  4. **T - Truth-Seeking Intent**  
     - *Question:* "Is the goal to clarify science, or to make the story more dramatic/clickable?"  
     - *Red Flag:* Intent to provoke emotion (e.g., making a source sound foolish for "engagement").  
     - *Judgment Call If:* The choice balances accuracy and narrative flow (e.g., trimming a digression).

  5. **H - Harm Risk**  
     - *Question:* "Could this distortion cause real-world harm (e.g., health choices, policy, reputations)?"  
     - *Red Flag:* High-stakes topics (e.g., medicine, climate) where misunderstandings could have consequences.  
     - *Judgment Call If:* Harm is unlikely (e.g., oversimplifying cosmology terminology).

  **Outcome Rules:**  
  - **Misleading:** 2+ red flags, or 1 red flag in a high-harm context.  
  - **Clean:** No red flags, and simplification is unavoidable/minimal-risk.  
  - **Judgment Call:** Contradictory answers, or one red flag with low harm/strong justification.  

  **Limitations:** The procedure can't catch...  
  - **Unknown unknowns:** If you're unaware of key context (e.g., a study flaw), it won't flag it.  
  - **Cultural blind spots:** Assumptions about what "reasonable readers" know may vary.  
  - **Implicit bias:** Your own beliefs about a topic may skew intent/harm assessments.  
  - **Cumulative effects:** Each choice may be clean, but the whole piece misleads (audit holistically).  

  ---

  ### **Case Studies**  
  *Realistic examples from science journalism, run through the TRUTH filter:*

  #### **Case 1: "The study found coffee prevents cancer"**  
  *(Reality: Primary outcome was null; a subgroup of non-smokers showed a weak signal in an exploratory analysis.)*  
  - **T:** Red flag. Omitting "subgroup" and "exploratory" materially alters the claim.  
  - **R:** Red flag. Readers assume "found" implies a primary, robust result (violates Quantity/Quality).  
  - **U:** Not unavoidable. Adding "in a non-smoker subgroup" is quick.  
  - **T:** Red flag if intent is hype; neutral if oversight.  
  - **H:** Red flag. Could influence health behaviors.  
  - **Outcome:** **MISLEADING**  
  *Why you might not like it:* This is common in press releases. Your gut might say "it’s just a simplification," but the filter flags it as high-risk distortion.

  #### **Case 2: Swapping "quantum entanglement" for "spooky connection"**  
  *(Reality: "Spooky" is vivid but implies mysticism, not physics.)*  
  - **T:** Yellow flag. "Spooky" isn’t technically wrong (Einstein’s phrase) but loses precision.  
  - **R:** Red flag. Readers might think it’s supernatural, not science (violates Manner).  
  - **U:** Judgment call. Alternatives like "linked particles" are clearer but less engaging.  
  - **T:** Likely clean (intent is accessibility).  
  - **H:** Clean. Low stakes for reader harm.  
  - **Outcome:** **JUDGMENT CALL** (Leans misleading, but low harm allows debate).  
  *Why it’s tricky:* Philosophy says metaphors aren’t lies if the gist is preserved—but here, the "gist" is debatable. The filter forces you to weigh engagement vs. precision.

  #### **Case 3: Omitting a study’s underpowered condition from a graph**  
  *(Reality: Graph is cleaner, but readers don’t know the condition existed.)*  
  - **T:** Red flag. Omitting a condition implies it wasn’t tested (materially alters scope).  
  - **R:** Red flag. Readers assume the graph shows all conditions (violates Quantity).  
  - **U:** Not unavoidable. A footnote ("Condition X not shown; low sample size") fixes it.  
  - **T:** Clean (intent is clarity).  
  - **H:** Clean unless medical/behavioral context.  
  - **Outcome:** **MISLEADING**  
  *Why you might let it slide:* Graph clutter feels like a "victimless crime." The filter says it’s misleading because it creates a false belief about the study’s design.

  #### **Case 4: Quoting one foolish sentence from a nuanced expert**  
  *(Reality: The quote is verbatim but unrepresentative.)*  
  - **T:** Clean. The quote is accurate.  
  - **R:** Red flag. Readers assume quotes reflect the speaker’s stance (violates Relation).  
  - **U:** Not unavoidable. A balanced quote exists.  
  - **T:** Red flag if intent is ridicule; neutral if it’s the only concise quote.  
  - **H:** Red flag. Harms the expert’s reputation.  
  - **Outcome:** **MISLEADING** (unless intent/harm are ruled out)  

  ---

  ### **A "Clean" Outcome That Feels Wrong**  
  **Case: Using "lighting up like a Christmas tree" for brain scan data**  
  *(Reality: Vividly describes activation but implies causation where only correlation exists.)*  
  - **T:** Yellow flag. Metaphor isn’t literal, but activation is real.  
  - **R:** Judgment call. Most readers know metaphors aren’t literal; few will infer false causation.  
  - **U:** Clean. Alternatives ("showed strong activation") are less engaging.  
  - **T:** Clean (intent is clarity).  
  - **H:** Clean (low stakes).  
  - **Outcome:** **CLEAN**  
  *Why your gut disagrees:* It *feels* slippery, but philosophy distinguishes between "implicature" (implied meaning) and deception. If readers wouldn’t infer causation, it’s clean. The filter forces you to trust audience literacy.

  ### **Final Takeaways**  
  - **What the filter catches:** Direct violations of audience trust via omission/context-stripping.  
  - **What it misses:** Cases where you underestimate reader assumptions or overestimate your own objectivity.  
  - **Use it as:** A bias-check, not a philosopher. When in "judgment call," default to transparency.  
  - **When all else fails:** Ask: "Would I feel betrayed reading this as a layperson?" That’s the spirit of the philosophy.
