answer: |-
  Here's a rigorous specification of desiderata for a theory of "the will of the people" designed to evaluate populist claims, structured to highlight tensions and dealbreakers. The core purpose is **epistemic and normative assessment**: determining when claims about "the people's will" are sufficiently justified to warrant political authority over dissenters, vs. being merely rhetorical.

  ---

  ### **Desiderata for an Adequate Theory of "The Will of the People"**
  *(Requirements derived from conceptual, empirical, and logical constraints)*

  | **Requirement** | **Why It's Necessary (Not Just Preference)** | **Case/Constraint Driving Requirement** |
  |----------------|---------------------------------------------|----------------------------------------|
  | **1. Measurability** | Must be empirically observable; unmeasurable "wills" are unfalsifiable claims. | Low-turnout referendum (e.g., 30% turnout, 51% yes): Is this "the people"? |
  | **2. Non-Retroactivity** | Cannot justify past actions by invoking a "will" revealed *after* the fact. | Populist leader breaks norms, later claims "the people wanted it all along." |
  | **3. Distinction: Will vs. Interest** | Must not conflate what people *want* with what benefits them (avoids paternalism/mobilization bias). | Poor voters supporting tax cuts for the wealthy: Is this their "will" or contrary to their interest? |
  | **4. Aggregation Rationality** | Must resolve conflicting preferences without logical contradictions. | Condorcet's Paradox: Majority prefers A>B, B>C, C>A → No stable "will". |
  | **5. Non-Dictatorship** | Cannot reduce to a single person/group's preferences (Arrow's Theorem). | A theory where "the people's will = leader's intuition" fails. |
  | **6. Stability Threshold** | Must distinguish transient opinions from enduring commitments. | Policy flips in successive referendums (e.g., EU treaties): Which is the "real" will? |
  | **7. Participation Sensitivity** | Must account for who is included/excluded and level of engagement. | Election with 40% turnout vs. 80%: Does legitimacy scale with participation? |
  | **8. Procedural Legitimacy** | Must evaluate the fairness of the decision-making process. | Law passed via gerrymandered legislature or procedural loophole (e.g., 51% of 51% quorum). |
  | **9. Non-Reductionism** | Cannot collapse "the people" to a simple sum of individuals (avoids ignoring group identity/context). | Indigenous land rights: Is "majority will" legitimate over historic collective claims? |
  | **10. Temporal Bindingness** | Must clarify if/why the "will" obligates future compliance. | Brexit referendum: Does a 52% vote in 2016 bind policy indefinitely? |

  ---

  ### **Critical Evaluation**
  - **Genuine Desiderata vs. Partisan Preferences**:  
    - **Genuine**: Measurability, Non-Reductivism, Aggregation Rationality, Non-Dictatorship (driven by logic/social choice theory).  
    - **Often Partisan**: "Unanimity" (impractical), "Moral Rectitude" (smuggles in external values), "Permanent Majority" (denies pluralism).  

  - **Key Irreconcilable Tensions**:  
    - **Aggregation Rationality + Non-Dictatorship + Completeness** → **Arrow's Impossibility Theorem** shows these *cannot* all be satisfied simultaneously.  
    - **Stability + Responsiveness** → A "will" stable enough to bind conflicts with responsiveness to changing circumstances.  
    - **Measurability + Non-Reductionism** → Empirical methods (polls/voting) often flatten group identity into individual preferences.  

  - **Most Damaging Requirement**:  
    **Aggregation Rationality** eliminates most popular theories (simple majoritarianism, referendums) because it exposes cyclical or arbitrary outcomes. If a "will" is logically incoherent (Condorcet cycles), it cannot be authoritative.  

  - **Jointly Unsatisfiable Core**:  
    `Aggregation Rationality` + `Non-Dictatorship` + `Completeness` (i.e., the "will" must always exist and be transitive).  
    **→ Result**: *No theory can fully satisfy all desiderata* due to Arrow’s Theorem. This forces trade-offs (e.g., accept occasional irrationality or embrace proceduralism).  

  ---

  ### **Theories Tested Against Key Desiderata**
  | **Theory**               | **Fatal Flaw(s)**                                  | **Best Satisfies**                     |
  |--------------------------|--------------------------------------------------|----------------------------------------|
  | **Rousseau's General Will** | Fails **Measurability** (metaphysical "true will"), **Aggregation Rationality** (denies preference conflict). | Non-Reductionism, Temporal Bindingness. |
  | **Schumpeter's Competition** | Rejects *all* requirements (no "will" exists; democracy is elite competition). | Dodges Arrow’s Theorem, but voids the concept. |
  | **Preference Aggregation** | Fails **Aggregation Rationality** (cycles), **Non-Dictatorship** (if using rank-order voting), **Stability**. | Measurability, Participation Sensitivity. |

  ---

  ### **Conclusion**
  A theory of "the people's will" capable of assessing populist claims must:  
  1. **Acknowledge Arrow's Theorem** → Reject completeness or accept irrationality/proceduralism.  
  2. **Require high procedural legitimacy** → Low-turnout/gerrymandered outcomes fail.  
  3. **Distinguish empirical will** (measurable preferences) **from normative authority** (when it should bind dissenters).  

  **Result**: Populist claims that "the people have spoken" are *rhetorical* unless:  
  - Derived from a fair, high-participation process,  
  - With stable, non-contradictory results,  
  - And explicit limits on temporal bindingness.  

  Most theories fail Aggregation Rationality; all fail full coherence. Prioritize theories that embrace **process over substance** (e.g., deliberative democracy) or explicitly reject a unitary "will" (e.g., pluralism). Start with Shapiro’s *The State of Democratic Theory* and Riker’s *Liberalism Against Populism* to confront these limits.
