answer: |-
  ## Eulogy for Gerald Voss

  Good morning. For thirty-five years, I studied the forces that shape life. But today, I stand here shaped profoundly by one life: Gerald Voss. My mentor, my colleague, my friend. For fifteen of those years, I worked alongside him, first learning the craft, then sharing the lab and the department corridors. His passing leaves a silence where a powerful, questioning mind used to be.

  Gerald wasn’t just a scientist; he was a *particular kind* of scientist. He was driven by a deep, almost physical need to understand the world as it truly is, not as we might wish it to be. He despised easy answers and flattery in equal measure. He sought truth, relentlessly, wherever it led. And for Gerald, that quest led him down a path less traveled, focused on one of biology’s deepest puzzles: **the question of levels.**

  His life’s work centered on a fundamental debate: At what *level* does natural selection truly operate? Does it act solely on genes? On individuals? Or, as Gerald believed with fierce conviction, could it act on *groups* of individuals, in a way that couldn’t simply be reduced to the self-interest of genes or kin?

  He chose a remarkable creature to investigate this: the social amoeba, *Dictyostelium*. In times of scarcity, these single cells band together. Some sacrifice themselves to form a stalk, lifting others into a spore head for dispersal. But others – "cheaters" – shirk that duty, riding up without paying the cost. Gerald spent decades studying these dynamics, meticulously arguing that this wasn't just a story of selfish genes winning out. He saw it as evidence for something more: **selection acting on the group itself**, favoring groups that cooperated effectively against those undermined by too many cheaters.

  Now, anyone here familiar with evolutionary biology knows this was a bold stance. For much of Gerald’s career, the prevailing wisdom leaned heavily towards the gene’s-eye view. To argue strongly for group selection was to stand against a powerful current. He wasn’t always popular in that stance. He was, frankly, often seen as marginal, swimming upstream.

  But here’s what mattered to Gerald, and what I believe truly defines his legacy: **He refused to let the question be dissolved.** He saw a distinction – a vital, conceptual distinction – between a *unit* of selection (like a gene) and a *level* of selection (like a group). He saw something unique happening at that group level in his amoebae, something irreducible. And he dedicated his career to making the scientific world *see* that distinction, to take that level seriously.

  He wasn't chasing headlines or easy validation. He was chasing *understanding*. He was an empiricist to the bone. His loyalty wasn’t to his own theory winning, but to the evidence demanding a more complex picture. He read the modern revivals of multilevel selection carefully, underlining, questioning. He knew, as I do, that while the conversation has broadened, the specific conflict he defined his work around – that irreducible group level he fought to establish – remains distinct. He wouldn’t want us to claim a facile victory he didn’t earn. He valued the rigorous argument too much.

  So, how do we honor Gerald Voss? We honor him by honoring the *question* he dedicated his life to. We honor his intellectual courage – his willingness to ask the difficult, unpopular question and stand by it, driven by data and deep conviction. We honor his unwavering commitment to conceptual clarity – his insistence that the *level* matters. He wasn't just seeking an answer; he was demanding we see the complexity of the puzzle itself.

  For his family, his friends, his colleagues who weren't immersed in the equations and the amoebae: know this. Gerald’s life’s work mattered profoundly. It mattered because he challenged orthodoxy with rigor and integrity. It mattered because he pushed science to look harder, to think deeper, to consider possibilities others dismissed. He exemplified the scientific spirit at its best: curious, persistent, unflinchingly honest, and driven by a profound respect for the intricate mechanisms of life.

  He showed us that sometimes, the greatest contribution isn’t just finding the answer, but deepening the question. He spent his career illuminating a complex level of reality, demanding we acknowledge its existence. That is a profound and lasting legacy.

  Gerald, your beautiful stubbornness, your relentless search for truth at the right level, your integrity – these will not be forgotten. You taught us to see the world more clearly, even when the view was complex. Thank you. Rest now, knowing your question endures.
