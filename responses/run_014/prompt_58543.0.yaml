     - First, show the example with different priors and public evidence: they disagree even after seeing the same evidence and sharing their conclusions.
     - Then, to illustrate Aumann, we can say: "But imagine if Maya and Luis had started with the same prior. Then after seeing the same evidence, they would have had the same posterior. And even if they had private information, once they share their posteriors they would eventually agree."

     And then optionally, you can give a quick tweak where they do agree by having the same prior:

          Suppose both had a prior of 40% (average of 20 and 60).

          Then after seeing F:

              posterior = (0.4 * 0.9) / (0.4*0.9 + 0.6*0.3) = 0.36 / (0.36+0.18) = 0.36/0.54 = 66.7%

          So both would agree on 67%.

     This is simpler for the readers.

     Therefore, I recommend using the different priors example for the persistent disagreement, and then note that the theorem assumes a common prior.

     Final example for the article:

     Maya and Luis are trying to predict if their city will hit a heat record next summer. 

     Maya, an optimist, initially thinks there's only a 20% chance. 
     Luis, a pessimist, thinks it's 60%. 

     They both read the same climate report, which is favorable for a record. They agree on how to interpret the report: if a record is coming, such a report appears 90% of the time; if not, it appears 30% of the time.

     Maya updates: 
          New estimate = (20% * 90%) / [ (20%*90%) + (80%*30%) ] = 18% / 42% = 43%

     Luis updates:
          New estimate = (60% * 90%) / [ (60%*90%) + (40%*30%) ] = 54% / 66% = 82%

     They share their updated estimates. 
     Maya: 43%
     Luis: 82%

     They still disagree.

     Why? Because they started with different priors. 

     Aumann's agreement theorem says that if two rational people start with the same prior beliefs, and they have common knowledge of each other's posterior beliefs, then they must agree. Here, they didn't start with the same prior, so the theorem doesn't apply.

     If they had started with the same prior, they would have ended up with the same posterior. For example, if both started at 40%, they would have both updated to 67%.

     But what if they also had private information? Then even with the same prior, they might disagree until they share their posteriors. But once they share and their posterior beliefs become common knowledge, they will update again and eventually agree.

     However, in this public evidence only example, the difference in priors is the sole cause of the persistent disagreement.

     This example is simple and avoids the complexity of private signals. It highlights the role of the common prior.

     I hope this helps.
answer: |-
  Here's a concrete, step-by-step example with Maya and Luis forecasting a heat record, designed to illustrate Aumann's agreement theorem intuitively while showing why rational disagreement persists without common knowledge of posteriors. I'll include numbers, highlight the evidence vs. common knowledge distinction, and end with a tweak where agreement emerges.

  ---

  ### **The Setup: Maya vs. Luis**
  **Event**: Their city will break the all-time heat record next summer (*Record* = R).  
  **Priors** (starting beliefs):  
  - **Maya** (optimist): Believes heat records are rare. Prior = 20% chance of R.  
    `P_Maya(R) = 0.2` → `P_Maya(no R) = 0.8`  
  - **Luis** (pessimist): Believes climate change makes records likely. Prior = 60% chance of R.  
    `P_Luis(R) = 0.6` → `P_Luis(no R) = 0.4`  

  **Shared Evidence**: A new climate report shows ocean temperatures are "high." Both agree on what this implies:  
  - If R happens, "high" ocean temps occur 90% of the time.  
  - If R doesn’t happen, "high" ocean temps occur 30% of the time.  
  `P(high | R) = 0.9`, `P(high | no R) = 0.3`  

  ---

  ### **Step 1: Both Update Beliefs After Seeing the Report**
  They see the report ("high" ocean temps) and update using Bayes' theorem.  

  **Maya’s Update**:  
  ```
  P_Maya(R | high) = [P_Maya(R) × P(high | R)] / [Total Probability]  
                   = [0.2 × 0.9] / [(0.2 × 0.9) + (0.8 × 0.3)]  
                   = 0.18 / (0.18 + 0.24)  
                   = 0.18 / 0.42 ≈ 0.429 (42.9%)  
  ```

  **Luis’s Update**:  
  ```
  P_Luis(R | high) = [P_Luis(R) × P(high | R)] / [Total Probability]  
                  = [0.6 × 0.9] / [(0.6 × 0.9) + (0.4 × 0.3)]  
                  = 0.54 / (0.54 + 0.12)  
                  = 0.54 / 0.66 ≈ 0.818 (81.8%)  
  ```

  **Result**:  
  - Maya now believes: **42.9%** chance of R.  
  - Luis now believes: **81.8%** chance of R.  
  ➜ *They disagree despite seeing the same evidence.*  

  ---

  ### **Step 2: They Share Conclusions (But Not Posteriors)**
  Maya and Luis meet for coffee:  
  - Maya says: "After the report, I think there’s a 43% chance of a record."  
  - Luis says: "I think it’s 82%."  

  **What happens?**  
  They *hear* each other’s numbers, but **this is not common knowledge of posteriors**. Why?  
  - Each knows their *own* posterior, but they don’t know if the *other* has fully processed the shared information.  
  - They haven’t confirmed that both:  
    (a) Updated correctly,  
    (b) Know the other updated correctly,  
    (c) Know the other knows they updated correctly, etc. (infinite recursion).  

  **Result**:  
  - Maya thinks: "Luis started higher, so 82% makes sense for him. *My* 43% is still right."  
  - Luis thinks: "Maya started lower, so 43% makes sense for her. *My* 82% is still right."  
  ➜ **Disagreement persists.**  

  ---

  ### **Why This Doesn’t Break Aumann’s Theorem**
  Aumann’s theorem requires two conditions:  
  1. **Common prior** (same starting beliefs).  
  2. **Common knowledge of posteriors** (both know the other’s final number, both know the other knows, etc.).  

  Here, **condition #1 fails**: Maya and Luis have different priors (20% vs. 60%). The theorem doesn’t apply, so disagreement is allowed.  

  ---

  ### **The Tweaked Scenario: Agreement Emerges with Common Knowledge**
  Now, let’s tweak the story to satisfy Aumann’s conditions. Suppose:  
  1. **Maya and Luis have the same prior** (e.g., both start at 40%).  
  2. They achieve **common knowledge of posteriors** (e.g., they share numbers, verify assumptions, and publicly confirm in writing that both see each other’s conclusions).  

  **Same prior**: `P_Maya(R) = P_Luis(R) = 0.4`  
  After seeing "high" ocean temps:  
  ```
  Both calculate:  
  P(R | high) = [0.4 × 0.9] / [(0.4 × 0.9) + (0.6 × 0.3)]  
              = 0.36 / (0.36 + 0.18)  
              = 0.36 / 0.54 ≈ 0.667 (66.7%)  
  ```
  - Both now believe **66.7%**.  

  **Result**:  
  - When they share, they immediately agree. No further debate is needed because:  
    - They started with the same prior.  
    - They saw the same evidence.  
    - Sharing their identical 66.7% posteriors becomes common knowledge instantly.  

  ➜ **Disagreement vanishes, as the theorem predicts.**  

  ---

  ### **Key Takeaways for Your Explainer**
  - **Shared evidence ≠ agreement**: People with different starting points (priors) can see the same facts and rationally reach different conclusions.  
  - **Common knowledge is the glue**: For Aumann’s theorem to force agreement, people must not only share their final numbers but also *mutually know* those numbers are final (common knowledge).  
  - **Real-world disconnect**: In practice, we rarely achieve true common knowledge (hence dinner-table debates persist). Disagreement doesn’t mean someone is irrational—it often means priors or deeper assumptions differ.  

  This example shows why rational people can "agree to disagree" without violating Aumann—and how fixing the priors/common knowledge bridge resolves it.
