  Predictive coding models, like those using priors, need evaluation against these criteria. They might handle some phenomena well but struggle with illusions or epistemic issues. I should assess their strengths and weaknesses clearly.

  Structuring the response: start with the bottom line upfront, then outline desiderata with cases and negotiability, identify conflicting pairs, and end with a predictive coding scorecard. Keep it concise and focused, avoiding restating the question. The user values precision from their lab experience, so clarity is key.

