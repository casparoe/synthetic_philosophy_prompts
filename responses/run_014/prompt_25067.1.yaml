  - Phenomenal facts ≈ "U contains itself" (the problematic property) 
  - Zombie world ≈ Model where ZF holds but U exists without contradiction (seemingly conceivable) 
  - Impossibility proof ≈ Russell's paradox (like how physicalism might entail consciousness) 

