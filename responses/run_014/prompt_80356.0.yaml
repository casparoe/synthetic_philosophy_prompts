  I think the user's point about "false" vs. "not true" is crucial. In bivalent systems, they're equivalent, but in three-valued logics, they're not. The revenge paradox exploits this difference. Gap theories handle the classic liar but struggle with the strengthened version. The user is correct that this reveals a limitation in gap approaches.

