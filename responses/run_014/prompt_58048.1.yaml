prompt: |-
  I am a third-year undergraduate taking a seminar on practical rationality and decision theory, and I am trying to systematize my judgments about cases in which unrecoverable past investments seem to matter for what it is rational to do now.

  The simple view presented in class holds that rational choice should depend only on prospective costs and benefits, so that bygones are bygones. I find this compelling in the abstract, but my reactions to particular cases do not line up neatly, and I would like help finding a principle that captures them or showing where they conflict.

  Consider the following cases and my provisional verdicts:

  First, a concert case. I have purchased a nonrefundable ticket for an evening performance. When the evening arrives I am exhausted, and I judge that, setting aside the money already spent, I would clearly prefer to stay home and rest. If I go only in order not to waste the money, I take this to be irrational, a paradigm instance of the mistake.

  Second, an entrepreneurial case. A founder has invested three years and nearly all of her savings in a startup. Market feedback is consistently negative, with no new evidence that prospects have improved. She continues to invest further time and money primarily to avoid rendering the earlier investment pointless. I take this continuation to be irrational as well.

  Third, a doctoral case. A student is in the fourth year of a demanding program. She has discovered that she does not enjoy research, but finishing would require only one further year, and her employment prospects if she finishes are at least as good as if she leaves now for work she finds equally unappealing. She is inclined to finish in part because she does not want the previous years to have been for nothing. Here I am inclined to say that allowing the past investment to tip the balance is permissible, perhaps even sensible, and not the same mistake as in the first two cases.

  Fourth, a relationship case. Two partners have built a life together over eight years. They judge that their expected future well-being together is roughly on a par with what they could expect if they separated and eventually formed new partnerships, yet they remain together in part because of their shared history and the effort already invested. I am inclined to regard this history-sensitivity as permissible and even admirable, rather than as a rational error.

  Fifth, a self-binding case. Anticipating that I will be tempted to skip workouts, I deliberately purchase a block of nonrefundable training sessions precisely so that the aversion to waste will motivate me to attend. When I later attend a session I would otherwise skip, motivated mainly by the thought that I have already paid, I am inclined to regard this as rational execution of a sensible prior plan, even though the immediate reasoning looks identical to the reasoning I condemned in the concert case.

  My questions are these. Is there a precise principle governing when sensitivity to sunk costs is rational that can accommodate most or all of these verdicts, or must some of them be abandoned? In particular, how should such a principle distinguish mere aversion to waste from legitimate considerations with which sunk costs are often entangled, such as acquired skills, evidence of commitment, identity-constituting projects, or the rational use of waste-aversion as a motivational tool? If a unified principle requires qualifications to handle the doctoral, relationship, and self-binding cases, what motivates each qualification?

  Please state one or two candidate principles with sufficient precision to apply, explain which case motivates each clause or distinction, indicate what the preferred principle predicts for two further cases I have not listed, and conclude with an explicit assessment of which of my five provisional verdicts, if any, cannot be preserved together.
reasoning: |-
  Okay, the user is a third-year undergrad in a seminar on practical rationality, specifically focusing on when past investments should influence current decisions. They've presented five cases with their provisional judgments and are seeking a unified principle that explains when considering sunk costs is rational. 

  First, I need to understand their core struggle: they intellectually accept the "bygones are bygones" principle but have intuitive disagreements in specific scenarios. Their cases reveal tension between standard decision theory and real-world intuitions about identity, commitment, and strategic self-binding. 

  The doctoral case stands out because finishing the degree has tangible future benefits (employment prospects) beyond just honoring past effort. The relationship case introduces emotional/normative dimensions where shared history creates value. The self-binding case is clever—it frames sunk-cost motivation as a tool for precommitment. 

  Hmm... the challenge is distinguishing "mere waste-aversion" from cases where sunk costs signal something else (like evidence of persistence or identity investment). My proposed principle needs two key moves: (1) allow sunk costs to matter only when they alter current/future utility functions (e.g., via identity effects), and (2) permit strategic use of sunk costs as commitment devices if pre-approved. 

  For the concert case, the principle would still condemn going—since no identity shift or strategic plan exists. Same for the startup: persisting just to "validate" past effort fails. But the doctoral student gets a pass because quitting now wastes acquired skills (future utility), not just past time. The relationship survives because shared history changes the partners' present valuation. The gym case is rational only because the sunk-cost motivation was deliberately chosen earlier as a tool. 

  Testing with new cases: A "career pianist" continuing to play despite injury? Permissible if piano is identity-constitutive. A "book club" forcing oneself to finish a tedious book because others expect it? Irrational unless social identity is at stake. 

  The hardest tension is the doctoral vs. startup cases. The principle resolves this by asking whether sunk costs created new enduring values (doctoral skills) or just incurred losses (startup). If the startup founder had gained transferable skills, continuing might become rational—but the case specifies "no new evidence" of improvement. 

  Ultimately, the concert verdict must stand as irrational, while the others can be salvaged with careful distinctions. The user might need to concede that "pure" waste-aversion is always an error, but sunk costs often come bundled with legitimate considerations that decision theory must acknowledge.
answer: |-
  Here is a candidate principle that systematizes your judgments while respecting the core insight that *pure* waste-aversion is irrational:

  **The Qualified Sunk Cost Principle (QSCP):**
  > Rational choice depends only on prospective costs and benefits *relative to the agent's current preferences and resources*. However, sunk costs can rationally influence current decisions **if and only if** they either:
  > **(A)** Provide *reliable evidence* about future states or the agent's own future preferences that prospectively relevant information lacks; or
  > **(B)** Have *constitutively shaped* the agent's identity, values, or resources in a way that materially alters the prospective utility calculation; or
  > **(C)** Are being intentionally leveraged as part of a *rationally justified precommitment strategy* designed to overcome a known self-control problem.

  **Application to Your Cases & Motivations:**

  1.  **Concert Case (Irrational):** Violates QSCP. The sunk cost ($) provides no evidence (A), doesn't alter identity/resources/values (B), and wasn't part of a precommitment plan (C). Going is driven solely by pure waste-aversion.
      *   *Motivation for Exclusion:* The paradigmatic "sunk cost fallacy."

  2.  **Entrepreneurial Case (Irrational):** Violates QSCP. Negative market feedback undermines (A). The sunk cost (time/money) hasn't altered future prospects or the agent's fundamental values/goals (B) – persisting is just to avoid waste. No precommitment (C).
      *   *Motivation for Exclusion:* Pure waste-aversion overriding negative future prospects.

  3.  **Doctoral Case (Permissible/Sensible):** Supported by QSCP(B). The 4 years of sunk effort *have constitutively shaped the agent's resources*: they have acquired skills, knowledge, and proximity to a degree that significantly alters the prospective utility of the *final year* compared to quitting now. "Not wanting it to be for nothing" reflects the recognition that abandoning it now *wastes the acquired resource (the near-complete PhD)*, not just the sunk effort. The degree itself has prospective value (employment parity, but potentially signaling persistence, opening doors).
      *   *Motivation for Clause (B):* Past investments can create new enduring assets or states that directly impact future utility calculations. Distinguishes *wasting a resource created by sunk costs* (irrational to ignore) from *throwing good money after bad* (irrational to do).

  4.  **Relationship Case (Permissible/Admirable):** Supported by QSCP(B). The 8 years of shared history, effort, and investment have *constitutively shaped the partners' identities, values, and the relationship itself*. This shared history alters the *prospective utility* of continuing vs. separating. Staying isn't just about past effort; it's about valuing the unique relationship *built* by that effort. Ending it destroys that specific, identity-constitutive good.
      *   *Motivation for Clause (B):* Recognizes that significant past investments can create irreplaceable intrinsic goods (like deep relationships or identity-defining projects) whose loss is a genuine prospective cost.

  5.  **Self-Binding Case (Rational):** Supported by QSCP(C). The sunk cost (payment) is being leveraged precisely as intended in a *rationally justified precommitment strategy*. The prior self correctly anticipated a self-control problem (skipping workouts) and chose a tool (sunk cost aversion) known to counter it. The current self's motivation ("I paid for it") executes this rational plan.
      *   *Motivation for Clause (C):* Allows for the *instrumental rationality* of using a cognitive bias (waste-aversion) as a tool when deliberately chosen in advance to overcome a recognized weakness, provided the overall plan is prospectively beneficial.

  **Predictions for New Cases:**

  1.  **Case 6: The Marathon Runner:** A runner has trained intensely for months for a marathon, incurring significant costs (time, shoes, fees). On race day, they have a mild, non-injurious cold; running would be unpleasant but not harmful. They run primarily because "I didn't train all that time for nothing."
      *   **QSCP Prediction:** *Permissible.* (B) likely applies. The training has constitutively shaped their physical state and skills ("marathon readiness"), a resource wasted if not used *now*. The mild cold doesn't negate the prospective benefit of achieving the goal they prepared for.

  2.  **Case 7: The Collector:** A collector buys a rare, expensive antique vase. After purchase, they discover it's slightly damaged and worth significantly less than paid. They display it prominently anyway, thinking "I paid too much not to enjoy it."
      *   **QSCP Prediction:** *Irrational.* No (A) - damage is known. No (B) - ownership doesn't inherently alter identity/value to make display rational *prospectively* if they don't genuinely like it more than alternatives. No (C) - not a precommitment. Pure waste-aversion influencing consumption.

  **Assessment of Your Provisional Verdicts:**

  The QSCP, motivated by the distinctions needed for Cases 3, 4, and 5, successfully **preserves all five of your provisional verdicts:**

  *   Concert Case: Condemned (Violates QSCP).
  *   Entrepreneurial Case: Condemned (Violates QSCP).
  *   Doctoral Case: Permitted (QSCP(B) - sunk costs created a valuable resource/near-goal).
  *   Relationship Case: Permitted (QSCP(B) - sunk costs constitutively shaped identity/goods).
  *   Self-Binding Case: Permitted (QSCP(C) - rational precommitment execution).

  **Key Distinctions Clarified:**

  *   **Mere Waste-Aversion vs. Legitimate Considerations:** QSCP distinguishes pure aversion to loss (irrational) from cases where sunk costs have genuinely altered the agent's state (creating resources, skills, identity, relationships) or are used instrumentally in a rational plan. The *reason* the sunk cost seems to matter determines rationality.
  *   **Acquired Skills/Evidence of Commitment:** These fall under (B) – they are resources/statuses *created* by past investment that alter future prospects.
  *   **Identity-Constituting Projects:** Core to (B) – abandoning them destroys a constitutive part of the self, a major prospective cost.
  *   **Motivational Tool:** Covered by (C) – deliberate, rational precommitment leveraging the bias.

  This principle affirms that rational choice is fundamentally forward-looking but acknowledges that the past *can* rationally matter by changing *what* we are choosing between in the present (via constitutive effects) or by being part of a rational strategy to manage future selves.
