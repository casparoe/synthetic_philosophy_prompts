  First, I need a solid example. The human visual system for navigating the terrestrial environment comes to mind. It evolved to handle things like depth perception on land, but now we use it for interpreting 2D images like photos and screens. That shift from 3D to 2D seems like a clear case of exaptation. The original function was survival-related tasks, but now it's about decoding artificial representations.

  Now, why does this trouble Millikan's theory? Her approach defines proper functions based on evolutionary history—what a mechanism was selected for. The new function (interpreting 2D images) isn't what the visual system evolved for, so under Millikan's view, it shouldn't be considered a proper function. But intuitively, when we look at a picture, our visual system is functioning correctly when it interprets the image accurately. Millikan's theory might say there's no proper function here at all, which feels counterintuitive.

