prompt: |-
  Give an example of a case in which a representational mechanism has been exapted (co-opted) for a representational function different from the one for which it was originally selected by natural selection, and explain why this case poses a problem for the etiological (Millikan-style) account of mental content with respect to two questions: whether the new function counts as the mechanism's proper function, and whether false representations produced under the new function count as misrepresentations or malfunctions.
