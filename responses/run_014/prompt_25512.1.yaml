  For the prediction, I think the lexicographic rule is more likely. Her rejection of two days of very mild discomfort as worse than brief severe pain suggests strong intensity weighting. Also, her population ethics background might incline her toward discontinuity views. Under this rule, she'd say two hours of mild pain is better than one minute of severe pain.

  A good discriminative comparison would be one minute of severe pain versus a very long duration of very mild discomfort, say a month. The lexicographic rule might still prefer the brief severe pain, while multiplicative models would eventually flip due to accumulated duration.

