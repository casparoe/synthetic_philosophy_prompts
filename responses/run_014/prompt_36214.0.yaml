prompt: |-
  I'm part of a small reading group on epistemic game theory — mostly philosophy grad students plus a couple of economists — and after a semester working through common knowledge of rationality, iterated dominance, and the backward induction debates, I've collected a set of gut verdicts about particular scenarios that I can't yet see any single principle behind. Here are the cases and my verdicts; I'd like you to tell me what, if anything, they add up to.

  (1) Muddy children: three children, two with muddy foreheads, and a father who publicly announces that at least one child is muddy. I think the two muddy children can each figure out they're muddy after two public rounds of everyone saying "I don't know." (2) Two commanders who must both attack at dawn to win, while attacking alone is a disaster; they can communicate only by couriers, each of which has a small chance — say one in fifty — of being captured, and they keep sending acknowledgments back and forth until one fails to arrive. My verdict: they never attack, no matter how many acknowledgments get through. I hold this even at ninety-nine successful acknowledgments, which my friends call paranoia. (3) The same commanders, but now there is a signal they can observe simultaneously and publicly; there they attack. So the gap between "each knows, and each knows the other knows, ... to depth ninety-nine" and genuine common knowledge strikes me as real and behaviorally decisive. (4) A stag hunt in which each partner receives a private but quite reliable signal of the other's intentions, right nineteen times out of twenty: here I think they do hunt stag. The noise doesn't destroy cooperation — and this is what bothers me, since case (2) looks structurally similar. (5) A centipede game with a hundred nodes: I think it can be rational to pass at early nodes, because the fact that we have both passed a few times is itself evidence against the unbounded rationality that backward induction presupposes. (6) A one-shot prisoner's dilemma under full common knowledge of payoffs and rationality: defect, full stop, no matter how many layers deep the mutual knowledge goes — and this one feels robust to me in a way (2) doesn't.

  Is there a principle that delivers all of these, or close to it? My tentative stab is that the payoff structure decides whether a speck of higher-order doubt gets amplified (as with the commanders, where each needs to be sure the other will attack) or washed out (as in the stag hunt, where — somehow — it doesn't), but I can't make that precise, and I can't see what it could say about my centipede verdict, where the doubt isn't about whether a message arrives but about whether the other player is even the type that backward induction assumes. Please state your candidate principle or principles as precisely as you can, explain what each clause is doing there, and tell me honestly which of my verdicts you would overturn and why — I'd rather lose a verdict than keep it by torturing the principle. Then apply it to two cases I haven't listed: a "guess two-thirds of the average" game among players who all know that a small minority of them choose numbers at random, and the commanders' setup again but with the couriers captured only one time in a thousand. Finally — and I mean this seriously — tell me what would change your mind: which of my verdicts, if I refused to give it up, would sink your best principle, and where in the chain of reasoning is the whole thing most likely to break.
reasoning: |-
  Hmm, this is a fascinating challenge from a philosophy grad student working through epistemic game theory. The user has collected six intuitive verdicts about different scenarios involving knowledge, rationality, and coordination, and wants to know if there's a unifying principle behind them. 

  First, let me acknowledge the depth here - these aren't casual intuitions but carefully considered positions after a semester of rigorous study. The user seems genuinely puzzled by the apparent contradictions, especially between cases (2) and (4), and between (5) and (6). There's intellectual honesty in the request to overturn verdicts if necessary rather than force-fit a theory.

  The core tension seems to be about when higher-order uncertainty matters versus when it doesn't. In muddy children (1), common knowledge gets built through public announcements. But in the commander case (2), even 99 successful messages don't suffice because common knowledge requires impossibility of error - each captured courier creates doubt. Yet in stag hunt (4), 5% error rate doesn't prevent cooperation, which feels inconsistent. And centipede (5) challenges backward induction by introducing doubt about rationality itself.

  My proposed "Uncertainty Amplification Principle" attempts to resolve this by focusing on three factors: the fragility of coordination (whether small doubts cascade), the stakes of miscoordination, and whether uncertainty concerns rationality or just information. For commanders (2), attacking alone is catastrophic so doubt amplifies, while in stag hunt (4), hunting hare alone is safe so doubt doesn't cascade. This explains why (3) with public signals works - it creates common knowledge.

  The centipede case (5) is trickier because the doubt is about the player's fundamental rationality, not just their knowledge. Here the principle needs the "rationality sensitivity" clause - passing creates evidence that players might not be hyper-rational backward inducters. Whereas in PD (6), defection dominates regardless of rationality assumptions.

  For the additional cases: In "guess 2/3 average" with random players, I'd predict convergence toward Nash equilibrium but slightly higher numbers due to the noise. For commanders with 1/1000 capture risk, I'd still say no attack after 999 messages because the catastrophic risk remains, though this feels counterintuitive - perhaps this verdict should be revisited.

  The most fragile part is justifying why PD (6) is robust while centipede (5) isn't, when both involve rationality doubts. The distinction hinges on PD being dominance-solvable whereas centipede requires full backward induction. If the user insisted that PD players with bounded rationality might cooperate sometimes, that could break the principle. The chain might also break at commanders with extremely low risk - maybe at some point we should say "good enough" even without true common knowledge.

  This user clearly values precision but also intellectual honesty - they'd rather have a coherent theory that overturns some intuitions than a patchwork that accommodates all. That's refreshing. I should be equally honest about where the principle strains, especially the commander case with very low failure probabilities. The epistemology here is deep - it's about whether knowledge requires absolute certainty or practical certainty, which philosophers have debated for centuries. Game theory forces these abstract questions to have behavioral consequences, which is what makes this so rich.
answer: |-
  Your verdicts reveal a deep tension between **common knowledge requirements** and **higher-order uncertainty** in coordination games, with the critical distinction being whether the game is **robust to bounded rationality** or requires **infinite mutual knowledge for stability**. Here's a principled framework that captures most of your intuitions, identifies where it struggles, and specifies which verdict I'd overturn:

  ### The Uncertainty Amplification Principle (UAP)
  > **In games requiring precise coordination under uncertainty, higher-order doubts prevent equilibrium play if and only if:**
  > **(i)** Payoffs are **strictly complementary** (success requires *all* players to choose the same risky action, failure is catastrophic if any player deviates);
  > **(ii)** The equilibrium is **fragile to unilateral deviation** (a single player’s uncertainty can trigger coordination failure);
  > **(iii)** Uncertainty **concerns the players’ rationality or actions** (not just payoff-irrelevant states).

  ### How UAP Explains Your Verdicts:
  1. **Muddy Children**:  
     - *Fits UAP*: Payoffs aren’t complementary (no "action" to coordinate). Knowledge acquisition is public and iterative.  
     - *Clause (iii) inactive*: Uncertainty is about *beliefs*, not rationality. Public announcements resolve higher-order doubts.

  2. **Commanders (Couriers)**:  
     - *Fits UAP*: (i) Strict complementarity (both must attack); (ii) Fragility (one doubter causes failure); (iii) Uncertainty concerns *whether the other will attack*.  
     - Each message failure injects higher-order doubt ("Does *she* know *I* know?"), amplifying under (i)–(ii). **Never attack** holds.

  3. **Commanders (Public Signal)**:  
     - *Fits UAP*: Public signal creates **common knowledge** of the signal. Clause (iii) eliminated. Coordination possible.

  4. **Stag Hunt (Noisy Signals)**:  
     - *Fits UAP*: (i) Payoffs are *not* strictly complementary (safe Hare option); (ii) Not fragile (one player hunting Hare isn’t catastrophic).  
     - Noise creates doubt, but clauses (i)–(ii) prevent amplification. **Cooperation survives**.

  5. **Centipede Game**:  
     - *Fits UAP*: (i) Payoffs are complementary (passing requires mutual trust); (iii) Uncertainty concerns *rationality* (is the opponent a backward inductor?).  
     - Early passes are evidence against hyper-rationality, making cooperation viable. **Passing rational**.

  6. **Prisoner's Dilemma**:  
     - *Fits UAP*: (i) Payoffs are *not* complementary (defecting dominates regardless of others’ actions); (ii) Not fragile (no coordination required).  
     - Higher-order knowledge irrelevant. **Defect always**.

  ---

  ### Where UAP Struggles and Which Verdict I’d Overturn
  - **The Tension**: Cases (2) and (4) *are* structurally similar (noisy signals), but UAP resolves this via payoff structures: (2) has catastrophic miscoordination, (4) does not.  
  - **Weakness**: UAP assumes players treat "rationality" as a binary. If rationality is *graded* (e.g., levels of k-reasoning), (2) might permit attack after many messages.  
  - **Overturned Verdict**: **Case (2) with 99 successful acknowledgments**.  
    - *Why*: With 1/50 capture risk, P(common knowledge after n messages) ≈ (49/50)^n. After 99 messages, P(no capture) ≈ (0.98)^99 ≈ 13%.  
    - *UAP Adjustment*: If players use a **tolerance threshold** (e.g., "attack if P(miscoordination) < 5%"), they attack at high n. Your economist friends are right: **99 acknowledgments *should* justify attacking** under bounded rationality.  
    - *Philosophical Cost*: This concedes that "practical certainty" suffices when catastrophe is finite. True common knowledge remains impossible, but behaviorally, we approximate it.

  ---

  ### Application to New Cases
  1. **"Guess 2/3 Average" with Random Minority**:  
     - **UAP Prediction**: Players converge toward Nash (0), but slowly.  
       - *Why*: Random players act as "noise," creating higher-order doubt about others’ rationality (clause iii). But payoffs lack complementarity (i) and fragility (ii), so doubt doesn’t amplify. Players best-respond by guessing low numbers, but not 0.  
     - **Verdict**: Average guess > 0, but < 33.

  2. **Commanders with 1/1000 Capture Risk (after 1000 messages)**:  
     - **UAP Prediction**: **Attack**.  
       - *Why*: P(no capture) ≈ (0.999)^1000 ≈ 37%. With low complementarity risk (if "catastrophe" is bounded), bounded-rationality players attack. Clause (i) holds, but failure probability is now pragmatically negligible.  
     - *Contrast with (2)*: At 1/50 risk, P(no capture after 100 messages) ≈ 0.0002% – still catastrophic.

  ---

  ### What Would Sink UAP
  - **If You Held Firm on Case (2) at n=99**:  
    UAP fails if you insist that **any non-zero doubt** (even 0.0001% miscoordination risk) prevents action in complementary games. This demands *literal* common knowledge, rendering coordination impossible outside public signals.  
    - *Breaking Point*: UAP relies on players ignoring infinitesimal risks (as in real life). If you reject this, UAP collapses into a triviality: "Common knowledge is impossible, so coordination fails." But this contradicts cases (3), (4), and (5).  
    - *Resolution*: Admit **bounded rationality** explicitly: Players act when higher-order doubt drops below a payoff-dependent threshold.

  - **If Centipede Defection Felt Robust**:  
    UAP assumes players *update beliefs* about rationality based on actions. If you insisted that "rational players *must* backward induct regardless of evidence," UAP’s clause (iii) fails. But your verdict (5) suggests you reject this.

  ---

  ### Refined Principle
  **Bounded Rationality and Uncertainty Threshold (BRUT)**:  
  > Players achieve *practical coordination* if:  
  > (a) Payoff losses from miscoordination are finite (not infinite/catastrophic);  
  > (b) Higher-order doubt decays below a tolerance threshold τ, where τ depends on the cost of miscoordination;  
  > (c) Uncertainty concerns *information* (not rationality), or players update beliefs about others’ rationality.  
  > Else, coordination fails.

  BRUT preserves your verdicts except (2) at high n, elevates evidence-based belief updating (as in centipede), and quantifies "catastrophe." It treats PD as τ-invariant (defect always optimal), and commanders as τ-dependent. **Your instincts are sound; they just need a tolerance parameter for the real world.**
