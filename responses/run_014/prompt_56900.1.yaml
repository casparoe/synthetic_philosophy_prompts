  Hmm, the user is grappling with the complex value system underlying major museums' practices. They've identified three puzzling aspects: the massive investment in unseen stored artworks, the disconnect between "experience-based" public justifications and practices like removing forgeries regardless of aesthetic impact, and the cultivation of donor relationships that seem to commodify affection.

  The user wants me to reconstruct the implicit theory of value behind these practices. They're asking several layered questions: about the store-and-never-sell rule's philosophical commitments, whether the forgery reaction contradicts experience-based values, how donor cultivation fits in, which aesthetic theories are excluded by these practices, and what would actually change if museums took experiential value seriously.

  This is a sophisticated inquiry that touches on philosophy of art, institutional economics, and cultural policy. The user clearly has background knowledge - they reference van Meegeren forgeries, deaccessioning debates, and even recall philosophical arguments about aesthetic value. Their frustration with institutional contradictions is palpable.

  The core tension seems to be between three value frameworks museums simultaneously employ: 1) Art objects as having intrinsic value (storage practices) 2) Art as experience (public programming justifications) 3) Art as cultural capital (provenance/donor practices). These create cognitive dissonance when examined together.

  For the deaccessioning taboo, I should distinguish between its practical justification (preventing short-term financial decisions) and what it implies philosophically (artworks as inalienable). The library comparison is sharp - why can libraries discard books but not museums artworks? That points to art's unique status as irreplaceable cultural documents.

  The forgery paradox reveals how authenticity functions as a necessary condition for aesthetic experience in institutional settings, regardless of perceptual qualities. This clashes with pure aesthetic empiricism but aligns with institutional theories of art.

  Donor cultivation shows museums pragmatically engaging with art's symbolic capital - where ownership history and naming rights convert prestige into financial support. This transactional aspect coexists uneasily with purer aesthetic claims.

  If museums truly prioritized experiential value, we'd see radical changes: rotating stored collections visibly, selling lesser works to fund access programs, displaying forgeries with educational context, and measuring success by engagement depth rather than visitor numbers. The fact they don't illustrates how deeply institutional imperatives shape practice.
answer: |-
  You've perfectly articulated the deep tensions in museum ethics. Let's reconstruct the implicit theory of value, analyze its components, and explore alternatives:

  **The Implicit Theory of Value ("The Custodial Model"):**

  1.  **Artworks as Unique, Irreplaceable Cultural Capital:** The core presupposition is that artworks possess intrinsic, non-reproducible value as unique cultural documents and aesthetic achievements. They are *sui generis*, not fungible commodities.
  2.  **The Museum as Eternal Custodian:** The museum's primary duty isn't to maximize current visitor pleasure, but to act as a perpetual guardian of this cultural capital for *future generations*, regardless of current display constraints. Storage is preservation, not neglect.
  3.  **Authenticity as Foundational:** The value of an artwork is inextricably tied to its authentic origin – the artist, time, place, and intent of creation. Provenance verifies this. A forgery, regardless of aesthetic impact, is a deception that nullifies its status as a cultural document and its connection to the artist's legacy. Its value collapses because it *isn't* what it claims to be.
  4.  **Deaccessioning Taboo as Anti-Commodification & Anti-Slippery Slope:** Selling art risks:
      *   Treating the collection as a financial asset.
      *   Prioritizing short-term needs over perpetual guardianship.
      *   Creating perverse incentives ("sell the 'lesser' work to fund X" easily becomes "sell the masterpiece to fund Y"). The rule (even with recent loosening) aims to prevent the collection becoming a piggy bank. Libraries can weed because books are (often) replaceable copies; artworks are unique originals.
  5.  **Experience as Means, Not End:** Visitor experience is crucial for *justification* (to funders, the public) and *access* to the cultural capital. It fulfills the educational/societal mission *in the present*. However, it is secondary to the core custodial duty. High visitor numbers demonstrate relevance and validate the institution's public funding/support.
  6.  **Donor Affection as Patronage, Not Transaction:** Cultivating donors leverages the symbolic value of association with cultural capital. Naming rights convert a donor's desire for legacy/status (affection for the *institution* or *art*) into financial support for the custodial mission. It's framed as patronage supporting the eternal cause, not a crass purchase of influence.

  **What the Practice Commits To vs. What Fits Comfortably:**

  *   **Strict Commitment:** Artworks have unique, intrinsic value demanding perpetual preservation. Authenticity is non-negotiable. The collection is held in trust for the future.
  *   **Comfortable Fit:** High visitor numbers = success. Donor cultivation is essential. Strict no-sale rules prevent bad decisions. Not every object *needs* constant display to justify its existence.

  **Rival Accounts Ruled Out (Quietly or Loudly):**

  1.  **Pure Aesthetic Empiricism/Formalism:** If value lies *only* in the perceptual experience or formal qualities, then:
      *   Storage makes no sense (unseen objects).
      *   Removing a compelling forgery (like van Meegeren) is irrational (the brushstrokes *are* the experience).
      *   Provenance beyond authenticity wouldn't matter.
  2.  **Radical Consequentialism/Utilitarianism:** If value is *only* in maximizing positive experiences (pleasure, education, wellbeing):
      *   Selling unseen art to fund vastly more impactful access/education programs becomes not just permissible, but obligatory.
      *   Displaying compelling forgeries with full context could be valuable.
      *   Storage costs need strong justification against alternative uses of funds.
  3.  **Art as Purely Commodity:** The taboo against selling, the emphasis on authenticity/provenance beyond market value, and the custodial role actively resist reducing art to mere financial asset value.
  4.  **Anti-Institutional Theories:** The museum asserts itself as the necessary, legitimate arbiter and guardian of value (authenticating, preserving, interpreting), ruling out notions that value resides *only* in the artist's intent or the viewer's unmediated experience.

  **Consistency Check (Including Donors):**

  *   **Internal Tension:** The biggest strain is between the "custodial/object-focused" core and the "experience-focused" public justification. Prioritizing future preservation *can* conflict with maximizing current access/experience (storage costs vs. program funding). The donor cultivation leverages the symbolic value of objects/ownership for funds, which aligns with the object-focus but feels transactional.
  *   **Consistent Core:** Authenticity, custodianship, and anti-commodification form a coherent (if contestable) core. Donor naming fits the patronage model supporting this custodianship. Experience is *a* good, but subordinate to the primary duty of preservation. Provenance reinforces authenticity and historical significance (part of the object's intrinsic value).

  **Underdetermined Areas (Multiple Theories Possible):**

  *   **The *Extent* of Storage:** How much unseen art is justified? Custodialism demands keeping everything significant. A more pragmatic view might allow stricter acquisition policies or deaccessioning of truly redundant/insignificant items (still controversial).
  *   **The *Weight* of Experience:** How much should visitor experience *constrain* custodial duties? Does building a flashy new wing for better experience justify selling a minor stored work? Custodialism would say no; consequentialism might say yes.
  *   **Deaccessioning for Direct Collection Care:** Recent loosening (AAMD 2020) allows sales proceeds for direct collection care (conservation, storage). This *can* be framed as a custodial act (using one asset to preserve others), fitting the core model better than funding operations.

  **What a Truly Experience-Based Museum Would Do Differently:**

  1.  **Radical Collection Rotation:** Aggressively cycle stored works into view through open storage, visible conservation labs, high-frequency gallery rotations, and digital access, minimizing "permanent" invisibility.
  2.  **Strategic Deaccessioning:** Sell redundant or lesser-stored works not core to the mission to directly fund:
      *   Free admission, expanded hours, transportation subsidies.
      *   Deep community engagement programs (not just surveys).
      *   Educational staff and resources.
      *   Conservation of works *actively* used in experiences.
  3.  **Recontextualizing Forgeries & Provenance:** Display compelling forgeries *as forgeries* – using them to teach about authenticity, detection, art history, and the very nature of artistic value. Discuss problematic provenance transparently as part of the object's story and institutional history.
  4.  **Metrics Shift:** Prioritize depth of engagement (time spent, return visits, program participation, qualitative feedback) over raw visitor numbers. Measure impact on specific communities.
  5.  **Mission-Driven Acquisitions:** Acquire works more strategically based on their potential to generate meaningful *experiences* and dialogue for the *specific* community served, rather than just filling gaps in a canonical art historical narrative.
  6.  **Rethinking "Permanent Collection" Display:** Galleries might become more dynamic, thematic, and responsive to current issues/audiences, less focused on static chronological/genre displays of "masterpieces."

  **Conclusion:**

  The dominant implicit theory is fundamentally **custodial and object-centric**. Artworks are unique vessels of cultural/aesthetic value demanding perpetual preservation by a trusted institution. Authenticity is paramount. Experience is a vital *access point* and *justification*, but secondary to preservation. Deaccessioning is taboo to prevent commodification and mission drift. Donor cultivation leverages the symbolic value of association with this cultural capital.

  This theory rules out pure aesthetic empiricism and radical utilitarianism. Its main tension lies in balancing custodianship (costly storage, anti-sale) with the public-facing emphasis on experience. A truly experience-based museum would look dramatically different: aggressively visible storage, strategic selling to fund access, educational use of forgeries/provenance, and metrics focused on engagement depth over crowd size. The persistence of the custodial model reflects a deep-seated belief in the unique, intrinsic, and eternal value of the authentic art object itself, held in trust.
