prompt: |-
  I'm a PhD student in the history and philosophy of science, and for the past year I've been working on accounts of scientific progress — the Lakatosian view that a research programme is progressive so long as its internal heuristic keeps yielding novel predictions, and the Kuhnian view that change is a shift between paradigms, where "progress" is at most a widening of the range of problems the new framework can absorb. I keep getting asked, at talks and on qualifying, whether philosophy makes progress, and I've realized I can't answer it without first pinning down what my own criterion is, because the criteria I use for science don't obviously transfer. So I've been going by my gut on a set of concrete cases, and I'd like to know what principle, if any, captures the pattern.

  Here are my verdicts on whether a given development counts as progress in philosophy:

  1. The Gettier counterexamples to the justified-true-belief account of knowledge count as progress, even though they produced no new consensus theory and we may never get one. What got us was a better-mapped problem space, not a better answer.

  2. Russell's theory of descriptions counts as an advance over the pre-Russell treatment of definite descriptions, even though it has since been superseded and some of its central claims are now rejected.

  3. The development of formal logic — Boole, Frege, the logicist programme — counts as progress in philosophy, but I have a persistent sense that this is progress in a tool philosophy uses rather than in philosophy itself: the subject matter (the nature of truth, knowledge, meaning) looks the same before and after Frege.

  4. Kant's critical project is an advance over Hume's empiricist account, but I suspect part of my verdict is the drama of the story — a thinker jolted awake by a rival — rather than a genuine improvement in how the problem is handled.

  5. The rise of experimental philosophy does not count as progress in philosophy. It imports a method from psychology, and I don't think it improves on the armchair method the way formal logic did.

  6. The rise of formal epistemology — probability and decision theory applied to belief, knowledge, and rationality — does count as progress, even though it too is a methodological import from outside philosophy.

  The pair I keep going back and forth on is 5 and 6: both are imports of a method from another discipline, yet I judge one as progress and the other as not, and I can't yet articulate the difference. My tentative guess is that formal epistemology changes the standards by which arguments in the subject matter are evaluated — it gives us a precise notion of coherent, rational belief — whereas experimental philosophy merely supplies a new instrument for eliciting the same kind of evidence the armchair method was already after. If that is the real difference, then 3 falls on the "changes the standards" side, and 1 and 2 fall on a different side altogether: they are not methodological imports at all, but refutations that sharpen the problem.

  What I'd like is a principle, or a small set of candidate principles, stated precisely, that captures these verdicts. For each candidate, tell me which of my cases motivates each clause, what it predicts for cases I haven't listed (say, the rise of computational philosophy, the application of decision theory to ethics, or the analytic revival of metaphysics), and — honestly — which of my six verdicts it cannot accommodate without doing violence to some clause. I don't need it to save all six; if the simplest coherent principle forces me to drop one, I want to know which one and why. I'm not after a bibliography or a survey of the literature on progress; I'm after the criterion itself, stated so that I can apply it to a new case on my own.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a PhD student in history and philosophy of science, working on scientific progress. They're struggling with applying criteria like Lakatos and Kuhn to philosophy itself. They've listed six specific cases where they've made judgments about philosophical progress and want a principle that explains their pattern, especially the distinction between experimental philosophy and formal epistemology.

  First, I need to understand their examples. They see Gettier cases as progress because they map the problem space better, even without consensus. Russell's theory was an advance despite being superseded. Formal logic is progress but feels like a tool. Kant over Hume is progress but maybe influenced by narrative. Experimental philosophy isn't progress, but formal epistemology is. The key puzzle is why they accept one methodological import (formal tools) but reject another (experimental methods).

  The user's tentative guess is that formal epistemology changes evaluative standards, while experimental philosophy just provides a new instrument for the same evidence. That makes sense. Formal methods introduce precision and new norms for rationality, altering how arguments are judged. Experimental methods, however, gather empirical data but don't change the fundamental standards of philosophical evaluation.

  I should consider what deeper principle ties their judgments together. It seems like progress in philosophy, for them, involves either refining the problem structure (like Gettier) or transforming methodological standards (like formal logic). Cases that merely add data without altering the conceptual framework don't count. That's why experimental philosophy doesn't make the cut—it supplies new data but doesn't reshape the philosophical questions themselves.

  For Kant vs. Hume, the user is unsure if it's genuine progress or just a dramatic narrative. A principle focusing on problem-structuring might clarify: Kant restructured epistemology by introducing synthetic a priori, which changed how subsequent problems were framed. That's more than just drama; it's a conceptual shift.

  Now, applying this to unmentioned cases. Computational philosophy might involve formal models that change how problems are approached, so it could count. Applying decision theory to ethics might transform ethical debates by introducing rational choice frameworks, which is progress. The analytic revival of metaphysics restructured problems using linguistic analysis, so likely progress.

  But the user mentions that their verdict on formal logic feels like progress in a tool, not philosophy itself. The principle needs to accommodate that tools can be philosophical progress if they transform how problems are structured or evaluated. Formal logic did redefine what counts as a good argument in philosophy, so it's integral.

  The tricky part is Russell's theory. Even though superseded, it's progress. Here, the principle of problem-structuring applies: Russell's theory clarified issues of reference and meaning, advancing the discourse even if later refuted. Similarly, Gettier cases restructured epistemology.

  Experimental philosophy fails because it doesn't restructure problems; it gathers more intuitions. Formal epistemology succeeds because it introduces new norms for belief coherence.

  So the core principle might be: philosophical progress occurs when there's an enduring restructuring of the problem space or transformation of evaluative standards. This captures their judgments except maybe the narrative aspect of Kant. But focusing on Kant's conceptual innovations rather than the drama aligns with the principle.

  Cases that wouldn't fit: if a new method only adds data without changing standards, it's not progress. Their verdict on experimental philosophy holds. Formal tools that don't alter philosophical standards might not count, but the user sees formal logic as progress, so it must have changed standards.

  In conclusion, the user needs a principle that distinguishes between methodological imports that transform philosophical frameworks versus those that don't. Their intuition centers on whether the development fundamentally changes how problems are conceived or evaluated in philosophy.
answer: |-
  Based on your cases and the core tension between methodological imports, I propose the **Problem-Structuring Principle (PSP)** as the criterion capturing your intuitions:

  **Philosophy makes progress when a development provides an *enduringly useful structure* for identifying, analyzing, or resolving core philosophical problems, where "structure" means a conceptual framework, analytical tool, or refined problem-space that demonstrably alters *how subsequent philosophers engage with the subject matter*.**

  This principle emphasizes **enduring utility** and **transformative impact on philosophical practice** rather than consensus, final truth, or mere novelty. Let's break down its components and apply it to your cases:

  1.  **Enduringly Useful Structure:**
      *   The development must offer resources (concepts, distinctions, methods, problem-formulations) that remain actively used or referenced, even if contested or superseded. It becomes part of the philosophical toolkit or landscape.
  2.  **Core Philosophical Problems:**
      *   The structure must be applied to *intrinsically philosophical questions* (e.g., nature of knowledge, reality, meaning, value, reasoning) rather than merely empirical or technical ones.
  3.  **Alters Engagement:**
      *   The key criterion: Does it change *how* philosophers argue, what counts as a relevant consideration, how problems are decomposed, or what constitutes a satisfying answer? This distinguishes transformative imports from mere additions.

  **Applying PSP to Your Cases:**

  1.  **Gettier Cases (Progress):** *Motivates Enduring Structure & Alters Engagement.* They provided an *enduring structure* (the tripartite analysis + counterexample template) that fundamentally *altered engagement* with epistemology. Defining knowledge and testing definitions became structured around the JTB+ counterexample model, refining the *problem-space* itself. Consensus isn't needed; the structure persists.
  2.  **Russell's Theory of Descriptions (Progress):** *Motivates Enduring Structure & Alters Engagement.* It provided an *enduring structure* (analyzing descriptions via quantifiers and uniqueness) that *altered engagement* with language, reference, and existence. Even critics must engage with its framework. Its supersession doesn't negate its role in structuring the debate.
  3.  **Formal Logic (Boole, Frege) (Progress):** *Motivates Alters Engagement.* This is the key case for PSP resolving your ambivalence. While a "tool," its adoption *fundamentally altered engagement* with reasoning, truth, and meaning. It introduced new standards of precision, rigor, and forms of argument (e.g., formal proofs, model theory) applicable to core problems. The "subject matter" (truth, meaning) wasn't *replaced*, but the *methods for engaging* with it were revolutionized. It became an enduring structure *within* philosophical practice.
  4.  **Kant over Hume (Progress):** *Motivates Enduring Structure.* Kant provided a radically new and *enduring structure* (transcendental idealism, synthetic a priori, categories) for engaging with core problems of knowledge, causation, and metaphysics initiated by Hume. The "drama" stems from the *impact* of this new structure. PSP focuses on the structure's utility and transformative effect, not the narrative.
  5.  **Experimental Philosophy (Not Progress):** *Motivates Core Problems & Alters Engagement (negatively).* PSP explains your verdict. While it imports a method (surveys), it often fails to provide an *enduring structure* that demonstrably *alters how core philosophical problems are engaged with*. It primarily supplies *empirical data about intuitions* relevant to arguments often constructed by other means. It hasn't (yet?) restructured the *conceptual formulation* or *standards of argument* for problems like knowledge or reference in a way comparable to Gettier or formal logic. It's a new instrument *for* existing structures, not a new structure itself.
  6.  **Formal Epistemology (Progress):** *Motivates Alters Engagement.* This is the crucial contrast with (5). Formal Epistemology (prob/dec theory) provides *enduring structures* (Bayesian models, decision matrices, coherence constraints) that *fundamentally alter engagement* with core problems of belief, justification, knowledge, and rationality. It changes the standards: arguments must grapple with probabilistic coherence, Dutch books, or expected utility calculations. It restructures how the problems are conceptualized and argued about.

  **Resolving the 5/6 Tension:** PSP clarifies your intuition. Both import methods, but Formal Epistemology provides *structures that transform philosophical engagement* with core problems (probabilistic coherence becomes a *philosophical standard* for rationality). Experimental Philosophy, as typically practiced, provides *data inputs* for arguments structured by pre-existing (often armchair) philosophical methods and concepts. It changes the *evidence base* but not necessarily the *structure of the argumentation* or the *conceptual framework* defining the problem.

  **Predictions for New Cases:**

  *   **Computational Philosophy (e.g., formal models in metaphysics/social philosophy):** **Likely Progress** *if* the computational models provide genuinely new conceptual distinctions, reveal unforeseen complexities, or set new standards for coherence/plausibility that alter how philosophers engage with the core problem (e.g., modeling emergence, social dynamics). Mere number-crunching without conceptual restructuring wouldn't count.
  *   **Application of Decision Theory to Ethics (e.g., rational choice models in metaethics/normative ethics):** **Progress.** This provides an *enduring structure* (maximization, utility functions, game-theoretic equilibria) that demonstrably *alters engagement* with core problems of value, obligation, and practical reason. It forces engagement with concepts like preference coherence, strategic interaction, and the foundations of value in a new way.
  *   **Analytic Revival of Metaphysics (e.g., post-Quine):** **Progress.** It provided new *structures* (focus on ontological commitment, linguistic analysis applied to metaphysical claims, possible worlds semantics) that *fundamentally altered engagement* with core metaphysical problems, revitalizing the field by changing the terms of debate and standards of argument (e.g., demanding clarity about quantifiers and modality).

  **Honest Conflict: Kant (Case 4) and the "Drama" Concern**

  *   **The Challenge:** Your worry is that your "progress" verdict on Kant might be swayed by narrative ("drama") rather than genuine structural advance.
  *   **PSP's Handling:** PSP focuses squarely on the *enduring structure* Kant provided (transcendental framework, categories, synthetic a priori) and its demonstrable impact on *how* philosophy was done after him. The "drama" is a consequence of the profound structural shift. However, if you believe Kant's structure hasn't *enduringly* structured engagement with the problems *better* than Hume's (or just differently), or that its utility is overstated by the narrative, then PSP *would* force you to reconsider your verdict. PSP insists the progress must lie in the concrete, lasting structural contribution, not the story. If you drop Kant, it would be because you question the *enduring utility* or *transformative impact* of his specific structures on philosophical practice, not because of PSP itself. PSP *accommodates* your initial verdict based on the historical impact Kant demonstrably had.

  **Why PSP Works for Your Cases:**

  *   Captures the non-consensus progress of Gettier (enduring problem-structure).
  *   Captures the superseded-but-advance nature of Russell (enduring analytical structure).
  *   Resolves the tool-vs-progress ambivalence on Formal Logic by emphasizing its transformative impact on philosophical engagement (new standards of rigor/argument).
  *   Grounds the verdict on Kant in structural contribution, mitigating (though not eliminating) the "drama" concern.
  *   Explains the 5/6 distinction: Formal Epistemology provides structures transforming engagement; Experimental Philosophy (as standardly conceived) provides data without fundamentally restructuring the philosophical enterprise.
  *   Offers clear predictions for new cases based on enduring structural utility and transformative impact on core problem engagement.

  **In essence:** PSP defines philosophical progress as the creation of *enduring conceptual scaffolds* that reshape the terrain of philosophical inquiry itself. It prioritizes lasting impact on *how the game is played* over final answers, consensus, or simply borrowing methods from elsewhere. This seems to best systematize your concrete judgments.
