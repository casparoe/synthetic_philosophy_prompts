answer: |-
  Here is your Q&A sheet, ordered by potential damage to your thesis, phrased scholastically, with concise replies and vulnerability notes:

  **Q&A Sheet: Aquinas on Tyrannicide – Authority & Underdetermination**

  **Objection 1 (Highest Damage - Textual Undercutting):**  
  *"Distinguo:* While you argue Aquinas leaves the locus of authority unresolved *in se*, he explicitly addresses usurpers elsewhere (e.g., *ST* II-II Q42 A2 ad 3, Q64 A3, *In Rom.* 13). There, he affirms established superior authority (e.g., Emperor over a local usurper) or *ipso facto* loss of legitimacy due to injustice, implicitly locating authority to act *outside* the usurper himself. Doesn't this resolve the ambiguity you propose?"  

  *Reply (1 min 30 sec):*  
  "Concedo that Aquinas identifies superior *potestas* as a source of licit action against a lower usurper. *Sed contra:* This presupposes a functioning hierarchy *superior* to the usurper. The core ambiguity remains precisely when the usurper *is* the highest temporal authority (e.g., a king seized by a coup), or when no superior *potestas* exists or is willing to act. Aquinas does not explicitly grant such authority to e.g., nobles collectively, the *populus* as corporation, or inferior magistrates *in this specific vacuum*. His examples in *De Regno* warn against private action even then, leaving the public authority question unanswered *at the apex*."  
  *Soft Spot:* Relies heavily on Aquinas *not* explicitly extending principles to the supreme usurper scenario. Critics may argue the principle of resisting injustice (*ST* II-II Q42) combined with lost legitimacy *implies* authority reverts or resides elsewhere, even if unstated.

  **Objection 2 (High Damage - Framework Challenge):**  
  *"Distinguo:* Your thesis hinges on the 'public person' distinction doing 'the real work.' Yet Aquinas primarily deploys this distinction (*ST* II-II Q64 A3) concerning *punishment for crime* (e.g., executioner vs. murderer). Tyrannicide, especially of a usurper, may not fit neatly into the juridical category of 'punishment' but rather *resistance to unjust aggression* or *defense of the common good*. Doesn't collapsing it into 'punishment' distort his intent and obscure other relevant principles like defense (*ST* II-II Q64 A7)?"  

  *Reply (1 min 45 sec):*  
  "Concedo that defense is a principle. *Sed contra:* Aquinas specifically addresses killing *rulers* under the question of licit *punishment* (*ST* II-II Q64 A3), not defense. His *De Regno* argument against tyrannicide centers on the *consequences for the polity*, a public-order concern, not private defense. Further, defense (*Q64 A7*) justifies killing an *unjust aggressor*, but Aquinas carefully notes limits when the aggressor holds *public authority* (cf. *Quaestio Disputata de Malo* Q3 A1 ad 17). The 'public person' framework is his explicit lens for ruler-killing. Resistance against a usurper *as usurper* inherently involves a claim about licit public authority to judge and act."  
  *Soft Spot:* Requires reading the *De Regno* danger argument and the *ST* public person argument as intrinsically linked under "public order," which Aquinas strongly implies but doesn't *explicitly* systematize together.

  **Objection 3 (Medium Damage - Internal Coherence):**  
  *"Distinguo:* You present *De Regno* (danger, not praiseworthy) and *ST* (public/private) as complementary. However, *De Regno*'s pragmatic caution seems rooted in prudence about likely outcomes, irrespective of the killer's formal status. Doesn't this suggest Aquinas's primary concern is consequence (stability), potentially overriding or qualifying the formal 'public authority' requirement in extreme cases, especially against a usurper who *lacks* legitimate authority *ab initio*?"  

  *Reply (1 min 30 sec):*  
  "Concedo that prudence weighs heavily in *De Regno*. *Sed contra:* Aquinas doesn't frame the danger argument as *overriding* the public/private distinction; he presents it as a *reason why* private action is illicit and imprudent. His caution stems precisely *because* private individuals lack the authority to ensure a stable succession (*De Regno* I, 6). The danger argument reinforces the *need* for public authority to act, it doesn't provide an exception for private actors based on desperation. The formal requirement stands, even if prudence dictates *how* and *when* public authority should exercise it."  
  *Soft Spot:* Aquinas doesn't explicitly say the danger argument *only* applies to private actors. A critic could argue it applies universally, making *any* tyrannicide suspect regardless of source, softening the public/private distinction's exclusivity.

  **Objection 4 (Lower Damage - Reception Challenge):**  
  *"Distinguo:* Later theorists (e.g., Suarez, *Defensio Fidei* III.II.4-6, Bellarmine, *De Laicis* c.6) explicitly base resistance doctrines on Aquinas's principles of natural law, the common good's supremacy, and the *populus* as the font of authority (*De Regno* I, 1, 6). Doesn't this demonstrate that Aquinas's framework, even if underdetermined on the *locus*, logically contains the seeds for their development, making your 'underdetermined' point merely historical, not a flaw in their interpretation?"  

  *Reply (1 min):*  
  "Concedo that Aquinas provides principles *used* by later thinkers. *Sed contra:* My thesis isn't that they misread *principles*, but that they resolve Aquinas's specific *ambiguity* on the *locus* of acting authority against a supreme usurper in ways he himself did not articulate or necessarily imply. Suarez/Bellarmine *develop* his thought by explicitly locating authority in the *populus* or inferior magistrates *in this vacuum*. Aquinas's texts *allow* this development but do not *contain* it explicitly. The later claims to his *direct* authority for *their specific mechanisms* are overreads. He provides the foundation, not the blueprint they needed."  
  *Soft Spot:* Strong reply. Softness lies only if the critic insists Aquinas's principles *necessarily entail* the later developments, which is debatable but requires deeper meta-ethical argument.

  **Objection 5 (The Feared One - Originality Challenge):**  
  *"Distinguo:* Your core argument – that Aquinas forbids private tyrannicide, permits public authority, but leaves the latter ambiguous for usurpers – seems essentially the *communis opinio* among serious Thomists (e.g., Finnis, Budziszewski, commentaries on *ST* II-II Q64). Isn't presenting this as a novel thesis simply dressing up standard exegesis?"  

  *Reply (1 min 15 sec):*  
  "Concedo the broad contours (private bad, public good) are recognized. *Sed contra:* The standard reading often *stops* there or *assumes* Aquinas implies solutions (e.g., to the people). My thesis *emphasizes and centers* the *constitutive ambiguity* at the precise point of the supreme usurper as the *key* to understanding the later polemics. It's not just that he *says* public authority must act, but that he *leaves radically open* who constitutes that authority in the hardest case. This specific focus on the *underdetermination as explanatory* for reception history, and arguing it's neither quietism nor explicit resistance theory, is the novel synthesis. The damage isn't in the distinction itself, but in its unresolved application."  
  *Soft Spot:* Requires convincing the audience that highlighting this *specific* ambiguity *as the central explanatory factor* for reception history, and distinguishing it clearly from both quietism and resistance theory, constitutes a sufficiently novel contribution beyond standard summaries. Be prepared to cite commentators who *don't* emphasize this ambiguity's consequences.

