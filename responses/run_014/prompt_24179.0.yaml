     We can assume that the trade is conducted in the currency of the exporting country. So when North exports wool, the price is the North's price of wool (1.2), and when South exports wine, the price is the South's price of wine (2.8).

     Then for the trade in Round 2:

          North exports 4 wool at 1.2 = 4.8 gold.
          North imports 8 wine at 2.8 = 22.4 gold.
          So deficit = 22.4 - 4.8 = 17.6 gold.

          South exports 8 wine at 2.8 = 22.4 gold.
          South imports 4 wool at 1.2 = 4.8 gold.
          So surplus = 22.4 - 4.8 = 17.6 gold.

          North sends 17.6 gold to South.

     Then after Round 2:
          North gold: 12 - 17.6 = -5.6 -> negative? That won't work.

     We see that the deficit is larger in round 2 because of the price change.

     This is the opposite of the adjustment we want.

     We want the deficit to shrink because the North's exports become cheaper and the South's exports become more expensive.

     In this setup, the North's exports are cheaper, so they earn less, and the imports are more expensive, so they spend more -> larger deficit.

     So this is not the standard Hume mechanism.

     **Hume mechanism relies on the idea that in the deficit country, the money supply falls, causing deflation, which makes its exports cheaper and imports more expensive in real terms, but in our setup, we have the price level falling in the deficit country, which should make its exports cheaper to the foreigner, hence more competitive, and imports more expensive to its domestic consumers, hence reducing import demand.**

     In our setup for Round 2, the North's exports (wool) are indeed cheaper (1.2 instead of 2) to the South, which should increase the South's demand for wool. Similarly, the South's exports (wine) are more expensive (2.8 instead of 2) to the North, which should reduce the North's demand for wine.

     So we should allow the quantities to change in response to the prices.

     Therefore, in Round 2 and onward, we should let the students decide how much to trade. We will assign a utility function to each nation that depends on consumption of both goods, and they have to maximize utility given their income and the prices.

     Let's use the Cobb-Douglas utility to ensure that they will respond to prices.

     For North: utility from consumption of wool (x) and wine (y): U = x^0.5 * y^0.5.
     For South: same.

     Then, as before, the demand will be:
          in North: x = (0.5 * I) / P_wool_in_North, y = (0.5 * I) / P_wine_in_North.
     but wait, in our setup, the price of wool in North is the local price (1.2) and the price of wine in North is the local price (1.2) in Round 2? 
     But earlier we said the price of wine in North should be the South's export price? 

     Here is the inconsistency.

     To resolve, let's assume that there is a single world price for each good, and it is set by the exporting country's local price. Then when imported, the price in the importing country is the world price.

     But then the local price level in the importing country for imported goods is the world price, which is set by the exporting country's money supply.

     This is very complicated for a 75-minute game.

     Given the time, I suggest we simulate the standard Hume mechanism by fiat for the first few rounds and then in later rounds allow the students to see the price change and let them adjust their trade quantities.

     Here is the detailed plan:

     **Setup:**
     - Two nations: North and South.
     - Each starts with 20 gold.
     - Each has a production capacity of 10 units of their good per round.
     - Preferences: Each nation's consumers (collectively) get utility from both goods. We won't specify a utility function to the students, but we will tell them that they should try to buy as much as they can of both goods, but they are to negotiate trade deals with the other nation.

     **Round 1 and 2:**
     - The instructor forces a specific trade pattern to create an initial imbalance.
     - Trade rules for Round 1 and 2: 
          - The price of both goods is fixed at 2 gold per unit.
          - North must import exactly 6 units of wine from South.
          - South must import exactly 4 units of wool from North.
          - This means:
               North's exports: 4 wool * 2 = 8 gold.
               North's imports: 6 wine * 2 = 12 gold.
               Deficit = 4 gold, which North pays to South.
          - After Round 1: 
               North gold: 20 - 4 = 16
               South gold: 20 + 4 = 24

     - Round 2: same forced trade:
          North exports 4 wool, imports 6 wine -> deficit 4 gold again.
          North gold: 16 - 4 = 12
          South gold: 24 + 4 = 28

     - After Round 2, we stop and announce new prices:
          In each country, the price level is proportional to the gold stock.
          Specifically, price = (current gold stock / initial gold stock) * initial price.
          So for both goods in North: price = (12/20)*2 = 1.2 gold
          In South: price = (28/20)*2 = 2.8 gold

     - We then explain that in the next rounds, the trade is not forced. Each nation can negotiate how much they want to export and import, but:
          - The price of a good in a transaction is the price in the exporting country.
          - So if North exports wool to South, the price is 1.2 gold.
          - If South exports wine to North, the price is 2.8 gold.

     - In Round 3 and 4, let the students in each nation caucus to decide:
          - How much wine they want to import (for North) and how much wool they want to import ( for South), and similarly for exports.
          - catch: they cannot import more than the other nation is willing to export.

     - We will have a very simple trading: each nation announces how much they are willing to export of their good, and then the importing nation can choose to buy up to that amount.

     - For Round 3:
          North can export up to 10 wool at 1.2 gold per unit.
          South can export up to 10 wine at 2.8 gold per unit.

          Then South decides how much wool to import (i.e., how much to buy from North) up to 10.
          North decides how much wine to import up to 10.

          The trade happens at the announced prices.

          Then we calculate the trade balance and gold flow.

     - We hope that because wine is now expensive for North, they will import less, and because wool is cheap for South, they will import more.

     - Example outcome for Round 3:
          South, seeing wool is cheap at 1.2, might import 8 wool.
                  payment to North: 8 * 1.2 = 9.6 gold.
          North, seeing wine is expensive at 2.8, might import only 3  wine.
                  payment to South: 3 * 2.8 = 8.4 gold.
          Then North has a surplus of 9.6 - 8.4 = 1.2 gold.

          So South pays 9.6 gold to North for wool, and North pays 8.4 gold to South for wine. The net payment is that South sends 1.2 gold to North.

     - Then update gold and prices for Round 4.

     ** Where to freeze and ask "what just happened?": **
     - After Round 2, when you announce the new prices, and then after Round 3 when the trade imbalance reverses, you can freeze and ask.

     ** The script: **

     - Introduction: Explain the setup, two nations, gold, production.
     - Round 1: 
          Announce: "For this round, the price of wine and wool is 2 gold per unit. 
                     North, you must import 6 units of wine from South. 
                     South, you must import 4 units of wool from North."
          Have them calculate the trade balance and gold flow.
          North ships 4 gold to South.
          Update gold stocks publicly.
     - Round 2: 
          Same as Round 1.
          North ships 4 gold to South.
          Update gold stocks: North 12, South 28.
     - Announce new prices for Round 3: 
          In North: both goods now 1.2 gold.
          In South: both goods now 2.8 gold.
          Explain that for trade, the price of an exported good is the price in the exporting country.
     - Round 3:
          Let the students in each nation caucus for 5 minutes to decide:
              - How much of their own good they are willing to export (up to 10 units).
              - How much of the other good they would like to import.
          Then have the nations report:
              North announces: we will export X wool (at 1.2 gold per unit) and we want to import Y wine (at 2.8 gold per unit).
              South announces: we will export Z wine (at 2.8 gold per unit) and we want to import W wool (at 1.2 gold per unit).
          The actual trade is limited by the export offers:
              Actual wool exported by North = min(X, W)  [because South only wants W and might offer to buy more than North is willing to sell, but North's export offer is X]
              Actual wine exported by South = min(Z, Y)  [because North only wants Y]
          Then calculate the value of exports and imports for each country.
          North's export value = (actual wool exported) * 1.2
          North's import value = (actual wine imported) * 2.8
          South's export value = (actual wine exported) * 2.8
          South's import value = (actual wool imported) * 1.2
          Then net gold flow: for North, if export value > import value, then they receive the difference from South. If import value > export value, they ship the difference to South.
          Update gold stocks.
     - Round 4: same as Round 3, with updated prices based on the new gold stocks.

     ** When to freeze: **
     - After Round 3, when the trade balance has moved towards surplus for the previously deficit nation (North), freeze and ask:
          "What just happened in this round? Why did the trade balance change?"

     ** debrief: **
     - Phase 1: rounds 1 and 2 show that a series of trade deficits lead to gold outflows.
     - Phase 2: the gold outflow in the deficit country (North) causes deflation (prices fall), while the inflow in the surplus country (South) causes inflation.
     - Phase 3: the change in prices makes the deficit country's exports cheaper and more attractive to the surplus country, and its imports more expensive, so the trade balance corrects.

     ** What will go wrong: **
     - Students might not reduce their import demand in Round 3 because they don't understand the prices or they might think they can afford it.
     - The caucus might take too long.
     - In Round 3, the South might not increase their imports of wool because they see they are losing gold.

     To mitigate: 
     - Explain clearly that the prices have changed and that they should think about how many units they can afford given their gold stock and the prices.
     - Encourage them to calculate their income (from exports) and then see what they can buy with it.

     ** What the game can't show: **
     - The part where Hume thinks the money inflow is bad for the country's manufactures and wages in the long run because of inflation. The game shows the correction in the trade balance, but not the potential harm to the real economy. You will have to lecture about that.

     Let me know if you have any adjustments.
