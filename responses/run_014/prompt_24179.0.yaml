  ### **Classroom Game: Price-Specie Flow Mechanism**

  #### **Learning Goals**
  - Illustrate David Hume's **price-specie flow mechanism** through emergent gameplay.
  - Show how trade deficits/surpluses trigger gold flows, altering prices and self-correcting trade imbalances.
  - Debunk mercantilist belief that perpetual trade surpluses are sustainable.

  ---

  ### **Game Setup**
  - **Players**: Split 25 students into **North** (12–13 students) and **South** (12–13 students).  
  - **Materials**:  
    - **Gold**: 40 counters (e.g., yellow chips).  
    - **Goods**:  
      - North: 20 wool tokens (paper slips/beads).  
      - South: 20 wine tokens (paper slips/beads).  
    - **Price Boards**: Two whiteboards (one per nation) displaying local prices.  
  - **Initial Conditions**:  
    - **Gold**: Each nation starts with 20 gold counters.  
    - **Goods**: Each nation starts with 10 units of their domestic good.  
    - **Prices**:  
      - North: Wool = 2 gold, Wine (imported) = 2 gold.  
      - South: Wine = 2 gold, Wool (imported) = 2 gold.  

  ---

  ### **Rules & Rounds (75 Minutes Total)**  
  **Key Mechanic**: Prices in each nation adjust based on gold stock. Trade deficits force gold transfers, altering prices and demand.  

  #### **Round 1–2: Forced Trade (20 minutes)**  
  - **Instructions**:  
    > *"Trade is fixed for Rounds 1–2. North must buy 6 wine from South. South must buy 4 wool from North. Prices are fixed at 2 gold per unit."*  
  - **Trade Execution**:  
    - **North**: Exports 4 wool to South, imports 6 wine from South.  
    - **South**: Exports 6 wine to North, imports 4 wool from North.  
  - **Deficit Calculation**:  
    - North’s deficit: `(6 wine × 2 gold) - (4 wool × 2 gold) = 4 gold`.  
    - North ships 4 gold to South.  
  - **Update Gold**:  
    - *End Round 1*: North = 16 gold, South = 24 gold.  
    - *Repeat for Round 2*: Same trade → North gold = 12, South gold = 28.  

  #### **Round 3: Price Shift & Emergent Trade (20 minutes)**  
  - **Update Prices**:  
    - **Formula**: `New Price = (Current Gold / Initial Gold) × Initial Price`.  
    - North: `(12/20) × 2 = 1.2 gold` for **all goods** (deflation).  
    - South: `(28/20) × 2 = 2.8 gold` for **all goods** (inflation).  
  - **Negotiated Trade (Student-Driven)**:  
    - Groups caucus for 5 mins to decide:  
      - *Exports*: How much of their good to sell (max 10 units).  
      - *Imports*: How much of the other good to buy.  
    - **Trade Rule**: Transactions use the **exporter’s price**.  
      - Wool exports from North: 1.2 gold/unit.  
      - Wine exports from South: 2.8 gold/unit.  
  - **Trade Execution**:  
    - Nations announce export offers and import bids.  
    - Trade volume = min(export offer, import bid).  
    - **Example Outcome**:  
      - South imports 8 wool (cost: `8 × 1.2 = 9.6 gold`).  
      - North imports 3 wine (cost: `3 × 2.8 = 8.4 gold`).  
      - North’s surplus: `9.6 - 8.4 = 1.2 gold` (South pays North).  
  - **Update Gold**:  
    - North: `12 + 1.2 = 13.2 gold`.  
    - South: `28 - 1.2 = 26.8 gold`.  

  #### **FREEZE & REFLECT (5 minutes)**  
  > **Pause after Round 3 and ask**:  
  > *"What just happened? Why did North’s trade balance improve? What role did gold flows and prices play?"*  
  > **Let students articulate**:  
  > - North’s prices fell → its exports became cheaper for South.  
  > - South’s prices rose → its exports became expensive for North.  
  > - Trade imbalance self-corrected.  

  #### **Round 4: Consolidation (10 minutes)**  
  - **Update Prices**:  
    - North: `(13.2/20) × 2 = 1.32 gold`.  
    - South: `(26.8/20) × 2 = 2.68 gold`.  
  - **Repeat Negotiated Trade** (same as Round 3).  
  - **Likely Outcome**: Trade further rebalances (e.g., North’s surplus grows).  

  ---

  ### **Debrief (20 minutes)**  
  Map gameplay to Hume’s mechanism:  

  | **Game Phase**          | **Hume’s Mechanism**                          | **Mercantilist Flaw**                              |
  |-------------------------|-----------------------------------------------|----------------------------------------------------|
  | Rounds 1–2: Forced trade | Persistent deficit → gold outflow.            | Mercantilists seek perpetual surplus.             |
  | Round 3: Price shift    | Gold loss → deflation; gold gain → inflation. | Surplus causes inflation, hurting competitiveness. |
  | Round 3–4: Trade shift  | Deficit nation’s exports ↑; imports ↓.        | Hoarding gold undermines real economic strength.  |

  **Key Insights**:  
  1. Gold flows alter **relative prices**, not just wealth.  
  2. **Self-correction is inevitable**: Surpluses inflate prices, deficits deflate them.  
  3. **Mercantilism’s error**: Treating gold as a scoreboard ignores price effects.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem 1: Students hoard gold** ("gold as a scoreboard").  
    - **Fix**: Announce *before Round 3*: *"Your goal is to maximize consumption, not gold. Gold is a tool, not a prize."*  
  - **Problem 2: Complex price calculations**.  
    - **Fix**: Assign a "treasurer" per team to track gold/prices. Use calculators.  
  - **Problem 3: Trade stalemate** (e.g., no one imports).  
    - **Fix**: Incentivize trade: *"Unconsumed goods spoil! Export to earn gold for imports."*  

  ---

  ### **What the Game Can’t Show**  
  1. **Real-wage and manufacturing decline** in surplus countries (Hume’s focus):  
     - Inflation in gold-rich nations raises production costs, hurting exports and wages.  
     - **Solution**: Lecture supplement post-game:  
       > *"Hume argued inflation in surplus nations makes their goods uncompetitive, leading to job losses and manufacturing decline. Gold inflows are a mixed blessing."*  

  2. **Long-term dynamics**:  
     - The game simplifies price adjustments. Real-world lags and non-traded goods complicate the mechanism.  
     - **Solution**: Use the game as a jumping-off point for discussing real-world nuances.  

  ---

  ### **Why This Works**  
  - Students **feel** the mechanism: Gold flows → price shifts → behavioral change.  
  - Minimal prep: Tokens, whiteboards, and calculators suffice.  
  - Emergent learning: The "aha!" moment in Round 3 solidifies Hume’s theory better than a lecture.  

  > **Final Tip**: Run the game early in your seminar. It primes students for deeper textual analysis of Hume, Mun, and Smith.
