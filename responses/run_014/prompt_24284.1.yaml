     - Knowability principle: translates cleanly, but its status in arithmetic is complex and not axiomatizable by GL.
     - Fitch formula: translates cleanly.
     - Key step: breaks because of the absence of T in GL, which is due to Gödel's second incompleteness theorem.

     The Fitch paradox is not just Löb's theorem in disguise. Löb's theorem is about the conditions under which a system can prove its own soundness for a particular sentence. The Fitch paradox uses factivity as a universal principle.

     The semantic unknowability of the Fitch formula in the epistemic setting (it cannot be known because if it were known, it would be false) is mirrored in the provability setting by the unprovability of the Fitch formula. But the unprovability is not a contradiction; it is expected.

     The difference is not a defect of the provability vocabulary but a sign that the epistemic paradox relies on a principle (factivity) that is not internal to the provability predicate.

