          Now, ¬□⊥ is the consistency statement. So ¬□¬□⊥ is the statement that the consistency of T is not provable? Actually, □¬□⊥ is the statement that T proves the consistency of T. So ¬□¬□⊥ is the statement that T does not prove that T proves its own consistency? 

          But note: in arithmetic, if T is consistent, then □⊥ is false, so ¬□⊥ is true. But T does not prove ¬□⊥. So ¬□¬□⊥ is true? Because □¬□⊥ would mean that T proves ¬□⊥, which it doesn't. 

          Therefore, ◇□⊥ is true? But we have q → ◇□⊥, which is true in the standard model if q is true? But that doesn't lead to a contradiction.

          So the conclusion in the provability setting is: if there is a true but unprovable sentence p, then it is not provable that the inconsistency of T is provable? That is, ¬□¬□⊥ is true. But that is always true if T is consistent.

     Therefore, the Fitch argument does not yield a contradiction in the provability setting.

     The difference: in the epistemic case, we had factivity (T) which allowed us to derive a contradiction from □q. In the provability case, we don't have factivity, so we only get that □q implies □⊥, which is not a contradiction.

     Now, to the residue:

     - Knowability principle: 
          Epistemic: p → ◇□p.
          Provability: p → ¬□¬□p.
          It translates cleanly, but note that in the provability setting, the truth of this formula for a particular p depends on the arithmetical properties of p. It is not a theorem of GL, but it may hold for some realizations.

     - Fitch formula: 
          Epistemic: p ∧ ¬□p.
          Provability: p ∧ ¬□p.
          It translates cleanly.

     - Key step: 
          In the epistemic case, we used T: □A → A to get from □¬□p to ¬□p.
          In the provability case, we cannot do that. The analogue would be to use □A → A, which is not available because of incompleteness.

     The T axiom is not a theorem of GL because if it were, then we would have □⊥ → ⊥, which is the consistency statement, and that is not provable.

     The Fitch paradox is not just Löb's theorem in epistemic clothing. Löb's theorem is a theorem of GL that helps us understand the limitations of provability. The Fitch argument uses factivity, which is not available in the provability setting. The epistemic content (that knowledge is factive) is essential and does not translate to provability.

     The epistemic paradox relies on the fact that knowledge is veridical: what is known is true. In the provability setting, we have only that if something is provable then it is true (in the standard model) only if the system is sound. But the system cannot prove its own soundness (for all sentences). So the key difference is the availability of factivity as a logical axiom.

     The residue is that the epistemic notion of knowledge includes factivity, which is not part of the provability notion. Therefore, the paradox does not transfer.

     Your intuition that the paradox is a modal-logic instance of Löb and incompleteness is partly right in that the absence of T (due to incompleteness) blocks the paradox. But the epistemic paradox is not directly about provability; it is about knowledge, which includes factivity. The provability interpretation shows that without factivity (which is not justifiable for provability), the argument fails.

     The epistemic content survives in the sense that the paradox depends on the factivity of knowledge, which is not present in provability. Therefore, the provability vocabulary cannot express the core of the paradox.

     However, note that in the provability setting, we do have a form of factivity for the standard model: if T proves p, then p is true in the standard model. But this is a metatheoretical fact. The system itself cannot prove □A → A for all A. So the difference is between external and internal factivity.

     The Fitch paradox is internal: it uses the T axiom as an internal logical principle. The provability interpretation does not have that internally.

     Therefore, the residue is the factivity of knowledge, which is a genuine epistemic concept that does not translate to provability without causing inconsistency (via the second incompleteness theorem).

