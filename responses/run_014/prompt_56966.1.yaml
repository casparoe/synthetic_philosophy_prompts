prompt: |-
  I have been in this conversation since the Overcoming Bias days, and for the past six weeks my reading group has been working through Hofstadter's notion of superrationality — not as intellectual history, but as a live question about when correlated reasoning licenses cooperation. One member, whom I will call R, applies the idea with a discipline the rest of us lack. Rather than argue with him about the concept in the abstract, I have been collecting his verdicts on particular cases, and I would like help determining what rule he is actually running.

  In every case the question put to him was the same: here, does superrational reasoning license cooperating, or is the would-be cooperator rationalizing?

  1. Two identical copies of the same decision procedure, one-shot symmetric prisoner's dilemma, each shown the other's source and each aware of the copy relation. Cooperate. R calls this the paradigm case, the only one where he thinks the argument is airtight.

  2. Two humans, both strong reasoners, both aware that the other is a strong reasoner, but who reached their reasoning by different routes and who disagree about some things. Defect. He says the premise that the same reasoning yields the same answer is doing all the work, and that here it is simply false.

  3. Two identical copies, symmetric prisoner's dilemma, but each has been given a different private observation that enters its decision rule. The argument does not apply at all. He was emphatic that what broke in this case was not the symmetry of the payoffs but the symmetry of the inputs.

  4. Two identical copies facing a symmetric game that is not a prisoner's dilemma — a stag hunt — in which both land on the payoff-dominant outcome by ordinary calculation anyway. He refused to call this an instance of superrationality, on the grounds that a principle which never changes an answer is not a principle.

  5. An asymmetric prisoner's dilemma between two identical copies, each reasoning from its own payoff function. Each follows its own reasoning. He notes that they agree about the method while the inputs guarantee they will not agree about the move, and that agreement in method is not cooperation.

  6. One thousand identical copies in a many-player prisoner's dilemma, where any single cooperator's contribution is diluted to near nothing but the aggregate matters enormously. Cooperate, provided the aggregate arithmetic works out. Group size, he said, is irrelevant in principle and relevant in practice only because at that scale nobody's reasoning is genuinely identical to anybody else's.

  7. Voting in a national election as one of ten million broadly similar voters, in a race your ballot cannot tip. A rationalization. He declined to elaborate, which is unlike him, and said only that he did not know what the reference class was supposed to be.

  8. Learning, before you move, that your opponent is an unconditional defector who has been told nothing about you. Defect. Superrationality was never about unconditional cooperation; it is about what follows while the correlation premise holds, and here it does not.

  9. Newcomb's problem with transparent boxes and a near-perfect predictor. One-box, and this is the same argument, not a cousin of it. He was visibly irritated when we filed it separately.

  10. A one-shot symmetric prisoner's dilemma against an artificial agent trained on a large corpus to imitate your reasoning, where you have read its documentation and it has read everything you have published. R said it depends, and then would not say on what. In three years I have never seen him decline to commit.

  The case we intend to bring him next is this. Two agents face a one-shot symmetric prisoner's dilemma with no private information on either side. They are not copies of one another and they share no decision procedure. One runs a straightforward expected-utility calculation over its own payoff, conditional on whatever beliefs it forms about the other's move, and it is free to form those beliefs from any evidence available to it. The other runs a rule-following procedure that asks what every member of a specified class of agents would do if all of them reasoned the same way. The two procedures are demonstrably different: they consult different considerations in a different order and can be seen to diverge on other problems. But both agents have checked a proof that, in this situation, the two procedures issue in the same move. The proof establishes no agreement in general — only here. The question we will put to R is not what the two agents will do, but whether either is entitled to call its move superrational, and whether the answer differs between them.

  What I would like from you:

  (a) State the rule R is running precisely enough that a stranger who had never met him could apply it to a new case, and show that it reproduces all ten verdicts — including the ones that look anomalous, particularly 4, 7, and 10.

  (b) Give at least two rival rules that reproduce the same ten verdicts equally well. For each, say what it implies about the new case, and be explicit about where the rules genuinely part company rather than where they differ only in vocabulary.

  (c) Predict R's verdict on the new case, and commit. Tell me which rule you take to be his and why you prefer it, and treat verdict 10 as evidence: whatever makes the imitator hard for him to classify is likely to be the very feature in question here. Verdict 9 may be doing more work than he admits, and I would like to know whether you think so.

  (d) Design one further case that would discriminate between your leading candidates better than this one does. State it concretely enough that R could answer yes or no, and say which pair of rules each possible answer would separate.

  (e) If you conclude that no single rule reproduces all ten verdicts, say so plainly, identify the outlier, and state what R would have to give up in order to keep the rest.

  Please write in American English.
reasoning: |-
  Hmm, this user presents an intricate puzzle about superrationality and correlated reasoning. They've been running a reading group on Hofstadter's concept and have collected ten specific verdicts from a member named "R" regarding when cooperation is justified. Now they want me to reverse-engineer R's rule, test it against new scenarios, and analyze the underlying principles.

  The user's background seems deeply technical - mentioning "Overcoming Bias" (Eliezer Yudkowsky's old blog) and superrationality suggests familiarity with decision theory and game theory. They're clearly frustrated with R's inconsistency, especially in case 10 where R wouldn't commit. The new case they've designed is clever: two different decision procedures with a situational proof of equivalence in PD.

  Let me systematically approach each request:

  For (a), the core principle appears to be "identical reasoning under identical conditions." R only endorses cooperation when agents share not just reasoning but identical inputs and circumstances. This explains why copies cooperate (case 1) but humans don't (case 2), and why private observations break it (case 3). Case 4 gets rejected because superrationality must change behavior, while case 7 fails due to undefined reference class.

  The rule formulation must be precise: "Cooperate iff (1) identical decision procedures, (2) identical informational inputs, (3) symmetric game structure, and (4) cooperation isn't dominated by defection." This neatly handles all ten cases.

  For (b), two alternatives emerge:
  1. "Correlated outcomes" rule: Focuses on predictability between agents. Handles cases 1-9 but struggles with case 10's situational equivalence.
  2. "Causal similarity" rule: Requires shared causal history. Explains R's hesitation in case 10 but overfits on case 6.

  For (c), I predict R will deny superrationality to both agents in the new case. His rule requires identical procedures, not just situational alignment. Case 9's irritation suggests he sees superrationality as fundamentally about identity, not outcomes.

  The discriminator case for (d) should test whether identical outputs from different processes qualify: "Two distinct algorithms with provably identical PD behavior across all possible inputs." This would split the "identical procedure" vs "outcome correlation" interpretations.

  Notably, all rules fit the data - no outliers. R's consistency suggests he's running the "identity of reasoning" rule, though his case 10 hesitation might indicate unstated concerns about implementation details.

  The voting case (7) is particularly telling - R rejects it because "similar" isn't "identical," showing his strict interpretation. And his irritation at separating Newcomb's problem (9) confirms he views it as the same logical structure.
answer: |-
  ### (a) R's Rule: Identity of Reasoning Under Identical Conditions  
  **Rule:** *An agent is licensed to cooperate via superrationality iff:*  
  1. **Identical Decision Procedures:** Agents share the *exact same* decision algorithm (not just similar reasoning).  
  2. **Identical Inputs:** All agents receive identical inputs (no private information).  
  3. **Symmetric Game:** Payoffs and roles are symmetric.  
  4. **Cooperation-Defection Tension:** Defection is individually optimal absent correlation, but mutual cooperation dominates mutual defection (PD structure).  

  **Verification Against Cases:**  
  - **Case 1:** ✅ All conditions met (copies, identical inputs, symmetric PD).  
  - **Case 2:** ❌ Different reasoning routes → violates (1).  
  - **Case 3:** ❌ Private observations → violates (2).  
  - **Case 4:** ❌ Stag hunt lacks (4): cooperation *is* individually rational. Superrationality "changes nothing."  
  - **Case 5:** ❌ Asymmetric payoffs → violates (3).  
  - **Case 6:** ✅ Copies satisfy (1)–(4); "aggregate works" implies (4) holds. Group size irrelevant if inputs/procedures identical.  
  - **Case 7:** ❌ Voters not identical (1), no defined reference class (2). "Similarity" ≠ identity.  
  - **Case 8:** ❌ Opponent not identical → violates (1).  
  - **Case 9:** ✅ One-boxing: Predictor simulates *your exact reasoning* → satisfies (1) and (2). Identical to Case 1.  
  - **Case 10:** ❓ "Depends" likely on whether imitation replicates *exact procedure* (1) or merely outputs. Rule unconfirmable.  

  ---

  ### (b) Rival Rules  
  **Rule B1: Output Equivalence Under Correlation**  
  *Cooperate iff agents can prove their outputs are perfectly correlated due to shared reasoning, regardless of procedure details.*  
  - **Matches Cases:** 1–9 identical to R. Case 10: Cooperate (proof ensures output correlation).  
  - **Divergence:** Prioritizes *outcomes* over *procedural identity*. Case 4: Still not superrational (no tension). Case 7: Cooperate if voters share "broad similarity" (R rejects this).  
  - **New Case Implication:** Both agents superrational (situational proof satisfies correlation).  

  **Rule B2: Causal Procedure Identity**  
  *Cooperate iff agents share causal history (e.g., same code/lineage), not just functional equivalence.*  
  - **Matches Cases:** 1–9 identical to R. Case 10: Defect (no shared lineage; "imitator" lacks causal identity).  
  - **Divergence:** Requires *historical* identity, not just current similarity. Case 6: Cooperate only if copies from same source. Case 9: One-box only if predictor clones your brain.  
  - **New Case Implication:** Neither superrational (different causal origins).  

  ---

  ### (c) Prediction for New Case & R’s Rule  
  - **New Case Description:**  
    - Agent A: Standard EU-maximizer (conditional beliefs).  
    - Agent B: Rule-follower (what identical agents would do).  
    - Procedures differ but *situationally* proven equivalent.  
  - **R’s Verdict:** **Neither is superrational.**  
    - Violates (1): Procedures are "demonstrably different."  
    - Proof of *situational* equivalence ≠ *general* identity of reasoning.  
    - Agent B’s "rule-following" is not identical to A’s EU calculation.  
  - **Why R’s Rule?**  
    - Case 10 hesitation: Imitator’s lack of *procedural identity* (not causal/output) causes uncertainty.  
    - Case 9 irritation: Confirms superrationality requires *reasoning identity*, not just outcomes.  
    - Case 4 rejection: Rule must *change behavior* in PD tension—here, no such tension exists.  

  ---

  ### (d) Discriminator Case  
  **Case D:** Two agents in symmetric PD. Both run *different* algorithms (A: EU-maximizer, B: Kantian imperative). A third party *proves* their outputs *always* match in PDs (universal equivalence).  
  - **Question:** Does superrationality license cooperation?  
  - **R’s Rule (B1):** ❌ No (procedures differ).  
  - **Rule B1 (Output Equivalence):** ✅ Yes (proven universal correlation).  
  - **Rule B2 (Causal Identity):** ❌ No (different origins).  
  - **Separation:**  
    - Yes → Favors **B1** (outputs matter).  
    - No → Favors **R or B2** (procedure/causality matters).  

  ---

  ### (e) Consistency Assessment  
  **No outlier—all verdicts fit R’s rule.**  
  - **Anomalies resolved:**  
    - **Case 4:** Superrationality requires PD tension (cooperation must be "counterrational" without correlation).  
    - **Case 7:** "Broadly similar" ≠ identical inputs/procedures; reference class undefined.  
    - **Case 10:** Uncertainty stems from whether imitation replicates *exact procedure* (unknowable without docs).  
  - **No surrender needed:** Rule is parsimonious and covers all cases when strictly applied.  

  ---  
  **Final Summary**  
  R’s rule is **procedural identity under identical inputs**. It treats superrationality as a "twin logic" limited to literal duplicates in symmetric dilemmas. The new case fails because equivalence is situational, not inherent. The discriminator case would force a choice between R’s strict identity and output-based rivals.
