  Okay, let me tackle this user's question. They're a philosophy PhD student in ethics, prepping to teach a philosophy of physics seminar. They keep encountering an argument pattern and want to know if there's a general name for it. The core issue involves theories with multiple descriptions that differ in unobservable structure but agree on observables.

  First, I need to parse the user's examples. They mention spacetime relabeling (like a hole argument), quantum particle swapping, and Leibniz's shift. The user is confused because people keep naming specific instances instead of the general pattern. They also question if these cases are truly the same phenomenon.

  The user's explicit request is for a label, but their deeper concerns are more nuanced. They want to understand the underlying structure, differentiate between similar-seeming cases, and identify the philosophical implications. They're skeptical about whether the small-region spacetime case adds anything beyond the global examples.

  Hmm, the key elements here are: a theory's models, transformations that preserve observables but change unobservable structure, and the resulting metaphysical dilemma (indeterminism vs. anti-realism about the structure). 

  I recall that this is often called "gauge redundancy" in physics, but the user mentioned not following that part. Philosophically, it relates to "symmetry" and "redundancy." The hole argument (spacetime) and particle statistics in QM are both instances of gauge symmetries, but the user is right to question if they're identical. The hole argument involves diffeomorphism invariance, which is local, while particle permutation is global. That difference matters for determinism concerns.

  The Leibniz shift is global too, but simpler. The user’s intuition that the small-region case is distinct seems valid—it highlights locality issues in spacetime theories. The underdetermination point is different because it's within one theory, not between rival theories. The identical spheres puzzle is more about haecceitism than gauge symmetry.

  So, the general framework is about symmetry-induced redundancy leading to a choice: accept indeterminism or reject the underlying structure as unreal. The user needs clarity on why the cases differ: locality in spacetime vs. globality in QM permutations. The small-region example does work by showing how local symmetries threaten determinism, unlike global ones.

  Also, the user might be wrestling with the ontological implications—structural realism vs. eliminativism. They’re likely seeking a framework to present this coherently to students next year. Emphasizing the symmetry/redundancy connection and the metaphysical fork it creates would address their deeper need to systematize these arguments beyond isolated examples.
answer: |-
  Your frustration is completely understandable – you've hit upon one of the deepest and most pervasive conceptual structures in modern physics and its philosophy. The good news is that the "shape" **does** have a name and a coherent framework, but you're right to be suspicious when people just shout "[famous thing]!" without clarifying the underlying structure.

  ## The Core Structure: Symmetry-Induced Redundancy & Its Metaphysical Fork
  The general shape you describe is best understood as **the manifestation of a symmetry in a physical theory, leading to a redundancy in its mathematical description, which forces a metaphysical choice about the ontology of the underlying structure.**

  Here's the breakdown:

  1.  **Symmetry:** The theory possesses a transformation (e.g., relabeling spacetime points, swapping identical particles, translating the whole universe) that acts on its models.
  2.  **Observational Equivalence:** This symmetry transformation leaves *all physically observable quantities and relations* invariant. Nothing measurable changes.
  3.  **Descriptive Non-Equivalence:** Despite (2), the transformation produces a mathematically distinct description of the model. The underlying "scaffolding" (points, labels, individual identities) *is* different.
  4.  **The Fork:** This forces a choice:
      *   **Option A (Real Scaffolding):** If the scaffolding (points, particle identities, absolute positions) is real, then the theory is *indeterministic*. The initial state plus laws cannot uniquely determine the future state of the scaffolding, as multiple distinct configurations (related by the symmetry) are empirically indistinguishable future possibilities.
      *   **Option B (Anti-Realism about Scaffolding):** The scaffolding is not real, or at least, its individual components lack primitive identity. The two descriptions aren't describing two distinct physical possibilities; they are merely *different mathematical representations of the same single physical situation*. The apparent difference is "gauge" – a redundancy in our description, not in the world.

  ## The General Name: Gauge Freedom / Gauge Symmetry / Gauge Redundancy
  *   **Yes, "Gauge" is the overarching term.** While initially arising in electromagnetism (which is the case you didn't follow), the concept of "gauge freedom" has become the general framework in physics and philosophy of physics for understanding *any* situation where a theory possesses a symmetry that introduces redundancy into its mathematical description.
  *   **Why "Gauge"?** Historically, in electromagnetism, different choices of the vector potential (A_μ) related by specific transformations ("gauge transformations") describe the *same* electromagnetic field (F_μν). Choosing a specific A_μ is like choosing a "gauge" – a convention for describing something that isn't physically unique. The term generalized to cover all similar redundancies.
  *   **It's About Redundancy:** The core idea is that the theory's formalism contains more structure than is needed to describe the physical world. The symmetry transformation maps between different formal descriptions that correspond to the *same physical state*.

  ## Addressing Your Cases: Same Core, Different Flavors
  Your cases are absolutely instances of the *same core phenomenon* (gauge redundancy), but they manifest it in different ways with important nuances:

  1.  **Spacetime (Hole Argument - Your "Small Region"):**
      *   **Symmetry:** Diffeomorphism Invariance (smooth, invertible relabeling of spacetime points).
      *   **Redundancy:** Points of spacetime themselves, and the values of fields *at specific points*, are gauge-dependent.
      *   **Nuance:** The "small region" aspect is **crucial**. It's what creates the threat of *local indeterminism*. If you only transformed everything globally (Leibniz shift), determinism wouldn't be threatened for the scaffolding itself (though realism still would be). The Hole Argument specifically exploits the ability to make *local, arbitrary* changes within a region while fixing the outside. This forces the choice: either points have no independent reality ("No Primitive Identity" or "Metric Realism"), or GR is radically indeterministic about which point is which within the hole. **This is the canonical example illustrating the power of local gauge symmetry.**
      *   **Label:** Hole Argument (specifically), or Diffeomorphism Redundancy.

  2.  **Quantum Mechanics (Identical Particles):**
      *   **Symmetry:** Particle Permutation Symmetry.
      *   **Redundancy:** The individual identities/labels of the identical particles are gauge-dependent. Labeling them "particle 1" and "particle 2" is arbitrary.
      *   **Nuance:** This is typically a *global* symmetry (swapping all instances simultaneously). While it forces the realism/anti-realism fork about particle identities, it doesn't threaten determinism in the same localized way the Hole Argument does. The statistics emerge *because* the particle labels are gauge; only the symmetric/antisymmetric states represent distinct physical situations. Focusing on which particle is which is like asking "which point is which" in spacetime – it's asking a question the theory deems physically meaningless.
      *   **Label:** Permutation Symmetry / Indistinguishability.

  3.  **Leibniz's Shift:**
      *   **Symmetry:** Global Spatial Translation.
      *   **Redundancy:** Absolute position in space is gauge-dependent.
      *   **Nuance:** The simplest case. It forces the fork: absolute space is real (leading to empirically indistinguishable alternatives differing only by a shift), or absolute space isn't real (and the shift is just a redescription). It's purely global.
      *   **Label:** Leibniz Shift / Relationalism vs. Absolutism (about space).

  ## What It Is NOT (Clarifying Your Doubts)

  *   **Not Simply Underdetermination of Theory by Evidence (UTE):** You are correct. UTE involves *different theories* making the same empirical predictions. This is about *one theory* having *multiple mathematical representations* of the *same physical state*. It's underdetermination *within* the formalism of a single theory regarding how to describe the unobservable structure.
  *   **Not Simply Describing One Situation in Two Coordinate Systems:** You are *mostly* correct. Changing coordinate systems *is* a paradigm example of gauge redundancy (especially in GR)! However, the key difference you sense is spot on: The issue isn't *just* that you *can* use different coordinates (which is trivial), but that the theory *itself* treats the underlying points (or particle identities, or absolute positions) as being as meaningless as the coordinate labels. The core ontological commitment is to structures that remain invariant *under all coordinate changes and gauge transformations*. The "scaffolding" itself is put into question, not just how we label it. The fork (indeterminism vs. anti-realism) arises *because* of this deeper redundancy in the fundamental ontology proposed by the theory.
  *   **Not *Just* the Identical Spheres Puzzle:** You are correct again. The identical spheres puzzle (Black's spheres) is a *metaphysical* puzzle about haecceitism (primitive "thisness") in a world of perfect qualitative duplicates. It *resembles* the particle permutation case. However, the argument structure you're dealing with is specifically tied to the *structure of a physical theory* – its symmetries, observables, and formalism. The spheres puzzle is a thought experiment about bare metaphysics without a specific theoretical framework. The particle case *uses* the metaphysical question, but it arises *from* the symmetry encoded in quantum theory and its implications for determinism and ontology within that theory.

  ## Where the Edges Are & The Small-Region Work

  *   **The Core Phenomenon:** Any symmetry of a theory that transforms the mathematical description while leaving all observables invariant *is* gauge redundancy.
  *   **The Fork:** The "indeterminism vs. anti-realism" fork arises most sharply when the symmetry transformation can be performed *dynamically* or *locally* in a way that creates empirically indistinguishable futures from the same initial data (like the Hole Argument). Global symmetries (like Leibniz's shift or, arguably, global particle permutation) primarily force the anti-realism option without necessarily threatening determinism about the scaffolding *in time* (though they render its state indeterminate in an absolute sense).
  *   **The Small-Region Work:** The small-region (Hole Argument) version **is doing essential work** that the others do not. It uniquely demonstrates the threat of *local* gauge symmetry to *determinism*. Global symmetries don't create this problem because applying them everywhere doesn't generate distinct futures from the same initial conditions defined on a slice of spacetime; it just shifts everything uniformly. The Hole Argument's local transformation within a finite region, while keeping the *past and outside* fixed, creates multiple genuinely different (mathematically, and potentially ontologically) configurations for the *future inside the hole*, all compatible with the same prior physical state. This is why it was so devastating to Einstein and why resolving it (via Option B) was crucial for GR. The other cases primarily illustrate the anti-realism option without this strong dynamical consequence.

  ## In Summary

  *   **The General Shape:** Gauge Freedom / Gauge Symmetry / Gauge Redundancy.
  *   **The Core:** A symmetry transformation leaves observables invariant but changes the mathematical description of the underlying structure ("scaffolding").
  *   **The Fork:** Forces a choice: accept indeterminism about the scaffolding or reject its fundamental reality.
  *   **Your Cases:** All are instances of gauge redundancy.
      *   *Spacetime (Hole):* Local gauge (diffeomorphism) redundancy. Highlights threat to determinism, requires anti-realism about point identity.
      *   *QM Particles:* Global gauge (permutation) redundancy. Highlights anti-realism about particle identity.
      *   *Leibniz Shift:* Global gauge (translation) redundancy. Highlights anti-realism about absolute position.
  *   **Key Distinction:** Local vs. Global nature of the symmetry determines the strength of the threat to determinism (local being stronger).
  *   **Not:** Simple UTE, mere coordinate changes, or just the identical spheres puzzle.

  Understanding this as "gauge redundancy" provides the unified framework. The differences between the cases lie in the *type* of symmetry (diffeomorphism, permutation, translation) and its *scope* (local vs. global), which impact the specific implications (especially regarding determinism). The Hole Argument's local transformation isn't just dramatic flair; it's essential to its specific, powerful challenge to spacetime ontology and determinism within GR.
