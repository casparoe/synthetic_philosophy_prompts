prompt: |-
  I teach a second-year political philosophy seminar: 28 students, one 80-minute session, no budget, and nothing they earn in the activity counts toward their grade. They have already met the distinction between brute luck and option luck and know the label "luck egalitarianism," but they have not met the standard objections to it, and I do not want to state any of those objections myself. I want them to manufacture one out of their own decisions and then have to sit in it. Please design a runnable in-class activity under the following constraints.

  1. No veil of ignorance and no ex ante choice of principles. Everyone knows their own position throughout, and the allocation happens after the outcomes are known, because that is what the principle is actually about. I also do not want a rerun of the island auction.

  2. The brute luck / option luck distinction must be produced by the mechanics rather than explained to them. Ideally the very same event counts differently for two participants depending on what each of them did beforehand, and they have to notice the asymmetry on their own.

  3. Include a stage in which the group, acting as an allocation committee, writes down in its own words the rule it will apply, before any of the random elements are revealed. Then hold the committee strictly to the text it drafted. I want the unpleasant outcomes to be traceable to language they chose while it still looked costless.

  4. Build in an information failure: in at least some cases the committee must be unable to determine whether a participant's disadvantage followed a choice or preceded it. This has to be a consequence of what gets disclosed and what stays sealed in an envelope, not of a case I read aloud from a script.

  5. At least one participant's disadvantage must trace to a choice taken from a menu that was itself unequal, so that the committee has to decide whether that counted as choosing at all. Do not resolve this for them in the rules.

  6. Someone in the room should finish ineligible for help under the committee's own rule, and it should be one of the students who argued hardest for that rule in stage 3.

  Deliver: a materials list made of ordinary classroom objects; the rules as numbered steps with a minute count against each, totalling 80 minutes including the debrief; a payoff scheme expressed in tokens that convert to nothing real; roles, if roles are needed; a debrief that maps particular moments of the play onto the parts of the view they have just reenacted, including the places where what the committee wrote and what the principle says come apart; and two or three questions that move the discussion from the tokens to real claims about treatment, disability, and insurance, since that transfer will not happen on its own.

  Then tell me what will predictably go wrong the first time I run this with 28 people: which stage overruns its minutes, which role collapses or refuses to play, what a sharp student will say to break the game early, and how I should answer without naming the objection for them. They may use the label they already have, but the name of what they have just produced should come from them or from their reading afterwards.

  Finally, be frank about what this activity cannot produce. My guess is that it has to do with the difference between being handed a token and being turned away at a clinic counter, but I want you to say precisely what the facilitator must supply that no set of mechanics can.

  Open with three sentences stating the single experience the activity is engineered to produce and the one thing it must not be allowed to degenerate into. Then keep the entire response, materials and rules and debrief and failure modes and limits, under 900 words, with the rules as numbered steps carrying their minute counts.
reasoning: |-
  Hmm, this is a fascinating challenge from a political philosophy professor. They want an in-class activity that forces students to confront the internal contradictions of luck egalitarianism through lived experience rather than lecture. The constraints are very specific: no veil of ignorance, must generate brute/option luck distinction organically, requires binding rule-writing with later accountability, needs built-in information failures, and must produce visceral discomfort for proponents.

  I'm designing an activity called "The Wheel & The Ledger" that centers on medical resource allocation after random health events. Students will start by secretly choosing prevention levels (low/medium/high effort) that cost tokens but reduce health risks. Crucially, the prevention menus themselves will be unequal - some get cheaper options than others based on random "family history" envelopes. 

  The key mechanics: After health outcomes are determined by spinning a wheel, a student committee must allocate medical aid using rules they drafted earlier. The information failures come from sealed "prevention receipts" that may not be opened during deliberation. This creates perfect conditions for the requested dilemmas - like someone who chose "high effort" from an expensive menu still getting sick, or cases where the committee can't verify choices.

  For payoff structure, tokens represent both prevention costs and medical aid. The professor's requested "unpleasant outcome" will emerge when pro-rule advocates find themselves ineligible due to their own committee's wording. Like a student who argued for "no aid for low-effort choosers" but then can't prove their medium-effort choice when their receipt stays sealed.

  The debrief must explicitly connect token-denial moments to real-world clinic denials. Sharp students might notice the menu inequality flaw early; my response script guides them to articulate this without naming "brute luck in option sets." 

  Three hard limits: First, the activity can't simulate the shame of real benefit denials - that requires ethical imagination. Second, it won't capture systemic injustice accumulation over time. Third, the medical scenario risks trivializing disability; the debrief must preempt this by naming the limitation upfront.

  Biggest predictable failure: The rule-writing stage will overrun as students try to preempt every loophole. I'm allocating 20 minutes but suggesting professor imposes strict cutoffs. Also, some "sick" students might resist playing along when denied aid - hence the scripted intervention about binding agreements.
answer: |-
  **Core Experience:** Students will *enforce* a self-written luck-egalitarian compensation rule on peers, discovering its informational impossibilities, harsh exclusions, and vulnerability to pre-existing inequalities through unavoidable committee decisions. **Must Avoid Degenerating Into:** Abstract debate detached from the lived consequences of their binding rule.

  **Materials:** 28 envelopes, 28 small slips of paper, 28 index cards, 1 spinner/wheel with 3 equal sections ("Healthy", "Sick-Mild", "Sick-Severe"), pens, whiteboard/flipchart, tokens (e.g., colored paper clips - 100 tokens total pool).

  **Roles:** All students are Participants. 5 randomly selected students form the *Allocation Committee* (AC). Professor = Facilitator.

  **Rules (80 mins total):**

  1.  **Setup & Secret Choices (15 mins):**
      *   Facilitator gives each student: 1 envelope, 1 slip, 1 index card, 5 tokens.
      *   **Step 1 (Secret):** Each student writes their name on their slip. Facilitator shows 3 Prevention Options (costs vary!):
          *   **Option A (Low Effort):** Cost 1 token. *Lowest risk reduction.*
          *   **Option B (Medium Effort):** Cost 3 tokens. *Medium risk reduction.*
          *   **Option C (High Effort):** Cost 5 tokens. *Highest risk reduction.*
      *   **Step 2 (Secret & Unequal Menus):** Facilitator secretly hands half the students a note: "Your Menu: A(1), B(3), C(5)". Other half gets: "Your Menu: A(3), B(5), C(8) - *You have chronic pain*". Students choose one option *from their assigned menu*, pay tokens to facilitator, write choice (e.g., "Chose B") & menu note (e.g., "Menu: A1,B3,C5") on their slip.
      *   **Step 3 (Seal):** Students seal their slip (proof of choice/menu) inside their envelope, write name on outside. Facilitator collects all envelopes.

  2.  **Rule Drafting (20 mins):**
      *   **Step 4:** AC convenes. Task: *Write a rule for allocating medical aid tokens from the central pool (100 tokens) to participants who become sick. Base aid eligibility SOLELY on whether their sickness resulted from brute luck or option luck (choices).* AC debates & drafts rule on board. **Crucial:** Rule must define eligibility based on *assessable information*. Facilitator *only* clarifies wording ambiguity, *does not* suggest content. AC finalizes rule text.

  3.  **Reveal Outcomes & Allocate (25 mins):**
      *   **Step 5:** Each student spins the wheel once, records health outcome ("Healthy", "Sick-Mild", "Sick-Severe") on index card. "Sick" students publicly announce outcome severity.
      *   **Step 6:** AC reconvenes. "Sick" students submit name cards. AC applies their *written rule* to decide aid eligibility & amount per sick student. **Information Constraints:**
          *   AC knows each sick student's *current outcome*.
          *   AC *does not know* individual menus or choices.
          *   **Information Failure:** Facilitator randomly selects 5 sealed envelopes (from sick & healthy). AC *may request* to open **only 3** of these 5 envelopes to see the slip (choice/menu) inside *for those specific individuals*. Other envelopes stay sealed. AC makes final aid decisions (token amounts) based *only* on rule + available info.

  4.  **Reveal & Disbursement (5 mins):**
      *   **Step 7:** Facilitator reveals *all* sealed envelopes (choices, menus). AC announces aid decisions. Facilitator disburses tokens accordingly. "Sick-Severe" cost = 20 tokens to "cure", "Sick-Mild" = 10 tokens. Unused tokens vanish.

  5.  **Debrief (15 mins):**
      *   Map Moments:
          *   "Who was denied aid? Trace it back to the *exact phrase* in the AC rule that excluded them." (Link: Harsh Exclusions)
          *   "Point to a decision the AC *had* to make without knowing a choice or menu. What did your rule *assume* you could know vs. what you actually could?" (Link: Epistemic/Objection - Impossible Information Demands)
          *   "Find someone whose menu was the expensive one (*chronic pain*). Did their 'choice' feel like a real choice? How did your rule handle this ambiguity?" (Link: Brute Luck Tainting Option Luck / Choice-Set Inequality)
          *   "Did anyone on the AC argue for the rule *and* then get sick? What happened to them?" (Link: Internal Contradiction/Hypocrisy Charge).
      *   Transfer Questions:
          1.  "When the committee denied tokens, it felt procedural. How might this feel if it were denying dialysis or a wheelchair subsidy? What changes?"
          2.  "Our 'chronic pain' was a note. What real-world factors make 'choice sets' unequal *before* an individual 'chooses'? How should luck egalitarianism handle these?"
          3.  "The rule required judging responsibility for bad luck. What are the ethical costs of making such judgments about real people's lives, especially when information is imperfect?"

  **Predictable Failures:**

  1.  **Stage 2 Overrun (Rule Drafting):** Students will try to write an omnibus rule covering all contingencies. **Solution:** Strict 20-min cutoff. Enforce: "Write a rule based on info you *will* have (outcomes + limited proofs), not *wish* you had."
  2.  **Role Collapse (AC Member):** An AC member might refuse to enforce the rule harshly. **Solution:** "The committee agreed this rule binds them. We are simulating the application of principles, not personal fairness *now*."
  3.  **Sharp Student Break:** "This is unfair! We can't know their real choices or situations!" **Answer:** "Exactly. Your rule requires knowing X to allocate fairly. What does that imply about the *practicality* of the principle? Does it mean the principle is wrong, or just hard to apply? Write that down for the debrief."
  4.  **"Sick" Student Protest:** A denied student might complain loudly. **Solution:** Acknowledge frustration, redirect: "This feeling is crucial. Why *does* this denial feel different than just having bad luck? Note that for the debrief."

  **What the Activity Cannot Produce:**

  The activity simulates *resource denial based on responsibility judgments*. It **cannot** simulate the profound **social stigma, humiliation, or existential vulnerability** experienced by someone deemed "undeserving" of essential medical care or social support in the real world. The token denial is a clean transaction; the real-world denial is a visceral, often degrading, affirmation of lower social worth tied to one's perceived choices or inherent condition. The facilitator *must* explicitly name and explore this gap between the mechanic (token loss) and the real harm (dignitary injury, life-threatening exclusion) during the debrief.
