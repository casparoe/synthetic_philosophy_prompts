answer: |-
  You've hit on one of the deepest and most persistent problems in ethical theory – a genuine paradox that forces us to confront fundamental disagreements about the nature of morality itself. Philosophers absolutely recognize this structure and have carved it meticulously. Here's the breakdown:

  1.  **The Core Concept: Deontological Absolutism (or Agent-Centered Restrictions)**
      *   This is the position you're describing: rules prohibiting specific actions (like lying, killing innocents) are absolute, binding on the moral agent, and *cannot* be overridden *even* to prevent *more* instances of the same wrong from being committed by others.
      *   **Agent-Relative Constraints/Side-Constraints:** You found the right terms. These *are* the labels for the kind of rule. The specific paradoxical *consequence* you're highlighting (adherence causing more overall violations) is the primary *criticism* or *problem* generated by these constraints, especially in their absolutist form.
      *   **Key Idea:** Morality isn't *just* about minimizing bad states of affairs in the world (consequentialism). It's primarily about *what kind of person I am* and *what I directly do*. I have a fundamental duty not to *murder* an innocent, period. That duty isn't negated because my *inaction* might lead someone *else* to murder *more* innocents. My responsibility is for my *own* actions, not for orchestrating the world to minimize all evil.

  2.  **The Specific Paradox: The Problem of "Moral Clean Hands" or the "Integrity Objection"**
      *   While the structure arises directly from deontological absolutism, the specific problem you're highlighting – that following the rule leads to *more* of the very harm the rule was meant to prevent – is often discussed under a few related headings:
          *   **The Problem of Consequentialist Demands on Deontology:** Consequentialists argue this shows deontology is irrational or fetishistic – prioritizing the *symbol* of purity ("I didn't do X!") over the *substance* of preventing harm (more X occurring).
          *   **Bernard Williams' "Integrity" Objection (flipped):** Williams famously criticized consequentialism for demanding agents violate their deepest commitments ("integrity") for the greater good. Here, the *deontologist* is accused of prioritizing *their* integrity ("clean hands") *at the cost* of allowing greater harm to others. Their refusal to "dirty their hands" results in more people getting dirty (harmed).
          *   **The Paradox of Deontic Constraint:** How can a constraint *designed* to prevent harm become *complicit* in allowing *more* harm?
      *   **The Core Tension:** You nailed it: the rule seems to decouple from its original purpose (preventing X) and becomes self-referential ("I must not do X, regardless of consequences"). Deontologists counter that the purpose was *never* solely to minimize X globally; it was to establish an inviolable duty *for the agent* not to *be the perpetrator* of X.

  3.  **Distinguishing from Neighboring Concepts:**
      *   **Threshold Deontology:** This is a *response* to the problem you describe. Threshold deontologists *agree* that deontological rules exist but argue they have a *threshold* – an extreme level of bad consequences where the rule *can* be overridden to prevent catastrophe (e.g., torture *one* to save a *city*). The absolutist in your examples *rejects* threshold deontology. They see *no* threshold.
      *   **The Paradox of Strict Duty (Kant's Lying Example):** This *is* the canonical example you mentioned (murderer at the door). Kant argued truthfulness is a perfect duty; lying corrupts the very foundation of communication and autonomy. The consequence (the friend's death) is a separate event caused by the murderer, not the liar. This *exemplifies* the structure you're asking about.
      *   **Doctrine of Double Effect (DDE):** Related but distinct. DDE distinguishes between *intended* effects and *merely foreseen* side-effects. The absolutist in your examples wouldn't *do* X at all, even if the bad outcome (more X) was "merely foreseen" and not intended. DDE might be used to justify *other* actions with bad side-effects, but not the direct violation of the absolute prohibition itself.
      *   **Trolley Problem (vs. Organ Harvesting):** The Organ Harvesting case (kill one to save five) is designed precisely to *contrast* with standard consequentialist intuitions on the Trolley Problem. It highlights the absolutist prohibition against *using* an innocent person *as a mere means* (killing them intentionally for parts) versus merely *diverting* a threat. The refusal to harvest organs, even knowing five will die, is the absolutist position you describe.

  4.  **Philosopher's Views & Consensus:**
      *   **Recognized Paradox:** Yes, it's universally recognized as a profound and challenging problem for deontological absolutism. It's not a fringe issue; it's central to debates between consequentialists and deontologists.
      *   **The Deontologist's Defense (Biting the Bullet):** Absolutists like Kant (in his most consistent moments) and contemporary figures like Elizabeth Anscombe or Robert Nozick essentially "bite the bullet." They argue:
          *   **The "Doing vs. Allowing" Distinction:** Morally, there's a fundamental difference between *doing* harm (murder) and merely *allowing* harm to happen (even if you foresee it). Only the former violates the absolute prohibition.
          *   **Responsibility:** I am only morally responsible for *my own actions*, not for the free, evil choices of others. Refusing to torture doesn't make me responsible for the terrorists' torture; *they* are responsible.
          *   **Corruption & Slippery Slope:** Violating the absolute rule, even once for good consequences, corrupts the agent, erodes the moral rule, and opens the door to abuse and normalization of X.
          *   **Intrinsic Wrongness:** The act itself (lying, killing an innocent) is intrinsically wrong, regardless of consequences. Its wrongness isn't derived *from* its consequences.
          *   **The World is Messy:** Morality doesn't guarantee good outcomes. Sometimes, doing the right thing leads to bad overall states. That's tragic, but not a reason to do wrong.
      *   **The Consequentialist Critique:** Consequentialists (like J.J.C. Smart, Peter Singer) see this as deeply irrational, morally fetishistic, and potentially monstrous. Prioritizing one's own "purity" over preventing greater suffering is, to them, a failure of basic moral reasoning. It treats the *symbol* (not doing X) as more important than the *reality* (more X happening).
      *   **Hybrid Responses (Seeking Middle Ground):**
          *   **Threshold Deontology:** As mentioned, allows overriding the rule in catastrophic scenarios (the most popular non-absolutist deontological position).
          *   **Samuel Scheffler's "Hybrid Theory":** Acknowledges strong agent-centered *prerogatives* (I don't *have* to maximize the good constantly) but rejects absolute *restrictions* (I *cannot* do X even to prevent catastrophe). This avoids the paradox by weakening the constraint.
          *   **Emphasis on Rules vs. Acts:** Rule Consequentialists argue that *generally* following "never do X" leads to the best consequences overall, even if in *this specific* case it doesn't. Absolute deontologists reject this as still consequentialist.

  5.  **Resolution?**
      *   **No Consensus:** There is absolutely no consensus. The debate is ongoing and fundamental. It reflects a deep divide in how we conceptualize morality.
      *   **The Cost:** Philosophers acknowledge the cost of absolutism: it *can* lead to worse overall states of affairs in specific, horrific scenarios. The absolutist accepts this cost as the price of maintaining inviolable moral principles and personal integrity. The consequentialist finds this cost unacceptable and irrational.
      *   **Resolution Without Abandoning the Rule?** For the *absolute* deontologist, resolution requires accepting the tragic possibility of worse outcomes as a necessary consequence of adhering to fundamental moral truth. Threshold deontologists resolve it by abandoning *absolutism* while keeping strong constraints. Hybrid theorists try to find a principled middle way.

  **In Summary:**

  You've identified the core tension of **deontological absolutism (agent-centered constraints)**. The specific problem of **adherence leading to more overall violations** is the major consequentialist criticism of this position, often framed as the **"integrity objection"** or simply **the problem of catastrophic consequences for deontology**. Philosophers don't see it as a minor quirk; it's a central, unresolved debate highlighting the fundamental choice: is morality primarily about **the character of my actions** or **the state of the world I help bring about**? There's no easy solution, and the positions reflect profoundly different understandings of the moral universe. Your analysis of the "decoupling" from the original purpose is spot-on – that *is* the consequentialist accusation, while the deontologist argues the purpose was always agent-focused, not solely outcome-focused.
