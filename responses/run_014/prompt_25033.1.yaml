  I recall Bernard Williams' integrity objection and Scheffler's hybrid theories. Absolutists might appeal to moral integrity or corruption, but consequentialists argue this is fetishistic. The user might benefit from knowing the main responses: bite the bullet (accept more harm), threshold deontology, or hybrid approaches. 

