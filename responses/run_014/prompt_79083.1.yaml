prompt: |-
  I'm on the ethics and compliance committee of a mid-sized international NGO -- we run school-improvement projects in a few West African countries, funded by a European government donor plus a couple of private foundations. We meet in two weeks and I have to circulate the decision memo before then, so I'm drafting it now and I want a second brain on it.

  Background. Our donor's anti-bribery certification, which we signed, is essentially "no gifts or payments to public officials, no exceptions, no facilitation payments." Our staff handbook copies that language word for word and then never defines 'gift'. Last quarter a junior accountant in our country office flagged a batch of expenses from one project: about $4,000 over eight months, in three piles.

  Pile one, roughly $600: kola, drinks, and a small cash 'protocol' payment to village elders and chiefs at the start of community meetings. Always announced out loud at the meeting, always logged in a ledger anyone in the village can look at.

  Pile two, roughly $2,000: 'sitting allowances' paid to teachers, parent-association members, and two district education officials for giving up weekends to attend our planning workshops, at what our country director says is the going local rate for that kind of work.

  Pile three, roughly $1,400: three installments to one district education officer in the two months before he signed off on the list of schools that would get the new classrooms. Our project then picked schools off that list.

  The accountant reported it. The country director is furious at her -- says she doesn't understand how anything gets done here, that refusing pile one insults the chiefs and costs us the project's goodwill, and that pile two is just paying people for their time. She also mentions, unprompted, that our compliance officer in the capital is a close friend of the DEO. Our compliance lead wants to terminate the partnership, report it to the donor, and relocate the programme. One board member has said before that 'corruption' is a Western category and we're imposing our standards on people with a different understanding of obligation and reciprocity. Another said that's the excuse everyone uses.

  What I need: a recommendation the committee can actually vote on -- what happens to the country director, the accountant, the local partner, the DEO, the money, and our relationship with the donor, with a timeline -- then the reasoning, including the strongest honest version of the country director's case and the relativist board member's case, not just a restatement of the donor's rules. I also want a proposed handbook revision, since 'no exceptions' is not going to survive contact with the field and I'd rather write something our field staff can actually follow. If you can, give me a principled test that sorts piles one, two, and three, rather than just telling me all three are forbidden.

  Two things I keep going back and forth on and would like you to take a position on. First, I keep wanting to say a bribe changes a decision and a gift doesn't -- is that a real distinction or am I just making myself feel better about pile one? Second, does it matter that the payments were public and recorded? And please be straight with me about which parts of this are about ethics and which parts are about us protecting our own funding.
reasoning: |-
  Okay, the user is part of an ethics committee for an NGO working in West Africa. They need a decision memo addressing three types of payments: gifts to village elders, sitting allowances for workshop attendees, and payments to a district education officer before he approved school lists. They want recommendations for each party involved, a revised handbook policy, and a principled test to differentiate the payments.

  First, I need to unpack the core issues. The donor's strict anti-bribery policy conflicts with local practices. The country director defends the payments as necessary, while the accountant flagged them. There's tension between compliance and operational reality. The user is struggling with distinguishing bribes from gifts and whether public recording matters.

  Key points from the background: Pile one involves cultural tokens for elders, pile two compensates time for workshops, pile three went to a DEO before school approvals. The DEO's connection to the compliance officer adds complexity. Board members are divided—one sees corruption as a Western concept, another dismisses that as an excuse.

  The user needs actionable recommendations. They want a balanced approach that upholds ethics without naivety. Their deeper concerns: protecting the NGO's integrity while allowing practical operations, and crafting enforceable policies. They also want transparency about ethical vs. self-protective motives.

  For the principled test: Intent, nature, and transparency matter. Pile one seems cultural, not decision-influencing. Pile two is compensation for services, but paying officials blurs lines. Pile three is clearly a bribe—timed before approval, no clear service, likely influencing the decision.

  Public recording might mitigate for pile one by adding transparency, but it doesn't sanitize a bribe in pile three. The distinction between bribe and gift hinges on intent to influence versus cultural respect. However, pile two's inclusion of officials is problematic under strict policies.

  Handbook revisions should define "gift," allow de minimis tokens with limits, require written justification, mandate transparency, and prohibit payments to officials. Sitting allowances could be permitted for non-officials if pre-approved and receipted.

  Recommendations: Clear consequences for the DEO and the compliance officer due to conflict of interest. Support the accountant. Reprimand the country director for mishandling the situation but acknowledge operational challenges. Repay pile three funds, review pile two, and formalize pile one as permissible under new guidelines.

  The user's conflict between ethics and funding protection is real. Reporting the DEO is ethical, but donor relations are also a factor. The key is aligning policy with both integrity and practicality to sustain the NGO's mission.
answer: |-
  Here's a comprehensive decision memo draft incorporating your requirements, addressing the ethical dilemmas head-on, and proposing actionable solutions:

  **MEMO: ETHICS COMMITTEE DECISION & RECOMMENDATIONS - EXPENSE CATEGORIZATION & POLICY REVIEW**

  **Recommendation (For Vote):**

  1.  **Pile One ($600 - Village Elders):** **Permitted retrospectively under new "De Minimis Cultural Protocol" exception.** Funds deemed spent appropriately. No disciplinary action related to this pile. **Future Policy:** Formalize exception with strict limits ($ value, transparency requirements).
  2.  **Pile Two ($2,000 - Sitting Allowances):** **Investigate further & define policy.** Suspend future payments to *government officials* pending policy. Allow retrospective payments for teachers & parents if receipts/attendance verified. Reprimand Country Director (CD) for including officials without HQ pre-clearance. **Future Policy:** Permit for non-officials; prohibit or require strict pre-approval for officials.
  3.  **Pile Three ($1,400 - DEO Payments):** **Terminate as a bribe.** Demand repayment from local partner; suspend partnership pending repayment & investigation. Report incident (anonymized) to donor as potential attempted bribery. Escalate DEO details confidentially to donor via anti-corruption channel. Relocate program if DEO influence persists. Investigate Compliance Officer (CO) for conflict of interest (friendship with DEO); place on administrative leave during investigation.
  4.  **Personnel:**
      *   **Accountant:** Commend & protect. Formal recognition for upholding compliance.
      *   **Country Director (CD):** Formal reprimand for retaliation against accountant, poor judgment including officials in allowances, and inadequate oversight leading to Pile 3. Mandate ethics retraining. Performance improvement plan.
      *   **Compliance Officer (CO):** Immediate administrative leave pending independent investigation into relationship with DEO and failure to detect/address Pile 3.
  5.  **Donor Relations:** Proactively disclose *policy gap* (gift definition, cultural protocols) and *process failure* (Pile 3) outlining corrective actions (new policy, investigation, relocation). Emphasize commitment to donor principles. **Timeline:** Disclosure within 48 hours of Committee vote.
  6.  **Handbook Revision:** Implement immediately (draft attached).

  **Reasoning & Analysis:**

  1.  **Addressing the Country Director's Case (Strongest Honest Version):**
      *   **Operational Reality:** Pile One reflects essential cultural norms; refusal damages trust and hinders community engagement vital for project success. The payments are transparent and customary, not covert influence.
      *   **Fair Compensation:** Pile Two compensates individuals (especially teachers and parents) for real opportunity costs (lost weekend income). The "going rate" argument has merit for non-officials to ensure participation from those who can't afford to volunteer.
      *   **Local Context:** A rigid, zero-tolerance Western approach ignores legitimate local practices of reciprocity and respect, potentially making effective implementation impossible. The CD feels caught between donor rules and on-ground necessities.

  2.  **Addressing the Relativist Board Member's Case (Strongest Honest Version):**
      *   **Cultural Imperialism:** Strict "no gifts" rules can indeed reflect a Western, individualistic view that fails to account for communal obligations and hierarchical respect systems prevalent in the operating context. Labeling all exchanges as "bribery" oversimplifies complex social fabrics.
      *   **Harm of Abstraction:** Enforcing rules designed for different contexts without adaptation can damage relationships, stall projects, and ultimately harm the communities we serve by making our work ineffective or unsustainable.
      *   **Power Dynamics:** Focusing solely on the NGO's "purity" ignores the coercive environment where officials might *expect* payments, putting local staff in impossible positions if given no clear, permissible alternatives.

  3.  **Ethical vs. Funding Protection Considerations:**
      *   **Pile One (Ethics):** Primarily ethical/cultural - respecting local norms transparently. *Also Funding:* Failure risks project effectiveness.
      *   **Pile Two (Ethics):** Primarily ethical - fairness for non-officials; corruption risk for officials. *Also Funding:* Paying officials violates donor rules, risking funding loss.
      *   **Pile Three (Ethics & Funding):** **Core ethical breach** (undue influence, distortion of fair process) **AND** **major funding risk** (clear violation of donor agreement, potential for legal liability and reputational damage). Protecting funding here *aligns* with ethics (upholding integrity).
      *   **Reporting (Ethics & Funding):** Disclosing the DEO incident is ethically required (transparency, accountability). Protecting funding requires demonstrating robust compliance *despite* the breach.
      *   **Handbook Revision (Ethics & Funding):** An ethical policy is usable; an unusable policy breeds non-compliance, increasing *both* ethical and funding risks.

  4.  **Key Distinctions & Your Questions:**
      *   **Bribe vs. Gift Distinction:** Your intuition has merit but needs refinement. The crucial factors are **Intent, Timing, Recipient Role, and Secrecy:**
          *   **Intent:** Was the intent to improperly *influence* an official decision or action? (Pile Three clearly yes; Pile One likely no - respect/custom).
          *   **Timing/Quid Pro Quo:** Was the payment made *immediately before* or *conditioned upon* a specific discretionary decision by the recipient? (Pile Three clearly yes; Pile One/Two no).
          *   **Recipient Role:** Is the recipient a Public Official with decision-making power relevant to our work? (Pile Three & Part of Pile Two: Yes; Pile One: Village elders may not be "public officials" under the law/donor definition; clarify!).
          *   **Secrecy:** Was the payment hidden or publicly acknowledged? (Pile One: Public; Pile Three: Likely covert). **Answer:** Public recording *matters significantly* for Pile One (supports cultural/gift argument). It is *irrelevant* for Pile Three (a recorded bribe is still a bribe).
      *   **Principled Test for Sorting Piles:** Use the **"INT-SEC" Test**:
          1.  **Intent:** What was the primary purpose? (Respect/Custom, Compensation, Influence)
          2.  **Nature:** Is it a token, compensation for service/time, or cash for favor?
          3.  **Timing/Quid Pro Quo:** Is it linked to a specific discretionary decision?
          4.  **Secrecy:** Is it openly provided and recorded?
          5.  **Scale:** Is the value proportionate to the context (token vs. substantial)?
          *   **Pile One:** INT: Respect/Custom. NATURE: Token. TIMING: General goodwill. SECRECY: Public. SCALE: De Minimis. **= Permissible (with policy).**
          *   **Pile Two (Non-Officials):** INT: Compensation. NATURE: Service (time). TIMING: Post-service. SECRECY: Likely recorded. SCALE: Market rate. **= Permissible (with policy).**
          *   **Pile Two (Officials):** INT: Compensation? *BUT* NATURE: Payment to official. TIMING: For attendance. SECRECY: ? SCALE: Market rate. **= High Risk.** *Prohibit or require strict pre-approval.* Risk: Could be seen as buying access/influence.
          *   **Pile Three:** INT: Influence. NATURE: Cash for favor. TIMING: Pre-decision. SECRECY: Likely covert. SCALE: Significant. **= Bribe. Forbidden.**

  **Proposed Handbook Revision (Anti-Bribery & Gifts Section):**

  1.  **Core Principle:** Strict prohibition of bribes, kickbacks, or any payment/advantage intended to improperly influence any act or decision of a Public Official. Facilitation payments are forbidden.
  2.  **Definition:** "Gift" = Any item, service, hospitality, token, or cash payment offered without expectation of direct material return. "Public Official" = [Define precisely based on donor/local law, incl. traditional leaders if applicable].
  3.  **Gifts *to* Public Officials:**
      *   Generally prohibited.
      *   **Exception - De Minimis Cultural Protocol:** Nominal tokens of cultural respect (e.g., kola nuts, shared refreshments during customary meetings, *very* small customary cash tokens where documented as essential local practice) may be permitted *only if*:
          *   Value per instance < $X (e.g., $15 USD local equivalent).
          *   Given openly and transparently during a customary ceremony/meeting.
          *   Recorded in project ledger with purpose, recipients (role/title, not necessarily names), date, location, value.
          *   **Pre-Approval:** Requires documented pre-approval from Country Director *and* HQ Compliance for any new context or recipient group. Annual cumulative limit per project/community.
      *   No cash gifts to individual officials.
  4.  **Sitting Allowances/Transport Reimbursement:**
      *   **Permitted for:** Teachers, community members, NGO staff, consultants.
      *   **Prohibited for:** Public Officials (including District/MoE officials), unless:
          *   Explicitly permitted and governed by the donor agreement & local law; AND
          *   Pre-approved in writing by HQ Compliance & Finance; AND
          *   Based on a published government scale; AND
          *   Receipts & attendance records maintained.
      *   Rates must be justifiable (local market rate for time/transport) and pre-approved by CD/HQ Finance.
  5.  **Reporting & Accountability:** Mandatory reporting of ANY solicitation, suspected bribe, or ambiguous situation. Zero tolerance for retaliation against reporters. Failure to report suspected violations is grounds for discipline.
  6.  **Training:** Mandatory annual training incorporating local context scenarios on this policy.

  **Conclusion:**

  This approach upholds core ethical principles and donor obligations by decisively addressing the bribe (Pile 3), protects the whistleblower, and disciplines management failures, while pragmatically acknowledging the cultural and operational necessity reflected in Piles One and (partially) Two. The revised policy provides clear, context-sensitive guidance for field staff, replacing an unworkable absolute ban with a risk-based framework centered on transparency, intent, and proportionality. This balances ethical responsibility with operational reality and mitigates future funding risks through proactive disclosure and robust controls.

  **Timeline:**

  *   **T+0:** Committee Vote.
  *   **T+1 Day:** Notify Accountant (Commendation), CD (Reprimand/Training Mandate), CO (Administrative Leave), Local Partner (Suspension/Demand Repayment). Issue revised Handbook.
  *   **T+2 Days:** Proactive Disclosure to Donor (Policy Gap, Pile 3 incident, actions taken).
  *   **T+1 Week:** Initiate independent investigation into CO/DEO relationship. Begin planning program relocation feasibility.
  *   **T+2 Weeks:** Review investigation preliminary findings. Verify Pile 2 (non-official) payments.
  *   **T+4 Weeks:** Final decision on CO employment. Finalize relocation plan if needed. Confirm local partner termination/continuation based on repayment & cooperation.

  ---
  **Final Thoughts on Your Questions:**

  1.  **Bribe vs. Gift:** The distinction *is* real and crucial. A gift (especially a small, customary, public token) shows respect without demanding a *specific* favor in return. A bribe is given *with the intent* to secure a specific, often improper, outcome. Pile One fits the gift/custom category. Pile Three is clearly a bribe. Pile Two (to officials) is the greyest area – paying an official for their time *can* improperly influence their future actions or access, hence the recommendation for extreme caution/prohibition. Don't feel bad about Pile One under a proper policy.
  2.  **Public Recording:** This is vital for *legitimizing* customary payments (Pile One), demonstrating transparency and lack of corrupt intent. It is meaningless for a bribe (Pile Three) – sunshine doesn't sanitize poison. For allowances (Pile Two), it's good practice but doesn't automatically make paying officials acceptable.
  3.  **Ethics vs. Funding Protection:** They are intertwined. Upholding ethics *is* protecting long-term funding and mission integrity. Reporting the DEO bribe is fundamentally *ethical* (accountability, transparency) even though it carries funding risk. Conversely, ignoring it for "practicality" is both unethical *and* ultimately a greater threat to funding. The key is demonstrating robust systems and decisive action when breaches occur.
