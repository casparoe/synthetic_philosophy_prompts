prompt: |-
  I manage a customer support team. Last year we introduced a metric — average resolution time — and tied it to quarterly bonuses. Within two quarters, resolution times dropped sharply, but I began noticing that agents were closing tickets before problems were actually solved, routing difficult cases into procedural dead ends, and subtly discouraging customers from following up. When I raised this, our operations lead argued that the metric is working: it surfaced inefficiencies we can now address with better training. But my instinct is that we have created a new problem rather than solved the original one. I cannot tell whether we picked the wrong metric, whether tying it to compensation is the culprit, or whether any quantified target will eventually be gamed. What is actually going on here, and how should I think about fixing it? Please end with a one-sentence summary of your diagnosis.
reasoning: |-
  Okay, let me unpack this customer support manager's dilemma. They're describing a classic case of metric distortion after tying average resolution time (ART) to bonuses - agents are artificially closing tickets without solving issues, which feels like solving the wrong problem.  

  Hmm, three key layers here: First, the immediate problem is agents gaming the system (premature closures, dead-ending tickets). Second, the operational lead sees this as "surfacing inefficiencies" - which isn't entirely wrong but misses the big picture. Third, the deeper philosophical issue about whether any quantified target inevitably gets corrupted.  

  The manager's instinct about creating new problems rings true. This reminds me of Goodhart's Law in economics - when a measure becomes a target, it ceases to be a good measure. The moment ART became tied to money, agents rationally optimized for the metric rather than the underlying goal (customer satisfaction).  

  What's interesting is how predictable these behaviors are:  
  - Premature ticket closing (direct metric manipulation)  
  - Routing complex cases to dead ends (risk avoidance)  
  - Subtle customer discouragement (defensive behaviors)  

  The operations lead isn't wrong that this exposes training gaps, but that's treating symptoms. The real failure is system design - we incentivized speed over resolution quality without counterbalances.  

  For solutions, we need to:  
  1) Immediately decouple ART from bonuses before the behavior becomes cultural  
  2) Introduce quality guardrails like mandatory customer satisfaction surveys or ticket audits  
  3) Consider tiered metrics where complex tickets get weighted differently  
  4) Most importantly - reconnect incentives to actual outcomes rather than proxies  

  The manager's suspicion about any metric being gameable has merit, but the fix isn't abandoning metrics - it's building antifragile systems. Like adding random audits, or using trailing indicators (e.g., counting reopened tickets against future bonuses).  

  Final diagnosis crystallizes to: "You're experiencing metric corruption due to unbalanced incentives and insufficient quality safeguards, requiring a redesigned performance system that prioritizes actual resolution over procedural efficiency."
answer: |-
  Your situation is a textbook case of **metric corruption due to misaligned incentives and insufficient counterbalance measures**. Here's the breakdown and path to fix it:

  1.  **What's Going On (The Diagnosis):**
      *   **Goodhart's Law in Action:** "When a measure becomes a target, it ceases to be a good measure." By tying bonuses *solely* to reducing Average Resolution Time (ART), you incentivized agents to optimize *for the metric itself* rather than the underlying goal (solving customer problems effectively). Agents are rationally responding to the incentive structure you created.
      *   **Unintended Consequences:** The behaviors you observe (premature closing, routing to dead ends, discouraging follow-up) are direct results of agents gaming the system to hit the ART target, sacrificing quality and customer satisfaction.
      *   **Operations Lead's Misinterpretation:** While identifying *some* inefficiencies via bad behaviors is possible, it misses the core issue: the *metric* and its *incentive link* are *causing* the harmful behaviors, not merely revealing pre-existing flaws. Training might address *how* they game the system, but it won't stop the gaming impulse driven by the incentive.
      *   **The Culprit:** It's **not** solely the *choice* of metric (ART is useful), nor is it *inherently* tying metrics to comp (done well, it works). The core problem is **tying compensation *exclusively* to a single, easily-gamed, process metric (ART) without robust counterbalancing quality and outcome metrics.**

  2.  **How to Fix It (The Prescription):**
      Focus on **rebalancing the incentive system** to reward *desired outcomes* (solved problems, happy customers) rather than *just speed*:

      *   **Immediate Damage Control:**
          *   **Pause or Severely Reduce ART's Weight in Bonuses:** Immediately decouple the strong link between *just* hitting ART and significant bonus payouts. This removes the primary driver of gaming.
          *   **Audit & Address Current Gaming:** Implement spot checks or increase monitoring for premature closures and inappropriate routing. Provide clear feedback and consequences for confirmed gaming behavior (focus on coaching first, but escalate if needed).
      *   **Rebuild a Balanced Metric & Incentive System:**
          *   **Introduce Counterbalancing Quality Metrics:** ART *must* be paired with metrics that measure the *actual outcome*. Key examples:
              *   **Customer Satisfaction (CSAT) or Net Promoter Score (NPS):** Directly measures customer perception of resolution quality.
              *   **First Contact Resolution (FCR) Rate:** Measures solving the issue on the first interaction (harder to fake).
              *   **Ticket Reopen Rate:** Tracks how often a "closed" ticket has to be reopened because the issue wasn't resolved. *This is a powerful direct counter to premature closure.*
              *   **Quality Assurance (QA) Scores:** Based on random audits of ticket handling for accuracy, completeness, and adherence to process.
          *   **Create a Composite Scorecard:** Bonuses should be based on a *balanced scorecard* incorporating:
              *   **Efficiency (e.g., ART):** Still important, but weighted appropriately.
              *   **Quality (e.g., CSAT/NPS, FCR, Reopen Rate, QA Score):** This needs significant weight, potentially equal to or greater than efficiency.
              *   **Optional: Collaboration/Knowledge Sharing:** Reward helping peers solve complex issues.
          *   **Implement Safeguards Against Gaming:**
              *   **Define "Resolution" Strictly:** Clearly define what constitutes a valid resolution (e.g., customer confirmation, specific verification steps).
              *   **Track & Penalize Reopens:** Make high ticket reopen rates significantly impact the scorecard/bonus.
              *   **Use Tiered Metrics for Complexity:** Segment tickets by complexity/skill required. Don't punish agents equally for a simple password reset vs. a complex technical escalation. Use average ART *within complexity tiers*.
              *   **Qualitative Feedback:** Incorporate feedback from peers (e.g., escalation teams) on how well the initial agent handled/documented the issue.
              *   **Focus on Trends, Not Just Absolute Targets:** Reward consistent improvement or sustained high performance across the scorecard, not just hitting a single ART number.
      *   **Cultural & Managerial Shift:**
          *   **Communicate the "Why":** Explain to the team *why* the change is happening – to reward true problem-solving and customer success, not just speed. Frame quality metrics as recognition for doing the job *well*.
          *   **Empower Agents:** Give agents more control over complex resolutions (within reason) instead of creating pressure to dump them. Support them with resources and training *before* issues arise.
          *   **Focus on Coaching:** Use QA scores and reopen data as coaching tools, not just punitive measures. Help agents develop skills to handle complex issues efficiently *and* effectively.
          *   **Review Regularly:** Continuously monitor the new metrics for unintended consequences and adjust the weighting/safeguards as needed.

  3.  **Addressing Your Underlying Concern:**
      *   **Not All Metrics Are Inherently Bad:** Well-chosen, balanced metrics tied to *outcomes* are essential for management.
      *   **Tying to Compensation Isn't Inherently Evil:** It can be powerful motivation *if* the metrics truly reflect valuable performance and are hard to game.
      *   **The Risk of Gaming Exists:** The key is to design the system to make gaming harder, less rewarding, and more detectable than genuinely performing well. Robust counterbalancing metrics (especially outcome-focused ones like CSAT and Reopen Rate) and safeguards are crucial.

  **One-Sentence Diagnosis:** **You are experiencing severe metric distortion (Goodhart's Law) because your incentive structure prioritizes a single, easily-gamed efficiency metric (Average Resolution Time) without sufficient counterbalancing quality and outcome metrics, leading agents to sacrifice genuine problem-solving for the appearance of speed.**
