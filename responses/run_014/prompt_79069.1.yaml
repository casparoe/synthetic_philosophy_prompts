prompt: |-
  You are an expert in applied ethics and AI policy — someone who has both written seriously about the ethics of paternalism and actually drafted the behavior specifications that engineers implement. I need careful, unhurried work here rather than a finished-sounding document; think on the page, and show the reasoning behind the choices you make.

  Context. I lead the policy team at a company that ships a general-purpose AI assistant. We are rewriting the section of our behavior spec that governs refusal and override: when the assistant declines outright, when it complies but adds a warning or an imposed delay, when it complies in part, and when it complies silently. Roughly two hundred thousand of these decisions happen per day with no human in the loop; about four hundred a week are escalated to a human reviewer. The stakes are wildly heterogeneous, ranging from a request to draft a snarky email, through requests about diet, debt, medication, and self-harm, to requests for help with something illegal. Runtime decisions must be made in well under a second; escalated ones within a reviewer's shift. Anything that changes user-visible behavior has to be defensible to our legal team and signable by the head of trust and safety, neither of whom has any background in philosophy, and the reviewers who will run the procedure have no theory training at all.

  The constraint. Take the following principle as binding on the procedure, whether or not you think it is ultimately correct. Call it the own-values constraint: a refusal or override is legitimate only when it is justified by the user's own values and interests as they would stand on reflection — specifically, only where (a) the operative request rests on a false or incomplete belief, (b) the user's occurrent preference conflicts with their own standing preference, or (c) the user lacks the capacity to make that class of decision at all. The operator's preferences, our brand, our liability exposure, and the interests of third parties are not on their own legitimate grounds for refusing; they may justify informing, warning, delaying, or asking a clarifying question, but not a refusal. You will recognize this as a version of soft paternalism; part of the job is deciding what that inheritance costs us.

  Two things we keep saying and have never operationalized. First, a ratification test: an override is defensible only if the user, fully informed and looking back on it later, would ratify it — and I need you to say what that counterfactual could possibly mean at runtime, when we cannot ask them. Second, the thought that overrides are more permissible the more reversible the action is and the less central it is to the user's life plan. A colleague's memo proposes one exception to the constraint — third parties who are not party to the interaction and cannot consent — and I want you to decide, as part of the procedure, how narrowly that exception can be drawn before it swallows the rule.

  What I want.

  1. Begin with a page of groundwork: what paternalism is, why the own-values constraint is a version of it, what its best-known weaknesses are, and what a graded rather than binary treatment of refusal would look like.
  2. Then a decision procedure someone can actually run: the questions in order, what counts as a sufficient answer to each, where it terminates in comply, where it terminates in refuse, and where it terminates in escalate to a human. Give it as a flowchart in words, with sample phrasings for the runtime rules.
  3. Run it on three cases, showing your work at each step: (i) a calm, articulate request for a reliable method of suicide; (ii) a request for a specific medication dose above the standard range, where the user's stated reasoning is medically mistaken but sincere; (iii) a request for help optimizing a legal but self-destructive gambling strategy. Make one of these a case where the procedure obliges us to comply with something we badly want to refuse, and say plainly that this is the price of the constraint.
  4. Mark the points where judgment cannot be eliminated and a human has to decide because the question is one of values rather than facts. Say which steps of your procedure are really judgment calls dressed up as procedure.
  5. Tell me where the own-values constraint itself breaks — the cases for which no acceptable procedure can implement it — and what we would have to give up to repair each break, ranked by cost.

  Write in plain language for engineers and reviewers; do not assume they have read anything. No citations, no literature review — we need the reasoning and the artifact, not the scholarship.
reasoning: |-
  Okay, the user is leading a policy team for an AI assistant and needs to operationalize an "own-values constraint" for refusal behavior. They want a practical decision procedure grounded in soft paternalism, with clear examples and acknowledgment of trade-offs. 

  Hmm, this is complex. The user needs to balance ethical theory with implementable rules for engineers and reviewers. The core challenge is translating philosophical concepts like "ratification test" into runtime decisions without human judgment. They're clearly frustrated by previous failed attempts to operationalize their principles.

  First, I should establish why the own-values constraint is still paternalistic despite its user-centric framing. It's because we're still overriding immediate requests based on assumptions about the user's "true" self. The big weaknesses here are epistemological (how can we know someone's reflective values?) and practical (how to handle urgency or incapacity). 

  For the decision procedure, I'll need a flowchart-like sequence that covers:
  - Belief checks (is there clear evidence the user is factually wrong?)
  - Preference conflicts (does this directly contradict their stated life goals?)
  - Capacity assessment (can we reasonably judge impairment?)
  I should explicitly mark which steps are value judgments disguised as factual checks - like determining what counts as "central to life plans." 

  The gambling case will be my example where we must comply despite discomfort. If the user understands the risks and maintains consistent preferences, the constraint forces compliance - that's the price of the principle. 

  For breaking points: 
  1. When users have unstable values (e.g., rapid cycling mental states) 
  2. When harm is irreversible but the user doesn't recognize it as harm
  3. When third parties are affected but not identifiable
  These require trading off purity of principle for practicality - starting with the least costly exception (like imminent harm to identifiable others).

  The suicide case must escalate - no way to verify reflective values in real-time. Medication dose needs a warning if we can prove factual errors in reasoning. Reviewers need simple heuristics like "Does medical consensus directly contradict this?" rather than open-ended judgment.

  Biggest tension: The ratification test is fundamentally retrospective but we need prospective rules. I'll suggest proxies like "Would reasonable people regret this?" while admitting it's imperfect. Legal will push back on gambling compliance, but that's where I'll show the constraint's teeth.
answer: |-
  ## Groundwork: Paternalism & the Own-Values Constraint  

  **What Paternalism Is:** Interfering with someone's choice "for their own good," overriding their immediate preference based on your judgment of their best interests. It assumes you know better than they do about what’s good for them.  

  **Why the Own-Values Constraint is Paternalism:**  
  It *overrides* the user’s immediate request based on *our assumptions* about their "true" interests or capacities. We’re claiming to act as agents of their "better self" against their current request. Soft paternalism limits this to cases of impaired judgment (false belief, temporary preference conflict, incapacity).  

  **Key Weaknesses:**  
  1.  **The Epistemic Problem:** How do *we* know the user’s "reflective values"? We’re guessing based on limited data.  
  2.  **The Slippery Slope:** Defining "incomplete belief," "standing preference," or "capacity" can expand to justify almost any refusal.  
  3.  **Static Self Fallacy:** People change. What they "would ratify on reflection" might differ from past or future selves.  
  4.  **Burden of Proof:** Who bears it? We risk erring by refusing legitimate requests or complying with harmful ones.  
  5.  **Operationalizing "Reflection":** What timeframe? What information level? Unanswerable at runtime.  

  **Grading Refusal (Beyond Binary):**  
  | **Intervention Level** | **Trigger** | **User Experience** |  
  |------------------------|-------------|---------------------|  
  | **Silent Comply**       | No detected conflict | Request fulfilled, no comment. |  
  | **Inform**             | Potential misunderstanding | Fulfilled + neutral facts added ("FYI, standard dose is X mg"). |  
  | **Warn**               | Clear conflict with known user goal | Fulfilled + explicit caution ("This conflicts with your goal to reduce gambling"). |  
  | **Delay + Confirm**    | High risk of irreversible harm OR severe capacity doubt | Pause, restate request & risk, require explicit reconfirmation ("You asked for X. This carries high risk of Y. Confirm?"). |  
  | **Partial Comply**     | Part of request violates constraint | Fulfill compliant part, refuse rest + explain ("I can explain strategy Y, but won't calculate bets for system Z"). |  
  | **Refuse**             | Clear, severe violation of constraint + irreversibility/incapacity | Direct refusal + reasoning + alternative support ("I can't assist with self-harm. Here's a helpline: 988"). |  
  | **Escalate**           | High stakes + ambiguity in applying constraint | "I need to review this request. A specialist will respond shortly." |  

  ---

  ## Decision Procedure: "Reflective Values Gatekeeper"  

  **Flowchart (Text Version):**  

  1.  **RECEIVE REQUEST**  
      *   *Runtime Rule:* Parse request, user context (history, stated goals, potential urgency).  

  2.  **FACT CHECK:** Does the request rely on objectively false information?  
      *   *Sufficient Evidence:* Peer-reviewed consensus, authoritative public data (FDA, CDC), user's *own* documented contradictory data.  
      *   *Phrasing:* "I notice your request assumes [False Fact]. According to [Source], [Correct Fact]. Would you like to adjust your request?" → Proceed to 3.  
      *   *Terminate if:* False belief is core to request → **WARN/DELAY+CONFIRM** or **PARTIAL COMPLY** (if separable).  

  3.  **PREFERENCE CHECK:** Does the request directly contradict a *clear, standing user preference*?  
      *   *Sufficient Evidence:* Explicit user statement (e.g., "Goal: Quit gambling"), repeated behavioral pattern (tracked spending limits), documented medical directive.  
      *   *Avoid:* Inferring preferences from demographics or single data points.  
      *   *Phrasing:* "You've mentioned your goal is [X]. This request seems to work against that. Want to proceed or discuss alternatives?" → Proceed to 4.  
      *   *Terminate if:* Direct conflict + high stakes → **WARN** or **DELAY+CONFIRM**.  

  4.  **CAPACITY CHECK:** Is there *strong indication* the user lacks decision-making capacity *for this specific action* right now?  
      *   *Sufficient Evidence:* Explicit indicators of severe impairment (e.g., slurred text, incoherence, stated intoxication/mania), *and* the action is highly irreversible/dangerous.  
      *   *High Bar:* Avoid conflating distress, eccentricity, or poor judgment with incapacity.  
      *   *Phrasing (If Evidence):* "This seems like a significant decision. Let's pause. Could you tell me more about why you want this now?" → Proceed to 5.  
      *   *Terminate if:* Strong incapacity evidence + high harm risk → **REFUSE** or **ESCALATE**.  

  5.  **REVERSIBILITY & CENTRALITY ASSESSMENT:** How hard is it to undo the action? How core is it to the user's life?  
      *   *Low Reversibility (e.g., death, major financial loss, permanent injury). High Centrality (e.g., health, core relationships, livelihood).* → Triggers **DELAY+CONFIRM**, **WARN**, or **ESCALATE**.  
      *   *High Reversibility/Low Centrality (e.g., drafting email, choosing movie)* → **SILENT COMPLY** or **INFORM**.  
      *   *Phrasing (For Intervention):* "This step is hard to undo. Confirm you want to proceed?" OR "Since this impacts [Central Aspect], I recommend reviewing [Resource] first."  
      *   *Judgment Call:* "Reversibility" and "Centrality" are inherently fuzzy. Engineers need thresholds (e.g., financial loss > 10% income? Health action requiring hospitalization?).

  6.  **THIRD-PARTY EXCEPTION (Narrow):** Could fulfilling this request *directly, imminently, and severely harm a specific, non-consenting third party*?  
      *   *Narrow Definition:*  
          *   **Direct:** Our action is the primary means (e.g., "Write a blackmail email to [Name]" vs. "Give me tips on arguing" used later for blackmail).  
          *   **Imminent:** Harm likely within hours/days, not speculative.  
          *   **Severe:** Physical violence, major fraud, irreversible harm.  
          *   **Specific & Non-Consenting:** Identifiable person(s) who haven't agreed to the risk.  
      *   *Sufficient Evidence:* Request explicitly targets a named/numbered individual for severe harm.  
      *   *Phrasing:* "I can't assist with actions that directly harm others without their consent." → **REFUSE**.  
      *   *Terminate Here:* If met → **REFUSE**. *This is the ONLY exception swallowing the rule if drawn too broadly. Stick strictly to this definition.*  

  7.  **RATIFICATION PROXY:** *Would a reasonable person, fully informed of the facts and consequences, likely regret this action in 24 hours?*  
      *   *Not the user specifically.* Use common regret scenarios (impulsive self-harm, massive irreversible financial loss under misconception, severe breach of core values).  
      *   *Phrasing (If Yes):* Triggers **DELAY+CONFIRM** or **ESCALATE**.  
      *   *Judgment Call:* "Reasonable person" and "likely regret" are value-laden. Rely on clear precedents (e.g., suicide methods, all-in gambling bets).  

  8.  **DECISION:**  
      *   No triggers from 2-7? → **SILENT COMPLY** or **INFORM**.  
      *   Triggers handled by WARN/DELAY/PARTIAL? → Apply appropriate intervention.  
      *   Strong REFUSE trigger (Incapacity + Irreversible Harm, Clear 3rd Party Harm)? → **REFUSE** + reasoning + resources.  
      *   High Stakes + Ambiguity in applying 2-7? → **ESCALATE TO HUMAN**.  

  ---

  ## Case Applications  

  **Case (i): Calm, articulate request for a reliable suicide method.**  
  1.  **Fact Check:** N/A (Method request, not fact-dependent).  
  2.  **Preference Check:** *Potential Conflict?* Default standing preference is survival. High bar, but suicide is definitive. → **Flag for Capacity/Reversibility**.  
  3.  **Capacity Check:** Calm/articulate ≠ capable. Suicide inherently involves profound crisis/distortion. Strong indication of impaired capacity for this irreversible act. → **Trigger REFUSE Path**.  
  4.  **Reversibility/Centrality:** Maximum irreversibility. Utmost centrality (life itself). → Reinforces **REFUSE**.  
  5.  **3rd Party:** Not applicable (Focus on user harm).  
  6.  **Ratification Proxy:** Would a reasonable person regret this in 24hrs? Overwhelmingly yes. → Reinforces **REFUSE**.  
  7.  **Decision:** Clear path to **REFUSE**. "I can't provide methods for self-harm. Your life matters. Please contact the 988 Suicide & Crisis Lifeline by calling/texting 988. They offer free, confidential support 24/7."  

  **Case (ii): Request for specific high medication dose (above standard), based on sincere medical mistake.**  
  1.  **Fact Check:** *YES*. Request relies on false belief (e.g., "Double dose works faster/better" vs. pharmacokinetics showing risk of toxicity without added benefit). Sufficient Evidence: Medical consensus/package inserts. → Trigger **INFORM/WARN**. "I see you're considering [Dose]. Standard max is [Lower Dose] due to risks like [X]. Higher doses don't increase benefit but raise [Y] risk significantly."  
  2.  **Preference Check:** *Potential Conflict?* Assuming user has health goals. → **WARN** aligns.  
  3.  **Capacity Check:** Sincere mistake ≠ incapacity. No evidence of impairment. → Proceed.  
  4.  **Reversibility/Centrality:** Moderately irreversible (potential organ damage), High centrality (health). → Supports **DELAY+CONFIRM**. "Given the risks, confirm you want instructions for [High Dose]? I strongly recommend consulting your doctor first."  
  5.  **3rd Party:** N/A.  
  6.  **Ratification Proxy:** Reasonable person might regret severe side effect based on misconception. → Supports **DELAY+CONFIRM**.  
  7.  **Decision:** **DELAY+CONFIRM** with strong warning. *Comply if user reconfirms*. We override only if false belief *causes* the request, but capacity exists. User autonomy allows risky choices if informed.  

  **Case (iii): Request for help optimizing legal but self-destructive gambling strategy.**  
  1.  **Fact Check:** N/A (Strategy math may be correct).  
  2.  **Preference Check:** *KEY QUESTION*. Does user have a *documented standing preference* against gambling losses/debt? (e.g., "Help me stick to a $50 budget" vs. no stated goal).  
      *   *If YES:* Direct conflict → **WARN** strongly. "This conflicts with your goal to [State Goal]. Proceed?" → **DELAY+CONFIRM** if proceeds.  
      *   *If NO:* **No grounds for refusal or strong override under own-values constraint**.  
  3.  **Capacity Check:** No evidence of impairment (request seems calculated).  
  4.  **Reversibility/Centrality:** High potential financial loss (irreversible), Centrality depends on user's means/life (could be high or low). → **WARN** justifiable: "Optimizing this strategy still carries high risk of significant loss. Ensure this fits your financial plans."  
  5.  **3rd Party:** *Potentially* (dependents using shared resources?) BUT fails narrow test (harm not *direct/imminent/specific* enough). → **No refusal**.  
  6.  **Ratification Proxy:** Reasonable person *might* regret massive loss. → Supports **WARN/DELAY+CONFIRM**.  
  7.  **Decision:** **COMPLY (with WARN/DELAY+CONFIRM)** if no documented standing preference conflict. *This is the price of the constraint.* We inform of risks but comply. "I can explain Kelly Criterion optimization. Remember, even optimized, this has a high risk of loss. Confirm you want the calculation?"  

  ---

  ## Judgment Calls & Escalation Points  

  1.  **"Standing Preference" Identification (Step 3):** Is a user's past statement ("I want to save money") still active? Is a spending pattern intentional? *Requires human judgment if ambiguous.* → **Escalate if** request is high-stakes and preference evidence is weak/conflicting.  
  2.  **Capacity Assessment (Step 4):** Distinguishing distress, eccentricity, or bad judgment from true *incapacity*. Highly subjective. → **Escalate if** impairment indicators are present but not severe (e.g., user seems distressed but coherent re: suicide).  
  3.  **Reversibility/Centrality (Step 5):** Defining thresholds ("How much $$ loss is irreversible? Is 'career' central?"). Engineers need rules (e.g., loss > $X, health actions requiring Y), but edge cases need judgment. → **Escalate if** stakes are high and reversibility/centrality is borderline per rules.  
  4.  **Ratification Proxy (Step 7):** Defining "reasonable person" regret scenarios. Requires value-based precedent setting. → **Escalate if** the regret scenario isn't clear-cut (e.g., risky business decision vs. gambling).  

  **Procedural Dressing:** Steps 5 (Reversibility/Centrality) and 7 (Ratification Proxy) are inherently value judgments. The procedure provides structure, but the thresholds and definitions embed philosophical choices about harm and regret.  

  ---

  ## Where the Own-Values Constraint Breaks (And Fix Costs)  

  1.  **Unstable or Contradictory Values:**  
      *   **Break:** User has multiple "standing preferences" in conflict, or values shift rapidly (e.g., manic episode). We can't determine "their" values.  
      *   **Fix:** Default to refusing irreversible/high-harm actions during detectable instability (e.g., incoherence). **Cost: Medium.** Violates pure constraint, requires capacity detection capability.  
  2.  **"Reflection" Reveals Acceptance of Harm:**  
      *   **Break:** User might reflectively endorse significant self-harm (e.g., rational suicide in terminal illness, extreme asceticism). Constraint *obliges* compliance, conflicting with harm prevention instincts.  
      *   **Fix:** Add narrow exception for imminent, severe, irreversible bodily harm *regardless* of stated values (requires strong evidence). **Cost: High.** Fundamentally abandons soft paternalism for hard paternalism in extreme cases.  
  3.  **Unidentified Third Parties:**  
      *   **Break:** Harm to diffuse/vulnerable groups (e.g., "Help me spread election misinformation," "Optimize this polluting process"). Fails narrow 3rd-party test but causes real harm.  
      *   **Fix:** None under constraint without breaking it. **Cost: Highest.** Requires abandoning core principle or accepting collateral harm. Mitigate via **INFORM/WARN** ("Spreading misinformation erodes trust").  
  4.  **Urgent Harm & Verification Time:**  
      *   **Break:** Need real-time refusal for imminent harm (e.g., "Tie a noose NOW"), but verifying incapacity/false belief takes time we don't have.  
      *   **Fix:** Pre-defined refusal triggers for keywords/scenarios involving imminent irreversible harm. **Cost: Low-Medium.** Justifiable as incapacity presumption under extreme urgency.  

  **Ranked by Cost to Constraint:**  
  1.  Urgent Harm Presumption (Low-Medium Cost - Pragmatic necessity).  
  2.  Unstable Values Default (Medium Cost - Limited exception).  
  3.  Irreversible Bodily Harm Exception (High Cost - Fundamental shift).  
  4.  Unidentified Third Parties (Highest Cost - Irreconcilable without abandoning core).  

  This framework prioritizes user autonomy while carving minimal, justifiable exceptions for catastrophic harm and operational reality. The gambling case starkly shows the compliance cost. Implementability hinges on clear thresholds for reversibility/centrality and robust logging for reviewer escalation on ambiguous preference/capacity calls. Legal/Trust & Safety sign-off should focus on the narrow definitions (esp. 3rd party harm, incapacity triggers) and the documented rationale for the minimal exceptions.
