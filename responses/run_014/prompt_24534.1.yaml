  For the Huntington's case - a preventative gene edit in an asymptomatic carrier - this sits in a gray area. The person currently has no symptoms but carries a genetic certainty of future disease. This blurs the line between prevention and enhancement.

  I need to identify consistent principles across her decisions. The pathology principle seems fundamental - she classifies interventions as therapy when targeting abnormal conditions causing harm. For enhancements, she focuses on interventions applied to normal functioning without medical need. The prevention principle appears in the Tay-Sachs case, where she calls it therapy despite it being preventative for a symptomatic child.

  Applying these to Huntington's: The pathology principle suggests therapy since Huntington's is clearly pathological. The prevention principle aligns with therapy as it prevents future disease. The functional impairment criterion is tricky since the person is currently asymptomatic. 

  I think she'd likely classify it as therapy because Huntington's is an undeniable pathology with predictable severe outcomes, making prevention therapeutic. Her pattern shows she considers genetic interventions for serious diseases as therapy, as with Tay-Sachs.

  To distinguish between potential principles, I should propose a test case: a gene edit to prevent Alzheimer's in someone with only a risk allele like APOE4, without family history. This would test whether she requires certainty of pathology or accepts risk-based prevention as therapy.

  This approach systematically analyzes her reasoning framework while respecting the nuances of bioethical classification.
