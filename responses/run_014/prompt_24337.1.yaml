prompt: |-
  I've been preparing a seminar on the revealed preference approach to rationality, and I keep landing on a set of verdicts about what observed choice actually reveals that I cannot quite unify. Let me lay them out and ask you to find the principle behind them, if there is one.

  The background, briefly: on this approach we do not assume we can read an agent's utility function off her introspection. Instead we infer what she values from what she chooses, given the options and the budget she actually faced, and we call a choice pattern rational if it can be represented as the maximization of some utility function over the available bundles. The question I am trying to pin down is not just when a pattern is representable, but what, if anything, the representability is doing — what it reveals about the agent, and what the utility function that does the representing really is.

  Here are my gut verdicts on a range of cases.

  1. A shopper who, on every occasion when both apples and oranges are available and she can afford both, buys the apples. I take this to reveal a genuine preference for apples over oranges.

  2. The same shopper buys oranges in midwinter, when apples are out of season and oranges are the only fruit on the shelf. I do not think this reveals any preference for oranges over apples; the set of available options changed, so the choice tells me nothing about how she ranks the two.

  3. A diner who, given a menu of A, B, and C, picks A when A and B are both offered, picks B when B and C are both offered, and picks C when C and A are both offered, with nothing else about her circumstances changing. I take this to reveal no stable preference at all: there is no single ranking of the three with which all three choices are compatible.

  4. A consumer who, faced with two physically identical cans of soup at different prices, always buys the cheaper one. I do not think this reveals a preference for "the cheaper can" as such; I think it reveals a preference for the soup together with whatever money is left over, and the price difference is just what makes one bundle better than the other.

  5. A household that buys less butter as its income rises and more margarine in return. I take this to be perfectly consistent with stable preferences — it reflects the fact that butter is an inferior good for them, not any incoherence in their ranking of bundles.

  6. Here is the pair I keep coming back to. On the one hand, when an agent's entire observed choice history is consistent in the strong sense — no choice she makes, directly or through a chain of intermediate choices, is ever reversed — I am inclined to say this reveals that the agent has a real, stable utility: a persistent psychological state that her choices express. On the other hand, the utility function that represents a consistent choice pattern is fixed only up to any monotonic transformation; I can rescale and reshape it and the choices it represents do not change. So I am also inclined to say that the utility function is not a literal thing with determinate magnitudes, but a mathematical representation of the ordering of her choices.

  I cannot see how to hold both halves of 6 at once. If the utility is a real psychological state, it seems strange that its values are arbitrary up to monotonic transformation; if it is only a representation, then what the consistency of choice reveals is a formal property of the choice pattern, not the existence of a real preference structure in the agent.

  So: is there a single principle that captures verdicts 1 through 6, or a small set of candidates that come close? For each candidate, state it precisely; say which of my cases motivates each clause of it; and give its verdicts on cases I have not raised — for instance, a person who consistently takes the smaller reward now over the larger reward later; a person whose choices are fully consistent only because she follows a fixed habit rather than any ranking of the options; and whether anything at all can be said, on this basis, about comparing one person's utility to another's. And finally, be candid about which of my verdicts your principle cannot accommodate, and whether I should drop one half of 6 — and if so, which one.
reasoning: |-
  We are to find a principle (or small set of principles) that unifies the given verdicts about revealed preference. The revealed preference approach infers preferences from choices and defines rationality as the existence of a utility function that represents the choices. The key challenge is to reconcile the idea that consistent choices reveal a stable psychological state (a real utility) with the fact that the utility function is only unique up to monotonic transformations (so magnitudes are arbitrary).

  Let me restate the cases and the verdicts:

  1. **Case 1**: Always choosing apples over oranges when both are available and affordable.
     - **Verdict**: Reveals a genuine preference for apples over oranges.

  2. **Case 2**: Choosing oranges when apples are not available (only oranges available).
     - **Verdict**: Does not reveal a preference for oranges over apples because the choice set changed.

  3. **Case 3**: Cyclical choices: A chosen over B, B over C, and C over A in pairwise choices.
     - **Verdict**: Reveals no stable preference.

  4. **Case 4**: Choosing a cheaper can of soup (identical product) over a more expensive one.
     - **Verdict**: Reveals a preference for the bundle (soup and leftover money) and not for "the cheaper can" per se.

  5. **Case 5**: Buying less butter and more margarine as income rises (butter is inferior).
     - **Verdict**: Consistent with stable preferences (no incoherence).

  6. **Case 6a**: When an entire choice history is consistent (no cycles, even through chains), it reveals a real, stable utility (a psychological state).
     - **Case 6b**: But the utility function is only unique up to monotonic transformation, so it is a representation of the ordering, not a literal state with cardinal magnitudes.

  The tension in 6 is between the realism of the utility (as a psychological state) and the ordinal nature of the utility representation.

  Now, let me try to extract principles.

  **Core Principle of Revealed Preference Theory (Standard View):**

  The standard revealed preference theory (as in Samuelson, Houthakker, etc.) is based on the idea that choices reveal a binary relation (preference) that is complete and transitive. The utility function is a representation of this preference ordering, and it is ordinal (unique up to monotonic transformations). The key axioms are:

  - **Weak Axiom of Revealed Preference (WARP)**: If A is chosen over B in any budget set where both are available, then B is never chosen over A when both are available.
  - **Strong Axiom of Revealed Preference (SARP)**: Extends WARP to chains: if A is revealed preferred to B (directly or indirectly), then B is not revealed preferred to A.

  These axioms are necessary and sufficient for the existence of a rationalizing utility function (for finite data, SARP suffices).

  But note: the standard theory does not commit to the utility function being a psychological state. It is a representation of the choice behavior.

  However, the verdicts seem to go beyond this:

  - In case 1, the choice reveals a strict preference (which is captured by the binary relation).
  - In case 2, the choice set did not include apples, so choosing oranges does not reveal a preference for oranges over apples (because apples were not an option). This is consistent with the idea that we can only infer preferences from choices in which the alternatives were available and chosen over.
  - Case 3 violates transitivity and thus the existence of a utility function (so no stable preference).
  - Case 4: The standard theory would model the choice as between bundles (soup and money). The agent is choosing a bundle (soup at a lower price) over another (soup at a higher price) because the bundle with lower price leaves more money for other goods. We model the entire bundle, so it's not about the can but the composite good.
  - Case 5: This is consistent with stable preferences because the income effect for an inferior good is allowed. The underlying utility function is stable, but the choice changes due to the budget constraint changing.

  Now, for the tension in 6:

  The principle behind 1-5 is that choices reveal a preference ordering that is complete and transitive (and that we model bundles appropriately, including composite goods like money). The utility function is a representation of this ordering, and it is ordinal. The consistency (SARP) reveals that the choices are generated by a stable underlying preference ordering.

  But does this ordering correspond to a real psychological state? The standard revealed preference theory does not require that. It is a behavioral theory. However, the agent in 6a is described as having a "persistent psychological state". This is an interpretation beyond the data.

  **Proposal for a Unifying Principle:**

  We can separate two levels:

  1. **Behavioral level (what choices reveal)**: Choices reveal a binary relation (preferences) over the set of alternatives (which must be appropriately defined, e.g., as bundles). The relation is revealed by the choices: if in a choice set where both A and B are available, the agent chooses A, then we say A is revealed preferred to B. For the choices to be rational, this relation must be acyclic (and typically transitive) and complete (for any pair, if they are ever in the same choice set, we can observe a choice). 

     This relation is what we call the agent's preference. It is stable if the same relation holds over time. The utility function is just a numerical representation of this relation.

  2. **Interpretation (psychological realism)**: The stable revealed preference relation may be taken as evidence of a stable psychological state (a "real" preference). But the utility function's specific numbers are not part of that state; they are a tool for representation. The psychological state is the ordering itself.

  Thus, in case 6:

  - The consistency (SARP) reveals a stable preference ordering (which we can take as a real psychological state).
  - The utility function is a representation of that ordering, and since only the ordering matters, the utility function is ordinal. So the magnitudes are arbitrary, but the ordering is not.

  This reconciles 6a and 6b: the psychological state is the ordering, and the utility function is a representation of it.

  Now, let's check against the cases:

  - Case 1: The choice of apples over oranges when both available reveals that apples are preferred to oranges in the preference ordering. This is stable if observed repeatedly.
  - Case 2: When only oranges are available, the choice does not tell us about oranges vs. apples because apples were not an option. So we don't add a preference for oranges over apples to the ordering.
  - Case 3: The cyclical choices lead to a violation of transitivity. There is no consistent ordering, so no stable preference.
  - Case 4: The alternatives should be bundles: (soup, money left). The cheaper can gives a bundle with the same soup and more money. So we are comparing bundles: (soup, money1) vs (soup, money2) with money1 > money2. The agent prefers the bundle with more money (for the same soup). This is a stable preference for more money (ceteris paribus).
  - Case 5: The choices are consistent with a stable preference ordering in which butter is an inferior good. The choices change because the budget set changes, but the underlying ordering (which ranks bundles by utility) is fixed.

  Now, for the additional cases:

  - **Case 7: A person who consistently takes the smaller reward now over the larger reward later.**
    - This reveals a preference for immediate gratification. We can model it as a preference for the bundle (small reward, now) over (large reward, later). The consistency reveals a stable time preference (which is part of the underlying ordering).

  - **Case 8: A person whose choices are fully consistent only because she follows a fixed habit rather than any ranking of the options.**
    - If the habit leads to choices that are consistent with a preference ordering (i.e., satisfy SARP), then we can represent it by a utility function. The theory does not distinguish between habit and "true" ranking. It only cares about the choices. So on the behavioral level, it reveals a preference ordering. However, we might question whether it is a "real" psychological state. But according to the principle above, the revealed preference ordering is what we call the preference, so it is the state we are revealing. If the habit is fixed and leads to SARP-consistent choices, then we say the agent has a stable preference ordering (even if it is due to habit).

  - **Case 9: Comparing one person's utility to another's.**
    - Since utility is ordinal and unique only up to monotonic transformations, we cannot make interpersonal comparisons of utility levels or differences based on revealed preference alone. The theory does not provide any cardinal measure. So we cannot say that one person gets more utility from a bundle than another.

  **Candid about verdicts:**

  The principle I propose (with the two levels) accommodates all of 1-5 and reconciles 6. However, it requires that we interpret the "real psychological state" as the preference ordering, not the utility function. The utility function is a representation of that ordering. So:

  - We drop the idea that the utility function (with its cardinal values) is the psychological state. The psychological state is the ordering.

  Therefore, we hold both halves of 6 by reinterpreting 6a: what is real is the ordering, and the utility function is a representation of it. The consistency (SARP) reveals that the ordering exists and is stable.

  But note: the standard revealed preference theory is silent on the psychological reality. It is a behavioral theory. So if we want to say that the ordering corresponds to a psychological state, that is an additional philosophical claim. However, within the framework, we can maintain that the revealed preference ordering is what we mean by the agent's preferences, and that it is stable and real.

  **Formal Statement of the Principle:**

  **The Principle of Revealed Preference as Stable Ordering:**

  1. **Revealed Preference Relation**: From choices, we infer a binary relation (≥) on the set of alternatives (which are bundles of goods, including money and time when appropriate). For any two alternatives A and B, we say A is revealed preferred to B if there is a choice set containing both A and B in which A is chosen (and B is not). We may also include indirect revelations via chains (for SARP).

  2. **Rationality Condition**: The choices are rational if the revealed preference relation is complete (for every pair that appears together in some choice set, we have a direction) and transitive (or at least acyclic). This is equivalent to the existence of a utility function that represents the choices.

  3. **Stability**: If the same revealed preference relation holds across different choice situations (over time), then the agent has a stable preference ordering.

  4. **Interpretation of Utility**: The utility function is a numerical representation of the preference ordering. It is ordinal: any monotonic transformation represents the same preferences. Therefore, the utility function does not have unique cardinal values, but the ordering it represents is the object of interest.

  5. **What Choices Reveal**: Choices reveal the preference ordering only when the alternatives are available and chosen over. If an alternative is not available, then the choice in that set does not reveal a preference between the chosen alternative and the unavailable ones. Moreover, the alternatives must be appropriately defined to capture the relevant aspects (like including money in the bundle for the soup example).

  **Which cases motivate which clauses:**

  - Case 1: Motivates clause 1 and 2 (direct revealed preference).
  - Case 2: Motivates clause 5 (only available alternatives are considered for revelation).
  - Case 3: Motivates clause 2 (transitivity is required; without it, no utility function).
  - Case 4: Motivates clause 5 (alternatives must be bundles: (soup, money)).
  - Case 5: Motivates clause 3 (stability: the underlying ordering is fixed, but choices change with budget).
  - Case 6: Motivated by clauses 3 and 4 (stable ordering revealed by consistency, utility is ordinal representation).

  **Verdicts on additional cases:**

  - Case 7 (smaller reward now): Reveals a stable preference for (small, now) over (large, later). This is consistent with the ordering (and we can model time as part of the bundle).

  - Case 8 (habit): If the habit leads to choices that satisfy SARP, then we can represent it by a utility function. The principle says we reveal a stable preference ordering. It does not matter if it is due to habit or deliberation. However, if we want to say that the agent does not have a "real" ranking, then we are stepping outside the revealed preference framework. The framework only uses choices to infer the ordering.

  - Case 9 (interpersonal comparison): Nothing can be said. The utility functions are ordinal and not comparable across individuals.

  **Candid about limitations:**

  This principle accommodates all the verdicts 1-6 as stated, by reinterpreting the psychological state in 6a as the preference ordering (not the utility function). However, if one insists that the utility function must be a literal psychological state with cardinal values, then we must drop that half (6a) and stick to the behavioral interpretation: the utility function is only a representation. But then we might say that consistency reveals a formal property (the existence of an ordering) without committing to a psychological state.

  I recommend dropping the idea that the utility function (with cardinal values) is the psychological state. Instead, the psychological state is the preference ordering. Then we can keep both halves: the consistency reveals a real and stable preference ordering (the state), and the utility function is an ordinal representation of it.

  Thus, the principle unifies the cases.
answer: |-
  ### Unifying Principle: The Revealed Preference as Stable Ordinal Ordering

  After analyzing your cases, I propose a single principle that unifies your verdicts, grounded in the core tenets of revealed preference theory (Samuelson, Houthakker, etc.). The key insight is that revealed preference theory is fundamentally about inferring a **stable, ordinal preference ordering** from observed choices, where the ordering represents a consistent binary relation (e.g., "bundle A is weakly preferred to bundle B"). This ordering is the "real" psychological state revealed by choices, while the utility function is merely a numerical representation of it, unique only up to monotonic transformations. The utility function itself is not a literal psychological entity with cardinal meaning; it is a tool for modeling the ordering.

  #### The Principle Stated Precisely
  **Principle of Revealed Preference as Stable Ordinal Ordering (RPSOO)**  
  Choices reveal a stable, internal preference ordering over bundles (which may include composite goods like "soup + money" or "fruit + time") if and only if:  
  1. **Revelation Condition**: A choice of bundle A over bundle B directly reveals "A is strictly preferred to B" only when both are available and affordable in the same choice set. Choices made when alternatives are unavailable or in different sets do not directly reveal pairwise preferences.  
  2. **Consistency Condition**: The revealed preference relation must be consistent—specifically, it must satisfy the Strong Axiom of Revealed Preference (SARP). SARP requires that if A is revealed preferred to B (directly or through a chain of choices), then B is never revealed preferred to A. This ensures the relation is complete, transitive, and acyclic.  
  3. **Stability Condition**: The revealed preference relation persists across time and varying constraints (e.g., income, prices, availability), implying a fixed psychological ranking. Changes in choices due to constraint changes (e.g., income shifts) do not violate stability if they align with the underlying ordering.  
  4. **Ordinality Condition**: The utility function is a numerical representation of this stable ordering and is ordinal, meaning it is unique only up to monotonic transformations. Utility magnitudes (e.g., "U(A) = 10 vs. U(B) = 5") have no psychological reality; only the ranking they represent is real.  

  #### How RPSOO Explains Your Verdicts
  - **Case 1 (apples over oranges when both available)**: Motivated by the **Revelation Condition**. Choosing apples directly reveals "apples strictly preferred to oranges" because both are available and affordable. This reflects a genuine pairwise preference.  
  - **Case 2 (oranges when apples unavailable)**: Motivated by the **Revelation Condition**. Choosing oranges when apples are absent does not reveal "oranges preferred to apples" because apples were unavailable. It only reveals that oranges are preferred to other available options (e.g., no fruit), not to apples.  
  - **Case 3 (cyclical choices)**: Motivated by the **Consistency Condition**. Cyclical choices violate SARP (e.g., A > B > C > A implies intransitivity), so no stable ordering exists. This reveals no coherent preferences.  
  - **Case 4 (cheaper identical soup)**: Motivated by the **Revelation Condition** and how bundles are defined. The choice reveals a preference for the composite bundle "soup + remaining money" over alternatives. Since the soups are identical, the cheaper bundle leaves more money, making it strictly better. This is not about "cheap cans" but about ranking bundles with money.  
  - **Case 5 (less butter, more margarine with income rise)**: Motivated by the **Stability Condition**. The choices are consistent with a stable preference ordering where butter is an inferior good. Changes due to income shifts align with the fixed ordering under new constraints, so no incoherence is revealed.  
  - **Case 6 (consistent choices reveal real utility, but utility is ordinal)**: Motivated by the **Stability Condition** and **Ordinality Condition**. Consistency (SARP) reveals a stable psychological preference ordering (the "real" state). The utility function is ordinal, so its magnitudes are arbitrary, but this doesn't contradict the reality of the ordering—it simply means the utility function is a representation, not the state itself. RPSOO reconciles both halves: the ordering is real and stable, while utility is a modeling tool.  

  #### Verdicts on New Cases Using RPSOO
  - **Case 7: Person consistently takes smaller reward now over larger reward later**.  
    - **Verdict**: This reveals a stable preference ordering where "small reward now" is strictly preferred to "large reward later." The choice satisfies SARP (no cycles), so it is rational under RPSOO. It reflects time preference (a psychological state) captured by the ordering. Utility functions (e.g., hyperbolic discounting) would represent this ordinally.  
  - **Case 8: Person follows a fixed habit, leading to SARP-consistent choices, but without conscious ranking**.  
    - **Verdict**: RPSOO treats this as revealing a stable preference ordering. The theory is behaviorist: if choices satisfy SARP, they reveal an ordering, regardless of whether it arises from deliberation, habit, or heuristics. However, this highlights a limitation—RPSOO cannot distinguish "true" preferences from habits. It only captures choice consistency.  
  - **Case 9: Comparing utilities between people**.  
    - **Verdict**: RPSOO implies nothing can be inferred about interpersonal utility comparisons. Utility is ordinal and unique only up to individual-specific monotonic transformations. Choices reveal orderings within an agent, but without cardinal meaning, we cannot compare levels (e.g., "Alice enjoys soup more than Bob") or differences (e.g., "Alice gains more utility from cheaper soup").  

  #### Limitations and Candid Assessment
  - **Accommodating your verdicts**: RPSOO fully accommodates Cases 1–5 and reconciles Case 6 by clarifying that the "real" psychological state is the stable ordering, not the utility function.  
  - **What RPSOO cannot accommodate**: All your verdicts are consistent with RPSOO, but the tension in Case 6 arises from conflating "utility" as a psychological state with "utility" as a representation. RPSOO resolves this by dropping the idea that the utility function (with cardinal magnitudes) is a literal psychological state. Instead, it holds that:  
    - The **ordering** is real and revealed by consistency (your 6a).  
    - The **utility function** is a representation, arbitrary up to monotonic transformations (your 6b).  
    Thus, you should **drop the half of Case 6 that treats the utility function as a psychological state with determinate magnitudes**. This is not a flaw; it aligns with revealed preference theory's avoidance of cardinality.  

  - **Why this is necessary**: If utility were a real cardinal state, we would expect choices to reveal intensity (e.g., "I prefer apples twice as much"), but revealed preference theory deliberately avoids this. It focuses solely on ordinal rankings to maintain objectivity. Insisting on cardinal utility would undermine the theory's foundations and conflict with cases like 4 and 6b.  

  #### Final Recommendation
  Stick with RPSOO as your unifying principle. It captures the behavioral essence of revealed preference theory while allowing for a "realist" interpretation of preferences as stable psychological orderings. For your seminar, emphasize that:  
  - Rationality means choices are consistent with a stable ordinal ordering (SARP).  
  - Utility functions are useful representations but not psychological primitives.  
  - This approach avoids introspection and focuses on observable choices, but it cannot capture cardinal intensity, habits vs. "true" preferences, or interpersonal comparisons.  

  This principle elegantly unifies your cases and provides a clear framework for interpreting revealed preference. If you explore extensions (e.g., to risky choices), you might need additional axioms (e.g., von Neumann-Morgenstern), but RPSOO suffices for deterministic choice.
