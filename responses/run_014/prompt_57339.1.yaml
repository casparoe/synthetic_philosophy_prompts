answer: |-
  Based on the friend's adjudication of the given cases using Augustine's treatises on lying, her principle appears to align with **that every deliberate false assertion is a sin whose grade is fixed by a ranking in which lies touching sacred things sit near the top** (labeled **B**). This principle explains her verdicts as follows:
  - The Egyptian midwives and Rahab lied to protect life (a bodily good), making it sinful but mild, as the lies did not touch sacred matters.
  - The storyteller's invented episode is not a lie because there was no intention to deceive, so it falls outside the definition of a lie.
  - Feigning agreement with the Priscillianists is flatly forbidden because it involves a lie about faith (a sacred matter), making it gravely sinful regardless of the good intent.
  - The lie destroying an innocent's reputation is worse than protective lies due to the severe harm without benefit, but it does not touch sacred matters, so it is not as grave as lies about sacred things.

  For the new case—the priest lying to police about hearing a fugitive's confession to protect both the fugitive's life and the secrecy of the confessional—the ruling is predicted to be **gravely sinful**. The lie is a deliberate false assertion about a sacrament (a sacred matter), placing it high in the ranking of sin gravity. The good intentions (protecting life and the confessional seal) do not excuse it, as per the precedent of the Priscillianist case, where a lie for a spiritual good (exposing heresy) was forbidden. The priest's lie touches a sacred thing directly, elevating it beyond the mildness of bodily protective lies like Rahab's.

  ### Rival Readings Left Open by the Precedents
  The four verdicts leave open several interpretations, but the feigned heretic case refutes some:
  1. **Principle A (will to deceive, with gravity set by harm-benefit balance)**: Refuted by the feigned heretic case, where the good end (exposing heresy) did not excuse the lie. Harm-benefit balancing is rejected, so this reading does not survive without refinement (e.g., excluding sacred matters from such balancing).
  2. **Principle C (decisive question is which good is shielded, with spiritual goods licensing lies)**: Refuted by the feigned heretic case, where a lie for a spiritual good (exposing heresy) was forbidden. Spiritual goods do not license lies, so this reading does not survive without refinement (e.g., distinguishing between lying *about* sacred things vs. lying *for* them).
  3. **Refined Principle A (harm-benefit applies only to non-sacred lies)**: Survives as a rival to B, as the midwives/Rahab cases show mild sin for non-sacred protective lies, while the heretic case shows sacred lies are grave regardless of intent. This refinement is consistent with the verdicts.
  4. **Refined Principle C (spiritual goods may license lies only when not touching sacred matters)**: Survives as a rival, where lies for spiritual goods are allowed if they do not involve sacred topics (e.g., Rahab's lie for mercy, a spiritual good, was mild because it was not about sacred things). The heretic case is grave because it touched faith, so this refinement fits.
  5. **Principle D (gravity based solely on harm caused)**: The reputation-destroying lie (high harm) is worse than protective lies (low harm), but the heretic case refutes harm as the sole factor, as the lie was forbidden despite potential spiritual benefit. Thus, it needs refinement to include the sacred/non-sacred distinction.

  ### Discriminating Case
  The single further case that would most sharply separate the surviving candidates (B vs. refined A or refined C) is:  
  **A priest lying to a non-authoritative inquirer (e.g., a curious parishioner) about whether he heard a confession, solely to protect the seal, with no threat to life or other bodily harm.**  
  - Under **Principle B**, this lie touches a sacred matter (the confessional), so it would be gravely sinful regardless of the good intent (protecting the seal).  
  - Under **refined Principle A** (harm-benefit for non-sacred lies only), this lie has no physical harm and protects a spiritual good, so it might be ruled mild or even permissible (if harm-benefit favors it).  
  - Under **refined Principle C** (spiritual goods license non-sacred lies), this lie is about a sacred matter, so it would be grave, aligning with B. Thus, this case best distinguishes B/refined C from refined A.

  \answer{gravely sinful|B|A priest lying to a non-authoritative inquirer about whether he heard a confession, solely to protect the seal, with no threat to life.}
