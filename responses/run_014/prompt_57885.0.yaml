answer: |-
  Based on your roommate's verdicts, here's the breakdown for the Discord case prediction, following your requested structure:

  **Candidate Rules (Fitting all 5 Verdicts):**

  1.  **Cost-Relative Social Role + Baseline Trust:** This rule holds that the justification for accepting testimony depends on the perceived stakes/cost of being wrong and the testifier's apparent social role/context. Baseline trust is granted unless specific defeaters (reasons to doubt) are present. *High Stakes/Low Role Trust (Jailhouse Informant)*: High cost (wrongful conviction), low-trust role (incentivized liar), defeaters present (clear incentive to lie) → Unjustified. *Low Stakes/Appropriate Role (Passerby, AC Guy, Parent)*: Low cost (minor inconvenience), appropriate role (local, expert, primary caregiver), no defeaters → Justified. *Medium-High Stakes/Anonymous Source (Viral Thread)*: High cost (spreading misinformation), low-trust role (anonymous, unvetted internet source), inherent defeater (anonymity + virality risk) → Unjustified. *Child/Parent (High Stakes?)*: High epistemic stakes for child, but extremely high-trust role (primary caregiver), consistent reliability observed → Justified despite stakes.

  2.  **Reasonable Monitoring Anti-Reductionism:** This rule posits that we are *prima facie* justified in believing testimony unless we have specific, accessible reasons to doubt it. Crucially, the *reasonableness* of monitoring for defeaters is key and scales with context. *Passerby/AC Guy/Parent:* No accessible, specific doubts arise; it's unreasonable to demand ID or background checks for mundane info from seemingly appropriate sources → Justified. *Viral Thread:* Anonymity + virality are inherent, accessible reasons to doubt (easy to fake, motive to spread) → Unjustified without confirmation. *Jailhouse Informant:* Clear, accessible defeater (incentive to lie) is present → Unjustified. The child reasonably lacks the capacity for complex monitoring but observes consistent parental reliability in a relevant domain, fulfilling the "reasonable" aspect for her capacity.

  3.  **Hybrid Incentives/Plausibility in Context:** This rule focuses on the presence or absence of *conflicting incentives* for the testifier and the *contextual plausibility* of the claim relative to the audience's background knowledge. *Passerby:* No conflicting incentive (why lie?), claim plausible → Justified. *AC Guy:* Conflicting incentive (could upsell) mitigated by professional context & no red flags; claim plausible → Justified. *Parents:* No conflicting incentive; claim plausible based on child's trust built via everyday correctness → Justified. *Viral Thread:* High potential conflicting incentive (clout, mischief); low contextual plausibility (rumors common) → Unjustified. *Jailhouse Informant:* Clear conflicting incentive (reduced sentence); claim plausibility undermined by incentive → Unjustified.

  **What Each Predicts for the Discord Case:**

  1.  **Cost-Relative Social Role:** *Predicts JUSTIFIED.* Stakes are medium-high (safety during a chemical scare), but the testifier occupies an appropriate social role (fellow resident sharing vital community info). No defeaters observed (seems normal, plausible details, no argument). The shared context (apartment complex, emergency) creates an implied shared interest/social role, making belief reasonable without deeper vetting.
  2.  **Reasonable Monitoring Anti-Reductionism:** *Predicts JUSTIFIED.* The claim is urgent and plausible within the context. No specific, accessible reasons to doubt `unit4b` arise in the moment (no prior bad info, no suspicious behavior, details sound plausible, community tacitly accepts). Demanding prior verification of `unit4b`'s track record during an emergency is unreasonable monitoring.
  3.  **Hybrid Incentives/Plausibility:** *Predicts JUSTIFIED.* Conflicting incentives are unlikely – why would a fellow resident deliberately mislead about safety during a local emergency? The claim is highly plausible given the context (known smell scare, need for shelter). No red flags (detailed, plausible, unchallenged).

  **Best Bet:**

  Your roommate is **most likely running the "Cost-Relative Social Role + Baseline Trust" rule (Rule 1)**. This best explains the nuance in her verdicts, particularly:
  *   **Jailhouse Informant vs. AC Guy:** She sharply distinguishes based on the inherent low-trust role/jail context vs. professional role/context, even though both involve potential incentives. The role/context is paramount.
  *   **Viral Thread vs. Passerby:** She heavily weights the *context* of the source (anonymous internet virality vs. face-to-face local interaction) as a defeater, more than just anonymity alone.
  *   **Child/Parent:** She emphasizes the *role* (parent) and *observed reliability within that role* as justifying belief even on complex topics, fitting the "appropriate role" aspect perfectly.
  The Discord case fits neatly into this: the "fellow resident during community emergency" is deemed an appropriate social role with shared interests, justifying belief despite anonymity within the platform and medium-high stakes.

  **Splitter Case:**

  **The Scenario:** You see a well-dressed person confidently giving detailed, impromptu historical facts about a specific painting *inside* a major, reputable art museum. They aren't staff (no badge), but they sound knowledgeable and their facts seem plausible. Stakes are low (just your personal curiosity). You have no reason to think they're lying, but also no confirmation they're an expert.

  *   **Rule 1 (Cost-Relative Social Role):** Likely **UNJUSTIFIED** to believe outright. The social role is ambiguous (not staff, just a visitor). While the museum context adds some credibility, the lack of a clear role (like a docent) combined with the specific expertise required acts as a mild defeater. Low stakes mean it's reasonable to remain skeptical or seek slight confirmation.
  *   **Rule 2 (Reasonable Monitoring):** Likely **JUSTIFIED** to believe. No specific defeaters are accessible (they sound plausible, context is appropriate). It would be unreasonable to demand credentials for low-stakes trivia in this setting. Baseline trust applies.
  *   **Rule 3 (Incentives/Plausibility):** Likely **JUSTIFIED** to believe. Low stakes, no apparent conflicting incentive to lie, high contextual plausibility (in a museum, talking accurately about art).
