  For the Discord case: The stakes are high (chemical emergency), the testifier is a neighbor (shared interest), and the information is specific and plausible. All rules would likely say it's justified to believe this, though for slightly different reasons.

  For the best bet, I think Cost-Relative Social Role fits best because it explicitly considers the emergency context and community membership.

  For a splitter case to distinguish the top two rules, I'd propose something with medium stakes where social roles are ambiguous but incentives are clean - like a museum docent giving an unexpected fact.

