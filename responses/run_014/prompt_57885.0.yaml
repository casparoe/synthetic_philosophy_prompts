  Looking at the roommate's verdicts: She's okay with believing a random passerby about directions, a child believing parents about dinosaurs, and an AC repair person about technical issues. But she rejects believing viral rumors or jailhouse informants without corroboration. The key differences seem to be about stakes, expertise, and potential biases.

  For candidate rules, I'm thinking about three possibilities that fit all five verdicts:
