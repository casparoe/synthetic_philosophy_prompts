prompt: |-
  I've been keeping a little list of arguments people around me have gotten into, plus my gut verdict on whether each one is "just about words," and I've realised my verdicts might not add up to anything coherent. Help me figure out if there's a principle here or if I'm just winging it.

  The cases and my verdicts:

  1. My sister (botanist) and her husband (line cook) on whether a tomato is a fruit. Verdict: totally verbal, there's nothing left over once you know which sense each is using.

  2. A guy in my reading group who insists only simples exist -- there are atoms arranged chairwise, but no chair -- against everyone else in the room. Verdict: verbal. I don't think he disagrees with us about anything except which sentences to utter.

  3. Whether Australia is a continent or just a really big island. Verbal, same as the tomato.

  4. Whether a fetus is a person, between my very religious uncle and my atheist cousin at Thanksgiving. Verdict: NOT verbal. That's a real moral fight, and it drives me nuts when people wave it off as semantics.

  5. Whether a chess engine that plays better than any human "really understands" chess. Verdict: honestly I keep flip-flopping, this is the one I'd most like a principle to settle.

  6. My finitist friend says there's no completed totality of all natural numbers; everyone else thinks there obviously is. Verdict: not verbal -- someone here is wrong about math, not about words. Though I'm less sure of this one than I sound.

  The chair guy from #2 claims the fetus case is verbal too: "person" is a term of art, the uncle and cousin are just running it with different thresholds, exactly like "fruit." I refuse, but I can't say why without sounding arbitrary. My tentative test was: a dispute is verbal when, once each side fully grasps the other's usage, nothing is left to disagree about. But the uncle and cousin DO fully grasp each other's usage -- their leftover fight is about moral status -- so by my test they're verbal too. Unless "verbal" secretly means two things: disputes with nothing left over, versus disputes where the leftovers are somebody else's problem (ethics, not semantics)?

  So: is there a principle that gets all my verdicts, especially #4 against #1 and #2? If you have to overturn one of my verdicts, tell me which and why. And say what the principle predicts for the chess engine and the finitist, since those are the ones I can't decide. Lead with your bottom line in the first sentence, then give me the reasoning -- no preamble, no restating my question back at me.
reasoning: |-
  Okay, the user has presented several arguments and their verdicts on whether each dispute is "just about words" or involves a substantive disagreement. They want to know if there's a consistent principle behind their verdicts or if they're being arbitrary. The key cases are the tomato/fruit debate (verbal), the existence of chairs (verbal), Australia as a continent (verbal), the fetus as a person (not verbal), chess engine understanding (undecided), and mathematical finitism (not verbal).

  Looking at these cases, I need to identify a principle that distinguishes verbal disputes from substantive ones. The user's tentative test is that a dispute is verbal when nothing remains to disagree about once each side understands the other's usage. However, this test seems to make the fetus case verbal too, which contradicts the user's verdict. So this test needs refinement.

  I recall a concept from philosophy called "verbal disputes" versus "substantive disagreements." A verbal dispute occurs when parties agree on all the facts but differ in terminology. For example, with the tomato, both agree on its biological classification and culinary use—they're just labeling it differently. The same applies to the chair example: both sides agree about the physical arrangement of atoms but disagree on whether to call it a "chair." Similarly, the Australia case is about classification within geographical terminology.

  The fetus case is different. Here, the disagreement isn't about the biological facts of fetal development. Both sides likely agree on these scientific details. Instead, they're disputing what moral significance to attach to those facts—specifically, whether a fetus possesses personhood with associated rights. This involves fundamental differences in values and ethics, not just word usage. Even if they understand each other's definitions, they still disagree on the moral implications.

  For the chess engine, whether it "understands" chess depends on how we define "understanding." If we define it purely behaviorally (playing well), then it does understand. But if understanding requires consciousness or subjective experience, then it doesn't. This disagreement rests on deeper philosophical issues about the nature of mind and cognition, making it substantive rather than verbal.

  The finitist argument about natural numbers involves a fundamental disagreement in mathematics. Finitists reject the existence of actual infinities, unlike mainstream mathematicians. This isn't about terminology but about what mathematical entities exist—a substantive ontological disagreement.

  The principle I'm using is: **A dispute is verbal if the disagreement vanishes once terminology is clarified, with no remaining factual, evaluative, or ontological differences.** Applying this:
  - Tomato, chair, Australia: Only terminology differs; facts are agreed upon.
  - Fetus: Dispute remains over moral values after clarifying definitions.
  - Chess engine: Dispute remains over the nature of understanding (ontological/definitional).
  - Finitism: Dispute remains over mathematical ontology.

  This principle explains why the fetus case isn't verbal—it's about conflicting values, not words. For the chess engine, it's not verbal because different definitions of "understanding" reflect deeper philosophical divides. Finitism isn't verbal because it concerns what exists in mathematics. This approach maintains all the user's verdicts except possibly requiring a stance on the chess case as not verbal. The user can then apply this principle consistently to similar disputes.
answer: |-
  **Bottom line: Your verdicts are mostly coherent under this principle: A dispute is verbal iff it dissolves entirely once both sides *explicitly define their terms and agree on all non-linguistic facts*, leaving no disagreement about reality, values, or norms. Otherwise, it's substantive.** This principle preserves all your verdicts (#4 isn't verbal) and resolves your uncertainties.

  ### Reasoning:
  1.  **#1 (Tomato/Fruit), #2 (Chair/Simples), #3 (Australia): Verbal.** All dissolve under explicit definitions:
      *   Once "fruit" is specified as botanical vs. culinary, both sides agree on the tomato's properties. No leftover factual or normative disagreement.
      *   Once "exists" is specified as fundamental ontology vs. everyday talk, both sides agree on the atoms-arranged-chairwise. No disagreement about the physical setup.
      *   Once "continent" vs. "island" definitions are fixed (geological, cultural, size-based), both sides agree on Australia's physical characteristics. No deeper conflict.

  2.  **#4 (Fetus/Person): NOT Verbal.** It survives explicit definitions:
      *   Suppose the uncle defines "person" as "entity with a soul from conception" and the cousin defines it as "entity with advanced cognitive capacities." They *agree* on the biological facts of fetal development.
      *   **The leftover disagreement is about *which characteristics grant moral status/rights*.** This is a fundamental ethical conflict over what *ought* to be protected, not a linguistic one. Your test ("grasp usage but still disagree") reveals substance here.

  3.  **Your Test Refined:** The issue isn't just "grasping usage" but whether agreement on usage *and all non-linguistic facts* eliminates the conflict. In #4, agreement on biology + definitions leaves the moral conflict intact. In #1-3, agreement on the relevant facts (tomato structure, atomic arrangement, landmass properties) + definitions resolves it. "Verbal" doesn't mean "leftovers are someone else's problem"; it means *no relevant leftovers exist for the dispute's core issue*.

  4.  **#5 (Chess Engine "Understanding"): NOT Verbal (by this principle).**
      *   Define "understanding": Is it behavioral competence (plays perfectly)? Phenomenal consciousness ("feels" like thinking)? Biological cognition? Abstract symbol manipulation?
      *   Parties *agree* on all the engine's operations and outputs (non-linguistic facts).
      *   **The leftover disagreement is about *which phenomena the concept 'understanding' properly applies to*.** This is a conceptual/ontological dispute about the nature of mind and cognition, not *just* word choice. It won't dissolve with definitions; it hinges on what "understanding" *is* or *requires*.

  5.  **#6 (Finitism): NOT Verbal (as you judged).**
      *   Define "exists" or "totality": Is it about physical instantiation, mathematical abstraction, potential vs. actual infinity?
      *   Parties *disagree* on fundamental mathematical reality (non-linguistic facts about abstract entities). The finitist denies the *coherence* or *meaningfulness* of completed infinite sets, even granting standard definitions. This is an ontological disagreement about mathematics itself.

  ### Why #4 is Different from #1-#3 and Why the Chair Guy is Wrong
  *   The chair guy (#2) reduces everything to semantics. He's wrong about #4 because:
      *   **#1-#3 Disagree on Labeling Agreed-Upon Stuff:** Everyone agrees on the tomato's biology, the atoms, Australia's geography. The fight is *only* about which word/label applies.
      *   **#4 Disagrees on What Stuff *Matters*:** Both sides agree on the fetus's biology (the "stuff"). The fight is about *which biological characteristics confer moral personhood* – a normative question independent of labeling. Defining "person" clarifies positions but doesn't resolve which definition *ought* to be used for moral/legal purposes. The "thresholds" aren't arbitrary semantic choices; they reflect deep value judgments.

  ### Principle Applied to Your Cases:
  | Case | Verbal? | Why? |
  |-------|---------|------|
  | 1. Tomato | Yes | Agree on biology; only labels differ. |
  | 2. Chair | Yes | Agree on physical atoms; only "exists" usage differs. |
  | 3. Australia | Yes | Agree on geography; only classification scheme differs. |
  | 4. Fetus | **No** | Agree on biology; **disagree on moral foundations of personhood**. |
  | 5. Chess Engine | **No** | Agree on engine's behavior; **disagree on nature/requirements of "understanding"**. |
  | 6. Finitism | **No** | **Disagree on mathematical ontology**; not resolved by defining "totality". |

  You weren't winging it – your instincts tracked a real distinction. The key is whether the *core conflict* evaporates when language is clarified *and* shared facts are acknowledged. #4 fails this because ethics remains; #5 and #6 fail because ontology/conceptual foundations remain.
