  ### Recommendation for Ledger

  The committee must resolve the split on **Ledger** by clarifying the underlying principle governing our keys. I propose adopting the **correct belief rule** as our consistent principle, which keys the probability the agent ought to believe given their information at the moment of reporting. This rule explains all prior rulings and applies cleanly to Ledger. Below, I detail the analysis, candidate rules, Ledger recommendation, and a decisive new vignette.  

  ---

  ### **Candidate Rules**  
  Two principles emerge from our record. Both explain most rulings, but only one reconciles all four vignettes:  

  1. **Correct Belief Rule (CBR)**:  
     The key is the *epistemic probability* the agent ought to assign to the event, given their current information. This is independent of the scoring engine.  

  2. **Point-Maximizing Report Rule (PMR)**:  
     The key is the report that *maximizes expected points* under the scoring engine active at the time of reporting.  

  ---

  ### **Reconciliation of Prior Rulings**  
  | Vignette      | Key  | CBR Fit? | PMR Fit? | Notes |  
  |---------------|------|----------|----------|-------|  
  | **Lamp**      | 1/2  | Yes      | No       | CBR: Multiple prompts don’t change the coin’s fairness (belief: 1/2). PMR fails: Under three prompts in tails, PMR would be 1/4 (not keyed). Patching the vignette affirmed CBR. |  
  | **Two Doors** | 1/3  | Yes      | Yes      | CBR: Agent is equally likely to be in any of three questionings (1 heads, 2 tails → 1/3). PMR: Under old engine (score all reports), 1/3 maximizes points. Both align. |  
  | **Prelude**   | 1/2  | Yes      | Yes      | CBR: Pre-protocol, coin is fair (1/2). PMR: Single report maximizes points at 1/2. Both align. |  
  | **Told First**| 1/2  | Yes      | Yes      | CBR: Told "first questioning" → heads and tails equally likely (1/2). PMR: Under old engine, 1/2 maximizes points (see calc below). Both align. |  

  - **PMR Calculation for Told First**:  
    - Heads (prob 1/2): Score = \(1 - (1-p)^2\).  
    - Tails (prob 1/2): Score = \(1 - p^2\) (first report) + \(1 - (1/3)^2\) (second report, fixed at 1/3).  
    - Expected score: \(\frac{1}{2}[1 - (1-p)^2] + \frac{1}{2}[(1 - p^2) + \frac{8}{9}]\). Maximized at \(p = 1/2\).  

  **Inconsistency in PMR**:  
  - **Lamp resists reconciliation under PMR**. The key was 1/2, but PMR would require 1/4 under the original three-prompt design. By patching Lamp instead of changing the key, we implicitly rejected PMR.  

  **Closest Analog to Ledger**:  
  - **Two Doors** is the direct analog. Both share identical protocols (memory erasure, questioning structure). The only difference is Ledger’s payment engine. Under CBR, the agent’s information is identical → key should be identical (1/3).  

  ---

  ### **Recommendation for Ledger**  
  - **Key**: **1/3** (single key under CBR).  
  - **Principle**: Keys reflect the agent’s correct belief (CBR), not point-maximization.  

  **Justification for Losing Side (PMR Advocate)**:  
  - Our record shows CBR as the *de facto* standard. In Lamp, we keyed 1/2 despite PMR suggesting 1/4, then patched the vignette to avoid misalignment. If we adopted PMR now:  
    - We would need to retroactively change Two Doors’ key to 1/2 (contradicting the chair’s minute and research dataset).  
    - Prelude’s minute ("key indexed to moment of asking") refers to the *agent’s information*, not the engine.  
  - Pragmatically, keying 1/2 in Ledger would:  
    - Invalidate the Two Doors dataset (1/3 vs. 1/2 keys for identical information).  
    - Signal to clinical residents that beliefs should adjust to engine quirks (undermining training).  
  - The engine is miscalibrated but fixable later; the key must preserve research integrity.  

  **Impact on Precedents**:  
  - **Chair’s Two Doors Minute**: Upheld. "Agent should expect to be one of the twice-asked" remains the correct CBR justification for 1/3.  
  - **Rejected Lamp Petition**: Upheld. Being "asked again" did not lower the key because information (and belief) was unchanged.  
  - **Interpretability**: Keying 1/3 ensures the dataset measures true beliefs, even if the engine incentivizes 1/2. We can note the engine issue in documentation and prioritize a fix.  

  **If Forced to Adopt PMR**:  
  - Keying 1/2 would require:  
    - Retracting the Two Doors key (1/3 → 1/2) and chair’s minute.  
    - Revising the Lamp petition rejection (since PMR would have lowered the key).  
    - Fragmenting the dataset: Identical agent states (Two Doors vs. Ledger) would have different keys.  

  ---

  ### **Tiebreaking Vignette: Biased Protocol**  
  To force CBR and PMR apart:  
  - **Setup**: Biased coin (heads 1/3, tails 2/3). Heads: 1 questioning. Tails: 2 questionings (memory wiped). At each questioning, the agent is told whether it’s the "first" or "second" in the sequence.  
  - **Question**: Probability of heads when told "second" (only possible in tails).  
  - **CBR Key**: **0** (tails certain).  
  - **PMR Key (under Ledger-like averaging engine)**: Non-zero. Maximizing points requires hedging (e.g., 0.2) because:  
    - "First" reports (always tails) anchor the average.  
    - "Second" reports can marginally improve the score if heads were possible.  
  - **Test**: If our intuition keys 0, CBR is affirmed. If non-zero, PMR prevails.  

  Adopt this vignette to resolve the split.  

  ---

  ### **Summary**  
  - **Rule**: **CBR** (correct belief) explains all prior keys; PMR fails in Lamp.  
  - **Ledger Key**: **1/3** (consistent with Two Doors).  
  - **Engine Issue**: Flag for repair, but don’t bend the key.  
  - **Next Step**: Pilot **Biased Protocol** to empirically test the rule.  

  This maintains research continuity, upholds precedents, and offers the losing side a clear empirical test.
