  ### In-Class Game: **The Arbitrary Utility Challenge**

  #### **Learning Objectives**
  1. **Ordinality of Utility**: Revealed preferences over certain outcomes recover only an ordering; numerical utilities are arbitrary up to monotonic transformation.
  2. **Ordinal vs. Cardinal Gap**: The ordinal utility derived from certainty choices cannot predict choices under risk because "distances" between utilities are arbitrary.

  ---

  ### **Setup & Roles**
  - **Agent (1 student)**: Makes choices between certain outcomes (A, B, C) and later a risky lottery.
  - **Modeler (1 student)**: Observes the Agent’s choices, assigns utility numbers, and predicts the Agent’s risky choice.
  - **Class (14 students)**: Acts as "validators." After the Agent’s choices, they vote on the risky choice to demonstrate heterogeneity in risk attitudes.

  #### **Outcomes & Payoffs (Hypothetical, No Real Money)**
  - **Outcomes**:  
    - **A**: "Free coffee for a week"  
    - **B**: "1-hour nap pass"  
    - **C**: "A fancy pen"  
    (Choose relatable, distinct rewards to ensure clear preferences.)
  - **Payoff Scheme**:  
    - Students imagine receiving the rewards. The Agent’s choices are binding for in-class discussion (but hypothetical).  
    - **Risk Choice**: Lottery = 50% chance of A, 50% chance of C vs. **B** for sure.

  ---

  ### **Timeline (60 Minutes Total)**

  | **Time** | **Activity**                                                                                                                                 |
  |----------|----------------------------------------------------------------------------------------------------------------------------------------------|
  | **0–5 min** | **Intro**: Explain the game. Assign roles (Agent, Modeler). Describe outcomes A, B, C. Emphasize: "We’re modeling real choices, but no real payoffs." |
  | **5–15 min** | **Revealed Preference (Certainty)**:<br> 1. Agent makes pairwise choices:<br>    - A vs. B<br>    - B vs. C<br>    - A vs. C.<br> 2. Modeler records choices and assigns arbitrary utility numbers to A, B, C (e.g., U(A)=100, U(B)=60, U(C)=10). |
  | **15–20 min** | **Modeler’s Prediction**:<br> 1. Modeler calculates expected utility (EU) of lottery (0.5U(A) + 0.5U(C)) and compares to U(B).<br> 2. Modeler predicts Agent’s choice: lottery or B? |
  | **20–25 min** | **Agent’s Risky Choice**:<br> Agent chooses between lottery (50% A, 50% C) and B.|
  | **25–30 min** | **Class Vote**:<br> Poll class: "If you had the same preferences as the Agent, would you choose the lottery or B?" Record votes. |
  | **30–60 min** | **Debrief**: Discuss ordinality, prediction failure, and cardinality gap (detailed below). |

  ---

  ### **Debrief: Mapping Moments to Concepts**
  1. **Revealed Preference & Ordinality (5 min)**:
     - **Key Moment**: Modeler arbitrarily assigns utilities (e.g., U(A)=100, U(B)=60, U(C)=10).  
     - **Point**: These numbers reflect only *ordering* (A > B > C). Ask:  
       - "Could U(A)=200, U(B)=199, U(C)=0 represent the same preferences?" (Yes, via monotonic transformation.)  
       - "Why did the Modeler’s numbers feel 'made up'?" (No meaning beyond order.)

  2. **Prediction Failure & Cardinality Gap (15 min)**:
     - **Key Moment**: Modeler’s prediction of the risky choice fails.  
       - *Example*: Modeler calculates EU(lottery) = 55, U(B)=60 → predicts B. But Agent chooses lottery.  
     - **Point**:  
       - Ordinal utilities ignore "intensity" of preference (e.g., how much A is preferred over B).  
       - Risk choices depend on *cardinal* utility (distances matter). Show:  
         - If U(A)=100, U(B)=99, U(C)=0 → EU(lottery)=50 < U(B)=99 → predicts B.  
         - But if U(A)=100, U(B)=50, U(C)=0 → EU(lottery)=50 = U(B) → predicts indifference.  
       - The same ordinal preferences yield conflicting risk predictions → **ordinal utility is insufficient for risk**.

  3. **Class Vote & Heterogeneity (5 min)**:
     - **Key Moment**: Class splits votes on risky choice (e.g., 60% choose B, 40% lottery).  
     - **Point**: Identical ordinal preferences (A>B>C) mask divergent risk attitudes (aversion/seeking). Cardinal utilities (from risk choices) resolve this.

  4. **Philosophical Wrap-Up (5 min)**:
     - **Ordinal Utility**: From revealed preference under certainty.  
     - **Cardinal Utility**: Needed for risk; requires observing choices over lotteries (VNM theory).  
     - **Economics vs. Philosophy**: Economists often "assume" cardinality via VNM axioms; philosophers question if preferences are measurable beyond order.

  ---

  ### **Predictable Challenges & Solutions**
  1. **Intransitive Preferences (Bug → Feature!)**:
     - **Risk**: Agent might violate transitivity (e.g., choose A > B, B > C, but C > A).  
     - **Exploit It**: Use this to show ordinal utility *requires* transitivity. If violated, we can’t even assign an ordering! Discuss rationality axioms.

  2. **Modeler’s Prediction Fails "Too Easily"**:
     - **Risk**: Agent might align with Modeler’s prediction (e.g., both choose B).  
     - **Solution**: Use the class vote to show heterogeneity. Ask: "Why did most of you choose differently from the Modeler’s calculation?" Highlight arbitrary distances.

  3. **Agent’s Risk Attitude**:
     - If Agent is risk-neutral, Modeler’s linear utility "works" by luck. Stress: Modeler had no basis to assume linearity — it was arbitrary.

  ---

  ### **Limitations & What You Must Explain**
  - **What the Game Cannot Do**:  
    It does **not** derive cardinal utility from risk choices (VNM’s contribution). You must explain:  
    - VNM axioms (completeness, transitivity, continuity, independence) allow cardinal utility construction.  
    - Cardinal utility is unique up to affine transformations (u → a + bu), preserving "distances."  
  - **Bridge the Gap**:  
    - "Today, we saw ordinal utility fails for risk. Next, we’ll see how VNM uses lotteries to recover cardinal utility."

  ---

  ### **Why This Works**
  - **Active Learning**: Students experience utility as a "constructed model," not a psychological truth.  
  - **Dual Revelation**:  
    1. Ordinality via certainty choices → arbitrary utilities.  
    2. Cardinality gap via failed risk prediction → need for richer data.  
  - **Low Tech/Prep**: Uses paper, whiteboard, and imaginary rewards.  

  Run this once, and students will viscerally grasp why economists need VNM!
