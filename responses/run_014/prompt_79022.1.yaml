prompt: |-
  I'm a TA for a grad seminar in formal ethics -- 14 students, 90 minutes, one room with a whiteboard and a stack of index cards. They've all done expected utility theory and they've read Rawls, and the session I'm building is on Harsanyi's aggregation theorem. What I want them to feel in their bones is the move that does all the work: put everyone behind a veil of ignorance, let them rank policies from a position where they have an equal chance of ending up as any one of the affected people, and -- assuming their preferences satisfy the expected utility axioms -- they'll all agree on a ranking, and the ranking they agree on is the one that maximizes the sum of individual utilities. It looks like it proves utilitarianism from a premise most of them think of as anti-utilitarian, and every year they nod along and then can't say why it doesn't just settle the question. I also want them to run into the thing that happens afterwards: the same people, once they know which life they actually landed in, stop agreeing with the choice they unanimously made ex ante. So the unanimity behind the veil can be produced entirely by everyone having the same attitude to risk rather than by any real agreement about who should get what, which is a weirdly thin kind of agreement to build an ethics on. I don't want to announce either point. The word "utilitarian" shouldn't come out of my mouth until the debrief.

  So design me a runnable activity, not a lecture. They should be the ones who generate the unanimity -- I want them to write their rankings down and then discover the agreement is already there, and I want the ex ante / ex post crack to open up from something that actually happens in the room, not from me telling them about it. No real money; points or chits are fine, and if there's randomization it has to be something they can watch happen (drawing cards, a spinner, whatever). It has to survive 14 people in one room for 90 minutes, and it has to be honest about what it can't show -- I'd rather have a field telling me which piece of the theorem the game just can't reproduce than have the game quietly pretend to do the proof.

  Give me the whole thing as a JSON object, each field a string unless I say otherwise: "activity_name"; "overview" (2-3 paragraphs of prose on how it runs, start to finish); "participants_and_timing"; "materials" (array of strings); "setup_script" (what I say before anything starts, which must not name Harsanyi, utilitarianism, or the veil); "payoff_scheme" (the chits/points scheme, how a person's score gets determined, and exactly what's random); "timeline" (array of objects with "minutes", "beat", "what_happens", "what_i_do"); "the_moment_it_lands" (where the unanimity should show up and what I should be looking for on the board); "the_second_moment" (where the ex ante / ex post split should bite and how to stage it so they feel it instead of hearing it); "debrief" (array of strings, in order, each tied to something that actually happened in the room); "predictable_failures" (array of objects with "what_goes_wrong" and "what_to_do", at least three, and be specific -- I want to know the one where two students just refuse to play along); "what_the_activity_cannot_reproduce" (specific and honest); "one_line_thesis" (the sentence I want them walking out with).
reasoning: |-
  We are designing an activity that illustrates Harsanyi's aggregation theorem without naming it, and focuses on the veil of ignorance and the ex ante / ex post split.
   The key points:
     - Students rank policies from behind a veil of ignorance (equal chance of being any person).
     - They have preferences satisfying expected utility axioms -> they'll all agree on a ranking that maximizes the sum of utilities.
     - Then, after the veil is lifted (they learn who they are), they might disagree with the ex ante choice.

   Activity structure:
     - We have 14 students. We need a scenario with multiple "lives" (social positions) and policies that assign utilities to these lives.
     - We'll let each student be one of the "affected people" in the society. But note: in the veil, they don't know which one they are.

   How to run:
     - We'll have a small society. Let's say 3 types of lives (A, B, C) to keep it manageable. We have 14 students, so we can assign multiple students to the same type? 
       But note: in the veil, each student is equally likely to be any one of the 3 types? Actually, the society has 14 people, but they are of 3 types? We can have a society of 3 roles, but with multiple people in each role? 
       Alternatively, we can have 3 roles and each role has a utility. Then, in the veil, each student has 1/3 chance of being any role? But then when we reveal, we assign each student to a role? But then there are 14 students and 3 roles -> we can have multiple students per role.

     - Alternatively, we can have a society of 3 people (with fixed utilities for each) and then we have 14 students each taking the role of one of these 3? But then we have 14 students and 3 roles -> we assign multiple students to the same role.

     - We want to have policies that assign different utility distributions to the three roles.

     - We'll have two policies to choose from (for simplicity). We want one that is the utilitarian choice and one that isn't.

     - Steps:

       Step 1: Setup
          - Explain that we have a society with 3 types of people: Type A, Type B, Type C. (We can call them by colors or professions to make it concrete, e.g., Farmer, Artisan, Merchant)
          - There are two policies: Policy X and Policy Y. Each policy assigns a certain number of points (utility) to each type.

          Example:
            Policy X: A: 10, B: 10, C: 10   (equal)
            Policy Y: A: 15, B: 15, C: 0     (but note: we want the utilitarian one to be the one with higher sum? Let's design so that the utilitarian choice is clear.)

          We want the utilitarian policy to be the one with the higher total. So let Policy X: A: 10, B: 10, C: 10 -> total 30.
          Policy Y: A: 20, B: 20, C: 0 -> total 40. So Policy Y has higher total but leaves C with 0.

          But note: in the veil, each has 1/3 chance of being A, B, or C. So for Policy X: expected utility = (10+10+10)/3 = 10.
          Policy Y: (20+20+0)/3 = 13.33. So they should prefer Y.

       Step 2: Behind the veil
          - Each student is told that they will be randomly assigned to one of the three types (A, B, C) with equal probability (1/3 each).
          - They are to rank the policies without knowing which type they will be. They write down their ranking (which policy they prefer) on an index card. Also, they can write their expected utility for each.

          We expect they will all prefer Policy Y because it has higher expected utility.

       Step 3: Reveal the rankings
          - Collect the cards and tally: everyone should have ranked Y over X.

       Step 4: The assignment
          - Now, we assign each student to a type. We use a random method (drawing from a hat with 1/3 of the slips for A, 1/3 for B, 1/3 for C). Since we have 14 students, we can have 14 slips: 5 A, 5 B, 4 C? (to get as close to 1/3 as possible) or 5,5,4 is 14. Then we draw one slip per student.

          But note: we have 14 students and 3 types. We want each student to be assigned independently? Actually, we can have a bag with 14 balls: 5 of color A, 5 of B, 4 of C. Then each student draws one without replacement? But then the probabilities are not independent. Alternatively, we can have independent draws: put the slip back? But that might be messy. Instead, we can use a spinner or dice to assign each student independently.

          Alternatively, we can have a deck of cards: we have 14 students. We can use a deck of 14 cards: 5 A, 5 B, 4 C. Shuffle and each student gets one. Then the assignment is without replacement, so the distribution is fixed. The probability for each type is approximately 1/3? 5/14≈0.357, 4/14≈0.286. Close enough? We can adjust to 5,5,4 and explain that the probabilities are about 1/3.

          Or, we can do independent assignment: for each student, roll a die. But we need 3 outcomes. We can use a die: 1-2 -> A, 3-4 -> B, 5-6 -> C. That's 1/3 each. Then we do this for each student. This is independent and exactly 1/3.

          We'll go with the die: for each student, roll a 6-sided die. 1-2: A, 3-4: B, 5-6: C.

       Step 5: After the assignment (ex post)
          - Now each student knows which type they are. We then ask: "Now that you know your type, which policy do you prefer?"

          - We expect:
            Type A: in Policy X: 10, in Policy Y: 20 -> prefer Y.
            Type B: same as A -> prefer Y.
            Type C: in Policy X: 10, in Policy Y: 0 -> prefer X.

          So we will see disagreement: Types A and B prefer Y, Type C prefers X.

       Step 6: Compare ex ante and ex post.

       We must note: the activity does not require the students to have vNM utility functions because we are directly assigning utilities (points) to outcomes. We are assuming that the points are linear in utility (so no risk aversion or risk seeking). This is a simplification.

       Materials:
          - Index cards (one per student)
          - Whiteboard to write the policies and record results
          - A die (or two if we want to go faster) for random assignment.

       Timeline:
          90 minutes total.

          Setup: 10 min
          Veil of ignorance ranking: 10 min (they write their ranking and expected utility calculation)
          Collect and tally: 5 min -> The Moment: Unanimity for Policy Y.
          Random assignment: 10 min (roll for each student, record their type on the board and give them a token for their type? or just write it on their card)
          Ex post ranking: 5 min (they write their ex post preference on a new card? or we can do a show of hands)
          Collect and tally ex post: 5 min -> Second Moment: Disagreement appears.
          Debrief: 45 min (we have time for a rich discussion)

       Predictable failures:
          - Some students might not calculate expected utility correctly: they might think that Policy Y is too risky because of the 0. We can remind them that they are expected utility maximizers and they should calculate the expected value.
          - Two students refuse to play: we can assign them a type arbitrarily and note that in the debrief that we are assuming rational agents. Or we can use their cards as they are and note that the unanimity might not be 100%, but that would be a teaching moment about the assumptions.
          - The ex post preference: Type C might still prefer Y? Because they are altruistic? We have to accept that. Then we note that the theorem assumes self-interest.

       What the activity cannot reproduce:
          - The theorem assumes that individuals have von Neumann-Morgenstern utility functions and that they are self-interested. In the activity, we assign utilities and assume that the points are the utility. But in reality, individuals might have different risk attitudes. We are not eliciting their utility functions, we are assigning them.
          - Also, the theorem is about social welfare being the sum of individual utilities. We are showing that ex ante expected utility maximization leads to the same ranking as maximizing the sum, but we haven't proven the theorem in full generality.

       One-line thesis: "When we choose policies from behind a veil of ignorance, we may achieve unanimity by maximizing expected utility, but that unanimity vanishes when the veil lifts, revealing that our agreement was only about risk, not about distributive justice."

       Let's design the payoff scheme: we are using points. We can tell them that the points represent how well-off they are in that life under that policy. And they are to maximize their own points.

       Policies:

          Policy X: 
            Type A: 10 points
            Type B: 10 points
            Type C: 10 points

          Policy Y:
            Type A: 20 points
            Type B: 20 points
            Type C: 0 points

       We can also add a third policy to make it more interesting? But with two we can show the point. We want to avoid complexity.

       Alternatively, we can have a policy that is not the utilitarian one but might be preferred by some if they were risk averse? But we are assuming linear utility. So let's stick with two.

       Overview:

          The activity is called "The Policy Game". Students are members of a society with three social roles. They must choose between two policies that distribute points (representing well-being) differently across the roles. First, they choose behind a veil of ignorance (not knowing which role they will occupy). Then, roles are randomly assigned, and they choose again with full knowledge of their role. The activity reveals that behind the veil, they unanimously prefer the policy that maximizes the average (and total) points, but after the assignment, those assigned to the role that gets zero points in the high-total policy disagree.

       Participants and Timing: 14 students; 90 minutes.

       Materials: 
          - Index cards (at least two per student)
          - Markers for whiteboard
          - Whiteboard
          - One 6-sided die (or more to speed up)
          - A bag or hat for drawing (if we go that route, but we are using a die so no bag needed)

       Setup script:

          "Today we're going to do a decision-making activity. Imagine we are designing policies for a small society. There are three types of people in this society: let's call them Type A, Type B, and Type C. We have two policy options: Policy X and Policy Y. Each policy assigns a certain number of points to each type. These points represent how well-off that type is under that policy. 

          You will each be randomly assigned to one of these three types. But first, you have to rank the policies without knowing which type you will be. We'll do this in two stages. 

          In the first stage, you are behind what we might call a 'veil of ignorance': you know the point assignments for each type under each policy, but you don't know which type you will be. You are equally likely to be any of the three types. 

          Your goal is to maximize your own points. You'll write down which policy you prefer in this situation.

          Then, we'll randomly assign each of you to a type. After that, we'll ask you again which policy you prefer, now that you know your type.

          Let me write the policies on the board:

            Policy X:
              Type A: 10 points
              Type B: 10 points
              Type C: 10 points

            Policy Y:
              Type A: 20 points
              Type B: 20 points
              Type C: 0 points

          Any questions?"

       Payoff scheme: 
          - The points are fixed as above. 
          - The random assignment: each student's type is determined by a die roll (1-2: Type A, 3-4: Type B, 5-6: Type C). This is done independently for each student.

       Timeline:

          [
            { "minutes": 10, "beat": "Setup", 
              "what_happens": "Instructor explains the activity and writes policies on board. Students listen and ask questions.", 
              "what_i_do": "Read setup script and answer questions." 
            },
            { "minutes": 10, "beat": "Ex ante ranking", 
              "what_happens": "Students, behind the veil of ignorance, calculate expected utility and write their preferred policy on an index card. They can also write the expected utility if they wish.", 
              "what_i_do": "Walk around to answer questions. Remind them that they are equally likely to be any type and that they should maximize their expected points." 
            },
            { "minutes": 5, "beat": "Collect ex ante rankings", 
              "what_happens": "Instructor collects cards and tallies the preferences on the board. We should see unanimity for Policy Y.", 
              "what_i_do": "Tally the votes and write: 'Ex ante: Policy Y: 14, Policy X: 0' (or whatever the count)." 
            },
            { "minutes": 10, "beat": "Random assignment", 
              "what_happens": "Each student comes up and rolls the die to determine their type. The instructor records the type for each student on the board (e.g., list student names and their types).", 
              "what_i_do": "Call students one by one, have them roll, announce the type, and record it. Then write the type on an index card for the student?" 
            },
            { "minutes": 5, "beat": "Ex post ranking", 
              "what_happens": "Students, now knowing their type, write their preferred policy on a new index card.", 
              "what_i_do": "Distribute new index cards. Remind them to choose based on their assigned type." 
            },
            { "minutes": 5, "beat": "Collect ex post rankings", 
              "what_happens": "Collect cards and tally by type. We should see: Type A and B prefer Y, Type C prefers X.", 
              "what_i_do": "Tally the votes and write on the board: 
                            Type A: # for X, # for Y
                            Type B: ... 
                            Type C: ..." 
            },
            { "minutes": 45, "beat": "Debrief", 
              "what_happens": "Discussion", 
              "what_i_do": "Guide the debrief using the points below." 
            }
          ]

       The moment it lands: during the ex ante tally, when the board shows that every single student preferred Policy Y. We point out that they achieved unanimity without communication, purely by each pursuing their own self-interest under uncertainty.

       The second moment: during the ex post tally, when we see that the Type C students now prefer Policy X. We can ask: "How many of you changed your mind? Why?" and let the Type C students explain. We note that the unanimity has vanished.

       Debrief (array of strings, in order):

          1. "In the first stage, behind the veil, we saw unanimous agreement on Policy Y. Why did that happen?" (Expected points: 10 vs 13.33 -> Policy Y gives higher expected utility.)
          2. "But after we lifted the veil, we saw disagreement. Why? What changed?" (Now they know their actual position and the risk is resolved. Type C is worse off under Y.)
          3. "What does this tell us about the nature of the agreement we had behind the veil? Was it an agreement about what is fair, or was it about something else?" (It was about each person's self-interest in the face of risk. They all faced the same gamble.)
          4. "Notice that Policy Y gives a total of 40 points (20+20+0), while Policy X gives 30 (10+10+10). The veil of ignorance led us to the policy that maximizes the total points. But does that mean that Policy Y is the fairer policy?" (This opens the Rawlsian critique: the worst-off gets 0 in Y, but 10 in X.)
          5. "What if we had a policy that was more equal but had a lower total? Would we have chosen it behind the veil? Let's consider: Policy Z: A: 11, B: 11, C: 11 -> total 33, expected 11. That's less than 13.33, so we wouldn't. But what if we were risk averse? In our activity, we assumed the points are linear with utility. But what if the utility of 0 is catastrophic? Then we might have chosen differently. The theorem assumes that individuals are expected utility maximizers with respect to their own utility functions, and that these utilities are vNM. But we assigned the points arbitrarily as utilities."
          6. "Now, in the real world, when we use a veil of ignorance to argue for a policy, what are we assuming about the individuals behind the veil? And does this activity show that such a device always leads to a fair outcome?"

       Predictable failures:

          [
            { 
              "what_goes_wrong": "A student refuses to play along and writes a different ranking ex ante, maybe because they are risk averse and the points are not their utility (e.g., they think 0 is too bad and prefer the safe 10).", 
              "what_to_do": "Note that in the theorem, we assume that the individuals are expected utility maximizers and that the utility function is linear in the points. In reality, if they are risk averse, they might not choose Y. But in our activity, we are representing utility by points, so we assume linearity. We can use this to discuss the importance of the vNM assumptions." 
            },
            { 
              "what_goes_wrong": "Two students (or more) talk and coordinate during the ex ante phase, violating the individual decision-making.", 
              "what_to_do": "Remind them that the activity is about individual decision making. If they talk, note that the theorem assumes individuals decide independently. We can discuss what happens if they can coordinate: they might try to make a binding agreement, but behind the veil they are identical so they would still agree on Y." 
            },
            { 
              "what_goes_wrong": "A Type C student in the ex post phase still prefers Policy Y, maybe because they are altruistic or because they don't care about points.", 
              "what_to_do": "Acknowledge that in reality, people might care about others. The theorem assumes self-interest. We can discuss how altruism might change the outcome." 
            }
          ]

       What the activity cannot reproduce:

          - The activity does not prove that the social welfare function must be utilitarian. It only shows that when individuals are behind the veil and maximize expected utility, they will choose the policy that maximizes the average utility (and hence total). But the theorem also requires that the social welfare function satisfies the Pareto condition and that individual utilities are vNM, which we haven't discussed in the activity.
          - We are assuming that the utility of each individual is interpersonally comparable and that we can add them up. The activity assigns the same point scale to everyone, so we are making interpersonal comparisons arbitrarily.
          - The activity does not show the full generality of the theorem, which works for any number of individuals and any set of policies.

       One-line thesis: "The veil of ignorance produces unanimity by turning distributive choices into gambles, but the agreement it produces is about risk, not justice, and it vanishes when the gamble is over."

