  **Key Design Notes:**

  1. **The EU Workhorse:** The payoff structure ensures Harvest Moon dominates in expected value (10 vs 10) but requires risk-taking. Students *discover* the unanimity through identical EV calculations, not lecture.

  2. **Ex-Ante/Ex-Post Crack:** Physical randomization (public card draw) makes fate assignment visceral. Merchant students authentically revolt against their own prior choice when they get 0-point roles.

  3. **Controlled Disclosure:** "Harvest Moon" subtly cues utilitarianism without naming it. Rawls isn't mentioned until debrief when Merchants' vulnerability mirrors the "least advantaged."

  4. **Failure Modes as Features:** Predicted rebellions become discussion points - e.g., when solidarity-motivated Artisans defect from self-interest, it exposes model limitations.

  5. **Honest Gaps:** The timeline explicitly pauses to note what the simulation can't show (utility normalization, risk attitudes) during setup and debrief.

  This creates the "bone-deep" experience: Students feel the eerie consensus emerge mathematically, then watch it shatter when identities resolve - all while never hearing "Harsanyi" or "utilitarianism" until the cognitive dissonance is palpable.
