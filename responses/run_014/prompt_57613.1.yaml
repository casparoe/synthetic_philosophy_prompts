  The cruxes are anchored in two cases. For W/W⁻, extensionists say W is better using overtaking without anonymity loss. Quietists see it as undefined due to non-conglomerability. For G/C, extensionists might prefer G with discounting but reject it with overtaking; quietists call it undefined. Each side's finite predictions: W > W⁻ even for large N, but quietists see the infinite case as different. For G/C, finite would favor C, but extensionists might still accept G in infinite if consistent under their method. 

