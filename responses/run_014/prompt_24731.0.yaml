prompt: |-
  I'm working through a set of arguments against what people call the "measurability bias" in effective altruism, and I've landed on one that I think proves too much, and I can't find the exit. The target is the standard EA decision procedure — choose the action that maximizes expected moral value (EMV) — and the argument is meant to show that this procedure gives us no genuine moral guidance at all. Here it is, the way a friend and I got it:

  (1) The core of EA's decision procedure is: act to maximize expected moral value (EMV).
  (2) To maximize EMV, you must be able to compare the EMVs of your available options.
  (3) To compare EMVs, you must represent each option's moral value as a quantity on some scale.
  (4) To represent a moral value as a quantity on a scale, you need a unit of moral value and a way of measuring value in that unit.
  (5) There is no fact of the matter about what the unit of moral value is; choosing a unit is a choice, not a discovery.
  (6) So any choice of unit is either arbitrary, or else it is itself a substantive moral judgment.
  (7) If the choice of unit is a substantive moral judgment, then the EMV computation presupposes the very kind of judgment it was supposed to do for us, and is circular.
  (8) If the choice of unit is arbitrary, then the EMV ranking it produces depends on an arbitrary choice, and so is not a fact about which option is genuinely better.
  (9) Either way, the EMV computation does not deliver a non-arbitrary, non-circular answer about what we should do.
  (10) Therefore, the core of EA's decision procedure — maximize EMV — provides no genuine moral guidance.

  The conclusion is one I don't want, and what makes me think the argument proves too much is that the same structure would apply to any procedure that ranks options by a metric: if it worked, it would also refute plain utilitarianism and expected utility theory, neither of which I think is as obviously guidance-free as this makes them. I have a nagging feeling that the argument is only as strong as a claim about what "measuring" a value actually requires, but I can't pin down which step that is. Which premise or step do you reject, why did it look fine on first reading, and what do I pay by rejecting it — in particular, what must the defender of EMV concede, and what does the measurability-bias critic lose?
reasoning: |-
  Okay, the user is grappling with a philosophical argument against the measurability of moral value in effective altruism (EA). They've presented a structured argument claiming that EA's core decision procedure—maximizing expected moral value (EMV)—fails to provide genuine moral guidance because any unit of moral value is either arbitrary or circularly presupposes moral judgments. 

  First, I need to unpack the argument's logic. Premises 1-4 establish the technical requirements for EMV comparisons. The critical pivot is premise 5, denying an objective "unit" of moral value. This forces a dilemma: if choosing a unit is a moral judgment (6), EMV becomes circular (7); if arbitrary (6), EMV rankings lack normative force (8). Either way, EMV fails (9-10). 

  The user's discomfort comes from realizing this argument would also dismantle utilitarianism and expected utility theory—positions they believe aren't so easily refuted. Their intuition points to premise 4 as the weak link, but they can't articulate why. 

  Hmm... The core flaw lies in premise 4's conflation of two distinct concepts: *measurability* and *unit-based quantification*. EMV only requires ordinal comparisons (which option has higher expected value), not cardinal units. We see this in standard decision theory: expected utility works with utility *functions*, not fixed units. A utility function's scale is arbitrary (multiplying by 100 changes "units" but preserves rankings), and its zero point is conventional (adding 100 to all values doesn't alter choices). Only the ordering matters. 

  This resolves the dilemma. For (7): No circularity because choosing a scale isn't a moral judgment—it's a mathematical normalization. For (8): No arbitrariness problem because all valid scales preserve the same ordinal ranking. The "arbitrary" choice of scale is like choosing Celsius or Fahrenheit; it doesn't affect which city is hotter. 

  The user might worry this concedes too much to EMV skeptics. Actually, it forces critics to shift ground. They must now argue either that (a) moral value *lacks even ordinal structure* (denying comparability), or (b) EMV computations have epistemic limits (e.g., uncertainty about probabilities). Both are weaker claims than "no guidance possible." 

  What the critic loses: the sweeping conclusion that EMV is inherently meaningless. What EMV defenders concede: that any *specific* numerical representation (e.g., "this donation saves 3.7 QALYs") is convention-dependent—but the underlying comparison isn't. 

  The user's "nagging feeling" about premise 4 was spot-on. Rejecting it doesn't rescue EMV unscathed, though. It highlights that EA's guidance relies on robust ordinal judgments (can we say A is probably better than B?) and manageable uncertainty—which is where real debates (e.g., longtermism vs. global health) actually live.
answer: |-
  Your analysis is sharp—the argument *does* threaten to prove too much, undermining not just EA but any quantitative decision theory (like utilitarianism or expected utility). The flaw lies in **premise (4)**, which imposes an unrealistic requirement on "measuring" value. Let's break it down:

  ### Step-by-Step Diagnosis
  1. **Premise (4) is the problem**:  
     *"To represent a moral value as a quantity on a scale, you need a unit of moral value and a way of measuring value in that unit."*  
     This conflates **cardinal measurement** (requiring fixed units and ratios) with **ordinal ranking** (which only requires comparability). EMV only needs ordinal comparisons—it doesn't require absolute units.  

  2. **Why (4) seems plausible initially**:  
     We instinctively think of "measurement" like physical units (meters, kilograms). But decision theory only requires *relative* comparisons: if Option A has higher EMV than B, we choose A—regardless of whether "value" is measured in QALYs, utils, or any other unit. The *scale* is arbitrary, but the *ranking* isn't.  

  3. **What rejecting (4) costs the EMV defender**:  
     They must concede that:  
     - EMV outputs are **ordinal, not cardinal**. Saying "A has 2× the EMV of B" is meaningless without a fixed unit.  
     - Choosing a *numerical representation* (e.g., 1 util = 1% poverty reduction) is conventional—but this doesn't affect the ranking.  
     - Practical EMV calculations (e.g., cost-effectiveness ratios) are tools for ranking, not metaphysical truths.  

  4. **What the critic loses by this rejection**:  
     The "measurability bias" critique weakens significantly. It can no longer claim EMV is *inherently* circular/arbitrary. Instead, critics must argue:  
     - Moral value lacks *even ordinal structure* (no "better/worse"), or  
     - We lack *epistemic access* to reliable probabilities/outcomes (e.g., for longtermism).  

  ### How EMV Survives the Dilemma
  - **Against (7)**: Choosing a scale isn't a "substantive moral judgment." It's a *convention* to represent pre-existing ordinal judgments (e.g., "saving 100 lives is better than saving 10"). No circularity.  
  - **Against (8)**: While the *numerical scale* is arbitrary, the *ranking* isn't. All valid utility functions are **positive affine transformations** of each other: if U(A) > U(B), then aU(A)+b > aU(B)+b for any a>0. The choice of "unit" (a) and "zero point" (b) cancels out in comparisons.  

  ### Analogy: Temperature Scales
  - Celsius and Fahrenheit use different units, but agree on whether Miami is hotter than Oslo. Similarly, different moral scales agree that saving 100 lives > saving 10 lives. The "unit" is arbitrary, but the *ordering* isn't.  

  ### Where the Argument Still Bites
  EMV isn't unscathed. Rejecting (4) forces EA to defend two claims:  
  1. **Ordinal comparability**: Moral value can be rank-ordered across options (e.g., bednets > opera tickets).  
  2. **Feasible quantification**: We can estimate probabilities and outcomes well enough for *reliable* rankings (e.g., "Against Malaria Foundation is better than most charities").  
     - Here, "measurability bias" critics have traction if EMV is applied in high-uncertainty contexts (e.g., AI risk).  

  ### Conclusion
  **Reject premise (4)**. EMV requires no fixed "unit" of value—only ordinal comparability and probabilistic expectations. This saves EA (and utilitarianism) from collapsing into arbitrariness, but forces humility: EMV is a tool for ranking options under uncertainty, not a physics-like science of moral units. The critic's valid point shifts to practical epistemology ("Can we *reliably* rank these options?") rather than attacking the coherence of EMV itself.  

  > *"To say that my want is for a saucer of mud is to presuppose that I believe that I shall enjoy it when I get it. But to say that my want is for an increase of one unit in my utility is to presuppose nothing: it is to say nothing at all."*  
  > — John Broome, *Weighing Goods* (1991), Ch. 1.
