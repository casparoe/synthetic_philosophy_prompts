  Hmm, the user is clearly deep into democratic theory and wants concrete application. They’re frustrated with hypotheticals and want to dissect a real mess. The Brexit referendum is perfect because its franchise was full of contradictions: EU residents in the UK couldn’t vote but Commonwealth citizens could, Gibraltar was included but Northern Ireland’s unique position was overlooked, etc. 

  First, I need to map theories onto the case. The all-affected principle would enfranchise virtually anyone impacted by Brexit—EU citizens in the UK, UK citizens in the EU, maybe even global markets. That’s unworkably broad. All-subjected gets messy too: the Latvian nurse living under UK laws couldn’t vote, while the Australian student could. Stakeholder theory might include long-term residents but exclude short-term ones, which still leaves gaps. Competence or membership duration ideas don’t resolve the nurse/student paradox either. None align cleanly with the actual franchise, which was based on UK parliamentary elections—a lazy default, not a principle. 

  Then, reversing the lens: what does this say about theory? The referendum shows boundary questions are often dodged for administrative convenience. The "Westminster franchise" defense—tying voting to national citizenship—falls apart because it’s circular: the demos defines itself. Brexit also exposes gaps no theory handles well, like future generations or Northern Ireland’s complex status under the Good Friday Agreement. 

  The user’s sharpest insight: this isn’t just a theoretical hole but a practical one. The referendum didn’t just ignore the boundary problem—it weaponized it. "Take back control" was literally about redefining the demos (via immigration) while using a franchise that excluded those most affected by that redefinition. That’s the brutal irony. 

  I should emphasize the unresolved tensions: the vote reshaped boundaries (free movement) while using arbitrary ones (the franchise). And highlight how theories go mute on non-citizen residents, minors, and partitioned polities like NI. No need to force theories to cover everything—sometimes silence is the point. 

  User’s tone is analytical, not ideological. They explicitly don’t care about Leave/Remain merits. Good. They want the case to "speak back" to theory, so I’ll end with lessons: boundary problems are unavoidable in major votes, often "solved" by inertia, and expose democratic theory’s limits when polities are nested (like in the EU). Brexit didn’t make the problem unresolvable—it proved we never really try.
answer: |-
  Here’s a rigorous case analysis of the 2016 Brexit referendum through the lens of the boundary problem, structured to address your core questions and avoid theoretical abstraction:

  ### I. Mapping Theories onto the Referendum Electorate  
  *(What franchise would each principle produce vs. reality?)*  

  | **Principle**               | **Hypothetical Brexit Electorate**                                                                 | **Divergence from Actual Franchise**                                                                 |
  |-----------------------------|---------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|
  | **All-Affected Interests**  | UK residents (all nationalities), UK citizens abroad, EU citizens in UK/EEA, Gibraltar residents, likely Northern Ireland residents (due to GFA implications), potentially global markets (symbolically). | **Massively broader:** Would include ~3M EU citizens in UK, ~1.2M UK citizens in EU, NI residents explicitly. Excludes non-resident global actors. |
  | **All-Subjected**           | All residents subject to UK law: UK citizens, EU/EEA/Swiss citizens in UK (+Gibraltar), Commonwealth citizens with residency. Excludes UK citizens abroad long-term. | **Partial overlap:** Includes Latvian nurse, excludes Australian student without residency. Still disenfranchises UK citizens abroad >15 yrs. |
  | **Stakeholder Theory**      | Long-term residents (>5-10 yrs) regardless of nationality, UK citizens globally, Gibraltarians. Excludes short-term visas (e.g., Australian student). | **Narrows residency gap:** Includes Latvian nurse (long-term), excludes Australian student. Still excludes 16-year-olds. |
  | **Competence/Maturity**     | Age threshold lowered (e.g., 16+), excludes severe cognitive disabilities. Ignores nationality/residency. | **Broader age-wise:** Includes 16-17 year olds (~1.5M people), but retains nationality exclusions (e.g., Latvian nurse). |
  | **Duration-of-Membership** | Citizens + permanent residents (>X years). Excludes short-term residents, non-permanent citizens abroad. | **Excludes "temporary" actors:** Australian student out, Latvian permanent resident in. Retires in Spain included only if "permanent" member. |

  **Key Observation:** No principle aligns cleanly. All-Affected is administratively impossible. All-Subjected creates irrational distinctions (Latvian nurse vs. Australian student). Stakeholder/Duration struggle with "membership" definition. **The actual franchise mirrors none**—it’s the UK parliamentary model: Commonwealth/Irish citizens resident in UK + UK citizens resident <15 yrs abroad + Gibraltarians. This was an **administrative default**, not a principled choice.

  ### II. Reverse Lens: What Brexit Reveals About Democratic Theory  
  **A. The Boundary Problem in Practice: Inertia Over Principle**  
  - Westminster’s franchise choice wasn’t laziness *alone*—it reflected a **circular logic**: "The demos is defined by the state’s existing rules." This exposes democratic theory’s core weakness: **demos definition is pre-political**. The state used a *procedural* boundary (who votes in UK elections) to decide a *constitutive* boundary (who belongs to the polity).
  - **Defensive Argument?** Proponents might claim "national citizenship" is the only coherent boundary. But this fails: the vote altered citizenship rights (free movement), disenfranchised residents subject to laws (EU nationals), and included non-citizens (Commonwealth voters). Citizenship was an arbitrary line.

  **B. Brexit as Evidence of the Boundary Problem’s Irresolvability**  
  - Not unresolvable *in principle*, but **politically unresolvable when stakes are high**. Key actors had incentives to avoid the question:
    - **Leave:** Narrow franchise amplified anti-immigrant messaging (excluded immigrants themselves).
    - **Remain:** Broadening franchise risked accusations of "stacking the deck."
    - **Administrators:** Default rules avoided contentious debates pre-referendum.
  - **Irony:** The referendum’s *topic* (EU membership) was fundamentally about boundaries (movement, sovereignty), yet the *process* used rigid, unexamined boundaries. This confirms the professor’s point: boundary problems are **conveniently ignored when decisive action is desired**.

  **C. Where Theories Fall Silent: Brexit’s Blind Spots**  
  1. **Future Generations:**  
     - 16-year-olds (excluded) bore lifelong consequences. No major theory adequately addresses intergenerational demos boundaries. Brexit shows this isn’t academic—it enabled a majority of older voters to bind the young.
    
  2. **Nested Polities (Northern Ireland):**  
     - The Good Friday Agreement (GFA) created a *shared* demos (NI + Ireland). Brexit redefined borders without GFA-specific voter input (e.g., no requirement for dual majority in NI). Theories like "all-subjected" fail here—NI residents were subjected to existential change, yet the UK-wide demos overrode their nested reality.

  3. **Non-Citizen Residents:**  
     - EU nationals contributed taxes, used services, and faced deportation risks post-Brexit. Their exclusion reveals theories assume a "citizen/resident" binary that ignores stakeholding in fluid societies.

  ### Conclusion: Brexit as a Boundary Problem Case Study
  - **Empirical Lesson:** The franchise was **not principled** but **administrative and tactical**. It exposed contradictions: voting rules designed for national laws were unfit for a constitutive, boundary-altering vote.
  - **Theoretical Insight:** Boundary problems aren’t "unresolvable"—they’re **routinely resolved by power and inertia**. Brexit proves that when boundaries *themselves* are contested (e.g., "taking back control"), democratic systems default to existing exclusions, amplifying their arbitrariness.
  - **Silences Exposed:** The case highlights gaps in theory: **temporal boundaries** (future gens), **fragmented sovereignty** (NI), and **de facto membership** (long-term non-citizens). These aren’t edge cases—they’re central to modern polities.

  **Your Paper’s Edge:** Frame Brexit not as a "failure" of theory, but as proof that boundary questions are **suppressed in real votes** because they’re politically toxic. The referendum didn’t ignore the boundary problem—it exploited it. This moves beyond philosophical deadlock to show *how* boundary issues manifest in practice: through unexamined defaults that serve immediate political ends.
