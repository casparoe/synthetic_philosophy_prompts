prompt: |-
  For the last several months I've been stuck in a low-grade recurring argument with two friends from a LessWrong-adjacent meetup about commons problems. One is a hard property-rights type: every tragedy of the commons is ultimately a missing-titles problem, and privatization or at least tradeable quotas is the general fix. The other thinks markets are the disease and the state is the cure: taxes, caps, and provision by fiat. After finally reading some of the empirical common-pool-resource literature (the Ostrom line, the fisheries and irrigation cases), I've come to suspect that both of them are arguing about answers to a question nobody has actually specified, and that the specification itself is where the interesting work is. So before we go another round, I want the spec written down.

  What I'm asking for is this: write out the desiderata that any adequate solution to a commons problem has to meet. By "commons problem" I mean the family that includes overgrazing, overfishing, groundwater depletion, and climate change, but the list should make explicit the distinctions a theory can't collapse along the way -- common-pool resources versus public goods (rival versus non-rival consumption, and why the fix for one can misfire on the other), open access versus a resource genuinely held in common by an identifiable community, one-shot versus iterated interactions, symmetric versus wildly asymmetric appropriators, and, if you think it belongs, the mirror-image anticommons case of a resource fragmented among too many exclusion rights to be used at all. For each requirement, give the case or consideration that motivates it: incentive compatibility with rational appropriators, robustness to entry by outsiders and to capture by the most powerful users, monitoring costs, whether the solution survives when discount rates are high or population is large, and consistency with the empirical record that long-lived self-governing commons institutions actually exist and have for centuries, which rules out any story on which they couldn't. Then mark which of your requirements are genuinely non-negotiable and which are, on inspection, just the prejudices of the privatization camp or the state camp smuggled in as adequacy conditions, and tell me whether any subset of the desiderata is jointly unsatisfiable -- for instance, whether mechanism-design style results about efficiency, budget balance, and voluntary participation mean some pair of the requirements can't coexist, which would itself be the main finding. Close with a brief, honest scoring of privatization-style solutions, centralized regulation, and polycentric self-governance against your own list, in no more than a short paragraph each, since the criteria are the part I care about.

  One formatting note: please write the whole thing as continuous prose, the way you'd write a long email -- no headings, no bullet points, no bold text, no tables. I realize a requirements list practically begs to be bulleted, but I'd rather see whether the criteria survive being argued for in sentences, and a numbered list always makes everything look equally load-bearing.
reasoning: |-
  Okay, the user has been stuck in a recurring argument with two friends about commons problems. One friend is pro-property rights and privatization, while the other advocates for state regulation. After reading empirical literature like Ostrom's work, the user suspects both are answering unspecified questions. They want a clear set of desiderata for any commons problem solution.

  First, I need to define what makes an adequate solution. The user mentioned distinctions like common-pool resources vs. public goods, open access vs. community-held, and anticommons. I should cover rivalry, exclusion, and the different scenarios that affect solutions.

  The desiderata must address key issues: incentive compatibility so rational users don't defect, robustness against outsiders and power imbalances, low monitoring costs, sustainability under high discount rates or large populations, and consistency with historical examples of successful self-governance. Each point needs a motivating case. For instance, robustness to entry is crucial because of cases like unregulated fisheries where new entrants can ruin the system.

  I also need to identify non-negotiables versus biases. Non-negotiables might include preventing resource collapse and incentive compatibility, while things like privatization might carry ideological baggage. Checking for joint unsatisfiability is important too. For example, efficiency and voluntary participation might conflict in some mechanism designs, which could explain why some solutions fail.

  Scoring the three approaches: privatization can work but risks anticommons and exclusion issues. State regulation is strong on caps but vulnerable to capture and high information needs. Polycentric systems align well with historical success but may struggle at larger scales like climate change.

  I should ensure all distinctions are explicit without collapsing them. Public goods are non-rival, so solutions like taxes might work there but not for rival resources. Historical examples show self-governance lasting centuries, so any solution must allow for that possibility.

  Finally, write in continuous prose as requested. Avoid lists, use paragraphs to argue each point. Make sure the closing evaluations are concise, highlighting strengths and weaknesses against the criteria.
answer: |-
  You're absolutely right to demand specification before solution - that clarity is half the battle with commons problems, where ideological reflexes often override context. The empirical record, especially Ostrom's work, shows successful institutions navigate complex, situated trade-offs rather than imposing universal blueprints. So let's lay out the requirements any adequate institutional arrangement must meet, grounded in the problem's structure and real-world constraints. I'll articulate the desiderata through their motivating failures, mark non-negotiables, and confront tensions.

  First, **prevention of resource collapse or degradation below sustainable yield thresholds**. This is non-negotiable; without it, the 'tragedy' occurs. Motivation: the incentive for individual appropriators to over-extract before others do, especially under open access (e.g., collapsed fisheries like Newfoundland cod). Any solution must structurally counteract this race-to-the-bottom dynamic, even when discount rates are high (short time horizons) or population pressure is intense.

  Second, **incentive compatibility under strategic behavior**. Appropriators must find adherence rational; defection shouldn't be systematically advantageous. Motivation: schemes demanding excessive sacrifice crumble as rational actors cheat (e.g., unmonitored fishing quotas). This includes respecting the appropriators' rationality – assuming saints guarantees failure. Non-negotiable, as no enforcement regime can be perfectly omnipotent.

  Third, **robustness to exogenous shocks and entry/exit**. The solution must withstand new entrants ("free riders" joining the commons) or exit of key actors without collapsing. Motivation: climate change impacts altering resource productivity, or migration into overstressed groundwater basins. Crucially, it must resist **capture by powerful subgroups** who might distort rules for their benefit (e.g., industrial fleets dominating fishery quota allocation), undermining fairness and sustainability. This robustness is non-negotiable for long-term viability.

  Fourth, **feasibility of monitoring and enforcement at sustainable cost**. Rules are void if compliance can't be verified or enforced without prohibitive expense. Motivation: aerial surveillance for grazing lands vs. satellite monitoring for ocean fisheries – costs vary wildly. High monitoring costs doom otherwise elegant solutions. This is non-negotiable; impracticality equals failure.

  Fifth, **congruence with the resource system's physical and temporal characteristics**. Solutions must respect rivalry (common-pool resources like timber vs. non-rival public goods like air quality), renewability rates, spatial boundaries, and measurement difficulty. Motivation: Privatizing a migratory fish stock (high rivalry, fluid boundaries) faces different hurdles than privatizing grazing parcels (rivalry, fixed boundaries). A 'cap-and-trade' fix for a non-rival good (like knowledge) is nonsensical. Collapsing these distinctions is fatal. Non-negotiable.

  Sixth, **adaptive capacity to changing conditions**. Fixed rules fail when resource dynamics, technology, or user needs shift. Motivation: Climate change altering water availability, or new fishing tech increasing efficiency. Long-lived commons (like Swiss alpine meadows or Spanish huertas) survived centuries because they could adapt rules. Non-negotiable for resilience.

  Seventh, **recognition and management of heterogeneity among users**. Solutions must function despite stark asymmetries in power, dependence, capital, or location. Motivation: Small subsistence fishers vs. industrial trawlers; upstream/downstream users in irrigation. Ignoring heterogeneity leads to rules favoring the powerful, violating robustness and fairness. Non-negotiable.

  Eighth, **avoiding the anticommons trap**. Solutions for overuse shouldn't create paralyzing underuse via excessive fragmentation of exclusion rights. Motivation: Overly subdivided patents blocking innovation, or complex land tenure preventing development. This is the mirror-image failure, often a pathology of poorly designed privatization. Preventing it is non-negotiable for ensuring the resource remains *usable*.

  Ninth, **consistency with the empirical reality of successful, enduring self-governance**. Any theory claiming commons *must* collapse without privatization or state control is falsified by history. Motivation: Ostrom’s cases (Japanese village forests, Philippine irrigation systems) lasting centuries. A solution concept denying their possibility is empirically inadequate. Non-negotiable as a reality check.

  Now, distinguishing non-negotiables from smuggled biases: Requirements 1-5, 7, 8, and 9 are core structural/functional necessities. Requirement 6 (adaptive capacity) is borderline but empirically vital. The "prejudice" often smuggled in is an *assumption* that solutions *must* be either purely market-based (ignoring robustness to capture and anticommons risks) or purely state-based (ignoring monitoring costs and vulnerability to regulatory capture or rigidity). Another bias is assuming perfect homogeneity or zero transaction costs. These aren't requirements but often-unstated premises that poison debates.

  Regarding joint unsatisfiability: Deep tensions exist. **Efficiency (Pareto-optimal allocation) under rivalry is often incompatible with strict voluntary participation (no one made worse off)** – someone might lose initial privileges. **Perfect budget balance (fines cover enforcement) can clash with robustness to entry** if new entrants dilute resources without contributing to enforcement costs upfront. **High discount rates fundamentally challenge sustainability** – preventing collapse may require coercion unpopular with myopic users. Mechanism design confirms no perfect, universal solution exists; trade-offs are inherent. The key finding *is* this inherent tension: institutional design is always contextually balancing these competing demands, not discovering a silver bullet.

  Scoring the approaches against *these* criteria:

  **Privatization/Tradeable Quotas:** Excels at incentive compatibility (2) and can prevent collapse (1) for clearly divisible, excludable resources with low monitoring costs (4). Struggles massively with robustness to entry (3 - new entrants? capture?), spatial fluidity/rivalry (5 - migrating fish?), heterogeneity (7 - small users priced out), and anticommons (8 - fragmented rights). Fails robustness to capture (3) if initial allocation is skewed. Monitoring costs (4) vary – feasible for land, nightmarish for groundwater. Often violates empirical reality (9) by dismissing successful non-private commons. Best for static, divisible resources with clear boundaries and manageable entry.

  **Centralized State Regulation (Taxes/Caps/Fiat):** Strong on preventing collapse (1) via caps and can handle spatial scale (e.g., airsheds). Potentially robust to entry (3) if enforced. Poor on incentive compatibility (2 - high evasion incentives), monitoring costs (4 - often astronomical for diffuse resources), adaptive capacity (6 - bureaucratic inertia), and robustness to capture (3 - industry lobbying). Struggles with heterogeneity (7 - one-size-fits-all rules) and congruence (5 - misapplying caps to non-rival goods). Can work well for non-excludable public goods (clean air) or large-scale, measurable problems *if* state capacity and legitimacy are high.

  **Polycentric Self-Governance:** Excels at incentive compatibility (2 - local buy-in), monitoring cost (4 - local knowledge), adaptability (6 - local experimentation), congruence (5 - rules tailored to resource), managing heterogeneity (7 - nested enterprises), and avoiding anticommons (8 - collective ownership avoids fragmentation). Directly validated by requirement (9). Weakest on large-scale robustness to entry (3 - vulnerable to outsiders) and spatial mismatches (5 - e.g., global climate). Requires pre-existing social capital and clear community boundaries. Best for local-to-regional common-pool resources with definable user groups and moderate scale.

  The core insight is that your friends' preferred solutions are tools suited to *different subsets of these requirements and resource types*, not universally dominant strategies. The "spec" forces the question: *Which constraints bite hardest in* this *specific commons?* Only then can the institutional fit be judged.
