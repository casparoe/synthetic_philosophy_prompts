prompt: |-
  I teach an upper-level epistemology seminar — 14 students, mostly seniors plus a couple of first-year MA students — and I've got a 90-minute session to spend on the dogmatism paradox. I've tried just putting the argument on the board and it dies every time: they nod, and then someone says something deflationary like "well that just shows you shouldn't be so sure of yourself," which is exactly the move I want to make unavailable to them. So instead of a lecture I want a runnable activity — a game, a role-play, a structured deliberation, whatever fits best — where they enact the thing before anyone says its name. What I'm after: they should arrive, through their own choices, at the position that once you take yourself to know something, you're entitled to treat every later piece of contrary evidence as noise; and they should have felt in their hands both why that entitlement is so seductive and why it's a machine for entrenching people who are simply wrong. Ideally they reconstruct the steps themselves (knowledge entails truth, so anything speaking against a known truth must be misleading, so if you know it's misleading you may ignore it, and you know all of this a priori) — I'd much rather they build the argument out of what just happened to them than hear it from me. You're a philosopher who's spent a lot of time turning abstract epistemology into things people can do with their hands, so take a moment to brainstorm three or four mechanically different activities before committing to one, then develop the strongest.

  The structural feature I care about most is this: the license to ignore contrary evidence gets issued *before* anyone can tell whether they're in the good case (they really do know) or the bad case (they're confident and mistaken). If the design lets people look back afterwards and say "ah, but I was justified, I really did know," it hasn't landed — I want them to discover that the rule protecting the knower is the same rule arming the fool, and that from the inside they can't tell which one they are. Seed the activity with whatever the group has to be doing: a bet, a verdict, a diagnosis, a sealed envelope, a witness who recants, an expert who contradicts them, a slip of paper telling them what they're allowed to shred. Keep materials cheap and printable, no real money, and make it survive a couple of absences or one group finishing early. Nobody should hear the phrase "dogmatism paradox" (or "higher-order evidence," or "defeater") until the debrief — the mechanism is supposed to do the teaching. And no reading list please, I know the literature.

  Give me the rules, the materials, a minute-by-minute timeline, and the debrief. The debrief should map specific moments in the activity onto the four steps, and onto the two standard ways people resist the conclusion — denying that you always know that you know, and insisting that being rational about revising your beliefs is a seperate thing from merely having knowledge. Be honest about what an activity like this just can't reproduce: I suspect some of the bite is about the a priori status of the premises and about whether the whole thing is really about knowledge at all rather than about what you may rationally believe, and I dont think any game gets at that. Then tell me what will predictably go wrong the first time I run it — where they'll get hung up, where the rules will be read in a way I didn't intend, what I should have written on the board before we started. I'm comfortable improvising but not with dead air, so flag the two or three moments where I'll need a line ready.
reasoning: |-
  We are designing an activity to lead students to experience the dogmatism paradox without naming it. The key elements are:
  1. Students should enact a situation where, upon taking themselves to know something, they feel entitled to ignore contrary evidence.
  2. They should feel both the seductiveness of this entitlement and how it entrenches error.
  3. They should reconstruct the argument: knowledge entails truth → contrary evidence must be misleading → if you know it's misleading, you may ignore it → and this is known a priori.
  4. The critical structural feature: the license to ignore is issued *before* knowing if they are in the good case (really know) or bad case (confident but wrong), and they should realize that the same rule protects the knower and arms the fool.

  We'll avoid using terms like "dogmatism paradox", "higher-order evidence", or "defeater" until the debrief.

  Brainstorming activities:

  1. **The Sealed Envelope Prediction Game**: 
     - Students make a prediction about a future event (e.g., the outcome of a coin flip, a die roll, or a simple trivia fact). They write it down and seal it in an envelope. Then they are given evidence that contradicts their prediction. The rule: if they *know* their prediction is correct, they can ignore the evidence. The twist: some envelopes contain correct predictions and some don't (but they don't know which). They have to decide whether to change their prediction or ignore the evidence.

  2. **The Expert Witness Role-Play**:
     - Students are split into two groups: experts and jurors. Experts are given a case (e.g., a medical diagnosis) and some initial evidence. They form a conclusion. Then, a new piece of evidence emerges that contradicts the conclusion. The experts are told that if they *know* their diagnosis is correct, they can disregard the new evidence. The twist: some experts have correct initial evidence, some have misleading. Jurors then have to decide which expert to trust.

  3. **The Betting Game with Contradictory Tips**:
     - Students are given a starting belief (e.g., "Stock A will go up") based on initial information. They place a bet (with fake money). Then, they receive a tip that contradicts their belief. The rule: if they *know* their belief is true, they can ignore the tip and not adjust their bet. The twist: in some cases, the initial information is reliable, in others, it's not. They don't know which.

  4. **The Conflicting Reports Investigation**:
     - Students are investigators of a crime. They get an initial report (e.g., "The suspect was at the cafe at 8 PM"). They form a belief. Then, they get a second report from another source that says the opposite (e.g., "The suspect was at the park at 8 PM"). The rule: if they *know* the first report is true, they can disregard the second. The twist: the reliability of the sources varies, but they don't know how.

  After brainstorming, I choose **The Sealed Envelope Prediction Game** because:
  - It is simple to set up and run with minimal materials (just envelopes and paper).
  - It clearly separates the moment of "knowing" (sealing the envelope) from the arrival of contrary evidence.
  - The sealed envelope serves as a tangible representation of their commitment to their knowledge claim.
  - It easily allows for both good and bad cases without revealing which until the end.

  Now, developing the activity:

  **Title of Activity**: The Sealed Truth

  **Learning Objective**: To experience and recognize that once you take yourself to know a proposition, you may feel entitled to dismiss any contrary evidence as misleading, and to see that this rule applies equally when you are correct and when you are mistaken.

  **Materials** (for 14 students):
  - 14 envelopes (each labeled with a student's name or a number).
  - 28 small slips of paper (2 per student).
  - A coin (or a way to generate a random binary outcome).
  - A hat or box for drawing slips.
  - A timer.

  **Setup** (Before class):
  - Prepare two types of envelopes: 
    - 7 "Good" envelopes: These will contain a correct prediction.
    - 7 "Bad" envelopes: These will contain an incorrect prediction.
    How: For each student, flip a coin. If heads, they get a "Good" envelope; if tails, "Bad". But note: we cannot actually predict the future, so we'll simulate a prediction about a past event that they don't know, or a random outcome we control.

  Alternative: Use a fixed fact that they don't know. For example, the exact time (to the minute) when a famous event happened, or the number of dots on a hidden card. But then we have to control the evidence.

  Better: Use a coin flip that we perform in advance. We flip a coin 14 times and record the outcomes. Then, for each student, we write two predictions:
    - For the Good case: the actual outcome of their coin flip.
    - For the Bad case: the opposite.

  But then we need to give them a reason to believe they know the outcome.

  Revised plan: We'll use a coin flip that they don't witness. We tell them that we have a special coin that is biased (but actually it's fair). We'll say that we've flipped the coin 14 times and recorded the results. Then, we give each student an envelope that they believe contains the correct outcome of their assigned flip. But in fact, for half of them, we lie.

  **Rules of the Activity**:

  1. **Introduction (5 minutes)**:
     - "Today we're going to play a game about predictions and evidence. You will each be assigned a coin flip. I have a coin here, and I've already flipped it 14 times, once for each of you. I recorded the outcome (heads or tails) for each flip on a slip of paper and sealed it in your envelope. Your job is to predict the outcome of your assigned flip. But here's the catch: I'm going to give you a hint about the outcome. Then you'll seal your prediction in the envelope. Later, you'll get some new evidence, and you'll have a chance to change your prediction or stick with it."

  2. **Step 1: Making the Initial Prediction (15 minutes)**:
     - Assign each student a flip number (1 to 14). 
     - Tell them: "I have a coin that is biased: it lands heads 70% of the time. But I flipped it fairly for this experiment." (This sets up the initial evidence.)
     - Give each student a slip of paper and ask them to write their prediction (heads or tails) and their name on it. They then seal this slip in their envelope. They must write their prediction before they get the next piece of evidence.
     - Collect the envelopes. (But note: we haven't told them the actual outcomes yet. We are going to give them a hint that we control.)

     Actually, to make the initial prediction, they only have the bias information. So they will all predict heads because of the 70% bias. But we want some to be in the good case and some in the bad. So we have pre-assigned the outcomes. We have 7 actual heads and 7 actual tails (to simulate a fair coin despite the claimed bias). Then, for the envelopes, we have:
       - For the Good case: the envelope contains the actual outcome (so if the flip was heads, the envelope says heads).
       - For the Bad case: we put the opposite (if the flip was tails, we put heads in the envelope? But then when they open it, they see they were wrong).

     But the envelope is sealed and they don't see the content until the end. So how do they get their initial prediction? They write it and seal it. Then, we give them the envelope that we prepared (which we say contains the true outcome) but actually for the bad cases it's false.

     Revised: 
     - We pre-flip a coin 14 times and record the outcomes. Then, we create two sets of envelopes:
          Good case (7 envelopes): the slip inside says the actual outcome and we tell the student that this is the true outcome (but they don't see it until the end).
          Bad case (7 envelopes): the slip inside says the opposite of the actual outcome.

     How do they make their initial prediction? We tell them: "Based on the bias (70% heads), what do you predict?" They write that prediction and seal it. Then we give them our envelope which we say contains the true outcome. But they don't open it yet. We say: "This envelope contains the true outcome of your coin flip. You now know the outcome because I've told you the truth. But do not open it until the end."

     So now they have:
          Their own sealed prediction (which they wrote, say, heads).
          Our envelope which they believe contains the true outcome.

     Then they are told: "You now know the outcome because I've given you the truth in this envelope. So you know whether it's heads or tails."

     But note: in the bad case, we lied. So they don't actually know.

  3. **Step 2: Introducing Contrary Evidence (10 minutes)**:
     - Now, we introduce new evidence: "I have to confess: I made a mistake. The coin is actually biased towards tails, not heads. In fact, it lands tails 70% of the time. I mixed up the bias."
     - Then, we give each student a slip of paper that says: "New evidence: The coin is biased towards tails (70% tails)."

  4. **Step 3: Decision Time (15 minutes)**:
     - "Now, you have a choice. You have your envelope that you believe contains the true outcome. You also have this new evidence that suggests your initial prediction might be wrong. You are allowed to change your prediction. But note: if you *know* the outcome (because you have the true outcome in your envelope), then this new evidence must be misleading. So you can ignore it. If you don't know, you might want to change your prediction."
     - They are given a new slip of paper. They must write either:
          "I stick with my original prediction: [heads/tails]"
          or
          "I change my prediction to: [heads/tails]"
     - They put this decision slip in a separate box.

  5. **Step 4: Revelation and Reflection (10 minutes)**:
     - Now, we reveal the actual outcomes of the coin flips (from our pre-recorded list). 
     - Then, we open the envelopes (both the one we gave them and their own prediction) and see:
          For the Good case: our envelope matches the actual outcome. Their original prediction may be right or wrong (but they had the chance to change).
          For the Bad case: our envelope does not match the actual outcome.
     - We also check their decision slips to see if they changed.

  6. **Group Discussion (35 minutes debrief - but we'll break it down later)**.

  But wait: the activity above doesn't quite capture the dogmatism paradox because the new evidence is about the coin bias, not directly about the outcome. The dogmatism paradox typically involves evidence directly against the proposition. However, the structure is similar: the new evidence undermines the basis for their initial belief. And crucially, if they take themselves to know the outcome (because they have the envelope they believe is true), then they can dismiss the new evidence about the bias.

  We can adjust: the new evidence could be a witness who says they saw the coin land the opposite way. But then we need to fabricate that. Alternatively, we can give them a slip that says: "A reliable source (who has watched the flip) tells you that the outcome was actually [opposite of what they believe]."

  But then the envelope they have is supposed to be the truth. So if they believe the envelope, they must think the witness is lying or mistaken.

  Revised Step 3 evidence:
     - Instead of changing the bias, we give: "A classmate (who was an observer of your flip) has reported that the outcome was actually [opposite]." 

  But we have to assign observers. This might get complicated.

  Alternatively, we can use a different scenario that is not about coin flips to have more direct evidence.

  Alternative scenario: **The Art Authentication Game**

  - Students are art experts. They are given a painting and an initial report (from a reputable source) that the painting is either authentic or a forgery. They form a belief. Then, they get a second report from another expert that contradicts the first. The rule: if they know the painting's status (because they trust the first report), they can ignore the second.

  But we need to control the reliability of the reports.

  Given time constraints, let's stick to the coin flip but with a direct contrary report.

  **Final Activity Design: The Sealed Envelope with a Witness**

  Materials: Same as before, plus we'll need to assign "witnesses" but actually we will fabricate the witness reports.

  Setup:
  - Pre-flip a coin 14 times. Record the outcomes.
  - For each student, create an envelope that we will give them. For the good case (7 students), put a slip that says the actual outcome. For the bad case (7 students), put the opposite.
  - Also, prepare witness reports: for each student, we will give a slip that says: "Witness report: The coin landed [opposite of what we told them in the envelope]." So if the envelope we gave them says heads, the witness report says tails.

  Rules:

  1. **Introduction (5 min)**:
     - "We are going to simulate a series of coin flips. I have already flipped a coin 14 times, one for each of you. Each of you is assigned a flip. I have recorded the true outcome of your flip in an envelope that I will give you. But you cannot open it until the end. First, you will make a prediction."

  2. **Initial Prediction (10 min)**:
     - Tell students: "The coin is fair, so it's 50-50. But you have no reason to prefer heads or tails, so you might as well guess." 
     - They write their prediction (heads or tails) on a slip, put it in an envelope, and seal it. This is their initial prediction. They write their name on the envelope. (We don't collect it yet; they keep it.)

     But wait, if the coin is fair, why would they be confident later? We need to give them a reason to believe the envelope we give them is reliable.

     Revised: 
     - "I have a very reliable method of recording the outcomes. In fact, my recordings are correct 100% of the time. So when I give you an envelope with the outcome, you can know it is true."
     - Then they make a random prediction (since it's 50-50). Then we give them our envelope (which we prepared: good or bad) and say: "This envelope contains the true outcome. You now know the outcome. But do not open it until I say so."

     So now they know? They have to trust us. We are the reliable source.

  3. **Contrary Evidence (5 min)**:
     - Now we distribute witness reports. We tell them: "We have a witness who observed the flip. The witness is generally reliable but not perfect: they are correct 80% of the time. Here is the witness report for your flip."
     - The witness report says the opposite of what is in the envelope we gave them. For example, if our envelope says heads, the witness report says tails.

  4. **Decision (10 min)**:
     - "Now, you have to decide: do you stick with what you know (from the envelope I gave you) or do you change your prediction? Remember, if you know the outcome (because I told you and I'm 100% reliable), then the witness must be wrong. So you can ignore the witness. If you are not sure, you might change your prediction."
     - They have a decision slip. They write either:
          "I stick with my original knowledge: the outcome is [what our envelope says]."
          or
          "I change my belief: I now think the outcome is [what the witness says]."
     - They also have the option to be unsure? But we want to force a choice. Alternatively, they can just write their final belief.

     But note: they haven't made an initial belief about the outcome? They have our envelope which they believe is true. So their belief is what the envelope says.

     So the decision is: do they change their belief to what the witness says? Or do they stick with the envelope?

     We ask: "What is your final belief about the outcome? Is it what the envelope says or what the witness says?"

     They write their final belief on a slip.

  5. **Revelation (10 min)**:
     - We reveal the actual outcomes (from our pre-flip record).
     - Then, we ask students in the good case to open their envelope: it matches the actual outcome.
     - Students in the bad case: the envelope does not match.
     - We also see what they wrote as their final belief.

  6. **Group Discussion (35 min)**: We'll structure the debrief.

  But note: in the bad case, they were told we are 100% reliable, but we lied. So they were misled. The witness was actually correct (because we set the witness report to be the opposite of the envelope, and the envelope in the bad case was false, so the witness report was the truth). 

  Wait, let's check:

  - In the good case: 
     - Actual outcome: say heads.
     - Our envelope: heads (truth).
     - Witness report: tails (false).

  - In the bad case:
     - Actual outcome: tails.
     - Our envelope: heads (false, because we lied).
     - Witness report: tails (which is the truth).

  So the witness is always giving the true outcome? But we told them the witness is only 80% reliable. In the good case, the witness is wrong; in the bad case, the witness is right. But we set it up so that the witness report is always the opposite of what the envelope says. And in the bad case, the envelope is false, so the witness report is true.

  But the students don't know if they are in the good or bad case. So when they get the witness report, they don't know if it's one of the 20% mistakes (if they are in the good case) or one of the 80% correct (if they are in the bad case).

  However, if they take themselves to know the outcome (because they believe the envelope from the 100% reliable source), then they will think the witness is mistaken and ignore it.

  In the bad case, they are wrong to ignore the witness because the witness was actually correct.

  Now, we run the activity.

  **Timeline (90 minutes total)**:

  - 0-5 min: Introduction and setup. Explain the coin flips and the envelopes. Assign flip numbers.
  - 5-15 min: Initial prediction. They write their random prediction (since it's 50-50) and seal it in their own envelope. Then we distribute our envelopes (which we say contain the true outcome and we are 100% reliable). They now know the outcome? They believe what the envelope says. They do not open it.
  - 15-20 min: Distribute witness reports. Explain: "We have a witness for each flip. The witness is 80% reliable. Here is the report for your flip." The report says the opposite of what our envelope says.
  - 20-30 min: Decision time. They write their final belief on a slip. They can either stick with the envelope or change to the witness report. Collect the final belief slips and the envelopes (both the one they wrote initially and the one we gave them).
  - 30-40 min: Revelation. Reveal the actual outcomes for each flip. Then, for each student:
       - Open the envelope we gave them: does it match the actual outcome? (This reveals if they were in good or bad case.)
       - Check their final belief: was it correct?
       - Also, note if they changed (compare their initial prediction to their final belief).
  - 40-75 min: Group discussion (debrief). We'll structure this below.
  - 75-90 min: Wrap-up and connect to the dogmatism paradox (naming it and explaining the steps).

  **Debrief Structure**:

  1. **Experience Sharing (10 min)**:
     - Ask: "How did you feel when you got the witness report? Did you ignore it? Why or why not?"
     - Encourage both good and bad case students to share. Focus on the reasoning: "I knew the envelope was from a 100% reliable source, so the witness must be wrong." vs. "I wasn't sure, so I changed."

  2. **Mapping the Steps (15 min)**:
     - Guide them to reconstruct the reasoning:
          Step 1: Knowledge entails truth. (They believed they knew because of the envelope from the reliable source.)
          Step 2: Therefore, any contrary evidence must be misleading. (The witness report must be wrong because it contradicts a known truth.)
          Step 3: Because they know the evidence is misleading, they may ignore it.
          Step 4: And they knew all this a priori? (They didn't need to check the witness's reliability further because they already knew the truth.)

     - Point out that this reasoning is the same whether they were in the good case or the bad case. In the bad case, they were wrong, but they used the same rule.

  3. **Key Realization (10 min)**:
     - The rule that protects the knower (in the good case) is the same rule that arms the fool (in the bad case). And from the inside, they couldn't tell the difference.
     - Ask: "When you decided to ignore the witness, did you feel like you were being rational? Why? And if you were in the bad case, what does that say about the rule?"

  4. **Addressing Resistance (10 min)**:
     - Two standard resistances:
          a) Denying that you always know that you know (KK principle). In the activity, they thought they knew because of the 100% source. But in the bad case, they didn't really know. So they didn't know that they knew. But the rule still applied in their reasoning because they took themselves to know.
          b) Separating knowledge from rational belief revision. Some might say: "But in the bad case, they didn't actually know, so they shouldn't have ignored the witness." But the point is that they *took themselves* to know. And the rule they used (if you know, you can ignore) is what led them astray. Moreover, in the good case, it was rational to ignore? But then we have to ask: is the rule a good one?

     - Highlight: The activity shows that if we allow the rule "if I know P, I can ignore any evidence against P", then in the bad case, it leads to error. But we can't tell the good and bad cases apart. So the rule is dangerous.

  **What the Activity Cannot Reproduce**:
  - The a priori status of the premises: The argument is supposed to be known independently of experience. In the activity, they relied on empirical claims (the source's reliability). But the dogmatism paradox is about a priori reasoning.
  - The focus on knowledge vs. rational belief: The activity blurs knowledge and rational belief because we set up a situation where they feel they know. But the philosophical debate is about whether the paradox really targets knowledge or rational belief revision.

  **Predictable Problems**:
  1. **Confusion about the envelopes**: They might think they can open the envelope we gave them. We must emphasize: "Do not open until the end."
     - Solution: Write "DO NOT OPEN UNTIL INSTRUCTED" on the envelopes.
  2. **Not taking the setup seriously**: Some might not believe the 100% reliability claim because it's a game. They might think we are tricking them.
     - Solution: In the introduction, say: "For the purpose of this activity, assume that I am 100% reliable. I have recorded the truth. This is part of the rules of the game."
  3. **The witness reliability**: They might focus too much on the 80% and try to calculate probabilities. We want them to see that if they truly know, they don't need to calculate.
     - Solution: When giving the witness report, remind them: "If you know the outcome from the 100% reliable source, then the witness must be wrong, so you can ignore it without even looking at the 80%."
  4. **Dead air moments**:
     - When distributing materials: Have a timer visible. Say: "You have 2 minutes to write your initial prediction and seal it."
     - During decision time: If some finish early, ask them to write down their reasoning.
     - During revelation: Have a list of the actual outcomes ready to read out.

  **Lines to Have Ready**:
  1. When they receive the witness report: "Remember, if you already know the outcome for sure, this new evidence must be mistaken. So you might not need to change your belief. But if you're not sure, you might reconsider."
  2. If someone asks if they can change their belief to something else: "No, you can only choose between what the envelope says and what the witness says."
  3. If someone questions the 100% reliability: "In this game, we are assuming that my recording is 100% reliable. That's a rule we're playing by."

  **Materials Checklist**:
  - 14 small envelopes (for their initial predictions) - labeled with names.
  - 14 small slips for initial predictions.
  - 14 pre-prepared envelopes from us (7 good, 7 bad) - labeled with names.
  - 14 witness reports (each saying the opposite of what is in our envelope for that student) - labeled with names.
  - 14 decision slips.
  - A list of the actual coin flip outcomes (pre-recorded).

  **Random Assignment**:
  - Randomly assign the 7 good and 7 bad cases. Flip a coin 14 times and record. For bad cases, flip the outcome for the envelope content.

  This activity should create the experience we want. Now, let's write it up clearly.
answer: |-
  ### The Sealed Evidence Game  
  **Core Idea:** Students play as investigators who receive a "verified truth" (a sealed envelope) about a case, then encounter contradictory evidence. The rule: if you *know* your envelope's truth, you may ignore the contradiction. Half are in the "good case" (envelope is correct), half in the "bad case" (envelope is wrong)—but they can't tell which.  

  **Materials** (printable; 5 minutes prep):  
  - **14 envelopes** (7 labeled "CASE A", 7 "CASE B").  
  - **28 slips of paper**: 14 for "truth statements" (pre-written), 14 for "evidence slips" (pre-written).  
  - **1 master list** (for you) of the "actual facts" (matches CASE A envelopes).  
  - **Stickers or pens** for students to mark decisions.  

  **Setup**:  
  - **CASE A envelopes (good case)**: Contain a slip with a true statement (e.g., "The suspect has an alibi for Tuesday night").  
  - **CASE B envelopes (bad case)**: Contain a slip with a false statement (e.g., "The suspect has an alibi for Tuesday night" – *but the truth is they don't*).  
  - **Evidence slips**: For every student, a slip stating: *"New witness: The suspect was seen near the crime scene on Tuesday night."* (This contradicts the alibi claim.)  
  - **Actual facts** (on your master list): "The suspect has **no** alibi for Tuesday night" (making CASE B false and CASE A true).  

  **Rules for Students**:  
  1. You are investigators. You receive a sealed envelope containing a verified truth about a case.  
  2. You **must trust** the envelope’s content—it comes from a source that *never lies*.  
  3. Later, you’ll get new evidence. If you *know* your envelope’s truth, you may ignore or discard the new evidence.  
  4. Your goal: Decide the suspect’s guilt (guilty/not guilty) based on *only* what you end up believing.  

  ---

  ### Minute-by-Minute Timeline (90 Minutes Total)  
  **0–10 min: Setup & Role Assignment**  
  - Assign each student a random envelope (CASE A or B; don’t reveal the split).  
  - Introduce the case: *"A theft occurred Tuesday night. Your envelope contains a verified fact. You may open it now—this is your truth."*  
  - Students open envelopes. All see a statement about the alibi (e.g., "The suspect has an alibi").  
  - **Crucial directive**: *"Remember: Your source is infallible. You now* know *this fact."*  

  **10–15 min: Initial Belief Commitment**  
  - Students write their initial verdict (guilty/not guilty) on a slip.  
  - **Prompt**: *"Based* solely *on your envelope, is the suspect guilty? Keep this slip—you’ll revise later."*  
    *(Guilt hinges on the alibi: alibi = not guilty, no alibi = guilty.)*  

  **15–25 min: Contradictory Evidence & Decision**  
  - Distribute "evidence slips" to all students (the witness sighting near the crime scene).  
  - **Announce rules**:  
    - *"If you* know *your envelope’s truth, you may ignore this evidence—it must be misleading."*  
    - *"If you’re unsure, you must weigh both pieces."*  
  - Students decide:  
    - **Option 1**: Discard the evidence slip (ignore it).  
    - **Option 2**: Keep it and revise their verdict.  
  - They mark their final verdict (new slip). Collect all slips.  

  **25–35 min: Reveal Actual Facts & Group Sorting**  
  - Reveal the "actual fact" from your master list: *"The suspect has* no *alibi (so they are guilty)."*  
  - Students with CASE A (good case): See their envelope was **true**.  
  - Students with CASE B (bad case): See their envelope was **false** (stunned moment!).  
  - Group by CASE A/B. Share:  
    - How many ignored the evidence? How many changed their verdict?  
    - Display results (e.g., "CASE A: 6 ignored evidence, 1 revised; CASE B: 7 ignored evidence").  

  **35–75 min: Structured Debrief**  
  *(Key goal: Reconstruct the paradox from their experience.)*  

  1. **Experience Sharing (10 min)**  
     - Ask CASE B students: *"You ignored the evidence—why? What did it feel like in the moment?"*  
     - Ask CASE A students: *"Did ignoring feel rational? What if you’d been wrong?"*  
     - **Target insight**: Both groups felt entitled to ignore—even CASE B, who were dead wrong.  

  2. **Reconstructing the Steps (15 min)**  
     Map their choices to the paradox’s logic:  
     | **Step in Paradox** | **Activity Moment** | **Student Quote (Prompt for Them)** |  
     |----------------------|---------------------|-------------------------------------|  
     | **Knowledge entails truth** | Opening the envelope | *"Why did you trust your envelope? What did ‘knowing’ mean here?"* |  
     | **Contrary evidence must be misleading** | Receiving the witness slip | *"If you* knew *your truth, why couldn’t the witness be right?"* |  
     | **You may ignore misleading evidence** | Choosing to discard | *"What rule allowed you to dismiss it? Did you check if it* was *misleading?"* |  
     | **This is known a priori** | Pre-evidence commitment | *"Did you need to see the witness to know you could ignore them?"* |  

  3. **The Good vs. Bad Case Trap (10 min)**  
     - Highlight: *"The rule to ignore evidence kicked in* before *you knew if your envelope was true. What does that do to someone who’s confident but wrong?"*  
     - Contrast: CASE A (ignoring protected truth) vs. CASE B (ignoring entrenched error).  
     - **Key question**: *"From the inside, could you tell which case you were in?"*  

  4. **Addressing Resistances (10 min)**  
     - **Resistance 1: "But I didn’t *really* know in the bad case!"**  
       → *"True! But you* took yourself *to know. The rule only requires that you* believe *you know—not that you actually do. This rule arms the fool as it protects the knower."*  
     - **Resistance 2: "Ignoring isn’t rational—knowledge ≠ rationality!"**  
       → *"But in CASE A, ignoring* was *rational (you were right!). The rule conflates ‘having knowledge’ and ‘being rational.’ Yet in CASE B, it caused irrationality. Can we untangle these?"*  

  **75–90 min: Reveal the Paradox & Limitations**  
  - Name the "dogmatism paradox": *"Today you lived out a thought experiment where knowing something seems to license dismissing future counter-evidence. Philosophers call this the dogmatism paradox."*  
  - **What the activity couldn’t capture**:  
    - The *a priori* sting: In the game, your "knowledge" relied on empirical trust (the source). The real paradox claims you can ignore evidence *purely* through logical reasoning, not experience.  
    - Knowledge vs. rationality: The game blurs these (you acted on belief in knowledge). But the paradox targets *knowledge itself*—not whether revising beliefs is rational.  
  - **Final hook**: *"This is why some philosophers think knowledge isn’t just ‘true justified belief’—or that we need to rethink how knowledge interacts with evidence."*  

  ---

  ### What Will Go Wrong (and How to Fix It)  
  1. **"Why trust the envelope? Sources can lie!"**  
     - Students may balk at the "infallible source" setup.  
     - **Your line**: *"For this game, we’re* stipulating *the source is perfect—like a math proof. Suspend real-world doubts."*  
     - **Pre-empt it**: Write on the board pre-activity: **"RULES: Your envelope source is INFALLIBLE. Trust it absolutely."**  

  2. **Dead air during evidence decisions**  
     - Some students will overthink; others finish instantly.  
     - **Your line**: *"30 seconds left! Go with your gut—what feels right when you* know *your truth?"*  
     - **Fix**: Have early finishers write *why* they ignored/kept evidence.  

  3. **"But the witness could be reliable too!"**  
     - Students may argue for weighing evidence, ignoring the rule.  
     - **Your line**: *"If you* know *your envelope is true, the witness* must *be wrong. Can both be true?"* (Force the either/or.)  

  **Predictable Outcomes**:  
  - 90% of CASE B students will ignore evidence (entrenching error).  
  - CASE A students will feel smug until CASE B’s reveal—then unease sets in.  
  - The debrief’s "good vs. bad case" contrast will trigger the "aha" moment.  

  **Why This Works**:  
  - Students *feel* the seduction of ignoring evidence (it’s easier, protects ego).  
  - CASE B’s reveal shocks them into seeing how the rule entrenches error.  
  - They reconstruct the paradox *from their own choices*—no jargon needed.  

  **First Time Tip**: Run it with a colleague first. The envelope reveal is high-stakes—lean into the drama!
