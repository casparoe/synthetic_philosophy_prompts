prompt: |-
  ok so my best friend from my linguistics PhD program is getting married next month and asked me to be best man, and I need help with the toast. Here's the annoying part: the bride's mom is planning this wedding like it's a coronation, everything has to be perfect, and there's a whole backstory where the engagement ring is actually the same ring the groom bought years ago to propose to his college girlfriend, who said no -- he just got it resized and re-set instead of buying a new one (he's either cheap or sentimental, pick one). The bride thinks this is hilarious and kind of sweet in a waste-not-want-not way. The mom does not know and must never know, she would loose her mind. But our entire grad school cohort knows, because we're the idiots who chipped in to pay for the resizing as a joke wedding gift, and they will be personally offended if the toast doesn't nod to it somehow.

  So here's the actual assignment: write me a toast where the ring thing lands for the cohort but stays completely deniable to the mom. Like if she corners me after and goes "ok what did you mean by that bit about the ring," I need to be able to honestly say I never claimed anything about where it came from. I don't want to just omit the topic -- I want real Gricean implicature doing the work here. Flout a maxim or two so the cohort can calculate the meaning off background info only they have, while the literal content stays clean and cancellable. Bonus: the cohort will also get a kick out of watching me actually pull off a real Gricean move live, so it should read as competent implicature to them too, not just a vague hint. Then after the toast, give me a short breakdown of which maxim each risky line is flouting and why it counts as a genuine calculable implicature and not just a hint so heavy that a sharp listener could still pin it on me.

  Keep the whole thing warm, not roast-y -- this needs to read as "these two idiots deserve each other," not as an exposé.
