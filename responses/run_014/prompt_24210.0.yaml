  Now, the Gibbard-Satterthwaite theorem states that any voting rule that is non-dictatorial and has a range of at least three alternatives cannot be strategy-proof and satisfy unrestricted domain. Arrow's theorem (which is about social welfare functions) has similar implications for social choice functions.

  We also note that Condorcet consistency and resoluteness can conflict: if there is a cycle (no Condorcet winner) then a rule that requires a Condorcet winner to be chosen would fail to pick a winner. But we require resoluteness (always pick one). So we cannot require Condorcet consistency in all cases.

  But the central conflict for this board is likely between strategy-proofness and the other requirements.

  Let us list the non-negotiable requirements:

  - Non-dictatorship (1)
  - Pareto efficiency (3) [this is weak and non-controversial]
