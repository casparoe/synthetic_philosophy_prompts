  - Strategy-proofness (8)

  This is the Gibbard-Satterthwaite trio. We cannot have all three.

  However, note that Condorcet consistency (4) and resoluteness (7) can also conflict because of cycles. But with three alternatives and five voters, cycles are possible but not inevitable. We might avoid cycles by assuming single-peakedness? But we don't have evidence of that.

  But the key obstruction is the Gibbard-Satterthwaite trio.

  Therefore, we must abandon one of these. Which one?

