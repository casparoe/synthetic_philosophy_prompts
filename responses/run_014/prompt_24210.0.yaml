  Now, strategy-proofness (8) is non-negotiable in an ideal world, but the theorem says we cannot have it with unrestricted domain and non-dictatorship. So we have to relax one of these.

  Unrestricted domain (2) is a candidate for relaxation. But let's see what else might conflict.

  The subset that cannot be jointly satisfied:

