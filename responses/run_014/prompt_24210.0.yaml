  We are designing a voting rule for a five-person editorial board selecting one of three proposals (A, B, C). The rule must be deterministic and explainable in one short paragraph.

  Desiderata:

  1. **Non-dictatorship (Non-negotiable):** No single member's preference always determines the outcome. 
     - *Case:* The board is a collaborative effort; no one person should dominate. A dictatorship would undermine the purpose of having a board.

  2. **Unrestricted Domain (Negotiable?):** The rule must be able to handle any possible set of complete and transitive rankings by the five members. 
     - *Case:* We cannot assume that the board members' preferences will always have a common structure (like single-peakedness). However, in practice, preferences might be structured, but we want robustness.
     - *Note:* This is often required for generality, but if we can assume structure (like single-peakedness) then we may avoid some impossibilities. However, without evidence of such structure, we require this.

  3. **Pareto Efficiency (Non-negotiable):** If every member prefers proposal X over Y, then Y should not be selected.
     - *Case:* It would be perverse to choose an option when there is another that everyone prefers.

  4. **Condorcet Consistency (Negotiable?):** If there exists a proposal that beats every other proposal in pairwise majority comparisons (a Condorcet winner), then that proposal should be selected.
     - *Case:* Such a candidate represents the will of the majority in a head-to-head contest. However, a Condorcet winner does not always exist (e.g., in a cycle: A>B, B>C, C>A by majorities).
     - *Note:* This is a strong form of majority rule but not always achievable without cycles.

  5. **Anonymity (Non-negotiable?):** The outcome should depend only on the votes, not on who cast them. 
     - *Case:* All members have equal standing; the rule should be symmetric in voters.

  6. **Neutrality (Non-negotiable?):** The rule should treat all proposals symmetrically. 
     - *Case:* The rule should not favor one proposal over another based on the labeling.

  7. **Resoluteness (Non-negotiable):** The rule must always choose exactly one proposal (no ties or random selection). 
     - *Case:* The board must make a decision.

  8. **Strategy-proofness (Non-negotiable?):** No voter should be able to achieve a better outcome by misrepresenting their preferences. 
     - *Case:* We want honest voting. However, the Gibbard-Satterthwaite theorem says that for more than two alternatives, no rule that is non-dictatorial and satisfies unrestricted domain is strategy-proof. So we might have to relax this.

  9. **Simplicity (Non-negotiable?):** The rule must be explainable in one short paragraph to contributors. 
     - *Case:* Transparency and trust require that the process is understandable.

  10. **Majority Winner (Negotiable?):** If a majority of voters rank a proposal first, then that proposal should be selected. 
