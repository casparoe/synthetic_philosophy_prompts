  Let me unpack their three focal points systematically. First: regression coefficients. Under counterfactuals, regression is just statistical adjustment, but interventionism forces us to ask "adjustment for what?" The backdoor criterion matters - are we blocking confounding paths or creating collider bias? In oceanography, if they regress temperature on salinity while controlling for density... classic collider! That would mislead under interventionism but counterfactuals might miss it.

  Second: policy levers. Here interventionism shines. Saying "CO2 causes warming" requires imagining a manipulation - easy for emissions policies. But counterfactuals would accept "if CO2 were lower" without requiring realistic interventions. The subtle danger? When scientists say "human activity caused event X" under counterfactuals, policymakers might hear "we can fix this by manipulating Y" - but interventionism forces specificity. Huge for attribution statements.

  Third: non-manipulables. Latitude as cause? Counterfactuals allow "if this location weren't at 30°N...", but interventionists would call it a fixed context. Yet ocean stratification... ah, that's interesting! We can't manipulate it directly, but we can model how surface forcing (manipulable) changes it. So interventionism might accept mediated effects. This layers nicely with their oceanography expertise - they'll appreciate the nuance.

  The real epistemic kicker is how interventionism guards against "in-principle" counterfactuals. Climate skeptics love "what if clouds compensated?" - interventionism demands evidence for realistic pathways. Also, for public communication: saying "our model assumes no unblocked backdoor paths" is more honest than vague counterfactual claims.

