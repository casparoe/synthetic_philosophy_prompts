  I'm writing a novel whose protagonist is a moral philosopher, and I want the technical passages to be accurate rather than merely plausible. I understand that Harsanyi's aggregation theorem is routinely summarized as a derivation of utilitarianism, but that its actual conclusion is that the social welfare function takes the form of a weighted sum of the individuals' von Neumann–Morgenstern utilities, with the weights left undetermined. Could you explain, from the theorem's assumptions, why the weights come out as free parameters rather than fixed values — in particular, why the Pareto-type condition constrains them to be non-negative without fixing their relative magnitudes — and why the common move to equal weights requires a further argument, such as a symmetry or veil-of-ignorance prior, that is logically distinct from the aggregation result itself?
