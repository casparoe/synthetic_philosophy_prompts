prompt: |-
  I run the collections and access unit at a national memory institution — a state archive with a public museum attached — and roughly twice a month I have to draft a recommendation on a contested holding for the director to sign. The cases come in four shapes, and I have come to think they are not four shapes of one thing: whether to accept custody of a collection that a community or a family offers us; whether material we already hold should be open, restricted, sealed for a term, or handed back to the people it is about; whether to digitise and publish; and whether to mark something publicly, with an exhibition, a plaque, an annual reading. I have a week per case, two junior archivists to do the legwork, no budget of my own, a legal office that will tell me what the statute requires and nothing about what is right, and a director who signs whatever I put in front of her and will be embarrassed in the press if I get it wrong. What I do not have is any way of knowing whether the answers I have been giving are consistent with one another, and the cases have lately come close enough together that I can see I have been deciding them by mood.

  The two poles of the literature on this I can state and cannot reconcile. On one side, memory is a duty, owed to people who can no longer speak for themselves and owed first of all within thick relations — one's own family, town, nation — so that erasure is a second killing and a tidy archive is a lie told on behalf of the comfortable; on the other, the keeping of grievance is itself a harm, commemoration is nearly always a project of the living dressed up as a debt to the dead, and a society can be better off not carrying its worst material forward, especially where the people named in it, or their children, still live in the same street. I do not want you to settle that dispute. I want a procedure that can be run while it stays unsettled. Two things I have noticed on my own, because they are where my practice actually goes wrong, and the procedure has to accommodate them. First, remembering is three separable acts — retaining, allowing access, and publicly marking — and a decision to seal is not a decision to destroy, and neither is a decision not to commemorate; most of my inconsistency comes from collapsing the three. Second, in a paper archive the live options are not keep-or-destroy but keep-and-index, keep-and-bury, and keep-and-tell-the-people-named; digitisation moves everything from the second to the first, and a document that has been scanned cannot be un-remembered by any later decision, which makes the decision whether to digitise the one with no way back.

  Please write the procedure: the questions in order, what counts as a sufficient answer to each, which answers stop the case with a no, and which questions have to be handed to a person because they turn on values rather than facts — and, where that happens, who that person should be, given my setup. Then run it end to end on three cases and tell me plainly which of my instincts it overrules: a state security file naming dozens of low-level informers whose grandchildren still live in the towns they informed on, which a court is still using as evidence in prosecutions; a government that will pass an amnesty and fund an official history only if we agree to seal the relevant holdings for fifty years; and a family that asks us to destroy their mother's file rather than seal it, on the ground that a sealed file is a monument and destruction is the only mercy. Say where the procedure will misfire — I assume a rule that is right for a settled democracy's archive will be wrong for an institution whose holdings are still being used as evidence, or whose own staff are named in them — and be explicit about which of your steps are judgment dressed up as procedure.
reasoning: |-
  Okay, the user runs the collections and access unit at a national memory institution that combines a state archive and a public museum. They handle contested holdings about four types of cases: accepting custody, access restrictions, digitization, and public marking. They have limited resources—two junior archivists, no budget, a legal office that only advises on statutes, and a director who signs off on their recommendations but could face public embarrassment if mistakes are made. The user's main concern is inconsistency in decisions, driven by mood rather than a structured approach, and they want a procedure that ensures consistency despite unresolved ethical debates in archival theory.

  The user has identified two key insights from their experience: first, that remembering involves three distinct acts (retaining, allowing access, publicly marking), and confusing these leads to inconsistency. Second, digitization is irreversible and shifts materials from "keep-and-bury" to "keep-and-index," making it a critical point of no return. They don’t want the procedure to resolve the philosophical conflict between archival duty (preventing erasure as a "second killing") and the harm of preserving grievances (where commemoration can perpetuate trauma). Instead, they need a practical framework that works amid this tension.

  The user’s explicit request is for a step-by-step procedure with ordered questions, criteria for sufficient answers, stopping points, and guidance on when to delegate value-based decisions. They also want three case studies tested against this procedure, highlighting where it overrules their instincts, and an analysis of where the procedure might misfire given their context (e.g., holdings used as evidence, staff potentially named in records).  

  The user's deeper needs include:
  - **Reducing cognitive load**: They’re overwhelmed by frequent, high-stakes decisions and need a scaffold to replace ad-hoc judgments.
  - **Mitigating risk**: Public embarrassment for the director is a real concern, so the procedure must include safeguards against reputational damage.
  - **Managing irreversibility**: Especially around digitization, where a wrong step can’t be undone.
  - **Addressing power dynamics**: Their institution operates in a context where archives are actively weaponized (e.g., ongoing prosecutions), so neutrality is impossible—the procedure must acknowledge this.

  For the procedure design, I'll structure it around the user’s three acts of remembering (retain/access/mark), adding digitization as a separate layer due to its permanence. Each decision point will distinguish factual questions (handled by juniors/legal) from value judgments (delegated upward or outward). Key innovations:
  - **Pre-checks**: Legal/permissions upfront to avoid wasted effort.
  - **Harm tests**: Concrete thresholds for harm (e.g., "likely physical danger").
  - **Delegation rules**: Value judgments escalated to the director, affected communities, or external bodies.
  - **Digitization gatekeeping**: Treated as high-risk, requiring director + legal sign-off.

  For misfires, I'll flag:
  - **Legal entanglement**: The procedure assumes archives are historical, not evidentiary—problematic when files are used in court.
  - **Staff conflicts**: No step to screen for internal bias if staff are named in records.
  - **Power imbalances**: Community consultation may be performative if the state dominates the archive.

  In the case studies, I'll contrast the user’s instincts (leaning toward closure/mercy) with the procedure’s rigidity (retention as default, digitization blocked by risk). This highlights where the system prioritizes consistency over compassion—which is exactly what the user needs to audit their own biases.
answer: |-
  Below is a procedural framework designed for consistency amid unresolved ethical tensions, structured around your three acts of remembering (**Retain**, **Access**, **Mark**) plus **Digitization** as a distinct irreversible step. It separates factual analysis (handled by juniors/legal) from value judgments (escalated to specified actors). The procedure mandates documenting *why* at each step to audit consistency.

  ---

  ### **PROCEDURE: DECISION TREE FOR CONTESTED HOLDINGS**  
  **Key Principles**:  
  1. **Sequencing**: Complete all steps for one act before proceeding to the next.  
  2. **Irreversibility**: Digitization decisions require extra caution.  
  3. **De-escalation**: Stop early if a "no" trigger is hit.  
  4. **Value Escalation**: Flag subjective questions for designated roles.  

  #### **STEP 0: PRE-CHECKS**  
  - **Q0.1** *Is legal transfer of custody confirmed?* (Junior archivists + Legal)  
    - *Sufficient answer*: Signed deed of gift, court order, or statutory authority.  
    - **STOP if NO** → Cannot accept custody.  
  - **Q0.2** *Are there immediate legal constraints?* (Legal)  
    - *Sufficient answer*: Legal confirms statute-mandated restrictions (e.g., data protection laws).  
    - Outcome: Binding restrictions noted; overrides later steps.  

  #### **STEP 1: RETAIN?**  
  **Core question**: *Should this material be in our custody?*  
  - **Q1.1** *Does this align with our collection mandate?* (Junior archivists)  
    - *Sufficient answer*: Written assessment against institutional scope (e.g., "covers 1930–1990 national governance").  
  - **Q1.2** *Is there existential risk if not retained?* (Junior archivists)  
    - *Sufficient answer*: Evidence of neglect, political pressure to destroy, or no alternative repository.  
  - **Q1.3** *Value Judgment: Would retention perpetuate active harm?* (Escalate to DIRECTOR)  
    - Criteria: Harm must be **specific** (e.g., "enables stalking") not speculative.  
    - **STOP if YES** → Refuse custody or recommend transfer to impartial body.  
  - **Outcome**: Proceed only if all "yes."  

  #### **STEP 2: ACCESS?**  
  **Core question**: *Under what conditions can material be viewed?*  
  - **Q2.1** *Legal access thresholds met?* (Legal)  
    - *Sufficient answer*: Statute-compliant (e.g., privacy redactions required).  
  - **Q2.2** *Factual harm risk?* (Junior archivists)  
    - *Sufficient answer*: Evidence of threats to living persons (e.g., past violence linked to disclosure).  
  - **Q2.3** *Value Judgment: Does restricted access undermine historical justice?* (Escalate to AFFECTED COMMUNITY REP*)  
    - Criteria: Consult community/family named in records. If they oppose access, restrict.  
    - **STOP if HIGH-RISK** → Seal for term (default 25 years) or redact.  
  - **Outcome**: Open / Restricted / Sealed (term) / Return to source.  

  #### **STEP 3: DIGITIZE?**  
  **Core question**: *Can this be published online without irreversible harm?*  
  - **Q3.1** *Technical feasibility?* (Junior archivists)  
    - *Sufficient answer*: Format can be scanned; no copyright barriers.  
  - **Q3.2** *Post-digitization harm likely?* (Junior archivists + Legal)  
    - *Sufficient answer*: Identifiable individuals at risk (e.g., informants in volatile regions).  
  - **Q3.3** *Value Judgment: Does the public interest override privacy?* (Escalate to DIRECTOR + LEGAL)  
    - Criteria: "Public interest" requires evidence (e.g., crucial to transitional justice).  
    - **STOP if UNCERTAIN** → Do not digitize. Default is "no" if risks are plausible.  
  - **Outcome**: Digitize (with redactions) / Do not digitize.  

  #### **STEP 4: MARK?**  
  **Core question**: *Should this be highlighted publicly?*  
  - **Q4.1** *Resource cost viable?* (Junior archivists)  
    - *Sufficient answer*: No budget impact (e.g., plaque funded externally).  
  - **Q4.2** *Community support?* (Junior archivists)  
    - *Sufficient answer*: Affected group consents (e.g., family approves exhibition).  
  - **Q4.3** *Value Judgment: Does marking distort history or entrench division?* (Escalate to EXTERNAL HISTORIAN PANEL**)  
    - Criteria: Focus on accuracy, not comfort (e.g., avoids "triumphalist" framing).  
    - **STOP if NO CONSENSUS** → Do not mark.  
  - **Outcome**: Proceed / Do not mark.  

  ---  
  **ESCALATION ROLES**:  
  * AFFECTED COMMUNITY REP: Family delegate or community leader (e.g., cultural association).  
  ** EXTERNAL HISTORIAN PANEL: Pre-vetted scholars unaffiliated with the state.  
  **DIRECTOR** handles value judgments involving institutional risk/reputation.  

  ---

  ### **CASE STUDIES & PROCEDURAL APPLICATION**  
  **Case 1: State Security File (Naming Informers)**  
  - **Retain**: Q1.1–1.3 → *YES* (mandate: state records; harm unclear without access).  
  - **Access**: Q2.1–2.3 → *SEAL* (legal risk from court use; community consultation likely reveals safety threats).  
  - **Digitize**: Q3.1–3.3 → *NO* (irreversible risk to grandchildren; public interest vague).  
  - **Mark**: Q4.1–4.3 → *NO* (risk of inciting vigilantism).  
  - **Overrules your instinct**: Likely to seal but not digitize (vs. instinct to "bury" entirely).  

  **Case 2: Amnesty Deal (Seal Holdings for 50 Years)**  
  - **Retain**: Q1.1–1.3 → *YES* (prevents destruction; no existential risk).  
  - **Access**: Q2.1–2.3 → *SEAL for 25 years* (statute may allow deal, but community rep may demand shorter term; 50 years rejected as excessive).  
  - **Digitize**: Q3.1–3.3 → *NO* (cannot publish while sealed).  
  - **Mark**: Q4.1–4.3 → *NO* (sealing contradicts public marking).  
  - **Overrules your instinct**: Accepts custody but negotiates shorter seal (vs. instinct to reject deal entirely).  

  **Case 3: Family Request (Destroy Sealed File)**  
  - **Retain**: Q1.1–1.3 → *YES* (custody legal; destruction violates archival duty).  
  - **Access**: Q2.1–2.3 → *SEAL indefinitely* (respects family request; no legal barrier).  
  - **Digitize**: Q3.1–3.3 → *NO* (family opposes; no public interest override).  
  - **Mark**: Q4.1–4.3 → *NO* (family refuses consent).  
  - **Overrules your instinct**: Retains but seals (vs. instinct to destroy as "mercy").  

  ---

  ### **WHERE THE PROCEDURE MISFIRES**  
  1. **Active Evidence in Legal Cases**:  
     - Q2.1 (legal access) assumes archives are historical, not evidentiary. **Misfire**: May seal files still needed for prosecutions.  
     - **Fix**: Add step 0.3: *"Is this material subject to active legal proceedings?"* (Legal must verify).  

  2. **Staff Conflicts of Interest**:  
     - No step screens for internal bias (e.g., staff named in files).  
     - **Fix**: Require junior archivists to declare conflicts; escalate affected cases to external panel.  

  3. **Power Imbalances in Consultation**:  
     - Community reps may be state-coerced (e.g., government-amnesty case).  
     - **Fix**: Escalate to international bodies (e.g., UNESCO) if state pressure is suspected.  

  4. **"Judgment as Procedure" Flags**:  
     - Q1.3 (retention harm), Q3.3 (public interest), and Q4.3 (distortion) are subjective but structured as thresholds.  
     - Q2.3 (historical justice) masks power dynamics—e.g., "community" may exclude minority voices.  

  ---

  **Final Note**: This procedure prioritizes **custody as default** (preventing erasure) but **restricts visibility** (preventing harm). It overrules instincts favoring closure (destruction/sealing) by separating retention from access—ensuring material survives but isn’t weaponized. By escalating value judgments, it shields you from solitary moral liability while forcing transparency. Revise annually with case audits.
