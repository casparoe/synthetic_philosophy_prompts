answer: |-
  You've encountered a sophisticated version of Derek Parfit's "Mere Addition Paradox" applied to climate ethics. Your friend's argument cleverly exploits tensions within total utilitarianism (where moral value = total well-being summed across all people). Here’s how to break it down:

  ### The Core Weakness: **Reject Premise (2)**  
  **"We should pay steep costs now to increase the number of future people"** is the flawed step.  

  #### Why it looks plausible:  
  Total utilitarianism *does* imply that adding more people with good lives increases total value. If each future life has positive moral weight, and impartiality requires aggregating all welfare, then more good lives = more value. This seems consistent with (1).  

  #### Why it’s rejectable:  
  1. **The "Person-Affecting" Objection**:  
     - Creating new people isn't the same as improving existing lives. Future people who *could* exist aren't "harmed" if we don't create them (they don't exist to be deprived). Sacrificing for *actual* future people (who will exist regardless) to prevent their suffering is different from sacrificing to create *additional* people.  
     - **Commitment**: You must deny that potential people have claims on us to bring them into existence.  

  2. **Non-Identity Problem**:  
     - Pro-natal policies don't benefit *specific* future individuals—they create *different* people. Climate policy affects the welfare of identifiable future people (e.g., "people alive in 2120"). But adding more people changes who exists. Sacrificing for "different" people isn't demanded by obligations to "those who will actually live."  
     - **Commitment**: You distinguish between "duties to future persons" (who will exist) and "duties concerning population size" (which involve different moral questions).  

  3. **Asymmetry of Harm**:  
     - We have strong duties to prevent harm to future people (e.g., climate catastrophe), but no symmetric duty to create new people to experience benefits. A world with 10 billion happy people isn't *morally worse* than one with 20 billion equally happy people—it just has less total happiness.  
     - **Commitment**: You accept that while suffering is bad, absence of pleasure isn't equivalently bad if no one exists to be deprived.  

  ---

  ### What Rejecting (2) Preserves:  
  - **Climate Action Justification**: Premise (1) remains intact. Sacrificing to prevent severe harm to the *actual* future population (which will be large) is still obligatory.  
  - **Sheer Numbers Matter**: The moral weight of future generations isn’t discarded—it still amplifies duties to prevent catastrophe.  

  ---

  ### Alternative Views & Their Trade-offs:  
  If you reject (2), you still need a coherent account of obligations to future people. Here are options:  

  1. **Person-Affecting Sufficientarianism**  
     - **Core**: Focus on ensuring all future people meet a threshold of "enough" resources, safety, and capabilities. Prevent severe harm to those who will exist, without optimizing for total well-being or population size.  
     - **Applied to Climate**: Aggressive mitigation to avoid crossing thresholds (e.g., >2°C warming) that cause mass suffering.  
     - **Trade-off**: Accepts that "more happy lives" isn’t a goal. May not resolve dilemmas like wetland restoration vs. cooling shelters if both serve "sufficiency."  

  2. **Critical-Level Utilitarianism**  
     - **Core**: Only lives above a "critical" welfare level (e.g., free from dire poverty/climate chaos) add positive value. Creating lives *below* that level is bad.  
     - **Applied to Climate**: Prioritize avoiding futures where lives fall below the critical level (e.g., due to famines/displacement). Pro-natalism isn’t required unless new lives are *guaranteed* to be above the threshold.  
     - **Trade-off**: Must defend an arbitrary "critical level," and may still face population paradoxes in edge cases.  

  3. **Non-Aggregative Approaches** (e.g., Rights, Justice)  
     - **Core**: Future people have rights (e.g., to stable climate, essential resources) that trump aggregate calculations. Focus on avoiding irreversible harm, not maximizing total welfare.  
     - **Applied to Climate**: Sacrifice now to uphold the rights of future persons—similar to (1), but decoupled from population size.  
     - **Trade-off**: Harder to weigh diffuse/low-probability risks (e.g., tidal wetlands) against acute present needs.  

  ---

  ### Handling the Cooling Shelters vs. Wetlands Dilemma  
  Under any alternative view:  
  - **Cooling shelters** address immediate, high-certainty harm to identifiable people.  
  - **Wetlands restoration** addresses uncertain, deferred harm to statistical future people.  
  This isn't a contradiction—it's a **triage problem**. Prioritize:  
  1. Unavoidable catastrophic risks (e.g., >3°C warming),  
  2. High-certainty near-term harms,  
  3. Lower-certainty/long-term benefits.  

  ---

  ### Conclusion  
  Your friend’s argument fails by conflating **preventing harm to future people** with **creating additional people**. Rejecting (2) preserves the core case for climate sacrifice while avoiding pro-natalist absurdities. You can keep:  
  - Strong obligations to prevent climate catastrophe for future generations,  
  - The moral significance of their large numbers,  
  - Without endorsing unsustainable population growth.  

  This requires accepting that while we owe future people a livable world, we don’t owe existence to every possible person. The trade-off is a more nuanced population ethic—but one that aligns with urgent climate action.
