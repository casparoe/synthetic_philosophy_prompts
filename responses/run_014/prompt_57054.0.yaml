prompt: |-
  I'm a second-year moral philosophy PhD student working on the ethics of blame, and I've run into a configuration I can't place.

  Someone blames another for a familiar fault — padding an expense report, massaging data — and has never done it, isn't complicit in the doing of it, hasn't benefited from it, and isn't about to do it. So the standard objections don't get a grip: sermon and conduct don't conflict. But the blamer is openly disposed to do exactly the same thing were the odds of getting away with it any better. A professor denouncing data manipulation who says cheerfully that the only reason he never indulged is that his subfield replicates aggressively; a manager who fires someone for expense fraud and tells the team, in the same meeting, that a near-miss early in her career rather than any standing commitment is what keeps her honest.

  Is there an established concept for a standing deficit grounded purely in the blamer's avowed disposition rather than in a deed, an omission, or an inconsistency? Which existing categories come nearest — dispositional accounts of hypocrisy, complicity, the moral-luck objection to blame, bad faith, smugness — and how does this differ from each? And is the intuition I have here tracking a genuine loss of standing, or only an unattractive style of blaming that leaves the address intact? If nothing covers it, I'd rather you said so and proposed a term with boundary conditions than stretched an existing one: I particularly want to know whether disclosure does any work, whether an avowed disposition differs from a merely present one, and whether a blamer who fights the disposition is positioned differently from one who doesn't. I'm not after references — the carving is what I need.
reasoning: |-
  Okay, I'm looking at this query from a moral philosophy PhD student. They're working on the ethics of blame and have encountered a specific scenario where someone blames another for a fault they haven't committed themselves, but openly admit they would do the same thing under better circumstances. The key elements are: no actual deed, omission, complicity, or benefit, but an avowed disposition to commit the same fault. The student wants to know if there's an established concept for this, how it relates to existing categories, and whether it constitutes a genuine loss of standing or just unattractive style.

  First, I need to unpack the core issue. The blamer has no hypocrisy in the traditional sense because there's no inconsistency between their words and past actions. They haven't done the thing they're blaming others for. But their stated disposition creates a problem. The examples given—the professor who avoids data manipulation only because of aggressive replication in their subfield, and the manager who admits near-miss keeps her honest—highlight that the blamer's moral restraint is contingent on circumstances, not principle.

  Now, considering established concepts. Hypocrisy usually requires a contradiction between behavior and preaching. Here, there's no behavioral inconsistency, so it's not that. Complicity involves involvement in the wrong, which isn't present. Moral luck focuses on outcomes affecting blameworthiness, but here it's about the blamer's counterfactual willingness. Bad faith involves self-deception, but here the blamer is transparent about their disposition. Smugness is an attitude, not necessarily a standing deficit.

  The key seems to be the blamer's normative position. When they blame, they invoke shared norms, but by admitting they'd violate those norms given the chance, they undermine their authority. It's like saying, "This is wrong, but I'd do it too if I could." That weakens their standing because they're not truly committed to the norm; their adherence is pragmatic, not moral.

  The student also asks about disclosure. Does admitting the disposition make a difference compared to merely having it? I think yes. Avowal makes the lack of commitment public, so it directly affects the blamer's credibility in the blaming act. If it were a secret disposition, others might still accept their blame, but once stated, it's clear they don't genuinely endorse the norm.

  Regarding fighting the disposition: if the blamer acknowledges the disposition but resists it, that shows some moral engagement, which might preserve minimal standing. But if they embrace it, their blame seems hollow. For example, a professor who says, "I'm tempted to manipulate data but fight it" is different from one who says, "I'd do it if I could get away with it."

  So, is this a genuine loss of standing or just unattractive style? I lean towards loss of standing because the blamer's authority to hold others accountable is undermined. Blaming requires not just pointing out a fault but embodying the norm. If the blamer admits they'd violate it, their blame loses moral force; it becomes performative rather than authentic.

  If there's no established term, proposing one like "normative detachment" or "contingent commitment deficit" could work. The boundaries would include the avowed disposition, lack of actual wrongdoing, and the contingent nature of their adherence. Disclosure is crucial here—it's what makes the deficit visible and relevant to standing.
answer: |-
  Here's a conceptual carving of your scenario, addressing your core questions directly. This configuration sits at an intersection of existing ideas but doesn't fit neatly into a single established category. I'll propose a new term after analyzing the terrain.

  ### Core Problem: The "Acknowledged Contingency Deficit"
  The essence is a **blamer whose commitment to the norm they invoke is purely contingent on external constraints, not internal conviction, and they openly acknowledge this contingency.** Their standing deficit stems from the **explicit revelation that their own adherence to the norm is not morally motivated, but strategically calculated.** This undermines their authority to invoke the norm *as a moral demand* upon others.

  ### Why Standard Categories Don't Fully Capture It
  1.  **Hypocrisy (Dispositional or Behavioral):**
      *   **Nearest, but insufficient.** Dispositional hypocrisy focuses on a *hidden* willingness to violate the norm oneself. Here, the willingness is *avowed*. Behavioral hypocrisy requires past/present violation. Neither condition is met.
      *   **Difference:** Hypocrisy involves *concealment* of inconsistency. Here, the inconsistency (between demanding adherence from others while admitting one's own adherence is non-moral/contingent) is *disclosed*. The blamer isn't hiding a bad disposition; they're openly revealing their normative detachment. The flaw isn't inconsistency *with their own deeds*, but inconsistency *within the normative stance they adopt when blaming* – they demand others treat the norm as morally binding while admitting they treat it only as a prudential constraint.

  2.  **Complicity:**
      *   **Doesn't apply.** Complicity requires actual contribution to, enablement of, or benefit from the specific wrong. The scenario explicitly rules this out. The blamer is not causally or structurally implicated in *this* act.

  3.  **Moral Luck (Objection to Blame):**
      *   **Relevant tangent, but distinct.** Moral luck objections highlight how luck affects *blameworthiness*. Here, the focus is on the *blamer's standing*, not the initial wrongdoer's blameworthiness. The blamer *acknowledges* their own luck (e.g., aggressive replication preventing temptation, a near-miss) is the *only* reason they aren't blameworthy for the *same* act. This admission shifts the focus: it reveals that the blamer doesn't see themselves as fundamentally *different* in moral character from the blamed, only *luckier* in circumstance. This erodes their perceived authority to judge.

  4.  **Bad Faith:**
      *   **Possible symptom, not core deficit.** The blamer *might* be in bad faith if they deceive *themselves* about their own motives or the norm's authority. However, the scenario emphasizes their *openness* and *cheerful* acknowledgment, suggesting self-awareness, not self-deception. The deficit arises from the *content* of their admission (contingent commitment), not necessarily from a state of self-deception.

  5.  **Smugness / Sanctimony:**
      *   **Style, not core standing deficit.** These describe an *attitude* or *tone* of blaming that is off-putting due to perceived superiority. While the blamer's attitude ("cheerfully" admitting their contingency) might *be* smug, the core problem is deeper. The smugness *stems* from the revealed contingent commitment – they feel superior *despite* knowing their own adherence isn't morally grounded. The loss of standing comes from the revealed normative detachment enabling the smugness, not the smugness itself.

  ### The Intuition: Genuine Standing Loss
  Your intuition is tracking a **genuine loss of standing, not merely unattractive style.** Here's why:

  1.  **Erosion of Normative Authority:** Blaming effectively requires the blamer to speak *for* the norm, invoking its shared moral authority. By admitting their commitment is purely contingent ("I'd do it if I could"), the blamer severs their connection to the norm *as a moral imperative*. They reveal they see it only as a rule to be followed when the cost of breaking it is too high. They cannot sincerely appeal to the norm's *moral* weight because they don't grant it that weight for themselves under different circumstances. Their blame becomes mere *enforcement* of a rule, not a *moral appeal*.
  2.  **Failure of Identification:** Effective moral address often relies on the blamer implicitly saying, "We (as a moral community) hold this standard, and you have violated it." The admission reveals the blamer *doesn't* genuinely identify with the "we" upholding the standard *for moral reasons*. They are, in effect, saying, "You violated this rule we (but not I, in my heart) uphold, and I caught you." This fractures the shared normative ground necessary for the address to land as more than a power play.
  3.  **Undermining the Stakes:** Blame communicates the seriousness of the wrong. The blamer's admission trivializes the norm – it reveals that *even for them*, the wrong isn't inherently serious enough to avoid if the risk is low. This makes their condemnation ring hollow; they denounce an act they deem permissible under slightly altered conditions.

  ### Proposed Concept: Normative Disconnect via Avowed Contingency (NDAC)
  *   **Definition:** A loss of standing to blame arising from the blamer's explicit acknowledgment that their own adherence to the norm they invoke is contingent upon favorable circumstances (e.g., low opportunity, high risk of detection), rather than stemming from moral conviction. This avowal reveals a fundamental disconnect between the blamer and the norm *as a moral imperative*, reducing their blame to mere rule-enforcement.
  *   **Boundary Conditions:**
      *   **Avowal is Necessary:** A merely *present*, undisclosed contingent disposition does *not* cause NDAC. The deficit arises from the *communication* during the blaming act or its immediate context. Disclosure makes the disconnect public and relevant to the interpersonal dynamic of blame.
      *   **Contingency Focus:** The core is the dependence on *external factors* (risk, luck, lack of opportunity) as the *sole* reason for adherence. It's not just weakness of will ("I struggle but try"), but an admission that the *only* barrier is circumstance.
      *   **No Actual Wrongdoing Required:** NDAC can occur without the blamer having committed the specific wrong, benefited from it, or been complicit. The deficit is located in the *justification* (or lack thereof) for their own *non*-violation.
      *   **Distinct from Weakness/Fighting:** A blamer who *acknowledges a disposition but fights it* ("I'm tempted, I struggle, but I believe it's wrong and resist") maintains a connection to the norm *as a moral imperative*. Their struggle demonstrates recognition of its binding force. They retain minimal standing, though their blame might be less forceful or more empathetic. NDAC involves the blamer expressing *no internal struggle* – adherence is purely a calculation ("It's not worth the risk *for me*").
      *   **Not Universal Standing Loss:** NDAC likely causes a loss of standing *specifically* in relation to blaming others for violations of *this particular norm* whose authority they've undermined for themselves. Standing regarding other norms may remain intact.

  ### Why "Normative Disconnect via Avowed Contingency" (NDAC)?
  *   **Normative Disconnect:** Captures the core failure – the blamer is disconnected from the norm as a moral source of authority for *themselves*.
  *   **Avowed:** Highlights the critical role of *disclosure* in creating the standing deficit.
  *   **Contingency:** Specifies the nature of the blamer's adherence – dependent on external luck/circumstance, not internal commitment.
  *   **Differentiates:** Clearly separates it from hypocrisy (requires inconsistency/avowal of *willingness* without *deed*), complicity (requires involvement), and mere weakness (admits struggle).

  ### Summary
  Your scenario exposes a gap: **the loss of standing arising from openly admitting that one's *own* conformity to a norm is non-moral, driven solely by contingent circumstances.** This isn't hypocrisy (no violation, avowed disposition), complicity (no involvement), or just bad style (genuine normative disconnect). **NDAC** captures this unique deficit, where avowal is essential, fighting the disposition changes the picture (preserving minimal standing by affirming the norm's authority), and the core loss is the blamer's inability to authentically invoke the norm *as a moral demand* due to their self-revealed detachment from its moral foundation. The blamer positions themselves as a strategic enforcer, not a fellow participant in a shared moral community bound by the norm.
