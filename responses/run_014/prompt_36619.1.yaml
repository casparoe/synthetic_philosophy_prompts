  Where Anton went astray in step (5): He observed that doubling gives powers of two, which are not multiple of 3, but when interleaving R3, he reduced to non-power of two counts, like one I, which is 1 mod 3, not multiple of 3. But he didn't abstract to modulo 3; he looked for a pattern in the values instead of an invariant modulo 3.

