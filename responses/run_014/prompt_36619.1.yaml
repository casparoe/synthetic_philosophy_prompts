  First, (a): MU is not reachable.

  Proof: Let S be any derivable string from MI. We show that the number of I's in S, denoted |I|_S, satisfies |I|_S ≡ 1 or 2 mod 3.

  Base: MI has |I| = 1 ≡ 1 mod 3.

  Induction: assume for current string, |I| ≡ k ≡ 1 or 2 mod 3.

  - If apply R1: append U, |I| unchanged, so still ≡ k mod 3, 1 or 2.

