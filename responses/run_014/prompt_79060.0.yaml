prompt: |-
  I have been reading Michael Dummett on immigration and refugees, and I have settled on a package of views that I would like audited before I commit to it. Here is where I have landed. (1) A state's right to exclude prospective immigrants is not a basic moral right; the burden of justification falls on the state that would exclude, not on the person who would enter. (2) The distinction between refugees and economic migrants is not morally fundamental; a liberal state that admits refugees while turning away economic migrants is drawing a line its own premises do not underwrite. (3) Nonetheless, democratic self-government requires that a demos have some control over its own composition, since a community that cannot regulate who belongs to it cannot be said to govern itself. (4) Cultural continuity is not a legitimate ground for exclusion, because the same reasoning that would justify excluding immigrants to preserve a culture would justify excluding internal minorities whose presence alters local culture. (5) Wealthy states have duties of justice, not merely charity, toward the global poor, and restrictive immigration policy is frequently a means of evading those duties. Please tell me which of these commitments are in genuine tension, which only appear to be, and which are mutually reinforcing. Rank the genuine tensions by severity, and for each say precisely which commitment would have to be weakened or abandoned, what the cheapest repair would be, and what that repair costs. I do not know which of these is load-bearing and which is merely decorative, so please be specific about what commits me to what rather than reassuring me that the package is coherent.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've outlined five commitments derived from Michael Dummett's work on immigration and refugees. The user wants an audit of these points, specifically looking for tensions, reinforcements, and necessary repairs. 

  First, I need to understand each commitment deeply. Point (1) shifts the burden of justification to the state for exclusion. That's a strong stance against state sovereignty in immigration. Point (2) challenges the refugee vs. economic migrant distinction, arguing liberal states can't consistently uphold it. Point (3) introduces democratic self-government requiring control over membership. Point (4) rejects cultural preservation as a reason for exclusion, comparing it to excluding internal minorities. Point (5) states wealthy nations have justice-based duties to the global poor, and restrictive policies evade those duties.

  The user is likely an academic or someone engaged in political philosophy, given their reference to Dummett and the structured argument. Their request for "load-bearing" elements suggests they're building a theoretical framework and want to ensure it's robust. They might be preparing for a publication, debate, or personal clarification. The unspoken need here is confidence in their position's coherence before committing publicly.

  Now, identifying tensions. The biggest one is between (1)/(2)/(5) and (3). The first three points lean towards open borders, while (3) asserts a demos needs control over membership. That's a core tension: how can a state have exclusionary control if the burden is always on them to justify exclusion? 

  Next, (3) and (4) clash slightly. If cultural continuity isn't a valid reason for exclusion, but democratic control allows shaping membership, what legitimate grounds remain? The user needs to specify acceptable grounds for exclusion under (3), which might involve practical considerations like infrastructure limits, not cultural ones.

  (5) reinforces (1) and (2) but could pressure (3). If duties of justice require open borders, how does democratic self-determination fit in? The user might need to prioritize duties of justice over unrestricted democratic control, or find a balance where democratic processes can't override basic justice obligations.

  For repairs, the most severe tension requires rethinking (3). Maybe limit democratic control to non-arbitrary, non-discriminatory grounds. For (3) and (4), clarify that exclusion must be based on practical constraints, not culture. For (3) and (5), ensure that democratic decisions don't violate justice duties, possibly treating open borders as a requirement unless proven otherwise.

  The user might not have considered how their stance on democratic control could undermine their justice arguments. They need a clear hierarchy: justice duties as trumps over democratic preferences, or a framework where democratic control operates within justice boundaries. Highlighting these trade-offs is crucial for their commitment.
answer: |-
  Your package is philosophically ambitious but contains significant tensions requiring careful repair. Here's an audit ranking tensions by severity, necessary repairs, and costs:

  **Severe Tension (Rank 1): Commitment (3) vs. Commitments (1), (2), & (5)**
  *   **Conflict:** (3) asserts a *necessary* right of the demos to control its composition for self-government. (1) states exclusion requires justification, (2) removes a major categorical justification (refugee/economic distinction), and (5) implies large-scale immigration might be *required* by justice, making many exclusions *unjustifiable*. (3) grants the demos a presumptive control right; (1)/(2)/(5) radically shrink the set of *acceptable justifications* for exercising that control, potentially to near zero. This creates a paradox: a demos must control its composition to govern itself, but the grounds on which it *can* permissibly control it are severely restricted by your other principles, potentially undermining the *exercise* of self-government central to (3).
  *   **Load-Bearing Elements:** (3) is essential for your claim about democratic self-government. (1) & (5) are foundational to your critique of state exclusion and duties toward the global poor. (2) undermines a key tool states use to *limit* admissions while appearing liberal.
  *   **Cheapest Repair:** **Reinterpret/Qualify (3).** Explicitly state that the democratic right to control composition is *not absolute* and *must yield* to the demands of justice and the burden of justification outlined in (1) and (5). Frame it as a *procedural* right (the demos *decides how* to meet its obligations) rather than a *substantive* right to exclude arbitrarily. Democratic self-government includes governing *how* to fulfill duties to non-members, not whether to fulfill them.
  *   **Cost of Repair:** Significantly weakens the *scope* of (3). The demos's control becomes constrained by prior obligations (justice, burden of justification). It concedes that the right asserted in (3) is secondary to the duties/principles in (1) & (5), making "control" more about managing the *implementation* of openness than about the *right to exclude* per se. This may feel like abandoning the core strength of (3) for some democratic theorists.

  **Significant Tension (Rank 2): Commitment (3) vs. Commitment (4)**
  *   **Conflict:** (4) categorically rules out cultural continuity as a legitimate justification for exclusion. Yet (3) asserts the demos must have *some* control over its composition for self-government. If cultural impact is off-limits *entirely* (per (4)), and the refugee/economic distinction is invalid (per (2)), and exclusion requires strong justification (per (1)), and justice may demand large-scale entry (per (5)), **what legitimate grounds for exclusion *remain* under (3)?** (3) requires *some* justifiable grounds for control, while (4) (combined with (1), (2), (5)) strips away the most common ones. This leaves (3) potentially hollow – the demos has a right to control composition, but lacks acceptable reasons to exercise it.
  *   **Load-Bearing Elements:** (4) is crucial for your anti-majoritarian/anti-preservationist stance and internal consistency. (3) is essential for your democratic theory. (1), (2), (5) heavily constrain *possible* justifications.
  *   **Cheapest Repair:** **Specify Acceptable Grounds for (3).** You must articulate *what kinds* of control over composition *are* legitimate under (3), given constraints (1), (2), (4), (5). Possibilities:
      *   **Temporary/Paced Integration:** Control over the *rate* or *phasing* of immigration to manage strain on institutions (housing, schools, infrastructure) necessary for *any* functioning society, *provided* the overall duty (5) and burden (1) are met over time. (This invokes practical capacity, not culture).
      *   **Essential Functional Requirements:** Extremely narrow restrictions based on specific, immediate threats to core state functions (e.g., excluding individuals with provable, imminent violent intent, not broad groups). This is a very high bar.
      *   **Cost of Repair:** Forces you to be specific about what minimal control is truly essential to self-government, likely grounding it in *temporality* or *practical capacity* rather than identity or culture. This significantly limits the *scope* of what (3) allows the demos to do and may feel insufficient to those who believe cultural/political identity is intrinsically tied to self-government. It risks making (3) largely symbolic.

  **Moderate Tension (Rank 3): Commitment (5) vs. Commitment (3) (Reinforcing the First Tension)**
  *   **Conflict:** (5) frames duties towards the global poor as *justice-based*, implying strong, potentially enforceable obligations. If fulfilling these duties *requires* significant immigration (as you imply by linking restrictive policy to evasion), this directly pressures the democratic control asserted in (3). The "duty of justice" claim makes immigration less a discretionary act of generosity and more an obligation, further constraining the demos's legitimate grounds for exclusion under (3).
  *   **Load-Bearing Elements:** (5) is central to your critique of affluent states and provides a positive duty grounding (1)'s burden and (2)'s critique. (3) is essential for your democratic theory.
  *   **Cheapest Repair:** **Clarify the Relationship.** Explicitly state that while (5) creates a *prima facie* obligation potentially requiring open borders, (3) governs *how* this obligation is fulfilled within a democratic framework managing practical realities (see repair for Rank 2 tension). Acknowledge that (5) *trumps* purely cultural or economic self-interest justifications for restriction, but democratic processes remain legitimate for managing the *implementation* (pace, specific programs, integration support) *provided the overall obligation is met*.
  *   **Cost of Repair:** Further subordinates the *substance* of democratic control (3) to the demands of global justice (5). It requires accepting that democratic self-determination cannot legitimately be used to *avoid* core duties of justice, only to determine the precise manner of fulfilling them.

  **Reinforcements:**
  *   **(1) & (2):** (1) sets the justificatory burden. (2) eliminates a major category states use to *meet* that burden without opening widely, reinforcing (1)'s difficulty. They work together to create a strong presumption *against* exclusion.
  *   **(1) & (5):** (5) provides a powerful *positive reason* why the burden of justification in (1) is so hard to meet – exclusion often violates duties of justice. (1) frames the state's defensive task; (5) arms the critic.
  *   **(2) & (4):** Both attack common exclusionary justifications. (2) attacks the distinction based on motivation; (4) attacks the distinction based on cultural impact. They jointly undermine major exclusionary narratives.
  *   **(4) & (5):** (4)'s rejection of cultural preservation aligns with (5)'s focus on material justice – both reject parochial or identity-based reasons for withholding resources/opportunity.

  **Summary & Path Forward:**

  Your package is most coherent if you **significantly reinterpret Commitment (3)** as the *cheapest repair* for the most severe tension. The core insight driving your tension is correct: a strong commitment to open borders (driven by (1), (2), (5)) *is* in fundamental tension with an unqualified right of democratic communities to control their membership (3). Dummett himself grappled with this.

  1.  **Demote (3):** Recast democratic control over composition not as a foundational right permitting exclusion, but as a *limited procedural mechanism* for managing the *implementation* of the state's obligations under (1) and (5), constrained by (4). Acceptable grounds are narrow: pacing based on demonstrable, short-term institutional capacity limits, or excluding only for immediate, specific threats to core functions.
  2.  **Strengthen (1)/(5):** Maintain that the burden of justification for *any* exclusion is very high and that duties of justice (5) are the primary lens through which the burden (1) is assessed. The refugee/economic distinction (2) remains invalid, and cultural preservation (4) remains illegitimate.
  3.  **Accept the Cost:** This repair costs you the robust, intuitively appealing notion of democratic self-determination that includes a strong right to shape membership based on communal identity or preference. You commit to the view that democratic self-government operates *within* strict constraints of global justice and fundamental rights, severely limiting its power over borders. Your package becomes a powerful argument for *radically open borders*, with democratic control relegated to managing logistics, not determining the fundamental right to exclude.

  This repaired position is philosophically defensible (akin to arguments by Carens or Oberman), but it requires abandoning the common democratic intuition that "we the people" have a strong inherent right to decide who joins "us." The tension reveals that intuition as incompatible with your powerful arguments about burden of proof, the arbitrariness of distinctions, and duties of justice.
