prompt: |-
  I'm trying to write down, in advance, what any claim of the form "this culture / these values caused that economic outcome" has to be able to do before I'll take it seriously. Weber's protestant ethic argument is the canonical case but I want the rubric to be general, so it can be applied to any culture-as-cause story.

  Give me the desiderata list, each requirement with the concrete case or worry that motivates it. At minimum it needs to deal with:

  - the independence problem: if you only know a group had the relevant ethic because they did the thing the ethic predicts, you've redescribed the outcome, not explained it — so what does an independent measure of the value have to look like?
  - reasons vs causes: Weber wanted an account to be adequate both on the level of meaning and causally, and it's not obvious you can have both at once when the actors' own avowals of the value are partly self-serving rationalizations of what they were doing anyway
  - whose values: aggregate mean vs distribution, and the fact that it's often a minority of intense beleivers doing the causal work while the majority merely assents
  - the retreat to elective affinity: does recasting the claim as an affinity between an ethic and an economic ethos preserve the causal content or quietly give it up?

  Then mark which of your requirements are non-negotiable and which are really just the priors of one camp — institutionalists, rational choice types, cultural sociologists each demand different things and I don't want to smuggle in one camp's preferences as "adequacy." If some subset of the desiderata is jointly unsatisfiable, say so explicitly and show why; that's the part I most want to see. Finish with a couple of sentences on which single requirement does the most work ruling out otherwise attractive stories. No reading list.
reasoning: |-
  Okay, the user is asking for a rubric to evaluate claims that a culture or set of values caused an economic outcome. They specifically mention Weber's Protestant Ethic argument as a canonical example but want a general framework. The user has outlined several key problems they want addressed: the independence problem (circularity), distinguishing reasons from causes, whose values matter (minority vs majority), and whether recasting as "elective affinity" preserves causality. 

  I need to create a list of requirements that tackles these issues head-on. The user wants concrete cases or worries motivating each requirement, plus a clear distinction between non-negotiable criteria versus disciplinary priors. They're particularly interested in whether some requirements might be mutually incompatible and which single criterion does the most heavy lifting.

  The independence problem seems fundamental - if we only infer values from outcomes, it's circular. For this, I'll demand independent measurement of values prior to the outcome, using historical texts or comparative cases. This should be non-negotiable because circular reasoning undermines the whole enterprise.

  For reasons vs causes, the worry is that stated values might just rationalize behavior. I'll require showing why certain values would actually motivate behavior differently than alternatives, maybe through counterfactuals. This is tricky but essential to avoid rationalization traps.

  The "whose values" issue matters because often it's a motivated minority driving change. I'll insist on specifying which subgroup's values matter and how they became influential. This is probably non-negotiable for precision, though the exact threshold might vary.

  The elective affinity problem is subtle - when scholars retreat to affinity claims, do they abandon causality? I'll require that any affinity claim must still demonstrate a causal mechanism. This might be negotiable depending on how rigorously "mechanism" is defined.

  For disciplinary priors, I'll flag where requirements might reflect institutionalist (demanding institutional channels), rational choice (requiring microfoundations), or cultural sociology (accepting elective affinity) biases. The joint unsatisfiability seems to lie between demanding perfect value measurement (which rarely exists historically) and requiring causal specificity - we have to accept some uncertainty.

  The independence requirement likely does the most work by itself, as its absence allows countless just-so stories. I'll position this as the keystone that forces real evidence over post-hoc storytelling.
answer: |-
  Here’s a rubric for evaluating "culture → economic outcome" claims, structured around your concerns, with motivations, non-negotiables marked (**★**), disciplinary priors flagged, and joint constraints addressed:

  ---

  ### **1. Independent Operationalization of Cultural Variable**  
  **Motivation:** *The Independence Problem* (e.g., inferring "Protestant work ethic" solely from Protestant economic success is circular).  
  **Requirement:** The cultural trait (e.g., asceticism, future-time orientation) must be measurable *before* or *independently of* the economic outcome, using:  
  - **Pre-outcome evidence** (e.g., sermons/diaries pre-dating industrialization for Weber),  
  - **Cross-cultural comparison** (e.g., showing Catholic regions lacked this trait *before* divergence),  
  - **Experimental/ethnographic data** (e.g., priming studies on thrift vs. spending).  
  **Non-negotiable:** **★** (Without this, claims are unfalsifiable just-so stories).  
  **Disciplinary priors:** *Rational choice* may demand survey/behavioral data; *cultural sociology* may accept hermeneutic/textual evidence.

  ### **2. Causal Mechanism Over Rationalization**  
  **Motivation:** *Reasons vs. Causes* (e.g., Protestants citing "calling" may rationalize pre-existing profit-seeking).  
  **Requirement:** Show the cultural trait **changed behavior** in ways alternative values wouldn’t, via:  
  - **Microfoundations** (e.g., how "asceticism" redirected consumption to investment),  
  - **Exclusion of alternatives** (e.g., ruling out institutional/path dependence explanations),  
  - **Counterfactual support** (e.g., did converts *adopt* new economic behaviors with the ethic?).  
  **Non-negotiable:** **★** (Avowals ≠ causes; must demonstrate behavioral impact).  
  **Disciplinary priors:** *Institutionalists* demand institutional channels; *RC theorists* want incentive compatibility.

  ### **3. Specification of Cultural Carriers**  
  **Motivation:** *Whose Values?* (e.g., Weber’s "intensity" among Calvinist elites vs. nominal adherents).  
  **Requirement:** Identify:  
  - **Which subgroup** held/transmitted the values (e.g., merchants, clergy),  
  - **Threshold intensity/distribution** needed (e.g., 10% zealots enabling takeoff?),  
  - **Transmission channels** (e.g., sermons → family firms).  
  **Non-negotiable:** **★** (Aggregate "national culture" often masks causal heterogeneity).  
  **Disciplinary priors:** *Methodological individualists* require agent-level specificity.

  ### **4. Affinity ≠ Causality**  
  **Motivation:** *Retreat to Elective Affinity* (e.g., claiming capitalism "fits" Protestantism without showing directionality).  
  **Requirement:** Affinity claims must:  
  - **Specify temporal precedence** (culture before outcome),  
  - **Reject symmetric explanations** (e.g., show values didn’t *arise from* economic conditions),  
  - **Explain breakdown cases** (e.g., why some Protestant societies stagnated).  
  **Non-negotiable:** **★** (Affinity alone is correlational; causal claims require asymmetry).  
  **Disciplinary priors:** *Cultural sociologists* may accept affinity; *economists* demand asymmetry.

  ### **5. Contextual Constraints**  
  **Motivation:** *Culture as necessary but insufficient* (e.g., Protestant ethic alone couldn’t cause capitalism without property rights).  
  **Requirement:** Acknowledge **interaction with institutions/geography/technology**, and specify:  
  - **Scope conditions** (e.g., "only where states permitted private accumulation"),  
  - **Complementary factors** (e.g., literacy rates enabling ethic dissemination).  
  **Non-negotiable:** Conditional (culture is never a *sufficient* cause; omission misleads).  
  **Disciplinary priors:** *Institutionalists* prioritize constraints; *culturalists* may underweight them.

  ---

  ### **Joint Unsatisfiability Tensions**  
  - **Operationalization vs. Mechanism Depth:** Perfectly measuring pre-modern values (Requirement 1) often relies on fragmentary texts, which rarely prove behavioral mechanisms (Requirement 2). *Resolution:* Triangulate sources (e.g., tax records + sermons) but accept uncertainty.  
  - **Carrier Specificity vs. Macro-Effect:** Pinpointing minority carriers (Requirement 3) may not explain society-wide outcomes without aggregation paradoxes. *Resolution:* Model diffusion (e.g., network effects).  
  - **Affinity Asymmetry vs. Feedback Loops:** Causality requires temporal precedence, but culture/economy co-evolve (e.g., capitalism reshapes values). *Resolution:* Isolate "shocks" (e.g., Reformation) as natural experiments.

  ---

  ### **Highest-Impact Requirement**  
  **Independent Operationalization (1)** does the heaviest lifting: it rules out *post-hoc cultural essentialism* (e.g., "Asian values caused growth" defined by growth itself) and forces engagement with messy historical/comparative evidence. Without it, even elegant mechanisms (2) or subgroup specificity (3) risk rationalizing outcomes.

  > **Key trade-off:** Rigorous independence (1) and mechanism (2) demands often exceed historical data, pushing scholars toward affinity (4) or institutionalist priors. The strongest claims meet all **★** criteria but are rare; most are partial reconstructions.
