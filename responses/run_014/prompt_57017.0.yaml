  Here is a disambiguation of "if you can spray them, then they are real" as a numbered menu of distinct theses, followed by analysis of the scene and R.'s position.

  ### 1. **Causal Criterion (Ontological)**  
     **Statement:** An entity is real if we can causally interact with it (e.g., manipulate, spray) to produce predictable, observable effects.  
     **Verdict:** Substantive and defensible.  
     **Strongest Pressure:** Manipulation may succeed due to *other* causal factors (e.g., instrumental artifacts or misattributed mechanisms), not the posited entity (e.g., phlogiston combustion).  
     **Neve's Reply:** "But I *do* manipulate holes—I drift and measure them. Are you saying they’re real, or that my manipulation targets an electron aggregate you’d call fiction?"  
     **R.’s Reliance for Holes:** Requires this reading to dismiss—holes are "sprayable" (manipulable), hence real.  
     **R.’s Reliance for Pessimistic Induction:** Uses this to claim stability: discard *theories* but keep entities we manipulate (e.g., electrons persist despite theory-changes).  

  ### 2. **Epistemic License (Pragmatic)**  
     **Statement:** Successful manipulation justifies *belief* in an entity’s reality, without committing to its ultimate ontological status.  
     **Verdict:** Defensible.  
     **Strongest Pressure:** Silent on *why* manipulation succeeds—compatible with entities being useful fictions (e.g., treating holes "as if" real).  
     **Neve's Reply:** "So holes are ‘real’ only as a reliable instrument? That doesn’t answer whether they *exist* independently."  
     **R.’s Reliance for Holes:** Inadequate—admits holes are "licensed" but not necessarily real.  
     **R.’s Reliance for Pessimistic Induction:** Weak—history shows discarded entities (e.g., caloric) were once "licensed" too.  

  ### 3. **Reference-Fixing (Semantic)**  
     **Statement:** Theoretical terms refer to real entities *because* they are embedded in successful interventions (e.g., "electron" refers via spray experiments).  
     **Verdict:** Vulnerable.  
     **Strongest Pressure:** Reference may shift across theories (e.g., "electron" in 1890s vs. QFT) or fail entirely (e.g., "phlogiston" referred to nothing).  
     **Neve's Reply:** "When you spray, are you ‘fixing’ reference to an electron—or to whatever causal node your device interacts with, holes included?"  
     **R.’s Reliance for Holes:** Fails—holes lack a "theory-independent" referent.  
     **R.’s Reliance for Pessimistic Induction:** Poor—discarded entities had their reference "fixed" by past interventions.  

  ### 4. **Selective Realism (Entity-Focused)**  
     **Statement:** Entities are real (and stable across theory-change) *if* we can intervene on them, even when their supporting theories are false.  
     **Verdict:** Substantive and defensible.  
     **Strongest Pressure:** Ambiguity in "entity" boundaries—holes/phonons are *derivative* (collective behaviors), not fundamental. Discarded entities (e.g., aether) were once intervened upon.  
     **Neve's Reply:** "Was the aether less ‘real’ than electrons when Michelson sprayed light through it? And are holes ‘entities’ or just calculational tricks?"  
     **R.’s Reliance for Holes:** Possible but strained—holes are intervenable, but their derivative status challenges "entity" realism.  
     **R.’s Reliance for Pessimistic Induction:** Essential—entities like electrons survive theory-change *because* we intervene on them.  

  ### 5. **Operational Definition (Anti-Realist)**  
     **Statement:** "Reality" is *defined by* manipulability: to be real is to be sprayable.  
     **Verdict:** False.  
     **Strongest Pressure:** Excludes legitimate unmanipulables (e.g., stars, past events)—reduces "real" to laboratory access.  
     **Neve's Reply:** "So astronomers can’t be realists about supernovae? That’s not a criterion—it’s a surrender."  
     **R.’s Reliance for Either Issue:** Unlikely—R. likely believes in unmanipulables (e.g., quasars).  

  ---

  ### Analysis of the Scene  
  - **The Quarrel's Verbal Aspect:** Partly verbal. Neve likely interprets "real" as *fundamental ontological existence* (holes as fictions; electrons as evolving referents). R. likely conflates *reality* with *experimental robustness* (entities as "real" when reliably manipulated).  
  - **Slogan's Party Meaning:** Typically the **Epistemic License** reading—a glib justification for trusting instrumental success, avoiding metaphysics.  
  - **Origin Story's Embarrassment:** The superconducting sphere experiment (likely Millikan-type fractional charge search) failed to find quarks. If R. cites this, Neve could note: *"You sprayed, but found nothing real—doesn’t that undermine your criterion?"* This pressures all readings.  
  - **Dismissal of Holes:** R. requires the **Causal Criterion** or **Selective Realism** to dismiss Neve’s hole objection. Only these assert manipulability entails reality.  
  - **Dismissal of Pessimistic Induction:** R. requires **Selective Realism** to claim entities persist despite theory-change. Other readings lack this historical defense.  

  \answer{Causal Criterion}
