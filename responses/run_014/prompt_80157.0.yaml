  We are designing an activity where students triage ongoing projects. The key is that the prior costs (sunk costs) are secretly of three kinds:
   (a) pure waste (truly irrelevant)
   (b) a live asset that was purchased (so it's not sunk, it's an option you have)
   (c) a change in identity or others' expectations

   We want students to encounter these without being told, and then in the debrief we reveal the three kinds and map their decisions.

   We need a portfolio of projects for students to evaluate. Let's create 6 projects (so that in groups of 3 students, each student can take 2, or adjust as needed). We'll assign each project one of the three cost types.

   Brainstorm of project scenarios:

   1. Pure Waste (Type A): 
      Project: Developing a mobile app for a niche market. So far, you've spent $20,000 and 200 hours. The market research just came in showing that the niche is too small to be profitable. The app is 50% done. If you continue, you'll need to spend another $20,000 and 200 hours, but the expected revenue is only $15,000. The $20,000 and 200 hours are gone no matter what. The future costs and benefits are independent of the past.
      Why: The past expenditure has left no asset and has not changed identity/expectations. It's purely a waste.

   2. Live Asset (Type B):
      Project: A non-refundable deposit on a specialized piece of equipment that you can now use for a new project. You paid $10,000 for the deposit (which is non-refundable). The equipment is now available for you to use. Without the deposit, you wouldn't have the option to use the equipment. The new project that uses the equipment requires an additional $5,000 and has an expected profit of $12,000. If you don't use the equipment, you can't do the project. The deposit is sunk? But it bought you an option. If you don't proceed, you lose the asset (the right to use the equipment) that you paid for.
      Why: The past expenditure created an asset (the option to use the equipment). So the cost is not sunk in the sense that it has provided a current opportunity.

   3. Identity/Expectations (Type C):
      Project: You have been leading a research team for two years on a project that is now facing severe technical challenges. The project has cost $100,000 so far. The team has become known for this work and has built a reputation. If you cancel, the team will be disbanded and your reputation as a leader in this area will be damaged. If you continue, it will cost another $50,000 and has a 30% chance of success (which would bring $300,000 and enhance reputation) and 70% chance of failure (which would result in a total loss and reputation damage). Without the prior investment, you wouldn't have the reputation and the team. The prior cost has created expectations (both internal and external) that now change the value of continuing.
      Why: The past expenditure has changed the identity of the team and the expectations of others. This changes the valuation of the future outcomes.

   However, we want each project to isolate one type. Let's create 3 more to have 6, but we can also have 3 projects, one of each type, if time is short. But 6 will give more variety and make the pattern less obvious.

   4. Pure Waste (Type A):
      Project: A marketing campaign for a product that has been discontinued. You already spent $5,000 on designing the campaign. Now the product is discontinued. You can either scrap the campaign (save the remaining budget) or run it anyway (spending another $10,000) but it won't sell any of the discontinued product and might even confuse customers. The $5,000 is gone regardless. The future spending is pure waste.

