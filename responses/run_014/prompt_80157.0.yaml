      Project: You have been training for a marathon for 6 months, spending 10 hours a week. You've built a social circle of fellow runners and have started a blog about your training. Now you have an injury that makes running painful, but you could still complete the marathon with pain management. Completing the marathon would require 4 more weeks of training (at 10 hours/week) and the race day. If you complete, you'll achieve your goal and maintain your social circle and blog audience. If you quit, you'll lose the social connections and disappoint your followers. The past investment has created an identity (as a marathon trainee) and expectations (from your social circle and followers).

