      Project: You bought a non-refundable ticket to a conference for $500. The conference is next week. You are considering whether to attend. Attending would cost an additional $300 in travel and lodging, but you estimate the networking and learning to be worth $1,200 to you. If you don't attend, you lose the ticket and get nothing. The ticket is a live asset: you have the option to attend by paying the additional costs.

