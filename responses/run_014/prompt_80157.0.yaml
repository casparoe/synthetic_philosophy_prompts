  ### Brainstorm of Project Scenarios  
  Each scenario isolates one cost type by ensuring the primary reason to continue or kill hinges exclusively on one category, with minimal overlap. Narrative elements subtly cue the cost type without explicit signaling.  

  1. **Type A: Pure Waste (Truly Irrelevant)**  
     - **Project**: *Abandoned Software License*  
     - **Description**: Your team paid $50K for annual access to a specialized data analytics platform. After 6 months, you discovered critical flaws making it unusable. Cancelling now forfeits the remaining license, but switching to a better open-source tool (free, but requires retraining) would take 100 hours. Continuing means struggling with bugs for no gain.  
     - **Why it isolates Type A**: The sunk cost (license fee) is unrecoverable and irrelevant. The value of switching (avoiding wasted effort) or continuing (no benefits) depends *only* on future actions. No asset or identity change is created.  

  2. **Type B: Live Asset (Purchased Option)**  
     - **Project**: *Non-Refundable Workshop Deposit*  
     - **Description**: You paid a $5K non-refundable deposit for an exclusive 3-day workshop next month. Attending requires an additional $2K travel cost. The workshop offers skills that could secure a $20K contract, but only if you apply the knowledge immediately. Skipping loses the deposit with no benefit.  
     - **Why it isolates Type B**: The deposit purchased a *live option* (workshop access). Killing the project wastes the option; continuing exercises it. The sunk cost isn’t irrelevant—it bought a concrete, time-sensitive opportunity.  

  3. **Type C: Identity/Expectations Shift**  
     - **Project**: *Legacy Community Garden*  
     - **Description**: You’ve spent 2 years transforming a vacant lot into a community garden, investing $10K and 500 volunteer hours. It’s now a neighborhood symbol, and you’re seen as its "founder." Continuing requires $5K/year for upkeep with no revenue. Killing it would disappoint the community and erode your local reputation.  
     - **Why it isolates Type C**: The sunk cost forged an identity ("founder") and social expectations. Continuing preserves intangible value (reputation/role); killing incurs social/emotional costs. No financial asset exists—value is tied to how the investment reshaped your social self.  

  ---  
  ### Activity Design: **"Project Triage Challenge"**  
  **Goal**: Students confront scenarios where sunk costs *appear* irrelevant but secretly fall into three categories. They learn to distinguish pure waste, live assets, and identity shifts through decision-making, then debate rationality in preference-shaping.  

  #### **Rules & Roles**  
  - **Groups**: 6 teams of 3 students each.  
  - **Materials**:  
    - Project portfolio (3 scenarios above, printed).  
    - "Triage Sheet" for decisions (Continue/Kill + brief rationale).  
    - Scoring tokens (e.g., poker chips): 10 green ($ = financial utility), 5 blue (R = reputation/identity utility).  
  - **Scoring**:  
    - Each project has hidden "utility values" (revealed post-activity). Teams earn tokens for optimal decisions:  
      - *Software License* (Type A): Kill = +2 green (avoid wasted time); Continue = 0.  
      - *Workshop Deposit* (Type B): Continue = +3 green (contract gain) – 1 green (travel) = +2 green; Kill = –1 green (lost option value).  
      - *Community Garden* (Type C): Continue = +3 blue (reputation upheld); Kill = –3 blue (reputation loss).  
    - **Objective**: Maximize tokens. Green tokens = 1 point each; blue = 2 points each (emphasizing non-financial weight).  

  #### **Timeline (75 mins)**  
  1. **Intro (5 mins)**:  
     - *Frame*: "You’re a strategy team triaging projects. Base decisions on future value, but costs may not be what they seem."  
     - Distribute portfolios/triage sheets.  

  2. **Group Work (35 mins)**:  
     - Teams discuss projects (10 mins/project).  
     - Record decisions/rationales. **Critical twist**: No explicit cost types are named—students deduce patterns.  
     - Collect triage sheets; distribute tokens based on hidden scoring.  

  3. **Scoring & Reveal (15 mins)**:  
     - Display correct utility values. Teams calculate scores.  
     - Announce "winning team" (highest points).  

  4. **Debrief (20 mins)**:  
     - **Step 1: Map Decisions to Cost Types**  
       - Ask: "Which projects were hardest? Why did some ‘sunk’ costs feel relevant?"  
       - Reveal types:  
         - *Type A (Software)*: Past cost = pure waste. Optimal to kill.  
         - *Type B (Workshop)*: Past cost = live asset (option). Optimal to continue.  
         - *Type C (Garden)*: Past cost = identity shift. Optimal to continue.  
       - **Key insight**: "Sunk costs *are* irrelevant **only** if options’ value is history-independent. But investments can create assets (B) or reshape identity/expectations (C), changing what ‘value’ means."  
     - **Step 2: Philosophical Dilemma**  
       - Pose: "Is it irrational to let history reshape preferences? E.g., in the garden, is your ‘reputation’ a cognitive bias or a valid value?"  
       - Guide debate:  
         - *Rationalist view*: "Preferences should be forward-looking; identity shifts are self-deception."  
         - *Constructivist view*: "Investments *make* us who we are. Ignoring that denies moral agency."  
       - **Closure**: "The activity can’t resolve this—it treats identity as fixed. But in life, investments *transform* us. Is that rational? Or is rationality itself shaped by our history?"  

  ---  
  ### Predictable Challenges & Limitations  
  1. **What Will Go Wrong**:  
     - **Over-indexing on money**: Students may undervalue blue tokens (identity), calling the garden "irrational" to continue. Use this to highlight how we default to financial logic.  
     - **Misinterpreting Type B**: Teams may kill the workshop, seeing the deposit as "sunk." Reveal how this mirrors your deposit mistake—overcorrecting into ignoring a live option.  
     - **Time crunch**: 10 mins/project is tight. Warn groups to prioritize depth over speed.  

  2. **What the Activity Can’t Reproduce (Must Be Taught)**:  
     - **Endogenous preference change**: The activity treats identity (Type C) as *static* (e.g., "reputation = 3 blue tokens"). But in your research example, the sunk cost *dynamically* reshaped your values ("who I am"). Students need you to:  
       - Explain how investments can *alter* what we care about (e.g., "I now value this research because I’m known for it").  
       - Challenge them: "If your preferences change because of sunk costs, is that adaptive commitment or a fallacy? Is ‘rationality’ separable from personal history?"  
     - **Supply this verbally**: Weave in your research example to show identity isn’t just "reputation points"—it’s fluid self-conception.  

  ---  
  **Why This Works**: Students experience the three cost types through friction in decision-making (e.g., guilt killing the garden, FOMO skipping the workshop). The scoring makes abstract concepts tangible, and the debate grounds philosophy in lived dilemmas. Your role: amplify the gap between the activity’s "fixed" preferences and real-life fluidity.
