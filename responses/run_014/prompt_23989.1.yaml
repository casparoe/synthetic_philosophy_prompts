answer: |-
  ### The senses of 'unit'
  The debate persists because "unit of selection" is used ambiguously across four distinct conceptual roles:  
  1. **Unit of inheritance**: The entity replicated with fidelity (e.g., genes). Gene-centric views (Dawkins, Williams) prioritize this, arguing genes are the sole persistent units.  
  2. **Unit of causal selection**: The entity directly interacting with the environment, experiencing variation, competition, and survival (e.g., organisms or groups). Organism/group advocates (Gould, Sober) focus here, seeing selection as a causal process acting on phenotypes.  
  3. **Unit of explanation**: The level providing the most coherent or efficient account of evolutionary change. Gene camps often claim reductionism offers deeper explanation; group camps argue higher-level dynamics (e.g., altruism) are irreducible.  
  4. **Unit of fitness attribution**: The entity to which fitness ("reproductive success") is properly assigned. Gene views assign fitness to genes (via vehicles); organism views assign it to individuals/groups.  

  Neither camp is internally consistent. Gene advocates shift to phenotypic "vehicles" when discussing causal interactions, while group proponents implicitly rely on genetic inheritance. This conceptual slippage allows each side to emphasize the sense favoring their view while downplaying others.  

  ### What the equivalence results show  
  Formal equivalence results (e.g., Price equation, multilevel selection decompositions) demonstrate mathematical translatability: descriptions of selection at one level (gene, individual, group) can be *reformulated* without loss of predictive accuracy at another. **They do not show:**  
  - That the levels are ontologically identical.  
  - That explanations at different levels are equally causally illuminating or parsimonious.  
  - That all evolutionary phenomena are equally *naturally* described at every level.  

  These results **relocate, not dissolve**, the debate. They prove the disagreement isn’t about empirical predictions in tractable models but about *causal interpretation* and *explanatory priority*. Crucially, equivalence fails for cases with emergent properties (e.g., group traits not reducible to individual fitnesses) or conflicting level-specific predictions (e.g., when group structure generates selection pressures invisible at the gene level). Translatability is a formal property; explanatory relevance is not.  

  ### The kind of disagreement  
  The residual disagreement is **substantive but non-empirical** in typical cases. It centers on philosophical commitments about scientific explanation:  
  - **Reductionism vs. Emergence**: Must all selection explanations reduce to genes, or do higher-level units have irreducible causal power?  
  - **Causal Granularity**: Does "true" causation reside in replicators (genes) or interactors (organisms/groups)?  
  - **Explanatory Norms**: Is the "best" explanation the most fundamental (genes) or the most empirically adequate to observed dynamics (e.g., group adaptation)?  

  While empirical questions exist (e.g., "How prevalent is group heritability in nature?"), these are secondary. The core clash is over what constitutes a *satisfactory evolutionary explanation*. For gene-centrists, explanation requires tracing gene frequency changes; for pluralists, it requires identifying functional adaptation at the level it operates. Empirical data informs but cannot resolve this normative divide.  

  ### What would count as progress  
  Progress requires abandoning the illusion that "unit of selection" has a single, context-free meaning. Two paths forward exist:  
  1. **Explicit pluralism**: Define distinct *questions* (inheritance, interaction, explanation) and specify which "unit" applies to each. For instance: genes are units of inheritance; organisms/groups are units of interaction; explanatory units depend on the trait.  
  2. **Reframing the question**: Shift focus to *emergence*—"Under what conditions do higher-level properties become causal actors in selection?"—or to *mechanisms*—"How do genetic, developmental, and ecological processes jointly constrain selection?"  

  Debate stagnation stems from insisting on a monolithic "unit." Progress would be recognizing that the question is malformed and replacing it with tractable, context-specific inquiries into hierarchy and causality in evolution.
