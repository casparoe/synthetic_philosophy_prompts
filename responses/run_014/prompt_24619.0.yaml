prompt: |-
  Im a philosophy professor and I've been roped into chairing a small review panel for a state agency that deploys AI systems in regulated settings -- the kind that make decisions about people. We recieve a handful of systems a year, and the question we keep getting stuck on is the same one: is it defensible to describe this system as 'believing' something, in the documentation, in testimony, in user-facing language? We don't want vibes and we don't want a 40-page ethics report; we want a procedure we can actually run, grounded in the intentional stance (Dennett's idea that attributing beliefs is a predictive strategy, not a claim about what's inside the box). Write me that procedure as exactly five numbered steps, each one or two sentences, no intro or conclusion. The steps should run in order and say what counts as a pass at each, and I need them to cover: that the belief-desire description actually beats the lower-level descriptions (the system's intended function, its raw input-output patterns) at predicting behavior, not just that it can be given one; that the attributed beliefs are systematic -- they compose and predict behavior in novel combinations of situations, not just isolated 'believes X' modules; and that when the system itself says 'I believe X,' that utterance is treated as a hypothesis to be tested by what the system does in counterfactual situations, never as evidence by itself. Mark clearly which steps are real tests and which are judgment calls dressed up as tests, and say where the procedure stops and hands the call back to a person because the question is one of values rather than facts. I also want the procedure to say plainly what it can't do -- my guess is it can license a predictive description without settling whether the system really has beliefs -- and I want it to say what it would tell us in the case I don't like: a system that passes every test but where we still feel the attribution is an overclaim. Last thing: we're three people (two philosophers, one engineer), we have at most a day per system, and one of us signs off in writing, so nothing in the procedure should require more than that; and tell me which assumptions the procedure depends on and where your reasoning is most likely to fail -- what argument or consideration would change your mind about this design?
reasoning: |-
  We are designing a five-step procedure for determining whether it is defensible to describe an AI system as 'believing' something in official documentation, testimony, or user-facing language. The procedure is grounded in Dennett's intentional stance, which treats belief attribution as a predictive strategy. We must address:
  1. The belief-desire description must be a better predictor than lower-level descriptions (like the system's function or input-output patterns).
  2. The attributed beliefs must be systematic (they compose and predict in novel situations).
  3. When the system says "I believe X," that utterance is treated as a hypothesis to be tested by counterfactual behavior, not taken as evidence by itself.

  The procedure must:
  - Have exactly five numbered steps, each one or two sentences.
  - State what counts as a pass at each step.
  - Distinguish between real tests and judgment calls dressed as tests.
  - Indicate where the procedure stops for a values-based decision.
  - State what the procedure cannot do (e.g., it licenses a predictive description without settling if the system really has beliefs).
  - Address the case where the system passes every test but the attribution feels like an overclaim.
  - Be feasible within a day by three people (two philosophers, one engineer) and require only one written sign-off.
  - List assumptions and potential failure points.

  Step Outline:

  1. **Compare predictive power**: Test if the intentional stance (belief-desire) description predicts the system's behavior better than a lower-level description (e.g., functional spec or input-output patterns) in a set of scenarios. This is a real test: we design a set of scenarios (including some novel ones) and compare prediction accuracy. Pass: the intentional stance has higher accuracy.

  2. **Test systematicity**: Check that the attributed beliefs and desires form a coherent system that can generate predictions in novel combinations of situations. This is a judgment call: we create novel scenarios (not in training or previous testing) and see if the intentional stance can predict behavior without ad-hoc adjustments. Pass: the panel agrees that the predictions are systematic and not piecemeal.

  3. **Test self-reports**: When the system says "I believe X", design counterfactual situations to see if the system's behavior aligns with X. This is a real test: we set up situations where if the system really had that belief, it would act in a certain way, and check. Pass: the system's behavior in counterfactuals aligns with the belief in at least 80% of cases (or some threshold). Also, we never take the self-report as evidence by itself.

  4. **Values check**: We stop here for a values-based decision. We ask: even if the above tests pass, are there ethical or social reasons to avoid belief attribution? (e.g., risk of anthropomorphism leading to overtrust, legal implications). This step is not a test but a deliberation. The panel must agree that the benefits of using the intentional stance (e.g., clarity, efficiency) outweigh the risks. Pass: unanimous agreement among the panel.

  5. **Final sign-off and limitations**: The procedure cannot establish that the system has beliefs in a metaphysical sense; it only licenses the predictive use. If the system passes all tests but feels like an overclaim, that feeling is addressed in Step 4 (values). The sign-off is done by one panel member (as per constraints).

  Now, write the steps as exactly five numbered steps, each one or two sentences.

  Step 1: Real test. Run at least 20 diverse scenarios (including novel ones) and compare prediction accuracy between the intentional stance description and a lower-level description (e.g., functional specification). Pass: intentional stance has at least 10% higher accuracy.

  Step 2: Judgment call. Using the belief-desire structure from Step 1, generate predictions for 5 novel scenario combinations (not seen before) without ad-hoc adjustments. Pass: the panel unanimously agrees the predictions were systematic and not piecemeal.

  Step 3: Real test. For each of 5 self-reported beliefs (e.g., "I believe X"), create 3 counterfactual situations and check if the system's behavior aligns with X. Pass: alignment occurs in at least 12 of 15 cases (80%).

  Step 4: Values deliberation (not a test). The panel debates: even if passed Steps 1-3, could belief attribution cause harm (e.g., overtrust, misrepresentation)? Pass: unanimous agreement that benefits outweigh risks.

  Step 5: Final step. The panel notes that passing only licenses predictive use, not metaphysical claims. One member signs off. This step also states: if the system passes but feels overclaimed, the concern is addressed in Step 4.

  Assumptions and failure points:

  Assumptions:
  - The intentional stance is a viable predictive strategy for the system.
  - The panel can design valid tests within time constraints.
  - The system's behavior is consistent enough to test.

  Failure points:
  - The system's behavior might be too random or context-dependent for the intentional stance to be consistently better (then Step 1 fails).
  - Systematicity (Step 2) might be too subjective; if the panel disagrees, we need a tie-breaker (but we have three, so majority? But we said unanimous for Step 2 and 4). Since Step 2 is a judgment call, we require unanimous agreement to pass? Or majority? Let's stick with unanimous for Step 2 and 4 to be conservative.

  Reasoning most likely to fail: if the system is designed to mimic systematic belief but is actually a lookup table for specific cases, Step 2 might be gamed. Also, if counterfactuals in Step 3 are not well-designed, the test might be invalid.

  What would change my mind? If evidence showed that even with high predictive power, using the intentional stance in regulated settings always carries unacceptable risks (then Step 4 would block it, but if we think it should never be used, then the whole procedure is moot).

  Now, write the five steps concisely.
answer: |-
  **1. Real test:** Compare prediction accuracy between the intentional stance (belief-desire) description and a lower-level description (e.g., functional specs or input-output mappings) across 20 diverse scenarios (including 5 novel ones). Pass if the intentional stance yields ≥10% higher accuracy.  
  **2. Judgment call:** Assess if the attributed beliefs compose systematically by generating predictions for 5 novel scenario combinations using the same belief-desire structure, without ad-hoc adjustments. Pass only if the panel unanimously agrees the predictions are coherent and non-modular.  
  **3. Real test:** For each of 5 system self-reports ("I believe X"), design 3 counterfactual situations and check behavioral alignment with X; never treat self-reports as evidence. Pass if ≥12 of 15 cases align (80%).  
  **4. Values check (stop for deliberation):** Debate whether belief attribution risks harm (e.g., overtrust, anthropomorphism) despite passing Steps 1–3; this is not a test but a values-based decision. Pass only with unanimous agreement that benefits outweigh risks.  
  **5. Final step:** Conclude that passing licenses *predictive use* of "belief" (not metaphysical claims); if attribution feels overclaimed despite passing, note it was addressed in Step 4. One panelist signs off, documenting limitations.  

  **What this cannot do:** It cannot prove the system "really has beliefs"; it only licenses predictive descriptions.  
  **Assumptions:** The intentional stance applies predictively; tests are feasible within a day; behavior is consistent.  
  **Failure points:** Step 2’s systematicity is subjective (may fail for complex systems); Step 3’s counterfactuals may be poorly designed.  
  **What would change my mind:** Evidence that predictive success always masks dangerous anthropomorphism, making Step 4 insufficient.
