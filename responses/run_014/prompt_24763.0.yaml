answer: |-
  ### Taxonomy of Two-Person Bargaining Solutions  
  **Assumption:** All solutions satisfy Pareto efficiency (PAR); the outcome lies on the Pareto frontier.  

  #### Decision Tree:
  1. **Is the solution symmetric (SYM)?**  
     (If the bargaining problem is symmetric, players receive equal utility.)  
     - **No** → Go to 2.  
     - **Yes** → Go to 3.  

  2. **Does the solution satisfy independence of irrelevant alternatives (IIA)?**  
     (Removing non-selected feasible outcomes does not change the solution.)  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  3. **Does the solution satisfy scale invariance (SI)?**  
     (Invariant to linear rescaling of either player’s utility.)  
     - **No** → **Egalitarian solution**:  
       *Compute:* From the disagreement point \(d\), move along the ray \((1,1)\) until intersecting the Pareto frontier. Adjust to the efficient point if not exact.  
       - *Axioms:* SYM, ¬SI, ¬IIA.  
     - **Yes** → Go to 6.  

  4. **Does the solution satisfy scale invariance (SI)?**  
     - **Yes** → **Dictatorial solution** (player \(i\)):  
       *Compute:* Maximize \(u_i\) (for chosen player \(i\)), then maximize \(u_j\) subject to that \(u_i\).  
       - *Axioms:* ¬SYM, SI, IIA.  
       - *Note:* Axioms do not specify which player is dictator; two variants exist.  
     - **No** → *Unoccupied*: No natural named solution.  

  5. **Does the solution satisfy scale invariance (SI)?**  
     - **Yes** → *Unoccupied*: Asymmetric Kalai-Smorodinsky (not standard).  
     - **No** → *Unoccupied*: Not explored.  

  6. **Does the solution satisfy IIA?**  
     - **Yes** → **Nash solution**:  
       *Compute:* Maximize \((u_1 - d_1)(u_2 - d_2)\) on the Pareto frontier.  
       - *Axioms:* SYM, SI, IIA.  
     - **No** → **Kalai-Smorodinsky solution**:  
       *Compute:* Intersect the Pareto frontier with the line from \(d\) to the ideal point \((m_1, m_2)\), where \(m_i = \max \{ u_i \mid (u_1, u_2) \in S, u \geq d \}\).  
       - *Axioms:* SYM, SI, ¬IIA.  

  ---

  ### Reasoning and Axiom Satisfaction  
  **Nash solution (SYM, SI, IIA):**  
  - Satisfies IIA: Maximizing the Nash product in a subset \(T \subseteq S\) containing the original solution yields the same point, as the product cannot exceed the original maximum.  
  - Satisfies SI: Affine transformations rescale the product by a constant, preserving the maximum.  
  - Satisfies SYM: Symmetric problems maximize the product at equal utilities.  

  **Kalai-Smorodinsky solution (SYM, SI, ¬IIA):**  
  - Violates IIA: Shrinking the feasible set can alter the ideal point, changing the solution even if the original point remains feasible.  
    *Example:* \(d = (0,0)\), \(S = \text{convex hull}\{(0,0), (1,0), (0,1)\}\). Solution: \((0.5, 0.5)\). Let \(T = \text{convex hull}\{(0,0), (1,0), (0,1), (0.8,0.8)\}\). Solution for \(T\): \((0.8,0.8) \neq (0.5,0.5)\).  
  - Satisfies SI: Rescaling utilities linearly transforms the ideal point and ray proportionally.  
  - Satisfies SYM: Symmetric problems have symmetric ideal points and rays.  

  **Egalitarian solution (SYM, ¬SI, ¬IIA):**  
  - Violates SI: Rescaling utilities non-linearly distorts the \((1,1)\) direction.  
    *Example:* \(d = (0,0)\), \(S = \text{convex hull}\{(0,0), (1,0), (0,1)\}\). Solution: \((0.5,0.5)\). After scaling \(u_1' = 2u_1\), new solution: \((1,0.5) \neq \text{rescaled } (0.5,0.5) = (1,0.5)\)? Wait, rescaling \((0.5,0.5)\) gives \((1,0.5)\), but the new solution in scaled space is computed as the intersection of the ray \((1,1)\) in the new coordinates (direction \((2,1)\)) with the feasible set. The line \(u_2 = u_1'/2\) intersects the frontier of the scaled set (convex hull of \((0,0), (2,0), (0,1)\)) at \((2,1)\), not \((1,0.5)\).  
  - Violates IIA: Shrinking the set may shift the ray’s intersection.  
    *Example:* \(d = (0,0)\), \(S = \text{convex hull}\{(0,0), (2,0), (0,2), (1.5,1.5)\}\). Solution: \((1.5,1.5)\). Let \(T = \text{convex hull}\{(0,0), (1.5,1.5), (1.6,1.4)\}\). Solution for \(T\): \((1.5,1.5)\), but if \(T\) excludes \((1.5,1.5)\) and includes \((1.4,1.6)\), the solution may differ.  

  **Dictatorial solution (¬SYM, SI, IIA):**  
  - Satisfies IIA: The maximum utility for the dictator in a subset \(T \subseteq S\) containing the original solution remains unchanged, and efficiency fixes the other player’s utility.  
  - Satisfies SI: Rescaling preserves the dictator’s maximum.  
  - Violates SYM: Asymmetric by construction.  

  ---

  ### Unoccupied Combinations  
  - **SYM, ¬SI, IIA**: Possible but no natural solution (e.g., symmetric utilitarian violates SI).  
  - **¬SYM, SI, ¬IIA**: Asymmetric Kalai-Smorodinsky exists but is not standard.  
  - **¬SYM, ¬SI, IIA**: Incoherent—IIA solutions (like dictatorial) typically require SI.  
  - **¬SYM, ¬SI, ¬IIA**: Many possible solutions, not named or explored.  

  ### Limitations  
  - The tree **cannot distinguish between the two dictatorial solutions** (player 1 vs. player 2) using axioms alone.  
  - **Egalitarian solution’s computation** assumes comprehensiveness; adjust to the efficient frontier if the ray intersection is inefficient.  

