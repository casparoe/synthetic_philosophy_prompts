prompt: |-
  I have a friend who, over the past few years, has become someone I can only describe as relentlessly good. She volunteers every weekend, donates a large fraction of her income, has gone vegan, reads to the blind, writes letters to prisoners, and seems to have no hobbies that aren't also morally improving in some way. She isn't sanctimonious about it — she's genuinely warm, never lectures anyone, and would be the first to say she's just doing what seems obviously required. And yet being around her makes me feel exhausted and somehow inadequate. I find myself avoiding her, and I feel guilty about it.

  A mutual friend told me I'm just uncomfortable because her example exposes my own moral mediocrity, and that the right response is to admire her and try to be more like her. But something about that diagnosis doesn't sit right with me. It isn't just that I feel bad about myself — it's that I'm not sure I would want to be her, even if I could. Her life seems narrow. She doesn't seem to leave room for things that aren't morally serious: she doesn't read novels unless they're edifying, she doesn't follow sports or gossip or go dancing, and she laughs less than she used to. I'm not sure she's happier, and I'm not sure I'd find her life a good human life, however good a moral life it is.

  Is there a case to be made that there's something genuinely unappealing — not just threatening to my self-image — about a life devoted single-mindedly to moral goodness? Or am I just rationalizing my own complacency?
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They have a friend who's become "relentlessly good," engaging in numerous altruistic activities without being sanctimonious. The user feels exhausted and inadequate around her, leading to avoidance and guilt. A mutual friend suggested this discomfort stems from feeling morally mediocre, but the user suspects something deeper.

  First, I need to validate both perspectives. The friend's dedication is commendable, and the user acknowledges that. But the exhaustion isn't just envy. The key points are the narrowness of the friend's life—no leisure, humor, or non-moral activities. The user questions if such a life is truly fulfilling, not just morally exemplary.

  I recall Aristotle's concept of eudaimonia, which balances virtues with personal flourishing. Maybe the friend's imbalance is causing the unease. Also, Nietzsche's idea that constant self-sacrifice might stem from repressed instincts. The user might be sensing an absence of joy or authenticity in the friend's actions.

  Then there's the psychological aspect. Constant moral vigilance can lead to burnout, both for the person and those around them. The user's avoidance could be a self-protective response to this intensity. The guilt suggests they value the friendship but feel overwhelmed.

  The user needs reassurance that their feelings aren't just rationalization. Highlighting the importance of diverse human experiences—like play, art, and rest—could validate their perspective. Emphasizing that morality includes self-care and community joy might help them see their own choices as valid without condemning their friend.

  Also, considering the unspoken needs: the user might want permission to set boundaries without guilt and affirmation that a balanced life isn't morally inferior. They might seek a framework to appreciate their friend's virtues while maintaining their own lifestyle without feeling inadequate.
answer: |-
  Your feelings are both understandable and insightful—they touch on a profound tension in human life: the relationship between moral virtue and human flourishing. Your discomfort isn't necessarily rationalization or envy; it may reflect a legitimate intuition about the *fullness* of human existence. Let’s break this down:

  ### 1. **The "Narrowness" Concern: Is Moral Rigor Costing Humanity?**
     - **The Risk of Moral Asceticism:** A life stripped of "non-moral" pleasures—humor, leisure, art for art’s sake, or unstructured play—can become existentially thin. Philosophers like Aristotle argued that *eudaimonia* (human flourishing) requires a balance of virtues, friendships, intellectual engagement, and yes, pleasure. If your friend has sacrificed joy, wonder, or spontaneity at the altar of moral duty, she may be living a life that is admirable but not fully *human*.  
     - **The Role of "Useless" Beauty:** Activities like dancing, reading fiction, or following sports aren’t frivolous. They cultivate imagination, communal bonding, catharsis, and resilience. As philosopher Alain de Botton notes, art and play allow us to process complex emotions in a low-stakes space. Removing these might not make someone "better"—it might make them fragile or disconnected from the messy reality of others’ lives.
     - **The Shadow of Rigidity:** Even without sanctimony, relentless moral focus can unintentionally signal that non-moral pursuits are *less valuable*. This creates an implicit hierarchy where others feel judged for their "ordinary" joys—not because she condemns them, but because her life embodies a silent reproach.

  ### 2. **The Psychological Toll: For Her and For You**
     - **Her Well-Being:** You note she laughs less. Chronic self-sacrifice can mask unresolved guilt, anxiety, or a need for control. Psychologists link "moral perfectionism" to burnout, resentment, and emotional depletion. If her actions stem from compulsion rather than integrated virtue, it’s unsustainable—and might explain why her energy feels draining rather than inspiring.
     - **Your Response:** Your exhaustion isn’t just guilt—it’s likely *empathic overwhelm*. Being near someone operating at intense moral altitude can feel like standing in a high-G force. Avoiding her isn’t malice; it’s self-preservation. Your guilt about avoiding her ironically proves you care about the relationship, not just your comfort.

  ### 3. **Philosophical Pushback: Is "Moral Mediocrity" the Only Alternative?**
     - **False Dichotomy:** Your mutual friend frames this as "admire her or be mediocre." But morality isn’t a binary. A rich human life integrates duty with joy, service with receptivity, principle with flexibility. Think of Ursula K. Le Guin’s idea: "To see a good act is to feel warmth; to see a good *person* is to feel suffocated." Moral acts uplift; moral *identity* can alienate.
     - **The "Expansive Good" Argument:** Some virtues *require* non-moral engagement. Humor builds bridges. Appreciating art deepens empathy. Rest prevents burnout and nurtures creativity for future good. By denying herself these, your friend might be limiting her *capacity* for sustained impact—and missing chances to connect with others on shared human ground.

  ### 4. **A Better Framework: Integration Over Imitation**
     Instead of seeing your friend as a model to emulate or reject, consider these perspectives:
     - **Balance as a Moral Virtue:** Thomas Aquinas placed *prudence* above all virtues—knowing when, how, and to what extent to act. Your friend’s imbalance may reflect a lack of prudence, not moral superiority.
     - **The "Window and Mirror" Test (via writer Parker Palmer):** 
       - *Window:* What does her life reveal about the world’s needs? (Admire her awareness and commitment.)
       - *Mirror:* What does your reaction reveal about *your* values? (Your longing for joy/balance is valid data.)
     - **Your Own Moral Language:** Your discomfort suggests you value kindness *and* joy, duty *and* freedom. That’s not mediocrity—it’s a different moral vocabulary. Explore it without apology.

  ### What You Can Do
  1. **Reframe Your Guilt:** You’re not failing by not matching her. Your role in her life (and others’) might be to model groundedness, humor, or self-care—qualities she lacks.
  2. **Re-engage on Your Terms:** Suggest an activity that blends connection with lightness (e.g., a walk in nature, sharing a meal). If she declines, you’ve extended grace without compromising your needs.
  3. **Interrogate Your Own Life Gently:** Ask: *Where do I want to grow?* Not to mimic her, but to align *your* actions with *your* values. Maybe donate 2% of income, not 30%. Volunteer monthly, not weekly.
  4. **Accept the Discomfort:** Growth often feels uneasy. Let her presence be an invitation to reflect—not a verdict on your worth.

  ### Final Thought
  Morality untempered by humanity risks becoming a cage. Your friend’s life may be a powerful protest against indifference, but a full life also protests against joylessness. You’re not wrong to sense that something vital is missing—not just for you, but *for her*. Compassion for her (and yourself) means holding both truths: her dedication is remarkable, and her narrowness is a loss. That’s not rationalization—it’s wisdom.
