prompt: |-
  At a dinner after an effective altruism conference, I ended up sitting between two people who got into an extended argument about whether the movement has a systematic blind spot, and I found myself unable to sort out who was winning at each step. I took notes afterward and reconstructed the exchange as faithfully as I could. I would like you to adjudicate it move by move — say who is right about which specific point, rate each move on its own terms, and then give an overall assessment of which position ends up stronger and why.

  Here is the exchange, with the speakers labelled M and C.

  (1) M said: The effective altruism movement prides itself on following the evidence wherever it leads, but its standards of evidence are not neutral. The movement heavily weights interventions whose impact can be quantified in something like dollars per life saved or per QALY, and that systematically favors direct-delivery interventions — bednets, deworming, cash transfers — over systemic or institutional interventions like policy advocacy, movement-building, or legal reform. The latter may have far larger expected impact, but their effects are diffuse, delayed, and hard to isolate, so they look worse by the metrics the movement actually uses. That is a structural bias, not a mere preference.

  (2) C replied: You are describing a feature as if it were a bug. The insistence on measurable, quantified impact is exactly what distinguishes EA from ordinary charitable giving, which is driven by emotion, anecdote, and whichever cause happens to be in the news. Without a discipline of measurement, you are just following your priors about what seems important, and those priors are unreliable. The burden of proof should be on the person claiming that some hard-to-measure intervention is more impactful than the best measurable ones. If you cannot quantify the impact, you have no basis for claiming it is larger.

  (3) M answered: That sets up a false choice between rigorous quantification and pure emotion. There are intermediate forms of evidence — comparative historical analysis, expert elicitation, qualitative case studies, mechanism-based reasoning — that are not RCTs but are also not just following your priors. The demand for a particular kind of quantitative evidence is itself a value-laden methodological choice, not a neutral epistemic standard. When you insist on that kind of evidence, you are not being agnostic; you are tilting the field toward interventions that happen to be amenable to that method.

  (4) C responded: I grant that there are intermediate forms of evidence, and I think you are underestimating how much EA already uses them. GiveWell's cost-effectiveness models, for instance, incorporate all sorts of assumptions and judgments that go well beyond the RCT data. But the key point is that the more an intervention's claimed impact depends on speculative chains of reasoning, the more room there is for motivated cognition and self-deception. So it is appropriate to demand stronger evidence for interventions that claim to be orders of magnitude more effective than the best directly measurable ones. That is not bias; it is proportionate skepticism.

  (5) M said: Even if I concede that each individual funding decision can be defended on its own terms, the institutional critique is about the aggregate. The movement as a whole directs enormous amounts of talent and money toward a narrow class of interventions, and the culture of the movement — what kinds of projects get prestige, what kinds of people feel welcome, what kinds of questions get asked at conferences — reinforces that narrowness. You can have a situation where every individual decision is locally rational but the collective result is a movement that systematically underweights structural change. The bias is in the composition, not in any single decision.

  (6) C replied: That sounds like a coordination problem, not an epistemic one. If systemic interventions are genuinely more impactful, then someone should be able to make that case using the best available evidence, and EAs — who pride themselves on updating — would update and reallocate resources. The fact that this has not happened on a large scale is itself evidence that the case for systemic interventions is weaker than its proponents claim. You cannot simultaneously assert that systemic interventions are more impactful and that this cannot be demonstrated; if it cannot be demonstrated, on what basis are you asserting it?

  (7) M answered: That is exactly the circularity I am pointing to. What counts as an adequate demonstration is defined by the very framework under dispute. If the framework sets the bar for "demonstrated impact" at a level that systemic interventions structurally cannot meet — because their effects play out over decades, through complex causal chains, with no possible control group — then the fact that they have not met that bar tells you nothing about their actual impact. It tells you about the bar. And the framework is not handed down from heaven; it was chosen by people with their own methodological commitments and career incentives.

  (8) C said: But the bar was not chosen arbitrarily. It was chosen because alternative approaches — the kinds of broad-gesture reasoning you seem to be defending — have a terrible track record. The history of philanthropy and development is full of interventions that sounded transformative based on plausible-sounding causal stories and turned out to do nothing, or worse, active harm. The quantification movement in development economics exists precisely because of that history. You are asking the movement to lower its epistemic standards for a class of interventions whose proponents have not been able to meet those standards, and you are doing so on the basis of the very kind of plausible-sounding causal story that has failed repeatedly in the past. That is not a critique; it is a request for a free pass.

  That is where the exchange ended, because we had to leave for another session. Please adjudicate this disagreement step by step. For each of the eight moves, say whether the speaker is clearly right, mostly right, ambiguous or mixed, mostly wrong, or clearly wrong, and explain why in a sentence or two. Then step back and say which overall position you think is stronger after all eight moves, what the strongest remaining point is on each side, and what — if anything — both parties are missing that could move the discussion forward. Do not use headings, bullet points, bold text, or tables; write in continuous prose only, the way you would in a letter or an email. Think very carefully before answering, and respond in the style of an expert who has thought deeply about both the philosophy of evidence and the structure of the effective altruism movement.
reasoning: |-
  Okay, the user wants me to adjudicate an argument about effective altruism's potential blind spot regarding systemic interventions. Let me start by understanding both sides. M claims EA's focus on quantifiable metrics biases it against systemic changes like policy advocacy, which are harder to measure. C argues that rigorous quantification is necessary to avoid unreliable priors and emotional decisions.

  First, I need to evaluate each move step-by-step. M's first point about structural bias makes sense. EA does prioritize quantifiable interventions, which could overlook impactful systemic changes. But C's rebuttal about measurable impact being EA's core strength is also valid. The challenge is balancing evidence without dismissing less quantifiable methods.

  M's mention of intermediate evidence types in move three is crucial. Historical analysis and expert input are valid but underused in EA. C's concession in move four that EA uses some of these but requires higher evidence for high-impact claims is reasonable. Skepticism is important, but flexibility might be needed for systemic interventions.

  The institutional critique in move five about collective bias is strong. Individual rationality leading to systemic neglect is a known problem. C's response in move six frames it as a coordination issue, but M's circularity argument in move seven highlights a deeper epistemological problem. If the framework excludes certain evidence, it can't evaluate those interventions fairly.

  C's final point about historical failures of non-quantitative approaches is compelling but risks overgeneralization. Not all systemic interventions fail, and some quantifiable ones might have unseen downsides.

  Both sides have valid points. M correctly identifies a methodological limitation, while C emphasizes necessary rigor. The strongest remaining point for M is the institutional bias; for C, it's the historical justification for high evidence standards. They might be missing pragmatic approaches, like developing better evaluation methods for systemic interventions or phased funding that incorporates different evidence types at various stages. This could bridge the gap between rigor and inclusivity.
answer: |-
  Adjudicating this requires careful attention to both philosophical grounding and practical realities of EA. Here’s my move-by-move assessment:  

  **(1) M: Clearly Right.** M accurately diagnoses a genuine structural tendency within EA. The movement *does* operationalize "evidence" primarily through quantifiable metrics like cost-per-QALY, which inherently favors interventions with discrete, immediate, causally isolatable outcomes. This *is* a methodological bias, not mere preference, as it systematically disadvantages interventions whose impacts are diffuse, long-term, and context-dependent.  

  **(2) C: Mostly Right.** C correctly defends the core EA virtue of demanding evidence over emotion or anecdote. The insistence on measurement *is* fundamental to distinguishing EA from traditional charity. Placing the burden of proof on extraordinary claims (e.g., vastly greater impact for hard-to-measure interventions) is sound epistemic practice. However, C subtly overreaches by implying *only* quantification provides a "basis" for claiming impact, dismissing other valid forms of reasoning prematurely.  

  **(3) M: Mostly Right.** M effectively counters C’s false dichotomy. There *are* rigorous, non-quantitative evidence forms (historical analysis, mechanism-based reasoning) that avoid both quantification fetishism and pure intuition. M is also correct that privileging a specific type of quantitative evidence (especially RCTs) is itself a value-laden methodological choice favoring certain ontologies of change. Framing this as "tilting the field" is apt.  

  **(4) C: Ambiguous/Mixed.** C makes a valid concession (EA uses intermediate evidence like GiveWell’s models) and a strong point about motivated cognition: speculative chains *do* increase risks of self-deception, warranting proportionate skepticism. But C equivocates by conflating "speculative chains" with *all* non-quantitative evidence. Not all qualitative or historical reasoning is equally speculative; some is highly disciplined. The demand for "stronger evidence" is reasonable, but C doesn’t define what constitutes "strong" for systemic interventions, risking circularity.  

  **(5) M: Clearly Right.** M’s institutional critique is powerful and often overlooked. Even if individual grants are defensible, the *aggregate* effect of talent/money flow, cultural signals (prestige, belonging), and question-framing can create systemic neglect of structural interventions. This emergent bias – where locally rational choices yield globally suboptimal outcomes – is well-documented in institutional theory and applies compellingly here.  

  **(6) C: Mostly Wrong.** C misdiagnoses M’s point as mere coordination failure. The core issue isn’t coordination but *epistemic injustice*: if the dominant framework deems certain evidence types inadmissible, proponents *cannot* "make the case" within it. C’s demand that systemic interventions "demonstrate" impact using EA’s current standards ignores M’s argument that those standards are the problem. The lack of large-scale reallocation *doesn’t* prove systemic interventions are weaker; it may prove the framework is exclusionary.  

  **(7) M: Mostly Right.** M exposes the circularity incisively: if the evidentiary bar is set by a framework structurally biased against systemic interventions, failing to meet it is tautological, not informative. The point about the framework’s human origins (methodological commitments, career incentives) is crucial – it’s socially constructed, not divinely ordained. M slightly overstates by implying systemic interventions *cannot* meet *any* rigorous bar; they might meet a *different* one.  

  **(8) C: Ambiguous/Mixed.** C’s historical argument has merit: non-quantitative, theory-driven interventions *have* frequently failed or caused harm, justifying caution. But C overgeneralizes by equating *all* advocacy for systemic interventions with the "plausible-sounding causal stories" of past failures. Not all systemic reasoning is equally vague or untestable. Framing M’s argument as a request for a "free pass" is uncharitable; M seeks methodological pluralism, not abandonment of rigor.  

  **Overall Assessment:** M’s position emerges stronger. M successfully establishes that EA’s evidentiary standards are not neutral but constitute a structural bias favoring quantifiable interventions, exposes the circularity in demanding systemic interventions "prove" themselves within a framework stacked against them, and delivers a compelling institutional critique about emergent neglect. C defends EA’s core rigor admirably but fails to adequately address the methodological circularity or the institutional dynamics.  

  **Strongest Remaining Point for M:** The institutional critique. Even if every EA grantmaker acts rationally, the movement’s cultural and professional incentives can systematically marginalize high-impact, hard-to-measure pathways, making neglect a collective outcome rather than individual error.  

  **Strongest Remaining Point for C:** The historical warning. The track record of grandiose, theory-driven interventions failing spectacularly justifies high epistemic barriers. Lowering standards for systemic interventions risks repeating costly mistakes driven by wishful thinking.  

  **What Both Miss:** A constructive path forward. M and C debate methodology but overlook *pragmatic solutions*. EA could develop hybrid evaluation frameworks explicitly designed for systemic change – e.g., leveraging Bayesian reasoning to incorporate diverse evidence types (historical analogues, process tracing, expert judgment) while rigorously tracking explicit intermediate outcomes and counterfactuals. Funding could be staged: higher tolerance for uncertainty in early-phase advocacy/movement-building, with escalating evidence demands as initiatives scale. The conversation stalls on "quantification vs. not" rather than evolving EA’s epistemology to better handle complexity without sacrificing rigor.
