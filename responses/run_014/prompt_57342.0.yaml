prompt: |-
  So I'm TAing a seminar called "Philosophy and Psychotherapy" — about a dozen second-year clinical psych students — and next Tuesday it's my turn to run the 75-minute section on Sartre's bad faith. The catch is that they're three weeks into their CBT placements, so they arrive with a very specific toolkit and they will absolutley try to file Sartre under it. Two failure modes I can already see coming: one group will cash out bad faith as basically a cognitive distortion, i.e. a wrong belief about yourself that dissolves once someone shows you the evidence against it; the other group will treat it as lack of insight, i.e. the client is repressing the truth and therapy is just getting them to self-report honestly. Neither is dumb, and I don't want to simply announce that both are wrong — I want the sequence itself to make the wrongness visible to them.

  Plan the section for me rather than explaining bad faith to me; I know the material, what I don't have is an order of attack. So: what has to be in place before bad faith is even statable — I'm assuming facticity and transcendence, plus something about consciousness not being a thing that has properties, and I'm fuzzy on how much of that machinery I can get in without losing them — and what depends on what, so I'm not borrowing a concept three steps before I've earned it. Then which case should carry the whole thing. The café waiter is available and they've half-heard of it, but I worry it reads as cute people-watching rather than as freedom collapsing on itself; should I use it as a warm-up and then retire it, or is there a better single case, maybe drawn from their placement world, since every one of them has a client who says "I'm just an anxious person, that's who I am"? Tell me what that carrying case has to have and what it has to lack — my instinct is it can't be a case where the truth is obvious on reflection, or the paradox just disapears.

  And then the misconception map. For each predictable wrong turn — bad faith as ordinary self-deception in the hiding-a-belief sense (and how do I handle the problem that you'd have to know exactly what you're hiding?), bad faith as mere hypocrisy or cowardice, radical freedom as "you can be anything, so just choose differently," authenticity as brutal honesty or sincerity-as-cure, and the big one where they conclude Sartre is blaming people for their circumstances — say where in the sequence I head it off and what I actually do at that moment so it doesn't feel like a teacher correcting a student. Finish with one thing I can put to them in the last ten minutes that would genuinely discriminate between "bad faith landed as a claim about the structure of freedom" and "bad faith landed as a fancy synonym for being in denial," and tell me what I should openly refuse to cover at this level and announce that I'm refusing it — I'm guessing the full for-itself/in-itself ontology, and probably the Other. American English, please, and be concrete: rough timings per block would help, because 75 minutes goes fast.
reasoning: |-
  Okay, let me approach this TA's request systematically. The user is preparing a seminar on Sartre's bad faith for clinical psych students immersed in CBT frameworks, and needs a concrete lesson plan that prevents common misinterpretations. 

  First, I need to understand the core challenge: students will instinctively force Sartre into CBT categories like cognitive distortions or lack of insight. The user wants the sequence itself to reveal why these frameworks don't capture bad faith's paradox. Key requirements include: establishing necessary foundations (facticity/transcendence), choosing the right case study, mapping misconceptions tactfully, and creating a discrimination task.

  Hmm, the timing is tight (75min), so ontology must be minimized. The café waiter alone might reinforce the "cute observation" problem - better to pair it with a clinical example like "I'm just an anxious person" to show bad faith as structural. The "anxious person" case works because: truth isn't hidden (they state it openly), it's not about evidence (they have evidence), and it exemplifies freedom-collapsing-into-thingness.

  For the sequence: must build stepwise. Start phenomenologically with choice examples (10min) to establish consciousness-as-action before defining terms. Introduce facticity/transcendence through concrete binaries (15min), then reveal their interdependence via the "anxious person" case (20min). Only then name bad faith as the paradox - this order prevents premature categorization.

  Misconception handling should be proactive: when defining terms, explicitly contrast facticity with "circumstances" (blocking the blaming-Sartre issue). During the case analysis, preempt the "cognitive distortion" reading by asking: "If the client knows their anxiety isn't fixed, is this really about false beliefs?" 

  For the discrimination task: end with "What would authenticity look/sound like here?" (10min). This forces application of the structure-of-freedom lens - if they suggest "admitting truths" or "choosing optimism", they've missed the point. Openly omit the for-itself/in-itself mechanics and Other-related bad faith to avoid overload.

  Notable traps to avoid: don't let "freedom" become CBT-style behavioral choice; don't let sincerity masquerade as authenticity. The clinical example must be one where the "truth" is already conscious to block repression readings.
answer: |-
  Here’s a battle-tested 75-minute plan designed to make Sartre’s paradox *land* while sidestepping CBT assimilation. The core strategy: **delay naming "bad faith" until the machinery is visible through clinical friction.**

  **Phase 1: Groundwork – Freedom as Action, Not Belief (0-25 min)**  
  *(Goal: Establish consciousness as non-thing, freedom as constitutive)*  

  1.  **Hook: Everyday Choice as Self-Definition (5 min)**  
      *   "Quick show of hands: Who here has ever said or thought something like 'I'm just not a morning person' or 'I'm bad at math'? What happens in that moment? How does it feel?"  
      *   *Listen, validate, then pivot:* "Notice how that statement *feels* like a discovery, but also... a bit like closing a door? Let's unpack that."  

  2.  **Consciousness Isn't a Box (10 min)**  
      *   **Demo:** "Close your eyes. Try to *be* your anxiety for 5 seconds. Just *be* it. ... What happened?"  
          *   *Expected:* "I thought about it," "I felt it," "I couldn't *just* be it."  
      *   **Point:** "Consciousness isn't a *thing* you *are* (like a rock is hard). It's the *activity* of revealing what is (including your own feelings/states). 'Anxiety' is something you *have*, something you *do* (dwell on, flee from), not something you *are*. If you try to *be* it, you step back from it."  
      *   **Jargon Lite:** "Sartre: Consciousness is always *beyond* itself ('transcendence'). It's the 'not-being' the thing it's aware of."  

  3.  **The Double Bind: Facticity & Transcendence (10 min)**  
      *   **Define Visually:** Draw two columns.  
          *   **Facticity (The 'Is'):** Body, past, diagnosis, environment, habits, tendencies, cultural roles. *"Stuff that's just... there."*  
          *   **Transcendence (The 'Is-Not'):** Future projects, interpretations, choices *right now* about how to *take* that facticity. *"The space where meaning happens."*  
      *   **Crucial Point:** "These aren't separate. They *need* each other. My past *matters* because I have projects *now* that give it weight. My anxiety *is* a burden *because* I want to do things it hinders. **Freedom isn't the absence of facticity; it's how you *inhabit* it.**"  
      *   **Pre-empt CBT Blending:** "Notice: This isn't about *believing* the 'right' thing about your facticity. It's about the *stance* you take towards it."  

  **Phase 2: The Trap – Introducing Bad Faith Through the Clinical Lens (25-50 min)**  
  *(Goal: Make the paradox tangible using their experience)*  

  1.  **The Case: "I'm Just an Anxious Person" (10 min)**  
      *   "Think of a client (real or composite) who says, sincerely, 'I'm just an anxious person. That's who I am.' How does this show up? What does it *do* for them? What does it *prevent*?"  
      *   *Guide Discussion:* Likely responses: "Avoids trying things," "Explains failures," "Feels hopeless." Note: **They're describing the *function* of the statement.**  

  2.  **Dissecting the Claim (10 min)**  
      *   **Facticity Check:** "Is there *some* facticity here? Past experiences? Biological vulnerability? Current symptoms? *Yes.*"  
      *   **Transcendence Check:** "What does the statement *do*? It takes that facticity and... what? **Freezes it.** It turns 'I *experience* anxiety frequently' into 'I *am* Anxiety-Incarnate.' It pretends the future is already determined by the past."  
      *   **The Paradox Emerges:** "Here's the rub: The client *knows*, deep down, they *aren't* just a static 'anxious person.' How?  
          *   They agonize over choices (showing freedom is active).  
          *   They wish they were different (implying they aren't *just* this).  
          *   **They are *using* their freedom *right now* to *deny* their freedom.** They choose to interpret their facticity as a fixed destiny."  

  3.  **Name It: Bad Faith (5 min)**  
      *   "**This** is bad faith: A flight from the unbearable tension of being *both* radically free *and* utterly situated. It's not lying *to* yourself about a hidden fact. **It's lying *about* the structure of your being.** It's pretending you *are* your facticity (denying transcendence) *or* that you can magically escape it (denying facticity). Here, they're collapsing into facticity."  
      *   **Contrast Explicitly:**  
          *   **Not Cognitive Distortion:** It's not a *false belief* ("I am anxious") that evidence disproves. The facticity *is* real. It's the *metaphysical claim* ("This *is* who I am") that's the lie *about freedom*.  
          *   **Not Lack of Insight:** They *are* aware of their anxiety! The problem isn't *accessing* a repressed truth; it's *misinterpreting* the ontological truth of their freedom *despite* having the data. Insight might reveal the *pattern* ("I always say this"), not resolve the *existential denial*.  

  **Phase 3: Nuance, Misconceptions & Application (50-70 min)**  

  1.  **Café Waiter as Illustration, Not Core (5 min - OPTIONAL if time permits)**  
      *   "Sartre's waiter: Moves *too* precisely, plays 'waiter' like a thing. Why? Maybe to escape the burden of being free ('I *must* do this, it's my job!'). Collapses into role/facticity. *Similar structure to our client.* But the client example hits closer for you."  

  2.  **Actively Shutting Down Misconceptions (Embedded in Q&A/Discussion)**  
      *   **"So it's just hypocrisy/cowardice?"**  
          *   *Respond:* "Hypocrisy implies knowing X and pretending Y. Bad faith is deeper: It's convincing *yourself* of a false ontology ('I *am* this role/anxiety'). It's ontological cowardice, maybe, but not simple dishonesty."  
      *   **"Radical freedom = Just choose differently!"**  
          *   *Respond:* "Sartre agrees freedom means choice, BUT bad faith shows we constantly *choose* ways to *disguise* that choice. 'Just choose' ignores the immense weight of facticity *and* our skill at self-deception. It's not willpower; it's recognizing the lie *in* the choice you're already making (e.g., choosing to see anxiety as identity)."  
      *   **"Authenticity = Brutal honesty?"**  
          *   *Respond:* "Honesty about *what*? It's not just admitting facts ('I feel anxious'). It's owning the *freedom* within those facts. It's saying *'I am anxious now, and this shapes me, but I am also the one choosing how to live with/through/against it.'* It's inhabiting the tension, not dissolving it."  
      *   **"Sartre is blaming the victim!" (CRITICAL)**  
          *   *Respond:* **"No. He's describing an inescapable structure of being human, amplified by oppression.** Bad faith is often the *only bearable* way to live under crushing facticity (poverty, abuse, systemic injustice). Calling it 'bad faith' isn't moral condemnation; it's exposing the *mechanism* of suffering. Therapy's job isn't to blame, but to gently reveal this structure *as a potential site of freedom*, however limited."  

  3.  **The Discrimination Task: Last 10 Minutes**  
      *   **Pose:** "Based on today, imagine your 'anxious identity' client starts next session by saying: *'I realize I'm not *just* an anxious person. I'm someone who gets very anxious, and it's really hard, but I'm also the one who decides what that means for me today.'*  
          **Q1:** What might have shifted for them *ontologically* (structurally)?  
          **Q2:** How is this **different** from them simply adopting a new, positive belief ('I'm capable')?  
          **Q3:** What specific *tensions* (between facticity/transcendence) might they now be *facing* instead of fleeing?"  
      *   **Why it works:**  
          *   Q1 targets recognition of structural shift (acknowledging freedom *within* facticity).  
          *   Q2 forces distinction between belief-change and ontological stance-change.  
          *   Q3 reveals that authenticity *isn't* a cure, but confronting the burden of freedom. If they answer Q2/Q3 in terms of beliefs or outcomes, bad faith landed as "denial." If they articulate the *stance* or *tension*, it landed structurally.  

  **What to Openly Refuse:**  
  *   **Announce Early:** "We're diving into one core concept today: bad faith. To do that, we need Sartre's ideas of facticity and transcendence. **We are explicitly *not* covering:**  
      *   The full 'Being and Nothingness' ontology (for-itself/in-itself as technical terms).  
      *   Bad faith in relation to 'The Look' of the Other (that's a whole other seminar!).  
      *   Detailed comparisons to other existentialists or full critiques of Freud.  
      *   **Why?** Because bad faith itself is slippery enough! We need focus to grasp its unique paradox."  

  **Timing Buffer:**  
  *   Build in 5 min flex (e.g., shorten case discussion slightly). If Phase 1 runs long (likely), cut the Waiter or tighten misconception discussion. **Protect the Discrimination Task time.**  

  **Why This Sequence Works:**  
  1.  **Starts Concrete & Clinical:** Uses their immediate experience.  
  2.  **Builds Necessary Machinery First:** Consciousness-as-activity and facticity/transcendence are prerequisites *before* the paradox makes sense.  
  3.  **Uses Clinical Case as Primary Vehicle:** Makes Sartre speak *to their world*, preventing abstraction. The "anxious identity" case **lacks** a hidden truth accessible by insight and **has** undeniable facticity, forcing the focus onto the *interpretive stance*.  
  4.  **Delays the Jargon:** "Bad faith" is named *after* the phenomenon is felt.  
  5.  **Proactive Misconception Handling:** Contrasts are built into definitions and case analysis, not tacked on.  
  6.  **Discrimination Task is Application:** Forces synthesis and reveals understanding level.  
  7.  **Clear Boundaries:** Managing expectations prevents overwhelm and keeps focus.  

  **American English Note:** Use "stuff that's just there" (facticity), "space where meaning happens" (transcendence), "playing a role" (café waiter), "freezing yourself" (bad faith), "owning your situation *and* your choices" (authenticity), "crushing weight of circumstances" (oppression).

  Good luck! Your awareness of their CBT lens is your best weapon – use the friction productively. They might leave frustrated that Sartre doesn't fit their toolkit... which means you succeeded.
