answer: |-
  Here’s a ruthless prioritization for your semester project, justified by **tractability**, **upstream leverage**, and **avoiding dead ends**. I’ll distill the maze into 2 core questions and 1 "if-time" follow-up, explaining why they dominate the alternatives.

  ### **The Winning Triage:**
  1. **Question 1: Does Gustafsson's "Guaranteed Loss" criterion reframe the entire money pump project?**  
     **Why prioritize:**  
     - **Upstream Leverage:** Gustafsson’s move (avoiding *guaranteed* loss vs. *possible* loss) challenges the foundational threat of *all* money pumps. If you only need acyclicity (not transitivity) to avoid guaranteed loss, most classic arguments for transitivity/completeness collapse. This redefines what "rationality" must defend against.  
     - **Tractability:** Perfect for a logic background. Requires analyzing decision trees/payoff matrices to formalize "guaranteed loss" vs. "possible loss." Compare Gustafsson's formalism to classic pumps (e.g., the "cycle of preferences" pump). No heavy econ needed.  
     - **Dead End Avoidance:** Skirts endless debates about resolute/sophisticated choice (which assume pumps are *always* threatening) and whether one-shot exploitation matters (guaranteed loss is unambiguous).  
     - **Open Angle:** Is "guaranteed loss" too weak? Does it permit agents vulnerable to *likely* (but not certain) exploitation? Or does it reveal that classic pumps rely on implausible agent naiveté?

  2. **Question 2: Under what conditions do changing preferences make money pumps irrelevant (or rational)?**  
     **Why prioritize:**  
     - **Upstream Leverage:** Directly challenges the "diachronic irrationality" premise. If preferences *legitimately* change (e.g., due to experience, values shifts), is being "pumped" irrational, or just a tax on preference evolution? This questions whether synchronic axioms apply diachronically.  
     - **Tractability:** Focus on clear cases: e.g., an agent who prefers A > B today but knows they’ll prefer B > A tomorrow after learning information. Logic tools excel at modeling time-indexed preferences and self-prediction. Avoid murky "self-prediction failure" debates by assuming the agent correctly forecasts change.  
     - **High Stakes:** If changing preferences *defang* pumps, the entire literature tilts toward static choice. If not, you need a theory of "rational preference change" (e.g., only updatable on evidence).  
     - **Overrated Alternative:** The "self-prediction" problem (can an agent model their future self?) is a red herring. Assume they can, or can’t—either way, the core is whether changing preferences *justify* vulnerability.

  3. **If-Time Question: Does "exploitability = irrationality" hold outside contract-enforcement scenarios?**  
     **Why last:**  
     - **Crucial but Derivative:** This matters *after* you’ve settled Questions 1–2. If Gustafsson shows only guaranteed loss is damning, or if preference change excuses pumps, then "exploitability = irrationality" needs re-scoping.  
     - **Tractable Angle:** Focus on *repeated* vs. *one-shot* interactions. In one-shot scenarios, exploitability may reflect naiveté, not irrationality. Logic can model this with game trees (e.g., agent vs. adversarial nature).  
     - **Avoid:** Don’t dive into metaphysics of rationality. Stick to: "When does exploitability imply a *strictly dominated* strategy?" (links back to Gustafsson).

  ---

  ### **Why Not the Rest?**
  - **Resolute/Sophisticated Choice (McClennen, etc.):** Overrated. These are *patches* for a problem you might dissolve via Gustafsson or preference change. Highly technical with diminishing returns.  
  - **Completeness/Independence Pumps:** Secondary. If guaranteed loss is the bar, these might not clear it. Also, completeness is widely questioned already.  
  - **Acyclicity as Sufficient:** Covered *within* Gustafsson’s framework—his work implies acyclicity avoids guaranteed loss.  
  - **Backward Induction:** Only relevant if pumps are threats *and* you’re committed to transitivity. Questions 1–2 make this optional.

  ---

  ### **The Crux You Might Be Missing**
  **The real upstream battle:** **What is the *purpose* of diachronic rationality?** Is it:  
  - Avoiding exploitation by other agents?  
  - Consistency with one’s own extended agency?  
  - Achieving maximal utility across time?  

  **Why it’s fundamental:** Your stance here determines whether money pumps matter. If rationality is about *self-consistency*, a pump might be irrational even with preference change. If it’s about *anti-exploitation*, Gustafsson’s criterion dominates. If it’s about *utility maximization*, pumps are irrelevant if the agent gains net utility. This meta-question lurks behind every argument but can be addressed *through* your prioritized questions.

  ---

  ### **Workplan for a Semester of Evenings**
  1. **Weeks 1–3:** Dissect Gustafsson (his *Synthese* papers). Formalize "guaranteed loss" and test it against 2–3 classic pumps. Does it really protect acyclicity?  
  2. **Weeks 4–6:** Model changing preferences. Use logic to define "legitimate" vs. "capricious" change. Does a rational agent *ever* accept a pump as the cost of growth?  
  3. **Weeks 7–9:** Combine insights. If changing preferences + guaranteed loss avoidance is sufficient, what axioms remain? Draft your argument.  
  4. **Weeks 10–12:** Explore the "if-time" question: Is exploitability ever *benign*? Polish writing.  

  **Output:** A tight paper arguing that the money pump literature overreaches by ignoring Gustafsson’s criterion and the rationality of preference change. Conclude with a stripped-down set of diachronic requirements.

  This path cuts through the maze by attacking the *structural assumptions* of pumps (Gustafsson) and their *applicability to real agents* (preference change), using your logic skills to bypass econ formalism. The result is upstream impact without dead-end debates.
