prompt: |-
  I've got a semester's worth of evenings free and I want to actually write something on money pump arguments and diachronic rationality rather than just read endlessly. Problem: I don't know what's worth writing. The literature is a maze and I keep going in circles (pun intended). You've got the classic exploitability argument for transitivity, the pumps aimed at completeness and independence, McClennen's resolute choice as an escape hatch, sophisticated choice and backward induction, the question of whether the agent needs to be able to predict her own future preferences for the pump to even get running, whether one-shot vs repeated exploitation matters, Gustafsson-style moves where you only need to avoid guaranteed losses rather than sure ones, the suggestion that all you can really pump out of these arguments is acyclicity, and then the whole separate can of worms about pumps against agents whose preferences change over time.

  What I want is a prioritization, defended, not a survey. Which two or three open questions in this area would you actually pick for someone with my constraints, and why them over the rest? Which are upstream of which -- like, does everything else hang on whether "you can be exploited" and "you are irrational" are even the same claim, or is that a distraction? Which are tractable with a semester of evenings and a logic background but no formal training in economics? And which are overrated or dead ends that keep getting renewed attention anyway? Also, if the real crux is something I haven't listed, tell me what it is and why its more fundamental than the things I did list. I want the ordering justified, not just the menu.
