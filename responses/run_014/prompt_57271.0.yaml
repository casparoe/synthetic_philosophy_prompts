answer: |-
  **Prep Sheet: Defense of "Revealed Preference as Measurement Discipline"**

  **1. Bottom Line:** The most dangerous objection is the philosopher's measurement challenge regarding the legitimacy/objectivity of the invariance filter (Objection 1 below). The chapter survives it *as stated* only by acknowledging the filter is provisional and contestable, not absolute – a concession needed upfront. Core argument holds if filter specification is seen as part of the measurement theory's articulation.

  **2. Objections (Ordered by Damage to Argument Core):**

      **Objection 1: Filter Legitimacy (Philosopher of Economics - Measurement/Idealization)**
      (a) "You're replacing the 'context-independence' of preferences you critique with an equally problematic context-independence of your *filter*. What constitutes 'perturbation' versus a legitimate shift in the *object* of measurement? Your filter isn't discovered; it's stipulated. The constitutive link between filter and utility (Step 4) just makes utility hostage to an arbitrary operationalization. How is this not instrumentalism masquerading as realism?"
      (b) *Reply:* The filter isn't pre-given natural law; it's a *theoretical posit* within the measurement model, defining what counts as measuring *the same underlying state*. Its legitimacy stems from its purpose: enabling stable, interpersonally comparable utility attributions for public justification (Step 1). We posit perturbations likely to induce *irrelevant* contextual influence, based on empirical patterns (e.g., framing effects), aiming for invariance where *relevant* attributes (cost, outcome description) are fixed. It's contestable, yes, but that contestation *is* the scientific debate about measurement validity – arguing over *which* perturbations define the invariance required for meaningful utility comparison. The filter operationalizes the 'cost' in 'choice under cost', making it non-arbitrary relative to the goal.
      (c) *Soft Spot:* "So utility just *is* whatever survives your currently fashionable filter? Doesn't this make the 'underlying state' an empty cipher defined solely by the measurement procedure itself (instrumentalism)?"

      **Objection 2: Calibration Undermines Evidence (Behavioral/Experimental Economist - Elicitation Studies)**
      (a) "If you discard choices that move under perturbation as 'below resolution', you're defining your evidence base *after* applying your theory. This is circular calibration! Our experiments *show* choice is highly sensitive to context you deem 'perturbation'. By discarding most data points as noise, you're left with almost nothing usable – certainly not enough for robust estimation. Doesn't this render Step 2 (choice under cost as evidence) practically empty and Step 3 (interpretation requires procedure) self-fulfilling?"
      (b) *Reply:* Calibration isn't circular; it's standard measurement practice. Thermometers discard readings if shaken violently – that doesn't invalidate temperature. The theory specifies *what a stable signal looks like* (invariance across designated perturbations). We *test* if such stable signals exist by seeing if subsets of choices *are* invariant under specific filters. If no robust invariance is found *anywhere* for plausible filters, that falsifies the *possibility* of stable utility measurement this way. But findings *do* show pockets of stability (e.g., consistent risk aversion in certain gain-frame-only tasks). Discarding noisy data isn't ignoring evidence; it's focusing on evidence meeting the quality threshold the measurement model demands for meaningful interpretation.
      (c) *Soft Spot:* "But your 'pockets of stability' are tiny, context-specific islands. Doesn't this concede that 'utility' is highly fragmented and local, undermining its use for broad cost-benefit analysis comparisons (Step 1)?"

      **Objection 3: Who Sets the Filter & Who Counts? (Law Professor - Justice/Inclusion)**
      (a) "This just kicks the can. Step 1 demands public justification. But *who decides* what perturbations are in the filter? Whose biases shape that? More crucially, your filter implicitly defines *whose choices count as evidence* for utility. What about cognitively impaired agents, children, or choices made under severe duress? Your 'resolution threshold' seems designed to exclude precisely those whose preferences might be most contested and politically crucial. How is this not just technocratic exclusion?"
      (b) *Reply:* You're right, filter specification is inherently normative/political. The theory doesn't dodge this; it *highlights* it. Choosing the filter *is* choosing what kind of agency and stability we deem necessary for inclusion in the utility calculus underpinning public policy. It forces explicit debate about measurement validity conditions *as* inclusion criteria. This is superior to pretending context-independent preferences exist universally. We *must* argue: what level of choice consistency, under what perturbations, is required for an agent's choices to be valid evidence for social valuation? There's no neutral answer, but the framework provides the *structure* for that necessary democratic deliberation about who counts and how.
      (c) *Soft Spot:* "So the framework just formalizes exclusion based on contested norms? Doesn't this make 'utility' useless for its supposed public justification role, as the filter debate precludes agreement on the very utility numbers needed?"

      **Objection 4: Regulatory Impotence (Welfare Economist - Policy Application)**
      (a) "Okay, theoretically interesting. But what do I *do* on Monday? My agency needs a WTP number for clean air regs. If I have to discard any choice influenced by framing, order effects, defaults... I have *no data*. Or I have conflicting 'stable' signals from different filtered subsets. Your view seems to tell me measurement is impossible or requires impossibly perfect experiments we never have. That's not helpful. How does this provide a workable basis for *actual* cost-benefit analysis?"
      (b) *Reply:* It shifts the goalposts from finding *the* true preference to finding the *best justified approximation under scrutiny*. It doesn't paralyze; it refines. Use existing data, but *report the filter conditions assumed* (e.g., "WTP estimated from choice experiments controlling for framing X and Y"). Where sensitivity is high, report range estimates or flag fragility. It demands more rigor in study design upfront (building perturbation tests in) and more humility in interpretation. Crucially, it stops pretending unstable responses are valid data points to be averaged. The alternative – using unfiltered, demonstrably context-sensitive choices – is *worse* for justification. It provides a *standard* for critique and improvement.
      (c) *Soft Spot:* "So your practical advice is 'be more careful and admit uncertainty'? That doesn't generate the numbers the OMB requires. Doesn't this framework ultimately delegitimize current practice without offering a feasible replacement?"

      **Objection 5: Resolution Threshold Arbitrariness (Behavioral/Experimental Economist - Methodology)**
      (a) "How do you *operationally* define 'below resolution'? Is it statistical significance of the shift? Effect size? Consistency across subjects? This seems incredibly fuzzy. One researcher's 'noise' is another's 'meaningful preference construction'. Without a clear, objective threshold, the filter becomes a subjective tool to cherry-pick data that fits the stability assumption. This undermines the 'publicly checkable' nature of Step 2."
      (b) *Reply:* Thresholds *are* inherently somewhat arbitrary, like p<0.05. But they are guided by statistical principles (e.g., power analysis), effect sizes relevant to the policy context, and theoretical expectations about the *magnitude* of irrelevant influence. The key is *transparency*: pre-registering the filter criteria and resolution thresholds before data collection/analysis. The critique applies *within* the framework: argue that *my* threshold is too strict/lenient, or propose a better statistical measure of invariance. The framework mandates this transparency, making the subjectivity contestable *as part of the evidence*, unlike current practice where context effects are often ignored or buried.
      (c) *Soft Spot:* "But pre-registration doesn't solve the arbitrariness of the *initial* threshold choice. Doesn't this just move the locus of subjectivity rather than eliminating it?"

  **3. Crucial Concession to Make Early:** "I concede that the specification of the invariance filter is not pre-given or discovered; it is a theoretical posit, contestable, and potentially laden with normative assumptions about agency. Its justification lies in its ability to enable stable measurement *for the purpose* of public justification."

  **4. Line to Hold Despite Weak Reply:** Do *not* concede on excluding testimony/introspection as evidence (Step 2), even though replies to Objection 3 (Who Counts) and practical pressures (Objection 4) make it tempting. *Why hold?* Ceding ground here abandons the core thesis – that utility for *public* justification requires agent-neutral, non-testimonial evidence. Introspection is private and uncheckable; testimony is agent-specific and contestable only via... further choices or testimony. Holding this line preserves the distinct *public epistemic* role of revealed preference as measurement.

  **5. The Question I Hope Nobody Asks:**
  "What stops an infinite regress? Your 'best-fitting model' (defining utility) depends on the filter. But how do you judge the 'best fit'? Doesn't *that* require a prior conception of what 'fit' means, which itself might imply a prior notion of stable preference or utility, potentially making the whole filter procedure circular?"
  *Why no good answer?* The argument relies on model selection criteria (e.g., parsimony, predictive accuracy on *unperturbed* choices within the context) that are themselves pragmatic and not fully grounded *within* the theory. Defending these criteria risks either appealing to intuitions about stability the theory seeks to ground, or falling into a deeper philosophical debate about model selection that the chapter bracket.
