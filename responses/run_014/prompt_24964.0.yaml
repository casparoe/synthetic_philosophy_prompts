  I should emphasize the categorical difference between third-person physical descriptions and first-person experience. The epistemic gap here is fundamental - Mary gains acquaintance knowledge that no amount of physical facts could provide. 

  The user might counter with representationalist theories later, but for now I need to hold firm on the non-derivability point. Mustn't concede that the phenomenal is just another way to access physical facts. 

