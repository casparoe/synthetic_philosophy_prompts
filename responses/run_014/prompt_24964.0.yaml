answer: |-
  Your objection is astute but underestimates the epistemic rupture in Mary's case. While the Hesperus/Phosphorus identity involves *de re* knowledge under different linguistic or descriptive modes, Mary's new knowledge isn't merely a redescriptive feat. Crucially, before leaving the room, Mary possessed exhaustive *propositional* knowledge of color vision's physical correlates—wavelengths, neural pathways, functional roles. Yet upon seeing red, she gains *acquaintance knowledge*: a direct, non-conceptual grasp of phenomenal redness itself. This acquaintance isn't a new *mode of access* to old facts; it's constitutive of knowing a *qualitative property* that physical descriptions functionally analyze but never *present*. Physical truths specify structures and functions, not intrinsic feels. The "such-and-such neural activity" was known *extrinsically*; now she knows its intrinsic character. No amount of re-describing Hesperus gives you the luminosity of Venus in the dusk sky.
