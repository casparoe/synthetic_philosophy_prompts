prompt: |-
  I'm trying to figure out what I actually believe about moral worth — specifically, what it takes for an action to be performed "for the right reason" — by going on my gut reactions to a set of cases. Here are my verdicts, and I want to know whether a single principle, or a small set of them, captures the pattern, what that principle says about cases I haven't yet considered, and which of my verdicts it forces me to give up.

  1. A hospice nurse quietly raises a dying man's morphine because she judges that easing his suffering is what he needs and what a good nurse ought to do; nothing else is moving her. I assign this full moral worth.

  2. The same nurse, the same patient, the same dose — but this time she raises it because it is the last task before her break and she wants to be finished. The act is still the right one. I assign this little or no moral worth.

  3. A person catches a stranger who is stumbling, without any deliberation and without any thought of duty, simply because they are a warm, helpful kind of person. I am torn, but I lean toward full moral worth, even though the agent never acted on a moral principle.

  4. A person returns a lost wallet stuffed with cash because they are a devout believer acting on the conviction that it is a commandment of their faith, and the commandment happens to line up with what morality requires. I am torn again, but I lean toward full moral worth, because the believer genuinely takes the right thing to be right.

  5. A thief breaks into a corrupt billionaire's vault and donates the entire take to a children's hospital, fully aware that the theft is wrong but convinced that the moral arithmetic justifies it. I assign this no moral worth — the act is wrong, full stop — though I grant that the motive is genuinely good.

  6. A person keeps a promise to meet a friend for dinner because they know that keeping promises is right, and also because they genuinely look forward to the evening; both motives are present and both are doing real work. I assign this full moral worth.

  7. A person does not cheat on their taxes because they are terrified of the social disgrace of being found out. The act is right; the motive is pure fear of shame. I assign this little or no moral worth.

  8. A person who was raised from infancy to always do the right thing now does the right thing automatically, the way a musician plays a well-practiced piece, without ever reflecting on whether it is right. I assign this only partial moral worth, and I am not sure why it differs from case 3.

  The pairs that bother me most: I give case 3 (the instinctive helper) full worth but case 8 (the trained automatic person) only partial worth, even though neither ever deliberates about duty and both act rightly; and I give case 4 (the believer acting on a commandment) full worth, which seems to clash with any rule that says the operative reason must be the moral reason itself rather than something that merely coincides with it.

  Two cases I have not listed, and I would like your principle to say something definite about: (a) a person who forms the full intention to do the right thing for the right reason but is killed in a car accident before they can act; and (b) a person who does the right act for the right reason, but the act, through sheer bad luck, produces a bad outcome that no one could have foreseen.

  Please give me a principle, or a small set of candidates, stated precisely; for each, the clause that does the work in each of my cases; its verdicts on (a) and (b); and an honest statement of which of my verdicts it cannot accommodate and which I should be willing to drop.
reasoning: |-
  Okay, let me start by really digging into this user's query. They're exploring moral worth, specifically what makes an action done "for the right reason." They've provided eight cases with their verdicts and two additional scenarios they want insights on. The user seems to be a philosophy enthusiast or student trying to systematize their intuitions into a coherent principle. Their frustration points are the tension between cases 3 and 8, and case 4's conflict with requiring direct moral motivation.

  First, I need to analyze each case and the user's verdicts. Case 1 is straightforward: the nurse acts solely out of moral duty, full worth. Case 2 is self-interested, no worth. Case 3 is instinctive help, full worth—here, the lack of deliberation doesn't reduce worth. Case 4 is religious motivation, full worth, even though it's not explicitly moral. Case 5 is a wrong act despite good intentions, no moral worth. Case 6 combines duty and personal desire, full worth. Case 7 is fear-driven, no worth. Case 8 is automatic action from training, partial worth. 

  The user's tension between cases 3 and 8 is key. Both involve non-deliberative actions, but they assign different worth. Why? Case 3's agent is described as "warm, helpful," suggesting an ingrained character trait aligned with morality. Case 8's agent acts automatically due to training, like a habit. The difference might be in whether the disposition stems from moral internalization or mere conditioning. 

  Case 4 is tricky because the motivation is religious, not explicitly moral, yet the user gives full worth. This challenges the idea that the agent must be motivated by morality itself. The user might value that the agent sees the act as non-optional, akin to moral recognition. 

  For the unlisted cases: (a) an agent intending right action but dying before acting. Here, no action means no moral worth, but the intention might have evaluative worth. (b) Right action with unforeseeable bad outcome. Moral worth should remain since it's about the reason for acting, not outcomes. 

  Now, developing principles. The user needs a unified theory that explains their judgments. Principle 1: Moral worth requires acting for the reason that makes the act right. This fits cases 1, 2, 5, 6, 7 but stumbles on 3 and 4. In case 3, the helper isn't acting on the moral reason but instinct. Case 4's agent acts on religious command, not the moral rightness. So Principle 1 might force the user to downgrade these cases, but they lean toward full worth. 

  Principle 2: Moral worth requires acting because the act is right. Similar issues with cases 3 and 4. The agent in 3 isn't thinking about rightness. 

  Principle 3: Moral worth requires that the agent’s motivating reason aligns with the right-making feature, and the agent must treat that feature as normatively decisive. This is more flexible. Normative decisiveness means the agent would still act even without other motives. Case 3: the helper's warm disposition aligns with the right-making feature (preventing harm), and it's decisive. Case 4: religious command aligns, and the agent treats it as decisive. Case 8: the automatic agent's training aligns, but if it's mere habit without internalization, it might not be decisive. The user assigns partial worth here, so this principle accommodates that by requiring the disposition to be such that the agent sees the act as required. 

  For case (a), no action, so no moral worth. For (b), outcome doesn't affect worth, so it remains. 

  The user might need to adjust case 8's verdict. If the trained person's disposition includes seeing acts as morally required (even if unreflective), it should have full worth. But the user gives partial, so Principle 3 suggests distinguishing between internalized virtue and rote habit. 

  Deep needs: The user seeks coherence in their moral intuitions, possibly to build a personal ethical framework. They might also want to resolve cognitive dissonance between cases like 3 and 8. Underlying this could be a desire to understand if character or intention is more central to moral worth. Highlighting the role of dispositional virtues versus habits could address this. 

  In summary, Principle 3 best balances the user's judgments, explaining tensions through normative decisiveness and alignment. It asks them to reconsider case 8: if the automatic action stems from deep-seated virtue, it deserves full worth. If mere training without moral commitment, partial stands. Case 4 is accommodated as the agent treats the command as morally decisive, even if framed religiously.
answer: |-
  Based on your intuitions, your core principle seems to be **"Moral worth depends on the action being motivated by a disposition that reliably tracks and responds to the morally relevant features of the situation, treating them as normatively decisive."** Let's break this down into a coherent principle set and apply it rigorously.

  **The Proposed Principle Set:**

  1.  **The Alignment Condition:** The agent's *motivating reason* must align with the *right-making feature(s)* of the action (the feature(s) that actually make it the right thing to do in those circumstances).
  2.  **The Normative Grasp Condition:** The agent must treat the right-making feature(s) as *normatively decisive* – meaning they see these features as providing a sufficient, non-optional reason to act. This can be implicit in their character/disposition or explicit in their reasoning.
  3.  **The Disposition Condition:** The motivating reason must flow from a stable character disposition (virtue, principle, commitment) that reliably produces right action *because* it tracks morally relevant features, rather than from fleeting impulse, external pressure, or self-interest *unrelated* to the rightness.

  **How it Explains Your Verdicts:**

  1.  **Hospice Nurse (Duty):** (1) Motivating Reason (MR): Ease suffering (right-making feature - RM). (2) Treats RM as decisive (duty/ought). (3) Flows from stable professional/moral disposition. **Full Worth.**
  2.  **Hospice Nurse (Break):** (1) MR: Get to break (Not RM). Alignment fails. **No Worth.**
  3.  **Instinctive Helper:** (1) MR: Help someone in need (RM). (2) Implicit grasp: Disposition treats preventing harm/helping as normatively decisive (they *just see it as what one does*). (3) Flows from stable, warm/helpful disposition. **Full Worth.** (Your lean is captured: No explicit principle needed, but disposition reliably tracks RM).
  4.  **Believer Returns Wallet:** (1) MR: Obey divine command (RM: Property rights/honesty). (2) Treats command/RM as normatively decisive (non-optional). (3) Flows from stable religious/moral disposition. **Full Worth.** (Your lean captured: Alignment exists; the command *is* how they grasp the RM normatively).
  5.  **Thief Donates:** (1) Act is wrong (Theft). Alignment fails fundamentally. No RM to align with. **No Worth.** (Motive irrelevant to worth of the *act*).
  6.  **Keeps Promise (Duty & Desire):** (1) MR: Keep promise (RM) *and* Enjoy evening. (2) Treats promise-keeping (RM) as decisive (would likely still act without enjoyment). (3) Disposition reliably tracks duty (RM). **Full Worth.** (Duty is decisive; enjoyment is compatible bonus).
  7.  **Pays Taxes (Fear):** (1) MR: Avoid shame (Not RM: Civic duty/fairness). Alignment fails. **No Worth.**
  8.  **Trained Automatic:** (1) MR: Habit/training (RM). (2) **Problem:** Does the disposition involve *treating the RM as normatively decisive*? If purely rote habit, lacking the implicit grasp (Condition 2 weak/failed). (3) Disposition reliable but possibly mechanical. **Partial Worth.** (Explains your uncertainty vs Case 3: Case 3 has implicit normative grasp, Case 8 *might* lack it).

  **Resolving Your Tensions:**

  *   **Case 3 vs Case 8:** The key difference lies in **Condition 2 (Normative Grasp)**. Your intuition suggests the "warm, helpful person" implicitly *grasps* the normative force of helping (it's non-optional for them). The "trained automatic" person, while acting rightly, might *only* have reliable habit without that implicit normative commitment – it's just "what they do," not necessarily "what *must* be done." Your partial worth for 8 reflects this perceived lack of deeper normative engagement.
  *   **Case 4 & "Coinciding Reasons":** Condition 2 saves this. The believer *treats* the commandment *as* normatively decisive, and importantly, *the commandment coincides with the RM*. Their reason *is* the RM, *as they understand it through their faith*. It's not a *different* reason that merely coincides; the commandment *is their reason for seeing the act as right/required*. Condition 1 (Alignment) holds.

  **Verdicts on Unlisted Cases:**

  *   **(a) Intention but No Action (Killed):** **No Moral Worth.** Moral worth applies to *actions* performed for reasons. While the *intention* might be praiseworthy (reflecting good character), the *act itself* never occurred. Conditions 1 & 3 require an action motivated by a disposition *in that instance*.
  *   **(b) Right Reason, Unforeseeable Bad Outcome:** **Full Moral Worth.** Moral worth concerns the reasons/motives *for acting*, not the actual consequences, especially unforeseeable ones. Conditions 1 (Alignment with RM known/forseeable), 2 (Normative Grasp of those RM), and 3 (Disposition) are satisfied at the time of action. The worth isn't negated by bad luck.

  **Where Your Verdicts Might Need Adjustment (Per the Principle):**

  *   **Case 8 (Trained Automatic):** The principle *can* accommodate your partial worth verdict if "trained automatic" implies a lack of implicit normative grasp (Condition 2). However, it also *allows* for full worth **if** the training instilled a disposition where the agent implicitly treats the right act as non-optional (similar to Case 3). Your uncertainty suggests this. The principle pushes you to clarify: *Is this person acting like a morally attuned "musician" or like a well-programmed robot?* If the former (deeply internalized virtue), **full worth** is consistent. If the latter (mere reliable output), **partial worth** stands. Your current partial verdict is defensible but requires affirming the lack of normative grasp.
  *   **Case 4 (Believer):** The principle strongly supports your lean to full worth. If you feel residual tension, it likely stems from a desire for the agent to be motivated *explicitly* by "morality itself." The principle shows this isn't necessary; motivation by a feature that *is* the RM (property rights), grasped as normatively decisive *through* their faith framework, suffices.

  **Conclusion:**

  The principle set **"Alignment + Normative Grasp + Disposition"** captures the vast majority of your intuitions, including your torn cases (3, 4, 8). It resolves your tensions by highlighting the crucial role of *implicitly or explicitly treating the right-making feature as normatively decisive* (Condition 2). This explains why the instinctive helper (Case 3) gets full worth (implicit grasp) while the merely trained person (Case 8) might only get partial (possible lack of grasp), and why the believer (Case 4) gets full worth (their command *is* their mode of normative grasp). It gives clear verdicts on the unlisted cases: no worth for unperformed intentions, full worth for unforeseeable bad outcomes. The primary point for reflection is **Case 8**: Does the "trained automatic" person possess the implicit normative grasp? If yes, the principle suggests upgrading to full worth; if not, your partial verdict stands.
