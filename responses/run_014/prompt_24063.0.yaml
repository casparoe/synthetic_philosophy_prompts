   The standard axioms in the List-Pettit theorem are:
   1. Universal Domain (UD): The aggregation function accepts as input any logically possible profile of individual judgment sets.
   2. Collective Rationality (CR): The output is a complete and consistent set of judgments.
   3. Unanimity (U): If all individuals hold a particular judgment, the collective must hold that judgment.
   4. Systematicity (S): The collective judgment on each proposition depends only on the individual judgments on that proposition and in the same way (i.e., there is a uniform decision rule for every proposition).

