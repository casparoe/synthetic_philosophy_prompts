prompt: |-
  I work in the rights and licensing team at a mid-sized media company. Part of my job is deciding which elements of our works and products we can control and which are effectively common property. Over the past few years the team has made a series of rulings on whether a particular element is protectable expression or an unprotected idea, and I'd like you to reconstruct the implicit rule our rulings have been applying and then use it to decide a new case we are facing this week.

  Here are five prior rulings, in roughly chronological order:

  1. A rival reality show used the same premise as our flagship show — a house, hidden cameras, weekly evictions. We declined to enforce.
  2. A rival series reused a specific sequence of scenes from our show, with near-identical dialogue in three of them. We enforced.
  3. A rival game used the same scoring method as ours — a formula for computing bonus points from consecutive matches. We declined to enforce.
  4. A rival fantasy novel used a "chosen one saved by prophecy" arc. We declined to enforce.
  5. A rival used our cover art for a reissued edition, with minor recoloring and a different typeface. We enforced.

  The new case: our app's signature feature is a "time machine" view — a vertical timeline through a project's history, navigable by scrolling only, rendered as a "spine" with each version shown as a "vertebra." A competitor has just released an app with a vertical timeline, scroll-only navigation, and a spine-like rendering with nodes. They use a different color palette, different typography, and a different animation (theirs: nodes pop in; ours: the spine grows).

  My working hypothesis is that our five rulings are jointly consistent with at least two, and perhaps three, different rules about where the idea/expression boundary lies — something like "protect only distinctive authorial choice," "protect concrete expression but not what functional constraints or merger force," and "protect only concrete instantiation." I am not sure which rule, or combination of rules, the team has actually been running, and I suspect this new case is one on which those candidate rules diverge.

  Please respond in the following four sections, in this order:

  1. "Candidate rules" (~300 words): reconstruct the implicit rules that the five prior rulings are consistent with. State each rule in one or two sentences, and show that it predicts all five rulings.

  2. "Applying the rules" (~350 words): for each candidate rule, state what verdict it gives on the new case and why. Be explicit about exactly where the rules diverge.

  3. "The most consistent verdict" (~300 words): given the track record, what should we decide? Identify the closest prior analog among the five rulings, say which verdict best coheres with our own precedents, and state honestly what principle the team would be adopting with each available choice.

  4. "The discriminating case" (~200 words): which single further case — one we could bring to the team next quarter — would most cleanly discriminate the candidate rules, and what would each rule predict on it?

  I am not asking for a survey of copyright law or a list of cases; I want a diagnosis of the rule structure and a recommendation that is consistent with the track record.
reasoning: |-
  Okay, let me approach this step by step. The user works in media rights and needs help analyzing their team's copyright enforcement pattern across five cases to establish a consistent rule for a new "time machine" feature dispute. 

  First, I need to extract candidate rules from their precedents. Looking at the five cases: 
  - Case 1 shows unprotectable premise (common reality show elements) 
  - Case 2 protects specific scene sequence and dialogue (concrete expression) 
  - Case 3 rejects protection for functional scoring formula 
  - Case 4 denies protection for generic story trope 
  - Case 5 enforces against copied cover art (visual expression) 

  Three plausible rules emerge: 
  1) Protect only distinctive authorial choices (predicts all cases by distinguishing unique expression from standard elements) 
  2) Protect concrete expression but exclude functional/merged elements (explains why scoring formula wasn't protected despite being specific) 
  3) Protect only literal copying (but fails to explain why Case 5's recolored art was still enforced) 

  For the new case - vertical timeline with scroll navigation and spine rendering: 
  - Rule 1 might not protect since UI conventions may be functional 
  - Rule 2 likely declines as scroll navigation seems functional constraint 
  - Rule 3 would decline since no pixel copying occurred 

  The closest analog is Case 3 (scoring method) - both involve functional interfaces. Enforcing here would contradict that precedent. But declining creates tension with Case 5's visual protection. 

  To resolve ambiguity next quarter, I'd propose testing protection of a highly stylized but functional element - like a unique progress bar animation. The rules would split: 
  - Rule 1 protects if sufficiently distinctive 
  - Rule 2 rejects as functional 
  - Rule 3 rejects unless copied verbatim 

  This maintains focus on their internal logic rather than external copyright doctrine.
answer: |-
  ### 1. Candidate Rules  
  Based on the five rulings, three implicit rules emerge:  

  **Rule 1: Protect only distinctive authorial choices**  
  *Definition*: Protection applies only to elements reflecting unique, non-functional creative decisions not dictated by convention or necessity.  
  *Consistency*:  
  - Case 1: "Premise" (house/cameras/evictions) is standard genre convention → unprotected.  
  - Case 2: Specific scene sequence/dialogue reflects unique authorship → protected.  
  - Case 3: Scoring formula is functional (mathematical necessity) → unprotected.  
  - Case 4: "Chosen one" arc is stock narrative trope → unprotected.  
  - Case 5: Cover art’s visual design reflects distinctive choices → protected despite recoloring.  

  **Rule 2: Protect concrete expression but exclude functional/merged elements**  
  *Definition*: Protect tangible, fixed expressions unless they result from functional constraints or "merger" (i.e., only one/few ways to express the idea).  
  *Consistency*:  
  - Case 1: Premise is abstract idea → unprotected.  
  - Case 2: Concrete scenes/dialogue aren’t functionally essential → protected.  
  - Case 3: Scoring method is functional (formula dictated by purpose) → unprotected.  
  - Case 4: Plot arc is an idea with merged expression (many stories use similar arcs) → unprotected.  
  - Case 5: Artwork is concrete, non-functional expression → protected (minor changes don’t avoid infringement).  

  **Rule 3: Protect only literal or near-literal copying**  
  *Definition*: Protect only verbatim or minimally altered reproductions; independent creation of similar elements is permissible.  
  *Consistency*:  
  - Case 1: No literal copying of show elements → unprotected.  
  - Case 2: Near-identical scenes/dialogue → protected.  
  - Case 3: Formula reused but not copied verbatim (implied) → unprotected.  
  - Case 4: Arc concept reused, not dialogue → unprotected.  
  - Case 5: Artwork copied with trivial changes → protected.  

  All rules fit the five rulings, but **Rule 3** struggles with Case 5 (recoloring/font changes were still deemed infringing).  

  ---

  ### 2. Applying the Rules to the New Case  
  **New Case**: Competitor’s app has vertical timeline, scroll navigation, spine rendering, but different colors/typography/animation.  

  - **Rule 1 (Distinctive Choices)**: **Decline enforcement**.  
    *Why*: The "spine" visualization and scroll navigation are functional UI choices (optimizing linear history navigation) or common design tropes. Color/animation differences confirm competitor’s independent choices. Closest to Case 3 (unprotected functional method).  

  - **Rule 2 (Concrete Expression, Excluding Functionality/Merger)**: **Decline enforcement**.  
    *Why*: Vertical timeline and scroll navigation are functional constraints for history-tracking apps (merger applies). "Spine" rendering is a common metaphor (like book spines). Differences in color/animation show non-literal expression. Analogous to Case 1 (unprotected premise) and Case 3 (unprotected method).  

  - **Rule 3 (Literal Copying)**: **Decline enforcement**.  
    *Why*: No pixel-for-pixel copying; competitor changed colors, typography, and animation. Unlike Case 5 (artwork copied), this is non-literal similarity. Aligns with Case 4 (unprotected arc concept).  

  **Divergence Point**:  
  - Rules 1 and 2 decline due to functionality/commonality.  
  - Rule 3 declines due to non-literal implementation.  
  - **Key difference**: Rule 1/2 emphasize *why* the element isn’t protectable (function/genre), while Rule 3 focuses on *how much* was copied. Case 5 is the outlier: Rules 1/2 protected it as distinctive/concrete expression; Rule 3 protected it as near-literal copying. Here, all rules agree—but for distinct reasons.  

  ---

  ### 3. The Most Consistent Verdict  
  **Verdict**: **Decline enforcement**.  
  **Closest Analog**: **Case 3 (scoring method)**. Both involve a functional interface element (scoring formula ↔ timeline navigation) that competitors could independently develop. Enforcing here would contradict Case 3, where a specific formula was deemed unprotectable.  

  **Principles Adopted**:  
  - **If enforcing**: You adopt **Rule 3 (literal copying)** but inconsistently, as Case 3’s formula wasn’t protected despite similarity. This would imply protecting *any* UI metaphor (e.g., "spine" = protectable), conflicting with Case 1’s premise ruling.  
  - **If declining**: You reinforce **Rule 2 (functionality/merger exclusion)**, treating the timeline as an unprotectable method. This coheres with Cases 1, 3, and 4, and aligns with Case 5 (which involved non-functional art). Case 2 remains distinct as literal dialogue copying.  

  **Honest Principle**: Declining adopts: *"Protect only expression separable from functional or conventional constraints."* This balances Cases 2/5 (protect concrete art/narrative) with 1/3/4 (deny protection to ideas/methods/tropes).  

  ---

  ### 4. The Discriminating Case  
  **Proposed Case**: A competitor replicates your app’s unique "progress bar" animation—a *stylized hourglass where sand particles form user-specific shapes*—but with different colors and transition speed.  

  **Predictions**:  
  - **Rule 1 (Distinctive Choices)**: **Enforce**. The animation reflects idiosyncratic artistic choices (user-specific shapes) unrelated to function.  
  - **Rule 2 (Concrete Expression)**: **Decline**. Animation serves functional progress-tracking purpose; merger applies (limited ways to visualize progress).  
  - **Rule 3 (Literal Copying)**: **Decline**. No frame-by-frame copy; colors/speed differ.  

  **Why It Discriminates**:  
  - Rules 1 and 2 split on whether decorative flourishes are "functional."  
  - Rules 2 and 3 split on whether non-literal animation copying is protectable.  
  - Outcome clarifies if your team prioritizes *artistic distinctiveness* (Rule 1) or *functional separability* (Rule 2) over literalism (Rule 3).
