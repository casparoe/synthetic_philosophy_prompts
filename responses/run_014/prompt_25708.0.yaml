  ## Demarcating the Demos: Why All-Subjected Prevails Over All-Affected

  The quest to define the legitimate boundaries of the demos (the people entitled to participate in collective self-government) is fundamental to democratic theory. While the "all-affected principle" (AAP) – granting a say to anyone whose interests are impacted by a decision – holds intuitive appeal, it ultimately proves untenable as a workable criterion for constituting the demos. The "all-subjected principle" (ASP) – restricting the demos to those subject to the coercive enforcement of a polity's laws – offers a more defensible alternative, even when confronting the critical regress objection faced by both principles.

  **I. The Unraveling of the All-Affected Principle**

  1.  **The Regress Objection's Devastating Blow:** The most profound critique of AAP is the infinite regress it triggers regarding the foundational boundary decision itself.
      *   **The Core Problem:** To decide *who should decide* the boundaries of the demos (Decision D1) using AAP, we must first know *who is affected* by D1. But determining who is affected by D1 *is itself a decision* (Decision D2) about boundaries. Applying AAP to D2 requires knowing who is affected by *it* (Decision D3), and so on *ad infinitum*. There is no non-arbitrary starting point. AAP presupposes the very demos it seeks to define in order to determine the scope of "affectedness" for the constitutive decision.
      *   **Consequences:** This regress renders AAP logically incoherent for the foundational act of constituting the demos. It cannot bootstrap itself into existence without either an arbitrary initial demarcation (contradicting its own universalism) or collapsing into requiring global inclusion for *every* political decision (which is pragmatically impossible and dissolves distinct political communities).

  2.  **Over-Inclusiveness and Indeterminacy:** Even beyond the regress, AAP suffers from fatal practical flaws:
      *   **Problem of Causal Chains:** In an interconnected world, virtually *any* significant political decision (e.g., setting environmental standards, economic policy) can have diffuse, indirect effects cascading globally. AAP, taken literally, implies near-universal inclusion in almost every demos for almost every decision, rendering the concept of a bounded political community meaningless.
      *   **Subjectivity of "Affected" and "Interests":** Identifying whose interests are "affected" and to what degree is inherently subjective and contested. Does a minor economic ripple affect my "interests"? Does a cultural policy in another country affect my identity interests? AAP provides no clear, objective metric, opening the door to endless dispute and strategic manipulation about who counts.

  **II. The All-Subjected Principle: A More Defensible Framework**

  ASP defines the demos as those who are **subject to the coercive power** of a polity's legal order – those whom the state can legitimately compel, sanction, or command under threat of force.

  1.  **Addressing the Regress: The "Constitutional Regress" and ASP's Response**
      *   **The Analogous Difficulty:** ASP faces a *structurally analogous* challenge: **The Constitutional Regress.** To constitute the initial legal order that defines subjection (the constitution/founding moment - Decision C1), we must know *who is subjected* to the coercive power established *by* C1. But prior to C1, that coercive power doesn't exist. Who then decides C1?
      *   **Why ASP Handles it Better:**
          *   **Focus on the *Existing* Legal Order:** ASP primarily functions as a criterion for membership *within an already existing polity*. Its main strength is in defining the demos for *ongoing decisions* within a functioning constitutional framework. The regress primarily bites at the extraordinary moment of *founding* or *fundamental constitutional change*.
          *   **Founding as a Distinct, Recognizable Event:** The founding moment (C1) is qualitatively different. While ASP doesn't magically solve *who* makes C1, it clarifies *what* C1 *does*: it establishes the coercive legal order and thereby defines the initial set of the subjected. The subjects of C1 are those who find themselves within the territorial jurisdiction or under the effective control of the new power when it asserts its authority. This relies on facts of power and territoriality at a specific historical juncture, not on evaluating infinitely regressing chains of "affectedness."
          *   **Objectivity and Boundedness:** "Subjection to coercion" is significantly more objective than "affected in interests." It points to tangible facts: Is an individual physically located within the territory where a law is enforced? Are they legally obligated under its rules? Are they vulnerable to its sanctions (fines, imprisonment)? This provides a clearer, more stable, and less infinitely expansive boundary than the nebulous concept of "affected interests." While border disputes exist, the core criterion is far less susceptible to global overreach than AAP.

  2.  **Additional Advantages of ASP:**
      *   **Reciprocity of Coercion and Consent:** ASP embodies a core democratic intuition: those compelled to obey the law should have a say in making it. This creates a direct link between the authority exercised over individuals and their right to participate in shaping that authority (the "no taxation without representation" principle writ large).
      *   **Feasibility and Political Community:** ASP enables the formation of bounded, self-governing political communities capable of making collective decisions. It aligns with the reality of territorially defined states enforcing laws within their jurisdiction.
      *   **Mitigating Over-Inclusion:** While ASP might include non-citizens residing within the territory (a strength, as they *are* subjected to laws), it generally excludes those merely affected externally (e.g., foreign consumers affected by trade policy), preventing the demos from dissolving into global amorphousness. Concerns about external coercion (e.g., via sanctions or military force) can be addressed by refining ASP to focus on *direct, ongoing legal subjection within the polity's jurisdiction*, distinguishing it from external policy effects or acts of war.

  **III. Conclusion: Demarcation Through Coercion**

  The all-affected principle, while appealing in its universalist aspiration, collapses under the weight of its own logic, particularly the inescapable regress problem inherent in its application to the constitutive question of the demos. Its indeterminacy and tendency towards boundless over-inclusion render it practically and theoretically untenable as a criterion for demarcating a meaningful political community. The all-subjected principle, while facing a structurally analogous "constitutional regress" at the moment of founding, offers a significantly more robust and defensible framework. By tethering democratic inclusion to the objective fact of being subject to a polity's coercive legal order, ASP provides a clearer, more bounded, and normatively compelling criterion. It focuses on the reciprocal relationship between authority and those over whom it is exercised, enabling the formation of viable democratic polities capable of collective self-determination within a world of distinct jurisdictions. ASP doesn't eliminate all boundary problems, but it provides a far superior tool for resolving them compared to the self-defeating logic of the all-affected principle.
