  For area 3: The elasticity problem. If "injury" can include disgust, it might justify an offense principle. I'll ask how she prevents this from collapsing the framework. She'll likely cite Bentham's empirical approach to avoid imagined harms, so follow-up on whether this requires judges to assess evidence, risking bias.

  For area 4: Bentham vs. Mill. I'll ask about differences beyond the "early Mill" idea. She might note Bentham's focus on interests vs. Mill's autonomy, so follow-up on implications for sexual minorities—highlighting practical differences.

