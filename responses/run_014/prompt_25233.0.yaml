prompt: |-
  I am designing a graduate seminar on the cognitive penetration of perception. Before we evaluate the empirical evidence or the arguments for and against it, I want my students to have a clear specification of what a theory in this area is a theory of — what it must explain, what it must be consistent with, and what it must not conflate. Please write exactly five desiderata that any adequate account of cognitive penetration must satisfy. Each desideratum should be stated as a requirement in one or two sentences, followed by a brief explanation of the case, puzzle, or consideration that makes it binding rather than optional. The list should distinguish genuine requirements from the preferences of particular theoretical camps, and it should flag any pair of desiderata that appear jointly difficult to satisfy. Be attentive to the following difficulty: some natural demands one might place on a theory of cognitive penetration — for instance, that it specify which mental states count as cognitive and which as perceptual — may presuppose a sharp perception-cognition distinction that is itself contested in ways that bear on whether penetration is possible at all. Your desiderata should avoid building in such presuppositions without argument, or at minimum flag where they do so. No introduction, no conclusion — just the five numbered items.
reasoning: |-
  Okay, the user is designing a graduate seminar on cognitive penetration of perception. They need five desiderata for any adequate account of cognitive penetration. First, I need to understand the key challenges here. Cognitive penetration deals with how higher-level cognitive states like beliefs or desires might influence perceptual experiences. But there's a big debate about whether such influence even exists, partly because the line between perception and cognition itself is fuzzy.

  The user wants desiderata that define what a theory must explain, be consistent with, and avoid conflating. They also mentioned avoiding presuppositions about the perception-cognition distinction. So each desideratum needs to be carefully crafted to not assume that distinction outright. 

  Let me start brainstorming possible requirements. First, any theory must explain how exactly cognition affects perception. But it shouldn't just be any influence—there are uncontroversial cases like attention shifts that shouldn't count as cognitive penetration. So we need a way to exclude those trivial cases. That could be the first desideratum: distinguishing genuine penetration from other influences.

  Second, the theory must account for the epistemic implications. If cognition changes perception, does that make perception unreliable? Or could it sometimes be beneficial? The theory needs to handle this without begging the question for or against penetration. That's important for the seminar's later discussions on evidence.

  Third, the theory must show that the cognitive state is causally relevant. But it can't just be any causation—earlier states like mood might affect perception without being cognitive penetration. So the desideratum should require the cognitive state itself to be the influencer, not just correlated states. 

  Fourth, the theory needs to preserve the distinction between perception and cognition appropriately. But since that distinction is contested, the desideratum should require the theory to either maintain a robust distinction or clearly explain why it's untenable. This avoids presupposing the distinction while making it a point of engagement.

  Fifth, the theory must explain the phenomenological effects. If cognition affects perception, does it change what we consciously experience? Or could it be subconscious? The theory should specify the nature of this effect, perhaps allowing for different views but requiring clarity.

  I also need to flag where desiderata might conflict. For example, maintaining a robust perception-cognition distinction (Desideratum 4) while allowing cognitive states to directly influence perception (Desideratum 3) could be tricky. That tension should be noted.

  Each point should be concise: one or two sentences for the requirement, then a brief explanation. No intro or conclusion. Let me ensure the language is precise and avoids jargon where possible. For instance, "doxastic states" might need to be "beliefs or judgments" for clarity in a graduate seminar context.

  Finally, double-check that none of the desiderata implicitly assume a sharp perception-cognition split. For example, Desideratum 4 explicitly makes it optional to maintain the distinction, which addresses the user's concern. The others focus on functional roles rather than predefined categories.
answer: |-
  Here are five desiderata for any adequate account of cognitive penetration:

  1.  **Requirement:** The account must provide criteria distinguishing genuine cognitive penetration from mere attentional modulation, expectation-based perceptual learning, or post-perceptual judgment/cognitive bias.  
      **Binding Case:** Attention shifts (e.g., focusing on color vs. shape) demonstrably change what is processed/perceived without cognition *penetrating* the perceptual system's core processing. Failing to exclude this conflates ubiquitous top-down attentional control with the contested phenomenon.

  2.  **Requirement:** The account must explain the potential epistemic significance of cognitive penetration, clarifying how it might impact the justificatory role of perception (e.g., introducing problematic circularity or enabling adaptive sensitivity) or threaten perceptual objectivity.  
      **Binding Case:** If beliefs directly alter perceptual experience, perception may cease to provide independent checks on belief, raising concerns about epistemic circularity ("seeing what you believe") versus potentially enhancing veridicality (e.g., expert wine-taster's nuanced perception).

  3.  **Requirement:** The account must specify how the influencing cognitive state (e.g., belief, desire, concept) is causally relevant to the specific resulting perceptual state, excluding cases where a common cause (e.g., mood, physiological state) independently influences both cognition and perception.  
      **Binding Case:** Sadness might cause both pessimistic beliefs *and* perceiving grayer colors. This isn't cognitive penetration unless the belief *itself* causally contributes to the grayer perception, distinct from the shared mood state.

  4.  **Requirement:** The account must engage with the perception-cognition distinction, either by relying on a specific, motivated characterization of that distinction relevant to penetration claims or by explicitly arguing why such a distinction is untenable/inadequate for defining penetration.  
      **Binding Puzzle:** Theories denying a sharp distinction (e.g., predictive processing) face challenges defining what "cognitive penetration" even means, as cognition/perception boundaries blur. The account cannot avoid addressing this foundational issue.

  5.  **Requirement:** The account must specify the nature of the "perceptual effect," clarifying whether the purported penetration alters the conscious *phenomenal character* of perception, only its non-conscious processing, subsequent interpretation, or the perceptual *content* itself.  
      **Binding Puzzle:** Does cognition change *what it is like* to see the dress (e.g., making it look blue/black vs. white/gold), or only influence how one categorizes the seen colors? Adequacy requires explaining the locus of the effect.  

  **Flagged Tension:** Desideratum 3 (Causal Relevance of Specific Cognitive State) and Desideratum 4 (Engaging the Perception-Cognition Distinction) are jointly difficult. Establishing direct causal relevance of a paradigmatically "cognitive" state (Desideratum 3) often presupposes a distinction (Desideratum 4) that is precisely what alternative frameworks contest. An account satisfying both must either defend a robust distinction or provide a novel causal mechanism within a blurred-boundary framework.
