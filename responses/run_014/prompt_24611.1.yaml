  Can you argue that the dutch book argument doesn't actually establish the probability axioms as norms of rational belief? I want the argument to run like this: the dutch book theorem only shows that incoherent credences are strongly dutch bookable, meaning there's a finite set of bets, each one you'd accept at your own credences, that together guarantee a loss, and that result only bites for agents who are committed to a betting framework where they take bets at their credences. That commitment to betting isn't itself a requirement of rationality, so the argument shows incoherent credences are a liability for betting agents, not that they're irrational simpliciter. Then address the obvious reply, that the betting framework is just a way of cashing out what it means to have a credence, so the commitment is built into the concept itself. Keep the whole thing under 400 words.
