prompt: |-
  I'm preparing a graduate seminar in the philosophy of statistics, and I've been stuck for some time on how to state a puzzle about the institution of significance testing that I think is real but that I can't quite get to the bottom of. The practice is familiar enough: a researcher runs a randomized experiment or a well-controlled study, computes a p-value, and if it falls below 0.05 the finding is reported as "statistically significant," the effect is treated as real, and a paper follows; if it doesn't, the finding is reported as "not significant" and the effect is usually treated as if it weren't there, even though the procedure is calibrated only to control the long-run rate of false positives, not of false negatives. And there is a further asymmetry in the institution itself: journals and grant reviewers systematically prefer published significant results to published null results, so the procedure's output is consumed as if it were a verdict on whether an effect exists, when on the standard account the p-value is merely the probability, supposing the null hypothesis is true, of seeing data at least as extreme as what was in fact observed — a probability about the behavior of the procedure, not about the truth of the hypothesis.

  What I'd like from you is a careful reconstruction of what this practice presupposes about the nature of probability. On the frequentist reading, probability is a long-run relative frequency of a repeatable procedure, and that reading seems to be what the significance level is doing all its work for; but the way the result is actually consumed — "the drug works," "the effect is real" — is a statement about the hypothesis, which is what a subjectivist or Bayesian degree of belief would be. So: which of the standard interpretations — frequentism, degree-of-belief subjectivism, propensity — can each be made to license the practice as it actually is, and at exactly which step does each one break down? I'm especially interested in the norm of preregistration, which requires the hypothesis and the analysis plan to be fixed before the data are collected. That norm looks like it only makes sense if probability is a property of the procedure and not of the hypothesis, but it also looks like it is being motivated by a desire to make post-hoc statements about the hypothesis legitimate, which is a different thing altogether. Please distinguish what the practice strictly presupposes from what it merely fits well with, say where the practice is underdetermined between the interpretations, and explain what would have to change — in how results are reported, in what counts as evidence of an effect, in the design of the experiment — if the institution were rebuilt on a straightforwardly Bayesian view of probability rather than the view it appears to presuppose.
reasoning: |-
  Okay, the user is preparing a graduate seminar on the philosophy of statistics and is stuck on articulating a puzzle about significance testing. They've described the institutional asymmetry where significant results are favored over null results, and how p-values are misinterpreted despite being defined as a procedural probability under the null. They want a careful reconstruction of what this practice presupposes about probability interpretations—frequentist, subjectivist, propensity—and where each breaks down. Also, they're interested in how preregistration fits in and what would change under a Bayesian approach.

  First, I need to unpack the core tension: the institution treats p-values as evidence for the truth of a hypothesis, but technically, p-values are about data under the null. The frequentist interpretation relies on long-run error rates, but the consumption is more Bayesian. The user’s deeper need might be to clarify this epistemological conflict for their students, showing how institutional practices clash with formal definitions.

  Looking at each interpretation of probability: Frequentism aligns with the procedural setup (long-run error control) but fails when users interpret a significant result as "effect is real." Subjectivism (Bayesian) would assign probabilities to hypotheses directly, which fits how results are consumed but clashes with the current practice’s reliance on fixed procedures. Propensity might bridge them but isn’t practical here.

  Preregistration is a key point. It makes sense in frequentism to preserve error rates by preventing data dredging. But the motivation—making hypotheses legitimate—smuggles in a Bayesian desire for credible hypotheses. This conflict shows the practice is hybrid, trying to satisfy both frameworks.

  Switching to Bayesianism would require fundamental changes: reporting posterior probabilities instead of p-values, accepting prior distributions, and valuing evidence incrementally rather than binary significance. Null results would carry weight if they shift beliefs. Journals would need to value well-conducted studies regardless of outcome, reducing publication bias.

  The user might also be hinting at the replication crisis, where institutional incentives exacerbate misinterpretation. Highlighting how Bayesian practices could mitigate this by focusing on evidence accumulation over single studies would add depth. They need clear contrasts between what each probability interpretation licenses and where the practice oversteps, especially in the inference step from p-value to hypothesis truth.
answer: |-
  Here's a careful reconstruction of the puzzle, analyzing the statistical practice through the lens of probability interpretations, highlighting presuppositions, tensions, breakdowns, and implications for preregistration and a potential Bayesian shift:

  **The Core Practice & Institutional Asymmetry:**
  1.  **Procedure:** Conduct a controlled study (e.g., RCT) with a null hypothesis (H₀). Compute a p-value (P(data | H₀ true)).
  2.  **Decision Rule:** If p < α (usually 0.05), reject H₀ & declare result "statistically significant" (SS). If p ≥ α, "fail to reject H₀" (NS).
  3.  **Institutional Interpretation:** SS results are treated as strong evidence *for the alternative hypothesis* (Hₐ), warranting publication, grants, and belief that "the effect is real." NS results are often treated as evidence *for H₀* or at least lack of evidence for Hₐ, leading to file-drawering and dismissal.
  4.  **Formal vs. Practical Logic:** Formally, α controls the long-run False Positive Rate (Type I error) *assuming H₀ is true*. It says nothing directly about the False Negative Rate (Type II error) or the probability Hₐ is true. Practically, however, the SS result is consumed as evidence *about the truth of the hypotheses themselves*.

  **Analysis Through Interpretations of Probability:**

  1.  **Frequentism (Long-Run Relative Frequency):**
      *   **Licenses:** The core *procedure*. α directly represents the long-run proportion of times we would incorrectly reject H₀ *if H₀ were true and we repeated the identical experiment infinitely*. Significance testing is fundamentally designed as a frequentist procedure. Preregistration makes perfect sense: it defines the *exact repeatable procedure* (hypotheses, sampling plan, analysis) whose long-run error properties (α) are being controlled. It prevents "p-hacking" which corrupts the long-run frequency interpretation.
      *   **Breaks Down:** At the point of *interpretation and consumption*. Frequentism strictly concerns the behavior of the *procedure* over many hypothetical repetitions. It does *not* assign probabilities to *singular hypotheses* (e.g., P(Hₐ is true | data)). The institutional practice of treating a single SS result as strong evidence that "the effect is real" (i.e., Hₐ is true for *this specific case*) is a fundamental misinterpretation *from a pure frequentist perspective*. A frequentist can only say the data are unlikely *if H₀ is true*, not that Hₐ is likely true. Treating NS as evidence *for H₀* is an even worse frequentist error, as power (1 - β) is often low and uncontrolled. The institutional preference for SS results creates a selection mechanism that *invalidates* the long-run frequency interpretation of published results (high false discovery rate).

  2.  **Subjectivism / Bayesianism (Degree of Belief):**
      *   **Licenses:** The *institutional interpretation and consumption*. The desire to know "How likely is Hₐ given this data?" is inherently Bayesian. The practice of treating SS as evidence Hₐ is true aligns with how a Bayesian would update their *belief* (posterior probability) in Hₐ upwards based on surprising data under H₀ (low p-value). Preregistration *can* be motivated Bayesianly to prevent "double-counting" data (using it to generate and test hypotheses), which inflates apparent evidence, and to specify priors transparently before seeing results.
      *   **Breaks Down:** At the *procedure itself*. The standard significance test *does not output* P(Hₐ | data) or P(H₀ | data). The p-value P(data | H₀) is not equivalent to P(H₀ | data) (the "transposed conditional" fallacy). The rigid α-cutoff and focus *only* on controlling P(reject H₀ | H₀ true) ignores the Bayesian need to consider P(data | Hₐ) (likelihood) and crucially, the *prior probability* P(Hₐ). A Bayesian cares about the *strength* of evidence (via Bayes Factor or posterior), not a binary "significant/non-significant" based solely on controlling one error rate under H₀. Preregistration's *strict procedural focus* is less central to Bayesianism than specifying priors and models; its primary Bayesian motivation is preventing bias, not defining a repeatable frequency.

  3.  **Propensity (Objective Chance / Disposition):**
      *   **Licenses:** The *underlying reality* the study tries to probe. Propensity interprets probability as an objective tendency or disposition inherent in a physical system (e.g., the propensity of a drug to cause a specific effect). The practice *aims* to discover these propensities. Preregistration could be seen as ensuring the study design cleanly reflects the propensity of interest without contamination.
      *   **Breaks Down:** In connecting the *statistical procedure* to the *propensity*. The significance test procedure itself (p-value, α) is purely frequentist. It tells us about the propensity of the *experimental procedure* to produce certain data *if H₀ were true*, not directly about the propensity of the *system under study*. The institutional interpretation jumps from the procedural propensity to the system propensity without a clear bridge. Propensity theories often struggle to connect single-case propensities to the actual statistical inference machinery used.

  **Preregistration: The Hybrid Motive**
  *   **Strict Presupposition (Frequentist):** Preregistration is *strictly presupposed* by the frequentist interpretation. It defines the fixed, repeatable procedure whose long-run error properties are guaranteed by the significance test logic. Without it, p-values lose their defined frequentist meaning.
  *   **Motivation & Appeal (Hybrid/Bayesian):** The *desire* for preregistration often stems from wanting *legitimate evidence about hypotheses* - a Bayesian/subjectivist concern about avoiding biased, inflated evidence. Researchers/journal reviewers intuitively want the SS result to genuinely mean Hₐ is *likely true for this case*, and preregistration aims to make the low p-value more "trustworthy" as evidence *for the hypothesis*. This blends the frequentist procedure with a subjectivist goal.

  **Rebuilding on Bayesianism: Required Changes**
  If the institution adopted a "straightforwardly Bayesian view":
  1.  **Reported Quantities:** P-values and "significance" would be replaced or supplemented by:
      *   **Posterior Probabilities:** P(Hₐ | data) or P(H₀ | data).
      *   **Bayes Factors:** Quantifying the relative evidence for Hₐ vs. H₀ provided by the data (BF₁₀ = P(data | Hₐ) / P(data | H₀)).
      *   **Credible Intervals:** Interpreted as ranges containing the parameter with a specified probability (e.g., 95%), given the data and prior.
  2.  **Evidence of an Effect:** Evidence would be inherently *graded* (strength of Bayes Factor, height of posterior) rather than *binary* (SS/NS). The concept of "statistical significance" would disappear. Evidence would always be presented relative to explicit or default priors.
  3.  **Experimental Design:** While good design principles remain, the focus would shift:
      *   **Power:** Would be less central than in frequentism (where controlling β is crucial), though designing to achieve informative Bayes Factors (e.g., minimizing expected posterior variance) is important.
      *   **Prior Specification:** A crucial design element. Researchers would need to justify their prior distributions for parameters (e.g., skeptical, enthusiastic, neutral, informed by previous data). Sensitivity analyses to different priors would be standard. Preregistration would likely include preregistering priors.
  4.  **Institutional Norms & Consumption:**
      *   **Null Results Valuable:** NS results would be inherently valuable if they meaningfully *decrease* P(Hₐ | data) or yield a Bayes Factor favoring H₀, especially if the prior was skeptical or informative. The file drawer problem would be mitigated.
      *   **Reduced Publication Bias:** Journals would value well-conducted studies showing convincing evidence *for either Hₐ or H₀*, or quantified uncertainty, eliminating the overwhelming bias for SS results.
      *   **Focus on Evidence Accumulation:** Single studies would be seen as incrementally updating beliefs. Meta-analysis would naturally combine posteriors or Bayes Factors.
      *   **Preregistration Role:** Would still be vital for preventing bias (e.g., HARKing - Hypothesizing After Results are Known, p-hacking) that inflates Bayes Factors just as it inflates p-values. Its role in defining a *fixed procedure* for frequentist error rates becomes secondary.

  **Conclusion:**
  The institutional practice of significance testing is fundamentally **frequentist in its procedural design and calibration** (α controls long-run FPR under H₀, preregistration defines the procedure). However, the **interpretation and consumption** of the results ("effect is real") is fundamentally **subjectivist/Bayesian**, desiring a probability statement about the hypothesis itself. This creates the core tension and misinterpretation (treating P(data | H₀) as P(H₀ | data)). **Propensity** underlies the motivation but doesn't directly license the inference procedure.

  The practice strictly **presupposes frequentism** for the validity of the procedure and the meaning of α. It **fits well with subjectivism** in its *goal* of assessing hypotheses but **breaks down** with subjectivism because it doesn't produce the necessary quantities (posteriors, Bayes Factors) and ignores priors. Preregistration is **strictly presupposed by frequentism** but **motivated by a hybrid desire** for procedural legitimacy *in order to* make the resulting evidence about hypotheses seem more credible, bridging the gap imperfectly.

  Shifting to Bayesianism would require replacing p-values and significance declarations with posterior probabilities or Bayes Factors, incorporating priors explicitly, eliminating the binary SS/NS distinction, and fundamentally reforming publication incentives to value quantified evidence regardless of direction. Preregistration would remain crucial for bias prevention but lose its role as the sole definer of a procedure for frequentist error control. The core shift is from asking "Is the data surprising if nothing is happening?" to asking "How much should we believe something is happening, given this data and our prior knowledge?"
