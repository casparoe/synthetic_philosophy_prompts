  I should explain where the friend's points are correct and where they might be overstated. The epistemic and transformative aspects are solid, but the uselessness of testimony and complete breakdown of decision theory are too strong. Testimonies can offer insights into structural changes, even if not the subjective feel. Also, while standard utility calculations fail, other factors like current values, risk tolerance, and available information can still inform a decision. The "leap" conclusion isn't the only option; one can use proxies or incremental approaches.

