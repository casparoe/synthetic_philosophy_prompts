  Okay, let's tackle this query. The user is teaching a grad seminar on the epistemology of testimony, specifically the moral testimony problem. They need a clear list of desiderata that any theory must meet, along with cases illustrating each. They mention three camps: expertise, perception, and skill models. Key issues include safety, moral progress, and moral error.

  First, I recall the core debates in moral testimony. The main challenge is explaining why deferring to moral experts seems problematic compared to scientific experts. Each camp has strengths and weaknesses. The expertise model handles moral progress well but struggles with responsibility. Perception explains phenomenology but not error or progress. Skill captures moral agency but might not handle deference cases.

  The user wants desiderata covering all three camps. Let me list the essential requirements. Start with the anti-deference intuition: why is blind trust in moral testimony troubling? Cases like trusting an expert on abortion without understanding. This is a genuine requirement tied to moral agency. Then, the possibility of justified moral testimony use. Real cases exist, like deferring to parents or doctors on complex issues. Both are necessary.

  Next, the safety condition for knowledge. Moral beliefs mustn't be easily wrong in similar situations. The perception model struggles here if moral facts aren't objective. Moral progress is another key point. How does society improve morally over time if knowledge is perceptual? The expertise model fits best here. Moral error is problematic for perception; if it's like seeing, why frequent mistakes? Skill links errors to incompetence.

  The authority justification problem: why can't we cite experts as reasons? This targets expertise models. Responsibility preservation is crucial too—deferring shouldn't absolve one of blame. Phenomenology: moral judgments feel perception-like, which challenges inferential models. Symmetry with non-moral testimony: why treat morality differently? This questions anti-deference views.

  I consider which desideratum is most exclusionary. Anti-deference is central, as it rules out pure expertise models. Tensions exist between anti-deference and moral progress—progress often relies on experts, yet deference feels problematic. Also, phenomenology vs. moral error: if morals are perceived, why so many errors?

  Now, scoring the camps. Expertise scores high on progress, safety (if objective), and testimony use but low on anti-deference, authority justification, and responsibility. Perception is strong on phenomenology and symmetry but weak on progress, error, and safety. Skill does well on responsibility, phenomenology, and error but struggles with progress and testimony use.

  The user also wants the biggest tension and the most critical desideratum. Anti-deference vs. moral progress is the hardest pair. Anti-deference does the most work, as it directly challenges expertise models. Highlighting these helps students see why no theory satisfies all desiderata easily.
answer: |-
  ## Desiderata for a Theory of Moral Testimony: A Framework for Evaluation

  An adequate theory of moral testimony must navigate a complex web of intuitions, epistemic constraints, and metaethical commitments. Below is a comprehensive list of desiderata derived from core problems, cases, and theoretical pressures. Each is categorized by its source case/consideration and its status (genuine requirement vs. contested intuition/prejudice). Following the list is an analysis of key tensions and a comparative scorecard for the three prominent camps.

  **The Core Desiderata:**

  1.  **The Anti-Deference Intuition (ADI):** *Requirement:* Explain why *blind* deference to moral testimony seems epistemically or morally problematic (e.g., lacking understanding, compromising agency), even if the testifier is reliable. *Case:* "Should I just trust the moral philosopher on abortion?" (Trusting an expert without engaging with the reasoning feels deficient). *Status:* **Genuine Requirement** (though its *strength* and *basis* are hotly contested). Central challenge for Expertise models.
  2.  **The Possibility of Justified Moral Testimony Use (PJMTU):** *Requirement:* Explain how and when moral testimony *can* be a legitimate source of justified belief or knowledge. *Case:* A child trusting their parent that lying is wrong; a layperson deferring to a doctor on complex medical ethics. *Status:* **Genuine Requirement.** Challenges strong versions of Perception/Skill models that make testimony inherently deficient.
  3.  **The Safety Condition (SC):** *Requirement:* Moral knowledge acquired via testimony must satisfy the Safety condition (in nearby possible worlds where S forms the belief the same way, S does not believe falsely). *Case:* Trusting a seemingly reliable "expert" who is actually a skilled manipulator in a nearby world; relying on testimony based on flawed cultural norms that easily could have been dominant. *Status:* **Genuine Requirement** (standard epistemic constraint on knowledge).
  4.  **Moral Progress (MP):** *Requirement:* Account for how moral knowledge *improves over time* (e.g., abolition, suffrage) if core sources (perception, skill) are individual and non-inferential. *Case:* Explaining how society moved from widespread acceptance of slavery to its condemnation. *Status:* **Genuine Requirement.** Major challenge for Perception models; Expertise models handle this best.
  5.  **Moral Error (ME):** *Requirement:* Explain the possibility and prevalence of widespread moral error (individual and societal). *Case:* Historical acceptance of practices now deemed morally abhorrent; individuals making sincere but deeply mistaken moral judgments. *Status:* **Genuine Requirement.** Significant challenge for Perception models (if perception is direct, why frequent error?) and sometimes Skill (if skill reliably tracks truth, why pervasive mistakes?).
  6.  **The Authority Justification Problem (AJP):** *Requirement:* Explain why citing an authority ("Because the expert said so") seems insufficient as a *moral justification* for an action, even if it provides epistemic justification for the belief. *Case:* "My guru said stealing is ok here, so I did it." *Status:* **Contested Intuition/Requirement.** Often seen as a consequence of ADI. Strongly pressed by Skill/Perception camps against Expertise.
  7.  **Responsibility Preservation (RP):** *Requirement:* Ensure that agents remain morally responsible for actions based on testimonial beliefs. Deference shouldn't automatically absolve. *Case:* "Does deferring to a moral expert make me less responsible for my action based on their advice?" (e.g., following orders). *Status:* **Genuine Requirement.** Closely linked to ADI and AJP. Expertise models struggle; Skill models emphasize.
  8.  **Phenomenological Fidelity (PF):** *Requirement:* Cohere with the first-person phenomenology of moral judgment (often described as perception-like or intuition-driven). *Case:* The feeling of "seeing" that an act is cruel or kind. *Status:* **Contested Intuition.** Central commitment of Perception models; Expertise/Skill models need to accommodate or explain away.
  9.  **Symmetry with Non-Moral Testimony (SNMT):** *Requirement:* Avoid ad hoc explanations for why moral testimony is uniquely problematic compared to testimony about history, science, or mundane facts. *Case:* Why is trusting a physicist on quantum mechanics epistemically fine, but trusting an ethicist on abortion allegedly problematic? *Status:* **Contested Intuition/Requirement.** Pressed strongly by Expertise camp against ADI proponents.
  10. **Integration with Moral Agency (IMA):** *Requirement:* Account for the role of testimony in the development and exercise of moral agency (learning, refining judgment, challenging biases). *Case:* How novices become competent moral agents; how testimony sparks moral reflection. *Status:* **Genuine Requirement.** Skill models often excel here.

  **Key Analysis:**

  *   **Most Exclusionary Desideratum:** **The Anti-Deference Intuition (ADI).** This is the core puzzle driving the entire debate. Theories that cannot explain ADI (like naive Expertise models) are immediately suspect, while those that cannot accommodate PJMTU (like strong Perception/Skill models) are also inadequate. ADI forces a departure from simple models of testimonial knowledge.
  *   **Tension Most Likely Irreconcilable:** **Anti-Deference Intuition (ADI) vs. Moral Progress (MP).** Explaining societal MP seemingly *requires* mechanisms for accumulating and transmitting moral knowledge beyond individual perception/skill – pointing towards expertise and deference. Yet ADI insists such deference is fundamentally deficient. Resolving this tension (e.g., via nuanced accounts of expertise, understanding, or the role of testimony in skill development) is the Holy Grail. **Phenomenological Fidelity (PF) vs. Moral Error (ME)** is also a major tension for Perception models.
  *   **Safety (SC) & Moral Error (ME):** These are fundamental epistemic requirements any theory must meet. Failure here is fatal. SC pressures towards objectivity/reliability; ME pressures against simplistic infallibilism about core sources.

  **Scorecard: Evaluating the Camps**

  | Desideratum          | Expertise Model                                                    | Perception Model                                                    | Skill Model                                                         |
  | :------------------- | :----------------------------------------------------------------- | :------------------------------------------------------------------ | :------------------------------------------------------------------ |
  | **1. ADI**           | **--** (Struggles deeply; risks ignoring it)                       | **+** (Explains via lack of direct "seeing")                        | **+** (Explains via lack of developed skill/understanding)          |
  | **2. PJMTU**         | **++** (Core strength; testimony is primary source)                | **-** (Testimony inherently deficient; non-inferential basis)       | **~** (Limited role; testimony aids practice, not core knowledge?)  |
  | **3. SC**            | **+** (Possible if experts track objective truth reliably)         | **~** (Depends on objectivism & reliability of "faculty")           | **~** (Depends on skill reliably tracking truth)                    |
  | **4. MP**            | **++** (Naturally explains via expert consensus/knowledge growth) | **--** (Deep problem; individual perception doesn't aggregate well) | **-** (Skill development is individual; societal progress unclear)  |
  | **5. ME**            | **+** (Explains via expert error/ignorance)                        | **--** (Major problem; why does "perception" err systematically?)   | **+** (Explains via lack of skill/incompetence/corruption)          |
  | **6. AJP**           | **-** (Struggles; "expert said so" *is* the justification)         | **+** (Only direct "seeing" provides justification)                 | **+** (Justification requires skilled grasp of reasons)             |
  | **7. RP**            | **-** (Deference risks diminishing responsibility)                 | **+** (Agent "sees" the wrongness)                                  | **++** (Action flows from developed skill/character)                |
  | **8. PF**            | **-** (Moral belief often seems inferential)                       | **++** (Directly captures phenomenology)                            | **+** (Skilled judgment can be immediate/intuitive)                 |
  | **9. SNMT**          | **++** (Treats moral testimony like other domains)                 | **-** (Requires special explanation for moral case)                 | **~** (Moral skill distinct, but asymmetry needs justification)     |
  | **10. IMA**          | **~** (Focuses on knowledge transmission)                          | **-** (Limited role for testimony in agency)                        | **++** (Testimony as training/feedback for skill development)       |
  | **Overall Plausibility** | **Moderate** (Strong on MP, PJMTU, SNMT; weak on ADI, AJP, RP) | **Low** (Strong on PF, ADI; weak on MP, ME, PJMTU, IMA)          | **Moderate-High** (Strong on ADI, AJP, RP, IMA, ME; moderate on others; weak on MP, PJMTU scope) |

  **Brief Commentary:**

  *   **Expertise:** Best handles **MP** and **PJMTU** but flounders on **ADI**, **AJP**, and **RP**, making it seem ethically shallow. Needs sophisticated account of understanding/agency.
  *   **Perception:** Captures **PF** and **ADI** intuitively but faces severe challenges with **MP** and **ME**, and struggles to accept **PJMTU** or fully integrate **IMA**. Requires robust account of error and social epistemology.
  *   **Skill:** Most promising for integrating **ADI**, **AJP**, **RP**, and **IMA**. Handles **ME** well. Its main challenges are explaining **MP** robustly and defining the precise scope/role of **PJMTU** within skill acquisition. Needs careful articulation of what "skill" entails epistemically.

  No camp satisfies all desiderata effortlessly. The Skill model currently offers the most balanced framework, but significant work remains, particularly on **MP** and the epistemology of skill-based testimony. The tension between **ADI** and **MP** remains the central theoretical knot. Use this framework to dissect student arguments and push them towards articulating *how* their favored theory tackles *each* of these pressures.
