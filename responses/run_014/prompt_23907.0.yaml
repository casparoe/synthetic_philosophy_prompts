prompt: |-
  I'm teaching a graduate seminar on the epistemology of testimony, and the moral testimony problem has come up repeatedly in student papers, and I've realized I can't articulate the full set of requirements a theory of moral testimony actually has to meet. I keep seeing people argue about it by pointing at one case — the "should I just trust the moral philosopher on abortion?" case, the "does deferring to a moral expert make me less responsible?" case, the "how do we explain moral progress?" case — and I'd like the full spec first.

  Write the desiderata: what any adequate theory of moral testimony has to be able to deliver. For each desideratum, give the case or consideration behind it, and mark whether it's a genuine requirement or a prejudice of one camp (e.g., the anti-authoritarianism intuition, the "ethics is not like science" objection). I want the list to cover at least the "ethics as expertise" camp (moral knowledge comes from experts, as in science), the "ethics as perception" camp (moral knowledge is non-inferential, like perception), and the "ethics as skill" camp (moral knowledge is a practical skill, like chess or medicine). I specifically want you to engage with the "safety" condition (moral knowledge requires that you wouldn't be wrong in nearby possible worlds), the "moral progress" problem (if moral knowledge only comes from perception or skill, how do we explain moral progress over time?), and the "moral error" problem for the ethics-as-perception camp (if moral knowledge is non-inferential, how do we explain moral error?). Tell me which single desideratum does the most work to exclude candidates, and flag any pair of desiderata you suspect can't be jointly satisfied. Then, briefly, score the three camps against the list.

  Respond in the style of an expert in the epistemology of testimony. Think very carefully before answering; this is for a seminar handout, so precision matters more than length. A table is fine for the scorecard.
