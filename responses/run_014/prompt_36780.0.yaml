  ### Adjudication of the Argument

  As a senior decision theorist, I will carefully re-derive all relevant calculations to evaluate each move in the exchange between Marco and Petra. The goal is to adjudicate based on the arguments as presented, without appealing to external authorities or literature. The focus is on the arithmetic and logical consistency of their points.

  #### Re-derivation of Key Quantities
  Before addressing the moves, I re-derive the expected payoffs, beliefs, and values to ensure accuracy.

  1. **Ex-ante expected payoff for policy "exit with probability \(p\) at each exit"**:
     - Probability exit at first exit: \(p\), payoff 1.
     - Probability continue at first and exit at second: \((1-p)p\), payoff 7.
     - Probability continue at both: \((1-p)^2\), payoff 2.
     - Expected payoff: \(E(p) = p \cdot 1 + (1-p)p \cdot 7 + (1-p)^2 \cdot 2\).
     - Simplify:
       \[
       E(p) = p + 7p(1-p) + 2(1-p)^2 = p + 7p - 7p^2 + 2(1 - 2p + p^2) = p + 7p - 7p^2 + 2 - 4p + 2p^2 = (4p) + (-5p^2) + 2
       \]
       \[
       E(p) = 4p - 5p^2 + 2
       \]
     - Maximize by derivative: \(\frac{dE}{dp} = 4 - 10p = 0\) → \(p = 0.4\).
     - At \(p = 0.4\): \(E(0.4) = 4(0.4) - 5(0.4)^2 + 2 = 1.6 - 5(0.16) + 2 = 1.6 - 0.8 + 2 = 2.8\).
     - Always exit (\(p = 1\)): \(E(1) = 4(1) - 5(1)^2 + 2 = 1\).
     - Always continue (\(p = 0\)): \(E(0) = 4(0) - 5(0)^2 + 2 = 2\).
     - **Conclusion**: The ex-ante optimal policy is \(p = 0.4\) with expected payoff 2.8.

  2. **Beliefs at an exit under policy \(p\)**:
     - The driver is at an exit but cannot distinguish which one. The probability depends on the policy.
     - Probability this is the first exit (\(P(\text{first})\)): Always visited, so expected number of first-exit visits is 1.
     - Probability this is the second exit (\(P(\text{second})\)): Visited only if continue at first, probability \(1-p\), so expected number is \(1-p\).
     - Expected number of exit visits: \(E[N] = P(\text{one visit}) \cdot 1 + P(\text{two visits}) \cdot 2\).
       - \(P(\text{one visit}) = P(\text{exit at first}) = p\).
       - \(P(\text{two visits}) = P(\text{continue at first}) = 1-p\).
       - \(E[N] = p \cdot 1 + (1-p) \cdot 2 = p + 2 - 2p = 2 - p\).
     - \(P(\text{first}) = \frac{\text{expected first visits}}{E[N]} = \frac{1}{2 - p}\).
     - \(P(\text{second}) = \frac{\text{expected second visits}}{E[N]} = \frac{1-p}{2 - p}\).
     - At \(p = 0.4\): \(P(\text{first}) = 1/(2 - 0.4) = 1/1.6 = 0.625 = 5/8\), \(P(\text{second}) = (1 - 0.4)/1.6 = 0.6/1.6 = 0.375 = 3/8\).

  3. **Expected value of actions at an exit under policy \(p\)**:
     - Let \(V\) be the expected value at an exit under policy \(p\).
     - Expected value of exiting (\(E_{\text{exit}}\)): \(P(\text{first}) \cdot 1 + P(\text{second}) \cdot 7\).
     - Expected value of continuing (\(E_{\text{continue}}\)): 
       - If first exit, go to second exit and receive \(V\) (same situation).
       - If second exit, continue and receive 2.
       - Thus, \(E_{\text{continue}} = P(\text{first}) \cdot V + P(\text{second}) \cdot 2\).
     - \(V\) must satisfy: \(V = p \cdot E_{\text{exit}} + (1-p) \cdot E_{\text{continue}}\).
     - With beliefs:
       \[
       E_{\text{exit}} = \frac{1}{2-p} \cdot 1 + \frac{1-p}{2-p} \cdot 7 = \frac{1 + 7(1-p)}{2-p} = \frac{8 - 7p}{2-p}
       \]
       \[
       E_{\text{continue}} = \frac{1}{2-p} \cdot V + \frac{1-p}{2-p} \cdot 2
       \]
       \[
       V = p \cdot \frac{8 - 7p}{2-p} + (1-p) \cdot \left( \frac{1}{2-p} \cdot V + \frac{1-p}{2-p} \cdot 2 \right)
       \]
     - Solving for \(V\):
       - Multiply through by \(2-p\):
         \[
         V(2-p) = p(8-7p) + (1-p)V + 2(1-p)^2
         \]
       - Expand:
         \[
         2V - pV = 8p - 7p^2 + V - pV + 2(1 - 2p + p^2) = 8p - 7p^2 + V - pV + 2 - 4p + 2p^2
         \]
         \[
         2V - pV = 4p - 5p^2 + 2 + V - pV
         \]
       - Simplify: \(2V - pV - V + pV = 4p - 5p^2 + 2\) → \(V = 4p - 5p^2 + 2\).
     - **Conclusion**: \(V = E(p)\), the ex-ante expected payoff. At \(p = 0.4\), \(V = 2.8\).

  4. **Consistency condition for ex-post rationality**:
     - For the driver to be indifferent at an exit (so randomization is rational), require \(E_{\text{exit}} = E_{\text{continue}}\).
     - Set \(E_{\text{exit}} = E_{\text{continue}} = Q\).
       \[
       \frac{8 - 7p}{2-p} = \frac{1}{2-p} \cdot Q + \frac{1-p}{2-p} \cdot 2
       \]
       - Multiply by \(2-p\):
         \[
         8 - 7p = Q + 2(1-p)
         \]
         \[
         8 - 7p = Q + 2 - 2p
         \]
         \[
         Q = 6 - 5p
         \]
     - Now, \(E_{\text{continue}} = P(\text{first}) Q + P(\text{second}) \cdot 2\).
       - Set equal to \(Q\):
         \[
         \frac{1}{2-p} Q + \frac{1-p}{2-p} \cdot 2 = Q
         \]
         \[
         Q \left( \frac{1}{2-p} - 1 \right) = - \frac{2(1-p)}{2-p}
         \]
         \[
         Q \left( \frac{1 - (2-p)}{2-p} \right) = - \frac{2(1-p)}{2-p}
         \]
         \[
         Q \left( \frac{p-1}{2-p} \right) = - \frac{2(1-p)}{2-p}
         \]
       - Since \(1-p = -(p-1)\):
         \[
         Q (p-1) = -2(1-p) = 2(p-1)
         \]
         \[
         Q (p-1) - 2(p-1) = 0
         \]
         \[
         (p-1)(Q - 2) = 0
         \]
       - For \(p \neq 1\), \(Q = 2\).
     - With \(Q = 2\), from \(Q = 6 - 5p\): \(2 = 6 - 5p\) → \(5p = 4\) → \(p = 0.8\).
     - At \(p = 0.8\):
       - \(P(\text{first}) = 1/(2-0.8) = 1/1.2 = 5/6\)? Wait, re-derive:
         \[
         P(\text{first}) = 1/(2-0.8) = 1/1.2 \approx 0.833, \quad P(\text{second}) = (1-0.8)/1.2 = 0.2/1.2 \approx 0.167
         \]
         But earlier: \(Q = 2\), \(E_{\text{exit}} = (8 - 7 \cdot 0.8)/(2 - 0.8) = (8 - 5.6)/1.2 = 2.4/1.2 = 2\), \(E_{\text{continue}} = P(\text{first}) \cdot 2 + P(\text{second}) \cdot 2 = 2 \cdot (P(\text{first}) + P(\text{second})) = 2 \cdot 1 = 2\).
       - Ex-ante payoff: \(E(0.8) = 4(0.8) - 5(0.8)^2 + 2 = 3.2 - 5(0.64) + 2 = 3.2 - 3.2 + 2 = 2\).
     - **Conclusion**: The only policy where actions tie at the exit is \(p = 0.8\), with expected payoff 2.

  #### Adjudication of Moves
  I evaluate each move on a scale from "clearly mistaken" to "clearly right," with justifications based on recalculations.

  1. **Marco (1):**  
     "So it's settled. The optimal policy is: at whichever exit you are, exit with probability 2/5. The rational driver at an exit opens the app, draws a number, and exits iff it's below 0.4. That isn't indecision — it's the best plan, and the only executable rivals (exit always: 1; continue always: 2) are worse. Randomization isn't a vice of the plan; it is the plan."  
     - **Rating**: Partially correct but incomplete.  
     - **Justification**: Marco is correct that \(p = 0.4\) is ex-ante optimal (payoff 2.8) and that pure asymmetric policies are impossible due to indistinguishability. However, he ignores the ex-post perspective: at an exit, under \(p = 0.4\), the expected value of exiting (3.25) exceeds that of continuing (2.5), so the driver would not rationally randomize; they would prefer to exit for sure. Thus, the policy is not stable "from inside," as Petra argues.

  2. **Petra (2):**  
     "The arithmetic is fine, but you answered a different question. You answered 'which policy is best, considered from the start?' The driver isn't at the start; he's at an exit, choosing between two acts. Exit now is worth 1 if this is the first town and 7 if it's the second. Continuing is worth — well, that's the question. But whatever the numbers, an agent who can rank two acts takes the better one: by linearity, mixing two acts of unequal expected value is strictly worse than the better act. So randomization is permissible only as a tie-breaker, and your 2/5 policy is justified at the wheel only if, at the wheel, the two acts tie. To even state the tie you need his probability that this is the first town — and you fixed that by consulting the policy itself. That's backwards: the policy is the thing up for evaluation, and his evidence at the exit is just 'I am at one of two indistinguishable exits.'"  
     - **Rating**: Clearly right.  
     - **Justification**: Petra correctly identifies that Marco's analysis is ex-ante, not ex-post. She is right that at the exit, the driver must choose based on current beliefs (which depend on the policy), and randomization is only rational if the acts tie. Her point that beliefs are determined by the policy (not fixed independently) is valid, and she correctly questions the justification of \(p = 0.4\) at the exit.

  3. **Marco (3):**  
     "Two replies. First, honor your dominance complaint concretely: name the pure act. 'Continue at the first town, exit at the second' scores 7 but is unexecutable — a policy is a function from information to action, and his information is identical at the two exits. So the executable policies are the constant ones and the mixed ones, and I optimized over all of them. Second, the beliefs aren't backwards. What he'll do determines which towns he visits: under 'exit always' he only ever sees the first town, so standing at an exit he could be sure it's the first; under 'continue always' he sees both, and by symmetry it's 50/50. His evidence therefore includes his own policy, and under my policy the right weights are 5/8 for the first town (one guaranteed visit) and 3/8 for the second (an expected 3/5 of a visit). With those weights: exiting at the wheel is worth (5/8)·1 + (3/8)·7 = 3.25. Continuing is worth (5/8)·[what my policy then yields at the next exit: 0.4·7 + 0.6·2 = 4] plus (3/8)·2 [if this was already the second town, driving to the end] — also 3.25. The acts tie exactly at the wheel. The die isn't choosing between ranked acts; it's breaking a genuine tie. The plan is stable from inside."  
     - **Rating**: First point clearly right; second point clearly mistaken.  
     - **Justification**: 
       - First point: Marco is correct that asymmetric pure policies (e.g., "continue at first, exit at second") are unexecutable because exits are indistinguishable. Only constant or mixed policies are feasible, and he optimized over these.
       - Second point: Marco correctly derives beliefs (\(P(\text{first}) = 5/8\), \(P(\text{second}) = 3/8\)) and \(E_{\text{exit}} = 3.25\) at \(p = 0.4\). However, he miscalculates \(E_{\text{continue}}\) by assuming that at the "next exit" (if this is the first), the driver knows it is the second and receives \(0.4 \cdot 7 + 0.6 \cdot 2 = 4\). But the driver cannot know it is the second exit; they face the same situation, so the value should be \(V = 2.8\) (as re-derived), not 4. Correctly, \(E_{\text{continue}} = (5/8) \cdot V + (3/8) \cdot 2 = (5/8)(2.8) + (3/8)(2) = 1.75 + 0.75 = 2.5 \neq 3.25\). Thus, the acts do not tie, and the plan is not stable.

  4. **Petra (4):**  
     "Look at what you did in the middle of that calculation. To score continuing past the first town, you credited the driver with 'what my policy yields at the next exit': 4. But when he arrives at that next exit he will not know it is the second town — he'll be in exactly the situation he's in now. If the policy is to be justified from inside, which was my whole demand, the value of continuing must be the value of that situation, call it V — not the terminal payoff of a randomization he'd execute while somehow knowing where he is. Score it honestly: continuing is worth (5/8)·V + (3/8)·2, while exiting is worth 3.25. Unless V is well below 3.25, continuing loses at the wheel, and your driver would scrap the policy rather than roll the die. Solve for the V at which the acts tie and you'll find the stable policy has to exit more often than 2/5. I suspect it pays less than 2.8 — possibly no more than the 2 he'd get by never exiting at all — but we ran out of meeting before I finished the algebra."  
     - **Rating**: Clearly right.  
     - **Justification**: Petra correctly identifies Marco's error in \(E_{\text{continue}}\) and insists on using \(V\) (the value at an exit) for consistency. She conjectures that the stable policy requires higher \(p\) and lower payoff. Re-derivation confirms: the only consistent policy has \(p = 0.8\) (exiting more often than 0.4) with payoff 2, which is less than 2.8 and equal to "never exit." Her algebra is correct: solving for indifference yields \(p = 0.8\), \(V = 2\).

  5. **Marco (5):**  
     "Then finish it. You keep announcing suspicions. If there's an instability in my plan, exhibit it: give me the numbers under your scoring. Otherwise the only complete calculation on the table is mine, and it says the plan is exactly as advisable from the wheel as from the driveway."  
     - **Rating**: Mistaken.  
     - **Justification**: Marco challenges Petra to complete the calculation, but his own "complete calculation" is flawed (as shown). Petra's suspicion is valid, and the numbers under consistent scoring (using \(V\)) show instability: at \(p = 0.4\), \(E_{\text{exit}} = 3.25 > E_{\text{continue}} = 2.5\), so the driver would deviate from randomization to exiting for sure. The consistent policy (\(p = 0.8\)) has lower payoff (2), refuting Marco's claim that the plan is stable from the wheel.

  #### Resolution of the Argument
  - **Who is right about which points?**
    - Marco is right that:
      - \(p = 0.4\) is ex-ante optimal (payoff 2.8).
      - Pure asymmetric policies are unexecutable.
    - Petra is right that:
      - From the exit perspective, randomization is only rational if acts tie.
      - Beliefs must be consistent with the policy, and under \(p = 0.4\), the acts do not tie at the exit.
      - Marco's calculation of \(E_{\text{continue}}\) is incorrect (should use \(V\), not terminal payoff).
      - The stable (ex-post rational) policy has \(p = 0.8\) with payoff 2.
      - This stable policy exits more often than \(2/5\) and pays less than 2.8 (specifically, 2).
  - **Is Petra's conjecture in (4) true?**  
    Yes. The stable policy requires \(p = 0.8 > 0.4\), and it pays 2, which is less than 2.8 and no more than the payoff of never exiting (which is 2).
  - **Under which way of scoring "the value of continuing"?**  
    Petra's scoring is correct: the value of continuing must be based on \(V\), the expected value at the next exit (which is identical to the current situation), not on the terminal payoff assuming knowledge of which exit it is. This is required for consistency in the decision process.
  - **Is any part of the disagreement merely verbal?**  
    No. The disagreement is substantive: Marco focuses on ex-ante optimization (planning), while Petra focuses on ex-post rationality (action at the exit). These perspectives lead to different policies (\(p = 0.4\) vs. \(p = 0.8\)) and payoffs (2.8 vs. 2). The core issue is whether a policy must be rational when executed, not just when planned.
  - **What, if anything, are both missing?**  
    Both might miss that the problem highlights a tension between commitment and time consistency:
    - If the driver can commit to a policy from the start, \(p = 0.4\) is best.
    - Without commitment, the driver at the exit must choose based on current incentives, leading to \(p = 0.8\) and lower payoff.
    - Neither explicitly discusses commitment, but Petra's insistence on ex-post rationality implies its absence.

  #### Final Judgment
  Petra wins the argument: her critique of Marco's policy is correct, and her conjecture about the stable policy is validated. Marco's policy is ex-ante optimal but not ex-post rational; the driver would deviate from it at the exit. The consistent policy yields a lower payoff, illustrating the impact of absent-mindedness on decision-making.
