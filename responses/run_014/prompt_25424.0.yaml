prompt: |-
  I keep seeing this same argument structure everywhere and I'm starting to think it's a named thing in philosophy, but I don't know what to call it.

  Here's the pattern. There's a debate about whether X should be illegal. X is something like: a weird sex act between consenting adults, or selling a drug, or paying someone to be a surrogate mother, or assisted suicide. One side says: this is immoral, it's degrading, it violates the community's values, and that's enough — the law should reflect our shared morality. The other side says: who's the victim here? If everyone involved is consenting and nobody else gets hurt, the law has no business interfering.

  What I've noticed is that these two sides aren't just disagreeing about whether X is harmful. They disagree about what counts as a legitimate reason to criminalize something in the first place. The first side thinks "it's wrong" is a complete justification. The second side thinks you need to point to a specific harm to a specific person.

  I see this split in debates about prostitution, gambling, drug laws, blasphemy, what you can put on TV, even zoning laws sometimes. It doesn't map neatly onto left and right — I've seen people on both sides of the political spectrum take each position depending on the issue.

  So my questions: does this fault line have an established name in philosophy? I'm not just after a label — I want to know if this is one debate or a cluster of related ones, what the strongest formulations of each side are, and whether there are intermedate positions I'm glossing over. Also, I've noticed that sometimes the "harm" side stretches the concept of harm until it swallows everything (like "it harms the moral climate of society") and at that point I can't tell whether they've actually abandonned their own principle. Is that move itself a recognized thing?
reasoning: |-
  Okay, the user is noticing a recurring pattern in debates about whether certain activities should be illegal. They've observed two main arguments: one side says something is immoral and should be illegal for that reason alone, while the other insists that without a clear victim or direct harm, it shouldn't be criminalized. The user wants to know if this is a named philosophical concept, the key points of each side, and whether there are intermediate positions.

  First, I recall that this is a classic debate in legal philosophy. The main conflict here is between legal moralism and the harm principle. The user mentioned examples like prostitution, drug use, and assisted suicide, which align with the Hart-Devlin debate. Lord Devlin argued that society has the right to enforce morality to preserve social cohesion, while H.L.A. Hart countered with the harm principle, emphasizing individual liberty unless harm occurs.

  The user also pointed out that the harm principle can be stretched to include vague harms like "moral climate." That's a valid observation. Philosophers like Joel Feinberg addressed this by distinguishing between harm and offense, and hard vs. soft paternalism. The user might be interested in these nuances to understand how the harm principle can be applied without becoming too broad.

  Another aspect is intermediate positions. The user mentioned that the debate doesn't split neatly along political lines, so explaining how different issues might invoke different principles could be helpful. For instance, legal paternalism allows restrictions to prevent self-harm, which sits between the two extremes.

  The user's deeper need seems to be understanding the structure of these arguments to better analyze real-world debates. They might be looking for frameworks to categorize positions and recognize when concepts like harm are being overextended. Highlighting Feinberg's work on the limits of the harm principle and the offense principle could address their concern about "harm" becoming all-encompassing.

  Also, considering the user's examples, linking the theories to specific cases like zoning laws or blasphemy would make it concrete. Explaining how moralism applies in communal standards versus individual rights in such contexts would clarify the application.

  Finally, summarizing the key philosophers and their contributions (Mill, Devlin, Feinberg) provides the user with references for further exploration. Emphasizing that the debate is ongoing and context-dependent acknowledges the complexity they've observed.
answer: |-
  That's an incredibly sharp observation — you've identified one of the deepest and most persistent fault lines in legal and political philosophy. This isn't just *a* debate; it's arguably **the** core debate about the legitimate scope of state power and criminal law. Here's a breakdown:

  1.  **The Core Conflict: Legal Moralism vs. The Harm Principle (Liberty Principle)**
      *   **Side 1 (It's wrong, therefore it should be illegal):** This is **Legal Moralism**. Its core tenet is that the state *is* justified in using the criminal law to enforce the community's shared morality, even in the absence of direct, tangible harm to non-consenting others. Preventing "immorality" or upholding "public morality" is seen as a legitimate end in itself for the law.
      *   **Side 2 (No victim, no crime):** This is rooted in **The Harm Principle**, most famously articulated by **John Stuart Mill** in *On Liberty* (1859): "*The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others.*" Actions causing purely self-regarding harm, or mere offense, or that are simply "immoral" without causing harm to non-consenting parties, are outside the legitimate scope of criminal prohibition.

  2.  **The Famous Debate: Hart vs. Devlin**
      This clash crystallized in the mid-20th century following the UK's Wolfenden Report (1957), which recommended decriminalizing homosexual acts between consenting adults in private.
      *   **Lord Patrick Devlin:** Argued forcefully for **Legal Moralism**. His key points:
          *   Society is held together by a shared morality (a "public morality").
          *   The destruction of this shared morality would destroy society itself.
          *   Therefore, society has a *right* to use the law to protect its essential moral fabric, just as it protects its physical existence. He famously asked if society could tolerate unlimited "vice" without collapsing.
          *   He argued that widespread disgust or "intolerance, indignation, and disgust" felt by the "reasonable man" towards certain acts was evidence that they threatened the social bond.
      *   **H.L.A. Hart:** Defended a **liberal interpretation of the Harm Principle** against Devlin:
          *   Rejected the idea that society would collapse without legal enforcement of morality. Societies are more robust and adaptable than that.
          *   Argued that using the law to enforce morality based on mere disgust or intolerance is illiberal and infringes on individual autonomy and privacy.
          *   Emphasized Mill's distinction: Law should focus on preventing harm to others, not enforcing virtue or preventing "sin" for its own sake.
          *   Pointed out the difficulty, arbitrariness, and potential tyranny of defining *which* morals should be enforced.

  3.  **Nuances, Intermediate Positions, and Complications:**
      *   **Paternalism:** What about laws preventing people from harming *themselves* (e.g., seatbelt laws, prohibitions on certain drugs)? **Legal Paternalism** argues the state can sometimes restrict liberty to prevent individuals from causing severe harm to themselves. This sits uneasily between the two poles. **Soft Paternalism** only intervenes when the person's choice isn't truly voluntary or informed (e.g., protecting addicts, the mentally ill). **Hard Paternalism** overrides even voluntary choices deemed too harmful.
      *   **The Offense Principle:** Joel Feinberg, in his monumental work *The Moral Limits of the Criminal Law*, argued that while the Harm Principle is primary, preventing *serious offense* (beyond mere dislike or hurt feelings) to unwilling audiences in public spaces can *also* be a legitimate basis for *some* regulation (e.g., public indecency laws, restrictions on extremely loud noise). This is distinct from enforcing morality *per se*.
      *   **"Harm to Society" / "Moral Climate":** This is **exactly the move you identified**, and it's highly contentious.
          *   **Legal Moralists** use it: They argue that widespread "immoral" acts, even if private and consensual, *do* cause harm by eroding shared values, damaging the moral character of citizens, degrading the social fabric, or creating a "climate" that enables worse harms. (e.g., "Legalizing prostitution harms society by commodifying intimacy and normalizing exploitation," or "Widespread drug use creates a culture of irresponsibility.")
          *   **Harm Principle Defenders** see this as **conceptual stretching** or even **smuggling in moralism**: They argue:
              *   It's vague and difficult to prove empirically.
              *   It risks defining *any* disliked behavior as "harmful to society" simply because it violates a majority's moral code.
              *   It potentially justifies prohibiting *any* minority practice the majority finds offensive or morally objectionable.
              *   It undermines the core purpose of the Harm Principle – to protect individuals from *tangible* interference with their rights and interests by others. Feinberg called this the "collapse into moralism."
          *   **Is it abandoning the principle?** In its pure form, yes. If "harm" is defined solely as "violating the community's moral code," then the Harm Principle becomes indistinguishable from Legal Moralism. The key distinction is whether "harm to society" points to *demonstrable, concrete negative consequences* (e.g., increased crime, breakdown of families impacting children, public health crises) beyond just the *existence* of the disapproved act itself. The line is incredibly blurry.
      *   **Perfectionism vs. Anti-Perfectionism:**
          *   **Perfectionism:** The state *should* promote specific conceptions of the good life or human flourishing through law (which could include enforcing certain moral norms seen as essential to flourishing). This aligns with Legal Moralism.
          *   **Anti-Perfectionism:** The state should remain neutral between different conceptions of the good life; its role is to secure fair conditions for individuals to pursue their *own* visions, not to promote one particular vision. This aligns with the Harm Principle/Liberty Principle.

  4.  **Why it Doesn't Map Neatly to Left/Right:**
      *   **Traditional Conservatives:** Often lean towards Legal Moralism on issues like sexuality, drugs, family structure, and public order.
      *   **Classical Liberals/Libertarians:** Strongly favor the Harm Principle across the board (drugs, gambling, sex work, etc.).
      *   **Modern Progressives:** Often favor the Harm Principle for issues like drug use, sex work, and assisted suicide (emphasizing autonomy, consent, and lack of victim). However, they may lean towards Legal Moralism (or the Offense Principle) on issues like hate speech, some forms of pornography, or environmental regulations, framing these as causing harm (e.g., harm to marginalized groups, harm to the environment for future generations). They might also support paternalistic regulations for consumer protection or public health.
      *   **Communitarians:** Emphasize the importance of shared values and social cohesion, often sympathetic to weaker forms of Legal Moralism or arguments about the "social fabric."

  **In Summary:**

  *   **The Core Names:** **Legal Moralism vs. The Harm Principle (Millian Principle/Liberty Principle)**.
  *   **The Seminal Debate:** **Hart-Devlin Debate**.
  *   **The Stretching of "Harm":** This is a central tactic in the debate. Legal Moralists stretch "harm" to encompass societal/moral decay. Harm Principle defenders argue this stretches the concept beyond recognition and collapses back into pure moralism. Feinberg's work is key here for analyzing the limits.
  *   **Intermediate Positions:** **Legal Paternalism** (especially soft paternalism), **The Offense Principle** (Feinberg), **Perfectionism/Anti-Perfectionism**.
  *   **It's One Big Debate:** While applied to countless specific issues, the underlying philosophical question – *What justifies criminalizing an act? Is it preventing harm to others, or can it be enforcing morality?* – is a single, fundamental tension in liberal democratic theory. The specific application depends on how "harm," "offense," "morality," "consent," and "society" are defined in each context.

  You've hit on the bedrock question of political legitimacy: When can the state justifiably use its coercive power against its own citizens? The tension between individual liberty and social order/morality is perennial and unlikely to be fully resolved.
