reasoning: |-
  We are going to create a practice exam question about Simpson's Paradox using an esports example.
   The scenario: Two teams, Falcons and Owls, play on two types of maps: easy and hard.
   The data:
     - Falcons: 
          Easy map: 9 wins out of 10 games (so 9/10 = 0.9)
          Hard map: 27 wins out of 90 games (27/90 = 0.3)
     - Owls:
          Easy map: 80 wins out of 90 games (80/90 ≈ 0.8889)
          Hard map: 2 wins out of 10 games (2/10 = 0.2)

   We see:
     - On easy maps: Falcons (90%) > Owls (88.89%) -> Falcons have a higher win rate on easy.
     - On hard maps: Falcons (30%) > Owls (20%) -> Falcons have a higher win rate on hard.

   But overall:
     Falcons total wins = 9 + 27 = 36, total games = 10 + 90 = 100 -> overall win rate = 36%
     Owls total wins = 80 + 2 = 82, total games = 90 + 10 = 100 -> overall win rate = 82%

   So, Falcons win on each map type but lose overall.

   The paradox arises because the two teams played a different mix of map types.

   Now, we design a 10-mark question.

   Question (15 minutes, worth 10 marks):

   In the Esports League, two teams, the Falcons and the Owls, competed in two types of maps: Easy and Hard. 
   The win records for each team on each map type are given below:

     | Team    | Map Type | Wins | Total Games |
     |---------|----------|------|-------------|
     | Falcons | Easy     | 9    | 10          |
     | Falcons | Hard     | 27   | 90          |
     | Owls    | Easy     | 80   | 90          |
     | Owls    | Hard     | 2    | 10          |

   (a) Calculate the win rate (as a percentage) for each team on each map type and for each team overall. 
       [3 marks]

   (b) Based on your calculations in part (a), which team performed better on easy maps? Which team performed 
       better on hard maps? Which team had a higher overall win rate? [2 marks]

   (c) Explain why the result in (b) seems paradoxical. What is this phenomenon called? [2 marks]

   (d) Resolve the paradox by explaining the underlying cause. In your explanation, be sure to discuss the 
       distribution of games played by each team across the two map types. [3 marks]

   Model Answer:

   (a) 
     Falcons:
        Easy map: 9/10 = 0.9 -> 90%
        Hard map: 27/90 = 0.3 -> 30%
        Overall: (9+27)/(10+90) = 36/100 = 0.36 -> 36%

     Owls:
        Easy map: 80/90 ≈ 0.8889 -> 88.89% (or 88.9% if rounded to one decimal place)
        Hard map: 2/10 = 0.2 -> 20%
        Overall: (80+2)/(90+10) = 82/100 = 0.82 -> 82%

   (b)
     - On easy maps: Falcons (90%) > Owls (88.89%) -> Falcons performed better.
     - On hard maps: Falcons (30%) > Owls (20%) -> Falcons performed better.
     - Overall: Owls (82%) > Falcons (36%) -> Owls had a higher overall win rate.

   (c)
     The result is paradoxical because the Falcons have a higher win rate on both types of maps, 
     yet the Owls have a higher overall win rate. This phenomenon is known as Simpson's Paradox.

   (d)
     The paradox occurs because the two teams played a very different number of games on the two map types.

     Specifically:
       - The Falcons played mostly on hard maps (90 out of 100 games) where win rates are lower for both teams.
       - The Owls played mostly on easy maps (90 out of 100 games) where win rates are higher.

     Even though the Falcons did better on both map types, they played the majority of their games on the map type 
     where they (and the Owls) have a lower win rate. The Owls, on the other hand, played the majority of their games 
     on the map type where both teams have a higher win rate.

     This imbalance in the distribution of games (or weighting) causes the overall win rate to be lower for the Falcons 
     and higher for the Owls.

     In essence, the overall win rate is a weighted average of the win rates on each map type, and the weights (number 
     of games) are very different for the two teams.

   Marking Scheme (out of 10 marks):

   Part (a): 3 marks
     - Falcons easy: 90% (1 mark)
     - Falcons hard: 30% (1 mark)
     - Falcons overall: 36% (0.5 marks) and Owls overall: 82% (0.5 marks) [Note: Owls overall is 82% and must be calculated correctly]

     Alternatively, if broken down by team:
       Falcons: 
          easy: 9/10 = 0.9 (or 90%) -> 0.5 marks
          hard: 27/90 = 0.3 (or 30%) -> 0.5 marks
          overall: 36/100 = 0.36 -> 0.5 marks
       Owls:
          easy: 80/90 ≈ 0.8889 (or 88.89%) -> 0.5 marks
          hard: 2/10 = 0.2 (or 20%) -> 0.5 marks
          overall: 82/100 = 0.82 -> 0.5 marks

     But note: the question asks for each team on each map type and overall. So we need both teams and both map types and overall.

     Total for (a): 3 marks.

   Part (b): 2 marks
     - Falcons better on easy: 0.5 marks
     - Falcons better on hard: 0.5 marks
     - Owls better overall: 1 mark

   Part (c): 2 marks
     - Recognizing the paradox: Falcons win on both but lose overall (1 mark)
     - Naming the phenomenon: Simpson's Paradox (1 mark)

   Part (d): 3 marks
     - Mentioning the different distribution of games (Falcons played more hard maps, Owls played more easy maps) (1 mark)
     - Explaining that the overall win rate is a weighted average and the weights (number of games) are different (1 mark)
     - Connecting the weights to the win rates: Falcons played more on the map where win rates are low, Owls on the map where win rates are high (1 mark)

   Common mistakes and deductions:

     - Base rate fallacy: If a student confuses this with base rates, they might talk about the overall win rates without 
       considering the map distribution. They might not break down by map type. This would lose marks in part (d) and also in (b) and (c).

     - Not calculating the win rates correctly: For example, if a student does not reduce fractions or makes an arithmetic error, 
       they would lose marks in part (a). However, if they carry the error forward consistently, they might get follow-through marks.

     - In part (b): If they get the comparisons wrong because of calculation errors from (a), then they lose the mark for that part.

     - In part (c): If they don't name Simpson's Paradox but describe the paradox, they might get 1 mark (for describing) but lose 1 mark for not naming.

     - In part (d): Simply saying "the statistics lie" without explaining the weighting would get 0 marks. They must explain the weighting by map type.

     - Also in (d): If they only say that the Falcons played more hard maps without mentioning that hard maps have lower win rates, they might get 1 mark for the distribution but not the full 3.

     - They must note that the overall win rate is a weighted average and the weights are the number of games. If they don't mention weights, they might get only 1 or 2 out of 3.

     - They should also note that the Falcons' overall win rate is pulled down by playing so many hard maps (where they have 30% but also the map is harder) and the Owls played mostly easy maps (where they have 88.89%). 

   This practice should help you understand how to break down the data and avoid the common mistake of only looking at the overall rate without considering the groups (map types) and their weights.
answer: |-
  ### Practice Exam Question: Simpson's Paradox in Esports  
  **Time:** 15 minutes  
  **Total Marks:** 10  

  ---

  #### Scenario:  
  Two esports teams, **Falcons** and **Owls**, compete on two types of maps: **Easy** and **Hard**. Their performance data is:  

  | Team    | Map Type | Wins | Total Games |
  |---------|----------|------|-------------|
  | Falcons | Easy     | 9    | 10          |
  | Falcons | Hard     | 27   | 90          |
  | Owls    | Easy     | 80   | 90          |
  | Owls    | Hard     | 2    | 10          |

  ---

  #### Questions:  
  1. **Calculate the win rates** (as percentages, to 2 decimal places) for:  
     - Falcons on Easy maps  
     - Falcons on Hard maps  
     - Owls on Easy maps  
     - Owls on Hard maps  
     - **Overall win rate** for Falcons  
     - **Overall win rate** for Owls  
     *(3 marks)*  

  2. Based on your calculations:  
     - Which team has a higher win rate on **Easy maps**?  
     - Which team has a higher win rate on **Hard maps**?  
     - Which team has a higher **overall win rate**?  
     *(2 marks)*  

  3. Explain why these results appear contradictory. **Name the statistical phenomenon** responsible.  
     *(2 marks)*  

  4. Resolve the paradox by:  
     - Identifying the **key factor** causing the reversal.  
     - Explaining **why focusing only on overall rates is misleading**.  
     *(3 marks)*  

  ---

  ### Model Answer  

  #### 1. Win Rates:  
  - **Falcons (Easy):** \( \frac{9}{10} = 0.90 \) → **90.00%**  
  - **Falcons (Hard):** \( \frac{27}{90} = 0.30 \) → **30.00%**  
  - **Owls (Easy):** \( \frac{80}{90} \approx 0.8889 \) → **88.89%**  
  - **Owls (Hard):** \( \frac{2}{10} = 0.20 \) → **20.00%**  
  - **Falcons (Overall):** \( \frac{9 + 27}{10 + 90} = \frac{36}{100} = 0.36 \) → **36.00%**  
  - **Owls (Overall):** \( \frac{80 + 2}{90 + 10} = \frac{82}{100} = 0.82 \) → **82.00%**  

  #### 2. Comparison:  
  - Falcons have a higher win rate on **Easy maps** (90.00% > 88.89%).  
  - Falcons have a higher win rate on **Hard maps** (30.00% > 20.00%).  
  - Owls have a higher **overall win rate** (82.00% > 36.00%).  

  #### 3. Contradiction & Phenomenon:  
  The Falcons win more on **both** map types, but the Owls win overall. This reversal is called **Simpson’s Paradox**.  

  #### 4. Resolution:  
  - **Key factor:** Imbalanced weighting of games.  
    - Falcons played **90%** (90/100) of their games on **Hard maps** (where win rates are low).  
    - Owls played **90%** (90/100) of their games on **Easy maps** (where win rates are high).  
  - **Why overall rates mislead:**  
    The overall rate is a **weighted average**. Falcons’ overall rate is heavily weighted toward their low win rate (Hard maps), while Owls’ overall rate is weighted toward their high win rate (Easy maps). **Aggregating ignores this imbalance**, causing the paradox.  

  ---

  ### Marking Scheme (10 marks total)  
  | **Part** | **Marks** | **Key Points**                                                                 | **Common Mistakes** (deduct marks) |  
  |----------|-----------|--------------------------------------------------------------------------------|-------------------------------------|  
  | **Q1**   | 3         | Correct win rates: <br> - Falcons Easy (90%) <br> - Falcons Hard (30%) <br> - Owls Easy (88.89%) <br> - Owls Hard (20%) <br> - Falcons overall (36%) <br> - Owls overall (82%) | Arithmetic errors, missing overall rates. |  
  | **Q2**   | 2         | Falcons better on Easy **and** Hard; Owls better overall.                      | Misreading comparisons. |  
  | **Q3**   | 2         | Identifies contradiction (Falcons win each map but lose overall) **and** names Simpson’s Paradox. | Only says "stats lie" without naming paradox (-2). |  
  | **Q4**   | 3         | - Explains **weighting imbalance** (Falcons: 90% Hard, Owls: 90% Easy). <br> - Links weights to win rates (Falcons pulled down by Hard maps). <br> - States that overall rates ignore group proportions. | Confuses with base rates (e.g., "Hard maps are harder" without weighting). Superficial answers (-3). |  

  ---

  ### Why This Earns Marks:  
  - **Q1/Q2:** Demonstrates accurate calculations and comparisons.  
  - **Q3:** Names Simpson’s Paradox (crucial—saying "stats lie" earns **0**).  
  - **Q4:** Focuses on **weighting** (maps played), not base rates. Explains *why* aggregation misleads.  

  ### Key Study Tip:  
  Simpson’s Paradox arises when **group sizes (weights)** are ignored in aggregation. Ask: "Did one group dominate a low-success category?" (e.g., Falcons playing mostly Hard maps). Never trust overall rates without checking subgroup distributions!
