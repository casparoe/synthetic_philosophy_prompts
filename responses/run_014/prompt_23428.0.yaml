  Therefore, the ranking:

  1. Hybrid biostatistical account (2) - most resistant because it fixes the reference class by design.
  2. Normativist account (4) - resistant because it doesn't rely on a statistical reference class but on values.
  3. Engel's conceptual-ecological approach (5) - also normativist and contextual, but the ecological context might require choosing a reference class at a particular level, which could be underdetermined. However, it is still not tied to statistics in the same way as Boorse and Daniels.
