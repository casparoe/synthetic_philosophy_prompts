prompt: |-
  hey, I'm in a distributive justice seminar and I'm on the hook for bringing a case to discussion next week, and honestly what's bugging me is that my prof keeps saying "the capability approach" like it's one single view. I want a case that cracks Sen and Nussbaum apart from each other, and also apart from a Dworkin-style resourcian and a straight welfarist. Can you build that for me to spec?

  what it's for: a seminar where people have already done the readings, so the case has to actually generate the verdicts rather than smuggle them in. if I can't show the reasoning comes out of the theories themselves, I've wasted everyone's time.

  the scenario:
  - one paragraph, realistic, set somewhere boring and ordinary (a city, a firm, a hospital admin office, a household). no sci-fi, no desert islands, no lottery winnings
  - two people, A and B, who are equal on resources and equal on welfare/preference satisfaction, and I mean genuinely equal, not equal because A has quietly scaled her ambitions down. no adaptive preference moves anywhere in the case. also ban the stock examples: no wheelchair, no fasting holy man vs starving man, no contented slave, no cheerful 1950s housewife, no expensive taste cases where someone needs rare claret to be happy
  - the only thing that differs: A has voluntarily signed onto some restriction (contract, tied visa, professional licensing, a partnership clause, whatever you think works best) that makes a whole region of options expensive for her to get back to but not literally impossible
  - and A sits comfortably above the threshold on every item on Nussbaum's list of central capabilities, all ten of them, and she'd tell you so herself in a calm moment if you asked

  target verdicts:
  - welfarist: no complaint, A and B are equally well off
  - Dworkinian resourcian: no complaint about the distribution as such (he's allowed to grumble about the enforceability of the contract for other reasons, but the equality metric says they're even)
  - Sen: a real capabilty inequality, and it survives the fact that she chose it
  - Nussbaum: no complaint of justice at all, maybe just a loss of something good

  if you think one of those four verdicts can't actually be produced from the theory rather than asserted, tell me which one and why instead of fudging it. I'd rather have three clean verdicts and an honest flag than four rigged ones.

  then the walkthrough:
  - for each view, show the reasoning that produces the verdict, from the theory's own commitments (what metric, what's the currency, what counts as a conversion factor, whether freedom has value over and above chosen functionings). make it checkable, so someone in seminar can say "no, Dworkin would actually treat that as a resource deficit" and I can see whether they're right
  - name the single feature doing the most work. my guess is the costly-but-possible exit, since that's what lets Sen call the set smaller while Nussbaum says the threshold is still met, but argue for it rather than agreeing with me by default
  - deletion test: what happens to each of the four verdicts if you make the exit flatly impossible, and separately what happens if you make the restriction involuntary
  - and finish with how a Nussbaum defender would attack the case to pull Sen's verdict back inside her own framework (I assume she'd say practical reason has architectural priority over the rest of the list, but I want her best version)

  no reading list or citations pls, I've got that covered. just get the philosophy right. around 700-900 words total is fine.
reasoning: |-
  Okay, the user is in a distributive justice seminar and needs a case study that clearly differentiates between several theories: Sen's capability approach, Nussbaum's version, Dworkin's resourcism, and welfarism. They want a realistic scenario without common tropes like wheelchairs or adaptive preferences. 

  First, I need to understand the key requirements. The case must show A and B as equal in resources and welfare, but A has a voluntary restriction making some options costly to access. A must be above Nussbaum's central capabilities threshold. The target verdicts are specific for each theory.

  Hmm, the tricky part is creating a scenario where Sen sees a capability inequality while Nussbaum doesn't, given her threshold approach. I'm considering a professional context - maybe a non-compete clause in employment? That feels ordinary and avoids sci-fi elements. 

  Let me sketch this: A is a marketing specialist who signed a strict non-compete, while B didn't. Both have identical jobs, salaries, and satisfaction. The non-compete makes switching industries expensive but not impossible. This satisfies the equality conditions while introducing Sen's key differentiator: effective freedom reduction.

  For welfarism: Since both report equal happiness and preference satisfaction, no issue. The voluntary choice makes welfare equal. 

  Dworkin: Resources are identical (salary, benefits), and the contract is seen as a chosen gamble. No resource deficit.

  Sen: The costly exit shrinks A's capability set. Even though chosen, it reduces her real freedom to pursue alternatives. 

  Nussbaum: All central capabilities are met - practical reason isn't impaired because A retains theoretical choice. The threshold holds.

  The deletion tests are crucial. If exit becomes impossible, Nussbaum might see a capability failure (practical reason impaired). If involuntary, all theories except strict resourcism would object. 

  For the Nussbaum defense, I'll have her argue that practical reason's architectural role means any voluntary restriction that doesn't undermine reasoning itself is acceptable. This maintains the threshold standard while acknowledging Sen's point about opportunity costs.

  The professional licensing angle works because it's mundane yet reveals philosophical fault lines. The costly exit does the heavy lifting - it's what creates Sen's opportunity cost without tripping Nussbaum's thresholds. 

  Better avoid any mention of disabilities or cultural stereotypes. Keep it focused on contractual constraints in a boring office setting. The marketing firm example should work - it's ordinary enough not to distract from the theoretical distinctions.
answer: |-
  Here's a self-contained case designed to your specifications, followed by the analysis:

  **The Case: The Non-Compete Clause**

  Alex and Bailey are mid-level marketing specialists at a medium-sized firm in Indianapolis. They hold identical positions: same job title, same salary ($85,000), same benefits package (health, dental, retirement matching), same allocated office space, and identical company-issued laptops. Both report high job satisfaction (8/10) and express contentment with their current roles and compensation. Neither exhibits adaptive preferences; both actively sought this competitive role based on genuine interest and market research. Recently, the firm introduced a revised employment contract for their department. Key elements: a standard confidentiality agreement and a **stricter non-compete clause**. This clause prohibits working for direct competitors or in a similar marketing role within a 200-mile radius for 18 months after leaving the company. Signing was voluntary but necessary for continued employment and future promotion eligibility. Alex, valuing stability and seeing strong internal growth opportunities, readily signed. Bailey, more cautious about future flexibility, negotiated fiercely and secured a waiver for the non-compete clause, accepting a slightly slower track to the next promotion tier as a trade-off (their salary/benefits remained identical). Both are currently equally productive and satisfied. Alex knows leaving for a competitor would require either moving her family out of state (incurring significant relocation costs and disruption) or switching industries (requiring retraining/networking costs). It's difficult and expensive, but not impossible. Bailey faces no such barrier. Both have secure housing, good health, strong social networks, political voice, opportunities for affiliation, play, and emotional health. If asked, Alex would calmly affirm she feels in control of her life, capable of reasoning about her choices, and not deprived of any essential element of a dignified life.

  ---

  **Analysis & Verdicts**

  1.  **Welfarist (e.g., Preference Satisfaction/Hedonic):**
      *   **Metric:** Individual welfare, measured by preference satisfaction or happiness.
      *   **Reasoning:** Alex and Bailey report identical high levels of job satisfaction and overall contentment. Their resources are identical. Alex voluntarily chose the contract with the restrictive clause, presumably because it best satisfied her preferences (security, internal promotion) at the time. The *cost* of exit doesn't directly impact her *current* welfare state, which is equal to Bailey's. The fact that her future choices are constrained *if* she chooses to leave doesn't alter her current welfare level or preference satisfaction.
      *   **Verdict:** No complaint. A and B are equally well off. Welfare is equal.
      *   **Key Feature:** Current welfare/preference satisfaction is identical. The *future cost* doesn't register in the current welfare metric.
      *   **Deletion Tests:**
          *   *Impossible Exit:* If exit were impossible, Alex's *current* welfare might drop (feeling trapped), creating inequality. The welfarist *might* now see a complaint if welfare decreases.
          *   *Involuntary Restriction:* If Alex was forced, her welfare/preference satisfaction would likely be lower than Bailey's (resentment, frustration), creating inequality and a complaint.

  2.  **Dworkinian Resourcism:**
      *   **Metric:** Equality of resources, defined through a hypothetical insurance market (what bundle would individuals have bought against brute luck behind a veil of ignorance?).
      *   **Reasoning:** Alex and Bailey have identical current resource bundles: salary, benefits, office, equipment. The non-compete clause itself is part of the employment contract *package* that Alex freely chose over the package Bailey chose (no non-compete, slower promotion). Dworkin distinguishes between *option luck* (gambles you voluntarily take) and *brute luck* (misfortune not chosen). Alex's acceptance of the restrictive contract is an exercise of option luck – she gambled that the benefits outweighed the potential future cost. Bailey made a different gamble. The *consequence* of Alex's gamble (a constrained future option set) is not a deficit in her *current resource endowment* compared to Bailey's. The state doesn't owe compensation for the results of freely chosen gambles.
      *   **Verdict:** No complaint about the *distributive equality*. They are resource-equal. (Dworkin might critique contract law or enforceability norms separately, but that's not about the metric of equality between A and B).
      *   **Key Feature:** The restriction is a voluntarily chosen contractual term, part of a package deal. It falls under option luck.
      *   **Deletion Tests:**
          *   *Impossible Exit:* This might start to look less like option luck and more like brute luck deprivation (being forcibly bound). Dworkin might now see a resource deficit requiring compensation.
          *   *Involuntary Restriction:* If forced, it's clearly brute luck. Alex starts with fewer resources (the freedom embodied in the non-compete waiver is a resource Bailey has). Complaint warranted.

  3.  **Sen's Capability Approach:**
      *   **Metric:** Freedom (capability) to achieve valuable functionings (beings and doings). Focus on the *real opportunity* set.
      *   **Reasoning:** While Alex and Bailey have the same resources and current functionings (doing their jobs, being satisfied), their *capability sets* differ significantly. Alex's capability to "work in her chosen field within her current geographic region" is severely curtailed *in practice* by the high cost of exit. The cost acts as a significant *conversion handicap* – she needs far more resources (money for relocation/retraining) than Bailey does to achieve that same functioning. Sen emphasizes the *value* of freedom itself and the importance of having a wider set of opportunities, even if not currently exercised. Alex's smaller effective opportunity set constitutes a capability inequality. This inequality persists *because* she chose it; Sen sees reducing valuable freedoms, even voluntarily, as a loss relevant to justice (though not necessarily demanding state intervention in this voluntary case, the inequality exists for assessment).
      *   **Verdict:** Capability inequality exists. Alex has less freedom than Bailey.
      *   **Key Feature:** The **costly-but-possible exit**. This creates the conversion handicap that shrinks Alex's *effective* opportunity set relative to Bailey's, despite resource equality. It operationalizes the difference between formal freedom and real opportunity.
      *   **Deletion Tests:**
          *   *Impossible Exit:* The capability inequality is even starker. Alex completely lacks a freedom Bailey has.
          *   *Involuntary Restriction:* Reinforces the capability inequality as an injustice, adding the element of coercion.

  4.  **Nussbaum's Capability Approach (Threshold):**
      *   **Metric:** Securing a minimum threshold level for each of the ten Central Capabilities, viewed as essential for a life worthy of human dignity.
      *   **Reasoning:** By stipulation, Alex meets the threshold on *all* ten central capabilities, including "Practical Reason" (planning her life) and "Control over one's Environment" (political participation, property rights, employment). The key point is the *threshold*. While Alex has fewer *opportunities* concerning future employment mobility in her field/location than Bailey, her *current ability* to exercise practical reason, hold property (salary), participate politically, maintain bodily health and integrity, affiliate, etc., remains intact *above the required minimum level*. The costly exit restricts one specific opportunity path, but it doesn't push her *below* the threshold on any core capability. Nussbaum focuses on securing the essential prerequisites for a dignified life, not on comparing the breadth of opportunity sets above that threshold. Alex's voluntary choice, made while above the threshold, doesn't constitute an injustice, though it may represent a loss of a good (greater flexibility).
      *   **Verdict:** No complaint of justice. Thresholds are met.
      *   **Key Feature:** **Meeting the Threshold.** The restriction impacts opportunities *above* the minimum required for a dignified life across all central capabilities.
      *   **Deletion Tests:**
          *   *Impossible Exit:* This *might* threaten the "Control over one's Environment" (employment) threshold, depending on severity. If Alex is truly trapped in an unwanted job with no escape, her ability to meaningfully shape her working life could fall *below* the threshold. Complaint likely.
          *   *Involuntary Restriction:* If forced, this likely violates the "Bodily Integrity" and "Control over Environment" thresholds directly, regardless of current welfare. Complaint warranted.

  **The Single Feature Doing the Work:** You are correct. The **costly-but-possible exit** is the linchpin. It's what creates:
  *   The conversion handicap for Sen (reducing *real* freedom).
  *   The *lack* of a threshold failure for Nussbaum (the core capabilities remain exercisable).
  *   The irrelevance for Welfarism (current welfare untouched).
  *   The classification as option luck for Dworkin (a chosen gamble, not a resource deficit).

  **Nussbaum Defender's Counter to Pull Sen's Verdict In:** A Nussbaum defender would argue that **Practical Reason has architectural priority**. They would contend that Alex's *current* ability to reason about her life choices, including her *understanding* of the contract she signed and her *ability* to plan within (or despite) its constraints, *is* the core of the "Practical Reason" capability. As long as she has this reasoning capacity intact *and* the freedom to make choices (like signing or not signing, albeit with trade-offs), she meets the threshold. The specific *content* of her opportunity set regarding future job mobility, while less than Bailey's, is an *application* of practical reason, not the core capability itself. For Nussbaum, the threshold is met by securing the *capacity for* choice and planning; it doesn't require maximizing the number or quality of choices available above that fundamental capacity. The defender would argue Sen conflates the *exercise* of capabilities in specific domains with the *securing of the fundamental capabilities themselves*, which Nussbaum's threshold aims to guarantee for basic justice. The loss Sen identifies is real, but it's a loss of a specific valuable opportunity, not a failure to secure the minimal central capability of practical reasoning necessary for human dignity.
