  I need to understand their core argument. They propose that utility is a parameter derived from choices after applying an "invariance filter" to discard context-sensitive decisions. This frames preference construction as calibration rather than refutation. Their four-step argument is: (1) utility requires public evidence; (2) choice under cost is the only suitable evidence; (3) utility claims depend entirely on measurement procedures; (4) admissibility conditions are constitutive of utility.

  For the prep sheet, I'll start with their requested two-sentence bottom line identifying the most dangerous objection. Then I'll organize objections by subgroup, focusing on damage to their four steps rather than frequency. Each objection needs: (a) source-specific phrasing with technical vocabulary, (b) a 90-second reply, (c) a vulnerability in that reply.

