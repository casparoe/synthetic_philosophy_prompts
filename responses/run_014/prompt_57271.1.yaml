answer: |-
  **Question-Period Prep Sheet**

  1.  **Bottom Line:** The most dangerous objection is the measurement philosopher's challenge to Step 3's operationalism, arguing it makes utility claims *merely* procedural and voids normative force. The chapter survives *as stated* only by biting the bullet that utility *is* procedural, but this risks alienating the welfare economists and law professor who need normative traction. Significant clarification is needed.

  **OBJECTIONS (Ordered by Damage to Argument Core):**

  2.  **Objection: Measurement Undermines Normativity (Philosopher of Economics)**
      *   *(a)* "You've reduced utility to a procedural artifact of *your chosen* filtering method. But that makes it purely operationalist: it tells us what survives *your test*, not what *ought* to guide policy. If utility is *defined by* the filter, how can it bear normative weight in cost-benefit analysis? This severs it from welfare. (Damages Step 3 & 4, core normative link)"
      *   *(b)* "The normative force doesn't reside in utility *simpliciter*, but in the *justification* for the filter itself. We choose perturbations (like frame changes) we deem *irrelevant* to true underlying welfare. A utility claim surviving this filter means the agent treats options consistently *despite* these normatively irrelevant manipulations. Its normative weight comes from the filter being designed to isolate choices reflecting *considered judgment* rather than noise or bias we agree shouldn't count. The 'ought' is built into the filter's design principles."
      *   *(c) Soft Spot:* "But *who* decides what perturbations are 'irrelevant' or what counts as 'considered'? That's inherently normative and contestable. Your procedure just buries the normativity, it doesn't solve it."

  3.  **Objection: Filter Cherry-Picks Data (Behavioral/Experimental Economist)**
      *   *(a)* "You say discard choices below 'resolution' when context shifts. But that's just cherry-picking data that fits your model! We *know* choices shift systematically with context – anchoring, endowment, framing – it's not noise, it's *how cognition works*. Your 'invariance filter' seems arbitrary: why discard framing effects but maybe not time delays? You're defining away the phenomenon we study. (Damages Step 2 & 3 - evidence base & interpretability)"
      *   *(b)* "It's not cherry-picking, it's *calibration*. Think of a thermometer: we discard readings when shaken or near magnets because we've calibrated it to measure *temperature*, not vibration or magnetism. The filter defines the 'measurement conditions' for utility. We discard choices under perturbations *known* to induce predictable, systematic biases *unrelated* to underlying valuation (based on cognitive science). The goal isn't to describe *all* choice, but to measure a *specific construct* – context-independent relative value – requiring data where such noise is minimized."
      *   *(c) Soft Spot:* "But *your* list of 'biases' is based on findings *from* unfiltered choice experiments! You're using the phenomena you discard to define what to discard. It's circular."

  4.  **Objection: Who Gets Filtered Out? (Law Professor)**
      *   *(a)* "Your 'invariance filter' sounds like a recipe for exclusion. People whose choices are *consistently* context-dependent – say, due to cognitive differences, cultural background, or just having complex, situation-sensitive values – get their choices discarded as 'below resolution'. Their 'utility' becomes undefined. Doesn't this systematically exclude marginalized voices whose preferences don't conform to your stability ideal? Who counts as a 'properly calibrated' agent? (Damages Step 1 & 4 - public justification & constitutive criteria)"
      *   *(b)* "The filter targets *elicitation noise*, not agents. If an individual consistently shows high sensitivity to normatively irrelevant perturbations *across diverse choice sets*, it suggests the construct 'stable context-independent relative value' may not be applicable *for them* under standard elicitation. This doesn't mean exclusion, but signals the need for different measurement approaches (e.g., qualitative, deliberative) or recognizing limits to quantifying *their* welfare via this specific method. Cost-benefit analysis might need supplementary inputs for such cases."
      *   *(c) Soft Spot:* "That sounds nice, but in practice, regulators using this will default to the 'clean' quantified utilities from the 'stable' agents. Your method inherently privileges quantifiable, context-independent preferences."

  5.  **Objection: Monday Morning Impossible (Welfare Economist)**
      *   *(a)* "This sounds utterly impractical. How do I *operationalize* this 'invariance filter' on Monday? Do I run multiple elicitations per person with different frames? That's prohibitively expensive. Which perturbations are in the 'designated family'? Who decides? How much variance is 'below resolution'? Without clear, agreed-upon rules, this is just hand-waving. We need numbers for policy *now*, based on observable choices. (Damages Step 4 - constitutive procedure becomes inoperable)"
      *   *(b)* "You're right about practical challenges now. Think of this as the *foundational justification* for *improving* practice. Currently, we *implicitly* assume choices reveal stable pref without testing invariance. My point is that good measurement *requires* this step. The path forward involves: 1. Building consensus on a core set of critical perturbations (e.g., gain/loss frame, default effects) based on robust evidence. 2. Developing efficient, scalable methods (e.g., smart survey design, triangulation). 3. Acknowledging uncertainty when invariance isn't tested/achieved. This sets the *standard* good CBA should aim for."
      *   *(c) Soft Spot:* "But without concrete, feasible protocols *now*, your 'constitutive' procedure is just theoretical. We're stuck with unfiltered choice data. Does your theory say *that* yields no valid utility info?"

  6.  **Objection: Contradicts Behavioral Evidence (Behavioral/Experimental Economist)**
      *   *(a)* "Your core premise that there's a 'stable' preference underneath the noise conflicts with decades of evidence. Preferences *are* constructed on the fly based on task demands, accessibility, goals – there's no 'true' preference to be revealed or filtered *to*. Your filter assumes a latent variable that simply doesn't exist. You're saving revealed preference by redefining it into irrelevance. (Damages Step 2 & 3 - existence of stable core)"
      *   *(b)* "I'm not positing a *psychological* latent state, but a *measurement construct*. The point isn't that a perfectly stable preference *exists in the mind*, but that we can *define and measure* a construct of *context-independent relative value* through a specific procedure. It's a useful fiction for policy, like 'center of gravity'. The behavioral evidence shows *why* we need the filter – to isolate this specific construct from other cognitive processes influencing choice *in that moment*. It doesn't refute the construct; it necessitates the calibration."
      *   *(c) Soft Spot:* "But if it's *just* a constructed fiction defined by the method, with no psychological reality, why should it guide policy affecting real people's welfare? Isn't it arbitrary?"

  **Strategic Moves:**

  7.  **Concession to Make Early:** Preemptively soften Step 4. "To be clear, I argue the admissibility conditions are *constitutive of the utility construct as defined for measurement*. This doesn't mean they are the *only possible* way to think about welfare, but that they are pragmatically necessary *for grounding utility claims in public, contestable evidence* within CBA." (Takes wind out of Philosopher's #2 and Law Prof's #4 objections by clarifying the scope and avoiding strong metaphysical claims).
  8.  **Line to Hold:** Despite the difficulty, hold firm on discarding noisy data rather than averaging (#3 Objection reply). Conceding here ("well, maybe we can model the noise") completely collapses the core measurement thesis back into standard behavioral critiques. Winning requires demonstrating a distinct *measurement discipline*. Say: "Averaging in responses we *know* are distorted by manipulations we've defined as irrelevant contaminates the measure. Better to acknowledge uncertainty where invariance fails."

  **Nightmare Question:**

  9.  **Question Hoping Nobody Asks:** "By what non-arbitrary, non-question-begging criterion do you select *which specific perturbations* belong in the 'designated family' constituting your invariance filter? Doesn't this choice inherently embed the normative assumptions you claim the filter avoids?" (From Philosopher or Law Prof).
      *   **Why No Good Answer:** The argument provides a *formal* requirement (a filter is needed) but offers no definitive, non-circular *meta-criterion* for selecting *which* perturbations are included/excluded. Appeals to "robust findings" or "normative irrelevance" ultimately rely on contested interpretations of behavioral science and prior normative commitments, leaving the filter vulnerable to charges of being ad hoc or value-laden by design. The chapter identifies the problem and proposes a solution structure but lacks a knockdown justification for any specific filter composition.
