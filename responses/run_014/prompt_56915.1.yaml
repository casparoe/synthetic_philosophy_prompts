  - `closest_precedent`: object with `id`, `why`, and `where_the_analogy_breaks`.
  - `second_closest_precedent`: object with `id` and `why_it_competes`.
  - `recommendation`: object with `decision` (same vocabulary as `gateway_verdict`), `reasoning` (no more than 150 words), `predicted_vote` (for example "4–3 to take the alternative"), and `confidence`.
  - `principle_adopted_if_we_accept`: string, stating the general commitment the committee would take on by accepting the gift, formulated so that it would govern future cases.
  - `principle_adopted_if_we_take_the_alternative`: string, in the same form.
  - `discriminating_case`: object with `description` (a specific hypothetical future proposal, concrete enough to vote on, that our five precedents and Thursday's decision would still leave open but that the candidate rules answer differently) and `rule_predictions` (array of objects with `id` and `verdict`).
  - `charter_silences`: array of strings naming the questions that our charter's wording and our minutes leave unsettled and that Thursday's vote will settle by fiat.
