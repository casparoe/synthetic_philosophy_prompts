prompt: |-
  I'm part of a small reading group on epistemic game theory — mostly philosophy grad students plus a couple of economists — and after a semester working through common knowledge of rationality, iterated dominance, and the backward induction debates, I've collected a set of gut verdicts about particular scenarios that I can't yet see any single principle behind. Here are the cases and my verdicts; I'd like you to tell me what, if anything, they add up to.

  (1) Muddy children: three children, two with muddy foreheads, and a father who publicly announces that at least one child is muddy. I think the two muddy children can each figure out they're muddy after two public rounds of everyone saying "I don't know." (2) Two commanders who must both attack at dawn to win, while attacking alone is a disaster; they can communicate only by couriers, each of which has a small chance — say one in fifty — of being captured, and they keep sending acknowledgments back and forth until one fails to arrive. My verdict: they never attack, no matter how many acknowledgments get through. I hold this even at ninety-nine successful acknowledgments, which my friends call paranoia. (3) The same commanders, but now there is a signal they can observe simultaneously and publicly; there they attack. So the gap between "each knows, and each knows the other knows, ... to depth ninety-nine" and genuine common knowledge strikes me as real and behaviorally decisive. (4) A stag hunt in which each partner receives a private but quite reliable signal of the other's intentions, right nineteen times out of twenty: here I think they do hunt stag. The noise doesn't destroy cooperation — and this is what bothers me, since case (2) looks structurally similar. (5) A centipede game with a hundred nodes: I think it can be rational to pass at early nodes, because the fact that we have both passed a few times is itself evidence against the unbounded rationality that backward induction presupposes. (6) A one-shot prisoner's dilemma under full common knowledge of payoffs and rationality: defect, full stop, no matter how many layers deep the mutual knowledge goes — and this one feels robust to me in a way (2) doesn't.

  Is there a principle that delivers all of these, or close to it? My tentative stab is that the payoff structure decides whether a speck of higher-order doubt gets amplified (as with the commanders, where each needs to be sure the other will attack) or washed out (as in the stag hunt, where — somehow — it doesn't), but I can't make that precise, and I can't see what it could say about my centipede verdict, where the doubt isn't about whether a message arrives but about whether the other player is even the type that backward induction assumes. Please state your candidate principle or principles as precisely as you can, explain what each clause is doing there, and tell me honestly which of my verdicts you would overturn and why — I'd rather lose a verdict than keep it by torturing the principle. Then apply it to two cases I haven't listed: a "guess two-thirds of the average" game among players who all know that a small minority of them choose numbers at random, and the commanders' setup again but with the couriers captured only one time in a thousand. Finally — and I mean this seriously — tell me what would change your mind: which of my verdicts, if I refused to give it up, would sink your best principle, and where in the chain of reasoning is the whole thing most likely to break.
reasoning: |-
  Okay, the user is part of a reading group on epistemic game theory, mostly philosophy grad students and some economists. They've been studying common knowledge of rationality, iterated dominance, and backward induction debates. Now they have a set of intuitions about different scenarios and want to know if there's a unifying principle behind them. Let me go through each case and their verdict.

  First, the Muddy Children puzzle. Three kids, two muddy. Father says at least one is muddy. After two rounds of "I don't know," the muddy kids figure it out. This relies on common knowledge being built through public announcements. Each announcement updates what everyone knows, and after two rounds, the necessary deductions happen. So common knowledge is achieved here through iterative public statements.

  Next, the Two Commanders problem. They need to coordinate an attack, but communication is via couriers with a 1/50 chance of capture. They keep sending acknowledgments, but the user thinks they never attack, even after many successful messages. The issue is that no matter how many acknowledgments, there's always a tiny doubt that the last message wasn't received, breaking common knowledge. This is different from having a public signal where both see the same thing simultaneously.

  Then the same commanders with a public signal—they attack. Here, the simultaneous observation creates common knowledge instantly. So the distinction between almost-common knowledge and actual common knowledge matters a lot in coordination games.

  Stag Hunt with private signals: each gets a reliable signal (19/20 accuracy) about the other's intention. The user thinks they cooperate. Why is this different from the commanders? In Stag Hunt, even with some uncertainty, the risk of miscoordination isn't as catastrophic. If one hunts stag and the other doesn't, it's bad but not disastrous. In the commanders' case, attacking alone is a disaster. So payoff asymmetry plays a role.

  Centipede Game with 100 nodes. The user believes passing early can be rational because repeated passing might indicate that the opponent isn't perfectly rational, thus making backward induction less applicable. So here, the uncertainty about the other player's rationality affects strategies.

  One-shot Prisoner's Dilemma: defect no matter how many layers of mutual knowledge. This seems robust to the user. Even with high-order knowledge, defecting is dominant because there's no way to coordinate cooperation without mechanisms like repeated interactions.

  The user's tentative idea is that payoff structures determine whether higher-order doubts get amplified or washed out. In coordination games with high miscoordination costs (like commanders), tiny doubts escalate. In Stag Hunt, the stakes are lower, so doubts might not prevent cooperation. But they're struggling to formalize this and apply it to Centipede, where doubt is about rationality.

  Now, what's the deeper need here? The user wants a coherent framework to explain their intuitions across different games. They might be preparing for a paper, thesis, or group discussion. They value consistency and are willing to discard intuitions if they don't fit a solid principle. They also want to test their ideas on new cases: Guess 2/3 Average with random players, and commanders with lower courier capture risk (1/1000).

  Key challenges: 
  1. Distinguishing when near-common knowledge suffices (Stag Hunt) vs. when it doesn't (Commanders). The cost of miscoordination seems critical. 
  2. Handling cases where uncertainty is about rationality (Centipede) vs. about information transmission (Commanders). 
  3. The role of public signals vs. private messages.

  Possible unifying principle: The Amplification Threshold Principle. It combines the cost of miscoordination and the level of epistemic doubt. When the cost is infinite (like commanders attacking alone), any doubt, however small, prevents action. In Stag Hunt, the cost is finite, so reliable signals suffice. But in Centipede, it's about rationality uncertainty. Maybe adding a dimension about uncertainty types.

  Applying the principle to Guess 2/3: With random players, the average is skewed. Rational players adjust their guesses downward, but the random choices anchor the average higher. Depth of reasoning is limited by the known proportion of random players.

  Commanders with 1/1000 capture risk: Still, they never attack because the miscoordination cost is infinite. Even a tiny risk is unacceptable.

  Which verdict might be overturned? The user's Stag Hunt verdict might conflict with the commanders. But Stag Hunt's finite losses vs. commanders' infinite loss explains the difference. However, in Centipede, the principle might need to account for bounded rationality. If the user insists that in Prisoner's Dilemma, even with common knowledge, defection is inevitable, but in Centipede passing is rational, that's consistent because PD has a dominant strategy while Centipede doesn't.

  If the user refused to give up the commanders' verdict (never attack), that's compatible. But if they insisted that in Stag Hunt with noisy signals they shouldn't cooperate, that would challenge the principle. The principle hinges on the cost of miscoordination being finite. If Stag Hunt's miscoordination cost were infinite, cooperation would fail, but typically it's not.

  The critical point is whether the cost of miscoordination is infinite or finite. In commanders, it's infinite; in Stag Hunt, it's finite. That distinction must hold. If the user thought that in a modified Stag Hunt with infinite costs, they should still cooperate, that would break the principle. But they probably agree that in such a case, cooperation wouldn't happen.
answer: |-
  Your verdicts reveal a sophisticated intuition about how **epistemic constraints** and **payoff structures** interact to determine rational behavior. I propose the **Amplification Threshold Principle (ATP)** as a unifying framework. After stating it formally, I'll break down how it explains your cases, which verdicts it overturns (and why), and apply it to your new scenarios. Crucially, I'll identify where the principle is most vulnerable.

  ---

  ### **The Amplification Threshold Principle (ATP)**
  *Rational coordination fails if and only if:*
  1. **Payoff Asymmetry**: *The cost of unilateral action (or miscoordination) is effectively infinite* (i.e., catastrophic loss that dominates all other outcomes), *and*
  2. **Epistemic Instability**: *There exists any doubt (however small) about higher-order beliefs that could be recursively amplified by the payoff structure to undermine confidence in coordination.*

  **Clarifications:**
  - **"Effectively infinite" cost**: Outcomes so bad they make all other payoffs irrelevant (e.g., death, bankruptcy). Finite losses don't trigger ATP.
  - **"Recursively amplified" doubt**: Small uncertainties propagate up the belief hierarchy because each player thinks, "Even if *I* am certain, the other might doubt that I'm certain, which could make them hesitate, which would make me hesitate..." Payoff asymmetry fuels this loop.
  - **ATP overrides mutual knowledge**: No finite depth of mutual knowledge suffices if amplification is possible. Only common knowledge (or public signals) can break the cycle.

  ---

  ### **How ATP Explains Your Verdicts**
  1. **Muddy Children**  
     - *ATP verdict:* Correct (muddy children deduce their state).  
     - *Why:* Public announcements create common knowledge iteratively. No payoff asymmetry exists (no cost to saying "I don't know"), so doubts don't amplify. ATP isn't triggered.

  2. **Commanders with Couriers**  
     - *ATP verdict:* Correct (never attack).  
     - *Why:* **Payoff asymmetry** (unilateral attack = disaster) + **epistemic instability** (each courier loss introduces doubt that recursively amplifies: "Did they get my ack? Do they know I got theirs? What if they think I didn't get it?"). Finite mutual knowledge fails; only common knowledge resolves this.

  3. **Commanders with Public Signal**  
     - *ATP verdict:* Correct (attack).  
     - *Why:* Public signal creates common knowledge instantly. Doubt isn't merely reduced—it's eliminated. ATP's epistemic instability clause is neutralized.

  4. **Stag Hunt with Noisy Signals**  
     - *ATP verdict:* Correct (they hunt stag).  
     - *Why:* **Payoff asymmetry is absent**. Unilateral stag hunting has a *finite* cost (lost opportunity), not catastrophe. Doubts from noisy signals (19/20 reliability) don't amplify because players don't fear infinite losses. Mutual knowledge to depth 2–3 suffices; noise is "washed out."

  5. **Centipede Game**  
     - *ATP verdict:* Correct (passing early can be rational).  
     - *Why:* **Epistemic instability about rationality**, not information. Backward induction assumes common knowledge of rationality (CKR). Passing provides evidence against CKR ("If they were rational, they'd have defected earlier"). ATP is *partially* triggered: the *possibility* of irrationality amplifies doubt, but payoff asymmetry is finite (passing risks losing gains, not catastrophe). Thus, cooperation can emerge.

  6. **Prisoner's Dilemma (PD)**  
     - *ATP verdict:* Correct (defect).  
     - *Why:* Defection is a dominant strategy under common knowledge of rationality. **No coordination is needed**; ATP doesn't apply. PD is immune to belief amplification because unilateral defection always benefits the defector (no catastrophic cost to *trying* to coordinate).

  ---

  ### **Overturned Verdicts and Why**
  ATP **overturns none** of your verdicts. However, it *sharpens* why (2) and (4) differ:  
  - In (2), miscoordination cost → ∞, so noise *must* amplify.  
  - In (4), miscoordination cost is finite, so noise *can* be absorbed.  
    *(If you insisted Stag Hunt should fail with noise, ATP would break—but your intuition here is sound.)*

  ---

  ### **Application to New Cases**
  **Case A: "Guess 2/3 of the Average" with Random Players**  
  - *Setup:* Players know a minority (e.g., 10%) choose numbers randomly.  
  - *ATP prediction:* The average will be higher than under full rationality.  
  - *Why:* Random choices anchor the average upward. Crucially, **no payoff asymmetry exists** (finite cost to guessing wrong), so ATP isn't triggered. Players iteratively adjust guesses:  
    - Level 0: Random players → average ≈ 50.  
    - Level 1: Rational players guess ~33 (⅔ of 50).  
    - Level 2: They guess ~22 (⅔ of 33), etc.  
    ...but convergence stops near ~15–20 due to known randomness. Noise isn't amplified; it's incorporated.

  **Case B: Commanders with 1/1000 Capture Risk**  
  - *Setup:* Same as (2), but couriers captured only 1/1000 times.  
  - *ATP prediction:* **Still never attack.**  
  - *Why:* **Payoff asymmetry remains infinite** (unilateral attack = disaster). Even tiny doubt (0.001) recursively amplifies:  
    - Commander A: "They might not have received ack #999."  
    - Commander B: "They might think I didn’t receive #999."  
    - A: "They might think I think they didn’t receive #998," etc.  
  Mutual knowledge to *any* finite depth fails. Only a public signal (common knowledge) resolves this.

  ---

  ### **What Would Change My Mind**
  Your verdict on **Centipede (5)** is ATP's weakest point. If you refused to accept that passing is rational, the whole framework would collapse. Here's why:  
  - **The fracture point:** ATP relies on "finite vs. infinite" miscoordination costs to separate amplification from noise-tolerance. But in Centipede, passing is rational *only if* players interpret early passes as *evidence against CKR*. If you insisted backward induction always applies (i.e., no doubt about rationality can arise), then:  
    1. ATP's epistemic instability clause would be irrelevant,  
    2. Early passing would never be rational,  
    3. Stag Hunt (4) would *also* likely fail with noise—because doubt about rationality would amplify.  
    This would force a less nuanced principle (e.g., "common knowledge or bust"), which *would* overturn your Centipede and Stag Hunt verdicts.  

  **Honest assessment:** Your Centipede intuition is defensible but contestable. If experimental data showed people *always* defect early in long Centipedes, ATP would need revision. Conversely, if commanders attacked after 99 acks in simulations, ATP would fail outright.

  ---

  ### **Summary**
  ATP explains all your verdicts by combining:  
  - **Payoff asymmetry** (infinite vs. finite miscoordination costs),  
  - **Epistemic stability** (whether doubts amplify recursively).  

  It preserves your insights while clarifying why (2) and (4) differ (cost of failure), and why (5) works (doubt about rationality matters when costs are finite). Its elegance lies in *not requiring common knowledge* except when payoff asymmetry makes doubt explosive. If you hold firm on Centipede, we might refine ATP to better formalize "rationality doubt"—but as stated, it stands.
