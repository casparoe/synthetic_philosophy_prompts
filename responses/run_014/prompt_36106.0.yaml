prompt: |-
  For the past six years I've chaired the volunteer board of a mid-sized community arts center, and every quarter we face the same kind of meeting: one or more projects we're already deep into, and the question of whether to keep funding them. Recent examples include a membership database migration that is about sixty percent complete with vendor costs ballooning, a co-production with a neighboring theater that is behind schedule and under-subscribed, and the annual winter festival that reliably loses a few thousand dollars but that our community is visibly attached to. In these meetings, board members argue by pointing at how much we've already spent and how much we'd be "throwing away" by stopping, and for years my reflex has been to slap that down with a rule I picked up somewhere: the money is gone either way, sunk costs are irrelevant, and the only thing that matters is a clean comparison of future costs against future benefits.

  Lately, though, I've stopped trusting my own slap-down. Some of the reasons people give for continuing do seem to track the past in ways that might be legitimate rather than confused. Donors who funded the first phase of a project will reasonably wonder about us if we abandon it midway. Stopping and later restarting carries real costs that a simple forward-looking comparison leaves out. There's also something to the thought that our earlier selves spent that money while holding information we may have forgotten, and that discarding their decision for free is its own kind of waste. And I've noticed the pure rule cuts the other way too: anyone who wants to kill a project can reframe every dollar already spent as "sunk" and thereby win the argument without ever discussing what the project is worth going forward. So I no longer believe the question is simply whether honoring sunk costs is rational or irrational; I suspect the real question is when and in what form the past should enter the decision, and I don't have a systematic way of answering it. I have no background in economics or philosophy, so I'm missing whatever structure this question actually has.

  What I'd like is a procedure the board can actually run at one of our quarterly meetings — ninety minutes, seven volunteers with no training, decisions in the range of five to fifty thousand dollars, and a need to leave the meeting with a written one-page record for the minutes. It should be an ordered set of questions, with some indication of what counts as a sufficient answer to each, the points at which it yields a recommendation to continue or stop, and the points at which it has to hand the decision back to us because the question is one of values rather than facts. Crucially, it should separate the genuine fallacy from the reasons for continuing that survive scrutiny — reputational commitments, restart costs, the information embodied in past spending, effects on partners and staff — and say how each of those should be weighed rather than just named. Then run it on three cases: the database migration, the under-subscribed co-production, and the beloved money-losing festival. I'd like you to be honest about where the procedure will misfire, which steps are judgment calls dressed up as procedure, and at least one case where the answer it gives goes against what the board — or frankly, what I — would prefer.
reasoning: |-
  Okay, let me try to unpack this user's problem. They've been chairing a volunteer board for a community arts center for six years. Every quarter, they struggle with decisions on whether to continue funding ongoing projects. The user used to strictly apply the sunk cost fallacy rule but now sees nuances. 

  Hmm, the user mentions examples: a database migration with ballooning costs, a co-production that's behind schedule and undersold, and a beloved festival that always loses money. Board members argue about money already spent, but the user realizes there are valid reasons beyond sunk costs—like donor trust, restart costs, and past decisions made with context.

  The user needs a practical procedure for their board meetings. It has to fit into 90 minutes, involve seven volunteers without training, handle decisions up to $50k, and produce a one-page record. They want clear steps that distinguish real fallacies from legitimate factors like reputation or partner impacts. Also, they want the procedure tested on their three cases and want honesty about where it might fail.

  First, I need to address the core conflict: when should past investments influence decisions? The user is right—it's not black and white. Economics frames sunk costs as irrelevant, but real-world factors like reputation or restart costs matter. The challenge is structuring this without overwhelming volunteers.

  I'll consider designing a flowchart-style procedure. Maybe start with a clear "stop" trigger if continuing is impossible. Then assess sunk costs strictly—any argument based purely on money spent gets flagged. Next, evaluate valid past-linked factors: reputational harm, restart costs, informational value, and partner/staff impacts. Each needs a test. For example, reputational harm requires specific donor names or contracts.

  Future costs vs. benefits comes after. Only quantifiable future impacts should count here—no past spending. Then decision points: if stopping is impossible or future benefits clearly outweigh costs, decide. If not, a values vote. The user emphasized separating facts from values, so that's key.

  Testing on their cases: The database migration might pass because restart costs are high and future benefits clear. The co-production likely fails on future benefits. The festival? Probably a values decision since financials are negative but community value is high.

  Where could it misfire? Quantifying reputational harm is subjective. Also, restart costs might be overestimated. The festival case might frustrate the board if they have to vote despite wanting to cancel. Highlighting these pitfalls is crucial for transparency.

  I should also think about implementation. Pre-work packets, time boxing each step, assigning roles like facilitator and scribe. Keeping it to one page means concise answers—bullet points, checkboxes. The user needs this to be practical, not theoretical.

  Finally, the user's deeper need might be fostering board alignment and confidence in decisions. They’re tired of repetitive debates and want a fair process that respects both logic and community values. The procedure should educate the board over time, reducing reliance on sunk cost arguments and focusing on what truly matters.
answer: |-
  Here’s a practical, step-by-step decision procedure designed for your board’s constraints. It separates sunk costs from legitimate past-linked factors and clarifies when values must drive the choice. **Total runtime: 75–85 minutes.**

  ---

  ### **The Sunk Cost Sanity Check: Board Decision Procedure**  
  *(For ongoing projects: Continue/Stop decisions)*

  **Pre-Work (Before Meeting):**  
  Staff provides a ½-page summary per project:  
  - **Future Costs** (to complete/run)  
  - **Future Benefits** (revenue, audience, strategic goals)  
  - **Past Spending** (stated once, then ignored)  
  - **Partners/Donors** (names, contracts, commitments)  

  ---

  **Procedure Steps**  
  *(Facilitator guides; Scribe records answers on template)*  

  1. **☑️ STEP 1: Is Continuing Impossible?** (5 min/project)  
     - *Question:* "Is there a legal, existential, or ethical reason we **must** finish (e.g., signed contract, safety risk)?"  
     - **Stop if YES** → *Recommendation: CONTINUE*  
     - *Example (Database):* Vendor contract penalties? If no → Move to Step 2.  
     - *Sufficient Answer:* Specific clause in contract or undisputed fact.  

  2. **⚠️ STEP 2: Flag Sunk Cost Arguments** (10 min)  
     - *Rule:* "Money spent is irrelevant. If anyone cites ‘wasted investment,’ note it as *invalid* and move on."  
     - *Scribe:* Records "Sunk cost argument raised" but **does not** include in decision factors.  
     - *Why:* Purges logical fallacy from discussion.  

  3. **🔍 STEP 3: Valid Past-Linked Factors** (15 min/project)  
     Assess **only** these four categories. *Require evidence:*  
     - **A. Reputational Harm**  
       *Question:* "Will stopping *actively damage trust* with named partners/donors? Who, and how?"  
       *Sufficient Answer:* "Donor X funded Phase 1; they publicly championed this."  
       *Not Sufficient:* "People might lose faith."  
     - **B. Restart Costs**  
       *Question:* "If stopped, how much extra $/time to restart later? Quantify."  
       *Sufficient Answer:* "Vendor says remobilization fee: $5k."  
     - **C. Embedded Information**  
       *Question:* "Did past spending reveal critical new info (e.g., ‘we now know the database won’t integrate’)"?  
       *Sufficient Answer:* Documented discovery (e.g., "Vendor demo proved incompatibility").  
     - **D. Partner/Staff Impact**  
       *Question:* "Will stopping breach a written agreement or cause key staff/partner resignations?"  
       *Sufficient Answer:* "Theater partner contract requires 90-day exit notice + $2k penalty."  

  4. **📊 STEP 4: Future Math** (10 min/project)  
     - *Question:* "With all valid past factors noted, do FUTURE BENEFITS > FUTURE COSTS?"  
     - *Include:* Quantifiable benefits (ticket sales, grant eligibility) and costs (labor, materials).  
     - *Exclude:* Sunk costs, vague reputational fears.  
     - *Sufficient Answer:* "Festival loses $3k/year but attracts sponsors worth $10k."  

  5. **🎯 DECISION POINT**  
     - **CONTINUE if:**  
       - Step 1 demands it OR  
       - Future benefits > costs (Step 4) **and** past factors don’t outweigh this.  
     - **STOP if:**  
       - Future costs > benefits (Step 4) **and** past factors are weak.  
     - **VALUES VOTE if:**  
       - Future costs > benefits, **but** past factors are strong OR  
       - Future math is neutral, but community impact is debated.  

  6. **✍️ RECORD & RATIONALE** (5 min/project)  
     Scribe completes template:  
     ``` 
     Project: [Name]  
     Decision: [Continue/Stop]  
     Why: 
     - Valid past factors: [A/B/C/D from Step 3] 
     - Future math: [Costs $X / Benefits $Y] 
     - Values call? [Yes/No] 
     ```  

  ---

  ### **Applied to Your Cases**  
  **1. Database Migration (60% complete, costs ballooning)**  
  - *Step 1:* No legal mandate → Continue.  
  - *Step 3:*  
    - **Restart costs:** High (new vendor search, data loss risk).  
    - **Embedded info:** Past work revealed customization needs.  
  - *Step 4:* Future benefits (efficiency, grants) likely > $20k completion cost? *If yes → CONTINUE*.  
  - *Misfire risk:* Overestimating restart costs if new vendors are affordable.  

  **2. Co-Production (Behind schedule, undersold)**  
  - *Step 1:* No mandate → Continue.  
  - *Step 3:*  
    - **Reputational harm:** Specific theater partner may distrust future collabs.  
    - **Staff impact:** Morale dip if canceled.  
  - *Step 4:* Future costs (marketing, labor) > benefits (low ticket sales)? *Likely YES → STOP*.  
  - *Values vote?* Only if partner relationship is irreplaceable.  
  - *Against intuition:* Board might want to "save face" but procedure recommends STOP.  

  **3. Winter Festival (Loses $3k, community loves it)**  
  - *Step 1:* No mandate → Continue.  
  - *Step 3:* **Reputational harm** if canceled (named donors, public backlash).  
  - *Step 4:* Future costs > benefits (quantifiable).  
  - *→ VALUES VOTE required:* "Is community goodwill worth $3k/year?"  
  - *Judgment call:* "Community attachment" isn’t quantifiable → Forces explicit values debate.  
  - *Honest misfire:* Might save the festival despite financial logic, but that’s the point.  

  ---

  ### **Where This Bends or Breaks**  
  - **Reputational harm is subjective:** Naming specific stakeholders helps, but "how much trust is lost?" is a judgment call.  
  - **Restart costs can be gamed:** Staff/vendors may inflate estimates to keep projects alive.  
  - **Values votes favor status quo:** Boards often default to "continue" to avoid hard choices.  
  - **The festival trap:** Your procedure might *recommend* stopping the festival due to negative future math, forcing a values vote. This could conflict with **your** preference to keep it, exposing bias toward financials.  

  ---

  ### **Why This Works for Your Board**  
  - **Trains out sunk costs:** Step 2 shuts down bad arguments.  
  - **Forces specificity:** No "what ifs" without evidence.  
  - **Contains time:** Strict categories prevent rambling.  
  - **Documents rationale:** Audit trail for donors/accountability.  
  - **Respects values:** Isolates when money shouldn’t decide.  

  Run this quarterly, and within a year, your board will intuitively separate past commitments from fallacy—making meetings faster and more principled.
