prompt: |-
  I run a small cleaning business and I've been trying to write a proper operations manual for my crew, and its driving me nuts. Every time I change one part of a procedure — say, which cleaner we use on hardwood floors — I have to go through the entire document and make sure every other section that references it is updated, and I keep missing things. It feels like I'm rewriting the whole manual just to change one line. I read somwhere that AI researchers ran into this exact wall decades ago when they first tried to get computers to reason about the physical world — the problem that it's really hard to specify all the stuff that DOESN'T change when you do something — and that it's still considered a genuinely hard problem. So I'm wondering: is my pain just inherent to writing a manual, or is there a smarter way to structure the document so I only have to write down what actually changed? And if I do switch to that style, what new problems am I signing up for? Could you answer in exactly five numbered points, each just a sentence or two, and skip any intro or wrap-up?
reasoning: |-
  Hmm, the user runs a small cleaning business and is struggling with creating an operations manual. Every time they update one procedure—like changing a cleaner for hardwood floors—they have to manually hunt down every reference to it throughout the document. This is frustrating and error-prone because they keep missing things, making them feel like they're rewriting the whole manual for minor changes.

  They mention that this problem reminds them of something from AI history, where researchers faced similar challenges in getting computers to reason about the physical world. Specifically, the difficulty lies in specifying what doesn't change when you modify something—an issue known as the "frame problem" in AI, which is still considered hard. This shows they've done some research and understand the underlying complexity, which makes their query insightful.

  Their core question is whether this pain is unavoidable in manual writing or if there's a smarter way to structure the document so updates are isolated. They also want to know the trade-offs of switching to such a structure. They've asked for exactly five numbered points, no intro or wrap-up, so I need to be concise and direct.

  Breaking down their needs: they need efficiency in documentation, reduced errors, and scalability as their business grows. Deeper unspoken needs might include saving time to focus on other aspects of their business, reducing stress from constant revisions, and ensuring consistency in training their crew to maintain service quality. They might also be worried about the learning curve if they adopt a new method, or how it could affect usability for their team.

  I recall that in technical documentation, modular approaches like using variables or references can help. For instance, defining core elements—like products or procedures—in one place and referencing them elsewhere. That way, changes only need to be made once. Tools like wikis or specialized software support this through hyperlinks or templates, which could solve their problem.

  However, there are downsides. If they switch to this style, they might face new challenges: initial setup could be time-consuming, requiring them to restructure the manual into modules. Crew members might find it harder to navigate if they're used to linear documents, as jumping between sections could confuse them. Also, maintaining the system requires discipline—like not duplicating content—which adds overhead.

  In my response, I'll cover both the solution and the trade-offs. I'll structure it in five points: the inherent nature of the problem, the modular solution, the tools that help, the new problems like complexity and navigation, and the risk of dependency errors. This directly answers their query while staying within the constraints.

  Finally, I'm emphasizing that while this approach reduces rewriting, it introduces new management tasks. This should help them make an informed decision based on their business needs.
answer: |-
  Here are five points addressing your question:

  1.  **Yes, the pain of cascading updates is inherent to traditional linear manuals because changing a core element requires manually finding every dependent reference.**  
  2.  **Adopt a "single source of truth" structure: define key elements (like products, procedures, tools) in dedicated master sections and reference them elsewhere using links, variables, or placeholders.**  
  3.  **Use documentation tools (like wikis, advanced word processors, or dedicated software) that support dynamic linking and variables, so changing the master entry automatically updates all references.**  
  4.  **This introduces new problems: increased initial setup complexity, potential difficulty for crew navigation (jumping between sections), and reliance on specific software.**  
  5.  **You also trade rewriting pain for dependency management overhead; broken links or forgotten references become the new failure mode if the structure isn't meticulously maintained.**
