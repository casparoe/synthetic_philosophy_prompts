  ## The Shifting Sands of Normalcy: Why Baseline Drift Sinks the Normal-Function Criterion

  The quest to draw a clear, objective line between therapy and enhancement in bioethics is perennial and fraught. The "normal-function criterion" (NFC), appealing in its biological grounding, proposes a seemingly simple answer: therapy restores a function to the species-typical range; enhancement pushes it beyond. Yet, a persistent shadow haunts this criterion, less discussed than vagueness or individual variation but arguably more corrosive: **baseline drift**. The very act of widespread enhancement *shifts* the species-typical range, recategorizing yesterday's enhancement as today's therapy. This temporal instability doesn't just make the line hard to draw; it fundamentally undermines the NFC's claim to provide an objective, stable foundation for the moral distinction its proponents seek. While proponents offer replies, they either anchor the line arbitrarily or concede its non-objective, pragmatic nature, effectively abandoning the core promise of the NFC.

  **The Drift Problem: Unpacking the Instability**
  Imagine a world where safe, effective cognitive enhancers become commonplace. Initially, taking a drug to achieve sustained focus for 10 hours might be considered an enhancement beyond the "typical" human capacity. But as adoption grows, the statistical distribution shifts. What was once the 95th percentile becomes the new median. Children growing up in this environment develop learning styles and societal expectations calibrated to this new norm. Suddenly, the *absence* of this enhanced focus becomes a deficit. The intervention that was once enhancement is now deemed necessary therapy for anyone falling below this new, elevated baseline. Memory, immune function, metabolic regulation – any capacity susceptible to widespread intervention faces this drift. The classification of an intervention isn't an inherent property; it's **historically contingent**, determined by the accident of *when* we ask the question. This renders the NFC inherently unstable as a moral compass.

  **Weighing the Replies: Anchors and Instruments**

  1.  **The Fixed Reference Point Reply:** "Anchor the baseline! Define the species-typical range *not* at time T, but at a fixed historical moment – say, 'pre-enhancement' humanity."
      *   **The Critique:** This reply fatally undermines the NFC's core appeal. *Which* historical moment is objective? Pre-civilization? Pre-agriculture? Pre-antibiotics? Pre-glasses? Each choice is arbitrary, reflecting a value judgment about which technologies "count" as altering our fundamental biology or which era represents "true" human nature. Is resistance to smallpox part of our "normal function" since vaccines are widespread, or was the pre-vaccine susceptibility the baseline? Furthermore, it ignores that humans are a self-transforming species. Our "normal" has always been influenced by fire, tools, agriculture, medicine – technologies that altered our functional capacities and ecological niche. Fixing a point denies this dynamism and imposes an arbitrary, static ideal of "natural" humanity that exists only as a philosophical construct, not a biological reality. Crucially, **it abandons objectivity for a concealed normative choice** about which historical state is morally privileged. The line is stabilized, but only by sacrificing the criterion's core claim to be grounded in objective biological facts rather than contestable historical preferences.

  2.  **The Pragmatic Instrument Reply:** "Drift is a feature, not a bug! The NFC was never meant to be a timeless moral boundary, but a practical tool for triage (e.g., prioritizing medical need), insurance coverage (what's 'medically necessary'), and regulation (approving drugs for disease). Tools *should* adapt to changing realities."
      *   **The Critique:** This is the strongest reply, acknowledging the reality of technological change and societal adaptation. It usefully highlights the NFC's practical regulatory utility. However, it constitutes a significant **retreat from the NFC's original ambitions**. Proponents often invoke the NFC to ground fundamental *moral* distinctions – arguing that enhancement is inherently riskier, more coercive, or more threatening to human dignity or equality than therapy. If the line drifts with adoption, these moral objections lose their footing. Why is pushing memory beyond the 2020 baseline fundamentally different, morally, from pushing it beyond the 2050 baseline, if both achieve the same absolute capacity? The pragmatic reply implicitly concedes that the distinction is **socially constructed, contingent, and value-laden**, not objectively grounded in biology. While useful for policy, it cannot bear the moral weight often placed upon it. The core idea of an "objective, non-arbitrary line" based on species-typical function is quietly abandoned in favor of a fluid, socially negotiated boundary.

  **Verdict: Drift as a Fatal Flaw**

  The baseline drift problem, **on its own**, demonstrates that the unmodified normal-function criterion **cannot** ground the therapy/enhancement distinction in the way its most philosophically ambitious proponents desire. It reveals a fundamental tension: the criterion seeks a timeless, objective biological truth ("species-typical function") to anchor a moral distinction, but the target of that truth – the statistical distribution of human capacities – is inherently mutable through the very interventions the criterion seeks to classify. Biology is dynamic, especially for a technological species.

  *   **Salvaging Attempts Fail:** The "fixed reference point" modification stabilizes the line only by injecting an arbitrary historical judgment, destroying the criterion's objectivity. The "pragmatic instrument" approach preserves utility but abandons the quest for an objective moral grounding, reducing the NFC to a useful convention, not a deep ethical truth.
  *   **Core Idea Abandoned:** Any modification that stops the drift either relies on a non-biological, normative anchor (contradicting the core idea) or accepts that the line is societal and contingent (also contradicting the core idea of an objective biological line).

  **Beyond the Wreckage: Surviving Motivations and New Directions**

  The failure of the NFC as an objective grounding does not mean the motivations behind the therapy/enhancement distinction disappear. They persist but must be pursued differently:

  1.  **Motivations that Survive:**
      *   **Prioritizing Need:** The impulse to prioritize treating suffering and dysfunction over improving the already-adequate remains powerful. This shifts focus from "normal function" to concepts like **harm, suffering, or significant impairment of opportunity**.
      *   **Managing Risk & Access:** Concerns about safety, coercion, fairness in access, and exacerbating social inequalities are crucial and apply to *any* powerful biotechnological intervention, whether labeled therapy or enhancement.
      *   **Regulatory Pragmatism:** The need for practical tools to allocate medical resources, define insurance coverage, and regulate novel technologies persists, even if the line is acknowledged as somewhat fluid and value-laden.

  2.  **Towards New Criteria?** The surviving motivations point towards frameworks less reliant on a mythical, static biological norm:
      *   **Welfare/Well-being:** Focusing on whether an intervention relieves suffering or significantly improves well-being (considering both physical/mental health and life opportunities).
      *   **Capabilities Approach:** Assessing whether an intervention restores or provides individuals with core capabilities necessary for functioning in society (e.g., health, senses, thought, affiliation).
      *   **Social Consequences & Justice:** Evaluating interventions based on their societal impact – potential for coercion (social or economic), fairness of access, impact on social cohesion, and effects on our understanding of human flourishing. Does the intervention promote fair equality of opportunity?
      *   **Contextual Assessment:** Recognizing that the ethical evaluation often depends heavily on the specific context – the individual's situation, the safety profile, the societal pressures, and the available alternatives – rather than an abstract categorization.

  **Conclusion**

  The quiet erosion caused by baseline drift is fatal to the normal-function criterion's aspiration to provide an objective, timeless, biologically grounded line between therapy and enhancement. The shifting sands of "species-typical" expose the criterion's core weakness: it tries to anchor ethics in a biological reality that is inherently unstable under technological pressure. While pragmatic uses of the distinction for regulation and resource allocation may persist – necessarily adapting to changing norms – the dream of a clear, objective, biologically-rooted moral boundary evaporates. The profound ethical questions surrounding human modification remain urgent, but they demand frameworks that embrace the dynamism of biology and technology, centering on human welfare, justice, societal consequences, and the ever-evolving question of what constitutes a good human life, rather than chasing a phantom of fixed biological normalcy. The line, if we insist on drawing one, must be drawn in the shifting terrain of human values and societal needs, not on the quicksand of a drifting baseline.
