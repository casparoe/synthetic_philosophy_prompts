prompt: |-
  I'm doing some reading on nuclear strategy for a project and I keep getting stuck on the US nuclear umbrella over its allies — the idea that if an adversary attacks a US ally, the US might respond with nuclear weapons, which is supposed to deter the attack in the first place. I'm trying to figure out what this practice actually presupposes about rationality and credibility, and I cant get it to cohere. For the deterrence to work, the adversary has to believe the US is rational enough not to start a nuclear war over a proxy conflict, but at the same time the US has to be willing, or at least appear willing, to risk its own cities to defend say Seoul or Berlin, which seems to require some kind of irrationality or a commitment that overrides self interest. So I'm confused: is the doctrine built on the idea that the US is a rational actor who has made a costly commitment, removing its own ability to back down, so the threat is credible even though the US wouldn't actually want to carry it out, or does it quietly rely on the adversary doubting the US's rationality? And does the same logic apply to the allies under the umbrella — does it actually make them safer, or does it just shift who bears the risk of escalation? Can you help me sort out what view of rationality and commitment this practice is really standing on, and whether those pieces fit together?
