answer: |-
  Here are ten interview questions designed to push beyond surface-level treatments of the discursive dilemma, probing its conceptual depth, practical implications, and institutional tensions, as per your specifications:

  1. **Conceptual Foundation**: "Your work distinguishes Kornhauser & Sager's 'doctrinal paradox' from List & Pettit's 'discursive dilemma'. Beyond the legal vs. general context, *why does formalizing it as a problem of aggregating judgments on logically interconnected propositions fundamentally alter the stakes*, especially for democratic theory?"  
     *(Targets the distinction’s significance beyond relabeling)*

  2. **Axiomatic Trade-offs**: "The impossibility theorem shows no aggregation rule satisfies universal domain, collective rationality, and systematicity simultaneously. In real-world committees, *which axiom is most often implicitly sacrificed?* And what are the *concrete institutional or epistemic costs* of that sacrifice?"  
     *(Forces specification of the "pragmatic" axiom drop & its consequences)*

  3. **The Unpalatable Rule**: "If we prioritize consistency by dropping systematicity—requiring votes on some propositions to depend on others—what would such a non-systematic rule *actually look like in a contentious committee setting?* Could members tolerate losing the 'issue-by-issue majority will' ideal, or would it feel like technocratic manipulation?"  
     *(Demands description of practical implementation & legitimacy perception)*

  4. **Premise vs. Conclusion-Based Approaches**: "You’ve argued the choice between premise-based (PB) and conclusion-based (CB) voting 'depends on the agenda's logical structure.' Can you describe *a concrete, non-trivial agenda structure where PB and CB yield starkly different outcomes*, and explain *why the logic itself—not just values—drives this divergence?*"  
     *(Requires a substantive example demonstrating structural dependence)*

  5. **Hidden Premises & Agenda Control**: "In complex decisions, the 'premises' are often contested or implicit. How does PB voting handle *logical dependencies that aren’t formally on the ballot*? Doesn’t this make agenda-setters de facto arbiters of rationality?"  
     *(Probes epistemic vulnerability in agenda construction)*

  6. **Path-Dependence & Dynamic Agendas**: "Agendas are rarely static. If propositions are voted sequentially, *how does path-dependence interact with the dilemma?* Can chairs exploit order effects to 'steer' consistent outcomes, and does this undermine the normative appeal of PB/CB approaches?"  
     *(Links temporal structure to strategic manipulation)*

  7. **Impossibility as Institutional Design Catalyst**: "Rather than seeing the impossibility theorem as a pessimistic limit, can it be *a generative tool for designing better deliberation*? What institutional innovations (e.g., staged voting, expert review of consistency) might mitigate the dilemma while respecting democratic constraints?"  
     *(Shifts focus to constructive responses)*

  8. **Legitimacy Under Logical Uncertainty**: "When a committee outputs an inconsistent judgment, is the problem *merely technical* (a correctable 'bug'), or does it reveal a *deeper legitimacy deficit*—suggesting the collective lacks the capacity to hold rational agency? How does your view change if the inconsistency goes unnoticed?"  
     *(Tests the threat to legitimacy thesis)*

  9. **Agenda Control as Power**: "If agenda-setters can structure propositions to induce or avoid inconsistencies via strategic fragmentation/connection of issues, *doesn’t this make the discursive dilemma a weaponizable feature, not just a bug?* What safeguards exist against this in real legislatures or boards?"  
     *(Directly confronts agenda control’s transformative impact on the dilemma’s significance)*

  10. **Beyond Majority Rule**: "The dilemma arises under majority voting on propositions. But if we abandon binary majority rule—adopting supermajorities, fuzzy logic, or scalar degrees of belief—does the *core problem dissolve, or merely morph?* Where does judgment aggregation theory draw the line between 'solving' and 'displacing' the dilemma?"  
      *(Challenges the inevitability of the paradox under alternative frameworks)*

  ### Why this structure works
  - **Doctrinal/Discursive Distinction**: Question 1 forces clarification of why formalization matters (e.g., doctrinal paradox treats "conclusion" as given; discursive dilemma exposes agenda relativity).
  - **Impossibility Nuance**: Questions 2-3 demand specificity on *which* axiom is dropped (systematicity), its costs (loss of issue-by-issue accountability), and the unpalatability of non-systematic rules (e.g., premise hierarchies needing prior technocratic validation).
  - **Agenda Structure Dependence**: Question 4 requires a real example (e.g., multi-stage policy with intermediate implications; agendas with interlocking negations). Follow-ups (5-6) show how agenda control and path-dependence make this dependence politically charged.
  - **Legitimacy + Agenda Control**: Questions 8-9 reframe the dilemma as a power-laden institutional vulnerability. The key insight: **Unchecked agenda control transforms the dilemma from a curiosity into an engine of manufactured inconsistency or covert steering**.

  ### Tips for the Interview
  - **Push on "Depends on the structure"**: If she gives a vague answer to Q4, ask: "Can you simulate a 3-member vote on that agenda to show PB and CB diverging *because of the logical constraints*?"
  - **Stress Test Trade-offs**: For Q3, ask: "Would scientists on a grant review panel accept a rule overriding their majority vote on a premise because it conflicted with another? Would politicians?"
  - **Link to Real Cases**: Note if her work references specific institutions (e.g., ECB committees, constitutional courts) and ask how agenda control manifests there.

  This line of questioning exposes the dilemma not as a puzzle but as a lens on institutional power, rational agency, and the fragility of collective reason—core concerns for both political theory and democratic practice. Good luck!
