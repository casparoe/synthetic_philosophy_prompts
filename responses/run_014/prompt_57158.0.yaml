prompt: |-
  I am preparing a two-day methods workshop for a national statistics office. Its ministers have asked whether the office should add a life-evaluation item to the household survey — the sort of question that asks respondents to picture a ladder whose top rung is the best possible life for them and whose bottom rung is the worst, and to say where they stand — on the grounds that this is what the best-known international ranking of national happiness is built from. Half my participants are survey methodologists who think about scale construction all day and have never read a page of welfare theory; the other half are policy advisers who use the word happiness casually and have never thought about scale construction. Last year I ran a version of this workshop and discovered that the two camps talk past each other in exactly one way: everyone who doubts the instrument ends up standing next to everyone who doubts that happiness is a proper aim of government, and the two doubts have nothing to do with one another. This year I want to separate them, in public, on the first afternoon.

  Please write a decision tree that sorts my participants by what they actually believe about such a number, ending at a named position. Two documents: first, the participant handout, which is nothing but numbered questions; second, the key, which maps answer patterns onto positions.

  The requirements:

  1. Build the tree from the logical space rather than from a list of views. Begin by stating the axes you take to be in play — at minimum, what happiness is (occurrent pleasant experience; a global judgment that one's life is going well; satisfaction of informed preferences; an objective-list matter of how well a life is going, whatever it feels like from inside), whether a self-report has any special authority over the thing in question, whether one population's ladder scores are comparable to another population's at all, and what a state should do with the measure once it has one. Then say explicitly whether these axes are independent, and drop, split, or add any that you think I have gotten wrong.

  2. Treat the last axis as two. A country can want to raise its citizens' happiness, and it can separately want to climb an ordinal table comparing it to other countries; the second aim has properties the first lacks, and I want a node that forces the distinction rather than letting participants slide from one to the other.

  3. Phrase every node as a concrete case that a participant can answer without knowing which way it points. Do not ask anyone whether they are a hedonist or a Goodhart skeptic. At least four nodes must be built from material of the following kind: a pilot in which the same sample scored an average of 1.4 points higher when the top of the ladder was worded as the best life they could personally hope for than when it was worded as the best possible life; a district office given an annual happiness target and subsequently measured as having met it; a population that endured a severe recession, recovered economically within a decade, and reported lower ladder scores than a comparable population that never suffered the shock; and a case in which a country gains two places in the ranking by moving its survey from face-to-face interviews to telephone interviews, with no change in anyone's life.

  4. The leaves must include, at minimum: a view on which the ladder measures something real but is not happiness, and is nonetheless the best political indicator available; a view on which affect measured close to the moment is the only honest target and retrospective ladder items are confabulation; a view on which the ranking is not even ordinal-comparable across populations, so that no cross-country policy conclusion follows from it; a view on which the measure is a tolerable diagnostic and a corrupting target; a view on which the state should track happiness but not promote it, because promotion violates the separaten of persons' own judgments about what makes a life go well — reconstruct that position carefully rather than borrowing its slogan; and a view on which a country should aim to top the ranking precisely because the ranking is a public, contestable scoreboard and opacity is worse than distortion.

  5. After the tree, give the combination grid: for each leaf of the logical space your axes permit, say whether it is occupied, and for at least three unoccupied cells diagnose the absence — incoherent, coherent but unattractive, or simply unexplored, with the reason in each case.

  6. Flag at least two pairs of leaves your tree cannot actually separate, say what further question would separate them, and say whether a lay participant could answer that question honestly.

  7. Justify the order of your nodes. Where an earlier answer makes a later question moot or changes its meaning, say so, and tell me how to run the sequence live with forty people and one whiteboard.

  Please do not include readings, citations, or a bibliography, and do not narrate the history of the debate. Aim for roughly 1,300 words in total.
reasoning: |-
  Hmm, the user is asking me to design a decision tree for a methods workshop at a national statistics office. They want to help participants clarify their positions on whether to include a life-evaluation item in household surveys, like the "ladder" question used in global happiness rankings.

  The user has very specific requirements. I need to build this from logical axes rather than predefined views, covering dimensions like what happiness is, whether self-reports have authority, cross-population comparability, and state usage. I should treat the last axis as two separate dimensions: raising happiness versus climbing rankings. All nodes must be concrete cases that participants can answer without technical jargon.

  From the requirements, I need to include specific scenarios: wording effects (1.4 point difference in ladder scores), target corruption (district meeting happiness targets), hysteresis effects (recession recovery with lower scores), and measurement artifact effects (ranking changes due to survey mode). The final positions need to cover at least six distinct views including positions where the ladder measures something useful but isn't happiness, where only affect matters, where cross-country comparisons are invalid, and others.

  I'll structure this with axes: happiness conception (affect, evaluation, preference, objective); self-report authority (yes/no); cross-pop comparability (cardinal, ordinal, none); state action (none, track, promote nationally, climb rankings). I'll make these independent except where logically constrained.

  For the decision tree itself, I'll order questions to first separate fundamental disagreements before tactical ones. I'll start with the recession case to test hysteresis effects, then wording effects to probe construct validity. Then I'll use target corruption to examine measurement distortion, and survey mode changes to test cross-pop comparability. Finally, I'll separate tracking from promotion and promotion from rankings-climbing.

  For the combination grid, I'll note occupied positions and diagnose why some cells are empty - like combinations that are incoherent (e.g., "objective happiness with self-report authority") or unexplored. I'll also identify pairs the tree can't distinguish and suggest follow-up questions.

  The handout will just list the concrete cases as questions, while the key will map answer patterns to named positions. This should help participants see where their true disagreements lie rather than talking past each other. The whole structure should fit within about 1,300 words as requested.
answer: |-
  ## Workshop Materials: Decision Tree for Life-Evaluation Measurement

  **Participant Handout (Decision Tree Questions)**

  1.  **Country A & B:** Both countries are culturally similar. Country A endured a severe recession 10 years ago but has fully recovered economically (GDP, employment back to pre-recession levels). Country B avoided the recession. Today, Country A reports significantly *lower* average ladder scores (e.g., 5.2 vs 6.8) than Country B. Survey methods are identical. Does this difference *necessarily* mean people in Country A are currently experiencing worse lives (all things considered) than people in Country B? (Yes / No / Unsure)
  2.  **Wording Pilot:** In a pilot test using the same representative sample, the average ladder score was 1.4 points higher when the top rung was described as "the best possible life **you could personally hope for**" compared to "the best possible life". No other changes were made. Does this difference indicate the two versions are measuring *fundamentally different things*? (Yes / No / Unsure)
  3.  **District Target:** A district office was set an annual target to raise its average ladder score by 0.5 points. The following year, its measured average score increased by 0.6 points. Subsequent investigation found the district had focused heavily on promoting positive survey responses, including reminder campaigns about the survey's importance and framing the ladder question in highly aspirational terms during interviews. No other significant policy changes occurred. Does meeting the target here *prove* the district improved citizens' actual well-being? (Yes / No / Unsure)
  4.  **Survey Mode Shift:** Country X switched its national survey from face-to-face interviews to telephone interviews. All question wordings remained identical. Following the switch, Country X's average ladder score increased sufficiently to move it up two places in the international happiness ranking compared to countries using face-to-face. No major life changes occurred for citizens during this period. Does this ranking change *validly* indicate Country X's population became happier relative to the others? (Yes / No / Unsure)
  5.  **Tracking vs. Promoting:** Should the national statistics office publish the *national average* ladder score annually as an official statistic, *regardless* of whether the government intends to use it as a goal? (Yes / No / Unsure)
  6.  **Promoting vs. Ranking:** If the government *does* set a goal to raise the national average ladder score, should it *also* actively pursue moving up in the international happiness ranking, even if this involves actions *only* affecting the measurement (like changing survey mode or wording) rather than changing lives? (Yes / No / Unsure)

  ---

  **Key: Mapping Answer Patterns to Named Positions**

  **Logical Axes & Independence:**
  1.  **H Conception:** What is "happiness"? (Affect: Momentary feelings; Evaluation: Retrospective life judgment; Preference: Satisfying informed desires; Objective: Meeting external well-being criteria).
  2.  **Self-Report Authority (SRA):** Does a self-report (like the ladder) have privileged authority in measuring the relevant conception? (Yes/No).
  3.  **Cross-Pop Comparability (CPC):** Can ladder scores be meaningfully compared *across* different populations/countries? (Cardinal: Differences in magnitude matter; Ordinal: Only rankings matter; None: Not comparable).
  4.  **State Action - Domestic Goal (SAd):** Should the state *use* the measure domestically? (None: Don't use; Track: Publish only; Promote: Actively try to raise the score).
  5.  **State Action - Ranking Goal (SAr):** Should the state actively try to *improve its position* in the international ranking? (Yes/No). *(Note: SAd and SAr are treated as distinct axes, as required. CPC constrains SAr: If CPC=None, SAr=No is logically forced. SRA significantly influences feasibility of SAd and SAr.)*

  **Decision Tree Key:**

  1.  **Answer to Q1 (Recession Hysteresis):**
      *   **Yes:** Leans towards *Affect* or *Objective* conceptions (current state is paramount). Leans against *Evaluation* (judgment influenced by past).
      *   **No:** Leans towards *Evaluation* conception (judgment incorporates narrative/past). Leans against strong *Affect* primacy.
      *   **Unsure:** Ambiguous; proceed.
  2.  **Answer to Q2 (Wording Effect):**
      *   **Yes:** Leans against strong *SRA* and universal *CPC* (measure sensitive to framing). Leans towards *Preference* or *Evaluation* being fragile/highly contextual.
      *   **No:** Leans towards strong *SRA* and *Cardinal CPC* (frame doesn't change core construct). Leans towards *Objective* or robust *Evaluation*.
      *   **Unsure:** Ambiguous; proceed.
  3.  **Answer to Q3 (Target Corruption):**
      *   **Yes:** Leans towards strong *SRA* and feasibility of *SAd=Promote* (measure is robust). Unlikely *Goodhart Skeptic*.
      *   **No:** Leans against *SRA* for *Promote*, or against *Cardinal CPC*. Leans towards *Goodhart Skepticism* or *Diagnostic Only*. Highly likely if answered "No" to Q2.
      *   **Unsure:** Ambiguous; proceed.
  4.  **Answer to Q4 (Mode Shift Artifact):**
      *   **Yes:** Leans towards *Ordinal CPC* or *Cardinal CPC* (artifact irrelevant or minor). Leans towards feasibility of *SAr*.
      *   **No:** Leans towards *CPC=None* or *Ordinal CPC is invalid*. Leans strongly against *SAr* feasibility. Highly likely if answered "Yes" to Q2 or "No" to Q3.
      *   **Unsure:** Ambiguous; proceed.
  5.  **Answer to Q5 (Tracking vs. Promoting):**
      *   **Yes:** Leans towards *SAd=Track* or *SAd=Promote*. Accepts *SRA* at least for description. Leans against strong *Anti-Measurement* view.
      *   **No:** Leans towards *SAd=None*. Either rejects *SRA* entirely or sees danger even in tracking. Leans towards *Anti-Paternalism* or *Incommensurability*.
      *   **Unsure:** Ambiguous; proceed.
  6.  **Answer to Q6 (Promoting vs. Ranking):**
      *   **Yes:** Leans towards *SAr=Yes*. Values the public ranking itself, often prioritizing visibility/competition over pure domestic welfare gain. *Scoreboard Enthusiast*.
      *   **No:** Leans towards *SAr=No* even if *SAd=Promote*. Sees ranking pursuit as distinct and potentially corrupting/distracting. *Domestic Focus*.
      *   **Unsure:** Ambiguous; likely *Domestic Focus* or *SAd=None*.

  **Named Positions (Leaves):**

  *   **A: Affective Purist:** (Q1:Yes, Q2:Yes, Q5:No/Unsure) Happiness *is* affect; retrospective ladders are confabulation. State shouldn't track/promote this flawed measure. *(H:Affect, SRA:No for ladder, CPC:N/A, SAd:None, SAr:No)*
  *   **B: Goodhart Skeptic / Diagnostic Only:** (Q3:No, Q4:No/Unsure, Q5:Yes, Q6:No) Ladder measures *something* useful (maybe evaluation, maybe something else) for *description* (SAd:Track), but targeting it (SAd:Promote/SAr) corrupts the measure and distorts policy. *(H:Often Eval/Pref, SRA:Weak/Contextual, CPC:Ordinal/None, SAd:Track, SAr:No)*
  *   **C: Objective List Advocate (Skeptical of Measure):** (Q1:Yes/Unsure, Q2:Yes, Q3:No/Unsure, Q5:No) True well-being is objective (health, autonomy, relationships). The ladder *might* correlate weakly but has no special authority (SRA:No). State should focus on objective indicators, not promote ladder scores. *(H:Objective, SRA:No, CPC:None, SAd:None, SAr:No)*
  *   **D: Evaluative Realist (Promote Domestically):** (Q1:No, Q2:No, Q3:Yes/Unsure, Q4:Yes/Unsure, Q5:Yes, Q6:No) Ladder validly captures life evaluation (H:Eval) with good SRA. CPC is reasonable (Cardinal/Ordinal). State should track *and* promote the domestic score (SAd:Promote) to improve lives, but ignore/manipulating the ranking (SAr) is invalid/distracting. *(H:Eval, SRA:Yes, CPC:Cardinal/Ordinal, SAd:Promote, SAr:No)*
  *   **E: Ranking Climber (Scoreboard Enthusiast):** (Q4:Yes/Unsure, Q6:Yes) The international ranking is a valuable public scoreboard. State should actively pursue climbing it (SAr:Yes), even if tactics include optimizing measurement, because transparency and competition are beneficial, and the *perception* of success matters. *(Often assumes CPC:Ordinal, SAd:Promote/Track, H:Varies - focuses on SAr)*
  *   **F: Anti-Paternalist (Track but Don't Promote):** (Q5:Yes, Q6:No, Often Q2:Yes/Unsure, Q3:No) The ladder reflects individual judgments (H:Eval/Pref) worth *tracking* (SRA:Yes for Track). However, the state *promoting* a higher score (SAd:Promote) disrespects citizens' own diverse conceptions of a good life and risks paternalism. Tracking informs, promoting imposes. *(H:Eval/Pref, SRA:Yes for Track, CPC:Varies, SAd:Track, SAr:No)*
  *   **G: Incommensurabilist:** (Q4:No, Q5:No/Unsure) Ladder scores are fundamentally *not comparable* across populations (CPC:None), making both domestic promotion (especially using intl benchmarks) and ranking pursuits meaningless or misleading. Focus on local/narrative understanding. *(CPC:None, SAd:None/Track (locally only?), SAr:No, H:Often Eval/Pref but context-bound, SRA:Weak)*
  *   **H: Preference Satisfactionist (Measure Proxy):** (Q1:Unsure/No, Q2:Yes/Unsure, Q3:No, Q5:Yes, Q6:No) True goal is satisfying informed preferences. The ladder isn't happiness itself (H:Pref) but is the best *available, measurable proxy* for policy purposes. Track it as a diagnostic, but targeting it directly is risky (Goodhart). *(H:Pref, SRA:Weak (proxy only), CPC:Ordinal/Cardinal (for proxy), SAd:Track, SAr:No)*

  **Combination Grid Diagnosis (H-Conception x SRA x CPC x SAd x SAr)**

  *   **Occupied:** See Leaves A-H above. Key unlisted but occupied: Strong Cardinal CPC + SAd:Promote (Implied in D if CPC:Cardinal).
  *   **Unoccupied Cells & Diagnoses:**
      1.  **H:Objective + SRA:Yes + CPC:Cardinal + SAd:Promote + SAr:Yes:** *Incoherent.* If happiness is purely objective (e.g., health, virtue), self-reports cannot have *privileged* authority (SRA:Yes) over expert assessment of those objective criteria. Promoting a self-report score for an objective state is inconsistent.
      2.  **H:Affect + SRA:Yes + CPC:Cardinal + SAd:Track + SAr:No:** *Coherent but Unattractive/Unexplored?* If affect is the true target and self-reports (like ladders) are authoritative for it (despite Q2 evidence), then tracking makes sense. However, the evidence (Q1, Q2) strongly challenges SRA:Yes for ladders measuring affect, making this position empirically weak. It's logically possible but poorly supported, hence unexplored as a distinct leaf.
      3.  **H:Preference + SRA:Yes + CPC:None + SAd:Promote + SAr:No:** *Incoherent.* If CPC:None, the measure cannot be compared *even within a population over time* in a cardinal way that promotion requires (what does +0.5 mean if no scale anchors exist?). SAd:Promote requires cardinal interpretability domestically. CPC:None precludes this.

  **Indistinguishable Pairs & Separating Questions:**

  1.  **Distinguishing "Goodhart Skeptic" (B) from "Preference Satisfactionist (Proxy)" (H):** Both often answer Q3:No, Q5:Yes, Q6:No. They differ on *what the ladder represents*.
      *   **Separating Question:** "If research showed the ladder score correlated *very poorly* with direct measures of preference satisfaction (e.g., achieved life goals, congruence with stated values), but correlated *very well* with a separate measure of positive mood over the past month, would you still consider it a valuable indicator for policy tracking?" (Yes = Leans B / Evaluation or Affect; No = Leans H / Preference Proxy)
      *   **Lay Honesty:** Yes, participants can grasp the hypothetical correlation evidence and answer honestly based on their conceptual priority (evaluation/affect vs. preference).
  2.  **Distinguishing "Anti-Paternalist" (F) from "Evaluative Realist (Promote)" (D):** Both might answer Q5:Yes. They differ on SAd:Promote vs Track.
      *   **Separating Question:** "Imagine the national average ladder score declines significantly. Should the government be obliged to investigate the causes and potentially *change policies* specifically aimed at reversing this decline?" (Yes = Leans D / Promote; No = Leans F / Track Only - investigation yes, but policy change aimed *specifically* at the score is paternalistic)
      *   **Lay Honesty:** Yes. Participants can understand the distinction between investigating a trend and committing to policy action explicitly aimed at changing the measured number.

  **Node Order Justification & Workshop Flow:**

  1.  **Q1 (Recession):** Tests core conception (H) and the stability/authority of the evaluation. Early to separate affect/objective (Yes) from evaluation (No). Sets the stage for validity doubts.
  2.  **Q2 (Wording):** Directly challenges SRA and CPC. Builds on Q1's potential doubt. A "Yes" here fundamentally undermines strong claims about the measure's robustness, crucial before discussing use.
  3.  **Q3 (Target):** Tests the feasibility and risk of SAd:Promote, given Q1/Q2 results. If SRA/CPC are weak (Q2:Yes, Q1:Yes/No), "No" is likely. Essential before asking *if* the state should use it (Q5).
  4.  **Q4 (Mode Shift):** Directly tests CPC, especially for ranking (SAr). Relies on understanding measurement artifact risks (reinforced by Q2/Q3). Makes Q6 meaningful.
  5.  **Q5 (Track):** Now asks about basic *statistical* use, given prior doubts. Separates fundamental rejection (No) from acceptance for info (Yes). Prerequisite for Q6.
  6.  **Q6 (Ranking Goal):** Explicitly forces the SAd vs. SAr distinction, using the artifact risk highlighted in Q4. Only relevant if Q5 is Yes (or maybe Unsure).

  **Running Live (40 People, One Whiteboard):**
  1.  **Preparation:** Print Handout. Prepare Key & Grid privately. Whiteboard: Draw numbered columns 1-6.
  2.  **Process:** Read Q1 aloud. Ask participants to note their answer (Y/N/U). Poll publicly: "Raise hand for Yes... No... Unsure." Tally counts visibly in column 1. Briefly summarize implication ("Many of you think past shocks linger in judgments" / "Many think scores reflect current reality").
  3.  **Repeat:** Proceed sequentially through Q2-Q6, polling and tallying after each. **Crucially:** After each poll, *do not debate or reveal implications*. Simply state the observed split ("Interesting, quite divided on whether wording changes the construct" / "Strong consensus that meeting the target didn't prove well-being improved").
  4.  **Reveal & Discuss:** After Q6, reveal the Key. Explain the axes briefly. Guide participants to map *their own* answer pattern (Y/N/U sequence) to a Leaf (A-H). Encourage them to find others with the same pattern. Facilitate discussion *within* leaves first ("Group D, why does promotion make sense to you but not ranking pursuit?"), then *between* leaves ("Group B and Group D, where's your fundamental disagreement?"). Use the grid to highlight unexplored/incoherent spaces. Use the Indistinguishable Pairs & questions to probe deeper disagreements if needed. The tallies show where major splits occurred (e.g., a close split on Q2 highlights SRA/CPC as a major fault line).
