  I'm in a senior seminar on the history of analytic philosophy this term, and we've just worked through the diary entries Frege kept in the spring of 1924, which the editors of his Nachlass withheld from publication for decades and which now show him making explicit anti-Semitic and nationalist claims. I'd like you to argue for the following position: that these entries are not a private moral failure to be quarantined from his work, but a philosophically continuous development of the same objectivist commitments — anti-psychologism, the mind-independence of thoughts, and the context principle's idea that a part's meaning is fixed by its role in a whole — that drive his theory of sense and reference and his foundations of arithmetic. Make the argument precise about which of his doctrines the diary actually engages and which it does not, so that it does not collapse into the blanket claim that his entire philosophy is infected by his politics, and conclude by stating what this continuity does or does not change about the standing of the philosophical arguments themselves.
