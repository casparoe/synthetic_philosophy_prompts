answer: |-
  ### Brainstorm: Candidate Definitions and Borderline Cases  
  - **Core definitions**: Autocatalytic metabolism, hereditary replication, Darwinian evolution, organizational closure.  
  - **Borderline troublemakers**:  
    - *Viruses*: Replicate/evolve but no intrinsic metabolism.  
    - *Mitochondria*: Metabolic powerhouses but host-dependent.  
    - *Sterile mules*: Metabolic/reproductive machinery but no replication.  
    - *Tumor cells*: Replicate/evolve but subvert organismal goals.  
    - *Prions/viroids*: Replicate structurally but no metabolism/genes.  
    - *Fire*: Dissipative structure, autocatalytic (exothermic chain reactions), no heredity.  
    - *Self-replicating clay crystals*: Template replication, no metabolism.  
    - *Computer viruses*: Hereditary information + replication, no thermodynamics.  
    - *Minimal synthetic cells*: Engineered metabolism/replication, but simplified.  

  ---

  ### Translation: Philosophical Positions into Physical Vocabulary  
  **(Metabolism-First → Thermodynamic Dissipative Structures)**  
  - **Clean map**: Life as non-equilibrium steady state minimizing free energy, with autocatalytic cycles (e.g., ATP hydrolysis loops) boosting entropy production.  
  - **Fudges**: Fire fits perfectly—so must add *informational constraints* (e.g., catalytic specificity). Tumors fit too (high dissipation), violating "functional" metabolism.  
  - **Fails**: Cannot exclude hurricanes. No intrinsic handle on *heredity*; prions/viroids break the link to metabolic networks.  

  **(Replicator-First → High-Fidelity Information Channels)**  
  - **Clean map**: Life as error-corrected replication (e.g., DNA polymerase proofreading), with Shannon channel capacity >1 (inheritable information).  
  - **Fudges**: Computer viruses fit—so must add *thermodynamic grounding* (e.g., Landauer-bound erasure). Viroids fit (RNA templates), but lack metabolic error correction.  
  - **Fails**: Mules have replication machinery but no replication; mitochondria replicate but only within host constraints. Ignores energy constraints (parasitic replicators possible).  

  **(Evolutionary → Attractors in Fitness Landscapes)**  
  - **Clean map**: Life as dynamical systems with heritable variation + selection (fitness gradients), moving toward local attractors (adaptive peaks).  
  - **Fudges**: Requires defining "fitness" as a Lyapunov function (e.g., reproductive rate), but landscapes are dynamic and frequency-dependent.  
  - **Fails**: Sterile mules have no evolutionary future. Tumors evolve but disrupt higher-level functions. No distinction from evolutionary algorithms.  

  **(Autonomy → Organizational Closure in Reaction Networks)**  
  - **Clean map**: Life as self-bounding catalytic closure (e.g., Kauffman’s autocatalytic sets), maintaining homeostasis via control loops (e.g., feedback inhibition).  
  - **Fudges**: Mitochondria are semi-autonomous but depend on host for metabolites. Viruses lack closure.  
  - **Fails**: Cannot formally separate "self" from environment (e.g., gut microbiome). Transposons are internal parasites with no closure.  

  **(Additional: Information Integration → Computational Attractors)**  
  - **Clean map**: Life as integrated information processing (e.g., predictive coding minimizing surprise).  
  - **Fudges**: Maps to neural systems but overfits; bacterial chemotaxis fits minimally.  
  - **Fails**: Fire/computers process information; crystals encode structure. No threshold for "meaning".  

  ---

  ### Residue Report: What Doesn’t Survive Translation  
  1. **Normative Function/Purpose**:  
     - Physics describes *how* error correction works (e.g., kinetic proofreading), not *why* it "should" exist. Terms like "misrepair" imply a teleology absent in thermodynamics.  
     - **Why missing?** Your vocabulary lacks normative grounding. A prion’s replication is physically identical to "correct" protein folding—no objective "function".  

  2. **Agency/Goal-Directedness**:  
     - Control loops (e.g., homeostasis) are feedback-driven equilibria, not "goals". Attractors describe endpoints, not intention.  
     - **Why missing?** Physics has no operator for "ought". Chemotaxis minimizes free energy gradient—no "seeking".  

  3. **Individuality**:  
     - Boundaries (e.g., lipid membranes) are phase separations, but viruses/mitochondria blur the line. No physical principle defines "organism" vs. "part".  
     - **Why missing?** Individuality is scale-dependent. Tumors are genetic individuals but not functional ones.  

  4. **"Life as Process" vs. "Life as Entity"**:  
     - Your terms describe processes (entropy production, replication fidelity). But philosophical debates often treat life as a countable *thing* (e.g., "is a virus alive?").  
     - **Why substantive?** Physics avoids this by focusing on mechanisms, but loses categorical distinctions.  

  **Conclusion**: The translation succeeds in reducing mechanisms to physics, but fails to capture **normative function**—e.g., the assignment of "correctness" to DNA replication or "purpose" to metabolism. This isn’t a flaw in your vocabulary; it reveals that normativity is an observer-dependent projection onto physical processes. The residue isn’t noise—it highlights where biology imports concepts from semiotics or cybernetics that physics doesn’t endorse.  

  \answer{normative function}
