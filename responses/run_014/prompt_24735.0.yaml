    The key feature: the set of functions available inside the model is restricted.

    This is a genuine disagreement because the inside observer, limited to the functions in F_M, cannot find a listing of R_M, while the outside observer, who has access to more functions (like the bijection we mentioned), can see that it is countable.

    Therefore, countability is relative to the available functions in the model.

    In set theory, the model's available functions are those that exist within the model, and the model may not contain every function that exists in the ambient universe.

