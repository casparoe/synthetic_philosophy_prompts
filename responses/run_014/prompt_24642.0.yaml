  ## Three Lamps on the Wet Road

  **I**  
  The headlights probe the same slick curve,  
  The rain repeats its silver rhyme.  
  A lamp-post glows beside the swerve  
  That marks the crucial turning time.  
  He knows the count: first, second, right.  
  But fog has smudged each passing sign.  
  The wipers beat against the night.  
  *Which junction is it? First? Or second? Third?*  
  The road insists it's all the same design.  
  The pedal pressed, the doubt deferred.  

  **II**  
  The headlights probe the same slick curve,  
  The rain repeats its silver rhyme.  
  A lamp-post glows beside the swerve  
  That marks the crucial turning time.  
  He knows the cost: too soon, too late.  
  The map dissolves in mist and grime.  
  This hesitation seals his fate.  
  *Which junction is it? First? Or second? Third?*  
  The choice repeats, a blank, unending chime.  
  The will dissolves, the thought is blurred.  

  **III**  
  The headlights probe the same slick curve,  
  The rain repeats its silver rhyme.  
  A lamp-post glows beside the swerve  
  That marks the crucial turning time.  
  *How to decide?* Not one-in-three  
  (That tempting, symmetric mime).  
  But flip the coin, both junctions free:  
  One-half the chance at every lamp,  
  One quarter of the way his path will climb.  
  *How can this yield the lesser chance?*  
  He drives the calculation, cold and damp:  
  Surely symmetry would save? The numbers hold him, tight, and cramp.  
  The asphalt streams, four roads converge. The engine hums its final stamp.  

  ---

  **Structural Notes:**
  *   **Indistinguishability:** Stanzas I & II mirror each other almost perfectly in rhythm, line lengths, and opening imagery ("headlights probe," "rain repeats," "lamp-post glows"). Stanza III starts identically before the turn.
  *   **Refrain:** The core driver question "*Which junction is it? First? Or second? Third?*" anchors I & II. Stanza III replaces it with "*How to decide?*" and later "*How can this yield the lesser chance?*" marking the cognitive shift.
  *   **The Turn:** Stanza III explicitly rejects "one-in-three" (symmetry), introduces the optimal mixed strategy ("flip the coin... One-half the chance"), states its success rate ("One quarter of the way"), and highlights the paradox ("lesser chance?" / "Surely symmetry would save?").
  *   **Accuracy:** References "one-in-three" (naive), "one-half" (optimal p), "one quarter" (success prob under optimal p=1/2 strategy), the paradox of a seemingly worse chance yielding the best possible outcome.
  *   **Imagery:** Consistent rain, headlights, lamp-posts, fog, and road evoke the driver's POV and the problem's repetitive, obscured nature. "Four roads converge" visually hints at the quartered probability.
