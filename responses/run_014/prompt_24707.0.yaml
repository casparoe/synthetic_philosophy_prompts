answer: |-
  The described convention—minimizing direct printing of slurs, even in analytical contexts—rests on an **implicit theory that locates the harm of slurs primarily in the *bare occurrence of the string itself***, while also acknowledging that **repetition amplifies harm**. This view treats the slur as a *toxic token* with inherent power, regardless of intent or context. Below is a reconstruction, analysis of tensions, ruled-out theories, and alternatives:

  ---

  ### **Core Implicit Theory: Token-Centric Harm with Cumulative Amplification**
  1. **Harm in the String Itself (Token-Focused Harm)**  
     The practice presupposes that the *mere visual/aural presence* of the slur is harmful. Obfuscation (e.g., "n\*\*\*r" or "the N-word") treats the string as contaminating, akin to a hazardous substance. This is evident in:  
     - Censorship even when context is explicitly critical (e.g., academic papers).  
     - Preemptive filtering for search engines/moderation, implying the string is toxic *as data*.  
     - Avoiding the string entirely in some cases ("the N-word" as default).

  2. **Repetition as Aggravating Harm (Cumulative Effect)**  
     Limiting mentions to one (or zero) suggests:  
     - Each utterance/reactivation reinforces the slur’s violent history and social power.  
     - Proliferation normalizes or desensitizes, increasing exposure to targets.  
     - **Tension with (1)**: If the string were harmless when used analytically, repetition wouldn’t matter. If harm were *only* cumulative, one mention would be safe. The practice treats *both* as dangerous.

  ---

  ### **Distinguishing Presuppositions, Compatibilities, and Underdetermination**
  | **Aspect**               | **Strictly Presupposed**                          | **Compatible With**                              | **Philosophically Underdetermined**          |
  |--------------------------|--------------------------------------------------|--------------------------------------------------|---------------------------------------------|
  | **Source of Harm**       | The string *qua* token is harmful.               | Harm arises from historical/structural violence. | Whether meaning or attitude *grounds* the harm. |
  | **Role of Context**      | Context cannot fully neutralize the token’s harm. | Context may mitigate but not eliminate harm.     | *How much* context reduces harm (e.g., in reclamation). |
  | **Listener Sensitivity** | Harm is partly listener-dependent (target groups). | Universalist views of harm.                      | Whether harm extends to non-target listeners. |
  | **Repetition**           | Harm scales with frequency.                      | Harm is binary (occurrence/non-occurrence).      | Mechanism of accumulation (psychological? social?). |

  ---

  ### **Resolving the Tension: The "Toxic Token" Theory**
  The convention resolves the tension by positing:  
  - **The string is intrinsically harmful**: Its history of oppression is embedded in the token. Like a pathogen, it carries harm regardless of "sterile" handling (context/intent).  
  - **Repetition multiplies harm**: Each use:  
    (a) Re-traumatizes targets (psychological harm),  
    (b) Reinforces the slur’s social power (systemic harm),  
    (c) Risks misuse (pragmatic harm).  
  Thus, **one occurrence is a necessary evil (if mentioned at all), but repetition is indefensible**.  

  ---

  ### **Ruled-Out Theories of Slurs**
  The practice **incompatible** with:  
  1. **Pure Speaker-Intent Theories**:  
     If harm *only* resided in the speaker’s derogatory intent, analytical uses (e.g., "‘X’ is a slur") would be harmless and require no censorship.  
  2. **Meaning-Only Theories**:  
     If harm were solely in semantic content (e.g., "X expresses contempt for group Y"), paraphrasing (e.g., "a racial slur") should suffice *without* censoring the string. The string itself wouldn’t need hiding.  
  3. **Contextualist Theories**:  
     If context fully determined harm, critical/reporting contexts would render the string safe. The practice rejects this.  

  ---

  ### **Alternative Theories & Communication Policies**
  A policy built on rival theories would differ radically:  

  1. **Speaker-Intent Focused Policy**:  
     - **Practice**: Allow full slurs in clear analytical contexts (e.g., linguistics papers). No obfuscation.  
     - **Risk**: Misinterpretation, weaponization by bad actors.  

  2. **Meaning-Focused Policy (e.g., Inferentialist)**:  
     - **Practice**: Replace slurs with descriptors ("anti-Black slur") universally. Never print the string.  
     - **Rationale**: Harm lies in the concept, not the phonetics.  

  3. **Listener/Effect-Focused Policy**:  
     - **Practice**: Community-specific guidelines (e.g., targets decide if/when the string appears).  
     - **Example**: Academic spaces might permit full mention; social media bans it universally to protect vulnerable users.  

  4. **Reclamation-Focused Policy**:  
     - **Practice**: Allow in-group use but censor out-group use. Distinguish via context/speaker identity.  
     - **Challenge**: Difficult to enforce at scale (e.g., on platforms).  

  ---

  ### **Conclusion: The Conventions as Risk-Averse Tokenism**
  The convention reflects a **token-centric, harm-minimization approach** prioritizing immediate safety over nuanced discourse. It assumes slurs are *relics of violence* that retain harmful agency independent of use. While philosophically crude (underdetermining *why* tokens harm), it functions as a pragmatic shield against:  
  - Unintended triggering of targets,  
  - Algorithmic amplification of hate,  
  - Malicious appropriation.  
  Yet, it risks obscuring scholarly analysis and perpetuating taboos without addressing root causes. Alternative policies exist but require greater contextual discernment—a tradeoff between safety and precision the current convention avoids.
