answer: |-
  ### Poem: The Ass's Choice

  The pile to left, a golden, crisp display,  
  Its scent of summer fields, both sweet and deep,  
  The distance measured, step by step, away,  
  The nourishment it offers, rich and steep,  
  The hunger it could sate with ease and grace—  
  Yet motionless, the ass maintains its place.  

  The pile to right, a golden, crisp display,  
  Its scent of summer fields, both sweet and deep,  
  The distance measured, step by step, away,  
  The nourishment it offers, rich and steep,  
  The hunger it could sate with ease and grace—  
  Yet motionless, the ass maintains its place.  

  But reason grants a choice without a why:  
  He turns to left and eats beneath the sky.  

  ### Prose Note  
  This poem simplifies the scholastic background by presenting the piles as "identical in every hunger-relevant respect" without addressing the deeper metaphysical debates about necessity and contingency in Buridan's original formulation. It relies on a contested understanding of indifference, treating rational choice under perfect symmetry as permissibly arbitrary—a view defended in modern decision theory (e.g., by Levi or Sen) but disputed in scholastic thought (where true indifference might demand inaction). The couplet’s resolution assumes rationality permits "picking without preferring," a stance that overlooks medieval arguments tying volition to sufficient reason.
