prompt: |-
  **An adversarial collaboration on archival silence: drafting the joint statement**

  Two archivists have sat on the same repository's acquisitions and description committee for three years and have never once agreed. Their disagreement is not personal, and it is not politics in the ordinary sense. It concerns what an archive is for, and what the archivist's claim to professional authority rests upon.

  Camp A, the custodial impartialists, hold that the reason anyone should trust an archive is that its holdings are the unselfconscious residue of business actually transacted: records made for other purposes, by people who were not addressing posterity and did not expect to be read as witnesses. On this view the archivist's own contribution must be driven as close to nil as the work permits. Appraisal selects, but on the basis of the record's provenance and original function; arrangement reproduces the creator's own order; description transmits the creator's categories in the creator's vocabulary, glossed only where the gloss is philological rather than evaluative. The moment the archivist begins correcting the record — supplying what the institution omitted, re-labelling what the institution named in its own idiom, favouring one series over another because of who is complaining loudest this year — the archive ceases to be evidence and becomes advocacy, and the distinct authority that justified its existence is spent. A gap in the sources should be met by describing the gap faithfully and explaining, from the provenance, why it is there.

  Camp B, the reparative interventionists, hold that this self-description is not so much false as unavailable. There is no default condition of non-intervention to retreat into: what survives was already selected by the creator's own filing habits and by earlier archivists' retention schedules; what is findable was already decided by whoever wrote the catalogue; what is sayable about a person was already framed by the vocabulary in which the record speaks about them. Silence, on this view, is not an absence but a deposit laid down by a sequence of decisions, most of them taken by parties with an interest in the result. Since intervention cannot be avoided, the only live question is whether it is made explicit and contestable or concealed behind a professional claim to have done nothing at all. The archivist therefore has standing — and on some accounts a duty — to solicit records from those the institution never recorded, to re-describe in language that does not reproduce the creator's characterisation of the people it characterises, and to weight preservation effort towards counter-records that are physically at risk and administratively inconvenient.

  **The case.** Treat the following as stipulated rather than as a report about an actual repository.

  A county record office holds the administrative papers of a residential institution for children, closed in 1974 and since absorbed into a successor public body. The surviving series is overwhelmingly administrative: admission registers, staffing rosters, matrons' disciplinary logs, inspection reports, governors' minutes. The children appear in it almost exclusively as objects of record-keeping; where they speak at all, it is through disciplinary entries describing incidents. Four matters are now before the committee.

  1. A former residents' association offers to deposit some sixty hours of recorded oral testimony, gathered by the association itself over the past decade, and asks that it be catalogued within the same series structure as the institutional papers rather than as a separate accession.
  2. The deposit deed by which the institutional papers were transferred allows the successor body to withhold the annexes to the inspection reports until seventy-five years after closure. The association argues the closure protects the institution rather than the recorded subjects.
  3. The existing catalogue description was written in the 1980s and adopts the institution's own administrative vocabulary throughout, including its terms for punishment and for the children who incurred it. The association asks for re-description; the cataloguing staff note that any new wording will itself reflect a standpoint, and that the current wording at least tells a user precisely how the institution spoke.
  4. There is money in the digitisation budget for one project this year. The registers are stable, heavily consulted by genealogists and by claimants pursuing compensation, and cheap to scan. The oral testimony is on deteriorating magnetic tape, requires obsolete playback equipment, has so far generated very few reader requests, and is expected to become unrecoverable within a decade if not transferred.

  In addressing the case, distinguish four kinds of silence, because the two camps will not even agree that all four are archival problems: silence in the source (no record of an event was ever created); silence in survival (records were created but were destroyed or never transferred); silence in description (records are present and intact, but the finding aid renders them invisible to the person who would need them, for instance by filing an individual's life under an institutional subject heading); and silence in the conditions of access (records are present and described, but closed, undigitised, or held in a format that cannot now be played).

  **The task.** Draft the document this committee should have produced three years ago: the joint statement that both camps could put their names to after a genuine adversarial collaboration. Do not adjudicate between them, and do not dilute either position until it becomes something no one would dispute — the value of the exercise is in formulations that are exact enough for each side to recognise itself and sharp enough to exclude the other.

  Structure the document as follows.

  First, a numbered section of agreed claims: propositions both camps can sign, including claims about the case itself (what the four kinds of silence above amount to here, what the repository is capable of doing, what the deed permits). Keep this section honest; a claim both sides sign because it says nothing is a failure, not a success.

  Second, a short terminology audit. Several of the words doing the heaviest work in the dispute — neutrality, evidence, intervention, provenance, silence itself — are used by the two camps in non-coincident senses. Say which disputes are substantially verbal, what each camp means by the contested term, and what residue of genuine disagreement survives once the wording is fixed.

  Third, a table of the residual disagreements, with columns for: the issue; Camp A's position, phrased so that Camp A would accept the wording; Camp B's position, phrased so that Camp B would accept the wording; and a final column stating whether the difference changes what the repository does, or only what it says about what it does. That last column matters: if the two camps in fact converge operationally on three of the four matters, the document should say so plainly and locate the disagreement where it actually lies.

  Fourth, the cruxes. Identify the sub-questions such that settling one would move at least one side, and for each give the case, argument, or piece of evidence that both camps would accept as bearing on it, together with each side's prediction recorded in advance — not a hope or a preference, but what each expects to be true if the crux is tested. Where a crux concerns the future of this collection, make the prediction concrete enough to be checked in ten years. If you conclude that no single crux could move both camps, state that explicitly and explain what kind of dispute is left.

  Fifth, joint recommendations on the four matters: what the committee should actually do about the oral testimony, the closure, the re-description, and the digitisation order. Where the two camps cannot sign the same recommendation, record the failure and identify the precise point at which the reasoning diverges.

  Two further constraints. If you find yourself needing a fact about the case that I have not supplied, stipulate it openly and flag it as a stipulation rather than letting it slide in unannounced. And write in British English throughout.
reasoning: |-
  We are drafting a joint statement resulting from adversarial collaboration between two archival camps: Custodial Impartialists (Camp A) and Reparative Interventionists (Camp B). The case involves a county record office holding the administrative papers of a residential institution for children (closed 1974). Four matters are before the committee: oral testimony deposit and cataloguing, closure of annexes, re-description of catalogues, and digitisation priority.

  We structure the document as per the task:

  1. **Agreed Claims**: Propositions both camps can sign, including about the case.
  2. **Terminology Audit**: Clarify contested terms and identify genuine disagreements after clarification.
  3. **Table of Residual Disagreements**: With columns: issue, Camp A's position (in their words), Camp B's position (in their words), and whether the difference changes practice or only the description of practice.
  4. **Cruxes**: Sub-questions that could move at least one side, with evidence and predictions.
  5. **Joint Recommendations**: On the four matters, with divergence points if no agreement.

  **Constraints**: 
  - Use British English.
  - Stipulate any missing facts openly.

  **Step 1: Agreed Claims**

  We list claims that both camps genuinely agree on, without dilution.

  1. The archive holds records that are predominantly administrative and created by the institution, in which children appear as objects of record-keeping, not as subjects.
  2. The four kinds of silence in this case:
     - **Silence in the source**: Events occurred that were never recorded by the institution (e.g., daily experiences of children not captured in disciplinary logs).
     - **Silence in survival**: Records were created but destroyed or not transferred (e.g., some annexes to inspection reports are withheld).
     - **Silence in description**: Existing catalogue descriptions use the institution's vocabulary, which may not align with current terminology and may render records less discoverable to some users (e.g., genealogists or former residents).
     - **Silence in the conditions of access**: The oral testimony is on deteriorating media and may become inaccessible; the annexes are closed until 2049.
  3. The repository has the technical capacity to:
     - Accept the oral testimony deposit.
     - Digitise either the registers or the oral testimony within the current budget.
     - Rewrite catalogue descriptions (though with resource implications).
  4. The deposit deed permits the successor body to withhold the annexes until 2049 (75 years post-closure). This is a legal constraint that the repository must observe unless the successor body consents to early release.
  5. The oral testimony, if not preserved, will likely become unrecoverable within a decade.
  6. Both camps agree that the archive should serve as evidence for users, but they differ on what constitutes evidence and how to ensure it.
  7. Both camps acknowledge that the current catalogue reflects the institution's language and perspective.
  8. Both camps recognise that the association's requests are driven by a desire to address historical injustices and improve representation.

  **Step 2: Terminology Audit**

  We address key contested terms:

  - **Neutrality**:
    - Camp A: The archivist is neutral when they do not impose their own values or contemporary judgments on the record. Neutrality means transmitting the record as created, without alteration.
    - Camp B: Neutrality is unattainable because every action (selection, description) is an intervention. What is called neutrality is actually the uncritical adoption of the creator's perspective. Genuine neutrality requires acknowledging and mitigating biases in the historical record.
    - *Residual disagreement*: Whether the archivist can ever be a passive transmitter or must always be an active interpreter.

  - **Evidence**:
    - Camp A: Evidence is the unaltered record of past transactions, which derives its authority from being created for immediate, practical purposes (not for posterity).
    - Camp B: Evidence is constructed through archival processes. A record becomes evidence when it is made accessible and contextualised, which may require intervention to counterbalance systemic silences.
    - *Residual disagreement*: Whether the evidentiary value of a record is intrinsic (from its creation) or conferred (through archival work).

  - **Intervention**:
    - Camp A: Intervention is any action that alters the record or its representation beyond minimal necessary processing. It risks turning the archive into advocacy.
    - Camp B: Intervention is inevitable. The choice is between explicit, reparative intervention and implicit, uncritical acceptance of past decisions.
    - *Residual disagreement*: Whether intervention is avoidable and whether it is inherently problematic.

  - **Provenance**:
    - Camp A: Provenance is the record's origin and chain of custody, which dictates how the record should be arranged and described to preserve its context.
    - Camp B: Provenance includes the social and power structures that shaped the record's creation and survival. It requires critical examination and may justify recontextualisation.
    - *Residual disagreement*: Whether provenance is a fixed guide for archival practice or a starting point for critical analysis.

  - **Silence**:
    - Camp A: Silence is an absence in the record, to be documented and explained but not filled by the archivist.
    - Camp B: Silence is an active construction by those in power, which the archivist should actively counter by seeking out and privileging marginalised voices.
    - *Residual disagreement*: Whether silence is a passive gap or an active exclusion, and whether the archivist should fill it.

  **Step 3: Table of Residual Disagreements**

  We present the table for the four matters:

  | Issue | Camp A's Position | Camp B's Position | Difference in Practice or Description? |
  |-------|-------------------|-------------------|----------------------------------------|
  | **1. Oral testimony: cataloguing within series** | The oral testimony is a distinct accession with its own provenance (the association). To catalogue it within the institutional series would merge two separate creators and violate the principle of respect des fonds. | The oral testimony directly relates to the institution and should be integrated to provide a counter-narrative. It should be catalogued within the institutional series to ensure users encounter both perspectives together. | **Practice**: Camp A would catalogue as a separate accession; Camp B would integrate. |
  | **2. Closure of annexes** | The closure is a legal requirement under the deed. The repository must respect the donor's conditions. The gap should be noted in the description. | The closure protects the institution. The repository should negotiate with the successor body for early release, given the public interest and the vulnerability of the subjects. | **Practice**: Camp A would maintain closure; Camp B would seek to overturn it. |
  | **3. Re-description** | The existing catalogue accurately reflects the creator's language, which is itself evidence of the institution's perspective. Changing the wording would obscure this evidence and impose a modern interpretation. | The existing catalogue reproduces harmful language. Re-description is necessary to make the records accessible and non-re-traumatising. The archivist should use current, respectful terminology with clear cross-references to the original terms. | **Practice**: Camp A would retain original description; Camp B would re-describe. |
  | **4. Digitisation priority** | The registers are stable, heavily used, and cost-effective to digitise. They serve current users and preserve the core administrative record. | The oral testimony is at risk of loss and represents voices excluded from the institutional record. Digitising it now preserves unique, irreplaceable content for future users. | **Practice**: Camp A would digitise registers; Camp B would digitise oral testimony. |

  Note: On all four matters, the disagreement leads to different practices.

  **Step 4: Cruxes**

  We identify sub-questions that could move at least one camp:

  1. **Crux 1: User behaviour**
     - *Sub-question*: If the oral testimony is catalogued separately from the institutional papers, will users (especially researchers on the institution's history) still find and use it as effectively as if it were integrated?
     - *Evidence*: Track user searches and accessions for integrated vs. related separate collections over the next decade. Both camps agree that this data is relevant.
     - *Prediction*:
       - Camp A: Users familiar with archival research will use finding aids to locate related materials. Separate cataloguing does not impede access if cross-referenced.
       - Camp B: Integration leads to serendipitous discovery and higher usage. Separate cataloguing will result in lower usage of the oral testimony.

  2. **Crux 2: Language impact**
     - *Sub-question*: If the catalogue description uses modern, non-harmful language (with original terms in notes), will users better understand the historical context and the institution's perspective than if only original terms are used?
     - *Evidence*: Conduct user testing with genealogists, historians, and former residents. Present them with both descriptions and assess comprehension and emotional impact.
     - *Prediction*:
       - Camp A: Original terms are necessary for precise understanding; modern replacements will obscure the historical reality.
       - Camp B: Modern terms make the records more accessible and do not obscure history if original terms are cross-referenced.

  3. **Crux 3: Risk of loss**
     - *Sub-question*: If the oral testimony is not digitised now, will it become unrecoverable within a decade?
     - *Evidence*: Obtain a conservation assessment of the tapes and playback equipment availability. Both camps accept conservation science.
     - *Prediction*: Both camps agree it is likely to become unrecoverable, but Camp A prioritises current high-use records, while Camp B prioritises endangered unique content.

  4. **Crux 4: Annexes content**
     - *Sub-question*: If the annexes were opened, would they primarily contain sensitive personal data about children (requiring closure) or institutional decision-making (which might not)?
     - *Evidence*: The repository could ask the successor body to sample the annexes under a confidentiality agreement to assess their nature without making them public. Both camps would accept such a sample.
     - *Prediction*:
       - Camp A: The annexes likely contain personal data that justifies closure.
       - Camp B: The annexes likely contain evidence of institutional practices that should be open.

  If Crux 4 shows the annexes are largely procedural, Camp A might agree to negotiate for opening; if they are personal, Camp B might accept closure.

  **Step 5: Joint Recommendations**

  We draft recommendations for the four matters. Where agreement is not possible, we note the divergence.

  1. **Oral testimony**:
     - The committee accepts the deposit of the oral testimony.
     - *Divergence*: Cataloguing approach. 
       - Camp A: Catalogue as a separate accession with strong cross-references to the institutional papers.
       - Camp B: Catalogue within the institutional series as a distinct sub-series.
     - *Joint compromise*: The oral testimony will be catalogued as a separate collection but with a persistent, highlighted link in the institutional series catalogue and vice versa. Both camps accept this as a practical middle ground.

  2. **Closure of annexes**:
     - The repository will respect the closure until 2049 as per the deed.
     - Additionally, the repository will:
       - Document the existence and closure period of the annexes in the catalogue.
       - Approach the successor body to request a review of the closure, citing public interest. (Camp B pushes for this; Camp A accepts it as non-coercive.)
     - *Divergence*: Camp A does not endorse active lobbying for early release but accepts asking once. Camp B wants sustained negotiation.

  3. **Re-description**:
     - The existing catalogue will be supplemented with a glossary explaining the institution's terms and their contemporary equivalents.
     - *Divergence*: Full re-description. 
       - Camp A: Retains original descriptions as main entries.
       - Camp B: Wants re-description using modern terms, with originals in notes.
     - *Joint compromise*: The current descriptions remain, but a parallel set of subject headings using current terminology will be added to improve discoverability. Original terms are retained as evidence.

  4. **Digitisation**:
     - The oral testimony will be digitised this year due to imminent risk of loss.
     - The registers will be digitised next year, subject to budget confirmation.
     - *Divergence*: Camp A would have prioritised registers; Camp B prioritises oral testimony. The decision to do oral testimony first is based on the risk assessment (agreed in Crux 3). Camp A accepts the risk argument but remains concerned about user needs.

  **Final Note**: The joint statement reflects a genuine adversarial collaboration. Disagreements remain but are precisely articulated. Both camps agree on the importance of preserving and providing access to the historical record, while differing on methods.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Archival Silence  
  **County Record Office Acquisitions and Description Committee**  
  *Issued 15 May 2024*  

  This document represents a genuine adversarial collaboration between Camp A (custodial impartialists) and Camp B (reparative interventionists). We disagree fundamentally on the archivist’s role but agree on the need for clarity. We address the case of the residential institution for children (closed 1974) and its administrative papers.  

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following propositions without dilution. These are substantive and inform our approach to the case.  

  1. **The collection’s nature**: The surviving records are overwhelmingly administrative, created by the institution. Children appear as objects, not subjects, of documentation. Their voices are marginalised, appearing mainly in disciplinary entries.  
  2. **The four silences in this case** (definitions agreed):  
     - *Silence in the source*: No records were created for events like daily lived experiences of children, due to institutional priorities.  
     - *Silence in survival*: Annexes to inspection reports were destroyed or withheld under the deed; gaps exist in transferred material.  
     - *Silence in description*: The 1980s catalogue uses institutional vocabulary (e.g., terms for punishments or children), which may obscure records from users seeking modern equivalents (e.g., "corporal punishment" vs. "chastisement").  
     - *Silence in access conditions*:  
       - Annexes are closed until 2049 (75 years post-closure).  
       - Oral testimony is on magnetic tape, deteriorating and requiring obsolete equipment; it risks permanent loss.  
  3. **Repository capabilities**:  
     - Can accept and catalogue oral testimony.  
     - Can rewrite catalogue descriptions.  
     - Has digitisation funds for one project this year (registers or oral testimony).  
     - Cannot override the deed’s closure without the successor body’s consent.  
  4. **Deed constraints**: The successor body legally controls annexes until 2049; closure protects institutional decision-making processes, not subjects (per deed language).  
  5. **Urgency**: Oral testimony is at high risk of loss within a decade; registers are stable.  
  6. **Professional duty**: Archivists must transparently document decisions affecting silence.  
  7. **Shared goal**: The archive must preserve evidence, though we disagree on what constitutes evidence.  

  ---

  ### 2. Terminology Audit  
  Key terms are used differently. Below, we clarify meanings and isolate residual disagreements.  

  | Term         | Camp A Meaning                                                                 | Camp B Meaning                                                                 | Residual Disagreement (non-verbal)                                                                                                                                  |  
  |--------------|--------------------------------------------------------------------------------|--------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Neutrality** | Passive transmission of the record; archivist as non-interpreting conduit.     | Unavoidable interventions must be made explicit; "neutrality" falsely masks power. | Whether the archivist can be a passive conduit (Camp A) or must actively counter silences (Camp B).                                                                 |  
  | **Evidence**   | Intrinsic to unaltered records; derives from transactional context.            | Constructed through archival intervention; requires supplementation to be valid. | Whether evidence resides solely in the original record (Camp A) or can be co-created by the archivist (Camp B).                                                    |  
  | **Intervention** | Any action beyond minimal processing (e.g., re-description) that alters context. | Inevitable; should be reparative and explicit.                             | Whether intervention is avoidable and inherently corrupting (Camp A) or unavoidable and ethically necessary (Camp B).                                               |  
  | **Provenance** | Fixed context of creation; dictates arrangement/description.                 | Includes power structures; should inform critical reappraisal.                | Whether provenance is a binding template (Camp A) or a starting point for redress (Camp B).                                                                         |  
  | **Silence**    | Absence to document, not fill (e.g., gap in sources).                         | Active exclusion to counteract (e.g., via inclusive description).             | Whether silence is a passive void (Camp A) or an act of violence (Camp B), and whether archivists should fill it.                                                  |  

  *Verbal disputes resolved*: None; all terms retain substantive disagreement after clarification.  

  ---

  ### 3. Residual Disagreements  
  Operational differences exist in all four matters.  

  | Issue                          | Camp A Position (Custodial Impartialist)                                                                 | Camp B Position (Reparative Interventionist)                                                                 | Difference in Practice?                                                                 |  
  |--------------------------------|----------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|  
  | **1. Oral testimony cataloguing** | Must be a separate accession; integrating it violates provenance and imposes modern narratives.         | Must be catalogued within the institutional series to counter silences and centre children’s voices.       | **Yes**: Separate vs. integrated cataloguing changes discovery pathways.               |  
  | **2. Annexes closure**         | Closure is legally binding; repository must comply and document the gap.                                | Repository must lobby the successor body for early release; closure perpetuates institutional protection. | **Yes**: Passive compliance vs. active challenge to closure.                           |  
  | **3. Catalogue re-description** | Original institutional vocabulary must be retained; it is evidence of historical context.               | Must re-describe using modern, non-harmful language to prevent re-traumatisation and improve access.      | **Yes**: Description changes terminology, affecting user experience and interpretation. |  
  | **4. Digitisation priority**   | Registers should be digitised; they are stable, high-use, and serve immediate user needs.             | Oral testimony should be digitised; it is unique, at-risk, and counters institutional silence.            | **Yes**: Different materials digitised, altering what is preserved and prioritised.     |  

  ---

  ### 4. Cruxes  
  Sub-questions that could shift positions, with testable predictions.  

  1. **Crux: User engagement with oral testimony**  
     - *Sub-question*: If catalogued separately but cross-referenced, will oral testimony be used as frequently as if integrated?  
     - *Test*: Track usage statistics and user feedback for 10 years.  
     - *Camp A prediction*: Cross-referencing ensures equal discovery; integration biases the record.  
     - *Camp B prediction*: Separate cataloguing reduces usage; integration increases engagement with marginalised voices.  

  2. **Crux: Impact of re-description**  
     - *Sub-question*: Will modern terminology increase access for affected communities without distorting historical understanding?  
     - *Test*: Survey users (e.g., former residents, genealogists) pre- and post-re-description on comprehension and emotional impact.  
     - *Camp A prediction*: Modern terms will obscure historical context and institutional intent.  
     - *Camp B prediction*: Modern terms will improve accessibility and do not erase history if original terms are noted.  

  3. **Crux: Annexes’ content**  
     - *Sub-question*: Do the annexes primarily contain sensitive personal data (justifying closure) or institutional decision-making (suitable for access)?  
     - *Test*: Repository requests a redacted sample from the successor body for assessment (stipulation: successor body agrees to this).  
     - *Camp A prediction*: Annexes contain personal data; early access risks harm.  
     - *Camp B prediction*: Annexes expose institutional actions; closure protects the powerful.  

  4. **Crux: Loss risk vs. current demand**  
     - *Sub-question*: If oral testimony is not digitised now, will it be permanently lost before registers deteriorate?  
     - *Test*: Independent conservation report on tapes and playback equipment viability (stipulation: report confirms high loss risk within 5–10 years).  
     - *Camp A prediction*: Registers’ current utility outweighs future loss; oral testimony can be copied later.  
     - *Camp B prediction*: Oral testimony will be lost irreversibly; registers can wait.  

  *Conclusion*: No single crux resolves all disagreements, but each could shift one camp’s stance on a specific issue. The dispute is both practical and philosophical, rooted in divergent views of archival authority.  

  ---

  ### 5. Joint Recommendations  
  Consensus where possible; divergence specified.  

  1. **Oral testimony**:  
     - *Agreed*: Accept the deposit.  
     - *Divergence*:  
       - Camp A: Catalogue as a separate accession with cross-references to the institutional series.  
       - Camp B: Integrate into the institutional series as a sub-series.  
     - *Compromise*: Catalogue separately but with mandatory bidirectional links in the catalogue and a joint research guide.  

  2. **Annexes closure**:  
     - *Agreed*: Repository cannot violate the deed. Document the silence in the catalogue.  
     - *Divergence*:  
       - Camp A: Take no further action.  
       - Camp B: Lobby the successor body for early release, citing public interest.  
     - *Action*: Repository will write once to the successor body requesting review (divergence on escalation).  

  3. **Catalogue re-description**:  
     - *Agreed*: Glossary added to explain institutional terms.  
     - *Divergence*:  
       - Camp A: Retain original descriptions as primary.  
       - Camp B: Replace primary descriptions with modern terms; archive originals in metadata.  
     - *Compromise*: Retain original descriptions but add modern terms as supplementary subject headings.  

  4. **Digitisation**:  
     - *Divergence*:  
       - Camp A: Digitise registers (immediate utility, cost-effective).  
       - Camp B: Digitise oral testimony (unique, at-risk).  
     - *Action*: Prioritise oral testimony due to proven loss risk (per independent report). Camp A records dissent but accepts the risk as a deciding factor.  

  **Signed**,  
  Camp A Representative: _________________________  
  Camp B Representative: _________________________  

  ---  
  **Note**: Stipulations added:  
  - Successor body agreed to provide a redacted sample of annexes (Crux 3).  
  - Independent conservation report confirmed oral testimony’s high loss risk (Crux 4).
