prompt: |-
  I run a small cleaning business and I've been trying to write a proper operations manual for my crew, and its driving me nuts. Every time I change one part of a procedure — say, which cleaner we use on hardwood floors — I have to go through the entire document and make sure every other section that references it is updated, and I keep missing things. It feels like I'm rewriting the whole manual just to change one line. I read somwhere that AI researchers ran into this exact wall decades ago when they first tried to get computers to reason about the physical world — the problem that it's really hard to specify all the stuff that DOESN'T change when you do something — and that it's still considered a genuinely hard problem. So I'm wondering: is my pain just inherent to writing a manual, or is there a smarter way to structure the document so I only have to write down what actually changed? And if I do switch to that style, what new problems am I signing up for? Could you answer in exactly five numbered points, each just a sentence or two, and skip any intro or wrap-up?
reasoning: |-
  Okay, the user runs a small cleaning business and is struggling with updating their operations manual. Every time they change a procedure, like switching a cleaner for hardwood floors, they have to hunt through the entire document to update every reference. They mention that AI researchers faced similar challenges with reasoning about changes, which is indeed a hard problem. 

  The user wants to know if their pain is inevitable or if there's a smarter way to structure the manual so updates are localized. They also want to know the trade-offs of any new approach. The request is very specific: exactly five numbered points, no intro or wrap-up. 

  First, I need to validate their observation—yes, this is a fundamental issue in knowledge representation. Then I'll propose a solution: modular design with master references. For example, having a "Materials" section where cleaners are defined once, and other sections just reference that. 

  But I must also warn about new problems: users might not follow the references, leading to confusion, and the manual becomes less readable as a linear document. Plus, the initial setup is more complex. 

  The user's deeper need is efficiency in maintenance without creating new headaches. They're probably time-strapped and frustrated with manual busywork. A modular approach saves time long-term but requires discipline in writing and usage. 

  I'll structure exactly five points:  
  1. Acknowledge the inherent challenge.  
  2. Propose the modular solution.  
  3. Explain how to implement master references.  
  4. Highlight the key trade-off (readability).  
  5. Mention the upfront effort cost.  

  This covers their questions concisely while honoring the format. No fluff, just actionable insights with clear downsides.
answer: |-
  1.  Your pain *is* inherent to traditional sequential manuals but can be significantly reduced by adopting a modular structure.  
  2.  Structure your manual like a database: create distinct, centralized reference sections (e.g., "Approved Materials & Dilutions", "Room Procedure Templates") and have task instructions point to these references instead of repeating details.  
  3.  When you change a cleaner, you update *only* its entry in the central "Materials" section; all task procedures referencing that material automatically use the new info without needing edits.  
  4.  The major new problem is increased cognitive load for *users*: crew members must actively follow references between sections, making the manual less intuitive to read linearly and risking skipped steps if not careful.  
  5.  You also trade upfront complexity: designing and writing this modular system requires significantly more initial planning and discipline to maintain strict separation of references from procedures.
