  The user mentions avoiding conflating the metric with distributive principles. That's crucial. I recall Amartya Sen's emphasis on separating the "equalisandum" from distribution rules. I should highlight this distinction early on. Examples like forced labor versus leisure could illustrate how different metrics handle the same resources differently.

