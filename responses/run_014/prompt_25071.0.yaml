  Conflicts between desiderata are critical. The responsibility-sensitive equity and preference sovereignty clash when adaptive preferences are involved. For example, the resigned housewife's satisfaction shouldn't justify fewer resources. This tension between responsibility and preference adaptation is a major debate restructure.

