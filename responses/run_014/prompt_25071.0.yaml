answer: |-
  Here’s a rigorous specification of what a theory of the **metric of justice/equality** (the "equalisandum") must deliver, structured by desiderata, motivated by cases, and annotated for neutrality/contestability. This is the conceptual toolkit you need to evaluate welfarism, resourcism, and capabilities *before* applying distributive principles.

  **Core Desiderata: What the Metric Must Capture (The "Must-Get-Right" Cases)**

  1.  **The Disability Case (Non-Controversial Requirement):**
      *   **Motivating Case:** Two individuals have identical resources (income, goods). One is able-bodied, the other has a mobility impairment requiring an expensive wheelchair. The able-bodied person can achieve a higher level of well-being/functioning with those resources.
      *   **Requirement:** The metric must recognize that achieving the *same level* of advantage requires *more resources* for the disabled person. A metric insensitive to this difference (e.g., crude income equality) fails.
      *   **Neutrality:** Universally accepted as a core test. Any plausible metric must handle this.

  2.  **The Expensive Tastes Case (Responsibility-Sensitivity):**
      *   **Motivating Case:** Person A is content with simple, cheap food (rice and beans). Person B has cultivated a taste for champagne and caviar and is miserable without them, despite having the same resources as A.
      *   **Requirement:** The metric must distinguish between disadvantages due to *circumstances* (like disability) and disadvantages due to *choices* or cultivated preferences. It should not require compensating B for their expensive taste *if that taste is seen as their responsibility*.
      *   **Neutrality:** Highly influential (Dworkin, Arneson, Cohen) but *contested at the edges*. Strict welfarists (e.g., some utilitarians) might argue tastes *are* part of what matters. The core requirement is that the metric *allows* responsibility-sensitivity; whether responsibility *is* applied is a matter for the distributive principle.

  3.  **The Adaptive Preferences/Sour Grapes Case (Non-Controversial Requirement):**
      *   **Motivating Case:** A person in a severely deprived social position (e.g., systematically oppressed group, chronic poverty) reports high subjective satisfaction because they have lowered their expectations to avoid frustration ("I don't need education/healthcare, I'm happy as I am").
      *   **Requirement:** The metric must *not* take subjective satisfaction at face value as the sole indicator of advantage. It must be able to identify deprivation even when individuals report contentment due to adaptation.
      *   **Neutrality:** Universally accepted as a devastating critique of simple subjective welfare metrics. Any metric must either avoid relying on subjective states vulnerable to adaptation or have a way to critically assess them.

  4.  **The Heterogeneity of Ends Case (Non-Controversial Requirement):**
      *   **Motivating Case:** Individuals value fundamentally different things: one seeks religious fulfillment through contemplation, another seeks political influence, another seeks artistic creation, another seeks family life.
      *   **Requirement:** The metric must be sufficiently pluralistic to accommodate diverse conceptions of the good life. It cannot privilege one specific conception (e.g., maximizing pleasure) as the sole measure of advantage.
      *   **Neutrality:** Widely accepted (Rawls, Sen, Nussbaum, Raz) as a requirement of liberal neutrality/respect for pluralism. Crude monistic welfarism fails here.

  **Key Distinctions the Metric MUST NOT Collapse (Conceptual Firewalls)**

  5.  **Metric vs. Distributive Principle (Non-Controversial Requirement):**
      *   **Motivating Confusion:** Saying "equality of welfare" and then distributing resources to maximize total welfare (utilitarianism) conflates the *what* with the *how much* and *how*.
      *   **Requirement:** The metric defines the *currency* of advantage (welfare, resources, capabilities). The distributive principle determines *what pattern* of that currency is just (equality, sufficiency, priority, maximizing sum). The metric must be *conceptually separable* from any specific distributive rule. It must be possible to ask, "Given this metric, what distributive principle should govern it?"
      *   **Neutrality:** Fundamental methodological point (Sen, Cohen). Building the distributive rule into the metric (e.g., defining the metric as "what should be equal") is circular and prevents independent evaluation.

  6.  **Brute Luck vs. Option Luck (Responsibility-Sensitivity - Linked to Desideratum 2):**
      *   **Motivating Case:** Two people gamble; one wins (option luck), one loses (option luck). One is struck by a meteor (brute luck).
      *   **Requirement:** The metric itself doesn't *apply* this distinction, but it must be *sensitive* enough to information that *allows* a distributive principle to compensate for disadvantages arising from brute luck, but not necessarily those arising from option luck (choice/calculated risk). A metric like pure income lumps luck types together. A metric listing capabilities might allow finer-grained distinctions.
      *   **Neutrality:** Core to luck-egalitarian frameworks (Dworkin et al.). Rejected by strict egalitarians or sufficientarians who might prioritize outcome over source. The *requirement* is that the metric *can* support the distinction if the distributive principle demands it.

  **Empirical Anchors: Consistency with Facts (Constraints with Variable Weight)**

  7.  **Human Diversity & Varied Conversion Factors (Non-Controversial Requirement - Linked to 1):**
      *   **Motivating Facts:** Psychology, biology, sociology show people differ vastly in their ability to convert resources into functionings/well-being (due to health, talents, social norms, discrimination, geography).
      *   **Requirement:** The metric must incorporate or acknowledge the significance of these differences. Pure resource lists ignore them; crude welfare metrics might obscure them via adaptation.
      *   **Neutrality:** Empirically grounded and widely accepted. Denial is implausible.

  8.  **The Reality of Hedonic Adaptation & Preference Formation (Non-Controversial - Supports 3):**
      *   **Motivating Facts:** Psychology (e.g., set-point theory, coping mechanisms) shows subjective well-being adapts to circumstances. Sociology/economics show preferences are shaped by environment, culture, and marketing (endogenous preferences).
      *   **Requirement:** The metric cannot rely solely on subjective states without a critical filter or a theory of "authentic" preferences. It must account for the malleability of desires.
      *   **Neutrality:** Strong empirical backing. Undermines naive revealed preference or simple subjective welfare.

  9.  **Positional Goods & Relational Advantage (Contested but Important):**
      *   **Motivating Case:** Having enough money for a basic phone vs. the latest iPhone confers different *social* advantage/status/access. In a society where everyone drives, lacking a car causes severe isolation.
      *   **Requirement:** The metric must account for how the *value* of goods/resources/capabilities depends on what others have (social relativity). Pure resource lists struggle here; capabilities might handle it via "social bases of self-respect" or similar.
      *   **Neutrality:** Emphasized by Marxists, relational egalitarians (Anderson, Scheffler), some economists. Sometimes downplayed by resourcists/welfarists focused on individual holdings. An empirically plausible challenge any metric must address.

  10. **Endogenous Preferences & the Cost of Autonomy (Contested but Powerful):**
      *   **Motivating Case:** A person raised in a cult develops preferences easily satisfied within the cult's limited framework but lacks the capability/capacity to form or pursue alternative conceptions of the good.
      *   **Requirement:** The metric must value not just the satisfaction of *current* preferences, but also the *capacity to form, revise, and pursue* preferences – the conditions for autonomy. This pushes towards capabilities focused on agency and critical reflection.
      *   **Neutrality:** Strongly emphasized by Sen, Nussbaum (central capabilities), Raz. Less central to resourcism or simple welfarism. A powerful constraint if accepted, pushing beyond preference satisfaction.

  **The Crucial Conflict: The Responsibility-Adaptation Tension (Joint Unsatisfiability)**

  *   **The Conflict:** Desideratum 2 (**Responsibility-Sensitivity**) and Desideratum 3 (**Handling Adaptive Preferences**) are *in profound tension*, and no metric fully satisfies both simultaneously without significant theoretical cost or controversial moves.
      *   **Why?** Responsibility-sensitivity (e.g., not compensating expensive tastes) requires *judging preferences*: distinguishing legitimate needs from chosen/cultivated tastes. But handling adaptive preferences *also* requires judging preferences: distinguishing "authentic" well-being from distorted, adapted preferences. Doing the first seems to require taking preferences seriously as expressions of choice; doing the second requires being deeply skeptical of preferences as indicators of true advantage.
      *   **The Housewife Case (Illustrating the Conflict):** A woman socialized into believing her role is solely domestic reports high subjective satisfaction with minimal resources/opportunities (Adaptation). A different woman, raised in feminist ideals, cultivates expensive career ambitions requiring significant resources (Expensive Taste? Or Legitimate Pursuit?). A responsibility-sensitive metric might want to compensate the first (brute luck of socialization) but not the second (choice of ambition). But discerning the "authenticity" or "responsibility" in *both* cases requires controversial normative judgments *within* the metric, potentially violating neutrality or collapsing the metric/distribution distinction. Resourcism avoids judging preferences but fails the adaptation test. Simple Welfarism fails adaptation. Capabilities judges functionings but needs a theory of "valuable" functionings, raising similar judgment issues. **This tension fundamentally restructures the debate.** Theories either:
          *   Prioritize Responsibility (e.g., Dworkin's resourcism) and risk neglecting deep adaptation/socialization.
          *   Prioritize Non-Adaptation (e.g., Nussbaum's capabilities) and risk imposing a list of functionings/paternalism, potentially undermining responsibility.
          *   Attempt complex hybrid/refinements (e.g., Arneson's opportunity for welfare, Cohen's midfare) which are intricate and often still vulnerable.

  **The Most Damaging Single Requirement: Preference Sovereignty (The Nuclear Option)**

  *   **The Requirement:** **"The metric must respect individual preference sovereignty as the ultimate arbiter of an individual's good/advantage."** (A strong welfarist/utilitarian commitment).
  *   **Why it's Devastating:**
      1.  **Destroys Responsiveness to Disability (Desid. 1):** If a disabled person *prefers* not to be mobile, should they get fewer resources for mobility aids? Preference sovereignty says yes. This seems perverse.
      2.  **Neutralizes the Expensive Tastes Critique (Desid. 2):** If B genuinely prefers champagne and is miserable without it, preference sovereignty dictates compensating them. Responsibility evaporates.
      3.  **Utterly Fails the Adaptive Preferences Test (Desid. 3):** It *forces* acceptance of the adapted preference as definitive. The oppressed housewife *is* advantaged because she says she is.
      4.  **Threatens Pluralism (Desid. 4):** It reduces all advantage to a single, subjective scale, potentially ignoring objective dimensions of harm or flourishing valued by other conceptions.
      5.  **Undermines Brute Luck/Option Luck Distinction (Distinction 6):** If preference satisfaction is all that matters, the *source* of dissatisfaction (brute luck vs. choice) is irrelevant for the metric itself; only the intensity matters.
      6.  **Ignores Endogenous Preferences & Autonomy (Desid. 10):** It values the *outcome* (satisfaction) regardless of how constrained the process of preference formation was.
  *   **Impact:** Taking preference sovereignty seriously as a *requirement for the metric* devastates resourcism (which ignores preferences) and the capabilities approach (which prioritizes objective functionings over subjective states). It even challenges sophisticated welfarism (like opportunity for welfare) if it imposes any objective constraints on preferences. It essentially forces a commitment to a form of subjective welfarism that is vulnerable to *all* the major critiques (disability, expensive tastes, adaptation). It reveals the deep tension between respecting individual subjectivity and achieving substantive, responsibility-sensitive justice.

  **Contested Desiderata (The "Pet Constraints"):**

  *   **Endogenous Preferences as Central (Desid. 10):** While preference *formation* is a fact, making *autonomy of preference formation* a *core requirement* for the metric is a specific (liberal/perfectionist) value commitment emphasized by Sen/Nussbaum, not a neutral starting point. A resourcist might argue providing resources *is* enabling autonomy, leaving preference formation to the individual.
  *   **Positional Goods as Fundamental (Desid. 9):** While relativity exists, making it *the* central problem for equality is a choice emphasized by relational egalitarians/marxists. A sufficientarian might care less about relativity if everyone has "enough".
  *   **Strict Separation of Metric and Principle (Desid. 5):** While crucial methodologically, some theories (e.g., some sufficientarian capabilities approaches) come close to building the distributive aim ("sufficiency in central capabilities") into the metric definition. The *requirement* for strict separation is almost universally *endorsed*, but adherence varies in practice.

  **Summary for Your Chapter Structure:**

  1.  **Establish the Core Mandate:** A metric must handle Disability, distinguish responsibility (Expensive Tastes), overcome Adaptation, and respect Pluralism.
  2.  **Define Conceptual Boundaries:** The metric MUST be separable from the distributive principle and capable of supporting luck/choice distinctions.
  3.  **Acknowledge Empirical Constraints:** Human diversity in conversion, psychological adaptation, social relativity of goods, and preference endogeneity are facts any metric must grapple with.
  4.  **Highlight the Fundamental Conflict:** The tension between responsibility-sensitivity and handling adaptive preferences is the central, likely irresolvable, challenge structuring the entire debate. How a theory navigates this reveals its deepest commitments and costs.
  5.  **Recognize the Landmine:** Taking "Preference Sovereignty" as a requirement for the metric itself obliterates most alternatives and forces acceptance of a highly vulnerable welfarism. Theories rejecting this requirement must justify why.

  This framework gives you the critical axes to dissect welfarism, resourcism, and capabilities. Score them ruthlessly on these points: How well do they handle disability? How do they (try to) navigate the responsibility-adaptation abyss? Do they collapse key distinctions? Are they consistent with the empirical realities of psychology and sociology? Good luck with the chapter!
