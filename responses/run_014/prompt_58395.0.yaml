  i also had this dumb thought experiment that might help - like if you took hitler out in like 1928 and replaced him with just some generic angry veteran who also hates jews and communists but isnt as obsessive or good at talking, what happens? does that guy still get the same support or does he flop? use that to test the two sides.

  like 800-1000 words is fine, keep it in normal words not academic stuff cause i didnt go to college for this.
