  ### Classical Indian Epistemology: Pramāṇas Decision Tree  
  **Root Commitment**: Some beliefs constitute knowledge (*pramā*), and not all knowledge derives from sensory perception alone. All branches accept **perception** (*pratyakṣa*) and **inference** (*anumāna*) as valid means of knowledge.  

  #### Decision Tree  
  Answer each question based on your epistemic intuitions. Proceed downward without regard for classical doctrines.  

  1. **Testimony (śabda)**:  
     When a trustworthy speaker tells you something (e.g., "There is a shrine beyond the hill"), is your knowledge of their claim:  
     - **(A) Knowable in its own right**, irreducible to other means? → Go to Q2.  
     - **(B) Only knowable by inferring the speaker’s reliability and intent**, thus reducible to inference? → Go to Q2.  

  2. **Postulation (arthāpatti)**:  
     Consider the case: "Devadatta is stout and eats nothing by day; thus, he eats at night." Is this knowledge:  
     - **(A) A unique form of circumstantial postulation**, distinct from inference? → Go to Q3.  
     - **(B) Just a disguised inference** (e.g., from the impossibility of daytime eating)? → Go to Q3.  

  3. **Non-Apprehension (anupalabdhi)**:  
     When you know "The pot is not on the ground" due to its absence, is this:  
     - **(A) A distinct means of knowing absence**, irreducible to perception? → Go to Q4.  
     - **(B) Just negative perception** (e.g., perceiving empty ground as "pot-less")? → Go to Q4.  

  4. **Comparison (upamāna)**:  
     A forest-dweller is told a *gavaya* resembles a cow. Later, they see a *gavaya* and recognize it by similarity. Is this knowledge:  
     - **(A) A distinct process of comparison**, beyond perception and memory?  
     - **(B) Reducible to perception + memory** (e.g., seeing the animal and recalling the description)?  

  ---

  #### Leaf Positions: Accepted Pramāṇas, Schools, and Awkward Consequences  
  *(P = Perception, I = Inference, T = Testimony, Ar = Postulation, An = Non-Apprehension, U = Comparison)*  

  | Path       | Accepted Pramāṇas     | Classical School (Attribution)                             | Awkward Consequence                                                                 |
  |------------|------------------------|-----------------------------------------------------------|-------------------------------------------------------------------------------------|
  | A,A,A,A   | P, I, T, Ar, An, U    | **Mīmāṃsā (Kumārila)**, **Advaita Vedānta**              | Must defend why all six are irreducibly distinct, risking ontological proliferation. |
  | A,A,A,B   | P, I, T, Ar, An       | — (Unoccupied)                                            | —                                                                                  |
  | A,A,B,A   | P, I, T, Ar, U        | **Mīmāṃsā (Prabhākara)**¹                                | Absences (e.g., "no pot") must be explained via perception/postulation, not a dedicated means. |
  | A,A,B,B   | P, I, T, Ar           | — (Unoccupied)                                            | —                                                                                  |
  | A,B,A,A   | P, I, T, An, U        | **Nyāya (later, e.g., Udayana)**                         | Postulation is reduced to inference, but absence gets a dedicated means, creating asymmetry in "gap-filling" knowledge. |
  | A,B,A,B   | P, I, T, An           | — (Unoccupied)                                            | —                                                                                  |
  | A,B,B,A   | P, I, T, U            | **Nyāya (early, e.g., Gautama)**                         | Non-apprehension is reduced to perception, weakening the account of abstract absences (e.g., "no unicorns"). |
  | A,B,B,B   | P, I, T               | **Sāṃkhya**, **Yoga**                                     | Comparison (e.g., recognizing a *gavaya* via similarity) is reduced to testimony + perception, underplaying the role of analogical reasoning. |
  | B,A,A,A   | P, I, Ar, An, U       | — (Unoccupied)                                            | —                                                                                  |
  | B,A,A,B   | P, I, Ar, An          | — (Unoccupied)                                            | —                                                                                  |
  | B,A,B,A   | P, I, Ar, U           | — (Unoccupied)                                            | —                                                                                  |
  | B,A,B,B   | P, I, Ar              | — (Unoccupied)                                            | —                                                                                  |
  | B,B,A,A   | P, I, An, U           | — (Unoccupied)                                            | —                                                                                  |
  | B,B,A,B   | P, I, An              | **Buddhism (Dignāga/Dharmakīrti)**²                      | Testimony is reduced to inference, making language-based knowledge derivative and potentially less reliable. |
  | B,B,B,A   | P, I, U               | — (Unoccupied)                                            | —                                                                                  |
  | B,B,B,B   | P, I                  | — (Unoccupied)                                            | —                                                                                  |

  ¹ *Prabhākara Mīmāṃsā often reduces non-apprehension to perception/postulation but accepts the other five. This leaf matches their core commitments.*  
  ² *Buddhism reduces testimony, postulation, and comparison to inference, and non-apprehension to inference/perception. This leaf captures their reductions, though they technically accept only P and I.*  

  ---

  #### Unoccupied Combinations & Reasons  
  | Accepted Pramāṇas       | Reason for Vacancy                                                                 |
  |--------------------------|-----------------------------------------------------------------------------------|
  | P, I, T, Ar, An (A,A,A,B) | **Unattractive**: Schools accepting T, Ar, An typically also accept U (e.g., Kumārila accepts all six). Rejecting U while keeping T/Ar/An is unmotivated. |
  | P, I, T, Ar (A,A,B,B)    | **Unattractive**: Schools strong in testimony/postulation (Mīmāṃsā) always accept U. Rejecting U and An weakens analogical/absence knowledge. |
  | P, I, T, An (A,B,A,B)    | **Unexplored**: Logically coherent but unattractive—schools accepting An (e.g., Nyāya) also accept U. |
  | P, I, Ar, An, U (B,A,A,A) | **Incoherent**: Testimony (T) is foundational for comparison (U) in Indian thought; rejecting T while accepting U is unsustainable. |
  | P, I, Ar, An (B,A,A,B)   | **Unattractive**: Rejects T and U, but Ar/An depend on linguistic or analogical contexts, leaving them unsupported. |
  | P, I, Ar, U (B,A,B,A)    | **Unattractive**: Schools rejecting T (e.g., Buddhism) also reject Ar and U. Keeping Ar/U without T is unmotivated. |
  | P, I, Ar (B,A,B,B)       | **Unattractive**: Ar is rarely accepted without T or U (e.g., no school isolates postulation). |
  | P, I, An, U (B,B,A,A)    | **Unattractive**: Rejects T, but U requires linguistic testimony (e.g., the *gavaya* description). |
  | P, I, U (B,B,B,A)        | **Unattractive**: U relies on testimony for the initial comparison; rejecting T makes U incoherent. |
  | P, I (B,B,B,B)           | **Unoccupied in practice**: Buddhism reduces all to P/I but is placed in B,B,A,B due to tree constraints (see below). |  

  ---

  #### Ambiguously Separated Leaves  
  - **B,B,A,B (P, I, An) and B,B,B,B (P, I)**: The tree cannot practically separate these.  
    - **Why**: Non-apprehension (An) is framed as "distinct vs. reducible to perception." Schools like **Buddhism** reduce An to *inference*, not perception. Thus, they answer "distinct (A)" at Q3 (since they deny perceptual reduction) but end up in B,B,A,B (P, I, An) despite only accepting P and I. A school *genuinely* accepting P, I, and An would also occupy B,B,A,B, creating ambiguity.  
    - **Resolution**: Check if An is *reducible to inference*. If yes, only P and I are accepted; if not, An is distinct. This requires a sub-node not included here.  

  ---

  **Key**:  
  - **P** = Pratyakṣa (perception), **I** = Anumāna (inference), **T** = Śabda (testimony), **Ar** = Arthāpatti (postulation), **An** = Anupalabdhi (non-apprehension), **U** = Upamāna (comparison).  
  - **Attribution notes**: Prabhākara Mīmāṃsā’s rejection of An is debated; some scholars classify it differently.  
  - **Tree limitations**: Focuses on reduction disputes per the query; does not cover all sub-school variations.  

