  I'm working on a graduate seminar paper on Bernard Williams and I want to turn a half-formed idea into a short research proposal. My half-formed idea: Williams's integrity objection (the argument that a theory of practical rationality which attributes to an agent reasons that are external to her subjective motivational set demands a kind of self-alienation) and his one-thought-too-many case (two negligent drivers, one of whom hits a child, and the child-case driver has the extra thought that the victim was a child) seem to pull in opposite directions about the status of moral reasons that are alien to the agent's own motivations, and I'm not sure he can hold btoh. Can you turn this into a research proposal? I want the response as a numbered list of exatly five items, each item one or two sentences, with no intro or conclusion. Item 1 should state the precise question. Item 2 should say why the existing readings of Williams leave it open. Item 3 should give the method, i.e. what I'd actually do and why that approach rather than just close exegesis. Item 4 should say what a successful result would look like. Item 5 should say what would count as the project failing. Don't bother with citations or a reading list, I'll add those myself.
