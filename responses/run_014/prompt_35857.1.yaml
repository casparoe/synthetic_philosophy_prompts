answer: |-
  ### AI Safety Stance Decision Tree  
  *Start at the top. Answer each question based on your intuition—no jargon required.*

  ---

  **1. Do you believe the biggest risk is the AI taking *extreme actions* (e.g., catastrophically bad decisions), even if it’s usually well-behaved?**  
  - **YES** → You’re at **Quantilization/Bounded Impact**: Focus on clipping extreme actions (e.g., "never take a 1-in-a-million risk"), not perfect input guarantees.  
  - **NO** → Go to 2.  

  **2. Do you require a 100% guarantee the system *never* fails, even on astronomically rare or malicious inputs?**  
  - **YES** → Go to 3.  
  - **NO** → Go to 4.  

  **3. Can you accept safety guarantees that aren’t *formally proven* (e.g., no mathematical proof of zero failures)?**  
  - **YES** → **Unoccupied**: Demanding 100% safety without proof is incoherent (you can’t test every input).  
  - **NO** → You’re at **Hard Worst-Case Verification**: Trust requires a formal proof for all possible inputs.  

  **4. If a system fails 1-in-a-trillion times on random inputs, but is safe on *expected real-world inputs*, is that acceptable?**  
  - **YES** → Go to 5.  
  - **NO** → Go to 6.  

  **5. Does it matter if failures are *deliberately triggered* (e.g., by hackers or goal-seeking agents)?**  
  - **YES** → You’re at **Adversarial Robustness**: Average-case safety isn’t enough—real-world adversaries will exploit hidden flaws.  
  - **NO** → Go to 7.  

  **6. Is your objection rooted in the belief that *optimizers in the environment* (e.g., rivals, AI agents) will *seek out* failures?**  
  - **YES** → You’re at **Adversarial Robustness** (see above).  
  - **NO** → **Unoccupied**: Rejecting rare random failures *without* adversarial concern is inconsistent (if no one hunts for flaws, ultra-rare failures may never occur).  

  **7. Is "safety assurance" mostly about *statistical guarantees* (e.g., 99.9999% safe under your best estimate)?**  
  - **YES** → You’re at **Empirical/Average-Case Safety**: Trust comes from evaluations, red-teaming, and measuring tail risks.  
  - **NO** → You’re at **Engineering Deflationism**: Treat AI like bridges or planes—use best practices, not guarantees.  

  ---

  ### Key  
  - **Hard Worst-Case Verification**: Demands proofs; no failures ever.  
  - **Empirical/Average-Case Safety**: Relies on data from testing and real use.  
  - **Adversarial Robustness**: Worries about adversaries forcing failures; average-case isn’t sufficient.  
  - **Quantilization/Bounded Impact**: Avoid extreme actions; don’t sweat inputs.  
  - **Engineering Deflationism**: Manage risk pragmatically; "guarantees" are unrealistic.  
  - **Unoccupied**: Logically inconsistent or empirically unjustified.  

  ### Notes  
  - **Indistinguishable Positions**:  
    - **Empirical/Average-Case Safety** and **Engineering Deflationism** often *look similar* in practice (both use testing and monitoring). They split on philosophy: the former seeks quantifiable guarantees ("99.99% safe"), while the latter avoids framing safety probabilistically.  
  - **Quantilization** is a distinct approach: it constrains *actions*, not inputs.  
  - **Adversarial Robustness** is split from average-case by the belief that optimizers *change the game*.  
  - **Unoccupied nodes** are incoherent (e.g., demanding 100% safety without proof) or implausible (e.g., fearing ultra-rare random failures but not adversarial pressure).  

  ---  
  *One page. Jargon-free nodes. Built from logical splits, not predefined camps.*
