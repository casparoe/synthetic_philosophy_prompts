answer: |-
  ## The Shifting Sands: Why the Normal-Function Criterion Cannot Anchor the Therapy/Enhancement Distinction

  The allure of the normal-function criterion is undeniable. It promises an objective, biologically grounded line: therapy restores a function to the species-typical range; enhancement pushes it beyond. Yet, the specter of baseline drift haunts this clarity. As interventions once deemed enhancements become widespread – cognitive enhancers, mood optimizers, metabolic regulators – the very definition of "species-typical" shifts. Yesterday's enhancement becomes tomorrow's baseline, transforming into a potential therapy for those falling below the *new* norm. This temporal instability isn't a minor quibble; it strikes at the criterion's core promise of providing a stable, non-arbitrary foundation for a crucial ethical distinction. Let's weigh the proposed defenses against this drift and see if the criterion can truly be salvaged.

  **The Anchoring Reply: Fixing the Baseline in Time**

  The most instinctive defense is to anchor the species-typical range to a fixed historical point – perhaps "pre-enhancement humanity" or "the natural human state" before specific technological interventions. This aims to halt the drift by defining "normal function" against an immutable biological benchmark.

  *   **The Fatal Flaws:**
      1.  **Arbitrary Selection:** *Which* historical moment is ethically privileged? Pre-antibiotics? Pre-writing? Pre-agriculture? Pre-fire? Each choice is arbitrary. Why is the state of humanity just before *this specific* wave of enhancements morally definitive? Evolution itself is constant drift; there is no single "natural" state.
      2.  **Normative Vacuum:** Merely picking a past state doesn't explain *why* that state's capacities define the moral boundary. It assumes past biology dictates present ethics, ignoring that our understanding of flourishing evolves. Is enduring chronic pain "normal" and thus leaving it untreated morally neutral? Anchoring condemns us to valorize potentially avoidable suffering simply because it was typical in the past.
      3.  **The Innovation Paradox:** This approach implicitly brands *all* future enhancements crossing the fixed line as categorically distinct from therapy, potentially stifling beneficial innovation. It renders future generations perpetually "enhanced" relative to the anchor, denying them the therapeutic label even if their unmodified state causes significant disadvantage in *their* world.
      4.  **Practical Collapse:** Defining and measuring the precise capacities of this fixed baseline across all relevant functions is likely impossible, reintroducing the vagueness problems the criterion sought to avoid, but now compounded by historical uncertainty.

  Anchoring attempts to solve the temporal problem by freezing biology in time, but it replaces drift with arbitrariness and a morally dubious reverence for a potentially less desirable past. It abandons the criterion's aspiration to be grounded in *current* biological reality.

  **The Pragmatic Reply: Drift as a Feature, Not a Bug**

  A more sophisticated defense argues that the therapy/enhancement distinction was never intended as a permanent, deep moral truth, but rather as a *practical tool* for specific contexts: prioritizing healthcare resource allocation (triage), determining insurance coverage, and regulating novel biomedical interventions.

  *   **Its Strengths:** This view acknowledges reality: norms *do* change, and policy *must* adapt. What counts as a medically necessary intervention *should* depend on the prevailing standards of function in a society. Insurance covering hearing aids is sensible because hearing is crucial for participation today, even if past humans managed without. The distinction remains useful *despite* drift because it tracks socially relevant thresholds of disadvantage at a given time.
  *   **Why it Abandons the Core Criterion:** This pragmatic defense succeeds precisely by *surrendering* the original ambition of the normal-function criterion. It concedes that the line is:
      *   **Socially Constructed:** The "species-typical range" becomes shorthand for the *socially expected or required range* for adequate functioning in the contemporary environment, heavily influenced by prevalent technologies.
      *   **Instrumental, Not Foundational:** The distinction serves contingent social goals (fair resource allocation, risk management), not an objective biological truth about the nature of medical intervention.
      *   **Devoid of Inherent Moral Weight:** The moral significance comes not from crossing a biological boundary, but from the *consequences* of falling below the prevailing social baseline (disadvantage, suffering, exclusion). Enhancement isn't inherently problematic; its evaluation depends on context, risks, equity, and the specific goals involved.

  Pragmatism saves the *usefulness* of a distinction but jettisons the core idea that biology objectively dictates where therapy ends and enhancement begins. The "normal-function" label becomes a misleading veneer over a shifting socio-technological reality.

  **Verdict: Baseline Drift Sinks the Foundational Ambition**

  The baseline-shift problem, standing alone, **demonstrates conclusively that the normal-function criterion cannot ground the therapy/enhancement distinction in the way its proponents originally intended.** The criterion promised an objective, stable, biologically derived line. Drift reveals this promise as illusory:

  1.  **Inherent Instability:** The line is inherently unstable over time because "species-typical" is a statistical description of a population that changes as the population changes via technological adoption.
  2.  **Destroys Non-Arbitrariness:** Any attempt to fix the baseline (anchoring) introduces profound arbitrariness in selecting the reference point and lacks a coherent normative justification. Embracing drift (pragmatism) makes the line contingent on social and technological circumstances, abandoning biological objectivity.
  3.  **Severs Biology from Normativity:** The criterion mistakenly assumes that a descriptive biological fact ("species-typical range") can directly yield a prescriptive ethical norm ("this is therapy, that is enhancement"). Drift exposes the gap between "is" and "ought." Biology tells us about statistical norms, not about what levels of function we *should* aim for or consider necessary for health.

  **Salvaging the Motivations: Beyond Biology**

  The failure of the normal-function criterion as a *foundation* doesn't mean the motivations behind the therapy/enhancement distinction vanish. They remain vital and point towards a different approach:

  *   **Prioritizing Need:** The core motivation – ensuring resources address suffering and significant functional impairment – survives. We need criteria for **medical necessity**, focusing on *current disadvantage*, *harm*, or *significant limitation* relative to societal demands for participation and well-being. This is inherently contextual and evaluative, not purely biological.
  *   **Managing Novelty and Risk:** The desire for caution with powerful new interventions survives. This calls for **risk-benefit assessment** and **governance frameworks** specific to novel augmentation technologies, focusing on safety, efficacy, equity, coercion, and long-term societal impacts, rather than labelling them inherently "enhancements."
  *   **Promoting Equity:** The concern about unfair advantages or exacerbating social inequalities survives. This demands explicit focus on **justice and access** in the development and deployment of *all* biomedical interventions, whether restoring function or augmenting it.

  **The Path Forward: From Biological Line to Ethical Evaluation**

  We must abandon the quixotic quest for a single, objective biological line. Instead, we should:

  1.  **Define "Medical Need" Contextually:** Develop robust, multi-faceted definitions of dysfunction and medical necessity that incorporate biological factors, functional limitations, subjective suffering, *and* the demands of participation in contemporary society. This acknowledges the shifting baseline without being enslaved by it.
  2.  **Assess Interventions Holistically:** Evaluate biomedical interventions based on their specific:
      *   **Goals:** Restoring lost function? Alleviating suffering? Optimizing desired traits?
      *   **Risks and Benefits:** Individual and societal.
      *   **Impact on Autonomy and Justice:** Potential for coercion, exacerbation of inequalities, fair access.
      *   **Nature of the Change:** Is it correcting a clear pathology, or altering a function within or beyond the *current* typical range?
  3.  **Develop Tailored Governance:** Create regulatory frameworks sensitive to the specific challenges and potentials of different interventions, moving beyond the crude therapy/enhancement binary. Novel augmentations might warrant specific oversight for safety and equity, distinct from frameworks for established treatments.

  **Conclusion:**

  The baseline drift is not a quiet problem; it is a seismic tremor shattering the foundation of the normal-function criterion. It reveals that "species-typical" is a moving target, incapable of providing the stable, objective ethical boundary its proponents sought. Anchoring the past is arbitrary; embracing drift abandons biological objectivity. The criterion, as a grounding principle, cannot be salvaged. However, the urgent motivations behind the distinction – prioritizing need, managing risk, ensuring equity – remain compelling. The path forward lies not in clinging to a fading biological mirage, but in embracing a more nuanced, contextual, and ethically robust framework that evaluates interventions based on their specific impacts, goals, and consequences within the ever-evolving landscape of human capacity. The therapy/enhancement distinction, as biologically defined, belongs to yesterday; the complex ethics of human flourishing demand the tools of tomorrow.
