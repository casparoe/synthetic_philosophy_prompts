prompt: |-
  I'm a TA and next week I have to teach the paradox of deontology to first-years in one fifty-minute section. Not deontology generally — specifically the paradox that agent-centered constraints seem to forbid minimizing constraint-violations: if it's wrong to kill, why isn't it also wrong to let five be killed when you could stop it by killing one? Don't explain it to me; plan how I should explain it. What has to come first, what example should carry the whole thing (and why not the standard trolley problem, if not that), which misconceptions the students will form — I'm guessing 'those are totally different kinds of acts' or 'just be a consequentialist then' — and exactly where in the sequence I should head each one off, plus one question I can ask at the end to see whether they actually got the paradox rather than just feeling uneasy about it. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a TA preparing to teach the paradox of deontology to first-year students in a fifty-minute section. They need a structured plan focusing specifically on the paradox, not deontology in general. The main challenge is explaining why agent-centered constraints forbid minimizing violations even when it leads to worse outcomes. 

  First, I need to consider the students' level. First-years likely have limited philosophy exposure, so simplicity and concrete examples are crucial. The trolley problem is overused and might derail into utilitarianism debates. Instead, Bernard Williams' Jim and the Indians feels fresher and more emotionally charged—it forces students to confront the personal cost of violating a constraint. 

  The user warned about common misconceptions: students might dismiss the paradox by saying killing vs. letting die are fundamentally different acts, or just default to consequentialism. I should preempt these. For the "different acts" objection, I'll emphasize that deontologists *do* see a moral difference but still face the paradox of why minimizing harm isn't obligatory. For the consequentialist cop-out, I'll stress that the exercise is about understanding the deontologist's dilemma, not solving it. 

  Timing is tight—50 minutes means I must sequence carefully. Start with a clear deontology refresher (duties over outcomes), then the paradox setup, then Jim's example. After revealing the paradox, pause for student reactions to spot misunderstandings early. When addressing misconceptions, explicitly label them ("Some might think... but here's why that misses the point"). 

  The kicker question at the end must test if they grasp the paradox structure, not just feel queasy about Jim's choice. "Why can't a deontologist consistently forbid Jim from killing one while also lamenting that this results in more deaths?" forces them to articulate the tension between constraints and minimizing violations. 

  One risk: students might fixate on Jim's emotions (guilt/shame) as a solution. I should note that while Williams mentions them, they don't resolve the core paradox—feelings don't change the duties. Also, avoid getting bogged down in "what would you do?"; the goal is analyzing deontology's coherence, not personal judgment. 

  Finally, the user wants no preamble—so I'll lead with the key takeaway: "Use Bernard Williams' Jim and the Indians case to expose the paradox, then systematically debunk likely misconceptions." Everything else supports that.
answer: |-
  **Bottom line: Use Bernard Williams' "Jim and the Indians" case as the central example to force the paradox into sharp focus, preempting key misconceptions by structuring the sequence around explicit contrasts between deontological constraints and consequentialist minimization logic.**

  **Reasoning & Plan (50-Minute Section):**

  1.  **Primer: Deontology's Core Commitment (5 mins)**
      *   **What:** Quickly recap deontology (assume prior reading): Morality is about rules/duties (e.g., "Don't kill innocent people"), NOT just about outcomes. Your duty NOT to do a bad act (like killing) is strong, even if *not* doing it leads to a *worse overall outcome*.
      *   **Why:** Establishes the foundation – agent-centered constraints exist and are primary. Crucial for later contrast.

  2.  **Introduce the Minimization Temptation (Consequentialist Logic) (5 mins)**
      *   **What:** Present a simple consequentialist idea: "If you can prevent *more* harm/bad acts by performing *one* bad act (or allowing a lesser one), shouldn't you? It minimizes the total badness."
      *   **Example:** *Briefly* mention a trolley-like *outcome* (5 deaths vs. 1 death) **without** the trolley mechanics. Focus purely on the numbers: "Preventing 5 deaths seems better than preventing 1 death, right?"
      *   **Why:** Sets up the intuitive pull students will feel. Creates the tension deontology must confront.

  3.  **Deploy "Jim and the Indians" (10 mins)**
      *   **The Case:** Jim, a botanist, stumbles upon a scene. A captain has 20 innocent Indians tied up. As a gesture of goodwill, he offers Jim this choice: Jim can shoot one Indian himself, and the other 19 will go free. If Jim refuses, the captain will shoot all 20.
      *   **Why this example, NOT Standard Trolley?**
          *   **Personal Agency:** Jim *personally* must kill one (violate a constraint) vs. impersonal lever-pulling (which students often intuitively rationalize as "not *really* killing").
          *   **No Distracting Mechanics:** Removes debates about tracks, switches, fat men, etc. The moral dilemma is stark and unavoidable.
          *   **Equal Blame/Innocence:** All potential victims are equally innocent and threatened by the *same* bad actor (the captain), removing distractions about victim "value" or direct threats.
          *   **Clear Numbers:** 1 death vs. 20 deaths – the minimization pressure is extreme and undeniable.
      *   **Explain Jim's Dilemma:** Emphasize Jim's personal duty "Do not kill an innocent person" vs. the outcome (1 death vs. 20 deaths). Ask: "What should Jim do, *if* he's a deontologist?"

  4.  **State the Paradox Explicitly (5 mins)**
      *   **What:** "Here's the paradox for deontology: If it's *absolutely* wrong for Jim to kill one innocent person (a constraint), why isn't it *also* wrong for Jim to *allow* the captain to kill 20 innocent people *when he could prevent it* by killing just one? By refusing to kill the one, Jim seems to be *allowing* 20 killings to happen that he could have prevented. He's effectively *choosing* the outcome with *more* violations of the very rule he holds sacred ('Don't kill innocents')."
      *   **Why:** Forces the core inconsistency: Constraints forbid minimizing violations of those same constraints.

  5.  **Address Likely Misconceptions Proactively (15 mins - Head them off *here*)**
      *   **Misconception 1: "Killing is fundamentally different from letting die/allowing."**
          *   **Head off:** Immediately after stating the paradox, say: "Some might think, 'But Jim *killing* one is totally different from Jim *letting* the captain kill 20. They're different kinds of acts!'"
          *   **Refute:** "Remember, deontology *already* distinguishes these acts! That's *why* Jim has a duty not to kill. But the paradox *remains*: Why does his duty not to kill *himself* prevent him from minimizing the *total number of killings*? The deontologist still needs to explain why minimizing killings isn't *also* a duty, or why the 'no killing' duty is so strong it overrides preventing *many more* killings by someone else. The difference in act type explains why Jim has a primary duty *not to kill*, but it doesn't explain why *allowing more killings* isn't a huge problem *for the value the constraint is protecting*."
      *   **Misconception 2: "Just be a consequentialist then / Deontology is stupid."**
          *   **Head off:** After refuting Misconception 1, say: "Feeling frustrated? Thinking, 'This is nonsense! Obviously Jim should shoot the one and save 19 lives! Just be a consequentialist!'?"
          *   **Refute:** "Hold on. The point of this paradox isn't to *solve* it by switching theories. It's to expose a deep challenge *within* deontology itself. Consequentialism avoids this problem by focusing *only* on outcomes. But if you think there really *are* things you must never do (like kill an innocent), even for good consequences, then you *must* grapple with why that rule doesn't *also* tell you to minimize violations of that rule *by others*. The paradox shows it's surprisingly hard for deontology to *consistently* explain its own core commitment to constraints without them seeming arbitrary or self-defeating when minimizing harm is possible."

  6.  **Reinforce the Paradox & Conclude (5 mins)**
      *   Briefly restate the paradox in terms of Jim: Jim's deontological duty forbids him from violating a constraint (killing one), but *by* fulfilling that duty, he *ensures* that 20 constraints are violated (the captain kills 20) – violations he could have reduced to just 1.
      *   Emphasize: This is a puzzle about the *internal coherence* of deontological constraints, not an argument *for* consequentialism (though it motivates looking at it).

  7.  **The Kicker Question (To Check Understanding - End of Q&A/Discussion):**
      *   **Question:** "Imagine a deontologist insists Jim absolutely must NOT shoot the one Indian. Okay. But then, why *isn't* that same deontologist also *required* to say that Jim is doing something *terribly wrong* by *allowing* 20 killings to happen when he could have prevented 19 of them? Why isn't *allowing that many more killings* a massive violation of the value behind the 'don't kill' rule?"
      *   **Why it works:** This directly tests if they grasp the paradox. A student who "gets it" will articulate the tension: the deontologist condemns Jim killing one (a direct violation) but seemingly *cannot* consistently condemn Jim's inaction leading to *more* killings (more violations of the same rule), revealing the inconsistency. Answers focusing *only* on the act/allow distinction or just saying "consequentialism is better" show they missed the paradox's specific challenge to deontology itself.
