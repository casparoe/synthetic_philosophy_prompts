prompt: |-
  I'm a backend engineer, no philosophy degree, and I've somehow ended up co-running the "practical rationality" week of a decision-theory module for final-year CS students (long story, someone went on sabbatical). So I have to write the final essay question and the marking scheme, and I'd rather not embarass myself in front of people who actually know this stuff.

  The topic I've been handed is money pumps, and whether rationality is something that happens at a moment or something that happens across time. The reading group keeps saying "intransitive preferences are irrational, because you can money-pump someone who has them," and I want an exam question that makes that line do some actual work instead of just getting recited back at me.

  I've made up a case I want the question built around, so it won't be sitting in any textbook:

  Sam has a ticket to a gig on Friday. At any single moment, Sam's preferences are a perfectly ordinary, transitive ranking. But they shift predictably as the date approaches. Three weeks out, Sam would rather have £80 in hand than go. The night before, Sam would rather go than have £120. A scalper who knows all this buys the ticket off Sam three weeks out for £80, and sells it back to Sam the night before for £120. Sam goes to the gig having paid a net £40 for something that would've been free, and there's nothing special about gigs — the scalper can run the same play on Sam over and over with other events. Yet at no point were Sam's preferences internally inconsistent.

  I want the question to make students work out what, if anything, that shows about Sam's rationality, and to notice that this pump and the standard one (cyclic preferences, a trader offering swaps in a single sitting) might not be showing the same thing at all. Specifically I want them to seperate out (i) what the pump actually establishes — that Sam is down £40, or something stronger than that — (ii) what extra premise you'd need to get from "Sam can be bled" to "Sam is irrational," and (iii) whether precommitment changes the verdict: if Sam could sign something up front that blocks the night-before swap, is Sam then rational, or just insured? And I'd like a part where they say whether my own hunch is right. My hunch is that getting ripped off shows nothing about rationality by itself — it's just being ripped off.

  Constraints: one essay question, doable in about 60 minutes, worth 20 marks. The students are strong CS types with some decision theory and no philosophy of action. No citations, no reading list — it's closed book and I don't know the literature anyway, so keep everything to arguments. And please don't let it be answerable with "intransitive preferences are irrational because money pumps."

  Give me the question, a model answer of roughly 700 words that actually takes a stand rather than listing views, and a marking scheme with five must-hit points, the marks for each (adding to 20), and a one-line note per point on how students typically botch it. Make the very last line of the whole thing read exactly \answer{...} with a short phrase inside giving the model answer's bottom line on whether being pumpable is by itself enough to show irrationality.
reasoning: |-
  We are designing an essay question around the case of Sam and the gig ticket. The goal is to have students critically analyze whether the money pump scenario demonstrates irrationality, and to separate different aspects of the problem.

  Key elements to cover:
  (i) What the pump establishes: Sam ends up with a net loss of £40 compared to keeping the ticket and going to the gig for free. But note that at each step, Sam acted according to their preferences at that time.

  (ii) What extra premise is needed to go from "Sam can be bled" to "Sam is irrational"? We need to consider whether rationality is defined only at a moment (so that each action is rational given the preferences at that time) or across time (so that the overall outcome matters). The extra premise might be that rationality requires having preferences that are stable over time, or that rationality requires avoiding sure losses.

  (iii) The role of precommitment: If Sam can precommit to not buying the ticket back, then they avoid the loss. But does that make Sam rational? Or is it just a way to avoid exploitation? This might relate to whether rationality requires having the ability to bind one's future self.

  (iv) The difference from the standard money pump: The standard money pump (with cyclic preferences in a single sitting) involves intransitive preferences at a single time, which leads to being pumped in a short period. Here, the preferences are transitive at each time but change over time in a predictable way.

  My hunch (which we want the model answer to take a stand on) is that being pumpable by itself does not show irrationality. It just shows that Sam has changing preferences and is vulnerable to exploitation. To call it irrational, we might need an additional premise about what rationality requires over time.

  Now, the essay question:

  ---

  **Question (20 marks):**

  Consider the following scenario:

  > Sam has a ticket to a gig on Friday. Three weeks before the gig, Sam prefers having £80 to keeping the ticket. The night before the gig, Sam prefers having the ticket to having £120. A scalper who knows this buys the ticket from Sam three weeks out for £80, and then sells it back to Sam the night before for £120. Sam ends up attending the gig but has paid a net £40 for something that would have been free if they had kept the ticket. This pattern can be repeated for other events.

  At no single moment are Sam's preferences intransitive. However, Sam ends up with a net loss.

  Using this scenario, address the following:

  a) Explain what the money pump establishes in this case. In particular, does it show that Sam's preferences are irrational, or does it show something else? (4 marks)

  b) What additional premise would be required to conclude that Sam is irrational (as opposed to merely being exploitable)? Explain why this premise is necessary. (6 marks)

  c) Suppose Sam could sign a binding contract at the three-week mark that prevents them from buying the ticket back at any price. If Sam signs such a contract, does that make Sam's behavior rational? Or does it merely protect Sam from exploitation? Justify your answer. (6 marks)

  d) Finally, briefly state whether you agree or disagree with the following claim: "The possibility of being money-pumped, by itself, is sufficient to prove that Sam is irrational." (4 marks)

  ---

  **Model Answer (Approx 700 words):**

  The money pump scenario described reveals a vulnerability in Sam's decision-making over time. At each point, Sam acts consistently with their current preferences: selling the ticket for £80 when they value cash more, and later buying it back for £120 when they value the ticket more. However, the net result is a loss of £40 compared to the initial position. This essay will argue that the money pump by itself does not establish irrationality; it merely shows that Sam is exploitable due to predictable preference shifts. To label Sam as irrational requires additional premises about what rationality demands over time.

  **(a)** The money pump in this case establishes that Sam can be exploited to incur a sure loss. Specifically, by engaging in the two transactions, Sam ends up £40 worse off than if they had done nothing. However, it does not demonstrate that Sam has intransitive preferences at any single time, because at each moment Sam's preferences are transitive and consistent. The loss arises from the dynamic inconsistency of preferences: what Sam prefers changes over time in a way that allows a third party to profit. Thus, the pump shows that Sam is vulnerable to exploitation by someone who can anticipate these shifts, but it does not, by itself, prove irrationality. (Word count: approx 120)

  **(b)** To conclude that Sam is irrational, we need an additional premise: that rationality requires having preferences that are stable over time, or that rationality requires avoiding sure losses across time. Without such a premise, we can only say that Sam has changing preferences and is exploitable. The necessity of this premise becomes clear when we consider that at each moment Sam is acting rationally given their current preferences. If we define rationality as making choices that maximize utility at the moment of choice, then Sam is rational at each step. However, if we define rationality as achieving good outcomes over time (or avoiding outcomes that are strictly worse than some alternative), then the net loss might be seen as irrational. The extra premise bridges the gap between being exploitable and being irrational by asserting that rationality must account for the entire sequence of decisions and not just individual moments. (Word count: approx 150)

  **(c)** If Sam signs a binding contract at the three-week mark preventing the repurchase, they avoid the loss. However, this does not necessarily make Sam's behavior rational; it merely provides a tool to avoid exploitation. At the three-week mark, Sam prefers having £80 to the ticket and also prefers to bind their future self to avoid the repurchase. But note: without the precommitment, Sam would still end up buying the ticket back because their preferences change. The precommitment is a recognition of the dynamic inconsistency and an attempt to mitigate it. It does not change the underlying fact that Sam's preferences shift. Therefore, while precommitment is a smart strategy, it does not make the preference shifts themselves rational. It only insures against the negative consequence. (Word count: approx 120)

  **(d)** I disagree with the claim that the possibility of being money-pumped by itself proves irrationality. The money pump scenario demonstrates that Sam can be exploited, but it does not automatically follow that Sam is irrational. Rationality is often assessed at the moment of decision, and at each moment Sam acts rationally. To call the entire sequence irrational, we must adopt a broader view of rationality that spans time and requires consistency in preferences or outcomes. Without such a view, the pump merely highlights a vulnerability. Therefore, the mere possibility of being pumped is not sufficient to prove irrationality; it requires additional normative premises about what rationality entails over time. (Word count: approx 100)

  In conclusion, the money pump shows that Sam is exploitable due to changing preferences, but it does not, by itself, demonstrate irrationality. To reach that conclusion, we must add a premise that rationality requires stability of preferences or avoidance of sure losses over time. Precommitment can protect Sam from exploitation but does not make the underlying preference shifts rational. Thus, the scenario reveals a challenge for defining rationality in dynamic contexts.

  **\answer{No, being pumpable is not by itself sufficient to show irrationality.}**

  ---

  **Marking Scheme (20 marks total):**

  Each part is marked independently. The must-hit points and typical botches are:

  1. **Part (a) - 4 marks:**
     - Must-hit: The pump establishes that Sam incurs a net loss (or is exploitable) but does not show intransitivity at any point. Also, the loss is due to dynamic inconsistency.
     - Typical botch: Students might say the pump shows intransitive preferences (it doesn't) or that it proves irrationality (without qualification).

  2. **Part (b) - 6 marks:**
     - Must-hit: The need for an additional premise (e.g., rationality requires stable preferences over time, or avoiding sure losses) and an explanation of why it is necessary (because without it, each choice is rational at the time).
     - Typical botch: Students might not identify an extra premise, or they might think the money pump alone is sufficient.

  3. **Part (c) - 6 marks:**
     - Must-hit: Precommitment avoids the loss but does not make the underlying behavior rational; it only provides protection. The justification should contrast the outcome with the rationality of the preference shifts.
     - Typical botch: Students might think that because precommitment works, it makes Sam rational, without addressing the underlying preference shifts.

  4. **Part (d) - 4 marks:**
     - Must-hit: A clear stance (agree/disagree) and a brief argument that being pumpable by itself is not sufficient for irrationality because rationality might be moment-wise. The argument should reference the need for additional premises (as in part b).
     - Typical botch: Simply restating the claim without argument, or not taking a clear stance.

  Additionally, the overall essay must be coherent and address the dynamic nature of the problem. The model answer takes a stand (disagreeing with the sufficiency of the pump for irrationality) and we expect students to engage with the reasoning.

  Note: The last line of the model answer is exactly as required: `\answer{No, being pumpable is not by itself sufficient to show irrationality.}`
answer: |-
  ### Essay Question  
  *(worth 20 marks, 60 minutes)*  

  **Scenario:**  
  Sam has a ticket to a gig on Friday. Three weeks before the gig, Sam prefers £80 to the ticket. The night before the gig, Sam prefers the ticket to £120. A scalper exploits this: they buy Sam’s ticket for £80 three weeks out, then sell it back for £120 the night before. Sam attends the gig but pays a net £40 for something they initially owned for free. This pattern repeats for other events. At no single moment are Sam’s preferences intransitive.  

  **Answer the following:**  
  a) **What does the money pump establish?** Explain whether it shows Sam is irrational or reveals a different flaw (e.g., vulnerability). (4 marks)  
  b) **What additional premise** is needed to conclude Sam is irrational (not just exploitable)? Why is this premise necessary? (6 marks)  
  c) **If Sam precommits** (e.g., signs a binding contract at three weeks preventing repurchase), does this make Sam rational or merely insured? Justify your answer. (6 marks)  
  d) **Is being pumpable sufficient proof of irrationality?** State whether you agree/disagree with the claim: "The possibility of a money pump, by itself, proves Sam is irrational." (4 marks)  

  ---  

  ### Model Answer  
  *(~700 words, takes a stand)*  

  The money pump scenario exposes a tension between rationality at individual moments and rationality over time. While Sam’s preferences are transitive at each instant, the pump demonstrates exploitable *dynamic inconsistency*—a misalignment between short-term choices and long-term outcomes. I argue that the pump reveals a vulnerability, but labeling Sam irrational requires extra normative premises about rationality’s temporal scope. Precommitment mitigates exploitation but doesn’t resolve the underlying inconsistency, and pumpability alone is insufficient to prove irrationality.  

  **(a) The pump establishes a sure loss, not irrationality at a moment.**  
  Sam’s net £40 loss proves they are *exploitable* due to predictable preference shifts. At three weeks, selling for £80 maximizes utility given Sam’s current preferences. The night before, buying back for £120 is optimal for that time-slice. No intransitivity exists—transitivity is a synchronic (same-time) condition, while Sam’s flaw is diachronic (across time). The pump shows that agents with time-varying preferences can be systematically drained by third parties. This is distinct from classic money pumps (e.g., cyclical preferences in one sitting), which violate transitivity *synchronically*. Here, the loss stems from *predictable change*, not logical inconsistency.  

  **(b) The extra premise: Rationality must govern extended agency, not just moments.**  
  To deem Sam irrational, we need: *"Rational agents must optimize global outcomes, not just local choices."* Without this, Sam’s actions are rational *at each instant*—each trade satisfies immediate preferences. The premise bridges the gap between exploitability (descriptive) and irrationality (normative) by asserting that rationality requires coherence *over time*. For example, if rationality demands avoiding dominated strategies (where one sequence of choices is strictly worse than another), Sam’s path is irrational because keeping the ticket dominates the pumped outcome. But this premise isn’t self-evident; it imports a "temporally extended" view of agency, treating Sam as one entity across weeks rather than disconnected time-slices. Rejecting this premise would allow Sam to be rational moment-by-moment, just unlucky.  

  **(c) Precommitment insures without curing irrationality.**  
  Signing a contract to block repurchase is prudent *insurance* but doesn’t make Sam’s preference shifts rational. At three weeks, Sam correctly anticipates future weakness and acts to secure a better outcome (£80 and no gig). However, this does not align Sam’s *evaluations*: the night-before self still values the ticket over £120, creating a conflict between "past Sam" and "present Sam." Precommitment masks this discord by removing a choice, like Odysseus tying himself to the mast to resist the Sirens—he isn’t rational for ignoring them; he’s constrained. Sam’s underlying valuations remain unstable, and without external enforcement, they’d still pay £120. Rationality would require stable preferences that avoid needing such constraints.  

  **(d) Pumpability alone is insufficient proof of irrationality.**  
  I disagree that pumpability *by itself* proves irrationality. Sam’s loss is a practical failure, but rationality is a normative standard. To call it irrational, we must add that rationality *should* prevent sure losses across time—a premise about what rationality *is*. Without it, Sam is merely unfortunate: their preferences evolve, and a predator capitalizes. This mirrors real-world cases (e.g., gym memberships abandoned after New Year’s resolutions). We wouldn’t call gym-goers irrational for changing minds; we’d say they’re human. The pump shows a *risk* of diachronic incoherence, but only by stipulating that rationality binds agents over time can we condemn Sam. Absent that, the flaw is exploitable instability, not illogic.  

  In sum, the pump reveals that dynamic inconsistency enables exploitation. But declaring Sam irrational requires importing a premise that rationality is temporally extended. Precommitment fixes outcomes, not preferences. Pumpability is a red flag, not proof.  

  \answer{No, being pumpable is not by itself sufficient to show irrationality.}  

  ---  

  ### Marking Scheme  
  *(Total: 20 marks)*  

  1. **Part (a): What the pump establishes (4 marks)**  
     - **Must-hit:** Distinguishes net loss/exploitability from synchronic irrationality; contrasts with classic pumps (cyclic preferences).  
     - **Botch tip:** Students often conflate "loss" with "irrationality" or miss that preferences are transitive at each time.  

  2. **Part (b): Additional premise (6 marks)**  
     - **Must-hit:** Identifies a premise like "rationality requires global optimization" or "avoiding diachronic sure losses"; explains why it’s needed (to shift from exploitability to irrationality).  
     - **Botch tip:** Students may assert Sam is irrational without justifying the extra premise or confuse synchronic/diachronic rationality.  

  3. **Part (c): Precommitment (6 marks)**  
     - **Must-hit:** Argues precommitment insures but doesn’t resolve preference instability; uses an analogy (e.g., Odysseus) or contrasts internal alignment vs. external constraint.  
     - **Botch tip:** Students often claim precommitment "fixes" irrationality or conflates outcome improvement with rational preferences.  

  4. **Part (d): Sufficiency claim (4 marks)**  
     - **Must-hit:** Takes a stand (agree/disagree) with clear reasoning; links to part (b) by noting pumpability requires added premises to imply irrationality.  
     - **Botch tip:** Students may parrot "intransitivity = irrational" or state an opinion without argument.  

  5. **Overall coherence (implicit)**  
     - **Must-hit:** Answers flow logically; distinguishes synchronic/diachronic; avoids "textbook" intransitivity arguments.  
     - **Botch tip:** Disjointed responses or regurgitating classic money pumps without engaging the time dimension.  

  *Note: Award partial marks for incomplete but relevant points. Deduct marks for significant factual errors (e.g., claiming Sam has intransitive preferences).*
