  Please argue that Kavka's toxin puzzle is not a genuine puzzle about rationality, just an artifact of how its set up: the eccentric pays you for a mental state (an intention to drink) that your own rationality is guaranteed to frustrate, so the 'paradox' only reflects a mismatch between the reward and the way intentions work over time, not any incoherence in rational choice. Take the strongest version of the other side -- that rationality really does require you to intend to drink -- seriously, and then explain why even on that view the puzzle doesn't show rationality is incoherent.
