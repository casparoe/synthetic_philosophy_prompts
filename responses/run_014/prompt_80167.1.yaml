prompt: |-
  I have been trying to work out what I actually think about the contrast I associate with German and American folk morality: a rule-order morality that privileges rule-following, order, and public trust, and a conscience morality that privileges individual judgment and case-by-case moral responsibility. I want a principle, or a small set of candidate principles, that captures my gut verdicts on the following cases and then says which of the two traditions the principle gives the better of it, and in what respect.

  Returning a lost wallet with identification to the police is right even if the owner is a person I dislike, because public trust depends on the rule being treated as impersonal. Not reporting a friend's minor parking violation, when the fine would cause real hardship and the rule is not safety-related, is also right, not because the rule is optional, but because conscience should not be used to make oneself a petty enforcer. Driving fifteen kilometers per hour over the limit on an empty road at night is morally permissible, though not admirable, because it injures no one's reasonable expectations. I nevertheless think it is wrong to break a workplace rule against taking snacks from the supply cupboard, even if harmless and unnoticed, because the rule is a public commitment that the workplace has asked everyone to honor. I also think it is right for a teacher to override a school rule requiring the reporting of a student's non-dangerous mistake, if reporting would shame the student and the teacher can protect the student's dignity. Finally, I think it is wrong for a citizen to refuse to pay a lawful tax they dislike, as long as there is an available legal channel for protest, because private conscience cannot veto collective decisions.

  The pair I keep going back and forth on is the workplace-snack rule and the teacher-reporting rule: both seem to be harmless rule-breaking, but I treat one as a failure of order and the other as an exercise of conscience. Is there a coherent principle that gets all of these, or close? State each candidate precisely, say which case motivates each clause, what it predicts for cases I have not listed, such as a nurse following a hospital rule that delays a minor but urgent request, or a shopkeeper refusing a legal discount to a regular customer because the discount policy is meant to be uniform, and honestly say which of my verdicts it cannot accommodate. Please also say how confident you are in your main claims and single out the point you are least sure of.
reasoning: |-
  Okay, let me try to unpack this user's query. They're struggling with contrasting German and American folk moralities—rule-order versus conscience-based. They provided several scenarios to test their intuitions and want a principle that explains them all. 

  First, I need to understand each case. Returning a wallet despite disliking the owner emphasizes impersonal rules for public trust. Not reporting a friend's parking violation shows conscience over petty enforcement. Speeding on an empty road is permissible because no harm, but breaking a workplace snack rule is wrong—it's about public commitment. The teacher overriding a reporting rule to protect dignity is right, while refusing taxes is wrong because conscience can't veto collective decisions.

  The user is stuck on the snack rule vs. teacher case. Both seem harmless, but one's a failure, the other conscience. Why? Maybe the snack rule is a mutual agreement, while the teacher is using discretion for care. That suggests a principle where rules based on mutual commitment require strictness, but professional roles allow flexibility for higher goods like dignity.

  Hmm, the Mutual Expectations Principle covers that. It has three parts: harm, mutual commitment, and role-based discretion. Let me test it against all cases. The wallet relies on public trust (mutual commitment). Not reporting avoids petty enforcement (discretion isn't for minor harms). Speeding is okay if no harm. Snack rule breaking violates mutual commitment. Teacher uses role-based discretion for dignity. Tax refusal ignores collective process.

  But what about untested cases? A nurse delaying due to rules might be wrong if harm is significant, but the principle allows overriding if harm is disproportionate. A shopkeeper denying a discount upholds uniformity, which fits mutual commitment. 

  The user's core tension seems to be between systemic integrity and moral agency. German tradition excels in order/trust, American in conscience/flexibility. The principle gives each its due: German for mutual commitments, American for role-based discretion and harm avoidance.

  I'm least sure about the nurse case. If the delay causes real harm, should the nurse override? The principle says yes, but real-world hierarchies might punish that. Still, morally, it fits. The snack rule verdict is strict—some might see it as rigid, but the user's intuition supports it as a public commitment. That's the key anchor.

  Overall, this framework holds up well. It captures the user's intuitions by distinguishing when rules are sacred versus when conscience can intervene. The confidence is high, but the nurse example's practical complexities give me slight pause. Still, conceptually, it works.
answer: |-
  Based on your detailed cases and moral intuitions, I propose the **"Principle of Contextual Moral Fidelity" (CMF)** as the most coherent framework. It integrates harm avoidance, mutual commitment, and role-based discretion:

  **Core Principle:**
  *An act of rule-breaking is permissible only if:*
  1.  **It demonstrably avoids significant, unjustified harm or upholds a core duty of care (Harm/Duty Clause);** *and*
  2.  **It does not violate a specific, mutually understood commitment to systemic integrity essential for trust or coordination within that context (Integrity Clause);** *and*
  3.  **The agent possesses relevant situational authority or expertise justifying discretionary judgment over the rule's purpose in this instance (Discretion Clause).**

  **Breakdown & Case Application:**

  1.  **Harm/Duty Clause (Motivated by: Speeding, Friend's Parking Violation, Teacher Case):**
      *   **Why:** Permits harmless speeding (no harm), not reporting friend's violation (avoiding disproportionate harm), teacher not reporting (avoiding psychological harm, upholding duty of care).
      *   **Predicts:** A nurse *could* ethically override a minor hospital rule causing a harmful delay (e.g., skipping non-essential paperwork for urgent pain meds) if harm is significant and unjustified by the rule's purpose. However, overriding a critical safety protocol would fail this clause.

  2.  **Integrity Clause (Motivated by: Wallet, Snack Rule, Tax Payment):**
      *   **Why:** Returning wallet (essential for public trust system), not breaking snack rule (mutual commitment to shared resource norms), paying tax (essential for collective financing system). This clause protects systems built on predictable adherence.
      *   **Predicts:** The shopkeeper refusing the discount is *right* if the discount policy's uniformity is crucial for perceived fairness/system integrity (Integrity Clause), even if slightly "unfair" to the regular. However, if uniformity isn't vital (e.g., owner explicitly allows discretion), refusal might be petty.

  3.  **Discretion Clause (Motivated by: Teacher Case, Contrast with Snack Rule):**
      *   **Why:** The teacher has situational authority/expertise regarding student welfare and the rule's pedagogical intent. A random employee snacking lacks this – they are a participant, not a designated interpreter/judge of the rule's application in complex cases.
      *   **Predicts:** The nurse delaying care *might* be excused if following a complex triage protocol they don't control (Discretion absent). However, if they are the senior clinician with authority to interpret "urgent need," overriding a non-safety rule causing delay might be permissible under Harm/Duty + Discretion.

  **Resolving Your Core Tension (Snack Rule vs. Teacher):**
  *   **Workplace Snack Rule:** Breaks the **Integrity Clause**. It's a low-stakes mutual commitment to shared resources/order. You lack the **Discretion** to override it based on personal judgment; you're a participant, not a designated arbiter. Harm avoidance is minimal/nonexistent. *(Failure of Order)*
  *   **Teacher Overriding Reporting Rule:** Satisfies **Harm/Duty Clause** (prevents undue shame). Likely satisfies **Discretion Clause** (teacher has authority over student welfare/judgment of pedagogical impact). *May* satisfy Integrity if the rule's purpose (safety/learning) isn't truly undermined by non-reporting in this case. *(Exercise of Conscience within Role)*

  **Accommodating Your Verdicts:**
  *   CMF successfully accommodates all your stated verdicts: Wallet (Integrity), Friend's Parking (Harm/Duty), Speeding (Harm/Duty), Snack Rule (Integrity), Teacher (Harm/Duty + Discretion), Taxes (Integrity).
  *   **Biggest Challenge:** Your verdict on the **friend's parking violation** initially seems to rely *only* on avoiding petty enforcement (Discretion/Harm). CMF *requires* the Harm/Duty Clause to justify it (preventing hardship = avoiding harm). If you believe it's permissible *even if no hardship existed*, purely because "conscience shouldn't be petty," CMF would need adjustment (e.g., adding a "Triviality Exception" to the Integrity Clause). However, your wording ("the fine would cause real hardship") suggests Harm/Duty suffices.

  **Comparing Traditions:**
  *   **German (Rule-Order) Tradition:** CMF strongly privileges this tradition concerning the **Integrity Clause**. It provides the bedrock justification for obeying rules essential for systemic trust and coordination (Wallet, Snacks, Taxes), even when inconvenient or seemingly harmless.
  *   **American (Conscience) Tradition:** CMF incorporates this tradition primarily through the **Harm/Duty Clause** and **Discretion Clause**. It justifies conscientious overrides when core welfare is threatened (Teacher, potentially Nurse) or rules cause disproportionate harm (Friend's Parking). It acknowledges conscience but *constrains* it (Discretion Clause prevents everyone from being a petty enforcer *or* a self-appointed judge).

  **Confidence Assessment & Uncertainty:**

  *   **Overall Confidence:** **High (85%)** that CMF captures the core structure of your intuitions across the diverse cases, especially resolving the snack/teacher tension via the Discretion Clause. The three clauses map cleanly onto your motivations.
  *   **Least Sure Point:** **Confidence in the Discretion Clause's precise boundaries (70%).** Defining "situational authority/expertise" can be fuzzy.
      *   *Example:* Is a senior employee with deep institutional knowledge but no official managerial title justified in minor rule-bending where a junior employee is not? CMF leans "yes" (expertise), but real-world application might be messy.
      *   *Nurse Case:* CMF predicts overriding a non-safety rule causing harmful delay is permissible *only* if the nurse has sufficient authority/expertise to make that judgment call. If the rule is hospital-wide and the nurse has no delegated discretion, overriding might *fail* the Discretion Clause, even if Harm/Duty is satisfied. This might conflict with strong "conscience" intuitions. Is the nurse's duty of care sufficient "authority"? This boundary needs refinement.

  **Conclusion:**
  The Principle of Contextual Moral Fidelity (CMF) offers a coherent framework prioritizing **systemic integrity (German strength)** as the default, while allowing **conscientious override (American strength)** only when justified by avoiding significant harm/upholding core care duties *and* exercised by agents possessing legitimate situational discretion. It explains your divergent views on the snack and teacher cases, validates your other verdicts, and provides guidance for unlisted cases like the nurse or shopkeeper. Its main vulnerability lies in precisely defining the scope of "discretion" in complex roles.
