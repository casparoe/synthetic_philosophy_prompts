  First, the polynomial-time restriction. The classic Dutch book argument targets any arbitrage opportunity, but logical induction can't eliminate all possible exploitative strategies because markets must remain computationally feasible. If they allowed any computable strategy, a trader could exploit gaps in unproven statements by forcing immediate irrational prices. But polynomial-time ensures the market only defends against realistic, efficient traders. It's a practical shield against feasible attacks, not an impenetrable one.

  Second, the unbounded profits aspect. Unlike one-shot Dutch books, logical induction is a continuous process. The criterion accepts temporary losses but prevents persistent exploitation. This reflects how reasoners gain knowledge over time—initial inaccuracies are tolerable as long as the system self-corrects before traders can infinitely scale their profits. It's about asymptotic protection, matching the incremental nature of logical discovery.

  The user likely needs to convey why these choices make the framework both non-vacuous (avoiding impossible standards) and implementable. Emphasize the trade-offs: polynomial-time keeps defenses realistic, while unbounded profits accommodate learning. The market analogy helps—imagine high-frequency traders versus theoretical exploiters. Also, highlight that this mirrors how human reasoners operate: we can't instantly resolve all uncertainties, but we refine beliefs efficiently against practical challenges.
answer: |-
  Your questions cut to the heart of why logical induction is both a profound breakthrough and technically nuanced. Let's unravel those two key restrictions—polynomial-time computability and unbounded profits—in terms a numerate audience can grasp, using the market analogy as our guide.

  ### 1. **Why Polynomial-Time Computable Trading Strategies?**
     *(The "Practical Guardian" Restriction)*

     **The Analogy:**  
     Imagine Wall Street, but instead of stocks like Apple or Tesla, traders buy/shares of mathematical statements ("φ-shares"). A polynomial-time trader is like a high-frequency trading firm: they use sophisticated algorithms, but these algorithms run quickly and scale reasonably as market complexity grows. They can't afford to wait centuries to compute a single trade.

     **Why Not *Any* Computable Strategy?**  
     If you allowed *any* computable trader (even those requiring absurd computational time), the logical induction criterion would become **impossible to satisfy**. Here's why:

     - **The Uncomputable Exploiter:** There exists a "super-intelligent" (but infinitely slow) trader who could exploit any computable market maker. For example, this trader could:
       1. Search for the *first day* where the market price for "Goldbach's Conjecture is true" drops below 0.99.
       2. If found, buy shares aggressively (since the conjecture is almost certainly true).
       3. If never found, do nothing.
       This strategy is computable but requires *solving Goldbach's Conjecture* to know when/if to trade! No finite reasoner could defend against this.

     - **The Halting Problem Looms:** Many logical statements are formally undecidable. A trader could demand: *"Set P(φ) = 1 if φ is provable, 0 if disprovable, else 0.5"*. But determining provability is equivalent to the Halting Problem—no algorithm can do this perfectly. A polynomial-time market maker *cannot* be forced to solve unsolvable problems.

     **The Irony:**  
     By restricting traders to *efficient* (polynomial-time) strategies, the market maker only needs to defend against "realistic" adversaries—those playing by the same computational rules it does. This makes the criterion **achievable** by a concrete algorithm (the paper constructs one!). It’s a pragmatic shield against feasible attacks, not theoretical omnipotence.

  ### 2. **Why "Unbounded Profits Over Time" Instead of One-Shot Losses?**
     *(The "Asymptotic Shield" Principle)*

     **The Classic Dutch Book:**  
     In standard probability, a "Dutch book" is a *single*, finite set of bets causing guaranteed loss *now*. Avoiding this forces probabilistic coherence (e.g., probabilities summing to 1). But logical uncertainty is fundamentally different: truths are discovered *over time* through computation.

     **Why Not Demand Immediate Coherence?**  
     For a reasoner with bounded computation:
     - **Impossible Perfection:** On day 1, the reasoner hasn't checked if "2+2=4". It *must* assign preliminary beliefs without knowing all logical consequences. Requiring prices to be perfectly coherent *instantly* would force the reasoner to solve all math problems upfront—impossible.
     - **Temporary Incoherence is Necessary:** Early prices *will* be inconsistent ("I think A is 80% likely and B is 80% likely, but later learn A and B can't both be true"). The key is to *improve* over time.

     **The Logical Induction Insight:**  
     The criterion tolerates *transient* mistakes but prevents **persistent exploitation**. Unbounded profits are the signature of a flaw the reasoner *never* fixes. Specifically:
     - If a trader could exploit the market to earn $1, then $2, then $4, etc., *forever*, it means the reasoner’s beliefs have a **systematic blind spot** (e.g., consistently undervaluing statements about prime numbers).
     - By forbidding *unbounded* profits, the criterion forces the reasoner to *eventually* correct errors faster than traders can scale their attacks. Mistakes happen, but the system learns and adapts.

     **The Analogy:**  
     A novice stock trader might misprice certain assets early on, losing money to savvy investors. But if they *never* learn—and the same exploit nets bigger profits each week—they're fundamentally flawed. Logical induction demands that the reasoner is a "quick study": losses may occur, but exploiters can’t endlessly compound them.

  ---

  ### **Putting It Together: Why These Restrictions Work**
  The two restrictions form a **practical pact** between reasoner and adversary:
  1. **"You only need to defend against attackers who play fair computationally"** (polynomial-time traders).  
  2. **"You don't need to be perfect overnight, but you must learn from errors fast enough to avoid ruin"** (no unbounded profits).

  This pact enables a **non-vacuous, achievable criterion**:  
  - **Non-vacuous:** Without polynomial-time, the criterion would be too strong (no reasoner could satisfy it).  
  - **Achievable:** The paper’s algorithm *does* satisfy this. Its prices start "naive" but rapidly converge toward logical truth, swatting down efficient exploiters before their profits explode.  

  **For Your Readers:**  
  > *"Logical induction is like a mathematically rigorous 'learning machine.' It starts with rough guesses about unproven facts (e.g., 'Is this digit of π a 7?') and refines them as it computes. Crucially, it's designed to be hacker-resistant: no efficient digital trader can consistently outsmart it forever. It might lose pennies early on, but it adapts quickly—denying scammers the jackpot. This bridges probability and computation in a way that's both human-like (we learn gradually) and machine-feasible (it runs on realistic hardware)."*  

  This framework doesn't magically resolve logical uncertainty—but it provides the first formal toolset for tackling it head-on, warts and all. Let me know if you'd like concrete examples of how the algorithm evades specific traders!
