prompt: |-
  I coordinate maintenance for a shared laboratory kitchen and help moderate a volunteer-run discussion forum, and the same obstacle recurs in both settings. In the kitchen, disorder grows not because anyone overuses the facilities but because restoring order would require confronting those who leave messes, a task each member hopes another will undertake. In the forum, inaccurate posts stand uncorrected not for lack of knowledgeable readers but because correction invites protracted dispute that each reader prefers someone else absorb. The trouble is plainly related to failures around shared resources, yet nothing is depleted by use; what is missing is willingness to enforce a norm. Has this arrangement received an established designation, how should it be distinguished from straightforward free riding on a shared benefit and from depletion through overuse, and if no designation exists, what term and definition would you propose together with the boundary cases that separate it from those neighboring phenomena?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a recurring problem in two settings: a shared lab kitchen and a volunteer-run forum. In both cases, the issue isn't overuse or depletion of resources but a lack of enforcement of norms. People avoid confronting others who leave messes or correcting inaccurate posts because they hope someone else will handle it. 

  First, I need to identify the core problem. It's not about resource depletion like in the Tragedy of the Commons. Instead, it's about norm enforcement. The user wants to know if there's an established term for this and how it differs from free riding or resource depletion. 

  Looking into existing concepts, the bystander effect comes to mind, where individuals don't act because they assume others will. But that's more about emergencies. Diffusion of responsibility is related, but it's a mechanism, not the phenomenon itself. The volunteer's dilemma is closer, where one person must bear the cost for the group's benefit. 

  The user might be seeking validation that their experiences are recognized phenomena. They probably want a clear framework to explain these issues to others in their groups. Deeper needs could include strategies to address the problem or understanding why it happens persistently. 

  I recall that the term "second-order public good" from economics fits well. Maintaining norms is a public good itself, which nobody wants to pay the cost for. That connects to the volunteer's dilemma. Naming it "The Enforcement Gap" or "Norm Enforcement Dilemma" could make it accessible. 

  Distinguishing from free riding is key. Free riders benefit without contributing, but here the issue is enforcing rules, not contributing directly. In the kitchen, everyone cleans their own mess but avoids confronting others. In the forum, people might contribute knowledge but avoid disputes. 

  Boundary cases help clarify. For example, if someone never cleans up, that's free riding. If too many people use the kitchen, depleting supplies, that's resource depletion. But the enforcement gap is when norms exist but aren't upheld due to avoidance. 

  Proposing a term like "Enforcement Avoidance Dilemma" covers both the bystander effect and volunteer's dilemma aspects. The definition should emphasize the failure to enforce norms despite willingness to comply personally. 

  I should also consider solutions. The user might need actionable steps, like appointing enforcers or creating systems to reduce confrontation costs. But since the query focuses on terminology, I'll stick to defining the concept unless they ask for more. 

  Finally, ensuring the explanation is clear without jargon. Using the proposed terms and examples from their scenarios will make it relatable. Highlighting the difference from related concepts addresses their request to distinguish it from free riding and depletion.
answer: |-
  This phenomenon is well-recognized and has established designations, primarily centered around the **Volunteer's Dilemma** and the concept of **Second-Order Public Goods**. Here's a breakdown:

  1.  **Core Designation: The Volunteer's Dilemma**
      *   **Definition:** A social dilemma where a public good (a clean kitchen, accurate forum information) requires *at least one* individual to bear a private cost (confrontation, dispute) for the collective benefit. Everyone benefits if *someone* acts, but each individual prefers that someone *else* volunteers to bear the cost.
      *   **Key Mechanism:** It's a game-theoretic scenario where cooperation (volunteering) is costly, defection (not volunteering) is cost-free *if someone else volunteers*, but if *no one* volunteers, *everyone* suffers the worst outcome (messy kitchen, inaccurate forum).
      *   **Distinguishing from Free Riding:** Classic free riding involves individuals benefiting from a shared resource *without contributing to its provision* (e.g., using a community garden but never watering). In your cases:
          *   *Kitchen:* Members *do* contribute by *using the facilities appropriately themselves* (first-order cooperation). The failure is in contributing the *second-order good* of *enforcement*.
          *   *Forum:* Readers *may* contribute knowledge elsewhere or generally support the forum. The failure is specifically in contributing the costly act of *correction/enforcement* against norm violations.
          *   **Boundary Case - Free Riding:** A member who *never cleans up after their own use* of the kitchen, expecting others to clean their mess as part of general upkeep. They are free riding on the cleaning effort itself.
      *   **Distinguishing from Resource Depletion (Tragedy of the Commons):** Depletion occurs when individual overuse (taking too much, using too intensely) directly degrades a finite resource (fish stocks, grazing land, bandwidth). In your cases:
          *   The "resource" (cleanliness, accuracy) isn't directly diminished by *use* (cooking, posting/reading). It's diminished by the *failure to enforce the norms* governing that use. The "depletion" is of the *normative order*, not the physical/intellectual resource itself.
          *   **Boundary Case - Depletion:** If kitchen users collectively left taps running constantly or forum users flooded the site with low-quality posts overwhelming moderation capacity, *that* would be depletion/overuse.

  2.  **The Role of Second-Order Public Goods & Collective Action Problems:**
      *   **Second-Order Public Good:** Maintaining norms (cleanliness standards, information accuracy) *is itself a public good*. It benefits everyone but requires effort (enforcement/correction) that is costly for the individual providing it. This is the specific "missing" resource in your examples – the provision of *norm enforcement*.
      *   **Collective Action Problem (Enforcement Subtype):** Getting individuals to cooperate to achieve a common goal (a clean kitchen, accurate forum) is hard. Enforcing norms is a particularly thorny subtype because the action (confrontation, dispute) is inherently aversive and often socially risky, creating a strong disincentive to be the one who "volunteers".

  3.  **Related Psychological Mechanism: The Bystander Effect / Diffusion of Responsibility:**
      *   This social psychology concept explains *why* the Volunteer's Dilemma plays out. In groups, the responsibility to act (confront, correct) is perceived to be diffused across all members. Each individual believes someone else is more likely or more responsible to act ("surely someone else will say something"), reducing their own sense of personal responsibility and likelihood of acting.

  **Proposed Synthesis Term & Definition:**

  If seeking a single, descriptive term specifically for the *enforcement gap* aspect, consider:

  *   **Term:** **Enforcement Avoidance Dilemma** (or **Norm Enforcement Dilemma**)
  *   **Definition:** A collective failure arising within a group sharing a common resource or space governed by norms, where the *maintenance of the normative order itself* (a second-order public good) fails because each member, while generally willing to comply with the norms individually, avoids bearing the private cost (social confrontation, dispute, effort) of *enforcing* those norms against non-compliant others, hoping another member will undertake the enforcement action. This avoidance persists despite the shared understanding that universal non-enforcement leads to collective detriment.

  **Boundary Cases Clarifying the Distinction:**

  1.  **vs. Classic Free Riding (on First-Order Contribution):**
      *   *Scenario:* A member consistently uses the kitchen but *never cleans up after their own cooking*, expecting the general cleaning rota or others to handle it.
      *   *Why Different:* This member is directly free riding on the *cleaning effort* itself, a first-order contribution. They are violating the primary norm (clean your own mess). The Enforcement Avoidance Dilemma involves members who *do* clean their own mess but avoid enforcing the norm *against others* who don't.
  2.  **vs. Resource Depletion (Tragedy of the Commons):**
      *   *Scenario:* Lab members collectively use far more disposable labware than necessary because it's convenient, rapidly depleting the shared budget for supplies, despite knowing it's unsustainable.
      *   *Why Different:* The resource (supply budget) is directly depleted by the *cumulative overuse* (taking too many items). The problem stems from excessive *consumption*, not a failure to *enforce* rules about consumption. In your kitchen, the mess isn't caused by *overusing* cleaning supplies, but by *not enforcing* cleaning rules.
  3.  **vs. Simple Bystander Effect (non-collective good):**
      *   *Scenario:* Someone drops a box of supplies in a busy hallway; dozens walk past without helping, each assuming someone else will.
      *   *Why Similar:* Diffusion of responsibility is key. *Why Different:* Picking up the box is a one-off act benefiting an individual (or general tidiness), not the sustained enforcement of a *shared norm* critical for an *ongoing collective resource* like a functional kitchen or accurate forum. The stakes and context of the "public good" differ.
  4.  **vs. Lack of Established Norms:**
      *   *Scenario:* A new forum has no clear rules about source citation. Inaccurate posts proliferate because members don't agree on what "accurate" means or requires.
      *   *Why Different:* The failure stems from the *absence* of a clear, shared norm to enforce. Your dilemma assumes a *pre-existing, agreed-upon norm* (clean up, post accurately) where the failure is solely in the *enforcement action*.

  **In summary:** Your recurring obstacle is a manifestation of the **Volunteer's Dilemma**, specifically concerning the provision of a **Second-Order Public Good** (norm enforcement). It's driven by **Diffusion of Responsibility** (Bystander Effect). It's distinct from first-order free riding (not contributing to the core task) and resource depletion (overusing a finite resource). The **Enforcement Avoidance Dilemma** captures the core challenge: the shared aversion to bearing the cost of upholding agreed-upon rules, leading to collective detriment despite individual willingness to follow the rules themselves.
