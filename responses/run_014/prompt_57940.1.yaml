answer: |-
  That's an incredibly sharp observation about the weird, inconsistent ethics of biopics. You've nailed the core tension: artistic license vs. historical accuracy vs. obligations to real people (living and dead). Let's break down the presupposed ideas and explore alternatives:

  **The Current Practice's Presupposed "Truth" & Obligations:**

  1.  **Truth as "Essential Narrative" or "Emotional Truth":** The practice assumes that capturing the *spirit*, the *core struggle*, or the *thematic essence* of a life/story is more important than strict, blow-by-blow factual accuracy. The composite character isn't "false" in this view; it efficiently represents a *type* of influence or relationship the protagonist experienced.
  2.  **Obligations Primarily to the Living (and the Law):**
      *   **Living:** They can sue for defamation (damage to reputation), invasion of privacy, or intentional infliction of emotional distress. The obligation is primarily *legal* and *financial* (avoiding lawsuits/settlements). There's also a pragmatic PR/social media backlash concern.
      *   **Dead:** The current practice presupposes **minimal to zero obligations to the dead.** Why?
          *   **No Legal Standing:** The dead cannot sue for defamation (in most jurisdictions, claims die with the person). No legal risk = less restraint.
          *   **No Suffering:** The dead cannot be harmed or offended *in the present*. They don't feel pain or embarrassment.
          *   **"History Belongs to Us" Narrative:** There's an implicit belief that once someone dies, their story becomes part of the "public domain" of history, open to interpretation and dramatization for contemporary audiences and artistic purposes. Descendants might complain, but they have limited legal recourse unless their *own* rights (e.g., copyright, publicity rights in some places) are infringed.
  3.  **The "Based on a True Story" Disclaimer as a Shield:** This phrase isn't about ethical justification; it's a **legal and marketing tool.**
      *   **Legally:** It signals "This is not a documentary; expect fictionalization," potentially offering some defense against claims of deliberate deception.
      *   **Marketing:** It leverages the audience's interest in "real life" while granting the creators freedom.
      *   **Ethical Dodge:** It presupposes that simply *acknowledging* a loose connection to reality absolves creators of deeper obligations to accuracy or respect. It manages audience *expectations* more than it fulfills ethical duties.

  **Could Different Views Justify the Same Practice? (Mostly No, but...)**

  *   **Pure Contractualism:** "We only have obligations to those who can reciprocate or hold us accountable (i.e., the living)." This *does* justify the current practice but feels ethically shallow regarding the dead.
  *   **Radical Artistic Freedom:** "Art's purpose transcends factual accuracy; its value lies in its own truth, impact, or commentary, regardless of the source material." This view *permits* the practice but doesn't necessarily *justify* the specific imbalance you identified. It might still balk at gratuitous, harmful inventions about the dead if they undermine the art's own integrity.
  *   **Utilitarianism (The Greater Good):** "The social/cultural/entertainment value of a compelling story (even with composites and inventions) outweighs the potential harm to the reputation of individuals (especially the dead who aren't harmed)." This *could* justify composites but struggles to justify *gratuitously nasty* inventions about the dead if they don't serve a clear, significant narrative purpose benefiting the audience. The "benefit" of sensationalism is ethically dubious.

  **What Would Change if We Took Obligations to the Dead Seriously?**

  This is where it gets fascinating and challenging. Taking obligations to the dead seriously would fundamentally reshape biopic ethics:

  1.  **"Harm" Redefined Beyond Suffering:** We'd move beyond "Can they feel it?" to concepts like:
      *   **Posthumous Dignity & Reputation:** Does the portrayal fundamentally misrepresent who they were in a damaging way? Does it violate their inherent dignity?
      *   **Truthfulness as an Obligation:** Is there a duty to represent their character and actions with reasonable accuracy, even if they can't complain?
      *   **Respect for Autonomy/Intent (Hypothetical):** How *would* this person likely have wanted to be remembered? (Though this is speculative).
      *   **Impact on Legacy:** How does this portrayal shape their historical standing and the understanding of their contributions?
  2.  **Concrete Changes in Practice:**
      *   **Stricter Scrutiny of Inventions:** Inventing *negative* actions or traits for identifiable dead people would become ethically fraught, potentially taboo unless overwhelmingly supported by evidence or serving a crucial, non-sensational narrative purpose (e.g., illustrating a widely documented *type* of behavior without naming a specific victim).
      *   **Heightened Burden for Composites:** While composites might still exist, there'd be stronger pressure to make them clearly symbolic or unnamed, and to avoid smearing real individuals by folding negative traits from multiple people into one composite attached to a real name.
      *   **Greater Involvement/Consultation:** Filmmakers might feel ethically compelled to consult historians specializing in the person/era much more rigorously, and potentially seek input from descendants or foundations representing the dead person's legacy (not for veto power, but for perspective and to identify egregious errors).
      *   **More Nuanced Disclaimers:** Instead of just "Based on a True Story," disclaimers might specify: "Composite characters have been created to represent certain relationships," "Some events have been dramatized or condensed," "While based on extensive research, certain interpretations represent the filmmakers' perspective." Specific invented scenes might be flagged.
      *   **Focus on Context:** If portraying a dead person negatively based on evidence, there'd be a stronger onus to provide historical context and avoid simplistic villainization.
      *   **Shift in Defamation Norms (Social/Legal?):** While legally difficult, *social* norms might evolve to harshly penalize productions that recklessly malign the dead. There could be pressure for legal changes around posthumous reputation rights (though this raises complex free speech issues).

  **The Challenge:**

  Taking obligations to the dead seriously complicates storytelling. It requires balancing:
  *   **Artistic Expression:** The need to create compelling drama.
  *   **Historical Responsibility:** Accuracy and respect for real lives.
  *   **The Dead's "Interests":** Dignity, reputation, legacy (however we define them).
  *   **The Living's Interest in Truth:** Audiences deserve to know when they're seeing fiction vs. fact.

  **Conclusion:**

  The current practice presupposes a view where truth is flexible narrative essence, obligations are primarily legal and thus only binding regarding the living, and the dead are essentially fair game for artistic exploitation once legal risks are gone. The "Based on a True Story" card is a cynical fig leaf.

  Different views like radical artistic freedom or utilitarianism *might* permit similar practices but wouldn't necessarily endorse the specific *imbalance* you identified. Taking obligations to the dead seriously **would not eliminate artistic license or composites**, but it would demand far greater ethical rigor, particularly in avoiding gratuitous or harmful misrepresentations of identifiable deceased individuals. It would shift the focus from "Can we get away with it legally?" to "Is this portrayal *respectful* and *reasonably truthful* given our subject was a real human being?" The resulting films might be less sensational, potentially less dramatic, but potentially more historically grounded and ethically sound. It's a fundamental shift from seeing the dead as mere material to seeing them as entities worthy of a certain enduring respect.
