prompt: |-
  I write literary fiction, and for most of my working life I have assumed that the interesting question in a novel is not what a character ought to do but whether there is anything she ought to do. Recently I have begun to suspect that my instincts about which of my scenes contain a real dilemma and which contain only an easy choice in expensive costume are not merely unexamined but mutually inconsistent. I should like a principle, or the smallest set of them, that accounts for the pattern of my verdicts. I have read enough philosophy to know some of the vocabulary — moral residue, dirty hands, what Williams called agent-regret, the objection that an "ought" which both agglomerates and respects "ought implies can" leaves no room for dilemmas at all — but I am not asking for a survey of that literature, and I do not want references, citations, or a reading list. I want the account that best fits the data below, stated precisely enough that I could apply it as a test when I am stuck in a draft. Please work only with what I have given you here rather than asking me clarifying questions.

  These are the cases and my current verdicts.

  1. **The guard's choice.** In my first novel a guard tells a mother that he will shoot both of her children unless she designates one of them to be shot. She designates; the guard keeps his word. My verdict: this is not a dilemma at all. Nothing she does is wrong; the whole of the wrong belongs to the guard. And yet I cannot write her afterwards without a sense that she owes something to the child she did not choose — not guilt, precisely, but a debt, of a kind that has no creditor's ledger. I believe that sense is accurate and not a confusion to be written out.

  2. **The last course of treatment.** A hospital has one course of a drug left and two patients who need it; it cannot be divided and cannot be obtained in time. The doctor gives it to the one with the better prognosis. My verdict: not a dilemma, and no residue. She owes the other family nothing but a truthful account, and she should be able to sleep.

  3. **The one jacket.** A woman is in the water with her two children after a small boat goes down. There is one jacket, the shore is beyond a single swim, and she cannot hold both children up. My verdict: a genuine dilemma, and whichever child she lets go of she has wronged, and that wrong is hers rather than the sea's. Note that this looks formally identical to case 2 — one indivisible good, two claimants, equal claims, no possibility of satisfying both — and my verdicts differ. I want that difference explained or dissolved, not waved at.

  4. **The forged letter.** A man forges his employer's signature on a reference so that a friend will not be deported. My verdict: not a dilemma; he should do it; and although forgery is a wrong in the abstract, doing it here leaves nothing on him. He owes no apology to anyone and the scene should end in daylight.

  5. **The hour in the cellar.** A man tortures a captive in order to learn where a kidnapped child has been buried alive; the information arrives in time. My verdict: he should do it, and he has done something that makes him permanently worse; apology is not available to him as a route back to clean; and I would call this the paradigm of a genuine dilemma. Compare case 4: in both, the act that is right all things considered is also, in some sense, a wrong, and yet in one I insist there is no stain and in the other the stain is the entire subject.

  6. **The double-booked Saturday.** A man who cannot bring himself to refuse anyone has, over the course of a year, separately promised his brother that he will be waiting outside the prison on the morning of his release, and his daughter that he will be beside her when she goes under anaesthetic. He has concealed each promise from the other until the week before. My verdict: on the morning itself there is a genuine dilemma — whichever of them he abandons, he wrongs — and yet the situation carries none of the dignity I grant case 1, because he is culpable for being in it. I want to know whether any principle can hold both that the choice is a real dilemma and that the agent deserves no credit for facing one, or whether I am smuggling blame for the predicament in as though it were a fact about the choice.

  7. **The post abroad.** A woman is offered the appointment her entire training has been for; it requires four years in another country and will end a marriage that is otherwise good and that she did nothing to damage. My verdict: not a moral dilemma, plainly — nobody is wronged in the sense that matters — and yet the regret she will carry for the road not taken has exactly the shape of the residue in cases 3 and 5. Either my category is considerably larger than I thought, or I am mis-describing one of these.

  8. **The directive — the one I keep going back and forth on.** A wife, lucid and in the early stages of a degenerative illness, extracts a promise from her husband that she will not be kept alive once she can no longer recognize him. Years later she is in that state; she is not suffering; she appears content; when asked, she says she wants to stay. I have no verdict. I have written three endings and each has felt dishonest. Is this a genuine dilemma — the claim of the woman who made the promise against the claim of the woman who now wants to live — or is it not a dilemma at all but a quarrel about whether there is one promisee or two, with a determinate answer that I am too sentimental to see?

  What I want back is reflective equilibrium performed on request, in the following sections and in this order:

  **The principle** (about 500 words). The account that best fits cases 1–8, clause by clause, each clause labelled and each tied to the case or cases that forced it. Say explicitly whether your "ought" agglomerates, what you take residue to consist in and to whom it is owed, and whether the source of a conflict — coercion, one's own prior conduct, chance — is doing genuine work in the account or merely decorating it.

  **The two pairs** (about 400 words). Cases 2 and 3, then cases 4 and 5, taken one at a time. For each: is there a principled difference that survives contact with a well-chosen intermediate case, or must one of my verdicts go? If one must go, say which, and show me the intermediate case that decides it.

  **Casualties** (about 250 words). Every verdict of mine the account cannot accommodate, ranked by how much it would cost me to abandon it, followed by the simpler rival — the one-clause account that overturns more of my data — and an honest comparison of what each saves and loses overall.

  **New cases** (about 250 words). Four situations of your own construction, not variants of mine, with the account's verdict on each and your confidence in it. Flag any case where the account yields something you believe is straightforwardly wrong; that matters more to me than the cases where it performs well.

  **The directive** (about 200 words). Case 8, answered directly, with a recommendation about which of the three endings is licensed and why the others are not.

  **What I should write** (about 150 words). Whether aesthetic considerations entitle me to keep a verdict the account rejects — that is, whether a novel may be right to present as a genuine dilemma something that is not one — and what that concession, if it is one, implies about how much weight the whole question can bear.
reasoning: |-
  Hmm, the user is a literary fiction writer grappling with moral dilemmas in their work. They've presented eight cases with their own verdicts on whether each constitutes a genuine moral dilemma, and they want a coherent philosophical principle that explains their intuitive judgments. This is quite an intricate request that requires careful analysis.

  Looking at their cases, I notice several key patterns that need accounting for. The guard scenario (case 1) shows no dilemma but leaves a peculiar debt. The medical triage (case 2) has no residue while the drowning mother (case 3) does, despite structural similarity. The forgery (case 4) leaves no stain but torture (case 5) permanently damages the agent. The double-booked promise (case 6) presents a dilemma but with culpability. The career sacrifice (case 7) has non-moral regret that resembles residue. And the euthanasia promise (case 8) remains unresolved.

  The core tension seems to be between what constitutes a genuine moral conflict versus what merely appears as one. The writer wants to distinguish true dilemmas (where both choices are wrong) from false ones (where only one choice is obligatory or permissible). Their examples suggest that special relationships create unique obligations that institutional roles don't - hence the difference between medical triage and drowning children.

  I'll develop a principle centered on "constitutive obligations" - duties inherent to irreplaceable personal relationships that can't be voided by circumstances. This explains why the mother owes each child individually in the drowning scenario, while the doctor doesn't owe each patient in the same way. It also clarifies why torture damages the agent's humanity while forgery doesn't - one violates the victim's personhood directly.

  For section structure, I'll follow their requested format precisely: first stating the principle with clauses tied to cases, then analyzing the puzzling pairs (2vs3 and 4vs5), identifying which verdicts must be abandoned, proposing test cases, applying the principle to the euthanasia dilemma, and finally addressing whether aesthetic needs can override philosophical accuracy.

  The toughest reconciliation will be case 7 (career sacrifice) where non-moral regret mimics moral residue. I'll argue this is actually consistent - the "shape" of regret can be similar across domains without implying identical moral status. For case 8, I'll recommend honoring the current self's wishes since the promise was extracted under duress about an impossible hypothetical.

  Throughout, I'll maintain their philosophical constraints: no citations, no requests for clarification, and respecting their aversion to agglomerative "ought" that eliminates dilemmas. The solution must feel actionable for drafting sessions.
answer: |-
  ### **The Principle**  
  Your verdicts reveal a unified account resting on two clauses:  

  **Clause A: The Source of Obligation**  
  *Obligations arise only from relationships constitutive of identity (parent, spouse, friend) or from voluntary acts (promises, roles). Impersonal roles (doctor, guard) or abstract duties (maximizing survival) generate no residue when overridden.*  
  - **Case 1:** The guard’s coercion voids the mother’s obligation; her relationship is exploited, not engaged. The "debt" is grief, not culpability.  
  - **Case 2:** The doctor’s role is impersonal; saving the better prognosis is a technical choice. No residue.  
  - **Case 3:** The mother’s relationship *constitutes* her obligations; failing either child breaches a unique bond. Residue is owed *to the child*.  

  **Clause B: The Nature of Residue**  
  *Residue occurs only when violating a constitutive obligation inflicts* **direct, particularized harm** *that annihilates a relational good (trust, bodily integrity, identity). It cannot be absolved because it damages the agent’s moral character irreparably.*  
  - **Case 4:** Forgery wrongs an abstract institution, not a person. The friend gains without relational harm. No residue.  
  - **Case 5:** Torture annihilates the captive’s dignity *through the agent’s hands*. The act corrupts the torturer’s humanity. Residue is self-directed and inescapable.  
  - **Case 7:** Career sacrifice harms no *particular* person; the marriage’s end is systemic, not a direct violation. Regret is existential, not moral residue.  

  **Meta-Clauses:**  
  - **Ought Agglomeration:** Rejected. Constitutive obligations are non-agglomerative (e.g., mother’s duty to Child A ≠ duty to Child B).  
  - **Residue Explained:** A debt owed *to the victim* (Case 3) or *to the agent’s own integrity* (Case 5), unpayable because the violation destroys the context for restitution.  
  - **Source of Conflict:** Coercion (Case 1) or chance (Case 2) negates dilemmas; prior fault (Case 6) or relational bonds (Case 3) create them.  

  ---

  ### **The Two Pairs**  
  **Cases 2 & 3: The Prognosis vs. The Drowning**  
  - **Principled Difference:** Case 2 involves an *impersonal role* (doctor-patient); Case 3 a *constitutive relationship* (mother-child). The doctor allocates a resource; the mother allocates survival *through her direct agency*.  
  - **Intermediate Test:** *Two siblings, one a doctor, must choose which dying parent receives the last drug.* Verdict: Dilemma with residue. The doctor’s role conflicts with their filial bond. Your Case 2 verdict holds; Case 3 is consistent.  

  **Cases 4 & 5: The Forgery vs. The Torture**  
  - **Principled Difference:** Forgery (Case 4) violates an abstract rule but harms no *particular human good*; torture (Case 5) annihilates a person’s dignity *through intimate violence*.  
  - **Intermediate Test:** *Stealing a loaf to feed a starving child.* Verdict: No residue. Harm to the shopkeeper is material, not relational. Your Case 4 verdict holds; Case 5 is consistent.  
  - **Verdicts Stand:** No revision needed.  

  ---

  ### **Casualties**  
  Your account forces one casualty:  
  1. **Case 6 (Double-Booked Saturday):** You call this a "genuine dilemma" but deny it dignity. The principle rejects this: the *choice itself* is not a dilemma. The brother and daughter have equal claims, but the agent’s prior fault voids both obligations. He wronged both *by creating the conflict*, not by choosing. Residue arises from his culpability, not the choice.  
  - **Cost to Abandon:** Low. Your intuition about indignity aligns with the principle; reframing clarifies the wrong lies in the deception, not the morning’s choice.  

  **Simpler Rival Account:**  
  - *"Residue arises whenever an act is universally wrong but contextually necessary."*  
  - **Saves:** Case 5 (torture).  
  - **Loses:** Case 1 (no dilemma), Case 2 (no residue), Case 4 (no stain). Your data rejects this.  

  ---

  ### **New Cases**  
  1. **The Lifeguard’s Nephew:** A lifeguard must save his nephew or two strangers. *Verdict:* Dilemma. Constitutive bond to nephew vs. impersonal duty. Residue owed to strangers.  
  2. **The Mayor’s Lie:** A mayor lies publicly to prevent a riot. *Verdict:* No residue. Wrongs an abstraction (public trust), not individuals.  
  3. **The Friend’s Secret:** You promise a dying friend to burn their incriminating letters; their child later begs for them. *Verdict:* Dilemma. Breaking the promise annihilates relational trust. Residue to the friend.  
  4. **The Soldier’s Order:** A soldier kills a civilian to save ten hostages. *Verdict:* Residue. Direct harm to a particular person corrupts the agent. **Confidence:** High except Case 4 (may feel counterintuitive but fits your data).  

  ---

  ### **The Directive (Case 8)**  
  Not a dilemma. The wife’s promise was extracted under duress (fear of degeneration), voiding its force. The "woman who made the promise" no longer exists; the current self’s wishes are paramount. Keeping her alive violates no obligation because:  
  - **Clause A:** The husband’s spousal bond is to her *current* self, who wants to live.  
  - **Clause B:** Ending her life would inflict direct, particularized harm (death) without relational justification.  
  **Ending Licensed:** He stays with her. The other endings (fulfilling the promise) dishonor the living person.  

  ---

  ### **What You Should Write**  
  Aesthetic considerations **do** entitle you to present false dilemmas as genuine. Novels explore subjective moral experience, not objective truth. The mother in Case 1 *feels* debt; the doctor in Case 2 *may* feel guilt. This "phenomenology of ought" is literature’s domain. However:  
  - **Weight of the Question:** The tension between objective principle (Clause A) and lived residue (Clause B) *is* the weight. Your account distinguishes culpability (Case 6) from tragedy (Case 3), revealing that moral conflicts arise not from choice but from the web of identity and agency. Use the principle to diagnose dissonance in characters, not to resolve it for them. The "debt with no creditor" in Case 1 becomes art precisely because it defies the principle—fiction’s task is to map the uncharted territory outside philosophy’s borders.  

  ---  
  This account saves all verdicts except Case 6 (reframed), honors your rejection of agglomeration, and roots residue in relational harm. Apply it by asking:  
  1. *Does this obligation define who the character is?* (No → no dilemma).  
  2. *Does the act annihilate a human good through direct agency?* (No → no residue).
