answer: |-
  <Athenian Stranger leans forward, his tone patient but edged with steel>  
  Ah, Megillus, you sharpen your arguments like a Spartan whetstone! Yet you mistake the nature of the test. The sober commander? He is not the *source* of their restraint, but its *observer* and *guide*. Consider: when fire tests gold, does the smith impose purity? No! He creates conditions where the gold’s *own nature* is revealed. So too with wine. The commander ensures the revel remains within bounds—like walls around a wrestling ground—so that each drinker’s soul stumbles or stands by its own virtue. Without him, chaos obscures all judgment. With him, we see clearly: who laughs cruelly when flushed with wine? Who grows violent or lewd? These flaws *exist*, Megillus—wine merely strips away the veil of daylit composure. Tell me, does your Spartan drillmaster nullify the courage of your young men when he watches them spar? Or does his presence make their mettle *legible*?  

  As for Socrates… <waves a hand dismissively> …his soul was a fortress no grape could storm! But that is precisely the point. Most men are not Socrates. Their fortresses have weak gates—gates they themselves do not know until wine’s siege-engine rams them. The test *fails* only for the truly godlike or the utterly bestial. For the vast middle—the men who *can* be educated—drunkenness reveals the cracks in their walls. And revelation is the first task of legislation. You Spartans test boys by starving them, do you not? To see who steals cheese without getting whipped. Is that test worthless because a few never hunger, or because fools are caught? No! You learn who needs discipline. Wine is our *cheese*, Megillus. It shows us the soul’s hunger. Why fear the cup more than the lash?
