answer: |-
  That's a profoundly insightful debate! You've hit on a core tension in the foundations of constructive mathematics. Let's break down the divergence between Brouwer's original intuitionism and modern type-theoretic constructivism (like CIC/MLTT), using Bishop's constructivism as a bridge.

  **Core Divergence: Philosophy vs. Methodology**

  1.  **Brouwer's Original Intuitionism (Radical Anti-Realism):**
      *   **Ontology:** Mathematical objects *only* exist as mental constructions in the individual mathematician's intuition. There is no pre-existing mathematical reality "out there" (Platonism) or even a shared linguistic reality independent of mind (as per some formalist views). The mathematical universe is *created* by the thinking subject.
      *   **The Primacy of the "First Act of Intuition":** All mathematics fundamentally rests on the intuition of the *continuum* of time – the bare experience of "one thing, and then another." Natural numbers arise from this temporal experience; sets, functions, etc., are built upon it.
      *   **Language is Secondary (& Suspect):** Formal logic and language are *post-hoc* descriptions of mental constructions. They are inherently imperfect and can never fully capture the richness and fluidity of intuition. Logic is descriptive, not prescriptive. He famously distrusted formal systems.
      *   **Free Choice Sequences:** These are potentially infinite sequences where the mathematician *freely chooses* each element one-by-one, potentially forever. They represent the "becoming" aspect of the continuum. Crucially, a free choice sequence is *not* determined by a law or rule; it's an open-ended, temporal process *in the mind*. Properties of them often require novel principles like the Bar Theorem (based on intuition about mental constructions).
      *   **Rejection of LEM is Fundamental:** LEM is rejected *because* it assumes mathematical truth exists independently of our mental constructions and proofs. If a statement hasn't been *constructed* as true or false in the mind, asserting `A ∨ ¬A` claims knowledge of a non-mental reality.
      *   **Anti-Realism:** Truth is *identified* with proof (mental construction). There is no truth beyond provability/constructibility.

  2.  **Bishop's Constructivism (Pragmatic Anti-Realism):**
      *   **Focus:** Rebuilding mainstream mathematics (analysis, algebra, topology) constructively. He cared deeply about mathematical *meaning*.
      *   **Philosophy Lite:** Explicitly avoided Brouwer's heavy metaphysics. His stance was more semantic anti-realism (à la Dummett): The meaning of a mathematical statement *is* its proof conditions. Asserting `∃x P(x)` *means* you can produce an `x` and prove `P(x)`. LEM is rejected because it violates this meaning theory (asserting `A ∨ ¬A` without evidence for either).
      *   **Objects as Constructions:** Mathematical objects must be explicitly constructed or definable by an algorithm. "Existence is constructibility."
      *   **Neutral on Mind:** While emphasizing constructions, Bishop didn't tie them solely to *mental* processes in Brouwer's sense. Constructions are objective procedures that *could* be carried out (in principle), often formalized as algorithms.
      *   **Rejection of Choice Sequences:** Bishop found Brouwer's free choice sequences and their associated principles (like the Fan Theorem) too vague and non-constructive for his rebuilding project. He preferred sequences defined by computable laws.

  3.  **Type-Theoretic Constructivism (CIC, MLTT - Formalized Methodology):**
      *   **Core:** The Curry-Howard Correspondence (CHC). Propositions are Types (`Prop ≈ Type`), Proofs are Programs (inhabiting terms).
      *   **Formal System First:** Starts with a rigorously defined formal calculus (type theory). Meaning is grounded in computation (reduction rules). "Proof" is a syntactic object (a well-typed term) within the system.
      *   **Constructive by Design:** The rules of the type theory (no `A ∨ ¬A` axiom, no double-negation elimination, existence requiring witnesses) *enforce* constructive reasoning. LEM is consistently deniable.
      *   **BHK Interpretation Formalized:** The informal BHK clauses become the precise typing rules:
          *   Proof of `A ∧ B` is a pair `(a, b)` where `a:A` and `b:B`.
          *   Proof of `A → B` is a function `f` such that if `x:A`, then `f(x):B`.
          *   Proof of `∃x:A, P(x)` is a pair `(a, p)` where `a:A` and `p:P(a)`.
          *   Proof of `∀x:A, P(x)` is a function `f` such that if `x:A`, then `f(x):P(x)`.
          *   `¬A` is defined as `A → ⊥` (where `⊥` is the empty/uninhabited type).
      *   **Proofs as Computations:** The computational aspect of CHC is central. A proof *is* an algorithm. Normalization guarantees that witnesses can be extracted.
      *   **Objects:** Mathematical objects are terms of the appropriate type. A natural number is a term of type `Nat` (e.g., `0`, `suc 0`, `suc (suc 0)`). A function is a lambda term. Existence is defined by the `∃` (or Sigma-type) rules.
      *   **Philosophical Neutrality (Generally):** Most type theorists use the system as a *tool* for:
          *   Giving computational meaning to proofs.
          *   Formalizing mathematics with explicit evidence.
          *   Building verified software (via proofs-as-programs).
          *   Studying foundations.
      The system *embodies* constructive principles, but practitioners often aren't committed to Brouwer's *reasons* for being constructive. They might be motivated by computation, epistemology, or simply the practical benefits of explicit constructions. The system works regardless of whether you think numbers are mental or platonic, as long as you follow the rules.
      *   **Handling "Choice":** Type theory usually models *lawlike* sequences (terms of type `Nat → A`). Brouwerian free choice sequences don't fit neatly into the standard term model, as they lack a finite description. Some extensions try to model them (e.g., via coinduction, modal types, or specific axioms approximating Bar Induction), but this is non-standard and philosophically charged.

  **Where Brouwer's Anti-Realism Gets Preserved/Deflated:**

  *   **Preserved in Core Tenet (Rejection of LEM & Truth=Proof):** Both reject LEM and uphold that truth requires proof/construction. Type theory formalizes "proof" as a program, aligning with the core anti-realist idea that truth isn't independent of evidence. The BHK *meaning explanation* preserved in the type rules is fundamentally anti-realist.
  *   **Preserved in Emphasis on Constructions:** All three require explicit constructions for existence claims.
  *   **Deflated in Ontology/Epistemology:**
      *   **Mind:** Brouwer's solipsistic, mental constructions are replaced by intersubjective, linguistic/syntactic objects (programs/terms) in type theory. The construction happens *in the system*, not necessarily *in a mind*. Type theory is compatible with Platonism about terms!
      *   **Language:** Brouwer distrusted formal language as secondary. Type theorists embrace a formal language/system as the *primary* locus of mathematical activity. The system *is* the mathematics.
      *   **The Continuum:** Brouwer's intuitive continuum is foundational. In type theory, the continuum (real numbers) is *constructed* from discrete types (e.g., `Nat` or `Int`) using quotient or Cauchy sequence types. It's a defined object, not the source.
      *   **Choice Sequences:** The heart of Brouwer's fluid continuum is largely absent or heavily formalized/modified in standard type theory, losing its "free choice" essence.
      *   **Motivation:** Many type theorists aren't anti-realists; they are logicists, formalists, computationalists, or simply pragmatists valuing the guarantees (e.g., program extraction, no proof by contradiction) the system provides.

  **"Constructive Proofs" vs. "Constructive Objects": Does it Lose Anything?**

  *   **Type Theory's View:** The property "constructive" fundamentally applies to *proofs* (terms/programs). An object "exists" constructively *because* there is a constructive *proof* (term) of its existence inhabiting its type. The constructive nature of the object is derivative of the constructive nature of its proof.
  *   **Brouwer's View:** The constructive nature is inherent to the *object itself* as a mental construction. Proof is the process of mentally creating/recognizing the object.
  *   **What Might Be Lost?**
      *   **The Primacy of the Mental Act:** The intimate connection between mathematical truth and the *lived experience* of the mathematician constructing it. Type theory abstracts this away into symbol manipulation.
      *   **The Open-Endedness of Becoming:** Brouwer's free choice sequences represent an open temporal process. Type-theoretic objects are usually static terms defined by their finite description. The dynamic "choice" aspect is hard to capture.
      *   **The Radical Critique of Language/Formalism:** Type theory *is* formalism. It doesn't share Brouwer's deep skepticism about formal systems capturing intuition. It *assumes* they can (or that it's sufficient).
      *   **The Specificity of the Continuum:** The foundational role of the *intuitive* continuum as prior to logic is lost.

  **Conclusion:**

  Your friend has a strong point. Modern type-theoretic constructivism (CIC/MLTT) is **not** Brouwer's intuitionism philosophically. It's a formal system that:

  1.  **Captures the BHK Interpretation:** It perfectly formalizes the proof conditions central to intuitionism/constructivism.
  2.  **Enforces Constructive Reasoning:** It structurally prevents non-constructive arguments (like LEM).
  3.  **Emphasizes Constructions:** Via the `∃`/Sigma-type and computational content.
  4.  **Rejects Platonism about Proof/Truth:** Truth requires an explicit proof term.

  However, it **deflates Brouwer's radical anti-realism** by:

  1.  **Replacing Mental Constructions with Formal Terms:** Objects/proofs are syntactic entities within a system, not necessarily mental events.
  2.  **Embracing Formalism:** The system *is* the mathematics, not a flawed description of mental acts.
  3.  **Losing Brouwer's Metaphysics:** The foundational role of the intuitive continuum and time, the nature of free choice sequences.
  4.  **Often Lacking the Philosophical Motivation:** Many use it for computational or practical reasons, not anti-realist convictions.

  Bishop's constructivism sits in the middle: sharing Brouwer's semantic anti-realism (meaning = proof conditions) and focus on meaningful constructions, but rejecting the heavy metaphysics and free choice sequences in favor of a more pragmatic, mathematics-rebuilding approach compatible with (though not requiring) formal systems like type theory.

  **So, is it "just" dropping LEM?** No. Dropping LEM is a *symptom* within the formal system. The *essence* is the BHK meaning explanation formalized by the type/proof term rules, which embodies a core anti-realist principle (truth requires constructive evidence). However, this formalization *does* abstract away from Brouwer's specific philosophical grounding in the mental and the intuitive continuum. Whether this "loses anything important" depends on whether you value Brouwer's specific philosophical insights about the nature of mathematical existence and intuition *more* than the powerful formal machinery, computational meaning, and practical applicability offered by modern type theory.
