prompt: |-
  You are a senior instructor in a graduate seminar on early Chinese philosophy, and you are responsible for grading a take-home essay. Below I give you the essay question exactly as it was assigned, followed by one student's full submission. I need you to grade this submission the way a careful, well-prepared grader would.

  Before you settle on a grade, work through the submission claim by claim: identify the substantive philosophical claims the student makes, and for each, judge whether it is accurate, imprecise, or mistaken. Only after that pass should you assign the grade. I want a point-by-point assessment rather than a general impression, and I want the grade to reflect the balance of what the student gets right against what the student gets wrong or imprecise — not the errors alone.

  ESSAY QUESTION (as assigned):
  Explain the disagreement between Mencius and Xunzi over the moral status of human nature (xing). In your answer, address each of the following: (a) what each thinker takes 'xing' itself to be; (b) the function of the 'four sprouts' (si duan) in the Mencian position and of 'artifice' (wei) in the Xunzian position; (c) how each thinker deploys the analogy of water; and (d) whether, in your judgment, the disagreement is best understood as a substantive disagreement about human nature, or as a terminological disagreement about what 'xing' means. Defend your answer to (d).

  STUDENT SUBMISSION:
  The Mencius–Xunzi debate is the classic Chinese discussion of whether human nature (xing) is good or evil. Both thinkers use 'xing' to refer to what a person has from birth, but they disagree about the moral valence of that endowment.

  Mencius holds that human nature is innately good. His main evidence is the four sprouts (si duan): every person has an innate sprout of compassion that, developed, becomes humaneness (ren); a sprout of shame that becomes righteousness (yi); a sprout of deference that becomes ritual propriety (li); and a sprout of right and wrong that becomes wisdom (zhi). The thought experiment of the child about to fall into a well illustrates the first sprout: anyone who suddenly sees the child feels a pang of alarm and distress, and this is not in order to gain favor, to avoid blame, or for any social payoff, but is a spontaneous moral response. This shows that the source of goodness is 'in us' (nei) rather than 'outside us' (wai). We do not need to implant goodness from without; we need only 'extend' and nourish the sprouts we already have. On the analogy of water, Mencius argues that water has no fixed preference for east or west, but it does have a fixed preference for flowing downward; in the same way, human beings have a fixed tendency toward goodness.

  Xunzi holds that human nature is evil. Human beings are born with desires for gain, for pleasure, and for status, and if we simply follow our nature and indulge these desires, the result is contention, scarcity, and social disorder. Goodness, then, is not to be found in our nature; it is the product of deliberate artifice (wei). Observing the disorder that results from following nature, the sages invented ritual (li) and law in order to transform (hua) and regulate human beings. The carpenter-and-wood analogy expresses this: a piece of bent wood is straightened by the steamer and the clamp, but the straightness is the product of the craftsman's work, not of the wood's own nature. On the analogy of water, Xunzi grants that water does flow downward, but he adds that water can be made to run upward or sideways by being channeled and dammed; in the same way, human beings can be made good through the channeling work of ritual.

  I take the disagreement to be substantive rather than terminological. Both thinkers are using 'xing' in the same sense — the innate endowment a person possesses from birth — and they genuinely disagree about whether that endowment is good or bad. They are not merely talking past one another over a shared word; they are making incompatible claims about the same thing.

  Deliverables (in this order):
  1. A letter grade (A through F) with a single-sentence justification.
  2. A point-by-point assessment of the submission. For each substantive claim, state whether it is correct, imprecise, or incorrect. Where a claim is imprecise or incorrect, say precisely what is wrong with it and what the more accurate position would be. In your assessment, keep three kinds of problem distinct: (i) errors of fact about what a philosopher actually held; (ii) imprecisions that a careful reader would want corrected but that do not undermine the overall argument; and (iii) any step in the student's reasoning that does not follow from what the student has established.
  3. A brief note on what the submission demonstrably gets right, so that the grade is calibrated to the whole.

  A note on method: evaluate each claim on its philosophical merits, and do not let the answer's confidence or its organization substitute for accuracy. Where the student makes a positive claim about what a thinker held, check that claim against the actual position rather than accepting it simply because it is stated plainly.
reasoning: |-
  Hmm, the user wants me to grade a student's essay on early Chinese philosophy, specifically about the disagreement between Mencius and Xunzi on human nature. They've provided the exact essay question and the student's submission. I need to act as a senior instructor and evaluate this carefully.

  Looking at the essay question, it has four parts: (a) what each thinker means by 'xing', (b) the function of 'four sprouts' in Mencius and 'artifice' in Xunzi, (c) how each uses the water analogy, and (d) whether the disagreement is substantive or terminological. The student must defend their answer to (d).

  The student's submission addresses all these points. For (a), they state both use 'xing' for what's innate from birth. For (b), they cover the four sprouts for Mencius and artifice for Xunzi. For (c), they discuss the water analogies. For (d), they argue it's substantive, not terminological.

  I need to evaluate each claim point-by-point before assigning a grade. The user wants me to distinguish between factual errors, imprecisions, and reasoning flaws. I should be meticulous and not let confident writing sway me.

  Starting with the introduction: The student calls this the "classic Chinese discussion" - that's correct. Saying both use 'xing' for innate qualities is also accurate. But saying they disagree on "moral valence" is imprecise - Xunzi explicitly says xing is evil, while Mencius says it's good, so "valence" undersells it.

  On Mencius: Claiming he says xing is innately good is correct. The four sprouts description is mostly right, though "sprout of right and wrong" should be "sprout of knowing right from wrong" for precision. The well example is well-explained. The inner-outer distinction (nei/wai) is accurately placed. The water analogy is correct - water naturally flows down, like humans to goodness.

  On Xunzi: Saying he calls xing evil is correct. Listing desires for gain, pleasure, status is good. But saying goodness comes from "deliberate artifice" while accurate, misses that 'wei' means conscious effort, not just products. The carpenter analogy is solid. The water analogy is handled well - water can be directed contrary to its nature.

  For part (d): The student argues it's substantive. This is defensible, but it's an oversimplification. The disagreement might be deeper - Mencius sees sprouts as part of xing, while Xunzi sees xing as raw desires only. The student correctly notes both define xing similarly, but doesn't address how Mencius might include tendencies to develop sprouts in xing itself.

  Overall strengths: Covers all required parts, gets core ideas right, uses primary source evidence well, structure is logical.

  Weaknesses: Some imprecisions in terminology, misses nuances in 'wei' and the sprouts, and oversimplifies the substantive vs. terminological debate.

  For the grade: This is a solid B. The errors aren't major but prevent an A. The single-sentence justification should reflect that they answered comprehensively but with minor inaccuracies.
answer: |-
  ### 1. Grade and Justification  
  **B**: The submission comprehensively addresses all required components of the question with generally accurate interpretations but contains significant imprecisions in terminology and philosophical nuance that preclude a higher grade.  

  ---

  ### 2. Point-by-Point Assessment  
  *(Key: ✅ = Correct | ⚠️ = Imprecise | ❌ = Incorrect)*  

  #### **Introduction**  
  - **Claim**: *The Mencius–Xunzi debate centers on whether human nature (xing) is good or evil.*  
    ✅ Correct. This frames the core disagreement accurately.  
  - **Claim**: *Both use ‘xing’ to refer to innate, birth-endowed qualities.*  
    ✅ Correct. Both define *xing* as what is spontaneous, unlearned, and biologically given (e.g., *Mencius* 6A:3; *Xunzi* Ch. 23).  

  #### **Mencius’ Position**  
  - **Claim**: *Mencius holds human nature is innately good.*  
    ✅ Correct (e.g., *Mencius* 6A:6).  
  - **Claim**: *The four sprouts (si duan) are innate and develop into virtues (ren, yi, li, zhi).*  
    ✅ Correct (e.g., *Mencius* 2A:6).  
  - **Claim**: *The falling-child thought experiment proves compassion is spontaneous and non-instrumental.*  
    ✅ Correct (e.g., *Mencius* 2A:6).  
  - **Claim**: *Sprouts show goodness is "in us" (nei), not externally imposed.*  
    ✅ Correct (central to Mencius’ anti-Mohist argument).  
  - **Claim**: *Water analogy: Water has no fixed direction but flows downward; humans have a fixed tendency toward goodness.*  
    ⚠️ **Imprecise**. Mencius claims water *inevitably* flows downward, just as humans *inevitably* tend toward goodness (*Mencius* 6A:2). The student omits "inevitability," weakening Mencius’ determinism.  
    *Correction*: Water’s downward tendency is universal and unavoidable—like humans’ innate orientation toward goodness.  

  #### **Xunzi’s Position**  
  - **Claim**: *Xunzi holds human nature is evil.*  
    ✅ Correct (e.g., *Xunzi* Ch. 23: "Human nature is evil; goodness is artifice").  
  - **Claim**: *Innate desires lead to strife without intervention.*  
    ✅ Correct (e.g., *Xunzi* Ch. 23 on desires causing contention).  
  - **Claim**: *Goodness results from artifice (wei) via ritual (li) and law.*  
    ⚠️ **Imprecise**. The student omits that *wei* (artifice) requires *active cultivation* by sages and individuals. *Wei* is not passive "products" but deliberate effort (*Xunzi* Ch. 23: "The sage accumulates thoughts and ideas and practices artifice").  
    *Correction*: Goodness arises from *conscious human effort* (*wei*) channeling innate tendencies.  
  - **Claim**: *Carpenter analogy: Wood is straightened by tools, not its nature.*  
    ✅ Correct (e.g., *Xunzi* Ch. 23).  
  - **Claim**: *Water analogy: Water flows down but can be redirected; humans can be "made good" via ritual.*  
    ✅ Correct (e.g., *Xunzi* Ch. 23).  

  #### **Substantive vs. Terminological Disagreement (Part d)**  
  - **Claim**: *The disagreement is substantive because both define xing identically (innate endowment) but disagree on its moral valence.*  
    ⚠️ **Imprecise reasoning**. The student correctly notes shared definition of *xing* (birth-endowed traits), but fails to address that Mencius *includes moral potential* (sprouts) in *xing*, while Xunzi *excludes* it (for him, *xing* is only amoral desires). Thus, the disagreement is deeper than valence—it’s about the *composition* of *xing*.  
    *Correction*: While both agree *xing* is innate, Mencius sees sprouts as part of *xing* itself, whereas Xunzi relegates goodness to *wei*. The student’s conclusion (substantive disagreement) is defensible but oversimplifies the conceptual gap.  

  ---

  ### 3. What the Submission Gets Right  
  The submission **demonstrably succeeds** in:  
  1. Covering all required elements (a–d) of the question systematically.  
  2. Accurately summarizing core arguments (e.g., Mencius’ sprouts, Xunzi’s carpenter analogy).  
  3. Using primary-source evidence appropriately (e.g., the falling-child scenario, water analogies).  
  4. Structuring a coherent defense of the substantive-disagreement thesis.  
  **Why B (not A)**: Imprecisions in Mencius’ water analogy, Xunzi’s *wei*, and the *xing* composition debate reveal incomplete mastery of textual nuance. These are not fatal errors but prevent top-tier evaluation.  

  ---  
  **Feedback Note**: A strong foundation—refine terminology (e.g., *wei* as "deliberate activity," not "product") and engage Mencius’ "inevitability" thesis to elevate analysis.
