  Okay, let me tackle this ethics of war problem. The user teaches a seminar and hits the same wall every year regarding the moral equality of combatants. They want a clear list of desiderata for any adequate theory on the ethics of killing in war, along with which pairs might conflict and which requirement challenges existing theories the most.

  First, I need to outline the core requirements. The user mentioned specific cases: the conscripted teenager on the unjust side, the civilian machinist, irregular combatants, consistency with individual self-defense, and soldiers' epistemic limitations. Each desideratum must be justified by a real case to show it's not just a preference of one camp.

  Starting with the conscripted teenager. The theory must avoid extremes—neither condemning them as murderers nor treating war as a neutral contest. This stems from the need for a morally plausible account that acknowledges their reduced culpability due to coercion and ignorance. 

  Next, the civilian machinist making artillery fuses. Here, the combatant/civilian distinction can't bear all the moral weight. The case challenges theories that assign liability based solely on role without considering individual contributions to harm. The machinist's direct contribution to weapons production complicates the civilian immunity principle.

  Then, irregular combatants without uniforms. This tests the traditional requirement of distinction. If uniforms aren't present, how does the theory handle their status? The requirement ensures that the ethics of killing doesn't rely solely on adherence to conventions like wearing uniforms.

  Consistency with individual self-defense is crucial. The user suspects this might conflict with symmetrical combat permissions. In peacetime, self-defense requires an unjust aggressor, but in war, soldiers on both sides kill each other. If war is different, the theory must explain why without special pleading.

  Soldiers' epistemic limitations are key. Most don't know if their cause is just. A theory requiring such knowledge would be impractical and morally unfair. This desideratum forces the theory to accommodate reasonable beliefs rather than objective justice.

  Now, identifying conflicting pairs. The user's hunch is that consistency with self-defense and symmetrical combat permissions can't both hold. In individual cases, you can't kill someone unless they're unjustly threatening you. But in war, symmetrical permissions allow combatants to kill each other regardless of justice. This seems irreconcilable without modifying one principle. Either self-defense norms don't apply to war, or symmetrical permissions are unjustifiable.

  The requirement doing the most damage across theories is epistemic limitation. Traditionalists assume combatant equality, ignoring justice. McMahan's revisionism requires knowing just cause, which is unrealistic for soldiers. Conventionalist attempts, like Shue's, might handle epistemology but struggle to align with individual self-defense norms. Epistemic constraints challenge all three by demanding a theory that doesn't rely on knowledge soldiers can't possess.

  In summary, the epistemic requirement is the biggest hurdle for existing theories, and the conflict between self-defense consistency and symmetrical permissions is likely unsatisfiable. This points to a fundamental tension in the ethics of war that existing frameworks haven't resolved.
answer: |-
  **Bottom line:** The epistemic limitation requirement does the most damage to all major contenders, while the pairing of *consistency with individual self-defense* and *symmetrical combat permissions* is likely jointly unsatisfiable.

  ### Desiderata for an Adequate Theory of Killing in War
  Each requirement is grounded in a core case demonstrating its non-negotiable nature, forcing the theory beyond partisan preferences:

  1.  **Non-Extreme Liability of the Unjust Conscript:** Must assign a plausible moral status to the *conscripted teenager fighting for an unjust cause*. Case: A 17-year-old forcibly drafted into an aggressive war, minimally trained, acting under duress, shooting at advancing enemy soldiers. The theory cannot conclude he is a murderer (revisionist extreme) nor that his killing is morally equivalent to just combatants (traditionalist extreme). It must acknowledge reduced culpability/liability without erasing the distinction between just/unjust wars. *Why required:* Moral intuition recoils from equating coerced ignorance with murder or endorsing moral equivalence in aggression. It tests liability bases beyond voluntary agency.

  2.  **Civilian Contribution without Blanket Immunity/Culpability:** Must adjudicate the *civilian machinist producing integral war materiel*. Case: A factory worker knowingly manufacturing specialized artillery fuses essential for an unjust war effort, paid standard wages, not directly coerced. The theory cannot rely solely on combatant status for liability nor treat all "contributing" civilians as liable targets. *Why required:* Modern war economies blur direct/indirect harm. It tests whether liability stems from functional contribution to unjust harm or formal role, demanding nuance beyond the combatant/civilian binary.

  3.  **Status of Irregulars Without Distinction:** Must handle *partisans/irregulars who deliberately avoid uniforms and operate clandestinely*. Case: Resistance fighters in occupied territory conducting ambushes in civilian clothes against a genocidal regime. The theory cannot make liability depend solely on wearing a uniform or being part of a hierarchical military, nor grant them full civilian immunity. *Why required:* Asymmetric conflicts are prevalent. It tests whether the basis for liability/permissibility is convention (uniforms) or conduct/contribution to harm.

  4.  **Consistency with Individual Self-Defense or Explanation of Difference:** Must either align with core principles of *lethal self-defense in peacetime* or provide a compelling reason why *war is a morally distinct context*. Case: An individual (A) unjustly attacks an innocent (B); B kills A in necessary self-defense. Contrast with two professional soldiers (C & D) on opposing sides in a symmetrical firefight, each believing (rightly or wrongly) they are just, killing each other. The theory must explain why D killing C in the firefight is permissible (if it is) while a similar peacetime killing by an unjust aggressor would not be. *Why required:* War doesn't suspend fundamental moral norms without justification. It tests the "moral singularity" of war claims central to traditionalism.

  5.  **Respect for Soldiers' Epistemic Limitations:** Must accommodate the *actual epistemic position of soldiers* regarding *jus ad bellum*. Case: A frontline infantry soldier in a large-scale conflict, relying on government/cultural narratives, with limited critical resources, unable to reliably determine the objective justice of their nation's cause. The theory cannot ground permissions/liabilities solely in *objective* justice if that knowledge is inaccessible. *Why required:* Demanding impossible knowledge renders the ethics irrelevant to practice and unfairly burdens individuals. It tests the feasibility of applying objective liability models.

  ### Likely Unsatisfiable Pair
  *   **Consistency with Individual Self-Defense & Symmetrical Combat Permissions:** These pull in opposite directions. Individual self-defense grounds the permission to kill *only* in defense against an *unjust* imminent threat by the attacker. Symmetrical permissions allow combatants on both sides to kill each other *regardless* of which side is objectively just. Reconciling them requires either:
      *   *Abandoning core self-defense:* Arguing war creates a unique normative space where the usual grounds for lethal force don't apply (e.g., via a "bracket" or conventionalist argument). This sacrifices consistency.
      *   *Denying symmetry:* Concluding only just combatants have a genuine right to kill enemy combatants (revisionism). This sacrifices symmetrical permissions.
      *   *Radically redefining liability:* Finding a new basis for liability in war (e.g., purely role-based) utterly divorced from the principles governing unjust aggression in peacetime, which seems ad hoc. **Joint satisfaction appears impossible without abandoning a core tenet of one requirement.** Your hunch holds: the symmetry of permissions in standard warfare fundamentally conflicts with the asymmetry inherent in individual self-defense against unjust aggression.

  ### The Most Damaging Requirement
  *   **Respect for Soldiers' Epistemic Limitations:** This requirement wreaks havoc on all major contenders:
      *   **Traditionalism (MEC):** Collapses. MEC assumes symmetry *regardless* of *jus ad bellum*, precisely to avoid needing soldiers to know justice. But this ignores the epistemic problem *for justification* – if the unjust conscript *shouldn't* kill (intuitively), MEC's permission for him is morally flawed. His ignorance doesn't magically make his killing permissible, only perhaps excusable. MEC fails to distinguish the cases.
      *   **McMahan-Style Revisionism:** Struggles catastrophically. Revisionism ties liability directly to objective responsibility for unjust threat. But if soldiers *can't know* if their cause is unjust, they *can't know* if their enemy is liable or if they themselves are committing murder. This makes the theory practically incoherent for agents and risks condemning vast numbers for unavoidable ignorance. Appeals to "reasonable belief" dilute the objective liability core.
      *   **Conventionalist/Contractualist Salvage Attempts (e.g., Shue, Benbaji):** Are *designed* to handle epistemology by creating conventions (like MEC) that don't require *jus ad bellum* knowledge. However, this requirement forces them to confront *why* such conventions are morally binding on the unjust combatant *in the act of killing*. If the convention permits him to kill just combatants, and he suspects (but cannot confirm) his cause is unjust, does the convention genuinely justify his lethal action? It highlights the potential moral bankruptcy of the convention – it permits wrongful killing for systemic stability. It doesn't easily resolve the tension with individual self-defense norms.
