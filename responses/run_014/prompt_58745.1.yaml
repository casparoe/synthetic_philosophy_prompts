  #### Key Notes:
  - **No coherent stance** for the combination: **Q1=No, Q3=No** (no deployment-time or training-time safeguards). This forces **Refusal to Deploy** as the only rational choice.  
  - **Leaves the tree cannot separate**: **Pure Motive Shaping** and **Hybrid Checker Setups** both assume the trusted checker (in hybrid) is non-scheming, but the tree distinguishes them via timing (training vs. deployment) and dependencies.  
  - **Test proposal sorting**:
    - **A** (fine-tuning) → Pure Motive Shaping (Q1=No, Q3=Yes).  
