  ### Decision Tree for AI Safety Stances

  This decision tree starts from a proposal to deploy a capable AI coding assistant and uses up to four yes-or-no questions to classify the approach into one of six safety stances. Each question is phrased as a testable claim about the safeguard's mechanics, focusing on how it functions under adversarial conditions, when it operates, and its dependencies. The tree is designed to sort the five test proposals:
  - **A**: Continued fine-tuning for honesty (training-time intervention).
  - **B**: Pre-deployment evaluations for hidden backdoors (pre-deployment testing).
  - **C**: Live monitoring of intermediate reasoning with automatic shutdown (deployment-time constraint).
  - **D**: Execution in an isolated sandbox without network access (deployment-time constraint).
  - **E**: Workflow with a smaller trusted checker model approving code blocks (deployment-time constraint with AI dependency).

  #### Decision Tree Logic:
  1. **Question 1 (Deployment Focus)**:  
     *"Does the safeguard operate primarily during deployment (e.g., monitoring, restricting access, or checking outputs)?"*  
     - **Yes** → Go to Question 2.  
     - **No** → Go to Question 3.  

  2. **Question 2 (Adversarial Robustness)**:  
     *"Would the safeguard reduce harm even if the AI understood it and actively wanted to evade it?"*  
     - **Yes** → Go to Question 4.  
     - **No** → This path leads to **Pre-deployment Testing Only** (as deployment-time measures that fail under evasion are not true containment).  

  3. **Question 3 (Training Focus)**:  
     *"Does the safeguard work by shaping motives during training (e.g., fine-tuning for alignment or honesty)?"*  
     - **Yes** → **Pure Motive Shaping**.  
     - **No** → **Refusal to Deploy** (no safeguards imply deployment is too risky).  

  4. **Question 4 (AI Dependency)**:  
     *"Does the safeguard's safety depend on judgments from another AI system assumed to be non-scheming?"*  
     - **Yes** → **Hybrid Checker Setups**.  
     - **No** → **Pure Containment under Active Scheming**.  

