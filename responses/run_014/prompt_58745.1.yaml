  This tree resolves the argument by showing that "training for good behavior" (motive shaping) and "constraining a scheming AI" (containment) are distinct branches, with hybrid approaches combining both. Test proposals like **C**/**D** (containment) and **E** (hybrid) validate the "scheming-aware" project, while **A** and **B** align with motive-based trust.
