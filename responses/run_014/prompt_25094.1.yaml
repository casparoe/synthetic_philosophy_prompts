answer: |-
  Here are the desiderata for an adequate theory of superrational choice in symmetric games with common knowledge (CK) of rationality:

  1.  **Scope & Correctness:**
      *   **Games:** Must handle symmetric games with multiple pure-strategy Nash equilibria (NE), especially:
          *   **Prisoner's Dilemma (PD):** Must recommend mutual cooperation (C,C) as uniquely rational. "Getting it right" means providing a non-circular, non-tautological justification for C,C *despite* D dominating C individually, explaining why the dominance argument fails under CK of rationality.
          *   **Stag Hunt (SH):** Must recommend the payoff-dominant (Stag,Stag) equilibrium as uniquely rational. Justification must explain why the risk-dominant (Hare,Hare) equilibrium is less compelling under CK rationality.
          *   **Chicken:** Must recommend one of the pure-strategy NE (e.g., (Swerve, Straight) or (Straight, Swerve)) as uniquely rational *or* provide a compelling symmetric mixed strategy, justifying the selection over the other pure NE and the mixed strategy.
          *   **Symmetric Battle of the Sexes (BoS):** Must recommend one of the pure-strategy NE (e.g., (Boxing, Boxing) or (Ballet, Ballet)) as uniquely rational *or* provide a compelling symmetric mixed strategy, justifying the selection. Handling asymmetry (differing payoffs but isomorphic structure) requires extra care, potentially demanding a symmetric *solution concept* even if strategies differ.
      *   "Getting it Right": The output must be a uniquely recommended strategy profile *justified by a cogent story*. This story must explicitly show why CK of rationality compels rational agents to choose this profile, overcoming temptations inherent in individual reasoning (like dominance in PD). It cannot merely point to Pareto-superiority or equilibrium status alone.

  2.  **Resolving Paradoxes:**
      *   **The Regress ("I know you'll C so I'll D"):** Must dissolve the infinite regress where reasoning for cooperation seems to depend on the other's cooperation, reintroducing the temptation to defect. The justification must be self-supporting and regress-stopping under CK rationality.
      *   **The Embedding Problem:** Must explain why the reasoning recommending cooperation in the symmetric PD with a rational counterpart *does not* recommend cooperating with a rock, a simpleton mirroring you, or an agent playing a fixed strategy. The theory must identify what specific feature of the symmetric, CK-rational counterpart makes cooperation rational.
      *   **Tension with Causal Decision Theory (CDT):** Must explicitly address why the reasoning required (e.g., choosing C in PD because you expect your choice to be correlated/matched with the other's) is rational *despite* CDT's verdict that your choice *causally* cannot influence the other's choice, making D dominant. Must either reconcile with CDT or justify its rejection/modification under CK.

  3.  **Relationship to Classical Game Theory:**
      *   **Consistency:**
          *   Must preserve the existence of Nash equilibria as *possible* outcomes.
          *   Should be consistent with classical solutions in games with a unique, strict NE (e.g., zero-sum games).
          *   Should respect rationality postulates where no fundamental conflict arises (e.g., iterated dominance where applicable).
      *   **Permitted Revision:**
          *   Explicitly permitted to reject the applicability of strict dominance reasoning in games like the one-shot PD *under the specific condition of CK of rationality and symmetry*.
          *   Permitted to select a specific NE in coordination games (SH, BoS, Chicken) based on CK rationality, overriding standard equilibrium selection criteria if necessary.
          *   Permitted to propose solution concepts distinct from Nash equilibrium if justified.

  4.  **Nature of Superrationality:**
      *   Must clarify that superrationality is **not a distinct mode** of reasoning switched on for symmetric games. Instead, it must present superrationality as **what individual rationality fundamentally entails** once the full implications of CK of rationality *and* the symmetric structure of the game are properly internalized by the agents. The apparent conflict (e.g., dominance vs. mutual benefit) must be shown as an artifact of an incomplete specification of the decision problem that ignores the implications of CK and symmetry.

  **Flagged Tensions:**

  1.  **PD Cooperation vs. Dominance/Embedding:** Reconciling the demand to justify C,C in PD (overcoming dominance) with the demand to *not* recommend cooperating with a rock/simpleton is the core tension. Any reasoning justifying C,C must be sensitive to the *specific reason* for the correlation (shared rationality under symmetry), not just the correlation itself. **Satisfying PD correctness without overgeneralizing to rocks is arguably the hardest challenge.**
  2.  **Uniqueness vs. Symmetry in Asymmetric Games:** Demanding unique rational play in asymmetric variants (e.g., asymmetric BoS) while respecting symmetry constraints is difficult. Symmetry might constrain the solution concept, but uniqueness might require asymmetric strategies.

  **Scorecard on Existing Approaches:**

  *   **Hofstadter's Original (Reflective Equilibrium):** Fails embedding spectacularly (recommends C with rocks). Struggles with uniqueness in coordination games. Offers a regress-stopping story ("we are alike") but doesn't deeply resolve the CDT tension. Inconsistent with dominance reasoning without clear justification. **Key Failure: Embedding (and CDT tension).**
  *   **Evidential Decision Theory (EDT):** Can justify C,C in PD via correlation (choosing C is evidence the other does). *Partially* addresses embedding by relying on acausal correlation only with agents whose choice *logically depends* on yours via shared rationality/symmetry. Struggles profoundly with CDT tension (explicitly violates it). May fail to select uniquely in coordination games (EDT often indifferent between correlated equilibria). **Key Failure: CDT Tension (fundamental conflict).**
  *   **Program Equilibrium (e.g., TDT, UDT):** Excels at embedding – cooperation requires reciprocal commitment encoded in the program/decision theory. Can handle PD and potentially coordination games by selecting the Pareto-optimal outcome via mutual prediction. Offers a regress-stopping story (fixed points of mutual prediction). Still clashes with CDT (programs leverage logical/non-causal influence). **Key Strength: Embedding. Key Challenge: Relationship to CDT and intuitive "rationality".**

  **Key Separating Desiderata:** The **Embedding Problem** crucially distinguishes Hofstadter (fails) from EDT/Programs (attempt solutions). The **Tension with CDT** fundamentally separates EDT/Programs (reject/violate CDT) from approaches trying to stay within causal frameworks. **Justifying Uniqueness in Coordination Games** (SH, BoS, Chicken) tests the theory's ability to go beyond correlation to select a specific profile.
