prompt: |-
  I run a small podcast on decision theory and cooperation (couple hundred devoted listeners, mostly people who already know their Newcomb from their Prisoner's Dilemma). Next month's guest is a philosopher who's spent his whole career defending Hofstadter-style superrationality — the idea that if you and your co-players are all reasoning the same way about a symmetric one-shot game, you should treat your own choice as a representative sample of everyone's and pick the cooperative option even when defecting is causally dominant.

  He's slick. Whenever I push him on the obvious objection — why should I care that a mirror-image reasoner in another room is arriving at the same conclusion I am? — he says something like "it's not about caring, it's about what makes your decision the decision it is" and then changes the subject. He'll definately do his smooth-guru thing unless the questions are built to survive it.

  Draft me eight to ten interview questions. I want at least one that forces him to confront the renegade problem head-on: if he really believes everyone who reasons like him will cooperate, isn't the tempting thought "I'll be the one who defects" rational, and what exactly blocks it? One on whether his view commits him to voting in every single election — his one vote causally does basically nothing, but on his own logic everyone who reasons like him votes, so does the ballot box become a giant prisoner's dilemma he's already solved? And one on near-symmetry: what survives when the payoffs are slightly different, or one player is a bit worse at reasoning than the others — at what point does "we're all the same" quietly become "we're similar enough for the argument to go through," and isn't that last step just evidential reasoning with extra steps? For each question, include a follow-up keyed to the dodge he's most likely to give.

  Don't hand me a menu with hedges and alternatives — commit to the questions you actually think will corner him, and tell me briefly why you ordered them the way you did, because I want to build the episode as an escalating trap. Whole thing under 400 words, follow-ups included.
reasoning: |-
  Okay, let me unpack this user's request. They host a niche podcast on decision theory with a guest who advocates Hofstadter-style superrationality. The core challenge seems to be pinning down this philosopher who's adept at dodging objections with vague metaphysical claims. 

  Hmm, the user wants three specific angles covered: the renegade problem, voting paradox implications, and fragility under near-symmetry. Each needs surgical follow-ups anticipating his evasive maneuvers. Interesting that they emphasize "cornering" rather than exploration - this is adversarial interviewing territory.

  First, the renegade problem. If everyone cooperates under superrationality, why wouldn't I defect? His likely dodge: "But you wouldn't be that person!" Follow-up must force him to explain why that identity claim matters causally. Maybe attack the leap from "is" to "ought" in his reasoning.

  For voting, the tension between causal futility and cooperative obligation is perfect. He'll probably retreat to symmetry. Follow-up should spotlight how this dissolves all decision-making into mind-reading - if my vote only matters when others think alike, why act at all?

  Near-symmetry is the kill shot. His "similar enough" threshold will expose the evidentialism he denies. Follow-up must trap him: either admit payoffs/reasoning create asymmetry (undermining superrationality) or concede it's just Bayesian updating in disguise.

  Structure is critical. Opening with renegade establishes the core paradox, voting extends it to real-world futility, near-symmetry demolishes the foundation. Each follow-up preempts his favorite escape routes. User's right - this needs escalating pressure.

  ...Wait, should I include something on decision-theoretic regress? No, user was specific about three foci. Stick to their blueprint. Final check: all questions weaponize his own premises against him. That's the only way to counter guru deflection tactics.
answer: |-
  Here are your eight questions ordered as an escalating trap, with follow-ups targeting predictable dodges:

  1.  **Core Mechanism:** "Superrationality asks me to treat my choice as representative of identical reasoners. But *why* does the fact that others reason identically constrain *my* decision in a causally disconnected, one-shot interaction?"
      *   *Likely Dodge:* "It's constitutive of what the decision *is*."
      *   **Follow-up:** "If it's constitutive, is defecting simply an *incoherent* choice for a superrational agent? Doesn't this redefine rationality to exclude dominant strategies by fiat?"

  2.  **The Renegade Problem:** "If superrationality guarantees cooperation from all identical reasoners, doesn't the thought 'I'll be the *one* who defects while others cooperate' become extremely tempting? What specifically blocks that thought as irrational *for me*?"
      *   *Likely Dodge:* "A true superrational agent *couldn't* be that renegade; the reasoning precludes it."
      *   **Follow-up:** "But *why* is it precluded? Isn't the renegade just exploiting the *assured* cooperation of others – cooperation your theory *guarantees*? Doesn't blocking this require assuming away the very possibility of strategic deviation your view claims to solve?"

  3.  **Identity & Scope:** "How strictly identical must reasoners be? Does superrationality only bind perfect philosophical clones, or does it apply to 'similar enough' reasoners? Where's the line?"
      *   *Likely Dodge:* "It applies when agents recognize each other as sufficiently similar superrational reasoners."
      *   **Follow-up:** "Doesn't 'sufficiently similar' smuggle in evidential reasoning? If I expect *similar* (not identical) others to cooperate *because* I cooperate, isn't that just me acting on the *evidence* my choice provides about theirs?"

  4.  **Near-Symmetry Fragility:** "Imagine a Prisoner's Dilemma where my payoff for mutual defection is *slightly* better than yours. Does superrationality still demand mutual cooperation? If not, why does a tiny asymmetry break the 'sameness' required, when vast differences in reasoning ability supposedly don't?"
      *   *Likely Dodge:* "Significant asymmetry breaks the symmetry required for the reasoning."
      *   **Follow-up:** "But 'significant' is vague. If minor payoff differences or slight reasoning disparities *do* break it, doesn't this make superrationality practically inert outside toy models with *perfect* clones? Isn't evidential reasoning more robust?"

  5.  **The Voting Paradox:** "Your vote in a large election is causally negligible. If you apply superrationality, shouldn't you vote because all identical reasoners like you would vote, making your vote part of a causally significant bloc?"
      *   *Likely Dodge:* "Only if the election presents a symmetric cooperation problem among superrational agents."
      *   **Follow-up:** "But elections *are* symmetric PDs: mutual voting is costly but best if all do it, mutual abstention is easy but worse. If you don't vote, aren't you logically inconsistent? If you do vote, aren't you admitting superrationality demands actions with *zero* causal efficacy based purely on correlated expectations?"

  6.  **Causation vs. Correlation:** "Superrationality seems to replace causal influence over others with the *correlation* of choices via identical reasoning. Isn't this just sophisticated evidential decision theory (EDT) dressed up?"
      *   *Likely Dodge:* "No, it's fundamentally different; it's about the structure of rational choice among identical agents, not evidence."
      *   **Follow-up:** "But the *practical upshot* is identical to EDT in symmetric games: cooperate in PDs, one-box in Newcomb's. If the outputs match and the mechanism relies on correlated outcomes based on reasoning similarity, what's the *substantive* difference beyond metaphysics?"

  7.  **Regress Problem:** "How do superrational agents *initiate* this reasoning? To decide cooperatively, I must assume others reason identically and cooperatively. But how do *they* know *I* will? Doesn't this require a prior, unexplained mutual expectation of cooperation?"
      *   *Likely Dodge:* "The mutual recognition of identical superrationality *is* the starting point."
      *   **Follow-up:** "But isn't that circular? 'We cooperate because we recognize we are identical reasoners who cooperate.' Doesn't this bypass the core problem of *why* that initial recognition leads to cooperation instead of the causally dominant defection?"

  8.  **Alternative Foundations:** "If superrationality isn't reducible to EDT or causal decision theory (CDT), what independent testable predictions or prescriptions does it offer that EDT/CDT cannot? Or is its value purely as a novel perspective?"
      *   *Likely Dodge:* "It reveals the deep structure of rational cooperation where CDT fails."
      *   **Follow-up:** "But if it only 'reveals' this in perfectly symmetric, one-shot interactions among perfect clones, and collapses into EDT under scrutiny or asymmetry, isn't it just a special case of evidential reasoning?"

  **Why this order & strategy:**

  1.  **Establish Core Confusion:** Start with the fundamental "why?" (Q1) he dodges.
  2.  **Apply Immediate Pressure:** Hit the core paradox of the renegade (Q2) – his weakest spot. Follow-up traps him in circularity.
  3.  **Expose Boundary Issues:** Questions 3 & 4 target the fragility of "sameness." Follow-ups force him to either admit impracticality or reveal the evidential core.
  4.  **Force Real-World Absurdity:** Voting (Q5) makes the causal impotence problem vivid. Follow-up highlights inconsistency.
  5.  **Theoretical Reduction:** Q6 directly challenges uniqueness vs. EDT. Follow-up demands substance.
  6.  **Undermine Foundations:** Q7 attacks the bootstrapping problem. Follow-up highlights circularity.
  7.  **Demand Utility:** Q8 forces him to justify superrationality's existence beyond being "interesting." Follow-up suggests redundancy.

  This sequence moves from core confusion, through major objections (renegade, fragility), to real-world test (voting), then theoretical critique (vs. EDT, regress), ending with a demand for justification. Each follow-up is designed to cut off his primary escape route and force a substantive answer or concession.
