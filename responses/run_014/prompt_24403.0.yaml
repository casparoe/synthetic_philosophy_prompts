  We also haven't addressed the possibility that one of the groupings might be more fundamental. For instance, if we had a hidden feature that determined both A and B, then that might be the true natural kind. But in our setup, there is no such feature. We'll have to note that the activity is simplified.

  In the debrief, we will have to explain that the context-dependence does not mean that anything goes; it means that the world has multiple real patterns and which pattern we focus on depends on our interests.

  This activity should achieve the goal: the students experience the failure of the superficial kind and the context-dependence of the deep kind through their own actions and scores.
answer: |-
  ### Structured In-Class Activity: "Kind Quest"  
  **Goal:** Students experience the contrast between superficial vs. deep classification and the context-dependence of "natural kinds" through gameplay, scoring, and group conflict—without a lecture.  

  ---

  #### **1. Game Design: "Prediction Challenge"**  
  **Materials:**  
  - **32 paper cards** (8 unique types × 4 copies each).  
  - **Whiteboard** to track scores and rules.  
  - **Markers** (for whiteboard and labeling).  
  - **2 envelopes** labeled "Feature X" and "Feature Y" (each contains a slip defining the hidden feature for Phase 2).  

  **Card Details (Prepare in advance):**  
  Each card has:  
  - **ID** (e.g., A1, A2, B1, B2, C1, C2, D1, D2).  
  - **Surface features:**  
    - **Color:** Red or Blue.  
    - **Shape:** Circle or Square.  
  - **Hidden features (not printed; revealed during gameplay):**  
    - **Feature A:** Depends on shape (Circles = 1, Squares = 0).  
    - **Feature B:** Depends on color (Red = 1, Blue = 0).  

  *Example cards:*  
  - Card A1: Red Circle → Hidden: A=1, B=1  
  - Card A2: Blue Circle → Hidden: A=1, B=0  
  - Card B1: Red Square → Hidden: A=0, B=1  
  - Card B2: Blue Square → Hidden: A=0, B=0  
  *(Repeat for types C and D)*  

  **Setup:**  
  - Shuffle all 32 cards.  
  - Split into two identical 16-card decks (Deck 1 for Phase 1, Deck 2 for Phase 2).  

  **Rules & Scoring:**  
  - **Phase 1 (Whole Class):**  
    - **Task:** Group cards by the "most obvious" feature (color). Then predict **Feature A** (shape-driven).  
    - **Scoring:** For each group, count cards where **Feature A** matches the *majority* in that group.  
      - Correct prediction = +1 point per card.  
      - **Max score: 16.**  

  - **Phase 2 (Two Groups):**  
    - Split class into **Group Alpha** and **Group Beta**.  
    - **Alpha** predicts **Feature A** (same as Phase 1).  
    - **Beta** predicts **Feature B** (new, color-driven).  
    - **Task:** Each group chooses *one* feature (color or shape) to group their deck and predict their hidden feature.  
    - **Scoring:** Same as Phase 1. Max score: 16.  
    - **Twist:** Groups do *not* know the other is predicting a different feature.  

  **Payoff:**  
  - Winning group in Phase 2 gets bragging rights.  
  - Scores visibly tracked on whiteboard to fuel competition.  

  ---

  #### **2. Setup to Force Superficial vs. Deep Contrast**  
  - **Phase 1 Trap:** Students instinctively group by **color** (salient surface feature).  
    - Result:  
      - *Red group*: Mix of Circles (A=1) and Squares (A=0) → Not homogeneous.  
      - *Blue group*: Same mix → Poor prediction (score: 8/16).  
  - **Phase 1 Redemption:** When they regroup by **shape** (less obvious):  
    - *Circles*: All A=1 → Perfect prediction.  
    - *Squares*: All A=0 → Perfect prediction (score: 16/16).  
  - **Outcome:** Students *see* their initial score drop due to superficial grouping.  

  ---

  #### **3. Mechanism for Context-Dependence**  
  - **Phase 2 Group Split:**  
    - **Group Alpha** predicts **Feature A** (best grouped by *shape*).  
    - **Group Beta** predicts **Feature B** (best grouped by *color*).  
  - **Result:**  
    - Alpha’s "best" classification: Shape (scores 16/16).  
    - Beta’s "best" classification: Color (scores 16/16).  
  - **Conflict:** When groups compare results, they realize:  
    - Both scored perfectly.  
    - Alpha insists shape is "correct"; Beta insists color is "correct."  
    - **Tension arises organically:** They debate why the other group’s "best" classification feels arbitrary *for their own goal*.  

  ---

  #### **4. Minute-by-Minute Timeline**  
  **Total: 90 minutes**  
  - **0-10 min:** Introduce activity. Explain rules, scoring, and the goal ("predict hidden features"). Show example card.  
  - **10-30 min (Phase 1):**  
    - Students group Deck 1 by **color** (10 min).  
    - Reveal **Feature A**. Calculate score (5 min).  
    - Regroup by **shape**. Recalculate score (5 min).  
    - Discuss why shape worked better (5 min).  
  - **30-40 min:** Split into **Alpha** and **Beta**. Assign hidden features (Alpha: Feature A, Beta: Feature B via envelopes). Clarify Phase 2 rules.  
  - **40-60 min (Phase 2):**  
    - Groups work separately: Group cards, predict, calculate scores (15 min).  
    - Record scores on whiteboard (5 min).  
  - **60-75 min:** Groups report:  
    - Alpha: "We used **shape** and scored 16!"  
    - Beta: "We used **color** and scored 16!"  
    - Facilitate debate: "Why did you choose your feature? Why is the other group wrong?"  
  - **75-80 min:** Reveal the twist: "Alpha predicted Feature A; Beta predicted Feature B."  
  - **80-90 min:** Structured debrief (see below).  

  ---

  #### **5. Debrief: Mapping Activity to Philosophy**  
  - **Phase 1 Color Grouping Failure (Score: 8/16):**  
    - *Philosophical link:* "Superficial resemblance (color) created *arbitrary categories*—they didn’t track the causal structure behind Feature A (shape)."  
    - *Student moment:* "We thought color was obvious, but it was useless!"  
  - **Phase 1 Shape Success (Score: 16/16):**  
    - *Philosophical link:* "Shape was a *natural kind* for Feature A—it ‘carved nature at its joints’ and revealed real structure."  
    - *Student moment:* "We only got it right when we ignored the flashy feature!"  
  - **Phase 2 Group Conflict (Both score 16):**  
    - *Philosophical link:* "Natural kinds are *purpose-relative*. For Feature A, shape was ‘right.’ For Feature B, color was ‘right.’ Neither is universally correct."  
    - *Student moment:* "Why are they using color? It’s clearly not the *real* grouping!" → "Wait, we were predicting different things?"  

  ---

  #### **6. Prediction of Problems & Fixes**  
  **Problem:** Students resist regrouping in Phase 1 ("Color is fine!").  
  - **Fix:** Hammer the low score. Ask: "Can you really trust color if it only gets 50% right?"  

  **Problem:** Phase 2 groups finish at different times.  
  - **Fix:** Assign "timekeepers" in each group. Use a visible timer.  

  **Problem:** A group uses *both* features in Phase 2.  
  - **Fix:** Restate rules: "You must pick *one* feature to group by. No hybrids!"  

  **Problem:** Students peek at both hidden features.  
  - **Fix:** Envelopes only reveal one feature. Physically separate groups.  

  **Problem:** Debate becomes aggressive.  
  - **Fix:** Intervene: "What does your score tell you? Why might the other group be confident?"  

  ---

  #### **7. Structural Limitation & Debrief Supplement**  
  **What the Activity Can’t Show:**  
  - **Metaphysical depth:** The activity implies that natural kinds *only* depend on human goals. It doesn’t challenge whether a "deeper" universal structure exists (e.g., a unified theory explaining *both* features).  

  **Supplement in Debrief:**  
  - "In science, we might ask: Is there a hidden property (e.g., atomic structure) that explains *both* Features A and B? That could be the ‘true joint.’ But until we find it, we use purpose-relative kinds. The activity shows why science often uses *multiple* classifications (e.g., species by genetics vs. ecosystems)."  

  ---

  **Why This Works:**  
  - **Scores force the lesson:** Students *see* superficial grouping fail and context-dependent grouping succeed.  
  - **Conflict is organic:** Tension arises when both groups defend their "correct" classification.  
  - **You talk less, they do more:** 75% of time is gameplay; debrief only contextualizes their experience.  

  **Preparation:**  
  - **Time:** 1–2 hours (draw cards, label envelopes).  
  - **Cost:** Paper, markers, envelopes (all reusable).  

  This ensures the idea hits them in the gut—not just the head.
