prompt: |-
  Okay so I have a friend who has been really deep in the wrong-kind-of-reasons problem lately and she's got these super firm intuitions about which reasons are the wrong kind for a given attitude. I've been keeping score of her calls. Here's her track record so far:

  - If I believe p, I'll feel a lot better about my life — wrong kind of reason to believe p.
  - The evidence supports p — right kind, obviously.
  - Admiring X will make you look sophisticated to your peers — wrong kind of reason to admire X.
  - X is genuinely courageous — right kind.
  - Blaming her will deter the rest of the office from cutting corners — wrong kind of reason to blame her.
  - She actually did something wrong — right kind.
  - This painting is beautifully composed — right kind of reason to find it beautiful.

  So next week she's gonna get asked about this one: X is famous, as a reason to admire X. I honestly have no idea what she'll say and I want to figure out whats actually going on under the hood. Can you predict her verdict, work out which underlying rule she seems to be running, name the other rule or two that fit her track record just as well, say what each of those predicts for the fame case, give me your best guess with your reasoning for why, and tell me which additional test case would most cleanly separate her rules?
reasoning: |-
  Okay, let me tackle this step by step. The user has a friend with strong intuitions about "wrong kind of reasons" for various attitudes, and they've provided a track record of her judgments. The goal is to predict her verdict on whether "X is famous" is the wrong kind of reason to admire X, identify the underlying rule, propose alternative rules, and suggest a test case to distinguish between them.

  First, I need to analyze the existing pattern in her decisions. Looking at the examples:

  - Belief cases: Pragmatic reasons (feeling better) are wrong, evidential reasons (evidence supports p) are right.
  - Admiration: Instrumental reasons (looking sophisticated) are wrong, while intrinsic qualities (genuine courage) are right.
  - Blame: Consequentialist reasons (deterrence) are wrong, deontological reasons (actual wrongdoing) are right.
  - Aesthetic judgment: Intrinsic features (beautiful composition) are right.

  The common thread seems to be that reasons are "right kind" when they directly relate to the attitude's inherent standards. For belief, it's truth; for admiration, it's admirable traits; for blame, it's moral responsibility; for beauty, it's aesthetic merit. "Wrong kind" reasons are external—outcomes or benefits of holding the attitude.

  For the admiration case with fame: Fame itself isn't an admirable trait; it's a social consequence. If she's consistent, she should call this "wrong kind" because fame doesn't make X worthy of admiration—it's just a byproduct. 

  Alternative rules could be:
  1. "Fittingness-only": Right kind = reasons that make the attitude fitting (fame doesn't make admiration fitting).
  2. "Attitude-independent value": Right kind = reasons based on properties justifying the attitude regardless of context (fame is context-dependent).
  3. "Internalism": Right kind = reasons accessible from first-person perspective (fame is external).

  All alternatives likely predict "wrong kind" for fame too. To tease them apart, I need a test case where predictions diverge. Something like "This joke is offensive" as a reason to find it funny. Fittingness-only would say "wrong kind" (offensiveness doesn't make it funny), but internalism might accept it if offensiveness humor aligns with personal taste. Her history suggests she'd reject it as wrong kind, favoring fittingness.

  My best guess: She runs on fittingness-only. Fame is irrelevant to admirable qualities, so verdict: wrong kind. Test case: "This joke is offensive" for amusement—if she rejects it, fittingness-only is confirmed.
answer: |-
  Based on your friend's track record and the philosophical context of the "wrong kind of reasons" (WKR) problem, I'll break this down systematically. Her pattern reveals a consistent underlying principle, but there are nuances to consider.

  ### 1. **Predicted Verdict for "X is famous" as a reason to admire X**  
     She will say this is the **wrong kind of reason** to admire X.  

  ### 2. **Her Underlying Rule**  
     She appears to follow a **"fittingness-only" rule**:  
     - **Right-kind reasons (RKRs)** must directly bear on whether the attitude *fits its object* (i.e., whether the object actually *merits* the attitude based on its intrinsic properties).  
     - **Wrong-kind reasons (WKRs)** are those that appeal to the *consequences* of holding the attitude, social pressures, or instrumental benefits, without relating to the attitude's inherent standards.  

     This fits her track record:  
     - Belief RKRs require *truth-related* evidence (e.g., "evidence supports p"), not pragmatic benefits ("feel better").  
     - Admiration RKRs require *admirable traits* (e.g., "courage"), not social rewards ("look sophisticated").  
     - Blame RKRs require *moral responsibility* ("did something wrong"), not utilitarian outcomes ("deter others").  
     - Aesthetic appreciation RKRs require *inherent qualities* ("beautifully composed"), not external factors.  

  ### 3. **Alternative Rules That Fit Her Track Record**  
     Two other rules could explain her judgments equally well:  

     - **Rule 2: Attitude-Independent Value (AIV)**  
       RKRs must reference properties that *objectively justify* the attitude *independently of the attitude-holder's perspective*. WKRs appeal to subjective/context-dependent gains.  
       - *Fame prediction for admiration*: **WKR** (fame is context-dependent social status, not an objective basis for admiration).  
       - *Fits track record*: Evidence ("supports p"), courage, wrongdoing, and composition are objective properties; feeling better, peer perception, deterrence, and (arguably) fame are subjective/relational.  

     - **Rule 3: Internalism about Reasons (IR)**  
       RKRs must be *accessible from the first-person perspective of the attitude-holder* as direct grounds for the attitude. WKRs are external, third-person justifications.  
       - *Fame prediction for admiration*: **WKR** (fame is an external social fact, not a reason accessible internally *as* admirable).  
       - *Fits track record*: Feeling better, peer perception, and deterrence are externally imposed incentives; evidence, courage, wrongdoing, and composition are internally accessible reasons for the attitude.  

  ### 4. **Best Guess with Reasoning**  
     - **Verdict**: Fame is a **WKR** for admiration.  
     - **Reasoning**:  
       - Fame is a *relational/social property* (how others perceive X), not an *intrinsic admirable trait* (like courage). It appeals to instrumental benefits (e.g., social approval for admiring X) or contingent facts, not whether X *deserves* admiration.  
       - This mirrors her rejection of "admiring X will make you look sophisticated" (social reward) and "blaming her will deter others" (instrumental outcome).  
       - Her pattern prioritizes *what makes the attitude fitting* over *why it’s beneficial to hold it*. Fame is the latter.  

  ### 5. **Test Case to Separate the Rules**  
     To cleanly distinguish between the rules, use:  
     > **"This joke is offensive" as a reason to find it *amusing*.**  

     - **Predictions**:  
       - **Fittingness-only (her likely rule)**: **WKR**. Offensiveness doesn’t make the joke *funny* (fitting for amusement); it might even conflict with it. Amusement requires inherent humor (e.g., wit, absurdity).  
       - **AIV**: **WKR**. Offensiveness is a relational/moral property, not an objective feature that justifies amusement.  
       - **IR**: **Potentially RKR**. If the attitude-holder finds offensiveness *itself* amusing (e.g., dark humor), this could be an internally accessible reason, even if others disagree.  

     **Why this works**:  
     - If she calls it **WKR**, it supports **Fittingness-only** or **AIV** (both prioritize objective fittingness).  
     - If she calls it **RKR**, it supports **IR** (first-person accessibility over fittingness). Given her history, she’ll likely call it **WKR**, confirming **Fittingness-only** as primary.  

  ### Summary  
  - **Her verdict for fame**: Wrong kind of reason (not fitting for admiration).  
  - **Dominant rule**: **Fittingness-only** (RKRs must make the attitude *merited* by the object’s properties).  
  - **Critical test**: "This joke is offensive" as a reason for amusement—if **WKR**, confirms fittingness-only; if **RKR**, supports internalism.  

  Her approach aligns with philosophers like T.M. Scanlon or Pamela Hieronymi, who emphasize that reasons must "match" the attitude’s constitutive aim (e.g., belief aims at truth, admiration at excellence). Fame fails because it’s detached from what makes X admirable *in itself*.
