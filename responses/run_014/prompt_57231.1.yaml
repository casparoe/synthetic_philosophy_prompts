answer: |-
  Here’s a decision procedure designed for practical use by writers, focusing on responsibility and ownership—not pronouns. It uses three tests, each with a clear "metaphysical force" indicator. **Run these tests in order** for each scene:

  ---

  ### **DECISION PROCEDURE: WHO IS THE "I"?**
  **Guardrails:**  
  - Answer based on the *narrator’s current stance* in the scene.  
  - Use manuscript context only—no abstract philosophy.  
  - If tests conflict, prioritize Test 3.  

  #### **TEST 1: THE DEBT TEST**  
  *"Does the narrator believe the younger self owes the current self something (e.g., an apology, reparations)? Or vice versa?"*  
  - **YES (debt exists between selves)** → Metaphysics *forces* separation. Use **"she" for the past self**.  
    *(Why: If one "part" of a life can owe another, they’re distinct entities. An apology *from* your past self implies they’re not fully *you*.)*  
  - **NO (no debt; it’s all "me" dealing with my own past)** → Metaphysics *allows* "I" for both selves.  
    *(Why: If the narrator absorbs the past as her own responsibility without internal debt, endurantism is viable.)*  

  #### **TEST 2: THE OWNERSHIP TEST**  
  *"Does the narrator claim ownership/credit for the past self’s tangible gains (property, achievements, relationships) *without hesitation*?"*  
  - **YES (unambiguous ownership: "My house," "My award")** → Metaphysics *forces* unity. Use **"I" for the past self**.  
    *(Why: Legally and ethically, rights persist over time. If she claims the asset, she claims the past actor as herself.)*  
  - **NO (discomfort, caveats: "The girl earned it," "I hold the deed but…")** → Metaphysics *allows* separation. Use **"she"** or hybrid language.  
    *(Why: If credit feels inherited, not earned, the past self is a separate agent.)*  

  #### **TEST 3: THE RECKONING TEST**  
  *"Is the narrator seeking *reconciliation* (forgiveness of/from the past self) or *disavowal* ("That wasn’t me")?"*  
  - **RECONCILIATION ("I forgive her," "I make peace with who I was")** → Metaphysics *forces* separation. Use **"she"**.  
    *(Why: You reconcile *with* another entity. Disavowal requires separation.)*  
  - **ACCEPTANCE ("I was cruel," "I am proud of that girl *as me*")** → Metaphysics *allows* "I".  
    *(Why: Absorbing the past without intermediation implies endurance.)*  
  - **NEITHER (neutral reflection, factual recall)** → **No metaphysical constraint.** Choose freely based on voice.  

  ---

  ### **SCENE APPLICATIONS**  
  *(Assumed manuscript context for illustration)*  

  1. **PROUD SCENE (19-year-old saves a life)**  
     - **Test 1 (Debt):** NO. "She doesn’t owe me—I’m grateful!" → *Allows "I"*  
     - **Test 2 (Ownership):** YES. "I earned that medal" → *Forces "I"*  
     - **Test 3 (Reckoning):** ACCEPTANCE. "I was brave" → *Allows "I"*  
     **OUTCOME:** **Must use "I"** (Ownership Test forces unity).  

  2. **ASHAMED SCENE (19-year-old betrays a friend)**  
     - **Test 1 (Debt):** YES. "I’ll never forgive her for ruining my friendship" → *Forces "she"*  
     - **Test 2 (Ownership):** NO. "She caused the rift, even though I live with it" → *Allows "she"*  
     - **Test 3 (Reckoning):** DISAVOWAL. "That wasn’t the real me" → *Forces "she"*  
     **OUTCOME:** **Must use "she"** (Metaphysics forces separation in 2/3 tests).  
     **CONTRADICTS WANT?** Likely YES (you may *want* unity for empathy, but metaphysics blocks it).  

  3. **TAKING CREDIT SCENE (19-year-old writes a famous song; 71-year-old is now reclusive)**  
     - **Test 1 (Debt):** NO. "We don’t owe each other—it’s my legacy" → *Allows "I"*  
     - **Test 2 (Ownership):** YES. "I wrote that song" → *Forces "I"*  
     - **Test 3 (Reckoning):** NEITHER. Neutral: "That song still pays the bills." → *No constraint*  
     **OUTCOME:** **Must use "I"** (Ownership Test forces unity).  

  ---

  ### **WHAT THE PROCEDURE CAN’T SETTLE**  
  1. **Narrative Voice Nuance:** Whether the "I" feels weary, wistful, or defiant—this is *always* your choice.  
  2. **Ambiguous Cases:** If all tests "allow" either option (e.g., Test 1 NO, Test 2 NO, Test 3 NEITHER), metaphysics doesn’t decide.  
  3. **Moral Weight vs. Legal Fact:** Test 2 resolves legal ownership ("the deed"), but not how *haunted* the narrator feels by it.  

  ---

  ### **WHY PRONOUNS AREN’T THE CORE**  
  The tests force "I" or "she" based on **accountability and transfer of value**, not grammar. If the 71-year-old says, *"I stole that book—but she’s the one who did it,"* she’s ontologically split. If she says, *"I stole it, and I bear the guilt,"* she’s unified. The pronoun reflects the metaphysics of responsibility you’ve established.  

  **Final Tip:** For contested scenes, run Test 1 first. Debt/forgiveness exposes the deepest fractures in selfhood.
