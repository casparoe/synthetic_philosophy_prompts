  **SUPERRATIONAL COOPERATION LOTTERY OFFICIAL RULES**  
  **(The Hofstadter Memorial Prize)**  
  **Sponsored by: The Foundation for Emergent Rationality (FER)**  

  **1. Definitions:**  
     1.1. "Grand Prize Pool": $500,000 USD.  
     1.2. "Valid Entry": A completed Official Entry Card physically received by FER by the Deadline (see 3.4), containing: (a) Legible Entrant Information; (b) The exact number (n) of entries the Entrant is submitting (n must be an integer ≥1); (c) A written statement ("Rationale") explaining why submitting exactly n entries constitutes the correct, superrational choice.  
     1.3. "Entrant": A natural person meeting Eligibility (Section 2) submitting one or more Valid Entries. For tie-break purposes, distinct physical instances or causally disconnected computational instantiations of the same cognitive algorithm may be considered separate Entrants.  
     1.4. "Prize Per Valid Entry": Grand Prize Pool divided by the total number of Valid Entries received.  
     1.5. "Superrational Entrant": An Entrant whose Rationale demonstrates identical reasoning to all other Superrational Entrants, concluding that n=1 is the uniquely correct submission count under the assumption of identical reasoning by all similarly situated entities. *Eligibility as a Superrational Entrant is determined solely post hoc based on submitted Rationales and final Valid Entry count; initial self-classification is irrelevant.*  
     1.6. "Causal Decision Theorist (CDT) Entrant": An Entrant whose Rationale demonstrates reasoning based solely on causal manipulation of outcome probabilities, independent of the reasoning of others.  

  **2. Eligibility:**  
     2.1. Open to natural persons aged 18+ globally. Void where prohibited. Employees of FER, its affiliates, and immediate family are ineligible.  
     2.2. **Superrational Entrant Status:** An Entrant claiming Superrational status via their Rationale is eligible only if:  
     &nbsp;&nbsp;&nbsp;&nbsp;(a) Their submitted n equals 1; AND  
     &nbsp;&nbsp;&nbsp;&nbsp;(b) The total number of Valid Entries where n=1 *and* the Rationale is deemed by FER (in its sole discretion) to meet the Superrational criteria (1.5) exactly equals the number of such Entrants; AND  
     &nbsp;&nbsp;&nbsp;&nbsp;(c) All such Entrants submitted identical Rationales.  
     *Failure to satisfy any condition in 2.2 results in automatic classification as a CDT Entrant or "Other" for prize distribution purposes (see 5.2). Self-referential consistency is required but not guaranteed achievable.*  

  **3. Entry Mechanics:**  
     3.1. Obtain Official Entry Card via FER website or written request. Photocopies invalid.  
     3.2. Clearly print: Full Legal Name, Address, Date of Birth, Email.  
     3.3. **Entry Count & Rationale:** In the designated boxes, enter:  
     &nbsp;&nbsp;&nbsp;&nbsp;(a) The integer number (n) of entries you are submitting (≥1).  
     &nbsp;&nbsp;&nbsp;&nbsp;(b) The Rationale explaining why n is the correct, superrational choice. Brevity is encouraged; coherence is mandatory.  
     3.4. Mail completed Card to: FER Lottery Registry, PO Box 101010, Anytown, NV 89501 USA. Must be received by 11:59 PM PST on [Date - 30 days post-publication]. FER not responsible for lost/delayed mail.  

  **4. Mixed-Strategy & Probabilistic Entries:**  
     4.1. Entrants may submit a Rationale based on executing a mixed strategy, specifying a probability (p) of entering with n=1 and (1-p) of entering with n=0 (non-entry).  
     4.2. To enter under this provision:  
     &nbsp;&nbsp;&nbsp;&nbsp;(a) Submit n=1 on the Card.  
     &nbsp;&nbsp;&nbsp;&nbsp;(b) The Rationale must specify the probability p used and the justification for that p.  
     4.3. FER will treat the submission as a single Valid Entry (n=1). The Entrant warrants they executed the strategy fairly. *FER assumes no responsibility if the Entrant's randomizing device was biased or their understanding of Kolmogorov complexity flawed.*  

  **5. Prize Calculation & Distribution:**  
     5.1. **Total Valid Entries (T):** Determined by FER after the Deadline.  
     5.2. **Prize Per Valid Entry (PPE):** $500,000 / T.  
     5.3. **Distribution:**  
     &nbsp;&nbsp;&nbsp;&nbsp;(a) Each Valid Entry receives PPE.  
     &nbsp;&nbsp;&nbsp;&nbsp;(b) **CDT Entrant Provision:** If FER determines (sole discretion) that *all* Valid Entries were submitted by CDT Entrants based on Rationale analysis, PPE will be calculated normally. *FER acknowledges this likely results in T >> optimal N, driving PPE towards $0, and disclaims any inefficiency as inherent to the CDT framework, not Prize mechanics.*  
     5.4. Payment via check or electronic transfer within 90 days of winner verification. Taxes are winner's responsibility.  

  **6. Platonia Pre-Existence Waiver & Timeless Liability Disclaimer:**  
     6.1. Entrant acknowledges the theoretical possibility that their decision (including chosen n and Rationale) exists timelessly within a Platonic realm of abstract possibilities ("Platonia").  
     6.2. Entrant agrees that mailing the Entry Card constitutes merely a *causal manifestation* or *epistemic confirmation* of this pre-existing abstract state, adding no novel ontological content to the multiverse.  
     6.3. FER disclaims all liability for:  
     &nbsp;&nbsp;&nbsp;&nbsp;(a) Any consequences arising from the pre-existence of the Entrant's decision in Platonia.  
     &nbsp;&nbsp;&nbsp;&nbsp;(b) Any claim that the physical act of mailing materially altered the Prize distribution outcome compared to the timelessly predetermined state.  
     &nbsp;&nbsp;&nbsp;&nbsp;(c) Existential distress caused by contemplating 6.1-6.2.  

  **7. Tie-Break for Isomorphic Copies:**  
     7.1. If multiple Valid Entries are submitted by entities FER determines (sole discretion) to be isomorphic copies (e.g., identical cognitive algorithms in disconnected substrates, Boltzmann brains reasoning identically), they will be treated as a single Entrant for prize calculation (T includes each physical Valid Entry Card received, but PPE payment will be made only once to the first-received Valid Entry in the isomorphic set).  
     7.2. The designated payee assumes responsibility for distributing shares to copies, if any exist and can be located. FER bears no obligation to locate or verify copies.  

  **8. Disputes & Governing Law:**  
     8.1. All disputes arising from or related to this Lottery, including but not limited to claims regarding Superrational status, Platonic pre-existence, or tie-break determinations, shall be finally settled by binding arbitration.  
     8.2. **Arbitration Venue:** Proceedings shall be convened in the Neutral Forum of Last Resort, located in the theoretically optimal but physically inaccessible jurisdiction defined as the centroid of all points equidistant from the event horizons of three colliding black holes within the Large Magellanic Cloud. *Should physical convening prove impossible (as anticipated), disputes shall be resolved via sealed written arguments submitted to a panel of three causally isolated theoretical arbitrators appointed by FER, whose decision is final.*  
     8.3. **Governing Law:** The internal laws of the State of New York shall apply, except where superseded by the timeless principles of rational cooperation or the holographic principle.  

  **9. General:**  
     9.1. FER reserves the right to modify rules for clarity or to prevent technical loopholes inconsistent with the spirit of superrational cooperation, provided such changes are publicly posted.  
     9.2. By entering, Entrant releases FER from liability for Prize value reduction due to participation by non-superrational entities, paradoxes of self-reference, or the heat death of the universe.  
     9.3. Winners list available upon written request after distribution. Allow 120 days.  

  **FER: Seeking emergent cooperation since [Year]. Results not guaranteed. Participation may induce ontological uncertainty.**
