  **Introduction**
  This document represents the joint statement of [Camp A representative] and [Camp B representative], resulting from an adversarial collaboration facilitated by [facilitator]. The collaboration addresses the interpretation of a physical implementation of the Chinese Room thought experiment, conducted as part of the [grant name] project. Both parties agree on the following descriptive framework and factual claims about the experiment, while disagreeing on key philosophical interpretations. The vocabulary of Darwinian, Skinnerian, Popperian, and Gregorian creatures is used as a neutral descriptive language.

  **Apparatus Description**
  The Chinese Room system consists of the following components:
  - **The operator**: A monolingual English-speaking statistics graduate student. When performing the task, the operator acts as a Skinnerian creature: he executes the fixed rules provided in the English procedure manual and the rulebook, without internal hypothesis generation about the meaning of the symbols.
