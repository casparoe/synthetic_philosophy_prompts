answer: |-
  ### Thought Experiment: The Rental Car's "Excessive Dirt" Fee  
  A rental car company charges a customer a $200 "excessive dirt" cleaning fee upon return. The customer disputes this, triggering arbitration. The contract states the fee applies only if the car *truly* has "excessive dirt," and crucially, if the arbitrator deems the dirt level *borderline* (i.e., neither clearly excessive nor clearly acceptable), the company must refund the fee *and* pay a $50 penalty for wrongful charging. Evidence includes the car’s actual state (e.g., light mud splatters on lower panels, clean upholstery, dusty dashboard) and a linear series of 100 comparison cars graded by dirtiness: Car 1 (spotless) to Car 100 (filthy). The disputed car is Car 35. In the series:  
  - Cars 1–30 are *clearly acceptable* (minimal dirt).  
  - Cars 31–40 exhibit a gradual shift: adjacent pairs (e.g., Car 31 vs. 32) are indistinguishable in dirtiness, but comparisons across the range (Car 31 vs. Car 40) reveal clear differences. Cars 31–35 are slightly dirtier than Car 30 but cleaner than Car 41.  
  - Cars 41–60 are *clearly borderline*—arbitrators consistently rule "uncertain" for these.  
  - Cars 61–100 are *clearly excessive* (heavy grime).  
  Car 35’s status is ambiguous: it resembles Car 30 (acceptable) in some contexts (e.g., under bright light) but Car 41 (borderline) in others (e.g., in shadow). The arbitrator must decide: (1) Is the dirt "excessive"? (2) If not, is it *borderline*? The penalty hinges on (2): if borderline, the customer gets $250 ($200 refund + $50); if clearly acceptable, only $200; if excessive, $0.  

  ### Analysis of Vagueness Theories  
  1. **Epistemicism**: There is a sharp, unknowable fact. Car 35 either objectively has excessive dirt or not, and it objectively is or isn’t borderline. The arbitrator’s uncertainty reflects human ignorance, not indeterminacy. If Car 35’s dirt level objectively falls just below the hidden "excessive" threshold, it is *clearly acceptable*—no penalty. If it objectively straddles the threshold, it is *borderline*—penalty applies. The outcome is fixed but inaccessible.  
  2. **Supervaluationism**: "Excessive dirt" is vague, so truth requires truth across all *admissible precisifications* (sharp boundaries for "excessive").  
     - **First-order**: For Car 35, some precisifications classify it as "excessive," others as "not excessive." Thus, "excessive" is *neither true nor false* (not supertrue/superfalse).  
     - **Second-order (the wrinkle)**: "Borderline" means a car is neither supertrue nor superfalse. For Car 35, *admissible precisifications disagree on whether it is first-order borderline*. Some include it in the borderline set (Car 41–60), others exclude it (placing it in 1–30). Thus, "Car 35 is borderline" is *itself neither supertrue nor superfalse*—a second-order vagueness. The arbitrator faces indeterminacy about indeterminacy.  
     - **Outcome**: Since "excessive" isn’t supertrue, the fee is refunded. But the penalty requires "borderline" to be supertrue—which it isn’t. Thus, the customer gets only $200.  
  3. **Contextualism**: Meaning depends on arbitration context (e.g., which cars are compared). If the arbitrator contrasts Car 35 with Car 30, "excessive" seems false; if with Car 41, it seems indeterminate. Context could fix Car 35 as borderline (invoking penalty) or not. But with second-order vagueness, context may not resolve whether Car 35 is "borderline," leading to arbitrary outcomes.  

  ### Key Feature and Critiques  
  - **Feature doing the work**: The **penalty for borderline cases** creates distinct outcomes for "borderline" (refund + penalty) vs. "clearly acceptable" (refund only). Without it, second-order vagueness wouldn’t matter—both cases yield a refund.  
  - **Epemicist attack**: The setup assumes vagueness is intrinsic, but epistemicists argue the series merely *appears* continuous due to coarse measurement. In reality, dirt is quantized (e.g., dirt particles), so boundaries are sharp. Car 35’s dirt level is determinate; the "gradual shift" in Cars 31–40 is an illusion of perception. The penalty clause is unworkable because "borderline" has no objective basis—it’s an artifact of human ignorance.
