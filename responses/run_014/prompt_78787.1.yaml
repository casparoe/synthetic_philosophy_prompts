answer: |-
  ### The practice, restated  
  Iterative elimination of strictly dominated strategies (IESDS) is a standard solution concept. A strategy for a player is strictly dominated if another strategy (or a probabilistic mixture of their other strategies) yields a strictly higher payoff against *all possible* combinations of opponents' strategies. The procedure iteratively removes all such dominated strategies from consideration. Rational players, knowing their own payoffs and believing opponents are rational, should never play dominated strategies. After each removal, the game is re-examined for newly dominated strategies until no further eliminations are possible. The surviving strategies constitute the solution. This is presented as following solely from the premise that rational players avoid strictly inferior choices.  

  ### What it strictly presupposes  
  **1. Rationality and its knowledge:**  
  IESDS requires more than individual rationality; it demands *common knowledge of rationality* (CKR). A player eliminates a strategy dominated given the *current* strategy set, but this set shrinks iteratively. For the first elimination, each player need only know their own rationality: they avoid strategies dominated within the full game. For subsequent rounds, Player A must know Player B is rational to assume B won’t play a strategy dominated in the first round. For the third round, A must know that B knows A is rational, and so on. Finite iterations imply finite depths of mutual knowledge, but unbounded elimination requires full CKR. Rationality here is *instrumental*: players maximize expected utility given beliefs. Crucially, it presupposes rationality in *action* (choosing undominated strategies) grounded in *belief* (that opponents are rational and hence won’t play dominated strategies).  

  **2. Mixed strategies:**  
  Admitting dominance by mixtures commits IESDS to interpreting mixed strategies as *deliberate randomizations* by the player being dominated. When we say a pure strategy is dominated by a mixture of a player’s *own* strategies, the mixture represents an action plan involving explicit randomization (e.g., flipping a coin). It cannot coherently represent opponents’ uncertainty about that player’s choice. Opponents’ uncertainty is irrelevant when testing whether *this player’s* strategy is dominated: the comparison is between the player’s pure strategy and their alternative mixed strategy, holding opponents’ actions fixed across comparisons. The mixture must be a feasible act available to the player.  

  **3. Value and payoffs:**  
  IESDS strictly presupposes *cardinal, expected-utility-measurable payoffs*. Comparing a pure strategy to a mixture requires evaluating lotteries over outcomes. A pure strategy yields a certain outcome profile given opponents’ strategies; a mixture yields a lottery over outcome profiles. Declaring the mixture "strictly better" requires the player to rank these lotteries via expected utility (EU). Ordinal rankings are insufficient: EU’s linearity in probabilities is essential to ensure that if a strategy is dominated by a mixture, it is worse *for all weightings* of opponents’ strategies. This commits the practice to von Neumann-Morgenstern (VNM) rationality: players have cardinal utility functions unique up to affine transformations, enabling consistent comparisons of risk. Goods must be comparable in a way that supports trade-offs under uncertainty.  

  ### What it merely fits  
  The practice is compatible with rival interpretations of *undominated* mixed strategies. Once elimination concludes, surviving mixtures can be viewed either as deliberate randomizations *or* as representations of opponents’ uncertainty (epistemic view). IESDS also fits both subjective and objective interpretations of probability: players may use beliefs (subjective priors) to assess dominance, but the VNM framework accommodates either. It is neutral on determinism: players may be seen as consciously randomizing or as having their choices determined by unmodeled idiosyncrasies. While CKR is required, the procedure doesn’t specify *why* players are rational—it could arise from evolution, learning, or deliberation. It is agnostic on whether utilities reflect true "goods" or mere behavioral tendencies.  

  ### Where it pulls apart  
  The presuppositions create tension in two areas:  
  - **Mixed strategy duality:** The procedure demands that mixtures used to dominate a player’s own strategies are acts of randomization, yet surviving mixtures (e.g., in Nash equilibria) are often explained epistemically as opponents’ uncertainty. This dual role is inconsistent *within the procedure itself*. When Player A’s mixture dominates their pure strategy, it must be a deliberate randomizing act. But if Player B later eliminates a strategy because it is dominated against A’s *surviving* mixture, B treats A’s mixture as a probability distribution representing B’s uncertainty about A’s choice. The same mathematical object is forced into two incompatible roles: active randomization for the dominated player, passive uncertainty for opponents.  
    
  - **Rationality and belief:** IESDS assumes players believe opponents won’t play dominated strategies. But if a strategy is dominated only by a mixture, and mixtures are deliberate randomizations, players must believe opponents *will randomize when beneficial*. This blends belief in rationality with belief in precise optimizing behavior, including randomization—a demanding cognitive requirement. Yet the procedure’s justification ("no rational player would...") downplays this complexity.  

  ### The implicit theory  
  The implicit theory is that players are VNM-rational expected utility maximizers who deliberately randomize when advantageous, and this is common knowledge. Beliefs and actions are intertwined: players act rationally given beliefs about others’ rationality, which justifies iterated reasoning. Mixed strategies are primarily *actions* (randomizations), though their role in opponents’ minds slips into an epistemic interpretation. Cardinal utilities are foundational, enabling lottery comparisons. This theory is internally coherent *only if* we accept the dual role of mixtures: as acts for the player randomizing, and as beliefs for others. While instrumentally effective, this duality is philosophically strained.  

  ### If the load-bearing presupposition goes  
  **If cardinal utilities are abandoned:**  
  IESDS could only use pure-strategy dominance, as ordinal payoffs cannot rank mixtures. The procedure collapses to iterative pure-dominance elimination, yielding weaker solutions (e.g., in "Matching Pennies," no strategies are purely dominated, but mixtures dominate). Teaching would emphasize that dominance by mixtures is invalid without VNM utilities, restricting applicability to EU-maximizing players.  

  **If mixtures are not deliberate acts:**  
  Suppose mixtures can *only* represent opponents’ uncertainty. Then a player cannot be said to "choose" a mixture to dominate their pure strategy—only pure strategies are feasible actions. IESDS could eliminate strategies dominated by pure strategies only. Mixed strategies might still emerge in the solution as beliefs, but they couldn’t drive elimination. Teaching would stress that domination requires a *single* better pure strategy, not a mixture.  

  **If CKR is relaxed:**  
  Without CKR, only one round of elimination occurs: players remove strategies dominated in the full game, but no further. Solutions expand significantly (e.g., in the "Prisoner’s Dilemma," both players might retain cooperation if they doubt the other’s rationality). Teaching would frame IESDS as requiring explicit assumptions about mutual knowledge.  

  In all cases, the procedure’s scope shrinks, and instructors must clarify that the "standard" justification silently leans on specific, load-bearing premises—especially the interpretation of mixtures and cardinal utilities. Omitting these renders the common explanation ("never play a dominated strategy") insufficient.
