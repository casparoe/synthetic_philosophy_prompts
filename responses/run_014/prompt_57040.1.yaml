prompt: |-
  I teach an upper-level seminar on probability and legal evidence — sixteen students, one ninety-minute session. They know Bayes, and they assume the reference class problem is a technicality that careful people dissolve by simply choosing the obvious class. Design an in-class game that makes them feel otherwise, built on a stylized version of a real sentencing dispute: a courier arrested at an airport carrying a measured quantity of heroin, whose sentence turns on estimating what he carried on earlier trips for which there is no direct evidence, and where the prosecution offers frequencies for couriers of the same nationality arrested at the same airport during the same years.

  Give every team the same case file, but deal each team a different selection principle — one must use the widest class for which reliable statistics exist, one must narrow to the smallest class that reflects everything known about this particular man, one may choose freely but must state and defend a criterion of relevance — and require each team to commit publicly to a probability before anything is revealed. Score by calibration across several rounds, so that hedging and bluffing lose. The collision I want them to run into themselves: all three principles are respectable, they yield incompatible answers to the same question, and any rule for choosing among them must presuppose the relevance judgment it was supposed to supply.

  Include rules and materials, a point scheme needing no money, a timeline, a debrief mapping moments of play onto those three collisions, what will predictably go wrong on a first run (I expect teams to average across classes, or to invent classes absent from the deck — tell me whether to permit that), and a frank note on which feature of the problem the game cannot reproduce.
reasoning: |-
  Okay, let me start by understanding what the user is asking for. They teach an upper-level seminar on probability and legal evidence. Their students know Bayes' theorem but see the reference class problem as a minor technicality that can be resolved by choosing the "obvious" class. The user wants an in-class game to challenge this view, using a real-world scenario about drug sentencing where different reference classes lead to different probability estimates.

  First, I need to design a game that highlights how different selection principles for reference classes yield incompatible results. The user mentioned three teams: one using the widest reliable class, one the narrowest specific class, and one choosing freely but defending their relevance criterion. The key is to make the students experience the conflict themselves through gameplay.

  The core mechanics should involve teams committing to probabilities based on their assigned selection principle before seeing the true values. Scoring by calibration ensures that hedging is penalized, encouraging honest estimates. I should think about how to structure the rounds. Multiple rounds with varying case details (e.g., different amounts of heroin, different defendant characteristics) would show how reference classes affect estimates differently each time.

  Materials needed include case files for each round, selection principle cards for each team, and calibration scoring sheets. The case files need to have base statistics (e.g., arrest data for different nationalities, airports, years) and defendant specifics (age, method, etc.). Each round introduces a new detail to challenge their reference class choices.

  I anticipate some issues. Teams might average across classes or invent new classes not in the materials. The user asked whether to allow this. I think averaging should be prohibited because it avoids the dilemma, but inventing classes could be permitted if justified, as it mirrors real-world relevance arguments. However, the game should emphasize that they must stick to their assigned selection principle.

  During debriefing, mapping game moments to the three collisions is crucial. For example, when teams defend their chosen class, it shows that relevance criteria are subjective. The public commitment forces them to confront that different principles lead to different answers. The calibration scoring reveals that no single approach is consistently correct.

  A limitation is the game's inability to simulate the real-world consequence of these probability estimates, like sentencing outcomes. The stakes in the game are points, not freedom, which might affect how seriously students engage. Still, the calibration scoring adds enough pressure to mimic the need for accuracy.

  Timeline-wise, the 90-minute session needs careful allocation: intro (15 min), three rounds (45 min total), scoring (10 min), debrief (20 min). Keeping rounds to 10 minutes each ensures all teams commit simultaneously without overrunning.

  Predictable problems: teams struggling with narrow classes due to sparse data might try to use wider classes. Enforcing the selection principle strictly is key. Also, some might not understand calibration scoring; a quick explanation with examples before starting will help.

  Finally, the frank note should acknowledge that the game simplifies the reference class problem by providing predefined classes, whereas in reality, defining relevance is more complex and contested without clear data.
answer: |-
  Here’s a complete game design to confront the reference class problem head-on. It forces students to experience the *inescapable subjectivity* of "relevance" when choosing reference classes.

  **Game Title:** *The Courier's Dilemma*

  ### **Learning Objective**
  Students will viscerally grasp that **"obvious" reference classes are contestable, yield conflicting probabilities, and require circular relevance judgments**.

  ### **Core Structure**
  - 3-4 rounds of probability estimation for a courier’s historical heroin quantity  
  - 3 teams (5-6 students each) with fixed selection principles  
  - Public commitment to probabilities → calibration scoring  
  - Minimal materials, zero financial cost  

  ---

  ### **Materials**  
  1. **Case File (Identical for all teams, per round):**  
     - *Defendant:* "Ali Bahar, 28yo Iranian national. Arrested at Istanbul Airport (IST) with 1.2kg heroin. Charged based on *total* smuggled (past 4 trips). No direct evidence of past loads."  
     - *Prosecution Data:*  
       - All couriers at IST (2019–2023): Avg = 1.0kg (SD 0.4kg, n=120)  
       - Iranian couriers at IST: Avg = 1.5kg (SD 0.3kg, n=30)  
       - Couriers using same concealment method (shoes): Avg = 1.8kg (SD 0.2kg, n=15)  
       - *Plus 1 unique "narrow class" clue per round (e.g., Round 1: "Same recruiter network", Avg=2.0kg, n=5)*  

  2. **Selection Principle Cards (Dealt once at start):**  
     - **Team A (Widest):** "You MUST use the widest reliable class (largest n). Defend its adequacy."  
     - **Team B (Narrowest):** "You MUST use the narrowest class reflecting *specific* traits. Defend why wider classes ignore key details."  
     - **Team C (Free Choice):** "Choose ANY class. State a *criterion of relevance* and why it’s superior."  

  3. **Calibration Scoring Sheet (Projected):**  
     | Probability Bucket | Range | Points if true value in range |  
     |-------------------|-------|-------------------------------|  
     | Low               | <1.0kg | 20 - \|estimate - truth\| x 10 |  
     | Medium            | 1.0–1.5kg | 25 - \|estimate - truth\| x 10 |  
     | High              | >1.5kg | 20 - \|estimate - truth\| x 10 |  
     *Highest team score per round wins 3pts, 2nd: 2pts, 3rd: 1pt. Total points win.*  

  ---

  ### **Timeline (90 mins)**  
  1. **Intro (10 mins):** Explain rules, scoring, and the legal stakes (sentence depends on total quantity).  
  2. **Round 1 (20 mins):**  
     - Teams review case file → 10 mins debate → **publicly commit** to probability (e.g., "We estimate 1.6kg").  
     - Reveal "true" value (e.g., 1.7kg) → record scores.  
  3. **Rounds 2 & 3 (20 mins each):** New case files with shifted stats (e.g., Round 2: narrow class = "first-time couriers", avg=0.8kg; Round 3: "flights from Afghanistan", avg=2.2kg).  
  4. **Scoring & Debrief (20 mins):** Crown winners, then dissect collisions.  

  ---

  ### **Predictable Problems & Mitigation**  
  - **Averaging classes:** **FORBID IT.** Rules: "You *must* pick ONE reference class. No hybrids."  
  - **Inventing classes:** **ALLOW BUT RESTRICT.** "You may *only* use classes in the file *or* propose *one* new class per round with a *defended relevance criterion*." (This mirrors legal practice).  
  - **Narrow-team paralysis (tiny n):** Expected! They must still commit. Forces discussion of sparse-data risks.  
  - **Free-choice team dithering:** Enforce strict 10-min debate timer.  

  ---

  ### **Debrief: Mapping Game → Reference Class Collisions**  
  1. **Commitment Phase:** Teams argue relevance ("Nationality matters!" vs. "Concealment method is predictive!").  
     → *Collision 1: "Respectable principles yield incompatible numbers for the same question."*  
  2. **Score Reveal:** No team consistently wins. Narrow class may win Round 1, lose Round 2.  
     → *Collision 2: "No principle is reliably 'correct'—accuracy depends on unknowable truths."*  
  3. **Free-Choice Team’s Defense:** "We chose class X because Y is *relevant*..."  
     → *Collision 3: "Your relevance criterion *presupposes* what makes a class valid—it doesn’t solve the problem, it restates it."*  

  ---

  ### **Frank Limitation Note**  
  *"The game cannot reproduce the* **moral weight** *of real sentencing. Here, misestimation costs points; in court, it costs years of freedom. This abstract safety may dull the ethical stakes, but it sharpens the epistemic dilemma."*  

  ### **Why This Works**  
  - **Calibration scoring** kills bluffing: Overconfident teams lose points fast.  
  - **Forced public commitment** creates accountability.  
  - **Varying "truths"** prevent teams from clinging to one strategy.  
  - **Teams experience their own reasoning** as the source of conflict—not flawed data.  

  This transforms an abstract "technicality" into a lived paradox. By round 3, they’ll see the reference class problem as a foundational quagmire—not a nuisance.
