prompt: |-
  I run the disagreement reviews at a mid-size reinsurance firm — whenever two of our teams give materialy different probability estimates for the same risk (a pandemic loss year, a specific counterparty defaulting within five years, whatever), my job is to figure out whether we can pool them into one number or whether the difference needs to go up the chain. I recently got interested in Aumann's agreeing-to-disagree result and the whole "common prior assumption" debate behind it — the idea being that if two rational parties have common priors, then once they've shared their evidence they shouldn't still disagree, so persistent disagreement is either unshared information or a difference in priors themselves. I want that operationalized. Please write a procedure my analysts can run in a single afternoon meeting with both teams present: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in "pool the estimates" versus "escalate, because this is a prior-level difference, not an info-level one," and — this matters — which steps are honestly just judgment calls dressed up as a checklist. Then run it on two cases: (1) our epidemiology team puts 12% on a major pandemic loss year and our cat-modeling team puts 7%, and probing reveals they're feeding off different base datasets neither can fully articulate; (2) two veteran underwriters who have sat in the same meetings and seen all of each other's evidence still disagree 8% vs 25% on a counterparty defaulting, because one of them thinks the whole credit-rating framework is broken post-2008 and the other thinks that's paranoia. Include at least one case where the procedure gives an answer I won't like, and say plainly where the procedure will misfire.
reasoning: |-
  We are designing a procedure based on Aumann's agreement theorem to resolve disagreements between two teams. The key idea is that if both teams share a common prior and have common knowledge of each other's evidence, they should converge to the same posterior estimate. Persistent disagreement suggests either unshared information or differing priors.

  The procedure will have the following steps:

  1. **Step 0: Preparation**
     - Both teams prepare to share their estimates and the key evidence backing them. They should also be ready to articulate their reasoning.

  2. **Step 1: State Estimates and Key Evidence**
     - Each team states their estimate and the 1-3 most critical pieces of evidence that led to that estimate.
     - **Sufficient answer**: Each team must clearly state their estimate and the key evidence. If they cannot articulate the evidence (e.g., relying on a black-box model or intuition without clear factors), note that as a red flag.

  3. **Step 2: Share Evidence and Reasoning**
     - Teams share the evidence they have and explain how they incorporated it into their estimate. They should also share any models or methods used.
     - **Sufficient answer**: Both teams must share all the evidence they used and explain their reasoning. If one team has evidence the other did not consider, that evidence is now shared.

  4. **Step 3: Reconcile Evidence and Update**
     - Ask each team: "Given the evidence shared by the other team, would you change your estimate? If so, to what?"
     - If both teams update and converge to the same estimate (or within an acceptable range, e.g., 1-2% apart), then we can pool the estimates.
     - **Sufficient answer**: Each team must provide an updated estimate after considering the other team's evidence. If they do not update, they must explain why.

  5. **Step 4: Examine the Prior**
     - If disagreement remains, probe whether the teams started with different initial assumptions (priors). Ask: "What would your estimate have been before seeing any of this specific evidence? What baseline or default assumption did you start from?"
     - **Sufficient answer**: Each team must articulate their prior. If they cannot, then it's a judgment call (and likely a red flag for differing priors).

  6. **Step 5: Common Prior Check**
     - Ask: "If we had no evidence about this specific risk, what would your estimate be? (i.e., what is your base rate for this class of risk?)"
     - If the answers are similar, then the disagreement is likely due to unshared evidence or different interpretations of the same evidence. If they are different, then the teams have different priors.
     - **Sufficient answer**: Both teams must state a base rate for the risk class. If they differ by more than a small tolerance (e.g., 2-3%), then we have a prior-level difference.

  7. **Termination Points**:
     - **Pool the estimates**: If at Step 3 the teams converge (or come close enough) after sharing evidence.
     - **Escalate**: 
       - If at Step 4 or 5 it becomes clear that the teams have different priors that cannot be reconciled (and the difference is material).
       - If at any step one team cannot articulate their evidence or prior (indicating a black-box or intuition that cannot be shared).

  **Judgment Calls Dressed as Checklist**:
     - Step 3: Deciding if the updated estimates are "close enough" (e.g., 12% and 7% updating to 10% and 9% might be acceptable, but 12% and 7% updating to 11% and 7.5% might not be). This is a judgment call.
     - Step 5: Deciding the tolerance for the base rate difference (e.g., 2% vs 5%) is a judgment call.

  Now, let's run the procedure on the two cases.

  ### Case 1: Pandemic Loss Year (12% vs 7%)

  - **Step 1**: 
     - Epidemiology team: 12% - Key evidence: Recent zoonotic spillover events, increased global travel, and a model of virus mutation rates.
     - Cat-modeling team: 7% - Key evidence: Historical loss data from the past 100 years, frequency of past pandemics, and their internal catastrophe model output.

  - **Step 2**: 
     - The teams share their datasets and models. However, neither can fully articulate the other's dataset because they are complex and proprietary. The epidemiology team's model incorporates recent scientific studies, while the cat-modeling team uses historical loss data.

  - **Step 3**:
     - Epidemiology team: "We didn't fully account for the historical loss data. We adjust to 10%."
     - Cat-modeling team: "We didn't consider the recent zoonotic events and increased travel. We adjust to 8.5%."
     - Updated estimates: 10% and 8.5% -> still a 1.5% gap.

  - **Step 4**:
     - Epidemiology team: "Our prior was 15% because we believe the world is becoming more prone to pandemics."
     - Cat-modeling team: "Our prior was 5% because historical data shows pandemics are rare."

  - **Step 5**:
     - Common prior check: 
        - Epidemiology: Base rate for pandemic loss year without specific evidence is 15%.
        - Cat-modeling: Base rate is 5%.
     - They differ by 10% -> material difference in priors.

  - **Conclusion**: Escalate because the difference is at the prior level. The teams have fundamentally different starting points.

  ### Case 2: Counterparty Default (8% vs 25%)

  - **Step 1**:
     - Underwriter A: 8% - Key evidence: The counterparty has an investment-grade credit rating, strong recent financials, and a solid business model.
     - Underwriter B: 25% - Key evidence: The counterparty has high leverage and is in an industry that is sensitive to economic downturns. Also, Underwriter B believes the credit-rating framework is broken post-2008.

  - **Step 2**:
     - Both teams have seen the same meetings and evidence. Underwriter B's key point is a systemic critique of the rating framework.

  - **Step 3**:
     - Underwriter A: "Even though I heard Underwriter B's critique, I trust the rating agencies and their methodology. I remain at 8%."
     - Underwriter B: "I understand Underwriter A's point, but I have seen multiple cases where ratings failed. I might adjust to 22% to account for the strong financials, but I still think the risk is high."
     - Updated estimates: 8% and 22% -> still a 14% gap.

  - **Step 4**:
     - Underwriter A: "My prior for an investment-grade company is 5%."
     - Underwriter B: "My prior for any company, regardless of rating, is 15% because I don't trust the ratings."

  - **Step 5**:
     - Common prior check: 
        - Underwriter A: Base rate for an investment-grade company is 5%.
        - Underwriter B: Base rate for any company (without considering rating) is 15% (and he discounts the rating entirely).
     - They differ by 10% -> material difference in priors.

  - **Conclusion**: Escalate because the difference is at the prior level (Underwriter B's distrust of the entire rating framework).

  ### Case 3: A Case You Won't Like

  Let's create a third case where the procedure might give an answer you won't like.

  **Scenario**: Two teams disagree on the probability of a major hurricane hitting a specific region: Team A says 10%, Team B says 15%. 

  - **Step 1**:
     - Team A: 10% - Key evidence: Historical data for the region shows a low frequency of major hurricanes.
     - Team B: 15% - Key evidence: A new climate model indicates increasing sea surface temperatures that could increase hurricane intensity and frequency.

  - **Step 2**: 
     - Both teams share their evidence. Team A's historical data is from the past 50 years. Team B's model is a cutting-edge but not yet fully validated model.

  - **Step 3**:
     - Team A: "We don't trust the new model because it hasn't been backtested. We remain at 10%."
     - Team B: "We think the historical data is less relevant due to climate change. We remain at 15%."

  - **Step 4**:
     - Team A: "Our prior for this region is 8% (based on long-term historical averages)."
     - Team B: "Our prior is 12% (because we believe climate change is increasing the risk)."

  - **Step 5**:
     - Common prior check: 
        - Team A: Base rate without specific evidence is 8%.
        - Team B: Base rate without specific evidence is 12%.
     - Difference: 4% -> which is material? (This is a judgment call: if your tolerance is 2-3%, then 4% is over; if 5% is acceptable, then it's under.)

  - **Conclusion**: If we set a tolerance of 3%, then 4% is over -> escalate. But if we set it at 5%, then we might try to pool. However, the procedure would typically escalate because the base rates differ. 

  **Why you won't like it**: The procedure escalates a case where the disagreement might be resolvable by having a third party validate the new climate model. But the procedure flags it as a prior-level difference because the teams have different baseline beliefs about climate change's impact. This might be frustrating because the issue is about the interpretation of new evidence, but the procedure sees it as a prior difference.

  **Where the Procedure Misfires**:
     - When the "prior" is actually a deeply held belief that is hard to change (like climate change skepticism) and the procedure cannot resolve it in one meeting.
     - When one team uses a complex model that cannot be fully explained in an afternoon, leading to an escalation even if the model is valid.
     - When the judgment call on "close enough" is too strict or too lenient.

  **Final Note**: The procedure is a structured way to surface the root cause of disagreement. It will not resolve every disagreement, but it will help in categorizing them and deciding when to escalate. It is most effective when teams can articulate their reasoning and evidence. When they cannot, it flags that as a problem.
answer: |-
  Below is a step-by-step procedure for your analysts to resolve disagreements, designed to operationalize Aumann's theorem. It distinguishes between "information-level" differences (solvable by sharing evidence) and "prior-level" differences (requiring escalation). The procedure assumes a single 2–3 hour meeting with both teams.

  ---

  ### **Disagreement Resolution Procedure**
  **Objective**: Determine if disagreement stems from unshared information or differing priors.  
  **Output**: Either (a) pool estimates, or (b) escalate due to prior-level differences.  
  **Key Judgment Calls**: Steps 3, 4, and 6 (marked with ⚖️).

  | Step | Question/Task | Sufficient Answer | Red Flags | Next Step |
  |------|--------------|-------------------|-----------|-----------|
  | **1** | **State estimates and key evidence sources**<br>Each team shares: (a) their estimate, (b) 1–3 critical evidence sources. | Clear articulation of estimates and data sources (e.g., "We used WHO outbreak data" or "Our model output based on seismic history"). | Vague sourcing ("industry intuition," "proprietary black box"). | Proceed to Step 2. |
  | **2** | **Share all evidence**<br>Teams exchange raw data, models, and reports. Ask: "Is any critical evidence still unshared?" | Full transparency: Both teams confirm all evidence is visible to the other. | Teams withhold data (e.g., "This dataset is internal-only"), or lack access to each other's sources. | ⚠️ **If evidence is unsharable, ESCALATE immediately** (prior-level difference likely).<br>Else, proceed to Step 3. |
  | **3** ⚖️ | **Update estimates with new evidence**<br>"Given the shared evidence, does your estimate change? If so, to what?" | Revised estimates from both teams. | Estimates don’t converge (e.g., Team A: 12% → 11%, Team B: 7% → 7.5%).<br>Teams dismiss evidence without justification. | If estimates converge (≤2% gap), **POOL**.<br>Else, proceed to Step 4. |
  | **4** ⚖️ | **Identify reasoning divergence**<br>"Walk us through how you weighted/interpreted [key evidence]. Where did the other team get it wrong?" | Specific critiques (e.g., "They overweighted historical data" or "Their model ignores climate trends"). | Subjective rejections (e.g., "Their model is flawed," no specifics).<br>Fundamental conflicts in interpreting evidence. | If reasoning gaps are bridgeable (e.g., miscalculation found), **POOL**.<br>Else, proceed to Step 5. |
  | **5** | **Test common prior assumption**<br>"If we had *no evidence*, what would your base rate be? What drives that baseline?" | Quantified base rates (e.g., "5% for pandemics based on 100-year history").<br>Clear drivers (e.g., "We assume markets are efficient"). | Inability to state a base rate ("It’s case-by-case").<br>Wildly different baselines (e.g., 3% vs. 20%). | Proceed to Step 6. |
  | **6** ⚖️ | **Synthesize or escalate**<br>Ask: "Is this disagreement driven by (a) unshared evidence, or (b) incompatible priors?" | Teams agree on the root cause. | Teams blame priors (e.g., "They ignore structural risks").<br>Mutual distrust in frameworks. | If unshared evidence: Return to Step 2.<br>If priors: **ESCALATE**. |

  ---

  ### **Case Applications**
  #### **Case 1: Pandemic Loss Year (12% vs. 7%)**  
  - **Step 1**:  
    - Epistemology team: 12% (key evidence: viral mutation models + recent zoonotic spillover data).  
    - Cat-modeling team: 7% (key evidence: historical catastrophe frequency database).  
  - **Step 2**:  
    - Datasets unsharable (proprietary models + undefined "industry sources").  
    - **RED FLAG → ESCALATE immediately**.  
  - **Why?** Unsharable evidence violates common knowledge assumption. This is a *prior-level difference* because teams trust incompatible data ecosystems.  

  #### **Case 2: Counterparty Default (8% vs. 25%)**  
  - **Step 1**:  
    - Underwriter A: 8% (key evidence: credit rating + financial statements).  
    - Underwriter B: 25% (key evidence: 2008-style leverage patterns).  
  - **Step 2**: All evidence shared (same meetings, same documents).  
  - **Step 3**:  
    - Team A: "Unchanged. Ratings are reliable."  
    - Team B: "Unchanged. Ratings are broken."  
  - **Step 4**:  
    - Team A: "They’re ignoring the rating agency’s model."  
    - Team B: "They’re naive about post-2008 realities."  
  - **Step 5**:  
    - Base rates: Team A: 5% (ratings-based prior). Team B: 15% ("assume ratings are useless").  
  - **Step 6**:  
    - Both teams agree: Disagreement stems from priors (trust in rating systems).  
    - **ESCALATE** (prior-level difference).  

  ---

  ### **Case 3: The Answer You Won’t Like**  
  **Scenario**: Two teams assess earthquake risk for Tokyo:  
  - **Team A (historical actuaries)**: 9% (based on seismic history).  
  - **Team B (AI modelers)**: 18% (based on machine learning predicting "silent quakes").  

  **Procedure Runthrough**:  
  - **Step 1**: Evidence shared (Team A: historical databases; Team B: AI output).  
  - **Step 2**: All data technically shared, but Team A can’t interpret the AI model.  
  - **Step 3**: Estimates unchanged (Team A: "AI is a black box"; Team B: "History is incomplete").  
  - **Step 4**: Reasoning clash: Team A demands model explainability; Team B calls this "anti-innovation."  
  - **Step 5**: Base rates: Team A: 10% (history-only prior). Team B: 3% (tech-driven prior; "AI finds risks humans miss").  
  - **Step 6**: Teams deadlock. Procedure says: **ESCALATE** (prior-level difference about the value of new methods).  

  **Why you won’t like it**: The procedure escalates a resolvable dispute. Team B’s model might be valid, but the checklist flags it as a "prior" conflict because Team A rejects novel evidence on principle. Result: Innovation gets bogged down in bureaucracy.  

  ---

  ### **Where the Procedure Misfires**  
  1. **False "Prior-Level" Flags**:  
     - When teams *could* align with more time/data, but the meeting forces escalation (e.g., Case 3).  
     - **Mitigation**: Allow one 24-hour recess for teams to audit each other’s evidence post-meeting.  

  2. **Misattributing "Judgment Calls"**:  
     - Steps 3/4/6 rely on subjective interpretations of "convergence" or "reasoning gaps." A biased facilitator could sway outcomes.  
     - **Mitigation**: Use a third-party moderator and pre-agreed convergence thresholds (e.g., ≤2% = pool).  

  3. **Black-Box Models**:  
     - If one team’s evidence is non-articulable (e.g., neural networks), the procedure defaults to escalation, even if the model is sound.  

  **Bottom Line**: This procedure surfaces *why* teams disagree but won’t resolve deeply held ideological splits. It works best when evidence is sharable and teams trust shared axioms. When priors clash, escalation isn’t failure—it’s clarity.
