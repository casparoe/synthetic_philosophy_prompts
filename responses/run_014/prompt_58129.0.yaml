  ## The Discontinuity Dilemma for Critical-Level Views

  This argument establishes that any impartial critical-level view with a positive critical level must either succumb to a variant of the Repugnant Conclusion (RC) or embrace an implausible discontinuity in moral value, using the stipulated sequence of worlds and definitions.

  **Definitions and Constraints:**
  1.  **Impartiality:** The moral value of a world depends *only* on the lifetime wellbeing levels of all individuals who exist within it. The identity of individuals is irrelevant; two worlds containing the same number of people at identical wellbeing levels have identical value, regardless of *who* those people are. Adding or removing a person at a given wellbeing level changes value solely based on that level and the critical level.
  2.  **Continuity (wrt individual wellbeing):** Infinitesimally small changes in an *individual's* lifetime wellbeing (holding all else constant) result in only infinitesimally small changes in the overall value of the world containing that individual. There are no "jumps" in value based on tiny variations in individual welfare.

  **The Critical-Level View and the Stipulated Sequence:**
  We consider a critical-level view where the value of a world \(W\) with population \(n\) and average wellbeing \(a\) is:
  \[ V(W) = n \times (a - c) \]
  where \(c > 0\) is the fixed critical level (here, \(c = 20\)).

  The sequence is:
  *   \(W_1\): \(n_1 = 2000\), \(a_1 = 100\) → \(V(W_1) = 2000 \times (100 - 20) = 2000 \times 80 = 160,000\)
  *   \(W_2\): \(n_2 = 4000\), \(a_2 = 98\) → \(V(W_2) = 4000 \times (98 - 20) = 4000 \times 78 = 312,000\)
  *   \(W_3\): \(n_3 = 8000\), \(a_3 = 96\) → \(V(W_3) = 8000 \times (96 - 20) = 8000 \times 76 = 608,000\)
  *   ...
  *   \(W_k\): \(n_k = 2000 \times 2^{(k-1)}\), \(a_k = 100 - 2(k-1)\)
  *   ...
  *   \(W_{50}\): \(n_{50} = 2000 \times 2^{49}\) (an enormous number ≈ 1.126e15), \(a_{50} = 100 - 2(49) = 2\) → \(V(W_{50}) = 2000 \times 2^{49} \times (2 - 20) = 2000 \times 2^{49} \times (-18) = -36,000 \times 2^{49}\) (a vast *negative* number)

  **The Argument:**

  1.  **Value of Early Worlds:** According to the critical-level formula, \(W_2\) (\(V=312,000\)) is significantly better than \(W_1\) (\(V=160,000\)). \(W_3\) (\(V=608,000\)) is better still. This pattern continues initially because the decrease in average wellbeing (\(-2\)) is small relative to the critical level (\(c=20\)), and the doubling population provides many more people whose wellbeing significantly exceeds \(c\) (e.g., wellbeing 98 vs. c=20). The formula readily ranks these early, larger, lower-average-wellbeing worlds as *better* than \(W_1\).

  2.  **The Trend and the Critical Level:** As we progress through the sequence (\(k\) increases), average wellbeing (\(a_k\)) steadily decreases towards and eventually below the critical level \(c=20\). Crucially, each step from \(W_k\) to \(W_{k+1}\) involves:
      *   A doubling of the population (a large numerical increase).
      *   A decrease of only 2 units in individual wellbeing (a stipulated tiny change).
      *   According to the critical-level formula, as long as \(a_k > c\), \(V(W_k) = n_k \times (a_k - c) > 0\). The value peaks and then begins to decline as \(a_k\) approaches \(c\), but remains positive until \(a_k < c\).

  3.  **The Impending Repugnance:** Consider a world \(W_m\) where \(a_m\) is *just above* the critical level, say \(a_m = 20 + \epsilon\) (where \(\epsilon\) is a very small positive number, e.g., 0.01). For sufficiently large \(m\), the population \(n_m\) will be enormous. The critical-level formula yields:
      \[ V(W_m) = n_m \times ((20 + \epsilon) - 20) = n_m \times \epsilon \]
      Because \(n_m\) is astronomically large (e.g., \(n_{30} ≈ 1.074e9\), \(a_{30}=100-2*29=42\); \(n_{40} ≈ 1.1e12\), \(a_{40}=100-2*39=22\)), even a tiny \(\epsilon\) results in a huge positive value \(V(W_m)\). This value will vastly exceed \(V(W_1) = 160,000\). For example, even at \(W_{40}\) (\(a=22 > 20\), \(n≈1.1e12\)):
      \[ V(W_{40}) ≈ 1.1e12 \times (22 - 20) = 1.1e12 \times 2 = 2.2e12 \]
      This is orders of magnitude larger than \(V(W_1) = 1.6e5\). According to the impartial critical-level formula, \(W_{40}\) (and worlds like it with wellbeing just above \(c\) and vast populations) is *much better* than \(W_1\). This is a clear variant of the Repugnant Conclusion: a world with an enormous population of people whose lives are stipulated to be *barely above* the critical level (lives barely worth *creating*, according to the view) is ranked as morally superior to a world with a small population of very flourishing people.

  4.  **The Dilemma:** The critical-level theorist faces a choice:
      *   **Option A: Accept the RC Variant.** Affirm that \(W_m\) (with wellbeing \(20+\epsilon\)) is indeed better than \(W_1\). This directly embraces the counterintuitive repugnant implication the view aimed to avoid, merely shifting it from lives barely worth *living* to lives barely worth *creating* relative to the critical level.
      *   **Option B: Reject the Ranking & Introduce Discontinuity.** Deny that \(W_m\) is better than \(W_1\). To do this while maintaining impartiality, the theorist must argue that the value calculation changes dramatically *precisely* when wellbeing dips below the critical level \(c\). This requires positing a **discontinuity**: for lives with wellbeing just above \(c\) (e.g., \(c + \delta\)), the value contribution is \((c + \delta) - c = \delta > 0\), no matter how small \(\delta\) is. However, for a life with wellbeing just below \(c\) (e.g., \(c - \delta\)), the value contribution must suddenly drop to \(0\) (or perhaps even become negative, but crucially, it jumps *down* discontinuously). Only this sharp break prevents the massive cumulative positive value \(n_m \times \delta\) from making \(W_m\) better than \(W_1\).

  5.  **The Implausibility of the Discontinuity:** This discontinuity between \(c + \delta\) and \(c - \delta\) is deeply problematic:
      *   **Violation of Continuity:** It directly violates the continuity constraint. An infinitesimal decrease in an individual's wellbeing (from \(c + \delta\) to \(c - \delta\)) causes a discontinuous *jump* in their contribution to world value (from \(\delta\) to \(0\) or less). The moral value "cliff" is massive relative to the tiny change in individual welfare.
      *   **Lack of Phenomenological Basis:** The stipulated difference in individual welfare between a life at \(c + \delta\) and \(c - \delta\) is negligible. If \(c=20\) represents a "minimally worthwhile life to create," the experiential difference between living at 20.01 and 19.99 is vanishingly small. Yet, the discontinuity implies that the life at 19.99 has *no positive moral worth to contribute* to the world, while the life at 20.01 contributes a tiny positive amount. This seems arbitrary and disproportionate; it attributes profound moral significance (the difference between having *any* positive worth and having *none*) to a difference in individual welfare too small to plausibly bear such weight.
      *   **Arbitrariness:** Defending why *this specific point* (c) warrants such a sharp break, unlike any other level of wellbeing, faces a significant justificatory burden. Why is the step from "barely above minimally worthwhile" to "barely below minimally worthwhile" morally catastrophic in a way the step from "flourishing" to "very well-off" is not?

  **Reply to the Threshold Objection:**

  The objection claims that a threshold for a life being "worth creating" can be morally significant even if the phenomenological difference across it is minor. While this captures an intuition about creation (creating a life barely worth living might be permissible but not obligatory, while creating a life below the threshold is impermissible), it fails to resolve the dilemma for overall world evaluation.

  1.  **Distinction between Permissibility and Value:** The threshold might mark a boundary in the *permissibility* of creating a life. However, the critical-level view concerns the *overall value* of worlds. The discontinuity objection targets how this value is *calculated*, specifically how the *magnitude* of contribution changes abruptly with a tiny change in welfare. Permissibility of creation is a separate question from the quantitative contribution an existing life makes to the world's goodness.
  2.  **The Value of Existence vs. Non-Existence:** While comparing existence to non-existence might involve a discontinuity (e.g., adding a life above c adds positive value, adding one below c adds negative value), this argument concerns the value *comparison between different existent lives/worlds*. Once lives exist, comparing the value of a world containing lives at \(c+\delta\) to a world containing lives at \(c-\delta\) reveals the discontinuity. The tiny experiential difference \(\delta\) cannot plausibly justify the enormous difference in moral contribution (from \(\delta\) to \(0\)) required to avoid the RC variant. The claim that a life at \(c-\delta\) contributes *nothing positive* to the world's value, while one at \(c+\delta\) contributes *something*, remains implausible given the stipulated minimal experiential gap. The threshold might explain why we shouldn't *create* the \(c-\delta\) life, but it doesn't plausibly explain why its existence contributes *zero* positive value compared to the almost identical \(c+\delta\) life once both exist.
  3.  **The Cumulative Problem:** Even if one grants *some* significance to the threshold, the objection doesn't address the core of the sequence argument: the *cumulative effect* of vast numbers of lives just above the threshold. If each such life contributes *any* positive amount \(\delta\), no matter how small, the sheer size of \(n_m\) forces \(V(W_m) > V(W_1)\). To deny this *requires* the implausible discontinuity at the individual level. The moral significance of the threshold for creation decisions doesn't automatically translate into a justification for this specific, sharp discontinuity in the quantitative *value contribution* of existing lives needed to block the RC variant.

  **Conclusion:**

  The stipulated sequence, under impartiality and continuity, demonstrates that an impartial critical-level view with a positive critical level \(c\) inevitably confronts a dilemma. Following the value calculations step-by-step forces the recognition that a world (\(W_m\)) with a vast population at wellbeing just above \(c\) must be ranked as better than the flourishing world \(W_1\), leading to a repugnant conclusion where barely-above-threshold lives are deemed superior to excellent ones. The only escape is to introduce a sharp discontinuity at \(c\), where a minuscule decrease in individual wellbeing from just above \(c\) to just below \(c\) causes a dramatic, discontinuous drop in that individual's contribution to world value. However, this discontinuity is implausible, as it attributes overwhelming moral significance to a phenomenologically negligible difference in welfare, violating continuity and appearing arbitrary. The objection that a creation threshold is significant despite minor experiential differences fails to justify this specific discontinuity in value contribution between existing lives, which is necessary to avoid the repugnant implication. Therefore, any such critical-level view remains vulnerable to a variant of the repugnant conclusion unless it embraces this implausible evaluative rupture.
