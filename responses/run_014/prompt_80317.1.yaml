  Then comes the crucial residue analysis where I map each claim to information theory. The clean mappings include: codon table as lookup, start/stop as control characters, wobble as degenerate decoding. The distortions involve the co-location of table and decoder in molecular machinery, the co-evolution problem, and the lack of true error correction. The unmappable elements include context-dependent translation rates and epigenetic modifications.

