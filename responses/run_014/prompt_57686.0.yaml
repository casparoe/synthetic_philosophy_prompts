prompt: |-
  I am recording secretary for a federation of roughly forty worker cooperatives, and I have been asked to prepare an internal review of our governance documents. Three features of the federation's practice puzzle me, and I want to know what they presuppose before I attempt to describe them.

  First, the three federation officers are elected by secret ranked ballot under an instant-runoff rule. The bylaw commentary on that election provides that if the final round is a tie the winner is drawn by lot, and it defends the lot on the ground that at that point no counting rule can be shown to be fairer than any other.

  Second, all substantive decisions are taken in open assembly by formal consensus. A facilitator states the proposal and tests the meeting; any single member may block, and a block halts the proposal and returns it to a working group with the blocker's reasons attached. A block is never put to a count and never overridden. Members are asked to say whether they can live with a proposal, not how strongly they prefer it, and the official record notes only the sense of the meeting — no tallies are recorded for consensus decisions.

  Third, the bylaws contain a fallback that they themselves treat as a failure: if a proposal has been through two rounds of revision and still cannot reach consensus, the assembly may adopt it on a seventy-five percent vote. In the federation's four decades this has happened four times, and on each occasion the officers issued a statement regretting that the assembly had been reduced to counting.

  So we count preferences and then pronounce the counting rule arbitrary at the margin; and elsewhere we refuse to count at all, treating a single dissent as decisive.

  What theory of the group's decision — of what a collective choice is, and of what makes one legitimate — does the consensus procedure presuppose? Does it presuppose that there is a single right answer to be discovered by deliberation, that members' preferences are material to be transformed rather than data to be aggregated, that legitimacy requires that every member could accept the outcome, or some combination of these? Which rival accounts does it thereby rule out, and does it rule them out or merely decline to engage them?

  Are the three practices consistent with one another? In particular, is the lot-drawing bylaw an admission that aggregation is underdetermined — and if so, does that admission undercut the assembly's confidence that consensus finds something rather than merely produces something? Does Arrow's impossibility theorem actually bear on the assembly's procedure, or does it fail to apply because the assembly never fixes a rule mapping profiles of individual preference onto outcomes? Be explicit about which of Arrow's conditions the consensus practice evades, and by what means.

  Finally, distinguish what the practice strictly presupposes from what it merely fits comfortably with; mark the places where it is philosophically underdetermined, so that several incompatible theories would license exactly the same procedure; and say concretely what would have to change in the bylaws and in the conduct of the assembly if the federation adopted the opposite view — that a group's decision is nothing over and above the output of a stated rule applied to members' expressed preferences.

  Lead with your bottom line in no more than three sentences, stating what you take these practices jointly to presuppose and whether they are consistent; then give the reconstruction. Keep the whole answer under 700 words, and do not append references or suggested reading.
reasoning: |-
  Hmm, this is a fascinating question about cooperative governance philosophy. The user is recording secretary for a federation of worker cooperatives and needs to analyze three seemingly contradictory governance practices: ranked-choice voting with lot-based tiebreakers, strict consensus decision-making, and a supermajority fallback treated as failure.

  The core tension they're observing is between systems that acknowledge preference aggregation difficulties (the voting/lot system) and systems that reject aggregation entirely (consensus). I need to unpack the philosophical underpinnings here. The consensus model clearly presupposes that legitimacy comes from universal acceptability rather than preference aggregation. It treats deliberation as transformative - not just counting existing preferences but creating new shared understandings.

  Interestingly, Arrow's theorem doesn't directly apply to consensus because consensus deliberately avoids establishing any complete preference ordering. By making each member a potential veto point, it escapes Arrow's conditions about unrestricted domain and non-dictatorship. The lot system in voting actually reinforces this worldview by acknowledging the arbitrariness of aggregation at the margins.

  These practices are consistent because they share a rejection of "counting" as legitimate decision-making. The supermajority fallback is framed as failure precisely because it abandons the ideal of universal acceptance. If the federation adopted pure preference aggregation, they'd need to eliminate veto power, record votes, and treat ties as procedural rather than philosophical problems.

  The user seems to want both practical guidance and theoretical clarity - they're probably preparing documentation that explains these practices to members. I should emphasize how the procedures cohere philosophically while acknowledging where ambiguity exists (like whether consensus "discovers" or "creates" agreements). The word limit means focusing on the most crucial distinctions.
answer: |-
  ### Bottom Line
  These practices jointly presuppose that legitimate collective choice requires transformative deliberation producing universal acceptability, not preference aggregation. They consistently reject voting as merely aggregating raw preferences, viewing consensus as discovering/shaping shared commitments. The lot-drawing admission doesn't undercut consensus, as consensus deliberately avoids aggregating fixed preferences and escapes Arrow’s conditions.

  ### Reconstruction
  **Theory of Collective Choice:** Consensus presupposes legitimacy requires *every member’s possible acceptance*, achieved by transforming individual preferences into shared commitments through deliberation. It rules out theories where legitimacy arises from aggregating *pre-existing* preferences (e.g., majoritarianism, utilitarianism) or pure proceduralism ("any rule’s output is legitimate"). Instead, it treats dissent as revealing the proposal’s illegitimacy *for the group*, not just the dissenter.

  **Consistency:** The practices cohere. The lot-drawing in elections admits *aggregation’s* arbitrariness (Arrow’s point), but consensus avoids aggregation entirely. Arrow’s theorem fails to apply because consensus evades:
  - **Unrestricted Domain:** Deliberation reshapes preferences, preventing fixed, conflicting rankings.
  - **Independence of Irrelevant Alternatives:** Consensus evaluates proposals holistically, not by comparing options.
  - **Non-Dictatorship:** A block resembles a veto, but is justified as upholding group integrity, not individual supremacy.

  The lot-drawing merely acknowledges aggregation’s limits *where aggregation is unavoidable* (officer elections), reinforcing the superiority of consensus. The supermajority fallback is a pragmatic failure clause, not a philosophical endorsement of counting.

  **Presuppositions vs. Compatibility:**
  - **Strictly Presupposed:** Legitimacy requires universal potential acceptance; raw preferences are mutable via deliberation; counting signifies deliberative failure.
  - **Philosophically Underdetermined:** Whether consensus "discovers" a pre-existing group will or "constructs" a new one; whether acceptability requires moral unanimity or merely pragmatic consent.
  - **Compatible But Not Required:** Communitarian ideals; certain discourse ethics; some theories of common good.

  **Opposite View Implementation:** Adopting pure preference aggregation would require:
  1. Replacing consensus with defined voting rules (e.g., majority) for all substantive decisions.
  2. Recording individual votes/tallies, not just "sense of the meeting."
  3. Overriding blocks via supermajority *without* treating it as failure.
  4. Justifying tie-breaking rules as procedurally fair, not arbitrary.
