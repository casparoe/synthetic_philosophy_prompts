  I notice the user's group has starkly different credences (0.6 vs 0.15) despite shared medical knowledge, suggesting value-weighting differences. The nursing student's low credence likely stems from frontline exposure to healthcare disparities. 

  For my analysis, I'll decompose into four key sub-questions:
  1) Consent quality under economic inducement 
