  Biggest pitfalls: 
  - Overestimating how much choice people actually have (poverty limits options) 
  - Confusing recklessness with reasonable risks taken under duress 
  - Medical determinism (assuming genetic=inevitable) 
  - Ignoring systemic barriers (e.g., undocumented workers can't access safety nets) 

  For the procedure: Need clear exit ramps to human judgment when evidence is contradictory or ambiguous. Should emphasize that step 1 (immediate need) overrides everything—no one starves over philosophical debates. 

