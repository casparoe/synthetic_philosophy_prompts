answer: |-
  Here’s a practical procedure for applying "luck egalitarian" principles in emergency assistance decisions, designed for frontline case managers. It includes ordered questions, evaluation criteria, clear exit points, and transparency about where judgment is unavoidable. I’ll then apply it to your three cases and end with key limitations.

  ---

  ### **"Choice vs. Luck" Assessment Procedure**  
  **Goal:** Determine if the emergency stems primarily from *bad luck* (compensate) or *deliberate risk/choice* (lower priority), while prioritizing immediate health/safety.

  #### **Step 0: Triage for Immediate Harm**  
  *   **Question:** "Is this person/family at risk of homelessness, starvation, severe medical harm, or violence within 48 hours?"  
  *   **Good answer:** "Yes" → **Skip assessment and provide immediate aid**. (Human judgment always applies here.)  
  *   **Stop/Handoff:** If "no," proceed to Step 1.  

  #### **Step 1: Identify the Immediate Crisis Trigger**  
  *   **Question:** "What specific event caused *this week’s* emergency request?"  
  *   **Good answer:** Concrete, recent event (e.g., "eviction notice," "sudden job loss," "medication ran out").  
  *   **Handoff:** If trigger is vague ("things piled up") → Human reviews full history.  

  #### **Step 2: Trace Causality to Luck or Choice**  
  *   **Question:** "Was this trigger caused by:  
      (a) An unforeseeable event outside their control?  
      (b) A consequence of a deliberate risk or choice?"  
  *   **Evaluation:**  
      - **Compensable (Bad Luck):** Natural disaster, sudden illness, layoffs, theft, documented policy violation by employer.  
      - **Non-Compensable (Choice):** Voluntary job quit without backup, spending on non-essentials, ignoring known rules.  
  *   **Judgment Note:** "Foreseeability" is subjective. Use evidence (e.g., employee handbook, medical records).  

  #### **Step 3: Assess Choice Quality**  
  *   **Question:** "If they made a choice, did they:  
      (a) Have reasonable alternatives?  
      (b) Understand the risks?  
      (c) Act under duress?"  
  *   **Good answer (for aid):**  
      - No alternatives (e.g., "quit job due to unsafe conditions"),  
      - Risk was obscured (e.g., employer hid policy),  
      - Duress present (e.g., "quit to care for dying relative").  
  *   **Stop/Denial:** If they had clear alternatives *and* understood risks *and* acted freely → **Deny aid** (e.g., gambled rent money).  
  *   **Handoff:** If evidence conflicts (e.g., "understood risks but had no choice") → Human decides.  

  #### **Step 4: Verify Mitigation Efforts**  
  *   **Question:** "Did they take reasonable steps to prevent or reduce harm *after* the trigger?"  
  *   **Good answer:** Sought community resources, applied for jobs, followed treatment plans.  
  *   **Judgment Note:** "Reasonable" depends on capacity (e.g., mental health, literacy). Never penalize for lack of internet access/transport.  

  #### **Step 5: Final Decision**  
  *   **Approve Aid:** Trigger was bad luck OR choice was reasonable/uninformed/coerced.  
  *   **Deny Aid:** Trigger resulted from reckless, fully informed, avoidable choice.  
  *   **Handoff:** All cases involving mental health, addiction, or ambiguous systemic barriers → Human review.  

  ---

  ### **Case Applications**  
  **Case 1: Single Dad Fired for "Unknown" Policy**  
  - **Step 1:** Trigger = sudden job loss.  
  - **Step 2:** Why fired? Policy violation → Potentially "choice."  
  - **Step 3:** Did he know the policy?  
    - *If employee handbook was provided* → **Deny** (assumed knowledge = choice).  
    - *If policy was undocumented/hidden* → **Approve** (bad luck: employer’s fault).  
  - **Handoff:** If handbook exists but he’s illiterate → Human reviews.  

  **Case 2: Woman with Chronic Illness (Family History)**  
  - **Step 1:** Trigger = medical bills/can’t work.  
  - **Step 2:** Cause = illness. Genetics ≠ choice → **Approve immediately**.  
  - **Judgment Note:** Even if lifestyle worsened it (e.g., smoking), acute crisis is compensable. Chronic management is separate.  

  **Case 3: Man Quit Job for Food Truck That Failed**  
  - **Step 1:** Trigger = business failure → lost income.  
  - **Step 2:** Cause = voluntary quit + business risk → **Potential deny**.  
  - **Step 3:** Assess choice quality:  
    - Did he research permits/market? *If no* → reckless choice → **Deny**.  
    - Did COVID/regulations change unexpectedly? *If yes* → bad luck → **Approve**.  
  - **Result:** Likely **DENIED** if he quit a stable job pre-pandemic for an unplanned venture. *This is the "unwanted outcome."*  
  - **Why?** High-risk, voluntary choice with foreseeable failure potential.  

  ---

  ### **What the Procedure CANNOT Do**  
  1. **Resolve Systemic Injustice:**  
     - E.g., A Black man "choosing" to quit a job due to racism. Procedure sees "voluntary quit," but human must weigh oppression as duress.  
  2. **Handle Value Conflicts:**  
     - Is quitting to care for a sibling’s kids "reckless" or "moral"? Procedure defaults to "choice," but humans can override.  
  3. **Assess Long-Term "Deservingness":**  
     - A recovering addict relapsing: Procedure may flag "choice," but recovery context requires holistic review.  
  4. **Fix Resource Gaps:**  
     - If aid is denied due to "choice" but no other resources exist, humans may still intervene ethically.  

  **Final Note:** This framework reduces arbitrariness but doesn’t eliminate discretion. It works best when paired with:  
  - **Staff training** on implicit bias/unpaid labor (e.g., caregiving).  
  - **Appeals process** for denied applicants.  
  - **Community partnerships** to support "choice"-denied cases (e.g., job programs).  

  The core tension remains: **Punishing "bad choices" often penalizes poverty itself.** Use this to filter cases, but always retain humanity.
