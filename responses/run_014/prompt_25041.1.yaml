prompt: |-
  I've been reading around the meta-problem of consciousness — roughly, the problem of explaining why we think there is a hard problem of consciousness in the first place — and I keep finding that people propose theories of the meta-problem without first being clear about what such a theory is supposed to explain. Before I go any further, I want the desiderata: what must an adequate theory of the meta-problem of consciousness deliver? I mean the full specification — which phenomena it must account for, which judgments and intuitions about consciousness it must explain the presence or absence of, which distinctions it must respect, which empirical results from psychology and neuroscience it cannot contradict, and which explanatory traps it must avoid (for example, explaining our sense that consciousness is mysterious in a way that itself presupposes the very mystery it is meant to explain away). For each requirement, give me the case or consideration that makes it a requirement rather than a mere preference. Then tell me which of these desiderata are non-negotiable — things any theory of the meta-problem simply has to get right — and which are more like commitments of a particular camp (illusionists, realists, phenomenal concept strategists, and so on) that a theory could reasonably reject. I also want to know whether any pair of these desiderata are in tension with each other — whether satisfying one makes it harder or impossible to satisfy another. Finally, tell me which single requirement does the most work in excluding candidate theories, and why. I am less interested in a scorecard of existing views than in the criteria themselves, though a brief indication of where the main approaches stumble would help me see why the criteria matter. Please also tell me which assumptions your list of desiderata depends on — for instance, assumptions about whether the hard problem is real or illusory — and how the list would change if those assumptions were dropped. Respond in the style of an expert writing to a colleague. Think very carefully before answering, and please write in continuous prose only: no headings, no bullet points, no bold text, no tables — just paragraphs, the way you would write an email or a letter.
reasoning: |-
  Okay, the user is diving deep into the meta-problem of consciousness, specifically asking for a rigorous set of desiderata that any adequate theory must satisfy. They want clarity on what such a theory must explain, including phenomena, judgments, empirical constraints, and pitfalls to avoid. They also want to know which criteria are non-negotiable versus camp-specific, potential tensions between desiderata, and which requirement is most exclusionary.  

  Hmm, this is a sophisticated request. The user is clearly well-versed in the literature but frustrated by the lack of explicit standards. They’re not just asking for a list—they want the *why* behind each desideratum and how they interact. The mention of "explanatory traps" suggests they’re alert to circularity risks, like theories that covertly presuppose consciousness while trying to explain the illusion of its mystery.  

  Right, first I need to establish the core phenomena a meta-problem theory must address. The obvious one is our intuition of mystery—why consciousness *feels* inexplicable. But it can’t stop there. The user wants the full spread: why we believe consciousness has qualitative properties (qualia), why it seems unified, why we think it’s private, and so on. Each of these needs a grounding in real-world cases. For example, the "explanatory gap" (Levine’s point about water vs. H₂O not feeling analogous to pain vs. C-fibers) *requires* explaining why reductive explanations feel unsatisfying for consciousness but not for other phenomena.  

  Then there are judgment asymmetries. Jackson’s Mary case is key here: why do we intuit she learns something new upon seeing red? A meta-problem theory must explain that intuition without itself assuming phenomenal knowledge is irreducible. Same for zombie intuitions—why Chalmers’ philosophical zombie seems conceivable. These aren’t just quirks; they’re central to the hard problem’s perceived intractability.  

  Empirical constraints are non-negotiable. Any theory contradicting blindsight or binocular rivalry data is dead on arrival. But also, it can’t ignore cultural variance. If Westerners associate consciousness with the head while some Indigenous groups locate it in the heart, a theory claiming consciousness judgments are innate or universal must account for that—or better, explain the variance.  

  Ah, pitfalls. The big one is *using* consciousness to *explain* the sense of mystery. If a theory says, "We find consciousness mysterious because it’s fundamentally inexplicable," it’s circular. User called this out explicitly—it’s a trap they want avoided. Also, theories can’t ignore functional parallels. If a robot passed all behavioral tests for consciousness, we’d *still* doubt it has qualia. Why? That asymmetry needs explaining.  

  Now, tensions. Here’s a tricky one: explaining unity (why consciousness feels like a single stream) might require cognitive architectures that conflict with modular, fragmented processes shown in neuroscience. Or, explaining privacy might clash with empathy research showing we *do* reliably infer others’ states. A theory has to walk that tightrope.  

  The most exclusionary desideratum? Probably avoiding explanatory circularity. Many theories—especially realist-leaning ones—smuggle in phenomenal properties while pretending to explain them away. That’s why illusionists (Frankish, Dennett) push so hard on this: if your meta-explanation covertly relies on consciousness, it fails.  

  User also asked about assumptions. My list assumes the meta-problem is about explaining *illusions* of irreducibility. If we drop that and assume consciousness *is* irreducible, the desiderata shift. Suddenly, explaining why it *seems* mysterious isn’t the goal—instead, we’d need to explain why humans *correctly* detect its irreducibility. But that’s not the meta-problem as Chalmers framed it.  

  Finally, camp-specific commitments. Illusionists will demand a full reduction without residual mystery; realists might accept "proto-mystery" explanations. That affects how strictly we enforce desiderata like avoiding circularity. But the non-negotiables—addressing the core intuitions, respecting empirical data, avoiding logical traps—are shared. If a theory violates those, it’s not even in the game.
answer: |-
  An adequate theory of the meta-problem of consciousness must satisfy a rigorous set of desiderata to avoid triviality, circularity, or irrelevance. I'll outline the core requirements, their justifications, negotiability, tensions, and pivotal constraints. The framing assumes Chalmers' formulation: explaining why we *believe* there's a hard problem (i.e., why consciousness seems non-physical, mysterious, or irreducible), regardless of whether consciousness is ultimately physical or not. If we dropped this assumption—e.g., by assuming the hard problem is real—the desiderata would shift toward explaining why humans *accurately* detect irreducibility, but that’s not the meta-problem as conventionally defined.

  **Core Desiderata and Their Grounding:**  
  1. **Explain the Intuition of Mystery**: The theory must account for why states of consciousness (e.g., pain, seeing red) *feel* inexplicable in physical terms, unlike other phenomena (e.g., digestion). The *case* here is Levine’s "explanatory gap": we accept physical explanations for heat (molecular motion) but not for pain, despite analogous neurophysiological correlates. Failure here leaves the meta-problem unsolved.  
  2. **Account for Phenomenal Judgments**: It must explain why we assert that conscious experiences have intrinsic, private, qualitative properties ("qualia"). The Jackson’s Mary case is pivotal: why do we intuit that Mary learns something *new* upon seeing red, despite knowing all physical facts? This intuition drives the hard problem and must be addressed.  
  3. **Address Subjectivity and Privacy**: Explain why we believe conscious states are knowable only from a first-person perspective. Wittgenstein’s "beetle in a box" argument exemplifies this: we act as if others cannot fully grasp our pain. A theory ignoring this would fail to capture a core aspect of our folk psychology.  
  4. **Respect Unity and Perspectivalness**: Consciousness appears unified (a single "stream") and centered on a subjective point of view. Cases like split-brain patients—where unity breaks down yet subjects report coherent (but conflicting) experiences—demand explanation. Neglecting this risks overlooking structural features of our self-reports.  
  5. **Explain Asymmetries in Attribution**: We readily attribute consciousness to humans, hesitantly to animals, and deny it to simple systems (e.g., thermostats). The Gray-Hardcastle debate on "zombie intuitions" shows this asymmetry isn’t arbitrary; it reflects deep cognitive biases a theory must explicate.  
  6. **Fit Empirical Psychology/Neuroscience**: The theory cannot contradict robust findings (e.g., blindsight, where subjects deny seeing but respond to stimuli, revealing dissociations between awareness and function). Binocular rivalry experiments further show neural correlates of perceptual switching without conscious control. Contradicting such data renders the theory empirically inadequate.  
  7. **Avoid Circularity/Question-Begging**: The explanation cannot presuppose the very phenomenal properties it seeks to explain away (e.g., "we find consciousness mysterious because it *is* mysterious"). Chalmers’ "illusion gambit" highlights this trap: if the meta-explanation covertly relies on consciousness, it fails.  
  8. **Explain Cultural and Developmental Variance**: While core intuitions (e.g., pain’s qualia) appear widespread, variations exist (e.g., some cultures locate consciousness in the heart, not the brain). A theory must explain both the cross-cultural recurrence *and* the deviations, as cases like Lillard’s work on folk intuitions show.  

  **Non-Negotiables vs. Negotiable Commitments:**  
  Non-negotiables are (1), (2), (6), and (7). Any theory failing to explain the core intuition of mystery (1) or the Mary-case judgment (2) isn’t addressing the meta-problem. Contradicting established empirical data (6) or being circular (7) voids scientific credibility. Other desiderata are negotiable: realists might reject explaining unity (4) as essential (viewing it as a real feature), while illusionists might treat subjectivity (3) as derivative. Asymmetry explanations (5) are often camp-specific: functionalists may attribute it to heuristic errors, while dualists may see it as tracking ontological truth.  

  **Tensions Between Desiderata:**  
  A major tension arises between **empirical adequacy (6)** and **explaining unity/perspectivalness (4)**. Neural evidence suggests consciousness is fragmented and distributed (e.g., Gazzaniga’s split-brain work), yet we report unified experiences. A theory satisfying (4) might posit integrative cognitive mechanisms, risking conflict with (6) if those mechanisms aren’t empirically supported. Similarly, **avoiding circularity (7)** can clash with **phenomenal judgments (2)**: explaining why we insist on qualia without invoking proto-phenomenal properties is a tightrope walk.  

  **Most Exclusionary Desideratum:**  
  **Avoiding circularity (7)** is the sharpest filter. It immediately disqualifies:  
  - **Naive realists** who posit that the mystery arises because consciousness *is* irreducible (presupposing the explanandum).  
  - **Certain dualist accounts** claiming we detect non-physical properties via introspection (again, presupposing them).  
  - **Misapplied phenomenal concept strategies** (e.g., Balog’s "quotational" model) if they implicitly rely on phenomenal content.  
  Illusionist accounts (e.g., Dennett’s "joycean machine," Frankish’s "dual-content") often stumble here by smuggling in phenomenal-like properties under functional guises.  

  **Dependence on Assumptions and Alternatives:**  
  This framework assumes the meta-problem targets *illusions* of irreducibility. If we instead assume the hard problem is real, desiderata shift: (1) and (2) become about explaining *accurate detection* of irreducibility, (7) is relaxed (allowing appeals to genuine properties), and (6) may be downgraded if neuroscience is deemed irrelevant to non-physical features. Realists might prioritize explaining the *absence* of mystery for physical phenomena over explaining its presence for consciousness.  

  In essence, an adequate meta-problem theory must non-circularly explain our tenacious dualist intuitions, using empirically plausible cognitive mechanisms, while navigating tensions between unity and fragmentation, privacy and attribution. The most rigorous contenders today—predictive processing models (e.g., Clark), illusionist cognitive architectures (e.g., Graziano), or evolutionary error theories (e.g., Humphrey)—each grapple with these constraints, often trading off desiderata. No theory satisfies all flawlessly, but the desiderata chart the minefield any solution must cross.
