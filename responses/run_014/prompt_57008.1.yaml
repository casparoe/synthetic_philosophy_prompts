  We are designing an in-class game to confront students with Bertrand's paradox without naming it. The goal is to have three groups build different devices that each claims to pick a "random chord" on a circle, but they will get different probabilities for the same event (e.g., the chord being longer than the side of an inscribed equilateral triangle). The challenge is to frame it in an ordinary context and to get commitments before data sharing.

  ### Framing Story
  **Title:** The Crystal Orb Contest  
  **Story:** At the annual Fortuna's Fair, there's a contest to guess the outcome of a mystical crystal orb. The orb is perfectly spherical and has a hidden inner core. The contest involves predicting whether a randomly chosen "energy beam" (a chord inside the orb) is "strong" (longer than a reference length, which is the side of an inscribed equilateral triangle) or "weak". 

  Three different ancient methods (devices) are used to generate the random energy beam. Each group will use one method to generate chords and record outcomes. They must bet tokens on the probability that a chord is "strong" (longer than the reference). The group that comes closest to the true probability (which they don't know) wins tokens from the others. However, if they decline to bet (by saying the question is ill-posed), they can avoid losing tokens but also cannot win.

  ### Materials List
  - **Device 1 (Random Endpoints):** 
    - A circular disk (cut from card) with a fixed radius (e.g., 10 cm). 
    - A protractor or a printed degree scale around the edge (0 to 360 degrees). 
    - Two spinners (made from card and a brad with an arrow) or two dice (to generate two random angles). 
    - String to draw the chord.

  - **Device 2 (Random Radial Point):** 
    - Same circular disk. 
    - A ruler with a fixed center pin (so it can rotate). 
    - A spinner or die to generate a random angle (0 to 360 degrees) and a random distance from the center (0 to radius). For distance, use a spinner with a linear scale from 0 to R (the radius) or a die to generate a random number that can be scaled to [0, R] (e.g., using two dice to get a number between 00 and 99 and then scaling to [0, R] by marking the ruler accordingly). Alternatively, use a random number on a strip of paper that can be placed along the radius.

  - **Device 3 (Random Midpoint):** 
    - Same circular disk. 
    - A grid of points (or a way to pick a random point) within the circle. Since we need uniform over the area, we can use a coordinate system. 
    - Two dice to generate random coordinates (x, y) within the square that circumscribes the circle. Then, we reject points outside the circle (but for time, we might pre-generate or use a spinner that only lands inside). Alternatively, a spinner with a circular base and a fixed arm that can land anywhere inside (but that's hard to make uniform). Instead, we can use a square grid and rejection: 
      - Create a square frame that the circle fits in (side 2R). 
      - Use two dice (or two spinners) to pick a random point in the square. If it's inside the circle, keep it; else, re-roll. 
    - Once a point is chosen, it is the midpoint of the chord (which is perpendicular to the radius through that point).

  ### Instructions per Device
  Each group gets a set of instructions and materials. They will build the device and then run 20 trials (or as many as time allows) to estimate the probability that the chord is "strong" (longer than the side of an equilateral triangle inscribed in the circle). The reference length is the side of the inscribed equilateral triangle (which they can compute: for a circle of radius R, the side is √3 * R). But note: they don't need the absolute length, only whether the chord is longer. They can determine this by comparing to a fixed chord (e.g., they can make a template of the reference chord length and compare).

  **Common Instructions for All Groups:**
  - Build your device as described.
  - Run 20 trials. For each trial, generate a chord and record whether it is "strong" (longer than the reference) or "weak".
  - Compute the proportion of "strong" chords in your 20 trials. This is your estimate of the probability.
  - Then, you must bet: write down your estimate (as a fraction or decimal) and how many tokens you want to bet (see scoring rule). Alternatively, you can decline to bet by stating that the question is ill-posed.

  **Device 1: Random Endpoints Method**
  - Step 1: Use the spinner (or die) to generate two random angles between 0 and 360 degrees. (If using dice: two 10-sided dice can generate two digits for a number from 00 to 99, then scale to 0 to 360: e.g., angle = (die roll) * 3.6 degrees.)
  - Step 2: Mark these two points on the circle (using the degree scale).
  - Step 3: Stretch the string between these two points to form the chord.
  - Step 4: Check if the chord is longer than the reference chord (using a pre-cut reference string of length √3 * R). Record as strong or weak.

  **Device 2: Random Radial Point Method**
  - Step 1: Generate a random angle between 0 and 360 degrees (using a spinner or die as above).
  - Step 2: Generate a random distance from the center. To do this: use a die to generate a number between 0 and 99, then scale to a distance from 0 to R (so distance = (die roll)/99 * R). Mark the point at this distance along the radius at the chosen angle.
  - Step 3: The chord is perpendicular to the radius at this point. So, at the point you marked, draw a line perpendicular to the radius (using a set square or by folding a paper at 90 degrees). Then, stretch the string along that line to form the chord (from the circle's edge to edge).
  - Step 4: Check the chord length against the reference.

  **Device 3: Random Midpoint Method**
  - Step 1: We need a random point inside the circle. To do this, we use a square that just contains the circle (side 2R). Generate two random numbers (x and y) each in the range [-R, R]. How? Use two dice to generate two numbers between 00 and 99, then scale: 
    - x = (die1 - 49.5) * (2R/99)  [so centered at 0, from -R to R? Actually, we can do: x = (die1/99 * 2R) - R, similarly for y]
    But note: we must reject if x²+y² > R². 
  - Step 2: If the point (x,y) is inside the circle (x²+y² <= R²), proceed. Else, re-roll.
  - Step 3: This point (x,y) is the midpoint of the chord. The chord is perpendicular to the line from the center to (x,y). So, draw the chord accordingly (using string).
  - Step 4: Check the chord length against the reference.

  ### Scoring Rule
  - Each group starts with 10 tokens.
  - They must write their estimate (p) of the probability (from 0 to 1) and decide how many tokens (b) they want to bet (0 <= b <= 10). Alternatively, they can write "ill-posed" and bet 0 tokens.
  - After all groups have submitted and the true probabilities (from the classical methods) are revealed (but note: we don't have a "true" in the absolute sense; we will use the theoretical values for each method), we score as follows:
    - For each group that bet: 
      - If they gave a probability p, we compare p to the theoretical probability for their device (which we know from Bertrand's paradox: Device 1: 1/3, Device 2: 1/2, Device 3: 1/4).
      - The loss is (b) * (p - true_value)^2 (quadratic scoring rule). They lose that many tokens (rounded to the nearest integer). 
      - Alternatively, we can use absolute error: |p - true_value| * b, but quadratic is more standard.
    - For a group that declined (ill-posed): they neither gain nor lose tokens (so they keep 10).
  - However, note: the groups don't know the true_value until after they bet. They only have their own 20 trials. And they don't know that the true_value is different for each device.

  But wait: the reveal is at the end that the three devices are the classical ones. So we will reveal the theoretical probabilities for each device: 
    Device 1: 1/3 ≈ 33.3%
    Device 2: 1/2 = 50%
    Device 3: 1/4 = 25%

  And we also reveal that the three methods are the three classical ways to generate a "random chord".

  Now, the twist: the groups are betting on the probability that a chord is strong, but they are not told that the probability depends on the method. They think they are all answering the same question. The scoring rule uses the theoretical value for their own device. 

  But note: the instructions say "the true probability" — but we must be careful. We will tell them that the true probability for their device is the theoretical one we know (from the classical analysis). So:

  - Group 1 (endpoints): true value = 1/3
  - Group 2 (radial): true value = 1/2
  - Group 3 (midpoint): true value = 1/4

  So each group is scored against their own true value. But the point is that they thought they were all answering the same question (the probability for a random chord in the orb) and now they see that the true value is different for each method.

  ### Timeline (75 minutes)

  **Minute 0-5:** Introduction to the Crystal Orb Contest. Explain the story and the goal: to estimate the probability that a random energy beam (chord) is strong (longer than the reference). Introduce the three methods (without giving away that they are different). Split into three groups and assign each a method.

  **Minute 5-15:** Groups build their devices. Circulate to help with construction.

  **Minute 15-35:** Groups run 20 trials each and record the number of strong chords. They compute their estimate (p = number_strong / 20).

  **Minute 35-45:** Each group deliberates: they must decide whether to bet and if so, on what probability and with how many tokens (0-10). They write down: 
    - Their estimate p (if they are betting) or "ill-posed"
    - The number of tokens b they are betting (0 if ill-posed)

  **Minute 45-50:** Collect the bets. Then, reveal the pooled data: write on the board the number of strong chords from each group (so for each device, the count out of 20). Do not reveal the group identities yet.

  **Minute 50-55:** Ask the class: "Do these numbers look like they are from the same distribution? What might explain the differences?" (Expect: random variation? different methods?)

  **Minute 55-60:** Reveal that each group used a different method. Then, reveal the theoretical probabilities for each method (1/3, 1/2, 1/4). Also, reveal that these are the three classical ways to generate a random chord and that this is known as Bertrand's paradox.

  **Minute 60-70:** Debrief (see below).

  **Minute 70-75:** Wrap-up and collect tokens to see which group won (in tokens).

  ### Debrief
  Tie moments to the concepts:

  - **The classical answers:** When we revealed the theoretical probabilities (1/3, 1/2, 1/4) and associated each with a device, that corresponds to the three classical answers. The pooled data on the board showed different proportions, which are roughly around these values (but with variation due to only 20 trials).

  - **Ill-posedness response:** A group that wrote "ill-posed" and bet 0 tokens avoided the loss. They might have argued that without a specified method, the question is ill-posed. They profit because they don't lose tokens (while others do). But note: they didn't gain either. We can point out that this group might have anticipated that the probability is not well-defined without a generating process.

  - **Invariance response:** Did any group notice that their method was not rotationally invariant? (Actually, all three are rotationally invariant, but they might have noticed that the distribution of chords looks different.) This is subtle. Instead, we can note that the three methods are all "symmetric" in their own way (rotationally invariant) but produce different probabilities.

  - **Generating-process response:** The key moment is when we revealed that each device corresponds to a different generating process. The disagreement is not due to arithmetic but due to the different ways of generating the chord. The probability is relative to the process.

  ### What will break?
  - **Physical trials:** With only 20 trials per group, the proportions will not exactly be 1/3, 1/2, 1/4. They might be: 6/20=0.3, 10/20=0.5, 5/20=0.25, but also might be 7, 9, 6, etc. The point might be muddied because the differences could be attributed to chance. We must emphasize that the theoretical values are different and that the methods are the cause.

    Solution: We can run a simulation in advance (or use the theory) to show that with more trials, the proportions would converge to the theoretical values. But in class, we can just state that the classical analysis gives these exact values.

  - **Construction issues:** 
    - Device 1: Generating two random angles and drawing the chord might be accurate.
    - Device 2: The random radial point: the chord is perpendicular to the radius. This might be hard to draw exactly. The distance scaling might be approximate.
    - Device 3: The rejection method for the midpoint: it might take many rolls to get 20 points inside the circle. Also, drawing the chord perpendicular to the radius at the midpoint might be tricky.

    We might pre-compute some points or use a grid to speed up.

  - **Recognition:** If any student has heard of Bertrand's paradox, they might recognize it. The framing as a crystal orb contest is meant to avoid that.

  ### Which lesson does the design secure?
  The design emphasizes that the probability depends on the generating process. The same question ("what is the probability that a random chord is longer than the side of the equilateral triangle?") yields different answers when the random process is specified differently. Therefore, the lesson is that a probability claim is incomplete without a specified generating process.

  However, the paradox also shows that indifference (uniform distribution) applied to different parameterizations leads to different results. So it also teaches that indifference is relative to a parameterization.

  But in the activity, the groups are explicitly building a generating process. The instructions do not say "assume uniform over chords" but instead give a physical process. Therefore, the lesson that comes out most naturally is the need for a specified generating process.

  ### What would I have to see to be persuaded it taught the other one?
  To see that the lesson was about indifference being relative to a parameterization, we would have to observe students discussing why they assumed uniformity in the way they did. For example, in Device 1, they are uniform over the angles (which is uniform over the circumference). In Device 2, they are uniform over the radius and angle (so uniform in polar coordinates). In Device 3, they are uniform over the area. The parameterizations are different. If during the debrief, students articulate that they were using different "variables" to describe the chord and that they assumed uniformity on those variables, then the parameterization lesson is coming through.

  ### Where is the reasoning weakest?
  The weakest point is that the activity might not make clear that the three methods correspond to different parameterizations of the chord. The instructions are given as physical processes, and the students may not see the underlying parameters. We must ensure that in the debrief, we explicitly connect:
  - Device 1: chord defined by two endpoints (so two angles: parameterization by angles).
  - Device 2: chord defined by a point on a radius and a direction (but actually, the point is a distance from center and an angle: so (r, θ)).
  - Device 3: chord defined by a midpoint (so a point in the disk: (x,y)).

  We then note that each group assumed a uniform distribution over their parameter space. So the lesson of parameterization is there, but it might be less salient than the process lesson.

  ### Verdict: process
  The design emphasizes the generating process. The groups built a physical process, and the probability depends on that process. The activity is structured around the process. Therefore, the verdict is **process**.

  However, note: the last line must be exactly "Verdict: parameterisation / process". So we choose **process**.

  But the instructions say: "Last line exactly: Verdict: parameterisation / process." and we must pick one. We are picking **process**.

