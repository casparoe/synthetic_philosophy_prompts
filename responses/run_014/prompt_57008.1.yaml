answer: |-
  ### Framing Story: The Orb's Energy Beam  
  At Fortuna's Fair, a mysterious orb emits energy beams (straight lines) across its interior. The orb is perfectly circular. Contestants must predict whether a randomly generated beam is "critical" (longer than a reference length, secretly the side of an inscribed equilateral triangle). Three ancient methods exist to generate these beams, each claiming to be "truly random." Your group will use one method to estimate the probability of a critical beam. The winning group gains tokens; overconfident bets lose tokens, but declining to bet preserves your stake if the question is ill-posed.

  ---

  ### Materials List (per group of 8–9 students, 3 groups total)  
  - **All groups**:  
    - 1 card circle (pre-cut, 15 cm diameter) with marked center.  
    - 1 reference string (length = √3 × radius, ≈13 cm for 7.5 cm radius).  
    - String for chord drawing.  
    - Pins, ruler, pens, paper.  
  - **Device 1 (Endpoints)** – *Simulates "random endpoints" method*:  
    - Protractor printout (0°–360° scale) taped to circle edge.  
    - 2 spinners (card+pin, arrow stickers) or 2 ten-sided dice (for random angles).  
  - **Device 2 (Radial Point)** – *Simulates "random radius point" method*:  
    - Ruler with center-pin hole (rotates freely).  
    - 1 spinner (linear scale 0–100) or ten-sided die (for distance %).  
  - **Device 3 (Midpoint)** – *Simulates "random midpoint" method*:  
    - Square grid overlay (card, side = circle diameter) with coordinate axes.  
    - 2 ten-sided dice (for x, y coordinates) or 2 linear spinners (0–100).  

  ---

  ### Device Instructions (self-readable)  
  **Common preamble**: Build your device. Generate 20 chords. For each, compare to reference string: record ✔ (critical, longer) or ✘ (not). Calculate your critical probability = (✔/20).  

  **Device 1 (Endpoints)**:  
  1. Spin twice (or roll two dice) for angles A and B (0–360°).  
  2. Pin string at A and B on circle edge to form chord.  
  3. Measure vs. reference: record ✔/✘.  

  **Device 2 (Radial Point)**:  
  1. Spin for angle θ (0–360°). Align ruler at θ.  
  2. Spin for distance % D (0–100). Mark point at (D/100) × radius from center.  
  3. Pin string perpendicular to ruler at this point (use set square/ruler edge). Form chord.  
  4. Measure vs. reference: record ✔/✘.  

  **Device 3 (Midpoint)**:  
  1. Roll two dice for X (00–99) and Y (00–99). Compute:  
     - x = (X/99 × diameter) – radius; y = (Y/99 × diameter) – radius.  
  2. If (x² + y²) > radius², re-roll (point outside circle). Else, mark midpoint.  
  3. Pin string perpendicular to line from center to midpoint. Form chord.  
  4. Measure vs. reference: record ✔/✘.  

  ---

  ### Scoring Rule  
  - Start: 10 tokens per group.  
  - **Commitment phase (before data sharing)**:  
    - Submit a probability estimate *p* (0–1) **and** bet size *b* (0–10 tokens).  
    - **Or** submit "ILL-POSED" (bet size = 0).  
  - **Scoring after reveal**:  
    - If bet (*p*, *b*): Loss = *b* × |*p* – *true*| (absolute error). Deduct from tokens.  
    - If "ILL-POSED": No loss/gain.  
    - *true* = theoretical probability for your device (revealed later).  
  - **Win condition**: Max tokens wins.  

  > **Key**: Forces commitment. "ILL-POSED" avoids loss if probabilities diverge, but groups must judge this *before* seeing others' data.  

  ---

  ### Timeline (75 min)  
  - **0–5 min**: Introduce Fair story, split groups, distribute materials.  
  - **5–20 min**: Build devices (circulate to troubleshoot, e.g., perpendicularity in Device 2/3).  
  - **20–40 min**: Run 20 trials, compute *p* (critical probability).  
  - **40–45 min**: **Commitment phase** – Groups write:  
    - Estimate *p* and bet *b* (0–10), **or** "ILL-POSED".  
    - *Collect all submissions; no cross-talk*.  
  - **45–50 min**: Pool data – Board: Group A ✔/20, Group B ✔/20, Group C ✔/20 (hide device labels).  
  - **50–55 min**: Discuss: "Is one probability correct? Why do estimates differ?"  
  - **55–60 min**: **Reveal 1**: Each group used a different device.  
  - **60–65 min**: **Reveal 2**: Theoretical *true* probabilities:  
    - Device 1: 1/3 (≈33%)  
    - Device 2: 1/2 (50%)  
    - Device 3: 1/4 (25%)  
    - *Calculate token losses*.  
  - **65–75 min**: **Debrief** – Link to Bertrand:  

  ---

  ### Debrief: Tying Moments to Lessons  
  - **Classical answers**:  
    - Device 1 (Endpoints) → 1/3 (chord length depends on arc).  
    - Device 2 (Radial Point) → 1/2 (uniform on radius).  
    - Device 3 (Midpoint) → 1/4 (uniform on area).  
    - *Moment*: Reveal 2 shows incompatible "true" probabilities.  
  - **Ill-posedness**:  
    - Groups declaring "ILL-POSED" (e.g., noting "random" is undefined) profit by avoiding loss.  
    - *Moment*: Commitment phase forces this call *before* divergence is visible.  
  - **Invariance**:  
    - Device 1 uses rotational invariance (angles), Device 3 uses translational (area).  
    - *Moment*: When pooling data, ask: "Would rotating your circle change your chords?" (All say no – but invariance differs).  
  - **Generating process**:  
    - Conflict arises because each device encodes a different process.  
    - *Moment*: Reveal 1 – "You all built different experiments."  

  ---

  ### Predictable Breakdowns  
  - **Trials muddying the point**:  
    - Small samples (n=20) → estimates may not match theory (e.g., Device 3 gets 6/20=30%, not 25%).  
    - *Fix*: Stress theory over data: "Your device *should* give 25% in infinite trials."  
  - **Physical errors**:  
    - Device 2/3: Perpendicularity hard to eyeball → misaligned chords.  
    - Device 3: Re-rolls slow progress.  
    - *Fix*: Pre-mark midpoints or use digital RNG (if constraints relax).  
  - **Escape hatch too appealing**:  
    - Sharp groups may declare "ILL-POSED" early to avoid loss, missing the collision.  
    - *Fix*: Price betting to lure them – e.g., if *p* is exact, win double *b*. But absolute error penalizes overconfidence.  

  ### Structurally Missing Elements  
  - **Cannot deliver**: Why the three methods are *classical* (must assert post-reveal).  
  - **Must supply in words**:  
    - "Bertrand showed these are three natural 'uniform' choices."  
    - "Probability requires a specified process, not just an 'ignorance' assumption."  
    - "No single 'correct' answer; your device defines the probability space."  

  ---

  ### Lesson Secured: Process over Parameterisation  
  The design emphasizes **process**: Groups *build* a physical generating method, and the debrief highlights that the probability is tied to this process. The token loss for betting (without declaring "ILL-POSED") penalizes groups that assume their process defines "the" random chord.  

  - **To teach parameterisation**: You’d need groups explicitly debating *which parameter* (angle, radius, area) should be uniform. If, during trials, a group says, "We’re uniform on angles, but should we be uniform on area?" and bets accordingly, that signals parameterisation. No such moment occurs predictably.  
  - **Weakest reasoning**: The activity downplays parameterisation by embedding it in physical processes. Students may see the devices as "different experiments" without abstracting to underlying parameters (e.g., Device 2’s r vs. r²). This must be drawn out in debrief.  

  Verdict: process
