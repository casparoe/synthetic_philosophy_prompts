answer: |-
  ## Proposal: Prudential and Moral Discounting under Reductionism—Testing the Structural Parallel  

  **1. Core Question**  
  *Can the strongest disanalogies between prudential time preference (discounting one’s *own* future welfare) and moral time preference (discounting *future people’s* welfare) withstand scrutiny when personal identity is understood reductionistically? Specifically: Under psychological continuity theories of personal identity, which proposed differentiating factors (e.g., promise-binding, causal pathways, non-identity, gradability of concern) can coherently justify treating the two forms of discounting asymmetrically?*  

  **Why this formulation wins:**  
  - *Loser 1: "Does reductionism imply symmetric discounting?"* Too binary; assumes the parallel *must* hold absent disanalogies, ignoring normative counterarguments.  
  - *Loser 2: "How do disanalogies affect the prudential-moral parallel?"* Too vague; lacks criteria for assessing whether a disanalogy "succeeds" in breaking the symmetry.  
  - **Chosen formulation** forces operationalization: A disanalogy "survives" only if it provides a *principled, non-arbitrary* reason to treat the cases differently *even after* the reductionist premise is accepted.  

  **2. Why the Question is Open**  
  Existing debates treat prudential and moral discounting as distinct normative domains. Prudential discounting is often defended via agent-relative sovereignty (Parfit, Brink), while moral discounting is rejected via impartiality (Ramsey, Broome) or non-identity problems (Parfit). Crucially, *no systematic work tests whether disanalogies retain force under the shared metaphysical premise of reductionism*. The parallel remains unexplored at the constraint level, leaving a gap between ethical theory and rational choice models.  

  **3. Method: Philosophical Reconstruction & Constraint Testing**  
  Over ten weeks, I will:  
  1. **Formalize Discount Functions:** Reconstruct prudential (`D_p`) and moral (`D_m`) discounting as utility functions incorporating time/identity variables.  
  2. **Model Disanalogies as Constraints:** Express each candidate disanalogy (e.g., promise-binding, non-identity) as a formal constraint that purportedly applies to `D_p` but not `D_m` (or vice versa).  
     - *Example (Causal Pathway):* `D_p` requires direct agential causation; `D_m` tolerates institutional mediation. Test: Does violating this alter the permissibility of discounting?  
  3. **Stress-Test in Parallel Cases:** Design hypothetical pairs (e.g., *My distant future self* vs. *A future stranger with high psychological continuity to me*) to probe whether constraints hold under reductionism.  
  4. **Assess Robustness:** Determine if any constraint remains normatively compelling when identity is scalar and non-metaphysical.  

  **Why this beats intuition-cataloging:**  
  - Focuses on *principled coherence* of disanalogies, not raw intuitions (which vary interpersonally/culturally).  
  - Reveals whether distinctions are *necessary features* of discounting or contingent artifacts of non-reductionist views.  
  - Generates testable criteria for symmetry: If no constraint survives, discounting must be symmetric or rejected entirely.  

  **4. Deliverables & Success Conditions**  
  - **Success:** A ranked taxonomy of disanalogies by survivability, showing *which* (if any) provide sustainable grounds for asymmetry.  
  - **Clear Failure Modes:**  
    - *Total Collapse:* No disanalogy survives → symmetry is unavoidable, forcing revision of prudential/moral frameworks.  
    - *Total Survival:* All disanalogies hold → reductionism is normatively inert, leaving debates unchanged.  
    - *Partial Collapse:* Some disanalogies fail (e.g., non-identity, gradability) while others hold (e.g., promise-binding) → clarifies where agency, not identity, does the work.  
  - **Scope Management:** Ten weeks is sufficient to test 3–4 disanalogies. *Fallback:* Prioritize (1) promise-binding/resolution and (2) non-identity, as these are most cited in climate ethics.  

  **5. Broader Payoff**  
  For economists/political theorists:  
  - **Reframes discount rate debates:** Shows whether the "near-zero vs. few-percent" standoff in climate economics masks a deeper disagreement about *which type of discounting* (prudential vs. moral) applies to intergenerational problems.  
  - **Diagnoses policy gridlock:** If symmetry holds, standard cost-benefit analyses importing prudential rates (e.g., 3–7%) for moral problems (e.g., climate damages) are unjustifiable.  
  - **Offers conceptual tools:** Formal constraints provide testable criteria for evaluating discounting models in welfare economics and sustainability policy.  

  ---

  **Proposal ends at 1.75 pages, allowing space for your institutional header.** This structure ensures interdisciplinary accessibility by centering a testable mechanism (constraint survival), defining success/failure transparently, and directly engaging applied concerns (climate discounting). The method leverages philosophy’s strength in normative analysis while producing outputs relevant to economic modeling.
