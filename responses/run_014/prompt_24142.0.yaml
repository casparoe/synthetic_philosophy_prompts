prompt: |-
  A colleague of mine is a strict Lakatosian, and for several years he has classified research programmes in our history-of-science seminars with a consistency that has always struck me. Here is his track record. He called the kinetic, molecular theory of heat progressive, against the caloric theory; the germ theory of disease progressive, against the miasma theory; and the Big Bang cosmology progressive, against the steady-state cosmology. In each of those three cases the programme he endorsed was currently ahead of its rival on the balance of confirmed predictions, had anticipated facts the rival could not reach, and had developed through moves generated by its own framework rather than through patches fitted to fresh anomalies. He called the caloric theory degenerating, the miasma theory degenerating, and the steady-state cosmology degenerating; and in each of those three the programme was currently behind its rival, had offered no fact the rival lacked, and had been kept alive by ad hoc additions tailored to each new anomaly.

  A new case comes up this term. A certain programme is currently ahead of its rival on the balance of confirmed predictions, it has few unexplained anomalies, and its recent theoretical moves were generated from its own core principles rather than fitted to anomalies. But it has not anticipated a single novel fact: everything it explains was already observed, its rival is the one actually producing new confirmed predictions, and the only reason it is ahead is that it re-explains the old data a little more elegantly.

  What do you think my colleague will call this programme — progressive or degenerating? I am less interested in a bare label than in the rule he appears to be running. Lay out the candidate rules his track record is consistent with, say what each one predicts for this new case, give your best guess for his verdict and the reason you would prefer it, and name the single further case that would best tell those rules apart. Lead with your bottom-line verdict in the first sentence, then give the reasoning; no preamble, and do not restate the question.
reasoning: |-
  Hmm, the user describes a colleague who applies Lakatos's methodology of scientific research programmes (MSRP) consistently. The colleague has labeled several historical cases as progressive or degenerating based on three criteria: balance of confirmed predictions, anticipation of novel facts, and theoretical development from core principles versus ad hoc patches. Now, a new case comes up where a programme leads in confirmed predictions due to elegant re-explanations of old data but hasn't anticipated any novel facts, while its rival is producing new confirmed predictions. The user wants to know what label the colleague would assign and the underlying rule.

  First, I need to recall Lakatos's MSRP. Progressive programmes predict novel facts, explain anomalies without ad hoc adjustments, and expand their heuristic power. Degenerating ones fail to predict new facts, rely on ad hoc modifications, and stagnate. The colleague's past judgments align with this: kinetic theory, germ theory, and Big Bang were progressive because they anticipated new facts and had internal theoretical growth. Caloric, miasma, and steady-state were degenerating because they lagged in predictions, offered no novel facts, and used ad hoc fixes.

  The new case has a programme that's ahead on confirmed predictions but only by re-explaining old data more elegantly. It has few anomalies and theoretical moves from core principles, so it's internally consistent. However, it hasn't anticipated any novel facts; the rival is the one making new predictions. This creates a tension in Lakatos's criteria. Novel fact prediction is crucial for progressiveness according to Lakatos. Without it, even if a programme leads in overall predictions, it might not be truly progressive. The rival is producing new confirmed predictions, which suggests it's actively generating novel facts, a sign of progress.

  The colleague's track record emphasizes the anticipation of novel facts as a key factor. In all past cases, the progressive programmes anticipated facts that rivals couldn't. Here, the programme in question hasn't done that. Even though it has other positive traits, the absence of novel predictions might lead the colleague to call it degenerating. The rival, despite being behind overall, is producing new predictions, which could indicate it's in a progressive phase. But the question is about labelling this specific programme, not its rival.

  Possible rules from the track record:
  1. A programme is progressive only if it anticipates novel facts. This would classify the new case as degenerating because it lacks novel predictions.
  2. Balance of confirmed predictions is primary; if ahead, it's progressive. This would call it progressive since it's ahead.
  3. Combination: must lead in predictions AND anticipate novel facts. The new case fails the latter, so degenerating.
  4. Theoretical integrity (moves from core principles) is sufficient if predictions are strong. This might call it progressive.

  The colleague's history shows that in all three cases, the progressive programmes anticipated novel facts. The absence of this in the new case suggests rule 1 or 3. The rival producing new predictions highlights that this programme isn't innovating. Lakatos prioritizes heuristic progress – the ability to predict new phenomena. So, without that, even elegance in old data isn't enough. The colleague would likely emphasize novel facts as decisive.

  For the further case to distinguish rules: Suppose a programme has anticipated novel facts but is slightly behind in overall predictions due to many unsolved anomalies. Rule 1 would call it progressive (novel facts present), while rule 2 would call it degenerating (behind in predictions). This would test which criterion is weighted more heavily.

  Based on Lakatos and the colleague's consistency, the verdict should be degenerating. The reason is the lack of novel fact anticipation, which is central to progressiveness. The elegance in re-explanation doesn't compensate for stagnation in new predictions.
answer: |-
  My colleague will call this programme **degenerating**.

  The track record suggests two candidate rules consistent with his past classifications:  
  **Rule A (Novelty-Centric):** A programme is progressive *only if* it anticipates novel facts; leading in overall confirmed predictions or theoretical elegance is secondary.  
  **Rule B (Predictive-Balance-Centric):** A programme is progressive if it leads in the balance of confirmed predictions *and* develops theoretically from its core principles, even without novel facts.  

  - **Rule A** predicts "degenerating" for the new case because the programme fails the novel-fact criterion (it re-explains old data only, while the rival produces new predictions).  
  - **Rule B** predicts "progressive" because it meets the prediction-balance lead and internal-theoretical-development criteria.  

  His past verdicts emphasize **Rule A**: In all three historical cases, he highlighted novel-fact anticipation as decisive for progress (e.g., kinetic theory predicted Brownian motion; germ theory predicted specific microbes; Big Bang predicted CMB radiation). Conversely, degenerating programmes failed on this criterion. Rule A fits this pattern tightly. The new programme’s elegance and prediction lead are insufficient without novelty, mirroring why caloric/miasma/steady-state were deemed degenerating despite partial explanatory power.  

  The **best further case** to distinguish Rule A from Rule B is:  
  *A programme that has anticipated multiple novel facts and develops from its core principles but is currently behind on the balance of confirmed predictions due to unresolved anomalies (e.g., early quantum theory vs. classical physics pre-1920s)*.  
  - Rule A calls it progressive (novel facts present).  
  - Rule B calls it degenerating (behind on predictions).  
  This tests whether novel facts trump predictive balance. Given his history, Rule A would likely prevail.
