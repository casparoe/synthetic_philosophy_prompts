  ### Session Design: Condorcet Jury Theorem Game  
  **Objective:** Illustrate the theorem's core insight (majority infallibility under ideal conditions) and its fragility when premises are violated, through experiential learning.  

  ---

  #### **Materials & Setup**  
  1. **Voting Platform**:  
     - Use a free real-time polling tool (e.g., **Mentimeter**, **Kahoot!**, or Google Forms) for anonymous voting.  
     - Display results live via projector.  

  2. **Question Banks** (pre-tested for calibration):  
     - **Phase 1 (Competence >0.5)**: 10 binary fact-based questions with ~60% accuracy (e.g., "True/False: The Nile is the longest river on Earth").  
     - **Phase 2 (Correlated Errors)**: 5 questions based on a universal misconception (e.g., "True/False: Lightning never strikes the same place twice").  
     - **Phase 3 (Competence <0.5)**: 10 binary questions with ~40% accuracy (e.g., "True/False: The capital of Australia is Sydney").  
     - *Calibration Secret*: Adjust difficulty by embedding subtle cognitive biases (e.g., decoy options in pre-questions) or time pressure (5 seconds/question). Students won’t realize accuracy is tuned.  

  3. **Tracking Tools**:  
     - Shared spreadsheet (e.g., Google Sheets) projecting:  
       - **Individual Accuracy**: Running % of correct votes per student.  
       - **Majority Accuracy**: % of times the majority vote was correct.  
       - **Group Size**: For Phase 1/3, track majority accuracy at sizes 1, 5, 9, 13, 18.  

  4. **Payoff Scheme**:  
     - **"Democracy Tokens"**: Students earn tokens for:  
       - Correct individual vote (+1 token).  
       - Correct majority vote (+1 token for all).  
       - Tokens redeemable for small privileges (e.g., choose a discussion topic, 1% extra credit).  

  ---

  #### **Session Structure (75 min)**  
  **Phase 1: Ideal Conditions** (25 min)  
  - **Rules**:  
    - Students answer 10 Phase 1 questions individually and anonymously.  
    - After each question, reveal the correct answer.  
    - *Simulate Larger Electorates*: After all votes, randomly assign each student’s vote to 1–5 "cloned" virtual voters (e.g., Student A’s vote is duplicated 3 times). Use the tool’s randomization to generate "clone" votes based on each student’s observed accuracy (e.g., if a student is 60% accurate, their clones have a 60% chance of matching their vote).  
  - **Visualization**:  
    - Live line graph showing majority accuracy (Y-axis) vs. electorate size (X-axis).  
    - *Expected Result*: Accuracy rises as group size increases (e.g., 60% → 85% at *n*=18).  

  **Phase 2: Correlated Errors** (15 min)  
  - **Rules**:  
    - Before voting, prime a shared misconception (e.g., "Science trivia: Lightning never strikes twice—this is a well-known fact!").  
    - Students answer 5 Phase 2 questions.  
  - **Visualization**:  
    - Bar chart showing overwhelming majority support for the *wrong* answer (e.g., 90% vote "True" for the lightning myth).  
    - *Expected Result*: High confidence (80–100% majority) but 0% majority accuracy.  

  **Phase 3: Competence <0.5** (20 min)  
  - **Rules**:  
    - Repeat Phase 1 with Phase 3 questions (harder; e.g., obscure geography).  
    - Clone votes as in Phase 1.  
  - **Visualization**:  
    - Same live graph as Phase 1, but accuracy *declines* with group size (e.g., 40% → 20% at *n*=18).  

  ---

  #### **Debrief Discussion** (15 min)  
  Map game moments to the theorem:  
  | **Game Moment**               | **Theorem Premise**                          | **Friend’s Overreach**                          |  
  |-------------------------------|---------------------------------------------|------------------------------------------------|  
  | Phase 1 accuracy rising       | Competence >0.5 + independence → majority infallible. | Assumes these premises always hold; ignores fragility. |  
  | Phase 2 confident wrong majority | Independence violated (correlated errors).  | Overlooks groupthink/media bias in real voters. |  
  | Phase 3 accuracy falling      | Competence <0.5 → majority *unreliable*.    | Ignores that voters may be systematically misinformed. |  

  **Key Talking Points**:  
  - The theorem is mathematically sound **only** under strict premises:  
    - Binary choice with objective truth (unlike value debates).  
    - Voters sincere, not strategic.  
    - **Critical Premise:** Independence is easily broken (e.g., shared media, culture).  
  - Real-world limits: No classroom game can replicate a *genuinely large electorate* (e.g., millions) or *non-verifiable choices* (e.g., "best" policy).  

  ---

  #### **Predictable Challenges & Solutions**  
  1. **Phase 2 Fails (Students Know the Truth)**:  
     - *Risk*: If many know the lightning myth is false, the majority may be right.  
     - *Fix*: Use a pre-tested misconception (e.g., "Vikings wore horned helmets") or add time pressure to induce errors.  

  2. **Accuracy Calibration Drift**:  
     - *Risk*: Phase 1 questions accidentally <50% accurate.  
     - *Fix*: Have backup questions; use pre-tested sets. If accuracy is low, confess post-game and discuss why (e.g., "This mimics real voters in complex domains!").  

  3. **Time Shortfall**:  
     - *Risk*: Voting/cloning takes too long.  
     - *Fix*: Use tech tools for instant cloning; run fewer questions (e.g., 5 per phase).  

  4. **Student Competition Distorting Votes**:  
     - *Risk*: Students vote strategically to "win" tokens.  
     - *Fix*: Emphasize sincerity: "Vote what you *believe*; tokens reward honest engagement."  

  ---

  #### **Where the Game Falls Short (Requires Lecture Supplement)**  
  - **Large Electorate**: The theorem’s power is asymptotic (*n* → ∞). With 18 students, emphasize the *trend* (rising/falling accuracy), not the limit.  
  - **Sincerity/Strategy**: Students may prioritize tokens over truth. Discuss how real voters have agendas.  
  - **Non-Binary Choices**: The theorem ignores spectrums (e.g., immigration policy). Contrast with Arrow’s impossibility theorem later.  
  - **"Objective Truth"**: Highlight that democracy often decides values, not facts.  

  **Transition to Formal Reading**:  
  > "Today, we *felt* how majority rule can be truth-tracking or misleading. Now, let’s formalize why—and where Condorcet’s premises clash with reality."  

  This design balances visceral understanding with scholarly rigor, forcing students to confront the theorem’s limits—just as you wished your mathematician friend would.
