prompt: |-
  I am an undergraduate currently taking a course on the philosophy of mind, and in our unit on emotion we seem to have reached an impasse that our tutor described as decades old. We contrasted three broad positions: that emotions are essentially evaluative judgements, for example that anger involves judging that one has been wronged; that emotions are a kind of perception of evaluative properties, analogous to seeing colours or shapes but directed at danger, offensiveness or loss; and that emotions are essentially distinctive feelings, particularly of bodily change and affective valence, with any judgement or appraisal coming before or after rather than constituting the emotion.

  What puzzles me is that each side seems able to accommodate the textbook counterexamples, but only by reinterpreting them. Recalcitrant fear, such as continuing to be afraid of a spider while sincerely judging it to be harmless, is taken by one side to refute the judgement view and by another to show only that judgements can be compartmentalised. Cases where bodily arousal is pharmacologically blunted yet subjects still report anger or sadness are taken by one side to show feelings are inessential and by the other to show reports are unreliable. Objectless anxiety and lingering grief that persists without any occurrent thought are similarly claimed by everyone.

  My working hypothesis is that this is not primarily a factual disagreement but a case of three groups theorising different paradigms under a single label: one group starting from guilt, shame and indignation where reasons and justification seem central, another from sudden fear and disgust where automaticity and phenomenology seem central, and a third trying to split the difference. Is that correct, or is there a genuine substantive disagreement about what emotions are, a hidden empirical question about mechanisms, or a verbal dispute about how broadly to use the term emotion?

  Please diagnose the structure of the disagreement with reference to what each position actually claims, rather than adjudicating in favour of one theory, and explain what, if anything, would count as progress on your diagnosis — a conceptual distinction, a kind of case that could not be reinterpreted away, an empirical finding, or a reformulation of the question. If you think no progress should be expected, please explain why. Please answer in British English.
reasoning: |-
  Okay, the user is an undergraduate philosophy of mind student struggling with the debate around theories of emotion. They've outlined three main positions—judgementalism, perceptualism, and feeling theories—and noted how each can reinterpret counterexamples to maintain their stance. The user's hypothesis is that these theories might actually be addressing different paradigms under the same label, like guilt/shame versus sudden fear/disgust. They want a diagnosis of the disagreement's structure rather than a verdict.

  First, I need to map out each theory's core claims to clarify where they genuinely conflict. The judgement theory says emotions *are* evaluative judgements. Perceptualism frames them as perception-like appraisals. Feeling theory roots them in bodily sensations. The user mentioned recalcitrant emotions and pharmacological cases as key battlegrounds where reinterpretation happens. 

  The user's observation about different emotion types being starting points seems astute. Judgementalism fits "cognitive" emotions like guilt well, while feeling theory handles visceral reactions better. Perceptualism tries to bridge this but may overextend the perception metaphor. This suggests the conflict isn't just empirical—it's about what aspect of emotion we privilege as definitive.

  Substantively, the theories disagree on whether evaluation must be conceptual (judgement) or not (perception), and whether affect is essential. But the depth of disagreement varies: judgement vs feeling is starkly ontological (what emotion *is*), while perceptualism vs judgement is more about mechanism (how appraisal works). 

  Progress might require distinguishing emotion components (appraisal/feeling/behavior) rather than insisting one is the essence. Empirical work on neural correlates could help—e.g., if appraisals and feelings dissociate predictably. A fatal case would be an emotion with *no* evaluative content (contra judgement/perception) or *no* phenomenology (contra feeling theory), but both seem implausible. 

  The user's frustration with reinterpretations highlights how theories protect cores by stretching auxiliary hypotheses. This is typical of pre-paradigmatic debates. The best path forward may be pluralism—acknowledging emotion as a cluster concept—or a process-based view that avoids reification. 

  Given the user's sophisticated grasp, I'll validate their paradigm hypothesis while suggesting the disagreement blends substantive, methodological, and terminological layers. British English phrasing like "whilst" and "amongst" will keep it consistent with their academic context.
answer: |-
  Your diagnosis is perceptive and largely correct—the impasse stems from **competing paradigms prioritising different facets of emotion**, exacerbated by **vagueness in what constitutes an "emotion"** and **defensive manoeuvres** against counterexamples. Below is a structured analysis of the disagreement, its nature, and prospects for progress:

  ### 1. **Core Claims & Defensive Strategies**  
  Each theory isolates a *necessary and sufficient* component as the essence of emotion:

  - **Judgementalism** (e.g., Solomon, Nussbaum):  
    *Claim*: Emotion *is* an evaluative judgement (e.g., fear *is* judging something as threatening).  
    *Defence against counterexamples*: Recalcitrant emotions involve "sub-doxastic" judgements, cognitive biases, or contradictory judgements held simultaneously (e.g., "I judge it harmless *but* I also subconsciously judge it contaminating").  

  - **Perceptualism** (e.g., Roberts, Tappolet):  
    *Claim*: Emotion *is* a non-conceptual, perception-like appraisal of value properties (e.g., fear *is* perceiving imminent danger).  
    *Defence*: Recalcitrance arises from conflict between perceptual/appraisal systems and reflective judgement (like optical illusions). Pharmacological blunting disrupts feeling-components but not the core perceptual appraisal.  

  - **Feeling Theory** (e.g., James, Damasio):  
    *Claim*: Emotion *is* the conscious experience of bodily changes + affective valence (e.g., fear *is* feeling your heart race + dread).  
    *Defence*: Reports of emotion without arousal are misattributions or "cold" cognitive states. Recalcitrant cases involve lingering bodily feelings overriding judgement.  

  ### 2. **Structure of the Disagreement**  
  It is **multilayered**:  

  - **Substantive**:  
    - *Ontological*: Is emotion fundamentally cognitive (judgement/perception) or somatic (feeling)?  
    - *Phenomenological*: Which aspect (evaluative content vs. bodily feeling) is experientially primary?  

  - **Methodological**:  
    - Each paradigm selects "paradigm cases" that fit its theory:  
      - Judgementalism: Shame, guilt (rich in evaluation).  
      - Feeling Theory: Startle, lust (rich in phenomenology).  
      - Perceptualism: Phobias, disgust (automaticity + appraisal).  
    - Counterexamples are "explained away" by redefining the emotion’s boundaries or invoking auxiliary hypotheses (e.g., "sub-doxastic states").  

  - **Terminological**:  
    - "Emotion" is used ambiguously:  
      - As a *syndrome* (appraisal + feeling + behaviour).  
      - As a *basic component* (one of the above).  
    - Theories disagree on whether "emotion" must include conscious feeling or conceptual evaluation.  

  ### 3. **Why Progress is Elusive**  
  - **No Knockdown Counterexamples**: Cases can always be reinterpreted (e.g., blunted arousal might be argued to leave *residual* feelings).  
  - **Theory-Laden Definitions**: What counts as "anger" or "fear" depends on the theory. Judgementalists may dismiss objectless anxiety as "not a proper emotion," while feeling theorists embrace it.  
  - **Empirical Underdetermination**:  
    - Neuroscience shows emotions involve appraisal *and* bodily feedback circuits (e.g., amygdala + insula), but doesn’t resolve which is "essential."  
    - Psychological experiments (e.g., induced arousal misattributed as emotion) support feeling theory, yet appraisal studies support judgementalism.  

  ### 4. **Paths to Progress**  
  Your hypothesis that the dispute concerns **competing paradigms** is correct. Progress requires:  

  - **Conceptual Clarification**:  
    - Distinguish *emotion components*:  
      - Appraisal (evaluative representation).  
      - Bodily feeling (interoception/affect).  
      - Behavioural disposition (e.g., flight).  
    - Ask: "Which component is necessary/sufficient for *which aspect* of emotion?"  

  - **Empirical Disambiguation**:  
    - Identify a case **incapable of reinterpretation**:  
      - *Example*: An emotion with *zero* evaluative content (contra judgementalism/perceptualism) or *zero* phenomenology (contra feeling theory). If found, this would falsify one theory.  
      - *Current evidence*: Studies on "affective blindsight" (unconscious appraisal without feeling) challenge feeling theory but are contested.  

  - **Reformulating the Question**:  
    - Shift from "What *is* emotion?" to:  
      - "How do appraisal, feeling, and behaviour *interact* in emotional episodes?"  
      - "Do all emotions share a core mechanism, or are they a heterogeneous class?"  
      - Adopt a **process-based view** (e.g., emotions as dynamic feedback loops) rather than searching for a single essence.  

  - **Terminological Stipulation**:  
    - Explicitly define "emotion" narrowly (e.g., "I use 'emotion' to mean embodied appraisals") to avoid talking past each other.  

  ### Conclusion  
  The dispute is **both substantive and paradigm-driven**. While there are genuine disagreements (e.g., whether cognition is necessary for emotion), these are obscured by **theory-dependent interpretations of evidence** and **inconsistent terminology**. Progress is possible but requires:  
  1. **Component-based analysis** (dismantling "emotion" into parts).  
  2. **Rigorous empirical tests** targeting each theory’s core necessity claims.  
  3. **Accepting pluralism**: Emotions may be a "homeostatic property cluster" (e.g., typical but not universal features) rather than a natural kind.  

  If no component proves universally necessary, the debate may resolve by abandoning the search for a singular essence—recognising that "emotion" is a folk category uniting diverse phenomena. This wouldn’t satisfy all theorists, but it might break the impasse by reframing the question.
