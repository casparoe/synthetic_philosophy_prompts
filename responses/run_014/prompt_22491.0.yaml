prompt: |-
  I'm a third-year PhD student in epistemology, and I've been reading through the literature on accuracy-first epistemology and epistemic utility theory for my qualifying exam. I was at a departmental colloquium last week where two of my fellow students got into a heated debate about whether the accuracy dominance argument for probabilism is circular, and I honestly couldn't follow all the technical moves.

  The exchange went roughly like this: Marta, a fifth-year PhD student, started by saying that the accuracy dominance argument for probabilism is not circular, because the "pointwise" version of the argument -- the claim that for any non-probabilistic credence function c, there exists a probability function p such that for every possible world w, the accuracy of c at w is less than or equal to the accuracy of p at w -- doesn't require a probability measure over worlds at all. Dev, a second-year PhD student, pushed back, saying that the pointwise dominance argument is much weaker than it sounds, because it only works for a restricted class of scoring rules, and for the scoring rules that are most commonly used in the literature, you need the "expected" dominance argument, which requires a probability measure over worlds to compute expected accuracy. Marta replied that the expected dominance argument can be understood as a universal claim -- for any probability measure P over worlds, the expected accuracy of c with respect to P is less than or equal to the expected accuracy of p with respect to P -- and that this doesn't require you to have a specific probability measure, so it's not circular in the relevant sense. Dev then said that even as a universal claim, the argument still requires the concept of a probability measure to be stated, and if you don't already have a probability measure, how can you use the concept of a probability measure to argue that you should have one? Isn't that exactly the circularity that Joyce and others have pointed out?

  I couldn't resolve this, and I'd love a point-by-point adjudication of their exchange: specifically, I'd like to know who is right about the scope and strength of the pointwise dominance argument, whether the universal-claim reply to the circularity objection is successful, and what, if anything, both parties are missing in their exchange.
