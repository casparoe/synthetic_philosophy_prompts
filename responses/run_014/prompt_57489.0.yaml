  Okay, the user is preparing for a presentation at a European social choice workshop. Their paper critiques Harsanyi's social aggregation theorem and proposes a weakened axiom. They need a preparation sheet for Q&A, tailored to specific audience subgroups: mathematical economists, philosophers of economics, prioritarians, and experimentalists.

  First, I need to understand the core thesis. The user argues that Harsanyi's theorem relies on an implicit "transposition premise" about utility scale calibration. Their solution replaces Pareto indifference with "calibrated Pareto indifference" using a calibration lottery. This allows non-utilitarian representations while avoiding dictatorship.

  The audience composition matters here. With mostly mathematical economists focused on axiomatics, I should prioritize technical objections about representation classes and axiom independence. Philosophers will care about utility meaning and calibration observability. The lone prioritarian might challenge risk-attitude conflation, while experimentalists will question behavioral realism.

  For the Q&A prep, I'll structure 8-10 objections by damage level. Fatal objections would sink the paper if poorly answered - likely those about vacuity under belief heterogeneity or completeness loss. The calibration lottery's well-definedness with subjective beliefs seems particularly dangerous. 

  Key strategic moves: The user should immediately concede to axiomatizers that their representation loses linearity and requires stronger measurability - this builds credibility. The "must-land" reply is explaining how calibration lotteries fix scales without psychological similarity. 

  I should warn about objections the audience won't raise to prevent over-preparation. For instance, Sen's "no ethical conclusion" critique might not surface since this group accepts normative interpretations. 

  When reconstructing cited authors (Sen/Weymark/prioritarians), I'll flag where my phrasing may deviate from their exact arguments. The prioritarian risk-attitude point is particularly vulnerable to misrepresentation.

  Finally, I'll honestly assess my confidence levels. The fatal/inconvenient ranking feels solid based on standard modeling concerns, but I'm least sure about whether experimentalists would truly accept idealized reference prospects.
answer: |-
  Here is your preparation sheet, structured for maximum tactical utility. I've ordered objections by damage potential, flagged fatal vulnerabilities, and noted strategic concessions. Confidence in ranking: 90% (based on standard modeling priorities in this subfield). Least sure claim: The experimentalists' objection phrasing (audience temperament varies).

  ---

  ### **Fatal Objections (Sink the Paper if Badly Answered)**
  1.  **The Vacuity Problem (Axiomatizers)**
      *   *Objection:* "Your calibration lottery requires common subjective beliefs to define the 'same probability' evaluation. If individuals disagree on probabilities for the reference prospects, your calibration condition is vacuously satisfied *only if* we assume state-independent utilities, which you haven't justified. Without that, your 'calibrated Pareto indifference' imposes *no* restriction. Your representation class collapses to *all* possible aggregators, making your 'result' trivial."
      *   *Reply:* "The calibration lottery *implicitly defines* the reference events as having *objective, known probabilities* for the purpose of calibration. This is a common modelling device in foundational work (like Savage's 'small worlds'). We're fixing a common risk framework *for calibration only*, analogous to fixing a numeraire. It doesn't require individuals to share *all* beliefs, just to accept this common-risk construct for the specific calibration act."
      *   *Soft Spot:* Admitting it's a *stipulation* weakens "positive proposal" claims. Needs framing as a necessary, justifiable modelling choice for interpersonal comparison. If the audience rejects any objective probability construct, this fails.

  2.  **Completeness/Normative Bite Loss (Axiomatizers & Prioritarians)**
      *   *Objection:* "By conditioning Pareto Indifference on a prior calibration choice, you destroy the *completeness* of the social ordering over the vast majority of lotteries *until* a calibration is chosen. How is this a *social welfare functional*? More critically, what *normative* principle selects *which* calibration lottery is correct? You've traded one unmotivated premise (psychological similarity) for another (an arbitrary calibration act)."
      *   *Reply:* "The framework shows *what structure is added* by calibration. The key normative point is that *without explicit calibration*, Harsanyi's linearity is unjustified. Choosing a calibration *is* the ethical act of specifying interpersonal comparisons. My formalism makes this choice explicit and shows the space of possible aggregators it permits (utilitarian, prioritarian, etc.). Dictatorship *is* ruled out because calibration requires *all* individuals to accept the *common* risk structure for references."
      *   *Soft Spot:* Conceding the social ordering is incomplete pre-calibration is necessary. The defense hinges on this being the *point* – calibration is inherently value-laden. Normative bite comes *from* choosing the calibration.

  ---

  ### **Severely Damaging Objections (Require Strong, Clear Answers)**
  3.  **Observability/Meaning of Calibration (Philosophers of Economics)**
      *   *Objection:* "Your 'publicly identified reference prospects' sound like idealized thought experiments. How are 'best-case'/'worst-case' states meaningfully identified and empirically observed across diverse individuals? Isn't this just reintroducing a cardinalization problem under a different name? What operational procedure fixes these points independently of the very preferences we're trying to calibrate?"
      *   *Reply:* "The reference points aren't absolute metaphysical states; they are *contextually defined extremes within a specific domain* (e.g., starvation vs. luxury *within* the society under consideration). Their identification is a pragmatic, context-dependent social choice problem *itself*, highlighting the inescapable role of judgment in comparison. The calibration lottery uses *risk attitudes towards these agreed extremes* to pin down scales, leveraging observable choice behavior under risk."
      *   *Soft Spot:* Admits reliance on contextual judgment. "Agreed extremes" might be contested. Needs emphasis on *using revealed risk preferences* on defined points.

  4.  **Rank-Dependence/Prioritarianism Requires More (Prioritarians & Axiomatizers)**
      *   *Objection:* "You claim your class contains rank-dependent or prioritarian forms. But Harsanyi's framework assumes *EU* for individuals and social planner. Rank-dependent utilities (e.g., Prospect Theory) violate EU axioms. How do non-EU individual preferences fit? If individuals *are* EU, how does your calibration, which relies on EU properties, generate non-linear (e.g., concave) social aggregation without violating your own axioms?"
      *   *Reply:* "My framework *assumes EU for individuals and social planner*, like Harsanyi's base model. Within *that* EU world, calibrated Pareto indifference *allows* the social aggregation function to be non-linear in individual *utilities* (e.g., `W = Σ f(U_i)` with `f` concave). This is distinct from individuals having non-EU preferences. The aggregation is linear in the *representation* of the social preference over lotteries, but the *mapping* from individual utilities to social utility need not be linear."
      *   *Soft Spot:* Requires careful distinction between linearity in probabilities (EU) and linearity in individual utilities. Must clarify that `f(U_i)` is applied *after* EU scaling is fixed via calibration.

  5.  **Weymark's Point: VNM Isn't Enough (Axiomatizers)**
      *   *Objection:* "Weymark argued that VNM utilities are insufficient *even with a calibration* for meaningful interpersonal addition because they only capture attitudes to risk, not strength of preference in a level-comparable sense. Your calibration lottery fixes the *risk scaling*, but does it fix the *ethical scaling* needed for comparing welfare *levels* or *gains*? Isn't this just pushing Weymark's critique one step back?"
      *   *Reply:* "Weymark is right that VNM utilities *alone* lack level comparability. My calibration lottery *is* precisely an attempt to *define* an interpersonally comparable unit via shared risk on reference outcomes. It translates *risk attitudes* on extreme outcomes into a common *scale unit*. Whether this captures 'strength of preference' ethically is separate; it provides *a* coherent, choice-based foundation for comparison within the EU framework."
      *   *Soft Spot:* Concedes VNM utilities are only risk-based. Defense rests on this being the *best available* choice-based foundation for comparison within the model. Philosophers may pounce.

  6.  **Independence of Conditions (Axiomatizers)**
      *   *Objection:* "Are your weakened axiom system's conditions (EU, Calibrated Pareto) independent? If one implies the other under standard rationality assumptions, your 'weakening' might be illusory. Does Calibrated Pareto plus EU *actually* allow representations outside Harsanyi's linear class if we assume individuals satisfy EU?"
      *   *Reply:* "Yes, they are independent. EU alone (without any Pareto) permits *any* social EU representation. Standard Pareto Indifference forces linearity. Calibrated Pareto Indifference is strictly weaker than standard PI but stronger than no PI: It forces linearity *only once a calibration is fixed*, but allows different calibrations to yield different linear weights *or* non-linear aggregations (like prioritarian sums) *within* the representation permitted for a *given* calibration. Crucially, it forbids dictatorship by requiring the calibration act to be commonly accepted."
      *   *Soft Spot:* Needs crisp technical demonstration (have a simple 2-person, 2-state example ready). The non-linearity point (#4) is key here.

  ---

  ### **Significant but Manageable Objections**
  7.  **Descriptive Realism of Calibration (Experimentalists)**
      *   *Objection:* "Do lab subjects exhibit stable, consistent VNM preferences over the kinds of extreme 'best-case/worst-case' lotteries you propose for calibration? Prospect Theory suggests they won't! If not, your calibration procedure isn't behaviorally founded. Isn't this just replacing one unrealistic assumption (psychological similarity) with another (idealized reference lotteries)?"
      *   *Reply:* "You're absolutely right that real behavior deviates from EU. However, my aim is *normative* – what *should* rational, impartial aggregation look like? I use the idealized EU model, like Harsanyi and much of social choice theory, as a benchmark. The calibration lottery defines a *conceptual anchor* for comparison within this normative framework. Its purpose is clarity about foundations, not descriptive realism."
      *   *Soft Spot:* Cedes descriptive ground entirely. Frame it as a virtue (clarifying normative foundations) not a vice.

  8.  **Prioritarian Risk Collapse (Prioritarian)**
      *   *Objection:* "The veil of ignorance is meant to model impartiality. By using a calibration lottery *within* that veil, you conflate the impartial observer's risk aversion (which might reflect fairness concerns) with the individuals' personal risk aversions. A prioritarian wants to separate these – weighting worse-off individuals more heavily isn't the same as the observer being personally risk-averse behind the veil."
      *   *Reply:* "This is a key insight! My framework *allows* for this separation. The social aggregation function `W` derived *after* calibration *can* incorporate prioritarian weighting (e.g., `W = Σ g(U_i)` with `g` concave), which is distinct from the *individuals'* risk attitudes captured in their `U_i` and the *calibration* which fixes the scales. The calibration fixes the `U_i` scales; the shape of `W` reflects ethical priority."
      *   *Soft Spot:* Requires clear separation in the formalism between calibration (scale-fixing) and aggregation (ethical weighting). Emphasize `g` vs. the VNM `U_i`.

  9.  **Sen's "No Ethics" Charge (Philosophers of Economics)**
      *   *Objection:* "Sen argued Harsanyi's theorem shows consistency conditions for *one* observer's preferences, not ethical aggregation. Doesn't your 'calibrated observer' just make this one privileged observer's risk attitudes (via the calibration choice) the arbiter of interpersonal comparison? How is this *social* ethics rather than personalized decision-making under extended sympathy?"
      *   *Reply:* "Sen's point is valid for the *uncalibrated* theorem. My contribution is showing that *even if* we want to derive an ethical conclusion from such a setup, the critical move is the calibration. The 'impartial observer' is a *construct* for representing impartiality. The calibration lottery is the mechanism for making the interpersonal comparisons required for *any* aggregation explicit and contestable within that construct, moving it beyond mere personal extended sympathy."
      *   *Soft Spot:* Still leans heavily on the observer construct. Defense is that it makes the *comparison* step explicit and debatable. Concede Sen's core point applies to the setup itself.

  10. **Price of Weakening: Scope Restriction (Axiomatizers)**
      *   *Objection:* "By weakening Pareto Indifference, you restrict the domain of lotteries where social indifference is dictated. Doesn't this make your SWF less useful? For instance, can it rank policies affecting individuals not experiencing the reference extremes? What guarantees non-vacuity beyond the calibration context?"
      *   *Reply:* "The calibration lottery fixes scales *globally* for all states. Once scales are fixed via the common-risk reference lottery, Calibrated Pareto Indifference applies to *all* lotteries using those fixed scales. The social ordering becomes complete and comparable across all prospects *after* calibration. The 'price' is requiring an explicit calibration step, not domain restriction."
      *   *Soft Spot:* Relies on the calibration defining globally comparable units. See Vacancy (#1) and Observability (#3) risks.

  ---

  ### **Strategic Concessions & Must-Land Reply**
  *   **Concede in First 5 Minutes (For Axiomatizer Credibility):** "You're right to note that my framework abandons the *linearity* of Harsanyi's aggregation. That's the point: linearity requires an unmotivated cardinal equivalence. I also require stronger measurability assumptions – specifically, that interpersonally comparable VNM units *can* be defined via shared risk on reference outcomes. This is a substantive, non-trivial assumption."
  *   **The Must-Land Reply (For Project Survival):** Addressing **Objection #1 (Vacuity)**. If you don't persuasively defend the calibration lottery as well-defined (via objective/stipulated probabilities for references) and non-vacuous (by providing meaningful scale fixation even with belief heterogeneity elsewhere), the core mechanism fails. Phrase it: "The calibration lottery establishes a *common-risk baseline* for interpersonal unit comparison. It doesn't require uniform beliefs generally, only accepting this *specific*, context-defining shared risk construct. This provides the necessary cardinal anchor Harsanyi lacked." Land this, or the paper sinks.

  ### **The Question You Hope Nobody Asks**
  *   **"What if individuals have *state-dependent* utilities for the proposed 'best-case' and 'worst-case' reference prospects? Doesn't this completely undermine the interpretation of the calibration lottery, as VNM utilities lose their simple affine uniqueness, making your scale fixation ambiguous or impossible?"** (This is highly technical and less likely from this audience than #1, but fatal if raised by a sharp axiomatizer. Have a sketch ready: argue reference points should be chosen where state-dependence is minimized/irrelevant, or admit it's a limitation requiring state-independence near references as an auxiliary assumption).

  ### **Over-Prepared For (Likely Won't Be Raised Here)**
  *   **Sen's "No Ethics" Charge (Objection #9)**. While you're braced for it, this audience (focused on normative axioms) generally *accepts* using observer frameworks for ethics. They are more likely to attack the *internal mechanics* (#1, #2, #4, #6) than the *entire normative enterprise* Sen sometimes questioned. Don't over-rehearse this defense.
  *   **Deep Metaethics**. You noted they don't want it. They likely won't ask "But what *is* utility really?" beyond the measurement concerns in #3.

  ### **Assessment of Reconstruction Accuracy**
  *   **Sen:** My phrasing captures Sen's *general skepticism* about deriving ethics from observer preferences. While he made nuanced points about sympathy vs. commitment, the core charge attributed here ("shows one observer, not ethics") is a fair summary of one major thrust of his critique of Harsanyi.
  *   **Weymark:** My phrasing of Weymark's point ("VNM isn't enough") accurately reflects his central argument that VNM utilities, being only unique up to affine transformation *per individual*, lack the level comparability needed for traditional utilitarian summation without additional strong assumptions. Your calibration is an attempt to provide such an assumption.
  *   **Prioritarian Risk Collapse:** My phrasing of the prioritarian concern (conflating risk attitudes) accurately reflects a standard critique *of Harsanyi's utilitarian interpretation* (e.g., by Fleurbaey, Adler). Your framework is *defended* as *allowing* separation, which is your novel point. The objection (#8) states the standard critique correctly; your reply is your innovation.

  **Your Strongest Point:** Making the calibration step explicit and showing it's necessary and sufficient to open the space beyond utilitarianism while retaining core rationality (EU) and non-dictatorship.
  **My Least Sure Claim:** That the experimentalists will *specifically* frame their objection around Prospect Theory and "best/worst-case" stability (**Objection #7**). They might just say "unrealistic", but the Prospect Theory angle is a likely sharper version.

  **Final Confidence:** 85% in overall structure/damage assessment. The fatal/non-fatal line hinges on whether the audience accepts the calibration lottery construct under belief heterogeneity (#1). If they broadly do, you survive; if they broadly reject it, the paper sinks. Prepare accordingly. Good luck!
