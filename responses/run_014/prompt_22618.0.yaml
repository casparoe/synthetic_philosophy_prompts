  I've been reading about logical induction and I keep thinking it's just Bayesian updating with an extra step. If you're not allowed to be Dutch-booked by logical consequences, doesn't that force your probabilities to line up with everything that follows from what you already believe? So what's actually different between logical induction and the standard Bayesian agent who is logically omniscient but just uncertain about facts?
