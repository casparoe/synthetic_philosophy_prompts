  ### Addressing Your Specific Queries

  #### 1. Modal Logic Requirements
  - **Claim**: The proof only needs **KT** (normal modal logic with truth axiom).  
  - **Verification**: Correct. The proof uses:  
    - **Normality**: `K(a ∧ b) → K(a) ∧ K(b)` (distribution over conjunction).  
    - **Truth axiom**: `K(p) → p` (factivity).  
    - **No introspection (S4/S5)**: Positive/negative introspection unused.  
  - **Impact on Translation**:  
    - Weak axioms make the paradox *harder* to map to computability.  
    - KT assumes minimal structure—`K` is just a factive, conjunction-distributing operator.  
    - In PL terms: `K` is a total function that respects logical connectives but isn't computable or introspective.  
    - **Conclusion**: Weaker axioms *strengthen* the paradox by making it more general. No distortion introduced here.

  #### 2. Effective Knowability (Turing-Computable Knowledge)
  - **Setup**: "Knowable" means computable by a Turing machine (TM). `K(p) = true` iff some TM halts and accepts `p`.  
  - **Analysis**:  
    - **Counterexample `q`**: Define `q = p ∧ ¬K(p)`, with `p` true and not known.  
    - **Is `q` effectively knowable?**  
      - Yes! A TM `M_q` can exist:  
        ```python
        def M_q(proposition):
            if proposition == q:   # Syntax check
                return p() and not K(p)  # K(p) might not halt!
            else: 
                reject
        ```  
      - `M_q` accepts `q` iff `p` is true and no TM accepts `p`.  
    - **Contradiction?**  
      - Knowability requires a TM for `q` (which exists: `M_q`).  
      - But knowing `q` does *not* require `K(p)` or `K(¬K(p))`—different TMs handle different propositions.  
      - No fixed-point collapse because no single `K` is applied universally.  
  - **Breakage and Insight**:  
    - The paradox **fails** for effective knowability.  
    - **Why**: The original paradox relies on a *single fixed* `K` evaluating *all* propositions (including self-referential ones). Effective knowability uses *different machines* for different propositions, avoiding self-reference in `K`.  
    - **Force of the Original Paradox**: It derives power from idealizing knowledge as a universal, uniform operator (like a halting decider). Effectiveness distributes knowledge across machines, breaking uniformity.  
  - **Conclusion**: The paradox requires knowledge to be "global"; computability makes it "local." This shows the paradox is fundamentally about ideal agents, not effective procedures.

