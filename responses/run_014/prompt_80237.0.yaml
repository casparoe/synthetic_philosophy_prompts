  ### Fitch's Knowability Paradox Translated into Programming-Language Vocabulary

  #### Core Concepts Mapped:
  - **Propositions**: Programs or expressions that output a truth value (type `Prop`).
  - **Knowledge operator `K`**: A function `K: Prop → Bool` representing "agent knows proposition `p`". We assume `K` is total (halts for all inputs) and has denotational semantics (behavior defined for all inputs).
  - **Knowability principle**: "Every truth is knowable" → For every true proposition `p`, there exists a possible state/world where `K(p) = true` (interpreted as `K` being able to "recognize" `p` when evaluated in that state).
  - **Self-reference**: Achieved via quine-like techniques or fixed points, allowing propositions to reference their own knowledge state.
  - **Reductio ad absurdum**: A fixed-point collapse where self-referential input forces `K` into an inconsistent state.

  #### Step-by-Step Translation of the Proof:
  1. **Assumption (for reductio)**: There exists a true proposition `p` that is not known: `p ∧ ¬K(p)`.
     - Computational analog: `p` is a program that evaluates to `true`, but `K(p)` returns `false` (agent doesn't know `p`).

  2. **Construct the counterexample `q`**:  
     Define `q = p ∧ ¬K(p)`.  
     - Since `p` is true and `¬K(p)` is true, `q` is true.  
     - Computational analog: `q` is a program that:  
       ```python
       def q():
           return p() and not K(q)  # Self-reference via quine: q checks if it itself is known.
       ```
       - **Key distortion**: In the original proof, `q` references `K(p)`, not `K(q)`. We force self-reference to mimic diagonalization. This is a minor distortion for computational expressiveness, but preserves the spirit of referencing knowledge within the proposition.

  3. **Apply knowability to `q`**:  
     Knowability principle says `q` is knowable: `◇K(q)` → There exists a state where `K(q) = true`.

  4. **Distribute knowledge over conjunction**:  
     If `K(q) = true` (in some state), then:  
     - `K` must know `p`: `K(p) = true` (since `q` contains `p`).  
     - `K` must know `¬K(p)`: `K(¬K(p)) = true`.  
     - Computational analog: `K` decomposes `q` as `p ∧ ¬K(p)`. This requires:  
       ```python
       def K(prop):
           if prop == q:  # Pattern-match on q
               assert K(p) and K(not K(p))  # Distribution over conjunction
       ```

  5. **Factivity (truth axiom)**:  
     `K(¬K(p)) = true` → `¬K(p)` must be true (if `K` knows something, it must be true).  
     - So: `¬K(p) = true`.

  6. **Contradiction**:  
     From `K(q) = true`, we have `K(p) = true` (distribution).  
     But from `¬K(p) = true`, we have `K(p) = false`.  
     → `K(p)` and `¬K(p)` conflict.  
     - Fixed-point collapse: When `K` evaluates `q`, it must compute `K(q)`, which depends on `K(p)`, which depends on `q`—a recursive loop with no consistent solution. This mirrors a fixed-point combinator (e.g., Y-combinator) failing to converge.

  7. **Reductio conclusion**:  
     Assumption `p ∧ ¬K(p)` must be false. Thus, all truths are known: `∀p, p → K(p)`.

