  #### Genuine Epistemic Residue (No Computational Counterpart):
  1. **Normality/distribution over conjunction**:  
     - `K(a ∧ b) → K(a) ∧ K(b)` is epistemic.  
     - In computability: A function can return `true` for a conjunction but fail for a conjunct (e.g., if `K` is a proof verifier lacking resources).  
     - **Significance**: This axiom enables the contradiction. Computability lacks this constraint—it's uniquely epistemic.

  2. **Possibility modal operator (`◇`)**:  
     - "Knowable" means accessible in some possible world, not computable.  
     - Computability uses existential quantification over TMs ("exists a machine"), but possibility is modal, not effective.  
     - **Significance**: The paradox holds for ideal agents, not necessarily effective ones (see below).

  3. **Agent's self-knowledge gap**:  
     - `K(¬K(p))` forces the agent to know its own ignorance.  
