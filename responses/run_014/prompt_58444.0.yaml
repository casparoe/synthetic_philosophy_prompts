prompt: |-
  hey so im a junior and im running for student council president and voting is literally this friday and i need to know if im being shady or if this is just normal campain stuff

  so im running against this senior guy and my older sister saw what ive been doing and said its manipulative and i should just argue my ideas straight up. but like heres what ive been doing:

  first i posted on my story that if regular kids dont vote then only his friend group will and we will definately end up with lame stuff like longer study hall or no off-campus lunch. i dont actually know he wants that but he might, his friends are like that.

  second ive been dming a ton of freshmen like hey i remember you from orientation you were super nice, even tho i honestly barely remember anyone, just so they feel special and say theyll vote for me. it works tho.

  third i posted a screenshot of a poll where im winning like 70-30 but tbh i only sent it to my friends and my sisters friends so of course i was winning.

  the thing is i actually think id be way better, i want to keep the vending machines and make prom tickets cheaper and he doesnt care about any of that. does that make it okay?

  like which of this stuff is actually wrong and what should i change before friday?
reasoning: |-
  Okay, this user is a junior running for student council president against a senior, and voting is this Friday. They're worried that their campaign tactics might be shady after their sister called them manipulative. Let me break down their strategies.

  First, they posted on their story suggesting that if regular kids don't vote, only the opponent's friends will, leading to longer study hall or no off-campus lunch. They admit they don't know if their opponent actually supports those ideas. This seems like spreading misinformation or fear-mongering. Even though they believe they'd be better, making assumptions about the opponent's plans without evidence is dishonest. It could backfire if people find out it's not true.

  Second, they're DMing freshmen pretending to remember them from orientation to make them feel special and get votes. While campaigning involves reaching out, the insincerity here is problematic. If the freshmen realize it's a tactic, it could damage trust. Building genuine connections would be more ethical and sustainable, even if it takes more effort.

  Third, they shared a poll screenshot showing them winning 70-30, but only polled their friends and sister's friends. This is misleading because it's not representative. Creating a false sense of inevitability might discourage the opponent's supporters or make their own complacent. Transparency about the poll's limited scope would be better, but even then, it's sketchy.

  The user justifies these tactics by believing they'd be a better president, wanting to keep vending machines and lower prom ticket prices. Good intentions don't excuse dishonest methods. The sister's advice to argue ideas straight up is solid. The user needs to pivot quickly before Friday.

  Underlying needs: The user seems anxious about winning, possibly feeling the senior has an advantage. They might lack confidence in their platform's appeal or think underhanded tactics are necessary. Reassurance that a strong, honest campaign can work is key. They need actionable steps to correct course without feeling overwhelmed.

  Potential risks: If exposed, these tactics could lead to backlash, loss of trust, or disqualification. High school elections matter for reputation. The user might not realize the long-term impact on their credibility.

  Actionable fixes: Remove the misleading posts, apologize if necessary. Focus on genuine outreach, like asking underclassmen about their concerns. Highlight specific plans for vending machines and prom tickets. Use real data or petitions to show support instead of fake polls. Rally friends to spread positive messages.

  Overall, the user needs to shift to transparency and authenticity. They have valid ideas; emphasizing those ethically could resonate more. Time is short, but quick corrections can salvage their campaign's integrity.
answer: |-
  Okay, this is a classic high school election ethics dilemma! Let's break down your tactics honestly. Your sister has a point about some of this being manipulative, but the good news is you have time to pivot to a stronger, more ethical campaign before Friday.

  Here's the breakdown of your tactics:

  1.  **"If regular kids don't vote... only his friends will vote... lame stuff like longer study hall..."**
      *   **What's Shady:** This is **fear-mongering** and **misinformation**. You admit you don't know his actual platform. You're inventing negative consequences and attributing them to him to scare people into voting *against* him (or for you by default), rather than *for* you based on your ideas. It paints his supporters (his friends) as the enemy trying to impose unpopular things.
      *   **Why it's Problematic:** It's dishonest and divisive. If someone calls you out on it (especially him), it makes *you* look untrustworthy and willing to smear your opponent. It also doesn't showcase *your* strengths.
      *   **Fix Before Friday:** **DELETE THIS POST IMMEDIATELY.** Focus on the *positive* reasons people should vote *for you*: "Don't let *your* voice go unheard! Vote for [Your Name] to keep the vending machines & make prom affordable!" Shift the focus to *your* platform and voter empowerment.

  2.  **DMing Freshmen: "Hey I remember you..."**
      *   **What's Shady:** This is **insincere flattery** used purely for manipulation. You're pretending a personal connection exists solely to get a vote.
      *   **Why it's Problematic:** It's transparently fake. If multiple freshmen compare notes (which happens!), they'll realize it's a mass tactic, making you seem phony and desperate. It undermines genuine relationship building.
      *   **Fix Before Friday:** **STOP THE FAKE DMs.** Instead, **reframe your outreach:**
          *   "Hey [Name], saw you around orientation! I'm [Your Name], running for President. I'm fighting to keep the vending machines & lower prom costs because I think student money matters. What issues are important to *you* this year?" (Shows interest in THEM).
          *   "Hi [Name]! [Your Name] here, running for Prez. Wanted to reach out directly to freshmen because I know starting HS is a big deal! I'm focused on making things affordable (prom!) and keeping the little perks (vending machines!). Check out my ideas [link if you have one, or offer to chat]." (Honest, policy-focused).
          *   **Focus on your platform and asking about *their* concerns.** Authenticity builds trust.

  3.  **Posting a Screenshot of a Biased Poll (70-30 from friends only)**
      *   **What's Shady:** This is **deliberately misleading**. You know the poll isn't representative of the whole student body. You're creating a false sense of inevitability ("bandwagon effect") to pressure people into voting for the perceived winner.
      *   **Why it's Problematic:** It's dishonest advertising. If people realize the poll was rigged (e.g., only sent to your supporters), it destroys your credibility. It can also backfire by motivating *his* supporters to vote harder to prove it wrong.
      *   **Fix Before Friday:** **DO NOT POST ANY MORE POLLS LIKE THIS.** If you absolutely must show momentum:
          *   Post a picture of *real* supporters with signs saying "Team [Your Name]!" (Shows genuine enthusiasm).
          *   Say something like "So grateful for all the support from people who want affordable prom & our vending machines!" (Focuses on *why* people support you).
          *   **Honesty is best:** Avoid fake statistics.

  **Why "I'd be better" doesn't automatically make it okay:**

  Your good intentions (vending machines, cheaper prom) are your *strength*, but they don't justify shady tactics. Using manipulation to win damages your credibility *before you even take office*. People will question your motives and trustworthiness. Winning ethically means you have a stronger mandate and more respect when you try to implement your ideas.

  **What You Should Do Before Friday (The Ethical Pivot):**

  1.  **Delete the Fear-Mongering Post:** Take it down ASAP.
  2.  **Stop the Fake DMs:** Switch to genuine, policy-focused outreach.
  3.  **Focus HARD on Your Platform:** Make EVERY post, conversation, and flyer about:
      *   **KEEPING THE VENDING MACHINES:** Why? (Convenience, affordability, student choice).
      *   **MAKING PROM TICKETS CHEAPER:** How? (Negotiate with vendors? Fundraise? Find sponsors?) Why is this important? (Accessibility, less financial stress).
      *   **Add 1-2 more concrete, positive ideas if possible** (e.g., "More diverse food options at games," "Streamlined process for club funding").
  4.  **Contrast Honestly (If Needed):** Instead of making stuff up, say: "I know my opponent is a senior and has his priorities. Mine are clear: fighting for student affordability and keeping the small things we enjoy, like the vending machines. I believe these everyday issues matter most." (This positions you without smearing him).
  5.  **Mobilize Your Network Honestly:** Get your friends and sister's friends to:
      *   Share your *actual policy posts*.
      *   Talk to people *genuinely* about why *they* support you (vending machines, prom costs).
      *   Remind people to vote.
  6.  **Own It (If Confronted):** If anyone mentions the old posts/DMs? Be humble: "Yeah, I got a bit caught up in the campaign rush earlier this week and posted some things I shouldn't have. I've taken them down. What I really want to talk about is how we can keep prom affordable and save the vending machines. That's what matters to me."

  **Bottom Line:** You have good ideas that resonate (vending machines & prom costs!). **Focus on those strengths with honesty and energy.** Ditch the manipulation – it risks backfiring and undermines the very trust you need to be an effective president. A campaign based on genuine enthusiasm for your positive ideas is always stronger and more sustainable than one built on fear, flattery, and fake polls. Good luck on Friday – you can win this the right way!
