          Finally, reveal that Rule 1 is inspired by William James and Rule 2 by Charles Sanders Peirce.

          What the activity can't reproduce:

            - James's idea that truth is made in the process of verification? The activity has a fixed pattern.

            - The idea of the "whole of experience" for James: the activity only has the weather and the forecast.

            - The ideal limit of inquiry for Peirce: we are simulating it by revealing the pattern at the end, but in reality we never reach it.

          We will have to supply these nuances in the debrief.

