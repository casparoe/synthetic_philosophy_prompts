  ### In-Class Activity: Truth Convergence vs. Immediate Payoff  
  **Objective:** Students experience the tension between a belief that "pays off" immediately (James) and one that would be "converged upon" after sustained inquiry (Peirce) without knowing the theories beforehand.  

  ---

  #### **Materials**  
  1. **Mystery Boxes (2 per group):** Small, identical boxes labeled A and B. Each contains a hidden symbol (♣/♥) determining a "truth state."  
     - **Box A:** Fixed symbol (e.g., ♥) for all groups. Represents "convergent truth" (Peirce).  
     - **Box B:** Symbol changes per round based on a biased coin flip (70% ♥, 30% ♣). Represents "immediate payoff" (James).  
  2. **Decision Sheets:** Tables for recording choices, payoffs, and rationales (see template below).  
  3. **Token System:** Poker chips or paper tokens (red = +1, blue = -1) for payoffs. No real money needed.  

  #### **Rules for True Belief**  
  - **Rule 1 (Immediate Payoff):** A belief is "true" if acting on it yields the best *immediate* outcome.  
  - **Rule 2 (Convergent Truth):** A belief is "true" if it matches the outcome after *repeated testing* (even if it fails now).  

  #### **Setup**  
  - Divide class into groups of 3.  
  - Each group gets Box A and Box B.  
  - **Key Twist:** Box A’s symbol is fixed (e.g., ♥). Box B’s symbol is determined per round by instructor (e.g., 70% ♥). Groups *don’t know* this.  

  ---

  ### **Activity Timeline (80 min)**  
  #### **Round 1: Initial Testing (15 min)**  
  - **Task:** Groups test each box 5 times. Each test = picking a box to "bet" on.  
    - Bet on Box A/B by placing a token on it.  
    - Instructor reveals Box B’s symbol (biased 70% ♥). Box A’s symbol *always* remains ♥ (hidden until final reveal).  
  - **Payoff Scheme:**  
    | **If you bet on...** | **And the box shows...** | **Points** |  
    |-----------------------|---------------------------|------------|  
    | Box A (convergent)    | ♥ (hidden truth)          | +1        |  
    | Box A                 | ♣                         | -1        |  
    | Box B (immediate)     | ♥ (common outcome)        | +1        |  
    | Box B                 | ♣ (rare outcome)          | -1        |  
  - **Process:**  
    1. Groups bet on A or B for 5 trials.  
    2. After each bet, instructor reveals Box B’s outcome (e.g., ♥/♣). Box A’s outcome is *not* revealed yet.  
    3. Groups record payoffs and rationales (e.g., "Bet on B because it’s been ♥ most times").  

  #### **Round 2: Conflict Cases (20 min)**  
  - Groups bet 5 more times, but with a twist: **Intermittent Discrepancies**.  
    - **Trial 6-7:** Box B shows ♥ (70% payoff).  
    - **Trial 8:** Box B rigged to show ♣ (30% failure).  
    - **Trial 9-10:** Box B shows ♥ again.  
  - **Critical Moments:**  
    - Trial 8 forces Box B to "fail" (♣), punishing Rule 1 believers.  
    - Box A *always* pays if chosen (but students don’t know this yet).  

  #### **Round 3: The Reveal (10 min)**  
  - Groups bet a final time on which box is "truly" reliable.  
  - **Instructor reveals:**  
    - Box A *always* had ♥ (convergent truth after all tests).  
    - Box B’s outcomes were random (70% ♥).  
  - Groups calculate total points from all bets.  

  ---

  ### **Debrief (25 min)**  
  1. **Group Reflections (5 min):**  
     - "Which box felt more reliable? Why?"  
     - "When did betting on Box B backfire? When did Box A feel risky?"  

  2. **Map to Theories (15 min):**  
     - **Reveal Rule 1 (James):**  
       - "Box B ‘worked’ when it paid off immediately (e.g., Trials 1-7, 9-10). James says a belief is true if it ‘works’ by fitting experience *now*."  
       - **Activity Link:** "In Trial 8, Box B *didn’t* work—so James would say trusting it was ‘false’ *in that moment*."  
     - **Reveal Rule 2 (Peirce):**  
       - "Box A *always* had ♥—the belief we’d converge on after endless tests. Peirce says truth is what *would* be agreed upon at the ideal limit of inquiry."  
       - **Activity Link:** "Even when Box A wasn’t tested (e.g., Round 1), it was ‘true’ in the long run. Betting on it in Trial 8 would’ve paid off, but you lacked data."  
     - **Divergence Highlight:**  
       - Box B in Trial 8: Worked for Rule 1 in prior trials but failed when Rule 2 would’ve succeeded.  
       - Box A early on: Felt unrewarding (since untested) but was Rule 2’s convergent truth.  

  3. **Nuance Discussion (5 min):**  
     - **What the Activity Can’t Capture:**  
       - James’ "whole of experience" isn’t just immediate payoff—it includes coherence with past/future. Here, Box B’s coherence was *simulated* via bias, but James might argue repeated payoffs create a "true" belief even if it fails occasionally.  
       - Peirce’s "limit of inquiry" is idealized and unobservable. Here, we simulated it with Box A’s fixed truth—but in reality, we never *reach* the limit.  

  ---

  ### **Why This Works**  
  - **Divergence Felt, Not Argued:** Students experience Box B’s short-term rewards (James) vs. Box A’s hidden consistency (Peirce).  
  - **Conflict Points:** Trial 8 (Box B fails) creates a visceral "ah-ha" moment where immediate payoff clashes with convergent truth.  
  - **Low Stakes, High Impact:** Tokens make payoffs tangible; hidden mechanics force reliance on beliefs.  

  **Instructor Note:** Emphasize that James isn’t *just* about selfish gain—he’d argue Box B’s 70% success "fits" a probabilistic world. But the activity isolates the core tension: **Is truth what pays off *now*, or what *would* endure after infinite tests?** This mirrors your debate with your friend.
