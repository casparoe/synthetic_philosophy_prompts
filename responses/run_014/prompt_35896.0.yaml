prompt: |-
  My coworker (total podcast guy, thinks he's a philosopher) gave me this whole speech about voting the other day and I want to know if he's actually right or just sounds right. Basically what he said was: the chance that your one vote decides anything is basically zero, so voting can't be justified by its consequences. And the philosophers who claim there's a duty to vote are secretly just multiplying a tiny probability by a huge payoff, which he says is like buying lottery tickets and calling it charity. Then he said political scientists have shown that people vote "expressively" — meaning since your vote doesn't matter anyway, you vote for whoever makes you feel good about yourself, like cheering for a sports team. So voting is basically a hobby, there's no duty to do it, and the whole "vote because people died for the right" thing is just guilt tripping.

  On top of that, when I asked about voting for the lesser evil he said: if you vote for the lesser evil you have still voted for evil. You're partly responsible for the bad stuff that candidate does, because you put them in office, whereas if you stay home your hands are clean. So he says the rational move is either stay home, or vote third party purely as an expression of your values, since either way nothing you do changes the outcome so you might as well feel good about it.

  I feel like some of this has to be right (the math part at least) but the whole package feels too convenient, like he's proving too much. Also something about the "clean hands" bit bugs me — if everyone followed it, the greater evil wins, so how are my hands clean? But maybe that's just me not liking his conclusion. He's read way more about this than me so I can't really argue.

  Can you go through his little speech bit by bit and tell me what's solid, what's stretched, and what's just wrong? Like, which parts would a philosopher who studies voting ethics actually accept, which are popularizer-level simplifications, and where is he sneaking something in? And specifically: does his "no duty to vote" conclusion follow from the parts he gets right, and does his clean-hands argument against lesser evil voting actually hold up? Please keep it to 450 words max, I want to be able to throw it back at him over lunch.
reasoning: |-
  Okay, the user's coworker has presented a series of arguments against voting, and the user wants a clear breakdown of what's valid, what's questionable, and what's incorrect. The coworker's points are: (1) the probability of one vote mattering is near zero, so consequentialist justification fails; (2) the duty to vote is like buying lottery tickets for charity; (3) people vote expressively as a hobby; (4) voting for the lesser evil still makes you responsible for their actions; and (5) staying home keeps your hands clean. The user feels this is "too convenient" and questions the clean-hands argument especially.

  First, I need to address the probability argument. It's true that a single vote almost never decides an election. But philosophers like Parfit argue that even if one vote doesn't change the outcome, each vote contributes to a collective action problem. When many people vote, each vote is part of a larger set that determines the outcome. So the duty to vote isn't just about individual impact but about collective responsibility. The lottery analogy is flawed because voting isn't about high-payoff events; it's about participation in a system where everyone's contribution matters.

  Next, the expressive voting theory. Political scientists like Brennan do argue that people vote to express identity, but that doesn't mean voting is merely a hobby. Sociologists point out that voting strengthens civic bonds and reinforces democratic norms. Even if a vote is expressive, it can still serve a societal function beyond personal satisfaction.

  The lesser evil argument is tricky. The coworker claims that voting for a candidate makes you responsible for their actions. But this ignores the moral difference between candidates. Philosophers like Goodin argue that in a binary choice, not voting for the lesser evil allows the greater evil to win. Responsibility isn't solely about causation; it's also about preventing worse outcomes. If you abstain and the worse candidate wins, you might share responsibility for not acting to prevent it.

  The clean-hands claim is misleading. In elections with two viable candidates, abstaining doesn't absolve responsibility; it might increase the chances of the worse outcome. The "clean hands" idea assumes non-participation has no consequences, but in close elections, collective abstention can change results. Voting for a third party might express values, but in a first-past-the-post system, it can split votes and help the greater evil win.

  The user’s intuition about collective action is key. If everyone followed the coworker's logic, democracy would collapse. The duty to vote isn’t based on individual impact but on civic participation as a shared norm. The coworker’s arguments rely on individualistic reasoning while ignoring systemic effects. His points about probability and expressive voting are partially true but overextended to dismiss voting entirely. The clean-hands argument falls apart when considering moral responsibility in collective actions.
answer: |-
  Here's a breakdown of your coworker's arguments, focusing on accuracy, philosophical nuance, and where his logic falters (within 450 words):

  1.  **"One vote's impact ≈ zero, so no consequentialist justification":**
      *   **Solid:** The probability *is* vanishingly small in large elections. Consequentialism (acting based on outcomes) *is* hard to justify individually.
      *   **Stretched/Simplified:** Ignores collective action problems (Parfit's "Harmless Torturers"). If *everyone* reasoned this way, democracy fails. Philosophers (e.g., Goodin, Brennan) debate if tiny chances multiplied by massive stakes *can* create a duty, like preventing catastrophes.
      *   **Wrong Implication:** This alone doesn't erase *all* duty to vote. Duties can arise from fairness (others vote), civic reciprocity, or upholding the system.

  2.  **"Duty to vote = like charity lottery tickets":**
      *   **Popularizer-Level:** Oversimplifies the philosophical debate. While some critiques sound like this (Brennan), most duty arguments are *not* based *solely* on improbable pivotalness. They emphasize participation's intrinsic value, fairness, or system maintenance.

  3.  **"People vote expressively (like sports) = voting is just a hobby":**
      *   **Solid:** Political scientists (e.g., Brennan, Schuessler) *do* identify expressive voting – signaling identity/values feels good.
      *   **Stretched:** Calling it *just* a hobby ignores other proven motivations: sense of civic duty, group obligation, perceived closeness of the race. Expressive doesn't mean *only* or *merely* expressive.
      *   **Wrong Implication:** Even if expressive, it can still serve societal functions (reinforcing norms, signaling preferences).

  4.  **"Voting lesser evil = responsible for their evil. Staying home = clean hands":**
      *   **Logically Flawed (Key Weakness):** This is a classic error. Abstaining doesn't make you a passive observer; it's an *action* (or inaction) with consequences in a competitive system.
      *   **Why it Fails:**
          *   **Collective Impact:** If enough like-minded people abstain, the *greater* evil wins. Your inaction *contributed* to that worse outcome. Your hands aren't clean; you failed to help block the greater harm.
          *   **Comparative Responsibility:** Voting for the lesser evil reduces expected harm compared to actions (or inactions) that increase the chance of the greater evil winning. You bear *less* responsibility for the outcome than if you'd helped the greater evil win or enabled it via abstention. Philosophers (e.g., Kamm) discuss thresholds for complicity – voting lesser evil often falls below it when the alternative is worse.

  5.  **"Rational move: Stay home or vote 3rd party expressively":**
      *   **Stretched:** Only "rational" under a hyper-individualistic, purely expressive, and consequence-*denying* framework. Ignores the collective rationality of preventing the worst outcomes and the potential moral cost of enabling them through inaction.

  **Conclusion on His Points:**

  *   **He's Partially Right About:** Low individual vote impact, existence of expressive voting, weakness of *purely* consequentialist/statistical duty arguments, potential for guilt-tripping rhetoric.
  *   **He Overextends/Simplifies:** Dismissing *all* duty arguments, reducing voting *only* to expression/hobby, misapplying the "clean hands" idea.
  *   **His Conclusion Doesn't Fully Hold:** The "no duty" conclusion requires ignoring non-consequentialist duty arguments (fairness, reciprocity, system health). His "clean hands" argument against lesser evil voting is **fatally flawed** because abstaining often *increases* the likelihood of the greater evil winning, making you causally responsible for a worse outcome. Voting third party *can* be expressive, but in FPTP systems, it often functionally aids the greater evil, contradicting the "clean hands" goal. Philosophers widely reject this absolutist "clean hands" view in lesser-of-two-evils scenarios. Your intuition about collective failure is correct – his logic, if universalized, guarantees worse outcomes.
