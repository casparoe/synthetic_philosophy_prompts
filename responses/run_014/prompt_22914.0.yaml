  ## Forcing the Verdict: Why Grounding Sinks Molinism and Flicker Merely Stings

  The debate over the ontological status of Counterfactuals of Creaturely Freedom (CCFs) – propositions like "If Sandra were in circumstances C, she would freely choose A" – lies at the heart of the centuries-old clash between Molinism and Ockhamism. While both positions aim to reconcile divine providence with libertarian freedom, they offer radically different accounts of *what makes CCFs true*. The Molinist insists CCFs are true *prior* to and *independent* of God’s creative decree and any actual free choices; they are objects of "middle knowledge." The Ockhamist contends that CCFs are true *because* of, and thus *grounded in*, the agent’s actual free choices made within the actualized world. Your frustration with apparent circular restatements is astute; part of the stalemate *is* verbal, rooted in competing intuitions about truth-bearers and freedom. However, a substantive core remains. When weighing the grounding objection and the flicker of freedom objection against Molinism, **the grounding objection proves decisively fatal, while the flicker objection, though damaging to a specific libertarian picture, leaves Molinist freedom conceptually coherent, albeit metaphysically mysterious. The verdict is therefore for Ockhamism on the priority question: CCFs are ontologically posterior to, and grounded by, the agent’s free choice.**

  **The Core Positions Restated (Briefly):**
  *   **Molinism (Priority to CCFs):** CCFs are contingently true propositions known by God *prior* to His decree to create. Their truth does not depend on God's will nor on the actual existence of the creatures or choices they describe. They are brute facts about how free creatures *would* choose in any possible situation. God uses this knowledge to actualize a world where His providential plan is infallibly fulfilled *through* the genuine free choices of creatures, choices that remain truly open to them in their specific moments of decision.
  *   **Ockhamism (Priority to Choice):** CCFs are true *because* of the agent’s free choice. Prior to creation and the agent’s actual choice, the CCF ("S in C would freely do A") lacks a definite truth-value. Only when S is *actually* in C and *freely chooses* A (or not-A) does the corresponding CCF become true. The agent’s free act is the ontological ground and truthmaker for the CCF. Providence works with God’s knowledge of *what He Himself will freely do* and His knowledge of the *actual* free choices of creatures as they unfold.

  **Weighing the Objections:**

  1.  **The Grounding Objection: The Fatal Blow**
      *   **The Challenge:** What, *ontologically speaking*, makes a Molinist CCF true? If S does not yet exist, and her free choice in C has not occurred (and may never occur), what is the *truthmaker* for "S in C would freely do A"? The Molinist denies it's grounded in God’s nature (like necessary truths) or His decree (which comes later). It cannot be grounded in S's essence, as her essence doesn't specify *free* choices. Appealing to abstract possible worlds merely relocates the problem: what grounds the truth about S's *free* choice *in* that merely possible world? The objection charges Molinism with positing "truths without truthmakers" – free-floating facts about non-existent entities making non-actual choices. This violates a widely held metaphysical principle: truth supervenes on being. If there is no difference "on the ground" (no existing entities or states of affairs differing), there can be no difference in truth-value.
      *   **Damage Assessment:** **Catastrophic.** This strikes at the very coherence of Molinist *ontology*. If the Molinist CCFs lack truthmakers, they lack truth-value simpliciter. This obliterates the foundation of middle knowledge. Without *true* CCFs prior to creation, God cannot infallibly know which world to actualize to achieve His providential goals through free creatures. Molinism collapses into incoherence. The objection exposes a fundamental metaphysical lacuna.
      *   **Molinist Response & Its Weakness:** Molinists (e.g., Flint, Perszyk) typically offer two lines:
          *   *Brute Facts:* CCFs are simply true, fundamental contingent facts not grounded in anything deeper. They are part of the furniture of reality.
          *   *Essence Plus Circumstances:* S’s individual essence (haecceity), combined with the complete circumstances C, *just is* the truthmaker. S *essentially* would choose A in C.
          Both responses are deeply problematic. "Brute facts" about non-existent entities making specific free choices seem metaphysically arbitrary and mysterious, violating the intuition that contingent truths require concrete grounds. The "essence" response simply relabels the problem: *why* is it true that S's essence determines *this specific free choice* in C? What grounds *that* fact? Appealing to the essence itself merely pushes the grounding requirement back one step without satisfying it. More fatally, it seems to conflate S’s *essence* with her *entire history of free choices*, undermining genuine libertarian freedom by making those choices essential properties, necessary to her identity. If S *essentially* would choose A in C, then in any world where S exists and is in C, she *must* choose A – contradicting the core Molinist claim that she *freely* chooses A and *could have done otherwise* in that very situation. The grounding objection thus reveals a tension between Molinist ontology and libertarian freedom itself.

  2.  **The Flicker of Freedom Objection: A Serious Wound, Not Fatal**
      *   **The Challenge:** Libertarian freedom typically requires that at the moment of choice, the agent possesses a "flicker of freedom" – the genuine, non-overdetermined ability to choose otherwise in that exact circumstance. Molinism seems to extinguish this flicker. *Before God even creates*, He knows the true CCF "S in C would freely do A." When God actualizes C (with S in it), is S *really* free to do ~A? The objection argues "No." The truth of the CCF *settles* the outcome of S's choice in C from all eternity. S's choice is *fixed* by a fact (the CCF) entirely outside her control and existing prior to her existence. While S may *feel* free and her choice may be non-coerced and rational, the outcome was metaphysically necessary given the pre-existing CCF and God’s creative act. She lacks the power of alternative possibility *at the moment of choice*.
      *   **Damage Assessment:** **Significant, but not necessarily fatal to Molinist freedom.** It directly attacks the libertarian credentials of Molinist freedom. If successful, Molinism fails its primary goal: reconciling *robust* libertarian freedom with meticulous providence. It reduces freedom to mere spontaneity or voluntariness within a causally determined path set by the CCFs.
      *   **Molinist Response & Its Viability:** Molinists have a potent, though controversial, counter: **Sourcehood Incompatibilism.** They argue that the *core* of libertarian freedom is not the ability to do otherwise (*alternative possibilities* or AP) in the exact same circumstances, but rather being the *ultimate source* or *originator* of one's action. On this view (championed by Robert Kane and adopted by many Molinists like Flint), S is free in choosing A in C because:
          *   Nothing *external* to S *causally determines* her choice (not God, not prior states, not the CCF itself – the CCF merely *reports* what she *would* choose, it doesn't *cause* it).
          *   S's choice is *intrinsically* indeterministic (involving efforts of will, perhaps).
          *   The choice *issues solely from S* as agent.
          Crucially, S's inability to do otherwise in C is *not* due to external constraint or determination, but *because it is fundamentally characteristic of S herself* to choose A in C. Her character, formed by prior free choices (where *those* moments had AP or sourcehood), leads her, in C, to be *settled* on A. The CCF reflects this settled disposition inherent to S. On this view, the "flicker" is present in the agent's history, shaping who they become, but need not be present in *every* choice moment. **This response is *live*.** While critics argue it weakens freedom or smuggles in determinism via the CCF's pre-truth, the sourcehood model is a recognized and defended position within libertarianism. It allows the Molinist to maintain that S *genuinely* and *undeterministically* brings about A in C, even though the outcome was known via the CCF. The flicker objection damages the *AP version* of Molinist freedom but leaves the *sourcehood version* standing, albeit metaphysically burdened.

  **Verdict and Diagnosing the Stalemate:**

  *   **On the Priority Question:** **Ockhamism prevails.** The grounding objection exposes an insurmountable metaphysical deficit in Molinism. Positing ungrounded truths about non-existent entities making specific free choices is ontologically extravagant and arguably incoherent. The Ockhamist account is metaphysically cleaner: the truth of CCFs emerges from and is grounded by the concrete reality of the agent's free act. The agent's choice is ontologically prior.
  *   **On the Objections:** **The grounding objection is decisively more damaging.** It strikes at the foundational coherence of Molinism. The flicker objection, while serious, can be parried by a Molinist retreat to sourcehood incompatibilism, preserving a recognizable (if contested) form of libertarian freedom.
  *   **Substantive vs. Verbal:** The debate is **substantive** concerning the **metaphysics of truth and truthmaking.** Do all contingent truths require concrete, existing truthmakers? Molinism implicitly rejects this principle (or offers unsatisfactory candidates like brute facts or essences), while Ockhamism embraces it. *This* is the core metaphysical disagreement. Where the debate often becomes **verbal** is in the definition of **"freedom"** and the requirements for **"could have done otherwise."** Molinists operating with a sourcehood definition hear Ockhamists begging the question by demanding AP *at the moment of choice* as essential, while Ockhamists hear Molinists redefining freedom to evade the consequence of pre-truth. Clarifying the precise conception of libertarian freedom being employed is crucial to avoid talking past each other on the flicker point.

  **The Textbook Sleight of Hand:**
  Standard presentations often **assume a specific theory of truthmaking without argument**. Molinist expositions frequently proceed as if stating that CCFs *are* true prior to creation is sufficient, without engaging the deep metaphysical challenge of *how* such truths can obtain without truthmakers. Ockhamist presentations often simply assert the grounding requirement as self-evident. This masks the fundamental metaphysical disagreement about truthmaking principles. Furthermore, textbooks often present the flicker objection as *the* primary challenge, implicitly assuming an AP definition of freedom is canonical, thereby downplaying the more devastating grounding objection and the viability of the Molinist sourcehood response to flicker.

  **Conclusion:**
  The Molinist project of reconciling meticulous providence with libertarian freedom via ontologically prior CCFs is ultimately shipwrecked on the grounding objection. The demand for a truthmaker reveals a fatal ontological gap. While the flicker objection highlights a genuine tension within libertarian frameworks and forces Molinists towards a sourcehood model, this model remains a live (though contentious) option for preserving a core notion of freedom *if* the grounding problem could be solved. It cannot. Therefore, the Ockhamist account, grounding CCFs in the actual free choices of agents, provides the metaphysically superior solution to the priority question. The debate's substance lies in the metaphysics of truth; its verbal aspects often revolve around the definition of freedom. To move beyond stalemate, focus relentlessly on the question: "What, *exactly*, exists to make this pre-creative CCF true?" Molinism's silence here, or its strained answers, compel the verdict against it.
