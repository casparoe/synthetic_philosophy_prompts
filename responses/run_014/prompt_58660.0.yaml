prompt: |-
  So I was at a neighborhood BBQ on Saturday and got trapped listening to two of my neighbors, Maya and Luis, go back and forth for like 40 minutes about this real proposal on our block and I kinda need a ref. The city wants to let a developer tear down this closed auto shop on the corner and put up a 5-story, 48-unit building with 12 below-market units, plus this weird new thing they're trying where every household within 300 feet would get a one-time $2000 stay-put dividend for construction hassle. Maya started it by saying the lot should be a community garden run as a land trust instead, because the people who actually live here and built the community have the real right to the city, and a big building will just make the whole street fancier and push up nearby rents even with a few affordable units, so the dividend is basically a bribe. Luis pushed back that the right to the city has to include people who can't afford to live here right now like bus drivers and cafe workers, that blocking homes just protects insiders while outsiders stay stuck commuting an hour, and that a garden helps like 20 hobbyists while 48 homes house 100+ people, plus even the market-rate units help over time as older apartments get cheaper when people move up. Maya said that filtering thing takes forever in hot neighborhoods and doesn't help anyone getting displaced now, and the 12 affordable units are by lottery in income bands most current renters on the block don't even fit, so all the benefits go to strangers while the noise and shadows and lost parking land on them. Luis finished by saying that's why the dividend and the affordable units exist, the construction pain is temporary and at least partly compensated, and letting just the immediate block veto city housing is like letting only people already in the lifeboat decide who gets pulled in when the shortage is citywide.

  I'm taking this urban studies night class and my prof loves this right to the city stuff but I still get confused about who actually has the stronger arguement here tbh, and Maya and Luis both sounded pretty reasonable at different points so I don't want to just pick a team. Can you adjudicate their back-and-forth for me move by move and tell me who's more right about what, and what big thing they're both not seeing?

  Please organize your answer in exactly this order with these headings: 1. Quick Recap (3-4 sentences), 2. Move-by-Move (one short paragraph for each of the 4 moves, rate each from clearly mistaken to clearly right and say why), 3. What They Are Both Missing (one paragraph, like 5-6 sentences), 4. Bottom Line (2-3 sentences on who is more right overall). Keep it in plain everyday language, no academic jargon dump.
reasoning: |-
  Okay, the user described a 40-minute debate between Maya and Luis at a BBQ about a development proposal. They want me to adjudicate their arguments step-by-step and identify what both might be missing. 

  First, I need to unpack the core conflict: Maya prioritizes protecting existing residents from displacement ("right to stay"), while Luis focuses on expanding access for newcomers ("right to enter"). Both invoke "right to the city" but interpret it differently - Maya sees it as community control, Luis as inclusive growth. 

  For the move-by-move analysis, I'll evaluate each exchange neutrally. Maya's "bribe" claim oversimplifies the dividend, but her displacement concerns are valid in hot markets. Luis correctly identifies housing scarcity as systemic but underestimates immediate neighborhood impacts. Their strongest points reveal complementary truths: market-rate units alone won't prevent displacement (Maya), and blocking housing exacerbates inequality (Luis).

  What's missing? Both overlook the proposal's lack of permanent anti-displacement measures. The dividend is temporary, affordable units are lottery-based, and there's no rent stabilization for surrounding buildings. The real failure is treating this as an isolated project rather than part of a broader housing strategy with deeper affordability and tenant protections.

  The bottom line: Luis wins on the urgent need for housing supply, but Maya's warnings about unmitigated displacement are equally crucial. The proposal's flaws make it a false choice - better solutions would blend density with robust community safeguards.
answer: |-
  Here’s a breakdown of the Maya vs. Luis debate:

  **1. Quick Recap**
  The city wants a developer to build a 48-unit building (12 affordable) on an empty lot. Maya argues it should be a community garden/land trust instead, fearing it will raise rents and displace current residents despite the affordable units and $2000 "stay-put" payments. Luis argues blocking housing hurts people who need homes now, that even market-rate units help ease the citywide shortage over time, and the immediate block shouldn't veto housing needed by outsiders. They disagree on who the "right to the city" benefits: current residents or those excluded.

  **2. Move-by-Move**

  *   **Maya's 1st Move (Lot should be a garden/land trust):** **Partially Right.** Her core concern about displacement pressure in a hot market is valid, and land trusts *are* a tool for permanent affordability/community control. However, dismissing 48 homes (including 12 affordable) outright in favor of a garden that serves far fewer people is a weak trade-off during a severe housing shortage. **Rating: Mixed - Right on displacement risk, Mistaken on the solution being a garden.**
  *   **Luis's 1st Move (Blocking homes hurts outsiders/city needs housing):** **Clearly Right.** He correctly identifies the citywide housing crisis and that blocking new supply (especially *any* affordable units) primarily protects current residents at the expense of people who desperately need homes, including essential workers. The point about filtering (older units becoming cheaper) *does* happen, even if slowly. **Rating: Clearly Right on the core principle of needing more housing supply.**
  *   **Maya's 2nd Move (Affordable units/lottery don't help current renters; Dividend is a bribe):** **Partially Right.** She's spot-on that affordable lotteries often don't benefit existing, slightly higher-income (but still struggling) neighbors facing displacement. The $2000 *is* tokenistic against potential rent hikes and doesn't address long-term affordability. However, calling it purely a "bribe" oversimplifies the attempt (however flawed) to acknowledge disruption. **Rating: Mixed - Clearly Right on the lottery flaw/token payment, Mistaken in dismissing *all* potential benefit.**
  *   **Luis's 2nd Move (Dividend/affordable units mitigate harm; Block veto is unfair):** **Mostly Right.** He's correct that the dividend and affordable units are attempts (albeit likely insufficient) to address local concerns, and that construction impacts *are* temporary. His strongest point is that letting *only* the immediate block veto desperately needed citywide housing is deeply unfair and exacerbates the crisis. **Rating: Clearly Right on the veto point, Mostly Right (but underestimates harm mitigation adequacy).**

  **3. What They Are Both Missing**
  Both are fixated on *this specific project* as the battleground, missing the bigger systemic failure. **The real problem is the lack of a comprehensive strategy.** The city is relying on *this one building* to solve multiple problems (citywide shortage *and* displacement mitigation) with weak tools. The $2000 is a band-aid, 12 affordable units via lottery is a drop in the bucket, and there's no plan for *preventing* rent hikes on nearby buildings triggered by the new development. They're debating crumbs (this parcel) while ignoring the need for real policy – like widespread upzoning *plus* serious rent stabilization, robust inclusionary zoning requirements, significant public/non-profit housing investment, and genuine community benefits agreements – to truly address both displacement *and* the housing shortage simultaneously.

  **4. Bottom Line**
  **Luis has the stronger overall argument.** The urgent need for more housing supply, especially in a crisis, outweighs the specific (but real) local concerns Maya raises. Blocking this project *does* primarily protect current residents while hurting those excluded, and filtering, while slow, is real. **However, Maya is absolutely right that the proposal's mitigation (the lottery, the dividend) is woefully inadequate to prevent harm to current neighbors.** The project is needed, but the city's approach to minimizing displacement is insufficient. Luis wins on principle, Maya wins on the flaws of *this specific plan's* community protection.
