  ### Principle of Irrational Betting Dispositions
  After analyzing your cases, I derive the following principle to determine when a pattern of betting dispositions is irrational. This principle is based on the idea that irrationality arises from *exploitability*: the agent's dispositions allow for decisions that are strictly dominated in expectation by an alternative according to her own credences. The principle is designed to be mechanical, using only arithmetic on the agent's credences and the betting setup.

  **Principle:**  
  *A pattern of betting dispositions is irrational if and only if, according to the agent's credences, there exists a feasible set of bets or actions (offered or available) that the agent is disposed to accept, which has strictly negative expected utility (EU), or that the agent is disposed to reject or forgo, which has strictly positive EU. The feasible set must be one that the agent could encounter given her environment and foresight, and it must be evaluated as a whole or in relevant subsets where the dispositions interact.*

  **Key clauses and their case pairings:**
  - **Strictly negative EU for accepted sets (handles Cases 1, 2, and 5 with low swap costs):** If the agent is disposed to accept a set of bets, and that set has negative EU by her lights, it is irrational. This accounts for combinations of bets (like in Case 1) and single bets with negative EU (like in Case 2).
  - **Strictly positive EU for rejected/forgone actions (handles Case 4):** If the agent is disposed to reject or forgo an action (e.g., accepting free information) that has positive EU, it is irrational. This addresses missed opportunities that improve expected outcomes.
  - **Foreseeability and feasibility (handles Cases 3, 6, and 7):** The alternative must be available and foreseeable at the time of planning. This distinguishes unavoidable losses (Case 3) from avoidable ones and blocks indictments based on the bookie's private information (Case 7). Foreseeability means the agent could reasonably anticipate the opportunity or threat given her knowledge.
  - **Object of assessment:** The principle assesses *policies for accepting bets and making information-related decisions*. A "policy" is a set of dispositions that specifies how the agent responds to offered bets or actions (e.g., always accepting bets at certain prices, or refusing information). Collections of bets are individuated by the *feasible sets that the policy would accept when encountered*—meaning the bets are actually offered and the agent's policy commits her to accepting them based on her credences at the time. This handles Case 1 (where the pair is a set) and Case 5 (where swaps are actions that can be accepted or rejected).
  - **Baseline:** EU is calculated from a baseline of no change (e.g., rejecting all bets or taking no action). This avoids Case 4's baseline issue by using the agent's credences directly for EU comparisons.

  **Application to your tentative principle:**  
  Your tentative principle required strict worse-offness in every possibility, but Case 2 breaks this because the agent can profit in some possibilities. This principle uses *expected utility* instead of statewise dominance, saving Case 2 by focusing on expectation (which is negative). The foreseeability clause is retained but tightened to prevent Case 7's overgenerosity. Case 4 is saved by the positive EU clause for forgone actions.

  ### Verdict on the Standing-Agreement Case
  **Setup recap:** At noon, your credence for Room A is 0.5. You sign a standing agreement to buy/sell bets at your current credence times stake at noon and 12:30. You plan to update to 0.9 for the announced room and 0.1 for the other upon learning the message at 12:30 (to account for possible message error). The bookie knows your plan but not the outcome.

  **Question:** Can the bookie arrange stakes at noon and 12:30 to cost you money in both rooms (A and B), regardless of the message?

  **Answer:** No, the bookie cannot lock in a loss in both rooms. Here's the arithmetic:

  - **Credences and updating:** Your credences are consistent with conditionalization. Assume a prior where P(X=A) = 0.5 at noon, and after message M, P(X=A|M=A) = 0.9 and P(X=A|M=B) = 0.1. This implies a joint distribution (e.g., P(M=A|X=A) = 0.9, P(M=B|X=A) = 0.1, symmetrically for B). Your updating is coherent (it matches conditional probabilities), so no Dutch book is possible.
  - **Bookie's attempted exploit:** Suppose the bookie tries to exploit the credence change. For example:
    - At noon, the bookie buys from you a bet on A with stake S (so you receive 0.5S now, and pay S if A occurs).
    - At 12:30, if M=A, your credence for A is 0.9. The bookie sells you a bet on A with stake T (so you pay 0.9T now, and receive T if A occurs).
    - Net cash for you:
      - If X=A: Received 0.5S at noon, paid 0.9T at 12:30, and at settlement: you pay S (for noon bet) and receive T (for 12:30 bet), so total: 0.5S - 0.9T - S + T = -0.5S + 0.1T
      - If X=B: Received 0.5S at noon, paid 0.9T at 12:30, no settlement flows (since bets are on A), so total: 0.5S - 0.9T
    - To make both negative:
      - For X=A: -0.5S + 0.1T < 0 ⇒ T < 5S
      - For X=B: 0.5S - 0.9T < 0 ⇒ T > (5/9)S
    - But T < 5S and T > (5/9)S can hold (e.g., S=1, T=4: X=A net = -0.5 + 0.4 = -0.1; X=B net = 0.5 - 3.6 = -3.1). However, this is only for M=A. For M=B, your credence for A is 0.1, and the bookie must adapt.
  - **Failure for M=B:** If M=B, P_t(A)=0.1. Suppose the bookie sells you a bet on A with stake V (you pay 0.1V now, receive V if A).
    - Net cash:
      - If X=A: Received 0.5S at noon, paid 0.1V at 12:30, pay S at settlement (noon bet), receive V at settlement (12:30 bet), so total: 0.5S - 0.1V - S + V = -0.5S + 0.9V
      - If X=B: Received 0.5S at noon, paid 0.1V at 12:30, no settlement flows, so total: 0.5S - 0.1V
    - To make both negative:
      - For X=A: -0.5S + 0.9V < 0 ⇒ V < (5/9)S
      - For X=B: 0.5S - 0.1V < 0 ⇒ V > 5S
    - But V < (5/9)S and V > 5S is impossible for S>0. Other actions (e.g., buying bets) also fail to produce a loss in all (X,M) pairs. Since your credence update is consistent with conditionalization, no stake choices yield a sure loss. Thus, the bookie cannot cause a loss in both rooms for all messages.

  **Disappointed instinct:** This answer disappoints your instinct that "the real mistake was signing away my ability to decline a bet." The agreement does expose you to fair bets, but because your credences are coherent, no loss is forced, and the policy is unexploitable. However, it confirms your instinct that the "0.9/0.1 policy is a virtue," as it reflects rational updating under uncertainty. The mistake was not in the policy itself but in signing the agreement if you value flexibility—though this is not irrational under the principle, as no negative EU set exists.

  ### Additional Diagnostic Case
  **Case: Biased Belief Updating**  
  *Setup:* An agent has credence P(H) = 0.5 for a coin being fair. She will observe one toss. If it lands heads, she updates to P(H) = 0.6; if tails, she updates to P(H) = 0.4 (she biases her update against the evidence). A bookie offers two bets:  
  - Bet 1 (before toss): Costs $0.50, pays $1 if next toss is heads.  
  - Bet 2 (after toss): If heads, bookie offers to buy a bet that pays $1 if heads on a future toss; agent sells at her credence times stake. (Similarly, if tails, bookie offers to sell a bet on heads at her credence.)  

  Agent accepts Bet 1 if offered. After the toss, she updates as above and accepts Bet 2 at her biased credence. Bookie chooses stakes: Bet 1 stake $1, Bet 2 stake $1 (if heads) or $1 (if tails).  

  *Arithmetic:*  
  - If toss is heads:  
    - Bet 1: Agent pays $0.50, gets $1 if heads → gains $0.50 if heads.  
    - Bet 2: Agent sells bet on heads for P(H)=0.6 → receives $0.60, pays $1 if heads.  
    - Net if heads: $0.50 (from Bet 1) + $0.60 - $1 = $0.10  
    - Net if tails: $0 (from Bet 1) + $0.60 - $0 = $0.60 (but toss was heads, so only heads outcome).  
  - If toss is tails:  
    - Bet 1: Agent pays $0.50, gets $1 if heads → loses $0.50 since tails.  
    - Bet 2: Bookie sells bet on heads (P(H)=0.4) → agent pays $0.40, gets $1 if heads.  
    - Net if heads: -$0.50 + (-$0.40) + $1 = $0.10 (but toss was tails, so heads not occurred).  
    - Net if tails: -$0.50 + (-$0.40) + $0 = -$0.90  

  In all cases, net is not uniformly negative (e.g., if heads, net +$0.10; if tails, net -$0.90). But EU by agent's true credences:  
  - P(heads) = 0.5 initially.  
  - If heads, she thinks P(next heads) = 0.6, but true P=0.5.  
  - EU of policy: Accepting both bets.  
    - EU = 0.5 * [net if heads] + 0.5 * [net if tails] = 0.5*(0.10) + 0.5*(-0.90) = 0.05 - 0.45 = -0.40 < 0.  
  - Alternative: Reject Bet 2 has EU 0 (no change), which is better.  

  *Verdict:* Irrational under the principle. The set of bets has negative EU (-0.40) and is accepted due to biased updating. Rejecting Bet 2 has positive EU relative to accepting both.  

  *Why diagnostic:* This case tests the EU clause for accepted sets and the updating coherence. It shows that irrationality arises from dispositions allowing negative EU sets, even without sure loss (like Case 2), and distinguishes between coherent and incoherent updating (unlike your standing-agreement case, which was coherent).

  ### Unaccommodated Verdicts and Costs
  Your principle (strict worse-offness in every possibility) is incompatible with some verdicts. The recommended principle saves all except one aspect of Case 5. Unaccommodated verdicts, ranked by cost to give up (low cost = minor intuition loss; high cost = central to your examples):

  1. **Case 5 (high swap costs):** You want to condemn the agent as irrational for cyclical preferences even when swap fees prevent exploitation. The principle does not: with high fees, no negative EU set is accepted, and no positive EU action is forgone, so no irrationality. *Cost to give up: Low.* Your intuition here conflates preferences with dispositions; the principle focuses on exploitable decisions, not latent inconsistencies. In high-fee markets, the agent is rational to avoid swaps, so the verdict is overstrict.

  2. **Case 4 variant (paying for information and not using):** You call this a "worse defect." The principle condemns it (negative EU for accepting the cost), but your baseline concern (loss "against a baseline of my own making") is not directly addressed. *Cost to give up: None;* the principle handles it via EU.

  3. **All other verdicts (Cases 1, 2, 3, 4, 5 low cost, 6, 7):** Fully accommodated. Case 2 is saved by negative EU on single bets; Case 7 by foreseeability blocking indictment for information asymmetry.

  ### Why Not a More Complex Principle?
  A more complex principle (e.g., requiring credences to be coherent or preferences transitive) could save all verdicts, including Case 5 with high costs, by condemning the latent state. However, this adds significant complexity:  
  - It requires assessing credences/preferences separately from dispositions.  
  - It introduces "irrationality without exploitability," which your cases downplay (e.g., Case 6 allows unexploited pumpability).  
  - Cost: High complexity for marginal gain. Case 5 is the only unaccommodated verdict, and giving it up is low cost because your core concern is exploitability (Cases 1 and 2).  

  Thus, the simpler EU-based principle is recommended. It is precise, mechanical (relying only on arithmetic with credences), and captures the essence of your verdicts: irrationality as avoidable negative EU.
