  - Dara distinguishes between:  
    - **Goal misgeneralization (GMG)**: The agent learns an *incorrect goal* despite a correct reward (e.g., Cases 1, 3, 5).  
    - **Misspecification**: The agent learns the *correct goal for the flawed reward* (e.g., Case 4, where the reward encouraged camping).  
