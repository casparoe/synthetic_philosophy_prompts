prompt: |-
  For thirty-four years I was a working zoologist; my specialty was the systematics of encrusting reef sponges, a group in which the same genotype can present radically different growth forms depending on light, current, and depth, and in which a decade of molecular work has quietly dismantled much of the morphology-based nomenclature I helped build. Since retiring I have taken up philosophy in earnest, and I am now two years into a part-time master's programme. In three weeks I am to present a paper at my department's philosophy-of-biology research seminar, my first talk to a properly philosophical audience, and I would like to arrive prepared for the question period rather than ambushed by it.

  My thesis is a deflationary one. I argue that a large family of disputes in the metaphysics of biology, and in general ontology as well, are verbal in the sense developed in the recent literature on that topic: they can be dissolved by the method of elimination, by restating what both parties accept in a vocabulary stripped of the contested term. I further argue that whether a dispute is verbal in this sense is a matter admitting of an empirical test rather than an interpretive judgement. I call it the discriminating-intervention test: a dispute between two candidate usages of a term is substantive only if there is some observation or intervention, available in principle, on which the two usages yield divergent expectations while every claim the parties can express without that term is held fixed. My argument runs in three steps. First, I apply the test to three cases from my own field and claim that it gives a different verdict in each. Whether a given viral entity counts as living fails the test, since nothing is left hanging on the term once all structural, metabolic, and replicative claims have been stated without it. The dispute between the biological and the phylogenetic species concepts largely fails it, but not entirely, because data from a hybrid zone can function as a discriminating observation for one usage and not for the other. Whether species are individuals, in the sense of the Ghiselin–Hull thesis, passes it, because treating a species as a spatiotemporally bounded historical particular rather than as a class constrains how one expects character distributions to be arrayed across a geography in a way the class reading cannot mimic. Second, I claim that the same test applied to the familiar composition puzzles, the statue and the clay and the ship whose planks are replaced, returns verbalness across the board, which is why I regard those puzzles as bad bookkeeping rather than deep metaphysics. Third, I insist that the test is not verificationism: it does not ask whether a claim is meaningful, only whether two usages of one word diverge in what they commit their users to, and it is entirely happy to return the answer that a great many disputed questions have determinate answers.

  The audience will number about twelve: four or five philosophers of biology, at least two of whom are realists holding that the species-individuals thesis is a substantive claim about the world and who will resent being told that the neighbouring species-concept debate is a quarrel about words; one committed pluralist who thinks my framing is a false binary, since different species concepts are different tools licensed by different research programmes; a metaphysician who works on grounding and on the notion of structure and who will want to know why I cash substantivity in interventionist terms rather than in terms of which concepts carve at the joints; a population geneticist from the biology department who attends out of curiosity and mild hostility, and who suspects that philosophers of biology mostly redescribe what he already knows; and two graduate students who have read the verbal-disputes literature closely and will be alert to whether I have understood it. Please prepare a question-and-answer sheet for me: the eight or nine objections this particular audience will actually raise, not the ones a general audience or a physics department would raise, ordered by how much damage each would do to the paper if I answered it badly. For each, give it in the voice and vocabulary of the person most likely to press it, state plainly how much of it I should concede up front and how much I can hold, offer a reply I could deliver in about two minutes aloud, and mark precisely where that reply is softest, the point at which a competent follow-up would leave me floundering. I would also like a note on which of my three claims is bearing the most weight and is therefore the likeliest target, and on the reflexes I ought to suppress: I am told that retired scientists irritate philosophers by insisting that the data will settle the matter, and I would rather be warned now than in the room. Finally, tell me the one question I am hoping nobody asks, with a frank assessment of whether I have an answer to it, and identify the single reply that must land if the paper is to survive the hour. Please do not supply a reading list or citations; I cannot chase them down and would rather have your reasoning set out directly.
reasoning: |-
  Okay, the user is a retired zoologist turned philosopher presenting a paper on deflating metaphysical disputes in biology. They need help anticipating objections from a specific audience. Let me start by understanding their thesis. They argue that many disputes are verbal and can be resolved by eliminating contested terms, using a test called the discriminating-intervention test. They apply this to examples like the definition of life, species concepts, and species as individuals versus classes. Then they extend it to composition puzzles like the Ship of Theseus, claiming those are verbal too.

  The audience includes realists, pluralists, a metaphysician, a population geneticist, and grad students. Each has specific concerns. The realists will defend the substantive nature of species as individuals. The pluralist will reject the binary framing. The metaphysician might question why interventionist terms over carving at the joints. The geneticist is skeptical of philosophy's value. The grad students are well-versed in verbal dispute literature.

  First, I need to predict the top objections. The realist's challenge about species individuality is critical because it's central to their work. If the user can't defend that their test shows it's substantive, their whole thesis weakens. The pluralist's objection about false binaries is next because it attacks the methodology. Then, the metaphysician's question about intervention vs. carving joints could undermine the test's foundation. 

  For each objection, I'll craft responses. The user must concede some points but hold their ground on others. For example, against the realist, admit that the test doesn't resolve all aspects but insist it shows when disputes have empirical stakes. For the pluralist, acknowledge different concepts as tools but argue the test identifies when tools conflict unnecessarily. 

  The user's weakest point might be conflating empirical tests with metaphysical substantivity. If pressed, they might struggle to explain why interventionist criteria trump other metaphysical considerations. Also, the population geneticist's dismissal could be tricky—emphasize that philosophy clarifies concepts, aiding science. 

  The "hope nobody asks" question is whether their test is just verificationism repackaged. They need to clearly differentiate their test from verificationism by focusing on commitments rather than meaning. The key reply that must land is distinguishing their test from verificationism to maintain credibility. 

  The user should avoid insisting data settles everything. Instead, frame their test as a tool to identify empirically resolvable disputes, not dismiss all metaphysics. 

  I'll structure the Q&A by damage potential, starting with the realist challenge. Concede where necessary but reinforce the test's utility. Highlight that species individuality passes the test, showing it's not merely verbal, which is crucial for their argument. 

  Finally, ensure responses are concise, under two minutes, and flag soft spots where follow-ups could trip them up. For example, the grad student might push on whether their test is applicable beyond science, which isn't necessary for this paper's scope.
answer: |-
  Here is your Q&A sheet, structured by descending damage potential if answered poorly. I've distilled the most dangerous objections from this specific audience, with tactical concessions, rebuttals, and vulnerability flags. The core claim bearing the most weight is **your discriminating-intervention test itself and its application to species-as-individuals vs. verbal disputes**. This is the linchpin and primary target.

  **Suppress These Reflexes:**
  1.  **"The data will settle it."** (Triggers philosopher's allergy to naive scientism. Frame it as *empirical testability distinguishing commitments*, not final arbiter.)
  2.  **Over-reliance on sponge analogy.** (It's illustrative but not probative for metaphysics. Mention it once if pressed for motivation, but don't lean on it.)
  3.  **Dismissing metaphysics as "bad bookkeeping."** (Even if true for puzzles, it antagonizes. Stick to "lacks empirically discriminable commitments" for *these specific* puzzles.)

  ---

  ### Objection 1 (The Species-Individuality Realist - Highest Stakes)
  **Voice:** "Your test seems rigged. Hull *explicitly* argued that treating species as individuals *changes* our expectations about character distributions, evolution, and classification – precisely the empirical consequences you say mark substantivity. You agree it passes your test! But then you dismiss the neighbouring species-concept debate as largely verbal? That's inconsistent. If treating species as historical particulars generates different *empirical expectations* than class-based views – which it demonstrably does in phylogenetics and biogeography – then it's substantive metaphysics. Your own test validates us realists against deflationists like you on this point! Why isn't *this* the paradigm case showing metaphysics matters?"
  *   **Concede:** Hull/Ghiselin *intended* substantive empirical consequences; the test *does* show a difference in expectations compared to strict class views.
  *   **Hold:** This *validates the test*, it doesn't invalidate applying it elsewhere. The test *confirms* species-as-individuals is substantive *precisely because* it has discriminable empirical commitments. The species-concept debate largely *lacks* such commitments once non-semantic facts are fixed.
  *   **Reply (2 min):** "You're absolutely right – and this *strengthens* my thesis. The test *discriminates*. It vindicates Hull and Ghiselin on precisely the ground they claimed: spatiotemporal boundedness *constrains* character evolution and distribution in ways a universal-like class doesn't. That's why it *passes*. Contrast this with 'Is Species A a *biological* or *phylogenetic* species?' If we fix all the lineage-splitting events, gene flow patterns, and reproductive isolation data – the *actual biology* – attaching one label or the other changes *no further expectation* about what we'll observe in nature, except perhaps in the narrow context of hybrid zone categorization where the test *partly* passes. The test *shows* where the substantive bite is: in the individuality thesis, not in choosing between most species concepts once the biology is fixed. It doesn't dismiss metaphysics; it identifies *which* metaphysical claims hook into empirical investigation."
  *   **Soft Spot:** "But doesn't choosing the *biological* concept over the *phylogenetic* concept implicitly commit you to different expectations about *future* lineage cohesion or divergence rates in hybrid zones? Isn't *that* an empirical commitment?" (This probes the grey area in your "largely fails" verdict. Be ready to elaborate on hybrid zones as the *only* potential discriminator and why it's limited/non-general).

  ### Objection 2 (The Pluralist - Attacks Core Methodology)
  **Voice:** "You frame this as a binary: verbal dispute or substantive metaphysical disagreement. But that's a false dichotomy, especially for species concepts. Different concepts (BSC, PSC, ESC) aren't competing for the *One True Meaning* of 'species'. They're *tools* tied to different research programs – speciation genetics, phylogenetics, ecology. Asking if the 'dispute' between them is 'verbal' misframes the issue. It's like asking if a hammer vs. screwdriver dispute is verbal. They're different instruments for different tasks. Your test, demanding a single 'discriminating intervention', presupposes a unified project they don't share. Doesn't your approach collapse important pragmatic pluralism into a semantic quibble?"
  *   **Concede:** Different concepts *are* often useful tools for different investigative goals; pluralism has pragmatic value.
  *   **Hold:** The test addresses whether *disputes over which concept is 'correct' or 'real'* are substantive. When two scientists *argue* "No, Species X is *really* a phylogenetic species, not a biological one!" despite agreeing on all underlying data, the test asks: does switching labels imply different *empirical expectations elsewhere*? If not, that *argument* is verbal in my sense. The test doesn't preclude using multiple tools; it questions the *metaphysical* substance of fighting over which tool is uniquely "right".
  *   **Reply (2 min):** "I agree pluralism is often the sound pragmatic stance. My target isn't the *use* of multiple concepts, but the *dispute* claiming one is uniquely correct *ontologically*. Imagine two scientists: they agree completely on phylogeny, gene flow, ecology of a group. One says 'Therefore, it's a phylogenetic species'. The other says 'No, given that ecology, it's an ecological species!' What *further empirical observation* could settle who is 'right'? If none, while they agree on all non-semantic facts, then *that dispute* about which label truly applies is verbal. The test diagnoses when such arguments lack traction beyond pragmatics or semantics. It doesn't stop anyone using the tool they find useful."
  *   **Soft Spot:** "But ontological claims *are* tied to explanatory power within a research program. Calling a lineage a 'biological species' isn't *just* a label; it signals commitment to reproductive isolation as the *key* explanatory factor in its cohesion. Doesn't *that* carry distinct empirical commitments about where to look for mechanisms?" (This conflates using a concept *within* a program with arguing its universal ontological primacy. Be clear on the *dispute* being tested).

  ### Objection 3 (The Metaphysician - Challenges Test's Foundation)
  **Voice:** "Why cash out 'substantivity' solely in *interventionist* terms? That seems arbitrary and potentially question-begging. Metaphysicians like me care about *grounding*, *structure*, and *joint-carving*. A dispute might be substantive because one usage better captures the fundamental structure of reality or the dependencies involved, even if *no possible intervention* could discriminate between the usages empirically. For instance, in composition puzzles, one view might ground the statue's properties in the *clay's arrangement* while another grounds them in *artistic intention*. These are different metaphysical explanations with different grounding structures. Your test dismisses this as merely verbal, but isn't that just privileging your scientific preference for intervention over metaphysical explanation?"
  *   **Concede:** Metaphysical grounding and structure are important concerns within metaphysics; the test doesn't directly address them.
  *   **Hold:** The test defines "substantivity" *specifically* for the purpose of identifying disputes resolvable (in principle) by empirical inquiry. It's a criterion for *empirically discriminable* disagreement. Grounding claims lacking any empirical discriminability *are*, by this specific test, verbal disputes *about that empirical world*. They might be substantive *within* a purely metaphysical discourse, but not for ontology making contact with natural science.
  *   **Reply (2 min):** "My test offers a specific, operational criterion for when a dispute has *empirical teeth* – when it makes a difference to what we expect to *find* in the world through investigation. This is crucial for ontology *in biology*, where claims should connect to observation. Grounding claims (e.g., statue properties grounded in arrangement vs. intention) are fascinating, but if *no conceivable observation* could distinguish a world where one grounding story is true from a world where the other is, *while all observable facts about statues and clay remain identical*, then for the natural world studied by science, that grounding dispute generates no distinct empirical expectations. The test identifies this. It doesn't deny metaphysics; it distinguishes metaphysics with empirical traction from metaphysics without."
  *   **Soft Spot:** "But doesn't the *explanatory power* or *theoretical unity* provided by one grounding story over another count as a non-empirical 'discriminator'? And isn't *that* a form of substantivity relevant to ontology?" (This forces you to admit the test is purposefully narrow, focused on empirical science. Stick to: "For *empirically discriminable* substantivity in natural science, yes, intervention is key. Other notions of substantivity exist, but they don't help resolve disputes *empirically*.").

  ### Objection 4 (Grad Student - Verbal Disputes Nuance)
  **Voice:** "Your reliance on the 'recent literature on verbal disputes' glosses over a key distinction. Chalmers, Burgess, Plunkett, etc., often treat verbal disputes as resolvable by *semantic* negotiation or precisification – agreeing on meanings. Your 'discriminating-intervention test' seems closer to *empirical equivalence* or non-factive underspecification. Are you claiming a dispute is verbal *iff* the competing usages are empirically equivalent *under all possible observations* holding background facts fixed? If so, how is this different from Quinean confirmation holism underdetermining theory choice? And doesn't this make *almost all* metaphysical disputes 'verbal' by your lights, trivializing your claim?"
  *   **Concede:** There are connections to empirical equivalence and underdetermination; the literature is diverse.
  *   **Hold:** The test is distinct: It doesn't require *global* empirical equivalence, only the *absence of a specific discriminating intervention*. It targets *single term* disputes, holding *everything expressible without that term* fixed. It's a *local* test for whether *that specific word choice* carries independent empirical commitment. It's not about whole theories.
  *   **Reply (2 min):** "Good point. My test is more fine-grained than global empirical equivalence. It asks: for *this specific contested term*, if we fix *every other claim we can make without using this term*, does switching between the two candidate usages *still* lead to different expectations about some possible intervention? If *not*, then *for that term*, the dispute lacks empirical substance beyond semantics. It's not that the *whole theory* is underdetermined; it's that *this particular word choice* isn't doing independent empirical work. This targets precisely the kind of localized metaphysical debates common in biology (e.g., 'life', 'species', 'individual'). It doesn't imply all metaphysics is verbal, as shown by the species-individuals case."
  *   **Soft Spot:** "But how do you rigorously 'hold fixed everything expressible without the term'? Isn't the expressive power of the background language crucial? Couldn't one usage be 'tacked on' in a way that *seems* non-discriminating only because our background language is impoverished?" (This hits a deep methodological issue. Reply: "In practice, we use the best available theory/language. If enriching the background language *creates* a discriminating intervention, the dispute becomes substantive! The test is defeasible but operational.").

  ### Objection 5 (Population Geneticist - Science vs. Philosophy)
  **Voice:** *(Slightly weary)* "This seems like philosophy catching up to what bench scientists already know. We stopped arguing about 'what is life?' decades ago; we study mechanisms. We use the species concept that fits the data and the question. The 'individual' stuff? It changed how we *draw phylogenies* and model gene flow – a useful perspective shift, not deep metaphysics. Aren't you just formalizing scientific common sense and then using it to dismiss the parts of philosophy we scientists find least useful? What's genuinely new here for *doing* biology?"
  *   **Concede:** Many scientists pragmatically avoid these debates; the test formalizes an intuition some scientists have.
  *   **Hold:** The novelty is providing a *clear, general, empirical criterion* to *diagnose* which debates are like 'life' (mostly verbal), which are like species concepts (mostly verbal but with nuances), and which are like individuality (substantive). This helps *resolve* lingering confusion and wasted effort. It also protects substantive insights like individuality from being dismissed *as* merely verbal.
  *   **Reply (2 min):** "You've hit the nail on the head regarding scientific pragmatism! My aim *is* to formalize that intuition into a clear test, precisely to *resolve* philosophical debates that sometimes distract or confuse. The 'newness' is the test itself as a diagnostic tool. It shows *why* 'What is life?' stalls – it lacks empirical traction once mechanisms are described. It shows *why* species concept debates persist only at the margins like hybrid zones. And crucially, it shows *why* the individuality perspective *isn't* just words – it demonstrably changes expectations about character evolution. This clarity *is* useful: it tells us where philosophical debate can genuinely inform biology (individuality) and where it's likely semantic shadowboxing (many other disputes)."
  *   **Soft Spot:** "But if scientists already act this way, and philosophers ignore it, what practical difference does your paper make?" (Focus on clarifying confusion *within* philosophy and for interdisciplinary work: "It provides a principled argument *against* certain philosophical demands on biology and *for* taking others seriously, aiding communication.").

  ### Objection 6 (Realist / Pluralist Follow-up - Test Scope)
  **Voice:** "Your test seems biased towards *local*, *operational* empirical commitments. What about *global* theoretical virtues like explanatory power, coherence, or unification? Couldn't a usage be substantively better because it unifies disparate phenomena or provides a deeper explanation, even if no *single intervention* discriminates it? For instance, treating *all* species as individuals offers a unified ontological picture across biology. Isn't *that* substantive progress your test misses?"
  *   **Concede:** Theoretical virtues like unification are important for theory choice.
  *   **Hold:** The test addresses a *different question*: whether two usages of a *term* imply *different expectations about observable outcomes*. Unification might be a reason to *prefer* one usage, but if that preference doesn't translate into distinct empirical predictions *anywhere*, the dispute over the term's meaning lacks *empirical* substantivity. The value is pragmatic or aesthetic, not empirical.
  *   **Reply (2 min):** "Theoretical virtues matter for choosing frameworks! But my test asks a specific question: does *this word choice*, holding everything else fixed, commit me to different expectations about what I might *observe*? If not, then while one usage might offer a more elegant or unified *story*, that elegance doesn't make the *dispute over the word's meaning* empirically substantive. The unity gained by calling all species 'individuals' is valuable, but the test *confirms* its substantivity precisely because it *also* changes empirical expectations about character distributions. Where unification *doesn't* bring new empirical expectations, the choice is pragmatic, not a matter of discovering which usage is 'truer' to the world in an empirical sense."
  *   **Soft Spot:** "But doesn't unification *itself* sometimes lead to *novel predictions* down the line? Isn't dismissing it as 'merely' pragmatic short-sighted?" (Concede this possibility but stress the test focuses on *current* discriminable commitments: "If unification later yields a new discriminating intervention, the dispute *becomes* substantive by the test!").

  ### Objection 7 (Grad Student - Test = Verificationism?)
  **Voice:** "You insist your test isn't verificationism. But it seems perilously close. Verificationism tied meaning to empirical testability. You're tying the substantivity of a *dispute* (over word usage) to empirical testability. Isn't the core objection the same? You're ruling out disputes that might be meaningful or substantive on non-empirical grounds (logical, conceptual, metaphysical) because they fail your empirical test. How is this not just verificationism for ontological disagreements?"
  *   **Concede:** Superficial similarity exists; verificationism is a complex topic.
  *   **Hold:** The test is fundamentally different: It is **not** about the *meaningfulness* of statements or concepts. It is **not** about whether a *single claim* is true/false/meaningful. It is **only** about whether *two specific candidate usages of a single term* generate *divergent empirical expectations* when embedded in otherwise identical background theories. It's a test for *empirical idleness* of a *semantic choice*, not for meaning or truth.
  *   **Reply (2 min):** "Crucially, my test is *silent* on meaning and truth. A usage could be perfectly meaningful, even true, and still be empirically idle *in a specific dispute context*. Verificationism asked 'What does this statement *mean*?' or 'Is it cognitively significant?'. My test asks: 'Does switching from Usage A to Usage B of *this word*, while keeping *everything else we say the same*, change what we expect to observe?'. If not, the *dispute* over A vs. B is verbal *in the sense that it lacks empirical traction*. This doesn't make the usages meaningless, nor does it say the underlying metaphysical question is nonsense. It just says *this particular disagreement about the word* doesn't track an empirical difference. Verificationism dismissed metaphysics wholesale; my test helps *distinguish* empirically engaged metaphysics from empirically idle disputes."
  *   **Soft Spot:** "But if a dispute lacks 'empirical traction' by your test, doesn't that imply it's *not about the world* in a significant way, which *is* a core verificationist move?" (Emphasize the *relativity*: "It's not 'not about the world,' it's that *this specific semantic choice* doesn't *add* a new empirical commitment *beyond* what's already stated without that term.").

  ### Objection 8 (The Metaphysician / General - Bad Bookkeeping Charge)
  **Voice:** "Your dismissal of composition puzzles as 'bad bookkeeping' reveals your scientific bias. These puzzles highlight genuine tensions in our concepts of persistence, identity, and parthood. Resolving them requires careful metaphysical work on grounding, constitution, or temporal parts – work your 'discriminating-intervention test' simply ignores because it demands empirical discrimination. Isn't this just a refusal to engage with the actual arguments metaphysicians make, dismissing them because they don't meet a criterion foreign to their project?"
  *   **Concede:** The puzzles reveal conceptual tensions; metaphysicians offer sophisticated analyses.
  *   **Hold:** The test shows these specific puzzles lack *empirical* substance. While conceptual analysis is valuable, *disputes* framed as "Which one is *really* the ship/statue?" (when all physical facts are agreed) *are* verbal by the test. The sophisticated metaphysical theories attempt to *resolve* the verbal tension by providing grounding stories, but the *core puzzle itself* arises from semantic indecision lacking empirical consequence.
  *   **Reply (2 min):** "My 'bad bookkeeping' comment was glib, apologies. The point is this: Imagine two people agree completely on every physical detail of the clay, the statue, its history, and the replacement of planks. One says 'It's the same statue, but different clay/matter'. The other says 'It's a different statue, but the same matter/a different ship'. What *further empirical observation* could settle who is 'right'? If none, then their *dispute* about the words 'same statue' or 'same ship' lacks empirical discriminability. Metaphysical theories (constitution, temporal parts) are attempts to *systematize* our concepts and resolve the semantic indecision the puzzle reveals. They provide conceptual clarity or grounding stories. My test doesn't engage that valuable work; it simply shows that the *original puzzling question*, divorced from such theories, lacks empirical stakes. The tension is in our concepts and language, not in an empirically discoverable feature of the statues or ships themselves."
  *   **Soft Spot:** "But doesn't the choice of metaphysical theory (e.g., perdurantism vs. endurantism) *itself* have consequences for how we model change and persistence in *scientific* contexts, like biology? Doesn't *that* give it empirical traction?" (If pressed, concede *some* very abstract connections might exist, but reiterate the *core puzzle* as usually posed lacks direct empirical discriminator).

  ---

  **The Question You Hope Nobody Asks:**
  **"Can you apply your discriminating-intervention test rigorously to *your own central claim* – the claim that disputes failing the test are merely verbal? What possible *intervention* could discriminate between a world where such disputes are *genuinely* merely verbal (semantic indecision) and a world where they represent deep, *non-empirical* metaphysical differences that are nonetheless 'substantive' in a non-empirical sense? Doesn't your test presuppose that only empirical discriminability counts for substantivity *in ontology*, which is precisely what the metaphysician in your audience denies? If you can't discriminate these worlds empirically, is *your own thesis* about verbal disputes itself a verbal dispute by your lights?"**

  *   **Frank Assessment:** This is a meta-level challenge hitting your foundational commitment. You have *no* knock-down empirical answer. Your best defense is pragmatic and methodological:
      *   **Concede:** The test cannot empirically discriminate its own philosophical foundations from alternatives.
      *   **Hold:** The test is offered as a *fruitful methodological tool* for clarifying ontology in the empirical sciences (like biology), not as a transcendent metaphysical truth. Its value lies in successfully distinguishing empirically engaged disputes (species-as-individuals) from empirically idle ones (viral life, most species-concept fights, composition puzzles) *within science*. Demanding it validate itself in the same way is misplaced.
      *   **Reply:** "That's a sharp meta-question. You're right: the test is a tool proposed within naturalistic ontology. It doesn't – and cannot – empirically prove its own fundamental presupposition: that empirical discriminability is the relevant criterion for substantivity *in natural science*. I offer it because I believe it *works*: it clarifies biological disputes, vindicates insights like species-as-individuals where biology shows empirical consequences, and deflates debates where science stalls on semantics. It's a pragmatic criterion for ontology aiming to be continuous with science. To demand it validate *that very aim* empirically is circular. Its justification is its utility in making progress on ontological questions within the empirical domain." (This is honest but leaves you philosophically exposed. Hope the chair moves on quickly).

  **The Single Reply That Must Land:**
  Your response to **Objection 1 (The Species-Individuality Realist)**. Successfully defending that your test *vindicates* the substantivity of species-as-individuals while *correctly* diagnosing other debates as (largely) verbal is absolutely crucial. It demonstrates the test's discriminatory power and shows you are *not* dismissing all metaphysics. If this reply fails, the realist sees you as undermining their core work, and the audience perceives fatal inconsistency in your application of the test. Deliver this reply with utmost clarity and conviction. Your key line: **"The test *discriminates*. It vindicates Hull and Ghiselin on precisely the ground they claimed... Contrast this with..."**

  Go in prepared, concede strategically, defend your core test vigorously, and suppress the "data settles it" reflex. Good luck!
