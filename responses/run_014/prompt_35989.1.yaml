prompt: |-
  I run genetics for a mid-size laying-hen operation and we're moving from small cages to bigger mixed-group pens, and suddenly the old way of picking breeders is breaking. Until now we've measured each hen's production and picked the top individual hens, but in the group pens the hens that score best on their own are often the nastiest ones — they eat more because they shove others off the feed. Someone at a conference told me there's a whole literature on this, that a couple decades back some people got calmer, more productive birds by selecting whole groups together instead of individual hens, and that this hooks into an old fight in evolutionary biology about whether selection acts on genes, individuals, or groups. I have a math background but zero evolutionary theory, so translate as you go.

  Write me a decision procedure for choosing breeders that my team can run every generation. It should be grounded in what the levels-of-selection debate actually says — when picking on the individual is fine, when you have to pick at the group level, and why (I gather it's something about heritable variance getting partitioned between levels, but explain that in plain terms). The procedure needs: which measurements to take and in what order; a rule for when to rank birds individually vs. rank whole groups; what to do about traits you can't score at the group level (mortality is easy, feather cover is harder, pecking order is a nightmare); and it has to be honest about where the math stops and somebody just has to make a judgement call — mark those places clearly, don't dress them up as steps.

  Then run it on three cases that are basically our real decisions: (1) feather pecking, where the damage is done by a few hens but the whole group loses feathers and it's hard to tell who's the culprit; (2) feed efficiency, where our costs are per-pen but every heritability number we have our per-bird; (3) a line where we've selected individually for egg size for ten years and I'm told moving to group selection now would cost us years of progress on the exact trait we sell. If the procedure gives an answer I wont like on case 3, give it anyway. And tell me what the procedure can't do — anywhere the biology genuinely dosn't have a settled answer, flag it instead of inventing a rule. It needs to be runnable by a technician in an afternoon with nothing fancier than a spreadsheet.
reasoning: |-
  We are addressing a problem in animal breeding where individual selection in group-housing conditions may lead to unintended consequences (e.g., aggressive birds that monopolize feed and reduce group productivity). The user is familiar with the concept that selection can act at different levels (individual vs. group) and wants a decision procedure grounded in the levels-of-selection theory.

  Key Concepts from Levels of Selection:
  1. **Individual Selection**: Traits are selected based on individual performance. This is effective when the trait of interest is primarily under the control of the individual's genes and does not have strong social interactions (i.e., the trait does not affect or is not affected by group mates).
  2. **Group Selection**: When traits are influenced by social interactions (e.g., aggression, cooperation) and the group's overall performance is more than the sum of individual performances, group selection may be more effective. In group selection, we select entire groups based on the group's mean performance.

  The critical quantitative concept is the partitioning of the total genetic variance into two components:
     - **Direct Genetic Effects (DGE)**: The effect of an individual's genes on its own phenotype.
     - **Indirect Genetic Effects (IGE)**: The effect of an individual's genes on the phenotype of other group members (social effects).

  The total heritable variance for a trait in a group setting then becomes:
     Total Heritable Variance = Variance(DGE) + 2 * Covariance(DGE, IGE) + (n-1) * Variance(IGE)
  where n is group size.

  When the IGE component is substantial (especially if positive and large), group selection can capture more of the total heritable variation and lead to faster genetic progress.

  Decision Procedure:

  **Step 1: Identify the trait(s) of interest and their economic importance**
     - List the traits you are selecting for (e.g., egg production, feed efficiency, feather cover, mortality, etc.).
     - Assign economic weights (if possible) to each trait. This helps in prioritizing.

  **Step 2: For each trait, determine if it is influenced by social interactions (i.e., if IGE is important)**
     - This is the critical step. We need to know:
          a. Does the trait in one individual affect the trait in others? (e.g., aggression, feather pecking, competition for feed)
          b. Is the trait measured at the group level? (like group feed intake, group mortality) or can it be measured at the individual level without bias?
     - How to determine:
          - Use existing data: If you have data from both individual and group housing, compare the heritability estimates. A drop in heritability in group housing may indicate IGE.
          - Literature: Check for studies on similar traits in poultry (especially in group housing) that report IGE or social genetic effects.
          - Experimental design: If possible, set up a test with families distributed across groups to estimate the variance components (DGE and IGE). However, this is more complex and may not be feasible every generation.

     *Judgment call*: If you don't have data and the trait is known to be affected by social interactions (e.g., feather pecking, aggression) then assume IGE is important.

  **Step 3: Decide on the selection unit (individual or group)**
     - Rule:
          - If a trait has negligible IGE (i.e., the social interactions are weak) and can be measured accurately at the individual level, use individual selection.
          - If a trait has significant IGE (especially when the IGE variance is large and positive, meaning that the social effects contribute substantially to the total heritable variance) and/or the trait is measured at the group level, then use group selection for that trait.
          - If both types of traits are important, then we need a combined approach (see Step 5).

  **Step 4: Measurements and data collection**
     - For traits with negligible IGE (individual selection):
          - Measure each bird individually (e.g., individual egg production, individual egg size, individual body weight).
     - For traits with significant IGE (group selection):
          - Measure the group mean for the trait (e.g., group feed intake per bird, group mortality rate, group mean feather cover score, group egg production per bird).
          - Also, if possible, record individual contributions to the group trait? But note: for some traits (like feather pecking) the culprit is hard to identify. So we rely on group means.

     *Note*: For traits that are hard to measure at the group level (like feather cover) but are affected by IGE, we may have to use a group-level score (e.g., average feather cover of the group, or even a visual score for the whole pen). For pecking order, it's very difficult. We might avoid direct measurement and instead use correlated traits (like feather cover or mortality) as indicators.

  **Step 5: Selection index construction (combining traits)**
     - We will create a selection index that combines the traits. The index can include both individual and group-level traits.
     - The index value for a candidate (either an individual or a group) is:
          I = b1 * X1 + b2 * X2 + ... 
          where Xi are the traits (standardized) and bi are the weights (which could be economic weights or based on genetic parameters).

     - However, if we are using group selection for some traits and individual for others, we must reconcile the units. We can do:
          - For group selection traits: assign the group mean to every individual in the group? Then we can have one index per individual. But note: this assumes that every individual in the group has the same group effect, which is not true. Alternatively, we can do a two-step selection: first select groups, then within groups select individuals? But that may be complex.

     *Simplified approach*: 
          a. If we are using group selection for a trait, then we rank the groups by that trait and assign a group selection score (e.g., the group mean). Then, for each individual, we have:
              - Individual traits: measured individually.
              - Group traits: the group's score is attached to the individual.
          b. Then calculate an overall index for each individual that combines:
              - The individual's own performance for individually selected traits.
              - The group's performance for group-selected traits (same value for all group members).

          c. Then select the top individuals based on the overall index.

     *Caution*: This approach may dilute the group effect because an individual from a good group gets the same group score regardless of its own contribution. But without knowing the individual's IGE, we cannot do better. This is a limitation.

     *Alternative for group traits*: If we can estimate the IGE for individuals (which requires a complex design with multiple groups per family), then we could have an index that includes both the direct breeding value (DGE) and the indirect breeding value (IGE). But that is beyond a simple spreadsheet.

  **Step 6: Implementation for breeding**
     - Rank all candidate breeders (individuals) by the overall index and select the top ones.

  **Step 7: Constraints and practical adjustments**
     - Avoid inbreeding: Ensure selected birds are not too closely related.
     - Maintain genetic diversity: You might want to select some birds from lower-ranked groups to avoid losing valuable genes.

  **What the procedure cannot do (Unresolved issues):**
     - It cannot precisely partition the genetic variance without complex experimental designs and statistical models (like animal models with social effects). Without such data, we rely on literature and judgment.
     - For traits with strong IGE, the optimal strategy might be to use group selection, but we don't know the exact weight of IGE without data.
     - The procedure does not solve the problem of identifying which individuals are responsible for negative social effects (like feather pecking) without individual monitoring (which is costly).

  Now, let's apply the procedure to the three cases:

  **Case 1: Feather pecking**
     - Trait: Feather damage (which is a result of feather pecking by some hens). The damage is observed on many hens, but the pecking is done by a few.
     - Economic importance: High (feather loss leads to stress, poor thermoregulation, and increased feed consumption).
     - IGE: Strong. The trait is inherently social (one hen's pecking behavior affects others). Also, it's hard to measure at the individual level (we don't know the culprit).
     - Decision: Use group selection. Measure the trait at the group level (e.g., average feather cover score for the group, or proportion of hens in the group with severe feather damage). Then assign this group score to every individual in the group for the selection index.

  **Case 2: Feed efficiency**
     - Trait: Feed conversion ratio (FCR) = feed intake / egg mass output.
     - Current situation: Feed intake is measured per pen (group level) because individual measurement is difficult. Egg mass is per hen (individual).
     - IGE: Likely present because in group housing, aggressive individuals may eat more than their share, leading to inefficiency at the group level.
     - Decision: 
          - Since feed intake is measured at the group level, we have to use a group-level trait for feed intake. So the FCR for the group would be: total pen feed intake / total pen egg mass.
          - Then assign the group FCR to every hen in the group.
          - But note: we also have individual egg mass. We can use individual egg mass as an individual trait and group FCR as a group trait? However, note that the group FCR already includes the group's egg mass. So if we use both, we double-count egg mass.

     *Better approach*: 
          - Since we cannot measure individual feed intake, we must rely on the group FCR as the trait for feed efficiency. Therefore, we use group selection for FCR.
          - We also want to select for individual egg production. So we will have two traits in the index:
              Trait 1: Individual egg mass (individual selection).
              Trait 2: Group FCR (group selection) - note: lower FCR is better.

          We can standardize both traits (e.g., z-scores) and combine with weights (e.g., economic weights). For FCR, because lower is better, we would use a negative weight.

     *Important*: The group FCR is assigned to every individual in the group.

  **Case 3: Egg size (after 10 years of individual selection)**
     - Trait: Egg size (individual trait).
     - IGE: Low. Egg size is primarily a trait of the hen and not strongly influenced by social interactions (unless there is competition for resources that affects egg size, but typically we assume that if feed is adequate, the effect is small).
     - However, the user is concerned that switching to group selection might lose progress. The procedure:
          - Step 2: We assess if there is evidence for IGE for egg size. In the absence of evidence (and given that egg size is typically not considered a social trait), we would conclude that individual selection is still appropriate.
          - Therefore, we continue to use individual selection for egg size.

     *But note*: If the hens are now in group housing and there is competition for feed, then it is possible that the heritability of egg size has dropped because of increased environmental variance or because of IGE (if some hens are deprived of feed by others). We should check the heritability in the new environment. If it has dropped significantly, then we might need to re-evaluate.

     *Decision for this case*: Continue individual selection for egg size. So in the index, we use the individual's egg size.

     *Why the user might not like this?* The user thought we might have to switch to group selection and lose progress. But the procedure says: if IGE is negligible, stick to individual selection. So we don't lose progress.

  However, if the group housing has introduced a new source of variation (environmental or social) that was not present in cages, then the response to selection might be slower. But that is an environmental issue, not a genetic one. We are still selecting the best genes for egg size, but the environment is noisier.

  **Final Remarks on the Procedure**:
     - It requires making a judgment call about the presence and importance of IGE for each trait. This is the weakest point without data.
     - The procedure is runnable in a spreadsheet: 
          Step 1: List traits and weights.
          Step 2: For each trait, mark as "individual" or "group" (based on judgment and/or data).
          Step 3: Collect data:
                  - For individual traits: measure each bird.
                  - For group traits: measure the group mean and assign to every bird in the group.
          Step 4: Standardize each trait (subtract mean, divide by standard deviation) to put them on the same scale. If using economic weights, multiply the standardized value by the weight and then sum for each bird.
          Step 5: Rank birds by the total index and select the top ones.

     - Where the math stops:
          - Deciding the presence of IGE (without data) is a judgment call.
          - Choosing economic weights is a judgment call (unless you have a clear profit function).
          - The method of attaching the group mean to every bird in the group is a simplification. It does not account for the fact that some birds may be contributing more to the group effect (positively or negatively). Without knowing individual IGE, we cannot do better.

     - Limitations:
          - The procedure does not account for genetic correlations between traits. If you have estimates of genetic correlations, you could build a more sophisticated index. But that requires advanced statistics.
          - The procedure does not account for the fact that group composition matters. The same bird might perform differently in a different group. We assume that groups are randomly formed (or at least that the group effect averages out in the long run).

  Given the constraints (technician with a spreadsheet), this procedure is a practical compromise grounded in the levels-of-selection theory.
answer: |-
  ### Decision Procedure for Breeder Selection in Group Pens

  #### Core Principle: Partitioning Heritable Variance
  Selection works best at the level where the **heritable variance** is concentrated. In group settings, traits can be influenced by:
  - **Direct Genetic Effects (DGE)**: Genes affecting an individual's own performance (e.g., egg size).
  - **Indirect Genetic Effects (IGE)**: Genes affecting *others'* performance (e.g., aggression that reduces group productivity).

  **Key Insight**:  
  - If IGE is negligible, select **individuals**.  
  - If IGE is strong, select **groups** (to capture social effects).  
  - Total heritable variance = DGE variance + IGE covariance terms.  

  **Procedure Steps**:

  ---

  ### Step 1: Classify Traits by Social Impact  
  **Measurements**:  
  - **Individual-level traits**: Egg size, disease resistance (if testable individually).  
  - **Group-level traits**: Feed efficiency (pen-level), mortality rate, feather damage.  
  - **Hard-to-measure traits**: Feather pecking (assign a *group-level score*; e.g., % of hens with poor feather cover).  

  **Rule**:  
  - Use **individual selection** if:  
    - Trait has high DGE heritability (>0.2) *and* low IGE (literature/trials show <10% variance from social effects).  
  - Use **group selection** if:  
    - Trait has low DGE heritability in groups *or* high IGE (e.g., aggression traits).  

  **Judgment Call**:  
  - *No data?* Assume IGE is significant if:  
    - Trait involves competition (feed, space) or cooperation (e.g., flock calmness).  
    - Individual selection worsened group performance historically.  

  ---

  ### Step 2: Data Collection Protocol  
  **Measure in this order**:  
  1. **Group-level metrics** (per pen):  
     - Feed intake (total kg/pen), egg mass (total kg/pen), mortality count.  
     - Feather cover score (1–5 scale; average per pen).  
  2. **Individual metrics** (per hen):  
     - Egg size, egg number, health status.  

  **Tools**: Spreadsheet with columns for:  
  - Pen ID, Hen ID, Individual Traits, Group Traits (repeated per hen).  

  ---

  ### Step 3: Selection Index Calculation  
  **Formula**:  
  \[ \text{Index} = w_1 \cdot \text{Trait}_1 + w_2 \cdot \text{Trait}_2 + \cdots \]  
  - **Weights (\(w\))**: Economic value (e.g., feed efficiency weight = feed cost savings).  
  - **Standardize**: Convert all traits to z-scores (mean=0, SD=1).  

  **Selection Unit**:  
  - If a trait uses **group selection**, assign *every hen in the pen* the **pen's mean z-score** for that trait.  
  - Rank hens by total index score; select top 20%.  

  **Judgment Calls**:  
  - *Weight assignment*: Default to equal weights if economic values are unclear.  
  - *Trait trade-offs*: If egg size conflicts with calmness, prioritize based on revenue impact.  

  ---

  ### Step 4: Handle Hard-to-Measure Traits  
  - **Feather pecking**: Use **group-level proxy** (e.g., average feather cover score). Do not attempt to ID culprits.  
  - **Pecking order**: Skip genetic selection; manage via environment (e.g., enrichments, lighting).  
  - **Mortality**: Easy (group-level count).  

  **Limitation**:  
  - Traits like "aggression" can't be measured directly. Use proxies (e.g., feather damage) or exclude.  

  ---

  ### Step 5: Constraints & Caveats  
  **What the Procedure Can't Do**:  
  1. **Resolve gene-group correlations**: If aggressive hens cluster, group selection may favor their genes.  
  2. **IGE without data**: Requires historical/experimental data to partition DGE/IGE variance.  
  3. **Dynamic social effects**: Group performance ≠ sum of parts. Biology lacks settled math here.  

  **When to Deviate**:  
  - If individual selection *must* continue (e.g., contractual egg size requirements), accept suboptimal group gains.  

  ---

  ### Case Applications  

  #### Case 1: Feather Pecking  
  - **Trait**: Feather damage (group-level).  
  - **IGE Status**: **High** (pecking hurts group; culprits hard to ID).  
  - **Procedure**:  
    1. Score all pens for average feather cover (1–5; 5 = best).  
    2. Use **group selection**: Assign each hen her pen's average score.  
    3. Combine with other traits (e.g., egg production) in index.  
  - **Why**: Captures heritable variance in "pecking impact" on the group.  

  #### Case 2: Feed Efficiency  
  - **Trait**: Feed conversion ratio (FCR = feed intake / egg mass).  
  - **IGE Status**: **High** (bullies eat more; group costs matter).  
  - **Procedure**:  
    1. Calculate **pen-level FCR** (total feed / total egg mass).  
    2. Assign each hen her pen's FCR z-score.  
    3. Use **individual z-scores** for egg size/number.  
  - **Adjustment**: Since FCR is a ratio, use log-transform before z-scoring.  

  #### Case 3: Egg Size (10 years of individual selection)  
  - **Trait**: Egg size (individual).  
  - **IGE Status**: **Low** (minimal social influence; high DGE heritability).  
  - **Procedure**:  
    1. Continue **individual selection** for egg size.  
    2. *But*: If group housing reduces heritability (e.g., due to feed competition), add **group-level egg size variance** as a trait (low variance = calmer pen).  
  - **Hard Truth**: Switching to group selection *would* lose progress. Don’t do it.  
  - **Compromise**: Select top individuals *within* top 30% of groups (balances DGE and IGE).  

  ---

  ### Summary Workflow for Technicians  
  1. **Record per pen**: Total feed, total eggs, mortality, feather scores.  
  2. **Record per hen**: Egg size, egg number, health.  
  3. **Spreadsheet**:  
     - Column A: Pen ID  
     - Column B: Hen ID  
     - Columns C–E: Individual traits (z-scores)  
     - Columns F–H: Group traits (z-scores; same for all hens in pen)  
     - Column I: Total index (sum C–H)  
  4. **Sort hens by Column I → Select top 20%**.  

  **Time Estimate**: 3–4 hours for 1,000 hens.  

  ### Final Honesty Check  
  **Where Judgment Trumps Math**:  
  - Assigning IGE "high/low" without data.  
  - Weighting trait trade-offs (e.g., egg size vs. mortality).  
  - Defining group proxies (e.g., feather cover → pecking).  

  **Unresolved Biology**:  
  - "Heritable" IGE depends on group composition (no universal formula).  
  - Long-term group selection may alter DGE-IGE correlations (evolutionarily murky).  

  **Output**: A practical, level-headed system that dodges theoretical fights and focuses on measurable gains.
