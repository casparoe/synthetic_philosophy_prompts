  - **Rule 1 prediction**:  
    - No specific duty, low cost → **minor nicety** (not supererogatory or obligatory).

  - **Rule 2 prediction**:  
    - No specific duty, low cost, but harm is not immediate (death in a month) and you are not uniquely positioned (others can donate) → **minor nicety** (not supererogatory or obligatory).

  **Outcome**: Both rules predict the same (minor nicety), so this case does not distinguish them.

  **Revised case to force a distinction**:  
  *While hiking in a remote area, you encounter a stranded hiker with a broken leg. They are in pain and cannot move, but there is no immediate life threat (e.g., weather is mild, and they have supplies). You have a satellite phone and can call for rescue at no cost (you have unlimited minutes), but it would delay your hike by 30 minutes.*

  - **Rule 1 prediction**:  
    - No specific duty, low cost (minor time delay) → **minor nicety** (not supererogatory or obligatory). Refusing is not blameworthy.

  - **Rule 2 prediction**:  
    - Harm is serious (stranded with injury) but not immediate (no life threat), cost is low, and you are uniquely positioned (only helper). Without immediacy, it may not trigger the duty of easy rescue.  
    → Could be **minor nicety** (if Rule 2 requires immediacy) or **obligatory** (if Rule 2 includes non-immediate serious harm).  
    - **To distinguish**: If your colleague says it is obligatory, Rule 2 is likely, but with a broader "serious harm" condition. If she says it is a minor nicety, Rule 1 is favored, or Rule 2 requires strict immediacy.

  **Better distinguishing case**:  
