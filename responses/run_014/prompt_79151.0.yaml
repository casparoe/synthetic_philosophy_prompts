  Biggest tension: They think the science-limits part is solid while the mind part is shaky—and they're right. But even the unknowability claim isn't as cosmic as the summary implies; it's about specific formalizations. Must emphasize relativity. 

  In the "strongest defense" section, I'll grant that if humans have access to transcendent math intuition (questionable!), Gödel sentences might showcase it. But that's a huge "if". 

