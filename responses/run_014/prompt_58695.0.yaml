  Then there's Valjean's redemption. Tricky part: his transformation hinges on the bishop's intervention *after* release, not prison programming. Hugo seems skeptical prisons can enable change—Valjean only heals through community (M-sur-M), purpose (mayorship), and love (Cosette). Might note that modern rehab focuses on *in-prison* support, which Hugo never depicts. 

  Javert is fascinating. User asks if he represents "coherent theory" or "personal need." Answer: both. His legal absolutism mirrors retributive logic, but his suicide reveals its emotional roots—fear of chaos. That psychological collapse is Hugo's critique: systems ignoring human complexity self-destruct. 

