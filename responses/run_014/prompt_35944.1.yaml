prompt: |-
  I'm writing a chapter on reproductive torts and want to get the implicit philosophy straight before I get to the doctrine. In most common-law jurisdictions, parents can recover for wrongful conception and wrongful birth — the costs of an unplanned pregnancy after a failed sterilisation or negligent genetic counselling — while the child's own claim, wrongful life, is almost uniformly rejected, even where the negligence (a failure to diagnose rubella in utero, say) determined not that the child exists but only the condition the child exists in. Courts justify the refusal by appeal to the supposed impossibility of comparing impaired existence with nonexistence, and sometimes to the principle that life itself cannot be a harm; meanwhile some courts, in wrongful conception suits, offset the rearing-cost award by the benefits of parenthood. What view of harm — and of the nonidentity problem — does this pattern presuppose? Does it presuppose a person-affecting constraint, and is it coherent, given that in the misdiagnosis cases identity is fixed and no nonidentity problem arises? Distinguish what the doctrine strictly requires from what it merely sits well with, and say what would have to change if the courts instead adopted the Parfitian line that the only wrongs here are done to the parents. Please answer in British English.
reasoning: |-
  Okay, the user is writing a chapter on reproductive torts and wants to clarify the underlying philosophy before tackling legal doctrine. They've outlined how common-law jurisdictions handle wrongful conception, wrongful birth, and wrongful life claims, and are questioning the coherence of the harm concept and nonidentity problem in these rulings.

  Hmm, this is clearly an advanced legal-philosophical query from an academic - probably a law lecturer or PhD researcher given the sophisticated framing. The mention of Parfit suggests they're engaging deeply with analytic philosophy of law. They seem frustrated by the courts' inconsistent treatment of existence vs. impairment cases.

  Right, let's unpack their core questions systematically. First, the harm conception: courts clearly operate with a comparative threshold - harm requires being worse off than in some alternative scenario. That explains why wrongful life claims fail - comparing impaired existence to non-existence is deemed impossible. But this creates tension in negligent diagnosis cases where identity is fixed; the court's logic should technically allow comparison (impaired vs. unimpaired existence) yet they still reject claims. 

  Ah, and the person-affecting constraint is central here. By requiring identifiable victims who are worse off, courts reveal an implicit commitment to what Parfit would call the "Same Number Quality Claim." This makes wrongful life claims conceptually impossible since no one exists in the comparator scenario. But again, this falters in misdiagnosis cases where the same child could have existed unimpaired.

  The user's sharpest point is about doctrine vs. coherence. Strictly, wrongful life rejection only requires the impossibility argument, but its extension to fixed-identity cases reveals deeper philosophical confusion. If courts followed Parfit's view that only parents are wronged, we'd see wrongful life claims disappear entirely while parental awards might increase - but crucially, rearing costs wouldn't be offset by "benefits" since the child's existence isn't treated as compensating parental loss.

  Noticing the user's British English request - I'll maintain "tort" not "wrong" and "judgment" not "judgment". Also emphasising the House of Lords' terminology where relevant. Might reference Lord Steyn's scepticism about offsetting benefits in wrongful conception cases to ground it in Commonwealth jurisprudence.

  The user seems to want this for critical analysis - they'll likely use this to argue that current doctrine rests on shaky philosophical foundations. Should flag how a Parfitian shift would resolve inconsistencies but radically alter damages calculations. Might add in passing that some scholars like Perry question if "harm" is even the right framework here.
answer: |-
  The pattern of common-law doctrine on reproductive torts reveals a specific, though not always coherent, philosophy of harm and personhood, particularly in relation to the nonidentity problem. Here’s a breakdown:

  ### 1. **Core View of Harm Presupposed**
     - **Comparative Threshold Conception of Harm**: Courts implicitly adopt a **counterfactual comparative** view: harm occurs if an individual is worse off than they *would have been* absent the defendant’s negligence. This requires a viable baseline for comparison.
     - **Rejection of Non-Comparative Harm**: The absolute notion that existence with severe impairments could *in itself* be a harm, regardless of comparison, is rejected.

  ### 2. **The Nonidentity Problem & Person-Affecting Constraint**
     - **Strong Person-Affecting Commitment**: The doctrine presupposes a **person-affecting view of harm**. A wrong requires an identifiable victim who is *made worse off* by the defendant’s act.
     - **Nonidentity Problem as a Barrier**: In wrongful life claims (and often wrongful conception), the child’s existence is contingent on the negligence. Thus, the alternative scenario is their *non-existence*. Courts deem comparison between existence (even impaired) and non-existence **impossible or meaningless**. No child exists in the "better off" comparator state.
     - **"Better Never to Have Been" Rejected**: Courts treat "non-existence" as a non-comparable state, not a "better" state. Hence, the child cannot claim to be worse off than if they had never existed.

  ### 3. **Incoherence in Misdiagnosis Cases**
     - **Fixed Identity Scenarios**: Where negligence (e.g., failing to diagnose maternal rubella) causes a child to be born impaired *but does not cause their existence* (identity is fixed pre-negligence), the nonidentity problem **does not arise**. The alternative scenario is the *same child* born healthy.
     - **Doctrinal Inconsistency**: Courts still reject wrongful life claims here, clinging to:
       - The impossibility rhetoric ("no comparison between life and non-life"), which is **irrelevant** when identity is fixed.
       - A deeper, often unstated, commitment to the idea that **life itself cannot be a legal injury**, reflecting a quasi-absolute sanctity-of-life principle.
     - **Philosophical Tension**: This exposes incoherence. The strict person-affecting/comparative logic *should* permit claims in fixed-identity impairment cases (child is worse off than if born healthy). Courts override this logic, suggesting an unarticulated boundary: life, once bestowed, cannot be deemed harmful *to the living person* in tort law, regardless of impairment.

  ### 4. **Parental Claims & Offsetting Benefits**
     - **Parental Harm is Relational**: Wrongful conception/birth claims focus on harm *to parents*: the physical/financial burden of unplanned child-rearing or caring for a disabled child. This fits the comparative view: parents are worse off financially/physically than if negligence hadn’t occurred.
     - **Offsetting "Benefits"**: Reducing damages by the "joys of parenthood" assumes:
       - Harm can be netted off by unrelated benefits.
       - The child’s existence *for the parents* is a compensating good, even if unintended. This subtly reinforces the view that existence is a benefit, not a harm.

  ### 5. **Distinguishing Doctrine vs. Compatibility**
     - **Doctrine Strictly Requires**:
       - For wrongful life: Impossibility of comparing impaired existence with non-existence.
       - For parental claims: Breach of duty causing foreseeable costs (offsetting benefits are discretionary, not universal).
     - **Doctrine Sits Comfortably With**:
       - A strong person-affecting constraint.
       - The principle that "life is always a benefit" (though not all courts explicitly state this).
       - A policy aversion to declaring a life "not worth living".

  ### 6. **Implications of Adopting a Parfitian View**
     Derek Parfit’s view (*Reasons and Persons*) holds that in nonidentity cases:
     - The child is *not harmed* by being born impaired (they aren’t worse off than if never born).
     - The wrong is **impersonal**: the act creates a state of affairs where someone exists with a worse life than another *possible* person might have had, or burdens others.
     - The primary wrong is to the *parents* (autonomy violation, financial burden).

     **Changes to Doctrine if Parfitian View Adopted:**
     - **Wrongful Life Claims**: Still rejected, but explicitly because the child isn’t comparatively harmed, not due to "impossibility of comparison."
     - **Parental Claims**:
       - **No Offsetting Benefits**: If the wrong is the parent’s lost autonomy/burden (not the child’s existence *as a harm*), the "benefits" of parenthood become irrelevant. Damages should cover full costs.
       - **Stronger Focus on Autonomy**: Awards could emphasise the violation of reproductive choice over pure economic loss.
       - **Fixed-Identity Cases**: Parental claims for costs of raising an impaired child (due to negligence not affecting identity) would remain robust, grounded in the impersonal wrong of creating avoidable suffering/burden.
     - **Nonidentity Cases (e.g., failed sterilisation)**: Parental claims still valid, but damages calculated solely on costs imposed, not netted against "benefits" of a child whose existence is framed as a neutral or good outcome for the child (but a burden for parents).

  **Conclusion**: The current doctrine presupposes a **comparative, person-affecting view of harm** and struggles with its own logic in fixed-identity cases, retreating to unspoken principles about the inviolable value of existence. It is compatible with, but does not strictly require, the view that "life is always a benefit." Adopting Parfit’s impersonal wrongs approach would eliminate incoherence in wrongful life rejections and transform parental claims by removing benefit offsets, grounding them solely in the wrong to parental autonomy and welfare. The core shift would be recognising that the primary moral wrong lies in creating *avoidable burdens or suffering*, not in harming a specific victim who is worse off.
