  Here’s a draft that honors your sister’s anger, acknowledges the perpetrator’s effort without demanding forgiveness, and carries the weight of unresolved resentment – all in plainspoken, heartfelt language suitable for the circle:

  **(Begin by looking at your sister, then slowly turn to address the person who caused harm. Speak steadily, with quiet intensity.)**

  "My sister asked me to stand here today because looking you in the eye, right now, is too much. Too raw. What happened wasn’t a single moment; it was years. Years of financial manipulation, of trust broken piece by piece, until she felt like she couldn’t even trust her own memory of what was real. That’s the kind of wound that doesn’t just bleed; it infects everything.

  **I’m here first and foremost to say this: Her anger is not a problem to be fixed today. It’s not a mess to be cleaned up by an apology, however sincere. That anger? It’s a testament.** It’s proof she knows, deep down, what was done to her was profoundly wrong. It’s the fire that kept her fighting when she felt lost and confused. Telling her to let go of that anger now, or expecting her to manage it for your comfort, or for the sake of a neat ending? That would be asking her to betray herself all over again. **Her anger belongs to her. It’s valid. It’s necessary. And it stays, for as long as she needs it.**

  **(Pause, shift focus slightly to the room, then back to the person who caused harm)**

  What we *can* do today is acknowledge the truth of what happened. We can name it: betrayal, exploitation, a violation of family bonds that should have been safe. We can see the wreckage it left – not just in bank accounts, but in her spirit, in her ability to feel safe.

  **(Lean in slightly, addressing the person directly)**

  And we can also acknowledge something else we’re seeing: that you are trying. Trying to understand the depth of the harm you caused. Trying to see past just the actions to the broken trust, the doubt, the lasting fear you planted. That effort matters. It matters because it means you’re stepping out of the shadows of denial. It means you’re attempting to see her, truly see her pain, as a person you harmed, not just as a problem to resolve.

  **But here’s the hard, honest truth: Understanding doesn’t erase what happened. Seeing the pain doesn’t magically dissolve it.** Even if every reason, every excuse, every explanation is laid bare and understood… the hurt remains. The betrayal happened. The trust was shattered. That leaves a mark. A scar. **There’s a leftover feeling – a deep, lingering resentment – that doesn’t just vanish because the facts are known or because effort is being made.** It’s the echo of the harm, and it’s part of her reality now. Pretending it’s all settled, pretending this circle washes it completely clean… that wouldn’t be real. It wouldn’t honor what she’s lived through.

  **(Soften slightly, but maintain gravity)**

  So, what does this moment hold? It holds her justified anger, standing firm. It holds the undeniable truth of the harm, finally spoken aloud. It holds the acknowledgment that you are *trying*, genuinely, to grasp the magnitude of what you did. And it holds the uncomfortable, honest reality that some wounds leave a residue. They change the landscape.

  **Leaving a door open doesn’t mean walking through it today. It doesn’t mean forgiveness. It simply means recognizing that seeing you try to understand… it shifts something, however small.** It means acknowledging that this effort, this painful reckoning you’re undertaking, *is* different than the denial that came before. It’s a step, however difficult, towards facing the real cost of your actions on another human being – my sister.

  **Her anger is hers. The hurt is real. The past cannot be undone. Your understanding matters… but it doesn’t erase the scar. That’s the truth we hold in this circle today. And my sister gets to decide, in her own time, what that truth means for her moving forward."**

  **Key elements woven in:**

  1.  **Validation of Anger:** Explicitly names anger as necessary, valid, and belonging solely to your sister. Rejects pressure to "resolve" it.
  2.  **Naming the Harm:** Uses concrete language ("years of financial manipulation," "couldn't trust her own memory," "betrayal," "exploitation," "violation") to prevent minimization.
  3.  **Acknowledging Effort:** Clearly states that the perpetrator's attempt to understand is seen and matters ("means you’re stepping out of the shadows," "shifts something, however small").
  4.  **The "Leftover" Resentment:** Directly addresses the unresolved residue ("a deep, lingering resentment," "echo of the harm," "some wounds leave a residue," "doesn’t just vanish," "doesn’t erase the scar"). Rejects a false sense of closure.
  5.  **Door Open ≠ Forgiveness:** Explicitly separates acknowledging effort from forgiveness or reconciliation ("Leaving a door open doesn’t mean walking through it today. It doesn’t mean forgiveness").
  6.  **Sister's Agency:** Starts and ends with your sister's needs and her control over her own feelings and timeline ("Her anger belongs to her," "my sister gets to decide").
  7.  **Strawson Undercurrent:** The "participant stance" is reflected in holding the perpetrator accountable *as a person* ("see her pain, as a person you harmed"), directing the reactive attitudes (anger, resentment) at *them*. The "objective attitude" is rejected by refusing to pathologize or excuse away the sister's anger. The "residue" is the core theme of the unresolved resentment.
  8.  **Tone & Length:** Aimed for heartfelt, grounded, and firm. Should land within 3-4 minutes when spoken deliberately.

  **Deliver it slowly.** Pause for emphasis, especially after the strong statements about anger and the residue of hurt. Let the weight of the words settle in the room. This speech gives your sister's truth a powerful voice while creating the space you requested.
