  Okay, the user is preparing a speech for a restorative justice circle where their sister was the victim of long-term financial manipulation by a family member. The sister has asked the user to speak on her behalf because she can't face the perpetrator directly. 

  First, I need to understand the core needs here. The user wants the speech to validate the sister's anger as legitimate and non-negotiable, while leaving room for acknowledging the perpetrator's efforts to understand their actions—without implying forgiveness. They're influenced by Strawson's concepts of reactive attitudes and residual resentment, but want this woven in subtly, not academically.

  Hmm... the emotional complexity stands out. This isn't about closure; it's about honoring unresolved pain. The sister's inability to make eye contact speaks volumes—this betrayal shattered basic trust. The financial aspect adds layers: it's not just money, but gaslighting that made her doubt her own memory. That requires naming explicitly.

  The user's phrasing "hold the line" suggests protective ferocity. They're gatekeeping their sister's right to rage against any pressure to "get over it." Yet "leave a door open" is equally intentional—not for reconciliation, but for the perpetrator's accountability journey. That nuance is crucial. No false optimism, just cold truth with a sliver of... not hope, but acknowledgment of effort.

  I notice they reject "managed" or "resolved" in quotes—likely anticipating the facilitator or family pushing premature resolution. The speech must armor the sister against that. References to Strawson's participant stance (seeing the wrongdoer as a moral agent) vs. objective stance (treating them like a broken mechanism) can translate to: "This anger belongs to you as a person, not just your actions."

  For structure, I'll start with grounding in the sister's voice ("I stand for her"), then validate anger as necessary armor. The financial harm must be named bluntly—"manipulation," "years," "trust broken"—to prevent minimization. The residual resentment idea becomes: "Some wounds don't seal neatly." The door left open is conditional: "If you're truly changing, that matters—but it doesn't erase this."

  Language must be visceral, not abstract. "Can't trust your own memory" needs to echo in the room. And end on agency: the sister controls if/when anger evolves. No stolen narrative.

  ...Wait. Should I address the perpetrator directly? Yes—using "you" makes it unavoidable. But the "door open" part must avoid sounding like absolution. Hence: "seeing you try... shifts something microscopic." Not redemption, just human recognition.

  Finally, the family/community witnesses need to feel the weight. This speech isn't persuasion; it's testimony. The last line—"she gets to decide"—is the flag planted.
