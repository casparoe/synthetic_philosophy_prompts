  4.  **Herding & Echoing:** "The same choice echoes down the waiting string" (J) directly states the pattern. The repeated lines (especially F & H becoming dominant reasons) show the cumulative effect.
  5.  **Closing Turn (Fresh Signal):** "Then one man stops, a plate held by a friend" (K) - the fresh, clear signal (direct evidence of the food's quality/flaws). "He *sees* the food and grasps where flaws portend" (L) - he understands the actual state. This disrupts the pattern ("He *sees*..." contrasts sharply with the earlier reliance on hints and queues).
  6.  **Rational Inference, Not Mimicry:** The language focuses on *reasoning* based on evidence available: "He counts the heads," "She sees the crowd," "now seems a fragile thing," "grasps where flaws portend," "he thinks must be the best." They act on *inference* from what they observe, not just copying blindly.
  7.  **No Technical Jargon:** Uses everyday language: "hint," "ticket," "counts the heads," "sees the crowd," "private nudge," "sees the food," "flaws portend."
