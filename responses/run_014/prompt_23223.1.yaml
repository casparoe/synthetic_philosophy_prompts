  I should stress that the actuary isn't wrong about the dispositional gap, but that in practice, the dynamic nature of pension investing creates de facto betting scenarios. The written opinion should bridge philosophy with pragmatism - acknowledge the theoretical distinction while demonstrating why it collapses under sequential decision-making. 

  Also worth noting: municipal funds face public scrutiny. Adopting formally coherent methods could provide audit trail justification for decisions. That's subtextual but important for the chair's political position. 

