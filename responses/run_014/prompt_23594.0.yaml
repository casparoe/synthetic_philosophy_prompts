  Now, about the dispute: 

  The Infomin solution is one approach. However, there are other approaches. Some argue that the constraint does not give enough information to uniquely determine the posterior. For example, we might consider other distance measures (like the inverse of relative entropy, or Euclidean distance). Also, there is the method of "upcoherence" (or what van Fraassen called the principle of reflection) that leads to a different update. 

