prompt: |-
  I'm a philosopher by trade — epistemology and philosophy of science, though my actual research is on measurement, which is about as far from this as you can get — and I've been roped into running a seminar on conspiracy theories next term, so I'm reading my way into a literature I really dont know. There's a pattern I keep bumping into, both in the readings and in the wild, and I can't find a name for it, which is now bothering me more than it should.

  Here's what I mean. Someone spends years insisting that the authorities are 'sitting on the study' — the one that would settle the whole thing. The study finally appears and says the boring thing. He doesn't say 'right, I was wrong about the study.' He says 'well, of course they'd publish that' — and if you push him, it turns out 'the study' now refers to a different study, still suppressed, and the first one was never really the point. A friend of mine spent a decade saying the moon landings were faked on the basis of a handful of photographic oddities; when each of those got a mundane optical explanation, nothing was dropped — he told me the fakery was 'more subtle than people think.' And the odd part is that neither of them is lying, and neither, I think, is even revising on the sly. They sincerely report that their view hasn't budged, and in their own heads I suspect it hasn't. What moves is what the words mean, slowly enough that neither the believer nor the person arguing with him clocks the switch.

  I know all the obvious neighbours, obviously: Popper on unfalsifiability, Lakatos on the protective belt, Quine on the web of belief, the vague idea of a 'self-sealing' belief, persuasive definitions, moving the goalposts, and the plain old charge of equivocation. But none of them seems to be *this*. Lakatos and Quine are about bolting on or tinkering with claims elsewhere in the system, whereas here nothing is added and nothing is adjusted — the same sentence keeps getting uttered and its content quietly migrates underneath it. Equivocation and goalpost-shifting are things you *do*, in an argument, to a listener; this is something that happens to a person's belief over ten years without anyone, including the person, noticing. So: does this have a name, in this literature or in philosophy of language or mind — and if it does, I want to know exactly what it covers and what it leaves out. If it doesn't, coin me one and define it properly, with the boundaries marked: how is it different from ordinary gradual drift of opinion, from a change of mind the person won't own up to, and from someone being deliberately slippery? Some boundary cases would help me test it — is a teenager who's 'into' a band for a decade while their taste turns over completely doing the same thing? A political party that keeps its name and its conference slogans while reversing the policies? And is my friend and I even disagreeing at the end of all this, or is there no single proposition we're both assessing? Please write the answer in British English — the seminar's at a UK department and I'm tired of being scolded for my vowels and my z's.
reasoning: |-
  Okay, let me try to unpack this philosopher's query. He's describing a peculiar epistemic phenomenon where conspiracy theorists seem to maintain their core belief while the actual content of that belief shifts imperceptibly over time. The moon landing example is particularly vivid - photographic anomalies get explained, but the fakery claim persists by becoming "more subtle". 

  Hmm, what's striking here is the disconnect between linguistic continuity and semantic drift. The same words are used ("the study", "fakery"), but their referents change without the believer's conscious awareness. This feels different from standard concepts like unfalsifiability or moving goalposts because it's not strategic - it's an unconscious process happening over extended periods.

  I recall Wittgenstein's notion of meaning-as-use might be relevant here. The meaning of "the study" isn't fixed; it morphs through its functional role in the believer's discourse. And there's a psychological component too - the sunk cost fallacy meets cognitive dissonance, creating a kind of semantic inertia where the label persists while the content evaporates.

  For boundary cases: the band fandom example is interesting but different because there's no truth claim involved. The political party analogy comes closer, but again lacks the epistemic commitment. What makes the conspiracy case unique is the believer's genuine conviction that their view remains constant despite radical referential shifts.

  Perhaps we need to distinguish between propositional content and psychological commitment. The philosopher and his friend may still be "disagreeing" in the sense that they maintain conflicting stances, but there's no stable proposition they're disagreeing about. It's like arguing about a cloud that keeps changing shape.

  The British English requirement is amusing - I'll make sure to favour "colour" over "color" and perhaps throw in some "bloody hells" for good measure. More seriously, this calls for precise philosophical distinctions with concrete examples to map the boundaries of the phenomenon.
answer: |-
  Right, you've nailed a fascinating and disturbingly common phenomenon that sits at the intersection of epistemology, philosophy of language, cognitive psychology, and the specific pathology of conspiracy thinking. It **does** feel distinct from its neighbours, and the lack of a universally agreed-upon term is telling. Let's dissect it, coin something precise, and map its boundaries, as requested.

  **The Core Phenomenon: Semantic Drift Anchored by Affective Commitment**

  What you're describing is **Semantic Anchoring with Unacknowledged Drift (SAUD)**. Here's a formal definition:

  *   **SAUD:** A psychological and linguistic phenomenon wherein an individual maintains a core *affective commitment* or *stance* (e.g., "Authorities are suppressing truth," "The moon landings were faked") expressed through a persistent *linguistic formulation* (e.g., "They're sitting on *the study*," "The photos prove fakery"), while the *semantic content* or *referents* associated with that formulation undergo significant, unacknowledged change over time in response to counter-evidence or failed predictions. This drift occurs gradually and unconsciously, preserving the *feeling* of holding a constant belief while the *propositional content* evolves to evade falsification. Crucially, the individual sincerely denies any substantive change in their view.

  **Key Components & Mechanisms:**

  1.  **The Anchor:** The core affective stance ("Distrust of authorities," "Belief in fakery"). This is the deeply held feeling or attitude.
  2.  **The Formulation:** The specific, repeated phrase or concept used to express the anchor ("*The* study," "Photographic proof of fakery"). This provides linguistic stability.
  3.  **The Referent/Content:** The actual meaning or specific object denoted by the formulation at any given time (e.g., Study X in 2010, Study Y in 2020; specific photo anomaly A in 2005, vague "subtle fakery techniques" in 2015).
  4.  **The Drift:** The unacknowledged shift in the referent/content of the formulation in response to counter-evidence or failed predictions. Study X is published? "The study" *now* meant Study Y all along. Anomaly A explained? "Proof" *now* resides in subtler, unexamined aspects.
  5.  **Affective Commitment as Driver:** The anchor (distrust, belief in conspiracy) is primary. The formulation is a tool to express it. When evidence threatens the *current* referent of the formulation, the *referent* changes to preserve the *anchor*, not the other way around. The commitment to the feeling overrides fidelity to specific claims.
  6.  **Unacknowledged & Gradual:** This isn't a conscious rhetorical tactic (though it can resemble one externally). It happens slowly, below the level of conscious reflection. The individual genuinely experiences continuity because the *anchor* and *formulation* feel constant. The semantic shift is invisible to them.
  7.  **Evasion without Revision:** Unlike Lakatos's protective belt (adding auxiliary hypotheses) or Quinean web adjustments (tweaking connected beliefs), SAUD involves *replacement* of the referent/content *within* the same linguistic shell. The sentence "They are suppressing *the study*" remains grammatically identical, but its truth-conditions change radically. Nothing is "bolted on" externally; the meaning *inside* the phrase migrates.

  **Distinguishing SAUD from Neighbours:**

  *   **Unfalsifiability (Popper):** SAUD *uses* unfalsifiability as a *result*, but it's achieved through a specific *mechanism* – semantic drift within a fixed formulation, driven by affective commitment. Popper's concern is demarcation; SAUD describes the cognitive-linguistic *process* enabling it.
  *   **Protective Belt (Lakatos):** Lakatos expects conscious or semi-conscious addition/modification of auxiliary hypotheses *around* the core. SAUD involves the *core referent itself* changing invisibly *within* its linguistic expression, preserving the affective core directly.
  *   **Web of Belief (Quine):** Quine emphasizes holistic adjustment under "recalcitrant experience." SAUD is a specific *kind* of adjustment – a stealthy substitution of meaning *within* a node (the formulation) to protect the central, affectively charged node (the anchor), often *without* significant adjustment elsewhere.
  *   **Self-Sealing Belief:** A broad category. SAUD is a specific *mechanism* for achieving self-sealing properties: sealing via semantic drift of key terms.
  *   **Moving Goalposts / Equivocation:** These are *deliberate, tactical* argumentative strategies deployed *in the moment* against an interlocutor. SAUD is an *unconscious, long-term, intra-psychic* process affecting the believer's *own* understanding of their belief. The believer isn't *trying* to deceive; they are experiencing continuity.
  *   **Persuasive Definition:** Involves consciously redefining a term to win an argument. SAUD involves unconscious drift in the believer's *own* understanding of their key terms over time, not a conscious redefinition for persuasion.
  *   **Ordinary Gradual Drift of Opinion:** This involves *acknowledged* (or at least recognisable) shifts in belief content or strength over time (e.g., becoming less dogmatic about a policy). SAUD involves *denial* of any shift despite radical semantic change; the *feeling* of holding the *same* belief is paramount.
  *   **Change of Mind Won't Own Up To:** This implies conscious awareness of the change and deliberate concealment. In SAUD, the lack of acknowledgement stems from genuine lack of awareness due to the slow drift and anchoring effect.

  **Boundary Cases: Testing SAUD**

  1.  **The Teenager and the Band (SAUD: No):** The teenager says they are "into" Band X for a decade. Their taste changes drastically. This *might* look like drift in the meaning of "into." However:
      *   **Anchor:** The anchor is likely weak ("I identify with this music/style at time T"). The *feeling* changes dramatically.
      *   **Formulation:** "Into" is vague and admits degrees. It's expected to evolve.
      *   **Awareness:** They likely *acknowledge* their taste changed ("I *used* to love their early stuff, now I prefer their experimental phase" or "I grew out of it"). There's no *denial* of change driven by a need to preserve a core affective stance against counter-evidence. It's just changing preferences.
  2.  **Political Party Slogans (SAUD: Partial/Parallel):** The party keeps name/slogans ("Workers of the world, unite!") while policies reverse (becoming neoliberal). This *shares* the linguistic continuity masking semantic shift. Key differences:
      *   **Scale/Mechanism:** This is often a deliberate strategy by leadership (equivocation/moving goalposts on a grand scale) *or* the result of complex internal shifts and voter realignment over generations. It may not be driven by the affective commitment of *individual* long-term members in the same way.
      *   **Individual vs. Collective:** SAUD focuses on the individual believer's psychology. Party shifts involve collective action, rhetoric, and institutional memory. An *individual lifelong member* who denies the party *ever* supported nationalisation, reinterpreting old slogans to fit current policy *through* SAUD? That's closer, but the driver might be loyalty (affective anchor) overriding specific policy memory.
  3.  **Your Moon Landing Friend:** **Classic SAUD.** Anchor: Deep belief in fakery/distrust of NASA. Formulation: "The photos prove it" / "It was faked." Referent Drift: Specific anomalies (→ explained) become vague "subtle techniques." Denial: Sincere assertion his core view ("it was faked") hasn't changed. Driver: Affective commitment to the anchor trumps fidelity to the original evidence.

  **The Disagreement Question: The Phantom Proposition**

  This is crucial. At the end, **you are not strictly disagreeing about a single, stable proposition.**

  *   **Your Friend:** Is committed to the *anchor* ("The moon landings were faked") and uses the *formulation* ("The proof is in the photos") flexibly. For him, the *meaning* of "the proof" or even "faked" has drifted. His belief is the persistent affective stance *expressed by* the words, not necessarily tied to their original, specific content.
  *   **You:** Are trying to engage with the *original propositional content* associated with his formulations. You see the referents changing and the proposition becoming elusive or vacuous.
  *   **The Result:** You are arguing past each other. You see equivocation and evasion. He sees you attacking his core feeling/stance using outdated or irrelevant examples of what he "meant" by his proof. There is no single, fixed proposition "P" that you both assess identically over time. The *linguistic token* is constant; the *proposition expressed* is not. Your disagreement is now meta: you disagree *that* his belief has remained constant, and *that* his current formulations have stable, testable content. He disagrees with your characterisation and maintains his anchor.

  **Why SAUD Matters (Especially for Conspiracy Theories)**

  SAUD explains the incredible resilience of certain beliefs in the face of direct counter-evidence. It's not just adding layers (Lakatos) or holistic adjustment (Quine); it's the *meaning of the core claims themselves* being fluid, anchored only by the underlying distrust or conviction. This makes traditional refutation almost impossible – you're chasing a phantom. Understanding SAUD helps explain:

  1.  **The Persistence:** Why believers don't abandon views after "smoking gun" evidence is addressed.
  2.  **The Vagueness:** How core claims often become less specific and more nebulous over time ("more subtle fakery," "they control everything behind the scenes").
  3.  **The Sincerity Paradox:** How believers can be utterly sincere in claiming constancy while shifting their ground.
  4.  **Argumentative Futility:** Why debates often feel circular and frustrating – the target keeps moving invisibly.

  **In Summary:**

  Your phenomenon is **Semantic Anchoring with Unacknowledged Drift (SAUD)**. It's defined by the persistent affective anchor, the fixed linguistic formulation, the unacknowledged drift in the formulation's referent/content, the driver being preservation of the anchor against counter-evidence, and the genuine lack of awareness of the shift. It's distinct from deliberate equivocation, protective belt adjustments, and ordinary belief revision. Boundary cases like the band fan show SAUD requires a strong affective anchor defending against counter-evidence. The political party case shares surface features but operates differently. Crucially, SAUD means that prolonged disagreement often ceases to be about a shared proposition and becomes a clash between a fluid belief anchored by affect and an attempt to pin down a stable claim. Good luck with the seminar – it sounds bloody fascinating. Mind your u's and replace those z's!
