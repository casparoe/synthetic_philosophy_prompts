prompt: |-
  I keep getting stuck on why a promise actually binds, and I think the problem is people just pick one case and defend one theory, so I want the full spec before I weigh in. Write the desiderata: what any adequate account of why promises create obligations has to deliver -- which cases it must get right, which distinctions it can't collapse, which facts about how we actually talk and act it cant contradict -- with the case or consideration behind each requirement. And tell me which of these are non-negotiable and which are just one camp's prejudice dressed up as a requirement.

  A few cases I want on the list because I think they're the ones that actually discriminate. The promise I make to a friend who, right after I make it, forgets it completely and never thinks about it again -- am I stil bound to keep it, and if so, what's the source of the obligation if it's not their expectation of me doing it? The promise I make in the middle of a game or a joke that nobody takes seriously. The promise to do something that's itself wrong. And the promise I make because someone's holding a gun to my head. For each, say what the right answer is supposed to be and which popular account gets it wrong.

  Then the part I really want: is there a subset of these desiderata that no theory can jointly satisfy, given how we actually treat promises? If so, that's the real result, so flag it and say which requirement you'd be tempted to drop and why that's the least bad cut. And score the main contenders -- the reliance/expectation story, the agreement-or-consent story, and the speech-act/commitment story -- briefly against the list, but keep the weight on the criteria, not the scorecard.

  One more thing: when you give your verdict on which desiderata are genuine and which subset (if any) is jointly unsatisfiable, say where your reasoning is most likely to fail and what would change your mind -- like, which single case or consideration, if I pressed on it, would make you revise the list. And write the whole thing in American English.
reasoning: |-
  Okay, the user is really diving deep into the philosophy of promises and obligations. They're frustrated with partial explanations and want a comprehensive framework to evaluate theories. 

  First, I need to understand their core request: they want desiderata (must-haves) for any theory of promissory obligation, applied to tricky cases, plus an analysis of whether these criteria conflict. They specifically mention four test cases: forgotten promises, joke promises, immoral promises, and coerced promises. 

  Hmm... the user seems analytically rigorous - they're not satisfied with surface-level debates and want to see where theories break. The demand for "non-negotiable" vs "disputable" criteria suggests they've encountered too much dogma in philosophical discussions. 

  For the desiderata, I should start with universal agreements: promises create obligations (D1), obligations bind even without reliance (D2), obligations persist when promisees become incapacitated (D3), and bad outcomes don't invalidate promises (D4). These are bedrock. 

  Then the contentious ones: whether immoral promises bind (D5), whether coerced promises bind (D6), and whether promises require uptake (D7). These are where theories really divide. 

  The four test cases are perfect stress tests: 
  - Forgotten promise: kills reliance theories since no expectation exists 
  - Joke promise: challenges commitment theories if no seriousness exists 
  - Immoral promise: exposes consent theories' weakness (you "consented" but shouldn't fulfill) 
  - Coerced promise: breaks all theories except maybe the barest commitment view 

  Biggest insight: D2 (no-reliance obligation) and D7 (uptake requirement) might be fundamentally incompatible. If a promisee's mental state (like forgetting) doesn't matter (D2), but some theories require acknowledgment (D7), that's a contradiction. 

  If pressed, I'd sacrifice D7 - too many real-world promises (like public vows) don't require individual acknowledgment. The "forgotten promise" case proves mental states aren't essential. 

  User's skepticism is healthy. If they showed me that forgotten promises aren't actually binding (e.g., legal systems void them), I'd rethink D2. But in morality, we do feel bound - like keeping a deathbed promise to someone with dementia. 

  Main theories' report cards: 
  - Reliance: Fails D2 (forgotten promises) 
  - Consent: Fails D5 (immoral promises bind?) and D6 (coercion) 
  - Commitment: Struggles with D7 (joke promises) but handles coercion best 

  Final warning: My bias is toward D2-D4. If the user proves promises dissolve when socially unrecognized (e.g., secret vows in cults), I'd cave on D7. But for now, commitment theory survives most intact - barely.
answer: |-
  Here’s a rigorous breakdown of the desiderata for promissory obligation, stress-tested against your key cases, with clarity on non-negotiables vs. contested claims. The goal is to map the fault lines, not defend one theory.

  ---

  ### **Core Desiderata: What Any Adequate Theory Must Explain**  
  *(Non-negotiables in bold; contested items marked)*  

  1. **D1: Obligation Creation**  
     - *Requirement*: Promises (in standard conditions) create **prima facie moral obligations**.  
     - *Case*: When you promise to pick up a friend from surgery, you owe it to them—even if no one else cares.  
     - *Non-negotiable*: Yes. Denying this collapses promise into mere prediction.  

  2. **D2: Obligation Without Reliance**  
     - *Requirement*: A promise can bind **even if the promisee doesn’t rely on it or forgets it**.  
     - *Case*: You promise to donate to a friend’s charity; they immediately suffer amnesia. You’re still obligated.  
     - *Non-negotiable*: **Yes**. Tests whether obligation stems from the act itself vs. consequences.  
     - *Theory casualty*: Reliance theories fail here (they need detrimental dependence).  

  3. **D3: Obligation Despite Incapacity**  
     - *Requirement*: Obligation persists if the promisee **loses the ability to "hold you to it"** (e.g., death, coma).  
     - *Case*: Promise a dying parent to care for their pet. They die; you still must do it.  
     - *Non-negotiable*: **Yes**. Shows obligation isn’t contingent on ongoing claim-rights.  

  4. **D4: Obligation Survives Bad Luck**  
     - *Requirement*: Keeping a promise remains obligatory **even if circumstances change** (non-coercively).  
     - *Case*: Promise to help a friend move, then your car breaks down. You owe effort (e.g., renting a truck).  
     - *Non-negotiable*: **Yes**. Distinguishes promises from mere commitments of convenience.  

  5. **D5: Immoral Promises (Contested)**  
     - *Requirement*: Promises to do **immoral acts are non-binding or void**.  
     - *Case*: Promise to help a friend vandalize property. You *shouldn’t* fulfill this.  
     - *Non-negotiable?* **No**—this is where theories split.  
     - *Theory clash*:  
       - *Consent theories*: Often void (you can’t consent to wrongdoing).  
       - *Commitment theories*: May say you’re bound but ought to break it (two duties clash).  
       - *Reliance theories*: If relied upon, may say you owe reparations even if you don’t act.  

  6. **D6: Coerced Promises (Contested)**  
     - *Requirement*: Promises under **duress are invalid**.  
     - *Case*: "Promise me your wallet or I’ll shoot." No obligation to comply.  
     - *Non-negotiable?* **Mostly yes**, but theories disagree on *why*.  
     - *Theory casualty*: Simple consent theories struggle (you "consented" under threat).  

  7. **D7: Uptake Requirement (Contested)**  
     - *Requirement*: Promises require **shared understanding** (promisee must recognize it as a promise).  
     - *Case*: "I promise" during a *clear* joke where all laugh. No obligation created.  
     - *Non-negotiable?* **No**—major dispute.  
     - *Theory clash*:  
       - *Speech-act/commitment theories*: Require uptake for the act to "succeed."  
       - *Consent theories*: Demand mutual agreement.  
       - *Reliance theories*: Need awareness to trigger reliance.  

  ---

  ### **The Incompatibility: The Forgotten Promise vs. Uptake**  
  - **Conflict**: D2 (obligation without reliance/memory) and D7 (uptake required) **cannot both be fully satisfied**.  
    - If the promisee *must* understand/accept the promise (D7), a forgotten promise (where uptake is lost) isn’t binding—contradicting D2.  
    - If D2 holds (binding even when forgotten), D7 must be false or qualified.  
  - **Least Bad Cut**: Drop **D7 (strict uptake)**.  
    - *Why?* D2 is more central to the *phenomenon* of promising (e.g., deathbed promises bind despite the promisee’s incapacity). Uptake can be reframed as a *default condition* for validity, not a strict requirement (e.g., jokes lack *intent* to promise, not uptake).  

  ---

  ### **Theories Scored Against Desiderata**  
  *(✓ = satisfies, ✗ = fails, ~ = partial/contested)*  

  | Desideratum          | Reliance Theory | Consent Theory | Commitment Theory |  
  |----------------------|-----------------|----------------|-------------------|  
  | D1 (Obligation)      | ✓               | ✓              | ✓                 |  
  | D2 (No reliance)     | ✗               | ~              | ✓                 |  
  | D3 (Incapacity)      | ✗               | ~              | ✓                 |  
  | D4 (Bad luck)        | ~               | ✓              | ✓                 |  
  | D5 (Immoral promises)| ~ (owes repair) | ✗ (void)       | ~ (bound but break)|  
  | D6 (Coercion)        | ✓ (no reliance) | ✗ (consent?)   | ✓ (no intent)     |  
  | D7 (Uptake)          | ✓               | ✓              | ✗                 |  

  - **Reliance theory** (Scanlon): Fails D2/D3 catastrophically. Excels on D6.  
  - **Consent theory** (Rawlsian): Struggles with D2 (if consent is ongoing) and D5/D6 (immoral/coerced "consent").  
  - **Commitment theory** (Owens, Shiffrin): Best on D1-D4/D6. Weakest on D7 (joke cases).  

  ---

  ### **Verdict & Vulnerability**  
  - **Genuine Desiderata**: D1-D4 are non-negotiable. D5-D6 are near-universal but admit nuance. D7 is a "theoretical luxury" some can abandon.  
  - **Joint Unsatisfiability**: D2 and strict D7 **cannot coexist**. Sacrificing D7 preserves more core intuitions.  
  - **Where My Reasoning Is Most Vulnerable**:  
    - **The Joke Promise (D7)**: If you convinced me that *all* seemingly binding "forgotten promises" are actually invalid (e.g., because subconscious expectations persist), I’d revive D7 and drop D2. But this seems empirically false—we feel bound to keep promises even if the promisee genuinely forgets.  
    - **What Would Change My Mind**: A clear case where a promise **made with serious intent, to a competent adult, later forgotten** is widely judged *non-binding* in common morality. I haven’t seen it.  

  **American English Check**: Done. No "whilst," "amongst," or "flat tyre" here.  

  This framework lets you test theories *against the demands of the phenomenon itself*. The "forgotten promise" (D2) is the litmus test—and it sinks reliance, strains consent, and forces commitment theorists to loosen uptake requirements.
