  The user's frustration with "going back and forth" suggests they want resolution. I should emphasize that these questions might not yield final answers but could clarify the debate. Their phil/ML team is well-suited for conceptual work on faithfulness definitions and robustness metrics, while scaling laws might require more ML expertise. 

  Neglectedness-wise, everyone talks about faithfulness but few define it rigorously. Robustness comparisons often get anecdotal treatment. Scaling laws for deception have some empirical work but not enough conceptual framing. Meta-cognition is discussed less in this specific context.

