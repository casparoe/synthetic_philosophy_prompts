prompt: |-
  I'm defending a version of Galen Strawson's Basic Argument against moral responsibility in a graduate seminar next month, and I want to be ready for the question period. The version I'm defending concedes the so-called "no-choices" objection — I grant that an agent can in some sense choose differently in the moment, and that this is a genuine, if shallow, form of freedom — but I argue that the Basic Argument still goes through because the relevant "could not have done otherwise" is not about momentary choices but about the antecedent conditions that constitute who you are: your character, beliefs, and desires, which you did not choose and for which you cannot be ultimately responsible, determine your actions in a way that vitiates the kind of responsibility that grounds blame and desert. So my claim is that the Basic Argument, properly understood, targets ultimate or original responsibility rather than the narrower responsibility that compatibilists want to preserve, and is therefore not threatened by Frankfurt-style cases or by the intuition that we "choose" in the moment.

  The seminar is a mixed group: two compatibilists who work on Frankfurt cases and the "responsibility without alternative possibilities" line, a libertarian who is sympathetic to agent causation, and a couple of legal philosophers who care about the practical consequences for punishment and blame. I want a prep sheet, not a defense: the objections I'll actually get from this audience, ordered by how likely and how damaging they are, each phrased the way that person would phrase it, with a short reply of roughly two minutes and a note on where my reply is soft. I also want to know what I should concede up front, what I should hold, and the one objection — probably from the legal philosophers — that I'm hoping nobody asks but that would be the most embarrassing if it did.
reasoning: |-
  Okay, the user is preparing to defend a modified version of Galen Strawson's Basic Argument against moral responsibility in a graduate seminar. They've conceded the "no-choices" objection, allowing for shallow freedom in momentary choices, but maintain that ultimate responsibility is undermined because we don't choose our constitutive traits (character, beliefs, desires). 

  Hmm, the audience composition is tricky - two compatibilists invested in Frankfurt cases, a libertarian agent-causation theorist, and legal pragmatists. Each will attack from different angles. The compatibilists will likely pounce on the "ultimate responsibility" framing as a red herring since their whole project rejects it as unnecessary. The libertarian might paradoxically agree with the core argument but spin it as evidence for their supernatural agent-causation view. The legal scholars will worry about practical collapse - if no one is truly blameworthy, how do we justify punishment?

  *scratches head* The user's strategic dilemma: How firmly to defend the metaphysical claim about ultimate responsibility versus acknowledging functional alternatives to desert-based blame. If they dig in too hard on the "no real blameworthiness" point, the legal philosophers might torpedo them with institutional consequences. But if they soften too much, the core argument evaporates. 

  *notices subtle tension* User says they want "prep not defense" but their anxiety about the unasked legal objection suggests they secretly want armor for that too. Smart to flag it - that's where blood hits the floor in Q&A. Better prep a two-track reply: concede functional necessity of legal practices while insisting on their moral illegitimacy. 

  *mental note* Must warn user about the compatibilist trap question: "Why should we care about ultimate responsibility?" Strawson's move is to say it's the only kind that satisfies retributive intuition, but that might not sway legal folks. Maybe quote P.F. Strawson's reactive attitudes as middle ground? 

  *checks watch* Replies need to stay under two minutes. Prioritize: 1) Shut down Frankfurt diversion quickly 2) Preempt libertarian co-option 3) Have a surrender flag ready for the legal blow. The "embarrassing" objection is actually the most philosophically interesting - user should reframe it as exposing society's moral hypocrisy rather than their argument's weakness.
answer: |-
  Here's your seminar prep sheet, structured for maximum readiness against likely objections from this specific audience. I've ordered objections by likelihood and damage potential, with authentic phrasing, concise replies, and vulnerability notes.

  **Core Concessions to Make Upfront:**
  1.  "I concede that agents often *experience* genuine choice in the moment ('shallow freedom')."
  2.  "I grant that Frankfurt-style cases successfully sever *alternative possibilities* from attributability/responsibility *as compatibilists define it*."
  3.  "I accept that my view has radical implications for retributive punishment and desert-based blame in their *ultimate* sense."

  **Core Claims to Hold Firmly:**
  1.  "The *only* kind of responsibility that could ground *ultimate* desert/blame/praise is *ultimate responsibility* (UR): being the *causa sui* originator of the traits that determine your choices."
  2.  "UR is logically impossible: you cannot be responsible for the initial conditions (genetic, environmental, constitutive) that shape who you are."
  3.  "Therefore, *ultimate* moral responsibility (and the desert/blame/praise it entails) does not and cannot exist, *regardless* of shallow freedom or compatibilist accounts of responsibility."

  ---

  **Likely Objections & Replies (Ordered by Likelihood/Damage):**

  1.  **From Compatibilist 1 (Frankfurt Specialist):**
      *   **Objection:** "You've just moved the goalposts! Frankfurt cases show we don't *need* alternative possibilities ('could have done otherwise') *at all* for responsibility. Your 'ultimate responsibility' is a phantom requirement. What matters is whether the action flows from the agent's *own* reasons-responsive mechanisms, their 'real self,' *which it does*. Why invent this impossible 'ultimate' standard nobody actually uses in practice?"
      *   **Reply (1.5 min):** "Frankfurt shows we don't need *alternative possibilities in the moment*, agreed. But it doesn't touch the *source* question. Compatibilist 'owning' relies on the agent's constitutive traits (mechanisms, values, 'real self'). *My argument targets precisely the origin of those traits*. If you didn't shape those traits ultimately, how can you be *ultimately* deserving of praise/blame for actions flowing from them? Compatibilist responsibility exists, but it's *derivative* and lacks the ultimate desert foundation retributivism demands."
      *   **Where It's Soft:** This relies on the audience sharing an intuition that *desert* requires something deeper than mechanism-ownership. The compatibilist will deny this intuition is necessary or coherent. Holding the line requires emphasizing the *specific* target (UR for desert) vs. their *different concept* (attributability/accountability).

  2.  **From Libertarian (Agent-Causation Sympathizer):**
      *   **Objection:** "You've correctly identified the problem! This *proves* that naturalistic causation (character -> choice) *cannot* ground UR. But your conclusion is premature. Agent causation provides the solution: a fundamental, uncaused *self* that can intervene in the causal chain, not determined by prior states (character, desires), thereby *creating* UR for specific choices *ex nihilo*. Your argument only refutes naturalism, not libertarianism."
      *   **Reply (1.5 min):** "Agent causation attempts to solve the UR problem by positing a mysterious, uncaused *causer*. But this just pushes the question back: *Who is this 'self' that causes?* What are *its* properties? If it has *no* properties, it can't act meaningfully. If it *has* properties (rationality, inclinations), where did *those* come from? Did the self *choose* them? If yes, infinite regress; if no, then the self acts based on unchosen properties, defeating UR. Agent causation replaces the character regress with a 'self' regress."
      *   **Where It's Soft:** Requires confidently asserting the regress problem applies to the "self." The libertarian might argue the self *is* its primitive causal power, requiring no further properties. Be ready to press the "how does it decide *without* properties?" point.

  3.  **From Compatibilist 2 (Pragmatic Focus):**
      *   **Objection:** "This is all metaphysics run amok! Why should we care about 'ultimate responsibility'? It's irrelevant. Responsibility practices (blame, praise, punishment) serve vital *social functions*: deterrence, moral education, protection, norm enforcement. These practices work *based on* the compatibilist conditions you grant (shallow freedom, mechanism ownership). Your 'UR' is a philosopher's fiction with no practical bite. We can (and must) justify blame/punishment *without* it."
      *   **Reply (1.5 min):** "I agree these practices have *functional* justifications (deterrence, etc.). But my argument targets the *retributive* justification – the idea that punishment is intrinsically *deserved*, that blame is fitting *because* the agent *ultimately* 'could have been otherwise'. This deep-seated intuition fuels much of our reactive attitudes and penal harshness. Showing UR is impossible undermines *this specific justification*. Consequentialist justifications remain, but they are fundamentally different and potentially more limited."
      *   **Where It's Soft:** Concedes significant ground. Compatibilists often argue retributive *intuitions* can be satisfied within their framework (e.g., via "quality of will"). Be ready to argue their satisfaction is shallow if UR is impossible.

  4.  **From Legal Philosopher 1 (Practical Consequences):**
      *   **Objection:** "If no one is *ultimately* responsible, doesn't this collapse into nihilism? How can we justify *any* punishment or blame? If 'he couldn't help being who he is,' doesn't that excuse *everything*? Your view seems to make any form of condemnation or incarceration inherently unjust."
      *   **Reply (2 min):** "Not at all. We can still distinguish harmful from harmless actions, predictable from unpredictable actors. We can justify *consequentialist* interventions: quarantine the dangerous, rehabilitate the malleable, deter the rational. We can express societal disapproval to shape behavior. What we *cannot* justify is punishment *solely* because the offender 'deserves to suffer' for their intrinsic badness, or blame rooted in the fantasy that they were the ultimate author of their character. We shift justification from desert to protection, deterrence, and rehabilitation."
      *   **Where It's Soft:** This reply *accepts* a radical overhaul of justification. It might feel unsatisfying, especially regarding expressions of blame. Needs clear distinction between condemnation-as-tool vs. condemnation-as-deserved-retribution.

  5.  **From Legal Philosopher 2 (Slippery Slope/Fairness):**
      *   **Objection:** "Won't this inevitably lead to unacceptable outcomes? If Ted Bundy 'couldn't help being who he was,' do we just... hug him? Release him? How is it *fair* to punish the person with a 'bad' unchosen character more harshly than someone with a 'good' one, if neither is ultimately responsible? Doesn't your view destroy the very concept of fairness in legal treatment?"
      *   **Reply (2 min):** "Fairness shifts from *retributive* desert ('he deserves suffering') to *procedural* fairness and *proportionality* grounded in consequences. Is it 'fair' to punish Bundy? Not in the ultimate desert sense. But it *is* necessary and justifiable (as quarantine is for a disease carrier) to protect society and deter others. We treat differently based on *dangerousness* and *responsiveness to deterrence/rehab*, factors often correlating with 'character,' but justified by consequence, not intrinsic desert. Fairness lies in consistent application of rules based on harm and risk, not metaphysical blameworthiness."
      *   **Where It's Soft:** Admits the system isn't "fair" in the deep retributive sense many crave. Requires embracing a consequentialist notion of fairness, which can feel cold and potentially justify over-punishment based on risk assessment.

  ---

  **The "Hoping Nobody Asks" Objection (Most Damaging if Handled Poorly):**

  *   **Source:** Likely a Legal Philosopher or Pragmatic Compatibilist.
  *   **Objection:** "You keep saying we can keep punishment based on consequences. But doesn't your *own logic* undermine that? If character/beliefs/desires are unchosen and causally determine actions (even 'shallow choices'), then *everything* an agent does is the inevitable product of prior causes. How can deterrence work if no one *could ever have actually chosen differently* **in the compatibilist sense you granted**? If Jones was *always* going to rob the bank given his unchosen character + circumstances, how does the *threat* of punishment change anything? It just becomes another causal factor, ensuring he *won't* rob it, but he still *couldn't have done otherwise* **in that specific situation with the threat present**. Your shallow freedom seems too shallow to support *any* responsibility practice, including consequentialist ones."
  *   **Why It's Damaging:** It attacks your core concession (shallow freedom/compatibilist responsibility) using your own premises (causal determination by unchosen traits). If shallow freedom can't support *any* "could have done otherwise" relevant to choices *in context* (like responding to deterrents), your fallback to consequentialism collapses.
  *   **Reply Strategy (Handle with Extreme Care):**
      1.  **Clarify the Concession:** "I granted a *compatibilist* 'could have done otherwise' – meaning an agent *would* have done otherwise *if* they had chosen differently, and crucially, that their choice is *responsive to reasons*, including deterrent reasons. The threat of punishment *is* a reason. An agent whose mechanisms are reasons-responsive *can* be influenced by it."
      2.  **Distinguish Levels:** "The 'inevitability' you describe operates at the *fundamental* causal level. But at the *practical* level of deliberation and reasons, the agent experiences alternatives and responds to incentives. Deterrence works *precisely because* the agent's decision-making process (shaped by unchosen traits) is susceptible to reasons like punishment costs."
      3.  **Embrace the Framework:** "Yes, under determinism, the threat *causes* the compliant behavior. But that doesn't negate the *functional efficacy* of the practice. We manipulate the inputs (reasons) to get desired behavioral outputs. The 'shallow freedom' is the *mechanism* by which reasons (like deterrents) exert causal influence on action within the determined system. That's sufficient for the practice."
      4.  **Concede a Limit (If Pressed):** "If an agent is *utterly* unresponsive to reasons (e.g., severe psychosis), then deterrent-based practices *won't* work on them, and our response must shift purely to incapacitation/rehabilitation. My view explains *why*."
  *   **Vulnerability:** This requires walking a tightrope. Overemphasizing inevitability undermines reasons-responsiveness. Overemphasizing reasons-responsiveness makes compatibilist responsibility seem robust enough that UR becomes irrelevant, weakening your core argument. Stick firmly to: Shallow freedom enables consequentialist practices; UR is needed only for retributive desert.

  **Final Prep Advice:**
  *   **Re-frame UR:** Constantly emphasize UR is *specifically* about grounding *ultimate desert/blame/praise*, not responsibility *simpliciter*.
  *   **Use Their Language:** When replying to compatibilists, use *their* terms ("reasons-responsive mechanisms," "real self," "attributability") before explaining why these don't yield UR.
  *   **Acknowledge Intuition:** Admit the retributive intuition is powerful, but argue it's metaphysically unfounded. "We *feel* ultimate blame is fitting, but the argument shows this feeling points to an impossibility."
  *   **Stay Calm on Consequences:** Don't let the legal/practical objections fluster you. Acknowledge the radical implications calmly and focus on the *philosophical* argument about UR's impossibility and its *specific* target (retributive desert). Your job is to defend the *argument*, not design a new legal system.
  *   **Know Your Strawson:** Be ready to cite Strawson (P.F.! Not Galen!) on reactive attitudes potentially evolving if we truly accepted no UR, but stress Galen's point that our *current* retribivist attitudes *presuppose* UR.

  Good luck! Your nuanced version is strong and well-positioned to spark excellent debate. Focus on clarity and sticking to the UR target.
