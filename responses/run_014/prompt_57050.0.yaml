answer: |-
  ### The Problem of Old Evidence in Bayesian Confirmation Theory  
  Bayesian confirmation theory holds that evidence \(E\) confirms hypothesis \(H\) if \(E\) raises \(H\)'s probability. But if an agent is already certain of \(E\) (so \(P(E) = 1\)), learning that \(H\) entails \(E\) cannot raise \(P(H)\), as conditionalizing on \(E\) changes nothing. This is the *problem of old evidence*: it seems scientifically obvious that old evidence (e.g., Mercury’s perihelion advance for relativity) confirms theories, yet the standard incrementalist account deems this impossible. This handout sorts you into a position using cases, not labels.  

  **Case Bank**  
  - **A**: Mercury’s perihelion advance (\(E\)) was known before Einstein derived it from general relativity (\(H\)) in 1915. Deflection of starlight (new \(E\)) was observed in 1919.  
  - **B**: Hydrogen’s spectral lines (\(E\)) were measured before Balmer (1885) and Rydberg (1888) fitted them to a formula. Bohr (1913) derived the formula from quantum orbits (\(H\)). The formula also predicted new lines, later found.  
  - **C1**: A new researcher joins a lab, reads logs showing output pattern \(E\), and formulates mechanistic hypothesis \(H\) (entailing \(E\)) that afternoon. \(E\) is old for the lab, new for her.  
  - **C2**: The same researcher wrote the logging harness, has been certain of \(E\) for a year, and formulates \(H\) only now.  
  - **C3**: As C2, but the lab gave \(H\) a prior probability early on, set it aside for a rival, and she revives it now.  
  - **C4**: As C2, but though she is certain of \(E\) and \(H\), she never explicitly considered \(H \vdash E\) and must derive it step by step.  

  ---

  ### Decision Tree  
  Answer sequentially with **only the case bank**. Each question has options (e.g., A/B). Your path ends at a leaf (position).  

  1. **In Case B, does Bohr’s derivation of the spectral formula (\(H \vdash E\)) make his model more credible, even if it cannot raise \(P(H)\)?**  
     - **A**: Yes. → Go to leaf **Firmness View**  
     - **B**: No. → Go to 2  

  2. **In Case C2, does \(E\) confirm \(H\)?**  
     - **A**: Yes. → Go to 3  
     - **B**: No. → Go to 4  

  3. **Is the core problem that agents are assumed to know all logical relations in advance?**  
     - **A**: Yes. → Go to leaf **Learning Logical Relations**  
     - **B**: No. → Go to 5  

  4. **In Case C1, does \(E\) confirm \(H\) for the new researcher?**  
     - **A**: Yes. → Go to leaf **New Evidence Only**  
     - **B**: No. → Go to leaf **Denial**  

  5. **Should we evaluate confirmation by reconstructing the agent’s state before \(E\) was certain?**  
     - **A**: Yes. → Go to leaf **Reconstructing the Past**  
     - **B**: No. → Go to 6  

  6. **When \(H\) is formulated (e.g., Case C2), does it change the probability of \(E\)?**  
     - **A**: Yes. → Go to leaf **Changing Algebra**  
     - **B**: No. → Go to 7  

  7. **Is observation never certain? (e.g., in Case A, could perihelion data be doubted?)**  
     - **A**: Yes. → Go to leaf **Observation Never Certain**  
     - **B**: No. → Go to leaf **Problem for Incrementalism**  

  ---

  ### Leaves (Positions)  
  *Most awkward commitment in italics. "Not separated from" lists leaves this tree cannot distinguish from yours.*  

  1. **Firmness View**: Confirmation requires high \(P(H|E)\), not probability increase.  
     - Awkward: *Must deny that evidence like Mercury’s perihelion (Case A) raises probability, yet calls it confirmation.*  
     - Not separated from: None.  
     - Agent-relativity: Not committed (confirmation depends on current knowledge, not history).  

  2. **Learning Logical Relations**: Confirmation occurs by learning \(H \vdash E\) (not redistributing probabilities).  
     - Awkward: *Requires that agents can learn non-propositional "logical relations" (Case C4).*  
     - Not separated from: None.  
     - Agent-relativity: Committed (learning is agent-relative).  

  3. **Reconstructing the Past**: Confirmation requires simulating an earlier state where \(E\) was uncertain.  
     - Awkward: *Demands counterfactual histories (e.g., Einstein forgetting perihelion in Case A).*  
     - Not separated from: None.  
     - Agent-relativity: Committed (reconstruction is agent-specific).  

  4. **Changing Algebra**: Introducing \(H\) expands the hypothesis space, changing \(P(E)\).  
     - Awkward: *Allows probabilities to shift without new information (Case C2).*  
     - Not separated from: None.  
     - Agent-relativity: Committed (algebra depends on agent’s concepts).  

  5. **Observation Never Certain**: Updating on uncertain evidence dissolves the problem.  
     - Awkward: *Implies scientists are never certain of data (e.g., Mercury’s perihelion in Case A).*  
     - Not separated from: None.  
     - Agent-relativity: Committed (uncertainty is agent-relative).  

  6. **Problem for Incrementalism**: Old evidence confirms, but incrementalism (confirmation as probability increase) is flawed.  
     - Awkward: *Abandons the dominant account of confirmation without a replacement.*  
     - Not separated from: None.  
     - Agent-relativity: Not committed (problem is with the theory, not agents).  

  7. **New Evidence Only**: Confirmation requires evidence new *to the agent* (not the community).  
     - Awkward: *Must assign probabilities to hypotheses before they are formulated (Case C1).*  
     - Not separated from: None.  
     - Agent-relativity: Committed (newness is agent-relative).  

  8. **Denial**: Old evidence never confirms; historical cases are misinterpreted.  
     - Awkward: *Denies that Mercury’s perihelion (Case A) confirmed relativity.*  
     - Not separated from: None.  
     - Agent-relativity: Not committed (uniformly denies confirmation).  

  ---

  ### Indistinguishable Pairs  
  This tree cannot distinguish:  
  - **No pairs**: All leaves are separated by the questions.  
  *However, cases cannot split "Learning Logical Relations" from views where learning* H ⊢ E *is tacitly part of logical omniscience (e.g., some interpretations of "Changing Algebra"). Add: "In Case C4, does working through the derivation count as learning new evidence?" (A: Yes → Learning Logical Relations; B: No → Changing Algebra).*  

