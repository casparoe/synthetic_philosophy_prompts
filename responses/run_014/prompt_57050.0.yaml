  We are creating a decision tree instrument for a workshop on the problem of old evidence in Bayesian confirmation theory. The handout must:
  - Start with a framing paragraph (≤100 words) stating the problem.
  - Present a case bank (Cases A, B, C1-C4).
  - Then a decision tree of 8-12 branch questions (each with 2-3 options) that are answerable by reference to the cases and do not use vocabulary of the positions.
  - Requirements: 
    - At least one question on agent-relativity (using C1).
    - At least one on changing the algebra (hypotheses and evidence propositions).
    - At least one separating the issue of E having probability one from H having a nonzero prior (using C2 vs C3).
  - Leaves must include at least 6 specified views (and we can add more). For each leaf: 
    - A short descriptive name.
    - One sentence on its most awkward commitment.
    - Note of which other leaves it cannot be separated from by the tree.
  - Finally, a list of pairs of leaves the tree cannot distinguish and for each either a further question or a note that the case bank cannot.

  We are to build the logical space first: list the questions and options, mark coherent combinations, then assign positions to coherent leaves. For empty coherent combinations, explain why they are empty.

  Constraints: 2 pages, ≤1200 words, prose-light. No citations, no bibliography. Attach philosopher names only if confident.

  Let's outline the logical space by identifying the key issues and then forming questions.

  Key issues from the problem of old evidence and the cases:

  1. **Agent-relativity**: Is confirmation relative to an individual agent or to a community? (Case C1: the researcher for whom E is new vs the lab for which it is old.)

  2. **What is learned?** When we say the evidence is old, what does the agent actually learn? Is it the logical relation (H entails E) that is learned? (Case C4: the agent hasn't explicitly entertained the entailment.)

  3. **Probability of E**: The core problem is that P(E)=1. But note that in Case C3, H had a prior probability but then was set aside, and now we are considering it again. Also, in Case C2, the agent was certain of E and now formulates H.

  4. **The role of the derivation**: Does deriving E from H count as a new observation? (Case A: the perihelion advance was known, but the derivation was new. Case B: the formula was known, but the derivation from quantum theory was new.)

  5. **Firmness vs Incremental Confirmation**: Should we abandon incremental confirmation in favor of firmness? (The view that confirmation is about high probability, not increase.)

  6. **Reconstructing the past**: Should we go back to a time when E was uncertain? (This is the standard historical response.)

  7. **Logical omniscience**: The problem arises because we assume the agent knows all logical relations. If we drop that, then learning the entailment might be what confirms. (Case C4.)

  8. **Partial observation/Uncertainty**: Maybe we are never certain of E? Then updating on E again with a new hypothesis might be possible.

  9. **Changing the algebra**: Maybe when we introduce H, we are expanding the hypothesis space, and that changes the probability of E? (This is less standard but possible.)

  We need at least 8 questions. Let's design them:

  Question 1 (Agent-relativity): In Case C1, when the new researcher formulates H and sees that it entails E (which she just learned from the logs), does E confirm H for her?
     - Option A: Yes, because for her E was new.
     - Option B: No, because E was already known to the lab and the confirmation should be the same for everyone.

  Question 2 (What is learned?): In Case C4, the agent is certain of E and certain of H (once articulated) but has never explicitly thought about the entailment. If she now works through the derivation and becomes certain of the entailment, does that confirm H?
     - Option A: Yes, because she learned something new: the logical connection.
     - Option B: No, because she was already certain of both E and H, so nothing changes.

  Question 3 (Probability of E vs Prior of H): Compare Case C2 and Case C3. In C2, the agent has been certain of E and formulates H for the first time. In C3, H was considered earlier and had a prior but was set aside. In which case, if any, does the derivation of E from H confirm H?
     - Option A: Both confirm, because in both the agent is now considering H and seeing that it entails E.
     - Option B: Only in C3, because in C2 the agent had no prior for H to update from, but in C3 we can compare the prior to the posterior.
     - Option C: Neither confirms, because in both E is old.

  Question 4 (Role of derivation): In Case A, the anomalous perihelion advance of Mercury (E) was old. When Einstein derived it from the field equations (H), did that derivation confirm H?
     - Option A: Yes, because it showed that H explains E.
     - Option B: No, because E was already known and certain.

  Question 5 (Firmness vs Incremental): In Case B, the Rydberg formula (E) was old. When Bohr derived it from his atomic model (H), did that make H more credible? Even if we cannot capture it by a probability increase?
     - Option A: Yes, because it made H more credible (firmness).
     - Option B: Only if it raised the probability of H (incremental), which it couldn't because E was certain.

  Question 6 (Reconstructing the past): Should we evaluate the confirmation by considering what the agent's probability for E would have been before they learned E? (This might be applied to Case A: what if we ask what the physicists' probability for E was before they knew about the perihelion advance?)
     - Option A: Yes, that's the right way to capture the confirmation.
     - Option B: No, because we are interested in current confirmation.

  Question 7 (Logical omniscience): Is the problem due to the assumption that the agent already knows all logical relations? (Case C4: the agent has to work through the derivation to see the entailment.)
     - Option A: Yes, if we drop that assumption and allow that learning the entailment confirms, the problem dissolves.
     - Option B: No, the problem is deeper and remains even if we account for that.

  Question 8 (Changing the algebra): When a new hypothesis H is introduced (as in Case C2, when the researcher formulates H for the first time), does that change the set of possibilities and hence the probability of E?
     - Option A: Yes, the probability of E might become less than 1 when we consider new possibilities.
     - Option B: No, the probability of E remains 1 because it is still known.

  Question 9 (Partial observation): In Case A, the eclipse expedition provided new evidence (deflection of starlight). But even for the perihelion, could we say that the observation was not certain? For example, maybe there was a small chance the measurements were wrong?
     - Option A: Yes, we are never certain, so we can update on E again and get a probability increase.
     - Option B: No, in these cases the evidence was treated as certain.

