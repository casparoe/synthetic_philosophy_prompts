     Therefore, in the closing, the instructor should say:

          "Today, we experienced the frustration of trying to derive MU from MI within the system. Then we stepped outside the system and noticed an invariant: the number of I's modulo 3. This invariant, which is preserved by every rule, is 1 for MI and 0 for MU. Therefore, no derivation is possible. This method of stepping outside the system to find an invariant is a powerful tool in logic and computer science. It allows us to prove impossibility without exhaustive search."

     And then perhaps mention that this is similar to other impossibility proofs in mathematics.

  Revised Lesson Plan:

     Total: 60 minutes.

     1. Introduction (5 minutes):
          - Explain the rules and the goal.
          - Form teams of 3-4 (pre-assigned or on the spot).
          - Tell them they have 25 minutes to try to find a derivation.

     2. Team Challenge (25 minutes):
          - Teams work. Instructor circulates.
          - Materials: paper and pen for each team.

     3. Group Discussion (20 minutes):
          - Bring the class together.
          - Ask: "Did anyone find a derivation to MU?" (No.)
          - Ask: "What did you try? What strings did you get?" 
          - Write some example strings on the board (from the teams): e.g., MI, MII, MIIII, MIU, MUI, etc.
          - Ask: "What do these strings have in common? What property do they share that MU does not?"
          - Guide the discussion to the number of I's. Ask: "What operations change the number of I's? How?"
          - If they don't get to mod 3, ask: "What happens to the number of I's when you duplicate? ... when you replace three I's with a U?"
          - Then, if needed, ask: "If you look at the number of I's modulo 3, what do you notice?" 
          - Once they see that the residue mod 3 is always 1 or 2, and MI starts at 1 and MU requires 0, then they have the proof.

     4. Conclusion (10 minutes):
          - Explain the inside/outside contrast: 
              "Inside the system: we try to apply the rules step by step. Outside the system: we notice an invariant property that must hold for every string that can be derived. This invariant property (residue mod3) is not mentioned in the rules, but it is preserved by every rule. Therefore, we can conclude that MU is impossible."
          - Mention that this is a general method.

     Note: The entire group discussion and conclusion should take 30 minutes? But we allocated 20+10=30. So it fits.

     But wait: the group discussion and conclusion together are 30 minutes? Then total: 5+25+30=60.

     Adjust: 
          Introduction: 5 minutes.
          Team Challenge: 20 minutes (instead of 25) to save 5 minutes? 
          Then Group Discussion: 20 minutes, Conclusion: 10 minutes -> total 55. Then we have 5 minutes buffer.

     Alternatively, we can do:

          Introduction: 5
          Team Challenge: 25
          Group Discussion and Conclusion: 30 minutes (combined, flexible).

     But 25+5+30 = 60.

     So it's okay.

     Final note: the exercise cannot show how to choose the invariant. That must be explained in the conclusion as part of the meta-reasoning.

