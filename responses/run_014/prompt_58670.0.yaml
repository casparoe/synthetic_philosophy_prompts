answer: |-
  ### Lesson Plan: Stepping Outside the Formal System  
  **Course:** First-Year Seminar on Reasoning  
  **Enrollment:** 22 students  
  **Time:** 60 minutes  
  **Pedagogical Goal:** Students experience exhaustive search within a formal system (MU puzzle) and discover the need for meta-reasoning (invariant properties) to prove impossibility, highlighting the inside/outside contrast.  

  ---

  ### **Grouping & Materials**  
  - **Grouping:** Divide into 5 teams of 4-5 students each.  
  - **Materials:**  
    - Whiteboard/marker per team.  
    - Puzzle handout (rules + starting/target strings):  
      > **Start:** MI  
      > **Target:** MU  
      > **Rules:**  
      > 1. Add U after a final I (e.g., MI → MIU).  
      > 2. Duplicate the block after M (e.g., MI → MII).  
      > 3. Replace any "III" with U (e.g., MIII → MU).  
      > 4. Delete any "UU" (e.g., MUU → M).  
    - Timer visible to all.  
  - **Symbolic Stakes:**  
    - Teams earn 1 point per **valid derivation step** (max 10 points).  
    - Bonus 5 points for **first team to articulate why MU is impossible**.  
    - Winning team earns "Logic Champion" title (no physical prize).  

  ---

  ### **Sequence & Timing**  
  **1. Introduction (5 min)**  
    - Explain rules and goal. Emphasize: "Work as a team to derive MU from MI. Track every step."  
    - Demo: Show MI → MII (Rule 2) → MIIII (Rule 2) → MIU (Rule 1).  

  **2. Team Challenge (25 min)**  
    - Teams work on derivations. Instructor circulates, observes, and asks probing questions:  
      *"What happens when you try to eliminate the last I?"*  
      *"Can you get a string with zero I’s?"*  
    - **Interim Check (10 min):** Pause briefly. Ask: *"What strategies are you trying? What’s frustrating you?"*  
    - **Scoring:** Teams self-report steps (1 pt/step). Most teams score 4–7 points (e.g., MI → MII → MIU → MIUIU).  

  **3. Group Discussion (20 min)**  
    - **Share Attempts (5 min):** Teams write longest/favorite derivations on board (e.g., MI → MII → MIIII → MUI → MUIU → …).  
    - **Guided Meta-Reasoning (15 min):**  
      - Ask: *"Why is MU so hard to reach? What do ALL your strings have in common?"*  
      - Probe: *"Count the I’s in your strings. What do Rule 3 (replace III) and Rule 2 (duplicate) do to that count?"*  
      - **Key Insight:** Students notice:  
        - Starting I-count: 1 (MI). Target I-count: 0 (MU).  
        - Rules 1/4: Don’t change I-count.  
        - Rule 3: Subtracts 3 I’s (Δ = multiple of 3).  
        - Rule 2: Doubles I-count (e.g., 1→2→4→8→… never a multiple of 3).  
      - **Invariant Emerges:** *"I-count is never divisible by 3!"* → Bonus points awarded.  
      - Formalize: Let \( n \) = number of I’s. Start: \( n \equiv 1 \mod 3 \). Target: \( n \equiv 0 \mod 3 \). Rules preserve \( n \not\equiv 0 \mod 3 \).  

  **4. Conclusion (10 min)**  
    - Name the Contrast:  
      > *"Inside the system, you exhaustively applied rules. Outside, you reasoned about properties invariant under all rules. This ‘jump’ lets us prove impossibility without infinite search."*  
    - Link to Broader Context:  
      - *"Gödel’s incompleteness uses similar meta-reasoning: some truths are unprovable within a system."*  
      - *"In algorithms, invariants prove correctness (e.g., sorting)."*  

  ---

  ### **Debrief: Pivotal Moments & Inside/Outside Contrast**  
  | **Moment in Activity**      | **Connection to Inside/Outside Contrast**                              |  
  |------------------------------|------------------------------------------------------------------------|  
  | **Exhaustive search (20 min)** | *Inside:* Frustration with endless branching (e.g., MII → MIIII → MIIIIIIII → …). Students "live" formal system limitations. |  
  | **Discovery of I-count pattern** | *Transition:* Teams notice I-counts avoid multiples of 3. Shifts focus from rules to global properties. |  
  | **Invariant articulation**   | *Outside:* Using modular arithmetic (not a rule!) to prove impossibility. Meta-reasoning overrides brute force. |  
  | **Conclusion**               | *"Stepping outside" is naming this shift: properties about the system > steps within it.* |  

  ---

  ### **Facilitation Advice**  
  **Likely Issues & Interventions:**  
  - **Problem:** Teams fixate on adding U’s (Rule 1) or deleting UU (Rule 4), ignoring I-count.  
    - *Intervention:* Ask: *"What’s the smallest I-count you achieved? Can you get to zero?"*  
  - **Problem:** Teams loop (e.g., MI → MII → MIIII → MIU → MI → …).  
    - *Intervention:* *"Try a different rule order. Track I-counts on your board."*  
  - **Problem:** Early despair ("It’s impossible!") without reasoning.  
    - *Intervention:* *"Prove it. What property must all derivations share?"*  
  - **Problem:** Misapplying Rule 3 (e.g., replacing "II" or "III" in wrong positions).  
    - *Intervention:* Clarify: *"‘Any III’ means anywhere, not just the end."*  

  **Critical Note: What the Exercise Cannot Enact**  
  The exercise **cannot** demonstrate how to *choose* the right invariant (e.g., why mod 3?). Students will stumble upon I-count through guided frustration, but the insight that *modular arithmetic* unlocks the solution requires explicit explanation:  
  > *"Creativity is needed to find invariants. Here, we noticed Rule 3 changes I-count by multiples of 3, so mod 3 is a natural fit. In other systems, invariants might involve parity, symmetry, or inequalities."*  

  ---

  ### **Instructor Script Snippets**  
  - **During Challenge:** *"Your job isn’t just to find MU—it’s to understand why it’s elusive."*  
  - **During Debrief:** *"When you argued impossibility, you left the game board and studied the rules from above. That’s the ‘jump’—and it’s how logic tackles the unsolvable."*  
  - **Closing:** *"Today, you proved MU can’t exist. Tomorrow, you’ll use this ‘outside’ lens to crack harder problems."*  

  This plan balances struggle, discovery, and meta-cognition, with the inside/outside contrast emerging organically and crystallizing in the finale.
