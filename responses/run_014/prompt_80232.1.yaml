prompt: |-
  I'm writing a paper on fakes and originals, and before I compare theories I want the standard of evaluation fixed. Write the desiderata for an adequate account of why originals matter: the cases it must handle (a perfect physical copy, an original whose maker is unknown, a forgery that later becomes famous in its own right, a digital object where the designation of an original file is arbitrary, a historical document and an exact facsimile), the distinctions it must keep separate (being made by a particular person, being the first instance, having an unbroken causal history, being certified by institutions, being beautiful or evidentially useful), and the constraints it cannot ignore (some copies are valued, some originals are worthless, markets can reward fakes, and authenticity can matter more than quality). Give the reason or motivating case behind each requirement, mark which are non-negotiable and which are contestable, and flag any pair that seems jointly unsatisfiable. Then briefly score causal-historical, institutional, and functional-pragmatic accounts against the list. Finally, say how confident you are in the list itself and identify the single requirement you are least sure about.
reasoning: |-
  Okay, the user is writing a paper on fakes and originals and needs a solid framework to evaluate different theories. They want desiderata—essential criteria—for an adequate account of why originals matter. Let me start by understanding their request thoroughly. They mentioned specific cases: perfect physical copies, originals with unknown makers, famous forgeries, digital files, and historical documents versus facsimiles. Plus, distinctions like authorship, first instance, causal history, institutional certification, and aesthetic/evidential value. Constraints include valued copies, worthless originals, market dynamics, and authenticity sometimes trumping quality.

  First, I should list all the requirements based on their cases, distinctions, and constraints. Each requirement needs a reason and a note on whether it's non-negotiable or contestable. Also, check for any conflicts between requirements. For example, the digital case might challenge the necessity of a physical original, which could conflict with the causal-historical requirement. That’s a possible tension to flag.

  Then, the user wants to score three theories: causal-historical, institutional, and functional-pragmatic. I need to assess how each theory meets the desiderata. Causal-historical might handle authorship and history well but fail on digital objects. Institutional theory might handle certification but not cases where institutions are absent. Functional-pragmatic could address value shifts but might struggle with intrinsic historical significance.

  The user also asks for confidence in the list and the least sure requirement. The digital originality requirement might be the trickiest because defining "original" in digital contexts is inherently fluid. Is the first instance or the creator's file the original? This could be contestable.

  Underlying needs: The user likely wants a comprehensive yet flexible framework to compare theories fairly. They might need to highlight where theories fall short, especially in modern contexts like digital objects. Their deeper need is to present a balanced analysis, showing awareness of both traditional and contemporary challenges in authenticity debates. Ensuring the desiderata cover edge cases will strengthen their paper’s foundation.
answer: |-
  Here is a comprehensive set of desiderata for an adequate account of why originals matter, structured as requested:

  **Desiderata for an Adequate Account of Originals**

  1.  **Handle Perfect Physical Copies (The Indiscernible Duplicate):**
      *   *Case:* A molecularly identical replica of a famous painting (e.g., van Gogh's *Sunflowers*).
      *   *Reason/Motivation:* Tests if the value of the original resides solely in its physical properties or requires something extra (e.g., history, provenance). Why is the replica valued less?
      *   *Status:* **Non-negotiable.** Any account must explain the persistent *premium* placed on the original even when perception is identical.

  2.  **Handle Originals with Unknown Makers (Anonymous Provenance):**
      *   *Case:* An ancient artifact (e.g., a Cycladic figurine) whose creator is entirely lost to history.
      *   *Reason/Motivation:* Tests if the value/status as "original" fundamentally depends on *knowing* the specific author, or if it can rest on other factors (e.g., age, context, uniqueness).
      *   *Status:* **Non-negotiable.** Common in archaeology/history; accounts relying solely on known authorship fail here.

  3.  **Handle Forgeries Famous in Their Own Right (The Successful Fake):**
      *   *Case:* A forgery (e.g., van Meegeren's fake Vermeers) that gains significant historical, artistic, or monetary value *as a forgery*.
      *   *Reason/Motivation:* Tests if "original" status is immutable or context-dependent. Can the fake's own history/craft supersede its initial deceptive intent?
      *   *Status:* **Non-negotiable.** Shows value isn't solely tied to initial authenticity; histories evolve.

  4.  **Handle Digital Originals (Arbitrary Designation):**
      *   *Case:* A digital artwork (NFT or not) or document where any copy is bit-identical. Which file is the "original"? The first saved? The creator's copy? A hash-designated version?
      *   *Reason/Motivation:* Challenges physicalist/materialist accounts. Tests if "originality" requires uniqueness or can be conferred by convention, context, or metadata in non-unique environments.
      *   *Status:* **Non-negotiable (for modern applicability).** Essential for addressing contemporary creation and value.

  5.  **Handle Historical Documents vs. Exact Facsimiles (Evidential Primacy):**
      *   *Case:* The original signed Magna Carta vs. a perfect photographic facsimile.
      *   *Reason/Motivation:* Tests the role of direct physical connection to the past event for evidential/historical value. Is the facsimile sufficient for study, or does the original hold unique significance?
      *   *Status:* **Non-negotiable.** Highlights the importance of unmediated causal connection for historical evidence.

  6.  **Distinguish Being Made by a Particular Person (Authorship):**
      *   *Case:* Distinguish a Rembrandt from a perfect pupil copy.
      *   *Reason/Motivation:* Central to art, literature, and intellectual property. Captures the intuition that the creator's hand/intention matters.
      *   *Status:* **Non-negotiable.** Foundational to many discussions of originality and value.

  7.  **Distinguish Being the First Instance (Temporal Primacy):**
      *   *Case:* The first printing of *Ulysses* vs. a later identical printing from the same plates.
      *   *Reason/Motivation:* Captures collector's value, historical significance of "the first," and sometimes authenticity tied to initial creation context.
      *   *Status:* **Contestable.** While important in many contexts (e.g., collectibles), it might be secondary to authorship or causal history in others (e.g., art).

  8.  **Distinguish Having an Unbroken Causal History (Provenance/Chain of Custody):**
      *   *Case:* A painting with documented ownership back to the artist vs. one with gaps, even if authentic.
      *   *Reason/Motivation:* Essential for authentication, historical significance, and often monetary value. The "biography" of the object matters.
      *   *Status:* **Non-negotiable.** Provenance is a primary tool for establishing trust and historical connection.

  9.  **Distinguish Being Certified by Institutions (Social Validation):**
      *   *Case:* A painting authenticated by the Louvre vs. an identical-looking one dismissed by experts.
      *   *Reason/Motivation:* Reflects the social, market, and epistemic reality that institutions gatekeep authenticity and value.
      *   *Status:* **Contestable.** While powerful in practice, an account should explain *why* certification matters (or doesn't) beyond mere authority, potentially reducing it to a proxy for other factors (evidence, provenance).

  10. **Distinguish Being Beautiful or Evidentially Useful (Intrinsic/Functional Value):**
      *   *Case:* A stunning forgery vs. a damaged but authentic masterpiece; a clear historical document facsimile vs. the faded original.
      *   *Reason/Motivation:* Tests if the value of the original is separable from its immediate aesthetic or functional properties. Why prefer the faded original if the facsimile is clearer?
      *   *Status:* **Non-negotiable.** Must explain why authenticity can outweigh superior immediate utility or beauty.

  11. **Acknowledge Some Copies are Valued (Copy Value):**
      *   *Constraint:* Posters, reproductions, authorized replicas hold value (aesthetic, educational, decorative).
      *   *Reason/Motivation:* Prevents the account from implying *only* originals have value. Explains the role of copies.
      *   *Status:* **Non-negotiable.** A realistic account must accommodate this.

  12. **Acknowledge Some Originals are Worthless (Original Disvalue):**
      *   *Constraint:* A boring, poorly made, or historically insignificant original artifact.
      *   *Reason/Motivation:* Prevents the account from implying *all* originals are inherently valuable. Authenticity is necessary but not sufficient for value.
      *   *Status:* **Non-negotiable.** Counteracts essentialism about "original = valuable".

  13. **Acknowledge Markets Can Reward Fakes (Perverse Incentives):**
      *   *Constraint:* Undetected forgeries can command high prices; markets sometimes incentivize fakery.
      *   *Reason/Motivation:* Highlights that the *perception* or *belief* in authenticity (even if false) can drive value, separate from actual originality or institutional view.
      *   *Status:* **Non-negotiable.** Reflects real-world complexity.

  14. **Acknowledge Authenticity Can Matter More than Quality (Authenticity Premium):**
      *   *Constraint:* A slightly superior copy might be valued less than the authentic but slightly flawed original (e.g., a Stradivarius vs. a modern replica).
      *   *Reason/Motivation:* Captures the core intuition driving the need for the theory: the "aura" or significance attached to authenticity itself.
      *   *Status:* **Non-negotiable.** The central puzzle to be explained.

  **Flagged Tensions:**

  *   **#4 (Digital Original) vs. #7 (First Instance) & #8 (Causal History):** In the digital case, designating "the first" or a "unique causal history" is often arbitrary or impossible (multiple identical copies created simultaneously). An account prioritizing #7 or #8 struggles with #4. Conversely, an account resolving #4 (e.g., via institutional designation) might weaken #7/8 in traditional contexts.
  *   **#6 (Authorship) vs. #3 (Famous Forgery):** If authorship is paramount (#6), how can a forgery (#3), defined by *not* being by the purported author, gain significant value *as an object*? The account must reconcile the negative value of deception with the positive value accrued through its own history/craft.

  **Scoring Accounts:**

  1.  **Causal-Historical (Focus: Direct physical chain from creator/event):**
      *   *Strengths:* Excels at #5 (Evidential Primacy), #6 (Authorship - if creator is known), #8 (Provenance). Explains #1 (Perfect Copy lacks history) and #14 (Authenticity premium from connection). Handles #2 (Unknown Maker) if the chain *to the origin period* suffices, even without a name.
      *   *Weaknesses:* Fails critically on #4 (Digital - no unique physical chain). Struggles with #3 (Famous Forgery - its own history is causal but deceptive). May undervalue #9 (Institutions - seen as secondary evidence). Doesn't directly explain #13 (Market rewards fakes - based on false belief).

  2.  **Institutional (Focus: Designation by authorities/communities):**
      *   *Strengths:* Excels at #9 (Certification), explains #3 (Famous Forgery - institutions can reclassify it), handles #4 (Digital - original defined by institutional convention/NFT), explains #13 (Market rewards - follows institutional belief). Can address #2 (Unknown Maker - institutions authenticate the *object* as period-original).
      *   *Weaknesses:* Struggles with #1 (Perfect Copy - if institutions *could* certify it as equal, why don't they/why wouldn't it be?). May struggle with #5 (Evidential Primacy - why trust the original document *more* than a facsimile if institutions say both are evidentially equal?). Risks circularity ("original because institution says so"). Undermines #6 (Authorship) and #8 (History) if institutions ignore/override them.

  3.  **Functional-Pragmatic (Focus: Role, use, and consequences in a context):**
      *   *Strengths:* Excels at #3 (Famous Forgery - value shifts with function/context), #10 (Beauty/Use - explains why originals *or* copies might be preferred based on purpose), #11 (Copy Value), #12 (Worthless Originals), #13 (Market - value based on perceived function). Handles #4 (Digital - original defined by its functional role in a system/context).
      *   *Weaknesses:* Struggles to explain the persistent, seemingly non-functional premium in #1 (Perfect Copy) and #14 (Authenticity > Quality). May reduce #5 (Evidential Primacy) to mere convention/current utility, ignoring the intuitive weight of the original document. Can feel relativistic, potentially undermining #6 (Authorship) and #8 (History) as core factors.

  **Confidence in the List & Least Sure Requirement:**

  *   **Confidence:** Moderately High. The list covers the major philosophical puzzles, practical cases, distinctions, and constraints drawn from art history, law, collecting, history, and digital culture. The cases and constraints are well-established in the literature. The distinctions reflect core conceptual differentiations.
  *   **Least Sure Requirement:** **#7 (Distinguish Being the First Instance - Temporal Primacy).**
      *   *Reason for Doubt:* While crucial for collectors and some historical contexts (e.g., first editions), its *independent* necessity for "originality" is less clear. Is the artist's own later identical copy (e.g., a restrike of a print authorized by the artist) less "original" than the first? Many accounts might successfully reduce "firstness" to aspects of #6 (Authorship - the first embodies the initial creative act most directly) or #8 (Causal History - the first has the longest/most significant history). Its importance feels more contingent (market-driven, collector-specific) than fundamental to the *concept* of originality in all cases. However, excluding it risks missing a significant dimension of value in practice. This makes it the most contestable and context-dependent requirement on the list.
