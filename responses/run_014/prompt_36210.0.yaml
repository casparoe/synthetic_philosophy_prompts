  The positions map neatly: Thomsonian views emerge early from autonomy emphasis; psychological capacities come from node 5; deprivationism requires specific path through nodes 1,2,3,5,6; strict views come from seeing abortion as killing with obligation; gradualism gets its own branch.

  I'll add a node about developmental stages (node 7) specifically for gradualism. The tree should have exactly 10 nodes to stay within the 8-12 range. 

  For unoccupied branches: I need to check if any combinations are possible but unexplored. The main gap is accepting bodily obligations but rejecting responsibility for risks - this seems incoherent. Another is combining future-loss view with contraception being fine - inconsistent. 

  For inseparable positions: deprivationism and strict sanctity-of-life might align on many nodes but diverge on contraception. Thomsonians and psychological-capacities liberals might both reject early obligations but for different reasons. I'll note this clearly.

  The handout should be structured exactly as requested: full tree first, then unoccupied branches, then inseparable positions. I'll make sure every node uses concrete cases and avoids philosophical jargon.
answer: |-
  Here is the decision tree structured for your handout, built from logical space with concrete cases:

  **The Tree**  
  *Answer each question based on your immediate reaction. Proceed to the next numbered question as directed.*

  1.  **The Violinist:** A famous unconscious violinist will die unless connected to your kidneys for 9 months. Is it *seriously morally wrong* for you to refuse to be connected?  
      *   **Yes** → Go to Q2  
      *   **No** → Go to Q4  

  2.  **The People-Seeds:** Imagine tiny "people-seeds" drift in like dust; one takes root in your carpet despite screens. Is it *seriously morally wrong* to vacuum it up, knowing this risk existed?  
      *   **Yes** → Go to Q3  
      *   **No** → **Leaf: Thomsonian Bodily-Autonomy Liberalism** (Abortion often permissible, even if fetus has right to life, due to bodily autonomy & lack of imposed duty)

  3.  **Unplugging vs. Injecting:** Unplugging the violinist (or fetus) is:  
      *   **Killing them (like injecting poison)** → **Leaf: Strict Sanctity-of-Life Opposition** (Abortion generally wrong; life begins at conception & must be protected)  
      *   **Letting them die (like refusing connection)** → Go to Q5  

  4.  **The Coma Patient:** A human in a temporary coma (will wake in 9 months) needs your specific blood type for life support. Is it *seriously morally wrong* to refuse?  
      *   **Yes** → Go to Q7  
      *   **No** → Go to Q5  

  5.  **Why Killing is Wrong:** What makes killing an innocent adult human wrong *primarily*?  
      *   **What they lose (their future experiences, projects, life)** → Go to Q6  
      *   **What they are *right now* (consciousness, desires, relationships, etc.)** → **Leaf: Psychological-Capacities Liberalism** (Abortion permissible until significant psychological capacities develop)

  6.  **The Contraception Question:** If the core wrong of killing is losing a valuable future, is contraception potentially morally similar to killing?  
      *   **Yes, that seems logically consistent** → **Leaf: Deprivationism (Marquis-Style)** (Abortion generally wrong because it deprives the fetus of a valuable future like adult killing)  
      *   **No, contraception is clearly fine** → **Leaf: *Unoccupied Branch A*** (See explanation below)

  7.  **Gradual Difference:** Does the moral status of the developing fetus change significantly *during pregnancy* based on its development?  
      *   **Yes, it becomes more protected over time** → **Leaf: Gradualist View** (Permissibility decreases as pregnancy progresses/fetus develops)  
      *   **No, it has the same status throughout** → **Leaf: Strict Sanctity-of-Life Opposition** (Abortion generally wrong; life begins at conception & must be protected)

  ---

  **Unoccupied Branches**

  1.  **Branch A (Q6 "No"):** Combining "killing is wrong due to lost future" with "contraception is clearly fine" is **incoherent** within the logic of the future-loss view; it requires rejecting the core premise when applied to contraception.
  2.  **Branch B (Q1 "Yes" + Q2 "No"):** Affirming a duty to the violinist but denying duty for the people-seed risk is **unattractive**; it struggles to justify why bodily imposition is obligatory for strangers but not for risks one knowingly accepted.
  3.  **Branch C (Q4 "Yes" + Q7 "No"):** Affirming a duty to the coma patient but denying gradualism is **unexplored**; it logically points to a non-gradualist, non-Thomsonian position valuing current human biology/organization highly from conception, but not fitting strict sanctity.

  ---

  **What the Tree Cannot Separate**

  1.  **Deprivationism (Marquis) vs. Strict Sanctity-of-Life:** These routes converge at Q3 ("Killing") for deprivationists who took Q1 Yes, Q2 Yes, Q3 "Killing" *or* at Q7 "No" for deprivationists who took Q1 No, Q4 Yes, Q7 "No". They answer the contraception question (Q6) differently ("Yes" vs. unasked/implied "Irrelevant"), but the tree branches *before* Q6 for the sanctity path. The contraception question is the key differentiator the tree doesn't force for the sanctity path.
  2.  **Thomsonian Liberalism vs. Psychological-Capacities Liberalism:** Both answer Q1 "No" (no violinist duty) and Q4 "No" (no coma patient duty), leading directly to their leaves. They agree on permissibility in many cases but for fundamentally different reasons (bodily autonomy vs. lack of developed psychology). The tree identifies their agreement on core duty questions but doesn't probe their distinct underlying justifications.
  3.  **Some Gradualists vs. Strict Sanctity:** Gradualists who answer Q7 "No" (same status throughout) land on Strict Sanctity, though this contradicts the gradualism label. This captures gradualists whose threshold is conception, effectively making them strict opponents. The tree routes them together.
