  For the violinist question (node 1), a "no" answer leads to strong bodily autonomy support, while "yes" suggests some obligation exists. Then for the people-seed case (node 2), a "no" answer maintains strong autonomy, while "yes" introduces responsibility arguments. 

  Next comes the killing/letting die distinction (node 3). For those who answered "yes" to both previous questions, this becomes crucial - if they see abortion as killing, it's likely a strict view; if as letting die, it might lead to deprivationism. 

