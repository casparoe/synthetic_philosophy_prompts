  **Rationale & Teaching Notes:**  
  1. **Sequence Logic:**  
     - Start with relatable motivations ("Why do you go to college?") to create stakes.  
     - **Doomsday first** to induce unease, **then Continuation** to reveal the unnoticed foundation of motivation.  
     - Contrast **only after both are clear**—students must feel the asymmetry in responses.  

  2. **Carrying Example Selection:**  
     - The scientist case works because:  
       * *Must_have elements* show dependence on humanity's future (project needs future humans).  
       * *Must_lack elements* preempt "legacy" misconceptions (no personal benefit/credit).  

  3. **Misconception Timing:**  
     - Address "personal immortality" **immediately** when introducing Doomsday (students hear "30 days" and fixate).  
     - "Legacy" misconception often arises **during the example**—shut down by emphasizing the project's intrinsic value.  
     - "Environmentalism" reduction appears **late**—clarify it's about all human endeavors.  

  4. **Understanding Check:**  
     - The question isolates Scheffler's core claim: If students grasp that the *project's continuation* matters independently of personal memory/credit, they get it.  

  5. **Leave Out Justification:**  
     - Normative implications ("Should we protect humanity?") derail the descriptive focus. Scheffler's point is about what we **do** value, not what we **ought** to value.  

  **Time Allocation Tip:**  
  - Spend 70% on sequence steps 1-4 (scenario immersion and contrast), 20% on thesis abstraction, 10% on understanding check. Cut discussion of "leave out" topics firmly.
