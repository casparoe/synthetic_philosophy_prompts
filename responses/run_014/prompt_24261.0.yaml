prompt: |-
  I'm a TA and next week I have to teach Samuel Scheffler's "afterlife" thought experiment to first-years in one 50-minute section. The book is *Death and the Afterlife*; the core move is the pair of scenarios (a "doomsday" world where Earth is destroyed shortly after each person's death, versus a world where humanity and its projects continue indefinitely) that he uses to argue that what we care about is the indefinite continuation of the species and its undertakings, not our own survival or the survival of particular people. Don't explain it to me; plan how I should teach it. I want the order in which the pieces must be introduced and why (what depends on what — e.g., what has to be in place before the two scenarios can even be contrasted), the one concrete case to build it around and what that case must have and lack, the misconceptions the students will predictably bring or form (I'm expecting at least: that the point is about personal immortality, that it's really about the dead, that it's just environmentalism, and that it reduces to "leaving a legacy"), and the exact point in the sequence where each should be headed off. Include a check I can run at the end that tells me they grasp the claim itself rather than just feeling unsettled, and name one thing I should openly refuse to address in this section. Give me the plan as a JSON object with these fields: "sequence" (an array of steps, each with "step_name" and "why_now"), "carrying_example" (an object with "case", "must_have", "must_lack"), "misconception_map" (an array, each item with "misconception", "where_it_forms", "how_to_head_off"), "understanding_check" (a string), and "leave_out" (a string).
reasoning: |-
  We are teaching Scheffler's "afterlife" thought experiment from "Death and the Afterlife". The core is the two scenarios: 
   1. The "doomsday" scenario: Earth is destroyed 30 days after each individual's death. 
   2. The "continuation" scenario: Humanity and its projects continue indefinitely after one's death.

   Scheffler's claim: What we fundamentally care about is the indefinite continuation of humanity and its projects (the "afterlife"), not merely our own personal survival or the survival of specific loved ones.

   Plan for a 50-minute section:

   Sequence: We need to build up to the thought experiment step by step.

   Carrying example: We need a concrete case that students can relate to. The example must have: 
     - An activity that is future-oriented and requires a long time horizon (e.g., scientific research, building a monument, raising children, writing a book for future generations).
     - It must lack any direct personal benefit to the agent in the case (so that we can see the motivation is about the future beyond oneself).

   Misconceptions to address:
     1. That the point is about personal immortality: Students might think Scheffler is arguing for the importance of living forever. We must head this off by emphasizing that the thought experiment is about the continuation of humanity after one's death.
     2. That it's really about the dead: They might think the concern is for the state of the dead. But it's about the living and their motivations.
     3. That it's just environmentalism: They might reduce it to caring about the planet. But it's about the continuation of human projects and values.
     4. That it reduces to "leaving a legacy": They might think it's just about being remembered. But Scheffler argues it's about the actual continuation of human activities.

   Understanding check: A question or activity that tests if they grasp the claim (the importance of the collective afterlife) rather than just feeling unsettled by the doomsday scenario.

   Leave out: We should avoid getting into the metaphysical or religious aspects of an afterlife (like heaven or reincarnation) because Scheffler is talking about a secular, collective afterlife.

   Let's structure the JSON as requested.
