prompt: |-
  I run a small behavioral insights team inside a city government. We design nudges — default changes, social norm messages, simplified forms — for stuff like tax compliance, recycling rates, vaccination uptake. Lately the city council's been on us about whether we're just doing paternalism by another name, and honestly we dont have a clear internal standard for where the line is. I need a decision procedure my team can actually use to screen a proposed nudge before we pitch it. Give me exactly five questions we ask in order, each with a stop/go rule (like "if the answer is X, the nudge is out" or "proceed to next question"). The procedure should handle the hard cases: nudges that work by exploiting a cognitive bias the target doesnt know about, nudges where the primary beneficiary is the government not the citizen, and nudges we'd be embarrassed to describe publicly. Be honest about which steps are value judgments dressed up as procedure. Then walk two proposals through the five questions: (a) switching a city form so residents default to organ donor status unless they check an opt-out box, and (b) sending a letter to late tax filers saying "9 out of 10 of your neighbors already paid." Format the whole response as exactly five numbered items — no intro paragraph, no concluding paragraph, just the five questions with their rules and how each proposal fares.
reasoning: |-
  Okay, the user runs a behavioral insights team in city government and needs a practical decision procedure to evaluate nudges. They're facing scrutiny from the city council about paternalism concerns and lack clear internal standards. 

  Hmm, they specifically want five sequential questions with stop/go rules that handle tricky cases like exploiting cognitive biases, government-benefiting nudges, and "embarrassing" interventions. They also want two concrete examples tested: organ donor defaults and social norm tax letters. 

  The user seems stressed about political pushback ("city council's been on us") and frustrated by vague ethical boundaries ("dont have a clear internal standard"). Underneath, they probably need both procedural legitimacy and moral defensibility. Interesting that they acknowledge "value judgments dressed up as procedure" - shows self-awareness. 

  For the framework, I'll need to layer ethical checks: First, harm potential (physical/psychological). Then transparency and reversibility since those address autonomy concerns. Third, motive - calling out where government interests might override citizen welfare. Fourth, bias exploitation with special scrutiny for deception. Finally, public exposure as a "veil of ignorance" test. 

  The organ donor case is ethically strong but might trip on reversibility if the opt-out is cumbersome. The tax letter is shakier - it uses peer pressure (bias exploitation) and primarily benefits government coffers. I should flag where value judgments creep in, like defining "reasonable effort" for reversibility or weighing citizen vs government benefit. 

  ...Wait, should Question 3 about primary beneficiary be a hard stop for government-benefiting nudges? No, because sometimes aligned interests exist (like taxes funding services). Better to make it a scrutiny trigger. Also noting that "embarrassment" in Question 5 is deliberately subjective - it's a political reality check.
answer: |-
  Here are five sequential screening questions with stop/go rules, including value judgment flags:

  1.  **"Does this nudge create a significant risk of physical harm, severe psychological distress, or irreversible financial loss for the target individual, even if they later change their mind?"**
      *   **Stop/Go:** If YES, the nudge is **OUT**. Proceed if NO.
      *   **Value Judgment Flag:** Defining "significant risk" and "severe distress" involves judgment. Low risk is acceptable; high risk is not.
      *   **Organ Donor Default:** NO. Opting out is possible. No direct harm from the default itself. **GO**.
      *   **Tax Letter:** NO. The letter itself poses no direct physical/financial harm or severe distress. **GO**.

  2.  **"Is the nudge's mechanism and purpose transparent to the target at the point of decision, and can the choice be reversed with reasonable effort?"**
      *   **Stop/Go:** If BOTH transparency *and* reversibility are NO, the nudge is **OUT**. If YES to both, **GO**. If mixed, proceed but requires high scrutiny at Q4 & Q5.
      *   **Value Judgment Flag:** Defining "transparent mechanism" (e.g., is a default *inherently* transparent?) and "reasonable effort" for reversal involves judgment.
      *   **Organ Donor Default:** *Transparency:* Mixed (default is clear, but people may not actively notice/consider it). *Reversibility:* YES (opt-out box). **Proceed with Scrutiny**.
      *   **Tax Letter:** *Transparency:* Mixed (message is clear, but the *exploitation* of social pressure may not be obvious). *Reversibility:* YES (paying the tax reverses the 'non-compliance'). **Proceed with Scrutiny**.

  3.  **"Is the primary beneficiary of the nudge's intended outcome the individual being nudged, or a broader public good that demonstrably includes them?" (If purely government operational/financial benefit, proceed but triggers high scrutiny)**
      *   **Stop/Go:** NEVER an automatic OUT based solely on beneficiary. If primary beneficiary is solely government operational/financial efficiency (not broader public good), **Proceed to Q4 & Q5 with HIGH SCRUTINY**. If primary beneficiary is the individual or a public good including them, **GO** to Q4.
      *   **Value Judgment Flag:** Defining "primary beneficiary" and "public good" is inherently value-laden. Weighing government efficiency vs. citizen benefit is core to the paternalism concern.
      *   **Organ Donor Default:** Primary beneficiary is potential organ recipients (public good including the nudged individual). **GO**.
      *   **Tax Letter:** Primary beneficiary is government revenue collection (operational/financial efficiency). While funds public services (broader good), the *direct* nudge benefit is government. **Proceed with HIGH SCRUTINY**.

  4.  **"Does the nudge rely on exploiting a cognitive bias or heuristic in a way that could reasonably be seen as deceptive, manipulative, or that significantly impairs rational deliberation *without* a clear, overriding public welfare justification?"**
      *   **Stop/Go:** If YES (exploitative *and* deceptive/manipulative/impairing *without* strong public justification), the nudge is **OUT**. If NO, or if exploitation is present but justified by strong public welfare (e.g., saving lives), **GO** to Q5. Requires careful weighing.
      *   **Value Judgment Flag:** Defining "deceptive/manipulative/impairing," "reasonable," and the strength of "public welfare justification" are critical value judgments. This is the core "exploitation" test.
      *   **Organ Donor Default:** Exploits status quo bias/inertia. Not inherently deceptive (opt-out clear). Impairs deliberation? Mildly (via inertia). Public welfare justification (saving lives) is VERY strong. **GO** (Justification outweighs mild bias exploitation).
      *   **Tax Letter:** Exploits social proof/conformity bias. Not deceptive (statement is factual). Can manipulate via peer pressure. Impairs rational deliberation? Potentially (focuses on peers, not legal/moral duty). Public welfare justification (funding services) is moderate. **Marginal - Proceed to Q5** (Debatable if manipulation & impaired deliberation are significant enough *without* stronger justification).

  5.  **"Would we be hesitant to describe the full mechanism and intent of this nudge, including the exploited bias and primary beneficiary, honestly and transparently in a public forum (e.g., council meeting, press release) due to perceived ethical concerns or potential backlash?" (The "Sunlight Test")**
      *   **Stop/Go:** If YES, the nudge is **OUT**. If NO (we can confidently defend it publicly), the nudge is **APPROVED**.
      *   **Value Judgment Flag:** "Hesitant" and "perceived ethical concerns" are subjective, but this forces confronting the team's own ethical discomfort and political reality. Embarrassment often signals an ethics problem.
      *   **Organ Donor Default:** NO. Easy to defend publicly: "We use a default to increase life-saving registrations based on known inertia, but anyone can easily opt-out." **APPROVED**.
      *   **Tax Letter:** YES. Likely hesitation: Explaining we're using peer pressure specifically to make people feel bad/embarrassed to pay taxes primarily for government revenue. Could easily be framed as manipulative. **OUT**.
