  ## Muscle & Morality: A Bioethics Brawl

  **Setting:** Staff lounge during a slow afternoon. ELENA, late 30s, methodically stirs her tea, radiating focused intensity. KAI, early 40s, leans back, tapping a pen against a well-worn notebook.

  **Case:** "MyoPeak" – an injectable therapy developed for Duchenne Muscular Dystrophy. In healthy individuals, it reliably pushes endurance (stamina, recovery) to the 99th percentile. Higher doses achieve more. No known side effects. Production scaled, cost low (~$50/dose annually). Approved for Duchenne; off-label use surging.

  **(Dialogue Start)**

  **Kai:** (Sighing, closing notebook) Okay, Elena. MyoPeak. Again. Your reading group’s obsession is leaking. Let me guess: you think the NHS *shouldn't* cover it for healthy kids wanting to be star athletes, but *should* for kids with actual Duchenne? And that’s the sacred therapy/enhancement line doing moral heavy lifting?

  **Elena:** (Setting spoon down precisely) Not *sacred*, Kai. But fundamental. Yes. Covering it for Duchenne is restoring basic function – the ability to walk, breathe, *live*. Giving it to a perfectly healthy kid to run marathons faster? That’s augmentation. Pursuing excellence is fine, but not on the public dime, and parents shouldn’t feel pressured to chemically engineer mini-Olympians just to keep up.

  **Kai:** "Restoring basic function." Define "basic." Define "normal." Is a kid born with poor endurance, say 20th percentile, "diseased"? If not, why is restoring *them* to 50th percentile with MyoPeak "therapy," but boosting a 50th-percenter to 99th "enhancement"? It's all statistical species-typicality! Drawing the line at "disease" just hides the arbitrariness. Before glasses, myopia was "normal" suffering. Now it’s correctable impairment. MyoPeak for endurance is just… glasses for muscles. Better glasses.

  **Elena:** (Leaning forward) It’s *not* just statistics, and you know it. The Duchenne kid *lacks* a fundamental capacity – ambulation, often respiration – due to a specific pathological process. The "poor endurance" kid? They can run, play, live a full life, even if they tire faster than peers. The *goal* of intervention is different. For Duchenne, it’s preventing catastrophic loss, restoring participation in the human baseline. For the healthy kid, it’s exceeding that baseline for competitive advantage. The moral weight comes from the context of loss versus the context of gain.

  **Kai:** But that "human baseline" is a moving target! Insulin restored diabetics to a baseline. Vaccines prevent deviation *from* the baseline. Are you saying once we *can* easily and safely push past the old statistical norms, we *shouldn't*? That we’re morally obligated to cling to the limitations of our ancestors? What’s so virtuous about *not* curing easily curable sub-optimality? If MyoPeak is safe and cheap, denying it to a healthy kid feels like denying them an education – it’s withholding a tool for flourishing.

  **Elena:** (Nodding slightly) Safe and cheap *now*. But flourishing isn't just about capacity. It’s about the *mode* of achievement. There’s value in striving within our given limits. Pushing MyoPeak on healthy kids commodifies the body, makes endurance purely transactional. It risks creating a new "normal" where *not* using it becomes a disadvantage, coercing everyone into enhancement. That’s qualitatively different from curing polio. And what about sports? Should the kid on MyoPeak compete against unenhanced peers? That’s clearly unfair.

  **Kai:** Ah, sports! The one place where your distinction *might* have pragmatic traction. Fine, maybe sports bodies need arbitrary rules – like weight classes or equipment specs – to preserve competition. But that’s a *social convention* for a specific context, not a deep moral truth! It doesn’t mean MyoPeak is *inherently* immoral for general use. And your "coercion" point cuts both ways. *Not* providing safe, effective enhancements when they become baseline care *also* coerces people – into accepting avoidable limitations. Why is preserving the old statistical average less coercive than embracing a new, higher one?

  **Elena:** Because the "old average" represents the shared, un-engineered human condition – the ground of equality from which we start. It’s the platform for authentic effort and merit. When we start augmenting beyond it medically, we fracture that ground. The distance between the enhanced and unenhanced becomes unbridgeable by effort alone. That undermines the social contract. Therapy *maintains* the platform; enhancement *replaces* it with a tiered system. That’s the deeper worry – not hand-wavy "unnaturalness," but the erosion of a fundamental human reciprocity.

  **Kai:** (Tapping pen faster) Reciprocity? We already have massive, unearned inequalities – genetics, wealth, nutrition, early childhood education. MyoPeak, if available to all via NHS, could *reduce* some of those inequalities by boosting a capacity previously tied to luck. You’re privileging one kind of "given" (muscle fiber composition) over others (parental income, access to trainers). Why is the biological baseline sacrosanct while the social one is fair game? If we can safely flatten a playing field *upwards*, why cling to the lower, bumpier one out of some nostalgia for "authentic" struggle?

  **Elena:** (Frowning) It’s not nostalgia. It’s about the nature of the intervention. Correcting social disadvantage through education or opportunity operates on the *external* environment. MyoPeak alters the *internal* biological agent directly. It changes the self in a way that bypasses effort and character development integral to striving. And "safe" is a low bar. We don’t know the long-term societal effects of normalizing such direct biological enhancements. The therapy/enhancement line, fuzzy as it is, forces us to ask *why* we’re intervening. Is it to heal, or to exceed? That *why* matters morally.

  **Kai:** Long-term effects are a separate prudential argument, not a moral one about the line itself. And altering the "internal agent"? Please. Coffee alters my alertness. Education literally reshapes my brain. MyoPeak reshapes mitochondria. It’s all biology. Distinguishing "internal" vs. "external" is just another arbitrary fence. The *only* consistent line is between harmful and beneficial interventions. MyoPeak, in this scenario, is beneficial for anyone wanting more endurance, full stop. Denying it based on an arbitrary statistical norm *is* the harm.

  **Elena:** (Stands, gathering mug) Beneficial for *what*? For winning races? For working longer hours? For what end? That’s the point! The therapy line anchors intervention to a shared understanding of health and species-typical function – flawed, yes, but the best shared reference we have. Erasing it leaves only individual desire and market forces. Fine for sports bodies to draw *their* arbitrary line. But for healthcare coverage and parenting? We need that anchor. Without it, "beneficial" becomes limitless, and the pressure to enhance becomes tyrannical.

  **Kai:** (Remains seated, looking up) And *with* it, "health" becomes a tyranny of the average, denying people the chance to be better than fine. Your anchor holds us back. NHS should cover it for anyone whose quality of life improves – athlete, clerk, or kid who just wants to keep up on hikes. Parents should decide based on benefit, not your statistical metaphysics. The line is a phantom.

  **Elena:** (At the door) It’s the guardrail against a cliff we haven’t seen yet. We’ll disagree on that forever, Kai. Enjoy your… unenhanced coffee. (Exits)

  **Kai:** (Muttering to his cooling coffee) Guardrail... or just a fence in the wrong place? (Sighs, opens notebook, scribbles angrily). Phantom or not, it’s one hell of a sticky ghost.

  **(End)**
