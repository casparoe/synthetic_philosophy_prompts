prompt: |-
  So I'm a junior and my family runs a small restaurant, and lately my dad's been really sick so my parents are basically counting on me to come in every weekend and most afternoons after school to help out. My mom keeps saying stuff like "we sacrificed everything for you" and "a good son helps his family," and it's gotten really heavy, like I'm supposed to feel guilty if I don't. At the same time my best friend Marcus has been going through a lot — his parents are in the middle of a divorce and he's been really messed up about it — and I think he basically only has me right now. He keeps asking me to come over on weekends to just talk and help him sort through stuff, which is exactly when I'm supposed to be at the restaurant, so I keep having to cancel on him and I feel awful. I also wanted to start getting into a club or something but I've had to drop that too.

  I cant really tell if I'm just being dramatic or if there's a real conflict here, because I feel like I'm failing at being a good son AND a good friend at the same time, and I don't know which one I should prioritize. I read this thing once about how in Confucian philosophy you basically ARE your relationships, like you're not some seperate self, you're defined by being a son, a friend, a student, etc., and it kinda made me think about this. So like, is there a "right" way to think about this? Is it just about picking the most important role and going with it, or is there something more to it? I don't want to blow off my family, but I also don't want to abandon Marcus. What should I actually do?
