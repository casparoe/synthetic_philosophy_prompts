prompt: |-
  You are grading an exam in moral philosophy. Below is the question and one student's answer. Award a total score out of 20 points, allocating five points to each of the four parts, and give point-by-point comments that justify the score. For each part, state what the student gets right and flag any errors, conflations, or steps that do not follow, explaining in each case why the reasoning fails. End with a one-sentence justification of the overall score.

  Question: It is sometimes said that an action can be right without having moral worth. (a) Explain this distinction. (b) Using an example, explain why an action done merely in accordance with duty may lack moral worth. (c) State the requirement that an action be done for the right reason. (d) Consider an agent who performs a right action for two reasons at once: a moral reason (genuine concern for those helped) and a self-interested reason (a desire for praise). Does the action have moral worth? Argue for your answer.

  Student's answer:
  (a) There is a difference between an action's being right and an action's having moral worth. An action is right when it is what the agent ought to do; that is a matter of the action's meeting the demands of morality. Moral worth, by contrast, is a further property that depends on the agent's motivation. An action can be right while having no moral worth, because the worth of the action tracks not only what was done but why it was done.

  (b) The familiar example is the shopkeeper who charges fair prices. If he does so only because overcharging would damage his reputation and his trade, then his action is in accordance with duty — it conforms to what the duty of honesty requires — but it has no moral worth, because his motive is self-interest rather than a recognition of duty. Since it is done from the wrong motive, the action has no moral worth and the agent is not praiseworthy for it.

  (c) For an action to have moral worth, it must be done for the right reason: the agent's determining motive must be the moral one — that the action is right — rather than a self-interested or merely prudent one.

  (d) Suppose an agent donates to a charity both out of genuine concern for the beneficiaries and out of a desire to be seen as generous. I think the action lacks moral worth. The requirement is that the action be done for the right reason, and here a wrong reason — the desire for praise — is also present in the agent's motivation. Because the wrong reason is part of what moves the agent to act, the action is done partly for a wrong reason, and so it is not done for the right reason. The presence of the wrong reason vitiates the action's moral worth.
reasoning: |-
  Okay, let me approach this grading task systematically. The student's answer needs evaluation across four distinct parts, each worth five points. I'll analyze each section carefully, identifying strengths and weaknesses while maintaining alignment with Kantian ethics since the question clearly references his framework.

  For part (a), the student correctly identifies the core distinction: rightness concerns the action's conformity to duty, while moral worth depends on motivation. This captures Kant's position precisely, though adding Kant's terminology about acting "from duty" could strengthen it further. The explanation that moral worth tracks "why it was done" is particularly well-phrased.

  Moving to part (b), the shopkeeper example is appropriately chosen and accurately applied. The student demonstrates understanding that self-interested motivation negates moral worth despite right action. One minor improvement would be explicitly naming Kant's "doctrine of moral worth," but the core reasoning remains sound.

  In part (c), the requirement for moral worth is stated correctly - the moral reason must be the "determining motive." The phrasing could be more precise by specifying that the motive must be duty itself rather than merely "that the action is right," but the substance is accurate.

  Part (d) presents the most complex issue. The student argues that mixed motives negate moral worth, which aligns with Kant's strict view in Groundwork. However, they miss the nuance from Metaphysics of Morals where Kant allows for impure but still morally worthy actions if duty remains the overriding motive. The student correctly identifies the presence of a non-moral motive but doesn't consider whether the moral reason remains dominant.

  I'll award full marks for (a)-(c) given their clarity and accuracy. For (d), I'll deduct one point for overlooking Kant's later development on overriding motives, resulting in 19/20 overall. The answer demonstrates strong comprehension but could benefit from deeper engagement with Kant's evolving thoughts on motivation.
answer: |-
  ### Grading and Comments  
  **Total Score: 19/20**  

  #### (a) Explain the distinction (5/5)  
  **Comments:** The student correctly distinguishes between an action being "right" (conforming to moral duty) and having "moral worth" (dependent on the agent’s motivation). They clarify that moral worth requires the *reason* for acting, not just the outcome. The explanation aligns with Kantian ethics, where an action’s rightness is objective, while its moral worth hinges on subjective motivation. No errors or conflations; the reasoning is precise.  

  #### (b) Example of action lacking moral worth (5/5)  
  **Comments:** The student uses Kant’s shopkeeper example aptly. They correctly note that charging fair prices *merely* for self-interest (to avoid reputational harm) aligns with duty but lacks moral worth because the motive is non-moral. The link between "wrong motive" and absence of praiseworthiness is sound. All key elements are addressed: conformity to duty, self-interested motive, and the resulting lack of moral worth.  

  #### (c) Requirement for moral worth (5/5)  
  **Comments:** The student accurately states that moral worth requires the "determining motive" to be moral (i.e., duty itself). They emphasize that the action must be done *because it is right*, excluding self-interest or prudence. This reflects Kant’s position in the *Groundwork* and avoids conflation with consequentialist views. No flaws in reasoning.  

  #### (d) Mixed-motives case (4/5)  
  **Comments:**  
  - **Strengths:** The student recognizes that the desire for praise is a "wrong reason" and argues that its presence undermines moral worth. This aligns with Kant’s strict view in the *Groundwork*: if any non-moral incentive contributes to the motive, the action lacks moral worth.  
  - **Weakness:** The answer overlooks Kant’s nuanced stance in later works (e.g., *Metaphysics of Morals*), where he allows moral worth if the moral reason is *sufficient on its own* and *overrides* non-moral incentives. By claiming the wrong reason "vitiates" moral worth merely by being "part of what moves the agent," the student implies any mixed motive invalidates worth—a defensible but incomplete reading. A stronger answer would note that moral worth *can* exist if the moral motive is dominant and necessary (e.g., "I would still donate without praise").  
  **Score deduction:** -1 for missing this nuance, though the core argument is coherent.  

  ### Overall Justification  
  This answer demonstrates exceptional understanding of Kantian moral worth, with minor incompleteness in addressing mixed motives, warranting 19/20.
