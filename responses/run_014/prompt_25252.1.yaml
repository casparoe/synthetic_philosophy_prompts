answer: |-
  The impasse you describe regarding the epistemic status of the Church–Turing thesis (CTT) is indeed one of the most persistent and philosophically vexing in the foundations of computation. Your frustration is well-founded: the debate *has* remained remarkably static despite decades of refinement, and your diagnosis—that the core disagreement is not about mathematics, physics, or history, but about the standards for justifying foundational claims—is perceptive and largely correct. However, the situation is even more textured than that. The disagreement is fundamentally a *meta-philosophical* one, rooted in incompatible conceptions of what philosophy itself ought to accomplish when analyzing informal but indispensable notions like "effective computability." It is a clash of frameworks, not a puzzle to be solved within a single shared framework. Understanding this reveals why progress has been elusive and what genuine advancement might look like.

  At its heart, the debate hinges on divergent answers to the question: **What kind of inquiry are we engaged in when we ask about the relationship between informal concepts and formal systems?** The positions you outline are not merely competing answers about CTT; they are manifestations of deeper philosophical commitments about concepts, language, and justification:

  1.  **The Empirical Hypothesis View:** Proponents see philosophy as continuous with natural science. "Effective computability" is a pre-theoretical concept *about the physical world*—specifically, about what processes can be realized to solve problems. CTT is thus a bold conjecture about physical law, akin to the universality of thermodynamics. Falsification would require discovering a physical process violating it. Their standard of justification is empirical adequacy and predictive power within physics.
  2.  **The Conceptual Analysis/Definitional View:** Here, philosophy is an *a priori* enterprise clarifying concepts. "Effective computability" is not a physical property but a conceptual norm—what we *mean* by a procedure being mechanically executable. Church, Turing, Gödel, and Post were engaged in explication, uncovering the essential structure of this concept via formal models. The equivalence of these models is taken as evidence of success. Justification lies in capturing the extension and intuitions of the informal concept, rendering it precise. Falsification is nonsensical; it’s like "falsifying" the definition of a triangle.
  3.  **The Theorem-in-a-Formalization View:** This stance often reflects a formalist or deductivist perspective. Philosophy’s role is minimized; within an accepted formal system (lambda calculus, Turing machines, etc.), CTT *is* a theorem demonstrating that the system captures its own notion of computability. The "thesis" aspect lies only in claiming this formal notion *coincides* with the informal one—a step seen as pragmatic or conventional rather than deeply justificatory. Progress here is mathematical, not philosophical.
  4.  **The Methodological Axiom View:** For pragmatists or certain types of naturalists, philosophy serves science. CTT is a supremely successful regulative principle—a "working hypothesis" that defines the scope of computer science and much of mathematical logic. Its justification is its immense fruitfulness and the absence of counterexamples *within its intended domain*. Questioning it without concrete alternatives is seen as idle speculation. Justification is instrumental success.
  5.  **The Skeptical/Family Resemblance View:** Drawing from Wittgensteinian or contextualist traditions, this view challenges the premise that "effective computability" is a unified, sharply bounded concept amenable to reductive analysis. The meaning is embedded in diverse practices, evolving with context and theory. CTT captures a central, stable core but shouldn’t be reified as an eternal truth. The "disagreement" thus stems from a mistaken quest for a single, context-independent essence. Justification involves descriptive fidelity to the multifaceted use of the concept.

  **Why is this a meta-philosophical impasse?** Because these positions operate with incommensurable notions of what constitutes a satisfactory answer to "What is the epistemic status of CTT?":

  *   The **empiricist** demands physical evidence or refutation.
  *   The **conceptual analyst** demands conceptual coherence and intuitive fit.
  *   The **formalist** demands a derivation within a system.
  *   The **pragmatist** demands utility and stability for ongoing research.
  *   The **skeptic** demands sensitivity to the concept's fluidity and context-dependence.

  No single piece of evidence—mathematical equivalence, physical realizability of Turing machines, absence of counterexamples, existence of hypercomputation models—can simultaneously satisfy *all* these demands. A mathematical proof satisfies the formalist but not the empiricist (who sees it as irrelevant to physics) or the skeptic (who questions the primacy of the formal model). The lack of a physical counterexample satisfies the empiricist and pragmatist but not the conceptual analyst (who sees it as irrelevant to the *meaning*) or the skeptic (who sees it as confirming only a contingent historical practice). The equivalence of formalisms satisfies the conceptual analyst and formalist but doesn't address the pragmatist's focus on utility or the skeptic's point about conceptual fluidity.

  **Is there a hidden substantive question?** Not really. The mathematical and physical facts are agreed upon. The disagreement is about how to *interpret* and *justify* the relationship between those facts and the informal notion.

  **Is it merely verbal?** Only superficially. While the word "thesis" is ambiguous (conjecture? definition? axiom?), the deeper clash is about the standards of philosophical justification and the nature of the concept being analyzed. Calling it "verbal" dismisses the genuine philosophical depth.

  **What would count as progress?** Given this diagnosis, progress cannot mean achieving consensus on the "correct" epistemic status. Instead, progress would involve:

  1.  **Articulating Presuppositions:** More explicit recognition that the debate is meta-philosophical. Philosophers should clearly state their underlying commitments about the nature of concepts, the goals of analysis, and the standards of justification. This moves the debate from "What *is* CTT?" to "What *should philosophical inquiry about computation aim to achieve?*"
  2.  **Mapping the Terrain of Agreement and Disagreement:** Acknowledging precisely *where* the disagreement lies (justification, concept analysis) and where there is substantial agreement (mathematical facts, historical development, the role of CTT in practice). This reduces talking past one another.
  3.  **Engaging Boundary Cases with Nuance:** Instead of using quantum mechanics or hypothetical hypercomputation as blunt instruments to "prove" one view, examining how these cases *challenge* or *are accommodated* by *each* framework. For example, how would the conceptual analyst interpret a claim of non-Turing-computability arising from a new physical theory? How would the pragmatist adjust if such a claim gained significant traction?
  4.  **Clarifying the Stakes:** Demonstrating *why* the disagreement matters beyond academic taxonomy. Does it affect how we interpret results in complexity theory? How we approach the search for new computational models? How we understand the relationship between mind and machine? Connecting the meta-philosophical stance to concrete implications can sharpen the debate.
  5.  **Reframing the Question:** Perhaps moving beyond "What is the status of CTT?" towards questions like: "Under what conditions, and for what purposes, is it fruitful to treat 'effective computability' as having sharp boundaries defined by Turing machines?" or "How does the practice of computation constrain and shape the concept of computability itself?" This shifts focus from justification to description and function.

  The persistence of the debate isn't a sign of confusion or futility, but a testament to the profound nature of the questions CTT forces us to confront about the interplay between informal human concepts, formal systems, and physical reality. The disagreement persists because it touches upon fundamental, unresolved tensions in philosophy itself—tensions about the nature of concepts, the relationship between language and the world, and the methods of philosophical inquiry. Genuine progress lies not in silencing one side, but in deepening our understanding of the sources and implications of the divergence. It requires philosophers to be not just logicians or commentators on science, but reflective practitioners examining their own tools and aims. The debate remains unsettled because the ground it stands on—the nature of meaning and justification—is inherently contested terrain. Recognizing this contestedness, and exploring its structure, is the most valuable form of progress available.
