answer: |-
  ## The Stillness Test: Vaults, Copies, and the Grounds of Persistence

  The debate between endurantism and perdurantism lies at the heart of how objects persist through time. **Endurantism** holds that a persisting object is **wholly present** at every moment of its existence. When you see a tree now, you see the entire tree itself, numerically identical to the tree that existed yesterday and (barring destruction) will exist tomorrow. Its persistence consists in this strict identity being maintained at different times. **Perdurantism**, in contrast, claims that persisting objects are extended through time much as they are extended through space. Just as only a part of a road is present at a given spatial location, only a **temporal part** – a momentary "time-slice" – of an object is present at a given temporal location. The whole object, often called a "spacetime worm," is the sum of all its temporal parts. Persistence is the having of different temporal parts at different times.

  This essay argues that your cases – the Vault and the Copy – exert significant pressure on endurantism and favour perdurantism. While both theories can adopt similar *criteria* for identity over time, perdurantism provides a more robust metaphysical framework for understanding *why* the method of preservation matters fundamentally, even during periods of absolute stasis, and why the intuitive verdicts on the cases are likely correct. It handles the "nothingness" of the forty-year gap more cleanly and grounds the crucial difference between passive preservation and active reconstruction.

  **Case One: The Vault & Case Two: The Copy – Recapitulated**

  In the **Vault**, an animal enters a state of suspended animation for forty years. Crucially, *nothing* happens internally or externally: no metabolism, no change, no interaction, no part replacement. It is, metaphysically speaking, pure stasis. Upon rehydration, it resumes its life seamlessly. Intuition strongly suggests the animal that resumes is numerically identical to the one that entered the vault; it existed, unchanged, throughout.

  In the **Copy**, the animal's precise molecular state is recorded just before desiccation. The original husk is destroyed. During the forty years, a duplicate is constructed in another vault using new matter and the recorded blueprint. Upon hydration, this duplicate awakens, behaving identically to the original. Intuition strongly suggests this resumer is *not* the original animal; it is a replica.

  **The Worry & The Core Question**

  The worry you articulate is potent: If literally *nothing* happens during the forty years in the Vault, what *metaphysical fact* obtains beyond the mere preservation of a material arrangement? Isn't the difference between the Vault (preservation by stasis) and the Copy (preservation by record + reconstruction) merely a difference in the *external causal machinery* surrounding the preserved state? And if so, why should that machinery determine numerical identity? It seems counterintuitive that elaborate external processes (recording and assembling) could ground identity, yet the Vault case, relying only on passive stasis, feels like the paradigm of identity-preservation. This worry challenges the robustness of the intuition in the Vault case, suggesting it might stem from conflating genuine stasis with ordinary cases involving hidden maintenance.

  **Addressing the Cases: Identity Criteria and the Threat of Orthogonality**

  You rightly note that both endurantists and perdurantists can appeal to similar criteria for diachronic identity: immanent causation (causal dependence of later states on earlier ones), continuity of biological organisation, or perhaps a closest-continuer rule. It might seem, therefore, that both theories could simply adopt the same intuitive verdicts on the Vault and Copy cases based on such a criterion, rendering the cases orthogonal to the endurantism/perdurantism debate itself. For instance, both might say the Vault animal persists because its resumed state is *causally dependent* on its pre-stasis state *via* the preserved arrangement, while the Copy animal does not persist because its resumed state depends on the record and assembler, not the original state.

  However, this objection misses the crucial point: **theories of persistence are not just about *when* identity holds, but about *what it is* for an object to exist at and across times.** The cases probe the *metaphysical structure* underlying persistence claims. The worry about the apparent equivalence of preservation methods during stasis directly challenges the endurantist conception of what it means for the *whole object* to be present during the forty years. Perdurantism, by decomposing persistence into temporal parts, offers a more natural explanation for *why* the preservation method matters metaphysically, even when "nothing happens."

  **Existence During Stasis: A Costly Denial?**

  One response to the worry is to deny the datum: perhaps the animal in the Vault *does not exist* during the forty years of total stasis. It ceases to exist upon complete desiccation/husk formation and comes back into existence upon rehydration (perhaps constituted by the same matter). This avoids the need to posit an object "doing nothing" for decades.

  However, this denial comes at a high cost, arguably higher for endurantism than perdurantism. For **endurantism**, the claim that the animal ceases to exist seems deeply counterintuitive and clashes with the strong sense that *it* is there, unchanged, in the vault. If the whole animal must be present whenever it exists, and stasis involves no change, why should stasis *prevent* existence? Furthermore, it creates a puzzle about the resuming animal: Is it a *new* entity miraculously identical to the old one? This borders on the miraculous. Endurantism typically thrives on the intuition of continuous presence; denying existence during stasis directly contradicts that core intuition.

  **Perdurantism** could more readily accommodate this denial. The four-dimensional worm representing the animal would have a "temporal gap" during the forty years. There is a temporal part before stasis (the drying animal), then no temporal part for forty years, then a temporal part afterwards (the rehydrated animal). While still counterintuitive (why should stasis *stop* the worm?), it doesn't violate the core perdurantist tenet that existence at a time requires a temporal part. The resumed animal would be a distinct, later worm causally connected to, but not identical to, the pre-stasis worm. Its apparent identity could be explained by similarity and causal connection alone. Nevertheless, this denial remains deeply unintuitive for both views, as it sacrifices the core conviction that the animal *survives* its suspended animation. The cost of denial is significant for endurantism (undermining its core strength) and merely awkward for perdurantism.

  **The Asymmetry of Stasis: Hole vs. Full Presence**

  This brings us to your third point: the asymmetry in handling the "hole." For the **perdurantist**, existence at a time *requires* a temporal part at that time. A period of total stasis is simply a period where the object has a static, unchanging temporal part – a "frozen" slice of the spacetime worm. The worm persists *through* the stasis by having this part. Stasis poses no inherent problem; it's just another state the worm is in.

  For the **endurantist**, there is no automatic link between change and existence at a time. The object is wholly present at each instant of the forty years. The challenge is explaining what this *means* during total stasis. If the animal is wholly present at time T1 during stasis, and wholly present at time T2 (one picosecond later) during stasis, and nothing has changed *at all*, what distinguishes its existence at T1 from its existence at T2? Endurantism often relies on the object's *causal or dynamic properties* to ground its identity over time, but in stasis, these are absent. Its presence at each moment seems like a bare fact, lacking any internal principle of differentiation across the moments of stasis. It risks becoming an "idle posit."

  Is this a merit for endurantism? Only superficially. While it avoids a "hole," it struggles to explain the *content* of existence during stasis beyond the brute fact of material arrangement. Perdurantism, by contrast, readily incorporates stasis as a state (a static temporal part). The perdurantist can argue that the "idle posit" charge applies more forcefully to the endurantist's wholly present, unchanging object: *what is it* that persists unchanged, if not just the material substrate? Perdurantism explicitly identifies the persistent entity (the worm) as distinct from its momentary states (the parts), allowing the state to be static while the entity persists by having that state. The endurantist's unchanging, wholly present object during stasis seems more metaphysically mysterious.

  **Perdurantism's Advantage: Grounding the Difference**

  Perdurantism handles both cases better because it inherently incorporates the *historical properties* of temporal parts into the identity of the spacetime worm. Consider the moment the animal resumes activity in both scenarios.

  1.  **The Vault:** The resuming temporal part (call it P_resume) is a *direct temporal successor* to the pre-stasis temporal parts. It is *causally connected* to them *via* the continuous presence of the preserved matter/arrangement. Crucially, this matter/arrangement *is* the static temporal parts comprising the forty-year segment of the worm. P_resume is part of the *same worm* that includes the pre-stasis parts and the static parts.
  2.  **The Copy:** The resuming temporal part (P_copy) is *not* a direct temporal successor to the original animal's pre-stasis parts. It is causally connected to them *only indirectly* via the record and the assembler. The matter constituting P_copy is new and was assembled *during* the forty years based on information, not preserved *from* the original. P_copy is the *first* temporal part of a *new* spacetime worm, causally descended from but not identical to the original worm.

  The difference in preservation method – passive stasis versus active reconstruction – is directly reflected in the *causal-historical relations* between the temporal parts. The static temporal parts in the Vault *are* the animal persisting in a particular state; they are causally integrated into the worm's history. The assembler's actions in the Copy generate a *new* series of temporal parts (those of the duplicate body) that stand in a different causal relation to the original. Perdurantism thus explains *why* the external machinery matters: it determines the causal genealogy of the temporal parts, which constitutes the persistence (or not) of the spacetime worm. The "nothingness" of the Vault's forty years *is* the persistence of the animal – it *is* the temporal part(s) persisting unchangingly.

  Endurantism struggles to make this distinction fundamental. If the animal is wholly present throughout the Vault stasis, what metaphysical fact *beyond* the arrangement of matter and its causal connection to the past/future (which is identical in kind to the connection between the original and the Copy, just shorter and direct) grounds its numerical identity? Endurantism seems forced to either accept brute identity during stasis or downplay the significance of the reconstruction process in the Copy, both of which clash with strong intuitions.

  **Verdict: Perdurantism Prevails**

  The Vault and Copy cases are not mere intuition pumps; they probe the metaphysical resources of each theory. They tip the debate significantly in favour of perdurantism. **Perdurantism** provides the superior framework because:
  1.  **It handles stasis naturally:** Stasis is simply the object having static temporal parts. No special explanation is needed for existence without change.
  2.  **It explains the Copy verdict cleanly:** The duplicate's temporal parts lack the direct causal-historical connection to the original worm's parts required for identity; they form a new worm.
  3.  **It grounds the difference in preservation method:** The causal mechanism of preservation (passive stasis vs. active reconstruction) directly determines the genealogical relationship between temporal parts, which is constitutive of persistence for perdurantism.
  4.  **It avoids the endurantist's stasis problem:** It doesn't posit a wholly present object mysteriously persisting unchanged across indistinguishable moments; it posits distinct but qualitatively identical temporal parts integrated into a larger whole via spatiotemporal and causal relations.

  Endurantism, while capturing the *feeling* of continuous presence in ordinary cases, falters when that presence involves absolute changelessness and struggles to elevate the difference in preservation method to the fundamental metaphysical level required to explain the intuitive judgements. Therefore, **these cases support an endorsement of perdurantism as the more explanatorily powerful theory of persistence.**

  **Considering Stage Theory (Exdurantism)**

  A third position, **stage theory** (or **exdurantism**), holds that only momentary object-stages exist. Persistence is not numerical identity over time but a matter of earlier stages standing in a "counterpart relation" to later stages. An object-stage at one time "persists" to a later time if there is a later stage that is its counterpart (typically based on similarity and causal relations).

  Stage theory *could* adopt the intuitive verdicts: The resuming stage in the Vault is a counterpart of the pre-desiccation stage (due to spatiotemporal continuity and direct causal connection via the preserved matter). The resuming stage in the Copy is *not* a counterpart of the original pre-desiccation stage (due to the lack of spatiotemporal continuity and the indirect causal connection via the record/assembler); it might be a counterpart of the record or assembler output instead.

  However, this comes at a high cost: **the radical contingency and relativity of persistence.** Whether the Vault animal "persisted" depends entirely on whether we adopt a counterpart relation that privileges spatiotemporal continuity. We could adopt a different counterpart relation based solely on intrinsic properties, making the Copy duplicate a counterpart (and thus "the same animal") as the original. Stage theory makes persistence fundamentally extrinsic and observer-relative. It dissolves the question of numerical identity over time, replacing it with questions about which counterpart relation is contextually relevant. While it accommodates the case intuitions under one common counterpart relation, it does so by abandoning the core notion of an object enduring as the *same thing*, which both endurantism and perdurantism aim to capture. For someone seeking to understand persistence as a robust metaphysical phenomenon, rather than a pragmatic classification, stage theory's costs are prohibitive. Perdurantism, by preserving numerical identity of the spacetime worm while accommodating the case distinctions, is preferable.

  **The Strongest Objection: Is Stasis Really Persistence?**

  The most potent objection to the perdurantist treatment of the Vault is this: If the forty-year period involves *absolutely no change, no activity, no internal causal processes whatsoever* – not even the minimal processes required for something to be considered a living organism – then in what sense is there an *animal* present at all? Isn't the "static temporal part" merely a complex arrangement of matter, indistinguishable from a meticulously crafted inanimate statue of the husk? Perdurantism might seem to allow persistence too cheaply, by letting a mere static configuration count as a temporal part of a living worm. If life is essentially processual, then during stasis, the animal *is not alive*, and perhaps *does not exist* as an animal. Perdurantism might then be forced to say the worm has a non-living temporal part, which is odd, or accept the denial of existence during stasis discussed earlier.

  **Response:** This objection highlights a crucial point but does not defeat perdurantism. First, perdurantism is a theory of *persistence*, not necessarily of *life*. It can accommodate entities changing their kind-properties over time. A worm can have temporal parts that are alive (before and after stasis) and temporal parts that are not alive (during stasis), yet remain the same *material object* or *biological entity* persisting. What matters for persistence *as that entity* is the spatiotemporal and causal continuity of its temporal parts. The static arrangement in the Vault *is* causally continuous with the past living stage (it was that stage desiccated) and causally generative of the future living stage (it is that arrangement that gets rehydrated). It plays the right causal role in the worm's history. Second, while the static part isn't metabolically alive, it retains the *dispositional properties* essential to being that kind of organism – the disposition to revive upon rehydration. This disposition is a genuine property of that temporal part, grounded in its structure, connecting it causally to the future. Calling it "just an arrangement" ignores that this specific arrangement, derived from and leading to life, *is* the animal in its dormant state. Perdurantism captures this by including it within the worm's history.

  **What Would Change My Mind?**

  These cases decisively tip the scales *if* we accept the core intuitions that the Vault animal persists and the Copy duplicate does not, and *if* we seek a metaphysical explanation for why the preservation method matters intrinsically. My verdict could change in several ways:

  1.  **If Stasis Truly Implies Non-Existence:** If compelling arguments showed that absolute stasis (no *potential* for change, no dispositions) is metaphysically equivalent to non-existence, then the Vault intuition would be wrong. Perdurantism could still handle this (with a gappy worm), but the advantage over endurantism in handling "existence during nothing" would vanish. Both would need to explain the apparent identity upon revival.
  2.  **If External Machinery is Irrelevant:** If a powerful argument demonstrated that the causal history *external* to the preserved state (stasis vs. record/assembly) is metaphysically irrelevant to identity, provided the intrinsic state is identical, then the Copy intuition would be wrong. The duplicate *would* be the original animal. Perdurantism could accommodate this by claiming the assembly process creates a *direct* causal link sufficient for the duplicate's temporal parts to be part of the original worm (a highly counterintuitive move). Endurantism might handle this slightly better by positing the animal "jumping" to the duplicate matter, but this is also deeply problematic. Such a finding would undermine perdurantism's key advantage in grounding the difference.
  3.  **A Better Endurantist Account of Stasis:** If endurantism could provide a compelling, non-mysterious account of what it means for the *whole* animal to be wholly present at each indistinguishable moment of total stasis – an account that doesn't rely on brute identity or hidden dynamism – it would mitigate its disadvantage. Similarly, if it could explain why the reconstruction method *must* break identity in a way that doesn't reduce to causal history (which perdurantism explains better), it would strengthen its position.

  Absent such developments, the Vault and Copy cases reveal perdurantism as possessing the superior metaphysical resources to explain our deepest intuitions about persistence through time, even – and especially – when time seems to stand still.
