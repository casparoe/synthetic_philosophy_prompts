answer: |-
  Here’s the comprehensive "spec sheet" for an adequate account of pleasure's common core, based on philosophical debates and the challenges you raised:

  **Core Desiderata for an Account of Pleasure:**

  1.  **Unification of Paradigm Cases:** Must encompass:
      *   *Sensory Pleasures:* Back scratch, taste of chocolate, warmth of sun.
      *   *Intellectual/Attitudinal Pleasures:* Solving a proof, "Aha!" moment, understanding a complex idea.
      *   *Aesthetic Pleasures:* Listening to a symphony, viewing a beautiful painting.
      *   *Social/Emotional Pleasures:* Schadenfreude (malicious joy), pride, affection, laughter.
      *   *Relief Pleasures:* Ending of pain or discomfort (itch scratched, painkiller working).
      *   *"Bodily" Pleasures:* Orgasm, heroin rush (intense physical euphoria).
      *   *Calm/Absence-based Pleasures:* Contentment, serenity, peacefulness.
      *   *Consideration:* Excluding any major category raises doubt. A theory *must* explain how these diverse experiences share a core feature.

  2.  **Exclusion of Non-Pleasures:** Must provide a *principled* reason to exclude things that might be confused with pleasure but aren't:
      *   *Mere Absence of Pain:* Not feeling pain isn't inherently pleasurable (e.g., a numb limb).
      *   *Satisfied Desire without Experience:* Getting good news while unconscious.
      *   *Mere Sensory Intensity:* Loud noise isn't pleasurable just because it's loud.
      *   *"False Pleasures":* Cases where pleasure is misattributed due to expectation or context.
      *   *Consideration:* The line must be drawn based on the core feature identified, not arbitrarily. Relief is a key test case: is it the *removal* or the *resulting state* that's pleasurable?

  3.  **Phenomenal Character (The "Feel"):** Must account for the introspectively accessible, positive *felt quality* common to pleasure experiences.
      *   *Consideration:* While pleasures feel different (scratch vs. symphony), they all feel "good" in some recognizable way. Ignoring this entirely (e.g., some pure desire views) is counterintuitive.

  4.  **Motivational/Behavioral Role:** Must explain why pleasure attracts us, motivates pursuit, reinforces behavior, and is generally "to-be-pursued".
      *   *Consideration:* Hedonism relies on pleasure being a motivator. An account separating pleasure entirely from motivation is problematic.

  5.  **Distinction from Pain (Optional but Desirable):** Ideally, the account should provide a clear framework for understanding pain as the opposite or complementary state. However, some argue this is a separate (though related) task.
      *   *Consideration:* A unified theory of valence (positive/negative affect) is elegant, but not strictly *necessary* for defining pleasure alone.

  6.  **Normative Neutrality (Contested):** **Should *not* attempt to build moral goodness *directly* into the definition.**
      *   *Consideration:* Hedonism (the ethical theory) claims pleasure is *the* good. The *definition* of pleasure should be prior to and independent of this value claim to avoid circularity. The account should identify *what pleasure is*, not *why it's good*. Its goodness is a *consequence* for hedonism.

  7.  **Accommodating Mill's "Higher/Lower" Pleasures (Optional, Not Core):** Need *not* intrinsically explain qualitative differences in value/quality Mill identified.
      *   *Consideration:* Mill's distinction is a *normative* claim *about* pleasures based on features like intellectual engagement or dignity. The core definition need only identify the common feature *making* something a pleasure. The qualitative differences can be explained by *what* is pleasurable (intellectual activity vs. sensation), not *that* it is pleasurable.

  8.  **Handling "Conflicted Pleasure" Cases:**
      *   *Guilty Pleasures:* Must allow that the *experience itself* is pleasurable (has the core feature) even if the person has a negative *evaluative judgment* about it or its source.
      *   *Masochism:* Must explain how the *sensation* can be painful (negative valence) while the *overall experience* can be pleasurable (positive valence) due to context, meaning, or relief. Or, account for cases where the sensation itself has a complex valence.
      *   *Consideration:* Denying the phenomenology of pleasure in these cases is implausible. The account must show how the core feature is present despite conflicting attitudes or judgments.

  **Flagged Tensions:**

  *   **Phenomenology vs. Attitude-Free Definition:** Desideratum 3 (Felt Quality) pushes towards felt-quality views. However, Desideratum 8 (Conflicted Pleasures like guilt/masochism) shows that the *felt quality* and the *person's overall attitude/judgment* can diverge. A pure felt-quality view struggles here, while a pure attitude view struggles with Desideratum 3.
  *   **Unification vs. Precision:** Desideratum 1 (Unify Diverse Cases) pushes for a broad, inclusive definition. Desideratum 2 (Exclude Non-Pleasures) pushes for a narrow, precise definition. Finding a feature broad enough for schadenfreude *and* a back scratch, yet narrow enough to exclude mere absence of pain or satisfied unconscious desire, is the core challenge.
  *   **Phenomenology vs. Unconscious Pleasure?** If pleasure requires a specific felt quality (3), can there be unconscious pleasures (e.g., during sleep, deep flow states without explicit awareness)? Some views (attitude/desire) might handle this better than felt-quality views.

  **Scoring Major Approaches Against Desiderata:**

  1.  **Felt-Quality (Hedonic Tone) Views:** (e.g., Sidgwick, traditional introspective views)
      *   **Strengths:** Excels at 3 (Phenomenal Character). Intuitive fit for 1 (Paradigm Sensory Cases). Can handle 6 (Normative Neutrality).
      *   **Weaknesses:** Struggles severely with unifying diverse cases (1 - especially intellectual/aesthetic/relief). Struggles with exclusion (2 - why isn't *any* positive feeling pleasure?). Struggles deeply with conflicted cases (8 - guilt/masochism). Often struggles with motivational role (4) without adding desire. May have issues with unconscious pleasure.

  2.  **Attitude/Desire-Based Views:** (e.g., Feldman, Heathwood - "Desire Satisfaction at Time T"; "Liking")
      *   **Strengths:** Excellent at unification (1 - diverse pleasures are all "desired/liked experiences"). Good at exclusion (2 - unconscious satisfaction isn't pleasure). Handles conflicted cases well (8 - the sensation is desired/liked *as experienced*, even if judged bad). Explains motivation (4). Compatible with 6 (Normative Neutrality).
      *   **Weaknesses:** Struggles most with 3 (Phenomenal Character) - can seem to reduce the "feel" to the attitude, which feels counterintuitive ("Is pleasure *just* wanting it to continue?"). Can struggle with purely passive pleasures (e.g., surprise pleasure where desire/liking arises simultaneously). Needs careful formulation to avoid circularity (desiring because pleasant vs. pleasant because desired?).

  3.  **Naturalistic/Neuroscientific Views:** (e.g., Linking pleasure to specific brain systems like reward pathways, dopamine, opioid systems - Berridge's "Liking" vs. "Wanting")
      *   **Strengths:** High potential for unification (1) based on mechanism. Strong on exclusion (2) if mechanism is specific. Provides a basis for distinction from pain (5). Can inform motivational role (4).
      *   **Weaknesses:** Currently underspecified as a *philosophical* account of the common feature (what *is* the common feature beyond brain state X?). May struggle with normative neutrality (6) if mechanisms imply value. Controversial whether current science identifies *pleasure itself* or just correlates (motivation/reward learning/reinforcement). May struggle with the phenomenal character (3) as experienced. May struggle to fit complex social/intellectual pleasures (1) neatly into the identified mechanisms.

  **Summary of Weighting (Criteria > Scores):**

  The **core adequacy conditions** are **1 (Unification)**, **2 (Exclusion)**, and **3 (Phenomenal Character)**. A theory failing significantly on any of these is inadequate. **4 (Motivation)** is very important for hedonism. **8 (Conflicted Cases)** is a crucial test of the theory's coherence and plausibility.

  **6 (Normative Neutrality)** is essential for a definition prior to hedonism. **5 (Distinction from Pain)** and **7 (Mill's Distinction)** are desirable but not strictly necessary for the core definition. The key tensions revolve around balancing the felt quality we all recognize with the ability to unify wildly different experiences and handle cases where feeling and judgment conflict. Attitude/desire views currently have the edge in unifying the paradigm cases and handling conflicts, but face the strongest pushback regarding capturing the raw "feel" of pleasure.
