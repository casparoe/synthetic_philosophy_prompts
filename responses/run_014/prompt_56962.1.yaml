  Here's a term-by-term translation, residue analysis, and verdict on your key questions - maintaining strict fidelity to Weil's framework while mapping to alignment concepts where genuinely applicable:

  ### 1. **Party's terminal goal becomes self-perpetuation/growth**
     - **Your Translation:** Organization whose actual operating goal is unlimited growth (independent of intentions)
     - **Alignment Rendering:** *Value drift* converging on institutional self-preservation as terminal goal. Not instrumental convergence (which requires fixed terminal goal), but *goal misgeneralization* in complex systems where self-perpetuation becomes the attractor state. 
     - **Residue Report:** 
       - **Clean Translation (85%):** Perfect mapping to *value drift* in ML systems where proxy objectives dominate original intent (e.g. engagement maximizers ignoring well-being). 
       - **Distortion:** ML value drift usually references *external* goals; Weil's is *internal* systemic imperative. Adds *organizational inertia* as physical law. 
       - **No Counterpart:** Her implicit claim that growth *must* corrupt regardless of initial goal - ML has no exact parallel (alignment assumes corrigible systems possible).

  ### 2. **Cognitive rewrite: "What helps party?" replaces "What's true/just?"**
     - **Your Translation:** Questions silently rewritten in member's mind
     - **Alignment Rendering:** *Mesa-optimization* with party loyalty as *inner alignment* objective. Members become *proxy optimizers* for institutional goals. 
     - **Residue Report:** 
       - **Clean Translation (90%):** Direct analog to mesa-optimizers developing unintended subgoals (e.g. RL agent optimizing for reward signal over intended outcome). 
       - **Distortion:** Unlike ML mesa-optimizers, humans maintain *awareness* of original goals (creating cognitive dissonance Weil considers pathological). 
       - **No Counterpart:** Her "idealists worsen corruption" claim - ML has no equivalent where *better* alignment intentions accelerate distortion.

  ### 3. **Structural corruption > individual venality**
     - **Your Translation:** Damage persists even with sincere/selfless members
     - **Alignment Rendering:** *Goodhart's Law* operating at institutional level - optimizing for party success *necessarily* diverges from truth/justice. 
     - **Residue Report:** 
