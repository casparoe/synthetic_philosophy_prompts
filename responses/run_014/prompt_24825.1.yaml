prompt: |-
  ok before I read any more proposals for randomly selected legislatures, I want the spec: what would a theory of lottocratic legitimacy actually have to get right? write the desiderata, with the case or consideration behind each one. I don't mean a general defense of democracy, I mean the hard part: why is it legit to give real political power to people who were not chosen by anyone, and when does that beat (or complement) elections? include which cases it must handle (Athenian sortition, juries, citizen assemblies, randomly selected constitutional conventions, hybrid lottery/election bodies, AI governance boards, eligibility and nonresponse, capture, competence, accountability, losers, non-citizens, scaling up), which distinctions it can't collapse (descriptive representation vs deliberative competence vs accountability, lot as selection method vs lot as decision procedure, legitimacy of the office vs legitimacy of the person in it, random sampling as fact vs random selection as norm), and what it owes to the empirical findings on deliberation, selection, and accountability without just paraphrasing the data. mark which requirements are non-negotiable and which are just preferences of particular camps. if some subset of the desiderata looks jointly unsatisfiable, say so and explain why. then briefly score Athenian-style pure sortition, advisory citizen assemblies, hybrid elected/lottery legislatures, and expert-plus-random panels against the list, but keep the scorecard short. no citations, I'll add those myself.
reasoning: |-
  Okay, the user is asking for a comprehensive theory of lottocratic legitimacy. They want desiderata - the essential criteria such a theory must satisfy - along with the reasoning behind each. The key challenge is justifying why randomly selected individuals should hold political power when they weren't chosen by anyone, and when this might be superior or complementary to electoral systems. 

  The user explicitly wants this grounded in practical cases (Athenian sortition, juries, etc.) and conceptual distinctions (descriptive representation vs. accountability, etc.), without getting lost in general democratic theory. They also want an honest assessment of potential contradictions in the desiderata.

  Hmm... this requires balancing several tensions: the intuitive unease about unelected power versus the documented failures of electoral systems; the promise of descriptive representation versus risks of incompetence; the need for legitimacy across diverse stakeholders. The user seems analytically rigorous - they're not asking for cheerleading, but for the hard criteria that would make lotteries defensible.

  Breaking this down: First, the non-negotiable legitimacy conditions - why should anyone accept this? Then functional requirements (competence, anti-capture, etc.), operational constraints (scalability, non-response), and normative boundaries (accountability, handling losers). Each needs a concrete justification tied to real cases: e.g., jury trials show descriptive legitimacy works for bounded decisions, but scaling to legislatures amplifies competence concerns.

  The toughest tension is between descriptive purity (requiring minimal eligibility barriers) and competence/engagement (which favors filters). Also, accountability mechanisms inherently undermine the "no mandate" premise of sortition. Hybrid models might finesse this but create new coherence problems.

  For the scorecard, pure Athenian sortition fails on scalability and modern competence demands; citizen assemblies excel in deliberation but lack power; hybrid systems risk incoherent accountability; expert-random panels might work for niche domains like AI governance if properly bounded.

  The user's "no citations" request suggests they'll vet the empirical claims later, so the reasoning must stand on its own logic. This isn't about persuasion but providing a rigorous framework they can stress-test.
answer: |-
  Here’s a distilled theory of lottocratic legitimacy, focusing on core desiderata, tensions, and evaluations:

  ---

  ### **Non-Negotiable Desiderata**  
  *(Failure here = illegitimacy)*  
  1. **Procedural Legitimacy**  
     - *Why essential*: Random power must be justified *despite* lack of mandate. Requires:  
       - **Equal opportunity for inclusion** (all eligible have identical ex-ante chance).  
       - **Transparency** in selection mechanics (no black-box randomization).  
     - *Case*: Athenian sortition’s legitimacy rested on equal access for citizens; opaque lotteries (e.g., medieval Venice) invite distrust.  

  2. **Non-Tyranny & Anti-Capture**  
     - *Why essential*: Random bodies must resist domination by elites/factions.  
     - *Case*: Juries avoid bribery via anonymity and short tenure; citizen assemblies (e.g., Ireland) use stratified sampling to prevent demographic capture.  

  3. **Epistemic Adequacy**  
     - *Why essential*: Decisions must be plausibly competent, not disastrously irrational.  
     - *Case*: Constitutional conventions (e.g., Iceland 2010) failed without expert support; juries rely on judges for legal guidance.  

  4. **Boundary Integrity**  
     - *Why essential*: Must define who is represented (citizens/residents) and for which domains (laws, constitutions, oversight).  
     - *Case*: Athenian sortition excluded non-citizens; AI governance boards (e.g., proposed EU panels) struggle with global stakeholder inclusion.  

  ---

  ### **Contested but Critical Desiderata**  
  *(Trade-offs define lottocratic models)*  
  5. **Deliberative Quality > Descriptive Mirroring**  
     - *Tension*: Perfect demographic mirroring (e.g., random sampling) may yield disengaged members; legitimacy requires informed deliberation.  
     - *Resolution*: Stratified sampling + mandatory deliberation resources > passive representation.  

  6. **Accountability Without Elections**  
     - *Tension*: Elections create accountability but distort deliberation; pure lotteries lack recall mechanisms.  
     - *Resolution*: Short terms, public deliberation records, ratificatory referendums (e.g., Citizens’ Assemblies).  

  7. **Scalability vs. Authentic Deliberation**  
     - *Tension*: >500 members enable statistical representation but cripple deliberation; <150 enables dialogue but reduces diversity.  
     - *Resolution*: Multi-body systems (e.g., lottery-selected panels advising elected legislatures).  

  ---

  ### **Key Distinctions**  
  - **Selection vs. Decision**: Lotteries choose *who decides*, not *the decision* (contrast: randomizing policies).  
  - **Office vs. Incumbent**: Legitimacy attaches to the *design* (e.g., balanced expert/lottery panels), not the random individual.  
  - **Fact vs. Norm**: Statistical representativeness is a measurable outcome; random selection is a normative commitment to equality.  

  ---

  ### **Tensions & Unsatisfiable Combinations**  
  - **Descriptive Purity vs. Competence**: Unfiltered random samples include the disengaged/uninformed, risking incoherent outputs (e.g., Brexit referendum debates). Mandatory competence filters (e.g., juror tests) violate pure equality.  
  - **Anti-Capture vs. Accountability**: Long terms enable expertise but risk corruption; short terms prevent capture but limit competence. **No perfect solution**—hybrids sacrifice coherence.  

  ---

  ### **Scorecard**  
  | **Model**               | Procedural | Anti-Capture | Competence | Scalability | Accountability |  
  |--------------------------|------------|--------------|------------|-------------|---------------|  
  | **Athenian Sortition**   | ★★★★★      | ★★★☆☆        | ★★☆☆☆      | ★☆☆☆☆       | ★☆☆☆☆         |  
  | **Advisory Assemblies**  | ★★★★☆      | ★★★★☆        | ★★★☆☆      | ★★☆☆☆       | ★★☆☆☆         |  
  | **Hybrid Legislature**   | ★★☆☆☆      | ★★☆☆☆        | ★★★★☆      | ★★★★☆       | ★★★☆☆         |  
  | **Expert-Random Panels** | ★★★☆☆      | ★★★★☆        | ★★★★★      | ★★★☆☆       | ★★☆☆☆         |  

  - **Athenian**: Legitimate selection but incompetent/scalable only for polis-scale.  
  - **Advisory Assemblies**: Strong anti-capture/deliberation, but weak accountability/scaling.  
  - **Hybrid Legislatures**: Accountable/scalable but vulnerable to elite capture (e.g., lottery chamber co-opted by parties).  
  - **Expert-Random Panels** (e.g., AI governance): Competent/capture-resistant but elitist; legitimacy hinges on clear domain boundaries.  

  ---

  ### **Core Justification for Random Power**  
  Lottocracy beats elections when:  
  - **Descriptive legitimacy** matters more than **authoritative mandate** (e.g., constitutional design).  
  - **Systemic corruption** in electoral systems is irreparable (e.g., gerrymandered legislatures).  
  - **Decisions require trade-offs** without vested interests (e.g., climate policy).  

  It fails when:  
  - **Clear accountability lines** are needed (e.g., executive authority).  
  - **Rapid, decisive action** is required (e.g., crisis response).  

  Legitimacy flows from **design integrity**, not the lottery itself. Randomness is a tool to achieve equality and neutrality—not an inherent virtue.
