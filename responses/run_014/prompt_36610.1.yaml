  But the convergence argument would say LWRs won because they were fundamentally more practical. Water is a better moderator and coolant—it's abundant, handles high power density, and is easier to manage than alternatives like liquid sodium. Safety features like negative temperature coefficients are inherent to water, making reactors self-stabilizing. Even if gas-cooled reactors had been adopted initially, their technical limitations (like lower power density and graphite fire risks) would have pushed a shift to water-based designs eventually. 

  Deciding factors: Were there viable alternatives? Gas-cooled reactors had issues with power density and safety. Heavy-water reactors were efficient but required expensive deuterium. Molten salt had corrosion problems. So, alternatives weren't truly equivalent. Also, the advantages of water were clear early on—not just retroactive justification. Switching costs were political/economic, not technical; other countries developed alternatives but still converged to LWRs later. 

  Strongest counterargument: The U.S. might have influenced global standards through regulatory exports and financing, forcing LWR adoption even where alternatives were feasible. If the Navy had chosen gas-cooled, maybe that design would've benefited from similar support, masking its flaws through investment. 

  Hmm, does this hold up? Countries like France and USSR initially pursued different designs but shifted to LWRs later. That suggests convergence. But the U.S. dominance in nuclear tech post-WWII can't be ignored. Still, the technical merits of water seem decisive. 

