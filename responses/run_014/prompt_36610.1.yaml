answer: |-
  **Example: The dominance of light-water reactors (LWRs) in civilian nuclear power.**

  **Lock-in Reading:**  
  The adoption of LWRs as the global standard stemmed from path dependence initiated by the U.S. Navy’s selection of pressurized water reactors (PWRs) for nuclear submarines in the 1950s. Early advantages included Admiral Rickover’s influence, rapid development timelines, and existing industrial familiarity with water-based systems. This created *network effects* (shared regulatory frameworks, vendor expertise, supply chains) and *switching costs* (retraining personnel, redesigning safety protocols, rebuilding infrastructure). Alternative designs like gas-cooled reactors (UK’s Magnox/AGR), heavy-water reactors (Canada’s CANDU), or sodium-cooled fast breeders were sidelined despite technical merits, locking in LWRs due to institutional momentum and sunk investments.

  **Convergence Reading:**  
  LWRs dominated not because of historical accident but because water’s physical properties made it the optimal moderator/coolant for practical, scalable fission reactors. Water is abundant, non-toxic, has excellent heat capacity, and enables inherent safety mechanisms (e.g., negative temperature coefficient of reactivity). Crucially, *no alternative coolant* matched this combination. Gas-cooled reactors faced lower power density and graphite fire risks (Chernobyl validated this). Heavy-water reactors required expensive deuterium enrichment. Liquid metal coolants posed fire/toxicity hazards (e.g., sodium leaks). Even absent the Navy’s choice, global deployment would have converged on water-based designs by the 1970s as engineers prioritized safety, cost, and simplicity—advantages evident *before* lock-in.

  **Deciding Features:**  
  1. **Viability of Alternatives:** Competitors had *fatal flaws*, not minor trade-offs. Gas-cooled reactors couldn’t achieve high power density without compromising safety; fast breeders were complex and expensive. Only LWRs balanced efficiency, safety, and scalability.  
  2. **Advantages Visible in Advance:** Water’s superiority was understood by 1960. Oak Ridge scientists noted its neutronics and thermal properties were unmatched—this wasn’t retroactive justification.  
  3. **Recoverability of Switching Costs:** Nations *did* switch paths: France abandoned gas-graphite for LWRs post-1970, the USSR shifted from AMB-100 RBMKs to VVER PWRs after Chernobyl. These transitions occurred despite high costs because LWRs’ intrinsic benefits outweighed legacy investments.

  **Strongest Counterargument:**  
  The U.S. exported LWR-centric regulations (via the IAEA) and financing (e.g., Atoms for Peace), coercing allies into adopting LWRs. If the UK’s gas-cooled program had received equivalent state support and shaped global standards, its flaws might have been mitigated through iteration (e.g., better CO₂ containment), allowing it to persist as a viable alternative—suggesting U.S. hegemony, not technical superiority, was decisive.
