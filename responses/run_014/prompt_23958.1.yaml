  I recall that in effective altruism circles, there's debate between maximizing expected value versus diversification. People like Holden Karnofsky have discussed robust portfolio approaches. The consensus might be that while expected value is crucial, uncertainty justifies some diversification. But I shouldn't present either side as settled. Need to clearly state where there's agreement (e.g., expected value as starting point) and where it's contested (how much to diversify).

