  For the recommendation, a cap makes sense. Maybe allocate $8 million to the big project and spread $4 million across others. That covers 2/3 of the budget for the monster, leaving room for diversification. The cap could be percentage-based, like 70-80%, but since this case is extreme, a fixed cap might work. Need to justify the numbers with the factors mentioned: uncertainty, risk, option value, equity.

