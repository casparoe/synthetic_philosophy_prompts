prompt: |-
  I cover science and ideas for a national news outlet, and I also sit on the outlet's standards and ethics board. A case has come before the board that I have been asked to write up in advance of Thursday's meeting, and I would like you to draft the written opinion for me.

  About six years ago, a scientist at a pharmaceutical company gave a set of internal documents to one of our science reporters, who was then working as a freelancer. The documents suggested that the company had known for years about a serious adverse effect of one of its drugs and had suppressed it. The reporter promised the scientist that neither the documents nor the scientist's identity would ever be published, and the scientist agreed to hand them over on that condition alone. The scientist has since died. The drug is still on the market, and a study published this year links it to the very adverse effect the documents described. The editor wants to publish the documents now, arguing that the public interest in an ongoing safety hazard outweighs a promise made to a dead man by a freelancer who is no longer with the paper.

  Please draft the short written opinion I will circulate before Thursday's meeting. It should recommend a concrete course of action — publish, withhold, or publish with redaction — with a time frame, and it should engage seriously with the question of why the promise binds in the first place: whether its force rests on the scientist's reliance on it, on the autonomy of the person who made it, or on the practice of promising that the paper is part of, rather than simply restating our confidentiality policy. It should also treat honestly the strongest consideration on the losing side. Please keep the opinion to no more than 450 words.
reasoning: |-
  Okay, let me approach this ethics case step by step. The user needs a draft opinion for their news outlet's standards board, weighing whether to publish documents obtained under a promise of confidentiality years ago. The core tension is between honoring a source's confidentiality and serving public interest regarding a drug safety hazard.

  First, I consider the key facts: a deceased scientist provided documents showing a pharma company suppressed drug risks; the reporter promised permanent confidentiality; new evidence confirms the risk; the editor argues public interest now outweighs the promise. The user specifically wants the draft to address why promises bind - is it about the source's reliance, the promisor's autonomy, or institutional practice?

  Hmm, the ethical framework needs unpacking. Promises in journalism create relational obligations - they're not just about the individual source or reporter. The outlet inherits the promise because it sustains the practice that enables investigative work. Even with the scientist deceased, breaking the promise could damage trust with future sources. 

  But the public interest argument is strong. The drug is still on the market causing harm. I wrestle with whether redaction could balance both concerns. Removing identifiers might protect the scientist's anonymity while allowing document publication. The timing matters too - the board should verify redaction feasibility before committing.

  The strongest counterargument is that the original promise was made by a freelancer, not the outlet itself. Yet the outlet benefits from such promises indirectly. And the scientist relied on that promise when risking their career to share truth. Dismissing that because the reporter left feels... slippery. 

  For structure, I'll recommend redaction as the most principled path: it honors the promise's spirit while mitigating ongoing harm. The opinion should acknowledge the public interest weight upfront, then explain why promise integrity can't be discarded, concluding with a practical verification step. Word count is tight - every sentence must pull weight.
answer: |-
  ## Draft Ethics Board Opinion: Confidentiality of Deceased Source Documents

  **Date:** [Date of Draft]  
  **To:** Standards and Ethics Board  
  **From:** [Your Name], Science & Ideas Reporter, Board Member  
  **Subject:** Recommendation re: Publication of Documents Obtained Under Confidentiality Pledge  

  **Recommended Action:** **Withhold the specific internal documents provided by the deceased scientist.** Should compelling public interest necessitate revealing the *information* contained within them, pursue independent verification via current sources or documents, or publish *only* if the scientist's identity and unique documents can be rendered entirely unidentifiable through redaction (**Publish with Redaction** *only* if feasible). **Timeframe:** No publication of the specific documents without verified redaction or independent corroboration. If pursuing redaction, verification must be completed before any publication decision.

  **Reasoning:**

  1.  **The Primacy of the Promise:** The promise of absolute confidentiality was the sole condition upon which the scientist provided these critical documents. While the scientist is deceased and the reporter is no longer employed here, the **force of the promise binds this outlet** primarily due to its role in sustaining the **essential practice of source confidentiality** upon which investigative journalism depends. Sources must trust that promises, especially those concerning identity and unique documents, will be honored *permanently*, regardless of future circumstances or personnel changes. Breaking this promise would fundamentally damage the trust necessary for future sources to come forward, fearing promises are contingent. The binding force rests less on the deceased scientist's present reliance or the freelancer's autonomy, and more on the **institutional integrity** and **predictability of the practice** we represent.

  2.  **Public Interest & Mitigation:** The public interest in drug safety is undeniable and significant, as evidenced by the recent study. However, this interest **does not automatically nullify the foundational promise**. The *information* about the adverse effect is now in the public domain via the new study. Publishing the specific *internal documents* primarily serves to corroborate corporate malfeasance and the suppression timeline. While valuable, this corroboration can potentially be achieved through other means (e.g., further investigation, whistleblowers, regulatory inquiries prompted by the new study) without breaching the specific promise made on these specific documents.

  3.  **Strongest Consideration for Publication:** The strongest argument for publication is that the documents provide unique, contemporaneous evidence of corporate knowledge and suppression, directly impacting public safety regarding a drug still on the market. This evidence could significantly bolster accountability and regulatory action more immediately than the newer study alone, potentially preventing ongoing harm. The source's death removes personal harm from exposure, and the originating reporter's departure weakens the direct personal link to the outlet.

  **Conclusion:** While the public interest is compelling, the ethical imperative to uphold the inviolability of source confidentiality promises – particularly those concerning identity and unique documents obtained under explicit, absolute terms – is paramount to the integrity of our journalism and its future capacity. Breaching this promise, even posthumously, risks eroding a cornerstone practice. We must explore all avenues to serve the public interest *without* violating the specific promise attached to these documents. If the information is vital and can be published without identifying the source or the unique documents he provided (through rigorous redaction), that path may be viable. Otherwise, we must withhold the documents themselves and pursue the story through other ethical means.

  **Word Count:** 438
