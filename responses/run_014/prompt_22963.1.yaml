  Hmm, the exclusion argument does feel like a formal logic puzzle: premises plugged in to force epiphenomenalism. Whereas redundancy seems more like an intuition pump about metaphysical wastefulness. The user's onto something - closure functions differently in each. For exclusion it's the fence keeping mental causes out; for redundancy it's the guarantee making mental causes pointless.

