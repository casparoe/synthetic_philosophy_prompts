prompt: |-
  I'm a software engineer building decision-support tools, and I keep running into the concept of bounded rationality — in papers on human decision-making, in AI design, and in arguments about why satisficing beats optimizing. But the term seems to cover a lot of ground, and before I lean on it in my own work I want to know what a theory of bounded rationality actually has to deliver to count as adequate. Write the desiderata: what phenomena must it explain, what cases must it get right, what distinctions must it respect, and what results from psychology or computer science must it be consistent with? For each requirement, give the consideration or motivating case behind it, and flag which are non-negotiable and which are merely preferences of one research program. I am especially interested in whether any subset of these desiderata is jointly unsatisfiable — for instance, is there a tension between descriptive accuracy about human behavior and normative usefulness for designing better systems? If you can, briefly score the main approaches (Simon's satisficing, heuristics-and-biases, ecological rationality, rational inattention, and so on) against the list, but the requirements themselves are what I am after.
reasoning: |-
  Okay, the user is a software engineer building decision-support tools who's encountering the concept of bounded rationality across different fields. They want to understand what makes a theory of bounded rationality adequate—essentially, the key requirements such a theory must meet. They're asking for desiderata: what phenomena it must explain, cases it must get right, distinctions it should respect, and consistency with psychology or computer science findings. They also want to know if there are tensions between these requirements, especially between descriptive accuracy and normative usefulness, and how existing approaches score against these criteria.

  First, I need to recall what bounded rationality entails. Herbert Simon introduced it as an alternative to perfect rationality, emphasizing cognitive limits and satisficing. But the term has evolved, with different schools like heuristics-and-biases, ecological rationality, rational inattention, etc. The user is looking for a structured breakdown of the essential elements a theory must cover.

  The user's explicit request is for desiderata. They want a list of must-haves and nice-to-haves, with each item explained by a motivating case or consideration. They also want to know which are non-negotiable versus preferences of specific research programs. Additionally, they're interested in tensions between desiderata, especially between descriptive and normative aspects. Finally, they want a brief scoring of existing approaches against these desiderata.

  Breaking down the desiderata, I should cover several areas. First, explaining cognitive limitations is fundamental—humans have limited attention, memory, processing power. A theory must account for why people can't optimize in complex situations. Second, it needs to explain satisficing behavior, where people settle for "good enough" options. Third, it should address heuristics and biases, showing why shortcuts lead to systematic errors in some contexts but are effective in others. Fourth, ecological rationality is key—how heuristics succeed in specific environments. Fifth, adaptation and learning: how people adjust strategies based on feedback. Sixth, computational tractability, especially for AI applications. Seventh, integrating the role of environment and task structure. Eighth, explaining resource allocation, like rational inattention where attention is a scarce resource. Ninth, distinguishing between competence (knowledge) and performance (execution). Tenth, consistency with empirical findings like framing effects or loss aversion. Eleventh, providing prescriptive guidance for improving decisions. Twelfth, addressing neurodiversity and individual differences. Thirteenth, respecting the distinction between descriptive (how people decide) and normative (how they should) aspects.

  Now, tensions: The biggest one is between descriptive accuracy and normative usefulness. A theory strong in describing human behavior might not offer clear improvements, while a prescriptive theory might not align with actual behavior. For example, heuristics-and-biases highlights errors but may overemphasize irrationality, whereas ecological rationality shows heuristics can be effective but might downplay systematic errors. Another tension is between computational tractability and fidelity to human cognition—AI models need efficiency, but human-like models might be computationally heavy.

  Scoring the approaches: Simon's satisficing is strong on cognitive limits and satisficing but weak on explaining biases. Heuristics-and-biases excels in documenting biases but less on ecological fit. Ecological rationality is great for environment-heuristic match but may overlook maladaptive heuristics. Rational inattention is strong on resource allocation but abstract. Computational models are good for tractability but may simplify too much.

  I should also note non-negotiables: Explaining cognitive limits, satisficing, heuristics, ecological fit, and empirical consistency are core. Desiderata like prescriptive guidance or computational tractability might vary based on the theory's purpose. The user's context as a software engineer means they might prioritize prescriptive aspects for tool design, so highlighting tensions here is crucial. They need a theory that both understands human limits and offers actionable improvements, which is challenging but essential for effective decision-support tools.
answer: |-
  Below is a structured breakdown of the **desiderata for an adequate theory of bounded rationality**, categorized by phenomena to explain, critical cases, key distinctions, and consistency requirements. I'll flag non-negotiables vs. preferences, highlight tensions, and briefly score major approaches. The core tension revolves around **descriptive fidelity vs. prescriptive power**, but other conflicts exist.

  ---

  ### **Core Desiderata for a Theory of Bounded Rationality**

  #### **1. Explain Cognitive Limitations**  
     - **Phenomena**: Humans (and systems) fail at optimization under complexity, time pressure, or uncertainty.  
     - **Motivating Case**: Chess players can’t evaluate all moves; medical diagnoses under time constraints.  
     - **Non-negotiable**: Any theory *must* acknowledge processing limits (attention, memory, computation).  
     - **Key Distinction**: Bounded vs. unbounded rationality.  

  #### **2. Account for Satisficing**  
     - **Phenomena**: Agents stop searching for alternatives once a "good enough" option is found.  
     - **Motivating Case**: Choosing a restaurant by picking the first one with minimal queues, not the "best" possible.  
     - **Non-negotiable**: Must explain why optimization is often abandoned.  

  #### **3. Predict Heuristics & Biases**  
     - **Phenomena**: Systematic deviations from normative models (e.g., anchoring, availability bias).  
     - **Motivating Case**: Judges sentencing differently based on arbitrary numbers (anchoring experiments).  
     - **Non-negotiable**: Must explain *when* and *why* heuristics lead to errors.  
     - **Consistency Requirement**: Align with Kahneman-Tversky’s prospect theory and framing effects.  

  #### **4. Explain Ecological Rationality**  
     - **Phenomena**: Heuristics succeed in specific environments but fail in others.  
     - **Motivating Case**: "Take the Best" heuristic (using one cue) outperforms regression in sparse data environments.  
     - **Non-negotiable**: Must explain *context-dependence* of decision quality.  
     - **Distinction**: Heuristic effectiveness ≠ universal rationality.  

  #### **5. Handle Adaptation and Learning**  
     - **Phenomena**: Agents adjust strategies based on feedback (e.g., switching heuristics after failures).  
     - **Motivating Case**: Traders shifting from momentum to value investing in volatile markets.  
     - **Preference**: Learning mechanisms are emphasized in computational/evolutionary approaches.  

  #### **6. Computational Tractability**  
     - **Phenomena**: Algorithms must run in realistic time with finite resources.  
     - **Motivating Case**: Real-time routing for delivery drones; high-frequency trading.  
     - **Non-negotiable for AI/CS**: Models must be implementable (e.g., polynomial-time approximations).  

  #### **7. Integrate Environment Structure**  
     - **Phenomena**: Performance depends on task-environment fit (e.g., uncertainty, redundancy).  
     - **Motivating Case**: Recognition heuristic works in cities with unequal name recognition.  
     - **Non-negotiable**: Must explain why the same heuristic succeeds/fails across environments.  

  #### **8. Account for Resource Allocation**  
     - **Phenomena**: Attention/computation is scarce; agents "rationally" ignore information.  
     - **Motivating Case**: "Rational Inattention" in economics: Consumers ignore minor price changes.  
     - **Preference**: Central to information-theoretic approaches (e.g., Sims’ work).  

  #### **9. Distinguish Competence vs. Performance**  
     - **Phenomena**: Humans *know* normative rules but fail to apply them under constraints.  
     - **Motivating Case**: Base-rate neglect despite understanding probability.  
     - **Non-negotiable**: Must respect that errors stem from constraints, not ignorance.  

  #### **10. Consistency with Empirical Psychology**  
     - **Must Explain**: Framing effects, loss aversion, time inconsistency.  
     - **Non-negotiable**: Prospect theory phenomena (e.g., risk-seeking in losses).  

  #### **11. Prescriptive Usefulness**  
     - **Phenomena**: Designing tools that improve decisions (e.g., debiasing algorithms).  
     - **Motivating Case**: Clinical decision-support systems reducing diagnostic errors.  
     - **Preference**: Vital for applied work but secondary for descriptive theories.  

  #### **12. Accommodate Individual/Cultural Differences**  
     - **Phenomena**: Experts use different heuristics than novices; cultural variation in risk perception.  
     - **Preference**: Often underexamined in universalist models.  

  ---

  ### **Key Tensions Between Desiderata**  
  1. **Descriptive Accuracy vs. Prescriptive Usefulness**  
     - Tension: Heuristics-and-biases highlights human *errors* (descriptive) but may imply "humans are irrational," offering limited prescriptive fixes. Ecological rationality emphasizes *successes* but may underplay avoidable errors.  
     - Resolution: A dual-process theory (e.g., recognizing when heuristics work vs. when deliberation helps) bridges this.  

  2. **Cognitive Plausibility vs. Computational Tractability**  
     - Tension: Biologically accurate models (e.g., neural networks) may be too slow for real-time AI. Simple satisficing models may lack predictive nuance.  
     - Resolution: Approximations (e.g., fast-and-frugal trees) sacrifice fidelity for speed.  

  3. **Optimal Resource Allocation vs. Satisficing**  
     - Tension: Rational inattention *optimizes* attention allocation, while satisficing *abandons* optimization.  
     - Resolution: Satisficing as optimal under search costs (Simon’s view).  

  ---

  ### **Scoring Major Approaches**  
  | **Approach**              | **Strengths**                                  | **Weaknesses**                                  |  
  |---------------------------|-----------------------------------------------|-----------------------------------------------|  
  | **Simon’s Satisficing**   | Non-negotiable 1, 2, 6, 9                     | Weak on 3 (biases), 4 (ecological fit)         |  
  | **Heuristics-and-Biases** | Non-negotiable 3, 9, 10                       | Weak on 4, 7 (underemphasizes environment), 11 |  
  | **Ecological Rationality**| Non-negotiable 4, 7; Strong on 12             | Weak on 3 (downplays biases), 8 (resource allocation) |  
  | **Rational Inattention**  | Non-negotiable 6, 8; Strong prescriptive use  | Weak on 2, 3 (descriptive gaps), 9             |  
  | **Computational Bounds**  | Non-negotiable 6; Strong on 11 (AI/CS tools)  | Weak on 1, 9 (oversimplifies cognition)        |  
  | **Dual-Process Theories** | Balances 3, 4, 9, 11                          | Vague on computational details (6)             |  

  ---

  ### **Conclusion**  
  An adequate theory **must** explain satisficing, cognitive limits, heuristics/biases, ecological fit, and key psychological results (desiderata 1–4, 9–10). Tensions arise when prioritizing descriptive realism (e.g., heuristics-and-biases) vs. prescriptive efficiency (e.g., rational inattention). For *decision-support tools*, aim for:  
  - **Descriptive foundation**: How users *actually* decide (heuristics, biases).  
  - **Prescriptive layer**: When to nudge toward deliberation (e.g., for high-stakes, novel environments).  
  - **Ecological alignment**: Design for the task’s information structure (e.g., exploit redundancy).  

  **Best bets for engineering**: Hybrid models (e.g., ecological rationality + computational satisficing) that respect constraints while leveraging environment structure. Avoid theories ignoring either cognitive limits or environmental feedback.
