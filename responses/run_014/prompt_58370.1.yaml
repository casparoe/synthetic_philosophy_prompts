answer: |-
  Your scenario perfectly captures the intuitive resistance, but notice it confuses *epistemic relevance* with *practical utility*. While examining your indoor items *is* selective sampling disconnected from ravens, confirmation theory addresses rational belief revision under the logical structure alone. Observing a white trainer *is* a positive instance of "all non-black things are non-ravens," which is logically equivalent to "all ravens are black." Background knowledge rightly tells us ravens are scarce relative to non-black non-ravens, so each white trainer increases confidence by an infinitesimal degree—technically non-zero, but pragmatically negligible. The disconnect you feel reflects sampling inefficiency, not a failure of confirmation: logically, *any* instance of the equivalent generalization bears, however weakly.
