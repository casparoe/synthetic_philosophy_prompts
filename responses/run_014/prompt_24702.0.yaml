prompt: |-
  I just finished a long argument with a friend about whether pain asymbolia — a condition in which a patient, after certain brain damage, reports the sensory-discriminative aspects of a painful stimulus (location, intensity, quality) but does not experience it as unpleasant or aversive and shows no typical emotional or motivational response to pain — settles the debate over what makes pain bad, and if so, which side it settles it for. On one side is the view that pain's badness lies in its affective or functional role — the aversiveness, the "something is wrong" feeling, and the drive to avoid — which is a component distinct from the sensory-discriminative aspect, so that an asymbolic patient, who retains the sensation but loses the affect, is genuinely not suffering. On the other side is the view that pain's badness lies in its phenomenal character — the raw felt quality itself — and that the unpleasantness is not a separable affective component but is constitutive of that character, so that the asymbolic patient's experience is either not really pain at all or lacks the full phenomenal quality that constitutes the badness. Write the joint statement that a committed advocate of each view could both sign after a good-faith adversarial collaboration: the claims they agree on, including about what the asymbolia case does and does not show; the precise formulations of their disagreement, each phrased so its own side would accept the wording; the cruxes — I suspect one is whether the unpleasantness of pain is a distinct affective component or is constitutive of the phenomenal character, and another is whether the asymbolic patient's experience is really pain in the first place; and, for each crux, the case or argument both would accept as bearing on it, with each side's prediction written down. Format it as a numbered agreed-claims section followed by a disagreements table.
reasoning: |-
  We are constructing a joint statement that reflects a good-faith adversarial collaboration between two advocates: one holding the "affective component" view (View A) and the other holding the "phenomenal character" view (View P). The goal is to outline agreed-upon claims and then clearly state the disagreements, including the cruxes and predictions.

  Agreed Claims:

  1. Pain asymbolia is a real condition resulting from specific brain damage (e.g., lesions to the insular cortex or related areas). Patients in this condition can accurately report sensory features of a noxious stimulus (e.g., location, intensity, quality) but do not report it as unpleasant, do not exhibit typical emotional responses (e.g., distress, fear), and do not engage in motivated avoidance behaviors.

  2. The condition of pain asymbolia provides a crucial test case for theories of pain and its badness. It forces us to distinguish between the sensory-discriminative aspects of pain and the affective-motivational aspects.

  3. Both views agree that the condition shows that the sensory-discriminative component of a typical pain experience can be dissociated from the affective-motivational component. In pain asymbolia, the sensory-discriminative component is preserved while the affective-motivational component is impaired.

  4. Both views acknowledge that the asymbolic patient does not exhibit the typical behavioral and emotional responses to noxious stimuli that are characteristic of pain. The patient does not find the experience aversive and does not try to avoid it.

  5. Both views agree that the badness of pain (i.e., what makes pain undesirable and something to avoid) is a central feature of typical pain experiences.

  6. Both views agree that the asymbolic patient does not suffer in response to the noxious stimulus. The patient does not experience the stimulus as bad or unpleasant in the way that a typical person would.

  7. The condition of pain asymbolia does not, by itself, settle the debate about the nature of pain's badness because the interpretation of the case depends on prior theoretical commitments about the nature of pain and its badness.

  8. Both views agree that the debate hinges on two key questions (cruxes):
     a. Is the unpleasantness of pain a distinct affective component or is it constitutive of the phenomenal character of pain?
     b. Is the experience of the asymbolic patient properly described as pain?

  Disagreements:

  We now turn to the table of disagreements. Each row represents a point of disagreement. For each, we state the issue, then the position of View A (affective component view) and the position of View P (phenomenal character view). We then state the crux (the underlying point of contention) and then the case or argument that both sides accept as bearing on the crux, along with each side's prediction about what that case or argument would show.

