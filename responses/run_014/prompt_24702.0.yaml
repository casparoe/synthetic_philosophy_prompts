  | **2. The badness of pain** | The badness of pain is due to the affective component (unpleasantness) which is a distinct dimension of the pain experience and can be dissociated from the sensory component. Therefore, the asymbolic patient's experience is not bad because it lacks this affective component. | The badness of pain is inherent in the phenomenal character of the pain experience itself; it is not a separable component. Therefore, the asymbolic patient does not have a bad experience because they are not having a pain experience at all. | Whether the unpleasantness is a distinct affective component or is constitutive of the phenomenal character of pain. | Consider an experiment where we can independently manipulate the sensory and affective components (e.g., through brain stimulation or pharmacology). For example, can we create an experience with the sensory qualities of pain but without unpleasantness? | View A predicts: Yes, such an experience is possible (as in asymbolia) and would not be bad. | View P predicts: No, because if the unpleasantness is removed, the experience is no longer pain and hence not bad in the way pain is. Alternatively, if we try to remove the unpleasantness, we alter the phenomenal character so that it is no longer pain. |
