prompt: |-
  I teach a 200-level epistemology course, about 18 students, one 75-minute session, and we're about to hit the Meno problem: Socrates' observation that a true belief will serve you just as well as knowledge as long as it sticks around, so why does anyone bother converting one into the other? I want an in-class game where they feel the answer instead of being told it, and I have a specific mechanism in mind which may or may not work — that's partly what I'm asking you to judge.

  The mechanic I have in mind: value that lives in the pattern, not in the token. A single lucky true belief and a single known-up belief are worth exactly the same in the moment; the difference only shows up when conditions shift. So the game should let students cash out the same belief twice — once under the original conditions, and again after something small changes — so the lucky ones watch their belief turn to ash while the others' still works. I'm imagining something like a navigation/route task but I'm open to anything with that double-cash-out structure.

  Constraints: no real money (I keep a points ledger on the board instead), rules simple enough to explain in under five minutes, and no lecture up front — they shouldn't hear the words "reliability" or "safety" until the debrief at the earliest, and the names "Meno" and "swamping problem" not until afterwards. The debrief should map specific moments in the game onto parts of the issue: which round was the true-belief round, which was the knowledge round, where the extra value actually came from, and whether it came from the belief itself or from the way it was formed.

  Two things I want you to be careful about. First, I've been told the standard "reliable method is more valuable" move has a known objection — roughly: if what you care about is the truth of this belief, the reliable method adds nothing to the value of this instance, only to other instances you'll never get to live. If that objection applies to my game, say so plainly — don't build me a game whose debrief quietly assumes the contested answer. Second, in the debrief notes, please clearly seperate what's basically settled among epistemologists from what's genuinely contested — e.g. whether knowledge even is reliably-produced true belief, and whether that framing answers Socrates or just changes the subject — and don't present a contested line as the consensus. If some part of the game only makes sense if you take sides on a contested question, flag that part.

  Also tell me what will predictably go wrong the first time I run this, and be honest about which feature of the actual philosophical issue a classroom game just cannot reproduce. My own guess: a game can show knowledge being more useful, but Socrates' question is partly about value beyond usefulness, and I don't see how a points ledger gets at that. But you tell me.
reasoning: |-
  We are designing an in-class game to illustrate the Meno problem. The goal is for students to experience the difference between true belief and knowledge through a mechanism where a belief is "cashed out" twice: once under original conditions and once after a small change. The key is that the knowledge-based belief should still work after the change, while the lucky true belief fails.

  Constraints:
  - No real money; use points.
  - Rules simple enough to explain in under 5 minutes.
  - No lecture up front; avoid terms like "reliability", "safety", "Meno", "swamping problem" until debrief.
  - Debrief should map game moments to the philosophical issue.

  Important considerations:
  1. Avoid assuming the contested answer in the debrief. The standard objection: the reliable method adds value only to other instances, not to this particular instance. We must not build the game in a way that the debrief ignores this objection.
  2. In the debrief, clearly separate settled points from contested ones.

  Game Idea: Navigation/Map Task

  **Game Title:** "The Treasure Map Challenge"

  **Overview:** Students are explorers looking for treasure on an island. They have to choose a route based on a map. There are two types of maps: one that is reliably produced (knowledge) and one that is lucky (true belief). The twist: after the first round, there is a minor change to the island (e.g., a bridge collapses, a path is blocked), and they must use the same map again to find a different treasure.

  **Setup:**
  - The class is divided into two groups: Group A (knowledge) and Group B (true belief). Do not tell them the group names until debrief. Call them "Team Red" and "Team Blue" for now.
  - Each group gets a map. The maps look identical at first glance but have different origins:
    - Group A's map is created by a careful cartographer who has surveyed the island and uses a reliable method (e.g., consistent symbols, accurate scale). 
    - Group B's map is created by a lucky guesser who drew a map that happens to be correct for the initial setup but is not based on a reliable method (e.g., arbitrary symbols, no consistent method).

  **Round 1:**
  - The island is represented by a grid (e.g., 5x5) drawn on the board. Each cell may contain a treasure (points) or nothing. The starting point is fixed.
  - Both groups are given the same starting point and the same goal: find the treasure at location (3,4) (for example). 
  - Each group must choose a route (sequence of moves: up, down, left, right) from the start to the goal. They have 5 minutes to plan their route using their map.
  - The map for Group A (knowledge) has symbols that reliably indicate the terrain (e.g., a bridge symbol meaning you can cross, a mountain meaning blockage). The map for Group B (true belief) has the same symbols, but they are arbitrarily assigned and happen to be correct for the initial island.
  - Both groups, using their maps, will plan a route. Since the island is set up exactly as the maps show, both groups will find the treasure and get the points (say, 10 points) for Round 1.

  **Change Event:**
  - The instructor announces that a minor change has occurred on the island (e.g., the bridge at (2,3) is now collapsed, so that cell is now blocked). This change is drawn on the board.

  **Round 2:**
  - Both groups are now given a new goal: find a treasure at a different location (say, (4,2)). They must use the same map and the same starting point (or a new starting point if desired, but the map is the same). They have 5 minutes to plan a new route.
  - Now, Group A's map, being based on a reliable method, still has accurate information about the rest of the island (except the changed part). They can adjust their route to avoid the broken bridge and find the new treasure.
  - Group B's map, being arbitrary and not based on a reliable method, does not accurately reflect the island anymore. They might try to use the same symbols, but since the symbols were arbitrarily assigned, they have no reason to trust them in the new context. They are likely to choose a route that fails (e.g., they might try to cross a bridge that is now collapsed, or avoid a mountain that isn't there) and thus do not find the treasure.

  **Scoring:**
  - Round 1: Both groups get 10 points for finding the first treasure.
  - Round 2: Only Group A (knowledge) gets 10 points for the second treasure. Group B (true belief) gets 0.

  **Debrief:**
  - Reveal that Group A had a map created by a reliable method (knowledge) and Group B had a map that was lucky (true belief).
  - Round 1: Both groups had true beliefs about the island (they found the treasure). The true belief was just as good as the knowledge in the first round.
  - Round 2: After the change, the true belief (Group B) failed because it wasn't formed by a reliable method. The knowledge (Group A) was formed by a reliable method, so even though there was a change, they could still rely on the map for the parts that didn't change and adjust accordingly.
  - The extra value of knowledge came from its ability to hold up under changes (or in new situations) because of how it was formed.

  **Addressing the Objection:**
  - The standard objection: The reliable method adds value only to other instances (other treasure hunts) but not to this particular instance (this treasure). However, in this game, the same belief (the map) is used twice. The first use (Round 1) is the same for both. The second use (Round 2) is where the value of the reliable method becomes apparent because the belief (map) is used again in a slightly different context. This shows that the reliable method adds value to the same token (the map) when conditions shift. The map is the same token, but it is used in two different situations (two rounds). Thus, the objection is addressed because we are not talking about two different beliefs but the same belief used in two different contexts.

  **Contested Points:**
  - Settled: In epistemology, it is widely accepted that knowledge is more valuable than mere true belief in situations where the environment may change or in the face of new evidence. The game illustrates this by having a second round with a change.
  - Contested: 
    1. Whether knowledge is reliably-produced true belief (the reliability theory of knowledge) is a contested view (e.g., Gettier problems). But note: the game does not require that knowledge is defined as reliably-produced true belief; it only shows that having a belief formed by a reliable method is more valuable in changing circumstances.
    2. The swamping problem: The objection that the value of reliability is "swamped" by the value of truth for this particular instance. Our game attempts to show that the same token of belief (the map) is used twice, so the reliability adds value to the same token when the context changes. But note: the swamping problem typically focuses on a single use of the belief. By having two uses, we avoid that. However, the swamping problem might still be raised: Why care about the method for this token if you only care about the truth for a single use? Our game shows that in real life, we often use the same belief multiple times and in changing conditions. But if the belief is only used once, then the objection stands.

  **What Might Go Wrong:**
  1. **Group B might get lucky again in Round 2.** Solution: Design the change so that Group B's map becomes unreliable enough that they are very likely to fail. For example, the change should affect a critical path that Group B's map would lead them to take. Also, the map for Group B should be arbitrary so that after the change, the symbols are no longer correlated with reality. But there's a small chance they might still get it right. If that happens, note in the debrief that even though Group B got lucky again, it was by chance and not because of the map's reliability.
  2. **The map might be seen as multiple beliefs.** We are treating the map as a single belief (or a belief system). But the objection might be that the map contains many beliefs. In the debrief, clarify that the map represents a system of beliefs about the island, and the reliability of the method affects the entire system.
  3. **Students might not see the connection to knowledge and true belief.** The debrief must carefully map the game elements to the philosophical concepts.
  4. **Time:** The game might run over time. Keep rounds short (5 minutes each) and use a small grid.

  **What the Game Cannot Reproduce:**
  - The game focuses on instrumental value (usefulness in getting points). Socrates' question might be about intrinsic value: why is knowledge valuable in itself, beyond its usefulness? The game does not address intrinsic value. We can note in the debrief that this game shows the practical advantage of knowledge, but that there might be more to the value of knowledge.

  **Alternative Game Idea (if navigation is too complex):**

  **Game Title:** "The Weather Prediction Challenge"

  - Two groups predict the weather for a given day. 
    - Group A uses a reliable method (e.g., a scientific model that uses data and patterns).
    - Group B uses a lucky method (e.g., a random guess that happens to be correct for the first day).
  - Round 1: Both groups predict the weather for Day 1 (both are correct, get points).
  - Change: A small change in weather patterns (e.g., a cold front arrives).
  - Round 2: Predict the weather for Day 2. Group A's method is still reliable, Group B's is not. Group A gets points, Group B does not.

  This is simpler but might be less engaging and the change might be less concrete.

  **Final Choice:** The Treasure Map Challenge seems more engaging and visual.

  **Instructions for the Instructor:**

  1. **Setup (5 minutes):**
     - Draw a 5x5 grid on the board. Label the rows 1-5 and columns A-E. Mark the starting point at (A,1). Mark the first treasure at (D,3) and the second treasure at (E,4) (for example).
     - Create two maps (on paper or on slides). 
          - Map A (for Group A): Shows the grid with symbols. Use a legend: 
              - Green: safe land
              - Blue: water (blocked)
              - Brown: mountain (blocked)
              - Gray: bridge (over water) - safe to cross, but note that in the change event, one bridge collapses.
          - Map B (for Group B): Same grid, same symbols, but the symbols are placed arbitrarily. However, for Round 1, the symbols are placed in a way that matches the initial island. For example, where Map A has water, Map B might have green, but in the initial setup, that cell is land. But wait: we need Map B to lead them to the treasure in Round 1. So we design Map B to have the same route as Map A but with arbitrary symbols. How? The map for Group B should have a route that is the same as Group A's, but the symbols along the route are arbitrary and not indicative of the terrain. For non-route cells, they are arbitrary and might be wrong, but that doesn't matter for the first round if they follow the route.

     However, note: for Group B, they are following the map arbitrarily. We need to design it so that in Round 1, both groups can find the treasure by following their map, but in Round 2, Group B's map leads them astray.

     Alternative: The map for both groups shows the entire grid. Group A's map has the correct terrain for every cell. Group B's map has the correct terrain for the cells that are on the route to the first treasure, but the rest is arbitrary and incorrect. Then, in Round 2, when they need to go to a different treasure, Group A's map is still correct for the new path (except the changed bridge), but Group B's map is wrong for the new path.

     Example:

     - Initial island: 
          - (A,1) to (A,3): land
          - (A,4): water (requires bridge at (A,3) to (A,4) if they go that way? Let's design a route.)

     Let me design a simple example:

     **Round 1 Goal: (D,3) from (A,1)**

     Route: 
        (A,1) -> (B,1) -> (C,1) -> (C,2) -> (C,3) -> (D,3)

     On the way, they must avoid:
        - (B,2) is water (so they cannot go north from (B,1) to (B,2))
        - (C,1) to (C,2) is safe, but (C,1) to (D,1) is blocked by a mountain.

     Map A: 
          - (B,2): blue (water)
          - (D,1): brown (mountain)
          - ... and the rest green.

     Map B: 
          - (B,2): green (land) [but in reality, it's water]
          - (D,1): green (land) [but in reality, mountain]
          - ... and for the rest, it's arbitrary but we set the route to be green so they can follow it. For non-route cells, we set arbitrary symbols.

     However, in Round 1, Group B will not go to (B,2) or (D,1) if they follow the route. So they are safe.

     **Change Event:** The bridge at (C,3) to (D,3) is now collapsed. Actually, let's say the cell (D,3) is now inaccessible via (C,3) because the bridge is gone. So they must find an alternate route.

     **Round 2 Goal: (E,4) from (A,1)**

     Now, Group A might take a new route: 
          (A,1) -> (A,2) -> (A,3) -> (B,3) -> (B,4) -> (C,4) -> (D,4) -> (E,4)

     But note: on Map A, (A,3) to (A,4) is water, so they cannot go east from (A,3) to (A,4). They must go south to (B,3). Then (B,3) to (B,4): if that is land, then okay.

     Meanwhile, Group B might try a route that goes through (C,3) to (D,3) but that bridge is gone, so they cannot. Or they might try a different route. But their map for (A,3) to (A,4) might be green (so they think they can go) but in reality it's water. So they might plan a route that goes (A,3) to (A,4) and then get stuck.

     Alternatively, we can change a different part: let's say the water at (B,2) has frozen and is now passable (so it's no longer blocked). But that doesn't break Group A because they didn't plan to go there. Instead, we want a change that breaks Group B's ability to find the second treasure.

     Better change: The bridge at (C,3) to (D,3) is collapsed. Now, for the second treasure at (E,4), both groups must avoid (C,3) to (D,3). But Group A's map still correctly shows the rest of the terrain, so they can plan an alternative route. Group B's map might show, for example, that (C,4) is water (when it is actually land) so they avoid it and get stuck. Or they might see (C,4) as land and then go that way, but then (D,4) might be shown as mountain on their map (when it's actually land) so they avoid it and fail.

     We must design Group B's map to be misleading for the second route.

     **Map B Design:**
        For the first route, all the cells on the route are green (so they can go). For the second route, we set:
          - (A,3): green (so they can go north to (A,3) from (A,2))
          - (A,4): green (so they might go east to (A,4) from (A,3)), but in reality (A,4) is water (blocked).
          - (B,3): green (but in reality, it's land, so okay) ... but if they try to go from (A,3) to (A,4) they get stuck.

     Alternatively, if they avoid (A,4), they might go from (A,3) to (B,3). Then:
          - (B,4): on Map B, we set it as brown (mountain) so they avoid it, but in reality it's land and safe.
          - So they look for another way and get stuck.

     The key is that Group B's map is arbitrary and wrong in places that are critical for the second route.

  **Final Game Flow:**

  1. Split class into two groups (Group A and Group B). Do not reveal the difference in the maps yet.
  2. Show the grid on the board. Mark the starting point (A,1) and the first treasure at (D,3). 
  3. Give each group their map (on a handout or projected). Tell them the map shows the terrain and they must plan a route from (A,1) to (D,3) without stepping on water or mountains. They can only move to adjacent cells (up, down, left, right). They have 5 minutes to plan and write down their route.
  4. After 5 minutes, ask each group to report their route. Check if it's valid on the initial island. Both groups should have a valid route (because we designed the maps so that the route they choose based on their map will work). Award 10 points to each group.
  5. Announce a change: "A storm has collapsed the bridge at (C,3). Therefore, you cannot move from (C,3) to (D,3)." (Mark this on the board.)
  6. New goal: Find the treasure at (E,4). They must plan a new route from (A,1) to (E,4), avoiding the collapsed bridge and any blocked cells. They have 5 minutes.
  7. After 5 minutes, each group reports their route. Check against the actual island (with the change). 
     - Group A: Their map is reliable, so they can plan a route that avoids the collapsed bridge and uses the correct terrain information for the rest. They should be able to find a valid route.
     - Group B: Their map is unreliable. They might plan a route that goes through a cell that is actually blocked (water or mountain) but their map shows as safe, or they might avoid a safe cell because their map shows it as blocked. They will likely fail to find a valid route.

  8. Award 10 points to Group A if they succeed. Group B gets 0.

  **Debrief Questions:**
  - In Round 1, did both groups have a true belief about how to get to the treasure? (Yes, they both found it.)
  - In Round 2, why did Group A succeed and Group B fail?
  - What was the difference between the two maps? (One was made by a reliable method, the other by luck.)
  - How does this relate to the difference between knowledge and mere true belief?
  - The extra value of the reliable method (knowledge) showed up when we used the same map (belief) in a slightly changed situation.

  **Note on Contested Issues:**
  - In the debrief, note that the game shows that a reliably formed belief (like the reliable map) is more valuable because it can be trusted in new situations. However, there is a philosophical debate (the swamping problem) about whether the reliability adds value to the particular instance of belief when it is used only once. In this game, the same belief was used twice, so the reliability added value in the second use. But if we only used the belief once, then the objection might hold. However, in life, we often use our beliefs multiple times and in varying contexts.

  **What the Game Cannot Do:**
  - It cannot show that knowledge is intrinsically valuable (if it is) beyond its usefulness. The game only demonstrates instrumental value.

  This game should run within the 75-minute session (5 min setup, 10 min Round 1, 10 min Round 2, 20 min debrief). Adjust times as needed.
answer: |-
  Here's a complete in-class game design based on your specifications, addressing the Meno problem through experiential learning while respecting the constraints and philosophical nuances you outlined. I'll call it **"The Lighthouse Game"**—a navigation task with the double-cash-out structure you want, where students feel the difference between lucky true belief and knowledge without upfront theory.

  ---

  ### **Game Overview**
  - **Core Mechanic**: Students use "navigation charts" to guide a ship to treasure islands twice: first under original conditions, then after a minor environmental change. One group has a reliably produced chart (knowledge), the other has a luckily correct one (true belief). Both succeed in Round 1, but only the reliable group succeeds in Round 2.
  - **Why it Fits Your Mechanism**: The "value" is in the chart's reliability pattern, not the token. When conditions shift (e.g., a storm alters sea currents), the lucky chart fails, while the reliable one adapts. Students see the same belief (chart) used twice, with divergence only in Round 2.
  - **Time & Logistics**: 
    - Setup: 2 minutes | Round 1: 10 minutes | Round 2: 10 minutes | Debrief: 15 minutes (fits 75m session).
    - Materials: Two paper "navigation charts" (one reliable, one lucky), a visible points ledger, and a projector/board to display "island maps."
    - Student Count: Divide 18 students into **Group A** (reliable chart) and **Group B** (lucky chart). Keep group assignments secret until debrief.

  ---

  ### **Step-by-Step Rules (Explain in <5 Minutes)**
  **Setup (2 mins)**:
  1. "You're all ship captains hunting for treasure. Each group gets a navigation chart to guide your ship. Your goal: plot routes to treasure islands on these maps."  
  2. Display a simple **grid map** (e.g., 5x5) on the board. Mark:  
     - Start point (e.g., A1)  
     - Round 1 treasure (e.g., C3)  
     - Round 2 treasure (e.g., E5)  
     - Obstacles: Rocks (■) and currents (→) that push ships off-course if entered.  
  3. Give Group A the **Reliable Chart**: Made by a seasoned cartographer using consistent methods (e.g., accurate symbols, depth measurements).  
     Give Group B the **Lucky Chart**: Made by a drunk sailor who guessed correctly once (e.g., arbitrary symbols, but accidentally right for Round 1).  
     *Note: Charts look identical visually but differ in interpretation (see below).*  

  **Round 1: Static Conditions (10 mins)**  
  1. "Plot a route from Start to Treasure 1 (C3). You *must* follow your chart's symbols. If you hit rocks or strong currents, you sink (0 points). Success = 10 points."  
  2. Both groups succeed easily:  
     - Group A's reliable symbols match the map (e.g., "~" = safe water).  
     - Group B's arbitrary symbols *happen* to align for this route (e.g., "~" means "avoid" but is placed where there are no obstacles).  
  3. Award 10 points to both groups on the ledger.  

  **Environmental Change (Announce before Round 2)**:  
  - "A storm hit! Sea currents shifted: Currents now push ships **south** (↓) instead of east (→). Rocks are unchanged."  
  - *Key: This change is minor and realistic (e.g., current direction), not altering core geography.*  

  **Round 2: Shifted Conditions (10 mins)**  
  1. "New treasure at E5! Plot another route from Start using the *same* chart. Currents now push south (↓)."  
  2. Outcomes:  
     - **Group A (Reliable)**: Their chart's method is robust (e.g., symbols based on underlying geography, not transient currents). They adjust, avoiding new risks. **Success = 10 points.**  
     - **Group B (Lucky)**: Their chart relied on luck (e.g., "avoid ~" was arbitrary). Symbols now mislead (e.g., "~" marked safe zones that are now current-heavy). They likely sink. **Failure = 0 points.**  
  3. Update ledger: Group A now leads 20–10.  

  ---

  ### **Debrief Structure (15 mins)**
  **Goal**: Map game moments to epistemology *without* assuming contested answers. Start concrete, then open philosophical questions.  

  1. **Recap Game Events**:  
     - "In Round 1, both groups had charts that got them treasure. What did that feel like?" (Elicit: Both were equally useful).  
     - "In Round 2, Group A succeeded again; Group B failed. Why?" (Students note: The storm exposed unreliable charts).  

  2. **Introduce Meno Problem**:  
     - "This mirrors Socrates' puzzle: If true belief (Group B's Round 1 chart) works just as well as knowledge (Group A's chart) *in the moment*, why is knowledge better? Where did the extra value show up?"  
     - **Map to Game**:  
       - **True belief** = Group B’s Round 1 success (lucky, but collapsed in Round 2).  
       - **Knowledge** = Group A’s consistent success (reliably produced, resilient to change).  
       - **Extra value** = Not in the chart *itself*, but in the **method** (cartographer’s process) that made it trustworthy when conditions shifted.  

  3. **Address Contested Issues**:  
     - **Settled Consensus (Safe to Highlight)**:  
       - Most epistemologists agree knowledge is *practically* more valuable than true belief in dynamic environments (your game shows this).  
       - Reliability (Group A’s method) adds resilience against perturbations (e.g., the storm).  
     - **Contested/Objections (Flag Clearly)**:  
       - **Swamping Problem**: "You might object: 'If I only care about *this treasure hunt*, why does reliability matter? Round 1 proved the lucky chart worked!' This game *doesn’t* refute that. It shows reliability’s value when **the same belief is reused** (Round 2). But if you only had one hunt, Socrates’ challenge stands—we’ll discuss this tension."  
       - **Knowledge Definition**: "Does this prove knowledge = reliably-produced true belief? No! Gettier cases show reliability isn’t sufficient for knowledge. This game only shows **one advantage** of reliable methods."  
       - **Value Beyond Usefulness**: "The game shows *instrumental* value (getting treasure). But Socrates might ask if knowledge has *intrinsic* value beyond usefulness. This game can’t answer that—it’s a limitation of any points-based simulation."  

  ---

  ### **Predictable Problems & Limitations**
  **What Will Go Wrong**:  
  1. **Group B gets lucky twice**: If students guess well in Round 2, their chart accidentally works. *Mitigation*: Design Round 2’s map so arbitrary symbols *likely* fail (e.g., place currents where Group B’s chart mislabels "safe" zones). If they succeed, say: "This happens! True beliefs *can* stick—but would you bet your life on it again?"  
  2. **Students focus on "fairness"**: Some may protest Group B’s chart was "rigged." *Response*: "Yes! That’s the point—true belief is fragile. But let’s discuss why."  
  3. **Over-simplifying knowledge**: Students might equate reliability = knowledge. *Clarify in debrief*: "Reliability is one feature of knowledge, but not the whole story (e.g., justification matters)."  

  **What the Game Can’t Reproduce (Honest Limitations)**:  
  - **Intrinsic Value**: The game only shows *instrumental* value (more points). It can’t address if knowledge is valuable *in itself* (e.g., for understanding, virtue, or truth-connection). Socrates’ deeper question—why we should *care* about knowledge beyond usefulness—remains unmodeled.  
  - **Token vs. Type Objection**: The swamping problem argues reliability adds value to belief *types* (future instances), not *tokens* (this instance). The game sidesteps this by reusing the *same* token (chart) in new conditions. But if a student says, "I only cared about Round 1 treasure!" that objection survives.  

  ---

  ### **Why This Works for Your Needs**
  - **Double-Cash-Out Achieved**: Round 1 = same outcome (true belief ≡ knowledge). Round 2 = divergence (knowledge shines). The "value" emerges from reusability under change.  
  - **No Lecture Needed**: Rules use neutral terms ("chart," "storm," "points"). Terms like "reliability" debut in debrief.  
  - **Philosophical Integrity**: Debrief separates settled ideas (practical value in flux) from contested ones (swamping, intrinsic value). Game doesn’t assume reliability *defines* knowledge—only that it’s useful.  
  - **Low Prep**: Use a simple grid (see example below). No tech needed.  

  **Example Map (Project or Draw)**  
  ```
  Round 1 Map          Round 2 Map (Post-Storm)  
     A B C D E           A B C D E  
  1  S ■ . . .          S ■ . . .  
  2  . → ~ ■ .          . ↓ ~ ■ .  // Currents now push ↓  
  3  . . T . .          . . . . .  
  4  ■ ~ . → ■          ■ ~ . ↓ ■  
  5  . . . . T          . . . . T  // New treasure at E5  
  ```  
  - **Symbols**: S = Start, T = Treasure, ■ = Rocks (avoid), →/↓ = Currents (push ship), ~ = Ambiguous zone (safe for Group A, risky for Group B).  
  - **Chart Differences**:  
    - Group A: "~" = *Always* safe (based on depth scans).  
    - Group B: "~" = *Avoid* (arbitrary; accidentally safe in Round 1 currents).  

  Run this as-is, and students will viscerally feel why reliability matters—without you lecturing. The debrief then ties their frustration (Group B) or triumph (Group A) to 2,400 years of debate. Let me know if you need tweaks!
