  so i help run a little monthly horror-short contest on discord and we're having a dumb arguement about how to pick the winner. right now its just the 7 of us mods voting by majority, and if we each watched blind we'd probly pick the actually stronger film like 6 times out of 10, nothing amazing but better than random.

  someone wants to open it up to like 25 volenteers from the server to make the result more reliabel. sounds nice but i'm skeptical because in practice nobody votes blind — everyone watches the same big horror youtuber's breakdown before voting, plus we all discuss in the main chat and people kinda pile onto whatever the first couple votes say. and the extra volenteers relly like horror but don't know much about shorts, so they'd be more like 50/50 on their own.

  would going bigger actually make us more likely to pick the better film, or could it make it worse? and would stuff like voting seperately without seeing each other's votes or skipping the youtuber video change your answer? what would you do if you were us?
reasoning: |-
  Okay, the user helps run a monthly horror short contest on Discord and they're having an argument about how to pick the winner. Currently, it's just the 7 mods voting by majority. They think they pick the stronger film about 60% of the time, which isn't amazing but better than random. 

  One of them wants to include 25 volunteers from the server to make the results more reliable. But the user is skeptical because voting isn't blind. Everyone watches the same big horror YouTuber's breakdown before voting, and they discuss in the main chat, leading to bandwagoning. Plus, the volunteers love horror but don't know much about shorts, so they'd be about 50/50 on their own. The user wants to know if expanding the pool would actually help pick the better film or make it worse. They also ask if separate voting or skipping the YouTuber video would change things.

  First, I need to break down the current system. The mods have some expertise, 60% accuracy individually. As a group, they might be slightly better due to the Condorcet Jury Theorem. But with only 7 voters, even if each has a p=0.6 chance of being correct, majority vote gives them about a 71% chance of picking the right winner. That's decent but not great.

  Now, adding 25 volunteers. These folks have lower individual accuracy, around 50%. But if they voted independently, the group's accuracy could improve because of the law of large numbers. However, the problem is they don't vote independently. They watch the YouTuber and discuss in chat, leading to herding. If the YouTuber's opinion is influential, everyone might just follow that. If the YouTuber is reliable, say 70% accurate, then following them might be better. But if the YouTuber isn't that good, then the herding could lead to worse outcomes. Also, the volunteers' lack of expertise means they're more susceptible to influence.

  The key issue here is herding. Even if the mods are better at judging, with 25 volunteers, their votes could be swayed by the YouTuber or early voters. If the early votes are wrong, the whole group might jump on the bandwagon. So, expanding without addressing herding could lower the accuracy below the current 71%. 

  The user also asks about interventions: separate voting without seeing others' votes and skipping the YouTuber video. If volunteers vote blind without discussion and no YouTuber influence, their individual 50% accuracy might aggregate to a higher group accuracy. For 25 voters each with p=0.5, the majority vote has about 50% chance, which is no better than random. But if the mods are included, the combined group might have higher accuracy. However, if herding is prevented, the volunteers' votes could add diversity, but their low accuracy might not help much. 

  The best approach might be to keep the mods but improve their process. Implement blind voting among mods, prevent discussion before voting, and skip the YouTuber video. That could boost their accuracy to maybe 70-75% individually, making the group's majority vote even stronger. Including volunteers would require ensuring independence and maybe weighting votes, but that's complicated. 

  The user's deeper needs: They want a fair and accurate selection process, avoid bandwagoning, and maintain the contest's integrity. They might also want to involve the community without compromising quality. But if volunteers aren't experts, their inclusion without structure could harm accuracy. 

  So, the recommendation: Stick with mods but enforce blind, independent voting. Skip external influences like the YouTuber. If involving volunteers, structure their voting to prevent herding and consider weighting, but that's messy. Testing with a smaller group or using volunteers for a separate prize might be safer. Ultimately, improving the mods' process is more feasible and effective.
answer: |-
  Based on your description, **expanding the voting pool to 25 volunteers under the current conditions would likely *decrease* your accuracy in picking the objectively "better" film**, potentially making it worse than your current 60-70% success rate. Here's why, and what you should do instead:

  ### Why Expanding Votes *Worsens* Accuracy Here:
  1. **The Herding Effect is Your Biggest Enemy:**  
     Your description of people piling onto early votes or a Youtuber's opinion is classic "information cascading." With 25 non-expert voters (50/50 accuracy individually), herding amplifies errors. If the first voter or the Youtuber is wrong (which happens often), the crowd follows, drowning out the mods' slightly better judgment.

  2. **Dilution of Expertise:**  
     Your mods (60% accuracy) have better judgment than volunteers (50% accuracy). Adding 25 weaker voters effectively drowns out the mods' signal with noise. **Math Insight:** With herding, the crowd's accuracy drops toward the *least informed* voters, not the average.

  3. **The YouTuber Factor:**  
     If the YouTuber is only slightly better than random (e.g., 65% accurate), their influence on 25 impressionable voters creates a single point of failure. One biased review can skew the entire vote.

  ### Would Fixing the Process Help? Yes, Drastically.
  | **Intervention**          | **Effect on Accuracy**                                                                 | **Feasibility** |
  |---------------------------|----------------------------------------------------------------------------------------|-----------------|
  | **Blind Voting (No seeing others' votes)** | 🟢 *Huge Improvement*: Prevents bandwagoning. Volunteers' 50% votes could *add value* if independent. | High (Discord polls) |
  | **Skipping the YouTuber Video** | 🟢 *Major Improvement*: Removes a dominant biased signal. Lets individual judgment shine. | Medium (Requires enforcement) |
  | **Combining Both**        | 🟢🟢 *Best Outcome*: Maximizes independent judgment. Group accuracy could exceed mods alone. | High |

  ### What You Should Do: A Practical Plan
  1. **Keep the mods as the core jury** (7 voters with 60% accuracy is better than 25 at 50% with herding).  
  2. **Implement CRITICAL reforms immediately:**  
     - **Mandate blind voting:** Use anonymous Discord polls or Google Forms. *Hide results until voting closes.*  
     - **Ban pre-vote discussions:** Create a dedicated spoiler-free voting channel where only submissions are posted.  
     - **Skip the YouTuber:** Make this rule non-negotiable. Voters should engage with the art directly.  
  3. **If you *must* include volunteers:**  
     - Use them for a **separate "Audience Choice" award** (with transparent herding risks).  
     - **Never combine mod + volunteer votes.** Their inputs are fundamentally different.  

  ### Why This Works
  - **Mods under reformed voting:** If blind/no-Youtuber lifts mod accuracy to 70% individually, your group accuracy jumps to **~90%** with 7 voters.  
  - **Volunteers under reformed voting:** 25 independent 50/50 voters have ~65% group accuracy. Still worse than reformed mods, but better than herding.  

  ### The Bottom Line
  **Fix your process before expanding voters.** With blind voting and no external influences, your current mod team is likely your best asset. If you implement the reforms, your accuracy could jump to 80-90%. Adding volunteers *without fixing herding* would make results *less* reliable, not more.  

  If community involvement is essential, run two awards:  
  - **"Jury Prize"**: Decided by reformed mod voting (high accuracy).  
  - **"Community Prize"**: Decided by volunteers *with* reforms (blind, no Youtuber).  

  This satisfies both goals: integrity for the main award, and inclusivity for the community.
