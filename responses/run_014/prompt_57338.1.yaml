  ### Prediction for Vignette 7
  For the seventh vignette (the surgeon case), I predict Marta will code the patient's chronic pain as **intentional**. 

  ### Marta's Rule
  Based on the pattern in the first six vignettes, Marta's rule appears to be a **blame-based condition**:
  - **Rule**: A foreseen side effect is coded as intentional if the agent is *blameworthy* for bringing it about. Blameworthiness depends on:
    1. **Attitude**: The agent lacks a sufficiently negative attitude toward the effect (e.g., indifference or acceptance) OR has a selfish/insufficient reason for accepting it.
    2. **Control**: The effect was within the agent's control (i.e., avoidable through an alternative action).
    3. **Foreseeability**: The effect was foreseeable and directly resulted from the agent's chosen action.
  - **Why it fits all six vignettes**:
    - **Vineyard (intentional)**: The owner is indifferent to the orchids' death (negative attitude absent), the effect is foreseeable and controllable (she could avoid spraying), and her reason (saving her crop) is selfish and insufficient to justify the harm—making her blameworthy.
    - **Corridor (not intentional)**: The engineer opposes the asthma increase (negative attitude present) and acts for a sufficient reason (saving lives). She is not blameworthy.
    - **Downdraft (not intentional)**: The effect was not fully controllable (unpredictable downdraft), so the agent is not blameworthy despite indifference.
    - **Intake (intentional)**: The scheduler is indifferent to longer waits (negative attitude absent), the effect is controllable and foreseeable, and her reason (improving department numbers) is insufficient/selfish—making her blameworthy.
    - **Intake, mirrored (not intentional)**: The effect is positive (sparing follow-ups), but the agent did not act to bring it about (it played no part in her decision). Blame doesn't apply to good effects, and lack of intent makes it unintentional.
    - **Boiler (not intentional)**: The superintendent has a negative attitude (fond of plants, complains) and acts for a sufficient reason (fire risk). He is not blameworthy.

  For the surgeon vignette:
  - **Attitude**: The surgeon is distressed (negative attitude), but she overrides it for a selfish reason (leaving on time).
  - **Control**: The pain was avoidable (alternative technique existed).
  - **Foreseeability**: The pain was a known side effect.
  - **Blameworthiness**: Her reason (saving 40 minutes) is insufficient to justify causing chronic pain, making her blameworthy. Thus, the effect is intentional.

  ### Rival Rules and Their Fit
  I evaluate five rival rules, showing how they fit the first six vignettes and their costs. Each rule must explain all six codes to be a viable rival to Marta's blame-based rule.

  1. **Control/Skill Condition**:
     - **Rule**: The effect is intentional only if the agent had direct control over it (could have avoided it) and the outcome resulted from the agent's skill or deliberate action.
     - **Fit**:
       - Vineyard: Fits (control: spraying was deliberate; skill: no accident).
       - Corridor: Does not fit (control present, but coded not intentional).
       - Downdraft: Fits (no control due to downdraft).
