  ### Bet on Vignette 7 and Why
  I would bet on the **blame condition** for vignette 7, predicting an intentional code. This rule has the strongest fit for the first six vignettes and directly applies to the surgeon case: the surgeon is blameworthy because she prioritized a trivial reason (leaving on time) over a severe harm (chronic pain), despite having control and foreseeability. The rival rules either fail to fit the data (control/skill, evaluative attitude, reason-based) or are less precise (pragmatic account). The blame condition best captures the moral dimension in Marta's coding pattern, where insufficient justification and lack of opposition are key.

  ### Further Case to Separate Surviving Rules
  The blame condition and pragmatic account both fit the first six vignettes. To separate them, I design a case that varies the **response format** rather than the story, as this exploits the pragmatic account's sensitivity to conversational context. The case uses the Boiler vignette but alters the question to imply blame.

  - **Vignette 8: Boiler with Accusatory Questioning**
