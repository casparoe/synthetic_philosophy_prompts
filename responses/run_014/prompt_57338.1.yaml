       - Intake, mirrored: Fits (control present, but lack of intent for the effect makes it unintentional).
       - Boiler: Fits (control present, but sufficient reason overrides).
     - **Cost**: Fails on Corridor (control is present but not coded intentional). Overemphasizes control while ignoring the agent's reasons/attitude. Does not explain why control leads to "not intentional" in some cases (e.g., Corridor) but "intentional" in others (e.g., Vineyard).

  2. **Blame Condition**:
     - **Rule**: Identical to Marta's rule. The effect is intentional if the agent is blameworthy for it, based on attitude, control, and foreseeability.
     - **Fit**: Perfect fit for all six vignettes (as explained above).
     - **Cost**: None for the first six. However, it may conflate intentionality with moral judgment, potentially overextending to cases where blame is ambiguous (e.g., in vignette 7, the surgeon's distress might mitigate blame for some raters).

  3. **Pragmatic/Communicative Account**:
     - **Rule**: The effect is intentional if it is pragmatically appropriate to hold the agent responsible in conversation (e.g., to assign blame or credit based on social norms).
     - **Fit**:
       - Vineyard: Fits (appropriate to blame the owner for indifference).
       - Corridor: Fits (not appropriate to blame due to sufficient reason).
       - Downdraft: Fits (not appropriate to blame as it was an accident).
       - Intake: Fits (appropriate to blame due to indifference).
       - Intake, mirrored: Fits (not appropriate to credit the agent as she didn't intend the good effect).
       - Boiler: Fits (not appropriate to blame due to sufficient reason).
     - **Cost**: Fits all six, but it is vaguer and context-dependent. For example, it relies on subjective "appropriateness" in conversation, which may vary by cultural or situational norms, making it less precise than the blame condition.

  4. **Agent's Evaluative Attitude Account**:
     - **Rule**: The effect is intentional if the agent has a pro-attitude (e.g., desire, intention, or positive evaluation) toward it.
