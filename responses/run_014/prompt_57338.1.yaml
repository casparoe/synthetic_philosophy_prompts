  What distinguishes the intentional cases?

  - In both Vineyard and Intake, the agent does not care about the side effect and the side effect is a known consequence of the action taken for the primary goal.

  What about the non-intentional cases?

  - Corridor: The agent actively opposes the side effect and only does it because the alternative is worse (so the side effect is not desired, but accepted as a necessary cost).
  - Downdraft: The side effect was not under the agent's control (unexpected downdraft) even though the agent knew there was a small chance and took precautions.
  - Intake mirrored: The agent is glad about the side effect but it didn't play a role in the decision. So even though the agent has a positive attitude, it wasn't part of the reason for acting.
  - Boiler: The agent is upset about the side effect (killing plants) but does it because of a greater risk (fire). So again, the side effect is not desired but accepted.

  It seems that for Marta, an effect is intentional if:

  - The agent knows it will happen (or is very likely) and
  - The agent does not oppose it (i.e., is indifferent or perhaps even wants it) and
  - The effect is a direct result of the action (so not due to an unexpected event) and
  - The effect is not just a byproduct that the agent would avoid if possible but cannot without sacrificing the main goal.

  But note that in Corridor and Boiler, the agent opposes the side effect but does the action anyway because of a greater good. In Downdraft, the effect is not under the agent's control. In Intake mirrored, the agent has a positive attitude but the effect did not factor into the decision.

  So a candidate rule for Marta might be:

  **Marta's Rule (Hypothesized):** The side effect is intentional if and only if:
  - The agent foresaw the side effect (or should have foreseen it) and
  - The agent did not take the side effect as a reason against the action (i.e., the agent was indifferent or welcomed it) and
  - The side effect was within the agent's control (i.e., not due to an unforeseeable event) and
  - The side effect was a direct consequence of the action taken to achieve the main goal.

  But note that in Downdraft, the agent took precautions and the event was unforeseeable, so not intentional. In Vineyard, the agent did not take precautions (or at least, the drift was known and she didn't care) and it was foreseeable.

  However, in the seventh vignette:

  - The surgeon foresees the chronic pain.
  - She is distressed by it and would prevent it if she could (so she does not welcome it).
  - The side effect is under her control because she could choose the alternative technique that avoids the pain (but she doesn't because she wants to leave on time).
  - The chronic pain is a direct consequence of the chosen operation.

  But note: the agent is not indifferent. She is distressed and would avoid it if she could without sacrificing the main goal? Actually, she can avoid it by using the alternative technique, but that would take 40 extra minutes and make her leave late. So she is trading the side effect (chronic pain) for her own convenience.

  Therefore, in this case, she is not indifferent. She is actively choosing to cause the side effect for a selfish reason (leaving on time) even though she is distressed by it. But note that in Corridor and Boiler, the agents were also choosing to cause the side effect for a greater good (saving lives, preventing fire) and they were coded as not intentional.

  So what's the difference? In Corridor and Boiler, the agents were acting for a greater good and the side effect was a necessary cost. In the surgeon's case, she is acting for a selfish reason (leaving on time) and the side effect is avoidable (by taking the extra time) but she chooses not to avoid it.

