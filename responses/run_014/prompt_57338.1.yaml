       - Corridor: Fits (con-attitude, not intentional).
       - Downdraft: Fits (no pro-attitude, not intentional).
       - Intake: Does not fit (indifference is not pro-attitude, but coded intentional).
       - Intake, mirrored: Fits (pro-attitude but not linked to action, so not intentional).
       - Boiler: Fits (con-attitude, not intentional).
     - **Cost**: Fails on Vineyard and Intake, where indifference leads to intentional coding. Overlooks cases where lack of opposition (indifference) suffices for intentionality, even without active pro-attitude.

  5. **Alternative Rule: Reason-Based Condition** (constructed to fit the data):
