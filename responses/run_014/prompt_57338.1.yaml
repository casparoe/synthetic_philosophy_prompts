    - **Expected Outcome**: If Marta codes this as intentional, it supports the pragmatic account (due to wording sensitivity). If she codes it as not intentional (consistent with the original Boiler), it supports the blame condition.

  This case isolates the pragmatic account's reliance on communicative context, while the blame condition remains robust to wording changes. It thus provides a clear empirical test to distinguish the rules.
