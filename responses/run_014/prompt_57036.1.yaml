prompt: |-
  I'm auditing a philosophy of physics course this semester — my degree was in chemistry, so anything with a Lagrangian in it washes straight over me, but last week's seminar was on the direction of time and I've been trying to pin down what I actually believe about it. Partly because my flatmate, who's doing the same course, insists my views dont hang together and I can't tell whether he's right or just enjoying himself, and partly because I want to know if there's one principle generating all of my intuitions here or whether I'm just waving at four or five different things and calling it a single view. So here's the list, in roughly the order the thoughts came:

  1. A film of two billiard balls colliding and rebounding: I genuinely can't tell which way it's running, and I don't think anything is objectionable about either direction.
  2. A film of gas let out of a small partitioned corner spreading to fill the whole box: instantly obvious which way, and the reverse would be objectionable.
  3. Same for an egg hitting the kitchen floor.
  4. But a film of the smashed egg leaping back up onto the table and reassembling — I want to say that's not just fantastically unlikely. I want to say it's not allowed, full stop. There's a difference between improbable and impossible and this is on the impossible side of it.
  5. I do accept that the microscopic laws are (basically) time-reversal invariant, that every trajectory has a reversed twin which is just as lawful. I know there's a little bit of T-violation somewhere in the weak interaction but I don't think that has anything to do with any of this.
  6. A stone dropped in a pond: waves travel out to the edges and that's it. The version where waves come in coherently from all the edges and converge on the stone, launching it back up into my hand, looks to me like a perfectly legal solution of the wave equation, but it doesn't happen and never will.
  7. I have mountains of knowledge about the past — photos, fossils, tree rings, my own memories, other people's testimony — and essentially nothing comparable about particular future events.
  8. Except that I know the sun will rise tomorrow, that the planets will still be going round, that I'll be a year older at my next birthday, that this coffee will be cold in an hour. In some sense I know more about next Tuesday than about what I had for lunch three weeks ago.
  9. I can affect the future and not the past, and I think the reason is simply that the past has already happened. It's fixed. That just seems like a complete explanation to me.
  10. The fact that we remember one direction and anticipate the other isn't a seperate brute fact about minds, I think — it's downstream of whatever makes 2 through 6 asymmetric.
  11. But I also think I can coherently imagine a creature whose memory-like states run the other way, and I would not want to say time itself flows backwards for them. So the direction seems to me to be a single global objective feature, not something that can vary from creature to creature or region to region.
  12. The early universe was in an absurdly special, low-entropy state (the past hypothesis, I think it's called?). I'm not willing to shrug and call that a brute starting point — it feels like exactly the sort of thing that demands an explanation. But I feel no comparable urge to explain why the final state of the universe isn't special too, and I can't say why the demand is one-sided.
  13. If the universe stopped expanding and started recollapsing, I think things would still get messier on the way in and the arrow would keep pointing the same way. I don't buy that it flips at the turnaround.

  So: is there a single principle behind these, or a small number of candidate principles that compete for the job? Give me up to three, stated precisely enough that I could tell whether a new case falls under them, and for each one tie the clauses back to the verdicts that motivate them — which of my numbered commitments each clause is there to capture. Then tell me what each candidate says about cases I haven't listed: a machine that sorts a shuffled deck back into suits and ranks while the room heats up; somebody who claims to remember next Tuesday and what would count as evidence for them; a cup of coffee that spontaneously warms itself by drawing heat out of a cooler room. And then be blunt about which of my verdicts each candidate forces me to abandon, and rank those costs — I don't want a list where every tension is presented as equally bad, because I'm sure some of these only look like they conflict and dissolve once you get the distinction right. Lead with your bottom line in the very first sentence — whether there is one principle and which single verdict I have to give up — and then the reasoning, no preamble and no restating my list back to me. And please no bibliography or recommended reading; I can't go look anything up right now, I just want the argument.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They're auditing a philosophy of physics course, coming from a chemistry background. They're struggling with their intuitions about the direction of time and whether their views are consistent. Their flatmate thinks they don't hang together, and they want to know if there's a single principle behind their 13 points or if they're just a collection of separate ideas.

  First, I need to parse each of their points. Points 1-3 show reversible vs. irreversible processes: billiard balls are symmetric, gas spreading and eggs breaking are obviously directional. Point 4 is interesting—they think a reassembling egg is impossible, not just unlikely. But point 5 accepts microscopic time-reversal invariance. Point 6 acknowledges that wave equations allow reverse but it doesn't happen. Points 7-9 deal with knowledge and causation: past is fixed, future can be influenced. Point 10 links memory to physical asymmetry. Point 11 considers a creature with reversed memory but same time direction. Points 12 and 13 touch on cosmology: the past hypothesis needing explanation but not the future, and entropy during a collapsing universe.

  The user wants up to three principles that tie these together, each precisely stated. Then, apply them to new cases like a sorting machine, someone remembering the future, and a self-warming coffee. Finally, identify which of their original points conflict with each principle and rank the costs.

  The core tension is between their belief in microscopic reversibility (point 5) and their intuition that some processes are impossible in reverse (point 4). The Past Hypothesis (low entropy past) is key here. But they also resist accepting it as a brute fact (point 12). So how to reconcile?

  Option 1: Past Hypothesis alone. This explains why entropy increases, covering points 2,3,4,6. It makes knowledge of the past possible (7,8,10) and why we can affect the future (9). But it treats the low entropy past as a brute fact, conflicting with point 12 which demands an explanation for it. Point 13 about collapsing universe would see entropy continue to increase, which aligns. But point 11 (global arrow) is okay. However, the brute fact issue is a big cost since the user explicitly wants an explanation.

  Option 2: Past Hypothesis plus a supplementary principle. Maybe the underlying laws have an asymmetry? But point 5 accepts T-symmetry except weak interaction, which isn't relevant. Introducing a new law might conflict with point 5. Also, point 4's impossibility would need more than probability. But without a clear candidate, this seems vague. Cost: conflicts with point 5 and requires abandoning T-symmetry acceptance.

  Option 3: Statistical mechanics without additional principles. Entropy increase is statistical. But then point 4's "impossible" becomes "extremely improbable," which the user rejects. Point 6's reverse waves are possible but never happen. But the user insists some reversals are not just unlikely but forbidden. So this forces giving up point 4, which is a high cost since they feel strongly about it.

  Now, applying to new cases. Sorting machine: while sorting, entropy decreases locally, but room heats up, increasing total entropy. Past Hypothesis allows this if net entropy increases. But if the user thinks the egg reassembly is impossible, is sorting also impossible? Or just improbable? Past Hypothesis says improbable but possible, but user might object.

  Remembering the future: if someone claims that, under Past Hypothesis, it's impossible because memories are records from the past, which is low entropy. Evidence would require reverse causation, which isn't feasible. Self-warming coffee: possible but astronomically improbable; Past Hypothesis doesn't forbid it, but user might want it impossible.

  Assessing costs: Option 1's cost is accepting a brute fact (against point 12). Option 2's cost is rejecting microscopic reversibility (point 5). Option 3's cost is accepting that reversals are only improbable, not impossible (point 4). Among these, point 12 is a demand for explanation but not a firm intuition like point 4. Point 5 is established physics, so denying it is high cost. Point 4 is a strong intuition. So Option 1 might be best, even with the brute fact, as it's the standard view. Option 3 forces abandoning point 4, which the user feels strongly about.

  Bottom line: The Past Hypothesis is the core principle, but requires accepting the low-entropy past as a brute fact, conflicting with point 12. That's the minimal cost. Other options have higher costs. So yes, a single principle covers most, with one key tension.
answer: |-
  **Bottom line:** There is one core principle—the *Past Hypothesis*—that captures most of your intuitions, but you must abandon your demand for an explanation of the low-entropy past (point 12) as a cost; this is the minimal tension.

  ### Core Principle: The Past Hypothesis (PH)
  **Definition:** The universe began in a *macroscopically specific, low-entropy state*, and the underlying laws of physics are time-symmetric (reversible). Entropy increases toward the future because high-entropy states are statistically dominant, making the low-entropy past a boundary condition.

  #### How PH explains your commitments:
  - **Points 2, 3, 4, 6:** Gas spreading, egg breaking, and outward waves are irreversible *in practice* because reversing them would require decreasing entropy, which is statistically forbidden given PH. The egg reassembling (4) isn’t *dynamically* impossible but requires such astronomically improbable correlations that it’s effectively forbidden by PH (it violates the statistical arrow).
  - **Points 7–10:** Knowledge/memory relies on *records* (e.g., fossils, tree rings), which only form in entropy-increasing processes. PH ensures the past has low entropy, making records possible; the future’s high entropy erases them. Affecting the future (9) is possible because future states aren’t fixed yet, but PH fixes the past.
  - **Point 11:** The arrow is global/objective because PH sets a universal boundary condition. A creature with "reverse memory" would still experience entropy increasing toward *their* future (e.g., they’d "remember" high-entropy states but anticipate lower entropy).
  - **Point 13:** Entropy increases during cosmic collapse because PH sets initial low entropy, not final conditions. Reversal isn’t tied to expansion/contraction.

  #### Conflicts and costs:
  - **Cost to you:** Must accept PH as a brute fact (abandons point 12’s demand for explanation). PH *is* the explanation for asymmetry; demanding its explanation leads to infinite regress.
  - **Minor tension:** Point 4 calls reverse processes "impossible," but PH makes them *statistically* impossible (not dynamically forbidden). You must soften "impossible" to "physically unrealizable in our universe."

  #### Verdicts on new cases:
  - **Sorting machine while room heats up:** Allowed. Local entropy decrease (sorting) is possible if total entropy increases (room heating). PH permits this as a statistical fluctuation.
  - **"Remembering" next Tuesday:** Impossible under PH. "Memory" requires a causal record from the past. Claims of "future memory" would need evidence of *current* low-entropy correlations (e.g., pre-scattered waves converging), but PH makes this astronomically improbable.
  - **Coffee warming spontaneously:** Allowed as a fluctuation, but *physically unrealizable* in practice. PH doesn’t forbid it dynamically, but its probability is vanishingly small. You must accept it as "possible but never observed."

  ---

  ### Alternative Principles (with higher costs)
  **Option 2: Fundamental Time-Asymmetric Law (FTAL)**  
  **Definition:** Underlying physics has intrinsic time asymmetry (e.g., a law forbidding certain reverse processes).  

  - **Explains:** Points 4 (egg reassembly impossible), 6 (reverse waves forbidden), 12 (asymmetry is fundamental, not brute).  
  - **Conflicts:** Rejects point 5 (microscopic reversibility) and point 13 (collapsing universe arrow same). Forces you to abandon T-symmetry, contradicting known physics.  
  - **New cases:** Sorting machine forbidden; future "memory" inexplicable; self-warming coffee forbidden.  
  - **Cost ranking:** High—discards established physics (point 5) and overrules your acceptance of reversible micro-dynamics.  

  **Option 3: Pure Statistical Mechanics (SM)**  
  **Definition:** Entropy increases statistically from *any* initial state; no special past needed.  

  - **Explains:** Points 2, 3, 6 (statistical irreversibility), and point 5 (reversible laws).  
  - **Conflicts:** Fails points 4 (egg reassembly must be "possible"), 7–10 (no past/future asymmetry in records), 11 (arrow not global), 12 (no special past). Forces you to abandon intuition that the past is fixed (9) and that asymmetry is objective (11).  
  - **New cases:** Sorting machine likely; future "memory" possible if fluctuations align; self-warming coffee probable over infinite time.  
  - **Cost ranking:** Highest—contradicts your core intuitions (e.g., past/future asymmetry in knowledge and causation).  

  ---

  ### Final Ranking of Principles by Cost to You
  1. **Past Hypothesis (PH)**  
     - **Cost:** Accept PH as brute (point 12). Soften point 4 to "statistically impossible."  
     - **Strength:** Captures 11/13 points organically. Minimal conflict with physics.  
  2. **Fundamental Time-Asymmetric Law (FTAL)**  
     - **Cost:** Abandon point 5 (reversible micro-laws) and point 13 (arrow stability).  
     - **Weakness:** Ad hoc; no empirical support.  
  3. **Pure Statistical Mechanics (SM)**  
     - **Cost:** Abandon points 4, 7–11, 13.  
     - **Weakness:** Makes past/future symmetric—contradicts your lived experience.  

  **Conclusion:** PH is your "single principle" with one non-negotiable cost: the low-entropy past is the unexplained foundation. All other tensions (e.g., point 4 vs. point 5) dissolve under PH’s statistical arrow. Rejecting this forces higher costs elsewhere.
