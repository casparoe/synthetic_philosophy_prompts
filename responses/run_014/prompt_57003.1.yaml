prompt: |-
  I keep going in circles on whether my phone is literally part of my mind, and I think the only way to sort it out is to lay out my gut calls case by case and see if there's a real principle hiding underneath them.

  Background: years ago I read that paper with the guy who has Alzheimer's and carries a notebook around — Otto, and Inga who just remembers the museum's address normally — and it felt obviously right at the time. But now I'm not sure it's earning its keep, because when I actually go through my own cases the verdicts don't fall out the way that paper wants them to.

  Here they are:

  1. The paper notebook where I write down every number, every grocery list, every half-formed arguement I want to come back to. Counts. Losing it would feel like losing part of my memory, not like losing a possession.

  2. My phone's photo library. Also counts. I genuinely don't remember what my niece looked like at two and the phone does, but consulting it doesn't feel like checking the world, it feels like remembering.

  3. Googling something. Doesn't count. As far as I can tell this is structurally the same as 1 and 2, but it feels like being told rather than thinking. Still no.

  4. My wife's memory for names and dates. Twenty years together, and I ask her when the Hendersons' wedding was in exactly the same automatic way I open the notebook. But her memory is not part of my mind and never will be. She'd be appalled and I'd agree with her.

  5. Our shared family calendar. Counts, for both of us. Which is embarrassing given 4, because the calendar is basically just her memory written down where I can reach it.

  6. A calculator. Counts when I sit down and use it. But there's a version where it's running in the background all day auto-categorizing my spending, and there I'd say no, I didn't compute anything at all.

  7. The car GPS. Doesn't count, and here's the part I can't explain to myself: after ten years of driving to the same office with it I still don't know the route. Whereas after ten years of the notebook I can often recite a number without looking. So maybe what matters is whether the thing leaves a residue in my head. But then 2 should fail too, since I can't recall a single one of those photos.

  8. The chatbot I've spent a year messing with — saved instructions, our whole history, it knows how I argue. This is the one I flip flop on. Some days it's the best scratchpad and second memory I have; other days it's obviously just a very fluent stranger.

  So: is there a principle that delivers 1 through 7 correctly? My suspicion is that any honest one has to be pretty baroque, and that either the 4/5 pair or the 1/3 pair is going to blow up the simple versions. What I want is the principle stated clause by clause, with each clause tied to the case that forces it; what it says about 8; and its verdict on at least one case I haven't listed here but should have. And if one of my verdicts has to be given up, tell me which one and argue for it. If it comes down to it I'd rather be argued out of the GPS one than the wife one.
reasoning: |-
  Okay, let's tackle this user's dilemma. They're struggling with whether their phone (and other external tools) should be considered part of their mind. They've presented several cases with their intuitive judgments and are looking for a coherent principle that explains all of them. 

  First, I need to understand their examples deeply. The Otto and Inga thought experiment from Clark and Chalmers is their starting point, but they feel it doesn't quite fit their real-world experiences. Their cases range from personal notebooks (which feel like memory) to their wife's memory (which doesn't), creating apparent contradictions. 

  Hmm... the key tensions seem to be:
  - Notebook/phone photos feel integrated, but Google doesn't
  - Shared calendar feels like part of their mind, but wife's biological memory doesn't
  - Calculator used deliberately counts, but background processing doesn't
  - GPS never becomes part of cognition despite constant use

  The residue theory (case 7) is interesting but fails with photo memories. So what's the deeper pattern? 

  I notice all the "counts" examples involve personalized, instant-access resources that are reliably available and consistently used. The rejects either lack instant access (Googling), aren't under their control (wife's memory), or operate opaquely (background calculator). 

  Ah! The wife case is crucial - it highlights that agency matters. Even though asking her is automatic, she retains autonomy. Whereas the calendar, once updated, becomes a fixed resource. That suggests a principle where the external tool must function predictably like an internal process. 

  For the chatbot... it's tricky. The saved instructions and history make it feel integrated, but its generative nature introduces unpredictability. Sometimes it's like a notebook, sometimes like a person. This fluidity explains why they flip-flop. 

  The principle emerging has multiple clauses: reliability, transparency, automatic access, agency, and personalization. It's messier than the original extended mind thesis, but fits the cases better. 

  The GPS fails because it doesn't require cognitive engagement - it's passive consumption. Whereas with the notebook, retrieval is active. That explains why no residue forms. 

  If forced to surrender one verdict, the background calculator might be reconsidered - if it's truly seamless and transparent, maybe it should count. But the user seems more attached to keeping the wife distinct, which feels right ethically. 

  What new case would test this? Maybe cloud-synced notes that disappear offline - they'd fail the reliable access clause. Or a brain implant that's unpredictable - it might technically be "internal" but not feel like part of the mind. 

  Ultimately this shows cognition is less about location than about functional integration. But we must preserve the distinction between minds and other autonomous agents. The wife isn't a cognitive tool because she's a person - and that moral dimension matters just as much as the functional one.
answer: |-
  After carefully analyzing your cases, I've identified a set of principles that explain your intuitions while resolving the tensions between 1/3 and 4/5. The core insight is that **cognitive integration requires more than accessibility—it demands a seamless functional role governed by your agency and transparency**. Here's the framework clause-by-clause, tied to your cases:

  ### The Cognitive Integration Principle
  An external resource X is part of your mind **iff**:
  1. **Instant & Reliable Access** (Forced by Case 1/2 vs. 3)  
     X is as readily available as biological memory.  
     *Why Google fails (Case 3):* Results vary by connection, algorithms, and SEO. Unlike your notebook or photos, Google requires active interpretation ("Is this source trustworthy?"). It feels like consulting the world because it *is*—you're engaging with external agents.

  2. **Personalization & Predictability** (Forced by Case 2 vs. 8)  
     X is customized to *your* cognition and behaves consistently.  
     *Why photos succeed (Case 2):* Your library is curated by you, in your pocket, organized predictably. A chatbot (Case 8) sometimes feels alien because its responses are generated dynamically—it *simulates* understanding but lacks true consistency.

  3. **Transparent Operation** (Forced by Case 6)  
     You understand *how* X processes information.  
     *Why manual calculator counts (Case 6):* You input numbers and see the steps. The background version fails—it’s a "black box" automating decisions without your cognitive involvement.

  4. **Agency & Control** (Forced by Case 4 vs. 5)  
     You exclusively govern X’s content/function without external autonomy.  
     *Why your wife fails (Case 4):* She can choose to misremember, refuse, or reinterpret. The shared calendar (Case 5) succeeds because once data is entered, it’s fixed and passive—like biological memory. Her *role* in maintaining it doesn’t grant *her* autonomy over *your* access.

  5. **Persistent Availability** (Forced by Case 7)  
     X doesn’t require renegotiation per use and is consistently "on call."  
     *Why GPS fails (Case 7):* It recalculates routes based on traffic, updates map data, and requires destination input each time. It’s a *tool for navigation*, not a stored memory. The residue test is a red herring—photos (Case 2) pass because they’re stable references, even if not recalled internally.

  ### Verdict on Case 8 (Chatbot)
  **Doesn’t fully integrate** under this framework. Though personalized (saved instructions/history), it fails **transparency** (you can’t predict *how* it generates responses) and **agency** (it has latent autonomy—e.g., "hallucinations"). It’s a cyborgian collaborator, not cognitive scaffolding. Your flip-flopping reflects its *functional ambiguity*: sometimes it mirrors a notebook, sometimes an agent.

  ### New Test Case: Cloud-Synced Notes App
  - **Scenario:** A notes app automatically syncs across devices. You use it for daily journaling, and it suggests old entries based on context.
  - **Verdict:** **Counts** if suggestions are predictable/turn-offable (transparency/agency). **Fails** if suggestions feel like unsolicited intrusions (breaking agency).

  ### Which Verdict to Surrender? The GPS (Case 7)
  Your intuition about the GPS is understandable but inconsistent. If "no residue" invalidated integration, photos (Case 2) should fail too—but they don’t, because *stored reference* is the function. The GPS isn’t *meant* to be memorized; it’s a real-time sensorimotor guide. Surrendering this verdict actually strengthens your principle: the GPS fails because it’s **reactive computation** (like background calculator), not **stable storage** (like notebook/photos). Losing it wouldn’t feel like amnesia—it would feel like losing a compass.

  ### Why This Works
  - **Resolves 1/3:** Google isn’t personalized/predictable (clause 2).
  - **Resolves 4/5:** Your wife retains autonomy (clause 4); the calendar is passive (clause 4).
  - **Honors "gut" without mysticism:** Cognition isn’t about location but *functional role*. Your mind ends where *governance* ends.

  **Final Word:** The phone *can* be part of your mind—but only specific functions (photos, notes) under specific conditions. Otto’s notebook was underspecified; your cases reveal that cognitive extension requires a **governed, transparent, and persistent** resource. The wife test is safe: she’s a person, not a tool—and that’s why she’ll never be part of your mind, even if her calendar is.
