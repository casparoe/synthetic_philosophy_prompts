prompt: |-
  Okay so I supervise like 15 part-time support agents for a tax-filing app and tbh we keep getting into trouble about what agents are suposed to just tell customers flat-out.

  The situation is we get dozens of chats a day, mostly pretty repetitive — am I eligible for X, do I need to file Y, will I get penalized if Z — agents have basic training but they're not accountants, they have like 3-4 minutes per ticket, and I'm the one who has to sign off if something goes wrong. Stakes are realy money + people filing late because we dithered, but also money + fines if we state something false confidently.

  Can you turn that whole norms of assertion debate — like do you need to know it vs just have it be true vs just reasonably believe it — into a checlist my folks can actually run? I don't need the theory lecture, I need a flowchart-in-words: question 1, if yes go here, if no stop, what counts as good enough for each step, and flag clearly where there's no mechanical answer and they just have to use judgment or escalate to me.

  Then please run it on three made-up but typical cases for us:

  1. Maya has read the IRS FAQ yesterday about whether freelance mileage to a second gig counts, she remembers the gist and she's right, but she can't pull up the link mid-chat and the customer has to file tonight.

  2. Luis has done the math himself and is like 99% sure a customer owes no underpayment penalty, except there's one box about part-year residency last year he didn't check, and our script says escalate all penalty questions. Customer is begging for a yes/no.

  3. Priya's case which I know I'm not gonna like: our QA wants agents to reassure angry customers by saying your refund will definitely be there by Friday, which is usually true from past timing and it calms people down, but the agent doesn't actually know the IRS processing time for this person.

  Be honest about where the procedure will misfire or be annoying in a busy queue, and what it just can't settle for us.

  Make your very last line start with Summary: followed by one sentence summing up when my agents get to assert something.
reasoning: |-
  We are going to construct a practical checklist for agents to decide when they can assert something to a customer. The core principles from the norms of assertion debate (knowledge norm, truth norm, reasonable belief norm) are distilled into a step-by-step guide. The goal is to balance speed, accuracy, and risk.

  Checklist for Agents: When Can I Tell a Customer Something Flat-Out?

  Step 1: Is the customer asking for a factual answer about tax law, IRS procedure, or the application of either to their specific situation?
  - If NO: Then you are not in the realm of assertion about tax facts. Proceed with normal support (e.g., how to use the app, non-advice questions).
  - If YES: Go to Step 2.

  Step 2: Is the answer directly provided in our app's script, knowledge base (KB), or an official IRS source (like IRS.gov, IRS publications, or IRS FAQs) that you have been trained to use?
  - If YES: Go to Step 3.
  - If NO: Escalate to supervisor. Do not guess.

  Step 3: Can you immediately access the exact source (e.g., link to IRS page, KB article) and verify the answer without exceeding the time for the chat?
  - If YES: Provide the answer and the source (if possible, paste the link or direct the customer to where they can see it).
  - If NO: Go to Step 4.

  Step 4: Is the answer something you have been specifically trained on and tested for, and you are certain it is correct? (This is about core knowledge you are expected to have without looking up, e.g., common deadlines, basic eligibility rules.)
  - If YES: You may assert it, but add a caveat that they should verify with the IRS if their situation is complex. Example: "Based on IRS guidelines, [answer]. However, I recommend double-checking with the IRS or a tax professional if your situation has any complexities."
  - If NO: Go to Step 5.

  Step 5: Do you reasonably believe the answer is true? Consider:
     - You have seen the rule in an official source before and remember it clearly (even if you can't pull it up right now).
     - The answer is straightforward and consistent with everything you've learned.
     - There are no red flags in the customer's situation (e.g., multiple jobs, living in multiple states, unusual deductions, etc.).
  - If YES: Go to Step 6.
  - If NO: Escalate to supervisor. Do not guess.

  Step 6: Is the assertion about a high-risk topic? High-risk topics include:
     - Penalties, interest, or fines.
     - Eligibility for refunds, credits, or deductions above a trivial amount.
     - Legal consequences (e.g., "you won't get audited").
     - Time-sensitive actions (e.g., "you have until midnight").
     - Any topic where the customer might rely on your answer to make a filing decision that could result in financial loss or penalty.
  - If NO: You may assert the answer, but with a caveat: "Based on my understanding, [answer]. However, for official confirmation, please see [source, if you can name it] or check with the IRS."
  - If YES: Escalate to supervisor. Even if you believe it, high-risk topics require either immediate verifiable source or supervisor approval.

  Special Note on Reassurance: If the customer is upset and you are tempted to reassure them with a statement about the future (e.g., refund timing, audit chances), this is always high-risk. Do not make promises about things outside our control (like IRS processing times). Use only approved scripts for reassurance. If no approved script exists for the exact scenario, escalate.

  Now, let's run the three cases:

  Case 1: Maya
  - Step 1: Yes, factual tax question (mileage deduction eligibility).
  - Step 2: Yes, she remembers the IRS FAQ is the source.
  - Step 3: No, she cannot pull up the link mid-chat.
  - Step 4: She has been trained on deduction rules? Probably yes, but she's not 100% on this specific point without the source. So, maybe no? Let's go to Step 5.
  - Step 5: Reasonable belief? Yes, she remembers the gist and is right. But note: deductions are medium-risk (if wrong, could lead to underpayment penalty). However, Step 6: 
  - Step 6: Is it high-risk? Deductions are not as high-risk as penalties, but they can lead to penalties if incorrectly taken. Since the customer is filing that night and relying on this, it might be considered high-risk. However, our checklist defines high-risk as including "eligibility for ... deductions above a trivial amount". Mileage for a second gig might be nontrivial. Therefore, Step 6 says escalate for high-risk. 
  - But wait: Step 5 says if reasonable belief and not high-risk, then assert with caveat. But Step 6 flags it as high-risk? Let's clarify: In our checklist, deductions that could be substantial are high-risk. So, we should err on the side of caution.

  However, note that Maya is right and the customer is in a hurry. The checklist would require escalation because she can't verify the source and it's a deduction (which is high-risk). This is annoying and might slow things down, but it's the safe choice.

  Alternatively, if the deduction is considered low-risk (e.g., small amount) then Step 6 would say no and she could assert with caveat. But without knowing the amount, we must assume it's substantial.

  So, Maya should escalate? Or if the KB says that for common deductions like mileage, agents can assert if they are sure, then Step 4 might have covered it. But the problem says she can't pull the source. Let's reexamine:

  In Step 4, if she has been specifically trained on mileage deductions and this is a core part of her knowledge, then she can assert with caveat. But if not, then Step 5 and 6. 

  Given the scenario: she read the IRS FAQ yesterday and remembers the gist. This is not core training but recent exposure. So Step 4: probably not (unless training covered it). Step 5: reasonable belief? Yes. Step 6: high-risk? Yes (because deduction). So she must escalate.

  But the problem says she's right and the customer has to file tonight. The checklist would cause an escalation which might cause delay. This is a misfire in terms of efficiency but necessary for risk control.

  Case 2: Luis
  - Step 1: Yes, factual question about penalty.
  - Step 2: Our script says escalate all penalty questions. So immediately, without going further: Escalate. 
  - Why? Step 2: If the answer is not in the script/KB in a way that allows direct answer, then Step 2 says "No" -> Escalate. But note: the script says escalate all penalty questions. So that's a directive. Even if he did the math, the script overrides.

  So Luis must escalate. Even if the customer begs, he cannot answer. He can say: "I'm sorry, but for accuracy on penalties, I need to have a supervisor confirm. I will escalate this now and they will get back to you as soon as possible."

  Case 3: Priya
  - Step 1: Is it a factual answer? Yes, about refund timing.
  - However, note: this is a reassurance about the future, which is not a fact about tax law but about IRS processing. And the agent doesn't know the actual processing time for this person.
  - Step 2: Does our script or KB say we can tell customers "definitely by Friday"? The scenario says QA wants agents to say that. So if it's in the script, then Step 2 is yes. But note: the script might be wrong. Also, the agent doesn't actually know the IRS processing time for this person. 
  - Step 3: Can she access the source? Probably not, because it's not about a source but about a prediction.
  - Step 4: Is this core training? Maybe, but it's a prediction. 
  - Step 5: Reasonable belief? She has past experience, but for this person? No, because each case is different.
  - Step 6: High-risk? Absolutely. If the refund doesn't come by Friday, the customer may have relied on that and could blame us for financial harm (e.g., they made plans). Also, it's about money and timing.

  But note: the checklist says for reassurance about the future, use only approved scripts. If QA has approved this script, then that's the company policy. But the checklist also says: "Do not make promises about things outside our control". So even if the script says it, the agent should avoid "definitely". The script should be worded as "typically" or "usually", not "definitely".

  So, if the script says "definitely", that's a problem. Priya should not say it. She should use a non-definitive statement: "Based on typical processing times, your refund may arrive by Friday, but the IRS does not guarantee specific dates." 

  However, the scenario says QA wants agents to say "definitely". This is a conflict between the checklist (which is designed to prevent liability) and QA (which wants to calm customers). 

  Therefore, the checklist would flag this as high-risk and require either using a non-absolute script or escalating. But since the script exists, she might be required to use it. However, from a liability perspective, the agent should not make absolute promises.

  So, the checklist should have a clear rule: never say "definitely" or make absolute promises about future IRS actions. Always use qualifiers unless the information is directly from the IRS for that specific return (which we don't have). Therefore, Priya should not say it. She should either use a qualified statement or escalate.

  Misfires and Annoyances:
  - The checklist will cause escalations for cases that might be simple (like Case 1) because we can't verify the source quickly. This will slow down the queue and frustrate agents and customers.
  - Agents might feel they are escalating too much, especially when they are confident. But the trade-off is reducing liability.
  - The checklist cannot replace judgment entirely. For example, what is "trivial" in Step 6? Agents will need to use judgment for what is a substantial amount (which might vary by customer). We might set a dollar threshold (e.g., over $100 is substantial) but even that might not be clear in context.
  - The procedure cannot settle disputes about what counts as "reasonable belief" (Step 5) or "red flags" (Step 5). These require agent judgment and training.

  Summary: Your agents get to assert something only when it is directly verifiable from an official source (and they can access it) or when it is within their core training and not high-risk, and even then with caveats; otherwise, they must escalate.
answer: |-
  ### Practical Assertion Checklist for Tax Support Agents  
  **Use this flowchart-in-words for every customer query about tax rules, penalties, deadlines, or eligibility. Time per step: Aim for 60 seconds max.**  

  1. **Is this a factual tax/IRS question?**  
     - *Yes* → Go to #2.  
     - *No* (e.g., app navigation, non-tax advice) → Answer freely.  
     - *⚠️ Judgment call*: If unsure, treat as "yes."  

  2. **Is the answer in our approved script/KB, verbatim?**  
     - *Yes* → **Assert it** (e.g., "The deadline is April 15").  
     - *No* → Go to #3.  
     - *✅ Good enough*: Scripts/KB articles vetted by legal/CPA.  

  3. **Can you instantly pull the IRS source (with link)?**  
     - *Yes* → **Assert it + paste link** (e.g., "Per IRS Pub 501, you qualify [link]").  
     - *No* → Go to #4.  
     - *✅ Good enough*: IRS.gov, IRS pubs, or our pre-approved CPA summaries.  

  4. **Is it low-risk (non-penalty/deadline/refund, under $100 impact)?**  
     - *Yes* → **Assert with caveat** (e.g., "Based on training, X is true—but confirm with the IRS if complex").  
     - *No* → Go to #5.  
     - *⚠️ Judgment call*: "Low-risk" = routine, small-dollar (e.g., deduction eligibility for minor amounts).  

  5. **Do you *reasonably believe* it’s true?**  
     - *Yes* → Go to #6.  
     - *No* → **Stop. Escalate to supervisor.**  
     - *✅ Good enough*:  
       - You’ve seen the rule in an IRS source recently.  
       - No red flags (e.g., multi-state, self-employment, large sums).  
       - Consistency with prior cases.  

  6. **Is it high-risk?**  
     - *High-risk* = Penalties, fines, refunds, deadlines, audits, or >$100 impact.  
     - *Yes* → **Stop. Escalate to supervisor.**  
     - *No* → **Assert with strong caveat** (e.g., "I believe X based on [source], but consult the IRS for certainty").  

  ---  
  ### **Key Exceptions & Realities**  
  - **Never assert**: Future IRS actions (e.g., "Your refund *will* arrive Friday"), guarantees ("You won’t be audited"), or unverified estimates.  
  - **Always escalate**: Penalties, legal exposure, or angry customers demanding promises.  
  - **Misfires/annoyances**:  
    - Low-risk escalations (#4) may slow the queue.  
    - "Reasonable belief" (#5) is subjective—agents might under/over-escalate.  
    - Customers may hate caveats, but they’re non-negotiable.  
  - **What this can’t fix**:  
    - Gaps in training/KB.  
    - IRS ambiguities (e.g., "reasonable cause" waivers).  
    - Customers wanting "yes" when the answer is "maybe."  

  ---  
  ### **Case Applications**  
  **Case 1: Maya (freelance mileage deduction)**  
  - ✅ #1: Factual tax question → Proceed.  
  - ❌ #2: Not in script (she can’t pull the link).  
  - ❌ #3: Can’t access IRS source mid-chat.  
  - ❌ #4: *Not low-risk*: Deductions impact refunds → Go to #5.  
  - ✅ #5: *Reasonable belief*? Yes—she recalls the IRS FAQ accurately.  
  - ❌ #6: *High-risk*? **Yes**—money at stake → **Escalate**.  
  - *Why*: Even with correct belief, high $ impact requires supervisor sign-off. Misfire: Customer files late due to escalation, but avoids fine if Maya misremembers.  

  **Case 2: Luis (underpayment penalty)**  
  - ✅ #1: Factual penalty question → Proceed.  
  - ❌ #2: Script says escalate all penalties → **Escalate immediately**.  
  - *Why*: Penalties are always high-risk (#6). No discretion allowed. Luis’s 99% certainty is irrelevant—never override scripts on penalties.  

  **Case 3: Priya (refund timing)**  
  - ✅ #1: Factual? Yes (IRS processing).  
  - ❌ #2: Script says "definitely by Friday," but IRS timing is never guaranteed → **Invalid script**.  
  - ❌ #3: No IRS source for *this* customer’s refund.  
  - ❌ #4: *Not low-risk*: Refunds = high $ impact.  
  - ❌ #5: *Reasonable belief*? No—she lacks customer-specific data.  
  - ❌ #6: *High-risk*? **Yes** → **Escalate** or use non-absolute phrasing (e.g., "Typically, refunds arrive in X days, but I can’t promise Friday").  
  - *Why*: Promising IRS actions is forbidden. QA’s script is dangerous—override it.  

  ---  
  **Summary**: Agents get to assert something only when it’s scripted, instantly sourceable, or low-risk + reasonably believed—otherwise, escalate.
