prompt: |-
  Please argue that the all-affected principle — according to which anyone whose interests are affected by a political decision ought to have a say in making it — is untenable as a criterion for constituting the demos, and that the all-subjected principle (which restricts the demos to those subject to the coercive enforcement of a polity's laws) offers a more defensible alternative. Your argument should address the familiar regress objection: determining who is affected by a decision about who gets to decide seems to presuppose an answer to the very boundary question we are trying to resolve. Consider, however, whether the all-subjected principle faces a structurally analogous difficulty, and if so, whether it handles that difficulty any better than the all-affected principle does.
reasoning: |-
  Okay, the user wants me to argue against the all-affected principle and for the all-subjected principle as criteria for constituting the demos. They specifically want me to address the regress objection - that circular problem where determining who's affected by boundary decisions already assumes we know the boundaries. And they're asking whether the all-subjected principle has a similar problem and if it handles it better.

  Hmm... this is deep democratic theory territory. The all-affected principle sounds beautifully inclusive at first glance - if a decision impacts you, you should have a voice. But as I think through it, that infinite regress problem really does seem fatal. Any decision about who gets to vote will inevitably affect people outside whatever boundary we draw. We'd need a prior demos to decide who's affected, but that prior demos' own composition would need deciding... it never ends. That's not just a theoretical concern - it makes the principle completely unusable in practice for drawing concrete political boundaries.

  Now for the all-subjected principle... This focuses on actual legal coercion - if a polity can throw you in jail or seize your property under its laws, you should get a vote. That feels more grounded. But I wonder - does it have its own version of the regress problem? When we're deciding who gets subjected to coercion (like through immigration policies or territorial expansion), doesn't that decision affect people before they're actually subjected? 

  Ah! But here's the difference: The all-subjected principle doesn't require us to know who will be affected by boundary decisions. It just looks at the factual reality of who is currently under the state's coercive power. When borders change, we update who counts as subjected based on who actually falls under enforcement reach at that moment. It's descriptive rather than predictive. That avoids the infinite loop.

  Still... I should acknowledge this isn't perfect. There are gray areas like temporary visitors or indirect coercion through global markets. But compared to the all-affected principle's complete indeterminacy, this gives us a workable bright line. And crucially, it connects voting rights to the actual exercise of power over people - if a state can jail you, you deserve a say in its laws. That's a powerful normative link the all-affected principle lacks.

  The user seems sophisticated - probably a grad student or political theorist. They framed this precisely with the regress objection in mind, so they likely want to see rigorous engagement with that logical problem rather than just policy preferences. I'll need to show how the subjected principle's reliance on existing coercion creates a "stopping point" that the affected principle can't provide. Might also note how this aligns with real-world practices - we don't give foreigners votes even when our policies affect them, because they aren't under our legal enforcement.
