  ## The Case Against All-Affected and For All-Subjected in Demos Constitution

  The all-affected principle (AAP), while intuitively appealing due to its emphasis on fairness and inclusion, ultimately proves untenable as a primary criterion for constituting the *demos* (the body of citizens entitled to vote). Its fundamental flaw is its **inherent indeterminacy and vulnerability to the regress objection**, rendering it practically and theoretically incoherent. The all-subjected principle (ASP), focusing on those subject to a polity's coercive legal enforcement, offers a more defensible, stable, and normatively grounded alternative, even if it faces a *structurally distinct* challenge.

  ### The Fatal Regress Objection Against AAP
  1.  **The Core Problem:** The AAP states that anyone whose *interests* are affected by a decision should have a say in making it. However, the decision about *who constitutes the demos* is itself a fundamental political decision.
  2.  **The Infinite Regress:**
      *   To apply AAP to the boundary decision itself (Decision B: "Who gets to decide?"), we must first determine whose interests are *affected by Decision B*.
      *   But deciding *whose interests are affected by Decision B* is *itself* a political decision (Decision C: "Who is affected by the demos-defining decision?").
      *   Applying AAP consistently means Decision C must also include all those affected by *it*, requiring a prior Decision D to determine *that* demos, and so on *ad infinitum*.
  3.  **The Presupposition Paradox:** This regress reveals that AAP *presupposes an already-existing demos* to make the initial determination of who is affected. But the very point is to *define* that demos in the first place. AAP cannot bootstrap itself into existence without circularity or arbitrary closure.
  4.  **Indeterminacy of "Affected Interests":** The concept of "affected interests" is notoriously vague and expansive. Almost any significant policy (e.g., environmental regulations, trade deals, foreign policy) has diffuse, indirect, and potential effects on vast numbers of people globally. AAP offers no clear, non-arbitrary way to limit the scope of "affectedness," leading to either an impossibly large global demos for every decision or arbitrary thresholds that violate the principle's own logic.

  **AAP is thus fundamentally self-defeating when applied to the foundational question of demos constitution.** It demands an answer to the boundary question *before* it can be applied, creating an inescapable logical loop.

  ### The All-Subjected Principle (ASP) as a Defensible Alternative
  ASP asserts that the *demos* should consist of all those who are **subject to the coercive enforcement of a polity's laws.** This means those individuals over whom the state claims and exercises the authority to impose binding rules backed by force (e.g., arrest, fines, imprisonment, seizure of property).

  **Why ASP is More Defensible:**
  1.  **Addresses the Core Normative Justification for Political Participation:** The primary reason individuals deserve a say in a government is that it wields coercive power *over them*. ASP directly links the right to participate to the imposition of the most fundamental aspect of state power: the monopoly on legitimate coercion within a territory. If the state can jail you or seize your assets for violating its laws, justice demands you have a voice in making those laws.
  2.  **Greater Determinacy:** While not without edge cases, "subjected to coercive enforcement" is a significantly more objective and empirically verifiable criterion than "affected interests." It focuses on a concrete legal-political relationship: Is an individual physically present or legally resident within the jurisdiction where the state actively enforces its laws? This provides a relatively clear (though not perfectly sharp) boundary based on territorial jurisdiction and legal status.
  3.  **Avoids the AAP Regress (Partially):** ASP does *not* face the *identical* regress problem. Determining who is *currently* subject to a polity's coercive laws is a factual question about the *existing* exercise of state power and legal jurisdiction. It doesn't inherently require a prior political decision about boundaries *in the same way* AAP does for "affectedness."
      *   We can point to a person's physical presence/residence within a territory and the state's *de facto* enforcement capacity there as objective criteria.

  ### The Structurally Analogous Difficulty for ASP and Why it Handles it Better
  ASP *does* face a **structurally analogous but distinct boundary challenge:** Decisions about **the scope of jurisdiction itself** (e.g., annexing territory, changing immigration laws, extraterritorial application of laws) *do* affect who will *become* subjected to coercion in the future.

  1.  **The Challenge:** A decision *to extend* coercive jurisdiction (e.g., annexing a new territory) will clearly affect the people in that territory. If the *current* demos (defined by ASP based on *current* subjection) makes this decision, they are making a decision that fundamentally alters who will be subjected (and thus who *should be* in the future demos) without including those soon-to-be-subjected individuals.
  2.  **Why it's Different from AAP's Regress:**
      *   **Temporal Distinction:** ASP's challenge is about *future* subjection due to boundary *changes*. AAP's regress is about the *immediate* logical impossibility of applying the principle to the boundary decision *itself* without presupposition.
      *   **Factual Basis:** ASP has a stable, factual basis for the *current* demos ("Who is *now* subject?"). The challenge arises only when considering *changes* to that jurisdiction. AAP lacks stability even for the current moment.
      *   **Actionability:** ASP provides a clear rule: *Right now*, include those subjected *right now*. When jurisdiction changes, the demos *changes accordingly* to include the newly subjected. The decision *to change* jurisdiction is made by the demos defined by the *status quo ante* subjection. While imperfect (as it excludes those *about to be* subjected), it is a rule that can be consistently applied over time based on observable facts.
  3.  **Why ASP Handles it Better:**
      *   **Provides a Stopping Point:** ASP grounds the demos in an existing, verifiable relationship of coercion. This stops the infinite regress. The decision to *change* that relationship is made by those *currently* bearing its burdens and enjoying its benefits. This avoids the presupposition paradox.
      *   **Normative Coherence:** It's normatively coherent for those currently subject to coercion to decide the rules governing their own polity, including how its jurisdiction might evolve. While expanding jurisdiction without consulting the soon-to-be-subjected is problematic, it's less fundamentally incoherent than AAP's regress. Solutions like provisional representation or ratification referendums in annexed territories can be employed to mitigate this specific issue within the ASP framework.
      *   **Practical Workability:** ASP aligns much better with the reality of existing states defined by territorial jurisdiction. It provides a clear, stable, and actionable principle for determining political membership at any given time, even if boundary changes create transitional injustices.

  ### Conclusion
  The all-affected principle succumbs fatally to the regress objection, revealing its inherent indeterminacy and logical incoherence when applied to the foundational task of constituting the demos. Its reliance on the vague concept of "affected interests" offers no stable or non-arbitrary basis for drawing boundaries. The all-subjected principle, while facing an analogous challenge regarding decisions that *alter* jurisdictional boundaries, provides a significantly more defensible alternative. By grounding the demos in the concrete, normatively central relationship of being subject to a state's coercive legal power, ASP offers greater determinacy, avoids the fatal presupposition paradox of AAP, and provides a stable, actionable, and normatively coherent (though not flawless) basis for defining the political community. It connects the right to participate directly to the imposition of the state's most fundamental power, making it the superior criterion for resolving the boundary problem.
