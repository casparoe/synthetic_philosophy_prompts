  So Fitch's paradox has me stuck and I wanna put a number on it. Take the claim that every truth is knowable in principle by someone at some point — like even the exact temp in my garage at 3am last night that nobody measured. Whats your credence thats actually true given the whole if its knowable then its known arguement? Give me a number but break it down, like how likely the proof itself holds up, how likely we can save knowability by restricting it to non-tricky sentences vs just giving it up, plus anything else you think matters, with rough numbers that combine to the final. And tell me which piece moves the total most and what would change your mind.
