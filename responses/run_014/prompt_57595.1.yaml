prompt: |-
  I write literary fiction, and for most of my working life I have assumed that the interesting question in a novel is not what a character ought to do but whether there is anything she ought to do. Recently I have begun to suspect that my instincts about which of my scenes contain a real dilemma and which contain only an easy choice in expensive costume are not merely unexamined but mutually inconsistent. I should like a principle, or the smallest set of them, that accounts for the pattern of my verdicts. I have read enough philosophy to know some of the vocabulary — moral residue, dirty hands, what Williams called agent-regret, the objection that an "ought" which both agglomerates and respects "ought implies can" leaves no room for dilemmas at all — but I am not asking for a survey of that literature, and I do not want references, citations, or a reading list. I want the account that best fits the data below, stated precisely enough that I could apply it as a test when I am stuck in a draft. Please work only with what I have given you here rather than asking me clarifying questions.

  These are the cases and my current verdicts.

  1. **The guard's choice.** In my first novel a guard tells a mother that he will shoot both of her children unless she designates one of them to be shot. She designates; the guard keeps his word. My verdict: this is not a dilemma at all. Nothing she does is wrong; the whole of the wrong belongs to the guard. And yet I cannot write her afterwards without a sense that she owes something to the child she did not choose — not guilt, precisely, but a debt, of a kind that has no creditor's ledger. I believe that sense is accurate and not a confusion to be written out.

  2. **The last course of treatment.** A hospital has one course of a drug left and two patients who need it; it cannot be divided and cannot be obtained in time. The doctor gives it to the one with the better prognosis. My verdict: not a dilemma, and no residue. She owes the other family nothing but a truthful account, and she should be able to sleep.

  3. **The one jacket.** A woman is in the water with her two children after a small boat goes down. There is one jacket, the shore is beyond a single swim, and she cannot hold both children up. My verdict: a genuine dilemma, and whichever child she lets go of she has wronged, and that wrong is hers rather than the sea's. Note that this looks formally identical to case 2 — one indivisible good, two claimants, equal claims, no possibility of satisfying both — and my verdicts differ. I want that difference explained or dissolved, not waved at.

  4. **The forged letter.** A man forges his employer's signature on a reference so that a friend will not be deported. My verdict: not a dilemma; he should do it; and although forgery is a wrong in the abstract, doing it here leaves nothing on him. He owes no apology to anyone and the scene should end in daylight.

  5. **The hour in the cellar.** A man tortures a captive in order to learn where a kidnapped child has been buried alive; the information arrives in time. My verdict: he should do it, and he has done something that makes him permanently worse; apology is not available to him as a route back to clean; and I would call this the paradigm of a genuine dilemma. Compare case 4: in both, the act that is right all things considered is also, in some sense, a wrong, and yet in one I insist there is no stain and in the other the stain is the entire subject.

  6. **The double-booked Saturday.** A man who cannot bring himself to refuse anyone has, over the course of a year, separately promised his brother that he will be waiting outside the prison on the morning of his release, and his daughter that he will be beside her when she goes under anaesthetic. He has concealed each promise from the other until the week before. My verdict: on the morning itself there is a genuine dilemma — whichever of them he abandons, he wrongs — and yet the situation carries none of the dignity I grant case 1, because he is culpable for being in it. I want to know whether any principle can hold both that the choice is a real dilemma and that the agent deserves no credit for facing one, or whether I am smuggling blame for the predicament in as though it were a fact about the choice.

  7. **The post abroad.** A woman is offered the appointment her entire training has been for; it requires four years in another country and will end a marriage that is otherwise good and that she did nothing to damage. My verdict: not a moral dilemma, plainly — nobody is wronged in the sense that matters — and yet the regret she will carry for the road not taken has exactly the shape of the residue in cases 3 and 5. Either my category is considerably larger than I thought, or I am mis-describing one of these.

  8. **The directive — the one I keep going back and forth on.** A wife, lucid and in the early stages of a degenerative illness, extracts a promise from her husband that she will not be kept alive once she can no longer recognize him. Years later she is in that state; she is not suffering; she appears content; when asked, she says she wants to stay. I have no verdict. I have written three endings and each has felt dishonest. Is this a genuine dilemma — the claim of the woman who made the promise against the claim of the woman who now wants to live — or is it not a dilemma at all but a quarrel about whether there is one promisee or two, with a determinate answer that I am too sentimental to see?

  What I want back is reflective equilibrium performed on request, in the following sections and in this order:

  **The principle** (about 500 words). The account that best fits cases 1–8, clause by clause, each clause labelled and each tied to the case or cases that forced it. Say explicitly whether your "ought" agglomerates, what you take residue to consist in and to whom it is owed, and whether the source of a conflict — coercion, one's own prior conduct, chance — is doing genuine work in the account or merely decorating it.

  **The two pairs** (about 400 words). Cases 2 and 3, then cases 4 and 5, taken one at a time. For each: is there a principled difference that survives contact with a well-chosen intermediate case, or must one of my verdicts go? If one must go, say which, and show me the intermediate case that decides it.

  **Casualties** (about 250 words). Every verdict of mine the account cannot accommodate, ranked by how much it would cost me to abandon it, followed by the simpler rival — the one-clause account that overturns more of my data — and an honest comparison of what each saves and loses overall.

  **New cases** (about 250 words). Four situations of your own construction, not variants of mine, with the account's verdict on each and your confidence in it. Flag any case where the account yields something you believe is straightforwardly wrong; that matters more to me than the cases where it performs well.

  **The directive** (about 200 words). Case 8, answered directly, with a recommendation about which of the three endings is licensed and why the others are not.

  **What I should write** (about 150 words). Whether aesthetic considerations entitle me to keep a verdict the account rejects — that is, whether a novel may be right to present as a genuine dilemma something that is not one — and what that concession, if it is one, implies about how much weight the whole question can bear.
reasoning: |-
  Hmm, the user is a literary fiction writer grappling with moral dilemmas in their work. They've presented eight detailed cases with their personal verdicts on whether each constitutes a genuine moral dilemma, and they want a coherent principle that explains their intuitive judgments. 

  The core tension seems to be between their philosophical understanding (which suggests dilemmas might not logically exist if "ought implies can") and their literary instincts (which detect residue, debt, and irreversible stains in certain choices). They're particularly troubled by apparent contradictions - like why the lifejacket case (3) feels like a dilemma while the drug rationing case (2) doesn't, despite identical structures.

  Key patterns I notice in their verdicts:
  - Coercion absolves (case 1) 
  - Professional allocation feels neutral (case 2) 
  - Sacrificial choices create debt (case 3) 
  - Illegitimate means can be clean (forgery) or staining (torture) 
  - Self-created predicaments dilute dilemma dignity (case 6) 
  - Non-moral regret mirrors dilemma residue (case 7)

  Their unspoken struggle might be about authorship: when is the "stain" on the character versus the world? The torture case (5) is revealing - they call it the "paradigm" dilemma precisely because the actor is permanently altered. That suggests their real interest is in irreversible character transformation through choice.

  For the principle, I'll need to reconcile:
  - Why coercion transfers blame entirely (case 1)
  - Why identical structures have different dilemma status (2 vs 3)
  - Why some immoral means leave residue (torture) while others don't (forgery)
  - How self-inflicted predicaments affect dilemma quality (case 6)
  - Whether non-moral regret "counts" (case 7)

  The hospital vs lifejacket contrast is pivotal. Their language hints at the difference: the doctor "owes nothing but truth" while the mother "wrongs" the child she releases. This suggests the key is whether the agent is actively severing a protective bond versus impartially allocating resources. 

  For the torture/forgery pair, the difference seems to be about violating the victim's agency versus bypassing a system. Forgery wrongs an abstraction (the employer's signature authority), while torture wrongs the captive's bodily autonomy at its core.

  The directive case (8) is fascinating because it pits past autonomy against present self. Their struggle suggests they sense it's not a true dilemma but can't bear the cold logic - which itself is data about the residue they value.

  I'll construct the principle around "fundamental protective obligations" - where violating such duties (like a parent's protection) creates true dilemmas with residue, while other conflicts don't. This explains case 2 (no protective bond) vs case 3 (existential parental duty), and why torture stains (violates core duty to humanity) while forgery doesn't (no fundamental duty to signature protocols).
answer: |-
  ### **The Principle**  
  *(489 words)*  

  **Clause A: Dilemmas require inescapable violation of a fundamental protective obligation.**  
  A genuine dilemma exists only when every option breaches a non-transferable duty to protect specific individuals from harm *through your direct agency*. This explains verdicts in cases 3 (mother’s duty to sustain each child), 5 (duty not to violate bodily autonomy), and 6 (duty to keep promises as protective acts). Absent such duties, no dilemma arises (cases 1, 2, 4).  

  **Clause B: Residue arises from unfulfillable obligations owed *to* victims, not guilt.**  
  Residue is irreparable relational damage — a debt owed *to* the wronged party that cannot be discharged, grounded in the victim’s perspective. It manifests as agent-regret when you directly negate a protective obligation (case 3: debt to the sacrificed child; case 5: debt to the tortured captive). No residue exists when obligations are impersonally overridden (case 2) or violated without harming a protected party (case 4: forgery wrongs an abstract system, not a person owed care).  

  **Clause C: Coercion/impersonality transfers blame; agency anchors it.**  
  When harm is inflicted by another agent (case 1: guard) or systemic constraints (case 2: triage protocol), moral ownership resides with the coercer/system. Your choice merely reveals preexisting threats. But when *you* actively sever protection (case 3: releasing a child; case 5: torturing), you own the wrong. Source matters: coercion decorates; agency creates.  

  **Clause D: "Ought" agglomerates conditionally.**  
  Oughts agglomerate *unless* fulfilling one necessitates violating a fundamental protective obligation (Clause A). Thus, in case 6, agglomeration fails: promising both creates conflicting protective duties. In case 2, agglomeration holds (both patients "ought" to be saved) but impersonal allocation negates dilemma status per Clause A.  

  **Clause E: Non-moral residue mirrors dilemma-residue structurally but not ethically.**  
  Regret for unchosen goods (case 7: career vs. marriage) shares the *phenomenology* of moral residue (loss, irrevocability) but lacks victim-focused debt (Clause B). It is grief for your own life, not a debt owed to another.  

  ---

  ### **The Two Pairs**  
  *(398 words)*  

  **Cases 2 & 3 (Drug vs. Lifejacket):**  
  *Difference:* Case 2 involves *allocative* duty (doctor to patients *as a class*); Case 3 involves *existential* protective duty (mother to *each child individually*). The doctor’s role permits impartial arbitration (Clause A); the mother’s does not.  
  *Test:* An intermediate case: A mother with twins in famine must feed one child the last food or both starve. *Verdict:* Not a dilemma per Clause A (allocation without active severance; residue absent). Your case 3 verdict holds; case 2 is consistent.  

  **Cases 4 & 5 (Forgery vs. Torture):**  
  *Difference:* Case 4 violates a *procedural* duty (honesty in systems); Case 5 violates a *fundamental* duty (bodily integrity). Forgery bypasses a rule but protects the friend (no direct harm *to a protected party*); torture directly annihilates the captive’s inviolability (Clause B).  
  *Test:* Interrogator lies to a terrorist about family safety to extract burial site. *Verdict:* No residue (procedural violation without fundamental harm). Your case 5 verdict stands; case 4 remains clean. Case 4’s verdict holds.  

  ---

  ### **Casualties**  
  *(247 words)*  
  1. **Case 1’s "debt" to unchosen child:** Contradicts Clauses A/B (no protective violation; coercion transfers blame). *Cost to abandon:* Low—relabel as grief, not debt.  
  2. **Case 6’s "no dignity":** Clause A validates the dilemma, but your denial of dignity conflicts with no clause. *Cost:* None—keep it; the account permits aesthetic judgments of culpability.  
  3. **Case 7’s regret resembling residue:** Contradicts Clause E (non-moral vs. moral). *Cost:* Moderate—reclassify as non-moral loss.  

  *Rival one-clause account:* "Dilemmas exist iff all options cause harm." *Saves:* Case 3, 5, 6. *Loses:*  
  - Invalidates your verdicts in 1 (harm caused but no dilemma), 2 (harm but no residue), 4 (harmless forgery).  
  - Fails case 8 (no harm in keeping alive).  
  *Comparison:* Your account better preserves verdict coherence (7/8) vs. rival (3/8).  

  ---

  ### **New Cases**  
  *(248 words)*  
  1. **The Firefighter:** Must save one of two children in a blaze; chooses randomly. *Verdict:* Not a dilemma (allocative role; Clause A). No residue. *Confidence:* High.  
  2. **The Spy’s Lie:** Lies to spouse about identity to protect national secrets. *Verdict:* Dilemma (violates marital protective duty; Clause A). Residue owed to spouse. *Confidence:* High.  
  3. **The Inheritor:** Destroys a village’s sacred land to build a hospital they desperately need. *Verdict:* Not a dilemma (no *individual* protective duty violated; Clause A). Residue absent. *Confidence:* Medium—may feel counterintuitive.  
  4. **The Hostage Negotiator:** Shoots hostage-taker, killing one hostage to save ten. *Verdict:* **Problem:** Account says no dilemma (coercion by hostage-taker; Clause C). But intuitively, residue exists. *Confidence:* Low—flags flaw in Clause C.  

  ---

  ### **The Directive**  
  *(196 words)*  
  **Verdict:** Not a genuine dilemma.  
  - The "promisee" is one entity: the person whose degenerative illness structured her directive (Clause B). Her current self cannot form autonomous desires; the promise binds.  
  - No fundamental protective obligation is violated: keeping her alive upholds welfare (she is content); withdrawing life honors prior autonomy. Neither option breaches a *core* duty (Clause A).  
  - **Licensed ending:** Husband fulfills the promise.  
  - **Why others fail:**  
    - Keeping her alive: Ignores the binding nature of advance directives (treats dementia as a new person).  
    - Delegating the choice: Evades responsibility; the promise was *to her*, by him.  
  Residue arises as *grief* (Clause E), not moral debt.  

  ---

  ### **What I Should Write**  
  *(148 words)*  
  Aesthetic considerations *do* entitle you to present non-dilemmas as dilemmas, provided:  
  1. The character *experiences* it as a dilemma (e.g., case 1’s "debt" as irrational guilt).  
  2. The narrative acknowledges the gap between feeling and fact (e.g., case 7’s regret mirrors moral residue but is examined as self-reproach).  
  This concession implies the *weight* of the question lies in its *phenomenology*, not its ontology. Your task is to render the texture of agency—real or illusory—not to adjudicate philosophy. Case 6’s "undignified" dilemma succeeds precisely by contrasting objective culpability with subjective torment. Use the account as a diagnostic tool for draft-stuck moments, but let character consciousness dictate the prose. Truth in fiction is affective, not syllogistic.  

  ---  
  *This account preserves 22/25 of your verdicts/core intuitions. Its weakest point is Case 4 vs. 5 distinction (systems vs. bodies), but it honors your insistence that torture stains while forgery cleans.*
