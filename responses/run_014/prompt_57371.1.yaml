prompt: |-
  I teach a first-year seminar, 24 students, 75 minutes, and they've only known each other a few weeks so the social stakes are still weirdly high. This week's theme is whether we can tell if someone arguing against us is playing straight. I don't want a discussion — I want a game they play first and name afterwards.

  The thing I actually want them to feel: in public argument people collapse two seperate questions into one. Is this argument any good? And is this person sincere? Those come apart in both directions — an honest person can argue terribly, and someone playing for keeps can make a genuinely good point. And I think something worse happens once you start motive-hunting: you get worse at reading the argument itself, and the hunt becomes unfalsifiable, because whatever the other person says next gets re-read as further evidence of bad faith, including their denial. I want them inside that loop, ideally once as the hunter and once as the hunted.

  One mechanic I already like, which you can build on or throw out: split the room in half, hand both halves the same set of written arguments, tell one half that every author is sincere and the other half that some fixed number of them are secretly arguing against their own views, then have each half steelman the arguments in writing and compare. My hunch is the suspicious half writes worse steelmen. If that's a bad hunch, say so and give me a better version of the same idea.

  Then I need: full rules and roles, a minute-by-minute timeline, a payoff scheme that costs me nothing (no money, no candy budget — social stakes are fine), a materials list including whatever I have to prep the night before, and a debrief that maps specific moments from the run onto the argument-quality/arguer-sincerity split and onto the unfalsifiability loop.

  Also tell me what will predictably break the first time I run it, including what to do if a student gets genuinely stung at being accused of bad faith, and whether I should keep the debate topics anodyne (parking, campus funding) or let them pick something they actually care about. And be frank about which part of real-world good-faith judgment the game can't reproduce and I'll have to supply myself. It should scale down to 14 if people are absent.
reasoning: |-
  Okay, the user teaches a first-year seminar with 24 students. They want a game to help students understand how sincerity and argument quality are separate. The key is making students experience both sides: being suspicious of others and being suspected themselves. 

  The user mentioned a mechanic where groups are told different things about the arguments' sincerity. Their hunch is that the suspicious group will write worse steelmen. Need to validate that idea. Yeah, it makes sense—distrust can cloud judgment. But how to make it more interactive? Maybe add a role-play element where students argue face-to-face. That could heighten the social stakes, which are already high since they're new to each other.

  The user wants students to feel the unfalsifiable loop of motive-hunting. So after the initial steelman exercise, adding a debate where one side is secretly insincere could work. Then, the accused might try to defend themselves, but the suspicion persists. That mirrors real life where denying bad faith is seen as further proof.

  Need to consider materials. Prep involves writing argument cards on neutral topics. Parking or campus funding are safe, but maybe let students pick? The user asked about this. Neutral is better to avoid emotional reactions. Also, scaling down to 14 is necessary. The game should be flexible in group sizes.

  Risk of students getting genuinely upset. The debrief is crucial here. Emphasize it's a simulation. Warn them beforehand that roles are assigned. Have a clear opt-out. Also, in the debrief, highlight moments where suspicion affected judgment. Use examples from their interactions to point out the unfalsifiability loop.

  The user wants a minute-by-minute timeline. Allocate time for setup, rounds, and debrief. Keep each segment tight. Maybe 15 min for steelman, 15 for debates, etc. Debrief should connect game experiences to the concepts. Point out when arguments were dismissed due to perceived insincerity, regardless of quality.

  What can't the game replicate? Real-world consequences. The game is low-stakes; in reality, trust issues can damage relationships. Also, students might not fully commit to their roles. The debrief needs to bridge that gap by linking to real examples they might encounter.

  Predictable breaks: Students might not engage, or the insincere arguer slips up. Have backup prompts. If someone gets upset, pause and address it, reaffirming the learning goal. Maybe have a signal for discomfort. Also, groups might finish steelmen at different times—have extension questions ready.

  Structure the game into phases: Steelman exercise, then debates with assigned suspicion. Use the initial steelman to set up the suspicion dynamic. The comparison shows how suspicion weakens steelman quality. Then debates make the unfalsifiable loop personal. Debrief by asking each side about their experience, highlighting the separation of sincerity and argument quality.
answer: |-
  Here’s a complete game plan tailored to your goals, with mechanics designed to expose the sincerity/quality split and the unfalsifiability loop. It builds on your steelman idea but adds critical interaction and role-playing phases.

  **Game Name:** Motive Maze  
  **Core Insight:** Separating argument quality from arguer sincerity is hard; suspicion creates self-reinforcing loops that degrade discourse.  
  **Time:** 75 mins (scalable to 14)  
  **Materials:**  
  - 12 "Argument Cards" (prepped night before)  
  - 12 "Role Cards" (for Debate Phase)  
  - Timer  
  - Whiteboard/flip chart for debrief notes  

  ---

  ### **Phase 1: Steelman Suspicion (20 mins)**  
  *(Your core mechanic, refined)*  

  1. **Prep (Night Before):**  
     - Create 12 identical **Argument Cards** (1 per pair). Use **anodyne topics** (e.g., *"First-year students should have reserved parking," "Campus funding should prioritize sports over libraries"*). Avoid charged topics—students will inject their own stakes later.  
     - Write 2–3 sentences per argument. Make them *deliberately mediocre*: logical but with weak evidence, or strong but with one flaw.  

  2. **Setup (5 mins):**  
     - Split class into Group A (12) and Group B (12).  
     - **Group A Instructions (Quietly):** *"Every argument you see is sincerely held by the author. Your job: write the BEST possible version of each argument (steelman it)."*  
     - **Group B Instructions (Quietly):** *"AT LEAST 4 of these arguments are made by people secretly arguing AGAINST their own view (they’re insincere). Your job: write a steelman, BUT stay alert for signs of bad faith."*  
     *(Actually, ALL are sincere—deceive Group B to induce suspicion.)*  

  3. **Activity (15 mins):**  
     - Pairs in each group get 1 Argument Card.  
     - Pairs write a 3-sentence steelman together.  

  ---

  ### **Phase 2: Suspicion Swap (20 mins)**  
  *(Role-play to experience both sides of the loop)*  

  1. **Prep:** Create 12 **Role Cards**:  
     - 6x **"Sincere"** (*"Argue honestly for this position. You genuinely believe it."*)  
     - 6x **"Insincere"** (*"Argue AGAINST your real view. Secret goal: make your opponent doubt your sincerity."*)  
     *(Assign Roles AFTER pairs disband to avoid collusion.)*  

  2. **Setup (5 mins):**  
     - Re-pair students: 1 from Group A + 1 from Group B.  
     - Give each pair a **new topic** (e.g., *"All classes should be recorded," "Tuition should include gym access"*).  
     - Privately hand each student a **Role Card** (50/50 Sincere/Insincere per pair).  

  3. **Debates (15 mins):**  
     - Each pair debates their topic (7 mins each side).  
     - **Secret Task for All:** *"After your debate, write PRIVATELY: Was your partner sincere? What made you think so?"*  

  ---

  ### **Phase 3: The Reveal & Debrief (35 mins)**  
  *(Map experiences onto your core concepts)*  

  1. **Steelman Comparison (10 mins):**  
     - Display 1–2 original arguments. Have Group A and Group B read their steelmans.  
     - **Ask:** *"Which steelman is stronger? Why?"* (Usually, Group B’s are weaker/distorted by suspicion).  
     - **Reveal Trick:** *"Actually, ALL authors were sincere. Group B was misled to be suspicious."*  
     - **Key Q:** *"How did suspicion change how you interpreted the arguments?"*  

  2. **Debate Reactions (10 mins):**  
     - Ask students to share their **private notes** on partner sincerity (anonymously if needed).  
     - **Reveal:** *"Half of you were assigned 'insincere' roles."*  
     - **Ask:**  
       - Insincere players: *"What tactics did you use to seem suspicious? Did your partner call you out?"*  
       - Sincere players: *"If accused, how did you prove sincerity? Did it work?"*  
     - Highlight: *"How did your prior role (Group A/B) affect your suspicion?"*  

  3. **Concept Mapping (15 mins):**  
     Use whiteboard to draw:  
     - **TWO CIRCLES:** "Argument Quality" / "Arguer Sincerity".  
     - **ARROWS:**  
       - *"Group B: Suspicion → Distorted Steelman (Quality ignored)"*  
       - *"Debates: Accusation → Denial → Stronger Suspicion (Unfalsifiable Loop)"*  
     - **Ask:**  
       - *"When did you conflate quality and sincerity? Give examples."*  
       - *"Did ANYONE successfully prove their sincerity? How?"* (Usually: no—denial fuels suspicion).  
       - *"What happens to argument quality once motive-hunting starts?"*  

  ---

  ### **Payoff Scheme**  
  - **Social Capital:** Winners (best steelman/debaters) get applause; "Most Trustworthy" award (student-voted).  
  - **Insight Currency:** Frame revelations as "tools" for future debates.  

  ---

  ### **Predictable Breaks & Fixes**  
  1. **Problem:** Student stung by bad-faith accusation.  
     - **Fix:** Pre-game warning: *"Roles are RANDOM. This is about patterns, not personal attacks."* Debrief early: *"Accusations in-game ≠ real judgment."* If upset, validate: *"This feels crappy? That’s the point—real motive-hunting hurts."*  

  2. **Problem:** "Insincere" debater slips up or refuses to engage.  
     - **Fix:** Assign topics they’re neutral on. Prep "tactics" for insincere roles (e.g., *"Use over-the-top language," "Strawman your own view"*).  

  3. **Problem:** Group B doesn’t distort steelmans (your hunch fails).  
     - **Fix:** In debrief, contrast Group B’s *focus* ("I looked for flaws in the person") vs. Group A’s ("I fixed flaws in the argument").  

  4. **Scaling to 14:**  
     - Group A: 7, Group B: 7. Use 7 Argument Cards (1/pair). Debates: 7 pairs.  

  ---

  ### **What the Game Can’t Do (Supply This Yourself)**  
  - **Real Stakes:** In life, sincerity judgments damage relationships/careers. Say: *"Here, you leave as classmates. Imagine if this was your boss or community."*  
  - **Time Decay:** Real motive-hunting persists for weeks. Note: *"One denial rarely breaks the loop—it takes repeated evidence."*  
  - **Power Dynamics:** Suspecting someone with authority over you is riskier. Discuss briefly if relevant.  

  **Final Tip:** Run Phase 2 debates as "fishbowl style" (a few pairs debate while others watch) if energy lags. The combination of written analysis + live role-play makes the abstraction visceral—students *feel* the loop when their sincere denials get dismissed.
