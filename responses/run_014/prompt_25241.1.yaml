  The tensions part is crucial. I recall Gaskin vs. King on whether compositionality conflicts with non-well-founded structures. Also, realism about propositions often clashes with non-existent entities. And universality? That’s a killer—many theories handle atomic propositions but fail on negation or quantification.  

