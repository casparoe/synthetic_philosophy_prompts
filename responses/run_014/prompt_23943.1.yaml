  Also, note that the collective defeat and belief-acceptance separation both avoid the paradox by not forming the individual beliefs, but for different reasons.

  We can also note that the threshold view is a way to form the individual beliefs and avoid the conjunction without rejecting closure entirely (but modifying it). The closure-rejecter rejects closure without necessarily having a threshold.

  We are missing a leaf for the view that the evidence does not support the conjunction? But that is already inherent: we don't believe the conjunction because it is improbable. The issue is how to reconcile that with the individual beliefs and closure.

