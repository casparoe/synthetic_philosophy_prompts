  - In the threshold view, not rejecting closure (4: No): untenable.
  - In the non-threshold fallibilism, believing the individuals and the conjunction: untenable (7: Yes).
  - In the non-threshold fallibilism, believing the individuals, not the conjunction, but not rejecting closure (8: No): untenable.

  Flag: The threshold view and the closure-rejecter both reject the standard closure principle, but in different ways. The threshold view replaces it with a conditional closure (based on the threshold), while the closure-rejecter might reject it entirely without a threshold condition. Our tree separates them by the threshold commitment.

  Also, note that the collective defeat view and the belief-acceptance separation view both avoid forming the individual beliefs, but for different reasons. Collective defeat is specific to the lottery structure, while belief-acceptance separation is a general claim about the attitude formed by high probability.

