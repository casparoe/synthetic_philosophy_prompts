  Considering the objections, self-locating uncertainty is a major hurdle. If that's resolved, credence would jump. Also, circularity in axioms is another big one. The combined number is most sensitive to (b) and (a). Evidence that could move it: a clear account of pre-branching uncertainty without probabilistic assumptions would boost (b). For (a), showing that non-contextuality doesn't imply Born rule.

