prompt: |-
  I'm trying to get clear on what we should even want from a theory of how to act under consequentialist cluelessness — the problem that the long-run downstream consequences of our actions are radically unpredictable, so the consequentialist calculus seems to break down before it gets started. By "cluelessness" I mean the phenomenon pressed in a now-familiar line of argument: when I choose a career, or decide whether to have a child, or pick what to eat for lunch, the ripple effects propagate through an unknowably complex causal network, and I have no idea whether the net consequences centuries out are positive or negative. If consequentialism tells me to maximize expected value over all consequences, but I cannot form any justified expectation about the sign, let alone the magnitude, of those consequences once the causal chain goes long enough, then the theory seems to give me nothing to go on.

  Before I evaluate any particular proposal — expected value with a temporal discount, satisficing, robust-choosing, rights as side-constraints on the consequentialist framework, cause-prioritization heuristics, and so on — I want the full specification of what such a theory has to deliver.

  Write the desiderata: what any adequate theory of decision-making under cluelessness must get right, which cases it must handle, which distinctions it cannot collapse, and which results from decision theory or moral philosophy it must remain consistent with. For each requirement, give the case or consideration that motivates it. Flag any pair of desiderata you suspect cannot be jointly satisfied — that is the part I most want to see. Then, briefly, how the main families of response fare against the list.

  Some things I particularly want addressed: the distinction between cluelessness that is merely epistemic (we could in principle know if we had better models) and cluelessness that is in-principle (chaotic amplification, butterfly effects, non-computability); whether a theory must give action-guidance in every case or can sometimes say "no determinate answer" without collapsing into nihilism; whether the theory must respect the original consequentialist motivation — that consequences are what matter — or can revise that commitment beyond recognition and still count as addressing the problem rather than abandoning consequentialism; and whether the theory must handle all sources of cluelessness uniformly or can treat different sources (causal complexity, value-uncertainty, non-identity of future people) differently.
reasoning: |-
  Okay, the user is diving deep into the problem of consequentialist cluelessness—how to make decisions when long-term consequences are unpredictable. They want a clear set of criteria for evaluating any theory addressing this. Let me start by breaking down their main concerns. 

  First, they mention the distinction between epistemic and in-principle cluelessness. That's crucial because each type might require a different approach. If cluelessness is just about lacking data, better models could help. But chaotic systems or non-computability imply fundamental limits. Any theory must handle both without oversimplifying.

  Next, they worry about action-guidance versus nihilism. Consequentialism traditionally demands maximizing expected value, but cluelessness makes that impossible. The user is probably frustrated with theories that either give arbitrary answers or throw hands up. They need a middle ground—acknowledging uncertainty without paralysis. 

  Then there's the tension between staying true to consequentialism versus revising it. The user seems committed to consequentialist ethics but recognizes its flaws here. They might fear that proposed solutions (like side-constraints) abandon core principles. A theory must navigate this: tweak without gutting consequentialism. 

  They also mention handling different cluelessness sources uniformly. Causal complexity, value uncertainty, and non-identity problems are distinct. Bundling them might mask unique challenges. For example, non-identity issues involve moral ontology—whether future people's existence depends on present choices. A one-size-fits-all solution could fail here. 

  Now, the user's deeper needs. They're likely seeking coherence in moral decision-making amidst uncertainty. Academic? Maybe a philosopher or grad student wrestling with real-world applications. Their examples—careers, children, lunch—suggest they want practical guidance, not just theory. They might be building a framework for their work or teaching. 

  Unspoken needs: reassurance that consequentialism isn't doomed. The cluelessness problem can feel like a knockout punch. They need hope—viable solutions exist. Also, clarity on trade-offs. No theory satisfies all desiderata; they want to know which compromises are acceptable. 

  Finally, flagging conflicting desiderata is key. For instance, demanding precise action-guidance might clash with avoiding arbitrariness. Or preserving pure consequentialism might conflict with needing decision rules. Highlighting these tensions meets their explicit request and addresses implicit anxiety about unsolvable dilemmas. 

  I’ll structure the response around these points, ensuring each user concern is mapped to a desideratum. The conflicts section will be pivotal—showing why no theory is perfect but some manage tensions better. Real-world examples will ground it. And I’ll assess approaches honestly: robust satisficing handles some clashes; discounting creates others. The conclusion will validate their struggle while offering paths forward.
answer: |-
  Here’s a rigorous specification of desiderata for a theory of decision-making under consequentialist cluelessness, motivated by core challenges and your specified concerns. I’ll flag tensions and evaluate major approaches.

  **Core Desiderata for an Adequate Theory:**

  1.  **Action-Guidance Requirement (AGR):** *Must provide practical, non-arbitrary guidance for paradigmatic clueless choices* (e.g., career choice, procreation, dietary choices with long chains).
      *   **Motivation:** Without guidance, the theory is practically useless and collapses into paralysis/nihilism. Consequentialism traditionally promises action-direction.
      *   **Challenge:** Must avoid *false precision* – guidance shouldn't mask ignorance.

  2.  **Epistemic Humility Requirement (EHR):** *Must explicitly acknowledge and respect deep uncertainty about long-term consequences.* Cannot pretend ignorance doesn't exist or assume away butterfly effects/chaos.
      *   **Motivation:** The core problem is radical unpredictability. A theory ignoring this misrepresents reality.

  3.  **Consequentialist Fidelity Requirement (CFR):** *Must retain "consequences matter fundamentally" as the core justificatory principle.* Solutions should be *internal* adjustments or reinterpretations of consequentialism.
      *   **Motivation:** Otherwise, it abandons consequentialism rather than solving its problem (e.g., adopting pure deontology isn't a solution *to* cluelessness *within* consequentialism).
      *   **Boundary:** Can reinterpret "consequences" (e.g., focus on causal channels) or "value" (e.g., risk attitudes), but not make *non*-consequential features (like inherent rights) fundamental justifiers.

  4.  **Source Sensitivity Requirement (SSR):** *Must distinguish or adequately handle different sources of cluelessness:*
      *   **Epistemic (E):** Lack of data/computational power *in principle* resolvable.
      *   **In-Principle (IP):** Chaos, non-computability, irreducible complexity.
      *   **Value Uncertainty (VU):** Uncertainty about *what* is valuable long-term.
      *   **Non-Identity (NI):** Future individuals' existence depends on current choices, complicating value aggregation.
      *   **Motivation:** These pose distinct challenges (e.g., IP & NI might be harder; VU impacts the *content* of consequences). A uniform solution may fail for some sources.

  5.  **Avoidance of Arbitrary Thresholds/Prioritization (ATP):** *Must avoid solutions that rely on essentially arbitrary cut-offs (e.g., temporal discount rates, satisficing levels) or prioritizations (e.g., "near effects always dominate") without strong justification.*
      *   **Motivation:** Arbitrariness undermines normative force. Why discount at 1%/year vs. 0.1%? Why satisfice at "good enough" rather than "slightly better"?

  6.  **Robustness Requirement (RR):** *Recommendations should be reasonably robust across plausible models of uncertainty and value.* Shouldn't flip-flop wildly under minor epistemic shifts.
      *   **Motivation:** Given deep uncertainty, we need strategies that are likely okay even if our specific probability/utility assignments are wrong.

  7.  **Consistency with Core Decision Theory (CDT):** *Must remain consistent with uncontroversial axioms of rational choice under uncertainty when uncertainty is manageable* (e.g., dominance, sure-thing principle when applicable).
      *   **Motivation:** The theory shouldn't violate basic rationality in *non*-clueless cases. It should generalize standard decision theory.

  8.  **Non-Collapse Requirement (NCR):** *Must not collapse distinctions between clearly different actions/types of actions under typical cluelessness.*
      *   **Motivation:** E.g., Should distinguish between donating to AMF (clear short-term good, uncertain long-term) vs. starting a nuclear war (clear short-term catastrophe, uncertain long-term). Or between having 0 vs. 10 children. A theory saying "all actions are equally clueless, do anything" fails.

  9.  **Handling Normative Gaps (HNG):** *Must specify when/if "no determinate answer" is permissible without collapsing into full nihilism.*
      *   **Motivation:** Sometimes, true cluelessness might mean multiple actions are permissible (no uniquely rational choice). The theory needs a coherent account of this.

  **Flagged Tensions (Likely Irreconcilable Desiderata Pairs):**

  1.  **AGR (Action Guidance) vs. EHR/ATP (Humility/Avoiding Arbitrariness):**
      *   **Conflict:** Providing specific guidance *requires* injecting *some* structure or assumption to break the symmetry of ignorance. But this structure (a discount rate, a satisficing level, a robustness criterion) risks being arbitrary (violating ATP) or masking true uncertainty (violating EHR). How to guide without pretending to know the unknowable or picking rules arbitrarily?
      *   **Example:** Temporal discounting gives clear guidance but the rate is arbitrary and ignores EHR/IP cluelessness. Satisficing needs an arbitrary threshold.

  2.  **CFR (Consequentialist Fidelity) vs. RR/SSR (Robustness/Source Sensitivity - esp. NI/VU):**
      *   **Conflict:** Pure consequentialism focuses solely on *outcomes*. But handling NI/VU/IP robustly might *require* shifting focus away from maximizing expected value of outcomes *per se*. For NI, comparing outcomes with different populations is problematic. For IP, expected value calculation is impossible. For RR, focusing on *how* we affect outcomes (causal channels) or *procedures* might be more robust than focusing on predicted outcomes, but this risks violating CFR if consequences aren't the *fundamental* justifier.
      *   **Example:** Prioritizing "cause X" (e.g., reducing extinction risk) based on its structural importance, not calculable long-term EV, might be robust but feels like abandoning pure outcome focus (CFR).

  3.  **CDT (Decision Theory Consistency) vs. EHR/IP (In-Principle Cluelessness):**
      *   **Conflict:** Standard CDT (max EV) presumes meaningful probability/utility assignments. IP cluelessness (chaos, non-computability) makes such assignments impossible or meaningless. Applying CDT formally requires assigning probabilities, but these assignments are fundamentally unjustified under IP cluelessness, violating EHR. Ignoring IP cluelessness violates EHR.
      *   **Example:** Forcing a probability distribution over chaotic long-term outcomes is epistemically bankrupt, yet CDT seems to require it.

  **How Major Approaches Fare Against Desiderata:**

  1.  **Temporal Discounting:**
      *   **Strengths:** Strong AGR, clear, consistent with CDT (for manageable uncertainty).
      *   **Weaknesses:** Violates EHR/IP (ignores true chaos), severe ATP (discount rate arbitrary), poor RR/NCR (discounting can make catastrophic LT effects negligible), potentially violates CFR if discounting isn't value-based.
      *   **Source Handling:** Poor for IP, VU, NI.

  2.  **Satisficing:**
      *   **Strengths:** Moderate AGR, avoids paralysis.
      *   **Weaknesses:** Severe ATP (defining "good enough" is arbitrary), poor RR/NCR (thresholds can be unstable), doesn't solve EHR/IP/VU/NI, weak CFR justification ("good enough" isn't fundamentally about maximizing consequences).
      *   **Source Handling:** Uniformly poor across sources.

  3.  **Robust Choosing (Maximin, Regret Minimization):**
      *   **Strengths:** Respects EHR, good RR (focuses on avoiding catastrophe), can handle AGR for high-stakes choices, aligns with CDT under extreme uncertainty.
      *   **Weaknesses:** Weak AGR for low-stakes choices (often recommends overly cautious/conservative actions), NCR issues (can't distinguish between actions with similar worst cases but different best/expected cases), ATP potential (defining plausible scenarios), struggles with CFR justification if overly cautious ("maximin" isn't maximizing).
      *   **Source Handling:** Better for IP (focuses on avoiding disaster), weaker for VU/NI.

  4.  **Causal Channel Prioritization / Heuristics (e.g., Reduce X-Risk, Promote Knowledge):**
      *   **Strengths:** Strong AGR, respects EHR/IP (avoids impossible calculations), potentially good RR/NCR (focuses on structural impact), can be framed within CFR (channels are means to valued consequences).
      *   **Weaknesses:** ATP risk (justifying *which* channels/why), requires auxiliary justification for heuristics (risk violating CFR if not tied to consequences), potential NCR issue (overlooking actions impacting channels indirectly).
      *   **Source Handling:** Explicitly addresses IP, can handle VU/NI if heuristics are chosen carefully.

  5.  **Accepting Normative Gaps / Myopic Rules:**
      *   **Strengths:** Respects EHR/IP, avoids ATP, clear HNG.
      *   **Weaknesses:** Weak AGR (can lead to paralysis or reliance on non-consequentialist rules for guidance), risks nihilism if gaps are too large, tension with CFR (if "follow rules" replaces consequence focus).
      *   **Source Handling:** Explicitly acknowledges limits of all sources.

  6.  **Expected Value with Vague/Porcupine Priors:**
      *   **Strengths:** Formal, attempts consistency with CDT/CFR.
      *   **Weaknesses:** Violates EHR/IP (assigning probabilities/utilities to the chaotic/unknowable is unjustifiable, masks ignorance), ATP (choice of prior is arbitrary), poor RR (results highly sensitive to prior).
      *   **Source Handling:** Fails for IP, struggles with VU/NI.

  **Conclusion on Key Challenges:**

  *   **Epistemic vs. In-Principle:** Any adequate theory *must* differentiate E and IP or justify uniform treatment. IP cluelessness fundamentally challenges the *applicability* of standard EV maximization (CDT conflict), while E cluelessness challenges its *implementation*. Theories assuming ignorance is always resolvable (E) fail for IP.
  *   **Action-Guidance vs. Nihilism/Gaps:** A theory *must* provide guidance while respecting ignorance (AGR + EHR + HNG). This requires embracing *qualified* guidance (e.g., robust satisficing, channel prioritization) or clearly delimiting gaps where rules apply.
  *   **Consequentialist Fidelity:** A theory *must* maintain that consequences (even if reinterpreted as mediated by channels or procedures) are the ultimate source of justification (CFR). Solutions that make non-consequentialist features (rights, duties) fundamental justifiers *abandon* the project of solving cluelessness *within* consequentialism.
  *   **Uniformity vs. Source Differentiation:** While initial simplicity is appealing, a strong theory *must* handle NI and IP as distinct, potentially harder problems than mere causal complexity (SSR). Treating VU as separate is also crucial.

  No current theory satisfies all desiderata perfectly, primarily due to the **AGR vs. EHR/ATP** and **CFR vs. RR/SSR** tensions. **Causal Channel Prioritization** and **Robust Satisficing** (e.g., "choose actions that are robustly good enough across plausible futures and promote resiliently valuable states/channels") currently offer the most promising balance, explicitly acknowledging EHR/IP, providing AGR, attempting RR, and staying within a broad consequentialist framework (CFR), though they still face ATP challenges and need careful handling of NI/VU. Theories ignoring IP or NI are fundamentally inadequate.
