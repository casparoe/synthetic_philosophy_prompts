answer: |-
  ### First: Core Disagreements  
  Nora and Tomás disagree on three interconnected levels:  
  1. **Conceptual coherence**: Nora argues the base/superstructure distinction collapses because capitalism’s "economic base" (property relations) is legally constituted, making the superstructure self-referential. Tomás defends its coherence by redefining the base as non-legal "effective control."  
  2. **Methodological validity**: Nora rejects functional explanation (superstructures stabilize bases) as unfalsifiable "just-so" storytelling (invoking Elster). Tomás endorses it as a flexible "primacy thesis" where superstructures functionally serve bases.  
  3. **Historical evidence**: Nora cites enclosure (law shaping economics) and Soviet industrialization (politics creating bases) as counterexamples to base determinism. Tomás reinterprets these as base-driven (enclosure ratifying market logic) or constrained by productive forces (Soviet failures).  

  Nora’s strongest position: *The base/superstructure distinction is conceptually incoherent under capitalism because property relations are inherently legal, and functional explanations are methodologically vacuous.*  
  Tomás’s strongest position: *The distinction holds if the base is defined non-legally as effective control, and functional primacy (not rigid determination) explains superstructures’ stability across macro-historical cases.*  

  ---

  ### Second: Move-by-Move Adjudication  
  **(1) Nora**: **Defensible**. She correctly identifies Marx’s tension: property relations are both foundational (base) and legal (superstructure). The inference that this collapses the distinction is logical *if* Marx’s legal-property equivalence is taken literally. But she overstates "collapse at the core" by ignoring non-capitalist societies where custom, not law, governs control.  
  **(2) Tomás**: **Mostly mistaken but pointing at something real**. Cohen’s "effective control" redescription *aims* to resolve circularity, but Nora will show it fails under capitalism. Tomás rightly notes that exploitative relations can exist without formal law (e.g., feudalism), but he ignores how capitalism’s control is *individuated* by law (e.g., corporate structures).  
  **(3) Nora**: **Clearly right**. She validly uses Marx’s text ("this merely expresses the same thing in legal terms") to show Tomás’s non-legal base contradicts Marx. Her critique of "effective control" is decisive: without legal categories (e.g., employment law), control is indeterminate. Tomás’s redescription *is* superstructural logic in disguise.  
  **(4) Tomás**: **Mixed**. Right that Marx’s "conditions" implies flexible primacy, not mechanical causation, making Nora’s "determines" a strawman. But wrong to claim functional explanation escapes circularity: if superstructures "constitute" bases *and* are explained by stabilizing them, the functional loop lacks a causal anchor (as Nora/Elster charge).  
  **(5) Nora**: **Defensible**. Elster’s critique of functional explanation is valid: absent mechanisms, it risks tautology. Her historical cases are apt (enclosure statutes *created* capitalist property; Soviet states built bases). Tomás’s "ratification" claim for enclosure is speculative—statutes often precede market consolidation.  
  **(6) Tomás**: **Mostly mistaken**. His enclosure rebuttal is weak (markets existed but were transformed by law) and his Soviet reply ignores that the party *created* new relations of production (e.g., collectivization). He is right that Nora conflates "explains everything" with "explains something," but this retreat to weak primacy concedes the core Marxist claim.  

  ---

  ### Third: Direct Answers  
  **(a)** Tomás’s redescription **relocates the problem** from conceptual incoherence to explanatory emptiness. By defining the base as "effective control," he avoids legal language but cannot *specify* control relations under capitalism without legal categories (e.g., shareholder rights). The collapse resurfaces as indeterminacy: without law, "control" lacks social reality.  
  **(b)** Nora’s textual appeal **is legitimate** because Marx explicitly equates relations of production with property relations. Tomás cannot dismiss this while claiming to defend Marx. However, "what Marx meant" and "what is defensible" *do* come apart: Cohen’s non-legal base is a reconstruction to save the theory from inconsistency. Both sides should care—Nora to show Marx’s theory is flawed, Tomás to amend it.  
  **(c)** Both leave out **constitutive vs. causal explanation**. The base/superstructure metaphor implies causation, but law *constitutes* economic relations under capitalism (e.g., contracts define exchange). Neither grapples with this duality: Nora sees constitution as fatal; Tomás ignores it by reducing law to epiphenomenal "stabilization."  

  ---

  ### Overall Judgment  
  **Nora is more right overall**. Her core argument—that the base/superstructure distinction collapses under capitalism because property is legally constituted—remains unrefuted. Tomás’s functionalist retreat ("weak primacy") abandons historical materialism’s explanatory ambition.  

  **For Tomás to be more right**, two things must hold:  
  1. **Conceptually**: "Effective control" must be definable without legal terms in *all* modes of production (implausible under capitalism).  
  2. **Historically**: Functional explanations must demonstrate *predictive* mechanisms (e.g., how base needs *cause* superstructures, not just correlate). Elster’s critique shows this is lacking.  

  **Why Nora wins**: She exposes a fatal flaw in Marx’s formulation (property’s legal nature) and undermines functionalism with historical counterexamples. Tomás’s defenses are either non-Marxist (Cohen’s revision) or evasive (weak primacy).
