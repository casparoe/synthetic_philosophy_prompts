prompt: |-
  I'm a PhD student working on decision theory under prospects whose expected value is undefined, and before I evaluate any of the proposed repairs — truncated expectations, dominance-only rules, ranking by other statistical functionals — I want the specification they are being measured against. So write the desiderata: the requirements any adequate decision rule for undefined-expectation games must meet, with the motivating case behind each.

  The core cases to keep in view: the St. Petersburg game (payoff 2^n with probability 2^-n when the first head lands on toss n, so the expectation diverges to infinity) and the Pasadena game (same setup, but the payoff for first head on toss n is (-1)^n times 2^n/n, so the expectation series becomes the alternating harmonic series — conditionally convergent, summing to ln 2 in the natural ordering but rearrangeable to any real value, or divergence). The Pasadena case matters precisely because the game has no well-defined expected value even though each payoff, and the expectation truncated at any finite point, is perfectly well-defined.

  Among the requirements I'd want considered: that the rule coincide with expected-value maximization whenever expectations exist and are finite; that it deliver some verdict on whether to play the Pasadena game, and at what entry fee; that it respect statewise dominance when one prospect beats another in every state; that it be invariant under mere relabelings or repartitionings of the sample space — a condition conditional convergence puts direct pressure on, since reordering the terms changes the sum; that it handle choices among several undefined-value prospects, not just a single accept/reject verdict; and that it treat temporal or sequential versions of the games without exploiting the order in which terms happen to arrive. For each requirement, give the case behind it, and mark which are non-negotiable and which are preferences of particular camps rather than genuine adequacy conditions.

  The part I most want to see: flag any pair of desiderata you suspect is jointly unsatisfiable — I have a suspicion that agreement with finite-case expected value and partition-invariance cannot coexist once conditionally convergent expectations are admitted, and I'd like to know whether that is right or whether it shows one of the two was never a genuine requirement. Finally, tell me which single requirement on your list does the most to eliminate the familiar candidate rules. Keep the focus on the criteria; the scoring of contenders can be brief, since the criteria are the deliverable.
reasoning: |-
  We are to state desiderata (requirements) for decision rules when facing prospects with undefined expected value. The core cases are the St. Petersburg game (divergent expectation) and the Pasadena game (conditionally convergent expectation). We list the requirements, each motivated by a case, and note which are non-negotiable and which might be camp-specific. We also flag pairs of desiderata that might be jointly unsatisfiable, and identify the requirement that most eliminates familiar candidate rules.

  **Desiderata for Decision Rules in Undefined-Expectation Contexts**

  1. **Agreement with Expected Value (EV) when Defined (Non-negotiable)**  
     *Requirement*: If a prospect has a finite and well-defined expected value, the decision rule must coincide with expected value maximization.  
     *Motivating Case*: This is the foundation of decision theory. Without this, the rule would be an ad hoc departure from standard methods in cases where they work. For example, in a simple gamble with finite outcomes, we must use the EV.  
     *Note*: This is non-negotiable because it is a minimal consistency condition.

  2. **Definiteness (Non-negotiable? Controversial)**  
     *Requirement*: The rule must deliver a definite verdict (e.g., accept/reject, or a preference ordering) for every prospect, including the Pasadena game.  
     *Motivating Case*: The Pasadena game has no well-defined expectation (due to conditional convergence). We must be able to decide whether to play it at a given entry fee.  
     *Note*: Some might argue that we should sometimes remain agnostic, but the requirement for a definite verdict is often considered non-negotiable in normative decision theory.

  3. **Statewise Dominance (Non-negotiable)**  
     *Requirement*: If prospect A yields at least as good an outcome as prospect B in every possible state of the world, and strictly better in at least one, then A is strictly preferred to B.  
     *Motivating Case*: Consider a modified Pasadena game that, in every state, pays at least as much as the original and strictly more in one state. Then it must be preferred. This is a basic rationality condition.

  4. **Partition Invariance (Controversial)**  
     *Requirement*: The evaluation of a prospect should not depend on the partitioning or relabeling of the state space. Specifically, if we rearrange the states (without changing the payoffs and probabilities) the verdict should remain the same.  
     *Motivating Case*: The Pasadena game's expectation can be rearranged to any real number or made to diverge. Therefore, if our rule depends on the order of summation (which is arbitrary if we can relabel states arbitrarily) then it would be arbitrary.  
     *Note*: This is a strong requirement that many rules (e.g., those relying on a particular ordering) fail.

  5. **Handling Multiple Prospects**  
     *Requirement*: The rule must be able to compare any two (or more) prospects with possibly undefined expectations, not just a single prospect against a fixed alternative (like a constant entry fee).  
     *Motivating Case*: We might need to choose between the St. Petersburg game and the Pasadena game, or between two different variants of the Pasadena game.  
     *Note*: This is a natural extension and non-negotiable for a full decision rule.

  6. **Order Invariance / Temporal Neutrality**  
     *Requirement*: The rule should not exploit the temporal order in which payoffs are received (if the problem is sequential) or the order in which states are considered.  
     *Motivating Case*: In sequential realizations of the St. Petersburg or Pasadena games (where we flip coins until a head), the order of payoffs is determined by the coin flips. But the decision rule should be the same if we were to receive the same payoffs in a different temporal order (if that were possible) or if we permute the states arbitrarily (as in the partition invariance).  
     *Note*: This is related to partition invariance but focuses on the temporal aspect. It is non-negotiable if we view time as arbitrary.

  **Potential Conflicts Between Desiderata**

  - **Conflict between Agreement with EV and Partition Invariance?**  
    Consider the Pasadena game. The finite truncations (up to n tosses) have well-defined expectations, and as n increases, these truncations converge to ln(2) when summed in the natural order. However, if we rearrange the terms (by relabeling the states) we can get any real number. Now, if we require the rule to agree with the finite truncations in the limit (which might be seen as an extension of the Agreement with EV) then we get ln(2). But if we require partition invariance, then we cannot prefer one ordering over another. Hence, we might be forced to say that the expectation is undefined and then we cannot assign a definite value? But then we violate Definiteness. Alternatively, if we assign a value (like ln(2)) then we violate partition invariance because a different ordering would yield a different value.  
    *Conclusion*: Agreement with EV (extended to the limit of truncations in a fixed order) and Partition Invariance are jointly unsatisfiable for conditionally convergent series. This suggests that one must be dropped or weakened.  
    *Which one?* Some argue that partition invariance is fundamental (because the states are arbitrary) and hence we should drop the idea of taking the limit in a fixed order. Others argue that the natural ordering (by time of resolution) is privileged and hence we should drop partition invariance.

  **The Most Eliminating Requirement**

  The requirement that does the most to eliminate familiar candidate rules is **Partition Invariance**. Why?  
  - Truncation methods (like taking the limit of finite truncations) depend on the order of truncation (i.e., the natural order). Hence, they violate partition invariance.  
  - Rules that use a specific ordering (like Cesàro summation or other summability methods) are also order-dependent.  
  - Dominance rules alone might not be enough to pin down a unique choice in the Pasadena game.  

  Thus, if we insist on partition invariance, we rule out any method that relies on a particular ordering of states. This includes the most straightforward ways of handling the Pasadena game (like taking the expectation in the natural order). This is why partition invariance is so demanding.

  **Summary of Non-Negotiable vs. Controversial**

  - Non-negotiable: Agreement with EV when defined, Statewise Dominance, and perhaps Definiteness (though some might allow for incompleteness).  
  - Controversial: Partition Invariance and Order Invariance (because they conflict with the natural ordering approach) and possibly Definiteness (if one allows for incomplete preferences).  
  - The requirement of Handling Multiple Prospects is non-negotiable for a complete decision theory.

  **Final Note**

  The central tension is between the desire to extend the familiar expected value (via a particular limiting process) and the requirement that the evaluation should not depend on arbitrary features (like state labeling). This tension is unavoidable in the face of conditional convergence. Therefore, any adequate decision rule must either drop partition invariance (and privilege a natural ordering) or drop the idea of taking the limit of finite truncations in a fixed order (and find a different way to assign a value). This is the fundamental challenge in the Pasadena game.
answer: |-
  Below are the desiderata for decision rules when evaluating prospects with undefined expected values, motivated by the core cases (St. Petersburg and Pasadena games). Each requirement includes the motivating case, and I classify them as **non-negotiable** (essential for any minimally adequate rule) or **preferential** (reflecting specific philosophical/camp positions). I then identify pairs of desiderata that may be jointly unsatisfiable and highlight the most eliminating requirement. The focus is on criteria, with minimal scoring of contenders.

  ### **Desiderata for Decision Rules**  
  1. **Agreement with Finite Expectation (Non-negotiable)**  
     - **Requirement**: When a prospect has a finite, well-defined expected value, the rule must align with expected-value maximization.  
     - **Motivating Case**: Standard gambles (e.g., a 50% chance of winning $2, else $0, EV = $1). Violating this would undermine coherence in cases where decision theory already works.  
     - **Status**: Universally non-negotiable; failure implies the rule is not an extension of standard decision theory.

  2. **Definiteness (Preferential)**  
     - **Requirement**: The rule must deliver a verdict (e.g., accept/reject, fair price) for prospects with undefined expectations, including the Pasadena game.  
     - **Motivating Case**: The Pasadena game has no unique expected value (conditionally convergent series), yet we need to decide whether to play it at a given fee (e.g., $0.50). Rules that return "undefined" or incomparable fail this.  
     - **Status**: Preferential; some camps (e.g., completeness-focused) demand definiteness, others (e.g., ambiguity-tolerant) allow incompleteness.

  3. **Statewise Dominance (Non-negotiable)**  
     - **Requirement**: If prospect A yields a better outcome than prospect B in every possible state of the world, A must be strictly preferred.  
     - **Motivating Case**: A modified Pasadena game where all payoffs are increased by $1. This must be preferred to the original, regardless of convergence issues.  
     - **Status**: Non-negotiable; violating dominance leads to blatant irrationality (e.g., choosing a uniformly worse outcome).

  4. **Partition Invariance (Preferential)**  
     - **Requirement**: The rule must be invariant under relabeling or repartitioning of states (e.g., reordering payoff sequences).  
     - **Motivating Case**: The Pasadena game's expectation changes under rearrangement (e.g., to $+\infty$, $-\infty$, or any real number). If the rule depends on the natural order of coin flips, it is arbitrary—states are abstract and should not affect preferences.  
     - **Status**: Preferential; "ordering" camps (e.g., time-indexed truncation) reject this, while "state-neutral" camps insist on it.

  5. **Multi-Prospect Comparability (Non-negotiable)**  
     - **Requirement**: The rule must handle choices among multiple undefined-expectation prospects (e.g., Pasadena vs. St. Petersburg), not just single-prospect evaluations.  
     - **Motivating Case**: Choosing between a Pasadena game and a St. Petersburg game with a $+1$ payoff shift. Rules limited to "accept/reject at fee X" fail here.  
     - **Status**: Non-negotiable; practical decisions often involve comparisons.

  6. **Temporal/Sequential Neutrality (Preferential)**  
     - **Requirement**: The rule must not exploit the temporal order of resolution (e.g., the sequence of coin flips) for its verdict.  
     - **Motivating Case**: A sequential St. Petersburg game resolved over time. Preferences should not change if payoffs are received in a different temporal order (e.g., if early losses are deferred).  
     - **Status**: Preferential; dynamic decision theorists may prioritize order, while others see time as irrelevant to abstract prospects.

  ---

  ### **Joint Unsatisfiability of Desiderata**  
  - **Conflict**: **Agreement with Finite Expectation** and **Partition Invariance** are jointly unsatisfiable when conditional convergence (e.g., Pasadena game) is allowed.  
    - **Why?**  
      - *Agreement with Finite Expectation* implies that for any finite truncation of the Pasadena game (e.g., up to toss *n*), the rule must use the expected value of the truncated game (which is well-defined and sums to a partial harmonic series). As *n* → ∞, this converges to $\ln 2 \approx 0.69$ under the natural ordering.  
      - *Partition Invariance* demands that reordering states (e.g., rearranging payoffs to $n=1,3,5,\dots$ then $n=2,4,6,\dots$) must not change the verdict. But rearrangements alter the sum (to any real number or divergence), so the rule cannot rely on the natural order.  
    - **Resolution**: This conflict reveals that **Partition Invariance is not a genuine adequacy condition** if one holds that the natural order (e.g., time of resolution) is privileged. Conversely, if partition invariance is sacrosanct, **Agreement with Finite Expectation must be weakened** for conditionally convergent cases (e.g., by rejecting limit-based extensions).  
    - **Verdict**: Your suspicion is correct—these two desiderata cannot coexist. This exposes Partition Invariance as preferential (not universal), as it conflicts with a core tenet of expectation-based rationality.

  ---

  ### **Most Eliminating Requirement**  
  - **Partition Invariance** eliminates the most candidate rules:  
    - **Truncated Expectations**: Fail, as they depend on a fixed order of truncation (e.g., natural coin-flip sequence).  
    - **Ranking by Summability Methods** (e.g., Cesàro, Abel sums): Fail, as these are order-dependent (rearrangement changes the sum).  
    - **Dominance-Only Rules**: Pass partition invariance but fail *Definiteness* (e.g., they cannot price the Pasadena game).  
    - **Result**: Only "state-symmetric" rules (e.g., those using signed measures or relative expectations) survive, but these often violate Agreement with Finite Expectation or Temporal Neutrality.  

  ---

  ### **Summary of Classifications**  
  | **Desideratum**                     | **Status**          | Key Insight from Core Cases |  
  |-------------------------------------|---------------------|----------------------------|  
  | Agreement with Finite Expectation   | Non-negotiable      | Foundational; fails if St. Petersburg truncations aren't handled. |  
  | Definiteness                        | Preferential        | Pasadena game forces a verdict; some reject completeness. |  
  | Statewise Dominance                 | Non-negotiable      | Violation implies irrational choices. |  
  | Partition Invariance                | Preferential        | Conflicts with Agreement; Pasadena rearrangements make it untenable for order-dependent rules. |  
  | Multi-Prospect Comparability        | Non-negotiable      | Needed for real-world choices among multiple prospects. |  
  | Temporal/Sequential Neutrality      | Preferential        | St. Petersburg sequential play tests if order matters. |  

  ### **Key Tensions and Implications**  
  - **Central Trade-off**: Rules must choose between **order-dependence** (privileging temporal/natural sequences, satisfying Agreement with Finite Expectation) and **state symmetry** (satisfying Partition Invariance). The Pasadena game forces this trade-off.  
  - **Recommendation**: Drop Partition Invariance as a universal requirement; instead, treat it as a preference for specific contexts (e.g., static gambles). This preserves Agreement with Finite Expectation via order-sensitive limits while accepting that order matters in sequential resolutions.  
  - **Why this works**: In temporal games (e.g., coin-flip sequences), the natural order is non-arbitrary, so violating Partition Invariance is defensible. Definiteness can then be achieved via order-specific evaluations (e.g., $\ln 2$ for Pasadena).  

  This framework provides a rigorous specification for evaluating repairs (e.g., truncations, dominance rules). For next steps, test candidates against the non-negotiable desiderata and the Pasadena/St. Petersburg cases, starting with the Agreement–Partition conflict.
