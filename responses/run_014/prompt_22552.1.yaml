prompt: |-
  I'm stuck on Lewis's principal principle. It says my craedence in A should equal the objective chance of A, given all the evidence I have. But if "all the evidence I have" already includes everything I know about the chances, isn't that just saying I should be consistent with my own evidence? What extra constraint is the principle supposed to add, and why does Lewis care about "admissible" evidence if total evidence is already supposed to do the work?
reasoning: |-
  Okay, the user is struggling with Lewis's Principal Principle, particularly the part about evidence and admissibility. They’re confused why total evidence isn’t sufficient and what role "admissible" evidence plays. Let me unpack this step by step.

  First, I need to recall the Principal Principle (PP). It states that credence in A, conditional on the chance of A being x and the rest of our admissible evidence E, should be x. The user’s main confusion is why we need "admissible" evidence when we already have total evidence. They think that total evidence should automatically handle everything, including knowledge about chances. 

  Hmm, the key here is distinguishing between different types of evidence. Total evidence includes everything, but not all evidence is treated equally in PP. The user might be conflating "all evidence" with what’s relevant for setting credences based on chance. Admissibility is crucial because some evidence can undercut the authority of chance. For example, if I know a coin is fair (chance is 0.5), but I also know the outcome because I saw it land, then that outcome evidence trumps the chance info. Including that in E would make PP incoherent. 

  The user’s deeper question might be about the necessity of admissibility. They might feel that total evidence should naturally exclude such undermining information. But Lewis’s point is that without explicitly separating admissible evidence, we risk contradictions. Like in the coin example: if E includes the outcome, conditioning on chance and E forces credence to be x, but knowing the actual outcome requires credence 1 or 0. Hence the need to filter E to admissible parts.

  Also, the user might not grasp why chances are special. They’re wondering why consistency with evidence isn’t enough. But PP isn’t just about consistency; it’s about deferring to objective chances when available. Chances are expert probabilities, so even if your total evidence suggests otherwise, you should follow the chance unless you have direct evidence overriding it. Admissibility defines what counts as such overriding evidence.

  I should use the coin flip example to clarify. Without admissibility, PP would break when E includes future outcomes. The user needs to see that total evidence isn’t the right input for PP because it can contain information that makes chance irrelevant. Lewis’s admissibility criterion prevents this by excluding such information, allowing PP to function as a guide for initial credence before direct evidence updates it.

  They might also be missing the distinction between synchronic and diachronic constraints. PP is a synchronic rule about setting credences at a time, using chances as a guide. Updating with new evidence happens later. Admissibility ensures that at the time of applying PP, we’re not smuggling in future evidence that hasn’t been properly updated via conditionalization.

  In summary, the user’s confusion stems from equating total evidence with what’s appropriate for PP. The answer lies in explaining how total evidence can contain inadmissible elements that sabotage the principle, hence the need for admissibility to preserve PP’s role as a rational constraint based on objective chances.
answer: |-
  Your confusion is spot-on and highlights a crucial subtlety in Lewis's Principal Principle (PP). Let's break down why Lewis needs the "admissible evidence" qualifier even when we have "total evidence," and what extra constraint PP provides beyond mere consistency with evidence.

  **Core Issue:** The problem arises because *total evidence can include information that renders the objective chance irrelevant or misleading* for setting credence. PP isn't *just* about consistency; it's about **deferring to objective chance as an expert**.

  Here's the resolution:

  1.  **The Principal Principle (Simplified):**
      Lewis states that your *initial* credence in proposition `A`, conditional *only* on the proposition that the objective chance of `A` at time `t` is `x` (`Ch_t(A) = x`) and *admissible* evidence at `t` (`E_adm`), should be `x`:
      `Cr_0(A | Ch_t(A) = x ∧ E_adm) = x`
      *   `Cr_0`: Your initial credence function (before incorporating evidence about specific outcomes).
      *   `Ch_t(A) = x`: The proposition stating the objective chance of `A` at time `t` is `x`.
      *   `E_adm`: Your total evidence *that is admissible relative to `A` and `t`*.

  2.  **Why "Total Evidence" Isn't Directly Used in PP:**
      *   Your total evidence (`E_total`) might include information about the *actual outcome* of `A` or the specific causal process leading to `A` *after* time `t`.
      *   **The Conflict:** If `E_total` includes the fact that `A` is true (or false), then your credence `Cr(A | Ch_t(A) = x ∧ E_total)` *must* be 1 (or 0). But if the objective chance `x` was less than 1 (or greater than 0), this directly contradicts PP stating it should be `x`. PP would become incoherent if applied directly to `E_total`.

  3.  **The Crucial Role of "Admissible" Evidence:**
      *   **Definition (Lewis):** Evidence `E` is **admissible** relative to proposition `A` and time `t` if `E` does not "defeat" or "undercut" the authority of `Ch_t(A) = x` as a guide to credence about `A`. Roughly, `E` is admissible if it doesn't provide "inside information" about the outcome `A` itself that the chance process hasn't already accounted for.
      *   **What is Typically Admissible:**
          *   Information *before* time `t` (e.g., laws of nature, initial conditions up to `t`, past events).
          *   General truths about the chance process itself (e.g., "this coin is fair").
          *   Information logically or causally independent of the specific outcome `A` (e.g., "it rained yesterday" when `A` is about a coin flip today).
      *   **What is Typically Inadmissible:**
          *   Information about the specific outcome `A` occurring *after* time `t` (e.g., "I saw the coin land Heads", "The experiment result was recorded as A=true").
          *   Information about the specific micro-details of the causal process *after* `t` that determine `A` (if such details exist and are known).
          *   Information that logically entails `A` or `not-A`.
      *   **The Function:** Admissibility acts as a **filter** on your total evidence (`E_total`). When applying PP, you only condition on the part of `E_total` that is admissible (`E_adm`). This excludes the "inside information" that would render `Ch_t(A) = x` an irrelevant guide.

  4.  **The Extra Constraint PP Adds Beyond Consistency:**
      PP is **not merely** the demand to be consistent with your total evidence. It's a specific, substantive constraint on how your credence *must relate to your beliefs about objective chances*. It forces you to **treat the objective chance as an expert probability** you should defer to, *provided* you don't have "inside information" (inadmissible evidence) about the specific outcome.
      *   **Consistency with Evidence:** Your credences must be probabilistically coherent and updated by conditionalization on your total evidence. This is general rationality.
      *   **PP's Constraint:** If your evidence includes the proposition `Ch_t(A) = x` *and only admissible evidence beyond that*, then your credence in `A` *must be exactly `x`*. This pins your credence to a specific value based on your belief about an objective feature of the world (the chance), *unless* you have direct evidence about the outcome itself.

  5.  **Lewis's Motivation and Why He Cares About Admissibility:**
      *   **The Goal:** Lewis wanted to capture the intuition that rational agents should align their degrees of belief with known objective probabilities (like coin flips, radioactive decay) *in the absence of specific "inside information"* about the outcome. Chance is supposed to be the "best guide" to the future.
      *   **The Problem Addressed:** Without the admissibility clause, PP, as stated simply as `Cr(A | Ch_t(A) = x) = x`, is vulnerable to contradiction as soon as you learn `A` is true (your credence becomes 1, not `x`). Lewis needed a way to formulate PP so it could be a *general*, *unconditional* constraint on rational credence that wouldn't break down when evidence accumulates.
      *   **The Solution:** By restricting the evidence conditioned on to *only admissible evidence*, PP becomes a constraint on your credence function *at a time* `t` *before* you learn the specific outcome (or gain inadmissible evidence). You apply PP when your best guide is the chance. Once you learn the outcome (inadmissible evidence), you update by conditionalization, overriding the PP constraint *because the condition for PP (only admissible evidence) is no longer met*. Admissibility makes PP compatible with updating on total evidence over time.

  **Illustrative Example (Coin Flip):**

  *   `A`: "The coin lands Heads on Tuesday at noon."
  *   `t`: Monday at 9:00 AM.
  *   `Ch_t(A) = 0.5` (It's a known fair coin).

  *   **Monday 9:01 AM (Only Admissible Evidence):** Your total evidence `E_total` includes `Ch_t(A) = 0.5`, the laws of physics, the coin's description, past weather, etc. Crucially, it does *not* include Tuesday's outcome. `E_adm = E_total` (nothing inadmissible yet). **PP Applies:** `Cr(A | Ch_t(A) = 0.5 ∧ E_adm) = 0.5`. You *must* set your credence to 0.5.
  *   **Tuesday 12:01 PM (Total Evidence Includes Outcome):** Your `E_total` now *also* includes "The coin landed Heads" (or "I see it's Heads"). This is **inadmissible** relative to `A` and `t` (Monday 9 AM). *You cannot apply PP conditioning on this `E_total`!* Instead, you update by conditionalizing on the new evidence: `Cr_new(A) = Cr_old(A | Coin Landed Heads) = 1`. PP remains true of your *Monday* credence function, conditioned only on the evidence *admissible on Monday*.

  **In Summary:**

  1.  **Admissibility filters total evidence** to exclude information that directly reveals the outcome or its specific causes after `t`, preventing PP from generating contradictions when such evidence is acquired.
  2.  **PP imposes a specific constraint:** It forces your credence in `A` to *equal* your best estimate of the objective chance of `A` (conditional *only* on that chance proposition and admissible evidence). This goes beyond general consistency; it mandates *deference* to objective chance as an expert probability.
  3.  **Lewis cares about admissibility** because it's essential for PP to be a *coherent*, *general*, and *unconditional* principle of rational credence formation that respects the role of chance as the best initial guide while still allowing rational updating when direct evidence about outcomes arrives. Without admissibility, PP collapses under the weight of total evidence.
