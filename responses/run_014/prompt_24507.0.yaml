  Breaking down the tricky aspects: The presumption is vague. What does "independence" mean here? It's not statistical independence because evidence often depends on the hypothesis. Maybe it's about conditional independence given the hypothesis. But the user points out that even then, there could be hidden common causes. So the default independence is really conditional on the hypothesis *and no other common causes*. That's a lot to assume without evidence.

  In Bayesian terms, assuming independence simplifies calculations but is often false. Representing it without a hard axiom might involve soft constraints—like priors that allow for some dependence, or models that incorporate possible confounding variables. Causal models could help by explicitly showing paths between evidence sources, but we usually don't have the full causal graph.

  Where does this default fail? In testimony, if two witnesses share a source or influence each other, their agreement may not be independent. In medical diagnosis, symptoms might stem from the same underlying cause, making them dependent. In science, multiple experiments might share methodological flaws, leading to apparent but non-independent confirmation.

  Defeating the presumption requires detecting dependencies—like signs of collusion, common origins, or hidden confounders. But this detection itself needs evidence, creating a chicken-and-egg problem. The user might need strategies to flag potential dependencies without prior knowledge, perhaps through sensitivity analysis or robust methods that account for possible correlations.

