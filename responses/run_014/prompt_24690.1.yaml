prompt: |-
  Build me a thought experiment where a Humean and an anti-Humean about laws of nature disagree about the probability of an untested event, even though they agree on all the non-nomic facts in the past and on all the probabilities of the evidence. The case should turn on a masked disposition or some other vacuous law, and dont let it rely on quantum weirdness, magic, or a bare stipulation that the laws govern. Keep the scenario to one paragraph in an ordinary laboratory or engineering setting, and after it show what a best-system Humean and a governing-law anti-Humean each say and why, which single feature does the work, what happens if you remove it, and how a defender of the view that comes out badly would attack the case. No headings, bullets, bold, or tables; continuous prose only.
reasoning: |-
  We are in a materials lab testing a new alloy, Duraloy. For years, every sample of Duraloy has been heated to 1000°C and cooled rapidly, and in every such test it has shattered upon cooling. But today, we are about to test a new batch that has been stored in a novel inert gas atmosphere since its creation. All past samples were stored in air. Both the Humean and anti-Humean agree that the past samples shattered with probability 1 and that the new batch is identical to the old in all non-nomic respects except for the storage gas. They also agree that the inert gas storage cannot causally influence the alloy's shattering behavior under heating and cooling. However, the anti-Humean holds that Duraloy has an unmanifested disposition: if stored in inert gas, it would become ductile and not shatter. The Humean denies any such disposition. Both agree that the probability of the evidence (past shattering) is 1 given their respective laws, but they disagree on the probability of the new batch shattering because the anti-Humean posits a vacuous law: "Duraloy stored in inert gas is ductile when cooled," which has never been tested.

  The best-system Humean says: our laws are summaries of what actually happens. Since we've never seen inert-gas-stored Duraloy, the vacuous law about inert gas adds complexity without improving fit or strength, so we shouldn't include it. The probability of shattering for the new batch is high, as it resembles past cases. The governing-law anti-Humean says: the laws are not mere summaries; they encode genuine dispositions. The disposition to shatter when stored in air is real, but the alloy also has the unmanifested disposition to be ductile when stored in inert gas. Since the inert gas law is a fundamental disposition, it governs, so the probability of shattering is low. The single feature doing the work is the vacuous law about inert gas storage. If we remove it (by having no such law or disposition), both sides would agree on a high probability of shattering. The Humean defender attacks the case by arguing that the anti-Humean has no basis for the inert gas disposition beyond metaphysical preference, making their probability assignment arbitrary; after all, why not a disposition to shatter even more violently?
answer: |-
  In a materials laboratory, engineers have repeatedly tested an alloy called Duraloy by heating it to 1000°C and quenching it in water, observing that it always shatters; however, all past samples were stored in ordinary air before testing, whereas a new, physically identical batch has been stored in a pure argon atmosphere since creation. Both a Humean and an anti-Humean agree on every non-nomic fact about the alloy’s composition, the heating/cooling process, and the consistent past results, and they concur that the probability of observing such consistent shattering under past conditions is 1. Yet the anti-Humean asserts that Duraloy possesses a masked disposition: argon storage fundamentally alters its latent structure to make it ductile upon quenching, even though this effect has never been observed or tested, while the Humean denies this unmanifested property exists. Consequently, the anti-Humean judges the probability of the new batch shattering as near zero, invoking a vacuous law—"Duraloy stored in inert gas does not shatter under thermal shock"—that governs despite having no instances, whereas the Humean, committed only to patterns in actual events, sees no reason to deviate from the uniformity of past observations and sets the probability near 1. The disagreement hinges solely on whether vacuous laws (here, the untested inert-gas disposition) can genuinely constrain possibilities. Without this feature—if the argon storage were tested or the disposition weren't posited—both would align on high shattering probability. A Humean critic attacks the case by arguing that the anti-Humean’s vacuous law is epistemically arbitrary: it cannot be justified by evidence, predictive success, or simplicity, making it a metaphysical fiction that illegitimately inflates complexity without empirical payoff, whereas the Humean’s probability flows objectively from actual regularities.
