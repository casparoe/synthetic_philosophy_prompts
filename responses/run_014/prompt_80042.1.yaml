answer: |-
  Below is a specification for an adequate theory of representational content in artificial neural networks (ANNs). Each requirement includes its motivation, status (non-negotiable vs. camp-specific), and implications. The goal is to resolve disputes by forcing clarity on what the theory *must* explain to avoid being merely stipulative or circular.

  ---

  ### **Core Requirements for an Adequate Theory**
  1. **Granularity**  
     - **Requirement**: The theory must specify the *unit* of representation (e.g., single neuron, direction in activation space, circuit, population) and resolve cases of many-to-one or one-to-many mappings (e.g., a "cat" concept distributed across units, or a single unit reacting to cats/dogs/cars). It must explain how representations are *individuated*—why a specific pattern corresponds to a specific content.  
     - **Motivation**: Without this, claims like "this neuron represents edges" or "this layer represents objects" are ambiguous. Cases like polysemantic neurons (one unit firing for multiple concepts) or distributed representations (a concept encoded across many units) are common in ANNs and demand principled handling.  
     - **Status**: **Non-negotiable**. Any theory failing here cannot engage with real ANNs.

  2. **Systematicity and Compositionality**  
     - **Requirement**: The theory must explain how representations support systematic recombination (e.g., if "red circle" and "blue square" are representable, so is "red square") and compositionality (complex representations built from simpler ones). It must do this *without* presupposing hand-engineered symbols, as ANNs learn features end-to-end.  
     - **Motivation**: Philosophical critiques (e.g., Fodor) argue that genuine representation requires structure-sensitive operations. ANNs often exhibit quasi-systematic behavior (e.g., in image segmentation or language tasks), but it emerges from data statistics, not explicit rules.  
     - **Status**: **Camp-dependent**. Essential for theorists who see cognition as language-like; less critical for those viewing ANNs as continuous feature transformers. Still, minimal systematicity (e.g., part-whole hierarchies) is a weak non-negotiable.

  3. **Causal Mediation (Not Mere Correlation)**  
     - **Requirement**: The theory must show how a putative representation *causally influences* downstream outputs. It must distinguish representations from epiphenomenal correlates (e.g., a "cat" activation that reliably fires for cats but isn’t used by the network to decide "cat").  
     - **Motivation**: Without causal grounding, "representations" reduce to patterns we notice, not functional components. Empirical work (e.g., ablation studies showing accuracy drops when a feature is removed) demonstrates causal roles in ANNs.  
     - **Status**: **Non-negotiable**. A representation that doesn’t mediate behavior is explanatorily inert.

  4. **Misrepresentation**  
     - **Requirement**: The theory must explain how an activation can *misrepresent* (e.g., a "cat" feature firing for a dog-shaped rock), without collapsing into a pure covariation account (where a feature only represents what it *actually* tracks).  
     - **Motivation**: Misrepresentation is central to intentionality (e.g., "aboutness" that can be wrong). In ANNs, adversarial examples or out-of-distribution inputs trigger false positives/negatives. If a theory only equates content with statistical correlation, it cannot handle error.  
     - **Status**: **Non-negotiable**. Failure here implies the theory describes measurement, not representation.

  5. **Resolving the Circularity Charge**  
     - **Requirement**: The theory must avoid defining content solely via the network’s internal causal roles, which risks circularity (e.g., "cat" represents cats because it causes 'cat' outputs, but 'cat' outputs are only interpreted as cats by us). It must ground content in something external (e.g., training data, evolutionary goals, or agent-environment interactions).  
     - **Motivation**: Functional-role theories often face this charge: they explain content by appealing to causal relations we already interpret. A theory must break this circle to avoid being parasitic on our labels.  
     - **Status**: **Non-negotiable**. Circular theories are self-undermining.

  6. **Interpretability**  
     - **Requirement**: The theory must *not* require representations to be human-interpretable. It should allow for representations that are alien or opaque but still functionally valid.  
     - **Motivation**: Insisting on interpretability conflates epistemology (how *we* understand the net) with ontology (what the net *uses*). ANNs often learn features (e.g., in vision transformers) that are incomprehensible but causally critical.  
     - **Status**: **Non-negotiable**. Human readability is a pragmatic tool, not a criterion for representation.

  ---

  ### **Omissions & Additions**
  - **Objectivity/Invariance**: The theory must explain how representations can be *stable* across contexts (e.g., a "dog" feature responds to dogs under varied lighting/angles), not just input-output correlations.  
    - *Status*: Non-negotiable — without stability, content is arbitrary.  
  - **Multimodality**: How representations bridge sensory domains (e.g., a "shape" representation shared by vision and touch).  
    - *Status*: Camp-dependent (critical for embodied-AI views; less so for unimodal nets).

  ---

  ### **Evaluation of Requirements**
  - **Genuine Desiderata vs. Inherited Prejudices**:  
    - Non-negotiable: Granularity, causal mediation, misrepresentation, circularity resolution, and anti-interpretability prejudice. These address the *functional reality* of ANNs.  
    - Camp-specific: Systematicity (prioritized by symbolicists) and multimodality (prioritized by embodied cognition).  
    - Inherited prejudice: Interpretability as a *requirement* is a human-centric bias.  
  - **Joint Unsatisfiability**: Systematicity and causal mediation may conflict in ANNs. Systematicity demands discrete composable symbols, but ANNs often use distributed, continuous representations where causal roles are sub-symbolic. A theory must either show how systematicity emerges from continuous vectors (e.g., via superposition) or weaken systematicity.  
  - **Most Knocking-Out Requirement**: **Misrepresentation**. Many tracking/covariation accounts (e.g., "this neuron represents what it reliably detects") fail here, as they cannot explain errors without ad-hoc adjustments.

  ---

  ### **Scoring Major Contenders**  
  *(✓ = Satisfies, ✗ = Fails, ~ = Partial)*  

  1. **Causal-Role/Functional Account**  
     - Granularity: ✗ (Often vague on units; struggles with distributed codes).  
     - Systematicity: ~ (Can describe compositional behavior but rarely explains its emergence).  
     - Causal Mediation: ✓ (Core strength: representations defined by causal effects).  
     - Misrepresentation: ✗ (Famously circular: errors are "malfunctions," but malfunctions defined by errors).  
     - Circularity: ✗ (Content defined by internal roles, requires external grounding).  
     - Interpretability: ✓ (Does not require human readability).  
     - **Verdict**: Fails circularity and misrepresentation; needs external anchor (e.g., teleosemantics).  

  2. **No "Real" Representations (Pure Computation View)**  
     - Granularity: ✓ (Denies representations exist, so no granularity issues).  
     - Systematicity: ✓ (Systematicity is illusory or just computation).  
     - Causal Mediation: ✓ (All activations are causal but not "about" anything).  
     - Misrepresentation: ✓ (Rejects intentionality, so no misrepresentation).  
     - Circularity: ✓ (No content, no circle).  
     - Interpretability: ✓ (Irrelevant).  
     - **Verdict**: Avoids all issues by rejecting representation. Fails to explain why some activations function *as if* representational (e.g., adversarial errors).  

  3. **Interpretability-Led View**  
     - Granularity: ✗ (Units must align with human concepts; ignores distributed features).  
     - Systematicity: ~ (Human concepts are systematic, but ANN features often aren’t).  
     - Causal Mediation: ✗ (May highlight correlated but non-causal features).  
     - Misrepresentation: ~ (Can label errors but doesn’t explain how *the network* gets it wrong).  
     - Circularity: ✗ (Content defined by human interpretation, not network function).  
     - Interpretability: ✗ (Requires human readability).  
     - **Verdict**: Fails objectivity; confuses our description with the network’s ontology.  

  ---

  ### **Conclusion**
  An adequate theory must minimally satisfy **granularity, causal mediation, misrepresentation, circularity resolution, and non-reliance on interpretability**. The **causal-role account** comes closest but requires external grounding (e.g., in training objectives) to avoid circularity and handle misrepresentation. The **no-representation view** dodges the debate but ignores functional patterns that demand explanation. **Interpretability-led views** are empirically inadequate. The hardest nut is **misrepresentation**—any theory that cannot explain how a network "gets it wrong" reduces representation to correlation, collapsing under adversarial scrutiny. Use this spec to demand explicit answers to each requirement; convergence is unlikely until all are addressed.
