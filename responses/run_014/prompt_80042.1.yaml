  Systematicity: The user noted networks learn end-to-end, so the theory must explain how compositionality emerges from training, not from handcrafted structures. This is crucial because classic philosophical views assume symbolic systems, but neural nets are different.

  Causal mediation: The user wants to distinguish actual representations from mere correlations. The theory must show how activations play a role in processing, not just correlate with outputs. This ties into interventions—like ablation studies—to prove causality.

  Misrepresentation: This is tricky. If a "cat" feature activates for a dog, does it misrepresent? The theory must allow for errors without falling into a pure tracking view. Probabilistic approaches or counterfactuals might help, but it's a tough nut.

  Circularity charge: Functional-role theories might be accused of circularity—defining content by causal roles that we interpret. The theory needs to ground content externally, perhaps via evolutionary analogs or training objectives, to avoid this.

  Interpretability: The user asked if human readability is necessary. I think this is a prejudice; networks might have opaque representations that are still functional. The theory shouldn't require interpretability as a criterion.

  Looking for omissions: I should add "objectivity." Representations should be grounded in the system's function, not our post-hoc labels. Also, "multimodality"—how representations handle different input types—might be relevant but less core.

  Now, evaluating the requirements: Granularity, causal role, misrepresentation, and objectivity feel non-negotiable. Systematicity is important but might be looser for neural nets. Interpretability as a requirement is a prejudice—imposing human constraints. Circularity is a challenge to solve, not a requirement itself.

  Are any requirements conflicting? Systematicity and granularity might clash if compositionality requires discrete symbols, but neural nets show continuous patterns. A good theory should reconcile this, perhaps with vector space approaches.

  The circularity charge is a major blocker—it knocks out naive functional role theories. Solutions need external grounding.

  Scoring contenders:
  - Causal-role theory: Handles causality and misrepresentation via downstream effects, but struggles with circularity and granularity (if units aren't discrete).
  - No-representation view: Avoids all issues by denying representations exist, but ignores real functional patterns and misrepresentation cases.
  - Interpretability-led view: Makes features human-readable but fails on objectivity and granularity—many valid representations aren't interpretable.

