prompt: |-
  I am in the middle of a dissertation chapter in formal epistemology about how perceptual experience should change one's degrees of belief, and I have hit a wall. My supervisor is on sabbatical until Easter and the reading group has migrated to social choice theory, so I have been testing my ideas against a log I keep of my own reactions to concrete cases rather than against a person. What I would like from you is not a survey of the literature, nor a list of sources, nor a reconstruction of any published author's view: I want the principle itself, stated precisely enough that I could go back through my log and check it case by case. Please write in formal British English throughout.

  Here are the cases and my verdicts on them. (i) Driving home in the rain at dusk, I see a traffic light too far off to read: before the glance, 0.5 that it is red, 0.5 that it is green; after it, 0.75 and 0.25; my credence that I ought to ease off the accelerator moves correspondingly. Rational, and I take this to be the paradigm case of updating on experience that does not deliver certainty. (ii) The same structure with a card glimpsed from a shuffled deck, hearts against diamonds, moving from even odds to 0.9 and 0.1. Also rational, and I do not think it matters that here the outcome was already fixed while in (i) it was a matter of ambiguous illumination. (iii) I walk into a colleague's flat and get an inarticulate sense that it has been searched — a drawer slightly out of alignment, someone else's cigarette smoke in the hall — and I go from 0.2 to 0.8 that her things have been through. Rational, but note that I could not have written down in advance any partition of possibilities across which my probabilities were redistributed, and I still want to say this is the same species of update as (i) and (ii). (iv) On Sunday evening I resolve that, come what may, I shall end Monday 0.95 confident that my keys are on the kitchen table, because I am tired of retracing my steps. Irrational: this is willing a belief rather than answering to evidence. Yet it has exactly the formal shape of (iii), a shift not pinned down by redistribution over a pre-given partition, and I cannot see what separates the two beyond saying that one was caused by experience and the other by decision, which looks more like a relabelling of my verdicts than an account of them. (v) I have been certain for years, credence 1, that the departmental seminar meets at three o'clock; today someone mentions it again. Nothing should change, and any rule that changes anything here is to that extent wrong. (vi) I have been certain for years that the seminar meets at three; today I see a notice suggesting it has moved to four, and my credence falls to 0.6. Rational. Cases (v) and (vi) are formally identical — antecedent credence of 1, fresh input, output — and I want the principle to explain the difference, not merely register it. (vii) In a gallery lit unlike anywhere I usually see pictures, my probabilities over the colours in front of me shift, and so does my sense of how those colours would look under that lighting; the conditionals linking appearance to colour move during the experience itself. Rational, and I suspect this is precisely where the requirement that such conditionals stay fixed across the update breaks down.

  What I want back is the following. First, state one candidate principle, or at most two competing ones, with its constraints made explicit: what qualifies a change in probability as experiential at all; whether an antecedently specifiable partition is required; whether the conditional probabilities must remain rigid across the update; and whether a credence of 1 may be lowered. Second, for each clause of the principle, name the case in my log that motivates it, so that I can see which of my intuitions is doing the work. Third, give the principle's verdict on the case I keep going back and forth on: at dusk I seem to see a deer at the end of the garden, I settle on 0.5 deer and 0.5 the shadow of the trellis, and half an hour later I remember that the trellis was taken down that morning — I flip on whether this memory-driven redistribution is the same kind of update as the perceptual one or requires a rule of its own, and I want to know whether the case is a genuine counterexample to your principle or a redescription of one it already handles. Fourth, tell me what your principle implies for a case I have not listed, namely an experience that seems best modelled by a continuum rather than a finite partition, such as reading an angle off a protractor, where every finite partition I write down afterwards looks like an artefact of how I chose to chop the continuum up. And finally, be honest about the cost: list which of my verdicts the principle cannot accommodate, say which single verdict you would advise me to abandon, and tell me whether a principle that saves all of them does so only by licensing any probability shift whatever, provided the agent is willing to describe it as experiential.
reasoning: |-
  We are to formulate a principle for how perceptual experience should change degrees of belief. The principle must account for the cases provided and answer the specific questions.

  Key observations from the cases:

  (i) and (ii): Standard cases of uncertain perceptual experience leading to a shift in credences. The update is rational and does not require certainty.

  (iii): An inarticulate sense (non-propositional) leads to a shift without a pre-specified partition. Still considered rational and of the same kind as (i) and (ii).

  (iv): A decision to change belief (not caused by experience) is irrational, even though formally similar to (iii). The principle must distinguish between experience-driven and decision-driven shifts.

  (v) and (vi): Both start with credence 1. In (v), a redundant experience (someone mentions the known fact) should not change anything. In (vi), a conflicting experience (seeing a notice) does lower the credence. The principle must allow for lowering credence from 1 in the face of conflicting evidence and disallow it when the evidence is redundant.

  (vii): Conditional probabilities (linking appearance to color) shift during the experience. The principle must allow for such conditionals to change.

  The deer case: A memory update (recalling that the trellis was taken down) leads to a shift. We must decide if this is the same kind of update as the perceptual one.

  Continuum case: Update on a continuous experience (like reading a protractor) without a natural finite partition.

  We must also be honest about which verdicts the principle cannot accommodate and which might need to be abandoned.

  Candidate Principle:

  I propose a principle based on Jeffrey Conditionalization, but with modifications to handle the cases.

  Jeffrey Conditionalization (standard) allows updating without certainty and without a pre-specified partition by redistributing credences over a partition. However, it requires that the conditional probabilities given the partition remain fixed. Case (vii) shows that conditionals can change, so we need a more flexible rule.

  We can use a generalized version that allows for the updating of conditional probabilities as well. However, that might be too permissive.

  Alternatively, we might think of experience as providing a constraint on the posterior probabilities over a partition (as in Jeffrey) but also allow for the possibility that the experience might change the agent's conditional probabilities if the experience itself provides new information about the conditionals (as in case vii).

  But note: the shift in conditionals in (vii) is part of the update. This suggests that the experience is not just providing information about the world but also about the relationship between appearance and reality under the lighting.

  We might split the update into two parts: first, the experience directly affects the probabilities of some propositions (the "direct effect"), and second, it may also lead to a change in the conditional probabilities (the "indirect effect") when the experience itself is a learning experience about the connection between evidence and hypothesis.

  However, we need a unified principle.

  Let me state a candidate principle:

  **The Principle of Experiential Updating (PEU):**

  An agent's update of their degrees of belief in response to an experience is rational if and only if:

  1. **The Experience Constraint:** The experience directly imposes a new probability distribution over a set of propositions (which may be a partition, but not necessarily antecedently specifiable) that are directly affected by the experience. This set is called the "directly affected partition". The new distribution over this partition is determined by the experience.

  2. **The Rigidity Condition (with an exception):** The conditional probabilities of all other propositions given the elements of the directly affected partition remain unchanged, UNLESS the experience also provides new information about these conditional relationships. In that case, the conditional probabilities may be updated accordingly.

  3. **The Source Constraint:** The update must be driven solely by the experience and not by a decision to change beliefs (as in case iv). The experience must be a perceptual or quasi-perceptual input (including, as we shall see, memory) that carries information about the world.

  4. **Handling Credence 1:** If an agent has a credence of 1 in a proposition P, then upon an experience that is in conflict with P (i.e., the experience provides evidence against P), the credence in P may be lowered. However, if the experience is redundant with respect to P (i.e., it provides no new evidence about P or even confirms P without adding anything new), then the credence in P remains 1.

  Now, let's break down the clauses and relate them to the cases:

  - **Clause 1 (Experience Constraint):** 
    - This allows for non-certain updates (cases i, ii) and for updates without an antecedently specifiable partition (case iii). The partition is determined by the experience and may be inarticulate. 
    - Motivated by: (i), (ii), and (iii).

  - **Clause 2 (Rigidity Condition with exception):** 
    - Standard rigidity is required unless the experience itself informs about the conditionals. This exception is motivated by (vii). In (vii), the experience of the gallery lighting causes a shift in the conditionals (how colors appear under that lighting). 
    - Motivated by: (vii) for the exception, and (i) and (ii) for the standard rigidity (which holds in those cases because the conditionals linking the experience to the propositions are taken as fixed).

  - **Clause 3 (Source Constraint):** 
    - This distinguishes rational experiential updates from irrational decision-driven ones. In (iv), the shift is driven by a decision, not by an experience that carries information. 
    - Motivated by: (iv).

  - **Clause 4 (Handling Credence 1):** 
    - In (v), the experience (hearing the known fact) is redundant and does not lower credence. In (vi), the experience (seeing the notice) is conflicting and does lower credence. 
    - Motivated by: (v) and (vi).

  Now, let's apply the principle to the deer case:

  - **Deer case:** 
    - Initially: 0.5 deer, 0.5 shadow of the trellis (at dusk).
    - Then, a memory: the trellis was taken down that morning.
    - This memory is an experience (quasi-perceptual: a recall of a past event) that directly affects the proposition about the trellis. Specifically, it rules out the trellis shadow (since the trellis is gone). 
    - According to PEU:
      - The experience (memory) directly affects the partition {deer, shadow of the trellis}. It sets the probability of "shadow of the trellis" to 0 (or near 0, if we allow for uncertainty in memory) and thus the probability of deer to 1 (or near 1). 
      - The rigidity condition: conditional probabilities of other propositions given deer or given shadow should remain fixed (unless the memory also informs about conditionals, which it doesn't in this case). 
      - The source: memory is a type of experience that carries information (about the past removal of the trellis). 
      - Thus, the update is rational and of the same kind as the perceptual update. The principle handles it without needing a separate rule.

  Now, the continuum case:

  - **Reading an angle off a protractor:**
    - The experience provides a continuous distribution over the angle (say, a normal distribution around a measured value). 
    - We can model the directly affected partition as the continuous set of possible angles. 
    - The update: the agent's prior over the angle is updated to the posterior given by the experience (a normal distribution, for example). 
    - The rigidity condition: conditional probabilities of other propositions given the angle should remain fixed, unless the experience also informs about those conditionals (which it doesn't in this simple case). 
    - This update is rational and fits PEU. We do not need a finite partition; the partition can be continuous.

  Now, the cost: which verdicts cannot be accommodated?

  - The principle PEU can accommodate:
    - (i), (ii): standard Jeffrey update with rigidity (clause 1 and 2 without exception).
    - (iii): update without antecedently specifiable partition (clause 1) and rigidity holds (so no exception needed).
    - (iv): ruled out by the source constraint (clause 3) because it's decision-driven, not experiential.
    - (v) and (vi): handled by clause 4 (redundant experience doesn't change, conflicting does).
    - (vii): handled by clause 2 with exception (the experience informs about conditionals, so they change).

  However, note that in (iii) the partition is not antecedently specifiable, but the principle allows for that. Also, the deer case and the continuum case are handled.

  But what about the potential permissiveness? The exception in clause 2 (allowing conditionals to change) might be seen as too permissive. However, in (vii) we have a clear case where conditionals must change, so we need the exception. Without it, we couldn't account for (vii). The principle requires that the change in conditionals is also driven by the experience (so it's not arbitrary).

  The main cost is that the principle is more complex than standard Jeffrey Conditionalization. Also, the source constraint (clause 3) might be seen as vague: what counts as an "experience" and what as "quasi-perceptual"? We include memory as a type of experience because it is a source of information about the world (past). But one might argue that not all memories are equally reliable. However, the principle does not require infallibility, just that the update is driven by the experience.

  Another potential issue: in the deer case, the memory update is treated as experiential and hence rational. But what if the memory is faulty? The principle doesn't guarantee truth, only that the update is rational given the experience. So even if the memory is wrong, the update is rational.

  Is there any verdict we cannot accommodate? We seem to cover all. But note that in (iii) the shift is from 0.2 to 0.8. The principle doesn't specify how the experience sets the new probabilities. It just says that the experience imposes a new distribution. The agent must form that distribution based on the experience. This is a bit vague, but it matches the inarticulate nature of the experience. We trust the agent's ability to set the new probabilities in a way that is responsive to the experience.

  The principle does not license any arbitrary shift: it must be over a set of directly affected propositions (which are determined by the experience) and conditional probabilities must remain fixed unless the experience also informs about them.

  However, one might worry that the exception in clause 2 could be abused. But note that the experience must provide new information about the conditionals. In the gallery case, the experience of the lighting and the colors together provides that information. It would be irrational to change conditionals arbitrarily.

  Finally, the verdict I would advise to abandon if necessary: none, because the principle seems to cover all. But if forced, I might reconsider the rigidity exception. However, case (vii) seems compelling.

  Alternatively, if we wanted to avoid the rigidity exception, we might try to model the gallery case by having the experience affect a more fine-grained partition that includes both the color and the conditionals. But that might be messy and require the agent to have antecedently considered such a partition. The exception seems more natural.

  Therefore, the candidate principle is PEU as stated.

  Summary:

  **Principle of Experiential Updating (PEU):**

  An agent's update of their degrees of belief in response to an experience is rational if and only if:

  1. **Experience Constraint:** The experience directly imposes a new probability distribution over a set of propositions (the "directly affected partition") that are directly affected by the experience. This set need not be antecedently specifiable.

  2. **Rigidity Condition (with exception):** The conditional probabilities of all other propositions given the elements of the directly affected partition remain unchanged, unless the experience provides new information about these conditional relationships, in which case the conditional probabilities may be updated accordingly.

  3. **Source Constraint:** The update is driven solely by the experience, which must be a perceptual or quasi-perceptual input (including memory) that carries information about the world, and not by a decision to change beliefs.

  4. **Credence 1 Update:** If an agent has credence 1 in a proposition P, then:
     - If the experience is redundant with respect to P (i.e., it provides no new evidence about P or confirms P without adding anything new), the credence remains 1.
     - If the experience is conflicting (i.e., it provides evidence against P), the credence in P may be lowered.

  Now, for the deer case: the memory is an experience (quasi-perceptual) that directly affects the partition {deer, shadow of the trellis}, setting the probability of the shadow to 0 and deer to 1. The conditionals remain fixed (no exception needed). So it is rational and of the same kind.

  For the continuum case: the experience imposes a continuous distribution over the angle. The partition is the continuum of angles. Conditionals given the angle remain fixed. So it is rational.

  Cost: The principle might be seen as permissive in allowing the conditional probabilities to change (clause 2 exception). However, this is necessary for (vii) and is constrained by the requirement that the experience provides new information about the conditionals.

  We do not have to abandon any of the verdicts.

  Therefore, the principle PEU is proposed.
answer: |-
  Below, I present a candidate principle for how perceptual experience should rationally change degrees of belief, based on your case log and specified requirements. The principle is designed to be precise, testable against your cases, and responsive to your queries. I will state the principle, then address each of your requests in sequence: (1) explicit constraints, (2) case motivations for each clause, (3) verdict on the deer case, (4) application to the continuum case, and (5) honest assessment of costs and limitations.

  ### Candidate Principle: Experiential Justification for Credence Revision (EJCR)
  **Definition**: An experiential update is rational iff it satisfies all four clauses below.  
  **Clauses**:  
  1. **Direct Input Constraint**: The experience directly justifies a shift in credence over a set of propositions \(\mathcal{P}\) (the "input partition"), where:  
     - \(\mathcal{P}\) is a set of mutually exclusive and exhaustive propositions describing possible states of the world relevant to the experience.  
     - \(\mathcal{P}\) need not be antecedently specifiable; it may be determined *during* the experience (e.g., through gestalt recognition).  
     - The experience assigns a new probability distribution \(P_{\text{new}}\) over \(\mathcal{P}\), replacing the prior \(P_{\text{old}}\).  
     - *Formal requirement*: \(P_{\text{new}}(A) \neq P_{\text{old}}(A)\) for some \(A \in \mathcal{P}\) only if the experience provides direct, non-inferential justification for the shift.  

  2. **Conditional Rigidity Constraint**: Conditional probabilities given elements of \(\mathcal{P}\) must remain invariant unless the experience provides new information about the dependence relations themselves. Specifically:  
     - For any proposition \(B\) outside \(\mathcal{P}\), \(P_{\text{new}}(B \mid A) = P_{\text{old}}(B \mid A)\) for all \(A \in \mathcal{P}\), except when:  
       - The experience alters the agent's understanding of how \(A\) bears on \(B\) (e.g., by revealing new dependencies).  
     - *Formal requirement*: If the exception holds, \(P_{\text{new}}(B \mid A)\) must be justified by the same experience that justifies \(P_{\text{new}}(A)\).  

  3. **Source Sensitive Rigidity Constraint**: The update must be caused by an external or internal stimulus that functions as a *source of evidence*, not by a deliberate decision to believe. Specifically:  
     - The cause must be a sensory or quasi-sensory input (e.g., perception, memory, proprioception) that carries information about the world.  
     - Updates driven by volition (e.g., deciding to believe) are irrational.  
     - *Formal requirement*: The shift must counterfactually depend on the stimulus: if the stimulus had not occurred (or had differed), the shift would not have occurred (or would have differed).  

  4. **Credence-1 Vulnerability Constraint**: If \(P_{\text{old}}(A) = 1\) for some proposition \(A\), then \(P_{\text{new}}(A)\) may be less than 1 iff:  
     - The experience provides direct, non-redundant evidence against \(A\) (i.e., evidence not already accounted for in the agent's prior epistemic state).  
     - Redundant evidence (e.g., reaffirming existing knowledge) leaves \(P_{\text{new}}(A) = 1\).  
     - *Formal requirement*: \(P_{\text{new}}(A) < 1\) only if the evidence justifies positive credence in some \(\neg A\)-compatible proposition in \(\mathcal{P}\).  

  ### Constraints Made Explicit
  - **What qualifies as experiential**: The change must be driven by a sensory or quasi-sensory stimulus (perception, memory, etc.) that serves as a source of evidence about the world (Clause 3). Volitional shifts are excluded.  
  - **Antecedently specifiable partition required?**: No. \(\mathcal{P}\) may be articulated during or after the experience (Clause 1).  
  - **Conditional probabilities rigid?**: Conditionals are rigid unless the experience updates dependence relations (Clause 2).  
  - **Credence of 1 may be lowered?**: Yes, but only with non-redundant counterevidence (Clause 4).  

  ### Case Motivations for Each Clause
  - **Clause 1 (Direct Input Constraint)**:  
    - Motivated by **Case (iii)** (colleague's flat): The inarticulate sense of intrusion justifies a shift without a pre-given partition. \(\mathcal{P}\) emerges during the experience (e.g., {searched, not searched}).  
    - Also motivated by **Case (i)** (traffic light) and **Case (ii)** (card glimpse): Both involve shifts justified by direct sensory input over a partition (e.g., {red, green}).  

  - **Clause 2 (Conditional Rigidity Constraint)**:  
    - Motivated by **Case (vii)** (gallery lighting): The experience updates both colour probabilities *and* conditionals linking appearance to colour (e.g., "if lighting is \(L\), then colour \(C\) appears as \(A\)"). Rigidity fails because the experience provides new dependence information.  
    - Standard rigidity (no exception) is motivated by **Cases (i) and (ii)**: Conditionals (e.g., "if light is red, I ought to ease off accelerator") remain fixed.  

  - **Clause 3 (Source Sensitive Rigidity Constraint)**:  
    - Motivated by **Case (iv)** (Sunday resolution): The shift is irrational because it is decision-driven, not evidence-driven. The cause is volition, not experience.  
    - Contrast with **Cases (i)-(iii) and (vi)**, where shifts are sensory-driven.  

  - **Clause 4 (Credence-1 Vulnerability Constraint)**:  
    - Motivated by **Case (v)** (seminar time mentioned): No change occurs because the evidence is redundant; prior credence 1 is invulnerable.  
    - Motivated by **Case (vi)** (seminar notice): Credence drops because the notice provides non-redundant counterevidence.  

  ### Verdict on the Deer Case
  **Description**: At dusk, you assign \(P(\text{deer}) = 0.5\) and \(P(\text{shadow}) = 0.5\). Later, a memory reveals the trellis was removed, shifting credences (presumably to \(P(\text{deer}) \approx 1\), \(P(\text{shadow}) \approx 0\)).  
  **EJCR Verdict**: This is a rational experiential update of the same kind as perceptual cases (e.g., Case i), and EJCR handles it without a new rule.  
  **Analysis**:  
  - **Clause 1**: The memory is a quasi-sensory input (internal stimulus) justifying a shift over \(\mathcal{P} = \{\text{deer}, \text{shadow}\}\). \(P_{\text{new}}\) is set directly by the memory (e.g., \(P_{\text{new}}(\text{shadow}) = 0\)).  
  - **Clause 2**: Conditionals (e.g., "if shadow, then trellis present") remain rigid, as the memory does not update dependence relations.  
  - **Clause 3**: The memory is an evidence-carrying stimulus (about past trellis removal), not a volitional decision.  
  - **Clause 4**: Not applicable (no credence-1 proposition).  
  **Conclusion**: The case is not a counterexample; it is a redescription of an update EJCR already handles. Memory qualifies as "experiential" under Clause 3.  

  ### Application to the Continuum Case
  **Description**: Reading an angle from a protractor, where the input is continuous (e.g., angle \(\theta \in [0, 360)\) degrees). Any finite partition (e.g., \(\{\theta < 45\}, \{\theta \geq 45\}\)) seems arbitrary.  
  **EJCR Verdict**: The update is rational and handled by EJCR without modification.  
  **Analysis**:  
  - **Clause 1**: \(\mathcal{P}\) is the continuous set \(\{\theta\}\) (a partition over possible angles). The experience justifies a new probability density (e.g., a normal distribution centered on the reading). No finite or antecedently specified partition is needed.  
  - **Clause 2**: Conditionals (e.g., "if \(\theta = x\), then projectile lands at point \(y\)") remain rigid, as the experience does not update dependence relations.  
  - **Clause 3**: The visual input is sensory evidence.  
  - **Clause 4**: Not applicable.  
  **Implication**: EJCR naturally accommodates continuous cases by allowing \(\mathcal{P}\) to be infinite or continuous. The agent may approximate with discrete partitions post hoc, but this is not required by the principle.  

  ### Honest Assessment of Costs
  **Verdicts EJCR Cannot Fully Accommodate**:  
  - **Case (iii) (colleague's flat)**: EJCR requires \(\mathcal{P}\) to be mutually exclusive and exhaustive, but your description suggests the "sense of intrusion" may not cleanly partition possibilities (e.g., vague alternatives like "messy flatmate"). EJCR forces \(\mathcal{P}\) into existence during the update, but this may idealise inarticulate experiences.  
  - **Case (vii) (gallery lighting)**: The exception in Clause 2 permits conditional shifts, but it relies on the agent recognising that the experience "provides new information about dependence relations." This is vague and may admit irrational shifts if misapplied.  

  **Verdict to Abandon**: I advise abandoning the intuition that **Case (iii)** is *structurally identical* to Cases (i) and (ii). EJCR treats all three as experiential updates, but Case (iii) involves emergent \(\mathcal{P}\), while (i) and (ii) may use pre-existing partitions. Insisting on perfect structural parity overlooks that experiences can justify partitions *dynamically*.  

  **Risk of Permissiveness**:  
  - EJCR does not license *any* shift called "experiential." Constraints like non-volitional cause (Clause 3), direct input justification (Clause 1), and conditional rigidity (Clause 2) prevent arbitrariness.  
  - However, **Clause 2's exception** (for updating conditionals) is a cost: it risks overpermissiveness if "new information about dependence" is interpreted loosely (e.g., in Case iv, one might rationalise volition as "updating conditionals"). To mitigate, tie the exception to sensory evidence (e.g., in Case vii, the lighting *shows* how colours shift).  
  - A principle that *strictly* saves all your verdicts would indeed be vacuous: it could allow any shift if labelled "experiential," as your Case (iv) demonstrates. EJCR avoids this with its causal and justificatory constraints.  

  **Summary of Costs**:  
  - **Strengths**: EJCR handles credence-1 vulnerability (Cases v-vi), non-specifiable partitions (iii), conditional shifts (vii), and memory/continuum cases.  
  - **Weaknesses**: It idealises inarticulate experiences (iii) and risks mild permissiveness in conditional updates (vii). I recommend retaining all verdicts but clarifying that \(\mathcal{P}\)-emergence (iii) is a feature, not a flaw.  

  You can test EJCR against your log by checking: (1) whether each shift had a sensory cause (exclude volition), (2) whether \(\mathcal{P}\) was justifiably updated (even if post hoc), (3) whether conditionals shifted only with dependence evidence, and (4) whether credence-1 drops involved new counterevidence. I am confident it will align with most cases, though Case (iii) may require careful interpretation of "direct justification."
