  First I need to unpack the core tension: Wikipedia rejects eyewitness accounts that would be gold in court, while accepting potentially shaky published reports that courts would dismiss as hearsay. That's paradoxical on the surface. The user asks which "norm of assertion" explains this - knowledge? truth? justification? or something institutional?

  Looking at Wikipedia's policy wording: "must be verifiable" through "published, independent, reliable sources." Not just any source - it has to meet institutional criteria. This feels fundamentally different from knowledge norms where personal justification matters. Even if an editor knows something firsthand, Wikipedia says no unless published. That's telling.

  The courtroom comparison sharpens this. Courts care about evidence reliability too, but they treat firsthand knowledge as reliable by default. Wikipedia treats publication as the reliability filter instead. So the norms serve different purposes: courts seek legal truth, Wikipedia seeks community-verifiable knowledge.

  Where this gets philosophically tricky is the edge cases. Imagine something true but unpublished - Wikipedia removes it, which fits a source-tracking norm but clashes with knowledge/truth norms. Yet published falsehoods get admitted if deemed "reliable" sources, which no truth-based norm would allow. That suggests the norm here is fundamentally about institutional trackability.

  But is that the whole story? The "reliable sources" criterion shows Wikipedia does care about truth-conduciveness indirectly. They're optimizing for assertions that can be socially validated, not just randomly tracked. So it's a hybrid: trackability as proxy for reliability in this institutional context.

  The user also asks which rival norms could explain the practice. A strict justification norm might fit if we reinterpret "justification" as source-citation. A truth norm doesn't work because they allow false-but-sourced claims. Knowledge norm fails too - they exclude known truths. Only trackability really explains the hearsay acceptance and eyewitness rejection.

  Philosophically underdetermined areas: Could there be a "social justification" norm? Or does this expose how all assertion norms are context-dependent? The practice doesn't resolve whether truth is the ultimate goal - it just shows Wikipedia prioritizes verifiability over other epistemic values in its unique collaborative environment.
answer: |-
  The Wikipedia verifiability policy represents a distinct norm of assertion tailored to its institutional context. To reconstruct it:

  **Core Norm:** An assertion is permissible in Wikipedia if and only if it is *trackable to a published, independent source meeting Wikipedia's reliability standards*.

  ### Distinguishing Features:
  1.  **Source-Dependence over Firsthand Knowledge:** The norm explicitly *rejects* firsthand knowledge as sufficient justification for assertion within Wikipedia. An eyewitness editor cannot testify to their own experience without a published source documenting it. This fundamentally conflicts with the **knowledge norm of assertion** ("Assert that p only if you know that p") and the **truth norm** ("Assert that p only if p is true"), as both would permit the eyewitness assertion if true/known.
  2.  **Admission of Hearsay:** Secondhand reports *are* admissible, even if potentially inaccurate, provided they appear in a source deemed "reliable" by Wikipedia's criteria (e.g., established newspapers, academic journals). This contrasts sharply with the courtroom's hearsay rule.
  3.  **Rejection of Unsourced Truths:** A true claim *must* be removed if no published, reliable source exists for it. This directly violates both the truth norm and the knowledge norm (if an editor knows the unsourced truth).
  4.  **Priority of Verifiability over Accuracy:** The practice fits better with a **justification norm** ("Assert that p only if you are justified in believing that p") *only if* "justification" is redefined institutionally as *citatability to an approved source*. The primary goal isn't individual justification or even objective truth *per se*, but rather *public verifiability* – enabling *any* editor to independently check the claim against a designated external reference.

  ### Philosophical Reconstruction: The Institutional Trackability Norm
  The implicit norm is best reconstructed as a **purely institutional norm of trackable source-based assertion**:
  *   **Permissibility Condition:** An assertion is permissible iff it cites a source meeting the community's pre-defined criteria for independence and reliability.
  *   **Goal:** Ensure assertions are *publicly verifiable* and *non-original* to Wikipedia, minimizing individual bias/error and enabling collaborative oversight. Reliability is assessed *procedurally* (based on the source's type and reputation) rather than *epistemically* (directly based on the likelihood of truth).
  *   **Explaining the Hearsay Paradox:**
      *   **Wikipedia:** Welcomes "hearsay" (published secondhand reports) because its core value is *verifiability*, not firsthand accuracy. A published report, even secondhand, provides a fixed, accessible reference point for community scrutiny and source criticism. The institutional process *relies* on vetting sources rather than vetting direct knowledge claims.
      *   **Courtroom:** Bars hearsay because its core goal is establishing *reliable evidence for the specific truth of the matter asserted*. Hearsay is excluded due to risks of distortion, insincerity, and the inability to cross-examine the original declarant – threats to *evidential reliability* that outweigh its potential truth value. Firsthand testimony is preferred as the most direct evidence.

  ### What the Practice Strictly Requires vs. What it Merely Fits Well With
  *   **Strictly Requires:** Source citability meeting specific institutional criteria (published, independent, "reliable" per policy). This is non-negotiable.
  *   **Fits Well With (but Doesn't Strictly Require):**
      *   **Truth:** While Wikipedia aims for accuracy, the norm *allows* false assertions if they appear in sources deemed reliable (e.g., a reputable newspaper publishing an error). Conversely, it *excludes* true assertions lacking such sources.
      *   **Knowledge/Justification (Individual):** An editor's personal knowledge or well-justified belief is irrelevant under the strict norm; only the source matters.
      *   **Justification (Social/Procedural):** The norm *implements* a form of social justification – justification *derived from* adherence to the sourcing procedure. However, the *strict requirement* is the procedure itself (citatability), not the justification it usually provides.

  ### Philosophical Underdetermination: Rival Norms that Could License the Practice
  The practice is underdetermined regarding the *ultimate epistemic value* it serves. Several rival norms *could* explain *why* Wikipedia adopts the trackability rule, making the practice compatible with them:
  1.  **Instrumental Truth Norm:** "Assert that p only if p is true." *Why it fits:* Wikipedia could argue that requiring reliable sources is the *best available instrument* for achieving truth in a massive, anonymous, collaborative project where direct knowledge assessment is impossible. Trackability is a means to truth.
  2.  **Reduced Risk/Accountability Norm:** "Assert that p only in such a way that the risk of error or bias is minimized and the asserter can be held accountable." *Why it fits:* Sourcing shifts accountability to the external source and provides a concrete basis for challenging assertions ("Show me the source!"). It minimizes the risk inherent in relying on anonymous editors' personal claims.
  3.  **Consensus/Stability Norm:** "Assert that p only if it can be grounded in a publicly accessible reference point enabling stable consensus." *Why it fits:* Citability provides a shared, fixed anchor for discussion and dispute resolution ("The source says X" vs. "I know X"), crucial for collaboration. Truth becomes secondary to building stable, referenceable content.
  4.  **Anti-Corruption/Neutrality Norm:** "Assert that p only if the assertion is free from original research and personal bias." *Why it fits:* Banning firsthand knowledge and requiring independent sources is a primary mechanism to enforce Neutral Point of View (NPOV) and prevent editors from inserting their own interpretations or unpublished syntheses.

  ### Conclusion
  Wikipedia's verifiability policy presupposes a unique **institutional norm of trackable source-based assertion**. It strictly requires citability to approved sources, explicitly overriding individual knowledge or truth. It welcomes hearsay (published secondhand reports) as the *currency* of verifiability, while the courtroom excludes hearsay to prioritize direct evidential reliability. While the practice *fits* instrumental goals of truth, accountability, consensus, and neutrality, it is *strictly defined* by the procedural requirement of source trackability. Philosophically, the practice is underdetermined regarding its ultimate justification; it is compatible with rival norms (Instrumental Truth, Reduced Risk, Consensus, Anti-Corruption) that offer different explanations for *why* trackability is paramount in this specific institutional context. The core distinction lies in Wikipedia's foundational need for *publicly verifiable, non-original* content as a prerequisite for collaborative encyclopedic writing.
