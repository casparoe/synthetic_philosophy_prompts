prompt: |-
  My two friends Maya and Dev got into it after we saw a news story that a painting at our local museum had been reattributed — the master apparently only painted the faces, his workshop did everything else, and the museum had known for a decade without saying anything. The argument started about whether we'd been ripped off but quickly got more general.

  Maya's position was that the value of an original is basically causal: what we pay for, when we crowd around an original, is standing in front of the actual object the artist's hand produced, and a duplicate — even a molecule-for-molecule duplicate — just doesn't have that history. Dev said that's relic worship, no different from venerating a saint's fingerbone: everything we actually love about the painting is fully present in a good reproduction or a perfect copy, so the extra value has to be something we bring to it, not something in the picture. Maya replied that "something we bring to it" isn't a debunking — people also care whether they're hearing a live performance vs. a recording, and caring about the actual historical object isn't obviously irrational, just not aesthetic in the narrow sense. Dev then fired back with a swap case: suppose the museum secretly hung a perfect duplicate, kept the original in the vault, and nobody could tell even on close inspection. The visitors would be getting the full experience Maya says matters — same room, same light, paint strokes indistinguishable — so on her own account they lose nothing, yet everyone agrees they'd be wronged if the swap came out. Maya's answer was that they're wronged because they're deceived about history: what the object is connected to, not what it looks like, and the fact that people feel betrayed and no one thinks that feeling is silly is actually evidence for her side, not Dev's. Dev said that just shows provenance functions like a guarantee of authenticity — an invisible certificate — which is fine for the art market but can't be why the original matters to people who just want to look.

  Can you adjudicate this move by move — who's right at each step, and whether Maya's causal-history story or Dev's "it's all brought by us" story better fits the swap case? I couldn't tell whether Dev's swap argument actually works or whether Maya has a good reply to it. Lead with your bottom line in the first sentence, then give the reasoning, and don't restate the question back to me first.
reasoning: |-
  Okay, the user wants me to adjudicate an argument between Maya and Dev about the value of original artworks versus reproductions. Let me start by understanding their positions. Maya believes the value comes from the causal history—being connected to the artist's creation. Dev argues that the aesthetic experience is what matters, and any extra value is something we impose, like provenance.

  The key moment is Dev's swap case: if a museum secretly replaces the original with a perfect copy, visitors can't tell the difference. Dev claims they lose nothing, but if the swap is revealed, people feel wronged. Maya counters that the deception is about the historical connection, not the appearance, and that feeling betrayed supports her view.

  First, I need to assess the swap argument. If visitors get the same visual experience, Dev's point seems strong. But Maya's response about historical connection makes sense. People value knowing they're in the presence of the actual object the artist touched. The betrayal feeling arises because they were deprived of that authentic connection, even if the visual was identical.

  Looking deeper, the swap case actually highlights that the value isn't just aesthetic. It's about authenticity and the narrative. The museum's deception breaks the trust in the shared understanding of the artwork's history. Provenance isn't just a certificate; it's part of the artwork's identity in the cultural context.

  Dev's view reduces the artwork to its perceptible qualities, but art has a social dimension. The original's history contributes to its meaning. For example, a live performance vs. recording: both can sound similar, but the live event has a unique, unrepeatable presence. Similarly, the original painting carries the artist's tangible legacy.

  Maya's point about deception targeting history, not appearance, is crucial. The value comes from the object's origin, which isn't replicable. Even a perfect copy lacks that causal chain. The emotional response to the swap validates that people care about more than just visuals.

  So Maya's causal-history story better explains the swap case. Dev's argument overlooks the significance of authenticity beyond aesthetics. The bottom line is Maya's position aligns more with why people feel wronged when deceived about an artwork's origins.
answer: |-
  **Bottom line: Maya's causal-history account better captures why the swap case involves a genuine wrong and explains the core value of originals, though Dev's insights about the "brought by us" aspect highlight important non-aesthetic motivations.**

  Here's the move-by-move adjudication:

  1.  **Maya's Initial Claim (Causal-History Value):** Maya is **largely right**. The value of standing before the *actual* object created by the artist is a distinct historical and experiential category. It's not *just* about the physical object *now*, but its causal link to the artist and its journey through time. This resonates with how we value historical artifacts and unique events.

  2.  **Dev's First Counter (Relic Worship / Reproduction Suffices):** Dev is **partially right but misses the point**. He's correct that the *aesthetic properties* (colors, composition, visible brushwork) can be replicated, and that the *intense experience* of viewing can occur with a reproduction. However, he wrongly dismisses the value of the causal history as mere superstition ("relic worship"). The value Maya describes isn't solely aesthetic; it's also historical, cultural, and about connection to the creative act itself, which isn't inherent in a copy.

  3.  **Maya's Reply (Live vs. Recording Analogy / Not Irrational):** Maya is **strong here**. She correctly distinguishes narrow aesthetics from broader experiential values. Caring about authenticity (original object, live performance) is a deeply ingrained human response tied to history, presence, and uniqueness. It's not irrational; it's valuing a different *kind* of experience – one intrinsically linked to the object's origin and authenticity.

  4.  **Dev's Swap Argument (Perfect Duplicate / No Loss / Wronged if Found Out):** Dev's *description* of the swap case is accurate, but his **conclusion is flawed**. He's right that visitors get the *identical visual/aesthetic experience* Maya focused on initially. He's also right that people would feel wronged if the deception was revealed. **Where he fails** is in claiming this proves the *only* extra value is a "brought by us" guarantee/certificate. The swap case doesn't debunk Maya; it *tests* her theory.

  5.  **Maya's Response to Swap (Deception About History / Feeling Betrayed is Evidence):** Maya is **ultimately correct here, and this is the crux.** Her reply refines and strengthens her position:
      *   **Deception About History:** The wrong isn't about missing visual qualities (they saw them all). It's about being deceived concerning the *historical identity* of the object. They paid/visited believing they were experiencing *the thing Rembrandt touched*, not a perfect replica. This historical connection *is* the value Maya defined.
      *   **Feeling Betrayed is Evidence:** The visceral sense of betrayal people feel *is* powerful evidence *for* Maya's causal-history account. It demonstrates that the historical authenticity *itself* holds significant value for people, independent of the immediate visual perception. If Dev were right that *only* the visual experience mattered, the revelation of a swap shouldn't cause such outrage – but it universally does.

  6.  **Dev's Final Claim (Provenance as Certificate / Only Matters for Market):** Dev is **mistaken**. While provenance *does* function as a market guarantee, Maya successfully shows the value of the causal history goes deeper. People aren't primarily upset about *market* deception (unless they are collectors); they are upset about *experiential* deception. They wanted to connect with history, and that connection was false. This desire for authentic connection is a core reason people visit museums and value originals, distinct from just appreciating the image.

  **Why Maya's Causal-History Wins in the Swap Case:**
  *   The swap case *confirms* that the causal history is a distinct component of value. People feel profoundly wronged *precisely because* they were deprived of the authentic historical object, even while having the perfect visual experience.
  *   The value isn't *just* "brought by us" like an arbitrary label (Dev's certificate). It arises from the *actual, real-world connection* between the object and the artist/event. We *assign* significance to that connection, but the connection itself is objective history. The museum lied about that objective historical fact.
  *   Dev's "brought by us" view reduces the value to either aesthetics (which the swap provides) or an arbitrary social construct (like a certificate). But the betrayal stems from the *denial of a real, desired connection to history*, not the denial of a certificate. Maya's account explains the depth and nature of the wrong better.

  **Dev's Contribution:**
  Dev usefully highlights that the *immediate aesthetic experience* is separable and reproducible. He also correctly identifies that the *intensity* of value placed on originals involves social and psychological factors ("brought by us"). However, he fails to recognize that these factors are often *responding to* the genuine, non-replicable fact of the object's history, not creating an arbitrary value ex nihilo.
