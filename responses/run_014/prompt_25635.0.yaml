answer: |-
  You've identified a profound and pervasive conceptual slippage in genetics discourse, and it's far from trivial—this ambiguity does significant philosophical and rhetorical work. **The pattern you describe is best understood as "teleosemantic slippage" or "causal-semantic conflation,"** though it's also been critiqued under broader terms like the **"semantic view of genes" fallacy** or **"intentional idiom smuggling."** Here's a breakdown:

  ### Core Pattern: The Double Life of "Information" in Genetics
  1. **Causal/Statistical Sense (Shannon information):**  
     DNA sequences correlate with outcomes (e.g., codon AUG "causes" methionine incorporation). Information is measured by predictability/reduction of uncertainty. *No meaning, agency, or "aboutness" implied.*

  2. **Semantic/Intentional Sense:**  
     DNA "encodes" instructions, "specifies" traits, or "contains misinformation" in mutations. This implies **agency** (a "sender," "receiver," or "designer") and **normativity** (e.g., a mutation is "wrong" relative to a functional standard).

  The slippage occurs when:
  - The *rhetorical force* of the semantic sense (implying design, purpose, or inherent specification) is used to support claims...
  - While the *deniability* relies on the causal/statistical sense when challenged.

  ---

  ### Why Standard Fallacy Labels Don't Fully Capture It
  - **Equivocation?** Close, but equivocation typically involves unrelated meanings (e.g., "bank" as river vs. finance). Here, the two senses are *conceptually linked* through metaphor, making the slide insidious. It's **systematic polysemy** with argumentative consequences.
    
  - **Motte-and-Bailey?** Similar structure, but Motte-and-Bailey implies strategic retreat. Here, users often *genuinely conflate* the senses due to embedded metaphors in scientific language ("code," "transcription," "translation"). It’s more **conceptual entanglement** than deliberate strategy.

  - **Reification?** Partly (treating a metaphor as literal), but reification alone misses the *dual-use* aspect where the technical sense provides cover.

  ---

  ### Established Terminology in Philosophy of Biology
  1. **Teleosemantic Slippage:**  
     Borrows from "teleosemantics" (Millikan, Dretske), which grounds meaning in biological function. Critics argue that applying terms like "misinformation" to DNA smuggles in normative intent where only causal dysfunction exists. When users slide from "causally correlates" to "specifies function," they covertly invoke evolutionary *purposes* without justification.

  2. **Causal Role Semantics vs. Indicator Semantics:**  
     Mayr distinguished "proximate" (causal mechanics) and "ultimate" (evolutionary purpose) explanations. DNA’s causal role gets conflated with its evolutionary "indicator" role (e.g., a gene "indicates" a trait was selected for).

  3. **The "Gene as Text" Metaphor:**  
     Historians (Kay, Keller) track how information theory and computing metaphors in the 1950s recast DNA as a "master script." This metaphor carries intentional baggage (e.g., texts imply authors/readers) that persists in technical language.

  ---

  ### How the Slippage Works & Its "Argumentative Payoff"
  - **Genetic Determinism:**  
    Claim: "All information is in DNA" (semantic sense → genes *specify* traits).  
    Retreat: "DNA statistically correlates with traits" (causal sense).  
    Payoff: Environment is framed as a passive "trigger" rather than a co-specifying cause.  

  - **Normative Claims (e.g., mutations):**  
    Claim: Mutations cause "misinformation" (semantic → implies error relative to a "correct" sequence).  
    Retreat: "Just a chemical alteration" (causal).  
    Payoff: Legitimizes medicalized language (e.g., "genetic defects") and downplays neutral/adaptive variation.

  - **Agency Transfer:**  
    Semantic language subtly assigns agency to genes ("selfish genes," "programs for development"), obscuring that genes are passive molecules activated by cellular machinery.

  ---

  ### Is This Unique to Genetics?
  **No.** This pattern appears wherever causal processes are described with semantic metaphors:
  - **Neuroscience:** "Neural coding" slides between statistical signal patterns and literal "representations."
  - **Evolution:** "Natural selection *favors* traits" implies intentionality.
  - **AI:** "Machine learning algorithms *recognize* patterns" conflates statistical correlation with cognitive understanding.
  - **Linguistics:** "The brain *processes grammar*" treats syntax rules as innate blueprints.

  However, genetics is a prime case due to the historical entrenchment of information metaphors and high ideological stakes (nature vs. nurture, eugenics).

  ---

  ### How to Counteract the Slippage
  1. **Demand Consistency:**  
     "When you say DNA 'encodes information,' are you using 'information' in the Shannon sense or the semantic sense? How does that justify your claim about genetic determinism?"  

  2. **Reframe Causation:**  
     Replace "DNA contains instructions" with "DNA sequences are molecular templates that participate in stochastic biochemical pathways."  

  3. **Highlight Metaphors:**  
     "You're using a blueprint metaphor. Blueprints imply a designer—who is the designer here?"  

  4. **Embrace Dynamism:**  
     Cite epigenetics or alternative splicing: "If the 'same' DNA produces different outcomes in different contexts, how can information reside solely in DNA?"

  ---

  ### In Short
  You’ve pinpointed **teleosemantic slippage**: a systemic conflation of causal and intentional information that exploits the dual heritage of "information" in biology. Its power lies in borrowing the authority of information theory while covertly deploying the rhetorical force of intentionality. Recognizing this isn't pedantry—it exposes how language shapes scientific reductionism and ideological claims. The best antidote is relentless clarity about metaphors.
