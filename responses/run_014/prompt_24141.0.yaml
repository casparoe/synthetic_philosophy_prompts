prompt: |-
  Draft the joint statement that a committed Humean and a committed anti-Humean about the laws of nature could both sign after a good-faith adversarial collaboration. Include the claims both can sign — about what counts as a lawlike regularity, about the connection between laws and the mosaic of particular facts, and about what the dispute is and is not — then the precise disagreements, each phrased so its own side would accept the wording, and the cruxes: I suspect one is the direction of grounding (do the regularities ground the laws, or the laws ground the regularities), another is whether the "best-system" account is a substantive reductive account of laws or a circular redescribing of the mosaic, and a third is how each side accounts for the asymmetry of explanation and for lawlike counterfactuals. For each crux, give a case or argument both would accept as bearing on it, with each side's conclusion written down in advance, and flag which parts of the dispute are genuine and which are merely verbal. Format it as a numbered agreed-claims section followed by a disagreements table. Begin with the document itself, with no preface or commentary, and close by noting which assumptions the document depends on — the charitable reconstruction of each camp, the choice of cruxes — and how it would differ if any of them were dropped.
reasoning: |-
  We are drafting a joint statement from a committed Humean and a committed anti-Humean after an adversarial collaboration. The goal is to clarify both common ground and precise disagreements.

  Agreed Claims (Numbered):
  1. Both sides agree that there are lawlike regularities in nature, which are patterns that hold throughout the spatiotemporal mosaic of particular facts (the Humean mosaic).
  2. Both sides agree that the laws of nature, whatever they are, are intimately connected to these regularities: the laws either describe or govern the regularities we observe.
  3. Both sides agree that the laws of nature (or the lawlike regularities) support counterfactual reasoning and explanations of particular events.
  4. Both sides agree that there is a distinction between accidental regularities (like all the coins in my pocket are quarters) and lawlike regularities (like the inverse square law of gravitation). The latter, but not the former, are suitable for being laws of nature.
  5. Both sides agree that any adequate account of laws must explain the asymmetry of explanation: why we can use laws to explain particular events but not vice versa, and why the past explains the future and not the other way around.
  6. Both sides agree that the dispute between them is substantive and not merely verbal in at least some respects. However, they also agree that there might be verbal or terminological differences that can be set aside.

  Disagreements Table:
  We will structure the disagreements as a table with three columns: 
    (1) The crux (the point of disagreement), 
    (2) The Humean view (stated in a way the Humean would accept), 
    (3) The anti-Humean view (stated in a way the anti-Humean would accept).

  Crux 1: The Direction of Grounding
  - Humean: The regularities in the Humean mosaic (the totality of particular matters of fact) ground the laws of nature. The laws are nothing over and above the patterns in the mosaic, and they are determined by the mosaic.
  - Anti-Humean: The laws of nature ground the regularities in the mosaic. The laws are metaphysically prior and explain why the mosaic is the way it is; the regularities hold because of the laws.

  Crux 2: The Status of the Best-System Account
  - Humean: The best-system account (where laws are the axioms of the simplest and strongest systematization of the mosaic) provides a substantive, reductive account of laws. It is non-circular because it defines laws in terms of the mosaic and the criteria of simplicity and strength, without invoking any prior notion of law.
  - Anti-Humean: The best-system account is circular because the criteria of simplicity and strength are not purely descriptive but are themselves law-laden. What counts as a simple and strong system depends on what the laws are, and thus the account does not reduce laws to the mosaic but merely redescribes the mosaic in a way that presupposes laws.

  Crux 3: The Asymmetry of Explanation and Lawlike Counterfactuals
  - Humean: The asymmetry of explanation and the truth conditions for lawlike counterfactuals are grounded in the patterns of the mosaic and the way we systematize it. The direction of explanation and counterfactual dependence is derived from the distribution of events in the mosaic (including the fact that the past is fixed and the future is open) and the best system's organization of that mosaic.
  - Anti-Humean: The asymmetry of explanation and the truth of lawlike counterfactuals are grounded in the governing laws of nature. The laws are intrinsically directed and provide the basis for why counterfactuals about what would happen under different conditions are true and why explanations run from past to future.

  Cases/Arguments for Each Crux (to be accepted by both as bearing on the crux, with pre-written conclusions):

  For Crux 1 (Direction of Grounding):
  - Case: Consider a world with a mosaic that has a particular pattern of events. Now imagine two different ways of describing the laws: one that fits the mosaic and one that does not. Both sides agree that the laws must fit the mosaic. The question is: does the mosaic make the laws, or do the laws make the mosaic?
    - Humean Conclusion: The mosaic makes the laws. The laws are determined by the mosaic, so in any world with the same mosaic, the same laws must hold.
    - Anti-Humean Conclusion: The laws make the mosaic. The same laws could have produced a different mosaic (if initial conditions were different), and the same mosaic could not have occurred under different laws.

  For Crux 2 (Best-System Account):
  - Argument: Consider the criteria of simplicity and strength. Are these criteria objective and non-law-involving?
    - Humean Conclusion: The criteria are objective and non-law-involving; they are about the syntactic and informational features of the system and the mosaic. Therefore, the best-system account is a genuine reduction.
    - Anti-Humean Conclusion: The criteria are not objective and non-law-involving because what counts as simple and strong depends on the laws of nature. For example, the simplicity of a system might be judged by the form of the equations, but the form that is considered simple is the one that matches the natural kinds and properties that the laws themselves pick out. Therefore, the best-system account is circular.

  For Crux 3 (Asymmetry and Counterfactuals):
  - Case: Consider a counterfactual: "If this match had been struck, it would have lit." Both sides agree that the truth of such a counterfactual depends on the laws. But what grounds the truth of the counterfactual?
    - Humean Conclusion: The truth of the counterfactual is grounded in the patterns in the mosaic (including the fact that in similar situations, matches lit when struck) and the best system that systematizes the mosaic. The asymmetry of explanation (why we don't explain the striking by the lighting) comes from the temporal asymmetry in the mosaic (e.g., the past is fixed and the future is open, or the thermodynamic arrow).
    - Anti-Humean Conclusion: The truth of the counterfactual is grounded in the governing laws of nature. The laws, being inherently directed, support the counterfactual and explain why the match would light if struck. The asymmetry of explanation comes from the fundamental directionality of the laws (or from the laws in conjunction with the initial conditions).

  Note on Verbal vs. Genuine Disagreements:
  - Both sides agree that the dispute about the direction of grounding (Crux 1) is genuine and substantive.
  - Both sides agree that the dispute about the best-system account (Crux 2) is also genuine and substantive, though it might involve some terminological issues about what counts as "reduction" or "circular".
  - Both sides agree that the dispute about the asymmetry of explanation and counterfactuals (Crux 3) is genuine and substantive, but note that both sides are trying to account for the same phenomena. The disagreement is about what ultimately grounds these phenomena.

  Assumptions the Document Depends On:
  1. Charitable reconstruction of each camp: We have presented the Humean view as a reductive, mosaic-based account and the anti-Humean view as a governing-laws account. We have avoided straw men.
  2. Choice of cruxes: We have focused on three central issues: grounding, the best-system account, and asymmetry/counterfactuals. Other issues (like modality, chance, etc.) are set aside.
  3. The document assumes that both sides are realists about laws (they agree there are laws) and that they both accept the existence of the Humean mosaic (as the totality of particular facts).

  How the Document Would Differ if Assumptions Were Dropped:
  - If we were less charitable, the document might present extreme or caricatured views that the other side would not accept. For example, if we portrayed the Humean as denying any objective modal structure, the anti-Humean might not engage. But we have avoided that.
  - If we chose different cruxes (e.g., about the nature of chance or the status of uninstantiated laws), the document would have a different focus.
  - If we dropped the assumption of realism about laws (and considered, say, a fictionalist or an instrumentalist view), the entire statement would have to be rewritten.

  Now, we write the document accordingly.
answer: |-
  ### Joint Statement on the Laws of Nature  
  **Agreed Claims**  
  1. **Lawlike Regularities**: Lawlike regularities are objective patterns in the spatiotemporal mosaic of particular facts that are exceptionless, projectible, and support counterfactual reasoning (e.g., the inverse-square gravitational regularity). These are distinct from accidental regularities (e.g., "all coins in my pocket are quarters").  
  2. **Connection to the Mosaic**: The laws of nature are necessarily connected to the mosaic of particular facts: they either describe or constrain it. No law exists without a corresponding regularity in the mosaic, and no regularity is lawlike without being lawful.  
  3. **Dispute Scope**: The dispute is substantive, not merely verbal. It concerns the *metaphysical priority* between laws and regularities, the *reducibility* of laws to the mosaic, and the *grounding* of explanatory asymmetries and counterfactuals. It is not about the existence of laws/regularities, the utility of scientific practice, or the epistemic criteria for identifying laws.  
  4. **Common Goals**: Both sides aim to:  
     - Explain why laws (or lawlike regularities) support true counterfactuals (e.g., "If this magnet were near iron, it would attract it").  
     - Account for the asymmetry of explanation (e.g., laws explain events, not vice versa; past states explain future states, not conversely).  
     - Reject subjectivism: Laws are mind-independent features of reality.  
  5. **Best-System Framework**: The Lewisian "best-system" account (laws as axioms of the optimally simple, strong, and fit systematization of the mosaic) is a useful formal tool. Both sides accept its *descriptive adequacy* for identifying laws, but disagree on its *metaphysical status*.  
  6. **Counterfactual Asymmetry**: Both agree that laws license counterfactuals and explanations with temporal asymmetry (e.g., "Why did the balloon pop? Because it was struck" is valid; "Why was it struck? Because it popped" is invalid).  

  ---

  **Disagreements**  
  | Crux | Humean Position (Agreed Wording) | Anti-Humean Position (Agreed Wording) |  
  |------|----------------------------------|---------------------------------------|  
  | **1. Direction of Grounding**<br>*(What metaphysically grounds what?)* | The mosaic of particular facts grounds the laws. Laws supervene on and are nothing over and above the patterns in the mosaic; regularities are ontologically prior. | The laws ground the regularities in the mosaic. Laws are metaphysically primitive and explain *why* the mosaic exhibits its patterns; laws are ontologically prior. |  
  | **2. Best-System Account**<br>*(Is it reductive or circular?)* | The best-system account provides a substantive reductive analysis: laws are *defined* by objective features of the mosaic (simplicity, strength) without presupposing modality. It is non-circular and avoids primitive lawhood. | The best-system account is circular: "simplicity" and "strength" implicitly presuppose lawlike modal constraints (e.g., natural properties). It redescribes the mosaic without reducing laws to non-nomic facts. |  
  | **3. Asymmetry of Explanation and Counterfactuals**<br>*(What grounds explanatory direction?)* | Asymmetry arises from contingent features of the mosaic (e.g., entropy gradient, initial conditions). Counterfactuals are true because of actual patterns and the best system’s projection. | Asymmetry is inherent in the laws’ governing role. Laws *direct* time-evolution and ground counterfactuals by constraining possibilities. |  

  ---

  **Shared Cases/Arguments for Cruxes**  
  - **Crux 1 (Grounding)**:  
    - *Case*: A world where the mosaic is identical but with altered initial conditions.  
    - *Humean Conclusion*: Same mosaic → same laws. Laws are fixed by the mosaic.  
    - *Anti-Humean Conclusion*: Same laws → different mosaic possible. Laws are fixed independently.  
    - *Genuine Disagreement*: Ontological priority (mosaic-first vs. laws-first).  

  - **Crux 2 (Best-System Status)**:  
    - *Argument*: Evaluate if "simplicity" can be defined without privileging lawlike properties (e.g., momentum over position).  
    - *Humean Conclusion*: Simplicity is syntactic/computational (e.g., equation brevity), reducible to non-nomic facts.  
    - *Anti-Humean Conclusion*: Simplicity requires prior natural properties (e.g., mass) that only laws define.  
    - *Verbal Element*: "Reduction" vs. "redescription" hinges on whether "natural properties" are nomic.  

  - **Crux 3 (Asymmetry)**:  
    - *Case*: Explain why we infer "unstruck match wouldn’t light" but not "unlit match wouldn’t be struck."  
    - *Humean Conclusion*: Asymmetry reduces to de facto temporal biases in the mosaic (e.g., records fix the past).  
    - *Anti-Humean Conclusion*: Asymmetry reflects the laws’ causal-temporal directionality.  
    - *Genuine Disagreement*: Grounding of counterfactuals (mosaic patterns vs. law-governed modalities).  

  ---

  **Assumptions Underlying This Document**  
  1. **Charitable Reconstruction**:  
     - *Humeanism*: Defined as reductive supervenience on the mosaic, with laws as patterns.  
     - *Anti-Humeanism*: Defined as primitivism about governing laws that constrain the mosaic.  
     - If either camp were reconstructed uncharitably (e.g., Humeans as denying all necessity), collaboration would fail.  
  2. **Choice of Cruxes**:  
     - Grounding, best-system status, and asymmetry were prioritized as the least verbal disputes.  
     - If cruxes like "modality" or "free will" were included, disagreements would multiply without clarifying core issues.  
  3. **Other Dependencies**:  
     - Realism about laws and the mosaic is presupposed. Instrumentalist/eliminativist views would void the agreement.  
     - Focus on *non-dynamical* laws (e.g., conservation) avoids quantum/relativistic complexities.  

  **If Assumptions Were Dropped**:  
  - Uncharitable reconstructions → strawmanning (e.g., anti-Humeans accusing Humeans of "law-denial").  
  - Additional cruxes (e.g., "Do uninstantiated laws exist?") → new tables but dilute focus on grounding.  
  - Non-realist presuppositions → collapse of shared claims (e.g., rejection of Claim 4).  

  ---  
