  The single change that would restore overall consistency at the least cost (in terms of the number of commitments dropped) is to drop IIA (3). Then we can use KS and keep the other four.

  Conclusion:

  The most severe tension is between IIA (3) and SAL (5) (and also between IIA and RM). 

  We recommend dropping IIA and adopting the Kalai-Smorodinsky solution, which will then satisfy:
