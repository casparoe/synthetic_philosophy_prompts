  Option 2: Drop SAL (5) and also note that we are then forced to drop RM (4) if we keep IIA? Not necessarily: but we know that Nash (which satisfies IIA) doesn't satisfy RM. However, is there a solution that satisfies IIA, RM, and the others? Actually, it is known that the only solution satisfying Pareto efficiency, symmetry, IAT, and IIA is the Nash solution. And we saw that Nash does not satisfy RM. Also, if we drop SAL (5) and want RM, we might consider other solutions? But note that without SAL, we are not requiring the proportionality to the ideal point. However, we still have the conflict between IIA and RM.

  In fact, it is known that there is no solution that satisfies IIA and RM together with the other standard axioms (like Pareto efficiency) for two-player bargaining problems. So we must choose.

  The cheapest revision (in terms of the number of commitments to drop) is to drop one commitment. If we drop IIA (3), then we can have the rest (1,2,4,5) with KS. Alternatively, if we drop SAL (5) and RM (4), then we can have IIA (3) and the rest with Nash. But that would require dropping two. Alternatively, we might drop RM (4) and keep IIA (3) and drop SAL (5) and use Nash. But then we don't have SAL and we don't have RM.

  The minimal cost to restore consistency is to drop one commitment: either (3) or (5). But note that if we drop (3), we can keep (1,2,4,5) with KS. If we drop (5), then we can use Nash which satisfies (1,2,3) but not (4) and (5). So then we are also violating (4). Therefore, if we want to keep (4) we have to drop (3) and use KS. But if we are willing to drop both (4) and (5), then we can use Nash and keep (1,2,3). 

