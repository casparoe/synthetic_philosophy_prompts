    However, consider a different expansion. Let S be the same. Let T' be the convex hull of S and a new point (0.8, 0.3). Then T' is the convex hull of (0,0), (1,0), (0,1), (0.8,0.3). The Pareto frontier now includes the line from (1,0) to (0.8,0.3) and then to (0,1). The Nash solution in T' might be at (0.8,0.3) if that gives a higher product? (0.8*0.3=0.24) vs (0.5,0.5)=0.25 -> no. But if we take (0.9,0.4) then 0.9*0.4=0.36>0.25. So if we add (0.9,0.4), the Nash solution moves to (0.9,0.4). Then player1 goes from 0.5 to 0.9 (increase) and player2 from 0.5 to 0.4 (decrease). But note that the expansion T' does not satisfy the premise of RM for either player? For player1: at u2=0.5, in S the maximum u1 was 0.5. In T', at u2=0.5, we can have u1=0.9? Actually, we need to check: the line from (0.9,0.4) to (0,1) has equation: u2 = 0.4 + (0.6/0.9)*(0.9-u1) for u1 in [0,0.9]? That might not be linear. Actually, the Pareto frontier in T' is the line segments: (1,0) to (0.9,0.4) and (0.9,0.4) to (0,1). At u2=0.5, we are on the segment from (0.9,0.4) to (0,1). The equation: 
      u2 - 0.4 = m (u1 - 0.9)
      from (0.9,0.4) to (0,1): m = (1-0.4)/(0-0.9) = 0.6/-0.9 = -2/3.
      So u2 = 0.4 - (2/3)(u1-0.9) = 0.4 - (2/3)u1 + 0.6 = 1 - (2/3)u1.
      Set u2=0.5: 0.5 = 1 - (2/3)u1 => (2/3)u1 = 0.5 => u1=0.75.
      So at u2=0.5, the maximum u1 is 0.75 (in T') which is more than 0.5 (in S). Similarly, for player2: at u1=0.5, we are on the same segment: u2 = 1 - (2/3)*0.5 = 1 - 1/3 = 2/3 ≈ 0.666, which is more than the 0.5 in S. So the expansion T' weakly improves both players' attainable payoffs at every level of the other. Then RM would require that both players' payoffs do not decrease. However, in the Nash solution, player1 increases (0.5->0.9) but player2 decreases (0.5->0.4). So player2's payoff decreases. Thus, Nash violates RM in this expansion.

    Therefore, the Nash solution does not satisfy RM.

  4. Kalai-Smorodinsky solution (KS):
     - Satisfies (1) Symmetry: if the problem is symmetric, then the ideal point is symmetric and the solution will be symmetric.
     - Satisfies (2) IAT: the ideal point transforms accordingly, so the solution is invariant.
     - Does not satisfy (3) IIA: as discussed.
     - Satisfies (4) RM: known to be resource monotonic (if the feasible set expands, the ideal point may change but the KS solution adjusts so that the payoff of a player whose opportunities improve does not decrease).
     - Satisfies (5) SAL: by definition.

  Now, tensions:

  - (3) IIA and (5) SAL are incompatible because they are the defining differences between Nash and KS. One cannot have both.
  - (4) RM and (3) IIA: The Nash solution (which satisfies IIA) does not satisfy RM, and the KS solution (which satisfies RM) does not satisfy IIA. So there is a tension between RM and IIA.

  Which pairs are only apparent tensions?

  - We don't see any other immediate tensions.

  Cheapest revision to restore consistency:

  We have two main tensions: 
    A. Between (3) IIA and (5) SAL (and also between (3) IIA and (4) RM).
    B. Between (4) RM and (3) IIA.

  To restore consistency, we must drop one of the conflicting commitments.

