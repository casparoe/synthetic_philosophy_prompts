  We are given five desiderata for a bargaining solution:

  1. Symmetry
  2. Invariance to positive affine transformations (IAT)
  3. Independence of irrelevant alternatives (IIA)
  4. Resource monotonicity (RM)
  5. Sensitivity to aspiration levels (SAL) [defined as proportional division of surplus to max attainable gains]

  We are to check for tensions among these and then see which standard solution concepts (like Nash or Kalai-Smorodinsky) fit.

  First, recall the standard solution concepts:

  - Nash bargaining solution (NBS): maximizes the product of gains over the disagreement point (u_i - d_i) in the feasible set.
  - Kalai-Smorodinsky (KS): sets the gains proportional to the ideal point (each player's maximum feasible utility above the disagreement point, assuming the other player is at their disagreement).

  Now, let's analyze the commitments:

  (5) Sensitivity to aspiration levels: This is exactly the Kalai-Smorodinsky solution's defining property. So KS satisfies (5). However, note that (5) requires that the surplus division is proportional to the maximum attainable utility above the disagreement point (i.e., the ideal point). 

