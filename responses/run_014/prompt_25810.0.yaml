prompt: |-
  I run a small behavioral insights team inside a city government. We design nudges — default changes, social norm messages, simplified forms — for stuff like tax compliance, recycling rates, vaccination uptake. Lately the city council's been on us about whether we're just doing paternalism by another name, and honestly we dont have a clear internal standard for where the line is. I need a decision procedure my team can actually use to screen a proposed nudge before we pitch it. Give me exactly five questions we ask in order, each with a stop/go rule (like "if the answer is X, the nudge is out" or "proceed to next question"). The procedure should handle the hard cases: nudges that work by exploiting a cognitive bias the target doesnt know about, nudges where the primary beneficiary is the government not the citizen, and nudges we'd be embarrassed to describe publicly. Be honest about which steps are value judgments dressed up as procedure. Then walk two proposals through the five questions: (a) switching a city form so residents default to organ donor status unless they check an opt-out box, and (b) sending a letter to late tax filers saying "9 out of 10 of your neighbors already paid." Format the whole response as exactly five numbered items — no intro paragraph, no concluding paragraph, just the five questions with their rules and how each proposal fares.
reasoning: |-
  We are designing a 5-question decision procedure for evaluating nudges. The questions should address ethical concerns, including exploitation of cognitive biases, beneficiary (government vs. citizen), and transparency. Each question has a stop/go rule. The procedure must handle hard cases.

   Proposed Five Questions with Stop/Go Rules:

   1. **Question: Does the nudge significantly restrict freedom of choice?**
     - *Rule:* If the nudge removes or severely limits viable alternatives (e.g., making it extremely difficult to choose an option other than the default), then stop (the nudge is out). Otherwise, go to next question.

   2. **Question: Is the nudge transparent and easy to undo?**
     - *Rule:* If the nudge is intentionally deceptive or if reversing the choice requires unreasonable effort (e.g., complex opt-out procedures, hidden costs), then stop. Otherwise, go to next question.

   3. **Question: Who is the primary beneficiary?**
     - *Rule:* If the primary beneficiary is the government and the nudge imposes a significant burden (monetary, time, psychological) on the citizen without a clear and substantial public benefit (like public health or safety) that outweighs that burden, then stop. Otherwise, go to next question.

   4. **Question: Would we be embarrassed to publicly describe the nudge and its mechanism?**
     - *Rule:* If yes (because it exploits a cognitive bias in a way that feels manipulative, or because it would provoke public backlash if fully understood), then stop. Otherwise, go to next question.

   5. **Question: Is the nudge's intended outcome aligned with the target's values or long-term interests?**
     - *Rule:* If the nudge pushes toward an outcome that is clearly against the target's expressed values or long-term well-being (e.g., a nudge that encourages high-interest borrowing to pay taxes), then stop. Otherwise, the nudge is approved.

   Note: Steps 3, 4, and 5 involve value judgments. Step 3 requires weighing public benefit against individual burden (a value judgment). Step 4 relies on anticipating public perception (which can be subjective). Step 5 requires inferring the target's values and long-term interests (which may not be uniform).

   Now, walk two proposals through:

   Proposal (a): Switching a city form so residents default to organ donor status unless they check an opt-out box.

   1. **Does it significantly restrict freedom of choice?**
      - No. Residents can still opt out by checking a box. Freedom of choice is preserved. 
      - **Go** to next question.

   2. **Is the nudge transparent and easy to undo?**
      - Yes. The opt-out box is present and the default is stated. Changing the choice is as simple as checking the box (and in the future, they can change their status again if the system allows). 
      - **Go** to next question.

   3. **Who is the primary beneficiary?**
      - The primary beneficiary is the public (potential organ recipients) and the government (in fulfilling its role in public health). The burden on the citizen is minimal (checking a box if they don't want to donate). The public benefit (increased organ donations) is substantial. 
      - **Go** to next question.

   4. **Would we be embarrassed to publicly describe the nudge?**
      - Probably not. Defaults are a well-known and accepted nudge technique. The mechanism (using the status quo bias) is openly discussed in behavioral science. 
      - **Go** to next question.

   5. **Is the outcome aligned with the target's values or long-term interests?**
      - We assume that organ donation is a socially valued act and that many people intend to donate but fail to opt in. However, for those who have religious or personal objections, they can opt out. The nudge aligns with the long-term interests of society and, for most, their own altruistic values. But note: we must be cautious that it doesn't override deeply held objections. Since the opt-out is available and easy, it passes. 
      - **Approved**.

   Proposal (b): Sending a letter to late tax filers saying "9 out of 10 of your neighbors already paid."

   1. **Does it significantly restrict freedom of choice?**
      - No. The letter is just information. The recipient can still choose to file late. 
      - **Go** to next question.

   2. **Is the nudge transparent and easy to undo?**
      - The nudge is transparent in the sense that it's a message. There's no action to "undo" because it's informational. However, the mechanism (social norms) is not hidden. 
      - **Go** to next question.

   3. **Who is the primary beneficiary?**
      - The primary beneficiary is the government (increased tax compliance and revenue). The citizen benefits indirectly (taxes fund public services) but the direct burden is the citizen paying taxes (which is a legal obligation). The nudge imposes no extra burden beyond the existing obligation to pay taxes. However, the social pressure might cause psychological discomfort (e.g., shame) for some. We must weigh: the public benefit of tax revenue for city services is clear and substantial. 
      - **Go** to next question.

   4. **Would we be embarrassed to publicly describe the nudge and its mechanism?**
      - This is the hard part. The nudge exploits the desire to conform (social proof) and may cause embarrassment for the recipient. But social norms are a common and accepted nudge. However, if the statistic is misleading (e.g., if it's not true that 9 out of 10 neighbors have paid, or if the neighbors are not a relevant comparison group) then it might be embarrassing. We assume the statistic is accurate and the comparison is appropriate. 
      - If we are being honest, we might feel slightly uncomfortable because it's playing on social pressure. But it's not inherently deceptive. So, probably not embarrassed. 
      - **Go** to next question.

   5. **Is the nudge's intended outcome aligned with the target's values or long-term interests?**
      - Paying taxes is a legal obligation and supports community services. It aligns with the target's long-term interest in a well-functioning society. However, if the target is facing genuine financial hardship, this nudge might pressure them to pay when they cannot afford it. But that concern is about the underlying obligation, not the nudge per se. Since paying taxes is a shared societal value, it passes. 
      - **Approved**.

   However, note that in step 4, if the team feels that exploiting social pressure in this way is manipulative and would attract public criticism (e.g., "the government is shaming people"), they might answer "yes" to embarrassment and stop. This is a value judgment.

   We'll write the five questions as numbered items without extra text.

   Important: The rules must be clear and the walkthrough for each proposal must be under each question.

   Format:

   1. [Question 1]
      - Rule: [Rule 1]
      - For proposal (a): [Answer and decision for (a) at this step]
      - For proposal (b): [Answer and decision for (b) at this step]

   ... and so on for five questions.

   Let's do it.
answer: |-
  **1. Does the nudge materially reduce or conceal actionable options?**  
  - *Rule:* If the nudge hides/removes choices (e.g., burying opt-outs) or makes alternatives prohibitively costly/time-consuming, stop. Else, proceed.  
  - **(a) Default organ donor opt-out:** No reduction; opt-out box is visible and equally accessible. **Proceed.**  
  - **(b) "9/10 neighbors paid" letter:** No reduction; letter is informational, filing options unchanged. **Proceed.**  

  **2. Would a reasonable person feel deceived upon learning how the nudge works?**  
  - *Rule:* If exploiting a cognitive bias (e.g., inertia, social pressure) in a way that feels like a "trick" (e.g., false scarcity), stop. Else, proceed. *[Value judgment: Team must assess "reasonable person" standard.]*  
  - **(a) Default organ donor:** No deception; defaults are widely understood. **Proceed.**  
  - **(b) Social norm letter:** Possibly deceptive; exploits conformity bias without context (e.g., "neighbors" may be misleading). **Stop for (b).**  

  **3. Is the burden-benefit ratio clearly skewed against the individual?**  
  - *Rule:* If the nudge primarily serves government interests (e.g., revenue) while imposing high individual costs (financial, psychological, time) without proportional public good, stop. Else, proceed. *[Value judgment: Requires weighing "proportional public good."]*  
  - **(a) Default organ donor:** Low burden (one-time opt-out); high public benefit (lives saved). **Proceed.**  
  - **(b) Social norm letter:** High psychological burden (shame); benefit is government revenue. Skewed against individual. **Stop for (b).**  

  **4. Would we hesitate to publish the nudge’s design and intent in a press release?**  
  - *Rule:* If the mechanism feels manipulative (e.g., exploiting vulnerability) or risks backlash, stop. Else, proceed. *[Value judgment: Relies on team’s "embarrassment" threshold.]*  
  - **(a) Default organ donor:** Unlikely hesitation; widely accepted practice. **Proceed.**  
  - **(b) Social norm letter:** Likely hesitation; may appear coercive or shaming. **Stop for (b).**  

  **5. Could the nudge undermine autonomy for a vulnerable group?**  
  - *Rule:* If it disproportionately pressures at-risk groups (e.g., low literacy, poverty) without safeguards, stop. Else, approve.  
  - **(a) Default organ donor:** Autonomy preserved via clear opt-out; no vulnerable targeting. **Approve.**  
  - **(b) Social norm letter:** May coerce financially vulnerable (e.g., forcing unaffordable payments). **Stop for (b).**
