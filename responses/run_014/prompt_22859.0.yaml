answer: |-
  Here’s a targeted sequence of questions designed to probe the technical core of two-dimensionalism, preempt common responses, and steer clear of zombie conceivability distractions. Each question includes a follow-up anticipating the speaker’s likely reply:

  ---

  ### **Q1: Division of Labor in Water/H2O**  
  **Question:** In the water/H2O case, the secondary intension is necessary (water is H₂O in all worlds), while the primary intension is contingent (water might not have been H₂O). What *exactly* does the primary intension contribute to meaning that the secondary intension cannot, given that reference is fixed by the secondary intension once actuality is fixed?  
  **Likely Reply:** *"The primary intension captures epistemic or conceptual role: what we can know a priori about how reference is fixed (e.g., ‘water’ picks out the clear, drinkable liquid in our environment), prior to empirical discovery."*  
  **Follow-up:** But if the primary intension is just a rule for fixing reference given actual context, why call it part of *meaning* rather than a metasemantic precondition? Doesn’t this reduce primary intensions to contingent facts about how we *identify* referents, not meaning itself?  

  ---

  ### **Q2: A Priori/A Posteriori Distinction**  
  **Question:** You claim primary intensions are knowable a priori (e.g., we know a priori that ‘water’ picks out the watery stuff in a scenario). But if primary intensions depend on epistemic access to the actual world (e.g., knowing what counts as "watery"), how is this *not* tacitly empirical?  
  **Likely Reply:** *"Primary intensions are defined over epistemic scenarios abstractly; we need no empirical input to grasp the intension’s structure—only to apply it to the actual world."*  
  **Follow-up:** If grasping the primary intension requires understanding "watery" properties (liquid, clear, etc.), and these properties are empirical concepts, isn’t the primary intension itself a posteriori? Doesn’t this collapse the a priori claim?  

  ---

  ### **Q3: Indexing the Epistemic Dimension**  
  **Question:** Are epistemic scenarios best modeled as centered worlds (worlds with a designated individual/time), epistemically possible worlds, or something else? Does this choice affect the zombie argument?  
  **Likely Reply:** *"Centered worlds handle indexicality and cognitive significance, e.g., ‘I am here now’ is a priori true at a center."*  
  **Follow-up:** But for zombies, doesn’t using centered worlds *presuppose* that consciousness is indexical? If we model scenarios as uncentered epistemically possible worlds, might zombies become inconceivable—undermining the argument?  

  ---

  ### **Q4: Primary Intension & Metaphysical Possibility (The Zombie Gap)**  
  **Question:** You argue that zombies are conceivable (primary intension non-empty), hence metaphysically possible. But what *justifies* the leap from an epistemic property (conceivability) to a modal one (metaphysical possibility)?  
  **Likely Reply:** *"Primary intensions *are* metaphysical possibilities: if a primary intension picks out X in a scenario, that scenario corresponds to a metaphysically possible world."*  
  **Follow-up:** But this assumes a 1:1 mapping from epistemic scenarios to metaphysical worlds. If scenarios are coarse-grained (e.g., ignoring hidden essences), couldn’t a scenario satisfy the zombie primary intension while *no* metaphysically possible world does? Isn’t this question-begging?  

  ---

  ### **Q5: Testing the Zombie Gap Reply**  
  **Question:** Suppose we grant that conceivability entails primary intension non-emptiness. Why should we accept that primary intension satisfaction entails metaphysical possibility, especially given Kripkean a posteriori necessities?  
  **Likely Reply:** *"Kripkean necessities are handled by the secondary intension; primary intensions track worlds where the *concepts* apply, so they’re genuinely possible."*  
  **Follow-up:** But if the primary intension of ‘water’ picks out XYZ in a Twin Earth scenario, doesn’t that scenario *misdescribe* metaphysical reality (where water is H₂O necessarily)? How does this not decouple epistemic scenarios from metaphysics?  

  ---

  ### **Q6: Kaplan’s Indexical Critique**  
  **Question:** David Kaplan argues that apparent two-dimensionality arises only for indexicals (like ‘I’ or ‘now’), not for names/natural kinds. If ‘water’ isn’t indexical, why treat it as having a context-sensitive primary intension?  
  **Likely Reply:** *"All terms have a context-sensitive element in reference-fixing. ‘Water’ has a hidden indexical component: ‘the watery stuff *around here*’."*  
  **Follow-up:** But if ‘water’ rigidly designates H₂O, its reference-fixing conditions aren’t part of its meaning (contra descriptivism). Isn’t two-dimensionalism conflating pragmatics (how we fix reference) with semantics (what terms refer to)?  

  ---

  ### **Q7: Empirical Counterexamples?**  
  **Question:** Can you conceive of empirical evidence that would falsify the two-dimensional framework? For example, if neuroscience showed that phenomenal concepts *are* physical, would that collapse the epistemic/metaphysical gap for zombies?  
  **Likely Reply:** *"No—even if consciousness is physical, zombies remain conceivable because primary intensions are independent of empirical facts."*  
  **Follow-up:** If the framework is insulated from empirical falsification, does it risk being non-explanatory? What *could* count as evidence against it?  

  ---

  ### **Q8: Closing Challenge**  
  **Question:** Setting aside zombies, what’s the strongest *non-conceivability-based* argument for adopting two-dimensional semantics? If we reject the epistemic/metaphysical bridge, what work does the framework do?  
  **Likely Reply:** *"It explains cognitive significance, Frege cases, and how a priori reasoning coexists with a posteriori necessities."*  
  **Follow-up:** But can’t rival frameworks (e.g., direct reference + pragmatic enrichment) explain these without multiplying intensions? Is two-dimensionalism’s added complexity justified?  

  ---

  ### **Key Objectives Met:**  
  1. **Water/H2O mechanics** (Q1–Q2) dissect the necessity/contingency split.  
  2. **Epistemic indexing** (Q3) challenges foundational choices.  
  3. **Zombie gap** (Q4–Q5) isolates the conceivability→possibility leap.  
  4. **Kaplan’s critique** (Q6) pressures semantic foundations.  
  5. **Falsifiability** (Q7–Q8) tests the framework’s empirical grounding.  

  Each follow-up forces the speaker to defend the *mechanism* of two-dimensionalism—not just restate it—while avoiding zombie debates. Use interruptions sparingly but firmly to redirect if answers drift toward conceivability.
