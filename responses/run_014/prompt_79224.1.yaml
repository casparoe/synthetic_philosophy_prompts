answer: |-
  Here's the argument structured around your core questions, avoiding textual rehash and focusing on analytical friction:

  1.  **Brecht's Fundamental Omission & Its Consequences:**
      *   Brecht entirely elides Galileo's *specific hermeneutical framework*. Scripture in the play exists *only* as institutional power, never as a *text* requiring interpretation according to principles Galileo sincerely championed.
      *   **Consequence 1: Flattened Galileo:** You are correct that Brecht crafts an Enlightenment rationalist *avant la lettre*. His Galileo sees "truth" (science) and "falsehood" (dogma) as inherently opposed forces. The historical Galileo's nuanced position – that *correctly interpreted scripture* harmonizes with science – is erased. Brecht's Galileo seeks to *replace* dogma with science, not demonstrate their underlying compatibility through better exegesis. His motivation becomes secular progress, not faithful Christian understanding.
      *   **Consequence 2: Simplistic Church Portrayal:** The Church hierarchy (especially the Inquisition) is depicted almost exclusively through the lens of cynical power preservation. Cardinal Barberini's (later Urban VIII) genuine intellectual engagement and the *theological* debate within the Church (e.g., Bellarmine's concerns about scriptural authority) are absent. The play denies the Church a sincere theological voice, reducing its opposition to political machination.

  2.  **The Little Monk Scene: Brecht's Unwitting Theological Insight:**
      *   **Yes, this is the social cost of accommodation made visible.** Your reading is not overreaching; it's the critical insight.
      *   The Little Monk articulates the *existential consequence* of Galileo's accommodation doctrine *for the accommodated*. If scripture's literal meaning is pedagogically simplified for the masses, its comfort *relies* on that simplicity. Taking away the literal "heaven" (geocentric cosmos as the stage for divine drama and ultimate justice) *is* taking away the specific consolation derived from *that* accommodated narrative. The Monk isn't arguing hermeneutics; he's feeling its human fallout.
      *   **Brecht's Framing vs. Implicit Critique:** Brecht frames this as "Church uses ignorance to control the poor." *However*, the scene *dramatically demonstrates* that Galileo's own theological principle – that nature reveals God's *true* intent while scripture accommodates human weakness – *inherently* creates a hierarchy of understanding. The Little Monk exposes the paternalism *within* the *doctrine itself*, regardless of the Church's cynical *use* of it. Brecht shows the social cost Galileo's hermeneutics inadvertently imposes, even if he attributes the *cause* solely to institutional malice.

  3.  **Brecht vs. Galileo: Competing Philosophies of Truth and Authority:**
      *   **Galileo's Strength (What Brecht Misses):** Galileo offered a sophisticated *internal* critique. He worked *within* the dominant framework (scriptural authority) to carve space for science using its *own* theological tools (God's dual revelation, accommodation theory). This was a powerful strategy for *reforming* understanding *from within*, preserving faith while advancing natural philosophy. It acknowledged the genuine authority of scripture but argued for a better method of interpreting it.
      *   **Brecht's Strength (What Galileo Obscures):** Brecht relentlessly exposes the **material and class dimensions of truth-telling** that Galileo's hermeneutics ignored or took for granted.
          *   **Truth as Class Act:** The Little Monk scene brilliantly shows how access to "truth" (the new cosmology) and the *capacity to bear it* are socially stratified. The comfort of the accommodated narrative is a necessary opiate for the brutalized poor. Revealing the "truth" isn't just an epistemic act; it's potentially destabilizing to their precarious existential coping mechanism. Galileo's doctrine assumes the accommodated can *eventually* handle the truth (through re-reading), but Brecht questions *whether they can afford to*, materially and psychologically, *now*.
          *   **Institutional Power:** Brecht correctly emphasizes that interpretations aren't neutral; they are enforced by institutions with vested interests in maintaining specific social orders. Galileo's elegant hermeneutical solution is powerless against the brute force of an institution prioritizing its own stability over intellectual coherence. The "truth" of the *Discorsi* must be *smuggled*, not argued hermeneutically.
      *   **The Rivalry:** They are absolutely rivals, offering fundamentally different accounts of the conflict:
          *   **Galileo:** A conflict of *correct interpretation* within a shared framework of faith and scriptural authority. Resolution comes through better hermeneutics and intellectual courage.
          *   **Brecht:** A conflict of *material interests and power*. Science challenges the ideological foundation of an oppressive social order. Resolution comes through struggle, dissemination against institutional power, and the potential of science to materially improve lives (Galileo's response to the Monk). Scripture is purely ideology-in-action.
      *   **What Each Can't Do:**
          *   **Galileo's Hermeneutics:** Cannot account for the *social function* of the accommodated narrative for the oppressed. Cannot overcome institutional power invested in the *status quo* interpretation, regardless of its theological merit. Risks elitism/paternalism.
          *   **Brecht's Materialism:** Cannot engage with the sincere theological motivations and intellectual complexity *within* the Church or Galileo himself. Reduces scripture to *only* an instrument, ignoring its role as a locus of meaning and faith. Risks making the conflict purely external (science vs. power) rather than also internal (faith seeking understanding).

  **Conclusion on "Better or Worse Philosophy":**

  Neither is universally "better." They answer different questions with different tools:

  *   **Galileo's philosophy** is superior for understanding the *intellectual and theological manoeuvres possible within the early modern Catholic framework* to reconcile faith and emerging science. It respects the internal logic and sincerity of that world.
  *   **Brecht's philosophy** (as dramatized) is superior for exposing the **inescapable entanglement of knowledge with power, class, and material existence**. It reveals the *social cost* of intellectual shifts that Galileo's hermeneutics treats abstractly and the *institutional realities* that ultimately crush elegant theological arguments. It makes the politics of truth visceral.

  **Your "nagging feeling" is precisely right:** The play's enduring power lies in Brecht forcing us to confront the material and social consequences of scientific revolutions that Galileo's brilliant hermeneutics could not foresee or adequately address. However, by ignoring Galileo's actual theological position, Brecht creates a powerful but historically simplified myth of Enlightenment rationalism battling obscurantism, missing the deeper, more complex struggle over how to read the world *and* the Word within a shared, but fracturing, worldview. The Little Monk scene is Brecht's accidental, profound critique of the paternalism inherent in accommodation theory, framed as a critique of the Church but resonating far deeper.
