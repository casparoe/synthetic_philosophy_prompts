  ## The Fourfold Negation

  Is it? Then fixed in being, separate, whole,
  A frozen truth that stands beyond decay.
  Is it not? Then a void, a barren hole
  Where meaning's root is hacked and cast away.
  Is both? What logic holds such warring claims?
  Contradiction's fever splits the frame.
  Is neither? Yet this silence still proclaims
  A hidden ground, evading logic's aim.

  *Shift:* Not a fifth stance, but the structure's fall!
  No "is," no "is not," nor their combined display,
  Nor absence grasped—all koṭi options stall.
  No ground persists where svabhāva holds its sway.
  This emptiness, itself devoid of core,
  Makes concepts dance, yet leaves them seeking more.
  Not nihilism! See the dancing chain,
  Dependent, ceaseless, nothingness's bane.

  ---

  **Word Count:** 126  
  **Notes on Accuracy & Craft:**

  1.  **Octave (Lines 1-8):** Each koṭi (affirmation, denial, both, neither) gets two lines. The "neither" couplet ("Yet this silence still proclaims...") hints that even rejecting the first three might imply a subtle ground, setting up its collapse.
  2.  **Volta (Line 9):** The turn explicitly rejects seeking a fifth position ("Not a fifth stance") and declares the collapse of the framework ("the structure's fall!").
  3.  **Sestet (Lines 9-14):** Reiterates the rejection of all four positions (lines 9-11). Defines emptiness as the absence of inherent existence (svabhāva) that made the koṭi questions possible ("No ground persists..."). States emptiness is empty of inherent existence itself (line 13). Shows concepts are usable ("dance") but lack ultimate grounding ("seeking more").
  4.  **Closing Couplet (Lines 13-14):** Directly addresses the nihilism charge ("Not nihilism!"). Evokes dependent origination ("the dancing chain") as the dynamic reality emptiness describes, contrasting it with static nothingness ("nothingness's bane").
  5.  **Poetic Craft:** Petrarchan structure (ABBA ABBA CDE CDE). Metaphors ("frozen truth," "barren hole," "fever," "dancing chain," "nothingness's bane"). Concise, evocative language. Maintains philosophical precision within tight constraints.
