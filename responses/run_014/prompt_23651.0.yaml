prompt: |-
  I host a small philosophy podcast, and next week's guest is a scholar of Carnap who defends the reading that Carnap was a comitted social democrat who favored economic planning, and that his logical empiricism doesn't commit him to political neutrality. Draft eight to ten interview questions that go beyond having him restate the view: I want at least one question each on (a) the claim that the choice between different value systems or world-views is not a scientific question, (b) how the neutrality of science is supposed to square with his political commitments, (c) what exactly Carnap meant by favoring planning over the market, and (d) the tension between his rejection of metaphysics and his political philosophy -- and for each, a follow-up keyed to the answer he's most likely to give.
