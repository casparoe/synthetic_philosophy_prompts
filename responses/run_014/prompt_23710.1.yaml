reasoning: |-
  We are ranking the following four paraconsistent logics by their robustness in resisting trivialization when faced with semantic paradoxes (especially the Liar, Russell's set, and Curry's paradox). The criterion is how well they avoid triviality (i.e., avoid proving every sentence) when these paradoxes are present.

  The systems:
  1. LP (Priest's Logic of Paradox)
  2. FDE (First Degree Entailment)
  3. R (Anderson–Belnap's relevant logic R)
  4. C1 (da Costa's C1)

  Key challenges:
  - The Liar paradox: A sentence that says "This sentence is false." leads to contradiction.
  - Russell's paradox: The set of all sets that do not contain themselves leads to contradiction.
  - Curry's paradox: A sentence that says "If this sentence is true, then P" (for any P) leads to P being true without any assumption. This is particularly challenging because it uses conditional (implication) and can trivialize systems that handle the Liar by just allowing true contradictions but without controlling the conditional.

  Ranking criteria: We focus on the ability to avoid trivialization when the paradoxes are present. Curry's paradox is a key test because it uses the conditional and can lead to arbitrary conclusions.

  Insights on each system:

  1. **FDE (First Degree Entailment)**:
     - FDE is a non-classical logic that allows for truth-value gaps (neither true nor false) and gluts (both true and false). However, FDE is a "first-degree" system, meaning it does not have an internal conditional (implication) as a connective in the object language. It treats implication as defined in terms of negation and disjunction (or conjunction) and only for formulas without nested implications. Therefore, it does not have a full conditional and cannot express Curry's sentence in the object language. So, Curry's paradox does not arise in FDE because the conditional required for Curry is not present as a primitive and is not defined for higher degrees. However, note that if we try to add a conditional, we must be cautious.

     But note: The paradoxes of set theory (like Russell) can be expressed in FDE, and FDE can avoid triviality by allowing the Russell set to be both a member and not a member of itself without explosion. However, without a conditional, Curry's paradox in its standard form (which relies on a conditional) is not expressible.

  2. **LP (Priest's Logic of Paradox)**:
     - LP is a three-valued logic (true, false, both) and is a "cousin" of FDE, but it is usually presented with a material conditional (defined as ~A ∨ B). LP can express the Liar and Russell without trivializing. However, when it comes to Curry's paradox, the material conditional in LP leads to triviality. Why? Because in LP, if we have a Curry sentence C that says "C → P" (for arbitrary P), then we can derive P. The reason is that in LP, the material conditional ~C ∨ B does not avoid the Curry paradox. Specifically, the standard derivation of Curry in LP leads to triviality. Therefore, LP is vulnerable to Curry.

     However, note that Priest has proposed a non-monotonic version of LP (using the Logic of Paradox with a suitable conditional) to avoid Curry, but the standard LP with material conditional is trivialized by Curry.

  3. **Relevant Logic R**:
     - This is a relevance logic that requires the antecedent and consequent of a conditional to be relevantly connected. The system R has a strong conditional that avoids the paradoxes of material implication. It is designed to block the derivation of Curry's paradox by rejecting contraction (which is the principle that if A→(A→B) then A→B). Without contraction, the Curry derivation is blocked. Also, R is paraconsistent and can handle the Liar and Russell without triviality. However, note that R is known to be non-trivial even in the presence of Curry sentences because of the lack of contraction.

  4. **da Costa's C1**:
     - This is a paraconsistent logic that allows some contradictions but prevents them from propagating arbitrarily. It uses a non-truth-functional negation and a conditional that is classical in some respects. However, da Costa's C1 is known to be vulnerable to Curry's paradox. Specifically, C1 does not block the contraction principle (which is key to Curry) and also does not have a relevant conditional. Therefore, Curry's paradox can be derived in C1, leading to triviality.

  Ranking from most robust to least robust:

  1. **Relevant Logic R**: It avoids trivialization by Curry's paradox because it lacks contraction and has a relevant conditional that blocks the derivation of arbitrary propositions from the Curry sentence.
  2. **FDE**: Since it lacks an internal conditional (and thus cannot express Curry's sentence in the object language), it avoids Curry's paradox by design, but note that if we extend FDE with a conditional, we must be cautious. For the base FDE without a conditional, Curry is inexpressible. However, FDE can be extended in different ways. We are considering the base system without a conditional. So it avoids trivialization by Curry because Curry cannot be formed. But note: the other paradoxes (Liar, Russell) are handled without triviality.
  3. **LP**: Although it handles the Liar and Russell without explosion, it falls to Curry's paradox because of its material conditional. The standard LP (with material conditional) trivializes when faced with Curry.
  4. **da Costa's C1**: It is vulnerable to Curry's paradox because it does not block the necessary principles (like contraction) and thus trivializes when Curry is present.

  But note: Some sources might suggest that FDE is more robust than R because R is a very strong system and might have its own issues? However, in the context of resisting trivialization by the semantic paradoxes (especially Curry), R is designed to block Curry. FDE avoids Curry by not having a conditional, but if we are to reason about conditionals, we need a conditional. So for the express purpose of the paradoxes, FDE is safe because it doesn't express Curry, but R is safe even with a conditional.

  However, we must note that FDE is often considered as a base for more expressive logics. But in its pure form, without a conditional, it is safe. Also, the Russell paradox does not require a conditional? Actually, Russell's paradox in set theory uses the membership predicate and negation, but not necessarily a conditional. So FDE can handle Russell without triviality.

  But Curry requires a conditional. Therefore, the ranking:

  1. **Relevant Logic R**: It has a conditional and still blocks Curry, so it is the most robust.
  2. **FDE**: Without a conditional, it avoids Curry and handles the other paradoxes without triviality. But note: if we are to include set theory or conditionals, we might need an extension. However, for the base system, it is robust against the standard paradoxes because Curry is inexpressible.
  3. **LP**: Handles Liar and Russell but falls to Curry.
  4. **da Costa's C1**: Falls to Curry.

  However, there is an important caveat: FDE is often extended to a logic with a conditional (like in the relevant logic tradition) and then it might become vulnerable or not. But the base FDE (first degree) does not have nested conditionals and so Curry cannot be expressed. Therefore, for the purpose of this ranking, we place FDE above LP because LP (with its material conditional) is vulnerable to Curry, while FDE (without any conditional) is not.

  But note: In the literature, LP is sometimes presented with a detachable conditional (like in Priest's later work) to avoid Curry, but the standard LP uses material conditional. We are ranking the standard systems as given.

  Therefore, the final order (from most robust to least) is:

  1. Relevant Logic R
  2. FDE
  3. LP
  4. da Costa's C1

  Justifications:

  - **Relevant Logic R**: Blocks Curry's paradox by rejecting contraction and having a relevant conditional, thus maintaining non-triviality even with the liar, Russell, and Curry sentences.
  - **FDE**: Avoids Curry's paradox entirely by lacking an internal conditional, preventing the formation of the Curry sentence, while handling the liar and Russell without triviality.
  - **LP**: Handles the liar and Russell without explosion but succumbs to Curry's paradox due to its material conditional, leading to trivialization for arbitrary propositions.
  - **da Costa's C1**: Vulnerable to Curry's paradox because it fails to block contraction and lacks a relevant conditional, resulting in triviality when Curry sentences are present.

