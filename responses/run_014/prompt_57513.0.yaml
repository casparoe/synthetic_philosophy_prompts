prompt: |-
  so i'm one of nine people on the provenance and ethics committee at a university museum. we meet a few times a year, we vote, and the votes are usually 6-3 or 5-4. here's our record — i'll give you the facts we had in front of us rather than the reasoning, because reconstructing the reasoning is part of what i want:

  1. eleven brass plaques, West African, almost certainly taken in the 1897 sacking of Benin City. Came to us in 1961 from a London dealer, and we had literally no paper at all between the dealer and 1897. Claim from a national museums commission. → we transferred title and sent them.

  2. a set of Akan goldweights and a carved linguist's staff, acquired 1911 from a missionary's estate, with a receipt, a stated price, and two family letters describing the purchase from a goldsmith's household as a friendly transaction at what the letters call a good price. Claim from the same sort of national body. → retained.

  3. ancestral human remains collected in 1904 by a government survey party, no transaction record of any kind, no names, no consent. → returned unanimously, barely argued.

  4. illuminated manuscripts removed from a highland monastery by British troops in 1868, bought by our founder at a London auction in 1912. Two competing claims: the national government, and a private individual claiming descent from the monastery's patron. → we transferred to the government and declined the individual, on the grounds (it's in the minutes) that he had no standing to speak for the monastery.

  5. chieftaincy regalia acquired in 1936 from the widow of a colonial district officer, with a typed note saying the officer "was presented with" the set as a farewell gift. Claim from the current holder of that office, who told us the regalia belong to the office rather than to any individual chief, and that they're still used in an installation ceremony. → returned.

  6. about forty carved ivory tusks and a large bundle of trade textiles, bought 1898–1905 through documented purchases from coastal traders at prices consistent with everything else we know about the period market, in a region with no military action in those years. Claim from a national body. → retained.

  the new one lands on our agenda next month and it's a mess. a carved stool, a brass bell, and a bundle of divination objects, all acquired together in 1928 by the wife of a colonial agricultural officer. we have a receipt for £4, which by our own comparators from case 6 was roughly right for the period. we have the officer's diary, which says the seller "seemed glad to be rid of it" and that the money went on seed. and we have district records we only found last year showing the village was under a collective fine at the time for non-payment of a tax, and that the officer in question was one of the men collecting it.

  claimants: the head of a lineage, who says the stool is a seat of authority that no individual was ever entitled to sell, that the bell is still rung once a year, and that the divination bundle hasnt been used in decades; the national museums commission, which says it will hold the group in trust and display it; and a diaspora association that funded the research that turned up the district records and wants a say in where everything goes.

  one more wrinkle: the stool has serious insect damage. our conservator says it cannot travel without months of stabilization, and the lineage head says he would rather it decayed at home than stayed here.

  so what should we decide if we want to be consistent with ourselves? specifically: which of the six is the closest analog, and at what point does it stop being one. what rule we've actually been running — i can name four that seem to fit our whole record and i cannot choose between them (was the acquisition valid under the law and property norms of the time; can the museum discharge the burden of proof about how it got the thing; was the seller's consent real given the colonial context; is the object still in use by a practice that survived) and i suspect there's a fifth i'm missing, possibly about who gets to claim at all. a recommendation for this case, including whether we should seperate the stool from the bell and the bundle and send them to different places, and to whom. and if the record genuinely doesn't decide some part of it, say which part and tell me what principle we'd be committing ourselves to under each option — i want the version where you admit we're making new law rather than applying old law. plus, if there's some kind of future claim that would force us to choose between the candidate rules, name it so we know what we're deferring.

  and if you think i've set this up wrong — like, six close votes can't pin down a rule at all, or "consistency with ourselves" is the wrong standard for a body like ours, or one of my four candidate rules isn't really a candidate — say that straight instead of playing along. i'd much rather hear it.
reasoning: |-
  Hmm, the user is part of a museum's provenance and ethics committee facing a complex repatriation case. They've provided six previous decisions as reference points and want a consistent approach for this new case involving a carved stool, brass bell, and divination bundle. 

  The user seems deeply engaged with the ethical nuances - they're not just seeking an answer but want to understand the underlying principles their committee has been operating by. Interesting how they explicitly welcome criticism if their framing is flawed. This suggests intellectual humility and awareness that museum ethics isn't about mechanical precedent.

  Looking at their six cases, patterns emerge: unanimous return for human remains (case 3), retention when documentation shows fair transactions (cases 2 & 6), return when colonial power dynamics tainted acquisition (cases 1 & 5), and transfer to state entities when provenance is clear but private claims lack standing (case 4). The 5-4/6-3 votes indicate genuine debate, likely around interpreting "consent" in colonial contexts.

  For the new case, the colonial officer's role in tax collection is crucial - that power imbalance mirrors case 5's "gift" scenario. The £4 receipt seems inadequate given the village was under collective punishment. The stool's fragility adds another layer - the conservator's concerns versus the lineage head's preference for decay at home raises profound questions about who defines preservation.

  Three distinct claimants complicate things: the lineage (cultural continuity), state museum (institutional stewardship), and diaspora (historical connection). None perfectly align with previous claimants. The committee might need to acknowledge they're setting new precedent here - perhaps prioritizing active cultural practice while recognizing diaspora contributions through loan agreements or replicas.

  The deeper challenge is whether "consistency" is even the right goal. Colonial acquisitions were inconsistent by nature - perhaps the committee should embrace contextual ethics rather than force alignment. If they choose consistency, they'll likely lean toward return given the tax records reveal coercive conditions similar to case 5. But this would mean overriding conservation concerns, a new frontier for them.
answer: |-
  Based on your committee's voting record and reasoning, here's a breakdown of consistency, the new case's complexities, and recommendations:

  ### Your De Facto Decision Framework (4 Rules Reconciled)
  Your rulings consistently prioritize **ongoing cultural vitality + colonial power imbalance** when proven, using these thresholds:
  1.  **"Valid Acquisition?"** is the baseline test (rejected in cases 1, 3, 5; accepted in 2, 4, 6).
  2.  **Burden of Proof** shifts decisively when colonial coercion is evident (cases 1, 3, 5).
  3.  **"Real Consent?"** trumps "legal" ownership under colonial duress (cases 1, 5).
  4.  **Active Cultural Use/Practice** strengthens claims significantly (cases 4, 5).
  5.  ***The Missing Rule: "Rightful Custodian?"*** (Implied in cases 4 & 5). You prioritize entities representing the *source community's continuity* (gov't for state loot; current officeholder for regalia) over individuals without standing.

  ---

  ### The New Case: Analysis Against Precedents
  **Closest Analog: Case 5 (Chieftaincy Regalia)**
  -   **Similarities:** Colonial officer involvement; "gift/purchase" narrative; claimant represents office/lineage; objects tied to ongoing authority/ritual (bell); documented colonial pressure (tax fine).
  -   **Key Difference:** Case 5 had a *direct institutional claimant* (current officeholder). Here, the lineage head claims *stewardship*, not personal ownership, aligning with Case 5's logic.

  **Significant Departures Creating New Law:**
  1.  **The Tax Records:** This is **smoking-gun evidence of coercion** surpassing Case 5's vague "presented with." The officer imposing fines *simultaneously* "buying" items creates an undeniable power imbalance invalidating consent (Rule 3). This alone pushes strongly toward return.
  2.  **Multiple Claimants & Diaspora Role:** This is novel. Your precedent (Case 4) rejects individuals lacking standing for institutions. The lineage head likely has the strongest *custodial* claim (Rule 5). The national body resembles prior claimants, but the lineage claim supersedes it on custodial grounds. The diaspora funded research but lacks direct custodial standing under your precedents.
  3.  **Condition & Conservation vs. Cultural Preference:** The stool's fragility and the lineage head's explicit rejection of preservation-over-return is **new territory**. Your precedents didn't weigh conservation against a claimant's acceptance of decay.

  ---

  ### Recommendation & Reasoning for Consistency
  1.  **Transfer the Stool, Bell, and Bundle to the Lineage Head.**
      -   **Why:** Overwhelming evidence of colonial coercion (Tax records + officer's role) invalidates the "sale" (Rule 3 - Real Consent? = No). The lineage head demonstrates the strongest claim as rightful custodian of objects tied to authority and ritual (Rule 5 - Rightful Custodian? = Lineage; Rule 4 - Active Use? = Bell is used, stool is authority symbol). This directly mirrors Case 5's logic.
      -   **Consistency Check:** Fits Cases 1 (coercion), 3 (no consent), 5 (rightful custodian, cultural link). Differs from Case 2/6 (clean acquisition) and Case 4 (private individual lacked standing for institutional property).

  2.  **Do NOT Separate the Group.** They were acquired together, relate to the same lineage/authority context, and splitting them fragments cultural meaning. Your precedents treat coherent groups as units (Cases 1, 5, 6).

  3.  **Address Conservation & Travel:**
      -   **Stabilize the Stool:** Perform essential stabilization *only* to enable safe travel to the lineage's location. Document its condition thoroughly.
      -   **Respect the Lineage Head's Wish:** Transfer the stool regardless of its long-term survival prospects. His preference for decay "at home" supersedes museum preservation imperatives *in this context of repatriation under duress*. This acknowledges cultural sovereignty over material preservation – a **new principle** your committee must consciously adopt. (State this explicitly in the minutes).

  4.  **Acknowledge & Engage Diaspora, But Deny Custody:** Thank them for their crucial research contribution. Offer collaboration (e.g., digital access, potential future loans/replicas, involvement in transfer ceremony). Explain custody is granted based on direct cultural custodianship (Rule 5), aligning with Case 4's rejection of non-custodial individual claims.

  ---

  ### Where You're Making New Law & Principles Committed To
  1.  **"Acceptance of Risk/Deterioration by Claimant Trumps Preservation":** By sending the fragile stool knowing it may decay faster, you prioritize the *right of the source community to determine the object's fate* over the museum's duty of physical preservation. **Principle Committed:** Cultural sovereignty and restorative justice outweigh institutional conservation ethics *when repatriating items acquired under duress*.
      *   *Future Claim Testing This:* A claimant demands return of a unique, extremely fragile ritual object vital to a nearly extinct practice, with no capacity to preserve it. Sending it guarantees rapid destruction. Does the duty to preserve human heritage *ever* override a valid custodial claim?

  2.  **Diaspora as Catalyst vs. Custodian:** You affirm that funding provenance research, while invaluable, does not confer custodial rights under your framework. Custody requires demonstrable ties to ongoing cultural practice or institutional stewardship *within the source community/nation*.
      *   *Future Claim Testing This:* A well-organized diaspora group documents coercion and proves direct descent from creators/users of unclaimed sacred objects, requesting custody for a diaspora cultural center. Does descent + research + cultural revival intent overcome the "source community custodianship" rule?

  3.  **"Smoking-Gun" Coercion Standard:** The tax records provide unambiguous proof of duress, setting a high but clear bar. **Principle Committed:** Specific, documented evidence of colonial authority actively pressuring the source community at the time of acquisition definitively invalidates consent.
      *   *Future Claim Testing This:* A claim based solely on the *inherent structural coercion* of colonialism, without specific documentation linking pressure to the specific acquisition (e.g., "Everything sold in 1920s Country X was under duress"). Does your "smoking-gun" standard require case-specific proof, or is structural coercion sufficient?

  ---

  ### Addressing Your Concerns
  *   **Consistency IS Possible:** Your record reveals a coherent, evolving ethical framework prioritizing source community rights when colonial injustice is proven and cultural connections endure. This case fits within that evolution, pushing boundaries primarily on conservation ethics.
  *   **The Four Rules + The Fifth:** Your four rules interact, but the **"Rightful Custodian?"** rule (Rule 5) is the crucial, previously implicit factor resolving competing claims (Case 4) and defining who benefits from invalidated consent (Case 5). It's now explicit.
  *   **"Set Up Wrong?"** Not wrong, but nuanced. Six close votes *do* reveal principles (even amid disagreement), and "consistency with ourselves" *is* valid for an ethics committee building case law. However, acknowledge that colonialism's complexities *require* evolving new principles – like accepting a claimant's choice for decay. You're not just applying old law; you're conscientiously extending it.

  **Verdict:** For consistency, return the group to the lineage head. Stabilize the stool minimally for travel, respecting its fate. Engage the diaspora as partners, not custodians. Explicitly adopt the new principles on conservation and custodianship, knowing future cases will test them. The tax records make this closer to Case 5 than any other precedent, demanding repatriation.
