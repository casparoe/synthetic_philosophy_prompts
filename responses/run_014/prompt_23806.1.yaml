  ### Thought Experiment: The Overflowing Sink

  In a shared suburban kitchen during a dinner party, three housemates—Taylor (explicitly tasked by household agreement with checking the sink's auto-shutoff valve before bed), Jordan (a visiting friend), and Morgan (another housemate)—observe the kitchen sink filling as they finish washing dishes. All three notice the faulty faucet sensor and know it will overflow if unaddressed. Each could easily flip the manual override switch next to the sink (requiring 2 seconds of effort) to prevent flooding, but all assume someone else will handle it. They leave the room; the sink overflows, damaging the floor.  

  ---

  ### Analysis  
  1. **Counterfactual Theory** (cause iff harm wouldn't occur without the omission):  
     - *Taylor's inaction*: If Taylor alone had flipped the switch, the flood would've been prevented. Thus, Taylor’s omission is a cause.  
     - *Jordan's inaction*: If Jordan alone had flipped the switch, the flood would’ve been prevented. Thus, Jordan’s omission is a cause.  
     - *Morgan's inaction*: If Morgan alone had flipped the switch, the flood would’ve been prevented. Thus, Morgan’s omission is a cause.  
     The theory treats all three equally as causes. It lacks resources to differentiate them, as the counterfactual dependence is identical for each.  

  2. **Expectation Theory** (omission causes harm only if it departs from role-based expectations):  
     - *Taylor's inaction*: Taylor had an explicit duty. The flood occurs *because* Taylor violated the expected role. Thus, Taylor’s omission is a cause.  
     - *Jordan's inaction*: No duty existed for Jordan. Their inaction aligns with normal expectations (guests aren’t responsible). Thus, Jordan’s omission is **not** a cause.  
     - *Morgan's inaction*: No explicit duty existed for Morgan. Inaction matches expectations (only Taylor was assigned). Thus, Morgan’s omission is **not** a cause.  
     The verdict diverges from the counterfactual theory by absolving Jordan and Morgan, as their roles didn’t generate expectations of action.  

  3. **Differentiating Feature**:  
     The sole distinction is Taylor’s **assigned duty** via prior agreement. Skill, proximity, and counterfactual strength are identical: all were equally capable, equally close to the switch, and each individual action would have sufficed to prevent harm.  

  4. **Duty Removal and Extension Tests**:  
     - *Duty removed from all*: Counterfactual theory still deems all three omissions causes. Expectation theory deems none causes (no duties exist to violate).  
     - *Duty extended to all*: Counterfactual theory still deems all three causes. Expectation theory now deems all three causes (each violated a duty).  

  5. **Counterfactualist Rebuttal**:  
     A committed counterfactualist could argue that causation is distinct from **responsibility**: while all three omissions are equally *causes*, only Taylor is *culpable* due to the prior agreement. This preserves the causal symmetry but appeals to normative (non-causal) factors to explain why we treat Taylor differently in practice.  

