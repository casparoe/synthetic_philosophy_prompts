prompt: |-
  I have no formal training in philosophy, but a disagreement at work a while back over whose fault a missed deadline really was sent me down a rabbit hole of reading about whether failing to do something can count as a genuine cause of what happens next. Almost everything I have found on this uses some version of the same setup: someone was supposed to water a plant, didn't, and then the point gets made that a stranger on the other side of the world who also didn't water it seems to pass the very same test for being a cause, which can't be right. I understand the puzzle, but I would like to see it worked through on a case that is not already worn smooth from overuse, so that the theories are doing the work rather than being recognized from a summary I have already read.

  Please construct a thought experiment meeting this specification. Set it in an ordinary, present-day workplace or household -- not a hospital ward, a beach with a lifeguard, or anyone's houseplants, since those are the settings every treatment of this topic reaches for. The case must involve exactly three people, all present, all equally capable of performing one and the same preventive action, and all equally aware that it needs doing. Arrange things so that each of the three, taken individually with the other two's inaction held fixed, passes the ordinary counterfactual test for causing the eventual harm: if that one person alone had acted, the harm would not have occurred. Exactly one of the three, and only one, must have been given the job of performing that action beforehand, through an actual assigned role, contract, or explicit prior agreement -- not through being more skilled, closer at hand, or in any way more able than the other two, who must match the duty-bearer in every other respect. In the scenario, nobody acts, and the harm occurs. Keep the scenario itself to one paragraph.

  What I am after is whether two theories of causation really do come apart on a case like this for principled reasons, or whether any apparent difference between them is just smuggled in by how the case is described -- so please do not simply hand me verdicts, show how each one follows from applying the theory to the facts you have stipulated. After the scenario, walk through: (1) what a plain counterfactual theory of causation -- on which one thing causes another just in case the second would not have happened without the first -- says about each of the three people's inaction, and whether that theory has any resources for treating the three differently from one another; (2) what a rival theory, on which an omission is a cause only when the outcome is a departure from what would normally or was expected to happen given people's roles (call this the expectation theory), says about each of the three, and why its verdict differs from the counterfactual theory's verdict in this case; (3) which single feature of the case is doing the work of separating the three people, with confirmation that it is not secretly a difference in skill, proximity, or counterfactual strength; (4) what happens to both theories' verdicts if the assigned duty is taken away from everyone, and separately, what happens if that same duty is extended to all three; and (5) the strongest move available to someone committed to the counterfactual theory who wants to resist the conclusion that all three people equally caused the harm.

  Once you have done all of that, give me a structured summary as a single JSON object using exactly this schema: a field "scenario_label" (string) holding a short name for the case; a field "candidates" holding an array of exactly three objects, one per person, each with "role_description" (string, a short phrase identifying who they are in the scenario), "has_assigned_duty" (true or false), "counterfactual_theory_verdict" ("cause" or "not a cause"), "expectation_theory_verdict" ("cause" or "not a cause"), and "ordinary_judgment" ("cause" or "not a cause", meaning how you expect most people to judge the case before doing any theorizing); a field "differentiating_feature" (string) holding one sentence naming what actually distinguishes the three people; a field "removal_and_addition_test" (string) holding one or two sentences on what happens to each theory's verdict when the duty is stripped from everyone and when it is extended to everyone; a field "counterfactualist_rebuttal" (string) holding the strongest reply available to a defender of the counterfactual theory; and a field "bottom_line" (string) holding a single sentence on what the case shows about the relationship between the two theories.
reasoning: |-
  We are constructing a scenario with three people in a present-day ordinary setting (workplace or household). All three are present, equally capable, and equally aware that a preventive action needs to be done. Each individually, if they had acted (with the others still not acting), would have prevented the harm. Exactly one has an assigned duty (via role, contract, or explicit prior agreement) to perform the action. The others do not. The harm occurs because no one acts.

  Scenario:
  In a modern office, three colleagues — Alex (the office manager, explicitly responsible for locking the main door at closing time), Bailey (a regular employee), and Casey (another regular employee) — are the last to leave. The office policy states that Alex must lock the door. All three are equally near the door, equally capable of locking it, and all are aware that the door must be locked to prevent theft. They each forget. Later, a theft occurs because the door was left unlocked.

  Now, we break down the analysis:

  1. **Plain Counterfactual Theory**: 
     - For an event C to cause E, E would not have occurred without C.
     - Here, the harm is the theft. We consider each person's inaction (not locking the door) as a candidate cause.
     - For Alex: If Alex had locked the door (even if Bailey and Casey didn't), the theft would not have occurred. So, Alex's inaction passes the counterfactual test and is a cause.
     - For Bailey: If Bailey had locked the door (with Alex and Casey not acting), the theft would not have occurred. So, Bailey's inaction also passes and is a cause.
     - Similarly for Casey: If Casey had locked the door (with the others not acting), the theft would have been prevented. So, Casey's inaction is also a cause.
     - Therefore, the counterfactual theory says that all three inactions are causes of the theft. It has no inherent resources to treat them differently because the counterfactual dependence is symmetric.

  2. **Expectation Theory (omission as cause only when the outcome is a departure from what is expected given roles)**:
     - This theory says that an omission (failure to act) is a cause only if the person had a duty (assigned role) and the outcome was a departure from the normal or expected course of events given that role.
     - Alex: Has an assigned duty (office manager with explicit responsibility). The theft occurred because Alex failed to do what was expected. So, Alex's inaction is a cause.
     - Bailey: No assigned duty, so even though Bailey could have locked the door, the expectation theory does not count Bailey's inaction as a cause because there was no expectation for Bailey to act. Similarly for Casey.
     - Therefore, only Alex's inaction is a cause under the expectation theory.

  3. **Differentiating Feature**:
     - The single feature that distinguishes the three is the assigned duty (via explicit prior agreement, role, or contract) that only Alex has. This is not a difference in skill, proximity, or counterfactual strength (since all are equally capable and present, and each individual action would have prevented the harm).

  4. **Removal and Addition Test**:
     - **If the assigned duty is taken away from everyone**: Then no one has a special duty. The counterfactual theory would still count all three inactions as causes (because each individual action would have prevented the harm). The expectation theory would now count none as a cause (because without assigned duties, there's no departure from expectation for any individual). 
     - **If the same duty is extended to all three** (e.g., a new policy that every employee must lock the door if they are last to leave): Then the counterfactual theory still counts all three. The expectation theory now counts all three as causes because each had a duty and failed to meet it.

  5. **Counterfactualist Rebuttal**:
     - The strongest move for a counterfactual theorist to avoid saying all three equally caused the harm is to argue that causation is not just about counterfactual dependence but also about the actual causal process. They might invoke the concept of preemption or overdetermination. However, in this symmetric case, overdetermination (each omission is a sufficient condition for the harm) but not preemption. Alternatively, they might argue that we should focus on the actual sequence of events and the absence of any locking action. But then they might say that the harm was caused by the collective inaction, and individually each omission is a cause. To resist the equal blame, they might appeal to normative factors (like responsibility) outside of causation. But strictly within causation, they might bite the bullet and say all three are causes, but then add that responsibility is a separate matter. Another move is to argue that the counterfactual test is not the whole story and that we need to consider the context of the events. However, the classic counterfactual theory (like Lewis's) would indeed count all three.

  Now, the structured summary as a JSON object:

  - scenario_label: "Unlocked Office Door"
  - candidates: an array of three objects for Alex, Bailey, Casey.

  For each candidate:
    - Alex: 
        role_description: "Office manager"
        has_assigned_duty: true
        counterfactual_theory_verdict: "cause"
        expectation_theory_verdict: "cause"
        ordinary_judgment: "cause" (since Alex was the one assigned, people would blame Alex)
    - Bailey:
        role_description: "Regular employee"
        has_assigned_duty: false
        counterfactual_theory_verdict: "cause"
        expectation_theory_verdict: "not a cause"
        ordinary_judgment: "not a cause" (people wouldn't typically blame Bailey because it wasn't their job)
    - Casey: same as Bailey.

  Differentiating_feature: "Alex has an explicitly assigned duty to lock the door, while Bailey and Casey do not."

  Removal_and_addition_test: "If the duty is stripped from everyone, counterfactual theory still deems all three inactions as causes while expectation theory deems none; if the duty is extended to all, counterfactual theory still deems all three as causes and expectation theory deems all three as causes."

  Counterfactualist_rebuttal: "A defender of the counterfactual theory might argue that causation is symmetric in such cases but that responsibility (a normative notion) is not, and that we should not conflate causation with responsibility; alternatively, they might refine the theory to require that a cause must be a deviation from normal conditions, but this moves towards the expectation theory."

  Bottom_line: "The case shows that the two theories yield different verdicts on the causal status of omissions when only one agent has an assigned duty, highlighting that the counterfactual theory is blind to normative roles while the expectation theory is not."

