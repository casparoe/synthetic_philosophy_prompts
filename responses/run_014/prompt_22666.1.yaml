  I should also differentiate between arithmetic with discrete units and geometry's continuous magnitudes. Hobbes blurs this, but later math shows they're fundamentally different. The user might benefit from examples like adding vectors versus scalars, or how multiplication in vectors isn't commutative, unlike repeated addition.

