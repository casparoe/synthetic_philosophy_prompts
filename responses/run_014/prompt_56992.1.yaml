  First, analyzing her existing verdicts:
  - Kripkean cases (1-2) show rigid designation creating necessary a posteriori truths
  - Historical facts (3) are contingent a posteriori
  - Measurement standards reveal a pattern: definitions create contingent a priori truths when tied to specific artifacts (4-5), but become necessary a priori when abstracted to fixed constants (7)

  The key tension is between artifact-based definitions (contingent but knowable a priori) vs. constant-based definitions (necessary a priori). For the speed of light sentence:
  - Under Rule 1 (fixing = necessity), it's necessary a priori like the yard-metre relation
  - Under Rule 2 (stipulation priority), it's contingent a priori like the meter bar
  - Under Rule 3 (fundamental constants), it's necessary a priori

  Her 2011 kilogram verdict suggests she still favored artifact-based thinking then, but the 2019 redefinition shifted to constants. Since the speed of light definition was adopted in 1983 and reaffirmed in 2019, I think she'd now treat it as necessary a priori.

  To test this, I'd propose classifying the post-2019 Planck constant definition: "The Planck constant is exactly 6.62607015×10⁻³⁴ J·s". Rule 1 predicts necessary a priori, Rule 2 predicts contingent a priori. Her actual view likely aligns with Rule 1 given the evolution of SI definitions toward fixed constants.
answer: |-
  **Predicted classification:** Necessary, knowable a priori.

  **(a) Candidate rules:**
  1. **Stipulation Rule:** A sentence expressing a definitional stipulation (fixing a value or relation) is necessary and a priori. Artifact-based definitions (where the standard *is* a specific object) yield contingent a priori truths for identity sentences involving that object.
  2. **Fixing Rule:** Sentences stating a value fixed by definition (like constants or unit conversions) are necessary and a priori. Sentences identifying a specific artifact *as* the standard are contingent but a priori for the definer.
  3. **Fundamental Constant Rule:** Definitions fixing fundamental constants (like *c* or *h*) yield necessary a priori truths. Artifact-based standards yield contingent a priori truths.

  **(b) Classifications and divergence:**
  - **Rule 1 (Stipulation):** "Light travels..." is necessary a priori (like #7, a fixed conversion).  
  - **Rule 2 (Fixing):** Necessary a priori (fixed constant, akin to #7).  
  - **Rule 3 (Fundamental Constant):** Necessary a priori.  
  All rules agree here (necessary a priori). They diverge on artifact-based identities like #4 and #5.

  **(c) Best guess and reason:**  
  She will rule it **necessary, knowable a priori**. Prefer **Rule 2 (Fixing)**:  
  - It cleanly explains all verdicts:  
    - Necessary a posteriori: Rigid designator identities (#1, #2).  
    - Contingent a posteriori: Empirical/historical facts (#3, #6).  
    - Contingent a priori: Artifact-as-standard identities (#4, #5).  
    - Necessary a priori: Fixed constants/conversions (#7, and the footnote).  
  - #5 (2011 kilogram verdict) shows her commitment to contingent a priori for artifacts. Rule 2 extends consistently to fixed constants (#7) and the footnote (which fixes *c*). Rule 1 struggles with #5’s contingency; Rule 3 underplays artifacts.

  **(d) Separating sentence and predictions:**  
  Sentence: **"The Planck constant is exactly 6.62607015 × 10⁻³⁴ joule-seconds"** (post-2019 definition).  
  - **Rule 2 (Fixing):** Necessary a priori (fixed by definition, like *c* or yard-metre).  
  - **Rule 1 (Stipulation):** *If* "Plank constant" is seen as a rigid designator for a natural kind, it might be necessary a posteriori (like #2). But Rule 1’s focus on stipulation could ambiguously imply necessity a priori. Rule 2 clearly predicts **necessary a priori**, aligning with the footnote sentence’s treatment.  

  **Ambiguity note:** "Metre" in the footnote refers to the *defined unit* (not the pre-1983 artifact), selected because her verdicts distinguish definitions from accidental properties (e.g., #6 vs. #4).
