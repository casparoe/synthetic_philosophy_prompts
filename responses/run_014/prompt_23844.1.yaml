  We are going to design an in-class activity where students, in small groups, try to build a scoring rule for two groups (Group A and Group B) with different base rates. The goal is to achieve three properties simultaneously: calibration within groups, equal false positive rates (FPR), and equal false negative rates (FNR). We will rig the base rates so that it's impossible to achieve all three.

  **Materials:**
  - Two sets of pre-prepared index cards (or printed slips) for Group A and Group B, each card representing an applicant. Each card has a unique ID and a pre-assigned ground truth label (qualified or not qualified). The distribution of labels will reflect different base rates (e.g., Group A has a higher base rate of qualified applicants than Group B).
  - A worksheet for each group to record their scoring rule (they will assign a score to each applicant) and then compute the confusion matrices for each group and the overall statistics.
  - Calculators (or they can use their phones).
  - A whiteboard or projector to display the scoring/stakes scheme and to record group findings in the debrief.

  **Group Setup:**
  - Divide the class into small groups of 3-4 students each.
  - Each group gets two sets of cards: one stack for Group A (say, 20 applicants) and one for Group B (say, 20 applicants). We fix the base rates by having a different proportion of qualified applicants in each group.

  **Base Rate Setup:**
  - Group A: 12 qualified (60%), 8 not qualified (40%)
  - Group B: 8 qualified (40%), 12 not qualified (60%)

  **Scoring Rule:**
  - Each group must assign a numerical score between 0 and 100 to each applicant. They can use any method: they can make up scores arbitrarily, try to be "fair", or even try to game the system. The only rule is that they must assign a score to every applicant.

  **Threshold and Predictions:**
  - After assigning scores, the group must choose a single threshold (say, 50) to make a binary decision: if score >= threshold, predict "qualified"; otherwise, predict "not qualified". They can choose the threshold arbitrarily, but it must be the same for both groups.

  **Properties to Achieve:**
  1. **Calibration within groups**: For each group, among those assigned a score of (or near) a particular value, the proportion that is actually qualified should be close to that score (interpreted as a probability). However, because of the discrete setting, we might simplify: we can ask them to check that the average score in each group is close to the actual base rate? But note: the full calibration condition is more demanding. Alternatively, we can avoid checking full calibration and instead focus on the next two and the base rate match? But the theorem requires calibration. However, for simplicity and time, we might focus on the base rate as the overall calibration. Alternatively, we can have them bin the scores? Given time constraints, we might predefine two bins: low (0-49) and high (50-100). Then calibration would require that in the high bin, the proportion of qualified should be the same for both groups? Actually, the theorem often uses the idea that the score is the probability of being positive, so we can check the overall expected score vs base rate? But that might be too aggregate.

    **Simplification for Activity:** We will focus on the overall base rate matching the average predicted probability. However, note that the impossibility result holds even for perfect calibration. Since the activity is constrained, we can define a simplified version of calibration: the average score for each group should be equal to the base rate of that group. This is a necessary condition for perfect calibration (if we interpret the score as the probability of being qualified). So:

    - For Group A: average score should be 0.6 (or 60%).
    - For Group B: average score should be 0.4 (or 40%).

    But note: this is an aggregate and doesn't capture the full calibration, but it is a start and will help in the impossibility.

  2. **Equal False Positive Rate (FPR)**: The proportion of unqualified applicants that are incorrectly predicted as qualified should be the same for both groups. FPR = FP / (FP + TN) [where TN is the true negatives, i.e., unqualified and predicted unqualified].

  3. **Equal False Negative Rate (FNR)**: The proportion of qualified applicants that are incorrectly predicted as unqualified should be the same for both groups. FNR = FN / (FN + TP).

  **Scoring/Stakes Scheme (without money):**
  - We will give each group a "success score" for the activity. They start with 0 points and can earn up to 3 points, one for each property achieved. They get 1 point for each property if they achieve it (within a tolerance, say 0.05). For example:
    - Calibration: The absolute difference between the average score and the base rate in each group is <= 0.05.
    - FPR: The absolute difference between the FPR of Group A and Group B is <= 0.05.
    - FNR: The absolute difference between the FNR of Group A and Group B is <= 0.05.

  Alternatively, we can make it more competitive by having a leaderboard, but the point is to show the impossibility.

  **Timeline (75-minute session):**

  1. **Introduction (5 minutes):**
     - Explain the setup: two groups of applicants, each group has a set of cards with known ground truth (qualified/not). The goal is to assign scores and then set a threshold to make predictions. They want to achieve three properties: calibration (average score matches base rate in each group), equal FPR, and equal FNR.

  2. **Group Work (30 minutes):**
     - Groups assign scores and choose a threshold. They record their decisions and compute the metrics.

  3. **Group Reporting (10 minutes):**
     - Each group writes their three metrics (calibration for A, calibration for B, FPR difference, FNR difference) on the board.

  4. **Discussion (15 minutes):**
     - Look at the board: no group will have all three properties. Discuss why. Then reveal the impossibility theorem.

  5. **Debrief and Lecturette (15 minutes):**
     - Map the activity to the theorem: explain that when base rates differ (p_A != p_B), it's impossible to have:
       - Calibration: P(Y=1 | S=s, Group=A) = P(Y=1 | S=s, Group=B) = s (for every score s) [but we used average score as a proxy]
       - Equal FPR: P(hat Y=1 | Y=0, Group=A) = P(hat Y=1 | Y=0, Group=B)
       - Equal FNR: P(hat Y=0 | Y=1, Group=A) = P(hat Y=0 | Y=1, Group=B)

     - Show mathematically why it's impossible: 
       - From calibration, the expected score in group A is p_A and in group B is p_B.
       - The FPR and FNR are determined by the threshold and the score distributions. But the key is that the threshold is the same for both groups. 
       - The FPR and FNR are linked by the base rate and the threshold. Specifically, note that the true positive rate (TPR) is 1 - FNR. And the positive predictive value (PPV) can be derived from base rate, TPR, and FPR by Bayes. But the impossibility comes from the fact that calibration and equal FPR/FNR force a contradiction when base rates differ.

     - Show the equation from the theorem: 
          FPR = (1 - p) * (1 - PPV) / [ p * (1 - TPR) + (1-p) * (1 - PPV) ]   [this is not standard]

       Actually, the standard argument: 
          Under calibration, the PPV (precision) for a given threshold is the same for both groups? Not exactly. The standard argument is that if the classifier is calibrated, then for a given threshold, the proportion of positives in the positive predicted class (PPV) is the same for both groups? Actually, calibration is about the score being the probability of Y=1. 

       The core of the proof: 
          Let s be the threshold. Then, by calibration, in group A, the proportion of qualified in the positive class (i.e., PPV_A) is s. Similarly, PPV_B = s. 
          Also, the FPR and FNR are defined. 

          We have: 
            TPR_A = P( score >= s | Y=1, A) 
            FPR_A = P( score >= s | Y=0, A)

          Then, the PPV_A = P(Y=1 | score>=s, A) = [ p_A * TPR_A ] / [ p_A * TPR_A + (1-p_A) * FPR_A ] 
          But by calibration, this must equal s. Similarly for group B: 
            PPV_B = [ p_B * TPR_B ] / [ p_B * TPR_B + (1-p_B) * FPR_B ] = s

          So we have:
            [ p_A * TPR_A ] / [ p_A * TPR_A + (1-p_A) * FPR_A ] = [ p_B * TPR_B ] / [ p_B * TPR_B + (1-p_B) * FPR_B ]

          Now if we want FPR_A = FPR_B and FNR_A = FNR_B (which implies TPR_A = TPR_B, because TPR=1-FNR), then we get:
            [ p_A * TPR ] / [ p_A * TPR + (1-p_A) * FPR ] = [ p_B * TPR ] / [ p_B * TPR + (1-p_B) * FPR ]

          This equation can only hold if p_A = p_B, which is not the case.

     - Therefore, they must sacrifice at least one of the three properties.

  6. **Wrap-up (5 minutes)**: Summarize the lesson: this trade-off is fundamental and not due to biased data or poor engineering. It forces us to think about which fairness criterion to prioritize.

  **Predictable Problems:**
  - **Time**: 30 minutes might be tight for groups to assign scores and compute. We can pre-assign some scores? But that would defeat the purpose. Instead, we can simplify the data: maybe 10 applicants per group? And provide a worksheet with a table to fill in the scores and then pre-computed formulas for the metrics? We can provide an Excel sheet on a laptop? But that might break the flow. Alternatively, we can do the computation together in the reporting phase? But then groups might not see their own failure. 

    **Solution**: Use a small number of applicants (10 per group) and provide a worksheet with clear computation steps. For example:

    For Group A:
      - List of applicant IDs and their true label (Q or NQ) and a blank for score.
      - After assigning scores, they choose a threshold and then fill in a confusion matrix:

          Predicted Q | Predicted NQ
