answer: |-
  ### In-Class Activity: The Fair Scoring Impossibility Experiment  
  **Goal:** Force students to confront the inherent trade-off between calibration, equal FPR, and equal FNR when base rates differ, without prior knowledge of the impossibility theorem.  

  ---

  ### **Materials**  
  1. **Applicant Cards** (pre-made, per group):  
     - **Group A (20 applicants)**: 12 qualified (Q), 8 unqualified (UQ). *Base rate: 60% Q*.  
     - **Group B (20 applicants)**: 8 qualified (Q), 12 unqualified (UQ). *Base rate: 40% Q*.  
     *(Labels hidden; only visible to instructors. Use colored index cards: blue for Group A, yellow for Group B.)*  
     
  2. **Scoring Worksheets** (per group):  
     - Tables to assign scores (0–100) to each applicant and record predictions.  
     - Calculation tables for FPR, FNR, and calibration.  

  3. **Threshold Selector Tool**: A physical slider (cardboard strip with movable clip) to set a shared threshold (0–100).  

  4. **"Fairness Scorecard"**: A grid to check success on 3 criteria:  
     - ✅ Calibration: Avg. score for Q ≈ base rate (±5%) in each group.  
     - ✅ Equal FPR: |FPR<sub>A</sub> - FPR<sub>B</sub>| ≤ 0.05.  
     - ✅ Equal FNR: |FNR<sub>A</sub> - FNR<sub>B</sub>| ≤ 0.05.  

  5. **Stakes Scheme**: Groups earn "Fairness Stars" (⭐) per achieved criterion. Most stars → "Fairness Champion" (bragging rights, no material prize).  

  ---

  ### **Roles (per group of 4)**  
  1. **Score Assigner**: Assigns scores to applicants (0–100).  
  2. **Threshold Setter**: Chooses the shared threshold for predictions.  
  3. **Auditor**: Calculates FPR/FNR and calibration stats.  
  4. **Strategist**: Tries to adjust scores/threshold to hit all 3 criteria.  

  ---

  ### **Timeline (75 min total)**  
  1. **Setup (5 min)**:  
     - Explain the goal: *"Design a scoring rule to predict if applicants are qualified (Q/UQ). Achieve all 3 fairness criteria."*  
     - Emphasize: **Same threshold for both groups**.  
     - Distribute materials. Hide base rates ("Groups A/B have different success rates").  

  2. **Activity: Build & Test (35 min)**:  
     - **Phase 1 (15 min)**: Groups assign scores freely (e.g., give higher scores to applicants they "believe" are Q).  
     - **Phase 2 (10 min)**: Set threshold → make binary predictions (Q if score ≥ threshold).  
     - **Phase 3 (10 min)**: Auditors compute metrics and check criteria. Strategists tweak scores/threshold.  

  3. **Group Reports (10 min)**:  
     - Each group shares their "Fairness Scorecard" (e.g., "We hit 2/3: calibration ✅, equal FPR ✅, but not FNR ❌").  
     - **Key**: Record results on the board.  

  4. **Debrief (25 min)**:  
     - **Reveal the wall (5 min)**: "No group achieved all 3? Why? Let’s diagnose."  
     - **Map to theorem (15 min)**:  
       - Reveal base rates (A: 60%, B: 40%).  
       - Derive mathematically:  
         *If calibration holds, average score for Group A = 0.6, Group B = 0.4.*  
         *For equal FPR and FNR, the threshold must satisfy:*  
         `FPR = P(score ≥ threshold | UQ)`  
         `FNR = P(score < threshold | Q)`  
         *With differing base rates, these equations conflict.*  
       - Show **which property failed**:  
         Groups that forced equal FPR/FNR → calibration broke.  
         Groups that forced calibration → FPR or FNR diverged.  
     - **Conclusion (5 min)**: Trade-off is structural. Not about data bias—it’s a fundamental incompatibility.  

  ---

  ### **Predictable Failure Modes & Mitigations**  
  - **First-run risk: Groups "solve" it by accident?**  
    *Unlikely with rigged base rates.* If a group reports all 3, audit their math publicly—they likely miscalculated FPR/FNR. Use this to highlight metric sensitivity.  

  - **Groups ignore calibration?**  
    *Mitigation*: Require calibration to be checked first (it’s the easiest to compute). Frame it as "reliability" (e.g., "If an applicant scores 70, does 70% with that score succeed?").  

  - **Time crunch?**  
    *Mitigation*: Pre-calculate FPR/FNR formulas on worksheets. Use smaller groups (10 applicants each) if needed.  

  - **Frustration stalls activity?**  
    *Mitigation*: Encourage groups after 20 min: "This is hard! Document what you tried." Debrief validates their struggle.  

  ---

  ### **What the Activity Can’t Teach**  
  1. **Continuous Scores vs. Binary Classifiers**: Students use binary thresholds, but the theorem holds for *any* score distribution. The activity simplifies to a threshold model—mention this gap in debrief.  
  2. **Asymptotic Nature**: The theorem assumes perfect calibration/FPR/FNR, but real systems approximate. The activity shows the tension exists even in ideals.  
  3. **Generalization to >2 Groups**: The activity uses two groups—briefly note the result extends.  

  ---

  ### **Why This Design Works**  
  - **Base rates are the trap**: With 60% vs. 40%, compromise is unavoidable. Students *experience* the trade-off before labeling it.  
  - **Concrete metrics > abstraction**: FPR/FNR/calibration are computed from physical cards—no "black box" math.  
  - **Debrief mirrors their struggle**: Start with their reports ("What broke?"), then reveal the theorem as the "aha" explanation.  
  - **No escape hatches**: Forcing a shared threshold and pre-rigged groups ensures structural failure.  

  **Final Defense**: This isn’t a lecture with examples—it’s students *creating* the problem themselves. The physicality (cards, sliders) and competitive stakes make the impossibility visceral. When they hit the wall, the theorem becomes the map, not the territory.
