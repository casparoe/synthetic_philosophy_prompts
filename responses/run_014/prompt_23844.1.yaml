        Average score = (sum of scores) / total
        FPR = FP / (FP + TN)
        FNR = FN / (FN + TP)

    Similarly for Group B. Then compute the absolute differences between groups for FPR and FNR.

  - **Confusion about Calibration**: The simplified calibration (average score equals base rate) might be achieved by just setting every applicant in Group A to 0.6 and every applicant in Group B to 0.4. Then they can set a threshold arbitrarily. But then if they set the threshold at 0.5, then all of Group A is predicted positive and all of Group B is predicted negative. Then:
      Group A: 
          TP = 12, FP = 8 -> FPR = 8/8 = 1? (if we have 8 NQ) -> actually, FPR = 8/8 = 1.0
          FNR = 0/12 = 0? (because no qualified are missed) -> 0
      Group B:
          TP = 0, FN = 8? (if all are predicted negative) -> FNR = 8/8 = 1.0
          FPR = 0? (because no NQ are predicted positive) -> 0

      Then FPR difference = |1.0 - 0| = 1.0 -> not equal.
      FNR difference = |0 - 1.0| = 1.0 -> not equal.

      And if they try to adjust the threshold, they might get closer but not achieve both.

    But note: they might try to set different distributions of scores. However, the impossibility will hold.

  - **Groups might not try to achieve all three**: The activity must be clear that they are to try to achieve all three. The scoring (with 3 points) motivates them.

  - **Groups might use different thresholds for each group**: The rules state the same threshold for both groups. We must emphasize that.

  **What the Activity Can't Get Across:**
  - The full calibration condition (for every score, the proportion of qualified equals the score) is not captured by the average. The impossibility holds for perfect calibration, which is stronger than just matching the average. But the average condition is a necessary condition and will suffice to show the trade-off in this setting.
  - The activity uses a fixed threshold and a deterministic binary decision. The theorem applies to probabilistic classifiers and any threshold, but the activity uses one threshold. However, the impossibility is for any threshold, so if they try multiple thresholds and fail, that's consistent.

  **Defense of This Version:**
  - It is hands-on: students actively assign scores and see the trade-off.
  - It uses a simplified version of calibration that is easy to compute and understand.
