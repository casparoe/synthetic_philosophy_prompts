  ## Joint Statement: Daniel Dennett & Gregg Caruso on Free Will, Desert, and Punishment

  After extensive dialogue aimed at minimizing verbal confusion and maximizing substantive engagement, we (Dennett and Caruso) find significant common ground alongside persisting disagreements. This statement clarifies both.

  **1. Agreed Claims:**
  We jointly affirm the following propositions:
      1.  **Determinism & Science:** The universe, including human brains and decision-making processes, operates according to deterministic (or deterministic-plus-quantum-random) laws. Neuroscience illuminates the mechanisms of behavior but does not *by itself* settle normative questions about responsibility or punishment.
      2.  **Rejection of Libertarian Free Will:** We agree that contra-causal, "could-have-done-otherwise-under-identical-past-conditions" libertarian free will is incoherent, unsupported by science, and unnecessary for a workable social order. No one possesses this kind of free will.
      3.  **Value of Compatibilist Capacities:** The suite of human capacities identified by compatibilists (e.g., deliberation, sensitivity to reasons, self-control, responsiveness to moral considerations, ability to learn from consequences) are real, empirically investigable, immensely valuable, and crucial for personhood and social interaction. A society should want to foster these capacities.
      4.  **Forward-Looking Aims of Legal Systems:** The primary *practical* functions of the legal system concerning offenders must include: (a) **Deterrence** (discouraging future offenses by the individual and others), (b) **Incapacitation** (temporarily preventing dangerous individuals from causing harm), (c) **Rehabilitation** (equipping individuals to re-enter society without re-offending), and (d) **Restoration** (addressing harms to victims and communities where feasible). These aims are pragmatically essential and morally justifiable.
      5.  **Practical Reforms:** Current punitive systems, especially in the US, are often excessive, counterproductive, cruel, racially biased, and fail to adequately prioritize rehabilitation and restoration. Significant reform towards a more humane, effective, evidence-based system focused on safety, prevention, and reintegration is urgently needed. Practices like prolonged solitary confinement and mass incarceration should be drastically curtailed.
      6.  **Blame as Communication/Sanction:** Holding individuals accountable involves communicative practices (condemnation, demands for justification, expression of expectations) and sanctions (consequences). These practices can serve forward-looking functions (e.g., norm reinforcement, behavior modification) without necessarily invoking "basic desert."
      7.  **No Exemption from Sanction:** The absence of libertarian free will or "basic desert" does *not* imply that harmful actors should face no consequences. Social intervention (including significant restraint) is justified based on dangerousness, the need for deterrence, and the potential for rehabilitation.

  **2. Disagreements Table:**

  | Point of Disagreement (Neutral Statement)                   | Dennett's Stated Position                                                                                                | Caruso's Stated Position                                                                                                |
  | :---------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | **1. Existence of Basic Desert:**                           | **"Basic desert" exists:** Individuals who commit wrongful harms *can* deserve certain negative responses (condemnation, sanctions) simply in virtue of being competent, reasons-responsive agents who knowingly did wrong, even absent further instrumental benefits. This desert is non-retributive in the "hurting for its own sake" sense but involves a fitting, non-instrumentally *grounded* response to agential quality. | **"Basic desert" is illusory:** No one ever intrinsically deserves suffering, hardship, or condemnation *just because* they committed a past wrong, independently of future consequences (deterrence, rehabilitation, safety). Desert, in this intrinsic sense, is an unjustified fiction. |
  | **2. Sufficiency of Forward-Looking Justifications:**       | **Forward-looking justifications are necessary but insufficient:** A system *solely* justified by deterrence, incapacitation, and rehabilitation risks becoming manipulative, disrespectful, and losing the crucial element of *holding the agent accountable* for their deed. Desert provides the non-arbitrary grounding for why *this* person, and not another, is subject to sanctions. | **Forward-looking justifications are sufficient and preferable:** A system focused exclusively on prevention, safety, rehabilitation, and restoration (the Public Health-Quarantine model) can achieve all necessary social goals without relying on the problematic concept of desert. It is more humane, just, and effective. |
  | **3. Social Consequences of Abandoning "Desert":**          | **Abandoning desert is socially dangerous:** Publicly renouncing desert would undermine the moral force of condemnation, erode the distinction between misfortune and injustice, diminish respect for victims, foster dangerous fatalism/nihilism, and potentially weaken the deterrent and norm-reinforcing power of the justice system. | **Abandoning desert is socially beneficial:** Publicly renouncing desert would promote a more compassionate, less vindictive society, reduce excessive punishment, focus resources on prevention and rehabilitation, diminish dehumanizing retributive attitudes, and ultimately enhance public safety and well-being. |
  | **4. Conceptual Link between Responsibility & Desert:**     | **Responsibility entails desert:** Holding someone morally responsible for an action *logically involves* the judgment that they basically deserve some form of negative (or positive) response for that action, grounded in their agency. Responsibility without desert is conceptually hollow. | **Responsibility can exist without desert:** We can meaningfully hold individuals responsible (as causes, as agents whose capacities can be addressed) for forward-looking purposes (e.g., rehabilitation, norm communication) without invoking any notion of intrinsic desert for past actions. |

  **3. Cruxes (Pivotal Questions & Predictions):**

  1.  **Can societal condemnation, norm-reinforcement, and deterrence be sustained *as effectively* without *any* public belief in "basic desert" as a legitimizing foundation?**
      *   **Evidence/Argument:** Historical/sociological studies of societies with less retributive cultures; psychological experiments on motivation for rule-following and reactions to injustice under different belief framings; analysis of transitions in penal philosophy.
      *   **Dennett Predicts:** Evidence will show that explicitly desert-less systems struggle to maintain strong moral condemnation and robust deterrence, potentially leading to increased cynicism or vigilantism. The expressive function of punishment requires desert.
      *   **Caruso Predicts:** Evidence will show that forward-looking justifications, properly communicated (emphasizing harm, safety, fairness, rehabilitation), can sustain social cohesion and compliance as effectively, or more so, without the harms of retributivism.

  2.  **Are retributive attitudes (anger, resentment, the desire for payback) *necessary* evolutionary/cultural adaptations for social cohesion and cooperation, or are they maladaptive relics that can be safely transcended?**
      *   **Evidence/Argument:** Evolutionary psychology research on the origins and functions of moral emotions; anthropological studies of diverse cultures' responses to wrongdoing; neuroscience of prosocial vs. retributive motivations; effectiveness of restorative justice practices.
      *   **Dennett Predicts:** Evidence will show these attitudes, while needing channeling, are deeply ingrained and play a crucial role in motivating defense of norms and cooperation; attempts to eliminate them entirely are unrealistic and destabilizing.
      *   **Caruso Predicts:** Evidence will show these attitudes are context-dependent, often counterproductive, and that humans possess strong capacities for compassion and forward-looking problem-solving that can effectively replace retribution as the primary motivator for sanction.

  3.  **Does employing compatibilist responsibility practices *inevitably* foster or rely upon (even implicitly) beliefs in "basic desert" within the broader population?**
      *   **Evidence/Argument:** Philosophical analysis of the concepts; sociological studies of public understanding of legal concepts like "guilt" and "punishment"; cognitive science research on folk intuitions about free will and desert.
      *   **Dennett Predicts:** Evidence will show compatibilist concepts can be understood and function effectively without smuggling in libertarian notions, and provide the only viable alternative to either desert-based systems or potentially dangerous consequentialism.
      *   **Caruso Predicts:** Evidence will show that compatibilist responsibility language and practices are *consistently interpreted* by the public (and often by practitioners) as implying basic desert, making it impossible to disentangle in practice and perpetuating harmful retributivism.

  **4. Verbal Disputes & Remaining Substance:**

  *   **"Desert":** This is the most significant verbal divergence.
      *   *Dennett* uses "desert" in a *compatibilist* sense: a fitting, non-arbitrary consequence grounded in the agent's competence and the nature of their act, serving essential social functions *without* requiring intrinsic value in suffering. It's *consequence*-oriented.
      *   *Caruso* uses "desert" (especially "basic desert") in a *retributive* sense: the intrinsic, non-instrumental *deservingness of suffering/hardship* based solely on a past wrongful act. It's *suffering*-oriented.
      *   **Resolution:** Dennett denies advocating for Caruso's definition of desert. If "desert" *means* intrinsic deservingness of suffering, Dennett agrees it doesn't exist. However, Dennett argues that a non-retributive, compatibilist notion of desert *is* essential and distinct. **Remaining Substance:** The dispute over whether this compatibilist "desert" is coherent, necessary, and socially beneficial, or whether it inevitably collapses into or fosters retributive attitudes in practice.

  *   **"Moral Responsibility":**
      *   *Dennett* defines it primarily as the *status* of being an appropriate target of demands, expectations, praise, blame, and sanctions based on one's competence as a reasons-responsive agent. "Holding responsible" involves these practices grounded in desert (in his sense).
      *   *Caruso* defines it as inherently tied to *basic desert*. If basic desert is illusory, then moral responsibility in this strong sense is also illusory. Forward-looking "responsibility" is purely functional.
      *   **Resolution:** They agree on the *capacities* involved (reasons-responsiveness, etc.) and the *practices* needed (sanctions, communication). **Remaining Substance:** The dispute over whether the practices of holding responsible *require* a foundation in non-instrumental desert (Dennett) or can be fully justified and operationalized solely by forward-looking aims (Caruso).

  *   **"Free Will":**
      *   *Dennett* defines it as the valuable set of compatibilist capacities (listed in Agreed Claim #3) that are worth wanting and preserving.
      *   *Caruso* often defines it as requiring ultimate responsibility/libertarian free will, which he rejects. He may grant the value of compatibilist capacities but denies they constitute "free will" in a sense that grounds desert-based responsibility.
      *   **Resolution:** They agree libertarian free will is illusory and that compatibilist capacities are valuable. **Remaining Substance:** The dispute over whether labeling these capacities "free will" is useful or misleading in the context of responsibility, and whether their existence supports Dennett's notion of desert.

  **Conclusion:** While significant terminological differences (especially around "desert") have obscured common ground on determinism, scientific realism, the rejection of libertarianism, the value of compatibilist capacities, and the urgent need for pragmatic penal reform, a core substantive disagreement remains. This disagreement centers on whether a compatibilist notion of non-retributive desert is a necessary and beneficial foundation for holding individuals accountable and maintaining a just social order (Dennett), or whether it is an incoherent or inevitably harmful concept that must be replaced entirely by a forward-looking, public health-oriented model of social protection and rehabilitation (Caruso). The identified cruxes point towards empirical and conceptual investigations that could meaningfully advance this debate.
