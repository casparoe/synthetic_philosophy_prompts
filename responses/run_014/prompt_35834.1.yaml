prompt: |-
  I keep running into the old puzzle of the ship whose planks are replaced one by one, and I've noticed something odd about how the debate over it proceeds: nobody disagrees about the facts. The schedule of replacement, the salvage of the discarded planks, the duplicate ship built from them — all of that is common ground. What the sides disagree about is what a theory of persistence is supposed to do with such cases, and that's the part I want nailed down before I commit to any view. So write me the specification, not the sales pitch: the list of requirements an adequate theory of how objects persist through change and replacement must meet, with the case or consideration behind each.

  The list should at least cover:

  - The cases any theory must get right, beyond the vanilla gradual-replacement story: the version where the discarded planks are reassembled into a rival ship that coexists with the continuously repaired one; the version where the original is destroyed and a later duplicate is built from new materials to the same plans; the version where the ship is dismantled and left in storage for decades before reassembly; and a borderline I rarely see discussed — a ship that spends half its life beached as a static museum exhibit while its name is transferred to an actively sailing successor.
  - The distinctions a theory must not collapse: being the same object versus being an exact continuation of one versus being a faithful replica; the identity of the ship versus the identity of its matter; answers that are relative to a kind — same ship, same collection of planks, same fleet, same business operating it — versus answers that are absolute and kind-independent; and, if the theory distinguishes them, sameness of thing from sameness of matter persisting.
  - The constraints it cannot contradict: the formal properties of identity, above all transitivity and Leibniz's law, since those are what generate the sharpest pressure — any story on which the repaired ship, the reassembled ship, and the duplicate all claim a single original had better not make identity non-transitive in the process; whatever one's best account of parthood implies about how much of a thing can be swapped out while it survives; and the verdicts we actually rely on in practice, where money and obligations turn on the answer — a heritage registry deciding whether a heavily restored cathedral counts as the original, a marine insurance contract that pays out only if it is the same vessel that departed, a court deciding whether a business that has since replaced every employee, asset, and location still owes a debt incurred forty years ago.

  For each requirement, say whether it is non-negotiable or merely the preference of one camp, and flag any subset you suspect cannot be jointly satisfied — I am especially interested in whether any theory can deliver determinate, absolute, single answers in the reassembly and duplicate cases while preserving transitivity, or whether the requirements of determinacy and of transitivity quietly force a choice between them. Note, too, which single requirement on your list does the most to eliminate otherwise respectable contenders.

  Then, briefly, score the main views against the list — the endurance picture on which identity through time is governed by a sortal, the four-dimensional picture on which objects have temporal parts, best-candidate approaches, and the view that there is simply no fact of the matter and the question is settled by convention or by our interests — but keep this short; the criteria are where I want the thinking. Fix the standard of adequacy as follows: a theory counts if it is good enough to decide the courthouse and registry disputes, not merely to classify them. If you think that standard is itself the crux — that no metaphysics of persistence could be what those institutions are implicitly using — say so and explain what would have to be true for the specification to be satisfiable at all.
reasoning: |-
  Okay, let me approach this systematically. The user wants a strict specification for persistence theories, not advocacy for any particular view. They're clearly frustrated with how the Ship of Theseus debate usually focuses on arguing positions rather than clarifying the underlying requirements.

  First, I need to catalog all the cases they listed: the standard gradual replacement, the reassembled rival ship, the duplicate built later with new materials, long-term storage with reassembly, and the museum exhibit with name transfer. Each of these tests different aspects of persistence.

  For distinctions, the key is preventing conflation between: numerical identity vs continuation vs replica, object identity vs matter identity, kind-relative answers vs absolute answers. The user seems particularly concerned about maintaining Leibniz's law and transitivity - any solution that sacrifices those would undermine the whole framework.

  The practical constraints are crucial here. When courts decide insurance claims or heritage status, they need determinate answers with real consequences. A theory that can't handle these isn't merely academically unsatisfying - it fails a core test of applicability. 

  I notice the user hints at a possible trilemma: can any theory deliver determinacy, absolute identity, and transitivity simultaneously in the reassembly case? That deserves special attention in the specification. 

  For scoring existing theories, I'll need to briefly check how each handles: endurance/perdurance theories, best-candidate approaches, and conventionalism against the criteria. But the emphasis should remain on the requirements, not the evaluation.

  The museum exhibit borderline case is interesting - it forces us to consider whether persistence requires continuous existence or allows gaps. And the name transfer aspect introduces social conventions into what might otherwise be pure metaphysics. This hybrid case could reveal which theories have enough flexibility.

  Throughout, I should flag which requirements are widely accepted versus contentious. For example, maintaining transitivity is nearly universal while absolute identity is more debated. And I must explicitly note where requirements conflict - that determinacy-transitivity tension seems fundamental.

  The practical constraint about legal/financial consequences might be the strongest filter. Any theory that can't resolve the insurance dispute or heritage claim would struggle to be taken seriously outside philosophy seminars. This could eliminate otherwise elegant metaphysical solutions.
answer: |-
  Here is the specification for an adequate theory of persistence through change and replacement, derived from the cases and constraints you provided. The requirements are categorized, with the driving case/consideration and negotiability status noted. Conflicts are flagged explicitly.

  ---

  ### **I. Core Case Requirements (Must Handle Correctly)**
  1.  **Gradual Replacement (Vanilla):** The theory must consistently state whether the continuously repaired ship is numerically identical to the original ship.  
      *Case:* Sequential plank replacement over time.  
      *Negotiability:* Non-negotiable. Any theory must address the core paradox.
  2.  **Reassembly Rival:** The theory must account for *both* the repaired ship *and* the reassembled ship (built from salvaged original planks) coexisting and both claiming identity with the original.  
      *Case:* Reassembly of discarded planks into a duplicate that exists alongside the repaired ship.  
      *Negotiability:* Non-negotiable. Tests transitivity and kind-relativity.
  3.  **Delayed Duplicate:** The theory must state whether a duplicate built *later* from *new materials* (same design) is numerically identical to a long-destroyed original.  
      *Case:* Original destroyed; later duplicate built from new materials.  
      *Negotiability:* Non-negotiable. Tests necessity of spatiotemporal/modal continuity.
  4.  **Dismantled & Reassembled:** The theory must state whether an object dismantled, stored for decades, then reassembled is numerically identical to the original.  
      *Case:* Ship disassembled, parts stored, later reassembled.  
      *Negotiability:* Non-negotiable. Tests gaps in existence and mereological constancy.
  5.  **Static Exhibit + Name Transfer:** The theory must distinguish the persistence of a static museum exhibit from the identity of a new, active ship bearing the same name/role.  
      *Case:* Original ship becomes museum exhibit; its name/role is transferred to a newly built active ship.  
      *Negotiability:* Non-negotiable. Tests functional/cultural identity vs. material persistence.

  ### **II. Required Distinctions (Must Not Collapse)**
  6.  **Numerical Identity vs. Continuation/Replica:** The theory must distinguish:
      *   Being the *very same object* (numerical identity).
      *   Being a *causal/functional continuation* (e.g., the repaired ship).
      *   Being a *faithful replica* (e.g., the duplicate built later from new materials).  
      *Case:* Reassembly rival & delayed duplicate.  
      *Negotiability:* Non-negotiable. Collapsing these renders the problem incoherent.
  7.  **Object Identity vs. Matter Identity:** The theory must distinguish the persistence of the *object* (e.g., the ship) from the persistence of its *matter* (e.g., the collection of planks).  
      *Case:* Reassembly rival (same matter ≠ same ship?).  
      *Negotiability:* Non-negotiable. Central to the paradox.
  8.  **Kind-Relative vs. Absolute Identity:** The theory must clarify whether identity judgments (e.g., "same ship") depend on the *kind* of thing being considered (e.g., ship, collection of planks, fleet, business) or apply absolutely.  
      *Case:* All cases, especially practical disputes (heritage, insurance, debt).  
      *Negotiability:* **Contentious.** Some theories insist on absolute identity; others embrace kind-relativity. Non-negotiable that the theory *addresses* this distinction.

  ### **III. Inviolable Constraints (Must Not Contradict)**
  9.  **Formal Properties of Identity:**
      *   **Transitivity:** If A=B and B=C, then A=C.  
      *   **Leibniz's Law:** If A=B, then A and B share all properties.  
      *Case:* Reassembly rival directly challenges transitivity (Original=Repaired? Original=Reassembled? But Repaired ≠ Reassembled!).  
      *Negotiability:* **Non-negotiable.** Violation undermines logic itself.
      *   *(Conflict Flag: Requirement 2 + Requirement 9a create intense pressure. Theories avoiding non-transitive identity must resolve the reassembly rivalry without equating Repaired and Reassembled ships.)*
  10. **Mereological Constraints:** The theory must cohere with a plausible account of parthood and composition. It must specify constraints on part replacement (how much? how fast?) for persistence.  
      *Case:* Gradual replacement & dismantling.  
      *Negotiability:* Non-negotiable (though specific constraints may vary).
  11. **Practical Verdict Compatibility:** The theory must provide principled grounds for resolving disputes where identity has real-world consequences (e.g., heritage status, insurance payout, debt obligation), matching or justifying reliable intuitions in these domains.  
      *Cases:*
      *   Heritage Registry: Is a heavily restored cathedral the original?
      *   Marine Insurance: Is the vessel that returned the same as the one that departed?
      *   Business Debt: Is a corporation that replaced all employees/assets/locations the same entity as 40 years prior?  
      *Negotiability:* **Non-negotiable.** A theory failing this is practically inert. *(This requirement eliminates many purely metaphysical theories that dismiss practical judgments as irrelevant convention.)*

  ### **IV. Determinacy & Scope Requirements**
  12. **Absolute Determinacy (Optional but Desired):** The theory should ideally provide a single, determinate, absolute answer to "Is it the same ship?" in all cases (especially reassembly and delayed duplicate), without resorting to "it depends" or convention.  
      *Case:* Reassembly rival & delayed duplicate.  
      *Negotiability:* **Highly Contentious. Major Eliminator.** Endurantism/Perdurantism struggle here; Best-Candidate/Conventionalism reject it. *(Conflict Flag: Requirement 12 + Requirement 9a + Requirement 2 is likely the core trilemma. Determinacy + Transitivity seems incompatible with both the repaired AND reassembled ship claiming identity in the rival case without contradiction.)*
  13. **Gap Tolerance:** The theory must state whether an object can cease to exist (during dismantling/storage) and later be numerically identical upon reassembly.  
      *Case:* Dismantled & Reassembled ship.  
      *Negotiability:* Contentious (Endurance often rejects gaps; Perdurance allows; Best-Candidate ambiguous).

  ---

  ### **Key Tensions & The Major Eliminator**
  *   **The Core Trilemma (Likely Unsatisfiable):** Requirements 2 (Reassembly Rival), 9a (Transitivity), and 12 (Absolute Determinacy) **cannot all be jointly satisfied** without logical contradiction or rejecting one of the ships' claims. This forces a choice:
      *   Reject Determinacy (Accept convention/interest-relativity).
      *   Reject Transitivity (Radical, rarely acceptable).
      *   Reject that *both* the repaired *and* reassembled ship can be identical to the original (Most common: only the repaired ship is identical; reassembled is a replica/reconstitution).
  *   **The Major Eliminator:** Requirement 11 (**Practical Verdict Compatibility**) is the most effective eliminator of otherwise coherent metaphysical theories. Theories that dismiss practical judgments (e.g., heritage registries, courts) as mere "convention" unrelated to true persistence fail this. A theory *must* engage with these judgments or explain why they are metaphysically grounded.

  ---

  ### **Brief Scoring of Major Views**
  *   **Endurantism (Sortal-Based Identity):**  
      *   + Handles gradual replacement via essential properties/spatiotemporal continuity (Requirement 1).  
      *   - Struggles severely with Reassembly Rival (Requirement 2) without non-transitivity or rejecting one ship. Usually favors repaired ship.  
      *   - Rejects gaps (Requirement 13).  
      *   - Often kind-relative (Requirement 8).  
      *   - Can handle Practical Verdicts (Requirement 11) if sortals align with practices.  
      *   **- Fails Requirement 12 (Absolute Determinacy)** in Reassembly Rival.
  *   **Perdurantism (4D Worm/Temporal Parts):**  
      *   + Easily handles gradual replacement (Requirement 1) - different temporal parts.  
      *   + Handles Reassembly Rival (Requirement 2): Original ship = repaired 4D worm; Reassembled ship = distinct, overlapping worm (avoids transitivity violation).  
      *   + Handles gaps (Requirement 13) if temporal parts cease.  
      *   - Absolute identity is stage/worm-indexed, often seen as less intuitive "sameness".  
      *   - Can justify Practical Verdicts (Requirement 11) via salient causal chains/roles.  
      *   **+/- Meets Requirement 12 (Determinacy)** technically (it gives answers), but the answers (distinct worms) may conflict with strong intuitions of "same object" for the reassembled ship.
  *   **Best-Candidate Theories:**  
      *   + Handles Reassembly Rival (Requirement 2): Repaired ship is best candidate *now*; reassembled might be best candidate *later* after repairs go too far.  
      *   + Can handle Dismantling (Requirement 4) & Name Transfer (Requirement 5) via candidate strength.  
      *   - Explicitly rejects Absolute Determinacy (Requirement 12) - answers are time-relative.  
      *   - Risk of circularity/arbitrariness in defining "best".  
      *   + Can align with Practical Verdicts (Requirement 11) by incorporating practical interests into "best".
  *   **Conventionalism/Interest-Relativity:**  
      *   + Easily resolves all cases (Requirements 1-5) by deferring to context/convention.  
      *   + Naturally aligns with Practical Verdicts (Requirement 11).  
      *   - Explicitly rejects Absolute Determinacy (Requirement 12) and often Absolute Identity (Requirement 8).  
      *   - Collapses Identity/Continuation/Replica distinction (Requirement 6) into convention.  
      *   - Seen as abandoning metaphysical grounding.

  ---

  ### **On the Standard of Adequacy**
  The requirement that a theory must **"decide the courthouse and registry disputes"** (Requirement 11) *is* the crux for many. It implies that a successful metaphysics of persistence must either:

  1.  **Ground** these practical judgments (i.e., show why the court/heritage registry is tracking *true persistence*), or
  2.  **Explain away** the need for grounding (e.g., by showing persistence itself is interest-relative, justifying the courts' conventional approach).

  For the specification to be *satisfiable without* conventionalism, **both** of the following must be true:
  *   There exists a *metaphysically robust fact* about persistence through part replacement.
  *   This fact is *discernible* and *reliably tracked* by the practical reasoning used in courts, registries, and everyday life (perhaps via sortals, causal roles, or mereological continuity).

  If these aren't true, then Requirement 11 forces the theory towards conventionalism or best-candidate views. The Ship of Theseus, especially the Reassembly Rival case, remains the primary test for whether robust, determinate, transitive facts of persistence can be reconciled with our practical needs. The tension between Requirements 2, 9a, and 12 suggests a robust, absolute answer satisfying all may be impossible.
