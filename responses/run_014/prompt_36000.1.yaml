answer: |-
  Below is a practical, step-by-step decision procedure tailored to your constraints. It operationalizes Goodman's entrenchment concept while explicitly accounting for the circularity risk of internal validation. The procedure is designed for efficiency (runnable in ~1 hour by stats-savvy analysts), includes escalation points for judgment calls, and outputs plain-English explanations for risk officers. It defaults to "ship with monitoring + human review" when undecidable, and flags "grue-like" features early.

  ---

  ### **Decision Procedure: Feature/Model Ship Checklist**
  **Inputs**: Feature importance scores, SHAP/partial dependence plots, documentation of past model failures, domain expert notes.  
  **Outputs**: "Ship," "Don't Ship," "Ship with Monitoring + Human Review," or "Escalate to Lead."  
  **Time Budget**: 45-60 minutes per feature/model.  

  1. **Grue-Filter**:  
     *Question*: "Could this feature's pattern be explained by internal operational artifacts (e.g., data collection quirks, policy changes, time-limited events)?"  
     *Criteria*:  
     - **Yes** (e.g., "only checked IDs on weekends"): → **Escalate to Lead** with rationale.  
     - **No** *or* **Unclear**: Proceed to Step 2.  
     *Sufficiency*: Analyst must list ≥1 alternative internal artifact hypothesis.  

  2. **Entrenchment Validation**:  
     *Question*: "Has this feature (or close proxy) survived ≥2 production deployments *outside* our immediate data ecosystem?"  
     *Criteria*:  
     - **Yes, with external validation** (e.g., used in peer-reviewed research, partner fintechs, or cross-country deployments): → Proceed to Step 4.  
     - **Yes, but only internally** (e.g., "worked in 5 backtests"): → Flag as "Circular Entrenchment" → Proceed to Step 3.  
     - **No**: → Proceed to Step 3.  
     *Sufficiency*: External validation requires citations; internal requires deployment logs.  

  3. **Causal Plausibility Gate**:  
     *Question*: "Is there a domain-grounded causal story *independent* of our data, with <5y volatility?"  
     *Criteria*:  
     - **Strong** (e.g., "high debt-to-income → default" backed by economics): → Proceed to Step 4.  
     - **Weak/Post-hoc** (e.g., "gmail users riskier because...?"): → **Ship with Monitoring + Human Review**.  
     - **None**: → **Don't Ship**.  
     *Sufficiency*: "Strong" requires consensus from risk/fraud ops teams.  

  4. **Shift-Stress Test**:  
     *Question*: "Does the feature degrade minimally (<10% Δ AUC) under synthetic shifts (e.g., label noise, adversarial perturbations, economic simulations)?"  
     *Criteria*:  
     - **Robust** (degrades <10%): → Proceed to Step 5.  
     - **Fragile** (degrades ≥10%): → **Ship with Monitoring + Human Review**.  
     *Sufficiency*: Use prebuilt scripts (e.g., IBM ART library) for simulations.  

  5. **Context Alignment**:  
     *Question*: "Is deployment context ≤80% similar to training (covariate shift)?"  
     *Criteria*:  
     - **Similar** (e.g., same country, product): → **Ship**.  
     - **Divergent** (e.g., new country, post-recession): → **Escalate to Lead** with divergence report.  
     *Sufficiency*: Measure KL divergence/PSI for key covariates; threshold at 0.2.  

  **Final Output Logic**:  
  - **Escalate to Lead** if: Grue-Filter positive, Context Alignment divergent, or values-judgment needed (e.g., legal tradeoffs).  
  - **Default to Monitoring**: If undecidable after Step 4 (e.g., weak causality but robust to shifts).  

  ---

  ### **Applied to Your Cases**
  **Case 1: Late-Night Fraud Feature (pre-call-center confirmation)**  
  - **Step 1 (Grue-Filter)**: "Yes" (suspected call-center artifact).  
  - **Output**: **Escalate to Lead** with note: "Potential operational artifact—needs call-center hour audit."  
  - *Honest assessment*: Correctly flags grue-risk. Procedure works.  

  **Case 2: Email Domain (free vs. corporate)**  
  - **Step 1 (Grue-Filter)**: "Unclear" (no obvious internal artifact).  
  - **Step 2 (Entrenchment)**: "No" external validation (only internal backtests).  
  - **Step 3 (Causal Plausibility)**: "Weak" (no domain mechanism beyond correlation).  
  - **Output**: **Ship with Monitoring + Human Review** (e.g., flag loans with free emails for manual review).  
  - *Honest assessment*: Avoids false confidence in circular entrenchment. Procedure works.  

  **Case 3: Insurance Model (Country A → Country B)**  
  - **Step 2 (Entrenchment)**: "No" external validation (never deployed in B).  
  - **Step 3 (Causal Plausibility)**: "Strong" for some features (e.g., claim frequency), "Weak" for others (e.g., local cultural factors).  
  - **Step 5 (Context Alignment)**: "Divergent" (PSI > 0.2 for income/age distributions).  
  - **Output**: **Escalate to Lead** with note: "Unvalidated context—require shadow deployment in B for 90d."  
  - *Honest assessment*: Forces explicit context-mismatch acknowledgment. Procedure works.  

  ---

  ### **Limitations: What the Procedure Misses**
  The **email domain case (Case 2)** exposes the core limitation of entrenchment:  
  - **Why it fails entrenchment**: The feature had internal backtest success but no *external* track record. The procedure correctly rejects circular validation but cannot guarantee the feature is "grue." It might be genuinely projectible (e.g., free emails correlate with financial instability) or collapse post-deployment.  
  - **What this reveals**: Entrenchment *can* be operationalized but only if:  
    1. **External anchors exist** (e.g., partnerships for cross-validation),  
    2. **We simulate external stress tests** (Step 4) to proxy real-world shifts.  
  - **Brutal truth**: Without external anchors, entrenchment is just a "good story" about the past. The procedure mitigates this by:  
    - Demanding causal mechanisms (Step 3),  
    - Defaulting to monitoring when causality is weak,  
    - Forcing escalation when context shifts (Step 5).  

  **When to distrust the output**: If external validation is impossible (e.g., no partner data) *and* causality is weak, entrenchment is unusable. The procedure flags this via "Ship with Monitoring" or escalation—it never hides uncertainty.  

