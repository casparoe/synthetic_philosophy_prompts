prompt: |-
  I'm in this polisci-adjacent reading group and we got stuck arguing about the Condorcet jury theorem and I think I ended up defending a stronger version than most people there. Basically I bought the idea that it gives democracy a real epistemic bonus — if voters are on average even a bit better than coin flips on some yes/no question and they vote independently-ish, then a big enough majority vote is almost guaranteed to be right, so adding more voters is adding truth-tracking power. My friends are now trying to stretch that to everything, like department meetings and even this half-joke plan to run 51 copies of the same chatbot and take a majority vote to fact check claims, and tbh I was nodding along.

  But I don't want to be holding a view that can't lose, so what would actually count against that strong epistemic use of the theorem? I want you to lay out the observations, weird cases, and formal results that should shake me, separating the stuff that would basically sink it from the stuff that's just uncomfortable, including whether any of that stuff has already happened in real elections or experiments, what this view predicts that a purely fair-procedure defense of democracy doesn't, what even people who love the theorem would admit hurts it, and whether all the usual fixes about independence and competance end up making it say nothing risky at all and if that's a problem. For me lab-style voter data would move me more than pure math, but I want the full map. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is in a political science reading group and got into a debate about the Condorcet jury theorem. They defended a strong version where democracy has an epistemic advantage—that if voters are even slightly better than random and vote independently, a large majority vote is almost certain to be correct. Their friends are extending this to other contexts like department meetings or using multiple chatbots for fact-checking. Now, the user wants to know what challenges this view, including real-world evidence and theoretical weaknesses.

  First, I need to recall the main critiques of the Condorcet jury theorem. The theorem relies on two key assumptions: voter independence and constant individual competence. The user mentioned that their friends are stretching this to other areas, so the critiques should address both theoretical and practical issues.

  Common criticisms include violations of independence. In real life, voters influence each other through social networks, media, or shared biases. If voters aren't independent, the theorem's predictions fail. There's also the issue of varying competence. The theorem assumes each voter has the same probability of being correct, but in reality, some people are more competent than others. If the average competence drops below 50%, adding more voters makes things worse.

  The user values lab-style data over pure math, so referencing empirical studies is important. For example, experiments with mock juries or prediction markets might show where group decisions fail. Real election data is tricky because the "correct" outcome isn't always known, but close elections or polling errors could illustrate problems.

  Another point is the common value assumption. The theorem assumes there's a single correct answer everyone agrees on. In politics, issues are often about preferences, not truth. Even if there's a truth, like in climate policy, voters might disagree on what's factual. This makes applying the theorem to subjective issues problematic.

  The user also wants to know if fixes like ensuring independence make the theorem trivial. If we engineer groups to be independent and competent, does that prove the theorem but make it inapplicable to real democracies? That's a valid critique. The theorem might only hold under idealized conditions that don't exist in reality.

  Additionally, correlated errors due to systemic biases or misinformation can skew results. For example, if all voters are exposed to the same false information, their errors are correlated, breaking the independence assumption. This happened in elections where fake news spread widely.

  They also mentioned using multiple chatbots. If all chatbots are based on the same underlying model, they're not independent. Their errors would be correlated, so majority voting wouldn't improve accuracy beyond the model's individual performance.

  The user wants a bottom line first. The strongest counter is that real-world violations of independence and competence make the theorem's predictions fail, as shown in experiments and real cases. Then, separating major issues from uncomfortable ones: independence violations and competence below 50% are critical, while unequal competence is manageable if average stays above 50%.

  Empirical evidence like jury studies or prediction markets failing in correlated scenarios would be convincing. Also, cases where adding uninformed voters worsens decisions, like in some committee settings.

  The user might also be concerned about overapplying the theorem. Highlighting that it doesn't apply to preference-based decisions or when competence isn't above chance. Plus, the theorem assumes binary choices, but many real decisions are multifaceted, reducing its applicability.

  Finally, addressing whether the theorem becomes non-risky: if we pre-select competent, independent voters, it's circular and not useful for justifying democracy as a whole. The user needs to see that the theorem's conditions are often unattainable in practice, limiting its real-world epistemic value.
answer: |-
  **The strongest empirical and theoretical counter to your strong epistemic view is that real-world violations of voter independence and systematic drops in average competence below 50% routinely break the theorem's assumptions, demonstrably causing group accuracy to plateau or even worsen with more voters, as seen in lab experiments, prediction markets, and real elections.** Here's a breakdown of what should shake your confidence, categorized by severity:

  1.  **Sinks the Strong Epistemic Claim (Fatal Flaws):**
      *   **Severe Violations of Independence (Correlated Errors):** If voters share common sources of misinformation, systemic biases, or social influence (even subtle signals), errors become correlated. The theorem *requires* statistical independence. Lab experiments (e.g., information cascade studies, mock juries exposed to the same biased evidence) consistently show correlated errors destroy the "wisdom of crowds" effect. Adding more voters just amplifies the shared error. Real-world examples:
          *   **Misinformation Campaigns:** Elections where widespread, coordinated disinformation floods the electorate (e.g., Brexit "£350m for the NHS" claim, various 2016/2020 US claims). Voters aren't independent truth-seekers; they're fed correlated falsehoods.
          *   **Media Echo Chambers:** Homogeneous media environments create correlated beliefs and errors within groups.
          *   **Chatbot Trap:** 51 identical LLMs voting? Their errors will be *highly correlated* due to shared training data/architecture. A majority vote won't reliably beat a single instance; it might even amplify systemic biases within the model. This *directly* sinks the chatbot plan.
      *   **Systemic Average Competence < 50%:** If the *average* voter is systematically worse than a coin flip on a specific complex issue, adding voters makes the majority *more likely to be wrong*. This isn't hypothetical:
          *   **Complex Policy/Technical Questions:** Lab studies (e.g., complex economic policy trade-offs, nuanced scientific questions presented to laypeople) show average voter competence often falls well below 50% on specifics. The CJT prediction fails catastrophically here.
          *   **Expertise Mismatch:** CJT predicts *adding uninformed voters* improves accuracy only if average competence >50%. Experiments adding naive participants to groups solving complex puzzles often show accuracy *decreases* as group size grows beyond a small core of competent members.
      *   **The "Common Value" Assumption Fails:** CJT assumes a single, objective, knowable "correct" answer. Politics is saturated with value conflicts, trade-offs, and inherently subjective judgments. For many "yes/no" votes (e.g., "Is policy X *best*?"), there *is no* single knowable truth the theorem can track. Applying CJT here is category error. Democracy's value here is procedural fairness, not epistemic superiority.

  2.  **Severely Wounds the Claim (Major Weaknesses):**
      *   **Heterogeneous Competence:** The classic CJT assumes equal competence (p). Real voters have vastly different p_i. While some generalizations exist (e.g., if the *median* p_i > 0.5 and distributions are symmetric, results hold roughly), it's fragile. If incompetence is concentrated, or competence correlates with suppressed turnout, the guarantee weakens or vanishes. Lab experiments manipulating competence distributions confirm this sensitivity.
      *   **Endogenous Competence:** Voter competence isn't fixed; it can *decrease* with group size or complexity. Information overload, reliance on heuristics (possibly flawed) in large electorates, or strategic voting based on perceived chances can drive average effective p below 50%. Experiments on complex tasks show individual performance often drops in large-group settings.
      *   **Strategic Voting:** CJT assumes sincere voting. Real voters often vote strategically based on polls or electability, not their best judgment of the "correct" outcome. This decouples votes from truth judgments, breaking the epistemic mechanism. Lab experiments on voting games demonstrate this clearly.
      *   **Empirical Evidence of Failure:**
          *   **Prediction Markets vs. Elections:** While markets often beat polls, they *aren't* majority votes of all voters; they aggregate weighted, often expert-informed bets. When large crowds *are* polled on complex factual questions (e.g., Metaculus community predictions vs. simple majority polls), the simple majority often performs worse than the market or expert aggregates, especially on highly technical topics where average competence is low.
          *   **Close Elections & Polling Errors:** Highly contested elections with razor-thin margins (common in reality) are precisely where CJT's "near certainty" should shine if competence >50%. Persistent polling errors and unexpected results in such elections (e.g., 2016 US, 2015 UK, 2019 Australia) suggest the theorem's assumptions (independence, stable p>0.5) often don't hold strongly enough to guarantee correctness. The "correct" outcome isn't always verifiable, but the failure of polls (which model voter intent) indicates correlated shifts or competence misestimation.

  3.  **Uncomfortable Truths (Limitations & Critiques from Proponents):**
      *   **The Competence Threshold is Fragile:** Even proponents admit the result flips disastrously if p < 0.5. Defending democracy's epistemic value requires a strong, persistent belief that p > 0.5 *on average across important issues* – a claim vulnerable to empirical challenge on specific issues.
      *   **"Independence-ish" Isn't Good Enough:** The theorem is highly sensitive to even mild correlations. Real-world "independence-ish" (voters seeing different news sources but within the same media ecosystem) often doesn't suffice to prevent significant correlation decay of the probability gain. Formal models show very small correlations rapidly erode the benefit.
      *   **Binary Choice Limitation:** Politics involves multi-option choices and continuous spectra. CJT fundamentally addresses binary decisions. Extensions exist but are more complex and less robust.
      *   **Does it Justify Democracy?** Critics argue that even *if* CJT holds sometimes, it doesn't uniquely justify democracy. An epistocracy (rule by the knowledgeable) could likely achieve higher p and thus better results under CJT logic. The epistemic defense must then argue democracy *best* achieves p>0.5 *and* independence *in practice*, or combine it with procedural values.
      *   **The Circularity/"No Risky Prediction" Trap:** If you "fix" the theorem by pre-selecting only competent, independent voters (like a curated panel or engineered chatbot ensemble), you've guaranteed the premises hold. But this doesn't prove democracy (open to all citizens) has epistemic value; it proves your curated group does. The theorem becomes a tautology for engineered groups, not a justification for real-world mass democracy. Its risky prediction for *actual democracies* fails when independence/competence fail.

  **Bottom Line for You:** Your strong epistemic view is highly vulnerable to real-world data showing correlated errors (ubiquitous in media/information environments) and evidence of low average competence on complex issues (common in policy). The chatbot example perfectly illustrates the independence trap. While CJT provides a valuable *ideal type* for why diverse, independent, competent groups can be smart, its strict assumptions are routinely violated in practice, often severely enough to negate or reverse the predicted epistemic gain. Defending democracy likely requires combining *weakened* epistemic hopes (it *can* sometimes aggregate dispersed knowledge) with stronger procedural/legitimacy arguments. Lab experiments on information cascades, heterogeneous competence groups, and strategic voting are the most direct empirical counters to your position.
