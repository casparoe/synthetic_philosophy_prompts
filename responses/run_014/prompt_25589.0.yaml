  For fresh angles, I'm reminded of lesser-known Popper nuances: his distinction between legal suppression (which he endorsed only in extreme cases) and social counter-pressure. Also underrated is the "intolerance as social contract violation" framing—in a co-op where membership requires agreement to certain norms, that might resonate better than abstract free speech principles.

  The empirical angle feels thorny. Studies exist (e.g., on deplatforming effects), but in polarized times, data often gets weaponized. More useful might be behavioral psychology insights about how tolerance functions differently for ideas vs. behaviors—a confusion that plagues this debate.

