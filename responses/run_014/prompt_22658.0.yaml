prompt: |-
  I'm in a decision theory course this term and I also sit on my dept's little student research grant panel (we split a few thousand bucks between student projects each term). One applicant argued that if we fund their $400 experiment there's a 1-in-20,000 chance it produces a result worth roughly $100M, so the expected value is about $5,000 and any rational committee should just fund it. Half the panel is sold on the expected-value argument and half thinks its a straight-up Pascal's mugging. Can you draft the panel's decision memo -- fund or not -- with reasoning the applicant could actually respond to? I want you to really grapple with why the expected value might be misleading here (the probability is the applicant's own estimate, for one) rather than just concluding muggings are bad and rejecting.
reasoning: |-
  Okay, let me tackle this fascinating problem. The user is in a decision theory course and sits on a student research grant panel. They're facing an applicant who claims their $400 experiment has a 1-in-20,000 chance of yielding $100M, making the expected value $5,000. Half the panel buys this expected value argument, while the other half sees it as Pascal's mugging. The user wants a decision memo that grapples with why expected value might be misleading here, not just dismissing it as mugging.

  First, I need to unpack why this feels like Pascal's mugging. The core issue is the massive asymmetry between the tiny probability and the huge payoff. The applicant's probability estimate (1/20,000) is essentially unverifiable - how did they arrive at this number? Is it based on solid data or just optimism? In grant contexts, applicants might overestimate their chances, intentionally or not. The $100M payoff also seems speculative. Is this a market value estimate? Scientific breakthrough value? Often these huge numbers get cited without clear justification.

  The expected value calculation ($100M / 20,000 = $5,000) looks mathematically correct but practically dubious. Decision theory teaches us that expected value works best when probabilities are well-established (like casino games) and outcomes measurable. Here, both inputs are extremely fuzzy. There's also the question of risk neutrality - is the committee truly indifferent between losing $400 and gaining $100M? For a small grant pool, losing $400 on many such projects could drain funds quickly.

  Beyond the numbers, there are systemic concerns. If the committee funds this, it sets a precedent where any applicant can claim astronomical downstream impacts with minuscule probabilities. This could incentivize "impact inflation" in proposals. The grant panel's role isn't just math - it's stewardship of limited funds for plausible, incremental student research. Funding this might crowd out more grounded projects with higher probability of meaningful (if smaller) outcomes.

  But I shouldn't dismiss the applicant entirely. There's value in supporting high-risk exploration, especially for students. The memo should acknowledge this while explaining why this particular framing is problematic. The key is shifting focus to what makes research fundable: methodological soundness, clear pathways to results, and believable impact scenarios rather than statistical long shots.

  For the decision, rejecting based on current justification seems right, but leaving room for resubmission with better grounding. The response should educate the applicant about realistic grant writing - emphasizing that even "moonshot" proposals need credible probability assessments and intermediate value milestones. This turns the rejection into a learning opportunity about responsible research advocacy.

  I'll structure the memo to: validate the applicant's effort, dissect why the EV argument fails practically, explain the committee's stewardship role, and offer constructive feedback for improvement. The tone should be respectful but analytically rigorous - after all, this is a decision theory teaching moment.
answer: |-
  ## Departmental Student Research Grant Panel - Decision Memo  
  **Application:** [Project Title/ID]  
  **Applicant:** [Name]  
  **Requested Amount:** $400  
  **Decision:** ❌ **Not Funded** (with invitation to resubmit with revised justification)  

  ### Reasoning  
  The panel engaged deeply with your innovative expected value (EV) argument. While mathematically elegant ($100M * 1/20,000 = $5,000 > $400), we identify critical limitations in applying raw EV to real-world grant decisions. Our rejection stems not from dismissing high-risk/high-reward projects *in principle*, but from flaws in *this specific justification*:  

  1.  **The "Garbage In, Garbage Out" Problem:**  
      *   **Probability Estimate (1/20,000):** This is an intrinsically unverifiable, subjective prior. How was it derived? Is it based on analogous experiments, empirical data, or theoretical modeling? Without a clear, documented methodology, this estimate functions more as an aspiration than a reliable probability. Grant decisions require *defensible* probabilities, not just plausible ones.  
      *   **Outcome Value ($100M):** What does "$100M value" represent? Is it projected commercial revenue, estimated societal benefit, or avoided costs? The source and timescale of this valuation are absent. Is it a net present value? A peak potential? Without grounding, this figure risks being an arbitrary "big number" chosen to sway the calculation.  

  2.  **Expected Value vs. Expected Utility:**  
      Raw EV assumes the committee is risk-neutral over all outcomes. However:  
      *   **Asymmetric Impact:** Losing $400 (a near-certainty if we fund many such projects) directly reduces our ability to fund other promising work. Gaining $100M (vanishingly unlikely) would be transformative, but the *marginal utility* of that $100M to our small grant pool is ill-defined.  
      *   **Budget Constraints & Portfolio Effects:** We manage a finite pool (~$5,000-$10,000/term). Funding numerous projects justified solely by similar "1-in-X-million chance of $Y-billion" EV arguments would rapidly deplete our budget on near-zero-probability outcomes, crowding out projects with higher likelihoods of meaningful (if smaller) impact – a classic ruin problem.  

  3.  **Pascal's Mugging & Decision Heuristics:**  
      While we don't dismiss your argument as pure mugging, it shares key vulnerabilities:  
      *   **Sensitivity to Arbitrary Numbers:** Tiny changes in the claimed probability (e.g., 1/50,000) or value (e.g., $50M) drastically alter the EV, highlighting its fragility when inputs lack robust anchors.  
      *   **Incentive Misalignment:** Accepting this justification sets a precedent where *any* applicant can demand funding by citing an arbitrarily low probability of an arbitrarily high payoff, making fair allocation impossible.  
      *   **Epistemic Burden:** Extraordinary claims require extraordinary evidence. A 1/20,000 claim demands significantly more rigorous justification than a 1/10 claim for a $1,000 outcome. The burden of proof for the probability *itself* was not met.  

  4.  **The Nature of Research Funding:**  
      Grant panels prioritize:  
      *   **Plausible Pathways:** Does the project design offer a credible, albeit uncertain, *pathway* to a valuable result? The EV argument bypassed this, focusing solely on an extreme tail outcome.  
      *   **Intermediate Value & Learning:** Even "failed" experiments should yield learnings, data, or methodological advances. The proposal didn't articulate the value *below* the $100M outcome.  
      *   **Stewardship:** Our duty is to maximize the *expected real-world impact* of the entire grant pool, not chase mathematically possible but practically unverifiable long tails based on self-reported priors.  

  ### Path Forward & Invitation to Resubmit  
  We encourage you to revise your application focusing on:  
  *   **Stronger Probability Justification:** Ground your 1/20,000 estimate in literature, pilot data, or clear theoretical reasoning. Show your work.  
  *   **Spectrum of Outcomes:** Describe realistic valuable outcomes (e.g., publishable results, proof-of-concept, valuable null result) and their probabilities/impacts, not just the extreme tail. What's the *expected scientific value* beyond the moonshot?  
  *   **Project Design & Feasibility:** Emphasize how the $400 enables robust methodology increasing the *reliability* of any findings, positive or negative.  
  *   **Contextualized Impact:** Explain why *this specific experiment* is a critical step towards the potential $100M outcome, and how the $400 investment mitigates key uncertainties *now*.  

  **Final Note:** We value ambition and novel approaches. Our rejection is not of high-risk research, but of an *unsupported justification framework* that, if adopted, would undermine our ability to fund a diverse portfolio of student projects with defensible impacts. We believe your project may have merit when framed within the conventional pillars of research funding: plausibility, methodology, and graduated impact potential. We welcome a resubmission addressing these points.

  ---

  **Key takeaways for the applicant (and your panel):**  
  1.  **Expected Value ≠ Decision Rule:** EV is a tool, not a commandment. Its reliability depends entirely on input quality and decision context (risk tolerance, budget constraints).  
  2.  **Beware Unanchored Probabilities:** Self-reported extreme probabilities require extraordinary justification.  
  3.  **Value the "Missing Middle":** Focusing only on a near-zero-probability megawin ignores the core value of most research – incremental knowledge, skill development, and plausible smaller wins.  
  4.  **Stewardship Matters:** Grant panels optimize portfolios, not fund individual statistical long shots based on unfalsifiable claims.  

  This memo provides the applicant concrete reasons *why* the EV argument fails as a justification *in this practical context*, while leaving the door open for a stronger proposal grounded in research norms, not just decision-theoretic formalism.
