prompt: |-
  A colleague of mine has been quite clear about what counts as supererogatory. Her verdicts so far: paying your income taxes is obligatory, not supererogatory; keeping a promise you made to a friend is obligatory, not supererogatory; donating one of your kidneys to a stranger is supererogatory; giving a substantial share of your income to charity is supererogatory; dropping twenty dollars in a charity box is not supererogatory, just a small unremarkable nicety; and refusing to donate a kidney is not blameworthy. The new case is this: you're walking past a shallow, clear pond and see a toddler drowning in it; you could save the toddler by stepping in, but you'd have to take off your shoes and you'd get your trousers soaked, and there's no real danger to you. Do you think she'll call the rescue supererogatory? I'm less interested in a bare answer than in the work behind it: the rule she seems to be running, the other rules that fit her verdicts just as well, what each of those rules predicts for the pond case, your best guess and the reasons for it, and the further case that would best tell the rules apart.
reasoning: |-
  Okay, let me try to figure out how the user's colleague would classify the pond scenario based on her previous judgments. 

  First, I need to recall her existing verdicts. Paying taxes and keeping promises are obligatory. Donating a kidney or giving substantial income to charity is supererogatory. Small donations like $20 aren't supererogatory, just minor nice acts. Refusing to donate a kidney isn't blameworthy. 

  Hmm, the key seems to be how she draws the line between duty and going beyond duty. The pond case involves minimal effort/risk but prevents severe harm. Her kidney example had high personal cost but no blame for refusal, so cost matters. But here the cost is trivial—wet shoes and pants. 

  Wait, she might see this as obligatory because the cost-benefit ratio is extreme. Saving a life with almost no sacrifice feels mandatory, unlike organ donation. The $20 charity example shows small good deeds aren't supererogatory, but saving a life is huge. 

  Could there be a rule based on expected societal norms? Most people would save the toddler, making it obligatory. But she didn't mention social expectations before. Alternatively, maybe a threshold of sacrifice vs. benefit. Here, sacrifice is near zero, benefit is maximal. 

  I should consider if there's tension between the kidney case (high cost, supererogatory) and this (low cost, possibly obligatory). The difference likely hinges on the cost factor. Also, her "not blameworthy" for kidney refusal implies that supererogatory acts are those where refusal is acceptable. In the pond, refusing might be blameworthy. 

  A test case would be something with moderate cost and significant benefit, like saving someone from a burning building with some injury risk. If she calls that supererogatory, it confirms cost is central. If obligatory, then benefit size might dominate. 

  My guess? She'll say obligatory. The trivial effort for a life saved aligns more with duty than going beyond. But I'm curious if the user wants to explore alternative frameworks or just predict the colleague's view.
answer: |-
  Based on your colleague's established verdicts, here's a breakdown of the reasoning, potential rules, predictions for the pond case, a best guess, and a differentiating case:

  **Analyzing Her Verdicts:**
  1.  **Taxes & Promises (Obligatory):** These are baseline social/contractual duties. Failure is blameworthy.
  2.  **Kidney Donation (Supererogatory):** Involves extreme personal cost/sacrifice (surgery, long-term health impact) to benefit a stranger. Refusal is explicitly *not blameworthy*.
  3.  **Substantial Charity (Supererogatory):** Involves significant personal cost (loss of substantial income/resources) to benefit others (strangers). Implicitly, refusal isn't blameworthy (though less explicit than kidney case).
  4.  **$20 Charity (Not Supererogatory):** Involves negligible cost/effort and provides a small benefit. Classified as a minor nicety, not rising to the level of a moral duty nor exceeding one.
  5.  **Refusing Kidney Donation (Not Blameworthy):** Crucially confirms that supererogatory acts are those where *failure to perform them is morally permissible*, even if the act itself is good. Blame only attaches to failing duties.

  **The Rule She Seems to Be Running:**
  Your colleague appears to prioritize **Personal Cost/Sacrifice** as the key factor distinguishing supererogation from obligation.
  *   **Obligation (Duty):** Actions with low-to-moderate cost required to prevent significant harm or fulfill core commitments (taxes, promises). Failure is blameworthy.
  *   **Supererogation:** Actions involving *significant or severe personal cost/sacrifice* that confer a substantial benefit on others, *especially strangers*. Failure is *not blameworthy*.
  *   **Below Threshold:** Actions with negligible cost/effort and/or minor benefit are simply nice but not morally significant categories like duty or supererogation ($20 charity).

  **Alternative Rules Fitting the Verdicts:**
  1.  **"Significant Burden" Rule:** Similar to the cost rule, but defines "burden" more broadly (could include effort, time, risk, resources, not just physical sacrifice). Predicts similarly for the pond case.
  2.  **"Beyond Social Expectation" Rule:** Obligation = what society demands/expects. Supererogation = far exceeding common expectations. Fits taxes/promises (expected), kidney/substantial charity (exceeding), $20 charity (common nicety). Predicts pond rescue as *obligatory* (society strongly expects minimal effort to save a life).
  3.  **"Benefit-Cost Ratio Threshold" Rule:** Obligation exists when the benefit (to others/society) vastly outweighs the cost (to the agent). Supererogation exists when the benefit is significant, but the cost is high enough that the ratio doesn't *mandate* the action. Fits taxes (high societal benefit/low individual cost = duty), kidney (high benefit/very high cost = supererogatory), $20 (low benefit/low cost = not significant), pond (immense benefit/trivial cost = duty). *Fits all verdicts equally well as the Cost Rule*.
  4.  **"No Special Relationship" + Cost Rule:** Combines two factors. Obligation exists with special relationships (promise = created relationship) or low-cost/high-benefit for strangers (taxes arguably societal relationship? Pond?). Supererogation is high-cost for strangers (kidney, charity). Fits, but taxes are an outlier without "society" as a relationship.

  **Predictions for the Pond Case:**
  *   **Cost/Sacrifice Rule:** Prediction = **Obligatory**. The cost (wet shoes/trousers, minor inconvenience) is trivial, especially compared to the benefit (saving a life). It falls into the low-cost/high-benefit category like taxes, not the high-sacrifice category like kidney donation.
  *   **Significant Burden Rule:** Prediction = **Obligatory**. Wet trousers are not a significant burden.
  *   **Beyond Social Expectation Rule:** Prediction = **Obligatory**. Society strongly expects one to save a child drowning in a shallow pond at minimal risk/cost to oneself. Not doing so would likely be seen as monstrous.
  *   **Benefit-Cost Ratio Threshold Rule:** Prediction = **Obligatory**. Benefit (life saved) is immense. Cost (minor inconvenience) is trivial. The ratio overwhelmingly favors obligation.
  *   **No Special Relationship + Cost Rule:** Prediction = **Obligatory**. While no prior relationship, the cost is so low and benefit so high that it creates an obligation akin to taxes (a societal duty).

  **Best Guess & Reasons:**
  *   **Best Guess:** She will call the rescue **Obligatory (Not Supererogatory).**
  *   **Reasons:**
      1.  **Trivial Cost is Key:** The wet shoes/trousers cost is negligible, analogous to the minor effort of paying taxes online or the minor cost of the $20 donation. It doesn't meet her threshold of *significant sacrifice* required for supererogation (kidney, substantial income).
      2.  **Benefit is Extreme:** Saving a life is the highest possible benefit, vastly outweighing the trivial cost. Her duty verdicts involve preventing significant harm (societal harm from tax evasion, relational harm from broken promise).
      3.  **Refusal Likely Blameworthy:** Crucially, while refusing to donate a kidney is *not blameworthy*, refusing to perform this minimal-effort rescue would almost certainly be seen as *blameworthy* by her (and most people). This aligns with her duty verdicts where failure *is* blameworthy. The "$20 nicety" refusal probably isn't blameworthy either, but the stakes here are life and death.
      4.  **Fits Dominant Cost Pattern:** The Cost/Sacrifice rule is the most straightforward interpretation of her existing pattern. The pond case has none of the significant sacrifice present in her supererogatory examples.

  **Further Case to Tell the Rules Apart:**
  *   **The Case:** Rescuing someone from a burning building. There's a *moderate* risk of minor burns or smoke inhalation (say, 10% chance of injury requiring a week of recovery, 90% chance of just getting dirty/smelly/scared), but a high likelihood of saving a life. The agent is an ordinary passerby with no special training or duty (e.g., not a firefighter).
  *   **How it Differentiates:**
      *   **Cost/Sacrifice Rule:** Moderate risk of injury (more than wet trousers, less than kidney surgery) might push this towards **Supererogatory**, analogous to substantial charity donation (significant cost, but less than a kidney). If she says obligatory, it challenges pure cost focus.
      *   **Benefit-Cost Ratio Rule:** High benefit vs. moderate (probabilistic) cost. Could go either way (**Obligatory** or **Supererogatory**) depending on how she weighs the risk. Clarifies her threshold.
      *   **Beyond Social Expectation Rule:** Society *hopes* people would do this but doesn't *demand* it of ordinary citizens to the same extent as wading into a shallow pond. Likely predicts **Supererogatory**.
      *   **"No Special Relationship" + Cost Rule:** No relationship + moderate cost = likely **Supererogatory**. If she says obligatory, it strengthens the cost-benefit aspect over relationship.

  This case introduces a significant but non-extreme cost (risk of injury) for a high benefit to a stranger, probing the boundary between duty and supererogation where the pond case (low cost) and kidney case (very high cost) are clearer based on her past judgments. Her verdict here would strongly indicate which factor (cost level, cost-benefit ratio, social expectation) is most determinative for her.
