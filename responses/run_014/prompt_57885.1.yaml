answer: |-
  Based on your roommate's verdicts, here's an analysis of the potential rules she's using, predictions for the Discord case, and a splitter case:

  **Candidate Rules**

  1.  **Contextual Reliability Indicators:** This rule focuses on readily observable cues in the *immediate context* that signal reliability or unreliability, without necessarily requiring a deep background check or personal history. It emphasizes the speaker's apparent role, incentives, and the situation's normalcy.
      *   **Fit with Verdicts:**
          *   **Passerby:** Normal situation, speaker is disinterested (no apparent gain/loss), "seems normal" = positive indicator. Fine.
          *   **Viral Thread:** Anonymous speaker (no identity/reputation cues), potential for sensationalism/clicks (incentive to lie/mistake), lack of source = negative indicators. Not fine.
          *   **Kid/Parents:** Parents in trusted caregiver role (strong contextual role), history of everyday reliability *demonstrates* the trustworthiness of that role in this context. Fine.
          *   **Jailhouse Informant:** Clear, massive incentive to lie (reduced sentence), known unreliable type of source = strong negative indicators. Not fine.
          *   **AC Repair:** Professional role/context (uniform, on-site), apparent competence through action ("doing his job"), no observed anomalies = positive indicators. Fine.
      *   **Core:** Look for *visible* signs of trustworthiness (role, lack of conflicting incentives, coherence, competence cues) or untrustworthiness (anonymity, strong incentives, suspicious context).

  2.  **Pragmatic Risk Assessment:** This rule weighs the *stakes* of being wrong against the *practical cost/benefit* of accepting the testimony vs. seeking verification. It's less about inherent reliability and more about the consequences and effort required.
      *   **Fit with Verdicts:**
          *   **Passerby:** Low stakes (mild inconvenience if wrong), high cost of verification (checking ID absurd). Fine to accept.
          *   **Viral Thread:** High stakes (spreading misinformation, emotional impact), low cost/effort of waiting for reliable confirmation. Not fine to accept immediately.
          *   **Kid/Parents:** High benefit for child's learning/trust, low stakes if wrong about dinosaurs *at that moment*, extremely high cost for the child to verify. Fine to accept.
          *   **Jailhouse Informant:** Extremely high stakes (wrongful conviction), known high risk of unreliability (incentive), cost of seeking backup (further investigation) is justified. Not fine to accept uncritically.
          *   **AC Repair:** Moderate stakes (costly repair if wrong, but fix needed), high cost for homeowner to verify personally, expert is the practical solution. Fine to accept.
      *   **Core:** Is the risk of being wrong too high given the consequences? Is the effort/cost of verification disproportionate to the risk?

  **What Each Predicts for the Discord Case**

  1.  **Contextual Reliability Indicators:** Likely **JUSTIFIED**. Key indicators: "Unit4b" has a specific identifier tied to the community (like a uniform/role), the information is detailed/plausible and serves the community purpose of the Discord, there's no *observable* incentive to lie (helping during a crisis), and there is weak positive social validation (emoji reacts, no dissent). The lack of personal history is less critical than the *current contextual cues* aligning with a reliable source.
  2.  **Pragmatic Risk Assessment:** Likely **JUSTIFIED**. High stakes (potential safety risk during a chemical scare), high cost/danger of *not* acting on potentially crucial information (waiting for official confirmation might be risky). The cost of verifying the specific user is high and impractical in an emergency. Acting on a plausible source within the relevant community (the apartment Discord) is a reasonable risk-benefit calculation. The minor risk of being misled is outweighed by the potential danger of inaction.

  **Best Bet**

  Based on her verdicts, especially the strong rejection of the jailhouse informant (high stakes + clear incentive) contrasting with the acceptance of the passerby (low stakes + no incentive) and the AC repair (moderate stakes mitigated by role), **Pragmatic Risk Assessment is the most likely rule she's implicitly using.** It most cleanly explains the variance across *all* cases:

  *   It directly accounts for why the high-stakes jailhouse informant requires backup while the low-stakes passerby does not.
  *   It explains accepting the AC repair (moderate stakes, verification too costly) vs. rejecting the viral thread (high stakes, verification easy/necessary).
  *   It captures why the kid can believe parents (high cost of verification, low immediate risk of error) within its framework.
  *   It naturally handles the Discord emergency: high potential stakes demand action even with imperfect sources if verification is impractical.

  While Contextual Reliability also fits, Pragmatic Risk better explains the stark difference between the passerby and the jailhouse informant based on stakes, which seems central to her judgments.

  **Splitter Case**

  To differentiate between **Pragmatic Risk Assessment** and **Contextual Reliability Indicators**, pose this:

  > *"A stranger approaches you on the street offering a free sample of a new brand of chewing gum. They seem normal and friendly, explain it's a promotional campaign, and hand you a packet. They have no obvious incentive to lie. Is it justified to believe the gum is safe and just chew it?"*

  *   **Pragmatic Risk Prediction:** Likely **JUSTIFIED**. Stakes are extremely low (minor stomach upset worst case?), cost of verification (lab testing?) is absurdly disproportionate. Easy acceptance.
  *   **Contextual Reliability Prediction:** Likely **NOT JUSTIFIED** (or requires hesitation). Key negative indicator: **Lack of a defined, trustworthy role.** A random stranger isn't a recognized authority or service provider (like the AC guy or passerby giving neutral info). While no *obvious* incentive exists, the context lacks the anchoring reliability cues of a role or established setting. Doubt is reasonable.
