prompt: |-
  ok so my roomate is doing a PhD on testimony and she keeps testing her takes on me and i cant quite tell what rule shes using. she says shes into the whole reductionism vs anti-reductionism debate but wont tell me where she lands.

  here are her verdicts so far, all pretty confident:

  she says its totally fine to just beleive a random passerby who tells you the library is two blocks left, no need to check ID or anything, as long as they seem normal and theres no reason to doubt them.

  she says its NOT fine to just believe some anonymous viral thread claiming a famous actor died in a car crash, you gotta wait for better confirmation.

  she says its fine for a little kid like 5 to believe her parents when they tell her dinosaurs lived ages ago, especially since the kid has seen her parents get everyday stuff right a million times like whats for dinner and how to get to school.

  she says its NOT fine for a juror to just believe a jailhouse informant who says the defendant confessed, when the informant is clearly getting a shorter sentence for saying it, without any backup.

  she says its fine to believe the AC repair guy when he tells you the compressor is fried, even if you personally know zero about ACs, because hes there in uniform doing his job and nothing seems off.

  now the new case i want to predict: my cousin lives in a big apartment complex with a Discord for residents, like 300 people. last week during that weird chemical smell scare, some user called unit4b who shes never talked to before posted really detailed updates about which streets were closed and that the elementary school gym was the shelter, sounded plausible, got like two emoji reacts and nobody argued. she has no info about whether unit4b has been right before or knows anything, but also no reason to think hes lying. she just believed him outright and drove to the gym. would my roomate say that belief was justified or not?

  can you walk me through it? please answer in this order with these sections:

  Candidate Rules - about 150-200 words per rule, lay out 2 or 3 different rules that all fit her five old verdicts
  What Each Predicts - about 150 words total, say what each rule says about the Discord case
  Best Bet - about 150 words, pick which rule shes most likely running and why
  Splitter Case - about 100 words, describe one more made-up case that would separate the top two rules if i asked her about it
