prompt: |-
  I've been following a reading group on moral uncertainty, and two members got into a long, good-faith argument about whether you can actually run expected-value calculations over competing moral theories. I sat on the fence, so I'd like you to referee.

  M started from the view that moral uncertainty is handled the same way as ordinary uncertainty: assign each candidate theory a credence and pick the action that maximizes expected value across the theories you might be right about — expected utility applied one level up, from uncertainty about outcomes to uncertainty about the right value function.

  R objected that this only works when the theories are commensurable. On most routine actions they agree, so no problem. But on the cases where they diverge, a rights-based theory may hold that an action is simply forbidden, attaching no numerical value to it, while a utilitarian assigns a number. You can't take a probability-weighted average of a number and a bare prohibition, so the expected value isn't hard to compute there — it's undefined.

  M answered that the incommensurability is a defect in the theories, not in the meta-level procedure. At the meta-level, he said, you're not averaging the theories' values; you're comparing your own credence-weighted options, and that comparison is always well-defined.

  R pushed back on the definition itself: the expected value of an action is a sum of value times probability over outcomes, and value has to live on a single numerical scale. If one of the theories in your probability distribution doesn't supply numbers, the sum doesn't exist. So the calculation is undefined in exactly the cases where you'd need it.

  M then conceded the edge cases are hard, but argued that's a reason to apply the method carefully, not to abandon it: on the large majority of decisions the theories agree, the expected-value calculation works cleanly, and that's where most of your actual choices fall.

  R closed by saying that conceding the hard cases doesn't rescue the method, because the entire point of the exercise is to guide you on the hard cases, and a tool that is undefined precisely where it's needed is, for its intended purpose, broken.

  Can you go through their exchange and say who's right at each step — not just who wins overall? And tell me what, if anything, both of them are missing.
reasoning: |-
  Okay, let me start by unraveling this moral uncertainty debate between M and R. The user wants a detailed breakdown of each step in their argument, who had the stronger point at each stage, and what both might be missing overall. 

  First, I need to map out the core disagreement clearly. M is pushing for applying expected value calculations to moral theories like we do with empirical uncertainty—just assign credences and maximize expected moral value. R's main counter is about commensurability: when theories use different "currencies" (numbers vs. categorical rules), averaging becomes impossible.

  Hmm, M's initial move seems intuitive—it's a straightforward extension of decision theory. But R's first objection feels technically solid. If a deontological theory says "lying is forbidden (full stop)" while utilitarianism says "lying has disutility -5," how do you average a prohibition and a number? M's response that this is the theories' fault rather than the method's... that's interesting but maybe shifts the goalposts? The meta-framework still needs inputs it can work with.

  When R doubles down on the definition of expected value requiring a common scale, that seems mathematically unassailable. M's retreat to "it works fine for easy cases" is pragmatic but concedes R's core point—the method fails where it's most needed. R's closing shot about broken tools for hard cases lands well conceptually, though I wonder if it's too dismissive of practical utility.

  What both might be missing... ah, three things come to mind. First, the distinction between intra-theoretic comparisons (within a theory) versus inter-theoretic (across theories)—R's right that the latter isn't automatic. Second, M's approach assumes we can compare moral value magnitudes across theories, which is philosophically loaded. Third, they're both overlooking hybrid solutions like variance voting or lexical priority that could handle edge cases without abandoning the framework entirely.

  The user sitting on the fence suggests they want nuance, not just a verdict. I should emphasize where each arguer is strong (R on technical rigor, M on practicality) while noting the deeper philosophical tensions beneath the surface—like whether morality even permits the kind of aggregation M proposes. Maybe flagging Will MacAskill's "My Favorite Theorem" approach as a potential middle ground too.
answer: |-
  Here's a breakdown of M and R's argument, judging the strengths at each step and identifying what both might be missing:

  **The Exchange & Verdicts:**

  1.  **M's Opening Proposal:** Apply Expected Value (EV) to moral uncertainty.
      *   **M's Core Argument:** Treat moral theories like empirical hypotheses. Assign credences (probabilities) to each being correct. For each action, calculate its expected moral value by taking a probability-weighted average of the value assigned to it by each theory. Choose the action with the highest expected moral value.
      *   **Verdict:** **Conceptually Appealing but Problematic.** M correctly identifies the *intuition* behind handling uncertainty: use probability to weight possibilities. This is the dominant approach in formal work on moral uncertainty (e.g., MacAskill, Bykvist, Ord). However, R immediately identifies its Achilles' heel.

  2.  **R's First Objection: Incommensurability.**
      *   **R's Core Argument:** Theories are often *incommensurable*. They don't assign values on a shared numerical scale. A utilitarian assigns numerical utility. A deontologist assigns categorical permissions/prohibitions (e.g., "Forbidden" or "Permitted"). You cannot mathematically average a number (e.g., +10 utils) and a prohibition ("∞ disvalue" or "undefined value"). The EV calculation is undefined where theories fundamentally disagree.
      *   **Verdict:** **Strong Point.** R identifies a fundamental technical and philosophical problem. Averaging fundamentally different *kinds* of evaluations (cardinal numbers vs. ordinal rankings vs. categorical rules) is mathematically incoherent without a common scale. This is the central challenge for EV approaches.

  3.  **M's Response: Blame the Theories, Not the Method.**
      *   **M's Core Argument:** The incommensurability is a flaw in the *first-order theories*, not in the meta-framework. At the meta-level, *you* are comparing actions based on *your* credences, not averaging their values. This comparison *is* defined for *you* even if the theories themselves don't provide a shared scale.
      *   **Verdict:** **Weak Rebuttal.** M shifts the burden but doesn't solve the problem. *How* does the meta-agent perform this comparison without a common scale? Saying "it's defined for you" handwaves the core difficulty R raised: *What numerical value does the meta-agent assign to "Forbidden" according to Theory A to plug into the EV sum alongside the number from Theory B?* M offers no mechanism.

  4.  **R's Pushback: Definitional Undefinedness.**
      *   **R's Core Argument:** The EV formula *requires* numerical values. If any theory in your probability distribution fails to supply a numerical value for an action (or supplies something incompatible like a categorical prohibition), the necessary sum (`Σ [P(Theory_i) * Value_i(Action)]`) literally does not exist for that action. It's undefined mathematically, not just difficult. This happens precisely in the morally uncertain dilemmas where guidance is needed.
      *   **Verdict:** **Very Strong Point.** R correctly emphasizes the *mathematical* requirement of the EV formula. If one term `P(Theory_i) * Value_i(Action)` is undefined (because `Value_i(Action)` isn't a number), the entire sum is undefined. This isn't a practical limitation; it's a fundamental breakdown of the calculation in the critical cases.

  5.  **M's Concession & Retreat to Easy Cases.**
      *   **M's Core Argument:** While hard cases exist, most decisions involve areas where competing theories *do* agree or can be rendered commensurable (e.g., both accept avoiding suffering is good, even if they weight it differently). The EV method works cleanly for the vast majority of real-world choices.
      *   **Verdict:** **Pragmatic but Concedes R's Core Point.** M effectively admits that the pure EV approach *fails* in the theoretically interesting and practically crucial "hard cases" where theories conflict fundamentally. Defending its usefulness for "easy cases" doesn't address R's criticism that it's broken for its *primary intended purpose* – resolving moral dilemmas under uncertainty.

  6.  **R's Closing: Broken for Purpose.**
      *   **R's Core Argument:** A tool designed to handle moral uncertainty that becomes undefined precisely when confronted with genuine moral uncertainty (i.e., when theories disagree fundamentally) is useless for its core function. Solving the easy cases doesn't rescue it; it highlights its failure where it matters.
      *   **Verdict:** **Strong Conclusion.** R accurately diagnoses the problem: an approach to moral uncertainty that cannot function under conditions of deep moral disagreement is inadequate. The "easy cases" could often be handled without complex meta-calculations.

  **Overall Winner:** **R has the stronger overall argument.** R successfully demonstrated a fundamental mathematical and conceptual flaw in applying standard EV calculations directly to potentially incommensurable moral theories, especially highlighting the breakdown precisely where the method is most needed. M conceded the core difficulty without providing a robust solution.

  **What Both Might Be Missing:**

  1.  **Distinguishing Incomparability from Incommensurability:** Both conflate these slightly. *Incommensurability* means no common *measure* (e.g., no shared unit like "utils"). *Incomparability* means actions cannot even be ranked as better, worse, or equal. R focuses on incommensurability breaking the math, but the deeper worry is potential incomparability at the meta-level.
  2.  **Intra-Theoretic vs. Inter-Theoretic Comparisons:** M assumes that if theories provide cardinal scales *within* themselves, these scales can be meaningfully compared *across* theories (e.g., is 1 util equal in moral importance to 1 unit of Kantian respect?). This is a huge, often unstated, assumption. R's objection hints at this but doesn't fully articulate it. Even if you get numbers, are they ratios? Can they be normalized? (See "variance voting" or "MEC-relevance" as attempts to address this).
  3.  **Alternatives to Pure EV:** Both frame it as "EV or bust." There are other approaches to moral uncertainty they don't discuss:
      *   **My Favorite Theory:** Simply act according to the theory you assign the highest credence to.
      *   **Maximin:** Choose the action whose worst-case outcome (according to any theory you give credence) is least bad.
      *   **Leopoldic/Contextual Approaches:** Apply different methods depending on the *type* of disagreement or the context.
      *   **Rule Consequentialism over Theories:** Choose rules that would be best if followed by agents with your credences.
      *   **Structured Approaches (e.g., "My Favorite Option"):** William MacAskill's suggestion: For each action, ask "What probability must the true theory assign to this action being permissible for me to be willing to choose it?" Then choose the action requiring the lowest threshold probability. This avoids direct inter-theoretic value comparisons.
  4.  **The Nature of Moral Value:** M's approach implicitly assumes moral value is something that *can* be aggregated probabilistically like empirical facts. R's objection hints that moral properties (like deontic status - forbidden/permitted) might be fundamentally different kinds of entities than quantities amenable to averaging. This taps into deep meta-ethical questions.
  5.  **The Purpose of the Meta-Framework:** Is it to *discover* the truly right action, or to make the *most responsible choice* given one's epistemic limitations? M leans towards the former, R's critique highlights the limitations for that goal, but alternatives might focus more on the latter.

  **Conclusion:** R successfully exposed a critical flaw in naively applying EV across incommensurable moral theories: the calculation becomes mathematically undefined precisely in the hard cases it's meant to solve. M's defense relied on practical applicability in easier scenarios but conceded the core difficulty. Both might benefit from considering the deeper challenge of inter-theoretic value comparisons and exploring alternative frameworks for navigating moral uncertainty when theories clash fundamentally. The debate highlights that moral uncertainty isn't just empirical uncertainty "one level up"; the nature of the objects being uncertain *about* (moral values/rules) poses unique and potentially insurmountable challenges for simple aggregation.
