answer: |-
  To address your query, I present a concrete decision problem where an agent rationally refuses free information, despite Good's theorem suggesting that the expected value of information is non-negative. The key lies in violating an implicit assumption of the theorem: that utility depends solely on the state of the world and the action taken, and not on the agent's **beliefs or knowledge state**. In this example, utility is belief-dependent, meaning the agent derives value from ignorance itself.

  ### Decision Problem: The "Burden of Knowledge" Scenario
  **Setup:**
  - **States of the world:**  
    - \(S_1\): The agent has a terminal illness (probability \(p = 0.05\)).  
    - \(S_2\): The agent is healthy (probability \(1 - p = 0.95\)).  
  - **Actions:**  
    - \(A_1\): Continue life as usual.  
    - \(A_2\): Undergo painful, costly treatment (only effective if ill; success probability 100%, but quality of life is halved).  
  - **Information source:**  
    - A free, perfect diagnostic test revealing the true state.  
  - **Utility function (dependence on state, action, and beliefs):**  
    | State       | Action      | Utility if **ignorant** | Utility if **informed** |  
    |-------------|-------------|-------------------------|-------------------------|  
    | Ill (\(S_1\)) | \(A_1\)     | 80 (blissful ignorance) | 0 (awareness + no treatment) |  
    | Ill (\(S_1\)) | \(A_2\)     | N/A (not chosen ignorant) | 50 (treatment side effects) |  
    | Healthy (\(S_2\)) | \(A_1\)     | 100 (baseline happiness) | 100 (baseline happiness) |  
    | Healthy (\(S_2\)) | \(A_2\)     | N/A (not chosen ignorant) | 50 (unnecessary treatment) |  

    **Critical nuance:**  
    - If the agent **remains ignorant**, utility for \(A_1\) is high (80) in \(S_1\) due to psychological comfort from uncertainty.  
    - If the agent **becomes informed**, utility for \(A_1\) in \(S_1\) drops to 0 due to distress from knowing the illness.  

  **Decision without information (status quo):**  
  - The agent chooses \(A_1\) (continue life) to avoid the treatment's downsides.  
  - Expected utility:  
    \[
    EU_{\text{no-info}} = P(S_1) \cdot 80 + P(S_2) \cdot 100 = (0.05 \times 80) + (0.95 \times 100) = 4 + 95 = 99.
    \]

  **Decision with information:**  
  - If the test reveals \(S_1\) (ill), the agent chooses \(A_2\) (treatment) for utility 50 (better than \(A_1\)'s 0).  
  - If the test reveals \(S_2\) (healthy), the agent chooses \(A_1\) for utility 100.  
  - Expected utility with information:  
    \[
    EU_{\text{info}} = P(S_1) \cdot 50 + P(S_2) \cdot 100 = (0.05 \times 50) + (0.95 \times 100) = 2.5 + 95 = 97.5.
    \]

  **Rational refusal of information:**  
  - \(EU_{\text{no-info}} = 99 > EU_{\text{info}} = 97.5\).  
  - The agent **declines the test** because ignorance preserves higher expected utility (99 vs. 97.5).  

  ### Why Good's Theorem "Fails" Here
  Good's theorem states that the expected value of information (EVI) is non-negative:  
  \[
  \text{EVI} = \max_{\text{actions}} EU(\text{action} \mid \text{info}) - \max_{\text{actions}} EU(\text{action} \mid \text{no info}) \geq 0.
  \]
  In this case, \(\text{EVI} = 97.5 - 99 = -1.5\), violating non-negativity. The reason is a **violated assumption**:  
  - **Assumption strained:** Good's theorem assumes utility is a function **only of the state and action**, not the agent's knowledge or beliefs. Here, utility is belief-dependent:  
    - In state \(S_1\), utility for \(A_1\) is 80 under ignorance but 0 under awareness.  
  - **Mechanism at play:**  
    - Ignorance provides "blissful uncertainty," increasing utility in \(S_1\).  
    - Information destroys this psychological benefit, making the agent worse off even when she acts optimally post-information.  

  ### Conclusion
  Your friend incorrectly assumes Good's theorem universally applies. In reality, it relies on the **state-action utility independence of beliefs**. When utility depends on the agent's knowledge (e.g., through anxiety, hope, or regret), information can have negative value. In this example, the agent rationally refuses the test because ignorance itself is a source of utility. This highlights how human psychology can create rational incentives for strategic ignorance, even when information is free.
