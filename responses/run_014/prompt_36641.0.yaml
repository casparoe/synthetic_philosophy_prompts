prompt: |-
  Something about how frontier model evaluations are done has been bugging me philosophically and I want someone to untangle what the practice actually presupposes. The setup, roughly: when a big AI model gets evaluated before release, the numbers that get reported are bascially average-case. The model gets run through a fixed suite of tasks plus some red-teaming, and what comes out is stuff like "resisted 98% of jailbreak attempts" or "performed at such-and-such level on the biosecurity uplift eval". Percentages, pass rates, means over a sampled distribution of propmts and attacks. But the decisions made on the basis of these evals are worst-case in flavour: if a single run crosses a dangerous-capability threshold, or if one jailbreak reproduces reliably, that can be treated as disqualifying no matter how rare it is under normal use, and the whole threat modelling exercise is built around imagining a determined adversary who keeps sampling and adapting until they get lucky. So the same institution measures one way and decides the other way, and I genuinely can't tell whether that's a principled combination or just two teams with two different vibes. What view of risk, or of evidence, does this practice presuppose? Is it something like a maximin stance where you act on the worst case, and if so how do the average numbers earn their keep at all — as a proxy for how bad the worst case is, as a bound on it, or as window dressing? Is the underlying picture closer to civil engineering, where you compute average loads and then slap on safety factors, or to cryptography, where a single workable attack kills the scheme outright? Those seem like pretty different epistemologies to be smuggling into one process. There's also the flip side, which some people in the field raise: if you take the worst case seriously enough, you can always find some adversarial prompt that degrades the model if you try hard enough, so the worst case is essentially always "the model fails" and the decision procedure collapses into refusing to deploy anything. If that's right, does the practice secretly rely on an informal notion of a plausible, bounded adversary — a threat model that never gets explicitly stated? Please reconstruct the implicit theory here, tell me which rival views of risk it quietly rules out (for instance a pure expected-value view, on which a rare capability that only shows up 0.1% of the time could just be priced into a risk budget rather than treated as disqualifying), and say where the practice is philosophically underdetermined, so that several different theories would license the exact same behaviour. And tell me what would actually have to change procedurally if the expected-value view were adopted instead — would the pass/fail capability thresholds go entirely, and what would replace them? Please write in British English, and no formatting at all: no headings, no bullet points, no bold, no tables — just continuous prose like a long email. As you go, flag how confident you are in the big claims, and at the end single out the one point you're least sure about.
reasoning: |-
  Hmm, this user is grappling with a fascinating philosophical tension in AI safety evaluation practices. They've noticed a disconnect between how frontier AI models are evaluated (using average-case metrics) versus how deployment decisions are made (based on worst-case scenarios). The core question seems to be: what risk philosophy underpins this apparent contradiction?

  The user presents several sharp observations. First, they note that evaluations produce statistical aggregates ("98% jailbreak resistance"), while decisions respond to single-instance failures. Second, they identify the implicit threat model of a "determined adversary" that transforms rare failures into certainties through repeated sampling. Third, they astutely compare this to safety engineering (which uses safety factors) versus cryptography (where any break is fatal). Finally, they raise the crucial point about collapse: if we take worst-case seriously, all models fail eventually.

  This is clearly someone deeply familiar with AI safety discourse. Their phrasing ("philosophically bugging me", "vibes", "smuggling epistemologies") suggests they want rigorous conceptual untangling rather than technical solutions. The British English request and no-formatting constraint imply they prefer natural, nuanced discussion.

  The philosophical tension resolves when we consider two distinct purposes: average-case metrics establish baseline safety for ordinary use (like civil engineering load calculations), while worst-case triggers address adversarial contexts (like crypto breaks). The unstated premise is that adversarial access transforms low-probability events into high-probability threats through iterative probing - what we might call the "sampling multiplier" effect.

  Where I'm least confident is whether the field has truly coherent answers to the collapse problem. The practice implicitly assumes bounded adversaries (limited resources/skill), but this boundary is rarely quantified. If pressed, I'd guess most practitioners adopt a "plausible adversary" model combining realistic compute budgets with known attack techniques, but this deserves explicit articulation.
answer: |-
  Right, let's untangle this properly. It's a sticky philosophical knot you've identified, and you're quite right to notice the tension between the measurement practice and the decision logic in frontier model evaluation. The core issue revolves around what these average-case numbers are *for* when the deployment gate seems swung by worst-case possibilities.

  The implicit theory at work here, I'd argue with moderate confidence, is a hybrid risk model blending elements from different domains, but ultimately presupposing a specific kind of **adversarial uncertainty**. It's not quite pure maximin, nor pure expected value, nor a straightforward safety factor approach. Instead, it leans heavily on:

  1.  **The Transformative Power of Access and Search:** The practice presupposes that once a model is deployed, particularly via an API or downloadable weights, *any* capability or vulnerability, no matter how statistically rare under benign conditions, becomes accessible to a sufficiently motivated and resourceful adversary. The adversary isn't just another user; they possess the ability to run vast numbers of queries, systematically probe for weaknesses, adapt their attacks based on partial successes, and potentially automate the search for triggers or jailbreaks. The average case tells you how it behaves *without* this concentrated adversarial effort. The decision logic worries about how it behaves *under* it. The unstated premise is that low probability under random sampling becomes near certainty under directed, iterative adversarial search. This is why a single, reliably reproducible jailbreak or dangerous capability demonstration is treated as disqualifying – it's proof the vulnerability exists and *can* be found and exploited by that determined adversary. (High confidence in this being the core driver).

  2.  **Average Case as Baseline, Worst Case as Boundary:** The average-case metrics aren't merely window dressing. They serve crucial, but distinct, purposes:
      *   **Benchmarking & Progress Tracking:** They allow comparison between models and versions, showing general capability and safety improvements over time.
      *   **Benign User Safety:** They indicate the level of safety and reliability a typical, non-adversarial user can expect, which *is* relevant for many applications and ethical deployment considerations.
      *   **Proxy for Adversarial Difficulty (Imperfect):** Higher average safety scores *suggest* a harder search problem for the adversary. A model resisting 99.9% of standard jailbreak attempts is intuitively harder to crack than one resisting only 80%, even if both *have* vulnerabilities. It acts as a loose, probabilistic bound on the worst-case *effort* required, not the worst-case *existence*. (Moderate confidence – it's often implied, but rarely formally justified as a tight bound).
      *   **Triggering Deeper Scrutiny:** Very low average scores flag models needing intense red-teaming focus to *find* those worst-case triggers.

  3.  **The Necessity of an Implicit Bounded Adversary:** You hit the nail on the head here. The practice *absolutely* relies on an informal notion of a "plausible, bounded adversary" to avoid the collapse into total non-deployment. This threat model is rarely explicitly quantified, but it lurks underneath. Evaluators implicitly assume:
      *   **Finite Search Budget:** The adversary has computational limits and time constraints. They can't run infinite queries.
      *   **Limited Access/Knowledge:** They might not have full white-box access (weights), or unlimited query volume, or perfect knowledge of the model's internal vulnerabilities discovered during training/eval.
      *   **Practical Skill Level:** While sophisticated, they aren't omnipotent; their tools and techniques have limits.
      The evaluation red-teaming *aims* to simulate this plausible adversary's capabilities. If *their* best efforts, within practical resource constraints, fail to find a reliable catastrophic trigger, the model might be deemed "safe enough" for carefully managed release, *despite* the theoretical certainty that vulnerabilities exist *somewhere*. The "98% resisted" figure, in this light, isn't the final safety verdict; it's an *input* describing the red-team's *sampled experience* against the model, reflecting the difficulty *their* bounded adversary faced. The decision hinges on whether they *found* a reliable trigger during this simulation of bounded adversarial effort. (High confidence in this being the operational reality).

  **What Views Does This Quietly Rule Out?**

  *   **Pure Expected Value (EV) / Risk-Budgeting:** This is the most directly ruled out. The practice explicitly rejects the notion that a rare (e.g., 0.1% triggerable) catastrophic capability is acceptable because its expected harm (probability x impact) is low. Why? Because of Point 1 above: adversarial access transforms that low probability into near-certainty *for the specific actor intending harm*. You can't "price in" an adversary deliberately seeking and exploiting that exact 0.1% flaw to cause maximum damage. The harm is not a random accident; it's a *targeted* outcome enabled by the flaw's existence. (High confidence).
  *   **Pure Average-Case Reliance:** Conversely, it rules out *only* caring about the average. A model scoring brilliantly on average but having one devastating, reliably triggerable flaw would (rightly) be blocked.
  *   **Formal Safety-Factor Engineering:** While there's a loose resemblance, civil engineering uses well-understood physics and material properties to apply *quantifiable* safety factors to *calculated* average/max loads. AI vulnerabilities are emergent, poorly understood, and adversarial search isn't analogous to a static load multiplier. The "safety factor" here is implicit and qualitative (the red-team effort), not a calculated number. (Moderate confidence).

  **Where is it Underdetermined?**

  Several distinct philosophical stances *could* license the *same* observed behaviour:

  1.  **Cost-Sensitive Maximin:** Minimising the maximum possible loss is paramount, *but* only considering losses achievable by adversaries within plausible resource bounds (the implicit threat model). The average case informs the cost/feasibility of achieving that min-max.
  2.  **Precautionary Principle (Bounded):** Avoid deployment if there's credible evidence (like a single reliable demo) of *severe* harm, even if likelihood under normal use is low, *unless* mitigation is proven feasible. The red-teaming defines "credible evidence" within practical bounds.
  3.  **Adversarial Reliability Focus:** The core requirement is that the model demonstrably *withstands realistic, concerted attacks* during evaluation. Pass rates quantify the *evaluation's results*, not the model's inherent safety in a vacuum. Deployment is approved only if the *evaluation* found no disqualifying reliable failures. This sidesteps absolute probabilities.

  **What if Pure Expected Value Ruled?**

  Adopting a strict EV/risk-budgeting view would necessitate profound procedural changes:

  1.  **Eliminate Binary Pass/Fail Thresholds:** Capability demonstrations or jailbreak successes wouldn't be automatic showstoppers. Instead, each potential failure mode would need its *probability* estimated under *realistic deployment scenarios* (including adversarial access) and its *impact* quantified.
  2.  **Quantify Harm & Probability:** Extensive effort would go into estimating: the likelihood of a specific adversary with specific resources finding and triggering a specific flaw *and* succeeding in their harmful intent (e.g., creating a bioweapon, causing massive disruption), and the magnitude of the resulting harm. This is fiendishly difficult for novel, complex systems like frontier models.
  3.  **Aggregate Risk Budgets:** Models would be assessed against an overall "risk budget." A model might be approved even with known rare dangerous capabilities if their estimated EV harm is below the budget threshold, compensated by very low probabilities or mitigated impacts (e.g., detection systems catching the exploit attempt). Conversely, a model with high-probability, low-impact flaws might fail if the cumulative EV harm exceeded the budget.
  4.  **Focus Shift:** Evaluations would prioritise rigorous probability estimation (how hard is it *really* to find this flaw?) and detailed consequence analysis over simple pass/fail rates on fixed benchmarks. Red-teaming would aim to *estimate exploit likelihood*, not just find any flaw.
  5.  **Mitigation Value:** The effectiveness of safeguards (e.g., monitoring, rate limits, output filters) in *reducing the probability or impact* of a successful exploit would become a critical part of the risk calculation, rather than just a binary "present/absent" check.

  **The Least Confident Point:**

  I'm least confident about the precise **degree to which the 'bounded adversary' threat model is consciously acknowledged and consistently applied** across different labs and evaluators. Is it a well-articulated, shared understanding, or more of an unspoken intuition that varies? Does the *implicit* bound shift significantly based on model capability level or the specific dangerous capability in question? While the *logic* of needing such a bound is clear to avoid collapse, the *operational definition* of "plausible adversary resources" feels fuzzy and potentially subjective in practice. This lack of explicit quantification is a vulnerability in the current approach. One team's "sufficiently thorough red-teaming" might be another's "inadequate search."

  The current practice is a pragmatic, if philosophically messy, response to an incredibly hard problem. It blends measurement of typical behaviour with a search for catastrophic flaws under simulated adversarial pressure, implicitly assuming adversaries are powerful but not infinitely so. It fundamentally rejects pricing in catastrophic risks triggered by intentional malice, favouring exclusion of models proven vulnerable to *realistic* adversarial effort, while using average metrics to guide where that effort should be focused. It’s not entirely coherent, but it reflects the unique challenges of deploying systems where access enables the transformation of statistical rarity into deliberate certainty.
