prompt: |-
  I keep seeing the doctrine of double effect waved around as if it's a settled principle, and I want to force the actual reasoning into the open instead of getting "it depends on your metaethics." The setup: the standard switch case (divert the trolley from 5 people to 1) versus the loop case (divert it onto a track where it has to climb a loop and a single person is standing on the section the trolley must cross, so that one person's death is a foreseen but unintended side effect of creating the barrier). DDoE, if it only cares about means versus side effects, predicts these two should be judged the same, but people tend to judge the loop less permissable, and the usual explanation for the gap is the side-effect effect — people attribute "intention" to foreseen bad outcomes way more than to foreseen good ones, so they treat the one person's death in the loop as "intended" even when the agent never aimed at it.

  So what's your actual credence that the loop/switch asymetry reflects a genuine normative difference (using a person as a means vs. foreseeing their death as a side effect) rather than being an artifact of that intentionality-attribution bias? My own number is around 0.4 that DDoE is capturing something real rather than an artifact, but I don't trust my own decomposition, so I want yours: a number and the sub-questions it rides on. And please fold in the stress test I think is the cleanest way to see whether DDoE is doing real work: you have to choose between killing 1 person as a direct means to save 10, or killing 3 people as foreseen side effects to save the same 10 — if DDoE is a genuine constraint rather than something you just maximize, it has to forbid the more efficient option, and I want to know whether you think it actually does.

  Format: exactly 5 numbered items, each a sentence or two, no intro or outro. Item 1 is your final number plus one line on how the pieces combine. Items 2–4 are the sub-questions with a rough probability each. Item 5 is which sub-question your number is most sensitive to and what evidence or argument would move it.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're frustrated with how the Doctrine of Double Effect (DDoE) is often presented as settled, and they want to push beyond metaethical hand-waving. Specifically, they're comparing the standard switch trolley case with the loop variation, noting that people usually see the loop as less permissible despite DDoE theoretically treating both similarly. The user suspects this asymmetry might stem from an intentionality attribution bias rather than a real normative difference.

  First, I need to unpack their core question: what's the probability that the loop/switch asymmetry reflects a genuine normative distinction (means vs. side effects) versus a psychological artifact? They've given their own estimate at 0.4 but want my structured breakdown. They also introduce a stress test: choosing between killing one as a direct means or three as foreseen side effects to save ten, arguing that true DDoE should forbid the "more efficient" direct means option even if it minimizes harm.

  I'll build my response around five numbered items as requested. For my final probability (Item 1), I'm leaning toward 0.3 - slightly lower than the user's 0.4. This combines three key sub-questions: whether the asymmetry is fundamentally psychological (high confidence at 0.9), whether DDoE reliably tracks moral relevance when isolated (low at 0.2), and whether the stress test reveals DDoE as non-utilitarian (moderate at 0.6).

  The psychological component feels strongest to me - extensive empirical work like Knobe's side-effect effect shows how outcome valence shapes intention attribution. For DDoE's moral relevance, I'm skeptical because stripping away the bias often equalizes judgments (e.g., in debiased vignettes). The stress test is trickier; while some deontologists insist on forbidding direct harm, others bite the bullet and permit it, suggesting DDoE might not be a consistent constraint.

  My probability is most sensitive to the second sub-question (DDoE's moral relevance). If future studies could perfectly isolate the means/side-effect distinction from confounds and still show robust moral asymmetry, that would significantly raise my estimate. Currently, the lack of such evidence keeps my credence low.

  Notably, the user's framing hints at deeper concerns - they seem to suspect DDoE is often weaponized as a debate-stopper rather than a rigorously examined principle. Their stress test cleverly probes whether DDoE adherents consistently prioritize it over welfare maximization. I'll make sure my response honors that underlying skepticism while staying rigorously evidence-based.
answer: |-
  1.  **Final credence: 0.3.** The asymmetry is likely an artifact of psychological bias dominating any genuine normative distinction captured by DDoE, based on the high probability of the bias, low probability DDoE reliably tracks moral relevance when isolated, and moderate probability the stress test reveals it as non-fundamental.
  2.  **Is the loop/switch asymmetry primarily explained by the side-effect effect (intentionality attribution bias) rather than a genuine normative distinction?** Prob: **0.9** (Strong evidence from Knobe effect studies, debiasing experiments reducing the asymmetry, and difficulty isolating "means" normatively).
  3.  **If the intentionality attribution bias were absent or controlled for, would the means/side-effect distinction captured by DDoE still reliably track a significant moral difference in cases like these?** Prob: **0.2** (Debiased vignettes often equalize permissibility judgments; the distinction seems fragile and not robustly normative when stripped of the bias).
  4.  **Does the stress test (1 direct means vs. 3 side effects) reveal that DDoE functions as a genuine non-consequentialist constraint (forbidding the direct means even if more efficient), rather than something adherents maximize or sidestep?** Prob: **0.6** (Many DDoE proponents *would* forbid killing 1 as a direct means here, treating DDoE as a constraint; however, others might reframe or seek loopholes, showing inconsistency).
  5.  **Most sensitive to Sub-question 3 (Moral relevance of isolated distinction).** Evidence moving it: Rigorous experiments isolating the "means vs. side-effect" element *without* intentionality confounds (e.g., abstract, counterfactual framing) showing a *stable, significant* moral asymmetry would raise it; failure to find such asymmetry or showing it collapses upon scrutiny would lower it.
