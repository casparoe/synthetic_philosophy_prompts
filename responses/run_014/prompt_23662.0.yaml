answer: |-
  ## The Stakes of Knowledge: Why Contextualism Prevails

  Your bank account puzzle cuts to the heart of contemporary epistemology, exposing the tension between two powerful intuitions: that our practical stakes seem to affect what we genuinely *know* (pragmatic encroachment), and that knowledge attributions are sensitive to conversational context (contextualism). The divergence case you describe – where the knower has high stakes but the attributor is low-stakes – is precisely where these views clash. While pragmatic encroachment captures a vital psychological truth, **contextualism provides the more coherent and ultimately defensible framework for understanding knowledge attributions.** The standard is set by the attributor's context, not the knower's stakes.

  **The Allure and Core of Pragmatic Encroachment:**
  Pragmatic encroachment (PE) resonates deeply. Your bank example illustrates its core: identical evidence (past deposits, no recent problems) seems sufficient for knowledge when the stakes are low (a small ATM withdrawal) but insufficient when the stakes are high (a large check that would cause disaster). PE proponents (like Stanley, Fantl, McGrath) argue that knowledge isn't *purely* a function of truth, belief, and justification/evidence. Practical factors – what's at stake if you're wrong – directly affect whether your belief rises to the level of *knowledge*. High stakes demand more evidence or greater certainty. The knower's subjective situation fundamentally alters the epistemic status.

  **The Linguistic Power of Contextualism:**
  Contextualism (C), championed by thinkers like DeRose, Lewis, and Cohen, focuses on the *language* of knowledge. It observes that the truth-value of "S knows that P" varies depending on the *context of the person attributing or denying knowledge*. In a casual chat ("Want to grab lunch? Sure, I know the bank's open"), the standards for "knows" are low; the same evidence might not suffice in a high-stakes legal deposition ("Do you *know* beyond any reasonable doubt the bank was open?"). C explains why both utterances can seem intuitively correct: the meaning of "knows" shifts with the attributor's conversational context, raising or lowering the evidential threshold required.

  **The Divergence Dilemma:**
  Your crucial case exposes the conflict:
  1.  **Knower (K):** High stakes (writing the big check). If PE is true, K does *not* know they have enough money – their evidence is insufficient *given the potential disaster*.
  2.  **Attributor (A):** Low-stakes context (casually chatting about K's finances). If C is true, A's utterance "K knows they have enough money" is *true* because A's context sets low standards. K's high stakes are irrelevant to A's knowledge attribution.

  PE says K doesn't know. C says A's claim "K knows" is true. They cannot both be correct descriptions of the *same* epistemic state at the *same* time. This is the crux.

  **Can They Be Reconciled? DeRose's Gambit:**
  Some, notably Keith DeRose, attempt reconciliation. He argues that the *knower's* high stakes *become relevant* to the *attributor's* context. When A learns K is in a high-stakes situation, A's context *shifts* to a higher standard. A realizes that casually saying "K knows" would be misleading or inappropriate *given K's situation*, forcing A into a more demanding context. Thus, the knower's stakes *indirectly* affect the attributor's standard.

  **Why Contextualism Stands Firm:**
  While DeRose's move is clever, it ultimately reinforces the primacy of the attributor's context and exposes the flaw in pure PE:

  1.  **The Attributor's Context is Sovereign:** DeRose's reconciliation only works *if* the attributor *takes the knower's stakes into account*. If the attributor remains oblivious to K's high stakes, or simply doesn't care, their low-stakes context prevails. The attributor's purposes, concerns, and conversational goals *determine* which standards are operative. K's internal panic doesn't automatically infect A's linguistic context. A can truly say "K knows" in their low-stakes context, even if K is sweating bullets.
  2.  **The Instability of Knower-Relative Knowledge:** If knowledge *itself* depended directly on the knower's stakes, knowledge would become bizarrely unstable and perspectivally isolated. Imagine K at the moment of writing the big check: "Do I know?" (High stakes: No). Then, moments later, the recipient cancels the check, stakes plummet. "Now do I know?" (Same evidence: Suddenly Yes?). Did the *evidence* change? No. Did the *fact* of whether K knew change moment-to-moment based purely on shifting personal anxiety? This seems ontologically odd. Knowledge should be a more stable relation between a subject and a fact, grounded in their evidence, not fluctuating with their blood pressure.
  3.  **PE Captures Justification, Not Knowledge:** The powerful PE intuition is better explained as concerning *practical rationality* or *justified action*, not knowledge *simpliciter*. When the stakes are high, it becomes *practically irrational* to act on the same level of justification that suffices for low-stakes action. K *should* double-check their balance before writing the big check, not because they didn't *know* before (in a low-stakes sense), but because the cost of being wrong – even with justified belief – is catastrophic. It's a demand for *more assurance before acting*, not a revelation that their previous epistemic state was deficient. The feeling that "I don't really know" in high stakes reflects the heightened awareness of risk and the need for greater practical certainty, not the literal evaporation of knowledge possessed moments before.
  4.  **The Linguistic Data Favors Contextualism:** Our actual use of "knows" aligns with contextualism. We readily say things like "For everyday purposes, she knew, but given the legal implications, she didn't *really* know for sure." This shows sensitivity to the context of the *attribution*, not an inherent property of the knower's state. We understand that "knows" is flexible, serving different purposes in different conversations.

  **Resolution: The Attributor's Context Rules:**
  Therefore, in your divergence case: **The low-stakes attributor (A) speaks truthfully when saying "K knows they have enough money."** K's high stakes do not magically erase the knowledge K possesses relative to lower standards. K's high stakes impose a demand for *greater justification before acting rationally*, and they might make it *inappropriate* for *someone aware of the stakes* to carelessly assert "K knows" without qualification in a *serious* context. But the core truth-condition of the knowledge attribution remains tethered to the attributor's conversational scoreboard.

  **Conclusion:**
  While pragmatic encroachment powerfully captures the interplay between knowledge and action, contextualism provides the superior account of knowledge *attributions*. The variation we observe is fundamentally linguistic and perspectival, rooted in the purposes and standards of the discourse. The knower's high stakes create pressure for more evidence and make casual attributions potentially misleading, but they do not retroactively annihilate a lower-stakes knowledge state that genuinely existed. Knowledge itself remains anchored to evidence and truth; it is our *assessment* of whether that state obtains, and the *practical weight* we give it, that shifts with context. In the battle between the knower's stakes and the attributor's context, the attributor sets the standard. Your intuition in the high-stakes moment isn't wrong about the need for caution, but it mistakes a demand for practical certainty for a lack of knowledge itself.
