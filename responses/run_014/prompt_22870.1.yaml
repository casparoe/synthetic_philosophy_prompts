  The bet proposed by your statistician friend is indeed fair, with an expected value of zero, meaning that neither you nor your friend has an expected advantage. However, the apparent paradox—where the expected gain and expected loss both seem infinite—arises from a misunderstanding in how the expectation is computed. Let me clarify this step by step.

  ### Step 1: Understanding the Bet
  - A fair coin is flipped. If it lands heads (probability 1/2), you repeatedly flip a second fair coin until it lands heads. Let \(k\) be the number of flips required (including the first heads). You then pay your friend \(2^{k-1}\) dollars.
  - If the first coin lands tails (probability 1/2), the same procedure occurs, but your friend pays you \(2^{k-1}\) dollars.
  - The second coin flip process is identical in both cases: \(k\) follows a geometric distribution starting at \(k=1\), with \(P(k) = (1/2)^k\) for \(k = 1, 2, 3, \ldots\).

  ### Step 2: Computing the Expected Net Gain
  Define your net gain as \(G\):
  - If the first coin is heads, \(G = -2^{k-1}\) (a loss for you).
  - If the first coin is tails, \(G = +2^{k-1}\) (a gain for you).

  The expected net gain is \(E[G]\). To compute this, we can condition on the value of \(k\):
  - For each possible \(k\), the event that the second coin takes exactly \(k\) flips to land heads has probability \(P(k) = (1/2)^k\).
  - The probability that the first coin is heads or tails is each 1/2, and since the first and second coins are independent, we have:
    - \(P(\text{first heads and } k) = P(\text{first heads}) \cdot P(k) = (1/2) \cdot (1/2)^k = (1/2)^{k+1}\)
    - \(P(\text{first tails and } k) = P(\text{first tails}) \cdot P(k) = (1/2) \cdot (1/2)^k = (1/2)^{k+1}\)

  For each \(k\), your net gain can be either \(-2^{k-1}\) or \(+2^{k-1}\), each occurring with probability \((1/2)^{k+1}\). Therefore, the contribution to \(E[G]\) for each \(k\) is:
  \[
  (-2^{k-1}) \cdot (1/2)^{k+1} + (2^{k-1}) \cdot (1/2)^{k+1} = 2^{k-1} \cdot (1/2)^{k+1} \cdot (-1 + 1) = 0
  \]

  Summing over all \(k\):
  \[
  E[G] = \sum_{k=1}^{\infty} 0 = 0
  \]

  Thus, the expected net gain is exactly zero, confirming that the bet is fair.

  ### Step 3: Resolving the Infinity Paradox
  The confusion arises when considering the conditional expectations separately:
  - If the first coin is heads, your expected loss is \(E[-2^{k-1} \mid \text{first heads}] = -E[2^{k-1}]\), and similarly, if the first coin is tails, your expected gain is \(E[2^{k-1} \mid \text{first tails}] = E[2^{k-1}]\).
  - Let \(Y = 2^{k-1}\). Then:
    \[
    E[Y] = \sum_{k=1}^{\infty} 2^{k-1} \cdot (1/2)^k = \sum_{k=1}^{\infty} (1/2) = \infty
    \]
    So \(E[Y]\) is infinite, meaning the expected payment (whether you pay or receive) is infinite when conditioned on the first coin outcome.

  However, when we compute the unconditional expected net gain \(E[G]\) by conditioning on \(k\) (as above), the infinities cancel out for each \(k\), resulting in a well-defined expectation of zero. The key is that the net gain balances for every possible \(k\), so the overall expectation exists and is finite (zero).

  Mathematically, \(E[G]\) is defined because the series converges absolutely when grouped by \(k\), but the conditional expectations \(E[G \mid \text{first heads}]\) and \(E[G \mid \text{first tails}]\) are both infinite and undefined on their own. This is not a case of "math breaking down"; rather, it highlights that expectations must be computed carefully when dealing with heavy-tailed distributions.

  ### Step 4: Should You Take the Bet?
  - **From a fairness perspective**: The bet is fair with \(E[G] = 0\), so if you are risk-neutral (i.e., you care only about expected value), you should be indifferent to taking or not taking the bet.
  - **Risk considerations**: In practice, people are often risk-averse, meaning they prefer to avoid uncertainty, especially when large losses are possible. Here, \(G\) has infinite variance (since \(E[G^2] = \infty\)), indicating extreme variability:
    - With high probability, the outcome involves small amounts. For example:
      - \(P(|G| \leq 8) = P(k \leq 4) = 15/16 = 93.75\%\) (since \(P(k \leq 4) = 1/2 + 1/4 + 1/8 + 1/16 = 15/16\)).
      - Large gains or losses are rare: \(P(|G| > 1024) = P(k \geq 12) = (1/2)^{11} = 1/2048\), so \(P(\text{loss} > 1024) = (1/2) \cdot (1/2048) = 1/4096\).
    - Due to risk aversion, you might decline the bet because the disutility of a large loss could outweigh the utility of a large gain (e.g., losing $1,000 might hurt more than gaining $1,000 helps, especially with limited wealth).
    - However, in a friendly setting like a dinner party, the actual amounts are likely to be small, making the risk negligible. Taking the bet could be fun and harmless.

  ### Conclusion
  - **Take the bet if**: You are risk-neutral or risk-seeking, or you view it as a low-stakes game among friends. The bet is mathematically fair.
  - **Do not take the bet if**: You are risk-averse and the possibility of a large loss (even with low probability) concerns you.
  - **Principled decision**: The math does not break down; the expected value is zero. Use expected value for a risk-neutral decision, or consider utility theory (e.g., expected utility with a concave utility function) if risk-averse. In practice, since the bet is symmetric and likely low-impact, taking it is reasonable.

  Your friend is correct that the bet is fair, but your hesitation about the infinite expectations is understandable—it stems from miscomputing the conditional expectations. With the full calculation, \(E[G] = 0\) holds. If you're comfortable with some uncertainty, go ahead and take the bet!
