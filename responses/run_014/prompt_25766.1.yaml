  ### Adjudication of the Dispute Between David and Esther

  The disagreement between David and Esther arises from a fundamental tension in how groups aggregate individual judgments into a collective decision, particularly when the decision depends on multiple criteria. This scenario is a classic example of a problem in social choice theory known as the "discursive dilemma" or "judgment aggregation problem." Below, I will address who is right on which specific points, provide a principled resolution, and explain why this reveals a genuine tension in group decision-making.

  #### Summary of the Key Arguments
  - **David's Position (Premise-Based Voting)**: He argues that the department established two necessary and jointly sufficient conditions for hiring (research excellence and teaching fit). Therefore, the committee's role is to determine whether each condition is met, and if a majority affirms both criteria, the candidate must be hired to remain consistent with the department's standard. Voting directly on the conclusion (the overall hiring decision) risks violating this standard, as it could lead to a candidate being rejected even when both criteria are satisfied by majority vote.
    
  - **Esther's Position (Conclusion-Based Voting)**: She contends that the point of voting is to reflect the majority's will on the final decision. If a majority of the committee opposes hiring (as in the 2–1 vote against), overriding this with a premise-based approach undermines democratic principles. She emphasizes that "the majority" is not a monolithic entity but a collection of individuals, and different majorities on different questions should not bind the group to an outcome that most members reject.

  #### Who Is Right on Which Points?
  - **David is correct that premise-based voting is the only coherent way to implement the department's explicitly defined decision rule.** The department agreed in advance that the candidate "should be hired if and only if (a) their research program is excellent, and (b) they can cover our undergraduate teaching needs." This rule is a logical conjunction: both conditions must be true for hiring to occur. Premise-based voting directly operationalizes this rule by aggregating judgments on each criterion separately and then applying the conjunction. 
    - In this case, a majority affirms research excellence (Alvarez and Berg vote yes, Chen votes no) and teaching fit (Alvarez and Chen vote yes, Berg votes no). Thus, the conjunction is satisfied, and the candidate should be hired. This approach ensures logical consistency at the group level. If the committee rejects a candidate who meets both criteria by majority vote, it contradicts the department's own standard, making the rule meaningless. David is also right that switching to conclusion-based voting after the fact (e.g., if criteria votes pass) would appear procedurally manipulative, as it could overturn a decision derived from the agreed-upon criteria.

  - **Esther is correct that conclusion-based voting better reflects the majority's preference on the final outcome, but she underestimates the risk of inconsistency.** Her point that a majority opposes hiring (2–1) is valid and highlights a democratic concern: if groups consistently generate outcomes opposed by a majority, it can erode trust and legitimacy. However, Esther's argument ignores that the "majority" opposing hiring (Berg and Chen) is not a consistent group with a unified reason. Berg opposes because of teaching fit (which the majority affirms), and Chen opposes because of research (which the majority also affirms). Thus, the majority opposition is based on premises that the group, as a whole, has rejected. Conclusion-based voting risks creating an inconsistent group judgment: the committee could reject a candidate while affirming, by majority, that both hiring criteria are met. This undermines the department's rule and introduces arbitrariness.

  #### Principled Resolution
  The principled resolution is to **use premise-based voting in this context, as it aligns with the department's predefined decision rule and ensures logical consistency**. However, this must be coupled with a procedural norm: the voting method should be established in advance to avoid manipulation. Here's why:
  - **Adherence to the Decision Rule**: The department's criteria are not mere "tools" for judgment but a binding standard that defines what hiring means. Premise-based voting respects this by treating the criteria as objective premises to be evaluated factually. If the committee uses conclusion-based voting and rejects a candidate who meets both criteria by majority, it violates the iff (if and only if) condition, rendering the rule useless. For example:
    - Premise-based outcome: Research = yes (2–1), Teaching = yes (2–1) → Hire (consistent with rule).
    - Conclusion-based outcome: Not hire (2–1), but Research = yes (majority), Teaching = yes (majority) → Inconsistent with rule.
  - **Mitigating Esther's Concern**: While premise-based voting can produce an outcome opposed by a majority (as here), this is not inherently perverse. It reflects that committee members may hold minority views on individual criteria, but the group's role is to apply the rule based on aggregated judgments. If the department is dissatisfied with outcomes like this (e.g., if it frequently leads to hiring candidates without majority support), it should revisit the criteria or decision rule, not the voting procedure. For instance:
    - The department could require unanimity or a supermajority on criteria.
    - Alternatively, it could allow conclusion-based voting but only after specifying that criteria are advisory, not determinative (though this weakens the rule).
  - **Procedural Recommendation**: To prevent disputes, groups should decide the voting method before any votes are cast. If premise-based voting is used (as it should be here), the process should include deliberation to align members on factual criteria, reducing the chance of fragmented majorities.

  #### Why This Reveals a Genuine Tension
  This dispute exposes a deeper issue in collective decision-making: **there is no universally "correct" aggregation method**; it depends on the nature of the decision and the group's goals.
  - **Premise-based voting** is superior for decisions involving logical rules or factual premises (e.g., legal judgments, policy compliance), as it preserves consistency and reduces the influence of irrational or inconsistent individual views. However, it can create "false positives" where a candidate passes on criteria but lacks broad support (as here).
  - **Conclusion-based voting** is better for holistic or value-based decisions (e.g., electing a leader), where the outcome reflects collective preference. But it risks inconsistency, especially with conjunctive rules, and may ignore defined standards.
  - **Theoretical Insight**: This tension is rooted in the impossibility results of judgment aggregation (e.g., the "doctrinal paradox"), which show that no aggregation method can always satisfy consistency, majority rule, and logical closure simultaneously. Groups must prioritize one aspect, often at the expense of others.

  In this specific case, because the department framed hiring as dependent on explicit, necessary, and sufficient conditions, premise-based voting is the more principled choice. David's argument holds for ensuring fidelity to the rule, while Esther's concern highlights why groups should design decision rules carefully to avoid such dilemmas. If similar conflicts arise frequently, the department might consider refining its criteria or using a different voting system (e.g., Borda count for criteria) to better capture nuanced preferences.

  **Final Recommendation for the Committee**: Given the department's advance agreement on criteria, the committee should vote on each criterion separately. Since both criteria pass 2–1, the candidate should be hired. This respects the department's standard and avoids logical inconsistency. For future cases, establish the voting method upfront to prevent procedural disputes.
