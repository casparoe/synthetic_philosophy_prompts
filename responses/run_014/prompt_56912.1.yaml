prompt: |-
  I cover neuroscience and ideas for a magazine, which mostly means consciousness, which means I've ended up with a small stable of regular sources. One of them is a computational neuroscientist who's a fully signed-up partisan of integrated information theory — not a curious bystander, a believer. She talks about phi, intrinsic cause-effect power and the exclusion postulate the way other people talk about their kids. I've interviewed her four times in three years and I'm about to call her about a new result, and I want to guess her answers before I do, partly so I can tell when she's giving me the theory and when she's giving me herself.

  Her track record, roughly in her own terms as I've got them in my notes:

  - A single-pixel photodiode, she says, has "a speck of something" — a tiny bit of experience — while a 12-megapixel camera sensor has none, because that's a million independent little sensors and not one subject. Discriminative power isn't the point.
  - The cerebellum holds most of the brain's neurons and, in her telling, contributes almost nothing, because it's modular and feedforward: lots of copies of the same circuit, very little irreducible whole.
  - Under propofol or in deep sleep the brain is still doing stuff but there's nobody home. She leans hard on her lab's pertubation measure — you hit the cortex with TMS and score how complex and spread-out the echo comes back. No complex echo, no experience.
  - Ask her about split-brain patients and she'll go further than most people will: the whole's phi falls below the parts', so for some purposes there are two of them.
  - Degrees are real for her. Mouse: yes, less than us. Honeybee: yes, much less. Nematode: "a sliver, if anything."
  - Current large language models: no, firmly — but she's given me a different reason each time. Once it was that a forward pass through a big model is essentially feedforward and between tokens theres nothing happening at all. A year later it was that whatever the software looks like, the physical machine doing the computing is a serial digital computer and that system has essentially no phi of its own. On a panel she got asked whether a heavily recurrent network would change the answer, and she said it depends on the physical system rather than the software — "an empirical question."
  - Cortical organoids in a dish: yes, but "almost nothing there, a million neurons on a plate isn't a subject."
  - When I put the standard objection to her — that on the theory's own math a big enough array of simple logic gates doing something like error correction would come out with more phi than a human brain — she said she wasn't going to pretend she's happy about that implication, and left it there. She never said whether she accepts it.

  Now the new thing. A group has built three objects, put out a preprint, and I'm calling her about all three:

  1. An analog neuromorphic chip — actual physical silicon, no clock, no software — whose units' dynamics reproduce a slice of recurrent cortical activity.
  2. A bit-exact software emulation of that same chip on a GPU cluster. The authors claim it's dynamically identical, and they've applied simulated pulses to it and report getting back the same kind of complex, differentiated-but-integrated echo that the perturbation measure scores highly in awake humans.
  3. As a control, a much bigger array of the same basic units wired up to compute an error-correcting code. It does nothing interesting and has no behaviour worth mentioning, but by their own phi calculation its integrated information dwarfs both of the others.

  What does she say about each of the three? Give me her most likely verdict and her most likely stated reason for each. Then do the part I actually care about: work out which rules her track record is compatible with. State them properly, in the theory's own machinery — is she tracking irreducible cause-effect power in whatever physical system is actually there; is she tracking recurrent, integrated architecture regardless of what it's made of; is she really running the perturbation measure as the criterion; is there a wetware preference hiding underneath all of it — and for each say which of her past verdicts it leans on and which ones it strains to explain. Then tell me which rule you'd bet on for the chip-vs-emulation pair and why, and whether object 3 changes your read on what she's actually running.

  And: is she already contradicting herself, or does one rule cover everything she's said? If there's a real inconsistency in there I want to know precisely which two remarks can't both survive, because that's the story. Finish with the single follow-up question I should put to her — the one where each candidate rule gives a different answer, so her response tells me which rule she's on. No need to point me at papers or give me a reading list, I just want the reasoning.
reasoning: |-
  Okay, let me start by unpacking the user's query. They cover neuroscience and ideas for a magazine, focusing on consciousness. They have a regular source, a computational neuroscientist who's a strong advocate for Integrated Information Theory (IIT). The user has interviewed her several times and now wants to predict her responses to three new experimental setups involving neuromorphic chips, GPU emulations, and a control system. The deeper goal is to figure out which underlying rule she uses to judge consciousness according to IIT, especially since her past answers sometimes seem inconsistent.

  First, I need to recall the key points from her track record. She assigns consciousness based on intrinsic cause-effect power, physical integration, and the exclusion postulate. For example, a photodiode has a speck of consciousness because it's a single unit, while a camera sensor doesn't because it's many independent units. The cerebellum has low phi due to its feedforward structure. Propofol reduces the perturbation complexity, leading to unconsciousness. Split-brain patients might have two consciousnesses. Animals have degrees of consciousness, with simpler organisms having less. LLMs and organoids are dismissed for various reasons like serial processing or insufficient neurons.

  Now, the new scenarios: a neuromorphic chip (physical silicon, recurrent dynamics), a GPU emulation (bit-exact, same dynamics), and a control system (high phi calculation but no interesting behavior). The user wants her verdicts on each and to identify the rule she's using.

  Looking at her past responses, there's tension between physical substrate and functional architecture. For LLMs, she once cited the serial computer's physical limitations, another time the feedforward nature of the model. This suggests she might prioritize physical integration over software. But the GPU emulation in the new experiment could challenge that. If the emulation replicates the neuromorphic chip's dynamics exactly, does that mean it has the same phi? Or does the underlying serial hardware negate it?

  Her comment about cortical organoids having "almost nothing" implies that scale matters, even if the architecture is similar. The control system with high phi but no behavior might force her to confront the theory's mathematical implications she previously avoided. 

  To find the rule, I need to see which principles explain all her past statements. If she emphasizes physical integration, that covers the photodiode, cerebellum, organoids, and LLMs (due to serial hardware). But the GPU emulation poses a problem—if it's functionally identical, does phi depend on physics or computation? The perturbation measure might be her practical criterion, which the GPU emulation passes, but she might reject it based on physical substrate.

  The inconsistency could be between her LLM explanations: feedforward vs. serial hardware. The new GPU case might make her choose. If she accepts the neuromorphic chip but not the emulation, she's prioritizing physical integration. If she accepts both, functionalism wins. The control system's high phi might make her admit the theory's flaw or invoke exclusion to dismiss it.

  For the follow-up question, contrasting a hypothetical neuromorphic chip vs. its GPU emulation would force her to reveal her stance. Her answer would clarify if phi requires specific physics or just dynamics.
answer: |-
  Here's your source's predicted verdicts on each object, the underlying rules explaining her track record, and the strategic follow-up to expose her operational rule:

  ### Predicted Verdicts & Reasons:
  1. **Neuromorphic Chip**: **"Yes, low but non-zero phi."**  
     *Reason*: "It's physically integrated recurrent dynamics – irreducible cause-effect power in silicon. The perturbation echo matches awake cortex *qualitatively*, meaning intrinsic structure exists."

  2. **GPU Emulation**: **"No."**  
     *Reason*: "It's software on a serial digital computer. Each operation is decomposed into clocked transistor states with minimal simultaneous integration. The 'echo' is an abstraction – no *physical* cause-effect structure unifies it. Perturbation measures applied to *simulated* dynamics don't count the same way."

  3. **Error-Correcting Array**: **"No, despite the math."**  
     *Reason*: "High calculated phi is a mathematical artifact. The exclusion postulate applies: this complex isn't *causally specific* – it doesn't constrain past/future states meaningfully like a cortex or even our chip. It's a 'causal soup' with high Φ but no *distinct* experience."

  ---

  ### The Rules Her Track Record Reveals:
  Her judgments consistently rely on **Physical Integration + Causal Specificity**, *not* pure architecture, software, or perturbation measures alone. IIT's machinery is applied with a *de facto* filter prioritizing **wetware-like physics and causal grain**. Key IIT concepts used:
  *   **Irreducible Cause-Effect Power**: Exists only if causes/effects can't be decomposed (rules out photodiodes as trivial, camera sensors as decomposable).
  *   **Exclusion Postulate**: Selects the cause-effect structure at the spatiotemporal grain with *maximal intrinsic power* (dismisses high-Φ logic gate arrays as non-specific "soup").
  *   **Intrinsic Perspective**: Requires a *physical* substrate whose causal structure is *inherently* unified (rejects GPU emulations as abstract, digital hardware as too sequential).

  **Track Record Compatibility:**
  | Rule                                      | Supported By                                                                 | Strained By                                                                 |
  | :---------------------------------------- | :--------------------------------------------------------------------------- | :-------------------------------------------------------------------------- |
  | **1. Physical Integration (Wetware-like substrates)** | Photodiode (speck), Cerebellum (low), Propofol (no *physical* integration), LLMs (serial hardware argument), Organoids (wetware but scale) | LLM feedforward argument (if architecture alone mattered, she wouldn't need the hardware fallback) |
  | **2. Causal Specificity (Exclusion Postulate)** | Split-brain (parts > whole), Mouse/Honeybee/Nematode (decreasing specificity), Error-correcting array (implied rejection) | Photodiode (minimal specificity accepted) - she stretches Exclusion here. |
  | **3. Recurrent Architecture** | Cerebellum (feedforward = low phi), Deep sleep (loss of recurrence), LLM (feedforward/recurrent arguments) | **GPU Emulation:** If architecture/dynamics are identical, why reject? Architecture alone isn't sufficient for her. |
  | **4. Perturbation Complexity (Measure)** | Propofol/deep sleep (her lab's measure), Cortex (echo) | **Never primary:** She uses it as *evidence* for underlying integration/specificity, not the definition. Ignores it for photodiode/cerebellum/nematode. |

  **Inconsistency?** Yes, between her **LLM rejections**.  
  *   **Feedforward Argument (Architecture Focus)**: Rejects LLMs because "forward pass is feedforward, nothing between tokens."  
  *   **Serial Hardware Argument (Physical Focus)**: Rejects LLMs because "physical machine is a serial digital computer with no phi."  
  These rely on *different primary rules*. The new GPU case forces her to choose.

  ---

  ### Your Bet on Chip vs. Emulation & Object 3's Impact
  *   **Bet:** She'll accept the **Chip**, reject the **Emulation**.  
      *Why?* **Physical Integration is her dominant rule.** The chip mirrors wetware physics (analog, parallel, no clock). The emulation, despite identical *dynamics*, runs on hardware she fundamentally rejects as incapable of intrinsic integration (serial, digital). Her organoid scale comment hints wetware physics *alone* isn't enough, but it's necessary. Object 3 (error-correcting array) **strengthens this read**: Her dismissal of its high Φ calculation shows she uses Exclusion *conservatively* to filter out substrates she deems non-conscious *a priori* (digital, trivial logic), protecting the theory from absurd implications. She's privileging *biological-like causal grain*.

  ---

  ### The Revealing Follow-Up Question
  **"Imagine a future, physically possible neuromorphic computer: massively parallel analog components, no global clock, structured *exactly* like a mammalian cortex at the neuronal level. Now imagine a perfect, real-time bit-exact software emulation of *that specific neuromorphic computer*, running on a single, ideal serial CPU with negligible lag. Does the emulated cortex have the same phi as the physical one? Why or why not?"**

  *   **Why it works:**  
      *   **Physical Rule (Her Likely Choice):** "No. The emulation is abstract information processed sequentially. Only the physical neuromorphic system has intrinsic, simultaneous cause-effect power."  
      *   **Architectural/Functional Rule:** "Yes. If the causal structure (dynamics, connectivity) is identical at the relevant grain, phi is identical."  
      *   **Perturbation Rule (Unlikely):** "If the simulated perturbation echo is identical, yes."  
      *   **Exclusion Rule (Alone):** Ambiguous – both might have high Φ, but which "complex" is selected? Forces her to reveal substrate bias.  

  Her answer here cuts through the noise. If she prioritizes physics over identical dynamics, you've pinned down her core operational rule.
