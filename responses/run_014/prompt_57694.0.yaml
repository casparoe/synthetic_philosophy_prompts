  | Final claim: sought only "a way out" | Consciousness defined by situated agency, not essence | Biological continuity/ethology                | Moderate  | Statement may be performative for academy              |
  | (If present) Chimpanzee at home | Unreportable consciousness evokes unbearable kinship | The "hard problem" / intrinsic value          | Weak*     | *Uncertain detail; if absent, weakens this moment      |
  | Insistence on his "achievement" | Reportability creates illusory ontological elevation  | Human exceptionalism                          | Strong    | Irony undermines his stated pride                      |

