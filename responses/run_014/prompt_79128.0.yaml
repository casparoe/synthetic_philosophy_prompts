prompt: |-
  I chair a small department, and for a few years now I've been watching something happen that I can't find a name for — I'm not sure whether it's a genuinely distinct pattern or just an obvious thing I'm dressing up in fancy clothes, so I'd like you to settle that. Here is the shape of it. Nobody involved is lazy or selfish, and everyone says, sincerely, that they value the thing that is disappearing. What disappears is a practice rather than a resource: the habit of answering each other's questions on the shared email list, or reading a colleague's draft before the meeting, or turning up to the colloquium and asking an actual question. I've seen the same shape in a large hobbyist forum I've moderated for years, where people used to write up their trips and now almost nobody does, even though the same people still read the write-ups and still say they miss them. Each individual omission is invisible, costs the person who omits it essentially nothing, and helps no one; you cannot point to the afternoon the practice died. What you can point to is a handful of visible defections early on, and then a term or two later everyone has stopped — and the state we land in is one that, if you polled the group, nobody would have chosen. Two features of this puzzle me. First, the thing being used up isn't scarce in the ordinary sense; there is no fixed quantity of draft-reading or trip-writing that gets exhausted, and if anything the practice is worth more to each person the more people take part, so the usual image of a finite pasture being nibbled down doesn't fit. Second, the remedies I read about don't seem to reach it: there is nothing to fence off and no quota to set, and the obvious fix — that somebody should start enforcing the norm, calling out the people who've quietly stopped — runs straight into the fact that the person doing the enforcing bears the whole cost while the benefit is spread over everyone, including the very people who stopped, so whoever would fix the problem is standing in exactly the same problem one level up.

  Is there a name for this? I've read enough to suspect it lives near the tragedy of the commons, and I've run across 'free-riding' and something about second-order collective action, and a colleague once mentioned a 'problem of many hands' in a different context, but none of these seems to be quite the thing: the commons literature I've seen is about rivalrous resources where my taking something is at least in principle measurable, and the responsibility literature seems to be about who is to blame once something bad has happened rather than about why a practice nobody wants to lose erodes while nobody decides to let it go. What I want is not a label to paste on the phenomenon. I want to know whether an established concept captures it exactly; if one does, I want to know which, and what it leaves out; and if none does, I want you to say so plainly and then propose one, defined sharply enough that I could take some new case and say whether it is an instance or not. Either way I want the boundaries drawn — what separates this from an ordinary public-goods problem, from the cases where a community does succeed in governing a shared resource on its own, and from a plain case of genuine scarcity where something really is being used up. And tell me what the two oddities I mentioned are doing here: is the fact that the thing consumed is non-rivalrous, and the fact that the enforcement problem reproduces itself one level up, essential to the pattern, incidental to it, or the whole point of it? A bare name would leave me exactly where I started.
reasoning: |-
  Okay, the user chairs a small department and has observed a puzzling pattern where collective practices—like answering emails, reading drafts, or writing trip reports—gradually disappear despite everyone valuing them. They need help identifying if this is a recognized phenomenon. 

  First, I recall this sounds similar to the "tragedy of the commons," but that typically involves rivalrous resources like pastures. Here, the practices are non-rivalrous; one person's participation doesn't diminish others' ability to participate. In fact, more participation increases the value for everyone. So that doesn't fit.

  Free-riding comes to mind, where individuals benefit without contributing. But in this case, everyone stops participating, not just some. Plus, the user mentioned that enforcement is problematic because the enforcer bears the cost alone, which creates a second-level collective action problem. Interesting—so the enforcement itself becomes a commons dilemma.

  The user also noted two oddities: the non-rivalrous nature and the recursive enforcement issue. These seem central. The practice is a public good—non-excludable and non-rivalrous—but unlike typical public goods (like clean air), it requires active participation to exist. It's a participatory public good.

  I remember Elinor Ostrom's work on how communities manage commons, but those often involve tangible resources. Here, the "resource" is the norm itself. Norm erosion fits—norms can decay when not reinforced. But why does it happen gradually? The spiral of silence theory might apply: people stop participating when they see others disengaging, reinforcing the decline.

  The recursive enforcement problem is key. Calling out non-participants is itself a collective action problem. Who wants to be the enforcer? This mirrors the original issue but at a higher level.

  So, is there a precise term? "Collective action problem" is broad. "Second-order free-riding" refers to avoiding enforcement costs. That fits the enforcement dilemma. But the core issue is the erosion of a participatory good. Perhaps "participation cascade" or "collaborative decay" captures it, but those aren't established terms.

  The established concept here is the erosion of a public good maintained by participation, compounded by second-order free-riding on enforcement. The non-rivalrous nature means the good isn't depleted but underprovided. The enforcement recursion is essential—it's what makes solutions tricky. 

  Boundaries: Unlike standard public goods problems, this isn't about scarcity but underinvestment due to participation thresholds. Unlike Ostrom's cases, there's no clear resource to govern. Unlike norm erosion, the recursive enforcement is a critical amplifier.

  Conclusion: No single term perfectly captures it, but the combination of a participatory public good with second-order enforcement failure is the core. The user needs to recognize both layers to address it effectively.
answer: |-
  This phenomenon you describe is **not merely adjacent to established concepts but a precise, underappreciated variant of a collective action problem**. It lacks a universally agreed-upon name, but its mechanics are well-defined. Below is a sharp conceptual dissection, starting with its core identity and boundaries.

  ---

  ### **The Core Concept: "Erosion of a Participatory Public Good"**
  This is the disintegration of a **non-rivalrous, non-excludable good that requires active participation to exist**. Key features:
  1.  **Non-rivalrous**: One person’s use (e.g., reading a trip report) doesn’t diminish others’ ability to use it.
  2.  **Non-excludable**: Once the good exists (e.g., a culture of draft-sharing), it’s hard to prevent anyone from benefiting.
  3.  **Participatory**: The good **only exists if people contribute** (e.g., writing reports, answering emails). Without participation, the good vanishes.

  **Why standard labels don’t fit perfectly:**
  - **Tragedy of the Commons**: Applies to *rivalrous* resources (e.g., grazing land). Your case involves *generating* a good, not *consuming* a finite resource.
  - **Free-Riding**: Explains *individual* incentives to withhold effort while benefiting. But your case shows **total collapse**, not just some free-riders alongside contributors.
  - **Second-Order Collective Action**: Nails the enforcement problem (nobody wants to punish non-participants) but doesn’t explicitly cover the *participatory* nature of the good itself.
  - **Problem of Many Hands**: Focuses on *diffused responsibility* for harm, not the *unraveling of a valued practice*.

  ---

  ### **Boundaries: What Separates This From Related Problems**
  | Concept                  | How Your Case Differs                                                                 |
  |--------------------------|---------------------------------------------------------------------------------------|
  | **Standard Public Goods** (e.g., clean air) | These exist without participation (air is there even if no one acts). Your good *requires* participation to exist. |
  | **Ostrom-Style Commons** | Governs rivalrous resources (e.g., fisheries). Your good is non-rivalrous and purely behavioral. |
  | **Scarcity-Driven Collapse** | Involves physical depletion (e.g., overfishing). Your collapse stems from *underprovision*, not overuse. |
  | **Norm Erosion**         | Broader; your case is a subtype where the norm *is* the public good and collapse is recursive. |

  ---

  ### **The Two Oddities: Essential to the Pattern**
  1.  **Non-Rivalrous Good**:  
      - **Essential**. The good’s value *increases* with participation (network effects). But this creates a **threshold effect**: once participation drops below a critical level, the good’s value plummets, accelerating collapse.  
      - *Example*: A single trip report has little value if no others exist. Ten reports create a valuable archive. Below a threshold, participation dies.

  2.  **Recursive Enforcement Problem**:  
      - **The Whole Point**. Enforcing participation (e.g., calling out non-contributors) is itself a **second-order participatory good**:  
        - It requires effort (cost to the enforcer).  
        - Benefits everyone (including free-riders).  
        - Collapses identically to the original practice.  
      - This creates a **self-reinforcing death spiral**: No participation → no value → less incentive to participate → no enforcement → collapse.

  ---

  ### **Diagnostic Checklist: Is This Your Phenomenon?**
  A new case fits if it has **all** of these:  
  ✅ A practice that benefits the group *only* if sustained by participation.  
  ✅ Individual contributions are non-rivalrous (my effort doesn’t block yours).  
  ✅ No physical scarcity; collapse is due to *underprovision*, not overuse.  
  ✅ Participants genuinely value the practice but still defect.  
  ✅ Enforcement is a second-order collective action problem.  
  ✅ Collapse is gradual, with no single decision point.

  ---

  ### **Proposed Name: "The Participation Trap"**  
  If no existing term satisfies you, this captures the core:  
  - **"Participation"**: Highlights the active contribution required.  
  - **"Trap"**: Emphasizes the self-reinforcing collapse and inability to escape without coordinated action.  

  **Why it fits**:  
  - Mirrors "collective action problem" but specifies the *participatory* nature.  
  - Avoids misleading baggage (e.g., "tragedy" implies rivalrous scarcity).  
  - Describes both the initial dilemma and the enforcement recursion.

  ---

  ### **Why This Isn’t Just Semantics**
  Recognizing this as a distinct pattern reveals why standard solutions fail:  
  - **Quotas/fines** address rivalrous goods, not participation thresholds.  
  - **Appeals to morality** ignore the structural incentive to defect.  
  - **Top-down enforcement** is costly and resented.  

  **Effective responses must target the recursion**:  
  1.  **Lower participation costs** (e.g., simplify draft feedback forms).  
  2.  **Create focal points** (e.g., "Feedback Fridays" to concentrate contributions).  
  3.  **Institutionalize enforcement** (e.g., rotate enforcement duty; tie it to existing roles).  
  4.  **Trigger restart thresholds** (e.g., seed the system with 3–5 committed participants to reactivate network effects).  

  This phenomenon is real, pernicious, and distinct. Its power lies in the lethal combination of non-rivalrous benefits and recursive enforcement—a trap where groups lose what they love precisely because everyone values it.
