  ### Decision Procedure for Evaluating Claims of Second-Law Violations in "Information Engine" Patent Applications

  **Instructions for Use:**  
  Fill in the ledger (Step 0) based solely on the application’s description. Proceed through questions in order. Answer each question based on the ledger and application. Do not skip steps. Use the specified terminals for conclusions. If a step requires external knowledge (e.g., Landauer bound), use the provided formulas.

  ---

  ### Step 0: Fill in the Explicit Ledger
  **Complete this table using the application’s description. Do not assume missing details.**  
  | **Ledger Item** | **Specification** |
  |-----------------|-------------------|
  | **System** | Describe the working substance (e.g., gas particle, electron, computational substrate). |
  | **Controller/Demon** | Describe the agent performing measurements/feedback (e.g., sensor, nanoscale mechanism). |
  | **Memory** | **Capacity:** Number of bits/states. **Reset?** Y/N. **Entropy of erased info:** Where does erased entropy go (e.g., dissipated to Bath X)? If not reset, where is information stored? |
  | **Heat Baths** | **Number:** List all baths. **Temperatures:** \( T_1, T_2, \dots \) (in Kelvin). |
  | **Operation** | **Cyclic?** Y/N (system & controller return to initial state). **Open-loop/Feedback?** Specify. |
  | **Claimed Output** | **Work/Behavior:** Quantify claimed output (e.g., work per cycle). **Violated Law:** Clausius (heat flows cold→hot without work), Kelvin-Planck (work from single bath), or total-entropy (\( \Delta S_{\text{total}} < 0 \)). |

  **Key Notes:**  
  - **Landauer Bound:** Erasing 1 bit at temperature \( T \) dissipates at least \( kT \ln 2 \) of heat to a bath (\( k \) = Boltzmann constant).  
  - **Critical Ledger Distinctions:**  
    - **Memory reset/entropy disposal:** Dropping this misses erasure costs (e.g., false "violation" in Szilard engine).  
    - **Cyclic vs. one-shot:** Dropping this misapplies cyclic second-law statements to non-cyclic processes.  
    - **Pre-existing resources:** Dropping this overlooks "fuel" like correlations (e.g., Example 3).  

  ---

  ### Fixed Sequence of Questions
  **Terminals:**  
  - **Terminal NO:** Stop. Claimed violation is impossible due to incomplete accounting. Reject application.  
  - **Terminal HAND TO PERSON:** Stop. Unresolved physics/legal issue. Refer to specialists.  

  **Question Sequence:**  
  1. **Is the operation cyclic?**  
     - *Requirement:* System AND controller/demon must return to initial state.  
     - **NO:** Proceed to Q2.  
     - **YES:** Proceed to Q2.  
     - *Judgment call:* If memory is not reset but applicant claims "cyclic," operation is not cyclic.  

  2. **Are all heat baths accounted for with defined temperatures?**  
     - *Requirement:* Every thermal interaction must specify a bath at temperature \( T \).  
     - **NO:** → HAND TO PERSON (incomplete thermal accounting).  
     - **YES:** Proceed to Q3.  

  3. **Does the device use resources not tracked in the ledger?**  
     - *Untracked resources:* Pre-existing correlations, non-equilibrium/driven baths, gravity, quantum resources (entanglement, measurement backaction), or other non-classical effects.  
     - **YES:** → HAND TO PERSON (ledger cannot capture resource thermodynamics).  
     - **NO:** Proceed to Q4.  
     - *Misfire warning:* Quantum resources (e.g., coherence) may invalidate Landauer; gravitational fields may enable work extraction.  

  4. **Is memory reset?**  
     - **NO:** Proceed to Q5.  
     - **YES:**  
       - (a) Is erasure in contact with a bath at temperature \( T \)?  
         - **NO:** → HAND TO PERSON (erasure without bath is unphysical).  
         - **YES:**  
       - (b) Does the application account for \( \geq kT \ln 2 \) heat dissipation per erased bit?  
         - **NO:** → Terminal NO (Landauer cost missing).  
         - **YES:** Proceed to Q5.  
     - *Misfire warning:* Landauer is disputed in quantum regimes (e.g., coherence-assisted erasure). → If disputed, HAND TO PERSON.  

  5. **Does the application provide data to compute total entropy change (\( \Delta S_{\text{total}} \))?**  
     - *Required data:*  
       - Heat flows (\( Q_i \)) to each bath.  
       - Initial/final entropy of system (if not cyclic).  
       - Initial/final entropy of memory (if not reset).  
     - **NO:** → Terminal NO (incomplete accounting).  
     - **YES:** Compute \( \Delta S_{\text{total}} = \Delta S_{\text{system}} + \sum \frac{Q_i}{T_i} + \Delta S_{\text{memory}} \).  
       - For cyclic processes, \( \Delta S_{\text{system}} = 0 \).  
       - \( Q_i \): Heat transferred **to** bath \( i \) (so \( Q_i > 0 \) if heat enters bath).  
       - \( \Delta S_{\text{memory}} \): Change in demon’s information entropy (0 if reset).  
       - **If \( \Delta S_{\text{total}} \geq 0 \):** → Terminal NO (second law holds).  
       - **If \( \Delta S_{\text{total}} < 0 \):** Proceed to Q6.  

  6. **Is Landauer or core thermodynamics disputed in the operating regime?**  
     - *Disputed regimes:* Quantum coherence, ultra-low \( T \), non-Markovian baths.  
     - **YES:** → HAND TO PERSON (physics not settled).  
     - **NO:** → HAND TO PERSON (extraordinary claim requires expert validation).  

  ---

  ### Example Applications: Running the Procedure

  #### **Example 1: Szilard-Style Single-Particle Engine**  
  *Claim:* Extracts \( kT \ln 2 \) work/cycle from one bath, violating Kelvin-Planck.  
  - **Ledger:**  
    - *System:* 1 particle in a box with divider.  
    - *Controller:* Demon measures particle position, inserts paddle.  
    - *Memory:* 1 bit. *Reset:* Y. *Entropy disposal:* Dissipated to bath at \( T \).  
    - *Heat Baths:* 1 bath at \( T \).  
    - *Operation:* Cyclic (particle recentered, memory reset). Feedback.  
    - *Claimed Output:* \( W = kT \ln 2 \)/cycle. Violates Kelvin-Planck.  

  - **Procedure:**  
    - Q1: Cyclic? **YES** (system/demon reset).  
    - Q2: Baths accounted? **YES** (1 bath at \( T \)).  
    - Q3: Untracked resources? **NO**.  
    - Q4: Memory reset? **YES** → (a) Erasure with bath? **YES**; (b) Landauer cost (\( kT \ln 2 \)) accounted? **YES** (application states dissipation).  
    - Q5: Compute \( \Delta S_{\text{total}} \):  
      - \( \Delta S_{\text{system}} = 0 \) (cyclic).  
      - \( Q_{\text{bath}} \): Work extraction absorbs \( Q = kT \ln 2 \) from bath (\( Q_{\text{bath}} = -kT \ln 2 \)); erasure dumps \( Q = kT \ln 2 \) to bath (\( Q_{\text{bath}} = +kT \ln 2 \)). Net \( Q_{\text{bath}} = 0 \).  
      - \( \sum \frac{Q_i}{T_i} = 0 / T = 0 \).  
      - \( \Delta S_{\text{memory}} = 0 \) (reset).  
      - \( \Delta S_{\text{total}} = 0 \geq 0 \) → **Terminal NO** (no violation).  
  - **Verdict:** Reject. Output is offset by erasure cost (net work = 0).  

  ---

  #### **Example 2: Reversible Computing Demon (No Memory Reset)**  
  *Claim:* Extracts work indefinitely from one bath without erasure cost.  
  - **Ledger:**  
    - *System:* Gas/particle manipulated by computation.  
    - *Controller:* Reversible computer (no heat dissipation).  
    - *Memory:* Finite capacity (e.g., 100 bits). *Reset?* **N**. *Entropy disposal:* N/A (memory stores information).  
    - *Heat Baths:* 1 bath at \( T \).  
    - *Operation:* Cyclic (system resets; memory not reset). Feedback.  
    - *Claimed Output:* Indefinite work from one bath. Violates Kelvin-Planck.  

  - **Procedure:**  
    - Q1: Cyclic? **NO** (memory not reset → demon not in initial state).  
    - Q2: Baths accounted? **YES** (1 bath at \( T \)).  
    - Q3: Untracked resources? **NO**.  
    - Q4: Memory reset? **NO** → Skip to Q5.  
    - Q5: Compute \( \Delta S_{\text{total}} \) for \( N \) cycles until memory full:  
      - \( \Delta S_{\text{system}} = 0 \) (cyclic for system).  
      - \( Q_{\text{bath}} = -N \cdot kT \ln 2 \) (heat absorbed to produce work \( W = N \cdot kT \ln 2 \)).  
      - \( \sum \frac{Q_i}{T_i} = \frac{-N kT \ln 2}{T} = -N k \ln 2 \).  
      - \( \Delta S_{\text{memory}} = \) Entropy of stored info \( = N k \ln 2 \) (initial entropy = 0).  
      - \( \Delta S_{\text{total}} = 0 + (-N k \ln 2) + N k \ln 2 = 0 \geq 0 \) → **Terminal NO**.  
  - **Verdict:** Reject. Work is "paid for" by increasing memory entropy. Device halts when memory fills (not indefinite).  

  ---

  #### **Example 3: Work from Pre-Existing Correlation**  
  *Claim:* Harvests work from pre-existing system-demon correlation.  
  - **Ledger:**  
    - *System:* Two correlated particles (no initial entropy specified).  
    - *Controller:* Demon exploits correlation for work.  
    - *Memory:* None mentioned.  
    - *Heat Baths:* 1 bath at \( T \).  
    - *Operation:* One-shot (not cyclic). Feedback.  
    - *Claimed Output:* Work from one bath. Violates Kelvin-Planck.  

  - **Procedure:**  
    - Q1: Cyclic? **NO**.  
    - Q2: Baths accounted? **YES**.  
    - Q3: Untracked resources? **YES** (pre-existing correlation). → **HAND TO PERSON**.  
  - **Verdict:** Refer to specialists. Ledger misses correlation entropy. Work may derive from this resource (not a violation).  

  ---

  ### What the Procedure Cannot Do  
  1. **Handle unstated resources:** Fails if application omits key details (e.g., hidden correlations).  
  2. **Resolve disputed physics:** Quantum/non-equilibrium regimes require expert input.  
  3. **Replace legal judgment:** "Novelty" or "non-obviousness" are legal questions, not physical ones.  
  4. **Override incomplete descriptions:** If ledger lacks critical data (e.g., entropy values), it defaults to Terminal NO or HAND TO PERSON.  

  **Final Note:** This procedure screens for *impossible* claims (Terminal NO) or flags uncertainty (HAND TO PERSON). It will **never** approve a violation—extraordinary claims require peer review.
