  - Prion case shows hinges can dissolve through practical erosion, not argument

  For the prion paradox: the nucleic acid principle functioned as a hinge during dismissal precisely because challenges were met with bewilderment, not counter-evidence. But its collapse reveals hinges aren't eternal - they're dynamic protections against epistemic chaos. The user's right that this supports revisable foundations, but Wittgenstein would add: revision only works when new hinges emerge (like protein folding stability) to take the load.

  Must emphasize: the essay's relativism overreach misses Wittgenstein's point that sharing human form gives deeper common ground than any hinge. When hinges clash, we don't just proselytize - we live into new certainties.
answer: |-
  Your audit request is precise and insightful—exactly what rigorous philosophy demands. Let's dissect the essay's claims against Wittgenstein's *On Certainty*, then apply your prion case. I'll be blunt, as requested.

  ### Audit of the Essay's Claims
  1. **"Hinge propositions cannot be proved or disproved... any test assumes them"**  
     **Verdict: Endorsed, with nuance.**  
     Wittgenstein: "If I want the door to turn, the hinges must stay put" (§343). Testing requires fixed hinges (e.g., "objects don't vanish unseen"). The essay correctly states hinges are immune to direct verification/falsification because they *enable* inquiry. Harmless simplification: It omits that hinges can *indirectly* erode when whole "language-games" collapse (e.g., witchcraft hinges fading with science).

  2. **"Hinges are not beliefs... nobody holds them on evidence"**  
     **Verdict: Wittgenstein's view, but mischaracterized.**  
     Wittgenstein distinguishes hinges from empirical beliefs: "I do not *know* [the world existed 5 mins ago]. The belief is part of our whole system" (§411). Hinges are "*animal* certainty" (§359)—pre-rational, embedded in action. The essay errs by calling them "beliefs we are entitled to hold." Wittgenstein rejects "entitlement": hinges are *logically prior* to justification. Calling them "irrational to surrender" smuggles in normativity Wittgenstein avoids. **Yes, the author quietly turns the arational into the justified—a significant error.**

  3. **"A community's hinges function like paradigms: adopted for payoff, abandoned when rivals prove fruitful"**  
     **Verdict: Not Wittgenstein's view; Kuhnian imposition.**  
     Wittgenstein rejects instrumental adoption: "What stands fast does so, not because it is intrinsically obvious or convincing; it is rather held fast by what lies around it" (§144). Hinges are inherited, not chosen for utility. They shift via *cultural/biological evolution*, not deliberate paradigm shifts. **Your nose is correct: this is Kuhn (or Popper) grafted onto Wittgenstein. Loss:** It ignores that hinges are *substrate* for paradigms (e.g., "reliable evidence" is a hinge; specific methodologies are paradigms).

  4. **"Deep disputes cannot be settled by argument... no common ground... persuasion remains"**  
     **Verdict: Partly correct but over-relativized.**  
     Wittgenstein: "Where two principles really do meet which cannot be reconciled, each calls the other a fool and a heretic" (§611). Yet hinges arise from shared "form of life" (§358). The essay ignores that *all humans* share bedrock hinges (e.g., "the world exists")—disputes occur at higher-level hinges (e.g., "revelation is evidence"). The "missionary" remark (§92) describes *persuasion through living*, not conversion. **Relativist conclusion is overstated:** Hinges differ in content, not structure; radical incommensurability is rare.

  ---

  ### Your Prion Case: Hinge or Entrenched Generalization?
  **The episode refutes the essay's claim that hinges "cannot be revised by inquiry."** Wittgenstein allows hinge erosion through *practical disruption*, not direct falsification. Your case exemplifies this:

  - **During dismissal:** "Infectious agents require nucleic acid" operated as a hinge. Challenges were met with bewilderment ("what could you mean?") not counter-evidence. This mirrors Wittgenstein's "riverbed" metaphor: hinges are "hard rock" vs. "fluid water" of empirical beliefs (§96–99).  
  - **Transition:** Prions destabilized the hinge by making *adjacent certainties* incoherent (e.g., "proteins can't replicate" conflicted with observed transmission). New tests emerged *only after* the hinge began shifting. Nobel Prize confirms it became "ordinary science."  
  - **Principled distinction mid-episode:**  
    - **Entrenched generalization:** Resists evidence but allows *conceivable* falsification (e.g., "all swans are white" yields to a black swan).  
    - **Hinge:** Its denial feels *nonsensical*; alternatives are "unthinkable." Colleagues didn't demand *evidence* but *sense-making*—classic hinge behavior.  

  **Your inclination is correct (and Wittgenstein-compatible):** Science's foundations *are* revisable, but not through direct argument. Hinges shift when:  
  1. Anomalies accumulate, straining the entire "system" (§142).  
  2. New practices emerge (e.g., protein misfolding assays), making rival hinges viable.  
  3. The old hinge loses its "anchoring" function (§99).  

  **What the episode shows about hinges:**  
  - Hinges are not timeless but *contextually absolute*—they hold until practices force recalibration.  
  - "Ungrounded certainty" ≠ *arbitrary*: It reflects deep entrenchment in human action (e.g., lab techniques relying on nucleic acid detection).  
  - **Your error (minor):** Calling foundations "not arbitrary" might imply rational choice. Wittgenstein stresses they are *inherited*—but their evolution is non-arbitrary (shaped by practical success).  

  ---

  ### Summary Corrections to the Essay
  | **Claim** | **Verdict** | **Key Flaw** |
  |-----------|-------------|--------------|
  | Hinges are unprovable/undoubtable | Correct | Omits indirect erosion via practice |
  | "Not beliefs" but "entitled to hold" | Contradictory | Smuggles justification into arational certainty |
  | Hinges = paradigms adopted for utility | Not Wittgenstein | Imposes Kuhnian instrumentalism |
  | Deep disputes = no common ground | Overstated | Ignores shared biological/cultural bedrock |
  | Missionary analogy = conversion | Misread | Persuasion via new *practices*, not rhetoric |

  **Final word:** The prion case refutes the essay’s rigidity but *supports* Wittgenstein. Hinges *can* change, but only when our "form of life" shifts—through lived experience, not proof. Your instinct that inquiry drives this is sound: science’s power is eroding obsolete certainties by making new actions possible.
