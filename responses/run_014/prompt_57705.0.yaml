  The prion narrative is gold. When scientists called protein-only infection "unthinkable," that's precisely Wittgenstein's hinge-behavior: the nucleic acid assumption wasn't treated as falsifiable but as the bedrock enabling virology. Yet its eventual revision shows hinges can shift through inquiry - contradicting the essay. The user's instinct that this proves foundations aren't arbitrary aligns with later Wittgenstein scholarship (Moyal-Sharrock etc.), though they wisely avoid name-dropping.

