prompt: |-
  Second-year undergrads, 18 of them, one 75-minute slot, and the topic is the problem of induction -- Hume first, then the green/grue business. The textbook version definately lands flat: they nod along at the future-resembles-the-past thing and then go right back to expecting the sun to rise. What I want is for them to feel the squeeze in their hands, before I name anything: (a) they can't help projecting, (b) the data they've got doesn't pick out the rule they project, and (c) the only thing separating the rule they like from the ones that make them uneasy seems to be something about us and our habits, not about the world.

  So design me a runnable classroom activity, not a lecture. Here's the shape I'm imagining -- change whatever needs changing if you've got a better mechanic, but keep the load-bearing bits:

  - They make real predictions with real (small) stakes -- tokens, points, whatever, no money.
  - At least one prediction has to resolve inside the session, so it's genuinely checkable, and I need to be able to say honestly that the outcome was fixed in advance and I didn't decide it on the fly.
  - Somewhere in the middle the participants themselves have to manufacture the rival hypotheses rather than be handed them. I want each group to take the rule they're betting on and produce, from a template I give them, a rival that fits every observation so far and disagrees later -- then have the room verify that the rivals fit just as well. The move I'm after is the moment they say that's cheating and can't say what cheating means without already assuming the answer.
  - There should be a bit where the only difference between two candidate rules is a record of past usage -- one has been used forty times over the term, the other never -- and they have to try to justify preferring the used one without appealing to its being the natural or real one.
  - Optional, if it's worth the shopping trip: I can get thermochromic beads or chips, green at room temp and blue once you've held them a while. If that lets you build a version where the rival hypothesis is not merely consistent with the data but actually true of the objects, and the flip is a real event in the room, do that. If not, give me the version where the outcome sits in a sealed envelope and I'm honest about that.

  What I need back: materials list (cheap, classroom-available), the rules and payoff scheme, a minute-by-minute timeline, the exact wording for the few moments where I have to speak, and the debrief -- which has to map specific things that happened (that group's sealed card, the flip, the score) onto the parts of the problem, without needing any reading list or names.

  Two things I want you to be honest about instead of papering over: what will predictably go wrong the first time I run it (I'm expecting at least one group to insist that any rival is ad hoc and to treat that as a knockdown, and one group to just game the tokens), and which part of the idea the activity can't reproduce and I'll have to supply myself. My guess is it's the entrenchment thing -- in the room every rival is equally new and equally artificial, so the asymmetry that makes the ordinary predicate feel privileged has to be asserted by me rather than felt. Tell me if you think that's wrong, or if there's a way around it.

  Also, please don't lean on any particular published version of the puzzle. I'd rather the students build the structure themselves than recognise it.
reasoning: |-
  Okay, the user is a professor teaching second-year undergraduates about the problem of induction. They want an interactive classroom activity that makes students genuinely feel the tension in Hume's problem and Goodman's grue paradox. The key goals are: (a) making students realize they can't help projecting patterns, (b) showing them data underdetermines theories, and (c) revealing that preference for certain projections comes from us, not the world.

  Hmm, the professor specifically wants students to create rival hypotheses themselves rather than being handed them. That's crucial. They also want real stakes with immediate resolution, and ideally a physical element like thermochromic beads. The challenge is making the "entrenchment" asymmetry felt since all predicates in the activity will be equally new. 

  First, I need a simple prediction game with physical components. Thermochromic beads are perfect - green when cold, blue when warm. We can have students predict color changes. The beads solve the "pre-set outcome" problem since their behavior is physically determined. 

  For the activity flow: Start with warm-up predictions using familiar objects (coins, dice). Then introduce the beads with initial cold observations (all green). Students will predict "stays green" or "turns blue when held." After verifying by holding, they think it's settled. That's when we spring the trap: introduce "grue-like" predicates. 

  The critical moment is when student groups must create rival hypotheses using a template like "Object is [predicate] if ______." They'll make variants like "grellow" (green when cold, yellow when warm) despite no yellow beads. The physical beads can't show yellow, creating cognitive dissonance. 

  For entrenchment, we'll note how often each predicate was used historically. But since all are new today, I'll need to explicitly add that "green/blue" has been used 40 times this semester in other contexts. The professor must emphasize this artificial history. 

  Predictable problems: Some groups will call rivals "cheating" without justification. Others might game tokens by betting minimally. The debrief must transform these frustrations into learning moments. 

  Materials list should be minimal: beads, containers, timers, scoreboards. Payoffs use tokens for low-stakes competition. Timeline needs strict 75-minute pacing with clear phases. 

  The hardest part is making entrenchment felt without real history. I'll suggest the professor fabricate usage records ("as you recall, we've used 'green' in 40 examples this term") and contrast with novel predicates. The physical bead flip helps but the conceptual jump requires careful narration. 

  Debrief should map activity moments directly to Hume and Goodman: initial projections = our inductive habit, rival hypotheses = underdetermination, frustration at "cheating" = lack of justification, token gaming = pragmatic surrender. Must avoid names like "Goodman" to keep it experiential. 

  Biggest risk is students dismissing rivals as silly. The professor should validate that reaction ("exactly! it feels artificial") then demand why "green" isn't equally arbitrary given the data. The sealed instruction cards for rivals prevent accusations of professor manipulation.
answer: |-
  Here’s a runnable classroom activity designed to make Hume’s problem viscerally tangible. It uses **thermochromic beads** (green when cool, blue when warm) to create an in-room "flip" moment, avoids named puzzles, and forces students to generate rival hypotheses.

  **Materials List** (total cost ~$15-$20):  
  - 100+ thermochromic beads (green-to-blue, 31°C/88°F transition temp; ~$10 online)  
  - 6 small opaque containers (e.g., film canisters)  
  - 6 digital timers/phones (for 30-second holds)  
  - 6 sealed envelopes (pre-made by you)  
  - Whiteboard + markers  
  - Token system: 60+ identical tokens (poker chips, buttons, or torn paper)  
  - Scoreboard (on whiteboard)  

  **Setup**:  
  1. Pre-chill beads in a fridge.  
  2. Place 10 chilled beads in each container. Seal 5 containers; leave 1 open for demos.  
  3. Put instructions for rival hypotheses into 6 sealed envelopes (see "Phase 3").  
  4. Pre-write a "Historical Usage Tally" on the board:  
     > `green/blue: used 40 times | grue/bleen: used 0 times | grellow/blorange: used 0 times`  

  ---

  ### **Activity Timeline (75 mins)**  

  #### **PHASE 1: Predictions with Familiar Objects (15 mins)**  
  - **Min 0-3**: *Intro*: "We’re playing a prediction game. Each team gets 10 tokens. Bet tokens to earn points. Highest score wins."  
  - **Min 3-10**: *Round 1 (Coin)*: Flip a coin hidden under a cup. Teams bet tokens on heads/tails. Reveal outcome. Record scores.  
  - **Min 10-15**: *Round 2 (Die)*: Roll a die hidden in a box. Teams bet on high (4-6) or low (1-3). Reveal outcome.  

  > **Why this works**: Students project past patterns (fair coin, balanced die). Low stakes feel safe.  

  ---

  #### **PHASE 2: Bead Prediction & the "Flip" (20 mins)**  
  - **Min 15-18**: *Introduce beads*: Show chilled beads (all green). "These beads change color based on temperature. Watch." Hold one for 30s until it turns blue.  
  - **Min 18-22**: *Round 3 (Beads)*:  
    - "Each team gets a container of chilled beads. Observe them *now*." (All see green beads).  
    - "Predict: After holding one for 30s, will it be **green** or **blue**? Bet your tokens."  
  - **Min 22-25**: *Test*: Teams hold one bead each for 30s. All beads turn blue.  
  - **Min 25-35**: *Scoring & Reactions*: Teams that bet on "blue" win double tokens. Ask: "Why did you bet that way?"  

  > **Why this works**: Students feel confident projecting "cold=green → warm=blue". The physical flip makes it real.  

  ---

  #### **PHASE 3: Manufacturing Rivals (25 mins)**  
  - **Min 35-40**: *Introduce challenge*:  
    > "New rule: Each team must invent a *rival* hypothesis that fits *all data so far* but predicts something different for future holds. Use this template:"  
    > *"A bead is **[NEW WORD]** if it is ________ when cool and ________ when warm."*  
  - **Min 40-45**: *Teams create rivals*:  
    - Hand each team a sealed envelope with instructions:  
      > *"1. Invent a new color word (e.g., 'grindle').  
      > 2. Define it using the template so it fits all past data.  
      > 3. Predict what happens on the next hold."*  
    - Examples they might create:  
      - *"Grellow": Green when cool, yellow when warm* (but beads turn blue).  
      - *"Blorple": Blue when cool, purple when warm* (but beads are green when cool).  
  - **Min 45-50**: *Teams share rivals*: Write definitions on the board. Verify they fit past data:  
    - "Cool beads were green? *Grellow* says cool=green → fits! Warm beads were blue? *Grellow* says warm=yellow → but we saw blue. Contradiction?"  
    - **CRITICAL MOVE**: Point out: "The *definition* of *grellow* fits the past (green when cool). Only its *future prediction* differs."  
  - **Min 50-60**: *Round 4 (Bet on rivals)*:  
    - Teams bet tokens on their own rival or others’ hypotheses for the next hold.  
    - Hold a new bead: It turns blue (not yellow/purple/etc.). Only "blue" wins.  

  > **Why this works**: Students *build* the underdetermination. Seeing their own "grellow" fail while fitting past data creates cognitive dissonance.  

  ---

  #### **PHASE 4: The "Entrenchment" Gambit (10 mins)**  
  - **Min 60-65**: Point to the "Historical Usage Tally" on the board:  
    > *"Why do we all prefer ‘green/blue’? Is it because we’ve used it 40 times this term, while ‘grue/bleen’ was never used?"*  
  - Challenge teams: **"Justify betting on ‘green/blue’ over ‘grellow’ *without* saying it’s ‘real’ or ‘natural’. What’s different besides past usage?"**  
  - **Min 65-70**: Let groups struggle. Record attempts. Likely answers:  
    - *"It’s simpler!"* → "But is *grellow* more complex? It’s the same template."  
    - *"It matches the bead!"* → "But before holding, both fit the data."  

  ---

  #### **Debrief (5 mins)**  
  Map the experience directly:  
  - *"When you bet on the coin/die/beads, you projected past patterns. That’s (a): we *can’t help* projecting."*  
  - *"Your rivals *grellow/blorple* fit all past data but failed. That’s (b): data doesn’t pick the rule."*  
  - *"You couldn’t justify preferring ‘green/blue’ without appealing to habit or past use. That’s (c): what feels ‘natural’ is about *us*, not the world."*  
  - **Key line**: *"When you said ‘That’s cheating!’ about *grellow*—what rule was it breaking? The only rule you had was your own projection."*  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **"Rivals are ad hoc!" as a knockdown**:  
     - *Lean into it*: "Why is *grellow* ‘ad hoc’ but ‘green/blue’ isn’t? What did the bead do *before* the hold to prove you right?"  
  2. **Gaming tokens**:  
     - Some teams will bet minimally to "survive." Use: "Notice Team 4 bet safe—they *pragmatically surrendered* because they felt the squeeze."  
  3. **"But beads *can’t* turn yellow!"**:  
     - *Use it*: "True! But your *grellow* definition didn’t assume that. It just said ‘if warm, then yellow’—and the data didn’t forbid it."  

  ### **The Unreproducible Part: Entrenchment**  
  You’re right—**the asymmetry can’t be felt** because all predicates are new in the room.  
  - **Workaround**: Hammer the "Historical Usage Tally" as a *prop* for social habit. Say:  
    > *"In this room, ‘green/blue’ feels new. But imagine you’ve said ‘green’ 40 times this term. That habit *feels* like a rock to stand on—even if it’s just sand."*  
  - **What you must supply**: The visceral weight of entrenchment via narrative:  
    > *"When you said ‘grellow is made up!’, you echoed 400 years of science privileging ‘green’. But at the first hold, both were equally made up."*  

  ### **Why This Works**  
  - The **physical bead flip** makes underdetermination undeniable.  
  - **Students generate rivals**—they can’t dismiss them as "teacher’s tricks."  
  - **Tokens + competition** force engagement.  
  - You **never say "Hume" or "grue"**—they *live* the problem.  

  Run it tight, let the beads do the talking, and they’ll feel the void under their feet.
