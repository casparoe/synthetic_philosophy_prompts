prompt: |-
  I've spent a lot of time over the past few years thinking about when an action is morally required and when it's just especially good — the kind of thing we admire but don't think someone has failed at if they don't do it. I've kept a running list of cases and my gut reactions to them, and I'm trying to figure out whether there's a single principle behind my judgments or whether I'm just inconsistent. I'd like you to help me work through this.

  Here are the cases and my verdicts:

  1. **The pond.** A child is drowning in a shallow pond. You can wade in and save them, but it will ruin your suit. Verdict: you have a duty to save the child. This isn't heroic; it's basic.

  2. **The kidney.** You learn you're a tissue match for a stranger who will die without a kidney transplant. The surgery carries real risks and requires weeks of recovery. Verdict: donating would be supererogatory — deeply admirable, but not something you've failed at if you don't do it.

  3. **The ten percent.** You earn a comfortable salary in a wealthy country. You could give ten percent of your income to organizations that reliably save lives in very poor countries — bed nets, deworming, that sort of thing. Verdict: I cannot settle on one. Some days it feels like a duty, some days it feels supererogatory. This is the case that bothers me most.

  4. **The 911 call.** You witness a car crash. Calling 911 costs you nothing. Verdict: duty, obviously.

  5. **The grenade.** A soldier throws themselves onto a live grenade to absorb the blast and save their squad. Verdict: supererogatory. No one is required to do this.

  6. **The lonely neighbor.** Your elderly neighbor has no family nearby and is clearly lonely. You could visit for an hour each week. It's not an emergency and the cost is modest but ongoing. Verdict: supererogatory, though I'd think less of someone who never did it.

  7. **The doctor after hours.** A doctor at a rural clinic has a patient who will deteriorate badly unless someone stays three hours past the end of the shift to stabilize them. No one else is available. Verdict: duty. It comes with the role.

  8. **The mugging.** You're walking home at night and see someone being attacked. Calling the police is a duty, but physically intervening would put you at serious risk of injury. Verdict: intervening is supererogatory.

  9. **The life's work.** Someone spends their entire career working in disaster relief, living modestly and taking real risks, for decades. Verdict: the whole shape of the life feels supererogatory. But I'm not sure why it feels different from a whole life of doing many small duties — if each individual act were a duty, would the whole life still be supererogatory? Or does the fact that it feels supererogatory mean I don't really think the individual acts are duties?

  What I'm stuck on is this: cases 1 and 8 both involve helping a stranger at some physical cost to yourself, but one feels like a duty and the other feels supererogatory. You might say the difference is the level of risk — but then case 2 involves serious risk and feels supererogatory, while case 7 involves no physical risk and feels like a duty because of the role. And case 3 involves no physical risk at all, yet I can't decide. So I suspect I'm using at least two or three different factors — magnitude of sacrifice, immediacy of the need, whether you have a special role, whether you're the only one who can help — but I can't state how they combine.

  What I'm asking for: Is there a principle, or a small set of principles, that captures most of these verdicts? State it as precisely as you can. Tell me which of my verdicts it preserves and which it overturns. Tell me what it says about case 3 — the ten percent — and about case 9. And if you have to overturn some of my verdicts, tell me which ones and why I should let them go. I'd also like you to test your principle against a case I haven't listed — one that might reveal a weakness in it.

  Please think very carefully before answering, and respond in the style of an expert moral philosopher working through the problem step by step. I'm less interested in a label for the view than in seeing the reasoning laid out clearly.
reasoning: |-
  Okay, the user is grappling with the boundary between moral duties and supererogatory acts—those praiseworthy but not obligatory. They've compiled nine nuanced cases with intuitive verdicts but feel stuck on inconsistencies, especially regarding charitable giving (case 3) and lifelong sacrifice (case 9). Their frustration is palpable: they want coherence, not just labels.

  Hmm, their examples cluster around five factors: cost (physical/psychological/opportunity), role-responsibility, immediacy, capacity (can only you help?), and gravity of harm. But these interact messily—e.g., the pond case (low cost, high immediacy) feels obligatory, while the kidney (high cost, no immediacy) doesn’t. The doctor case leans on role even with high cost, but the soldier’s grenade sacrifice (extreme cost) exceeds duty. 

  Ah, the tension in case 3 (10% income) is revealing. If harm-prevention is a core duty, why does consistent giving feel ambiguously obligatory? Probably because the sacrifice—while monetarily quantifiable—is psychologically diffuse (no single life hangs on it) and structurally distant (mediated by charities). Yet denying any duty here risks absurdity: if everyone gives nothing, many die preventable deaths. So perhaps duty scales with capacity? But how?

  The user’s struggle with case 9 (life’s work) cuts deeper. If each small act in disaster relief is merely supererogatory, does aggregating them create a moral "debt"? Or does sustained sacrifice inherently transcend duty? This hints that supererogation isn’t just about individual acts but about moral ambitions exceeding baseline demands.

  Testing my proposed principle: "Prevent serious harm when cost is moderate and you’re uniquely positioned." It captures cases 1,4,6,7,8 well but strains at case 2 (kidney). Moderate cost? Surgery/recovery seem beyond moderate—yet if "moderate" includes life-altering sacrifice for dire need, we risk demanding too much. Maybe "non-catastrophic" cost is better? But then case 3 becomes a duty—which troubles the user. Alternatively, could role modify cost thresholds? The doctor (case 7) absorbs high cost because of professional duty; civilians lack that framework for organs or income. 

  For case 3, the principle nudges toward duty—if 10% isn’t catastrophic for a comfortable earner, and harm is severe, why isn’t it obligatory? The user’s ambivalence might stem from fairness: why me when others could help? But uniqueness isn’t about literal exclusivity ("only I can") but capacity without excessive sacrifice. Still, demanding 10% from all affluent people feels… culturally alien. Is that a flaw in the principle or in social norms? 

  Case 9 challenges act vs. life aggregation. If each disaster intervention is a duty when costs are moderate per instance, the life isn’t supererogatory—it’s consistent duty-fulfillment. But the user senses heroism in the totality. Perhaps supererogation emerges when someone adopts burdens beyond what their specific roles or circumstances demand—volunteering for perpetual "frontline" moral labor. 

  A hard test case: You’re hiking and see two stranded climbers. Saving one requires a 2-hour detour; saving both requires a 12-hour perilous trek. Duty to save one? Supererogatory to save both? My principle says yes—if saving one has moderate cost, it’s obligatory; saving both exceeds moderate cost, so supererogatory. But if you can only attempt both (no partial save), is attempting it a duty? Then cost becomes catastrophic—so no. Messy, but the principle holds. 

  Ultimately, the user might need to accept that "moderate cost" is context-dependent. Their kidney verdict (supererogatory) may stand because organ loss is life-altering, but charitable giving could be framed as a duty scaled to privilege. The loneliness of case 6? Supererogatory because harm isn’t severe—though relational neglect might compound. I’d urge them to refine "moderate" as "not undermining core life projects" and "severe harm" as "threats to survival/basic dignity." That makes case 3 a duty for the affluent—a demanding but coherent conclusion.
answer: |-
  I'll approach this systematically, as requested. Your cases reveal a sophisticated moral intuition grappling with the boundary between duty and supererogation. Let's extract principles that best preserve your core judgments while identifying tensions and proposing resolutions.

  ### Proposed Principle
  **The Moderate Sacrifice Principle (MSP):**  
  *You have a moral duty to prevent serious harm to others when:  
  (a) The harm is severe and imminent;  
  (b) You can prevent it at a moderate cost to yourself;  
  (c) You are uniquely or particularly positioned to help; and  
  (d) The action doesn't violate stronger obligations.*  
  **Supererogatory acts** are those that either:  
  (i) Involve significant/sacrificial cost beyond "moderate," or  
  (ii) Address non-imminent harms where alternatives exist, even if cost is moderate.

  **Key Definitions:**  
  - **Moderate cost:** Does not threaten your life, core relationships, health, or fundamental life projects. Context-dependent (e.g., financial "moderation" scales with wealth).  
  - **Severe harm:** Death, grievous injury, or profound suffering.  
  - **Uniquely positioned:** No equally effective alternative agents are reasonably available.  
  - **Role duties:** Professional/social roles can lower the cost threshold for duty (e.g., doctors).  

  ---

  ### Evaluation of Your Cases
  | Case          | Your Verdict     | MSP Verdict       | Analysis |  
  |---------------|------------------|-------------------|----------|  
  | 1. Pond       | Duty             | **Duty**          | Low cost (ruined suit), severe/imminent harm, no alternatives. *Cost is moderate.* |  
  | 2. Kidney     | Supererogatory   | **Supererogatory**| High cost (surgery/recovery risks); exceeds moderate threshold. |  
  | 3. 10% Income | Ambivalent       | **Duty**          | Cost is moderate (doesn't undermine wellbeing for affluent earners); harm severe (lives saved). *Uniqueness diluted but you're causally effective.* |  
  | 4. 911 Call   | Duty             | **Duty**          | Negligible cost, severe/imminent harm. *Meets all criteria easily.* |  
  | 5. Grenade    | Supererogatory   | **Supererogatory**| Extreme cost (certain death). Far exceeds moderate sacrifice. |  
  | 6. Lonely Neighbor | Supererogatory | **Supererogatory**| Harm not severe (loneliness ≠ survival threat), alternatives possible. *Admirable but not obligatory.* |  
  | 7. Doctor     | Duty             | **Duty**          | Role lowers cost threshold. Harm severe, cost moderate (3 hours). *Professional duty intensifies obligation.* |  
  | 8. Mugging    | Intervene supererogatory | **Supererogatory**| Physical intervention: high risk (serious injury) → exceeds moderate cost. Calling 911 remains duty. |  
  | 9. Life’s Work| Supererogatory   | **Supererogatory**| *Aggregate* cost is catastrophic (lifetime sacrifice). Individual acts may sometimes be duties, but the *scale* transcends obligation. |  

  ---

  ### Key Tensions Resolved
  1. **Pond vs. Kidney (Cases 1 & 2):**  
     - MSP preserves your verdicts: Pond cost is *moderate* (monetary loss); kidney cost is *immoderate* (health risk, irreversible bodily sacrifice).  
     - **Why risk isn't the sole factor:** Doctor (Case 7) assumes professional risk as duty due to role. MSP incorporates cost + role.

  2. **10% Income (Case 3):**  
     - MSP classifies this as **duty**. Rationale:  
       - Harm is severe (preventable deaths), you're effective (aid works).  
       - Cost is moderate for comfortable earners (10% doesn't threaten basic wellbeing).  
       - **Your ambivalence explained:** Humans discount statistical lives vs. identifiable victims. MSP overrules this bias.  
     - *If this unsettles you:* Consider "moderate" as relative. For a high earner, 10% may be duty; for someone barely solvent, it might be supererogatory.

  3. **Life’s Work (Case 9):**  
     - MSP verdict: **Supererogatory** because:  
       - While individual disaster relief acts *might* be duties (if costs are moderate per instance), the *cumulative sacrifice* (career-long risk, minimal pay) exceeds moderate cost.  
       - **Your intuition preserved:** Heroism emerges from sustained sacrifice beyond episodic duties.

  ---

  ### Overturned Verdicts & Why
  - **Case 3 (10% Income):** I classify as duty, contrary to your ambivalence.  
    **Why accept this?** Consistency demands it. If we accept pond-duty (low cost saves a life), then saving distant lives at low cost is analogous. Refusing this leads to the "**no difference thesis**" paradox: Your $1000 could save a life, but if everyone like you gave, thousands would live. Failing to give *is* failing a duty.  
  - **Case 6 (Lonely Neighbor):** Your "think less of someone" hints at *imperfect duty* (Kant). MSP agrees it's supererogatory, but social roles (e.g., being the *only* neighbor) could shift it toward duty.

  ---

  ### Testing the Principle: A New Case
  **The Factory Whistleblower:**  
  You discover your employer is dumping toxins that will cause ~5 deaths over 10 years. Reporting it would likely cost your job (you have no savings), but prevent the deaths. No one else can expose this.  

  - **MSP Analysis:**  
    - Severe harm (deaths), you're uniquely positioned.  
    - Cost: Job loss threatens livelihood → likely **immense** if it risks homelessness/hunger.  
    - **Verdict:** Supererogatory to report. Duty if you had savings/alternate income (moderate cost).  

  - **Weakness exposed:** "Moderate cost" is culturally relative. Is losing a job "moderate" in a strong social safety net? MSP needs contextual calibration but remains action-guiding.

  ---

  ### Conclusion
  **MSP explains 8/9 of your core verdicts** (only Case 3 adjusted) using three factors:  
  1. **Severity/Imminence of Harm** (e.g., pond vs. lonely neighbor)  
  2. **Cost Threshold** (moderate vs. immoderate sacrifice)  
  3. **Agency/Role** (uniqueness, professional duties)  

  **Why this works:**  
  - It avoids extreme demands (e.g., kidney donation) while requiring meaningful sacrifice (e.g., giving 10%).  
  - It accommodates role obligations without collapsing all morality into professional duties.  
  - It explains heroism (supererogation) as exceeding cost thresholds or addressing non-imminent harms.  

  **Final refinement:** Duty arises when **C ≤ M** (Cost ≤ Moderate threshold), where M scales with:  
  - Your resources (wealth/health)  
  - Proximity (physical or causal)  
  - Role responsibilities  

  This framework honors your intuitions while resolving inconsistencies through scalable obligations. If you reject the 10% duty, consider whether "moderate cost" should exclude *ongoing financial transfers*—but this risks arbitrariness. I advise embracing MSP as a coherent foundation.
