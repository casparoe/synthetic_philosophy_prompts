  I'm working a piece on how we're supposed to represent uncertainty when we don't actually have enough to settle on one nuber, and I've come around to thinking imprecise probabilities — giving an interval, or a whole set of possible credences, instead of a single value — are the honest move, and that the insistence on exactly one probability is mostly a habit. Before I write that up, I want to steelman the other side: what would genuinely count against them? Not the lazy why-not-just-pick-a-number objection, which I can wave off, but the real ones — where do the endpoints of the interval come from if picking is what we're trying to avoid, what actually happens when you update after new evdence, and whether the whole enterprise is just second-order Bayesian ignorance in different clothes. Sort what you give me by how much it should move me, from a known cost I can live with to a fatal flaw, and tell me straight whether the position can be qualified until nothing could ever count against it, and if so whether that's a problem.
