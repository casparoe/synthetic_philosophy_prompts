     - Etiological account: function is the effect that was selected for in the past (Wright, Millikan). Function fixed by evolutionary history.
     - Causal-role account: function is the current causal role in a larger system (Cummins). Function fixed by present contribution.

  2. On the 'new use' problem:
     - The problem: a trait is co-opted for a new use before selection has acted on that new use (e.g., feathers for thermoregulation then later for flight).
     - It challenges both accounts because the current role and selected history come apart.

  3. On malfunction:
     - Etiological account has an advantage: it can say a trait malfunctions when it fails to perform its proper function (selected effect). 
     - Causal-role account cannot explain malfunction because if a trait isn't playing a role, it doesn't have that function.

  Now, let's assess each part:

  1. Distinction:
