prompt: |-
  I'm a novelist, about halfway through a book set in a small fishing port, and I've built a lot of the plot around things that spread through the town the way people say ideas spread: a rumor about a drowning that nobody witnessed, a whistled tune that gets slightly misheard every time, a church collection ritual nobody alive can explain, a slogan the cannery stamps on its crates, a fish stew recipe, a superstition about not saying a certain name while offshore, a local insult, and a story about the lighthouse that gets longer every time its told.

  I've been reading up on memetics to help me structure all this, and I've hit a wall — I can't tell which of my spreaders actually earn the right to be called replicators and which ones I'm just dressing up in evolutionary language because it sounds good in a notebook.

  So here's what I want. Score each of the eight on a 0–10 scale for how gene-like it is as a replicator, where the score tracks four things at once: how discrete the item is, how much of it actually survives a round of transmission, whether it has a boundary you could point at, and whether the differences between its variants cause differences in how often they get passed on. Give me a ranked list with the numbers, plus a sentence or two each on what's driving the score.

  Then the part I actually care about. Where's the cutoff, if there is one? Below what score does calling something a meme stop buying me anything explanatory, and for the ones that fall under it, say whether a selection-story that doesn't assume faithful copying still predicts something about them — or whether all that's left is a metaphor I should just own up to.

  And flag any of the eight where you think my question is malformed: where the item isn't one thing that travels but something rebuilt from scratch each time, so that asking about fidelity is the wrong question in the first place. If you think that's most of them, say so, and tell me what I should be scoring instead.

  I know this is a live fight — the reconstructive objection to memes, the people who keep the population-level maths but ditch the tidy little units, the replicator-versus-interactor business. Don't referee it politely from the middle. Tell me how confident you are in the numbers you hand me, and single out the one placement you're least sure about and why.
reasoning: |-
  Okay, the user is a novelist working on a book set in a small fishing port, with a plot built around various elements that spread through the town. They've been studying memetics to structure these elements but are struggling to determine which ones truly qualify as replicators versus those just dressed in evolutionary language. They want each of their eight spreaders scored on a 0-10 scale based on four criteria: discreteness, survival of transmission, boundary, and differential fitness. Then they need a ranked list, an explanation of what drives each score, and insight into where the cutoff is for something being a meme. Additionally, they want to know if any items are malformed questions where fidelity isn't the right focus.

  First, I need to recall the core principles of memetics and the replicator concept. A replicator must have heredity, variation, and selection. The key debate revolves around high-fidelity copying versus reconstructive processes. For each item, I should assess how well it meets the four criteria. 

  Starting with the drowning rumor: It's a narrative, so details might change, but the core event (a drowning) persists. Discreteness is medium because people might focus on different aspects. Survival of transmission might be low if details shift. Boundary isn't clear. Differential fitness could exist if certain versions are more sensational. Score around 4.

  Next, the whistled tune: Melodies are discrete and boundaries are clear (start/end notes). Mishearing introduces variation, but the core structure often survives. Changes like wrong notes might affect catchiness, influencing spread. This seems a strong candidate. Score 7.

  Church collection ritual: Rituals have defined steps (boundary) and are discrete. Variation might occur in minor aspects, but the core survives. Differential fitness if deviations lead to abandonment. However, rituals rely more on reconstruction each time? Confidence not high. Score 6.

  Cannery slogan: Fixed text stamped on crates. Highly discrete, survives transmission perfectly via physical medium. Boundary clear. Variants unlikely unless changed intentionally. Differential fitness might be based on slogan appeal. Almost ideal meme. Score 9.

  Fish stew recipe: Ingredients and steps can vary. Discreteness medium—some elements core, others flexible. Transmission fidelity low as each cook adapts. Boundaries fuzzy. Differential fitness if tastier versions spread better. But is it a single replicator or multiple components? Score 5.

  Name superstition: Taboo with a specific name and context. Discrete and clear boundary. Core element (avoiding the name) survives well. Variations in reasoning might affect adherence. Strong replicator potential. Score 8.

  Local insult: Phrases can morph quickly. Discreteness low as words change. Survival of transmission poor—boundaries fluid. Differential fitness if some insults are catchier. But high mutation rate. Score 3.

  Lighthouse story: Narrative that expands. Core event might persist, but details grow. Low fidelity, high variation. Boundaries unclear. Fitness if dramatic versions are retold. But reconstructive—each telling rebuilds. Score 2.

  Now, ranking: Cannery slogan (9), name superstition (8), whistled tune (7), church ritual (6), recipe (5), rumor (4), insult (3), lighthouse story (2).

  Cutoff: Below 5, memetics offers little. Scores 5-6 might still have some selection without faithful copying. Below 5, it's metaphor or reconstruction. Items like recipe, rumor, insult, and lighthouse story have low fidelity and are likely reconstructed each time. For these, focus on attractors (cultural patterns that shape reconstruction) rather than replicators.

  Malformed questions: Lighthouse story, rumor, and insult are probably rebuilt each time. Recipe might be a set of attractors. Whistle tune and superstition have higher fidelity.

  Confidence: Highest in cannery slogan and name superstition. Least sure about church ritual—rituals might be more about performance than copying. Should score higher if seen as a sequence of actions.

  User's deeper needs: They want to apply memetics rigorously in their writing, avoiding superficial use. They need clarity on which elements can drive plot through evolutionary dynamics versus those that spread via reconstruction. Highlighting attractors for low-fidelity items could add depth. Also, identifying differential fitness helps create believable cultural evolution in the town.
answer: |-
  Here's your ranked list with scores, criteria breakdown, and a frank assessment of where memetics helps or hinders. I'll use a **bold** confidence marker for each score and flag malformed cases. The ranking is based on the **aggregate** score across the four criteria (Discreteness, Survival, Boundary, Differential Fitness).

  **Ranked List (High to Low Meme Potential):**

  1.  **Cannery Slogan (9/10):** **High Confidence.** *Discrete:* Fixed phrase. *Survival:* Near-perfect via physical stamping. *Boundary:* Clear (the stamped words). *Differential Fitness:* Catchy/meaningful slogans boost brand recall/crate visibility. **Driving Score:** Physical instantiation forces high fidelity; selection pressure from commercial utility is plausible. Almost textbook meme.

  2.  **Superstition (Don't Say The Name) (8/10):** **High Confidence.** *Discrete:* Specific forbidden word + context (offshore). *Survival:* Core prohibition survives well; rationales vary. *Boundary:* Clear (the taboo act/word). *Differential Fitness:* Fear of consequence reinforces adherence; "safer" variants spread. **Driving Score:** Powerful emotional trigger (fear) ensures core survival; variants rationalizing *why* it's bad compete based on plausibility/scariness.

  3.  **Whistled Tune (7/10):** **Medium Confidence.** *Discrete:* Melodic phrase. *Survival:* Core contour/rhythm often survives; notes drift. *Boundary:* Clear start/end (a musical phrase). *Differential Fitness:* Catchier/more distinctive variants are whistled more. **Driving Score:** Music's inherent structure provides scaffolding; mishearings create variants directly subject to selection based on auditory appeal/ease of whistling.

  4.  **Church Collection Ritual (6/10):** **Low Confidence (Least Sure).** *Discrete:* Sequence of actions/objects (plate, passing, words, placement). *Survival:* Core sequence survives; minor gestures/timing vary. *Boundary:* Defined by the ritual context (start/end of collection). *Differential Fitness:* Efficient/reverent variants might be copied; awkward ones dropped. **Driving Score:** Ritual formalism provides structure, but reliance on performance/perception introduces slippage. Is it one "ritual meme" or an assemblage? Confidence low because fidelity depends heavily on authority/enforcement; differential fitness might be weak if the action (giving) matters more than *how*.

  5.  **Fish Stew Recipe (5/10):** **Medium Confidence.** *Discrete:* List of ingredients/steps (but flexible). *Survival:* Core identity (fish stew) survives; specifics (herbs, thickener, fish type) vary wildly. *Boundary:* Fuzzy (is "Grandma's secret pinch" part of it?). *Differential Fitness:* Tastier/easier/cheaper variants might spread. **Driving Score:** Core concept persists, but it's a *schema* with slots (protein, liquid, veg, seasoning) filled variably. Selection acts on *outcomes* (taste) influencing *which schema* is recalled/applied, not perfect copying of details. Borderline meme.

  6.  **Drowning Rumor (4/10):** **Medium Confidence.** *Discrete:* Narrative core (Someone drowned). *Survival:* Core event survives poorly; details (who, how, why) mutate fast. *Boundary:* Very fuzzy (where does the rumor start/end?). *Differential Fitness:* More dramatic/plausible/salacious variants spread faster. **Driving Score:** Core concept has persistence, but it's highly reconstructive. Selection acts on narrative appeal, not faithful replication of a specific unit. Meme label is weak here.

  7.  **Local Insult (3/10):** **Medium Confidence.** *Discrete:* Specific phrase (initially). *Survival:* Low - phonetics drift easily ("cod-lobber" -> "clod-dobber"); meanings blur. *Boundary:* Fuzzy (Is the tone/context part of it?). *Differential Fitness:* Sharper/funnier/easier-to-say variants might catch on. **Driving Score:** Highly fluid phonetics and contextual dependence make it unstable. Selection acts, but on fleeting, morphing units. Poor replicator.

  8.  **Lighthouse Story (2/10):** **High Confidence.** *Discrete:* Narrative core (Lighthouse did X). *Survival:* Core identity survives; details/embellishments grow/churn constantly. *Boundary:* Extremely fuzzy. *Differential Fitness:* More epic/mysterious/emotional variants get retold. **Driving Score:** Classic example of a **reconstructive narrative**. The *core idea* (lighthouse story) persists, but each telling rebuilds it from cultural scraps and teller's flair. Fidelity is minimal; selection acts on the *act of telling an engaging story*, not on copying a specific narrative unit.

  **The Cutoff & Explanatory Power:**

  *   **Cutoff ~5/10:** Scores of **6+ (Whistled Tune, Superstition, Slogan, *maybe* Ritual)** can reasonably be analyzed as memes. Memetics (focusing on variant replication/selection) provides explanatory power for *why* certain forms dominate.
  *   **Scores 4-5 (Recipe, Rumor):** Calling them "memes" buys you little. **Selection without faithful copying still predicts patterns:** More functional (tasty recipe), attention-grabbing (dramatic rumor), or culturally resonant variants will be *reconstructed more often* or *influential in shaping future reconstructions*. Think "cultural selection on *attractors*" (thematic patterns that draw reconstruction) rather than replicators.
  *   **Scores <4 (Insult, Lighthouse Story):** Memetics is essentially **just a metaphor**. The explanatory power lies entirely in **cultural attraction theory**: Why do reconstructions *tend* towards certain forms? What cognitive biases (exaggeration, moralizing), emotional hooks (fear, wonder), or social functions (group bonding, status display) make *this kind* of insult or *this style* of tall tale compelling enough to be rebuilt repeatedly? Selection acts on the *success of the performance/act*, not on inherited units.

  **Malformed Questions (Rebuilt from Scratch):**

  1.  **Lighthouse Story (Flagged):** **Strongly Malformed.** Asking about the fidelity of "the story" is wrong. It's a *tradition of storytelling* where the *core theme* (lighthouse's role/mystery) acts as an attractor, but each performance generates a largely new narrative instance. Score it on the **strength/persistence of the core theme as an attractor**, not as a replicator.
  2.  **Drowning Rumor (Flagged):** **Partially Malformed.** Similar to the lighthouse story, but with a weaker core ("a drowning happened"). The *event* might be fixed, but the *narrative explaining it* is reconstructed each time based on gossip dynamics and pre-existing suspicions. Focus on **how the core event acts as a narrative seed and the attractors shaping reconstructions** (blame, mystery, tragedy).
  3.  **Local Insult (Flagged):** **Partially Malformed.** While a *category* of insult exists, specific phonemic strings are unstable. It's better seen as a **dynamic pool of potential insulting sounds/meanings shaped by phonemic attractors and social context** than discrete replicators. Fidelity per transmission is very low.
  4.  **Fish Stew Recipe (Potentially Flagged):** Borderline. The *schema* ("fish stew") is stable, but the *details* are highly reconstructive based on availability, taste, and memory. It might be one stable attractor (the schema) with highly variable components. Asking about the fidelity of "the recipe" as a whole is problematic.

  **The Live Fight & My Confidence:**

  *   **Referee Stance:** I lean heavily towards the **reconstructive/attractor critique**. High-fidelity copying of complex units like stories or rituals is the exception, not the rule. Much of culture is rebuilt on the fly using shared cognitive tools and biases. The population-level math (some variants become common) still works, but it's driven more by *convergence* onto attractive forms than by *descent* with modification of discrete units.
  *   **Confidence in Numbers:** Scores for **Slogan (9), Superstition (8), Lighthouse (2)** are high confidence. **Tune (7), Recipe (5), Rumor (4), Insult (3)** are medium. **Church Ritual (6)** is **low confidence** – it could easily be a 7 (if formalism dominates) or a 4 (if performance variation dominates). Rituals sit right on the fault line between replicator and reconstructed performance.
  *   **Least Sure Placement: Church Ritual (6/10). Why?** Is it a single rigid "meme complex" passed down? Or is it a loose framework where the *act* of collecting donations matters, and the specific actions are flexible performances rebuilt each Sunday based on habit and vague memory, with little active "selection" between variants beyond basic functionality? If authority figures strictly enforce the form, it's more replicator-like. If not, it's more attractor-like. **You need to decide how rigidly it's performed in your port.**

  **The Takeaway for Your Novel:**

  *   Use **memetics/replicators** rigorously for the **Slogan, Superstition, and Whistled Tune**. Their spread and evolution can be driven by fidelity and selection.
  *   For the **Recipe, Rumor, Insult, and Lighthouse Story**, embrace **cultural attraction and reconstruction**. Focus on *why* certain themes/forms are compelling enough to be constantly regenerated in those contexts. What psychological or social needs do they fulfill? How do they get distorted by the act of transmission itself (gossip, storytelling)?
  *   Wrestle with the **Church Ritual**. Is it a stable anchor in the town's life (higher replicator score)? Or is it a flexible practice showing subtle drift (lower score, more attractor)? This ambiguity could be a rich source of tension or observation.
  *   **Own the Metaphor for the Low Scorers:** Saying "the insult mutated" or "the story evolved" is fine shorthand, as long as you *show* the messy, reconstructive reality underneath in your narrative. The power lies in depicting *how* and *why* these things change as they move between people, not in pretending they are genes.

  This framework should help you harness the *explanatory* power of cultural evolution concepts without being shackled to the contested "meme" unit where it doesn't fit. Good luck with the novel!
