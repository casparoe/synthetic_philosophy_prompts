  On the text-only reading, the key is forcing admission that clauses like Article IV, Section 2 *required* federal enforcement of slavery. The theorist might retreat to "dormant clauses" or narrow readings. The follow-up should corner them with the 1793 Fugitive Slave Act - passed by the same Framers, proving contemporary understanding favored slavery. 

