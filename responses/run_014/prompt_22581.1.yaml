  The closer about falsifying evidence is vital. The user wants ammunition against constitutional originalism. I'll suggest the Corwin Amendment - an actual proposed amendment protecting slavery, endorsed by Lincoln to avert war. If the Constitution was anti-slavery, why wasn't this redundant? 

