answer: |-
  ### The Usurper's Due: A Sestina on Aquinas

  The throne is seized by force: behold the **tyrant**,  
  Who clutched the gemmed and sacred **crown**.  
  His rule is fear, enforced by his own **hand**;  
  He spits upon the ancient, binding **law**.  
  The realm, a bruised and broken **body**,  
  Starves for the lost, forgotten **good**.  

  The people ache, deprived of every **good**,  
  How long endure this grasping **tyrant**?  
  The stolen gold that weights his **crown**  
  Is rusted with the blood on his **hand**.  
  He grinds the noble, guiding **law**  
  To dust beneath the people’s **body**.  

  The nation writhes, a wounded **body**,  
  Craves justice like a primal **good**.  
  But who will end the reign, O **tyrant**?  
  The office fouled by that false **crown**  
  Demands a cleansing, righteous **hand**—  
  Yet not outside the shattered **law**!  

  Now mark the Doctor’s warning: **law**  
  Declares the health of the whole **body**  
  Must be preserved for the true **good**.  
  Though foul beyond all doubt, the **tyrant**  
  Wears still the shape of the **crown**—  
  It seals no right to the lone **hand**.  

  The blade that strikes requires a public **hand**;  
  The power lives in sovereign **law**,  
  Not vigilantes. See the **body**  
  As flesh a surgeon heals for **good**:  
  The head, though rotten as the **tyrant**,  
  Must fall by those who bear the **crown**!  

  The vacancy in the usurper’s **crown**  
  Does not empower the boldest **hand**.  
  The office, though defiled in **law**,  
  Stands as the head of the whole **body**.  
  Only when charged with the common **good**  
  May justice claim the fallen **tyrant**.  

  <u>Envoy</u>  
  The **crown** is void—yet not the private **hand**’s to claim.  
  True **law** must heal the ravaged **body**; hear its cry:  
  The **good** requires the public blade to end the **tyrant**.  

  ---

  ### Argumentative Migration of End-Words  
  - **Stanzas 1–3**: Words inhabit the tyrant’s frame: *crown* (stolen ornament), *hand* (tyrant’s grip/assassin’s impulse), *law* (perverted), *body* (suffering populace), *good* (denied).  
  - **Stanzas 4–6**: Words shift to the public frame: *crown* (office needing restoration), *hand* (authorized power), *law* (divine/public order), *body* (community requiring surgery), *good* (collective end).  
  - **Envoi**: Resolves the paradox: the tyrant’s illegitimacy (*crown* void) does not transfer the right to kill to the private *hand*; only public *law* may act for the *body*’s *good* against the *tyrant*.  

  > *Medievalist Note*:  
  > Aquinas distinguishes *tyrannus ex defectu tituli* (usurper, implied here) from *tyrannus ex parte exercitii* (lawful title, corrupt rule). The poem upholds his core argument: even against a usurper, private judgment cannot seize the right of the sword (*Summa Theologiae* II-II, Q.64, A.3). The "physician" analogy (stanza 4) directly echoes Aquinas. The tension—tyranny is evil, yet killing remains illicit for private persons—is preserved without doctrinal compromise.
