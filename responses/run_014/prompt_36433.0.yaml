prompt: |-
  I'm a PhD student in formal epistemology, about to sink serious time into the anthropics literature, and before I do I want to be clear on what would count as progress rather than one more position on the pile. Write me the desiderata for a theory of self-locating belief — the requirements any adequate account of credence in situations where you're uncertain about who you are, when it is, or which of several similar observers you happen to be has to meet. At a minimum, it should: give a determinate verdict on Sleeping Beauty's credence in the coin upon waking, plus an explanation of what, if anything, she learns at that moment; handle duplication cases, where two subjects share all memories and physical duplicates are created and placed in indistinguishable environments, and say whether the duplicates' credences should match an outside observer's; say how centered credences relate to ordinary uncentered credences — is a distribution over centered worlds just an intermediate representation, or does it do real work that can't be recovered from an objective chance function plus conditioning?; deliver some verdict on the doomsday argument and Bostrom's presumptuous philosopher rather than refusing the question; and cohere with diachronic norms like conditionalization and reflection in cases with no self-locating component, so the theory doesn't silently revise ordinary Bayesianism where ordinary Bayesianism already worked. For each requirement, give the motivating case or argument, and flag which you take to be genuine constraints versus shibboleths of particular camps — e.g., whether Dutch book or betting-quotient arguments should be allowed to settle Beauty's credence, and whether " Beauty learns nothing new" is a datum or a halfer's talking point. Then the part I most want: say whether some subset of these desiderata is jointly unsatisfiable — whether, given duplication, the doomsday cases, and the standard Sleeping Beauty dialectic, no consistent theory can satisfy all of them at once — because if so, the requirements list is itself a result, and the choice between halfism and thirdism is forced by which requirement we're willing to abandon. Keep the weight on the criteria and their motivations rather than on scoring existing views against them; I'll do the scorecard in my dissertation. Please keep it under 700 words.
reasoning: |-
  Okay, let me tackle this formal epistemology PhD student's request. They want desiderata for a theory of self-locating belief before diving into anthropics literature. The key is to outline requirements that would count as genuine progress.

  First, I need to recall the core challenges in self-locating uncertainty: Sleeping Beauty, duplication scenarios, centered vs uncentered credences, doomsday arguments, and coherence with standard Bayesian norms. The student specifically wants to know if these create joint unsatisfiability.

  For Sleeping Beauty, the main tension is between "no new information" intuition and betting behavior. The halfer position seems to violate Dutch book arguments, while thirders struggle with the intuition that Beauty learns nothing upon waking. This might be where the first crack appears.

  Duplication cases are crucial - they test whether subjective indistinguishability requires identical credences. If I create a perfect duplicate, should their credence about being the original be 1/2? And how does this relate to outside observers' probabilities? This seems fundamental to any theory of self-location.

  The centered credences question cuts deep - are these just representational tools or ontologically necessary? This connects to whether self-locating uncertainty is reducible to objective chances plus conditioning. The student will need this clarified for their framework.

  Doomsday and presumptuous philosopher cases test predictive power. Can a theory handle extreme population size uncertainty without collapsing? Bostrom's thought experiment really pressures anthropic probability theories.

  Diachronic coherence is non-negotiable in my view. Any adequate theory must reduce to standard conditionalization when self-locating elements are removed. This might be the firmest constraint.

  Now the critical part: identifying tensions. The Beauty/duplication/doomsday nexus seems problematic. If we accept duplication symmetry (credence 1/2 for being either copy), this pushes toward thirder-like positions. But then doomsday arguments become stronger, which many find counterintuitive. Meanwhile, halfer positions struggle with duplication cases and Dutch books. There might be no escape from choosing which intuition to abandon.

  I should also flag which requirements are substantive constraints versus field-specific shibboleths. For example, is "no new information" a genuine datum or just a halfer commitment? The betting arguments feel more universally compelling to me.

  The structure will be: list each desideratum with its motivating case, note tensions, then present the unsatisfiability result. The payoff is showing that the choice between halfing and thirding isn't arbitrary - it's forced by which constraint you prioritize.
answer: |-
  Here are the core desiderata for an adequate theory of self-locating belief, motivated by central puzzles. Key tensions, including potential joint unsatisfiability, are flagged.

  1.  **Determinate Verdict & Learning in Sleeping Beauty:**
      *   **Requirement:** Assign a unique rational credence for Beauty upon waking (Heads? Tails?) and explain what informational update (if any) occurs at waking.
      *   **Motivation:** The SB problem is the paradigmatic test bed. Does waking provide *new centered evidence* ("I am experiencing a waking now") altering her temporal self-location, or merely eliminate possibilities consistent with her Monday-night knowledge? Halfers (P=1/2) typically argue "no new *uncentered* info," while Thirders (P=1/3) cite the asymmetric awakening structure.
      *   **Status:** Constraint. Any theory must engage decisively. "Learns nothing new" is a *halfer commitment*, not an uncontested datum.

  2.  **Handling Duplication/Indistinguishability:**
      *   **Requirement:** Specify credences for duplicated observers (e.g., teleportation, brain copying) placed in indistinguishable environments. Crucially, state if their credences about *which one they are* (or external propositions) should match an outside observer's (e.g., the experimenter who knows the duplication happened).
      *   **Motivation:** Tests the core of self-locating uncertainty. If you and a perfect duplicate wake up in identical rooms, should your credence that you are the original be 1/2? Should it match the experimenter's 1/2? Or does indistinguishability warrant different credences?
      *   **Status:** Fundamental Constraint. Central to defining what self-location *is*.

  3.  **Relationship Between Centered and Uncentered Credences:**
      *   **Requirement:** Clarify the ontological/metaphysical status of centered propositions/credences. Are they merely representational tools for *epistemic* uncertainty reducible (in principle) to uncentered credences + objective chances + conditioning? Or do they represent a fundamental, irreducible type of uncertainty?
      *   **Motivation:** Addresses the theoretical foundation. If reducible, self-locating uncertainty might be "merely" a practical limitation. If irreducible, it challenges standard Bayesianism's completeness. Impacts how we model "being me now".
      *   **Status:** Deep Theoretical Constraint. Determines the theory's metaphysical commitments.

  4.  **Engagement with Predictive Anthropics (Doomsday/Presumptuous Philosopher):**
      *   **Requirement:** Deliver a verdict on arguments where observer index provides evidence about total population size/type (e.g., Doomsday: early birth suggests shorter human lifespan; Presumptuous: theory predicting 10^10 vs 10^20 observers).
      *   **Motivation:** Tests the theory's ability to handle *uncertainty about the reference class* and generate non-trivial predictions from indexical information. Refusing the question avoids a key application.
      *   **Status:** Application Constraint. A theory that renders such reasoning impossible or vacuous is inadequate for core anthropic problems.

  5.  **Diachronic Coherence with Standard Bayesianism:**
      *   **Requirement:** Reduce to standard (uncentered) Bayesian conditionalization, reflection, and other diachronic norms in scenarios *without* self-locating uncertainty. Must not silently revise standard norms where they uncontroversially apply.
      *   **Motivation:** Ensures the theory is a conservative extension. Prevents ad hoc modifications solely for indexical cases. Maintains consistency across epistemic contexts.
      *   **Status:** Core Constraint. Violating this severs the theory from established norms without justification.

  **Tensions and Potential Joint Unsatisfiability:**

  The most significant tension arises between desiderata driven by **symmetry/indistinguishability (2 & partly 1)** and **diachronic coherence with standard updating (5)**, particularly when combined with **predictive anthropics (4)**.

  *   **Duplication Symmetry (2)** strongly pushes towards credences of 1/n for "being copy i" in n indistinguishable situations. This naturally aligns with *Thirder* intuitions in SB (1 waking per Tails vs 1 per Heads, but 2 Tails wakings total → P(Heads)=1/3). It also dictates that duplicated observers have credence 1/2 about being the original, matching the outside view.
  *   **Standard Conditionalization (5)** and the **halfer "no new uncentered info" view (1)** seem incompatible with this strong symmetry requirement in SB. If Beauty learns nothing relevant to Heads/Tails upon waking (only that *a* waking is occurring, which she already knew would happen), P(Heads) *should* remain 1/2. But this clashes with the 1/3 dictated by indistinguishability applied to the awakening moments.
  *   **Predictive Anthropics (4)** exacerbates this: Strong symmetry/thirder views make the Doomsday Argument compelling and allow the Presumptuous Philosopher to confidently favor large universes based only on their existence. Halfer/less symmetry-based views often resist these conclusions. Accepting one set of verdicts typically forces rejection of the other.

  **Conclusion:** It appears **desiderata 2 (Duplication Symmetry) and 5 (Diachronic Coherence) + the halfer interpretation of 1 (No New Info) are jointly unsatisfiable within standard frameworks.** Accepting strong symmetry (for dups & awakenings) forces a break from strict conditioning on only *uncentered* evidence (pushing towards thirderism & affecting 4). Insisting on strict uncentered conditioning and "no new info" (halferism) requires rejecting the strong symmetry claim that duplicated observers *must* assign 1/2 (or Beauty 1/3) based solely on indistinguishability. **The choice between halfing and thirding is thus forced by prioritizing either Diachronic Coherence + "No New Uncentered Info" (Halfer) or Strong Indistinguishability Symmetry (Thirder).** The other desiderata help refine the implications of this core choice.
